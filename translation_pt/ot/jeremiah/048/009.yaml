base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: pt
  text: Deem uma asa a Moabe[a], pois ela certamente sairá voando[b]. Suas cidades ficarão desoladas, sem ninguém que habite nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deem uma flor — ou um adorno — a Moabe”. O substantivo hebraico צִיץ geralmente designa uma flor ou um ornamento; aqui, porém, o contexto da partida favorece a imagem de uma asa.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “saindo, ela sairá”, construção enfática que também pode ser traduzida por “certamente irá embora”. A expressão “sairá voando” mantém a ligação poética com a asa da frase anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Deem
  rationale: Imperativo plural de נתן; “deem” reproduz diretamente a convocação profética.
- source_word: צִיץ
  choice: asas
  rationale: Embora o substantivo esteja no singular e costume designar uma flor ou adorno, o contexto de partida no verso favorece uma imagem de voo. O plural “asas” exprime essa imagem de modo idiomático em português; a dificuldade lexical é preservada em nota.
- source_word: לְמוֹאָב
  choice: a Moabe
  rationale: A preposição ל marca aqui o destinatário; “dar asas a Moabe” é natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior e mantém o tom conciso da poesia profética.
- source_word: נָצֹא תֵּצֵא
  choice: ela certamente sairá voando
  rationale: A construção com infinitivo absoluto intensifica o verbo יצא, literalmente “sair”. “Sairá voando” conserva a ideia verbal básica e a relaciona à imagem precedente, enquanto “certamente” comunica a intensificação.
- source_word: וְעָרֶיהָ
  choice: Suas cidades
  rationale: Tradução direta da construção com sufixo feminino referente a Moabe.
- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: ficarão desoladas
  rationale: Expressa naturalmente em português o resultado de devastação indicado por שַׁמָּה com o verbo היה.
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  choice: sem ninguém que habite nelas
  rationale: Comunica claramente a completa ausência de moradores, sem reproduzir de modo artificial a construção hebraica.
