  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: pt
  text: Pois toda cabeça está rapada, e toda barba está cortada; em todas as mãos[a] há incisões, e em torno da cintura[b] há pano de saco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todos os braços”. O termo hebraico pode abranger as mãos e os braços marcados por cortes de luto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “lombos”; isto é, a região da cintura ou dos quadris, em torno da qual se vestia o pano de saco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do lamento descrito no contexto, preservando a força causal do hebraico em português natural.
- source_word: כָל רֹאשׁ קָרְחָה
  choice: toda cabeça está rapada
  rationale: קָרְחָה indica calvície ou raspagem da cabeça. No contexto dos sinais de luto, “está rapada” comunica com naturalidade o estado resultante sem tornar explícito quem realizou a ação.
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: e toda barba, cortada
  rationale: גְּרֻעָה, de גרע, expressa redução ou remoção. “Cortada” preserva a imagem de uma barba diminuída como sinal de luto, sem especificar se foi apenas aparada ou inteiramente removida.
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: em todas as mãos há incisões
  rationale: גְּדֻדֹת designa cortes ou incisões rituais ligados ao luto. “Incisões” mantém a força concreta da imagem; “mãos” traduz literalmente יָדַיִם, cuja abrangência pode incluir mãos e braços.
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: e sobre a cintura há pano de saco
  rationale: מָתְנַיִם se refere à região dos lombos, quadris ou cintura. “Cintura” é clara no português atual e preserva a imagem do pano de saco usado ao redor da parte central do corpo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A elipse de “está” antes de “cortada” evita repetição pesada sem obscurecer o sentido. “Pano de saco” mantém a expressão bíblica reconhecível e compreensível.
