  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: pt
  text: A alegria e o júbilo foram retirados da terra fértil[a] e da terra de Moabe; fiz cessar o vinho nos lagares. Ninguém pisará uvas com brados[b]; brado não será brado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “campo frutífero”. O hebraico karmel refere-se aqui a uma terra fértil e cultivada, não ao nome próprio Carmelo.
    reason: lexical_alternative
  - marker: b
    text: Este brado era o clamor associado à pisa das uvas e à celebração da colheita.
    reason: cultural_note
  - marker: c
    text: 'A frase final é elíptica no hebraico, literalmente: “brado, brado — não brado”. O esperado clamor alegre da vindima deixou de existir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: foram retirados
  rationale: O nifal de אסף pode indicar que algo foi recolhido e, assim, removido. No contexto do juízo, o sentido é que a alegria e o júbilo desapareceram; “foram retirados” comunica isso naturalmente, sem perder a ação passiva do hebraico.
- source_word: שִׂמְחָה וָגִיל
  choice: a alegria e o júbilo
  rationale: Os dois substantivos próximos em sentido são mantidos de modo distinto e natural, preservando a ênfase celebrativa do par hebraico.
- source_word: כַּרְמֶל
  choice: terra fértil
  rationale: Aqui כרמל é substantivo comum referente a terra fértil e cultivada, e não o nome próprio Carmelo. “Terra fértil” é claro, corrente e adequado ao contexto agrícola.
- source_word: אֶרֶץ מוֹאָב
  choice: a terra de Moabe
  rationale: Mantém explicitamente אֶרֶץ, indicando toda a extensão territorial do juízo.
- source_word: יַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: fiz cessar o vinho nos lagares
  rationale: Preserva a primeira pessoa do causativo הִשְׁבַּתִּי e emprega “lagares”, termo português tradicional e ainda inteligível para as instalações de prensagem.
- source_word: יִדְרֹךְ
  choice: pisará as uvas
  rationale: Embora o objeto esteja implícito no hebraico, o contexto dos lagares mostra que se trata de pisar uvas. A explicitação evita ambiguidade indevida em português.
- source_word: הֵידָד
  choice: grito
  rationale: O termo designa um brado forte, neste contexto associado à pisa das uvas. “Grito” mantém concisão, enquanto a nota explica sua função cultural.
- source_word: הֵידָד הֵידָד לֹא הֵידָד
  choice: ao som do grito; o grito não é grito
  rationale: A formulação conserva a repetição e o contraste elíptico do hebraico, sem transformar silenciosamente a expressão em uma interpretação mais específica.
theological_decisions:
- issue: Identidade do falante na primeira pessoa de הִשְׁבַּתִּי
  choice: 'Manter a primeira pessoa: “fiz cessar”'
  alternative: Identificar expressamente o SENHOR no corpo do versículo
  rationale: O contexto do oráculo aponta para a fala divina, mas o hebraico deste versículo não repete o nome do falante. A primeira pessoa preserva o texto sem acrescentar uma identificação explícita.
- issue: Sentido do grito final
  choice: 'Preservar o contraste elíptico: “o grito não é grito”'
  alternative: Explicar no texto que já não se trata de um grito alegre da vindima
  rationale: A frase hebraica é deliberadamente compacta e retórica. A tradução mantém essa tensão, deixando a explicação cultural e semântica para as notas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário agrícola claro. “Lagares” preserva a imagem bíblica tradicional sem arcaísmo excessivo. A ordem e a repetição da cláusula final mantêm a força retórica e a ambiguidade genuína do hebraico.
