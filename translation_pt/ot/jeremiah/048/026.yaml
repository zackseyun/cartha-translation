base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: pt
  text: Embriaguem-no, pois ele se engrandeceu contra Yahweh. Moabe se revolverá[a] no próprio vômito, e ele também se tornará motivo de riso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “baterá as mãos no próprio vômito”. O verbo hebraico pode indicar bater ou dar palmadas; no contexto da embriaguez e da humilhação, “se revolverá” expressa melhor a imagem, mas a leitura mais literal permanece possível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: Embriaguem-no
  rationale: O imperativo plural no hifil de שׁכר, com objeto masculino singular, ordena que Moabe seja embriagado como imagem do juízo. A formulação é direta e natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior. “Pois” mantém com clareza a relação causal e o tom profético.
- source_word: עַל יְהוָה
  choice: contra Yahweh
  rationale: Com הִגְדִּיל, a preposição עַל indica exaltação arrogante dirigida contra Yahweh.
- source_word: הִגְדִּיל
  choice: se engrandeceu
  rationale: Preserva a imagem do hifil de גדל e expressa que Moabe se fez grande em oposição arrogante a Yahweh, sem substituir a metáfora por uma interpretação abstrata.
- source_word: וְסָפַק
  choice: se revolverá
  rationale: No contexto do vômito e da embriaguez humilhante, comunica o movimento degradante sugerido pela cena. Como o verbo também pode ser entendido mais literalmente como bater ou dar palmadas, a alternativa é preservada em nota.
- source_word: בְּקִיאוֹ
  choice: no próprio vômito
  rationale: Mantém a imagem concreta de degradação e explicita naturalmente em português que o vômito é do próprio Moabe.
- source_word: וְהָיָה לִשְׂחֹק
  choice: se tornará motivo de riso
  rationale: Expressa o estado resultante de ser publicamente ridicularizado em linguagem corrente e digna.
- source_word: גַּם הוּא
  choice: também
  rationale: Conserva a ênfase de que Moabe igualmente será alvo de riso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Arrogância de Moabe contra Deus
  choice: se engrandeceu contra Yahweh
  alternative: agiu com arrogância contra Yahweh
  rationale: 'A opção escolhida mantém a metáfora verbal hebraica e sua tensão teológica: Moabe procura fazer-se grande em oposição ao próprio Yahweh.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O pronome masculino singular retoma Moabe como entidade coletiva. A construção mantém as imagens fortes do hebraico — embriaguez, vômito e escárnio — sem suavizá-las.
