  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: pt
  text: Portanto, eis que vêm dias — declara Yahweh — em que enviarei a ele os que trasfegam[a], e eles o trasfegarão[b]; esvaziarão os seus recipientes e despedaçarão os jarros deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro. Também pode ser entendido como “os que inclinam os recipientes” ou “os que fazem decantar”; o contexto de vinho, recipientes esvaziados e jarros quebrados favorece a ideia de pessoas que trasfegam.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles o farão vaguear”. O verbo hebraico admite essa compreensão, mas a imagem vinícola do contexto favorece “o trasfegarão”.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “os jarros deles”. Alguns entendem, pelo sentido, “os jarros dele”, referindo-se a Moabe; o texto hebraico recebido traz o sufixo plural “deles”.'
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Conserva a ligação conclusiva com a descrição anterior da segurança complacente de Moabe.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém o marcador de atenção e a força do anúncio profético em registro digno e compreensível.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de perto a fórmula profética hebraica, de modo natural em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula solene de pronunciamento profético e translitera o nome divino.
- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: enviarei contra ele
  rationale: Embora לְ indique literalmente direção, o contexto de juízo torna explícito em português o caráter hostil do envio.
- source_word: צֹעִים
  choice: os que o trasfegarão
  rationale: O termo é raro; no contexto vinícola iniciado no versículo anterior, designa mais provavelmente pessoas que transferem ou despejam vinho de um recipiente para outro. A formulação verbal é mais natural que o substantivo incomum 'trasfegadores'.
- source_word: וְצֵעֻהוּ
  choice: Eles o esvaziarão
  rationale: A imagem é a de retirar completamente o conteúdo de um recipiente; aplicada a Moabe, 'esvaziarão' é clara e mantém a metáfora, sem a estranheza de 'derramarão a ele'.
- source_word: וְכֵלָיו יָרִיקוּ
  choice: esvaziarão os seus recipientes
  rationale: O hifil de ריק expressa esvaziar, e 'recipientes' conserva a imagem ampla dos utensílios de armazenamento.
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: despedaçarão os seus jarros
  rationale: נבל pode indicar odre ou jarro; no quadro de recipientes de vinho, 'jarros' é claro. A nota registra que o sufixo do texto hebraico recebido é plural, literalmente 'deles'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração representa diretamente o nome próprio no texto hebraico e evita substituir silenciosamente o nome por um título.
- issue: Sentido da rara família lexical צעה neste contexto
  choice: trasfegar/esvaziar dentro da metáfora vinícola
  alternative: fazer vaguear ou exilar
  rationale: O versículo anterior fala de vinho não trasfegado, e as orações seguintes mencionam esvaziar recipientes e quebrar jarros; a imagem contextual favorece o sentido vinícola, enquanto a leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mas a progressão da metáfora — trasfegar, esvaziar e despedaçar os recipientes — foi preservada. Os travessões destacam naturalmente a fórmula profética.
