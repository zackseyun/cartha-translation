  text: וּ/מִשְׁפָּ֥ט בָּ֖א אֶל אֶ֣רֶץ הַ/מִּישֹׁ֑ר אֶל חֹל֥וֹן וְ/אֶל יַ֖הְצָ/ה וְ/עַל מופעת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/021.yaml
  text: And judgment has come upon the land of the plateau—upon Holon[a], and upon Jahzah[b], and upon Mephaath—
translation:
  language: pt
  text: E o juízo chegou à terra do planalto[a] — sobre Holom, sobre Jaza[b] e sobre Mefaate —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra da planície” ou “terra da meseta”. O termo hebraico se refere a uma região elevada e plana.
    reason: lexical_alternative
  - marker: b
    text: Jaza também é transliterada “Jaaz” em algumas traduções.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: E o juízo
  rationale: No contexto do oráculo contra Moabe, מִשְׁפָּט indica a sentença judicial posta em execução. “Juízo” preserva a dimensão jurídica e o sentido de calamidade decretada.
- source_word: בָּא
  choice: chegou
  rationale: O qatal apresenta o juízo com vividez como fato consumado; “chegou” conserva essa certeza profética sem explicitar uma interpretação temporal além do texto.
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: à terra do planalto
  rationale: מִישׁוֹר designa uma região elevada e relativamente plana. “Planalto” é geograficamente adequado ao território transjordânico e natural em português.
- source_word: חֹלֹון
  choice: Holom
  rationale: Nome de lugar transliterado em forma compatível com a fonologia e as convenções ortográficas do português.
- source_word: יַהְצָה
  choice: Jaza
  rationale: Transliteração portuguesa concisa do topônimo hebraico; a nota registra a forma alternativa tradicional.
- source_word: מופעת
  choice: Mefaate
  rationale: Topônimo transliterado segundo convenções portuguesas, refletindo a forma hebraica sem tentar traduzir o nome.
- source_word: אֶל ... וְאֶל ... וְעַל
  choice: sobre ... sobre ... e sobre
  rationale: Na enumeração, as preposições apresentam as localidades atingidas pelo juízo. A repetição de “sobre” mantém a cadência e torna clara a relação com “juízo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “sobre” preserva o ritmo da lista hebraica; o travessão mantém a frase aberta, como no contexto contínuo do oráculo.
