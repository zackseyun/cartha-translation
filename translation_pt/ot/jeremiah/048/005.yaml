base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
translation:
  language: pt
  text: Pois, pela subida de Luíte, sobem em pranto, chorando[a]; pois, na descida de Horonaim, ouviram o angustiante grito de destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o substantivo «pranto» para dar ênfase; literalmente: «com pranto sobe, pranto».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta parte é difícil. Alguns entendem a frase de modo mais literal como «os inimigos ouviram um grito de destruição»; outros a interpretam como «ouviram o angustiante grito de destruição».
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה
  choice: subida
  rationale: Mantém o sentido topográfico de um caminho ascendente e forma contraste natural com “descida” no segundo membro.
- source_word: הַלֻּחוֹת
  choice: Luíte
  rationale: É nome próprio de lugar no contexto; emprega-se a forma portuguesa tradicional.
- source_word: בִּבְכִי ... בֶּכִי
  choice: em pranto — em pranto
  rationale: Preserva a repetição enfática do substantivo hebraico sem perder a naturalidade e a dignidade em português.
- source_word: יַעֲלֶה
  choice: sobem
  rationale: Embora a forma hebraica seja singular, tem sentido impessoal ou coletivo no contexto e se refere aos fugitivos de Moabe.
- source_word: בְּמוֹרַד
  choice: na descida
  rationale: Conserva o valor topográfico e o contraste deliberado com “subida”.
- source_word: חוֹרֹנַיִם
  choice: Horonaim
  rationale: Nome próprio transliterado segundo a forma portuguesa corrente.
- source_word: צָרֵי
  choice: angustiante
  rationale: A forma hebraica é difícil; aqui é entendida como qualificando o grito, em harmonia com o contexto de aflição e ruína.
- source_word: צַעֲקַת
  choice: grito
  rationale: Expressa de modo claro e conciso um clamor forte.
- source_word: שֶׁבֶר
  choice: destruição
  rationale: No contexto profético de juízo, denota ruína ou colapso devastador.
- source_word: שָׁמֵעוּ
  choice: ouviram
  rationale: Reproduz o perfeito plural hebraico, deixando indefinido o sujeito coletivo, como no original.
