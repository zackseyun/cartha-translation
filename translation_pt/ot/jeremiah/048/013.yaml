  source_fidelity: A comparação e os referentes principais estão corretamente identificados. Contudo, «Camos» não é a forma portuguesa bíblica corrente para כְּמוֹשׁ; «Quemós» é preferível. Além disso, «será/foi envergonhado(a)» introduz uma passiva mais forte do que o hebraico Qal, que exprime vir a sentir vergonha/ficar decepcionado. «Envergonhar-se de» preserva de modo mais direto a construção hebraica e sua ambiguidade relacional.
  naturalness: O texto é claro e de registro adequado. A formulação «Betel, sua confiança» é concisa, natural em registro bíblico moderno e mais próxima da aposição hebraica do que a oração relativa «em quem confiava», que também pode sugerir uma referência pessoal.
  terminology: «Moabe», «casa de Israel» e «Betel» são adequados. Substitui-se «Camos» por «Quemós», forma estabelecida em português para o deus moabita.
  issues:
  - severity: medium
    issue: Nome próprio «Camos»
    rationale: A forma portuguesa bíblica mais reconhecível e mais próxima da tradição de transliteração de כְּמוֹשׁ é «Quemós». «Camos» não é a forma usual e pode dificultar a identificação do referente.
  - severity: low
    issue: Voz passiva em «será envergonhado» / «foi envergonhada»
    rationale: O hebraico usa o verbo בוש em Qal. Embora uma passiva resultativa possa comunicar o contexto, «se envergonhará/se envergonhou» reproduz mais diretamente o valor verbal sem sugerir desnecessariamente um agente que envergonha.
  - severity: low
    issue: Explicitação por oração relativa em «em quem confiava»
    rationale: A oração é compreensível, mas muda a aposição nominal hebraica e pode personificar Betel. «Betel, sua confiança» conserva a concisão, a ironia e o vínculo de posse do original.
  revised_text: E Moabe se envergonhará de Quemós[a], assim como a casa de Israel se envergonhou de Betel, sua confiança[b].
