base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: pt
  text: E Moabe se envergonhará de Quemós[a], assim como a casa de Israel se envergonhou de Betel, sua confiança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará envergonhado por causa de Quemós”. O hebraico diz literalmente que Moabe se envergonhará de Quemós; o sentido é que sua confiança nesse deus acabará em desonra.'
    reason: lexical_alternative
  - marker: b
    text: 'Betel era um santuário do reino do norte associado ao culto dos bezerros. Mais literalmente: “de Betel, sua confiança”; isto é, aquilo em que Israel confiava.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: será envergonhado
  rationale: O verbo בוש indica sofrer vergonha ou cair em desonra. A formulação comunica o resultado público do fracasso da confiança de Moabe, sem reduzi-lo a um sentimento interior.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome da nação em português.
- source_word: מִכְּמוֹשׁ
  choice: por causa de Camos
  rationale: A preposição מן depois de בוש pode indicar aquilo em relação ao qual se sofre vergonha. No contexto, Camos é o objeto de confiança cujo fracasso traz desonra a Moabe.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz naturalmente a comparação entre a futura vergonha de Moabe e a vergonha já sofrida por Israel.
- source_word: בֹּשׁוּ
  choice: foi envergonhada
  rationale: Mantém o paralelismo lexical com וּבֹשׁ e concorda naturalmente com o sujeito coletivo feminino 'a casa de Israel'.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a designação coletiva hebraica e sua força nacional e pactual.
- source_word: מִבֵּית אֵל
  choice: por causa de Betel
  rationale: Betel é o nome do centro de culto do reino do norte. A expressão liga a vergonha de Israel ao santuário em que depositava sua confiança.
- source_word: מִבְטֶחָם
  choice: em quem confiava
  rationale: O substantivo designa aquilo em que se confia. A oração relativa explicita em português corrente a relação entre Israel e Betel, preservando a ironia do texto.
theological_decisions:
- issue: Referente de Betel
  choice: Betel é entendido como o centro de culto do reino do norte no qual Israel confiava.
  alternative: '''casa de Deus'' como expressão nominal comum'
  rationale: O paralelo contrapõe a confiança de Moabe em Camos à confiança de Israel em Betel. Traduzir o nome literalmente como 'casa de Deus' apagaria a alusão histórica e poderia sugerir, de modo enganoso, confiança no Deus verdadeiro.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi mantida; a aposição final foi convertida em oração relativa para evitar em português a formulação pouco natural 'Betel, sua confiança'.
