  text: וְ/אִ֣ם ל֣וֹא הַ/שְּׂחֹ֗ק הָיָ֤ה לְ/ךָ֙ יִשְׂרָאֵ֔ל אִם בְּ/גַנָּבִ֖ים נמצאה כִּֽי מִ/דֵּ֧י דְבָרֶ֥י/ךָ בּ֖/וֹ תִּתְנוֹדָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: pt
  text: Israel não era objeto de zombaria para você? Acaso ele foi encontrado entre ladrões? Pois, sempre que você falava dele, balançava a cabeça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacudia-se”. O verbo hebraico pode indicar um movimento de oscilação ou agitação; aqui, provavelmente descreve um gesto de desprezo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: objeto de zombaria
  rationale: O substantivo indica riso em tom de escárnio. “Objeto de zombaria” comunica claramente a ideia de ridicularização, sem a possível conotação positiva de “motivo de riso”.
- source_word: הָיָה לְךָ
  choice: era ... para você
  rationale: Reproduz de modo natural a relação expressa por לְ, isto é, aquilo que Israel representava aos olhos de Moabe.
- source_word: אִם בְּגַנָּבִים נִמְצָאָה
  choice: Acaso ele foi encontrado entre ladrões?
  rationale: Mantém a pergunta retórica e a imagem de Israel como se tivesse sido surpreendido em companhia de criminosos. O masculino segue o gênero convencional de “Israel” em português.
- source_word: כִּי מִדֵּי
  choice: Pois, sempre que
  rationale: 'Expressa a ligação explicativa e o caráter repetido da ação: isso acontecia em cada ocasião em que Moabe mencionava Israel.'
- source_word: דְבָרֶיךָ בּוֹ
  choice: você falava dele
  rationale: Traduz naturalmente o idioma hebraico referente a falar a respeito de alguém, sem tornar explícita uma hostilidade apenas implícita no contexto.
- source_word: תִּתְנוֹדָד
  choice: balançava a cabeça
  rationale: O verbo descreve movimento oscilante ou agitado; no contexto de escárnio, a expressão portuguesa comunica de forma natural um gesto de desprezo, embora “cabeça” não esteja explícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com perguntas retóricas preservadas. Emprega “você” porque o discurso se dirige diretamente a Moabe, tratado no singular. A formulação evita acrescentar uma culpa criminal de Israel e mantém a ironia do original.
