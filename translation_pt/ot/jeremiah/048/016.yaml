  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: pt
  text: O desastre de Moabe está prestes a chegar, e sua calamidade vem muito depressa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: está prestes
  rationale: Expressa a iminência indicada pelo adjetivo predicativo, em português natural.
- source_word: אֵיד
  choice: desastre
  rationale: Comunica ruína ou infortúnio destrutivo e se ajusta ao contexto de juízo profético.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da nação.
- source_word: לָבוֹא
  choice: a chegar
  rationale: Preserva o infinitivo que especifica aquilo que está iminente, sem reproduzir uma construção pouco natural em português.
- source_word: רָעָתוֹ
  choice: sua calamidade
  rationale: Neste contexto, רָעָה designa uma desgraça ou calamidade, não maldade moral. O possessivo português mantém a referência a Moabe sem impor gênero à nação.
- source_word: מִהֲרָה
  choice: se aproxima depressa
  rationale: Transmite o movimento rápido da calamidade em linguagem corrente; o verbo é explicitado pela progressão paralela do verso.
- source_word: מְאֹד
  choice: muito
  rationale: Mantém a força intensificadora do hebraico sobre a rapidez.
