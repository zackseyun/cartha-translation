  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: pt
  text: Quem fugir do terror cairá na cova, e quem sair da cova será apanhado na armadilha; pois farei vir sobre ela, sobre Moabe, o ano do castigo deles[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ano da visitação deles” ou “o ano da prestação de contas deles”.
    reason: פְּקֻדָּה pode indicar visitação, intervenção para ajuste de contas ou castigo; a nota preserva essa amplitude lexical.
lexical_decisions:
- source_word: הניס
  choice: Quem fugir
  rationale: O particípio substantivado tem sentido genérico. “Quem fugir” é natural em português e preserva o caráter proverbial da frase.
- source_word: הפחד
  choice: do terror
  rationale: פַּחַד indica pavor ou terror, não apenas medo subjetivo, e se ajusta ao contexto de juízo inevitável.
- source_word: הפחת
  choice: na cova
  rationale: פַּחַת designa uma cova, especialmente uma cova usada como meio de captura. “Cova” distingue esta imagem da armadilha mencionada em seguida.
- source_word: והעלה מן הפחת
  choice: quem sair da cova
  rationale: O particípio substantivado descreve quem sobe para fora da cova. “Sair da cova” comunica o movimento com naturalidade, sem especificar indevidamente como ocorre.
- source_word: ילכד בפח
  choice: será apanhado na armadilha
  rationale: פַּח é uma armadilha ou laço. “Armadilha” mantém distinta a terceira imagem da sequência terror–cova–armadilha.
- source_word: כי אביא אליה אל מואב
  choice: pois farei vir sobre ela, sobre Moabe
  rationale: A formulação conserva o pronome feminino hebraico e a aposição que identifica seu referente como Moabe, além do sentido judicial de fazer algo sobrevir.
- source_word: שנת פקדתם
  choice: o ano do castigo deles
  rationale: No contexto de desastre inevitável, פְּקֻדָּה tem sentido punitivo. “Ano” preserva a referência ao tempo determinado, e “deles” mantém o sufixo plural do texto hebraico.
- source_word: נאם יהוה
  choice: declara Yahweh
  rationale: A expressão preserva a força solene da fórmula profética e translitera o nome divino יְהוָה como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de פְּקֻדָּה no oráculo de juízo
  choice: castigo
  alternative: visitação; prestação de contas
  rationale: O contexto imediato é claramente punitivo, por isso “castigo” expressa o sentido contextual. A amplitude lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A sequência de imagens foi mantida sem tentar reproduzir artificialmente o jogo sonoro hebraico entre פַּחַד, פַּחַת e פַּח. O marcador da nota foi colocado após “castigo deles”, termo ao qual a alternativa lexical efetivamente se refere.
