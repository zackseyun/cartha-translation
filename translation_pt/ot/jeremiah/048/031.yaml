  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
translation:
  language: pt
  text: Por isso, lamentarei por Moabe e clamarei por todo o Moabe; pelos homens de Quir-Heres, geme-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A última oração é difícil. Também pode ser traduzida: “pelos homens de Quir-Heres eu gemo” ou “ele geme pelos homens de Quir-Heres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: lamentarei
  rationale: O hifil de ילל expressa lamentação intensa e audível. “Lamentarei” é natural e digno em português; o contexto e o verbo seguinte preservam a força da cena.
- source_word: אֶזְעָק
  choice: clamarei
  rationale: זעק indica um grito forte, frequentemente motivado por aflição. “Clamarei” distingue este verbo do lamento da primeira oração.
- source_word: כֻּלֹּה
  choice: todo o Moabe
  rationale: Com לְמוֹאָב, indica a totalidade coletiva de Moabe. A construção é idiomática e clara em português.
- source_word: אֶל
  choice: pelos
  rationale: Embora אֶל costume significar “a/para”, neste contexto de lamento introduz aqueles por quem se geme. “Pelos” comunica essa relação sem alterar o objeto do pesar.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: os homens de Quir-Heres
  rationale: אַנְשֵׁי significa literalmente “homens de”. Mantém-se a referência masculina e translitera-se a forma do topônimo presente neste versículo.
- source_word: יֶהְגֶּה
  choice: geme-se
  rationale: הגה pode denotar murmúrio ou gemido baixo. O sujeito da forma verbal é incerto; a construção impessoal “geme-se” conserva essa indeterminação melhor que “eu gemo” ou “ele geme”.
theological_decisions:
- issue: Identidade do sujeito de יֶהְגֶּה
  choice: Preservar o sujeito indeterminado com “geme-se”
  alternative: “eu gemo” ou “ele geme”
  rationale: O texto consonantal apresenta terceira pessoa masculina singular, mas o referente não é explícito, e versões antigas e leituras contextuais divergem. A tradução não deve resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Moabe” e “Quir-Heres” seguem formas portuguesas reconhecíveis; a construção impessoal final preserva a ambiguidade sintática do hebraico.
