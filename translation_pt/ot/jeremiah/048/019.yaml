  text: אֶל דֶּ֛רֶךְ עִמְדִ֥י וְ/צַפִּ֖י יוֹשֶׁ֣בֶת עֲרוֹעֵ֑ר שַׁאֲלִי נָ֣ס וְ/נִמְלָ֔טָה אִמְרִ֖י מַה נִּֽהְיָֽתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: pt
  text: 'Fique junto à estrada e observe, ó moradora de Aroer. Pergunte ao homem que foge e à mulher que escapa: “O que aconteceu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמְדִי
  choice: Fique
  rationale: Imperativo feminino singular dirigido à cidade personificada como “moradora de Aroer”; em português, “fique junto à estrada” soa natural e preserva a ordem.
- source_word: וְצַפִּי
  choice: e observe
  rationale: O verbo צפה indica olhar atentamente, vigiar ou observar; “observe” comunica a ação sem acrescentar uma ideia militar ausente do contexto imediato.
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: ó moradora de Aroer
  rationale: O particípio feminino singular funciona como vocativo e concorda com os imperativos femininos. “Moradora” mantém a personificação da população ou cidade.
- source_word: נָס
  choice: ao homem que foge
  rationale: O particípio masculino singular substantivado pode ser expresso naturalmente como “o homem que foge”, tornando visível o contraste de gênero do hebraico.
- source_word: וְנִמְלָטָה
  choice: e à mulher que escapa
  rationale: A forma feminina singular substantivada é traduzida explicitamente como “a mulher que escapa”, preservando o paralelo masculino-feminino.
- source_word: מַה נִּהְיָתָה
  choice: O que aconteceu?
  rationale: Expressão idiomática que pergunta o que veio a ocorrer; esta formulação é direta, corrente e fiel.
