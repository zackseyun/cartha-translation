  yaml_path: translation/ot/jeremiah/048/024.yaml
  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: pt
  text: e contra Queriote, contra Bozra e contra todas as cidades da terra de Moabe, as distantes e as próximas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: e contra / contra
  rationale: No contexto do oráculo, a preposição indica os sucessivos alvos do juízo. A primeira ocorrência preserva a conjunção hebraica com «e contra»; nas seguintes, «contra» mantém a enumeração com naturalidade em português.
- source_word: קְרִיּוֹת
  choice: Queriote
  rationale: É um topônimo moabita, não o substantivo comum «cidades». Emprega-se a forma tradicional e legível em português.
- source_word: בָּצְרָה
  choice: Bozra
  rationale: Topônimo referente, neste contexto, a uma localidade moabita; a transliteração portuguesa evita traduzi-lo como substantivo comum.
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: todas as cidades da terra de Moabe
  rationale: Reproduz com clareza a cadeia construta hebraica e conserva «terra de Moabe».
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: as distantes e as próximas
  rationale: Os adjetivos femininos plurais retomam «cidades». A repetição dos artigos conserva a estrutura hebraica e expressa a abrangência total sem acrescentar interpretação.
