  text: נֻ֤דוּ ל/וֹ֙ כָּל סְבִיבָ֔י/ו וְ/כֹ֖ל יֹדְעֵ֣י שְׁמ֑/וֹ אִמְר֗וּ אֵיכָ֤ה נִשְׁבַּר֙ מַטֵּה עֹ֔ז מַקֵּ֖ל תִּפְאָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: pt
  text: 'Lamentem por ele[a],

    todos vocês ao redor dele;

    e todos os que conhecem seu nome[b], digam:


    “Como foi quebrado o cetro poderoso,

    o bastão glorioso![c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Balancem a cabeça por ele” ou “Compadeçam-se dele”; o verbo hebraico pode indicar pesar solidário, por vezes expresso por um gesto físico.
    reason: lexical_alternative
  - marker: b
    text: “Conhecem seu nome” também pode significar “conhecem sua fama” ou sua reputação.
    reason: lexical_alternative
  - marker: c
    text: Os termos hebraicos também podem ser traduzidos por “vara” ou “cajado”; a imagem provavelmente representa o poder e a honra de Moabe, agora quebrados.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ לֹו
  choice: Lamentem por ele
  rationale: O imperativo de נוד pode indicar a expressão solidária de pesar, às vezes acompanhada de um gesto físico. “Lamentem por ele” comunica naturalmente o sentido no contexto de uma elegia e mantém a personificação masculina de Moabe.
- source_word: כָּל סְבִיבָיו
  choice: todos vocês que vivem ao seu redor
  rationale: A expressão designa os povos ou habitantes circunvizinhos e tem força vocativa. A explicitação de “vocês que vivem” torna a referência clara em português sem reduzi-la necessariamente a vizinhos individuais.
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: e todos os que conhecem seu nome
  rationale: 'A tradução conserva a imagem hebraica e sua ambiguidade legítima: שֵׁם pode se referir tanto ao nome quanto à fama ou reputação.'
- source_word: אֵיכָה נִשְׁבַּר
  choice: Como foi quebrado
  rationale: “Como” mantém a forma exclamativa própria da lamentação, enquanto “foi quebrado” expressa o resultado do perfeito nifal sem identificar um agente não declarado.
- source_word: מַטֵּה עֹז
  choice: o cetro poderoso
  rationale: מַטֶּה pode ser vara, bastão ou cetro. Neste contexto de poder nacional e queda, “cetro” comunica adequadamente autoridade e força, e “poderoso” traduz עֹז de modo idiomático.
- source_word: מַקֵּל תִּפְאָרָה
  choice: o bastão glorioso
  rationale: “Bastão” preserva o paralelismo com “cetro” sem tornar os dois termos idênticos; “glorioso” expressa a faixa semântica de תִּפְאָרָה, que inclui glória, beleza e esplendor.
theological_decisions:
- issue: A identidade figurada do cetro e do bastão
  choice: Manter a metáfora sem inserir explicitamente “Moabe” na exclamação
  alternative: Explicitar que o cetro e o bastão representam o poder e a honra de Moabe
  rationale: O contexto aponta para Moabe personificado, mas o hebraico deixa a identificação na imagem poética. A tradução preserva essa forma em vez de converter a metáfora em explicação.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. A personificação masculina de Moabe foi preservada por “ele” e “seu”. A disposição em versos destaca o tom de lamento e o paralelismo hebraico.
