  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: pt
  text: Porque você confiou em suas obras[a] e em seus tesouros[b], você também será capturada. Camos[c] irá para o exílio[d], junto com seus sacerdotes e seus líderes[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em seus feitos» ou «naquilo que você produziu». O termo hebraico pode designar obras, atos ou coisas feitas.
    reason: lexical_alternative
  - marker: b
    text: Ou «em suas riquezas» ou «em seus depósitos».
    reason: lexical_alternative
  - marker: c
    text: Camos era o deus nacional de Moabe.
    reason: cultural_note
  - marker: d
    text: Ou «para o cativeiro».
    reason: lexical_alternative
  - marker: e
    text: Ou «príncipes», «governantes» ou «oficiais».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: Porque
  rationale: A combinação hebraica reforça a causa do juízo. Em português, «porque» expressa essa ligação causal com naturalidade, sem a redundância pouco idiomática de uma tradução palavra por palavra.
- source_word: בִּטְחֵךְ
  choice: você confiou
  rationale: O qal perfeito na segunda pessoa feminina apresenta a confiança de Moabe como fundamento do juízo. O pretérito perfeito é direto e natural.
- source_word: בְּמַעֲשַׂיִךְ
  choice: em suas obras
  rationale: מַעֲשֶׂה pode designar obras, feitos, atos ou aquilo que se produziu. «Obras» mantém a amplitude do termo sem especificar indevidamente realizações militares, econômicas ou religiosas.
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: e em seus tesouros
  rationale: אֹצָר pode indicar tesouro, riqueza acumulada, tesouraria ou depósito. «Tesouros» se ajusta ao paralelismo como objeto da confiança de Moabe.
- source_word: גַּם אַתְּ
  choice: também você
  rationale: Preserva a inclusão enfática de Moabe no juízo anunciado e mantém a ênfase explícita do pronome hebraico.
- source_word: תִּלָּכֵדִי
  choice: será capturada
  rationale: 'O nifal imperfeito de לכד tem sentido passivo: ser tomada ou capturada. O feminino torna visível a personificação feminina de Moabe presente no hebraico.'
- source_word: וְיָצָא
  choice: irá
  rationale: No encadeamento profético, a forma verbal aponta para o resultado futuro. «Irá para o exílio» transmite de modo idiomático a partida forçada, sem exigir o literalismo «sairá para».
- source_word: כמיש
  choice: Camos
  rationale: Emprega a forma tradicional portuguesa do nome da divindade moabita, mantendo o nome próprio e a personificação do texto.
- source_word: בַּגּוֹלָה
  choice: para o exílio
  rationale: A expressão denota remoção e deportação. «Para o exílio» comunica claramente o movimento forçado indicado no contexto.
- source_word: כֹּהֲנָיו
  choice: seus sacerdotes
  rationale: O sufixo masculino singular retoma Camos; o possessivo conserva essa relação.
- source_word: וְשָׂרָיו
  choice: e seus líderes
  rationale: שַׂר pode significar príncipe, governante, chefe ou alto oficial. «Líderes» é amplo, atual e evita precisar uma função não explicitada no texto.
- source_word: יַחַד
  choice: junto com
  rationale: Expressa que Camos, seus sacerdotes e seus líderes compartilham o mesmo destino de deportação.
theological_decisions:
- issue: Referente e condição de Camos
  choice: Camos é apresentado como a divindade nomeada de Moabe, personificada como alguém levado ao exílio com seus sacerdotes e líderes.
  alternative: Entender Camos como nome de lugar ou título dinástico.
  rationale: O sentido contextual mais direto é o deus moabita. A tradução mantém a imagem polêmica da derrota e deportação da divindade sem acrescentar uma explicação doutrinária ao texto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por «você» torna a interpelação direta; o particípio feminino «capturada» preserva a personificação feminina de Moabe no hebraico. A segunda frase evita uma coordenação excessivamente longa e mantém clara a deportação conjunta de Camos, sacerdotes e líderes.
