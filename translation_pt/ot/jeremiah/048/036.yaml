  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: pt
  text: Por isso, meu coração geme por Moabe como flautas; meu coração também geme como flautas pelos homens de Quir-Heres, porque pereceu a abundância que ele produziu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque pereceram os bens que ele adquiriu” ou “porque pereceu o excedente que ele fez”. A expressão hebraica é concisa; pode referir-se à abundância, aos recursos ou aos bens obtidos por ele.'
    reason: יִתְרַת pode designar excedente, abundância ou recursos; com עָשָׂה, a expressão admite as nuances de fazer, produzir ou obter. A nota explicita a dificuldade sem fixar a identidade do sujeito singular.
lexical_decisions:
- source_word: יֶהֱמֶה
  choice: geme
  rationale: Expressa o som lamentoso e profundo do coração, preservando a imagem sonora do hebraico.
- source_word: כַחֲלִלִים / כַחֲלִילִים
  choice: como flautas
  rationale: Mantém a comparação explícita com instrumentos de sopro associados aqui à lamentação.
- source_word: יִתְרַת עָשָׂה
  choice: o que ele acumulou
  rationale: יִתְרַת indica sobra, abundância ou bens excedentes; com עָשָׂה, a expressão pode referir-se ao que alguém produziu, obteve ou acumulou. 'Acumulou' comunica naturalmente a riqueza ajuntada sem eliminar a dificuldade textual.
- source_word: אָבָדוּ
  choice: se perdeu
  rationale: O verbo está no plural, embora o sujeito coletivo/abstrato precedente possa ser entendido em português no singular. A construção impessoal natural transmite a perda sem forçar concordância artificial.
theological_decisions:
- issue: Identidade do sujeito em עָשָׂה ('ele fez/acumulou')
  choice: ele acumulou
  alternative: eles acumularam / foi acumulado
  rationale: Preserva o singular explícito do verbo hebraico e a ambiguidade do referente, sem identificar dogmaticamente o sujeito.
translation_notes:
  register: Português moderno, digno e claro, com cadência poética. 'Quir-Heres' segue uma transliteração bíblica reconhecível; a repetição de 'meu coração' e 'como flautas' foi mantida por seu efeito retórico.
