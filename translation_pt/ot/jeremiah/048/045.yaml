  text: בְּ/צֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִ/כֹּ֣חַ נָסִ֑ים כִּֽי אֵ֞שׁ יָצָ֣א מֵ/חֶשְׁבּ֗וֹן וְ/לֶֽהָבָה֙ מִ/בֵּ֣ין סִיח֔וֹן וַ/תֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְ/קָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: pt
  text: À sombra de Hesbom, os fugitivos pararam, sem forças[a], pois de Hesbom saiu fogo, e uma chama, do meio de Seom[b]; ela devorou a extremidade de Moabe[c] e o alto da cabeça dos filhos do tumulto[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram parados por falta de força”. O perfeito hebraico pode ser traduzido no passado, e a expressão também pode indicar falta de força.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de entre Seom”. “Seom” pode referir-se, por metonímia, à cidade ou ao reino associado a ele.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “o canto de Moabe”; a imagem poética pode designar uma extremidade ou fronteira.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “o alto da cabeça dos barulhentos” / “dos filhos do alvoroço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵל חֶשְׁבּוֹן
  choice: À sombra de Hesbom
  rationale: Preserva a imagem concreta de צֵל e a relação locativa de בְּ, em português natural e poético.
- source_word: עָמְדוּ מִכֹּחַ נָסִים
  choice: os fugitivos pararam, sem forças
  rationale: נָסִים designa os que fogem; עָמְדוּ é aqui entendido como terem parado, enquanto מִכֹּחַ indica falta de força. A nota conserva a possibilidade de uma formulação mais estática.
- source_word: כִּי אֵשׁ יָצָא מֵחֶשְׁבּוֹן
  choice: pois de Hesbom saiu fogo
  rationale: כִּי introduz a explicação, e יצא mantém o movimento da imagem do fogo que procede de Hesbom.
- source_word: וְלֶהָבָה מִבֵּין סִיחוֹן
  choice: e uma chama, do meio de Seom
  rationale: Traduz לֶהָבָה literalmente e preserva מִבֵּין como 'do meio de'. Seom pode funcionar metonimicamente para a cidade ou o domínio ligado a ele, sem que isso seja imposto no texto.
- source_word: וַתֹּאכַל
  choice: ela devorou
  rationale: O feminino singular pode retomar 'chama'; 'devorou' conserva a personificação vigorosa e é idiomático para o fogo.
- source_word: פְּאַת מוֹאָב
  choice: a extremidade de Moabe
  rationale: פֵּאָה pode indicar canto, lado ou extremidade. 'Extremidade' comunica a imagem geográfica em português, enquanto a nota registra a alternativa mais formal.
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: e o alto da cabeça dos filhos do tumulto
  rationale: קָדְקֹד é o topo ou alto da cabeça; בְּנֵי שָׁאוֹן é mantido como a expressão poética e ambígua 'filhos do tumulto', sem identificar além do que o hebraico permite.
