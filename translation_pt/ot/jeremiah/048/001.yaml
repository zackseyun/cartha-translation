  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: pt
  text: 'A respeito de Moabe:


    Assim diz Yahweh dos Exércitos, o Deus de Israel:


    “აის de Nebo, pois foi devastada!

    Quiriataim foi humilhada e capturada.

    A fortaleza[b] foi humilhada e destroçada[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “Misgab”, se o termo for entendido como nome de lugar.
    reason: alternative_reading
  - marker: c
    text: Ou “ficou consternada” ou “aterrorizada”.
    reason: source_ambiguity
lexical_decisions:
- source_word: לְמוֹאָב
  choice: A respeito de Moabe
  rationale: A preposição לְ introduz o tema do oráculo sem expressar por si só toda a força adversativa; “a respeito de” preserva essa amplitude, enquanto o contexto comunica o juízo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino representado pelo Tetragrama e traduz צְבָאוֹת pelo título português claro e consagrado “dos Exércitos”.
- source_word: הוֹי
  choice: Ai de
  rationale: Expressa de modo natural tanto o lamento quanto a denúncia profética presentes na interjeição hebraica.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Transliteração corrente do nome do lugar.
- source_word: כִּי שֻׁדָּדָה
  choice: pois foi devastada
  rationale: O passivo de שׁדד indica devastação violenta, frequentemente ligada a saque; “devastada” comunica o resultado sem restringi-lo a simples pilhagem.
- source_word: הֹבִישָׁה
  choice: foi envergonhada
  rationale: O valor causativo descreve alguém ou algo levado à vergonha ou desonra, e não apenas um sentimento interior.
- source_word: נִלְכְּדָה
  choice: capturada
  rationale: No contexto militar, o nifal de לכד indica que a cidade foi tomada ou capturada.
- source_word: קִרְיָתָיִם
  choice: Quiriataim
  rationale: Transliteração adaptada à ortografia e pronúncia portuguesas.
- source_word: הַמִּשְׂגָּב
  choice: A fortaleza
  rationale: O artigo definido e o sentido lexical comum favorecem a leitura como substantivo (“lugar elevado, refúgio, fortaleza”), embora seja possível entendê-lo como topônimo.
- source_word: וָחָתָּה
  choice: e destroçada
  rationale: חתת pode descrever ser quebrado, arruinado ou ficar consternado. “Destroçada” se ajusta ao paralelismo concreto de devastação e captura, sem ocultar em nota a alternativa emocional.
theological_decisions:
- issue: Sentido da preposição לְ no cabeçalho do oráculo de juízo
  choice: A respeito de Moabe
  alternative: Contra Moabe
  rationale: Embora o conteúdo seja inequivocamente um anúncio de juízo, a preposição hebraica é mais ampla que uma formulação explicitamente adversativa. A opção principal evita intensificar o cabeçalho além do texto.
- issue: Identificação de הַמִּשְׂגָּב
  choice: 'Substantivo comum: “a fortaleza”'
  alternative: 'Topônimo: “Misgabe”'
  rationale: O artigo e o uso lexical comum apoiam a tradução descritiva, mas a possibilidade de um nome geográfico é genuína e foi preservada em nota.
- issue: Nuance de וָחָתָּה
  choice: 'Resultado concreto: “destroçada”'
  alternative: 'Estado emocional: “consternada” ou “aterrorizada”'
  rationale: O campo semântico de חתת admite tanto quebra/ruína quanto desânimo ou terror. O contexto de cidades devastadas e capturadas favorece o sentido concreto, mas não elimina a outra leitura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas toponímicas naturais em português. O paralelismo poético foi disposto em linhas breves. O nome divino foi transliterado como “Yahweh”, e o título צְבָאוֹת foi vertido de forma transparente como “dos Exércitos”.
