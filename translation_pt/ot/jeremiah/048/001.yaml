  timestamp: '2026-07-13T23:37:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução segue adequadamente o hebraico: o cabeçalho é preservado como tema do oráculo, as cidades e a sequência de devastação, vergonha e captura são mantidas. Há, porém, uma nota alternativa que introduz uma forma toponímica portuguesa pouco justificada para הַמִּשְׂגָּב.'
  naturalness: O português é claro, moderno e apropriado ao registro profético. “Foi envergonhada” é fiel, mas “foi humilhada” soa mais natural em português contemporâneo e conserva bem o sentido causativo de desonra pública.
  terminology: “Yahweh dos Exércitos”, “Moabe”, “Nebo” e “Quiriataim” são escolhas adequadas. Para a leitura alternativa como topônimo, “Misgabe” não é uma transliteração segura nem estabelecida; convém conservar “Misgab”, como forma diretamente reconhecível e alinhada ao audit trail.
  issues:
  - severity: medium
    issue: A nota b traz “Misgabe” como possível topônimo.
    rationale: A forma hebraica é הַמִּשְׂגָּב; se for tratada como topônimo, “Misgab” é a forma transliterada mais segura. “Misgabe” acrescenta uma terminação que não decorre claramente do nome e pode obscurecer a alternativa textual.
  - severity: low
    issue: “Foi envergonhada” é menos idiomático que “foi humilhada”.
    rationale: Ambas as opções comunicam a desonra causada expressa pelo hifil de בושׁ, mas “humilhada” tem maior naturalidade no português atual, sem reduzir a força do texto.
