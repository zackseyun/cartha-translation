  to: 'A respeito de Moabe:


    Assim diz Yahweh dos Exércitos, o Deus de Israel:


    “აის de Nebo, pois foi devastada!

    Quiriataim foi humilhada e capturada.

    A fortaleza[b] foi humilhada e destroçada[c].”'
  rationale: A revisão preserva as decisões exegéticas do rascunho e a ambiguidade de הַמִּשְׂגָּב e וָחָתָּה. Corrige a forma insegura “Misgabe” para “Misgab” e melhora a naturalidade de הֹבִישָׁה com “foi humilhada”.
