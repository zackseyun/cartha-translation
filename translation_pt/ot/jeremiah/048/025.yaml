source:
  edition: WLC
  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: pt
  text: O chifre de Moabe foi cortado[a], e seu braço foi quebrado — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “chifre” e “braço” são metáforas de força e poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: foi cortado
  rationale: O nifal de גדע expressa a ideia de ser cortado ou decepado. O pretérito perfeito apresenta como consumado o juízo anunciado profeticamente e combina com o paralelismo do verso.
- source_word: קֶרֶן
  choice: chifre
  rationale: Preserva a imagem hebraica concreta, na qual o chifre simboliza força e poder, sem substituí-la silenciosamente por sua interpretação.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome da nação em português bíblico.
- source_word: וּזְרֹעוֹ
  choice: e seu braço
  rationale: Mantém a imagem literal de זְרוֹעַ. O possessivo refere-se a Moabe personificado e evita impor gênero na formulação portuguesa.
- source_word: נִשְׁבָּרָה
  choice: foi quebrado
  rationale: O nifal de שבר indica que algo foi quebrado. A formulação preserva o paralelismo passivo e a metáfora do poder destruído.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética נְאֻם, enquanto apresenta diretamente o nome divino יהוה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. A forma “Yahweh” translitera o nome divino e evita substituí-lo por um título.
- issue: Interpretação das imagens “chifre” e “braço”
  choice: Preservar as duas metáforas no texto e explicá-las em nota
  alternative: Traduzir ambas diretamente como força ou poder
  rationale: As imagens paralelas pertencem à poesia profética e comunicam a perda da força de Moabe; preservá-las mantém a forma e a tensão expressiva do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com preservação do paralelismo poético. O travessão destaca naturalmente a fórmula profética final. A concordância masculina acompanha “chifre” e “braço” em português.
