  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: pt
  text: Terror, cova e armadilha vêm sobre você, habitante de Moabe[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta tríade — “terror, cova e armadilha” — retoma Isaías 24:17.
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: Terror
  rationale: Expressa medo avassalador no contexto de juízo e mantém a força da tríade profética.
- source_word: פַחַת
  choice: cova
  rationale: Designa uma cova usada como meio de captura; a forma concisa distingue este perigo da armadilha seguinte.
- source_word: פָח
  choice: armadilha
  rationale: Indica um dispositivo de captura; é uma palavra corrente e natural em português.
- source_word: עָלֶיךָ
  choice: vêm sobre você
  rationale: O hebraico diz literalmente «sobre você»; o verbo suprido torna clara e natural a ameaça de perigos que sobrevêm ao destinatário.
- source_word: יוֹשֵׁב מוֹאָב
  choice: habitante de Moabe
  rationale: Preserva o particípio singular usado como vocativo representativo para a população de Moabe.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e mantém o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; «Yahweh» preserva explicitamente o nome divino sem substituir o nome por um título.
- issue: Caráter da tríade de juízo
  choice: Três perigos coordenados que vêm sobre o habitante de Moabe
  alternative: Uma descrição figurada de um único perigo
  rationale: A repetição da conjunção hebraica coordena três termos distintos; a tradução preserva a tensão e a progressão sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A aliteração hebraica entre פַּחַד, פַחַת e פָח não pode ser reproduzida naturalmente sem sacrificar o sentido; preservou-se a tríade concisa. O singular «você» corresponde ao vocativo representativo hebraico.
