  rationale: A revisão corrige a atribuição indevida da ação às cidades, mantendo a concisão e a indeterminação do agente presentes no hebraico. Também ajusta a nota para documentar a dificuldade textual real e torna “para a matança” uma expressão portuguesa mais fiel ao sentido de destino de morte violenta.
