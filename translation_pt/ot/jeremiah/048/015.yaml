  text: שֻׁדַּ֤ד מוֹאָב֙ וְ/עָרֶ֣י/הָ עָלָ֔ה וּ/מִבְחַ֥ר בַּֽחוּרָ֖י/ו יָרְד֣וּ לַ/טָּ֑בַח נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: pt
  text: Moabe foi devastado, e contra suas cidades se subiu[a]; os melhores de seus jovens desceram para a matança — declara o Rei, cujo nome é Yahweh dos Exércitos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e suas cidades, subiu”. O hebraico é conciso e difícil; o sujeito de “subiu” não é expresso e pode referir-se a uma força atacante que avança contra as cidades de Moabe.
    reason: alternative_reading
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: foi devastado
  rationale: O pual de שׁדד expressa a condição de ter sido violentamente assolado ou saqueado. “Foi devastado” comunica o resultado passivo sem limitar o sentido ao saque.
- source_word: וְעָרֶיהָ עָלָה
  choice: e suas cidades subiram
  rationale: A construção hebraica é concisa e difícil. A tradução mantém literalmente o verbo עלה e preserva a ambiguidade, enquanto a nota registra a provável leitura militar com sujeito indefinido.
- source_word: מִבְחַר בַּחוּרָיו
  choice: os melhores dos seus jovens
  rationale: מִבְחַר indica a parte selecionada ou mais excelente; a formulação portuguesa é natural e mantém o sentido de elite entre os jovens de Moabe.
- source_word: יָרְדוּ לַטָּבַח
  choice: desceram para o matadouro
  rationale: Mantém a imagem espacial de ירד e traduz טבח como o lugar ou destino da matança, em linguagem clara e vívida.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e digno para a fórmula profética de pronunciamento divino.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: O contexto identifica o referente como Deus; a maiúscula sinaliza que se trata de um título divino.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino יְהוָה e expressa צְבָאוֹת em português moderno, mantendo a força marcial e cósmica do título.
- source_word: שְׁמוֹ
  choice: cujo nome é
  rationale: Reproduz naturalmente em português a oração nominal hebraica ligada ao título “o Rei”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה no título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” conserva o nome próprio, enquanto “dos Exércitos” torna צְבָאוֹת transparente ao leitor moderno.
- issue: Referência do sufixo em בַּחוּרָיו
  choice: seus jovens, referindo-se a Moabe
  alternative: os jovens dele
  rationale: Embora o sufixo seja formalmente masculino singular, ele concorda naturalmente com מוֹאָב, também masculino; o português “seus” conserva a referência sem impor uma personificação feminina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens de movimento do hebraico foram preservadas sempre que possível; a dificuldade de וְעָרֶיהָ עָלָה foi mantida no texto e esclarecida por nota.
