  text: רְדִ֤י מִ/כָּבוֹד֙ ישבי בַ/צָּמָ֔א יֹשֶׁ֖בֶת בַּת דִּיב֑וֹן כִּֽי שֹׁדֵ֤ד מוֹאָב֙ עָ֣לָה בָ֔/ךְ שִׁחֵ֖ת מִבְצָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: pt
  text: Desça da sua glória e sente-se com sede[a], ó habitante, filha de Dibom[b], pois o devastador de Moabe subiu contra você; ele destruiu as suas fortalezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sente-se em lugar seco” ou “habite em terreno ressequido”. A expressão hebraica pode indicar tanto a própria sede como a condição ou o lugar árido a que Dibom será reduzida.'
    reason: lexical_alternative
  - marker: b
    text: “Filha de Dibom” é uma personificação profética comum da cidade e de sua população como uma mulher.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי
  choice: Desça
  rationale: Imperativo feminino singular de ירד, dirigido à cidade personificada; preserva de modo natural o movimento descendente.
- source_word: מִכָּבוֹד
  choice: da sua glória
  rationale: כָּבוֹד pode indicar glória, honra ou esplendor; aqui representa a condição elevada da cidade, da qual ela será rebaixada.
- source_word: ישבי ... יֹשֶׁבֶת
  choice: ó habitante
  rationale: A forma vocativa e o particípio feminino dirigem-se à cidade personificada. A expressão mantém o chamamento sem repetir desnecessariamente o verbo habitar.
- source_word: בַצָּמָא
  choice: em terra sedenta
  rationale: צָמָא pode expressar sede ou aridez. 'Terra sedenta' é natural em português, preserva a imagem e deixa aberta a referência a uma condição ou lugar ressequido.
- source_word: בַּת דִּיבוֹן
  choice: filha de Dibom
  rationale: Mantém a personificação profética convencional da cidade e de sua população como mulher.
- source_word: שֹׁדֵד
  choice: o devastador
  rationale: O particípio designa aquele que devasta, saqueia ou destrói; 'devastador' se ajusta ao contexto militar e evita repetição imediata com o verbo seguinte.
- source_word: עָלָה בָךְ
  choice: subiu contra você
  rationale: Preserva o movimento expresso por עלה e o sentido militar da construção com ב, isto é, avançar contra alguém.
- source_word: שִׁחֵת
  choice: destruiu
  rationale: O verbo no piel comunica ruína ou destruição efetiva; 'destruiu' é claro e forte no contexto.
- source_word: מִבְצָרָיִךְ
  choice: as suas fortalezas
  rationale: מִבְצָר designa lugares fortificados ou baluartes; 'fortalezas' é corrente e adequado ao cenário militar.
