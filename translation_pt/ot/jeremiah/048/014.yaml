  text: אֵ֚יךְ תֹּֽאמְר֔וּ גִּבּוֹרִ֖ים אֲנָ֑חְנוּ וְ/אַנְשֵׁי חַ֖יִל לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/014.yaml
  text: How can you say[a], ‘We are mighty men, men of valor for battle’?”
translation:
  language: pt
  text: 'Como vocês podem dizer: “Somos guerreiros[a] e homens valentes para a batalha”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens poderosos”; a expressão seguinte também pode ser traduzida por “homens de valor”.'
    reason: Registra alternativas lexicais legítimas para גִּבּוֹרִים e אַנְשֵׁי חַיִל, cujos sentidos abrangem poder, força, valentia e capacidade militar.
lexical_decisions:
- source_word: אֵיךְ
  choice: Como vocês podem
  rationale: Introduz uma pergunta retórica de incredulidade e censura; “Como vocês podem” transmite essa força de modo natural.
- source_word: תֹּאמְרוּ
  choice: dizer
  rationale: O imperfeito qal na segunda pessoa do plural é expresso pelo infinitivo após “podem”, formando em português a pergunta retórica natural “Como vocês podem dizer”.
- source_word: גִּבּוֹרִים
  choice: guerreiros
  rationale: No contexto militar, designa homens fortes ou poderosos enquanto combatentes; “guerreiros” é claro, atual e se liga naturalmente à batalha.
- source_word: אֲנָחְנוּ
  choice: Somos
  rationale: Mantém a autoafirmação enfática do pronome independente hebraico em uma forma idiomática portuguesa.
- source_word: וְ/אַנְשֵׁי חַיִל
  choice: e homens valentes
  rationale: Preserva a coordenação e o sentido marcial de homens dotados de força, capacidade ou valor, sem reduzir חַיִל a uma única nuance abstrata.
- source_word: לַ/מִּלְחָמָה
  choice: para a batalha
  rationale: A preposição ל indica relação ou finalidade; “para a batalha” conserva de modo conciso a ideia de aptidão ou disposição para o combate.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A formulação conserva a pergunta retórica e o paralelismo militar do hebraico, evitando linguagem excessivamente arcaica.
