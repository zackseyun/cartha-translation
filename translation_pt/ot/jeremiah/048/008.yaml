reference: Jeremiah 48:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: pt
  text: O destruidor virá contra todas as cidades, e nenhuma delas escapará; o vale perecerá, e o planalto[a] será destruído, como Yahweh disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planície” ou “terra plana”. O termo hebraico designa terreno nivelado e, em Moabe, pode referir-se à região elevada do planalto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: o destruidor
  rationale: O particípio substantivado designa aquele que devasta ou saqueia; “destruidor” é claro, atual e adequado ao contexto de juízo.
- source_word: וְיָבֹא
  choice: virá
  rationale: O imperfeito prefixado no discurso profético tem sentido futuro e preditivo.
- source_word: אֶל כָּל עִיר
  choice: contra todas as cidades
  rationale: Embora אֶל denote literalmente movimento em direção a algo, a presença de um invasor torna explícito o sentido hostil; o singular distributivo hebraico é expresso naturalmente pelo plural em português.
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: e nenhuma delas escapará
  rationale: O singular hebraico retoma distributivamente cada cidade. “Nenhuma delas” evita repetição pesada sem diminuir a totalidade do juízo.
- source_word: הָעֵמֶק
  choice: o vale
  rationale: עֵמֶק normalmente designa um vale e aqui provavelmente se refere à região do vale em Moabe.
- source_word: וְאָבַד
  choice: perecerá
  rationale: אבד comunica ruína ou desaparecimento; “perecerá” conserva a força solene da linguagem profética.
- source_word: הַמִּישֹׁר
  choice: o planalto
  rationale: מִישׁוֹר é terra nivelada ou planície e, na geografia de Moabe, pode designar especificamente a região elevada e relativamente plana; “planalto” preserva esse contraste com o vale.
- source_word: וְנִשְׁמַד
  choice: será destruído
  rationale: O nifal de שׁמד indica sofrer destruição; a forma passiva portuguesa reproduz com precisão a construção hebraica.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: como Yahweh disse
  rationale: A expressão fundamenta a profecia na declaração divina e mantém o nome próprio יהוה de forma transparente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo profético foi preservado, e o marcador da nota foi colocado junto a “planalto”, termo ao qual a nota lexical efetivamente se refere.
