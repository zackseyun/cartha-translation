revisions:
- from: Eu conheço a sua ira[a] — declara Yahweh —, mas não é como ele diz; suas palavras vazias nada realizaram.
  to: Eu conheço a sua ira, declara Yahweh; mas não é assim; suas palavras vazias[a] nada realizaram.
  rationale: A revisão remove a explicitação interpretativa “como ele diz”, preservando o caráter elíptico de “não é assim”. Mantém “ira” e a leitura contextual “palavras vazias nada realizaram”, mas substitui a nota por alternativas que correspondem à dificuldade de בַּדָּיו לֹא כֵן עָשׂוּ sem atribuir indevidamente o sentido de arrogância a עֶבְרָתוֹ.
