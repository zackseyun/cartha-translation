  text: אֲנִ֤י יָדַ֨עְתִּי֙ נְאֻם יְהוָ֔ה עֶבְרָת֖/וֹ וְ/לֹא כֵ֑ן בַּדָּ֖י/ו לֹא כֵ֥ן עָשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: pt
  text: Eu conheço a sua ira, declara Yahweh; mas não é assim; suas palavras vazias[a] nada realizaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas mentiras não fizeram assim” ou “suas bravatas nada realizaram”. O hebraico da cláusula final é difícil e muito condensado.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Eu conheço
  rationale: O perfeito qal na declaração profética expressa o conhecimento firme e atual de Yahweh sobre Moabe, não apenas um ato passado de conhecer.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa explicitamente o nome divino.
- source_word: עֶבְרָתוֹ
  choice: a sua ira
  rationale: עֶבְרָה denota normalmente ira intensa ou furor; “ira” é natural, digna e suficientemente forte em português.
- source_word: וְלֹא כֵן
  choice: mas não é como ele diz
  rationale: O hebraico é breve, literalmente “e/não assim”. A formulação liga a negação às afirmações arrogantes de Moabe sem eliminar a dificuldade do contexto.
- source_word: בַּדָּיו
  choice: suas palavras vazias
  rationale: בדים pode indicar falsidades, conversa vazia ou afirmações presunçosas. A escolha conserva a ideia de discurso sem fundamento e se ajusta ao contexto do orgulho de Moabe.
- source_word: לֹא כֵן עָשׂוּ
  choice: nada realizaram
  rationale: A expressão comprimida significa literalmente “não fizeram assim”. Em referência às palavras vazias, comunica que elas não produziram o que alegavam, mantendo leitura fluente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança e segue a orientação do projeto sem importar preferência denominacional.
- issue: Sentido da cláusula difícil בַּדָּיו לֹא כֵן עָשׂוּ
  choice: suas palavras vazias nada realizaram
  alternative: suas mentiras são falsas; eles não fizeram assim; suas bravatas não deram em nada
  rationale: O hebraico é comprimido e admite mais de uma análise. A leitura escolhida acompanha o contexto imediato do orgulho de Moabe, enquanto a nota preserva alternativas legítimas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção com travessões destaca naturalmente a fórmula profética. A nota explicita a incerteza lexical e sintática sem sobrecarregar o versículo.
