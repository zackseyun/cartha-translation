base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: pt
  text: Sobre todos os terraços de Moabe e em suas praças, por toda parte há lamento; pois quebrei Moabe como uma vasilha que ninguém deseja[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como uma vasilha pela qual não há apreço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּגּוֹת
  choice: terraços
  rationale: Refere-se aos tetos planos das casas, usados como espaços de convivência. “Terraços” comunica essa realidade arquitetônica com naturalidade em português.
- source_word: רְחֹבֹתֶיהָ
  choice: suas praças
  rationale: O termo costuma designar espaços urbanos amplos e abertos; “praças” se ajusta ao cenário de lamentação pública.
- source_word: כֻּלֹּה מִסְפֵּד
  choice: por toda parte há lamento
  rationale: Expressa de modo idiomático a abrangência total da lamentação, sem restringi-la a um único lugar.
- source_word: מִסְפֵּד
  choice: lamento
  rationale: Abrange tanto a dor quanto sua expressão pública e mantém um registro claro e digno.
- source_word: שָׁבַרְתִּי
  choice: quebrei
  rationale: O perfeito hebraico apresenta a ação divina como realizada; “quebrei” preserva também a metáfora da vasilha arruinada.
- source_word: כִּכְלִי
  choice: como uma vasilha
  rationale: כְּלִי é um termo amplo para recipiente, utensílio ou objeto. No contexto de algo quebrado, “vasilha” oferece uma imagem concreta e natural.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: que ninguém deseja
  rationale: Traduz de forma idiomática a ideia de uma vasilha na qual não há prazer ou pela qual não existe desejo, enquanto a nota preserva a forma mais literal.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a solenidade da fórmula profética e apresenta o nome divino expresso no texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem recorrer à substituição tradicional por um título.
- issue: Sentido de אֵין חֵפֶץ בּוֹ
  choice: que ninguém deseja
  alternative: na qual não há prazer
  rationale: A tradução principal explicita em português natural a falta de desejo ou apreço pela vasilha; a nota registra a formulação literal e preserva a amplitude da expressão hebraica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. “Terraços” evita sugerir telhados inclinados e representa os tetos planos do contexto antigo. O travessão destaca a fórmula profética final.
