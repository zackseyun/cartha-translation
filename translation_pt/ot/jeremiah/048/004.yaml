lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: foi despedaçada
  rationale: O nifal perfeito descreve Moabe como quebrada ou arruinada de modo devastador; “despedaçada” preserva a força da imagem.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: הִשְׁמִיעוּ זְּעָקָה
  choice: fizeram ouvir um clamor
  rationale: Reproduz a construção causativa do hifil (“fazer ouvir”) e mantém o substantivo singular זְעָקָה, que indica grito ou clamor de aflição.
- source_word: צְעוֹרֶיהָ
  choice: seus pequeninos
  rationale: Segue a leitura massorética no sentido de “os pequenos dela”, aqui referindo-se aos pequeninos de Moabe, sem definir mais precisamente idade ou condição.
theological_decisions:
- issue: Identidade de צְעוֹרֶיהָ
  choice: seus pequeninos
  alternative: Zoar / até Zoar
  rationale: O texto massorético vocalizado favorece “seus pequeninos”; a associação com Zoar depende de outra leitura ou compreensão textual e, por isso, é registrada em nota sem substituir o texto principal.
translation_notes:
  register: Português atual, digno e direto, com sintaxe natural para leitores brasileiros e compreensão internacional. Conservou-se a imagem forte de destruição e a construção causativa hebraica.
