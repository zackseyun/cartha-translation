base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: pt
  text: Com o pranto de Jazer, choro por você[a], ó videira de Sibma. Seus rebentos[b] atravessaram o mar; chegaram até o mar de Jazer[c]. Sobre os seus frutos de verão e sobre a sua colheita de uvas caiu o devastador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mais do que pelo pranto de Jazer, choro por você”; a preposição hebraica inicial pode ter sentido comparativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ramos” ou “sarmentos”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz “o mar de Jazer”. Como Jazer ficava no interior, alguns entendem a expressão como hipérbole poética; outros propõem uma alteração textual, como “chegaram até Jazer”.
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי יַעְזֵר
  choice: Com o pranto de Jazer
  rationale: A preposição מִן nesta construção poética é difícil e pode indicar associação ou comparação. A tradução principal conserva a ligação entre os dois lamentos sem impor o sentido comparativo.
- source_word: אֶבְכֶּה לָּךְ
  choice: choro por você
  rationale: O imperfeito pode ter valor presente ou futuro; no contexto do lamento, o presente comunica naturalmente o ato de chorar. A preposição לְ indica o objeto do lamento.
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: ó videira de Sibma
  rationale: A expressão funciona como vocativo e apresenta Sibma sob a imagem de uma videira. A partícula 'ó' torna esse chamamento claro em português sem explicar a metáfora.
- source_word: נְטִישֹׁתַיִךְ
  choice: seus rebentos
  rationale: O substantivo designa as extensões ou brotações espalhadas de uma videira. 'Rebentos' preserva a imagem vitícola e continua compreensível no português atual.
- source_word: עָבְרוּ יָם
  choice: atravessaram o mar
  rationale: A forma verbal de עבר com יָם produz a imagem vívida de extensões da videira que cruzam o mar.
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: chegaram até o mar de Jazer
  rationale: A tradução segue a sequência consonantal e a leitura massorética sem emenda, entendendo יָם יַעְזֵר como 'mar de Jazer'. A dificuldade geográfica é indicada em nota.
- source_word: קֵיצֵךְ
  choice: seus frutos de verão
  rationale: קֵיץ designa frutos estivais ou produtos maduros dessa estação.
- source_word: בְּצִירֵךְ
  choice: sua colheita de uvas
  rationale: No contexto de uma vinha, בָּצִיר se refere especificamente à vindima; a expressão escolhida é clara em português internacional.
- source_word: שֹׁדֵד
  choice: o devastador
  rationale: O particípio designa quem saqueia e causa devastação. 'Devastador' abrange a ruína descrita no oráculo.
- source_word: נָפָל
  choice: caiu
  rationale: Com עַל, o verbo retrata a calamidade que desaba sobre os frutos e a colheita; o perfeito hebraico é refletido pelo pretérito.
theological_decisions:
- issue: Se a difícil expressão com 'mar' e 'Jazer' deve ser emendada ou suavizada
  choice: 'Conservar no texto principal a imagem massorética: ''chegaram até o mar de Jazer''.'
  alternative: Traduzir conjecturalmente 'chegaram até Jazer' ou, de modo interpretativo, 'espalharam-se até Jazer'.
  rationale: A dificuldade é textual e geográfica, não doutrinária. Manter a leitura recebida evita transformar uma solução conjectural em texto principal e preserva a hipérbole poética possível.
- issue: Se מִבְּכִי deve ser explicitamente comparativo
  choice: Traduzir 'Com o pranto de Jazer'.
  alternative: Traduzir 'Mais do que pelo pranto de Jazer'.
  rationale: A preposição admite uma nuance comparativa, mas não a exige de modo inequívoco. A opção principal mantém a tensão lexical, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com preferência por vocabulário natural no Brasil e também acessível internacionalmente. A ordem poética e a repetição de 'sobre' foram preservadas na frase final; as dificuldades genuínas do hebraico são mantidas no texto ou explicitadas em notas.
