lexical_decisions:
- source_word: וְעַל
  choice: e contra
  rationale: A preposição עַל, repetida com a conjunção וְ, dá continuidade à lista de lugares atingidos pelo juízo. “Contra” expressa adequadamente a direção hostil no contexto, e a repetição foi preservada.
- source_word: דִּיבוֹן
  choice: Dibom
  rationale: Nome geográfico transliterado segundo a forma tradicional e legível em português.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Aqui o termo funciona como nome de lugar; por isso, foi transliterado, sem explicitar possíveis associações com uma divindade ou um monte.
- source_word: בֵּית דִּבְלָתָיִם
  choice: Bete-Diblataim
  rationale: Nome geográfico composto, transliterado em vez de traduzido como “Casa de Diblataim”. O hífen torna clara e legível a unidade do topônimo.
