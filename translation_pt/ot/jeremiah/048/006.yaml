  text: נֻ֖סוּ מַלְּט֣וּ נַפְשְׁ/כֶ֑ם וְ/תִֽהְיֶ֕ינָה כַּ/עֲרוֹעֵ֖ר בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/006.yaml
  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: pt
  text: Fujam! Salvem suas vidas e sejam como um arbusto[a] no deserto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A planta indicada pelo termo hebraico é incerta; também se propõem “zimbro” e “tamargueira”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, possivelmente: “como Aroer no deserto”. O termo hebraico pode ser entendido como nome de lugar ou como nome de um arbusto do deserto.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֻסוּ
  choice: Fujam!
  rationale: Imperativo plural de נוס; a forma direta preserva a urgência da ordem hebraica.
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: Salvem a própria vida
  rationale: Neste contexto de fuga, נֶפֶשׁ significa a vida ou a própria pessoa, não especificamente a alma; a expressão comunica preservação da vida em português natural.
- source_word: וְתִהְיֶינָה
  choice: e sejam
  rationale: O imperfeito funciona como continuação exortativa dos imperativos anteriores. O plural feminino hebraico não precisa ser marcado em português, pois pode se referir coletivamente à população.
- source_word: כַּעֲרוֹעֵר
  choice: como um arbusto solitário
  rationale: A identificação botânica é incerta. A tradução genérica evita afirmar uma espécie não demonstrável, enquanto 'solitário' explicita com naturalidade a imagem contextual de isolamento no deserto. A possível leitura como topônimo é preservada em nota.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa região erma ou desértica; 'deserto' é claro, corrente e adequado à imagem do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos urgentes. A formulação evita 'alma' para נֶפֶשׁ neste contexto de sobrevivência e preserva em notas tanto a incerteza botânica quanto a possível leitura toponímica.
