source:
  edition: WLC
  text: נִלְכְּדָה֙ הַ/קְּרִיּ֔וֹת וְ/הַ/מְּצָד֖וֹת נִתְפָּ֑שָׂה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: pt
  text: Queriote foi capturada[a], e as fortalezas foram tomadas. Naquele dia, o coração dos guerreiros de Moabe será como o coração de uma mulher em trabalho de parto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “As cidades foram capturadas”, caso הַקְּרִיּוֹת seja entendido como substantivo comum, e não como o nome do lugar Queriote.
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: Queriote
  rationale: Embora a forma também possa ser entendida como o substantivo comum “as cidades”, o contexto do oráculo contra Moabe favorece o topônimo Queriote, em harmonia com a menção de cidades específicas ao longo do capítulo.
- source_word: נִלְכְּדָה
  choice: foi capturada
  rationale: O nifal de לכד indica que algo foi capturado ou tomado. O pretérito perfeito exprime em português, de modo natural, a derrota anunciada profeticamente como fato consumado.
- source_word: הַמְּצָדוֹת
  choice: as fortalezas
  rationale: O termo designa lugares fortificados. “Fortalezas” preserva com clareza o sentido militar sem acrescentar uma localização topográfica não expressa no texto.
- source_word: נִתְפָּשָׂה
  choice: foram tomadas
  rationale: A forma passiva de תפשׂ comunica que as fortalezas foram apanhadas ou conquistadas. “Tomadas” é idiomático no contexto militar e mantém o paralelismo sem repetir “capturada”.
- source_word: לֵב
  choice: o coração
  rationale: No hebraico, “coração” pode representar a disposição interior, a coragem ou o ânimo. A tradução mantém a imagem concreta do original, cuja força é esclarecida pela comparação subsequente.
- source_word: גִּבּוֹרֵי מוֹאָב
  choice: os guerreiros de Moabe
  rationale: Em contexto militar, גִּבּוֹרֵי refere-se a homens valentes ou combatentes. “Guerreiros” é atual, claro e preserva o sentido marcial.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal característica da literatura profética, vertida de forma natural e fiel em português.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: como o coração de uma mulher em trabalho de parto
  rationale: A expressão retrata uma mulher em trabalho de parto e comunica intensa angústia. A tradução preserva a comparação e evita substituí-la por uma explicação abstrata.
