base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: pt
  text: Desde o clamor de Hesbom até Eleale, até Jaza, eles levantam a voz; desde Zoar até Horonaim, até Eglate-Selisia[a]. Pois até as águas de Ninrim ficarão desoladas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “uma novilha de três anos”. A expressão hebraica pode ser entendida como uma descrição, mas, neste contexto, provavelmente é um nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזַּעֲקַת
  choice: Desde o clamor de
  rationale: זַעֲקָה expressa um grito ou clamor de aflição; מִן introduz aqui o ponto de partida da extensão geográfica em que o clamor se propaga.
- source_word: עַד
  choice: até
  rationale: A repetição de עַד delimita a extensão do clamor entre as localidades mencionadas; “até” preserva de modo natural essa progressão.
- source_word: נָתְנוּ קוֹלָם
  choice: eles erguem a voz
  rationale: O idioma significa literalmente “deram sua voz”, isto é, soltaram um clamor. “Erguem a voz” mantém a construção ativa e é corrente em português.
- source_word: מִצֹּעַר
  choice: desde Zoar
  rationale: A preposição מִן inicia um segundo percurso geográfico; “desde Zoar” preserva esse novo ponto de partida.
- source_word: חֹרֹנַיִם
  choice: Horonaim
  rationale: Nome geográfico transliterado segundo forma reconhecível em português bíblico.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Eglate-Selisia
  rationale: No contexto da sequência geográfica e em paralelo com Isaías 15:5, a expressão provavelmente funciona como topônimo. A transliteração evita impor no texto principal uma interpretação etimológica incerta.
- source_word: כִּי גַּם
  choice: Pois até
  rationale: כִּי introduz a explicação, enquanto גַּם acrescenta ênfase; “Pois até” comunica ambas as funções naturalmente.
- source_word: מֵי נִמְרִים
  choice: as águas de Ninrim
  rationale: Trata-se de uma construção nominal com topônimo; a tradução mantém a referência sem especificar indevidamente se eram fonte, riacho ou conjunto de águas.
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  choice: ficarão desoladas
  rationale: היה com לְ indica o estado resultante. A formulação portuguesa expressa que as águas passarão a uma condição de devastação, sem acrescentar a ideia mais específica de que necessariamente secarão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais e reconhecíveis dos topônimos. Conservou-se a progressão geográfica e a voz ativa do hebraico. A estranheza poética de águas que ficam desoladas foi mantida para evitar a especificação interpretativa “secarão”. O marcador da nota foi colocado junto à expressão ambígua Eglate-Selisia.
