  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּאֶ֣ה מְאֹ֑ד גָּבְה֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/גַאֲוָת֖/וֹ וְ/רֻ֥ם לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
translation:
  language: pt
  text: Ouvimos falar do orgulho de Moabe — ele é extremamente orgulhoso —, de sua altivez[a], seu orgulho, sua arrogância e da elevação de seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouvimos falar do orgulho de Moabe — muito orgulhoso, de fato —, de sua elevação, seu orgulho, sua arrogância e de seu coração exaltado.”'
    reason: Alternativas lexicais e sintáticas possíveis para os vários termos hebraicos associados à altura e ao orgulho.
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Ouvimos falar
  rationale: O perfeito qal na primeira pessoa do plural indica que a fama do orgulho de Moabe chegou aos que falam. Em português, “ouvimos falar” expressa isso naturalmente sem impor uma distinção temporal ausente no contexto.
- source_word: גְאוֹן מוֹאָב
  choice: do orgulho de Moabe
  rationale: Neste anúncio de juízo, גְאוֹן tem sentido negativo de orgulho arrogante, não de majestade; Moabe segue a forma tradicional do nome em português.
- source_word: גֵּאֶה מְאֹד
  choice: ele é extremamente orgulhoso
  rationale: A formulação predicativa conserva a intensificação de מְאֹד e a ênfase retórica do hebraico.
- source_word: גָּבְהוֹ
  choice: sua altivez
  rationale: Embora o termo derive da ideia de altura, no acúmulo de palavras ligadas ao orgulho designa soberba; “altivez” preserva tanto a imagem de elevação quanto o sentido moral.
- source_word: וּגְאוֹנוֹ
  choice: seu orgulho
  rationale: Mantém a repetição do campo semântico de גְאוֹן, importante para o efeito cumulativo do verso.
- source_word: וְגַאֲוָתוֹ
  choice: sua arrogância
  rationale: “Arrogância” distingue este quase sinônimo dos termos vizinhos sem enfraquecer a denúncia.
- source_word: וְרֻם לִבּוֹ
  choice: da elevação de seu coração
  rationale: Tradução próxima da expressão “altura/elevação de seu coração”, preservando tanto “coração” quanto a metáfora vertical do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A sequência de quase sinônimos foi preservada para reproduzir o acúmulo retórico do hebraico; os travessões marcam a observação enfática sobre Moabe.
