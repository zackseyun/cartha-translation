reference: Jeremiah 48:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: pt
  text: Maldito aquele que faz a obra de Yahweh com negligência[a], e maldito aquele que impede sua espada de derramar sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com falsidade” ou “traiçoeiramente”. O termo hebraico רְמִיָּה pode indicar engano ou traição, mas, neste contexto, provavelmente se refere à execução frouxa ou negligente da tarefa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Adjetivo predicativo que introduz uma fórmula de imprecação ou juízo; “maldito” é direto, corrente e preserva a força do hebraico.
- source_word: עֹשֶׂה
  choice: aquele que faz
  rationale: O particípio tem função substantivada e genérica; esta formulação é natural em português e mantém o sentido caracterizador.
- source_word: מְלֶאכֶת יְהוָה
  choice: a obra de Yahweh
  rationale: מְלָאכָה designa obra ou tarefa; no contexto, trata-se do juízo contra Moabe entendido como obra comissionada por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: רְמִיָּה
  choice: com negligência
  rationale: Neste contexto, indica execução frouxa, descuidada ou negligente da tarefa. A possibilidade lexical de fraude ou traição é preservada em nota.
- source_word: מֹנֵעַ
  choice: impede
  rationale: O particípio expressa reter ou impedir; com a construção seguinte, comunica que a espada é impedida de chegar ao sangue.
- source_word: חַרְבּוֹ
  choice: sua espada
  rationale: Tradução direta do substantivo singular com sufixo masculino singular; o referente é “aquele” da cláusula.
- source_word: מִדָּם
  choice: de derramar sangue
  rationale: A expressão hebraica é literalmente “do sangue”; em português, “impede sua espada de derramar sangue” preserva a imagem concreta e explicita naturalmente a relação verbal implícita, sem suavizar a violência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de o substituir por um título.
- issue: Possível suavização da imagem violenta do juízo
  choice: manter a linguagem explícita sobre a espada derramar sangue
  alternative: reter sua espada do combate
  rationale: O hebraico apresenta o juízo com uma imagem deliberadamente severa; a tradução não deve atenuá-la nem acrescentar uma justificação ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “maldito” conserva o paralelismo enfático. A formulação mantém a aspereza retórica e a tensão teológica do juízo comissionado por Yahweh.
