source:
  edition: WLC
  text: אֵ֣ין עוֹד֮ תְּהִלַּ֣ת מוֹאָב֒ בְּ/חֶשְׁבּ֗וֹן חָשְׁב֤וּ עָלֶ֨י/הָ֙ רָעָ֔ה לְכ֖וּ וְ/נַכְרִיתֶ֣/נָּה מִ/גּ֑וֹי גַּם מַדְמֵ֣ן תִּדֹּ֔מִּי אַחֲרַ֖יִ/ךְ תֵּ֥לֶךְ חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: pt
  text: 'Já não há louvor para Moabe[a]. Em Hesbom, tramaram o mal contra ela: “Venham, vamos eliminá-la como nação”. Você também, Madmém, será reduzida ao silêncio[b]; a espada irá atrás de você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Hesbom” e “tramaram” têm sons semelhantes, formando um jogo de palavras entre o nome da cidade e o verbo que significa planejar.
    reason: lexical_alternative
  - marker: b
    text: Madmém provavelmente é o nome de um lugar. Em hebraico, o nome também soa como “ficar em silêncio” ou “ser reduzido ao silêncio”, reforçando o anúncio de juízo por meio de um jogo de palavras.
    reason: cultural_note
lexical_decisions:
- source_word: תְּהִלַּת
  choice: louvor
  rationale: Mantém o sentido direto de elogio ou renome, expressando a cessação da condição celebrada de Moabe.
- source_word: בְּחֶשְׁבּוֹן
  choice: Em Hesbom
  rationale: 'Toma ב em sentido locativo: o plano hostil é tramado em Hesbom, preservando na nota o jogo sonoro hebraico com חָשְׁבוּ.'
- source_word: חָשְׁבוּ
  choice: tramaram
  rationale: Expressa planejamento hostil de modo natural em português, sem reduzir o verbo a mero pensamento.
- source_word: רָעָה
  choice: o mal
  rationale: Preserva a amplitude lexical de רָעָה e sua formulação como ação hostil contra Moabe, sem especificar além do hebraico se se trata de mal moral, dano ou calamidade.
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: Venham, vamos eliminá-la como nação
  rationale: Reproduz a fala deliberativa hostil e comunica com naturalidade a extinção de Moabe enquanto nação.
- source_word: מַדְמֵן
  choice: Madmém
  rationale: Mantém o termo como topônimo moabita; o jogo de palavras com o verbo seguinte é explicado em nota.
- source_word: תִּדֹּמִּי
  choice: será reduzida ao silêncio
  rationale: Preserva o sentido de ficar ou ser posta em silêncio, com a força ameaçadora própria do contexto de juízo.
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: a espada irá atrás de você
  rationale: Conserva a personificação vívida e a ordem básica da expressão hebraica.
- source_word: אֵין עוֹד
  choice: Já não há
  rationale: Forma idiomática e concisa em português para indicar cessação.
