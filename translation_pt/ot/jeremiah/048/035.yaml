source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: pt
  text: Farei cessar em Moabe — oráculo de Yahweh — aquele que sobe ao lugar alto e queima incenso ao seu deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Farei cessar em Moabe o culto nos lugares altos...” O hebraico emprega particípios no singular (“aquele que sobe... e queima incenso”), que podem representar genericamente os adoradores.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Farei cessar
  rationale: O hifil de שׁבת tem sentido causativo. A formulação preserva de modo natural a ideia de Yahweh fazer cessar a pessoa ou atividade mencionada.
- source_word: לְמוֹאָב
  choice: em Moabe
  rationale: A preposição לְ indica aqui a esfera em que a cessação ocorrerá; “em Moabe” expressa isso com clareza.
- source_word: נְאֻם יְהוָה
  choice: oráculo de Yahweh
  rationale: נְאֻם é uma fórmula profética nominal e solene; “oráculo” conserva essa força, enquanto o tetragrama é transliterado como “Yahweh”.
- source_word: מַעֲלֶה בָמָה
  choice: aquele que sobe ao lugar alto
  rationale: Mantém o particípio masculino singular e a imagem concreta de subir ao local cultual designado por בָמָה.
- source_word: וּמַקְטִיר
  choice: e queima incenso
  rationale: Em contexto cultual, o hifil de קטר pode indicar queimar incenso ou fazer subir fumaça sacrificial; esta é a formulação portuguesa mais clara sem apagar a alternativa semântica.
- source_word: לֵאלֹהָיו
  choice: ao seu deus
  rationale: Apesar da forma morfologicamente plural אֱלֹהִים, o sufixo singular e o contexto favorecem um referente singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Escopo daquilo que Yahweh fará cessar em Moabe
  choice: 'o adorador representativo: “aquele que sobe... e queima incenso”'
  alternative: o culto nos lugares altos em geral
  rationale: Os dois particípios hebraicos estão no masculino singular e podem retratar genericamente o praticante. O texto principal preserva essa forma, e a nota registra a possível referência à prática cultual como um todo.
- issue: Sentido cultual de וּמַקְטִיר
  choice: queima incenso
  alternative: faz subir fumaça sacrificial
  rationale: “Queima incenso” é uma leitura cultual comum e clara, embora o verbo possa abranger a produção de fumaça de ofertas; a ambiguidade lexical não altera o ponto central do juízo contra o culto moabita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “Moabe”, “lugar alto” e “oráculo” preservando o registro bíblico-profético. A ordem com travessões mantém a fórmula profética inserida sem tornar a frase obscura.
