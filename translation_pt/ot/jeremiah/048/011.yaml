  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: pt
  text: Moabe tem vivido tranquilo desde a sua juventude e tem repousado sobre a sua borra[a]. Não foi passado de um recipiente para outro, nem foi para o exílio. Por isso, seu sabor se manteve, e seu aroma não mudou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem é a do vinho deixado em repouso sobre o sedimento, sem ser passado para outro recipiente.
    reason: Esclarecimento da metáfora vinícola de אֶל שְׁמָרָיו.
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: vive tranquilo
  rationale: Expressa a condição prolongada de segurança e sossego de Moabe, com naturalidade em português e sem explicitar além do texto a ideia de complacência.
- source_word: מִנְּעוּרָיו
  choice: desde a sua juventude
  rationale: Preserva a expressão temporal e a personificação singular de Moabe.
- source_word: שֹׁקֵט
  choice: repousa
  rationale: Comunica quietude contínua e liga-se naturalmente à imagem do vinho deixado sem ser movimentado.
- source_word: אֶל שְׁמָרָיו
  choice: sobre a sua borra
  rationale: Mantém a imagem vinícola concreta do vinho que permanece sobre o sedimento; a nota esclarece o referente.
- source_word: הוּרַק
  choice: foi passado
  rationale: No contexto de vinho transferido entre recipientes, exprime com clareza o ato de verter sem recorrer ao termo técnico 'decantado'.
- source_word: מִכְּלִי אֶל כֶּלִי
  choice: de um recipiente para outro
  rationale: É corrente e compreensível em português moderno, preservando a transferência entre vasilhas.
- source_word: וּבַגּוֹלָה
  choice: foi para o exílio
  rationale: Representa diretamente a deportação ou condição de exílio no contexto histórico.
- source_word: טַעְמוֹ
  choice: seu sabor
  rationale: No desenvolvimento da metáfora do vinho, 'sabor' é natural e sensorial.
- source_word: עָמַד ... בּוֹ
  choice: permaneceu nele
  rationale: Traduz o sentido idiomático de persistência sem apagar a formulação personificada do hebraico.
- source_word: רֵיחוֹ
  choice: seu aroma
  rationale: É a designação natural do cheiro do vinho e mantém o paralelismo sensorial com 'sabor'.
- source_word: נָמָר
  choice: não mudou
  rationale: Comunica de modo direto o sentido de alteração ou mudança.
theological_decisions:
- issue: Personificação de Moabe no singular masculino
  choice: Manter Moabe como referente singular masculino, com formas como 'seu' e 'nele'
  alternative: Tratar a nação por formas femininas ou plurais
  rationale: O hebraico apresenta Moabe consistentemente como entidade singular masculina; a tradução preserva essa personificação sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a metáfora prolongada do vinho e evita o tecnicismo 'decantado'. O masculino singular preserva a personificação hebraica de Moabe.
