  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנֵּ֥ה כַ/נֶּ֖שֶׁר יִדְאֶ֑ה וּ/פָרַ֥שׂ כְּנָפָ֖י/ו אֶל מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: pt
  text: "Pois assim diz o SENHOR:\n“Eis que, como uma águia, ele voa\n e estende as asas sobre Moabe.”"
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Mantém a fórmula profética e o valor introdutório/explicativo de כִּי em português natural.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção tradicional de representar o tetragrama por SENHOR em versaletes, coerente com a camada de consulta fornecida.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Reproduz a chamada enfática à atenção; o plural impessoal é claro e corrente em português.
- source_word: כַנֶּשֶׁר
  choice: Como uma águia
  rationale: נֶשֶׁר designa aqui uma grande ave de rapina, tradicionalmente entendida como águia; a comparação é preservada sem explicitação adicional.
- source_word: יִדְאֶה
  choice: ele desce em voo
  rationale: O verbo descreve o movimento veloz ou planado da ave. A formulação conserva a imagem dinâmica sem impor a ideia mais específica de atacar.
- source_word: וּפָרַשׂ כְּנָפָיו אֶל מוֹאָב
  choice: e estende as asas sobre Moabe
  rationale: Traduz diretamente o gesto figurado de abrir/estender as asas em direção a Moabe; 'sobre' expressa naturalmente a aproximação ameaçadora no contexto.
theological_decisions:
- issue: Identidade do sujeito masculino singular em יִדְאֶה
  choice: Preservar o pronome “ele” sem identificar explicitamente o agente
  alternative: Explicitar “o inimigo” ou nomear o conquistador
  rationale: O hebraico deixa o referente implícito nesta linha. A tradução mantém essa tensão e evita introduzir uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético. “Moabe” segue a forma bíblica consagrada. Não há notas de rodapé necessárias neste versículo.
