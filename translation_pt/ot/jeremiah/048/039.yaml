  text: אֵ֥יךְ חַ֨תָּה֙ הֵילִ֔ילוּ אֵ֛יךְ הִפְנָה עֹ֥רֶף מוֹאָ֖ב בּ֑וֹשׁ וְ/הָיָ֥ה מוֹאָ֛ב לִ/שְׂחֹ֥ק וְ/לִ/מְחִתָּ֖ה לְ/כָל סְבִיבָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: pt
  text: Como ela está destruída! Lamentem! Como Moabe virou as costas, cheia de vergonha[b]! Assim, Moabe se tornou motivo de riso e objeto de horror[a] para todos ao seu redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivo de espanto” ou “objeto de consternação”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “virou a nuca”; o idioma hebraico expressa retirada ou afastamento em vergonha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Mantém a exclamação poética de lamento sem reduzi-la a uma simples afirmação.
- source_word: חַתָּה
  choice: ficou destroçado
  rationale: Expressa o colapso de Moabe; o masculino concorda com o nome próprio em português, sem impor ao hebraico uma personificação feminina que ele não marca aqui.
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: Imperativo plural dirigido aos que presenciam a ruína; comunica lamento intenso em português atual e digno.
- source_word: הִפְנָה עֹרֶף
  choice: virou as costas
  rationale: Preserva de modo natural o idioma hebraico, que retrata retirada ou afastamento desonroso.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: בּוֹשׁ
  choice: envergonhado
  rationale: Conserva a ideia de Moabe em estado de vergonha depois de virar as costas; a construção permanece concisa.
- source_word: וְהָיָה
  choice: tornou-se
  rationale: Apresenta o estado resultante do juízo na descrição vívida do lamento.
- source_word: לִשְׂחֹק
  choice: motivo de riso
  rationale: Indica que Moabe se tornou objeto de zombaria, em formulação clara e idiomática.
- source_word: לִמְחִתָּה
  choice: objeto de horror
  rationale: No paralelismo com 'motivo de riso', designa Moabe como aquilo que provoca horror ou consternação, sem limitar o substantivo à ideia de terror ativo.
- source_word: לְכָל סְבִיבָיו
  choice: para todos ao seu redor
  rationale: Segue a expressão abrangente do hebraico e preserva o sufixo masculino singular, sem especificar indevidamente 'vizinhos'.
