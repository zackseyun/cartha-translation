base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
translation:
  language: pt
  text: Ai de você, Moabe! O povo de Quemós pereceu, pois seus filhos foram levados cativos, e suas filhas, para o cativeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois termos hebraicos traduzidos por “cativos” e “cativeiro” são quase sinônimos e formam um paralelo poético; ambos podem ser expressos pelo termo “cativeiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי לְךָ מוֹאָב
  choice: Ai de você, Moabe!
  rationale: “Ai de” preserva a interjeição profética de lamento e juízo; “você” torna explícito o objeto singular marcado por לְךָ, em linguagem atual e digna.
- source_word: אָבַד
  choice: pereceu
  rationale: Expressa ruína ou desaparecimento consumado sem acrescentar um agente não declarado pelo hebraico.
- source_word: עַם כְּמוֹשׁ
  choice: o povo de Camos
  rationale: Reproduz naturalmente a cadeia construta e mantém a relação de Moabe com sua divindade nacional sem explicá-la além do texto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do lamento e da afirmação anterior.
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: seus filhos foram levados como prisioneiros
  rationale: Mantém a voz passiva de לֻקְּחוּ e comunica com naturalidade a condição de cativos indicada por בַּשֶּׁבִי.
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: e suas filhas, para o cativeiro
  rationale: Preserva a elipse verbal e o paralelismo entre filhos e filhas; “cativeiro” traduz o substantivo próximo em sentido ao termo precedente.
theological_decisions:
- issue: Relação entre Moabe e Camos
  choice: o povo de Camos
  alternative: o povo pertencente a Camos
  rationale: A formulação conserva a ligação expressa pela construção hebraica sem definir em que sentido o povo pertence à divindade moabita.
- issue: Destino dos filhos e das filhas
  choice: “como prisioneiros” / “para o cativeiro”
  alternative: “para o cativeiro” em ambos os membros
  rationale: A variação portuguesa comunica os dois termos hebraicos quase sinônimos e preserva o paralelismo poético sem impor uma distinção rígida entre cativeiro e exílio.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom profético solene é preservado por “Ai de você”, enquanto a sintaxe permanece clara para leitores comuns.
