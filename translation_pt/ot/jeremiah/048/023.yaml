  text: and against Kiriathaim[a], and against Beth-gamul, and against Beth-meon—
translation:
  language: pt
  text: e contra Quiriataim, e contra Bete-Gamul e contra Bete-Meom —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: contra
  rationale: A preposição עַל, no contexto da lista de cidades sob juízo, indica direção hostil. Em português, «contra» comunica isso naturalmente. A construção é repetida antes dos três topônimos para preservar a cadência hebraica, com o último וְ expresso por «e».
- source_word: קִרְיָתַיִם
  choice: Quiriataim
  rationale: Topônimo transliterado segundo convenções portuguesas, sem tentar traduzir sua forma aparentemente dual.
- source_word: בֵּית גָּמוּל
  choice: Bete-Gamul
  rationale: Nome composto transliterado como topônimo estabelecido; «Bete» representa בֵּית, e o hífen preserva a unidade do nome.
- source_word: בֵּית מְעוֹן
  choice: Bete-Meom
  rationale: Topônimo composto transliterado; «Meom» reproduz de modo legível em português a consoante nasal final do hebraico מְעוֹן.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene. A repetição de «contra» conserva o ritmo da enumeração profética. O travessão final sinaliza que a lista continua no versículo seguinte.
