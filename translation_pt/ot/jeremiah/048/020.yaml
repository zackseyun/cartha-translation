id: JER.48.20
reference: Jeremiah 48:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
translation:
  language: pt
  text: Moabe foi coberto de vergonha, pois foi destroçado.[a] Lamente e clame! Anunciem junto ao Arnom:[b] Moabe foi devastado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficou consternado» ou «foi abatido».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «no Arnom» ou «perto do Arnom».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «foi saqueado» ou «foi arrasado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁ
  choice: foi coberto de vergonha
  rationale: 'Expressa de modo natural o resultado causativo do hifil de בוש: Moabe foi levado à vergonha e desonrado.'
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da vergonha de Moabe e preserva o tom profético elevado sem deixar de ser claro.
- source_word: חַתָּה
  choice: foi destroçado
  rationale: Reflete o sentido de ser quebrado ou reduzido à ruína no contexto do juízo; a possível nuance emocional de ficar consternado é preservada em nota.
- source_word: הילילי
  choice: Lamente
  rationale: Imperativo singular que convoca Moabe personificado a expressar publicamente sua dor; é natural e digno em português contemporâneo.
- source_word: ו/זעקי
  choice: e clame
  rationale: Reproduz o clamor alto de aflição indicado por זעק e forma uma combinação natural com «lamente».
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: Mantém o imperativo plural e a força de proclamação pública; a notícia anunciada fica implícita, como no hebraico.
- source_word: בְ/אַרְנֹון
  choice: junto ao Arnom
  rationale: Entende ב em sentido locativo e Arnom como o conhecido rio ou vale fronteiriço, sem transformar o nome em cidade.
- source_word: שֻׁדַּד
  choice: foi devastado
  rationale: O pual de שדד descreve Moabe como arrasado ou saqueado; «devastado» comunica a ruína ampla sem restringir o sentido ao saque.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Mantém-se a mudança do imperativo singular («Lamente e clame!»), dirigido a Moabe personificado, para o plural («Anunciem»), presente no hebraico. A repetição de «Moabe» conserva a ênfase profética do original.
