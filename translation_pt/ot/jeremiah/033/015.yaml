base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: pt
  text: Naqueles dias e naquele tempo, farei brotar para Davi um Renovo justo[b][a], e ele praticará o direito e a justiça na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um Renovo de justiça”.'
    reason: lexical_alternative
  - marker: b
    text: “Renovo” provavelmente retoma a promessa do governante davídico em Jeremias 23:5.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Reproduz naturalmente a fórmula temporal, mantendo a preposição e o demonstrativo.
- source_word: וּבָעֵת הַהִיא
  choice: e naquele tempo
  rationale: Preserva a expressão temporal paralela sem fundi-la com a anterior.
- source_word: אַצְמִיחַ
  choice: farei brotar
  rationale: O hifil é causativo; esta formulação conserva de modo natural a imagem vegetal.
- source_word: לְדָוִד
  choice: para Davi
  rationale: Mantém a relação ou benefício indicado por ל sem ampliar o texto para “casa de Davi”.
- source_word: צֶמַח
  choice: Renovo
  rationale: “Renovo” preserva a metáfora de um novo broto e seu provável uso como designação do governante davídico.
- source_word: צְדָקָה
  choice: justo
  rationale: Como qualificação de צֶמַח, forma português natural; a nota preserva as leituras estruturais alternativas.
- source_word: וְעָשָׂה
  choice: e ele praticará
  rationale: O contexto profético exige sentido futuro; “praticará” combina naturalmente com os dois substantivos ético-governamentais.
- source_word: מִשְׁפָּט
  choice: o direito
  rationale: No contexto do governo régio, indica a ordem justa e o exercício do juízo; o artigo produz uma coordenação idiomática em português.
- source_word: וּצְדָקָה
  choice: e a justiça
  rationale: Distingue o termo de מִשְׁפָּט e preserva o conhecido par hebraico.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto de Jeremias, refere-se provavelmente à terra de Judá/Israel, sem explicitar no texto aquilo que permanece implícito.
theological_decisions:
- issue: Força messiânica ou titular de צֶמַח
  choice: Usar “Renovo” com inicial maiúscula.
  alternative: Usar “renovo” ou “broto” em minúscula.
  rationale: A estreita correspondência com Jeremias 23:5 favorece uma designação régia davídica; a maiúscula sinaliza essa provável função sem acrescentar um título ausente.
- issue: Valor temporal de וְעָשָׂה
  choice: 'Traduzir no futuro: “ele praticará”.'
  alternative: 'Reproduzir formalmente como passado: “ele praticou”.'
  rationale: A forma continua a promessa futura iniciada por אַצְמִיחַ; o futuro comunica corretamente a sequência no discurso profético.
- issue: Relação sintática entre צֶמַח e צְדָקָה
  choice: 'Texto principal: “um Renovo justo”.'
  alternative: “um Renovo de justiça”.
  rationale: A construção permite mais de uma nuance. A formulação adjetival é natural e provável, enquanto a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Farei brotar” mantém a imagem agrícola; “Renovo” conserva a linguagem bíblica sem obscurecer seu sentido. Os marcadores seguem a ordem fornecida no texto de consulta, [b][a], e ambos aparecem no texto principal.
