  text: קְרָ֥א אֵלַ֖/י וְ/אֶעֱנֶ֑/ךָּ וְ/אַגִּ֧ידָה לְּ/ךָ֛ גְּדֹל֥וֹת וּ/בְצֻר֖וֹת לֹ֥א יְדַעְתָּֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/003.yaml
  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: pt
  text: Clame a mim, e eu lhe responderei e lhe anunciarei coisas grandes e inacessíveis[a] que você não conhecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ocultas”; mais literalmente, “fortificadas”. O termo hebraico sugere coisas fora do acesso comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: Clame a mim
  rationale: O imperativo qal convoca Jeremias a dirigir-se a Deus. “Clame a mim” é natural, mantém a força do imperativo e evita a formulação menos corrente “chame a mim”.
- source_word: וְאֶעֱנֶךָ
  choice: e eu lhe responderei
  rationale: ענה, neste contexto, significa responder. O futuro expressa diretamente a promessa divina feita ao interlocutor singular.
- source_word: וְאַגִּידָה לְּךָ
  choice: e lhe anunciarei
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. “Anunciarei” preserva o tom digno e a ideia de comunicar uma revelação sem acrescentar explicação.
- source_word: גְּדֹלוֹת
  choice: coisas grandes
  rationale: O adjetivo feminino plural é usado substantivamente e abrange fatos ou assuntos grandiosos, sem delimitar indevidamente seu conteúdo.
- source_word: וּבְצֻרוֹת
  choice: e inacessíveis
  rationale: O termo, ligado à ideia de algo fortificado ou isolado, descreve coisas fora do acesso comum. “Inacessíveis” conserva essa imagem melhor que “ocultas”, enquanto a nota registra alternativas legítimas.
- source_word: לֹא יְדַעְתָּם
  choice: que você não conhecia
  rationale: O perfeito hebraico indica que essas coisas não faziam parte do conhecimento anterior do destinatário. O imperfeito português expressa naturalmente esse estado prévio.
theological_decisions:
- issue: Força semântica de וּבְצֻרוֹת no contexto da revelação divina
  choice: Traduzir por “inacessíveis” no texto principal
  alternative: “ocultas” ou, mais literalmente, “fortificadas”
  rationale: A promessa envolve Deus tornar conhecido aquilo a que Jeremias não tinha acesso. “Inacessíveis” preserva a tensão entre a imagem concreta de fortificação e seu sentido contextual, sem reduzir o termo apenas a mistério ou segredo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “você” explicita naturalmente o destinatário masculino singular sem arcaísmo; “lhe” evita repetição. A coordenação do hebraico foi preservada.
