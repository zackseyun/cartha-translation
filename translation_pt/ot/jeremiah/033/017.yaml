id: JER.33.17
reference: Jeremiah 33:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי כֹ֖ה אָמַ֣ר יְהוָ֑ה לֹֽא יִכָּרֵ֣ת לְ/דָוִ֔ד אִ֕ישׁ יֹשֵׁ֖ב עַל כִּסֵּ֥א בֵֽית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: Nunca faltará a Davi um homem que se assente no trono da casa de Israel.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não será cortado para Davi um homem assentado no trono da casa de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais simples: “no trono de Israel”. O hebraico diz “da casa de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a declaração divina como fundamento ou explicação da promessa anterior, de modo natural em português.
- source_word: כֹה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e verte diretamente o nome divino.
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: Nunca faltará a Davi
  rationale: Expressa em português corrente o sentido idiomático de que não será cortado ou suprimido para Davi alguém que ocupe o trono, mantendo a força contínua da promessa.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do hebraico sem substituí-lo pela interpretação mais específica «descendente».
- source_word: יֹשֵׁב
  choice: que se assente
  rationale: Representa o particípio como função régia contínua e produz uma construção natural depois de «um homem».
- source_word: עַל כִּסֵּא
  choice: no trono
  rationale: A forma definida comunica o trono real dinástico pressuposto pelo contexto.
- source_word: בֵית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Conserva a expressão pactual e nacional completa do texto hebraico, em vez de simplificá-la para «de Israel».
theological_decisions:
- issue: Promessa dinástica a Davi
  choice: A formulação promete a continuidade da realeza davídica sem definir neste versículo o mecanismo histórico ou messiânico de seu cumprimento.
  alternative: Entender a declaração apenas como sucessão histórica imediata ou exclusivamente como predição de um único rei messiânico final.
  rationale: O hebraico afirma que não faltará a Davi um homem assentado no trono de Israel. A tradução mantém essa tensão e não impõe uma dessas leituras.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Yahweh» preserva o nome divino; «que se assente» mantém o tom régio sem arcaísmo excessivo.
