  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: pt
  text: Eles vêm lutar contra os caldeus[a] e para enchê-los[b] de cadáveres das pessoas que feri na minha ira e no meu furor[c]; escondi o meu rosto desta cidade por causa de toda a maldade deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os babilônios». O hebraico diz «os caldeus».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «enchê-los». O pronome provavelmente se refere às casas ou fortificações mencionadas no versículo anterior.'
    reason: cross_reference
  - marker: c
    text: Ou «cadáveres humanos» ou «cadáveres dos homens». O hebraico אָדָם pode designar o ser humano coletivamente ou pessoas concretas, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: Eles vêm
  rationale: O particípio qal masculino plural descreve uma ação em curso ou iminente. Em português, o presente «vêm» expressa isso naturalmente sem exigir uma construção progressiva.
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: lutar contra os caldeus
  rationale: O infinitivo de לחם com אֶת indica confronto hostil dirigido contra os caldeus; «lutar contra» torna clara essa relação.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o etnônimo hebraico, em vez de substituí-lo pela identificação histórica mais ampla «babilônios».
- source_word: וּלְמַלְאָם
  choice: mas apenas para enchê-las
  rationale: O sufixo masculino plural significa literalmente «enchê-los». Pelo contexto anterior, provavelmente retoma as casas ou fortificações; em português, o feminino «enchê-las» concorda com esses antecedentes prováveis. «Mas apenas» explicita a força resultativa e sombria do contexto, sem identificar o referente no corpo do texto.
- source_word: פִּגְרֵי הָאָדָם
  choice: cadáveres humanos
  rationale: פגר designa corpos mortos, especialmente após morte violenta, e אָדָם pode ter sentido coletivo. «Cadáveres humanos» conserva a dureza da expressão e evita restringir desnecessariamente o grupo a homens adultos.
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: daqueles que feri mortalmente
  rationale: נכה significa golpear ou ferir e, neste contexto, o resultado letal é indicado pelos cadáveres. A formulação preserva a imagem verbal e torna explícito o desfecho.
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: na minha ira e no meu furor
  rationale: Mantém distintos os dois termos hebraicos sobrepostos, preservando a intensificação do juízo divino.
- source_word: וַאֲשֶׁר הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: escondi o meu rosto desta cidade
  rationale: Preserva a ordem geral e o importante idioma bíblico da retirada do favor ou da presença divina.
- source_word: עַל כָּל רָעָתָם
  choice: por causa de toda a maldade deles
  rationale: עַל tem valor causal, e רָעָה comunica maldade moral. A expressão é clara e mantém explícito o referente plural do sufixo.
theological_decisions:
- issue: Juízo divino e linguagem antropomórfica
  choice: 'Manter a fala divina direta: «feri mortalmente», «na minha ira e no meu furor» e «escondi o meu rosto».'
  alternative: Atenuar para linguagem impessoal de desastre ou explicar o idioma em vez de traduzi-lo.
  rationale: O hebraico atribui diretamente o juízo a Deus e emprega o idioma bíblico de esconder o rosto. A tradução conserva esse peso teológico sem racionalizá-lo nem suavizá-lo.
- issue: Sentido coletivo de אָדָם
  choice: cadáveres humanos
  alternative: cadáveres dos homens
  rationale: O contexto trata de vítimas humanas concretas, mas o substantivo אָדָם não exige que sejam apenas homens adultos. A escolha preserva a amplitude lexical genuína.
- issue: Força da coordenação em וּלְמַלְאָם
  choice: mas apenas para enchê-las
  alternative: e para enchê-las
  rationale: 'A conjunção hebraica é formalmente coordenativa, mas o contexto permite uma leitura resultativa sombria: os que vêm combater acabam enchendo as estruturas de mortos. A alternativa mais formal permanece registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Furor» preserva o paralelismo intensivo sem soar arcaico demais. Os marcadores aparecem junto aos termos a que se referem, em ordem alfabética.
