- from: Eles vêm lutar contra os caldeus[a], mas apenas para enchê-las[b] de cadáveres humanos[c], daqueles que feri mortalmente na minha ira e no meu furor; escondi o meu rosto desta cidade por causa de toda a maldade deles.
  to: Eles vêm lutar contra os caldeus[a] e para enchê-los[b] de cadáveres das pessoas que feri na minha ira e no meu furor[c]; escondi o meu rosto desta cidade por causa de toda a maldade deles.
