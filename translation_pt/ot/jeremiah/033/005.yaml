    issue: «mas apenas para» é interpretativo
    rationale: וּלְמַלְאָם é coordenado com «vir para lutar» por וְ; embora o contexto possa sugerir um desfecho sombrio, «mas apenas» acrescenta uma oposição e exclusividade não marcadas explicitamente no hebraico.
