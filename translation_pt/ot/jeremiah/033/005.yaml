    rationale: «Cadáveres das pessoas que feri» reproduz mais diretamente פִּגְרֵי הָאָדָם אֲשֶׁר הִכֵּיתִי e dispensa explicitar «mortalmente», pois «cadáveres» já indica o resultado letal.
