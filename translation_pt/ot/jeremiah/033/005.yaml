  terminology: «Caldeus», «ira», «furor» e «escondi o meu rosto» são escolhas adequadas. A nota sobre os caldeus/babilônios é útil. O pronome de «encher» deve preservar a ambiguidade e a concordância formal do sufixo hebraico, sem resolver o referente no texto principal.
