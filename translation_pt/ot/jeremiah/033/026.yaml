base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: pt
  text: então eu também rejeitaria a descendência de Jacó e a de Davi, meu servo[a], e não escolheria, dentre a descendência dele, governantes sobre a descendência de Abraão, Isaque e Jacó. Pois restaurarei a sorte deles[b] e terei compaixão deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a semente de Jacó e a de Davi”; ao longo do versículo, o hebraico זֶרַע é um singular coletivo que também pode ser traduzido por “semente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “trarei de volta os seus cativos” ou “farei os seus exilados voltar”. A expressão idiomática hebraica pode referir-se especificamente ao retorno do exílio ou, de modo mais amplo, à restauração da situação do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: então eu também
  rationale: No contexto da condição irreal iniciada no versículo anterior, גַּם tem força aditiva e consequencial; “então... também” explicita essa ligação.
- source_word: זֶרַע יַעֲקוֹב וְדָוִד עַבְדִּי
  choice: a descendência de Jacó e a de Davi, meu servo
  rationale: “Descendência” traduz naturalmente o singular coletivo זֶרַע. A repetição de “a de” deixa claro em português que estão em vista tanto a linhagem de Jacó quanto a de Davi, preservando o título pactual “meu servo”.
- source_word: אֶמְאַס
  choice: eu rejeitaria
  rationale: O imperfeito completa a apódose da condição irreal do versículo anterior; o condicional em português preserva essa força, em vez de sugerir uma rejeição futura real.
- source_word: מִקַּחַת מִזַּרְעוֹ
  choice: deixando de escolher, entre os descendentes dele
  rationale: לקח pode ter aqui o sentido de tomar ou escolher pessoas para uma função. “Deixando de escolher” exprime com naturalidade a consequência da rejeição, e “dele” preserva o pronome hebraico cujo referente mais provável é Davi.
- source_word: מֹשְׁלִים אֶל זֶרַע
  choice: governantes sobre a descendência
  rationale: O particípio מֹשְׁלִים designa pessoas que governam, e אֶל marca aqui a esfera ou o objeto desse governo.
- source_word: אשוב אֶת שְׁבוּתָם
  choice: restaurarei a sorte deles
  rationale: A expressão idiomática pode indicar tanto o retorno do exílio quanto, de modo mais amplo, a reversão da situação adversa. A formulação escolhida mantém essa amplitude.
- source_word: וְרִחַמְתִּים
  choice: e terei compaixão deles
  rationale: רחם comunica misericórdia compassiva; “ter compaixão” preserva essa dimensão afetiva em linguagem corrente e digna.
theological_decisions:
- issue: Força condicional trazida do versículo anterior
  choice: Traduzir אֶמְאַס pelo condicional “rejeitaria”.
  alternative: Traduzir pelo futuro simples “rejeitarei”.
  rationale: O versículo conclui a condição irreal iniciada em Jeremias 33:25. O condicional evita transformar a negação implícita da rejeição em anúncio de uma rejeição futura.
- issue: Referente do sufixo em מִזַּרְעוֹ
  choice: Entender “dele” como referência a Davi.
  alternative: Entender o sufixo como referência a Jacó ou a Israel coletivamente.
  rationale: Davi é o antecedente singular mais próximo, e governantes provenientes de sua linhagem correspondem ao tema da promessa davídica no contexto. O pronome é mantido no texto, sem substituir explicitamente seu referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Isaque” segue a forma corrente no português bíblico brasileiro. A construção mantém a dependência condicional do contexto e preserva o pronome ambíguo “dele”, embora Davi seja o referente mais provável.
