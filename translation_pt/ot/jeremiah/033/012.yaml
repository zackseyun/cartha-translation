  naturalness: O português é moderno, claro e de registro apropriado. “Onde fazem os rebanhos repousar” é natural e evita a leve rigidez de “farão ... repousar”, sem perder o sentido prospectivo da declaração.
  terminology: “Yahweh dos Exércitos” é uma representação fiel e compreensível de יְהוָה צְבָאוֹת. “Gente nem animais” expressa com naturalidade a fórmula hebraica de ausência de seres humanos e animais. “Pastagem para pastores” é uma opção contextual plausível para נְוֵה רֹעִים; a nota preserva alternativas sem impor uma interpretação estreita.
