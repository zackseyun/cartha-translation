source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: Mais uma vez haverá, neste lugar — que está devastado, sem gente nem animais — e em todas as suas cidades, uma pastagem para pastores[a], onde fazem os rebanhos repousar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morada de pastores” ou “abrigo para pastores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת pela forma portuguesa clara e tradicional, sem restringir indevidamente o alcance do título.
- source_word: עוֹד יִהְיֶה
  choice: Mais uma vez haverá
  rationale: Expressa a restauração futura e a reversão do estado de devastação.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Mantém a referência locativa e a ênfase demonstrativa do hebraico.
- source_word: הֶחָרֵב
  choice: agora devastado
  rationale: Comunica o estado presente do lugar e contrasta naturalmente com a promessa de restauração.
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: sem gente nem animais
  rationale: Reproduz em português corrente a fórmula de despovoamento total, abrangendo seres humanos e animais.
- source_word: וּבְכָל עָרָיו
  choice: e em todas as suas cidades
  rationale: O sufixo masculino singular retoma o território designado por 'este lugar'; 'suas' é natural em português.
- source_word: נְוֵה רֹעִים
  choice: pastagens para os pastores
  rationale: No contexto de rebanhos que repousam, נְוֵה designa área pastoril; o plural se ajusta naturalmente à distribuição por todas as cidades.
- source_word: מַרְבִּצִים צֹאן
  choice: onde eles farão os rebanhos repousar
  rationale: Mantém a força causativa do particípio Hifil e explicita que os pastores fazem os rebanhos deitar-se e descansar.
theological_decisions:
- issue: Sentido de אָדָם na fórmula de despovoamento
  choice: gente
  alternative: ser humano; homem
  rationale: Aqui אָדָם não identifica um homem específico nem enfatiza sexo, mas a ausência de população humana em contraste com os animais. 'Gente' preserva esse sentido coletivo em português natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões delimitam a descrição do estado atual do lugar sem eliminar a relação sintática com a promessa. O nome Yahweh é transliterado; 'dos Exércitos' evita o arcaísmo menos transparente 'dos Exércitos celestiais' e não especifica além do hebraico.
