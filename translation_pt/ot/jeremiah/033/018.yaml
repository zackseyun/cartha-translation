base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: pt
  text: E aos sacerdotes levitas nunca faltará quem, diante de mim, ofereça holocaustos, queime ofertas de cereal e apresente sacrifícios continuamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeremias 33.14–26 não consta na antiga versão grega de Jeremias.
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: E aos sacerdotes levitas
  rationale: Mantém a preposição hebraica que introduz os sacerdotes como beneficiários da promessa e traduz de modo natural a identificação entre sacerdotes e levitas.
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: nunca faltará ... quem
  rationale: O idioma hebraico promete que o grupo sacerdotal jamais ficará sem um representante em serviço; evita sugerir que um único indivíduo viverá para sempre.
- source_word: מִלְּפָנַי
  choice: diante de mim
  rationale: Expressa diretamente o serviço sacerdotal na presença de Deus.
- source_word: מַעֲלֶה עוֹלָה
  choice: ofereça holocaustos
  rationale: O subjuntivo ligado a «quem» representa naturalmente o particípio hebraico, que descreve a atividade do representante sacerdotal.
- source_word: וּמַקְטִיר מִנְחָה
  choice: queime ofertas de cereal
  rationale: Preserva a imagem específica de fazer a oferta produzir fumaça sobre o altar, em vez de reduzir o verbo ao genérico «oferecer».
- source_word: וְעֹשֶׂה זֶּבַח
  choice: apresente sacrifícios
  rationale: Formulação portuguesa natural para a realização ritual de sacrifícios, mantendo a terceira atividade da série.
- source_word: כָּל הַיָּמִים
  choice: continuamente
  rationale: Comunica a duração ininterrupta indicada pelo idioma hebraico sem o literalismo pouco natural «todos os dias».
theological_decisions:
- issue: Se כרת deve ser reproduzido literalmente como «ser cortado» ou interpretado idiomaticamente como ausência de representante sacerdotal
  choice: nunca faltará ... quem
  alternative: nenhum homem será cortado de diante de mim
  rationale: No contexto, a promessa diz respeito à continuidade da linhagem e do serviço sacerdotal. A formulação idiomática conserva essa força sem criar a impressão indevida de imortalidade individual.
- issue: Como traduzir הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  alternative: os sacerdotes, os levitas
  rationale: Preserva a identificação textual dos sacerdotes com os levitas sem impor uma reconstrução histórica ou denominacional mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Holocaustos» preserva o termo sacrificial tradicional e preciso; «ofertas de cereal» evita a ambiguidade moderna de «ofertas de alimentos».
