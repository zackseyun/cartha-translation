  terminology: «Sacerdotes levitas», «holocaustos», «ofertas de cereal» e «sacrifícios» são termos adequados, compreensíveis e fiéis às categorias cultuais hebraicas. «Queime» preserva de modo legítimo o aspecto de fazer a oferta fumegar/queimar no altar.
