  source_fidelity: A tradução comunica corretamente a promessa de continuidade do serviço sacerdotal. «Nunca faltará ... quem» reproduz apropriadamente o sentido idiomático de לֹא יִכָּרֵת אִישׁ no contexto, sem sugerir a preservação perpétua de um indivíduo. As երեք ações cultuais e a duração contínua são preservadas.
