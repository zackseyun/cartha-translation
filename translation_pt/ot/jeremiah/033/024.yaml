revisions:
- from: Você não viu o que este povo anda dizendo? “As duas famílias que Yahweh escolheu, ele as rejeitou.” Assim, eles desprezam o meu povo, deixando de considerá-lo uma nação aos olhos deles.[a]
  to: 'Você não viu o que este povo disse: “As duas famílias que Yahweh escolheu — ele as rejeitou.” Assim, eles desprezam o meu povo, a ponto de não mais o considerarem uma nação diante deles.[a]'
  rationale: A revisão substitui a forma progressiva e coloquial «anda dizendo» por uma forma passada compatível com o perfeito hebraico e com a introdução da citação. Também ajusta a nota para distinguir melhor a formulação literal da explicação idiomática adotada no texto. A identificação das duas famílias e a ambiguidade contextual da cláusula final permanecem preservadas.
