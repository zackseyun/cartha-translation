base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: pt
  text: 'Você não viu o que este povo disse: “As duas famílias que Yahweh escolheu — ele as rejeitou.” Assim, eles desprezam o meu povo, a ponto de não mais o considerarem uma nação diante deles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “de deixar de ser ainda uma nação diante deles”. A expressão provavelmente significa “aos olhos deles” ou “na avaliação deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: Você não viu
  rationale: Mantém a pergunta retórica dirigida a uma pessoa e esperada como afirmação, em português natural.
- source_word: הָעָם הַזֶּה דִּבְּרוּ לֵאמֹר
  choice: o que este povo anda dizendo
  rationale: A construção hebraica literalmente diz que o povo falou, dizendo. A formulação portuguesa comunica fala corrente ou observada sem reproduzir uma redundância pouco natural.
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: as duas famílias
  rationale: “Famílias” é o equivalente direto e preserva a indefinição do referente, sem impor “reinos”, “casas” ou linhagens específicas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בָּחַר ... בָּהֶם
  choice: escolheu
  rationale: O complemento hebraico com ב é expresso idiomaticamente em português pelo verbo transitivo “escolher”.
- source_word: וַיִּמְאָסֵם
  choice: ele as rejeitou
  rationale: מָאַס comunica rejeição ou repúdio; “rejeitou” é claro e mantém a referência feminina plural a “famílias”.
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: Assim, eles desprezam o meu povo
  rationale: נָאַץ indica desprezo ou tratamento desdenhoso. “Assim” torna natural a ligação contextual entre a alegação citada e o desprezo resultante.
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: deixando de considerá-lo uma nação aos olhos deles
  rationale: Explicita em português idiomático que a cessação é a avaliação dos que desprezam o povo. “Aos olhos deles” comunica o valor contextual de לִפְנֵיהֶם sem afirmar que o povo objetivamente deixou de existir como nação.
theological_decisions:
- issue: Identidade das “duas famílias”
  choice: Manter “as duas famílias” sem identificá-las
  alternative: Israel e Judá; ou as linhagens de Davi e Levi
  rationale: O versículo não identifica explicitamente as duas famílias, embora o contexto permita mais de uma proposta. A tradução preserva essa ambiguidade genuína.
- issue: Sentido da oração final
  choice: Apresentá-la como a avaliação desdenhosa dos falantes
  alternative: Declarar que o povo deixou objetivamente de ser uma nação
  rationale: 'לִפְנֵיהֶם favorece a ideia de perspectiva ou avaliação: “diante deles/aos olhos deles”. A tradução evita transformar o desprezo dos falantes em afirmação ontológica do narrador.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem do discurso foi levemente ajustada para evitar a fórmula redundante “falou, dizendo”. O pronome “as” concorda com “famílias”, e “considerá-lo” retoma “meu povo”.
