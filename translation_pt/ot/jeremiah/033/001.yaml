id: JER.33.1
reference: Jeremiah 33:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh veio a Jeremias pela segunda vez, enquanto ele ainda estava detido no pátio da guarda[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no pátio da prisão». O hebraico provavelmente se refere a um pátio de detenção vigiado ou ao recinto da guarda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A construção narrativa introduz um novo acontecimento; em português, a fórmula «A palavra ... veio» é natural e preserva o fluxo sem reproduzir literalmente «e aconteceu».
- source_word: דְבַר יְהוָה
  choice: A palavra de Yahweh
  rationale: «Palavra» conserva a forma e a força da fórmula profética de revelação divina, sem a interpretação adicional de «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: Uso direcional comum de אֶל, vertido de modo natural em português.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Expressa com precisão a sequência indicada pelo advérbio, mais especificamente do que «novamente».
- source_word: וְהוּא עוֹדֶנּוּ
  choice: enquanto ele ainda estava
  rationale: Apresenta naturalmente a circunstância temporal simultânea à chegada da palavra divina.
- source_word: עָצוּר
  choice: detido
  rationale: O particípio passivo indica que Jeremias estava sob restrição; «detido» é atual e evita definir em excesso sua situação jurídica.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: no pátio da guarda
  rationale: «Pátio» traduz חָצֵר, e «da guarda» mantém a referência à área vigiada associada à detenção sem identificá-la inequivocamente como prisão.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz a fala direta no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, sem substituí-lo por um título; «Jeová» é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi ajustada à sintaxe natural do português, preservando a fórmula profética e a ambiguidade institucional de מַטָּרָה.
