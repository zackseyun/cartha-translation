reference: Jeremiah 33:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: pt
  text: Nas cidades da região montanhosa, nas cidades da Sefelá[a] e nas cidades do Neguebe[b], na terra de Benjamim, nos arredores de Jerusalém e nas cidades de Judá, os rebanhos voltarão a passar sob as mãos daquele que os conta[c], diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a região das colinas baixas”. A Sefelá é a região de colinas entre a serra de Judá e a planície costeira.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Sul”. Em hebraico, “o Neguebe”, região situada ao sul de Judá.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente “sob as mãos daquele que conta”, preservando a imagem de um pastor contando os animais à medida que passam.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: nas cidades da região montanhosa
  rationale: הָהָר designa aqui a região elevada ou montanhosa de Judá, não uma única montanha. “Região montanhosa” comunica claramente esse sentido geográfico.
- source_word: הַשְּׁפֵלָה
  choice: a Sefelá
  rationale: É o nome da região de colinas baixas situada entre a serra de Judá e a planície costeira. A transliteração preserva seu caráter de topônimo, com explicação em nota.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: O termo funciona como nome de uma região ao sul de Judá; “Neguebe” preserva essa referência geográfica específica, em vez de reduzi-la ao genérico “Sul”.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: a terra de Benjamim
  rationale: Mantém de perto a expressão hebraica e indica o território associado à tribo de Benjamim.
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: os arredores de Jerusalém
  rationale: Expressa naturalmente as áreas que circundam Jerusalém.
- source_word: עֹד תַּעֲבֹרְנָה הַצֹּאן
  choice: os rebanhos voltarão a passar
  rationale: עֹד, no contexto de restauração, indica a retomada futura de uma atividade interrompida. צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “rebanhos” conserva essa abrangência.
- source_word: עַל יְדֵי מוֹנֶה
  choice: sob as mãos daquele que os conta
  rationale: A formulação conserva a imagem concreta do pastor contando os animais à medida que passam sob suas mãos, sem substituí-la por uma interpretação abstrata como “ser cuidados”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
theological_decisions:
- issue: Imagem de restauração expressa pela contagem dos rebanhos
  choice: Conservar a imagem concreta dos rebanhos passando sob as mãos daquele que os conta.
  alternative: Parafrasear como rebanhos que voltarão a ser cuidadosamente pastoreados ou inspecionados.
  rationale: O hebraico retrata a restauração da vida pastoril normal. Manter a cena da contagem evita acrescentar uma interpretação teológica não explicitada no versículo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e distingue-o de um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário geográfico acessível. A enumeração e a imagem pastoril do hebraico foram preservadas, enquanto notas breves esclarecem os topônimos menos conhecidos.
