  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: pt
  text: 'o som de júbilo e o som de alegria, o som do noivo e o som da noiva, o som dos que dizem: “Deem graças a Yahweh dos Exércitos, porque Yahweh é bom, porque o seu amor leal permanece para sempre”[a], e dos que trazem uma oferta de ação de graças à casa de Yahweh. Pois restaurarei a sorte desta terra como antes[b], diz Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “a sua misericórdia permanece para sempre” ou “a sua fidelidade à aliança permanece para sempre”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “restaurarei o cativeiro desta terra”. O idioma hebraico pode referir-se tanto ao retorno dos cativos como, de modo mais amplo, à restauração da sorte do povo e da terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: o som de
  rationale: O termo pode indicar voz, som ou ruído. A repetição introduz diversos sons festivos, e “o som de” preserva o paralelismo poético em português.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: júbilo e alegria
  rationale: 'A dupla mantém dois termos distintos e naturais: “júbilo” expressa a exultação de שָׂשׂוֹן, enquanto “alegria” traduz de modo corrente שִׂמְחָה.'
- source_word: חָתָן וְכַלָּה
  choice: noivo e noiva
  rationale: É a forma corrente e digna em português para a fórmula nupcial hebraica.
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: No contexto litúrgico, o imperativo de ידה significa agradecer ou louvar; “deem graças” também mantém a relação semântica com a oferta de gratidão mencionada em seguida.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz diretamente o título צְבָאוֹת, sem substituí-lo por uma interpretação como “Todo-Poderoso”.
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: o seu amor leal permanece para sempre
  rationale: חֶסֶד reúne as ideias de amor, lealdade e misericórdia. “Amor leal” conserva essa densidade relacional, e “permanece” explicita naturalmente a oração nominal hebraica.
- source_word: תּוֹדָה
  choice: uma oferta de gratidão
  rationale: Como algo levado à casa de Yahweh, o termo tem aqui sentido sacrificial, e não apenas o de agradecimento verbal.
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: restaurarei a sorte desta terra
  rationale: A expressão funciona como idioma de restauração ampla no contexto, que inclui vida comunitária, casamentos e culto, sem excluir o retorno de cativos.
- source_word: כְּבָרִאשֹׁנָה
  choice: como no princípio
  rationale: Reproduz de perto a comparação hebraica e mantém o tom elevado da promessa profética.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança, em vez de substituí-lo por um título.
- issue: Alcance da fórmula שְׁבוּת
  choice: restaurarei a sorte desta terra
  alternative: restaurarei o cativeiro desta terra; trarei de volta os cativos desta terra
  rationale: O idioma hebraico admite referência ao retorno do cativeiro, mas também uma restauração mais abrangente. O contexto favorece a formulação ampla, enquanto a nota conserva a leitura mais literal ligada ao cativeiro.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; fidelidade à aliança
  rationale: A escolha preserva simultaneamente o aspecto afetivo e a constância relacional do termo, sem limitar sua riqueza a uma única categoria teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “o som de” conserva o ritmo profético; “noivo e noiva” evita arcaísmo; as ambiguidades de חֶסֶד e שְׁבוּת são preservadas em notas.
