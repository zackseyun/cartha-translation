  text: בַּ/יָּמִ֤ים הָ/הֵם֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וִ/ירוּשָׁלִַ֖ם תִּשְׁכּ֣וֹן לָ/בֶ֑טַח וְ/זֶ֥ה אֲשֶׁר יִקְרָא לָ֖/הּ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: pt
  text: 'Naqueles dias, Judá será salvo, e Jerusalém habitará em segurança. E este é o nome pelo qual ela será chamada[a]: “Yahweh é a nossa justiça.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e este é o que se chamará a ela”; trata-se de uma fórmula hebraica de atribuição de nome.
    reason: lexical_alternative
  - marker: b
    text: Jeremias 23:6 aplica o título estreitamente relacionado “Yahweh é a nossa justiça” ao rei davídico que viria; aqui, a gramática o aplica a Jerusalém, provavelmente retomando aquela promessa anterior.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Expressão temporal profética corrente, que introduz o período futuro de restauração prometida.
- source_word: תִּוָּשַׁע
  choice: será salvo
  rationale: O nifal de ישׁע indica ser salvo ou liberto; a forma passiva e a amplitude teológica do verbo são preservadas.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do povo e reino.
- source_word: וִירוּשָׁלִַם
  choice: e Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade, com a conjunção preservada.
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: habitará em segurança
  rationale: Preserva tanto a ideia de residência estável de שׁכן quanto a condição de segurança expressa por לָבֶטַח.
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: E este é o nome pelo qual ela será chamada
  rationale: Torna natural em português a fórmula hebraica de atribuição de nome. O pronome feminino remete gramaticalmente a Jerusalém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִדְקֵנוּ
  choice: é a nossa justiça
  rationale: O substantivo com sufixo de primeira pessoa plural significa 'nossa justiça'; o verbo 'é' é suprido para explicitar em português o sentido predicativo da fórmula nominal.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Referente feminino da fórmula de nomeação e sua relação com Jeremias 23:6
  choice: A fórmula é aplicada gramaticalmente a Jerusalém
  alternative: Entender a fórmula somente como título do rei davídico prometido
  rationale: O sufixo feminino לָהּ remete a Jerusalém neste versículo. A formulação muito próxima de Jeremias 23:6 cria uma tensão e uma associação literária significativas, preservadas em nota sem contrariar a gramática local.
- issue: Sentido de צֶדֶק na fórmula
  choice: justiça
  alternative: retidão
  rationale: '''Justiça'' é natural e mantém a amplitude relacional, jurídica e pactual do termo; ''retidão'' também é possível, mas pode estreitar sua ressonância no contexto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das orações e o paralelismo hebraico foram preservados, enquanto a fórmula de nomeação recebeu a forma idiomática necessária em português.
