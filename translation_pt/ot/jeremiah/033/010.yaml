base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: pt
  text: 'Assim diz o SENHOR: Mais uma vez se ouvirá neste lugar — do qual vocês dizem: “Está devastado, sem gente nem animais” —, nas cidades de Judá e nas ruas de Jerusalém, que estão desoladas, sem gente, sem moradores e sem animais,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz o SENHOR
  rationale: Preserva a fórmula profética tradicional; “SENHOR” representa o nome divino יהוה segundo uma convenção portuguesa amplamente reconhecida.
- source_word: עוֹד יִשָּׁמַע
  choice: Ainda se ouvirá
  rationale: Mantém a construção passiva e a expectativa de restauração, deixando a frase em aberto como no hebraico, cuja continuação aparece no versículo seguinte.
- source_word: חָרֵב הוּא
  choice: Está devastado
  rationale: חָרֵב descreve um lugar arruinado ou devastado; esta formulação é natural e preserva a força do estado de destruição.
- source_word: מֵאֵין אָדָם וּמֵאֵין בְּהֵמָה
  choice: sem gente nem animais
  rationale: “Gente” comunica אָדָם de modo corrente e coletivo; o plural genérico “animais” soa natural em português.
- source_word: בְחֻצוֹת יְרוּשָׁלִַם
  choice: nas ruas de Jerusalém
  rationale: חֻצוֹת pode designar espaços exteriores, ruas ou praças; “ruas” se ajusta ao contexto urbano e à tradição de tradução sem estreitar excessivamente a imagem.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem moradores
  rationale: Expressa o particípio יוֹשֵׁב no sentido contextual de quem habita ou reside no lugar.
theological_decisions:
- issue: Representação do tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção consolidada das Bíblias em português e a camada inglesa auditada, sem acrescentar interpretação doutrinária.
- issue: Caráter incompleto da oração no limite do versículo
  choice: Manter a frase aberta com vírgula final
  alternative: Completar implicitamente o que será ouvido
  rationale: O objeto de “se ouvirá” vem no versículo 11. Mantê-lo em aberto respeita a sintaxe hebraica e evita importar conteúdo do versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição deliberada de “sem” preserva a ênfase hebraica; os travessões esclarecem o encaixe sintático sem alterar o sentido.
