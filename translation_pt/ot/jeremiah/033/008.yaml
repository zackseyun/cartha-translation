base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: pt
  text: Eu os purificarei de toda a culpa dos pecados que cometeram contra mim[a] e perdoarei todas as suas maldades, pelas quais pecaram contra mim e se rebelaram contra mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de toda a sua iniquidade com a qual pecaram contra mim”. O termo hebraico pode designar tanto a maldade cometida quanto a culpa que dela resulta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas as suas iniquidades, com as quais pecaram contra mim e se rebelaram contra mim”. Aqui, o mesmo termo hebraico aparece no plural e pode se referir às muitas transgressões culpáveis deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Eu os purificarei
  rationale: O piel de טהר expressa tornar puro ou limpo. “Purificarei” conserva a dimensão moral e a possível ressonância cultual sem restringir o sentido a um rito.
- source_word: מִכָּל עֲוֺנָם
  choice: de toda a culpa dos pecados que cometeram
  rationale: עָוֹן pode indicar tanto a perversidade cometida quanto a culpa resultante. A formulação explicita de modo natural em português a culpa da qual Deus os purifica e liga essa culpa aos pecados praticados.
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: dos pecados que cometeram contra mim
  rationale: חטא com לִי descreve pecado dirigido contra Deus. Em português corrente, “pecados que cometeram contra mim” evita a construção pouco natural “culpa pela qual pecaram”.
- source_word: וְסָלַחְתִּי
  choice: e perdoarei
  rationale: סלח é o verbo comum para o perdão concedido por Deus; “perdoarei” é claro, direto e idiomático.
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: todas as suas maldades
  rationale: O plural עֲוֺנוֹתֵיהֶם aponta para as muitas transgressões culpáveis. “Maldades” é acessível e mantém alguma distinção em relação a חטא, sem recorrer ao menos corrente “iniquidades” no texto principal.
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: e se rebelaram contra mim
  rationale: פשע denota transgressão deliberada ou rebelião contra autoridade legítima. “Rebelaram-se contra mim” preserva sua força relacional e volitiva.
theological_decisions:
- issue: 'Vocabulário sobreposto para pecado: עָוֹן, חטא e פשע'
  choice: Distinguir “culpa/maldades”, “pecaram” e “se rebelaram”
  alternative: Traduzir todos os termos simplesmente por “pecado” ou usar “iniquidade(s)” para עָוֹן
  rationale: O hebraico acumula termos relacionados, mas não idênticos. A tradução conserva as dimensões de culpa, atos maus, pecado contra Deus e rebelião, sem transformá-las em categorias doutrinárias rígidas.
- issue: Ambiguidade de עָוֹן entre ato perverso e culpa decorrente
  choice: Usar “culpa” na primeira ocorrência e “maldades” na segunda, com notas que preservam as alternativas
  alternative: Empregar o mesmo equivalente nas duas ocorrências
  rationale: O contexto de purificação favorece “culpa” na primeira ocorrência, enquanto o plural como objeto de “perdoar” permite destacar os atos culpáveis. As notas registram a amplitude lexical do termo e evitam apresentar essa diferenciação contextual como absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar relações pronominais artificiais, preservando o paralelismo, a ação divina e a diferenciação do vocabulário hebraico sobre pecado.
