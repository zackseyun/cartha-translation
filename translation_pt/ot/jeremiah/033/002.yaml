id: JER.33.2
reference: Jeremiah 33:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה עֹשָׂ֑/הּ יְהוָ֗ה יוֹצֵ֥ר אוֹתָ֛/הּ לַ/הֲכִינָ֖/הּ יְהוָ֥ה שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: pt
  text: 'Assim diz Yahweh[a], aquele que a faz[b], Yahweh, que a forma para a estabelecer[c] — Yahweh é o seu nome:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui transliterado como “Yahweh”; muitas traduções usam “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: 'Também se pode traduzir: “aquele que a fez”. Os particípios hebraicos podem descrever uma ação presente ou característica, embora o contexto também permita entendê-la como realizada.'
    reason: lexical_alternative
  - marker: c
    text: Os pronomes em “a faz”, “a forma” e “a estabelecer” são femininos no hebraico, mas o versículo não identifica explicitamente o referente.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula hebraica que introduz uma declaração profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשָׂהּ
  choice: aquele que a faz
  rationale: Conserva o particípio hebraico e o sufixo feminino singular sem acrescentar um referente que o versículo não identifica.
- source_word: יוֹצֵר אוֹתָהּ
  choice: que a forma
  rationale: Mantém o sentido de dar forma intencionalmente e o paralelismo com 'a faz'.
- source_word: לַהֲכִינָהּ
  choice: para a estabelecer
  rationale: Expressa a ideia causativa de tornar firme ou firmemente constituída, preservando também o sufixo feminino.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Mantém a estrutura solene da cláusula hebraica de identificação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. A transliteração preserva a distinção entre esse nome e títulos como 'Senhor'.
- issue: Referente dos sufixos femininos em עֹשָׂהּ, אוֹתָהּ e לַהֲכִינָהּ
  choice: Manter o pronome feminino 'a', sem explicitar o referente
  alternative: Inserir 'a cidade', 'a terra' ou empregar uma formulação neutra
  rationale: Embora os sufixos sejam femininos, este versículo isoladamente não identifica de maneira explícita aquilo a que se referem; especificá-lo resolveria indevidamente a ambiguidade.
- issue: Valor temporal dos particípios עֹשֶׂה e יוֹצֵר
  choice: 'Presente: ''faz'' e ''forma'''
  alternative: 'Passado: ''fez'' e ''formou'''
  rationale: Os particípios permitem uma descrição presente ou característica da ação divina; o presente conserva essa abertura sem impedir que a ação tenha em vista uma obra determinada.
translation_notes:
  register: Português moderno, claro e solene, com cadência profética. A repetição de “Yahweh” foi preservada, assim como a ambiguidade do referente feminino e o valor potencialmente contínuo dos particípios.
