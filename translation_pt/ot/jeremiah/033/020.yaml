  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Se vocês puderem romper minha aliança com o dia e minha aliança com a noite[a], de modo que dia e noite não estejam em seu tempo determinado,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se vocês romperem minha aliança com o dia e minha aliança com a noite”. O hebraico expressa formalmente a condição sem o verbo “poder”; o texto principal evidencia seu sentido retórico no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de modo que não haja dia e noite em seu tempo determinado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional e verte diretamente o nome divino.
- source_word: אִם תָּפֵרוּ
  choice: Se vocês puderem romper
  rationale: O hifil de פרר significa romper, anular ou violar uma aliança. “Puderem” explicita com naturalidade a força retórica de uma condição impossível no contexto, enquanto a nota registra a forma mais estrita.
- source_word: בְּרִיתִי
  choice: minha aliança
  rationale: “Aliança” é a correspondência corrente e adequada para בְּרִית, mantendo a linguagem pactuai do texto.
- source_word: הַיּוֹם ... הַלָּיְלָה
  choice: o dia ... a noite
  rationale: Mantém o paralelismo definido e a imagem da ordem regular da criação.
- source_word: וּלְבִלְתִּי הֱיוֹת
  choice: de modo que deixe de haver
  rationale: Reproduz a ideia de não existência ou não ocorrência resultante, sem introduzir um verbo de movimento ausente do hebraico.
- source_word: בְּעִתָּם
  choice: no tempo determinado para cada um
  rationale: Comunica que dia e noite têm, cada qual, seu tempo fixado; a formulação evita a possível estranheza de “no tempo deles” em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Força da condição אִם תָּפֵרוּ
  choice: Se vocês puderem romper
  alternative: Se vocês romperem
  rationale: O contexto apresenta uma condição retórica impossível para afirmar a certeza da promessa divina. A leitura principal torna essa força perceptível, e a alternativa formal fica preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A construção mantém o paralelismo hebraico e a condição retórica, sem resolver silenciosamente a alternativa formal.
