  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: pt
  text: Restaurarei a sorte de Judá e a sorte de Israel[a] e os reconstruirei como eram no princípio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “farei Judá e Israel voltar do cativeiro” ou “farei voltar os cativos de Judá e de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: Restaurarei
  rationale: 'O hifil de שׁוב tem aqui sentido causativo: fazer voltar ou restaurar. Em português, “restaurarei” expressa naturalmente a reversão da perda e do exílio.'
- source_word: שְׁבוּת
  choice: a sorte
  rationale: Na expressão idiomática הֵשִׁיב שְׁבוּת, “restaurar a sorte” comunica uma restauração ampla, sem limitar a promessa ao retorno geográfico. A possível referência ao cativeiro é preservada em nota.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome nacional e tribal.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada; ao lado de Judá, designa conjuntamente o povo restaurado.
- source_word: וּבְנִתִים
  choice: e os reconstruirei
  rationale: בנה pode significar construir ou reconstruir. O contexto de restauração após a devastação favorece “reconstruirei”. O sufixo masculino plural retoma Judá e Israel.
- source_word: כְּבָרִאשֹׁנָה
  choice: como eram no princípio
  rationale: A expressão aponta para uma condição anterior. Esta formulação preserva a comparação e explicita naturalmente que Judá e Israel serão restabelecidos como antes.
theological_decisions:
- issue: Alcance de שְׁבוּת no oráculo de restauração
  choice: restaurarei a sorte
  alternative: farei voltar os cativos; restaurarei do cativeiro
  rationale: A expressão pode abranger a reversão completa da condição de perda, embora o exílio e o retorno permaneçam em vista. O texto principal mantém essa amplitude, e a nota conserva as alternativas mais literais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A sorte” é usado no sentido de condição ou situação, não de acaso; a nota esclarece o pano de fundo do cativeiro.
