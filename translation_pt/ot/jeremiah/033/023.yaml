  text: And the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a Jeremias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה, combinada com דְּבַר, é expressa naturalmente em português pela fórmula “a palavra ... veio”, sem o arcaísmo de “aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “palavra” preserva de modo transparente o caráter de revelação divina; “mensagem” seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Indica naturalmente o destinatário da palavra em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente a fala divina subsequente e mantém a fórmula profética do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da fórmula profética. Não há nota textual necessária neste versículo; a informação sobre o nome divino foi incorporada às decisões editoriais, sem marcador no texto.
