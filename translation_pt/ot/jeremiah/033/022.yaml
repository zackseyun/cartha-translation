  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: pt
  text: Assim como não se pode contar o exército dos céus[a], nem medir a areia do mar, assim multiplicarei a descendência[b] de Davi, meu servo, e os levitas que me servem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “exército dos céus” designa a multidão celestial e muitas vezes inclui as estrelas.
    reason: cultural_note
  - marker: b
    text: Ou “semente de Davi” ou “descendentes de Davi”.
    reason: lexical_alternative
  - marker: c
    text: Ou “que ministram a mim”; o hebraico pode indicar serviço cultual contínuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: o exército dos céus
  rationale: Preserva a expressão hebraica para a multidão celestial, que neste contexto provavelmente inclui as estrelas, sem restringi-la explicitamente a elas.
- source_word: לֹא יִסָּפֵר
  choice: não se pode contar
  rationale: Expressa com naturalidade o sentido passivo de algo que não pode ser contado ou enumerado.
- source_word: חוֹל הַיָּם
  choice: a areia do mar
  rationale: Reproduz diretamente a conhecida imagem hebraica de uma quantidade imensa.
- source_word: לֹא יִמַּד
  choice: nem medir
  rationale: Mantém o paralelismo com contar e traduz o sentido de ser impossível medir.
- source_word: כֵּן אַרְבֶּה
  choice: assim multiplicarei
  rationale: 'Conserva tanto a comparação introduzida por כֵּן quanto o sentido causativo de רבה: tornar numeroso, multiplicar.'
- source_word: זֶרַע דָּוִד
  choice: a descendência de Davi
  rationale: Traduz o substantivo coletivo זֶרַע de modo claro e atual; evita a possível leitura estritamente biológica ou singular de 'semente'.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto régio e pactual, designa Davi como servo designado por Deus, não enfatizando escravidão.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Emprega a designação tribal consagrada e plenamente compreensível em português.
- source_word: מְשָׁרְתֵי אֹתִי
  choice: que ministram a mim
  rationale: O particípio indica serviço contínuo, especialmente de caráter cultual. 'Ministram' preserva essa nuance melhor que o termo mais amplo 'servem'.
theological_decisions:
- issue: Relação entre a descendência davídica e os levitas na promessa
  choice: A promessa de multiplicação abrange, em paralelo, tanto a descendência de Davi quanto os levitas que ministram a Deus.
  alternative: Ler os levitas apenas em referência aos ministros do templo no horizonte histórico de Jeremias, ou explicar a promessa segundo um cumprimento messiânico posterior específico.
  rationale: O hebraico coordena dois objetos de 'multiplicarei'. A tradução mantém essa estrutura e não determina como a promessa se cumpre além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sem sacrificar a fluidez. A expressão idiomática 'exército dos céus' foi mantida e esclarecida em nota.
