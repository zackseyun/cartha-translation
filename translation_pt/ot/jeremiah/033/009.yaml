review_pass:
  verdict: revise
  source_fidelity: O sujeito e o referente final femininos são corretamente preservados por “Ela” e “a ela”, em consonância com a personificação de Jerusalém. A reação das nações e a amplitude de shalom são mantidas. Contudo, “motivo de louvor e de glória” reformula desnecessariamente a construção paralela hebraica “para louvor e glória”.
  naturalness: O texto é claro e tem registro profético apropriado. “Para louvor e glória” é mais direto, mais natural no paralelismo e mais próximo da formulação hebraica do que “motivo de louvor e de glória”.
  terminology: “Paz” é uma boa tradução principal de shalom, com nota lexical adequada. Na nota, “plenitude” comunica melhor o componente de inteireza/wholeness do que “integridade”, que em português tende a sugerir probidade moral.
  issues:
  - severity: low
    issue: Reformulação de לִתְהִלָּה וּלְתִפְאֶרֶת como “motivo de louvor e de glória”
    rationale: A expressão é compreensível, mas introduz a ideia de causalidade (“motivo de”) e enfraquece o paralelismo com “um nome de alegria”. “Para louvor e glória” conserva de modo mais transparente a relação expressa pelas preposições hebraicas.
  - severity: low
    issue: “Integridade” na explicação de shalom
    rationale: Embora possa cobrir parcialmente a noção de completude, em português moderno normalmente designa retidão moral. “Plenitude” evita essa associação e representa melhor o campo semântico de shalom.
