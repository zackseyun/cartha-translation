  to: Ela será para mim um nome de alegria, para louvor e glória diante de todas as nações da terra, que ouvirão falar de todo o bem que estou fazendo por eles. Elas temerão e tremerão por causa de todo o bem e de toda a paz[a] que estou proporcionando a ela.
