source:
  edition: WLC
  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: pt
  text: Ela será para mim um nome de alegria, para louvor e glória diante de todas as nações da terra, que ouvirão falar de todo o bem que estou fazendo por eles. Elas temerão e tremerão por causa de todo o bem e de toda a paz[a] que estou proporcionando a ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o bem-estar” ou “toda a prosperidade”. A palavra hebraica shalom inclui paz, bem-estar, prosperidade e plenitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: Ela será para mim
  rationale: O verbo está no feminino singular, e לָּהּ no fim do versículo confirma um referente feminino, naturalmente a cidade/Jerusalém no contexto. “Ela” preserva a personificação.
- source_word: לְשֵׁם שָׂשׂוֹן
  choice: um nome de alegria
  rationale: Mantém a imagem hebraica de שֵׁם como nome ou renome associado à alegria, sem reduzi-la apenas a fama.
- source_word: לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: motivo de louvor e de glória
  rationale: Em português, “motivo de” expressa naturalmente que a cidade restaurada ocasionará louvor e glória, preservando o tom público e elevado dos substantivos.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: diante de todas as nações da terra
  rationale: “Diante de” comunica a ideia de reputação pública perante as nações.
- source_word: אֲשֶׁר יִשְׁמְעוּ
  choice: que ouvirão falar de
  rationale: “Ouvir falar de” é idiomático em português para receber notícia dos atos de Deus.
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: todo o bem que estou fazendo por eles
  rationale: O bem designa benefícios concretos, e “fazer por eles” comunica o valor benéfico do idioma hebraico.
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: Elas temerão e tremerão
  rationale: Preserva os dois verbos e a amplitude da reação, que pode envolver temor, espanto e tremor diante da ação divina.
- source_word: עַל כָּל הַטּוֹבָה
  choice: por causa de todo o bem
  rationale: 'A preposição עַל tem força causal neste contexto: a reação das nações é causada pelo bem concedido.'
- source_word: וְעַל כָּל הַשָּׁלוֹם
  choice: e de toda a paz
  rationale: “Paz” é a correspondência principal de שָׁלוֹם; uma nota conserva sua abrangência sem sobrecarregar o texto.
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: que estou proporcionando a ela
  rationale: Com “paz” como objeto, “proporcionar” expressa naturalmente em português o sentido literal de fazer ou produzir em favor dela.
theological_decisions:
- issue: Natureza da reação das nações à restauração realizada por Deus
  choice: temor e tremor diante da bênção divina
  alternative: terror hostil ou mera agitação política
  rationale: Os verbos permitem uma reação intensa e potencialmente ambivalente. Como o bem e a paz são a causa explícita, a tradução preserva o temor reverente ou assombrado sem eliminar totalmente a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A personificação feminina da cidade foi mantida. O pronome “eles” em “por eles” preserva a mudança do referente feminino singular para o grupo de habitantes implícito no contexto; “elas” retoma explicitamente “as nações”.
