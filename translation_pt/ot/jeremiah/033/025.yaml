  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם לֹ֥א בְרִיתִ֖/י יוֹמָ֣ם וָ/לָ֑יְלָה חֻקּ֛וֹת שָׁמַ֥יִם וָ/אָ֖רֶץ לֹא שָֽׂמְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Se não estabeleci a minha aliança com o dia e a noite, nem fixei as determinações do céu e da terra—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e translitera o nome divino pessoal expresso no texto hebraico.
- source_word: אִם לֹא
  choice: Se não
  rationale: Mantém a forma condicional da prótase e sua força retórica, que só se completa no versículo seguinte.
- source_word: בְרִיתִי
  choice: a minha aliança
  rationale: Conserva o sentido usual e teologicamente significativo de בְּרִית no contexto, sem reduzi-lo apenas à ideia de ordem natural.
- source_word: יוֹמָם וָלָיְלָה
  choice: com o dia e a noite
  rationale: Expressa naturalmente em português o âmbito relacional da aliança estabelecida por Deus com a alternância de dia e noite.
- source_word: חֻקּוֹת
  choice: as leis que regem
  rationale: No contexto cósmico, o termo indica determinações fixas ou regularidades instituídas; esta formulação evita um sentido meramente jurídico e permanece compreensível ao leitor comum.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: o céu e a terra
  rationale: Reproduz o merismo hebraico convencional para o cosmos em português natural.
- source_word: לֹא שָׂמְתִּי
  choice: nem fixei
  rationale: Comunica o ato de colocar, determinar ou instituir a ordem cósmica. O segundo elemento negativo explicita em português a coordenação compacta do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a aliança e a ordem criada
  choice: Manter 'aliança' e também as leis que regem o cosmos
  alternative: Parafrasear בְרִית como simples 'ordem estabelecida'
  rationale: A redação conserva tanto a linguagem de aliança quanto a referência à regularidade da criação, sem eliminar a tensão metafórica e teológica do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. O travessão final preserva a prótase incompleta, cuja conclusão aparece no versículo seguinte. A repetição verbal implícita foi explicitada de modo discreto para produzir sintaxe portuguesa natural.
