  revised_text: 'Assim diz Yahweh: “Se não estabeleci a minha aliança com o dia e a noite, nem fixei as determinações do céu e da terra—'
  revised_footnotes:
  - marker: a
    text: 'Ou: “os estatutos” ou “as ordenanças”.'
    reason: Alternativas lexicais para חֻקּוֹת, que neste contexto designa determinações ou uma ordem estabelecida.
