source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: pt
  text: 'Pois assim diz Yahweh, o Deus de Israel, a respeito das casas desta cidade e das casas dos reis de Judá[a], que estão sendo demolidas para fazer frente[b] às rampas de cerco[c] e à espada[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos palácios dos reis de Judá”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “para” ou “em direção a”; no contexto, também pode ter o sentido de “contra”.
    reason: source_ambiguity
  - marker: c
    text: Ou “aterros de cerco” ou “obras de cerco”.
    reason: lexical_alternative
  - marker: d
    text: “A espada” é uma figura hebraica para a guerra ou a matança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior e conserva a força causal ou explicativa da partícula.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética de mensageiro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e idiomática da cadeia construta hebraica.
- source_word: עַל
  choice: a respeito de
  rationale: Aqui introduz o assunto do pronunciamento divino, sem implicar necessariamente hostilidade.
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: as casas desta cidade
  rationale: Mantém a estrutura e a referência contextual à cidade, provavelmente Jerusalém.
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: as casas dos reis de Judá
  rationale: Preserva a repetição de בַּיִת; no contexto régio, 'palácios' continua sendo uma alternativa possível e é registrada em nota.
- source_word: הַנְּתֻצִים
  choice: que estão sendo demolidas
  rationale: O particípio passivo descreve as construções no processo ou estado de serem derrubadas; a forma progressiva comunica bem a ação contemporânea ao cerco.
- source_word: אֶל
  choice: para fazer frente
  rationale: A preposição significa literalmente 'para, em direção a' e, neste contexto militar, pode indicar finalidade ou oposição. A formulação portuguesa comunica a função defensiva sem ocultar a construção incomum.
- source_word: הַסֹּלְלוֹת
  choice: as rampas de cerco
  rationale: Designa aterros ou rampas construídos para operações de cerco; esta opção é concreta e acessível.
- source_word: הֶחָרֶב
  choice: a espada
  rationale: Conserva a imagem hebraica, na qual a espada representa por metonímia a guerra ou a matança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva sua função de nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Relação das demolições com as obras de cerco e a espada
  choice: para fazer frente
  alternative: por causa de; contra; em direção a
  rationale: A construção com אֶל admite mais de uma nuance. No contexto, as casas parecem ser derrubadas em resposta às obras de cerco e à guerra, mas a tradução e a nota preservam a dificuldade sintática em vez de definir com precisão não expressa como os materiais seriam usados.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula profética mantém solenidade sem arcaísmo excessivo. A repetição de “casas” foi preservada deliberadamente, e as ambiguidades relativas a “palácios”, à preposição אֶל e à imagem da espada foram mantidas em notas.
