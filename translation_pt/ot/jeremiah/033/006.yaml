  text: הִנְ/נִ֧י מַעֲלֶה לָּ֛/הּ אֲרֻכָ֥ה וּ/מַרְפֵּ֖א וּ/רְפָאתִ֑י/ם וְ/גִלֵּיתִ֣י לָ/הֶ֔ם עֲתֶ֥רֶת שָׁל֖וֹם וֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: pt
  text: Eis que estou trazendo para ela restauração e cura; eu os curarei e lhes revelarei abundância de paz e verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”, em vez de “verdade”; o termo hebraico pode denotar verdade, confiabilidade ou fidelidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 'Vejam:'
  rationale: A partícula introduz um anúncio divino solene e enfático. “Vejam” é atual e compreensível, mantendo a força dêitica sem recorrer ao arcaizante “eis”.
- source_word: מַעֲלֶה לָּהּ
  choice: trarei a ela
  rationale: O particípio hifil expressa a ação divina apresentada como iminente. A formulação mantém o sentido causativo e conserva o referente feminino singular, a cidade personificada.
- source_word: אֲרֻכָה וּמַרְפֵּא
  choice: restauração e cura
  rationale: Os dois substantivos próximos evocam a recuperação de uma ferida e a saúde resultante. “Restauração e cura” preserva a duplicidade lexical sem repetição artificial.
- source_word: וּרְפָאתִים
  choice: eu os curarei
  rationale: Preserva a mudança do feminino singular, referente à cidade, para o plural, referente aos seus habitantes, bem como o valor futuro do perfeito no discurso profético.
- source_word: וְגִלֵּיתִי
  choice: e lhes revelarei
  rationale: O piel de גלה tem aqui o sentido de revelar ou dar a conhecer, formulação natural diante do objeto abstrato.
- source_word: עֲתֶרֶת
  choice: abundância de
  rationale: O substantivo indica grande quantidade ou plenitude; “abundância” é claro e evita confusão com o homógrafo associado a “coroa”.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” mantém a tradução central de שָׁלוֹם e sua ressonância profética, embora o termo também possa abranger bem-estar e integridade.
- source_word: אֱמֶת
  choice: verdade
  rationale: “Verdade” é uma correspondência direta e natural, enquanto a nota preserva a nuance igualmente possível de fidelidade.
theological_decisions:
- issue: Mudança de referente entre o feminino singular e o plural
  choice: Manter “a ela” para a cidade personificada e “os/lhes” para os habitantes.
  alternative: Uniformizar os pronomes e tratar todas as formas como referência à cidade ou à comunidade.
  rationale: O hebraico muda deliberadamente do feminino singular לָּהּ para os sufixos plurais em וּרְפָאתִים e לָהֶם. Preservar essa mudança conserva a dinâmica entre a cidade personificada e seu povo.
- issue: Amplitude semântica de אֱמֶת
  choice: Usar “verdade” no texto principal.
  alternative: fidelidade; confiabilidade
  rationale: O termo comporta verdade, firmeza e fidelidade. A escolha principal não elimina a alternativa legítima, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vejam” evita o arcaísmo de “eis”, enquanto a estrutura conserva o tom solene do anúncio profético e a mudança pronominal do original.
