id: JER.33.14
reference: Jeremiah 33:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: pt
  text: “Eis que vêm dias”, declara Yahweh, “em que cumprirei a boa palavra[a] que falei à casa de Israel e a respeito da casa de Judá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a boa promessa”. O hebraico diz literalmente “a boa palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz solenemente o anúncio profético e preserva sua força de chamar a atenção, sendo uma fórmula bíblica ainda compreensível em português.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de maneira natural e próxima ao hebraico a fórmula profética que anuncia um tempo futuro.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa com dignidade a fórmula profética e translitera diretamente o nome divino.
- source_word: וַהֲקִמֹתִי
  choice: cumprirei
  rationale: No hifil de קום, tendo como objeto uma palavra anteriormente proferida, indica fazê-la permanecer ou realizá-la; 'cumprirei' comunica esse sentido idiomático.
- source_word: הַדָּבָר הַטּוֹב
  choice: a boa palavra
  rationale: Preserva o sentido básico de דָּבָר e a ligação lexical com 'falei', sem substituir a expressão pela interpretação mais específica 'boa promessa'.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: Traduz diretamente o verbo 'falar', evitando explicitar como 'prometi' aquilo que o contexto apenas implica.
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: à casa de Israel e a respeito da casa de Judá
  rationale: Mantém a diferença formal entre as preposições hebraicas אֶל ('a') e עַל ('a respeito de'), preservando uma ambiguidade real que traduções mais fluidas podem nivelar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de הַדָּבָר הַטּוֹב
  choice: a boa palavra
  alternative: a boa promessa
  rationale: Embora o contexto seja promissório, 'palavra' mantém a formulação e a ligação verbal do hebraico, sem resolver interpretativamente o substantivo.
- issue: Diferença entre אֶל e עַל diante das duas casas
  choice: à casa de Israel e a respeito da casa de Judá
  alternative: à casa de Israel e à casa de Judá
  rationale: A opção principal conserva a assimetria preposicional do texto massorético; a alternativa a entende como variação estilística com referência conjunta aos dois povos.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com legibilidade brasileira. 'Eis que' conserva o tom profético; a construção preposicional mantém de modo deliberado a assimetria do hebraico.
