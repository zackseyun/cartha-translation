id: JER.33.21
reference: Jeremiah 33:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: pt
  text: também poderá ser quebrada a minha aliança com Davi, meu servo, de modo que ele deixe de ter um filho reinando em seu trono, bem como a minha aliança com os sacerdotes levitas[a], meus ministros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “os levitas, os sacerdotes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: Preserva a força aditiva e a correspondência com a condição do versículo anterior, sem acrescentar ao texto um conectivo temporal explícito.
- source_word: בְּרִיתִי תֻפַר
  choice: poderá ser quebrada a minha aliança
  rationale: O hofal de פרר exprime a quebra ou anulação da aliança. O modal “poderá” comunica naturalmente o valor da oração condicional no contexto.
- source_word: אֶת דָּוִד עַבְדִּי
  choice: com Davi, meu servo
  rationale: No contexto de בְּרִית, אֶת indica a parte com quem a aliança foi estabelecida. O título pactual “meu servo” é mantido.
- source_word: מִהְיוֹת לוֹ
  choice: de modo que ele deixe de ter
  rationale: A construção com מִן e o infinitivo expressa a consequência da hipotética quebra da aliança; esta formulação é natural em português e mantém essa relação.
- source_word: בֵן מֹלֵךְ עַל כִּסְאוֹ
  choice: um filho reinando em seu trono
  rationale: Mantém o termo concreto “filho”, a ação contínua do particípio e a imagem régia do trono, sem substituir a linguagem dinástica por uma interpretação abstrata.
- source_word: וְאֶת הַלְוִיִּם הַכֹּהֲנִים
  choice: bem como a minha aliança com os sacerdotes levitas
  rationale: A repetição elíptica de “aliança” é explicitada para clareza em português. “Sacerdotes levitas” expressa de modo corrente a identificação do grupo, enquanto a nota preserva a forma apositiva do hebraico.
- source_word: מְשָׁרְתָי
  choice: meus ministros
  rationale: Conserva o sentido de pessoas que exercem serviço ministerial ou cultual diante de Deus, além da relação possessiva do texto.
theological_decisions:
- issue: Promessa dinástica a Davi
  choice: um filho reinando em seu trono
  alternative: um descendente reinando em seu trono
  rationale: A tradução retém a linguagem filial concreta do hebraico e sua ligação com a aliança davídica, sem impor neste versículo uma identificação messiânica posterior.
- issue: Identificação do grupo sacerdotal
  choice: os sacerdotes levitas
  alternative: os levitas, os sacerdotes
  rationale: A formulação principal é clara e natural em português, ao passo que a nota registra a possível leitura apositiva e mais formal da expressão hebraica.
- issue: Elipse da segunda aliança
  choice: bem como a minha aliança com os sacerdotes levitas
  alternative: e com os sacerdotes levitas
  rationale: Repetir “a minha aliança” em português torna explícita a estrutura coordenada já indicada por בְּרִיתִי e evita que os sacerdotes sejam entendidos como simples complemento da oração anterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe explicita a elipse da segunda referência à aliança sem alterar o sentido; a terminologia pactual, dinástica e sacerdotal permanece formal.
