  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/019.yaml
  text: And the word of Yahweh came to Jeremiah, saying,
translation:
  language: pt
  text: 'A palavra de Yahweh veio a Jeremias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz a sequência e se integra naturalmente à fórmula portuguesa «A palavra ... veio», sem recorrer ao arcaizante «E aconteceu».
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, «palavra» conserva de modo transparente a expressão recorrente de revelação divina; «mensagem» seria possível, mas menos formalmente próxima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca Jeremias como destinatário da palavra divina; na construção «veio a», esta é a equivalência natural em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta que vem a seguir; «dizendo» preserva essa função e a fórmula do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, sem substituí-lo pelo título «Senhor»; «Jeová» reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima à fórmula profética hebraica. O «E» inicial não foi explicitado porque o wayyiqtol funciona aqui como introdução sequencial e sua omissão produz português mais natural sem perda relevante. Mantém-se «dizendo» para sinalizar a fala direta do versículo seguinte.
