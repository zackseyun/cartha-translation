  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: pt
  text: Eis que eu sou Yahweh, o Deus de toda a carne. Será que alguma coisa é difícil demais para mim?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Será que alguma coisa será maravilhosa demais para mim?” O verbo hebraico pode indicar algo extraordinário ou além da capacidade de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força solene do marcador de atenção que introduz a autodeclaração divina, em registro bíblico ainda compreensível.
- source_word: אֲנִי
  choice: eu sou
  rationale: Explicita naturalmente em português a cópula subentendida na oração nominal hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: o Deus de toda a carne
  rationale: Preserva a expressão hebraica e sua amplitude, sem restringi-la interpretativamente apenas à humanidade.
- source_word: הֲמִמֶּנִּי יִפָּלֵא כָּל דָּבָר
  choice: Será que alguma coisa é difícil demais para mim?
  rationale: Reproduz como pergunta retórica natural a ideia de algo que excederia a capacidade de Deus, mantendo o alcance universal de כָּל דָּבָר.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva a referência ao nome divino sem convertê-lo em título.
- issue: Alcance de כָּל בָּשָׂר
  choice: toda a carne
  alternative: toda a humanidade; todo ser vivo
  rationale: A formulação literal conserva a amplitude e a ressonância bíblica da expressão, evitando decidir se o referente aqui deve ser limitado aos seres humanos.
- issue: Sentido de יִפָּלֵא
  choice: difícil demais
  alternative: maravilhosa demais; impossível
  rationale: No contexto, o verbo aponta para aquilo que estaria além da capacidade de alguém. A escolha expressa essa força sem reduzir o termo simplesmente a “impossível”; a nuance de algo extraordinário é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leve elevação bíblica em “Eis que” e preservação deliberada do idioma “toda a carne”. O marcador [a] aparece no texto principal junto à pergunta a que se refere.
