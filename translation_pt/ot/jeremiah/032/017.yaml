  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: pt
  text: Ah, Senhor DEUS! Eis que tu fizeste os céus e a terra com o teu grande poder e com o teu braço estendido. Nada é difícil demais para ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah!
  rationale: Preserva a interjeição hebraica de forte emoção, que aqui introduz a oração de Jeremias.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה por meio da convenção tipográfica DEUS, evitando repetir 'Senhor Senhor'.
- source_word: הִנֵּה אַתָּה עָשִׂיתָ
  choice: Tu fizeste
  rationale: O pronome explícito mantém a ênfase em Deus como agente. O הִנֵּה funciona como partícula enfática, e seu valor é expresso naturalmente pela ênfase pronominal, sem o artificial 'eis que'.
- source_word: בִזְרֹעֲךָ הַנְּטוּיָה
  choice: com o teu braço estendido
  rationale: Mantém literalmente a imagem bíblica do poder divino em ação.
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: Nada é difícil demais para ti
  rationale: Comunica o sentido idiomático de que nenhuma coisa ou situação excede a capacidade de Deus, sem restringir דָּבָר a 'palavra'.
theological_decisions:
- issue: Alcance da afirmação sobre o poder de Deus
  choice: Nada é difícil demais para ti
  alternative: Nada te é maravilhoso demais
  rationale: O verbo פלא pode envolver aquilo que é extraordinário ou humanamente impossível; no contexto, a frase afirma que nada ultrapassa o poder de Deus. A tradução evita acrescentar formulações sistemáticas não presentes no verso.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira e vocabulário amplamente internacional. Mantém o paralelismo e a imagem do hebraico sem recorrer ao arcaísmo 'eis'.
