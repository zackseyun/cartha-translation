  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
translation:
  language: pt
  text: 'Jeremias disse: “A palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma consonantal hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol faz a narrativa avançar. Em português, “disse” expressa naturalmente a sequência; acrescentar “e” seria possível, mas menos fluente neste início de fala.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: הָיָה דְבַר־יְהוָה אֵלַי
  choice: A palavra de Yahweh veio a mim
  rationale: Traduz de modo idiomático a fórmula profética de revelação, preservando “palavra” e a direção da comunicação ao profeta.
- source_word: דְבַר
  choice: palavra
  rationale: Mantém a correspondência lexical com דָּבָר e a fórmula profética tradicional; “mensagem” seria possível, porém mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Correspondência direta da preposição אֶל com o sufixo de primeira pessoa singular.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula introdutória que liga este versículo ao conteúdo da fala divina no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e a distinção em relação ao título אֲדֹנָי, enquanto a nota registra a substituição tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva o tom profético e mantém “dizendo” para preparar a continuação no versículo seguinte.
