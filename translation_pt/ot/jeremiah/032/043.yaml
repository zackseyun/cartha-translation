  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: pt
  text: 'Campos serão comprados nesta terra, da qual vocês dizem: “Ela está devastada, sem gente nem animais; foi entregue nas mãos dos caldeus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִקְנָה הַשָּׂדֶה
  choice: Campos serão comprados
  rationale: O nifal de קנה expressa a compra em voz passiva. Embora הַשָּׂדֶה esteja no singular, o uso é coletivo neste contexto de futuras transações de terras; o plural é natural em português. Não se acrescenta “novamente”, pois essa ideia decorre do contexto, mas não está lexicalmente expressa no versículo.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” é natural em Jeremias e preserva a dimensão territorial do termo.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: da qual vocês dizem
  rationale: Mantém a oração relativa e identifica a terra como objeto da avaliação dos interlocutores.
- source_word: שְׁמָמָה הִיא
  choice: Ela está devastada
  rationale: Comunica em português corrente o estado de desolação indicado pelo substantivo predicativo hebraico, sem a formulação menos natural “é uma desolação”.
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: sem gente nem animais
  rationale: Expressa com clareza moderna a ausência de seres humanos e animais. “Gente” preserva o sentido genérico de אָדָם, e “nem” é a coordenação idiomática após “sem”.
- source_word: נִתְּנָה בְּיַד
  choice: foi entregue nas mãos
  rationale: O perfeito passivo indica que a terra foi entregue ao poder inimigo. “Nas mãos” conserva de modo natural a imagem idiomática hebraica.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva a designação histórica específica do texto hebraico, em vez de substituí-la interpretativamente por “babilônios”.
theological_decisions:
- issue: Sentido genérico de אָדָם na fórmula de ausência
  choice: gente
  alternative: ser humano; pessoas; homem
  rationale: Aqui אָדָם não identifica um indivíduo masculino, mas seres humanos em geral. “Gente” é amplo, claro e natural em português, sem alterar a relação tradicional entre população humana e animais.
- issue: Restauração implícita na futura compra de campos
  choice: não acrescentar “novamente”
  alternative: Campos voltarão a ser comprados
  rationale: O contexto comunica restauração e retomada das transações, mas וְנִקְנָה não contém um termo correspondente a “novamente”. A tradução evita tornar explícito no versículo aquilo que permanece uma implicação discursiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural אַתֶּם. A citação direta conserva o contraste entre a avaliação presente da terra e a promessa de restauração.
