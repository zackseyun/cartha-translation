id: JER.32.36
reference: Jeremiah 32:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: pt
  text: 'Agora, portanto, assim diz Yahweh, o Deus de Israel, a respeito desta cidade, da qual vocês dizem: “Ela foi entregue nas mãos do rei da Babilônia pela espada, pela fome e pela peste[a]”:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peste” também pode ser traduzido por “epidemia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Agora, portanto
  rationale: Preserva tanto a transição temporal quanto a relação inferencial, em formulação natural e digna em português.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética tradicional e reconhecível sem recorrer a linguagem obsoleta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção que identifica Yahweh como o Deus de Israel.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: a respeito desta cidade
  rationale: Neste contexto de fala, אֶל introduz o assunto da declaração; esta formulação é clara e idiomática.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: da qual vocês dizem
  rationale: Conserva a relação sintática com 'cidade' e usa 'vocês' para o plural explícito e amplamente compreensível.
- source_word: נִתְּנָה
  choice: Ela foi entregue
  rationale: O perfeito nifal apresenta a cidade como entregue ao poder do rei da Babilônia; o pretérito perfeito português preserva essa perspectiva sem acrescentar aspecto progressivo não explicitado.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: nas mãos do rei da Babilônia
  rationale: Reproduz de modo natural o idioma hebraico de sujeição ao poder ou controle de alguém.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Preserva a tríade concreta e recorrente dos meios de juízo, com paralelismo claro em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Aspecto de נִתְּנָה
  choice: foi entregue
  alternative: está sendo entregue; está entregue
  rationale: A forma perfeita admite nuances contextuais, mas aqui a fala trata a entrega como fato consumado ou certo. A tradução escolhida preserva o valor perfectivo; alternativas aspectuais não são impostas ao texto.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A pontuação final com dois-pontos mantém a continuidade sintática com o versículo seguinte. O pronome “vocês” expressa claramente o plural hebraico.
