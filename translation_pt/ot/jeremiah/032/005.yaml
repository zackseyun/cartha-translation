  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: pt
  text: Ele levará Zedequias para a Babilônia, e ali ele permanecerá até que eu intervenha a respeito dele — declara o SENHOR. Ainda que vocês lutem contra os caldeus, não terão êxito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹלִךְ
  choice: levará
  rationale: O hifil de הלך expressa fazer ir ou conduzir; “levará” comunica isso de modo natural, mantendo o sujeito implícito do hebraico.
- source_word: עַד־פָּקְדִי אֹתוֹ
  choice: até que eu intervenha a respeito dele
  rationale: פקד pode indicar visitar, ocupar-se de alguém ou intervir em sua situação, para bem ou para mal. A formulação evita decidir antecipadamente se a intervenção será favorável ou punitiva.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: É a designação histórica tradicional e inteligível para os babilônios neste contexto.
- source_word: לֹא תַצְלִיחוּ
  choice: não terão êxito
  rationale: O verbo צלח aqui denota obter sucesso ou prosperar numa ação; “ter êxito” é corrente e digno em português.
theological_decisions:
- issue: Sentido de פקד em relação a Zedequias
  choice: intervenha a respeito dele
  alternative: cuide dele / castigue-o
  rationale: O texto não especifica aqui se a visitação divina implica cuidado, julgamento ou simplesmente uma mudança determinada por Deus; a tradução preserva essa abertura.
- issue: Valor conjuntivo de כִּי antes da oração sobre a luta
  choice: Ainda que
  alternative: Se / Pois
  rationale: 'No contexto, a oração funciona como concessão: mesmo combatendo os caldeus, os destinatários não obterão êxito. Essa leitura acompanha a camada de consulta auditada sem eliminar a força da afirmação.'
- issue: Representação do tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida, distinguindo o nome divino por versaletes tipográficos representados aqui em maiúsculas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a repetição pronominal necessária para indicar que Zedequias permanecerá na Babilônia, e usa-se “vocês” para a segunda pessoa plural dirigida aos ouvintes.
