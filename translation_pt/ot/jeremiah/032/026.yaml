  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/026.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh[a] veio a Jeremias, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH; também traduzido como «Jeová».
    reason: Registra a forma hebraica do nome divino e uma transliteração alternativa tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá continuidade à sequência narrativa. Em português atual, a construção idiomática «Então ... veio» preserva o avanço da narrativa sem recorrer ao arcaísmo «e aconteceu que».
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, «a palavra» é a tradução tradicional e transparente, preservando tanto a forma quanto o peso teológico da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário a quem a palavra foi dirigida; «veio a Jeremias» é uma formulação natural e digna em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa estabelecida do nome próprio.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo do discurso divino; «dizendo» conserva de modo claro a fórmula narrativa hebraica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto a nota registra uma forma alternativa conhecida sem substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A ordem foi ajustada de modo idiomático, preservando a fórmula profética e o particípio introdutório «dizendo» para ligar o versículo ao discurso seguinte.
