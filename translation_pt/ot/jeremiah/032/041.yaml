base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: pt
  text: Eu me alegrarei por causa deles, para lhes fazer o bem, e os plantarei nesta terra com fidelidade[a], de todo o meu coração e de toda a minha alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em verdade” ou “verdadeiramente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  choice: Eu me alegrarei por causa deles
  rationale: O verbo ששׂ expressa alegria intensa, e עַל indica aqueles que são motivo dessa alegria. A formulação é natural em português e mantém o forte sentido afetivo.
- source_word: לְהֵיטִיב אוֹתָם
  choice: para lhes fazer o bem
  rationale: O infinitivo construto expressa propósito ou resultado. “Fazer-lhes o bem” preserva o idioma hebraico de modo claro e digno.
- source_word: וּנְטַעְתִּים
  choice: e os plantarei
  rationale: Mantém a metáfora agrícola de נטע, importante nas promessas de restauração em Jeremias, sem substituí-la pela interpretação “estabelecerei”.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” corresponde adequadamente a אֶרֶץ no contexto da restauração da aliança.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: אֱמֶת pode significar verdade, firmeza ou fidelidade. Aqui, a promessa de Deus e a expressão de seu compromisso total favorecem “com fidelidade”; a ambiguidade legítima é preservada em nota.
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: de todo o meu coração e de toda a minha alma
  rationale: Conserva a linguagem antropomórfica e o paralelismo hebraico que expressam compromisso pessoal e integral.
theological_decisions:
- issue: Linguagem antropomórfica sobre o compromisso interior de Deus
  choice: de todo o meu coração e de toda a minha alma
  alternative: com todo o meu ser; com total dedicação
  rationale: O hebraico atribui explicitamente a Deus “coração” e “alma” para comunicar seu compromisso pessoal e completo. Preservar essa forma evita reduzir a força relacional da promessa a uma abstração.
- issue: Sentido de בֶּאֱמֶת na promessa de restauração
  choice: com fidelidade
  alternative: em verdade; verdadeiramente
  rationale: O contexto destaca a firmeza e a confiabilidade de Deus ao restaurar seu povo. Como “em verdade” e “verdadeiramente” continuam lexicalmente possíveis, aparecem na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a metáfora de plantar e a linguagem antropomórfica do hebraico. A colocação pronominal foi ajustada ao uso natural contemporâneo sem perder solenidade.
