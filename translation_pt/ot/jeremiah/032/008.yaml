source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: pt
  text: 'Então Hanamel, filho do meu tio, veio até mim no pátio da guarda, conforme a palavra de Yahweh, e me disse: “Por favor, compre o meu campo que fica em Anatote, na terra de Benjamim, pois cabe a você o direito de herança, e o resgate cabe a você.[a] Compre-o para você”. Então soube que essa era a palavra de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “o direito de resgate cabe a você”. O hebraico diz literalmente “o resgate é seu”, referindo-se ao direito ou dever jurídico de um parente resgatar uma propriedade da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: A preposição כְּ indica conformidade com o que havia sido anunciado anteriormente; a formulação preserva a ligação narrativa com a palavra divina precedente.
- source_word: חֲצַר הַמַּטָּרָה
  choice: pátio da guarda
  rationale: Designa o pátio vigiado onde Jeremias estava confinado, sem defini-lo de modo excessivamente específico como prisão.
- source_word: קְנֵה נָא
  choice: Por favor, compre
  rationale: קנה significa comprar ou adquirir neste contexto imobiliário, e נָא atenua o imperativo, dando-lhe tom de pedido.
- source_word: שָׂדִי
  choice: meu campo
  rationale: שָׂדֶה significa normalmente campo e é natural no contexto da compra de uma propriedade rural.
- source_word: בַּעֲנָתוֹת
  choice: em Anatote
  rationale: A preposição portuguesa “em” expressa naturalmente a localização do campo junto à cidade mencionada.
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: cabe a você o direito de herança
  rationale: מִשְׁפָּט tem aqui sentido jurídico de direito ou reivindicação, enquanto יְרֻשָּׁה se refere à herança ou posse transmissível.
- source_word: הַגְּאֻלָּה
  choice: o resgate cabe a você
  rationale: No contexto de propriedade familiar, “resgate” comunica melhor que “redenção” o ato jurídico de recuperar o bem; a formulação próxima do hebraico preserva a possível dimensão tanto de direito quanto de responsabilidade, esclarecida em nota.
- source_word: קְנֵה לָךְ
  choice: Compre-o para você
  rationale: O dativo לָךְ tem sentido idiomático de adquirir o campo para si; o pronome objeto torna a frase clara em português.
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: Então soube que essa era a palavra de Yahweh
  rationale: A frase registra o reconhecimento de Jeremias de que o acontecimento confirmava a mensagem divina anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido jurídico de הַגְּאֻלָּה
  choice: o resgate cabe a você
  alternative: você tem o direito de resgate; você tem o dever de resgate
  rationale: O substantivo pode envolver o direito e também a responsabilidade do parente de recuperar a propriedade familiar. A tradução evita decidir silenciosamente entre essas duas dimensões.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura jurídica do pedido foi preservada sem tecnicismo excessivo; “resgate” foi preferido a “redenção” por se tratar de propriedade familiar.
