  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: pt
  text: 'porque Zedequias, rei de Judá, o havia mantido preso[a], dizendo: “Por que você profetiza: ‘Assim diz Yahweh: Eis que estou entregando esta cidade nas mãos do rei da Babilônia, e ele a conquistará’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o havia detido” ou “o havia encarcerado”.'
    reason: Alternativas lexicais para כלא, que pode designar confinamento, detenção ou prisão.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: porque
  rationale: Neste contexto, a partícula liga o versículo à explicação iniciada no anterior e introduz a razão da prisão de Jeremias, em vez de funcionar apenas como pronome relativo.
- source_word: כְּלָאוֹ
  choice: o havia mantido preso
  rationale: כלא expressa restrição ou encarceramento. A formulação é clara e natural, e o mais-que-perfeito situa a ação antes da fala citada.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz discurso direto; “dizendo” conserva de modo conciso sua função quotativa.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente direto e idiomático da pergunta pela razão.
- source_word: נִבָּא
  choice: você profetiza
  rationale: O nifal de נבא significa “profetizar”; o presente comunica naturalmente a censura do rei.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e verte o nome divino como nome próprio.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que estou entregando
  rationale: “Eis que” mantém a solenidade e a vivacidade de הִנְנִי, enquanto o gerúndio com “estar” representa o particípio hebraico como ação iminente e certa.
- source_word: בְּיַד
  choice: nas mãos do
  rationale: Mantém a imagem hebraica de ser colocado sob o poder de alguém, em expressão corrente no português.
- source_word: וּלְכָדָהּ
  choice: e ele a conquistará
  rationale: לכד, quando tem uma cidade por objeto, indica tomá-la militarmente; o pronome masculino retoma naturalmente o rei da Babilônia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome pessoal. “Yahweh” o translitera sem substituí-lo por um título.
- issue: Aspecto temporal de נֹתֵן na declaração profética
  choice: estou entregando
  alternative: entregarei; estou para entregar
  rationale: O particípio apresenta a ação divina futura como iminente ou já em curso. A tradução conserva essa vivacidade sem eliminar a tensão entre presente e futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Manteve-se a estrutura de continuação iniciada por “porque”, a fórmula profética solene e a imagem hebraica “nas mãos”. O tratamento por “você” torna a interpelação clara e natural sem alterar seu teor.
