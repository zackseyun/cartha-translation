source:
  edition: WLC
  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: pt
  text: '“Eis que Hanamel, filho de Salum, seu tio, vem até você, dizendo: ‘Compre meu campo que está em Anatote, pois você tem o direito de resgate[a] para comprá-lo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também “o direito legal de resgate” ou “o direito de recompra”. O hebraico se refere ao direito ligado ao parentesco de resgatar uma propriedade da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força apresentativa e a imediatez do anúncio hebraico em linguagem bíblica ainda clara no português moderno.
- source_word: חֲנַמְאֵל
  choice: Hanamel
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: דֹּדְךָ
  choice: seu tio
  rationale: Neste contexto de parentesco e resgate de propriedade, דּוֹד designa um tio, e não um amado.
- source_word: בָּא אֵלֶיךָ
  choice: virá até você
  rationale: O particípio apresenta uma ação iminente; o futuro em português comunica naturalmente essa proximidade no discurso profético.
- source_word: לֵאמֹר
  choice: e dirá
  rationale: Introduz de modo idiomático o discurso direto e se harmoniza com a ação iminente anunciada.
- source_word: קְנֵה לְךָ
  choice: Compre para você
  rationale: Preserva tanto o imperativo de קנה quanto o dativo reflexivo לְךָ, embora em português fosse possível dizer apenas “compre”.
- source_word: שָׂדִי
  choice: o meu campo
  rationale: Representa concretamente שָׂדֶה como propriedade rural sem ampliar o sentido para toda uma extensão de terra.
- source_word: בַּעֲנָתוֹת
  choice: em Anatote
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: o direito de resgate
  rationale: Expressa o caráter jurídico e familiar da prerrogativa de recuperar uma propriedade da família.
- source_word: לִקְנוֹת
  choice: para comprá-lo
  rationale: O pronome retoma explicitamente “campo”, tornando natural em português o complemento do infinitivo hebraico.
- source_word: כִּי לְךָ
  choice: pois é seu
  rationale: Apresenta a razão da ordem e conserva a ideia de que o direito cabe ao destinatário.
theological_decisions:
- issue: Sentido de גְּאֻלָּה na legislação da terra
  choice: resgate em sentido jurídico e familiar
  alternative: recompra da propriedade
  rationale: O contexto trata do direito ligado ao parentesco para recuperar terra da família; a formulação evita espiritualizar o termo, mas conserva sua linguagem jurídica e pactual.
- issue: Relação sintática de “seu tio”
  choice: manter no texto a sequência próxima do hebraico e explicar a ambiguidade em nota
  alternative: identificar inequivocamente Hanamel ou Salum como o tio
  rationale: A construção hebraica pode ser relacionada de maneiras diferentes aos nomes precedentes. A nota impede que uma interpretação sintática seja imposta silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com “Eis que” para preservar a apresentação enfática do hebraico. A forma de tratamento “você” favorece ampla legibilidade brasileira. A ordem dos constituintes mantém visível a ambiguidade de parentesco, esclarecida em nota.
