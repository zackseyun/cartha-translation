base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: pt
  text: Vieram e tomaram posse dela, mas não deram ouvidos à tua voz nem andaram nas tuas leis.[a] Não fizeram tudo o que lhes ordenaste que fizessem, e trouxeste sobre eles toda esta desgraça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem viveram de acordo com as tuas instruções”. O hebraico traz torot, plural de torá, que pode significar “leis” ou “instruções”; aqui se refere ao ensino de Deus no contexto da aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “chamaste sobre eles toda esta desgraça”, expressão idiomática que significa fazê-la vir sobre eles. Ou: “toda esta calamidade”.'
    reason: idiom_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Vieram
  rationale: O qal narrativo de בוא descreve a chegada ou entrada na terra; em português, “vieram” é natural no fluxo do relato, enquanto o contexto deixa claro o movimento para dentro dela.
- source_word: וַיִּרְשׁוּ אֹתָהּ
  choice: tomaram posse dela
  rationale: Em contextos ligados à terra, ירשׁ denota adquirir e ocupar como possessão. A expressão evita reduzir o sentido a uma herança meramente jurídica.
- source_word: וְלֹא שָׁמְעוּ בְקוֹלֶךָ
  choice: não deram ouvidos à tua voz
  rationale: A formulação conserva “tua voz” e expressa em português corrente a ideia de ouvir com obediência.
- source_word: וּבְתוֹרֹתֶךָ לֹא הָלָכוּ
  choice: nem andaram na tua lei
  rationale: A metáfora de “andar” descreve a conduta orientada pelo ensino divino. “Lei” funciona como coletivo natural em português para a instrução pactual de Deus, embora a forma hebraica seja plural.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: Não fizeram tudo o que lhes ordenaste que fizessem
  rationale: A tradução preserva a abrangência de כָּל e a repetição semântica do verbo “fazer”, mantendo também a possível tensão quanto ao alcance da desobediência.
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: e trouxeste sobre eles toda esta desgraça
  rationale: A construção com קרא é idiomática e descreve fazer a calamidade alcançar o povo. “Trouxeste sobre eles” comunica o resultado com clareza, e “desgraça” expressa רָעָה como calamidade de juízo, não como mal moral.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: tua lei
  alternative: tua instrução
  rationale: O contexto trata das obrigações de Israel na terra. “Lei” comunica o aspecto normativo e pactual, sem excluir o sentido mais amplo de ensino, registrado em nota.
- issue: Sentido de רָעָה como ação judicial divina
  choice: toda esta desgraça
  alternative: todo este mal
  rationale: Aqui o termo se refere à calamidade sofrida como juízo da aliança. “Desgraça” evita sugerir que Deus pratique mal moral.
- issue: Relação entre a desobediência e a calamidade
  choice: e trouxeste
  alternative: por isso, trouxeste
  rationale: Mantém-se a conjunção hebraica de modo formal, sem explicitar além do texto a relação consequencial, embora o contexto a torne evidente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se a imagem pactual de “andar”, a referência relacional à “voz” de Deus e a segunda pessoa singular (“tua”, “ordenaste”, “trouxeste”), coerente com a oração dirigida diretamente a Deus.
