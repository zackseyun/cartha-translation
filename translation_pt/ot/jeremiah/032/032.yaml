source:
  edition: WLC
  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: pt
  text: por causa de toda a maldade que os filhos de Israel e os filhos de Judá[a] cometeram para me provocar à ira[b] — eles, seus reis, seus oficiais, seus sacerdotes, seus profetas, os homens de Judá[c] e os habitantes de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o povo de Israel e o povo de Judá”. Literalmente: “os filhos de Israel e os filhos de Judá”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para me irritar”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “cada homem de Judá”. O hebraico traz “homem” no singular, empregado coletivamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: por causa de
  rationale: A preposição expressa aqui a causa do juízo mencionado no contexto anterior.
- source_word: כָּל רָעַת
  choice: toda a maldade
  rationale: רָעָה denota neste contexto mal moral, e כָּל lhe dá sentido abrangente.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: os filhos de Israel e os filhos de Judá
  rationale: Mantém a forma masculina e a imagem genealógica do hebraico, sem impedir que a expressão funcione coletivamente.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que ... cometeram
  rationale: Em português, 'cometer maldade' é natural e explicita a relação verbal sem acrescentar uma nova ideia ao texto.
- source_word: לְהַכְעִסֵנִי
  choice: para me provocar à ira
  rationale: Preserva a força causativa do hifil de כעס e o sentido de provocar a ira divina.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente é retomado de modo enfático antes da enumeração dos grupos responsáveis.
- source_word: מַלְכֵיהֶם
  choice: seus reis
  rationale: Correspondência possessiva direta.
- source_word: שָׂרֵיהֶם
  choice: seus oficiais
  rationale: שָׂרִים designa autoridades ou administradores; 'oficiais' é atual e evita restringir o termo a príncipes de sangue real.
- source_word: כֹּהֲנֵיהֶם
  choice: seus sacerdotes
  rationale: Equivalente português corrente e direto.
- source_word: וּנְבִיאֵיהֶם
  choice: seus profetas
  rationale: Equivalente português corrente; a coordenação é transmitida pela pontuação da lista.
- source_word: וְאִישׁ יְהוּדָה
  choice: os homens de Judá
  rationale: O singular אִישׁ tem força coletiva ou distributiva neste contexto; o plural natural em português conserva a referência masculina.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: e os habitantes de Jerusalém
  rationale: Expressa naturalmente o particípio substantivado que designa a população residente.
theological_decisions:
- issue: Linguagem coletiva marcada pelo masculino em בְּנֵי e אִישׁ
  choice: Preservar as expressões como 'filhos' e 'homens'
  alternative: Traduzir como 'povo de Israel e povo de Judá' e 'povo de Judá'
  rationale: O hebraico emprega termos masculinos com alcance coletivo. A tradução mantém essa forma representativa, enquanto notas registram alternativas sem neutralizá-la silenciosamente.
- issue: A ira divina em לְהַכְעִסֵנִי
  choice: Explicitar 'provocar à ira'
  alternative: Traduzir de modo mais breve como 'irritar-me' ou 'provocar-me'
  rationale: A formulação preserva a força causativa do verbo e não atenua a reação divina expressa no hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A abertura em minúscula conserva a continuidade sintática com o versículo anterior. O travessão reproduz a retomada enfática de הֵמָּה e torna clara a enumeração.
