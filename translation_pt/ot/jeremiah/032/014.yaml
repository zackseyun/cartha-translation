  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: pt
  text: 'Assim diz Javé dos Exércitos, o Deus de Israel: “Pegue estes documentos[a] — esta escritura de compra, tanto a cópia selada como esta cópia aberta[b] — e coloque-os num recipiente de barro, para que se conservem por muitos dias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estes rolos”. O termo hebraico pode designar escritos em geral; aqui se trata dos documentos jurídicos da transação.
    reason: lexical_alternative
  - marker: b
    text: Ou “este documento não selado”. O hebraico contrapõe este exemplar ao documento selado.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Javé dos Exércitos
  rationale: Translitera em forma portuguesa corrente o nome divino e verte צְבָאוֹת pelo título tradicional e inteligível “dos Exércitos”, que abrange as forças sob o comando de Deus.
- source_word: לָקוֹחַ
  choice: Pegue
  rationale: O infinitivo absoluto tem aqui força de ordem; “pegue” comunica a instrução com naturalidade no português moderno.
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: estes documentos
  rationale: סְפָרִים pode designar escritos ou rolos em sentido amplo; no contexto da transação imobiliária, “documentos” expressa melhor sua função jurídica.
- source_word: סֵפֶר הַמִּקְנָה
  choice: esta escritura de compra
  rationale: A expressão designa o registro jurídico da aquisição do terreno; “escritura de compra” preserva tanto o caráter documental quanto o legal.
- source_word: הֶחָתוּם
  choice: a cópia selada
  rationale: O adjetivo substantivado se refere à forma selada da escritura. “Cópia” é explicitado para tornar clara em português a relação entre os dois exemplares, sem alterar o contraste.
- source_word: סֵפֶר הַגָּלוּי
  choice: esta cópia aberta
  rationale: גָּלוּי contrasta com “selada” e indica o exemplar aberto, isto é, não selado; a nota conserva essa alternativa lexical.
- source_word: בִּכְלִי חָרֶשׂ
  choice: num recipiente de barro
  rationale: A expressão indica um recipiente feito de cerâmica; “recipiente de barro” é claro e não especifica indevidamente seu formato.
- source_word: לְמַעַן יַעַמְדוּ
  choice: para que se conservem
  rationale: O sentido contextual é a permanência e preservação dos documentos ao longo do tempo, não o ato literal de ficarem em pé.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Mantém a expressão temporal hebraica de modo natural e preserva sua possível ideia de longa duração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Yahweh; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Javé” é uma transliteração portuguesa corrente que preserva o nome próprio, em vez de substituí-lo por um título; não se pretende afirmar certeza absoluta sobre a vocalização antiga.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões apresentam os documentos seguintes como explicação de “estes documentos”. A concordância plural em “coloque-os” e “se conservem” retoma o conjunto documental. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
