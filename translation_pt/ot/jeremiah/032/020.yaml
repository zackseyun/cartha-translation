    issue: “fazendo assim um nome para ti”
    rationale: O particípio gerundivo não corresponde bem ao wayyiqtol hebraico (“e fizeste”), e “assim” acrescenta uma conexão não lexicalizada. A expressão também soa pouco idiomática em português.
  - severity: low
    issue: “como se vê neste dia”
    rationale: A formulação é compreensível, mas “neste dia” é menos natural no português atual; “como hoje se vê” transmite a comparação כַּיּוֹם הַזֶּה com maior fluência.
  revised_text: tu que realizaste sinais e maravilhas na terra do Egito, em Israel e entre os seres humanos[a] até hoje, e fizeste para ti um nome, como hoje se vê.
