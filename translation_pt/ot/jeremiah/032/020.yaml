  text: אֲשֶׁר שַׂ֠מְתָּ אֹת֨וֹת וּ/מֹפְתִ֤ים בְּ/אֶֽרֶץ מִצְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בְ/יִשְׂרָאֵ֖ל וּ/בָֽ/אָדָ֑ם וַ/תַּעֲשֶׂה לְּ/ךָ֥ שֵׁ֖ם כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: pt
  text: tu que realizaste sinais e maravilhas na terra do Egito, em Israel e entre os seres humanos[a] até hoje, e fizeste para ti um nome, como hoje se vê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre a humanidade”. O hebraico אָדָם é aqui um termo coletivo para os seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: realizaste
  rationale: Embora שׂוּם signifique literalmente “pôr” ou “colocar”, com “sinais e maravilhas” o sentido idiomático é realizar tais atos; “realizaste” é natural em português e preserva o valor contextual.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: sinais e maravilhas
  rationale: Reproduz a combinação hebraica tradicional e distingue os sinais que comunicam significado dos atos que causam espanto.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém אֶרֶץ e a concretude geográfica da expressão hebraica.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português corrente da expressão temporal hebraica; sua posição permite entendê-la em relação à continuidade dos atos e de sua notoriedade.
- source_word: וּבְיִשְׂרָאֵל
  choice: em Israel
  rationale: Traduz naturalmente o valor espacial ou associativo da preposição בְּ neste contexto.
- source_word: וּבָאָדָם
  choice: entre os seres humanos
  rationale: אָדָם tem sentido coletivo e genérico, abrangendo a humanidade, não um indivíduo específico.
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: fazendo assim um nome para ti
  rationale: Conserva a imagem do idioma hebraico, que significa estabelecer para si renome ou reputação.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê neste dia
  rationale: Explicita com naturalidade que o renome resultante dos atos de Deus é uma realidade observável no presente, sem reduzir a expressão simplesmente a “hoje”.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: entre os seres humanos
  alternative: entre a humanidade
  rationale: A forma hebraica designa coletivamente a raça humana. A tradução escolhida é inclusiva, concreta e corrente, sem sugerir que se trata de um único homem.
- issue: Alcance de עַד הַיּוֹם הַזֶּה
  choice: até hoje em Israel e entre os seres humanos
  alternative: na terra do Egito até hoje, e em Israel e entre os seres humanos
  rationale: A ordem hebraica admite alguma tensão quanto ao alcance da expressão temporal. A colocação adotada produz português natural e a relaciona à continuidade da atuação e notoriedade divinas, sem afirmar que sinais continuavam ocorrendo no Egito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A abertura “tu que” preserva o caráter relativo do hebraico e sua ligação sintática com o contexto anterior. Emprega-se “realizaste” em vez do literal “puseste” porque esta última combinação não é idiomática em português com “sinais e maravilhas”.
