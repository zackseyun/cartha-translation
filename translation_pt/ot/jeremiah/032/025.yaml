  source_fidelity: O texto transmite com precisão o contraste enfático de וְאַתָּה, a ordem de comprar o campo com prata e assegurar testemunhas, e a realidade de a cidade estar entregue ao poder dos caldeus. «Embora» é uma explicitação contextual defensável da conjunção וְ e a nota preserva as alternativas coordenativa e temporal. «Já tenha sido entregue» comunica adequadamente o perfeito nifal no contexto da oração de Jeremias.
