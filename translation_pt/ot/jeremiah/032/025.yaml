  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: pt
  text: 'No entanto, tu mesmo me disseste, ó Senhor Yahweh: “Compra para ti o campo com prata e chama testemunhas”, embora[a] a cidade já tenha sido entregue nas mãos dos caldeus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a cidade já foi entregue” ou “enquanto a cidade já foi entregue”. A conjunção hebraica pode ser traduzida simplesmente por “e” ou, neste contexto, por “enquanto”; o texto principal explicita a força concessiva da queixa de Jeremias.'
    reason: alternative_reading
  - marker: b
    text: “Caldeus” designa aqui o poder babilônico.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: No entanto, tu mesmo
  rationale: A conjunção, junto do pronome independente, marca contraste e ênfase. “No entanto” expressa a tensão da queixa de Jeremias, e “tu mesmo” preserva a ênfase do pronome.
- source_word: אָמַרְתָּ אֵלַי
  choice: me disseste
  rationale: Reproduz de modo natural o verbo אָמַר com אֶל e mantém a referência a uma ordem dada anteriormente.
- source_word: אֲדֹנָי יְהוִה
  choice: ó Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, enquanto “Yahweh” representa diretamente o nome divino יהוה; “ó” assinala o vocativo em português natural.
- source_word: קְנֵה לְךָ הַשָּׂדֶה
  choice: Compra para ti o campo
  rationale: “Compra” comunica o sentido transacional do imperativo, e “para ti” preserva o complemento לְךָ, que destaca o envolvimento pessoal de Jeremias.
- source_word: בַּכֶּסֶף
  choice: com prata
  rationale: Preserva a imagem concreta de כֶּסֶף, “prata”, que também funcionava como meio de pagamento.
- source_word: וְהָעֵד עֵדִים
  choice: e chama testemunhas
  rationale: O hifil de עוד com עֵדִים indica providenciar ou convocar testemunhas para confirmar legalmente a compra. “Chama testemunhas” é claro e corrente.
- source_word: וְהָעִיר
  choice: embora a cidade
  rationale: 'A conjunção simples assume força concessiva no contexto: a ordem de comprar contrasta com a entrega iminente ou já determinada da cidade. A nota preserva a leitura mais estritamente coordenativa.'
- source_word: נִתְּנָה
  choice: já tenha sido entregue
  rationale: O nifal perfeito descreve a cidade como entregue ao poder inimigo; “já” ressalta o resultado presente ou a certeza consumada percebida na oração.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Mantém a imagem idiomática hebraica de estar sob o poder ou controle de alguém, usando a forma idiomática natural em português.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Traduz diretamente o gentílico hebraico, sem substituí-lo interpretativamente por “babilônios”; a nota esclarece sua referência histórica.
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e torna explícito o nome da aliança, sem fundir os dois elementos.
- issue: Força da conjunção antes de “a cidade”
  choice: embora
  alternative: e / enquanto
  rationale: “Embora” explicita o contraste presente na queixa de Jeremias sem eliminar a ambiguidade, que é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se o tratamento por “tu” por combinar naturalmente com a forma enfática “tu mesmo”; a sintaxe permanece clara e solene sem arcaísmos desnecessários.
