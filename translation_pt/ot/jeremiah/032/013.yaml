lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: E dei esta ordem
  rationale: O verbo צוה pode significar ordenar, encarregar ou instruir. A expressão preserva a força de uma instrução solene no contexto jurídico e funciona naturalmente na narrativa portuguesa.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca Baruque como objeto direto e não requer palavra correspondente em português.
- source_word: בָּרוּךְ
  choice: Baruque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Preserva a imagem literal do hebraico e seu sentido público, apropriado ao contexto de testemunhas de uma transação legal.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo natural a fórmula hebraica que introduz discurso direto.
