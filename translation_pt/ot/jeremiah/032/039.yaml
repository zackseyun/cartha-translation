base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/039.yaml
  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: pt
  text: E eu lhes darei um só coração[a] e um só caminho[b], para que me temam todos os dias, para o bem deles e de seus filhos depois deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um coração indiviso”. O hebraico diz literalmente “um só coração”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um só modo de viver”. O hebraico “caminho” pode referir-se figuradamente à maneira de viver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E eu lhes darei
  rationale: O perfeito qal de primeira pessoa singular, ligado pela conjunção e inserido em discurso profético, expressa aqui uma promessa futura. “Darei” conserva o sentido simples de נתן.
- source_word: לֵב אֶחָד
  choice: um só coração
  rationale: Mantém a metáfora hebraica e sua possível abrangência tanto comunitária quanto interior, sem restringi-la à ideia interpretativa de “coração indiviso”.
- source_word: וְדֶרֶךְ אֶחָד
  choice: e um só caminho
  rationale: דרך pode designar caminho literal ou, figuradamente, modo de vida. “Um só caminho” é natural em português e preserva a metáfora.
- source_word: לְיִרְאָה אוֹתִי
  choice: para que me temam
  rationale: O infinitivo construto com ל tem força de finalidade. A formulação explicita esse propósito e conserva “temer” como expressão bíblica de reverência diante de Deus.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reproduz de perto a expressão hebraica e comunica continuidade duradoura sem reduzi-la ao advérbio “sempre”.
- source_word: לְטוֹב לָהֶם
  choice: para o bem deles
  rationale: Expressa naturalmente o valor benefactivo de ל com טוֹב.
- source_word: וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: e de seus filhos depois deles
  rationale: A coordenação prolonga a expressão “para o bem” aos filhos. “Filhos” é o sentido direto de בנים; “de seus filhos” evita repetição pesada sem perder a relação sintática.
theological_decisions:
- issue: Sentido de “um só coração e um só caminho”
  choice: Preservar as metáforas como promessa pactual de uma disposição interior unificada e de um modo de vida comum voltado para Deus.
  alternative: Explicitar somente a unidade comunitária ou somente a devoção individual indivisa.
  rationale: O hebraico admite essas dimensões conjuntamente. A tradução não resolve indevidamente essa amplitude teológica.
- issue: Sentido de “me temam”
  choice: Manter “temam” no texto, com o sentido contextual de temor reverente dentro da relação de aliança.
  alternative: Parafrasear como “me reverenciem” ou entender como mero terror.
  rationale: ירא diante de Deus, neste contexto de restauração, inclui reverência e obediência. Manter o termo preserva o idioma bíblico e sua densidade sem sugerir que se trata apenas de pavor.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e as metáforas do hebraico foram preservadas sempre que naturais. Os marcadores [a] e [b] aparecem no texto principal.
