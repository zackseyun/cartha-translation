  text: שָׂד֞וֹת בַּ/כֶּ֣סֶף יִקְנ֗וּ וְ/כָת֨וֹב בַּ/סֵּ֥פֶר וְ/חָתוֹם֮ וְ/הָעֵ֣ד עֵדִים֒ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן וּ/בִ/סְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּ/בְ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/עָרֵ֣י הָ/הָ֔ר וּ/בְ/עָרֵ֥י הַ/שְּׁפֵלָ֖ה וּ/בְ/עָרֵ֣י הַ/נֶּ֑גֶב כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖/ם נְאֻם יְהוָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: pt
  text: Campos serão comprados com prata, documentos serão redigidos, selados e atestados por testemunhas[a], na terra de Benjamim, nos arredores de Jerusalém, nas cidades de Judá, nas cidades da região montanhosa, nas cidades das terras baixas[b] e nas cidades do Neguebe, pois restaurarei a sorte deles[c] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e farão que testemunhas atestem”. O hebraico traz literalmente uma fórmula jurídica semelhante a “fazer testemunhas testemunharem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a Sefelá”, a região de terras baixas de Judá.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “trarei de volta os exilados deles” ou “restaurarei o seu cativeiro”. A expressão hebraica pode indicar a reversão do exílio e uma restauração mais ampla.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת בַּכֶּסֶף יִקְנוּ
  choice: Campos serão comprados com prata
  rationale: Mantém o foco nos campos e preserva a referência concreta à prata usada como meio de pagamento, embora o verbo hebraico esteja na voz ativa com sujeito indefinido.
- source_word: וְכָתוֹב בַּסֵּפֶר וְחָתוֹם
  choice: documentos serão escritos e selados
  rationale: סֵפֶר designa aqui o documento escrito da transação, não necessariamente um livro literário. A formulação passiva dá continuidade natural à descrição da retomada das compras de terras.
- source_word: וְהָעֵד עֵדִים
  choice: e testemunhas serão chamadas
  rationale: O hebraico emprega uma fórmula jurídica causativa para fazer testemunhas atestarem a transação. A redação portuguesa comunica o ato formal sem reproduzir uma repetição pouco natural.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: na terra de Benjamim
  rationale: Preserva a designação territorial simples do hebraico e é clara em português.
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: nos arredores de Jerusalém
  rationale: Expressa de modo natural a área circundante da cidade.
- source_word: הָהָר
  choice: a região montanhosa
  rationale: O termo geográfico indica a zona montanhosa de Judá, não uma única montanha.
- source_word: הַשְּׁפֵלָה
  choice: a planície
  rationale: Traduz o nome da região baixa de Judá de forma compreensível, mantendo o nome técnico em nota.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: Neste contexto, o termo funciona como nome geográfico regional, e não apenas como indicação do sul.
- source_word: אָשִׁיב אֶת שְׁבוּתָם
  choice: restaurarei a sorte deles
  rationale: Conserva o caráter idiomático e abrangente da promessa, sem limitá-la apenas ao retorno físico dos exilados; a ambiguidade é explicitada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a forma Yahweh preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Alcance da fórmula שׁוּב שְׁבוּת
  choice: restaurarei a sorte deles
  alternative: trarei de volta os exilados deles; restaurarei o seu cativeiro
  rationale: A expressão pode abranger tanto a reversão do exílio quanto uma restauração mais ampla. A tradução principal preserva essa amplitude, e a nota registra as leituras mais concretas.
translation_notes:
  register: 'Português moderno, digno e acessível, com construções passivas para apresentar a retomada das práticas jurídicas como sinal de restauração. Os topônimos seguem formas correntes em português: Benjamim, Jerusalém, Judá e Neguebe. A repetição de “nas cidades” conserva o ritmo geográfico do hebraico.'
