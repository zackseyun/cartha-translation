  naturalness: A revisão mantém um português moderno e fluente. «Documentos serão redigidos, selados e atestados por testemunhas» torna clara a série de atos legais sem a repetição pouco idiomática da fórmula hebraica.
  terminology: «Terra de Benjamim», «região montanhosa», «terras baixas» e «Neguebe» refletem adequadamente as designações geográficas. «Restaurarei a sorte deles» preserva, com a nota, a abrangência idiomática de שׁוּב שְׁבוּת. Yahweh é mantido para o Tetragrama.
  issues:
