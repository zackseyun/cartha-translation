source:
  edition: WLC
  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: pt
  text: Construíram os lugares altos de Baal que ficam no vale de Ben-Hinom[a], para fazer passar seus filhos e suas filhas a Moloque[b], coisa que eu não lhes ordenei, nem me passou pelo coração que praticassem esta abominação, para fazer Judá pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no vale do filho de Hinom”.'
    reason: Alternativa lexical que explicita literalmente a construção do topônimo hebraico.
  - marker: b
    text: A expressão hebraica é literalmente “fazer passar seus filhos e suas filhas”. Neste contexto cultual, refere-se ao sacrifício de crianças a Moloque, associado em outras passagens à passagem pelo fogo.
    reason: Nota cultural necessária para esclarecer o eufemismo sem inserir no texto principal uma palavra ausente do hebraico deste versículo.
lexical_decisions:
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Expressão bíblica consagrada para locais de culto, frequentemente situados em elevações; preserva a especificidade cultual melhor do que o termo mais genérico “santuários”.
- source_word: הַבַּעַל
  choice: Baal
  rationale: O contexto aponta para o nome da divindade, não apenas para o título comum “senhor”.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: no vale de Ben-Hinom
  rationale: Mantém o topônimo hebraico de forma reconhecível e evita “Geena”, termo posterior que seria anacrônico neste contexto.
- source_word: לְהַעֲבִיר
  choice: para fazer passar
  rationale: Preserva a formulação causativa e o eufemismo cultual do hebraico sem acrescentar ao texto principal a palavra “fogo”, que não ocorre neste versículo.
- source_word: לַמֹּלֶךְ
  choice: a Moloque
  rationale: Entende מֹלֶךְ como o nome da divindade associada a esse rito; “a” expressa naturalmente a direção ou destinação do ato.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: nem me passou pelo coração
  rationale: Retém a imagem antropomórfica do hebraico em português natural, sem reduzi-la à formulação abstrata “nem me veio à mente”.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: tal abominação
  rationale: “Abominação” conserva o forte peso moral e cultual do termo hebraico; “tal” liga naturalmente a expressão à prática já mencionada.
- source_word: לְמַעַן הַחֲטִיא אֶת־יְהוּדָה
  choice: levando Judá a pecar
  rationale: Expressa o sentido causativo do hifil de חטא e deixa a relação como consequência, sem sugerir desnecessariamente que o pecado de Judá fosse a intenção consciente dos praticantes.
theological_decisions:
- issue: Natureza da expressão referente ao sacrifício de crianças
  choice: Manter no texto “fazer passar seus filhos e suas filhas a Moloque”, com explicação em nota.
  alternative: “Fazer seus filhos e suas filhas passar pelo fogo a Moloque” ou “sacrificar seus filhos e suas filhas a Moloque”.
  rationale: O hebraico deste versículo não contém a palavra “fogo”, embora a expressão, no contexto cultual, designe sacrifício de crianças. A tradução conserva o modo indireto do original, e a nota esclarece o referente cultural.
- issue: Linguagem antropomórfica a respeito de Deus
  choice: Preservar “nem me passou pelo coração”.
  alternative: “Nem me veio à mente”.
  rationale: A imagem do coração pertence à retórica e à teologia do texto. Preservá-la comunica que a prática era inteiramente contrária à vontade divina sem transformar a frase em uma explicação doutrinária sobre o conhecimento de Deus.
- issue: Força de לְמַעַן na oração final
  choice: 'Traduzir em sentido resultativo: “levando Judá a pecar”.'
  alternative: “Para fazer Judá pecar”.
  rationale: A construção pode formalmente indicar propósito, mas neste contexto a leitura resultativa evita atribuir aos agentes a intenção específica de fazer toda Judá pecar, ao mesmo tempo que mantém o causativo hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os termos bíblicos reconhecíveis “lugares altos”, “Baal”, “Moloque” e “abominação”. A pontuação com travessões organiza a longa frase profética sem eliminar sua intensidade retórica.
