  text: וָ/אֶקַּ֖ח אֶת סֵ֣פֶר הַ/מִּקְנָ֑ה אֶת הֶֽ/חָת֛וּם הַ/מִּצְוָ֥ה וְ/הַ/חֻקִּ֖ים וְ/אֶת הַ/גָּלֽוּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/011.yaml
  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
translation:
  language: pt
  text: 'Então peguei o documento de compra: a cópia selada, com os termos e as cláusulas[a], e a cópia aberta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o documento de compra, o documento selado, o mandamento e os estatutos”. A relação sintática entre essas expressões é compacta no hebraico; neste contexto jurídico, elas provavelmente se referem às estipulações e disposições do documento.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a cópia não selada, que podia ser consultada, em contraste com a cópia selada.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Então peguei
  rationale: A forma narrativa com waw consecutivo dá sequência aos acontecimentos. “Então peguei” é natural em português atual e expressa a ação concreta de receber e tomar em mãos o documento.
- source_word: סֵפֶר הַמִּקְנָה
  choice: o documento de compra
  rationale: סֵפֶר designa aqui um documento escrito, e מִקְנָה, a compra ou aquisição. “Documento de compra” comunica com clareza o caráter jurídico da transação sem especificar além do hebraico o tipo exato de instrumento.
- source_word: הֶחָתוּם
  choice: a cópia selada
  rationale: O particípio passivo significa “selado”. Como a expressão contrasta com הַגָּלוּי, explicitar “cópia” torna inteligível que se trata da versão selada do documento, sem alterar o contraste do original.
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: os termos e as cláusulas
  rationale: Embora os substantivos possam significar literalmente “o mandamento e os estatutos”, neste contexto documental e jurídico indicam estipulações e disposições da compra. “Termos e cláusulas” preserva essa força jurídica em português corrente.
- source_word: הַגָּלוּי
  choice: a cópia aberta
  rationale: O termo significa aquilo que está descoberto ou aberto e contrasta diretamente com a cópia selada. “Cópia aberta” conserva esse contraste; a nota esclarece seu sentido prático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de dois-pontos apresenta as duas formas do documento sem eliminar a construção apositiva do hebraico. A formulação jurídica permanece acessível, e a nota registra a leitura mais literal e a ambiguidade sintática.
