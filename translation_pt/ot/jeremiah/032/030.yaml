  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: pt
  text: Pois os filhos de Israel e os filhos de Judá só têm feito o que é mau aos meus olhos desde a juventude deles[a]; pois os filhos de Israel só têm me provocado pela obra de suas mãos[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” e “os judeus”. O hebraico diz literalmente “os filhos de Israel” e “os filhos de Judá”.
    reason: lexical_alternative
  - marker: b
    text: “A obra de suas mãos” também pode se referir especificamente aos ídolos que eles fizeram.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva literalmente a designação coletiva e pactual, bem como sua repetição retórica na segunda oração.
- source_word: וּבְנֵי יְהוּדָה
  choice: e os filhos de Judá
  rationale: Mantém o paralelismo formal com “os filhos de Israel” e a distinção entre as duas comunidades.
- source_word: אַךְ
  choice: só
  rationale: Expressa de modo natural em português a força exclusiva e intensificadora do termo em ambas as ocorrências.
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: têm feito o que é mau aos meus olhos
  rationale: Conserva a metáfora hebraica “aos meus olhos” e comunica o padrão contínuo de conduta julgado mau por Deus.
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: desde a juventude deles
  rationale: Representa a expressão temporal sem decidir se a juventude é individual ou, como pode sugerir o contexto, a história inicial do povo.
- source_word: מַכְעִסִים אֹתִי
  choice: têm me provocado
  rationale: Comunica uma ação reiterada que suscita a ira divina, sem reduzir o sentido apenas ao resultado emocional.
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: com a obra de suas mãos
  rationale: Preserva o idioma hebraico e sua possível referência tanto às realizações humanas em geral quanto, no contexto, aos ídolos fabricados.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e mantém o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama em vez de substituí-lo por um título.
theological_decisions:
- issue: Alcance de “filhos de Israel” na segunda oração
  choice: Repetir literalmente “os filhos de Israel”.
  alternative: Empregar “eles” ou explicitar “Israel e Judá”.
  rationale: O hebraico repete especificamente a expressão; preservá-la evita harmonizar uma possível restrição ou um uso representativo.
- issue: Sentido de “obra de suas mãos”
  choice: Manter a expressão abrangente no texto.
  alternative: Traduzir diretamente como “os ídolos que fizeram”.
  rationale: O contexto admite referência específica à idolatria, mas a expressão hebraica também pode abranger as ações ou produções humanas; a nota registra a possibilidade sem eliminar a ambiguidade.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se o paralelismo hebraico, a repetição de “filhos de Israel”, a metáfora “aos meus olhos” e a possível ambiguidade de “obra de suas mãos”.
