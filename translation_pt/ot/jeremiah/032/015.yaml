  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: Casas, campos e vinhedos voltarão a ser comprados nesta terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da ação simbólica no contexto e mantém de forma natural a ligação discursiva.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética de mensageiro em português corrente e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Forma consagrada e inteligível do título divino, sem restringi-lo explicitamente a exércitos humanos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da cadeia construta, preservando a identificação pactual.
- source_word: עוֹד
  choice: ainda
  rationale: Com o futuro, expressa a retomada prometida das transações; em português, 'ainda se comprarão' comunica que isso voltará a ocorrer.
- source_word: יִקָּנוּ
  choice: se comprarão
  rationale: A construção passiva sintética preserva naturalmente em português o valor passivo do Nifal e o foco nos imóveis adquiridos.
- source_word: בָתִּים
  choice: casas
  rationale: Equivalente direto, apropriado ao contexto de compra de propriedades.
- source_word: שָׂדוֹת
  choice: campos
  rationale: Equivalente amplo e natural para terras agrícolas.
- source_word: כְרָמִים
  choice: vinhedos
  rationale: Termo moderno e claro para terrenos cultivados com videiras.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: Preserva tanto a referência territorial imediata quanto a ressonância da terra de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Mantém o nome pessoal divino por transliteração, sem substituí-lo pelo título 'SENHOR'.
- issue: Voz de יִקָּנוּ (Nifal)
  choice: 'passiva: “se comprarão”'
  alternative: 'média/ativa: “comprarão”'
  rationale: A forma passiva sintética representa melhor o Nifal e mantém o foco na restauração das transações de propriedades, sem introduzir compradores como sujeito explícito.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e profético, com sintaxe clara. A forma 'se comprarão' preserva a voz do hebraico sem exigir nota, e 'vinhedos' evita regionalismo excessivo.
