  text: וָ/אֶתְפַּלֵּ֖ל אֶל יְהוָ֑ה אַחֲרֵ֤י תִתִּ/י֙ אֶת סֵ֣פֶר הַ/מִּקְנָ֔ה אֶל בָּר֥וּךְ בֶּן נֵרִיָּ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: pt
  text: 'Depois de entregar o documento da compra a Baruque, filho de Nerias, orei a Yahweh, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: orei
  rationale: O hitpael de פלל significa normalmente “orar”; a forma simples em português é natural e não acrescenta uma intensidade ausente do hebraico.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל indica o destinatário da oração, e o nome divino יהוה é representado como “Yahweh” para preservar o nome próprio do texto hebraico.
- source_word: אַחֲרֵי תִתִּי
  choice: Depois de entregar
  rationale: A construção temporal indica que a entrega foi concluída antes da oração. O infinitivo pessoal português expressa essa sequência com naturalidade.
- source_word: סֵפֶר הַמִּקְנָה
  choice: o documento da compra
  rationale: סֵפֶר designa aqui um documento escrito, enquanto הַמִּקְנָה o identifica como relativo à aquisição. “Documento da compra” é claro e evita especificar além do hebraico uma modalidade jurídica exata.
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: a Baruque, filho de Nerias
  rationale: Mantém os nomes e o patronímico hebraicos numa forma consagrada e inteligível em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz diretamente o conteúdo da oração no versículo seguinte; os dois-pontos cumprem essa função no português escrito.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” procura representá-lo diretamente sem substituir o nome por um título; outras tradições portuguesas usam “SENHOR”, “Javé” ou “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura ampla no contexto brasileiro. “Documento da compra” preserva o caráter escrito e jurídico da expressão sem recorrer ao menos corrente “escritura de compra”.
