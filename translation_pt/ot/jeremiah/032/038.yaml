  text: And they will be my people[a], and I will be their God.
translation:
  language: pt
  text: E eles serão o meu povo[a], e eu serei o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “eles serão para mim um povo, e eu serei para eles Deus”; fórmula hebraica da aliança que expressa pertencimento e relacionamento mútuos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: E eles serão
  rationale: O perfeito qal com conjunção, nesta sequência profética de promessas, tem sentido futuro. “Serão” preserva com naturalidade o sentido simples de היה.
- source_word: לִי לְעָם
  choice: o meu povo
  rationale: Literalmente, “para mim por povo”. Na fórmula da aliança, o português expressa naturalmente essa relação de pertencimento como “o meu povo”.
- source_word: וַאֲנִי
  choice: e eu
  rationale: A conjunção liga as duas partes recíprocas da fórmula da aliança, sem exigir ideia de contraste.
- source_word: אֶהְיֶה
  choice: serei
  rationale: O imperfeito na primeira pessoa singular expressa o compromisso futuro de Deus e mantém o paralelismo verbal com “serão”.
- source_word: לָהֶם לֵאלֹהִים
  choice: o seu Deus
  rationale: Literalmente, “para eles por Deus”. Dentro da fórmula da aliança, trata-se de uma relação definida; “o seu Deus” é a formulação idiomática e clara em português.
theological_decisions:
- issue: Formula da aliança
  choice: E eles serão o meu povo, e eu serei o seu Deus.
  alternative: E eles serão para mim um povo, e eu serei para eles Deus.
  rationale: A tradução escolhida preserva a reciprocidade, o pertencimento e a relação expressos pela fórmula hebraica da aliança, usando português natural sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção tradicional “o meu povo... o seu Deus” mantém a solenidade e a clareza da fórmula da aliança.
