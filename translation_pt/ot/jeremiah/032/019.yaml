source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: pt
  text: grande em conselho e poderoso em obras, cujos olhos estão abertos sobre todos os caminhos dos seres humanos[a], para dar a cada um segundo os seus caminhos e segundo o fruto das suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dos filhos do homem”; expressão hebraica coletiva que se refere aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: grande em conselho
  rationale: Preserva o paralelismo e a amplitude de עֵצָה, que pode envolver conselho, plano e propósito, sem limitar o sentido a apenas uma dessas ideias.
- source_word: רַב הָעֲלִילִיָּה
  choice: poderoso em feitos
  rationale: Comunica a eficácia da ação divina e mantém o equilíbrio poético com “grande em conselho”; “feitos” corresponde ao campo semântico de ação e realização.
- source_word: עֵינֶיךָ פְקֻחוֹת
  choice: cujos olhos estão abertos
  rationale: Mantém a imagem antropomórfica concreta do hebraico e a ligação relativa com a descrição anterior de Deus.
- source_word: עַל כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: sobre todos os caminhos dos seres humanos
  rationale: “Caminhos” conserva a metáfora para modos de vida e conduta. “Seres humanos” expressa naturalmente o valor coletivo de בְּנֵי אָדָם em português atual; a forma literal é registrada em nota.
- source_word: לָתֵת לְאִישׁ
  choice: para dar a cada um
  rationale: Mantém o sentido básico de לָתֵת e o valor distributivo de אִישׁ, sem explicitar como “retribuir” aquilo que o contexto permite inferir.
- source_word: כִּדְרָכָיו
  choice: segundo os seus caminhos
  rationale: Conserva o plural hebraico e retoma deliberadamente “todos os caminhos”, referindo-se à conduta de cada indivíduo.
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: e segundo o fruto dos seus feitos
  rationale: Preserva a metáfora do “fruto” como resultado moral das ações e mantém a correspondência lexical com “feitos” na primeira linha.
theological_decisions:
- issue: Linguagem antropomórfica para o conhecimento divino
  choice: Manter “cujos olhos estão abertos”.
  alternative: “que vê todos os caminhos”
  rationale: A imagem corporal pertence à expressão literária do texto e comunica a percepção divina sem substituí-la por uma formulação teológica abstrata.
- issue: Expressão coletiva masculina בְּנֵי אָדָם
  choice: Traduzir o sentido coletivo por “seres humanos” e indicar a forma hebraica em nota.
  alternative: “filhos do homem”
  rationale: A expressão hebraica designa coletivamente a humanidade. A tradução principal comunica esse referente com clareza no português moderno, enquanto a nota preserva o conhecimento da forma original.
- issue: Caráter da resposta divina às ações humanas
  choice: Usar o verbo neutro “dar”.
  alternative: “retribuir”
  rationale: Embora o contexto tenha caráter retributivo, o hebraico emprega o verbo amplo נָתַן. A formulação escolhida evita definir de antemão se o resultado é recompensa, punição ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens de “olhos”, “caminhos” e “fruto”, bem como o paralelismo entre conselho e feitos. A sintaxe em minúscula reflete que o versículo continua a frase iniciada no contexto anterior.
