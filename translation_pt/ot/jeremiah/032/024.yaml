  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: pt
  text: Eis que as rampas de cerco chegaram junto à cidade para conquistá-la, e a cidade foi entregue nas mãos dos caldeus[a] que lutam contra ela, por causa da espada, da fome e da peste[b]. O que disseste aconteceu, e eis que tu o vês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «babilônios». O hebraico diz «caldeus», povo associado ao poder neobabilônico.
    reason: lexical_alternative
  - marker: b
    text: Ou «pestilência».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / וְהִנְּךָ
  choice: Eis que
  rationale: A expressão chama vividamente a atenção para a situação presente. «Eis que» mantém a força dêitica e o tom digno sem ser obscura, e sua repetição reflete a repetição hebraica.
- source_word: הַסֹּלְלוֹת
  choice: as rampas de cerco
  rationale: No contexto militar, o termo designa terraplenagens elevadas para atacar as muralhas; «rampas de cerco» é concreto e compreensível.
- source_word: בָּאוּ הָעִיר
  choice: já chegaram junto à cidade
  rationale: A construção indica que as obras de cerco alcançaram a cidade. «Junto à cidade» evita sugerir que elas entraram nela, enquanto «já» ressalta a realidade presente sem acrescentar conteúdo estranho ao aspecto da frase.
- source_word: לְלָכְדָהּ
  choice: para conquistá-la
  rationale: O verbo é usado para tomar ou capturar uma cidade; «conquistar» é idiomático nesse contexto militar.
- source_word: נִתְּנָה בְּיַד
  choice: foi entregue nas mãos de
  rationale: Preserva de modo natural em português o idioma hebraico que expressa sujeição ao poder de alguém.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém o etnônimo explícito do hebraico, sem substituí-lo interpretativamente por «babilônios».
- source_word: הַנִּלְחָמִים עָלֶיהָ
  choice: que lutam contra ela
  rationale: Expressa a ação hostil contínua do particípio hebraico sem intensificá-la além do texto.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Apresenta a espada, a fome e a peste como causas ou meios da entrega da cidade, em linguagem portuguesa clara.
- source_word: הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: da espada, da fome e da peste
  rationale: Conserva a tríade tradicional de calamidades e a repetição do artigo por meio das contrações portuguesas.
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: O que disseste aconteceu
  rationale: Afirma de maneira direta o cumprimento da palavra anteriormente proferida por Deus, sem explicação doutrinária adicional.
- source_word: וְהִנְּךָ רֹאֶה
  choice: e eis que tu mesmo o vês
  rationale: Mantém a segunda chamada de atenção e torna explícita, de modo natural, a ênfase do pronome incorporado na forma hebraica.
theological_decisions:
- issue: Fórmula de cumprimento da palavra divina
  choice: O que disseste aconteceu
  alternative: O que disseste se cumpriu
  rationale: A opção escolhida preserva a afirmação concreta de que o evento anunciado ocorreu, sem converter a frase em uma fórmula teológica mais técnica.
- issue: Agência na entrega da cidade
  choice: foi entregue nas mãos dos caldeus
  alternative: caiu nas mãos dos caldeus
  rationale: A voz passiva do hebraico é mantida, deixando implícita a agência, como no texto-fonte, em vez de resolvê-la ou apagá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o etnônimo «caldeus», a imagem das «mãos» e as duas ocorrências da expressão de atenção, sem arcaísmo excessivo nem explicitação denominacional.
