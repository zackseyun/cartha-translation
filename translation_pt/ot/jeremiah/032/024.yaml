- from: Eis que as rampas de cerco já chegaram junto à cidade para conquistá-la, e a cidade foi entregue nas mãos dos caldeus[a] que lutam contra ela, por causa da espada, da fome e da peste[b]. O que disseste aconteceu, e eis que tu mesmo o vês.
  to: Eis que as rampas de cerco chegaram junto à cidade para conquistá-la, e a cidade foi entregue nas mãos dos caldeus[a] que lutam contra ela, por causa da espada, da fome e da peste[b]. O que disseste aconteceu, e eis que tu o vês.
