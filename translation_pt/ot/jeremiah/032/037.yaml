base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: pt
  text: Eis que[a] estou reunindo-os de todas as terras para onde os expulsei na minha ira, no meu furor e na minha grande indignação[b]. Eu os trarei de volta a este lugar e os farei habitar em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que os reunirei”. A construção hebraica pode expressar uma ação futura iminente ou certa.'
    reason: lexical_alternative
  - marker: b
    text: “Grande indignação” traduz um terceiro termo hebraico ligado à ira divina, preservando a acumulação de linguagem de juízo no versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz a declaração com ênfase e imediatismo profético, em registro digno e ainda compreensível no português atual.
- source_word: מְקַבְּצָם
  choice: estou reunindo todos eles
  rationale: O particípio com הִנְנִי pode apresentar uma ação iminente ou certa como já em curso. A forma progressiva preserva esse aspecto; “todos eles” explicita naturalmente o objeto pronominal coletivo.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: de todas as terras
  rationale: Refere-se aos diversos territórios do exílio, não necessariamente à terra inteira em sentido cósmico. “Terras” mantém a amplitude sem especificar países modernos.
- source_word: הִדַּחְתִּים
  choice: os expulsei
  rationale: Expressa afastamento forçado e conserva claramente a agência divina e a severidade do juízo.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: Traduz o sentido idiomático do termo, que aqui designa ira, e não sua referência corporal literal ao nariz.
- source_word: וּבַחֲמָתִי
  choice: no meu furor
  rationale: Mantém um segundo termo distinto e intenso para a ira divina, preservando a acumulação retórica do hebraico.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: na minha grande indignação
  rationale: Conserva um terceiro termo de juízo sem reduzir os três quase sinônimos a uma só palavra portuguesa.
- source_word: וַהֲשִׁבֹתִים
  choice: Eu os trarei de volta
  rationale: Reproduz o sentido causativo e espacial de fazer os exilados retornarem ao lugar indicado.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: É a correspondência direta da expressão dêitica, sem substituir “lugar” por uma identificação contextual mais específica.
- source_word: וְהֹשַׁבְתִּים
  choice: os farei habitar
  rationale: Preserva a forma causativa do verbo e a ação divina de estabelecer o povo novamente no lugar.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: Comunica moradia segura, sem ameaça ou dano, de modo idiomático em português.
theological_decisions:
- issue: Preservação da sequência de três termos para o desagrado divino
  choice: ira / furor / grande indignação
  alternative: ira / cólera / grande furor
  rationale: O hebraico acumula termos próximos para intensificar o juízo. Três expressões distintas preservam essa força sem criar diferenças teológicas técnicas que o texto não define.
- issue: Aspecto da fórmula הִנְנִי seguida de particípio
  choice: Eis que estou reunindo
  alternative: Eis que reunirei
  rationale: A construção pode representar uma ação futura iminente ou certa como já em andamento. O texto principal conserva a forma participial, enquanto a nota registra a tradução futura legítima, sem eliminar a ambiguidade aspectual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. “Eis que” preserva o tom profético tradicional; a sintaxe restante é atual. A repetição dos possessivos em “minha ira”, “meu furor” e “minha grande indignação” acompanha a ênfase do original.
