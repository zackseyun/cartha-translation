source:
  edition: WLC
  text: וַ/תִּתֵּ֤ן לָ/הֶם֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבוֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: pt
  text: E deste a eles esta terra, que juraste dar aos pais deles[a], uma terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos antepassados deles”. O hebraico diz literalmente “aos pais deles”, referindo-se aos patriarcas ou antepassados de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: E deste
  rationale: O verbo נתן significa normalmente “dar”. O pretérito “deste” preserva a segunda pessoa dirigida a Deus, e “E” representa a sequência narrativa do waw.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: אֶרֶץ designa aqui o território prometido na aliança; “esta terra” é direto e adequado ao contexto.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: que juraste
  rationale: נשבע expressa especificamente um juramento, de modo que “juraste” preserva sua força pactual melhor do que apenas “prometeste”.
- source_word: לַאֲבוֹתָם
  choice: aos pais deles
  rationale: O hebraico usa literalmente “pais”, referindo-se aos antepassados patriarcais de Israel; a formulação mantém a linguagem masculina do texto-fonte.
- source_word: לָתֵת לָהֶם
  choice: dar aos pais deles
  rationale: O infinitivo expressa o conteúdo do juramento. Em português, explicitar novamente o objeto indireto evita que “dar a eles” pareça referir-se à geração que recebeu a terra, embora o hebraico use o mesmo pronome plural.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: A expressão idiomática descreve abundância agrícola e bênção. “Mana leite e mel” é uma formulação bíblica consagrada, clara e próxima da imagem hebraica.
theological_decisions:
- issue: Linguagem patriarcal na fórmula da aliança
  choice: pais deles
  alternative: antepassados deles
  rationale: אבות é literalmente “pais” e, neste contexto, aponta para os patriarcas de Israel. A tradução conserva essa forma, enquanto a nota esclarece a extensão referencial.
- issue: Referente de לָהֶם em “dar a eles”
  choice: dar aos pais deles
  alternative: dar a eles
  rationale: Gramaticalmente, o pronome retoma “pais deles”, isto é, os antepassados a quem foi feito o juramento. A repetição em português torna a relação inequívoca sem resolver qualquer tensão teológica além da sintaxe hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais tradicionais de segunda pessoa singular (“deste”, “juraste”) apropriadas à oração dirigida a Deus. A construção “mana leite e mel” preserva a conhecida imagem bíblica sem soar excessivamente técnica.
