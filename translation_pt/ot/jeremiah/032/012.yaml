source:
  edition: WLC
  text: וָ/אֶתֵּ֞ן אֶת הַ/סֵּ֣פֶר הַ/מִּקְנָ֗ה אֶל בָּר֣וּךְ בֶּן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ לְ/עֵינֵי֙ חֲנַמְאֵ֣ל דֹּדִ֔/י וּ/לְ/עֵינֵי֙ הָֽ/עֵדִ֔ים הַ/כֹּתְבִ֖ים בְּ/סֵ֣פֶר הַ/מִּקְנָ֑ה לְ/עֵינֵי֙ כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בַּ/חֲצַ֥ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: pt
  text: Então entreguei o documento de compra a Baruque, filho de Nerias, filho de Maaseias, diante de[a] Hanamel, meu tio[b], diante das testemunhas que haviam escrito no documento de compra[c] e diante de todos os judeus[d] que estavam sentados no pátio da guarda[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença de”. A expressão hebraica, repetida três vezes no versículo, significa literalmente “aos olhos de”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz aqui “Hanamel, meu tio”; em outras partes do capítulo, Hanamel é apresentado como filho do tio de Jeremias, isto é, seu primo.
    reason: cross_reference
  - marker: c
    text: Ou “que escreviam no documento de compra”. O hebraico diz literalmente “as testemunhas, as que escreviam no documento de compra”; o contexto jurídico pode indicar que elas o subscreveram ou assinaram.
    reason: lexical_alternative
  - marker: d
    text: Ou “todos os habitantes de Judá”. Neste contexto histórico, “judeus” designa o povo do reino de Judá.
    reason: lexical_alternative
  - marker: e
    text: Ou “pátio dos guardas”; possivelmente, “pátio da prisão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Então entreguei
  rationale: O wayyiqtol de נתן faz a narrativa avançar. “Então” expressa a sequência, e “entreguei” comunica de modo natural que o documento foi dado a um destinatário.
- source_word: סֵפֶר הַמִּקְנָה
  choice: o documento de compra
  rationale: סֵפֶר designa aqui um documento escrito, e מִקְנָה, uma aquisição ou compra. A expressão preserva o caráter jurídico sem recorrer a terminologia excessivamente regional.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Baruque, filho de Nerias, filho de Maaseias
  rationale: Os nomes seguem formas portuguesas reconhecíveis, e a repetição de “filho de” preserva a genealogia hebraica.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: A expressão significa literalmente “aos olhos de”. “Diante de” é natural em português e mantém o caráter público e testemunhado da transação, inclusive em suas três ocorrências.
- source_word: חֲנַמְאֵל דֹּדִי
  choice: Hanamel, meu tio
  rationale: דּוֹד significa normalmente “tio”. A tradução mantém o sentido imediato do texto, enquanto a nota registra a tensão com a identificação de Hanamel em outras partes do capítulo.
- source_word: הָעֵדִים
  choice: as testemunhas
  rationale: É o termo jurídico comum para as pessoas que atestam uma transação.
- source_word: הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: que haviam escrito no documento de compra
  rationale: A formulação conserva o particípio de כתב e a preposição בְּ sem concluir de modo explícito que se tratava de uma assinatura, embora essa seja uma possível função jurídica.
- source_word: כָּל הַיְּהוּדִים
  choice: todos os judeus
  rationale: “Judeus” é a forma portuguesa corrente; no contexto histórico, o termo se refere especificamente ao povo de Judá, possibilidade indicada em nota.
- source_word: הַיֹּשְׁבִים
  choice: que estavam sentados
  rationale: O particípio de ישׁב descreve diretamente a postura ou presença das pessoas naquele lugar.
- source_word: חֲצַר הַמַּטָּרָה
  choice: o pátio da guarda
  rationale: חָצֵר é “pátio” ou “átrio”, e מַטָּרָה designa neste contexto a área vigiada onde Jeremias estava detido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “diante de” foi mantida por seu valor jurídico e retórico. Evitou-se traduzir הַכֹּתְבִים diretamente como “que haviam assinado”, pois o hebraico fala de escrever no documento e não explicita o ato de assinar.
