source:
  edition: WLC
  text: וְ/צִדְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹ֥א יִמָּלֵ֖ט מִ/יַּ֣ד הַ/כַּשְׂדִּ֑ים כִּ֣י הִנָּתֹ֤ן יִנָּתֵן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/דִבֶּר פִּ֣י/ו עִם פִּ֔י/ו וְ/עֵינָ֖י/ו אֶת עינ/ו תִּרְאֶֽינָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: pt
  text: Zedequias, rei de Judá, não escapará das mãos dos caldeus, pois certamente será entregue nas mãos do rei da Babilônia. Falará com ele boca a boca[a], e seus olhos verão os olhos dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “falará diretamente com ele”, num encontro pessoal.
    reason: lexical_alternative
  - marker: b
    text: Ou, de modo mais idiomático, “ele o verá diretamente, olho no olho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: יִמָּלֵט
  choice: não escapará
  rationale: O nifal de מלט expressa escapar ou livrar-se; esta formulação é direta e natural no contexto de captura militar.
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: das mãos dos caldeus
  rationale: Mantém a imagem hebraica da mão como poder ou domínio, usando o plural idiomático em português, e preserva a designação específica 'caldeus'.
- source_word: הִנָּתֹן יִנָּתֵן
  choice: certamente será entregue
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza; 'certamente' comunica essa ênfase e 'será entregue' preserva a voz passiva.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: nas mãos do rei da Babilônia
  rationale: Preserva a imagem concreta de estar sob o poder do rei, em formulação corrente em português.
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: Falará com ele boca a boca
  rationale: Conserva a imagem corporal incomum do hebraico e indica um encontro pessoal direto sem substituí-la silenciosamente por 'face a face'.
- source_word: וְעֵינָיו אֶת־עֵינוֹ תִּרְאֶינָה
  choice: e seus olhos verão os olhos dele
  rationale: Mantém a formulação concreta e recíproca do hebraico, em vez de reduzir a expressão à ideia geral de simplesmente vê-lo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais como “das mãos” e “nas mãos”. As imagens hebraicas “boca a boca” e “seus olhos verão os olhos dele” foram preservadas no texto, enquanto as notas oferecem equivalentes mais idiomáticos. Os marcadores foram colocados junto às respectivas expressões.
