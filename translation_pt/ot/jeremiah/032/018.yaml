  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: pt
  text: que demonstra amor leal a milhares[a] e retribui a iniquidade dos pais no colo de seus filhos depois deles — o Deus grande e poderoso, Yahweh dos Exércitos[b], é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a milhares de gerações”, à luz de linguagem semelhante da aliança em outros textos; aqui, o hebraico diz simplesmente “a milhares”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: demonstra amor leal
  rationale: O particípio descreve a ação contínua ou característica de Deus. “Amor leal” comunica tanto a misericórdia quanto a fidelidade relacional de חֶסֶד em português atual.
- source_word: לַאֲלָפִים
  choice: a milhares
  rationale: O hebraico diz literalmente apenas “a milhares”; a tradução conserva essa concisão e não acrescenta “gerações” ao texto principal.
- source_word: וּמְשַׁלֵּם
  choice: e retribui
  rationale: Expressa a ideia de dar a devida paga sem recorrer a formulações arcaicas e mantém o paralelismo verbal do hebraico.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Preserva a densidade semântica do termo, que pode abranger o ato perverso, a culpa e suas consequências, sem decidir indevidamente entre essas nuances.
- source_word: אָבוֹת
  choice: pais
  rationale: Reflete o plural masculino específico do hebraico e é natural no contexto da sucessão entre pais e filhos.
- source_word: אֶל חֵיק
  choice: no colo
  rationale: Mantém a metáfora hebraica de algo que recai diretamente sobre a pessoa; “no colo” é uma expressão clara e natural em português.
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: de seus filhos depois deles
  rationale: “Filhos” pode representar os descendentes, enquanto “depois deles” preserva explicitamente a sucessão temporal do original.
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: o Deus grande e poderoso
  rationale: Reproduz o título elevado em ordem natural no português; “poderoso” comunica claramente a força indicada por גִּבּוֹר.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino como nome próprio e traduz צְבָאוֹת de forma transparente, mantendo a força soberana e militar do título.
theological_decisions:
- issue: Retribuição intergeracional
  choice: Conservar a afirmação de que Deus retribui a iniquidade dos pais no colo dos filhos depois deles.
  alternative: Reduzir a frase apenas às consequências sociais do pecado dos pais ou explicá-la como punição direta de filhos inocentes.
  rationale: O versículo afirma uma dimensão intergeracional da retribuição sem explicar plenamente sua relação com textos sobre responsabilidade individual. A tradução mantém essa tensão em vez de resolvê-la.
- issue: Sentido de צְבָאוֹת no título divino
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos exércitos celestiais
  rationale: “Exércitos” traduz diretamente o substantivo e evita restringir o referente aos seres celestiais, algo que o texto não explicita aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora do “colo”, a ambiguidade de עֲוֺן e a tensão teológica da retribuição intergeracional. Todos os marcadores de nota aparecem no texto principal.
