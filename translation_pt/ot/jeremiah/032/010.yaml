  text: וָ/אֶכְתֹּ֤ב בַּ/סֵּ֨פֶר֙ וָֽ/אֶחְתֹּ֔ם וָ/אָעֵ֖ד עֵדִ֑ים וָ/אֶשְׁקֹ֥ל הַ/כֶּ֖סֶף בְּ/מֹאזְנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/010.yaml
  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: pt
  text: Então escrevi no documento[a], selei-o, chamei testemunhas e pesei a prata na balança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no rolo” ou “na escritura”; o hebraico usa um termo geral para um texto ou documento escrito, aqui provavelmente a escritura de compra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: Então escrevi
  rationale: O wayyiqtol qal na primeira pessoa do singular dá continuidade à sequência narrativa; “Então escrevi” expressa isso naturalmente em português.
- source_word: בַּסֵּפֶר
  choice: no documento
  rationale: סֵפֶר é um termo amplo para algo escrito, como livro, rolo ou documento. Neste contexto de compra, designa provavelmente o instrumento escrito da transação; “documento” preserva melhor a amplitude lexical do hebraico, com a identificação provável esclarecida em nota.
- source_word: וָאֶחְתֹּם
  choice: selei-o
  rationale: חתם, em contexto jurídico, indica selar um documento. O pronome retoma naturalmente “documento”.
- source_word: וָאָעֵד עֵדִים
  choice: chamei testemunhas
  rationale: A construção hiphil de עוד com עֵדִים indica convocar ou fazer com que testemunhas atestem o ato jurídico; “chamei testemunhas” é claro e idiomático.
- source_word: וָאֶשְׁקֹל
  choice: pesei
  rationale: שקל descreve o ato de determinar por peso o metal usado no pagamento. O complemento e a menção da balança tornam o sentido comercial explícito sem acréscimo verbal.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף significa literalmente “prata” e também pode significar “dinheiro”. Como o pagamento é pesado, “prata” preserva a realidade material e histórica da transação.
- source_word: בְּמֹאזְנָיִם
  choice: na balança
  rationale: מֹאזְנַיִם designa uma balança de dois pratos. O singular coletivo “na balança” é a expressão corrente e mantém a imagem concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. “Documento” evita identificar no texto principal, com certeza maior que a do hebraico, o tipo exato de registro legal; a nota apresenta as principais alternativas.
