  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כַּ/אֲשֶׁ֤ר הֵבֵ֨אתִי֙ אֶל הָ/עָ֣ם הַ/זֶּ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את כֵּ֣ן אָנֹכִ֞י מֵבִ֤יא עֲלֵי/הֶם֙ אֶת כָּל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: Assim como trouxe sobre este povo toda esta grande calamidade[a], também trarei sobre eles todo o bem que estou falando[b] a respeito deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda esta grande desgraça”. O termo hebraico também pode significar “mal”, mas aqui se refere à calamidade do juízo, não à maldade moral.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “todo o bem que estou prometendo a eles”. Mais literalmente: “que estou falando a respeito deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança, em vez de substituí-lo por um título.
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Mantém tanto a ligação explicativa com o contexto anterior quanto a fórmula profética tradicional, em português natural.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... também
  rationale: Reproduz claramente a comparação explícita entre o juízo passado e o bem futuro.
- source_word: הֵבֵאתִי ... מֵבִיא
  choice: trouxe ... trarei
  rationale: O perfeito indica a ação passada, e o particípio, neste anúncio profético, expressa a ação futura como certa; o futuro é idiomático em português.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: toda esta grande calamidade
  rationale: Neste contexto, רָעָה designa a catástrofe do juízo, não maldade moral. “Calamidade” preserva a gravidade e evita uma leitura moral inadequada.
- source_word: כָּל הַטּוֹבָה
  choice: todo o bem
  rationale: Conserva a amplitude do hebraico, que pode abranger bênção, bem-estar e benefícios prometidos.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: que estou anunciando a respeito deles
  rationale: “Anunciando” mantém o sentido básico de falar em contexto profético sem reduzir explicitamente o verbo a “prometer”; “a respeito deles” preserva o valor de עַל.
theological_decisions:
- issue: Sentido de רָעָה quando atribuída à ação de Deus
  choice: calamidade
  alternative: mal; desgraça
  rationale: O contraste com “todo o bem” ocorre no âmbito do juízo histórico e da restauração. “Calamidade” comunica a catástrofe judicial sem afirmar que Deus praticou maldade moral.
- issue: Valor temporal do particípio מֵבִיא
  choice: trarei
  alternative: estou trazendo
  rationale: No contexto da promessa profética, o particípio apresenta a ação vindoura como certa. O futuro soa mais natural em português, embora o presente progressivo seja gramaticalmente possível.
- issue: Força de דֹּבֵר no contexto da promessa
  choice: estou anunciando
  alternative: estou prometendo; estou falando
  rationale: A formulação escolhida preserva a ideia explícita de fala profética e deixa que o contexto comunique seu caráter promissório, sem tornar “prometer” o significado lexical direto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura comparativa do hebraico foi preservada sem rigidez, e o nome Yahweh foi transliterado conforme a orientação do projeto.
