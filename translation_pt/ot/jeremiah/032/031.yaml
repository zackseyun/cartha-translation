source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: pt
  text: Pois esta cidade tem sido para mim motivo da minha ira e do meu furor[a], desde o dia em que a construíram até hoje, para removê-la da minha presença.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sobre a minha ira e sobre o meu furor”, expressão idiomática que indica que a cidade provocou ou ocasionou a ira e o furor de Deus.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “de sobre a minha face”; a expressão pode significar “de diante de mim” ou “da minha presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração de juízo precedente e mantém com naturalidade o valor explicativo da conjunção.
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: motivo de ira e furor
  rationale: 'A construção com עַל é idiomática: a cidade tem ocasionado ou provocado a ira divina. Esta formulação comunica esse sentido sem apagar a dificuldade da expressão hebraica, registrada em nota.'
- source_word: אַפִּי
  choice: ira
  rationale: Embora אַף designe literalmente o nariz, aqui é a metonímia hebraica comum para ira.
- source_word: חֲמָתִי
  choice: furor
  rationale: חֵמָה denota ira ardente ou furor; o termo preserva a intensidade e distingue o vocábulo de אַף.
- source_word: הָיְתָה לִּי
  choice: tem sido para mim
  rationale: O perfeito descreve uma condição que se estende desde a construção da cidade até o presente indicado no versículo; o pretérito perfeito composto expressa essa continuidade em português.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ
  choice: desde o dia em que a construíram
  rationale: Preserva o ponto inicial marcado por לְמִן e mantém indefinido o sujeito plural do verbo, como no hebraico.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Expressa de modo corrente a duração que chega ao momento presente.
- source_word: לַהֲסִירָהּ
  choice: de modo que eu a remova
  rationale: A preposição לְ com o infinitivo pode indicar finalidade ou resultado. A formulação conserva essa abertura, sem reduzir a construção exclusivamente a uma finalidade deliberada.
- source_word: מֵעַל פָּנָי
  choice: da minha presença
  rationale: Transmite naturalmente o sentido da expressão espacial e antropomórfica, literalmente relacionada à face de Deus; a imagem formal é indicada em nota.
theological_decisions:
- issue: Linguagem antropomórfica sobre a ira e a presença divina
  choice: Preservar a ira e o furor como predicados divinos e traduzir a referência à face por “presença”, com nota literal.
  alternative: Suavizar para “desagrado” e “afastar de mim”, ou verter formalmente “de diante da minha face”.
  rationale: O texto apresenta a reação divina em linguagem concreta. A tradução não a reduz a uma abstração, enquanto “presença” evita uma expressão pouco natural em português e a nota conserva a imagem hebraica.
- issue: Valor de finalidade ou resultado em לַהֲסִירָהּ
  choice: “de modo que eu a remova”
  alternative: “para que eu a remova” ou simplesmente “para removê-la”
  rationale: A construção hebraica admite matiz de consequência e de propósito. “De modo que” preserva melhor essa tensão sem resolver categoricamente a relação lógica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Furor” mantém o tom elevado e a intensidade do segundo termo hebraico; “presença” oferece naturalidade sem perder a imagem original, explicitada em nota.
