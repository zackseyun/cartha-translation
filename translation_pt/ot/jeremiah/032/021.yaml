  text: וַ/תֹּצֵ֛א אֶת עַמְּ/ךָ֥ אֶת יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בְּ/אֹת֣וֹת וּ/בְ/מוֹפְתִ֗ים וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בְ/אֶזְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָ֖א גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: pt
  text: E tiraste o teu povo Israel da terra do Egito com sinais e prodígios, com mão forte, com braço estendido e com grande terror.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com grande temor”. A expressão hebraica pode indicar medo, terror ou temor reverente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: tiraste
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, tirar”. “Tiraste” exprime de modo natural em português a ação divina de fazer Israel sair do Egito.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: o teu povo Israel
  rationale: Mantém tanto o possessivo da fala dirigida a Deus quanto “Israel” como identificação apositiva do povo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: A preposição מ־ indica a procedência; com “tiraste”, a forma idiomática portuguesa “da terra do Egito” comunica a saída para fora daquele território.
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: com sinais e prodígios
  rationale: O בְּ é instrumental. “Sinais e prodígios” preserva o par hebraico tradicional em linguagem clara e corrente.
- source_word: וּבְיָד חֲזָקָה
  choice: com mão forte
  rationale: Tradução próxima da expressão hebraica, preservando a imagem corporal e a ideia de poder.
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: braço estendido
  rationale: Reproduz a fórmula do êxodo de maneira natural e reconhecível em português; a preposição compartilhada é subentendida na coordenação.
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: e grande terror
  rationale: מוֹרָא pode indicar medo, terror ou assombro reverente. No contexto dos atos divinos contra o Egito, “grande terror” ressalta seu caráter temível sem eliminar a alternativa lexical.
theological_decisions:
- issue: Sentido de וּבְמוֹרָא גָּדוֹל na fórmula do êxodo
  choice: e grande terror
  alternative: e grande assombro
  rationale: “Terror” preserva o peso ameaçador dos atos de Deus no êxodo, especialmente perante o Egito. Como o hebraico também pode expressar assombro ou temor reverente, essa amplitude é registrada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva as imagens hebraicas da mão e do braço, evita linguagem arcaica e mantém a ambiguidade de מוֹרָא em nota.
