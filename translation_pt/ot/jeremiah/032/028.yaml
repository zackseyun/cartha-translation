  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh: “Eis que eu entrego esta cidade nas mãos dos caldeus e nas mãos de Nabucodonosor[a], rei da Babilônia, e ele a conquistará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Nebucadrezar”; tradicionalmente, “Nabucodonosor” em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão decorrente da denúncia e explicação divinas anteriores, preservando a força inferencial.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula solene do mensageiro profético e verte diretamente o nome divino.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que entrego
  rationale: “Eis que” mantém a ênfase solene de הִנְנִי; “entrego” expressa naturalmente a ação iminente de colocar a cidade sob o domínio inimigo, indicada pelo particípio e pela expressão seguinte.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Tradução direta e natural do substantivo com demonstrativo.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Mantém a imagem idiomática hebraica de sujeição ao poder de alguém, em formulação corrente em português.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o etnônimo hebraico, enquanto a menção do rei da Babilônia esclarece a referência histórica.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Adota a forma tradicional e amplamente reconhecida em português; a forma mais próxima da grafia hebraica deste versículo é registrada em nota.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Reprodução natural e direta da cadeia construta hebraica.
- source_word: וּלְכָדָהּ
  choice: ele a conquistará
  rationale: O verbo denota a tomada de uma cidade; o sujeito masculino singular é explicitado como “ele”, tendo Nabucodonosor como antecedente singular mais próximo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Referente do sujeito singular em וּלְכָדָהּ
  choice: “ele”, referindo-se a Nabucodonosor
  alternative: “ela será conquistada” ou referência coletiva aos caldeus
  rationale: A forma verbal é masculina singular, e Nabucodonosor é o antecedente singular explícito mais próximo. A tradução mantém essa sintaxe sem excluir que a conquista se realize por suas forças.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A fórmula profética e a imagem das “mãos” foram preservadas; “entrego” evita uma construção excessivamente literal sem perder a ideia de transferência de domínio.
