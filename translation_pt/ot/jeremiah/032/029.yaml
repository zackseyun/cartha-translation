source:
  edition: WLC
  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: pt
  text: E os caldeus[a], que estão lutando contra esta cidade, virão, atearão fogo a esta cidade e a queimarão, junto com as casas em cujos telhados queimaram incenso a Baal e derramaram ofertas de bebida a outros deuses, para provocar a minha ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os babilônios”. O hebraico diz “os caldeus”, termo frequentemente usado para as forças do Império Neobabilônico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: É a correspondência lexical mais direta e pode designar aqui as forças neobabilônicas; a alternativa contextual é preservada em nota.
- source_word: הַנִּלְחָמִים עַל
  choice: que estão lutando contra
  rationale: Preserva o aspecto contínuo do particípio e o sentido militar da construção com עַל.
- source_word: וְהִצִּיתוּ ... בָּאֵשׁ
  choice: atearão fogo à cidade
  rationale: Expressão corrente em português para o hifil de יצת com בָּאֵשׁ, sem tornar redundante a menção ao fogo.
- source_word: וּשְׂרָפוּהָ
  choice: e a queimarão
  rationale: Mantém o verbo coordenado e retoma naturalmente o substantivo feminino 'cidade'.
- source_word: וְאֵת הַבָּתִּים
  choice: junto com as casas
  rationale: Explicita de modo idiomático que as casas também são objeto da ação de queimar.
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: em cujos terraços queimaram incenso
  rationale: Mantém a relação da oração relativa com as casas e o cenário de culto nos terraços; קטר no piel designa normalmente queimar incenso ou uma oferta aromática.
- source_word: לַבַּעַל
  choice: a Baal
  rationale: Representa diretamente o destinatário divino da oferta.
- source_word: וְהִסִּכוּ נְסָכִים
  choice: derramaram ofertas de bebida
  rationale: Traduz a expressão sacrificial de forma compreensível e preserva a ação concreta de derramar.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Segue diretamente אֲחֵרִים, 'outros', sem interpretar como 'estrangeiros'.
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: para provocar a minha ira
  rationale: Preserva tanto a relação de propósito ou resultado introduzida por לְמַעַן quanto a força causativa do hifil de כעס.
theological_decisions:
- issue: Reação divina à idolatria
  choice: para provocar a minha ira
  alternative: para me irritar
  rationale: O hebraico apresenta explicitamente as práticas idólatras como provocação da ira de Deus. A formulação conserva a dimensão pessoal e judicial, sem suavizar nem ampliar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Terraços' comunica melhor que 'telhados' o uso dos tetos planos das casas para práticas cultuais; 'ofertas de bebida' é mais acessível que 'libações'.
