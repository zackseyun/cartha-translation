base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
translation:
  language: pt
  text: Eles puseram suas coisas detestáveis[b] na casa[a] que é chamada pelo meu nome, para contaminá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo”. O hebraico diz “na casa”, referindo-se aqui à casa chamada pelo nome de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas abominações”. O termo hebraico costuma designar objetos ou práticas detestáveis, especialmente os ligados à idolatria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Eles puseram
  rationale: O imperfeito consecutivo de שׂים relata uma ação passada. “Puseram” é natural, direto e preserva o caráter concreto do ato.
- source_word: שִׁקּוּצֵיהֶם
  choice: suas coisas detestáveis
  rationale: שִׁקּוּץ designa algo repugnante nos sentidos ritual e moral, muitas vezes ligado à idolatria. A expressão mantém a amplitude do hebraico sem especificar indevidamente que se trata apenas de ídolos.
- source_word: בַּבַּיִת
  choice: na casa
  rationale: בַּיִת significa literalmente “casa”. Aqui se refere ao templo, mas conservar “casa” no texto principal mantém a formulação hebraica.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: que é chamada pelo meu nome
  rationale: A tradução preserva de modo compreensível o idioma hebraico, que comunica pertencimento, reivindicação divina e consagração.
- source_word: לְטַמְּאוֹ
  choice: para profaná-la
  rationale: O infinitivo pode indicar propósito ou resultado. Neste contexto, טמא descreve a contaminação ritual e moral do santuário; “profanar” comunica naturalmente em português a violação do caráter sagrado da casa.
theological_decisions:
- issue: Traduzir בַּבַּיִת literalmente como “casa” ou explicitar seu referente como “templo”
  choice: casa
  alternative: templo
  rationale: A tradução principal retém o termo do hebraico, enquanto a nota esclarece o referente contextual. Assim, evita-se substituir silenciosamente a imagem original por sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça junto ao termo correspondente. “Profaná-la” evita a possível leitura meramente higiênica de “torná-la impura” e expressa a violação ritual e moral do lugar sagrado.
