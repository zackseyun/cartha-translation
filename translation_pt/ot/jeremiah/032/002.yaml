base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: pt
  text: Naquele tempo, o exército do rei da Babilônia mantinha Jerusalém sob cerco[a], e o profeta Jeremias estava detido no pátio da guarda, situado no palácio do rei de Judá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cercava Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: O “palácio do rei de Judá” era o complexo real, dentro do qual ficava o pátio da guarda.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אָז
  choice: Naquele tempo
  rationale: Expressa naturalmente o marcador temporal que introduz o cenário histórico, sem tornar a coordenação hebraica excessivamente literal.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: o exército do rei da Babilônia
  rationale: חֵיל designa aqui a força militar do rei; “exército” é o equivalente coletivo mais claro e atual.
- source_word: צָרִים עַל יְרוּשָׁלִָם
  choice: cercava Jerusalém
  rationale: O particípio descreve uma ação militar em curso. Em português, “cercava” comunica de modo conciso o cerco da cidade; a formulação explícita “mantinha Jerusalém sob cerco” é preservada em nota.
- source_word: וְ/יִרְמְיָהוּ הַ/נָּבִיא
  choice: e o profeta Jeremias
  rationale: Mantém tanto a coordenação quanto o título expresso no hebraico, em ordem natural no português.
- source_word: הָיָה כָלוּא
  choice: estava detido
  rationale: Preserva o estado resultante de restrição ou custódia sem sugerir necessariamente uma cela prisional convencional.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: no pátio da guarda
  rationale: חָצֵר é um pátio fechado, e מַטָּרָה indica aqui o espaço de guarda ou custódia; a expressão evita defini-lo de forma excessiva como prisão.
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: situado no palácio do rei de Judá
  rationale: A oração relativa localiza o pátio no complexo real. Neste contexto, בֵּית מֶלֶךְ refere-se naturalmente ao palácio, e não a uma residência comum.
