translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução segue de perto a estrutura histórica do hebraico, mas emprega formulações naturais: “Naquele tempo”, “estava detido” e “palácio”. Todos os marcadores de nota aparecem no texto principal.'
