source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: pt
  text: 'Farei com eles uma aliança perpétua[a]: não me afastarei deles e lhes farei o bem. E porei no coração deles o temor de mim[b], para que não se afastem de mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aliança eterna” ou “aliança duradoura”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “meu temor”, isto é, o temor dirigido a mim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: Farei
  rationale: O hebraico usa literalmente o idioma “cortar uma aliança”; em português, “fazer uma aliança” comunica naturalmente o ato de estabelecê-la.
- source_word: בְּרִית עוֹלָם
  choice: uma aliança perpétua
  rationale: “Perpétua” expressa a duração contínua de עוֹלָם no contexto da aliança; “eterna” é uma alternativa legítima indicada em nota.
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם
  choice: não deixarei de acompanhá-los
  rationale: A expressão indica que Deus não recuará de estar após eles, isto é, não retirará deles sua presença e ação benéfica. A formulação preserva a imagem de continuidade sem o português pouco natural “não voltarei de detrás deles”.
- source_word: לְהֵיטִיבִי אוֹתָם
  choice: fazendo-lhes o bem
  rationale: O gerúndio liga naturalmente a ação benéfica de Deus ao fato de ele não deixar de acompanhá-los, sem tornar explícita além do texto uma relação estritamente causal ou final.
- source_word: יִרְאָתִי
  choice: o temor de mim
  rationale: O sufixo de primeira pessoa designa temor dirigido a Deus. “O temor de mim” evita que “meu temor” seja entendido como temor sentido pelo próprio Deus.
- source_word: בִּלְבָבָם
  choice: no coração deles
  rationale: “Coração” conserva a imagem hebraica do centro da vontade e da disposição interior e é claro em português moderno.
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: para que não se afastem de mim
  rationale: A construção exprime finalidade ou resultado pretendido, e “afastar-se de mim” traduz com naturalidade a ideia de abandonar a relação com Deus.
theological_decisions:
- issue: Duração da aliança
  choice: aliança perpétua
  alternative: aliança eterna; aliança duradoura
  rationale: “Perpétua” afirma a permanência expressa pelo hebraico sem definir a frase segundo um sistema teológico posterior.
- issue: Sentido do temor em relação a Deus
  choice: o temor de mim
  alternative: meu temor; temor a mim
  rationale: A expressão apresenta uma disposição de temor dirigida a Deus e dada por ele, sem reduzir o termo apenas a terror nem acrescentar uma definição doutrinária específica de perseverança.
- issue: A ação divina e a permanência do povo
  choice: para que não se afastem de mim
  alternative: a fim de que não se desviem de mim
  rationale: A tradução mantém a afirmação textual de que Deus põe esse temor no coração com a finalidade de impedir o afastamento, sem resolver debates posteriores sobre agência humana e preservação divina.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Farei uma aliança” verte idiomaticamente a expressão hebraica; “acompanhá-los” preserva a ideia de Deus continuar após eles sem reproduzir uma construção estranha em português. Todos os marcadores de nota aparecem no texto.
