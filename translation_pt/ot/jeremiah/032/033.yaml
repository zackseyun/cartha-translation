base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/033.yaml
  text: They turned their back to me and not their face[a]; though I taught them, rising early and teaching[b], they would not listen to receive correction.
translation:
  language: pt
  text: Deram-me as costas, e não o rosto. Embora eu os ensinasse, levantando-me cedo para ensiná-los[a], eles não davam ouvidos para receber correção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantando cedo e ensinando”, expressão que indica instrução diligente e repetida.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “para aceitar a disciplina”. O termo hebraico musar também pode significar instrução corretiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: Eles me deram as costas, e não o rosto
  rationale: A expressão portuguesa natural “dar as costas” comunica o gesto de rejeição expresso pelo contraste hebraico entre nuca/costas e rosto, sem acrescentar uma explicação ao texto.
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: Embora eu os ensinasse com persistência
  rationale: A relação concessiva é exigida pelo contexto. “Com persistência” transmite o sentido do idiomatismo jeremiano “levantar cedo e ensinar”, enquanto a nota preserva sua imagem literal.
- source_word: וְאֵינָם שֹׁמְעִים
  choice: eles não davam ouvidos
  rationale: A construção indica recusa contínua; “não davam ouvidos” é idiomático em português e preserva a ideia de não atender à instrução.
- source_word: לָקַחַת מוּסָר
  choice: para aceitar a correção
  rationale: מוּסָר abrange correção, disciplina e instrução formativa. “Aceitar a correção” se ajusta à repreensão profética sem restringir o termo a castigo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o contraste enfático entre costas e rosto, traduz o idiomatismo temporal de modo inteligível no corpo do texto e conserva sua forma hebraica em nota.
