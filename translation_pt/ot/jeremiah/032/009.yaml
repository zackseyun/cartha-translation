  text: וָֽ/אֶקְנֶה֙ אֶת הַ/שָּׂדֶ֔ה מֵ/אֵ֛ת חֲנַמְאֵ֥ל בֶּן דֹּדִ֖/י אֲשֶׁ֣ר בַּ/עֲנָת֑וֹת וָֽ/אֶשְׁקֲלָ/ה לּ/וֹ֙ אֶת הַ/כֶּ֔סֶף שִׁבְעָ֥ה שְׁקָלִ֖ים וַ/עֲשָׂרָ֥ה הַ/כָּֽסֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: pt
  text: 'Assim, comprei o campo de Hanamel, filho do meu tio, que estava em Anatote[a], e pesei-lhe a prata: dezessete siclos de prata[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como referência ao campo que ficava em Anatote.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “sete siclos e dez de prata”. O sentido usual é “dezessete siclos de prata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: Assim, comprei
  rationale: O wayyiqtol de קנה dá continuidade à narrativa e descreve uma compra concluída. “Assim” liga naturalmente a ação ao contexto anterior.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: שׂדה designa aqui a propriedade rural objeto da transação; “campo” é claro, corrente e preciso.
- source_word: מֵאֵת חֲנַמְאֵל
  choice: de Hanamel
  rationale: מֵאֵת indica a pessoa de quem a propriedade foi comprada. O nome é transliterado de modo simples e reconhecível em português.
- source_word: בֶּן דֹּדִי
  choice: filho do meu tio
  rationale: Preserva a relação familiar expressa literalmente no hebraico, sem substituí-la pelo termo mais geral “primo”.
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: que estava em Anatote
  rationale: Mantém a construção relativa do hebraico. Como o antecedente exato pode ser entendido de mais de uma maneira, a ambiguidade é registrada em nota.
- source_word: וָאֶשְׁקֲלָה לּוֹ אֶת הַכֶּסֶף
  choice: e pesei para ele a prata
  rationale: Preserva o ato concreto de pesar a prata usada como pagamento, em vez de reduzi-lo ao verbo genérico “pagar”.
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: dezessete siclos de prata
  rationale: A ordem hebraica “sete siclos e dez” expressa o total de dezessete. A formulação portuguesa comunica claramente o valor, enquanto a forma literal é indicada em nota.
- source_word: שְׁקָלִים
  choice: siclos
  rationale: “Siclo” é o termo tradicional e preciso para a unidade de peso usada na transação.
