  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה ב/שנת הָ/עֲשִׂרִ֔ית לְ/צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֧יא הַ/שָּׁנָ֛ה שְׁמֹנֶֽה עֶשְׂרֵ֥ה שָׁנָ֖ה לִ/נְבֽוּכַדְרֶאצַּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: pt
  text: A palavra que veio a Jeremias da parte de Yahweh, no décimo ano de Zedequias, rei de Judá. Esse era o décimo oitavo ano de Nabucodonosor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Mantém a fórmula profética tradicional e comunica uma mensagem divina sem parafraseá-la excessivamente.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Reproduz em português natural a expressão hebraica usual para a recepção profética da palavra.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Expressa claramente a origem divina da palavra e translitera o nome divino presente no texto hebraico.
- source_word: בשנת הָעֲשִׂרִית לְצִדְקִיָּהוּ
  choice: no décimo ano de Zedequias
  rationale: É a forma corrente em português para indicar o ano de reinado de um monarca.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Traduz diretamente o título real em aposição ao nome Zedequias.
- source_word: הִיא הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: que correspondia ao décimo oitavo ano
  rationale: Torna explícita, sem acrescentar conteúdo, a equivalência cronológica indicada pelo pronome hebraico e evita a repetição pouco natural de 'ano'.
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: de Nabucodonosor
  rationale: O prefixo ל, nesta fórmula cronológica, relaciona o ano ao reinado do monarca; 'Nabucodonosor' é a forma portuguesa tradicional e amplamente reconhecida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama; 'Yahweh' preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A abertura 'Esta é a palavra' soa natural como fórmula introdutória, enquanto 'da parte de' marca com clareza a fonte da revelação. A cronologia foi formulada de modo fluente, sem eliminar a relação explícita entre os dois anos de reinado.
