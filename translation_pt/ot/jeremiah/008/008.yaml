  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: pt
  text: 'Como podem dizer: “Somos sábios, e a lei de Yahweh está conosco”? Mas vejam: a pena mentirosa dos escribas a transformou em mentira.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na verdade, vejam, a pena dos escribas produziu falsidade”, ou: “a pena falsa dos escribas agiu falsamente”. O hebraico é compacto e permite mais de uma forma de expressar a falsificação praticada pelos escribas.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: אֵיכָה תֹאמְרוּ
  choice: Como podem dizer
  rationale: Expressa em português natural a pergunta retórica indignada e incrédula introduzida por אֵיכָה.
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: Somos sábios
  rationale: Mantém de forma direta a alegação dos interlocutores, sem especializar חֲכָמִים como uma classe formal de sábios.
- source_word: וְתוֹרַת יְהוָה
  choice: e a lei de Yahweh
  rationale: “Lei” conserva aqui o sentido textual e pactual de תּוֹרָה, enquanto “Yahweh” representa o nome divino יְהוָה.
- source_word: אִתָּנוּ
  choice: está conosco
  rationale: Reproduz o sentido básico de presença ou posse implícita sem definir além do texto como essa relação deve ser entendida.
- source_word: אָכֵן הִנֵּה
  choice: Mas vejam
  rationale: Marca a refutação enfática e chama a atenção dos ouvintes em linguagem moderna e digna.
- source_word: לַשֶּׁקֶר עָשָׂה
  choice: a transformou em mentira
  rationale: 'Comunica o possível sentido resultativo da construção: a pena dos escribas tornou falsa a lei mencionada. O pronome “a” retoma “a lei” sem repetir um objeto não expresso no hebraico.'
- source_word: עֵט שֶׁקֶר סֹפְרִים
  choice: a pena mentirosa dos escribas
  rationale: Entende שֶׁקֶר como caracterização da pena e preserva a acusação de falsificação ligada à atividade dos escribas.
theological_decisions:
- issue: Sentido de תּוֹרַת יְהוָה na polêmica profética
  choice: a lei de Yahweh
  alternative: a instrução de Yahweh
  rationale: “Lei” preserva a dimensão pactual e textual da expressão neste contexto, sem negar que תּוֹרָה também possa significar “instrução”.
- issue: Natureza da acusação contra os escribas
  choice: A formulação principal apresenta a pena dos escribas como transformando a lei em mentira.
  alternative: A construção pode dizer de modo mais geral que a pena produziu falsidade ou agiu falsamente.
  rationale: O hebraico é compacto e sintaticamente difícil; a tradução principal expressa uma leitura plausível, enquanto a nota mantém abertas outras construções sem decidir qual forma específica de falsificação ocorreu.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O plural implícito de תֹאמְרוּ é comunicado pela forma verbal “podem dizer”; “vejam” conserva o chamado coletivo de atenção sem recorrer ao arcaísmo “eis”.
