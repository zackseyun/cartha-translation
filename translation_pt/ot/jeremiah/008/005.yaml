  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: pt
  text: Por que este povo — Jerusalém — se desviou, num desvio persistente?[a] Eles se agarram ao engano; recusam-se a voltar.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num desvio perpétuo”, “numa infidelidade duradoura” ou “em apostasia contínua”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete palavras da mesma família associada a “virar-se/voltar”, contrapondo o desvio do povo à sua recusa de voltar.
    reason: lexical_alternative
  - marker: c
    text: '“Jerusalém” também pode ser entendido como vocativo: “Por que este povo se desviou, ó Jerusalém...?”'
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz naturalmente em português a pergunta retórica do hebraico.
- source_word: שׁוֹבְבָה
  choice: se desviou
  rationale: Expressa o afastamento em sentido negativo e permite conservar a relação verbal com o retorno no fim do versículo.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém a referência coletiva e o tom profético sem a conotação política mais estreita de “nação”.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: É entendido no texto principal como aposto que identifica “este povo”; a possibilidade de vocativo é preservada em nota.
- source_word: מְשֻׁבָה נִצַּחַת
  choice: um desvio persistente
  rationale: Comunica uma deserção contínua e arraigada, preservando a repetição sem recorrer ao termo eclesiástico “apostasia”.
- source_word: הֶחֱזִיקוּ בַּתַּרְמִית
  choice: Eles se agarram ao engano
  rationale: “Agarrar-se” transmite a ideia de apego firme e deliberado; “engano” representa de modo conciso תרמית.
- source_word: מֵאֲנוּ לָשׁוּב
  choice: recusam-se a voltar
  rationale: Preserva tanto a resistência voluntária expressa por מאן quanto o sentido básico de שוב e seu contraste com o desvio anterior.
theological_decisions:
- issue: Jogo de palavras com formas de שוב e מְשׁוּבָה
  choice: “se desviou” / “desvio” / “voltar”
  alternative: “apostatou” / “apostasia” / “arrepender-se”
  rationale: A tradução escolhida torna perceptível a contraposição entre afastar-se e voltar, sem explicitar além do hebraico a dimensão teológica de arrependimento.
- issue: Função sintática de “Jerusalém”
  choice: Aposto de “este povo”, marcado por travessões
  alternative: 'Vocativo: “Por que este povo se desviou, ó Jerusalém...?”'
  rationale: A leitura apositiva identifica o povo como Jerusalém e parece a construção mais natural, mas a sintaxe permite a leitura vocativa, registrada em nota.
- issue: Força de נִצַּחַת
  choice: persistente
  alternative: perpétuo; duradouro; incessante
  rationale: “Persistente” comunica uma conduta contínua e arraigada sem sugerir necessariamente duração metafísica ou irreversível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão acusatória do hebraico, evita terminologia confessional técnica no texto principal e registra em notas as ambiguidades lexical e sintática.
