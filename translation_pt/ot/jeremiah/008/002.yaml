reference: Jeremiah 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: pt
  text: Eles os estenderão diante do sol, da lua e de todo o exército dos céus[a], que eles amaram e serviram, que seguiram, buscaram[b] e diante dos quais se prostraram. Não serão recolhidos nem sepultados; ficarão como esterco sobre a face do solo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a hoste do céu”. A expressão pode designar coletivamente os corpos celestes.'
    reason: lexical_alternative
  - marker: b
    text: “Buscaram” também pode ser traduzido por “consultaram” ou “indagaram”, ressaltando a procura de orientação religiosa junto aos corpos celestes.
    reason: lexical_alternative
  - marker: c
    text: Expressão hebraica que também pode ser vertida por “sobre a superfície do solo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: Eles os estenderão
  rationale: O verbo שׁטח descreve a exposição dos restos mencionados no contexto anterior, estendidos publicamente; “estenderão” preserva a imagem concreta sem reduzi-la a mero espalhamento.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: diante do sol, da lua
  rationale: A preposição ל indica aqui exposição perante os corpos celestes, não movimento em direção a eles. “Diante de” comunica isso naturalmente em português.
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: e de todo o exército dos céus
  rationale: “Exército” conserva a imagem coletiva de צבא, enquanto “dos céus” reflete a forma hebraica e mantém explícito o contexto de veneração dos corpos celestes.
- source_word: אֲשֶׁר אֲהֵבוּם וַאֲשֶׁר עֲבָדוּם
  choice: que eles amaram e serviram
  rationale: Mantém distintos o afeto devocional e o serviço cultual, sem substituir ambos por um único termo genérico como “adoraram”.
- source_word: וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: que seguiram
  rationale: O idioma hebraico “andar após” indica seguir em lealdade. “Seguiram” é corrente em português e comunica o sentido sem artificialidade.
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: buscaram
  rationale: דרשׁ pode significar buscar, consultar ou indagar em contexto religioso. “Buscaram” preserva a amplitude sem restringir o ato à adivinhação; a alternativa é registrada em nota.
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: diante dos quais se prostraram
  rationale: השׁתחוה descreve prostração reverente. A formulação preserva o gesto físico e seu caráter cultual, distinguindo-o do verbo anterior “serviram”.
- source_word: לֹא יֵאָסְפוּ וְלֹא יִקָּבֵרוּ
  choice: Não serão recolhidos nem sepultados
  rationale: A construção passiva mantém a referência ao tratamento funerário negado aos restos e reproduz de forma clara os dois verbos hebraicos.
- source_word: לְדֹמֶן
  choice: como esterco
  rationale: דמן designa esterco ou excremento. “Esterco” conserva a imagem deliberadamente humilhante e contundente da profecia.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face do solo
  rationale: A expressão mantém a imagem hebraica de algo abandonado e exposto na superfície da terra.
theological_decisions:
- issue: Sequência de verbos que descreve a devoção aos corpos celestes
  choice: 'Preservar as ações distintas: amaram, serviram, seguiram, buscaram e se prostraram'
  alternative: Resumir a sequência com termos gerais como “adoraram” ou “veneraram”
  rationale: O acúmulo de verbos apresenta a devoção como abrangente. Manter cada ação conserva a força retórica e evita impor uma sistematização teológica ao texto.
- issue: Sentido de צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  alternative: todos os astros do céu; toda a hoste celestial
  rationale: A escolha preserva a metáfora coletiva de צבא e a referência celestial sem decidir se o conjunto deve ser entendido apenas como astros ou de maneira mais abrangente.
- issue: Amplitude religiosa de דְּרָשׁוּם
  choice: buscaram, com nota sobre “consultaram” ou “indagaram”
  alternative: consultaram diretamente no texto
  rationale: O verbo admite tanto busca devocional quanto consulta religiosa. O texto principal conserva a amplitude, e a nota torna visível a possibilidade de consulta oracular.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A repetição hebraica foi moderadamente condensada sem eliminar a sequência de ações. “Exército dos céus” mantém a imagem do original, enquanto as notas esclarecem alternativas menos correntes.
