source:
  edition: WLC
  text: כִּי֩ הִנְ/נִ֨י מְשַׁלֵּ֜חַ בָּ/כֶ֗ם נְחָשִׁים֙ צִפְעֹנִ֔ים אֲשֶׁ֥ר אֵין לָ/הֶ֖ם לָ֑חַשׁ וְ/נִשְּׁכ֥וּ אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: pt
  text: Pois eis que envio no meio de vocês serpentes, víboras que não podem ser encantadas,[a] e elas morderão vocês — declaração de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para as quais não há encantamento” ou “não há fórmula de encantamento”.
    reason: Preserva a expressão hebraica e esclarece que essas serpentes não podem ser controladas por encantamento.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a função explicativa ou causal da conjunção em relação ao contexto anterior.
- source_word: הִנְנִי מְשַׁלֵּחַ
  choice: eis que envio
  rationale: A construção enfatiza uma ação iminente e certa; esta formulação é digna, clara e natural em registro bíblico moderno.
- source_word: בָּכֶם
  choice: contra vocês
  rationale: A preposição בְּ permite 'entre/no meio de' ou, em contexto hostil, 'contra'. Aqui, a ação punitiva e a mordida favorecem 'contra', sem eliminar totalmente a imagem de serpentes soltas no meio do povo.
- source_word: נְחָשִׁים צִפְעֹנִים
  choice: serpentes, víboras
  rationale: '''Serpentes'' traduz o termo geral, e ''víboras'' comunica o caráter venenoso do segundo termo.'
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: que não podem ser encantadas
  rationale: Expressa naturalmente o sentido contextual de serpentes não controláveis por encantamento, enquanto a nota preserva a forma mais literal.
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: e elas os morderão
  rationale: O verbo denota especificamente morder; o pronome explícito deixa claro que as serpentes são o sujeito.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Mantém o peso da fórmula profética nominal e translitera diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de בָּכֶם no anúncio de juízo
  choice: contra vocês
  alternative: entre vocês; no meio de vocês
  rationale: O contexto de ataque e mordida favorece o sentido adversativo, embora a construção também possa evocar serpentes enviadas para o meio do povo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Evitou-se linguagem excessivamente arcaica; 'eis que' foi mantido por seu valor enfático e deítico.
