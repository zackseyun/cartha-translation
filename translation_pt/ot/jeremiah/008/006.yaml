  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: pt
  text: 'Prestei atenção e escutei: eles não falam corretamente[a]. Ninguém se arrepende de sua maldade, dizendo: “O que foi que eu fiz?” Cada um volta à sua própria corrida[b], como um cavalo que se lança impetuosamente à batalha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles não dizem o que é certo”. Literalmente: “não assim falam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cada um volta ao seu próprio curso”. A expressão hebraica retrata a persistência impetuosa de cada pessoa no caminho que escolheu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: Prestei atenção e escutei
  rationale: A combinação dos dois verbos ressalta a escuta deliberada e cuidadosa; a tradução preserva essa progressão sem reduzi-la a simples percepção auditiva.
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: eles não falam como deveriam
  rationale: A expressão significa literalmente “não assim falam”. No contexto, censura o conteúdo ou a maneira de falar; a formulação portuguesa é natural e mantém essa avaliação sem especificar indevidamente se a fala é falsa, injusta ou imprópria.
- source_word: אֵין אִישׁ
  choice: Ninguém
  rationale: Embora אִישׁ seja masculino singular, aqui tem força representativa e indefinida. “Ninguém” é a forma corrente em português e comunica o alcance geral sem alterar o sentido.
- source_word: נִחָם עַל רָעָתוֹ
  choice: se arrepende de sua maldade
  rationale: נחם, neste contexto moral, indica pesar e mudança de disposição diante do mal praticado; “arrepender-se” conserva essa força. רעה designa aqui maldade, não calamidade.
- source_word: לֵאמֹר מֶה עָשִׂיתִי
  choice: 'dizendo: “O que foi que eu fiz?”'
  rationale: Reproduz a pergunta de autoexame sem acrescentar “de errado”, que está implícito no contexto, mas não aparece no hebraico.
- source_word: כֻּלֹּה שָׁב בִּמְרֻצוֹתָם
  choice: Cada um retoma sua própria corrida
  rationale: A formulação comunica o valor distributivo de כֻּלֹּה e a imagem de persistência no movimento escolhido. “Retoma” preserva a ideia de voltar ou tornar, enquanto “corrida” mantém a imagem concreta de מרוצה.
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: como um cavalo que se lança impetuosamente à batalha
  rationale: שוטף retrata movimento violento e incontido. A tradução conserva a imagem vívida de um cavalo avançando com ímpeto para o combate.
theological_decisions:
- issue: Força moral de נִחָם no contexto
  choice: se arrepende
  alternative: sente pesar
  rationale: O contexto trata da recusa em reconhecer e abandonar a maldade. “Arrepende-se” exprime adequadamente o pesar moral com mudança de disposição, sem impor uma formulação doutrinária técnica.
- issue: Referência humana genérica de אֵין אִישׁ
  choice: Ninguém
  alternative: Nenhum homem
  rationale: O masculino singular hebraico funciona representativamente. Em português atual, “ninguém” transmite com precisão a negação universal e evita sugerir, sem base contextual, que apenas os homens do sexo masculino estejam em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe é direta, e a imagem concreta da corrida que culmina no cavalo lançado à batalha foi preservada. As notas registram as ambiguidades genuínas sem sobrecarregar o texto principal.
