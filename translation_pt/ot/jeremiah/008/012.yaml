  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: pt
  text: Será que ficaram envergonhados por terem cometido uma abominação? Não, não sentiram vergonha alguma; nem sequer souberam corar. Por isso, cairão entre os que caem; no tempo de seu castigo[a], tropeçarão, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo de sua visitação”. O hebraico pode indicar o momento em que Deus visita alguém para julgá-lo ou chamá-lo a prestar contas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: Será que ficaram envergonhados
  rationale: A forma é entendida, à luz do contexto e do paralelo em Jeremias 6:15, como pergunta retórica, seguida por uma negação enfática.
- source_word: כִּי תוֹעֵבָה עָשׂוּ
  choice: por terem cometido uma abominação
  rationale: “Por” expressa a relação causal; “cometer uma abominação” conserva a forte carga moral e religiosa de תוֹעֵבָה em português natural.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: Não, não sentiram vergonha alguma
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a negação; “vergonha alguma” reproduz essa ênfase.
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: nem sequer souberam corar
  rationale: “Corar” comunica a manifestação visível da vergonha e mantém a progressão retórica, enquanto “nem sequer” explicita a força climática da frase.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: cairão entre os que caem
  rationale: Mantém a repetição e o jogo verbal do hebraico, indicando que compartilharão o destino dos que caem sob o juízo.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: no tempo de seu castigo
  rationale: Neste contexto de juízo, פְּקֻדָּה denota a ocasião em que são visitados para punição ou chamados a prestar contas.
- source_word: יִכָּשְׁלוּ
  choice: tropeçarão
  rationale: Preserva a metáfora de perder o equilíbrio e cair, adequada à linguagem profética de juízo.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Emprega o presente idiomático da fórmula profética e translitera o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Sentido judicial de פְּקֻדָּה
  choice: castigo
  alternative: visitação; prestação de contas
  rationale: O contexto anuncia queda e tropeço como juízo. “Castigo” torna claro o sentido judicial, enquanto a nota preserva a amplitude lexical da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e as repetições ligadas à vergonha e à queda foram preservadas sem suavizar a denúncia profética.
