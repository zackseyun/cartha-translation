  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: pt
  text: De Dã se ouve o resfolegar dos seus cavalos; ao som dos relinchos dos seus cavalos poderosos[a], toda a terra estremece[b]. Eles vêm e devoram a terra e tudo o que nela há[c], a cidade e os seus habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus garanhões” ou “seus fortes cavalos”. O termo hebraico enfatiza força ou nobreza e, neste contexto, designa poderosos cavalos de guerra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todo o território estremece” ou “a terra inteira estremece”. O hebraico אֶרֶץ pode designar tanto uma terra ou região quanto a terra em sentido mais amplo.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Literalmente: “a terra e a sua plenitude”, isto é, tudo o que a enche.'
    reason: literal_rendering
lexical_decisions:
- source_word: מִדָּן
  choice: De Dã
  rationale: Preserva o topônimo e a ideia de procedência; Dã, no extremo norte, é o ponto de onde se percebe a chegada do invasor.
- source_word: נִשְׁמַע נַחְרַת סוּסָיו
  choice: se ouve o resfolegar dos seus cavalos
  rationale: A forma passiva de שׁמע descreve percepção auditiva, e נַחְרַת designa o som forte da respiração ou do resfolegar dos cavalos. O presente mantém a vivacidade profética.
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: ao som dos relinchos dos seus cavalos poderosos
  rationale: מִצְהֲלוֹת são relinchos, e אַבִּירָיו, literalmente ligado à força ou nobreza, refere-se aqui aos fortes cavalos de guerra sem necessariamente especificar o sexo.
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  choice: toda a terra estremece
  rationale: רעש expressa tremor ou abalo. אֶרֶץ pode ser tanto a terra ou território atingido quanto, em sentido mais amplo, a terra inteira; a tradução preserva essa abertura.
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: Eles vêm e devoram
  rationale: Os verbos fazem a cena avançar. O presente histórico comunica a iminência vívida da invasão, e 'devoram' conserva a metáfora violenta do hebraico אכל.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: a terra e tudo o que nela há
  rationale: מְלוֹאָהּ significa literalmente 'sua plenitude', isto é, tudo aquilo que enche a terra. A formulação escolhida transmite o sentido com naturalidade em português.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: a cidade e os seus habitantes
  rationale: Expressa de modo claro e natural a cidade e aqueles que nela habitam, sem acrescentar identificação não presente no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com presente histórico para conservar a vivacidade da cena profética. Evitou-se 'corcéis' por ser excessivamente literário e 'plenitude' no texto principal por soar pouco natural neste contexto. A repetição de 'cavalos' esclarece o referente de אַבִּירָיו, enquanto a nota preserva suas alternativas lexicais.
