  text: גַּם חֲסִידָ֣ה בַ/שָּׁמַ֗יִם יָֽדְעָה֙ מֽוֹעֲדֶ֔י/הָ וְ/תֹ֤ר ו/סוס וְ/עָג֔וּר שָׁמְר֖וּ אֶת עֵ֣ת בֹּאָ֑/נָה וְ/עַמִּ֕/י לֹ֣א יָֽדְע֔וּ אֵ֖ת מִשְׁפַּ֥ט יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: pt
  text: Até a cegonha no céu conhece seus tempos determinados; a rola, o andorinhão[a] e o grou respeitam o tempo de sua chegada. Mas o meu povo não conhece o juízo do SENHOR.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: andorinha. A identificação exata da ave é incerta.'
    reason: O hebraico סוס admite identificações próximas e não totalmente seguras.
  - marker: b
    text: 'Ou: a determinação do SENHOR; ou: o que o SENHOR requer.'
    reason: O hebraico מִשְׁפַּט tem campo semântico amplo, incluindo juízo, justiça, determinação e norma exigida.
lexical_decisions:
- source_word: חֲסִידָה (ḥăsîdâ)
  choice: cegonha
  rationale: É a identificação lexical usual da ave e mantém a imagem de uma ave migratória que reconhece suas épocas.
- source_word: מוֹעֲדֶיהָ (môʿădêhā)
  choice: seus tempos determinados
  rationale: Expressa tanto a ideia temporal quanto a de períodos fixados, sem reduzir o plural a uma única estação.
- source_word: סוס (sûs)
  choice: andorinhão
  rationale: A identificação exata é discutida; “andorinhão” corresponde a uma opção lexical antiga e se ajusta ao comportamento migratório do contexto.
- source_word: שָׁמְרוּ (šāmĕrû)
  choice: observam
  rationale: Preserva o sentido de notar e cumprir fielmente um tempo, em português natural.
- source_word: מִשְׁפַּט (mišpāṭ)
  choice: juízo
  rationale: Mantém a amplitude do termo hebraico, que pode indicar juízo, justiça, determinação ou ordem estabelecida por Deus.
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Emprega a convenção portuguesa tradicional para representar o nome divino, distinguindo-o tipograficamente do título comum “Senhor”.
theological_decisions:
- issue: Sentido de מִשְׁפַּט יְהוָה
  choice: o juízo do SENHOR
  alternative: a determinação do SENHOR / o que o SENHOR requer
  rationale: “Juízo” preserva a tensão entre a ordem estabelecida por Deus, sua exigência justa e seu ato judicial; a nota registra sentidos contextualmente possíveis sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética equilibrada. “No céu” traduz naturalmente o plural idiomático hebraico; “tempos determinados” conserva a noção de períodos fixados. Os nomes das aves seguem a sequência do texto massorético, e as ambiguidades lexicais relevantes são registradas em notas.
