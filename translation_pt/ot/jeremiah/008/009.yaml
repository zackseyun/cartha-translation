id: JER.8.9
reference: Jeremiah 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: pt
  text: 'Os sábios foram envergonhados; ficaram consternados e foram capturados.[a] Vejam: rejeitaram a palavra de Yahweh. Que sabedoria, então, possuem?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram apanhados” ou “caíram numa armadilha”. O verbo hebraico pode indicar ser capturado ou preso numa cilada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: foram envergonhados
  rationale: Preserva o efeito causativo/passivo do hifil e comunica a desonra pública sofrida pelos sábios, não apenas um sentimento íntimo de vergonha.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Designa a classe reconhecida de sábios de Judá. O artigo e o masculino plural preservam a referência contextual sem tornar a expressão desnecessariamente pesada.
- source_word: חַתּוּ
  choice: ficaram apavorados
  rationale: O verbo descreve perda de coragem, consternação ou terror diante da derrota. A formulação é natural em português e mantém a intensidade da sequência.
- source_word: וַיִּלָּכֵדוּ
  choice: e foram capturados
  rationale: לכד pode indicar captura, apreensão ou queda numa armadilha. “Foram capturados” expressa com clareza que o juízo os alcançou, enquanto a nota preserva outras nuances possíveis.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Funciona como marcador discursivo que chama a atenção para a explicação seguinte, em linguagem moderna e direta.
- source_word: בִדְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דבר, neste contexto profético, refere-se à palavra ou mensagem revelada por Deus; “palavra” mantém a formulação bíblica e a ligação com a sabedoria rejeitada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: מָאָסוּ
  choice: rejeitaram
  rationale: מאס indica repúdio ou recusa deliberada, e não apenas antipatia emocional.
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: Que sabedoria, então, possuem?
  rationale: A pergunta retórica nega que tenham verdadeira sabedoria depois de rejeitarem a palavra de Yahweh. “Então” torna explícita, sem exagero, a relação lógica marcada pelo contexto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título, sem adotar a forma híbrida posterior “Jeová”.
- issue: Natureza da sabedoria dos sábios
  choice: 'Manter a pergunta retórica: “Que sabedoria, então, possuem?”'
  alternative: 'Explicitar: “Eles não têm sabedoria alguma”'
  rationale: A pergunta do hebraico confronta a pretensão dos sábios sem converter a tensão retórica em uma afirmação interpretativa absoluta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação breve conserva o ritmo incisivo da denúncia profética. “Vejam” evita o arcaísmo de “Eis que”, e a nota foi colocada após “capturados”, termo ao qual pertence.
