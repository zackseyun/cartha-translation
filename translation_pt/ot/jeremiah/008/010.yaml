source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: pt
  text: Por isso, entregarei suas esposas a outros e seus campos aos que tomarão posse deles[a]; pois, do menor ao maior, todos são ávidos por lucro injusto[b]; do profeta ao sacerdote, todos praticam a falsidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a herdeiros”. O verbo hebraico pode significar “herdar” ou “tomar posse”; aqui, provavelmente inclui a ideia de novos possuidores se apoderarem dos campos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são ávidos por ganho”. A expressão hebraica pode indicar avidez por ganho em geral, embora, em contextos proféticos, muitas vezes implique lucro desonesto ou injusto.'
    reason: lexical_alternative
  - marker: c
    text: Ou “agem com falsidade” ou “procedem de modo enganoso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Mantém a conexão lógica entre a acusação anterior e o juízo anunciado, em português natural.
- source_word: אֶתֵּן
  choice: entregarei
  rationale: O imperfeito de נתן, numa declaração profética de juízo, aponta naturalmente para uma ação futura; “entregarei” comunica também a ideia contextual de pôr em poder de outros.
- source_word: נְשֵׁיהֶם
  choice: suas mulheres
  rationale: אשה pode significar “mulher” ou “esposa”. Com o sufixo possessivo, “esposas” é provável, mas “mulheres” preserva a amplitude lexical do hebraico sem impedir esse sentido contextual.
- source_word: לַאֲחֵרִים
  choice: a outros
  rationale: Reproduz o substantivo adjetival sem acrescentar “homens” ou “estrangeiros”, elementos não explicitados no hebraico.
- source_word: שְׂדוֹתֵיהֶם
  choice: seus campos
  rationale: Expressa diretamente a propriedade agrícola concreta mencionada no texto.
- source_word: לְיוֹרְשִׁים
  choice: aos que tomarão posse deles
  rationale: ירשׁ pode indicar herdar, possuir ou tomar posse. No contexto de perda judicial, a formulação comunica novos possuidores sem restringir o sentido a uma herança legal.
- source_word: כִּי מִקָּטֹן וְעַד גָּדוֹל
  choice: Pois, do menor ao maior
  rationale: Conserva o merismo que abrange pessoas de todas as posições sociais, com formulação idiomática em português.
- source_word: כֻּלֹּה
  choice: todos
  rationale: Representa de modo natural a força distributiva e abrangente do termo no contexto.
- source_word: בֹּצֵעַ בָּצַע
  choice: são ávidos por lucro injusto
  rationale: A construção cognata intensifica a busca de ganho; “lucro injusto” explicita a conotação ilícita frequente no contexto profético, sem ocultar a alternativa mais geral.
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: do profeta ao sacerdote
  rationale: Preserva o segundo merismo, que inclui as classes de liderança religiosa.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: praticam a falsidade
  rationale: עשה + שקר descreve envolvimento ativo e habitual em falsidade, não apenas uma mentira isolada.
theological_decisions:
- issue: Natureza do juízo anunciado sobre as mulheres e os campos
  choice: Apresentar a perda da família e da propriedade como ação judicial de Deus
  alternative: Entender a frase apenas como descrição impessoal de perdas de guerra
  rationale: A primeira pessoa, “entregarei”, atribui diretamente a ação ao locutor divino. A tradução mantém a severidade do juízo sem acrescentar pormenores não declarados.
- issue: Sentido de נְשֵׁיהֶם
  choice: suas mulheres
  alternative: suas esposas
  rationale: O contexto favorece “esposas”, mas o substantivo hebraico também pode significar “mulheres”; a escolha conserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela dos dois merismos foi preservada. As notas mantêm alternativas lexicais reais sem impor uma interpretação denominacional.
