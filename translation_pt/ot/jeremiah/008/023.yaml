reference: Jeremiah 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: pt
  text: 'Quem dera minha cabeça fosse água,

    e meus olhos, uma fonte de lágrimas,

    para que eu chorasse dia e noite

    pelos mortos da filha do meu povo!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A fórmula hebraica, literalmente «quem dará?», expressa um desejo intenso ou lamento. «Quem dera» reproduz essa força de modo natural e poético em português.
- source_word: רֹאשִׁי מַיִם
  choice: minha cabeça fosse água
  rationale: Mantém a imagem corporal e hiperbólica do hebraico sem a transformar numa abstração.
- source_word: וְעֵינִי
  choice: e meus olhos
  rationale: Embora a forma hebraica esteja no singular, o português emprega naturalmente o plural ao falar do órgão par neste contexto; a nota registra a forma da fonte.
- source_word: מְקוֹר דִּמְעָה
  choice: uma fonte de lágrimas
  rationale: «Fonte» comunica com clareza a ideia de nascente ou manancial inesgotável e conserva o registro poético.
- source_word: וְאֶבְכֶּה
  choice: para que eu chorasse
  rationale: No contexto do desejo inicial, a forma volitiva indica a finalidade ou o resultado desejado.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Expressão portuguesa corrente que preserva o merismo hebraico de lamento contínuo.
- source_word: חַלְלֵי
  choice: os mortos
  rationale: No contexto, designa os que foram mortos violentamente, sobretudo vítimas de guerra. «Mortos» é claro e digno; «mortos à espada» acrescentaria uma especificidade ausente neste termo.
- source_word: בַת עַמִּי
  choice: a filha do meu povo
  rationale: Preserva a personificação profética da comunidade em vez de a reduzir simplesmente a «meu povo».
theological_decisions:
- issue: Preservação da personificação בַת עַמִּי
  choice: a filha do meu povo
  alternative: meu povo
  rationale: A expressão personifica poeticamente a comunidade e contribui para a intensidade afetiva do lamento; não deve ser achatada sem necessidade.
- issue: Identidade da voz lamentadora
  choice: Não identificar explicitamente o falante na tradução
  alternative: Explicitar que é Jeremias ou o próprio Deus
  rationale: O versículo não nomeia o falante, e o contexto literário permite tensão quanto à voz. A tradução preserva essa ambiguidade em vez de impor uma identificação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A disposição em versos acompanha o paralelismo e a progressão do lamento. «Quem dera» oferece dignidade poética sem soar arcaico; «filha do meu povo» mantém deliberadamente a imagem profética.
