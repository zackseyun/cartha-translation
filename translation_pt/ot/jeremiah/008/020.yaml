  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָבַ֥ר קָצִ֖יר כָּ֣לָה קָ֑יִץ וַ/אֲנַ֖חְנוּ ל֥וֹא נוֹשָֽׁעְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: pt
  text: A colheita passou, o verão acabou, e nós não fomos salvos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “libertos”: o verbo hebraico pode indicar resgate de perigo ou calamidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר
  choice: passou
  rationale: O qal perfeito indica um acontecimento concluído; “passou” é natural em português e comunica que a época já se foi.
- source_word: קָצִיר
  choice: a colheita
  rationale: O substantivo designa a colheita e, neste paralelismo poético, também evoca sua época; a forma escolhida é clara e concisa.
- source_word: כָּלָה
  choice: acabou
  rationale: O qal perfeito expressa conclusão. “Acabou” forma um paralelo natural com “passou” e é facilmente compreendido.
- source_word: קַיִץ
  choice: o verão
  rationale: No paralelismo com “colheita”, o sentido sazonal comum é o mais adequado; a possível associação com frutos de verão não precisa ser explicitada.
- source_word: וַאֲנַחְנוּ
  choice: e nós
  rationale: O waw coordena as orações. Embora o contexto permita uma nuance adversativa, “e” preserva mais diretamente a forma hebraica sem prejudicar a naturalidade.
- source_word: לֹא נוֹשָׁעְנוּ
  choice: não fomos salvos
  rationale: O nifal perfeito na primeira pessoa do plural expressa que a esperada salvação ou libertação não ocorreu. O pretérito perfeito soa natural em português e preserva a voz passiva.
theological_decisions:
- issue: Sentido de ישׁע no contexto de lamentação nacional
  choice: salvos
  alternative: libertos
  rationale: “Salvos” preserva o alcance lexical e a ressonância bíblica da intervenção divina, sem restringir a frase à salvação eterna; neste contexto, trata-se de resgate diante do perigo ou da calamidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura breve e poética do hebraico foi preservada, assim como a coordenação por “e” e a tensão entre o passar das estações e a ausência de salvação.
