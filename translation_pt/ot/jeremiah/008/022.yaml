id: JER.8.22
reference: Jeremiah 8:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: pt
  text: Não há bálsamo em Gileade?[a] Não há ali médico? Por que, então, não veio a cura da filha do meu povo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resina” ou “bálsamo medicinal”. O termo hebraico se refere a uma goma ou resina medicinal associada a Gileade.
    reason: lexical_alternative
  - marker: b
    text: Ou “recuperação” ou “restabelecimento”, em vez de “cura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: bálsamo
  rationale: O termo designa uma goma ou resina medicinal associada a Gileade. “Bálsamo” é natural em português, mantém a imagem medicinal e evita tecnicismo excessivo.
- source_word: אֵין
  choice: não há
  rationale: A partícula expressa inexistência; nas perguntas retóricas, “não há...?” reproduz com naturalidade a força do hebraico.
- source_word: בְּגִלְעָד
  choice: em Gileade
  rationale: Uso locativo direto do nome geográfico, na forma portuguesa tradicional e amplamente reconhecida.
- source_word: אִם
  choice: força interrogativa em uma segunda pergunta
  rationale: Neste paralelismo, אִם introduz outra pergunta retórica, não uma condição; por isso, a tradução inicia uma nova pergunta.
- source_word: רֹפֵא
  choice: médico
  rationale: O particípio significa aquele que cura. “Médico” combina com a imagem do bálsamo e é corrente, claro e digno em português.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio de lugar que retoma Gileade; “ali” evita repetição e soa natural em português.
- source_word: כִּי מַדּוּעַ
  choice: Por que, então
  rationale: A expressão introduz uma inferência a partir das perguntas anteriores; “então” torna explícito esse encadeamento retórico sem acrescentar conteúdo.
- source_word: לֹא עָלְתָה
  choice: não veio
  rationale: Embora עלה signifique literalmente subir ou surgir, com אֲרֻכָה indica que a cura ainda não se manifestou ou ocorreu. “Não veio” conserva algo da imagem dinâmica e é idiomático.
- source_word: אֲרֻכַת
  choice: a cura
  rationale: O substantivo denota cura, recuperação ou restabelecimento. “Cura” preserva de modo conciso a metáfora médica central.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: A expressão personifica o povo e comunica o tom afetivo e lamentoso do texto profético; mantê-la evita achatar a imagem em uma simples referência a “meu povo”.
theological_decisions:
- issue: Se a expressão profética “filha do meu povo” deve ser parafraseada como “meu povo”
  choice: Manter “a filha do meu povo” no texto principal
  alternative: “meu povo” ou “meu querido povo”
  rationale: A expressão hebraica tem função personificadora e lamentacional. Sua preservação mantém o peso literário e afetivo sem acrescentar identificação ou interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. As perguntas retóricas e a personificação profética foram preservadas; a ordem foi ajustada apenas onde necessário para a fluidez em português.
