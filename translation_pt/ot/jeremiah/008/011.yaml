  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: pt
  text: 'Trataram superficialmente[a] a ferida da filha do meu povo, dizendo: “Paz,[b] paz”, quando não há paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levianamente” ou “como se fosse algo sem importância”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico shalom também pode significar “bem-estar”, “integridade” ou “segurança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: Tratam
  rationale: 'O verbo רפא significa literalmente “curar”. Neste contexto acusatório, porém, a cura não é real: os responsáveis apenas lidam com a ferida de modo superficial. “Tratam” conserva a imagem médica e deixa a ironia clara sem afirmar que houve cura.'
- source_word: שֶׁבֶר
  choice: ferida
  rationale: שׁבר pode indicar fratura, ruptura, dano ou ruína. Sua combinação com רפא destaca aqui a imagem de uma lesão que precisa de tratamento; “ferida” é natural em português e preserva essa figura.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Mantém a personificação profética do povo como filha, preservando a força afetiva e poética da expressão hebraica.
- source_word: עַל נְקַלָּה
  choice: superficialmente
  rationale: A expressão denuncia um tratamento leviano de uma situação grave, como se a ferida fosse insignificante. “Superficialmente” comunica com clareza a insuficiência do cuidado.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma natural de introduzir em português o conteúdo da falsa declaração de segurança.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: “Paz, paz”
  rationale: Preserva tanto a repetição enfática e sua força de slogan quanto o termo tradicional “paz”; a amplitude semântica de שָׁלוֹם é indicada em nota.
- source_word: וְאֵין שָׁלוֹם
  choice: quando não há paz
  rationale: Expressa o contraste entre a garantia proclamada e a realidade, sem eliminar a relação circunstancial possível no hebraico.
theological_decisions:
- issue: Preservação da personificação profética
  choice: Manter “a filha do meu povo” no texto principal
  alternative: “meu povo” ou “meu querido povo”
  rationale: A formulação hebraica personifica o povo como filha e carrega peso poético, afetivo e pactual. Simplificá-la apagaria uma imagem significativa do texto.
- issue: Amplitude semântica de שָׁלוֹם
  choice: Usar “paz” no texto principal
  alternative: “bem-estar”, “segurança” ou “está tudo bem”
  rationale: “Paz” preserva a repetição solene do hebraico e a tensão teológica entre a promessa enganosa e a realidade. Uma nota registra os demais sentidos possíveis sem resolver indevidamente a ambiguidade.
- issue: Aspecto da cura denunciada
  choice: Traduzir רפא por “tratam”
  alternative: “curam” ou “tentam curar”
  rationale: “Curam” poderia sugerir êxito real, precisamente negado pelo contexto; “tentam curar” acrescentaria explicitamente uma intenção não marcada pelo verbo. “Tratam” mantém a metáfora clínica e a ironia da ação inadequada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e a repetição do hebraico foram preservadas onde têm força retórica; a construção “filha do meu povo” foi mantida deliberadamente como personificação profética.
