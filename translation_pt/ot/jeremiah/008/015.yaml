  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
translation:
  language: pt
  text: Esperávamos[a] paz[b], mas não veio bem algum; esperávamos um tempo de cura, mas eis[c] o terror[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Aguardávamos” ou “Tínhamos esperança de encontrar”. O verbo pode expressar esperança, espera ou expectativa.
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode significar bem-estar, integridade ou plenitude, e não apenas ausência de conflito.
    reason: lexical_alternative
  - marker: c
    text: Ou “mas vejam”. “Eis” assinala a apresentação súbita do que de fato ocorreu.
    reason: lexical_alternative
  - marker: d
    text: Ou “espanto”, “pavor” ou “consternação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  choice: Esperávamos
  rationale: Embora a forma seja morfologicamente ambígua quando isolada, o contexto apresenta um lamento coletivo. O imperfeito em português expressa uma expectativa mantida no passado e permite recuperar naturalmente o sujeito da primeira pessoa do plural.
- source_word: לְשָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם pode abranger paz, bem-estar e integridade. “Paz” é natural e mantém a amplitude básica do termo, explicitada em nota.
- source_word: וְאֵין טוֹב
  choice: mas não veio bem algum
  rationale: O hebraico diz literalmente “e não há bem”. A formulação portuguesa conserva a negação enfática e torna natural o contraste com aquilo que se esperava, sem especificar que tipo de bem estaria em vista.
- source_word: לְעֵת מַרְפֵּה
  choice: um tempo de cura
  rationale: Preserva tanto a expressão temporal quanto a metáfora ampla de cura, que pode indicar restauração física, social ou nacional.
- source_word: וְהִנֵּה
  choice: mas eis
  rationale: “Eis” retém a função apresentativa e o efeito de surpresa de הִנֵּה; “mas” comunica o contraste marcado pelo paralelismo.
- source_word: בְעָתָה
  choice: terror
  rationale: O substantivo denota terror, espanto ou pavor. “Terror” é conciso e mantém o contraste forte com a cura esperada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe paralela própria de um lamento coletivo. A repetição de “esperávamos” no segundo membro explicita a elipse hebraica para maior clareza, sem alterar o sentido. “Eis” preserva o impacto retórico do original.
