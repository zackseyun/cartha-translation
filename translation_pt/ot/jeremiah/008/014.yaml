id: JER.8.14
reference: Jeremiah 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: pt
  text: Por que continuamos aqui sentados? Reúnam-se, e entremos nas cidades fortificadas; pereçamos ali[a], pois Yahweh, nosso Deus, nos condenou à ruína e nos deu água envenenada para beber[b], porque pecamos contra Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquemos ali em silêncio” ou “sejamos destruídos ali”. O verbo hebraico pode transmitir as ideias de silêncio, imobilidade ou ruína.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “água de veneno” ou “água de planta venenosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: continuamos aqui sentados
  rationale: O verbo significa literalmente estar sentado, permanecer ou habitar. Na pergunta retórica, comunica inatividade e permanência no lugar; a formulação preserva a imagem concreta e explicita naturalmente essa continuidade.
- source_word: הֵאָסְפוּ
  choice: Reúnam-se
  rationale: O imperativo nifal convoca o povo a juntar-se. A forma pronominal portuguesa transmite com naturalidade a força reflexiva e a urgência do chamado.
- source_word: עָרֵי הַמִּבְצָר
  choice: cidades fortificadas
  rationale: A expressão designa centros urbanos preparados para defesa e mantém claramente o contexto militar.
- source_word: וְנִדְּמָה
  choice: pereçamos ali
  rationale: A raiz דמה pode exprimir silêncio, imobilidade ou destruição. Neste contexto de juízo e invasão, 'pereçamos' comunica a provável ideia de ruína sem esconder em nota a ambiguidade lexical.
- source_word: הֲדִמָּנוּ
  choice: nos condenou à ruína
  rationale: A forma causativa da mesma raiz indica que Yahweh levou ou destinou o povo à ruína. A expressão preserva tanto a ação divina quanto o caráter judicial do contexto, sem especificar além do texto o meio da destruição.
- source_word: מֵי רֹאשׁ
  choice: água envenenada
  rationale: רֹאשׁ refere-se a uma substância ou planta venenosa e amarga. 'Água envenenada' conserva a imagem concreta em português corrente; a forma mais literal consta em nota.
- source_word: חָטָאנוּ לַיהוָה
  choice: pecamos contra Yahweh
  rationale: A preposição é vertida idiomaticamente por 'contra', indicando que o pecado constitui ofensa dirigida a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido das duas formas da raiz דמה no contexto do juízo
  choice: O povo reconhece que Yahweh o condenou à ruína e fala em perecer nas cidades fortificadas.
  alternative: O povo propõe ficar em silêncio nas cidades, e Yahweh o silenciou.
  rationale: A menção à invasão implícita, às cidades fortificadas, à água venenosa e à confissão de pecado favorece o sentido de ruína ou destruição. Como a raiz também admite silêncio ou imobilidade, a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta inicial mantém a imagem hebraica de estar sentado, enquanto 'continuamos aqui' comunica a passividade contextual. O paralelismo da raiz דמה é representado por 'pereçamos' e 'condenou à ruína', e sua ambiguidade é registrada na nota [a].
