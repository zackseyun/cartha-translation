id: JER.8.4
reference: Jeremiah 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/יִפְּל֖וּ וְ/לֹ֣א יָק֑וּמוּ אִם יָשׁ֖וּב וְ/לֹ֥א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: pt
  text: 'Você lhes dirá: “Assim diz Yahweh: Será que alguém cai e não se levanta? Será que alguém se desvia e não volta?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que alguém volta atrás e não retorna?” O hebraico repete o mesmo verbo, com o sentido de “voltar/retornar”, para produzir efeito retórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Você lhes dirá
  rationale: Expressa naturalmente em português a incumbência profética dirigida a Jeremias; a conjunção inicial pode ser omitida sem perda no início do recorte.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional e traduz o tetragrama pelo nome pessoal Yahweh.
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: Será que alguém cai e não se levanta?
  rationale: A partícula interrogativa introduz uma pergunta retórica. O singular genérico 'alguém' é natural em português, embora os verbos hebraicos estejam no plural.
- source_word: אִם
  choice: Será que
  rationale: No contexto, introduz uma segunda pergunta retórica paralela, e não uma condição.
- source_word: יָשׁוּב וְלֹא יָשׁוּב
  choice: alguém se desvia e não volta
  rationale: Distingue contextualmente o primeiro movimento, afastar-se ou mudar de rumo, do retorno subsequente, sem ocultar que o hebraico repete o mesmo verbo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração Yahweh preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da repetição de שׁוב
  choice: se desvia e não volta
  alternative: volta atrás e não retorna
  rationale: O contexto favorece a ideia de desviar-se e depois retornar, mas a repetição hebraica admite uma formulação mais literal; a nota conserva essa ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'Será que' comunica de modo natural a força das perguntas retóricas, e 'alguém' funciona como sujeito genérico.
