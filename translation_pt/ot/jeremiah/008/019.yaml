  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: pt
  text: 'Eis o clamor da filha do meu povo[a], vindo de uma terra distante[b]: “Yahweh não está em Sião? O Rei dela não está nela?” “Por que me provocaram à ira com suas imagens esculpidas, com ídolos estrangeiros[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o som do clamor da filha do meu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de uma terra de grandes distâncias”, isto é, de muito longe.'
    reason: lexical_alternative
  - marker: c
    text: Ou, mais literalmente, “com vaidades estrangeiras”; é uma expressão hebraica que ridiculariza os ídolos como vazios e sem valor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis
  rationale: Introduz com urgência aquilo que o profeta percebe. “Eis” é conciso, digno e combina naturalmente com a referência ao clamor.
- source_word: קוֹל שַׁוְעַת
  choice: o clamor
  rationale: A construção significa literalmente “o som do clamor”, mas “o clamor” comunica de modo natural o grito angustiado sem redundância; a forma literal é preservada em nota.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Mantém a metáfora familiar e coletiva característica da linguagem profética, sem reduzi-la simplesmente a “meu povo”.
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: vindo de uma terra distante
  rationale: O plural hebraico expressa grande distância. A formulação portuguesa é idiomática e mantém a imagem de um clamor procedente de longe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵין בְּצִיּוֹן
  choice: Yahweh não está em Sião?
  rationale: Reproduz a pergunta retórica negativa de modo claro e natural.
- source_word: אִם מַלְכָּהּ אֵין בָּהּ
  choice: O Rei dela não está nela?
  rationale: Mantém o paralelismo com a pergunta anterior e as referências femininas a Sião. “Rei” recebe inicial maiúscula porque, no paralelismo, se refere a Yahweh.
- source_word: הִכְעִסוּנִי
  choice: me provocaram à ira
  rationale: 'Preserva a força causativa do hifil: o povo fez com que Deus se irasse.'
- source_word: בִּפְסִילֵיהֶם
  choice: com suas imagens esculpidas
  rationale: Mantém o sentido concreto de imagens talhadas ou esculpidas, em vez de usar apenas o termo geral “ídolos”.
- source_word: בְּהַבְלֵי נֵכָר
  choice: com ídolos estrangeiros
  rationale: No contexto de polêmica contra a idolatria, הבל designa aquilo que é vazio e sem valor, funcionando como referência depreciativa aos ídolos. A nota preserva a imagem lexical literal.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz explicitamente o tetragrama; a transliteração preserva o caráter de nome próprio.
- issue: Referente de “Rei” em Sião
  choice: “Rei” com inicial maiúscula, referindo-se a Yahweh
  alternative: “rei” com inicial minúscula, entendido como referência genérica ou ao monarca humano
  rationale: 'As duas perguntas estão em paralelismo: a presença de Yahweh em Sião corresponde à presença do Rei dela. A maiúscula sinaliza esse referente contextual sem acrescentar outro título ao texto.'
- issue: Alternância de vozes no versículo
  choice: Manter separadas a pergunta do povo e a resposta divina por dois pares de aspas
  alternative: Apresentar todas as perguntas como uma única fala
  rationale: A mudança da terceira pessoa (“Yahweh”) para a primeira pessoa divina (“me provocaram”) indica uma provável mudança de voz. A pontuação a torna perceptível, embora o hebraico não traga marcas de citação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva a metáfora profética “filha do meu povo”, o nome Yahweh e o paralelismo poético. As notas registram as formulações hebraicas mais literais sem sobrecarregar o texto principal.
