  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: pt
  text: A morte será preferida à vida por todo o remanescente que restar desta família má, em todos os lugares restantes para onde os expulsei — declaração de Yahweh dos Exércitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִבְחַר מָוֶת מֵחַיִּים
  choice: A morte será preferida à vida
  rationale: O nifal de בחר apresenta a morte como objeto de escolha, e מִן marca comparação ou preferência. “Será preferida à vida” reproduz naturalmente em português a formulação passiva e o contraste contundente do hebraico.
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: por todo o remanescente que restar
  rationale: Com a construção passiva, לְ indica naturalmente o agente em português. “Remanescente” preserva a ressonância profética de שְׁאֵרִית, enquanto “que restar” mantém a repetição intencional da raiz שׁאר.
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: desta família má
  rationale: “Família” é a equivalência mais direta e acessível para מִשְׁפָּחָה, embora “clã” também seja possível. “Má” traduz רָעָה sem acrescentar uma interpretação moral mais específica.
- source_word: בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים
  choice: em todos os lugares que restarem
  rationale: O particípio masculino plural הַנִּשְׁאָרִים concorda formalmente com “lugares”. A tradução conserva essa construção incomum, em vez de transferir silenciosamente a ideia de sobrevivência às pessoas.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: para onde eu os expulsei
  rationale: O hifil de נדח expressa fazer afastar, dispersar ou expulsar. “Expulsei” comunica com clareza a ação divina de desterro, e “para onde” incorpora de modo natural o advérbio שָׁם.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declaração de Yahweh dos Exércitos
  rationale: “Declaração de” preserva o caráter formular de נְאֻם. “Yahweh” representa diretamente o nome divino, e “dos Exércitos” mantém a amplitude tradicional do título צְבָאוֹת.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Linguagem do remanescente
  choice: remanescente
  alternative: sobreviventes
  rationale: '“Remanescente” conserva a linguagem profética e sua tensão neste contexto: trata-se dos que restaram, mas eles continuam sob juízo, sem que o termo seja convertido automaticamente em promessa de restauração.'
- issue: Agente da preferência pela morte
  choice: por todo o remanescente
  alternative: para todo o remanescente
  rationale: A construção permite alguma tensão sintática, mas, junto da forma passiva de “escolher”, o לְ é entendido como indicação daqueles que preferirão a morte. A tradução não explica por que o farão nem suaviza a severidade da declaração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “remanescente que restar” é deliberada para refletir o jogo da mesma raiz hebraica. Conservou-se a formulação incomum referente aos “lugares que restarem”, acompanhada de nota, em vez de harmonizá-la silenciosamente.
