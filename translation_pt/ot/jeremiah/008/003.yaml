  naturalness: “Em todos os lugares que restarem, para onde eu os expulsei” é compreensível, mas a combinação de oração relativa no futuro com “para onde” torna a frase menos fluida. “Em todos os lugares restantes para onde os expulsei” é mais natural e preserva a construção incomum do hebraico.
  terminology: “Remanescente”, “família má”, “Yahweh” e “dos Exércitos” são escolhas apropriadas. “Será preferida à vida” comunica bem a preferência comparativa expressa no hebraico.
