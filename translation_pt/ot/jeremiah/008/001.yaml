  terminology: “Yahweh”, “ossos”, “sacerdotes”, “profetas”, “habitantes” e “túmulos” são escolhas adequadas. Para שָׂרָיו, “oficiais de Judá” é mais exato e idiomático neste contexto do que “seus líderes”.
