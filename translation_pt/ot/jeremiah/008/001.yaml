id: JER.8.1
reference: Jeremiah 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: pt
  text: Naquele tempo — declaração de Yahweh —, tirarão de seus túmulos os ossos dos reis de Judá, os ossos dos oficiais de Judá, os ossos dos sacerdotes, os ossos dos profetas e os ossos dos habitantes de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português, preservando a referência dêitica do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Preserva o caráter solene da fórmula profética nominal, sem transformá-la simplesmente em discurso direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְיֹצִיאוּ
  choice: tirarão
  rationale: O hiphil indica fazer sair ou retirar; o sujeito plural não expresso permanece indeterminado, como no hebraico.
- source_word: עַצְמוֹת
  choice: ossos
  rationale: Mantém o termo concreto e sua repetição enfática ao longo da enumeração.
- source_word: מַלְכֵי יְהוּדָה
  choice: os reis de Judá
  rationale: Reprodução direta e natural da cadeia construta hebraica.
- source_word: שָׂרָיו
  choice: seus líderes
  rationale: שׂרים designa autoridades ou dirigentes; “líderes” é claro e abrangente, enquanto o sufixo masculino singular é preservado sem explicitar um referente que o texto deixa implícito.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente do ofício cultual.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Equivalente corrente, sem necessidade contextual de variação.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: os habitantes de Jerusalém
  rationale: Expressa naturalmente o particípio substantivado coletivo, isto é, os que residem na cidade.
- source_word: מִקִּבְרֵיהֶם
  choice: dos seus túmulos
  rationale: קבר pode indicar sepultura ou túmulo; “túmulos” comunica com clareza os locais de onde os ossos serão retirados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Repetição retórica de עַצְמוֹת
  choice: Repetir “os ossos” diante de cada grupo
  alternative: Mencionar “os ossos” uma única vez e condensar a lista
  rationale: A repetição hebraica intensifica a abrangência e o horror da profanação futura; sua conservação continua natural em português.
- issue: Referente do sufixo em שָׂרָיו
  choice: Preservar “seus líderes” sem resolver explicitamente o referente
  alternative: “os líderes de Judá” ou “os líderes dos reis”
  rationale: O sufixo hebraico é masculino singular, mas o referente contextual não precisa ser explicitado. A formulação conserva essa relativa abertura em vez de impor uma identificação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe solene adequada ao discurso profético. Os travessões destacam a fórmula parentética “declaração de Yahweh”. A repetição de “os ossos” reproduz deliberadamente a cadência enfática do original.
