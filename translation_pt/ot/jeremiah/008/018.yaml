  text: My sorrow is beyond healing[b][a]; my heart is sick within me.
translation:
  language: pt
  text: Não há alívio para a minha tristeza[a][b]; meu coração está enfermo em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil. Outra tradução possível: «Eu buscaria consolo em meio à tristeza; meu coração está enfermo em mim».'
    reason: alternative_reading
  - marker: b
    text: A palavra inicial parece referir-se a consolo, alívio, refrigério ou vigor, mas sua nuance exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַבְלִיגִיתִי
  choice: não tem alívio
  rationale: A forma hebraica é difícil e admite sentidos relacionados a consolo, alívio ou recuperação. No contexto do lamento, a expressão idiomática «não tem alívio» comunica a ausência de consolo sem definir de modo excessivo a nuance incerta.
- source_word: עֲלֵי
  choice: na construção «minha tristeza não tem alívio»
  rationale: A preposição, literalmente «sobre», integra uma expressão poética muito condensada. A tradução reorganiza a oração em português natural sem tentar atribuir-lhe uma relação semântica mais precisa do que o hebraico permite.
- source_word: יָגוֹן
  choice: tristeza
  rationale: O substantivo denota tristeza, pesar ou aflição. «Tristeza» é claro, digno e apropriado ao tom de lamento.
- source_word: לִבִּי
  choice: meu coração
  rationale: Preserva a imagem hebraica do coração como centro da vida interior e das emoções.
- source_word: דַוָּי
  choice: está enfermo
  rationale: O adjetivo expressa enfermidade, fraqueza ou abatimento. «Está enfermo» mantém a metáfora corporal e o tom poético.
- source_word: עָלַי
  choice: dentro de mim
  rationale: Embora a preposição signifique literalmente «sobre mim», junto de «meu coração» indica idiomaticamente a experiência interior do falante.
