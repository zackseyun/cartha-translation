  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: pt
  text: “Eu certamente os recolherei[a]”, declara Yahweh. “Não há uvas na videira nem figos na figueira; até a folha murchou, e aquilo que lhes dei passará para longe deles[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os varrerei por completo” ou “Eu certamente os consumirei”. O hebraico emprega uma forma intensificada do verbo “recolher”, que, neste contexto de juízo, pode sugerir remoção ou destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração final é difícil em hebraico. Também pode significar: “aquilo que lhes dei será tirado deles”, ou algo semelhante.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: Eu certamente os recolherei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. O verbo אסף significa basicamente “reunir, recolher, retirar”; no contexto de juízo, pode implicar remoção ou destruição, mas a tradução principal conserva seu sentido lexical sem explicitar além do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força da fórmula profética e representa diretamente o nome divino יהוה como “Yahweh”.
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: Não há uvas na videira
  rationale: Tradução direta e idiomática da oração existencial e da imagem agrícola.
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: nem figos na figueira
  rationale: Preserva o paralelismo com a oração anterior em português natural.
- source_word: וְהֶעָלֶה נָבֵל
  choice: até a folha murchou
  rationale: Conserva o singular coletivo do hebraico e expressa naturalmente o estado resultante indicado por נבל.
- source_word: וָאֶתֵּן לָהֶם
  choice: aquilo que lhes dei
  rationale: Mantém o sentido amplo de נתן sem identificar indevidamente o objeto como terra, lei ou bênçãos.
- source_word: יַעַבְרוּם
  choice: passará para longe deles
  rationale: A forma é sintaticamente difícil. Esta opção preserva a ideia de movimento ou desaparecimento associada a עבר e comunica perda sem definir de modo excessivo a relação gramatical.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Grau de explicitação nas expressões obscuras de juízo
  choice: Conservar as imagens de recolhimento e de algo que passa para longe
  alternative: Explicitar como consumo total e retirada daquilo que Deus havia dado
  rationale: O início intensificado e, sobretudo, a oração final admitem mais de uma interpretação. A tradução mantém a tensão e registra alternativas em notas, em vez de resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo profético foi preservado, assim como o singular coletivo “a folha”. As ambiguidades reais do início intensificado e da oração final são mantidas no texto e esclarecidas em notas.
