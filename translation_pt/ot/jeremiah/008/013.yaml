review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a intensificação em אָסֹף אֲסִיפֵם, a fórmula profética com o nome Yahweh, o paralelismo agrícola e a ambiguidade substancial da oração final. Contudo, “passará para longe deles” não expressa de modo natural em português a relação de perda/afastamento pretendida pela leitura adotada de יַעַבְרוּם.
  naturalness: O registro é moderno e adequado. A formulação final “aquilo que lhes dei passará para longe deles” é pouco idiomática e soa mecanicamente calcada no inglês. “Se afastará deles” conserva a imagem de movimento e produz português claro, sem resolver a dificuldade hebraica como uma retirada explicitamente causada por Deus.
  terminology: “Yahweh”, “videira”, “figueira”, “recolherei” e “juízo” são escolhas consistentes e apropriadas. As notas mantêm alternativas genuínas sem impor uma interpretação confessional.
  issues:
  - severity: medium
    issue: Formulação pouco natural da oração final
    rationale: Em português, “passará para longe deles” é uma construção estranha para um objeto dado que deixa de pertencer aos destinatários. “Se afastará deles” preserva a noção de passagem/afastamento associada a עבר e a perda contextual, ao mesmo tempo que deixa aberta a sintaxe difícil do hebraico.
  revised_text: “Eu certamente os recolherei[a]”, declara Yahweh. “Não há uvas na videira nem figos na figueira; até a folha murchou, e aquilo que lhes dei se afastará deles[b].”
  revised_footnotes:
  - marker: a
    text: 'Ou: “Eu os varrerei por completo” ou “Eu certamente os consumirei”. O hebraico emprega uma forma intensificada do verbo “recolher”, que, neste contexto de juízo, pode sugerir remoção ou destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração final é difícil em hebraico. Também pode significar: “aquilo que lhes dei será tirado deles”, ou algo semelhante.'
    reason: alternative_reading
  revision_rationale: A revisão limita-se à oração final, substituindo uma expressão pouco idiomática por uma formulação portuguesa natural que ainda conserva a ambiguidade e o movimento de afastamento da tradução-base. As âncoras e o conteúdo das notas permanecem adequados.
