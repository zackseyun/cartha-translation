review_pass:
  verdict: revise
  source_fidelity: 'A abertura é adequadamente próxima do hebraico: o infinitivo absoluto intensifica «recolherei», sem exigir que a tradução principal especifique destruição. A oração final, porém, não é bem representada por «aquilo que lhes dei passará para longe deles»: essa redação introduz «aquilo que» como sujeito e «para longe deles», embora o hebraico massorético pareça construir «darei a eles» seguido de um verbo plural de referente incerto e sufixo «os». Uma formulação mais literal preserva melhor a sintaxe difícil, com nota que registra as leituras interpretativas.'
  naturalness: O português é claro e de registro profético apropriado. Na revisão, «os que passarão sobre eles» é deliberadamente incomum, pois reproduz uma obscuridade real do texto; a nota torna a dificuldade explícita. A pontuação das citações foi mantida de modo natural para a fórmula intercalada «declara Yahweh».
  terminology: «Yahweh», «videira», «figueira», «recolherei» e «murchou» são escolhas adequadas e amplamente compreensíveis. «Recolher» mantém a latitude lexical de אסף, e a alternativa de remoção destrutiva fica corretamente em nota.
  issues:
  - severity: medium
    issue: A cláusula final foi excessivamente reconstituída como «aquilo que lhes dei passará para longe deles».
    rationale: O hebraico וָאֶתֵּן לָהֶם יַעַבְרוּם é sintaticamente muito difícil, mas sua sequência superficial contém «darei a eles» e um verbo plural com sufixo «os». A redação proposta troca essa construção por uma oração em que bens previamente dados desaparecem deles. Essa é uma possibilidade interpretativa, mas não deve substituir sem sinalização a formulação principal.
  revised_text: “Eu certamente os recolherei[a]”, declara Yahweh. “Não há uvas na videira nem figos na figueira; até a folha murchou, e lhes darei os que passarão sobre eles[b].”
  revised_footnotes:
  - marker: a
    text: 'Ou: “Eu os varrerei por completo” ou “Eu certamente os consumirei”. O hebraico emprega uma forma intensificada do verbo “recolher”, que, neste contexto de juízo, pode sugerir remoção ou destruição.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é muito difícil em hebraico. Literalmente, a construção pode ser entendida como “e lhes darei os que passarão sobre eles”. Também pode ser interpretada como “aquilo que lhes dei será tirado deles”, ou de modo semelhante.
    reason: alternative_reading
  revision_rationale: A revisão limita-se à cláusula final e à respectiva nota. Ela evita apresentar como sentido inequívoco uma reconstituição interpretativa que não reflete diretamente a sintaxe do texto massorético, ao mesmo tempo que conserva em nota a leitura contextual de perda ou retirada. As demais escolhas são mantidas.
