base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: pt
  text: 'Assim diz o SENHOR dos Exércitos, o Deus de Israel: “Vá e diga aos homens de Judá e aos habitantes de Jerusalém: ‘Vocês não aceitarão instrução para ouvir as minhas palavras?’, declara o SENHOR.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: o SENHOR dos Exércitos
  rationale: Mantém a forma portuguesa tradicional para o nome divino e traduz צְבָאוֹת pelo título consagrado e compreensível “dos Exércitos”.
- source_word: לְאִישׁ יְהוּדָה
  choice: ao povo de Judá
  rationale: O singular אִישׁ tem aqui sentido coletivo; “povo de Judá” comunica isso naturalmente, sem sugerir que Jeremias devesse falar com um único homem.
- source_word: מוּסָר
  choice: instrução
  rationale: O termo abrange ensino corretivo, disciplina e advertência. “Instrução” preserva a amplitude no texto, enquanto a nota explicita as possibilidades.
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  choice: para dar ouvidos às minhas palavras
  rationale: “Dar ouvidos” expressa o sentido de escutar com atenção e responder, e “para” mantém a relação final indicada pelo infinitivo hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Reproduz a fórmula profética de confirmação com linguagem atual e dignificada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR em versaletes
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida sem atribuir ao nome uma vocalização cuja forma exata é discutida.
- issue: Relação entre aceitar a instrução e ouvir as palavras divinas
  choice: “instrução para dar ouvidos”
  alternative: “instrução, dando ouvidos” ou “instrução e darão ouvidos”
  rationale: A construção final conserva a direção do hebraico sem fundir totalmente instrução e obediência nem tratá-las como ações desconexas.
translation_notes:
  register: Português moderno, claro e solene, com tratamento plural por “vocês”, adequado à interpelação coletiva. A pontuação distingue a fala divina, a mensagem citada e a fórmula profética final.
