  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: pt
  text: 'E à família dos recabitas Jeremias disse: “Assim diz Yahweh dos Exércitos, o Deus de Israel: Visto que vocês obedeceram à ordem de Jeonadabe[a], seu pai, guardaram todas as ordens dele e fizeram tudo conforme ele lhes ordenou,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Jeonadabe; em outras passagens, o nome também aparece na forma Jonadabe.'
    reason: Registra a variante tradicional de transliteração do mesmo nome sem alterar a forma representada neste versículo.
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: E à família dos recabitas
  rationale: בֵּית pode indicar casa, família ou linhagem. “Família” comunica naturalmente em português que se trata do grupo descendente dos recabitas, sem sugerir um edifício.
- source_word: אָמַר יִרְמְיָהוּ
  choice: Jeremias disse
  rationale: Tradução direta e natural da fórmula narrativa.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e tradicional, ainda clara no português atual.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título abrangente e reconhecível “dos Exércitos”.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz com naturalidade a razão da declaração divina que prossegue no versículo seguinte.
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: vocês obedeceram à ordem de
  rationale: Neste contexto, שׁמע expressa escuta que resulta em obediência, não mera percepção auditiva.
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: Jeonadabe, seu antepassado
  rationale: “Jeonadabe” representa a forma hebraica presente; אָב pode designar o ancestral fundador de uma linhagem, sentido exigido pelo contexto coletivo e geracional.
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: guardaram todas as ordens dele
  rationale: “Guardar” conserva a linguagem bíblica de observar fielmente instruções, enquanto “ordens” é corrente e evita repetição pesada.
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: fizeram tudo conforme ele lhes ordenou
  rationale: “Conforme” preserva a força da preposição כְּ, indicando ação de acordo com tudo o que fora ordenado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de אָבִיכֶם aplicado a Jeonadabe
  choice: seu antepassado
  alternative: seu pai
  rationale: A fala é dirigida à família recabita muitas gerações depois de Jeonadabe. “Antepassado” comunica o valor genealógico possível de אָב sem transformar Jeonadabe no pai imediato dos ouvintes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A construção permanece aberta porque a declaração iniciada por “Visto que” continua no versículo seguinte; por isso, conserva-se a vírgula final dentro das aspas.
