  text: וַ/נִּשְׁמַ֗ע בְּ/ק֨וֹל יְהוֹנָדָ֤ב בֶּן רֵכָב֙ אָבִ֔י/נוּ לְ/כֹ֖ל אֲשֶׁ֣ר צִוָּ֑/נוּ לְ/בִלְתִּ֤י שְׁתֽוֹת יַ֨יִן֙ כָּל יָמֵ֔י/נוּ אֲנַ֣חְנוּ נָשֵׁ֔י/נוּ בָּנֵ֖י/נוּ וּ/בְנֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: pt
  text: 'Assim, obedecemos a tudo o que Jonadabe, filho de Recabe, nosso pai, nos ordenou: não beber vinho por todos os nossos dias — nós, nossas mulheres, nossos filhos e nossas filhas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: obedecemos
  rationale: A construção שׁמע בְּקוֹל é uma expressão idiomática que significa dar ouvidos no sentido de acatar e obedecer. Em português, “obedecemos” transmite esse sentido com naturalidade.
- source_word: יְהוֹנָדָב בֶּן־רֵכָב
  choice: Jonadabe, filho de Recabe
  rationale: As formas tradicionais portuguesas dos nomes identificam com clareza as personagens; “Jonadabe” representa a forma hebraica plena יְהוֹנָדָב.
- source_word: אָבִינוּ
  choice: nosso antepassado
  rationale: Embora o sentido literal seja “nosso pai”, no contexto Jonadabe pertence a uma geração ancestral. “Antepassado” comunica a relação histórica sem sugerir que fosse o pai imediato dos falantes.
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: a tudo o que ... nos ordenou
  rationale: Preserva a abrangência de כֹל e expressa de modo idiomático que eles cumpriram a totalidade da ordem.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן כָּל־יָמֵינוּ
  choice: nunca beber vinho
  rationale: A negação seguida de “todos os nossos dias” estabelece uma proibição vitalícia. “Nunca” expressa essa duração de modo conciso e natural.
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: nem nós, nem nossas mulheres, nem nossos filhos, nem nossas filhas
  rationale: A repetição de “nem” torna explícita em português a aplicação da proibição a cada grupo mencionado e mantém a enumeração enfática do hebraico.
