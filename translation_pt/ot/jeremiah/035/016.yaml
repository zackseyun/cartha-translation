  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: pt
  text: Pois os filhos de Jonadabe, filho de Recabe, cumpriram a ordem do pai deles[a], que ele lhes ordenou, mas este povo não me ouviu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu antepassado”; em hebraico, “o pai deles”.
    reason: lexical_alternative
  - marker: b
    text: “Ouvir” aqui também pode ter o sentido de “obedecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração anterior e preserva com naturalidade a força explicativa do hebraico.
- source_word: הֵקִימוּ
  choice: cumpriram
  rationale: No hifil, em combinação com מִצְוַת, o verbo expressa fazer uma ordem permanecer em vigor mediante sua observância; “cumpriram” comunica esse sentido idiomático em português atual.
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: os filhos de Jonadabe, filho de Recabe
  rationale: בְּנֵי pode designar filhos ou descendentes. “Filhos” mantém a forma familiar e a retórica do hebraico, sendo compreensível no contexto do clã.
- source_word: מִצְוַת
  choice: a ordem
  rationale: מִצְוָה denota uma ordem ou prescrição. “Ordem” é clara, atual e preserva sua força de autoridade.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: Reproduz diretamente o hebraico “pai deles”; no contexto, Jonadabe é antepassado do grupo, possibilidade indicada em nota.
- source_word: אֲשֶׁר צִוָּם
  choice: que ele lhes deu
  rationale: Em português, “dar uma ordem” expressa de modo natural a ideia de ordenar-lhes, evita repetição pouco elegante e mantém clara a referência à ordem mencionada.
- source_word: וְהָעָם הַזֶּה
  choice: mas este povo
  rationale: A conjunção tem força contrastiva no contexto, opondo a obediência dos recabitas à recusa do povo; “este povo” preserva o tom distanciador do demonstrativo.
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: não me ouviu
  rationale: שׁמע com אֶל significa escutar alguém e frequentemente implica obedecer. “Não me ouviu” conserva o sentido lexical e deixa audível a implicação de desobediência.
theological_decisions:
- issue: Linguagem filial aplicada ao clã recabita
  choice: seu pai
  alternative: seu antepassado
  rationale: O hebraico emprega diretamente “pai”, e o contraste retórico depende da obediência a um pai humano em oposição à recusa do povo em ouvir o SENHOR. A nota registra o referente ancestral sem substituir a imagem do texto.
- issue: Relação entre ouvir e obedecer
  choice: não me ouviu
  alternative: não me obedeceu
  rationale: A formulação conserva a imagem hebraica de ouvir, enquanto o contexto comunica sua dimensão de obediência. A nota explicita essa extensão sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e o contraste do hebraico foram preservados, evitando linguagem excessivamente arcaica ou confessional.
