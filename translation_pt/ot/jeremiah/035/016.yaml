review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a relação explicativa de כִּי, o contraste introduzido por וְ, a linguagem de 'ouvir' e a força de observância de הֵקִימוּ. Contudo, 'seu pai' introduz em português uma ambiguidade possessiva desnecessária e pode ser ligado a Jonadabe singularmente, em vez de aos 'filhos'/'descendentes'. Além disso, 'que ele lhes deu' é aceitável como expressão idiomática para dar uma ordem, mas explicita menos diretamente o verbo צִוָּם, 'ordenou-lhes'.
  naturalness: O registro é moderno, claro e apropriado. 'Pois', 'cumpriram' e 'mas este povo' soam naturais. 'O pai deles' torna o referente coletivo inequívoco sem sacrificar a linguagem filial do hebraico; 'que ele lhes ordenou' é natural apesar da repetição semântica e corresponde mais precisamente ao original.
  terminology: Jonadabe e Recabe são formas portuguesas adequadas. 'Ordem' traduz bem מִצְוָה neste contexto. Mantêm-se 'pai' e 'ouviu', com notas que registram respectivamente o possível sentido de antepassado e a implicação de obedecer.
  issues:
