source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: pt
  text: 'Mas eles disseram[a]: “Não beberemos vinho, pois Jonadabe, filho de Recabe, nosso pai[b], nos ordenou: ‘Não beberão vinho, vocês nem seus filhos[c], nunca.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles disseram”. A conjunção narrativa hebraica admite as duas traduções; “mas” ressalta o contraste com o convite anterior para beber vinho.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “nosso pai” significa antepassado ou ancestral.
    reason: cultural_note
  - marker: c
    text: O hebraico diz especificamente “filhos”, isto é, descendentes do sexo masculino, e não um termo genérico para descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mas eles disseram
  rationale: A conjunção narrativa faz o relato avançar, enquanto “mas” expressa naturalmente o contraste contextual com o convite anterior para beber vinho; “e” continua sendo uma alternativa possível.
- source_word: לֹא נִשְׁתֶּה יָּיִן
  choice: Não beberemos vinho
  rationale: O imperfeito expressa aqui a decisão e recusa dos recabitas, bem representada pelo futuro em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da recusa em registro natural e digno.
- source_word: יוֹנָדָב בֶּן רֵכָב
  choice: Jonadabe, filho de Recabe
  rationale: Emprega as formas portuguesas tradicionais e transparentes dos nomes e traduz diretamente o patronímico.
- source_word: אָבִינוּ
  choice: nosso pai
  rationale: Preserva a expressão hebraica e seu sentido de pertencimento ancestral, sem substituí-la silenciosamente por uma interpretação.
- source_word: צִוָּה עָלֵינוּ
  choice: nos ordenou
  rationale: Tradução idiomática da construção hebraica, mantendo sua força obrigatória.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: Em português atual, os dois-pontos introduzem a citação de modo mais natural que a fórmula literal “dizendo”, sem perda de conteúdo.
- source_word: לֹא תִשְׁתּוּ יַיִן
  choice: nunca beberão vinho
  rationale: No contexto de uma ordem transmitida, o futuro tem força prescritiva; “nunca”, em conjunto com a formulação, comunica a proibição duradoura.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: Vocês e seus filhos
  rationale: Mantém explicitamente os dois grupos e traduz בנים pelo termo masculino específico “filhos”, em vez do mais geral “crianças” ou “descendentes”.
- source_word: עַד עוֹלָם
  choice: nunca
  rationale: A formulação negativa “nunca beberão” expressa em português natural a duração indefinida e permanente de עַד עוֹלָם.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O diálogo mantém tom digno e direto. As formas “Jonadabe” e “Recabe” seguem o uso bíblico consolidado em português. Os marcadores de nota aparecem no texto em ordem alfabética.
