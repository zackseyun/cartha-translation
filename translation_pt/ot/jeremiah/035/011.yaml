- from: 'Mas, quando Nabucodonosor, rei da Babilônia, avançou contra esta terra, dissemos: “Venham, vamos entrar em Jerusalém para escapar do exército dos caldeus[a] e do exército de Arã[b]”. Por isso, passamos a morar em Jerusalém.'
  to: 'Mas, quando Nabucodonosor, rei da Babilônia, avançou contra a terra, dissemos: “Venham, vamos entrar em Jerusalém por causa do exército dos caldeus[a] e do exército de Arã[b]”. E passamos a morar em Jerusalém.'
  rationale: A revisão remove o demonstrativo não expresso no hebraico e substitui a finalidade interpretativa «para escapar de» pela relação causal mais direta de מִפְּנֵי. Mantêm-se a formulação natural da fala coletiva, os nomes e as alternativas lexicais anotadas.
