base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: pt
  text: 'Mas, quando Nabucodonosor, rei da Babilônia, avançou contra a terra, dissemos: “Venham, vamos entrar em Jerusalém por causa do exército dos caldeus[a] e do exército de Arã[b]”. E passamos a morar em Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “babilônios”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente traduzido como “Síria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: Mas, quando ... avançou
  rationale: A construção narrativa introduz uma circunstância temporal em contraste com a instrução anterior; no contexto militar, עלה descreve o avanço de um invasor.
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Usa as formas portuguesas correntes do nome pessoal e do título geográfico.
- source_word: אֶל הָאָרֶץ
  choice: contra esta terra
  rationale: O movimento militar é dirigido ao território onde os recabitas viviam; 'esta terra' torna natural a referência contextual sem especificar além do hebraico.
- source_word: בֹּאוּ וְנָבוֹא יְרוּשָׁלִַם
  choice: Venham, vamos entrar em Jerusalém
  rationale: O imperativo seguido do coortativo expressa exortação coletiva; בוא com o destino Jerusalém admite naturalmente 'entrar em' neste contexto de busca de refúgio.
- source_word: מִפְּנֵי
  choice: para escapar de
  rationale: A preposição indica que os exércitos motivaram a mudança para Jerusalém; a formulação explicita a busca de refúgio implícita no contexto, sem introduzir medo como estado psicológico.
- source_word: חֵיל הַכַּשְׂדִּים
  choice: exército dos caldeus
  rationale: חיל designa aqui uma força militar, e 'caldeus' preserva a designação étnico-política do texto hebraico.
- source_word: חֵיל אֲרָם
  choice: exército de Arã
  rationale: Preserva o nome próprio hebraico, em vez de substituí-lo pelo equivalente tradicional posterior 'Síria'.
- source_word: וַנֵּשֶׁב
  choice: passamos a morar
  rationale: O verbo narrativo indica que, em consequência da decisão, eles foram residir em Jerusalém; a expressão evita tanto a ideia forte de estabelecimento permanente quanto um presente perfeito estranho ao fluxo narrativo.
