  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: pt
  text: Vá até a família dos recabitas e fale com eles. Leve-os à casa de Yahweh[a], a uma das salas, e dê-lhes vinho para beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao templo de Yahweh”. Literalmente: “à casa de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Vá
  rationale: O imperativo de הלך funciona como ordem direta; “Vá” é a forma natural e concisa em português.
- source_word: בֵּית הָרֵכָבִים
  choice: a família dos recabitas
  rationale: בֵּית pode designar casa, família ou grupo familiar. Aqui identifica o clã recabita como unidade social; “família” comunica esse sentido sem sugerir necessariamente um edifício.
- source_word: וְדִבַּרְתָּ אֹתָם
  choice: fale com eles
  rationale: דבר com אֵת admite o sentido de falar com alguém; a formulação é natural e mantém a interação indicada pelo hebraico.
- source_word: וַהֲבִיאוֹתָם
  choice: Leve-os
  rationale: O hifil de בוא tem sentido causativo. “Leve-os” expressa naturalmente a ação de conduzi-los ao destino indicado.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém o substantivo concreto בֵּית, “casa”, e translitera o nome divino יְהוָה como Yahweh.
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: uma das salas
  rationale: לשכה designa uma sala ou câmara nas dependências do templo. “Sala” é clara e atual em português.
- source_word: וְהִשְׁקִיתָ אֹתָם יָיִן
  choice: dê-lhes vinho para beber
  rationale: O hifil de שקה significa dar de beber ou fazer beber. A escolha preserva o sentido causativo sem insinuar coerção indevida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de בֵּית em בֵּית הָרֵכָבִים
  choice: família dos recabitas
  alternative: casa dos recabitas
  rationale: No contexto, a ordem se dirige ao grupo recabita; “família” explicita o sentido social possível de בֵּית sem identificar uma construção específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi dividida em duas frases para fluidez, sem eliminar nenhuma ação do texto.
