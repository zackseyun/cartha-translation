  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מֵבִ֣יא אֶל יְהוּדָ֗ה וְ/אֶ֤ל כָּל יֽוֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עֲלֵי/הֶ֑ם יַ֣עַן דִּבַּ֤רְתִּי אֲלֵי/הֶם֙ וְ/לֹ֣א שָׁמֵ֔עוּ וָ/אֶקְרָ֥א לָ/הֶ֖ם וְ/לֹ֥א עָנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh, o Deus dos Exércitos, o Deus de Israel: “Eis que trarei sobre Judá e sobre todos os habitantes de Jerusalém toda a desgraça[a] que anunciei contra eles, porque falei com eles, mas não escutaram; chamei-os, mas não responderam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a calamidade”. O termo hebraico também pode significar “mal” em outros contextos, mas aqui se refere ao juízo anunciado que viria sobre Judá e Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a conclusão lógica decorrente do contraste anterior com a obediência dos recabitas.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em português natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Conserva a construção com 'Deus' e comunica de modo claro a ideia abrangente de hostes ou forças organizadas.
- source_word: הִנְנִי מֵבִיא
  choice: Eis que trarei
  rationale: Reproduz a ênfase solene de הִנְנִי e expressa em português corrente o ato futuro já anunciado por Deus.
- source_word: אֶל יְהוּדָה וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: sobre Judá e sobre todos os habitantes de Jerusalém
  rationale: '''Sobre'' expressa naturalmente o movimento da calamidade contra seus destinatários neste contexto de juízo.'
- source_word: כָּל הָרָעָה
  choice: toda a desgraça
  rationale: Neste contexto, רָעָה designa calamidade punitiva, não mal moral; 'desgraça' é clara e preserva a gravidade.
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: que anunciei contra eles
  rationale: '''Anunciei contra'' transmite o sentido contextual de uma declaração profética de juízo, evitando uma formulação portuguesa pouco natural.'
- source_word: יַעַן דִּבַּרְתִּי אֲלֵיהֶם וְלֹא שָׁמֵעוּ
  choice: porque falei com eles, mas não escutaram
  rationale: Mantém a relação causal e traduz שׁמע de forma a abranger a recusa em dar ouvidos.
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: chamei-os, mas não responderam
  rationale: Reproduz diretamente o paralelismo entre o chamado divino e a falta de resposta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome de aliança sem substituí-lo por um título.
- issue: Sentido de הָרָעָה no juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto trata da punição anunciada contra Judá e Jerusalém. A escolha evita sugerir maldade moral da parte de Deus, sem suavizar o juízo.
- issue: Valor de שָׁמְעוּ na resposta à palavra divina
  choice: escutaram
  alternative: obedeceram
  rationale: '''Escutaram'' conserva a imagem textual e sua ambiguidade significativa: ouvir aqui implica acolher e obedecer, mas o texto não usa o verbo específico ''obedecer''.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética e o nome divino mantêm solenidade; as conjunções adversativas tornam claro o paralelismo hebraico sem alterar seu sentido.
