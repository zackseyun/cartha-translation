  text: וַ/נֵּ֖שֶׁב בָּֽ/אֳהָלִ֑ים וַ/נִּשְׁמַ֣ע וַ/נַּ֔עַשׂ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יוֹנָדָ֥ב אָבִֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: pt
  text: Assim, temos morado em tendas, temos obedecido e feito tudo o que Jonadabe, nosso pai, nos ordenou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: temos morado
  rationale: O verbo ישׁב indica residência neste contexto, não o ato literal de sentar-se. O pretérito perfeito composto expressa uma prática iniciada no passado e mantida até o presente dos falantes.
- source_word: בָּאֳהָלִים
  choice: em tendas
  rationale: O plural sem artigo descreve genericamente seu modo de vida, de forma natural em português.
- source_word: וַנִּשְׁמַע
  choice: temos obedecido
  rationale: שׁמע, quando relacionado a uma ordem, frequentemente significa dar ouvidos e obedecer, não apenas escutar.
- source_word: וַנַּעַשׂ
  choice: e feito
  rationale: עשה expressa a execução concreta das ordens e preserva a sequência hebraica de obedecer e fazer.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo o que
  rationale: A expressão indica conformidade integral e é vertida de modo corrente e abrangente em português.
- source_word: צִוָּנוּ
  choice: nos ordenou
  rationale: צוה é o verbo comum para dar uma ordem; a formulação preserva a autoridade da instrução de Jonadabe.
- source_word: יוֹנָדָב
  choice: Jonadabe
  rationale: Forma portuguesa tradicional e reconhecível correspondente ao nome consonantal presente no texto hebraico.
- source_word: אָבִינוּ
  choice: nosso antepassado
  rationale: Embora literalmente signifique “nosso pai”, no contexto Jonadabe é o fundador ancestral do clã. “Antepassado” comunica essa referência de maneira clara sem sugerir paternidade imediata.
theological_decisions:
- issue: Sentido de שׁמע em relação à ordem
  choice: temos obedecido
  alternative: temos escutado / temos dado ouvidos
  rationale: O contexto enfatiza o cumprimento fiel da ordem de Jonadabe. O sentido de resposta obediente é lexical e contextual, sem acrescentar uma interpretação doutrinária.
- issue: Referência de אָבִינוּ
  choice: nosso antepassado
  alternative: nosso pai
  rationale: O termo hebraico é literalmente “nosso pai”, mas pode designar um ancestral. O contexto do clã recabita favorece “antepassado” como equivalente funcional claro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação verbal conserva a progressão do hebraico, e “Assim” liga a declaração ao contexto anterior. Não foram necessárias notas de rodapé.
