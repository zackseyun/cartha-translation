base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh dos Exércitos, o Deus de Israel: “Nunca faltará a Jonadabe, filho de Recabe, um homem[a] que esteja diante de mim[b] todos os dias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não será cortado de Jonadabe, filho de Recabe, um homem que esteja diante de mim todos os dias”.'
    reason: lexical_alternative
  - marker: b
    text: “Estar diante de mim” pode indicar serviço na presença de Deus; o texto não especifica um cargo particular.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz naturalmente a conclusão divina decorrente da obediência dos recabitas narrada no contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional e sua cadência solene, sem deixar de ser clara em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando a distinção entre o nome pessoal e אֲדֹנָי.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: É a forma consagrada em português para o título divino e mantém a amplitude do hebraico, que pode abranger hostes celestes e forças terrenas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta que identifica o Deus de Israel.
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב
  choice: Nunca faltará a Jonadabe [...] um homem
  rationale: 'Expressa em português natural o sentido idiomático da construção: a linhagem de Jonadabe não ficará sem um representante masculino. A nota conserva a imagem literal de ser cortado ou eliminado.'
- source_word: לְיוֹנָדָב בֶּן־רֵכָב
  choice: a Jonadabe, filho de Recabe
  rationale: Emprega as formas onomásticas tradicionais em português e representa claramente a filiação.
- source_word: עֹמֵד לְפָנַי
  choice: que esteja diante de mim
  rationale: Mantém a expressão espacial e relacional do hebraico sem definir indevidamente um cargo sacerdotal ou uma função no templo.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Preserva de perto a expressão temporal hebraica e sua ideia de continuidade, sem determinar além do texto o alcance exato da promessa.
theological_decisions:
- issue: Sentido da promessa de que haverá um homem diante de Deus
  choice: Uma promessa duradoura de que a linhagem de Jonadabe terá um representante diante de Deus, possivelmente em serviço, sem especificar um ofício institucional.
  alternative: Uma promessa específica de sacerdócio ou serviço perpétuo no templo; ou apenas uma promessa geral de sobrevivência da descendência.
  rationale: A expressão “estar diante de” pode indicar serviço na presença de uma autoridade ou de Deus, mas o versículo não identifica sacerdócio, templo ou outro cargo. A tradução mantém essa abertura sem reduzir a promessa à mera continuidade biológica.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. Mantêm-se a fórmula profética, o nome divino transliterado e a ambiguidade funcional de “estar diante de mim”.
