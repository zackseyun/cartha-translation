reference: Jeremiah 35:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: pt
  text: 'Enviei a vocês todos os meus servos, os profetas, repetidas vezes e com insistência,[a] dizendo: “Voltem, por favor,[b] cada um do seu mau caminho,[c] e corrijam suas ações;[d] não sigam outros deuses para servi-los. Então habitem na terra que dei a vocês e a seus antepassados”. Mas vocês não me deram ouvidos nem me escutaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levantando cedo e enviando”, expressão que comunica envio persistente, diligente e insistente.
    reason: cultural_note
  - marker: b
    text: Ou “Retornem”; de modo mais interpretativo, “Arrependam-se”.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão hebraica é distributiva: cada pessoa deve abandonar individualmente seu próprio mau caminho.'
    reason: lexical_alternative
  - marker: d
    text: Hebraico, literalmente, “tornem boas as suas ações”; ou “melhorem sua conduta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Enviei
  rationale: O wayyiqtol prossegue o relato das ações passadas de YHWH; o pretérito perfeito é natural e fiel ao contexto.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: todos os meus servos, os profetas
  rationale: Mantém a aposição e a designação teológica dos profetas como servos de YHWH.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: repetidas vezes e com insistência
  rationale: Traduz o sentido idiomático de diligência, persistência e empenho, enquanto a imagem hebraica literal é preservada em nota.
- source_word: שֻׁבוּ נָא
  choice: Voltem, por favor
  rationale: Preserva a metáfora concreta de voltar e expressa a partícula נָא como um apelo cortês, sem substituir o verbo por terminologia teológica mais interpretativa.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: cada um do seu mau caminho
  rationale: 'Reproduz a construção distributiva: cada pessoa é chamada individualmente a abandonar sua conduta má.'
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: e corrijam suas ações
  rationale: Expressa em português corrente o sentido causativo de tornar boas ou melhorar as próprias ações; a forma mais literal é indicada em nota.
- source_word: וְאַל תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: não sigam outros deuses
  rationale: “Seguir” comunica naturalmente em português a metáfora hebraica de ir atrás de outros deuses.
- source_word: לְעָבְדָם
  choice: para servi-los
  rationale: “Servir” mantém a amplitude de עבד, que neste contexto inclui serviço religioso e culto sem restringir o termo a um único aspecto.
- source_word: וּשְׁבוּ אֶל הָאֲדָמָה
  choice: Então habitem na terra
  rationale: Distingue corretamente este verbo יָשַׁב, “habitar”, do שׁוּב anterior, “voltar”, e representa a sequência resultante da obediência sem transformá-la explicitamente em oração de finalidade.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבֹתֵיכֶם
  choice: que dei a vocês e a seus antepassados
  rationale: O pretérito remete à dádiva histórica da terra; “antepassados” transmite de modo claro o sentido genealógico de אבות em português atual.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: Mas vocês não me deram ouvidos nem me escutaram
  rationale: A expressão idiomática portuguesa “dar ouvidos” conserva a imagem auditiva e a ênfase dupla do hebraico, com fluência moderna.
theological_decisions:
- issue: Sentido do chamado expresso por שׁוּב
  choice: Voltem
  alternative: Arrependam-se
  rationale: “Voltem” preserva a metáfora hebraica e o chamado à mudança moral no contexto, sem impor uma formulação teológica mais sistematizada.
- issue: Força distributiva de אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: “Cada um” mantém o singular distributivo e a responsabilidade individual, sendo uma formulação natural em português sem restringir indevidamente o chamado aos homens.
- issue: Relação entre obediência e permanência na terra
  choice: Então habitem na terra
  alternative: para que possam habitar na terra
  rationale: A sequência imperativa é mantida, deixando perceptível a relação contextual entre retorno, fidelidade e habitação na terra sem converter a construção em uma finalidade explícita que o hebraico não marca diretamente.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” para o plural e “antepassados” em lugar do idiomatismo menos transparente “pais”. A tradução prioriza equivalência ótima: conserva imagens centrais como voltar, caminho e dar ouvidos, mas verte idiomaticamente a fórmula hebraica de levantar cedo e enviar.'
