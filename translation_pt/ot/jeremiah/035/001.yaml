reference: Jeremiah 35:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh[a], nos dias de Jeoaquim, filho de Josias, rei de Judá, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “SENHOR”. O hebraico traz o nome divino YHWH.
    reason: Informa a forma hebraica e a alternativa tradicional sem substituir o nome no texto principal.
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética do hebraico e continua clara em português; “mensagem” seria possível, mas explicitaria o sentido.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Expressa naturalmente a fórmula hebraica que apresenta o recebimento de uma revelação divina.
- source_word: מֵאֵת
  choice: da parte de
  rationale: Marca Yahweh como fonte da palavra e soa mais idiomático em português do que o simples “de” neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém a expressão temporal ampla e formal do hebraico, sem restringi-la explicitamente ao período do reinado.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jeoaquim, filho de Josias, rei de Judá
  rationale: Emprega as formas portuguesas convencionais dos nomes e conserva a identificação genealógica e régia.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Conserva a ligação formal com o discurso divino que começa no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico contém diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio, enquanto a nota informa a convenção tradicional.
translation_notes:
  register: Português moderno, claro e digno, com leve formalidade adequada à fórmula profética. A ordem das aposições foi preservada, e o marcador da nota foi colocado imediatamente após “Yahweh”, ao qual de fato se refere.
