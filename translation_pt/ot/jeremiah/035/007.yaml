  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: pt
  text: Não construam casa, não semeiem sementes, não plantem vinha nem tenham uma; mas vivam em tendas todos os dias de sua vida, para que vivam muitos dias na terra onde residem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde vivem como residentes temporários”. O verbo hebraico descreve residência num lugar sem condição de morador permanente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: Não construam casas
  rationale: בַּיִת designa aqui uma casa física, em contraste com as tendas. O plural genérico soa natural em português e o imperativo negativo comunica a força proibitiva de לֹא com o imperfeito.
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: não semeiem
  rationale: A combinação hebraica literalmente menciona não semear semente; em português, «semear» já contém naturalmente esse objeto, evitando a expressão pouco idiomática «semear semente» sem restringi-la a uma cultura específica.
- source_word: וְכֶרֶם לֹא תִטָּעוּ
  choice: nem plantem vinhas
  rationale: כֶּרֶם é uma vinha ou vinhedo; «plantar vinhas» é claro, corrente e mantém a atividade agrícola concreta.
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: nem possuam nenhuma delas
  rationale: A construção existencial com לָכֶם expressa posse. O feminino plural retoma naturalmente «vinhas» em português, embora o hebraico empregue uma forma verbal singular.
- source_word: כִּי
  choice: pelo contrário
  rationale: Neste contexto, כִּי introduz a alternativa positiva às proibições anteriores, e não uma explicação causal.
- source_word: בָּאֳהָלִים תֵּשְׁבוּ
  choice: vivam em tendas
  rationale: ישׁב, em contexto de habitação, significa morar ou viver. «Vivam em tendas» é natural e preserva o contraste com construir casas.
- source_word: כָּל יְמֵיכֶם
  choice: durante toda a sua vida
  rationale: Equivale idiomaticamente a «todos os seus dias» e comunica com clareza a duração vital da ordem.
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: para que vivam muitos dias
  rationale: לְמַעַן marca finalidade; a formulação conserva tanto o propósito quanto a expressão hebraica de longevidade.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: na terra
  rationale: Embora עַל־פְּנֵי seja literalmente «sobre a face de», em português «na terra» transmite naturalmente a localização sem obscurecer o sentido.
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  choice: onde residem como estrangeiros
  rationale: גור descreve residência sem posse permanente ou condição de estrangeiro residente. A formulação evita a redundância de traduzir שָׁם por «ali» depois de «onde» e mantém no texto a nuance social relevante.
theological_decisions:
- issue: Sentido de גָּרִים e a condição dos recabitas na terra
  choice: residem como estrangeiros
  alternative: moram temporariamente / peregrinam
  rationale: O particípio indica viver em um lugar como estrangeiro residente, sem sugerir necessariamente deslocamento contínuo. A tradução mantém a tensão entre residência real e falta de estabelecimento permanente; a nota explicita a nuance sem impor uma leitura denominacional.
- issue: Referente de וְלֹא יִהְיֶה לָכֶם
  choice: nem possuam nenhuma delas, retomando as vinhas
  alternative: e nada disso lhes pertencerá / e não terão uma
  rationale: A referência mais próxima é כֶּרֶם, «vinha». A tradução explicita a posse e conserva esse referente provável, sem ampliar a proibição para toda e qualquer propriedade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. Preferiu-se «vivam» a «habitem» por naturalidade contemporânea. A nota [a] está colocada após a expressão à qual se refere.
