revisions:
- from: Não construam casas, não semeiem, nem plantem vinhas, nem possuam nenhuma delas; pelo contrário, vivam em tendas durante toda a sua vida, para que vivam muitos dias na terra onde residem como estrangeiros.[a]
  to: Não construam casa, não semeiem sementes, não plantem vinha nem tenham uma; mas vivam em tendas todos os dias de sua vida, para que vivam muitos dias na terra onde residem.[a]
  rationale: A revisão aproxima os singulares concretos de «casa» e «vinha» do hebraico e evita que a tradução de גור como «estrangeiros» introduza uma implicação identitária não necessária. A nota preserva a nuance de residência temporária. A omissão de «ali» depois de «onde» é idiomática em português e não elimina a referência locativa do hebraico.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:55Z'
review_pass:
  verdict: revise
  source_fidelity: A estrutura proibitiva e a finalidade de longevidade estão bem representadas. Contudo, «residem como estrangeiros» pode sugerir identidade estrangeira, enquanto גָּרִים designa principalmente residência não permanente/condição de residente temporário. A forma «nem possuam nenhuma delas» também torna o antecedente plural mais explícito do que o hebraico, que usa construção singular provavelmente retomando «vinha».
  naturalness: O português do rascunho é claro e digno. A revisão proposta conserva a fluência moderna e reduz uma formulação socialmente mais marcada no texto principal, deixando a nuance lexical na nota.
  terminology: «Vinha», «tendas», «terra» e «vivam» são escolhas adequadas. «Residentes temporários» é preferível na nota a «estrangeiros» no texto principal, pois preserva a nuance de גור sem impor nacionalidade ou estatuto étnico.
  issues:
