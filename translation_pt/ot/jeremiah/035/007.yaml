    issue: «residem como estrangeiros» para גָּרִים
    rationale: O particípio de גור pode referir-se a quem vive como residente não permanente; «estrangeiros» pode comunicar uma identidade externa ou étnica que o hebraico não exige. É mais seguro manter «residem» no texto e explicitar a condição temporária na nota.
  - severity: low
    issue: «nem possuam nenhuma delas»
    rationale: A expressão portuguesa retoma «vinhas» no plural, ao passo que o hebraico emprega singular e provavelmente se refere à vinha mencionada imediatamente antes. «Nem tenham uma» preserva melhor essa referência sem ampliar desnecessariamente a formulação.
  revised_text: Não construam casa, não semeiem sementes, não plantem vinha nem tenham uma; mas vivam em tendas todos os dias de sua vida, para que vivam muitos dias na terra onde residem.[a]
