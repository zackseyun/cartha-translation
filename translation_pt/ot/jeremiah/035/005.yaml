  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: pt
  text: 'Então coloquei diante dos membros da família dos recabitas tigelas cheias de vinho e copos, e lhes disse: “Bebam vinho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: Então coloquei diante de
  rationale: O verbo נתן, com לִפְנֵי e recipientes como objeto, tem o sentido contextual de colocar algo diante de alguém; “então” expressa com naturalidade a progressão narrativa.
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: os membros da família dos recabitas
  rationale: A expressão hebraica literalmente fala dos “filhos da casa”, isto é, dos integrantes do grupo familiar. A formulação escolhida comunica esse sentido em português atual sem sugerir apenas descendentes masculinos.
- source_word: גְּבִעִים
  choice: grandes taças
  rationale: O termo designa recipientes côncavos, semelhantes a tigelas ou taças, aqui usados para vinho. “Grandes taças” os distingue naturalmente dos copos mencionados em seguida, sem lhes atribuir luxo.
- source_word: מְלֵאִים יַיִן
  choice: cheias de vinho
  rationale: Tradução direta e idiomática da construção adjetival hebraica.
- source_word: וְכֹסוֹת
  choice: e copos
  rationale: כּוֹס designa recipientes individuais para beber; preservar este termo mantém os dois tipos de utensílio presentes no hebraico.
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: e lhes disse
  rationale: Tradução direta e natural do verbo אמר com seu complemento indireto.
- source_word: שְׁתוּ יָיִן
  choice: Bebam vinho
  rationale: Mantém o imperativo plural e a concisão da ordem hebraica, sem acrescentar o interpretativo “um pouco de”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O etnônimo “recabitas” segue a forma tradicional e corrente em português. Não há necessidade de nota textual ou lexical neste versículo.
