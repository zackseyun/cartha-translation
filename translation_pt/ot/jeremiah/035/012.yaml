  text: 'Então a palavra de Yahweh veio a Jeremias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa de היה introduz a sequência seguinte. Em português atual, a construção com “Então ... veio” preserva o fluxo sem recorrer ao arcaico “e aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” é a correspondência tradicional e semanticamente precisa para a comunicação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da comunicação; “veio a Jeremias” é uma formulação natural e digna em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico, adequada a uma tradução bíblica em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala; “dizendo” conserva de maneira clara a fórmula narrativa hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conserva a fórmula profética hebraica sem arcaísmo desnecessário.
