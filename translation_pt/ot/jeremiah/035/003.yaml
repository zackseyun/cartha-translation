base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: pt
  text: Então levei Jaazanias, filho de Jeremias[a], filho de Habazinias, e seus irmãos, todos os seus filhos e toda a casa dos recabitas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “E levei” ou “Levei”. A forma narrativa hebraica permite diferentes ligações naturais com o versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” significa a família ou o clã dos recabitas, e não apenas uma construção.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Então fui buscar
  rationale: O wayyiqtol de לקח dá continuidade à sequência narrativa. No contexto, o profeta reúne e conduz as pessoas mencionadas; “fui buscar” expressa naturalmente em português a ação de tomá-las consigo, sem perder o valor sequencial.
- source_word: יַאֲזַנְיָה
  choice: Jaazanias
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶן יִרְמְיָהוּ בֶן חֲבַצִּנְיָה
  choice: filho de Jeremias, filho de Habazinias
  rationale: Preserva literalmente a cadeia genealógica e emprega as formas portuguesas dos nomes.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: Mantém o sentido comum e direto de אָח; o contexto não exige o sentido mais amplo de parentes.
- source_word: כָּל בָּנָיו
  choice: todos os seus filhos
  rationale: בָּנִים é masculino plural e, neste contexto, refere-se aos filhos homens de Jaazanias; “filhos” preserva essa especificidade.
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: toda a casa dos recabitas
  rationale: “Casa” conserva a imagem corporativa e familiar do hebraico בֵּית, enquanto a nota esclarece que se trata da família ou clã, não de um edifício.
