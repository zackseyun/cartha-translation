  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: pt
  text: 'As palavras de Jeonadabe, filho de Recabe[a] — a ordem que ele deu a seus filhos de não beber vinho — foram cumpridas: até hoje eles não beberam vinho, porque obedeceram à ordem de seu pai. Eu, porém, tenho falado a vocês, levantando-me cedo e falando[b], mas vocês não me deram ouvidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser grafado “Jonadabe”.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica que transmite a ideia de falar repetidamente, com diligência e persistência.
    reason: cultural_note
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: As palavras ... têm sido cumpridas
  rationale: O passivo de קום indica que as palavras foram postas em prática e continuam sendo observadas. “Têm sido cumpridas” conserva o valor passivo e a continuidade até o presente.
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: Jeonadabe, filho de Recabe
  rationale: Transliteração portuguesa corrente dos nomes hebraicos; a forma alternativa “Jonadabe” é registrada em nota.
- source_word: אֲשֶׁר צִוָּה אֶת בָּנָיו לְבִלְתִּי שְׁתוֹת יַיִן
  choice: pelas quais ele ordenou a seus filhos que não bebessem vinho
  rationale: “Ordenou” comunica a força autoritativa de צוה, e a oração com subjuntivo expressa naturalmente em português a proibição.
- source_word: וְלֹא שָׁתוּ עַד הַיּוֹם הַזֶּה
  choice: até hoje eles não beberam vinho
  rationale: Explicita o objeto já mencionado e preserva o alcance temporal contínuo da expressão hebraica.
- source_word: כִּי שָׁמְעוּ אֵת מִצְוַת אֲבִיהֶם
  choice: porque obedeceram à ordem de seu pai
  rationale: Com מִצְוַת, שמע significa atender de modo obediente, não apenas ouvir.
- source_word: וְאָנֹכִי
  choice: Eu, porém
  rationale: A construção enfática estabelece contraste entre a obediência dos recabitas e a recusa dos destinatários.
- source_word: דִּבַּרְתִּי אֲלֵיכֶם הַשְׁכֵּם וְדַבֵּר
  choice: tenho falado a vocês, levantando-me cedo e falando
  rationale: Mantém a imagem do idioma hebraico, que expressa ação diligente, repetida e persistente; a nota esclarece seu sentido.
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: mas vocês não me deram ouvidos
  rationale: A expressão idiomática portuguesa conserva a ideia de não escutar e, no contexto, não atender, sem tornar explícita apenas uma das nuances.
theological_decisions:
- issue: Contraste entre a obediência dos recabitas e a resposta de Judá à fala divina
  choice: Preservar o contraste por meio de “Eu, porém” e “não me deram ouvidos”, sem acrescentar linguagem explícita de rebelião pactual.
  alternative: “Mas eu lhes falei persistentemente, e vocês não me obedeceram.”
  rationale: O texto contrapõe a obediência à ordem paterna à recusa em atender a Deus. A formulação escolhida conserva essa força teológica e a amplitude de שמע sem acrescentar uma caracterização doutrinária não expressa no versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se na linha principal a imagem hebraica de levantar-se cedo, acompanhada de nota explicativa. O uso de “vocês” evita formas regionais excessivamente marcadas e deixa claro o destinatário plural.
