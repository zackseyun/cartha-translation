revisions:
- from: 'As palavras de Jeonadabe, filho de Recabe[a], pelas quais ele ordenou a seus filhos que não bebessem vinho, têm sido cumpridas: até hoje eles não beberam vinho, porque obedeceram à ordem de seu pai. Eu, porém, tenho falado a vocês, levantando-me cedo e falando[b], mas vocês não me deram ouvidos.'
  to: 'As palavras de Jeonadabe, filho de Recabe[a] — a ordem que ele deu a seus filhos de não beber vinho — foram cumpridas: até hoje eles não beberam vinho, porque obedeceram à ordem de seu pai. Eu, porém, tenho falado a vocês, levantando-me cedo e falando[b], mas vocês não me deram ouvidos.'
  rationale: A revisão elimina a ambiguidade instrumental criada por “pelas quais” e substitui o perfeito composto progressivo por uma forma mais natural para o perfeito passivo hebraico. Mantêm-se o contraste retórico, a imagem do idioma hebraico e ambas as âncoras de nota.
