base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/009.yaml
  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
translation:
  language: pt
  text: e de não construir casas para morarmos; e não temos vinha, campo nem semente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e não há para nós vinha, campo nem semente”.'
    reason: Explicita a construção existencial hebraica com dativo possessivo, da qual decorre o sentido português “não temos”.
lexical_decisions:
- source_word: וּלְבִלְתִּי
  choice: e de não
  rationale: Mantém a coordenação com a lista de proibições e expressa naturalmente em português a construção hebraica negativa ligada ao infinitivo.
- source_word: בְּנוֹת בָּתִּים
  choice: construir casas
  rationale: Reproduz diretamente o infinitivo de בנה e o plural concreto בָּתִּים, em linguagem corrente.
- source_word: לְשִׁבְתֵּנוּ
  choice: para morarmos
  rationale: Expressa a finalidade das casas e inclui adequadamente o sufixo de primeira pessoa do plural.
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: vinha, campo nem semente
  rationale: Preserva os três substantivos agrícolas no singular; 'nem' é exigido pelo português natural dentro do escopo da negação.
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: não teremos
  rationale: A construção existencial com לְ expressa posse. O imperfeito יִהְיֶה admite aqui valor prospectivo, coerente com as instruções paternas citadas no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição hebraica de וְ foi suavizada na enumeração sem perda de conteúdo; a possível ambiguidade temporal e possessiva foi registrada em nota.
