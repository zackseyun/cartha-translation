id: JER.35.4
reference: Jeremiah 35:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: pt
  text: Então eu os levei à casa de Yahweh[a], à câmara dos filhos de Hanã[b], filho de Jigdalias, homem de Deus. Essa câmara ficava ao lado da câmara das autoridades e acima da câmara de Maaseias, filho de Salum, o guarda do limiar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao templo de Yahweh”. Literalmente, “à casa de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de Hanã” pode se referir aos descendentes, à família ou ao grupo ligado a Hanã.
    reason: lexical_alternative
  - marker: c
    text: Ou “o porteiro”. Literalmente, “o guarda do limiar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִא
  choice: Então eu os levei
  rationale: O wayyiqtol na primeira pessoa dá sequência à narrativa; “Então” expressa naturalmente essa progressão, e “levei” é idiomático em português para conduzir pessoas a um lugar.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica literal “casa de YHWH” e mantém o nome divino como Yahweh; “templo de Yahweh” é uma alternativa contextual.
- source_word: לִשְׁכַּת
  choice: câmara
  rationale: לשכה designa uma sala ou dependência, frequentemente no complexo do templo. “Câmara” conserva o sentido arquitetônico e o registro digno.
- source_word: בְּנֵי חָנָן
  choice: os filhos de Hanã
  rationale: Reproduz formalmente o construto hebraico, sem eliminar a possibilidade de se referir a descendentes, família ou grupo ligado a Hanã.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém o título reconhecível da expressão hebraica. Em português, a ausência de artigo após a aposição nominal é natural e não torna a referência indefinida.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: Expressa claramente a proximidade espacial indicada pela preposição.
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: שׂרים pode designar príncipes, chefes ou oficiais. “Autoridades” é claro no contexto administrativo e evita sugerir necessariamente membros da família real.
- source_word: מִמַּעַל לְ
  choice: acima de
  rationale: Conserva a relação vertical explícita na descrição arquitetônica.
- source_word: שֹׁמֵר הַסַּף
  choice: o guarda do limiar
  rationale: Preserva a imagem literal e o possível título funcional do hebraico; “porteiro” é a equivalência funcional alternativa.
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: Hanã ... Jigdalias ... Maaseias ... Salum
  rationale: Os nomes são transliterados em formas correntes e legíveis em português, sem serem traduzidos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, enquanto “SENHOR” reflete a tradição substitutiva de leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa cadeia locativa hebraica foi dividida em duas frases para clareza, sem alterar as relações entre as câmaras. Os marcadores de nota foram colocados imediatamente após as expressões pertinentes.
