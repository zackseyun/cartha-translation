base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: pt
  text: Ai! Pois aquele dia é grande[a]; não há outro igual. É um tempo de angústia para Jacó[b], mas ele será salvo dela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ah!” ou “Ai de!”. A interjeição inicial expressa lamento ou alarme.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um tempo de aflição para Jacó”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “será liberto dela” ou “será livrado dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai!
  rationale: Interjeição natural em português que expressa lamento ou alarme, sem impor necessariamente a ideia de maldição.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exclamação inicial e preserva a relação explicativa do hebraico.
- source_word: גָדוֹל
  choice: grande
  rationale: Mantém o sentido básico de grandeza ou magnitude; o caráter terrível do dia decorre do contexto, não do adjetivo isolado.
- source_word: הַיּוֹם הַהוּא
  choice: aquele dia
  rationale: Expressão profética convencional que conserva a referência enfática a um dia específico.
- source_word: מֵאַיִן כָּמֹהוּ
  choice: não há outro igual
  rationale: Forma idiomática e clara de expressar a incomparabilidade indicada pelo hebraico.
- source_word: וְעֵת צָרָה
  choice: É um tempo de angústia
  rationale: עֵת indica tempo ou ocasião, e צָרָה comunica angústia, aflição ou dificuldade grave.
- source_word: לְיַעֲקֹב
  choice: para Jacó
  rationale: Preserva o nome próprio do texto, sem substituí-lo pela interpretação metonímica 'Israel' ou 'povo de Deus'.
- source_word: וּמִמֶּנָּה
  choice: dela
  rationale: O pronome feminino retoma naturalmente 'angústia' em português e expressa a procedência da libertação.
- source_word: יִוָּשֵׁעַ
  choice: será salvo
  rationale: Preserva o vocabulário bíblico amplo de salvação, enquanto 'dela' delimita contextualmente a ideia como livramento da angústia.
theological_decisions:
- issue: Referente de 'Jacó'
  choice: Manter 'Jacó' como no hebraico, permitindo que represente coletivamente o povo da aliança sem explicitar essa interpretação no texto.
  alternative: Israel; os descendentes de Jacó; o povo de Deus
  rationale: A retenção do nome conserva a textura profética e a personificação coletiva, evitando uma expansão interpretativa.
- issue: Sentido de יִוָּשֵׁעַ no contexto
  choice: será salvo
  alternative: será liberto; será livrado; escapará
  rationale: A escolha mantém a ressonância do vocabulário bíblico de salvação sem restringi-lo a mera fuga; o complemento 'dela' mostra que o contexto imediato é o livramento da angústia.
- issue: Relação entre a angústia e a salvação
  choice: mas
  alternative: e; contudo
  rationale: A conjunção hebraica pode assumir valor adversativo no contexto. 'Mas' torna natural em português o contraste entre a angústia de Jacó e sua posterior salvação, sem alterar a sequência do pensamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o tom profético exclamativo, o nome Jacó e a tensão entre angústia extrema e salvação. Todos os marcadores de nota aparecem no texto principal.
