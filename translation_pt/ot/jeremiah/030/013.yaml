  text: אֵֽין דָּ֥ן דִּינֵ֖/ךְ לְ/מָז֑וֹר רְפֻא֥וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/013.yaml
  text: There is no one to plead your case for your wound[a]; there is no healing for you[b], no remedy.
translation:
  language: pt
  text: Não há quem defenda a sua causa quanto à sua ferida[a]; não há cura para você, nem remédio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há quem julgue a sua causa quanto à sua ferida”. A imagem jurídica hebraica pode indicar tanto a defesa de uma causa como seu julgamento.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico raro traduzido como “remédio” também pode ser entendido, mais concretamente, como “curativo” ou “tecido novo” formado sobre a ferida.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין דָּן
  choice: Não há quem defenda
  rationale: A negação existencial com o particípio indica a ausência de alguém que conduza a causa. “Defenda” expressa com naturalidade a possível função de advocacia no contexto jurídico, sem esconder em nota a alternativa de adjudicação.
- source_word: דִּינֵךְ
  choice: a sua causa
  rationale: O substantivo designa uma causa ou demanda judicial. “A sua causa” preserva a imagem forense e é idiomático em português.
- source_word: לְמָזוֹר
  choice: quanto à sua ferida
  rationale: מָזוֹר denota ferida, chaga ou lesão; a preposição é entendida como referência ao assunto da causa. “Quanto à” comunica essa relação sem sugerir finalidade curativa.
- source_word: רְפֻאוֹת
  choice: cura
  rationale: Embora a forma hebraica seja plural, pode ter sentido coletivo. O singular “cura” é natural em português e mantém a ideia de ausência de qualquer possibilidade de restauração.
- source_word: תְּעָלָה
  choice: remédio
  rationale: O termo raro pode referir-se a curativo, tecido novo que recobre a ferida ou, em sentido geral, remédio. A escolha mantém o sentido médico amplo, enquanto a nota registra as opções concretas.
- source_word: אֵין לָךְ
  choice: não há ... para você
  rationale: A construção expressa inexistência em relação à destinatária. Esta formulação é clara, corrente e conserva a segunda pessoa feminina do contexto sem torná-la explicitamente marcada em português.
