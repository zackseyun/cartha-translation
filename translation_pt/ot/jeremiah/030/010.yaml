id: JER.30.10
reference: Jeremiah 30:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: pt
  text: Mas você, Jacó, meu servo, não tema — declaração de Yahweh —; não se apavore, Israel, pois eis que estou para salvar você[a] de longe e a sua descendência da terra do cativeiro deles[b]. Jacó voltará, ficará tranquilo e viverá sossegado, sem que ninguém o amedronte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “salvarei você”. O particípio hebraico com “eis que eu” pode expressar uma ação iminente ou futura tida como certa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da terra onde eles estão cativos”; em sentido mais amplo, “da terra do exílio”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e ninguém o fará ter medo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção com o pronome independente introduz uma transição enfática e contrastiva; esta formulação é natural em português sem acrescentar conteúdo.
- source_word: אַל תִּירָא
  choice: não tenha medo
  rationale: Expressa de modo corrente e direto a proibição formada com ירא.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto, עבד é uma designação honrosa e pactual de Jacó/Israel, não uma ênfase em escravidão.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יהוה.
- source_word: וְאַל תֵּחַת
  choice: nem fique apavorado
  rationale: O nifal de חתת comunica estar abatido, consternado ou aterrorizado; a escolha mantém distinção em relação a 'não tenha medo'.
- source_word: הִנְנִי מוֹשִׁיעֲךָ
  choice: eis que estou salvando você
  rationale: הנני acrescenta ênfase e imediatismo, enquanto o particípio pode apresentar a ação divina como em curso, iminente ou certa.
- source_word: מֵרָחוֹק
  choice: de uma terra distante
  rationale: O hebraico significa literalmente 'de longe'; no contexto de resgate e retorno, a formulação espacial explícita soa natural e evita a impressão de mera distância abstrata.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: Representa o coletivo זרע em português atual, sem o sentido biológico mais restrito que 'semente' poderia sugerir.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: da terra do seu cativeiro
  rationale: Segue de perto a construção hebraica e conserva a ideia de cativeiro, sem ampliá-la silenciosamente para todo o conceito de exílio.
- source_word: וְשָׁב יַעֲקֹב
  choice: Jacó voltará
  rationale: שוב indica aqui retorno e restauração; o futuro é natural em português para a promessa.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: ficará tranquilo e viverá sossegado
  rationale: A dupla verbal descreve repouso sem perturbação e segurança despreocupada; a tradução conserva os dois elementos sem produzir repetição rígida.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém o amedronte
  rationale: Traduz a ausência de qualquer pessoa ou força que cause terror, mantendo o sentido ativo do particípio מחריד.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente em vez de substituí-lo por um título.
- issue: Relação entre Jacó e Israel
  choice: Manter os dois nomes paralelos
  alternative: Uniformizar ambos como 'Israel'
  rationale: O hebraico emprega deliberadamente os dois nomes para o mesmo povo; preservá-los mantém a forma literária e a ressonância pactual.
- issue: Valor temporal de הִנְנִי מוֹשִׁיעֲךָ
  choice: estou salvando você
  alternative: salvarei você
  rationale: O particípio com הנני pode exprimir ação iminente ou futuro certo. A forma progressiva preserva o aspecto da construção, enquanto a nota registra a leitura futura legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O vocativo 'ó Israel' esclarece a função sintática sem alterar o referente. A pontuação com travessões integra naturalmente a fórmula profética. Todos os marcadores de nota aparecem no texto na ordem correspondente.
