  to: Mas você, Jacó, meu servo, não tema — declaração de Yahweh —; não se apavore, Israel, pois eis que estou para salvar você[a] de longe e a sua descendência da terra do cativeiro deles[b]. Jacó voltará, ficará tranquilo e viverá sossegado, sem que ninguém o amedronte[c].
  rationale: A revisão remove a especificação não expressa de “terra” em מֵרָחוֹק, esclarece que o cativeiro é o da descendência e ajusta a segunda proibição a um registro profético natural. Mantém a fórmula divina, os nomes paralelos Jacó/Israel, a força de הִנְנִי e todos os marcadores de notas corretamente ancorados.
