source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que estou restaurando a sorte das tendas de Jacó[a] e terei compaixão das suas moradas. A cidade será reconstruída sobre o seu monte de ruínas, e o palácio ficará no lugar que lhe é devido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou trazendo de volta os cativos das tendas de Jacó”; ou: “estou restaurando Jacó do cativeiro”. A expressão idiomática hebraica pode indicar especificamente o retorno do cativeiro ou, de modo mais amplo, a restauração da sorte.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal e seu sentido pactual, em conformidade com a prática do projeto.
- source_word: הִנְנִי
  choice: Eis que estou
  rationale: Mantém a força dêitica e enfática da partícula hebraica com o pronome, num registro profético solene e compreensível.
- source_word: שָׁב שְׁבוּת
  choice: estou restaurando a sorte
  rationale: Traduz o sentido idiomático amplo de reversão da aflição e restauração, sem restringi-lo necessariamente ao retorno de cativos; a possível referência ao cativeiro é preservada em nota.
- source_word: אָהֳלֵי יַעֲקֹב
  choice: as tendas de Jacó
  rationale: Preserva a imagem concreta e corporativa do hebraico sem explicá-la excessivamente.
- source_word: מִשְׁכְּנֹתָיו
  choice: suas moradas
  rationale: Expressão natural e digna que mantém a imagem de lugares de habitação.
- source_word: אֲרַחֵם
  choice: terei compaixão
  rationale: Comunica misericórdia compassiva em linguagem corrente, sem a conotação depreciativa que 'ter pena' poderia adquirir.
- source_word: וְנִבְנְתָה עִיר
  choice: A cidade será reconstruída
  rationale: O contexto aponta para a cidade restaurada, provavelmente Jerusalém; 'reconstruída' expressa naturalmente a restauração após a destruição.
- source_word: עַל תִּלָּהּ
  choice: sobre o seu monte de ruínas
  rationale: תֵּל designa um montículo, frequentemente formado por ruínas. A formulação torna essa imagem clara ao leitor moderno e evita o sentido genérico de uma colina natural.
- source_word: אַרְמוֹן
  choice: o palácio
  rationale: É a equivalência mais direta neste contexto de restauração urbana e institucional, sem impor uma função estritamente militar.
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: ficará no lugar que lhe é devido
  rationale: Expressa o sentido idiomático de restabelecimento em sua disposição ou posição apropriada, evitando a tradução obscura e excessivamente literal 'se assentará segundo o seu direito'.
theological_decisions:
- issue: Alcance da restauração em שָׁב שְׁבוּת
  choice: Restauração ampla da sorte ou condição de Jacó
  alternative: Retorno literal dos cativos ou restauração de Jacó do cativeiro
  rationale: O idioma pode referir-se ao retorno do cativeiro, mas também designa uma reversão mais abrangente da aflição. As tendas, moradas, cidade e palácio favorecem aqui uma restauração integral, enquanto a nuance do cativeiro permanece na nota.
- issue: Referência de עִיר sem artigo
  choice: “A cidade”, entendida contextualmente como a cidade restaurada
  alternative: “Uma cidade”
  rationale: Embora o substantivo hebraico não tenha artigo, o contexto de restauração nacional torna a cidade definida no discurso; a tradução não acrescenta explicitamente o nome Jerusalém, preservando o grau de explicitude do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva-se a solenidade profética em “Assim diz” e “Eis que”, sem arcaísmos sintáticos. “Monte de ruínas” explicita o valor contextual de תֵּל, e “lugar que lhe é devido” comunica de modo natural o idioma final.
