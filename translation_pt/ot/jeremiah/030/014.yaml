source:
  edition: WLC
  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: pt
  text: Todos os teus amantes te esqueceram[a]; não te procuram. Pois eu te golpeei com o golpe de um inimigo, com castigo cruel[b], porque é grande a tua iniquidade; teus pecados são numerosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aliados”. O hebraico diz literalmente “amantes”, preservando a metáfora recorrente de Jeremias para vínculos políticos e espirituais ilícitos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com disciplina cruel” ou “com correção severa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: seus amantes
  rationale: Preserva a metáfora literal e recorrente de Jeremias para vínculos políticos e espirituais ilícitos, sem reduzir o sentido apenas a aliados estrangeiros.
- source_word: שְׁכֵחוּךְ
  choice: se esqueceram de você
  rationale: Expressa o sentido lexical de esquecer e sua relevância presente; 'abandonaram' seria uma explicitação mais forte.
- source_word: יִדְרֹשׁוּ
  choice: procuram
  rationale: Comunica de modo natural o sentido de buscar ou indagar por alguém, sem acrescentar explicitamente a ideia de cuidado.
- source_word: מַכַּת אוֹיֵב ... הִכִּיתִיךְ
  choice: eu a golpeei com o golpe de um inimigo
  rationale: Mantém a relação verbal entre o substantivo מַכָּה e o verbo נכה, bem como a imagem de Deus agindo contra Judá como faria um inimigo.
- source_word: מוּסַר אַכְזָרִי
  choice: com castigo cruel
  rationale: מוּסָר pode indicar disciplina, correção ou castigo, e אַכְזָרִי expressa crueldade ou severidade implacável. 'Castigo cruel' soa natural no contexto de juízo e preserva sua força.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: porque é grande a sua iniquidade
  rationale: רֹב denota grandeza ou abundância, e עָוֹן aqui designa a iniquidade que fundamenta o juízo. A formulação preserva o peso moral e a relação causal.
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: seus pecados são numerosos
  rationale: Neste paralelismo, עצם indica grande número ou magnitude. A formulação evita sugerir um processo de crescimento que o hebraico não precisa afirmar.
theological_decisions:
- issue: A agência divina no juízo
  choice: 'Deus declara diretamente: ''eu a golpeei''.'
  alternative: Atribuir o golpe somente aos inimigos ou apresentá-lo apenas como consequência indireta.
  rationale: O hebraico atribui explicitamente a ação a Deus e relaciona o juízo à iniquidade e aos pecados do povo; a tradução mantém essa tensão teológica sem suavizá-la.
- issue: A metáfora dos amantes
  choice: Manter 'amantes' no texto principal.
  alternative: Traduzir diretamente como 'aliados'.
  rationale: A imagem pode incluir aliados políticos, mas também participa da linguagem profética de infidelidade espiritual. Preservar a metáfora evita limitar sua abrangência.
translation_notes:
  register: Português atual, digno e de leitura clara, com construções acessíveis ao público brasileiro. O tratamento por “você” evita um registro excessivamente arcaico; os pronomes femininos retomam Sião/Judá no contexto. O marcador [b] foi colocado junto de “castigo cruel”, expressão à qual a nota lexical corresponde.
