  rationale: A revisão limita-se a tornar uniforme a referência à destinatária mediante pronomes de segunda pessoa, correspondendo ao hebraico e evitando a alternância entre «você» e «a». O restante do texto e as notas são mantidos, pois comunicam adequadamente o sentido, o registro e as ambiguidades lexicais relevantes.
