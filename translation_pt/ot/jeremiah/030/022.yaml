  yaml_path: translation/ot/jeremiah/030/022.yaml
  text: And you will be my people[a], and I will be your God.
translation:
  language: pt
  text: E vocês serão o meu povo[a], e eu serei o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, mais literalmente: “vocês serão para mim um povo, e eu serei para vocês Deus”; esta é uma fórmula de aliança que expressa pertencimento mútuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: E vocês serão
  rationale: A forma de היה com conjunção tem aqui sentido profético e futuro. “Vocês serão” é natural em português moderno e preserva o valor futuro.
- source_word: לִי לְעָם
  choice: o meu povo
  rationale: Embora a construção hebraica seja literalmente “para mim por povo”, a formulação possessiva expressa de modo natural em português a relação de pertencimento da fórmula de aliança.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: O pronome independente dá certa ênfase ao sujeito. “E eu” preserva o paralelismo sem tornar a frase artificialmente enfática.
- source_word: אֶהְיֶה
  choice: serei
  rationale: O imperfeito de היה tem sentido futuro e corresponde simetricamente a “vocês serão”.
- source_word: לָכֶם לֵאלֹהִים
  choice: o Deus de vocês
  rationale: A construção hebraica, literalmente “para vocês por Deus”, é idiomaticamente possessiva nesta fórmula de aliança. “De vocês” é amplamente compreensível e evita uma construção pouco natural.
theological_decisions:
- issue: Tradução da fórmula de aliança
  choice: E vocês serão o meu povo, e eu serei o Deus de vocês.
  alternative: E vocês serão para mim um povo, e eu serei para vocês Deus.
  rationale: A tradução principal preserva a reciprocidade e a orientação futura da fórmula clássica de aliança, sem acrescentar implicações doutrinárias. A nota registra a estrutura hebraica mais literal e sua ideia de pertencimento mútuo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “vocês” para o plural e conserva o paralelismo solene e conciso do hebraico.
