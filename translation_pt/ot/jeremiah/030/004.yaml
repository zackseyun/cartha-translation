  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: pt
  text: E estas são as palavras que Yahweh falou a respeito de Israel e de Judá:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Israel e a Judá”. A preposição hebraica pode ser traduzida mais literalmente dessa maneira, mas aqui provavelmente introduz palavras a respeito dos dois povos.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estas
  rationale: Mantém tanto a ligação discursiva expressa por וְ como a força demonstrativa de אֵלֶּה.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: No contexto da fórmula profética, דְּבָרִים designa as palavras pronunciadas, e não apenas assuntos ou acontecimentos.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... falou
  rationale: Reproduz de modo natural a oração relativa e o sentido básico do verbo דִּבֶּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: אֶל יִשְׂרָאֵל וְאֶל יְהוּדָה
  choice: a respeito de Israel e de Judá
  rationale: Neste enunciado introdutório, a construção apresenta o conteúdo profético referente aos dois povos. A repetição de “de” acompanha com clareza os dois membros coordenados, enquanto a nota registra a tradução mais literal da preposição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino; “Yahweh” o preserva como nome, sem convertê-lo em título.
- issue: Sentido de אֶל na fórmula introdutória
  choice: a respeito de Israel e de Judá
  alternative: a Israel e a Judá
  rationale: O contexto funciona como cabeçalho para palavras referentes a Israel e Judá, mas a construção hebraica também admite a leitura direcional. A alternativa é preservada em nota para não eliminar essa ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A abertura com “E” preserva a continuidade com o contexto anterior; “a respeito de” é idiomático sem ocultar a alternativa literal, registrada em nota.
