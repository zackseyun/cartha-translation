  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: pt
  text: Por que você clama por sua ferida[a]? Sua dor é incurável[b]. Por causa da grandeza de sua iniquidade, porque seus pecados são numerosos, eu lhe fiz estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fratura” ou “ruína”. O termo hebraico pode indicar uma quebra, fratura, ferida ou devastação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é desesperadora” ou “é gravíssima”. O adjetivo hebraico pode descrever uma condição severa ou sem possibilidade de cura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: Por que você clama
  rationale: מַה introduz aqui uma pergunta retórica, e זעק expressa um clamor intenso, geralmente motivado por aflição. A formulação é natural em português e mantém a força da repreensão.
- source_word: עַל שִׁבְרֵךְ
  choice: por causa da sua ferida
  rationale: עַל indica o motivo do clamor. שֶׁבֶר pode designar quebra, fratura, ruína ou ferida; no paralelismo com “dor”, “ferida” preserva a imagem corporal e funciona naturalmente em português.
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: A sua dor é incurável
  rationale: מַכְאוֹב significa dor ou sofrimento, enquanto אָנושׁ pode indicar condição gravíssima ou sem possibilidade de cura. “Incurável” exprime o sentido mais provável no contexto sem eliminar a alternativa em nota.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: Por ser grande a sua iniquidade
  rationale: עַל introduz a causa do juízo; רֹב comunica grandeza ou abundância, e עָוֹן se refere aqui principalmente à perversidade moral. “Iniquidade” mantém o peso ético do termo.
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: numerosos os seus pecados
  rationale: עצם pode expressar força, grandeza ou multiplicidade. Com “pecados” no plural e em paralelo com a grande iniquidade, o sentido quantitativo “numerosos” é contextual e idiomático.
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: fiz estas coisas contra você
  rationale: O perfeito na primeira pessoa declara a ação realizada pelo próprio falante, e אֵלֶּה é plural. Neste contexto de juízo, “contra você” comunica naturalmente a relação adversa expressa pela ação, sem tornar a frase impessoal.
theological_decisions:
- issue: Agência do juízo
  choice: 'O próprio falante afirma: “fiz estas coisas contra você”.'
  alternative: Uma formulação impessoal, como “estas coisas aconteceram com você”.
  rationale: O hebraico emprega explicitamente a primeira pessoa do singular עָשִׂיתִי. A tradução conserva a afirmação direta da agência divina presente no contexto, sem atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” preserva o tratamento singular dirigido à figura feminina de Sião/Jerusalém sem exigir marcação de gênero. A ordem causal da segunda metade foi mantida, e as notas registram a amplitude semântica das principais imagens.
