source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: pt
  text: Pois eis que vêm dias — declara o SENHOR — em que restaurarei a sorte do meu povo, Israel e Judá — diz o SENHOR — e os farei voltar à terra que dei aos seus antepassados, e eles tomarão posse dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém o valor de chamada de atenção do hebraico em registro bíblico digno e ainda compreensível.
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: restaurarei a sorte
  rationale: A expressão idiomática indica reversão da condição adversa e restauração; evita restringi-la apenas ao retorno físico do cativeiro, já expresso na oração seguinte.
- source_word: לַאֲבוֹתָם
  choice: aos seus antepassados
  rationale: Expressa naturalmente o sentido ancestral de אָבוֹת no português moderno, sem limitar a referência aos pais imediatos.
- source_word: וִירֵשׁוּהָ
  choice: tomarão posse dela
  rationale: Reproduz o sentido de adquirir e manter a posse da terra, de modo mais claro neste contexto do que simplesmente 'a possuirão'.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes.
theological_decisions:
- issue: Alcance de שׁוּב שְׁבוּת
  choice: restaurarei a sorte
  alternative: trarei de volta os cativos
  rationale: Preserva a amplitude idiomática da promessa de restauração e não duplica antecipadamente a promessa explícita de retorno à terra.
- issue: Relação entre Israel e Judá
  choice: meu povo, Israel e Judá
  alternative: meus povos Israel e Judá
  rationale: Mantém o singular עַמִּי e, portanto, a apresentação conjunta de Israel e Judá como 'meu povo', sem apagar a menção de ambos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação destaca as fórmulas proféticas sem tornar a frase artificial; 'eis que' conserva a solenidade e a função discursiva do original.
