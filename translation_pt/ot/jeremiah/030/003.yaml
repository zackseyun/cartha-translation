  terminology: «SENHOR» segue uma convenção portuguesa estabelecida para o Tetragrama. «Antepassados» traduz bem אֲבוֹתָם no contexto. «Restaurarei a sorte» preserva de modo apropriado a amplitude do idiomatismo hebraico, sem reduzi-lo indevidamente ao retorno físico, que a oração seguinte exprime.
