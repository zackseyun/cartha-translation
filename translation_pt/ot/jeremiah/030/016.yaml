  verdict: revise
  source_fidelity: A tradução preserva bem a sequência de reversões, a metáfora de devorar, a ênfase em «cada um deles» e o sentido específico de cativeiro. No entanto, «eu os entregarei ao saque» sugere mais naturalmente entregá-los para que sejam saqueados, enquanto o hebraico נתן לָבַז os apresenta como saque/despojo entregue a outros.
  naturalness: O português é claro, atual e adequado ao registro profético. A substituição de «ao saque» por «como saque» elimina uma ambiguidade sintática e exprime de modo mais natural a função predicativa do termo final.
  terminology: «Despojam/despojo» reproduz bem o jogo lexical da penúltima oração. Na última, «saqueiam/como saque» conserva a relação lexical entre בזז e בז sem confundir «saque» como ação com «saque» como espólio.
