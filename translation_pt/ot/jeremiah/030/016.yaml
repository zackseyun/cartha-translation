base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: pt
  text: Por isso, todos os que te devoram serão devorados, e todos os teus adversários, cada um deles, irão para o cativeiro. Os que te despojam se tornarão despojo, e todos os que te saqueiam eu os entregarei como saque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os entregarei como despojo”. O hebraico emprega termos relacionados a saquear e saque na oração final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência indicada pelo conector hebraico, ligando este anúncio à lógica de juízo e restauração do contexto anterior.
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: todos os que te devoram serão devorados
  rationale: Mantém tanto a metáfora vívida de אכל, literalmente ‘comer’, quanto a inversão verbal deliberada do hebraico.
- source_word: צָרַיִךְ
  choice: teus adversários
  rationale: Preserva o sentido de oposição hostil e mantém um registro profético digno, sem restringir indevidamente o termo.
- source_word: כֻּלָּם
  choice: cada um deles
  rationale: Reproduz a ênfase distributiva acrescentada depois de ‘todos os teus adversários’.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: irão para o cativeiro
  rationale: Representa diretamente a condição de serem levados como cativos, em vez de ampliar o sentido para o exílio em geral.
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: Os que te despojam se tornarão despojo
  rationale: Conserva a inversão entre agentes do despojo e despojo de guerra, com repetição lexical natural em português.
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: todos os que te saqueiam, eu os entregarei ao saque
  rationale: Mantém a relação lexical entre o verbo de saquear e o substantivo ‘saque’, além do sentido idiomático de entregar alguém como presa ou espólio.
theological_decisions:
- issue: Imagens metafóricas de guerra e reversão judicial
  choice: Conservar as imagens de devorar, cativeiro, despojo e saque.
  alternative: Substituir as imagens por uma declaração genérica de punição.
  rationale: 'O texto apresenta o juízo mediante uma inversão deliberada: os que consumiram, subjugaram e saquearam o povo sofrerão destino correspondente. Preservar essas imagens mantém a força teológica e retórica do hebraico sem explicar além do que ele afirma.'
translation_notes:
  register: Português atual, claro e digno, com formas de segunda pessoa (‘te’, ‘teus’) comuns na linguagem bíblica e compreensíveis internacionalmente. A repetição foi mantida onde reproduz jogos lexicais e a estrutura de reversão do hebraico.
