base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel: “Escreva para si, em um rolo[a], todas as palavras que eu lhe falei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em um livro”. O hebraico סֵפֶר designa um documento escrito e, neste contexto, muitas vezes se refere a um rolo.'
    reason: Alternativa lexical e esclarecimento histórico do suporte escrito.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética de mensageiro, empregando o presente idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Mantém a construção que identifica Yahweh como o Deus de Israel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem a fala direta de maneira mais natural em português.
- source_word: כְּתָב לְךָ
  choice: Escreva para você
  rationale: O imperativo é direto, e a expressão preserva o dativo pessoal לְךָ sem lhe atribuir uma finalidade mais específica do que o hebraico declara.
- source_word: כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: No contexto de fala divina a ser registrada, 'palavras' conserva melhor a dimensão verbal de דְּבָרִים.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: que eu lhe falei
  rationale: Expressa com naturalidade a ação anterior do perfeito hebraico e a relação de fala dirigida a Jeremias.
- source_word: אֶל־סֵפֶר
  choice: num rolo
  rationale: סֵפֶר designa um documento escrito e, neste contexto histórico, provavelmente um rolo; 'num' traduz idiomaticamente a relação indicada por אֶל.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética preservada. A colocação pronominal em “lhe falei” favorece legibilidade ampla, e “rolo” evita a imagem anacrônica de um códice moderno.
