  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido como “SENHOR” em muitas versões.'
    reason: Informa a grafia hebraica convencional do nome divino e a alternativa tradicional sem alterar o texto principal.
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Em fórmulas proféticas, דָּבָר designa a palavra ou mensagem divina. “A palavra” preserva a forma tradicional e a ligação com o discurso que segue.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Embora הָיָה signifique literalmente “foi/esteve”, nesta fórmula de recepção profética o português natural é “veio a”.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma consagrada do nome hebraico em português.
- source_word: מֵאֵת
  choice: da parte de
  rationale: A preposição composta indica origem ou procedência; “da parte de” comunica naturalmente que a palavra tem Yahweh como fonte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula introdutória e sinaliza que o discurso direto começa no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. “Yahweh” preserva esse nome sem o substituir por um título; a nota informa a forma hebraica e a tradição de tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter solene da introdução profética e sua continuidade sintática com o versículo seguinte.
