  text: וְ/הָי֤וּ בָנָי/ו֙ כְּ/קֶ֔דֶם וַ/עֲדָת֖/וֹ לְ/פָנַ֣/י תִּכּ֑וֹן וּ/פָ֣קַדְתִּ֔י עַ֖ל כָּל לֹחֲצָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: pt
  text: Seus filhos serão como antigamente[a], e sua comunidade[b] será firmemente estabelecida diante de mim; e castigarei todos os seus opressores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como antes” ou “como nos tempos antigos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “assembleia” ou “congregação”. O pronome no singular provavelmente se refere a Jacó/Israel como um todo coletivo.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: serão
  rationale: O perfeito qal com a conjunção, no discurso profético, tem aqui valor futuro e dá continuidade às promessas de restauração.
- source_word: בָנָיו
  choice: seus filhos
  rationale: Embora בנים possa incluir descendentes de modo coletivo, “filhos” preserva a forma concreta do hebraico e é natural em português.
- source_word: כְּקֶדֶם
  choice: como antigamente
  rationale: Expressa de modo claro e corrente a comparação com a condição anterior, sem especificar qual período passado está em vista.
- source_word: וַעֲדָתוֹ
  choice: sua comunidade
  rationale: עֵדָה designa uma coletividade reunida; “comunidade” é amplo, natural e evita restringir o termo a uma assembleia pontual ou a uma congregação em sentido eclesiástico moderno.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Tradução direta que preserva a ideia relacional de permanecer na presença de Deus.
- source_word: תִּכּוֹן
  choice: será firmemente estabelecida
  rationale: O nifal de כון comunica ser estabelecido e permanecer firme; o advérbio explicita a noção de estabilidade contida no verbo.
- source_word: וּפָקַדְתִּי
  choice: castigarei
  rationale: Neste contexto, com עַל e agentes opressores como objeto, פקד tem sentido punitivo.
- source_word: עַל כָּל לֹחֲצָיו
  choice: todos os seus opressores
  rationale: O particípio de לחץ refere-se aos que oprimem; “opressores” é conciso e mantém a força social e hostil do termo.
theological_decisions:
- issue: Referente dos sufixos possessivos no singular
  choice: Manter “seus/sua” no singular, sem identificar expressamente o referente.
  alternative: Empregar o plural (“seus filhos” com referente plural explícito, “a comunidade deles”) ou inserir “Jacó/Israel”.
  rationale: O hebraico apresenta sufixos no singular e provavelmente personifica Jacó/Israel como um todo coletivo. A tradução conserva essa forma e não resolve além do texto a identidade do referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comunidade” evita uma associação exclusivamente eclesiástica; “firmemente estabelecida” preserva tanto o valor passivo quanto a ideia de estabilidade.
