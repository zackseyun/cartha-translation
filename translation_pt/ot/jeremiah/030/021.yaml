source:
  edition: WLC
  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: pt
  text: Seu líder será um deles[a], e seu governante sairá do meio deles[b]. Eu o farei aproximar-se, e ele se aproximará de mim, pois quem é aquele que empenhou seu coração para se aproximar de mim?[c] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu nobre”; o termo hebraico pode designar uma pessoa proeminente, poderosa ou nobre.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “procederá do seu meio”. As duas expressões indicam que o líder surgirá do próprio povo.
    reason: lexical_alternative
  - marker: c
    text: Ou “quem é aquele que ousou, em seu coração, aproximar-se de mim?”. A expressão hebraica fala literalmente de empenhar ou dar o próprio coração como garantia.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: seu líder
  rationale: O termo pode designar alguém poderoso, nobre ou proeminente. Em paralelo com מֹשְׁלוֹ, indica aqui uma figura de liderança; “líder” preserva essa amplitude sem repetir “governante”.
- source_word: מִמֶּנּוּ
  choice: um deles
  rationale: No contexto coletivo de Jacó/Israel, a expressão indica que o líder surgirá do próprio povo. A nota registra a alternativa mais formal.
- source_word: מֹשְׁלוֹ
  choice: seu governante
  rationale: O particípio de משל designa aquele que governa. “Governante” comunica naturalmente a função política e mantém o paralelismo.
- source_word: מִקִּרְבּוֹ
  choice: do meio deles
  rationale: קֶרֶב denota o meio ou interior. O referente é o povo tratado coletivamente; a formulação deixa claro que o governante terá origem na própria comunidade.
- source_word: וְהִקְרַבְתִּיו
  choice: Eu o farei chegar perto
  rationale: A forma causativa enfatiza a iniciativa divina de conceder acesso, preservada de maneira natural em português.
- source_word: וְנִגַּשׁ אֵלָי
  choice: e ele se aproximará de mim
  rationale: נגשׁ significa aproximar-se e pode ter conotações cultuais ou de acesso à presença soberana, sem que elas precisem ser explicitadas na tradução.
- source_word: עָרַב אֶת־לִבּוֹ
  choice: empenhou o coração
  rationale: A expressão literalmente envolve dar ou pôr o coração em penhor, indicando compromisso ousado e arriscado. “Empenhou o coração” conserva a metáfora e sua ambiguidade.
- source_word: לָגֶשֶׁת אֵלָי
  choice: para se aproximar de mim
  rationale: Repete a raiz נגשׁ; a tradução mantém a repetição e a possível nuance de acesso privilegiado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida em português atual e solene, preservando o nome divino representado pelo tetragrama.
theological_decisions:
- issue: Natureza do acesso do líder a Deus
  choice: O texto apresenta um líder originário do próprio povo, a quem Yahweh concede aproximar-se dele, usando linguagem que pode sugerir acesso privilegiado ou cultual sem identificá-lo explicitamente como sacerdote ou Messias.
  alternative: Entender a figura especificamente como governante messiânico, governador pós-exílico ou rei-sacerdote.
  rationale: O hebraico salienta tanto a origem interna do líder quanto a iniciativa divina em fazê-lo chegar perto. A tradução mantém essa tensão e não acrescenta uma identificação ausente do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo, a iniciativa divina e a metáfora incomum do coração empenhado; evita identificar de forma denominacional a figura do líder.
