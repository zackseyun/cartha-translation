  to: Seu líder será um deles[a], e seu governante sairá do meio deles[b]. Eu o farei aproximar-se, e ele se aproximará de mim, pois quem é aquele que empenhou seu coração para se aproximar de mim?[c] — declara Yahweh.
  rationale: A revisão substitui uma construção menos natural por “Eu o farei aproximar-se”, que conserva o causativo hebraico e o sentido de acesso concedido por Yahweh. Também restaura “seu” em “seu coração”, conforme o sufixo possessivo do texto-fonte. Não se altera a ambiguidade deliberada acerca da identidade e da função do líder.
