base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/012.yaml
  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Sua fratura é incurável[a]; sua ferida é grave.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu ferimento não tem cura; sua ferida é severa.”'
    reason: Alternativa lexical que preserva sentidos possíveis de שֶׁבֶר, אָנושׁ e נַחְלָה.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a declaração divina como explicação ligada ao contexto anterior, de modo natural em português.
- source_word: כֹה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: אָנושׁ
  choice: incurável
  rationale: No campo metafórico de fratura e ferida, comunica uma condição desesperadora, além de cura.
- source_word: לְשִׁבְרֵךְ
  choice: sua fratura
  rationale: Mantém concretamente a imagem corporal de quebra ou fratura, em paralelo com a ferida.
- source_word: נַחְלָה
  choice: é grave
  rationale: Expressa a extrema severidade da ferida sem repetir 'incurável' e soa natural no português atual.
- source_word: מַכָּתֵךְ
  choice: sua ferida
  rationale: No contexto da metáfora corporal, 'ferida' é o equivalente mais natural e forma um paralelo claro com 'fratura'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética formal. As imagens médicas concretas e o paralelismo hebraico foram preservados.
