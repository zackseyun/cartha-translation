  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: pt
  text: Pois eu estou com você — oráculo de Javé[a] — para salvá-lo. Pois darei um fim completo a todas as nações entre as quais eu o espalhei; a você, porém, não darei um fim completo. Eu o disciplinarei com justiça e de modo algum o deixarei sem punição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declara Javé”. A expressão hebraica נְאֻם יְהוָה é uma fórmula profética tradicionalmente traduzida dessa maneira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente não o absolverei”. No hebraico, a construção intensifica, mediante negação, o verbo que significa “inocentar” ou “absolver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, preservando sua função como nome próprio da aliança.
- source_word: נְאֻם יְהוָה
  choice: oráculo de Javé
  rationale: Mantém o caráter solene da fórmula profética e representa נְאֻם como pronunciamento divino, sem reduzi-lo a um simples verbo de fala.
- source_word: לְהוֹשִׁיעֶךָ
  choice: para salvá-lo
  rationale: O hifil de ישׁע expressa salvar ou livrar; “salvar” conserva a amplitude do termo e se encaixa naturalmente na promessa.
- source_word: כָלָה
  choice: fim completo
  rationale: Preserva tanto a ideia de consumação total quanto a repetição retórica do hebraico no contraste entre as nações e o povo de Deus.
- source_word: הֲפִצוֹתִיךָ
  choice: eu o espalhei
  rationale: O hifil de פוץ descreve a dispersão do povo entre as nações; “espalhei” é claro e natural no contexto do exílio.
- source_word: אַךְ
  choice: porém
  rationale: Expressa o contraste enfático entre o fim reservado às nações e a preservação do destinatário.
- source_word: וְיִסַּרְתִּיךָ
  choice: Eu o disciplinarei
  rationale: יסר indica correção disciplinar, não apenas castigo; a escolha mantém a severidade e a finalidade corretiva.
- source_word: לַמִּשְׁפָּט
  choice: com justiça
  rationale: Representa uma disciplina aplicada segundo uma medida justa, em linguagem portuguesa atual e idiomática.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: de modo algum o deixarei sem punição
  rationale: Reproduz a negação enfática formada pelo infinitivo absoluto e pelo verbo finito, comunicando que o povo não será isentado das consequências de sua culpa.
theological_decisions:
- issue: Se a cláusula final deve ter sentido principalmente forense (“não absolver”) ou disciplinar (“não deixar sem punição”).
  choice: de modo algum o deixarei sem punição
  alternative: certamente não o absolverei
  rationale: 'O contexto imediato fala de disciplina justa. A formulação escolhida mantém a tensão do versículo: Javé salvará e não destruirá completamente seu povo, mas tampouco o isentará da punição merecida.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O tratamento por “você” é mantido de modo coerente por meio dos pronomes oblíquos “o” e “-lo”. A repetição de “fim completo” conserva o paralelismo enfático do hebraico, embora seja ligeiramente mais formal que a fala cotidiana.
