source:
  edition: WLC
  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: pt
  text: 'Pois trarei cura a você[a] e curarei você das suas feridas — declara Yahweh —, porque a chamaram de rejeitada[b]: “Sião; ninguém a procura[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “restaurarei a sua saúde”. A expressão hebraica diz literalmente: “farei a cura surgir para você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “expulsa”, “afastada” ou “banida”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “não há quem a procure”, expressão que pode indicar que ninguém se interessa por ela nem vem em seu auxílio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: trarei cura a você
  rationale: A expressão causativa hebraica significa literalmente fazer a cura ou a recuperação surgir. “Trarei cura” conserva esse movimento causativo e soa natural em português.
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: e curarei você das suas feridas
  rationale: מַכָּה pode indicar golpe, ferimento ou lesão. No contexto de cura, “feridas” expressa adequadamente o resultado dos golpes, enquanto a construção mantém a pessoa como objeto do verbo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם introduz uma fórmula profética solene, e o nome divino יהוה é representado diretamente como “Yahweh”.
- source_word: נִדָּחָה
  choice: rejeitada
  rationale: O particípio passivo feminino descreve aquela que foi afastada, expulsa ou posta de lado. “Rejeitada” comunica a condição de exclusão e concorda com Sião.
- source_word: קָרְאוּ לָךְ
  choice: a chamaram
  rationale: O perfeito resume o rótulo que outros deram a Sião. A forma pronominal feminina retoma naturalmente a cidade personificada.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: דֹּרֵשׁ אֵין לָהּ
  choice: ninguém se importa com ela
  rationale: Literalmente, não há quem a procure ou indague por ela. No contexto, a expressão comunica falta de cuidado, interesse e auxílio; a nota preserva a imagem lexical de procurar.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama יהוה. “Yahweh” representa o nome da aliança sem substituí-lo por um título e evita impor uma tradição denominacional específica.
- issue: Identificação da figura feminina rejeitada
  choice: Manter Sião personificada no feminino
  alternative: Explicitar Jerusalém ou o povo de Israel
  rationale: O próprio verso nomeia Sião e usa formas femininas, mas não explicita aqui se o referente deve ser entendido estritamente como cidade, comunidade ou povo. A tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com construção de boa legibilidade brasileira. A segunda pessoa feminina do hebraico é expressa por “você” e pelos pronomes femininos que personificam Sião. Os travessões destacam com clareza a fórmula profética sem alterar sua relação sintática com a promessa.
