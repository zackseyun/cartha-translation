  text: וְ/יָצָ֥א מֵ/הֶ֛ם תּוֹדָ֖ה וְ/ק֣וֹל מְשַׂחֲקִ֑ים וְ/הִרְבִּתִי/ם֙ וְ/לֹ֣א יִמְעָ֔טוּ וְ/הִכְבַּדְתִּ֖י/ם וְ/לֹ֥א יִצְעָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: pt
  text: Deles virão ações de graças e o som dos que celebram[a]. Eu os multiplicarei, e eles não serão poucos; eu os honrarei[b], e eles não serão insignificantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o som dos que se alegram” ou “dos que brincam”; o particípio hebraico pode indicar riso, brincadeira ou celebração festiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu os tornarei importantes, e eles não serão pequenos”. Os termos hebraicos podem se referir tanto a honra e importância quanto a grandeza e pequenez.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: Deles virão
  rationale: A construção indica aquilo que procede da comunidade restaurada. O singular hebraico concorda com תּוֹדָה, mas em português o plural natural acompanha “ações de graças”.
- source_word: תּוֹדָה
  choice: ações de graças
  rationale: Neste contexto, designa gratidão expressa em louvor, não necessariamente uma oferta sacrificial específica.
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: e o som dos que celebram
  rationale: קוֹל indica expressão audível, e o particípio de שׂחק pode abranger riso, diversão e alegria festiva. “Celebram” comunica bem o cenário comunitário sem restringi-lo a brincadeira literal.
- source_word: וְהִרְבִּתִים
  choice: Eu os multiplicarei
  rationale: O hifil de רבה com sufixo masculino plural expressa fazer o povo tornar-se numeroso.
- source_word: וְלֹא יִמְעָטוּ
  choice: e eles não serão poucos
  rationale: 'Em paralelo com a multiplicação, מעט tem sentido quantitativo: não se tornarão poucos.'
- source_word: וְהִכְבַּדְתִּים
  choice: eu os honrarei
  rationale: O hifil de כבד pode significar tornar pesado, importante ou honrado; aqui, o paralelo favorece elevação de dignidade e posição.
- source_word: וְלֹא יִצְעָרוּ
  choice: e eles não serão insignificantes
  rationale: צער pode indicar pequenez ou pouca importância. Em antítese com “honrarei”, “insignificantes” preserva o sentido social, sem eliminar a possibilidade mais literal de pequenez.
theological_decisions:
- issue: Natureza das bênçãos da restauração prometida
  choice: Apresentar uma restauração comunitária concreta, marcada por gratidão, celebração, crescimento e honra.
  alternative: Interpretar as bênçãos exclusivamente como espiritualização interior ou como exaltação nacional-política.
  rationale: O hebraico descreve diretamente louvor, alegria festiva, multiplicação e dignidade. A tradução conserva esses elementos sem lhes impor uma identificação eclesiológica, política ou escatológica posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Ações de graças” mantém o caráter público do louvor; “celebram” evita o tom potencialmente infantil de “brincam”. A repetição de “eles” esclarece os sujeitos e preserva o ritmo das promessas.
