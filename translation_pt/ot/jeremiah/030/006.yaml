base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: pt
  text: '“Perguntem, por favor, e vejam: acaso um homem dá à luz? Por que, então, vejo cada homem com as mãos sobre os lombos, como uma mulher em trabalho de parto, e todos os rostos se tornam pálidos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma palidez esverdeada”. O termo hebraico sugere uma cor pálida e doentia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא
  choice: Perguntem, por favor
  rationale: O imperativo plural seguido da partícula נָא expressa apelo ou exortação. A formulação preserva esse tom e soa natural em português.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Mantém o segundo imperativo e o convite retórico para constatar o absurdo apresentado.
- source_word: אִם יֹלֵד זָכָר
  choice: acaso um homem dá à luz?
  rationale: A pergunta é retórica. Embora זָכָר signifique especificamente “macho”, “um homem” expressa naturalmente em português o contraste humano e biológico, enquanto “acaso” sinaliza a resposta negativa esperada.
- source_word: מַדּוּעַ
  choice: Por que, então
  rationale: “Então” explicita a progressão retórica entre a impossibilidade mencionada e a cena observada.
- source_word: רָאִיתִי
  choice: vejo
  rationale: O perfeito hebraico tem aqui força vívida e presente; o presente português transmite a observação imediata.
- source_word: כָל גֶּבֶר
  choice: cada homem
  rationale: גֶּבֶר pode enfatizar o homem em seu vigor. “Cada homem” mantém a distribuição individual e deixa o contraste com a fraqueza causada pela angústia surgir do contexto.
- source_word: יָדָיו עַל חֲלָצָיו
  choice: com as mãos sobre os lombos
  rationale: “Lombos” conserva a referência corporal de חֲלָצַיִם e a intensidade da postura de dor, sem reduzi-la à expressão mais casual “mãos na cintura”.
- source_word: כַּיּוֹלֵדָה
  choice: como uma mulher em trabalho de parto
  rationale: O particípio feminino descreve explicitamente alguém que dá à luz. A formulação é clara, corrente e vívida.
- source_word: וְנֶהֶפְכוּ כָל פָּנִים לְיֵרָקוֹן
  choice: e todos os rostos tomados de palidez
  rationale: A construção comunica a mudança visível de todos os rostos. “Palidez” é clara no texto principal, enquanto a possível nuance esverdeada do termo raro יֵרָקוֹן é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção retórica e as imagens corporais do hebraico foram preservadas sem suavizar a cena. O marcador da nota foi colocado junto de “palidez”, termo ao qual a nota lexical efetivamente se refere.
