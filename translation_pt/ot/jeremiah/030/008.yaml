  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their slave.
translation:
  language: pt
  text: Naquele dia — declara Yahweh dos Exércitos[a] —, quebrarei o jugo dele que está sobre o seu pescoço e romperei as suas amarras. Estrangeiros nunca mais o escravizarão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «o SENHOR dos Exércitos».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Estrangeiros nunca mais se servirão dele». A oração hebraica é sintaticamente compacta; no contexto, o sentido é que Jacó/Israel deixará de ser submetido ao trabalho forçado e ao domínio estrangeiro.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: A fórmula profética aponta para um acontecimento futuro. Em português, a expressão temporal basta para introduzir a declaração sem a construção mais pesada «e acontecerá».
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: נְאֻם introduz uma declaração profética; o nome divino é representado como «Yahweh», e צְבָאוֹת é traduzido de modo transparente como «dos Exércitos».
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: quebrarei o jugo dele que está sobre o seu pescoço
  rationale: 'Mantém a imagem concreta do jugo e preserva a mudança dos sufixos hebraicos: «dele» para o jugo e «seu» para o pescoço do destinatário personificado.'
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: romperei as suas amarras
  rationale: «Amarras» comunica tanto as correias ligadas ao jugo quanto a ideia mais ampla de sujeição; «romperei» expressa o ato de separar ou arrancar as restrições.
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: Estrangeiros nunca mais o escravizarão
  rationale: No contexto de jugo e amarras, עבד com בּוֹ descreve exploração ou sujeição servil. A formulação portuguesa explicita o sentido contextual sem ocultar em nota a compressão sintática do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome pessoal da aliança. «Yahweh» o representa diretamente; a forma tradicional é registrada em nota.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; tradicionalmente, dos Exércitos/Hosts
  rationale: A tradução conserva a força militar e cósmica do título sem restringir os exércitos apenas a uma esfera.
- issue: Agente e paciente na oração final
  choice: os estrangeiros escravizam «o» referente masculino, entendido no contexto como Jacó/Israel
  alternative: os estrangeiros se servem dele ou exploram seu trabalho
  rationale: A sintaxe hebraica é compacta e permite mais de uma formulação, mas o contexto imediato de libertação do jugo favorece o sentido de pôr fim à escravidão estrangeira.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, evitando arcaísmos. A metáfora do jugo foi mantida, assim como as mudanças pronominais do hebraico. A ambiguidade real da oração final é assinalada em nota, sem enfraquecer no texto principal o tema contextual da libertação.
