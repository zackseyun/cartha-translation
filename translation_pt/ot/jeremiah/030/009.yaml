  text: וְ/עָ֣בְד֔וּ אֵ֖ת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/אֵת֙ דָּוִ֣ד מַלְכָּ֔/ם אֲשֶׁ֥ר אָקִ֖ים לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: pt
  text: Eles servirão a Yahweh, seu Deus, e a Davi, seu rei[a], que levantarei para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um futuro rei da linhagem de Davi”. Muitos intérpretes entendem “Davi” aqui como uma referência profética ao Messias, e não ao próprio Davi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: Eles servirão
  rationale: עבד significa normalmente “servir” e, neste contexto de aliança, pode incluir culto e lealdade. “Servirão” conserva essa amplitude sem restringir o sentido a “adorarão”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Expressa naturalmente em português a construção possessiva hebraica, com “seu” referindo-se ao sujeito plural “eles”.
- source_word: וְאֵת
  choice: e a
  rationale: A conjunção liga o segundo objeto ao verbo “servir”; a preposição “a” é exigida pelo uso português de “servir” com referência a uma pessoa.
- source_word: דָּוִד מַלְכָּם
  choice: Davi, seu rei
  rationale: Mantém o nome próprio e o título real do hebraico. As vírgulas tornam claro que “seu rei” está em aposição a “Davi”.
- source_word: אֲשֶׁר אָקִים לָהֶם
  choice: que levantarei para eles
  rationale: “Levantarei” preserva o idioma do hifil de קום, que pode comunicar fazer surgir, estabelecer ou designar um governante; “para eles” conserva o valor benefactivo de לָהֶם.
theological_decisions:
- issue: Identidade de “Davi, seu rei”
  choice: Manter literalmente “Davi” no texto principal.
  alternative: Entender a expressão como “um futuro rei davídico” ou, na leitura messiânica, como referência ao Messias.
  rationale: O hebraico diz explicitamente “Davi, seu rei”. A tradução não deve substituir o nome por uma identificação interpretativa; a nota registra a leitura futura ou messiânica sem resolver no texto principal a tensão profética.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a estrutura coordenada do hebraico e sua ambiguidade quanto à identidade futura de Davi.
