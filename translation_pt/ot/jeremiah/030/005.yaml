  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה ק֥וֹל חֲרָדָ֖ה שָׁמָ֑עְנוּ פַּ֖חַד וְ/אֵ֥ין שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Ouvimos um som de tremor[a]; há medo[b], não há paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma voz de tremor”; o hebraico qol pode significar “som”, “ruído” ou “voz”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: “Tremor” também pode ser traduzido “terror”, e “medo” pode ser traduzido “pavor” ou “terror”. O hebraico reúne termos próximos para intensificar a aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a declaração divina com valor explicativo e liga naturalmente o versículo ao contexto anterior.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz de modo natural e digno a fórmula profética de mensageiro, sem tornar o verbo desnecessariamente passado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a convenção do projeto.
- source_word: קוֹל
  choice: um som
  rationale: O contexto destaca algo audível, sem exigir que se trate de fala articulada; a alternativa “voz” permanece possível.
- source_word: חֲרָדָה
  choice: tremor
  rationale: Preserva a imagem concreta do estremecimento causado pelo medo e sua relação intensificadora com פַּחַד.
- source_word: שָׁמָעְנוּ
  choice: Ouvimos
  rationale: Mantém a primeira pessoa do plural e expressa em português uma percepção passada com relevância presente, sem a rigidez de uma forma composta.
- source_word: פַּחַד
  choice: medo
  rationale: É uma tradução ampla e direta, sem fixar uma intensidade maior do que o termo necessariamente exige.
- source_word: וְאֵין
  choice: e não há
  rationale: Conserva a coordenação e a negação existencial do hebraico, sem introduzir um contraste adversativo mais forte.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a equivalência mais natural no contraste com medo e tremor, embora o termo também possa abranger segurança e bem-estar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso, a primeira pessoa do plural e a ambiguidade lexical relevante do hebraico.
