  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: pt
  text: A ira ardente de Yahweh não recuará até que ele o tenha feito e até que tenha estabelecido os propósitos do seu coração. Nos últimos dias[a], vocês compreenderão isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No fim dos dias” ou “Nos dias vindouros”. A expressão hebraica pode indicar a futura culminação dos propósitos de Deus sem especificar o momento exato.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: ira ardente
  rationale: Preserva a imagem hebraica do calor da ira e soa natural e digna em português.
- source_word: יָשׁוּב
  choice: não voltará atrás
  rationale: Expressa a ideia de a ira não recuar nem cessar antes da realização do propósito divino, sem reduzir o verbo a mero sentimento de arrependimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עַד עֲשֹׂתוֹ
  choice: até que ele faça o que decidiu
  rationale: Torna compreensível em português o objeto implícito do hebraico, vinculando a ação aos propósitos mencionados em seguida, sem especificar um ato concreto não expresso no texto.
- source_word: הֲקִימוֹ
  choice: leve a cabo
  rationale: Comunica o sentido causativo de fazer vigorar ou efetivar, combinando naturalmente com “propósitos” em português.
- source_word: מְזִמּוֹת לִבּוֹ
  choice: os propósitos do seu coração
  rationale: Mantém tanto a deliberação intencional de מְזִמּוֹת quanto a linguagem antropomórfica de “coração”.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Nos últimos dias
  rationale: Conserva a reconhecida expressão profética sem definir de maneira mais estreita o momento exato do seu cumprimento.
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: vocês compreenderão isso
  rationale: O verbo indica discernimento ou compreensão atenta; “vocês” explicita naturalmente a segunda pessoa do plural, e “isso” retoma o assunto anunciado.
theological_decisions:
- issue: Horizonte temporal de בְּאַחֲרִית הַיָּמִים
  choice: Nos últimos dias
  alternative: Nos dias vindouros; no fim dos dias
  rationale: A expressão pode ter peso escatológico, mas também apontar de modo mais amplo para a futura culminação dos propósitos de Deus. A tradução preserva essa tensão, e a nota registra a amplitude possível.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Voltar atrás” e “levar a cabo” evitam rigidez excessiva sem apagar as imagens e relações do hebraico.
