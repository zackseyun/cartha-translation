source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה סַ֖עַר מִתְגּוֹרֵ֑ר עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: pt
  text: Eis que a tempestade da ira de Yahweh irrompeu, um vendaval que se agita[a]; ela desabará sobre a cabeça dos perversos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma tempestade de Yahweh; a ira irrompeu; um vendaval que se agita”. O hebraico acumula termos de tempestade para dar ênfase, e sua sintaxe é abrupta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rodopiará sobre a cabeça dos perversos”. O verbo hebraico final é difícil; “desabará” expressa o impacto da tempestade, enquanto a alternativa mantém mais explicitamente a ideia de movimento giratório.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz a proclamação com vivacidade e solenidade, sem recorrer a uma formulação excessivamente arcaica.
- source_word: סַעֲרַת יְהוָה חֵמָה
  choice: a tempestade da ira de Yahweh
  rationale: Expressa de modo natural a estreita associação entre a tempestade enviada por Yahweh e sua ira, embora a sintaxe hebraica abrupta também permita entender חֵמָה como uma declaração à parte.
- source_word: יָצְאָה
  choice: irrompeu
  rationale: Mantém a força do perfeito profético e a imagem de algo que já saiu ou foi desencadeado; em português, “irrompeu” combina naturalmente com uma tempestade.
- source_word: סַעַר מִתְגּוֹרֵר
  choice: um vendaval impetuoso
  rationale: Preserva a intensificação produzida pela repetição de termos de tempestade e representa o movimento violento sugerido pelo particípio, cujo sentido exato é discutido.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: sobre a cabeça dos perversos
  rationale: Conserva a imagem concreta hebraica do juízo que recai sobre a cabeça dos que praticam o mal.
- source_word: יָחוּל
  choice: desabará
  rationale: No contexto da tempestade, comunica impacto violento e iminente. O verbo é difícil e pode também evocar movimento giratório, razão pela qual a alternativa é registrada em nota.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente más, não apenas culpadas em sentido jurídico; “perversos” é corrente e adequado ao registro profético.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a tempestade e a ira divina
  choice: tempestade da ira de Yahweh
  alternative: tempestade de Yahweh — a ira irrompeu
  rationale: A leitura principal apresenta a tempestade como manifestação da ira divina, mas a nota conserva a possibilidade de tomar חֵמָה como elemento sintaticamente mais independente.
translation_notes:
  register: Português atual, solene e acessível, com boa legibilidade brasileira. “Eis que” mantém o tom profético; “vendaval impetuoso” evita repetição pouco natural sem apagar a acumulação enfática de imagens meteorológicas. Todos os marcadores de nota aparecem no texto.
