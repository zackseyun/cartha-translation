  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: pt
  text: 'A respeito dos filhos de Amom, assim diz Yahweh:


    “Israel não tem filhos?

    Não tem herdeiro?

    Por que, então, Milcom[a] tomou posse de Gade,

    e o povo dele se estabeleceu nas cidades de Gade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico Malcam/Milcom também pode ser lido como “o rei deles”: “Por que, então, o rei deles tomou posse de Gade...?”'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: A respeito dos filhos de Amom
  rationale: O לְ pode introduzir o assunto de um oráculo. “Filhos de Amom” conserva a expressão hebraica e continua compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הֲבָנִים אֵין לְיִשְׂרָאֵל
  choice: Israel não tem filhos?
  rationale: “Filhos” preserva בָנִים e a lógica sucessória da pergunta retórica.
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: Não tem herdeiro?
  rationale: No contexto, אִם dá continuidade interrogativa à primeira pergunta; o singular “herdeiro” corresponde a יוֹרֵשׁ.
- source_word: מַדּוּעַ יָרַשׁ
  choice: Por que, então, tomou posse de
  rationale: Aqui ירש descreve a apropriação de um território; “tomou posse” mantém a nuance de posse da terra sem sugerir uma herança legítima.
- source_word: מַלְכָּם
  choice: Milcom
  rationale: A forma consonantal admite o nome da divindade amonita, embora também possa ser entendida como “o rei deles”; a alternativa é preservada em nota.
- source_word: אֶת גָּד
  choice: Gade
  rationale: Emprega a forma portuguesa tradicional do nome tribal e territorial, sem explicitação desnecessária no texto.
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: e o povo dele se estabeleceu nas cidades de Gade
  rationale: “Estabeleceu-se” expressa naturalmente a ocupação indicada por ישב. A repetição de “Gade” esclarece que são as cidades do território ocupado, enquanto “o povo dele” remete a Milcom como representante de Amom.
theological_decisions:
- issue: Leitura de מַלְכָּם
  choice: Milcom, a divindade amonita
  alternative: o rei deles
  rationale: As consoantes hebraicas permitem as duas leituras. O contexto de Amom e a personificação de uma nação por meio de seu deus favorecem “Milcom”, mas a ambiguidade textual genuína é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética para as perguntas retóricas. Conserva “filhos de Amom” por transparência formal e usa “Gade”, forma corrente em português. O marcador [a] foi colocado junto de “Milcom”, termo ao qual a nota efetivamente se refere.
