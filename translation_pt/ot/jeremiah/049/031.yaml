id: JER.49.31
reference: Jeremiah 49:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֣וּמוּ עֲל֗וּ אֶל גּ֥וֹי שְׁלֵ֛יו יוֹשֵׁ֥ב לָ/בֶ֖טַח נְאֻם יְהוָ֑ה לֹא דְלָתַ֧יִם וְ/לֹֽא בְרִ֛יחַ ל֖/וֹ בָּדָ֥ד יִשְׁכֹּֽנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: pt
  text: “Levantem-se, avancem contra uma nação tranquila[a], que vive em segurança — declara Yahweh —, sem portas nem ferrolho[b]; eles habitam isolados.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sossegada” ou “complacente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não há portas nem ferrolho para ela”; a imagem indica que essa nação não possui fortificações e se considera segura.
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Levantem-se
  rationale: Imperativo plural de קום; comunica uma convocação militar com linguagem portuguesa atual.
- source_word: עֲל֗וּ אֶל
  choice: avancem contra
  rationale: No contexto de um oráculo de guerra, עלה com אֶל indica avanço contra um alvo; evita o pouco natural 'subam contra' sem explicitar além do hebraico a ação como ataque.
- source_word: גּ֥וֹי שְׁלֵ֛יו
  choice: uma nação tranquila
  rationale: גוי designa a nação visada, e שׁליו descreve sua condição de sossego, com possível nuance de complacência mantida em nota.
- source_word: יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: que vive em segurança
  rationale: Reproduz naturalmente em português o particípio com a expressão adverbial de segurança e confiança.
- source_word: נְאֻם יְהוָ֑ה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa diretamente o nome divino יהוה como Yahweh.
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: sem portas nem ferrolho
  rationale: Conserva as imagens concretas de portas e barra de fechamento, indicando ausência de fortificações sem inseri-la no corpo do texto como explicação.
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: eles habitam isolados
  rationale: Preserva o verbo plural e o sentido de separação geográfica ou social de בּדד, sem decidir se isso implica vulnerabilidade ou autossuficiência.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' preserva essa função e segue a orientação doutrinária atual informada no material de consulta.
- issue: Nuance de שְׁלֵו
  choice: tranquila
  alternative: complacente
  rationale: A palavra pode indicar sossego ou segurança despreocupada. O texto principal preserva o sentido descritivo mais aberto, enquanto a possível avaliação negativa é apresentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos plurais soam naturais; os travessões destacam a fórmula profética sem alterar sua relação com a declaração. 'Ferrolho' preserva a imagem antiga da barra que fechava uma porta ou portão.
