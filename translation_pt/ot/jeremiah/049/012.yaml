source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Eis que aqueles a quem não era devido beber o cálice[b] certamente beberão. E você é quem ficará impune? Não ficará impune,[a] pois certamente beberá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que você de fato será absolvido? Não será absolvido”.'
    reason: lexical_alternative
  - marker: b
    text: “O cálice” é uma imagem profética do julgamento que Deus dá às nações para beber.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua função pactual no texto hebraico.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força dêitica e solene que introduz a declaração profética, em português corrente de registro elevado.
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: aqueles para quem não era devido beber o cálice
  rationale: מִשְׁפָּטָם admite as ideias de julgamento, justiça ou aquilo que cabe legalmente a alguém. “Não era devido” preserva essa amplitude melhor que “não foram condenados”, que poderia estreitar a expressão a uma sentença formal.
- source_word: הַכּוֹס
  choice: o cálice
  rationale: Mantém literalmente a imagem profética, sem acrescentar “da ira” ou “do julgamento”, ausentes do hebraico.
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: certamente beberão
  rationale: Reproduz de modo idiomático a ênfase do infinitivo absoluto seguido do verbo finito.
- source_word: וְאַתָּה הוּא נָקֹה תִּנָּקֶה
  choice: E você é quem ficará impune?
  rationale: Preserva o pronome enfático e a pergunta confrontadora; “ficar impune” expressa naturalmente o valor judicial-punitivo de נקה no nifal.
- source_word: לֹא תִנָּקֶה
  choice: Não ficará impune
  rationale: Mantém a repetição lexical e responde diretamente à pergunta retórica anterior.
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: pois certamente beberá
  rationale: Comunica a certeza enfática marcada pela construção com infinitivo absoluto.
theological_decisions:
- issue: Sentido metafórico de “o cálice”
  choice: Manter “o cálice” sem explicitação no texto principal.
  alternative: “o cálice da ira” ou “o cálice do julgamento”
  rationale: No contexto profético, o cálice representa o julgamento imposto por Deus, mas o hebraico deste versículo diz apenas “o cálice”; explicitar “ira” resolveria a metáfora além do que a forma do texto requer.
- issue: Amplitude judicial de מִשְׁפָּט e נקה
  choice: Traduzir מִשְׁפָּט por “devido” e נקה por “ficar impune”.
  alternative: “não haviam sido condenados” e “ser absolvido”
  rationale: A formulação escolhida mantém o caráter judicial do oráculo sem pressupor uma sentença formal específica e conserva a tensão entre aquilo que cabia aos outros povos e a inevitável punição de Edom.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Você” torna direta a interpelação singular a Edom; “cálice” preserva a imagem bíblica tradicional sem soar arcaico. Todos os marcadores de nota aparecem no texto principal.
