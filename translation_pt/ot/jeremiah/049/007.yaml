  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: pt
  text: 'A respeito de Edom: Assim diz Yahweh dos Exércitos: “Já não há sabedoria em Temã? Desapareceu o conselho dos que têm discernimento?[a] Corrompeu-se a sabedoria deles?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos entendidos” ou “dos prudentes”. O termo hebraico se refere a pessoas capazes de entender e discernir, não a “filhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Estragou-se a sabedoria deles?” O verbo hebraico sugere que algo se deteriorou, ficou estragado ou se tornou ruim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: A respeito de Edom
  rationale: O לְ no cabeçalho introduz o assunto do oráculo; esta formulação evita acrescentar a ideia mais específica de oposição contida em “contra”.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética tradicional em português atual e digno.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino conforme a orientação do projeto e preserva a imagem militar e cósmica de צְבָאוֹת.
- source_word: הַאֵין עוֹד חָכְמָה
  choice: Já não há sabedoria
  rationale: A combinação interrogativa com עוֹד pergunta se a sabedoria deixou de existir; “já não” expressa naturalmente essa cessação.
- source_word: בְּתֵימָן
  choice: em Temã
  rationale: Trata Temã como topônimo edomita e reproduz diretamente o valor locativo da preposição.
- source_word: אָבְדָה עֵצָה
  choice: Desapareceu o conselho
  rationale: Expressa a perda ou extinção do conselho sem impor a ideia de morte literal sugerida por uma tradução rígida de אָבַד.
- source_word: מִבָּנִים
  choice: dos que têm discernimento
  rationale: A forma deriva da raiz בין, “entender, discernir”, e designa pessoas entendidas, não filhos biológicos.
- source_word: נִסְרְחָה חָכְמָתָם
  choice: Corrompeu-se a sabedoria deles
  rationale: O verbo raro comunica deterioração — algo estragado ou que se tornou ruim — e “corrompeu-se” conserva essa força em registro digno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Segue a convenção declarada do projeto, tornando visível o nome pactual sem substituí-lo por um título.
- issue: Força retórica das três perguntas
  choice: Manter todas como perguntas
  alternative: Entendê-las como afirmações retóricas explícitas de que a sabedoria acabou
  rationale: A forma interrogativa hebraica intensifica a denúncia, mas deixa sua força retórica ao leitor; convertê-la em afirmações eliminaria essa característica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém a solenidade da fórmula profética, usa “Temã” como forma portuguesa do topônimo e preserva a sequência retórica do hebraico. As notas registram as alternativas relevantes sem sobrecarregar o versículo.
