review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente os imperativos, Hazor, o nome Yahweh, o planejamento hostil de Nabucodonosor e, de modo importante, a alternância hebraica de “vocês” para “eles” no final. Contudo, “Habitem em lugares profundos” tende a sugerir profundidade física, sentido que não comunica bem o idiomatismo hebraico de retirar-se para um lugar remoto ou inacessível.
  naturalness: O português é em geral claro e digno. “Vão morar bem longe” é mais natural e transmite melhor, em português moderno, o apelo a buscar residência/refúgio em local afastado.
  terminology: “Moradores de Hazor”, “Yahweh”, “Nabucodonosor, rei da Babilônia”, e “contra vocês ... contra eles” são adequados. A nota sobre a mudança pronominal está corretamente ancorada e explica sem harmonizar o texto.
  issues:
  - severity: medium
    issue: “Habitem em lugares profundos” é uma imagem excessivamente literal e potencialmente enganosa.
    rationale: הֶעְמִיקוּ לָשֶׁבֶת é uma expressão idiomática que exorta os habitantes a se retirarem e se estabelecerem em lugar remoto/oculto, não uma instrução clara para viver em locais fisicamente profundos. A revisão conserva o sentido espacial e a ideia de habitar, sem impor uma localização subterrânea.
