  to: “Fujam! Afastem-se para bem longe! Vão morar bem longe[a], moradores de Hazor”, declara Yahweh, “pois Nabucodonosor, rei da Babilônia, concebeu uma estratégia contra vocês e elaborou um plano contra eles[b]”.
  rationale: A revisão substitui a noção potencialmente literal de “lugares profundos” por uma formulação portuguesa idiomática que exprime o sentido contextual de retirada para um local distante, preservando a relação com “morar”. Mantêm-se todos os demais elementos relevantes, inclusive a mudança deliberada de pessoa no texto massorético.
