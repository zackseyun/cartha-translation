  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: pt
  text: “Fujam! Afastem-se para bem longe! Vão morar bem longe[a], moradores de Hazor”, declara Yahweh, “pois Nabucodonosor, rei da Babilônia, concebeu uma estratégia contra vocês e elaborou um plano contra eles[b]”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “façam profundo para habitar”; expressão idiomática que sugere retirar-se para lugares remotos ou ocultos.'
    reason: cultural_note
  - marker: b
    text: O hebraico passa de “contra vocês” para “contra eles” no fim do versículo; a tradução conserva essa mudança.
    reason: textual_variant
lexical_decisions:
- source_word: נֻסוּ
  choice: Fujam!
  rationale: Imperativo plural direto de נוס, que ordena escapar de um perigo iminente.
- source_word: נֻּדוּ מְאֹד
  choice: Afastem-se para bem longe!
  rationale: Expressa movimento para longe, intensificado por מְאֹד; a formulação distingue esta ordem do simples ato de fugir.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: Habitem em lugares profundos
  rationale: Conserva a imagem hebraica de estabelecer moradia nas profundezas, entendidas no contexto como lugares afastados ou ocultos, sem reduzir a expressão apenas a 'escondam-se'.
- source_word: יֹשְׁבֵי חָצוֹר
  choice: moradores de Hazor
  rationale: Forma corrente e clara em português para o particípio construto que designa os habitantes do lugar.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa diretamente o nome divino יהוה.
- source_word: יָעַץ ... עֵצָה
  choice: concebeu uma estratégia
  rationale: Comunica a deliberação intencional do par cognato hebraico em português natural, dentro do contexto militar.
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: elaborou um plano
  rationale: Preserva o sentido de planejamento deliberado do segundo par cognato sem produzir uma repetição artificial em português.
- source_word: עֲלֵיכֶם ... עליהם
  choice: contra vocês ... contra eles
  rationale: Mantém a mudança do discurso direto na segunda pessoa para a referência na terceira pessoa presente no texto massorético.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama; a transliteração Yahweh preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Mudança pronominal no fim do versículo
  choice: Preservar “contra vocês” e depois “contra eles”
  alternative: Harmonizar ambas as expressões como “contra vocês”
  rationale: A mudança está no hebraico recebido. Preservá-la mantém a tensão textual em vez de corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos fortes próprios de uma advertência profética. Conserva-se a metáfora espacial do hebraico, esclarecida em nota, e a mudança pronominal do texto massorético.
