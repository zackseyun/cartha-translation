  text: מַה תִּתְהַֽלְלִי֙ בָּֽ/עֲמָקִ֔ים זָ֣ב עִמְקֵ֔/ךְ הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ מִ֖י יָב֥וֹא אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: pt
  text: 'Por que você se vangloria dos vales[a], do seu vale que transborda, ó filha rebelde, que confia nos seus tesouros e diz: “Quem virá contra mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica seguinte é difícil. Também pode ser traduzida como “seu vale por onde correm águas”, “seu vale inundado” ou “seu vale fértil”. A imagem talvez se refira à riqueza natural ou à proteção proporcionada pelo vale.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלְלִי
  choice: você se vangloria
  rationale: O hitpael de הלל expressa aqui exaltação de si mesma. “Vangloriar-se” comunica de modo natural o tom de censura.
- source_word: בָּעֲמָקִים
  choice: dos vales
  rationale: Mantém a referência geográfica concreta do plural עֵמֶק. Em português, “vangloriar-se de” exige a preposição “de”, embora o hebraico empregue ב.
- source_word: זָב עִמְקֵךְ
  choice: do seu vale que transborda
  rationale: A expressão hebraica é difícil. Esta formulação preserva a imagem de um vale abundante em água sem transformar uma interpretação específica em certeza; outras possibilidades são registradas em nota.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: ó filha rebelde
  rationale: שׁוֹבֵבָה descreve quem se desvia ou se rebela. “Rebelde” é corrente, preserva a censura profética e evita a formulação menos natural “filha apóstata”.
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: que confia nos seus tesouros
  rationale: אֹצָר pode indicar tesouros, depósitos ou riquezas armazenadas. “Tesouros” conserva a imagem concreta e o tema da falsa segurança.
- source_word: מִי יָבֹוא אֵלַי
  choice: Quem virá contra mim?
  rationale: Embora אֶל costume significar “a/para”, o contexto hostil favorece o sentido adversativo “contra”, adequado à alegação de invulnerabilidade.
theological_decisions:
- issue: Personificação feminina singular de Amom
  choice: Manter a figura de uma “filha” interpelada diretamente.
  alternative: Substituir a metáfora por “povo rebelde” ou pelo nome da nação.
  rationale: O hebraico personifica a entidade julgada como filha e usa formas femininas singulares. Preservar essa imagem mantém a retórica profética sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “você” torna a interpelação feminina singular clara; a construção “ó filha rebelde” conserva o tom poético e profético. A fala final foi introduzida por “e diz” para soar natural em português, embora o verbo de elocução esteja implícito no hebraico.
