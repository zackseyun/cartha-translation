source:
  edition: WLC
  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: pt
  text: Eis que, como a águia[a], ele subirá, voará e estenderá as asas sobre Bozra. Naquele dia, o coração dos guerreiros de Edom será como o coração de uma mulher em trabalho de parto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abutre”; a palavra hebraica pode designar mais amplamente uma grande ave de rapina, embora “águia” seja a tradução tradicional aqui.
    reason: alternativa lexical
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a fórmula profética que chama a atenção, em registro solene e ainda compreensível no português atual.
- source_word: כַנֶּשֶׁר
  choice: como a águia
  rationale: נֶשֶׁר designa uma grande ave de rapina e pode, conforme o contexto, ser entendido como águia ou abutre; “águia” preserva a imagem tradicional, enquanto a alternativa é registrada em nota.
- source_word: יַעֲלֶה
  choice: ele subirá
  rationale: Reproduz diretamente o movimento ascendente expresso por עלה sem identificar além do texto o atacante implícito.
- source_word: וְיִדְאֶה
  choice: voará rapidamente
  rationale: Expressa o voo veloz indicado pelo verbo sem acrescentar um movimento descendente que o hebraico não explicita.
- source_word: וְיִפְרֹשׂ כְּנָפָיו
  choice: e estenderá as asas
  rationale: Mantém de modo natural a imagem concreta de abrir ou estender as asas sobre a cidade.
- source_word: עַל בָּצְרָה
  choice: sobre Bozra
  rationale: “Sobre” corresponde à preposição no quadro espacial das asas estendidas; o topônimo é transliterado em forma corrente no português.
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: o coração dos guerreiros de Edom
  rationale: Preserva “coração” em vez de interpretá-lo como coragem, e traduz גִּבּוֹרֵי pelo termo militar claro “guerreiros”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Formulação temporal idiomática que conserva a referência profética.
- source_word: וְהָיָה
  choice: será
  rationale: Corresponde de perto ao verbo hebraico e permite que o contexto comunique o estado resultante sem tornar explícita uma mudança que a forma verbal não exige por si só.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: como o coração de uma mulher em trabalho de parto
  rationale: Conserva a imagem hebraica do coração e comunica com clareza a aflição intensa ligada às dores do parto.
theological_decisions:
- issue: Referente do atacante comparado à águia
  choice: Mantido como o pronome singular “ele”, sem identificação explícita.
  alternative: Identificá-lo como o rei da Babilônia, como Nabucodonosor, como YHWH ou como uma força invasora não especificada.
  rationale: O contexto mais amplo aponta para o invasor babilônico, mas este versículo deixa o sujeito implícito. A tradução conserva essa abertura literária e teológica.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação hebraica foi levemente pontuada em duas frases para clareza, sem alterar a relação entre a ameaça e o efeito sobre os guerreiros de Edom.
