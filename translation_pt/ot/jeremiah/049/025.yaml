base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: pt
  text: Como não foi abandonada a cidade celebrada, a cidade da minha alegria?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a cidade de louvor, a cidade da minha alegria”. Não fica explícito de quem é a voz representada por “minha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Preserva a força interrogativa e exclamativa de espanto ou lamento, sem reduzi-la a uma pergunta estritamente causal.
- source_word: לֹא עֻזְּבָה
  choice: não foi abandonada
  rationale: Reproduz a negação e a forma passiva feminina, concordando com “cidade”; o pretérito perfeito é natural em português para o estado resultante contemplado no lamento.
- source_word: עִיר תהלה
  choice: a cidade celebrada
  rationale: תהלה significa literalmente “louvor”, mas aqui caracteriza a cidade como objeto de louvor ou renome; “cidade celebrada” comunica esse sentido com naturalidade.
- source_word: קִרְיַת
  choice: a cidade
  rationale: Mantém a segunda designação em aposição e o paralelismo poético do hebraico.
- source_word: מְשׂוֹשִׂי
  choice: da minha alegria
  rationale: Conserva o substantivo “alegria” e o sufixo de primeira pessoa, sem decidir de quem é a voz no lamento.
theological_decisions:
- issue: Identidade da voz indicada pelo sufixo de primeira pessoa em מְשׂוֹשִׂי
  choice: Manter “minha” sem identificar o falante
  alternative: Explicitar que se trata da alegria de Damasco, do profeta ou de outra voz
  rationale: O hebraico não identifica inequivocamente a voz; a tradução preserva essa ambiguidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Celebrada” evita a expressão pouco idiomática “cidade de louvor”, enquanto a nota preserva a forma literal e a ambiguidade da primeira pessoa.
