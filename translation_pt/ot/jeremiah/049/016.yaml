  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: pt
  text: O terror que você inspira[a] — a arrogância do seu coração[b] — enganou você, você que habita nas fendas da rocha[c] e ocupa o alto da colina. Ainda que eleve o seu ninho como a águia, de lá eu a farei descer — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O seu terror” ou “O seu horror”. O hebraico pode se referir ao terror que Edom inspira ou ao seu caráter aterrador e à sua reputação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a soberba do seu coração”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “fendas da rocha” evoca as fortalezas montanhosas de Edom, que pareciam inacessíveis.
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: o terror que você inspira
  rationale: O termo pode indicar terror ou algo aterrador. No contexto da reputação e da posição fortificada de Edom, a formulação expressa naturalmente o terror causado aos outros sem ocultar a ambiguidade lexical, registrada em nota.
- source_word: הִשִּׁיא אֹתָךְ
  choice: enganou você
  rationale: O hifil de נשׁא tem aqui o sentido de enganar ou induzir ao erro; a escolha é direta e corrente em português.
- source_word: זְדוֹן לִבֶּךָ
  choice: a arrogância do seu coração
  rationale: זָדוֹן denota soberba, insolência ou presunção. A expressão preserva tanto o teor moral quanto o antropologismo hebraico 'do coração'.
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: você que habita nas fendas da rocha
  rationale: O particípio feminino singular dirige-se a Edom personificada. 'Fendas da rocha' conserva a imagem de suas fortalezas montanhosas.
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: e ocupa o alto da colina
  rationale: Embora תפשׂ possa significar agarrar ou tomar, no contexto de habitação fortificada comunica ocupar ou manter uma posição elevada; 'ocupa' é natural em português.
- source_word: כִּי
  choice: ainda que
  rationale: 'A conjunção introduz aqui uma concessão: por mais elevado que seja o ninho de Edom, Yahweh o fará descer.'
- source_word: תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: eleve o seu ninho como a águia
  rationale: Preserva o hifil de גבה e a comparação com a águia. A imagem indica segurança em lugar elevado sem explicá-la dentro do texto.
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: de lá eu o farei descer
  rationale: O hifil de ירד significa fazer descer. A formulação preserva o contraste entre a elevação de Edom e sua queda causada por Yahweh.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é traduzida de modo corrente, e o nome divino יהוה é representado como Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Natureza do terror de Edom
  choice: o terror que Edom inspira, com alternativa em nota
  alternative: o terror ou horror pertencente a Edom
  rationale: O contexto favorece a reputação intimidadora que alimenta a autoconfiança de Edom, mas a forma hebraica permanece semanticamente ambígua; a nota conserva essa tensão.
- issue: Imagem da segurança de Edom
  choice: juízo contra a autoconfiança arrogante fundada em uma posição elevada e fortificada
  alternative: leitura meramente psicológica ou aplicação escatológica desvinculada do oráculo histórico
  rationale: As fendas da rocha, o alto da colina e o ninho da águia situam a arrogância no cenário geográfico e militar de Edom. A tradução mantém esse alcance sem acrescentar doutrina ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'você' porque Edom é interpelada no singular e personificada no feminino pelo hebraico; os pronomes objeto masculinos em português retomam naturalmente o povo ou território de Edom. A ordem dos marcadores foi regularizada para [a], [b], [c], cada um colocado junto à expressão que explica.
