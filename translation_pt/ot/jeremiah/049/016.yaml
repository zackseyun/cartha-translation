    issue: “assim como” introduz uma relação que não está expressa no hebraico.
    rationale: O hebraico justapõe “teu terror” e “a arrogância de teu coração”; a construção é compacta e admite leitura aposicional. “Assim como” apresenta a segunda expressão como agente adicional por comparação, estreitando e explicitando indevidamente a sintaxe.
  - severity: low
    issue: Incoerência de gênero em “eu o farei descer”.
    rationale: O texto trata Edom como interlocutora feminina (“você que habita”; particípios femininos no hebraico). “Eu a farei descer” preserva essa personificação e evita uma mudança referencial não sinalizada.
