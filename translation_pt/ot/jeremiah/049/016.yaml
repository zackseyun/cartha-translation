  source_fidelity: A tradução reproduz adequadamente o vocativo dirigido a Edom, a imagem das fendas rochosas e da altura, a concessão relativa ao ninho da águia e a ação de Yahweh. Contudo, “assim como” transforma a justaposição hebraica entre “o terror” e “a arrogância do coração” em uma comparação/coordenção explícita. É preferível preservar a relação aposicional e sua concisão.
  naturalness: O português é moderno e claro. A revisão melhora a coerência da personificação feminina de Edom ao substituir o objeto masculino “o” por “a” no desfecho.
  terminology: “Yahweh”, “arrogância”, “fendas da rocha” e “ocupa o alto da colina” são adequados ao registro e ao sentido contextual. As notas mantêm de modo útil a alternativa lexical para o termo inicial.
  issues:
