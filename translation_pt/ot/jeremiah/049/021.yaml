  text: מִ/קּ֣וֹל נִפְלָ֔/ם רָעֲשָׁ֖ה הָ/אָ֑רֶץ צְעָקָ֕ה בְּ/יַם ס֖וּף נִשְׁמַ֥ע קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: pt
  text: Ao som da queda deles, a terra treme; seu grito é ouvido no mar Vermelho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mar de Juncos”. Tradicionalmente traduzido por “mar Vermelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Ao som de
  rationale: A preposição מִן com קוֹל pode indicar origem ou ocasião. “Ao som de” expressa naturalmente em português a circunstância que provoca a reação descrita.
- source_word: נִפְלָם
  choice: queda deles
  rationale: Preserva a imagem direta do verbo נפל, “cair”, sem ampliar interpretativamente para “ruína” ou “derrota”.
- source_word: רָעֲשָׁה
  choice: treme
  rationale: O verbo רעשׁ descreve forte abalo ou tremor. O presente vívido se ajusta ao estilo profético e mantém a força da cena.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “região” ou “país”, a imagem abrangente do abalo favorece “a terra”.
- source_word: צְעָקָה
  choice: seu grito
  rationale: צְעָקָה designa um grito ou clamor. O possessivo liga naturalmente o grito aos que caem e corresponde ao referente do sufixo feminino em קוֹלָהּ.
- source_word: בְּיַם סוּף
  choice: no mar Vermelho
  rationale: יַם־סוּף é o nome geográfico tradicionalmente vertido como “mar Vermelho”. A tradução lexical “mar de Juncos” é registrada em nota.
- source_word: נִשְׁמַע
  choice: é ouvido
  rationale: O nifal de שׁמע tem aqui sentido passivo e comunica que o grito alcança um lugar distante.
- source_word: קוֹלָהּ
  choice: seu grito
  rationale: O sufixo feminino singular retoma צְעָקָה. A formulação portuguesa evita a repetição rígida de “a voz do grito”, conservando o sentido.
