  source_fidelity: A tradução representa fielmente o hebraico. “Trarei contra Elão” transmite adequadamente o sentido hostil de וְהֵבֵאתִי אֶל no contexto de juízo; “os quatro ventos” e “das quatro extremidades dos céus” preservam a imagem direcional e cósmica. A dupla negação em “Não haverá nação à qual não cheguem” comunica corretamente a universalidade da dispersão. “Desterrados” é uma opção legítima para נִדְּחֵי, preservando a ideia de expulsão e dispersão forçadas.
