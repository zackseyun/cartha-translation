  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י אֶל עֵילָ֜ם אַרְבַּ֣ע רוּח֗וֹת מֵֽ/אַרְבַּע֙ קְצ֣וֹת הַ/שָּׁמַ֔יִם וְ/זֵ֣רִתִ֔י/ם לְ/כֹ֖ל הָ/רֻח֣וֹת הָ/אֵ֑לֶּה וְ/לֹֽא יִהְיֶ֣ה הַ/גּ֔וֹי אֲשֶׁ֛ר לֹֽא יָב֥וֹא שָׁ֖ם נִדְּחֵ֥י עולם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: pt
  text: Trarei contra Elão os quatro ventos, vindos das quatro extremidades dos céus[a], e os espalharei por todos esses ventos. Não haverá nação à qual não cheguem os desterrados de Elão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos quatro confins do céu”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os dispersos de Elão” ou “os banidos de Elão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: Trarei contra Elão
  rationale: O hifil de בוא com אֶל pode significar trazer a, sobre ou contra. O contexto de juízo favorece o sentido hostil expresso naturalmente por “contra”.
- source_word: אַרְבַּע רוּחוֹת
  choice: os quatro ventos
  rationale: Embora רוּחַ também possa significar espírito, a referência às extremidades dos céus indica ventos associados às direções cardeais.
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: vindos das quatro extremidades dos céus
  rationale: קָצֶה designa extremidade ou limite. “Extremidades dos céus” preserva a imagem hebraica; “vindos” explicita em português a relação do sintagma com os quatro ventos.
- source_word: וְזֵרִתִים
  choice: e os espalharei
  rationale: זרה pode evocar o ato de joeirar, mas aqui comunica sobretudo dispersão sob juízo. “Espalharei” é claro e mantém a força da imagem.
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: por todos esses ventos
  rationale: A formulação conserva a repetição intencional de “ventos” e comunica a dispersão em todas as direções sem substituir a metáfora por uma explicação.
- source_word: וְלֹא יִהְיֶה הַגּוֹי אֲשֶׁר לֹא יָבוֹא שָׁם
  choice: Não haverá nação à qual não cheguem
  rationale: Preserva a dupla negação e o sentido de movimento do verbo בוא, com sintaxe natural em português.
- source_word: נִדְּחֵי עֵילָם
  choice: os desterrados de Elão
  rationale: O particípio de נדח descreve pessoas impelidas para longe ou dispersas. “Desterrados” expressa tanto a remoção forçada quanto a condição resultante.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “ventos” foi mantida para preservar a imagem e a coesão do hebraico; “desterrados” mantém o caráter forçado da dispersão.
