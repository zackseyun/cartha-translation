  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
translation:
  language: pt
  text: Mas, nos últimos dias, restaurarei a sorte de Elão[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «trarei de volta os exilados de Elão». A fórmula hebraica também pode ser entendida como restauração de Elão do cativeiro; ela pode referir-se especificamente ao retorno do cativeiro ou, de modo mais amplo, à restauração da condição de um povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Mas
  rationale: Introduz a reversão futura depois do anúncio de juízo anterior; em português, a conjunção adversativa comunica naturalmente essa virada discursiva sem reproduzir de modo rígido a fórmula «e acontecerá».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Preserva a expressão profética e sua possível força escatológica, sem determinar um esquema cronológico específico.
- source_word: אשוב אֶת שבית
  choice: restaurarei a sorte
  rationale: Traduz a fórmula hebraica de restauração de modo natural e abrangente. Ela pode envolver retorno do cativeiro, reversão do juízo e recuperação da condição do povo; a alternativa mais literal é mantida em nota.
- source_word: עֵילָם
  choice: Elão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome da nação e região antiga.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força solene da fórmula profética e representa o tetragrama pelo nome divino Yahweh, em vez de substituí-lo por um título.
theological_decisions:
- issue: Força profética ou escatológica de בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  alternative: nos dias vindouros
  rationale: A formulação escolhida conserva o peso profético e a possível dimensão escatológica do hebraico, mas o versículo não oferece elementos para impor uma interpretação escatológica detalhada.
- issue: Sentido da fórmula אשוב אֶת שבית עֵילָם
  choice: restauração ampla da sorte de Elão
  alternative: retorno do cativeiro ou dos cativos de Elão
  rationale: A expressão hebraica pode designar especificamente a volta do exílio ou, de forma mais ampla, uma reversão da condição adversa. O texto principal preserva essa amplitude, e a nota registra a leitura mais concreta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Elão» segue o uso bíblico português consolidado; «Yahweh» preserva o nome divino. O travessão destaca naturalmente a fórmula profética final.
