  to: Farei Elão desmoronar[a] diante de seus inimigos e diante dos que procuram tirar-lhes a vida.[b] Trarei sobre eles a desgraça, o ardor da minha ira — declara Yahweh —, e enviarei a espada atrás deles, até eu os consumir.
