  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: pt
  text: Farei Elão desmoronar[a] diante de seus inimigos e diante dos que procuram tirar-lhes a vida.[b] Trarei sobre eles a desgraça, o ardor da minha ira — declara Yahweh —, e enviarei a espada atrás deles, até eu os consumir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «farei Elão ficar aterrorizado» ou «farei Elão ficar desalentado». O verbo hebraico pode enfatizar causar pânico, desalento ou colapso.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «os que procuram a vida deles», expressão que significa os que procuram matá-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: Farei Elão desmoronar
  rationale: O hifil de חתת pode expressar causar terror, desalento ou colapso. “Farei ... desmoronar” preserva neste contexto militar tanto o abalo psicológico quanto a ruína coletiva.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: diante de seus inimigos
  rationale: Expressa naturalmente o sentido de exposição e derrota na presença dos inimigos.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: os que procuram tirar-lhes a vida
  rationale: Comunica com clareza o sentido do idioma hebraico, literalmente “os que procuram a vida deles”, isto é, os que querem matá-los.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: Trarei sobre eles a desgraça
  rationale: Neste anúncio profético de juízo, רָעָה designa calamidade ou desgraça, e não maldade moral.
- source_word: אֶת חֲרוֹן אַפִּי
  choice: o ardor da minha ira
  rationale: Mantém a metáfora hebraica do calor intenso da ira e sua relação explicativa com a desgraça anunciada.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética, preservando o nome divino.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת הַחֶרֶב
  choice: enviarei a espada atrás deles
  rationale: Conserva a imagem vívida e personificada da espada enviada em perseguição.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: até que eu acabe com eles
  rationale: Expressa a força resultativa de כלה sem acrescentar uma imagem ausente no hebraico.
theological_decisions:
- issue: Sentido de רָעָה como ação divina
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto é de juízo histórico e militar; o termo indica a calamidade infligida, não maldade moral.
- issue: Representação do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Alcance de עַד כַּלּוֹתִי אוֹתָם
  choice: até que eu acabe com eles
  alternative: até que eu os consuma; até que eu os destrua
  rationale: A formulação mantém a força totalizante do juízo sem definir além do necessário a natureza exata desse fim.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para leitores brasileiros e inteligível internacionalmente. A colocação pronominal “tirar-lhes” conserva concisão e solenidade; os travessões delimitam com clareza a fórmula profética.
