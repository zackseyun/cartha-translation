  text: וְ/אַחֲרֵי כֵ֗ן אָשִׁ֛יב אֶת שְׁב֥וּת בְּנֵֽי עַמּ֖וֹן נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: pt
  text: Mas, depois disso, restaurarei a sorte do povo de Amom[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “restaurarei o cativeiro do povo de Amom”. A expressão hebraica pode se referir à reversão do cativeiro ou, em sentido mais amplo, à restauração da sorte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Mas, depois disso
  rationale: A expressão é temporal, “depois disso”, e a conjunção marca aqui a transição do juízo para a restauração; “Mas” comunica naturalmente essa virada no discurso.
- source_word: אָשִׁיב
  choice: restaurarei
  rationale: O hifil de שוב significa “fazer voltar” ou “restaurar”; nesta fórmula profética, “restaurarei” é natural e se combina bem com שְׁבוּת.
- source_word: אֶת שְׁבוּת
  choice: a sorte
  rationale: Na construção idiomática com שוב, שְׁבוּת pode indicar a reversão do cativeiro e, de modo mais amplo, a restauração da condição ou sorte de um povo. A alternativa mais literal é preservada em nota.
- source_word: בְּנֵי עַמּוֹן
  choice: o povo de Amom
  rationale: Literalmente, “filhos de Amom”; a tradução escolhida expressa com clareza o sentido étnico e coletivo em português atual.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é a fórmula profética solene “declara”, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Promessa de restauração a Amom depois do juízo
  choice: Apresentar a declaração como uma promessa futura real de restauração ao povo de Amom, sem definir sua modalidade ou extensão.
  alternative: Restringi-la a uma restauração exclusivamente política ou interpretá-la como restauração espiritual desvinculada do referente nacional.
  rationale: O hebraico anuncia a ação futura de Yahweh em favor do povo de Amom, mas não esclarece a forma nem o alcance completo dessa restauração. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mas, depois disso” preserva tanto a sequência temporal quanto a virada do juízo para a esperança; “a sorte” mantém o caráter idiomático da fórmula, e a nota registra a leitura ligada ao cativeiro.
