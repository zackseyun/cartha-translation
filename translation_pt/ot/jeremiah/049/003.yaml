id: JER.49.3
reference: Jeremiah 49:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: pt
  text: Lamente, Hesbom, pois Ai foi devastada! Clamem, filhas de Rabá! Vistam roupas de pano de saco, pranteiem e andem de um lado para outro entre os muros, pois o rei delas[a] irá para o exílio, junto com seus sacerdotes e seus oficiais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Milcom irá para o exílio” (também grafado “Malcam”), entendendo o hebraico como o nome do deus amonita, e não como “o rei delas”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Lamente
  rationale: Imperativo feminino singular de ילל, dirigido à cidade personificada. “Lamente” transmite um clamor de aflição em português atual e digno.
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Forma tradicional e legível em português para o topônimo bíblico.
- source_word: שֻׁדְּדָה
  choice: foi devastada
  rationale: O passivo de שׁדד denota devastação violenta, muitas vezes acompanhada de saque; a escolha não restringe o sentido a destruição total nem apenas a pilhagem.
- source_word: עַי
  choice: Ai
  rationale: Mantém o topônimo conforme o Texto Massorético, sem adotar emenda para Ar.
- source_word: צְעַקְנָה
  choice: Clamem
  rationale: Imperativo feminino plural de צעק; expressa um grito público de aflição e concorda com “filhas de Rabá”.
- source_word: בְּנוֹת רַבָּה
  choice: filhas de Rabá
  rationale: Preserva a imagem hebraica, que pode personificar as habitantes ou localidades dependentes de Rabá.
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: Vistam roupas de pano de saco
  rationale: Torna explícito em português o costume de luto indicado pelo hebraico, evitando que “vistam pano de saco” soe como referência a uma sacola.
- source_word: סְפֹדְנָה
  choice: pranteiem
  rationale: ספד indica lamentação de luto; “pranteiem” preserva essa especificidade.
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: andem de um lado para outro
  rationale: Expressa o movimento inquieto e repetido sugerido pela forma verbal, com naturalidade em português.
- source_word: בַּגְּדֵרוֹת
  choice: entre os muros
  rationale: גדרות pode indicar muros, cercas ou recintos. “Entre os muros” se ajusta ao cenário urbano sem eliminar inteiramente a ideia de estruturas delimitadoras.
- source_word: מַלְכָּם
  choice: o rei delas
  rationale: Segue a vocalização massorética, “o rei delas”, e torna claro que o sufixo remete às cidades ou habitantes femininos mencionados; a possível leitura como nome divino é registrada em nota.
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: irá para o exílio
  rationale: Equivalente natural da fórmula hebraica de deportação.
- source_word: כֹּהֲנָיו וְשָׂרָיו
  choice: seus sacerdotes e seus oficiais
  rationale: “Sacerdotes” preserva o sentido cultual, enquanto “oficiais” comunica de modo amplo os dirigentes designados por שׂרים.
theological_decisions:
- issue: Se מַלְכָּם designa um rei humano ou o deus amonita Milcom/Malcam
  choice: o rei delas
  alternative: Milcom (também grafado Malcam)
  rationale: A vocalização massorética favorece “o rei delas”. Contudo, o texto consonantal também permite entender o termo como o nome da divindade amonita, leitura relevante no contexto e, por isso, preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Os imperativos femininos e a personificação das cidades foram preservados; “roupas de pano de saco” esclarece o sinal antigo de luto.
