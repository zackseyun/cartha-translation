base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: pt
  text: Edom se tornará uma desolação[a]; todos os que passarem por ela ficarão horrorizados e assobiarão[b] por causa de todas as suas feridas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um motivo de horror”. O termo hebraico pode indicar tanto a devastação como o horror que ela provoca.
    reason: lexical_alternative
  - marker: b
    text: Ou “sibilarão”. O verbo hebraico se refere a produzir um som agudo que pode expressar espanto ou escárnio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: O perfeito qal com a conjunção, neste contexto profético, aponta para o futuro e para o estado resultante.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mantém o nome próprio tradicional da nação e de sua terra.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: Expressa a ruína devastadora, embora o termo hebraico também possa destacar o horror que ela provoca; essa amplitude é preservada em nota.
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: todos os que passarem por ela
  rationale: Forma coletiva natural em português; o pronome feminino retoma Edom concebida como terra ou nação.
- source_word: יִשֹּׁם
  choice: ficarão horrorizados
  rationale: No contexto, o verbo descreve a reação consternada dos observadores diante da devastação.
- source_word: וְיִשְׁרֹק
  choice: assobiarão
  rationale: O verbo denota produzir um som agudo que manifesta espanto ou escárnio; 'assobiarão' é claro e natural em português.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: por causa de todos os seus golpes
  rationale: מַכּוֹת designa literalmente golpes e, por extensão, feridas ou calamidades; 'golpes' conserva a imagem e עַל indica aqui a causa da reação.
