revisions:
- from: Seus camelos se tornarão despojo, e a grande quantidade de seus rebanhos, presa de guerra. Espalharei a todos os ventos os que cortam as pontas do cabelo[a] e, de todos os lados, trarei sobre eles a sua calamidade[b] — declara Yahweh.
  to: Seus camelos se tornarão despojo, e a abundância de seus rebanhos, presa de guerra. Espalharei a todos os ventos os que cortam as laterais do cabelo[a] e, de todos os lados, trarei sobre eles a sua calamidade[b] — declara Yahweh.
  rationale: A revisão corrige a imagem anatômica de «pontas» para «laterais», que corresponde melhor a פֵאָה sem especificar como certa a referência às têmporas ou à barba. Também torna mais idiomática a expressão de abundância e ajusta as notas para que explicitem alternativas lexicais reais. O restante do texto preserva a fidelidade ao hebraico, o registro profético e a decisão editorial de usar «Yahweh».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura geral e os principais termos do versículo estão bem representados: camelos e rebanhos/livestock tornam-se bens tomados, Yahweh anuncia dispersão «a todos os ventos», e a calamidade vem de todos os lados. Contudo, «pontas do cabelo» sugere as extremidades dos fios, não as bordas laterais/área das têmporas expressas por פֵאָה; por isso não preserva adequadamente a imagem hebraica.'
  naturalness: O português é claro, solene e amplamente legível. «A grande quantidade de seus rebanhos» é compreensível, mas «a abundância de seus rebanhos» é mais fluente em registro bíblico moderno. «De todos os lados, trarei sobre eles...» é natural e comunica adequadamente o sentido contextual.
  terminology: «Despojo» e «presa de guerra» mantêm, de maneira idiomática, a distinção aproximada entre os dois termos hebraicos para bens capturados. «Yahweh» corresponde à decisão editorial para o Tetragrama. A expressão referente ao corte de cabelo deve indicar as laterais/bordas, sem decidir indevidamente entre cabelo, têmporas ou barba.
  issues:
  - severity: medium
    issue: «os que cortam as pontas do cabelo»
    rationale: «Pontas» normalmente designa as extremidades dos fios de cabelo. O hebraico קְצוּצֵי פֵאָה alude a bordas laterais/“cantos”, provavelmente à região das têmporas, e não ao comprimento ou às pontas dos fios.
  - severity: low
    issue: 'Nota a: «extremidades do cabelo»'
    rationale: Repete e reforça a imprecisão de «pontas». A nota deve explicar que a referência é às laterais ou bordas do cabelo, preservando a incerteza quanto à prática exata.
  - severity: low
    issue: «a grande quantidade de seus rebanhos»
    rationale: É fiel, mas algo pesada. «A abundância de seus rebanhos» expressa הֲמוֹן com mais naturalidade sem alterar o sentido.
  - severity: low
    issue: Nota b não apresenta uma alternativa nitidamente distinta do texto principal
    rationale: A nota pode registrar de forma mais direta a alternativa espacial para מִכָּל עֲבָרָיו, incluindo «de todos os lados deles» ou «de toda parte».
  revised_text: Seus camelos se tornarão despojo, e a abundância de seus rebanhos, presa de guerra. Espalharei a todos os ventos os que cortam as laterais do cabelo[a] e, de todos os lados, trarei sobre eles a sua calamidade[b] — declara Yahweh.
  revised_footnotes:
  - marker: a
    text: 'Ou: “os de têmporas aparadas”. A expressão hebraica se refere a pessoas que cortavam as laterais ou bordas do cabelo, provavelmente como prática distintiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de todos os lados deles”; ou “de toda parte”.'
    reason: lexical_alternative
  revision_rationale: A revisão corrige a imagem anatômica de «pontas» para «laterais», que corresponde melhor a פֵאָה sem especificar como certa a referência às têmporas ou à barba. Também torna mais idiomática a expressão de abundância e ajusta as notas para que explicitem alternativas lexicais reais. O restante do texto preserva a fidelidade ao hebraico, o registro profético e a decisão editorial de usar «Yahweh».
