  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: pt
  text: Seus camelos se tornarão despojo, e a abundância de seus rebanhos, presa de guerra. Espalharei a todos os ventos os que cortam as laterais do cabelo[a] e, de todos os lados, trarei sobre eles a sua calamidade[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os de têmporas aparadas”. A expressão hebraica se refere a pessoas que cortavam as laterais ou bordas do cabelo, provavelmente como prática distintiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de todos os lados deles”; ou “de toda parte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְמַלֵּיהֶם
  choice: seus camelos
  rationale: O substantivo designa camelos; esta é a forma corrente e suficientemente precisa em português.
- source_word: לָבַז
  choice: se tornarão despojo
  rationale: Expressa que os camelos serão tomados pelos inimigos; “despojo” mantém o contexto militar.
- source_word: הֲמוֹן מִקְנֵיהֶם
  choice: a grande quantidade de seus rebanhos
  rationale: הֲמוֹן indica abundância, e מִקְנֶה se refere aqui ao conjunto de animais domésticos. “Rebanhos” é natural e coletivo em português.
- source_word: לְשָׁלָל
  choice: presa de guerra
  rationale: Distingue, sem exagerar, este termo do anterior לָבַז e explicita seu sentido de bens capturados em guerra.
- source_word: וְזֵרִתִים
  choice: espalharei
  rationale: O verbo indica dispersão; “espalharei” comunica diretamente o juízo anunciado.
- source_word: לְכָל רוּחַ
  choice: a todos os ventos
  rationale: Preserva a imagem hebraica, compreensível em português, de dispersão em todas as direções.
- source_word: קְצוּצֵי פֵאָה
  choice: os que cortam as pontas do cabelo
  rationale: Mantém a referência a uma prática distintiva de corte nas extremidades ou laterais do cabelo sem especificar indevidamente têmporas ou barba.
- source_word: מִכָּל עֲבָרָיו
  choice: de todos os lados
  rationale: Transmite de forma natural a ideia de procedência de toda parte. A construção hebraica contém um sufixo singular cujo referente coletivo é pouco natural se reproduzido literalmente em português.
- source_word: אָבִיא אֶת אֵידָם
  choice: trarei sobre eles a sua calamidade
  rationale: אֵיד designa calamidade em contexto de juízo. A formulação portuguesa deixa claro que ela recairá sobre o povo mencionado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome divino sem substituí-lo por um título.
- issue: Identidade dos קְצוּצֵי פֵאָה
  choice: os que cortam as pontas do cabelo
  alternative: os de têmporas aparadas; os que cortam as extremidades da barba
  rationale: A expressão parece identificar um grupo por uma prática de aparência, mas o hebraico não determina com plena certeza se a referência específica é às têmporas, ao cabelo lateral ou à barba. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. A imagem “a todos os ventos” foi preservada; “presa de guerra” evita repetição mecânica e mantém a diferença entre os dois termos hebraicos para saque. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
