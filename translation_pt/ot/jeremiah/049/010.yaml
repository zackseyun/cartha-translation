  to: Pois eu deixei Esaú completamente exposto[a]; pus a descoberto os seus esconderijos, e ele não poderá esconder-se. Seus descendentes, seus irmãos e seus vizinhos foram devastados[b], e ele não existe mais.
  rationale: A revisão substitui “descobri” por “pus a descoberto”, eliminando uma ambiguidade portuguesa e preservando a imagem hebraica de exposição deliberada. A forma pronominal “esconder-se” favorece legibilidade internacional sem alterar o sentido. O restante, inclusive a construção que aplica “foram devastados” aos três grupos coordenados, é mantido.
