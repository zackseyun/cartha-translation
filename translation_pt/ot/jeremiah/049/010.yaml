  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: pt
  text: Pois eu deixei Esaú completamente exposto[a]; pus a descoberto os seus esconderijos, e ele não poderá esconder-se. Seus descendentes, seus irmãos e seus vizinhos foram devastados[b], e ele não existe mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Esaú” representa a nação descendente de Esaú, isto é, Edom.
    reason: cross_reference
  - marker: b
    text: 'Ou: “foram saqueados” ou “foram destruídos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂפְתִּי
  choice: deixei ... completamente exposto
  rationale: Expressa a retirada da cobertura e a exposição total, em português natural, mantendo a imagem concreta.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Preserva o nome pessoal presente no hebraico, usado metonimicamente neste oráculo para Edom.
- source_word: גִּלֵּיתִי
  choice: descobri
  rationale: Mantém a imagem de retirar aquilo que cobria ou ocultava os esconderijos.
- source_word: מִסְתָּרָיו
  choice: seus esconderijos
  rationale: Conserva o sentido espacial de lugares de ocultação, em linguagem corrente.
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: ele não poderá se esconder
  rationale: Reproduz a incapacidade futura expressa por יכל e toma o sujeito masculino singular como referência a Esaú/Edom.
- source_word: שֻׁדַּד
  choice: foram devastados
  rationale: O verbo denota espoliação violenta ou devastação. O plural em português permite que o predicado abranja os três grupos coordenados, como sugere a sintaxe contextual.
- source_word: זַרְעוֹ
  choice: seus descendentes
  rationale: Comunica naturalmente o sentido coletivo de 'semente' aplicado à posteridade.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: Mantém o termo familiar literal, sem excluir sua possível aplicação a povos aparentados.
- source_word: שְׁכֵנָיו
  choice: seus vizinhos
  rationale: Preserva o valor lexical e pode designar povos próximos no contexto nacional.
- source_word: וְאֵינֶנּוּ
  choice: e ele já não existe
  rationale: Expressa com clareza e solenidade a ausência ou desaparecimento definitivo indicado pelo idioma hebraico.
- source_word: כִּי
  choice: Pois
  rationale: Introduz naturalmente em português a explicação ou razão do juízo anunciado.
theological_decisions:
- issue: Referente de “Esaú” em um oráculo contra Edom
  choice: Manter “Esaú” no texto e esclarecer em nota seu referente nacional.
  alternative: Traduzir interpretativamente como “Edom”.
  rationale: O texto hebraico traz explicitamente o nome Esaú; preservá-lo mantém a formulação profética e evita substituir o nome por uma interpretação contextual.
- issue: Alcance sintático de שֻׁדַּד
  choice: Entender o verbo como predicado dos descendentes, irmãos e vizinhos em conjunto.
  alternative: Ligá-lo apenas aos descendentes, deixando os demais grupos como construção elíptica.
  rationale: A coordenação dos três grupos favorece um único predicado compartilhado, embora a forma verbal hebraica singular reflita o primeiro substantivo coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens de exposição e esconderijos, mantém o nome Esaú e sinaliza em nota a amplitude lexical do verbo שׁדד.
