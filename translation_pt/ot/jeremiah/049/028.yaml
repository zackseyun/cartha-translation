  source_fidelity: 'A tradução preserva os referentes, o plural de “reinos”, a força militar dos imperativos e a designação coletiva em בני קדם. “Derrotou” é uma opção aceitável para הִכָּה no contexto. Contudo, a pontuação deve manter a estrutura do hebraico: a oração relativa introduz o pronunciamento profético, e não encerra uma frase independente.'
