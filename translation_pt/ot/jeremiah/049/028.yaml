  terminology: “Quedar”, “Hazor”, “Nabucodonosor”, “Babilônia” e “Yahweh” são formas adequadas. Não são necessárias notas para esta redação, pois não há âncoras no texto nem uma ambiguidade que exija esclarecimento ao leitor.
