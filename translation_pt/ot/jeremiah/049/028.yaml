  - severity: low
    issue: “Oriente” com inicial maiúscula pode parecer um topônimo ou uma região oficialmente delimitada.
    rationale: בני קדם significa literalmente “filhos do leste/oriente” e designa coletivamente populações orientais; “povos do leste” comunica isso sem delimitação geográfica indevida.
