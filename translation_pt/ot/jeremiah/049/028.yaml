  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: pt
  text: 'A respeito de Quedar e dos reinos de Hazor, que Nabucodonosor, rei da Babilônia, derrotou: assim diz Yahweh:


    “Levantem-se, avancem contra Quedar

    e saqueiem os povos do leste.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקֵדָר
  choice: A respeito de Quedar
  rationale: O לְ em títulos proféticos frequentemente introduz o assunto do oráculo; “a respeito de” é natural e evita entendê-lo como simples direção.
- source_word: וּלְמַמְלְכוֹת חָצוֹר
  choice: e dos reinos de Hazor
  rationale: Preserva o plural מַמְלְכוֹת e mantém Hazor como nome próprio, sem restringi-lo indevidamente à conhecida cidade cananeia.
- source_word: אֲשֶׁר הִכָּה
  choice: que ... derrotou
  rationale: No contexto militar, נכה pode indicar golpear ou vencer. “Derrotou” comunica com clareza o resultado da ação, sem acrescentar a ideia específica de destruição total.
- source_word: נבוכדראצור
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome real babilônico.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Conserva a fórmula profética e representa diretamente o nome divino יהוה como Yahweh.
- source_word: קוּמוּ
  choice: Levantem-se
  rationale: Mantém a força do imperativo plural em português atual e digno.
- source_word: עֲלוּ אֶל קֵדָר
  choice: avancem contra Quedar
  rationale: עלה com אֶל assume sentido militar neste contexto, confirmado pela ordem seguinte de saquear; “avancem contra” exprime isso naturalmente.
- source_word: וְשָׁדְדוּ
  choice: e saqueiem
  rationale: שׁדד, em contexto bélico, significa despojar ou saquear; “saqueiem” é claro e corrente.
- source_word: בְּנֵי קֶדֶם
  choice: os povos do Oriente
  rationale: A expressão literalmente significa “filhos do Oriente” e funciona como designação idiomática de povos orientais, especialmente grupos das regiões desérticas. O plural “povos” deixa perceptível seu caráter coletivo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Mantém tom profético solene, imperativos plurais claros e nomes próprios nas formas portuguesas consagradas.
