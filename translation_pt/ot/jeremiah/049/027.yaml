source:
  edition: WLC
  text: וְ/הִצַּ֥תִּי אֵ֖שׁ בְּ/חוֹמַ֣ת דַּמָּ֑שֶׂק וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: pt
  text: E porei fogo na muralha de Damasco[a], e ele consumirá os palácios de Ben-Hadade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra a muralha de Damasco”. A preposição hebraica pode ter uma nuance espacial ligeiramente diferente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: E porei fogo
  rationale: O hifil perfeito na primeira pessoa singular expressa a ação causadora direta do falante divino. Em português, “porei fogo” é natural, claro e mantém a força da imagem profética.
- source_word: אֵשׁ
  choice: fogo
  rationale: Depois da locução portuguesa “pôr fogo”, o substantivo ocorre naturalmente sem artigo, embora corresponda ao singular hebraico.
- source_word: בְּחוֹמַת
  choice: na muralha de
  rationale: A preposição בְּ admite aqui valor espacial traduzido naturalmente por “em/na”. “Muralha” comunica a fortificação urbana; a possível nuance “contra” é preservada em nota.
- source_word: דַּמָּשֶׂק
  choice: Damasco
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: O verbo qal perfeito feminino concorda em hebraico com “fogo” e, no discurso profético, tem valor futuro. O pronome masculino segue o gênero de “fogo” em português e explicita o sujeito sem mudar o sentido.
- source_word: אַרְמְנוֹת
  choice: os palácios
  rationale: O termo designa palácios ou residências reais fortificadas. “Palácios” preserva a referência provável às edificações reais ligadas a Ben-Hadade.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadade
  rationale: Forma portuguesa tradicional do nome ou título real arameu, com hífen para indicar o composto.
theological_decisions:
- issue: Falante divino implícito e agente do juízo
  choice: A primeira pessoa é mantida diretamente em “porei”, sem acrescentar identificação do falante.
  alternative: Acrescentar “diz o SENHOR” ou explicitar que Deus acenderá o fogo.
  rationale: O contexto identifica o SENHOR como falante, mas o versículo não repete essa identificação. A tradução preserva a ação divina direta sem inserir palavras ausentes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação direta. “Porei fogo” soa mais natural do que “acenderei um fogo” neste contexto, sem enfraquecer a causalidade do hebraico. A repetição pronominal em “ele consumirá” deixa claro que o fogo é o sujeito.
