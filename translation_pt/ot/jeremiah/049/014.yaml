  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: pt
  text: 'Ouvi uma notícia da parte de Yahweh, e um mensageiro[a] foi enviado entre as nações: “Reúnam-se, venham contra ela[b] e levantem-se para a batalha!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um emissário” ou “um embaixador”.
    reason: lexical_alternative
  - marker: b
    text: O pronome “ela” refere-se a Edom, personificada como mulher no contexto.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה
  choice: uma notícia
  rationale: O substantivo indica algo ouvido, como notícia, informe ou relato. “Notícia” é natural em português atual e combina com o anúncio profético.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico apresenta a recepção da notícia como fato consumado; o pretérito perfeito é a forma mais natural e direta em português.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת indica origem ou procedência. “Da parte de” comunica que a notícia procede de Yahweh e preserva o nome divino.
- source_word: צִיר
  choice: um mensageiro
  rationale: O termo pode designar mensageiro, enviado ou emissário. “Mensageiro” é claro e abrangente, enquanto a nuance diplomática possível é preservada em nota.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: A preposição e o substantivo apontam para a circulação do mensageiro entre os povos convocados, sem introduzir o sentido teológico posterior de “gentios”.
- source_word: שָׁלוּחַ
  choice: foi enviado
  rationale: O particípio passivo descreve o mensageiro como alguém despachado. O pretérito mantém a sequência narrativa de modo natural em português.
- source_word: הִתְקַבְּצוּ
  choice: Reúnam-se
  rationale: A forma plural reflexiva convoca os povos a se agruparem. “Reúnam-se” conserva a força imperativa com linguagem atual.
- source_word: וּבֹאוּ עָלֶיהָ
  choice: venham contra ela
  rationale: No contexto militar, בוא com עַל expressa avanço hostil. “Contra ela” preserva o pronome feminino que personifica Edom.
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: e levantem-se para a batalha
  rationale: A tradução mantém a força verbal de קום e o caráter de convocação militar, sem reduzi-la apenas à ideia de preparação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Referente do pronome feminino עָלֶיהָ
  choice: ela, referindo-se a Edom personificada
  alternative: Edom, explicitando o referente no corpo do texto
  rationale: A tradução conserva o pronome feminino do hebraico e sua personificação, deixando a identificação contextual para a nota em vez de resolver a figura dentro do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A convocação militar foi mantida direta e enfática. As ambiguidades lexicais relevantes foram preservadas em nota, e o feminino referente a Edom não foi substituído no texto principal.
