id: JER.49.38
reference: Jeremiah 49:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י כִסְאִ֖/י בְּ/עֵילָ֑ם וְ/הַאֲבַדְתִּ֥י מִ/שָּׁ֛ם מֶ֥לֶךְ וְ/שָׂרִ֖ים נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: pt
  text: Porei o meu trono em Elão e eliminarei dali o rei e os líderes[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os príncipes”, “os governantes” ou “os oficiais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Porei
  rationale: O verbo שׂוּם significa pôr, colocar ou estabelecer. “Porei” é direto e natural, sem explicitar além do hebraico a ideia de permanência.
- source_word: כִסְאִי
  choice: o meu trono
  rationale: כִּסֵּא denota aqui o trono real e preserva a imagem concreta da soberania e do juízo divinos.
- source_word: בְּעֵילָם
  choice: em Elão
  rationale: A preposição בְּ é locativa; “em” evita introduzir o sentido adversativo de “contra”, que não está expresso.
- source_word: וְהַאֲבַדְתִּי
  choice: e eliminarei
  rationale: O hifil de אבד indica fazer perecer, destruir ou eliminar. No contexto, “eliminarei dali” expressa com clareza a remoção destrutiva dos governantes sem soar como destruição física de objetos.
- source_word: מִשָּׁם
  choice: dali
  rationale: Equivalente português conciso e natural para a expressão locativa “de lá”.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Embora sem artigo no hebraico, o referente funcional é o soberano de Elão; em português, “o rei” é a formulação idiomática neste par coordenado.
- source_word: וְשָׂרִים
  choice: e os líderes
  rationale: שָׂרִים designa autoridades de alta posição, governantes, príncipes ou oficiais. “Líderes” é atual e abrangente, sem sugerir necessariamente descendência real.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e verte diretamente o nome divino יהוה como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. A transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Sentido de “meu trono” no contexto de juízo
  choice: Preservar a imagem concreta “o meu trono”
  alternative: o meu domínio; o meu tribunal
  rationale: A imagem pode envolver simultaneamente soberania, presença régia e juízo. A tradução não reduz essa amplitude a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem das orações e a imagem régia do hebraico foram preservadas; empregou-se “Elão”, forma tradicional e reconhecível do topônimo em português.
