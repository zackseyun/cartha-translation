  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: pt
  text: 'Portanto, ouçam o plano de Yahweh, que ele traçou contra Edom, e os desígnios que formulou contra os habitantes de Temã: certamente os pequenos do rebanho os arrastarão para longe[a]; certamente ele tornará desolada a sua pastagem por causa deles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os mais jovens do rebanho” ou “os menores do rebanho”. A expressão provavelmente representa os atacantes mais fracos ou menos importantes, mas a imagem do rebanho foi mantida no texto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua morada” ou “o seu aprisco”. O termo hebraico pode designar pastagem, morada ou lugar onde o rebanho repousa. A relação expressa por “por causa deles” traduz uma construção hebraica difícil, literalmente “sobre eles”, que também pode ser entendida de outras maneiras.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz naturalmente a conclusão decorrente do oráculo anterior.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Imperativo plural que preserva a convocação profética e soa natural em português atual.
- source_word: עֲצַת יְהוָה
  choice: o plano de Yahweh
  rationale: עֵצָה pode indicar conselho, plano ou propósito; neste contexto, “plano” expressa com clareza a deliberação divina, enquanto Yahweh translitera o nome divino.
- source_word: יָעַץ אֶל אֱדוֹם
  choice: que ele traçou contra Edom
  rationale: “Traçou” comunica planejamento deliberado, e “contra” explicita a força hostil de אֶל no contexto.
- source_word: מַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: os desígnios que formulou
  rationale: Mantém a ideia de intenções deliberadas sem repetir “plano”; “desígnios” convém ao registro profético.
- source_word: יֹשְׁבֵי תֵימָן
  choice: os habitantes de Temã
  rationale: Tradução direta e natural da expressão hebraica.
- source_word: אִם לֹא
  choice: certamente
  rationale: A construção funciona aqui como asseveração enfática, não como condição literal.
- source_word: יִסְחָבוּם
  choice: os arrastarão para longe
  rationale: Preserva a imagem vigorosa de arrastar ou levar à força.
- source_word: צְעִירֵי הַצֹּאן
  choice: até os pequenos do rebanho
  rationale: Retém a imagem concreta e a ambiguidade entre pequenos, jovens ou menos importantes; “até” torna perceptível a ideia provável de agentes insignificantes sem eliminá-la por interpretação.
- source_word: יַשִּׁים עֲלֵיהֶם נְוֵהֶם
  choice: ele deixará desolada sobre eles a sua pastagem
  rationale: Reproduz a ação devastadora do contexto e conserva o difícil עֲלֵיהֶם como “sobre eles”, evitando transformá-lo silenciosamente em uma relação causal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Identidade dos “pequenos do rebanho”
  choice: manter a metáfora sem identificar explicitamente os agentes
  alternative: interpretar como os atacantes mais fracos ou menos importantes
  rationale: A expressão provavelmente se refere metaforicamente a agentes insignificantes, mas o hebraico não resolve de modo explícito sua identidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência paralela e a repetição de “certamente” preservam a força solene do anúncio profético. As imagens do rebanho e da pastagem são mantidas, assim como a dificuldade da frase final, sem impor uma interpretação denominacional.
