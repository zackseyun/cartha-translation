  naturalness: O registro geral é moderno, solene e claro. «Ele tornará desolada a sua pastagem por causa deles» é natural em português e conserva o sentido devastador do anúncio. Retirar «até» evita introduzir no texto principal uma ênfase comparativa que o hebraico pode sugerir, mas não expressa lexicalmente.
  terminology: «Yahweh», «Edom», «Temã», «desígnios», «rebanho» e «pastagem» são escolhas adequadas. «Pastagem» mantém a coerência imagética, com alternativas de habitação/aprisco explicadas em nota.
