id: JER.49.2
reference: Jeremiah 49:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: pt
  text: Por isso, eis que vêm dias — declara Yahweh — em que farei ouvir contra Rabá dos amonitas o grito de guerra[a]. Ela se tornará um monte de ruínas desolado, e suas cidades-filhas[b] serão incendiadas. Então Israel desapossará aqueles que o desapossaram[c] — diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “o brado de guerra” ou “o alarme de guerra”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “suas filhas”, expressão hebraica que designa as cidades menores ou aldeias dependentes de uma cidade principal.
    reason: cultural_note
  - marker: c
    text: 'O hebraico emprega um jogo de palavras com o mesmo verbo: Israel “desapossará” aqueles que o haviam “desapossado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a conclusão decorrente da acusação e do juízo anunciados no contexto anterior, em português natural.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a força enfática e solene da fórmula profética sem deixar de ser reconhecível ao leitor moderno.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de modo transparente o conhecido idioma profético que anuncia uma intervenção futura.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém o caráter formal da fórmula profética e verte diretamente o nome divino.
- source_word: וְהִשְׁמַעְתִּי
  choice: farei ouvir
  rationale: Conserva o valor causativo da forma hifil do verbo שׁמע.
- source_word: אֶל רַבַּת בְּנֵי עַמּוֹן
  choice: contra Rabá dos amonitas
  rationale: ‘Contra’ expressa a direção hostil no contexto militar; ‘dos amonitas’ comunica naturalmente a relação de Rabá com os filhos de Amom.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: o grito de guerra
  rationale: Expressa com clareza o forte brado ou sinal marcial, sem restringir indevidamente a natureza exata do som.
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: Ela se tornará um monte de ruínas desolado
  rationale: Preserva a imagem de תֵל como elevação formada por ruínas e a ideia de devastação de שְׁמָמָה.
- source_word: וּבְנֹתֶיהָ
  choice: suas cidades-filhas
  rationale: Mantém a metáfora hebraica e explicita que se trata das localidades subordinadas a Rabá.
- source_word: בָּאֵשׁ תִּצַּתְנָה
  choice: serão incendiadas
  rationale: Comunica de modo conciso e natural que as localidades serão entregues ao fogo.
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת יֹרְשָׁיו
  choice: Israel desapossará aqueles que o desapossaram
  rationale: Preserva tanto a inversão do domínio quanto o jogo de palavras produzido pela repetição da raiz ירש.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Distingue esta fórmula com אמר da fórmula anterior נְאֻם, sem criar diferença teológica entre ambas.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ representa o nome próprio e segue a convenção do projeto sem substituí-lo por um título.
- issue: Sufixo singular em יֹרְשָׁיו
  choice: o desapossaram
  alternative: os desapossaram
  rationale: O pronome singular preserva Israel como entidade coletiva singular, conforme a gramática hebraica.
- issue: Sentido recíproco e jogo verbal de ירש
  choice: desapossará aqueles que o desapossaram
  alternative: tomará posse dos que tomaram posse dele; expulsará os que o expulsaram
  rationale: A escolha conserva a reversão judicial anunciada e a repetição intencional da mesma raiz, sem decidir o texto em favor de uma formulação teológica mais específica sobre herança.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. As fórmulas proféticas foram diferenciadas como “declara Yahweh” e “diz Yahweh”. Os travessões integram essas fórmulas sem obscurecer a sintaxe. Todos os marcadores de nota aparecem no texto na ordem correspondente.
