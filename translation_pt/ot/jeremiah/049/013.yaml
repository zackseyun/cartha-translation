id: JER.49.13
reference: Jeremiah 49:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י בִ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּֽי לְ/שַׁמָּ֧ה לְ/חֶרְפָּ֛ה לְ/חֹ֥רֶב וְ/לִ/קְלָלָ֖ה תִּֽהְיֶ֣ה בָצְרָ֑ה וְ/כָל עָרֶ֥י/הָ תִהְיֶ֖ינָה לְ/חָרְב֥וֹת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: pt
  text: Pois jurei por mim mesmo — declara o SENHOR — que Bozra se tornará motivo de horror, objeto de desprezo, ruína e maldição; e todas as suas cidades se tornarão ruínas para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמָּה
  choice: motivo de horror
  rationale: Expressa o estado aterrador e desolador que causa espanto, evitando o sentido moderno de simples surpresa.
- source_word: חֶרְפָּה
  choice: objeto de desprezo
  rationale: Transmite a desonra pública e o escárnio implicados no termo hebraico.
- source_word: חֹרֶב
  choice: ruína
  rationale: Representa a devastação ou estado arruinado da cidade; distingue-se do plural חָרְבוֹת no fim sem impor uma diferença semântica excessiva.
- source_word: קְלָלָה
  choice: maldição
  rationale: Preserva diretamente a ideia de a cidade tornar-se exemplo ou fórmula de maldição.
- source_word: חָרְבוֹת עוֹלָם
  choice: ruínas para sempre
  rationale: Reproduz a duração indefinida/permanente da devastação em português natural.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o Tetragrama, em versaletes representados aqui por maiúsculas.
theological_decisions:
- issue: Juramento divino por si mesmo
  choice: jurei por mim mesmo
  alternative: jurei por minha própria vida
  rationale: O hebraico בִי significa literalmente “por mim”; a tradução preserva a força teológica do autojuramento sem acrescentar uma fórmula não explícita neste verso.
- issue: Duração das ruínas
  choice: ruínas para sempre
  alternative: ruínas perpétuas
  rationale: Mantém a força de עוֹלָם sem decidir se o contexto exige eternidade metafísica ou duração permanente/indefinida.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e compreensão internacional. A construção paralela conserva a sequência enfática dos quatro resultados anunciados contra Bozra.
