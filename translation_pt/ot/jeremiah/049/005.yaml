  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: pt
  text: Eis que vou trazer sobre você terror de todos os lados — declara o Senhor Yahweh dos Exércitos —; vocês serão dispersos, cada um seguindo adiante[a], sem que haja quem reúna o fugitivo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada um por seu caminho” ou “cada homem diante de si”. A frase hebraica é concisa e pode retratar uma fuga em pânico, na qual cada pessoa avança sem se importar com as demais.
    reason: lexical_alternative
  - marker: b
    text: Ou “o errante” ou “aquele que foge”.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי מֵבִיא
  choice: Eis que trarei
  rationale: A construção com הִנְנִי e particípio anuncia de modo solene e vívido uma ação iminente. “Eis que trarei” conserva a força profética em português natural.
- source_word: פַּחַד
  choice: terror
  rationale: No contexto de juízo, indica pavor intenso e desorientador, não apenas temor comum.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: declara o Senhor Yahweh dos Exércitos
  rationale: “Declara” comunica a fórmula profética נְאֻם; “Senhor Yahweh” distingue אֲדֹנָי do nome divino יְהוִה; “dos Exércitos” é a forma portuguesa tradicional e inteligível de צְבָאוֹת.
- source_word: מִכָּל סְבִיבַיִךְ
  choice: de todos os lados
  rationale: Expressa uma ameaça circundante, vinda de toda parte, em formulação idiomática portuguesa.
- source_word: וְנִדַּחְתֶּם
  choice: vocês serão dispersos
  rationale: O nifal de נדח pode indicar ser impelido para longe ou espalhado. “Serão dispersos” se ajusta à fuga coletiva seguida pela expressão distributiva.
- source_word: אִישׁ לְפָנָיו
  choice: cada um para a frente
  rationale: A frase hebraica é concisa e difícil. Esta formulação preserva o movimento individual de fuga sem definir indevidamente o referente pronominal.
- source_word: וְאֵין מְקַבֵּץ
  choice: sem que haja quem reúna
  rationale: Conserva a ideia de que ninguém tornará a ajuntar os dispersos e soa natural em português.
- source_word: לַנֹּדֵד
  choice: o fugitivo
  rationale: O particípio descreve quem foi lançado à errância ou está fugindo; “fugitivo” exprime bem o deslocamento forçado neste contexto.
theological_decisions:
- issue: Forma do nome divino יְהוָה após אֲדֹנָי
  choice: o Senhor Yahweh dos Exércitos
  alternative: o Soberano SENHOR dos Exércitos
  rationale: O texto contém tanto o título אֲדֹנָי quanto o nome próprio יְהוִה. “Senhor Yahweh” mantém ambos sem apagar o nome divino.
- issue: Mudança de número na pessoa interpelada
  choice: “sobre você” seguido de “vocês serão dispersos”
  alternative: uniformizar tudo no singular ou no plural
  rationale: O hebraico passa do sufixo feminino singular em עָלַיִךְ/סְבִיבַיִךְ para a forma verbal plural וְנִדַּחְתֶּם. A tradução preserva essa mudança, provavelmente entre a entidade coletiva personificada e seus integrantes.
- issue: Valor distributivo de אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: Aqui אִישׁ funciona distributivamente entre os membros do grupo. “Cada um” conserva o valor individual sem sugerir, além do que o contexto exige, que somente homens estejam em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre singular e plural foi mantida por refletir o hebraico. Os travessões destacam a fórmula profética sem alterar sua relação sintática com o anúncio.
