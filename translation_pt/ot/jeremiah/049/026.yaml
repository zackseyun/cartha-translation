  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה יִדַּ֨מּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: pt
  text: Por isso, os seus jovens cairão nas ruas[a], e todos os homens de guerra serão silenciados naquele dia[b], declara Yahweh dos Exércitos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas praças” ou “nos espaços abertos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “perecerão” ou “serão eliminados”. O verbo hebraico pode indicar ser silenciado, ficar imóvel ou ser levado à ruína.
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a inferência e a consequência introduzidas pela partícula hebraica.
- source_word: יִפְּלוּ
  choice: cairão
  rationale: Preserva a imagem hebraica comum para cair em combate, sem explicitar além do texto que serão mortos.
- source_word: בַחוּרֶיהָ
  choice: os seus jovens
  rationale: בָּחוּר designa normalmente homens jovens no vigor da idade, especialmente aptos para a guerra; o contexto deixa clara a referência masculina.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: nas ruas
  rationale: רְחוֹב pode indicar rua larga, praça ou espaço público; 'ruas' é natural no cenário urbano, e a nota preserva as alternativas.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Mantém de modo transparente a expressão hebraica para combatentes e sua referência masculina.
- source_word: יִדַּמּוּ
  choice: serão silenciados
  rationale: Preserva a imagem verbal, que pode denotar ficar em silêncio, ser reduzido à inércia ou perecer; a nota registra os sentidos contextuais mais fortes.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Forma idiomática em português para a expressão temporal profética.
- source_word: נְאֻם
  choice: declara
  rationale: Comunica com clareza a fórmula profética que autentica a palavra divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Torna transparente a força militar do título hebraico, especialmente apropriada neste contexto de guerra e juízo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh dos exércitos celestiais
  rationale: '''Dos Exércitos'' conserva a formulação e a força marcial do título sem especificar no texto quais exércitos estão em vista.'
- issue: Sentido de יִדַּמּוּ no contexto de juízo
  choice: serão silenciados
  alternative: perecerão; serão eliminados
  rationale: A escolha preserva a metáfora e a amplitude semântica do verbo, enquanto a nota reconhece que, neste contexto, o silêncio pode implicar morte ou ruína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das notas acompanha os respectivos elementos do versículo; o texto mantém o idioma militar e a ambiguidade de יִדַּמּוּ.
