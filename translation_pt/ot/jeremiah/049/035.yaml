  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Eis que quebrarei o arco de Elão, o principal de sua força.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a parte principal da força deles” ou “o sustentáculo de seu poder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional, clara e digna, que introduz o oráculo divino sem acrescentar conteúdo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo natural em português, mantendo sua amplitude militar e celestial.
- source_word: הִנְנִי שֹׁבֵר
  choice: Eis que quebrarei
  rationale: הִנְנִי com o particípio enfatiza a ação divina iminente e certa; o futuro em português exprime isso com naturalidade, enquanto “Eis que” conserva o destaque enfático.
- source_word: קֶשֶׁת עֵילָם
  choice: o arco de Elão
  rationale: Tradução literal da imagem militar; o arco representa concretamente a capacidade bélica pela qual Elão era conhecido.
- source_word: רֵאשִׁית גְּבוּרָתָם
  choice: a principal fonte do poder deles
  rationale: רֵאשִׁית indica aqui aquilo que ocupa o primeiro lugar, e גְּבוּרָה denota força ou poder, especialmente militar. “Principal fonte” torna clara a relação apositiva com o arco sem eliminar alternativas possíveis.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Valor temporal de הִנְנִי שֹׁבֵר
  choice: Eis que quebrarei
  alternative: Eis que estou quebrando
  rationale: A construção com הִנְנִי e particípio pode apresentar uma ação iminente ou firmemente determinada. O futuro português comunica melhor essa força no contexto profético, sem reduzir a certeza da ação.
translation_notes:
  register: Português moderno, dignificado e de ampla compreensão, com cadência profética tradicional. “Elão” segue a forma portuguesa consagrada; “deles” retoma coletivamente o povo de Elão.
