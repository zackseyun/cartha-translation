  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: pt
  text: Damasco perdeu as forças[a]; virou-se para fugir, e o tremor[b] apoderou-se dela. Angústia e dores de parto[c] a agarraram, como agarram uma mulher que está dando à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficou fraca» ou «perdeu a coragem». O verbo hebraico pode indicar perda de força ou de ânimo.
    reason: lexical_alternative
  - marker: b
    text: Ou «o terror apoderou-se dela». O substantivo hebraico designa mais literalmente tremor ou estremecimento, provavelmente provocado pelo medo.
    reason: lexical_alternative
  - marker: c
    text: Ou «dores» ou «padecimentos». O contexto do parto na comparação seguinte favorece «dores de parto».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: perdeu as forças
  rationale: Expressa o enfraquecimento ou a perda de coragem denotados por רפה, em português natural, sem definir se o colapso é sobretudo físico ou emocional.
- source_word: דַמֶּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: הִפְנְתָה לָנוּס
  choice: virou-se para fugir
  rationale: Conserva tanto o verbo de movimento הפנה, «virar-se», quanto a finalidade expressa pelo infinitivo נוס, «fugir».
- source_word: וְרֶטֶט
  choice: e o tremor
  rationale: רטט designa tremor ou estremecimento, provavelmente causado pelo medo; «tremor» preserva a imagem corporal sem substituí-la pela interpretação «terror».
- source_word: הֶחֱזִיקָה
  choice: apoderou-se dela
  rationale: Neste contexto, o hifil de חזק comunica que algo tomou firme posse dela; a formulação é idiomática em português.
- source_word: צָרָה
  choice: Angústia
  rationale: צָרָה pode significar aflição, aperto ou angústia; «angústia» combina com a intensidade da imagem seguinte.
- source_word: וַחֲבָלִים
  choice: e dores de parto
  rationale: Embora חבלים possa designar dores em sentido mais amplo, a comparação explícita com uma parturiente favorece o sentido obstétrico.
- source_word: אֲחָזַתָּה
  choice: a agarraram
  rationale: אחז significa agarrar ou apoderar-se. A concordância no plural reflete os dois sujeitos coordenados, «angústia e dores de parto», e o pronome mantém a personificação de Damasco.
- source_word: כַּיּוֹלֵדָה
  choice: como à mulher que está dando à luz
  rationale: O particípio de ילד retrata uma mulher no ato de dar à luz; esta formulação é clara e atual.
