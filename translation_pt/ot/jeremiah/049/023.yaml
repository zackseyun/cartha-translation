base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: pt
  text: 'A respeito de Damasco:


    Hamate e Arpade estão envergonhadas,

    pois ouviram uma má notícia;

    elas se derretem.

    Há ansiedade como o mar;

    ele não pode aquietar-se.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil: literalmente, “no mar, ansiedade; aquietar-se não pode”. A frase pode indicar que a ansiedade deles é como o mar agitado ou que há ansiedade no mar e que ele não pode ser acalmado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: A respeito de Damasco
  rationale: O לְ introduz o cabeçalho do oráculo. “A respeito de” preserva o sentido amplo da preposição sem acrescentar por si só a ideia mais específica de oposição.
- source_word: בּוֹשָׁה חֲמָת וְאַרְפָּד
  choice: Hamate e Arpade estão envergonhadas
  rationale: Embora o verbo esteja no feminino singular, os nomes das duas cidades formam um sujeito composto em estilo poético e oracular. O feminino concorda naturalmente com cidades em português, e “estão envergonhadas” expressa a desonra pública indicada pelo verbo.
- source_word: שְׁמֻעָה רָעָה
  choice: uma notícia ruim
  rationale: A expressão designa um relato de calamidade. A formulação é clara e atual, sem definir além do texto qual desastre foi anunciado.
- source_word: נָמֹגוּ
  choice: elas se derretem
  rationale: Mantém a imagem concreta de dissolver-se ou derreter-se, usada metaforicamente para a perda de coragem, sem substituí-la por uma interpretação explicativa.
- source_word: בַּיָּם דְּאָגָה
  choice: Há ansiedade como o mar
  rationale: Entende בַּיָּם como comparação poética com o mar inquieto, leitura coerente com a oração seguinte, mas registra em nota a dificuldade e a possibilidade locativa.
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: ele não consegue aquietar-se
  rationale: O pronome masculino retoma “o mar”, em conformidade com a forma masculina de יוּכָל. “Aquietar-se” conserva a imagem da impossibilidade de ficar calmo ou imóvel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes geográficos nas formas tradicionais “Hamate” e “Arpade”. A disposição em versos preserva o paralelismo poético. A imagem incomum de “derreter-se” foi mantida por fidelidade ao hebraico.
