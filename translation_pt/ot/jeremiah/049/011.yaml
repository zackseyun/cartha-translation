revisions:
- from: Deixe os seus filhos sem pai[a]; eu os manterei vivos. E que as suas viúvas confiem em mim.
  to: Deixe os seus órfãos de pai[a]; eu os manterei vivos. E que as suas viúvas confiem em mim.
  rationale: A única alteração substitui “filhos sem pai” por “órfãos de pai”, pois esta expressão atribui sem ambiguidade a condição de falta do pai aos vulneráveis mencionados, e não ao efeito da ordem “deixe”. Mantêm-se a força do imperativo, a ênfase de “eu”, a promessa de preservação da vida e a leitura exortativa de “confiem”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva a estrutura básica e a promessa divina: o imperativo עָזְבָה, a ênfase de אֲנִי, o sentido preservativo de אֲחַיֶּה e a confiança em Deus expressa por עָלַי תִּבְטָחוּ. Contudo, “Deixe os seus filhos sem pai” é sintaticamente ambíguo em português: pode sugerir que o destinatário deve deixar os próprios filhos sem pai, em vez de deixar aos cuidados de Deus os que já são pai-órfãos. A revisão elimina essa ambiguidade sem alterar o sentido.'
  naturalness: “Órfãos de pai” é uma formulação compreensível e suficientemente natural em registro bíblico moderno. “E que as suas viúvas confiem em mim” é claro, digno e conserva adequadamente a nuance volitiva possível do hebraico.
  terminology: “Órfãos de pai” preserva melhor que “filhos sem pai” a categoria social de יָתוֹם e evita sugerir necessariamente a perda de ambos os pais. “Viúvas” e “confiem em mim” são escolhas corretas e naturais.
