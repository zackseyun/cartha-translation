  text: עָזְבָ֥/ה יְתֹמֶ֖י/ךָ אֲנִ֣י אֲחַיֶּ֑ה וְ/אַלְמְנֹתֶ֖י/ךָ עָלַ֥/י תִּבְטָֽחוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: pt
  text: Deixe os seus órfãos de pai[a]; eu os manterei vivos. E que as suas viúvas confiem em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus órfãos”. O termo hebraico designa especificamente os que não têm pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְבָה
  choice: Deixe
  rationale: O imperativo qal masculino singular dirige-se diretamente a Edom. “Deixe” preserva tanto a força do comando quanto a possibilidade contextual de deixar para trás ou aos cuidados de alguém, sem intensificar para “abandone”.
- source_word: יְתֹמֶיךָ
  choice: os seus filhos sem pai
  rationale: יָתוֹם designa especialmente quem perdeu o pai. “Filhos sem pai” preserva essa categoria social e evita que “órfãos” seja entendido necessariamente como crianças sem ambos os pais.
- source_word: אֲנִי אֲחַיֶּה
  choice: eu os manterei vivos
  rationale: 'O pronome independente אֲנִי dá ênfase ao sujeito, e o piel de חיה tem sentido causativo ou preservativo: fazer viver, conservar com vida.'
- source_word: וְאַלְמְנֹתֶיךָ
  choice: E que as suas viúvas
  rationale: אַלְמָנָה significa “viúva”. A construção com o verbo seguinte admite naturalmente uma exortação ou permissão, expressa em português por “que”.
- source_word: עָלַי תִּבְטָחוּ
  choice: confiem em mim
  rationale: Com בטח, a preposição עַל indica aquele em quem se deposita confiança. “Confiar em” é a formulação natural em português, e o presente do subjuntivo preserva a nuance volitiva possível do imperfeito hebraico.
theological_decisions:
- issue: Identidade de quem fala e cuidado divino pelos sobreviventes vulneráveis
  choice: Manter a fala direta em primeira pessoa como promessa do SENHOR, sem inserir seu nome no versículo.
  alternative: Explicitar “eu, o SENHOR” ou entender a frase apenas como declaração genérica de proteção.
  rationale: No contexto, trata-se de um oráculo do SENHOR contra Edom. A primeira pessoa promete preservar os filhos sem pai e acolher a confiança das viúvas, mas o nome divino não deve ser acrescentado onde o hebraico deste versículo não o traz.
- issue: Valor modal de תִּבְטָחוּ
  choice: 'Traduzir como exortação: “que ... confiem”.'
  alternative: 'Traduzir como afirmação futura: “confiarão em mim”.'
  rationale: A forma verbal pode ser lida como imperfeito indicativo ou com força jussiva. O contexto e a coordenação favorecem a exortação, mas a tradução não amplia a frase para eliminar totalmente a tensão modal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A colocação de “eu” conserva a ênfase do pronome hebraico; “os seus” evita regionalismo excessivo e mantém clara a referência a Edom.
