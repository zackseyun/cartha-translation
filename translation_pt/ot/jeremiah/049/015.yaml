  text: כִּֽי הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֖וּי בָּ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: pt
  text: Pois eis que eu o tornei pequeno entre as nações, desprezado entre a humanidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois veja
  rationale: Preserva tanto a conexão explicativa de כִּי quanto a chamada enfática à atenção expressa por הִנֵּה, em português corrente.
- source_word: קָטֹן נְתַתִּיךָ
  choice: eu fiz de você pequeno
  rationale: Mantém a imagem concreta de pequenez e a ação divina expressa pelo verbo נָתַן, sem substituir a metáfora por uma interpretação como “insignificante”.
- source_word: בָּזוּי
  choice: desprezado
  rationale: Equivalente direto do particípio passivo, conservando o sentido de alguém tido em pouco valor.
- source_word: בָּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם é coletivo neste contexto; a formulação comunica humanidade em geral sem restringir o referente a homens adultos.
theological_decisions:
- issue: Agência divina na condição de Edom
  choice: eu fiz de você pequeno
  alternative: você é pequeno
  rationale: A primeira pessoa verbal de נְתַתִּיךָ atribui explicitamente a ação ao falante divino; omiti-la enfraqueceria a afirmação do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. O pronome “você” favorece ampla compreensão brasileira, enquanto “seres humanos” representa o valor coletivo de אָדָם.
