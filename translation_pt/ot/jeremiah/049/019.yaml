  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: pt
  text: Eis que, como um leão, ele subirá da mata cerrada do Jordão[a] contra uma pastagem segura. Pois, num instante, eu o farei fugir dela. E quem é o escolhido que estabelecerei sobre ela? Pois quem é como eu? Quem me convocará[b]? E quem é o pastor que poderá permanecer diante de mim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da majestade do Jordão” ou “do orgulho do Jordão”; trata-se de uma expressão hebraica que provavelmente se refere à vegetação densa às margens do rio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quem marcará um encontro comigo?”; a expressão também pode ter sentido jurídico: “quem me intimará?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz o anúncio com vivacidade e força dêitica; o plural inclusivo é natural em português para chamar a atenção dos ouvintes.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: Preserva diretamente a comparação do hebraico.
- source_word: יַעֲלֶה
  choice: ele subirá
  rationale: Mantém o movimento ascendente expresso por עלה e funciona naturalmente para o avanço do leão.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: da mata cerrada do Jordão
  rationale: No contexto desta expressão recorrente em Jeremias, גאון provavelmente designa a vegetação densa e exuberante junto ao Jordão, habitat de leões; a tradução literal alternativa é registrada em nota.
- source_word: נְוֵה אֵיתָן
  choice: uma pastagem segura
  rationale: נוה pode indicar pastagem ou morada, enquanto איתן comunica firmeza ou segurança; a escolha conserva tanto a imagem pastoril quanto a ideia de proteção.
- source_word: כִּי אַרְגִּיעָה
  choice: Pois, num instante
  rationale: Expressa o valor adverbial súbito da forma verbal sem impor ao português uma construção obscura.
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: eu o farei fugir dali
  rationale: Preserva a força causativa do verbo e deixa o pronome masculino referir-se ao invasor comparado ao leão, sem especificar além do hebraico.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: e nomearei sobre ela aquele que for escolhido
  rationale: A frase hebraica é comprimida; esta formulação conserva tanto a nomeação divina expressa por פקד quanto a noção de alguém escolhido em בָחוּר.
- source_word: מִי כָמוֹנִי
  choice: quem é como eu
  rationale: Traduz diretamente a fórmula retórica de incomparabilidade.
- source_word: וּמִי יוֹעִידֶנִּי
  choice: Quem me convocará
  rationale: יעד no Hifil pode significar marcar um encontro ou convocar, inclusive em sentido jurídico. 'Convocará' preserva a contestação retórica; outras nuances ficam na nota.
- source_word: רֹעֶה
  choice: pastor
  rationale: Mantém a metáfora pastoril literal, que pode representar um governante sem substituí-la por uma interpretação.
- source_word: יַעֲמֹד לְפָנַי
  choice: poderá permanecer diante de mim
  rationale: A pergunta retórica desafia a capacidade de qualquer pastor ou governante resistir diante do falante; 'poderá' torna essa força clara em português.
theological_decisions:
- issue: Identidade do falante nas declarações em primeira pessoa
  choice: Manter “eu/mim” sem acrescentar “o SENHOR” no versículo.
  alternative: Explicitar “o SENHOR” como sujeito.
  rationale: O contexto apresenta um oráculo divino, mas o próprio versículo fala na primeira pessoa sem repetir o nome divino. A tradução não acrescenta um sujeito ausente do texto.
- issue: Sentido metafórico de רֹעֶה
  choice: Conservar “pastor”.
  alternative: Traduzir interpretativamente por “governante” ou “líder”.
  rationale: Embora o pastor possa representar um governante, manter a imagem preserva a tensão poética e evita transformar a metáfora em uma identificação doutrinária ou política mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens do leão, da pastagem e do pastor. A sintaxe foi moderadamente ajustada para clareza, sem eliminar a ambiguidade lexical relevante, que é registrada nas notas.
