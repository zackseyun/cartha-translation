  text: וְ/הָיְתָ֨ה חָצ֜וֹר לִ/מְע֥וֹן תַּנִּ֛ים שְׁמָמָ֖ה עַד עוֹלָ֑ם לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: pt
  text: Hazor se tornará morada de chacais[a], uma desolação para sempre. Ninguém habitará ali, e nenhum ser humano residirá nela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «lugar de habitação de chacais».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «nenhum homem... nenhum filho de homem». As duas expressões indicam aqui que nenhum ser humano viverá no lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: No discurso profético, a forma apresenta o resultado futuro; «se tornará» também expressa a mudança de estado de Hazor.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nome próprio de lugar, transliterado na forma portuguesa consagrada.
- source_word: לִמְעוֹן
  choice: morada de
  rationale: מָעוֹן significa lugar de habitação. «Morada de» conserva a imagem com naturalidade e dignidade em português.
- source_word: תַּנִּים
  choice: chacais
  rationale: Nas fórmulas proféticas de ruína, o termo designa provavelmente chacais, animais associados a lugares abandonados.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Mantém a força nominal do hebraico e a fórmula profética de devastação.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente para duração indefinidamente contínua no contexto de juízo.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: Ninguém habitará ali
  rationale: אִישׁ tem aqui sentido humano genérico, e יָשַׁב indica habitar ou viver de modo estabelecido. A formulação comunica o sentido natural em português.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  choice: e nenhum ser humano residirá nela
  rationale: בֶּן־אָדָם funciona aqui como paralelo idiomático de אִישׁ, isto é, qualquer ser humano. «Resid poderá» preserva alguma distinção em relação a «habitará», pois גוּר pode indicar permanência ou residência, por vezes como forasteiro.
theological_decisions:
- issue: Linguagem masculina nas referências humanas da fórmula de juízo
  choice: Traduzir o sentido genérico como «ninguém» e «nenhum ser humano»
  alternative: «nenhum homem ... nenhum filho do homem»
  rationale: אִישׁ e בֶּן־אָדָם estão em paralelismo e designam genericamente qualquer pessoa, não apenas indivíduos do sexo masculino. A tradução natural evita que o português moderno restrinja indevidamente o alcance, enquanto a nota registra a forma literal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A pontuação divide a descrição da ruína da explicação paralela sobre a ausência de habitantes. Os dois marcadores de nota aparecem no texto principal.
