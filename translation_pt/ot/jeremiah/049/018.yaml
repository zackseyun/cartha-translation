  text: כְּֽ/מַהְפֵּכַ֞ת סְדֹ֧ם וַ/עֲמֹרָ֛ה וּ/שְׁכֵנֶ֖י/הָ אָמַ֣ר יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: pt
  text: Como na destruição de Sodoma e Gomorra e das cidades vizinhas[a] — diz Yahweh —, ninguém habitará ali, nem ser humano algum morará nela como estrangeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como quando Sodoma e Gomorra e as cidades ao redor delas foram destruídas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: Como na destruição de
  rationale: O prefixo כְּ estabelece comparação, e מַהְפֵּכָה designa uma destruição ou reviravolta catastrófica. A formulação preserva o símile e soa natural em português.
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: Sodoma e Gomorra e das cidades vizinhas
  rationale: שְׁכֵנֶיהָ refere-se aos lugares vizinhos associados a Sodoma e Gomorra; explicitar “cidades” comunica naturalmente o sentido contextual.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Mantém a fórmula profética no presente e translitera o nome divino expresso no texto hebraico.
- source_word: יֵשֵׁב
  choice: habitará
  rationale: No contexto de despovoamento, ישׁב significa morar ou habitar de modo estabelecido.
- source_word: אִישׁ
  choice: ninguém
  rationale: 'Embora o substantivo seja literalmente “homem”, nesta oração negativa ele tem sentido genérico: nenhuma pessoa habitará no lugar.'
- source_word: יָגוּר
  choice: residirá
  rationale: גור pode indicar permanência como hóspede, estrangeiro ou morador temporário. “Residirá” distingue o verbo de “habitará” sem recorrer ao pouco corrente “peregrinará”.
- source_word: בָּהּ
  choice: nela
  rationale: Preserva o sufixo feminino singular, provavelmente alusivo à cidade ou terra personificada.
- source_word: בֶּן אָדָם
  choice: ser humano algum
  rationale: A expressão hebraica significa aqui uma pessoa humana ou mortal, não um título messiânico. A construção portuguesa conserva o paralelismo negativo de forma clara.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico apresenta o Tetragrama; “Yahweh” preserva o nome próprio e segue a convenção indicada pelo material de consulta.
- issue: Sentido de בֶּן אָדָם na fórmula de desolação
  choice: ser humano algum
  alternative: nenhum filho do homem
  rationale: Neste contexto, a expressão é um idiomatismo antropológico genérico, não um título cristológico ou messiânico. A tradução idiomática evita uma associação indevida sem apagar a referência à humanidade.
- issue: Gênero de אִישׁ em referência genérica
  choice: ninguém
  alternative: nenhum homem
  rationale: O substantivo masculino singular exerce função genérica dentro de uma negação absoluta. “Ninguém” reproduz esse alcance em português moderno sem restringi-lo ao sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Habitará” mantém o tom profético; “residirá” preserva parcialmente a distinção entre ישׁב e גור. O pronome “nela” retém a referência feminina do hebraico. O único marcador de nota, [a], aparece no texto principal.
