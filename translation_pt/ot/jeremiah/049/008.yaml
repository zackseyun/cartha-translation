  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: pt
  text: Fujam, recuem, retirem-se para morar em lugares profundos, habitantes de Dedã, pois trarei sobre ele a calamidade de Esaú[b], no tempo em que eu o castigar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no tempo da minha visitação sobre ele”. Neste contexto, “visitação” refere-se ao juízo punitivo de Deus.'
    reason: lexical_alternative
  - marker: b
    text: “Esaú” representa aqui Edom, o povo descendente de Esaú.
    reason: cultural_note
lexical_decisions:
- source_word: נֻסוּ
  choice: Fujam
  rationale: Imperativo plural de נוס, uma ordem direta para escapar; “fujam” é claro e natural em contexto profético.
- source_word: הָפְנוּ
  choice: voltem para trás
  rationale: Imperativo plural de פנה, aqui no sentido de retirar-se ou voltar-se para longe do perigo; a formulação conserva a sequência enfática do hebraico.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: escondam-se em lugares profundos para morar
  rationale: A expressão indica retirar-se para lugares profundos, remotos ou inacessíveis. A tradução preserva a imagem espacial e comunica naturalmente sua finalidade protetora.
- source_word: יֹשְׁבֵי דְּדָן
  choice: habitantes de Dedã
  rationale: Tradução direta da construção nominal, em registro digno e corrente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das ordens anteriores e mantém a conexão própria do discurso profético.
- source_word: אֵיד עֵשָׂו
  choice: a sua calamidade
  rationale: אֵיד denota calamidade ou desastre; o possessivo retoma Esaú sem eliminar o nome expresso no texto.
- source_word: הֵבֵאתִי עָלָיו
  choice: trarei sobre Esaú
  rationale: O perfeito pode funcionar profeticamente, apresentando o juízo futuro como certo. Em português, o futuro torna clara a referência prospectiva exigida pelo contexto.
- source_word: עֵת פְּקַדְתִּיו
  choice: quando chegar o tempo de eu o castigar
  rationale: פקד, neste oráculo de juízo, tem sentido punitivo. A construção temporal portuguesa explicita naturalmente a relação entre o tempo designado e o castigo.
theological_decisions:
- issue: Sentido de פקד em um oráculo de juízo
  choice: castigar
  alternative: visitar
  rationale: O contexto é de calamidade divina contra Edom; “castigar” comunica o valor judicial do verbo, enquanto “visitar” seria ambíguo no português moderno.
- issue: Valor temporal do perfeito הֵבֵאתִי
  choice: 'futuro profético: “trarei”'
  alternative: “tenho trazido” ou “trouxe”
  rationale: O perfeito apresenta o acontecimento anunciado como certo. O futuro preserva essa certeza sem sugerir indevidamente que a calamidade já ocorreu.
- issue: Referente de “Esaú”
  choice: manter “Esaú” no texto
  alternative: substituir por “Edom”
  rationale: O hebraico diz “Esaú”; manter o nome preserva a metonímia bíblica e a tensão histórica, explicando seu referente em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A linguagem mantém o tom urgente e solene do oráculo, sem arcaísmos desnecessários. A imagem hebraica de buscar lugares profundos foi preservada de modo inteligível.
