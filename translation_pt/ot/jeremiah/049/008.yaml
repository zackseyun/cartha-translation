  verdict: revise
  source_fidelity: A tradução comunica corretamente as ordens de fuga, o recolhimento a lugares profundos, o destinatário (os habitantes de Dedã), a calamidade contra Esaú e o sentido punitivo de פקד. Contudo, “a sua calamidade” torna menos explícita a construção hebraica “a calamidade de Esaú”, e “escondam-se ... para morar” acrescenta de modo um pouco forte a ideia de esconder-se, que é apenas implicada pela expressão idiomática.
  naturalness: O texto é globalmente claro, mas “escondam-se em lugares profundos para morar” soa pesado em português contemporâneo. “Retirem-se para morar em lugares profundos” conserva a imagem e lê com maior fluidez. A formulação temporal também fica mais direta como “no tempo em que eu o castigar”.
  terminology: “Dedã”, “Esaú”, “calamidade” e “castigar” são adequados. Convém manter “Esaú” no texto e esclarecer a referência a Edom em nota. “Visitação” deve permanecer apenas como alternativa explicada, pois não é a opção mais transparente no português moderno.
  issues:
  - severity: medium
    issue: Possessivo ambíguo em “a sua calamidade”
    rationale: O hebraico diz literalmente “a calamidade de Esaú”. O possessivo pode ser entendido de modo menos preciso em português; explicitar “a calamidade de Esaú” preserva a construção e o referente.
  - severity: low
    issue: “Escondam-se ... para morar” é uma expansão interpretativa e pouco fluente
    rationale: A expressão hebraica manda aprofundar-se para habitar, com a noção de refúgio em lugares remotos. “Retirem-se para morar em lugares profundos” comunica essa ideia sem tornar explícito demais o ato de esconder-se.
  revised_text: Fujam, recuem, retirem-se para morar em lugares profundos, habitantes de Dedã, pois trarei sobre ele a calamidade de Esaú[b], no tempo em que eu o castigar.[a]
