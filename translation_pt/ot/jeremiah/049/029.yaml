  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: pt
  text: 'Tomarão suas tendas e seus rebanhos; levarão para si as cortinas das suas tendas, todos os seus bens e seus camelos. E gritarão contra eles[a]: “Terror por todos os lados!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção hebraica também pode ser entendida como um grito proferido sobre eles ou uma proclamação a respeito deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: suas tendas
  rationale: אֹהֶל designa normalmente uma tenda ou habitação móvel; “tendas” é a forma natural no contexto dos povos nômades mencionados.
- source_word: צֹאנָם
  choice: seus rebanhos
  rationale: צֹאן abrange coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; “rebanhos” preserva essa amplitude.
- source_word: יִקָּחוּ
  choice: tomarão
  rationale: Mantém o sentido básico de לקח; o contexto militar deixa claro que se trata de apropriação hostil.
- source_word: יְרִיעוֹתֵיהֶם
  choice: os panos de suas tendas
  rationale: יְרִיעָה pode indicar pano, painel ou cortina que compõe ou cobre uma tenda. A formulação esclarece o referente sem especificar indevidamente o material.
- source_word: כָּל־כְּלֵיהֶם
  choice: todos os seus bens
  rationale: כְּלִי pode designar objetos, utensílios, equipamentos ou pertences; na lista de despojos, “bens” comunica naturalmente o conjunto.
- source_word: וּגְמַלֵּיהֶם
  choice: e seus camelos
  rationale: Tradução direta do substantivo גָּמָל no plural com sufixo possessivo.
- source_word: יִשְׂאוּ לָהֶם
  choice: levarão para si
  rationale: נשא expressa levar ou carregar, e לָהֶם indica aqui apropriação em benefício próprio. “Levarão para si” conserva ambos os elementos.
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: gritarão contra eles
  rationale: קרא על pode significar clamar ou proclamar sobre, a respeito de ou contra alguém. O contexto de ataque favorece “contra eles”, enquanto a nota preserva a amplitude da construção.
- source_word: מָגוֹר מִסָּבִיב
  choice: Terror por todos os lados!
  rationale: A expressão recorrente em Jeremias descreve terror circundante; esta formulação é clara, forte e mantém seu caráter proverbial.
