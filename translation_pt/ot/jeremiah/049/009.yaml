  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: pt
  text: Se os que colhem uvas viessem a você, não deixariam uvas para a respiga? Se ladrões viessem de noite, destruiriam apenas o suficiente para si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo a segunda comparação como pergunta retórica: “Se ladrões viessem de noite, não destruiriam apenas até terem o bastante?” A expressão hebraica final é idiomática, literalmente “o bastante deles”.'
    reason: O hebraico permite que a segunda comparação seja lida em continuidade com a força retórica da primeira; a tradução principal conserva a forma afirmativa explícita do verbo hebraico.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz comparações hipotéticas e preserva a força condicional e retórica das duas orações.
- source_word: בֹּצְרִים
  choice: vindimadores
  rationale: Designa especificamente os que colhem uvas; mantém com precisão a imagem da vinha em português digno e corrente.
- source_word: בָּאוּ לָךְ
  choice: viessem até você
  rationale: Conserva o sentido básico de movimento em direção ao destinatário sem explicitar além do hebraico a hostilidade sugerida pelo contexto.
- source_word: לֹא יַשְׁאִירוּ עוֹלֵלוֹת
  choice: não deixariam algumas uvas para serem recolhidas?
  rationale: Expressa em linguagem compreensível as uvas remanescentes destinadas à respiga e torna clara a força da pergunta retórica.
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: ladrões viessem de noite
  rationale: Traduz diretamente o substantivo e preserva a nuance de furtividade noturna.
- source_word: הִשְׁחִיתוּ דַיָּם
  choice: não destruiriam apenas até terem o bastante?
  rationale: Mantém o sentido forte de שׁחת e comunica o idiomatismo דַיָּם, literalmente ligado ao que basta para eles; a forma interrogativa segue o paralelismo retórico provável.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vindimadores” preserva a especificidade agrícola; a expressão seguinte explica naturalmente o sentido de respiga. O paralelismo foi vertido como duas perguntas retóricas, sem ocultar na nota a alternativa declarativa.
