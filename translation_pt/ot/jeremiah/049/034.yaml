  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל עֵילָ֑ם בְּ/רֵאשִׁ֗ית מַלְכ֛וּת צִדְקִיָּ֥ה מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: pt
  text: 'A palavra de Yahweh que veio ao profeta Jeremias a respeito de Elão[a], no início do reinado de Zedequias, rei de Judá, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra Elão”. A preposição hebraica pode introduzir um oráculo dirigido a uma nação e, conforme o contexto, ser traduzida por “a respeito de” ou “contra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética tradicional e o peso de דָּבָר, enquanto verte o nome divino pessoal יְהוָה por “Yahweh”.
- source_word: הָיָה ... אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: veio ao profeta Jeremias
  rationale: Na fórmula de revelação profética, “veio” comunica naturalmente o hebraico הָיָה; a ordem portuguesa “ao profeta Jeremias” é fluente e retém explicitamente o título.
- source_word: אֶל עֵילָם
  choice: a respeito de Elão
  rationale: אֶל pode introduzir um oráculo dirigido à nação ou relativo a ela. A formulação neutra “a respeito de” evita antecipar no cabeçalho o caráter adversativo desenvolvido no contexto.
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: no início do reinado
  rationale: Expressa de modo natural o período inicial do governo real, sem confundir מַלְכוּת com o território do reino.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedequias, rei de Judá
  rationale: Emprega as formas portuguesas consagradas dos nomes e conserva a identificação real em aposição.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém de maneira transparente a fórmula que introduz o discurso divino no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o translitera em vez de substituí-lo por um título.
- issue: Força da preposição אֶל diante de Elão
  choice: a respeito de Elão
  alternative: contra Elão
  rationale: A preposição admite uma referência temática ou uma direção adversativa em títulos proféticos. O texto principal conserva a leitura mais neutra, e a nota registra a alternativa contextualmente possível.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas correntes em português. A abertura “Esta é” torna o cabeçalho natural sem alterar sua função, e a pontuação prepara o discurso que começa no versículo seguinte.
