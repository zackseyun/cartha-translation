id: JER.31.2
reference: Jeremiah 31:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה מָצָ֥א חֵן֙ בַּ/מִּדְבָּ֔ר עַ֖ם שְׂרִ֣ידֵי חָ֑רֶב הָל֥וֹךְ לְ/הַרְגִּיע֖/וֹ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: pt
  text: 'Assim diz Yahweh:

    “O povo que sobreviveu à espada

    encontrou favor no deserto;

    Israel[a], quando foi buscar descanso para ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele foi dar descanso a Israel”. A oração final em hebraico é difícil e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança por meio de uma transliteração amplamente reconhecível, em vez de substituí-lo por um título.
- source_word: מָצָא חֵן
  choice: encontrou favor
  rationale: Reproduz de modo natural o idioma hebraico de receber favor, sem acrescentar uma nuance teológica posterior.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português bíblico corrente, “deserto” pode designar a região erma ou inóspita evocada pelo termo hebraico, inclusive no contexto do êxodo.
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: o povo que sobreviveu à espada
  rationale: Expressa com clareza moderna a ideia de sobreviventes da guerra ou do juízo, mantendo a imagem hebraica da espada.
- source_word: הָלוֹךְ
  choice: quando foi
  rationale: O infinitivo absoluto tem função verbal ou adverbial numa oração sintaticamente difícil; esta formulação conserva a ideia de movimento sem impor um sujeito explícito além de Israel na construção portuguesa.
- source_word: לְהַרְגִּיעוֹ
  choice: buscar descanso para ele
  rationale: A forma causativa pode significar dar ou proporcionar descanso, e o sufixo masculino singular significa “ele”. A redação mantém tanto o movimento em direção ao descanso quanto a referência pronominal, sem resolver em excesso a sintaxe comprimida.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada do nome nacional; sua posição preserva a possibilidade de funcionar como identificação do povo mencionado ou como elemento da oração final.
theological_decisions:
- issue: Referente e sintaxe de הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל
  choice: “Israel, quando foi buscar descanso para ele”
  alternative: “quando ele foi dar descanso a Israel”
  rationale: 'A sequência hebraica é genuinamente difícil: o infinitivo absoluto, o infinitivo causativo com sufixo masculino singular e a posição final de “Israel” admitem mais de uma análise. O texto principal conserva a ordem e a tensão interpretativa, enquanto a nota registra uma leitura importante sem torná-la exclusiva.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Deserto” foi preferido a “região selvagem” por sua naturalidade e por preservar a ressonância do êxodo. A formulação incomum da última oração é deliberada, pois reflete uma ambiguidade real do hebraico; o marcador [a] aparece junto de “Israel”, onde a variação sintática se torna relevante.
