revisions:
- from: 'Assim diz Yahweh, que dá o sol para iluminar o dia e estabelece a ordem da lua e das estrelas para iluminarem a noite[a], que agita o mar, e as suas ondas rugem[b] — Yahweh dos Exércitos é o seu nome:'
  to: 'Assim diz Yahweh, que dá o sol como luz de dia e a lua e as estrelas, em sua ordem estabelecida, como luz de noite[a], que agita o mar, de modo que suas ondas rugem[b] — Yahweh dos Exércitos é o seu nome:'
  rationale: A revisão remove o verbo acrescentado «estabelece», preservando o particípio único «que dá» e tornando inteligível em português a relação entre a ordem estabelecida e a lua e as estrelas. Também expressa a segunda oração como resultado da ação sobre o mar, sem eliminar a alternativa lexical registrada em nota.
