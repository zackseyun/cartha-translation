  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְ/כוֹכָבִ֖ים לְ/א֣וֹר לָ֑יְלָה רֹגַ֤ע הַ/יָּם֙ וַ/יֶּהֱמ֣וּ גַלָּ֔י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: pt
  text: 'Assim diz Yahweh, que dá o sol como luz de dia e a lua e as estrelas, em sua ordem estabelecida, como luz de noite[a], que agita o mar, de modo que suas ondas rugem[b] — Yahweh dos Exércitos é o seu nome:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as leis fixas da lua e das estrelas”. O termo hebraico pode indicar estatutos ou uma ordem estabelecida; aqui se refere à regularidade dos corpos celestes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “acalma o mar”. Em outros contextos, o verbo hebraico pode ter esse sentido; aqui, porém, a afirmação de que suas ondas rugem favorece “agita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional em português e representa o nome divino como nome próprio.
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: que dá o sol para iluminar o dia
  rationale: Preserva o particípio, que descreve a ação contínua de Yahweh, e expressa de modo natural a função indicada por לְ.
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: estabelece a ordem da lua e das estrelas
  rationale: חֻקֹּת, plural, pode indicar decretos ou uma ordem estabelecida. O verbo 'estabelece' torna explícita em português a ação implícita na construção hebraica e evita a impressão de legislação dirigida aos astros.
- source_word: לְאוֹר לָיְלָה
  choice: para iluminarem a noite
  rationale: Reproduz o paralelismo funcional com o sol em português corrente.
- source_word: רֹגַע הַיָּם
  choice: que agita o mar
  rationale: Embora רֹגַע possa indicar acalmar em outros contextos, o rugido subsequente das ondas favorece aqui o sentido de agitar.
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: e as suas ondas rugem
  rationale: Conserva a coordenação do hebraico e traduz הָמָה por um verbo que comunica tanto o som quanto o tumulto das ondas.
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: Yahweh dos Exércitos é o seu nome
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título português consagrado, sem reduzi-lo apenas a exércitos humanos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de רֹגַע aplicado ao mar
  choice: agita o mar
  alternative: acalma o mar
  rationale: A oração imediatamente seguinte, segundo a qual as ondas rugem, favorece a ideia de agitação, embora a ambiguidade lexical seja registrada em nota.
- issue: Sentido cósmico de חֻקֹּת
  choice: a ordem da lua e das estrelas
  alternative: os decretos da lua e das estrelas
  rationale: No contexto, a expressão descreve a regularidade estabelecida dos corpos celestes; a alternativa mais formal permanece indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético, o título divino e a ambiguidade lexical relevante por meio de notas.
