id: JER.31.38
reference: Jeremiah 31:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: pt
  text: Eis que vêm dias — declara Yahweh — em que a cidade será reconstruída para Yahweh, desde a Torre de Hananel até o Portão da Esquina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será construída”; a forma passiva hebraica pode indicar construção ou reconstrução, embora o contexto de restauração favoreça “reconstruída”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força dêitica e solene que introduz o anúncio profético, em formulação ainda reconhecível no português bíblico moderno.
- source_word: יָמִים
  choice: vêm dias
  rationale: Reproduz de modo natural a expressão profética hebraica que anuncia um tempo futuro.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Transmite o caráter formal e autorizado da fórmula profética e preserva o nome divino.
- source_word: וְנִבְנְתָה
  choice: será reconstruída
  rationale: O nifal indica voz passiva; no contexto da restauração de Jerusalém, 'reconstruída' é a opção contextual mais provável, sem ocultar a possibilidade lexical mais ampla em nota.
- source_word: הָעִיר
  choice: a cidade
  rationale: Mantém o substantivo do hebraico sem explicitar 'Jerusalém', embora ela seja clara no contexto.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: O ל provavelmente expressa destinação, dedicação ou pertencimento; 'para' preserva bem essa amplitude em português.
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: desde a Torre de Hananel
  rationale: מן assinala o ponto inicial da extensão; o nome próprio é transliterado.
- source_word: שַׁעַר הַפִּנָּה
  choice: até o Portão da Esquina
  rationale: O português explicita 'até', implícito na construção de extensão iniciada por 'desde'; a expressão designa um portão específico da cidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; a transliteração 'Yahweh' preserva sua função em vez de substituí-lo por um título.
- issue: Sentido de לַיהוָה na reconstrução da cidade
  choice: para Yahweh
  alternative: a Yahweh
  rationale: A preposição pode indicar dedicação ou pertencimento. 'Para Yahweh' mantém esse sentido sem definir mais precisamente a relação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação profética em “Eis que”. A ordem foi ajustada naturalmente, e travessões demarcam a fórmula profética. Os topônimos funcionam como nomes próprios e recebem iniciais maiúsculas.
