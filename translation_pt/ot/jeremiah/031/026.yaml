  text: עַל זֹ֖את הֱקִיצֹ֣תִי וָ/אֶרְאֶ֑ה וּ/שְׁנָתִ֖/י עָ֥רְבָה לִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/026.yaml
  text: At this I awoke and looked[a], and my sleep was pleasant to me.
translation:
  language: pt
  text: Nisso, acordei e olhei, e meu sono foi agradável para mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e meu sono foi doce para mim”.'
    reason: Alternativa lexical mais literal para עָרְבָה לִי, que pode expressar tanto agrado quanto doçura.
lexical_decisions:
- source_word: עַל זֹאת
  choice: Nisso
  rationale: Expressa de modo natural o valor de ocasião ou estímulo da construção hebraica, preservando sua força dêitica sem impor uma relação causal explícita.
- source_word: הֱקִיצֹתִי
  choice: acordei
  rationale: Reproduz diretamente a forma ativa na primeira pessoa do singular, sem acrescentar a ideia passiva de que alguém o despertou.
- source_word: וָאֶרְאֶה
  choice: e olhei
  rationale: Embora ראה frequentemente signifique “ver”, após o despertar o sentido contextual de dirigir o olhar ou tomar consciência é expresso naturalmente por “olhei”, sem especificar um objeto ausente no hebraico.
- source_word: וּשְׁנָתִי
  choice: e meu sono
  rationale: “Sono” é o equivalente simples e corrente de שֵׁנָה em português moderno.
- source_word: עָרְבָה לִּי
  choice: tinha sido agradável para mim
  rationale: Comunica a experiência agradável indicada pelo verbo ערב. O mais-que-perfeito composto soa natural em português porque o sono antecedeu o despertar; a alternativa mais imagética “foi doce para mim” é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Nisso” mantém a concisão do hebraico; “olhei” conserva a ação sem acrescentar aquilo que o narrador teria visto.
