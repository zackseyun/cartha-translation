  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/כָרַתִּ֗י אֶת בֵּ֧ית יִשְׂרָאֵ֛ל וְ/אֶת בֵּ֥ית יְהוּדָ֖ה בְּרִ֥ית חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: pt
  text: Eis que vêm dias — declaração de Yahweh — quando farei uma nova aliança[a] com a casa de Israel e com a casa de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aliança renovada». O adjetivo hebraico significa mais naturalmente «nova», mas alguns intérpretes entendem «renovada» para ressaltar a continuidade da aliança.'
    reason: alternativa lexical e interpretativa
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz um anúncio que chama a atenção. O plural é natural em português ao dirigir-se à comunidade e preserva melhor a força dêitica do hebraico do que a forma arcaica «Eis».
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Preserva a expressão profética e a construção participial hebraica, em formulação clara e natural em português.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Mantém o peso da fórmula profética nominal נְאֻם e evita reduzi-la ao verbo mais genérico «diz».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְכָרַתִּי
  choice: farei
  rationale: O hebraico diz literalmente «cortarei», mas «fazer uma aliança» é o equivalente idiomático corrente em português, sem acrescentar a ideia mais específica de «estabelecer».
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a linguagem corporativa e pactual de «casa», em vez de nivelá-la para «povo» ou apenas «Israel».
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva o paralelismo com «casa de Israel» e a identidade corporativa expressa no original.
- source_word: בְּרִית חֲדָשָׁה
  choice: uma nova aliança
  rationale: «Aliança» é o equivalente estabelecido de בְּרִית, e חֲדָשָׁה significa mais naturalmente «nova». A leitura «renovada» é registrada em nota por envolver interpretação contextual e teológica.
theological_decisions:
- issue: Se חֲדָשָׁה deve ser traduzido como «nova» ou interpretado como «renovada» nas discussões sobre continuidade da aliança
  choice: nova aliança
  alternative: aliança renovada
  rationale: O valor lexical mais direto do adjetivo é «nova». «Renovada» pode expressar uma leitura de continuidade defendida por alguns intérpretes, mas não deve substituir no texto principal o sentido mais natural nem resolver silenciosamente a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vejam» funciona como chamada comunitária de atenção; os travessões destacam a fórmula profética sem tornar a frase pesada. O marcador [a] aparece no texto principal.
