  rationale: A revisão apenas reorganiza a sintaxe e a pontuação para que os agricultores e os que se deslocam com o rebanho sejam entendidos naturalmente como os habitantes de Judá e de suas cidades. Mantêm-se «nela», «agricultores» e a formulação não interpretativa para o grupo pastoral móvel.
