base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/024.yaml
  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
translation:
  language: pt
  text: 'Nela habitarão juntos Judá e todas as suas cidades: agricultores e os que se deslocam com o rebanho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastores que viajam com o rebanho”. O hebraico diz literalmente “e partirão/se deslocarão com o rebanho”, provavelmente em referência a grupos pastoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: habitarão nela
  rationale: O verbo יָשַׁב pode significar sentar-se, morar, permanecer ou estabelecer-se. No contexto da restauração, “habitarão” conserva o sentido de residência, e “nela” mantém a referência feminina expressa pelo sufixo hebraico sem substituir o vínculo anafórico por “ali”.
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: Judá e todas as suas cidades
  rationale: Judá designa aqui a região ou sua população coletivamente. Embora o sufixo hebraico seja masculino singular, “suas” é a forma portuguesa natural para relacionar as cidades a Judá.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Expressa habitação conjunta ou unida. A forma masculina plural concorda naturalmente com os grupos humanos abrangidos pela frase.
- source_word: אִכָּרִים
  choice: agricultores
  rationale: Designa os que cultivam o solo. “Agricultores” é atual, claro e mais amplo do que “lavradores”, sem recorrer a linguagem arcaica.
- source_word: וְנָסְעוּ בָּעֵדֶר
  choice: e os que se deslocam com o rebanho
  rationale: נָסַע indica partir, levantar acampamento, viajar ou deslocar-se; com עֵדֶר, descreve pessoas que acompanham animais em deslocamento. A formulação evita inserir “pastores”, termo plausível, mas não explícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Preserva-se “nela” para refletir o sufixo feminino hebraico e mantém-se a descrição dos que acompanham o rebanho sem explicitar indevidamente que sejam pastores.
