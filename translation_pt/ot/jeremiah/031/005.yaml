reference: Jeremiah 31:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ע֚וֹד תִּטְּעִ֣י כְרָמִ֔ים בְּ/הָרֵ֖י שֹֽׁמְר֑וֹן נָטְע֥וּ נֹטְעִ֖ים וְ/חִלֵּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: pt
  text: Mais uma vez você plantará vinhedos nos montes de Samaria; os plantadores plantarão e desfrutarão deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e os tornarão de uso comum”, expressão que se refere a usar ou desfrutar normalmente da produção dos vinhedos.
    reason: alternativa lexical
lexical_decisions:
- source_word: עוֹד
  choice: Mais uma vez
  rationale: No contexto de restauração, indica a retomada futura de uma atividade; a expressão é natural e preserva a ideia de renovação.
- source_word: תִּטְּעִי
  choice: você plantará
  rationale: O imperfeito qal na segunda pessoa feminina singular aponta para uma ação futura dirigida à figura feminina de Israel; em português, a forma verbal não marca gênero.
- source_word: כְרָמִים
  choice: vinhedos
  rationale: Equivalente corrente e claro para áreas plantadas com videiras.
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: nos montes de Samaria
  rationale: Preserva a imagem geográfica do hebraico e soa natural em português.
- source_word: נָטְעוּ נֹטְעִים
  choice: os plantadores plantarão
  rationale: Mantém a repetição da raiz hebraica e, pelo contexto, expressa a certeza da restauração futura.
- source_word: וְחִלֵּלוּ
  choice: e desfrutarão deles
  rationale: Transmite o sentido agrícola idiomático de pôr a produção em uso comum e desfrutá-la, sem sugerir profanação ritual; o pronome retoma os vinhedos sem acrescentar explicitamente “frutos” ao texto principal.
theological_decisions:
- issue: Destinatária da forma verbal feminina singular
  choice: Manter a segunda pessoa sem explicitar o nome da destinatária
  alternative: Repetir “virgem de Israel”, identificada no contexto anterior
  rationale: A gramática hebraica remete à personificação feminina de Israel, mas o versículo não repete o título; o português permite conservar a referência contextual sem explicitação.
- issue: Sentido de וְחִלֵּלוּ no contexto agrícola
  choice: Entender como desfrutar ou pôr em uso comum a produção dos vinhedos
  alternative: Traduzir literalmente como “profanar” ou “tornar profano”
  rationale: O contexto descreve a restauração da vida agrícola normal. A acepção cultual mais comum criaria aqui uma impressão enganosa e não comunicaria o uso idiomático.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “plantadores plantarão” foi mantida para refletir a construção enfática do hebraico; “montes” conserva a imagem geográfica tradicional sem soar arcaico.
