  text: וְ/יֵשׁ תִּקְוָ֥ה לְ/אַחֲרִיתֵ֖/ךְ נְאֻם יְהוָ֑ה וְ/שָׁ֥בוּ בָנִ֖ים לִ/גְבוּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/017.yaml
  text: There is hope for your future[a], declares Yahweh[b], and your children will return to their own territory.
translation:
  language: pt
  text: Há esperança para o seu futuro[a], declara Yahweh, e seus filhos voltarão para o território deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o seu fim” ou “para o seu desfecho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “seus filhos voltarão para a fronteira deles”. “Filhos” também pode ter aqui o sentido coletivo de “descendentes”, e o termo hebraico traduzido como “território” pode significar “fronteira” ou “limite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Há
  rationale: A construção existencial hebraica é expressa naturalmente em português por “há”; a conjunção inicial pode ser omitida sem perda do sentido neste versículo isolado.
- source_word: תִּקְוָה
  choice: esperança
  rationale: “Esperança” transmite de modo claro e contextual a expectativa positiva de restauração.
- source_word: לְאַחֲרִיתֵךְ
  choice: para o seu futuro
  rationale: אַחֲרִית pode indicar futuro, fim ou desfecho; “futuro” comunica naturalmente a orientação prospectiva da promessa, mantendo as demais possibilidades em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva o peso da fórmula profética e representa diretamente o nome divino.
- source_word: וְשָׁבוּ
  choice: voltarão
  rationale: O perfeito com waw tem aqui valor futuro no anúncio profético de restauração.
- source_word: בָנִים
  choice: seus filhos
  rationale: O substantivo masculino plural significa literalmente “filhos”, mas pode abranger os descendentes; a forma portuguesa é natural e preserva a imagem familiar do contexto.
- source_word: לִגְבוּלָם
  choice: para o território deles
  rationale: גְּבוּל pode significar limite, fronteira ou território; no contexto do retorno à terra, “território” evita sugerir que eles voltariam apenas até uma linha fronteiriça.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome próprio diretamente, sem substituir seu caráter nominal por um título.
- issue: Referente de בָנִים
  choice: filhos, com esclarecimento de que pode abranger descendentes
  alternative: descendentes; filhos homens
  rationale: O contexto fala dos filhos de Raquel em sentido coletivo. A tradução mantém a forma concreta do hebraico sem restringir indevidamente a promessa apenas aos homens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. Os travessões destacam naturalmente a fórmula profética sem alterar sua relação sintática com a promessa.
