  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: pt
  text: Toda a região — o vale dos cadáveres e das cinzas e todos os terrenos em terraços[a], até o vale do Cedrom[b] e até a esquina da Porta dos Cavalos, na direção do leste — será santa para Yahweh. Nunca mais será arrancada nem derrubada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “campos” ou “encostas”. O termo hebraico é difícil e tem sido entendido tradicionalmente como referência às áreas em terraços ao redor de Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: “Vale do Cedrom” também pode ser traduzido como “ribeiro do Cedrom”, pois o termo hebraico pode designar tanto um vale quanto um curso de água sazonal.
    reason: lexical_alternative
  - marker: c
    text: Ou “desarraigada nem demolida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵמֶק
  choice: o vale
  rationale: עֵמֶק designa normalmente um vale ou uma área baixa; “vale” é claro e adequado à descrição topográfica.
- source_word: הַפְּגָרִים
  choice: dos cadáveres
  rationale: פֶּגֶר se refere a corpos mortos. “Cadáveres” mantém de modo direto a imagem sombria de um local antes associado à impureza.
- source_word: הַדֶּשֶׁן
  choice: das cinzas
  rationale: Neste contexto, דֶּשֶׁן provavelmente indica cinzas acumuladas, ligadas ao descarte sacrificial ou de resíduos, e não simplesmente “gordura”.
- source_word: השרמות
  choice: os terrenos em terraços
  rationale: A forma hebraica é difícil. A tradução segue a compreensão topográfica tradicional de terrenos dispostos em terraços, mas registra alternativas em nota.
- source_word: נַחַל קִדְרוֹן
  choice: o vale do Cedrom
  rationale: נַחַל pode indicar tanto o curso de água sazonal quanto o vale por onde ele corre. “Vale do Cedrom” se ajusta bem à delimitação territorial e é natural em português.
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: a esquina da Porta dos Cavalos
  rationale: פִּנָּה significa “esquina”, “canto” ou “ângulo”; “esquina” comunica com clareza o ponto do limite urbano.
- source_word: מִזְרָחָה
  choice: na direção do leste
  rationale: O advérbio direcional indica orientação para o leste; a formulação é corrente em português moderno.
- source_word: קֹדֶשׁ לַיהוָה
  choice: será santa para Yahweh
  rationale: A expressão indica santidade e dedicação a Yahweh. A moldura “Toda a região” permite conservar naturalmente em português o predicado singular abrangendo toda a área descrita.
- source_word: לֹא יִנָּתֵשׁ
  choice: Nunca mais será arrancada
  rationale: נתשׁ no nifal significa ser arrancado ou desarraigado. “Arrancada” conserva a metáfora profética recorrente em Jeremias.
- source_word: וְלֹא יֵהָרֵס
  choice: nem derrubada
  rationale: הרס no nifal significa ser derrubado ou demolido. “Derrubada” é natural e mantém a imagem de destruição.
- source_word: עוֹד לְעוֹלָם
  choice: Nunca mais
  rationale: A combinação reforça uma negação permanente. “Nunca mais” expressa de forma idiomática tanto a ideia de não voltar a acontecer quanto sua duração definitiva.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Alcance da santificação
  choice: Toda a região descrita será santa para Yahweh
  alternative: Somente a cidade reconstruída propriamente dita será santa
  rationale: A sintaxe aplica o predicado קֹדֶשׁ לַיהוָה ao conjunto da área enumerada, inclusive lugares antes associados a cadáveres e cinzas. A tradução preserva essa reversão marcante sem restringir seu alcance.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A expressão introdutória “Toda a região” organiza a longa delimitação geográfica e mantém o predicado singular do hebraico sem diminuir a abrangência. “Terrenos em terraços” evita que “terraços” seja entendido como varandas de edifícios.
