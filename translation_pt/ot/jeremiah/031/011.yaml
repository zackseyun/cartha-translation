base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
translation:
  language: pt
  text: Pois Yahweh resgatou Jacó e o redimiu[a] da mão de alguém mais forte que Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o resgatou”. O verbo hebraico גאל é frequentemente associado à ação de um redentor em favor de um parente ou à libertação de alguém da aflição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a promessa no contexto e mantém uma ligação discursiva natural em português.
- source_word: פָדָה
  choice: resgatou
  rationale: Expressa libertação de perigo ou domínio mediante resgate, distinguindo este verbo do גאל paralelo sem criar categorias teológicas artificiais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome explicitamente usado no texto, sem substituí-lo interpretativamente por Israel.
- source_word: וּגְאָלוֹ
  choice: e o redimiu
  rationale: Representa o sufixo pronominal e traduz גאל com linguagem de redenção, preservando sua possível conotação de atuação como resgatador-redentor de um parente.
- source_word: מִיַּד
  choice: da mão de
  rationale: Conserva a metáfora hebraica de mão como poder ou domínio, que permanece clara em português.
- source_word: חָזָק מִמֶּנּוּ
  choice: alguém mais forte do que ele
  rationale: Explicita a comparação e preserva a referência pessoal singular, sem identificar além do que o texto permite.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Distinção entre פדה e גאל no paralelismo
  choice: resgatou ... redimiu
  alternative: redimiu ... resgatou; traduziu ambos por “resgatou” ou “redimiu”
  rationale: Dois verbos portugueses relacionados, mas distintos, preservam a textura lexical do hebraico sem impor uma diferença doutrinária rígida.
- issue: Referente de חָזָק מִמֶּנּוּ
  choice: alguém mais forte do que ele
  alternative: aquele que era forte demais para ele
  rationale: Mantém a comparação com Jacó e a indefinição do agente opressor presente na formulação hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem verbal evita repetição artificial, enquanto “da mão de” conserva a imagem hebraica. O marcador [a] aparece imediatamente após o termo ao qual se refere.
