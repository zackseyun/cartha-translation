base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: pt
  text: 'Até quando você continuará se esquivando, filha rebelde[a]? Pois Yahweh criou algo novo na terra[b]: uma mulher cercará um homem[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «filha infiel», «filha desviada» ou «filha inconstante». O hebraico descreve o afastamento e a infidelidade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «no país» ou «no território». Neste contexto, «a terra» provavelmente se refere à terra de Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'A frase final é difícil e muito debatida. Foi traduzida aqui de modo literal: «uma mulher cercará um homem». Entre as interpretações propostas estão: «uma mulher cortejará um homem», «a fraca vencerá o forte», uma mulher protegerá um homem, ou uma figura de Israel restaurado retornando a Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: continuará se esquivando
  rationale: O verbo חמק sugere desviar-se, escapar ou agir de modo evasivo. «Continuará se esquivando» é natural em português e preserva tanto a ideia de evasão quanto a continuidade implícita em «até quando», sem reduzir o sentido à mera indecisão.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: filha rebelde
  rationale: Em Jeremias, שׁוֹבֵבָה descreve desvio persistente e infidelidade à aliança. «Rebelde» comunica esse afastamento em linguagem atual; a nota registra alternativas possíveis.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da pergunta anterior.
- source_word: בָרָא
  choice: criou
  rationale: Preserva o qatal hebraico como ação completa, sem excluir a força de certeza profética no contexto.
- source_word: חֲדָשָׁה
  choice: algo novo
  rationale: O adjetivo feminino funciona substantivamente. «Algo novo» é idiomático e mantém aberta a natureza da novidade.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode indicar terra, país ou território. «Na terra» permanece natural e relativamente aberta; no contexto, pode referir-se especificamente à terra de Israel.
- source_word: נְקֵבָה
  choice: uma mulher
  rationale: Embora o termo denote literalmente uma pessoa do sexo feminino, «uma mulher» é a expressão natural neste contexto humano.
- source_word: תְּסוֹבֵב
  choice: cercará
  rationale: Mantém o sentido concreto básico de סבב, «rodear/cercar», sem adotar no texto principal uma das interpretações disputadas da cláusula.
- source_word: גָּבֶר
  choice: um homem
  rationale: É a tradução mais transparente; o termo pode trazer uma nuance de força, mas explicitá-la resolveria indevidamente a imagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da cláusula enigmática נְקֵבָה תְּסוֹבֵב גָּבֶר
  choice: Manter no texto a imagem lexical «uma mulher cercará um homem».
  alternative: «uma mulher cortejará um homem»; «a fraca vencerá o forte»; Israel retornará a Yahweh; «uma mulher protegerá um homem»
  rationale: As palavras individuais são relativamente claras, mas a relação figurada é muito debatida. A tradução não deve impor uma interpretação teológica específica.
- issue: Valor temporal de בָרָא no discurso profético
  choice: Traduzir pelo pretérito perfeito, «criou».
  alternative: «criará» ou «cria»
  rationale: O qatal favorece a apresentação da ação como completa, ainda que uma leitura de perfeito profético seja possível.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A segunda pessoa é expressa por «você», adequada ao português brasileiro corrente; o feminino singular do chamado profético é preservado. A imagem final permanece deliberadamente literal e ambígua.
