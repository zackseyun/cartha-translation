id: JER.31.30
reference: Jeremiah 31:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: pt
  text: Mas cada um morrerá por sua própria iniquidade; todo aquele que comer uvas verdes[a] ficará com os dentes embotados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uvas não maduras”. O termo hebraico se refere a uvas ainda não maduras e, por isso, azedas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: Introduz a correção contrastiva ao provérbio rejeitado no versículo anterior, com adversatividade natural em português.
- source_word: אִישׁ
  choice: cada um
  rationale: Expressa o valor distributivo do singular hebraico e a responsabilidade individual sem tornar o português pesado ou desnecessariamente marcado por gênero.
- source_word: בַּעֲוֺנוֹ
  choice: por sua própria iniquidade
  rationale: Preserva o sentido moral de עָוֹן, a relação causal indicada pelo contexto e o sufixo possessivo enfático.
- source_word: יָמוּת
  choice: morrerá
  rationale: O futuro simples comunica naturalmente a declaração profética.
- source_word: כָּל הָאָדָם
  choice: todo aquele
  rationale: Reproduz a força distributiva e genérica da construção, mantendo a concordância singular exigida pela continuação da frase.
- source_word: הָאֹכֵל
  choice: que comer
  rationale: Traduz o particípio substantivado como oração relativa e conserva o caráter proverbial da declaração.
- source_word: הַבֹּסֶר
  choice: uvas verdes
  rationale: בֹּסֶר designa uvas ainda não maduras e, portanto, azedas; “uvas verdes” é a formulação proverbial tradicional e inteligível em português.
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: ficará com os dentes embotados
  rationale: Comunica o efeito desagradável das uvas não maduras e preserva a imagem concreta do hebraico; a construção singular concorda naturalmente com “todo aquele”.
theological_decisions:
- issue: Responsabilidade individual e corporativa
  choice: O versículo afirma que cada indivíduo morrerá por sua própria iniquidade.
  alternative: Entender a frase apenas como repetição proverbial, sem ênfase teológica na responsabilidade pessoal.
  rationale: A sintaxe contrasta enfaticamente esta afirmação com o provérbio do versículo anterior. A tradução conserva a responsabilidade pessoal sem extrapolar para uma doutrina mais ampla nem negar outras dimensões bíblicas da responsabilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Iniquidade” mantém a densidade moral do hebraico; “dentes embotados” conserva a imagem proverbial tradicional, enquanto a sintaxe ao redor favorece a compreensão.
