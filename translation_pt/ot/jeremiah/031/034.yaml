  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: pt
  text: 'E ninguém mais ensinará seu próximo nem seu irmão,[a] dizendo: “Conheçam Yahweh”, pois todos eles me conhecerão, do menor ao maior — declara Yahweh. Pois perdoarei a iniquidade deles e não me lembrarei mais do pecado deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem ao seu próximo e cada homem ao seu irmão”. A forma masculina singular é usada distributivamente para os membros da comunidade da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְלַמְּדוּ ... עוֹד
  choice: ninguém mais ensinará
  rationale: O piel de למד significa “ensinar”, e לא ... עוד indica que a prática deixará de ocorrer. A construção com “ninguém mais” expressa em português natural a negação distributiva do hebraico.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou associado. “Próximo” preserva o sentido comunitário sem restringi-lo à amizade.
- source_word: אָחִיו
  choice: seu irmão
  rationale: אָח significa literalmente “irmão” e pode abranger parentesco ou solidariedade pactual; a tradução mantém a imagem familiar do texto.
- source_word: דְּעוּ אֶת־יְהוָה
  choice: Conheçam Yahweh
  rationale: O imperativo plural de ידע é mantido como “conheçam”, preservando sua amplitude cognitiva e relacional, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: כּוּלָּם יֵדְעוּ אוֹתִי
  choice: todos eles me conhecerão
  rationale: A tradução conserva o objeto pessoal “me” e não reduz o conhecimento a mera informação nem o expande para uma fórmula doutrinária específica.
- source_word: לְמִקְטַנָּם וְעַד גְּדוֹלָם
  choice: do menor ao maior
  rationale: A expressão funciona como merismo que inclui toda a comunidade. A forma concisa é natural em português e conserva os dois extremos do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם introduz uma fórmula profética solene; “declara” preserva essa força, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: אֶסְלַח לַעֲוֺנָם
  choice: perdoarei a iniquidade deles
  rationale: סלח é o verbo usual para o perdão divino. “Iniquidade” preserva o peso moral de עָוֹן e o distingue de חַטָּאת, traduzido em seguida como “pecado”.
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר עוֹד
  choice: não me lembrarei mais do seu pecado
  rationale: A formulação mantém a imagem antropomórfica de Deus não voltar a lembrar o pecado, sem a reinterpretar como simples esquecimento ou como uma explicação doutrinária.
theological_decisions:
- issue: Natureza de “conhecer” no contexto da aliança
  choice: Manter “conhecer” com sua abertura relacional e pactual
  alternative: “reconhecer”, “ter conhecimento de” ou explicitar “ter relacionamento salvador com”
  rationale: ידע com objeto pessoal possui profundidade relacional, mas o texto não deve ser estreitado a uma formulação doutrinária específica.
- issue: Linguagem distributiva masculina
  choice: Usar a formulação portuguesa natural “ninguém ... seu próximo nem seu irmão”, com nota sobre a forma hebraica
  alternative: “cada homem ao seu próximo e cada homem ao seu irmão”
  rationale: A tradução principal preserva “próximo” e “irmão” e comunica a distribuição individual sem produzir uma frase artificial em português; a nota registra explicitamente a repetição masculina do original.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração conserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Não se lembrar do pecado
  choice: Preservar literalmente a linguagem de não se lembrar mais
  alternative: “não levarei mais em conta” ou “esquecerei”
  rationale: A formulação mantém a imagem e a tensão teológica do hebraico, sem sugerir incapacidade cognitiva nem oferecer uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A pontuação favorece a leitura pública; o travessão destaca a fórmula profética sem alterar a estrutura do versículo.
