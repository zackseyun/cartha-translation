  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
translation:
  language: pt
  text: Naquele tempo — declara Yahweh —, serei Deus para todas as famílias[a] de Israel, e elas serão o meu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «clãs». O termo hebraico pode designar grupos de famílias extensas dentro de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português que mantém a referência profética a um período futuro.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética נְאֻם é bem representada por «declara», enquanto o nome divino יהוה é transliterado como «Yahweh».
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: serei o Deus
  rationale: Em português, o artigo definido torna natural a fórmula de aliança sem sugerir que Yahweh seja apenas um deus entre outros; a relação expressa pelo לְ é comunicada pelo complemento «de todas as famílias».
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: de todas as famílias de Israel
  rationale: מִשְׁפְּחוֹת pode designar famílias extensas ou clãs. «Famílias» é claro e corrente, e a alternativa é preservada em nota.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: e elas serão o meu povo
  rationale: Reproduz de modo idiomático a fórmula recíproca da aliança; o pronome feminino plural retoma naturalmente «famílias».
theological_decisions:
- issue: Formulação da aliança
  choice: serei o Deus de todas as famílias de Israel, e elas serão o meu povo
  alternative: serei Deus para todos os clãs de Israel, e eles serão um povo para mim
  rationale: A redação escolhida preserva a relação recíproca de pertencimento da fórmula hebraica em português natural, sem enfraquecer sua força nem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam a fórmula profética sem alterar a sintaxe ou o sentido.
