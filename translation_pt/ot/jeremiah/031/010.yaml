  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: pt
  text: 'Ouçam a palavra do SENHOR, ó nações, e anunciem-na nas terras costeiras distantes. Digam: “Aquele que espalhou Israel o reunirá e o guardará como o pastor guarda o seu rebanho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹיִם
  choice: ó nações
  rationale: Preserva o vocativo plural e o alcance internacional do anúncio profético em linguagem digna e corrente.
- source_word: אִיִּים
  choice: terras costeiras
  rationale: O termo pode designar ilhas ou regiões litorâneas; “terras costeiras” mantém a amplitude geográfica sem restringi-lo apenas a ilhas.
- source_word: מְזָרֵה
  choice: Aquele que espalhou
  rationale: O particípio hebraico identifica o agente pela ação; esta formulação natural preserva a relação entre o dispersar passado e o reunir futuro.
- source_word: יִשְׂרָאֵל ... יְקַבְּצֶנּוּ ... וּשְׁמָרוֹ
  choice: Israel o reunirá e o guardará
  rationale: Mantém Israel como antecedente coletivo dos sufixos masculinos singulares, sem converter a referência em plural.
- source_word: כְּרֹעֶה עֶדְרוֹ
  choice: como o pastor guarda o seu rebanho
  rationale: Explicita naturalmente em português o verbo elíptico na comparação, já fornecido pelo contexto imediato.
theological_decisions:
- issue: Identidade daquele que espalha e reúne Israel
  choice: Preservar a formulação indireta “Aquele que espalhou Israel”
  alternative: Explicitar “O SENHOR, que espalhou Israel”
  rationale: Embora o contexto identifique o agente com o SENHOR, o hebraico emprega um particípio substantivado; a tradução conserva essa forma e sua tensão retórica.
- issue: Referência pronominal a Israel
  choice: Usar os pronomes masculinos singulares “o”
  alternative: Verter coletivamente como “os reunirá” ou repetir “Israel”
  rationale: Os sufixos hebraicos estão no masculino singular e tratam Israel como uma unidade coletiva.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “SENHOR” representa o tetragrama יהוה conforme a convenção bíblica portuguesa. O paralelismo imperativo e a imagem pastoral foram preservados com sintaxe clara e digna.
