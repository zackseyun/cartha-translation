base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: pt
  text: não como a aliança que fiz com os seus pais, no dia em que os tomei pela mão para tirá-los da terra do Egito, a minha aliança, que eles mesmos quebraram, embora eu fosse o marido deles[a], declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “embora eu fosse senhor deles” ou “embora eu os governasse”. O verbo hebraico pode expressar tanto uma relação conjugal quanto senhorio ou domínio; a forma grega citada em Hebreus 8:9 reflete este último sentido.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: não como a aliança
  rationale: O prefixo כ marca comparação. A formulação é natural em português e preserva o sentido comparativo.
- source_word: כָּרַתִּי אֶת אֲבוֹתָם
  choice: que fiz com os seus pais
  rationale: O idioma hebraico literalmente fala em “cortar” uma aliança, mas “fazer uma aliança com” é a expressão corrente em português. “Pais” preserva a linguagem familiar e histórica do texto.
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: no dia em que os tomei pela mão
  rationale: Preserva a imagem concreta de Deus segurando-os pela mão, em linguagem portuguesa clara e digna.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: para tirá-los da terra do Egito
  rationale: Expressa diretamente o hifil de יצא e mantém a conhecida linguagem do êxodo.
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: a minha aliança, que eles mesmos quebraram
  rationale: “Eles mesmos” conserva a ênfase do pronome independente הֵמָּה; “quebraram” é idiomático para a violação de uma aliança.
- source_word: וְאָנֹכִי בָּעַלְתִּי בָם
  choice: embora eu fosse o marido deles
  rationale: A conjunção é entendida adversativamente, e o verbo בעל admite a imagem conjugal, coerente com a linguagem de aliança em Jeremias. A possível leitura de domínio é preservada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” representa a fórmula profética, enquanto “Yahweh” translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de בָּעַלְתִּי בָם na fórmula da aliança
  choice: embora eu fosse o marido deles
  alternative: embora eu fosse senhor sobre eles; embora eu os governasse
  rationale: O Texto Massorético sustenta naturalmente a metáfora conjugal, adequada ao contexto profético. Como o verbo também pode expressar senhorio ou domínio, e a forma grega citada em Hebreus 8:9 reflete esse outro sentido, a ambiguidade relevante é explicitada em nota, sem ser eliminada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a imagem concreta de tomar pela mão, a ênfase de “eles mesmos”, a metáfora conjugal e o nome divino Yahweh. Os travessões delimitam o aposto explicativo sem alterar a relação sintática do hebraico.
