source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: pt
  text: Eles virão chorando, e com súplicas por misericórdia[a] eu os conduzirei; eu os guiarei até ribeiros de água, por um caminho reto, no qual não tropeçarão. Pois sou pai de Israel, e Efraim é o meu primogênito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e com súplicas eu os conduzirei”.'
    reason: A expressão hebraica significa literalmente «com súplicas»; «por misericórdia» explicita o favor implorado, mas não é um substantivo separado no texto-fonte.
lexical_decisions:
- source_word: בִּבְכִי
  choice: chorando
  rationale: Expressa de modo natural em português a circunstância ou maneira indicada por ב, sem definir se o choro é de arrependimento, tristeza ou alegria.
- source_word: יָבֹאוּ
  choice: eles virão
  rationale: Equivalente direto e natural do verbo בוא neste anúncio futuro.
- source_word: וּבְתַחֲנוּנִים
  choice: e com súplicas por misericórdia
  rationale: תחנונים designa súplicas ou pedidos de favor; a formulação torna explícita a nuance relacional sem determinar o motivo do choro.
- source_word: אֹבִילֵם
  choice: eu os conduzirei
  rationale: O hifil de יבל comunica fazer avançar ou conduzir; 'conduzirei' preserva a iniciativa divina.
- source_word: אֹלִיכֵם
  choice: eu os guiarei
  rationale: O hifil de הלך indica fazer caminhar ou levar; 'guiarei' é natural e evita repetição sem apagar o movimento causativo.
- source_word: נַחֲלֵי מַיִם
  choice: ribeiros de água
  rationale: Representa canais ou cursos de água corrente com linguagem clara e digna, preservando a imagem de provisão vivificante.
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: por um caminho plano
  rationale: יָשָׁר pode caracterizar uma rota reta, nivelada e desimpedida. 'Caminho plano' se harmoniza com a explicação seguinte de que não tropeçarão.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: no qual não tropeçarão
  rationale: O pronome feminino retoma דֶּרֶךְ; a formulação conserva claramente essa relação.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: pois sou pai para Israel
  rationale: O qatal do verbo estativo afirma uma relação estabelecida; o presente evita sugerir que Deus só então se tornou pai de Israel.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: e Efraim é o meu primogênito
  rationale: בכור expressa a condição de primogênito, com suas implicações de posição e herança; a sintaxe portuguesa comunica naturalmente a predicação hebraica.
theological_decisions:
- issue: Natureza do choro e das súplicas do povo
  choice: A tradução não especifica se o choro é penitencial, triste ou alegre.
  alternative: Interpretar expressamente como choro de arrependimento ou como lágrimas de alegria pela restauração.
  rationale: O hebraico informa como eles virão, mas não identifica a causa emocional ou teológica das lágrimas.
- issue: Força de הָיִיתִי na declaração de paternidade
  choice: pois sou pai para Israel
  alternative: pois tenho sido pai para Israel
  rationale: O qatal estativo apresenta uma relação estabelecida no pronunciamento profético; uma formulação ingressiva como 'tornei-me' acrescentaria uma mudança temporal não expressa pela fonte.
- issue: Sentido de יָשָׁר na descrição do caminho
  choice: caminho plano
  alternative: caminho reto
  rationale: Ambos os sentidos pertencem ao campo semântico. O contexto de não tropeçar favorece aqui a ideia de uma rota nivelada e desimpedida, sem excluir sua retidão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; a pontuação divide o anúncio da restauração e sua base na paternidade divina. 'Ribeiros' preserva a imagem concreta sem soar excessivamente técnica.
