id: JER.31.8
reference: Jeremiah 31:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: pt
  text: Eis que eu os trago da terra do norte e os reunirei dos lugares mais distantes da terra[a]. Entre eles estarão pessoas cegas e pessoas com dificuldade para andar, mulheres grávidas e mulheres em trabalho de parto, todos juntos. Uma grande assembleia voltará para cá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos lugares mais distantes do país”; o hebraico אֶרֶץ pode significar “terra”, “país” ou “território”, conforme o contexto.
    reason: Alternativa lexical genuína para אֶרֶץ.
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém a fórmula profética que chama solenemente a atenção, em linguagem elevada, mas ainda reconhecível no português atual.
- source_word: מֵבִיא
  choice: eu os trago
  rationale: O particípio com הִנְנִי apresenta a ação divina como vívida, já em curso ou de realização certa; o presente preserva essa força.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Preserva a expressão geográfica sem identificá-la de modo mais específico com a Babilônia ou outra região.
- source_word: וְקִבַּצְתִּים
  choice: e os reunirei
  rationale: Reunir expressa naturalmente a ação de ajuntar novamente o povo disperso e mantém o futuro explícito da forma verbal.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: dos lugares mais distantes da terra
  rationale: Comunica as regiões remotas ou extremidades indicadas por יַרְכְּתֵי em português claro, preservando em nota a possível leitura de אֶרֶץ como 'país' ou 'território'.
- source_word: בָּם
  choice: Entre eles estarão
  rationale: Introduz com naturalidade os diferentes integrantes do grupo que retorna.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: pessoas cegas e pessoas com dificuldade para andar
  rationale: Expressa com clareza e respeito os dois grupos representativos, evitando termos portugueses antiquados ou pejorativos, sem apagar a referência à limitação de mobilidade.
- source_word: הָרָה וְיֹלֶדֶת
  choice: mulheres grávidas e mulheres em trabalho de parto
  rationale: Torna explícitas as formas femininas e transmite naturalmente tanto a gravidez quanto o ato iminente ou em curso de dar à luz.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Preserva a ênfase na participação conjunta desses integrantes no retorno.
- source_word: קָהָל גָּדוֹל
  choice: uma grande assembleia
  rationale: Mantém o sentido corporativo de קָהָל sem restringi-lo a uma instituição religiosa posterior.
- source_word: יָשׁוּבוּ הֵנָּה
  choice: voltará para cá
  rationale: Preserva tanto a ideia de retorno quanto a direção indicada por הֵנָּה, 'para cá'.
theological_decisions:
- issue: Inclusão das pessoas vulneráveis no povo restaurado
  choice: O texto menciona explicitamente pessoas cegas, pessoas com dificuldade para andar, grávidas e mulheres em trabalho de parto como integrantes do grupo que retorna.
  alternative: Entender a lista apenas como recurso retórico para indicar uma multidão numerosa.
  rationale: A construção hebraica apresenta esses grupos como realmente incluídos na comunidade reunida, ressaltando a abrangência da restauração sem acrescentar uma formulação doutrinária alheia ao versículo.
- issue: Alcance de אֶרֶץ em מִיַּרְכְּתֵי אָרֶץ
  choice: terra, em sentido geográfico amplo
  alternative: país ou território
  rationale: A linguagem de reunião desde regiões remotas favorece o sentido amplo, mas אֶרֶץ admite ambas as acepções; por isso, a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A formulação inclusiva e respeitosa para עִוֵּר וּפִסֵּחַ evita vocabulário hoje potencialmente depreciativo, enquanto conserva o sentido concreto. O marcador da nota foi colocado junto de “terra”, expressão à qual a nota efetivamente se refere.
