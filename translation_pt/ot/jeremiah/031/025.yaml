  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: pt
  text: Pois saciarei[a] a alma cansada e encherei toda alma abatida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revigorarei”. O verbo hebraico traz literalmente a ideia de dar de beber em abundância, até a plena satisfação.'
