lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da promessa anterior, preservando com naturalidade a força conectiva do hebraico.
- source_word: הִרְוֵיתִי
  choice: saciarei
  rationale: O hifil de רוה evoca dar de beber abundantemente, até satisfazer ou revigorar. “Saciarei” mantém a imagem de plena satisfação e, no contexto profético, exprime a ação divina assegurada.
- source_word: נֶפֶשׁ
  choice: alma
  rationale: No paralelismo poético, נֶפֶשׁ designa a pessoa em sua vida interior, sem necessariamente pressupor uma divisão técnica entre corpo e alma. “Alma” preserva o peso poético do original.
- source_word: עֲיֵפָה
  choice: cansada
  rationale: Descreve quem está exausto ou sem forças; “cansada” é claro, natural e suficientemente amplo em português.
- source_word: וְכָל
  choice: e toda
  rationale: Reproduz a conjunção e o quantificador distributivo do hebraico de modo natural.
- source_word: דָּאֲבָה
  choice: abatida
  rationale: דאב pode indicar definhar, sofrer ou estar tomado de tristeza. “Abatida” conserva a amplitude física e emocional e forma um paralelo natural com “cansada”.
- source_word: מִלֵּאתִי
  choice: encherei
  rationale: O piel de מלא significa encher ou tornar pleno. “Encherei” preserva a metáfora concreta de abundância e corresponde ao primeiro membro do paralelismo.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: “alma” nas duas ocorrências conceituais do paralelismo
  alternative: “pessoa”, “vida” ou “ser”
  rationale: “Alma” mantém a linguagem poética e a ideia da pessoa em sua vida interior, sem impor ao termo uma antropologia dualista técnica.
- issue: Valor temporal dos verbos no perfeito hebraico
  choice: 'Futuro em português: “saciarei” e “encherei”'
  alternative: 'Passado: “saciei” e “enchi”'
  rationale: Embora as formas hebraicas sejam perfeitas, o contexto é de promessa e permite entendê-las como ações futuras apresentadas como certas. O futuro comunica naturalmente essa função em português, sem negar a forma hebraica, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Alma” é usado em sentido integral e poético; “abatida” mantém aberta a dimensão física e emocional de דָּאֲבָה.
