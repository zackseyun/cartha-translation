id: JER.31.36
reference: Jeremiah 31:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: pt
  text: Se estas determinações fixas se afastarem da minha presença[a] — declara Yahweh —, também a descendência de Israel[b] deixará de ser uma nação diante de mim para sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estas leis”, “estes estatutos” ou “estes decretos”; no contexto, a expressão se refere à ordem fixa estabelecida para a criação.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a semente de Israel”, expressão coletiva que significa a descendência ou os descendentes de Israel.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “todos os dias”, expressão idiomática que indica continuidade duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: se afastarem
  rationale: Expressa a retirada de uma posição estabelecida sem afirmar, de modo mais forte, que as determinações deixariam de existir.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: estas determinações fixas
  rationale: No contexto imediato, refere-se à ordem estabelecida para o sol, a lua e o mar; “determinações fixas” comunica melhor essa ordem da criação do que uma formulação limitada à legislação humana.
- source_word: מִלְּפָנַי
  choice: da minha presença
  rationale: Reproduz de modo natural em português o idioma espacial e relacional hebraico, mantendo sua ligação com a expressão posterior “diante de mim”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e verte explicitamente o nome divino.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: a descendência de Israel
  rationale: Preserva o sentido coletivo singular de זֶרַע e soa natural em português.
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: deixará de ser uma nação
  rationale: Comunica diretamente a cessação da condição corporativa de Israel como nação.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Conserva a linguagem relacional do original e sua correspondência com a primeira ocorrência de לְפָנַי.
- source_word: כָּל הַיָּמִים
  choice: para sempre
  rationale: Verte naturalmente o idioma hebraico literal “todos os dias”, que neste contexto indica continuidade duradoura.
theological_decisions:
- issue: A continuidade da identidade corporativa de Israel
  choice: Manter a afirmação direta de que a descendência de Israel não deixará de ser uma nação diante de Yahweh enquanto perdurar a ordem estabelecida da criação
  alternative: Generalizar a promessa como mera continuidade espiritual ou não nacional
  rationale: O hebraico fala explicitamente da descendência de Israel e de sua condição de nação. A tradução conserva essa linguagem sem a encaixar em um sistema teológico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura condicional solene e o paralelismo entre “da minha presença” e “diante de mim” foram preservados sem rigidez excessiva.
