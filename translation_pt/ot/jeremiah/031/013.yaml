source:
  edition: WLC
  text: אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּ/מָח֔וֹל וּ/בַחֻרִ֥ים וּ/זְקֵנִ֖ים יַחְדָּ֑ו וְ/הָפַכְתִּ֨י אֶבְלָ֤/ם לְ/שָׂשׂוֹן֙ וְ/נִ֣חַמְתִּ֔י/ם וְ/שִׂמַּחְתִּ֖י/ם מִ/יגוֹנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: pt
  text: Então a jovem[a] se alegrará na dança, e os jovens e os idosos se alegrarão juntos. Transformarei o luto deles em alegria[c]; eu os consolarei e os alegrarei, tirando-os de sua tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a virgem” ou “a moça”. O singular hebraico provavelmente representa as jovens da comunidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “júbilo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca de modo conciso o resultado futuro das promessas de restauração no contexto.
- source_word: תִּשְׂמַח
  choice: se alegrará
  rationale: O imperfeito qal expressa a alegria futura e mantém a ligação lexical com a forma causativa posterior do mesmo verbo.
- source_word: בְּתוּלָה
  choice: a jovem
  rationale: O substantivo designa uma jovem em idade de casar e pode, conforme o contexto, ser vertido por 'virgem' ou 'moça'. O singular representativo do hebraico foi preservado.
- source_word: בְּמָחוֹל
  choice: na dança
  rationale: Preserva a imagem concreta da dança como âmbito e expressão da celebração.
- source_word: וּבַחֻרִים
  choice: os jovens
  rationale: Refere-se aos homens jovens, em contraste com os idosos; em português, o contexto permite a forma natural e concisa 'os jovens'.
- source_word: וּזְקֵנִים
  choice: os idosos
  rationale: O paralelo com os jovens favorece o sentido etário, e não o de uma função comunitária ou institucional.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Realça a participação conjunta das diferentes gerações.
- source_word: וְהָפַכְתִּי
  choice: Transformarei
  rationale: Expressa naturalmente a mudança de um estado em outro indicada pelo verbo hebraico.
- source_word: אֶבְלָם
  choice: o luto deles
  rationale: אֵבֶל indica luto ou lamentação ligados à perda, aqui em sentido pessoal e comunitário.
- source_word: לְשָׂשׂוֹן
  choice: em alegria
  rationale: שָׂשׂוֹן denota alegria intensa e celebrativa; 'alegria' forma um contraste claro e natural com 'luto'.
- source_word: וְנִחַמְתִּים
  choice: eu os consolarei
  rationale: O piel de נחם indica consolar pessoas depois de aflição ou perda.
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: e os alegrarei em lugar de sua tristeza
  rationale: A forma piel comunica que Deus lhes causa alegria; a expressão com מִן apresenta a tristeza como a condição da qual passam para a alegria. 'Em lugar de' torna essa relação idiomática em português sem apagar o contraste.
theological_decisions:
- issue: Singular representativo em בְּתוּלָה
  choice: Manter o singular 'a jovem' como figura representativa das jovens da comunidade restaurada.
  alternative: Traduzir no plural como 'as jovens' ou empregar 'a virgem'.
  rationale: O hebraico traz o singular, provavelmente com função representativa. 'A jovem' conserva essa forma e evita afirmar mais sobre a condição sexual da pessoa do que o termo necessariamente exige neste contexto.
- issue: Sentido de זְקֵנִים
  choice: Traduzir como 'idosos'.
  alternative: Traduzir como 'anciãos', possivelmente entendido como líderes comunitários.
  rationale: O contraste explícito com os jovens destaca a idade, não uma posição de autoridade.
- issue: Relação entre alegria e tristeza em מִיגוֹנָם
  choice: Verter como 'em lugar de sua tristeza'.
  alternative: Traduzir mais literalmente como 'de sua tristeza' ou temporalmente como 'depois de sua tristeza'.
  rationale: A construção descreve Deus fazendo o povo passar da tristeza para a alegria. A formulação escolhida comunica essa substituição sem definir rigidamente se a preposição tem nuance de origem, afastamento ou sucessão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura poética e os contrastes entre gerações, luto e alegria, tristeza e consolo foram preservados. A repetição de formas ligadas a 'alegrar' reflete a repetição da raiz שׂמח no hebraico.
