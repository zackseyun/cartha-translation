- from: Então a jovem[a] se alegrará na dança, e os jovens e os idosos[b], todos juntos. Transformarei o luto deles em alegria[c]; eu os consolarei e os alegrarei em lugar de sua tristeza.
  to: Então a jovem[a] se alegrará na dança, e os jovens e os idosos se alegrarão juntos. Transformarei o luto deles em alegria[c]; eu os consolarei e os alegrarei, tirando-os de sua tristeza.
