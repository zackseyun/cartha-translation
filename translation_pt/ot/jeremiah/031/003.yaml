id: JER.31.3
reference: Jeremiah 31:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: pt
  text: 'De longe, Yahweh apareceu a mim[a]:

    “Eu a amei com amor eterno;

    por isso, eu a atraí com amor leal[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “Há muito tempo, Yahweh apareceu a mim”. Algumas leituras contextuais antigas ou propostas entendem “a ele” em vez do “a mim” do texto massorético.
    reason: alternative_reading
  - marker: b
    text: “Amor leal” traduz o hebraico חֶסֶד, que pode indicar bondade constante e fidelidade, muitas vezes no contexto de uma aliança. A última frase também pode ser entendida como “por isso, continuei a demonstrar amor leal a você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: De longe
  rationale: Preserva a imagem de distância e pode modificar naturalmente “apareceu”. A possibilidade de sentido temporal (“há muito tempo”) é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: נִרְאָה לִי
  choice: apareceu a mim
  rationale: O nifal de ראה significa normalmente “aparecer/ser visto”; “apareceu a mim” é claro e idiomático, além de refletir o pronome de primeira pessoa do texto massorético.
- source_word: וְאַהֲבַת עוֹלָם
  choice: com amor eterno
  rationale: Expressa de modo natural a duração ilimitada ou permanente indicada por עוֹלָם, sem excluir a possibilidade secundária de um amor vindo de tempos antigos.
- source_word: אֲהַבְתִּיךְ
  choice: Eu a amei
  rationale: Mantém o valor perfeito do qatal e o objeto feminino singular, que no contexto é Israel personificada. “Amor eterno” comunica que esse amor passado não é apresentado como encerrado.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca de forma corrente e clara a consequência ou fundamento expresso pela locução hebraica.
- source_word: מְשַׁכְתִּיךְ
  choice: eu a atraí
  rationale: Conserva o sentido básico de משך, “puxar/atrair”, aqui entendido como atrair alguém para si, e mantém o objeto feminino singular.
- source_word: חָסֶד
  choice: amor leal
  rationale: Distingue חֶסֶד de אַהֲבָה e comunica amor constante, bondoso e fiel, frequentemente relacionado à aliança, sem tornar explícita uma noção mais estreita do que o termo exige.
theological_decisions:
- issue: Relação entre אַהֲבָה e חֶסֶד
  choice: 'Traduzir por expressões relacionadas, mas distintas: “amor” e “amor leal”.'
  alternative: Usar “amor” para ambos ou traduzir חֶסֶד por “fidelidade à aliança”.
  rationale: A distinção preserva a textura lexical do hebraico e o caráter fiel de חֶסֶד sem impor terminologia confessional.
- issue: Valor dos verbos perfeitos אֲהַבְתִּיךְ e מְשַׁכְתִּיךְ
  choice: Usar o pretérito perfeito, com a continuidade do primeiro ato indicada por “amor eterno”.
  alternative: Usar “tenho amado” e “tenho atraído”.
  rationale: Em português, as formas compostas sugerem ação repetida ou continuada e soam menos naturais nesta declaração. O pretérito perfeito mantém o aspecto retrospectivo, enquanto o contexto e “eterno” preservam sua relevância presente.
- issue: Sentido de משך com חֶסֶד
  choice: “atraí com amor leal”
  alternative: “continuei a demonstrar amor leal” ou “prolonguei meu amor leal”.
  rationale: O sentido básico de משך é “puxar/atrair”, mas a construção admite uma compreensão idiomática ligada a prolongar ou estender bondade. A tradução principal retém a imagem verbal; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A colocação pronominal e o feminino singular refletem Israel personificada no contexto. O paralelismo foi disposto em linhas, e cada nota está marcada no texto principal.
