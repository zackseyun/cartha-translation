review_pass:
  verdict: revise
  source_fidelity: O sentido geral e a sequência dos imperativos são preservados, incluindo a imagem do retorno por uma rota conhecida e a ambiguidade de שוב. Contudo, “Volte o coração para” não exprime de modo claro o hebraico שִׁתִי לִבֵּךְ (“dirige/fixa o coração em”), podendo sugerir que o coração retorna. “Marcos no caminho para você” também soa menos idiomático e torna imprecisa a função de צִיֻּנִים como marcos de estrada.
  naturalness: 'A revisão melhora a fluência em português moderno: “para si” transmite o dativo reflexivo hebraico sem a repetição coloquial de “para você”, e “Dirija seu coração” mantém a metáfora hebraica com sentido transparente. “O caminho que você percorreu” é mais natural que “o caminho por onde você foi”.'
  terminology: “Marcos de estrada” e “sinais de orientação” conservam prudentemente a distinção e o paralelismo entre צִיֻּנִים e o raro תַּמְרוּרִים, sem resolver de maneira excessiva a dificuldade lexical. “Virgem Israel” preserva a personificação feminina e o registro profético. “Volte” continua adequadamente aberto ao retorno geográfico e à restauração da aliança.
  issues:
  - severity: medium
    issue: “Volte o coração para a estrada” é semanticamente pouco preciso.
    rationale: O imperativo שִׁתִי significa pôr, fixar ou dirigir o coração/atenção à estrada; “voltar o coração” pode ser entendido como fazê-lo retornar e ecoa de forma confusa os imperativos seguintes de retorno.
  - severity: low
    issue: “Coloque marcos no caminho para você” é uma formulação menos natural e ligeiramente imprecisa.
    rationale: O hebraico pede que Israel estabeleça para si marcadores que assinalem a rota. “Marcos de estrada” identifica melhor a função dos objetos, e “para si” reproduz naturalmente o valor reflexivo.
