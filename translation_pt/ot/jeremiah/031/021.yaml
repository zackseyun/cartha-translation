  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: pt
  text: Coloque para si marcos de estrada[a]; ponha para si sinais de orientação[b]. Dirija seu coração para a estrada, o caminho que você percorreu. Volte, virgem Israel[c]; volte para estas suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sinais no caminho”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é raro; neste contexto, provavelmente se refere a sinais colocados ao longo da rota para orientar o caminho.
    reason: lexical_alternative
  - marker: c
    text: “Volte” pode indicar tanto o regresso do exílio quanto o retorno à fidelidade da aliança.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי ... צִיֻּנִים
  choice: Coloque marcos no caminho
  rationale: O imperativo feminino singular pede que Israel estabeleça sinais visíveis ao longo da rota. A expressão explicita naturalmente em português o contexto viário de צִיֻּנִים.
- source_word: שִׂמִי ... תַּמְרוּרִים
  choice: ponha sinais de orientação
  rationale: O termo תַּמְרוּרִים é raro, mas o paralelismo e o contexto da viagem favorecem a ideia de sinais que orientam o percurso, sem recorrer à possível associação lexical com amargura.
- source_word: שִׁתִי לִבֵּךְ
  choice: Volte o coração para
  rationale: Preserva a metáfora hebraica do coração como centro da atenção, vontade e orientação interior; 'volte ... para' comunica aqui o direcionamento, sem antecipar o imperativo posterior de retornar.
- source_word: לַמְסִלָּה
  choice: a estrada
  rationale: מְסִלָּה designa uma via preparada ou elevada. 'Estrada' é clara e corrente em português e se ajusta à imagem da jornada.
- source_word: דֶּרֶךְ הלכתי
  choice: o caminho por onde você foi
  rationale: Conserva a aposição explicativa entre a estrada e o caminho anteriormente percorrido, com formulação natural em português.
- source_word: שׁוּבִי
  choice: Volte
  rationale: O verbo שוב permite tanto a volta geográfica do exílio quanto a ideia de retorno à fidelidade da aliança. 'Volte' mantém ambas as possibilidades.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: virgem Israel
  rationale: Mantém a personificação profética da nação e a concordância feminina dos imperativos, sem transformar a expressão necessariamente em título formal.
- source_word: עָרַיִךְ אֵלֶּה
  choice: estas suas cidades
  rationale: Preserva tanto o demonstrativo quanto o sufixo possessivo, destacando as cidades de Israel como destino do retorno.
theological_decisions:
- issue: Natureza do retorno ordenado por שׁוּבִי
  choice: Traduzir por 'Volte', sem limitar o sentido ao regresso do exílio nem ao arrependimento espiritual.
  alternative: Arrependa-se; volte do exílio.
  rationale: As estradas, os marcos e as cidades apontam fortemente para um retorno geográfico, enquanto o uso profético de שוב também pode evocar restauração da fidelidade à aliança. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a sequência de imperativos dirigidos à Israel personificada no feminino, a metáfora do coração e a ambiguidade teológica de שוב.
