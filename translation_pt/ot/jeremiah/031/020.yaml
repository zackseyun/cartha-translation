source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: pt
  text: É Efraim um filho precioso para mim, uma criança em quem tenho prazer? Pois, sempre que falo dele[a], ainda me lembro dele com toda certeza. Por isso, meu íntimo se comove por ele[b]; certamente terei compaixão dele — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sempre que falo contra ele”. A expressão hebraica pode significar mais neutralmente “dele” ou “a respeito dele”; no contexto, “contra ele” pode aludir às palavras de juízo dirigidas a Efraim.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente, “minhas entranhas se agitam por ele”, expressão hebraica que comunica profunda emoção e compaixão; compare: “meu coração anseia por ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: É Efraim um filho precioso para mim
  rationale: Preserva a pergunta retórica e o sentido afetivo de יַקִּיר, que indica alguém precioso ou querido, sem reduzi-lo a uma posição honrosa.
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: uma criança em quem tenho prazer
  rationale: Expressa naturalmente a ideia do sintagma hebraico, uma criança que é objeto de prazer e deleite, sem introduzir a conotação moderna de comportamento 'divertido'.
- source_word: כִּי מִדֵּי דַבְּרִי בוֹ
  choice: Pois, sempre que falo dele
  rationale: A preposição בְּ permite o sentido neutro de falar de ou a respeito de alguém. O contexto também admite 'contra ele', especialmente à luz das palavras de juízo; essa possibilidade é preservada em nota.
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: ainda me lembro dele com toda certeza
  rationale: O infinitivo absoluto intensifica o verbo finito, enquanto עוֹד comunica continuidade. A formulação conserva tanto a ênfase quanto a persistência da lembrança.
- source_word: הָמוּ מֵעַי לוֹ
  choice: o meu íntimo se comove por ele
  rationale: Traduz de modo compreensível a metáfora corporal hebraica das entranhas agitadas por profunda emoção, mantendo algo de sua força sem soar grosseiro ou arcaico.
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: certamente terei compaixão dele
  rationale: A construção com infinitivo absoluto é enfática; 'certamente' transmite essa intensificação, e 'ter compaixão' corresponde ao campo afetivo de רחם.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama e traduz a fórmula profética com solenidade natural em português.
theological_decisions:
- issue: Referente e tom de Efraim
  choice: Efraim representa coletivamente o povo do reino do Norte, personificado como filho amado.
  alternative: Efraim entendido apenas como o ancestral tribal individual.
  rationale: O contexto de Jeremias 31 favorece o sentido coletivo e personificado. A tradução conserva simultaneamente a linguagem familiar, a lembrança persistente e a compaixão divina, sem apagar o pano de fundo do juízo.
- issue: Sentido de דַבְּרִי בוֹ
  choice: sempre que falo dele
  alternative: sempre que falo contra ele
  rationale: O hebraico não explicita necessariamente oposição; a leitura neutra é lexicalmente mais direta. Contudo, a leitura adversativa é plausível no contexto de repreensão e misericórdia e, por isso, aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem interrogativa inicial preserva a forma retórica do hebraico. As duas construções enfáticas foram vertidas de maneiras naturais, porém distintas, para evitar repetição mecânica. O nome divino foi transliterado como “Yahweh” em continuidade com a camada inglesa fornecida.
