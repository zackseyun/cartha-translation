  text: And the measuring line will go out farther[a], straight ahead to the hill of Gareb[b], and then it will turn toward Goah.
translation:
  language: pt
  text: E a linha de medir se estenderá ainda mais[a], seguindo em frente[b], até a colina de Garebe; então fará uma curva em direção a Goa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de novo”. O hebraico עוֹד pode significar “de novo” ou “ainda mais”; neste contexto de ampliação dos limites, o sentido espacial parece mais adequado.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “diante dele” ou “em frente a ele”. O referente exato do sufixo é inferido do contexto da descrição dos limites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: se estenderá
  rationale: No contexto profético e topográfico, o perfeito com waw descreve uma ação futura. “Se estenderá” expressa de modo natural o avanço da linha de medir.
- source_word: עוֹד
  choice: ainda mais
  rationale: Comunica a continuação espacial da medição, sem ocultar que o termo também pode significar “de novo”.
- source_word: קוה הַמִּדָּה
  choice: a linha de medir
  rationale: Preserva a imagem concreta de uma linha ou corda usada para demarcar limites, em linguagem clara e corrente.
- source_word: נֶגְדּוֹ
  choice: diante dela
  rationale: Mantém mais de perto o sentido da preposição com sufixo, sem identificar de maneira excessivamente categórica o referente contextual do pronome.
- source_word: עַל גִּבְעַת גָּרֵב
  choice: até a colina de Garebe
  rationale: Com o verbo de extensão, “até” indica naturalmente o ponto topográfico alcançado; o nome próprio é transliterado.
- source_word: וְנָסַב
  choice: então fará uma curva
  rationale: Em uma descrição de limites, o verbo indica mudança de direção ou contorno; “então” torna clara a sequência.
- source_word: גֹּעָתָה
  choice: em direção a Goa
  rationale: A terminação direcional hebraica é representada explicitamente por “em direção a”.
