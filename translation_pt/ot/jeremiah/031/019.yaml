source:
  edition: WLC
  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: pt
  text: Pois, depois que voltei[a], arrependi-me; e, depois que fui instruído, bati na coxa[b]. Fiquei envergonhado e também humilhado, porque carreguei a desonra da minha juventude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois que retornei, lamentei”. O hebraico distingue “voltar” (שׁוב) de “arrepender-se” ou “lamentar” (נחם).
    reason: lexical_alternative
  - marker: b
    text: Bater na coxa era um gesto hebraico de pesar, choque ou remorso.
    reason: cultural_note
  - marker: c
    text: Ou “o opróbrio da minha juventude”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: voltei
  rationale: O verbo שׁוב denota voltar ou retornar. A escolha preserva a distinção em relação a נחם, traduzido em seguida por “arrependi-me”.
- source_word: נִחַמְתִּי
  choice: arrependi-me
  rationale: No contexto penitencial, expressa pesar e mudança interior após a volta, com mais força moral que um simples “lamentei”.
- source_word: הִוָּדְעִי
  choice: fui instruído
  rationale: A forma nifal de ידע pode indicar ser levado a saber ou receber entendimento; “fui instruído” comunica naturalmente esse sentido passivo no contexto de correção.
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: bati na coxa
  rationale: Mantém o gesto corporal hebraico de pesar, choque ou remorso, explicado em nota para leitores modernos.
- source_word: בֹּשְׁתִּי
  choice: fiquei envergonhado
  rationale: Representa diretamente a experiência de vergonha expressa por בושׁ.
- source_word: נִכְלַמְתִּי
  choice: humilhado
  rationale: Distingue este verbo do anterior e conserva sua ideia intensificada de desonra e profundo constrangimento.
- source_word: נָשָׂאתִי
  choice: carreguei
  rationale: נשא descreve figuradamente levar ou suportar o peso da desonra; “carreguei” preserva essa imagem.
- source_word: חֶרְפַּת נְעוּרָי
  choice: a desonra da minha juventude
  rationale: חרפה pode indicar desonra, opróbrio ou vergonha. A formulação natural mantém o genitivo hebraico sem decidir se se trata da desonra sofrida ou causada na juventude.
- source_word: כִּי
  choice: Pois / porque
  rationale: A primeira ocorrência introduz uma explicação ligada ao contexto anterior; a segunda apresenta a razão da vergonha e humilhação.
theological_decisions:
- issue: Progressão penitencial na confissão de Efraim
  choice: Distinguir o ato de voltar do arrependimento subsequente
  alternative: Traduzir שׁוב também como “arrepender-se”, fazendo as duas expressões descreverem essencialmente a mesma experiência interior
  rationale: O hebraico emprega verbos diferentes, שׁוב e נחם. Preservar “voltei” e “arrependi-me” mantém a progressão e a tensão do texto sem impor categorias doutrinárias posteriores.
- issue: Referência da desonra da juventude
  choice: Manter a construção aberta como “a desonra da minha juventude”
  alternative: Explicitar como “a desonra causada pelos pecados da minha juventude” ou como “o opróbrio sofrido na juventude”
  rationale: A construção genitiva hebraica não especifica plenamente a relação. A tradução conserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “arrependi-me” mantém um tom bíblico moderado sem arcaísmo excessivo; “bati na coxa” conserva de modo claro o gesto concreto do original.
