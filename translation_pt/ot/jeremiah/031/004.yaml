  naturalness: «Eu a edificarei» é mais fluente no registro profético do que «edificarei você». «Virgem de Israel» é a forma portuguesa mais natural para o construto hebraico. «Sairá dançando com os que festejam» mantém a cena e soa natural sem perder o tom poético.
  terminology: «Edificar/edificada» preserva a repetição lexical hebraica melhor do que alternar com «reconstruir». «Virgem de Israel» mantém a metáfora sem interpretação doutrinária. «Tamborins» é uma equivalência contemporânea aceitável para תֻפַּיִךְ.
