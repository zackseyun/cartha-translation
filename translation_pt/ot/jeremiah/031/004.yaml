  text: ע֤וֹד אֶבְנֵ/ךְ֙ וְֽ/נִבְנֵ֔ית בְּתוּלַ֖ת יִשְׂרָאֵ֑ל ע֚וֹד תַּעְדִּ֣י תֻפַּ֔יִ/ךְ וְ/יָצָ֖את בִּ/מְח֥וֹל מְשַׂחֲקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: pt
  text: Mais uma vez eu a edificarei, e você será edificada[a], ó virgem de Israel[b]; mais uma vez você se enfeitará com seus tamborins e sairá dançando com os que festejam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “você será reconstruída”. O hebraico repete a mesma raiz: “eu a edificarei, e você será edificada”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “ó donzela de Israel”. Trata-se de uma forma metafórica de se dirigir a Israel no contexto de sua restauração.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “sairá na dança dos que festejam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: de novo
  rationale: Indica a renovação futura depois do juízo e é repetido nas duas partes do versículo, como no hebraico.
- source_word: אֶבְנֵךְ ... וְנִבְנֵית
  choice: edificarei você, e você será edificada
  rationale: Preserva a repetição da raiz בנה nas formas ativa e passiva. Embora “reconstruir” expresse bem o contexto de restauração, eliminaria parte do paralelismo verbal.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: ó virgem Israel
  rationale: Mantém diretamente a metáfora profética e torna explícito o vocativo mediante “ó”, sem transformar a imagem em explicação interpretativa.
- source_word: תַּעְדִּי
  choice: você se enfeitará
  rationale: Expressa o ato de adornar-se em linguagem atual e combina com a cena festiva.
- source_word: תֻפַּיִךְ
  choice: os seus tamborins
  rationale: Designa pequenos instrumentos de percussão usados em dança e celebração. “Tamborins” é atual e mais claro do que termos arcaicos como “adufes”.
- source_word: וְיָצָאת בִּמְחוֹל מְשַׂחֲקִים
  choice: e sairá para dançar com os que festejam
  rationale: Comunica naturalmente a saída para uma dança pública e comunitária. O particípio מְשַׂחֲקִים tem aqui sentido de alegria e celebração, não meramente de brincadeira.
theological_decisions:
- issue: A expressão metafórica “virgem Israel” em um oráculo de restauração
  choice: Conservar a metáfora como “ó virgem Israel”
  alternative: “ó donzela Israel” ou uma explicação como “Israel restaurada”
  rationale: A expressão descreve Israel poeticamente em uma identidade renovada, com pureza e alegria juvenis, mas a tradução não deve resolver a imagem convertendo-a numa afirmação doutrinária ou numa paráfrase explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” deixa claro o feminino indicado pelas formas hebraicas e evita a oscilação regional de “tu”. O paralelismo e a metáfora profética foram preservados, enquanto a última oração foi formulada de modo natural em português.
