source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: pt
  text: “Eis que vêm dias, declara Yahweh, em que semearei a casa de Israel e a casa de Judá com semente humana[a] e semente de animais.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente de ser humano”; a expressão se refere à descendência humana ou a seres humanos. Em paralelo com “semente de animais”, descreve o repovoamento com pessoas e animais, especialmente rebanhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força de chamada de atenção que introduz o anúncio profético, em uma forma consagrada e ainda compreensível em português.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de modo natural a fórmula profética de futuro sem acrescentar um artigo ausente no hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa claramente a fórmula profética e mantém o nome divino YHWH como Yahweh.
- source_word: וְזָרַעְתִּי
  choice: semearei
  rationale: Preserva a metáfora agrícola do verbo זרע, importante para a imagem de restauração e repovoamento.
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: a casa de Israel e a casa de Judá
  rationale: Mantém a expressão coletiva e pactual “casa de”, em vez de reduzi-la apenas aos nomes Israel e Judá.
- source_word: זֶרַע אָדָם
  choice: semente de seres humanos
  rationale: Preserva a imagem da semente e comunica que אָדָם tem sentido genérico, referente à humanidade, não apenas a homens do sexo masculino.
- source_word: וְזֶרַע בְּהֵמָה
  choice: e semente de animais
  rationale: Mantém o paralelismo com “semente de seres humanos”; o plural coletivo é natural em português e abrange os animais, especialmente os rebanhos, que voltariam a povoar a terra.
theological_decisions:
- issue: Metáfora da restauração e do repovoamento
  choice: 'Manter a metáfora literal: “semearei ... com semente de seres humanos e semente de animais”.'
  alternative: “Repovoarei Israel e Judá com pessoas e animais.”
  rationale: A formulação preserva a imagem agrícola e suas ressonâncias no livro de Jeremias, sem reduzir o texto a uma explicação nem acrescentar uma interpretação teológica.
- issue: Sentido genérico de אָדָם
  choice: “seres humanos”
  alternative: “homem” ou “humanidade”
  rationale: Neste contexto, אָדָם designa a espécie humana de modo genérico. “Seres humanos” evita uma leitura exclusivamente masculina e, ao mesmo tempo, permite conservar a construção paralela com a semente dos animais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Eis que” preserva o tom profético marcado; “semearei” mantém a metáfora original. A pontuação com aspas distingue o pronunciamento divino da fórmula intercalada “declara Yahweh”.
