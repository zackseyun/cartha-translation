review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a fórmula profética, o nome Yahweh, as duas expressões corporativas «casa de Israel» e «casa de Judá» e, sobretudo, a metáfora de semear. O hebraico emprega «semente de humano/ser humano» e «semente de animal», em paralelismo; «semente humana» comunica isso de modo mais direto em português, sem perder a imagem.
  naturalness: «Semente de seres humanos» é compreensível, mas é uma construção menos idiomática e pode sugerir semente pertencente a seres humanos. «Semente humana» é natural, concisa e mantém a referência genérica. A fala deve permanecer em uma única citação, pois «declara Yahweh» é uma fórmula intercalada, não a conclusão de uma fala seguida por outra.
  terminology: «Yahweh», «casa de Israel», «casa de Judá» e «semearei» são escolhas adequadas. «Semente humana» preserva o sentido genérico de אָדָם sem masculinizar indevidamente o referente e corresponde de perto ao paralelo «semente de animais».
  issues:
  - severity: low
    issue: Construção «semente de seres humanos»
    rationale: Embora semanticamente defensável, é pouco idiomática e menos precisa do que «semente humana» para representar o sintagma hebraico זֶרַע אָדָם.
  - severity: low
    issue: Aspas dividem indevidamente a declaração
    rationale: A fórmula «declara Yahweh» interrompe a mesma declaração profética; manter uma única citação melhora a pontuação e a legibilidade sem alterar o sentido.
  revised_text: “Eis que vêm dias, declara Yahweh, em que semearei a casa de Israel e a casa de Judá com semente humana[a] e semente de animais.”
  revised_footnotes:
