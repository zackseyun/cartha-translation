  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: pt
  text: 'Pois esta é a aliança que farei[a] com a casa de Israel depois daqueles dias — declara Yahweh: Porei[b] a minha lei[c] no íntimo deles e a escreverei no coração deles. Eu serei o Deus deles, e eles serão o meu povo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortarei uma aliança”, expressão idiomática hebraica que significa estabelecer ou fazer uma aliança.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico está formalmente no perfeito (“dei” ou “tenho dado”), mas, neste contexto profético, tem sentido futuro juntamente com as demais promessas do versículo.
    reason: lexical_alternative
  - marker: c
    text: Ou “a minha instrução”. O hebraico torah pode significar “lei” ou “instrução”; aqui, “lei” preserva o sentido pactual.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da promessa anterior com valor causal e explicativo natural em português.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Preserva o termo bíblico e pactual usual para a relação estabelecida por Yahweh com Israel.
- source_word: אֶכְרֹת
  choice: farei
  rationale: Traduz naturalmente o sentido da expressão idiomática hebraica que, literalmente, diz 'cortar uma aliança'.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão corporativa e pactual do hebraico, sem reduzi-la simplesmente a 'Israel'.
- source_word: אַחֲרֵי הַיָּמִים הָהֵם
  choice: depois daqueles dias
  rationale: Reprodução direta e natural da expressão temporal, sem especificar além do texto quais dias estão em vista.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Conserva o peso da fórmula profética e representa explicitamente o nome divino.
- source_word: נָתַתִּי ... תּוֹרָתִי בְּקִרְבָּם
  choice: Porei a minha lei no íntimo deles
  rationale: O perfeito verbal recebe valor futuro no contexto da sequência de promessas; 'no íntimo deles' expressa a localização interior em paralelo com o coração.
- source_word: תּוֹרָתִי
  choice: a minha lei
  rationale: Preserva a ressonância pactual de torah, enquanto a possibilidade lexical 'instrução' é registrada em nota.
- source_word: וְעַל לִבָּם אֶכְתֲּבֶנָּה
  choice: e a escreverei no coração deles
  rationale: Mantém a imagem da escrita interior e o pronome feminino que retoma 'lei'; o singular coletivo 'coração' acompanha de perto o hebraico.
- source_word: וְהָיִתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: Eu serei o Deus deles, e eles serão o meu povo
  rationale: Expressa com clareza e simetria a fórmula bilateral da relação pactual.
theological_decisions:
- issue: Valor temporal do perfeito נָתַתִּי em uma promessa de aliança futura
  choice: Porei
  alternative: pus / tenho posto
  rationale: 'A declaração está enquadrada por formas de sentido futuro: ''farei'', ''escreverei'', ''serei'' e ''serão''. O futuro conserva a coerência da sequência profética sem acrescentar uma interpretação teológica externa.'
- issue: Sentido de תּוֹרָה no contexto da nova aliança
  choice: lei
  alternative: instrução
  rationale: O contexto de aliança favorece 'lei' e mantém sua continuidade terminológica e canônica, embora o substantivo também possa significar 'instrução'.
- issue: Caráter interior de בְּקִרְבָּם
  choice: no íntimo deles
  alternative: no meio deles
  rationale: O paralelismo com 'no coração deles' indica interiorização, não apenas presença comunitária.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se as expressões bíblicas centrais “aliança”, “casa de Israel”, “coração” e o nome “Yahweh”. A pontuação destaca a fórmula profética sem tornar a frase excessivamente solene ou arcaica.
