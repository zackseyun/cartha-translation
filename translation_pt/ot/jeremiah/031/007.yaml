source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה רָנּ֤וּ לְ/יַֽעֲקֹב֙ שִׂמְחָ֔ה וְ/צַהֲל֖וּ בְּ/רֹ֣אשׁ הַ/גּוֹיִ֑ם הַשְׁמִ֤יעוּ הַֽלְלוּ֙ וְ/אִמְר֔וּ הוֹשַׁ֤ע יְהוָה֙ אֶֽת עַמְּ/ךָ֔ אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: pt
  text: 'Pois assim diz Yahweh:

    “Cantem de alegria por Jacó

    e gritem de alegria à frente das nações.[a]

    Proclamem, louvem e digam:

    ‘Salva, Yahweh, o teu povo,

    o remanescente de Israel!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil e literalmente significa “à cabeça das nações”. Também pode ser entendida como “entre as principais nações” ou “sobre a principal das nações”. Pode destacar a proeminência de Israel entre as nações ou indicar o caráter público da proclamação.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: רָנּוּ לְיַעֲקֹב שִׂמְחָה
  choice: Cantem de alegria por Jacó
  rationale: Expressa de modo natural o chamado a uma manifestação vocal, forte e jubilosa em favor de Jacó, sem perder a imagem do canto.
- source_word: וְצַהֲלוּ
  choice: e exultem
  rationale: Mantém a segunda ordem de celebração pública e intensa, em paralelo com o canto jubiloso.
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: à frente das nações
  rationale: Segue de perto a imagem espacial de רֹאשׁ, preservando a possibilidade de proeminência ou de proclamação pública diante das nações; a dificuldade da expressão é registrada em nota.
- source_word: הַשְׁמִיעוּ
  choice: Proclamem
  rationale: O hifil de שמע pede que a mensagem seja feita ouvir publicamente; “proclamem” comunica essa força em português corrente.
- source_word: הַלְלוּ
  choice: louvem
  rationale: Equivalente direto e natural do imperativo de הלל no contexto de celebração e culto.
- source_word: הוֹשַׁע
  choice: Salva
  rationale: Traduz diretamente o imperativo singular dirigido a Yahweh, conservando a forma de súplica.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Preserva a relação pactual e a segunda pessoa singular do texto hebraico.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: “Remanescente” é um termo profético estabelecido e transmite a ideia do grupo preservado ou sobrevivente de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não apenas um título; a transliteração preserva essa distinção.
- issue: Sentido de בְּרֹאשׁ הַגּוֹיִם
  choice: à frente das nações
  alternative: entre as principais nações; por causa daquele que é o principal das nações
  rationale: A expressão hebraica é compacta e admite mais de uma relação sintática e semântica. A tradução principal mantém a metáfora de “cabeça/frente”, enquanto a nota evita decidir silenciosamente entre destaque de Israel e cenário público da proclamação.
translation_notes:
  register: Português atual, digno e acessível, com formas verbais no plural dirigidas à comunidade e segunda pessoa singular na súplica a Yahweh. A disposição em linhas conserva o paralelismo poético sem tornar a linguagem artificial.
