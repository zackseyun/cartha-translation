    rationale: Embora comunique júbilo, não expressa claramente o ato audível de clamar ou gritar presente no imperativo hebraico e no paralelismo com רָנּוּ. “Gritem de alegria” preserva melhor a força vocal sem artificialidade.
  - severity: low
    issue: Formulação da alternativa na nota
    rationale: “Por causa daquele que é o principal das nações” introduz um referente singular masculino que não está expresso de forma segura na construção hebraica. É preferível registrar alternativas mais próximas da expressão, como “à cabeça das nações” e “sobre a principal das nações”, e explicar resumidamente a incerteza.
