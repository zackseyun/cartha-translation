  source_fidelity: A tradução conserva adequadamente a sequência de imperativos, o nome divino Yahweh, a súplica final e o termo profético “remanescente”. Contudo, וְצַהֲלוּ descreve mais especificamente uma exclamação jubilosa; “exultem” enfraquece essa dimensão vocal. A expressão בְּרֹאשׁ הַגּוֹיִם é realmente difícil e não deve ser resolvida de modo excessivamente interpretativo.
  naturalness: O português é claro e possui registro poético apropriado. “Gritem de alegria” é mais direto, atual e semanticamente próximo do que “exultem”. A nota pode formular o literal de modo mais idiomático em português sem reduzir a ambiguidade.
  terminology: “Yahweh”, “Jacó”, “o teu povo” e “o remanescente de Israel” são escolhas consistentes e apropriadas. Mantém-se “remanescente”, termo consolidado no discurso profético.
