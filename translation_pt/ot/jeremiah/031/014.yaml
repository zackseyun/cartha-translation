id: JER.31.14
reference: Jeremiah 31:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: pt
  text: Satisfarei os sacerdotes com fartura[a], e o meu povo ficará saciado com a minha bondade[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “satisfarei o apetite dos sacerdotes com gordura”, expressão que indica plena satisfação com provisão rica e abundante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o meu povo ficará saciado com a minha generosidade” ou “com as minhas coisas boas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: Satisfarei
  rationale: O piel de רוה expressa fazer alguém beber até se fartar e, por extensão, satisfazer plenamente. “Satisfarei” comunica de modo natural a provisão abundante do contexto.
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: נפש designa aqui, de modo idiomático, o apetite ou a própria pessoa. Em português corrente, tornar “os sacerdotes” objeto direto preserva o sentido sem a expressão pouco natural “a alma dos sacerdotes”.
- source_word: דָּשֶׁן
  choice: com fartura
  rationale: O termo denota literalmente gordura ou riqueza e, figuradamente, provisão rica e abundante. “Com fartura” conserva a imagem de plena abundância em português natural.
- source_word: וְעַמִּי
  choice: e o meu povo
  rationale: Reproduz diretamente o possessivo de aliança presente no hebraico.
- source_word: אֶת־טוּבִי
  choice: com a minha bondade
  rationale: טוב pode indicar bondade, generosidade, bens ou coisas boas. “Minha bondade” preserva tanto a benevolência divina quanto seus benefícios concretos.
- source_word: יִשְׂבָּעוּ
  choice: ficará saciado
  rationale: שבע significa ficar farto ou satisfeito. “Ficará saciado” mantém o campo semântico da alimentação e evita repetir “satisfarei”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נאם é uma fórmula profética de declaração. O nome divino é transliterado como “Yahweh”, conforme a orientação do projeto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome próprio hebraico e segue a orientação declarada do projeto, sem substituí-lo por um título.
- issue: Amplitude de טוּבִי
  choice: minha bondade
  alternative: meus bens; minha generosidade; minhas coisas boas
  rationale: A escolha mantém a possível referência simultânea ao caráter benéfico de Deus e às dádivas concretas que ele concede, sem restringir o texto a uma única dimensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Fartura” e “saciado” preservam a imagem hebraica de alimento abundante sem recorrer ao literalismo pouco natural de “gordura”. A ordem das notas segue os marcadores no texto.
