source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: pt
  text: 'Assim diz Yahweh:


    “Contenha sua voz do choro


    e seus olhos das lágrimas,


    pois há recompensa para o seu trabalho, declara Yahweh;


    eles voltarão da terra do inimigo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito implícito de “eles voltarão” são os filhos de Raquel, isto é, os exilados mencionados no contexto ao redor.
    reason: cross_reference
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional de mensageiro e verte diretamente o nome divino.
- source_word: מִנְעִי
  choice: Contenha
  rationale: Imperativo feminino singular dirigido a Raquel personificada; expressa refrear ou impedir sem perder a concisão.
- source_word: קוֹלֵךְ מִבֶּכִי
  choice: a sua voz para não chorar
  rationale: Mantém a imagem concreta da voz e comunica em português natural a ideia hebraica de afastá-la do choro.
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: e os seus olhos para não derramarem lágrimas
  rationale: Explicita de maneira idiomática a relação entre os olhos e as lágrimas, preservando o paralelismo corporal.
- source_word: כִּי יֵשׁ שָׂכָר
  choice: pois há recompensa
  rationale: שָׂכָר pode indicar salário, paga ou recompensa; 'recompensa' preserva a promessa de retribuição sem restringi-la a uma transação comercial.
- source_word: לִפְעֻלָּתֵךְ
  choice: para o seu trabalho
  rationale: '''Trabalho'' representa de modo amplo e natural פְעֻלָּה e mantém a referência ao esforço atribuído à interlocutora.'
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Formulação solene e corrente para a fórmula profética de afirmação.
- source_word: וְשָׁבוּ
  choice: e eles voltarão
  rationale: O perfeito com waw tem valor futuro no discurso profético; o pronome conserva o sujeito plural implícito sem identificá-lo dentro do texto.
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: da terra do inimigo
  rationale: Preserva a construção singular hebraica, que pode ter sentido coletivo ou genérico no contexto do exílio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' apresenta o nome da aliança diretamente, em vez de substituí-lo por um título.
- issue: Sujeito implícito de וְשָׁבוּ
  choice: eles voltarão
  alternative: seus filhos voltarão; os exilados voltarão
  rationale: O hebraico deixa o sujeito plural implícito. 'Eles' preserva essa concisão e não resolve no corpo do texto aquilo que o contexto identifica como os filhos de Raquel, isto é, os exilados.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O paralelismo poético foi mantido, mas as construções de afastamento com מִן foram expressas de modo idiomático. O tratamento feminino singular permanece perceptível pelo contexto e pelo possessivo, embora a morfologia portuguesa do imperativo não o marque.
