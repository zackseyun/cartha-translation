revisions:
- from: 'Assim diz Yahweh:

    “Contenha a sua voz para não chorar

    e os seus olhos para não derramarem lágrimas[a],

    pois há recompensa para o seu trabalho” — declara Yahweh —,

    “e eles voltarão da terra do inimigo.”[b]'
  to: 'Assim diz Yahweh:


    “Contenha sua voz do choro


    e seus olhos das lágrimas,


    pois há recompensa para o seu trabalho, declara Yahweh;


    eles voltarão da terra do inimigo.”[a]'
  rationale: A revisão apresenta o oráculo como uma única citação, conforme sua estrutura no hebraico, e elimina a nota lexical que apenas repete uma construção praticamente equivalente. A redação conserva a imagem hebraica da voz, dos olhos e das lágrimas, sem introduzir o verbo «derramar».
