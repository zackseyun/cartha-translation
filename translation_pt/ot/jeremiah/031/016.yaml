review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a fórmula profética, a ordem dirigida à figura feminina, a promessa de recompensa e o retorno futuro. Contudo, a divisão da fala em duas citações, com a fórmula «declara Yahweh» intercalada por travessões, cria uma estrutura gráfica menos fiel ao fluxo contínuo do hebraico. Uma formulação mais direta preserva melhor a unidade do oráculo.
  naturalness: O português é compreensível e de registro apropriado. «Contenha a sua voz para não chorar» e «os seus olhos para não derramarem lágrimas» são naturais, mas alongam e explicitam a construção hebraica. «Retenha sua voz do choro e seus olhos das lágrimas» é menos natural no uso moderno. «Contenha sua voz do choro e seus olhos das lágrimas» conserva a imagem e é conciso; porém «Pare de chorar» perderia a imagem corporal. Recomenda-se uma redação idiomática que mantenha essa imagem.
  terminology: «Yahweh», «recompensa», «trabalho» e «terra do inimigo» são escolhas adequadas. O sujeito de «voltarão» deve permanecer não especificado no texto principal; a nota contextual é apropriada.
  issues:
  - severity: low
    issue: Pontuação e segmentação indevidas da citação
    rationale: 'O hebraico apresenta um único pronunciamento: a ordem, a razão, a fórmula «declara Yahweh» e a consequência. Fechar aspas antes de «declara Yahweh» e reabri-las depois, além de usar travessões, pode sugerir duas falas distintas.'
  - severity: low
    issue: Explicitação verbal em «os seus olhos para não derramarem lágrimas»
    rationale: A explicitação é aceitável, mas acrescenta «derramarem», ausente do hebraico. Uma construção que mantenha «olhos» e «lágrimas» sem esse verbo preserva mais de perto o paralelismo.
