id: JER.31.28
reference: Jeremiah 31:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: pt
  text: E acontecerá que, assim como estive atento a eles para arrancar, derrubar, demolir, destruir e causar dano[a], também estarei atento a eles para construir e plantar — declaração de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «trazer calamidade». O verbo hebraico pode indicar causar calamidade ou dano como ato de juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Expressa a transição profética voltada para o futuro em português atual, sem recorrer à fórmula arcaica «e sucederá».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... também
  rationale: Preserva a comparação explícita e equilibrada entre o juízo passado e a restauração futura.
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: estive atento / estarei atento
  rationale: Comunica a atenção vigilante e deliberada de Yahweh tanto no juízo quanto na restauração, evitando a ideia de mera observação passiva.
- source_word: עֲלֵיהֶם
  choice: a eles
  rationale: Com «estar atento», esta regência é natural em português e mantém o mesmo referente nas duas metades do versículo.
- source_word: לִנְתוֹשׁ
  choice: arrancar
  rationale: Mantém a imagem agrícola de retirar pela raiz, retomada de modo positivo por «plantar».
- source_word: וְלִנְתוֹץ
  choice: derrubar
  rationale: Representa com naturalidade a ação destrutiva e permanece distinto do verbo seguinte.
- source_word: וְלַהֲרֹס
  choice: demolir
  rationale: Preserva a progressão retórica e distingue este verbo de «derrubar» e «destruir».
- source_word: וּלְהַאֲבִיד
  choice: destruir
  rationale: Traduz de forma direta e corrente o sentido causativo de אבד neste contexto.
- source_word: וּלְהָרֵעַ
  choice: causar dano
  rationale: Expressa a calamidade infligida em juízo sem sugerir que Yahweh pratique maldade moral; a amplitude lexical é indicada em nota.
- source_word: לִבְנוֹת וְלִנְטוֹעַ
  choice: construir e plantar
  rationale: Conserva as duas imagens complementares de restauração e o contraste com a série anterior de ações destrutivas.
- source_word: נְאֻם
  choice: declaração de
  rationale: Fórmula profética concisa e digna que apresenta as palavras anteriores como pronunciamento divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome pactual e segue a orientação editorial sem substituí-lo por um título.
- issue: A atenção divina no juízo e na restauração
  choice: Repetir «estive/estarei atento a eles» nas duas metades
  alternative: Usar «contra eles» no juízo e «por eles» na restauração
  rationale: 'A repetição preserva o paralelismo hebraico e sua tensão teológica: a mesma vigilância deliberada de Yahweh opera tanto no juízo quanto na restauração.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A sequência de cinco verbos foi mantida para conservar a força cumulativa do hebraico, e a construção paralela foi reproduzida sem suavizar o contraste entre juízo e restauração.
