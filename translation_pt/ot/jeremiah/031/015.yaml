  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Ouve-se uma voz em Ramá[a], lamento e choro amargo: Raquel chora por seus filhos. Ela se recusa a ser consolada a respeito de seus filhos, porque eles já não existem[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ramá era uma cidade ligada ao território de Benjamim. Raquel é retratada poeticamente como a matriarca que chora por seus descendentes.
    reason: cultural_note
  - marker: b
    text: 'Ou: “porque ele já não existe”. O hebraico emprega aqui uma forma singular, embora o contexto fale coletivamente dos filhos de Raquel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio, em correspondência direta com o tetragrama hebraico.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro com cadência digna e natural em português.
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: Ouve-se uma voz em Ramá
  rationale: Reproduz a construção passiva hebraica de modo idiomático e mantém a imagem da voz ouvida.
- source_word: נְהִי בְּכִי תַמְרוּרִים
  choice: lamento e choro amargo
  rationale: Distingue os termos de pranto e conserva a intensidade emocional da expressão hebraica.
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: Raquel chora por seus filhos
  rationale: Expressa de forma natural o luto de Raquel por seus descendentes; 'filhos' mantém a imagem familiar do texto.
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: Ela se recusa a ser consolada
  rationale: Mantém tanto a força da recusa quanto o valor passivo do infinitivo hebraico.
- source_word: כִּי אֵינֶנּוּ
  choice: porque eles já não existem
  rationale: Ajusta o número ao antecedente coletivo 'seus filhos' e comunica a ausência definitiva expressa pelo idioma hebraico, preservando em nota sua forma singular.
theological_decisions:
- issue: Número e referente de כִּי אֵינֶנּוּ após o coletivo 'seus filhos'
  choice: porque eles já não existem
  alternative: porque ele já não existe
  rationale: Embora a forma hebraica seja singular, o antecedente contextual é o coletivo 'filhos'. O plural torna o sentido contextual inteligível em português sem esconder a forma singular do original, registrada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A pontuação preserva o movimento poético: primeiro se ouve o lamento, depois Raquel é identificada como quem chora. Evitaram-se arcaísmos, sem atenuar a solenidade profética.'
