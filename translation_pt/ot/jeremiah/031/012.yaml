id: JER.31.12
reference: Jeremiah 31:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: pt
  text: Eles virão e gritarão de alegria no alto de Sião; afluirão[b] à bondade[a] de Yahweh — aos cereais, ao vinho novo, ao azeite novo e às crias do rebanho e do gado. A vida deles[c] será como um jardim bem regado, e nunca mais definharão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à abundância de Yahweh”. Aqui, “bondade” inclui os bens que ele proporciona, como mostra a lista seguinte.
    reason: lexical_alternative
  - marker: b
    text: Ou “fluirão”. O verbo hebraico retrata um movimento fluente em direção às bênçãos de Yahweh.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a alma deles”. Neste contexto, a expressão se refere à vida ou à pessoa inteira, não apenas ao aspecto imaterial do ser humano.'
    reason: lexical_alternative
  - marker: d
    text: Ou “não voltarão a se entristecer” ou “não mais se consumirão”. A expressão hebraica pode indicar uma tristeza que faz a pessoa definhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְרִנְּנוּ
  choice: Eles virão e gritarão de alegria
  rationale: Os perfeitos com conjunção têm sentido futuro no contexto profético. “Gritarão de alegria” comunica a jubilosa expressão vocal de רנן em português corrente.
- source_word: בִמְרוֹם צִיּוֹן
  choice: no alto de Sião
  rationale: מָרוֹם está no singular e designa o lugar elevado de Sião; “no alto” é próximo do hebraico e natural em português.
- source_word: וְנָהֲרוּ
  choice: afluirão
  rationale: O verbo retrata movimento semelhante ao fluxo de uma corrente em direção a algo. “Afluirão” preserva tanto a ideia de movimento convergente quanto a imagem de fluxo.
- source_word: אֶל טוּב יְהוָה
  choice: à bondade de Yahweh
  rationale: טוּב pode indicar tanto bondade quanto a abundância que ela proporciona. A formulação mantém a qualidade divina em primeiro plano, enquanto a lista seguinte explicita suas dádivas concretas.
- source_word: עַל דָּגָן וְעַל תִּירֹשׁ וְעַל יִצְהָר
  choice: aos cereais, ao vinho novo e ao azeite fresco
  rationale: A repetição de עַל introduz os bens que manifestam a bondade de Yahweh. “Cereais” expressa o valor coletivo de דָּגָן; תִּירוֹשׁ é vinho novo, e יִצְהָר refere-se a azeite recém-produzido.
- source_word: בְּנֵי צֹאן וּבָקָר
  choice: às crias das ovelhas e do gado
  rationale: בְּנֵי, literalmente “filhos de”, aponta para os animais jovens. A tradução evita reduzir o sentido apenas a cordeiros e bezerros, embora sejam os referentes mais prováveis.
- source_word: וְהָיְתָה נַפְשָׁם
  choice: A vida deles será
  rationale: נֶפֶשׁ aqui designa a vida ou a pessoa inteira, não apenas uma suposta parte imaterial. “A vida deles” preserva o sentido integral e se ajusta à imagem de florescimento.
- source_word: כְּגַן רָוֶה
  choice: como um jardim bem regado
  rationale: רָוֶה descreve algo abundantemente irrigado ou saciado de água; “bem regado” é idiomático e conserva a imagem de vitalidade.
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  choice: e nunca mais definharão
  rationale: A construção significa que isso não voltará a acontecer. דָּאַב pode expressar tristeza, abatimento ou o definhar causado pela aflição; “definharão” preserva sua dimensão física e emocional.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título, sem acrescentar uma interpretação denominacional.
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma; a própria pessoa
  rationale: Neste contexto, o termo abrange a vida ou o ser inteiro. “Vida” evita impor uma dicotomia entre corpo e alma que o verso não formula.
- issue: Alcance de טוּב יהוה
  choice: bondade de Yahweh
  alternative: abundância de Yahweh
  rationale: A expressão pode designar a bondade divina e, por extensão, os bens que ela concede. O texto principal mantém essa tensão, e a nota registra o sentido concreto favorecido pela lista seguinte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe poética foi preservada sem rigidez excessiva; o ponto e vírgula e os dois-pontos esclarecem a progressão entre chegada, afluência e enumeração das dádivas.
