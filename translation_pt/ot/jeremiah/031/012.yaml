    rationale: צֹאן designa coletivamente o rebanho de pequenos animais, podendo abranger mais do que ovelhas. «Crias do rebanho e do gado» conserva a amplitude do hebraico.
  - severity: low
    issue: A nota b traz «correrão como uma corrente» como alternativa.
    rationale: A formulação explica a metáfora, mas não constitui uma alternativa de tradução suficientemente direta para וְנָהֲרוּ. «Fluirão» preserva melhor a imagem verbal.
  - severity: low
    issue: «Azeite fresco» é menos preciso e menos natural como designação de יִצְהָר.
    rationale: «Azeite novo» comunica de modo mais transparente o produto recém-obtido pressuposto pelo termo no tríplice elenco agrícola.
