  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִ/לְ/מַ֔עְלָ/ה וְ/יֵחָקְר֥וּ מֽוֹסְדֵי אֶ֖רֶץ לְ/מָ֑טָּה גַּם אֲנִ֞י אֶמְאַ֨ס בְּ/כָל זֶ֧רַע יִשְׂרָאֵ֛ל עַֽל כָּל אֲשֶׁ֥ר עָשׂ֖וּ נְאֻם יְהוָֽה׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: pt
  text: 'Assim diz Javé: “Se os céus lá em cima puderem ser medidos e os fundamentos da terra lá embaixo puderem ser sondados, então eu também rejeitarei[a] toda a descendência de Israel por causa de tudo o que fizeram”, declara Javé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abandonarei”.'
    reason: Registra uma alternativa contextual para מאס, que pode exprimir rejeitar ou repudiar/abandonar.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo conciso e digno a fórmula profética de mensageiro, corrente em português bíblico.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa amplamente reconhecível o nome divino da aliança, em vez de substituí-lo por um título.
- source_word: אִם יִמַּדּוּ
  choice: Se ... puderem ser medidos
  rationale: Mantém a forma condicional e a voz passiva do hebraico, sem explicitar no texto que a condição é retoricamente impossível.
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: os céus lá em cima
  rationale: Preserva a imagem cosmológica e o contraste vertical com a terra lá embaixo; “lá” torna a expressão natural em português.
- source_word: וְיֵחָקְרוּ
  choice: puderem ser sondados
  rationale: Expressa uma investigação profunda e exaustiva, adequada ao nifal de חקר e ao contexto das profundezas inacessíveis.
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: os fundamentos da terra lá embaixo
  rationale: Conserva a linguagem cosmológica e o paralelismo espacial com “os céus lá em cima”.
- source_word: גַּם אֲנִי
  choice: então eu também
  rationale: Marca naturalmente a consequência da condição e mantém a correspondência enfática do hebraico.
- source_word: אֶמְאַס
  choice: rejeitarei
  rationale: “Rejeitar” comunica com clareza o sentido contextual de מאס sem acentuar indevidamente desprezo emocional; a alternativa “abandonarei” é registrada em nota.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: toda a descendência de Israel
  rationale: Representa o sentido coletivo de זֶרַע em português natural e inclusivo das sucessivas gerações.
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: por causa de tudo o que fizeram
  rationale: Torna explícito o valor causal de עַל neste contexto sem acrescentar conteúdo interpretativo.
- source_word: נְאֻם יְהוָה
  choice: declara Javé
  rationale: Mantém a fórmula solene que autentica o oráculo profético.
theological_decisions:
- issue: Força retórica da condição sobre a rejeição de Israel
  choice: 'Preservar a construção condicional: somente se os céus puderem ser medidos e os fundamentos da terra sondados Javé rejeitará toda a descendência de Israel.'
  alternative: Explicitar na tradução que Javé jamais rejeitará Israel.
  rationale: Jeremias 31:35–37 apresenta a estabilidade e a insondabilidade da criação como garantia da permanência de Israel. Contudo, o versículo formula essa garantia como condição retórica; mantê-la preserva tanto sua força quanto a tensão do texto, sem converter a implicação em afirmação direta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo “lá em cima/lá embaixo” conserva a estrutura poética e soa natural. As aspas delimitam o oráculo, e a fórmula final permanece fora delas como indicação profética.
