id: JER.31.6
reference: Jeremiah 31:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: pt
  text: 'Pois haverá um dia em que os vigias clamarão na região montanhosa de Efraim[a]: “Levantem-se! Subamos a Sião, a Yahweh[b], nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “vigias”; também pode ser traduzido como “guardas” ou “os que guardam”.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico traz YHWH, o nome divino, tradicionalmente representado por “SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função conectiva e explicativa em relação à promessa precedente.
- source_word: יֶשׁ יוֹם
  choice: haverá um dia
  rationale: Expressa naturalmente em português o tempo futuro esperado no contexto profético.
- source_word: קָרְאוּ
  choice: clamarão
  rationale: O perfeito pode apresentar como certo um acontecimento futuro no discurso profético; “clamarão” comunica uma convocação pública e audível.
- source_word: נֹצְרִים
  choice: vigias
  rationale: O particípio designa pessoas que vigiam ou guardam; “vigias” preserva a imagem concreta sem definir além do que o texto permite.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: O singular pode designar coletivamente a região elevada de Efraim; esta formulação evita sugerir um único monte.
- source_word: קוּמוּ
  choice: Levantem-se!
  rationale: Reproduz o imperativo plural como convocação direta, em português moderno e digno.
- source_word: וְנַעֲלֶה
  choice: Subamos
  rationale: Preserva a força exortativa da forma coortativa e o sentido topográfico e peregrino de subir a Sião.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Preserva diretamente a confissão comunitária e a relação pactual expressa pelo sufixo possessivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o torna visível ao leitor, enquanto a nota registra a tradição de representá-lo por “SENHOR”.
- issue: Sentido contextual de נֹצְרִים
  choice: vigias
  alternative: guardas
  rationale: “Vigias” conserva a imagem de pessoas que observam e fazem uma convocação pública, sem inserir uma interpretação específica sobre sua função ou identidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Região montanhosa” comunica o uso coletivo de הַר, e a fala direta mantém a energia da convocação pública.
