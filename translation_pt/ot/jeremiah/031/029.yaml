  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: pt
  text: 'Naqueles dias, já não dirão: “Os pais comeram uvas verdes, e os dentes dos filhos ficam embotados.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os pais comeram uvas azedas, e os dentes dos filhos ficam dormentes.”'
    reason: 'Alternativas lexicais para בֹסֶר e תִּקְהֶינָה: o primeiro pode salientar a acidez das uvas não maduras, e o segundo, o efeito de entorpecimento nos dentes.'
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Equivalente natural e consagrado para a expressão temporal profética, preservando sua referência futura no contexto.
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: já não dirão
  rationale: Mantém a voz ativa, o sujeito plural indefinido e a ideia de cessação expressa por עוֹד.
- source_word: אָבוֹת
  choice: os pais
  rationale: Preserva o termo masculino específico do hebraico e a relação entre gerações sem ampliá-lo para “antepassados”.
- source_word: אָכְלוּ
  choice: comeram
  rationale: O pretérito perfeito é natural em português para a ação concluída apresentada pelo provérbio.
- source_word: בֹסֶר
  choice: uvas verdes
  rationale: Designa uvas ainda não maduras e, portanto, ácidas; “uvas verdes” é claro e idiomático em português.
- source_word: וְשִׁנֵּי בָנִים
  choice: e os dentes dos filhos
  rationale: Reproduz a construção hebraica e conserva o substantivo masculino “filhos”.
- source_word: תִּקְהֶינָה
  choice: ficaram embotados
  rationale: Expressa o efeito desagradável de perda de sensibilidade ou agudeza nos dentes causado pela fruta ácida, mantendo a imagem concreta do hebraico.
theological_decisions:
- issue: Termos de parentesco no provérbio
  choice: Manter “pais” e “filhos” no texto principal
  alternative: “pais e filhos” em sentido inclusivo, ou “antepassados e descendentes”
  rationale: O hebraico emprega termos masculinos específicos. A tradução os conserva sem negar que o princípio proverbial trate, de modo mais amplo, das consequências entre gerações.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial natural. “Já não dirão” evita uma formulação passiva ausente no hebraico; “ficaram embotados” preserva melhor a metáfora do que uma explicação interpretativa.
