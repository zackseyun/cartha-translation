  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: pt
  text: '“Certamente ouvi Efraim lamentando-se[a]: ‘Tu me disciplinaste, e fui disciplinado, como um bezerro não treinado. Faz com que eu volte, e voltarei[b], pois tu és Yahweh, meu Deus.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lastimando-se”. O particípio hebraico pode indicar um autolamento audível e também sugerir agitação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Traz-me de volta, e eu voltarei”. O hebraico repete o mesmo verbo, “voltar”, primeiro em forma causativa e depois em forma simples.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: Certamente ouvi
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente ouvi” expressa essa ênfase de modo claro e natural.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio e a personificação singular do povo do norte presente no hebraico.
- source_word: מִתְנוֹדֵד
  choice: lamentando-se
  rationale: O particípio Hitpolel de נוד pode indicar lamento audível, agitação ou movimento de um lado para outro. No contexto penitencial, “lamentando-se” conserva naturalmente o valor reflexivo e o sentido de autolamento.
- source_word: יִסַּרְתַּנִי וָאִוָּסֵר
  choice: Tu me disciplinaste, e fui disciplinado
  rationale: A repetição de יסר é preservada por meio de “disciplinaste/discipl­inado”. A segunda forma é entendida em sentido passivo, sem excluir totalmente uma nuance de submissão à correção.
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: como um bezerro não treinado
  rationale: Preserva a imagem agrícola e a ideia de um animal que ainda não foi treinado para se submeter ao jugo, sem substituir a imagem por uma abstração.
- source_word: הֲשִׁיבֵנִי וְאָשׁוּבָה
  choice: Faz com que eu volte, e voltarei
  rationale: A construção causativa seguida da forma simples do mesmo verbo é reproduzida com a repetição de “voltar”. A formulação mantém tanto a ação divina que possibilita o retorno quanto a resposta de Efraim.
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: pois tu és Yahweh, meu Deus
  rationale: כִּי introduz a razão do pedido. O nome divino é transliterado, e a confissão pessoal “meu Deus” é mantida diretamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Relação entre a ação divina e o retorno de Efraim
  choice: Faz com que eu volte, e voltarei
  alternative: Restaura-me, e voltarei
  rationale: A tradução mantém a forma causativa do primeiro verbo e repete “voltar” nas duas orações, sem dissolver a tensão entre a iniciativa divina e a resposta humana.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A forma “tu és” preserva o tratamento singular do hebraico; “faz com que eu volte” evita o imperativo literário e menos corrente “faze-me voltar”, ao mesmo tempo que conserva a repetição lexical central.
