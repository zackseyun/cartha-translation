source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ע֣וֹד יֹאמְר֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בְ/עָרָ֔י/ו בְּ/שׁוּבִ֖/י אֶת שְׁבוּתָ֑/ם יְבָרֶכְ/ךָ֧ יְהוָ֛ה נְוֵה צֶ֖דֶק הַ֥ר הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: Ainda dirão este pronunciamento na terra de Judá e em suas cidades, quando eu lhes restaurar a sorte[a]: “Yahweh te abençoe, morada de justiça[b], monte santo!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando eu trouxer de volta os seus cativos” ou “quando eu os restaurar do cativeiro”. O idioma hebraico pode se referir especificamente ao retorno do exílio ou, de modo mais amplo, à restauração.
    reason: lexical_alternative
  - marker: b
    text: Ou “habitação de justiça” ou “pastagem de justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando seu caráter pessoal e pactual.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém o título tradicional e sua possível abrangência de forças celestes e terrestres sem especificá-las indevidamente.
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: Ainda dirão estas palavras
  rationale: Expressa a promessa de que essa declaração voltará a ser ouvida; o plural idiomático em português introduz naturalmente a citação.
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: quando eu restaurar a sua sorte
  rationale: Traduz de modo natural o idioma hebraico de reversão e restauração, sem restringi-lo exclusivamente ao retorno físico de cativos.
- source_word: יְבָרֶכְךָ
  choice: Yahweh te abençoe
  rationale: O imperfeito tem força jussiva na fórmula de bênção; o presente do subjuntivo comunica isso naturalmente em português.
- source_word: נְוֵה צֶדֶק
  choice: morada de justiça
  rationale: Morada preserva o sentido locativo de נָוֶה e funciona como título de Jerusalém/Sião, enquanto justiça mantém a amplitude moral e religiosa de צֶדֶק.
- source_word: הַר הַקֹּדֶשׁ
  choice: monte santo
  rationale: É uma expressão natural e consagrada em português para Sião como elevação sagrada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido do idioma שׁוּב שְׁבוּת
  choice: restaurar a sua sorte
  alternative: trazer de volta os seus cativos ou restaurá-los do cativeiro
  rationale: A expressão pode aludir concretamente ao retorno do exílio e também à restauração mais ampla. A escolha principal conserva essa amplitude, e a nota registra as leituras mais específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética e a bênção foram mantidas sem arcaísmos; as notas preservam as ambiguidades lexicais relevantes.
