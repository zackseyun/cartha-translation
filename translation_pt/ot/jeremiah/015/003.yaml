  text: וּ/פָקַדְתִּ֨י עֲלֵי/הֶ֜ם אַרְבַּ֤ע מִשְׁפָּחוֹת֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֣רֶב לַֽ/הֲרֹ֔ג וְ/אֶת הַ/כְּלָבִ֖ים לִ/סְחֹ֑ב וְ/אֶת ע֧וֹף הַ/שָּׁמַ֛יִם וְ/אֶת בֶּהֱמַ֥ת הָ/אָ֖רֶץ לֶ/אֱכֹ֥ל וּ/לְ/הַשְׁחִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: pt
  text: 'E designarei contra eles quatro grupos[a], declara Yahweh: a espada para matar, os cães para arrastar, e as aves dos céus[b] e os animais da terra para devorar e destruir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quatro famílias” ou “quatro clãs”; aqui, a palavra designa quatro grupos de agentes do juízo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as aves do céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: designarei contra eles
  rationale: O verbo פקד pode indicar nomear, encarregar ou mobilizar; com עַל e agentes hostis, a expressão apresenta Yahweh designando calamidades contra o povo. “Designarei contra eles” conserva tanto a ideia de comissão quanto o caráter hostil, sem reduzir o verbo simplesmente a “castigarei”.
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: quatro grupos
  rationale: מִשְׁפָּחוֹת significa literalmente “famílias” ou “clãs”, mas aqui classifica quatro agentes de juízo. “Grupos” é natural em português e preserva melhor a imagem coletiva do que o termo abstrato “categorias”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa diretamente o nome divino יהוה como “Yahweh”.
- source_word: הַחֶרֶב לַהֲרֹג
  choice: a espada para matar
  rationale: Tradução direta do infinitivo de finalidade, em linguagem atual e clara.
- source_word: הַכְּלָבִים לִסְחֹב
  choice: os cães para arrastar
  rationale: סחב significa arrastar ou levar de rastos. “Arrastar” comunica a ação vívida sem acrescentar que os corpos seriam despedaçados ou especificar para onde seriam levados.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves dos céus
  rationale: Reproduz de perto a expressão hebraica; no contexto, são aves que devoram os mortos, mas o texto não as identifica explicitamente como aves de rapina.
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: os animais da terra
  rationale: A expressão é ampla. “Animais da terra” evita restringi-la indevidamente a feras selvagens, embora o contexto indique animais que devoram cadáveres.
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: para devorar e destruir
  rationale: “Devorar” expressa a força contextual de אכל, enquanto “destruir” mantém o sentido de השחית e a coordenação dos dois infinitivos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título, sem introduzir interpretação denominacional.
- issue: Natureza dos quatro agentes de juízo
  choice: quatro grupos
  alternative: quatro famílias; quatro categorias de destruidores
  rationale: A formulação mantém a metáfora incomum do hebraico por meio de “grupos” e não acrescenta “de destruidores” ao texto principal. A nota registra o sentido literal.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem enumerativa e as imagens fortes do hebraico foram preservadas. O travessão destaca naturalmente a fórmula profética, e os dois marcadores de nota aparecem junto às expressões correspondentes no texto principal.
