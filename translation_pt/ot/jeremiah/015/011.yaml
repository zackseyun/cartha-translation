  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: pt
  text: 'Javé disse: “Certamente eu o libertei para o seu bem[a]; certamente fiz o inimigo suplicar a você em tempo de calamidade e em tempo de angústia.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da primeira oração é incerto. Outras traduções possíveis são: “Certamente eu o deixei ir para o seu bem” ou, entendendo a forma de outra maneira, “Certamente fortaleci o remanescente para o bem”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “certamente intercedi por você diante do inimigo em tempo de calamidade e em tempo de angústia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Preserva o nome divino da aliança em uma forma consolidada e facilmente reconhecível em português.
- source_word: אִם לֹא ... אִם לוא
  choice: certamente ... certamente
  rationale: A sequência funciona aqui como asseveração enfática, não como condição literal; a repetição preserva a força da afirmação divina.
- source_word: שרותך
  choice: eu o libertei
  rationale: A forma hebraica é difícil e possivelmente corrompida. A opção expressa libertação ou soltura em benefício de Jeremias, sem ocultar em nota as leituras alternativas.
- source_word: לְטוֹב
  choice: para o seu bem
  rationale: Comunica com naturalidade a finalidade ou o resultado benéfico indicado pela preposição e pelo substantivo.
- source_word: הִפְגַּעְתִּי בְךָ
  choice: fiz ... suplicar a você
  rationale: O hifil de פגע pode indicar fazer alguém rogar ou interceder. Com 'o inimigo' como objeto, esta leitura retrata o inimigo sendo levado a recorrer a Jeremias.
- source_word: אֶת הָאֹיֵב
  choice: o inimigo
  rationale: Reproduz o singular definido, que pode ter valor coletivo, sem acrescentar um possessivo ausente no hebraico.
- source_word: בְּעֵת רָעָה
  choice: em tempo de calamidade
  rationale: Neste contexto, רָעָה designa adversidade ou desastre, não mal moral.
- source_word: וּבְעֵת צָרָה
  choice: e em tempo de angústia
  rationale: Preserva o paralelismo e transmite a ideia de aflição intensa própria de צָרָה.
theological_decisions:
- issue: Sentido de uma promessa textual e lexicalmente difícil dirigida a Jeremias
  choice: Deus assegura que libertou Jeremias para o bem dele e que fará o inimigo suplicar-lhe durante a calamidade.
  alternative: A primeira oração pode referir-se a fortalecer o remanescente; a segunda pode dizer que Deus intercedeu por Jeremias diante do inimigo.
  rationale: A leitura escolhida se ajusta à vindicação de Jeremias no contexto e à construção com 'o inimigo', mas as ambiguidades reais do hebraico são mantidas nas notas, sem transformá-las em certeza doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O pronome objeto “o” refere-se a Jeremias; “a você” evita ambiguidade na relação verbal. As notas registram a dificuldade textual sem sobrecarregar o versículo.
