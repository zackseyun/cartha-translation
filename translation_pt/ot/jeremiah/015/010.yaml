  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: pt
  text: Ai de mim, minha mãe, pois você me deu à luz — homem de conflito e homem de contenda para toda a terra[a]! Não emprestei, nem me emprestaram[b]; mesmo assim, todos me amaldiçoam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o mundo inteiro”. No contexto, “terra” provavelmente se refere à terra de Judá.'
    reason: alternative_reading
  - marker: b
    text: O hebraico provavelmente se refere a emprestar e tomar emprestado no contexto de dívidas. Jeremias afirma que não deu às pessoas esse motivo social comum para hostilidade.
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי
  choice: Ai de mim
  rationale: A interjeição expressa lamento e aflição intensos; a formulação é natural e vigorosa em português.
- source_word: אִמִּי
  choice: minha mãe
  rationale: Mantém o vocativo explícito e a força emocional da queixa de Jeremias.
- source_word: כִּי יְלִדְתִּנִי
  choice: pois você me deu à luz
  rationale: Expressa naturalmente o valor causal de כִּי e o sentido de ילד no contexto do parto.
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: homem de conflito e homem de contenda
  rationale: Preserva o paralelismo nominal e a intensificação retórica dos dois termos hebraicos semanticamente próximos.
- source_word: לְכָל הָאָרֶץ
  choice: para toda a terra
  rationale: Mantém a preposição e traduz הָאָרֶץ como a terra, provavelmente a terra de Judá no contexto, sem eliminar a possível leitura mais ampla.
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: Não emprestei, nem me emprestaram
  rationale: 'Conserva a reciprocidade da linguagem de crédito e dívida: Jeremias não foi credor nem devedor deles.'
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: todos me amaldiçoam
  rationale: Reproduz a totalidade da oposição e apresenta como realidade contínua a ação expressa pelo particípio.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a terra inteira / o mundo inteiro
  rationale: No contexto de Jeremias, a referência mais provável é à terra de Judá. A nota preserva a possibilidade lexical mais ampla sem transformar a hostilidade descrita em afirmação necessariamente mundial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi preservado, apesar de sua solenidade incomum, e “você” torna natural o discurso direto à mãe.
