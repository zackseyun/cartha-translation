id: JER.15.9
reference: Jeremiah 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: pt
  text: Aquela que deu à luz sete[a] definhou; exalou a vida[b]. Seu sol se pôs enquanto ainda era dia[c]. Ficou envergonhada e humilhada. E o restante deles entregarei à espada diante de seus inimigos — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mãe de sete”. A expressão hebraica retrata uma mulher antes considerada plenamente fecunda e abençoada.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “exalou sua alma” ou “exalou sua vida”.'
    reason: lexical_alternative
  - marker: c
    text: 'Imagem poética de um fim prematuro: seu sol se põe antes que o dia termine.'
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: definhou
  rationale: O verbo descreve enfraquecimento e ruína progressiva. “Definhou” conserva a força poética da imagem e é claro em português moderno.
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: aquela que deu à luz sete
  rationale: Mantém a formulação concisa do hebraico, no qual “sete” evoca descendência completa e uma mulher antes vista como plenamente fecunda e abençoada, sem explicitar além do necessário o substantivo “filhos”.
- source_word: נָפְחָה נַפְשָׁהּ
  choice: exalou a vida
  rationale: Reproduz a imagem concreta do sopro vital que sai e comunica naturalmente a morte, sem transformar נֶפֶשׁ numa afirmação técnica sobre a natureza da alma.
- source_word: בָּאָה שִׁמְשָׁהּ
  choice: seu sol se pôs
  rationale: A expressão hebraica usa o movimento do sol como metáfora de declínio e fim; “se pôs” é a forma idiomática natural em português.
- source_word: בְּעוֹד יוֹמָם
  choice: enquanto ainda era dia
  rationale: Preserva a imagem de um fim prematuro, ocorrido antes do tempo esperado.
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: ficou envergonhada e humilhada
  rationale: Os dois verbos intensificam a vergonha e a desonra pública; a dupla expressão mantém essa ênfase em linguagem corrente.
- source_word: וּשְׁאֵרִיתָם
  choice: e o restante deles
  rationale: Expressa coletivamente os sobreviventes ou aqueles que sobraram, preservando a referência plural do sufixo hebraico.
- source_word: לַחֶרֶב אֶתֵּן
  choice: entregarei à espada
  rationale: Mantém a fórmula profética de juízo e deixa claro que os sobreviventes serão entregues à morte violenta.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: diante de seus inimigos
  rationale: Segue de perto o sentido espacial e relacional de לִפְנֵי, indicando exposição ao poder dos inimigos.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” representa bem a fórmula profética נְאֻם, e “Yahweh” translitera o nome divino pessoal presente no texto hebraico.
theological_decisions:
- issue: Representação de נֶפֶשׁ em נָפְחָה נַפְשָׁהּ
  choice: vida
  alternative: alma
  rationale: Neste idioma, נֶפֶשׁ designa a própria vida ou pessoa que se extingue. “Vida” preserva o sentido contextual sem impor uma definição antropológica posterior; a tradução mais literal é registrada em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome divino pessoal, não o título אֲדֹנָי. “Yahweh” torna essa distinção visível e segue a orientação fornecida para este projeto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe poética moderada. A repetição das imagens de vida, sol e espada foi preservada, assim como a mudança do retrato da mulher para o juízo sobre o restante do povo.
