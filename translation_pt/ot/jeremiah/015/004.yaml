  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְתַתִּ֣י/ם ל/זועה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ בִּ֠/גְלַל מְנַשֶּׁ֤ה בֶן יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַ֥ל אֲשֶׁר עָשָׂ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: pt
  text: E farei deles motivo de horror para todos os reinos da terra[a], por causa de Manassés, filho de Ezequias, rei de Judá, por causa do que ele fez em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objeto de horror” ou “motivo de pavor”. O substantivo hebraico indica algo que provoca tremor, pavor ou horror.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: E farei deles
  rationale: Com predicativo introduzido por ל, נתן tem aqui o sentido de tornar ou fazer de alguém alguma coisa; esta formulação é natural em português e preserva o resultado imposto.
- source_word: לְזַוֲעָה
  choice: motivo de horror
  rationale: O substantivo designa aquilo que provoca tremor, pavor ou horror. “Motivo de horror” expressa de modo claro que eles se tornam objeto causador dessa reação.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: para todos os reinos da terra
  rationale: A preposição ל marca a relação com os reinos diante dos quais eles se tornam motivo de horror.
- source_word: בִּגְלַל
  choice: por causa de
  rationale: A locução hebraica tem sentido causal direto neste contexto.
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ
  choice: Manassés, filho de Ezequias
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português e traduz diretamente a relação filial.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e corrente do título régio.
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: por causa do que ele fez
  rationale: Mantém a segunda expressão causal explícita do hebraico, ainda que produza repetição, e especifica que a causa está nos atos de Manassés.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta com a forma tradicional do topônimo em português.
theological_decisions:
- issue: Julgamento coletivo de Judá relacionado aos pecados de Manassés
  choice: Manter a relação causal explícita sem atenuá-la
  alternative: Tratar Manassés apenas como contexto histórico, sem causalidade direta
  rationale: O texto atribui expressamente o julgamento a Manassés e ao que ele fez em Jerusalém. A tradução conserva essa tensão entre os atos do rei e as consequências coletivas, sem tentar resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por causa de” foi mantida para refletir as duas formulações causais do hebraico. “Motivo de horror” evita uma construção excessivamente literal e comunica que o povo se tornará objeto que desperta horror entre os reinos.
