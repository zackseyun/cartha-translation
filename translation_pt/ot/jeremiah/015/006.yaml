id: JER.15.6
reference: Jeremiah 15:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣תְּ נָטַ֥שְׁתְּ אֹתִ֛/י נְאֻם יְהוָ֖ה אָח֣וֹר תֵּלֵ֑כִי וָ/אַ֨ט אֶת יָדִ֤/י עָלַ֨יִ/ךְ֙ וָֽ/אַשְׁחִיתֵ֔/ךְ נִלְאֵ֖יתִי הִנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: pt
  text: Você me abandonou[a] — declara Yahweh — e continua andando para trás. Por isso, estendi a minha mão contra você e a destruí; cansei-me de voltar atrás[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico se dirige a uma figura feminina singular, provavelmente Jerusalém ou Judá personificada.
    reason: referent_clarification
  - marker: b
    text: 'Ou: “cansei-me de mudar de ideia” ou “de desistir do castigo”. O verbo hebraico pode indicar voltar atrás quanto a um juízo anunciado.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  choice: Você me abandonou
  rationale: O verbo expressa deixar ou abandonar; “abandonou” comunica com naturalidade a força relacional da acusação profética.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida de modo claro e solene, preservando o nome divino יְהוָה como Yahweh.
- source_word: אָחוֹר תֵּלֵכִי
  choice: continua andando para trás
  rationale: Mantém a imagem espacial do hebraico e traduz o imperfeito como conduta contínua, sem explicitar além do texto a ideia de apostasia.
- source_word: וָאַט אֶת יָדִי עָלַיִךְ
  choice: Por isso, estendi a minha mão contra você
  rationale: “Estender a mão contra” conserva a imagem hebraica de ação hostil; “por isso” explicita a relação consequencial presente no contexto.
- source_word: וָאַשְׁחִיתֵךְ
  choice: e a destruí
  rationale: O hifil de שׁחת indica destruir ou arruinar; “destruí” preserva a severidade do juízo.
- source_word: נִלְאֵיתִי הִנָּחֵם
  choice: cansei-me de voltar atrás
  rationale: לאה indica cansaço, enquanto נחם, neste contexto, descreve recuar ou desistir do juízo anunciado. A expressão é natural em português e conserva a tensão do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de הִנָּחֵם aplicado a Deus
  choice: voltar atrás
  alternative: arrepender-se; mudar de ideia; desistir do castigo
  rationale: “Voltar atrás” comunica a suspensão ou revogação do juízo sem sugerir necessariamente arrependimento moral, mas não elimina a tensão da linguagem antropopática.
- issue: Referente feminino da segunda pessoa singular
  choice: você / a destruí
  alternative: Judá explicitamente
  rationale: O hebraico dirige-se a uma figura feminina singular, provavelmente Jerusalém ou Judá personificada. O referente não é inserido no corpo do versículo para não resolver uma identificação deixada implícita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A pontuação destaca a fórmula profética. A concordância em “a destruí” preserva o gênero feminino do destinatário hebraico.
