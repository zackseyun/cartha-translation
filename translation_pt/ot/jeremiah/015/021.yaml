  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: pt
  text: Eu o livrarei da mão dos homens maus e o resgatarei do poder dos violentos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos cruéis” ou “dos opressores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Eu o livrarei
  rationale: O hifil de נצל expressa tirar alguém do perigo, livrar ou salvar. “Livrarei” é natural em português, preserva o tom profético e se ajusta à construção com מִן.
- source_word: מִיַּד
  choice: das mãos dos
  rationale: יָד significa literalmente “mão” e, neste contexto, representa poder ou domínio. O plural idiomático “das mãos dos homens maus” conserva a imagem hebraica e soa natural em português.
- source_word: רָעִים
  choice: homens maus
  rationale: O adjetivo masculino plural é usado substantivamente para adversários humanos moralmente maus. “Homens maus” explicita o referente humano e mantém a forma masculina do hebraico.
- source_word: וּפְדִתִיךָ
  choice: e o resgatarei
  rationale: פדה descreve libertar mediante resgate ou redenção. “Resgatarei” comunica com clareza a retirada do poder hostil sem perder o campo semântico de redenção.
- source_word: מִכַּף
  choice: das garras dos
  rationale: כַּף significa “palma” ou “mão”, mas aqui indica domínio hostil. “Garras” reproduz de modo vívido e idiomático a ideia de alguém mantido sob poder opressor.
- source_word: עָרִצִים
  choice: violentos
  rationale: עָרִיץ designa pessoas violentas, cruéis ou opressoras. “Violentos” preserva o caráter humano e hostil do termo sem restringi-lo ao sentido político de “tiranos”.
theological_decisions:
- issue: Referência humana e gênero de רָעִים
  choice: homens maus
  alternative: maus; perversos
  rationale: O masculino plural refere-se a adversários humanos. A tradução explicita isso sem generalizar o termo nem introduzir uma categoria doutrinária.
- issue: Valor de פדה no contexto
  choice: resgatarei
  alternative: redimirei
  rationale: O contexto imediato enfatiza libertação do domínio de perseguidores. “Resgatarei” preserva esse sentido concreto, enquanto “redimirei” poderia sugerir ao leitor moderno um sentido teológico mais específico do que o contexto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo entre “livrarei” e “resgatarei” e as imagens corporais de poder hostil (“mãos” e “garras”). O pronome “o” representa o destinatário masculino singular indicado pelos sufixos hebraicos.
