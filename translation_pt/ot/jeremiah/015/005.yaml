base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: pt
  text: Pois quem terá compaixão de você, Jerusalém? Quem lamentará por você[a]? Quem se desviará do caminho para perguntar como você está?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem demonstrará pesar por você?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do juízo precedente e preserva de modo natural o valor causal do hebraico.
- source_word: מִי
  choice: quem
  rationale: O pronome interrogativo aparece três vezes; a repetição foi mantida para preservar a força retórica.
- source_word: יַחְמֹל עָלַיִךְ
  choice: terá compaixão de você
  rationale: חמל com על expressa compaixão ou piedade; esta formulação é natural em português e adequada ao cenário de desolação.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Emprega a forma tradicional e corrente do nome próprio em português.
- source_word: יָנוּד לָךְ
  choice: lamentará por você
  rationale: נוד pode indicar um gesto ou manifestação de pesar solidário. “Lamentará” comunica o sentido contextual sem impor a imagem incerta de balançar a cabeça.
- source_word: יָסוּר
  choice: se desviará do caminho
  rationale: Preserva a imagem de alguém que interrompe ou altera seu percurso para se ocupar de Jerusalém.
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: para perguntar como você está
  rationale: A expressão idiomática significa indagar pelo estado ou bem-estar de alguém; esta é uma formulação clara e corrente em português.
