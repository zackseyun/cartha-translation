  text: וָ/אֶזְרֵ֥/ם בְּ/מִזְרֶ֖ה בְּ/שַׁעֲרֵ֣י הָ/אָ֑רֶץ שִׁכַּ֤לְתִּי אִבַּ֨דְתִּי֙ אֶת עַמִּ֔/י מִ/דַּרְכֵי/הֶ֖ם לוֹא שָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: pt
  text: Eu os joeirei com uma pá de joeirar às portas da terra[a]; deixei-os sem filhos, destruí o meu povo; eles não abandonaram os seus caminhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às portas do mundo”. A palavra hebraica pode significar “terra”, “território” ou “mundo”; neste contexto, provavelmente se refere à terra de Judá.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se arrependeram dos seus caminhos”. O hebraico diz literalmente que eles não “voltaram” ou “retornaram” de seus caminhos, expressão que, em contextos proféticos, pode indicar arrependimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: Eu os joeirei
  rationale: O verbo זרה descreve aqui a ação de joeirar ou dispersar grãos. “Joeirei” conserva a metáfora agrícola e se liga naturalmente ao instrumento mencionado em seguida.
- source_word: בְּמִזְרֶה
  choice: com uma pá de joeirar
  rationale: מִזְרֶה designa um utensílio usado na joeira. “Pá de joeirar” mantém a imagem concreta e é mais transparente em português do que o tradicional “ventarola”.
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: às portas da terra
  rationale: A expressão significa literalmente “nas/às portas da terra”. No contexto imediato, “terra” provavelmente se refere ao território de Judá, embora o substantivo também possa significar o mundo ou a terra em sentido amplo.
- source_word: שִׁכַּלְתִּי
  choice: deixei-os sem filhos
  rationale: O verbo expressa causar perda de filhos ou privar alguém deles. A formulação explicita em português corrente o efeito de tornar o povo enlutado ou privado de filhos.
- source_word: אִבַּדְתִּי אֶת עַמִּי
  choice: destruí o meu povo
  rationale: A forma verbal tem sentido causativo de fazer perecer ou destruir; a tradução direta preserva a severidade do juízo.
- source_word: מִדַּרְכֵיהֶם לֹא שָׁבוּ
  choice: eles não voltaram atrás, abandonando os seus caminhos
  rationale: שׁוּב mantém a imagem de voltar ou retornar, enquanto a construção com מִן indica afastamento dos caminhos anteriores. A redação portuguesa preserva a imagem sem substituir o verbo por um termo doutrinário técnico.
theological_decisions:
- issue: Se שׁוּב deve ser traduzido explicitamente como arrependimento
  choice: eles não voltaram atrás, abandonando os seus caminhos
  alternative: eles não se arrependeram dos seus caminhos
  rationale: O verbo pode denotar arrependimento em contexto profético, mas seu sentido básico é voltar ou retornar. A tradução principal conserva a metáfora e a nota registra a leitura moral explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “joeeirei... pá de joeirar” foi mantida para preservar a imagem agrícola do hebraico; “às portas da terra” conserva a formulação concreta e sua ambiguidade geográfica.
