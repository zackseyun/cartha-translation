  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: pt
  text: Não me sentei na companhia dos que riem[a], nem me alegrei. Por causa da tua mão[b], sentei-me sozinho, pois me encheste de indignação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no círculo dos que festejam” ou “no conselho dos que se alegram”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante da tua mão”; a expressão provavelmente significa “por causa da tua mão” ou “sob a pressão da tua mão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ira”, “furor” ou “cólera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: não me sentei / sentei-me
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. “Sentar-se” preserva a imagem concreta e funciona naturalmente tanto com “na companhia” quanto com “sozinho”.
- source_word: בְסוֹד
  choice: na companhia
  rationale: סוֹד pode indicar círculo íntimo, conselho ou grupo. Neste contexto, “companhia” comunica associação social sem sugerir necessariamente uma assembleia formal.
- source_word: מְשַׂחֲקִים
  choice: dos que riem
  rationale: O particípio de שׂחק pode se referir aos que riem, brincam ou festejam. “Os que riem” é transparente e preserva a amplitude do termo sem impor a ideia mais restrita de zombaria.
- source_word: וָאֶעְלֹז
  choice: nem me alegrei
  rationale: עלז expressa júbilo ou alegria exultante. A negação da primeira oração estende-se naturalmente a esta oração coordenada.
- source_word: מִפְּנֵי יָדְךָ
  choice: por causa da tua mão
  rationale: A expressão é literalmente “de diante da tua mão”. A tradução comunica a relação causal, mas mantém a imagem da mão divina e sua possível ideia de pressão ou poder atuante.
- source_word: בָּדָד
  choice: sozinho
  rationale: בָּדָד denota isolamento ou separação. “Sozinho” é direto, natural e conserva a força emocional da frase.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz aqui a razão do isolamento do profeta. “Pois” expressa com clareza essa relação explicativa.
- source_word: זַעַם
  choice: indignação
  rationale: זַעַם pode significar indignação, ira ou furor, frequentemente em contexto de juízo divino. “Indignação” preserva a gravidade sem definir em excesso sua nuance emocional ou judicial.
- source_word: מִלֵּאתָנִי
  choice: me encheste
  rationale: מלא significa “encher”. O pretérito perfeito acompanha a sequência verbal e mantém a ação divina expressa diretamente.
theological_decisions:
- issue: Sentido de “tua mão” em relação ao isolamento de Jeremias
  choice: Manter “tua mão” como metáfora do poder ou da pressão divina, sem substituí-la por uma explicação.
  alternative: Entender a mão de Deus especificamente como proteção ou apenas como presença.
  rationale: A expressão parece ligar a solidão do profeta à ação constrangedora de Deus e ao peso de sua vocação profética. A imagem é preservada para não limitar sua tensão teológica.
- issue: Nuance de זַעַם
  choice: Traduzir por “indignação” no texto principal.
  alternative: “Ira”, “furor” ou “cólera”.
  rationale: O termo pode designar ira, inclusive ira divina, mas a sintaxe afirma que Deus encheu Jeremias dela. “Indignação” mantém a severidade e deixa aberta a relação entre o sentimento do profeta e o juízo divino que ele anuncia.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A segunda pessoa singular foi mantida para refletir a fala direta a Deus. A repetição de “sentei” preserva o paralelismo hebraico.
