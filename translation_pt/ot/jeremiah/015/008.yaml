  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: pt
  text: Suas viúvas se tornaram, diante de mim, mais numerosas do que a areia dos mares. Trouxe contra eles, contra a mãe do jovem, um devastador ao meio-dia; de repente, fiz cair sobre ela cidade e terrores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “cidade e terrores” é difícil. O texto massorético traz literalmente “cidade e terrores”; algumas traduções entendem ou corrigem a primeira palavra como “angústia”, “agitação” ou expressão semelhante.
    reason: Sinalizar uma dificuldade textual e lexical genuína, preservando a leitura recebida sem ocultar alternativas.
lexical_decisions:
- source_word: עָצְמוּ
  choice: se tornaram [...] mais numerosas
  rationale: O verbo expressa aumento ou grande quantidade; esta formulação comunica naturalmente a multiplicação das viúvas.
- source_word: מֵחוֹל יַמִּים
  choice: do que a areia dos mares
  rationale: Mantém o plural hebraico יַמִּים e a comparação quantitativa.
- source_word: שֹׁדֵד
  choice: devastador
  rationale: Designa aquele que destrói ou saqueia; “devastador” preserva a força do termo e se ajusta ao contexto de invasão.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Tradução direta da indicação temporal, destacando um ataque em plena luz do dia.
- source_word: עִיר וּבֶהָלוֹת
  choice: cidade e terrores
  rationale: Segue a vocalização e o texto consonantal massoréticos tal como transmitidos, apesar da dificuldade sintática e semântica, deixando a questão explícita em nota.
theological_decisions:
- issue: Referente de “suas viúvas” e do pronome em “contra eles”
  choice: Manter os referentes pronominais sem explicitação adicional
  alternative: Identificar expressamente Judá, o povo ou seus homens
  rationale: O versículo depende do contexto e não nomeia o referente; explicitá-lo resolveria uma referência que o hebraico deixa implícita.
- issue: Objeto de “fiz cair sobre ela”
  choice: Preservar “cidade e terrores” no texto principal
  alternative: Adotar uma emenda ou um sentido lexical conjectural como “angústia e terrores”
  rationale: A leitura massorética é difícil, mas deve ser preservada em vez de ser silenciosamente corrigida; a nota registra alternativas plausíveis.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe relativamente próxima do hebraico. “Diante de mim” conserva a perspectiva divina; “a mãe do jovem” mantém a formulação singular e abrupta do original. A estranheza da cláusula final é deliberadamente preservada e explicada em nota.
