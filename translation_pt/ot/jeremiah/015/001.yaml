source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Ainda que Moisés e Samuel se apresentassem diante de mim, minha alma não se voltaria para este povo.[a] Mande-os embora da minha presença,[b] e que saiam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “meu coração não se voltaria para este povo” ou “eu não teria consideração por este povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante de mim”; isto é, “para fora da minha presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Então Yahweh me disse
  rationale: “Então” expressa a progressão narrativa do waw consecutivo, e “me disse” é a forma corrente e natural em português para אֵלַי.
- source_word: אִם יַעֲמֹד
  choice: Ainda que ... se apresentassem
  rationale: “Ainda que” comunica a força concessiva e hipotética de אִם neste contexto; o imperfeito do subjuntivo preserva a hipótese enfática.
- source_word: יַעֲמֹד ... לְפָנַי
  choice: se apresentassem diante de mim
  rationale: Conserva a imagem de comparecer diante de Deus sem inserir explicitamente “interceder”, ideia provável no contexto, mas não lexicalizada no hebraico.
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: Moisés e Samuel
  rationale: Emprega as formas tradicionais e amplamente reconhecidas desses nomes em português.
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: minha alma não se voltaria para este povo
  rationale: Preserva a expressão antropomórfica נַפְשִׁי e a orientação indicada por אֶל, com uma formulação compreensível em português; a nota oferece equivalentes idiomáticos.
- source_word: שַׁלַּח
  choice: Mande-os para longe
  rationale: Traduz o imperativo dirigido a Jeremias e torna explícito em português o objeto recuperável do contexto, sem acrescentar um destino.
- source_word: מֵעַל פָּנַי
  choice: de diante de mim
  rationale: Mantém a imagem concreta do hebraico, enquanto a nota esclarece seu sentido idiomático de afastamento da presença divina.
- source_word: וְיֵצֵאוּ
  choice: e que saiam
  rationale: Reproduz a continuação de valor volitivo após o imperativo e evita especificar se a saída é da presença divina, da cidade ou da terra.
theological_decisions:
- issue: A expressão antropomórfica נַפְשִׁי (“minha alma”) aplicada a Yahweh
  choice: Manter “minha alma não se voltaria para este povo”.
  alternative: “Eu não teria consideração por este povo” ou “meu coração não se voltaria para este povo”.
  rationale: A redação conserva a linguagem pessoal e vívida do texto sem transformá-la numa afirmação ontológica nem reduzir sua força a uma abstração.
- issue: O possível sentido intercessório de Moisés e Samuel estarem diante de Yahweh
  choice: Traduzir por “se apresentassem diante de mim”.
  alternative: “Intercedessem diante de mim” ou “suplicassem a mim”.
  rationale: Moisés e Samuel são conhecidos como intercessores, mas o hebraico diz literalmente que estariam ou se apresentariam diante de Deus. A tradução não explicita além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “minha alma não se voltaria” retém deliberadamente a imagem hebraica; as notas esclarecem as alternativas idiomáticas. A pontuação posiciona cada marcador junto à expressão que ele explica.
