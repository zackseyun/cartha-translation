source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: pt
  text: Tu o sabes, ó Yahweh; lembra-te de mim, cuida de mim[a] e toma vingança por mim contra os que me perseguem. Não me leves em tua longanimidade[b]. Sabe que, por tua causa, suporto afronta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visita-me”, “atenta para mim” ou “intervém em meu favor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Não me tomes na extensão da tua ira”. A expressão hebraica significa ser lento para a ira, isto é, longânimo. A relação exata entre essa longanimidade e “não me leves” é sintaticamente difícil; também se pode entender: “Não me leves por causa de tua longanimidade”.'
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: 'Ou: “Sabe que suporto afronta por tua causa” ou “por tua conta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino e segue a convenção do projeto.
- source_word: זָכְרֵנִי
  choice: lembra-te de mim
  rationale: Mantém a súplica direta e a possível implicação de agir em favor do suplicante.
- source_word: וּפָקְדֵנִי
  choice: cuida de mim
  rationale: No paralelismo com 'lembra-te de mim', expressa atenção ativa e intervenção favorável, sem restringir פקד à mera observação.
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: vinga-me dos que me perseguem
  rationale: Conserva a força judicial de נקם e traduz רדף de modo natural no contexto de perseguição hostil.
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: Por causa da tua paciência, não permitas que eu seja levado
  rationale: 'Torna explícita em português a relação provável: a demora paciente de Deus não deve resultar na eliminação do profeta; a nota preserva a forma mais literal e sua dificuldade.'
- source_word: דַּע
  choice: Reconhece
  rationale: Expressa o imperativo dirigido a Deus sem sugerir falta de conhecimento; também pode ser traduzido literalmente por 'sabe'.
- source_word: שְׂאֵתִי עָלֶיךָ חֶרְפָּה
  choice: é por tua causa que suporto humilhação
  rationale: Comunica que a desonra sofrida pelo profeta decorre de sua relação e serviço a Yahweh, mantendo a ambiguidade de עָלֶיךָ em nota.
theological_decisions:
- issue: Natureza do pedido de retaliação divina
  choice: vinga-me dos que me perseguem
  alternative: faz-me justiça contra os que me perseguem
  rationale: נקם pede vingança ou vindicação divina. A tradução não suaviza a tensão ética da oração nem a transforma em autorização para vingança pessoal.
- issue: Efeito da paciência divina sobre Jeremias
  choice: não permitas que eu seja levado
  alternative: não me leves por causa da tua demora em irar-te
  rationale: O hebraico é sintaticamente difícil. A leitura adotada entende que a longanimidade de Deus para com os perseguidores não deve permitir que Jeremias pereça, mas a nota conserva a formulação literal ambígua.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa coerentes na oração dirigida a Deus. 'Humilhação' comunica חֶרְפָּה de modo corrente; 'vergonha' ou 'afronta' seriam alternativas. A redação preserva a súplica intensa e a tensão do pedido de vingança divina.
