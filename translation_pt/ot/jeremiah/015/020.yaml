reference: Jeremiah 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: pt
  text: Eu farei de você, para este povo, uma muralha de bronze fortificada[a]. Eles lutarão contra você, mas não prevalecerão contra você, pois eu estou com você para salvar você e livrar você — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma muralha fortificada de bronze”.'
    reason: A ordem e a relação dos modificadores em לְחוֹמַת נְחֹשֶׁת בְּצוּרָה podem ser expressas em português como “de bronze fortificada” ou “fortificada de bronze”, sem mudança substancial da metáfora.
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Eu farei de você
  rationale: 'Embora נתן signifique literalmente “dar, pôr, colocar”, nesta construção com לְ e um substantivo predicativo expressa transformação ou designação: “fazer de alguém”. A formulação é natural em português e preserva o sentido resultante.'
- source_word: לָעָם הַזֶּה
  choice: diante deste povo
  rationale: A preposição לְ marca aqui a relação de Jeremias com o povo. “Diante deste povo” evita sugerir que a muralha existe em benefício dele e comunica naturalmente o confronto implícito no contexto.
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: uma muralha de bronze fortificada
  rationale: חוֹמָה é “muralha”; נְחֹשֶׁת, “bronze” (ou cobre); e בְּצוּרָה descreve algo fortificado ou inacessível. A expressão conserva a metáfora de resistência e inexpugnabilidade.
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Eles lutarão contra você
  rationale: O verbo לחם com אֶל indica combate dirigido contra alguém. A tradução é direta, atual e clara.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: mas não prevalecerão contra você
  rationale: יכל significa “ser capaz”, mas, com לְ neste contexto hostil, indica não conseguir vencer ou obter êxito contra Jeremias. “Não prevalecerão” reproduz esse valor idiomático.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: pois eu estou com você
  rationale: כִּי introduz a razão pela qual os adversários não vencerão. “Pois” mantém essa relação explicativa.
- source_word: לְהוֹשִׁיעֲךָ
  choice: para salvá-lo
  rationale: ישע significa “salvar” ou “socorrer”. “Salvar” mantém sua importante conexão lexical com o uso bíblico mais amplo.
- source_word: וּלְהַצִּילֶךָ
  choice: e livrá-lo
  rationale: נצל significa “arrancar, resgatar, livrar”. “Livrar” preserva a distinção entre os dois verbos paralelos sem apagar sua proximidade semântica.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula solene de discurso profético, bem representada por “declara”. O nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio da aliança sem substituí-lo por um título, enquanto “SENHOR” reflete a tradição de leitura e “Jeová” uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” para interlocução direta e formas oblíquas tradicionais em “salvá-lo” e “livrá-lo”. A repetição de “contra você” foi mantida por clareza e para refletir as duas construções hebraicas sucessivas. O travessão destaca naturalmente a fórmula profética final.
