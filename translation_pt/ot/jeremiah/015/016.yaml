base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: pt
  text: As tuas palavras foram encontradas, e eu as comi; as tuas palavras se tornaram, para mim, júbilo e alegria do meu coração, pois o teu nome é chamado sobre mim[a], ó Yahweh, Deus dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação mais idiomática: “sou chamado pelo teu nome”.'
    reason: Alternativa idiomática que explicita o sentido de identificação e pertencimento da expressão hebraica, sem substituir no texto principal a imagem de o nome ser chamado «sobre» o profeta.
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: foram encontradas
  rationale: Preserva a forma passiva nifal e não acrescenta que Jeremias tenha procurado ativamente as palavras.
- source_word: דְבָרֶיךָ
  choice: as tuas palavras
  rationale: Mantém o plural hebraico e sua repetição enfática no versículo.
- source_word: וָאֹכְלֵם
  choice: eu as comi
  rationale: Conserva a metáfora concreta e vívida de ingerir as palavras divinas.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחַת לְבָבִי
  choice: júbilo e alegria do meu coração
  rationale: 'Distingue naturalmente os dois termos hebraicos do mesmo campo semântico: שָׂשׂוֹן sugere júbilo, e שִׂמְחָה, alegria.'
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: o teu nome é invocado sobre mim
  rationale: Preserva tanto a construção passiva quanto a imagem espacial de o nome divino estar sobre o profeta, com a equivalência idiomática registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Expressa o título hebraico de modo corrente e inteligível em português, sem restringir no contexto a identidade desses exércitos.
theological_decisions:
- issue: O idioma de pertencimento expresso por נִקְרָא שִׁמְךָ עָלַי
  choice: o teu nome é invocado sobre mim
  alternative: sou chamado pelo teu nome
  rationale: O texto principal conserva a forma e a imagem do hebraico, que podem indicar invocação, identificação e pertencimento, sem reduzir a expressão a apenas uma dessas nuances; a nota oferece a formulação portuguesa mais idiomática.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva que se trata do nome pessoal divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por formas de boa legibilidade brasileira. A metáfora de comer as palavras e a expressão incomum do nome invocado “sobre” o profeta foram preservadas. “Deus dos Exércitos” usa maiúscula no título composto.
