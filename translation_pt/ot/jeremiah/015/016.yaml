review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o plural repetido de «palavras», a metáfora concreta de comê-las, o nome Yahweh e o título «Deus dos Exércitos». Contudo, «o teu nome é invocado sobre mim» não corresponde precisamente ao verbo hebraico נִקְרָא («é chamado/proclamado»). «Invocado» desloca o sentido para o ato de invocar Yahweh, enquanto a expressão hebraica descreve o nome de Yahweh como chamado sobre o profeta, um idioma de identificação e pertencimento.
  naturalness: O texto é claro e de registro digno. «Foram encontradas» é deliberadamente mais literal e permanece compreensível. A formulação «é chamado sobre mim» é incomum em português, mas é justificável no texto principal por conservar a imagem hebraica, desde que a nota ofereça a equivalência idiomática.
  terminology: «Yahweh» e «Deus dos Exércitos» são adequados e consistentes com as decisões fornecidas. «Júbilo e alegria do meu coração» comunica corretamente o paralelismo de alegria; não é necessária alteração nessa expressão.
  issues:
  - severity: medium
    issue: «Invocado» para נִקְרָא שִׁמְךָ עָלַי
    rationale: O hebraico emprega o verbo «chamar», em construção passiva, e não o verbo «invocar». A troca introduz uma nuance diferente e reduz a relação formal entre o texto principal e a nota, que corretamente apresenta «sou chamado pelo teu nome» como alternativa idiomática.
  revised_text: As tuas palavras foram encontradas, e eu as comi; as tuas palavras se tornaram, para mim, júbilo e alegria do meu coração, pois o teu nome é chamado sobre mim[a], ó Yahweh, Deus dos Exércitos.
  revised_footnotes:
