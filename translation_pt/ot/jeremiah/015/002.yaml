  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: pt
  text: 'E acontecerá que, quando eles lhe disserem: “Para onde iremos?”, você lhes dirá: “Assim diz Yahweh: Quem é para a morte, para a morte[a]; quem é para a espada, para a espada; quem é para a fome, para a fome; e quem é para o cativeiro[b], para o cativeiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem estiver destinado à morte, à morte”. O hebraico é conciso e repete a mesma estrutura em cada categoria de juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “exílio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: A fórmula introduz uma circunstância futura esperada. “Quando” expressa melhor esse valor do que o condicional “se”, enquanto “acontecerá” soa natural em português profético atual.
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: eles lhe disserem
  rationale: Mantém o sentido básico de “dizer”; a fala citada já deixa claro que se trata de uma pergunta.
- source_word: אָנָה נֵצֵא
  choice: Para onde iremos?
  rationale: אָנָה indica direção ou destino. Embora יצא possa significar literalmente “sair”, neste contexto “ir” comunica naturalmente a pergunta sem impor um ponto de partida não expresso.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: você lhes dirá
  rationale: Emprega português moderno e acessível, mantendo a referência singular ao profeta e a sequência futura.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e verte o tetragrama como nome próprio, não como um título substitutivo.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: Quem é para a morte, para a morte
  rationale: Conserva a formulação hebraica abrupta, elíptica e repetitiva, sem acrescentar “destinado” ou “designado” ao texto principal.
- source_word: חֶרֶב
  choice: espada
  rationale: Mantém a imagem concreta do instrumento de morte e guerra, em vez de substituí-la pela abstração “guerra”.
- source_word: רָעָב
  choice: fome
  rationale: No contexto, designa a fome coletiva como forma de juízo; “fome” é a equivalência portuguesa direta e tradicional.
- source_word: שְׁבִי / שֶּׁבִי
  choice: cativeiro
  rationale: Preserva o estado ou destino expresso pelo substantivo e mantém o paralelismo “para o cativeiro”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Caráter fixo e severo das categorias de juízo
  choice: 'Manter a repetição: “Quem é para..., para...”'
  alternative: 'Explicitar: “Quem está destinado a..., que vá para...”'
  rationale: O hebraico não explica como as pessoas pertencem a cada categoria. A versão conserva sua concisão e a tensão teológica, sem acrescentar uma interpretação sobre predestinação ou agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe incomum da lista foi mantida deliberadamente para refletir a cadência abrupta do hebraico; fora dessa fórmula, adotou-se redação natural.
