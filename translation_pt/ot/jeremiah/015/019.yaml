language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אִם תָּשׁ֤וּב וַ/אֲשִֽׁיבְ/ךָ֙ לְ/פָנַ֣/י תַּֽעֲמֹ֔ד וְ/אִם תּוֹצִ֥יא יָקָ֛ר מִ/זּוֹלֵ֖ל כְּ/פִ֣/י תִֽהְיֶ֑ה יָשֻׁ֤בוּ הֵ֨מָּה֙ אֵלֶ֔י/ךָ וְ/אַתָּ֖ה לֹֽא תָשׁ֥וּב אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Se você voltar, eu o restaurarei[a] e você estará diante de mim. Se você extrair o que é precioso do que não tem valor[b], será como a minha boca[c]. Eles se voltarão para você, mas você não deve se voltar para eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você se arrepender, eu o restaurarei” ou “Se você voltar, eu o farei voltar”. O hebraico repete o verbo “voltar” para a resposta de Jeremias e para a ação restauradora de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: “Extrair o que é precioso do que não tem valor” provavelmente se refere a distinguir palavras dignas de palavras indignas; compare a frase seguinte, “será como a minha boca”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “será meu porta-voz”. Literalmente: “será como a minha boca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a conclusão decorrente da queixa anterior de Jeremias, preservando a ligação lógica e o tom profético.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro em português atual e preserva o nome divino como nome próprio.
- source_word: אִם תָּשׁוּב וַאֲשִׁיבְךָ
  choice: Se você voltar, eu o restaurarei
  rationale: Conserva a repetição conceitual do verbo hebraico שׁוּב, distinguindo a volta de Jeremias da ação restauradora de Yahweh sem limitar o sentido apenas a arrependimento ou deslocamento.
- source_word: לְפָנַי תַּעֲמֹד
  choice: você estará diante de mim
  rationale: Preserva a imagem concreta de estar diante de Yahweh, que no contexto pode incluir aceitação e serviço profético restaurados.
- source_word: וְאִם תּוֹצִיא יָקָר מִזּוֹלֵל
  choice: Se você extrair o que é precioso do que não tem valor
  rationale: Mantém a imagem de tirar ou separar o precioso do sem valor, em vez de reduzir o texto a uma paráfrase exclusivamente relacionada à fala.
- source_word: כְּפִי תִהְיֶה
  choice: será como a minha boca
  rationale: Reproduz a metáfora hebraica vívida; a ideia de falar com autoridade em nome de Deus é explicada em nota, não inserida no texto.
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ
  choice: Eles se voltarão para você
  rationale: Entende o imperfeito como promessa indicativa e conserva o sentido relacional e direcional de שׁוּב.
- source_word: וְאַתָּה לֹא תָשׁוּב אֲלֵיהֶם
  choice: mas você não deve se voltar para eles
  rationale: Expressa em português natural a proibição enfática e mantém o contraste com a volta deles para Jeremias.
theological_decisions:
- issue: O sentido da volta de Jeremias e de sua restauração
  choice: Manter a linguagem ampla de voltar e ser restaurado, permitindo que o contexto abranja tanto mudança de atitude e fala quanto renovação do serviço profético.
  alternative: Traduzir explicitamente como arrependimento moral ou apenas como renovação da comissão profética.
  rationale: A repetição de שׁוּב, seguida de estar diante de Yahweh e ser como sua boca, admite essas dimensões sem exigir que a tradução escolha somente uma.
- issue: O sentido de extrair o precioso do que não tem valor
  choice: Preservar a metáfora no texto principal, com nota sobre sua provável aplicação à fala de Jeremias.
  alternative: Parafrasear como falar somente palavras dignas ou interpretar como separar pessoas piedosas de ímpias.
  rationale: A menção imediata à boca favorece uma referência à fala profética, mas a formulação hebraica é mais ampla e não deve ser silenciosamente restringida.
- issue: A expressão ser como a boca de Yahweh
  choice: Conservar a metáfora literal no texto e esclarecer sua implicação funcional em nota.
  alternative: Substituí-la diretamente por “será meu porta-voz”.
  rationale: A metáfora comunica fala autorizada sem apagar a força concreta nem resolver além do necessário a relação entre o profeta e a palavra divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. O tratamento por “você” torna explícito o singular dirigido a Jeremias. A tradução conserva as imagens centrais do hebraico e usa notas breves para alternativas e implicações que não devem substituir a ambiguidade do texto principal.
