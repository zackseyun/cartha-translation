base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: pt
  text: E farei os seus inimigos passarem para uma terra que você nunca conheceu[a], pois um fogo se acendeu na minha ira; ele arderá contra vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme algumas versões antigas e o paralelo em Jeremias 17:4: “E farei você servir aos seus inimigos numa terra que você nunca conheceu.” O texto consonantal hebraico aqui diz “os seus inimigos”, mas a leitura alternativa pode refletir outra vocalização ou uma forma diferente do texto hebraico.'
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: E farei ... passarem
  rationale: O hifil de עבר tem sentido causativo, “fazer passar”. A construção preserva essa força e continua natural em português.
- source_word: אֶת אֹיְבֶיךָ
  choice: os seus inimigos
  rationale: O marcador de objeto direto seguido do substantivo plural com sufixo de segunda pessoa masculina singular significa literalmente “os seus inimigos”.
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: para uma terra que você não conhece
  rationale: Com um verbo de movimento, ב pode indicar destino. O presente idiomático “não conhece” expressa naturalmente a falta de experiência com essa terra, sem mudar o sentido do perfeito hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do juízo anunciado e mantém clara a ligação explicativa.
- source_word: אֵשׁ קָדְחָה
  choice: um fogo se acendeu
  rationale: Mantém a imagem literal do fogo e traduz o perfeito como uma ação já iniciada, preparando a continuação “arderá”.
- source_word: בְאַפִּי
  choice: na minha ira
  rationale: אַף significa literalmente “nariz”, mas é um idioma hebraico para ira. “Ira” é digno e adequado ao contexto de juízo.
- source_word: עֲלֵיכֶם תּוּקָד
  choice: ele arderá contra vocês
  rationale: O imperfeito de יקד indica a continuação do fogo. “Contra vocês” comunica o sentido judicial de עַל e torna explícito o plural do sufixo hebraico.
theological_decisions:
- issue: Mudança de número entre os sufixos singulares da primeira oração e o sufixo plural no fim
  choice: “seus/você” no singular e “vocês” no plural
  alternative: Uniformizar todos os pronomes no singular ou todos no plural
  rationale: O hebraico passa da segunda pessoa masculina singular para a plural, talvez do indivíduo representativo para o povo. A tradução conserva essa tensão em vez de harmonizá-la.
- issue: Objeto de וְהַעֲבַרְתִּי no texto massorético
  choice: “os seus inimigos” no texto principal
  alternative: “você servir aos seus inimigos” conforme versões antigas e o paralelo de Jeremias 17:4
  rationale: O texto consonantal preservado no WLC lê “os seus inimigos”. A variante antiga é relevante, mas não deve substituir silenciosamente a leitura massorética.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém o singular “você” e o plural “vocês” para refletir a mudança de número no hebraico. “Farei ... passarem” é deliberadamente formal o bastante para conservar a causatividade sem soar arcaico.
