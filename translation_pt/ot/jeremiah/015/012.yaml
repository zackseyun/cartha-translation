  text: Can iron break iron from the north[b][a], and bronze?
translation:
  language: pt
  text: Pode o ferro quebrar o ferro do norte[a] e o bronze[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pode o ferro despedaçar o ferro do norte e o bronze?” O hebraico é compacto, e “ferro do norte” pode funcionar como uma expressão única para um ferro especialmente resistente.'
