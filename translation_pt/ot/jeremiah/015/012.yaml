  - marker: b
    text: “Bronze” também pode ser traduzido como “cobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  choice: Pode … quebrar
  rationale: 'A partícula interrogativa הֲ e o verbo de רעע formam aqui uma pergunta retórica. Como se trata de metais, o sentido é físico: “quebrar” ou “despedaçar”, não “fazer o mal”. “Quebrar” é natural em português e preserva a força retórica.'
- source_word: בַּרְזֶל
  choice: ferro
  rationale: Equivalente português comum do nome desse metal.
- source_word: בַּרְזֶל מִצָּפוֹן
  choice: ferro do norte
  rationale: A expressão provavelmente se refere a um ferro especialmente resistente associado ao norte. A tradução mantém a construção hebraica sem explicar além do que o texto afirma.
- source_word: וּנְחֹשֶׁת
  choice: e o bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. Neste contexto de metais e materiais resistentes, “bronze” é a opção tradicional e provável; a conjunção é preservada, mantendo a formulação compacta do hebraico.
