  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: pt
  text: Por que a minha dor se tornou contínua, e a minha ferida, incurável, recusando-se a sarar? Será que tu serás mesmo para mim como um riacho enganoso[a], como águas que não são confiáveis?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um riacho que falha” — a imagem hebraica é a de um riacho que parece oferecer água, mas se mostra sem água quando ela é necessária.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי
  choice: a minha dor
  rationale: כאב designa dor ou sofrimento e, no lamento, permite tanto a dimensão física quanto a emocional.
- source_word: נֶצַח
  choice: contínua
  rationale: Aqui indica duração persistente, não a eternidade em sentido abstrato; “contínua” é natural e mantém a ideia de dor que não cessa.
- source_word: מַכָּתִי
  choice: a minha ferida
  rationale: Embora מכה também possa significar golpe, o adjetivo seguinte e a linguagem de cura favorecem “ferida”.
- source_word: אֲנוּשָׁה
  choice: incurável
  rationale: No contexto, o termo descreve algo grave e sem remédio; a cláusula sobre sarar confirma o sentido médico.
- source_word: מֵאֲנָה הֵרָפֵא
  choice: recusando-se a sarar
  rationale: Preserva a personificação hebraica da ferida que recusa a cura, em português corrente e expressivo.
- source_word: הָיוֹ תִהְיֶה לִי
  choice: Será que tu serás mesmo para mim
  rationale: A construção enfática introduz uma pergunta retórica incisiva dirigida a Deus; “mesmo” comunica a incredulidade sem exagerá-la.
- source_word: אַכְזָב
  choice: riacho enganoso
  rationale: O termo sugere uma corrente de água que decepciona ou falha quando se espera água; “enganoso” conserva a força acusatória da metáfora.
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: águas que não são confiáveis
  rationale: A expressão explica a metáfora como águas nas quais não se pode confiar e preserva o matiz de confiabilidade ligado à raiz אמן.
theological_decisions:
- issue: Queixa dirigida a Deus
  choice: Manter a pergunta acusatória de Jeremias diretamente dirigida a Deus.
  alternative: Abrandar a formulação para evitar a impressão de que Deus é comparado a uma fonte não confiável.
  rationale: O hebraico apresenta um lamento relacional ousado e não suaviza sua tensão teológica; a tradução deve preservá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tu” preserva a interpelação direta singular; “sarar” mantém a imagem concreta da ferida. O marcador [a] aparece junto à expressão explicada.
