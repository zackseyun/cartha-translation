  text: חֵילְ/ךָ֧ וְ/אוֹצְרוֹתֶ֛י/ךָ לָ/בַ֥ז אֶתֵּ֖ן לֹ֣א בִ/מְחִ֑יר וּ/בְ/כָל חַטֹּאותֶ֖י/ךָ וּ/בְ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: pt
  text: Entregarei sua riqueza e seus tesouros como despojo, sem pagamento algum[a], por causa de todos os seus pecados[b], em todo o seu território.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não por um preço”, isto é, sem compra nem compensação.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “em/com todos os seus pecados e em todas as suas fronteiras”; aqui, a primeira expressão é entendida como causal, e a segunda, como referente à extensão territorial.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: sua riqueza
  rationale: חַיִל/חֵיל pode indicar força, exército ou recursos materiais. O paralelismo com “tesouros” e o contexto de confisco favorecem o sentido econômico.
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: e seus tesouros
  rationale: O termo pode designar bens armazenados ou tesourarias; “tesouros” expressa naturalmente os bens que serão entregues ao saque.
- source_word: לָבַז אֶתֵּן
  choice: entregarei ... como despojo
  rationale: A construção com נתן anuncia que os bens serão entregues como presa de guerra. A ordem portuguesa torna a frase natural sem perder o valor profético do imperfeito.
- source_word: לֹא בִמְחִיר
  choice: sem pagamento algum
  rationale: A expressão significa literalmente “não por um preço” e indica que os bens serão tomados sem compra nem compensação.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: por causa de todos os seus pecados
  rationale: No contexto de juízo, a preposição ב pode ter força causal. A formulação explicita essa relação contextual sem acrescentar uma ideia estranha ao hebraico.
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: em todo o seu território
  rationale: גְּבוּל pode indicar fronteira ou a área delimitada por ela. Aqui, “território” comunica que o juízo alcançará toda a terra.
theological_decisions:
- issue: Valor das duas frases finais introduzidas pela preposição ב em um anúncio de juízo
  choice: A perda ocorre por causa dos pecados e alcança todo o território.
  alternative: Traduzir de modo mais formal como “com/em todos os seus pecados e em todas as suas fronteiras”.
  rationale: O contexto sustenta o valor causal da primeira frase e o valor locativo ou distributivo da segunda. A tradução preserva a lógica do anúncio de juízo, enquanto a nota registra a forma menos interpretativa do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Entregarei” soa natural no anúncio profético; “despojo” mantém o contexto de saque. O singular de segunda pessoa do hebraico é preservado por “sua/seus”, sem identificar além do texto o destinatário coletivo ou individual.
