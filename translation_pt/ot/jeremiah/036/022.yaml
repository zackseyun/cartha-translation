base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/022.yaml
  text: The king was sitting in the winter house in the ninth month[a], with the brazier burning before him.
translation:
  language: pt
  text: O rei estava sentado na residência de inverno, no nono mês, com o braseiro[a] aceso diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recipiente com fogo”; o termo hebraico se refere a um recipiente com brasas ou fogo, usado para aquecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: O rei
  rationale: O artigo definido hebraico é preservado. O וְ narrativo não precisa ser expresso no início desta frase em português, pois sua função de ligação pode ser suprida pelo contexto.
- source_word: יוֹשֵׁב
  choice: estava sentado
  rationale: O particípio apresenta a ação como situação em curso, por isso a forma perifrástica comunica adequadamente o aspecto durativo.
- source_word: בֵּית הַחֹרֶף
  choice: residência de inverno
  rationale: A expressão significa literalmente “casa de inverno”, isto é, uma residência usada na estação fria. “Residência” é natural em português e evita especificar indevidamente que se tratava de um palácio.
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: no nono mês
  rationale: Tradução direta e natural da expressão temporal, sem converter o mês hebraico em uma designação moderna.
- source_word: וְאֶת
  choice: com
  rationale: Neste contexto, introduz uma circunstância concomitante; “com” produz uma construção portuguesa idiomática sem alterar a relação sintática.
- source_word: הָאָח
  choice: um braseiro
  rationale: Designa um recipiente no qual se mantinham brasas ou fogo para aquecimento. O indefinido é natural em português na apresentação desse elemento da cena.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente espacial claro, corrente e adequado ao registro narrativo.
- source_word: מְבֹעָרֶת
  choice: aceso
  rationale: O particípio passivo feminino descreve o braseiro como estando aceso. Em português, “braseiro aceso” é mais idiomático do que “braseiro queimando”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem da cena e o aspecto durativo foram preservados. O marcador da nota foi colocado junto a “braseiro”, termo ao qual a alternativa lexical efetivamente se refere.
