base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: pt
  text: Então Micaías lhes contou todas as palavras que tinha ouvido quando Baruque leu o rolo para o povo ouvir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que tinha ouvido enquanto Baruque lia o rolo diante do povo”.'
    reason: Preserva a alternativa aspectual de בִּקְרֹא e oferece uma formulação alternativa para o contexto público de בְּאָזְנֵי הָעָם.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד indica comunicar ou relatar uma informação; “contou” é natural no contexto narrativo e não acrescenta formalidade indevida.
- source_word: לָהֶם
  choice: lhes
  rationale: Pronome objeto indireto que retoma as autoridades mencionadas no contexto.
- source_word: מִכָיְהוּ
  choice: Micaías
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: Preserva o sentido literal de דְּבָרִים e a ênfase recorrente de Jeremias nas palavras faladas e escritas.
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: que tinha ouvido
  rationale: O mais-que-perfeito composto deixa claro que Micaías ouviu as palavras antes de relatá-las.
- source_word: בִּקְרֹא
  choice: quando ... leu
  rationale: A preposição com o infinitivo construto expressa circunstância temporal; esta formulação é clara e idiomática em português.
- source_word: בָרוּךְ
  choice: Baruque
  rationale: Forma portuguesa tradicional e reconhecível do nome.
- source_word: בַּסֵּפֶר
  choice: o rolo
  rationale: סֵפֶר pode designar livro, documento ou rolo; em Jeremias 36, o referente é o rolo escrito por Baruque. O verbo “ler” em português pode tomar diretamente o documento por objeto.
- source_word: בְּאָזְנֵי הָעָם
  choice: diante do povo
  rationale: Expressa naturalmente o idioma hebraico de ler ao alcance dos ouvidos de uma audiência pública, sem a estranheza de uma tradução literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas nominais bíblicas usuais no Brasil e compreensíveis internacionalmente. A tradução mantém “todas as palavras” para refletir a formulação hebraica e usa “diante do povo” como equivalente idiomático.
