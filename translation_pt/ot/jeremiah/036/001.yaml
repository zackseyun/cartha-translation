source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שָּׁנָ֣ה הָ/רְבִיעִ֔ת לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: pt
  text: 'No quarto ano de Jeoaquim, filho de Josias, rei de Judá, veio a Jeremias esta palavra da parte de Yahweh:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[não expresso separadamente]'
  rationale: A forma introduz o novo cenário narrativo; em português atual, sua função discursiva é transmitida naturalmente pela oração temporal, sem acrescentar «Ora» ou a fórmula arcaizante «E aconteceu».
- source_word: בַּשָּׁנָה הָרְבִיעִת
  choice: No quarto ano
  rationale: Tradução direta e idiomática da expressão temporal.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ
  choice: de Jeoaquim, filho de Josias
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português; a vírgula favorece a leitura natural do aposto.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Equivalente corrente e direto do título real.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָהוּ
  choice: veio a Jeremias esta palavra
  rationale: Preserva a fórmula profética e a ressonância de דָּבָר como «palavra», sem reduzi-la apenas a «mensagem».
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Expressa com naturalidade a origem divina da palavra e translitera diretamente o nome divino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Como a fala começa no versículo seguinte, os dois-pontos cumprem em português a função introdutória de לֵאמֹר de modo mais natural do que o gerúndio «dizendo».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional «Jeová».
- issue: Sentido de הַדָּבָר na fórmula profética
  choice: palavra
  alternative: mensagem; assunto
  rationale: «Palavra» conserva tanto o sentido comunicativo quanto a ressonância teológica da revelação profética, sem eliminar a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem «veio a Jeremias esta palavra» mantém perceptível a fórmula profética sem soar excessivamente arcaica. Não há marcadores de nota, pois nenhuma nota é necessária para este versículo.
