revisions:
- from: 'Então todos os oficiais enviaram Jeudi, filho de Netanias, filho de Selemias, filho de Cusi, a Baruque, para dizer: “Pegue o rolo do qual você leu diante do povo, leve-o com você e venha.” Baruque, filho de Nerias, pegou o rolo e foi até eles.'
  to: 'Então todos os oficiais mandaram Jeudi, filho de Netanias, filho de Selemias, filho de Cusi, a Baruque, dizendo: “Pegue na mão o rolo que você leu em voz alta para o povo e venha.” Então Baruque, filho de Nerias, pegou o rolo na mão e foi até eles.'
  rationale: A revisão conserva as escolhas lexicais adequadas do rascunho, mas restaura o paralelismo referente ao rolo levado na mão e torna mais natural e explícita a formulação da mensagem e da leitura pública. «Venha» mantém apropriadamente a perspectiva dos oficiais no discurso direto, enquanto «foi até eles» mantém a perspectiva narrativa.
