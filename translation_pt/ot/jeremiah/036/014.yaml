  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: pt
  text: 'Então todos os oficiais mandaram Jeudi, filho de Netanias, filho de Selemias, filho de Cusi, a Baruque, dizendo: “Pegue na mão o rolo que você leu em voz alta para o povo e venha.” Então Baruque, filho de Nerias, pegou o rolo na mão e foi até eles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto da corte, שַׂר designa autoridades administrativas ou estatais; “oficiais” é claro e evita a ideia dinástica restrita de “príncipes”.
- source_word: יְהוּדִי
  choice: Jeudi
  rationale: A cadeia genealógica mostra que se trata de nome próprio, não do gentílico “judeu”.
- source_word: הַמְּגִלָּה
  choice: o rolo
  rationale: מְגִלָּה é um manuscrito enrolado; “rolo” é uma forma corrente e historicamente adequada em português bíblico.
- source_word: קָרָאתָ בָּהּ
  choice: do qual você leu
  rationale: קרא com ב indica aqui a leitura em voz alta a partir do texto escrito; “ler do rolo” expressa naturalmente a relação de fonte.
- source_word: בְּאָזְנֵי הָעָם
  choice: diante do povo
  rationale: O hebraico diz literalmente “aos ouvidos do povo”, enfatizando uma leitura pública audível; “diante do povo” transmite isso com naturalidade no contexto.
- source_word: קָחֶנָּה בְיָדְךָ
  choice: Pegue o rolo ... leve-o com você
  rationale: A expressão literal “tome-o em sua mão” ordena que Baruque leve pessoalmente o rolo; a formulação portuguesa evita rigidez sem perder essa ideia.
- source_word: וָלֵךְ
  choice: e venha
  rationale: Embora הלך signifique literalmente “ir”, no discurso direto de quem convoca alguém à sua própria localização, “venha” é o equivalente dêitico natural em português.
- source_word: בְּיָדוֹ
  choice: pegou o rolo
  rationale: A ideia de tê-lo em mãos está implícita no ato de pegá-lo e levá-lo; a redação evita uma repetição pouco natural em português.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: e foi até eles
  rationale: A perspectiva do narrador favorece “foi até eles”, enquanto o discurso direto usa naturalmente “venha” a partir da perspectiva dos oficiais.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os patronímicos seguem formas portuguesas tradicionais e coerentes: Jeudi, Netanias, Selemias, Cusi, Baruque e Nerias. A sintaxe foi suavizada sem eliminar a cadeia genealógica nem o caráter oficial da convocação.'
