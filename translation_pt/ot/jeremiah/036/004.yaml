  text: וַ/יִּקְרָ֣א יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ בֶּן נֵֽרִיָּ֑ה וַ/יִּכְתֹּ֨ב בָּר֜וּךְ מִ/פִּ֣י יִרְמְיָ֗הוּ אֵ֣ת כָּל דִּבְרֵ֧י יְהוָ֛ה אֲשֶׁר דִּבֶּ֥ר אֵלָ֖י/ו עַל מְגִלַּת סֵֽפֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: pt
  text: Então Jeremias chamou Baruque, filho de Nerias, e Baruque escreveu, conforme Jeremias ditava[a], todas as palavras de Yahweh que ele lhe havia falado, num rolo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da boca de Jeremias”, isto é, enquanto Jeremias ditava.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “num rolo de livro”, expressão que designa um rolo para escrita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto, קרא indica chamar alguém para junto de si. “Chamou” é natural e não acrescenta a força mais intensa de “convocou”.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruque, filho de Nerias
  rationale: Usam-se as formas portuguesas tradicionais e amplamente reconhecidas dos nomes, com a relação familiar expressa de modo claro.
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: Reproduz diretamente o sentido básico do verbo כתב, sem a expansão interpretativa “registrou por escrito”.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: conforme Jeremias ditava
  rationale: A expressão literal “da boca de Jeremias” indica que Baruque escrevia o que Jeremias pronunciava. A tradução comunica naturalmente essa relação em português, enquanto a imagem hebraica é preservada em nota.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: “Palavras” preserva o caráter concreto da mensagem profética, e o nome divino é transliterado como “Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: que ele lhe havia falado
  rationale: 'Mantém os pronomes do hebraico e a referência mais natural: Yahweh havia falado essas palavras a Jeremias. A formulação evita acrescentar a ideia de que Deus falou “por meio dele”.'
- source_word: עַל מְגִלַּת סֵפֶר
  choice: num rolo
  rationale: A expressão designa um rolo usado como documento escrito. “Num rolo” é claro e idiomático; a forma mais literal fica registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título “SENHOR”.
- issue: Referente dos pronomes em אֲשֶׁר דִּבֶּר אֵלָיו
  choice: “ele” refere-se naturalmente a Yahweh, e “lhe” a Jeremias
  alternative: 'Explicitar: “que Yahweh havia falado a Jeremias”'
  rationale: A redação mantém a estrutura pronominal e a leve ambiguidade formal do hebraico, sem impor uma leitura de que Yahweh falou por intermédio de Jeremias.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada para fluência, sem alterar as relações do texto hebraico.
