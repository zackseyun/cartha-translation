source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: pt
  text: Aconteceu que, no quinto ano de Jeoaquim, filho de Josias, rei de Judá, no nono mês, proclamaram um jejum diante de Yahweh para todo o povo em Jerusalém e para todo o povo que vinha das cidades de Judá para Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Reproduz de modo natural a fórmula narrativa hebraica sem recorrer ao arcaísmo «E sucedeu».
- source_word: בַשָּׁנָה הַחֲמִשִׁית
  choice: no quinto ano
  rationale: Tradução direta da fórmula cronológica formada por preposição, substantivo e ordinal.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: de Jeoaquim, filho de Josias, rei de Judá
  rationale: A preposição לְ integra a fórmula de datação pelo reinado; os nomes seguem suas formas portuguesas bíblicas correntes.
- source_word: בַּחֹדֶשׁ הַתְּשִׁעִי
  choice: no nono mês
  rationale: Mantém a notação calendárica concisa do hebraico, sem acrescentar «do ano».
- source_word: קָרְאוּ צוֹם
  choice: proclamaram um jejum
  rationale: A combinação idiomática de קרא com צום indica a convocação pública de um jejum. A terceira pessoa do plural sem sujeito expresso preserva a indefinição do agente no hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa a realização do jejum perante Deus; Yahweh representa diretamente o nome divino יהוה.
- source_word: כָּל הָעָם בִּירוּשָׁלָם
  choice: todo o povo que estava em Jerusalém
  rationale: Explicita em português o valor locativo de בְּ e evita sugerir que se tratava apenas dos habitantes nativos da cidade.
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: e para todo o povo que vinha das cidades de Judá para Jerusalém
  rationale: O particípio הַבָּאִים é vertido por uma ação em curso, e a sequência contextual é expressa naturalmente como movimento das cidades de Judá para Jerusalém.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. «Yahweh» preserva sua função de nome divino sem substituí-lo por um título.
- issue: Relação de לִפְנֵי com o jejum
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: «Diante de» conserva a imagem relacional e cultual da expressão hebraica sem explicar além do que o texto afirma.
- issue: Identidade de quem proclamou o jejum
  choice: proclamaram, com sujeito não expresso
  alternative: o povo proclamou / foi proclamado
  rationale: O verbo hebraico está na terceira pessoa do plural, mas não identifica o agente. A construção portuguesa mantém essa indefinição e não atribui a proclamação ao próprio povo reunido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a repetição de «todo o povo» para refletir os dois grupos distinguidos no hebraico. Não se usa nota textual porque o versículo não exige uma variante ou esclarecimento indispensável.
