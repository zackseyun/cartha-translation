  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Aconteceu que» e o sujeito indeterminado em «proclamaram» são naturais. «Todo o povo em Jerusalém» é mais conciso e idiomático do que «todo o povo que estava em Jerusalém».
  terminology: «Jeoaquim», «Josias», «Judá» e «Yahweh» são consistentes. «Diante de Yahweh» representa adequadamente לִפְנֵי יהוה, sem ampliar seu sentido.
