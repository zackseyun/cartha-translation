  to: Aconteceu que, no quinto ano de Jeoaquim, filho de Josias, rei de Judá, no nono mês, proclamaram um jejum diante de Yahweh para todo o povo em Jerusalém e para todo o povo que vinha das cidades de Judá para Jerusalém.
  rationale: A revisão limita-se a substituir a oração relativa com imperfeito por uma expressão locativa direta, preservando a abrangência do primeiro grupo e evitando acrescentar aspecto verbal ao hebraico. Mantêm-se o sujeito não expresso de «proclamaram», a distinção entre os dois grupos e a transliteração do nome divino.
