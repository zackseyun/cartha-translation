  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: pt
  text: E, sempre que Yehudi lia três ou quatro colunas[a], ele cortava essa parte com a faca do escriba e a jogava no fogo que estava no braseiro[b], até que todo o rolo fosse consumido no fogo que estava no braseiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “três ou quatro portas”; aqui o termo se refere a divisões do rolo, provavelmente suas colunas ou painéis.
    reason: lexical_alternative
  - marker: b
    text: Ou “recipiente para fogo” ou “lareira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: sempre que ... lia
  rationale: 'A construção temporal, junto com a sequência narrativa, descreve uma ação repetida: após a leitura de cada trecho, seguia-se o corte e a queima.'
- source_word: יְהוּדִי
  choice: Jeudi
  rationale: Forma portuguesa corrente do nome hebraico, preservando-o como nome próprio.
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: três ou quatro colunas
  rationale: Embora דְּלָתוֹת signifique literalmente «portas», aqui designa divisões sucessivas do texto em um rolo, provavelmente colunas ou painéis.
- source_word: יִקְרָעֶהָ
  choice: ele cortava essa parte
  rationale: O verbo pode significar «rasgar», mas a menção da faca indica corte. «Essa parte» comunica naturalmente em português que o trecho recém-lido era separado, sem inserir um sujeito explícito além do pronome ambíguo do contexto.
- source_word: בְּתַעַר הַסֹּפֵר
  choice: com a faca do escriba
  rationale: תַּעַר designa uma lâmina ou navalha; no contexto do corte de um rolo, «faca» é a forma mais clara. סֹפֵר é mantido como «escriba».
- source_word: וְהַשְׁלֵךְ
  choice: e a jogava
  rationale: Expressa em português atual a ação repetida de lançar no fogo cada parte cortada.
- source_word: הָאָח
  choice: braseiro
  rationale: O termo designa um recipiente ou estrutura para manter fogo em ambiente interno; «braseiro» se ajusta ao cenário e permanece acessível ao leitor moderno.
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: até que todo o rolo fosse consumido
  rationale: A expressão marca o término da destruição do rolo; «fosse consumido» explicita de modo idiomático o resultado evidente da queima sucessiva.
- source_word: הַמְּגִלָּה
  choice: rolo
  rationale: מְגִלָּה é um documento escrito em forma de rolo; «rolo» é uma equivalência portuguesa direta e natural.
- source_word: אֶל הָאֵשׁ אֲשֶׁר אֶל הָאָח / עַל הָאֵשׁ אֲשֶׁר עַל הָאָח
  choice: no fogo que estava no braseiro / pelo fogo do braseiro
  rationale: A tradução comunica a relação espacial de maneira idiomática, sem reproduzir mecanicamente a pequena variação das preposições hebraicas.
theological_decisions:
- issue: Identidade do sujeito de יִקְרָעֶהָ e וְהַשְׁלֵךְ
  choice: manter apenas «ele», sem identificar o agente
  alternative: explicitar «o rei» ou entender que «Jeudi» continua como sujeito
  rationale: O hebraico não declara um novo sujeito nesses verbos. Manter o pronome preserva a ambiguidade formal e evita importar uma identificação a partir do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição do processo foi preservada por «sempre que» e pelos verbos no imperfeito. O pronome «ele» mantém sem resolução a identidade do agente, que não é expressa no verbo hebraico.
