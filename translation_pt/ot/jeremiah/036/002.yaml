  source_fidelity: A tradução transmite corretamente a ordem de tomar um rolo, escrever nele todas as palavras divinas e a abrangência Israel–Judá–nações. Contudo, a segunda expressão temporal com מִן («desde os dias de Josias») deve ser mantida explicitamente; «nos dias de Josias» enfraquece a repetição e a relação de início temporal expressa no hebraico.
  naturalness: 'O texto é claro e de registro apropriado. A sequência temporal fica mais natural e mais fiel com um travessão explicativo: «desde o dia em que lhe falei — desde os dias de Josias — até hoje».'
  terminology: «Rolo», «palavras», «Israel», «Judá» e «nações» são escolhas adequadas. «A respeito de» preserva de modo não tendencioso a amplitude de עַל; a nota mantém apropriadamente a leitura alternativa «contra».
