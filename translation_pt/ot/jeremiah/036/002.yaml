source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: pt
  text: Pegue um rolo e escreva nele todas as palavras que eu lhe falei a respeito de Israel, de Judá e de todas as nações[a], desde o dia em que lhe falei — desde os dias de Josias — até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra Israel, contra Judá e contra todas as nações”. A preposição hebraica pode ter um ou outro desses sentidos em contextos proféticos.'
    reason: Leitura alternativa decorrente da amplitude semântica de עַל.
lexical_decisions:
- source_word: קַח לְךָ
  choice: Pegue
  rationale: O imperativo pede ação pessoal de Jeremias. Em português, “Pegue” já comunica isso naturalmente; explicitar “para você” seria pouco idiomático e poderia sugerir posse.
- source_word: מְגִלַּת סֵפֶר
  choice: um rolo
  rationale: A expressão construta designa um rolo destinado à escrita. “Rolo” é claro no contexto e evita a formulação excessivamente literal “rolo de livro”.
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: e escreva nele
  rationale: O perfeito com waw dá continuidade imperativa à ordem inicial. O pronome retoma “rolo”, masculino em português.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: Embora דְּבָרִים também possa significar “coisas” ou “assuntos”, o contexto de registro da revelação profética favorece “palavras”.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: que eu lhe falei
  rationale: Mantém a referência à comunicação divina dirigida a Jeremias em português natural, sem acrescentar uma distinção aspectual que o hebraico não exige.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: a respeito de Israel, de Judá e de todas as nações
  rationale: עַל pode indicar o assunto ou ter força adversativa em contexto profético. “A respeito de” preserva a referência ampla sem restringir todas as palavras a anúncios de juízo; a alternativa é registrada em nota.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם se refere aqui às nações estrangeiras coletivamente; “nações” é a equivalência contextual mais direta e atual.
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ
  choice: desde o dia em que falei com você
  rationale: מִן marca o ponto inicial do período. “Desde o dia” expressa esse início com naturalidade.
- source_word: מִימֵי יֹאשִׁיָּהוּ
  choice: nos dias de Josias
  rationale: A expressão identifica historicamente quando ocorreu o início já indicado por “desde o dia”. Em português, “nos dias de Josias” evita a repetição pouco fluida de dois complementos consecutivos introduzidos por “desde”.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressa com clareza o limite final do período indicado por עַד.
theological_decisions:
- issue: Sentido de עַל na enumeração de Israel, Judá e todas as nações
  choice: a respeito de Israel, de Judá e de todas as nações
  alternative: contra Israel, contra Judá e contra todas as nações
  rationale: O versículo resume todas as palavras divinas comunicadas durante um longo período, não apenas anúncios de juízo. A tradução principal mantém o sentido temático mais amplo, enquanto a nota preserva a possível força adversativa própria de muitos contextos proféticos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhe falei” evita excesso de formalidade, enquanto “com você” explicita de modo natural o destinatário singular. A repetição hebraica da preposição foi suavizada sem apagar a estrutura enumerativa.
