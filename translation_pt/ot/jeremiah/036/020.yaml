base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: pt
  text: Então eles foram até o rei, no pátio, e deixaram o rolo guardado na sala de Elisama, o escriba. E relataram ao rei[a] todas as palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos ouvidos do rei”; isto é, em sua presença ou para que ele ouvisse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: Então eles foram até o rei, no pátio
  rationale: O wayyiqtol dá continuidade à narrativa; o ה direcional em חָצֵרָה indica movimento em direção ao pátio. Em português, a construção identifica naturalmente o local onde estava o rei sem sugerir que o pátio fosse uma segunda destinação independente.
- source_word: וְאֶת־הַמְּגִלָּה הִפְקִדוּ
  choice: depois de deixar o rolo guardado
  rationale: O hifil de פקד, neste contexto, expressa colocar ou deixar algo sob guarda. A formulação portuguesa comunica tanto a anterioridade lógica dessa ação quanto a ideia de custódia, sem reduzir o sentido a mero depósito físico.
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  choice: na sala de Elisama, o escriba
  rationale: לִשְׁכָּה designa uma sala ou câmara, muitas vezes de função oficial. 'Sala' é corrente e digna em português; 'escriba' preserva o título tradicional, embora 'secretário' seja contextualmente possível.
- source_word: וַיַּגִּידוּ
  choice: E relataram
  rationale: O hifil de נגד significa contar, informar ou relatar. 'Relataram' combina com o contexto formal da corte e mantém a sequência narrativa explícita.
- source_word: בְּאָזְנֵי הַמֶּלֶךְ
  choice: ao rei
  rationale: A expressão hebraica é literalmente 'aos ouvidos do rei', um modo idiomático de dizer que comunicaram algo em sua presença. 'Ao rei' transmite isso com naturalidade em português.
- source_word: אֵת כָּל־הַדְּבָרִים
  choice: tudo o que havia sido dito
  rationale: דְּבָרִים pode significar palavras, declarações ou assuntos. Aqui aponta para o conteúdo anteriormente lido; esta formulação evita a possível impressão de que os oficiais recitaram necessariamente cada palavra do rolo, preservando a referência ao relato ouvido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. 'Rolo' é preferido a 'pergaminho' porque o termo hebraico indica o formato do documento, não seu material. A longa cadeia hebraica foi dividida em duas frases para fluidez, sem alterar a sequência dos acontecimentos.
