  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑הוּ אַחֲרֵ֣י שְׂרֹ֣ף הַ/מֶּ֗לֶךְ אֶת הַ/מְּגִלָּה֙ וְ/אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֨ר כָּתַ֥ב בָּר֛וּךְ מִ/פִּ֥י יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeremias, depois que o rei queimou o rolo e as palavras que Baruque havia escrito conforme Jeremias ditava[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da boca de Jeremias”.
    reason: A nota preserva a imagem hebraica subjacente à tradução idiomática “conforme Jeremias ditava”.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Então a palavra de Yahweh veio a Jeremias
  rationale: A construção narrativa introduz o acontecimento seguinte; “Então” expressa a progressão com naturalidade. “Palavra” conserva a fórmula profética, e o nome divino é transliterado como “Yahweh”.
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: depois que o rei queimou
  rationale: A preposição com infinitivo construto forma uma oração temporal e situa a queima antes da chegada da palavra divina.
- source_word: הַמְּגִלָּה
  choice: o rolo
  rationale: מְגִלָּה designa um documento escrito enrolado; “rolo” é claro e corrente em português bíblico.
- source_word: וְאֶת הַדְּבָרִים
  choice: e as palavras
  rationale: Mantém a distinção do hebraico entre o objeto físico, o rolo, e seu conteúdo verbal.
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ
  choice: que Baruque havia escrito
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da escrita em relação à queima.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: conforme Jeremias ditava
  rationale: O idioma literal “da boca de Jeremias” indica que Baruque escreveu a partir da fala de Jeremias. A tradução explicita essa relação de modo natural, enquanto a forma literal fica registrada em nota.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O dois-pontos introduz naturalmente, em português, a fala divina que começa no versículo seguinte, sem exigir o menos idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva diretamente o nome divino em vez de substituí-lo por um título.
- issue: Relação entre a fala de Jeremias e a escrita de Baruque
  choice: conforme Jeremias ditava
  alternative: da boca de Jeremias
  rationale: O hebraico preserva a origem oral das palavras e sugere ditado sem detalhar o processo. A tradução comunica essa relação; a nota conserva a expressão literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rolo” e “palavra de Yahweh” preservam o vocabulário concreto e profético; o dois-pontos prepara a continuação no versículo seguinte.
