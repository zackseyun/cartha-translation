base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/025.yaml
  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: pt
  text: No entanto, até mesmo Elnatã, Delaías e Gemarias suplicaram[a] ao rei que não queimasse o rolo, mas ele não lhes deu ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “insistiram com o rei que não queimasse o rolo”.'
    reason: Alternativa lexical para o apelo insistente expresso por הִפְגִּעוּ.
lexical_decisions:
- source_word: וְגַם
  choice: Mesmo assim
  rationale: No contexto, a combinação introduz a intervenção adicional desses oficiais com valor levemente contrastivo. “Mesmo assim” comunica com naturalidade que eles tentaram impedir o ato apesar da hostilidade já demonstrada.
- source_word: הִפְגִּעוּ בַמֶּלֶךְ
  choice: suplicaram ao rei
  rationale: O hifil de פגע com ב designa aqui um apelo insistente dirigido ao rei. “Suplicaram ao rei” preserva a intensidade melhor que o mais neutro “pediram”.
- source_word: לְבִלְתִּי שְׂרֹף
  choice: que não queimasse
  rationale: A construção expressa o conteúdo negativo do apelo. Em português, a oração com “que” e subjuntivo é natural depois de “suplicaram”.
- source_word: הַמְּגִלָּה
  choice: o rolo
  rationale: מְגִלָּה indica um rolo escrito. “Rolo” é claro e adequado ao objeto material no contexto narrativo.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: mas ele não lhes deu ouvidos
  rationale: O valor contextual da conjunção é adversativo. A expressão idiomática “não lhes deu ouvidos” comunica que o rei não atendeu ao apelo, preservando o sentido de שׁמע com אֶל.
