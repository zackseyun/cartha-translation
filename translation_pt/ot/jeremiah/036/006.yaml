base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: pt
  text: Então, vá você mesmo e leia, no rolo que você escreveu conforme eu lhe ditava[a], as palavras de Yahweh diante do povo, na casa de Yahweh[b], em um dia de jejum. Leia-as também diante de todos os habitantes de Judá que vêm de suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que escreveu da minha boca”; isto é, conforme eu lhe ditava.
    reason: lexical_alternative
  - marker: b
    text: A “casa de Yahweh” refere-se ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: Portanto, vá você mesmo
  rationale: O waw com o qatal dá continuidade à instrução com força de ordem; o pronome explícito אַתָּה acrescenta ênfase, preservada por “você mesmo”. “Vá” expressa naturalmente o deslocamento de Baruque até o templo.
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: e leia no rolo
  rationale: Com um documento escrito como complemento, קרא significa ler, e o contexto público deixa claro que se trata de leitura em voz alta. A preposição ב é preservada naturalmente como “no rolo”.
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: que escreveu conforme eu lhe ditava
  rationale: A expressão hebraica é literalmente “que escreveu da minha boca”. A formulação escolhida comunica em português corrente que Baruque registrou as palavras pronunciadas por Jeremias, enquanto a forma literal é preservada em nota.
- source_word: אֶת דִּבְרֵי יְהוָה
  choice: as palavras de Yahweh
  rationale: Mantém o objeto direto e verte o nome divino como nome próprio, sem substituí-lo por um título.
- source_word: בְּאָזְנֵי הָעָם
  choice: diante do povo
  rationale: O idioma hebraico significa literalmente “aos ouvidos do povo” e indica uma leitura pública audível. “Diante do povo” é natural em português e preserva a situação comunicativa.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de Yahweh”; uma nota esclarece que ela designa o templo.
- source_word: בְּיוֹם צוֹם
  choice: em um dia de jejum
  rationale: A construção indefinida descreve a ocasião de um jejum, sem identificar necessariamente uma festa ou data fixa.
- source_word: בְּאָזְנֵי כָל יְהוּדָה
  choice: diante de todo o povo de Judá
  rationale: Aqui “todo Judá” tem sentido coletivo, referindo-se aos judeus presentes, e não apenas ao território. A explicitação “povo de” evita ambiguidade em português.
- source_word: הַבָּאִים מֵעָרֵיהֶם
  choice: que vier de suas cidades
  rationale: O particípio designa os que chegam das diversas cidades de Judá. O singular coletivo concorda naturalmente com “todo o povo” em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituir o nome por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta e as repetições essenciais foram mantidas, enquanto os idiomas hebraicos foram vertidos de modo natural. Os marcadores aparecem imediatamente após as expressões que explicam.
