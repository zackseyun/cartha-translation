  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: pt
  text: Talvez a súplica deles seja apresentada diante de Yahweh[a], e cada um se converta do seu mau caminho[b], pois grande é a ira e o furor que Yahweh anunciou contra este povo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a súplica deles caia diante de Yahweh”; trata-se de uma expressão para apresentar um apelo diante dele.
    reason: lexical_alternative
  - marker: b
    text: Ou “e cada homem se afaste do seu mau caminho”. O hebraico usa uma forma masculina singular com sentido distributivo.
    reason: lexical_alternative
  - marker: c
    text: Ou “que Yahweh anunciou a este povo”. No contexto, “contra este povo” ressalta que se trata de um anúncio de juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez
  rationale: Preserva o sentido de possibilidade e esperança, sem indicar certeza.
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: a súplica deles seja apresentada diante de Yahweh
  rationale: Comunica em português natural a expressão idiomática hebraica, literalmente «caia diante de Yahweh», isto é, que o pedido seja levado à sua presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְיָשֻׁבוּ
  choice: e ... se converta
  rationale: No contexto de abandonar o mau caminho, «converter-se» expressa o movimento de voltar-se ou mudar de rumo, embora «afastar-se» também seja possível.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz a força distributiva do singular hebraico em português corrente; a forma hebraica é literalmente «cada homem».
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: do seu mau caminho
  rationale: Mantém a metáfora bíblica do caminho como conduta e traduz רָעָה de modo direto.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão da exortação implícita.
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  choice: grande é a ira e o furor
  rationale: Conserva os dois termos hebraicos sobrepostos, bem como a intensificação retórica.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: que Yahweh anunciou contra este povo
  rationale: «Anunciou» funciona com o conteúdo de juízo pressuposto; «contra» explicita o valor contextual, enquanto a preposição hebraica pode ser traduzida formalmente como «a».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio; a transliteração o preserva sem substituí-lo por um título.
- issue: Força do verbo שׁוב no contexto moral
  choice: se converta do seu mau caminho
  alternative: se afaste do seu mau caminho; volte do seu mau caminho
  rationale: A escolha comunica mudança de direção moral sem usar diretamente o termo mais abstrato «arrepender-se»; a nota registra uma alternativa mais concreta.
- issue: Direção do anúncio divino em אֶל הָעָם הַזֶּה
  choice: contra este povo
  alternative: a este povo
  rationale: O contexto é de juízo e favorece «contra», mas a construção hebraica admite formalmente «a»; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem marcada «grande é» conserva a ênfase hebraica sem soar excessivamente arcaica. As notas preservam a imagem literal da súplica que «cai», a forma distributiva masculina e a ambiguidade da preposição אֶל.
