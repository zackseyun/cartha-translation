  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: pt
  text: 'E, a respeito de Jeoaquim, rei de Judá, você dirá: “Assim diz Yahweh: Você queimou este rolo, dizendo: ‘Por que você escreveu nele que o rei da Babilônia certamente virá, destruirá esta terra e eliminará dela seres humanos e animais?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: E, a respeito de
  rationale: Com o verbo de fala, introduz a pessoa a quem se refere o oráculo; evita transformar a preposição, por si só, em ‘contra’, embora o conteúdo seja acusatório.
- source_word: תֹּאמַר
  choice: você dirá
  rationale: O imperfeito de segunda pessoa masculina singular tem força de instrução dirigida a Jeremias; o futuro em português preserva essa força diretiva.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional e verte diretamente o nome divino.
- source_word: שָׂרַפְתָּ
  choice: Você queimou
  rationale: O perfeito hebraico aponta para o ato concluído de Jeoaquim; o pretérito perfeito é direto e natural em português.
- source_word: הַמְּגִלָּה הַזֹּאת
  choice: este rolo
  rationale: מְגִלָּה designa um documento escrito enrolado; ‘rolo’ é historicamente adequado e corrente no registro bíblico.
- source_word: כָּתַבְתָּ עָלֶיהָ
  choice: você escreveu nele
  rationale: Expressa naturalmente em português a escrita registrada no rolo, sem reproduzir de modo rígido a preposição hebraica.
- source_word: בֹּא יָבוֹא
  choice: certamente virá
  rationale: A construção de infinitivo absoluto com verbo finito intensifica a certeza da vinda.
- source_word: וְהִשְׁחִית
  choice: destruirá
  rationale: O hifil de שׁחת indica causar destruição; a coordenação em futuro soa natural dentro da citação em português.
- source_word: וְהִשְׁבִּית מִמֶּנָּה
  choice: e eliminará dela
  rationale: שׁבת no hifil significa fazer cessar ou remover; ‘eliminará dela’ comunica a extinção da presença de habitantes e animais.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Reproduz o alcance coletivo da fórmula hebraica de devastação total em linguagem moderna e clara.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; ‘Yahweh’ preserva o nome pactual e segue a orientação do projeto sem substituir o nome por um título.
- issue: Alcance de אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  alternative: homem e animal
  rationale: Aqui אָדָם tem sentido coletivo na fórmula de devastação abrangente. A escolha preserva esse alcance sem sugerir apenas indivíduos masculinos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa inteligibilidade brasileira. Mantém a estrutura de discurso encaixado por meio de aspas e conserva a ênfase verbal hebraica em ‘certamente virá’.
