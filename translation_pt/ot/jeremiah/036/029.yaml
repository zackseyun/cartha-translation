  source_fidelity: A tradução preserva adequadamente a construção do oráculo dirigido a Jeoaquim, a acusação por ter queimado o rolo, a pergunta citada e a ênfase de certeza em «certamente virá». «Eliminará dela seres humanos e animais» transmite de modo fiel o efeito causativo de וְהִשְׁבִּית e o alcance abrangente da fórmula אָדָם וּבְהֵמָה.
  naturalness: O português é moderno, claro e apropriado ao registro profético, com boa legibilidade brasileira e internacional. «Rolo» é uma designação historicamente e biblicamente natural para מְגִלָּה.
  terminology: «Yahweh» segue a decisão do projeto para o Tetragrama. Os nomes próprios, «Jeoaquim», «Judá» e «Babilônia», estão corretos. A opção inclusiva «seres humanos e animais» comunica bem o sentido coletivo da fórmula hebraica sem introduzir interpretação doutrinária.
