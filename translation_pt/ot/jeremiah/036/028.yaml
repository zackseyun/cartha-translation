base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: pt
  text: Pegue para você outro rolo[a] e escreva nele todas as palavras anteriores que estavam no primeiro rolo, o qual Jeoaquim, rei de Judá, queimou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Volte a pegar para você outro rolo”. O hebraico começa com um imperativo que significa “voltar” e, junto de “pegar”, expressa a ideia de fazer isso novamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: Pegue para você
  rationale: שׁוּב, literalmente ligado à ideia de voltar ou repetir, funciona aqui com o imperativo קַח, dando o sentido de pegar novamente. Em português natural, a repetição já é sugerida por “outro rolo”; a nota preserva a forma mais explícita. לְךָ é mantido como “para você”.
- source_word: מְגִלָּה אַחֶרֶת
  choice: outro rolo
  rationale: מְגִלָּה designa um rolo usado como suporte de escrita, e אַחֶרֶת significa “outro”. “Rolo” é claro e historicamente adequado neste contexto.
- source_word: וּכְתֹב עָלֶיהָ
  choice: e escreva nele
  rationale: Mantém a continuação imperativa e traduz naturalmente a referência ao rolo, substantivo masculino em português.
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: todas as palavras anteriores
  rationale: דְּבָרִים refere-se aqui às palavras ou ao conteúdo escrito. הָרִאשֹׁנִים indica aquilo que veio antes; “anteriores” evita sugerir apenas as palavras iniciais do texto.
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: que estavam no primeiro rolo
  rationale: A oração identifica as palavras como as que constavam do rolo original. Em português, escreve-se naturalmente “no” rolo.
- source_word: אֲשֶׁר שָׂרַף
  choice: o qual ... queimou
  rationale: O relativo retoma o primeiro rolo, e שָׂרַף é traduzido diretamente por “queimou”, sem intensificação adicional.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jeoaquim, rei de Judá
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecida do nome, com o título real em aposição.
