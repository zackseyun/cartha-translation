base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: pt
  text: Eu o punirei, bem como seus descendentes e seus servos, pela iniquidade deles; e trarei sobre eles, sobre os habitantes de Jerusalém e sobre cada homem de Judá[a], toda a calamidade que falei contra eles, mas não me deram ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem de Judá”. A expressão está no singular distributivo e tem forma masculina; também pode ser traduzida de modo coletivo como “todos em Judá” ou “o povo de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: Punirei a ele
  rationale: Neste contexto judicial, פקד com עַל indica uma visitação punitiva. A construção com pronome preposicionado mantém a ênfase no rei e permite coordenar naturalmente os demais alvos da punição.
- source_word: זַרְעוֹ
  choice: seus descendentes
  rationale: זֶרַע designa aqui a posteridade, não semente em sentido literal. “Descendentes” é claro, atual e preserva o sentido coletivo.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte real, עֶבֶד se refere adequadamente aos subordinados ou oficiais do rei; “servos” evita especificar escravidão sem apoio contextual suficiente.
- source_word: אֶת עֲוֺנָם
  choice: pela iniquidade deles
  rationale: עָוֹן expressa a culpa ou perversidade que motiva a punição. “Iniquidade” preserva o peso moral, e “deles” deixa claro que o hebraico é plural.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: e trarei sobre eles
  rationale: הביא על é uma expressão comum para fazer vir juízo ou calamidade sobre alguém. A formulação portuguesa é natural e próxima da imagem hebraica.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: O particípio substantivado indica aqueles que moram na cidade; “habitantes” é conciso e corrente.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: sobre cada homem de Judá
  rationale: אִישׁ está no singular distributivo e é masculino em forma. “Cada homem” conserva essa particularidade, enquanto “sobre” reflete o paralelismo com os alvos anteriores da calamidade.
- source_word: כָּל הָרָעָה
  choice: toda a calamidade
  rationale: רָעָה, neste oráculo de juízo, indica desgraça ou calamidade, e não maldade moral. “Calamidade” é digna, clara e adequada ao registro profético.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: que anunciei contra eles
  rationale: O verbo significa literalmente falar, mas o conteúdo é uma ameaça de juízo. “Anunciei contra eles” comunica a força judicial sem acrescentar detalhes doutrinários.
- source_word: וְלֹא שָׁמֵעוּ
  choice: pois não me deram ouvidos
  rationale: שׁמע abrange ouvir, atender e obedecer. A expressão idiomática “dar ouvidos” preserva a recusa deliberada de acolher a advertência; “pois” explicita a relação causal natural no contexto.
theological_decisions:
- issue: Alcance de אִישׁ יְהוּדָה
  choice: cada homem de Judá
  alternative: todo o povo de Judá / todos em Judá
  rationale: A tradução conserva o singular distributivo e a forma masculina do hebraico, sem generalizá-los silenciosamente. Uma nota registra as alternativas coletivas naturais em português.
- issue: Sentido de שׁמע na conclusão
  choice: não me deram ouvidos
  alternative: não ouviram / não obedeceram
  rationale: A expressão escolhida mantém aberta a sobreposição hebraica entre ouvir atentamente e obedecer, sem reduzir o verbo a apenas um desses sentidos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação separa a punição pessoal da enumeração mais ampla dos destinatários da calamidade. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
