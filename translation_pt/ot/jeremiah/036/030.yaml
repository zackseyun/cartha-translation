  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh a respeito de Jeoaquim, rei de Judá: “Ele não terá ninguém que se assente no trono de Davi, e seu cadáver será jogado fora, exposto ao calor[a] de dia e à geada de noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à seca de dia”. A palavra hebraica traduzida como “calor” também pode indicar secura ou seca.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural em português a consequência do juízo anunciado no contexto anterior.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética solene e preserva o nome divino presente no hebraico.
- source_word: עַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: a respeito de Jeoaquim, rei de Judá
  rationale: A preposição introduz o destinatário ou objeto do oráculo; a formulação preserva a amplitude do hebraico sem intensificá-la para 'contra'.
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: Ele não terá ninguém que se assente no trono de Davi
  rationale: Reproduz o sentido da construção hebraica sem acrescentar explicitamente 'descendente', embora essa relação dinástica seja plausível no contexto.
- source_word: נִבְלָתוֹ
  choice: seu cadáver
  rationale: Termo claro e digno que conserva a referência inequívoca ao corpo morto e a indignidade do juízo.
- source_word: מֻשְׁלֶכֶת
  choice: será jogado fora
  rationale: Comunica em linguagem atual a ideia passiva de ser lançado e descartado de maneira desonrosa.
- source_word: לַחֹרֶב בַּיּוֹם
  choice: exposto ao calor de dia
  rationale: No contexto de um cadáver sem sepultura e em paralelo com a geada noturna, 'calor' expressa bem a exposição ambiental, enquanto a nota preserva a alternativa lexical 'seca'.
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: à geada de noite
  rationale: Preserva a imagem concreta de gelo ou geada e o contraste entre dia e noite.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal segundo a convenção indicada pelo projeto, sem substituí-lo por um título.
- issue: Identidade daquele que se assentaria no trono de Davi
  choice: ninguém que se assente
  alternative: nenhum descendente que se assente
  rationale: A referência dinástica a um descendente é provável, mas o substantivo 'descendente' não aparece de forma explícita; a tradução conserva a formulação mais aberta do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação 'jogado fora, exposto' torna natural a relação entre o descarte desonroso do cadáver e sua exposição às condições extremas, sem suavizar o juízo.
