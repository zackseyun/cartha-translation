  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: pt
  text: Micaías, filho de Gemarias, filho de Safã, ouviu todas as palavras de Yahweh a partir do rolo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O imperfeito consecutivo narra um acontecimento passado. “Ouviu” expressa naturalmente a recepção oral da leitura.
- source_word: מִכָיְהוּ
  choice: Micaías
  rationale: Emprega-se a forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: filho de Gemarias, filho de Safã
  rationale: A cadeia patronímica hebraica é preservada para identificar Micaías com precisão.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: Mantém-se a abrangência de כָּל, o substantivo concreto “palavras” e o nome divino presente no texto hebraico.
- source_word: מֵעַל הַסֵּפֶר
  choice: lidas do rolo
  rationale: No contexto, as palavras foram ouvidas porque eram lidas a partir do documento. “Rolo” corresponde ao suporte escrito antigo, e “lidas” explicita a relação implícita sem mudar o sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome divino, não um título. “Yahweh” o representa diretamente e evita substituí-lo silenciosamente por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada e o particípio implícito “lidas” foi empregado para evitar a formulação pouco natural “ouviu... do rolo”.
