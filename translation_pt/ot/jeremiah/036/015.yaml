  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: pt
  text: 'E disseram-lhe: “Por favor, sente-se e leia o rolo para nós ouvirmos.” Então Baruque o leu para eles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos nossos ouvidos” e “aos ouvidos deles”, expressão hebraica que significa ler de modo que nós ou eles ouvissem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: E disseram-lhe
  rationale: O waw consecutivo dá prosseguimento à narrativa. “E disseram-lhe” conserva a sequência de modo natural e digno em português.
- source_word: שֵׁב נָא
  choice: Por favor, sente-se
  rationale: O imperativo שֵׁב significa aqui “sentar-se”, e נָא comunica cortesia ou pedido, expresso naturalmente por “por favor”.
- source_word: וּקְרָאֶנָּה
  choice: e leia o rolo
  rationale: Neste contexto, קרא significa ler um texto escrito. O sufixo feminino retoma o rolo mencionado anteriormente; explicitá-lo evita uma referência pronominal pouco clara em português.
- source_word: בְּאָזְנֵינוּ
  choice: para nós ouvirmos
  rationale: A expressão literalmente significa “em nossos ouvidos” e indica que a leitura devia ser feita de maneira audível aos presentes. A formulação escolhida transmite o sentido idiomático em português corrente.
- source_word: וַיִּקְרָא בָרוּךְ
  choice: Então Baruque o leu
  rationale: “Então” marca naturalmente a progressão narrativa e a resposta de Baruque ao pedido, sem impor uma relação causal mais forte do que o hebraico exige.
- source_word: בְּאָזְנֵיהֶם
  choice: para eles
  rationale: No contexto de “leu”, a expressão comunica que Baruque fez a leitura para que eles a ouvissem. A forma concisa evita uma repetição pesada, enquanto a nota registra o idioma hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Rolo” explicita o referente contextual do sufixo feminino hebraico. A expressão idiomática ligada aos ouvidos foi vertida de modo natural, com seu sentido literal preservado em nota.
