source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: pt
  text: Talvez a casa de Judá ouça falar de toda a desgraça que estou planejando trazer sobre eles[a], para que cada um abandone o seu mau caminho[b], e perdoarei a iniquidade e o pecado deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a calamidade”. O hebraico também pode ser traduzido literalmente por “todo o mal”; neste contexto, porém, refere-se à desgraça do juízo anunciado contra Judá, não a maldade moral da parte de Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem”. A forma masculina singular é usada de modo representativo para os membros de Judá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez
  rationale: Preserva a possibilidade e a esperança implícitas, sem apresentar como certo o resultado esperado.
- source_word: יִשְׁמְעוּ
  choice: ouça falar de
  rationale: Neste contexto, o objeto é o anúncio da desgraça futura. A expressão é natural em português e não antecipa a resposta de obediência indicada na oração seguinte.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Mantém a expressão corporativa e pactual do hebraico, em vez de reduzi-la simplesmente a um território.
- source_word: אֵת כָּל הָרָעָה
  choice: toda a desgraça
  rationale: Aqui רָעָה designa a calamidade do juízo ameaçado, e não maldade moral da parte de Deus.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: estou planejando trazer sobre eles
  rationale: O particípio com infinitivo comunica intenção em curso; 'trazer sobre eles' expressa naturalmente a aplicação da calamidade anunciada.
- source_word: לְמַעַן יָשׁוּבוּ
  choice: para que ... abandone
  rationale: Preserva a finalidade da oração e, junto de 'mau caminho', comunica a ideia profética de voltar-se para longe da conduta pecaminosa sem substituir o verbo por um termo teológico mais interpretativo.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: cada um abandone o seu mau caminho
  rationale: O singular distributivo hebraico tem alcance representativo. 'Cada um' é natural e inclusivo em português, enquanto 'seu mau caminho' conserva a imagem profética da conduta pessoal.
- source_word: וְסָלַחְתִּי
  choice: então perdoarei
  rationale: O contexto apresenta o perdão como sequência da conversão esperada. 'Então' torna clara essa relação natural em português sem impor uma formulação doutrinária além do texto.
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: a sua iniquidade e o seu pecado
  rationale: Mantém distintos os dois termos morais do hebraico e concorda com o coletivo singular 'casa de Judá'.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: No contexto, a palavra se refere ao desastre que Deus ameaça trazer como juízo, não a maldade moral praticada por Deus. 'Desgraça' preserva o peso do anúncio e evita essa ambiguidade indevida.
- issue: Força de שׁוב na resposta esperada
  choice: abandone o seu mau caminho
  alternative: volte do seu mau caminho; arrependa-se
  rationale: A tradução mantém a metáfora de mudança de direção definida pelo próprio complemento, sem reduzir o verbo a um termo técnico nem produzir uma construção pouco natural em português.
- issue: Singular masculino representativo אִישׁ
  choice: cada um
  alternative: cada homem; todos
  rationale: Em português, 'cada um' conserva o valor singular e distributivo do hebraico e inclui naturalmente os membros da comunidade, sem afirmar que o referente se limita aos homens.
- issue: Relação entre conversão e perdão
  choice: então perdoarei
  alternative: e perdoarei
  rationale: A sequência contextual liga o abandono do mau caminho ao perdão prometido. 'Então' explicita essa progressão discursiva, sem definir de modo mais amplo a mecânica teológica do perdão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém 'casa de Judá' e 'iniquidade' por sua importância literária e teológica, mas emprega sintaxe corrente. Os marcadores [a] e [b] aparecem no texto principal.
