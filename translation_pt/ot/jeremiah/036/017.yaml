  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: pt
  text: 'E perguntaram a Baruque: “Por favor, conte-nos como você escreveu todas estas palavras ditadas por ele.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da boca dele”, isto é, conforme Jeremias as ditava oralmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּרוּךְ שָׁאֲלוּ
  choice: E perguntaram a Baruque
  rationale: A ordem natural em português identifica Baruque como a pessoa interrogada; “E” mantém a sequência narrativa do hebraico.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: O infinitivo hebraico é uma fórmula que introduz a fala. Em português atual, os dois-pontos comunicam essa função com mais naturalidade do que “dizendo”.
- source_word: הַגֶּד נָא לָנוּ
  choice: Por favor, conte-nos
  rationale: O imperativo de נגד pede que Baruque relate ou explique, e נָא acrescenta um tom cortês de solicitação.
- source_word: אֵיךְ כָּתַבְתָּ
  choice: como você escreveu
  rationale: Expressa diretamente a pergunta sobre o modo como a escrita foi realizada; “você” oferece legibilidade brasileira ampla sem perder dignidade.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Embora דְּבָרִים também possa significar “coisas” ou “assuntos”, o contexto de fala profética registrada por escrito favorece “palavras”.
- source_word: מִפִּיו
  choice: ditadas por ele
  rationale: A expressão literal “da boca dele” indica que Baruque escreveu a partir da fala oral de Jeremias. “Ditadas por ele” comunica naturalmente esse sentido em português, enquanto a nota preserva a imagem hebraica e esclarece o referente.
