  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: pt
  text: Então Baruque leu no rolo as palavras de Jeremias, na casa de Yahweh[a], na sala de Gemarias, filho de Safã, o escriba, no pátio superior, à entrada do portão novo da casa de Yahweh, aos ouvidos de todo o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo de Yahweh”. A expressão hebraica é, literalmente, “na casa de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: leu
  rationale: Com בַּסֵּפֶר, o verbo קרא indica a leitura em voz alta de um documento; em português, “leu” é natural, e o final do versículo deixa explícito o caráter público e audível.
- source_word: בַּסֵּפֶר
  choice: no rolo
  rationale: סֵפֶר designa aqui o rolo escrito ditado por Jeremias. A preposição ב é mantida naturalmente em português como “no rolo”, isto é, lendo o conteúdo nele registrado.
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: as palavras de Jeremias
  rationale: Preserva de modo direto a construção hebraica e a dicção profética.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh”, que no contexto se refere ao templo e suas dependências; uma nota oferece a alternativa lexical mais explícita.
- source_word: בְּלִשְׁכַּת
  choice: na sala de
  rationale: לִשְׁכָּה é uma sala ou dependência oficial do complexo do templo. “Sala” é claro e atual em português, sem a conotação residencial que “câmara” pode adquirir.
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן
  choice: Gemarias, filho de Safã
  rationale: Os nomes são transliterados em formas portuguesas reconhecíveis, e o patronímico hebraico é preservado.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: סֹפֵר pode indicar escriba ou secretário administrativo; “escriba” preserva o título amplo sem especificar mais do que o texto.
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: no pátio superior
  rationale: חָצֵר designa um pátio; “pátio superior” comunica com clareza a localização arquitetônica.
- source_word: פֶּתַח שַׁעַר ... הֶחָדָשׁ
  choice: à entrada do portão novo
  rationale: Traduz diretamente a indicação espacial e o adjetivo חָדָשׁ. “Portão” distingue a grande entrada do complexo de uma porta comum.
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: para que todo o povo ouvisse
  rationale: A expressão literal “aos ouvidos de todo o povo” indica leitura pública e audível. A formulação escolhida transmite esse sentido de modo natural, sem reduzir o público a uma assembleia formal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio יהוה. “Yahweh” o representa como nome divino, em vez de substituí-lo por um título; a nota esclarece que a expressão arquitetônica também pode ser vertida como “templo de Yahweh”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das indicações de lugar acompanha de perto o hebraico, enquanto “para que todo o povo ouvisse” verte o idioma hebraico de maneira natural. A aposição “o escriba” foi mantida formalmente ambígua quanto a se referir a Safã ou a Gemarias, como permite a estrutura da fonte.
