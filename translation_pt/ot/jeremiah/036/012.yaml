  text: וַ/יֵּ֤רֶד בֵּית הַ/מֶּ֨לֶךְ֙ עַל לִשְׁכַּ֣ת הַ/סֹּפֵ֔ר וְ/הִ֨נֵּה שָׁ֔ם כָּל הַ/שָּׂרִ֖ים יֽוֹשְׁבִ֑ים אֱלִישָׁמָ֣ע הַ/סֹּפֵ֡ר וּ/דְלָיָ֣הוּ בֶן שְׁ֠מַעְיָהוּ וְ/אֶלְנָתָ֨ן בֶּן עַכְבּ֜וֹר וּ/גְמַרְיָ֧הוּ בֶן שָׁפָ֛ן וְ/צִדְקִיָּ֥הוּ בֶן חֲנַנְיָ֖הוּ וְ/כָל הַ/שָּׂרִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: pt
  text: 'Ele desceu ao palácio do rei, à sala do escriba. Ali estavam sentados todos os oficiais: o escriba Elisama, Delaías, filho de Semaías, Elnatã, filho de Acbor, Gemarias, filho de Safã, Zedequias, filho de Hananias, e todos os demais oficiais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: palácio do rei
  rationale: Embora literalmente seja «casa do rei», no contexto designa a residência e sede administrativa real; «palácio do rei» comunica isso naturalmente.
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: à sala do escriba
  rationale: לִשְׁכָּה indica uma sala ou câmara dentro de um complexo; «sala» é corrente e apropriado ao contexto administrativo.
- source_word: הַשָּׂרִים
  choice: oficiais
  rationale: Aqui שָׂרִים se refere a altos funcionários da corte, não necessariamente a príncipes de linhagem real.
- source_word: וְהִנֵּה שָׁם
  choice: Ali estavam
  rationale: Reproduz de modo natural a função apresentativa de וְהִנֵּה no relato, sem o arcaísmo «e eis que».
- source_word: וְכָל הַשָּׂרִים
  choice: e todos os demais oficiais
  rationale: A repetição após a lista indica que outros oficiais também estavam presentes; «demais» torna essa relação explícita sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Os nomes seguem formas portuguesas tradicionais e reconhecíveis. A repetição hebraica de «todos os oficiais» foi preservada semanticamente por «todos os demais oficiais», evitando a impressão de que a lista fosse exaustiva.
