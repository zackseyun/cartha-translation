base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: pt
  text: Então o rei enviou Jeudi para buscar o rolo[a]. Ele o retirou da sala de Elisama, o escrivão[b], e o leu para o rei e para todos os oficiais[c] que estavam de pé junto do rei[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pegar o rolo”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto administrativo da corte, “escrivão” também pode ser traduzido como “secretário”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “aos ouvidos do rei e aos ouvidos de todos os oficiais”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “acima do rei”; aqui, a expressão provavelmente se refere aos oficiais que permaneciam junto dele ou o assistiam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou
  rationale: No contexto, o rei envia Jeudi com uma incumbência; “mandou ... buscar” expressa naturalmente em português tanto o envio quanto a finalidade.
- source_word: יְהוּדִי
  choice: Jeudi
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: לָקַחַת
  choice: buscar
  rationale: Como infinitivo de finalidade depois de “mandou”, indica que Jeudi deveria ir apanhar e trazer o rolo. “Buscar” é natural nesse contexto, sem excluir o sentido mais literal de “pegar”.
- source_word: הַמְּגִלָּה
  choice: o rolo
  rationale: Refere-se a um documento escrito em forma de rolo; esta é a equivalência histórica clara e corrente em português.
- source_word: וַיִּקָּחֶהָ
  choice: o pegou
  rationale: Representa diretamente o verbo לקח e o sufixo feminino referente ao rolo, com formulação natural em português.
- source_word: מִלִּשְׁכַּת
  choice: na sala de
  rationale: לִשְׁכָּה designa uma sala ou aposento, aqui dentro de um ambiente administrativo da corte. “Sala” é claro e atual.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Forma portuguesa reconhecível do nome próprio hebraico.
- source_word: הַסֹּפֵר
  choice: o escrivão
  rationale: סֹפֵר pode designar alguém encarregado da escrita e dos documentos oficiais. “Escrivão” mantém esse conteúdo lexical, enquanto “secretário” continua sendo alternativa contextual possível.
- source_word: וַיִּקְרָאֶהָ
  choice: o leu
  rationale: Com um texto escrito como objeto, קרא significa ler; o contexto deixa claro que a leitura foi feita em voz alta.
- source_word: בְּאָזְנֵי
  choice: para o rei e para todos os oficiais
  rationale: A expressão idiomática significa que eles ouviram a leitura. A construção com “para” comunica isso de modo natural, e a nota preserva a imagem hebraica literal.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto da corte, שׂרים são autoridades ou altos funcionários, não necessariamente príncipes de sangue real.
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: que estavam de pé junto do rei
  rationale: Mantém o particípio “estavam de pé” e traduz מֵעַל segundo seu provável sentido cortesão de proximidade ou assistência, sem sugerir superioridade sobre o rei.
