  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: pt
  text: Então Jeremias pegou outro rolo e o entregou a Baruque, filho de Nerias, o escriba. Baruque escreveu nele, conforme Jeremias ditava[a], todas as palavras do rolo que Jeoaquim, rei de Judá, havia queimado no fogo. Além disso, muitas palavras semelhantes foram acrescentadas a elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “da boca de Jeremias”.'
    reason: A nota preserva a imagem do idioma hebraico por trás da tradução contextual “conforme Jeremias ditava”.
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: outro rolo
  rationale: מְגִלָּה designa aqui um rolo escrito; “rolo” é concreto, historicamente adequado e natural em português. אַחֶרֶת acrescenta “outro”.
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: o entregou a Baruque
  rationale: נתן com אֶל expressa a entrega do rolo a Baruque. “Entregou” torna a ação clara sem acrescentar uma nuance técnica.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: סֹפֵר pode indicar um escritor profissional ou secretário oficial. “Escriba” preserva o ofício histórico e se ajusta ao contexto de redação do rolo.
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: Baruque escreveu nele
  rationale: Baruque é o referente natural do sujeito verbal. Repetir o nome evita a ambiguidade que o pronome “ele” criaria em português; עַל indica escrita sobre/no rolo.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: conforme Jeremias ditava
  rationale: A expressão literal “da boca de Jeremias” é um idioma que, neste contexto, indica que Baruque registrou oralmente as palavras de Jeremias. A tradução idiomática é clara, e a imagem hebraica fica registrada em nota.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: todas as palavras do rolo
  rationale: Embora סֵפֶר também possa significar “livro”, o referente concreto neste contexto é o rolo queimado e substituído. “Palavras” preserva דִּבְרֵי sem reduzir o conteúdo a uma ideia geral.
- source_word: אֲשֶׁר שָׂרַף יְהוֹיָקִים מֶלֶךְ יְהוּדָה בָּאֵשׁ
  choice: que Jeoaquim, rei de Judá, havia queimado no fogo
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da queima em relação à nova redação. “No fogo” reproduz naturalmente בָּאֵשׁ.
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם
  choice: Além disso, ... foram acrescentadas a elas
  rationale: 'O nifal de יסף tem sentido passivo: material adicional foi acrescentado. “Além disso” expressa וְעוֹד com naturalidade.'
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  choice: muitas palavras semelhantes
  rationale: כָּהֵמָּה significa “como elas” ou “semelhantes a elas”. A formulação escolhida é natural e mantém a comparação sem especificar indevidamente o conteúdo.
