  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: pt
  text: 'Então Baruque lhes respondeu: “Ele me ditava de viva voz todas estas palavras, e eu as escrevia no rolo com tinta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם בָּרוּךְ
  choice: Então Baruque lhes respondeu
  rationale: O wayyiqtol dá continuidade à narrativa; no contexto de uma pergunta anterior, “respondeu” expressa naturalmente a função de וַיֹּאמֶר sem alterar o sentido.
- source_word: מִפִּיו יִקְרָא אֵלַי
  choice: Ele me ditava de viva voz
  rationale: קרא significa normalmente “ler”, “chamar” ou “proclamar”, mas aqui descreve a enunciação oral que Baruque registra. “Ditava” comunica a função contextual, enquanto “de viva voz” preserva a referência concreta a מִפִּיו, “da sua boca”.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Neste contexto, דְּבָרִים são as palavras proféticas pronunciadas e registradas por escrito.
- source_word: וַאֲנִי כֹּתֵב
  choice: e eu as escrevia
  rationale: O particípio כֹּתֵב apresenta a escrita como ação em curso ou repetida concomitante ao ditado; o imperfeito português reproduz esse aspecto naturalmente. O pronome “as” retoma “palavras”.
- source_word: עַל הַסֵּפֶר
  choice: no rolo
  rationale: סֵפֶר designa aqui o rolo ou documento em que Baruque escrevia, não um livro encadernado moderno. Em português, escreve-se naturalmente “no rolo”.
- source_word: בַּדְּיוֹ
  choice: com tinta
  rationale: 'A preposição בְּ tem valor instrumental ou material: a escrita foi feita com tinta.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “De viva voz” evita a formulação pouco idiomática “da sua boca”, preservando a oralidade explícita do hebraico; “ditava” torna clara a relação entre a fala e o registro escrito.
