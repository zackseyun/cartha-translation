base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: pt
  text: 'Quando ouviram todas as palavras, ficaram com medo e olharam uns para os outros[a]. Então disseram a Baruque: “Certamente contaremos ao rei todas estas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “ficaram com medo, cada um para o seu companheiro”, um idiomatismo que expressa uma reação temerosa e mútua. Também pode ser traduzido: “cada um olhou com medo para o seu companheiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Quando ouviram
  rationale: A construção narrativa introduz uma circunstância temporal. Em português, “Quando ouviram” transmite isso com naturalidade, sem reproduzir de modo rígido o idiomatismo “e aconteceu que”.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: No contexto da leitura do rolo, דְּבָרִים se refere às palavras ou à mensagem lida, não genericamente a “coisas”. A ausência do demonstrativo nesta primeira ocorrência foi preservada.
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: ficaram com medo e olharam uns para os outros
  rationale: O verbo expressa medo, enquanto o idiomatismo distributivo indica uma reação mútua entre os homens. A formulação portuguesa torna visível essa reação sem eliminar a ambiguidade, registrada em nota.
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: Então disseram a Baruque
  rationale: “Então” marca com naturalidade a progressão da narrativa, e “disseram” preserva o sentido simples do verbo.
- source_word: הַגֵּיד נַגִּיד
  choice: Certamente contaremos
  rationale: O infinitivo absoluto seguido do imperfeito da mesma raiz intensifica a declaração. A primeira pessoa do plural indica a decisão dos oficiais de relatar o conteúdo, e “certamente” conserva a ênfase sem transformar a frase em ordem dirigida somente a Baruque.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: A referência é definida e aponta para o rei que governava naquele contexto.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: “Palavras” corresponde ao conteúdo do rolo, e “estas” preserva o demonstrativo presente nesta segunda ocorrência.
