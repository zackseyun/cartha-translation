  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: pt
  text: 'Então as autoridades disseram a Baruque: “Vá, esconda-se, você e Jeremias, e que ninguém saiba onde vocês estão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: O termo designa altos agentes do governo ou da corte. “Autoridades” é claro e atual, sem o sentido dinástico que “príncipes” poderia sugerir.
- source_word: לֵךְ
  choice: Vá
  rationale: O imperativo de הלך é reproduzido de modo direto e idiomático.
- source_word: הִסָּתֵר
  choice: esconda-se
  rationale: O imperativo nifal de סתר indica que Baruque deve ocultar a si mesmo; a forma reflexiva portuguesa preserva essa força.
- source_word: אַתָּה וְיִרְמְיָהוּ
  choice: você e Jeremias
  rationale: Mantém o pronome hebraico explícito e enfático, incluindo Jeremias na ordem dada diretamente a Baruque.
- source_word: וְאִישׁ אַל יֵדַע
  choice: e que ninguém saiba
  rationale: אִישׁ sob negação tem valor indefinido, “ninguém”, e a construção com subjuntivo preserva naturalmente a proibição volitiva.
- source_word: אֵיפֹה אַתֶּם
  choice: onde vocês estão
  rationale: O pronome plural refere-se conjuntamente a Baruque e Jeremias; “vocês” torna explícito esse plural em português brasileiro corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a sequência de imperativos, o destaque dado a Baruque e a referência plural final, sem acrescentar explicações ao texto.
