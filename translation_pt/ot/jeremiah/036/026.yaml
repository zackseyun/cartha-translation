  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: pt
  text: Então o rei ordenou a Jerameel, filho do rei, a Seraías, filho de Azriel, e a Selemias, filho de Abdeel, que capturassem Baruque, o escriba, e Jeremias, o profeta, mas Yahweh os escondeu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem investida de autoridade; “ordenou” preserva essa força e soa natural no contexto real.
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: Jerameel, filho do rei
  rationale: Mantém explicitamente a relação indicada por בן המלך, sem substituí-la pelo título interpretativo “príncipe”.
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: Seraías, filho de Azriel
  rationale: Emprega as formas portuguesas correntes dos nomes e reproduz diretamente a identificação patronímica.
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: Selemias, filho de Abdeel
  rationale: Emprega formas portuguesas reconhecíveis e preserva a construção patronímica do hebraico.
- source_word: לָקַחַת
  choice: que prendessem
  rationale: Embora לקח signifique literalmente “tomar”, aqui a ordem é capturar Baruque e Jeremias. “Prender” comunica a apreensão hostil sem pressupor todos os elementos de um processo judicial moderno.
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: Baruque, o escriba
  rationale: “Escriba” é o equivalente tradicional e transparente de סֹפֵר neste contexto literário e administrativo.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: Jeremias, o profeta
  rationale: Tradução direta do nome e do título נביא, preservando a função declarada no texto.
- source_word: וַיַּסְתִּרֵם
  choice: os escondeu
  rationale: O hifil de סתר com sufixo de terceira pessoa plural apresenta Yahweh como aquele que os fez ficar ocultos; “os escondeu” é direto e idiomático.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa como nome e evita substituí-lo por um título, sem introduzir interpretação denominacional.
- issue: Agência divina no ocultamento
  choice: Mas Yahweh os escondeu
  alternative: Mas eles ficaram escondidos por Yahweh
  rationale: A forma verbal hebraica é ativa e tem Yahweh como sujeito; a tradução conserva de modo explícito essa agência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação dos três encarregados foi mantida, e o plural “prendessem” torna explícito em português que a ordem foi dada ao grupo. Não foram aproveitadas as notas da camada inglesa porque seus marcadores e conteúdos não correspondem aos pontos marcados; o hebraico não exige nota neste versículo.
