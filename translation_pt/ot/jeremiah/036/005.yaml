  text: וַ/יְצַוֶּ֣ה יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ לֵ/אמֹ֑ר אֲנִ֣י עָצ֔וּר לֹ֣א אוּכַ֔ל לָ/ב֖וֹא בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/005.yaml
  text: Then Jeremiah commanded Baruch[a], saying, “I am restrained; I cannot go into the house of Yahweh.”
translation:
  language: pt
  text: 'Então Jeremias ordenou a Baruque, dizendo: “Estou impedido[a] e não posso entrar na casa de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “detido”, “confinado” ou “impossibilitado”. O hebraico não esclarece a natureza exata da restrição de Jeremias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: ordenou
  rationale: O piel de צוה expressa uma ordem ou incumbência; “ordenou” preserva sua força diretiva.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem naturalmente a fala direta e representam a função discursiva de לֵאמֹר sem a formulação mais pesada “dizendo”.
- source_word: עָצוּר
  choice: impedido
  rationale: O adjetivo passivo de עצר indica que Jeremias está sendo detido ou impossibilitado de ir, sem especificar se a causa é prisão, restrição oficial, impedimento ritual ou outra circunstância.
- source_word: לֹא אוּכַל
  choice: não posso
  rationale: Equivalente idiomático direto da forma negada de יכל, exprimindo incapacidade.
- source_word: לָבוֹא
  choice: entrar
  rationale: No contexto de בֵּית יְהוָה, refere-se a entrar no templo ou em seus recintos; “entrar” é claro e natural.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH”, compreensível no contexto como o templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” conserva o nome da aliança sem substituí-lo por um título, enquanto “Jeová” reflete uma forma tradicional posterior.
- issue: Natureza da restrição de Jeremias
  choice: Estou impedido
  alternative: Estou preso; estou confinado
  rationale: O texto não declara a causa nem a forma exata do impedimento. A tradução evita concluir que Jeremias estivesse encarcerado ou submetido a uma restrição específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala é introduzida por dois-pontos, solução idiomática para לֵאמֹר. Mantém-se “casa de Yahweh” para preservar a imagem hebraica, sem perder a referência ao templo.
