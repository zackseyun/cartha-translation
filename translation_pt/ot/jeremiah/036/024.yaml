  yaml_path: translation/ot/jeremiah/036/024.yaml
  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: pt
  text: Mas nem o rei nem nenhum de seus servos que ouviram todas estas palavras tiveram medo nem rasgaram as suas vestes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as vestes era, no antigo Oriente Próximo, um sinal costumeiro de tristeza, horror ou arrependimento.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא פָחֲדוּ
  choice: não ficaram com medo
  rationale: A forma verbal expressa medo ou temor. A formulação é natural em português moderno e não intensifica indevidamente o sentido.
- source_word: וְלֹא קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: ou rasgaram as próprias roupas
  rationale: A coordenação negativa em português pede naturalmente «nem... nem... ou» neste período. «Roupas» traduz בְּגָדִים com clareza; «as próprias» explicita de modo idiomático o sufixo possessivo reflexivo no contexto.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: וְכָל־עֲבָדָיו
  choice: nem nenhum dos seus servos
  rationale: Sob o alcance da negação, «nenhum» comunica que nem sequer um dos servos reagiu assim. «Servos» mantém o termo amplo para subordinados reais, sem impor a ideia específica de escravidão.
- source_word: הַשֹּׁמְעִים
  choice: que ouviram
  rationale: O particípio atributivo identifica os servos que ouviram a leitura; o pretérito perfeito é conciso e natural.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: todas essas palavras
  rationale: Embora דְּבָרִים também possa significar «coisas» ou «assuntos», o contexto da leitura do rolo favorece «palavras».
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura com «Mas» transmite o valor adversativo contextual de וְ, e a estrutura negativa preserva a ênfase de que nem o rei nem qualquer de seus servos demonstraram medo ou a reação cultural esperada.
