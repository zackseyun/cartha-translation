  source_fidelity: A tradução reproduz adequadamente a dupla negação, os participantes (o rei e seus servos), a audição de «todas estas palavras» e o gesto de rasgar as vestes. Contudo, «ou rasgaram» não exprime de modo seguro a segunda negação explícita do hebraico; a construção deve usar «nem» também antes do segundo verbo.
  naturalness: «Nem ... nem ... tiveram medo nem rasgaram as suas vestes» é natural, claro e mantém um registro narrativo digno em português atual. «Vestes» é mais apropriado ao contexto literário do que «roupas», sem perder inteligibilidade.
  terminology: «Servos» permanece uma boa opção ampla para עֲבָדָיו no contexto da corte. «Vestes» traduz bem בְּגָדִים e preserva o valor cultural do gesto, explicado na nota.
