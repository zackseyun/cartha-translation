  text: וַ/יַּ֗עַשׂ בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יִרְמְיָ֣הוּ הַ/נָּבִ֑יא לִ/קְרֹ֥א בַ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה בֵּ֥ית יְהֹוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: pt
  text: 'E Baruque, filho de Nerias, fez tudo o que o profeta Jeremias lhe havia ordenado: leu no rolo as palavras do SENHOR, na casa do SENHOR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כְּכֹל
  choice: fez tudo o que
  rationale: Expressa naturalmente a ideia hebraica de cumprir integralmente o que foi ordenado.
- source_word: לִקְרֹא בַסֵּפֶר
  choice: leu no rolo
  rationale: O infinitivo hebraico explicita o conteúdo da ordem; em português, o verbo finito após dois-pontos comunica essa relação com clareza. סֵפֶר, neste contexto, designa o rolo no qual as palavras foram escritas.
- source_word: דִּבְרֵי יְהוָה
  choice: as palavras do SENHOR
  rationale: Mantém o plural do hebraico e segue a convenção portuguesa de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: בֵּית יְהוָה
  choice: na casa do SENHOR
  rationale: Tradução formal da expressão hebraica; no contexto, refere-se ao templo, sem substituir a imagem lexical do original.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida, preservando graficamente a distinção do nome divino mediante versaletes, sem impor uma vocalização reconstruída.
- issue: Relação sintática de לִקְרֹא com a ordem de Jeremias
  choice: apresentar a leitura como cumprimento da ordem, após dois-pontos
  alternative: “para ler no rolo”
  rationale: O infinitivo pode indicar o conteúdo ou propósito da ordem. A formulação escolhida conserva essa ligação e evita uma construção portuguesa ambígua ou pouco natural.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente e legibilidade brasileira. Mantêm-se os nomes tradicionais Baruque, Nerias e Jeremias, bem como a expressão bíblica “casa do SENHOR”.
