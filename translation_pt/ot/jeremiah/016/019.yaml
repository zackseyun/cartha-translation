base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: pt
  text: 'Ó Yahweh, minha força e minha fortaleza,

    meu refúgio no dia da aflição,

    a ti virão as nações dos confins da terra

    e dirão:

    “Certamente, nossos pais[a] herdaram apenas mentira,

    coisas vazias[b] em que não há proveito algum.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico hebel pode significar “vaidade”, “vazio” ou “futilidade”. No contexto, pode aludir a ídolos inúteis, mas o termo é mais amplo; a frase final afirma que não há proveito nessas coisas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עֻזִּי
  choice: minha força
  rationale: Equivalente direto e natural do substantivo que denota força ou poder.
- source_word: מָעֻזִּי
  choice: minha fortaleza
  rationale: Conserva a imagem de um lugar fortificado que oferece segurança e evita confundi-lo com o termo seguinte.
- source_word: מְנוּסִי
  choice: meu refúgio
  rationale: Expressa naturalmente o lugar para onde alguém foge em busca de proteção.
- source_word: בְּיוֹם צָרָה
  choice: no dia da aflição
  rationale: Mantém a expressão temporal hebraica e comunica uma ocasião de grave angústia.
- source_word: גּוֹיִם
  choice: as nações
  rationale: É a designação ampla dos povos estrangeiros; o artigo torna a construção natural em português.
- source_word: מֵאַפְסֵי אָרֶץ
  choice: desde os confins da terra
  rationale: Reproduz o idioma referente às regiões mais remotas do mundo.
- source_word: אַךְ
  choice: De fato
  rationale: Comunica a força enfática da partícula sem decidir de modo rígido entre os sentidos possíveis de ênfase e exclusividade.
- source_word: שֶׁקֶר
  choice: mentira
  rationale: Mantém o singular coletivo do hebraico e descreve a falsidade recebida como herança.
- source_word: נָחֲלוּ
  choice: herdaram
  rationale: Preserva a imagem específica de receber algo como herança, inclusive sua ironia no contexto da tradição ancestral.
- source_word: אֲבוֹתֵינוּ
  choice: nossos pais
  rationale: Segue de perto a forma masculina do hebraico; a nota registra o equivalente inclusivo natural.
- source_word: הֶבֶל
  choice: coisas vazias
  rationale: Expressa a ideia de vacuidade e inutilidade sem restringir o referente explicitamente a ídolos.
- source_word: וְאֵין בָּם מוֹעִיל
  choice: sem proveito algum
  rationale: Forma portuguesa concisa para a afirmação de que essas coisas não trazem benefício.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. A transliteração o preserva, sem substituí-lo por um título ou adotar outra forma tradicional.
- issue: Possível referência de הֶבֶל a ídolos
  choice: coisas vazias
  alternative: ídolos; vaidade
  rationale: O contexto permite associar o termo à religião falsa e a ídolos, mas a palavra hebraica é mais ampla e denota vacuidade ou futilidade. A tradução evita tornar explícito o que permanece implícito.
- issue: Relação sintática entre שֶׁקֶר e הֶבֶל
  choice: “mentira, coisas vazias” como descrição em aposição
  alternative: “mentira, vaidade e coisas sem proveito” como itens coordenados
  rationale: A sequência hebraica admite mais de uma maneira de relacionar os termos. O texto principal adota uma leitura natural em português, e a nota preserva a alternativa coordenada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. “Aflição”, “fortaleza” e “confins” mantêm solenidade bíblica sem recorrer a construções arcaicas.
