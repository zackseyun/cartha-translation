reference: Jeremiah 16:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מַשְׁבִּ֜ית מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה לְ/עֵינֵי/כֶ֖ם וּ/בִֽ/ימֵי/כֶ֑ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֥וֹל כַּלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos[a], o Deus de Israel: Eis que farei cessar deste lugar, diante dos olhos de vocês e nos seus dias, o som da alegria e o som do júbilo, a voz do noivo e a voz da noiva.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a forma mais tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino da aliança, distinguindo-o do título “Senhor” e seguindo diretamente o Tetragrama no texto hebraico.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Comunica de modo transparente e atual o sentido concreto do título, enquanto a nota preserva a formulação tradicional.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da construção hebraica.
- source_word: הִנְנִי מַשְׁבִּית
  choice: Eis que farei cessar
  rationale: “Eis que” mantém a força apresentativa de הִנְנִי, e o futuro com “fazer cessar” expressa a ação iminente e causativa do particípio hifil.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Reproduz de maneira idiomática o ponto de origem ou âmbito do desaparecimento dos sons festivos.
- source_word: לְעֵינֵיכֶם וּבִימֵיכֶם
  choice: diante dos olhos de vocês e nos seus dias
  rationale: Preserva tanto o caráter testemunhado do juízo como sua ocorrência durante a vida dos destinatários.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: o som da alegria e o som do júbilo
  rationale: “Som” se ajusta aos substantivos abstratos e mantém distintos os dois termos hebraicos paralelos ligados à celebração.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: a voz do noivo e a voz da noiva
  rationale: Com referentes humanos, “voz” é natural e conserva a repetição e a imagem das celebrações de casamento.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos exércitos celestiais
  rationale: O texto traz explicitamente o nome divino e o substantivo plural “exércitos”. A tradução mantém ambos sem identificar de forma restritiva quais exércitos estão em vista.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura retórica e as repetições do hebraico foram preservadas sem produzir uma sintaxe artificial.
