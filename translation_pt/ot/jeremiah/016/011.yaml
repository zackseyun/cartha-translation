base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: pt
  text: 'Então lhes dirás: “Porque os seus antepassados me abandonaram”, declara o SENHOR, “e foram atrás de outros deuses, serviram-nos e se prostraram diante deles; a mim abandonaram e não guardaram a minha lei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבוֹתֵיכֶם
  choice: os seus antepassados
  rationale: Expressa naturalmente o sentido coletivo de “pais” como gerações anteriores, sem restringi-lo aos pais imediatos.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o Tetragrama por SENHOR em versaletes.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: seguiram
  rationale: Reproduz em português corrente o idiomatismo hebraico “foram atrás de”, aqui com o sentido de aderir a outros deuses.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se prostraram diante deles
  rationale: Preserva o gesto concreto de reverência e culto expresso pelo verbo hebraico.
- source_word: תּוֹרָתִי לֹא שָׁמָרוּ
  choice: não obedeceram à minha lei
  rationale: Nesse contexto, “guardar” a lei significa observá-la ou obedecer-lhe; esta formulação é clara e natural em português moderno.
theological_decisions:
- issue: Contraste enfático entre o SENHOR e os outros deuses
  choice: A mim, porém, abandonaram
  alternative: Mas eles me abandonaram
  rationale: A anteposição de אֹתִי dá ênfase a “mim”; a redação conserva esse contraste sem acrescentar interpretação doutrinária.
- issue: Sentido de תּוֹרָה
  choice: minha lei
  alternative: meu ensino
  rationale: “Lei” é a equivalência tradicional e contextualmente adequada, embora תּוֹרָה possa ter o sentido mais amplo de instrução; o possessivo e o contexto de desobediência são preservados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição acusatória do hebraico foi mantida, assim como o contraste enfático de “A mim”. Não há marcadores de nota no texto porque nenhuma nota foi necessária.
