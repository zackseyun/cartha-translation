base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Não entre numa casa de luto[a], nem vá lamentar ou demonstrar solidariedade para com eles[b], pois retirei deste povo a minha paz[c], o amor leal e a compaixão — declara Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa casa de banquete”. O termo hebraico pode indicar um ambiente de festa em alguns contextos, mas aqui as referências a lamentar e demonstrar solidariedade favorecem “casa de luto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “consolá-los”. O verbo hebraico pode se referir a gestos ou expressões de condolência e solidariedade durante o luto.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “paz” provavelmente inclui bem-estar, integridade e prosperidade, não apenas ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor” e seguindo a opção do projeto.
- source_word: בֵּית מַרְזֵחַ
  choice: casa de luto
  rationale: Embora מַרְזֵחַ possa designar um ambiente de banquete, as referências imediatas a lamentar e prestar solidariedade favorecem aqui uma reunião ligada ao luto.
- source_word: לִסְפּוֹד
  choice: lamentar
  rationale: Expressa o lamento pelos mortos e preserva o contexto funerário sem recorrer a linguagem arcaica.
- source_word: תָּנֹד לָהֶם
  choice: demonstrar solidariedade para com eles
  rationale: Comunica o gesto social de participar da dor ou manifestar condolências, preservando alguma amplitude sem restringir o verbo a consolar verbalmente.
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: retirei ... a minha paz
  rationale: No contexto, אָסַף indica remoção ou retirada; “retirei” torna clara a ação divina, enquanto “paz” mantém o termo-chave שָׁלוֹם.
- source_word: שְׁלוֹמִי
  choice: a minha paz
  rationale: Preserva a formulação hebraica e sua abrangência, que inclui bem-estar, integridade e prosperidade, explicada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética.
- source_word: הַחֶסֶד
  choice: o amor leal
  rationale: Reflete tanto a dimensão afetiva quanto a constância e lealdade de חֶסֶד, sem impor terminologia denominacional.
- source_word: הָרַחֲמִים
  choice: a compaixão
  rationale: Verte naturalmente o plural abstrato hebraico רַחֲמִים e forma um par adequado com “amor leal”.
theological_decisions:
- issue: Relação de “o amor leal e a compaixão” com “a minha paz”
  choice: Manter os termos finais após travessões como explicitação do que Yahweh retirou.
  alternative: 'Entender os acusativos finais como objetos adicionais de um verbo repetido implicitamente: “retirei... o amor leal e a compaixão”.'
  rationale: A repetição de אֶת permite entender os termos finais como objetos coordenados ou como explicitação de “minha paz”. A pontuação conserva a tensão sintática sem acrescentar um segundo verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem e os travessões procuram preservar a construção enfática e a ambiguidade controlada do hebraico.
