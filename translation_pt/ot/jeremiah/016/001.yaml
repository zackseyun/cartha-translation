  text: 'E a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: A forma narrativa de היה com waw introduz a sequência. Em português, o sentido é expresso naturalmente junto ao verbo seguinte, sem o emprego mais rígido de “E aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, “a palavra” preserva o idioma tradicional e a relação construta com o nome divino, evitando a interpretação mais explícita de “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa do singular significa diretamente “a mim”; com “veio”, essa construção é natural e digna em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo construto introduz a fala direta que vem a seguir. “Dizendo:” mantém a forma da fórmula profética e os dois-pontos sinalizam seu conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde à forma adotada pelo projeto, sem substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e solene, com preservação da fórmula profética hebraica. A ordem “veio a mim” é idiomática e mantém de perto a estrutura do original.
