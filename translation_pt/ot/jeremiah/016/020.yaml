  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: pt
  text: Pode alguém fazer deuses para si? Mas eles não são deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que alguém faz deuses para si? Contudo, eles não são deuses.”'
    reason: Alternativa lexical que preserva o valor possível do imperfeito interrogativo e outra forma natural de expressar o contraste.
lexical_decisions:
- source_word: הֲ/יַעֲשֶׂה
  choice: Pode alguém fazer
  rationale: A partícula interrogativa הֲ com o imperfeito de עשה introduz uma pergunta retórica de tom incrédulo; “Pode alguém fazer” expressa naturalmente essa força em português.
- source_word: לּוֹ
  choice: para si
  rationale: A preposição ל com sufixo de terceira pessoa masculina singular tem aqui sentido reflexivo no contexto, indicando que a pessoa fabrica deuses para uso ou posse própria.
- source_word: אָדָם
  choice: alguém
  rationale: O substantivo singular é genérico neste contexto. “Alguém” preserva a referência humana singular sem sugerir que a pergunta se limite ao sexo masculino.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: A forma plural designa as divindades ou os ídolos fabricados por seres humanos; o plural deve ser mantido.
- source_word: וְ/הֵמָּה
  choice: Mas eles
  rationale: A conjunção seguida do pronome independente introduz um contraste enfático entre aquilo que é feito como deus e sua falta de verdadeira condição divina.
- source_word: לֹא אֱלֹהִים
  choice: não são deuses
  rationale: A expressão nega diretamente que os objetos fabricados sejam realmente deuses, sem singularizar o substantivo nem acrescentar terminologia filosófica.
theological_decisions:
- issue: Natureza da polêmica contra os ídolos
  choice: O versículo nega que as divindades fabricadas por seres humanos sejam realmente deuses.
  alternative: O versículo apenas ridiculariza a fabricação de ídolos, sem formular uma afirmação mais ampla sobre sua realidade divina.
  rationale: A oração לֹא אֱלֹהִים constitui uma negação explícita no contexto da polêmica profética contra a idolatria. A tradução mantém essa força sem desenvolver além do que o hebraico afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta retórica permanece concisa, e a repetição de “deuses” conserva o efeito polemicamente incisivo do hebraico.
