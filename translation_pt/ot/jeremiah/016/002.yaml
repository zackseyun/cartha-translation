  text: לֹֽא תִקַּ֥ח לְ/ךָ֖ אִשָּׁ֑ה וְ/לֹֽא יִהְי֤וּ לְ/ךָ֙ בָּנִ֣ים וּ/בָנ֔וֹת בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/002.yaml
  text: You shall not take a wife for yourself[a], nor shall you have sons or daughters in this place.
translation:
  language: pt
  text: Não tome para si uma esposa[a], nem tenha filhos ou filhas neste lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais dinâmica: “Não se case, nem tenha filhos ou filhas neste lugar.”'
    reason: Alternativa lexical que torna explícito o sentido matrimonial do idioma hebraico “tomar esposa”.
lexical_decisions:
- source_word: תִקַּח
  choice: tome
  rationale: Preserva o sentido básico de לקח e a formulação solene do idioma hebraico “tomar uma esposa”, que continua compreensível em português.
- source_word: לְךָ
  choice: para si
  rationale: Expressa naturalmente a referência pessoal do hebraico e reforça que a proibição é dirigida diretamente a Jeremias.
- source_word: אִשָּׁה
  choice: esposa
  rationale: Na construção “tomar ... esposa”, אִשָּׁה tem sentido matrimonial, não o sentido genérico de “mulher”.
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: nem tenha
  rationale: Traduz de forma idiomática a construção hebraica de existência/posse e mantém a força proibitiva do enunciado.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos ou filhas
  rationale: Mantém a menção explícita a descendentes de ambos os sexos; “ou” é natural em português dentro da construção negativa.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Preserva o sentido básico e dêitico de מָקוֹם sem ampliá-lo interpretativamente para “terra”.
theological_decisions:
- issue: Força da proibição dirigida a Jeremias
  choice: Uma proibição divina direta de Jeremias se casar e ter filhos no local/contexto presente
  alternative: Uma simples predição de que ele permaneceria solteiro e sem filhos, ou uma proibição referente a toda a terra
  rationale: As formas na segunda pessoa masculina singular e a construção negativa têm força de ordem direta. “Neste lugar” conserva a delimitação do texto sem defini-la de modo mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal conserva o idioma hebraico sem soar obscura; a nota oferece a equivalência portuguesa mais direta.
