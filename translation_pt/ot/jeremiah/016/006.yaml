language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: pt
  text: Grandes e pequenos[a] morrerão nesta terra. Não serão sepultados, e ninguém os lamentará; ninguém fará cortes no próprio corpo nem raspará a cabeça por causa deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “grandes e pequenos” é abrangente e pode incluir pessoas de todas as posições sociais e idades.
    reason: ambiguity_note
  - marker: b
    text: Fazer cortes no corpo e raspar a cabeça eram práticas de luto pelos mortos.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵתוּ
  choice: morrerão
  rationale: O perfeito qal com conjunção, no contexto profético, anuncia um acontecimento futuro. “Morrerão” transmite diretamente o sentido comum de מות.
- source_word: גְדֹלִים וּקְטַנִּים
  choice: Grandes e pequenos
  rationale: Mantém o par inclusivo hebraico, que abrange pessoas de diferentes posições sociais e possivelmente idades, sem limitar sua referência.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” é a correspondência natural de אֶרֶץ e preserva a dimensão geográfica do anúncio de Jeremias.
- source_word: לֹא יִקָּבֵרוּ
  choice: Não serão sepultados
  rationale: Reproduz claramente a forma passiva do nifal de קבר. “Sepultados” é digno, corrente e apropriado ao contexto funerário.
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: e ninguém os lamentará
  rationale: O verbo hebraico está na terceira pessoa do plural com sujeito indefinido. Em português, “ninguém” expressa naturalmente a ausência de pessoas que realizem o lamento fúnebre.
- source_word: וְלֹא יִתְגֹּדַד
  choice: ninguém fará cortes no próprio corpo
  rationale: A forma reflexiva refere-se a fazer incisões em si mesmo como prática de luto. A formulação torna explícito o objeto implícito sem suavizar o ato físico.
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: nem raspará a cabeça por causa deles
  rationale: O verbo derivado de קרח descreve tornar-se calvo como sinal de luto. “Raspará a cabeça” comunica de modo natural a prática cultural pretendida.
theological_decisions:
- issue: Especificidade corporal dos costumes de luto
  choice: Nomear no texto os cortes no corpo e o ato de raspar a cabeça
  alternative: Generalizar como “praticar ritos de luto”
  rationale: O hebraico enumera atos concretos cuja ausência faz parte do juízo anunciado. Preservá-los mantém a força e a especificidade cultural do oráculo.
- issue: Referência inclusiva de “grandes e pequenos”
  choice: Conservar a expressão sem restringi-la a idade ou classe social
  alternative: Explicitar como “adultos e crianças” ou “poderosos e humildes”
  rationale: A expressão pode abranger posição social, idade ou, de modo mais amplo, toda a população. A tradução mantém essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação e a repetição de “ninguém” preservam a progressão enfática do hebraico, enquanto o vocabulário funerário evita tanto arcaísmo quanto coloquialismo excessivo.
