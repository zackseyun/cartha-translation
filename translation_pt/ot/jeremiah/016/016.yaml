revisions:
- from: “Eis que estou mandando buscar muitos pescadores[a]”, declara Yahweh, “e eles os pescarão. Depois disso, mandarei buscar muitos caçadores[b], e eles os caçarão de todos os montes, de todas as colinas e das fendas das rochas.”
  to: “Eis que estou mandando chamar muitos pescadores”, declara Yahweh, “e eles os pescarão. Depois disso, mandarei chamar muitos caçadores[b], e eles os caçarão de cada monte, de cada colina e das fendas das rochas.”
  rationale: A revisão troca “mandando buscar” por “mandando chamar” (e a forma futura paralela), que expressa com maior clareza o chamamento dos agentes sem determinar sua identidade ou a dos alvos. Também ajusta “todos os montes/colinas” para o distributivo “cada monte/cada colina” e remove a nota a, redundante em português. A nota interpretativa b continua cuidadosamente limitada ao que a imagem do versículo permite afirmar.
