source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: pt
  text: “Eis que estou mandando chamar muitos pescadores”, declara Yahweh, “e eles os pescarão. Depois disso, mandarei chamar muitos caçadores[b], e eles os caçarão de cada monte, de cada colina e das fendas das rochas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: As imagens dos pescadores e dos caçadores retratam pessoas sendo procuradas e capturadas em todos os esconderijos; o versículo não identifica explicitamente os agentes além de dizer que são enviados por Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que estou
  rationale: Preserva a força dêitica e solene da introdução divina, em linguagem digna e ainda corrente.
- source_word: שֹׁלֵחַ
  choice: estou mandando buscar
  rationale: O particípio com הִנְנִי apresenta a ação como iminente ou já posta em andamento; a construção com לְ indica aqui a convocação dos agentes.
- source_word: לְדוגים רַבִּים
  choice: muitos pescadores
  rationale: Mantém a imagem ocupacional concreta e traduz רַבִּים naturalmente como grande número de agentes.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética com peso adequado e conserva o nome divino expresso no hebraico.
- source_word: וְדִיגוּם
  choice: e eles os pescarão
  rationale: Mantém tanto o objeto pronominal quanto a metáfora verbal ligada aos pescadores, sem identificar interpretativamente quem são “eles”.
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com clareza a sequência entre o envio dos pescadores e o dos caçadores.
- source_word: אֶשְׁלַח לְרַבִּים צַיָּדִים
  choice: mandarei buscar muitos caçadores
  rationale: Preserva o paralelismo com o primeiro envio e a imagem concreta da caça.
- source_word: וְצָדוּם
  choice: e eles os caçarão
  rationale: Conserva explicitamente a metáfora da caça e o sufixo objeto plural.
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה
  choice: de todos os montes, de todas as colinas
  rationale: A repetição de “todas” comunica o alcance exaustivo da busca, enquanto “de” expressa a retirada dos esconderijos situados nesses lugares.
- source_word: וּמִנְּקִיקֵי הַסְּלָעִים
  choice: e das fendas das rochas
  rationale: “Fendas” é concreto, natural e cobre adequadamente o sentido de aberturas ou rachaduras nas rochas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Identidade e função metafórica dos pescadores e caçadores
  choice: Manter as imagens concretas e o pronome “os”, sem identificar os agentes nem seus alvos no próprio versículo.
  alternative: Explicitar os agentes como invasores inimigos ou interpretar a ação como reunião dos exilados.
  rationale: Embora o contexto oriente a interpretação, o versículo não nomeia diretamente os agentes ou os alvos. A tradução preserva essa tensão e a imagem de pessoas procuradas e capturadas em todos os esconderijos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a solenidade profética; “mandando buscar” e “mandarei buscar” expressam naturalmente a convocação dos agentes. Os verbos “pescarão” e “caçarão” mantêm o paralelismo imagético do hebraico.
