  source_fidelity: A tradução preserva adequadamente a sequência, os agentes não identificados, os objetos pronominais plurais e a imagem abrangente de busca em montes, colinas e fendas rochosas. Contudo, “mandando buscar” pode sugerir que os pescadores/caçadores são o objeto a ser localizado e trazido, enquanto a construção hebraica comunica o chamamento/envio desses agentes. “Mandando chamar” conserva melhor essa função.
  naturalness: O registro é em geral claro e digno. “Estou mandando chamar” é mais idiomático e semanticamente nítido neste contexto do que “estou mandando buscar”. “De cada monte, de cada colina” preserva de modo mais explícito o distributivo repetido de כָּל.
  terminology: '“Yahweh”, “pescadores”, “caçadores”, “pescarão”, “caçarão” e “fendas das rochas” são escolhas adequadas. A nota a não oferece uma alternativa lexical real em português: “pescadores em grande número” apenas repete o sentido de “muitos pescadores”; por isso é melhor suprimi-la juntamente com sua âncora.'
