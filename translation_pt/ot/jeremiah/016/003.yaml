base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: pt
  text: 'Pois assim diz Yahweh a respeito dos filhos e das filhas[a] nascidos neste lugar, e a respeito de suas mães que os dão à luz, e de seus pais que os geram nesta terra:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “os filhos e as filhas”, nomeando explicitamente pessoas do sexo masculino e feminino.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação divina ligada à ordem do versículo anterior e preserva a relação causal do discurso.
- source_word: כֹה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional e representa diretamente o nome divino יְהוָה.
- source_word: עַל
  choice: a respeito de / de
  rationale: Apresenta os grupos aos quais se refere a declaração; a variação em português evita uma repetição pesada sem alterar a relação sintática.
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: os filhos e as filhas
  rationale: Preserva a nomeação explícita dos dois sexos no hebraico, em vez de reduzi-la ao termo genérico “filhos” ou “crianças”.
- source_word: הַיִּלּוֹדִים
  choice: nascidos
  rationale: Reproduz de modo conciso o particípio passivo que qualifica os filhos e as filhas, sem impor desnecessariamente um tempo verbal futuro.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Tradução locativa direta, natural e compatível com o tom profético.
- source_word: הַיֹּלְדוֹת אוֹתָם
  choice: que os dão à luz
  rationale: Expressa claramente o particípio referente à ação materna de dar à luz.
- source_word: הַמּוֹלִדִים אוֹתָם
  choice: que os geram
  rationale: Distingue a ação paterna expressa pelo particípio causativo de ילד e evita tanto linguagem arcaica quanto formulações excessivamente técnicas.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: Preserva a distinção do texto entre “este lugar” e “esta terra”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio e segue a convenção do projeto sem inserir uma paráfrase titular.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A construção paralela foi preservada, mas a repetição de “a respeito de” foi suavizada por “de” nos membros seguintes. O particípio “nascidos” mantém o valor verbal do hebraico sem resolver como futuro aquilo que a forma hebraica deixa dependente do contexto.
