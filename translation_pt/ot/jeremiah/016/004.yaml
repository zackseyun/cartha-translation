base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: pt
  text: Morrerão de doenças mortais[a]. Não serão pranteados nem sepultados; serão esterco sobre a superfície do solo. Perecerão pela espada e pela fome, e seus cadáveres servirão de alimento às aves do céu e aos animais da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «mortes de enfermidades»; a expressão indica mortes causadas por enfermidades graves.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים יָמֻתוּ
  choice: Morrerão de doenças mortais
  rationale: A expressão hebraica, literalmente «mortes de enfermidades», indica mortes causadas por enfermidades graves. A formulação portuguesa conserva a força do original sem reproduzir sua construção pouco natural.
- source_word: לֹא יִסָּפְדוּ וְלֹא יִקָּבֵרוּ
  choice: Não serão pranteados nem sepultados
  rationale: O nifal de ספד aponta para o lamento fúnebre. «Pranteados» mantém esse sentido ritual e solene; «nem» une naturalmente as duas negações.
- source_word: לְדֹמֶן עַל פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: serão como esterco sobre a superfície do solo
  rationale: דֹּמֶן é esterco. A construção «serão como esterco» comunica que os restos insepultos ficarão espalhados e degradados, sem sugerir desnecessariamente uma transformação literal; «superfície do solo» traduz a imagem de עַל־פְּנֵי הָאֲדָמָה.
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: Serão exterminados pela espada e pela fome
  rationale: כלה, neste contexto de juízo, significa chegar ao fim, perecer ou ser consumido. «Exterminados» expressa a completa destruição e preserva os agentes instrumentais introduzidos por ב.
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: seus cadáveres servirão de alimento
  rationale: נְבֵלָה designa o corpo morto ou cadáver, frequentemente exposto e desonrado. «Cadáveres» é claro, digno e adequado a seres humanos; «servirão de alimento» expressa naturalmente a construção resultativa.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: às aves do céu e aos animais da terra
  rationale: «Aves do céu» conserva a expressão bíblica de modo natural. בְּהֵמָה tem o sentido amplo de animal; «animais da terra» é corrente, compreensível e mantém o paralelismo espacial.
theological_decisions: []
