  naturalness: O português é claro, moderno e de registro solene. «Pranteados» é apropriado, embora mais literário; funciona bem no contexto fúnebre. «Perecerão pela espada e pela fome» é natural e preserva melhor a amplitude semântica do original.
  terminology: «Esterco», «espada», «fome», «cadáveres», «aves do céu» e «animais da terra» são escolhas adequadas. A nota sobre a construção hebraica é útil e corretamente ancorada.
