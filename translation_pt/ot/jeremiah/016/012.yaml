  source_fidelity: A comparação em “agiram pior do que seus pais” e o distributivo “cada um de vocês” refletem bem o hebraico. Contudo, “E vejam” transforma וְהִנְכֶם, uma fórmula deíctica (‘e eis que’), numa ordem dirigida aos ouvintes. A nota b também introduz “desejos”, sentido que não é sustentado por שְׁרִרוּת neste contexto.
  naturalness: “E eis que” é uma formulação portuguesa clara, digna e idiomática para a chamada de atenção profética. “Segue a obstinação de seu coração mau” é mais natural e semanticamente preciso que “segue a teimosia do seu coração mau”.
  terminology: “Obstinação” comunica adequadamente a vontade própria obstinada expressa por שְׁרִרוּת. “Pais” conserva a linguagem familiar do original; a nota oferece “antepassados” como alternativa contextual. “Para não me ouvir” reproduz de forma mais próxima a construção final לְבִלְתִּי שְׁמֹעַ, sem impor uma explicação doutrinária.
  issues:
