    rationale: A expressão hebraica é deíctica e apresenta uma realidade diante dos ouvintes; não é um imperativo. “E eis que” preserva essa função.
  - severity: medium
    issue: A nota b traz “desejos” como componente de “obstinação dos desejos”
    rationale: שְׁרִרוּת denota obstinação, teimosia ou vontade própria; “desejos” acrescenta um elemento lexical não expresso no texto.
  - severity: low
    issue: A relação final é vertida por “sem me ouvir”
    rationale: A construção לְבִלְתִּי com infinitivo é mais diretamente representada por “para não me ouvir”, mantendo a orientação final sem precisar explicitar uma psicologia adicional.
