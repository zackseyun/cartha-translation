  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: pt
  text: Mas vocês agiram pior que seus pais[a]; e eis que cada um de vocês segue a obstinação[b] de seu coração mau, para não me ouvir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiram com mais maldade do que seus antepassados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “teimosia” ou “vontade própria obstinada”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “recusando-se a me ouvir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  choice: agiram pior
  rationale: A construção com מֵאֲבוֹתֵיכֶם tem força comparativa; “agiram pior” comunica naturalmente tanto a comparação quanto a dimensão moral.
- source_word: מֵאֲבוֹתֵיכֶם
  choice: do que seus pais
  rationale: “Pais” preserva a expressão familiar masculina do hebraico, que neste contexto aponta para as gerações anteriores.
- source_word: וְהִנְכֶם
  choice: E vejam
  rationale: Mantém a função enfática e de chamada à atenção de הִנֵּה em linguagem portuguesa atual.
- source_word: הֹלְכִים אִישׁ אַחֲרֵי
  choice: cada um de vocês segue
  rationale: O particípio descreve conduta contínua, e אִישׁ tem sentido distributivo. “Segue” conserva de modo natural a ideia metafórica de orientar a conduta por algo.
- source_word: שְׁרִרוּת
  choice: teimosia
  rationale: Expressa obstinação e vontade própria persistente em linguagem clara e corrente; evita o sentido moderno inadequado que “imaginação” poderia sugerir.
- source_word: לִבּוֹ הָרָע
  choice: seu coração mau
  rationale: Preserva a formulação hebraica e sua concepção do coração como centro da vontade e do pensamento.
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: sem me ouvir
  rationale: Mantém a relação de resultado ou finalidade sem determinar além do necessário se a construção deve ser entendida estritamente como propósito ou como recusa deliberada.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ dirigida ao povo
  choice: cada um de vocês
  alternative: cada homem
  rationale: O singular masculino funciona distributivamente para toda a comunidade; a tradução preserva a individualização sem restringir indevidamente a fala aos homens.
- issue: Termo ancestral אָבוֹת
  choice: pais
  alternative: antepassados
  rationale: “Pais” preserva a textura familiar e masculina do original, embora o referente inclua gerações anteriores.
- issue: Relação expressa por לְבִלְתִּי
  choice: sem me ouvir
  alternative: recusando-se a me ouvir
  rationale: A opção escolhida preserva a tensão entre resultado e intenção, evitando explicitar como recusa voluntária aquilo que a construção hebraica deixa sintaticamente mais aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” mantém a interpelação direta; “cada um de vocês” reproduz o valor distributivo; “sem me ouvir” conserva a ambiguidade da construção final hebraica.
