  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: pt
  text: Por isso, eis que lhes estou dando a conhecer[a]; desta vez lhes darei a conhecer a minha mão[b] e o meu poder, e saberão que o meu nome é Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei com que isto lhes seja conhecido ... farei com que isto lhes seja conhecido”. O verbo hebraico é causativo (“fazer conhecer”) e pode ser entendido com objeto pessoal (“dar-lhes a conhecer”) ou impessoal (“fazer com que isto lhes seja conhecido”).'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “minha mão”, imagem comum da atuação poderosa.
    reason: cultural_note
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do contexto anterior.
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva a ênfase da introdução divina em registro digno e ainda corrente no português bíblico.
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: farei com que eles conheçam ... farei com que conheçam
  rationale: Mantém o valor causativo do hifil de ידע, o objeto pessoal plural e a repetição enfática do hebraico. O futuro em português comunica naturalmente o anúncio de uma ação iminente.
- source_word: בַּפַּעַם הַזֹּאת
  choice: desta vez
  rationale: É a expressão temporal mais concisa e idiomática, preservando a ênfase demonstrativa.
- source_word: יָדִי
  choice: a minha mão
  rationale: Conserva a metáfora hebraica de atuação e poder, sem fundi-la com o termo seguinte.
- source_word: גְּבוּרָתִי
  choice: o meu poder
  rationale: Comunica força ou poder eficaz em português natural e forma um par claro com a imagem da mão.
- source_word: וְיָדְעוּ
  choice: e saberão
  rationale: Preserva a coordenação simples e distingue de modo natural, em português, o conhecimento conclusivo expresso na oração final.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Mantém literalmente a linguagem de autoidentificação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; a transliteração preserva essa autoidentificação.
- issue: Interpretação de “minha mão”
  choice: a minha mão
  alternative: o meu poder
  rationale: A formulação literal conserva a metáfora e a distinção retórica entre “mão” e “poder”.
- issue: Objeto do verbo causativo ידע
  choice: farei com que eles conheçam
  alternative: farei isso conhecido a eles
  rationale: O sufixo plural pode ser entendido como objeto pessoal; essa leitura é preservada no texto, enquanto a alternativa impessoal é registrada em nota para não eliminar a ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva a solenidade enfática sem tornar o restante da frase arcaico. A repetição do verbo causativo e a metáfora da mão foram mantidas por sua força retórica.
