base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: pt
  text: Eu os lançarei[a] para fora desta terra, para uma terra que nem vocês nem seus pais[b] conheceram. Ali vocês servirão[c] a outros deuses dia e noite, pois não lhes concederei favor algum[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “arremessarei” ou “expulsarei”. O verbo hebraico retrata uma expulsão enérgica e violenta da terra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “seus antepassados”. Hebraico: “seus pais”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “adorarão”. O verbo hebraico significa com frequência “servir” e pode incluir o culto prestado a uma divindade.
    reason: lexical_alternative
  - marker: d
    text: Ou “não lhes concederei graça alguma” ou “não terei misericórdia de vocês”. O substantivo hebraico denota favor ou benevolência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: eu os lançarei para fora
  rationale: O hifil de טול descreve uma ação enérgica de lançar ou arremessar. A expressão preserva a força da expulsão e, com “para fora”, explicita o afastamento da terra indicado pelo contexto e pela preposição seguinte.
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: para fora desta terra, para uma terra
  rationale: A formulação reproduz o contraste direcional entre מֵעַל, afastamento desta terra, e עַל, destino em outra terra, sem recorrer ao pouco natural “de sobre... sobre”.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: que nem vocês nem seus pais conheceram
  rationale: “Conheceram” traduz diretamente ידע. A construção “nem... nem” comunica com clareza que a negação abrange tanto os destinatários quanto seus pais.
- source_word: וַעֲבַדְתֶּם שָׁם אֶת אֱלֹהִים אֲחֵרִים
  choice: Ali vocês servirão a outros deuses
  rationale: עבד pode indicar tanto serviço quanto culto prestado a uma divindade. “Servirão” conserva essa amplitude e a tensão do texto sem decidir se o serviço no exílio será devoção voluntária, assimilação imposta ou ambas.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Mantém a expressão hebraica concreta, que comunica continuidade.
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  choice: pois não lhes concederei favor algum
  rationale: חֲנִינָה denota favor, graça ou benevolência. “Favor” evita transformar o termo em expressão teológica técnica, e “pois” representa a relação causal mais provável de אֲשֶׁר no contexto.
theological_decisions:
- issue: Sentido de וַאֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico emprega literalmente o substantivo “pais”. A tradução o preserva, enquanto a nota registra que o termo pode designar os antepassados em sentido mais amplo.
- issue: Natureza do serviço prestado a outros deuses
  choice: servirão a outros deuses
  alternative: adorarão outros deuses
  rationale: “Servirão” mantém a extensão semântica de עבד e não elimina a ambiguidade entre serviço e adoração no cenário do exílio.
- issue: Relação da oração final introduzida por אֲשֶׁר
  choice: pois
  alternative: de modo que / onde
  rationale: O contexto favorece uma explicação causal da sentença de exílio, mas a partícula relativa hebraica permite uma conexão menos específica. A tradução adota a leitura contextual mais natural sem ampliar o conteúdo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas pronominais naturais para leitores brasileiros. “Terra” preserva o sentido territorial e pactual do contexto. A ordem das orações e o contraste entre a terra de origem e a terra desconhecida permanecem próximos ao hebraico, enquanto a pontuação em duas frases favorece a leitura pública.
