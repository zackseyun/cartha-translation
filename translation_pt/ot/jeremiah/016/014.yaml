  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: pt
  text: 'Por isso, eis que vêm dias — declara Yahweh — em que já não se dirá: “Tão certo como Yahweh vive, ele tirou os filhos de Israel[a] da terra do Egito[b]”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: De modo mais idiomático, “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: “Tirou” também pode ser traduzido mais literalmente por “fez subir”, em referência ao êxodo do Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Assinala a conclusão ou transição inferencial ligada ao contexto anterior, em português natural e claro.
- source_word: הִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar a atenção, característica do discurso profético, sem perder o registro solene.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz a fórmula profética que anuncia uma futura ação divina e mantém a ausência de artigo do hebraico de modo natural em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa a fórmula profética solene em linguagem portuguesa corrente.
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: já não se dirá
  rationale: Mantém a construção passiva impessoal do hebraico e traduz עוֹד sob negação como “já não”.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Comunica como fórmula de juramento a expressão hebraica literal “Vive Yahweh”, evitando que seja entendida como mera afirmação.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: ele fez subir
  rationale: Preserva de perto o sentido causativo de עלה no hiphil e a imagem tradicional da subida do Egito, embora “tirou” seja uma alternativa contextual natural.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma filial e masculina explícita do hebraico; a nota apresenta equivalentes coletivos mais idiomáticos.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Preserva tanto a preposição de origem quanto o substantivo “terra” na fórmula do êxodo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força da expressão חַי יְהוָה
  choice: Tão certo como Yahweh vive
  alternative: Vive Yahweh; Pela vida de Yahweh
  rationale: A formulação escolhida torna explícita a função de juramento da expressão sem alterar seu referente ou conteúdo.
- issue: Expressão de gênero em בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: O hebraico diz literalmente “filhos de Israel”; a tradução conserva essa forma, enquanto a nota reconhece o sentido coletivo possível.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. “Eis que” e a fórmula de juramento preservam o tom profético. A vírgula final indica que a construção e a citação prosseguem no versículo seguinte.
