revisions:
- from: Ninguém repartirá pão com eles durante o luto[a], para consolar aquele que chora um morto; ninguém lhes dará de beber o cálice da consolação[b] pela morte do pai ou da mãe.
  to: Ninguém repartirá pão para eles durante o luto[a], para consolá-lo pela morte de alguém; ninguém lhes dará de beber o cálice da consolação[b] por seu pai ou sua mãe.
  rationale: A revisão restitui o valor dativo de להם com “para eles”, remove a ação não expressa de “chorar” e conserva o masculino singular de לְנַחֲמוֹ mediante “consolá-lo”. “Pela morte de alguém” dá português natural a עַל־מֵת sem identificar a pessoa morta. “Seu pai ou sua mãe” preserva os sufixos singulares e o sentido distributivo adotado no registro de auditoria em inglês.
