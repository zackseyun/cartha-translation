  text: וְ/לֹֽא יִפְרְס֥וּ לָ/הֶ֛ם עַל אֵ֖בֶל לְ/נַחֲמ֣/וֹ עַל מֵ֑ת וְ/לֹֽא יַשְׁק֤וּ אוֹתָ/ם֙ כּ֣וֹס תַּנְחוּמִ֔ים עַל אָבִ֖י/ו וְ/עַל אִמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: pt
  text: Ninguém repartirá pão para eles durante o luto[a], para consolá-lo pela morte de alguém; ninguém lhes dará de beber o cálice da consolação[b] por seu pai ou sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repartirá comida para eles durante o luto”. O verbo hebraico significa literalmente “dividir” ou “repartir” e provavelmente se refere à refeição costumeiramente oferecida aos enlutados.'
    reason: lexical_alternative
  - marker: b
    text: O “cálice da consolação” provavelmente era uma bebida oferecida, segundo o costume, para confortar quem havia perdido alguém.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: repartirá pão
  rationale: O verbo פרס significa literalmente “dividir/repartir”. Como não há objeto expresso e o contexto é de luto, a expressão provavelmente alude à refeição oferecida aos enlutados; “repartir pão” conserva a imagem concreta sem tornar explícito além do hebraico o que era repartido.
- source_word: עַל אֵבֶל
  choice: durante o luto
  rationale: A preposição עַל introduz aqui a circunstância fúnebre. “Durante o luto” é natural em português e mantém a referência ao costume de acompanhar os enlutados.
- source_word: לְנַחֲמוֹ עַל מֵת
  choice: para consolar aquele que chora um morto
  rationale: O sufixo de לְנַחֲמוֹ é masculino singular e deve ser preservado, apesar dos plurais ao redor. A formulação explicita apenas o referente contextual do pronome e traduz עַל מֵת de modo idiomático, sem identificar necessariamente o morto com o pai ou a mãe mencionados depois.
- source_word: יַשְׁקוּ אוֹתָם
  choice: lhes dará de beber
  rationale: O Hifil de שׁקה tem sentido causativo, “dar de beber”. O pronome objeto é plural, adequadamente representado por “lhes”.
- source_word: כּוֹס תַּנְחוּמִים
  choice: o cálice da consolação
  rationale: A expressão designa uma bebida de consolo oferecida no contexto do luto. “Cálice da consolação” preserva a forma cultural e a ligação lexical com “consolar”.
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: pela morte do pai ou da mãe
  rationale: 'Os sufixos hebraicos são masculinos singulares. Em português, o artigo definido permite manter essa referência sem um possessivo potencialmente ambíguo. “Ou” comunica naturalmente o valor distributivo: seja pelo pai, seja pela mãe.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva deliberadamente a alternância do plural (“com eles”, “lhes”) para o masculino singular em לְנַחֲמוֹ e nos sufixos de “pai” e “mãe”, evitando corrigir a tensão gramatical do texto hebraico.
