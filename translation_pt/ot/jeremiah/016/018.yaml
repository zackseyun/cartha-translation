source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: pt
  text: Primeiro, retribuirei em dobro a iniquidade e o pecado deles, pois profanaram a minha terra com os cadáveres de seus ídolos detestáveis[a], e suas abominações encheram a minha herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os cadáveres de suas coisas detestáveis”; em contextos proféticos, o termo hebraico muitas vezes se refere a ídolos.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: retribuirei
  rationale: O piel de שלם expressa aqui retribuição ou paga judicial. “Retribuirei” conserva esse sentido e mantém um registro digno sem ser arcaico.
- source_word: רִאשׁוֹנָה
  choice: primeiro
  rationale: 'O advérbio indica prioridade na sequência: antes da restauração anunciada depois, Deus executará a retribuição.'
- source_word: מִשְׁנֵה
  choice: em dobro
  rationale: O substantivo denota quantidade dupla. “Em dobro” é uma formulação portuguesa clara e concisa no contexto de punição.
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: a iniquidade e o pecado deles
  rationale: A tradução mantém os dois termos morais distintos e preserva o singular coletivo do hebraico, sem confundi-los apenas com culpa jurídica ou com atos isolados.
- source_word: עַל
  choice: porque
  rationale: A preposição introduz o fundamento da punição; “porque” comunica naturalmente essa relação causal.
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: profanaram a minha terra
  rationale: חלל no piel descreve a violação da santidade da terra. “Profanaram” preserva com precisão a dimensão religiosa e moral da imagem.
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: com os cadáveres de seus ídolos detestáveis
  rationale: נִבְלָה significa cadáver ou carcaça, enquanto שִׁקּוּצִים frequentemente designa ídolos no discurso profético. A expressão explicita o referente provável e conserva a linguagem de repulsa.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: com as suas abominações
  rationale: O termo designa objetos ou práticas religiosamente repugnantes. “Abominações” é compreensível e preserva a força moral do original.
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: encheram a minha herança
  rationale: נַחֲלָה apresenta a terra como propriedade concedida e pertencente a Deus. “Minha herança” mantém essa ressonância da aliança.
theological_decisions:
- issue: Se שִׁקּוּצֵיהֶם deve ser explicitado como referência a ídolos
  choice: “seus ídolos detestáveis” no texto principal
  alternative: “suas coisas detestáveis”
  rationale: No contexto polêmico de Jeremias, שִׁקּוּצִים frequentemente se refere a objetos idólatras. A explicitação ajuda o leitor moderno sem acrescentar uma afirmação doutrinária estranha ao contexto; a opção lexical mais aberta é preservada em nota.
- issue: Sentido de “em dobro” na retribuição divina
  choice: Preservar literalmente a linguagem de retribuição dupla
  alternative: Suavizar como “plenamente” ou interpretar como medida proporcional
  rationale: O hebraico afirma מִשְׁנֵה, “dobro”, e o texto não explica aqui como essa medida se relaciona com justiça proporcional. A tradução conserva a tensão retórica e teológica em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “Primeiro” torna clara a prioridade expressa pelo advérbio hebraico. Mantiveram-se “iniquidade”, “profanaram”, “herança” e “abominações” por sua precisão no contexto profético, sem recorrer a construções arcaicas.
