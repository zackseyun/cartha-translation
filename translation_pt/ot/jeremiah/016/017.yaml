reference: Jeremiah 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: pt
  text: Pois os meus olhos estão sobre todos os caminhos deles[a][b]; esses caminhos não estão escondidos de mim, e a iniquidade deles[c] não está encoberta diante dos meus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque os meus olhos estão sobre todos os caminhos deles”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “caminhos”; isto é, sua conduta ou seu modo de viver.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “culpa”. O termo hebraico pode indicar tanto a iniquidade praticada quanto a culpa decorrente dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da declaração anterior. “Pois” conserva essa força discursiva em português natural; “Porque” também é possível.
- source_word: עֵינַי עַל
  choice: os meus olhos estão sobre
  rationale: Preserva a imagem antropomórfica concreta dos olhos de Deus dirigidos à conduta humana, sem reduzi-la à formulação abstrata “eu sei”.
- source_word: כָּל דַּרְכֵיהֶם
  choice: todos os caminhos deles
  rationale: Mantém a metáfora hebraica de “caminhos”, que neste contexto abrange a conduta e o modo de viver. “Deles” evita possível ambiguidade referencial de “seus”.
- source_word: לֹא נִסְתְּרוּ מִלְּפָנָי
  choice: esses caminhos não estão escondidos de mim
  rationale: O verbo passivo plural retoma “caminhos”. A repetição explícita de “esses caminhos” torna a referência clara em português, e “de mim” expressa naturalmente o idioma hebraico “de diante de mim”.
- source_word: וְלֹא נִצְפַּן
  choice: não está encoberta
  rationale: O verbo singular concorda com “iniquidade”. “Encoberta” preserva o campo semântico de ocultação e oferece variação natural em relação a “escondidos”.
- source_word: עֲוֹנָם
  choice: a iniquidade deles
  rationale: עָוֹן pode indicar perversidade, culpa ou a consequência da culpa. “Iniquidade” conserva aqui o peso moral do termo sem restringi-lo apenas à culpa resultante.
- source_word: מִנֶּגֶד עֵינָי
  choice: diante dos meus olhos
  rationale: Reproduz de modo claro e idiomático a imagem espacial hebraica de algo situado perante os olhos de Deus.
theological_decisions:
- issue: Linguagem antropomórfica sobre o conhecimento divino
  choice: Conservar a imagem dos olhos de Deus sobre os caminhos humanos e da iniquidade exposta diante deles.
  alternative: Parafrasear como “vejo tudo o que fazem” ou “nada escapa à minha atenção”.
  rationale: A linguagem corporal do hebraico comunica conhecimento e escrutínio moral divinos por meio de uma imagem vívida. Preservá-la mantém a força retórica sem impor uma formulação teológica mais abstrata.
- issue: Amplitude semântica de עָוֹן
  choice: iniquidade
  alternative: culpa; pecado; maldade
  rationale: O contexto permite tanto a ideia do ato perverso quanto a da culpa associada. “Iniquidade” mantém essa gravidade moral sem decidir de maneira indevida que o termo significa apenas culpa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora hebraica dos olhos e dos caminhos foi preservada; pequenas explicitações sintáticas evitam ambiguidade sem apagar a tensão lexical do original.
