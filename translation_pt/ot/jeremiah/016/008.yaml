base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/008.yaml
  text: And you shall not enter a house of feasting to sit with them[a], to eat and to drink.
translation:
  language: pt
  text: E não entre numa casa de banquetes para se sentar com eles[a], comer e beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa casa de festa” ou “num lugar de celebração”. A expressão hebraica se refere a um lugar onde as pessoas se reúnem festivamente para comer e beber.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: E não entre numa casa de banquetes
  rationale: A construção בֵית מִשְׁתֶּה designa uma casa ou lugar caracterizado por um banquete festivo. “Casa de banquetes” preserva a imagem concreta do hebraico e soa natural em português; וּ é traduzido por “E”, mantendo a continuidade com as proibições anteriores.
- source_word: לֹא תָבוֹא
  choice: não entre
  rationale: O imperfeito na segunda pessoa masculina singular tem aqui força proibitiva. O presente do subjuntivo após “não” comunica uma ordem direta e solene em português atual.
- source_word: לָשֶׁבֶת
  choice: para se sentar
  rationale: O infinitivo indica a finalidade de entrar. O verbo pronominal “sentar-se” expressa naturalmente tomar lugar junto ao grupo, sem sugerir residência.
- source_word: אוֹתָם
  choice: com eles
  rationale: Embora אוֹתָם tenha formalmente a forma do marcador de objeto com sufixo, a expressão idiomática com ישׁב comunica associação; “com eles” reproduz adequadamente a participação social.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: comer e beber
  rationale: Os dois infinitivos coordenados descrevem a participação no banquete. Em português, depois de “para se sentar”, a sequência sem repetir “para” é clara, fluente e conserva o paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A forma singular “entre” dirige-se a Jeremias, como no hebraico. A nota preserva alternativas para a expressão cultural בֵית מִשְׁתֶּה.
