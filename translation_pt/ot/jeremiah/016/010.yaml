source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: pt
  text: 'E acontecerá que, quando você anunciar a este povo todas estas palavras, eles lhe disserem: “Por que Yahweh pronunciou contra nós toda esta grande desgraça[a]? Qual é a nossa iniquidade? Qual é o pecado que cometemos contra Yahweh, nosso Deus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «toda esta grande calamidade». A palavra hebraica também pode ser traduzida por «mal», mas aqui se refere a uma desgraça ou juízo que virá sobre o povo, não a maldade moral em Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula hebraica que introduz uma situação futura, mantendo fluência natural em português.
- source_word: תַגִּיד
  choice: você anunciar
  rationale: O hifil de נגד significa tornar conhecido ou declarar; “anunciar” se ajusta ao contexto profético.
- source_word: לָעָם הַזֶּה
  choice: a este povo
  rationale: Mantém o substantivo coletivo singular e a expressão profética do hebraico.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דְּבָרִים se refere à mensagem profética verbal, por isso “palavras” é preferível a “coisas”.
- source_word: עַל מֶה
  choice: Por que
  rationale: Expressa de modo idiomático a pergunta pela razão ou fundamento do anúncio.
- source_word: דִבֶּר יְהוָה עָלֵינוּ
  choice: Yahweh pronunciou contra nós
  rationale: “Pronunciou” comunica uma declaração de juízo, enquanto “contra nós” preserva a força adversativa de עַל no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: toda esta grande desgraça
  rationale: Neste contexto de juízo, רָעָה designa calamidade, não maldade moral; “desgraça” é corrente e conserva a gravidade da expressão.
- source_word: עֲוֺנֵנוּ
  choice: nossa iniquidade
  rationale: Preserva o peso moral e teológico do termo, além de distingui-lo do vocábulo seguinte para pecado.
- source_word: חַטָּאתֵנוּ
  choice: o pecado
  rationale: É a equivalência geral e natural para חַטָּאת, mantendo a distinção possível em relação a עָוֹן.
- source_word: אֲשֶׁר חָטָאנוּ
  choice: que cometemos
  rationale: Em português, “o pecado que cometemos” expressa naturalmente a oração relativa hebraica, sem a redundância de “pecado que pecamos”.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: contra Yahweh, nosso Deus
  rationale: Com o verbo חטא, a preposição לְ indica idiomaticamente a pessoa contra quem se peca.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Sentido de רָעָה no anúncio de juízo
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto aponta para uma catástrofe decretada como juízo, não para maldade moral atribuída a Deus. “Desgraça” preserva esse sentido contextual.
- issue: Relação entre עָוֹן e חַטָּאת
  choice: iniquidade e pecado
  alternative: culpa e pecado; perversidade e pecado
  rationale: A formulação conserva dois termos distintos do hebraico sem impor uma diferenciação teológica mais rígida do que o próprio contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura interrogativa foi dividida em três perguntas para clareza, sem alterar o conteúdo. Não há notas de rodapé, portanto não se aplicam marcadores no texto.
