source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֨ר הֶעֱלָ֜ה אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדִּיחָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִֽׁבֹתִי/ם֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבוֹתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: pt
  text: 'mas: “Tão certo como Yahweh vive, que fez subir os filhos de Israel da terra do norte e de todas as terras para onde os havia expulsado”. Pois eu os trarei de volta à sua terra, que dei aos seus pais.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: mas
  rationale: O versículo completa o contraste iniciado no v. 14 (“não mais... mas...”); “mas” é natural e preserva a força adversativa.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Expressa em português corrente a fórmula hebraica de juramento, mantendo o sentido de apelo à vida de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: הֶעֱלָה
  choice: fez ... subirem
  rationale: Reproduz de perto o hifil de עלה e conserva o eco da linguagem do êxodo, embora “tirou” fosse mais idiomático.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão coletiva tradicional e formalmente próxima do hebraico.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Preserva a expressão geográfica ampla sem identificar um referente moderno específico.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: e de todas as terras
  rationale: “Terras” conserva o alcance amplo do plural hebraico e evita a noção moderna de Estados nacionais.
- source_word: הִדִּיחָם שָׁמָּה
  choice: para onde os havia expulsado
  rationale: Comunica deslocamento forçado e mantém explícita a agência divina indicada pelo verbo hebraico; שָׁמָּה é incorporado naturalmente em “para onde”.
- source_word: וַהֲשִׁבֹתִים
  choice: Pois eu os trarei de volta
  rationale: Expressa a forma causativa, “fazer voltar”, e entende o waw como ligação explicativa com a nova fórmula de juramento.
- source_word: עַל אַדְמָתָם
  choice: à sua terra
  rationale: Transmite naturalmente a restauração ao solo ou território que lhes pertence.
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  choice: que dei aos seus pais
  rationale: Mantém a formulação paternal e pactual explícita no hebraico; “antepassados” também é semanticamente possível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino pessoal; a transliteração o distingue de títulos como “Senhor” e segue a orientação do projeto.
- issue: Referente de לַאֲבוֹתָם
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: “Pais” preserva a forma masculina e a ressonância pactual do original, sem decidir se a referência se limita estritamente aos patriarcas.
- issue: Agência divina no exílio
  choice: para onde os havia expulsado
  alternative: para onde haviam sido dispersos
  rationale: A forma verbal hebraica apresenta Yahweh como agente implícito de הִדִּיחָם; a tradução conserva essa tensão teológica em vez de suavizá-la com uma passiva sem agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula de juramento foi vertida idiomaticamente; “fez ... subirem” foi mantido para preservar o movimento verbal e o eco do êxodo. A pontuação mostra que a fórmula citada termina antes da promessa direta de Yahweh.
