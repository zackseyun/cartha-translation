  - severity: low
    issue: Ordem marcada na fórmula “Tão certo como vive Yahweh”.
    rationale: A inversão é possível, mas “Tão certo como Yahweh vive” é mais corrente em português e mantém integralmente o valor juramentário de חַי יְהוָה.
