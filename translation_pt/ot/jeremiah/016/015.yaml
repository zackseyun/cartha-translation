  source_fidelity: A tradução transmite adequadamente o contraste de כִּי אִם, a fórmula de juramento, a saída da terra do norte e das demais terras, a agência divina no exílio e a promessa de retorno à terra dada aos pais. A construção causativa de הֶעֱלָה é melhor representada em português por “fez subir” do que pela ordem mais pesada “fez os filhos ... subirem”.
  naturalness: O texto é geralmente claro, mas “que fez os filhos de Israel subirem” soa menos fluente em português atual. “Que fez subir os filhos de Israel” preserva a proximidade formal e melhora a cadência. A fórmula “Tão certo como Yahweh vive” é uma ordem mais natural para a fórmula juramentária.
  terminology: “Yahweh”, “filhos de Israel”, “terra do norte”, “terras”, “expulsado”, “terra” e “pais” são escolhas adequadas e consistentes com o hebraico. A nota preserva corretamente a alternativa sem neutralizar o masculino explícito do texto-fonte.
