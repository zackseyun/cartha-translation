id: JER.2.4
reference: Jeremiah 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: pt
  text: Ouçam a palavra de Yahweh, ó casa de Jacó, e todos os clãs[a] da casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “famílias”; o termo se refere a grupos de parentesco dentro de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo qal plural convoca os destinatários não apenas a escutar, mas a acolher e atender à mensagem; “Ouçam” preserva a fórmula profética com naturalidade em português.
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção com o nome divino, integra a fórmula profética estabelecida “a palavra de Yahweh”; “palavra” preserva melhor essa ressonância do que “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּית יַעֲקֹב
  choice: ó casa de Jacó
  rationale: Preserva a metáfora corporativa de “casa” e torna explícita, com “ó”, a função vocativa da expressão hebraica.
- source_word: וְכָל
  choice: e todos
  rationale: Reproduz a conjunção simples e o sentido abrangente de כָּל, ligando o segundo grupo destinatário.
- source_word: מִשְׁפְּחוֹת
  choice: os clãs
  rationale: O termo designa grupos de parentesco dentro de Israel; “clãs” evita tanto o sentido doméstico estreito de “famílias” quanto o sentido amplo demais de “tribos”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém o paralelismo com “casa de Jacó” e o sentido coletivo e pactual da expressão.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e representa de modo mais provável sua vocalização histórica, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com a fórmula profética “Ouçam a palavra de Yahweh”. O vocativo “ó casa de Jacó” conserva a solenidade do chamado sem tornar a frase excessivamente arcaica.
