  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: pt
  text: Contudo, eu plantei você como videira seleta[a], toda de semente genuína[b]. Como, então, você se transformou, para mim, em brotos degenerados[c] de uma videira estrangeira?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “videira nobre”; o termo hebraico indica uma videira selecionada, de qualidade superior.
    reason: lexical_alternative
  - marker: b
    text: Ou “inteiramente de boa cepa”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico traduzido por “brotos degenerados” é difícil; outras possibilidades são “ramos selvagens” ou “crescimento corrompido”.
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: נְטַעְתִּיךְ
  choice: eu plantei você
  rationale: O qal perfeito na primeira pessoa do singular, com sufixo feminino singular, descreve de modo direto a ação passada de Deus; “você” representa Israel/Judá personificada como mulher.
- source_word: שֹׂרֵק
  choice: videira seleta
  rationale: O termo designa uma videira de qualidade superior ou nobre. “Videira seleta” conserva tanto a imagem agrícola quanto a ênfase na excelência da planta.
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: inteiramente de semente genuína
  rationale: A expressão ressalta que todo o material plantado era autêntico e de boa procedência. “Genuína” expressa אֱמֶת no sentido contextual de autenticidade, sem impor principalmente a noção moral de fidelidade.
- source_word: וְאֵיךְ
  choice: Como, então
  rationale: A formulação introduz uma pergunta retórica de espanto e forte contraste com o plantio descrito anteriormente.
- source_word: נֶהְפַּכְתְּ לִי
  choice: você se transformou, para mim, em
  rationale: O nifal de הפך indica transformação. A expressão “para mim” mantém explicitamente o dativo לִי e sua força relacional, embora produza uma construção deliberadamente marcada em português.
- source_word: סוּרֵי
  choice: brotos degenerados
  rationale: A forma hebraica é difícil, mas no contexto aponta para crescimentos ou ramos que se desviaram da qualidade original. “Brotos degenerados” preserva a metáfora da videira e a ideia de deterioração.
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: de uma videira estrangeira
  rationale: נָכְרִיָּה significa estrangeira ou estranha. A escolha mantém a imagem de uma planta alheia à videira originalmente plantada, sem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Metáfora de Israel/Judá como videira plantada por Deus
  choice: Manter diretamente a imagem da videira, da semente e dos brotos.
  alternative: Parafrasear como um povo puro que depois se corrompeu.
  rationale: A metáfora agrícola estrutura o versículo e participa da linguagem profética e pactual. Preservá-la conserva suas ressonâncias e evita substituir a imagem por uma interpretação moral explícita.
- issue: Força relacional de לִי
  choice: Conservar “para mim” no texto principal.
  alternative: Omitir o pronome ou traduzir interpretativamente como “aos meus olhos”.
  rationale: O hebraico inclui de modo expresso a relação com o falante divino. “Para mim” mantém essa tensão sem decidir se o sentido exato é avaliação, experiência ou relação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção marcada “para mim” foi mantida para representar um elemento relacional explícito no hebraico; os termos agrícolas permanecem no texto para conservar a metáfora profética.
