  text: וְ/עַתָּ֗ה מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ מִצְרַ֔יִם לִ/שְׁתּ֖וֹת מֵ֣י שִׁח֑וֹר וּ/מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ אַשּׁ֔וּר לִ/שְׁתּ֖וֹת מֵ֥י נָהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: pt
  text: E agora, o que você tem a ver com o caminho para o Egito, para beber as águas de Sior[a]? E o que você tem a ver com o caminho para a Assíria, para beber as águas do Rio[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sior provavelmente é um nome do Nilo ou de um de seus braços orientais.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o rio Eufrates.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o advérbio temporal e introduz naturalmente a pergunta retórica.
- source_word: מַה לָּךְ
  choice: o que você tem a ver com
  rationale: Reproduz o caráter idiomático de censura e afastamento, sem reduzir a expressão a uma simples pergunta sobre viagem.
- source_word: לְדֶרֶךְ
  choice: com o caminho
  rationale: Mantém a imagem concreta de דרך e se integra naturalmente ao idioma português «ter a ver com».
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: לִשְׁתּוֹת
  choice: para beber
  rationale: Expressa diretamente o infinitivo de finalidade.
- source_word: מֵי שִׁחוֹר
  choice: as águas de Sior
  rationale: Mantém o nome próprio em transliteração, sem substituir no texto principal sua identificação provável pelo Nilo.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: Forma portuguesa consagrada do nome nacional.
- source_word: מֵי נָהָר
  choice: as águas do Rio
  rationale: Preserva a formulação hebraica e sua provável referência geográfica implícita; a identificação com o Eufrates fica na nota.
theological_decisions:
- issue: Sentido da imagem de beber águas estrangeiras
  choice: Manter a metáfora de beber as águas do Egito e da Assíria, sem explicá-la no texto principal.
  alternative: Parafrasear como buscar ajuda ou depender politicamente do Egito e da Assíria.
  rationale: O contexto favorece uma censura à dependência de potências estrangeiras, mas o versículo apresenta essa ideia por meio de uma metáfora. Preservá-la evita eliminar sua força e não torna explícito o que permanece figurado no original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você» representa o feminino singular hebraico dirigido a Judá/Jerusalém. A repetição da pergunta foi mantida para preservar o paralelismo retórico.
