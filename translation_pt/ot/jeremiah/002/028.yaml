reference: Jeremiah 2:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: pt
  text: Mas onde estão os seus deuses, que você fez para si? Que eles se levantem, se puderem salvá-lo no tempo da sua calamidade.[a] Pois os seus deuses, ó Judá, são tantos quantas as suas cidades.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no tempo da sua desgraça” ou “do seu desastre”. Aqui, “calamidade” indica adversidade, não maldade moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Pois, conforme o número das suas cidades, foram os seus deuses, ó Judá”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Mas onde estão
  rationale: אַיֵּה pergunta pela localização; o וְ inicial tem aqui força discursiva adversativa, adequada à repreensão profética.
- source_word: אֱלֹהֶיךָ
  choice: os seus deuses
  rationale: O substantivo com sufixo de segunda pessoa masculina singular refere-se, no contexto, aos muitos ídolos de Judá; o plural é explicitado naturalmente.
- source_word: אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: que você fez para si
  rationale: Preserva tanto a fabricação humana dos ídolos como a nuance reflexiva de לָךְ.
- source_word: יָקוּמוּ
  choice: Que eles se levantem
  rationale: 'O imperfeito tem força volitiva e retórica: Deus desafia os ídolos a entrar em ação.'
- source_word: אִם יוֹשִׁיעוּךָ
  choice: se puderem salvá-lo
  rationale: Após o desafio, אִם introduz uma condição carregada de dúvida retórica; “puderem” comunica essa força sem declarar além do texto.
- source_word: בְּעֵת רָעָתֶךָ
  choice: no tempo da sua calamidade
  rationale: Neste contexto, רָעָה designa adversidade ou desastre, não maldade moral. “Calamidade” mantém clareza e dignidade.
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: Pois os seus deuses [...] são tantos quantas as suas cidades
  rationale: כִּי introduz a explicação, e a expressão hebraica estabelece correspondência numérica. O presente português comunica naturalmente o estado descrito pelo perfeito הָיוּ.
- source_word: יְהוּדָה
  choice: ó Judá
  rationale: O nome funciona como vocativo; “ó” torna clara a interpelação direta sem acrescentar conteúdo interpretativo.
theological_decisions:
- issue: Referente de “seus deuses”
  choice: Ídolos ou falsos deuses fabricados por Judá
  alternative: O SENHOR ou uma referência coletiva indistinta à divindade
  rationale: A oração “que você fez para si” identifica os referentes como divindades manufaturadas e conserva a polêmica do texto contra a idolatria.
- issue: Força do desafio “se puderem salvá-lo”
  choice: Desafio retórico que põe à prova a capacidade dos ídolos
  alternative: Afirmação direta de que os ídolos não podem salvar
  rationale: O texto sugere fortemente a impotência deles, mas formula a ideia como condição; a tradução preserva essa tensão retórica em vez de convertê-la numa declaração explícita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “você” porque o hebraico se dirige a Judá no singular; “ó Judá” esclarece o vocativo. A formulação mantém o sarcasmo profético e a correspondência numérica da linha final.
