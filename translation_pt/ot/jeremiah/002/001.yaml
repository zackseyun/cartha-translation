  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Yahweh»; tradicionalmente traduzido como «SENHOR» em versões portuguesas.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz a ocorrência; em português, seu valor é expresso naturalmente pelo verbo “veio”, sem o acréscimo pouco idiomático de “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Preserva a fórmula profética דְבַר יְהוָה e o sentido de comunicação ou revelação divina, sem substituí-la pela interpretação mais ampla “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição com o sufixo de primeira pessoa e soa natural na construção “veio a mim”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém o marcador hebraico que introduz o conteúdo da fala, o qual prossegue no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua função como nome e oferece uma transliteração amplamente reconhecida, sem transformá-lo no título “SENHOR”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a fórmula profética e a continuidade com a fala do versículo seguinte.
