  text: Até os habitantes de Nofe[a][b] e de Tafnes quebraram o alto da sua cabeça[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Nofe e de Tafnes”. Em hebraico, “filhos de” pode designar os habitantes de um lugar.
    reason: lexical_alternative
  - marker: b
    text: Nofe é geralmente identificada com Mênfis, no Egito.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico pode significar “quebrar” ou “danificar”. Neste contexto, algumas traduções o entendem mais especificamente como “raspar” ou “esmagar”.
    reason: lexical_alternative
  - marker: d
    text: Ou “o cocuruto” ou “o couro cabeludo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: Expressa naturalmente em português a força enfática de גַּם neste contexto.
- source_word: בְּנֵי
  choice: os habitantes de
  rationale: Embora signifique formalmente “filhos de”, em construções geográficas o hebraico designa os habitantes ou o povo de um lugar; a forma explícita evita uma expressão pouco natural em português.
- source_word: נֹף
  choice: Nofe
  rationale: Translitera a forma hebraica do nome da cidade, tradicionalmente identificada com Mênfis.
- source_word: תחפנס
  choice: Tafnes
  rationale: Translitera o topônimo hebraico numa forma clara e corrente em português.
- source_word: יִרְעוּךְ
  choice: rasparam
  rationale: O verbo é formalmente relacionado a pastar ou alimentar-se, mas, aplicado ao alto da cabeça, provavelmente comunica a imagem de despojar ou raspar. A nota preserva a metáfora lexical incomum e outras interpretações possíveis.
- source_word: קָדְקֹד
  choice: o alto da sua cabeça
  rationale: Representa com clareza a parte superior ou o cocuruto da cabeça, sem a possível ambiguidade de “coroa” em português.
