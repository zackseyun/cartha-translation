source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ בְ/אָזְנֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה זָכַ֤רְתִּי לָ/ךְ֙ חֶ֣סֶד נְעוּרַ֔יִ/ךְ אַהֲבַ֖ת כְּלוּלֹתָ֑יִ/ךְ לֶכְתֵּ֤/ךְ אַחֲרַ/י֙ בַּ/מִּדְבָּ֔ר בְּ/אֶ֖רֶץ לֹ֥א זְרוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: pt
  text: 'Vá e proclame aos ouvidos de Jerusalém: “Assim diz Yahweh: ‘Eu me lembro do amor fiel[a] da sua juventude, do amor dos seus dias de noiva[b], quando você me seguia no deserto, numa terra não semeada.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor constante”. O termo hebraico também envolve lealdade e fidelidade no relacionamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “do amor do seu noivado”. O hebraico se refere à condição ou aos dias de noiva, sem distinguir com precisão entre noivado, núpcias e início do casamento.
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Vá e proclame
  rationale: A combinação do infinitivo absoluto com o verbo finito reforça a ordem. A formulação conserva tanto o movimento quanto o anúncio público, sem pressupor necessariamente um grito.
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: aos ouvidos de Jerusalém
  rationale: Mantém a imagem hebraica e a personificação de Jerusalém, sendo uma expressão clara e digna em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa o tetragrama pelo nome divino Yahweh.
- source_word: זָכַרְתִּי לָךְ
  choice: Eu me lembro
  rationale: Em português, o objeto da lembrança aparece naturalmente na sequência. O dativo לָךְ orienta a lembrança para Jerusalém, mas vertê-lo literalmente como 'para você' seria pouco natural e poderia sugerir um sentido diferente.
- source_word: חֶסֶד
  choice: amor fiel
  rationale: Comunica tanto o afeto relacional quanto a constância e lealdade associadas ao termo, sem reduzi-lo apenas a bondade ou obrigação.
- source_word: נְעוּרַיִךְ
  choice: da sua juventude
  rationale: Conserva a metáfora da juventude de Israel, isto é, o período inicial de sua relação com Yahweh.
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: do amor dos seus dias de noiva
  rationale: Preserva a imagem nupcial sem decidir de modo excessivamente específico entre noivado, núpcias e início da vida conjugal.
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: quando você me seguia
  rationale: Expressa de modo natural o valor temporal da construção e o sentido idiomático de ir atrás de alguém, mantendo a ideia de devoção e seguimento.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: É a expressão corrente em português para o cenário inóspito do êxodo e não elimina sua ressonância histórica.
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: numa terra não semeada
  rationale: Mantém de perto a imagem agrícola hebraica de uma terra inculta e improdutiva.
theological_decisions:
- issue: Metáfora conjugal para o início da relação entre Israel e Yahweh
  choice: amor dos seus dias de noiva
  alternative: amor do seu noivado
  rationale: A expressão mantém a imagem de Israel como noiva e sua devoção no deserto, sem definir rigidamente se o hebraico aponta para o noivado, as núpcias ou os primeiros dias do casamento.
- issue: Valor de חֶסֶד na relação de aliança
  choice: amor fiel
  alternative: amor constante
  rationale: A opção reúne afeto e lealdade sem transformar o termo numa formulação doutrinária técnica nem apagar sua dimensão relacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A personificação de Jerusalém e as imagens nupcial, desértica e agrícola foram preservadas.
