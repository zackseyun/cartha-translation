  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: pt
  text: Por que vocês discutem comigo?[a] Todos vocês se rebelaram contra mim[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que vocês contendem comigo?” O verbo hebraico pode ter o sentido de contender, disputar ou mover uma ação judicial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vocês transgrediram contra mim”. O verbo hebraico frequentemente tem o sentido mais forte de rebelião ou revolta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz uma pergunta retórica sobre a razão da conduta do povo; é a forma mais natural e direta em português.
- source_word: תָרִיבוּ
  choice: entram em disputa
  rationale: O verbo ריב pode indicar contender, disputar ou apresentar uma causa judicial. A expressão preserva tanto o confronto quanto a possível nuance jurídica em linguagem corrente.
- source_word: אֵלָי
  choice: comigo
  rationale: Com ריב, a preposição é representada idiomaticamente por “comigo”, sem reforçar em excesso a hostilidade já expressa pelo contexto.
- source_word: כֻּלְּכֶם
  choice: Todos vocês
  rationale: 'Conserva a ênfase coletiva: a acusação é dirigida ao povo inteiro.'
- source_word: פְּשַׁעְתֶּם
  choice: se rebelaram
  rationale: פשע costuma denotar rebelião, revolta ou quebra de lealdade, sendo mais forte que uma referência genérica a pecar.
- source_word: בִּי
  choice: contra mim
  rationale: Com פשע, a preposição identifica aquele contra quem a rebelião é dirigida; “contra mim” é o equivalente idiomático em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com dignidade a fórmula profética e mantém o nome divino explícito presente no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Força de פְּשַׁעְתֶּם
  choice: se rebelaram
  alternative: transgrediram
  rationale: A escolha mantém a noção forte de revolta ou quebra de lealdade, sem reduzir a acusação a uma infração genérica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” comunica naturalmente o plural hebraico; “entram em disputa” evita o tom arcaico de “contendeis” e conserva a possível nuance forense.
