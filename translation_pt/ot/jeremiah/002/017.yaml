source:
  edition: WLC
  text: הֲ/לוֹא זֹ֖את תַּעֲשֶׂה לָּ֑/ךְ עָזְבֵ/ךְ֙ אֶת יְהוָ֣ה אֱלֹהַ֔יִ/ךְ בְּ/עֵ֖ת מוֹלִיכֵ֥/ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
translation:
  language: pt
  text: Não foi isso que você trouxe sobre si[a], ao abandonar Yahweh, seu Deus, enquanto ele conduzia você pelo caminho[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não foi isso que fez isso a você?” O hebraico diz mais literalmente: “Não foi isto que fez a você/para você...?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando ele conduzia você no caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֹאת תַּעֲשֶׂה לָּךְ
  choice: Não foi isso que você trouxe sobre si
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e expressa, em português natural, a ideia contextual de que Judá trouxe a calamidade sobre si. A formulação hebraica é mais literalmente 'Não foi isto que fez a você/para você?', registrada em nota.
- source_word: עָזְבֵךְ
  choice: ao abandonar
  rationale: O infinitivo construto com sufixo indica a circunstância causal. 'Ao abandonar' mantém de modo conciso a ligação entre o abandono de Yahweh e a consequência sofrida, sem eliminar totalmente a sobreposição entre causa e circunstância.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהַיִךְ
  choice: seu Deus
  rationale: Reproduz de maneira direta a expressão pactual com sufixo possessivo feminino singular, naturalmente não marcado por gênero nessa forma portuguesa.
- source_word: בְּעֵת מוֹלִיכֵךְ
  choice: enquanto ele a conduzia
  rationale: O particípio causativo descreve ação em curso; 'enquanto... conduzia' preserva esse aspecto. O pronome feminino torna explícito que a destinatária personificada é Judá/Israel.
- source_word: בַּדָּרֶךְ
  choice: pelo caminho
  rationale: Expressão portuguesa natural que conserva a imagem do caminho e sua possível dimensão histórica, moral e pactual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. 'Yahweh' o preserva por transliteração sem o substituir pelo título 'SENHOR'.
- issue: Agente implícito em מוֹלִיכֵךְ
  choice: ele a conduzia
  alternative: Yahweh a conduzia
  rationale: O hebraico deixa o sujeito implícito, mas o antecedente imediato é Yahweh. O pronome preserva a estrutura sem introduzir outro agente.
- issue: Sentido de בַּדָּרֶךְ
  choice: pelo caminho
  alternative: no caminho; no caminho certo
  rationale: Evita acrescentar 'certo', que resolveria como exclusivamente moral uma imagem que também pode evocar a condução histórica de Israel.
translation_notes:
  register: 'Português atual, digno e de leitura ampla, com tratamento por “você”. A alternância entre “você” e “a” é gramatical: o segundo termo é objeto direto feminino e reflete a destinatária personificada no hebraico. A ordem das notas segue a posição dos marcadores no texto.'
