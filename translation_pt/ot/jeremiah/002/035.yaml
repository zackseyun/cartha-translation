  text: וַ/תֹּֽאמְרִי֙ כִּ֣י נִקֵּ֔יתִי אַ֛ךְ שָׁ֥ב אַפּ֖/וֹ מִמֶּ֑/נִּי הִנְ/נִי֙ נִשְׁפָּ֣ט אוֹתָ֔/ךְ עַל אָמְרֵ֖/ךְ לֹ֥א חָטָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: pt
  text: 'Mas você disse: “Sou inocente; certamente a ira dele se afastou de mim.” Eis que vou entrar em juízo contra você, porque você diz: “Não pequei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Mas você disse
  rationale: O waw dá continuidade à acusação com força contrastiva; “mas” expressa naturalmente esse contraste. O feminino singular dirigido a Judá/Sião não é marcado no pronome português.
- source_word: נִקֵּיתִי
  choice: Sou inocente
  rationale: O nifal de נקה indica estar livre de culpa; “sou inocente” preserva o sentido moral e forense em português corrente.
- source_word: אַךְ
  choice: certamente
  rationale: Aqui a partícula reforça a alegação confiante da interlocutora, em vez de exprimir exclusividade.
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: a ira dele se afastou de mim
  rationale: A expressão descreve a ira que recua ou deixa de atingir alguém. “Ira” mantém o peso do hebraico e “se afastou” é idiomático.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a força de chamada de atenção e o registro solene da resposta divina sem recorrer ao arcaico “eis-me”.
- source_word: נִשְׁפָּט אֹתָךְ
  choice: entrarei em juízo contra você
  rationale: A construção tem caráter judicial e pode indicar litigar ou entrar em julgamento com alguém. O futuro é natural em português para a ação divina anunciada pelo particípio hebraico; “contra você” comunica o caráter adversarial.
- source_word: עַל אָמְרֵךְ
  choice: porque você diz
  rationale: Expressa de modo idiomático a causa do procedimento judicial.
- source_word: לֹא חָטָאתִי
  choice: Não pequei
  rationale: O perfeito hebraico dentro da fala nega que a pessoa tenha pecado; o pretérito perfeito português é direto e natural.
theological_decisions:
- issue: Nuance forense do julgamento divino
  choice: entrarei em juízo contra você
  alternative: julgarei você; contenderei com você
  rationale: A formulação conserva a linguagem de tribunal presente em נשׁפט sem reduzir a ação a uma sentença já proferida nem introduzir um esquema doutrinário específico.
- issue: Referente de “sua ira”
  choice: a ira dele
  alternative: a tua ira; a ira de Deus
  rationale: O sufixo masculino singular remete a Deus, mas o hebraico mantém a referência pronominal. A tradução conserva “dele” em vez de explicitar o nome divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a interpelação em “você”, adequada ao feminino singular hebraico sem regionalismo excessivo, e a solenidade judicial em “Eis que” e “entrar em juízo”.
