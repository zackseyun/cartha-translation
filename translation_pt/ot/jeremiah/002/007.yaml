  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: pt
  text: Eu os trouxe a uma terra fértil[a], para comerem do seu fruto e de seus bens[b]. Quando, porém, vocês entraram, contaminaram a minha terra e fizeram da minha herança uma abominação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma terra de Carmelo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da sua abundância” ou “das suas coisas boas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: Eu os trouxe
  rationale: O hifil de בוא expressa fazer vir ou trazer. “Trouxe” comunica com naturalidade a ação direta de Deus.
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: uma terra fértil
  rationale: כַּרְמֶל pode designar terra cultivada, fértil e produtiva. Esse sentido comum se ajusta à menção imediata do fruto da terra, sem excluir em nota a possível associação com Carmelo.
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: para comerem do seu fruto e da sua bondade
  rationale: A construção infinitiva indica finalidade. “Fruto” conserva פְּרִי literalmente, e “bondade” mantém a amplitude de טוּב, que também pode indicar abundância ou os bens produzidos pela terra.
- source_word: וַתָּבֹאוּ
  choice: Quando, porém, vocês entraram
  rationale: A formulação torna clara a progressão temporal e o contraste entre a dádiva divina e a resposta do povo, sem alterar o conteúdo da oração hebraica.
- source_word: וַתְּטַמְּאוּ
  choice: contaminaram
  rationale: No piel, טמא significa tornar impuro ou profanar. “Contaminaram” preserva a dimensão moral e religiosa e soa natural em português.
- source_word: אַרְצִי
  choice: a minha terra
  rationale: Mantém a referência direta à terra e o possessivo, que ressalta que ela pertence a Deus.
- source_word: נַחֲלָתִי
  choice: minha herança
  rationale: נַחֲלָה designa herança, patrimônio ou possessão recebida. “Herança” conserva a linguagem pactual e a relação possessiva.
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: fizeram ... uma abominação
  rationale: A expressão mantém a força de תּוֹעֵבָה, termo de intensa reprovação moral e religiosa, e reproduz de perto a construção hebraica.
theological_decisions:
- issue: Sentido de כַּרְמֶל
  choice: 'substantivo comum: “terra fértil”'
  alternative: 'nome próprio ou associação geográfica: “terra de Carmelo”'
  rationale: O contexto descreve a qualidade produtiva da terra, em paralelo com seu fruto e sua bondade. A leitura como substantivo comum é mais provável, mas a alternativa é preservada em nota.
- issue: Amplitude de טוּב aplicado à terra
  choice: “bondade”
  alternative: “abundância” ou “coisas boas”
  rationale: O termo hebraico é mais amplo que a produção agrícola isoladamente. “Bondade” conserva a amplitude e apresenta a terra como dádiva benéfica de Deus, enquanto a nota esclarece o sentido concreto possível.
- issue: Força religiosa de טמא e תּוֹעֵבָה
  choice: “contaminaram” e “abominação”
  alternative: “tornaram impura” e “algo detestável”
  rationale: As escolhas retêm a gravidade cultual e moral dos termos sem restringir o texto a uma única modalidade de impureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de uso corrente no Brasil. A redação mantém a imagem agrícola, os possessivos divinos e a severidade da acusação. “Bondade” é deliberadamente mais formal e abrangente; a nota oferece equivalentes concretos.
