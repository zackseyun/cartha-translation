  text: מִנְעִ֤י רַגְלֵ/ךְ֙ מִ/יָּחֵ֔ף ו/גורנ/ך מִ/צִּמְאָ֑ה וַ/תֹּאמְרִ֣י נוֹאָ֔שׁ ל֕וֹא כִּֽי אָהַ֥בְתִּי זָרִ֖ים וְ/אַחֲרֵי/הֶ֥ם אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: pt
  text: 'Poupe os seus pés de ficarem descalços

    e a sua garganta da sede.

    Mas você disse:

    “Não há esperança! Não!

    Pois amei os estrangeiros[a]

    e irei atrás deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os estranhos”. No contexto, a expressão pode se referir metaforicamente a deuses estrangeiros, amantes estrangeiros ou nações e aliados estrangeiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  choice: Poupe os seus pés de ficarem descalços
  rationale: O imperativo feminino singular dirige-se a Judá personificada. “Poupe” expressa de modo natural a ordem de impedir que os pés acabem descalços pelo esforço da busca; o plural “pés” é idiomático em português, embora o hebraico use o singular coletivo.
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  choice: e a sua garganta da sede
  rationale: Mantém o paralelismo conciso e a imagem concreta da garganta ressequida pela busca exaustiva.
- source_word: וַתֹּאמְרִי
  choice: Mas você disse
  rationale: O valor adversativo de “Mas” explicita a resistência de Judá à advertência, enquanto “você” oferece ampla legibilidade no português moderno.
- source_word: נוֹאָשׁ
  choice: Não há esperança!
  rationale: Expressa a resignação ou alegação de que a situação já não pode ser mudada, sem reduzir a frase a uma simples avaliação pragmática.
- source_word: לֹא כִּי
  choice: Não! Pois
  rationale: Entende לֹא como recusa enfática da advertência, seguida de כִּי introduzindo a razão declarada para essa recusa.
- source_word: אָהַבְתִּי זָרִים
  choice: amei os estrangeiros
  rationale: Conserva o perfeito verbal e o termo amplo para pessoas ou entidades de fora, sem restringi-lo antecipadamente a deuses, amantes ou aliados políticos.
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: e irei atrás deles
  rationale: Reproduz com naturalidade o idioma hebraico de seguir os objetos desejados e o valor prospectivo do imperfeito.
theological_decisions:
- issue: Referente de זָרִים na metáfora de infidelidade
  choice: estrangeiros
  alternative: deuses estrangeiros; amantes estrangeiros; nações ou aliados estrangeiros
  rationale: O contexto combina idolatria, alianças políticas e linguagem de infidelidade conjugal. O termo amplo preserva essa sobreposição intencional em vez de impor um único referente.
- issue: Relação entre “Não há esperança” e “Não!”
  choice: Manter as duas exclamações como uma fala tensa de resignação seguida de recusa
  alternative: Fundir as expressões como “É inútil, pois...”
  rationale: A sequência hebraica נוֹאָשׁ לֹא admite tensão discursiva. Mantê-la evita resolver silenciosamente se a primeira expressão é desespero real, desculpa ou alegação de irreversibilidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para a interlocutora personificada. O paralelismo poético e as imagens corporais foram preservados sem literalismo rígido.
