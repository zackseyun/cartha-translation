source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: pt
  text: 'Pois há muito tempo[a] quebrei o seu jugo e rompi suas amarras. Mas você disse: “Não servirei.” De fato, em toda colina alta e debaixo de toda árvore verde[b], você se estendia como prostituta[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde os tempos antigos”. A expressão hebraica indica um passado remoto; aqui, provavelmente remete à história anterior da libertação de Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Debaixo de toda árvore verde” é uma expressão profética recorrente para lugares associados ao culto idólatra.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico é raro e de sentido incerto. Também pode ser entendido como “você se abaixava” ou por expressão semelhante que sugira disponibilidade sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: há muito tempo
  rationale: A expressão temporal aponta aqui para um passado remoto, provavelmente para a história anterior da libertação de Israel, sem exigir o sentido abstrato de eternidade.
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: quebrei o seu jugo
  rationale: Mantém a imagem concreta de libertação da sujeição e segue a primeira pessoa do texto hebraico apresentado.
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: rompi suas amarras
  rationale: O verbo comunica separar ou arrancar com força, e o substantivo designa correias ou vínculos; a formulação preserva a imagem de libertação e soa natural em português.
- source_word: לֹא אעבד
  choice: Não servirei
  rationale: עבד pode significar servir, trabalhar como servo ou prestar culto. “Servirei” preserva a ligação tanto com o jugo e as amarras quanto com a infidelidade religiosa descrita em seguida.
- source_word: כִּי
  choice: De fato
  rationale: O segundo כִּי introduz uma confirmação enfática da rebeldia de Israel por meio de sua conduta.
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: em toda colina alta e debaixo de toda árvore verde
  rationale: Preserva a descrição concreta e tradicional dos lugares associados ao culto idólatra, sem substituir a imagem por uma explicação interpretativa.
- source_word: צֹעָה
  choice: você se estendia
  rationale: O particípio é raro e de sentido incerto. No contexto, parece indicar uma postura corporal ligada à disponibilidade sexual; “se estendia” conserva essa imagem sem esconder a dificuldade lexical.
- source_word: זֹנָה
  choice: como prostituta
  rationale: Mantém explícita a metáfora sexual usada para denunciar a infidelidade de Israel, em linguagem moderna e clara.
theological_decisions:
- issue: Metáfora da infidelidade sexual aplicada à idolatria
  choice: Manter no texto principal a imagem explícita da prostituição
  alternative: Atenuar para “você era infiel” ou explicitar apenas “praticava idolatria”
  rationale: Jeremias emprega deliberadamente linguagem de infidelidade sexual para retratar a ruptura da aliança. Atenuar a metáfora eliminaria parte da força profética e obscureceria a associação entre culto ilícito e adultério.
- issue: Identidade de quem quebra o jugo e rompe as amarras
  choice: 'Traduzir os verbos na primeira pessoa: “quebrei” e “rompi”'
  alternative: 'Adotar a segunda pessoa: “você quebrou” e “rompeu”'
  rationale: O texto hebraico fornecido apresenta formas verbais de primeira pessoa do singular. A tradução conserva essa leitura, na qual Deus relembra sua ação libertadora, apesar de algumas traduções e propostas textuais preferirem a segunda pessoa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa feminina dirigida a Israel é representada por “você”, evitando formas excessivamente regionais ou arcaicas. A metáfora do jugo, a fórmula profética dos locais de culto e a imagem contundente da prostituição foram preservadas.
