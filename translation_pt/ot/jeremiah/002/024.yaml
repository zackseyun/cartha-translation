  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: pt
  text: Uma jumenta selvagem, acostumada ao deserto, em seu desejo intenso fareja o vento[a]. Em seu cio[b], quem poderá fazê-la voltar? Todos os que a procuram não se cansarão; no mês dela[c], a encontrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aspira o vento”. A expressão hebraica retrata o animal sorvendo ou farejando o ar com desejo inquieto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em seu ardor” ou “em sua avidez sexual”. O hebraico se refere ao estado ou período de impulso sexual do animal.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “no mês dela”, provavelmente uma referência ao período do cio ou ao ciclo de acasalamento.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  choice: jumenta selvagem
  rationale: Designa o onagro ou asno selvagem. O feminino torna explícita, em português, a concordância predominante no restante da imagem.
- source_word: לִמֻּד מִדְבָּר
  choice: acostumada ao deserto
  rationale: Descreve o animal habituado à vida no deserto; a formulação é natural e preserva a ideia de adaptação adquirida.
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: na ânsia do seu apetite
  rationale: Expressa desejo intenso ou avidez. 'Apetite' retém o campo semântico de נֶפֶשׁ neste contexto sem reduzir toda a expressão ao desejo sexual.
- source_word: שָׁאֲפָה רוּחַ
  choice: fareja o vento
  rationale: Reproduz de modo vívido e idiomático a imagem do animal que aspira ou sorve o ar, possivelmente seguindo o cheiro de parceiros.
- source_word: תַּאֲנָתָהּ
  choice: durante o cio
  rationale: O substantivo indica o estado ou período de impulso sexual do animal; 'cio' é o termo zoológico corrente e claro em português.
- source_word: מִי יְשִׁיבֶנָּה
  choice: quem poderá fazê-la voltar?
  rationale: Preserva o sentido causativo de שׁוב, 'fazer voltar', e comunica a impossibilidade prática de desviá-la de seu impulso.
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: todos os que a procuram não se cansarão
  rationale: Mantém a forma declarativa do hebraico e o verbo 'procurar', sem explicitar além do texto por que os perseguidores não se cansarão.
- source_word: בְּחָדְשָׁהּ
  choice: no mês dela
  rationale: Conserva a expressão literal e ambígua do hebraico; uma nota explica sua provável referência ao ciclo reprodutivo.
- source_word: יִמְצָאוּנְהָ
  choice: eles a encontrarão
  rationale: Traduz diretamente a forma verbal futura e explicita o sujeito retomado da oração anterior para maior clareza em português.
theological_decisions:
- issue: Concordância de gênero na metáfora animal aplicada a Judá
  choice: Empregar o feminino em toda a imagem ('jumenta', 'a', 'dela')
  alternative: Conservar um elemento masculino na expressão ligada a נַפְשׁוֹ
  rationale: Embora uma forma consonantal apresente sufixo masculino singular, os verbos e demais sufixos do versículo apontam predominantemente para uma fêmea, coerente com a personificação de Judá. A concordância feminina evita confusão sem eliminar nenhuma tensão teológica relevante.
- issue: Sentido de בְּחָדְשָׁהּ
  choice: Manter literalmente 'no mês dela' no texto e explicar a provável referência em nota
  alternative: Interpretar diretamente no texto como 'na época do cio' ou 'no período de acasalamento'
  rationale: A expressão hebraica é literalmente 'no mês dela'. Preservá-la mantém a particularidade e a possível ambiguidade do original, enquanto a nota oferece a interpretação contextual mais provável.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário zoológico corrente. A construção conserva a força poética e corporal da metáfora, sem eufemizá-la nem ampliar sua aplicação teológica. A expressão incomum 'no mês dela' foi mantida para preservar a textura e a ambiguidade do hebraico, com esclarecimento em nota.
