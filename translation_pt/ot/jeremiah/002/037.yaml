  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: pt
  text: Também deste você sairá com as mãos sobre a cabeça[a], pois Yahweh rejeitou seus objetos de confiança[b], e você não terá êxito com eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pôr as mãos sobre a cabeça era um gesto de tristeza, vergonha ou derrota.
    reason: cultural_note
  - marker: b
    text: Literalmente, “suas confianças”; também pode ser entendido como “aqueles em quem você confia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “você não terá êxito por meio deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: 'Mantém a ideia de continuação em relação ao contexto anterior: Judá também sairá decepcionada deste apoio estrangeiro.'
- source_word: מֵאֵת זֶה
  choice: deste
  rationale: Preserva o demonstrativo hebraico sem explicitar no corpo do versículo que a referência contextual provável é o Egito.
- source_word: תֵּצְאִי
  choice: você sairá
  rationale: Reproduz diretamente o verbo יצא e a forma feminina singular, dirigida a Judá personificada.
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: com as mãos sobre a cabeça
  rationale: Conserva a imagem concreta do gesto de tristeza, vergonha ou derrota em português natural.
- source_word: מָאַס
  choice: rejeitou
  rationale: Expressa adequadamente a recusa decisiva de Yahweh sem intensificar o verbo para 'desprezou'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico.
- source_word: בְּמִבְטַחַיִךְ
  choice: aquilo em que você confia
  rationale: O plural hebraico significa literalmente 'suas confianças' ou 'seus objetos de confiança'; esta formulação mantém aberta a referência a poderes ou recursos nos quais Judá deposita confiança.
- source_word: תַצְלִיחִי לָהֶם
  choice: você não terá êxito por meio disso
  rationale: Traduz o sentido de הצליח no Hifil e entende a relação preposicional como a falta de sucesso obtido mediante os objetos de confiança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; 'Yahweh' preserva essa função e evita substituí-lo por um título.
- issue: Identidade de מִבְטַחַיִךְ
  choice: aquilo em que você confia
  alternative: aqueles em quem você confia; seus apoios
  rationale: Embora o contexto aponte para alianças estrangeiras, a expressão hebraica é abstrata e plural. A tradução evita restringir indevidamente o referente a pessoas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O tratamento por “você” torna explícita a segunda pessoa feminina singular dirigida a Judá personificada. A formulação conserva o demonstrativo e a amplitude semântica dos objetos de confiança.
