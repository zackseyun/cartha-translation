  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: pt
  text: 'Ó geração, vocês mesmos, vejam a palavra de Yahweh: Será que fui um deserto para Israel ou uma terra de profunda escuridão? Por que o meu povo disse: “Somos senhores de nós mesmos[a]; não iremos mais a ti”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Andamos livremente”, “dominamos” ou “rompemos as amarras”. O verbo hebraico é difícil; no contexto, o povo reivindica independência de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר
  choice: Ó geração
  rationale: Entende o sintagma como vocativo e preserva o tom solene da convocação profética.
- source_word: אַתֶּם
  choice: vocês mesmos
  rationale: Reproduz a ênfase do pronome independente em português natural e amplamente compreensível.
- source_word: רְאוּ דְבַר יְהוָה
  choice: vejam a palavra de Yahweh
  rationale: Mantém a imagem hebraica de ver/considerar e a fórmula profética com o nome divino transliterado.
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: Será que fui um deserto para Israel
  rationale: Conserva a pergunta retórica e a metáfora de um lugar inóspito e improdutivo.
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: uma terra de profunda escuridão
  rationale: Expressa a intensidade de מַאְפֵּלְיָה sem reduzir o termo a uma simples terra escura.
- source_word: רַדְנוּ
  choice: Somos senhores de nós mesmos
  rationale: O verbo é textualmente e lexicalmente difícil. Esta formulação comunica a reivindicação contextual de autonomia, mantendo em nota alternativas mais literais possíveis.
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: não voltaremos mais a ti
  rationale: No contexto de ruptura relacional, 'voltar' comunica de modo natural a recusa de tornar a Yahweh, embora o verbo hebraico seja literalmente 'vir'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido do verbo difícil רַדְנוּ
  choice: Somos senhores de nós mesmos
  alternative: Andamos livremente; dominamos; rompemos as amarras
  rationale: O contexto indica uma declaração rebelde de independência em relação a Yahweh. A tradução explicita essa força sem fixar silenciosamente uma derivação lexical incontroversa; a incerteza é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocativo profético solene. Emprega 'vocês' para legibilidade brasileira e 'a ti' na fala dirigida a Deus, preservando a mudança de pessoa do hebraico. A ambiguidade de רַדְנוּ é sinalizada explicitamente em nota.
