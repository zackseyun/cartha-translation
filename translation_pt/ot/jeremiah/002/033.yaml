translation:
  language: pt
  text: Como você prepara bem o seu caminho para buscar amor! Por isso, você ensinou os seus caminhos até mesmo às mulheres más[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você ensinou os seus caminhos até às coisas más”, entendendo o plural feminino de modo abstrato, e não como referência a “mulheres más”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּיטִבִי דַּרְכֵּךְ
  choice: Como você sabe preparar bem o seu caminho
  rationale: A construção é exclamativa e irônica. “Sabe preparar bem” comunica habilidade deliberada e conserva a ligação do verbo causativo com “caminho”, sem produzir uma formulação artificial em português.
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: para buscar amor
  rationale: Mantém o substantivo singular “amor” do hebraico e não explicita “amantes”, embora o contexto de infidelidade sustente essa imagem.
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a relação inferencial ou resultativa entre as duas partes do versículo.
- source_word: גַּם
  choice: até
  rationale: 'Neste contexto, tem força intensificadora: a acusada chegou ao ponto de instruir até mulheres já más.'
- source_word: הָרָעוֹת
  choice: as mulheres más
  rationale: O plural feminino substantivado é entendido como referência pessoal, leitura favorecida pela figura da mulher infiel no contexto. A possível leitura abstrata é registrada em nota.
- source_word: למדתי
  choice: você ensinou
  rationale: Segue a leitura contextual e tradicional como segunda pessoa feminina singular, em harmonia com a mulher diretamente interpelada ao longo do trecho.
- source_word: דְּרָכָיִךְ
  choice: os seus caminhos
  rationale: Conserva o plural e a repetição do campo metafórico de “caminho”, aqui com o sentido ampliado de práticas ou modos de agir.
theological_decisions:
- issue: Referência do plural feminino הָרָעוֹת na metáfora do amor ilícito
  choice: 'Referência pessoal: “as mulheres más”'
  alternative: 'Referência abstrata: “coisas más” ou “maldades”'
  rationale: O contexto representa Judá como mulher que procura amores ilícitos, de modo que a ideia de ela ensinar suas práticas até a mulheres más se integra bem à acusação. Como a forma hebraica também admite uma compreensão abstrata, essa possibilidade não é eliminada e aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A exclamação preserva a ironia profética; “você” corresponde à segunda pessoa feminina singular dirigida a Judá. A formulação mantém a repetição de “caminho/caminhos” e evita explicitar “amantes” onde o hebraico diz literalmente “amor”.
