revisions:
- from: Como você sabe preparar bem o seu caminho para buscar amor! Por isso, você ensinou os seus caminhos até às mulheres más[a].
  to: Como você prepara bem o seu caminho para buscar amor! Por isso, você ensinou os seus caminhos até mesmo às mulheres más[a].
  rationale: A revisão corrige a inversão sintática presente na nota, preservando a ambiguidade lexical de הָרָעוֹת sem mudar o sentido da leitura principal. Também simplifica levemente a primeira exclamação para refletir de modo mais direto a construção hebraica e mantém a intensificação de גַּם em “até mesmo”.
