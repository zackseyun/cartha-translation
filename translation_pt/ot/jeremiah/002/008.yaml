id: JER.2.8
reference: Jeremiah 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: pt
  text: 'Os sacerdotes não disseram: “Onde está Yahweh?” Os que lidam com a lei[a] não me conheceram; os pastores se rebelaram contra mim; os profetas profetizaram por Baal[b] e foram atrás de coisas que não trazem proveito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os que agarram” ou “manuseiam a lei”; também pode se referir aos que a ensinam.
    reason: lexical_alternative
  - marker: b
    text: Ou “profetizaram em nome de Baal”.
    reason: alternative_reading
  - marker: c
    text: Ou “seguiram o que é inútil”. O objeto não é expresso no hebraico; o contexto sugere deuses falsos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Traduz diretamente o substantivo plural concreto, que designa os líderes sacerdotais.
- source_word: אַיֵּה יְהוָה
  choice: Onde está Yahweh?
  rationale: Preserva a pergunta retórica e representa o nome divino יהוה como Yahweh.
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: os que lidam com a lei
  rationale: Mantém, em português natural, a ideia concreta de pessoas que têm a lei em mãos ou se ocupam dela, sem restringi-las apenas a mestres.
- source_word: לֹא יְדָעוּנִי
  choice: não me conheceram
  rationale: Conserva a força relacional de ידע com objeto pessoal, sem reduzi-la a mero conhecimento intelectual.
- source_word: הָרֹעִים
  choice: os pastores
  rationale: Preserva a metáfora profética para os dirigentes, em vez de substituí-la por uma interpretação como “governantes”.
- source_word: פָּשְׁעוּ בִי
  choice: se rebelaram contra mim
  rationale: Expressa a revolta e a quebra de lealdade implicadas por פשע, mais fortes que uma transgressão genérica.
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: os profetas profetizaram por Baal
  rationale: Preserva de modo conciso a possível ideia de agência ou esfera expressa pela preposição ב, deixando a formulação mais explícita para a nota.
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: foram atrás de coisas que não trazem proveito
  rationale: Reproduz o idioma de seguir ou buscar algo e mantém indefinido o objeto implícito, sem inserir explicitamente “ídolos”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” conserva o nome da aliança em vez de substituí-lo por um título.
- issue: Identidade dos “pastores”
  choice: manter a metáfora “pastores”
  alternative: líderes; governantes
  rationale: Embora dirigentes estejam em vista, a imagem pastoral pertence ao texto e não deve ser silenciosamente interpretada.
- issue: Objeto implícito na oração final
  choice: coisas que não trazem proveito
  alternative: ídolos; aquilo que é inútil
  rationale: O contexto aponta para falsos deuses, mas o hebraico não explicita “ídolos”; a tradução mantém essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém o paralelismo acusatório do hebraico; “lidam com a lei” evita tanto um literalismo obscuro quanto a especificação indevida de uma função única.
