source:
  edition: WLC
  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: pt
  text: Israel era consagrado a Yahweh, as primícias de sua colheita.[a] Todos os que o devoram[b] incorrem em culpa; a calamidade virá sobre eles[c] — declaração de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as primícias de sua produção”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “todos os que o comem”. A imagem retrata povos que consomem ou saqueiam Israel.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “serão considerados culpados” ou “se tornarão culpados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: santo
  rationale: O substantivo funciona predicativamente e descreve Israel como consagrado, separado para Yahweh. “Santo” preserva de modo natural a força sacra e pactual.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: 'A preposição לְ indica relação ou dedicação: Israel era santo e pertencia de modo especial a Yahweh.'
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: as primícias de sua colheita
  rationale: A expressão evoca a primeira parte da produção, consagrada a Deus. “Primícias” conserva a imagem cultual; “colheita” comunica naturalmente o sentido agrícola de תְּבוּאָה.
- source_word: אֹכְלָיו
  choice: os que o devoravam
  rationale: O particípio significa literalmente os que comiam Israel, aqui metáfora de povos que o atacavam e saqueavam. “Devoravam” preserva a imagem e sua violência.
- source_word: יֶאְשָׁמוּ
  choice: incorriam em culpa
  rationale: O verbo expressa tornar-se culpado ou contrair responsabilidade por culpa. A formulação preserva o vínculo entre a agressão contra Israel e o juízo subsequente.
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: a desgraça vinha sobre eles
  rationale: Neste contexto de juízo, רָעָה designa calamidade ou desgraça, não necessariamente mal moral. O imperfeito pode retratar o resultado recorrente no período recordado.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: A construção é uma fórmula profética solene. “Declaração de Yahweh” mantém seu caráter oracular sem acrescentar um verbo não expresso.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome pactual יהוה. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Israel como produção consagrada
  choice: as primícias de sua colheita
  alternative: o primeiro fruto de sua produção
  rationale: A imagem apresenta Israel como a porção inicial e consagrada pertencente a Yahweh. “Primícias” mantém essa ressonância sem desenvolver implicações doutrinárias além do texto.
- issue: Valor temporal dos verbos imperfeitos
  choice: 'ação habitual no passado: “devoravam”, “incorriam”, “vinha”'
  alternative: 'ação prospectiva: “devorarem”, “serão culpados”, “virá”'
  rationale: O contexto recorda a condição de Israel no início de sua história, favorecendo uma descrição habitual das consequências sofridas por seus agressores. A nota registra a leitura prospectiva possível.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Primícias” conserva a imagem religiosa tradicional, enquanto “colheita”, “devoravam” e “desgraça” mantêm a frase acessível. O pronome masculino singular em “o devoravam” acompanha Israel como nome coletivo no hebraico.
