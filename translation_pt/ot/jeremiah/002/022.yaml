  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: pt
  text: Mesmo que você se lave com natrão[a] e use muito álcali[b], sua culpa está manchada diante de mim[c] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com soda”; o natrão é um mineral alcalino usado na limpeza.
    reason: lexical_alternative
  - marker: b
    text: Ou “muito sabão”. O termo hebraico indica uma antiga substância alcalina de lavagem, provavelmente derivada de cinzas vegetais, e não necessariamente o sabão moderno.
    reason: historical_clarification
  - marker: c
    text: Ou “sua iniquidade está marcada diante de mim”. O hebraico pode evocar tanto uma marca registrada quanto uma mancha que não se remove.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, ainda que
  rationale: A expressão tem força concessiva no contexto e também liga o versículo ao argumento anterior; a formulação preserva ambos os aspectos em português natural.
- source_word: תְּכַבְּסִי
  choice: você se lave
  rationale: O verbo é usado concretamente para lavar, sobretudo roupas, mas aqui descreve metaforicamente uma tentativa de purificação moral. A forma feminina singular do hebraico dirige-se a Jerusalém/Israel personificada; o português não precisa marcar o gênero no pronome.
- source_word: בַּנֶּתֶר
  choice: com soda
  rationale: נֶתֶר designa um agente mineral alcalino de limpeza, geralmente identificado como natrão ou soda. “Soda” é mais compreensível em português corrente, com a precisão histórica indicada em nota.
- source_word: וְתַרְבִּי לָךְ
  choice: e use muito
  rationale: A construção expressa aumentar ou aplicar para si uma grande quantidade. “Use muito” comunica o sentido idiomático sem reproduzir de modo rígido a sintaxe hebraica.
- source_word: בֹּרִית
  choice: sabão
  rationale: O termo designa uma substância alcalina de lavagem, provavelmente produzida de cinzas vegetais. “Sabão” mantém a imagem acessível, enquanto a nota esclarece que não se trata necessariamente do produto moderno.
- source_word: נִכְתָּם
  choice: continuará marcada
  rationale: O passivo indica que a culpa permanece registrada ou como uma mancha que a lavagem não remove. “Continuará marcada” preserva tanto a ideia de marca persistente quanto a ligação com a metáfora da lavagem.
- source_word: עֲוֺנֵךְ
  choice: a sua culpa
  rationale: עָוֹן pode designar a perversidade cometida e a culpa decorrente dela. Neste contexto de responsabilidade moral diante de Deus, “culpa” é claro sem excluir a nuance de iniquidade, registrada em nota.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: A expressão denota a presença, percepção e avaliação diretas de Deus; “diante de mim” é idiomático e solene.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética de declaração. “Senhor Yahweh” representa separadamente o título אֲדֹנָי e o nome divino יהוה, evitando a repetição artificial “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: O texto contém tanto o título אֲדֹנָי quanto o nome pessoal יהוה. A tradução mantém os dois elementos de modo explícito, sem substituir o nome por outro título.
- issue: Sentido de עָוֹן
  choice: culpa
  alternative: iniquidade; perversidade
  rationale: O substantivo pode referir-se ao ato perverso ou à culpa que ele acarreta. O contexto daquilo que permanece diante de Deus favorece “culpa”, mas a nota conserva a amplitude sem decidir que apenas a consequência jurídica está em vista.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O tratamento por “você” torna explícita a segunda pessoa singular sem arcaísmo; o referente feminino personificado é recuperado pelo contexto mais amplo. As notas preservam a natureza antiga dos agentes de limpeza e a ambiguidade entre marca e mancha.
