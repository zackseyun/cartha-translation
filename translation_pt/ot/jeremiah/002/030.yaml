  text: לַ/שָּׁוְא֙ הִכֵּ֣יתִי אֶת בְּנֵי/כֶ֔ם מוּסָ֖ר לֹ֣א לָקָ֑חוּ אָכְלָ֧ה חַרְבְּ/כֶ֛ם נְבִֽיאֵי/כֶ֖ם כְּ/אַרְיֵ֥ה מַשְׁחִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: pt
  text: Em vão golpeei os filhos de vocês[a]; eles não aceitaram correção[b]. A espada de vocês devorou os profetas de vocês como um leão destruidor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes”; o hebraico traz literalmente o plural masculino “filhos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “disciplina” ou “instrução”; o termo hebraico pode incluir tanto a disciplina corretiva quanto a instrução moral.
    reason: lexical_alternative
  - marker: c
    text: Ou “como um leão que devora” ou “como um leão devastador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  choice: Em vão
  rationale: A expressão com לְ tem valor adverbial e indica inutilidade ou ausência do resultado pretendido; “em vão” é natural e fiel.
- source_word: הִכֵּיתִי
  choice: castiguei
  rationale: Embora נכה signifique literalmente “golpear”, no contexto o golpe divino visa corrigir; “castiguei” comunica essa ação disciplinar sem sugerir necessariamente morte.
- source_word: בְּנֵיכֶם
  choice: os seus filhos
  rationale: Mantém o plural masculino do hebraico; em português, “filhos” também pode abranger descendentes ou membros do povo conforme o contexto.
- source_word: מוּסָר
  choice: correção
  rationale: מוּסָר abrange correção, disciplina e instrução; após o castigo mencionado, “correção” preserva bem o caráter remedial.
- source_word: לֹא לָקָחוּ
  choice: não aceitaram
  rationale: Com מוּסָר, לקח significa idiomaticamente receber ou aceitar a correção; “não aceitaram” expressa com naturalidade a recusa.
- source_word: אָכְלָה
  choice: devorou
  rationale: Preserva a metáfora vívida da espada que come ou consome.
- source_word: חַרְבְּכֶם
  choice: A espada de vocês
  rationale: Reproduz claramente o possessivo hebraico e atribui ao povo a violência contra os profetas.
- source_word: נְבִיאֵיכֶם
  choice: os seus profetas
  rationale: Conserva o possessivo, que ressalta a ironia de o próprio povo destruir os profetas enviados a ele ou presentes entre ele.
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: como um leão destruidor
  rationale: Mantém a comparação e a força participial de מַשְׁחִית sem acrescentar a ideia mais específica de voracidade.
theological_decisions:
- issue: Sentido do golpe divino
  choice: “castiguei”, entendido como ação corretiva
  alternative: “golpeei”, tradução lexical mais direta
  rationale: A oração seguinte explicita que o objetivo era produzir מוּסָר, isto é, correção ou disciplina. A formulação não determina além do texto a natureza exata do castigo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” implícito nos possessivos. A repetição de “seus” poderia criar ambiguidade referencial; por isso, “de vocês” explicita o primeiro possessivo no segundo período. A imagem forte da espada que devora e a comparação com o leão foram preservadas.
