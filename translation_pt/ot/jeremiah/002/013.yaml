id: JER.2.13
reference: Jeremiah 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: pt
  text: 'Pois o meu povo cometeu dois males: abandonou a mim, a fonte de águas vivas, e cavou para si cisternas — cisternas rachadas, que não retêm água.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da acusação anterior e preserva de modo natural a força causal do hebraico.
- source_word: שְׁתַּיִם רָעוֹת
  choice: dois males
  rationale: Mantém a contagem explícita e o peso moral de רָעוֹת, sem suavizá-lo para simples erros.
- source_word: עָשָׂה עַמִּי
  choice: o meu povo cometeu
  rationale: Embora עָשָׂה seja o verbo comum para fazer, 'cometeu dois males' é a construção portuguesa mais natural e conserva o sentido.
- source_word: אֹתִי עָזְבוּ
  choice: abandonou a mim
  rationale: Expressa a gravidade relacional de עזב e, com 'a mim', conserva a ênfase contrastiva do objeto hebraico diante da segunda ação.
- source_word: מְקוֹר מַיִם חַיִּים
  choice: a fonte de águas vivas
  rationale: Preserva a metáfora, o substantivo que designa nascente ou fonte e o plural poético מַיִם; 'águas vivas' mantém a ideia de água corrente e vital.
- source_word: לַחְצֹב לָהֶם
  choice: cavou para si
  rationale: חצב descreve escavar ou talhar, especialmente em rocha; 'cavou' é claro no contexto, e 'para si' comunica o valor reflexivo do dativo.
- source_word: בֹּארוֹת
  choice: cisternas
  rationale: Designa reservatórios escavados para armazenar água e mantém o contraste com uma fonte natural; 'poços' apagaria esse contraste.
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: cisternas rachadas
  rationale: '''Rachadas'' explicita o defeito relevante no contexto — o vazamento — de maneira concreta e natural, sem exagerar para ''despedaçadas''.'
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: que não retêm água
  rationale: Verte idiomaticamente a incapacidade das cisternas de conter ou conservar água e preserva a imagem literal.
theological_decisions:
- issue: Metáfora aquática aplicada a Deus
  choice: Manter 'a fonte de águas vivas' como aposição a 'mim'.
  alternative: Explicitar como 'a fonte da vida' ou 'a fonte de água que dá vida'.
  rationale: O hebraico apresenta a metáfora sem interpretá-la. Mantê-la conserva sua força profética e sua abertura teológica.
- issue: Relação entre os 'dois males'
  choice: 'Apresentar as duas ações coordenadas: abandonar Deus e cavar cisternas defeituosas.'
  alternative: Fundir as ações numa paráfrase sobre trocar Deus por ídolos.
  rationale: O texto caracteriza as ações por meio da metáfora, mas não identifica explicitamente aqui as cisternas como ídolos; a tradução não deve resolver essa imagem por paráfrase doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem profética e a estrutura dos dois males. Não foram necessárias notas de rodapé; por isso, não há marcadores no texto.
