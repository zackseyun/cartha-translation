base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: pt
  text: 'Eles dizem a uma árvore: “Você é meu pai”, e a uma pedra: “Você me deu à luz.” Pois voltaram-me as costas, e não o rosto[a]; mas, no tempo de sua desgraça[b], dizem: “Levante-se e salve-nos!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “voltaram para mim a nuca, e não o rosto”, expressão que indica rejeição.
    reason: lexical_alternative
  - marker: b
    text: Ou “no tempo de sua calamidade” ou “no tempo de sua aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָעֵץ
  choice: a uma árvore
  rationale: עֵץ pode significar “árvore” ou “madeira”; “árvore” preserva a imagem concreta e o contraste com “pedra” na denúncia da idolatria.
- source_word: אַתְּ יְלַדְתִּנִי
  choice: Você me deu à luz
  rationale: O verbo ילד, na forma feminina singular por concordar com “pedra”, expressa o ato de dar à luz; a tradução mantém a atribuição absurda de origem maternal ao ídolo.
- source_word: פָנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: viraram para mim as costas, e não o rosto
  rationale: A formulação conserva o contraste hebraico entre nuca/costas e rosto, permanecendo compreensível em português.
- source_word: וּבְעֵת רָעָתָם
  choice: mas, no tempo de sua desgraça
  rationale: רָעָה pode indicar mal, aflição ou calamidade; “desgraça” comunica aqui a situação adversa que leva o povo a pedir socorro.
- source_word: יֹאמְרוּ
  choice: dizem
  rationale: O imperfeito pode descrever a reação habitual ou esperada; o presente dá vivacidade à acusação e funciona naturalmente com a expressão temporal.
- source_word: קוּמָה וְהוֹשִׁיעֵנוּ
  choice: Levanta-te e salva-nos
  rationale: Mantém os dois imperativos e o tom urgente da súplica, em linguagem digna e amplamente inteligível.
theological_decisions:
- issue: Linguagem de parentesco dirigida aos ídolos
  choice: Manter literalmente “Você é meu pai” e “Você me deu à luz”
  alternative: Generalizar como uma declaração de adoração a ídolos
  rationale: O hebraico atribui explicitamente paternidade e origem a madeira e pedra; preservar isso conserva a força da acusação profética sem a suavizar.
- issue: Contraste entre costas e rosto diante de Deus
  choice: Preservar a imagem corporal explícita
  alternative: Parafrasear como “eles me rejeitaram”
  rationale: A imagem comunica rejeição e infidelidade, mas sua retenção permite que o leitor perceba a metáfora original e sua intensidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de tratamento coerentes dentro das falas. A imagem hebraica foi preservada no corpo do texto, enquanto a nota esclarece seu sentido idiomático. Os marcadores [a] e [b] aparecem no texto principal.
