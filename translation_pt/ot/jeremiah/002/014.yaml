  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a slave[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: pt
  text: Israel é escravo ou escravo nascido na casa?[a] Por que, então, ele se tornou despojo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, um escravo nascido no grupo doméstico de seu senhor. Ou: “alguém nascido na casa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “presa” ou “saque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  choice: escravo
  rationale: עֶבֶד pode designar servo ou escravo; aqui, a condição de sujeição está em primeiro plano na pergunta retórica, por isso “escravo” preserva melhor sua força.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: אִם
  choice: ou
  rationale: Nesta construção interrogativa, אִם introduz uma possibilidade alternativa, com o sentido de “ou”.
- source_word: יְלִיד בַּיִת
  choice: alguém nascido na casa
  rationale: A expressão significa literalmente alguém nascido na casa ou no grupo doméstico de um senhor. A formulação mantém a imagem hebraica sem acrescentar ao texto principal uma qualificação apenas implícita.
- source_word: הוּא
  choice: ele
  rationale: O pronome masculino singular retoma Israel personificado.
- source_word: מַדּוּעַ
  choice: Por que, então
  rationale: “Por que” traduz o interrogativo; “então” expressa naturalmente a inferência retórica entre as duas perguntas.
- source_word: הָיָה
  choice: se tornou
  rationale: Neste contexto, o perfeito descreve a chegada a uma condição resultante; “se tornou” comunica isso com naturalidade.
- source_word: לָבַז
  choice: despojo
  rationale: בַּז designa aquilo que é tomado como saque ou despojo. “Despojo” funciona como predicativo e conserva o campo semântico do saque.
theological_decisions:
- issue: Terminologia de condição social em עֶבֶד
  choice: Traduzir por “escravo”
  alternative: Traduzir por “servo”
  rationale: A linguagem de escravidão é relevante para a força da pergunta retórica e evita suavizar a condição social expressa pelo hebraico.
- issue: Explicitação da condição de יְלִיד בַּיִת
  choice: Manter no texto “alguém nascido na casa” e explicar a referência social em nota
  alternative: Traduzir diretamente por “escravo nascido na casa”
  rationale: A versão principal preserva a formulação e a concisão do hebraico, enquanto a nota esclarece que se trata de alguém nascido no grupo doméstico de um senhor, geralmente em condição servil.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do pronome “ele” preserva a personificação masculina de Israel, e as perguntas mantêm a tensão retórica do hebraico.
