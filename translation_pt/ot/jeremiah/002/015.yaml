  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: pt
  text: Leões jovens rugem contra ele; levantam a voz. Tornam sua terra uma desolação; suas cidades são incendiadas[a], sem habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas cidades estão devastadas, sem habitantes”. A forma hebraica נצתה é difícil e pode ser entendida como “incendiadas” ou, de modo mais geral, “devastadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: contra ele
  rationale: Com o verbo “rugir”, a preposição tem sentido hostil e dirige a ameaça contra Israel/Jacó, personificado no singular masculino.
- source_word: יִשְׁאֲגוּ
  choice: rugem
  rationale: É o equivalente natural para a vocalização dos leões e preserva a imagem predatória vívida.
- source_word: כְפִרִים
  choice: leões novos
  rationale: Designa leões jovens e vigorosos, não filhotes pequenos; a expressão é clara e precisa em português.
- source_word: נָתְנוּ קוֹלָם
  choice: levantam a voz
  rationale: Traduz naturalmente o idiomatismo hebraico “dar a voz”, preservando a intensidade do brado ameaçador.
- source_word: וַיָּשִׁיתוּ
  choice: transformaram
  rationale: Expressa o sentido resultativo de fazer a terra passar ao estado de desolação.
- source_word: אַרְצוֹ
  choice: sua terra
  rationale: Mantém o possessivo singular e a personificação nacional de Israel/Jacó.
- source_word: לְשַׁמָּה
  choice: em desolação
  rationale: Preserva a ideia substantiva de devastação e produz uma construção natural com “transformaram”.
- source_word: עָרָיו
  choice: suas cidades
  rationale: Reproduz o plural com sufixo possessivo masculino singular, em continuidade com a personificação nacional.
- source_word: נצתה
  choice: foram queimadas
  rationale: Adota a interpretação contextual provável ligada a queimar ou incendiar, sem ocultar a dificuldade da forma hebraica; a alternativa mais geral consta em nota.
- source_word: מִבְּלִי יֹשֵׁב
  choice: ficaram sem habitantes
  rationale: Comunica de modo claro e atual a fórmula hebraica de despovoamento, preservando seu sentido coletivo.
