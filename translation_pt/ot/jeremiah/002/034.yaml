  terminology: “Abas de suas roupas” representa bem o uso vestimentar de כָּנָף sem introduzir a imagem enganosa de asas. “Pobres inocentes” mantém tanto a condição social quanto a inocência forense das vítimas. A tradução evita corretamente importar o sentido teológico posterior de “alma” para נֶפֶשׁ.
