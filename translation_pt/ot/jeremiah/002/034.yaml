  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do texto massorético: o sangue encontrado nas extremidades da veste, as vítimas pobres e inocentes, o verbo na primeira pessoa singular (“Eu não os encontrei”) e a formulação final deliberadamente elíptica. “Num arrombamento” comunica de modo acessível o cenário de invasão por abertura de parede implícito em מַחְתֶּרֶת.'
