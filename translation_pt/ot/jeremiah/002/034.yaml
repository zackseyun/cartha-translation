  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: pt
  text: Até nas abas de suas roupas se encontra o sangue das vidas dos pobres inocentes[a]. Eu não os encontrei num arrombamento[b], mas por causa de todas essas coisas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas barras de suas vestes”; literalmente, “em suas asas”.'
    reason: lexical_alternative
  - marker: b
    text: “Arrombamento” traduz um termo ligado à invasão realizada abrindo uma passagem numa parede; compare o contexto jurídico de Êxodo 22:2.
    reason: cross_reference
  - marker: c
    text: 'A cláusula final em hebraico é elíptica e difícil. Outra tradução possível é: “Não porque eu os tenha encontrado arrombando uma casa, mas por todas essas coisas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: nas abas de suas roupas
  rationale: כָּנָף significa literalmente “asa” ou “extremidade” e, no contexto de vestuário, designa a aba, borda ou barra da roupa. “Abas de suas roupas” mantém a imagem concreta de sangue visível na vestimenta sem sugerir asas literais.
- source_word: נִמְצְאוּ
  choice: se encontra
  rationale: Embora o verbo hebraico esteja no plural, em português “sangue” funciona naturalmente como substantivo massivo singular. A construção preserva o sentido passivo de algo descoberto ou constatado.
- source_word: דַּם נַפְשׁוֹת
  choice: o sangue das vidas
  rationale: A expressão hebraica é incomum e enfática. נֶפֶשׁ aponta aqui para vida ou pessoa, não para “alma” em sentido teológico posterior. A formulação conserva a estranheza significativa do original.
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: dos pobres inocentes
  rationale: אֶבְיוֹנִים designa pessoas pobres ou necessitadas, e נְקִיִּים indica inocência ou ausência de culpa. A expressão é clara e mantém o teor jurídico e moral da acusação.
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: num arrombamento
  rationale: מַחְתֶּרֶת refere-se à entrada clandestina obtida escavando ou rompendo uma parede. “Arrombamento” comunica de modo atual a situação de invasão mencionada na antiga lei.
- source_word: מְצָאתִים
  choice: Eu não os encontrei
  rationale: A forma massorética é primeira pessoa do singular com objeto na terceira pessoa do plural. Mantém-se, portanto, o SENHOR como falante e os pobres inocentes como referente provável de “os”.
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: mas por causa de todas essas coisas
  rationale: A cláusula é elíptica e difícil. “Mas” expressa o contraste contextual, e “por causa de” representa o possível valor causal de עַל sem completar indevidamente aquilo que o hebraico deixa implícito.
theological_decisions:
- issue: Identidade do falante e do objeto na cláusula central
  choice: 'O SENHOR fala na primeira pessoa: “Eu não os encontrei num arrombamento”; “os” remete aos pobres inocentes.'
  alternative: Ler, mediante ajuste textual ou interpretativo, “você não os encontrou arrombando uma casa”.
  rationale: 'A vocalização massorética sustenta a primeira pessoa do singular com sufixo de objeto plural. Preservar essa forma evita emenda desnecessária e mantém a acusação forense divina: as vítimas não foram mortas numa circunstância que pudesse ser alegada como defesa legítima contra invasores.'
- issue: Sentido da cláusula final elíptica
  choice: Manter “mas por causa de todas essas coisas”, preservando sua abertura referencial.
  alternative: Explicitar “mas você os matou por causa de todas essas coisas” ou entender “apesar de todas essas coisas”.
  rationale: O hebraico não declara o verbo nem define com precisão o alcance de “todas essas coisas”. A tradução conserva a tensão e a dificuldade em vez de impor uma solução teológica ou narrativa única.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Evitou-se “saia”, que estreitaria indevidamente a imagem, e “alma”, que poderia importar um sentido teológico não exigido por נֶפֶשׁ. A formulação deliberadamente incomum “sangue das vidas” conserva a ênfase do hebraico, enquanto as notas esclarecem a metáfora do vestuário, o contexto jurídico e a sintaxe difícil do final.
