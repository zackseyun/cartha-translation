  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח בְּתוּלָה֙ עֶדְיָ֔/הּ כַּלָּ֖ה קִשֻּׁרֶ֑י/הָ וְ/עַמִּ֣/י שְׁכֵח֔וּ/נִי יָמִ֖ים אֵ֥ין מִסְפָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: pt
  text: Será que uma virgem se esquece de suas joias, ou uma noiva, de seus adornos[a]? No entanto, o meu povo se esqueceu de mim por dias sem conta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «suas faixas nupciais». O termo hebraico pode designar mais especificamente faixas, cintos ou enfeites atados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: Será que ... se esquece
  rationale: Expressa de modo natural em português a pergunta retórica introduzida por הֲ e seu caráter de verdade geral.
- source_word: בְּתוּלָה
  choice: uma virgem
  rationale: Preserva o sentido lexical usual e o paralelismo com «uma noiva».
- source_word: עֶדְיָהּ
  choice: suas joias
  rationale: Designa adorno ou enfeite pessoal; «joias» é claro e idiomático no contexto.
- source_word: כַּלָּה
  choice: uma noiva
  rationale: Tradução direta do substantivo, empregada genericamente na comparação retórica.
- source_word: קִשֻּׁרֶיהָ
  choice: seus adornos
  rationale: O termo parece indicar acessórios atados ou enfeites nupciais, mas o objeto exato é incerto; a escolha evita especificação indevida.
- source_word: וְעַמִּי
  choice: No entanto, o meu povo
  rationale: A conjunção introduz forte contraste entre a conduta esperada e o esquecimento de Deus.
- source_word: שְׁכֵחוּנִי
  choice: se esqueceu de mim
  rationale: A construção pronominal é natural em português e mantém a acusação de esquecimento sem intensificá-la para abandono.
- source_word: יָמִים אֵין מִסְפָּר
  choice: por dias sem conta
  rationale: Reproduz de maneira concisa e natural o idioma hebraico de duração incontável.
theological_decisions:
- issue: Força pactual de «o meu povo» esquecer-se de Deus
  choice: Manter a linguagem relacional de esquecimento
  alternative: Traduzir como «o meu povo me abandonou»
  rationale: Embora o contexto sugira infidelidade pactual, o versículo emprega o verbo «esquecer»; a tradução preserva a metáfora e não explicita uma acusação mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi mantida, e a incerteza lexical de קִשֻּׁרֶיהָ foi registrada em nota.
