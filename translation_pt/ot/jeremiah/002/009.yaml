  text: לָ/כֵ֗ן עֹ֛ד אָרִ֥יב אִתְּ/כֶ֖ם נְאֻם יְהוָ֑ה וְ/אֶת בְּנֵ֥י בְנֵי/כֶ֖ם אָרִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/009.yaml
  text: Therefore I will still contend with you[a], declares Yahweh, and with your children's children I will contend.
translation:
  language: pt
  text: Por isso, ainda entrarei em contenda com vocês[a] — declara Yahweh —, e entrarei em contenda com os filhos dos filhos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entrarei em contenda contra vocês [...] e contra os filhos dos filhos de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão lógica decorrente da acusação anterior.
- source_word: עוֹד
  choice: ainda
  rationale: Mantém a ideia de continuidade ou persistência da ação judicial, sem excluir uma nuance reiterativa.
- source_word: אָרִיב
  choice: entrarei em contenda
  rationale: Preserva o campo semântico jurídico e adversarial de ריב, bem como a repetição enfática do verbo no hebraico.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Reproduz de perto a construção preposicional hebraica; o caráter adversarial já é comunicado por 'contenda'. A alternativa 'contra vocês' é registrada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Traduz a fórmula profética de autoridade em linguagem portuguesa corrente e digna, preservando o nome divino.
- source_word: וְאֶת בְּנֵי בְנֵיכֶם
  choice: e ... com os filhos dos filhos de vocês
  rationale: Mantém a continuidade da mesma contenda e conserva a expressão familiar literal e solene do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama; 'Yahweh' procura representar o nome pactual sem substituí-lo por um título.
- issue: Natureza da ação expressa por ריב
  choice: entrarei em contenda
  alternative: apresentarei uma acusação; litigarei contra
  rationale: A escolha preserva a imagem de disputa ou processo pactual sem determinar em excesso os procedimentos jurídicos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o tom profético-jurídico, a repetição hebraica e a expressão geracional literal, evitando o mais coloquial “netos”.
