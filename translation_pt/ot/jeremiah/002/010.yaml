  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: pt
  text: Pois, atravessem para as terras costeiras de Quitim e vejam[a]; enviem a Quedar e examinem com muita atenção[b]. Vejam se alguma vez houve algo assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ilhas de Quitim”. “Quitim” provavelmente se refere a Chipre ou, de modo mais amplo, às terras marítimas do oeste.'
    reason: lexical_alternative
  - marker: b
    text: Quedar designa tribos árabes ou seu território a leste ou sudeste; assim, o texto propõe uma comparação que vai do oeste ao leste.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: atravessem até
  rationale: O imperativo plural de עבר expressa deslocamento geográfico concreto; a formulação mantém essa ideia em português natural.
- source_word: אִיֵּי כִתִּיִּים
  choice: as terras costeiras de Quitim
  rationale: אִיִּים pode indicar ilhas ou regiões costeiras. 'Terras costeiras' preserva a amplitude geográfica, e 'Quitim' mantém o nome próprio.
- source_word: וּרְאוּ
  choice: e vejam / Vejam
  rationale: A repetição de ראה no hebraico é mantida para preservar a insistência retórica da ordem de observar diretamente.
- source_word: וְקֵדָר שִׁלְחוּ
  choice: mandem mensageiros a Quedar
  rationale: O hebraico deixa implícito aquilo que deve ser enviado. Em português, explicitar 'mensageiros' torna a ordem inteligível sem alterar seu sentido provável.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: examinem tudo com muita atenção
  rationale: O verbo no hitpolel indica observação reflexiva ou exame cuidadoso, e מְאֹד intensifica a ordem.
- source_word: הֵן הָיְתָה כָּזֹאת
  choice: se alguma vez aconteceu algo assim
  rationale: A formulação idiomática comunica a pergunta retórica e admirada do hebraico em português corrente.
