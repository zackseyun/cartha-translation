  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “vejam” preserva a retórica do hebraico. “Terras costeiras” mantém a ambiguidade geográfica de אִיִּים, enquanto as notas esclarecem Quitim e Quedar.
