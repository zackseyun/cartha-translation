  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מַה מָּצְא֨וּ אֲבוֹתֵי/כֶ֥ם בִּ/י֙ עָ֔וֶל כִּ֥י רָחֲק֖וּ מֵ/עָלָ֑/י וַ/יֵּֽלְכ֛וּ אַחֲרֵ֥י הַ/הֶ֖בֶל וַ/יֶּהְבָּֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Que injustiça[a] seus antepassados acharam em mim, de modo que se afastaram de mim, foram atrás do que é vazio e se tornaram vazios[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que mal?” ou “Que perversidade?”'
    reason: עָוֶל pode indicar injustiça, maldade, perversidade ou falta moral.
  - marker: b
    text: No hebraico, “o que é vazio” e “se tornaram vazios” derivam da mesma raiz. A frase ressalta que, ao seguirem o que era vazio e sem valor, eles próprios se tornaram assim.
    reason: O jogo de palavras lexical é importante para o sentido e não pode ser reproduzido integralmente sem esclarecimento.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro e translitera diretamente o nome divino יְהוָה.
- source_word: מַה מָּצְאוּ אֲבוֹתֵיכֶם בִּי עָוֶל
  choice: Que injustiça os antepassados de vocês acharam em mim
  rationale: Preserva a pergunta retórica e o idioma hebraico de ‘achar’ algo em alguém. ‘Injustiça’ expressa o sentido moral de עָוֶל; ‘antepassados’ comunica naturalmente a referência às gerações anteriores.
- source_word: כִּי רָחֲקוּ מֵעָלַי
  choice: para que se afastassem de mim
  rationale: Conserva a imagem espacial de distanciamento e apresenta a continuação como consequência ou suposta justificativa da acusação, sem explicitar além do hebraico.
- source_word: וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל
  choice: fossem atrás do que é vazio
  rationale: ‘Ir atrás de’ reproduz o idioma de seguir algo, enquanto ‘o que é vazio’ mantém a amplitude figurada de הֶבֶל sem reduzi-lo explicitamente a ídolos.
- source_word: וַיֶּהְבָּלוּ
  choice: eles mesmos se tornassem vazios
  rationale: Repete ‘vazio’ para reproduzir em português o jogo entre o substantivo הֶבֶל e o verbo da mesma raiz; ‘eles mesmos’ realça o efeito sobre os que seguiram a vacuidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Referente de הַהֶבֶל
  choice: o que é vazio
  alternative: os ídolos; a vaidade; o que não tem valor
  rationale: No contexto, a expressão provavelmente alude aos ídolos, mas o hebraico usa um termo mais amplo, associado a vapor, vazio e falta de valor. A tradução evita resolver implicitamente essa amplitude.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural no Brasil. A pergunta retórica foi mantida como uma única unidade. ‘Antepassados de vocês’ evita arcaísmo e comunica com clareza a referência histórico-pactual. A repetição de ‘vazio’ é deliberada para conservar o efeito retórico hebraico.
