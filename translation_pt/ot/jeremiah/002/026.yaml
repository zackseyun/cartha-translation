  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: pt
  text: 'Assim como um ladrão fica envergonhado quando é descoberto[a], também a casa de Israel ficou coberta de vergonha: ela, seus reis, seus líderes[b], seus sacerdotes e seus profetas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando é apanhado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus príncipes” ou “seus governantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹשֶׁת גַּנָּב
  choice: Assim como um ladrão fica envergonhado
  rationale: Expressa a comparação nominal hebraica em uma oração verbal natural em português, preservando o motivo central da vergonha e o caráter genérico de “um ladrão”.
- source_word: כִּי יִמָּצֵא
  choice: quando é descoberto
  rationale: O nifal de מצא indica que o ladrão é encontrado ou descoberto. “Quando” se ajusta à comparação proverbial; a nota registra a alternativa idiomática “apanhado”.
- source_word: כֵּן
  choice: também
  rationale: Em correlação com “assim como”, comunica de modo natural o segundo termo da comparação.
- source_word: הֹבִישׁוּ
  choice: ficou coberta de vergonha
  rationale: Comunica o estado resultante de desonra pública, e não apenas um sentimento interior, sem recorrer à construção pouco natural “foi envergonhada”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico.
- source_word: הֵמָּה
  choice: ela
  rationale: Retoma enfaticamente a expressão coletiva singular “a casa de Israel” e introduz os grupos representativos enumerados a seguir.
- source_word: מַלְכֵיהֶם
  choice: seus reis
  rationale: Correspondência direta ao plural com sufixo possessivo.
- source_word: שָׂרֵיהֶם
  choice: seus líderes
  rationale: שׂרים pode designar príncipes, governantes ou altos oficiais. “Líderes” é claro no português atual e evita restringir o termo à nobreza hereditária ou ao meio militar.
- source_word: כֹהֲנֵיהֶם
  choice: seus sacerdotes
  rationale: Equivalente corrente e preciso de כהנים.
- source_word: נְבִיאֵיהֶם
  choice: seus profetas
  rationale: Equivalente corrente e preciso de נביאים.
theological_decisions:
- issue: Alcance da culpa na enumeração
  choice: A declaração abrange toda a casa de Israel e destaca seus grupos de liderança.
  alternative: Entender que a acusação se dirige exclusivamente aos líderes enumerados.
  rationale: O sujeito é “a casa de Israel”, retomado pelo pronome enfático antes da lista de reis, líderes, sacerdotes e profetas. A tradução conserva tanto a dimensão coletiva quanto a identificação explícita de seus representantes.
- issue: Natureza da vergonha
  choice: Vergonha pública e estado de desonra decorrente da exposição.
  alternative: Apenas constrangimento ou remorso interior.
  rationale: A comparação com um ladrão descoberto e o emprego de הֹבִישׁוּ favorecem uma vergonha manifesta, sem excluir a dimensão subjetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem da vergonha pública, a expressão “casa de Israel” e a ênfase do pronome hebraico, evitando linguagem excessivamente técnica ou confessional.
