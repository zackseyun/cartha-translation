  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: pt
  text: 'Como você pode dizer: “Não me tornei impura[a]; não fui atrás dos baalins[b]”? Veja o seu caminho no vale; reconheça o que fez — como uma jovem camela veloz que se enreda em seus caminhos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me contaminei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não segui os baalins”. O hebraico traz o plural de Baal.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é raro e seu sentido exato é incerto. A imagem pode ser a de uma jovem camela que cruza, entrelaça ou torce suas trilhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: me tornei impura
  rationale: O nifal de טמא expressa tornar-se impuro ou contaminado. A formulação preserva a voz e a ambiguidade entre impureza ritual e corrupção moral-religiosa, sem introduzir a reflexividade mais forte de “me contaminei”.
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: fui atrás dos baalins
  rationale: A expressão הלך אחרי significa ir atrás de ou seguir. “Fui atrás” conserva a imagem hebraica de busca idólatra; o plural “baalins” reproduz בְּעָלִים e é compreensível em português bíblico.
- source_word: רְאִי דַרְכֵּךְ בַּגַּיְא
  choice: Veja o caminho que você percorreu no vale
  rationale: דרך pode indicar tanto caminho como conduta. A explicitação mínima “que você percorreu” torna a frase natural em português, mantendo a imagem concreta ligada ao vale e sua dimensão figurada.
- source_word: דְּעִי
  choice: reconheça
  rationale: O imperativo de ידע é literalmente “saiba”, mas neste contexto exige admitir ou tomar consciência do que foi feito. “Reconheça” comunica essa força acusatória de modo natural.
- source_word: בִּכְרָה קַלָּה
  choice: jovem camela veloz
  rationale: בִּכְרָה designa uma camela jovem, e קַלָּה descreve sua leveza ou rapidez. A tradução mantém tanto o sexo do animal quanto a vivacidade da comparação.
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: cruzando seus caminhos de um lado para outro
  rationale: O particípio raro שרך tem sentido exato incerto, mas no contexto parece retratar deslocamento errático, entrecruzado ou sinuoso. A escolha oferece uma imagem clara sem ocultar a incerteza, registrada em nota.
theological_decisions:
- issue: Plural בְּעָלִים e a acusação de idolatria
  choice: os baalins
  alternative: Baal; os senhores
  rationale: O plural do texto massorético é preservado, indicando as diversas manifestações, imagens ou cultos associados a Baal. Não se reduz a acusação a uma única designação nem se dilui a referência cultual em “senhores”.
- issue: Sentido de נִטְמֵאתִי
  choice: não me tornei impura
  alternative: não me contaminei; não fui contaminada
  rationale: A tradução conserva a tensão entre impureza cultual e infidelidade moral-religiosa. Evita especificar indevidamente se a impureza foi apenas ritual, moral ou sofrida passivamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O tratamento por “você” corresponde às formas femininas singulares dirigidas a Judá. “Baalins” mantém o plural hebraico e evita a ambiguidade de “Baais”. A pontuação deixa claro que a jovem camela é uma imagem da destinatária.
