id: JER.2.12
reference: Jeremiah 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: pt
  text: '“Fiquem horrorizados diante disso, ó céus;

    estremeçam e fiquem completamente desolados”, declara Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: Fiquem horrorizados
  rationale: O imperativo plural de שמם convoca os céus a uma reação de espanto horrorizado. A formulação é vívida, atual e adequada ao tom profético.
- source_word: שָׁמַיִם
  choice: ó céus
  rationale: Mantém o vocativo e a personificação dos céus como testemunhas do que ocorreu.
- source_word: עַל זֹאת
  choice: diante disso
  rationale: Retém a referência ao fato chocante anteriormente descrito e se combina naturalmente com “ficar horrorizado” em português.
- source_word: וְשַׂעֲרוּ
  choice: estremeçam
  rationale: O verbo שער comunica uma reação física de pavor, possivelmente a ideia de arrepiar-se. “Estremeçam” preserva essa força visceral sem restringir excessivamente a imagem.
- source_word: חָרְבוּ מְאֹד
  choice: fiquem completamente desolados
  rationale: Preserva o imperativo, a intensificação de מְאֹד e a imagem extrema de devastação ou desolação aplicada poeticamente aos céus.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética, mantendo o nome divino explícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino. “Yahweh” o preserva como nome próprio e evita substituí-lo por um título.
- issue: Sentido de חָרְבוּ aplicado aos céus
  choice: fiquem completamente desolados
  alternative: fiquem completamente devastados; sequem completamente
  rationale: A raiz pode indicar secura ou devastação. No paralelismo poético, “desolados” conserva a imagem forte sem convertê-la numa descrição meteorológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética. O vocativo “ó céus” preserva a apostrofe poética; os três imperativos mantêm a intensidade crescente do hebraico.
