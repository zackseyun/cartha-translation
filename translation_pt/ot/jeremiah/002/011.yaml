  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: pt
  text: Alguma nação já trocou de deuses, embora eles nem sejam deuses? Mas o meu povo trocou[a] a sua glória[b] pelo que não traz proveito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “substituiu”. O verbo hebraico pode significar “mudar”, “trocar” ou “substituir”.
    reason: lexical_alternative
  - marker: b
    text: “Sua glória” provavelmente se refere ao SENHOR, a verdadeira glória de Israel; o hebraico usa uma expressão metonímica em vez de nomeá-lo diretamente.
    reason: lexical_alternative
  - marker: c
    text: Ou “pelo que é inútil” ou “pelo que não ajuda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: trocou
  rationale: O verbo pode significar mudar, trocar ou substituir. “Trocou” é natural em português, funciona nos dois segmentos e comunica a substituição de um objeto de lealdade por outro.
- source_word: גּוֹי
  choice: nação
  rationale: No contexto da pergunta retórica, o termo designa uma coletividade nacional; “nação” é o equivalente mais direto.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: A forma se refere aqui às supostas divindades das nações. O plural “deuses” preserva claramente o contraste com o fato de não serem deuses reais.
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: embora eles nem sejam deuses
  rationale: A formulação expressa naturalmente o valor concessivo da oração e conserva o plural hebraico. “Nem” reforça a ironia da pergunta sem alterar seu sentido.
- source_word: וְעַמִּי
  choice: Mas o meu povo
  rationale: 'A conjunção introduz forte contraste: as nações não abandonam suas falsas divindades, mas Israel abandona aquele que é sua glória.'
- source_word: כְּבוֹדוֹ
  choice: a sua glória
  rationale: O substantivo singular com sufixo masculino singular concorda com “meu povo” entendido coletivamente. “A sua glória” preserva a expressão hebraica e sua possível força metonímica, sem substituir explicitamente o referente por “o SENHOR”.
- source_word: בְּלֹא יוֹעִיל
  choice: pelo que não traz proveito
  rationale: A expressão indica aquilo que não beneficia nem ajuda. A formulação é clara, atual e mantém o tom profético.
theological_decisions:
- issue: Referente de כְּבוֹדוֹ (“sua glória”)
  choice: Manter “a sua glória” como expressão metonímica que provavelmente se refere ao SENHOR, a verdadeira glória de Israel
  alternative: Entender a expressão como a honra ou glória própria de Israel, em sentido mais abstrato
  rationale: O contexto contrapõe os falsos deuses das nações ao verdadeiro Deus de Israel. A tradução conserva, porém, a forma e a tensão do hebraico, em vez de explicitar “o SENHOR” no texto principal ou transformar a expressão em título por meio de maiúscula.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Trocou de deuses” é idiomático para a mudança de divindades cultuadas; a repetição de “trocou” preserva o paralelismo do hebraico. A minúscula em “glória” evita impor um título formal não marcado no texto-fonte, enquanto a nota esclarece o referente provável.
