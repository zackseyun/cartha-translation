base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: pt
  text: Por que você anda tanto de um lado para outro[a], mudando o seu caminho? Você também ficará envergonhada com o Egito[b], assim como ficou envergonhada com a Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que você vagueia tanto para mudar de rumo?” A expressão hebraica pode destacar o movimento inquieto na busca de novas alianças.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você também ficará decepcionada com o Egito, assim como ficou decepcionada com a Assíria.” O verbo pode indicar vergonha ou frustração por ter confiado em quem não correspondeu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Por que
  rationale: Introduz uma pergunta retórica de censura; em português, “Por que” comunica melhor a avaliação crítica do que o mais literal “Como”.
- source_word: תֵּזְלִי מְאֹד
  choice: você anda tanto de um lado para outro
  rationale: Expressa o movimento intenso e inquieto sugerido pelo verbo no contexto da busca de novas alianças, sem impor uma interpretação moral específica.
- source_word: לְשַׁנּוֹת
  choice: mudando
  rationale: O gerúndio liga naturalmente a mudança de rumo ao movimento inquieto, preservando a relação de propósito ou resultado do infinitivo hebraico.
- source_word: דַּרְכֵּךְ
  choice: o seu caminho
  rationale: Mantém a amplitude de דֶּרֶךְ, que pode abranger tanto a conduta quanto o rumo político de Judá.
- source_word: גַּם
  choice: também
  rationale: Indica que o Egito, além da Assíria, será motivo de vergonha e frustração.
- source_word: מִמִּצְרַיִם
  choice: por causa do Egito
  rationale: Com o verbo בושׁ, a preposição pode indicar a fonte ou a causa da vergonha; esta formulação é natural em português e não força uma agência direta.
- source_word: תֵּבֹשִׁי
  choice: você será envergonhada
  rationale: Conserva a imagem central de vergonha e humilhação resultante de uma confiança frustrada; o feminino corresponde à destinatária personificada.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz claramente a comparação entre a futura experiência com o Egito e a experiência anterior com a Assíria.
- source_word: בֹּשְׁתְּ מֵאַשּׁוּר
  choice: foi envergonhada por causa da Assíria
  rationale: Preserva o paralelismo verbal e preposicional com a referência ao Egito.
theological_decisions:
- issue: Sentido de “seu caminho” na censura profética
  choice: Manter a expressão ampla “o seu caminho”
  alternative: Especificar “seu rumo político” ou “sua conduta”
  rationale: O contexto imediato envolve a busca de alianças estrangeiras, mas דֶּרֶךְ também pode abranger a conduta moral e espiritual. A tradução conserva essa tensão.
- issue: Natureza da vergonha causada por Egito e Assíria
  choice: Traduzir com a linguagem de ser envergonhada
  alternative: Traduzir como ficar decepcionada ou ter a confiança frustrada
  rationale: בושׁ pode descrever tanto vergonha quanto decepção diante de uma confiança que falha. O texto principal mantém a imagem de vergonha, enquanto a nota registra a nuance de frustração.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para a destinatária feminina personificada. A formulação preserva o movimento retórico, o paralelismo entre Egito e Assíria e a amplitude moral e política de “caminho”.
