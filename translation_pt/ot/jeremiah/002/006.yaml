    issue: «Perguntaram» em lugar de «disseram»
    rationale: O verbo אָמַר é «dizer». A pergunta direta é o conteúdo da fala, mas o texto afirma que eles não a disseram. «Não disseram» preserva a formulação hebraica e continua idiomático em português.
  revised_text: 'Eles não disseram: “Onde está Yahweh, que nos tirou da terra do Egito, que nos conduziu pelo deserto, por uma terra de planície árida e de covas, por uma terra de seca e densas trevas[a], por uma terra pela qual ninguém passava e onde ser humano algum habitava?”'
  revised_footnotes:
