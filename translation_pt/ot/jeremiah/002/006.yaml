  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: pt
  text: 'Eles não disseram: “Onde está Yahweh, que nos tirou da terra do Egito, que nos conduziu pelo deserto, por uma terra de planície árida e de covas, por uma terra de seca e densas trevas[a], por uma terra pela qual ninguém passava e onde ser humano algum habitava?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sombra da morte”.'
    reason: Alternativa lexical para צַלְמָוֶת, que pode denotar trevas profundas ou sombra mortal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: que nos tirou da terra do Egito
  rationale: Expressa naturalmente em português o Hifil de עלה no contexto do êxodo, preservando a ideia de fazer sair/subir.
- source_word: הַמּוֹלִיךְ אֹתָנוּ
  choice: que nos conduziu
  rationale: O Hifil de הלך indica fazer ir ou conduzir; a escolha mantém tom digno e corrente.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: Com verbo de movimento, 'pelo' comunica de modo idiomático a travessia do território.
- source_word: עֲרָבָה
  choice: planície árida
  rationale: Comunica a estepe ou planície desértica sem recorrer à transliteração opaca 'Arabá'.
- source_word: שׁוּחָה
  choice: covas
  rationale: Preserva a imagem concreta de depressões ou fossos perigosos; o plural soa natural na descrição portuguesa do terreno.
- source_word: צִיָּה
  choice: seca
  rationale: Representa a aridez extrema e mantém a formulação nominal concisa do hebraico.
- source_word: צַלְמָוֶת
  choice: densas trevas
  rationale: Expressa a escuridão profunda e ameaçadora própria do contexto, sem excluir a alternativa tradicional registrada em nota.
- source_word: לֹא עָבַר בָּהּ אִישׁ
  choice: pela qual ninguém passava
  rationale: Transmite o sentido representativo de אִישׁ em português natural sem introduzir restrição ao sexo masculino.
- source_word: וְלֹא יָשַׁב אָדָם שָׁם
  choice: e onde ser humano algum habitava
  rationale: Preserva o sentido genérico de אָדָם e distingue esta oração da anterior.
theological_decisions:
- issue: Sentido de צַלְמָוֶת
  choice: densas trevas
  alternative: sombra da morte
  rationale: No contexto da paisagem hostil, o termo pode indicar escuridão profunda ou mortal; a tradução principal evita tornar explícita uma referência à morte que o hebraico deixa lexicalmente aberta, e a nota preserva a leitura tradicional.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil, com tom digno. A sequência repetida 'por uma terra' conserva a força retórica do hebraico; 'habitava' mantém registro elevado sem soar arcaico.
