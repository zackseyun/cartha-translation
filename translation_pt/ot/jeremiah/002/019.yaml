id: JER.2.19
reference: Jeremiah 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: pt
  text: A tua maldade te disciplinará, e as tuas apostasias[a] te repreenderão. Portanto, reconhece e vê que é mau e amargo abandonares Yahweh[b], teu Deus, e que não há em ti temor de mim[c] — declara o Senhor Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus desvios”.'
    reason: lexical_alternative
  - marker: b
    text: Yahweh representa o nome divino YHWH.
    reason: cultural_note
  - marker: c
    text: 'Mais literalmente: “e o meu temor não está em ti”.'
    reason: translation_note
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: te disciplinará
  rationale: O piel de יסר reúne correção e consequência punitiva. “Disciplinará” conserva ambas as nuances e permite que a própria maldade apareça como agente.
- source_word: רָעָתֵךְ
  choice: a tua maldade
  rationale: O paralelo com o abandono de Yahweh favorece o sentido moral de רע, e não o sentido possível de calamidade.
- source_word: מְשֻׁבוֹתַיִךְ
  choice: as tuas apostasias
  rationale: O substantivo plural descreve afastamentos ou infidelidades a Yahweh no contexto da aliança. “Apostasias” expressa com clareza essa deserção religiosa; a alternativa mais ampla é registrada em nota.
- source_word: תּוֹכִחֻךְ
  choice: te repreenderão
  rationale: O hifil de יכח pode indicar repreender, demonstrar culpa ou corrigir. Aqui, as próprias apostasias expõem a culpa e repreendem Judá.
- source_word: וּדְעִי וּרְאִי
  choice: Portanto, reconhece e vê
  rationale: Os dois imperativos femininos singulares convocam Judá tanto à compreensão quanto à percepção. “Reconhece” comunica o saber que admite a realidade, enquanto “vê” preserva o segundo verbo.
- source_word: רַע וָמָר
  choice: mau e amargo
  rationale: A expressão une a qualidade moral do abandono de Deus à sua consequência dolorosa, sem reduzir um aspecto ao outro.
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: abandonares Yahweh, teu Deus
  rationale: O infinitivo com sufixo é vertido por infinitivo pessoal, construção natural em português que mantém Judá como sujeito do abandono.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: e como não há em ti temor de mim
  rationale: A formulação conserva o substantivo “temor” e sua referência a Deus, mas expressa em português natural a ausência dessa reverência em Judá. A estrutura mais literal é indicada em nota.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: declara o Senhor Yahweh dos Exércitos
  rationale: “Declara” traduz idiomaticamente נְאֻם; “Senhor Yahweh” distingue o título אֲדֹנָי do nome יְהוָה; “dos Exércitos” conserva a imagem marcial e cósmica de צְבָאוֹת.
theological_decisions:
- issue: Sentido de מְשֻׁבוֹתַיִךְ no contexto da aliança
  choice: as tuas apostasias
  alternative: os teus desvios
  rationale: O contexto trata do abandono de Yahweh, de modo que “apostasias” preserva a força de infidelidade religiosa e pactual. “Desvios” permanece possível e é oferecido em nota.
- issue: Construção וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: não há em ti temor de mim
  alternative: o meu temor não está em ti
  rationale: O hebraico emprega uma expressão nominal cuja relação pode ser formulada literalmente como “meu temor” ou, de modo idiomático, como “temor de mim”. A tradução principal mantém a ausência de reverência sem convertê-la simplesmente em um verbo; a forma estruturalmente mais próxima aparece em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Usar “Yahweh” torna visível a presença do nome próprio no texto e o distingue do título אֲדֹנָי, sem atribuir conteúdo denominacional adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com a interpelação feminina singular dirigida a Judá. O infinitivo pessoal “abandonares” preserva a sintaxe e evita uma formulação artificial. A ordem final mantém o peso solene do oráculo profético.
