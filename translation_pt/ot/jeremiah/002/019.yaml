  rationale: Apenas se substituiu “como” por “que” nas duas orações que explicitam o conteúdo dos imperativos “reconhece e vê”. Isso melhora a precisão sintática em relação ao hebraico sem alterar o sentido, o registro ou as escolhas terminológicas do texto.
