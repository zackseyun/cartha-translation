base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
translation:
  language: pt
  text: Então levaram consigo todos os homens e foram lutar contra Ismael, filho de Netanias. Eles o encontraram junto às grandes águas que ficam em Gibeão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto às águas abundantes” ou “junto ao grande reservatório de Gibeão”. O hebraico diz literalmente “junto às muitas/grandes águas que estão em Gibeão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: reuniram
  rationale: Embora לקח signifique normalmente “tomar”, neste contexto Joanã e seus comandantes levam consigo os homens mencionados no versículo anterior. “Reuniram” expressa naturalmente essa ação em português sem sugerir captura.
- source_word: כָּל הָאֲנָשִׁים
  choice: todos os homens
  rationale: Mantém o sentido masculino plural de אֲנָשִׁים sem acrescentar a interpretação mais específica “soldados”.
- source_word: לְהִלָּחֵם עִם
  choice: lutar contra
  rationale: O infinitivo nifal de לחם com עִם indica entrar em combate com alguém; “lutar contra” explicita de modo natural a relação hostil.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, filho de Netanias
  rationale: Emprega as formas portuguesas correntes dos nomes e conserva o patronímico hebraico.
- source_word: וַיִּמְצְאוּ אֹתוֹ
  choice: Eles o encontraram
  rationale: מצא significa normalmente “encontrar”; a formulação é direta e idiomática no contexto da perseguição.
- source_word: אֶל מַיִם רַבִּים
  choice: junto às grandes águas
  rationale: “Junto a” comunica a localização alcançada após a busca, e “grandes águas” preserva a imagem literalmente ampla de מַיִם רַבִּים sem determinar se se tratava de um açude, tanque ou outro corpo de água.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: que ficam em Gibeão
  rationale: A oração relativa localiza as águas em Gibeão; “que ficam” soa natural em português para um marco geográfico.
