  naturalness: O português é claro e de registro bíblico moderno. «Fazendo cortes em si mesmos» é natural, explícito e conserva a ação em curso apresentada no hebraico. «Olíbano» é termo compreensível em contexto bíblico; a nota pode explicitar «incenso aromático» se necessário.
  terminology: «Oferta de cereal» é uma escolha adequada para מנחה neste contexto cultual. «Olíbano» deve substituir «incenso» por maior precisão lexical. «Yahweh» e «casa de Yahweh» correspondem à política indicada e ao hebraico בית יהוה.
