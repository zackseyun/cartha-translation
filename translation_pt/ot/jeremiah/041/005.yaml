  text: וַ/יָּבֹ֣אוּ אֲ֠נָשִׁים מִ/שְּׁכֶ֞ם מִ/שִּׁל֤וֹ וּ/מִ/שֹּֽׁמְרוֹן֙ שְׁמֹנִ֣ים אִ֔ישׁ מְגֻלְּחֵ֥י זָקָ֛ן וּ/קְרֻעֵ֥י בְגָדִ֖ים וּ/מִתְגֹּֽדְדִ֑ים וּ/מִנְחָ֤ה וּ/לְבוֹנָה֙ בְּ/יָדָ֔/ם לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: pt
  text: Então chegaram oitenta homens de Siquém, de Siló e de Samaria. Estavam com a barba raspada, as roupas rasgadas e fazendo cortes em si mesmos[a], e traziam nas mãos uma oferta de cereal[b] e olíbano para levar à casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, faziam cortes em si mesmos como sinal de luto.
    reason: cultural_note
  - marker: b
    text: 'Ou: «uma oferta». O termo hebraico muitas vezes indica uma oferta de cereal em contextos de culto.'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica é «casa de Yahweh» e pode se referir ao local do santuário, não necessariamente a um templo ainda intacto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: אֲנָשִׁים ... שְׁמֹנִים אִישׁ
  choice: oitenta homens
  rationale: O contexto se refere especificamente a pessoas do sexo masculino, e o português exige o plural idiomático.
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: de Siquém, de Siló e de Samaria
  rationale: Mantém a repetição das preposições hebraicas e usa as formas tradicionais dos topônimos em português.
- source_word: מְגֻלְּחֵי זָקָן
  choice: com a barba raspada
  rationale: Expressa de modo claro o estado descrito pelo particípio passivo e preserva o sinal concreto de luto.
- source_word: וּקְרֻעֵי בְגָדִים
  choice: as roupas rasgadas
  rationale: Tradução corrente e acessível da expressão de luto, sem perder sua concretude.
- source_word: וּמִתְגֹּדְדִים
  choice: o corpo cortado
  rationale: O verbo descreve cortes feitos no próprio corpo como prática de luto; esta formulação natural evita sugerir que a ação necessariamente ocorria enquanto caminhavam.
- source_word: וּמִנְחָה
  choice: uma oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa provavelmente uma oferta feita de cereal; o singular português preserva a forma hebraica sem impedir sentido coletivo.
- source_word: וּלְבוֹנָה
  choice: incenso
  rationale: Em português bíblico corrente, “incenso” comunica naturalmente a substância aromática; o termo hebraico designa especificamente olíbano.
- source_word: בְּיָדָם
  choice: traziam nas mãos
  rationale: Preserva a imagem concreta do hebraico em construção portuguesa natural.
- source_word: לְהָבִיא
  choice: para levar
  rationale: Expressa diretamente a finalidade indicada pelo infinitivo hebraico.
- source_word: בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: Mantém o sentido literal e amplo de “casa”, importante após a destruição do templo, e translitera o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Referente de בֵּית יְהוָה após a destruição de Jerusalém
  choice: casa de Yahweh
  alternative: templo de Yahweh; local do santuário de Yahweh
  rationale: “Casa” conserva a expressão hebraica e sua possível abrangência, sem decidir se o autor pressupõe um edifício ainda intacto ou o local sagrado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas familiares ao público brasileiro. A divisão em duas frases melhora a legibilidade sem alterar a progressão do hebraico. Os marcadores aparecem imediatamente após os termos que esclarecem.
