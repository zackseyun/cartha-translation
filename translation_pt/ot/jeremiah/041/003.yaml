base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: pt
  text: E Ismael matou todos os judeus[a] que estavam com Gedalias em Mispá, bem como os caldeus[b] que se encontravam ali — homens de guerra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar os habitantes de Judá ou da Judeia; neste contexto, “judeus” tem esse sentido histórico-geográfico.
    reason: lexical_alternative
  - marker: b
    text: Ou “babilônios”. O hebraico diz “caldeus”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “homens de guerra”; isto é, combatentes ou soldados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: Em português corrente, “judeus” é a designação natural para o povo de Judá neste contexto; a nota registra a alternativa histórico-geográfica “judeanos”.
- source_word: אִתּוֹ אֶת גְּדַלְיָהוּ
  choice: que estavam com Gedalias
  rationale: O pronome é esclarecido pelo nome seguinte; a formulação portuguesa evita a redundância “com ele, com Gedalias” sem mudar o referente.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: “Em” é a preposição portuguesa idiomática para indicar presença numa cidade ou localidade.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação histórica específica do hebraico, em vez de substituí-la pela identificação interpretativa “babilônios”.
- source_word: נִמְצְאוּ שָׁם
  choice: que se encontravam ali
  rationale: Preserva de modo natural o valor passivo-resultativo do nifal, sem reduzi-lo simplesmente a “estavam ali”.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  rationale: Reproduz com clareza e dignidade a expressão hebraica, esclarecida em nota como referência a combatentes ou soldados.
- source_word: הִכָּה
  choice: matou
  rationale: Neste contexto narrativo, o verbo descreve um golpe letal contra o grupo inteiro; “matou” comunica inequivocamente o resultado em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação “bem como” distingue os dois grupos, e a aposição final mantém a relação de “homens de guerra” com os caldeus, conforme a ordem e a sintaxe do hebraico.
