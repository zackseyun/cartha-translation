  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: pt
  text: 'Então Ismael levou cativo todo o remanescente do povo que estava em Mispá: as filhas do rei e todo o povo que havia ficado em Mispá, que Nebuzaradã, capitão da guarda, havia confiado a Gedalias, filho de Aicão. Ismael, filho de Netanias, levou-os cativos e partiu para atravessar até os amonitas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Amom”, isto é, os amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: levou cativo / levou-os cativos
  rationale: O qal de שׁבה indica capturar ou levar pessoas ao cativeiro, geralmente mediante coerção. A formulação preserva esse sentido e a repetição enfática do hebraico.
- source_word: שְׁאֵרִית הָעָם
  choice: o remanescente do povo
  rationale: שְׁאֵרִית designa a parte sobrevivente ou restante; “remanescente” conserva a força temática recorrente em Jeremias.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: A preposição בְּ indica localização, e “em” é natural em português com esse topônimo.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: as filhas do rei
  rationale: Tradução direta da expressão hebraica, sem substituir por “princesas”, que seria mais interpretativo.
- source_word: הַנִּשְׁאָרִים
  choice: que havia ficado
  rationale: O particípio de שׁאר se refere aos que permaneceram ou foram deixados; a forma singular concorda naturalmente com o coletivo “povo” em português.
- source_word: הִפְקִיד
  choice: havia confiado a
  rationale: No contexto, Nebuzaradã colocou o povo sob a responsabilidade de Gedalias. “Confiado a” expressa essa relação sem tornar Gedalias objeto de uma nomeação ambígua.
- source_word: רַב טַבָּחִים
  choice: capitão da guarda
  rationale: Título convencional do alto oficial babilônico responsável pela guarda real, mais claro contextualmente do que uma reprodução etimológica ligada a executores.
- source_word: לַעֲבֹר אֶל
  choice: para atravessar até
  rationale: Preserva a ideia de deslocamento através de uma área ou fronteira em direção a um destino.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: Equivalente gentílico natural de “filhos de Amom” em português; a forma literal é registrada em nota.
