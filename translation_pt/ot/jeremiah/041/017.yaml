  text: וַ/יֵּלְכ֗וּ וַ/יֵּֽשְׁבוּ֙ בְּ/גֵר֣וּת כמו/הם אֲשֶׁר אֵ֖צֶל בֵּ֣ית לָ֑חֶם לָ/לֶ֖כֶת לָ/ב֥וֹא מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: pt
  text: Então eles partiram e ficaram em Gerute de Quimã[a][b], perto de Belém, com a intenção de seguir para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no lugar de hospedagem de Quimã”. O hebraico בְּגֵרוּת provavelmente funciona aqui como nome de lugar (“Gerute”), mas também pode indicar um local de hospedagem ou permanência temporária associado a Quimã.
    reason: lexical_alternative
  - marker: b
    text: A forma escrita do nome no texto hebraico fornecido é irregular. O contexto favorece o nome próprio “Quimã”, conhecido de 2 Samuel 19:37–40 e associado a um local próximo de Belém.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Então eles partiram
  rationale: O wayyiqtol de הלך dá continuidade à sequência narrativa. “Partiram” expressa naturalmente o deslocamento iniciado pelo grupo.
- source_word: וַיֵּשְׁבוּ
  choice: e ficaram
  rationale: ישב pode significar sentar-se, habitar ou permanecer; neste contexto de viagem, indica uma permanência temporária.
- source_word: בְּגֵרוּת
  choice: em Gerute
  rationale: O termo provavelmente funciona como topônimo, embora possa designar um lugar de hospedagem ou permanência temporária; a nota preserva essa alternativa.
- source_word: כמוהם
  choice: Quimã
  rationale: Apesar da forma escrita irregular no texto fornecido, o contexto e a tradição textual apoiam a leitura do nome próprio associado ao local próximo de Belém.
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: perto de Belém
  rationale: אֵצֶל indica proximidade. A formulação é clara e natural em português.
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: com a intenção de seguir para o Egito
  rationale: Os infinitivos com ל expressam finalidade. “Com a intenção de” torna explícito o propósito sem afirmar que a entrada no Egito já ocorreu; “seguir para” comunica a continuação da viagem.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome geográfico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se “Gerute” como provável topônimo, enquanto as notas registram tanto a alternativa lexical quanto a dificuldade textual. A expressão “com a intenção de seguir” preserva a finalidade da construção hebraica sem sugerir que o grupo já havia entrado no Egito.
