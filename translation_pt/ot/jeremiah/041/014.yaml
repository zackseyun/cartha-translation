base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: pt
  text: Então todo o povo que Ismael havia levado cativo de Mispá[a] mudou de direção, voltou e foi até Joanã, filho de Careá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que Ismael havia capturado”; mais literalmente, “que Ismael havia levado cativo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: mudou de direção
  rationale: Expressa a inversão concreta de rumo indicada por סבב, em linguagem portuguesa clara e atual.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Preserva o substantivo coletivo definido com כָּל; a concordância no singular é natural em português.
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  choice: que Ismael havia levado como prisioneiro
  rationale: שבה no qal significa levar ou tomar cativo. O mais-que-perfeito composto deixa claro que a captura precedeu as ações narradas no versículo.
- source_word: מִן הַמִּצְפָּה
  choice: de Mispá
  rationale: Traduz diretamente a ideia de procedência marcada por מִן e usa a forma portuguesa tradicional do topônimo.
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ אֶל
  choice: voltou para junto de
  rationale: Reúne em português natural o retorno indicado por שוב e o movimento em direção a Joanã indicado por הלך אֶל, sem acrescentar a ideia explícita de deserção.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e conserva a relação patronímica do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita uma repetição pouco natural dos três verbos hebraicos, mas mantém tanto a mudança de direção quanto o retorno e o movimento em direção a Joanã.
