    issue: A nota diz «que Ismael havia capturado em Mispá».
    rationale: O hebraico tem מִן הַמִּצְפָּה, «de Mispá», e não «em Mispá». A alternativa proposta introduz uma localização diferente e, portanto, não é uma variante lexical segura.
  - severity: low
    issue: «voltou para junto de Joanã» funde os dois últimos verbos.
    rationale: Embora seja compreensível, explicitar «voltou e foi até» conserva melhor a progressão וַיָּשֻׁבוּ וַיֵּלְכוּ sem sacrificar a naturalidade.
  revised_text: Então todo o povo que Ismael havia levado cativo de Mispá[a] mudou de direção, voltou e foi até Joanã, filho de Careá.
