  text: וַ/יְהִ֗י כִּ/רְא֤וֹת כָּל הָ/עָם֙ אֲשֶׁ֣ר אֶת יִשְׁמָעֵ֔אל אֶת יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֵ֛ת כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יִּשְׂמָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: pt
  text: Quando todo o povo que estava com Ismael viu Joanã, filho de Careá, e todos os comandantes das forças que estavam com ele, todos se alegraram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quando ... viu
  rationale: A construção narrativa com וַיְהִי e o infinitivo com כִּי introduz a circunstância temporal. Em português atual, “Quando ... viu” transmite naturalmente essa relação sem recorrer a “aconteceu que”.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Refere-se ao grupo de pessoas mencionado no contexto. “Todo o povo” é direto, natural e preserva o valor coletivo.
- source_word: אֲשֶׁר אֶת יִשְׁמָעֵאל
  choice: que estava com Ismael
  rationale: A expressão relativa é elíptica, e אֵת tem aqui sentido comitativo. O singular “estava” concorda naturalmente com o coletivo “povo”.
- source_word: יֽוֹחָנָן בֶּן קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e o patronímico é traduzido diretamente.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: comandantes das forças
  rationale: שָׂרִים designa chefes ou comandantes, e חֲיָלִים se refere aqui às forças militares. A formulação mantém o caráter militar sem arcaísmo.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: O pronome singular refere-se mais naturalmente a Joanã. A tradução preserva o pronome do hebraico e sua referência contextual.
- source_word: וַיִּשְׂמָחוּ
  choice: todos se alegraram
  rationale: שׂמח expressa alegria. A repetição de “todos” explicita em português que o sujeito retomado são as pessoas, evitando que o plural pareça incluir também Joanã e os comandantes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem sintática segue de perto o hebraico, mas a retomada “todos se alegraram” evita ambiguidade de sujeito em português.
