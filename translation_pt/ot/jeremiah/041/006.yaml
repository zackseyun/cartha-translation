base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: pt
  text: 'Então Ismael, filho de Netanias, saiu de Mispá ao encontro deles, indo e chorando[a]. Quando os encontrou, disse-lhes: “Venham até Gedalias, filho de Aicão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “indo, indo e chorando”, expressão que indica uma ação contínua enquanto ele se aproximava.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então ... saiu
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade em português.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: A expressão indica sair para encontrar alguém; esta formulação é natural e precisa.
- source_word: מִן הַמִּצְפָּה
  choice: de Mispá
  rationale: A preposição marca origem. Mantém-se o topônimo em forma tradicional e reconhecível em português.
- source_word: הֹלֵךְ הָלֹךְ וּבֹכֶה
  choice: caminhando e chorando
  rationale: A combinação do particípio com o infinitivo absoluto comunica ação contínua. A tradução preserva o movimento e o choro simultâneos sem reproduzir de modo artificial a repetição hebraica.
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: Quando os encontrou
  rationale: A construção temporal hebraica é vertida de forma direta e corrente, sem o calque “e aconteceu que”.
- source_word: בֹּאוּ אֶל
  choice: Venham até
  rationale: O imperativo seguido de אֶל constitui um convite ou chamado para dirigir-se a Gedalias. “Até” evita sugerir necessariamente entrada em um lugar.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: Gedalias, filho de Aicão
  rationale: Empregam-se formas portuguesas tradicionais dos nomes e preserva-se diretamente o patronímico hebraico.
