base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: pt
  text: Então Ismael, filho de Netanias, levantou-se com os dez homens que estavam com ele. Eles feriram Gedalias, filho de Aicão, filho de Safã, à espada e o mataram[a] — aquele que o rei da Babilônia havia nomeado para governar a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “golpearam Gedalias, filho de Aicão, filho de Safã, à espada e o mataram”. O hebraico emprega dois verbos em sequência para indicar o ataque e seu resultado fatal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: O qal narrativo de קום inicia a ação hostil. “Levantou-se” conserva a imagem e a progressão do relato sem explicitar além do hebraico que ele se levantou “contra” Gedalias.
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים
  choice: os dez homens
  rationale: O artigo definido identifica o grupo já conhecido que acompanhava Ismael.
- source_word: אֲשֶׁר הָיוּ אִתּוֹ
  choice: que estavam com ele
  rationale: Reproduz de modo natural a oração relativa e não acrescenta uma relação mais específica que a indicada pelo texto.
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: נכה descreve o golpe violento; “feriram” preserva sua distinção em relação ao verbo seguinte, que declara explicitamente o resultado fatal.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa corrente para o uso da espada como instrumento do ataque, mantendo o singular coletivo do hebraico.
- source_word: וַיָּמֶת אֹתוֹ
  choice: e o mataram
  rationale: O hifil de מות é causativo e afirma diretamente que os agressores lhe causaram a morte.
- source_word: אֲשֶׁר הִפְקִיד
  choice: aquele que ... havia nomeado
  rationale: Neste contexto administrativo, הפקיד indica a designação de Gedalias para uma função de autoridade. O mais-que-perfeito deixa clara a anterioridade da nomeação.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Forma portuguesa clara e tradicional para a cadeia construta hebraica.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: Ligada ao verbo de nomeação, a expressão indica a esfera de autoridade de Gedalias. “Sobre a terra” conserva essa ideia sem acrescentar um título não expresso.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: Gedalias, filho de Aicão, filho de Safã
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e preserva integralmente a cadeia patronímica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais de ampla tradição lusófona. A repetição de “filho de” preserva a identificação genealógica, e a construção final mantém a função administrativa implícita sem inserir o título “governador”.
