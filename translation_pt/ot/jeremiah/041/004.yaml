base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/004.yaml
  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
translation:
  language: pt
  text: E aconteceu que, no segundo dia depois de ele ter matado Gedalias, ninguém sabia disso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Fórmula narrativa que mantém a sequência do hebraico em português natural, sem recorrer ao arcaísmo «e sucedeu».
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: no segundo dia
  rationale: Preserva a indicação ordinal explícita do texto hebraico, sem a reduzir a «no dia seguinte».
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: depois de ele ter matado Gedalias
  rationale: O infinitivo construto com לְ estabelece o assassinato como referência temporal. A forma ativa é sustentada pelo contexto anterior, no qual Ismael matou Gedalias.
- source_word: גְּדַלְיָהוּ
  choice: Gedalias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: וְאִישׁ לֹא יָדָע
  choice: ninguém ainda sabia disso
  rationale: '«Ninguém» expressa naturalmente o valor indefinido de אִישׁ sob negação. «Ainda» comunica o estado vigente naquele momento, e «disso» explicita em português o objeto implícito: a morte de Gedalias.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A coordenação hebraica com וְ foi vertida como uma circunstância temporal implícita na sequência («ninguém ainda sabia disso»), sem introduzir interpretação teológica.
