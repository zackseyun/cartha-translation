  text: וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֗ה נִמְלַט֙ בִּ/שְׁמֹנָ֣ה אֲנָשִׁ֔ים מִ/פְּנֵ֖י יֽוֹחָנָ֑ן וַ/יֵּ֖לֶךְ אֶל בְּנֵ֥י עַמּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: pt
  text: Mas Ismael, filho de Netanias, escapou de Joanã com oito homens e foi para junto dos amonitas[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E Ismael”. A conjunção também pode ser traduzida por “e”, mas “mas” explicita o contraste com o contexto narrativo anterior.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de Joanã”, expressão idiomática que significa escapar de sua presença ou perseguição.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “para os filhos de Amom”, isto é, para junto dos amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Mas Ismael
  rationale: 'Embora ו possa ser traduzido por “e”, “mas” expressa naturalmente o contraste narrativo: apesar da ação de Joanã, Ismael conseguiu escapar.'
- source_word: בֶּן נְתַנְיָה
  choice: filho de Netanias
  rationale: Reproduz de modo claro a construção patronímica hebraica; “Netanias” segue uma transliteração portuguesa inteligível.
- source_word: נִמְלַט
  choice: escapou
  rationale: O nifal de מלט indica aqui que Ismael conseguiu fugir do perigo ou da perseguição.
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: com oito homens
  rationale: 'A preposição ב tem sentido associativo neste contexto: os oito homens acompanharam Ismael na fuga.'
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: de Joanã
  rationale: A expressão significa literalmente “de diante da face/presença de Joanã” e, neste contexto, indica escapar dele ou de sua perseguição.
- source_word: וַ/יֵּלֶךְ
  choice: e foi
  rationale: Expressa com naturalidade a progressão sequencial da narrativa hebraica.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: para junto dos amonitas
  rationale: “Filhos de Amom” é a designação hebraica do povo de Amom; a formulação escolhida indica que Ismael se dirigiu ao território ou à convivência desse povo sem sugerir que cada indivíduo fosse um destino geográfico.
