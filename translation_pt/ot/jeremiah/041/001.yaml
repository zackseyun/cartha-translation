  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: pt
  text: No sétimo mês, Ismael, filho de Netanias, filho de Elisama, descendente da linhagem real[a] e um dos nobres do rei[b], veio com dez homens a Gedalias, filho de Aicão, em Mispá; ali, em Mispá, comeram pão juntos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da semente real”, isto é, descendente da família ou dinastia real.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um dos altos oficiais do rei”. A expressão hebraica refere-se a homens de elevada posição ligados ao rei.'
    reason: lexical_alternative
  - marker: c
    text: “Comer pão” é uma expressão hebraica que pode significar compartilhar uma refeição.
    reason: idiom
lexical_decisions:
- source_word: וַיְהִי
  choice: No sétimo mês
  rationale: A fórmula narrativa introduz a cena. Em português, não é necessário acrescentar “aconteceu” nem um advérbio como “então”; a oração temporal inicia a narrativa com naturalidade.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução direta da expressão cronológica, sem identificar um mês moderno que o texto não nomeia.
- source_word: בָּא
  choice: foi ... até
  rationale: O verbo indica deslocamento em direção a Gedalias, em Mispá. “Foi até” é natural em português neste contexto narrativo.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: descendente da linhagem real
  rationale: זֶרַע tem aqui o sentido figurado de descendência, não de semente literal. A formulação comunica pertencimento dinástico.
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: e um dos nobres do rei
  rationale: A expressão plural designa os homens de alta posição ligados ao rei; como a descrição se refere ao singular Ismael, “um dos nobres” transmite essa relação sem reproduzir de modo artificial o plural hebraico.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: com dez homens
  rationale: Expressa de forma concisa e natural que dez homens acompanhavam Ismael.
- source_word: אֶל גְּדַלְיָהוּ ... הַמִּצְפָּתָה
  choice: até Gedalias ... em Mispá
  rationale: A forma direcional de Mispá indica o destino. Em português, Gedalias é apresentado como estando em Mispá, evitando a repetição pouco natural de duas construções de destino.
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: e ali comeram pão juntos
  rationale: Mantém a imagem explícita do pão e o aspecto comunitário de יַחְדָּו, enquanto a nota esclarece o uso idiomático referente a uma refeição compartilhada.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: A repetição final do topônimo é mantida porque está presente no hebraico e enquadra deliberadamente a cena.
theological_decisions:
- issue: Natureza da ligação de Ismael com a realeza
  choice: descendente da linhagem real
  alternative: de semente real
  rationale: O texto afirma ascendência dinástica; a tradução conserva essa afirmação sem sugerir uma interpretação teológica adicional.
- issue: Posição de Ismael entre os homens do rei
  choice: um dos nobres do rei
  alternative: um dos altos oficiais do rei
  rationale: O hebraico permite entender a expressão como referência a nobres ou dignitários. A opção principal evita especificar uma função administrativa que o termo não define, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os patronímicos foram mantidos em sequência (“filho de Netanias, filho de Elisama”) para refletir a forma do hebraico. A repetição final de “em Mispá” foi preservada, apesar de não ser indispensável em português, por sua função de enquadramento narrativo.
