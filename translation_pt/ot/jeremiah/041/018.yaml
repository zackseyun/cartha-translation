base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: pt
  text: por causa dos caldeus[a], pois estavam com medo deles, porque Ismael, filho de Netanias, havia matado[b] Gedalias, filho de Aicão, a quem o rei da Babilônia havia nomeado responsável pela terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos babilônios”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “havia golpeado”; neste contexto, o golpe foi fatal.
    reason: lexical_alternative
  - marker: c
    text: Ou “a quem o rei da Babilônia havia posto à frente da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: por causa dos caldeus
  rationale: A locução מִפְּנֵי exprime causa neste contexto; “caldeus” preserva o etnônimo hebraico, embora aqui designe a potência babilônica.
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: pois estavam com medo deles
  rationale: כִּי introduz a explicação, e ירא com מִפְּנֵי indica temor; a formulação é clara e natural em português moderno.
- source_word: הִכָּה
  choice: havia matado
  rationale: Embora o sentido básico seja “golpear”, neste contexto o golpe foi fatal. “Havia matado” comunica inequivocamente o resultado, enquanto a nota preserva a imagem lexical do hebraico.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, filho de Netanias
  rationale: Os nomes são transliterados em formas portuguesas reconhecíveis, e a relação filial é expressa diretamente.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Gedalias, filho de Aicão
  rationale: O marcador de objeto direto não é traduzido; os nomes recebem formas portuguesas tradicionais e legíveis.
- source_word: אֲשֶׁר הִפְקִיד
  choice: a quem ... havia colocado como responsável
  rationale: O hifil de פקד pode significar nomear, pôr à frente ou incumbir. A expressão explicita a responsabilidade administrativa sem acrescentar um título não presente no hebraico.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução natural e formal da cadeia construta.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: Ligada a “colocado como responsável”, a preposição assume sentido administrativo. “Terra” mantém a amplitude semântica de אֶרֶץ.
