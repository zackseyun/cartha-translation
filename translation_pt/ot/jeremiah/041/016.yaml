  text: וַ/יִּקַּח֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֣ים אֲשֶׁר אִתּ֗/וֹ אֵ֣ת כָּל שְׁאֵרִ֤ית הָ/עָם֙ אֲשֶׁ֣ר הֵ֠שִׁיב מֵ/אֵ֨ת יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ מִן הַ/מִּצְפָּ֔ה אַחַ֣ר הִכָּ֔ה אֶת גְּדַלְיָ֖ה בֶּן אֲחִיקָ֑ם גְּבָרִ֞ים אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/נָשִׁ֤ים וְ/טַף֙ וְ/סָ֣רִסִ֔ים אֲשֶׁ֥ר הֵשִׁ֖יב מִ/גִּבְעֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: pt
  text: 'Então Joanã, filho de Careá, e todos os comandantes das tropas que estavam com ele tomaram todo o restante do povo que ele havia resgatado de Ismael, filho de Netanias, de Mispá, depois que este matou Gedalias, filho de Aicão: os homens, os homens de guerra, as mulheres, as crianças pequenas e os oficiais da corte[a], todos eles trazidos de volta por Joanã de Gibeão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eunucos”. O termo hebraico pode designar tanto eunucos propriamente ditos como funcionários da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ... tomaram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência naturalmente. O plural concorda com o sujeito composto Joanã e os comandantes.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: comandantes das tropas
  rationale: שָׂרִים designa líderes ou comandantes, e חֲיָלִים, neste contexto, tropas ou forças militares.
- source_word: שְׁאֵרִית הָעָם
  choice: o restante do povo
  rationale: Preserva a ideia de uma parcela sobrevivente sem recorrer ao termo mais marcadamente eclesiástico “remanescente”.
- source_word: הֵשִׁיב
  choice: havia resgatado / havia trazido de volta
  rationale: O hifil de שוב significa fazer voltar ou trazer de volta. Na primeira ocorrência, o contexto de libertação do poder de Ismael permite “resgatado”; na segunda, “trazido de volta” conserva mais diretamente a imagem de retorno.
- source_word: מִן הַמִּצְפָּה
  choice: trazendo-o de Mispá
  rationale: Explicita a relação sintática provável entre o povo recuperado e seu lugar de procedência, evitando que “de Mispá” pareça modificar Ismael.
- source_word: אַחַר הִכָּה
  choice: depois que Ismael matou
  rationale: O verbo נכה pode significar golpear mortalmente; como a morte de Gedalias está estabelecida no contexto, “matou” comunica o resultado sem ambiguidade de referente.
- source_word: גְּבָרִים אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens, os homens de guerra
  rationale: Mantém os dois elementos hebraicos e sua formulação aposicional, sem fundi-los simplesmente em “soldados”.
- source_word: טַף
  choice: as crianças pequenas
  rationale: טַף designa crianças pequenas ou dependentes e ressalta sua vulnerabilidade.
- source_word: סָרִסִים
  choice: oficiais da corte
  rationale: סָרִיסִים pode indicar eunucos literalmente ou funcionários palacianos; o texto principal emprega a opção funcional, enquanto a nota preserva a alternativa literal.
- source_word: מִגִּבְעוֹן
  choice: de Gibeão
  rationale: A preposição marca Gibeão como o lugar de onde Joanã os trouxe de volta.
- source_word: יוֹחָנָן; קָרֵחַ; יִשְׁמָעֵאל; נְתַנְיָה; גְּדַלְיָה; אֲחִיקָם
  choice: Joanã; Careá; Ismael; Netanias; Gedalias; Aicão
  rationale: Usam-se formas portuguesas tradicionais e reconhecíveis, ajustadas à ortografia moderna.
