revisions:
- from: 'Então Joanã, filho de Careá, e todos os comandantes das tropas que estavam com ele tomaram todo o restante do povo que ele havia resgatado de Ismael, filho de Netanias, trazendo-o de Mispá, depois que Ismael matou Gedalias, filho de Aicão: os homens, os homens de guerra, as mulheres, as crianças pequenas e os oficiais da corte[a] que Joanã havia trazido de volta de Gibeão.'
  to: 'Então Joanã, filho de Careá, e todos os comandantes das tropas que estavam com ele tomaram todo o restante do povo que ele havia resgatado de Ismael, filho de Netanias, de Mispá, depois que este matou Gedalias, filho de Aicão: os homens, os homens de guerra, as mulheres, as crianças pequenas e os oficiais da corte[a], todos eles trazidos de volta por Joanã de Gibeão.'
  rationale: A revisão elimina o particípio que deslocava a relação de «de Mispá» e reformula a oração final como construção participial plural («todos eles trazidos»), deixando claro que Gibeão se aplica a todo o grupo enumerado. «Este» identifica Ismael como o sujeito de «matou», sem introduzir ambiguidade.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:05Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a progressão narrativa, os nomes e a enumeração. «Matou» é justificável para הִכָּה no contexto imediato, e «oficiais da corte» preserva adequadamente a ambiguidade de סָרִיסִים com nota. Contudo, «trazendo-o de Mispá» reformula a oração relativa hebraica como ação concomitante de «tomaram», em vez de manter a recuperação anterior; a revisão conserva mais claramente a relação com «havia resgatado».
  naturalness: O registro é claro e atual. «Os homens, os homens de guerra» é uma repetição um tanto pesada, mas é aceitável em uma tradução de equivalência formal por refletir os dois membros da expressão hebraica. A oração final precisava ser ajustada, pois, na redação atual, poderia parecer que somente «os oficiais da corte» foram trazidos de volta de Gibeão.
  terminology: «Comandantes das tropas», «restante do povo», «crianças pequenas» e «oficiais da corte» são escolhas adequadas. A nota para «oficiais da corte» mantém a alternativa «eunucos» sem decidir indevidamente uma questão lexical ambígua.
  issues:
  - severity: medium
    issue: O particípio «trazendo-o de Mispá» altera a ligação sintática e temporal de מִן־הַמִּצְפָּה.
    rationale: No hebraico, «de Mispá» integra a descrição do remanescente que Joanã havia recuperado de Ismael. O particípio português pode sugerir que o transporte de Mispá ocorreu simultaneamente ao ato principal de tomar o povo.
  - severity: medium
    issue: A oração «que Joanã havia trazido de volta de Gibeão» pode ter como antecedente imediato apenas «os oficiais da corte».
    rationale: A oração relativa hebraica retoma «todo o restante do povo», abrangendo a lista inteira. «Todos eles» torna esse alcance explícito em português.
  revised_text: 'Então Joanã, filho de Careá, e todos os comandantes das tropas que estavam com ele tomaram todo o restante do povo que ele havia resgatado de Ismael, filho de Netanias, de Mispá, depois que este matou Gedalias, filho de Aicão: os homens, os homens de guerra, as mulheres, as crianças pequenas e os oficiais da corte[a], todos eles trazidos de volta por Joanã de Gibeão.'
  revised_footnotes:
  - marker: a
    text: Ou “eunucos”. O termo hebraico pode designar tanto eunucos propriamente ditos como funcionários da corte.
    reason: lexical_alternative
  revision_rationale: A revisão elimina o particípio que deslocava a relação de «de Mispá» e reformula a oração final como construção participial plural («todos eles trazidos»), deixando claro que Gibeão se aplica a todo o grupo enumerado. «Este» identifica Ismael como o sujeito de «matou», sem introduzir ambiguidade.
