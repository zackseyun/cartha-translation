  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: pt
  text: 'Mas, entre eles, encontraram-se dez homens, que disseram a Ismael: “Não nos mate, pois temos reservas escondidas[a] no campo: trigo, cevada, azeite e mel.” Então ele se conteve e não os matou no meio de seus irmãos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tesouros”. Neste contexto, a enumeração indica provisões escondidas, não necessariamente objetos de valor.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” pode indicar aqui os companheiros ou compatriotas que estavam com eles e foram mortos.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: Mas, entre eles, encontraram-se dez homens
  rationale: A conjunção introduz uma exceção ao massacre narrado anteriormente; “mas” explicita essa relação contextual. A formulação mantém o valor passivo de נִמְצְאוּ e traduz בָם de modo idiomático como “entre eles”.
- source_word: אַל תְּמִתֵנוּ
  choice: Não nos mate
  rationale: O hifil de מות é causativo, mas, neste contexto, o português natural expressa o mesmo sentido diretamente com “matar”. O imperativo no singular é dirigido a Ismael.
- source_word: כִּי יֵשׁ לָנוּ מַטְמֹנִים בַּשָּׂדֶה
  choice: pois temos reservas escondidas no campo
  rationale: מַטְמֹנִים designa coisas ocultas ou tesouros; os produtos enumerados mostram que se trata de provisões armazenadas em segredo. “Reservas escondidas” comunica esse sentido sem excluir em nota a alternativa lexical mais ampla.
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: trigo, cevada, azeite e mel
  rationale: A lista é reproduzida claramente. Em contexto agrícola israelita, שֶׁמֶן se refere naturalmente ao azeite; דְבָשׁ é mantido como “mel”, sem decidir no texto se era mel de abelha ou xarope de frutas.
- source_word: וַיֶּחְדַּל
  choice: Então ele desistiu
  rationale: חדל significa cessar ou desistir de uma ação. Aqui, Ismael abandona a intenção de matar esses dez homens.
- source_word: וְלֹא הֱמִיתָם בְּתוֹךְ אֲחֵיהֶם
  choice: e não os matou junto com os irmãos deles
  rationale: “Matou” traduz naturalmente o hifil de מות no contexto. “Irmãos” preserva o termo de parentesco אֲחֵיהֶם, enquanto “junto com” expressa que os demais membros do grupo foram mortos.
