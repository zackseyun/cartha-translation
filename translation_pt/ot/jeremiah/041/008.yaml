  source_fidelity: A tradução reproduz corretamente a exceção introduzida por "mas", os dez homens, o apelo a Ismael, as provisões ocultas e a consequência de que eles não foram mortos. Contudo, "junto com os irmãos deles" torna a relação espacial de בְּתוֹךְ menos direta e pode sugerir apenas uma ação simultânea; "no meio de seus irmãos" preserva melhor a formulação hebraica e sua ambiguidade.
  naturalness: O português é moderno, claro e adequado. "Então ele se conteve" explicita com mais naturalidade que Ismael cessou a ação pretendida, preparando a oração seguinte.
  terminology: '"Reservas escondidas", "trigo, cevada, azeite e mel" e "irmãos" são escolhas adequadas. As notas preservam corretamente as alternativas e a referência possivelmente não literal de "irmãos".'
