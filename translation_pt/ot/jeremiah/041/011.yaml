  text: וַ/יִּשְׁמַע֙ יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֣ר עָשָׂ֔ה יִשְׁמָעֵ֖אל בֶּן נְתַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: pt
  text: Quando Joanã, filho de Careá, e todos os comandantes das forças que estavam com ele souberam de todo o mal que Ismael, filho de Netanias, havia feito,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Quando ... souberam de
  rationale: O waw consecutivo faz a narrativa avançar, mas o versículo funciona como oração temporal cuja ação principal vem no versículo seguinte. O plural concorda naturalmente com o sujeito composto em português, e «souberam de» expressa a recepção de uma notícia.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: os comandantes das forças
  rationale: שָׂרִים designa chefes ou comandantes, e חֲיָלִים, neste contexto, forças militares. A expressão é clara, atual e mantém a amplitude do hebraico.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: A oração relativa identifica os comandantes que acompanhavam Joanã, sem acrescentar informação espacial não expressa no texto.
- source_word: אֵת כָּל הָרָעָה
  choice: de todo o mal
  rationale: רָעָה inclui aqui tanto a perversidade moral quanto os atos nocivos de Ismael; «mal» conserva essa força sem restringi-la a dano ou desastre.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto situa naturalmente os atos de Ismael antes de Joanã e seus comandantes receberem a notícia, preservando o sentido amplo de «fazer».
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis; as vírgulas tornam transparente a relação de filiação.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, filho de Netanias
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis; a construção explicita de modo natural a filiação.
