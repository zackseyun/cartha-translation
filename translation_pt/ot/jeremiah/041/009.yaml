source:
  edition: WLC
  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: pt
  text: O poço no qual Ismael havia lançado os cadáveres de todos os homens que ele matou junto com Gedalias[a] era aquele que o rei Asa havia construído por causa de Baasa, rei de Israel[b]. Ismael, filho de Netanias, encheu-o com os mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ele matou por causa de Gedalias” ou “que ele matou ao lado de Gedalias”. A expressão hebraica é literalmente “pela mão de Gedalias”; é difícil e seu sentido depende do contexto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “por medo de Baasa, rei de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: o poço
  rationale: בּוֹר pode designar uma cova ou uma cisterna. “Poço” é natural em português, abrange uma estrutura escavada e construída e evita especificar sem necessidade que ainda armazenasse água.
- source_word: הִשְׁלִיךְ שָׁם
  choice: havia lançado ... no qual
  rationale: A construção portuguesa incorpora שָׁם na expressão relativa de destino e preserva o sentido de lançar os corpos para dentro do poço.
- source_word: פִּגְרֵי
  choice: os cadáveres
  rationale: פֶּגֶר indica corpos mortos; “cadáveres” mantém de modo claro a força sombria do termo.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo hebraico está no masculino plural e, no contexto narrativo, refere-se especificamente aos homens mortos.
- source_word: הִכָּה
  choice: matou
  rationale: Embora נכה signifique literalmente golpear, neste contexto o resultado letal é inequívoco; “matou” é direto e idiomático.
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: junto com Gedalias
  rationale: A expressão, literalmente “pela mão/ao lado de Gedalias”, é difícil. O contexto favorece a referência aos homens mortos em associação com Gedalias, sem fazer de Gedalias o agente da matança; a ambiguidade é registrada em nota.
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: era aquele que ... havia construído
  rationale: A construção retomadora identifica o poço mencionado com o que Asa mandou fazer. A formulação portuguesa é clara e natural.
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: por causa de Baasa
  rationale: מִפְּנֵי pode indicar causa, oposição ou temor. “Por causa de” conserva a amplitude sem impor um motivo psicológico específico.
- source_word: מִלֵּא
  choice: encheu
  rationale: Equivalente direto e natural do piel de מלא.
- source_word: חֲלָלִים
  choice: mortos
  rationale: חֲלָלִים designa pessoas mortas violentamente. “Mortos”, após a menção explícita da matança, é conciso e natural em português.
theological_decisions:
- issue: Relação dos homens mortos com Gedalias em בְּיַד גְּדַלְיָהוּ
  choice: junto com Gedalias
  alternative: por causa de Gedalias; ao lado de Gedalias; pela mão de Gedalias
  rationale: A expressão hebraica é incomum e dependente do contexto. A leitura escolhida se harmoniza com a narrativa dos mortos associados a Gedalias, mas a nota mantém abertas as principais possibilidades sem atribuir indevidamente a matança a Gedalias.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com nomes próprios em formas correntes na tradição lusófona. A ordem das frases segue de perto o hebraico, enquanto a sintaxe foi ajustada para fluência. As notas preservam as ambiguidades reais de בְּיַד e מִפְּנֵי.
