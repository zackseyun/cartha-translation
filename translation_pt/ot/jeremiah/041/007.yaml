  text: וַ/יְהִ֕י כְּ/בוֹאָ֖/ם אֶל תּ֣וֹךְ הָ/עִ֑יר וַ/יִּשְׁחָטֵ֞/ם יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ אֶל תּ֣וֹךְ הַ/בּ֔וֹר ה֖וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
translation:
  language: pt
  text: Quando chegaram ao interior da cidade, Ismael, filho de Netanias, os massacrou e os lançou no interior da cisterna[a], ele e os homens que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: poço. A palavra hebraica pode significar “poço”, “cova” ou “cisterna”; “cisterna” parece ajustar-se melhor ao contexto imediato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: Quando chegaram
  rationale: A construção hebraica introduz a circunstância temporal do acontecimento seguinte. Em português, “Quando chegaram” transmite isso naturalmente, sem o pouco idiomático “E aconteceu que, quando chegaram”.
- source_word: אֶל תּוֹךְ הָעִיר
  choice: ao interior da cidade
  rationale: Preserva o valor espacial de תּוֹךְ, indicando a parte interna da cidade, em linguagem portuguesa clara.
- source_word: וַיִּשְׁחָטֵם
  choice: os massacrou
  rationale: שׁחט descreve o abate violento das vítimas. “Massacrou” comunica a brutalidade no contexto narrativo sem restringir indevidamente o modo exato da morte.
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: e os lançou no interior da cisterna
  rationale: O hebraico tem literalmente a direção “para o interior da cisterna” ligada ao ato de matar; em português, explicitar o movimento pressuposto com “lançou” torna clara a deposição das vítimas, sem alterar o sentido contextual. “No interior” também reflete a repetição de אֶל תּוֹךְ.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: ele e os homens que estavam com ele
  rationale: Mantém a frase enfática posterior que identifica Ismael e seus cúmplices como agentes do ato.
- source_word: בּוֹר
  choice: cisterna
  rationale: בּוֹר pode designar poço, cova ou cisterna; neste contexto, “cisterna” representa melhor o reservatório mencionado na narrativa, enquanto a alternativa lexical é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem final “ele e os homens que estavam com ele” conserva a ênfase e a estrutura do hebraico, embora seja mais marcada em português. O marcador [a] foi colocado junto de “cisterna”, termo ao qual a nota se refere.
