reference: Jeremiah 52:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֹ֤דֶשׁ הָֽ/רְבִיעִי֙ בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָיָ֥ה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: pt
  text: No quarto mês, no nono dia do mês, a fome se agravou na cidade, e não havia pão para o povo da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o povo comum”. A expressão hebraica “povo da terra” pode, em alguns contextos, referir-se mais especificamente à população em geral ou às pessoas comuns.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: No quarto mês
  rationale: A expressão hebraica usa o ordinal definido como indicação de data. “Do ano” não está explícito e, por isso, não foi acrescentado.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: no nono dia do mês
  rationale: A fórmula hebraica de data é expressa naturalmente em português com a inclusão de “dia”.
- source_word: וַיֶּחֱזַק
  choice: se agravou
  rationale: Embora חזק tenha o sentido básico de “ser forte”, quando seu sujeito é a fome indica que ela se intensificou. “Se agravou” é claro, natural e preserva esse desenvolvimento.
- source_word: הָרָעָב
  choice: a fome
  rationale: Neste contexto de cerco, o termo designa fome generalizada e grave. Em português, “a fome se agravou” soa mais natural do que “a carestia se agravou” e comunica adequadamente a situação.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Mantém o sentido locativo simples; pelo contexto, a cidade é Jerusalém, sem necessidade de explicitar o nome neste versículo.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: e não havia pão
  rationale: Preserva o sentido concreto de לֶחֶם, que também pode representar alimento em geral, e mantém a imagem vívida da escassez.
- source_word: לְעַם הָאָרֶץ
  choice: para o povo da terra
  rationale: Tradução formal da expressão hebraica, preservando sua possível amplitude sem decidir no texto principal se ela se refere mais especificamente à população comum.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo narrativo e a imagem concreta do pão, enquanto a nota registra a ambiguidade social de עַם הָאָרֶץ.
