  text: וּ/מִ/דַּלּ֨וֹת הָ/עָ֜ם וְֽ/אֶת יֶ֥תֶר הָ/עָ֣ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָֽפְלוּ֙ אֶל מֶ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הָֽ/אָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: pt
  text: E alguns dos mais pobres do povo, o restante do povo que havia ficado na cidade, os desertores que tinham passado para o lado do rei da Babilônia[b] e o restante dos artesãos[a] — Nebuzaradã, capitão da guarda[c], levou para o exílio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o restante da multidão”. O termo hebraico nesta passagem é difícil; muitos o entendem, neste contexto, como referência a artesãos ou trabalhadores, especialmente à luz do relato paralelo em 2 Reis 25:11.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que caíram ... para o rei da Babilônia”, expressão idiomática que significa desertar ou passar para o lado dele.
    reason: lexical_alternative
  - marker: c
    text: Veja 2 Reis 25:11, o relato paralelo desta deportação.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  choice: alguns dos mais pobres do povo
  rationale: Expressa de modo natural o sentido partitivo da preposição מִן e o valor de pobreza ou condição humilde de דַּלּוֹת.
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: o restante do povo que havia ficado na cidade
  rationale: Mantém tanto a ideia de restante quanto a ação anterior de permanecer na cidade, distinguindo esse grupo do primeiro.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  choice: os desertores que tinham passado para o lado do rei da Babilônia
  rationale: Traduz o idioma político-militar de נפל אל, que aqui indica desertar ou passar para o lado do soberano inimigo, sem reproduzir literalmente 'cair' de modo obscuro.
- source_word: יֶתֶר הָאָמֹון
  choice: o restante dos artesãos
  rationale: Adota o sentido contextual provável de אָמוֹן como grupo de trabalhadores especializados ou artesãos, à luz do relato paralelo, preservando em nota a incerteza lexical.
- source_word: הֶגְלָה
  choice: levou para o exílio
  rationale: Comunica claramente o causativo de גלה, isto é, remover ou deportar pessoas para o exílio, em registro histórico digno.
- source_word: רַב טַבָּחִים
  choice: capitão da guarda
  rationale: Emprega a equivalência funcional tradicional para o título oficial babilônico, mais clara em português do que uma tradução literal como 'chefe dos executores'.
