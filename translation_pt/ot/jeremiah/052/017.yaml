  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: pt
  text: Os caldeus despedaçaram as colunas de bronze que pertenciam ao templo de Yahweh, bem como os suportes e o Mar de bronze que estava no templo de Yahweh, e levaram para a Babilônia todo o bronze desses objetos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: as colunas de bronze
  rationale: “Colunas” expressa naturalmente עַמּוּדֵי, e “bronze” é a designação contextual usual de נְחֹשֶׁת nos utensílios do templo.
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: que pertenciam ao templo de Yahweh
  rationale: O לְ indica aqui relação ou pertencimento, em contraste com בְּ na descrição posterior do Mar. “Templo” comunica de modo natural o sentido institucional de בֵית neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַמְּכֹנוֹת
  choice: os suportes
  rationale: Refere-se às estruturas móveis que sustentavam as bacias do templo; “suportes” é claro e concreto em português atual.
- source_word: יָם הַנְּחֹשֶׁת
  choice: o Mar de bronze
  rationale: “Mar” com inicial maiúscula preserva a designação reconhecível da grande bacia do templo, enquanto “de bronze” indica o material.
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: que estava no templo de Yahweh
  rationale: A concordância singular liga naturalmente a oração relativa ao antecedente imediato, o Mar de bronze, e בְּ expressa localização.
- source_word: שִׁבְּרוּ
  choice: despedaçaram
  rationale: Transmite que os grandes objetos foram quebrados em partes para possibilitar o transporte do metal.
- source_word: כַשְׂדִּים
  choice: os caldeus
  rationale: Preserva a designação histórica específica do hebraico, sem substituí-la pelo termo interpretativo mais amplo “babilônios”.
- source_word: וַיִּשְׂאוּ
  choice: levaram
  rationale: Expressa de forma idiomática o transporte do bronze como despojo para a Babilônia.
- source_word: כָּל נְחֻשְׁתָּם
  choice: todo o bronze deles
  rationale: O sufixo remete aos objetos enumerados; a formulação conserva essa referência sem a atribuir aos caldeus.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: A terminação direcional indica movimento com destino à Babilônia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; “Yahweh” o preserva em transliteração, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Templo” foi preferido a “casa” pelo sentido contextual de בֵית יְהוָה. A distinção entre לְבֵית (“pertenciam ao templo”) e בְּבֵית (“estava no templo”) foi preservada. Não se incluíram notas porque as alternativas lexicais não são necessárias para compreender o versículo.
