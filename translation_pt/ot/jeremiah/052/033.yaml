base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/033.yaml
  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: pt
  text: E ele trocou suas roupas de prisão e fazia suas refeições diante do rei continuamente, todos os dias de sua vida.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “mudou as roupas de seu encarceramento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “comia pão diante dele”; a expressão provavelmente se refere a fazer suas refeições na presença do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה
  choice: trocou
  rationale: O verbo שׁנה significa aqui mudar ou trocar; com o objeto seguinte, indica que ele deixou de usar as roupas associadas à prisão.
- source_word: אֵת בִּגְדֵי כִלְאוֹ
  choice: as roupas da sua prisão
  rationale: A expressão designa literalmente as roupas de seu encarceramento. A formulação preserva a relação genitiva do hebraico sem pressupor um uniforme prisional no sentido moderno.
- source_word: וְאָכַל לֶחֶם
  choice: passou a comer
  rationale: Embora לֶחֶם seja literalmente “pão”, a expressão hebraica significa fazer refeições. Em português, “comer” comunica naturalmente o sentido neste contexto, enquanto a nota preserva a forma literal.
- source_word: לְפָנָיו
  choice: na presença do rei
  rationale: A expressão significa literalmente “diante dele”. A explicitação de “rei” esclarece o referente pronominal vindo do versículo anterior, sem acrescentar uma identificação controvertida.
- source_word: תָּמִיד
  choice: sempre
  rationale: תָּמִיד expressa continuidade ou regularidade; “sempre” é corrente e, junto de “todos os dias”, reproduz a ênfase do hebraico.
- source_word: כָּל יְמֵי חַיָּו
  choice: todos os dias da sua vida
  rationale: Tradução direta da expressão hebraica, preservando sua cadência e sua abrangência temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a repetição enfática entre “sempre” e “todos os dias da sua vida”, presente no hebraico, e evita interpretar לְפָנָיו como “à mesa do rei”, ideia plausível, mas não explicitamente declarada.
