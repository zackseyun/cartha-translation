translation_notes:
  register: Português moderno, claro e digno. A formulação conserva o caráter conciso e elíptico do hebraico, sem inserir um verbo ausente no versículo, e reposiciona “de Jerusalém” apenas o necessário para obter uma ordem natural em português.
