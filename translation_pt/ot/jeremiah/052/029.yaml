base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/029.yaml
  text: In the eighteenth year of Nebuchadnezzar[a], from Jerusalem, 832 persons.
translation:
  language: pt
  text: No décimo oitavo ano de Nabucodonosor, 832 pessoas[a] de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “832 almas”. O hebraico usa נֶפֶשׁ, literalmente “alma”, como termo de contagem para pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: No décimo oitavo ano
  rationale: A construção temporal com בְּ e o numeral cardinal empregado em sentido ordinal é expressa naturalmente em português como “no décimo oitavo ano”.
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: de Nabucodonosor
  rationale: O לְ indica referência à contagem do reinado; “ano de Nabucodonosor” é a formulação portuguesa natural.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: A preposição מִן indica procedência. A posição junto de “pessoas” comunica que elas provinham de Jerusalém sem acrescentar ao texto hebraico um verbo de deportação.
- source_word: נֶפֶשׁ
  choice: pessoas
  rationale: Embora o sentido literal seja “alma”, נֶפֶשׁ funciona aqui como termo de contagem para indivíduos; “pessoas” é claro, atual e adequado ao contexto.
- source_word: שְׁמֹנֶה מֵאוֹת שְׁלֹשִׁים וּשְׁנָיִם
  choice: '832'
  rationale: O número hebraico é aditivo (800 + 30 + 2). Algarismos favorecem a leitura desta lista estatística.
