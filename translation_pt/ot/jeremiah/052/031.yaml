reference: Jeremiah 52:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: pt
  text: No trigésimo sétimo ano do exílio de Joaquim, rei de Judá, no décimo segundo mês, aos vinte e cinco dias do mês, Evil-Merodaque[a], rei da Babilônia, no ano em que começou a reinar, levantou a cabeça de Joaquim, rei de Judá[b], e o tirou da prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Evil-Merodaque também é conhecido historicamente como Amel-Marduque.
    reason: alternative_reading
  - marker: b
    text: Ou, de modo mais interpretativo, “mostrou favor a Joaquim, rei de Judá”; literalmente, “levantou a cabeça de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 'No'
  rationale: A fórmula narrativa hebraica introduz o episódio e, em português natural, pode ser representada diretamente pela expressão temporal inicial, sem o arcaísmo “e aconteceu que”.
- source_word: לְגָלוּת
  choice: do exílio
  rationale: O substantivo indica o período ou estado decorrente da deportação; “exílio” é claro, atual e historicamente adequado.
- source_word: יְהוֹיָכִין
  choice: Joaquim
  rationale: Adota-se a forma bíblica tradicional em português para o nome do rei, distinguida pelo contexto de Joaquim, rei de Judá.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: no décimo segundo mês
  rationale: Reprodução idiomática da fórmula hebraica de datação.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: aos vinte e cinco dias do mês
  rationale: Expressão corrente em português para a data indicada literalmente pela construção hebraica.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Evil-Merodaque
  rationale: Forma tradicional e reconhecível em traduções portuguesas; a forma histórica acadiana é informada em nota.
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: no ano em que começou a reinar
  rationale: A expressão hebraica diz literalmente “no ano do seu reinado”. O contexto e o paralelo de 2 Reis 25:27 apontam para o ano de ascensão ao trono; esta formulação comunica isso sem impor uma numeração régia que não está explícita no texto de Jeremias.
- source_word: נָשָׂא אֶת רֹאשׁ
  choice: levantou a cabeça de
  rationale: Mantém a imagem do idioma hebraico, que neste contexto comunica elevação de condição ou concessão de favor; a nota esclarece o sentido.
- source_word: וַיֹּצֵא אוֹתוֹ
  choice: e o tirou
  rationale: O hifil de יצא significa fazer sair ou tirar. A tradução conserva a ação expressa, sem antecipar toda a interpretação jurídica de “libertar”.
- source_word: מִבֵּית הַכליא
  choice: da prisão
  rationale: Equivalente português natural da expressão “casa de confinamento”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem cronológica do hebraico foi preservada, enquanto a abertura narrativa foi naturalizada. O idioma “levantou a cabeça” permanece no texto para transparência ao original e é explicado em nota.
