base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: pt
  text: Eles capturaram o rei e o levaram ao rei da Babilônia, em Ribla, na terra de Hamate, e o rei da Babilônia pronunciou sentenças contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “falou com ele juízos”; trata-se de uma expressão judicial que significa proferir decisões ou sentenças contra alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: Eles capturaram
  rationale: תפשׂ indica agarrar ou capturar; no contexto militar, “capturaram” expressa com clareza a prisão do rei.
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל
  choice: e o levaram ao
  rationale: O hifil de עלה significa literalmente “fizeram subir”, mas aqui funciona como verbo de condução até Ribla. “Levaram” é natural em português e não sugere indevidamente uma subida topográfica.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Reprodução natural da construção hebraica, sem acrescentar o nome do monarca.
- source_word: רִבְלָתָה
  choice: em Ribla
  rationale: A terminação locativa hebraica é expressa naturalmente pela preposição “em”; o topônimo é transliterado na forma portuguesa corrente.
- source_word: בְּאֶרֶץ חֲמָת
  choice: na terra de Hamate
  rationale: Mantém a designação geográfica do hebraico; “terra” é clara e preserva a forma tradicional sem excluir o sentido de território.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: e este pronunciou a sentença contra ele
  rationale: A expressão literalmente fala em “juízos”, no plural, mas funciona como idioma judicial para proferir uma decisão ou sentença. “Este” identifica naturalmente o rei da Babilônia como sujeito, e “contra ele” conserva a direção adversa da decisão.
