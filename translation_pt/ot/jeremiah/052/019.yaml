base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: pt
  text: E as tigelas[a], os braseiros[b], as bacias, as panelas, os candelabros, as taças e os recipientes para libações — o que era de ouro, ouro, e o que era de prata, prata[c] — o comandante da guarda levou[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as taças”. A distinção exata entre vários termos para os utensílios do templo nesta lista é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “os incensários”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico repete “ouro, ouro” e “prata, prata” de modo enfático: “o que era de ouro, ouro, e o que era de prata, prata”.'
    reason: source_form
  - marker: d
    text: Literalmente, “o chefe dos carrascos”; também pode ser entendido como “o comandante da guarda pessoal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: as tigelas
  rationale: Designa provavelmente recipientes do templo semelhantes a tigelas ou taças. “Tigelas” distingue o termo de הַכַּפּוֹת mais adiante, embora a diferença exata entre esses utensílios seja incerta.
- source_word: הַמַּחְתּוֹת
  choice: os braseiros
  rationale: Refere-se a recipientes para transportar brasas no serviço do santuário; “braseiros” é concreto e permite também a associação com o incenso sem restringir o termo a incensários.
- source_word: הַמִּזְרָקוֹת
  choice: as bacias
  rationale: Indica recipientes rituais, provavelmente usados no manejo de sangue ou líquidos sacrificiais. “Bacias” mantém o sentido amplo sem impor uma função específica.
- source_word: הַסִּירוֹת
  choice: as panelas
  rationale: O substantivo denota panelas ou recipientes; a tradução simples evita especificar um uso não expresso no texto.
- source_word: הַמְּנֹרוֹת
  choice: os candelabros
  rationale: מְנוֹרָה designa o suporte de lâmpadas, não apenas uma lâmpada. “Candelabros” é a designação tradicional e amplamente compreensível em português para esse objeto do templo.
- source_word: הַכַּפּוֹת
  choice: as taças
  rationale: Em inventários do templo, o termo pode designar pequenos recipientes, taças ou colheres. “Taças” é natural e o distingue das tigelas e bacias anteriores.
- source_word: הַמְּנַקִיּוֹת
  choice: os recipientes para libações
  rationale: O termo é raro e sua identificação exata é incerta. A formulação funcional comunica uma provável relação com o derramamento ritual, sem recorrer a um nome de objeto arcaico ou excessivamente específico.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: o que era de ouro, ouro, e o que era de prata, prata
  rationale: Preserva a repetição enfática e o estilo de inventário do hebraico, em vez de nivelá-los para “todos os objetos de ouro e de prata”.
- source_word: לָקַח
  choice: levou
  rationale: No contexto do saque, “levou” traduz naturalmente o ato de tomar e retirar os utensílios, sem acrescentar uma caracterização explícita ausente do verbo.
- source_word: רַב טַבָּחִים
  choice: o comandante da guarda
  rationale: É um título oficial babilônico. “Comandante da guarda” é claro no contexto militar-administrativo e evita a literalidade potencialmente enganosa de “chefe dos carrascos”.
