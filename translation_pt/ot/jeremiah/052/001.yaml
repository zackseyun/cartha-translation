  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: pt
  text: Zedequias tinha vinte e um anos quando começou a reinar e reinou onze anos em Jerusalém. O nome de sua mãe era Hamutal, filha de Jeremias, de Libna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jeremias, natural de Libna”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: tinha vinte e um anos
  rationale: Expressa naturalmente em português o idioma hebraico usado para indicar idade.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com ב e o infinitivo de מלך situa a idade de Zedequias no início de seu reinado.
- source_word: מָלַךְ
  choice: reinou
  rationale: Traduz diretamente o exercício da realeza e mantém a formulação histórica convencional.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Representa o uso locativo direto da preposição hebraica.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Mantém o conteúdo da nota genealógica em ordem natural no português moderno.
- source_word: חמיטל
  choice: Hamutal
  rationale: Transliteração corrente do nome próprio hebraico, sem traduzi-lo.
- source_word: בַּת יִרְמְיָהוּ
  choice: filha de Jeremias
  rationale: Equivalente natural da expressão filial hebraica, com a forma portuguesa tradicional do nome.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: A frase com מן indica a procedência ou associação geográfica de Jeremias; 'de Libna' preserva essa concisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecíveis. A repetição de “reinou” preserva a distinção entre o início e a duração do reinado. A nota explicita que “de Libna” indica provavelmente a procedência de Jeremias, evitando ligá-la por engano a Hamutal.
