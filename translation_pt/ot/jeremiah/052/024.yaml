base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
translation:
  language: pt
  text: O comandante da guarda levou Seraías, o sacerdote principal[a], e Sofonias, o segundo sacerdote[b], e os três guardas do limiar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sumo sacerdote”. Em hebraico, o título é literalmente “o sacerdote principal” ou “o sacerdote-chefe”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o sacerdote adjunto”, isto é, o sacerdote que ocupava a segunda posição.
    reason: lexical_alternative
  - marker: c
    text: Ou “porteiros”. Literalmente, “guardas do limiar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: O título literalmente associa “chefe” a “executores”, mas, no contexto da corte neobabilônica, designa o oficial que comandava a guarda real. “Comandante da guarda” comunica naturalmente a função sem reproduzir literalmente o idioma.
- source_word: וַיִּקַּח
  choice: levou
  rationale: לקח significa normalmente “tomar” ou “pegar”; tratando-se aqui de pessoas postas sob custódia, “levou” é idiomático em português e não acrescenta a intensidade de “prendeu” ou “capturou”.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: o sacerdote principal
  rationale: Reflete de perto a expressão hebraica “o sacerdote, o cabeça/principal”, sem substituir automaticamente o título pela formulação técnica “sumo sacerdote”.
- source_word: צְפַנְיָה
  choice: Sofonias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: o segundo sacerdote
  rationale: Preserva de modo conciso a ideia hebraica de segunda posição hierárquica; uma nota registra a tradução funcional “sacerdote adjunto”.
- source_word: שְׁלֹשֶׁת
  choice: os três
  rationale: O numeral em estado construto introduz a designação funcional seguinte e se traduz naturalmente com artigo definido em português.
- source_word: שֹׁמְרֵי הַסַּף
  choice: guardas da entrada
  rationale: A expressão significa literalmente “guardas do limiar”. “Guardas da entrada” conserva a imagem e comunica com clareza a função, enquanto a nota registra a possibilidade mais funcional “porteiros”.
