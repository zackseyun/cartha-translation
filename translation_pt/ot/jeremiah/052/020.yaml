base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: pt
  text: Quanto aos dois pilares, a um Mar e aos doze bois de bronze[a] que estavam debaixo das bases, que o rei Salomão fizera para a casa de Yahweh, não se pesou o bronze de todos esses objetos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “doze touros de bronze” ou “doze bois feitos de bronze”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não havia peso para o bronze deles”. A expressão pode indicar que o bronze não foi pesado ou que não se registrou ou calculou seu peso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: os dois pilares
  rationale: “Pilares” é natural no contexto arquitetônico do templo e preserva o sentido estrutural de עַמּוּדִים.
- source_word: הַיָּם אֶחָד
  choice: o único Mar
  rationale: “Mar” é o nome técnico do grande reservatório do templo; a inicial maiúscula sinaliza esse uso, e “único” preserva a contagem do inventário.
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: e os doze bois de bronze
  rationale: בָּקָר designa gado bovino; “bois” é a forma tradicional e clara neste contexto. נְחֹשֶׁת é traduzido por “bronze” conforme o uso histórico e moderno.
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: que ficavam debaixo das bases
  rationale: מְכֹנוֹת refere-se às estruturas ou bases dos utensílios do templo. “Ficavam debaixo” expressa naturalmente a relação espacial.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: que o rei Salomão tinha feito
  rationale: O mais-que-perfeito composto situa a fabricação antes dos acontecimentos narrados, sem tornar explícito um antecedente que o hebraico deixa sintaticamente amplo.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: “Casa” preserva a expressão hebraica para o templo, e “Yahweh” representa diretamente o nome divino יְהוָה.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: não se podia pesar
  rationale: A formulação portuguesa mantém a ideia idiomática de que não houve pesagem ou de que o peso estava além de cálculo, sem escolher rigidamente entre essas possibilidades.
- source_word: לִנְחֻשְׁתָּם כָּל הַכֵּלִים הָאֵלֶּה
  choice: o bronze de todas essas peças
  rationale: “Peças” traduz כֵּלִים de modo abrangente e adequado aos grandes objetos do inventário, evitando sugerir apenas pequenos utensílios.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituir o nome por um título.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com estrutura de inventário preservada. “Mar” recebe maiúscula por designar o grande reservatório do templo. As duas notas estão marcadas no texto principal e preservam alternativas lexicais e a ambiguidade da frase final.
