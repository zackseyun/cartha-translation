  to: Quanto aos dois pilares, a um Mar e aos doze bois de bronze[a] que estavam debaixo das bases, que o rei Salomão fizera para a casa de Yahweh, não se pesou o bronze de todos esses objetos.[b]
  rationale: A revisão substitui uma implicação de impossibilidade por uma formulação que corresponde mais diretamente ao enunciado hebraico e deixa a extensão da expressão para a nota. Também torna a contagem de “um Mar” mais idiomática em português. As âncoras das notas permanecem corretamente vinculadas aos bois e à frase final.
