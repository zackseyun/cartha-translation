  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: pt
  text: Mas o exército dos caldeus perseguiu o rei e alcançou Zedequias nas planícies de Jericó[a]. Todas as tropas do rei se dispersaram, afastando-se dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas estepes de Jericó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: o exército dos caldeus
  rationale: חֵיל designa aqui uma força militar organizada, e כַּשְׂדִּים é preservado pelo termo histórico “caldeus”, em vez da equivalência contextual “babilônios”.
- source_word: וַיִּרְדְּפוּ
  choice: perseguiu
  rationale: רדף descreve uma perseguição militar. O singular concorda naturalmente em português com o sujeito coletivo “o exército”.
- source_word: אַחֲרֵי הַמֶּלֶךְ
  choice: o rei
  rationale: A preposição hebraica é incorporada de modo idiomático ao verbo português “perseguir”, sem perda de sentido.
- source_word: וַיַּשִּׂיגוּ אֶת צִדְקִיָּהוּ
  choice: alcançou Zedequias
  rationale: נשׂג indica alcançar alguém durante uma perseguição; “alcançou” é claro, atual e não acrescenta explicitamente a ideia de captura.
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: nas planícies de Jericó
  rationale: עֲרָבוֹת refere-se à região plana ou de estepe; “planícies” é a forma mais acessível, enquanto “estepes” é mantido em nota como alternativa lexical.
- source_word: וְכָל חֵילוֹ
  choice: Todas as tropas do rei
  rationale: O coletivo חֵיל com sufixo masculino singular refere-se às forças de Zedequias. “Do rei” explicita o referente do pronome sem confundi-lo com o exército caldeu mencionado antes.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: se dispersaram, afastando-se dele
  rationale: O verbo plural נָפֹצוּ favorece “tropas” como sujeito plural, e מֵעָלָיו expressa a separação das tropas em relação a Zedequias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O segundo período evita ambiguidade quanto ao referente de “seu” e preserva o plural verbal do hebraico por meio de “tropas”.
