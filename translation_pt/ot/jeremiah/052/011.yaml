base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: pt
  text: Então o rei da Babilônia cegou os olhos de Zedequias, prendeu-o com grilhões de bronze, levou-o para a Babilônia e o colocou na casa de detenção[a] até o dia de sua morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na prisão”. Em hebraico, mais literalmente, “na casa de detenção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: cegou os olhos de Zedequias
  rationale: Mantém a menção explícita aos olhos e a brutalidade concreta da formulação hebraica, sem recorrer à expressão mais interpretativa “arrancou os olhos”.
- source_word: וַיַּאַסְרֵהוּ
  choice: prendeu-o
  rationale: O verbo אסר significa amarrar ou prender; aqui, os grilhões mencionados em seguida deixam claro que se trata de contenção física.
- source_word: בַנְחֻשְׁתַּיִם
  choice: com grilhões de bronze
  rationale: O termo designa restrições de bronze, provavelmente um par de grilhões. “Grilhões” comunica com clareza a condição de prisioneiro, e “bronze” preserva o material indicado no hebraico.
- source_word: וַיְבִאֵהוּ ... בָּבֶלָה
  choice: o levou para a Babilônia
  rationale: A forma causativa de בוא expressa levar ou trazer, e a terminação direcional de בָּבֶלָה é representada naturalmente por “para a Babilônia”.
- source_word: בֵּית הַפְּקֻדֹּת
  choice: casa de detenção
  rationale: Preserva a estrutura concreta da expressão hebraica e seu sentido de local sob custódia, sem especificar além da evidência lexical. A alternativa mais fluente “prisão” é registrada em nota.
- source_word: עַד יוֹם מוֹתוֹ
  choice: até o dia de sua morte
  rationale: Conserva a formulação explícita e a cadência solene do hebraico, em vez de simplificá-la para “até morrer”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “Babilônia” foi mantida porque reflete o hebraico. O marcador da nota foi colocado após “casa de detenção”, expressão à qual a alternativa lexical se refere.
