base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: pt
  text: No vigésimo terceiro ano do reinado de Nabucodonosor, Nebuzaradã, comandante da guarda, deportou 745 pessoas de Judá[a]. Ao todo, foram 4.600 pessoas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «judeus»; neste contexto, pessoas de Judá.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «almas», tanto nesta soma como na contagem anterior; aqui, a palavra é usada no sentido de pessoas. O total de 4.600 resume os deportados mencionados nos versículos 28–30.'
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים לִנְבוּכַדְרֶאצַּר
  choice: No vigésimo terceiro ano de Nabucodonosor
  rationale: Reproduz naturalmente em português a fórmula hebraica de datação, entendendo o ano como contado em relação ao reinado de Nabucodonosor.
- source_word: הֶגְלָה
  choice: deportou
  rationale: O hifil de גלה indica fazer alguém ir para o exílio; «deportou» comunica isso de modo claro e conciso no contexto histórico.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Transliteração portuguesa corrente do nome próprio babilônico.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Equivalente funcional natural para o título oficial; evita a tradução literal potencialmente enganosa «chefe dos carrascos».
- source_word: יְהוּדִים
  choice: judeus
  rationale: Termo corrente e imediatamente compreensível em português para os habitantes ou povo de Judá neste contexto exílico; conserva a referência étnico-geográfica.
- source_word: נֶפֶשׁ
  choice: pessoas
  rationale: Em enumerações, נֶפֶשׁ designa indivíduos contados, sem pretender destacar uma noção metafísica de «alma».
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: '745'
  rationale: Os algarismos favorecem a leitura e preservam o número exato.
- source_word: כָּל נֶפֶשׁ
  choice: Ao todo, foram ... pessoas
  rationale: Expressa em português natural a fórmula hebraica de totalização e sua função recapitulativa.
- source_word: אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: '4.600'
  rationale: Emprega a convenção portuguesa de separar milhares com ponto e preserva o total exato.
