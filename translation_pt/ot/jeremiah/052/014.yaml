  text: וְ/אֶת כָּל חֹמ֥וֹת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר אֶת רַב טַבָּחִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/014.yaml
  text: And all the walls around Jerusalem were broken down by all the army of the Chaldeans that was with the captain of the guard[a][b].
translation:
  language: pt
  text: E todas as muralhas ao redor de Jerusalém foram derrubadas por todo o exército dos caldeus[a] que estava com o comandante da guarda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “babilônios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “chefe dos executores”; o título provavelmente se refere ao comandante da guarda real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹמוֹת
  choice: muralhas
  rationale: O plural חוֹמוֹת designa as fortificações defensivas da cidade; “muralhas” é claro e natural em português.
- source_word: סָבִיב
  choice: ao redor de Jerusalém
  rationale: Expressa a extensão circundante das muralhas de modo idiomático, sem perder o sentido de que cercavam a cidade.
- source_word: נָתְצוּ
  choice: foram derrubadas
  rationale: נתץ indica derrubar ou demolir estruturas. A construção passiva preserva o foco hebraico inicial nas muralhas e soa natural em português.
- source_word: חֵיל
  choice: exército
  rationale: Neste contexto, חֵיל se refere à força militar caldeia, e “exército” é a equivalência mais direta.
- source_word: כַּשְׂדִּים
  choice: caldeus
  rationale: Mantém o etnônimo explícito do hebraico; “babilônios” é a identificação contextual e consta em nota.
- source_word: אֲשֶׁר אֶת
  choice: que estava com
  rationale: A expressão indica associação com o oficial mencionado. O singular concorda com o coletivo “exército”.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: É uma tradução funcional do título de um alto oficial babilônico ligado à guarda real; o sentido mais literal é preservado em nota.
