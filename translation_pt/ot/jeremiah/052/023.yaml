  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: pt
  text: Havia noventa e seis romãs para o lado de fora[a]; todas as romãs na treliça, em toda a volta, totalizavam cem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fora”, “em uma direção” ou, possivelmente, “na direção do vento”. O termo hebraico é difícil; o sentido parece ser que noventa e seis foram contadas de um lado, enquanto o total ao redor da treliça era cem.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: romãs
  rationale: O termo significa literalmente “romãs” e, neste contexto, designa ornamentos em forma de romã. A forma lexical simples preserva a imagem do hebraico sem inserir uma explicação no texto.
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: noventa e seis
  rationale: Tradução direta do numeral cardinal.
- source_word: רוּחָה
  choice: voltadas para o lado de fora
  rationale: A expressão direcional é difícil neste contexto arquitetônico. Esta formulação comunica a provável referência ao lado exterior ou à direção em que noventa e seis romãs podiam ser contadas, sem eliminar a incerteza, registrada na nota.
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: ao todo, eram cem romãs
  rationale: Expressa com naturalidade em português a contagem total indicada por כָּל e pelo numeral, mantendo o contraste com as noventa e seis mencionadas antes.
- source_word: הַשְּׂבָכָה
  choice: a treliça
  rationale: שְׂבָכָה designa a estrutura ornamental entrelaçada dos capitéis. “Treliça” é conciso, corrente e adequado ao contexto arquitetônico.
- source_word: סָבִיב
  choice: ao redor
  rationale: Reproduz de modo natural o sentido espacial de algo disposto em toda a circunferência.
