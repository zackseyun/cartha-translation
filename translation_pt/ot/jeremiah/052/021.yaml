base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: pt
  text: Quanto às colunas, uma delas tinha dezoito côvados de altura, e um cordão de doze côvados a circundava. A espessura da coluna era de quatro dedos[a], e ela era oca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quatro dedos de largura”. O hebraico diz literalmente “quatro dedos”, uma unidade de medida baseada no corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  choice: Quanto às colunas
  rationale: O waw com o substantivo definido introduz as colunas como tópico nesta descrição de inventário. A formulação é natural em português e preserva a referência coletiva.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קומה הָעַמֻּד הָאֶחָד
  choice: uma delas tinha dezoito côvados de altura
  rationale: O hebraico fala literalmente da altura de 'uma coluna'. 'Uma delas' mantém o singular e sua relação com as colunas já mencionadas, sem explicitar além do texto que a medida valia para cada uma.
- source_word: חוּט
  choice: cordão
  rationale: חוּט designa um fio ou cordão. Aqui, o objeto circunda a coluna e expressa sua circunferência; 'cordão' conserva a imagem concreta do hebraico.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: um cordão de doze côvados a circundava
  rationale: O verbo סבב com sufixo pronominal indica que o cordão dava a volta na coluna. 'Circundava' transmite com clareza a medida da circunferência.
- source_word: עָבְיוֹ
  choice: sua espessura
  rationale: O termo se refere à espessura do material da coluna, não ao diâmetro total.
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: quatro dedos
  rationale: A expressão hebraica significa literalmente 'quatro dedos' e emprega uma medida baseada no corpo. A tradução preserva a concretude da expressão, com esclarecimento em nota.
- source_word: נָבוּב
  choice: ela era oca
  rationale: O termo descreve a coluna como vazia por dentro. A oração explícita produz português natural e preserva o sentido predicativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura descritiva natural. Mantêm-se as unidades antigas ('côvados' e 'dedos') e a imagem concreta do cordão usado para expressar a circunferência.
