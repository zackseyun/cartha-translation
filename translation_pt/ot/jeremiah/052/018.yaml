  text: וְ/אֶת הַ֠/סִּרוֹת וְ/אֶת הַ/יָּעִ֨ים וְ/אֶת הַֽ/מְזַמְּר֜וֹת וְ/אֶת הַ/מִּזְרָקֹ֣ת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ם לָקָֽחוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: pt
  text: Levaram as panelas, as pás, os aparadores de pavio[a], as bacias[b], os pratos e todos os utensílios de bronze com os quais ministravam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrumentos de corte” ou “aparadores de mecha”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigelas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com os quais prestavam serviço”. O verbo hebraico frequentemente se refere ao serviço cultual.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: as panelas
  rationale: סִירוֹת designa panelas ou recipientes de cozinha; “panelas” é natural e suficientemente abrangente neste inventário do templo.
- source_word: הַיָּעִים
  choice: as pás
  rationale: יָעִים refere-se a instrumentos usados para retirar cinzas ou brasas; “pás” é claro e tradicional neste contexto.
- source_word: הַמְזַמְּרוֹת
  choice: os aparadores de pavio
  rationale: O termo pode designar instrumentos de corte ou poda, mas, em listas de utensílios do templo, provavelmente se refere a instrumentos usados para aparar os pavios das lâmpadas. A nota preserva a incerteza lexical.
- source_word: הַמִּזְרָקֹת
  choice: as bacias
  rationale: מִזְרָקֹת eram recipientes usados para receber ou aspergir líquidos, inclusive sangue sacrificial; “bacias” expressa bem o tipo de utensílio sem especificar demais.
- source_word: הַכַּפּוֹת
  choice: os pratos
  rationale: כַּפּוֹת pode indicar pequenos recipientes, tigelas ou utensílios semelhantes a colheres. “Pratos” mantém um sentido amplo e evita impor uma função incerta.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: todos os utensílios de bronze
  rationale: Neste inventário, כְּלֵי refere-se genericamente a utensílios, e נְחֹשֶׁת é adequadamente traduzido por “bronze” no contexto dos objetos do templo.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: com os quais ministravam
  rationale: שרת frequentemente descreve serviço cultual. “Ministravam” conserva essa nuance sagrada e mantém implícitos, como no contexto hebraico, os agentes humanos.
- source_word: לָקָחוּ
  choice: Levaram
  rationale: No contexto do saque do templo, “levaram” comunica de modo natural tanto o ato de tomar como o de remover os objetos.
theological_decisions:
- issue: Nuance cultual de שׁרת
  choice: ministravam
  alternative: prestavam serviço
  rationale: “Ministravam” conserva a associação do verbo com o serviço sagrado sem identificar mais precisamente os agentes ou suas funções.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração mantém a forma concisa de inventário do hebraico. As notas registram apenas alternativas lexicais relevantes e preservam a incerteza quanto à identificação de alguns utensílios.
