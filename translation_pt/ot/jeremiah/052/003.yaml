id: JER.52.3
reference: Jeremiah 52:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: pt
  text: Pois foi por causa da ira de Yahweh que tudo isso aconteceu em Jerusalém e Judá, até que ele os expulsou de sua presença[a]. E Zedequias se rebelou contra o rei da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante de sua face”.
    reason: Preserva a imagem hebraica subjacente à tradução idiomática “de sua presença”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para os acontecimentos narrados anteriormente e preserva de modo natural a função discursiva do hebraico.
- source_word: עַל אַף יְהוָה
  choice: por causa da ira de Yahweh
  rationale: Expressa claramente a relação causal e conserva a força do substantivo idiomático אַף como ira divina, sem reproduzir literalmente a imagem de 'nariz'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título 'Senhor'.
- source_word: הָיְתָה
  choice: tudo isso aconteceu
  rationale: O verbo feminino singular não apresenta sujeito explícito. Esta formulação retoma naturalmente a situação descrita no contexto, sem definir além do texto qual evento isolado funciona como sujeito.
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: em Jerusalém e Judá
  rationale: Mantém diretamente a referência locativa à cidade e ao território.
- source_word: עַד הִשְׁלִיכוֹ אוֹתָם
  choice: até que ele os expulsou
  rationale: O hifil de שלך comunica remoção forçada; 'expulsou' transmite essa severidade em português corrente.
- source_word: מֵעַל פָּנָיו
  choice: de sua presença
  rationale: Traduz idiomaticamente a expressão hebraica literal 'de diante de sua face', preservando seu sentido relacional e judicial.
- source_word: וַיִּמְרֹד
  choice: E ... se rebelou
  rationale: Representa o valor narrativo da forma verbal e o sentido político de מרד.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: contra o rei da Babilônia
  rationale: Com o verbo מרד, a preposição בְּ indica idiomaticamente aquele contra quem se dirige a rebelião.
theological_decisions:
- issue: Relação entre a ira divina e a queda de Jerusalém e Judá
  choice: A tradução declara que os acontecimentos se deram por causa da ira de Yahweh e culminaram na expulsão de sua presença.
  alternative: Tratar os acontecimentos apenas como fatos históricos, sem causalidade divina explícita.
  rationale: A expressão עַל אַף יְהוָה afirma diretamente a causa teológica; suavizá-la apagaria uma alegação central do texto.
- issue: Referente implícito de הָיְתָה
  choice: Empregar 'tudo isso aconteceu' como retomada contextual ampla.
  alternative: Traduzir literalmente 'ela foi' ou adotar um sujeito específico, como 'a calamidade'.
  rationale: O hebraico não explicita o sujeito. A solução escolhida torna a oração inteligível em português sem impor um referente específico não declarado.
- issue: Imagem de מֵעַל פָּנָיו
  choice: Usar no texto 'de sua presença' e registrar em nota a forma literal.
  alternative: Manter no corpo 'de diante de sua face'.
  rationale: A expressão idiomática portuguesa comunica o sentido com clareza, enquanto a nota preserva a imagem antropomórfica do hebraico sem interpretá-la teologicamente além do necessário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi dividida em duas frases para evitar um período excessivamente pesado, sem romper a progressão narrativa. 'Ira' mantém a intensidade do juízo; 'Yahweh' conserva o nome divino.
