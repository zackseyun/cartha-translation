  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase mantém a data solene e a repetição de “rei da Babilônia”, ambas presentes no hebraico, enquanto usa equivalência funcional para o título cortesão e para a expressão de serviço real.
