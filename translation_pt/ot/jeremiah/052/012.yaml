  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: pt
  text: No quinto mês, no décimo dia do mês — no décimo nono ano do rei Nabucodonosor, rei da Babilônia —, Nebuzaradã, chefe da guarda[a], que servia na presença do rei da Babilônia[b], chegou a Jerusalém[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “chefe dos carrascos” ou “chefe dos açougueiros”; o título provavelmente designava um alto oficial responsável pela guarda real.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “estava de pé diante do rei da Babilônia”, uma fórmula da corte para indicar serviço na presença do rei.
    reason: cultural_note
  - marker: c
    text: O hebraico traz literalmente “em Jerusalém”; com o verbo “chegar”, o português normalmente emprega “a Jerusalém”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: No quinto mês
  rationale: A conjunção hebraica dá continuidade à narrativa, mas não exige um marcador explícito como “então” ou “ora” em português; a expressão temporal inicia o versículo com naturalidade.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo dia do mês
  rationale: Explicita “dia”, implícito na fórmula hebraica de data, para clareza em português.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה
  choice: era o décimo nono ano
  rationale: Reproduz a observação explicativa que situa a data no ano de reinado.
- source_word: לַמֶּלֶךְ נְבוּכַדְרֶאצַּר
  choice: do rei Nabucodonosor
  rationale: O lamed assinala a contagem segundo o reinado; “ano do rei” é a formulação portuguesa natural.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta do estado construto, mantendo as duas ocorrências expressas no hebraico.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Forma tradicional e legível em português para o nome próprio hebraico.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: Equivalente funcional claro para o alto cargo babilônico; o sentido lexical mais literal é preservado em nota.
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: que servia na presença do rei da Babilônia
  rationale: A expressão cortesã significa exercer serviço oficial diante do rei. A formulação preserva a imagem de presença sem sugerir que ele apenas estava fisicamente em pé.
- source_word: בָּא ... בִּירוּשָׁלִָם
  choice: chegou a Jerusalém
  rationale: Embora a preposição hebraica seja literalmente “em”, com o verbo de movimento a construção idiomática portuguesa é “chegou a Jerusalém”.
