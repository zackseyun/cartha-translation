  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ/דַּלּ֣וֹת הָ/אָ֔רֶץ הִשְׁאִ֕יר נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים לְ/כֹרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
translation:
  language: pt
  text: Mas Nebuzaradã, chefe da guarda[a], deixou alguns dos mais pobres da terra como trabalhadores das vinhas e lavradores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chefe dos matadores” ou “chefe dos carrascos”; provavelmente era um título oficial da corte ou do exército babilônico.
    reason: lexical_alternative
  - marker: b
    text: Ou “agricultores” ou “trabalhadores do campo”. O termo hebraico é raro e se refere a quem trabalha o solo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: alguns dos mais pobres da terra
  rationale: 'O מִן tem sentido partitivo: Nebuzaradã deixou uma parte da população pobre. “Da terra” se refere aqui à terra de Judá, e “mais pobres” expressa de modo natural o estrato social indicado no contexto.'
- source_word: הִשְׁאִיר
  choice: deixou
  rationale: O hifil de שׁאר significa deixar ou fazer permanecer. “Deixou” é conciso e não acrescenta uma intenção que o texto não explicita.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Transliteração tradicional e reconhecível do nome próprio em português.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: Trata-se de um título oficial babilônico. A tradução funcional evita a impressão enganosa de que o cargo se limitava ao trabalho de açougueiro ou carrasco, enquanto a nota preserva o sentido literal.
- source_word: לְכֹרְמִים
  choice: como trabalhadores das vinhas
  rationale: O לְ indica a função atribuída aos que ficaram, e כֹרְמִים designa pessoas que cultivam ou cuidam de vinhas. A expressão é clara no português corrente.
- source_word: וּלְיֹגְבִים
  choice: e lavradores
  rationale: O termo raro designa trabalhadores agrícolas, provavelmente ligados ao cultivo ou ao trabalho do solo. “Lavradores” conserva a dimensão agrária sem restringi-la indevidamente apenas ao ato de arar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem da frase foi ajustada ao uso natural do português, e os dois ofícios agrícolas foram distinguidos sem recorrer a linguagem arcaica.
