base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: pt
  text: No nono ano do seu reinado, no décimo mês, no décimo dia do mês, Nabucodonosor[a], rei da Babilônia, veio contra Jerusalém com todo o seu exército. Eles acamparam contra ela e construíram ao redor dela uma muralha de cerco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A grafia hebraica do nome neste versículo corresponde mais diretamente a “Nabucodrezar”; em português, a forma tradicional é “Nabucodonosor”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como “obras de cerco” ou “rampa de cerco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 'No'
  rationale: A sequência narrativa introduz a data e o acontecimento. Em português, iniciar diretamente com a expressão temporal evita o arcaísmo de “e aconteceu que” sem perder a progressão do relato.
- source_word: בַשָּׁנָה הַתְּשִׁעִית לְמָלְכוֹ
  choice: no nono ano do reinado dele
  rationale: Reproduz a fórmula de datação régia em português corrente e mantém a referência pronominal ao rei mencionado no contexto anterior.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo mês, no décimo dia do mês
  rationale: Mantém o sistema de datação do hebraico sem introduzir um nome de mês ausente do texto.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida; uma nota registra que a grafia hebraica deste versículo corresponde mais diretamente a outra transliteração.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e natural do título seguido do nome territorial.
- source_word: בָּא ... הוּא וְכָל חֵילוֹ עַל יְרוּשָׁלַםִ
  choice: veio contra Jerusalém com todo o seu exército
  rationale: “Contra” expressa o movimento militar hostil indicado por עַל; “com todo o seu exército” comunica naturalmente a presença conjunta do rei e de suas forças.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: acamparam diante da cidade
  rationale: O plural abrange o rei e seu exército. “Diante da cidade” evita a repetição ambígua de pronomes e expressa a posição hostil junto a Jerusalém.
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: construíram ao redor dela uma muralha de cerco
  rationale: Apresenta דָּיֵק de modo concreto e compreensível, enquanto “ao redor dela” preserva explicitamente a ideia de cerco completo em סָבִיב.
