base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: pt
  text: 'E sua provisão[a], uma provisão contínua, lhe era dada pelo rei da Babilônia: uma porção diária, dia após dia, até o dia de sua morte, todos os dias de sua vida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ração”, “sustento” ou “porção”. O termo hebraico אֲרֻחָה refere-se aqui à manutenção destinada pelo rei a Joaquim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: provisão
  rationale: No contexto, o substantivo designa o sustento atribuído pelo rei a Joaquim, não apenas uma refeição. “Provisão” é natural em português e abrange a ideia de manutenção concedida.
- source_word: תָּמִיד
  choice: contínua
  rationale: Expressa a regularidade persistente da provisão e preserva a repetição enfática do substantivo no hebraico.
- source_word: נִתְּנָה
  choice: lhe era dada
  rationale: Mantém a voz passiva do hebraico e o aspecto de concessão regular sugerido pelo contexto.
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: pelo rei da Babilônia
  rationale: Em português, a construção passiva pede naturalmente o agente com “por”; ainda comunica que a provisão procedia do rei.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: a porção de cada dia no seu devido dia
  rationale: Torna explícito o valor distributivo do idioma hebraico e conserva sua ênfase temporal sem produzir uma frase obscura.
- source_word: עַד יוֹם מוֹתוֹ
  choice: até o dia de sua morte
  rationale: Reproduz de perto a construção hebraica e preserva sua cadência solene.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: durante todos os dias de sua vida
  rationale: Representa com transparência o idioma hebraico e funciona naturalmente como expressão de duração em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição “provisão... provisão” e as expressões temporais extensas foram mantidas para preservar a ênfase e a cadência do hebraico.
