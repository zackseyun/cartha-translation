base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: pt
  text: Sobre ele havia um capitel de bronze, e a altura de um dos capitéis era de cinco côvados. Havia uma obra de treliça[a] e romãs[b] ao redor do capitel; tudo era de bronze. O segundo pilar tinha ornamentos semelhantes, com romãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma rede”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ornamentos em forma de romã.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: capitel
  rationale: No contexto arquitetônico, designa a parte ornamental superior de uma coluna; “capitel” é o termo português preciso e corrente.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O sufixo masculino singular retoma o pilar mencionado no contexto anterior e mantém a relação espacial do hebraico.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos utensílios e elementos arquitetônicos do templo, o termo provavelmente designa bronze, tradução historicamente mais adequada do que “latão”.
- source_word: קוֹמַת הַכֹּתֶרֶת הָאַחַת
  choice: a altura de um dos capitéis
  rationale: Expressa a dimensão vertical e distingue um dos dois capitéis sem introduzir a ideia não explícita de “primeiro”.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Conserva a unidade antiga empregada no texto-fonte, sem impor uma conversão moderna inexata.
- source_word: שְׂבָכָה
  choice: obra de treliça
  rationale: Representa uma estrutura ornamental vazada, semelhante a uma rede; a nota registra a alternativa lexical mais literal.
- source_word: רִמּוֹנִים
  choice: romãs
  rationale: Mantém a imagem concreta do hebraico; no contexto, são ornamentos em forma de romã.
- source_word: סָבִיב
  choice: rodeavam
  rationale: Integra de modo natural em português a ideia de disposição ao redor do capitel.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: tudo era de bronze
  rationale: Resume claramente que os elementos ornamentais mencionados eram feitos de bronze.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  choice: o segundo pilar tinha ornamentos semelhantes
  rationale: Explicita com moderação a construção elíptica hebraica, indicando que o segundo pilar possuía decoração correspondente.
