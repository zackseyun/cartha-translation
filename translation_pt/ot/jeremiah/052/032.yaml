  yaml_path: translation/ot/jeremiah/052/032.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a].
translation:
  language: pt
  text: Falou com ele com bondade[a] e colocou o trono dele acima dos tronos dos reis que estavam com ele na Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou-lhe coisas boas”, isto é, falou com ele de modo favorável ou bondoso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ
  choice: Falou com ele
  rationale: דבר com אֵת significa normalmente falar com alguém; esta formulação é natural e fiel em português.
- source_word: טֹבוֹת
  choice: com bondade
  rationale: O plural feminino é usado adverbialmente e indica uma maneira favorável ou bondosa de falar. A expressão preserva o sentido sem sugerir apenas palavras formalmente boas.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: colocou o trono dele
  rationale: Neste contexto de corte, נתן com 'trono' descreve a atribuição ou colocação da posição régia; 'colocou' mantém a imagem concreta.
- source_word: כִּסְאוֹ
  choice: o trono dele
  rationale: Embora כִּסֵּא também possa significar 'assento', a referência a reis e hierarquia favorece 'trono'. A forma 'dele' evita a possível ambiguidade de 'seu' em português.
- source_word: מִמַּעַל לְכִסֵּא מלכים
  choice: acima dos tronos dos reis
  rationale: A expressão comunica superioridade de posição ou categoria entre reis e conserva a imagem espacial do hebraico.
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: que estavam com ele na Babilônia
  rationale: A oração relativa identifica os reis presentes com o governante babilônico na Babilônia.
