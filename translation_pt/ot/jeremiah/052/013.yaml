base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: pt
  text: Ele incendiou a casa de Yahweh[a], a casa do rei[b] e todas as casas de Jerusalém; queimou com fogo toda casa grande[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo de Yahweh”. O hebraico diz literalmente “a casa de Yahweh”. Tradicionalmente, o nome divino também é representado por “SENHOR”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o palácio do rei”. O hebraico diz literalmente “a casa do rei”.
    reason: lexical_alternative
  - marker: c
    text: Ou “toda casa importante”. A expressão hebraica também pode indicar cada casa ampla ou destacada.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Ele incendiou
  rationale: O wayyiqtol de שׂרף dá continuidade à narrativa. “Incendiou” expressa de modo natural o ato de atear fogo, enquanto a repetição posterior com “queimou no fogo” preserva a ênfase hebraica.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém literalmente a expressão hebraica “casa de YHWH” e verte o nome divino como Yahweh; “templo” é uma explicitação possível, indicada em nota.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Preserva o paralelo retórico entre as ocorrências de בֵּית. No contexto, trata-se do palácio, alternativa esclarecida em nota.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: todas as casas de Jerusalém
  rationale: Reproduz naturalmente o plural e a relação genitiva do hebraico, abrangendo as casas situadas na cidade.
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: toda casa grande
  rationale: O singular com כָּל tem valor distributivo. “Grande” preserva a amplitude semântica de גָּדוֹל, que pode indicar tamanho ou importância.
- source_word: שָׂרַף בָּאֵשׁ
  choice: ele queimou no fogo
  rationale: Conserva a repetição enfática do verbo “queimar” acompanhado de “fogo”, em vez de reduzi-la simplesmente a “destruiu” ou “queimou completamente”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal divino sem substituí-lo por um título; a forma tradicional com “SENHOR” é registrada como alternativa na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem mantém a cadência enumerativa do hebraico, e o ponto e vírgula destaca a retomada enfática final.
