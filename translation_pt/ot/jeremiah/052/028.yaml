  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
translation:
  language: pt
  text: 'Este é o povo que Nabucodonosor levou para o exílio[a]: no sétimo ano, 3.023 judeus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exilou” ou “deportou”.
    reason: lexical_alternative
  - marker: b
    text: Ou “judaítas”, isto é, pessoas do reino de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: Este é o povo
  rationale: Preserva a forma coletiva singular do hebraico e introduz naturalmente o total de pessoas deportadas.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português, com referência a pessoas.
- source_word: הֶגְלָה
  choice: levou para o exílio
  rationale: O hifil de גלה indica fazer alguém ir para o exílio; a expressão comunica tanto o deslocamento quanto seu caráter forçado, sem recorrer a linguagem arcaica.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome do rei babilônico em português.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: no sétimo ano
  rationale: O cardinal hebraico tem valor ordinal no contexto; esta é a formulação idiomática em português.
- source_word: יְהוּדִים
  choice: judeus
  rationale: Forma corrente e imediatamente compreensível em português; no contexto histórico, designa as pessoas de Judá, sentido esclarecido em nota.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: '3.023'
  rationale: O número hebraico é aditivo e inequívoco; algarismos favorecem a leitura desta relação numérica, usando o separador de milhar convencional em português.
