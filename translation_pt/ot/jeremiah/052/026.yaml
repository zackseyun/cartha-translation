base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: pt
  text: Nebuzaradã, comandante da guarda[b], tomou-os e os levou[a] ao rei da Babilônia, em Ribla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conduziu”. Neste contexto, o verbo hebraico pode ser traduzido por “levou” ou “conduziu”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “chefe dos abatedores”. Neste contexto, o título designa o comandante da guarda real e talvez inclua a responsabilidade por execuções.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou-os
  rationale: O verbo לקח significa normalmente “tomar” nesta sequência narrativa. A tradução direta preserva o sentido sem acrescentar a ideia mais forte de “capturar” ou “prender”.
- source_word: אוֹתָם
  choice: -os
  rationale: O pronome de objeto direto retoma os oficiais mencionados no versículo anterior.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Transliteração portuguesa corrente do nome próprio, com acentuação natural para leitores lusófonos.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Embora a expressão signifique literalmente “chefe dos abatedores”, no contexto da corte ela designa o comandante da guarda real, possivelmente também responsável por execuções.
- source_word: וַיֹּלֶךְ
  choice: levou
  rationale: A forma causativa de הלך, com objeto e destino, expressa fazer alguém ir; “levou” é natural em português e mantém aberta a possibilidade contextual de “conduziu”.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: A preposição אֶל indica diretamente movimento em direção ao rei; não é necessário interpretar a expressão como “à presença do rei”.
- source_word: רִבְלָתָה
  choice: em Ribla
  rationale: O sufixo direcional pode indicar movimento para Ribla, mas, no contexto, a expressão identifica naturalmente o local onde estava o rei da Babilônia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “tomou-os” e “levou” mantém fluidez narrativa sem perder a concisão do hebraico; “comandante da guarda” comunica a função cortesã sem o efeito enganoso de uma tradução excessivamente literal.
