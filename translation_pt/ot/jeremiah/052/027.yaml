  text: וַ/יַּכֶּ֣ה אוֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: pt
  text: E o rei da Babilônia os feriu e os matou em Ribla, na terra de Hamate. Assim, Judá foi levado de sua terra para o exílio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֶּה אוֹתָם
  choice: os feriu
  rationale: Mantém a ação violenta de נכה distinta do verbo seguinte, que declara explicitamente a morte, sem recorrer ao arcaísmo “feriu-os de morte”.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Reproduz de modo claro e natural a relação construta hebraica.
- source_word: וַיְמִתֵם
  choice: e os matou
  rationale: Expressa o causativo de מות em português corrente. “Mandou executá-los” acrescentaria a ideia de procedimento formal ou de execução por intermediários, que o hebraico não explicita.
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: em Ribla, na terra de Hamate
  rationale: Conserva os nomes geográficos e a relação locativa do texto hebraico em formulação portuguesa natural.
- source_word: וַיִּגֶל יְהוּדָה
  choice: Judá foi levado para o exílio
  rationale: Embora a forma verbal hebraica seja ativa, o contexto é de deportação forçada; a construção passiva comunica naturalmente esse resultado sem transformar “Judá” em “o povo de Judá”.
- source_word: מֵעַל אַדְמָתוֹ
  choice: para longe de sua terra
  rationale: Representa a separação indicada por מֵעַל e o sentido territorial de אֲדָמָה. O possessivo português “sua” refere-se naturalmente a Judá sem precisar reproduzir o gênero gramatical masculino do sufixo hebraico.
theological_decisions:
- issue: O referente coletivo e o sufixo masculino singular em מֵעַל אַדְמָתוֹ
  choice: de sua terra
  alternative: da terra dele
  rationale: “Judá” permanece como nome coletivo, conforme o hebraico. Em português, “sua terra” é idiomático e preserva a referência sem impor ao leitor uma personificação masculina que a forma do possessivo português não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição verbal “os feriu e os matou” preserva a sequência do hebraico; “terra de Hamate” mantém o registro geográfico bíblico tradicional sem soar arcaico.
