source:
  edition: WLC
  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֣י הַ/מִּלְחָמָ֡ה יִבְרְחוּ֩ וַ/יֵּצְא֨וּ מֵ/הָ/עִ֜יר לַ֗יְלָה דֶּ֜רֶךְ שַׁ֤עַר בֵּין הַ/חֹמֹתַ֨יִם֙ אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּלְכ֖וּ דֶּ֥רֶךְ הָ/עֲרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: pt
  text: Então abriu-se uma brecha na cidade, e todos os homens de guerra fugiram. Durante a noite, saíram da cidade pelo portão entre as duas muralhas, junto ao jardim do rei, enquanto os caldeus[a] estavam ao redor da cidade por todos os lados. E seguiram pelo caminho da Arabá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Caldeus” é o termo étnico hebraico frequentemente usado para designar as forças babilônicas.
    reason: cultural_note
  - marker: b
    text: A “Arabá” é a região do vale tectônico do Jordão; algumas traduções trazem “a planície”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: abriu-se uma brecha na cidade
  rationale: Reproduz o valor passivo/intransitivo do nifal e comunica com naturalidade o rompimento das defesas durante o cerco, sem explicitar além do hebraico quem abriu a brecha.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Mantém a expressão masculina e militar do hebraico; é formal, mas clara em português atual.
- source_word: יִבְרְחוּ
  choice: fugiram
  rationale: Embora a forma seja morfologicamente imperfeita, a sequência narrativa exige aqui um acontecimento passado.
- source_word: וַיֵּצְאוּ מֵהָעִיר לַיְלָה
  choice: Durante a noite, saíram da cidade
  rationale: Expressa de modo natural o sentido temporal de לַיְלָה e preserva a progressão narrativa.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: pelo portão entre as duas muralhas
  rationale: Em português, “pelo portão” comunica naturalmente a rota indicada por דֶּרֶךְ; “duas muralhas” preserva o dual hebraico.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: junto ao jardim do rei
  rationale: O contexto pede o sentido locativo de עַל, indicando proximidade, não posição sobre o jardim.
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: enquanto os caldeus cercavam a cidade por todos os lados
  rationale: “Enquanto” torna clara a circunstância simultânea; “por todos os lados” expressa סָבִיב, e “caldeus” conserva o termo étnico-histórico.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: seguiram pelo caminho da Arabá
  rationale: Conserva דֶּרֶךְ como indicação de rota e translitera o nome da região geográfica em vez de reduzi-lo genericamente a “planície”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente segmentada para clareza narrativa, sem alterar a sequência dos acontecimentos. Mantiveram-se “homens de guerra”, “caldeus” e “Arabá” para preservar o caráter histórico e lexical do texto.
