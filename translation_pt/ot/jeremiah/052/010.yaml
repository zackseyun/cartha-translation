  text: וַ/יִּשְׁחַ֧ט מֶֽלֶךְ בָּבֶ֛ל אֶת בְּנֵ֥י צִדְקִיָּ֖הוּ לְ/עֵינָ֑י/ו וְ/גַ֛ם אֶת כָּל שָׂרֵ֥י יְהוּדָ֖ה שָׁחַ֥ט בְּ/רִבְלָֽתָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: pt
  text: Então, o rei da Babilônia degolou os filhos de Zedequias diante dos olhos de Zedequias e também degolou todos os oficiais de Judá[a] em Ribla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os príncipes de Judá”. O termo hebraico שָׂרֵי pode designar governantes, oficiais ou príncipes de alta posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Então ... degolou
  rationale: O verbo שׁחט denota abater ou degolar e, neste contexto de execução, comunica a violência do ato com mais precisão que o genérico “matou”. “Então” expressa naturalmente a progressão narrativa do waw consecutivo.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Reproduz de modo claro e natural a relação construta do hebraico.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: os filhos de Zedequias
  rationale: בְּנֵי especifica os filhos homens, não apenas descendentes ou crianças em geral.
- source_word: לְעֵינָיו
  choice: diante dos olhos dele
  rationale: Preserva a imagem vívida do hebraico e deixa claro que Zedequias presenciou a execução.
- source_word: וְגַם
  choice: e também
  rationale: Mantém a força aditiva da expressão hebraica.
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: todos os oficiais de Judá
  rationale: שָׂרֵי designa pessoas de alta posição governamental ou militar; “oficiais” é amplo, atual e não sugere necessariamente linhagem real.
- source_word: שָׁחַט
  choice: degolou
  rationale: A repetição preserva tanto a repetição lexical hebraica quanto a brutalidade dos atos.
- source_word: בְּרִבְלָתָה
  choice: em Ribla
  rationale: Forma locativa natural em português para indicar o lugar das execuções.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural e leitura ampla no contexto brasileiro. “Degolou” conserva a força concreta e violenta de שׁחט; “diante dos olhos dele” evita ambiguidade pronominal em português. O marcador foi colocado após “Ribla” porque a nota explica “oficiais de Judá” no conjunto da oração.
