source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: pt
  text: Da cidade, ele levou um oficial da corte que estava encarregado dos homens de guerra, sete homens dentre os que viam a face do rei[a] e que foram encontrados na cidade, o escriba do comandante do exército, que convocava o povo da terra para o serviço militar, e sessenta homens do povo da terra que foram encontrados dentro da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os assistentes pessoais do rei”, pois “ver a face do rei” é uma expressão da corte para ter acesso direto a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: oficial da corte
  rationale: O termo pode designar um eunuco ou, de modo mais amplo, um oficial da corte. O contexto destaca a função administrativa e militar, sem exigir uma afirmação sobre a condição física do homem.
- source_word: פָקִיד
  choice: encarregado
  rationale: Expressa de modo natural a autoridade delegada de alguém posto à frente de outros.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Preserva o idiomatismo hebraico e seu sentido militar em linguagem clara e digna.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: dentre os que viam a face do rei
  rationale: Mantém no texto a expressão cortesã concreta do hebraico, deixando sua explicação para a nota.
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: o escriba do comandante do exército
  rationale: Reproduz naturalmente a cadeia construta como um escriba ou secretário ligado ao comandante do exército, sem substituir o título por uma função mais específica.
- source_word: הַמַּצְבִּא
  choice: que convocava ... para o serviço militar
  rationale: Explicita em português corrente o sentido causativo militar de reunir, alistar ou mobilizar pessoas, sem afirmar que o processo era necessariamente recrutamento compulsório.
- source_word: עַם הָאָרֶץ
  choice: povo da terra
  rationale: Conserva a expressão hebraica e sua possível nuance sociopolítica, evitando reduzi-la a 'povo comum'.
- source_word: בְּתוֹךְ הָעִיר
  choice: dentro da cidade
  rationale: É uma formulação natural em português e mantém a ênfase locativa.
