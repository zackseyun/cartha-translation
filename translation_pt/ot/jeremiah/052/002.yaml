source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: pt
  text: E ele fez o que era mau aos olhos de Yahweh[a], conforme tudo o que Jeoaquim havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «aos olhos de Yahweh», expressão idiomática que significa «à vista de Yahweh» ou «segundo a avaliação de Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: E ele fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa; «E ele fez» preserva essa sequência sem explicitação excessiva.
- source_word: הָרַע
  choice: o que era mau
  rationale: A expressão עשה הרע é vertida de modo natural em português, evitando o literalismo pouco idiomático «fez o mal» neste contexto avaliativo.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora do idioma hebraico e continua clara em português, com o sentido de «à vista de» ou «segundo a avaliação de».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa a comparação ou conformidade entre a conduta do sujeito e tudo o que Jeoaquim fez.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece naturalmente em português que os atos de Jeoaquim precederam os do sujeito, sem alterar o sentido contextual do perfeito hebraico.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração «Yahweh» preserva o nome pessoal, sem o substituir pelo título «SENHOR» nem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se o idioma hebraico «aos olhos de» por ser compreensível em português; «conforme» comunica de modo natural a ideia de correspondência com a conduta anterior de Jeoaquim.
