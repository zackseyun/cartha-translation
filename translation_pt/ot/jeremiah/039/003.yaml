  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: pt
  text: 'Então todos os oficiais do rei da Babilônia entraram e se assentaram no Portão do Meio[a]: Nergal-Sarezer, Samgar-Nebu, Sarsequim[b], o Rab-Sáris[c], Nergal-Sarezer, o Rab-Mague[d], e todos os demais oficiais do rei da Babilônia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao Portão do Meio”. Neste contexto, a preposição hebraica pode indicar tanto o interior da área do portão quanto a posição junto a ele.
    reason: lexical_alternative
  - marker: b
    text: A sequência “Samgar-Nebu, Sarsequim” é difícil. Alguns intérpretes dividem os nomes e títulos de outra maneira, entendendo, por exemplo, “Samgar” como título ou “Sarsequim” como cargo, e não como nome pessoal.
    reason: alternative_reading
  - marker: c
    text: “Rab-Sáris” é um título babilônico, tradicionalmente entendido como algo semelhante a “chefe dos eunucos” ou “alto oficial da corte”.
    reason: cultural_note
  - marker: d
    text: “Rab-Mague” é um título babilônico, possivelmente com o sentido de “chefe dos magos” ou de alto oficial ligado a funções rituais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: entraram
  rationale: O verbo בוא, neste contexto narrativo após a invasão de Jerusalém, indica movimento para dentro da cidade. “Entraram” expressa isso com naturalidade e precisão.
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: todos os oficiais do rei da Babilônia
  rationale: שָׂרִים pode designar autoridades, chefes ou altos funcionários. “Oficiais” abrange adequadamente o contexto cortesão e militar sem restringir o grupo a príncipes ou comandantes.
- source_word: וַיֵּשְׁבוּ
  choice: se assentaram
  rationale: ישׁב significa literalmente sentar-se ou permanecer. Aqui descreve os oficiais tomando posição na área do portão; “se assentaram” preserva a imagem sem explicitar além do texto a ideia de exercer autoridade.
- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: no Portão do Meio
  rationale: A expressão significa literalmente “no portão do meio” e provavelmente funciona como designação de um local específico de Jerusalém. A inicial maiúscula sinaliza esse uso toponímico.
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Sarezer
  rationale: Nome pessoal babilônico transliterado em forma legível e compatível com convenções correntes em português.
- source_word: סַמְגַּר נְבוּ
  choice: Samgar-Nebu
  rationale: A sequência consonantal é mantida como nome transliterado. Como a divisão dos nomes e títulos nesta parte do versículo é incerta, a dificuldade é registrada em nota.
- source_word: שַׂר סְכִים
  choice: Sarsequim
  rationale: A vocalização massorética permite tratá-lo como nome próprio na lista. A transliteração evita transformar com excessiva certeza a expressão em título ou cargo.
- source_word: רַב סָרִיס
  choice: Rab-Sáris
  rationale: Título babilônico de origem acádica. A transliteração preserva o cargo antigo sem impor “chefe dos eunucos”, interpretação possível, mas potencialmente estreita demais.
- source_word: רַב מָג
  choice: Rab-Mague
  rationale: Título babilônico provavelmente ligado a uma alta função ritual ou erudita. A transliteração evita introduzir no texto principal associações posteriores ligadas aos magos.
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: e todos os demais oficiais do rei da Babilônia
  rationale: שְׁאֵרִית indica o restante. “Todos os demais oficiais” é natural em português e se refere aos que não foram citados individualmente.
