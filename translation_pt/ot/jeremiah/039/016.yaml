  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: pt
  text: 'Vá e diga a Ebede-Meleque, o cuxita[a]: “Assim diz Yahweh dos Exércitos, o Deus de Israel: Eis que farei cumprir contra esta cidade as minhas palavras, para a desgraça e não para o bem[b]; naquele dia, elas se cumprirão diante dos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o etíope”. O hebraico diz “o cuxita”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o desastre e não para o bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Vá e diga
  rationale: A construção com infinitivo absoluto reforça a ordem; esta formulação comunica sua força de maneira natural em português.
- source_word: לְעֶבֶד מֶלֶךְ
  choice: a Ebede-Meleque
  rationale: O contexto indica um nome próprio, aqui transliterado e adaptado à ortografia portuguesa.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Reproduz diretamente o gentílico hebraico ligado a Cuxe, sem identificá-lo de modo impreciso com uma geografia posterior.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional, precisa e natural em registro bíblico português.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por uma expressão portuguesa clara, capaz de abranger as forças sob seu comando.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: הִנְנִי מֵבִיא אֶת־דְּבָרַי
  choice: Eis que farei cumprir ... as minhas palavras
  rationale: הִנְנִי mantém a solenidade e a iminência; o causativo de בוא, aplicado às palavras anunciadas, exprime que Yahweh fará com que elas se concretizem.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: contra esta cidade
  rationale: No contexto de juízo, אֶל indica a direção hostil das palavras contra a cidade.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: para a desgraça e não para o bem
  rationale: רָעָה aqui designa calamidade ou desgraça, não maldade moral; a formulação conserva o contraste explícito com טוֹבָה.
- source_word: וְהָיוּ לְפָנֶיךָ בַּיּוֹם הַהוּא
  choice: naquele dia, elas se cumprirão diante dos seus olhos
  rationale: A expressão literalmente diz que as palavras estarão diante dele; no contexto, isso significa que os eventos anunciados se realizarão em sua presença. “Diante dos seus olhos” conserva a dimensão de testemunho pessoal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. A transliteração “Yahweh” o preserva, em vez de substituí-lo por um título; “Jeová” reflete uma forma híbrida posterior.
- issue: Sentido de רָעָה no anúncio de juízo
  choice: desgraça
  alternative: mal; dano; desastre
  rationale: O termo descreve a calamidade que sobrevém à cidade, e não atribui maldade moral a Deus. “Desgraça” preserva essa distinção sem atenuar o juízo.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento naturais à leitura brasileira e inteligíveis internacionalmente. Conserva fórmulas proféticas reconhecíveis sem arcaísmo excessivo. Todos os marcadores de nota aparecem no texto.
