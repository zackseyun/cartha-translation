  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: pt
  text: Mas Nebuzaradã, comandante da guarda, deixou na terra de Judá alguns dos mais pobres do povo, que não tinham coisa alguma; naquele dia, deu-lhes vinhedos e campos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “cisternas” ou “lagares”; o sentido da palavra hebraica é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: Mas ... alguns dos mais pobres do povo
  rationale: A conjunção admite valor contrastivo no contexto, enquanto מִן tem força partitiva. A formulação comunica naturalmente que Nebuzaradã deixou uma parte da população pobre.
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: que não tinham coisa alguma
  rationale: Preserva a ênfase na completa falta de bens em português claro e digno.
- source_word: הִשְׁאִיר
  choice: deixou
  rationale: O hifil de שׁאר indica que ele fez com que essas pessoas permanecessem, isto é, deixou-as no território.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Transliteração consagrada e natural em português do nome próprio hebraico.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Traduz funcionalmente o título oficial babilônico sem sugerir de modo indevidamente específico açougueiros ou executores.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Mantém explicitamente o sentido territorial de אֶרֶץ.
- source_word: וַיִּתֵּן לָהֶם
  choice: deu-lhes
  rationale: Reproduz de maneira concisa e natural a sequência narrativa hebraica.
- source_word: כְּרָמִים
  choice: vinhedos
  rationale: Equivalente direto do substantivo que designa plantações de videiras.
- source_word: וִיגֵבִים
  choice: campos
  rationale: No contexto de bens agrícolas concedidos aos pobres, “campos” é uma interpretação contextual plausível, embora o termo hebraico seja raro e incerto; as alternativas são registradas em nota.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal corrente que corresponde diretamente ao hebraico.
