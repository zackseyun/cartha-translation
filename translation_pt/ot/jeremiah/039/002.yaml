base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/002.yaml
  text: In the eleventh year of Zedekiah[a], in the fourth month, on the ninth day of the month, the city was breached.
translation:
  language: pt
  text: No décimo primeiro ano de Zedequias, no quarto mês, no nono dia do mês[a], foi aberta uma brecha na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “no nono do mês”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: No décimo primeiro ano
  rationale: A preposição בְּ introduz o marco temporal; esta é a formulação natural em português para a datação por ano de reinado.
- source_word: לְ/צִדְקִיָּהוּ
  choice: de Zedequias
  rationale: O לְ relaciona o ano ao reinado de Zedequias; a forma tradicional portuguesa do nome é clara e amplamente reconhecida.
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: no quarto mês
  rationale: Mantém a numeração do mês presente no hebraico, sem convertê-la para um calendário moderno.
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: no nono dia do mês
  rationale: A construção indica o dia dentro do mês; “dia” é explicitado naturalmente em português, embora esteja implícito no hebraico.
- source_word: הָבְקְעָה
  choice: foi invadida por uma brecha
  rationale: O nifal de בקע indica que se abriu uma brecha nas defesas, possibilitando a entrada na cidade. A formulação evita a impressão pouco natural de que a cidade inteira, em vez de suas muralhas, foi literalmente rachada.
- source_word: הָ/עִיר
  choice: a cidade
  rationale: Conserva a designação definida do texto hebraico; no contexto, o referente é Jerusalém.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A datação régia e a numeração do mês foram preservadas; a expressão militar explicita de modo idiomático a abertura de uma brecha sem acrescentar o nome de Jerusalém ao texto principal.
