base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: pt
  text: 'Nabucodonosor, rei da Babilônia, deu ordens a respeito de Jeremias por meio de Nebuzaradã, comandante da guarda[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos executores”; literalmente, “chefe dos matadores” ou “dos açougueiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu ordens
  rationale: O verbo צוה expressa uma ordem ou mandamento. “Deu ordens” é natural em português e introduz adequadamente o conteúdo da ordem no versículo seguinte.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome real em português, embora a grafia hebraica deste trecho corresponda mais de perto a “Nabucodonosor/Nabucodrétsar” em diferentes sistemas de transliteração.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta da cadeia construta que identifica o título e o domínio do rei.
- source_word: עַל יִרְמְיָהוּ
  choice: a respeito de Jeremias
  rationale: Com צוה, a preposição עַל indica a pessoa sobre a qual recaem as instruções, sem sugerir que Jeremias seja o destinatário direto.
- source_word: בְּיַד
  choice: por meio de
  rationale: A expressão idiomática “pela mão de” marca agência ou mediação; “por meio de” comunica isso com clareza no português atual.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Forma aportuguesada tradicional e reconhecível do nome próprio.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: No contexto régio-militar, o título designa o oficial responsável pela guarda real e por execuções. A tradução literal e a alternativa funcional são registradas em nota.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Infinitivo de citação que introduz o conteúdo da ordem no versículo seguinte; “dizendo” preserva a ligação narrativa formal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem artificialidade. O waw narrativo inicial não foi ampliado com um advérbio temporal como “então” ou “ora”. O sinal de dois-pontos deixa claro que “dizendo” introduz a ordem apresentada no versículo seguinte.
