base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: pt
  text: No nono ano de Zedequias, rei de Judá, no décimo mês, Nabucodonosor[a], rei da Babilônia, veio a Jerusalém com todo o seu exército, e eles a sitiaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Nebucadrezar”; a forma tradicional portuguesa “Nabucodonosor” foi mantida no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית
  choice: No nono ano
  rationale: Expressa de modo natural em português a fórmula hebraica de datação.
- source_word: לְצִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: de Zedequias, rei de Judá
  rationale: Mantém a relação cronológica e o título real do texto hebraico.
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: no décimo mês
  rationale: Equivalente formal e idiomático da segunda indicação temporal.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Adota a forma portuguesa tradicional e amplamente reconhecida; a forma mais próxima da grafia hebraica deste versículo é registrada em nota.
- source_word: וְכָל חֵילוֹ
  choice: com todo o seu exército
  rationale: Neste contexto militar, חַיִל designa o exército; a preposição 'com' comunica naturalmente o acompanhamento implícito na coordenação hebraica.
- source_word: אֶל יְרוּשָׁלִַם
  choice: a Jerusalém
  rationale: Preserva o sentido básico de movimento em direção à cidade, sem antecipar na preposição a hostilidade explicitada pelo verbo seguinte.
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: e eles a sitiaram
  rationale: O verbo צור neste contexto significa cercar militarmente ou sitiar; o pronome plural retém a referência natural ao rei acompanhado de seu exército.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade à estrutura hebraica. A repetição das duas indicações cronológicas foi preservada.
