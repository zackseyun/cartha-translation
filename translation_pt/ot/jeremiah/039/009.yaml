reference: Jeremiah 39:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: pt
  text: Nebuzaradã, comandante da guarda[c], levou para o exílio na Babilônia o restante do povo que tinha ficado na cidade, os desertores que haviam passado para o lado dele[a] e o restante do povo que tinha ficado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que haviam desertado para o lado dele”. O idioma hebraico diz literalmente “os que caíram para ele”, expressão militar usada para passar ao lado adversário.
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete “o restante do povo que tinha ficado”. A repetição foi mantida, em vez de ser simplificada.
    reason: lexical_alternative
  - marker: c
    text: “Comandante da guarda” traduz um título cujo sentido literal está relacionado ao “chefe dos matadores”; tratava-se de um cargo oficial da corte e do exército babilônicos.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: o restante do povo
  rationale: Expressa de modo natural o grupo que restou, sem restringi-lo indevidamente aos sobreviventes.
- source_word: הַנִּשְׁאָרִים בָּעִיר
  choice: que tinha ficado na cidade
  rationale: Reproduz o sentido do particípio de שׁאר e da expressão locativa com português corrente.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: os desertores que haviam passado para o lado dele
  rationale: Torna explícito o sentido militar e político do idioma hebraico, literalmente relacionado a ‘cair para junto de’ alguém. O pronome ‘dele’ preserva a referência masculina sem identificar além do que o contexto permite.
- source_word: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: e o restante do povo que tinha ficado
  rationale: Mantém a repetição presente no hebraico em vez de condensar os grupos.
- source_word: הֶגְלָה
  choice: levou para o exílio
  rationale: Comunica a ação causativa de conduzir à deportação sem o tom excessivamente administrativo de ‘deportou’.
- source_word: נְבוּזַר אֲדָן
  choice: Nebuzaradã
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio babilônico.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Equivalente funcional do cargo oficial babilônico; evita a tradução literal enganosa ‘chefe dos matadores’.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa convencional do topônimo.
theological_decisions: []
