  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר רָ֠אָ/ם צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כֹ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַֽ֠/יִּבְרְחוּ וַ/יֵּצְא֨וּ לַ֤יְלָה מִן הָ/עִיר֙ דֶּ֚רֶךְ גַּ֣ן הַ/מֶּ֔לֶךְ בְּ/שַׁ֖עַר בֵּ֣ין הַ/חֹמֹתָ֑יִם וַ/יֵּצֵ֖א דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: pt
  text: Quando Zedequias, rei de Judá, e todos os homens de guerra os viram, fugiram e saíram da cidade durante a noite, pelo caminho do jardim do rei, atravessando o portão entre as duas muralhas; e ele saiu[a] pelo caminho da Arabá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz aqui o singular “ele saiu”; algumas traduções empregam “eles saíram” para harmonizar a frase com os verbos anteriores no plural.
    reason: Preservar a mudança gramatical do plural para o singular no texto hebraico.
  - marker: b
    text: Ou “a planície” ou “o vale do Jordão”.
    reason: Registrar traduções possíveis do termo geográfico hebraico Arabá.
lexical_decisions:
- source_word: רָאָם
  choice: os viram
  rationale: 'O sufixo pronominal masculino plural explicita o objeto: as forças babilônicas mencionadas no contexto anterior.'
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Mantém de modo claro e relativamente formal a expressão hebraica que designa os combatentes.
- source_word: וַיִּבְרְחוּ
  choice: fugiram
  rationale: É a tradução direta e natural do verbo ברח no contexto narrativo.
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: saíram da cidade durante a noite
  rationale: Expressa com naturalidade em português o momento da saída e incorpora o complemento מן העיר.
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: pelo caminho do jardim do rei
  rationale: Preserva o valor de דֶּרֶךְ como indicação de rota sem determinar indevidamente se passaram por dentro ou ao lado do jardim.
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: atravessando o portão entre as duas muralhas
  rationale: O movimento de saída favorece “atravessando”, e o dual חֹמֹתַיִם é representado explicitamente por “duas muralhas”.
- source_word: וַיֵּצֵא
  choice: ele saiu
  rationale: Preserva a mudança do plural para o singular presente no Texto Massorético, sem harmonizá-la silenciosamente.
- source_word: הָעֲרָבָה
  choice: a Arabá
  rationale: Mantém o provável nome geográfico da região, em vez de reduzi-lo ao sentido genérico de planície.
