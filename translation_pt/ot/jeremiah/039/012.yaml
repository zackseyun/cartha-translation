base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: pt
  text: — Leve-o, mantenha os olhos nele e não lhe faça mal algum; antes, faça com ele como ele lhe disser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: Leve-o
  rationale: O imperativo de לָקַח com sufixo pode significar tomar, buscar ou levar alguém; no contexto de uma ordem sobre o tratamento de Jeremias, «Leve-o» é natural e preserva o sentido diretivo.
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: mantenha os olhos sobre ele
  rationale: A expressão hebraica pede atenção vigilante e cuidadosa. A formulação mantém a imagem corporal do original sem explicitar apenas proteção.
- source_word: וְאַל־תַּעַשׂ לוֹ מְאוּמָה רָע
  choice: e não lhe faça mal algum
  rationale: Reproduz de modo idiomático a proibição enfática de fazer a ele qualquer coisa má.
- source_word: כִּי אִם
  choice: antes
  rationale: Neste contraste após uma proibição, a locução introduz a instrução positiva em oposição ao dano proibido.
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ כֵּן עֲשֵׂה עִמּוֹ
  choice: faça com ele exatamente o que ele lhe disser
  rationale: Preserva a correlação «conforme... assim» por meio de «exatamente o que» e mantém Jeremias como aquele que comunicará o tratamento desejado.
