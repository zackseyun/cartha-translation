  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: pt
  text: Mas eu o livrarei[a] naquele dia — declara Yahweh — e você não será entregue nas mãos[b] dos homens de quem tem medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resgatarei” ou “salvarei”. O verbo hebraico pode indicar tirar alguém de uma situação de perigo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na mão dos homens”; a expressão indica ficar sob o poder deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Mas eu o livrarei
  rationale: O hifil de נצל expressa livrar ou resgatar alguém do perigo. “Livrarei” preserva esse sentido concreto sem lhe impor uma conotação teológica adicional. A conjunção וְ é vertida como “Mas” por seu valor adversativo no contexto.
- source_word: בַיּוֹם הַהוּא
  choice: naquele dia
  rationale: Forma temporal natural em português para a expressão hebraica.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” comunica com dignidade a fórmula profética נְאֻם, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: וְלֹא תִנָּתֵן
  choice: e você não será entregue
  rationale: O nifal de נתן é passivo e, neste contexto, descreve ser entregue ao poder de adversários.
- source_word: בְּיַד
  choice: nas mãos
  rationale: O singular hebraico “na mão de” é uma expressão de domínio ou controle. O plural idiomático “nas mãos de” soa natural em português e mantém a imagem corporal.
- source_word: הָאֲנָשִׁים
  choice: dos homens
  rationale: O substantivo masculino plural se refere a homens específicos no contexto.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: de quem tem medo
  rationale: גור com מִפְּנֵי expressa temor ou pavor diante de alguém. A formulação é clara e natural, sem enfraquecer o sentido.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama diretamente; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Usa “você” para explicitar o destinatário singular e “o” como objeto masculino, de acordo com o referente contextual. A ordem e a tensão do hebraico são preservadas, enquanto “nas mãos” verte naturalmente o idioma hebraico de domínio.
