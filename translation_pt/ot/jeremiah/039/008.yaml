  text: וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: pt
  text: Os caldeus[a] queimaram o palácio[b] e as casas do povo e derrubaram as muralhas de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Caldeus” refere-se aqui às forças babilônicas.
    reason: cultural_note
  - marker: b
    text: Literalmente, “a casa do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: o palácio
  rationale: Embora a expressão signifique literalmente “a casa do rei”, no contexto régio designa naturalmente o palácio; essa forma é clara e corrente em português.
- source_word: בֵּית הָעָם
  choice: as casas do povo
  rationale: O singular hebraico com o coletivo “povo” tem sentido distributivo no contexto da destruição da cidade, referindo-se às moradias da população.
- source_word: שָׂרְפוּ
  choice: queimaram
  rationale: Tradução direta e natural do verbo hebraico, sem acrescentar a ideia de destruição total.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o termo étnico empregado no hebraico, enquanto uma nota esclarece sua referência contextual às forças babilônicas.
- source_word: בָּאֵשׁ
  choice: incorporado em “queimaram”
  rationale: Em português, “queimaram com fogo” seria redundante; o verbo “queimar” já expressa naturalmente o meio indicado pela construção hebraica.
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” comunica com precisão as fortificações urbanas, de modo mais específico que o genérico “muros”.
- source_word: נָתָצוּ
  choice: derrubaram
  rationale: Expressa de maneira natural e vívida o desmantelamento deliberado de uma estrutura.
