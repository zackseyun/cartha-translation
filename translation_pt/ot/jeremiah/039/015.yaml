  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh havia vindo a Jeremias enquanto ele estava detido no pátio da guarda[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no átrio da guarda”.'
    reason: Alternativa lexical para חֲצַר, que pode designar um pátio ou átrio.
lexical_decisions:
- source_word: וְ/אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: A preposição אֶל marca o destinatário da revelação. A conjunção וְ introduz a nota narrativa, mas não exige um marcador temporal como “agora” em português.
- source_word: הָיָה דְבַר יְהוָה
  choice: A palavra de Yahweh havia vindo
  rationale: Preserva a fórmula profética de revelação. O mais-que-perfeito composto expressa naturalmente a anterioridade dessa palavra no relato retrospectivo.
- source_word: בִּֽ/הְיֹת֣/וֹ עָצ֔וּר
  choice: enquanto ele estava detido
  rationale: A construção infinitiva introduz uma circunstância temporal em curso. “Detido” comunica restrição sob custódia sem pressupor encarceramento em uma cela.
- source_word: בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה
  choice: no pátio da guarda
  rationale: חָצֵר designa um pátio ou recinto, e מַטָּרָה, neste contexto, refere-se à área de custódia da guarda. A expressão é clara e natural em português.
- source_word: לֵ/אמֹֽר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz a fala direta iniciada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Fórmula profética דְבַר יְהוָה
  choice: A palavra de Yahweh havia vindo
  alternative: A mensagem de Yahweh havia chegado
  rationale: “Palavra” conserva a formulação tradicional e sua densidade teológica, sem reduzir a revelação a mera informação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a fórmula profética e a construção introdutória da fala, evitando acrescentar um marcador temporal não explícito no hebraico.
