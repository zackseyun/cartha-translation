base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: pt
  text: Nebuzaradã, chefe da guarda, Nebusazbã, alto oficial[b], Nergal-Sarezer, chefe dos magos[c], e todos os altos oficiais do rei da Babilônia enviaram uma mensagem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, simplesmente, “enviaram”. O verbo hebraico está empregado aqui de forma elíptica, e o versículo seguinte prossegue relatando a ação que eles iniciaram.
    reason: lexical_alternative
  - marker: b
    text: O título também pode ser traduzido como “chefe dos eunucos” ou “alto funcionário da corte”.
    reason: lexical_alternative
  - marker: c
    text: “Chefe dos magos” traduz um título da corte babilônica, tradicionalmente transliterado como “Rab-Mague”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: deram ordens
  rationale: O verbo שׁלח significa literalmente “enviar”, mas aqui aparece de forma elíptica, e o versículo seguinte apresenta a ação resultante. “Deram ordens” produz uma frase natural em português sem especificar indevidamente quem ou o que foi enviado. O plural concorda naturalmente com a lista de autoridades que funciona como sujeito composto.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: Trata-se de um título cortesão influenciado pelo acádio, tradicionalmente entendido como o comandante da guarda real, e não de uma função culinária literal.
- source_word: רַב סָרִיס
  choice: chefe dos oficiais
  rationale: סָרִיס pode indicar tanto um eunuco como um alto funcionário da corte. A formulação mantém a função e a posição hierárquica sem afirmar como certo que o homem era eunuco.
- source_word: נְבוּשַׁזְבָּ
  choice: Nebusazbã
  rationale: Nome próprio transliterado em forma clara e adequada à ortografia portuguesa.
- source_word: וְנֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Sarezer
  rationale: A sequência constitui um nome próprio de origem babilônica; a transliteração mantém sua unidade e segue uma forma reconhecível em português.
- source_word: רַב מָג
  choice: chefe dos magos
  rationale: O título babilônico é traduzido pelo seu sentido provável, em vez de ser conservado sem tradução como “Rab-Mague”.
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: e todos os altos oficiais do rei da Babilônia
  rationale: רַבֵּי designa aqui autoridades ou cortesãos de alta posição. “Altos oficiais” comunica melhor essa categoria do que “príncipes”.
