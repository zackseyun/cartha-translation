  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: pt
  text: Mas o exército dos caldeus os perseguiu e alcançou Zedequias nas planícies de Jericó. Eles o capturaram e o levaram a Nabucodonosor, rei da Babilônia, em Ribla, na terra de Hamate; e ele pronunciou sentenças contra Zedequias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: o exército dos caldeus
  rationale: חֵיל designa aqui uma força militar, e כַּשְׂדִּים preserva o nome étnico-político do texto, em vez de substituí-lo por “babilônios”.
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: os perseguiu
  rationale: A construção expressa perseguição; a concordância no singular coletivo com “exército” é natural em português.
- source_word: וַיַּשִּׂגוּ
  choice: alcançou
  rationale: No contexto de fugitivos perseguidos, o verbo significa alcançá-los; “alcançou” é claro e atual.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: nas planícies de Jericó
  rationale: עֲרָבוֹת refere-se às planícies ou estepes da região do Jordão; “planícies” é preciso e acessível.
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: Eles o capturaram
  rationale: Embora לקח tenha o sentido básico de “tomar”, no cenário militar indica a captura de Zedequias.
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: o levaram a
  rationale: A forma causativa de עלה pode preservar uma ideia de subida, mas em português “levaram a” expressa naturalmente o deslocamento sem impor uma direção geográfica incerta ao leitor.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega-se a forma tradicional e amplamente reconhecida em português para o nome do rei; a variante gráfica do hebraico não exige nota, pois a diferença decorre da convenção de transliteração portuguesa.
- source_word: רִבְלָתָה
  choice: em Ribla
  rationale: O sufixo locativo é expresso naturalmente pela preposição “em”; o topônimo segue a forma portuguesa corrente.
- source_word: בְּאֶרֶץ חֲמָת
  choice: na terra de Hamate
  rationale: Tradução direta de אֶרֶץ, mantendo a designação geográfica do texto.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: e ali ele pronunciou sentenças contra Zedequias
  rationale: A expressão idiomática, literalmente próxima de “falou julgamentos com ele”, descreve decisões judiciais. “Pronunciou sentenças” preserva o plural מִשְׁפָּטִים; repetir “Zedequias” esclarece o referente dos pronomes, e “ali” torna explícita a relação com Ribla sem acrescentar conteúdo substantivo.
