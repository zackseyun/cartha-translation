  text: וְ/אֶת עֵינֵ֥י צִדְקִיָּ֖הוּ עִוֵּ֑ר וַ/יַּאַסְרֵ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם לָ/בִ֥יא אֹת֖/וֹ בָּבֶֽלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/007.yaml
  text: He blinded Zedekiah’s eyes and bound him with bronze shackles to bring him to Babylon[a].
translation:
  language: pt
  text: Cegou os olhos de Zedequias e o prendeu com grilhões de bronze[a], para levá-lo à Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com correntes de bronze” ou “com algemas de bronze”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ
  choice: os olhos de Zedequias
  rationale: Mantém a expressão concreta da cadeia construta hebraica e soa natural em português.
- source_word: עִוֵּר
  choice: cegou
  rationale: Verte diretamente o verbo hebraico 'tornar cego', sem acrescentar o modo pelo qual isso foi feito.
- source_word: וַיַּאַסְרֵהוּ
  choice: o prendeu
  rationale: אסר significa amarrar ou prender; com a menção explícita dos grilhões, 'prendeu' comunica naturalmente a restrição física.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: com grilhões de bronze
  rationale: O termo designa restrições metálicas; 'grilhões' é preciso, digno e compreensível, enquanto a nota preserva alternativas possíveis.
- source_word: לָבִיא אֹתוֹ
  choice: para levá-lo
  rationale: Expressa de modo natural o infinitivo hebraico de propósito e mantém o pronome objeto.
- source_word: בָּבֶלָה
  choice: à Babilônia
  rationale: O ה direcional indica movimento rumo à Babilônia; a preposição 'a' transmite esse sentido em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha de perto a sequência hebraica sem sacrificar a naturalidade; a vírgula antes da oração de propósito favorece a leitura.
