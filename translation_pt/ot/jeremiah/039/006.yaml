revisions:
- from: O rei da Babilônia massacrou os filhos de Zedequias em Ribla, diante dos olhos dele, e o rei da Babilônia massacrou todos os nobres de Judá.[a]
  to: O rei da Babilônia massacrou os filhos de Zedequias em Ribla, diante dos olhos de Zedequias, e o rei da Babilônia massacrou todos os nobres de Judá.[a]
  rationale: A revisão apenas esclarece o referente de «seus olhos», que no hebraico é Zedequias, e reposiciona a âncora da nota junto ao termo para o qual ela fornece uma alternativa. O sentido, a força narrativa e a repetição do hebraico são mantidos.
