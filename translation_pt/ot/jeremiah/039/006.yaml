  text: וַ/יִּשְׁחַט֩ מֶ֨לֶךְ בָּבֶ֜ל אֶת בְּנֵ֧י צִדְקִיָּ֛הוּ בְּ/רִבְלָ֖ה לְ/עֵינָ֑י/ו וְ/אֵת֙ כָּל חֹרֵ֣י יְהוּדָ֔ה שָׁחַ֖ט מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: pt
  text: O rei da Babilônia massacrou os filhos de Zedequias em Ribla, diante dos olhos de Zedequias, e o rei da Babilônia massacrou todos os nobres de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as autoridades de Judá”, em vez de “todos os nobres de Judá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: massacrou
  rationale: Preserva a força brutal do verbo hebraico no contexto de execução; é mais vívido que “matou” e mais natural no português atual que formas arcaizantes.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Reproduz diretamente a construção genitiva e mantém sua repetição na segunda oração, como no hebraico.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: os filhos de Zedequias
  rationale: Traduz de modo direto a referência masculina específica de בְּנֵי.
- source_word: בְּרִבְלָה
  choice: em Ribla
  rationale: Forma idiomática em português para indicar o local em que ocorreu a execução.
- source_word: לְעֵינָיו
  choice: diante dos olhos dele
  rationale: Mantém a imagem concreta do hebraico e deixa claro, sem substituir a expressão por uma paráfrase, que Zedequias presenciou a morte dos filhos.
- source_word: כָּל
  choice: todos
  rationale: Concorda naturalmente com o objeto coletivo plural “os nobres de Judá”.
- source_word: חֹרֵי יְהוּדָה
  choice: os nobres de Judá
  rationale: Expressa pessoas de alta posição social e política; “autoridades” também é possível, mas é menos socialmente marcado.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome territorial e político.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “o rei da Babilônia” foi preservada por corresponder à ênfase narrativa do hebraico; “massacrou” conserva a violência deliberada da cena.
