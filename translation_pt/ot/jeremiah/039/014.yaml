base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: pt
  text: Então mandaram buscar Jeremias do pátio da guarda e o entregaram aos cuidados de Gedalias, filho de Aicão e neto de Safã, para levá-lo à casa[a]. E Jeremias passou a viver no meio do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «à casa». O texto não especifica de quem era a casa.
    reason: Preserva a indefinição referencial da expressão hebraica אֶל־הַבָּיִת.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְחוּ
  choice: mandaram tirar
  rationale: Expressa naturalmente em português a ação coordenada de enviar alguém e retirar Jeremias do pátio, sem introduzir agentes não mencionados no versículo.
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל־גְּדַלְיָהוּ
  choice: o entregaram aos cuidados de Gedalias
  rationale: O contexto indica que Jeremias foi confiado a Gedalias; «aos cuidados de» comunica essa responsabilidade com clareza e sem sugerir posse.
- source_word: בֶּן־אֲחִיקָם בֶּן־שָׁפָן
  choice: filho de Aicão e neto de Safã
  rationale: Embora o hebraico repita «filho de», o segundo vínculo é genealógico e corresponde naturalmente a «neto de» em português.
- source_word: לְהוֹצִיאֵהוּ אֶל־הַבָּיִת
  choice: para levá-lo para casa
  rationale: «Para casa» é a forma portuguesa natural neste contexto; a referência exata da casa não é explicitada, por isso a literalidade é registrada em nota.
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: E Jeremias passou a viver no meio do povo
  rationale: Retoma explicitamente Jeremias para evitar ambiguidade de sujeito e traduz o estado duradouro indicado pelo contexto.
theological_decisions:
- issue: Identidade do sujeito que passou a viver no meio do povo
  choice: Explicitar «Jeremias»
  alternative: Manter apenas «ele»
  rationale: A explicitação não altera o referente do hebraico e evita que o leitor associe por engano o pronome ao nome masculino mais próximo, Gedalias.
- issue: Identificação da casa para a qual Jeremias foi levado
  choice: Não identificar o proprietário; usar «para casa» com nota
  alternative: Especificar «para a casa de Gedalias» ou «para a casa de Jeremias»
  rationale: O texto hebraico diz apenas «a casa» e não autoriza decidir de quem ela era.
translation_notes:
  register: 'Português moderno, digno e acessível, com formas onomásticas correntes em português: Jeremias, Gedalias, Aicão e Safã. A coordenação narrativa foi mantida de modo fluente, e a única ambiguidade relevante foi preservada por nota.'
