  terminology: Jeremias, Gedalias, Aicão e Safã são formas portuguesas adequadas. «Filho de Aicão e neto de Safã» comunica corretamente a genealogia no contexto. «Aos cuidados de» é uma formulação interpretativa moderada e apropriada para a entrega sob responsabilidade de Gedalias.
