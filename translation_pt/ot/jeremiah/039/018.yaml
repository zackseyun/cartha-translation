  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: pt
  text: Pois certamente livrarei você[a], e você não cairá pela espada. Sua vida será para você como despojo[b], porque você confiou em mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega o infinitivo absoluto junto ao verbo conjugado para reforçar a certeza: “sem falta livrarei você”.'
    reason: lexical_alternative
  - marker: b
    text: “Sua vida será para você como despojo” é uma expressão de guerra que significa escapar levando consigo a própria vida.
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: certamente livrarei você
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a promessa. “Certamente” transmite essa ênfase em português natural, e “livrar” se ajusta ao resgate físico imediato.
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: e você não cairá pela espada
  rationale: Mantém o verbo hebraico “cair” e a expressão bélica, compreensível como não ser morto pela espada.
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: Sua vida será para você como despojo
  rationale: 'Preserva a metáfora de guerra recorrente em Jeremias: a pessoa escapa levando apenas a própria vida, como despojo conquistado.'
- source_word: נַפְשְׁךָ
  choice: sua vida
  rationale: Neste contexto de sobrevivência física, נֶפֶשׁ designa a vida da pessoa, não especificamente uma alma imaterial.
- source_word: לְשָׁלָל
  choice: como despojo
  rationale: “Despojo” conserva a imagem militar do hebraico e possui registro digno e claro.
- source_word: כִּי בָטַחְתָּ בִּי
  choice: porque você confiou em mim
  rationale: Expressa a confiança ou dependência indicada por בטח com o complemento introduzido por ב.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” representa a fórmula profética נְאֻם, enquanto “Yahweh” preserva o nome divino presente no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome divino sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na expressão de despojo
  choice: vida
  alternative: alma
  rationale: A promessa diz respeito à sobrevivência em meio à violência de guerra; “vida” comunica o referente contextual sem impor uma definição antropológica técnica.
- issue: Força da promessa מַלֵּט אֲמַלֶּטְךָ
  choice: certamente livrarei você
  alternative: livrarei você
  rationale: A duplicação verbal hebraica é enfática, por isso a certeza explícita deve ser mantida.
translation_notes:
  register: Português moderno, claro e digno, com “você” para o singular. A ordem e as metáforas hebraicas foram preservadas quando continuam inteligíveis; as notas esclarecem a ênfase verbal e o idioma bélico.
