  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: pt
  text: Mas eu mesmo reunirei o remanescente do meu rebanho de todas as terras para onde os expulsei[a]. Eu os trarei de volta às suas pastagens[b], e eles serão fecundos e se multiplicarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dispersei”. O verbo hebraico pode indicar fazer alguém afastar-se ou ficar disperso; “expulsei” ressalta a força do juízo e mantém explícita a ação de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos seus apriscos”, “aos seus lugares de repouso” ou “às suas moradas”. O termo hebraico pode designar pastagem, habitação ou lugar de descanso; “pastagens” se ajusta à imagem do rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu mesmo
  rationale: O pronome independente enfatiza o sujeito; “eu mesmo” preserva essa força. No contraste com os pastores julgados no contexto anterior, וַ pode ser expresso naturalmente por “Mas”.
- source_word: אֲקַבֵּץ
  choice: reunirei
  rationale: קבץ designa ajuntar aquilo que foi disperso; “reunirei” é natural em português e adequado ao contexto de restauração.
- source_word: שְׁאֵרִית
  choice: o remanescente
  rationale: “Remanescente” conserva o sentido numérico e a ressonância própria da linguagem profética, sem identificar além do que o texto afirma.
- source_word: צֹאנִי
  choice: do meu rebanho
  rationale: צֹאן é um coletivo de animais de pequeno porte; “rebanho” preserva com naturalidade a metáfora pastoral.
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: de todas as terras
  rationale: O plural אֲרָצוֹת refere-se aos diversos territórios da dispersão; “terras” mantém a amplitude e o tom profético.
- source_word: הִדַּחְתִּי
  choice: os expulsei
  rationale: O hifil de נדח expressa fazer alguém afastar-se ou dispersar-se. “Expulsei” mantém a agência divina e a força judicial, sem transformar a frase em passiva.
- source_word: וַהֲשִׁבֹתִי
  choice: Eu os trarei de volta
  rationale: A forma causativa de שוב indica fazer retornar. A expressão comunica de maneira clara o movimento concreto de restauração.
- source_word: עַל נְוֵיהֶן
  choice: às suas pastagens
  rationale: נָוֶה pode indicar pastagem, morada ou lugar de repouso. O plural “pastagens” concorda com o sufixo plural e sustenta a imagem do rebanho; עַל é vertido idiomaticamente por “a”.
- source_word: וּפָרוּ וְרָבוּ
  choice: serão fecundos e se multiplicarão
  rationale: A formulação preserva a conhecida associação entre פרה e רבה e sua ressonância de bênção e crescimento, em português digno e compreensível.
theological_decisions:
- issue: Agência divina no exílio e na restauração
  choice: Manter Deus como aquele que expulsou, reúne e traz de volta o rebanho.
  alternative: Atenuar a agência divina com “onde foram dispersos” ou atribuir a dispersão apenas a agentes humanos.
  rationale: O hebraico emprega explicitamente a primeira pessoa em הִדַּחְתִּי e também nas ações restauradoras. A tradução preserva a tensão entre juízo e restauração.
- issue: Ressonância da fórmula de fecundidade e multiplicação
  choice: Traduzir וּפָרוּ וְרָבוּ por “serão fecundos e se multiplicarão”.
  alternative: Reduzir a expressão a “crescerão em número”.
  rationale: A redação escolhida conserva o eco bíblico da bênção de fecundidade sem especificar se o crescimento é apenas demográfico ou se possui implicações mais amplas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mas eu mesmo” marca o contraste contextual e a ênfase do pronome hebraico. A divisão em duas frases evita uma coordenação excessivamente longa. Os marcadores [a] e [b] aparecem no texto junto aos termos relevantes.
