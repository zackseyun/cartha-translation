id: JER.23.14
reference: Jeremiah 23:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: pt
  text: 'E entre os profetas de Jerusalém vi uma coisa horrível: praticam adultério e vivem na falsidade; dão força aos malfeitores, de modo que ninguém[a] se afaste[b] da sua maldade. Todos eles são para mim como Sodoma, e os habitantes de Jerusalém, como Gomorra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “um homem”, no singular distributivo, isto é, cada pessoa do grupo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se arrependa”. O verbo hebraico significa voltar ou afastar-se e, neste contexto, pode expressar arrependimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְבִיאֵי יְרוּשָׁלִַם
  choice: E entre os profetas de Jerusalém
  rationale: A preposição ב indica aqui o âmbito em que a conduta foi observada; “entre” é a formulação idiomática mais clara em português. O ו inicial mantém a continuidade do discurso com “E”.
- source_word: רָאִיתִי שַׁעֲרוּרָה
  choice: vi uma coisa horrível
  rationale: O perfeito רָאִיתִי é vertido naturalmente pelo pretérito perfeito; שַׁעֲרוּרָה designa algo moralmente espantoso ou abominável.
- source_word: נָאוֹף
  choice: praticam adultério
  rationale: A construção verbal descreve conduta, não apenas o conceito abstrato de adultério; “praticam adultério” conserva essa força.
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: e vivem na falsidade
  rationale: O hebraico emprega a metáfora de andar para indicar modo de vida. “Vivem na falsidade” comunica essa função em português corrente sem reduzir שֶׁקֶר a uma mentira isolada.
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: dão força aos malfeitores
  rationale: A expressão idiomática “fortalecer as mãos” significa dar apoio, coragem ou poder de ação. “Dão força” preserva a imagem central e é clara em português.
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: de modo que ninguém se afaste da sua maldade
  rationale: לְבִלְתִּי exprime resultado ou propósito negativo. אִישׁ é singular distributivo, representado naturalmente por “ninguém”; שׁוב conserva a imagem de afastar-se ou voltar atrás, com possível nuance de arrependimento.
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: Todos eles são para mim como Sodoma
  rationale: A frase apresenta a avaliação divina do grupo. “São para mim” é natural e mantém לִי, sem decidir de modo excessivo entre estado presente e resultado alcançado.
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: e os habitantes de Jerusalém, como Gomorra
  rationale: O sufixo feminino remete a Jerusalém. Repetir o nome evita a ambiguidade do possessivo português e mantém claro que são os habitantes da cidade.
theological_decisions:
- issue: Singular distributivo אִישׁ
  choice: ninguém
  alternative: nenhum homem
  rationale: O substantivo masculino singular funciona distributivamente e abrange cada integrante do grupo. “Ninguém” reproduz essa força representativa em português natural; a forma do hebraico é registrada em nota.
- issue: Nuance de arrependimento em שׁוב
  choice: se afaste da sua maldade
  alternative: se arrependa da sua maldade
  rationale: “Afastar-se” preserva a imagem lexical de voltar ou abandonar o mal, enquanto a nota registra a leitura teológica legítima de arrependimento sem torná-la mais explícita do que o texto.
- issue: Referente do sufixo feminino em וְיֹשְׁבֶיהָ
  choice: os habitantes de Jerusalém
  alternative: seus habitantes
  rationale: O antecedente feminino é Jerusalém. A repetição explícita evita que “seus” seja entendido como referência a Sodoma ou aos profetas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções correntes no Brasil e inteligíveis internacionalmente. A tradução conserva a acusação direta e o paralelismo entre Sodoma e Gomorra, esclarecendo apenas o referente do pronome feminino.
