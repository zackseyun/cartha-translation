  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: pt
  text: 'A respeito dos profetas: Meu coração está despedaçado dentro de mim[a]; todos os meus ossos tremem[b]. Fiquei como um homem embriagado, como um homem forte dominado pelo vinho, por causa de Yahweh e de suas santas palavras[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contra os profetas”. A preposição hebraica pode introduzir o assunto do oráculo ou, de modo mais interpretativo, indicar oposição.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “estremecem” ou “se agitam”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “diante de Yahweh e diante de suas santas palavras”. Aqui, “por causa de” entende a expressão como indicando a causa do estado avassalador do profeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  choice: A respeito dos profetas
  rationale: O לְ prefixado funciona naturalmente como introdução do assunto do oráculo. A formulação mantém aberta, em nota, a possível nuance adversativa.
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  choice: Meu coração está despedaçado dentro de mim
  rationale: O nifal de שׁבר indica um estado de quebrantamento intenso; “despedaçado” comunica a força da imagem, e “dentro de mim” preserva בְקִרְבִּי.
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  choice: todos os meus ossos tremem
  rationale: רחף descreve agitação física, tremor ou estremecimento. “Tremem” é claro, natural e adequado ao temor expresso no contexto.
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
  choice: Fiquei como um homem embriagado
  rationale: O perfeito descreve o estado resultante do profeta. “Fiquei” expressa naturalmente a entrada nesse estado, e “homem embriagado” conserva a comparação masculina singular.
- source_word: וּכְגֶבֶר
  choice: como um homem forte
  rationale: גֶּבֶר pode realçar vigor ou força masculina, não sendo apenas um termo genérico para ser humano.
- source_word: עֲבָרוֹ יָיִן
  choice: dominado pelo vinho
  rationale: A construção retrata alguém sobrepujado ou vencido pelo efeito do vinho. “Dominado pelo vinho” comunica o sentido idiomático sem reproduzir de modo obscuro o verbo עבר.
- source_word: מִפְּנֵי יְהוָה
  choice: por causa de Yahweh
  rationale: Neste contexto, מִפְּנֵי pode indicar a causa da condição avassaladora do profeta. A alternativa “diante de” é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבְרֵי קָדְשׁוֹ
  choice: suas santas palavras
  rationale: A construção hebraica é expressa de modo idiomático como palavras caracterizadas pela santidade de Yahweh, preservando o sufixo possessivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e é a transliteração adotada, sem substituir o nome por “SENHOR”.
- issue: Valor de מִפְּנֵי na reação do profeta
  choice: por causa de
  alternative: diante de
  rationale: A leitura causal explica a condição física e emocional descrita, mas a expressão hebraica também admite uma leitura ligada à presença; essa tensão é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o movimento poético do hebraico sem rigidez excessiva. “Despedaçado”, “embriagado” e “dominado” preservam a intensidade das imagens; as ambiguidades reais de לַנְּבִאִים e מִפְּנֵי são registradas em notas.
