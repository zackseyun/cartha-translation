id: JER.23.21
reference: Jeremiah 23:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: pt
  text: Eu não enviei os profetas[a], mas eles correram; não lhes falei, mas eles profetizaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eles correram”. A conjunção hebraica pode ser traduzida simplesmente por “e”, mas aqui o contexto indica forte contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: enviei
  rationale: É o sentido comum de שׁלח e preserva a imagem de autorização divina sem explicitar demais a ideia de comissionamento.
- source_word: הַנְּבִאִים
  choice: os profetas
  rationale: O artigo definido hebraico é representado naturalmente; o contexto identifica os profetas que estão sendo denunciados.
- source_word: רָצוּ
  choice: correram
  rationale: Mantém a imagem vívida do hebraico, que sugere que eles se lançaram à atividade profética sem terem sido enviados.
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: falei com eles
  rationale: Expressa em português corrente a comunicação direta que Deus nega ter feito, sem acrescentar conteúdo interpretativo.
- source_word: נִבָּאוּ
  choice: profetizaram
  rationale: É o equivalente direto e usual do verbo hebraico para exercer fala profética.
- source_word: וְהֵם
  choice: mas eles
  rationale: A conjunção וְ pode significar simplesmente “e”, porém a oposição entre a negativa divina e a ação dos profetas favorece o valor adversativo neste contexto.
- source_word: לֹא
  choice: não
  rationale: Nega diretamente as ações verbais concluídas de enviar e falar, conforme o contexto.
theological_decisions:
- issue: Natureza da atividade dos falsos profetas
  choice: O versículo afirma que esses profetas agiram sem envio nem comunicação da parte de Deus.
  alternative: A referência a correr poderia ser entendida mais fracamente como mera censura à pressa.
  rationale: As duas afirmações paralelas — “não enviei” e “não falei” — indicam ausência de autorização e revelação divinas, sem ampliar a declaração para além do alcance do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição e o paralelismo do hebraico foram preservados; “correram” mantém a metáfora original em vez de substituí-la por uma explicação.
