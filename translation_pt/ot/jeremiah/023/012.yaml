id: JER.23.12
reference: Jeremiah 23:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: pt
  text: Por isso, o caminho deles lhes será como lugares escorregadios na escuridão; serão impelidos e cairão nela, pois trarei sobre eles calamidade no ano do seu castigo[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no ano da sua visitação”. A expressão hebraica pode indicar o tempo em que Deus intervém para julgar ou exigir contas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural em português a consequência do juízo decorrente da acusação anterior.
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: o caminho deles se tornará, para eles
  rationale: Preserva tanto a metáfora do caminho quanto a construção enfática, segundo a qual o próprio curso deles se volta contra eles.
- source_word: כַּחֲלַקְלַקּוֹת בָּאֲפֵלָה
  choice: como lugares escorregadios na escuridão
  rationale: Mantém o plural concreto e a imagem vívida de terreno traiçoeiro oculto pela escuridão.
- source_word: יִדַּחוּ
  choice: serão impelidos
  rationale: O nifal indica que serão movidos ou empurrados por uma força externa; a opção evita acrescentar uma direção descendente não explícita.
- source_word: וְנָפְלוּ בָהּ
  choice: e cairão nela
  rationale: Conserva o sufixo feminino hebraico e sua ambiguidade referencial, sem substituir o pronome por um antecedente interpretativo.
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto de juízo, designa calamidade punitiva, não maldade moral; 'desgraça' é corrente, grave e natural em português.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: no ano do seu castigo
  rationale: No contexto, פְּקֻדָּה indica a intervenção de Deus para julgamento; 'castigo' comunica claramente o sentido principal.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino expresso pelo Tetragrama.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- issue: Sentido de רָעָה no juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: Aqui o termo descreve uma calamidade judicial trazida por Deus, sem atribuir a ele maldade moral.
- issue: Sentido de פְּקֻדָּה
  choice: castigo
  alternative: visitação; ajuste de contas
  rationale: A acusação e o anúncio de desgraça favorecem o sentido de punição, embora o termo também possa designar a ocasião em que Deus intervém para inspeção e prestação de contas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva deliberadamente a ênfase de 'para eles', e o pronome 'nela' mantém a ambiguidade da imagem hebraica.
