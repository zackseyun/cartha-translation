  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: pt
  text: os que planejam fazer o meu povo esquecer o meu nome por meio dos sonhos que cada um conta a seu próximo[a], assim como seus pais esqueceram o meu nome por causa de Baal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seus sonhos”. A preposição hebraica pode indicar meio ou esfera.
    reason: lexical_alternative
  - marker: b
    text: Ou “por Baal” ou “mediante Baal”. A preposição hebraica pode indicar causa, associação ou meio; provavelmente a ligação ou devoção a Baal os levou a esquecer o nome do SENHOR.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: os que planejam
  rationale: O particípio de חשׁב expressa aqui intenção deliberada no contexto da denúncia contra os falsos profetas, não mero pensamento.
- source_word: לְהַשְׁכִּיחַ
  choice: fazer ... esquecer
  rationale: O infinitivo hifil de שׁכח tem força causativa; esta construção a preserva de modo natural em português.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Mantém o possessivo explícito e a linguagem relacional da aliança.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: A tradução literal preserva o peso da identidade revelada de Deus sem substituí-la por uma explicação interpretativa.
- source_word: בַּחֲלֹמוֹתָם
  choice: por meio de seus sonhos
  rationale: 'O בְּ é entendido principalmente como instrumental: os sonhos divulgados servem de meio para levar o povo ao esquecimento. A possível leitura de esfera é registrada em nota.'
- source_word: אֲשֶׁר יְסַפְּרוּ
  choice: que contam
  rationale: O piel de ספר significa relatar ou contar; “contam” é corrente e adequado à transmissão oral descrita.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  rationale: Preserva a construção distributiva אִישׁ ... לְרֵעֵהוּ e sua forma masculina representativa, com linguagem portuguesa compreensível.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz claramente a comparação entre a ação dos falsos profetas e a apostasia das gerações anteriores.
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: seus pais esqueceram
  rationale: “Pais” traduz diretamente אֲבוֹתָם e mantém a comparação intergeracional; “antepassados” seria possível.
- source_word: בַּבָּעַל
  choice: por causa de Baal
  rationale: 'Entende-se o בְּ como indicação da causa ou associação: a devoção a Baal levou ao esquecimento do nome do SENHOR. A ambiguidade preposicional é preservada em nota.'
theological_decisions:
- issue: Linguagem pactual do “nome”
  choice: o meu nome
  alternative: a minha fama; quem eu sou
  rationale: A formulação literal mantém nas duas ocorrências a tensão teológica entre a identidade revelada de Deus e a apostasia, sem transformar o texto em paráfrase.
- issue: Expressão distributiva masculina אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  alternative: uns aos outros; cada pessoa à outra
  rationale: A escolha conserva a forma distributiva e o gênero gramatical do hebraico sem restringir indevidamente a referência.
- issue: Relação entre o esquecimento e Baal
  choice: por causa de Baal
  alternative: por Baal; em Baal
  rationale: A leitura comunica que a ligação ou devoção a Baal ocasionou o esquecimento do nome divino, sem inserir uma descrição cultual ausente do texto; outras possibilidades do בְּ ficam em nota.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com leitura natural no Brasil. Conserva-se a estrutura de oração relativa do contexto, a repetição enfática de “o meu nome” e o nome próprio “Baal”. O trecho começa com minúscula por ser sintaticamente continuação do versículo anterior.
