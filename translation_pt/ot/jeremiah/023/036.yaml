  source_fidelity: A tradução preserva adequadamente a proibição de voltar a usar a expressão מַשָּׂא יְהוָה, bem como o jogo de palavras com a segunda ocorrência de מַשָּׂא. “A palavra de cada um será sua própria carga” comunica de modo natural a construção hebraica condensada, sem eliminar sua força de retorno da própria fala sobre quem a profere. “Vocês distorceram” representa bem וַהֲפַכְתֶּם no contexto de adulteração das palavras divinas.
