  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: pt
  text: Mas vocês não mencionarão mais “a carga de Yahweh”, pois a palavra de cada um será sua própria carga[a][b]; vocês distorceram as palavras do Deus vivo, Yahweh dos Exércitos, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico מַשָּׂא pode significar “carga” ou, em contextos proféticos, “oráculo” ou “mensagem”. Aqui, o profeta parece explorar os dois sentidos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a carga será para cada um a sua palavra”. A frase provavelmente indica que aquilo que cada pessoa diz recairá sobre ela como uma carga, em vez de constituir uma verdadeira palavra de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: carga
  rationale: O termo hebraico pode designar tanto uma carga ou peso quanto, em contexto profético, um oráculo. Repetir “carga” preserva em português o jogo de palavras pelo qual a expressão profética é voltada contra quem a emprega.
- source_word: תִזְכְּרוּ
  choice: mencionarão
  rationale: Embora o verbo possa significar “lembrar”, aqui rege uma expressão citada e tem naturalmente o sentido de mencioná-la ou trazê-la à fala.
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: a palavra de cada um será sua própria carga
  rationale: Mantém a formulação compacta e a correspondência entre מַשָּׂא e “carga”, ao mesmo tempo que expressa com naturalidade o sentido distributivo de לְאִישׁ.
- source_word: וַהֲפַכְתֶּם
  choice: vocês distorceram
  rationale: No contexto, o verbo indica alterar ou deturpar culpavelmente as palavras de Deus; “distorceram” é claro, atual e preserva a imagem sem exagerá-la.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo transparente, mantendo a imagem de exércitos ou hostes em vez de substituí-la pela interpretação “Todo-Poderoso”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal no texto hebraico, sem substituí-lo por um título.
- issue: Jogo de palavras com מַשָּׂא
  choice: “carga” nas duas ocorrências
  alternative: “oráculo” ou “mensagem”
  rationale: 'O argumento depende da duplicidade do termo: o povo usa uma fórmula profética, mas sua própria palavra se torna sua carga. Uma única tradução nas duas ocorrências conserva essa tensão retórica.'
- issue: Sentido da palavra de cada pessoa tornar-se sua carga
  choice: preservar a formulação sem explicitar plenamente a consequência
  alternative: “o que cada um disser se voltará contra ele”
  rationale: O hebraico é condensado e permite perceber que a fala recai sobre quem a profere, mas não enuncia diretamente todos os detalhes dessa consequência; a tradução mantém essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. “Carga” foi preferido a “peso” porque funciona naturalmente como algo suportado e permite repetir o mesmo termo nas duas ocorrências, embora o sentido técnico de “oráculo” precise ser registrado em nota. O ponto e vírgula separa a acusação final sem romper sua ligação causal com a proibição.
