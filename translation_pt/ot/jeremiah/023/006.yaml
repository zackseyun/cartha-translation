  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: pt
  text: 'Nos seus dias, Judá será salvo, e Israel viverá em segurança. E este é o nome pelo qual ele será chamado: “Yahweh é a nossa justiça”[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh, nossa justiça”. O hebraico não traz um verbo equivalente a “é”.'
    reason: lexical_alternative
  - marker: b
    text: “Justiça” também pode ser traduzida por “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos seus dias
  rationale: Reproduz de modo natural a expressão temporal hebraica e a relaciona ao rei justo mencionado no contexto.
- source_word: תִּוָּשַׁע
  choice: será salvo
  rationale: O nifal de ישׁע indica ser salvo, liberto ou resgatado. “Será salvo” preserva a amplitude do termo sem limitar a salvação ao âmbito militar ou espiritual.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: viverá em segurança
  rationale: שׁכן descreve habitar ou viver, e לָבֶטַח indica segurança. A formulação é corrente em português e mantém a ideia de vida estável e protegida.
- source_word: אֲשֶׁר יִקְרְאוֹ
  choice: pelo qual ele será chamado
  rationale: O hebraico emprega um verbo singular com sufixo de objeto e não explicita claramente o sujeito. A construção passiva portuguesa conserva essa indeterminação e comunica com naturalidade a fórmula de nomeação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צִדְקֵנוּ
  choice: a nossa justiça
  rationale: O termo pode abranger justiça e retidão. “Nossa justiça” é natural na fórmula nominal e preserva sua amplitude teológica, enquanto a nota registra a alternativa lexical.
theological_decisions:
- issue: Sentido e forma da fórmula nominal יְהוָה צִדְקֵנוּ
  choice: Yahweh é a nossa justiça
  alternative: Yahweh, nossa justiça
  rationale: O hebraico não apresenta cópula explícita, de modo que tanto uma leitura predicativa quanto uma fórmula nominal sem verbo são possíveis. O texto principal acrescenta “é” para clareza em português, e a nota preserva a forma alternativa.
- issue: Amplitude semântica de צֶדֶק em צִדְקֵנוּ
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém tanto a dimensão de conformidade com o que é certo quanto possíveis ressonâncias judiciais e pactuais; “retidão” continua sendo uma tradução legítima e é indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega “Yahweh” para o tetragrama e evita linguagem denominacional. A pontuação divide as duas afirmações principais sem enfraquecer sua ligação.
