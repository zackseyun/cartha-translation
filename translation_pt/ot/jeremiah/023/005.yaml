id: JER.23.5
reference: Jeremiah 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: pt
  text: “Eis que vêm dias”, declara Yahweh, “em que levantarei para Davi um Renovo justo[a]. Ele reinará como rei, agirá com sabedoria[b] e praticará o direito e a justiça na terra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um Broto justo” ou “um Rebento justo”. A metáfora hebraica descreve alguém que surge da linhagem de Davi.
    reason: lexical_alternative
  - marker: b
    text: Ou “procederá prudentemente” ou “prosperará”. O verbo hebraico pode abranger tanto a ação sábia quanto o êxito resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força de chamada de atenção e a solenidade do anúncio profético, sem soar excessivamente arcaico.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de perto a fórmula profética hebraica e comunica a chegada de um tempo futuro determinado por Deus.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa o caráter autorizado da fórmula profética נְאֻם e preserva o nome divino explícito no texto hebraico.
- source_word: וַהֲקִמֹתִי
  choice: levantarei
  rationale: No contexto de uma promessa régia, o hifil de קום indica fazer surgir ou levantar um governante da linhagem prometida.
- source_word: לְדָוִד
  choice: para Davi
  rationale: Mantém a preposição e a referência explícita a Davi, sem acrescentar no corpo do texto a expressão interpretativa “casa de Davi”.
- source_word: צֶמַח צַדִּיק
  choice: um Renovo justo
  rationale: “Renovo” preserva a metáfora vegetal de algo que brota e sua ressonância dinástica nos profetas; a inicial maiúscula sinaliza o provável uso designativo sem inserir a palavra “Messias”.
- source_word: וּמָלַךְ מֶלֶךְ
  choice: Ele reinará como rei
  rationale: Preserva de modo natural a ênfase da construção hebraica formada pelo verbo e pelo substantivo cognato.
- source_word: וְהִשְׂכִּיל
  choice: agirá com sabedoria
  rationale: Destaca a atuação prudente e hábil do rei, mantendo em nota a possibilidade de o verbo também incluir êxito ou prosperidade.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: praticará o direito e a justiça
  rationale: Mantém os dois termos ético-jurídicos distintos e apresenta o governo efetivamente exercido segundo o que é justo.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Conserva a formulação abrangente e a ambiguidade contextual de אֶרֶץ, que pode referir-se à terra do povo ou, em leitura mais ampla, à terra em geral.
theological_decisions:
- issue: Força messiânica do Renovo davídico
  choice: Preservar a imagem dinástica e seu possível caráter designativo como “Renovo”, sem identificar explicitamente a figura como “o Messias”.
  alternative: Traduzir por um termo vegetal genérico em minúscula ou inserir diretamente “o Messias”.
  rationale: O texto promete um rei justo ligado a Davi e emprega uma imagem profética com forte ressonância messiânica, mas não usa aqui o substantivo “Messias”. A tradução mantém essa força sem transformar interpretação teológica em conteúdo explícito.
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz o tetragrama como nome próprio; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de וְהִשְׂכִּיל
  choice: agirá com sabedoria
  alternative: prosperará
  rationale: O verbo permite tanto a ideia de proceder com discernimento quanto a de alcançar êxito. O contexto imediato de governo justo favorece a primeira, enquanto a nota preserva a segunda.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Eis que” e “Renovo” preservam o tom profético e a imagem tradicional, enquanto a sintaxe restante é corrente. As aspas organizam a fórmula introdutória e o discurso divino sem alterar seu conteúdo.
