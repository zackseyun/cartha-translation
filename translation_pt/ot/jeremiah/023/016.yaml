  - severity: low
    issue: A paráfrase «eles tornam vocês vazios» na nota é imprecisa em português.
    rationale: Como explicação formal de um verbo ligado a vaidade/vacuidade, «tornam vocês vazios» pode ser entendido como esvaziamento literal ou emocional. «Tornam vocês vãos» reflete melhor a formulação formal, com as demais alternativas esclarecendo o sentido.
