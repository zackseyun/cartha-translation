base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Não deem ouvidos às palavras dos profetas que profetizam para vocês; eles os iludem[a]. Falam de uma visão do próprio coração, não da boca de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles os conduzem à vacuidade”; mais formalmente, “eles os tornam vãos”. O verbo hebraico transmite a ideia de causar vacuidade, vaidade ou ilusão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título tradicional e inteligível “dos Exércitos”, sem restringi-lo apenas a forças humanas ou celestiais.
- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: Não deem ouvidos às palavras
  rationale: Expressão portuguesa natural que comunica a proibição de escutar com assentimento ou obedecer, preservando também o substantivo plural “palavras”.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: os profetas que profetizam para vocês
  rationale: Preserva a repetição intencional entre “profetas” e “profetizam” e mantém explícitos os destinatários.
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: eles os iludem
  rationale: Expressa de modo conciso o efeito causativo de הבל — conduzir à vacuidade, ao engano ou a uma esperança sem fundamento — sem acrescentar ao texto uma especificação excessiva.
- source_word: חֲזוֹן לִבָּם
  choice: uma visão do próprio coração
  rationale: Conserva a imagem hebraica do coração como centro do pensamento, da vontade e do desejo, além do contraste com a palavra procedente de Yahweh.
- source_word: לֹא מִפִּי יְהוָה
  choice: não da boca de Yahweh
  rationale: Preserva a imagem concreta da fonte da fala divina, em vez de reduzi-la simplesmente a “não de Yahweh”.
theological_decisions:
- issue: Efeito dos falsos profetas sobre os ouvintes
  choice: eles os iludem
  alternative: eles enchem vocês de falsas esperanças; eles os tornam vazios
  rationale: O hifil de הבל sugere causar vacuidade ou vaidade e, neste contexto, enganar por meio de mensagens sem fundamento. “Iludem” mantém a força do juízo sem definir além do necessário a forma específica do engano.
- issue: Sentido antropológico de לֵב em חֲזוֹן לִבָּם
  choice: uma visão do próprio coração
  alternative: uma visão da própria mente
  rationale: “Coração” preserva a antropologia e a metáfora do hebraico, incluindo pensamento, vontade e desejo, sem transformar o termo apenas em atividade intelectual.
translation_notes:
  register: Português moderno, digno e claro, com construção natural para leitores brasileiros. O paralelismo lexical “profetas que profetizam” e as imagens hebraicas de “coração” e “boca” foram preservados.
