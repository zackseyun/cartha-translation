  source_fidelity: 'A tradução reproduz com precisão a proibição, o jogo de palavras entre «profetas» e «profetizam», o efeito enganador de מַהְבִּלִים, e as imagens de «coração» e «boca». «Yahweh dos Exércitos» é uma tradução adequada de יהוה צבאות. A única revisão é idiomática: em português moderno, «falar uma visão» soa como calque; «falar de uma visão» comunica o conteúdo anunciado sem alterar o sentido.'
  naturalness: O registro é claro, solene e acessível. «Não deem ouvidos» e «eles os iludem» são naturais. A construção «Falam uma visão» precisa de ajuste para uma formulação portuguesa corrente.
  terminology: «Yahweh», «dos Exércitos», «coração» e «boca de Yahweh» preservam adequadamente os termos e imagens do hebraico. A nota lexical mantém a amplitude semântica relevante de הבל, mas sua alternativa mais literal é ajustada para não sugerir que os destinatários se tornam literalmente «vazios».
