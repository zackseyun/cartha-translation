  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה וְ/סַ֖עַר מִתְחוֹלֵ֑ל עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/019.yaml
  text: Look[a], the storm of Yahweh has gone out in wrath, a whirling tempest[c][b]; it will whirl down on the head of the wicked.
translation:
  language: pt
  text: Eis que a tempestade de Yahweh saiu em furor[b]; um vendaval redemoinhante se abaterá sobre a cabeça dos perversos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “redemoinhará sobre a cabeça dos perversos” ou “irromperá sobre a cabeça dos perversos”. O verbo final pode destacar tanto o movimento giratório da tempestade quanto seu impacto violento.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico “saiu” usa um perfeito profético, apresentando o juízo futuro como certo e já posto em movimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Introduz o anúncio com vivacidade e urgência; a forma plural dirige naturalmente a atenção dos ouvintes em português atual.
- source_word: סַעֲרַת יְהוָה
  choice: a tempestade de Yahweh
  rationale: “Tempestade” comunica de modo claro o fenômeno violento designado por סַעֲרָה, e a construção mantém a relação direta com o nome divino.
- source_word: חֵמָה
  choice: com furor
  rationale: Toma o substantivo em função circunstancial, indicando que a tempestade procede como expressão da ira intensa de Yahweh.
- source_word: יָצְאָה
  choice: saiu
  rationale: Preserva o perfeito hebraico e sua apresentação vívida do juízo como já posto em movimento, embora seu impacto ainda seja futuro.
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: um vendaval redemoinhante
  rationale: A frase funciona como descrição intensificadora da tempestade; “redemoinhante” preserva o movimento violento e giratório do particípio.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: sobre a cabeça dos perversos
  rationale: Mantém o singular coletivo hebraico “cabeça” com o plural substantivado, em formulação compreensível e solene.
- source_word: יָחוּל
  choice: cairá
  rationale: No contexto, expressa a investida ou queda da tempestade sobre os perversos; a nota registra a possibilidade de maior ênfase no movimento giratório ou no impacto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: Mantém o nome próprio da aliança expresso no texto hebraico, sem substituí-lo por um título.
- issue: Aspecto do perfeito profético יָצְאָה
  choice: saiu
  alternative: sairá; já se desencadeou
  rationale: O pretérito preserva a maneira hebraica de apresentar o juízo futuro e certo como já iniciado, sem eliminar a tensão temporal.
- issue: Sentido do verbo final יָחוּל
  choice: cairá
  alternative: redemoinhará; irromperá
  rationale: “Cairá” comunica naturalmente a tempestade atingindo os perversos, enquanto a nota conserva a ambiguidade entre movimento giratório e impacto violento.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A imagem profética foi preservada sem arcaísmos desnecessários; “Yahweh” translitera o nome divino.
