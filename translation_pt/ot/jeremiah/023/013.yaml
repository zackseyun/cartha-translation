  text: וּ/בִ/נְבִיאֵ֥י שֹׁמְר֖וֹן רָאִ֣יתִי תִפְלָ֑ה הִנַּבְּא֣וּ בַ/בַּ֔עַל וַ/יַּתְע֥וּ אֶת עַמִּ֖/י אֶת יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: pt
  text: E entre os profetas de Samaria vi uma insensatez:[a] profetizaram por Baal[b] e desencaminharam meu povo, Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «algo repugnante» ou «algo chocante». O termo hebraico indica algo moral ou religiosamente ultrajante.
    reason: lexical_alternative
  - marker: b
    text: Ou «em nome de Baal» ou «para Baal». A ideia é que exerciam sua atividade profética sob a autoridade de Baal ou em nome dele.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי
  choice: E entre os profetas de
  rationale: A combinação de ו com ב indica aqui o âmbito em que se fez a observação; em português, «entre os profetas» é natural e preserva o sentido.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa consagrada do nome da capital do reino do norte, aqui associada ao seu grupo profético.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito qal na primeira pessoa do singular relata diretamente o que foi observado; o pretérito perfeito é claro e natural.
- source_word: תִפְלָה
  choice: algo repugnante
  rationale: O termo denota algo impróprio, insípido ou escandaloso em sentido moral e religioso. «Algo repugnante» transmite a forte avaliação negativa sem reduzi-la a simples falta de inteligência.
- source_word: הִנַּבְּאוּ
  choice: eles profetizavam
  rationale: O hitpael de נבא designa atividade profética. O imperfeito em português apresenta a prática característica desses profetas no contexto da observação passada.
- source_word: בַבַּעַל
  choice: por Baal
  rationale: 'A preposição ב expressa associação, meio ou autoridade: a atividade profética era realizada em nome de Baal ou sob a autoridade que lhe atribuíam.'
- source_word: וַיַּתְעוּ
  choice: e desviavam
  rationale: O hifil de תעה é causativo, «fazer desviar». «Desviavam» preserva a ideia moral e religiosa de conduzir para fora do caminho.
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: A segunda expressão identifica por aposição o povo pertencente ao Senhor; a construção é natural em português e mantém o possessivo divino.
theological_decisions:
- issue: Relação dos profetas com Baal em הִנַּבְּאוּ בַבַּעַל
  choice: eles profetizavam por Baal
  alternative: eles profetizavam em nome de Baal / para Baal
  rationale: «Por Baal» conserva de modo conciso a ambiguidade instrumental e associativa da preposição hebraica, indicando autoridade alegada ou vínculo com Baal sem acrescentar uma formulação teológica ausente do texto.
- issue: Força moral e religiosa de תִפְלָה
  choice: algo repugnante
  alternative: insensatez / algo chocante
  rationale: O contexto denuncia corrupção profética e cultual, não mera deficiência intelectual. A escolha comunica forte reprovação moral e religiosa, enquanto a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. «Algo repugnante» mantém a intensidade da censura; as notas preservam a amplitude lexical e a ambiguidade da preposição hebraica.
