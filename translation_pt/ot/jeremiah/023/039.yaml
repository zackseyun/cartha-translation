  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: pt
  text: Por isso, eis que eu certamente os levantarei[a] e lançarei fora vocês e a cidade que dei a vocês e aos seus antepassados, de diante da minha face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu me esquecerei completamente de vocês”. O hebraico aqui é difícil; também pode ser entendido como “eu certamente os carregarei para longe”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “para longe da minha presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão e a consequência da denúncia anterior.
- source_word: הִנְנִי
  choice: eis que eu
  rationale: Preserva a força dêitica, solene e profética da expressão hebraica.
- source_word: וְנָשִׁיתִי ... נָשֹׂא
  choice: eu certamente os levantarei
  rationale: Segue a leitura massorética apresentada e conserva a imagem irônica de levantar, ligada ao jogo de palavras do contexto com מַשָּׂא. O infinitivo absoluto é expresso por “certamente”. A leitura alternativa ligada a “esquecer” é mantida em nota.
- source_word: וְנָטַשְׁתִּי
  choice: e os lançarei fora
  rationale: No contexto de expulsão judicial, comunica mais vividamente do que uma simples ideia de abandono que eles serão removidos de diante de Deus.
- source_word: הָעִיר
  choice: a cidade
  rationale: Mantém a designação não explícita do hebraico, embora o contexto indique Jerusalém.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: que dei a vocês e aos seus antepassados
  rationale: Preserva a referência histórico-pactual ao dom concedido à geração presente e às gerações anteriores; “antepassados” é mais amplo e natural no português atual do que “pais” neste uso.
- source_word: מֵעַל פָּנָי
  choice: de diante da minha face
  rationale: Conserva a imagem antropomórfica concreta do hebraico, enquanto a formulação interpretativa mais fluente é apresentada em nota.
theological_decisions:
- issue: Ambiguidade textual e lexical em וְנָשִׁיתִי ... נָשֹׂא
  choice: eu certamente os levantarei
  alternative: eu me esquecerei completamente de vocês; eu certamente os carregarei para longe
  rationale: A tradução principal acompanha a vocalização massorética fornecida e preserva a possível ironia e o jogo verbal com מַשָּׂא no contexto. Como o hebraico é difícil e admite uma leitura tradicional diferente, a alternativa “esquecerei” não é excluída, mas registrada em nota.
- issue: Linguagem da presença divina em מֵעַל פָּנָי
  choice: de diante da minha face
  alternative: para longe da minha presença
  rationale: A tradução principal retém a metáfora corporal e relacional do texto sem a reduzir silenciosamente a uma abstração teológica; a equivalência idiomática é oferecida em nota.
translation_notes:
  register: Português moderno, solene e acessível, com ampla legibilidade brasileira. “Eis que” preserva o tom profético elevado; “vocês” e “antepassados” evitam arcaísmo desnecessário. Os travessões esclarecem que tanto o povo quanto a cidade são objeto do ato de expulsão, sem alterar a estrutura semântica do hebraico.
