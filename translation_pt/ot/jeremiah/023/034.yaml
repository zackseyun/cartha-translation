id: JER.23.34
reference: Jeremiah 23:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֤יא וְ/הַ/כֹּהֵן֙ וְ/הָ/עָ֔ם אֲשֶׁ֥ר יֹאמַ֖ר מַשָּׂ֣א יְהוָ֑ה וּ/פָקַדְתִּ֛י עַל הָ/אִ֥ישׁ הַ/ה֖וּא וְ/עַל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: pt
  text: 'Quanto ao profeta, ao sacerdote ou ao povo que disser: “A carga de Yahweh”[a], eu castigarei esse homem e a sua família.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O oráculo de Yahweh”. A palavra hebraica massa pode significar “oráculo”, mas aqui Jeremias parece explorar seu sentido mais literal, “carga”, como parte de sua repreensão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Tradução corrente de נָבִיא, preservando o artigo definido.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente natural e preciso de כֹּהֵן neste contexto.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o sentido coletivo de עָם e soa natural em português.
- source_word: אֲשֶׁר יֹאמַר
  choice: que disser
  rationale: 'O singular hebraico tem sentido distributivo: a sentença se refere a qualquer integrante das categorias mencionadas. O futuro do subjuntivo é idiomático em português.'
- source_word: מַשָּׂא יְהוָה
  choice: A carga de Yahweh
  rationale: מַשָּׂא pode significar “oráculo”, mas o contexto de Jeremias 23 explora seu sentido concreto de carga ou peso. “Carga” conserva o jogo de palavras e a força da repreensão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּפָקַדְתִּי עַל
  choice: eu castigarei
  rationale: Neste contexto judicial, פָּקַד עַל expressa intervenção punitiva; “castigarei” comunica o sentido de modo claro e digno.
- source_word: הָאִישׁ הַהוּא
  choice: esse homem
  rationale: Mantém o masculino singular do hebraico e individualiza o infrator.
- source_word: בֵּיתוֹ
  choice: a sua família
  rationale: בַּיִת designa aqui a unidade familiar, não apenas o edifício; “família” comunica esse sentido social com clareza.
theological_decisions:
- issue: Sentido de מַשָּׂא יְהוָה na polêmica de Jeremias
  choice: A carga de Yahweh
  alternative: O oráculo de Yahweh
  rationale: Embora מַשָּׂא seja um termo convencional para um pronunciamento profético, Jeremias 23:33–40 explora seu sentido literal de “carga”. A tradução principal preserva essa tensão, e a nota registra o sentido técnico possível.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O uso do nome próprio preserva a distinção lexical entre o tetragrama e títulos divinos como אֲדֹנָי.
- issue: Alcance do castigo sobre בֵּיתוֹ
  choice: a sua família
  alternative: a sua casa
  rationale: A expressão indica que o juízo alcança a unidade doméstica do infrator. “Família” evita que o leitor entenda apenas a construção física, sem ampliar além do sentido social provável.
translation_notes:
  register: Português moderno, claro e digno, com construção distributiva no singular (“que disser”) e vocabulário acessível. “Quanto ao” representa naturalmente a abertura topicalizada; “carga” mantém o jogo de palavras central do contexto.
