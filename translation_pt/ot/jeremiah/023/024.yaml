id: JER.23.24
reference: Jeremiah 23:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם יִסָּתֵ֨ר אִ֧ישׁ בַּ/מִּסְתָּרִ֛ים וַ/אֲנִ֥י לֹֽא אֶרְאֶ֖/נּוּ נְאֻם יְהוָ֑ה הֲ/ל֨וֹא אֶת הַ/שָּׁמַ֧יִם וְ/אֶת הָ/אָ֛רֶץ אֲנִ֥י מָלֵ֖א נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: pt
  text: Será que alguém pode se esconder em lugares secretos sem que eu o veja?[a] — declara Yahweh. Não sou eu que encho os céus e a terra? — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se alguém se esconder em lugares secretos, será que eu não o verei?”'
    reason: alternativa sintática
lexical_decisions:
- source_word: אִם
  choice: Será que ... pode
  rationale: Embora אִם normalmente introduza uma condição, aqui a construção tem força de pergunta retórica. “Será que ... pode” comunica naturalmente em português a impossibilidade de alguém escapar à visão divina, sem eliminar a alternativa sintática registrada na nota.
- source_word: יִסָּתֵר
  choice: se esconder
  rationale: O nifal admite sentido reflexivo ou passivo. Neste contexto, o reflexivo expressa a tentativa deliberada de ocultar-se e é idiomático em português.
- source_word: אִישׁ
  choice: alguém
  rationale: O substantivo masculino singular tem aqui referência humana genérica. “Alguém” preserva essa generalidade com maior naturalidade em português do que “um homem”, sem alterar o referente.
- source_word: בַּמִּסְתָּרִים
  choice: em lugares secretos
  rationale: Mantém o plural do hebraico e comunica esconderijos ou recantos ocultos em linguagem clara e digna.
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: sem que eu o veja
  rationale: Na pergunta retórica, a coordenação hebraica expressa a suposta consequência de esconder-se. “Sem que eu o veja” transmite essa relação naturalmente e conserva o pronome singular masculino.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” preserva o peso da fórmula profética, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: הֲלוֹא
  choice: Não sou eu que
  rationale: A partícula introduz uma pergunta retórica que espera resposta afirmativa. Esta formulação é natural em português e mantém a ênfase do pronome explícito אֲנִי.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Preserva os artigos definidos e o par abrangente do hebraico, sem reduzir o plural שָׁמַיִם ao singular.
- source_word: מָלֵא
  choice: encho
  rationale: Conserva a metáfora forte e concreta da presença divina que preenche os céus e a terra, evitando substituí-la por uma abstração doutrinária.
theological_decisions:
- issue: Linguagem da presença divina
  choice: Não sou eu que encho os céus e a terra?
  alternative: Não estou presente em todos os céus e em toda a terra?
  rationale: A tradução mantém o verbo e a metáfora de “encher”, conforme o hebraico, em vez de explicá-los por meio do conceito teológico abstrato de onipresença.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino, não apenas um título. A transliteração “Yahweh” preserva essa distinção.
- issue: Força sintática de אִם na pergunta retórica
  choice: Será que alguém pode se esconder ...?
  alternative: Se alguém se esconder ..., eu não o verei?
  rationale: A leitura escolhida expressa com clareza a força retórica provável, enquanto a nota preserva a possibilidade de uma formulação condicional mais formal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto. “Se esconder” foi preferido a “ocultar-se” por ser corrente e claro; “declara Yahweh” conserva a solenidade da fórmula profética. O travessão separa essa fórmula sem incorporá-la à pergunta.
