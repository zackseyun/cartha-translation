source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: pt
  text: A ira de Yahweh não voltará atrás até que ele tenha agido e cumprido os propósitos do seu coração.[a] Nos últimos dias, vocês compreenderão isso claramente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os planos do seu coração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Nos dias que virão”. O hebraico diz literalmente “Nos últimos dias”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: ira
  rationale: No idioma hebraico, אַף aplicado a Yahweh expressa ira, não o sentido literal de “nariz”. “Ira” mantém a força do contexto profético de juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא יָשׁוּב
  choice: não voltará atrás
  rationale: Preserva a imagem de שׁוּב, segundo a qual a ira não recua nem se retira antes da realização do propósito divino.
- source_word: עַד עֲשֹׂתוֹ וְעַד הֲקִימוֹ
  choice: até que ele tenha agido e cumprido
  rationale: “Agido” mantém amplo o objeto implícito de עשה, enquanto “cumprido” comunica naturalmente que הקים leva os propósitos à realização efetiva. A coordenação hebraica é preservada sem repetição pesada em português.
- source_word: מְזִמּוֹת לִבּוֹ
  choice: os propósitos do seu coração
  rationale: “Propósitos” evita a conotação necessariamente negativa de “maquinações”, e “coração” preserva a imagem hebraica da sede da intenção e da vontade.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Nos últimos dias
  rationale: Mantém a conhecida expressão profética e sua possível ressonância escatológica, sem determinar que ela seja obrigatoriamente um termo técnico.
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: vocês compreenderão isso claramente
  rationale: A formulação natural em português transmite a ideia intensificada de discernir ou compreender com entendimento, evitando uma repetição literal pouco idiomática.
theological_decisions:
- issue: Sentido temporal de בְּאַחֲרִית הַיָּמִים
  choice: Nos últimos dias
  alternative: Nos dias que virão
  rationale: A escolha preserva a tensão entre uma referência ampla ao futuro e uma possível dimensão escatológica, sem resolver a expressão em favor de apenas uma leitura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” explicita o plural do verbo hebraico. A estrutura foi levemente condensada para fluidez, sem eliminar a progressão entre a ação de Yahweh e o cumprimento de seus propósitos.
