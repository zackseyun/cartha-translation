source:
  edition: WLC
  text: כֹּ֥ה תֹאמְר֛וּ אִ֥ישׁ עַל רֵעֵ֖/הוּ וְ/אִ֣ישׁ אֶל אָחִ֑י/ו מֶה עָנָ֣ה יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: pt
  text: 'Assim cada um de vocês dirá ao seu próximo, e cada um ao seu irmão: “O que Yahweh respondeu? E o que Yahweh falou?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Introduz a maneira prescrita de falar e mantém o tom diretivo do discurso profético.
- source_word: תֹאמְרוּ אִישׁ
  choice: cada um de vocês dirá
  rationale: Preserva a segunda pessoa do plural de תֹאמְרוּ e expressa naturalmente o valor distributivo de אִישׁ em português.
- source_word: עַל רֵעֵהוּ
  choice: ao seu próximo
  rationale: No contexto de fala, עַל indica a pessoa a quem se dirige; “próximo” representa adequadamente רֵעַ.
- source_word: וְאִישׁ אֶל אָחִיו
  choice: e ao seu irmão
  rationale: A coordenação com “cada um” permite evitar uma repetição pesada, mantendo o termo masculino de parentesco אָח.
- source_word: מֶה עָנָה
  choice: O que ... respondeu?
  rationale: Conserva a pergunta direta e o sentido específico de ענה, “responder”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּמַה דִּבֶּר
  choice: O que ... falou?
  rationale: Mantém a segunda pergunta paralela e traduz דִּבֶּר pelo verbo amplo e natural “falar”, sem acrescentar a ideia de proclamação formal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o caráter de nome próprio e segue a evidência da fonte sem substituí-lo por um título.
- issue: Relação entre as duas perguntas
  choice: Duas perguntas paralelas, sem conjunção explícita na tradução
  alternative: “O que Yahweh respondeu e o que Yahweh falou?”
  rationale: O וּ hebraico coordena as perguntas. Em português, a justaposição de duas interrogativas reproduz com naturalidade o paralelismo e evita sugerir que formem uma única pergunta composta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação “cada um de vocês” conserva tanto o endereço direto ao público quanto a distribuição individual. “Próximo” e “irmão” mantêm o paralelismo interpessoal do hebraico.
