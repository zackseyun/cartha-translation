id: JER.23.1
reference: Jeremiah 23:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: pt
  text: Ai dos pastores que destroem e dispersam as ovelhas do meu pasto[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rebanho do meu pasto”.'
    reason: Alternativa lexical para צֹאן, que pode designar as ovelhas coletivamente, isto é, o rebanho.
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética de denúncia e lamento; “Ai” preserva com naturalidade a força de juízo em português.
- source_word: רֹעִים
  choice: pastores
  rationale: Mantém a metáfora explícita do hebraico para governantes ou líderes, sem interpretá-la no corpo do texto.
- source_word: מְאַבְּדִים
  choice: destroem
  rationale: Expressa a ação contínua do particípio em construção relativa e preserva a gravidade de אבד.
- source_word: וּמְפִצִים
  choice: e dispersam
  rationale: Reproduz o paralelismo participial e descreve de modo natural o espalhamento do rebanho.
- source_word: אֶת צֹאן
  choice: as ovelhas
  rationale: Torna concreta a imagem pastoril; “rebanho” continua sendo uma alternativa lexical legítima.
- source_word: מַרְעִיתִי
  choice: do meu pasto
  rationale: Representa diretamente o substantivo “pasto/pastagem” com o sufixo de primeira pessoa, preservando a ideia de pertencimento e cuidado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Fórmula profética solene e clara em português contemporâneo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Metáfora dos pastores e das ovelhas
  choice: Preservar “pastores” e “ovelhas” no texto principal.
  alternative: Interpretar a metáfora como “líderes” e “povo”.
  rationale: O hebraico emprega deliberadamente imagens pastoris, essenciais à unidade literária e teológica de Jeremias 23; explicitá-las como liderança e povo reduziria a ambiguidade metafórica do original.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo o vigor da denúncia profética e a imagem pastoril do hebraico.
