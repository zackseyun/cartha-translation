  text: וַ/הֲקִמֹתִ֧י עֲלֵי/הֶ֛ם רֹעִ֖ים וְ/רָע֑וּ/ם וְ/לֹא יִֽירְא֨וּ ע֧וֹד וְ/לֹא יֵחַ֛תּוּ וְ/לֹ֥א יִפָּקֵ֖דוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: pt
  text: E levantarei sobre eles pastores que cuidarão deles; eles não terão mais medo, nem ficarão abatidos, nem faltará nenhum[a], declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não lhes faltará nenhum” ou “e nenhum se perderá”. O hebraico provavelmente indica que nenhum membro do rebanho estará ausente ou sem ser contabilizado.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: levantarei
  rationale: Mantém a iniciativa divina e o sentido de fazer surgir ou estabelecer líderes, sem especificar além do hebraico.
- source_word: עֲלֵיהֶם
  choice: sobre elas
  rationale: A preposição expressa autoridade e responsabilidade dos pastores sobre as ovelhas; o feminino retoma naturalmente as ovelhas do contexto.
- source_word: רֹעִים
  choice: pastores
  rationale: Preserva a imagem concreta do pastoreio no contexto e evita associações eclesiásticas posteriores que poderiam vir com uma leitura institucional.
- source_word: וְרָעוּם
  choice: que cuidarão delas como pastores
  rationale: Expressa de modo natural em português o verbo cognato de 'pastores', mantendo explícita a metáfora sem a formulação pouco idiomática 'pastorearão-nas'.
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: elas já não terão medo
  rationale: Reproduz claramente o medo sofrido pelo rebanho e a ideia temporal de que isso não voltará a ocorrer.
- source_word: וְלֹא יֵחַתּוּ
  choice: nem ficarão apavoradas
  rationale: O nifal de חתת pode indicar ficar aterrorizado, abatido ou consternado; 'ficarão apavoradas' distingue o termo do medo anterior e se ajusta ao contexto de ameaça.
- source_word: וְלֹא יִפָּקֵדוּ
  choice: e nenhuma estará faltando
  rationale: Conserva o sentido provável de nenhuma ovelha estar ausente ou sem ser contabilizada, evitando carregar 'perdida' com conotações teológicas adicionais.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Traduz a fórmula profética de modo atual e solene, preservando o nome divino expresso no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Imagem dos pastores
  choice: Manter 'pastores' e explicitar que cuidarão do povo como pastores
  alternative: Traduzir interpretativamente como 'líderes' que 'cuidarão' do povo
  rationale: A imagem pastoral estrutura o contexto imediato e caracteriza tanto a liderança quanto o cuidado; substituí-la por termos abstratos enfraqueceria o simbolismo profético.
- issue: Alcance de וְלֹא יִפָּקֵדוּ
  choice: e nenhuma estará faltando
  alternative: nem terão falta de nada / nenhuma se perderá
  rationale: A formulação preserva a provável imagem de todas as ovelhas presentes e contabilizadas. Evita transformar o sujeito em carência material ou antecipar um sentido técnico de perdição.
- issue: Referente dos pronomes plurais
  choice: Usar o feminino plural, retomando as ovelhas implícitas no contexto
  alternative: Usar o masculino plural, retomando genericamente os membros do povo
  rationale: Embora o hebraico empregue formas masculinas por se referir ao povo, o português pode retomar de maneira natural o rebanho como 'ovelhas'; isso torna inteligível a cláusula distributiva sem alterar seu referente humano metafórico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição cognata hebraica foi representada por 'pastores que cuidarão delas como pastores', solução mais natural que 'pastores que as pastorearão'. O travessão destaca a fórmula profética final. O marcador [a] aparece no texto principal.
