  terminology: «Pastores», «Yahweh» e «declara» são escolhas adequadas. Mantém-se a linguagem pastoral sem importar um sentido eclesiástico técnico. «Ficarão abatidos» oferece uma distinção natural em relação a «terão medo» e é compatível com o alcance de חתת neste contexto.
