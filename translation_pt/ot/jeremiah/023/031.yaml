source:
  edition: WLC
  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: pt
  text: '“Eis que sou contra os profetas”, declara Yahweh, “os que tomam a própria língua e proclamam: ‘Declaração!’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que usam a própria língua e dizem: ‘Oráculo!’”. O hebraico é conciso e provavelmente irônico: retrata profetas que produzem com a própria boca palavras com aparência de autoridade divina.'
    reason: Alternativa lexical para «tomam» e esclarecimento da concisão e do jogo de palavras hebraico.
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que sou
  rationale: Preserva a introdução enfática e solene do anúncio divino, em linguagem profética digna e reconhecível em português.
- source_word: עַל
  choice: contra
  rationale: Na construção הִנְנִי עַל, a preposição expressa oposição e juízo, não posição espacial.
- source_word: הַנְּבִיאִם
  choice: os profetas
  rationale: Mantém o substantivo simples do hebraico sem acrescentar aqui o qualificativo interpretativo “falsos”, embora o contexto os condene.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de maneira natural a fórmula profética de autoridade e mantém o nome divino explícito.
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  choice: os que usam a própria língua
  rationale: O verbo significa literalmente “tomam”, mas, com “língua”, “usam” comunica em português natural a manipulação da própria fala; “própria” explicita o contraste contextual com uma palavra realmente recebida de Deus.
- source_word: וַיִּנְאֲמוּ נְאֻם
  choice: 'e proclamam: ‘Declaração!’'
  rationale: Conserva, tanto quanto possível em português, a repetição irônica da raiz hebraica ligada a pronunciamentos proféticos. A expressão final abrupta é mantida como fórmula citada, sem completar no texto aquilo que o hebraico deixa terse.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Identificação dos profetas condenados
  choice: os profetas
  alternative: os falsos profetas
  rationale: Embora o contexto deixe claro que são profetas enganadores, o versículo diz apenas “os profetas”; a tradução evita inserir no texto principal uma qualificação interpretativa.
- issue: Sentido da fórmula final נְאֻם
  choice: ‘Declaração!’
  alternative: ‘Oráculo!’; ‘declara Yahweh’
  rationale: O hebraico termina apenas com o substantivo נְאֻם, de modo abrupto. Não se acrescenta “Yahweh” à segunda ocorrência; isso preserva a concisão e a possível ironia contra a fabricação de fala revestida de autoridade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis que” conserva a solenidade profética; “usam a própria língua” evita a estranheza de uma tradução excessivamente literal, enquanto a nota registra essa possibilidade. As aspas distinguem a fala divina e a fórmula imitada pelos profetas.
