  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: pt
  text: Pois quem esteve no conselho de Yahweh[a], para ver e ouvir a sua palavra? Quem prestou atenção à minha palavra e a ouviu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no conselho confidencial de Yahweh” ou “na intimidade de Yahweh”. O termo hebraico סוֹד pode indicar tanto uma assembleia ou conselho quanto uma conversa reservada e íntima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão retórica ligada ao contexto anterior e preserva de modo natural a conexão argumentativa.
- source_word: עָמַד
  choice: esteve
  rationale: Expressa participação ou presença no conselho; o pretérito perfeito é natural em português na pergunta retórica.
- source_word: בְּסוֹד
  choice: no conselho
  rationale: No contexto da polêmica profética, pode designar a assembleia deliberativa divina, sem eliminar em nota os sentidos de conselho confidencial ou intimidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e segue a opção adotada pelo projeto.
- source_word: וְיֵרֶא
  choice: para ver
  rationale: A construção com infinitivo comunica de forma idiomática a relação de finalidade ou resultado, embora o hebraico também possa ser entendido simplesmente como sequência coordenada.
- source_word: וְיִשְׁמַע
  choice: e ouvir
  rationale: Preserva o par de verbos sensoriais ligado à recepção profética.
- source_word: דְּבָרוֹ
  choice: a sua palavra
  rationale: Mantém o valor profético e revelador de דָּבָר sem o restringir a mera informação.
- source_word: הִקְשִׁיב
  choice: prestou atenção a
  rationale: Representa a escuta atenta indicada pelo Hifil, com formulação clara e atual.
- source_word: דְבָרִי
  choice: minha palavra
  rationale: Preserva a mudança para a fala divina em primeira pessoa e mantém a correspondência com 'a sua palavra'.
- source_word: וַיִּשְׁמָע
  choice: e a ouviu
  rationale: Continua o motivo da audição e explicita em português o objeto feminino 'palavra'; não força o sentido possível, mas não necessário, de obedecer.
theological_decisions:
- issue: Sentido de סוֹד יְהוָה
  choice: o conselho de Yahweh
  alternative: o conselho confidencial/a intimidade de Yahweh
  rationale: A imagem de uma assembleia deliberativa divina se ajusta à controvérsia sobre a legitimidade profética, mas a amplitude lexical de סוֹד é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “palavra” e a mudança de “sua” para “minha” foram preservadas por sua importância retórica e teológica.
