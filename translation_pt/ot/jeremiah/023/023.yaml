  text: הַ/אֱלֹהֵ֧י מִ/קָּרֹ֛ב אָ֖נִי נְאֻם יְהוָ֑ה וְ/לֹ֥א אֱלֹהֵ֖י מֵ/רָחֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/023.yaml
  text: Am I a God who is near[a], declares Yahweh, and not a God who is far away?
translation:
  language: pt
  text: “Sou eu um Deus que está perto”, declara Yahweh, “e não um Deus que está longe?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou eu um Deus de perto”, declara Yahweh, “e não um Deus de longe?” A pergunta retórica nega que Yahweh esteja limitado ao que está perto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֱלֹהֵי מִ/קָּרֹב אָ֖נִי
  choice: Sou eu Deus apenas de perto
  rationale: A construção nominal hebraica, com ה interrogativo, forma uma pergunta retórica. Em português, a cópula é explicitada. “Apenas” torna natural o contraste implícito entre a esfera próxima e a distante, sem limitar o sentido à localização física de Deus.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética em registro digno e atual e translitera o nome divino יְהוָה.
- source_word: וְ/לֹא אֱלֹהֵי מֵ/רָחֹק
  choice: e não também Deus de longe?
  rationale: Conserva o paralelismo entre מִקָּרֹב e מֵרָחֹק. “Também” explicita em português a força inclusiva da pergunta retórica, segundo a qual Yahweh não está limitado ao que está perto.
theological_decisions:
- issue: Alcance da presença e do conhecimento divinos
  choice: Sou eu Deus apenas de perto ... e não também Deus de longe?
  alternative: Sou eu um Deus de perto ... e não um Deus de longe?
  rationale: 'A formulação principal comunica com clareza a pergunta retórica: Yahweh não está restrito ao que é próximo. A alternativa mais formal preserva mais diretamente a concisão e certa ambiguidade do hebraico; ela é registrada em nota.'
translation_notes:
  register: Português moderno, claro e solene, com ordem interrogativa natural. O nome divino é transliterado como “Yahweh”. As aspas separam a declaração divina da fórmula profética; o marcador [a] aparece no texto principal.
