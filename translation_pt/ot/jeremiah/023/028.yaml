base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: pt
  text: O profeta que tem um sonho conte o sonho; mas quem tem a minha palavra fale a minha palavra com verdade.[a] O que a palha tem a ver com o grão?[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fale a minha palavra fielmente” ou “fale a minha verdadeira palavra”. O hebraico pode destacar tanto a maneira verdadeira e fiel de falar quanto a veracidade da própria palavra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Que há em comum entre a palha e o grão?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: O profeta que tem um sonho
  rationale: Preserva o artigo definido com valor genérico e verte naturalmente o idioma hebraico que diz, de modo literal, que o sonho está 'com' o profeta.
- source_word: יְסַפֵּר חֲלוֹם
  choice: conte o sonho
  rationale: O piel de ספר significa aqui contar ou relatar; a formulação é corrente e não transforma o sonho, por si só, em revelação divina.
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: mas quem tem a minha palavra
  rationale: O valor adversativo explicita o contraste contextual entre o sonho e a palavra de Yahweh sem acrescentar uma identificação doutrinária do porta-voz.
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: fale a minha palavra com verdade
  rationale: A expressão conserva a proximidade lexical de אֱמֶת e permite entender a verdade como característica do modo de falar, sem eliminar a possibilidade de ela qualificar a própria palavra.
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: O que a palha tem a ver com o grão?
  rationale: Reproduz em português natural a pergunta idiomática que contrasta realidades incompatíveis. 'Palha' e 'grão' mantêm a generalidade dos termos agrícolas hebraicos.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa o nome divino por sua forma pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Contraste entre o sonho alegado e a palavra de Yahweh
  choice: 'Apresentar as duas orações como uma contraposição: o sonho pode ser contado, mas a palavra de Yahweh deve ser pronunciada com verdade.'
  alternative: Ligar as orações apenas com 'e', sem marcar contraste.
  rationale: O contexto imediato e a metáfora final sustentam um contraste forte, embora o texto não afirme aqui que todo sonho seja necessariamente falso.
- issue: Relação de אֱמֶת com 'fale' ou com 'minha palavra'
  choice: Usar 'com verdade' no texto e registrar a ambiguidade em nota.
  alternative: Traduzir exclusivamente como 'fielmente' ou como 'minha palavra verdadeira'.
  rationale: A sintaxe hebraica admite ênfase tanto na maneira verdadeira e fiel de falar quanto na veracidade da palavra; a tradução não deve encerrar essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com construção exortativa natural. 'Grão' evita especificar trigo, e 'palha' evita confundir o termo com palha miúda ou joio. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
