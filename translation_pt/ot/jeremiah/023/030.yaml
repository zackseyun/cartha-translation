  naturalness: “Portanto, eis que sou contra” é claro, solene e natural em português moderno. “Cada um de seu próximo” conserva a força distributiva sem sugerir que todos roubam mutuamente uns dos outros.
  terminology: “Yahweh”, “profetas”, “roubam” e “palavras” são escolhas adequadas e coerentes com o texto-fonte. “Próximo” é uma equivalência estabelecida e transparente para רֵעֵהוּ neste contexto.
