  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: pt
  text: Portanto, eis que sou contra os profetas — declara Yahweh — que roubam as minhas palavras, cada um de seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a consequência da denúncia anterior e conserva o encadeamento argumentativo da profecia.
- source_word: הִנְנִי עַל
  choice: eis que sou contra
  rationale: “Eis que” mantém o chamado enfático à atenção, e “sou contra” expressa a postura divina de oposição e juízo.
- source_word: הַנְּבִאִים
  choice: os profetas
  rationale: Tradução direta do substantivo plural que designa os que alegam transmitir revelação profética.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com força e naturalidade a fórmula profética, preservando o nome divino.
- source_word: מְגַנְּבֵי
  choice: que roubam
  rationale: O particípio caracteriza continuamente esses profetas; a oração relativa é natural em português.
- source_word: דְבָרַי
  choice: as minhas palavras
  rationale: Mantém o plural hebraico sem o transformar no singular coletivo “minha palavra” ou no interpretativo “minha mensagem”.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: uns dos outros
  rationale: Expressa em português corrente o valor distributivo da construção, isto é, cada profeta tomando as palavras de outro; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Expressão distributiva masculina אִישׁ ... רֵעֵהוּ
  choice: uns dos outros
  alternative: cada um de seu companheiro
  rationale: A formulação principal comunica naturalmente a reciprocidade distributiva no grupo dos profetas, sem alterar o referente; a estrutura masculina singular do hebraico permanece disponível na nota literal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” conserva a ênfase profética tradicional sem tornar a frase obscura; a colocação final da fórmula “declara Yahweh” evita uma interrupção sintática pesada.
