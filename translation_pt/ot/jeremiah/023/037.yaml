  text: כֹּ֥ה תֹאמַ֖ר אֶל הַ/נָּבִ֑יא מֶה עָנָ֣/ךְ יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: pt
  text: 'Assim você dirá ao profeta: “O que Yahweh respondeu a você[a], e o que Yahweh falou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica traduzida por “a você” tem sufixo de segunda pessoa feminina singular, embora “o profeta” seja masculino.
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Introduz a fórmula de fala prescrita e conserva de modo natural o sentido diretivo de ‘deste modo’.
- source_word: תֹאמַר
  choice: você dirá
  rationale: O imperfeito na segunda pessoa masculina singular tem força instrutiva; o futuro com ‘você’ é claro e atual em português.
- source_word: אֶל הַנָּבִיא
  choice: ao profeta
  rationale: Mantém o destinatário no singular e traduz diretamente a expressão preposicional.
- source_word: מֶה עָנָךְ יְהוָה
  choice: O que Yahweh respondeu a você
  rationale: Preserva o valor interrogativo de מֶה, o sentido de ‘responder’ de ענה e o complemento de segunda pessoa sem marcar gênero em português.
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: e o que Yahweh falou
  rationale: Mantém a segunda pergunta coordenada e distingue ‘falar’ de ‘responder’, refletindo o paralelismo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ preserva o nome pessoal e segue a convenção editorial fornecida.
- issue: Gênero do sufixo em עָנָךְ
  choice: a você, com nota
  alternative: traduzir explicitamente como feminino
  rationale: A vocalização massorética indica formalmente a segunda pessoa feminina singular, embora o destinatário ‘o profeta’ seja masculino. O português permite conservar a referência sem resolver a tensão, que é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘você’ para evitar o tom arcaico de ‘tu dirás’ e mantém ‘respondeu’/‘falou’ como verbos distintos.
