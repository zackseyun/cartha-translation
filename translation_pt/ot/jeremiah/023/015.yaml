  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos a respeito dos profetas: “Eis que vou alimentá-los com absinto e fazê-los beber água envenenada[a], pois dos profetas de Jerusalém saiu a impiedade para toda a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água de fel”. A expressão hebraica significa literalmente “águas de rosh”, nome de uma substância amarga ou venenosa.
    reason: Registra uma alternativa tradicional e a incerteza lexical do termo רֹאשׁ.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e o sentido concreto de צְבָאוֹת, em formulação clara e digna em português.
- source_word: עַל הַנְּבִאִים
  choice: a respeito dos profetas
  rationale: Mantém o sentido amplo da preposição na fórmula de anúncio; o teor condenatório fica evidente no próprio oráculo.
- source_word: הִנְנִי מַאֲכִיל
  choice: Eis que vou alimentá-los
  rationale: “Eis que” conserva a força enfática de הִנְנִי, enquanto “vou alimentá-los” expressa de modo natural a ação divina iminente e o valor causativo do particípio.
- source_word: לַעֲנָה
  choice: absinto
  rationale: Conserva a imagem concreta da planta proverbialmente amarga, em vez de reduzi-la ao conceito abstrato de amargura.
- source_word: מֵי רֹאשׁ
  choice: água envenenada
  rationale: Comunica com clareza a ideia de água associada a uma substância amarga ou venenosa; a expressão mais literal e sua incerteza lexical são registradas em nota.
- source_word: חֲנֻפָּה
  choice: impiedade
  rationale: Abrange a corrupção religiosa e moral indicada pelo substantivo hebraico, sem impor uma interpretação denominacional.
- source_word: יָצְאָה ... לְכָל הָאָרֶץ
  choice: saiu ... para toda a terra
  rationale: Preserva a imagem do mal que procede dos profetas de Jerusalém e se difunde pela terra em questão, sem ampliar necessariamente o referente ao planeta inteiro.
theological_decisions:
- issue: Imagem do juízo divino
  choice: Manter as imagens concretas de alimentar com absinto e fazer beber água envenenada
  alternative: Parafrasear como “fazê-los sofrer um castigo amargo”
  rationale: O hebraico apresenta imagens punitivas vívidas; preservá-las mantém o peso retórico e teológico do juízo sem explicar além do texto.
- issue: Alcance de הָאָרֶץ
  choice: “toda a terra”, deixando o referente contextual em aberto
  alternative: “todo o país” ou “toda a terra de Judá”
  rationale: “Terra” preserva a flexibilidade do termo hebraico; o contexto pode apontar para a terra de Judá, mas o versículo não a nomeia explicitamente.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é solene sem arcaísmos excessivos; “Eis que” foi mantido por sua função enfática no discurso profético. O marcador da nota foi colocado junto de “água envenenada”, expressão à qual a nota efetivamente se refere.
