source:
  edition: WLC
  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: pt
  text: 'Vivem dizendo aos que me desprezam[a]: “Yahweh falou: ‘Vocês terão paz[b]’”; e a todo aquele que segue a obstinação do próprio coração dizem: “Nenhuma calamidade virá sobre vocês.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos que me rejeitam” ou “aos que me tratam com desprezo”. O hebraico diz literalmente “aos que me desprezam”.
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode ter o sentido de bem-estar, segurança ou prosperidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “Nenhum mal virá sobre vocês”. Aqui, “mal” significa calamidade ou desastre, não maldade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: Vivem dizendo
  rationale: A combinação do particípio com o infinitivo absoluto intensifica a ação e lhe dá sentido reiterado. “Vivem dizendo” expressa repetição contínua em português natural.
- source_word: לִמְנַאֲצַי
  choice: aos que me desprezam
  rationale: O particípio de נאץ com sufixo de primeira pessoa indica os que desprezam ou rejeitam o falante. “Desprezam” preserva claramente a afronta pessoal.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh falou
  rationale: O perfeito verbal apresenta como consumada a alegada declaração divina. A formulação concisa mantém a reivindicação de autoridade feita pelos falsos profetas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino no texto hebraico, em vez de substituí-lo por um título.
- source_word: שָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם abrange paz, segurança e bem-estar. “Paz” preserva a formulação profética tradicional sem excluir as nuances mais amplas.
- source_word: יִהְיֶה לָכֶם
  choice: Vocês terão
  rationale: A construção existencial hebraica é vertida de modo idiomático e claro em português, mantendo a referência plural.
- source_word: וְכֹל הֹלֵךְ
  choice: e a todos os que seguem
  rationale: O hebraico descreve cada pessoa caracterizada por uma conduta habitual. O plural em português harmoniza naturalmente com o discurso dirigido ao grupo, sem perder o sentido geral.
- source_word: בִּשְׁרִרוּת לִבּוֹ
  choice: a obstinação do próprio coração
  rationale: שְׁרִרוּת denota teimosia ou obstinação. “Do próprio coração” conserva a ideia de uma disposição interior autônoma e persistente.
- source_word: אָמְרוּ
  choice: dizem
  rationale: Embora formalmente perfeito, o verbo integra a descrição presente e contínua da atividade dos falsos profetas. O presente é natural no contexto.
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: Nenhuma calamidade virá sobre vocês
  rationale: Neste contexto de juízo profético, רָעָה designa infortúnio ou desastre, não maldade moral. “Virá sobre vocês” preserva a imagem do hebraico.
theological_decisions:
- issue: Referente do sufixo de primeira pessoa em “aos que me desprezam”
  choice: O “me” refere-se a Yahweh.
  alternative: O “me” pode ser entendido como referência a Jeremias.
  rationale: O contexto trata da rejeição da palavra de Yahweh, e a cláusula seguinte invoca explicitamente o nome divino. A tradução mantém simplesmente “me”, como no hebraico, sem inserir uma identificação explicativa no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vivem dizendo” comunica a reiteração enfática sem soar técnico; “calamidade” evita que רָעָה seja interpretado como mal moral. O plural “todos os que seguem” torna natural a concordância com o discurso plural “vocês”, preservando o caráter coletivo da advertência.
