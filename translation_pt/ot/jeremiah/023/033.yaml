base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: pt
  text: 'Quando este povo, ou um profeta, ou um sacerdote lhe perguntar: “Qual é o oráculo[a] do SENHOR?”, você lhes responderá: “Que oráculo? Eu abandonarei vocês”, declara o SENHOR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico massá pode designar um «oráculo» e também um «peso» ou «fardo», criando aqui um jogo de palavras. Algumas versões antigas trazem: “Vocês são o fardo, e eu os rejeitarei”. O texto hebraico massorético diz: “Que oráculo? Eu abandonarei vocês”.'
    reason: Explica o sentido profético e o jogo de palavras de מַשָּׂא, além de registrar a variante antiga sem deslocá-la para o texto principal.
lexical_decisions:
- source_word: מַשָּׂא
  choice: mensagem pesada
  rationale: O termo pode significar tanto uma mensagem profética, frequentemente traduzida por “oráculo”, quanto um peso ou fardo. A expressão preserva o jogo de palavras explorado no contexto sem soar como termo técnico obscuro.
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: Eu abandonarei vocês
  rationale: Traduz diretamente o verbo נטשׁ, que aqui expressa rejeição ou abandono, em português corrente e digno.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Fórmula profética natural em português; SENHOR representa o nome divino יהוה conforme convenção editorial amplamente reconhecida.
theological_decisions:
- issue: Leitura da resposta אֶת־מַה־מַשָּׂא
  choice: “Que mensagem pesada?”
  alternative: “Vocês são a mensagem pesada” / “Vocês são o fardo”
  rationale: O texto massorético lê literalmente algo como “Que mensagem pesada?”, seguido de “Eu abandonarei vocês”. A alternativa depende de uma leitura antiga refletida por versões e de possível emenda de אֶת־מַה para אַתֶּם. A tradução principal segue o WLC fornecido e registra a variante em nota, sem apagar a dificuldade textual.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. “Mensagem pesada” busca conservar simultaneamente o sentido profético e o jogo verbal com “peso/fardo”; a nota apresenta de modo transparente a leitura alternativa.
