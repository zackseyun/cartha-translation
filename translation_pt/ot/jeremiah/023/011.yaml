id: JER.23.11
reference: Jeremiah 23:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
translation:
  language: pt
  text: Pois tanto o profeta como o sacerdote se corromperam[a]; até na minha casa encontrei a maldade deles[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiram com impiedade”, “tornaram-se profanos” ou “se contaminaram”. O verbo hebraico indica corrupção moral e religiosa.
    reason: lexical_alternative
  - marker: b
    text: “Minha casa” refere-se ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da denúncia no contexto anterior, preservando a força explicativa do hebraico.
- source_word: גַם ... גַם
  choice: tanto ... como
  rationale: Reproduz de forma idiomática a correlação hebraica e deixa claro que os dois grupos estão envolvidos.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente português corrente e preciso.
- source_word: כֹּהֵן
  choice: sacerdote
  rationale: Equivalente português corrente, adequado ao contexto do templo.
- source_word: חָנֵפוּ
  choice: se corromperam
  rationale: Expressa a corrupção moral e religiosa indicada pela raiz חנף sem reduzi-la à mera hipocrisia; a forma verbal também reflete naturalmente o perfeito hebraico.
- source_word: גַּם
  choice: até
  rationale: 'Realça a gravidade da acusação: a maldade foi encontrada até mesmo na casa de Yahweh.'
- source_word: בְּבֵיתִי
  choice: na minha casa
  rationale: Mantém a imagem literal hebraica; no contexto, a casa de Yahweh é o templo.
- source_word: מָצָאתִי
  choice: encontrei
  rationale: Tradução direta e natural do perfeito hebraico em narrativa ou declaração passada.
- source_word: רָעָתָם
  choice: a maldade deles
  rationale: Comunica claramente o mal moral praticado por eles e preserva o sufixo possessivo plural.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem o substituir por um título.
- issue: Sentido de חָנֵפוּ
  choice: se corromperam
  alternative: são ímpios; tornaram-se profanos; agiram com impiedade
  rationale: A opção mantém a amplitude da corrupção moral-religiosa do termo e evita restringi-lo à hipocrisia ou resolver em excesso se a ênfase recai sobre impiedade, profanação ou contaminação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “tanto... como” comunica a inclusão dos dois grupos; “até” preserva a intensificação do terceiro גַּם.
