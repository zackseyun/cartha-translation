base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: pt
  text: Mas, se eles tivessem estado no meu conselho[a], teriam feito o meu povo ouvir as minhas palavras e o teriam feito voltar do seu mau caminho e da maldade dos seus atos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no meu conselho secreto”, “na minha assembleia íntima” ou “na minha deliberação”. O termo hebraico סוֹד pode indicar um conselho confidencial, um círculo íntimo ou a deliberação nele realizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: No contexto, a conjunção introduz um contraste com a denúncia anterior dos falsos profetas; “Mas, se” expressa essa força adversativa.
- source_word: עָמְדוּ
  choice: tivessem estado
  rationale: O qatal integra uma condição contrária ao fato; o mais-que-perfeito do subjuntivo comunica isso naturalmente em português.
- source_word: בְּסוֹדִי
  choice: no meu conselho
  rationale: סוֹד pode designar um círculo íntimo ou uma assembleia confidencial; no contexto profético, “conselho” preserva a imagem da assembleia deliberativa divina, sem confundi-la com simples aconselhamento.
- source_word: וְיַשְׁמִעוּ
  choice: teriam feito o meu povo ouvir
  rationale: O hifil de שׁמע é causativo. Esta formulação conserva a ideia de fazer ouvir, sem substituí-la pela interpretação mais livre “teriam proclamado”.
- source_word: דְבָרַי
  choice: as minhas palavras
  rationale: Mantém o plural explícito do hebraico.
- source_word: אֶת־עַמִּי
  choice: o meu povo
  rationale: Tradução direta e natural da expressão que funciona como objeto.
- source_word: וִישִׁבוּם
  choice: o teriam afastado
  rationale: O sufixo plural hebraico retoma coletivamente “meu povo”; o singular coletivo é natural em português. “Afastado de” transmite neste contexto a ação causativa de fazê-lo voltar-se para longe do mal.
- source_word: מִדַּרְכָּם הָרָע
  choice: do seu mau caminho
  rationale: Preserva a metáfora hebraica do caminho como modo de conduta. “Seu” concorda com o singular coletivo “povo” em português.
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: e da maldade dos seus atos
  rationale: Conserva tanto o substantivo abstrato רֹעַ, “maldade”, quanto o termo concreto מַעֲלָלִים, “atos”, sem reduzir a expressão a “atos maus”.
theological_decisions:
- issue: Natureza do סוֹד divino
  choice: meu conselho
  alternative: meu conselho secreto; minha assembleia íntima; meu desígnio
  rationale: A expressão sugere acesso do verdadeiro profeta à assembleia ou círculo deliberativo de Deus. “Conselho” preserva essa imagem sem definir além do que permite o hebraico; a nota registra a amplitude lexical.
- issue: Sentido contrafactual da condição
  choice: se eles tivessem estado... teriam feito... e o teriam afastado
  alternative: se estivessem... fariam... e afastariam
  rationale: A construção apresenta o que os falsos profetas não fizeram e os resultados que teriam ocorrido. A forma contrafactual portuguesa torna essa relação clara sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe contrafactual foi mantida, bem como o paralelismo entre “mau caminho” e “maldade dos seus atos”. O singular coletivo “o meu povo... o” é idiomático em português e corresponde ao referente coletivo hebraico.
