id: JER.23.8
reference: Jeremiah 23:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: pt
  text: 'mas[a]: “Tão certo como vive Yahweh[b], que fez subir e trouxe a descendência[c] da casa de Israel da terra do norte e de todas as terras para onde eu os havia expulsado”, e eles habitarão em seu próprio solo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas, em vez disso”. A expressão hebraica substitui a antiga fórmula de juramento mencionada no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: Yahweh representa o nome divino YHWH; tradicionalmente, muitas traduções trazem “o SENHOR”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “os descendentes”. O termo hebraico é coletivo e também pode ser traduzido literalmente por “semente”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “em sua própria terra”. O hebraico emprega especificamente uma palavra que significa “solo” ou “chão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: mas
  rationale: No contexto de Jeremias 23:7–8, a expressão introduz uma substituição contrastiva da antiga fórmula de juramento. “Mas” mantém a ligação sintática com o versículo anterior; a nota explicita o valor corretivo de “mas, em vez disso”.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Expressa de modo natural e solene em português a fórmula hebraica de juramento, sem reduzi-la a uma simples afirmação de que Deus vive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: הֶעֱלָה וַאֲשֶׁר הֵבִיא
  choice: fez subir e trouxe
  rationale: Mantém distintos os dois verbos hebraicos e conserva a ressonância do êxodo e da reintegração, sem acrescentar um destino que não está expresso nesta oração.
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: a descendência da casa de Israel
  rationale: “Descendência” comunica o sentido coletivo de זֶרַע em português corrente, enquanto “casa de Israel” preserva a designação nacional e pactual.
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: da terra do norte
  rationale: Reproduz de perto a expressão geográfica e conserva o motivo jeremiano do norte como direção do exílio.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: e de todas as terras
  rationale: Preserva o plural do hebraico e sua imagem de dispersão, sem impor a noção político-moderna de países.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: para onde eu os havia expulsado
  rationale: Conserva a mudança para a primeira pessoa no discurso divino e a força causativa do verbo. O mais-que-perfeito situa a expulsão antes da restauração anunciada.
- source_word: וְיָשְׁבוּ
  choice: E eles habitarão
  rationale: “Habitarão” mantém o tom solene e a linguagem de restauração permanente, sem estreitar o sentido para apenas “se estabelecerão”.
- source_word: עַל אַדְמָתָם
  choice: em seu próprio solo
  rationale: “Solo” preserva a nuance concreta de אֲדָמָה, distinta de אֶרֶץ, e “em” é a preposição idiomática em português para habitação territorial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome pessoal. A transliteração preserva essa função e a nota oferece a convenção tradicional sem transformar um título em parte do texto principal.
- issue: Restauração descrita como novo êxodo e reintegração
  choice: manter “fez subir” e “trouxe” como verbos distintos
  alternative: fundir os dois verbos em “trouxe de volta” ou expandi-los como “resgatou e devolveu à terra”
  rationale: A distinção verbal sustenta a tensão entre libertação da dispersão e condução ao destino, mas evita explicitar além do hebraico uma interpretação teológica completa.
- issue: Mudança da terceira para a primeira pessoa divina
  choice: preservar “que fez subir” e depois “para onde eu os havia expulsado”
  alternative: 'uniformizar tudo na terceira pessoa: “para onde ele os havia expulsado”'
  rationale: A alternância está no texto hebraico e pode refletir a incorporação direta da voz divina. Uniformizá-la eliminaria uma tensão textual genuína.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com leitura natural no Brasil. A fórmula de juramento foi vertida idiomaticamente; conservaram-se “casa de Israel”, a distinção entre os dois verbos de condução e a mudança de pessoa gramatical do original. A pontuação mostra que o versículo continua a construção iniciada em Jeremias 23:7.
