  verdict: revise
  source_fidelity: 'O sentido geral e a estrutura aberta para o versículo seguinte são fiéis ao hebraico. A fórmula de juramento, o nome Yahweh, a referência aos filhos de Israel e a procedência do Egito foram bem preservados. Contudo, «fez os filhos de Israel subirem da terra do Egito» soa como uma subida física dentro/para fora do território e não comunica com naturalidade o uso convencional de העלה no contexto do êxodo: tirar/fazer sair do Egito.'
  naturalness: O registro é moderno e solene, e «Por isso, eis que vêm dias» e «Tão certo como vive Yahweh» funcionam bem em português internacional. A construção «fez ... subirem da terra do Egito», porém, é pouco idiomática e cria uma imagem espacial desnecessariamente estranha.
  terminology: «Yahweh» segue a decisão do projeto para o Tetragrama. «Filhos de Israel» mantém a forma lexical masculina do hebraico, e a nota oferece de modo apropriado a alternativa idiomática «os israelitas».
  issues:
