    issue: «fez os filhos de Israel subirem da terra do Egito» é uma tradução excessivamente literal do verbo העלה.
    rationale: No uso do êxodo, o hifil de עלה designa tirar ou fazer sair do Egito. Em português, «tirou ... da terra do Egito» transmite esse sentido estabelecido sem introduzir a sugestão pouco natural de que o povo simplesmente ‘subiu’ da terra.
  revised_text: 'Por isso, eis que vêm dias — declara Yahweh — em que já não dirão: “Tão certo como vive Yahweh, que tirou os filhos de Israel[a] da terra do Egito”,'
