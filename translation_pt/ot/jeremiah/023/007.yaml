source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: pt
  text: 'Por isso, eis que vêm dias — declara Yahweh — em que já não dirão: “Tão certo como vive Yahweh, que tirou os filhos de Israel[a] da terra do Egito”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “os israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a conclusão ou transição inferencial ligada ao contexto anterior, em português atual e claro.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a força de chamada de atenção e o tom solene do anúncio profético.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de perto a fórmula profética hebraica que anuncia um tempo futuro.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa naturalmente a fórmula profética de autoridade, preservando o nome divino.
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: em que já não dirão
  rationale: Comunica a cessação futura indicada por עוֹד e mantém indeterminado o sujeito plural, como no hebraico.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Traduz a fórmula fixa de juramento por uma expressão portuguesa reconhecível, mantendo sua força solene.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: que fez ... subirem
  rationale: Preserva o valor causativo do hifil de עלה e a imagem hebraica de subir da terra do Egito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina e a transparência lexical da expressão hebraica; a alternativa idiomática aparece em nota.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Conserva a formulação histórico-pactual completa, em vez de reduzi-la simplesmente a 'do Egito'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a forma masculina plural do hebraico, sem negar que, como designação coletiva, a expressão pode referir-se aos israelitas em geral.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com legibilidade brasileira. A pontuação mantém o versículo aberto para a continuação sintática no versículo seguinte. O marcador da nota foi colocado junto de “filhos de Israel”, termo ao qual a alternativa lexical efetivamente se refere.
