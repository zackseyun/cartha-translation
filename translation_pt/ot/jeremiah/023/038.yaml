  text: וְ/אִם מַשָּׂ֣א יְהוָה֮ תֹּאמֵרוּ֒ לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֧עַן אֲמָרְ/כֶ֛ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה מַשָּׂ֣א יְהוָ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תֹאמְר֖וּ מַשָּׂ֥א יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: pt
  text: 'Mas, se vocês disserem[a]: “O peso de Yahweh”, por isso, assim diz Yahweh: Visto que vocês disseram esta palavra: “O peso de Yahweh”, embora eu lhes tenha enviado uma mensagem, dizendo: “Não digam: ‘O peso de Yahweh’”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O oráculo de Yahweh”. A palavra hebraica massá pode designar um pronunciamento profético, mas “peso” foi mantido para preservar o jogo de palavras repetido nesta passagem.'
    reason: Alternativa lexical e preservação do jogo de palavras.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a proibição anterior, preservando tanto a conjunção quanto sua força adversativa no contexto.
- source_word: מַשָּׂא
  choice: peso
  rationale: O substantivo pode indicar uma carga e, por extensão, um pronunciamento profético. “Peso” preserva em português o jogo de palavras e a ironia explorados na passagem; “oráculo” continua registrado na nota como alternativa contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: תֹּאמֵרוּ
  choice: vocês disserem
  rationale: Reproduz a segunda pessoa masculina plural e concorda naturalmente com a construção condicional em português corrente.
- source_word: לָכֵן
  choice: então
  rationale: Marca de maneira natural a consequência da condição; evita a combinação menos fluida “se... portanto”.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém de forma concisa e digna a fórmula profética do mensageiro.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz explicitamente a causa do pronunciamento divino e evita uma sequência truncada iniciada apenas por “Porque”.
- source_word: אֲמָרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: vocês disseram estas palavras
  rationale: Refere-se à expressão específica que o povo repetia. O plural idiomático em português torna a referência à fórmula citada mais natural, sem alterar seu conteúdo.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: embora eu lhes tenha mandado dizer
  rationale: 'Explicita a força concessiva contextual: eles empregaram a expressão apesar da advertência enviada por Deus. “Mandado dizer” comunica naturalmente o envio de uma mensagem.'
- source_word: לֹא תֹאמְרוּ
  choice: Não digam
  rationale: Expressa diretamente a proibição na segunda pessoa do plural em português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama. “Yahweh” conserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Sentido de מַשָּׂא no jogo de palavras profético
  choice: peso
  alternative: oráculo; mensagem
  rationale: “Oráculo” é um sentido contextual legítimo, mas “peso” conserva a repetição e a ironia que estruturam a repreensão. A alternativa é documentada em nota para preservar a ambiguidade lexical.
- issue: Força de וָאֶשְׁלַח no contexto
  choice: 'relação concessiva: “embora eu lhes tenha mandado dizer”'
  alternative: 'coordenação simples: “e eu lhes mandei dizer”'
  rationale: A coordenação hebraica permite uma leitura simples, mas o contexto contrasta a fala persistente do povo com a proibição divina anterior. A formulação concessiva torna essa relação discursiva explícita sem mudar o conteúdo da advertência.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento amplamente compreensíveis no Brasil e no português internacional. A sintaxe preserva a solenidade da fórmula profética, enquanto “então” e “não digam” mantêm fluidez contemporânea. O versículo termina com vírgula por continuar sintaticamente no contexto seguinte.
