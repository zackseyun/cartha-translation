  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: pt
  text: 'Ouvi o que disseram os profetas, os que profetizam mentiras em meu nome, dizendo: “Sonhei! Sonhei!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que profetizam falsamente em meu nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O qal perfeito na primeira pessoa do singular expressa uma ação concluída. Em português, o pretérito perfeito é a forma natural neste contexto e mantém a relevância da declaração para a denúncia presente.
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: o que disseram
  rationale: A combinação do marcador de objeto com o relativo é vertida idiomaticamente por “o que”, preservando אָמְרוּ como pretérito perfeito.
- source_word: הַנְּבִאִים
  choice: os profetas
  rationale: Tradução corrente do substantivo definido נְבִאִים.
- source_word: הַנִּבְּאִים
  choice: os que profetizam
  rationale: O particípio nifal masculino plural está em aposição a “os profetas”; a oração relativa substantivada é clara e natural em português.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Expressão portuguesa consagrada para a alegação de autoridade ou autorização divina.
- source_word: שֶׁקֶר
  choice: mentiras
  rationale: O substantivo pode indicar o conteúdo falso das profecias ou funcionar adverbialmente. “Mentiras” conserva sua força concreta e acusatória.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo quotativo introduz diretamente as palavras atribuídas aos falsos profetas.
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: Sonhei! Sonhei!
  rationale: O pretérito perfeito português corresponde naturalmente ao perfeito hebraico. A repetição enfática é mantida sem suavização.
theological_decisions:
- issue: Natureza da alegação dos falsos profetas
  choice: os que profetizam mentiras em meu nome
  alternative: os que profetizam falsamente em meu nome
  rationale: שֶׁקֶר admite leitura substantiva, como conteúdo da profecia, ou adverbial, como modo falso de profetizar. O texto principal preserva a concretude de “mentiras”, enquanto a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em aposição e a repetição enfática do hebraico foram preservadas. O marcador [a] aparece no fim da frase para remeter à alternativa que afeta a descrição precedente.
