source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: pt
  text: Pois a terra está cheia de adúlteros; por causa da maldição[a], a terra está de luto, e as pastagens do deserto secaram. A trajetória deles é má[b], e sua força não é correta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do juramento” ou “por causa do juramento com maldição”. O termo hebraico pode designar um juramento, especialmente um que invoque uma maldição, ou a própria maldição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a corrida deles” ou “o caminho deles”. O termo hebraico emprega a imagem de correr para falar do rumo de sua conduta.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico, de modo conciso: “sua força não é assim”. Também pode ser entendido como “sua força não é reta” ou “seu poder não é justo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: adúlteros
  rationale: O particípio plural designa pessoas caracterizadas pelo adultério. A tradução preserva o sentido lexical direto e permite que o contexto profético sugira também a ressonância de infidelidade à aliança.
- source_word: מָלְאָה הָאָרֶץ
  choice: a terra está cheia
  rationale: No contexto centrado em Judá, אֶרֶץ refere-se naturalmente à terra ou ao território, não ao planeta inteiro.
- source_word: מִפְּנֵי אָלָה
  choice: por causa da maldição
  rationale: אָלָה pode indicar juramento, sobretudo um juramento que invoca maldição, ou a própria maldição. O luto da terra e a devastação favorecem aqui 'maldição', mantendo-se a alternativa em nota.
- source_word: אָבְלָה
  choice: está de luto
  rationale: Preserva a personificação da terra expressa pelo verbo 'prantear/estar de luto', em linguagem portuguesa natural.
- source_word: יָבְשׁוּ
  choice: secaram
  rationale: Expressa de modo direto o estado resultante das pastagens, sem acrescentar uma nuance aspectual indevida.
- source_word: נְאוֹת מִדְבָּר
  choice: as pastagens do deserto
  rationale: נְאוֹת indica lugares de pastagem, e מִדְבָּר designa a região erma ou desértica; a formulação é clara e idiomática.
- source_word: מְרוּצָתָם
  choice: a trajetória deles
  rationale: O substantivo deriva da ideia de correr e funciona metaforicamente para o rumo ou curso da conduta; 'trajetória' conserva a imagem melhor que uma simples explicitação como 'conduta'.
- source_word: רָעָה
  choice: é má
  rationale: O adjetivo qualifica moralmente a trajetória deles; 'má' reproduz a força ética de modo natural.
- source_word: גְבוּרָתָם
  choice: sua força
  rationale: גְבוּרָה denota força, poder ou valentia. 'Força' é claro, amplo e adequado ao contexto.
- source_word: לֹא כֵן
  choice: não é usada para o que é certo
  rationale: A expressão é breve e elíptica. Esta formulação comunica que a força deles não se orienta corretamente, evitando o português obscuro de uma tradução literal como 'não é assim'.
theological_decisions:
- issue: Se 'adúlteros' deve ser entendido literalmente ou como metáfora de infidelidade à aliança
  choice: Manter 'adúlteros' no texto principal
  alternative: os infiéis
  rationale: O lexema hebraico denota diretamente adultério. O contexto profético pode ampliar sua ressonância para a infidelidade à aliança, mas a tradução não deve decidir que o uso seja exclusivamente metafórico.
- issue: Sentido de אָלָה no contexto
  choice: maldição
  alternative: juramento; juramento com maldição
  rationale: O luto da terra e a seca apontam para a sanção ou maldição resultante, mas a polissemia genuína do termo é registrada em nota.
- issue: Sentido da cláusula elíptica וּגְבוּרָתָם לֹא־כֵן
  choice: sua força não é usada para o que é certo
  alternative: sua força não é correta; seu poder não é justo; sua força não é assim
  rationale: A formulação escolhida mantém a censura moral e produz português inteligível, enquanto a nota preserva a concisão e a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se a personificação da terra, a metáfora da corrida e as ambiguidades lexicais relevantes em notas. Os marcadores [a], [b] e [c] aparecem no texto na ordem das respectivas dificuldades.
