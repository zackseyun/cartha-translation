source:
  edition: WLC
  text: וְ/נָתַתִּ֥י עֲלֵי/כֶ֖ם חֶרְפַּ֣ת עוֹלָ֑ם וּ/כְלִמּ֣וּת עוֹלָ֔ם אֲשֶׁ֖ר לֹ֥א תִשָּׁכֵֽחַ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: pt
  text: E porei sobre vocês afronta eterna e vergonha eterna[a], que não serão esquecidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afronta perpétua e vergonha perpétua”. O hebraico עוֹלָם pode indicar duração eterna ou perpetuidade indefinida, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E porei
  rationale: Com עֲלֵיכֶם e substantivos abstratos, נתן expressa a imposição de uma condição; “porei sobre” preserva a imagem hebraica e soa dignamente natural.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: A preposição עַל indica aquilo que é posto sobre os destinatários; “vocês” oferece ampla legibilidade brasileira sem perder clareza.
- source_word: חֶרְפַּת
  choice: afronta
  rationale: חֶרְפָּה denota opróbrio, escárnio ou desonra pública. “Afronta” mantém esse aspecto público e se distingue do substantivo seguinte.
- source_word: עוֹלָם
  choice: eterna
  rationale: Neste oráculo de juízo, עוֹלָם comunica duração permanente ou indefinidamente contínua. “Eterna” conserva a força solene, enquanto a nota registra a alternativa lexical.
- source_word: וּכְלִמּוּת
  choice: e vergonha
  rationale: כְּלִמּוּת designa vergonha, desonra ou humilhação. “Vergonha” é corrente e preserva uma distinção adequada em relação a “afronta”.
- source_word: אֲשֶׁר לֹא תִשָּׁכֵחַ
  choice: que não serão esquecidas
  rationale: O nifal de שׁכח tem sentido passivo. Embora o verbo hebraico esteja no feminino singular, a tradução portuguesa retoma naturalmente os dois substantivos coordenados no plural.
theological_decisions:
- issue: Força de עוֹלָם em um oráculo de juízo
  choice: eterna
  alternative: perpétua
  rationale: A escolha mantém a gravidade e a duração contínua anunciadas pelo texto sem acrescentar uma definição doutrinária sobre a natureza metafísica dessa duração; a ambiguidade lexical é indicada em nota.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. A construção “porei sobre vocês” conserva o paralelismo e a imagem do hebraico; a concordância plural em “não serão esquecidas” explicita em português que a oração relativa abrange tanto a afronta como a vergonha.
