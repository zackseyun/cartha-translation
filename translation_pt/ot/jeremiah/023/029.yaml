base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: pt
  text: “Não é a minha palavra como fogo — oráculo de Yahweh — e como um martelo que despedaça a rocha?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não é
  rationale: Mantém a forma de pergunta retórica, que espera resposta afirmativa, sem transformá-la na afirmação interpretativa “Certamente”.
- source_word: דְבָרִי
  choice: a minha palavra
  rationale: Preserva o singular hebraico e apresenta a fala divina como uma realidade unificada nas duas comparações.
- source_word: כָאֵשׁ
  choice: como fogo
  rationale: Reproduz de modo natural e vívido a comparação introduzida pela preposição hebraica כ.
- source_word: נְאֻם יְהוָה
  choice: oráculo de Yahweh
  rationale: Conserva a forma nominal da fórmula profética hebraica e translitera o nome divino.
- source_word: וּכְפַטִּישׁ
  choice: e como um martelo
  rationale: Mantém tanto a coordenação quanto a segunda comparação, sem especificar além do hebraico o tipo de martelo.
- source_word: יְפֹצֵץ
  choice: que despedaça
  rationale: Expressa a ação intensa de quebrar em pedaços com linguagem atual e digna.
- source_word: סָלַע
  choice: a rocha
  rationale: “Rocha” é a equivalência portuguesa mais clara e natural para a imagem, sem restringi-la a penhasco ou rochedo.
theological_decisions:
- issue: Tradução da fórmula profética נְאֻם יְהוָה
  choice: oráculo de Yahweh
  alternative: declara Yahweh; pronunciamento de Yahweh
  rationale: “Oráculo” preserva a estrutura nominal e o caráter solene da fórmula hebraica; a nota registra a alternativa verbal idiomática sem eliminar a forma do texto-fonte.
translation_notes:
  register: Português moderno, claro e solene, com estrutura retórica preservada. As aspas distinguem a fala divina da fórmula profética parentética; “despedaça” conserva a força da imagem sem soar coloquial.
