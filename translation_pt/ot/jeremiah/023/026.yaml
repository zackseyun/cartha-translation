source:
  edition: WLC
  text: עַד מָתַ֗י הֲ/יֵ֛שׁ בְּ/לֵ֥ב הַ/נְּבִאִ֖ים נִבְּאֵ֣י הַ/שָּׁ֑קֶר וּ/נְבִיאֵ֖י תַּרְמִ֥ת לִבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: pt
  text: Até quando continuará isso[a] no coração dos profetas que profetizam mentira[b] e profetizam o engano de seus próprios corações?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Até quando haverá no coração dos profetas...?” A construção hebraica é elíptica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de forma mais compacta: “os falsos profetas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressão interrogativa temporal natural em português, que comunica a indignação e a impaciência presentes no contexto.
- source_word: הֲיֵשׁ
  choice: continuará isso
  rationale: A partícula existencial interrogativa aparece numa construção hebraica elíptica. A tradução explicita de modo comedido a situação já denunciada no contexto, produzindo uma pergunta compreensível em português.
- source_word: בְּלֵב
  choice: no coração
  rationale: Preserva a imagem hebraica do coração como centro do pensamento, da intenção e da vontade, sem reduzi-la apenas à emoção.
- source_word: הַנְּבִאִים
  choice: dos profetas
  rationale: Equivalente direto e natural do substantivo plural definido.
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: que profetizam mentiras
  rationale: Mantém a força verbal da expressão e destaca o conteúdo falso da profecia; o plural “mentiras” é idiomático em português, embora o hebraico use um substantivo coletivo/singular.
- source_word: וּנְבִיאֵי
  choice: e profetizam
  rationale: A formulação verbal em português preserva o paralelismo com a expressão anterior e evita uma sequência nominal pouco natural.
- source_word: תַּרְמִת
  choice: o engano
  rationale: Expressa a ideia de fraude ou falsidade deliberada contida no substantivo hebraico.
- source_word: לִבָּם
  choice: do próprio coração
  rationale: “Próprio” torna claro, sem alterar o sentido, que o engano procede do interior dos próprios profetas.
theological_decisions:
- issue: Sentido antropológico de לֵב
  choice: coração
  alternative: mente; íntimo
  rationale: “Coração” conserva a antropologia e a imagem bíblicas, nas quais o termo abrange pensamento, intenção e vontade.
- issue: Forma de traduzir נִבְּאֵי הַשָּׁקֶר
  choice: que profetizam mentiras
  alternative: falsos profetas; profetas da mentira
  rationale: A opção escolhida preserva a ênfase no ato e no conteúdo da profecia, em vez de converter a expressão apenas num título classificatório.
- issue: Elipse na pergunta com הֲיֵשׁ
  choice: Até quando continuará isso... ?
  alternative: Até quando haverá no coração dos profetas... ?
  rationale: A construção hebraica é elíptica. A tradução explicita o referente contextual sem determinar além do necessário qual pensamento específico ocupa o coração dos profetas; a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “profetizam” foi mantida para refletir o paralelismo e a acusação do hebraico. Os marcadores seguem a ordem associada às respectivas expressões no texto.
