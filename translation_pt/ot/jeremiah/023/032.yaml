    issue: Formulação “Eis que sou contra”
    rationale: Embora gramatical, soa menos idiomática em português contemporâneo do que “Eis que estou contra”, especialmente nesta fórmula de juízo.
  - severity: medium
    issue: Ruptura da sequência coordenada após “irresponsabilidade”
