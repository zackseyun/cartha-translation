  to: “Eis que estou contra os que profetizam sonhos mentirosos[a], declara Yahweh, que os contam e fazem meu povo se desviar com suas mentiras e sua irresponsabilidade[b]; eu não os enviei nem lhes dei ordem, e eles não trazem benefício algum a este povo, declara Yahweh.”
