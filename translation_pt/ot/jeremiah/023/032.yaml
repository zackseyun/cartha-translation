source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: pt
  text: “Eis que estou contra os que profetizam sonhos mentirosos[a], declara Yahweh, que os contam e fazem meu povo se desviar com suas mentiras e sua irresponsabilidade[b]; eu não os enviei nem lhes dei ordem, e eles não trazem benefício algum a este povo, declara Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sonhos falsos”. O hebraico diz literalmente “sonhos de mentira”, empregando o substantivo “mentira/falsidade” com valor atributivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua presunção”, “sua imprudência” ou “sua frivolidade”. O termo hebraico é difícil e sugere conduta irresponsável, temerária ou presunçosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: Eis que sou contra
  rationale: Preserva a força solene da fórmula profética e expressa com naturalidade a oposição e o juízo divinos indicados por עַל.
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: os que profetizam sonhos mentirosos
  rationale: A construção participial caracteriza essas pessoas por sua atividade; “sonhos mentirosos” mantém o substantivo שֶׁקֶר (“mentira/falsidade”) em função atributiva, sem reduzir a expressão apenas a “sonhos falsos”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética e conserva o nome divino expresso pelo Tetragrama.
- source_word: וַיְסַפְּרוּם
  choice: que os contam
  rationale: O pronome retoma os sonhos, e “contar sonhos” é uma expressão natural em português.
- source_word: וַיַּתְעוּ אֶת עַמִּי
  choice: fazem meu povo se desviar
  rationale: Expressa o valor causativo do hifil de תעה, preservando a imagem de desvio, em vez de limitá-la à ideia de engano intelectual.
- source_word: בְּשִׁקְרֵיהֶם
  choice: com suas mentiras
  rationale: O ב instrumental indica o meio pelo qual desviam o povo; “com” é idiomático em português e mantém o plural.
- source_word: וּבְפַחֲזוּתָם
  choice: e sua irresponsabilidade
  rationale: O termo raro e difícil sugere conduta ou fala imprudente, temerária e presunçosa. “Irresponsabilidade” comunica o núcleo sem restringi-lo exclusivamente à arrogância ou à frivolidade.
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: Eu não os enviei nem lhes dei ordem alguma
  rationale: O pronome independente אָנֹכִי recebe a ênfase de “Eu”. “Dei ordem” expressa צוה com clareza e distingue o ato de ordenar do envio.
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: e eles não trazem benefício algum
  rationale: “Benefício algum” transmite a negação intensificada pela combinação do infinitivo absoluto com o verbo finito.
- source_word: לָעָם הַזֶּה
  choice: a este povo
  rationale: Mantém a referência concreta a Judá e o leve distanciamento da expressão profética.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Natureza do desvio causado pelos falsos profetas
  choice: fazem meu povo se desviar
  alternative: enganam meu povo
  rationale: A opção escolhida preserva a amplitude da raiz תעה, que pode abranger tanto engano quanto afastamento do caminho correto, sem resolver a imagem em apenas um aspecto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Eis que” conserva o tom solene do anúncio profético; os travessões destacam a fórmula “declara Yahweh” sem alterar a sintaxe. Os marcadores foram colocados junto às expressões a que suas notas se referem.
