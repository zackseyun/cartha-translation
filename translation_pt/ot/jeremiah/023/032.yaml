  source_fidelity: A tradução transmite adequadamente a oposição de Yahweh aos profetas, os sonhos de falsidade, o relato desses sonhos, o desvio do povo, a falta de envio e ordem divinos e a inutilidade desses profetas. Contudo, a separação em frase autônoma de “Eu não os enviei...” enfraquece a sequência coordenada do hebraico, que continua a acusação até a declaração final.
  naturalness: “Eis que sou contra” é compreensível, mas “Eis que estou contra” é a formulação portuguesa mais natural para a fórmula profética de oposição. A manutenção da frase como uma única construção coordenada também torna o período mais fluente e próximo da organização do original.
  terminology: “Yahweh”, “sonhos mentirosos”, “fazem meu povo se desviar” e “irresponsabilidade” são escolhas defensáveis. “Dar ordem” traduz adequadamente o comissionamento expresso por צוה, sem acrescentar uma interpretação denominacional.
  issues:
