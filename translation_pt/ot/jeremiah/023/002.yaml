source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh, o Deus de Israel, acerca dos pastores[a] que pastoreiam o meu povo: “Vocês dispersaram o meu rebanho, afugentaram-no e não cuidaram dele. Eis que eu cuidarei de vocês por causa da maldade dos seus atos[b]”, declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra os pastores”; a preposição hebraica também pode introduzir uma declaração dirigida contra eles.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete o mesmo verbo nas duas orações: “não cuidaram dele... eu cuidarei de vocês”. Essa repetição cria uma inversão deliberada: por não terem cuidado do rebanho, os pastores receberão a intervenção judicial de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino do texto hebraico como nome próprio, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a construção hebraica e a relação expressa entre Yahweh e Israel.
- source_word: עַל
  choice: acerca de
  rationale: A preposição pode significar “acerca de” ou, neste contexto hostil, “contra”; a tradução principal preserva a formulação mais ampla, e a alternativa é registrada em nota.
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: os pastores que pastoreiam o meu povo
  rationale: Preserva a repetição retórica e a imagem pastoral central, sem interpretá-la diretamente como “líderes”.
- source_word: הֲפִצֹתֶם אֶת צֹאנִי
  choice: Vocês dispersaram o meu rebanho
  rationale: Expressa de modo direto a ação causativa e mantém a metáfora do rebanho.
- source_word: וַתַּדִּחוּם
  choice: afugentaram-no
  rationale: Comunica que os pastores fizeram o rebanho afastar-se, mantendo a imagem pastoral e a referência gramatical natural a “rebanho” em português.
- source_word: וְלֹא פְקַדְתֶּם אֹתָם
  choice: não cuidaram dele
  rationale: Neste primeiro uso, פקד denota a atenção e o cuidado que os pastores deviam ao rebanho.
- source_word: הִנְנִי
  choice: Eis que eu
  rationale: Conserva a solenidade e a força de anúncio iminente da fórmula profética.
- source_word: פֹקֵד עֲלֵיכֶם
  choice: cuidarei de vocês
  rationale: Repete o verbo da cláusula anterior para conservar a inversão irônica; a continuação deixa claro que se trata de intervenção judicial, não de cuidado favorável.
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  choice: por causa da maldade dos seus atos
  rationale: Mantém tanto a noção de maldade quanto a referência às ações concretas que fundamentam o juízo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Formulação profética solene e natural que mantém o nome divino.
theological_decisions:
- issue: A repetição de פקד no contraste entre negligência e juízo
  choice: Empregar “cuidar” nas duas orações e explicar a inversão em nota.
  alternative: Traduzir “não cuidaram dele” e depois “eu os castigarei”.
  rationale: A alternativa explicita imediatamente o sentido punitivo, mas apaga a repetição deliberada do hebraico. A redação escolhida conserva a tensão e permite que “por causa da maldade dos seus atos” indique o caráter judicial.
- issue: A identidade dos “pastores”
  choice: Manter a metáfora “pastores”, sem substituí-la por uma identificação interpretativa.
  alternative: Traduzir como “líderes” ou “governantes”.
  rationale: O texto censura responsáveis pelo povo, mas a imagem pastoral é essencial ao contexto e não deve ser dissolvida na tradução.
- issue: O valor de עַל na introdução do oráculo
  choice: Usar “acerca de” no texto e registrar “contra” em nota.
  alternative: Traduzir diretamente “contra os pastores”.
  rationale: As duas relações são lexicalmente possíveis. A repreensão favorece a nuance hostil, mas a forma mais abrangente preserva a ambiguidade sem ocultar a alternativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento brasileiras de leitura natural (“vocês”, “seus”). A repetição “pastores que pastoreiam” é intencional e reflete a ênfase do hebraico. “Afugentaram-no” evita ambiguidade quanto ao afastamento forçado do rebanho, enquanto “Eis que” preserva o tom solene do anúncio profético.
