source:
  edition: WLC
  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: pt
  text: Até hoje, eles não foram humilhados[a], não temeram e não andaram na minha lei nem nos meus estatutos, que pus diante de vocês e de seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não foram esmagados”, “não foram abatidos” ou “não se mostraram contritos”. O sentido contextual pode incluir “não se arrependeram”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, seus antepassados, as gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: se humilharam
  rationale: O pual de דכא pode expressar ser esmagado, abatido ou humilhado. Em português, a forma pronominal «se humilharam» comunica que os juízos não os levaram à humildade ou contrição, sem explicitar interpretativamente «se arrependeram».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Até hoje
  rationale: Expressão temporal portuguesa natural que preserva a continuidade do estado descrito.
- source_word: יָרְאוּ
  choice: temeram
  rationale: Mantém a amplitude de ירא, que no contexto pode envolver temor reverente e submissão a Deus, não apenas medo.
- source_word: הָלְכוּ בְתוֹרָתִי
  choice: andaram na minha lei
  rationale: Preserva a metáfora pactual hebraica de andar em determinado caminho normativo; «lei» é apropriado no paralelismo com «estatutos».
- source_word: וּבְחֻקֹּתַי
  choice: nem nos meus estatutos
  rationale: «Estatutos» conserva o registro jurídico-pactual de חֻקּוֹת; «nem» exprime naturalmente a negação coordenada depois de «não andaram».
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: que coloquei diante de vocês
  rationale: 'A construção נתן לפני é idiomática: Deus apresentou essas normas ao povo como obrigação. «Vocês» preserva inequivocamente a segunda pessoa do plural do hebraico.'
- source_word: וְלִפְנֵי אֲבוֹתֵיכֶם
  choice: e de seus pais
  rationale: «Pais» traduz diretamente o masculino plural אבות e designa as gerações anteriores; em português brasileiro, «seus» concorda naturalmente com «vocês».
theological_decisions:
- issue: Se דֻכְּאוּ deve ser traduzido explicitamente como arrependimento
  choice: não se humilharam
  alternative: não se arrependeram; não foram esmagados; não se mostraram contritos
  rationale: O contexto implica falta de arrependimento, mas o verbo não o declara de modo explícito. A tradução conserva a imagem de abatimento ou humilhação e deixa a implicação teológica aberta.
- issue: Natureza do temor expresso por יָרְאוּ
  choice: não temeram
  alternative: não tiveram medo; não reverenciaram
  rationale: «Temeram» preserva a tensão entre medo diante do juízo e temor reverente de Deus, sem restringir o sentido a apenas um desses aspectos.
- issue: Pessoa gramatical em לִפְנֵיכֶם e אֲבוֹתֵיכֶם
  choice: diante de vocês e de seus pais
  alternative: diante deles e de seus pais
  rationale: Os sufixos hebraicos são inequivocamente de segunda pessoa masculina plural; a fala dirige-se aos judeus no Egito. Alterá-los para a terceira pessoa apagaria essa mudança de referência presente no texto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se a metáfora bíblica «andar na lei», o termo pactual «estatutos» e a segunda pessoa plural explícita «vocês». A coordenação foi levemente enxugada para soar natural em português sem perder nenhuma negação do hebraico.
