  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ אֶ֚ל כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הַ/יֹּשְׁבִ֤ים בְּ/מִגְדֹּל֙ וּ/בְ/תַחְפַּנְחֵ֣ס וּ/בְ/נֹ֔ף וּ/בְ/אֶ֥רֶץ פַּתְר֖וֹס לֵ/אמֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: pt
  text: 'A palavra que veio a Jeremias a respeito de todos os judeus que moravam na terra do Egito — os que moravam em Migdol, Tafnes, Nof[a] e na terra de Patros — dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof é o nome hebraico da cidade egípcia mais conhecida como Mênfis.
    reason: cross_reference
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética tradicional e o caráter de comunicação divina, sem a explicitação interpretativa de “mensagem”.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: que veio a Jeremias
  rationale: Reproduz de modo natural em português a fórmula hebraica de recepção da palavra profética.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: para todos os judeus
  rationale: O segundo אֶל aponta naturalmente para os destinatários. “Judeus” é a forma corrente e inteligível em português, embora aqui designe especificamente pessoas oriundas de Judá.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: que moravam na terra do Egito
  rationale: “Moravam” comunica residência habitual em português atual, e “terra do Egito” conserva o substantivo explícito do hebraico.
- source_word: מִגְדֹּל
  choice: Migdol
  rationale: Transliteração convencional do topônimo hebraico.
- source_word: תַחְפַּנְחֵס
  choice: Tafnes
  rationale: Forma portuguesa tradicional e legível do topônimo.
- source_word: נֹף
  choice: Nof
  rationale: Mantém no texto principal o nome hebraico, deixando sua identificação histórica com Mênfis para a nota.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: terra de Patros
  rationale: Conserva o substantivo “terra”, expresso no hebraico, e translitera o topônimo.
- source_word: לֵאמֹר
  choice: 'dizia:'
  rationale: Introduz naturalmente, em português, o discurso que começa no versículo seguinte, evitando o pouco idiomático “dizendo” suspenso no fim do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “moravam” reflete a estrutura do hebraico; os travessões tornam clara a aposição geográfica. A forma “judeus” é corrente, mas deve ser entendida neste contexto como referência ao povo oriundo de Judá.
