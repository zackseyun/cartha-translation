source:
  edition: WLC
  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: pt
  text: Vocês se esqueceram dos atos maus[b] de seus pais, dos atos maus dos reis de Judá, dos atos maus das esposas deles[a], dos seus próprios atos maus e dos atos maus de suas esposas, todos praticados na terra de Judá e nas ruas de Jerusalém?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “as esposas dele”. O sufixo singular provavelmente tem sentido coletivo ou distributivo depois de “os reis de Judá”; por isso, “as esposas deles”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “males”, “coisas más” ou “maldades”. Aqui, “atos maus” se refere a ações praticadas, como indica o final do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: Vocês se esqueceram
  rationale: O perfeito hebraico em forma interrogativa expressa uma repreensão por um esquecimento passado com efeito presente. O pretérito perfeito é natural em português e mantém a força retórica.
- source_word: רָעוֹת / רָעֹתֵיכֶם
  choice: maldades
  rationale: O plural designa males concretos praticados pelos grupos enumerados. Em português, “maldades” pode indicar atos maus e permite conservar de modo natural a repetição enfática do hebraico.
- source_word: אֲבוֹתֵיכֶם
  choice: seus pais
  rationale: Mantém o termo masculino e a força familiar e geracional do hebraico; “antepassados” seria possível, mas menos direto.
- source_word: מַלְכֵי יְהוּדָה
  choice: os reis de Judá
  rationale: Tradução direta da construção genitiva hebraica.
- source_word: נָשָׁיו
  choice: as esposas deles
  rationale: Embora o sufixo hebraico seja formalmente singular, o antecedente contextual é “os reis de Judá”; a forma plural em português comunica o sentido coletivo ou distributivo.
- source_word: רָעֹתֵיכֶם
  choice: as maldades de vocês mesmos
  rationale: “Vocês mesmos” torna natural o contraste enfático entre as gerações anteriores, os governantes e os próprios ouvintes.
- source_word: נְשֵׁיכֶם
  choice: suas esposas
  rationale: Tradução contextual direta do substantivo com sufixo de segunda pessoa plural.
- source_word: אֲשֶׁר עָשׂוּ
  choice: todas praticadas
  rationale: A formulação retoma toda a lista de maldades sem introduzir em português um pronome masculino ambíguo. “Praticadas” expressa naturalmente atos moralmente culpáveis.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Preserva a designação geográfica e a ressonância territorial de אֶרֶץ.
- source_word: בְּחֻצוֹת יְרוּשָׁלִָם
  choice: nas ruas de Jerusalém
  rationale: “Ruas” é a equivalência moderna mais natural para os espaços públicos urbanos indicados por חֻצוֹת.
theological_decisions:
- issue: Sentido moral de רָעוֹת
  choice: maldades, entendidas como atos maus
  alternative: males; más ações
  rationale: A oração relativa com o verbo “fazer” favorece uma referência concreta a atos culpáveis, sem reduzir o termo a uma abstração moral.
- issue: Termo de parentesco אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução preserva o termo masculino e a acusação de culpa transmitida entre gerações, sem neutralizá-lo.
- issue: Referência coletiva de נָשָׁיו depois de “reis de Judá”
  choice: as esposas deles
  alternative: as esposas dele
  rationale: O sufixo singular hebraico é compreendido coletivamente ou distributivamente em relação aos reis. A concordância plural é necessária para transmitir esse sentido com clareza em português.
- issue: Alcance de אֲשֶׁר עָשׂוּ
  choice: a oração retoma as maldades de todos os grupos enumerados
  alternative: a oração se refere apenas ao grupo imediatamente anterior
  rationale: A posição ao final da enumeração e o plural verbal favorecem uma retomada abrangente. “Todas praticadas” preserva esse alcance sem especificar indevidamente um único agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se a repetição retórica de “maldades” presente no hebraico. O pronome “vocês” explicita a segunda pessoa plural sem regionalismo marcado; “esposas” evita a possível ambiguidade de “mulheres” no português atual.
