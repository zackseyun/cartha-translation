source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: Vocês mesmos viram toda a calamidade[a] que eu trouxe sobre Jerusalém e sobre todas as cidades de Judá. E eis que elas estão em ruínas neste dia[b], e ninguém mora nelas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o desastre”; aqui, o termo hebraico se refere à calamidade destrutiva do juízo, não ao mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “elas são uma ruína neste dia” ou “elas estão desoladas hoje”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética tradicional com cadência digna e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: É a forma consagrada do título e mantém sua referência ampla às hostes sob o comando divino.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta hebraica.
- source_word: אַתֶּם רְאִיתֶם
  choice: Vocês mesmos viram
  rationale: O pronome explícito אַתֶּם é enfático; 'vocês mesmos' conserva essa ênfase. O pretérito perfeito é natural para o testemunho já presenciado.
- source_word: כָּל הָרָעָה
  choice: toda a calamidade
  rationale: No contexto, רָעָה designa a desgraça destrutiva do juízo, não maldade moral.
- source_word: הֵבֵאתִי עַל
  choice: eu trouxe sobre
  rationale: Mantém de modo idiomático a causalidade explícita da forma hebraica.
- source_word: עָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Tradução convencional e adequada de עָרִים neste contexto.
- source_word: וְהִנָּם
  choice: 'Vejam: ... elas'
  rationale: A forma chama a atenção dos ouvintes e contém referência pronominal plural; 'Vejam' comunica essa força de modo atual, e 'elas' explicita o referente.
- source_word: חָרְבָּה הַיּוֹם הַזֶּה
  choice: hoje elas estão em ruínas
  rationale: Expressa naturalmente o estado presente de devastação. 'Hoje' traduz literalmente a expressão temporal sem acrescentar a duração sugerida por 'até hoje'.
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: e ninguém mora nelas
  rationale: Forma corrente e fiel de expressar a inexistência de habitantes nas localidades mencionadas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta o Tetragrama como nome próprio. A transliteração preserva esse dado textual sem substituí-lo por um título.
- issue: Agência divina na calamidade
  choice: que eu trouxe
  alternative: que sobreveio
  rationale: A primeira pessoa do verbo causativo atribui explicitamente a calamidade a Yahweh; a tradução conserva essa tensão teológica sem atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a fórmula profética formal, mas usa 'Vejam' e 'ninguém mora' para evitar arcaísmo desnecessário. Todos os marcadores de nota aparecem no texto.
