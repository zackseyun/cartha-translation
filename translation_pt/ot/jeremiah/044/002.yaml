  to: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: Vocês mesmos viram toda a calamidade[a] que eu trouxe sobre Jerusalém e sobre todas as cidades de Judá. E eis que elas estão em ruínas neste dia[b], e ninguém mora nelas.'
  rationale: A revisão substitui o imperativo «Vejam» por «E eis que», que corresponde mais precisamente à partícula deíctica hebraica, e troca «hoje» por «neste dia» para preservar o demonstrativo do original. As notas foram ajustadas para refletir alternativas portuguesas naturais sem alterar o sentido.
