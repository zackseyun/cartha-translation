review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente a fórmula profética, o nome divino, a ênfase em «vocês mesmos», a agência explícita de Yahweh na calamidade, o alcance sobre Jerusalém e as cidades de Judá, e a falta de habitantes. Contudo, «Vejam» transforma a partícula deíctica hebraica וְהִנָּם em um imperativo dirigido aos ouvintes; «e eis que» preserva melhor sua função discursiva. «Neste dia» mantém também o demonstrativo de הַיּוֹם הַזֶּה, que «hoje» torna menos explícito.
  naturalness: «E eis que elas estão em ruínas neste dia» é português moderno e digno, com registro profético adequado e ampla inteligibilidade. «Ninguém mora nelas» permanece natural e claro.
