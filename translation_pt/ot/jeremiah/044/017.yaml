source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: pt
  text: 'Mas certamente faremos tudo o que saiu da nossa boca: queimaremos incenso à Rainha dos Céus e derramaremos ofertas de bebida para ela, como fizemos nós e nossos antepassados, nossos reis e nossos oficiais, nas cidades de Judá e nas ruas de Jerusalém. Naquele tempo, tínhamos pão em abundância[a], vivíamos bem[b] e não sofríamos calamidade alguma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ficávamos satisfeitos de pão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “prosperávamos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: No contexto, introduz uma resposta desafiadora em contraste com a ordem anterior de Jeremias; o valor adversativo é o mais natural em português.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: certamente faremos
  rationale: O infinitivo absoluto intensifica o verbo finito; «certamente faremos» comunica a determinação enfática sem reproduzir artificialmente a repetição hebraica.
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: tudo o que saiu da nossa boca
  rationale: Preserva a imagem concreta da fala e comunica naturalmente aquilo que os interlocutores declararam ou prometeram cumprir.
- source_word: לְקַטֵּר
  choice: queimaremos incenso
  rationale: Em contexto cultual, o verbo designa a produção de fumaça sacrificial, particularmente pela queima de incenso.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: à Rainha dos Céus
  rationale: Reproduz diretamente o título da divindade venerada pelos interlocutores, sem o endossar nem associá-lo a tradições posteriores.
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: derramaremos ofertas de bebida para ela
  rationale: Expressa de forma acessível a ação ritual de derramar líquidos como oferta; «libações» seria mais conciso, porém menos transparente para muitos leitores.
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: nós e nossos antepassados, nossos reis e nossos oficiais
  rationale: «Antepassados» comunica o sentido histórico de אבותינו; «oficiais» representa שרים no contexto governamental sem restringi-lo necessariamente a príncipes.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: nas cidades de Judá e nas ruas de Jerusalém
  rationale: «Ruas» é uma tradução ampla e natural de חֻצוֹת, embora praças ou espaços abertos também possam estar em vista.
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: tínhamos pão em abundância
  rationale: Comunica o idioma literal «ficávamos satisfeitos de pão» como uma afirmação de fartura, preservando a imagem do pão.
- source_word: וַנִּהְיֶה טוֹבִים
  choice: vivíamos bem
  rationale: Mantém o sentido amplo de estar ou passar bem sem limitar a expressão hebraica exclusivamente à prosperidade econômica.
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: não sofríamos calamidade alguma
  rationale: Neste contexto, רָעָה indica desgraça ou calamidade, não mal moral; «sofríamos» transmite idiomaticamente o hebraísmo «não víamos».
theological_decisions:
- issue: Tradução de um título divino idolátrico
  choice: Rainha dos Céus
  alternative: rainha do céu / rainha dos céus
  rationale: O título hebraico é apresentado diretamente como objeto da adoração condenada no contexto, sem suavização e sem importar associações teológicas posteriores.
- issue: Natureza do bem-estar alegado pelos idólatras
  choice: vivíamos bem
  alternative: prosperávamos
  rationale: A expressão hebraica é ampla e literalmente indica que eles estavam bem. A tradução evita afirmar mais especificamente prosperidade material, embora o pão em abundância dê ao contexto uma dimensão econômica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe foi dividida em duas frases para clareza, preservando a determinação desafiadora dos interlocutores, a linguagem cultual e a sequência histórica do hebraico.
