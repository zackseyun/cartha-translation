  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/פְּנֵ֣י רָעָתָ֗/ם אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי לָ/לֶ֣כֶת לְ/קַטֵּ֔ר לַ/עֲבֹ֖ד לֵ/אלֹהִ֣ים אֲחֵרִ֑ים אֲשֶׁר֙ לֹ֣א יְדָע֔וּ/ם הֵ֖מָּה אַתֶּ֥ם וַ/אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: pt
  text: por causa do mal que fizeram para me provocar à ira, indo queimar incenso e servir a outros deuses[a], que não conheceram — eles, vocês e seus pais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorar outros deuses”. O verbo hebraico pode indicar serviço religioso ou adoração.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “que nem eles, nem vocês, nem seus pais conheceram”. O hebraico termina com a enumeração enfática: “eles, vocês e seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם
  choice: por causa do mal
  rationale: A locução prepositiva tem valor causal neste contexto, e רָעָה designa o mal moral praticado, não uma calamidade sofrida.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que fizeram
  rationale: Mantém a simplicidade da oração relativa hebraica sem acrescentar uma ideia mais específica como “cometeram”.
- source_word: לְהַכְעִסֵנִי
  choice: para me provocar à ira
  rationale: Preserva a força causativa do hifil e explicita a ira provocada, em linguagem digna e compreensível.
- source_word: לָלֶכֶת
  choice: indo
  rationale: Expressa o infinitivo de maneira ou meio ligado aos atos seguintes, sem tornar a frase portuguesa excessivamente pesada.
- source_word: לְקַטֵּר
  choice: queimar incenso
  rationale: No contexto de culto idólatra, o piel de קטר designa normalmente a queima de incenso.
- source_word: לַעֲבֹד
  choice: servir
  rationale: Conserva o sentido amplo de serviço e lealdade religiosa de עבד, sem reduzi-lo apenas ao ato formal de adoração.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: É a correspondência direta e convencional para deuses distintos do SENHOR.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: que não conheceram
  rationale: Mantém o verbo “conhecer” e sua possível dimensão relacional, sem substituí-lo por uma interpretação como “reconheceram”.
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: eles, vocês e seus pais
  rationale: Reproduz a enumeração enfática e a referência masculina de אֲבוֹת, usando “vocês” para clareza do plural na variedade-alvo.
theological_decisions:
- issue: Linguagem do serviço prestado a outros deuses
  choice: servir a outros deuses
  alternative: adorar outros deuses
  rationale: עבד abrange serviço, devoção e lealdade a uma divindade; “servir” preserva essa amplitude, enquanto “adorar” explicita apenas uma de suas dimensões.
- issue: Estrutura enfática dos que não conheceram esses deuses
  choice: que não conheceram — eles, vocês e seus pais
  alternative: que nem eles, nem vocês, nem seus pais conheceram
  rationale: A redação principal conserva a aposição enfática e algo abrupta do hebraico; a alternativa oferece a mesma relação sintática de modo mais explícito.
- issue: Termo de parentesco וַאֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” preserva a forma masculina e a correspondência lexical mais direta, sem neutralização interpretativa.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção com travessão preserva a ênfase incomum da enumeração hebraica; “vocês” deixa inequívoco o plural da segunda pessoa.
