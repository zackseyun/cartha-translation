  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: pt
  text: Mas, desde que deixamos de queimar incenso à Rainha dos Céus[a] e de derramar ofertas de bebida para ela, temos sentido falta de tudo e temos perecido[b] pela espada e pela fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rainha dos Céus” é o título da deusa cultuada pelas pessoas que falam neste trecho.
    reason: cultural_note
  - marker: b
    text: 'Ou: “temos sido consumidos” ou “temos chegado ao fim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן אָז
  choice: Mas, desde que
  rationale: A expressão introduz o ponto inicial temporal; “desde que” liga naturalmente esse ponto ao verbo “deixamos”. “Mas” expressa a contraposição ao discurso anterior, embora o ו também possa ser entendido simplesmente como continuativo.
- source_word: חָדַלְנוּ
  choice: deixamos de
  rationale: Forma corrente e clara em português para o sentido de cessar uma atividade.
- source_word: לְקַטֵּר
  choice: queimar incenso
  rationale: No contexto cultual, o verbo designa fazer fumaça sacrificial, frequentemente mediante a queima de incenso.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: à Rainha dos Céus
  rationale: Preserva o título hebraico da divindade feminina mencionada no contexto; “dos Céus” é natural em português e reflete a forma plural hebraica.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: e de derramar para ela ofertas de bebida
  rationale: Explicita de maneira acessível o ato ritual de derramar líquidos como oferta, evitando o termo menos conhecido “libações” no texto principal.
- source_word: חָסַרְנוּ כֹל
  choice: temos sentido falta de tudo
  rationale: Comunica de modo natural a privação abrangente expressa pelo verbo חָסַר e por כֹל.
- source_word: וּבַחֶרֶב וּבָרָעָב
  choice: pela espada e pela fome
  rationale: A preposição ב indica aqui os meios ou as circunstâncias pelos quais ocorre a destruição.
- source_word: תָּמְנוּ
  choice: temos sido exterminados
  rationale: O verbo תמם expressa ser levado ao fim ou consumido; “exterminados” se ajusta ao paralelismo com espada e fome, enquanto a nota preserva alternativas lexicais possíveis.
theological_decisions:
- issue: Identidade e tradução de מְלֶכֶת הַשָּׁמַיִם
  choice: Rainha dos Céus, título da deusa cultuada pelos falantes
  alternative: rainha dos céus, sem capitalização titular
  rationale: O texto apresenta um título de uma divindade feminina do culto condenado no contexto. A tradução mantém esse título sem associá-lo a usos cristãos posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Ofertas de bebida” foi preferido a “libações” por clareza popular; a ordem “derramar para ela” evita possível leitura de que a bebida fosse derramada sobre a deusa.
