id: JER.44.4
reference: Jeremiah 44:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: pt
  text: 'Contudo, enviei a vocês, vez após vez, todos os meus servos, os profetas[a], dizendo: “Por favor, não façam esta coisa detestável[b], que eu odeio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “levantando cedo e enviando”, expressão idiomática que comunica insistência, diligência e repetição.
    reason: cultural_note
  - marker: b
    text: Ou “esta coisa abominável” ou “esta abominação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Contudo, enviei
  rationale: 'O waw faz a narrativa avançar, mas o contexto favorece uma leve nuance adversativa: apesar da persistente desobediência do povo, Deus continuou enviando mensageiros.'
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Expressa de modo natural em português a direção para a segunda pessoa do plural.
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: todos os meus servos, os profetas
  rationale: Mantém os dois substantivos e a relação apositiva, ressaltando que os profetas atuam por incumbência divina.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: vez após vez
  rationale: Traduz o valor idiomático da expressão hebraica — ação insistente, diligente e repetida — enquanto a imagem literal é preservada em nota.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente para introduzir diretamente o conteúdo da mensagem.
- source_word: אַל נָא תַעֲשׂוּ
  choice: Por favor, não façam
  rationale: “Não façam” preserva a proibição, e “por favor” comunica a partícula de apelo נָא sem enfraquecer a ordem.
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: esta coisa detestável
  rationale: דבר tem aqui o sentido geral de “coisa” ou “ato”, e תועבה indica algo moral e religiosamente repulsivo, no contexto ligado à idolatria.
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: que eu odeio
  rationale: O presente expressa naturalmente em português a atitude firme e contínua de Deus diante dessa prática.
theological_decisions:
- issue: Expressão da repulsa divina pela prática idólatra
  choice: que eu odeio
  alternative: que detesto; que odiei
  rationale: A formulação conserva a declaração direta e forte do hebraico sobre a oposição moral de Deus ao ato, sem ampliá-la com categorias doutrinárias não explicitadas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para associar “vez após vez” claramente ao envio repetido dos profetas. As notas preservam tanto a imagem idiomática hebraica quanto alternativas para o termo forte תועבה.
