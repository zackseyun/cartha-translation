  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹא הִטּ֣וּ אֶת אָזְנָ֔/ם לָ/שׁ֖וּב מֵ/רָֽעָתָ֑/ם לְ/בִלְתִּ֥י קַטֵּ֖ר לֵ/אלֹהִ֥ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: pt
  text: Mas eles não deram ouvidos nem inclinaram os ouvidos para se afastarem da sua maldade, a fim de não queimarem incenso a outros deuses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: escutaram
  rationale: Neste contexto de repreensão profética, o verbo indica acolher e atender à mensagem, não apenas percebê-la auditivamente. “Escutaram” preserva essa força sem explicitar demais com “obedeceram”.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: inclinaram os ouvidos
  rationale: Mantém a imagem hebraica de voltar atentamente o ouvido, em linguagem portuguesa clara e digna.
- source_word: לָשׁוּב מֵרָעָתָם
  choice: para se afastarem da sua maldade
  rationale: שׁוב com מִן expressa deixar ou afastar-se de uma conduta má. “Afastarem-se” comunica esse movimento sem introduzir o termo teológico mais específico “arrepender-se”.
- source_word: לְבִלְתִּי קַטֵּר
  choice: a fim de não queimarem incenso
  rationale: לְבִלְתִּי marca finalidade negativa, e קטר designa aqui o ato cultual de queimar incenso. A tradução conserva a especificidade concreta do hebraico.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: A preposição indica o destinatário da prática cultual; “a outros deuses” é natural e fiel em português.
theological_decisions:
- issue: Sentido do verbo cultual קטר no contexto da idolatria
  choice: queimarem incenso a outros deuses
  alternative: fazerem ofertas a outros deuses
  rationale: Embora o verbo possa funcionar em certos contextos como referência mais ampla a ofertas produzidas por fogo ou fumaça, aqui sua expressão concreta e mais diretamente atestada é “queimar incenso”. Mantê-la evita ampliar sem necessidade o sentido do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição entre “escutaram” e “inclinaram os ouvidos” foi preservada por refletir o paralelismo enfático do hebraico.
