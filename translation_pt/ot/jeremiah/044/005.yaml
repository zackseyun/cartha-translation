  naturalness: «Escutaram» pode sugerir apenas percepção auditiva e é um pouco menos adequado ao tom de repreensão profética. «Não deram ouvidos» transmite naturalmente em português a recusa de atender à advertência, sem impor «obedecer». O paralelismo com «nem inclinaram os ouvidos» permanece claro e solene.
