review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de julgamento e a repetição de espada e fome. Contudo, o hebraico emprega referentes plurais em relação aos membros do remanescente («que puseram o rosto deles»; «para residirem»), e a redação deve refletir isso de modo consistente. A construção «cairão à espada e serão consumidos pela fome» é uma leitura sintaticamente possível e defensável de יִפֹּלוּ בַּחֶרֶב בָּרָעָב יִתַּמּוּ.
  naturalness: O texto é claro e mantém registro profético apropriado. «Para morar ali como estrangeiro» soa menos natural e cria uma oscilação singular/coletivo; «para residir ali como estrangeiros» é mais fluente e preciso. «Juramento de maldição» é compreensível, mas «fórmula de maldição» comunica mais idiomaticamente o uso de אָלָה neste contexto; a nota pode preservar explicitamente a nuance de juramento invocatório.
  terminology: «Remanescente», «Judá», «Egito», «espada», «fome» e «vergonha» são adequados. «Fórmula de maldição» distingue satisfatoriamente אָלָה de קְלָלָה («maldição») sem sugerir que as vítimas façam um juramento; a nota registra que a fórmula pode ter a forma de juramento que invoca maldição.
  issues:
  - severity: medium
    issue: Número e referência em «para morar ali como estrangeiro»
    rationale: 'Embora «remanescente» seja formalmente singular em português, o hebraico especifica os integrantes plurais desse grupo: «que puseram o rosto deles» e, em seguida, o verbo de residir. «Como estrangeiros» explicita corretamente que se trata das pessoas que compõem o remanescente e evita uma concordância coletiva pouco natural.'
  - severity: low
    issue: «Um juramento de maldição» pode ser entendido como o juramento que eles próprios proferem
    rationale: אָלָה designa com frequência uma fórmula invocada contra alguém, frequentemente em contexto de juramento e maldição. «Fórmula de maldição» é mais idiomático no português atual para o efeito de tornar-se exemplo invocado em maldições; a nota conserva a dimensão de juramento.
  revised_text: “Tomarei o remanescente de Judá que decidiu entrar na terra do Egito para residir ali como estrangeiros. Todos chegarão ao fim na terra do Egito. Cairão à espada e serão consumidos pela fome. Do menor ao maior, morrerão à espada e de fome. Tornar-se-ão uma fórmula de maldição[a], um horror, uma maldição e uma vergonha.”
  revised_footnotes:
  - marker: a
    text: 'Ou: “um juramento de maldição”. O termo hebraico pode designar uma fórmula de juramento que invoca uma maldição.'
    reason: Esclarece a nuance de אָלָה e registra uma alternativa idiomática sem confundi-lo com קְלָלָה, “maldição”, que vem logo depois.
  revision_rationale: A revisão corrige a referência plural implícita nos membros do remanescente e torna mais idiomática a expressão para אָלָה. Mantém-se a leitura sintática possível que associa a espada a «cairão» e a fome a «serão consumidos», bem como a força cumulativa do anúncio de julgamento.
