source:
  edition: WLC
  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: pt
  text: “Tomarei o remanescente de Judá que decidiu entrar na terra do Egito para residir ali como estrangeiros. Todos chegarão ao fim na terra do Egito. Cairão à espada e serão consumidos pela fome. Do menor ao maior, morrerão à espada e de fome. Tornar-se-ão uma fórmula de maldição[a], um horror, uma maldição e uma vergonha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um juramento de maldição”. O termo hebraico pode designar uma fórmula de juramento que invoca uma maldição.'
    reason: Esclarece a nuance de אָלָה e registra uma alternativa idiomática sem confundi-lo com קְלָלָה, “maldição”, que vem logo depois.
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Tomarei
  rationale: Mantém o sentido básico de לקח e deixa que o contexto comunique que Deus os toma para julgamento, sem acrescentar a ideia mais específica de capturá-los.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: o remanescente de Judá
  rationale: “Remanescente” expressa de modo preciso o grupo que restou depois da calamidade e é corrente no registro bíblico em português.
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: que decidiu
  rationale: O idioma hebraico, literalmente relacionado a “pôr o rosto”, indica uma decisão firme. A formulação portuguesa comunica essa determinação com naturalidade.
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם
  choice: entrar na terra do Egito
  rationale: בוא com אֶרֶץ indica entrar em uma terra; “entrar” preserva claramente o movimento em direção ao Egito.
- source_word: לָגוּר שָׁם
  choice: para morar ali como estrangeiro
  rationale: גור não significa apenas residir, mas viver como estrangeiro ou residente temporário; a expressão explicita essa nuance em português atual.
- source_word: וְתַמּוּ כֹל
  choice: Todos chegarão ao fim
  rationale: Reproduz o valor de תם, ser acabado ou chegar ao fim, e mantém a afirmação abrangente de כֹל.
- source_word: יִפֹּלוּ בַּחֶרֶב
  choice: Cairão à espada
  rationale: Preserva a imagem concreta de נפל e a fórmula profética tradicional de morte pela espada.
- source_word: בָּרָעָב יִתַּמּוּ
  choice: serão consumidos pela fome
  rationale: 'Expressa a conclusão ou exaustão causada pela fome. A disposição das palavras no hebraico favorece a correspondência paralela: cair pela espada e ser consumido pela fome.'
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: Do menor ao maior
  rationale: Mantém o merismo hebraico que abrange todos, sem determinar se a gradação é de idade ou posição social.
- source_word: בַּחֶרֶב וּבָרָעָב יָמֻתוּ
  choice: morrerão à espada e de fome
  rationale: Traduz diretamente מות e conserva os dois meios de julgamento repetidos no texto.
- source_word: וְהָיוּ לְאָלָה
  choice: Tornar-se-ão um juramento de maldição
  rationale: אָלָה pode indicar um juramento que invoca uma maldição. A formulação mantém o componente de juramento e o distingue do substantivo posterior קְלָלָה.
- source_word: לְשַׁמָּה וְלִקְלָלָה וּלְחֶרְפָּה
  choice: um horror, uma maldição e uma vergonha
  rationale: Preserva a sequência de substantivos de julgamento e traduz חֶרְפָּה por “vergonha”, termo natural para desonra pública.
theological_decisions:
- issue: Força e repetição da sentença divina
  choice: Foram mantidas as referências diretas a chegar ao fim, cair, ser consumido e morrer.
  alternative: Suavizar ou condensar tudo em “serão destruídos”.
  rationale: Os diversos verbos hebraicos dão peso cumulativo ao anúncio de julgamento e não devem ser reduzidos a uma afirmação genérica.
- issue: Relação sintática entre espada, fome e os verbos
  choice: “Cairão à espada e serão consumidos pela fome.”
  alternative: “Cairão pela espada e pela fome; chegarão ao fim.”
  rationale: A ordem e o paralelismo do hebraico permitem associar בַּחֶרֶב a יִפֹּלוּ e בָּרָעָב a יִתַּמּוּ. A opção escolhida produz uma leitura clara sem eliminar a estrutura retórica; a alternativa permanece gramaticalmente possível.
- issue: Distinção entre אָלָה e קְלָלָה
  choice: “um juramento de maldição” e, depois, “uma maldição”.
  alternative: Traduzir ambos apenas por “maldição” ou usar “juramento” sem qualificação.
  rationale: A escolha conserva a distinção lexical e torna perceptível que אָלָה frequentemente designa um juramento que invoca uma maldição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Remanescente” e “à espada” preservam o registro profético tradicional sem arcaísmo excessivo; “morar ali como estrangeiro” comunica em linguagem comum a nuance social de גור. O marcador [a] foi colocado junto à expressão que efetivamente explica.
