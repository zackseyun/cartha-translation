revisions:
- from: “Tomarei o remanescente de Judá que decidiu entrar na terra do Egito para morar ali como estrangeiro. Todos chegarão ao fim na terra do Egito. Cairão à espada e serão consumidos pela fome. Do menor ao maior, morrerão à espada e de fome. Tornar-se-ão um juramento de maldição[a], um horror, uma maldição e uma vergonha.”
  to: “Tomarei o remanescente de Judá que decidiu entrar na terra do Egito para residir ali como estrangeiros. Todos chegarão ao fim na terra do Egito. Cairão à espada e serão consumidos pela fome. Do menor ao maior, morrerão à espada e de fome. Tornar-se-ão uma fórmula de maldição[a], um horror, uma maldição e uma vergonha.”
  rationale: A revisão corrige a referência plural implícita nos membros do remanescente e torna mais idiomática a expressão para אָלָה. Mantém-se a leitura sintática possível que associa a espada a «cairão» e a fome a «serão consumidos», bem como a força cumulativa do anúncio de julgamento.
  reviewer_model: gpt-5.6-terra
