  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: pt
  text: Não foi do incenso que vocês queimaram nas cidades de Judá e nas ruas de Jerusalém — vocês e seus antepassados, seus reis e seus oficiais, e o povo da terra — que Yahweh se lembrou e que lhe subiu ao coração?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «subiu sobre o seu coração»; expressão que indica que o assunto chegou à consideração interior de Yahweh.
    reason: Esclarece o idioma hebraico preservado no texto e sua linguagem antropomórfica.
lexical_decisions:
- source_word: הֲלֹוא
  choice: Não foi ... que
  rationale: Preserva a pergunta retórica, que espera uma resposta afirmativa, em uma construção natural em português.
- source_word: הַקִּטֵּר אֲשֶׁר קִטַּרְתֶּם
  choice: do incenso que vocês queimaram
  rationale: Expressa tanto o objeto cultual quanto o ato de queimá-lo, evitando uma formulação excessivamente técnica. A preposição «de» é exigida pela construção portuguesa «lembrar-se de».
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: nas cidades de Judá e nas ruas de Jerusalém
  rationale: Tradução locativa direta; «ruas» representa naturalmente os espaços públicos indicados por חֻצוֹת, sem excluir sua possível referência a praças.
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם
  choice: vocês e seus antepassados
  rationale: «Vocês» oferece legibilidade internacional com forte naturalidade brasileira; «antepassados» comunica aqui o sentido genealógico de אָבוֹת sem restringi-lo aos pais imediatos.
- source_word: מַלְכֵיכֶם וְשָׂרֵיכֶם וְעַם הָאָרֶץ
  choice: seus reis e seus oficiais, e o povo da terra
  rationale: Mantém todos os grupos mencionados. «Oficiais» evita sugerir que שָׂרִים fossem necessariamente príncipes de sangue real, e «povo da terra» preserva a expressão hebraica sem impor uma classificação social específica.
- source_word: זָכַר יְהוָה
  choice: Yahweh se lembrou
  rationale: Representa o sentido comum de זכר e conserva o nome divino pessoal expresso pelo Tetragrama.
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: e isso lhe subiu ao coração
  rationale: Preserva a imagem antropomórfica e o movimento ascendente do idioma hebraico. «Isso» retoma coletivamente a prática de queimar incenso, sem forçar uma concordância literal opaca em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a forma «Yahweh» preserva o nome pessoal, sem substituí-lo por um título.
- issue: Linguagem antropomórfica de עַל לִבּוֹ
  choice: lhe subiu ao coração
  alternative: lhe veio à mente
  rationale: A tradução mantém a imagem hebraica do coração como centro da consideração interior, em vez de reduzi-la silenciosamente a uma formulação puramente cognitiva.
translation_notes:
  register: Português atual, digno e acessível, com «vocês» para a segunda pessoa plural. Os travessões delimitam a longa enumeração dos participantes e tornam clara a estrutura da pergunta retórica. A locução incomum «subiu ao coração» foi mantida de propósito e explicada em nota.
