revisions:
- from: Assim, entre o remanescente de Judá que foi residir como estrangeiro na terra do Egito, não haverá ninguém que escape nem sobrevivente que volte para a terra de Judá, para a qual anseiam[a] voltar e ali morar. Pois não voltarão, a não ser alguns que escaparem.
  to: Assim, não haverá escapado nem sobrevivente entre o remanescente de Judá que vai residir como estrangeiro ali, na terra do Egito, e voltar para a terra de Judá, para a qual anseiam[a] voltar e ali morar; pois não voltarão, a não ser os que escaparem.
  rationale: A revisão restabelece a relação dos infinitivos «residir» e «voltar» com o grupo que vai ao Egito, em vez de fazer «voltar» qualificar apenas um sobrevivente. Conserva a formulação abrangente de juízo, a exceção final e a expressão de desejo explicada na nota, sem harmonizar a tensão do texto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente o contraste entre escapar e sobreviver, o «remanescente de Judá», o desejo de voltar e a exceção final. Contudo, desloca «voltar para a terra de Judá» para uma oração relativa dependente de «ninguém que escape nem sobrevivente que volte», em vez de mantê-lo como o infinitivo de propósito associado aos que vão ao Egito. Isso altera a articulação sintática e enfraquece a repetição intencional do hebraico: eles vão residir no Egito e voltar a Judá, embora não voltarão, exceto os que escaparem.'
  naturalness: O português é claro e de registro apropriado. «Foi residir» é menos adequado para o particípio plural hebraico e para a construção de finalidade que segue; «vão residir ... e voltar» mantém melhor a estrutura e continua natural. «Ninguém que escape» é inteligível, mas «nenhum escapado» ou «ninguém que escape» pode ser usado sem associar indevidamente «que volte» aos dois substantivos.
  terminology: «Remanescente», «terra do Egito», «anseiam», «voltar» e «morar» são escolhas naturais e semanticamente adequadas. A nota explica de modo sóbrio o idiomatismo de «erguer a alma» e está corretamente ancorada em «anseiam».
  issues:
  - severity: medium
    issue: O infinitivo «voltar para a terra de Judá» foi reanalisado como relativo de «sobrevivente que volte».
    rationale: 'Em hebraico, וְלָשׁוּב continua a caracterização dos membros do remanescente que vão ao Egito: vão ali residir como estrangeiros e retornar à terra de Judá. A negação posterior («pois não voltarão») então contradiz expressamente essa expectativa, antes da exceção final. A redação deve conservar essa sequência.'
  - severity: low
    issue: «que foi residir» singulariza uma referência plural e apresenta a ação como simplesmente concluída.
    rationale: O particípio הַבָּאִים é plural e caracteriza o grupo. «que vão residir» reproduz de maneira clara a relação com os infinitivos de finalidade, sem exigir decidir além do necessário sobre o aspecto contextual.
  revised_text: Assim, não haverá escapado nem sobrevivente entre o remanescente de Judá que vai residir como estrangeiro ali, na terra do Egito, e voltar para a terra de Judá, para a qual anseiam[a] voltar e ali morar; pois não voltarão, a não ser os que escaparem.
  revised_footnotes:
