base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: pt
  text: Assim, não haverá escapado nem sobrevivente entre o remanescente de Judá que vai residir como estrangeiro ali, na terra do Egito, e voltar para a terra de Judá, para a qual anseiam[a] voltar e ali morar; pois não voltarão, a não ser os que escaparem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “erguem a sua alma”, expressão hebraica que indica dirigir o desejo ou ansiar por algo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּלִיט וְשָׂרִיד
  choice: ninguém que escape nem sobrevivente
  rationale: Distingue aquele que consegue escapar daquele que permanece vivo após a calamidade, evitando o sentido moderno de criminoso procurado que “fugitivo” pode sugerir em português.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: o remanescente de Judá
  rationale: Mantém o termo bíblico tradicional em sentido histórico e descritivo, sem qualificá-lo como fiel.
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: que foi residir como estrangeiro
  rationale: O particípio identifica o grupo que se deslocou para o Egito; “residir como estrangeiro” expressa a condição de residente não nativo indicada por גור.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Conserva o substantivo אֶרֶץ e o tom solene do oráculo.
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: que volte para a terra de Judá
  rationale: Liga o infinitivo ao resultado negado — não haverá sobrevivente que volte —, leitura natural da sintaxe e do contexto, sem inserir um marcador temporal ausente no hebraico.
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: anseiam
  rationale: Traduz idiomaticamente a expressão hebraica “erguer a sua alma”, cujo sentido aqui é dirigir intensamente o desejo a algo; a imagem literal é preservada em nota.
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: voltar e ali morar
  rationale: Preserva os dois infinitivos e expressa com clareza o retorno desejado e a residência subsequente.
- source_word: כִּי לֹא יָשׁוּבוּ כִּי אִם פְּלֵטִים
  choice: Pois não voltarão, a não ser alguns que escaparem
  rationale: Mantém a negação geral e a exceção final. “Alguns” torna idiomática em português a referência plural indefinida, sem determinar um número.
theological_decisions:
- issue: Sentido teológico de “remanescente de Judá”
  choice: Expressão mantida em sentido histórico e descritivo
  alternative: “remanescente fiel de Judá”
  rationale: O contexto descreve judeus sobreviventes que estão no Egito sob juízo; o texto não os caracteriza como um grupo fiel.
- issue: Tensão entre a negação de sobreviventes e a exceção final
  choice: Preservar tanto a afirmação abrangente quanto “a não ser alguns que escaparem”
  alternative: Harmonizar a frase eliminando a exceção ou enfraquecendo a negação
  rationale: O hebraico apresenta deliberadamente a negação seguida da exceção; a tradução não deve resolver essa tensão textual.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção evita “fugitivo”, que em português corrente pode sugerir alguém procurado pela justiça, e usa formas verbais naturais para preservar a distinção entre escapar e sobreviver.
