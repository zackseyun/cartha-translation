  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹ֠תֵן אֶת פַּרְעֹ֨ה חָפְרַ֤ע מֶֽלֶךְ מִצְרַ֨יִם֙ בְּ/יַ֣ד אֹֽיְבָ֔י/ו וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשׁ֑/וֹ כַּ/אֲשֶׁ֨ר נָתַ֜תִּי אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה בְּ/יַ֨ד נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל אֹיְב֖/וֹ וּ/מְבַקֵּ֥שׁ נַפְשֽׁ/וֹ׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que entregarei o faraó Hofra, rei do Egito, nas mãos de seus inimigos e dos que procuram tirar-lhe a vida, assim como entreguei Zedequias, rei de Judá, nas mãos de Nabucodonosor[a], rei da Babilônia, inimigo de Zedequias e aquele que procurava tirar-lhe a vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz a forma “Nabucodrezar”; “Nabucodonosor” é a forma tradicional em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e verte diretamente o nome divino conforme a orientação do projeto.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que entregarei
  rationale: “Eis que” mantém a força solene e deítica; o futuro comunica o valor iminente do particípio no contexto, enquanto “entregarei” expressa naturalmente a ideia de pôr alguém sob o poder de outro.
- source_word: פַּרְעֹה חָפְרַע
  choice: o faraó Hofra
  rationale: Emprega a forma hebraica do nome, adaptada à ortografia portuguesa, em vez da forma histórica grega Apriés.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem idiomática hebraica de submissão ao poder alheio e a repetição estrutural do versículo.
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: os que procuram tirar-lhe a vida
  rationale: Comunica com clareza o sentido da expressão hebraica sem reduzir o objetivo implícito simplesmente a “matar”, preservando a imagem de buscar a vida de alguém.
- source_word: כַּאֲשֶׁר נָתַתִּי
  choice: assim como entreguei
  rationale: Marca de forma natural a comparação explícita entre o destino de Hofra e o de Zedequias.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Adota a forma convencional e reconhecível em português; a forma específica refletida pelo hebraico é registrada em nota.
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: seu inimigo, que procurava tirar-lhe a vida
  rationale: Mantém ambos os predicados singulares referentes a Nabucodonosor; a oração relativa soa natural em português e preserva a relação explicativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Segue a política declarada do projeto, conserva o caráter de nome próprio e não introduz preferência denominacional.
- issue: Aspecto temporal de הִנְנִי נֹתֵן
  choice: entregarei
  alternative: estou entregando
  rationale: O particípio com הִנְנִי pode apresentar uma ação iminente com certeza vívida. O futuro é mais natural em português neste anúncio profético, sem enfraquecer sua certeza.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantiveram-se a fórmula profética, a imagem das “mãos” e a repetição temática, evitando literalismos pouco naturais.
