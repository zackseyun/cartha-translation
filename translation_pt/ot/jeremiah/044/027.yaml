  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: pt
  text: Eis que estou atento a eles para o mal, e não para o bem; e todo homem de Judá que está na terra do Egito chegará ao fim pela espada e pela fome, até que sejam consumidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com solenidade a declaração divina e conserva a força de chamar a atenção própria do registro profético.
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: estou atento a eles
  rationale: Expressa a vigilância ativa e contínua de שׁקד sem antecipar na preposição a hostilidade, explicitada na frase seguinte.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: para o mal, e não para o bem
  rationale: Preserva a antítese lexical direta do hebraico. Neste contexto, “mal” designa dano ou calamidade de juízo, não maldade moral.
- source_word: וְתַמּוּ
  choice: chegará ao fim
  rationale: Traduz o sentido de acabar ou ser levado ao fim, com formulação natural em português e concordância distributiva com “todo homem”.
- source_word: כָל אִישׁ יְהוּדָה
  choice: todo homem de Judá
  rationale: Mantém a forma masculina singular empregada distributivamente no texto hebraico.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרַיִם
  choice: que está na terra do Egito
  rationale: Conserva a sintaxe distributiva no singular e a expressão geográfica completa.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: pela espada e pela fome
  rationale: Mantém a fórmula de juízo recorrente em Jeremias e o valor instrumental das preposições.
- source_word: עַד כְּלוֹתָם
  choice: até que sejam exterminados
  rationale: Comunica a consumação total do grupo indicada por כלה, distinguindo-a do verbo anterior e preservando a severa finalidade da frase.
theological_decisions:
- issue: Linguagem do juízo divino e o sentido de רָעָה
  choice: para o mal
  alternative: para a calamidade; para o dano
  rationale: A tradução conserva a oposição formal “mal/bem”, mas entende “mal” como resultado danoso ou calamidade judicial, sem atribuir maldade moral a Deus.
- issue: Linguagem masculina distributiva em כָל אִישׁ יְהוּדָה
  choice: todo homem de Judá
  alternative: toda pessoa de Judá; todos os homens de Judá
  rationale: A opção mantém o masculino singular distributivo do original sem neutralizá-lo nem transformar sua estrutura em plural.
translation_notes:
  register: Português moderno, solene e acessível, com cadência profética. “Eis que” preserva o registro bíblico sem arcaísmo excessivo. Não foram incluídas notas, pois as alternativas não são indispensáveis para a compreensão do versículo; consequentemente, não há marcadores no texto.
