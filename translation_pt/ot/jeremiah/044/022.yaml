  to: E Yahweh já não pôde suportar isso, por causa da maldade dos atos de vocês, por causa das abominações que cometeram. Por isso, a terra de vocês tornou-se ruína, desolação[a] e maldição[b], sem nenhum habitante, tal como está hoje.
