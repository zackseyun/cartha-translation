source:
  edition: WLC
  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: pt
  text: E Yahweh já não pôde suportar isso, por causa da maldade dos atos de vocês, por causa das abominações que cometeram. Por isso, a terra de vocês tornou-se ruína, desolação[a] e maldição[b], sem nenhum habitante, tal como está hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “objeto de horror” ou “de espanto”. O termo hebraico pode descrever tanto a desolação quanto o assombro que ela provoca.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “objeto de maldição”, isto é, algo citado ou invocado numa fórmula de maldição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em conformidade com a evidência hebraica.
- source_word: וְלֹא יוּכַל ... עוֹד לָשֵׂאת
  choice: E Yahweh já não pôde suportar isso
  rationale: Reproduz a expressão idiomática hebraica de incapacidade de continuar tolerando; “isso” explicita em português o objeto implícito, definido pelas causas que vêm em seguida.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: O uso é causal nas duas ocorrências, não espacial.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: a maldade dos atos de vocês
  rationale: Mantém a estrutura genitiva e a avaliação moral forte do hebraico, em linguagem corrente e digna.
- source_word: הַתּוֹעֵבֹת אֲשֶׁר עֲשִׂיתֶם
  choice: as abominações que cometeram
  rationale: “Abominações” conserva a intensidade religiosa e moral de תּוֹעֵבוֹת; “cometeram” é a combinação idiomática natural em português.
- source_word: וַתְּהִי אַרְצְכֶם
  choice: Por isso, a terra de vocês tornou-se
  rationale: Explicita a relação de consequência veiculada pela sequência narrativa, sem enfraquecer a ligação com a causa anterior.
- source_word: לְחָרְבָּה
  choice: ruína
  rationale: Expressa de modo conciso o estado devastado da terra.
- source_word: וּלְשַׁמָּה
  choice: desolação
  rationale: Representa o sentido contextual primário de devastação, preservando em nota a possível nuance de horror ou espanto.
- source_word: וְלִקְלָלָה
  choice: maldição
  rationale: É uma tradução compacta, enquanto a nota preserva a nuance possível de algo usado em fórmulas de maldição.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: Reflete de perto a expressão hebraica de despovoamento total e soa natural em português.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: como se vê neste dia
  rationale: Comunica naturalmente que a condição descrita continuava evidente no tempo da fala.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Atribuição da impossibilidade de continuar suportando
  choice: Manter a afirmação direta de que Yahweh já não pôde suportar
  alternative: Parafrasear como uma simples decisão de punir
  rationale: A formulação hebraica descreve o limite da tolerância divina. A tradução conserva essa tensão antropopática, sem convertê-la numa explicação teológica mais sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural, preserva “Yahweh” como nome próprio e mantém a sequência enfática das duas causas. Os marcadores [a] e [b] aparecem imediatamente após os termos a que se referem.
