    issue: «como se vê neste dia» acrescenta uma ideia de percepção visual.
    rationale: כַּיּוֹם הַזֶּה significa literalmente «como neste dia / como hoje», caracterizando o estado vigente; não contém o verbo «ver». «Tal como está hoje» mantém a comparação temporal e o estado da terra.
