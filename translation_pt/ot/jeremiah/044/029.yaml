  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: pt
  text: '“E este será o sinal para vocês”, declara Yahweh: “Estou punindo vocês neste lugar, para que saibam que as minhas palavras certamente se cumprirão contra vocês, para a desgraça de vocês.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as minhas palavras certamente ficarão de pé contra vocês, para desgraça”.'
    reason: Preserva a metáfora hebraica de קום e a construção compacta de לְרָעָה, enquanto o texto principal oferece uma formulação natural em português.
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: E este será o sinal para vocês
  rationale: O verbo de ligação e o valor futuro são implícitos no hebraico; em português, sua explicitação produz uma frase natural e adequada ao anúncio do sinal.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética em linguagem corrente e preserva o nome divino יהוה como Yahweh.
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: Eu os castigarei
  rationale: פקד pode significar visitar, intervir ou punir. O contexto de juízo e לְרָעָה exige aqui o sentido punitivo; o futuro combina naturalmente com o sinal anunciado.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Tradução direta que conserva a referência dêitica do original.
- source_word: לְמַעַן תֵּדְעוּ
  choice: para que vocês saibam
  rationale: Preserva o propósito expresso por לְמַעַן em português claro.
- source_word: כִּי קוֹם יָקוּמוּ דְבָרַי
  choice: que as minhas palavras certamente se cumprirão
  rationale: O infinitivo absoluto com o verbo finito intensifica a certeza. 'Cumprir-se' comunica naturalmente em português o fato de as palavras proféticas permanecerem válidas e ocorrerem.
- source_word: עֲלֵיכֶם לְרָעָה
  choice: contra vocês, trazendo desgraça
  rationale: '''Contra vocês'' preserva a força adversativa de עֲלֵיכֶם, enquanto ''trazendo desgraça'' expressa o resultado calamitoso de רָעָה sem sugerir maldade moral em Deus.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' preserva o nome próprio divino sem substituí-lo por um título.
- issue: Sentido de לְרָעָה
  choice: trazendo desgraça
  alternative: para o mal; para dano; para calamidade
  rationale: Neste contexto, רָעָה designa o resultado adverso do juízo, não maldade moral. 'Desgraça' é clara e natural, mantendo a gravidade da ameaça.
- issue: Metáfora de קום aplicada às palavras
  choice: se cumprirão
  alternative: permanecerão de pé
  rationale: A expressão literal comunica que as palavras de Yahweh ficarão firmes e serão efetivadas. A tradução idiomática explicita esse sentido sem eliminar a leitura literal, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A ordem e a pontuação distinguem com clareza a fórmula profética e a fala divina. O marcador [a] aparece no texto principal.
