source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: pt
  text: 'E os sobreviventes da espada voltarão da terra do Egito para a terra de Judá, poucos em número. Então todo o remanescente de Judá que veio à terra do Egito para residir ali como estrangeiro saberá qual palavra permanecerá firme[a]: a minha ou a deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual palavra se cumprirá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: os sobreviventes da espada
  rationale: פְלִיטֵי designa os que escaparam ou sobreviveram; manter “espada” preserva a imagem hebraica de morte violenta e juízo.
- source_word: יְשֻׁבוּן
  choice: voltarão
  rationale: O qal de שׁוב tem aqui o sentido comum e direto de retornar.
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: da terra do Egito para a terra de Judá
  rationale: Conserva a repetição de אֶרֶץ e explicita em português o movimento de origem a destino.
- source_word: מְתֵי מִסְפָּר
  choice: poucos em número
  rationale: A expressão idiomática indica um grupo pequeno e contável; a formulação mantém sua posição e ênfase no hebraico.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: todo o remanescente de Judá
  rationale: “Remanescente” é natural no registro profético e preserva a dimensão coletiva de שְׁאֵרִית.
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: que veio à terra do Egito para residir ali como estrangeiro
  rationale: גור descreve a residência de quem vive como estrangeiro ou forasteiro; “residir ali como estrangeiro” preserva essa nuance sem sugerir necessariamente permanência plena.
- source_word: דְּבַר מִי יָקוּם
  choice: qual palavra permanecerá firme
  rationale: Mantém a metáfora de קום aplicada à palavra, comunicando que uma das declarações será confirmada pelos acontecimentos.
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: a minha ou a deles
  rationale: Os pronomes retomam “palavra”; a forma possessiva é concisa e natural em português.
theological_decisions:
- issue: Fórmula de confirmação da palavra profética
  choice: 'qual palavra permanecerá firme: a minha ou a deles'
  alternative: 'qual palavra se cumprirá: a minha ou a deles'
  rationale: A opção principal preserva a metáfora hebraica de a palavra “ficar de pé” ou ser validada, sem reduzir de antemão a tensão entre a declaração do SENHOR e a dos refugiados; a nota registra o sentido contextual de cumprimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A concordância no singular em “todo o remanescente ... veio ... saberá” trata o remanescente como coletivo, enquanto a primeira oração mantém o plural dos sobreviventes. A formulação evita linguagem denominacional e conserva a imagem profética central.
