  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: pt
  text: 'E agora, assim diz Yahweh, o Deus dos Exércitos, o Deus de Israel: Por que vocês estão fazendo um mal tão grande contra vocês mesmos[a], a ponto de exterminar do meio de Judá homens e mulheres, crianças e bebês, sem deixar para vocês remanescente algum?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “causando tamanho dano a si mesmos”. O termo hebraico pode indicar tanto o mal moral quanto o dano ou a desgraça resultante; aqui, os dois sentidos estão estreitamente ligados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal do Deus de Israel.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Preserva o título hebraico e sua referência abrangente às hostes ou forças sob o comando divino; a forma é corrente e inteligível em português bíblico.
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵכֶם
  choice: estão fazendo tamanho mal contra si mesmos
  rationale: Mantém tanto a dimensão moral de רָעָה quanto seu efeito destrutivo e reflexivo. 'Tamanho mal' expressa naturalmente a intensidade de גְדוֹלָה.
- source_word: נַפְשֹׁתֵכֶם
  choice: si mesmos
  rationale: Neste uso, נֶפֶשׁ designa as próprias pessoas ou vidas; a expressão reflexiva é mais natural que 'suas almas'.
- source_word: לְהַכְרִית
  choice: eliminando
  rationale: Comunica no contexto o efeito causativo de 'cortar fora/exterminar' sem recorrer a uma formulação artificial em português.
- source_word: אִישׁ וְאִשָּׁה
  choice: homens e mulheres
  rationale: O par singular distributivo hebraico exprime a totalidade dos dois grupos; o plural é idiomático em português.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: crianças e bebês
  rationale: Distingue a criança pequena daquele que ainda mama, em linguagem moderna e clara.
- source_word: מִתּוֹךְ יְהוּדָה
  choice: de Judá
  rationale: No contexto de eliminação populacional, a forma concisa expressa a retirada do meio de Judá sem sugerir apenas deslocamento geográfico.
- source_word: לְבִלְתִּי הוֹתִיר לָכֶם שְׁאֵרִית
  choice: sem deixar para vocês remanescente algum
  rationale: Preserva o resultado da ação e o termo profético-chave שְׁאֵרִית, com uma construção natural em português.
theological_decisions:
- issue: Sentido de רָעָה na ação reflexiva
  choice: mal
  alternative: dano
  rationale: '''Mal'' preserva a acusação moral, enquanto o contexto e a nota deixam claro que a conduta também causa a própria destruição dos envolvidos.'
- issue: Tradução de שְׁאֵרִית
  choice: remanescente
  alternative: sobrevivente ou resto
  rationale: '''Remanescente'' conserva a recorrência e a ressonância profética do termo em Jeremias sem acrescentar uma interpretação doutrinária.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para a segunda pessoa plural, mantém 'Yahweh' e conserva 'remanescente' como termo profético importante.
