    rationale: O hebraico fala de cortar/eliminar «do meio de Judá», e o infinitivo introduz a consequência ou finalidade da ação condenada. «A ponto de exterminar do meio de Judá» comunica ambos os elementos com clareza.
  - severity: low
    issue: «tamanho mal contra si mesmos» é menos natural no português atual e alterna desnecessariamente entre «vocês» e «si mesmos».
    rationale: «Um mal tão grande contra vocês mesmos» conserva a intensidade de גְדוֹלָה e melhora a fluência sem alterar o sentido.
