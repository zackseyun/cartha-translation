base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: pt
  text: Por isso, o meu furor e a minha ira se derramaram e arderam nas cidades de Judá e nas ruas de Jerusalém[a], que se tornaram uma ruína e uma desolação, como estão hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praças” ou “lugares abertos” de Jerusalém.
    reason: Alternativa lexical para חֻצוֹת, que pode designar ruas, praças ou espaços abertos.
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: se derramaram
  rationale: Preserva a metáfora de נתך, segundo a qual o furor e a ira de Deus são vertidos. O plural em português concorda naturalmente com o sujeito composto posposto.
- source_word: חֲמָתִי וְאַפִּי
  choice: o meu furor e a minha ira
  rationale: 'Distingue os dois termos paralelos sem eliminar sua sobreposição semântica: חֵמָה sugere furor ardente, e אַף significa idiomaticamente ira.'
- source_word: וַתִּבְעַר
  choice: arderam
  rationale: Mantém a imagem concreta de בער e concorda com o sujeito composto 'o meu furor e a minha ira', embora o verbo hebraico esteja no singular.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Reproduz o valor locativo normal da preposição ב e o construto hebraico de maneira direta.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: e nas ruas de Jerusalém
  rationale: '''Ruas'' é a opção mais natural no contexto urbano; a possibilidade lexical de ''praças'' ou ''lugares abertos'' é preservada em nota.'
- source_word: וַתִּהְיֶינָה
  choice: que se tornaram
  rationale: Expressa o estado resultante do juízo. O pronome relativo liga com clareza o verbo feminino plural às cidades e ruas mencionadas.
- source_word: לְחָרְבָּה לִשְׁמָמָה
  choice: ruína e desolação
  rationale: Conserva o par enfático de substantivos que descreve a devastação resultante, em registro profético digno e compreensível.
- source_word: כַּיּוֹם הַזֶּה
  choice: como estão hoje
  rationale: Traduz o idioma hebraico como referência à condição presente e observável dos lugares, mantendo a referência plural.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: Foram mantidas as imagens concretas de furor e ira que se derramam e ardem.
  alternative: Parafrasear como 'meu castigo veio' ou 'meu juízo caiu'.
  rationale: O hebraico apresenta o juízo como ação pessoal e intensa de Deus. Preservar as metáforas conserva a força teológica do texto sem acrescentar explicação doutrinária.
- issue: Referência dos verbos no fim do versículo
  choice: A expressão 'que se tornaram... como estão hoje' refere-se coletivamente às cidades e ruas.
  alternative: Empregar uma construção impessoal singular, como 'tudo ficou... como está hoje'.
  rationale: O feminino plural hebraico aponta para os lugares plurais anteriormente mencionados; a tradução mantém essa relação sem transformar a imagem em uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o paralelismo e as metáforas hebraicas sem soar excessivamente arcaica.
