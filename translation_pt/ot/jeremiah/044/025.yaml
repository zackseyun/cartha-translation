  to: 'Assim diz o SENHOR dos Exércitos, o Deus de Israel: “Vocês e suas mulheres: elas falaram com a boca de vocês, e vocês cumpriram com as mãos de vocês, dizendo: ‘Certamente cumpriremos os votos que fizemos: queimar incenso para a Rainha dos Céus e derramar libações para ela.’ Pois bem, confirmem os seus votos e cumpram os seus votos!”[a]'
