  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: pt
  text: 'Assim diz o SENHOR dos Exércitos, o Deus de Israel: “Vocês e suas mulheres: elas falaram com a boca de vocês, e vocês cumpriram com as mãos de vocês, dizendo: ‘Certamente cumpriremos os votos que fizemos: queimar incenso para a Rainha dos Céus e derramar libações para ela.’ Pois bem, confirmem os seus votos e cumpram os seus votos!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “elas falaram” está no feminino plural, “vocês cumpriram” no masculino plural, e os dois imperativos finais estão no feminino plural, dirigindo-se especificamente às mulheres.
    reason: O português com “vocês” não marca naturalmente essa alternância de gênero; a nota a preserva sem sobrecarregar o texto.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Representa o nome divino segundo a convenção editorial em versaletes e traduz צְבָאוֹת pela expressão portuguesa tradicional e inteligível.
- source_word: מִלֵּאתֶם
  choice: cumpriram
  rationale: No contexto de palavras seguidas por atos, o verbo significa levar a cabo ou realizar o que foi declarado.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: Certamente cumpriremos
  rationale: O infinitivo absoluto seguido do verbo finito expressa forte determinação; a formulação portuguesa preserva a ênfase sem imitar de modo artificial a sintaxe hebraica.
- source_word: לְקַטֵּר
  choice: queimar incenso
  rationale: Expressa claramente o ato cultual indicado pelo verbo hebraico.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Rainha dos Céus
  rationale: Tradução direta do título da divindade venerada; o plural hebraico שָׁמַיִם é convencionalmente vertido por “céus”.
- source_word: הָקֵים תָּקִימְנָה
  choice: confirmem
  rationale: Preserva a ideia de ratificar ou manter firmes os votos, distinguindo-a do verbo seguinte, “cumpram”.
theological_decisions:
- issue: Força das ordens finais
  choice: “Pois bem, confirmem os seus votos e cumpram os seus votos!” como ordem de tom incisivo
  alternative: Entender as palavras como aprovação divina sincera dos votos
  rationale: O contexto profético indica uma ordem irônica ou judicial, não endosso da idolatria; a tradução mantém a forma imperativa e o tom contundente sem inserir explicitamente a palavra “ironicamente” no texto.
- issue: Identidade da “Rainha dos Céus”
  choice: Manter apenas o título presente no hebraico
  alternative: Identificá-la com uma divindade específica do antigo Oriente Próximo
  rationale: O versículo não fornece uma identificação nominal; acrescentá-la resolveria uma questão histórica além da evidência textual imediata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “votos” foi mantida por corresponder à insistência retórica do hebraico. “Com a própria boca” e “com as próprias mãos” conserva o contraste concreto entre declaração e ação.
