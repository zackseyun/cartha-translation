source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הָ/עָ֔ם וְ/אֶ֖ל כָּל הַ/נָּשִׁ֑ים שִׁמְעוּ֙ דְּבַר יְהוָ֔ה כָּל יְהוּדָ֕ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: pt
  text: 'Então Jeremias disse a todo o povo e a todas as mulheres: “Ouçam a palavra de Yahweh, todo o Judá que está na terra do Egito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os judeus que estão na terra do Egito”.
    reason: Alternativa lexical para a expressão coletiva כָּל יְהוּדָה e ajuste correspondente de número na oração relativa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: אֶל כָּל הָעָם
  choice: a todo o povo
  rationale: עָם designa aqui o povo como coletividade; esta é a expressão mais direta e natural.
- source_word: וְאֶל כָּל הַנָּשִׁים
  choice: e a todas as mulheres
  rationale: נָשִׁים pode significar “mulheres” ou “esposas”; o contexto amplo favorece “mulheres”, sem restringir indevidamente o grupo.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע, dirigido ao conjunto dos ouvintes; “Ouçam” conserva a força da convocação profética em português atual.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética reconhecível e o sentido lexical de דָּבָר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל יְהוּדָה
  choice: todo o Judá
  rationale: Preserva a designação coletiva da comunidade de Judá; a nota registra a alternativa gentílica natural.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: que está na terra do Egito
  rationale: Conserva tanto a oração relativa ligada ao coletivo “Judá” quanto a expressão geográfica completa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Identidade do grupo chamado כָּל יְהוּדָה
  choice: todo o Judá
  alternative: todos os judeus
  rationale: A formulação coletiva preserva a imagem e a ambiguidade do hebraico, sem decidir se a ênfase recai sobre a comunidade nacional ou sobre seus integrantes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa natural. O vocativo coletivo “todo o Judá” mantém a forma do hebraico; a alternativa mais idiomática aparece em nota. O marcador foi colocado após a expressão geográfica que encerra a unidade à qual a nota se refere.
