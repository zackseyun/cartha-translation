source:
  edition: WLC
  text: לָ/כֵן֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה כָּל יְהוּדָ֕ה הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הִנְ/נִ֨י נִשְׁבַּ֜עְתִּי בִּ/שְׁמִ֤/י הַ/גָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם יִהְיֶה֩ ע֨וֹד שְׁמִ֜/י נִקְרָ֣א בְּ/פִ֣י כָּל אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי אֲדֹנָ֥/י יְהוִ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: pt
  text: 'Portanto, ouçam a palavra de Yahweh, todos vocês de Judá que moram na terra do Egito: “Eis que jurei pelo meu grande nome”, diz Yahweh, “que o meu nome não será mais invocado por nenhum homem de Judá em toda a terra do Egito, dizendo: ‘Tão certo como vive o Senhor Yahweh.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a ligação conclusiva com o anúncio de juízo precedente em registro profético digno e natural.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: ouçam a palavra de Yahweh
  rationale: O imperativo plural é preservado, e “palavra” mantém a fórmula profética e o peso da fala divina.
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: todos vocês de Judá que moram na terra do Egito
  rationale: Explicita naturalmente o destinatário coletivo e conserva “terra do Egito”, sem sugerir que o território de Judá esteja no Egito.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz a declaração solene com o tom elevado próprio da profecia, sem acrescentar conteúdo.
- source_word: נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: jurei pelo meu grande nome
  rationale: Reproduz diretamente o juramento divino e conserva a expressão honorífica “meu grande nome”.
- source_word: אִם יִהְיֶה עוֹד שְׁמִי נִקְרָא בְּפִי כָּל אִישׁ יְהוּדָה
  choice: nenhum homem de Judá voltará a invocar o meu nome
  rationale: Depois da fórmula de juramento, אִם comunica uma negação enfática. A construção ativa é idiomática em português, preserva o singular masculino distributivo de אִישׁ e expressa o sentido de invocar o nome em um juramento.
- source_word: חַי אֲדֹנָי יְהוִה
  choice: Tão certo como vive o Senhor Yahweh
  rationale: Equivalente português natural da fórmula hebraica de juramento; “Senhor” representa אֲדֹנָי e “Yahweh” representa o nome divino יהוה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança e distingue-o do título אֲדֹנָי.
- issue: Valor negativo de אִם após a fórmula de juramento
  choice: nenhum ... voltará a
  alternative: se ... ainda
  rationale: Nesse contexto de juramento, a forma hebraica comunica negação enfática; a tradução explicita essa força sem alterar o conteúdo.
- issue: Masculino singular distributivo em כָּל אִישׁ יְהוּדָה
  choice: nenhum homem de Judá
  alternative: ninguém de Judá
  rationale: Preserva a forma masculina singular da fonte e seu alcance distributivo, sem afirmar que o juízo se restrinja necessariamente a um único indivíduo.
- issue: Relação entre אֲדֹנָי e יהוה na fórmula final
  choice: o Senhor Yahweh
  alternative: o Soberano Yahweh
  rationale: Mantém distintos o título “Senhor” e o nome próprio “Yahweh”, sem inserir uma interpretação adicional de soberania no corpo do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é solene e profético, mas evita construções excessivamente arcaicas. As aspas distinguem a declaração direta de Yahweh e a fórmula de juramento citada dentro dela.
