review_pass:
  verdict: revise
  source_fidelity: O texto traduz corretamente a conclusão de לָכֵן, o imperativo plural, o juramento pelo «grande nome», a negação enfática introduzida por אִם após o juramento, e a fórmula de juramento «vive o Senhor Yahweh». A voz passiva de «meu nome ... ser chamado/invocado» pode ser preservada com maior proximidade no português.
  naturalness: 'O português é claro, moderno e adequadamente solene. A revisão organiza a fala divina numa única citação e emprega uma formulação passiva natural: «não será mais invocado por nenhum homem».'
  terminology: «Yahweh» representa de modo consistente יהוה; «Senhor Yahweh» distingue אֲדֹנָי de יהוה na fórmula final. «Invocado» comunica bem o uso do nome divino num juramento, enquanto a nota preserva a imagem idiomática de «na boca».
  issues:
  - severity: medium
    issue: A nota de rodapé omite a negação presente no hebraico.
    rationale: A nota afirma literalmente «meu nome voltará a ser chamado», mas אִם יִהְיֶה עוֹד, no contexto da fórmula de juramento, significa que o nome não será mais chamado. A redação atual inverte materialmente o sentido da expressão explicada.
  - severity: low
    issue: As aspas da declaração divina estão divididas antes e depois de «diz Yahweh».
    rationale: Embora inteligível, a fala introduzida após os dois-pontos constitui uma única declaração. Mantê-la numa única citação melhora a apresentação sem mudar o sentido.
  revised_text: 'Portanto, ouçam a palavra de Yahweh, todos vocês de Judá que moram na terra do Egito: “Eis que jurei pelo meu grande nome”, diz Yahweh, “que o meu nome não será mais invocado por nenhum homem de Judá em toda a terra do Egito, dizendo: ‘Tão certo como vive o Senhor Yahweh.’”'
  revised_footnotes:
