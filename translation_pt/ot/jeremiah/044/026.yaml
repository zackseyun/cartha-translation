    reason: Esclarece a imagem oral do hebraico, a negação enfática da fórmula de juramento e a função da expressão no contexto.
  revision_rationale: A revisão corrige a nota, que havia perdido a negação essencial de «não será mais», e aproxima a redação principal da voz passiva hebraica sem sacrificar a fluência. Também uniformiza a delimitação tipográfica da declaração divina.
