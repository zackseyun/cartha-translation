  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: pt
  text: 'Então todos os homens que sabiam que suas mulheres queimavam incenso a outros deuses, todas as mulheres que estavam de pé[a] — uma grande assembleia — e todo o povo que vivia na terra do Egito, em Patros, responderam a Jeremias, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estavam presentes ali”. O particípio hebraico indica literalmente que as mulheres estavam de pé; no contexto, também assinala sua presença no local.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: O verbo ענה introduz aqui a resposta dada a Jeremias; “responderam” é natural e fiel ao contexto narrativo.
- source_word: כָּל הָאֲנָשִׁים
  choice: todos os homens
  rationale: O contexto indica especificamente os homens, pois o texto menciona suas mulheres e depois distingue todas as mulheres presentes.
- source_word: הַיֹּדְעִים
  choice: que sabiam
  rationale: O particípio identifica os homens que tinham conhecimento das ações de suas mulheres; a oração relativa é clara em português.
- source_word: מְקַטְּרוֹת
  choice: queimavam incenso
  rationale: No piel, קטר designa com frequência a queima cultual de incenso; esta formulação conserva o sentido ritual sem paráfrase excessiva.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Expressa de modo direto que o culto era dirigido a divindades diferentes do Deus de Israel.
- source_word: וְכָל הַנָּשִׁים הָעֹמְדוֹת
  choice: todas as mulheres que estavam ali
  rationale: O particípio de עמד indica que as mulheres estavam de pé ou presentes naquele local; “estavam ali” soa natural e preserva a referência à presença delas.
- source_word: קָהָל גָּדוֹל
  choice: uma grande assembleia
  rationale: קָהָל descreve um grupo reunido; “assembleia” preserva melhor esse caráter coletivo do que uma expressão mais informal.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם abrange aqui a população reunida além dos homens e das mulheres já mencionados.
- source_word: הַיֹּשְׁבִים
  choice: que vivia
  rationale: Em uma descrição geográfica, ישׁב tem o sentido idiomático de morar ou viver em determinado lugar.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a formulação geográfica explícita do hebraico.
- source_word: בְּפַתְרוֹס
  choice: em Patros
  rationale: Patros é um topônimo e, por isso, é transliterado.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva o introdutor hebraico da fala e prepara a resposta citada no versículo seguinte.
