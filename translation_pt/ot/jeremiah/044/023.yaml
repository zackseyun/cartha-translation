id: JER.44.23
reference: Jeremiah 44:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: pt
  text: Porque vocês queimaram incenso[a], pecaram contra Yahweh e não deram ouvidos à voz de Yahweh[b], nem andaram na sua lei[c], nos seus estatutos e nos seus testemunhos, por isso esta calamidade caiu sobre vocês[d], como se vê hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofereceram incenso”. O verbo hebraico se refere à produção de fumaça em uma oferta sacrificial, frequentemente mediante incenso.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, “não obedeceram a Yahweh”. Literalmente, “não ouviram a voz de Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: '“Lei” também pode ser traduzida por “instrução” (hebraico: torah).'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “este desastre atingiu vocês”. A palavra hebraica pode significar “mal” ou, como neste contexto, “calamidade” ou “desastre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: Porque
  rationale: Introduz diretamente a causa do juízo e soa natural em português moderno.
- source_word: קִטַּרְתֶּם
  choice: vocês queimaram incenso
  rationale: Expressa o ato cultual de produzir fumaça sacrificial, preservando a referência explícita ao incenso no contexto.
- source_word: חֲטָאתֶם לַיהוָה
  choice: pecaram contra Yahweh
  rationale: A preposição com o verbo 'pecar' indica aqui a pessoa contra quem se cometeu o pecado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: não deram ouvidos à voz de Yahweh
  rationale: Conserva a imagem hebraica de escutar a voz e, em português, comunica naturalmente a ideia contextual de obedecer.
- source_word: וּבְתוֹרָתוֹ
  choice: na sua lei
  rationale: No conjunto de termos pactuais, 'lei' é uma tradução concisa e reconhecível de torah, sem excluir o sentido mais amplo de instrução.
- source_word: וּבְחֻקֹּתָיו
  choice: nos seus estatutos
  rationale: Preserva o sentido jurídico-pactual e distingue o termo dos demais elementos da enumeração.
- source_word: וּבְעֵדְוֹתָיו
  choice: nos seus testemunhos
  rationale: Mantém a distinção lexical do hebraico na série 'lei, estatutos e testemunhos'.
- source_word: לֹא הֲלַכְתֶּם
  choice: nem andaram
  rationale: Preserva a metáfora bíblica de andar segundo as exigências divinas e coordena naturalmente os verbos no passado.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca com clareza e naturalidade a consequência das ações anteriores.
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: esta calamidade caiu sobre vocês
  rationale: Comunica de modo idiomático que a desgraça os alcançou; aqui רָעָה designa calamidade, não maldade moral.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: 'Torna explícita a força idiomática da expressão: a situação resultante do juízo é observável no presente.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome divino pessoal; a transliteração evita substituí-lo por um título.
- issue: Sentido de רָעָה no contexto de juízo
  choice: calamidade
  alternative: mal; desastre
  rationale: O referente é uma desgraça punitiva que atingiu o povo, não o mal moral; 'calamidade' preserva esse sentido sem resolver além do texto a relação teológica entre pecado e juízo.
- issue: Força de שׁמע בקול
  choice: dar ouvidos à voz
  alternative: obedecer
  rationale: A formulação escolhida preserva a imagem do original, enquanto a nota registra a implicação contextual de obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' adequado à referência plural. A sintaxe causal e consecutiva foi preservada, enquanto 'como se vê hoje' verte de forma natural o idioma hebraico final. Os marcadores foram posicionados junto aos termos que explicam.
