  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: pt
  text: Castigarei os que moram na terra do Egito[a], assim como castiguei Jerusalém, com a espada, com a fome e com a peste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pedirei contas aos que moram na terra do Egito [...] assim como pedi contas a Jerusalém”. O verbo hebraico פקד pode significar “cuidar de”, “visitar”, “inspecionar” ou, em contextos de juízo como este, “castigar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pestilência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Castigarei
  rationale: O verbo פקד possui ampla faixa semântica, incluindo cuidar de, visitar, inspecionar e pedir contas. Neste contexto de juízo, definido pela espada, pela fome e pela peste, “castigarei” expressa com clareza seu sentido punitivo.
- source_word: עַל הַיּוֹשְׁבִים
  choice: os que moram
  rationale: Com פקד em sentido punitivo, עַל introduz o alvo do juízo e é naturalmente incorporado ao objeto direto em português. O particípio de ישב descreve as pessoas residentes no lugar; “os que moram” é claro e corrente.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a expressão hebraica “terra do Egito” sem perder naturalidade em português.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Indica claramente a comparação entre o juízo dos moradores do Egito e o juízo já imposto a Jerusalém.
- source_word: פָּקַדְתִּי עַל יְרוּשָׁלִָם
  choice: castiguei Jerusalém
  rationale: Repete o sentido punitivo do primeiro פקד e incorpora a preposição עַל à construção idiomática portuguesa.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: com a espada, com a fome e com a peste
  rationale: Preserva a tríade profética e a repetição instrumental da preposição בְּ. “Peste” comunica em linguagem atual a doença epidêmica designada por דֶּבֶר.
theological_decisions:
- issue: Sentido do verbo פקד na linguagem do juízo divino
  choice: 'Sentido punitivo explícito: “castigar”'
  alternative: 'Formulação mais formal e ambígua: “visitar” ou “pedir contas”'
  rationale: A enumeração de espada, fome e peste estabelece um contexto inequívoco de juízo. “Castigar” torna esse valor contextual transparente sem acrescentar conteúdo doutrinário ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “com” conserva o ritmo da fórmula hebraica de juízo. Os marcadores [a] e [b] aparecem no texto principal junto às expressões a que se referem.
