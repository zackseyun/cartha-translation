  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: pt
  text: 'Quanto à palavra que você nos dirigiu em nome de Yahweh, não daremos ouvidos a você.[a]


    [a] Ou: “não obedeceremos a você”. O verbo hebraico pode significar tanto ouvir como dar ouvidos, no sentido de obedecer. O texto principal conserva a imagem de ouvir, enquanto o contexto deixa clara a recusa em obedecer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeceremos a você”. O verbo hebraico pode significar tanto ouvir como dar ouvidos, no sentido de obedecer. O texto principal conserva a imagem de ouvir, enquanto o contexto deixa clara a recusa em obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “mensagem”. Aqui se refere à declaração profética de Jeremias; “a palavra” preserva a formulação direta do hebraico.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֵלֵינוּ
  choice: que você nos dirigiu
  rationale: A expressão indica a palavra falada por Jeremias aos seus ouvintes. “Nos dirigiu” comunica naturalmente em português que a declaração foi dirigida a eles, sem acrescentar conteúdo.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: A expressão indica que Jeremias falou como representante de Deus e sob sua autoridade. Mantém-se o idioma hebraico e translitera-se o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵינֶנּוּ שֹׁמְעִים אֵלֶיךָ
  choice: não daremos ouvidos a você
  rationale: A construção com particípio expressa uma recusa firme. “Não daremos ouvidos” é idiomático em português, preserva a imagem de ouvir e, no contexto, deixa implícita a desobediência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de שׁמע no contexto de rejeição profética
  choice: não daremos ouvidos
  alternative: não obedeceremos
  rationale: שׁמע pode incluir a ideia de obedecer, mas sua imagem lexical é a de ouvir. O texto principal mantém essa imagem e a nota registra explicitamente o sentido contextual possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o singular masculino de אֵלֶיךָ e mantém a resposta direta a Jeremias; “dar ouvidos” é corrente e preserva a metáfora auditiva do hebraico.
