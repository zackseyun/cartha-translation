source:
  edition: WLC
  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: pt
  text: E, quando queimávamos incenso à Rainha do Céu e derramávamos ofertas de bebida para ela, será que foi sem nossos maridos que fizemos bolos para representá-la[a] e derramamos ofertas de bebida para ela?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para reproduzir sua imagem” ou “para moldá-los à imagem dela”. O hebraico provavelmente se refere a bolos moldados para representar a deusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, quando
  rationale: No contexto, dá continuidade à defesa das mulheres e introduz a circunstância em que praticavam esses ritos, não uma condição hipotética.
- source_word: מְקַטְּרִים
  choice: queimávamos incenso
  rationale: O piel de קטר, em contexto de culto, designa com frequência a queima de incenso ou uma oferta de fumaça; aqui, a tradução específica é natural e coerente com as ofertas de bebida.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: à Rainha do Céu
  rationale: Preserva como título cultual a designação da divindade pagã mencionada em Jeremias 7 e 44, sem acrescentar identificação interpretativa.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: e derramávamos ofertas de bebida para ela
  rationale: נסכים são ofertas líquidas ou libações; a formulação explicita em português corrente tanto o ato ritual quanto a natureza da oferta.
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: será que foi sem nossos maridos
  rationale: A pergunta nega que as mulheres tenham agido independentemente de seus homens. No contexto, אֲנָשֵׁינוּ refere-se naturalmente aos maridos; 'sem' preserva a amplitude da expressão sem inserir especificamente consentimento, conhecimento ou participação.
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: fizemos bolos para ela
  rationale: כַּוָּנִים designa bolos moldados ligados a essa prática cultual. A tradução é clara, e o contexto comunica sua função ritual.
- source_word: לְהַעֲצִבָהּ
  choice: para representá-la
  rationale: O infinitivo com sufixo indica a finalidade de representar ou reproduzir a figura da deusa, mas não determina com absoluta precisão a forma dessa representação.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: e derramamos ofertas de bebida para ela
  rationale: A expressão repetida mantém a mesma terminologia ritual da primeira ocorrência, com ajuste temporal exigido pela sintaxe portuguesa.
theological_decisions:
- issue: Identidade e tradução do título pagão מְלֶכֶת הַשָּׁמַיִם
  choice: Rainha do Céu
  alternative: rainha dos céus
  rationale: A tradução conserva o título atribuído à divindade pelos próprios participantes do culto, sem tratá-lo como designação teológica positiva nem importar associações posteriores.
- issue: Papel dos maridos na prática cultual
  choice: sem nossos maridos
  alternative: sem o consentimento de nossos maridos
  rationale: O hebraico afirma que as mulheres não agiam à parte de seus maridos, mas não especifica se isso significa presença, conhecimento, consentimento ou participação. A redação escolhida preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega 'ofertas de bebida' em vez do termo mais técnico 'libações' e mantém a repetição ritual do hebraico. O marcador [a] aparece imediatamente após a expressão lexical a que a nota se refere.
