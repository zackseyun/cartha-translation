base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
translation:
  language: pt
  text: 'Então Jeremias disse a todo o povo — aos homens, às mulheres e a todo o povo que lhe respondia —:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: אֶל כָּל הָעָם
  choice: a todo o povo
  rationale: Traduz diretamente a designação coletiva e mantém o alcance abrangente do hebraico.
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: aos homens, às mulheres
  rationale: Neste contexto, עַל introduz grupos em aposição que especificam os destinatários; a repetição de “a” torna essa relação clara em português.
- source_word: וְעַל כָּל הָעָם
  choice: e a todo o povo
  rationale: Mantém a repetição enfática do texto hebraico sem acrescentar “restante”, que não está expresso.
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: que lhe respondia
  rationale: A expressão hebraica compacta significa idiomaticamente responder a alguém. O singular coletivo “povo” pede “respondia”; não se verte דָּבָר separadamente porque “com uma palavra” seria pouco natural e redundante em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Conserva a fórmula que introduz a fala direta iniciada no versículo seguinte.
