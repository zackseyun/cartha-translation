id: JER.44.11
reference: Jeremiah 44:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos[a], o Deus de Israel: “Eis que ponho o meu rosto contra vocês para lhes trazer desgraça[b] e exterminar todo o Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: “Desgraça” refere-se aqui à calamidade ou ao desastre decorrente do juízo, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da acusação anterior, preservando a força inferencial.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética tradicional, com tom solene e linguagem corrente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de forma transparente, indicando as forças sob o comando de Deus.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a expressão construta que identifica o Deus de Israel.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a ênfase dêitica e o tom solene da declaração divina.
- source_word: שָׂם פָּנַי בָּכֶם
  choice: ponho o meu rosto contra vocês
  rationale: Conserva a metáfora hebraica de oposição deliberada e julgamento; “vocês” dá clareza ao plural de בָּכֶם.
- source_word: לְרָעָה
  choice: para lhes trazer desgraça
  rationale: Neste contexto, רָעָה denota calamidade punitiva, não maldade moral. A formulação portuguesa comunica tanto o dano quanto sua direção contra os destinatários.
- source_word: וּלְהַכְרִית
  choice: e exterminar
  rationale: O hifil de כרת aqui exprime eliminação em juízo. “Exterminar” transmite a severidade com mais naturalidade em português do que o decalque “cortar”.
- source_word: כָּל יְהוּדָה
  choice: todo o Judá
  rationale: Mantém a expressão coletiva compacta e sua possível referência ao povo identificado como Judá, sem restringi-la explicitamente ao território.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: o SENHOR dos Exércitos
  rationale: O texto hebraico emprega diretamente o nome divino יהוה. “Yahweh” preserva esse nome, enquanto “dos Exércitos” traduz o título sem importar uma interpretação denominacional.
- issue: Sentido de רָעָה aplicado à ação divina
  choice: desgraça
  alternative: mal
  rationale: No contexto judicial, a palavra designa calamidade ou desastre imposto como juízo, e não maldade moral em Deus.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética e a metáfora do rosto foram preservadas; formas excessivamente arcaicas foram evitadas.
