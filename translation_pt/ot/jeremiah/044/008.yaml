  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: pt
  text: provocando a minha ira com as obras de suas mãos, queimando incenso a outros deuses na terra do Egito, para onde vocês vão morar como estrangeiros, de modo que vocês mesmos sejam eliminados[a] e se tornem maldição[b] e motivo de vergonha entre todas as nações da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “de modo que vocês se eliminem” ou “de modo que sejam exterminados”. O hebraico não explicita aqui quem executa a eliminação.
    reason: alternative_reading
  - marker: b
    text: “Maldição” também pode significar “objeto de maldição”, isto é, um povo citado em fórmulas de maldição.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  choice: provocando a minha ira
  rationale: Expressa de modo natural a força causativa do infinitivo hifil com sufixo de primeira pessoa.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: com as obras das suas mãos
  rationale: Preserva a imagem hebraica sem restringi-la explicitamente a ídolos, embora o contexto seja cultual.
- source_word: לְקַטֵּר
  choice: queimando incenso
  rationale: No contexto cultual, o piel de קטר normalmente indica queimar incenso ou fazer subir fumaça sacrificial.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Tradução direta de אֲחֵרִים, sem acrescentar a interpretação 'estrangeiros'.
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: aonde vocês estão indo para morar como estrangeiros
  rationale: Torna explícita, em português natural, a nuance de residência temporária ou de estrangeiro presente em גור.
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: de modo que vocês mesmos sejam eliminados
  rationale: Conserva a força resultativa e a implicação reflexiva de לָכֶם, sem introduzir como sujeito expresso Deus ou os próprios ouvintes.
- source_word: לִקְלָלָה
  choice: maldição
  rationale: Forma concisa que admite tanto a ideia de maldição quanto a de objeto ou exemplo empregado em fórmulas de maldição.
- source_word: וּלְחֶרְפָּה
  choice: motivo de vergonha
  rationale: Comunica em linguagem corrente o sentido de desonra, opróbrio ou escárnio de חרפה.
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: entre todas as nações da terra
  rationale: O plural abrangente 'todas as nações' favorece o sentido mundial de הָאָרֶץ.
theological_decisions:
- issue: Agência em לְמַעַן הַכְרִית לָכֶם
  choice: 'resultado com implicação reflexiva: “de modo que vocês mesmos sejam eliminados”'
  alternative: “de modo que vocês se eliminem” ou “para que eu os elimine”
  rationale: O hebraico não explicita um novo sujeito. A formulação escolhida mantém a responsabilidade dos ouvintes e o resultado de sua conduta, sem excluir o juízo divino no contexto nem atribuir-lhes diretamente a execução da própria destruição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A expressão “morar como estrangeiros” preserva a nuance de גור sem recorrer ao menos corrente “peregrinar”. Todos os marcadores de nota aparecem no texto.
