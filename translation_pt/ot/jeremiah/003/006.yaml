  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: pt
  text: 'O SENHOR me disse nos dias do rei Josias: “Você viu o que fez Israel, a infiel? Ela ia a todo monte alto e para debaixo de toda árvore verdejante, e ali se prostituía.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino pelo título em versaletes, preservando sua distinção sem introduzir uma vocalização debatida.
- source_word: מְשֻׁבָה
  choice: a infiel
  rationale: Neste contexto, o termo personifica Israel como alguém que abandonou sua fidelidade pactual; “infiel” comunica naturalmente o sentido, em harmonia com a metáfora conjugal do versículo.
- source_word: הַר גָּבֹהַּ
  choice: monte alto
  rationale: Tradução direta que também conserva a possível alusão aos locais elevados de culto.
- source_word: עֵץ רַעֲנָן
  choice: árvore verdejante
  rationale: Expressa o vigor e a folhagem da árvore, mantendo a fórmula associada a locais de culto idolátrico.
- source_word: וַתִּזְנִי
  choice: se prostituiu
  rationale: Preserva a metáfora sexual forte usada profeticamente para a infidelidade religiosa de Israel.
theological_decisions:
- issue: Infidelidade de Israel como metáfora conjugal e religiosa
  choice: Manter “a infiel” e “se prostituiu”
  alternative: “Israel, a rebelde” e “praticou prostituição”
  rationale: A formulação escolhida mantém a relação entre abandono da aliança e prostituição metafórica sem explicitar no texto algo que o hebraico deixa ao contexto.
- issue: Nome divino יהוה
  choice: O SENHOR
  alternative: Yahweh
  rationale: A convenção é amplamente reconhecida em português e não toma partido quanto à vocalização exata do tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para “Israel, a infiel”, evitando a expressão pouco idiomática “a infiel Israel”. O tratamento “você” torna a pergunta direta natural no português brasileiro contemporâneo.
