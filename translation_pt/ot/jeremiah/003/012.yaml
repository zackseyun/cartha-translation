  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: pt
  text: 'Vá e proclame estas palavras em direção ao norte: “Volte, ó Israel infiel”, declara Yahweh. “Não olharei para vocês com ira, pois sou fiel[a]”, declara Yahweh. “Não permanecerei irado para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “misericordioso”. O termo hebraico pode indicar lealdade à aliança, bondade ou misericórdia.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Vá e proclame
  rationale: O infinitivo absoluto seguido do verbo finito transmite uma ordem enfática. “Vá e proclame” preserva o tom de comissão profética em português natural.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: Mantém a forma concreta do hebraico sem perder naturalidade.
- source_word: צָפוֹנָה
  choice: em direção ao norte
  rationale: Preserva a força direcional do advérbio com ה locativo, provavelmente apontando para a região do Israel exilado.
- source_word: שׁוּבָה מְשֻׁבָה יִשְׂרָאֵל
  choice: Volte, ó Israel infiel
  rationale: “Volte” conserva tanto a ideia de retorno quanto a ressonância relacional da convocação profética; “infiel” expressa a deslealdade de Israel à aliança.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e translitera diretamente o nome divino.
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: Não olharei para vocês com ira
  rationale: Comunica em português claro o sentido do idiomatismo hebraico, literalmente relacionado a fazer cair o rosto sobre ou contra alguém. O plural “vocês” preserva a mudança para בכם.
- source_word: חָסִיד אֲנִי
  choice: pois sou fiel
  rationale: “Fiel” destaca a lealdade de Yahweh à aliança. Como o termo também pode ressaltar misericórdia ou bondade, a alternativa é registrada em nota.
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: Não permanecerei irado para sempre
  rationale: נטר denota conservar ira ou ressentimento. A formulação comunica com naturalidade a persistência da ira que Yahweh nega manter para sempre.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Nuance de חָסִיד aplicado a Yahweh
  choice: fiel
  alternative: misericordioso; leal; bondoso
  rationale: “Fiel” preserva em primeiro plano a lealdade da aliança, enquanto a nota mantém aberta a nuance legítima de misericórdia sem resolver indevidamente a amplitude do termo.
- issue: Alternância entre singular e plural
  choice: “Volte” no singular e “vocês” no plural
  alternative: Uniformizar todo o discurso no singular ou no plural
  rationale: O hebraico dirige a convocação a Israel no singular, mas usa o sufixo plural em בכם. A tradução conserva essa tensão gramatical em vez de uniformizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó Israel” esclarece a construção sem acrescentar conteúdo interpretativo. A pontuação organiza a proclamação e as palavras divinas, e a alternância hebraica entre singular e plural foi preservada.
