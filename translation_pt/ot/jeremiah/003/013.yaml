reference: Jeremiah 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: pt
  text: 'Apenas reconheça a sua culpa[a]: você se rebelou contra Yahweh, seu Deus, e espalhou os seus caminhos em direção aos estranhos, sob toda árvore verdejante[b]; vocês não obedeceram à minha voz — declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode indicar tanto a iniquidade como a culpa decorrente dela.
    reason: lexical_note
  - marker: b
    text: “Sob toda árvore verdejante” é uma expressão recorrente para lugares de culto ilícito.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Apenas
  rationale: 'Introduz uma limitação enfática: o que se requer é que a culpa seja reconhecida.'
- source_word: דְּעִי עֲוֺנֵךְ
  choice: reconheça a sua culpa
  rationale: Embora o verbo signifique literalmente “conhecer”, com “culpa” no imperativo expressa reconhecer ou admitir; “culpa” preserva aqui o peso moral de עָוֹן.
- source_word: פָּשָׁעַתְּ
  choice: você se rebelou
  rationale: פשע denota transgressão como rebelião contra a autoridade legítima, adequada à infidelidade da aliança.
- source_word: בַּיהוָה אֱלֹהַיִךְ
  choice: contra Yahweh, seu Deus
  rationale: A preposição é adversativa com פשע, e o nome da aliança é transliterado como Yahweh.
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ
  choice: espalhou os seus caminhos
  rationale: Mantém a imagem hebraica de dispersar os caminhos, sem reduzi-la a uma explicação explícita de conduta sexual ou religiosa.
- source_word: לַזָּרִים
  choice: entre estranhos
  rationale: “Estranhos” preserva a metáfora de adultério e idolatria sem acrescentar “deuses”, palavra não expressa no hebraico; “entre” produz em português uma combinação natural com “espalhou”.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: debaixo de toda árvore verdejante
  rationale: Preserva a expressão profética recorrente e comunica a ideia de árvore frondosa ou viçosa em português atual.
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: vocês não obedeceram à minha voz
  rationale: “Ouvir a voz” frequentemente implica obedecer. O plural “vocês” preserva a mudança do feminino singular anterior para a segunda pessoa masculina plural no texto hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Fórmula profética apresentada com clareza e solenidade, preservando o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente diretamente no texto hebraico.
- issue: Identidade dos “estranhos” em לַזָּרִים
  choice: estranhos
  alternative: deuses estranhos; estrangeiros
  rationale: O contexto aponta para infidelidade e culto ilícito, mas o hebraico não fornece o substantivo “deuses”; a redação mantém a ambiguidade metafórica.
- issue: Mudança de número gramatical em שְׁמַעְתֶּם
  choice: vocês não obedeceram
  alternative: você não obedeceu
  rationale: O hebraico passa do feminino singular, dirigido à personificação de Israel, para o plural. Tornar a mudança visível preserva uma característica real do texto, embora cause uma transição abrupta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a metáfora hebraica dos “caminhos” e dos “estranhos”, bem como a mudança intencional do singular “você” para o plural “vocês”. A pontuação explicita a relação entre reconhecer a culpa e os atos que a constituem.
