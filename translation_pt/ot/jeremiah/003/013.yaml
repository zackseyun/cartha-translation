revisions:
- from: 'Apenas reconheça a sua culpa[a]: você se rebelou contra Yahweh, seu Deus, e espalhou os seus caminhos entre estranhos, debaixo de toda árvore verdejante[b]; vocês não obedeceram à minha voz — declara Yahweh.'
  to: 'Apenas reconheça a sua culpa[a]: você se rebelou contra Yahweh, seu Deus, e espalhou os seus caminhos em direção aos estranhos, sob toda árvore verdejante[b]; vocês não obedeceram à minha voz — declara Yahweh.'
  rationale: A revisão ajusta a preposição associada a «estranhos» para refletir melhor a direcionalidade do hebraico, sem explicitar uma referência a deuses nem eliminar a metáfora dos caminhos. Também simplifica a expressão locativa. As âncoras e o conteúdo das notas permanecem adequados; a mudança do singular para o plural é mantida no texto.
