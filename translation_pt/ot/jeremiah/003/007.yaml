  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: pt
  text: 'E eu disse: “Depois que ela fez tudo isso, ela voltará para mim”[a]. Mas ela não voltou[b], e sua irmã traiçoeira[c], Judá, viu isso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela voltaria para mim”. O imperfeito hebraico pode expressar um futuro esperado a partir de um ponto de vista passado.'
    reason: lexical_alternative
  - marker: b
    text: “Voltar” também pode ser traduzido por “retornar” ou, no contexto da aliança, “converter-se”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sua irmã infiel, Judá”. O adjetivo hebraico pode destacar infidelidade ou traição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; a coordenação simples preserva o fluxo do hebraico.
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: Depois de fazer tudo isso
  rationale: A preposição com infinitivo construto e sufixo é expressa naturalmente em português por uma oração temporal reduzida; o sujeito feminino é recuperado pelo contexto.
- source_word: אֵלַי תָּשׁוּב
  choice: ela voltará para mim
  rationale: O imperfeito expressa a volta esperada a partir de um ponto passado. “Voltará” conserva tanto o sentido de retorno quanto sua dimensão pactual, sem explicitar “arrependimento”.
- source_word: וְלֹא שָׁבָה
  choice: Mas ela não voltou
  rationale: “Mas” explicita o contraste e a repetição de “voltar” mantém a correspondência lexical e o motivo profético do retorno.
- source_word: וַתֵּרֶא
  choice: viu isso
  rationale: ראה significa “ver”; “isso” torna explícito, de modo natural, o objeto implícito constituído pelos acontecimentos anteriores.
- source_word: בָּגוֹדָה
  choice: traiçoeira
  rationale: O termo derivado de בגד comunica deslealdade marcada por traição, especialmente no âmbito da aliança; “traiçoeira” preserva essa força.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: sua irmã traiçoeira, Judá
  rationale: Mantém a metáfora familiar que apresenta Judá como irmã de Israel e usa aposição natural em português.
theological_decisions:
- issue: Sentido pactual de שׁוּב
  choice: voltar
  alternative: retornar; converter-se; arrepender-se
  rationale: Em Jeremias, o verbo pode reunir retorno e conversão pactual. “Voltar” preserva essa amplitude sem resolver a tensão em favor de uma formulação teologicamente mais explícita.
- issue: Caracterização de Judá como בָּגוֹדָה
  choice: irmã traiçoeira
  alternative: irmã infiel; irmã desleal
  rationale: “Traiçoeira” retém a ideia forte de quebra de lealdade pactual, enquanto as alternativas podem salientar mais genericamente a infidelidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para uma sintaxe natural, sem eliminar a repetição intencional de “voltar”. Todos os marcadores de nota aparecem no texto principal.
