id: JER.3.18
reference: Jeremiah 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: pt
  text: Naqueles dias, a casa de Judá irá com a casa de Israel[a], e ambas virão juntas da terra do norte para a terra que dei por herança aos seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a casa de Judá irá para a casa de Israel”. A preposição hebraica também pode indicar direção, mas, neste contexto, provavelmente expressa a união de Judá com Israel.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: Naqueles dias
  rationale: Expressão temporal profética natural em português, preservando o registro e a referência a um futuro período de restauração.
- source_word: יֵלְכוּ ... עַל בֵּית יִשְׂרָאֵל
  choice: irá com a casa de Israel
  rationale: O verbo הלך significa ir/andar, e עַל admite aqui, à luz de יַחְדָּו e do contexto de restauração, um sentido de associação. A formulação comunica a união sem transformar Israel em alvo de hostilidade.
- source_word: בֵית יְהוּדָה / בֵית יִשְׂרָאֵל
  choice: a casa de Judá / a casa de Israel
  rationale: Mantém as expressões corporativas características do discurso profético e da identidade do povo dividido.
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: e, juntas, virão
  rationale: Preserva o verbo de movimento e a ideia explícita de ambas as casas virem em conjunto; o feminino plural concorda naturalmente com 'casas' subentendido.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Retém de modo claro o motivo geográfico e profético do retorno do exílio.
- source_word: עַל הָאָרֶץ
  choice: para a terra
  rationale: No contexto de movimento, עַל indica o destino; 'para' é o equivalente português mais natural.
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: que dei por herança
  rationale: 'Expressa o valor causativo de נחל no hiphil: conceder ou fazer receber como herança.'
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: aos seus pais
  rationale: Reproduz o masculino plural explícito do hebraico; 'antepassados' é oferecido em nota como alternativa de referência mais abrangente.
theological_decisions:
- issue: Imagem da restauração de Judá e Israel
  choice: Judá irá com Israel, destacando a reunificação do povo dividido.
  alternative: A casa de Judá irá para a casa de Israel.
  rationale: Embora עַל possa indicar direção, o contexto de restauração e a oração seguinte, 'juntas, virão', favorecem associação e unidade. A alternativa formalmente possível é preservada em nota.
- issue: Referência de אֲבוֹתֵיכֶם
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: A tradução principal conserva a forma masculina do hebraico, sem impedir que o termo denote os antepassados do povo de modo mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se 'casa de Judá/Israel' por seu valor corporativo e profético. A ordem dos marcadores foi normalizada para que cada nota apareça junto ao trecho correspondente.
