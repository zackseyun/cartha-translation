id: JER.3.14
reference: Jeremiah 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: pt
  text: Voltem, filhos infiéis, declara Yahweh, pois eu sou o senhor de vocês[a]. Eu os tomarei, um de uma cidade e dois de um clã, e os trarei a Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu sou o marido de vocês” ou “eu me casei com vocês”. O verbo hebraico pode expressar tanto senhorio como relação matrimonial.'
    reason: Leitura alternativa necessária para preservar a ambiguidade lexical e a imagem da aliança.
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: O imperativo plural de שׁוב convoca os destinatários a retornar a Yahweh e à relação de aliança. “Voltem” preserva a imagem relacional e espacial sem restringi-la ao sentido mais interpretativo de “arrependam-se”.
- source_word: בָנִים שׁוֹבָבִים
  choice: filhos infiéis
  rationale: בָנִים significa literalmente “filhos”, enquanto שׁוֹבָבִים descreve os que se desviaram ou foram desleais. “Filhos infiéis” mantém tanto a relação filial como a infidelidade à aliança, em português natural.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e concisão a fórmula profética, preservando o nome divino pessoal.
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: pois eu sou o senhor de vocês
  rationale: O verbo בעל pode expressar senhorio e também vínculo conjugal. A redação principal conserva o sentido de autoridade da aliança; a nota registra explicitamente a dimensão matrimonial sem eliminar a ambiguidade.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: Eu os tomarei
  rationale: Mantém o verbo simples “tomar” e o sentido futuro da promessa de reunir os dispersos.
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: um de uma cidade e dois de um clã
  rationale: Preserva os números e evita acrescentar “cada”, ausente do hebraico. “Clã” representa melhor מִשְׁפָּחָה como grupo amplo de parentesco, e não apenas família nuclear.
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: e os trarei a Sião
  rationale: Expressa naturalmente o movimento até o destino e conserva o nome tradicional “Sião”.
theological_decisions:
- issue: Se o sentido matrimonial de בָּעַלְתִּי deve aparecer em primeiro plano
  choice: “eu sou o senhor de vocês” no texto, com o sentido matrimonial na nota
  alternative: “eu sou o marido de vocês” ou “eu me casei com vocês”
  rationale: O verbo hebraico sobrepõe senhorio e casamento. O contexto amplo emprega a imagem conjugal, mas a forma de tratamento imediata é “filhos”. A tradução principal conserva a afirmação de autoridade, enquanto a nota mantém a tensão e a metáfora matrimonial legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “vocês” por naturalidade contemporânea; mantém “filhos” por precisão da imagem relacional. “Senhor” aparece em minúscula porque, nesta frase, traduz uma relação de autoridade, não substitui o nome divino.
