id: JER.3.20
reference: Jeremiah 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: pt
  text: De fato[a], assim como uma mulher trai o seu companheiro, vocês me traíram, ó casa de Israel — declara o SENHOR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente, assim como uma esposa trai o marido”. Em sentido literal, o hebraico diz “uma mulher” e “seu companheiro”, mas o contexto mais amplo retrata a infidelidade de Israel por meio de imagens matrimoniais.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: De fato
  rationale: Introduz uma afirmação enfática e solene; “De fato” é natural no português moderno e preserva essa força.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: trai / traíram
  rationale: O verbo בגד expressa traição ou deslealdade relacional e pactual. “Trair” comunica de modo claro tanto a ruptura da relação quanto a perfídia moral.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo pode significar “mulher” ou “esposa”. A opção mais ampla evita especificar um vínculo conjugal que não está explicitamente marcado nesta frase.
- source_word: מֵרֵעָהּ
  choice: o seu companheiro
  rationale: רֵעַ pode designar companheiro, amigo ou associado. “Companheiro” mantém a amplitude lexical e permite, sem impor, a possível nuance conjugal do contexto.
- source_word: כֵּן
  choice: assim
  rationale: Marca com clareza e concisão a correspondência entre a comparação inicial e a conduta de Israel.
- source_word: בִּי
  choice: me
  rationale: Com בגד, a preposição indica aquele contra quem se comete a traição; em português, “vocês me traíram” expressa naturalmente esse sentido.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Preserva a designação coletiva e pactual do hebraico, enquanto “ó” assinala de maneira digna o vocativo.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Mantém a fórmula profética solene em português natural; o nome divino é vertido segundo a convenção editorial como “SENHOR”.
theological_decisions:
- issue: Metáfora relacional na oração comparativa
  choice: A mulher trai o seu companheiro, sem especificar no texto principal que ele seja o marido.
  alternative: Assim como uma esposa trai o marido.
  rationale: O contexto de Jeremias 3 emprega imagens matrimoniais para a infidelidade pactual de Israel. Contudo, o hebraico desta frase usa אִשָּׁה e רֵעַ, e não um termo inequívoco para “marido”; por isso, a tradução principal preserva a amplitude e registra a leitura conjugal em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção mantém o paralelismo comparativo, o tratamento plural dirigido coletivamente a Israel e o vocativo profético. A nota preserva a possível leitura matrimonial sem impô-la ao texto principal.
