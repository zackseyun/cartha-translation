  text: הֲ/ל֣וֹא מֵ/עַ֔תָּה קראתי לִ֖/י אָבִ֑/י אַלּ֥וּף נְעֻרַ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
translation:
  language: pt
  text: 'Não foi agora mesmo que você me chamou: “Meu Pai, tu és o companheiro da minha juventude[b]”?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de agora em diante”. Aqui, a expressão hebraica é entendida como referência ao apelo feito neste momento ou há pouco, e não necessariamente ao futuro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guia da minha juventude”. O termo hebraico pode designar um companheiro íntimo, amigo próximo ou líder, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não foi... que
  rationale: Preserva a força de uma pergunta retórica que espera resposta afirmativa, em formulação natural no português atual.
- source_word: מֵעַתָּה
  choice: agora mesmo
  rationale: No contexto, indica a atualidade ou recenticidade do apelo de Judá; a alternativa prospectiva continua possível e é registrada em nota.
- source_word: קראתי (lido no contexto como 2fs)
  choice: você me chamou
  rationale: O contexto e o destinatário feminino personificado sustentam a segunda pessoa feminina; o português não marca gênero nessa forma verbal.
- source_word: לִי
  choice: me
  rationale: Expressa naturalmente em português o objeto indireto do verbo chamar.
- source_word: אָבִי
  choice: Meu Pai
  rationale: Mantém a forma direta de tratamento dirigida a Deus; a inicial maiúscula segue convenção editorial sem alterar o sentido.
- source_word: אַלּוּף
  choice: companheiro
  rationale: Conserva o sentido relacional de alguém próximo e ligado à pessoa desde a juventude, sem impor a nuance de autoridade presente na alternativa “guia”.
- source_word: נְעֻרַי
  choice: da minha juventude
  rationale: Reproduz de modo idiomático a relação genitiva da expressão hebraica.
- source_word: אָתָּה
  choice: tu és
  rationale: Explicita a cópula exigida em português na oração nominal hebraica e mantém o tom de invocação direta.
theological_decisions:
- issue: Locutor e destinatária da pergunta retórica
  choice: O SENHOR se dirige a Judá/Israel personificada como mulher e cita o apelo que ela lhe fez.
  alternative: A fala citada pode ser entendida como um apelo superficial ou irônico, e não necessariamente como arrependimento sincero.
  rationale: A forma feminina e o contexto de Jeremias 3 identificam a destinatária personificada. A tradução deixa em aberto a sinceridade do apelo, preservando a tensão do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na narrativa dirigida à personagem e “tu” dentro da invocação a Deus, solução natural que preserva o tom solene da fala citada. Os marcadores foram colocados junto às expressões às quais suas notas realmente se referem.
