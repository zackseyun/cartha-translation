  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Israel, a infiel, mostrou-se mais justa do que Judá, a traidora.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português, e “disse” traduz אמר de modo direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança, distinguindo-o do título “Senhor”.
- source_word: אֵלַי
  choice: me
  rationale: Na construção portuguesa “me disse”, o pronome átono comunica naturalmente o destinatário da fala.
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: mostrou-se mais justa
  rationale: Reproduz o valor reflexivo do idioma hebraico e, com o comparativo seguinte, comunica justiça relativa, não inocência absoluta.
- source_word: מְשֻׁבָה
  choice: a infiel
  rationale: O termo caracteriza Israel como aquela que se desviou ou abandonou sua lealdade. “Infiel” é atual, claro e adequado ao contexto relacional da aliança.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada do nome nacional; o artigo e o feminino do qualificativo deixam clara a personificação contextual.
- source_word: מִבֹּגֵדָה
  choice: do que ... a traidora
  rationale: A preposição מן tem força comparativa, enquanto בגד denota deslealdade ativa ou traição. “A traidora” mantém o contraste enfático entre as duas personificações femininas.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do reino do sul.
theological_decisions:
- issue: Justiça relativa de Israel em comparação com Judá
  choice: “mostrou-se mais justa do que”
  alternative: “justificou-se em comparação com” ou “foi considerada justa diante de”
  rationale: A construção apresenta uma comparação entre duas comunidades culpadas. A formulação preserva o impacto retórico de Israel ser relativamente mais justa, sem sugerir que seja absolutamente inocente perante Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A aposição “Israel, a infiel” e “Judá, a traidora” conserva a personificação feminina e o contraste retórico do hebraico. Não se acrescentou nota, pois as principais nuances lexicais podem ser preservadas no próprio texto.
