id: JER.3.5
reference: Jeremiah 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: pt
  text: 'Será que ele guardará rancor para sempre? Será que o conservará até o fim? Veja: você falou[a], fez as maldades e prevaleceu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As consoantes hebraicas também podem ser lidas como “eu falei”; o contexto favorece “você falou”, retomando as palavras de Judá.
    reason: textual_variant
  - marker: b
    text: 'Ou: “e foi capaz”, possivelmente no sentido de que você conseguiu persistir nessas maldades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר
  choice: Será que ele guardará rancor
  rationale: נטר descreve conservar ira ou ressentimento. “Guardar rancor” preserva a imagem lexical e soa natural em português.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração indefinidamente prolongada e mantém a força da pergunta retórica.
- source_word: אִם יִשְׁמֹר
  choice: Será que o conservará
  rationale: A segunda pergunta é apresentada em paralelo à primeira. O pronome retoma o rancor ou a ira implícita, enquanto “conservar” reflete o sentido de guardar.
- source_word: לָנֶצַח
  choice: até o fim
  rationale: Mantém a ideia de duração contínua e evita repetir “para sempre” no paralelismo.
- source_word: הִנֵּה
  choice: Veja
  rationale: Marcador discursivo atual e digno que chama a atenção para a acusação seguinte.
- source_word: דברתי
  choice: você falou
  rationale: Embora as consoantes permitam a leitura “eu falei”, o fluxo do discurso favorece a fala dirigida a Judá, retomando suas palavras anteriores.
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: fez as maldades
  rationale: O plural com artigo aponta para atos maus concretos. “As maldades” preserva tanto o plural quanto a determinação, sem inserir uma oposição não expressa pela conjunção simples.
- source_word: וַתּוּכָל
  choice: e prevaleceu
  rationale: יכל pode significar ser capaz ou prevalecer. A formulação conserva a concisão e a tensão do hebraico, sem explicitar além do texto em que sentido Judá prevaleceu.
theological_decisions:
- issue: Fluxo entre falante e destinatária na cláusula de acusação
  choice: Ler דברתי como “você falou”, dirigindo toda a sequência a Judá.
  alternative: Ler דברתי como “eu falei”, entendendo que o Senhor volta momentaneamente a falar de si.
  rationale: 'O contexto imediato retoma as palavras de Judá e favorece uma acusação contínua na segunda pessoa feminina: “você falou, fez... e prevaleceu”. A variante é mantida em nota, pois a forma consonantal é genuinamente ambígua.'
- issue: Sentido da declaração final וַתּוּכָל
  choice: “e prevaleceu”
  alternative: “e foi capaz” ou “e conseguiu fazer tudo isso”
  rationale: A tradução escolhida preserva a amplitude semântica e a dureza enigmática da conclusão, sem resolver silenciosamente se o foco está na capacidade, na persistência ou no êxito de Judá no mal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Guardar rancor” torna explícito o objeto implícito do verbo inicial; “conservar” sustenta o paralelismo. A sequência acusatória conserva coordenação simples, sem acrescentar “mas”. Os marcadores [a] e [b] aparecem no texto principal.
