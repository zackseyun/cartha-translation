  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: pt
  text: 'Levante os olhos para as alturas descampadas e veja: onde não se deitaram com você?[a] À beira dos caminhos, você se sentou à espera deles, como um árabe no deserto[b], e contaminou a terra com a sua prostituição e a sua maldade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui um verbo sexual grosseiro, literalmente algo como “onde não se deitaram com você?”. A imagem representa a infidelidade de Judá à aliança.
    reason: lexical_alternative
  - marker: b
    text: “Como um árabe no deserto” provavelmente evoca alguém à espreita junto às rotas do deserto. A comparação destaca a busca deliberada e pública, não a etnia em si.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: Levante os olhos
  rationale: O imperativo feminino singular com “olhos” forma uma expressão natural para erguer o olhar; a forma feminina se dirige a Judá personificada.
- source_word: עַל שְׁפָיִם
  choice: para as alturas descampadas
  rationale: שְׁפָיִם designa elevações nuas ou sem vegetação e pode evocar os locais de culto ilícito; “alturas descampadas” preserva a topografia sem tornar explícita essa alusão.
- source_word: וּרְאִי
  choice: e veja
  rationale: Imperativo feminino singular simples de ראה, mantido de modo direto e natural.
- source_word: אֵיפֹה לֹא שגלת
  choice: onde não se deitaram com você?
  rationale: O verbo é sexual, brusco e está na forma passiva. Esta formulação preserva a voz passiva e o sentido sexual sem introduzir coerção, que o hebraico não especifica.
- source_word: עַל דְּרָכִים
  choice: À beira dos caminhos
  rationale: Expressa a posição junto às rotas de passagem e comunica naturalmente a cena de espera pública.
- source_word: יָשַׁבְתְּ לָהֶם
  choice: você se sentava à espera deles
  rationale: O pronome dativo sugere que ela se punha ali esperando por eles; a explicitação é necessária para fluência em português.
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: como um árabe no deserto
  rationale: ערבי significa mais naturalmente “árabe” ou habitante árabe do deserto. A tradução lexical é mantida, enquanto a provável imagem de alguém à espreita é explicada em nota.
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: e contaminou a terra
  rationale: No Hifil, חנף pode expressar contaminação ou profanação moral. “Contaminou” preserva a imagem da terra afetada pela infidelidade.
- source_word: בִּזְנוּתַיִךְ
  choice: com a sua prostituição
  rationale: Mantém a metáfora sexual vívida de זנות, empregada profeticamente para a infidelidade da aliança.
- source_word: וּבְרָעָתֵךְ
  choice: e a sua maldade
  rationale: רעה denota aqui o mal moral em sentido amplo; “maldade” é corrente e conserva seu peso ético.
theological_decisions:
- issue: Metáfora sexual profética para a infidelidade à aliança
  choice: Conservar no texto a linguagem sexual de prostituição e relações sexuais.
  alternative: Substituir a metáfora por linguagem interpretativa explícita sobre idolatria.
  rationale: O hebraico retrata deliberadamente a infidelidade de Judá com imagens sexuais fortes. Explicitar apenas “idolatria” apagaria a retórica profética e resolveria no corpo do texto uma metáfora que deve permanecer.
- issue: Possível coerção no verbo שגלת
  choice: 'Traduzir de modo sexual e passivo, sem afirmar violência: “se deitaram com você”.'
  alternative: “você foi violentada” ou “abusaram de você”.
  rationale: Embora o verbo seja grosseiro e degradante, a forma por si só não exige coerção; o contexto seguinte apresenta Judá buscando e esperando parceiros. A tradução evita importar a noção específica de violência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa feminina singular do hebraico, dirigida a Judá personificada, é expressa por “você”. A construção sexual permanece forte, mas sem arcaísmo nem atribuição indevida de coerção.
