revisions:
- from: 'Diz-se[a]: “Se um homem mandar embora sua mulher, e ela se afastar dele e se tornar mulher de outro homem, voltará ele para ela outra vez? Essa terra não ficaria completamente contaminada? Mas você se prostituiu com muitos amantes. E voltaria para mim?”, declara Yahweh.'
  to: 'Diz-se: “Se um homem mandar embora sua mulher, e ela se afastar dele e se tornar mulher de outro homem, voltará ele para ela outra vez? Aquela terra não ficaria completamente contaminada? Mas você se prostituiu com muitos amantes e você voltaria para mim?”[a] declara Yahweh.'
  rationale: A revisão não altera a leitura adotada nem o sentido do versículo. Ela integra e esclarece a pergunta final, aproxima o demonstrativo de הַהִיא e reposiciona a âncora da nota junto à cláusula textual que ela discute.
