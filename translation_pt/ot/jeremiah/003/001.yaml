  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: pt
  text: 'Diz-se: “Se um homem mandar embora sua mulher, e ela se afastar dele e se tornar mulher de outro homem, voltará ele para ela outra vez? Aquela terra não ficaria completamente contaminada? Mas você se prostituiu com muitos amantes e você voltaria para mim?”[a] declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, mesmo assim, volte para mim”, entendendo a oração final como um convite no imperativo, e não como pergunta retórica.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: Diz-se
  rationale: O infinitivo funciona aqui como fórmula introdutória impessoal; “Diz-se” preserva esse caráter de citação ou formulação conhecida.
- source_word: הֵן
  choice: Se
  rationale: No contexto jurídico e hipotético, introduz uma suposição; “Se” é natural e preciso em português.
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: mandar embora sua mulher
  rationale: No contexto matrimonial, o verbo alude ao divórcio, mas a formulação mantém a imagem concreta do hebraico sem explicitar além do texto.
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: ela se afastar dele
  rationale: Expressa naturalmente em português o movimento de separação indicado pelo hebraico.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: se tornar mulher de outro homem
  rationale: Explicita o sentido matrimonial da construção hebraica elíptica, evitando em português a ambiguidade involuntária de “tornar-se de outro”.
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: voltará ele para ela outra vez?
  rationale: Mantém o verbo “voltar”, a força retórica da pergunta e o elemento reiterativo de עוֹד.
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: Essa terra não ficaria completamente contaminada?
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a contaminação; “completamente” comunica a ênfase em português corrente.
- source_word: וְאַתְּ זָנִית
  choice: Mas você se prostituiu
  rationale: Preserva a metáfora profética sexual e sua força acusatória em linguagem moderna, sem arcaísmo.
- source_word: רֵעִים רַבִּים
  choice: com muitos amantes
  rationale: Embora רֵעִים possa significar amigos ou companheiros, o contexto sexualizado torna “amantes” a equivalência contextual mais clara.
- source_word: וְשׁוֹב אֵלַי
  choice: E voltaria para mim?
  rationale: A frase é tomada como pergunta retórica em continuidade com as anteriores, mas sua possível leitura imperativa é preservada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino.
theological_decisions:
- issue: Se וְשׁוֹב אֵלַי é um convite imperativo ou uma pergunta retórica
  choice: 'Pergunta retórica: “E voltaria para mim?”'
  alternative: 'Convite imperativo: “e, mesmo assim, volte para mim”'
  rationale: A sequência imediata de perguntas retóricas e a analogia jurídica favorecem a leitura interrogativa. Como a forma hebraica também admite um surpreendente chamado ao retorno, a alternativa é registrada em nota para preservar a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora sexual forte do hebraico foi mantida. O nome divino foi vertido como “Yahweh”. O marcador [a] aparece no texto e corresponde à única nota.
