  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: pt
  text: 'E acontecerá que, quando vocês se multiplicarem e forem fecundos na terra, naqueles dias — declaração de Yahweh —, já não dirão: “A arca da aliança de Yahweh”. Ela não lhes virá à mente; não se lembrarão dela, nem sentirão sua falta[a], e ela não será feita novamente[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem se ocuparão dela” ou “nem a procurarão”. O verbo hebraico pode ter vários sentidos relacionados; aqui, provavelmente indica que já não notarão a ausência da arca nem sentirão necessidade dela.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem se fará outra”. O hebraico emprega uma forma passiva e deixa implícito o que não será feito; pelo contexto, trata-se de uma arca substituta.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: A combinação introduz uma circunstância futura. A formulação mantém a cadência profética e expressa כִּי naturalmente como temporal.
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: vocês se multiplicarem e forem fecundos
  rationale: Preserva os dois verbos distintos e o eco da fórmula bíblica de multiplicação e fecundidade, em português atual.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto, refere-se à terra de Israel/Judá, não ao planeta inteiro.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: naqueles dias
  rationale: Expressão profética tradicional, clara e natural em português.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Reproduz a fórmula profética solene e mantém o nome divino explícito.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: A arca da aliança de Yahweh
  rationale: Representa de modo transparente a cadeia construta hebraica e mantém a expressão como citação.
- source_word: וְלֹא יַעֲלֶה עַל לֵב
  choice: Ela não lhes virá à mente
  rationale: Traduz idiomaticamente a expressão hebraica literal 'subir sobre o coração', cujo sentido é vir ao pensamento.
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: não se lembrarão dela
  rationale: O sufixo pronominal retoma naturalmente a arca, substantivo feminino em português.
- source_word: וְלֹא יִפְקֹדוּ
  choice: nem sentirão sua falta
  rationale: No contexto da ausência da arca, expressa de forma natural um sentido provável do verbo פקד, sem ocultar seus outros sentidos possíveis, registrados em nota.
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: e ela não será feita novamente
  rationale: Mantém a voz passiva do hebraico e entende a arca como referente implícito; a ambiguidade sintática é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A forma Yahweh preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Situação futura da arca da aliança
  choice: A arca deixará de ser mencionada, lembrada, procurada ou refeita
  alternative: Interpretar o versículo como negação da fidelidade da aliança ou apenas como previsão da perda física da arca
  rationale: A tradução conserva as afirmações concretas do texto sobre a arca e não acrescenta uma conclusão sistemática sobre a continuidade ou abolição da aliança.
- issue: Referente implícito de וְלֹא יֵעָשֶׂה עוֹד
  choice: A arca não será feita novamente
  alternative: Não se fará outra arca
  rationale: A voz passiva hebraica omite o objeto; o contexto aponta para a arca, mas a alternativa igualmente possível é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa plural hebraica foi vertida por “vocês”, forma corrente e internacionalmente inteligível. A pontuação destaca a fórmula profética sem tornar a frase artificialmente arcaica.
