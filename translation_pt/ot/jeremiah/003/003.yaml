base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: pt
  text: Por isso, as chuvas foram retidas, e não houve chuva de primavera[a]; mas você tinha a testa de uma prostituta — recusou-se a sentir vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chuva tardia”. O termo hebraico se refere à chuva sazonal do fim da estação, aqui traduzida como “chuva de primavera” para maior clareza.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: foram retidas
  rationale: 'O nifal expressa aqui sentido passivo: as chuvas foram impedidas ou retidas. A formulação é natural em português e preserva o contexto de juízo.'
- source_word: רְבִבִים
  choice: as chuvas
  rationale: O substantivo designa chuvas ou aguaceiros. “As chuvas” é claro e natural, sem impor uma intensidade que o contexto não exige.
- source_word: מַלְקוֹשׁ
  choice: chuva da primavera
  rationale: Refere-se à chuva tardia da estação agrícola, que cai na primavera. A tradução comunica a referência sazonal com clareza ao leitor moderno.
- source_word: מֵצַח
  choice: testa
  rationale: Mantém a imagem concreta hebraica que representa descaramento e ausência de vergonha.
- source_word: אִשָּׁה זוֹנָה
  choice: uma prostituta
  rationale: Tradução direta, atual e digna, que conserva a força da metáfora profética sem recorrer a termo arcaico ou desnecessariamente vulgar.
- source_word: הָיָה לָךְ
  choice: você tinha
  rationale: A construção hebraica com היה e ל expressa posse; esta é a forma idiomática correspondente em português.
- source_word: מֵאַנְתְּ
  choice: recusou-se
  rationale: O verbo indica recusa deliberada, preservando a força da acusação.
- source_word: הִכָּלֵם
  choice: a sentir vergonha
  rationale: Expressa de modo natural em português a experiência de vergonha indicada pelo infinitivo hebraico.
theological_decisions:
- issue: Metáfora de imoralidade sexual para a infidelidade à aliança
  choice: Manter diretamente a imagem “a testa de uma prostituta”.
  alternative: Substituir por “você era descarada” ou “você não tinha vergonha”.
  rationale: A metáfora sexual é intencional e relaciona a idolatria de Judá à infidelidade conjugal. Preservá-la mantém a força profética e a tensão teológica do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e direto; a metáfora concreta e incisiva do hebraico foi preservada.
