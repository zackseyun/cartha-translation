source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: pt
  text: Naquele tempo, chamarão Jerusalém de “trono de Yahweh”, e todas as nações convergirão para ela, para Jerusalém, por causa do nome de Yahweh[b]. Não continuarão seguindo a obstinação do seu coração mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Literalmente, “para o nome de Yahweh”. A expressão hebraica indica a relação das nações com o nome de Yahweh sem especificar mais precisamente essa relação.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal profética natural em português, preservando a referência a um cenário futuro de restauração.
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: chamarão Jerusalém de “trono de Yahweh”
  rationale: Mantém a construção ativa e plural do hebraico, bem como a imagem literal do trono.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: e todas as nações se reunirão junto dela
  rationale: O nifal de קוה é difícil neste contexto; a formulação expressa a reunião das nações em direção a Jerusalém e preserva a referência pronominal feminina.
- source_word: כָל הַגּוֹיִם
  choice: todas as nações
  rationale: Refere-se amplamente aos povos, sem impor o contraste técnico sugerido por “gentios”.
- source_word: לְשֵׁם יְהוָה
  choice: por causa do nome de Yahweh
  rationale: Expressa de modo natural a orientação ou motivação ligada ao nome divino, sem especificar além do hebraico se se trata de honra, culto ou outra relação.
- source_word: לִירוּשָׁלָם
  choice: em Jerusalém
  rationale: Conserva a repetição explícita do nome da cidade; aqui “em” produz português natural após “junto dela”.
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: Não continuarão seguindo
  rationale: Traduz naturalmente o idioma hebraico de andar após algo, conservando a ideia de conduta continuada que chegará ao fim.
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: a obstinação do seu coração mau
  rationale: “Obstinação” comunica a teimosia ou resistência moral de שְׁרִרוּת; o singular coletivo “coração” é mantido.
theological_decisions:
- issue: Jerusalém como “trono de Yahweh”
  choice: Manter diretamente a imagem régia
  alternative: Explicá-la como símbolo da soberania divina, como referência eclesial ou como entronização futura literal
  rationale: O texto identifica Jerusalém com o trono de Yahweh sem definir o sistema escatológico pelo qual a imagem deve ser entendida.
- issue: O movimento das nações em direção a Jerusalém
  choice: Descrevê-lo como reunião junto de Jerusalém
  alternative: Especificá-lo como peregrinação cultual, conversão ou submissão política
  rationale: O hebraico apresenta a convergência das nações, mas não determina aqui uma dessas interpretações mais estreitas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe evita arcaísmos, conserva a repetição de Jerusalém e mantém as ambiguidades lexical e teológica relevantes.
