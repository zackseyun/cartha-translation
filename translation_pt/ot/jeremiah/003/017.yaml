review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a construção ativa, a imagem de Jerusalém como trono de Yahweh e a obstinação do coração mau. Contudo, “junto dela” pode indicar simples proximidade, não movimento/convergência para Jerusalém, e “em Jerusalém” enfraquece a repetição direcional do hebraico (“a ela, a Jerusalém”).
  naturalness: O português é claro e de registro adequado. “Convergirão para ela, para Jerusalém” expressa com maior precisão e fluência a direção do ajuntamento das nações.
  terminology: “Yahweh”, “trono”, “nações” e “obstinação” são escolhas adequadas. A nota b deve evitar explicar o “nome” por categorias interpretativas (“presença, autoridade ou honra”) e deve antes indicar a concisão/ambiguidade da expressão hebraica.
  issues:
  - severity: medium
    issue: “junto dela, em Jerusalém” não preserva plenamente a dupla expressão direcional.
    rationale: וְנִקְווּ אֵלֶיהָ ... לִירוּשָׁלָם apresenta a convergência das nações para Jerusalém e repete explicitamente o destino. “Junto dela” pode significar apenas “perto dela”, enquanto “em Jerusalém” transforma a segunda expressão direcional em localização.
  - severity: low
    issue: A nota b oferece explicações interpretativas desnecessariamente específicas.
    rationale: לְשֵׁם יְהוָה é uma expressão concisa cuja relação exata pode ser mantida aberta. A nota deve esclarecer o teor literal sem decidir se a ênfase é presença, autoridade, honra ou culto.
