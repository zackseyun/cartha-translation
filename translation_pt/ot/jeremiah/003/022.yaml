source:
  edition: WLC
  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: pt
  text: 'Voltem, filhos desviados[a]; eu curarei os desvios de vocês[b].


    — Eis que viemos a ti, pois tu és Yahweh, nosso Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos rebeldes” ou “filhos infiéis”. No hebraico, as palavras traduzidas por “voltem”, “desviados” e “desvios” pertencem à mesma família de ideias ligada a voltar e afastar-se.
    reason: lexical_alternative
  - marker: b
    text: Ou “curarei as infidelidades de vocês” ou “as apostasias de vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: O imperativo plural convoca o povo a retornar a Yahweh. “Voltem” preserva tanto o movimento relacional quanto a ligação temática com o afastamento descrito a seguir, sem reduzir o sentido ao arrependimento interior.
- source_word: בָּנִים שׁוֹבָבִים
  choice: filhos desviados
  rationale: “Filhos” mantém a imagem pactual e a forma masculina do hebraico; “desviados” expressa aqueles que se afastaram, em português corrente e sem impor desde logo a nuance mais forte de apostasia.
- source_word: אֶרְפָּה
  choice: eu curarei
  rationale: Mantém a metáfora concreta de cura usada pelo verbo רפא, aplicada aqui à restauração moral e espiritual.
- source_word: מְשׁוּבֹתֵיכֶם
  choice: os desvios de vocês
  rationale: O substantivo plural designa os afastamentos ou infidelidades do povo. “Desvios” mantém a relação lexical com “desviados” e conserva o plural hebraico.
- source_word: הִנְנוּ
  choice: Eis-nos aqui!
  rationale: A expressão de apresentação assinala a resposta imediata do povo. A formulação é digna, inteligível e idiomática em português.
- source_word: אָתָנוּ לָךְ
  choice: Viemos a ti
  rationale: O perfeito verbal indica que o povo se apresenta tendo vindo em direção a Yahweh. O pretérito perfeito é natural na resposta direta e preserva essa nuance.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente a expressão pactual com sufixo de primeira pessoa do plural.
theological_decisions:
- issue: Forma do nome pactual יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e evita convertê-lo silenciosamente em título.
- issue: Gênero e alcance de בָּנִים
  choice: filhos
  alternative: filhos e filhas / crianças
  rationale: O hebraico emprega o masculino plural “filhos” como designação coletiva do povo da aliança. A tradução conserva a forma e a imagem sem explicitar além do texto quem está incluído.
- issue: Força moral de שׁוֹבָבִים e מְשׁוּבוֹתֵיכֶם
  choice: desviados / desvios
  alternative: infiéis / infidelidades; apóstatas / apostasias
  rationale: A família lexical descreve afastamento e pode assumir forte sentido de infidelidade. A escolha conserva a imagem básica e deixa as nuances mais fortes na nota, sem atenuá-las nem torná-las a única leitura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso profético conserva dignidade sem arcaísmo excessivo. A quebra de parágrafo e o travessão distinguem o convite de Yahweh da resposta do povo, implícita no fluxo do hebraico.
