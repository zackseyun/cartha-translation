id: JER.3.21
reference: Jeremiah 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: pt
  text: 'Ouve-se uma voz nas alturas descampadas[a]: o choro e as súplicas por misericórdia dos filhos de Israel[b], pois eles tornaram tortuoso o seu caminho[c]; esqueceram-se de Yahweh[d], seu Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre as colinas áridas”. A expressão hebraica indica elevações expostas e sem vegetação.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos descendentes de Israel” ou “do povo de Israel”.
    reason: lexical_alternative
  - marker: c
    text: Ou “perverteram o seu caminho” ou “desviaram o seu caminho”.
    reason: lexical_alternative
  - marker: d
    text: Hebraico YHWH; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: uma voz
  rationale: קול pode significar “voz”, “som” ou “clamor”. “Uma voz” conserva a abertura vívida do hebraico e é esclarecida pela referência subsequente ao choro e às súplicas.
- source_word: עַל שְׁפָיִם
  choice: nas alturas descampadas
  rationale: שׁפיים designa elevações expostas, sem árvores ou vegetação. “Alturas descampadas” comunica tanto a elevação quanto a aridez, sem sugerir necessariamente o sentido técnico-cúltico de “lugares altos”.
- source_word: נִשְׁמָע
  choice: ouve-se
  rationale: O nifal de שמע tem sentido passivo, “é ouvido”. A construção pronominal “ouve-se” é natural e digna em português.
- source_word: בְּכִי
  choice: o choro
  rationale: O substantivo indica choro ou pranto. O artigo ajuda a apresentar “o choro e as súplicas” como explicação da voz ouvida.
- source_word: תַחֲנוּנֵי
  choice: as súplicas por misericórdia
  rationale: תחנונים expressa pedidos insistentes por favor ou compaixão. A formulação explicita essa força sem recorrer ao menos corrente “suplicações”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina plural do hebraico e a expressão bíblica tradicional, reconhecendo em nota seu uso coletivo para o povo de Israel.
- source_word: כִּי
  choice: pois
  rationale: Aqui כי introduz a causa do lamento. “Pois” exprime a relação causal com fluidez em português.
- source_word: הֶעֱוּוּ אֶת דַּרְכָּם
  choice: tornaram tortuoso o seu caminho
  rationale: O hifil de עוה descreve o ato de tornar torto, desviar ou perverter. A tradução preserva a metáfora concreta do caminho como modo de vida.
- source_word: שָׁכְחוּ
  choice: esqueceram-se
  rationale: O perfeito hebraico apresenta como consumado o abandono de Deus que explica o lamento presente. O pretérito perfeito é natural neste contexto narrativo-profético.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, distinguindo-o de títulos como “Senhor”.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Reproduz de modo direto a relação possessiva e pactual expressa no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual, enquanto a nota registra a tradição de substituí-lo por “SENHOR”.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel
  rationale: A tradução principal conserva a forma masculina plural do original, mas a expressão pode funcionar coletivamente e incluir todo o povo; essa possibilidade é registrada em nota.
- issue: Sentido moral da imagem do caminho tortuoso
  choice: tornaram tortuoso o seu caminho
  alternative: perverteram o seu caminho
  rationale: A imagem concreta é mantida sem reduzir a acusação à mera desorientação nem ampliar indevidamente seu conteúdo. A alternativa mais abstrata permanece em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação com dois-pontos torna explícita a aposição entre “uma voz” e “o choro e as súplicas”, sem acrescentar uma relação ausente do hebraico. Mantêm-se a metáfora do caminho e o nome divino.
