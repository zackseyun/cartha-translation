  text: נִשְׁכְּבָ֣ה בְּ/בָשְׁתֵּ֗/נוּ וּֽ/תְכַסֵּ/נוּ֮ כְּלִמָּתֵ/נוּ֒ כִּי֩ לַ/יהוָ֨ה אֱלֹהֵ֜י/נוּ חָטָ֗אנוּ אֲנַ֨חְנוּ֙ וַ/אֲבוֹתֵ֔י/נוּ מִ/נְּעוּרֵ֖י/נוּ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהֹוָ֥ה אֱלֹהֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: pt
  text: Deitemo-nos em nossa vergonha, e que a nossa desonra nos cubra, pois pecamos contra Yahweh, nosso Deus — nós e nossos pais[a] —, desde a nossa juventude até o dia de hoje, e não obedecemos à voz de Yahweh, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”. O hebraico diz literalmente “nossos pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: Deitemo-nos
  rationale: O coortativo qal na primeira pessoa do plural expressa exortação ou disposição voluntária; a formulação preserva tanto essa força quanto a imagem de prostração.
- source_word: בְּבָשְׁתֵּנוּ
  choice: em nossa vergonha
  rationale: A preposição ב marca a condição em que o povo se deita; “vergonha” é direta e natural em português.
- source_word: וּתְכַסֵּנוּ
  choice: e que ... nos cubra
  rationale: O imperfeito, em paralelo com o coortativo anterior, tem força volitiva; “que ... nos cubra” a reproduz naturalmente.
- source_word: כְּלִמָּתֵנוּ
  choice: a nossa desonra
  rationale: “Desonra” mantém a distinção lexical em relação a בֹּשֶׁת, sem eliminar o paralelismo entre os dois termos.
- source_word: לַיהוָה ... חָטָאנוּ
  choice: pecamos contra Yahweh
  rationale: Com חטא, a preposição ל identifica aquele contra quem se cometeu o pecado; “pecar contra” é a construção idiomática portuguesa.
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: nós e nossos pais
  rationale: A tradução conserva o termo masculino explícito אָבוֹת; uma nota registra o sentido coletivo possível, “antepassados”.
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: desde a nossa juventude até o dia de hoje
  rationale: A expressão indica a continuidade histórica da rebeldia desde o período inicial do povo até o presente da confissão.
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: e não obedecemos à voz
  rationale: A expressão hebraica “ouvir a voz” tem aqui o sentido idiomático de obedecer; a tradução comunica esse sentido sem apagar a referência à voz.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; “Yahweh” o representa diretamente em vez de substituí-lo por um título.
- issue: Solidariedade entre a geração presente e as anteriores na confissão
  choice: nós e nossos pais
  alternative: nós e nossos antepassados
  rationale: A formulação mantém o hebraico explícito e deixa que a nota indique a extensão coletiva possível, sem restringir nem ampliar silenciosamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com cadência penitencial. O coortativo foi mantido em “Deitemo-nos”, e o paralelismo entre “vergonha” e “desonra” preserva os dois substantivos hebraicos distintos.
