  text: וְ/הַ/בֹּ֗שֶׁת אָֽכְלָ֛ה אֶת יְגִ֥יעַ אֲבוֹתֵ֖י/נוּ מִ/נְּעוּרֵ֑י/נוּ אֶת צֹאנָ/ם֙ וְ/אֶת בְּקָרָ֔/ם אֶת בְּנֵי/הֶ֖ם וְ/אֶת בְּנוֹתֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: pt
  text: 'Mas a vergonha[a] devorou, desde a nossa juventude, o fruto do trabalho de nossos pais: seus rebanhos e seu gado, seus filhos e suas filhas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a coisa vergonhosa»; provavelmente uma referência depreciativa a Baal ou à idolatria.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: Mas a vergonha
  rationale: O substantivo definido significa literalmente «a vergonha» e pode funcionar, em Jeremias, como designação depreciativa da idolatria ou de Baal. A formulação mantém a personificação e a ambiguidade; «mas» expressa naturalmente a força contextual da conjunção.
- source_word: אָכְלָה
  choice: devorou
  rationale: O verbo significa literalmente «comeu», mas, tendo bens e pessoas como objetos, «devorou» preserva com naturalidade a metáfora vívida de consumo e destruição.
- source_word: יְגִיעַ
  choice: o fruto do trabalho
  rationale: O termo designa aquilo que é obtido mediante esforço, não apenas o ato de trabalhar. «Fruto do trabalho» comunica o resultado acumulado do labor e introduz adequadamente a lista explicativa.
- source_word: אֲבוֹתֵינוּ
  choice: de nossos pais
  rationale: Tradução direta do masculino plural, apropriada ao contexto geracional. «Antepassados» seria possível, mas menos formalmente correspondente.
- source_word: מִנְּעוּרֵינוּ
  choice: desde a nossa juventude
  rationale: A preposição indica o ponto inicial de uma situação prolongada; «desde» exprime com clareza essa duração temporal.
- source_word: צֹאנָם
  choice: seus rebanhos
  rationale: O coletivo abrange sobretudo ovelhas e cabras; «rebanhos» é a forma concisa e corrente em português.
- source_word: בְּקָרָם
  choice: seu gado
  rationale: O termo se refere ao gado bovino ou aos animais de grande porte. «Gado» é natural e evita a possível redundância de «rebanhos e manadas».
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Mantém o par explícito masculino e feminino do hebraico, sem reduzi-lo ao termo coletivo «filhos» ou «crianças».
theological_decisions:
- issue: Possível uso metonímico de «a vergonha» em referência a Baal ou à idolatria
  choice: Manter «a vergonha» no texto principal
  alternative: «a coisa vergonhosa» ou, interpretativamente, «Baal»
  rationale: A expressão hebraica pode ser uma abstração personificada ou uma designação depreciativa do culto idólatra. O texto principal conserva a formulação e a tensão do original, enquanto a nota informa o provável referente sem torná-lo explícito indevidamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para dar fluidez, sem apagar a metáfora nem a enumeração do hebraico. O marcador da nota foi colocado após a frase a que se aplica, embora a nota esclareça especificamente «a vergonha».
