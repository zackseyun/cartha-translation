id: JER.3.10
reference: Jeremiah 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: pt
  text: Contudo, apesar de tudo isso, Judá, sua irmã infiel, não voltou para mim de todo o coração, mas apenas de maneira fingida[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em falsidade”; isto é, a volta de Judá não foi sincera nem de todo o coração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: Contudo, apesar de tudo isso
  rationale: Expressa de modo natural a força adicional e concessiva da frase, remetendo aos juízos e advertências anteriores.
- source_word: לֹא שָׁבָה אֵלַי
  choice: não voltou para mim
  rationale: Preserva o sentido relacional e pactual de retornar a Yahweh, sem explicitar além do texto a ideia de arrependimento.
- source_word: בָּגוֹדָה
  choice: infiel
  rationale: Comunica a deslealdade e a traição no relacionamento pactual em português corrente; “traiçoeira” também seria possível, mas soa mais marcada.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: Judá, sua irmã infiel
  rationale: Mantém Judá em aposição a “sua irmã” e preserva a personificação feminina do contexto; o adjetivo foi posicionado junto de “irmã” para fluência em português.
- source_word: בְּכָל לִבָּהּ
  choice: de todo o coração
  rationale: Equivalente idiomático natural para inteireza e sinceridade de devoção.
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: mas apenas de maneira fingida
  rationale: Torna clara a oposição entre uma volta de todo o coração e uma volta falsa ou insincera, preservando a força restritiva de כִּי אִם.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e translitera o nome divino.
theological_decisions:
- issue: Nuance pactual do retorno de Judá
  choice: “voltou para mim”, deixando implícitos o arrependimento e a restauração do relacionamento
  alternative: “se arrependeu e voltou para mim”
  rationale: O verbo שׁוּב comporta a dimensão de arrependimento no contexto, mas a tradução não deve acrescentar uma formulação que o hebraico não explicita.
- issue: Metáfora profética de Judá como irmã
  choice: Manter explicitamente “sua irmã” e a personificação feminina
  alternative: Suprimir a metáfora e mencionar apenas a nação de Judá
  rationale: A imagem liga Judá à sua irmã Israel no contexto e sustenta a denúncia profética de infidelidade.
- issue: Natureza da volta de Judá
  choice: “de maneira fingida”, indicando falta de sinceridade
  alternative: “em falsidade” ou “falsamente”
  rationale: O contraste com “de todo o coração” mostra que o retorno ocorreu apenas em aparência; a formulação escolhida comunica isso sem definir sua forma histórica ou cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da aposição foi ajustada à sintaxe natural do português, sem eliminar a metáfora da irmã. O travessão antes da fórmula profética melhora a leitura sem alterar seu vínculo com a declaração.
