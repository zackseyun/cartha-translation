id: JER.3.15
reference: Jeremiah 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: pt
  text: E eu darei a vocês pastores[b] segundo o meu coração[a], e eles cuidarão de vocês com conhecimento e discernimento.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, de acordo com a minha vontade e os meus propósitos.
    reason: lexical_alternative
  - marker: b
    text: “Pastores” também pode ser entendido como “dirigentes”; o hebraico emprega a imagem ampla daqueles que cuidam do povo de Deus.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com conhecimento e entendimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E eu darei
  rationale: O perfeito qal na sequência profética expressa aqui uma promessa futura; a conjunção é preservada por “E”.
- source_word: לָכֶם
  choice: a vocês
  rationale: A preposição ל marca o objeto indireto. “A vocês” é claro e amplamente compreensível em português.
- source_word: רֹעִים
  choice: pastores
  rationale: O termo designa literalmente pastores de rebanhos e, por metáfora, dirigentes que cuidam do povo. “Pastores” preserva a imagem hebraica sem restringi-la a um cargo eclesiástico posterior.
- source_word: כְּלִבִּי
  choice: segundo o meu coração
  rationale: A formulação conserva a imagem hebraica e indica conformidade com a vontade, os propósitos e o caráter de Deus, não apenas afeição divina.
- source_word: וְרָעוּ אֶתְכֶם
  choice: e eles cuidarão de vocês
  rationale: O verbo רעה abrange pastorear, conduzir, alimentar e cuidar. Como “pastores” já estabelece a metáfora, “cuidarão de vocês” comunica naturalmente em português a amplitude da ação sem reduzi-la apenas ao ato de alimentar.
- source_word: דֵּעָה
  choice: conhecimento
  rationale: É o sentido comum do substantivo e permanece distinto do termo seguinte.
- source_word: וְהַשְׂכֵּיל
  choice: e discernimento
  rationale: A forma comunica entendimento perspicaz ou prudente. “Discernimento” forma com “conhecimento” um par natural e preserva os dois conceitos.
theological_decisions:
- issue: Natureza dos dirigentes prometidos
  choice: “pastores” refere-se a dirigentes humanos dados por Deus, apresentados pela metáfora pastoral
  alternative: “pastores” como cargo especificamente eclesiástico, ou “reis/governantes” em sentido mais restrito
  rationale: No contexto de Jeremias, a promessa trata da liderança restaurada do povo da aliança. A imagem literal mantém aberta a extensão da referência sem importar estruturas eclesiásticas posteriores.
- issue: Sentido de “segundo o meu coração”
  choice: dirigentes em conformidade com a vontade, os propósitos e o caráter de Deus
  alternative: dirigentes apenas especialmente amados por Deus
  rationale: O idioma hebraico aponta para correspondência com o coração ou a intenção de Deus, e não meramente para afeição emocional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com uso de “vocês” para explicitar o plural hebraico. A metáfora do pastor é mantida no substantivo, enquanto o verbo é vertido naturalmente como “cuidar”. Os marcadores foram posicionados junto às expressões que explicam.
