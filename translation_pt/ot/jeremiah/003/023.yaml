  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: pt
  text: Certamente, das colinas vem apenas falsidade — o tumulto nos montes[a]; certamente, em Yahweh, nosso Deus, está a salvação de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o barulho nos montes”; em hebraico, “o tumulto dos montes”.'
    reason: Alternativa lexical para הָמוֹן e esclarecimento da construção hebraica condensada.
lexical_decisions:
- source_word: אָכֵן
  choice: De fato
  rationale: Partícula de afirmação enfática. “De fato” soa natural em português e conserva a força confessional nas duas ocorrências.
- source_word: לַשֶּׁקֶר
  choice: só vem falsidade
  rationale: שֶׁקֶר denota falsidade ou engano. Diante da sintaxe elíptica, a formulação explicita com moderação que aquilo que se espera das colinas se mostra falso, sem inserir uma referência expressa a ídolos.
- source_word: מִגְּבָעוֹת
  choice: das colinas
  rationale: Preserva a imagem das colinas ou elevações, associadas no contexto de Jeremias ao culto apóstata, sem tornar essa associação explícita no texto.
- source_word: הָמוֹן הָרִים
  choice: o tumulto nos montes
  rationale: הָמוֹן pode indicar ruído, tumulto, alvoroço ou multidão. “O tumulto nos montes” comunica a leitura contextual provável e mantém, em nota, a construção hebraica mais literal.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב apresenta Yahweh como aquele em quem se encontra a verdadeira salvação, em contraste com a falsa esperança depositada nas colinas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Mantém a designação pactual e o caráter confessional da declaração.
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: a salvação de Israel
  rationale: Reproduz claramente a relação do estado construto, sem decidir além do necessário entre salvação pertencente a Israel e salvação destinada a Israel.
theological_decisions:
- issue: Contraste implícito entre os lugares de culto nas elevações e Yahweh como fonte da salvação
  choice: As colinas e o tumulto nos montes oferecem falsidade, enquanto a salvação de Israel está em Yahweh.
  alternative: Entender הָמוֹן הָרִים de modo mais literal como “a multidão dos montes”, sem alusão ao tumulto do culto.
  rationale: O contexto de Jeremias associa repetidamente colinas e montes ao culto apóstata. A tradução preserva o contraste sem acrescentar termos ausentes, como “ídolos” ou “santuários”.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “de fato” conserva o paralelismo enfático; “Yahweh” preserva o nome divino. O marcador foi colocado junto à expressão a que a nota se refere.
