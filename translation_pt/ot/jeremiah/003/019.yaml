  text: וְ/אָנֹכִ֣י אָמַ֗רְתִּי אֵ֚יךְ אֲשִׁיתֵ֣/ךְ בַּ/בָּנִ֔ים וְ/אֶתֶּן לָ/ךְ֙ אֶ֣רֶץ חֶמְדָּ֔ה נַחֲלַ֥ת צְבִ֖י צִבְא֣וֹת גּוֹיִ֑ם וָ/אֹמַ֗ר אָבִ/י֙ תקראו לִ֔/י וּ/מֵ/אַחֲרַ֖/י לֹ֥א תשובו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: pt
  text: 'E eu disse: “Como eu a colocaria entre os filhos[a] e lhe daria uma terra desejável, a mais esplêndida herança entre as nações[b]!” Eu disse ainda: “Você me chamará ‘Meu Pai’ e não deixará de me seguir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido familiar mais amplo, “entre os filhos”; o hebraico diz literalmente “entre os filhos” (masculino plural).
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta expressão é condensado e difícil. Mais literalmente, pode ser entendido como “uma herança de esplendor das hostes das nações”; também é possível: “uma herança gloriosa entre as nações”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ אֲשִׁיתֵךְ
  choice: Como eu a colocaria
  rationale: Mantém o caráter deliberativo e exclamativo de אֵיךְ com o imperfeito, sem transformar a frase categoricamente em impossibilidade. O pronome feminino singular retoma a comunidade personificada a quem Deus se dirige.
- source_word: בַּבָּנִים
  choice: entre os filhos
  rationale: בָּנִים é literalmente “filhos”; a formulação conserva a linguagem filial masculina do hebraico, enquanto a nota registra que o sentido familiar pode ser mais amplo.
- source_word: אֶרֶץ חֶמְדָּה
  choice: uma terra desejável
  rationale: חֶמְדָּה comunica aquilo que é desejado, precioso ou agradável. “Desejável” preserva esse campo sem reduzir a expressão apenas à beleza visual.
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: a mais esplêndida herança entre as nações
  rationale: A sequência nominal é comprimida e de sintaxe incerta. A tradução expressa o provável valor superlativo e idiomático de uma herança de esplendor excepcional entre as nações, deixando em nota uma representação mais literal dos componentes difíceis.
- source_word: אָבִי תקראו לִי
  choice: Vocês me chamarão ‘Meu Pai’
  rationale: קרא com ל pode indicar chamar ou dirigir-se a alguém. No contexto filial, a fala direta “Meu Pai” é natural; o plural corresponde à leitura tradicional do verbo.
- source_word: וּמֵאַחֲרַי לֹא תשובו
  choice: e não deixarão de me seguir
  rationale: A expressão literalmente direcional “não voltarão de detrás de mim” significa não abandonar o seguimento. A formulação portuguesa comunica o idioma com clareza e mantém a ideia de fidelidade contínua.
theological_decisions:
- issue: Linguagem filial de בַּבָּנִים
  choice: entre os filhos
  alternative: entre as crianças; como filhos
  rationale: O texto emprega o masculino plural “filhos” e retrata a comunidade feminina personificada sendo colocada entre eles. A tradução conserva essa tensão gramatical e a imagem de pertencimento filial, sem inserir explicitamente “meus”, ausente no hebraico.
- issue: Sentido de נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: a mais esplêndida herança entre as nações
  alternative: uma herança de esplendor das hostes das nações
  rationale: A sintaxe hebraica admite mais de uma relação entre “herança”, “esplendor”, “hostes” e “nações”. O texto principal oferece uma leitura idiomática provável, mas a nota preserva a forma mais literal e a incerteza, sem fazer de “exércitos” uma interpretação obrigatória.
- issue: Mudança do singular feminino para o plural
  choice: “a” e “lhe” na primeira oração; “vocês” na segunda
  alternative: uniformizar toda a fala no singular ou no plural
  rationale: O hebraico passa do sufixo feminino singular em אֲשִׁיתֵךְ e לָךְ para formas verbais plurais na parte final. A tradução mantém essa mudança textual em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento comunitário por “vocês”. As aspas e a pontuação tornam perceptíveis as duas declarações divinas. Evitou-se “exércitos” no texto principal porque צִבְאוֹת pode significar “hostes”, e a relação sintática do termo com “nações” é incerta.
