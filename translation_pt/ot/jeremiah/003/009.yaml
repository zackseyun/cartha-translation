id: JER.3.9
reference: Jeremiah 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: pt
  text: E, por causa da leviandade de sua prostituição[a], ela profanou a terra e cometeu adultério com a pedra e a madeira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do ruído” ou “da notícia de sua prostituição”. A expressão hebraica é difícil; pode indicar que sua prostituição se tornou notória ou que foi tratada com leviandade.'
    reason: lexical_alternative
  - marker: b
    text: “A pedra e a madeira” referem-se a ídolos feitos desses materiais.
    reason: cultural_note
lexical_decisions:
- source_word: מִקֹּל
  choice: por causa da leviandade
  rationale: A expressão hebraica é difícil. קוֹל significa literalmente “voz”, “som”, “ruído” ou “notícia”, mas, neste contexto, a tradição interpretativa também entende a ideia de tratar a prostituição com leviandade. A formulação escolhida mantém a relação causal e evita inserir um agente implícito, enquanto a nota registra a leitura mais literal.
- source_word: זְנוּתָהּ
  choice: sua prostituição
  rationale: O substantivo expressa imoralidade sexual e, no discurso profético, a infidelidade à aliança por meio da idolatria. “Prostituição” conserva a força deliberada da metáfora em português atual.
- source_word: וַתֶּחֱנַף
  choice: profanou
  rationale: O verbo חנף pode indicar tornar impuro, profano ou ímpio. Com “a terra” como objeto e em contexto de idolatria, “profanou” comunica tanto a contaminação quanto a dimensão religiosa do ato.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto de aliança, refere-se provavelmente à terra de Judá, não ao planeta inteiro. “A terra” preserva essa referência contextual.
- source_word: וַתִּנְאַף
  choice: cometeu adultério
  rationale: נאף é o termo comum para adultério. A tradução direta preserva a metáfora conjugal da infidelidade à aliança.
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: com a pedra e a madeira
  rationale: O hebraico nomeia literalmente os materiais, usados metonimicamente para os ídolos. A redação mantém a imagem incisiva sem acrescentar “ídolos” ao texto principal.
theological_decisions:
- issue: Metáfora sexual profética para a idolatria
  choice: Manter “prostituição” e “cometeu adultério” no texto principal.
  alternative: Substituir por termos gerais como “infidelidade” ou “apostasia”.
  rationale: Jeremias emprega intencionalmente linguagem conjugal e sexual para retratar a violação da aliança; suavizá-la reduziria a força teológica e retórica do original.
- issue: Referência implícita da pedra e da madeira
  choice: Conservar os materiais no texto e explicar a referência em nota.
  alternative: Traduzir explicitamente como “ídolos de pedra e madeira”.
  rationale: O hebraico deixa a idolatria implícita por metonímia. Preservar isso mantém a forma profética do original sem impedir a compreensão, pois a nota esclarece a alusão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e a repetição das imagens sexuais preservam o tom profético. “Leviandade” é um pouco mais formal, mas comunica concisamente o sentido adotado e permite conservar na nota a ambiguidade genuína do hebraico.
