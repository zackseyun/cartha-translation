id: JER.3.8
reference: Jeremiah 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: pt
  text: E vi que, por causa de todos os adultérios cometidos por Israel, que se afastou[a], eu a mandei embora e lhe dei uma certidão de divórcio[b]. Contudo, sua irmã Judá, a traiçoeira, não teve temor; ela também foi e se prostituiu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Israel, a infiel”. O termo hebraico enfatiza o ato de afastar-se ou abandonar a fidelidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um documento de divórcio”. Trata-se do documento legal que formalizava o divórcio.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foi e agiu como prostituta”. A expressão dá continuidade à metáfora do capítulo, que apresenta a infidelidade à aliança como infidelidade sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: E vi
  rationale: Mantém a primeira pessoa e a sequência narrativa do hebraico, sem transformar a percepção em mera conclusão abstrata.
- source_word: כִּי עַל כָּל אֹדוֹת אֲשֶׁר נִאֲפָה
  choice: que, por causa de todos os adultérios cometidos por
  rationale: Expressa tanto o conteúdo percebido, introduzido por כִּי, quanto a relação causal de עַל כָּל אֹדוֹת. A nominalização torna a construção natural em português e conserva a abrangência de כָּל.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israel, que se afastou
  rationale: Preserva de modo claro a ideia de afastamento ou apostasia presente em מְשֻׁבָה, evitando o uso pouco natural de 'a desviada' e distinguindo o termo de בֹּגֵדָה.
- source_word: שִׁלַּחְתִּיהָ
  choice: eu a mandei embora
  rationale: No contexto matrimonial, comunica o repúdio da esposa e se liga naturalmente à entrega do documento de divórcio.
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: uma certidão de divórcio
  rationale: Designa com clareza moderna o documento legal que formalizava o divórcio.
- source_word: וְלֹא יָרְאָה
  choice: não teve temor
  rationale: Conserva o sentido direto de ירא e seu peso moral, sem resolver o verbo apenas como 'não tomou isso como advertência'.
- source_word: בֹּגֵדָה יְהוּדָה
  choice: Judá, a traiçoeira
  rationale: Traduz בגד como conduta traiçoeira e mantém a distinção retórica em relação ao afastamento atribuído a Israel.
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: foi e se prostituiu
  rationale: Mantém a sequência verbal e a forte metáfora sexual da infidelidade à aliança, em linguagem atual e compreensível.
theological_decisions:
- issue: Preservação da metáfora matrimonial da infidelidade à aliança
  choice: Manter adultério, mandar embora, certidão de divórcio e prostituir-se
  alternative: Substituir a imagem por termos gerais como infidelidade ou idolatria
  rationale: O hebraico desenvolve explicitamente uma acusação em termos conjugais, sexuais e jurídicos. Torná-la genérica enfraqueceria a linguagem profética e ocultaria a ligação entre adultério e divórcio.
- issue: Distinção entre מְשֻׁבָה e בֹּגֵדָה
  choice: Traduzir respectivamente como 'que se afastou' e 'a traiçoeira'
  alternative: Empregar 'infiel' para ambos os termos
  rationale: 'A diferença lexical é deliberada: Israel é caracterizada por seu afastamento, enquanto Judá é acusada de agir traiçoeiramente. A tradução conserva essa tensão retórica.'
- issue: Sentido de וְלֹא יָרְאָה
  choice: não teve temor
  alternative: não tomou isso como advertência
  rationale: A alternativa explicita uma implicação provável do contexto, mas o texto emprega o verbo 'temer'. A tradução mantém essa formulação sem limitar sua possível dimensão moral ou religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe causal foi reorganizada para soar natural sem eliminar a compressão do hebraico. As imagens fortes de adultério, divórcio e prostituição foram preservadas, e os dois qualificativos distintos de Israel e Judá não foram nivelados.
