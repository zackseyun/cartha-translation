  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: pt
  text: Irei até os homens importantes e falarei com eles, pois eles conhecem o caminho de Yahweh, a justiça do seu Deus.[a] Mas também eles, todos juntos, quebraram o jugo e romperam as amarras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juízo do seu Deus” ou “a ordenança do seu Deus”. A palavra hebraica pode se referir à justiça, ao juízo ou a uma exigência legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  choice: Irei
  rationale: O coortativo com dativo ético expressa a decisão ou intenção do falante; o futuro simples comunica essa resolução naturalmente em português.
- source_word: הַגְּדֹלִים
  choice: os homens importantes
  rationale: No contraste contextual com os pobres, designa pessoas socialmente proeminentes ou poderosas. A formulação evita o sentido físico de “grandes” sem restringi-las necessariamente a governantes formais.
- source_word: וַאֲדַבְּרָה אוֹתָם
  choice: falar com
  rationale: Expressa de modo corrente a intenção de dirigir-se diretamente a essas pessoas; em português, “ir falar com” também evita repetição desnecessária.
- source_word: דֶּרֶךְ יְהוָה
  choice: o caminho de Yahweh
  rationale: Preserva a metáfora hebraica convencional para a conduta, vontade ou ordem estabelecida por Yahweh sem explicá-la em excesso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: a justiça do seu Deus
  rationale: “Justiça” representa bem o sentido ético-jurídico no contexto, enquanto a nota registra outras possibilidades genuínas de מִשְׁפָּט.
- source_word: אַךְ
  choice: Mas
  rationale: Marca o forte contraste entre a expectativa de que os importantes conhecessem o caminho de Yahweh e sua rebelião coletiva.
- source_word: הֵמָּה יַחְדָּו
  choice: também eles, todos juntos
  rationale: “Também eles” liga o grupo aos mencionados anteriormente, e “todos juntos” preserva a ênfase coletiva de יַחְדָּו.
- source_word: שָׁבְרוּ עֹל
  choice: quebraram o jugo
  rationale: Mantém a imagem concreta de rejeição violenta de sujeição ou obrigação sem definir de modo estreito seu referente.
- source_word: נִתְּקוּ מוֹסֵרוֹת
  choice: romperam as correias
  rationale: “Correias” designa as amarras paralelas ao jugo, e “romperam” transmite a ação enérgica do verbo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido da imagem do jugo e das correias
  choice: Manter a metáfora concreta
  alternative: Explicitar como rejeição da lei de Deus ou de outra forma específica de autoridade
  rationale: O contexto sugere rebelião contra a ordem de Deus, mas o versículo não limita expressamente a imagem a uma formulação doutrinária única.
- issue: Amplitude semântica de מִשְׁפַּט
  choice: justiça, com alternativas em nota
  alternative: juízo; ordenança
  rationale: O termo admite sentidos éticos, judiciais e normativos. O texto principal oferece uma leitura natural, enquanto a nota conserva a ambiguidade lexical relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Homens importantes” comunica proeminência social sem a possível leitura física de “grandes homens”. O marcador [a] foi colocado imediatamente após a expressão explicada.
