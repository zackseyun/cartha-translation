revisions:
- from: Irei falar com os homens importantes, pois eles conhecem o caminho de Yahweh, a justiça do seu Deus.[a] Mas também eles, todos juntos, quebraram o jugo e romperam as correias.
  to: Irei até os homens importantes e falarei com eles, pois eles conhecem o caminho de Yahweh, a justiça do seu Deus.[a] Mas também eles, todos juntos, quebraram o jugo e romperam as amarras.
  rationale: A revisão restitui de modo explícito a progressão verbal hebraica — ir até os homens importantes e falar com eles —, sem alterar o sentido. “Amarras” substitui “correias” para refletir com maior precisão e naturalidade o termo hebraico para vínculos ou restrições. A nota continua ancorada imediatamente após “justiça”, a expressão a que se refere.
