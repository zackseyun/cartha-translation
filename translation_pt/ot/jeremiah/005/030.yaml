  to: Uma coisa horrível e chocante aconteceu na terra:[a]
  rationale: A revisão preserva a ordem e o caráter concreto da expressão hebraica, usando “horrível” e “chocante” para comunicar a intensidade de שַׁמָּה וְשַׁעֲרוּרָה em português atual. “Na terra” evita acrescentar o demonstrativo “nesta”, e a nota oferece uma alternativa mais formal que torna explícita a dupla nominal.
