lexical_decisions:
- source_word: שַׁמָּה
  choice: uma coisa espantosa
  rationale: O substantivo designa algo que causa espanto ou horror. A formulação concreta e natural em português preserva essa força sem optar pelo sentido contextualmente menos provável de “desolação”.
- source_word: וְשַׁעֲרוּרָה
  choice: e horrível
  rationale: O termo caracteriza algo horrendo, monstruoso ou chocante. Coordenado com שַׁמָּה, intensifica a denúncia; em português, compartilhar “coisa” evita uma repetição pesada sem apagar a coordenação hebraica.
- source_word: נִהְיְתָה
  choice: aconteceu
  rationale: A forma de היה indica que a realidade descrita veio a ocorrer. “Aconteceu” é idiomático e mantém o aspecto perfectivo.
- source_word: בָּאָרֶץ
  choice: nesta terra
  rationale: O sintagma se refere à terra em que se passa a denúncia profética, isto é, Judá. “Nesta terra” é natural no contexto imediato e evita o sentido global de “na terra” entendido como planeta.
