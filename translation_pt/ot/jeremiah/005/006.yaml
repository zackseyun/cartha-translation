id: JER.5.6
reference: Jeremiah 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: pt
  text: Por isso, um leão da floresta os abate; um lobo das estepes[a] os devasta; um leopardo fica à espreita junto às suas cidades. Todo aquele que sair delas será despedaçado, pois são muitas as suas transgressões, e as suas apostasias[b] se fortaleceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um lobo do entardecer”. A expressão hebraica זְאֵב עֲרָבוֹת também tem sido relacionada ao horário vespertino de caça, mas “das estepes” entende o substantivo como referência a planícies áridas.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus desvios” ou “suas infidelidades”. O termo hebraico descreve afastamentos repetidos da fidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: os abate
  rationale: O verbo נכה indica golpear ou ferir com violência, muitas vezes de modo fatal. O presente profético harmoniza a sequência de imagens de juízo e mantém a força do ataque.
- source_word: אַרְיֵה מִיַּעַר
  choice: um leão da floresta
  rationale: Preserva a imagem concreta do predador e sua procedência em português natural.
- source_word: זְאֵב עֲרָבוֹת
  choice: um lobo das estepes
  rationale: עֲרָבוֹת pode designar planícies áridas ou regiões de estepe. “Estepes” comunica esse habitat com mais precisão do que o genérico “desertos”, enquanto a leitura ligada ao entardecer é registrada em nota.
- source_word: יְשָׁדְדֵם
  choice: os devasta
  rationale: שדד expressa devastação ou espoliação violenta; “devasta” combina com a imagem predatória sem restringir o sentido ao saque material.
- source_word: נָמֵר
  choice: um leopardo
  rationale: É a identificação corrente e reconhecível do animal indicado pelo termo hebraico.
- source_word: שֹׁקֵד עַל
  choice: fica à espreita junto a
  rationale: O particípio transmite vigilância persistente; no contexto de um predador ameaçador, “fica à espreita” torna explícita a intenção hostil implicada pela imagem.
- source_word: כָּל הַיּוֹצֵא מֵהֵנָּה
  choice: Todo aquele que sair delas
  rationale: Reproduz a força distributiva de כָּל com o particípio e entende o sufixo feminino plural como referência às cidades.
- source_word: יִטָּרֵף
  choice: será despedaçado
  rationale: O nifal de טרף evoca alguém dilacerado por uma fera; “despedaçado” preserva a imagem vívida e o sentido passivo.
- source_word: פִּשְׁעֵיהֶם
  choice: suas transgressões
  rationale: פשע designa infração com forte matiz de rebelião contra a autoridade; “transgressões” é claro e mantém o peso moral do termo.
- source_word: רַבּוּ
  choice: são muitas
  rationale: Expressa naturalmente em português o estado resultante de abundância indicado pelo verbo.
- source_word: עָצְמוּ
  choice: se fortaleceram
  rationale: Preserva o sentido de ganhar força ou intensidade, em vez de reduzir o verbo à simples multiplicação numérica.
- source_word: משבותיהם (מְשׁוּבוֹתֵיהֶם)
  choice: suas apostasias
  rationale: O termo descreve repetidos afastamentos ou retornos infiéis no âmbito da aliança; “apostasias” conserva a gravidade religiosa e moral da acusação.
theological_decisions:
- issue: A infidelidade à aliança expressa por מְשׁוּבוֹתֵיהֶם
  choice: suas apostasias
  alternative: seus desvios; suas infidelidades
  rationale: “Apostasias” comunica um afastamento deliberado e grave sem limitar o texto a uma formulação denominacional. A nota preserva opções que salientam a imagem de desviar-se ou voltar atrás.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A pontuação conserva a progressão das três imagens predatórias e a explicação moral final. “Estepes” evita a possível impressão de dunas sugerida por “desertos”, e “fica à espreita” comunica de modo natural a vigilância hostil do leopardo.
