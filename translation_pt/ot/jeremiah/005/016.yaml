id: JER.5.16
reference: Jeremiah 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׁפָּת֖/וֹ כְּ/קֶ֣בֶר פָּת֑וּחַ כֻּלָּ֖/ם גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
translation:
  language: pt
  text: A aljava deles[a] é como uma sepultura aberta; todos eles são homens valentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «A aljava dele», seguindo mais estritamente o sufixo singular; no hebraico, o sufixo singular tem um referente coletivo.
    reason: lexical_alternative
  - marker: b
    text: Ou «guerreiros».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: a aljava deles
  rationale: אַלְפָּה designa a aljava, o estojo em que se levam flechas. Embora o sufixo hebraico esteja formalmente no masculino singular («dele»), o referente contextual é a nação invasora tomada coletivamente; «deles» expressa isso de modo natural em português, preservando em nota a forma estritamente singular.
- source_word: כְּקֶבֶר פָּתוּחַ
  choice: é como uma sepultura aberta
  rationale: A preposição כְּ introduz uma comparação, e קֶבֶר é sepultura ou túmulo. «Sepultura aberta» comunica com clareza e força a imagem de morte, enquanto «aberta» descreve o estado da sepultura.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: A expressão explicita a totalidade dos integrantes do grupo e mantém a ênfase coletiva do hebraico.
- source_word: גִּבּוֹרִים
  choice: homens valentes
  rationale: O plural masculino pode designar homens fortes e valorosos, especialmente combatentes. «Homens valentes» conserva tanto o componente masculino quanto a ideia lexical de força e valentia; «guerreiros» fica registrado como alternativa contextual.
theological_decisions:
- issue: Forma masculina plural de גִּבּוֹרִים
  choice: homens valentes
  alternative: guerreiros
  rationale: O referente são combatentes masculinos da força invasora. A tradução mantém essa especificidade sem acrescentar qualquer avaliação moral positiva; a alternativa «guerreiros» destaca mais diretamente a função militar.
- issue: Sufixo singular em אַשְׁפָּתוֹ com referente coletivo
  choice: a aljava deles
  alternative: a aljava dele
  rationale: O singular morfológico é genuíno, mas a nação invasora funciona como referente coletivo no contexto. O plural idiomático evita uma referência ambígua em português, enquanto a nota preserva a possibilidade de tradução mais estritamente formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Aljava» é o termo português preciso e tradicional para o recipiente de flechas; embora menos frequente na fala cotidiana, o contexto torna seu sentido acessível. A ordem e o paralelismo conciso do hebraico foram preservados.
