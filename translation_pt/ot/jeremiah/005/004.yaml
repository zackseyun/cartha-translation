  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: pt
  text: 'Mas eu disse: “Certamente estes são apenas os pobres; agiram sem sensatez, pois não conhecem o caminho de Yahweh nem a justiça[a] do Deus deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juízo do Deus deles” ou “a ordenança do Deus deles”. A palavra hebraica pode se referir à justiça, a um juízo ou a uma exigência legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Mas eu disse
  rationale: A conjunção e o pronome explícito assinalam uma mudança para a reflexão do profeta, em contraste com a busca anterior. O verbo mantém seu sentido normal de ‘dizer’ e pode introduzir fala interior.
- source_word: אַךְ דַּלִּים הֵם
  choice: Certamente estes são apenas os pobres
  rationale: A combinação preserva tanto a ênfase assertiva quanto a nuance restritiva de אַךְ; ‘os pobres’ expressa a condição econômica e social indicada por דַּלִּים, e ‘estes’ comunica a força enfática do pronome.
- source_word: נוֹאֲלוּ
  choice: agiram sem sensatez
  rationale: A forma verbal pode descrever o comportamento insensato, não apenas uma qualidade permanente. A formulação é natural em português e evita transformar o juízo contextual em rótulo absoluto.
- source_word: כִּי לֹא יָדְעוּ
  choice: pois não conhecem
  rationale: A oração apresenta a razão do comportamento insensato; o presente comunica naturalmente a condição descrita pelo perfeito hebraico no contexto.
- source_word: דֶּרֶךְ יְהוָה
  choice: o caminho de Yahweh
  rationale: Preserva a expressão hebraica para a conduta, vontade ou ordem estabelecida por Deus e translitera diretamente o nome divino.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: a justiça do seu Deus
  rationale: ‘Justiça’ comunica o sentido ético-jurídico de מִשְׁפָּט, enquanto a nota conserva as alternativas legítimas ‘juízo’ e ‘ordenança’.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto contém o Tetragrama como nome pessoal. ‘Yahweh’ o representa por transliteração, sem substituí-lo por um título.
- issue: Amplitude semântica de מִשְׁפָּט
  choice: justiça
  alternative: juízo; ordenança
  rationale: No paralelismo com ‘o caminho de Yahweh’, ‘justiça’ exprime bem a ordem ética e jurídica de Deus, mas o termo hebraico também pode indicar uma decisão judicial ou uma exigência normativa; essa ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o contraste inicial, a fala interior e o idioma bíblico ‘caminho de Yahweh’, sem eliminar a ambiguidade jurídico-ética de מִשְׁפָּט.
