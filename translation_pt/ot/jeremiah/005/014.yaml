source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh, o Deus dos Exércitos: “Porque vocês dizem esta palavra,[a] eis que ponho as minhas palavras na sua boca como fogo,[b] e este povo, lenha;[d] o fogo os consumirá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Porque vocês disseram esta palavra”. O particípio hebraico pode ter sentido presente ou referir-se a uma fala recente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estou dando” ou “estou pondo”. A construção também pode ser traduzida “faço as minhas palavras na sua boca serem fogo”; no contexto, elas funcionam como fogo.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “madeira”; no contexto da metáfora do fogo, também pode ser traduzido por “lenha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão ou consequência que liga este anúncio de juízo ao contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional em linguagem portuguesa clara e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Mantém a força militar e cósmica de צְבָאוֹת sem limitar o referente a exércitos terrenos ou celestes.
- source_word: יַעַן
  choice: Porque
  rationale: Introduz diretamente a razão da ação divina anunciada.
- source_word: דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: vocês dizem esta palavra
  rationale: Mantém o valor participial presente e preserva a ligação lexical entre “palavra” e “minhas palavras”.
- source_word: הִנְנִי
  choice: eis que
  rationale: Conserva a solenidade e a imediatez da fórmula de anúncio profético.
- source_word: נֹתֵן ... לְאֵשׁ
  choice: faço com que ... sejam fogo
  rationale: 'Comunica em português natural a função predicativa da construção: Deus faz suas palavras atuarem como fogo, sem sugerir necessariamente uma transformação material.'
- source_word: דְּבָרַי
  choice: minhas palavras
  rationale: Preserva o plural explícito do hebraico.
- source_word: בְּפִיךָ
  choice: na sua boca
  rationale: Mantém a imagem corporal concreta e permite que a nota registre a mudança para o pronome hebraico singular.
- source_word: הָעָם הַזֶּה עֵצִים
  choice: este povo, lenha
  rationale: Conserva a metáfora compacta; “lenha” expressa com naturalidade madeira destinada a ser consumida pelo fogo.
- source_word: וַאֲכָלָתַם
  choice: o fogo os consumirá
  rationale: Torna explícito em português o referente do sujeito feminino singular hebraico, o fogo, e preserva a imagem de juízo.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal do Deus de Israel e evita substituí-lo silenciosamente por um título.
- issue: Mudança do plural em “vocês dizem” para o singular em “sua boca”
  choice: Manter a mudança e explicá-la em nota
  alternative: Uniformizar os pronomes como se toda a fala se dirigisse ao mesmo referente coletivo
  rationale: O hebraico passa de um sufixo plural em דַּבֶּרְכֶם para um sufixo singular em בְּפִיךָ. Isso provavelmente indica que Deus responde aos falantes no plural e depois se dirige pessoalmente a Jeremias, mas a nota preserva o pequeno grau de incerteza do referente.
- issue: Agente de “consumirá”
  choice: Explicitar “o fogo”
  alternative: Usar apenas “ele” ou “isso”
  rationale: A concordância hebraica aponta para אֵשׁ, “fogo”, como sujeito. A repetição elimina uma ambiguidade pronominal artificial em português sem alterar a metáfora.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Deus dos Exércitos” preserva a fórmula bíblica sem especificar indevidamente exércitos terrenos ou celestes. A construção “faço com que ... sejam fogo” evita uma formulação excessivamente rígida, enquanto a metáfora compacta “este povo, lenha” mantém a força poética do hebraico.
