reference: Jeremiah 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: pt
  text: Percorram as ruas de Jerusalém; olhem, por favor, constatem e procurem em suas praças se conseguem encontrar um homem[a], se há um só que pratique a justiça e busque a fidelidade[b]; então eu a perdoarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Um homem” traduz o substantivo masculino singular hebraico אִישׁ; o sentido é que nem sequer uma pessoa assim seria encontrada.
    reason: lexical_alternative
  - marker: b
    text: Ou “verdade”. O hebraico אֱמוּנָה pode indicar fidelidade, confiabilidade ou veracidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  choice: Percorram
  rationale: O imperativo plural indica deslocar-se amplamente pela cidade em uma busca, não apenas atravessá-la uma vez. “Percorram” comunica esse movimento investigativo em português natural.
- source_word: בְּחוּצוֹת יְרוּשָׁלִַם
  choice: as ruas de Jerusalém
  rationale: חוּצוֹת designa as ruas ou espaços exteriores da cidade; com o verbo de movimento, “percorram as ruas” é idiomático e fiel.
- source_word: וּרְאוּ נָא וּדְעוּ
  choice: olhem, por favor, constatem
  rationale: נָא acrescenta apelo ou insistência ao imperativo, preservado por “por favor”. דעו, literalmente “saibam”, tem aqui o sentido contextual de averiguar e reconhecer o que de fato existe, expresso naturalmente por “constatem”.
- source_word: וּבַקְשׁוּ בִרְחוֹבוֹתֶיהָ
  choice: e procurem em suas praças
  rationale: רְחֹבוֹת refere-se aos espaços públicos largos ou praças da cidade. “Suas” mantém a referência feminina personificada a Jerusalém.
- source_word: אִם תִּמְצְאוּ אִישׁ
  choice: se conseguem encontrar um homem
  rationale: A formulação comunica o objeto da busca e preserva o singular masculino אִישׁ, ao mesmo tempo que “conseguem” ressalta o desafio retórico de encontrar sequer um.
- source_word: אִם יֵשׁ
  choice: se há um só
  rationale: A repetição hebraica intensifica a procura por uma única pessoa que satisfaça os critérios. “Um só” torna essa ênfase clara sem neutralizar o singular anterior.
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: que pratique a justiça
  rationale: A expressão descreve a justiça como conduta habitual. “Pratique a justiça” é corrente em português e preserva a dimensão ética do hebraico.
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: busque a fidelidade
  rationale: אֱמוּנָה pode indicar fidelidade, confiabilidade ou verdade. “Fidelidade” preserva a dimensão moral e relacional, enquanto a alternativa legítima “verdade” é registrada em nota.
- source_word: וְאֶסְלַח לָהּ
  choice: então eu a perdoarei
  rationale: O verbo significa perdoar ou absolver, e o pronome feminino retoma Jerusalém. Neste contexto condicional, “então” explicita naturalmente a consequência veiculada pela conjunção hebraica.
theological_decisions:
- issue: O singular representativo אִישׁ
  choice: um homem
  alternative: uma pessoa; alguém
  rationale: O texto hebraico emprega um substantivo masculino singular. A tradução o preserva, e a nota esclarece que a força retórica é a impossibilidade de encontrar sequer uma pessoa assim.
- issue: O sentido ético de אֱמוּנָה
  choice: fidelidade
  alternative: verdade; honestidade
  rationale: O termo abrange fidelidade, confiabilidade e veracidade. “Fidelidade” mantém sua amplitude moral e relacional no contexto de Jeremias, sem eliminar a leitura contextual possível “verdade”, indicada em nota.
- issue: A relação entre a busca e o perdão de Jerusalém
  choice: então eu a perdoarei
  alternative: e eu a perdoarei
  rationale: A conjunção introduz aqui a consequência da condição precedente. “Então” comunica essa relação em português sem acrescentar uma condição teológica ausente nem identificar quem realiza a busca.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural e leitura natural tanto no Brasil quanto em outros contextos lusófonos. A personificação feminina de Jerusalém foi preservada em “suas” e “a perdoarei”. A sequência investigativa dos imperativos foi mantida sem o literalismo pouco natural de “saibam”.
