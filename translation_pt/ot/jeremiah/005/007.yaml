base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: pt
  text: Como eu poderia perdoar você por isso? Seus filhos me abandonaram e juraram pelos que não são deuses. Quando eu os saciei[a], cometeram adultério e se aglomeraram[b] na casa de uma prostituta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando eu os alimentei até se fartarem”. O verbo hebraico pode indicar fazer alguém ficar satisfeito ou farto; também pode ser entendido como “eu os fiz jurar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reuniram-se em bandos na casa de uma prostituta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי לָזֹאת אסלוח לָךְ
  choice: Como poderia eu perdoar você por isso?
  rationale: A pergunta retórica expressa perplexidade ou aparente impossibilidade. O singular mantém o tratamento da entidade coletiva feminina representada no hebraico.
- source_word: בָּנַיִךְ עֲזָבוּנִי
  choice: Seus filhos me abandonaram
  rationale: “Filhos” conserva a imagem da comunidade como descendência da entidade interpelada; “abandonaram” comunica com clareza o peso da ruptura da fidelidade.
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: e juraram pelos que não são deuses
  rationale: Reproduz a linguagem polêmica contra as falsas divindades e mantém o ato de jurar por elas.
- source_word: וָאַשְׂבִּעַ אוֹתָם
  choice: Embora eu os tivesse saciado
  rationale: Toma o verbo como causativo de שבע, “saciar”, e explicita de modo natural o contraste entre a provisão divina e a infidelidade subsequente. A possível leitura ligada a juramento é registrada em nota.
- source_word: וַיִּנְאָפוּ
  choice: cometeram adultério
  rationale: Tradução direta que preserva tanto a possibilidade de pecado sexual literal quanto sua ressonância de infidelidade à aliança.
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  choice: e se aglomeraram na casa de uma prostituta
  rationale: “Aglomeraram-se” expressa a reunião em grupo ou multidão sugerida pela forma verbal; “casa de uma prostituta” é atual e mantém o singular hebraico.
theological_decisions:
- issue: Adultério literal ou metafórico
  choice: Manter “cometeram adultério” sem determinar se se trata de imoralidade sexual, idolatria ou ambas.
  alternative: Explicitar “foram infiéis a Deus” ou interpretar a expressão apenas como pecado sexual.
  rationale: A linguagem profética pode sobrepor infidelidade sexual e infidelidade à aliança; a tradução não deve eliminar essa tensão.
- issue: Sentido de וָאַשְׂבִּעַ
  choice: Entender como “eu os saciei”.
  alternative: Entender como “eu os fiz jurar”.
  rationale: O sentido de satisfação/provisão forma um contraste coerente com a infidelidade do povo, mas a semelhança formal com a linguagem de juramento justifica registrar a alternativa.
- issue: Identidade da destinatária
  choice: Preservar o pronome singular sem inserir “Jerusalém” ou “Judá”.
  alternative: Nomear explicitamente Jerusalém ou Judá no texto.
  rationale: O hebraico trata uma entidade coletiva feminina no singular, mas o versículo não a nomeia; a tradução evita acrescentar uma identificação interpretativa.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Evitaram-se arcaísmos como “prostituta” em vez de termos envelhecidos, preservando-se ao mesmo tempo a contundência profética. Todos os marcadores de nota aparecem no texto.
