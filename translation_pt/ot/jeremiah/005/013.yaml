source:
  edition: WLC
  text: וְ/הַ/נְּבִיאִים֙ יִֽהְי֣וּ לְ/ר֔וּחַ וְ/הַ/דִּבֵּ֖ר אֵ֣ין בָּ/הֶ֑ם כֹּ֥ה יֵעָשֶׂ֖ה לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: pt
  text: E os profetas se tornarão vento[a], e a palavra não está neles; assim se fará com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito” ou “sopro”. A palavra hebraica רוּחַ pode ter qualquer um desses sentidos; aqui, provavelmente indica que os profetas são vazios ou inconsistentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: E os profetas
  rationale: Traduz diretamente o substantivo definido no plural com a conjunção, sem acrescentar uma ênfase ausente do hebraico.
- source_word: יִהְיוּ לְרוּחַ
  choice: se tornarão vento
  rationale: A construção de היה com לְ pode indicar transformação ou resultado. “Se tornarão vento” preserva essa força e a imagem polêmica de algo vazio ou inconsistente.
- source_word: וְהַדִּבֵּר
  choice: e a palavra
  rationale: Mantém a concisão do hebraico e deixa em aberto se se trata da palavra divina, da mensagem ou do falar profético.
- source_word: אֵין בָּהֶם
  choice: não está neles
  rationale: Reproduz de modo natural a construção existencial negativa e preserva a formulação deliberadamente aberta do original.
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: assim se fará com eles
  rationale: Conserva o tom solene e a forma passiva impessoal, sem explicitar um agente que o hebraico não nomeia.
theological_decisions:
- issue: Sentido de רוּחַ na denúncia contra os profetas
  choice: vento
  alternative: espírito; sopro
  rationale: No contexto, “vento” comunica melhor a acusação de vazio ou inconsistência e evita identificar indevidamente o termo com o Espírito Santo. A amplitude semântica do hebraico é preservada em nota.
- issue: Referência de “a palavra”
  choice: manter “a palavra” sem complemento explicativo
  alternative: a mensagem; a palavra do SENHOR
  rationale: O hebraico não explicita o complemento. A tradução preserva a ambiguidade entre a palavra divina verdadeira e uma mensagem com conteúdo real.
- issue: Agente da ação final
  choice: 'passiva impessoal: “assim se fará com eles”'
  alternative: isso lhes acontecerá
  rationale: A formulação evita nomear Deus ou outro agente onde o texto hebraico emprega uma forma passiva e não o declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a concisão do hebraico foram preservadas sem produzir uma frase artificial.
