id: JER.5.21
reference: Jeremiah 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: pt
  text: Ouçam isto agora, povo insensato e sem entendimento[a], que tem olhos, mas não vê, e tem ouvidos, mas não ouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “povo insensato e sem coração”. Aqui, “coração” se refere ao entendimento ou ao discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural preserva a convocação profética e permite repetir, no fim do versículo, o mesmo campo verbal de ouvir.
- source_word: נָא
  choice: agora
  rationale: Neste apelo profético, a partícula acrescenta urgência ou insistência, mais do que simples cortesia; “agora” comunica essa força em português corrente.
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo aponta diretamente para a palavra profética que acompanha ou segue, sem necessidade de acrescentar “mensagem” ou “coisa”.
- source_word: עַם
  choice: povo
  rationale: O substantivo singular designa coletivamente o povo a quem o profeta se dirige.
- source_word: סָכָל
  choice: insensato
  rationale: A palavra expressa falta de discernimento moral e espiritual, e não apenas pouca inteligência; “insensato” preserva essa nuance sem recorrer a linguagem excessivamente áspera.
- source_word: וְאֵין לֵב
  choice: e sem entendimento
  rationale: No idioma hebraico, לֵב pode designar a faculdade interior de compreender e discernir. A tradução idiomática evita que “sem coração” seja entendido apenas como falta de compaixão.
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: que tem olhos, mas não vê
  rationale: A formulação mantém o contraste entre possuir olhos e não perceber, conservando o povo coletivo no singular.
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: e tem ouvidos, mas não ouve
  rationale: A estrutura paralela à oração anterior preserva também a ironia verbal entre o chamado inicial “Ouçam” e a declaração final “não ouve”.
theological_decisions:
- issue: Uso antropológico de לֵב
  choice: sem entendimento
  alternative: sem coração; sem discernimento
  rationale: A repreensão diz respeito à insensibilidade moral e espiritual do povo. “Entendimento” comunica a função hebraica do coração como centro da compreensão e do discernimento, sem restringi-lo à esfera emocional.
- issue: Sentido coletivo do singular עַם
  choice: povo insensato, com os verbos relativos no singular
  alternative: nação insensata; povo insensato, com construção no plural
  rationale: O hebraico se dirige a Judá como corpo coletivo. “Povo” conserva essa referência, e o singular verbal mantém de modo natural em português a personificação coletiva do texto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “ouvir” no início e no fim foi preservada, assim como o paralelismo entre olhos/ver e ouvidos/ouvir.
