base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: pt
  text: Como uma gaiola cheia de aves[a], assim as casas deles estão cheias de engano[b]; por isso, tornaram-se grandes e enriqueceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cesto” ou “viveiro”, conforme o recipiente para aves indicado pela imagem.
    reason: lexical_alternative
  - marker: b
    text: “Engano” também pode ser traduzido por “traição” ou “fraude”; o termo hebraico abrange de modo amplo a conduta desonesta e exploradora.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: gaiola
  rationale: O substantivo designa um recipiente em que se mantêm aves. “Gaiola” comunica naturalmente a imagem em português, enquanto “cesto” ou “viveiro” permanecem alternativas possíveis.
- source_word: מָלֵא עוֹף
  choice: cheia de aves
  rationale: עוֹף é um termo amplo para aves ou criaturas voadoras. “Aves” é claro, digno e combina bem com a imagem da gaiola.
- source_word: כֵּן
  choice: assim
  rationale: A partícula estabelece a correspondência entre a gaiola cheia de aves e as casas cheias de engano.
- source_word: בָּתֵּיהֶם
  choice: as casas deles
  rationale: Preserva a imagem concreta das casas ou unidades domésticas que acumulam ganhos obtidos por meios desonestos.
- source_word: מְלֵאִים מִרְמָה
  choice: estão cheias de engano
  rationale: מִרְמָה abrange engano, fraude e traição. “Engano” mantém a amplitude do termo sem restringi-lo apenas à fraude financeira.
- source_word: עַל כֵּן
  choice: por isso
  rationale: 'Marca de modo natural e claro a consequência: a grandeza e a riqueza resultam da conduta enganosa descrita.'
- source_word: גָּדְלוּ
  choice: tornaram-se poderosos
  rationale: O verbo significa crescer ou tornar-se grande. Neste contexto social, “poderosos” torna explícita a elevação de posição sugerida pelo hebraico, sem confundi-la com tamanho físico.
- source_word: וַיַּעֲשִׁירוּ
  choice: e enriqueceram
  rationale: A forma verbal indica que se tornaram ricos. “Enriqueceram” é conciso e não acrescenta a nuance reflexiva mais forte de “enriqueceram a si mesmos”.
