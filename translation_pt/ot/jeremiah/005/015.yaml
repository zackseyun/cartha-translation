source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: pt
  text: Eis que estou trazendo contra vocês uma nação de longe, ó casa de Israel — declara Yahweh. É uma nação poderosa, uma nação antiga, uma nação cuja língua vocês não conhecem e não entendem o que ela diz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Vejam! Estou
  rationale: A partícula introduz solenemente o anúncio divino e chama a atenção dos destinatários. “Vejam!” é atual e preserva sua força dêitica.
- source_word: מֵבִיא עֲלֵיכֶם
  choice: trazendo contra vocês
  rationale: O particípio apresenta uma ação iminente ou já encaminhada; no contexto de juízo, “contra” expressa naturalmente o sentido hostil de עַל.
- source_word: גּוֹי
  choice: nação
  rationale: Designa uma coletividade étnico-política e é repetido para conservar a ênfase retórica do hebraico.
- source_word: מִמֶּרְחָק
  choice: que vem de longe
  rationale: Expressa em português corrente a origem distante da nação invasora. A explicitação verbal produz uma construção natural sem alterar o sentido.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Mantém a metáfora coletiva tradicional e torna explícita a função vocativa.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética de autoridade, usando o nome divino em vez de substituí-lo por um título.
- source_word: גּוֹי אֵיתָן
  choice: uma nação poderosa
  rationale: אֵיתָן pode indicar força, firmeza ou permanência; no contexto de invasão, “poderosa” comunica de modo natural seu poder formidável.
- source_word: גּוֹי מֵעוֹלָם
  choice: uma nação antiga
  rationale: מֵעוֹלָם indica aqui existência desde tempos remotos, não eternidade.
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: cuja língua vocês não conhecem
  rationale: Preserva a imagem hebraica de “língua” e o sentido de idioma desconhecido.
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: e cuja fala não entendem
  rationale: Neste contexto, שׁמע envolve compreensão, não apenas percepção auditiva; a formulação portuguesa mantém a distinção entre língua e fala.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Identidade da nação invasora
  choice: Não identificada no versículo
  alternative: Identificá-la explicitamente como Babilônia
  rationale: Embora o contexto mais amplo possa orientar a identificação histórica, este versículo a descreve sem nomeá-la; a tradução não deve inserir uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” corresponde ao destinatário coletivo marcado em עֲלֵיכֶם, enquanto “casa de Israel” é preservado como vocativo. A repetição de “uma nação” conserva a cadência enfática do hebraico. Não foram usadas notas porque as alternativas lexicais não são necessárias para compreender o texto e nenhuma ambiguidade decisiva foi eliminada.
