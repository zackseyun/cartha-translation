id: JER.5.10
reference: Jeremiah 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲל֤וּ בְ/שָׁרוֹתֶ֨י/הָ֙ וְ/שַׁחֵ֔תוּ וְ/כָלָ֖ה אַֽל תַּעֲשׂ֑וּ הָסִ֨ירוּ֙ נְטִ֣ישׁוֹתֶ֔י/הָ כִּ֛י ל֥וֹא לַ/יהוָ֖ה הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: pt
  text: Subam por entre as fileiras de videiras dela e destruam[a], mas não acabem com ela por completo. Arranquem os seus ramos[b], pois eles não pertencem a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Subam sobre as muralhas dela e destruam”. O termo hebraico traduzido por “fileiras de videiras” é difícil; alguns entendem a imagem em sentido arquitetônico, não agrícola.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Removam os seus brotos” ou “as suas gavinhas”. O hebraico pode dar continuidade à metáfora da vinha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: Subam
  rationale: Imperativo plural de עלה dirigido aos atacantes; preserva o movimento de avanço sem explicitar além do hebraico.
- source_word: בְשָׁרוֹתֶיהָ
  choice: por entre as fileiras de videiras dela
  rationale: O termo hebraico é difícil e admite interpretação arquitetônica, mas o paralelismo com נְטִישׁוֹתֶיהָ favorece aqui a imagem da vinha. A nota preserva a alternativa.
- source_word: וְשַׁחֵתוּ
  choice: e destruam
  rationale: Traduz diretamente o imperativo intensivo de שׁחת, mantendo a força da ordem.
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: mas não acabem com ela por completo
  rationale: Expressa em português natural a locução que proíbe levar a destruição até o fim, sem eliminar a tensão com a ordem anterior.
- source_word: הָסִירוּ
  choice: Arranquem
  rationale: No quadro agrícola adotado no texto principal, comunica a remoção dos ramos de modo concreto; a alternativa lexical é registrada em nota.
- source_word: נְטִישׁוֹתֶיהָ
  choice: os seus ramos
  rationale: Termo raro, provavelmente referente a brotos, gavinhas ou ramificações; “ramos” é claro e mantém a metáfora sem precisão indevida.
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: pois eles não pertencem a Yahweh
  rationale: A construção com ל indica pertencimento ou relação. O plural retoma mais naturalmente os ramos mencionados imediatamente antes.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Emprega uma forma corrente de vocalização do nome pactual, em vez de substituí-lo por um título.
- issue: Alcance da destruição ordenada
  choice: destruir sem acabar por completo
  alternative: entender a segunda ordem como simples atenuação retórica
  rationale: Mantém explicitamente a tensão do hebraico entre a devastação e a proibição de extermínio total, sem explicar teologicamente o motivo no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural imperativo foi mantido. A formulação principal adota a imagem agrícola, enquanto as notas conservam a incerteza lexical e a possível leitura arquitetônica.
