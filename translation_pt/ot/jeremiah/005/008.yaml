  yaml_path: translation/ot/jeremiah/005/008.yaml
  text: They were well-fed[a], lusty stallions; each one neighing after his neighbor’s wife.
translation:
  language: pt
  text: Eram garanhões bem alimentados e fogosos; cada um relinchava atrás da mulher de seu próximo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «Eram cavalos bem alimentados, que se levantavam cedo». O termo hebraico traduzido como «fogosos» é difícil e pode ter relação com levantar-se cedo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  choice: garanhões
  rationale: Embora o substantivo básico signifique «cavalos», o contexto sexual destaca animais machos; «garanhões» torna clara a comparação em português.
- source_word: מְיֻזָּנִים
  choice: bem alimentados
  rationale: O particípio passivo descreve animais alimentados e vigorosos; «bem alimentados» é natural e preserva a ideia.
- source_word: מַשְׁכִּים
  choice: ávidos por acasalar
  rationale: A forma hebraica é difícil. No contexto, esta tradução comunica a avidez sexual da imagem sem ocultar em nota a possível relação com levantar-se cedo.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular tem sentido distributivo e individualiza os homens comparados aos garanhões.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: pela mulher do seu próximo
  rationale: Com o verbo «relinchar», a preposição «por» expressa de modo natural o desejo dirigido à mulher alheia; «próximo» preserva a relação social ampla do hebraico.
- source_word: יִצְהָלוּ
  choice: relinchava
  rationale: O verbo designa o som emitido pelo cavalo. O singular concorda naturalmente com o distributivo «cada um» e mantém viva a metáfora.
