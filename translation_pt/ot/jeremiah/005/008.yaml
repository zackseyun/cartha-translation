  source_fidelity: A tradução preserva adequadamente a imagem comparativa, «bem alimentados», o sentido distributivo de אִישׁ e o relincho dirigido à esposa do próximo. Contudo, «ávidos por acasalar» explicita e estreita excessivamente o valor do termo hebraico difícil מַשְׁכִּים; o contexto é sexual, mas a expressão não afirma diretamente o ato de acasalar. Uma formulação idiomática que mantenha a vivacidade sexual sem converter a inferência em afirmação lexical é preferível.
  naturalness: «Garanhões bem alimentados e fogosos» é fluente, digna e compreensível no português internacional. «Relinchava atrás da mulher de seu próximo» expressa naturalmente a direção desejante sugerida pelo hebraico e evita a ambiguidade de «relinchar pela mulher», que pode soar causal ou em defesa dela.
  terminology: «Garanhões» é uma contextualização segura de «cavalos» na metáfora sexual. «Fogosos» conserva o caráter sexualmente impetuoso da imagem sem alegar que מַשְׁכִּים significa especificamente «ávidos por acasalar». «Mulher de seu próximo» mantém a relação de esposa alheia indicada pelo hebraico.
