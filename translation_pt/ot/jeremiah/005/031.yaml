id: JER.5.31
reference: Jeremiah 5:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/נְּבִיאִ֞ים נִבְּא֣וּ בַ/שֶּׁ֗קֶר וְ/הַ/כֹּהֲנִים֙ יִרְדּ֣וּ עַל יְדֵי/הֶ֔ם וְ/עַמִּ֖/י אָ֣הֲבוּ כֵ֑ן וּ/מַֽה תַּעֲשׂ֖וּ לְ/אַחֲרִיתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: pt
  text: Os profetas profetizam falsidades, e os sacerdotes governam sob a autoridade deles[a]; o meu povo gosta que seja assim. Mas o que vocês farão quando chegar o fim disso?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob a direção deles” ou “por meio das mãos deles”. A expressão hebraica é difícil.
    reason: alternative_reading
  - marker: b
    text: Ou “o fim dela”. O sufixo hebraico é feminino e pode se referir à situação, à terra ou à cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: profetizam falsidades
  rationale: A construção hebraica expressa profecia marcada pela falsidade. O presente habitual descreve com naturalidade a prática vigente no contexto, e “falsidades” preserva a acusação sem restringi-la necessariamente a uma única mentira.
- source_word: יִרְדּוּ
  choice: governam
  rationale: O verbo רדה normalmente indica governar, dominar ou exercer autoridade. “Governam” mantém aqui a ideia de poder exercido pelos sacerdotes.
- source_word: עַל יְדֵיהֶם
  choice: sob a autoridade deles
  rationale: A expressão é difícil. Esta formulação comunica que o governo sacerdotal se exerce sob a influência ou autoridade dos profetas, ao mesmo tempo que uma nota registra outras possibilidades formais.
- source_word: כֵן
  choice: que seja assim
  rationale: No contexto, כֵן se refere à situação descrita. A expressão portuguesa é corrente e deixa claro que o povo aprova esse estado de coisas.
- source_word: לְאַחֲרִיתָהּ
  choice: quando chegar o fim disso
  rationale: אַחֲרִית pode indicar fim, desfecho ou resultado. “Disso” retoma naturalmente a situação corrupta descrita, sem fixar de modo indevido o referente do sufixo feminino.
- source_word: וּמַה תַּעֲשׂוּ
  choice: Mas o que vocês farão
  rationale: A conjunção introduz uma virada retórica de advertência. “Mas” expressa bem esse contraste, e “vocês” torna explícita em português a segunda pessoa do plural.
theological_decisions:
- issue: Referente do sufixo feminino em לְאַחֲרִיתָהּ
  choice: 'Retomar impessoalmente a situação descrita: “o fim disso”'
  alternative: 'Entender o sufixo como referência à terra ou à cidade: “o fim dela”'
  rationale: O hebraico não identifica de maneira inequívoca o antecedente. A tradução principal relaciona a advertência ao estado de corrupção descrito, enquanto a nota preserva a possibilidade de referência à terra ou à cidade.
- issue: Relação entre os sacerdotes e os profetas em עַל יְדֵיהֶם
  choice: Os sacerdotes governam sob a autoridade dos profetas
  alternative: Os sacerdotes governam sob a direção deles ou por meio das mãos deles
  rationale: A sintaxe hebraica é incomum e admite mais de uma análise. A tradução escolhida expressa dependência ou influência sem definir além do necessário a forma dessa relação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo profético foi preservado; o presente verbal apresenta as ações como práticas habituais, e as ambiguidades reais do hebraico foram mantidas em notas.
