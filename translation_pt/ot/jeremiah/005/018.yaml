source:
  edition: WLC
  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: pt
  text: Mas, mesmo naqueles dias, declara Yahweh, não destruirei vocês por completo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não farei com vocês um fim completo”. Também pode ser traduzido: “não farei de vocês uma destruição completa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Mas, mesmo
  rationale: A combinação da conjunção com a partícula aditiva dá continuidade ao anúncio anterior e, no contexto, introduz uma ressalva enfática; “Mas, mesmo” expressa essa força concessiva com naturalidade.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: naqueles dias
  rationale: Expressão temporal comum que preserva o registro profético e se refere ao período de julgamento já mencionado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética נְאֻם comunica uma declaração solene; “declara” é atual e digna, enquanto “Yahweh” translitera o nome divino.
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: não acabarei completamente com vocês
  rationale: O idioma hebraico significa levar alguém ao fim, isto é, destruí-lo por completo. Esta formulação portuguesa comunica claramente a negação da aniquilação total sem negar a severidade do julgamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Alcance do julgamento prometido
  choice: não acabarei completamente com vocês
  alternative: não farei de vocês um extermínio completo
  rationale: 'A tradução mantém a tensão do texto: o julgamento será real e severo, mas não resultará na aniquilação total do povo.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da fórmula profética acompanha o hebraico. “Acabarei completamente com vocês” é mais natural do que a reprodução literal do idioma hebraico, que é preservada na nota.
