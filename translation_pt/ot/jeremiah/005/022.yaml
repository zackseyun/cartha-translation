  - severity: low
    issue: «não passam além desse limite» amplia levemente a formulação repetida
    rationale: O hebraico repete «não o ultrapassam». A explicitação é compreensível, mas «não o ultrapassam» mantém a coesão e a repetição verbal sem introduzir «além».
