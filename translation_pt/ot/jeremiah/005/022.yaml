source:
  edition: WLC
  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: pt
  text: “Vocês não me temem?”, declara Yahweh. “Não tremem diante de mim, eu que pus a areia como limite para o mar, um decreto perpétuo que ele não pode ultrapassar? Ainda que suas ondas se agitem[a], elas não prevalecem; ainda que rujam, não o ultrapassam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda que suas ondas se enfureçam”.'
    reason: O verbo hebraico pode enfatizar tanto a agitação tumultuosa quanto a fúria das ondas.
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: Vocês não me temem?
  rationale: A partícula interrogativa introduz uma pergunta retórica. “Temer” preserva tanto o medo quanto a reverência exigida pelo contexto, sem restringir o sentido a mero pavor.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” mantém a força solene da fórmula profética, e “Yahweh” translitera o nome divino expresso no texto hebraico.
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: Não tremem diante de mim
  rationale: O verbo pode indicar tremer, contorcer-se ou angustiar-se. Em paralelismo com “temer”, “tremer diante de mim” comunica de modo natural a reação de temor reverente.
- source_word: אֲשֶׁר שַׂמְתִּי
  choice: eu que pus
  rationale: O verbo está explicitamente na primeira pessoa singular. A formulação mantém a autorreferência de Yahweh e evita a mudança desnecessária para a terceira pessoa.
- source_word: חוֹל גְּבוּל לַיָּם
  choice: a areia como limite para o mar
  rationale: A construção apresenta a areia como o limite estabelecido para o mar. “Limite” é claro e corrente em português.
- source_word: חָק עוֹלָם
  choice: uma determinação perpétua
  rationale: חָק designa algo fixado ou decretado, e עוֹלָם ressalta sua permanência. “Determinação perpétua” preserva os dois aspectos sem soar excessivamente jurídico.
- source_word: וְלֹא יַעַבְרֶנְהוּ
  choice: que ele não pode ultrapassar
  rationale: O mar é o sujeito implícito, e o sufixo remete ao limite ou à determinação. A tradução torna explícito apenas o necessário para a fluidez em português.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: Ainda que suas ondas se agitem
  rationale: O verbo descreve movimento tumultuoso, agitação ou fúria. O sujeito “ondas”, expresso na oração paralela hebraica, é antecipado para dar clareza em português.
- source_word: וְלֹא יוּכָלוּ
  choice: elas não prevalecem
  rationale: O verbo significa literalmente “não são capazes”; no contexto, a incapacidade é a de vencer ou superar o limite, bem expressa por “não prevalecem”.
- source_word: וְהָמוּ גַלָּיו
  choice: ainda que rujam
  rationale: המה descreve o forte estrondo das ondas. “Rujam” conserva a imagem sonora e o paralelismo concessivo.
- source_word: וְלֹא יַעַבְרֻנְהוּ
  choice: não passam além desse limite
  rationale: A expressão retoma o mesmo limite estabelecido por Deus. A explicitação de “desse limite” evita um pronome obscuro em português e preserva a repetição conceitual do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio. “Yahweh” preserva sua função de nome pessoal por transliteração, em vez de substituí-lo por um título.
- issue: Força de תִירָאוּ no contexto da repreensão
  choice: temem
  alternative: reverenciam; têm medo de
  rationale: “Temem” mantém conjuntamente as dimensões de medo, reverência e submissão, sem reduzir o termo a uma única nuance teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes e concordância de boa legibilidade brasileira. Mantém-se a estrutura de perguntas retóricas, a imagem cosmológica e o paralelismo poético, evitando linguagem denominacional.
