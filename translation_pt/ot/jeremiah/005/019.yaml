source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י תֹאמְר֔וּ תַּ֣חַת מֶ֗ה עָשָׂ֨ה יְהֹוָ֧ה אֱלֹהֵ֛י/נוּ לָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עֲזַבְתֶּ֤ם אוֹתִ/י֙ וַ/תַּעַבְד֞וּ אֱלֹהֵ֤י נֵכָר֙ בְּ/אַרְצְ/כֶ֔ם כֵּ֚ן תַּעַבְד֣וּ זָרִ֔ים בְּ/אֶ֖רֶץ לֹ֥א לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: pt
  text: 'E, quando vocês disserem: “Por que Yahweh, nosso Deus, fez todas estas coisas conosco?”, você lhes dirá: “Assim como vocês me abandonaram e serviram a deuses estrangeiros em sua terra, assim também servirão a estrangeiros[a] numa terra que não é de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servirão a forasteiros”. O hebraico usa aqui um termo que designa pessoas estrangeiras, em contraste com os “deuses estrangeiros” mencionados antes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, quando
  rationale: A expressão introduz uma situação futura. A formulação é natural em português e conserva tanto a ligação com o contexto quanto o valor temporal.
- source_word: תַּחַת מֶה
  choice: Por que
  rationale: A expressão hebraica pergunta pela causa ou razão; “Por que” é o equivalente idiomático mais claro.
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  choice: fez todas estas coisas
  rationale: Conserva o demonstrativo plural e aponta para os atos de juízo mencionados no contexto.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, distinguindo-o do título “Senhor”.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo da primeira pessoa do plural e preserva a linguagem relacional da aliança.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: você lhes dirá
  rationale: O hebraico passa da fala do povo no plural para a instrução dirigida ao profeta no singular; a tradução mantém essa mudança de número.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... assim também
  rationale: Preserva a estrutura comparativa e a correspondência retórica entre a infidelidade do povo e sua punição.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: vocês me abandonaram
  rationale: “Abandonaram” comunica com naturalidade a ruptura grave expressa por עזב neste contexto de infidelidade a Deus.
- source_word: וַתַּעַבְדוּ ... תַּעַבְדוּ
  choice: serviram ... servirão
  rationale: 'A repetição do mesmo verbo preserva o jogo judicial do hebraico: por terem servido a deuses estrangeiros, eles servirão a pessoas estrangeiras.'
- source_word: אֱלֹהֵי נֵכָר
  choice: deuses estrangeiros
  rationale: Expressa de modo claro deuses vinculados ao que é estrangeiro e mantém a conexão lexical com os estrangeiros da segunda metade do versículo.
- source_word: בְּאַרְצְכֶם
  choice: em sua terra
  rationale: Mantém a referência direta à terra pertencente ao povo, sem explicitação desnecessária.
- source_word: זָרִים
  choice: estrangeiros
  rationale: Neste paralelo, o termo designa pessoas estrangeiras, em contraste com os “deuses estrangeiros” mencionados antes.
- source_word: בְּאֶרֶץ לֹא לָכֶם
  choice: numa terra que não é de vocês
  rationale: Reproduz claramente o contraste entre “sua terra” e uma terra que não lhes pertence.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança. “Yahweh” preserva sua condição de nome e evita substituí-lo silenciosamente por um título.
- issue: Sentido de עבד no paralelismo
  choice: serviram a deuses ... servirão a estrangeiros
  alternative: adoraram deuses ... serão escravizados por estrangeiros
  rationale: “Servir” conserva o mesmo verbo nas duas metades e mantém a tensão intencional entre culto religioso e sujeição política, sem resolver o paralelo por interpretação.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade no Brasil. A alternância entre “vocês” e “você” é intencional: no hebraico, o povo fala no plural, enquanto Deus dirige a resposta ao profeta no singular. O marcador da nota foi colocado junto de “estrangeiros”, termo ao qual a nota se refere.'
