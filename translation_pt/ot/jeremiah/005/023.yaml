base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/023.yaml
  text: But this people has had a stubborn and rebellious heart; they have turned aside and gone away.
translation:
  language: pt
  text: Mas este povo tem um coração obstinado e rebelde; eles se desviaram e foram embora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Mantém a imagem hebraica do centro da vontade e das disposições interiores, natural também em português.
- source_word: סוֹרֵר
  choice: obstinado
  rationale: Expressa a resistência persistente e voluntariosa indicada pelo termo, sem limitar seu sentido à mera teimosia cotidiana.
- source_word: וּמוֹרֶה
  choice: e rebelde
  rationale: Reproduz o paralelismo coordenado e a ideia de insubordinação.
- source_word: סָרוּ
  choice: desviou-se
  rationale: Preserva a noção de afastar-se do caminho devido; a concordância coletiva com 'este povo' é idiomática em português.
- source_word: וַיֵּלֵכוּ
  choice: e foi embora
  rationale: 'Mantém a progressão verbal do hebraico: o povo se desviou e se afastou.'
theological_decisions:
- issue: Valor temporal de הָיָה na descrição do coração
  choice: tem um coração
  alternative: passou a ter / tem tido um coração
  rationale: Em uma oração descritiva, o verbo hebraico pode funcionar como cópula contextual; o presente comunica naturalmente o estado denunciado no contexto, sem impor uma ideia de aquisição ou duração que o texto não explicita.
- issue: Concordância dos verbos plurais com o coletivo 'povo'
  choice: 'singular em português: ''desviou-se e foi'''
  alternative: 'plural: ''desviaram-se e foram'''
  rationale: O hebraico passa do substantivo coletivo singular a verbos plurais, destacando seus integrantes. Em português, a concordância singular com 'este povo' é mais natural e não altera a responsabilidade coletiva.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A formulação conserva as duas qualificações paralelas do coração e os dois movimentos sucessivos do povo, evitando explicações doutrinárias acrescentadas.
