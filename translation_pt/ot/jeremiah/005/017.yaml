  text: וְ/אָכַ֨ל קְצִֽירְ/ךָ֜ וְ/לַחְמֶ֗/ךָ יֹאכְלוּ֙ בָּנֶ֣י/ךָ וּ/בְנוֹתֶ֔י/ךָ יֹאכַ֤ל צֹאנְ/ךָ֙ וּ/בְקָרֶ֔/ךָ יֹאכַ֥ל גַּפְנְ/ךָ֖ וּ/תְאֵנָתֶ֑/ךָ יְרֹשֵׁ֞שׁ עָרֵ֣י מִבְצָרֶ֗י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בָּ/הֵ֖נָּה בֶּ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: pt
  text: Ele devorará a sua colheita e o seu pão[a]; eles devorarão os seus filhos e as suas filhas; ele devorará o seu rebanho e o seu gado; ele devorará a sua videira e a sua figueira; destruirá à espada as suas cidades fortificadas, nas quais você confia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comerá”; o mesmo verbo hebraico, em formas no singular e no plural, repete-se nas quatro primeiras orações.
    reason: lexical_alternative
  - marker: b
    text: O hebraico alterna verbos no singular e no plural ao falar do invasor, provavelmente apresentando a nação atacante tanto como um todo coletivo quanto como suas forças individuais.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: devorará / devorarão
  rationale: O verbo אָכַל significa literalmente “comer”, mas aqui descreve a devastação causada pelo invasor sobre colheitas, pessoas, animais e plantações. “Devorar” conserva a repetição e funciona naturalmente com todos esses objetos no contexto de juízo.
- source_word: קְצִירְךָ
  choice: a sua colheita
  rationale: קָצִיר designa a colheita ou o produto colhido; “colheita” preserva o sentido agrícola concreto.
- source_word: לַחְמֶךָ
  choice: o seu pão
  rationale: לֶחֶם significa literalmente “pão” e pode representar alimento em geral. O termo concreto foi mantido.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: os seus filhos e as suas filhas
  rationale: O hebraico menciona explicitamente ambos os grupos, por isso a tradução não os reduz ao termo genérico “filhos” ou “crianças”.
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: os seus rebanhos e o seu gado
  rationale: צֹאן indica coletivamente animais de pequeno porte, sobretudo ovelhas e cabras, enquanto בָּקָר se refere ao gado bovino. A formulação mantém a distinção sem especificar espécies além do texto.
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: a sua videira e a sua figueira
  rationale: Os substantivos singulares representam bens agrícolas concretos; a tradução preserva essa forma e a conhecida associação agrária.
- source_word: יְרֹשֵׁשׁ
  choice: destruirá
  rationale: O verbo raro comunica a ideia de arruinar, despojar ou reduzir à devastação. “Destruirá” é claro e adequado ao objeto “cidades fortificadas”, embora “devastará” também seja possível.
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: as suas cidades fortificadas
  rationale: A expressão designa cidades protegidas por fortificações; esta é a formulação moderna mais direta.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: nas quais você confia
  rationale: בָּטַח expressa confiar ou apoiar-se em algo. A tradução deixa claro que as cidades fortificadas eram objeto da confiança equivocada do destinatário.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: A expressão indica o instrumento ou meio da destruição militar. “À espada” é uma formulação bíblica digna e ainda compreensível em português moderno.
theological_decisions:
- issue: Alternância entre verbos no singular e no plural para o invasor ou os invasores
  choice: Preservar a alternância como “ele devorará / eles devorarão / ele devorará”, deixando implícito o sujeito singular após a primeira ocorrência.
  alternative: Uniformizar toda a sequência no plural (“eles devorarão”), entendendo a nação invasora coletivamente e suas tropas individualmente.
  rationale: O hebraico alterna deliberadamente entre formas singulares e plurais. Preservar essa oscilação mantém a ambiguidade entre a nação inimiga como unidade coletiva e seus integrantes, sem resolver silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “você” porque o hebraico se dirige a um destinatário singular. A repetição de “devorar” e a alternância singular/plural foram mantidas por serem características relevantes do texto-fonte.
