lexical_decisions:
- source_word: חַי יְהֹוָה
  choice: Tão certo como o SENHOR vive
  rationale: Reproduz a fórmula hebraica de juramento em português natural, mantendo o nome divino conforme a convenção editorial indicada.
- source_word: לָכֵן
  choice: mesmo assim
  rationale: 'Neste contexto, tem força concessiva/adversativa: apesar de invocarem o SENHOR, o juramento continua sendo falso.'
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: juram falsamente
  rationale: Expressa de modo direto o sentido do hebraico, que caracteriza o juramento como falso ou enganoso.
theological_decisions:
- issue: Invocação do nome divino em juramento falso
  choice: Preservar o contraste entre a fórmula ortodoxa e a falsidade do juramento
  alternative: Explicitar que se trata de hipocrisia religiosa
  rationale: O texto afirma a falsidade dos juramentos, mas não acrescenta aqui uma classificação teológica explícita como “hipocrisia”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula “Tão certo como... vive” comunica naturalmente o caráter solene do juramento; “SENHOR” segue a tradição de representar o Tetragrama em versaletes.
