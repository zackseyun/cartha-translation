  text: הַֽ/עַל אֵ֥לֶּה לוֹא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה וְ/אִם֙ בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: pt
  text: “Não hei de castigar por causa destas coisas?” —declara Yahweh. “E não se vingará a minha alma de uma nação como esta?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“A minha alma” é uma forma hebraica vívida de Yahweh referir-se a si mesmo. O sentido também pode ser expresso: “não me vingarei de uma nação como esta?”'
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: Não hei de castigá-los por causa dessas coisas?
  rationale: A construção interrogativa introduz uma pergunta retórica, e פקד, neste contexto de juízo, significa punir ou pedir contas. O objeto implícito foi expresso por “-los” para produzir português natural, enquanto “por causa dessas coisas” retoma as transgressões anteriores.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e translitera o nome divino יהוה segundo a convenção do projeto.
- source_word: וְאִם
  choice: E
  rationale: Aqui a expressão introduz uma segunda pergunta retórica paralela, não uma condição real. “E” preserva a progressão com naturalidade; a tradução mais literal “e se” seria pouco clara em português.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: de uma nação como esta
  rationale: Com o verbo נקם, a preposição ב marca aquele de quem se toma vingança. Em português, “vingar-se de” é a regência natural, e “como esta” conserva a comparação acusatória.
- source_word: לֹא תִתְנַקֵּם נַפְשִׁי
  choice: não se vingará a minha alma?
  rationale: O hitpael de נקם tem sentido reflexivo, “vingar-se”, e נַפְשִׁי é mantido literalmente como “a minha alma”, preservando a imagem hebraica vívida e sua tensão.
theological_decisions:
- issue: Autorreferência divina antropopática em נַפְשִׁי
  choice: manter “a minha alma” no texto principal
  alternative: “não me vingarei?” ou “eu mesmo não me vingarei?”
  rationale: O hebraico atribui a Yahweh a expressão pessoal e vívida “minha alma”. Mantê-la evita apagar a imagem ou resolver silenciosamente sua tensão teológica; uma nota esclarece seu valor idiomático.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal no texto e segue a convenção declarada do projeto.
- issue: Força de וְאִם na segunda oração
  choice: 'tratá-lo como introdutor de uma segunda pergunta retórica: “E”'
  alternative: “E se”
  rationale: O paralelismo mostra que não se trata de condição aberta, mas de uma pergunta retórica reforçadora. A escolha preserva essa função sem criar uma construção truncada em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas retóricas e o paralelismo judicial foram preservados; “castigá-los” torna explícito o objeto implícito pelo contexto. A formulação incomum “a minha alma” foi mantida deliberadamente e esclarecida em nota.
