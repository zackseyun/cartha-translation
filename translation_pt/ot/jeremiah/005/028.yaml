  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: pt
  text: Engordaram; estão lustrosos. Também foram além em suas maldades.[a] Não julgam a causa do órfão com justiça, para que prosperem;[b] nem julgam a causa dos necessitados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “também foram além de palavras de mal”. “Palavras” também pode significar “assuntos” ou “práticas”; a expressão pode indicar que ultrapassaram os limites no mal.
    reason: lexical_alternative
  - marker: b
    text: 'A relação desta expressão com a frase anterior é difícil. Também pode ser traduzida: “contudo prosperam” ou “embora prosperem”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְנוּ
  choice: Engordaram
  rationale: Preserva a imagem concreta do hebraico e sua crítica profética à prosperidade indulgente.
- source_word: עָשְׁתוּ
  choice: estão lustrosos
  rationale: O verbo raro, associado a 'engordaram', descreve uma aparência viçosa e bem nutrida; 'lustrosos' mantém a imagem sem reduzi-la apenas a riqueza.
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: Foram além de toda maldade
  rationale: עבר comunica a ultrapassagem de limites, enquanto דִבְרֵי רָע pode designar palavras, assuntos, atos ou práticas más. A formulação portuguesa transmite o provável sentido idiomático; a literalidade e as alternativas ficam registradas em nota.
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: Não julgam com justiça a causa do órfão
  rationale: A construção cognata enfatiza o julgamento jurídico. 'Causa' preserva a dimensão forense, e 'órfão' é a forma portuguesa natural para a criança privada do pai.
- source_word: וְיַצְלִיחוּ
  choice: para que prosperem
  rationale: Mantém a sequência e a possível nuance de finalidade ou resultado do hebraico, sem esconder em nota a dificuldade sintática e as leituras alternativas.
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: não defendem o direito dos necessitados
  rationale: Comunica tanto a dimensão jurídica de מִשְׁפָּט quanto a obrigação ética de fazer valer o direito das pessoas vulneráveis.
theological_decisions:
- issue: Sentido de יָתוֹם
  choice: órfão
  alternative: criança sem pai
  rationale: O termo hebraico designa especificamente quem foi privado do pai. 'Órfão' é natural em português e adequado ao contexto jurídico-profético, embora possa ser entendido de modo mais amplo no uso moderno.
- issue: Relação sintática de וְיַצְלִיחוּ
  choice: 'final/resultativa: ''para que prosperem'''
  alternative: '''contudo prosperam'' ou ''embora prosperem'''
  rationale: A sintaxe é comprimida e admite mais de uma relação com a oração precedente. A tradução principal segue de perto a sequência hebraica, e a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém as imagens proféticas e o campo jurídico do original, recorrendo a notas apenas onde a ambiguidade hebraica é relevante.
