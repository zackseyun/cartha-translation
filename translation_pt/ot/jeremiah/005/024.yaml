  text: וְ/לֹֽא אָמְר֣וּ בִ/לְבָבָ֗/ם נִ֤ירָא נָא֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ הַ/נֹּתֵ֗ן גֶּ֛שֶׁם ו/ירה וּ/מַלְק֖וֹשׁ בְּ/עִתּ֑/וֹ שְׁבֻע֛וֹת חֻקּ֥וֹת קָצִ֖יר יִשְׁמָר לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: pt
  text: 'Não disseram em seu coração: “Temamos agora Yahweh, nosso Deus, que dá a chuva no tempo certo, tanto a chuva do outono como a chuva da primavera,[a] e que guarda para nós as semanas determinadas para a colheita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a chuva temporã e a chuva serôdia”.'
    reason: Preserva a tradução lexical tradicional do par יוֹרֶה וּמַלְקוֹשׁ, enquanto o texto principal explicita as estações correspondentes.
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: Não disseram
  rationale: O qatal negado apresenta diretamente a acusação. A conjunção inicial pode ser omitida em português sem perda de sentido, conforme o fluxo do versículo.
- source_word: בִלְבָבָם
  choice: em seu coração
  rationale: Mantém a imagem hebraica do coração como sede da reflexão e da disposição interior. O singular hebraico tem valor coletivo ou distributivo após o sujeito plural.
- source_word: נִירָא נָא
  choice: Temamos agora
  rationale: O coortativo plural expressa exortação, e נָא comunica aqui urgência, traduzida naturalmente por “agora”.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: a Yahweh, nosso Deus
  rationale: Reproduz o nome divino pessoal יהוה e conserva diretamente a expressão pactual “nosso Deus”.
- source_word: הַנֹּתֵן גֶּשֶׁם
  choice: que dá a chuva
  rationale: O particípio descreve a ação contínua de Yahweh; a oração relativa é natural em português.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: tanto a chuva do outono como a chuva da primavera
  rationale: Os termos designam, no ciclo agrícola da região, a chuva inicial do outono e a chuva posterior da primavera. A formulação é clara para leitores modernos, enquanto a nota conserva a alternativa lexical tradicional.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: Expressa o momento apropriado ou determinado das chuvas e soa natural em português.
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: as semanas determinadas para a colheita
  rationale: A sequência indica os períodos fixados ou estabelecidos para a colheita; “para a colheita” explicita naturalmente essa relação em português.
- source_word: יִשְׁמָר לָנוּ
  choice: guarda para nós
  rationale: שמר comunica a ideia de conservar ou assegurar esses períodos em benefício do povo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a expressão hebraica “em seu coração” e a exortação coletiva “Temamos agora”. A pontuação posiciona corretamente a nota junto ao par de chuvas sazonais.
