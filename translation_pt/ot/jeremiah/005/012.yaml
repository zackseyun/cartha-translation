  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: pt
  text: 'Eles negaram Yahweh e disseram: “Ele não é[a], e nenhuma calamidade virá sobre nós; não veremos espada nem fome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não fará nada”, “Não é ele” ou “Ele não existe”. O hebraico é breve e elíptico.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ בַּיהוָה
  choice: negaram Yahweh
  rationale: Com a preposição ב, o verbo כחשׁ pode indicar negar ou agir falsamente para com alguém. Aqui, a fala seguinte repudia a realidade ou atuação de Yahweh, por isso “negaram” comunica melhor o sentido contextual.
- source_word: לֹא הוּא
  choice: Ele não está presente
  rationale: A expressão hebraica é breve e elíptica. Esta formulação conserva o sujeito pessoal e exprime a negação prática da presença ou atuação de Yahweh, sem limitar a frase a uma única interpretação; a ambiguidade é registrada em nota.
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto de juízo profético, רָעָה designa dano, calamidade ou desastre, não maldade moral. “Desgraça” é natural em português e preserva o caráter abrangente da ameaça.
- source_word: חֶרֶב
  choice: espada
  rationale: A tradução concreta mantém a imagem hebraica tradicional de violência e guerra.
- source_word: רָעָב
  choice: fome
  rationale: Neste contexto, o termo se refere à fome coletiva ou escassez associada ao juízo; “fome” é a forma corrente e natural em português.
- source_word: לֹא נִרְאֶה
  choice: não veremos
  rationale: A forma verbal na primeira pessoa do plural, de ראה, admite tradução direta por “não veremos”, conservando o idioma hebraico de ver no sentido de experimentar.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Interpretação da frase elíptica לֹא הוּא
  choice: Ele não está presente
  alternative: Ele não fará nada; Não é ele; Ele não existe
  rationale: A frase pode negar a existência, a presença ou a atuação efetiva de Yahweh. O texto principal conserva a negação pessoal em linguagem portuguesa compreensível, e a nota mantém abertas as principais possibilidades sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação e as imagens concretas do hebraico foram preservadas, e a expressão elíptica recebeu uma tradução clara acompanhada de nota.
