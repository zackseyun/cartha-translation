base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: pt
  text: As suas iniquidades afastaram estas coisas[a], e os seus pecados retiveram de vocês o bem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essas coisas”. O referente são as dádivas mencionadas no contexto anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as coisas boas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: as suas iniquidades
  rationale: Preserva o peso moral de עָוֹן e o distingue de חַטֹּאותֵיכֶם na oração seguinte.
- source_word: הִטּוּ
  choice: desviaram
  rationale: O hifil de נטה expressa aqui fazer algo desviar-se ou afastar-se; “desviaram” é conciso e natural em português.
- source_word: אֵלֶּה
  choice: essas coisas
  rationale: Mantém o demonstrativo anafórico e remete ao que foi mencionado no contexto anterior sem explicitar indevidamente o referente.
- source_word: וְחַטֹּאותֵיכֶם
  choice: e os seus pecados
  rationale: “Pecados” é a equivalência corrente e clara para חַטָּאת, mantendo a distinção lexical em relação a “iniquidades”.
- source_word: מָנְעוּ
  choice: impediram
  rationale: מנע denota reter ou impedir. Com a construção portuguesa escolhida, “impediram que ... chegasse” comunica de modo natural a privação causada pelos pecados.
- source_word: הַטּוֹב
  choice: o bem
  rationale: Conserva o singular substantivado do hebraico e sua amplitude, que pode abranger benefícios, bênçãos e bem-estar.
- source_word: מִכֶּם
  choice: que ... chegasse até vocês
  rationale: Expressa idiomaticamente a separação ou privação marcada por מן, sem sugerir que o bem já estivesse em posse deles.
theological_decisions:
- issue: Referente de אֵלֶּה (“essas coisas”)
  choice: Manter o demonstrativo sem identificar o referente no texto principal.
  alternative: Traduzir interpretativamente como “essas bênçãos” ou “as chuvas”.
  rationale: O hebraico deixa o referente implícito, embora o contexto anterior aponte para as dádivas mencionadas, especialmente as chuvas. A tradução preserva essa abertura.
- issue: Amplitude de הַטּוֹב
  choice: Traduzir como “o bem”.
  alternative: Traduzir como “as coisas boas”, “os benefícios” ou “a prosperidade”.
  rationale: “O bem” preserva a forma abrangente do hebraico e evita restringi-la exclusivamente à prosperidade material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “seus/suas” acompanha o paralelismo hebraico; “vocês” representa o plural dirigido ao povo.
