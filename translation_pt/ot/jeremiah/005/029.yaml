  text: הַֽ/עַל אֵ֥לֶּה לֹֽא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: pt
  text: “Não pedirei contas por causa dessas coisas[a]?”, declara Yahweh. “Não se vingará a minha alma[b] de uma nação como esta?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não castigarei por causa dessas coisas?” O verbo hebraico pode indicar uma intervenção judicial para pedir contas ou punir.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “minha alma”. A expressão hebraica ressalta a determinação pessoal de Yahweh; de modo mais idiomático: “Não me vingarei...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: Não pedirei contas por causa dessas coisas?
  rationale: A construção introduz uma pergunta retórica. Em contexto judicial, פקד comunica intervenção para responsabilizar ou punir; “pedir contas” preserva essa força sem recorrer ao sentido literal e pouco claro de “visitar”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida com solenidade natural, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אִם ... לֹא
  choice: Não ...?
  rationale: Aqui אִם participa de uma formulação enfática, de caráter retórico, e não introduz uma condição simples.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: de uma nação como esta
  rationale: Com o verbo נקם, a preposição assinala aquele contra quem se exerce a vingança; “uma nação como esta” reproduz naturalmente a qualificação enfática.
- source_word: לֹא תִתְנַקֵּם נַפְשִׁי
  choice: Não se vingará a minha alma
  rationale: A tradução conserva tanto a forma reflexiva/média de נקם quanto a expressão hebraica נַפְשִׁי, preservando sua intensidade pessoal e sua marcante imagem, esclarecida em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Atribuição pessoal da vingança divina
  choice: Não se vingará a minha alma
  alternative: Não me vingarei
  rationale: A formulação mantém a linguagem antropomórfica e enfática do hebraico sem diluir a participação pessoal de Yahweh; a alternativa idiomática é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A primeira pergunta usa uma expressão judicial corrente; a segunda conserva deliberadamente a imagem hebraica mais incomum, acompanhada de nota explicativa.
