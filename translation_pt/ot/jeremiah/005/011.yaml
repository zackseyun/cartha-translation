reference: Jeremiah 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ בָג֨וֹד בָּגְד֜וּ בִּ֗/י בֵּ֧ית יִשְׂרָאֵ֛ל וּ/בֵ֥ית יְהוּדָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: pt
  text: Pois a casa de Israel e a casa de Judá foram totalmente infiéis a mim[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiram de modo extremamente traiçoeiro contra mim” ou “me traíram por completo”. O hebraico combina um infinitivo absoluto com o verbo conjugado para dar ênfase.'
    reason: Registra alternativas lexicais legítimas e explica a construção hebraica enfática.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da acusação ou do juízo precedente, preservando de modo natural a força explicativa da conjunção.
- source_word: בָגֹוד בָּגְדוּ
  choice: foram totalmente infiéis
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ideia de agir com deslealdade ou traição. A formulação escolhida comunica em português corrente tanto a ruptura relacional quanto a ênfase hebraica.
- source_word: בִּי
  choice: a mim
  rationale: Com o verbo בגד, indica a pessoa contra quem ou para com quem se comete a infidelidade; esta construção é natural com o adjetivo português «infiéis».
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico, sem reduzi-la simplesmente ao nome «Israel».
- source_word: וּבֵית יְהוּדָה
  choice: e a casa de Judá
  rationale: Preserva o paralelismo hebraico e a distinção entre as duas comunidades.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene em linguagem portuguesa clara e mantém o nome divino pessoal.
theological_decisions:
- issue: Sentido pactual de בגד
  choice: infiéis
  alternative: agiram traiçoeiramente; traíram
  rationale: «Infiéis» preserva a deslealdade pessoal e pactual sem especificar além do que o texto afirma; a nota registra traduções possíveis com maior ênfase em traição.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Casa de Israel» e «casa de Judá» preservam o paralelismo coletivo do original; o travessão destaca naturalmente a fórmula profética final.
