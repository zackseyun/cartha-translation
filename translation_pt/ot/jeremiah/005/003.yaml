source:
  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: pt
  text: Ó SENHOR, não estão os teus olhos voltados para a fidelidade? Tu os feriste, mas eles não sentiram dor[a]; tu os consumiste, mas eles se recusaram a aceitar a correção. Tornaram o rosto mais duro que a rocha; recusaram-se a voltar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não enfraqueceram”, “não adoeceram” ou “não se afligiram”.
    reason: lexical_alternative
  - marker: b
    text: Ou “recusaram-se a arrepender-se”. O hebraico diz literalmente “voltar”, expressão profética comum para o retorno a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Ó SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o nome divino, em versalete, e conserva a invocação direta por meio de “Ó”.
- source_word: עֵינֶיךָ
  choice: os teus olhos
  rationale: Mantém a imagem antropomórfica concreta do hebraico, em vez de a converter na ideia abstrata de observar ou procurar.
- source_word: הֲלוֹא לֶאֱמוּנָה
  choice: não estão os teus olhos voltados para a fidelidade?
  rationale: אֱמוּנָה pode indicar firmeza, fidelidade ou confiabilidade; “fidelidade” se ajusta ao contexto moral, e “voltados para” expressa naturalmente a direção do olhar divino.
- source_word: הִכִּיתָה אֹתָם
  choice: Tu os feriste
  rationale: Comunica o golpe do juízo divino em português natural, sem o tom arcaico de “ferir com castigo” ou “golpear”.
- source_word: וְלֹא חָלוּ
  choice: mas eles não sentiram dor
  rationale: O verbo חלה pode envolver fraqueza, enfermidade ou dor; após o ato de ferir, esta formulação é clara e contextualmente adequada, sem ocultar alternativas lexicais.
- source_word: כִּלִּיתָם
  choice: tu os consumiste
  rationale: Preserva a força de כלה no Piel, que pode significar consumir, acabar ou levar ao fim, sem necessariamente fixar o sentido como aniquilação total.
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: eles se recusaram a aceitar a correção
  rationale: מוּסָר reúne as ideias de disciplina, correção e instrução; “aceitar a correção” é corrente e ressalta a finalidade formativa do castigo no contexto.
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: Tornaram o rosto mais duro que a rocha
  rationale: Reproduz a imagem hebraica de obstinação e resistência, conservando a comparação explícita com a rocha.
- source_word: מֵאֲנוּ לָשׁוּב
  choice: recusaram-se a voltar
  rationale: Mantém o sentido concreto de שׁוּב, “voltar”, que no discurso profético também implica arrependimento e retorno a Deus.
theological_decisions:
- issue: Sentido moral e religioso de שׁוּב no discurso profético
  choice: voltar
  alternative: arrepender-se
  rationale: “Voltar” preserva a metáfora pactual de retornar ao SENHOR e a polissemia do verbo hebraico; a leitura explícita como arrependimento é indicada em nota, sem substituir a imagem original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o paralelismo, as imagens concretas e a progressão retórica do hebraico. O tratamento por “tu” acompanha a invocação bíblica solene sem recorrer a construções excessivamente arcaicas.
