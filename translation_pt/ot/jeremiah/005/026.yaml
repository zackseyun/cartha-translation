  text: For wicked men are found among my people[a]; they lie in wait like fowlers. They set a trap[b]; they catch men.
translation:
  language: pt
  text: Pois entre o meu povo há homens perversos; eles ficam à espreita, como caçadores de aves.[a] Armam uma armadilha[b] e capturam homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como caçadores de aves agachados» ou «como o agachar-se de caçadores de aves». A expressão hebraica é difícil, mas retrata caçadores ocultos à espera de apanhar a presa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «uma cilada» ou «algo destrutivo». O substantivo hebraico indica algo que causa destruição; neste contexto, refere-se a um dispositivo usado para capturar pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da acusação anterior e preserva de modo natural a força causal ou explicativa.
- source_word: נִמְצְאוּ בְעַמִּי
  choice: entre o meu povo há
  rationale: Expressa em português corrente a presença de tais pessoas dentro da comunidade, sem a rigidez de uma passiva literal.
- source_word: רְשָׁעִים
  choice: homens perversos
  rationale: O plural masculino designa pessoas moralmente culpadas; «perversos» é claro, forte e adequado ao registro profético.
- source_word: יָשׁוּר כְּשַׁךְ יְקוּשִׁים
  choice: eles ficam à espreita, como passarinheiros escondidos
  rationale: Preserva a imagem de caçadores de aves aguardando ocultos, sem impor como certa uma postura física específica em uma frase hebraica difícil.
- source_word: הִצִּיבוּ מַשְׁחִית
  choice: Armam uma armadilha destrutiva
  rationale: «Armam» é idiomático no contexto de captura; «armadilha destrutiva» mantém tanto a função contextual quanto o sentido nocivo do substantivo.
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: capturam homens
  rationale: Mantém o substantivo masculino do hebraico e o sentido de apanhar ou capturar dentro da metáfora de caça.
