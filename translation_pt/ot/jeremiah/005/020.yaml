lexical_decisions:
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: O imperativo plural de נגד exige uma comunicação pública. “Anunciem” conserva essa força sem soar excessivamente solene ou antiquado.
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo feminino singular aponta para a mensagem apresentada a seguir.
- source_word: בְּבֵית יַעֲקֹב
  choice: na casa de Jacó
  rationale: Mantém a expressão coletiva e pactual “casa de Jacó”, designando os descendentes de Jacó/Israel, e traduz naturalmente a preposição ב.
- source_word: וְהַשְׁמִיעוּהָ
  choice: e proclamem-no
  rationale: O hifil imperativo de שמע com sufixo de terceira pessoa feminina singular significa fazer a mensagem ser ouvida. “Proclamem-no” expressa de modo idiomático a divulgação pública e representa o objeto pronominal.
- source_word: בִיהוּדָה
  choice: em Judá
  rationale: A preposição ב indica mais naturalmente o âmbito em que a proclamação deve ocorrer.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Fórmula introdutória de citação que apresenta o conteúdo da proclamação no versículo seguinte.
