  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
translation:
  language: pt
  text: 'Anunciem isto na casa de Jacó e proclamem isto em Judá[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam isto ser ouvido em Judá”. O verbo hebraico significa literalmente “fazer ouvir”.'
