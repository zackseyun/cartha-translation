base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/024.yaml
  text: I looked at the mountains[a], and behold, they were quaking, and all the hills were shaken.
translation:
  language: pt
  text: Olhei para os montes, e eis que tremiam; todas as colinas cambaleavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vi os montes, e eis que se sacudiam; todas as colinas oscilavam.”'
    reason: Alternativas lexicais para רָאִיתִי, רֹעֲשִׁים e הִתְקַלְקָלוּ, preservando a possível nuance de visão direta, abalo sísmico e oscilação.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Olhei
  rationale: O qal perfeito na primeira pessoa introduz uma nova observação na sequência visionária; “Olhei” comunica naturalmente o ato de dirigir a atenção, embora “Vi” também seja possível.
- source_word: הֶהָרִים
  choice: os montes
  rationale: הָרִים designa elevações maiores e contrasta com גְּבָעוֹת; “montes” preserva essa distinção em português bíblico corrente.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função de הִנֵּה como marcador que chama a atenção para uma visão súbita, com tom profético digno e compreensível.
- source_word: רֹעֲשִׁים
  choice: tremiam
  rationale: O particípio de רעשׁ descreve movimento sísmico ou forte agitação; “tremiam” é claro, natural e vívido em português.
- source_word: וְכָל הַגְּבָעוֹת
  choice: todas as colinas
  rationale: כָּל tem sentido coletivo, e גְּבָעוֹת designa elevações menores; “todas as colinas” conserva o paralelismo e o contraste topográfico.
- source_word: הִתְקַלְקָלוּ
  choice: cambaleavam
  rationale: O hitpael expressa movimento instável ou violenta perturbação. “Cambaleavam” distingue o segundo verbo de “tremiam” e preserva a imagem de perda de estabilidade, sem impor uma passiva que a forma hebraica não exige.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis que” preserva a vividez profética; “montes” e “colinas” mantêm a distinção poética. O ponto e vírgula reproduz o paralelismo sem sobrecarregar a frase.
