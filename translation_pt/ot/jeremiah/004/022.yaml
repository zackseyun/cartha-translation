id: JER.4.22
reference: Jeremiah 4:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: pt
  text: Pois o meu povo é insensato; não me conhece. São filhos tolos[a] e não têm entendimento. São sábios para fazer o mal, mas não sabem fazer o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “filhos”; aqui, a palavra se refere coletivamente ao povo.
    reason: Esclarece que o masculino plural hebraico tem referência coletiva, sem limitar a afirmação aos homens.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da visão de juízo precedente e expressa de modo natural a força causal ou explicativa do hebraico.
- source_word: אֱוִיל עַמִּי
  choice: o meu povo é insensato
  rationale: “Insensato” comunica uma insensatez moral e espiritual, não simples falta de inteligência; o possessivo preserva a força relacional e a tragédia da declaração.
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: não me conhece
  rationale: O verbo יָדַע, tendo Deus como objeto, abrange conhecimento relacional e reconhecimento da aliança. O presente expressa o estado contínuo do povo sem explicitar em excesso essa nuance.
- source_word: בָּנִים סְכָלִים
  choice: filhos sem juízo
  rationale: Mantém o substantivo concreto “filhos” e comunica com naturalidade a falta de discernimento indicada por סְכָלִים, sem recorrer a um insulto excessivamente coloquial.
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: e não têm entendimento
  rationale: Expressa de forma idiomática a ausência de discernimento e prepara o contraste irônico com a sabedoria voltada para o mal.
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: São sábios para fazer o mal
  rationale: 'Preserva a ironia do hebraico: possuem habilidade prática, mas a aplicam ao mal.'
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: mas não sabem fazer o bem
  rationale: O infinitivo com יָדַע indica capacidade prática; a formulação portuguesa comunica claramente que não sabem agir bem.
theological_decisions:
- issue: Natureza de “conhecer” Deus
  choice: Conhecimento relacional e ligado à aliança, mantido no texto pela expressão simples “não me conhece”.
  alternative: Mera consciência intelectual da existência de Deus.
  rationale: Nos profetas, conhecer Deus envolve reconhecimento relacional e moral. A tradução preserva o verbo simples para não eliminar sua amplitude semântica.
- issue: Sentido coletivo de בָּנִים
  choice: “filhos”, entendido coletivamente como referência ao povo.
  alternative: “crianças” ou uma formulação sem marca de gênero.
  rationale: O hebraico emprega o plural masculino “filhos”, mas o referente é o povo em conjunto, não apenas os homens. A nota explicita essa função coletiva sem apagar a imagem familiar do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Insensato” e “sem juízo” evitam tanto a linguagem excessivamente técnica quanto um tom coloquial ofensivo; o paralelismo e a ironia do hebraico foram preservados.
