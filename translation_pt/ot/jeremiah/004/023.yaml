id: JER.4.23
reference: Jeremiah 4:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּה תֹ֖הוּ וָ/בֹ֑הוּ וְ/אֶל הַ/שָּׁמַ֖יִם וְ/אֵ֥ין אוֹרָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/023.yaml
  text: I looked at the earth[a], and behold, it was formless and empty; and at the heavens, and they had no light.
translation:
  language: pt
  text: Olhei para a terra, e eis que estava sem forma e vazia[a]; para os céus, e não havia luz neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico tohu vabohu, também traduzido tradicionalmente como “desolada e vazia” ou “sem forma e sem conteúdo”; a expressão ecoa Gênesis 1:2.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Olhei
  rationale: O qal perfeito na primeira pessoa singular introduz a visão profética. “Olhei” conserva o caráter intencional e vívido da observação e rege também, por elipse, “para os céus”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “a terra de uma região” ou “o país”, o paralelo com “os céus” e a evocação de Gênesis 1:2 favorecem aqui o sentido cósmico.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a força de apresentação imediata de הִנֵּה e mantém o registro elevado da visão profética sem ser obscuro.
- source_word: תֹהוּ וָבֹהוּ
  choice: sem forma e vazia
  rationale: Expressão clara e tradicional em português que preserva a forte correspondência verbal com Gênesis 1:2 e a imagem de desolação, sem eliminar sua ressonância de reversão da criação.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: O plural português corresponde ao uso bíblico de שָׁמַיִם e, no paralelo cósmico com “a terra”, é preferível ao sentido mais restrito de “céu” como atmosfera visível.
- source_word: וְאֵין אוֹרָם
  choice: e não havia luz neles
  rationale: Explicita naturalmente em português a referência do sufixo plural de אוֹרָם aos céus, sem determinar se a luz foi retirada ou se simplesmente estava ausente.
theological_decisions:
- issue: Eco de Gênesis 1:2 em um anúncio de juízo
  choice: 'Preservar as imagens cósmicas de descriação: “a terra ... sem forma e vazia” e os céus sem luz.'
  alternative: Interpretar de modo mais localizado, como descrição apenas da devastação da terra de Judá.
  rationale: A expressão תֹהוּ וָבֹהוּ e o par terra–céus evocam fortemente Gênesis 1:2 e apresentam o juízo como reversão da ordem criada. A tradução mantém essa dimensão sem negar a referência histórica do oráculo a Judá.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A construção elíptica “para os céus” acompanha a concisão do hebraico; “e eis que” conserva a vivacidade solene da visão profética.
