base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/021.yaml
  text: How long must I see the signal flag and hear the sound of the trumpet?[a][b]
translation:
  language: pt
  text: Até quando terei de ver a bandeira de sinalização[a] e ouvir o toque da trombeta?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estandarte», «bandeira» ou simplesmente «sinal». O termo hebraico נֵס designa um sinal elevado, muitas vezes usado para fins militares.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico שׁוֹפָר refere-se a um instrumento de sopro feito de chifre, muitas vezes de carneiro, usado para dar alarme ou convocar o povo.
    reason: cultural_note
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressão interrogativa idiomática que preserva o tom de lamento e a ideia de uma situação prolongada.
- source_word: אֶרְאֶה
  choice: terei de ver
  rationale: O imperfeito, neste contexto de lamento, descreve uma experiência contínua e penosa; a construção comunica essa carga sem transformá-la em simples futuro.
- source_word: נֵּס
  choice: bandeira de sinalização
  rationale: O substantivo indica um sinal elevado, frequentemente uma bandeira ou estandarte de função militar. A expressão torna clara para o leitor moderno tanto sua forma visível quanto sua função.
- source_word: אֶשְׁמְעָה
  choice: e ouvir
  rationale: A expressão compartilha naturalmente a força modal de «terei de» com o verbo anterior, evitando repetição desnecessária.
- source_word: קוֹל
  choice: o toque de
  rationale: Com שׁוֹפָר, refere-se ao som emitido pelo instrumento; «toque» é natural em português e adequado ao contexto de alarme.
- source_word: שׁוֹפָר
  choice: trombeta
  rationale: Equivalente corrente para o antigo instrumento de chifre usado para alarme ou convocação; uma nota esclarece sua natureza material e cultural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Bandeira de sinalização» explicita a função militar do sinal, enquanto «toque da trombeta» soa mais natural do que uma tradução literal de «voz/som da trombeta».
