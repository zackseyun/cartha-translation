id: JER.4.29
reference: Jeremiah 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: pt
  text: Ao som do cavaleiro e do arqueiro[a], todas as cidades fogem[b]; seus habitantes entram nos matagais[c] e sobem aos rochedos. Todas as cidades ficam abandonadas, e nelas não mora homem algum[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa do som do cavaleiro e do arqueiro”. A preposição hebraica pode indicar tanto a ocasião quanto a causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “toda cidade foge”, expressão que também pode ser entendida como “a cidade inteira foge”.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico é incerto. Alguns o entendem como “nuvens”, mas o contexto de esconderijos favorece o sentido de vegetação densa.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “não mora ninguém nelas”. O hebraico diz literalmente “não mora nelas homem algum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Ao som de
  rationale: A preposição מִן com קוֹל pode indicar ocasião ou causa. “Ao som de” preserva a vivacidade da reação imediata sem decidir além do necessário.
- source_word: פָּרָשׁ
  choice: cavaleiro
  rationale: O substantivo designa aqui um combatente montado; “cavaleiro” é claro, natural e mantém o singular coletivo do hebraico.
- source_word: וְרֹמֵה קֶשֶׁת
  choice: e do arqueiro
  rationale: A expressão participial significa literalmente “aquele que atira o arco”; “arqueiro” é o equivalente militar idiomático.
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: todas as cidades fogem
  rationale: כָּל com o singular עִיר pode ter sentido distributivo. A repetição da expressão e a referência pronominal plural posterior favorecem a ideia de cada cidade, expressa naturalmente em português pelo plural.
- source_word: בָּאוּ
  choice: entram
  rationale: O verbo pode significar “vir” ou “entrar”; no contexto, descreve os moradores refugiando-se em esconderijos.
- source_word: בֶּעָבִים
  choice: nos matagais
  rationale: Embora o termo seja incerto e possa ser relacionado a “nuvens”, o paralelismo com os rochedos e o contexto de fuga favorecem vegetação densa usada como esconderijo.
- source_word: וּבַכֵּפִים עָלוּ
  choice: e sobem aos rochedos
  rationale: כֵּפִים indica rochas ou penhascos, e עָלוּ expressa o movimento para cima em busca de refúgio.
- source_word: עֲזוּבָה
  choice: ficam abandonadas
  rationale: A forma transmite o estado resultante de abandono; a expressão é atual e adequada à evacuação causada pela guerra.
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: e nelas não mora homem algum
  rationale: A formulação conserva אִישׁ, “homem”, e comunica enfaticamente o despovoamento completo, sem apagar a expressão concreta do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “todas as cidades” torna natural o valor distributivo da construção hebraica e concorda com o pronome plural posterior. “Seus habitantes” explicita apenas o referente já exigido pelos verbos plurais “entraram/subiram” no hebraico, evitando a impressão de que as próprias cidades se deslocam.
