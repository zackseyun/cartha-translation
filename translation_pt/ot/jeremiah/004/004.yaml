  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: pt
  text: Circuncidem-se para Yahweh e removam os prepúcios do coração de vocês,[a] homens de Judá e habitantes de Jerusalém, para que a minha ira não irrompa como fogo e arda sem que ninguém possa apagá-la,[b] por causa da maldade de suas ações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “removam os prepúcios do coração de vocês”: imagem que chama à lealdade interior à aliança e ao arrependimento.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “para que o meu furor não irrompa como fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ לַיהוָה
  choice: Circuncidem-se para Yahweh
  rationale: O imperativo nifal plural de מול tem sentido reflexivo neste contexto. “Para Yahweh” conserva a ideia de orientação ou dedicação da ação ao Deus da aliança.
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: e removam os prepúcios do coração de vocês
  rationale: Mantém a imagem corporal concreta e forte do hebraico, sem substituí-la por uma interpretação como “purifiquem o coração”. Embora עָרְלוֹת seja plural, לְבַבְכֶם apresenta “coração” como singular coletivo com sufixo plural, construção bem representada em português por “o coração de vocês”.
- source_word: אִישׁ יְהוּדָה
  choice: homens de Judá
  rationale: אִישׁ funciona coletivamente ou distributivamente e mantém aqui uma forma masculina explícita.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: e habitantes de Jerusalém
  rationale: O particípio substantivado designa os residentes da cidade; “habitantes” é corrente e digno.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz a consequência negativa advertida. Essa construção é mais natural no português moderno do que “para que não aconteça que”, sem perder a força preventiva.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: a minha ira não irrompa como fogo
  rationale: חֵמָה designa ira ou furor, e יצא, aplicado ao fogo, admite naturalmente “irromper”, que preserva a ideia de sair ou romper para fora.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: e arda sem que ninguém possa apagá-la
  rationale: Conserva a imagem do fogo e expressa de modo idiomático a ausência de quem o apague. O pronome feminino retoma “ira”, figurada como fogo.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: por causa da maldade dos atos de vocês
  rationale: מִפְּנֵי tem valor causal; רֹעַ indica maldade, e מַעַלְלִים são atos ou feitos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Metáfora da circuncisão do coração
  choice: Manter literalmente “prepúcios do coração” no texto principal
  alternative: Purifiquem o coração; eliminem a dureza do coração
  rationale: A imagem aplica ao interior humano o sinal corporal da aliança. Preservá-la mantém sua força profética, sua tensão e suas conexões bíblicas.
- issue: Forma masculina de אִישׁ יְהוּדָה
  choice: homens de Judá
  alternative: povo de Judá; habitantes de Judá
  rationale: A expressão hebraica usa explicitamente אִישׁ. A tradução conserva essa forma em vez de neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora profética foi mantida concreta; “irrompa” torna idiomática a saída da ira como fogo, e “atos de vocês” evita tanto arcaísmo quanto coloquialismo excessivo.
