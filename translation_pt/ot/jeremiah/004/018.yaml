base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: pt
  text: Seu caminho e seus feitos trouxeram tudo isso sobre você. Isto é o seu mal[a] — como é amargo! Pois chegou até o seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isto é a sua calamidade” ou “Isto é a sua desgraça”. A palavra hebraica pode indicar tanto o mal moral quanto o desastre que dele resulta; o texto principal preserva a força acusatória do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: seu caminho
  rationale: Preserva a metáfora hebraica de caminho como modo de vida ou conduta, sem perder a naturalidade em português.
- source_word: וּמַעֲלָלַיִךְ
  choice: e seus feitos
  rationale: “Feitos” expressa ações com a coloração moral própria do contexto profético e forma um par natural com “caminho”.
- source_word: עָשׂוּ אֵלֶּה לָךְ
  choice: trouxeram tudo isso sobre você
  rationale: 'Reproduz de modo idiomático a relação de causa e consequência do hebraico: a própria conduta de Judá acarretou o juízo descrito.'
- source_word: זֹאת רָעָתֵךְ
  choice: Esse é o seu mal
  rationale: “Mal” conserva melhor a amplitude de רָעָה, que pode indicar tanto o mal moral quanto a calamidade resultante, sem resolver indevidamente a tensão do contexto.
- source_word: כִּי מָר
  choice: como é amargo!
  rationale: A formulação exclamativa comunica naturalmente a força enfática da oração hebraica, em vez de impor uma relação causal rígida ao primeiro כִּי.
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: Pois chegou até o seu coração
  rationale: “Chegou até” preserva a imagem de algo que alcança e penetra o íntimo, enquanto o perfeito “chegou” corresponde ao estado consumado expresso pelo verbo hebraico.
theological_decisions:
- issue: Sentido de רָעָה em זֹאת רָעָתֵךְ
  choice: “seu mal”, mantendo no texto a dimensão moral e a possível consequência desastrosa
  alternative: “sua calamidade” ou “sua desgraça”
  rationale: O versículo atribui a situação ao caminho e aos feitos de Judá. “Mal” mantém a acusação moral, mas também pode designar o sofrimento resultante; a nota registra explicitamente as leituras voltadas à calamidade.
- issue: Relação entre o mal praticado e o juízo sofrido
  choice: Preservar a sobreposição entre culpa e consequência
  alternative: Identificar רָעָה exclusivamente como pecado ou exclusivamente como desastre
  rationale: O hebraico permite que a amarga realidade que alcança o coração seja entendida como o mal de Judá em sua dimensão culpável e em seus efeitos. A tradução evita separar aquilo que o texto mantém em tensão.
translation_notes:
  register: Português atual, digno e de fácil compreensão, com boa legibilidade brasileira. O tratamento por “você” torna explícita a segunda pessoa singular feminina dirigida a Judá sem produzir uma forma artificial em português. A repetição de “seu” mantém a ênfase acusatória, e o travessão com a exclamação reproduz a intensidade poética do hebraico.
