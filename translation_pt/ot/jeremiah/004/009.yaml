id: JER.4.9
reference: Jeremiah 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: pt
  text: Naquele dia — declara Yahweh — o coração do rei e o coração dos oficiais perecerão[a]; os sacerdotes ficarão consternados, e os profetas ficarão atônitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a coragem do rei e dos oficiais desaparecerá”. Literalmente, “o coração do rei e o coração dos oficiais perecerão”.'
    reason: Registra o sentido contextual possível de «coração» como coragem ou firmeza, enquanto o texto preserva a imagem e o verbo do hebraico.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia acontecerá
  rationale: Expressa naturalmente em português a fórmula hebraica que introduz um acontecimento futuro e mantém o tom profético.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula solene de declaração profética e translitera diretamente o nome divino.
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: o coração do rei e o coração dos seus oficiais desfalecerão
  rationale: Mantém a imagem e a repetição de 'coração' do hebraico. 'Desfalecerão' comunica a perda da coragem ou firmeza interior sem exigir a leitura pouco natural de que o órgão literalmente perecerá.
- source_word: הַשָּׂרִים
  choice: oficiais
  rationale: Neste contexto governamental, designa autoridades ou altos funcionários sem necessariamente implicar nobreza hereditária.
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: os sacerdotes ficarão horrorizados
  rationale: O nifal de שמם exprime choque, horror ou consternação; esta formulação é clara e vigorosa em português atual.
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: e os profetas, atônitos
  rationale: תמה indica espanto ou perplexidade. A elipse de 'ficarão' evita repetição pesada sem alterar o sentido futuro.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' preserva o nome próprio e segue a convenção indicada pelo projeto.
- issue: Sentido de לֵב no colapso da liderança
  choice: manter 'coração' no texto e explicar a perda de coragem na nota
  alternative: traduzir diretamente como 'a coragem do rei e dos oficiais desaparecerá'
  rationale: O hebraico pode referir-se à coragem, resolução ou capacidade interior. Manter a metáfora evita resolver silenciosamente essa amplitude semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam a fórmula profética; a repetição de 'o coração' conserva o paralelismo hebraico. A pontuação evita uma sequência excessiva de conjunções sem apagar a estrutura do original.
