source:
  edition: WLC
  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: pt
  text: Lave o seu coração do mal, ó Jerusalém, para que você seja salva. Até quando pensamentos perversos se alojarão dentro de você?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבְּסִי
  choice: Lave
  rationale: Preserva a metáfora concreta de lavar, aplicada ao coração, sem acrescentar um resultado não expresso.
- source_word: מֵרָעָה
  choice: do mal
  rationale: Neste chamado ao arrependimento, רָעָה tem sentido moral; a preposição מִן indica afastamento ou remoção.
- source_word: לִבֵּךְ
  choice: o seu coração
  rationale: Mantém a imagem hebraica do coração como centro da vida interior, incluindo pensamento e vontade.
- source_word: יְרוּשָׁלִַם
  choice: ó Jerusalém
  rationale: O vocativo com “ó” torna clara e digna a personificação da cidade, tratada no feminino singular.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa naturalmente a finalidade indicada pela conjunção hebraica.
- source_word: תִּוָּשֵׁעִי
  choice: você seja salva
  rationale: O nifal de ישׁע permite tanto salvação quanto livramento; “seja salva” conserva essa amplitude e concorda com Jerusalém personificada.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Equivalente idiomático direto da fórmula temporal hebraica.
- source_word: תָּלִין
  choice: se alojarão
  rationale: Preserva a imagem de passar a noite ou permanecer como hóspede, sem reduzi-la ao simples ato de permanecer.
- source_word: בְּקִרְבֵּךְ
  choice: dentro de você
  rationale: Comunica de modo natural a localização interior, apropriada à Jerusalém personificada.
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  choice: pensamentos perversos
  rationale: מַחְשְׁבוֹת pode indicar pensamentos ou planos, e אוֹן lhes atribui caráter iníquo; “pensamentos perversos” é claro sem especificar demais se são ideias ou projetos.
theological_decisions:
- issue: Amplitude de תִּוָּשֵׁעִי no contexto profético
  choice: você seja salva
  alternative: você seja livrada
  rationale: A formulação mantém aberta tanto a ideia imediata de livramento do juízo quanto a ressonância mais ampla de salvação, sem impor uma distinção teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantêm-se a metáfora concreta de lavar o coração, a personificação feminina de Jerusalém e a imagem dos pensamentos que se hospedam no interior.
