base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: pt
  text: Por causa disso, a terra ficará de luto[a], e os céus acima escurecerão, porque eu falei, determinei[b] e não voltei atrás[c], nem voltarei atrás disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o país ficará de luto”. A palavra hebraica pode significar tanto “terra” como “país”; o paralelo com “os céus acima” favorece aqui “terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “planejei” ou “resolvi”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não mudei de ideia” ou “não cedi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Por causa disso
  rationale: Expressa de modo natural a relação causal entre o juízo anunciado e o luto cósmico.
- source_word: תֶּאֱבַל
  choice: ficará de luto
  rationale: Preserva a personificação e o sentido comum de אבל como entrar em luto ou lamentar.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar a terra ou o país; o paralelismo com os céus favorece aqui a dimensão cósmica.
- source_word: וְקָדְרוּ
  choice: escurecerão
  rationale: Traduz diretamente a ideia de os céus se tornarem escuros ou sombrios.
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: os céus lá no alto
  rationale: Mantém o registro elevado e torna idiomática em português a localização expressa por מִמָּעַל.
- source_word: עַל כִּי
  choice: porque
  rationale: Introduz claramente a razão do luto da terra e do escurecimento dos céus.
- source_word: דִבַּרְתִּי
  choice: eu falei
  rationale: Conserva a solenidade e a forma direta da declaração divina.
- source_word: זַמֹּתִי
  choice: determinei
  rationale: Comunica uma intenção deliberada e firme; 'planejei' e 'resolvi' também são possíveis.
- source_word: נִחַמְתִּי
  choice: não voltei atrás
  rationale: No contexto, נחם indica não recuar do juízo anunciado, sem sugerir arrependimento moral.
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: nem desistirei disso
  rationale: Expressa o afastamento de um curso determinado e evita repetir literalmente 'voltar atrás'; o sufixo feminino remete de modo geral à decisão ou ação anunciada.
theological_decisions:
- issue: Sentido de נחם aplicado a Deus
  choice: não voltei atrás
  alternative: não mudei de ideia / não desisti
  rationale: O contexto trata da firmeza de Deus em executar o juízo anunciado, não de arrependimento por culpa moral.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: o país / a terra de Judá
  rationale: Embora o juízo se concentre em Judá, o paralelismo com os céus mantém uma imagem de alcance cósmico.
- issue: Relação entre נִחַמְתִּי e אָשׁוּב
  choice: não voltei atrás, nem desistirei disso
  alternative: não mudei de ideia, nem voltarei atrás
  rationale: A tradução diferencia as duas expressões hebraicas sem eliminar sua forte proximidade semântica e preserva a ênfase cumulativa na irrevogabilidade do propósito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva a personificação poética, o paralelismo cósmico e a ênfase solene da fala divina.
