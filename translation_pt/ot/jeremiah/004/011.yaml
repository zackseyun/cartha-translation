  text: בָּ/עֵ֣ת הַ/הִ֗יא יֵאָמֵ֤ר לָֽ/עָם הַ/זֶּה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם ר֣וּחַ צַ֤ח שְׁפָיִים֙ בַּ/מִּדְבָּ֔ר דֶּ֖רֶךְ בַּת עַמִּ֑/י ל֥וֹא לִ/זְר֖וֹת וְ/ל֥וֹא לְ/הָבַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: pt
  text: 'Naquele tempo, será dito a este povo e a Jerusalém: “Um vento abrasador vem das alturas descampadas do deserto em direção à filha do meu povo — não para joeirar nem para limpar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ צַח
  choice: vento abrasador
  rationale: רוּחַ é 'vento'; צַח pode indicar algo límpido, seco ou ardente. No contexto de juízo e em contraste com o vento moderado usado para joeirar, 'abrasador' comunica naturalmente um vento seco e intenso sem reduzir a expressão a mero calor.
- source_word: שְׁפָיִים
  choice: alturas descampadas
  rationale: O termo designa elevações ou lugares altos expostos e sem vegetação; 'alturas descampadas' preserva tanto a topografia quanto a exposição ao vento.
- source_word: דֶּרֶךְ בַּת עַמִּי
  choice: em direção à filha do meu povo
  rationale: דֶּרֶךְ tem aqui valor direcional, 'na direção de/rumo a'. Mantém-se literalmente a metáfora coletiva e afetiva 'filha do meu povo'.
- source_word: לִזְרוֹת
  choice: joeirar
  rationale: Refere-se ao ato agrícola de lançar os grãos ao vento para separar a palha; 'joeirar' é o equivalente português preciso.
- source_word: לְהָבַר
  choice: limpar
  rationale: O infinitivo indica tornar limpo ou purificar o cereal após a separação. 'Limpar' conserva o sentido agrícola imediato sem introduzir uma interpretação ritual ou teológica.
theological_decisions:
- issue: Função do vento como imagem de juízo
  choice: não para joeirar nem para limpar
  alternative: não para peneirar nem para purificar
  rationale: A formulação preserva a negação enfática das duas funções agrícolas benéficas. O vento anunciado não representa refinamento moderado, mas prepara a imagem de um juízo destrutivo, sem explicitar além do que o versículo diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe profética e a metáfora 'filha do meu povo' foram preservadas; o travessão destaca a explicação final sem criar nota editorial.
