source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: pt
  text: 'Pois ouvi um som como o de uma mulher em trabalho de parto[a], angústia como a de quem dá à luz o primeiro filho[b] — o som da Filha de Sião, ofegante, estendendo as mãos: “Ai de mim! Minha vida desfalece diante dos que matam.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma voz” ou “um clamor”; o hebraico repete קוֹל, termo que pode significar “som”, “voz” ou “clamor”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como a que dá à luz pela primeira vez”, imagem de dores de parto especialmente intensas.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “minha alma está exausta diante dos que matam”. O hebraico נֶפֶשׁ pode significar “alma”, “pessoa” ou “vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: som
  rationale: O termo pode significar som, voz ou clamor. “Som” introduz naturalmente a percepção auditiva e permite conservar a repetição em “o som da Filha de Sião”.
- source_word: כְחוֹלָה
  choice: como o de uma mulher em trabalho de parto
  rationale: No contexto profético, a forma evoca as dores do parto, em paralelo com a referência seguinte ao primeiro nascimento.
- source_word: צָרָה
  choice: angústia
  rationale: Expressa com intensidade tanto o sofrimento físico quanto a aflição emocional associados à cena.
- source_word: כְמַבְכִּירָה
  choice: como a de quem dá à luz o primeiro filho
  rationale: Preserva a ideia hebraica de um primeiro parto e sua função de intensificar a imagem das dores.
- source_word: בַּת צִיּוֹן
  choice: Filha de Sião
  rationale: Mantém a personificação poética convencional de Sião/Jerusalém e a concisão da expressão hebraica.
- source_word: תִּתְיַפֵּחַ
  choice: ofegante
  rationale: Comunica respiração difícil e entrecortada de maneira vívida e natural em português.
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: estendendo as mãos
  rationale: Reproduz o gesto de desespero, apelo ou súplica sem explicitar além do que o texto afirma.
- source_word: אוֹי נָא לִי
  choice: Ai de mim!
  rationale: É uma exclamação portuguesa corrente, grave e concisa para o lamento hebraico; a pontuação transmite sua urgência.
- source_word: עָיְפָה נַפְשִׁי
  choice: Minha vida desfalece
  rationale: Neste contexto de ameaça mortal, נֶפֶשׁ designa naturalmente a vida ou a própria pessoa; “vida” evita impor uma distinção antropológica alheia ao contexto, enquanto “desfalece” preserva a ideia de esgotamento.
- source_word: לְהֹרְגִים
  choice: diante dos assassinos
  rationale: A preposição pode indicar relação ou confronto com os agentes da morte. “Diante dos assassinos” conserva essa abertura e expressa a violência intencional sugerida pelo particípio.
theological_decisions:
- issue: Personificação de Sião
  choice: Filha de Sião como personificação poética de Sião/Jerusalém que lamenta
  alternative: a filha de Sião
  rationale: A forma titular preserva a personificação profética sem acrescentar uma interpretação alegórica.
- issue: Sentido de נֶפֶשׁ sob ameaça de morte
  choice: minha vida
  alternative: minha alma
  rationale: “Vida” representa o eu concreto em perigo mortal e evita introduzir uma concepção posterior de alma separada que o hebraico não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A cadência poética e a repetição de “som” foram preservadas; “Filha de Sião” mantém a personificação, e as notas registram as ambiguidades lexicais relevantes.
