id: JER.4.8
reference: Jeremiah 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל זֹ֛את חִגְר֥וּ שַׂקִּ֖ים סִפְד֣וּ וְ/הֵילִ֑ילוּ כִּ֥י לֹא שָׁ֛ב חֲר֥וֹן אַף יְהֹוָ֖ה מִמֶּֽ/נּוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: pt
  text: Por causa disso, vistam-se de pano de saco; lamentem e gritem de dor, pois a ira ardente de Yahweh não se afastou de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל זֹאת
  choice: Por causa disso
  rationale: Expressa de modo natural a relação causal ou circunstancial que introduz as ordens seguintes.
- source_word: חִגְרוּ שַׂקִּים
  choice: vistam-se de pano de saco
  rationale: חגר significa literalmente cingir ou prender ao corpo; no contexto de luto, a expressão indica vestir pano de saco. A formulação escolhida preserva a imagem com clareza em português atual.
- source_word: סִפְדוּ
  choice: lamentem
  rationale: ספד descreve o lamento próprio do luto, aqui expresso por um verbo corrente e digno.
- source_word: וְהֵילִילוּ
  choice: e gritem de dor
  rationale: ילל indica um clamor alto de sofrimento. 'Gritem de dor' distingue esse ato do verbo anterior e comunica sua intensidade de modo natural.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das ordens anteriores de maneira concisa.
- source_word: לֹא שָׁב
  choice: não se afastou
  rationale: Preserva a metáfora de voltar ou retirar-se sem interpretar o verbo apenas como mudança de disposição.
- source_word: חֲרוֹן אַף
  choice: a ira ardente
  rationale: Conserva a imagem hebraica de calor intenso associada à ira, em vez de reduzi-la ao termo genérico 'ira'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִמֶּנּוּ
  choice: de nós
  rationale: O sufixo hebraico é da primeira pessoa comum do plural e inclui o profeta e o povo sob o juízo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém o paralelismo imperativo, o vocabulário concreto do luto e a metáfora da ira ardente, sem suavizar o anúncio de juízo.
