reference: Jeremiah 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: pt
  text: Como guardas de um campo[a], eles a cercam por todos os lados, porque ela se rebelou contra mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Como vigias do campo” ou “Como guardas da região aberta”. A imagem é de pessoas postadas ao redor de um campo para vigiá-lo; aqui ela é aplicada aos inimigos que cercam a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי שָׂדַי
  choice: Como guardas de um campo
  rationale: כְּ marca comparação, e o particípio plural de שׁמר designa pessoas que vigiam ou guardam. “Guardas de um campo” preserva a imagem agrícola e também se ajusta ao cenário de cerco.
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: eles a cercam por todos os lados
  rationale: Embora הָיוּ seja formalmente perfeito, no discurso profético apresenta vividamente a situação. A formulação portuguesa expressa a postura hostil e o completo cerco implícitos em עָלֶיהָ מִסָּבִיב, evitando o pouco natural “estão contra ela ao redor”.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa do juízo de maneira clara e natural.
- source_word: אֹתִי מָרָתָה
  choice: ela se rebelou contra mim
  rationale: מרה indica rebelião ou desafio contra uma autoridade; a construção portuguesa requer “contra”. O perfeito é preservado por “se rebelou”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” transmite o caráter solene da fórmula profética, enquanto “Yahweh” representa o nome divino יהוה em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente do pronome feminino singular
  choice: Manter “ela” sem identificar expressamente o referente
  alternative: Explicitar “Jerusalém”, “filha de Sião”, “Judá” ou “a terra”
  rationale: O hebraico deixa o antecedente implícito e personifica no feminino a comunidade ou cidade julgada. Manter o pronome preserva a ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Guardas” é corrente e menos arcaico que “sentinelas”; “por todos os lados” comunica naturalmente o cerco completo. O travessão destaca sem rigidez a fórmula profética final.
