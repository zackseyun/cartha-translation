  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: pt
  text: E você, devastada[a], o que fará? Ainda que se vista de escarlate, ainda que se enfeite com adornos de ouro, ainda que realce os olhos com pintura[b], é em vão que você se embeleza. Seus amantes a desprezam; procuram tirar-lhe a vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saqueada” ou “arrasada”. O hebraico se dirige a uma figura feminina singular, provavelmente Jerusalém/Sião personificada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “rasgas os teus olhos com pukh”. Pukh era um cosmético escuro para os olhos, muitas vezes chamado de kohl ou antimônio.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: devastada
  rationale: O particípio passivo feminino singular de שׁדד descreve a figura personificada como arrasada ou devastada. “Devastada” conserva a amplitude do termo sem limitá-lo ao saque.
- source_word: מַה תַּעֲשִׂי
  choice: o que fará?
  rationale: O imperfeito na segunda pessoa feminina singular admite valor futuro ou modal; no contexto, a pergunta retórica aponta para a inutilidade de qualquer reação diante da calamidade.
- source_word: שָׁנִי
  choice: escarlate
  rationale: Designa tecido ou cor tingida de escarlate; o equivalente é claro e tradicional sem soar arcaico.
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: se enfeite com adornos de ouro
  rationale: Preserva tanto o verbo reflexivo de adornar-se quanto o substantivo que designa joias ou ornamentos.
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: realce os olhos com pintura
  rationale: A formulação hebraica é literalmente forte, “rasgar/alargar os olhos com pukh”, mas funciona como expressão cosmética. “Realce” comunica a finalidade visual sem sugerir ferimento físico.
- source_word: פּוּךְ
  choice: pintura
  rationale: Refere-se a um cosmético escuro aplicado ao redor dos olhos, comparável ao kohl. O termo geral é imediatamente compreensível, e a especificidade cultural fica na nota.
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: é em vão que você se embeleza
  rationale: Mantém a ideia de esforço reflexivo de tornar-se bela e destaca sua completa inutilidade.
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: Seus amantes a desprezam
  rationale: “Amantes” preserva a metáfora profética de relações e alianças infiéis; “desprezam” representa a rejeição expressa por מאס.
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: procuram tirar-lhe a vida
  rationale: נפשׁ, como objeto de בקשׁ, forma uma expressão idiomática para buscar a vida de alguém com intenção de matá-lo. A tradução explicita esse sentido em português natural.
theological_decisions:
- issue: Personificação profética de Jerusalém/Sião como mulher, marcada por formas femininas singulares
  choice: Preservar o tratamento feminino em “devastada” e nos pronomes, sem inserir “Jerusalém” ou “Sião” no texto principal
  alternative: Identificar explicitamente a destinatária como Jerusalém ou filha de Sião
  rationale: A gramática hebraica estabelece uma destinatária feminina singular, provavelmente Jerusalém/Sião personificada, mas o nome não ocorre neste versículo. A versão conserva a personificação sem transformar uma identificação contextual em elemento explícito do texto.
- issue: Sentido dos “amantes” na metáfora profética
  choice: Manter “amantes” sem identificar no versículo os aliados políticos ou parceiros idólatras
  alternative: Traduzir interpretativamente como “aliados” ou “amantes ilícitos”
  rationale: O termo contém conotação erótica negativa e participa da metáfora de infidelidade, mas o referente específico deve permanecer aberto conforme o próprio versículo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição “ainda que” reproduz a progressão retórica do hebraico. Emprega-se “você” para tornar inequívoca a destinatária singular; as formas “devastada”, “se vista” e “a desprezam” preservam seu gênero feminino.
