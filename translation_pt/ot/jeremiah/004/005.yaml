  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: pt
  text: 'Anunciem isto em Judá, proclamem em Jerusalém e digam:


    “Toquem a trombeta[a] na terra!


    Clamem bem alto[b] e digam:


    ‘Reúnam-se! Vamos para as cidades fortificadas!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é shofar, um chifre, geralmente de carneiro, usado como instrumento de alarme.
    reason: cultural_note
  - marker: b
    text: O hebraico diz de forma concisa “clamem, encham”. Pode indicar um clamor em plena voz ou o ato de encher a terra ou o ar com o alarme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Anunciem isto
  rationale: O hifil imperativo plural de נגד pede um anúncio público. “Isto” explicita em português o objeto implícito no hebraico sem definir seu conteúdo.
- source_word: הַשְׁמִיעוּ
  choice: proclamem
  rationale: O hifil de שמע significa literalmente “façam ouvir”; “proclamem” comunica com naturalidade a divulgação pública e urgente.
- source_word: וּ/תקעו שׁוֹפָר
  choice: Toquem a trombeta
  rationale: שׁוֹפָר designa uma trombeta de chifre usada, neste contexto, para dar o alarme. A nota preserva a referência cultural específica.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém a expressão ampla do hebraico, que no contexto se refere à terra ou ao território de Judá.
- source_word: קִרְאוּ מַלְאוּ
  choice: Clamem bem alto
  rationale: 'A sequência é concisa e difícil: קרא ordena clamar, enquanto מלא intensifica o clamor. “Bem alto” transmite a força idiomática sem inserir no texto um objeto não expresso, como “o ar” ou “a terra”.'
- source_word: הֵאָסְפוּ
  choice: Reúnam-se
  rationale: O nifal imperativo de אסף funciona como convocação para que o povo se ajunte; “Reúnam-se” é direto e preserva o valor reflexivo.
- source_word: וְנָבוֹאָה
  choice: Vamos
  rationale: O coortativo na primeira pessoa do plural expressa exortação conjunta. “Vamos” reproduz essa força de maneira natural em português.
- source_word: אֶל עָרֵי הַמִּבְצָר
  choice: para as cidades fortificadas
  rationale: A preposição אֶל indica movimento em direção às cidades. “Para” preserva essa orientação sem decidir explicitamente entre chegar até elas e entrar nelas.
