  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: pt
  text: Levantem um sinal em direção a Sião[a]. Procurem refúgio; não fiquem parados, pois eu estou trazendo do norte uma calamidade[b] e uma grande destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levantem um estandarte em direção a Sião”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “calamidade” significa desgraça ou juízo, não maldade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Levantem um sinal
  rationale: A expressão designa o ato de erguer um sinal visível para convocação ou alerta. “Sinal” comunica a função de נֵס em português atual; “estandarte” permanece como alternativa possível.
- source_word: צִיּוֹנָה
  choice: em direção a Sião
  rationale: O ה direcional indica orientação ou movimento para Sião, nuance preservada de modo natural.
- source_word: הָעִיזוּ
  choice: Procurem refúgio
  rationale: O imperativo hifil de עוז provavelmente ordena buscar proteção ou refugiar-se. A formulação mantém a urgência sem acrescentar explicitamente a ideia de fuga.
- source_word: אַל תַּעֲמֹדוּ
  choice: não fiquem parados
  rationale: No contexto de alerta, a proibição adverte contra permanecer no lugar ou demorar-se.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto profético, o substantivo denota desgraça ou desastre decorrente do juízo, e não maldade moral.
- source_word: אָנֹכִי מֵבִיא
  choice: eu estou trazendo
  rationale: O pronome explícito e o particípio destacam a ação divina vívida e iminente.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Preserva diretamente a origem geográfica da calamidade anunciada.
- source_word: שֶׁבֶר גָּדוֹל
  choice: uma grande destruição
  rationale: שֶׁבֶר pode indicar quebra, ruína ou destruição; aqui “grande destruição” é claro e adequado ao paralelismo.
theological_decisions:
- issue: Sentido de רָעָה quando Deus é o agente
  choice: calamidade
  alternative: mal; desastre
  rationale: “Calamidade” preserva a afirmação de que Deus traz o juízo anunciado, sem fazer o termo significar maldade moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural e linguagem direta de alerta profético. A ordem hebraica “do norte” foi mantida junto ao verbo para clareza da origem da calamidade.
