  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: pt
  text: 'Pois assim diz o SENHOR aos homens de Judá e a Jerusalém: “Lavrem para vocês terra ainda não lavrada[a] e não semeiem entre espinhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra de pousio”. O hebraico se refere ao solo que precisa ser lavrado antes da semeadura.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional para o tetragrama, preservando a reverência judaica e permitindo a identificação do nome divino por meio de versaletes.
- source_word: לְאִישׁ יְהוּדָה
  choice: aos homens de Judá
  rationale: Embora אִישׁ esteja no singular, aqui tem valor coletivo. A formulação conserva a referência masculina explícita do hebraico sem recorrer ao singular pouco natural em português.
- source_word: וְלִירוּשָׁלִַם
  choice: e a Jerusalém
  rationale: Mantém diretamente o nome da cidade, como no hebraico, deixando que o leitor reconheça a metonímia pelos habitantes.
- source_word: נִירוּ
  choice: Lavrem
  rationale: O imperativo designa o ato de preparar ou revolver o solo para o cultivo. “Lavrem” expressa de modo natural e preciso a ação agrícola em português.
- source_word: נִיר
  choice: terra não cultivada
  rationale: O substantivo refere-se a solo ainda não preparado ou deixado em pousio. A expressão é clara no português corrente e preserva a imagem agrícola; a alternativa tradicional consta na nota.
- source_word: לָכֶם
  choice: para vocês
  rationale: Conserva o dativo de interesse ou benefício. Em português, “para vocês” soa mais natural do que a forma reflexiva enfática “para vocês mesmos” neste contexto.
- source_word: וְאַל תִּזְרְעוּ
  choice: e não semeiem
  rationale: “Semear” corresponde especificamente ao lançamento de sementes e mantém a coerência da metáfora agrícola.
- source_word: אֶל קוֹצִים
  choice: entre espinhos
  rationale: No contexto de semeadura, אֶל indica o terreno para dentro do qual se lançaria a semente. “Entre espinhos” é idiomático e preserva a imagem sem explicá-la.
theological_decisions:
- issue: Força metafórica das ordens agrícolas
  choice: Manter diretamente a imagem agrícola, sem explicitar arrependimento no texto principal.
  alternative: Parafrasear a imagem como uma ordem para preparar o coração ou abandonar o pecado.
  rationale: O hebraico apresenta a metáfora, não sua interpretação explícita. Preservá-la evita inserir uma explicação teológica no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção preserva o paralelismo agrícola e a metonímia “Jerusalém”. “SENHOR” deve ser publicado em versaletes quando a tipografia permitir.
