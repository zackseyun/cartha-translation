id: JER.4.10
reference: Jeremiah 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: pt
  text: 'Então eu disse: “Ah, Senhor Yahweh, de fato enganaste completamente este povo e Jerusalém, dizendo: ‘Vocês terão paz’, mas a espada já atingiu a própria vida[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegou até a alma” ou “chegou à garganta”. Aqui, o hebraico néfesh provavelmente se refere à própria vida, indicando que a espada chegou ao ponto de causar a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição abrupta de consternação ou lamento; é natural em português e preserva a força da fala.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa de modo transparente o título composto, evitando a formulação pouco natural “Senhor SENHOR”.
- source_word: הַשֵּׁא הִשֵּׁאתָ
  choice: de fato enganaste completamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a acusação. “Enganaste” conserva o sentido direto de נשׁא, e “de fato... completamente” comunica a ênfase sem suavizar a tensão.
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: este povo e Jerusalém
  rationale: Mantém os dois objetos da ação e a personificação de Jerusalém, com sintaxe natural em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo da declaração associada ao engano.
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: Vocês terão paz
  rationale: Expressa de forma corrente a promessa de paz, segurança e bem-estar; o plural “vocês” corresponde ao sufixo plural hebraico.
- source_word: וְנָגְעָה חֶרֶב
  choice: mas a espada já atingiu
  rationale: “Atingiu” comunica a chegada mortal da espada; “mas” explicita o forte contraste contextual, e “já” reflete o valor resultante do perfeito.
- source_word: עַד הַנָּפֶשׁ
  choice: a própria vida
  rationale: Neste contexto, נֶפֶשׁ aponta provavelmente para a vida ameaçada, isto é, até o ponto da morte. A nota preserva as imagens alternativas de “alma” e “garganta”.
theological_decisions:
- issue: Se a afirmação de que Deus enganou o povo deve ser suavizada
  choice: 'Manter a acusação direta: “enganaste completamente”'
  alternative: “permitiste que este povo fosse enganado” ou “induziste gravemente ao erro”
  rationale: A construção hebraica atribui diretamente a ação a Deus na fala de Jeremias. A tradução preserva essa tensão teológica em vez de introduzir uma harmonização interpretativa.
- issue: Sentido de עַד הַנָּפֶשׁ
  choice: “atingiu a própria vida”
  alternative: “chegou até a alma” ou “chegou à garganta”
  rationale: “Vida” comunica com clareza a ameaça mortal no contexto, enquanto a nota registra a amplitude metafórica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a acusação abrupta de Jeremias e a tensão do hebraico, sem recorrer a formulações arcaicas. O marcador [a] aparece no texto principal e corresponde à única nota.
