id: JER.4.27
reference: Jeremiah 4:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Toda a terra[a] ficará desolada, mas não a destruirei por completo.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda a Terra”. O hebraico אֶרֶץ pode significar “terra” no sentido de território ou “Terra”; aqui, o contexto aponta principalmente para Judá, embora as imagens ao redor possam sugerir uma devastação de alcance cósmico.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente, “não farei um fim completo”; também pode ser traduzido: “não porei fim a tudo”. O hebraico preserva a tensão entre um juízo devastador e a recusa de Yahweh em causar aniquilação total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação divina para a visão precedente e mantém a ligação discursiva natural em português.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética de mensageiro em registro solene, claro e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: שְׁמָמָה תִהְיֶה
  choice: ficará desolada
  rationale: Expressa naturalmente em português o estado futuro de devastação indicado pelo substantivo predicativo e pelo verbo, sem enfraquecer a gravidade do juízo.
- source_word: כָּל הָאָרֶץ
  choice: Toda a terra
  rationale: No contexto imediato, refere-se sobretudo à terra de Judá; a formulação portuguesa também conserva a possível amplitude de אֶרֶץ, explicitada em nota.
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: mas não a destruirei por completo
  rationale: Torna inteligível o idioma hebraico em português atual e preserva o contraste entre devastação severa e ausência de aniquilação total.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra, entendida no contexto principalmente como a terra de Judá
  alternative: toda a Terra, em sentido universal
  rationale: O contexto trata do juízo sobre Judá, mas a linguagem circundante possui ecos cósmicos; a nota mantém essa ambiguidade legítima.
- issue: Sentido de וְכָלָה לֹא אֶעֱשֶׂה
  choice: não a destruirei por completo
  alternative: não porei fim completo
  rationale: A tradução escolhida comunica com clareza a contenção divina sem eliminar a tensão entre devastação e preservação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita um calque pouco natural do idioma hebraico, enquanto as notas preservam tanto a alternativa lexical quanto a possível amplitude do cenário.
