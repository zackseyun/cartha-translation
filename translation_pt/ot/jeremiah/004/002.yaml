  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: pt
  text: 'E, se você jurar: “Tão certo como Yahweh vive”[a], em verdade, em justiça e em retidão, então as nações abençoarão a si mesmas nele[b][c] e nele se gloriarão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento: “Tão certo como Yahweh vive”.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “serão abençoadas nele”. O verbo hebraico pode ser entendido reflexivamente, “abençoarão a si mesmas”, ou, com menor probabilidade aqui, em sentido semelhante ao passivo.'
    reason: lexical_alternative
  - marker: c
    text: O referente de “nele” não está explícito no hebraico. Pode ser Israel/Judá restaurado, embora alguns entendam que se refere a Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: e, se você jurar
  rationale: O perfeito nifal com waw dá continuidade à condição do contexto anterior. A formulação condicional expressa essa relação sem transformar o verbo em simples passado ou futuro.
- source_word: חַי יְהוָה
  choice: “Tão certo como Yahweh vive”
  rationale: É uma fórmula hebraica tradicional de juramento. Esta forma é natural em português e conserva Yahweh como nome pessoal divino.
- source_word: בֶּאֱמֶת בְּמִשְׁפָּט וּבִצְדָקָה
  choice: com verdade, com justiça e com retidão
  rationale: A tradução mantém os três substantivos e seu paralelismo ético, distinguindo מִשְׁפָּט, justiça, de צְדָקָה, retidão.
- source_word: וְהִתְבָּרְכוּ
  choice: então as nações abençoarão a si mesmas
  rationale: O hitpael de ברך admite sentido reflexivo. A construção explicita esse valor em português, enquanto a nota registra a possibilidade de uma leitura passiva.
- source_word: בּוֹ
  choice: nele
  rationale: A tradução reproduz a preposição com pronome masculino singular e não identifica seu referente, preservando a ambiguidade do hebraico.
- source_word: גּוֹיִם
  choice: as nações
  rationale: No contexto profético, o termo se refere amplamente aos povos ou nações; “nações” é claro e corrente.
- source_word: יִתְהַלָּלוּ
  choice: se gloriarão
  rationale: O hitpael de הלל comunica a ideia de gloriar-se ou orgulhar-se. “Se gloriarão” combina dignidade, clareza e paralelismo com a forma reflexiva anterior.
theological_decisions:
- issue: Referente do pronome em “nele”
  choice: Manter o pronome masculino singular sem explicitar o referente.
  alternative: Traduzir interpretativamente como “em Yahweh” ou “em Israel/Judá”.
  rationale: O hebraico não repete um substantivo junto ao pronome. O contexto pode apontar para Israel/Judá restaurado, enquanto também pode ser entendido em referência a Yahweh. A tradução conserva essa tensão.
- issue: Sentido de וְהִתְבָּרְכוּ
  choice: 'Adotar no texto o sentido reflexivo: “abençoarão a si mesmas”.'
  alternative: “serão abençoadas”.
  rationale: A forma hitpael favorece o valor reflexivo, mas o emprego pode aproximar-se de um sentido passivo; a alternativa é mantida em nota sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a sequência condicional e o paralelismo triplo do hebraico. “Yahweh” preserva o nome divino; “se gloriarão” evita a possível conotação exclusivamente negativa de “se orgulharão”.
