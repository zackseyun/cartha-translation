base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: pt
  text: Minhas entranhas, minhas entranhas! Eu me contorço de dor! Ó paredes do meu coração! Meu coração se agita dentro de mim; não posso ficar calado, pois você ouviu, ó minha alma,[a] o som da trombeta[b] e o brado de guerra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha alma ouviu”. A expressão hebraica pode ser entendida como alguém falando consigo mesmo — “você ouviu, ó minha alma” — ou com “minha alma” como sujeito enfático.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o shofar, trombeta feita de chifre, usada também para dar sinais de alarme.
    reason: historical_context
  - marker: c
    text: 'Ou: “o alarme de guerra” ou “o grito de batalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: minhas entranhas
  rationale: Preserva a imagem visceral dos órgãos internos como centro da angústia profunda, sem recorrer ao arcaísmo ou tornar a expressão abstrata; a repetição comunica a intensidade emocional.
- source_word: אחולה
  choice: eu me contorço de dor
  rationale: Expressa tanto o sofrimento quanto o movimento corporal sugerido pelo verbo ligado a contorcer-se ou sofrer dores intensas.
- source_word: קִירוֹת לִבִּי
  choice: paredes do meu coração
  rationale: Mantém a metáfora corporal incomum e vívida do hebraico, em vez de interpretá-la silenciosamente como 'câmaras' ou apenas 'íntimo'.
- source_word: הֹמֶה לִּי לִבִּי
  choice: meu coração se agita dentro de mim
  rationale: המה denota tumulto, agitação, rumor ou bramido. 'Se agita' retém a amplitude da imagem melhor que a interpretação mais específica 'bate forte'.
- source_word: לֹא אַחֲרִישׁ
  choice: não posso ficar calado
  rationale: No contexto da angústia que irrompe em clamor, comunica a impossibilidade experiencial de permanecer em silêncio, embora a forma também possa ser entendida volitivamente.
- source_word: ק֤וֹל שׁוֹפָר֙
  choice: o som da trombeta
  rationale: Traduz explicitamente קוֹל como 'som' e usa o termo português comum para o instrumento de sinalização, esclarecendo em nota que שׁוֹפָר é uma trombeta de chifre.
- source_word: שמעתי נַפְשִׁי
  choice: você ouviu, ó minha alma
  rationale: Segue a leitura massorética tradicional como segunda pessoa feminina em discurso dirigido à própria alma e conserva a mudança abrupta para a autoexortação.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: o brado de guerra
  rationale: תְּרוּעָה pode indicar grito, toque de alarme ou sinal sonoro; 'brado de guerra' é vívido e preserva a associação direta com a batalha sem restringir indevidamente o som à trombeta.
theological_decisions:
- issue: A alma como destinatária ou sujeito da audição
  choice: 'Discurso direto à própria alma: ''você ouviu, ó minha alma'''
  alternative: '''minha alma ouviu'' ou, conforme outra vocalização possível, ''ouvi em minha alma'''
  rationale: A leitura escolhida preserva a forma tradicional do texto massorético e sua autoapóstrofe abrupta, enquanto a nota reconhece a dificuldade textual e sintática sem transformar 'alma' em uma afirmação doutrinária sobre a constituição humana.
translation_notes:
  register: Português atual, digno e de leitura ampla, com forte cadência exclamativa. As imagens corporais incomuns do hebraico foram mantidas; evitou-se tanto o arcaísmo 'vísceras' quanto uma paráfrase abstrata. O tratamento 'você' favorece a legibilidade brasileira, enquanto 'ó minha alma' sustenta o tom poético e solene.
