base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: pt
  text: Pois uma voz anuncia de Dã e proclama a desgraça da região montanhosa de Efraim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a calamidade” ou “a aflição”. A palavra hebraica também pode significar “maldade” em outros contextos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou causal da conjunção no contexto, sem acrescentar ênfase indevida.
- source_word: קוֹל
  choice: uma voz
  rationale: Preserva a imagem vívida do hebraico, em que se ouve a voz que traz o anúncio.
- source_word: מַגִּיד
  choice: anuncia
  rationale: O presente dá vivacidade ao particípio hebraico e soa natural em português.
- source_word: מִדָּן
  choice: desde Dã
  rationale: Dã é o topônimo que assinala a origem setentrional do anúncio; 'desde' ressalta o ponto de procedência.
- source_word: וּמַשְׁמִיעַ
  choice: e proclama
  rationale: Expressa o sentido causativo de tornar algo audível ou publicamente conhecido e conserva o paralelismo verbal.
- source_word: אָוֶן
  choice: a desgraça
  rationale: Neste contexto de ameaça militar e juízo, o termo indica calamidade ou desastre, e não primariamente maldade moral.
- source_word: מֵהַר אֶפְרָיִם
  choice: desde a região montanhosa de Efraim
  rationale: Trata הַר אֶפְרָיִם como designação geográfica regional, em português claro, sem sugerir necessariamente um único monte.
