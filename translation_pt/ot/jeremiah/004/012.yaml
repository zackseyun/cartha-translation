source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: pt
  text: Um vento forte demais para isso virá para mim[a]; agora, também eu pronunciarei juízos contra eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um vento cheio virá destes a mim” ou “Um vento mais forte que estes virá a mim”. A frase hebraica é concisa e pode indicar finalidade, comparação ou procedência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “agora também eu proferirei sentenças contra eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: vento
  rationale: O contexto imediato é meteorológico e retoma o vento mencionado no versículo anterior; “vento” é preferível a “espírito” ou “sopro”.
- source_word: מָלֵא
  choice: forte demais
  rationale: O sentido básico é “cheio”, mas, aplicado ao vento e em contraste com as tarefas leves do versículo anterior, comunica intensidade excessiva. “Forte demais” exprime isso de modo natural em português.
- source_word: מֵאֵלֶּה
  choice: para isso
  rationale: A construção com מִן e o demonstrativo é elíptica. “Para isso” liga o contraste aos propósitos mencionados antes, sem especificá-los novamente; outras relações, como comparação ou procedência, permanecem possíveis e são registradas em nota.
- source_word: יָבוֹא לִי
  choice: virá em meu favor
  rationale: Literalmente, “virá para/a mim”. No discurso divino, a expressão pode indicar que o vento vem a serviço ou por determinação do Senhor. “Em meu favor” preserva a ideia sem explicitar além do texto que virá “por minha ordem”.
- source_word: עַתָּה
  choice: agora
  rationale: Equivalente temporal direto, claro e corrente.
- source_word: גַּם אֲנִי
  choice: eu mesmo também
  rationale: Conserva tanto o valor aditivo de גַּם quanto a ênfase do pronome independente אֲנִי.
- source_word: אֲדַבֵּר
  choice: pronunciarei
  rationale: Embora o verbo signifique basicamente “falar”, seu objeto judicial favorece “pronunciar”, que soa natural em português sem perder o ato verbal explícito.
- source_word: מִשְׁפָּטִים
  choice: juízos
  rationale: O plural designa decisões ou sentenças judiciais, não a justiça em sentido abstrato. “Juízos” mantém o vocabulário profético e jurídico.
- source_word: אוֹתָם
  choice: contra eles
  rationale: Embora formalmente contenha o marcador de objeto direto com sufixo, a construção portuguesa “pronunciar juízos contra eles” explicita naturalmente o sentido judicial adverso.
theological_decisions:
- issue: Identidade do falante na primeira pessoa
  choice: O Senhor fala, declarando que o vento vem a seu serviço e que ele pronunciará juízos contra o povo.
  alternative: O profeta poderia falar em primeira pessoa em parte do versículo, ou לִי poderia ser apenas direcional, “a mim”, sem forte nuance de agência.
  rationale: O contexto mais amplo apresenta a fala divina de julgamento, e a continuidade dos elementos na primeira pessoa favorece essa leitura. A tradução, porém, não acrescenta “diz o Senhor” e a nota preserva a ambiguidade da expressão compacta.
- issue: Força judicial de אֲדַבֵּר מִשְׁפָּטִים
  choice: “pronunciarei juízos contra eles”
  alternative: “falarei julgamentos contra eles” ou “pronunciarei sentença contra eles”
  rationale: A formulação escolhida conserva o plural hebraico e comunica atos judiciais divinos sem reduzi-los a uma única sentença.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Forte demais” torna inteligível a imagem de um vento “cheio” ou intenso, enquanto a nota conserva as possibilidades da sintaxe hebraica. A ordem “eu mesmo também” mantém a ênfase sem recorrer a linguagem arcaica.
