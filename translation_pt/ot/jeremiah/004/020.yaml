  naturalness: O português é claro, moderno e poeticamente conciso. A elipse verbal em «num instante, minhas cortinas» é natural em poesia e reproduz de modo apropriado a concisão do hebraico. A nota a deve ser ancorada diretamente em «terra», que é o termo que ela esclarece.
  terminology: «Desastre sobre desastre», «anunciado», «devastada(s)», «tendas» e «cortinas» são escolhas adequadas e consistentes. «Terra» preserva a amplitude de אֶרֶץ; a nota deve expressar com maior precisão a alternativa «terra inteira/o mundo», sem transformar a provável referência a Judá em certeza.
