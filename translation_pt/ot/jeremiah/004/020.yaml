  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: pt
  text: Desastre sobre desastre é anunciado, pois toda a terra[a] está devastada. De repente, minhas tendas são devastadas; num instante, minhas cortinas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «terra» provavelmente se refere ao território de Judá sob juízo; o termo hebraico também pode significar «a terra inteira» ou «o mundo».
    reason: alternative_reading
  - marker: b
    text: «Minhas cortinas» são as cortinas das tendas; o verso retrata uma habitação destruída de modo repentino.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: Desastre sobre desastre
  rationale: A expressão repetida descreve calamidades que se acumulam. A formulação preserva a força poética e a repetição do hebraico sem sugerir apenas uma quebra literal.
- source_word: נִקְרָא
  choice: é anunciado
  rationale: O nifal de קרא apresenta o desastre como algo proclamado ou anunciado publicamente; a forma passiva mantém a estrutura do texto-fonte.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do anúncio de desastre e mantém a concisão do verso poético.
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: foi devastada / foram devastadas
  rationale: O verbo שׁדד pode envolver saque e destruição violenta. 'Devastar' comunica o resultado amplo e permite consistência entre a terra e as tendas.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: No contexto, אֶרֶץ provavelmente se refere à terra sob juízo, especialmente Judá, mas 'terra' preserva em português a ambiguidade possível entre território e mundo.
- source_word: פִּתְאֹם
  choice: De repente
  rationale: Expressa diretamente o caráter abrupto da devastação.
- source_word: אֹהָלַי
  choice: minhas tendas
  rationale: Mantém literalmente a imagem de habitação nômade ou temporária presente na poesia profética.
- source_word: רֶגַע
  choice: num instante
  rationale: Marca a extrema rapidez do acontecimento em português natural e conciso.
- source_word: יְרִיעֹתַי
  choice: minhas cortinas
  rationale: O termo designa as cortinas ou panos que formavam ou cobriam a tenda. A referência é esclarecida em nota sem expandir o texto principal.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: toda a terra
  alternative: o mundo inteiro; todo o país
  rationale: O contexto de Jeremias 4 favorece a terra de Judá sob juízo, mas o substantivo hebraico admite 'terra' em sentido mais amplo. A tradução conserva essa tensão lexical, e a nota explicita o referente contextual provável.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. A repetição de 'devastada(s)' reflete deliberadamente a repetição do mesmo verbo hebraico. Os marcadores de nota aparecem imediatamente após as expressões que esclarecem.
