base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: pt
  text: “Se você voltar[a], Israel — declaração de Yahweh —, volte para mim; se retirar da minha presença suas coisas detestáveis[b] e não vaguear[c],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você voltar, Israel — declaração de Yahweh —, para mim você voltará”, reproduzindo de modo mais formal a repetição do verbo hebraico.'
    reason: alternative_reading
  - marker: b
    text: A expressão refere-se a coisas consideradas repugnantes, especialmente objetos de idolatria; também poderia ser traduzida por “suas abominações” ou, de modo mais interpretativo, “seus ídolos”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não vacilar”, “não se desviar” ou “não andar errante”. O verbo hebraico pode indicar movimento errante, desvio ou instabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Mantém a força condicional explícita do apelo profético.
- source_word: תָּשׁוּב ... תָּשׁוּב
  choice: voltar ... volte
  rationale: Preserva a repetição retórica do verbo שׁוב e expressa naturalmente em português a passagem da condição para a exortação.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Funciona como vocativo direto em português, sem necessidade do solene e menos corrente «ó».
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e mantém o nome divino expresso no texto hebraico.
- source_word: אֵלַי
  choice: para mim
  rationale: Expressa de modo direto e natural a direção pessoal do retorno exigido.
- source_word: תָּסִיר
  choice: retirar
  rationale: Comunica o sentido causativo de remover ou afastar.
- source_word: שִׁקּוּצֶיךָ
  choice: os seus objetos detestáveis
  rationale: Conserva a forte ideia de repulsa e a referência provável a objetos idolátricos, sem restringir o termo explicitamente a «ídolos» no texto principal.
- source_word: מִפָּנַי
  choice: da minha presença
  rationale: Torna natural em português a imagem hebraica literal de remover algo de diante da face de Deus.
- source_word: וְלֹא תָנוּד
  choice: e não andar errante
  rationale: Representa o campo semântico de נוד, que pode envolver vaguear, desviar-se ou mostrar instabilidade, sem resolver completamente a ambiguidade.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio; «Yahweh» o representa diretamente, sem substituí-lo por um título.
- issue: Força das duas ocorrências de שׁוב
  choice: 'Leitura condicional e exortativa: «Se você voltar ... volte para mim»'
  alternative: 'Leitura condicional e resultativa: «Se você voltar ... para mim você voltará»'
  rationale: A forma verbal permite tensão entre exortação e resultado. O texto principal preserva as duas ocorrências e adota a leitura exortativa mais natural no contexto, enquanto a nota registra a alternativa formal.
- issue: Sentido de תָנוּד
  choice: Instabilidade moral figurada como andar errante
  alternative: Não vacilar; não se deslocar; não vaguear
  rationale: O verbo é semanticamente amplo. A formulação escolhida mantém a imagem de movimento sem reduzi-la a uma doutrina específica sobre arrependimento.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O vocativo dispensa «ó», e a pontuação mantém a frase aberta, pois a construção sintática prossegue no versículo seguinte.
