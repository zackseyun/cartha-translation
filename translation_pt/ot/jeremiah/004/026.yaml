  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: pt
  text: Olhei, e eis que a terra fértil[a] era um deserto, e todas as suas cidades foram demolidas diante de Yahweh[b], diante de sua ira ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Carmelo. Aqui, a palavra provavelmente é usada no sentido mais amplo de terra fértil ou cultivada, e não como referência específica à região do monte Carmelo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa de Yahweh, por causa de sua ira ardente”. A expressão hebraica repete literalmente “de diante da face de”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Olhei
  rationale: No contexto da sequência visionária, o perfeito de ראה introduz o que o profeta contempla. “Olhei” preserva a observação em primeira pessoa e a fórmula recorrente.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama a atenção para uma visão súbita. “E eis que” conserva a vivacidade e o tom profético sem alongar a frase.
- source_word: הַכַּרְמֶל
  choice: a terra fértil
  rationale: כַּרְמֶל pode designar o Carmelo ou, como nome comum, terra fértil e cultivada. O contraste direto com הַמִּדְבָּר favorece aqui o sentido comum, sem eliminar a alternativa geográfica, registrada em nota.
- source_word: הַמִּדְבָּר
  choice: um deserto
  rationale: מִדְבָּר indica região erma ou desolada, não necessariamente um deserto arenoso. Em português, “um deserto” comunica naturalmente a transformação predicativa da terra fértil em lugar desolado.
- source_word: וְכָל עָרָיו
  choice: e todas as suas cidades
  rationale: O sufixo masculino singular retoma a terra ou região mencionada. “Suas” mantém a referência natural em português.
- source_word: נִתְּצוּ
  choice: tinham sido demolidas
  rationale: O Nifal de נתץ expressa que as cidades foram derrubadas ou destruídas. O mais-que-perfeito composto apresenta naturalmente o estado resultante contemplado pelo profeta.
- source_word: מִפְּנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão significa literalmente “de/diante da face de Yahweh” e também pode indicar causa. “Diante de” preserva a imagem e a repetição hebraicas; a leitura causal aparece em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino. “Yahweh” o translitera em vez de substituí-lo por um título.
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: diante do furor da sua ira
  rationale: חֲרוֹן אַף é uma expressão intensa para a ira ardente. “Furor da sua ira” preserva a força e mantém o paralelismo com “diante de Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de o substituir por um título.
- issue: Valor de מִפְּנֵי nas duas expressões finais
  choice: diante de
  alternative: por causa de
  rationale: A formulação escolhida mantém a imagem literal da presença divina e a repetição enfática do hebraico, enquanto uma nota reconhece o valor causal plausível no contexto de juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a fórmula visionária “e eis que”, o paralelismo final e a ambiguidade entre presença e causa; termos excessivamente técnicos ou arcaicos foram evitados.
