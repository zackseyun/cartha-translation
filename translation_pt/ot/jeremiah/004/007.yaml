source:
  edition: WLC
  text: עָלָ֤ה אַרְיֵה֙ מִֽ/סֻּבְּכ֔/וֹ וּ/מַשְׁחִ֣ית גּוֹיִ֔ם נָסַ֖ע יָצָ֣א מִ/מְּקֹמ֑/וֹ לָ/שׂ֤וּם אַרְצֵ/ךְ֙ לְ/שַׁמָּ֔ה עָרַ֥יִ/ךְ תִּצֶּ֖ינָה מֵ/אֵ֥ין יוֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: pt
  text: Um leão subiu da sua mata cerrada[a], e um destruidor de nações partiu. Ele saiu do seu lugar para tornar a tua terra uma desolação. Tuas cidades ficarão devastadas, sem nenhum habitante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu covil”. O termo hebraico se refere a vegetação densa ou emaranhada que serve de esconderijo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sem ninguém morando nelas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: subiu
  rationale: O qal perfeito de עלה indica subir ou avançar. “Subiu” preserva de modo conciso o movimento vívido do invasor em direção à terra.
- source_word: אַרְיֵה
  choice: leão
  rationale: Mantém literalmente a metáfora central do invasor, sem substituí-la por uma identificação interpretativa como “inimigo”.
- source_word: מִסֻּבְּכוֹ
  choice: da sua mata cerrada
  rationale: סֹבֶךְ designa vegetação densa ou emaranhada. “Mata cerrada” conserva a imagem do leão emergindo de uma cobertura vegetal espessa; “covil” é uma alternativa contextual.
- source_word: מַשְׁחִית גּוֹיִם
  choice: um destruidor de nações
  rationale: A construção participial descreve o mesmo invasor apresentado como leão. O artigo indefinido mantém o valor descritivo sem identificar além do que o texto declara.
- source_word: נָסַע
  choice: partiu
  rationale: O verbo pode indicar levantar acampamento e pôr-se em marcha. “Partiu” comunica naturalmente o início do avanço militar.
- source_word: יָצָא מִמְּקֹמוֹ
  choice: Ele saiu do seu lugar
  rationale: Preserva a repetição enfática do movimento e a referência à partida do invasor de sua própria base.
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: para tornar a sua terra uma desolação
  rationale: Reproduz a construção de propósito e conserva o registro profético forte de שַׁמָּה.
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: Suas cidades ficarão devastadas
  rationale: O verbo expressa o estado de devastação ou ruína resultante. “Ficarão devastadas” é natural em português e evita sugerir uma voz passiva não explicitada na forma hebraica.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: A expressão indica ausência total de moradores. O singular “habitante” acompanha o uso coletivo do hebraico e soa natural em português.
theological_decisions:
- issue: Identidade do leão e destruidor
  choice: Manter as imagens “leão” e “destruidor de nações” sem nomear o invasor
  alternative: Identificá-lo explicitamente como um rei, exército ou império específico
  rationale: O versículo não fornece aqui uma identificação nominal; manter a formulação metafórica preserva a tensão e evita importar uma conclusão interpretativa para o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva o paralelismo e a progressão do hebraico, sem perder clareza.
