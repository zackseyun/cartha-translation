review_pass:
  verdict: revise
  source_fidelity: A tradução mantém adequadamente a imagem do leão, o invasor descrito como destruidor de nações, a sequência de partida e a finalidade devastadora. “Mata cerrada” representa bem o esconderijo vegetal denso de מִסֻּבְּכוֹ, e “ficarão devastadas” transmite o resultado expresso por תִּצֶּינָה. Contudo, “a sua terra” pode, em português, remeter ambiguamente ao leão/invasor, quando o hebraico traz inequivocamente a terra da destinatária feminina singular.
  naturalness: O texto é claro, de registro profético moderadamente elevado e plenamente legível no português brasileiro e internacional. “Tua terra” evita a ambiguidade referencial sem prejudicar a dignidade nem a fluência.
  terminology: “Leão”, “destruidor de nações”, “desolação” e “habitante” são escolhas fiéis e coerentes com o registro do versículo. As notas preservam alternativas lexicais legítimas e seus marcadores estão corretamente ancorados.
  issues:
  - severity: medium
    issue: Ambiguidade em “a sua terra”.
    rationale: O sufixo de אַרְצֵךְ é feminino singular e se dirige a Judá/Jerusalém no discurso profético. Em português, “sua” pode ser associado ao antecedente masculino mais próximo, “ele”/o invasor. “Tua terra” torna explícita a referência sem acrescentar interpretação.
