  to: Um leão subiu da sua mata cerrada[a], e um destruidor de nações partiu. Ele saiu do seu lugar para tornar a tua terra uma desolação. Tuas cidades ficarão devastadas, sem nenhum habitante[b].
  rationale: A única alteração é a substituição de “sua/suas” por “tua/tuas” na referência à destinatária. Isso elimina uma ambiguidade criada pela estrutura pronominal do português e preserva o destinatário feminino singular indicado no hebraico, sem alterar sentido, imagens ou registro.
