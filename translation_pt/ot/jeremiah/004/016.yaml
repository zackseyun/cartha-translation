  text: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם הִנֵּה֙ הַשְׁמִ֣יעוּ עַל יְרוּשָׁלִַ֔ם נֹצְרִ֥ים בָּאִ֖ים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק וַֽ/יִּתְּנ֛וּ עַל עָרֵ֥י יְהוּדָ֖ה קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: pt
  text: 'Anunciem isso às nações: “Vejam, proclamem a respeito de Jerusalém: sentinelas[a] vêm de uma terra distante e levantam a voz contra as cidades de Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sitiantes”. O termo hebraico designa literalmente os que vigiam ou montam guarda, mas, neste contexto, pode referir-se a forças hostis que cercam uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירוּ
  choice: Anunciem isso
  rationale: O hifil imperativo plural de זכר pode ter o sentido de fazer lembrar, mencionar ou declarar. Neste contexto de advertência pública, “anunciem isso” comunica com naturalidade a ordem de divulgar a mensagem.
- source_word: לַגּוֹיִם
  choice: às nações
  rationale: A preposição לְ favorece “às”, e גּוֹיִם designa nações ou povos. A formulação evita a conotação posterior que “gentios” poderia introduzir.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A partícula chama urgentemente a atenção. “Vejam” é atual, direto e concorda com os imperativos plurais ao redor.
- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: proclamem a respeito de Jerusalém
  rationale: O hifil de שמע expressa fazer ouvir ou anunciar. Com עַל, “a respeito de Jerusalém” preserva a referência da proclamação sem antecipar além do necessário sua força hostil.
- source_word: נֹצְרִים
  choice: sentinelas
  rationale: O termo deriva de נצר, guardar ou vigiar, e literalmente aponta para os que vigiam. “Sentinelas” conserva essa imagem; o contexto permite entendê-las como forças hostis que cercam a cidade.
- source_word: בָּאִים
  choice: vêm
  rationale: O particípio apresenta a aproximação como ação em curso ou iminente. Em português, o presente “vêm” expressa isso de modo natural.
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: de uma terra distante
  rationale: A expressão indica distância geográfica e mantém a forma singular coletiva do hebraico.
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: e levantam a voz
  rationale: A expressão hebraica “dar a sua voz” significa bradar ou falar em alta voz. “Levantam a voz” preserva a imagem em português idiomático.
- source_word: עַל עָרֵי יְהוּדָה
  choice: contra as cidades de Judá
  rationale: No contexto de ameaça militar, עַל tem força adversativa; “contra” torna clara a hostilidade do brado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se o arcaísmo “eis” e preservou-se, por meio de nota, a ambiguidade contextual de נֹצְרִים.
