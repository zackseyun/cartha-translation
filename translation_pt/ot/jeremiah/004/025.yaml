id: JER.4.25
reference: Jeremiah 4:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָאִ֕יתִי וְ/הִנֵּ֖ה אֵ֣ין הָ/אָדָ֑ם וְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם נָדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: pt
  text: Olhei, e eis que não havia ninguém[a], e todas as aves do céu tinham fugido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia ser humano” ou “não havia homem algum”. O singular hebraico tem aqui sentido genérico, referindo-se à humanidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Olhei
  rationale: O qal perfeito na primeira pessoa do singular pode significar “vi” ou “olhei”. No refrão visionário do contexto, “olhei” comunica melhor o exame sucessivo da cena pelo profeta.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a função de הִנֵּה como marcador que chama a atenção para a cena, mantendo o tom profético de maneira corrente e digna em português.
- source_word: אֵין
  choice: não havia
  rationale: A negação existencial é situada no passado pela sequência visionária iniciada por “Olhei”.
- source_word: הָאָדָם
  choice: ninguém
  rationale: O singular com artigo tem sentido genérico e, neste contexto de desolação, indica ausência de seres humanos. “Ninguém” exprime isso naturalmente em português, sem sugerir apenas uma pessoa do sexo masculino; a forma mais literal é registrada em nota.
- source_word: וְכָל עוֹף הַשָּׁמַיִם
  choice: e todas as aves do céu
  rationale: “Aves do céu” é a expressão portuguesa natural para o coletivo עוֹף ligado a שָׁמַיִם, e כָּל indica a totalidade.
- source_word: נָדָדוּ
  choice: tinham fugido
  rationale: O verbo נדד denota afastar-se, fugir ou dispersar-se. O mais-que-perfeito evidencia que as aves já haviam partido quando o profeta observou a cena.
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: ninguém
  alternative: não havia ser humano / não havia homem algum
  rationale: O hebraico singular הָאָדָם representa genericamente a humanidade presente na terra, não especificamente um homem. “Ninguém” preserva a referência humana universal em português natural, enquanto a nota mantém visível a forma e a ambiguidade lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” conserva a vivacidade profética; “aves do céu” mantém uma expressão bíblica ainda natural. A ordem coordenada do hebraico foi preservada.
