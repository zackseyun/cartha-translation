- from: Vejam! Ele sobe como nuvens, e seus carros são como o vendaval; seus cavalos são mais velozes que as águias.[a] Ai de nós, pois fomos devastados!
  to: Eis que ele sobe como nuvens, e seus carros de guerra são como o turbilhão; seus cavalos são mais velozes que as águias.[a] Ai de nós, pois fomos devastados!
  rationale: A revisão elimina uma possível leitura anacrônica de «carros», aproxima a apresentação inicial da função de הִנֵּה e escolhe «turbilhão» para a força imagética de סוּפָה. Mantêm-se o plural de «nuvens», a comparação de velocidade, o lamento e a nota que registra a incerteza zoológica de נְשָׁרִים.
