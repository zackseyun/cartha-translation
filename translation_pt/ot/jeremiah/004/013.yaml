review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a progressão das imagens e o lamento final. Contudo, «carros» em português moderno normalmente sugere automóveis e não comunica de modo suficiente מַרְכְּבוֹתָיו, que no contexto designa carros de guerra. «Turbilhão» também representa com maior precisão a imagem tempestuosa e veloz de סוּפָה do que «vendaval».
  naturalness: O texto é fluente e mantém registro profético acessível. «Eis que» é uma abertura dêitica urgente, natural e mais diretamente correspondente a הִנֵּה do que o imperativo plural «Vejam!», que introduz interlocutores gramaticais não expressos no hebraico.
  terminology: «Carros de guerra» evita o anacronismo semântico de «carros» isolado. «Águias» é uma opção tradicional defensável para נְשָׁרִים, e a nota preserva corretamente a alternativa zoológica. «Ai de nós» e «fomos devastados» reproduzem bem o lamento e o passivo resultativo de שֻׁדָּדְנוּ.
  issues:
  - severity: medium
    issue: «seus carros» pode ser entendido como automóveis
    rationale: No português contemporâneo, «carros» sem qualificação designa predominantemente veículos modernos. O hebraico מַרְכְּבוֹתָיו se refere a carros de guerra; explicitar «de guerra» é necessário para transmitir o referente histórico, não uma expansão doutrinal.
  - severity: low
    issue: «Vejam!» torna a exclamação em imperativo plural
    rationale: הִנֵּה é uma partícula apresentativa, não um imperativo dirigido a um grupo. «Eis que» conserva sua força dêitica sem acrescentar número ou destinatários.
  - severity: low
    issue: «vendaval» é menos específico para סוּפָה
    rationale: Embora aceitável como tempestade violenta, «turbilhão» comunica mais diretamente a imagem de tempestade giratória/impetuosa presente no símile.
