  text: הִנֵּ֣ה כַּ/עֲנָנִ֣ים יַעֲלֶ֗ה וְ/כַ/סּוּפָה֙ מַרְכְּבוֹתָ֔י/ו קַלּ֥וּ מִ/נְּשָׁרִ֖ים סוּסָ֑י/ו א֥וֹי לָ֖/נוּ כִּ֥י שֻׁדָּֽדְנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: pt
  text: Eis que ele sobe como nuvens, e seus carros de guerra são como o turbilhão; seus cavalos são mais velozes que as águias.[a] Ai de nós, pois fomos devastados!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que os abutres”; o hebraico נְשָׁרִים pode designar de modo mais amplo grandes aves de rapina ou necrófagas, embora “águias” seja a tradução tradicional aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Introduz uma exclamação dêitica urgente. O plural inclusivo soa natural em português moderno e chama os ouvintes a contemplar a ameaça que se aproxima.
- source_word: כַּעֲנָנִים
  choice: como nuvens
  rationale: Mantém o plural e a comparação, evocando uma massa ameaçadora que avança.
- source_word: יַעֲלֶה
  choice: ele sobe
  rationale: Preserva o sentido direcional básico de עלה e a ambiguidade poética quanto ao movimento ascendente ou à aproximação do invasor.
- source_word: וְכַסּוּפָה
  choice: e ... como o vendaval
  rationale: סוּפָה designa uma tempestade violenta ou turbilhão. 'Vendaval' comunica força e rapidez em português corrente e digno.
- source_word: מַרְכְּבוֹתָיו
  choice: seus carros
  rationale: Tradução direta; o contexto militar torna desnecessário acrescentar 'de guerra'.
- source_word: קַלּוּ
  choice: são mais velozes
  rationale: No contexto, a ideia de leveza expressa rapidez; a forma comparativa explicita naturalmente a construção com מן.
- source_word: מִנְּשָׁרִים
  choice: que as águias
  rationale: נשר pode indicar águias ou grandes aves necrófagas. 'Águias' é a tradução tradicional e adequada à imagem de velocidade, enquanto a alternativa zoológica é registrada em nota.
- source_word: סוּסָיו
  choice: seus cavalos
  rationale: Reproduz diretamente o substantivo com sufixo possessivo.
- source_word: אוֹי לָנוּ
  choice: Ai de nós
  rationale: Conserva a força de lamento e o tom profético em português natural.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão do lamento.
- source_word: שֻׁדָּדְנוּ
  choice: fomos devastados
  rationale: O passivo de שׁדד comunica devastação violenta ou espoliação. 'Fomos devastados' preserva a força do resultado sem necessariamente implicar aniquilação total.
