  source_fidelity: O texto traduz adequadamente a construção enfática dirigida a Pasur, seguida do grupo de sua casa, e preserva a mudança para o singular em “Você chegará”. “Irão para o cativeiro” comunica corretamente a ideia de serem levados cativos. A repetição de “ali” reflete a repetição hebraica, e “todos os que o amam” conserva com precisão suficiente o sentido amplo de אֹהֲבֶיךָ. “A quem profetizou falsamente” reproduz a acusação sem atribuir uma intenção psicológica além do que o hebraico afirma.
  naturalness: O português é moderno, claro e de registro apropriado. “Você” e “moram” favorecem a legibilidade brasileira sem restringir indevidamente o texto a um regionalismo. A divisão em frases e o travessão tornam a sequência inteligível e conservam o tom solene.
  terminology: “Pasur”, “Babilônia”, “cativeiro”, “sepultado” e “profetizou falsamente” são escolhas consistentes, compreensíveis e adequadas ao registro bíblico. A nota apresenta de modo útil a alternativa “profetizou mentiras”, sem transformar uma possibilidade lexical em interpretação obrigatória.
