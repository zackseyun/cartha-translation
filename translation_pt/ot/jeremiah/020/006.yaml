source:
  edition: WLC
  text: וְ/אַתָּ֣ה פַשְׁח֗וּר וְ/כֹל֙ יֹשְׁבֵ֣י בֵיתֶ֔/ךָ תֵּלְכ֖וּ בַּ/שֶּׁ֑בִי וּ/בָבֶ֣ל תָּב֗וֹא וְ/שָׁ֤ם תָּמוּת֙ וְ/שָׁ֣ם תִּקָּבֵ֔ר אַתָּה֙ וְ/כָל אֹ֣הֲבֶ֔י/ךָ אֲשֶׁר נִבֵּ֥אתָ לָ/הֶ֖ם בַּ/שָּֽׁקֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: pt
  text: E você, Pasur, e todos os que moram em sua casa irão para o cativeiro. Você chegará à Babilônia; ali morrerá e ali será sepultado — você e todos os que o amam, a quem profetizou falsamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem profetizou mentiras”.'
    reason: Alternativa lexical para בַּשָּׁקֶר, que pode ser entendida adverbialmente (“falsamente”) ou como indicação do conteúdo falso (“mentiras”).
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: todos os que moram em sua casa
  rationale: A construção participial designa os que residem na casa de Pasur. A formulação é natural no português moderno e mantém o alcance doméstico do hebraico.
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: irão para o cativeiro
  rationale: A expressão indica serem levados como cativos. “Cativeiro” preserva melhor a ênfase de שְׁבִי do que o termo mais amplo “exílio”.
- source_word: וּבָבֶל תָּבוֹא
  choice: Você chegará à Babilônia
  rationale: O verbo בוא significa vir, chegar ou entrar. “Chegará à Babilônia” é natural em português e conserva o movimento até esse destino sem impor a perspectiva dêitica de “virá”.
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: ali morrerá e ali será sepultado
  rationale: A repetição de “ali” reproduz a ênfase hebraica no lugar em que se cumprirá o juízo.
- source_word: אֹהֲבֶיךָ
  choice: todos os que o amam
  rationale: O particípio expressa literalmente as pessoas que amam Pasur. Essa escolha preserva a direção da relação e permanece mais ampla do que “amigos”, sem a possível conotação romântica de “amantes”.
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: a quem profetizou falsamente
  rationale: A formulação comunica que a profecia era falsa sem afirmar além do texto qual teria sido a intenção subjetiva de Pasur. A alternativa mais concreta é registrada em nota.
theological_decisions:
- issue: Natureza da culpa de Pasur em sua atividade profética
  choice: a quem profetizou falsamente
  alternative: a quem profetizou mentiras
  rationale: A tradução condena a falsidade da profecia, mas não resolve indevidamente se a expressão enfatiza o caráter falso da atividade ou as mentiras como conteúdo pronunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por formas de boa legibilidade brasileira. “Você” explicita o singular dirigido a Pasur, enquanto o primeiro verbo no plural concorda com Pasur e todos os de sua casa. A pontuação mantém o encadeamento solene e a repetição enfática do hebraico.
