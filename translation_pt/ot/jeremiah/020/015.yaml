  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: pt
  text: 'Maldito seja o homem que levou a notícia ao meu pai, dizendo: “Nasceu um filho para você”[a], e o deixou muito alegre.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um filho, um varão”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico combina um infinitivo absoluto com um verbo finito da mesma raiz para intensificar o sentido: “deixando-o muito alegre” ou “alegrando-o grandemente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito seja
  rationale: O adjetivo predicativo tem força imprecatória; esta formulação preserva a denúncia enfática de Jeremias em português natural.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O substantivo definido singular aponta para o mensageiro específico mencionado no lamento.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente, em português, a oração relativa que identifica o homem.
- source_word: בִּשַּׂר
  choice: levou a notícia
  rationale: O verbo designa a comunicação de uma notícia, frequentemente boa. A escolha expressa o sentido contextual sem acrescentar conotação teológica à expressão.
- source_word: אֶת אָבִי
  choice: ao meu pai
  rationale: O objeto direto hebraico é vertido com a regência idiomática portuguesa da locução “levar a notícia a alguém”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: É a fórmula citativa habitual que introduz as palavras anunciadas.
- source_word: יֻלַּד לְךָ
  choice: Nasceu um filho para você
  rationale: A construção passiva com dativo anuncia um nascimento já ocorrido e relevante naquele momento; a formulação é clara e corrente em português moderno.
- source_word: בֵּן זָכָר
  choice: um filho
  rationale: A expressão hebraica explicita literalmente “um filho, um varão”. Em português, “filho” já indica o sexo masculino, e a explicitação literal é preservada em nota.
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: deixando-o muito alegre
  rationale: O infinitivo absoluto junto do verbo cognato intensifica a alegria. A tradução comunica essa ênfase de modo natural.
