  text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִ/סָּבִיב֒ הַגִּ֨ידוּ֙ וְ/נַגִּידֶ֔/נּוּ כֹּ֚ל אֱנ֣וֹשׁ שְׁלוֹמִ֔/י שֹׁמְרֵ֖י צַלְעִ֑/י אוּלַ֤י יְפֻתֶּה֙ וְ/נ֣וּכְלָה ל֔/וֹ וְ/נִקְחָ֥ה נִקְמָתֵ֖/נוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: pt
  text: 'Pois ouvi os sussurros de muitos: “Terror por todos os lados!” “Denunciem, e nós o denunciaremos!” Todos os meus amigos estão à espera de que eu tropece[a]: “Talvez ele se deixe enganar; então prevaleceremos contra ele e nos vingaremos dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “observam o meu manquejar” ou “observam o meu lado”. A expressão indica que estão atentos a uma fraqueza, a um passo em falso ou a uma queda.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת
  choice: murmurações
  rationale: O substantivo pode indicar rumor, comentário difamatório ou fala maliciosa. “Murmurações” preserva a atmosfera furtiva e hostil sem restringir o sentido a uma acusação formal.
- source_word: מָגוֹר מִסָּבִיב
  choice: Terror por todos os lados
  rationale: Expressão característica de Jeremias que comunica ameaça e pavor circundantes em português natural.
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: Denunciem-no, e nós o denunciaremos
  rationale: נגד significa dizer, declarar ou informar; neste contexto de conspiração, “denunciar” expressa adequadamente a força acusatória. O sufixo masculino no segundo verbo é representado por “-lo”, enquanto o primeiro imperativo recebe o mesmo objeto pelo paralelismo contextual.
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: Todos os que viviam em paz comigo
  rationale: Reproduz de modo claro o idiomatismo literal “todo homem da minha paz”, referindo-se aos que mantinham relações pacíficas ou amistosas com o profeta.
- source_word: שֹׁמְרֵי צַלְעִי
  choice: estão à espera de que eu tropece
  rationale: A expressão literalmente ligada ao lado, manquejar ou fraqueza descreve inimigos atentos a uma vulnerabilidade ou queda. A tradução comunica o sentido idiomático, e a imagem literal é preservada em nota.
- source_word: יְפֻתֶּה
  choice: se deixe enganar
  rationale: O verbo pode significar ser seduzido, persuadido ou enganado. A forma pronominal natural em português preserva a ideia de cair no ardil dos conspiradores.
- source_word: וְנּוּכְלָה לוֹ
  choice: então prevaleceremos contra ele
  rationale: יכל com ל neste contexto hostil expressa conseguir dominar ou prevalecer contra alguém.
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: e nos vingaremos dele
  rationale: Equivalente português natural do idiomatismo hebraico “tomaremos dele a nossa vingança”, mantendo o sentido retaliatório.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o discurso direto dos adversários e a tensão poética do lamento. “Denunciem-no” explicita no contexto o objeto implícito do primeiro imperativo e acompanha o sufixo masculino expresso no segundo verbo.
