id: JER.20.16
reference: Jeremiah 20:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: pt
  text: Que aquele homem seja como as cidades que Yahweh destruiu sem voltar atrás[b], e que ele ouça um grito de angústia pela manhã e um grito de guerra ao meio-dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um alarme” ou “um toque de trombeta” (hebraico teru‘ah).
    reason: lexical_alternative
  - marker: b
    text: A expressão provavelmente evoca as cidades que Yahweh destruiu em juízo, como Sodoma e Gomorra.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: Que ... seja
  rationale: No contexto de maldição, a forma verbal expressa desejo ou imprecação, não mera previsão; a construção portuguesa com subjuntivo preserva essa força.
- source_word: הָאִישׁ הַהוּא
  choice: aquele homem
  rationale: Mantém a especificidade, a distância marcada pelo demonstrativo e o masculino singular do hebraico.
- source_word: כֶּעָרִים
  choice: como as cidades
  rationale: O prefixo comparativo כ e a determinação fornecida pela oração relativa pedem naturalmente 'como as cidades'.
- source_word: אֲשֶׁר הָפַךְ יְהוָה
  choice: que Yahweh destruiu
  rationale: הפך descreve a destruição catastrófica de cidades sob juízo e provavelmente evoca Sodoma e Gomorra; 'destruiu' comunica isso com naturalidade em português, sem exigir a imagem física mais estreita de 'virou de cabeça para baixo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא נִחָם
  choice: sem voltar atrás
  rationale: Aqui נחם indica não desistir nem revogar o juízo anunciado. A expressão evita sugerir arrependimento moral da parte de Deus.
- source_word: וְשָׁמַע
  choice: e que ele ouça
  rationale: Dá continuidade à força imprecatória da oração inicial.
- source_word: זְעָקָה
  choice: um grito de angústia
  rationale: זעקה é um clamor provocado por aflição; o complemento explicita em português a natureza do grito sem restringi-lo indevidamente.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Forma temporal corrente e natural em português.
- source_word: וּתְרוּעָה
  choice: um grito de guerra
  rationale: תרועה pode designar clamor bélico, sinal de alarme ou toque de trombeta. O contexto de calamidade favorece 'grito de guerra', enquanto as alternativas ficam registradas em nota.
- source_word: בְּעֵת צָהֳרָיִם
  choice: ao meio-dia
  rationale: Expressa com naturalidade o momento indicado pela locução hebraica, sem perda significativa do destaque temporal.
theological_decisions:
- issue: Linguagem de juízo divino e possível mudança da parte de Deus
  choice: sem voltar atrás
  alternative: e não se arrependeu; sem ter compaixão
  rationale: A formulação comunica a irrevogabilidade do juízo no contexto, sem atribuir a Deus arrependimento moral nem eliminar o campo semântico de נחם.
- issue: Referência ao nome divino
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração preserva no texto o nome pessoal representado por יהוה, em conformidade com a camada de consulta fornecida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe com 'Que... seja' e 'que... ouça' conserva o tom de imprecação. Os marcadores aparecem junto às expressões a que se referem.
