  source_fidelity: 'A tradução preserva com precisão a estrutura e o sentido do hebraico: Yahweh é invocado como «dos Exércitos»; ele prova/examina «o justo» e vê «os rins e o coração»; Jeremias pede para ver a vingança divina contra os adversários e fundamenta o pedido no fato de ter exposto a sua causa a Deus. «Permite que eu veja» comunica adequadamente o valor volitivo da forma verbal hebraica no contexto de súplica.'
  naturalness: O português é moderno, claro e digno. «Mas tu, Yahweh dos Exércitos» introduz naturalmente o contraste contextual, e a sintaxe do restante do versículo é fluente para leitores brasileiros e internacionais.
  terminology: «Yahweh», «Exércitos», «o justo», «rins e coração», «vingança» e «causa» são escolhas consistentes com o texto-fonte e com o registro profético. A nota sobre os órgãos internos esclarece a imagem sem a substituir no texto principal; as alternativas para «causa» refletem bem o campo semântico de רִיב.
