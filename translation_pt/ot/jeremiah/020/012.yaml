id: JER.20.12
reference: Jeremiah 20:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: pt
  text: Mas tu, Yahweh dos Exércitos, que provas o justo e vês os rins e o coração[a], permite que eu veja a tua vingança contra eles, pois a ti revelei a minha causa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “os rins e o coração”, imagem que representa os pensamentos, as motivações e os afetos mais profundos.
    reason: cultural_note
  - marker: b
    text: Ou “a minha demanda” ou “a minha contenda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Mas tu, Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo concreto e inteligível. O pronome explicita a força do apelo direto no contexto.
- source_word: בֹּחֵן צַדִּיק
  choice: que provas o justo
  rationale: O particípio descreve a ação contínua de examinar ou pôr à prova; o singular substantivado é preservado como “o justo”.
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: e vês os rins e o coração
  rationale: Conserva a imagem antropológica concreta do hebraico, esclarecida em nota, sem reduzi-la a uma categoria psicológica moderna.
- source_word: אֶרְאֶה
  choice: permite que eu veja
  rationale: O imperfeito de primeira pessoa tem aqui valor volitivo no contexto da oração, expressando um pedido.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: a tua vingança contra eles
  rationale: Preserva a força judicial e retributiva de נְקָמָה; “contra eles” expressa naturalmente em português a relação indicada pela preposição.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: pois a ti revelei a minha causa
  rationale: כִּי introduz a razão do pedido; רִיבִי designa a causa, contenda ou demanda apresentada por Jeremias diante de Deus.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Imagem antropológica de כְלָיוֹת וָלֵב
  choice: os rins e o coração
  alternative: o íntimo e o coração; os pensamentos e sentimentos
  rationale: A tradução conserva a metáfora hebraica dos órgãos como centros da vida interior, deixando a explicação cultural para a nota.
- issue: Sentido volitivo de אֶרְאֶה
  choice: permite que eu veja
  alternative: verei; que eu veja
  rationale: No contexto do apelo dirigido a Deus, a forma é melhor entendida como desejo ou petição, embora a morfologia isolada também permita valor futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens centrais do hebraico foram preservadas, enquanto a sintaxe foi ajustada para soar natural em português.
