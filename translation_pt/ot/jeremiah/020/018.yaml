  text: לָ֤/מָּה זֶּה֙ מֵ/רֶ֣חֶם יָצָ֔אתִי לִ/רְא֥וֹת עָמָ֖ל וְ/יָג֑וֹן וַ/יִּכְל֥וּ בְּ/בֹ֖שֶׁת יָמָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: pt
  text: Por que saí do ventre para ver sofrimento e tristeza[a], e meus dias se consumiram em vergonha[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalho penoso e pesar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e para que meus dias terminassem em vergonha”.
    reason: syntactic_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Por que
  rationale: לָמָּה introduz a pergunta direta, enquanto זֶּה lhe acrescenta ênfase. Em português, o tom enfático da lamentação comunica essa força sem exigir uma expressão adicional pouco natural.
- source_word: מֵרֶחֶם
  choice: do ventre
  rationale: Reproduz a expressão hebraica sem acrescentar explicitamente “de minha mãe”, informação implícita no contexto.
- source_word: יָצָאתִי
  choice: saí
  rationale: Preserva a imagem concreta do verbo “sair”; junto de “do ventre”, a referência ao nascimento fica clara.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Mantém o sentido básico de ראה e permite que o sentido contextual de “experimentar” permaneça implícito.
- source_word: עָמָל
  choice: sofrimento
  rationale: עמל pode indicar trabalho penoso, aflição, desgraça ou sofrimento. Aqui, “sofrimento” é amplo, natural e adequado à lamentação, sem limitar o termo à ideia de labor.
- source_word: יָגוֹן
  choice: tristeza
  rationale: Expressa de modo claro e corrente a dor emocional indicada por יגון; “pesar” permanece uma alternativa possível.
- source_word: וַיִּכְלוּ
  choice: terminassem
  rationale: O verbo pode descrever os dias chegando ao fim ou sendo consumidos. O subjuntivo, ligado a “para que”, oferece uma construção portuguesa natural que conserva a leitura final adotada no texto principal.
- source_word: בְּבֹשֶׁת
  choice: em vergonha
  rationale: Equivalência próxima que preserva a imagem hebraica; “em desonra” também seria possível.
- source_word: יָמָי
  choice: os meus dias
  rationale: Mantém a expressão poética concreta do hebraico, em vez de substituí-la pela interpretação mais geral “minha vida”.
theological_decisions:
- issue: Relação sintática e aspecto da oração final וַיִּכְלוּ בְּבֹשֶׁת יָמָי
  choice: e para que os meus dias terminassem em vergonha
  alternative: e os meus dias se consumiram em vergonha
  rationale: A tradução principal entende a oração final como coordenada ao propósito introduzido por לִרְאוֹת, sob o alcance da pergunta “Por que...?”. Contudo, a forma verbal hebraica também admite uma oração narrativa/resultativa independente; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com a concisão e a intensidade retórica da lamentação. A formulação preserva as imagens concretas de sair do ventre, ver o sofrimento e contar a vida como “meus dias”.
