  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: pt
  text: porque ele não me matou desde o ventre[a], para que minha mãe fosse minha sepultura[b], e o ventre dela permanecesse para sempre grávido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que não me matou desde o ventre”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “minha mãe, minha sepultura”, metáfora condensada que retrata a mãe como sua sepultura caso Jeremias tivesse morrido no ventre.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “permanecesse eternamente grávido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: porque
  rationale: No contexto da maldição de Jeremias, a partícula relativa introduz a razão da queixa; a forma causal é natural em português.
- source_word: מוֹתְתַנִי
  choice: não me matou
  rationale: Preserva de modo direto a força causativa e transitiva do verbo com o sufixo de primeira pessoa.
- source_word: מֵרָחֶם
  choice: desde o ventre
  rationale: Conserva a ideia de origem expressa por מִן sem decidir explicitamente entre morte dentro do ventre e morte ao sair dele.
- source_word: אִמִּי קִבְרִי
  choice: minha mãe fosse minha sepultura
  rationale: Mantém a metáfora hebraica abrupta e impactante, sem acrescentar 'ventre' a esta oração.
- source_word: וְרַחְמָהּ
  choice: e o ventre dela
  rationale: O sentido anatômico é exigido pelo contexto de concepção, gravidez e nascimento.
- source_word: הֲרַת עוֹלָם
  choice: ficasse grávido para sempre
  rationale: Expressa um estado permanente e preserva a força perturbadora da lamentação; a concordância com 'ventre' é natural em português.
theological_decisions:
- issue: Sintaxe contrafactual da lamentação
  choice: para que minha mãe fosse minha sepultura
  alternative: e minha mãe se tornou minha sepultura
  rationale: O contexto apresenta o desejo irreal de Jeremias de ter morrido antes de nascer. A formulação com o subjuntivo comunica essa contrafactualidade sem acrescentar uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das notas foi regularizada para acompanhar sua ocorrência no texto; a metáfora compacta do hebraico e a tensão contrafactual foram preservadas.
