revisions:
- from: Mas Yahweh está comigo como um guerreiro poderoso e temível[a]; por isso, os que me perseguem[b] tropeçarão e não prevalecerão. Ficarão profundamente envergonhados, porque não terão êxito[c]. Sua desonra eterna não será esquecida.
  to: Mas Yahweh está comigo como um guerreiro poderoso e temível[a]; por isso, os que me perseguem[b] tropeçarão e não prevalecerão. Ficarão muito envergonhados, pois não agiram com sabedoria[c]. Sua vergonha perpétua não será esquecida.
  rationale: A revisão substitui “não terão êxito” por “não agiram com sabedoria”, leitura que corresponde mais diretamente a הִשְׂכִּילוּ e conserva a alternativa de compreensão em nota. “Muito envergonhados” traduz de modo simples e natural a intensificação de מְאֹד. “Vergonha perpétua” mantém a continuidade com בֹּשׁוּ e expressa עוֹלָם sem fixar uma leitura metafísica além do contexto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura geral é fiel: Yahweh está com Jeremias como guerreiro formidável; os perseguidores tropeçarão, não prevalecerão, sofrerão vergonha, e sua desonra duradoura não será esquecida. Contudo, “porque não terão êxito” não representa bem a função mais provável de הִשְׂכִּילוּ neste contexto, que se refere a agir com discernimento/sabedoria (ou, alternativamente, compreender), e introduz um futuro que não está expresso no hebraico.'
  naturalness: O português é claro, moderno e de registro adequadamente solene. “Guerreiro poderoso e temível”, “os que me perseguem” e “não prevalecerão” soam naturais. “Ficarão profundamente envergonhados” é aceitável, embora “ficarão muito envergonhados” seja um pouco mais idiomático e reflita diretamente o intensificador hebraico.
  terminology: “Yahweh” reproduz coerentemente o nome divino. “Desonra eterna” é possível para כְּלִמַּת עוֹלָם; “vergonha perpétua” preserva melhor a ligação lexical com a vergonha da oração precedente e evita atribuir a עוֹלָם um sentido metafísico mais específico do que o necessário.
  issues:
  - severity: medium
    issue: A cláusula “porque não terão êxito” para כִּי לֹא הִשְׂכִּילוּ é semanticamente estreita e temporalmente inadequada.
    rationale: 'O Hifil de שׂכל normalmente denota agir com prudência/entendimento ou mostrar discernimento. Embora possa haver uma conotação de prosperar em alguns contextos, “não terão êxito” desloca o foco para o resultado e usa futuro, enquanto a forma hebraica se entende melhor aqui como ação já caracterizada: “não agiram com sabedoria”. A alternativa “não compreenderam” deve permanecer em nota.'
