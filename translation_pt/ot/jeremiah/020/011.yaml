id: JER.20.11
reference: Jeremiah 20:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: pt
  text: Mas Yahweh está comigo como um guerreiro poderoso e temível[a]; por isso, os que me perseguem[b] tropeçarão e não prevalecerão. Ficarão muito envergonhados, pois não agiram com sabedoria[c]. Sua vergonha perpétua não será esquecida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um guerreiro poderoso, temível”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que vão no meu encalço”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pois não compreenderam” ou “pois não agiram com discernimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה אוֹתִי
  choice: Mas Yahweh está comigo
  rationale: O waw marca aqui uma virada adversativa após a lamentação. Na oração nominal, אוֹתִי exprime idiomaticamente a presença e o apoio de Yahweh junto ao profeta.
- source_word: כְגִבּוֹר עָרִיץ
  choice: como um guerreiro poderoso e temível
  rationale: גִּבּוֹר designa um guerreiro forte ou campeão, enquanto עָרִיץ acrescenta a ideia de alguém formidável, que inspira temor. A formulação preserva os dois elementos sem sugerir maldade moral.
- source_word: רֹדְפַי
  choice: os que me perseguem
  rationale: O particípio de רדף pode indicar tanto perseguidores hostis quanto pessoas que vão no encalço de alguém. A expressão verbal é natural em português e mantém essa amplitude.
- source_word: יִכָּשְׁלוּ וְלֹא יֻכָלוּ
  choice: tropeçarão e não prevalecerão
  rationale: “Tropeçarão” conserva a imagem de כשל; no contexto de confronto, יכל indica que os adversários não conseguirão vencer ou levar adiante seu propósito.
- source_word: בֹּשׁוּ מְאֹד
  choice: Ficarão profundamente envergonhados
  rationale: בושׁ exprime vergonha ou humilhação, e מְאֹד intensifica a afirmação. O futuro em português harmoniza a forma perfeita com o resultado certo anunciado no contexto.
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: porque não terão êxito
  rationale: O Hifil de שׂכל pode significar agir com discernimento ou alcançar bom resultado. Neste contexto, a ligação com a derrota dos perseguidores favorece “não terão êxito”, mantendo a alternativa em nota.
- source_word: כְּלִמַּת עוֹלָם לֹא תִשָּׁכֵחַ
  choice: Sua desonra eterna não será esquecida
  rationale: כְּלִמָּה denota desonra ou humilhação; עוֹלָם indica duração permanente ou indefinidamente longa. A forma passiva preserva diretamente לֹא תִשָּׁכֵחַ.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o Tetragrama, nome pactual de Deus. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Duração expressa por עוֹלָם
  choice: eterna
  alternative: perpétua / duradoura
  rationale: “Eterna” comunica a força da expressão neste anúncio de desonra que não será esquecida, sem definir além do texto a natureza metafísica dessa duração.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Temível” conserva a força marcial sem a conotação moral negativa que “terrível” poderia adquirir; “desonra” evita repetição excessiva de “vergonha” e corresponde bem ao substantivo final.
