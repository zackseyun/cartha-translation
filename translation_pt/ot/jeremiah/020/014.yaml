base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
translation:
  language: pt
  text: Maldito seja o dia em que nasci; o dia em que minha mãe me deu à luz não seja abençoado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito seja
  rationale: O adjetivo passivo de ארר tem aqui força imprecatória. “Maldito seja” preserva a intensidade da lamentação e soa natural em português.
- source_word: הַיּוֹם אֲשֶׁר יֻלַּדְתִּי בּוֹ
  choice: o dia em que nasci
  rationale: A formulação reúne naturalmente em português o antecedente temporal, a partícula relativa, o passivo de ילד e בּוֹ, evitando o literalismo “no qual” sem perda de sentido.
- source_word: יוֹם אֲשֶׁר יְלָדַתְנִי אִמִּי
  choice: o dia em que minha mãe me deu à luz
  rationale: “Deu à luz” traduz de modo corrente e digno a forma ativa de ילד, preservando a referência concreta à mãe e o paralelismo com “nasci”.
- source_word: אַל יְהִי בָרוּךְ
  choice: não seja abençoado
  rationale: A forma negativa volitiva expressa um desejo ou imprecação. Em português, “não seja abençoado” conserva essa força e o contraste retórico entre maldição e bênção.
