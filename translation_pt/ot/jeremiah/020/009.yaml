  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: pt
  text: 'Se eu disser[a]: “Não farei menção dele, nem falarei mais em seu nome”[b], então isso é, em meu coração, como fogo ardente, encerrado em meus ossos. Estou exausto de contê-lo[c], mas não consigo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “E eu disse”. No contexto, a forma pode introduzir uma resolução considerada ou repetida. “Não farei menção dele” também pode ser entendido como “Não me lembrarei dele”; porém, “fazer menção” se ajusta melhor ao paralelismo com falar.
    reason: alternative_reading
  - marker: b
    text: Isto é, falar como representante dele ou sob sua autoridade.
    reason: cultural_note
  - marker: c
    text: O hebraico não declara expressamente o que Jeremias procura conter; provavelmente é a mensagem do SENHOR ou a compulsão de proclamá-la.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: Se eu disser
  rationale: Embora a forma seja literalmente “e eu disse”, o contexto apresenta uma resolução considerada ou repetida; a formulação condicional comunica naturalmente essa deliberação.
- source_word: אֶזְכְּרֶנּוּ
  choice: Não farei menção dele
  rationale: זכר pode significar “lembrar” ou “mencionar”. O sentido ligado à fala se ajusta melhor ao paralelismo com “nem falarei mais em seu nome”, sem apagar a alternativa lexical.
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: nem falarei mais em seu nome
  rationale: Preserva o idioma profético de falar como representante de alguém ou sob sua autoridade.
- source_word: וְהָיָה בְלִבִּי
  choice: então isso se torna em meu coração
  rationale: O verbo masculino singular remete a algo não nomeado explicitamente, provavelmente a mensagem ou a compulsão de proclamá-la. “Isso” preserva essa referência implícita.
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: como fogo ardente
  rationale: Mantém a imagem concreta e intensa do substantivo acompanhado do particípio.
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: contido em meus ossos
  rationale: עצר expressa algo retido ou confinado; “contido” conserva a imagem corporal sem soar artificial em português.
- source_word: וְנִלְאֵיתִי כַּלְכֵל
  choice: Fico exausto de tentar contê-lo
  rationale: Expressa tanto o esgotamento quanto o esforço contínuo e frustrado de reprimir aquilo que arde no interior.
- source_word: וְלֹא אוּכָל
  choice: mas não consigo
  rationale: A adversativa torna explícito o contraste natural em português; o objeto permanece implícito, como no hebraico.
theological_decisions:
- issue: Referente dos pronomes de terceira pessoa
  choice: Manter “dele” e “seu”, sem substituir por “SENHOR” no texto principal.
  alternative: Explicitar “do SENHOR” e “em nome do SENHOR”.
  rationale: O contexto identifica o referente, mas o hebraico emprega pronomes. Preservá-los evita inserir um nome ausente desta frase.
- issue: Referente do fogo interior e do objeto de conter
  choice: Usar “isso” e depois o pronome “-lo”, sem identificar expressamente “a palavra do SENHOR”.
  alternative: Traduzir “sua palavra se torna em meu coração como fogo ardente”.
  rationale: O hebraico deixa implícito o referente; o contexto sugere a mensagem divina ou a compulsão de anunciá-la. A tradução mantém essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a intensidade corporal da imagem e evita explicitar referentes que o hebraico deixa implícitos. Todos os marcadores de nota aparecem no texto principal.
