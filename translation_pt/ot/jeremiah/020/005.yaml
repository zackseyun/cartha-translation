source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: pt
  text: E entregarei toda a riqueza desta cidade, todo o fruto do seu trabalho[a], todas as suas preciosidades[b] e todos os tesouros dos reis de Judá nas mãos dos seus inimigos.[c] Eles os saquearão, os tomarão e os levarão para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o seu trabalho” ou “tudo o que ela produziu”. O termo hebraico pode indicar tanto o trabalho quanto o que ele produz.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas as suas coisas valiosas”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “na mão de”; expressão hebraica que significa entregar ao poder ou controle de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  choice: riqueza
  rationale: No contexto de bens que serão saqueados e levados, o substantivo indica recursos materiais ou riqueza, não força abstrata.
- source_word: יְגִיעָהּ
  choice: o fruto do seu trabalho
  rationale: O termo pode designar tanto o trabalho árduo quanto aquilo que ele produz. Como se trata de bens confiscáveis, a formulação destaca o resultado do trabalho sem ocultar a alternativa lexical, registrada em nota.
- source_word: יְקָרָהּ
  choice: suas preciosidades
  rationale: Em uma lista de bens materiais, o sentido concreto de coisas valiosas é o mais provável. “Preciosidades” é natural e mantém a noção de alto valor.
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: os tesouros dos reis de Judá
  rationale: Embora אוֹצָר também possa designar depósitos ou tesourarias, o contexto enfatiza os bens que serão tomados e transportados.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: A expressão hebraica é um idioma de entrega ao poder ou controle de alguém. O plural “nas mãos de” é a forma idiomática natural em português.
- source_word: אֹיְבֵיהֶם
  choice: seus inimigos
  rationale: O sufixo plural pode retomar mais imediatamente os reis de Judá, embora esses inimigos também sejam os da cidade e do povo. “Seus” preserva a referência pronominal sem decidir além do texto.
- source_word: וּבְזָזוּם
  choice: eles os saquearão
  rationale: בזז descreve o ato de saquear ou tomar como despojo em contexto militar.
- source_word: וּלְקָחוּם
  choice: os tomarão
  rationale: Tradução direta de לקח; mantém a sequência verbal sem antecipar o transporte expresso pelo verbo seguinte.
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: os levarão para a Babilônia
  rationale: A forma verbal e a terminação direcional indicam que os bens serão conduzidos até a Babilônia. Em português, “levarão” corresponde naturalmente à perspectiva do enunciado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “todos/todas” preserva a ênfase acumulativa do hebraico. “Seus inimigos” mantém a ambiguidade do antecedente pronominal, e a sequência “saquearão, tomarão e levarão” reproduz os três movimentos verbais do original.
