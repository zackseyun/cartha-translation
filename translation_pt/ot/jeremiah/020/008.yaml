  text: כִּֽי מִ/דֵּ֤י אֲדַבֵּר֙ אֶזְעָ֔ק חָמָ֥ס וָ/שֹׁ֖ד אֶקְרָ֑א כִּֽי הָיָ֨ה דְבַר יְהוָ֥ה לִ֛/י לְ/חֶרְפָּ֥ה וּ/לְ/קֶ֖לֶס כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: pt
  text: 'Pois sempre que falo[a], clamo e proclamo: “Violência e destruição!” Pois a palavra de Yahweh tornou-se para mim motivo de afronta e de zombaria o dia inteiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as vezes que falo”.'
    reason: Alternativa lexical que explicita o valor iterativo de מִדֵּי.
lexical_decisions:
- source_word: מִדֵּי
  choice: sempre que
  rationale: A construção idiomática com o imperfeito indica ocorrência repetida; “sempre que” comunica naturalmente esse valor iterativo.
- source_word: אֲדַבֵּר
  choice: falo
  rationale: O presente habitual em português se ajusta ao sentido iterativo de “sempre que falo”.
- source_word: אֶזְעָק
  choice: clamo
  rationale: “Clamo” preserva a intensidade de um grito público sem exigir uma formulação mais extensa.
- source_word: חָמָס
  choice: violência
  rationale: O termo designa violência ou injustiça violenta e tem aqui seu sentido profético habitual.
- source_word: שֹׁד
  choice: destruição
  rationale: No contexto da denúncia profética, indica devastação destrutiva; “destruição” mantém a amplitude do termo.
- source_word: אֶקְרָא
  choice: proclamo
  rationale: O verbo introduz o conteúdo anunciado em voz alta; “proclamo” distingue essa ação do clamor precedente.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a expressão profética tradicional e preserva o nome divino presente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְחֶרְפָּה
  choice: motivo de afronta
  rationale: A formulação exprime que, por causa da palavra recebida, Jeremias fica exposto à desonra e aos insultos.
- source_word: קֶלֶס
  choice: zombaria
  rationale: “Zombaria” é atual e inteligível, preservando a ideia de escárnio público.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: É uma expressão natural em português para a duração contínua indicada pelo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Referente de “afronta e zombaria”
  choice: A palavra de Yahweh tornou-se para Jeremias motivo de afronta e zombaria
  alternative: A própria palavra de Yahweh é diretamente afrontada e ridicularizada
  rationale: A construção hebraica admite tensão entre o mensageiro sofrer por causa da palavra e a mensagem ser alvo de escárnio. “Para mim motivo de” conserva a relação com Jeremias sem excluir que a palavra seja o objeto do desprezo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Pois” preserva a estrutura causal do hebraico; o paralelismo entre “clamo” e “proclamo” mantém a força retórica sem redundância excessiva.
