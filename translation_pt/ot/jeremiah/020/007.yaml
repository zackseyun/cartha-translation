  text: פִּתִּיתַ֤/נִי יְהוָה֙ וָֽ/אֶפָּ֔ת חֲזַקְתַּ֖/נִי וַ/תּוּכָ֑ל הָיִ֤יתִי לִ/שְׂחוֹק֙ כָּל הַ/יּ֔וֹם כֻּלֹּ֖/ה לֹעֵ֥ג לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: pt
  text: Tu me persuadiste[a], Yahweh, e fui persuadido; foste mais forte do que eu e prevaleceste. Tornei-me motivo de riso o dia inteiro; todos zombam de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu me enganaste, Yahweh, e fui enganado.” O verbo hebraico pode significar seduzir, persuadir ou enganar; o lamento de Jeremias é intencionalmente contundente.'
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: Tu me persuadiste
  rationale: O verbo פתה pode significar seduzir, persuadir ou enganar. “Persuadiste” mantém a amplitude sem eliminar da nota a acusação mais contundente possível no lamento.
- source_word: וָאֶפָּת
  choice: e eu me deixei persuadir
  rationale: A forma admite valor passivo ou reflexivo. Esta formulação portuguesa preserva a correspondência com o verbo anterior e sugere que Jeremias cedeu à persuasão, sem excluir a leitura mais dura registrada na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: חֲזַקְתַּנִי
  choice: foste mais forte do que eu
  rationale: חזק expressa aqui força superior exercida sobre Jeremias. A formulação é natural em português e mantém a relação pessoal de forças presente no hebraico.
- source_word: וַתּוּכָל
  choice: e prevaleceste
  rationale: יכל indica que Yahweh teve êxito ou venceu; “prevaleceste” conserva o tom elevado e a sequência com a ideia de força.
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: Tornei-me motivo de riso
  rationale: A expressão descreve Jeremias como objeto de escárnio público; “motivo de riso” é claro, corrente e digno.
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: o dia inteiro
  rationale: Reproduz de modo idiomático a expressão hebraica intensificada de duração contínua.
- source_word: לֹעֵג לִי
  choice: todos zombam de mim
  rationale: 'Embora o particípio seja formalmente singular, o contexto totalizante favorece o sentido distributivo: cada um, isto é, todos, zombam do profeta.'
theological_decisions:
- issue: Se פתה deve ser traduzido no texto principal como uma acusação de engano divino
  choice: Usar “persuadiste” no texto principal e preservar “enganaste” em nota
  alternative: Tu me enganaste, Yahweh, e eu fui enganado
  rationale: O lamento emprega linguagem deliberadamente forte, e o verbo hebraico permite tanto persuadir ou seduzir quanto enganar. O texto principal mantém a ambiguidade sem enfraquecer a leitura acusatória, que aparece explicitamente na nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega-se “tu” em concordância verbal regular para conservar o discurso direto, solene e intensamente pessoal dirigido a Yahweh.
