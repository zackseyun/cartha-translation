  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: pt
  text: Pasur, filho de Imer, o sacerdote, ouviu Jeremias profetizar estas palavras. Ele era o principal responsável na casa de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo de Yahweh”; literalmente, “na casa de Yahweh”.
    reason: A expressão hebraica usa literalmente “casa”, mas neste contexto se refere ao templo.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע indica que Pasur ouviu a atividade profética de Jeremias; “ouviu” evita sugerir a atenção deliberada que “escutou atentamente” poderia implicar. O waw narrativo é representado pela sequência da frase, sem acrescentar um marcador como “Então”.
- source_word: פַּשְׁחוּר בֶּן אִמֵּר
  choice: Pasur, filho de Imer
  rationale: Os nomes são transliterados em formas claras e correntes em português, e a relação patronímica é preservada literalmente.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O substantivo tem artigo definido. A aposição hebraica pode ser relacionada a Imer ou, por extensão, à identificação de Pasur; a formulação portuguesa preserva essa possível ambiguidade sem a resolver por paráfrase.
- source_word: וְהוּא פָקִיד נָגִיד
  choice: que era o principal responsável
  rationale: Os dois termos administrativos combinam as ideias de incumbência, supervisão e posição principal. A expressão escolhida comunica a função de liderança em português natural sem transformar necessariamente o cargo em um título técnico.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: “Casa” preserva a imagem lexical de בַּיִת, embora no contexto designe o templo. O nome divino é mantido como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração conserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִבָּא
  choice: profetizar
  rationale: Depois de “ouviu”, o infinitivo português apresenta Jeremias no ato de proferir discurso profético e corresponde naturalmente ao particípio hebraico.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: Neste contexto de fala profética, דְּבָרִים se refere naturalmente às palavras que Jeremias acabara de proclamar.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o preserva de modo transliterado, sem substituí-lo por um título.
- issue: Identidade do sacerdote na aposição הַכֹּהֵן
  choice: Manter a construção “Imer, o sacerdote” sem paráfrase explicativa
  alternative: “Pasur, o sacerdote, filho de Imer” ou “Pasur, filho do sacerdote Imer”
  rationale: A aposição hebraica permite discussão sobre a quem o título se liga. A tradução conserva a estrutura e evita decidir silenciosamente uma identificação que o texto não explicita de maneira inequívoca.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa direta. “Principal responsável” evita burocratismo excessivo; “casa de Yahweh” preserva a expressão concreta do hebraico, esclarecida em nota.
