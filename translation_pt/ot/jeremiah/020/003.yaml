base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: pt
  text: 'No dia seguinte, quando Pasur tirou Jeremias do tronco, Jeremias lhe disse: “Yahweh não lhe deu o nome de Pasur, mas de Terror por Todos os Lados[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Magor-Missabib, expressão que significa “terror por todos os lados” ou “terror ao redor”.'
    reason: Registra a forma hebraica do nome profético e uma alternativa lexical legítima.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa com naturalidade a sequência temporal indicada pelo hebraico.
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: quando Pasur tirou Jeremias do tronco
  rationale: O hifil de יצא tem sentido causativo, isto é, fazer sair ou tirar. “Tronco” é o termo corrente em português para o instrumento de contenção e punição referido por מַהְפָּכֶת.
- source_word: הַמַּהְפָּכֶת
  choice: o tronco
  rationale: Designa um dispositivo que prendia e possivelmente forçava o corpo do detido a uma posição penosa; “tronco” oferece um equivalente português claro sem alegar identidade exata de construção.
- source_word: קָרָא ... שְׁמֶךָ
  choice: não chamou você de
  rationale: Reproduz de modo natural em português a fórmula hebraica de nomeação e mantém o contraste entre o nome Pasur e o novo nome anunciado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי אִם
  choice: mas de
  rationale: 'Após a negação, introduz de maneira concisa o contraste corretivo: não X, mas Y.'
- source_word: מָגוֹר מִסָּבִיב
  choice: Terror por Todos os Lados
  rationale: Preserva o sentido de terror circundante e, com iniciais maiúsculas, sinaliza que a expressão funciona como novo nome profético.
- source_word: פַשְׁחוּר
  choice: Pasur
  rationale: Forma portuguesa estabelecida e legível para o nome pessoal hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva seu caráter de nome pessoal, sem substituí-lo por um título.
- issue: Função de מָגוֹר מִסָּבִיב
  choice: 'Tratado como nome profético: “Terror por Todos os Lados”'
  alternative: 'Tratado apenas como descrição: “terror por todos os lados”'
  rationale: A construção “não chamou você de... mas de...” apresenta a expressão como renomeação profética, sem eliminar seu sentido descritivo ameaçador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, e o marcador da nota foi colocado junto à expressão que ela explica.
