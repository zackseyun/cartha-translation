  source_fidelity: 'A tradução preserva os participantes, a ação de ferir, o título de Jeremias, o instrumento punitivo e a designação divina. Contudo, “junto ao Portão” enfraquece a localização expressa pelo hebraico: o tronco estava no portão, não meramente nas proximidades dele. A oração relativa final também deve permanecer claramente ligada ao portão.'
  naturalness: O português é atual e claro. “Tronco” é uma designação idiomática e suficientemente ampla para o aparelho de contenção, cuja forma exata é incerta. “Estava no Portão Superior de Benjamim” é natural e mais fiel do que “ficava junto ao”.
  terminology: “Pasur”, “o profeta Jeremias”, “tronco”, “Portão Superior de Benjamim” e “Casa de Yahweh” são escolhas adequadas. A nota deve evitar apresentar “instrumento de tortura” como alternativa lexical definida; é mais preciso indicar um possível cavalete ou outro aparelho doloroso de contenção.
