  - severity: low
    issue: Ligação da oração relativa final
    rationale: A redação revista explicita que “que ficava na Casa de Yahweh” se refere ao portão, conforme o hebraico.
  - severity: low
    issue: 'Nota lexical: “instrumento de tortura”'
    rationale: A expressão é excessivamente genérica como alternativa direta. A incerteza diz respeito ao tipo de aparelho de contenção dolorosa; “cavalete” comunica melhor a alternativa sem definir demais o termo.
