  text: וַ/יַּכֶּ֣ה פַשְׁח֔וּר אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יִּתֵּ֨ן אֹת֜/וֹ עַל הַ/מַּהְפֶּ֗כֶת אֲשֶׁ֨ר בְּ/שַׁ֤עַר בִּנְיָמִן֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: pt
  text: Então Pasur feriu o profeta Jeremias e o pôs no tronco[a] que estava no Portão Superior de Benjamim, que ficava na Casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “cavalete” ou outro aparelho doloroso de contenção; não se conhece ao certo a forma da מַהְפֶּכֶת.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: feriu
  rationale: O verbo נכה significa golpear ou ferir. “Feriu” é natural em português e não determina se houve um único golpe ou um espancamento prolongado.
- source_word: פַשְׁחוּר
  choice: Pasur
  rationale: Forma portuguesa tradicional e legível do nome hebraico.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém explicitamente o título presente no hebraico, em ordem natural no português.
- source_word: וַיִּתֵּן אֹתוֹ עַל
  choice: e o pôs no
  rationale: Neste contexto, a construção indica que Jeremias foi colocado em um instrumento de contenção; “pôs no” expressa isso de modo idiomático.
- source_word: הַמַּהְפֶּכֶת
  choice: tronco
  rationale: “Tronco” é um termo português reconhecível para um instrumento punitivo de imobilização. Como a forma exata do aparelho é incerta, a nota preserva outras possibilidades.
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: Portão Superior de Benjamim
  rationale: Trata a expressão como o nome de um portão e conserva o adjetivo “superior”.
- source_word: בְּבֵית יְהוָה
  choice: na Casa de Yahweh
  rationale: Preserva a expressão hebraica “Casa de Yahweh”; neste contexto, ela designa o complexo do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Yahweh” mantém a imagem hebraica, enquanto a construção da frase esclarece naturalmente a localização.
