source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Eis que farei de você um terror[a] para você mesmo e para todos os que o amam[b]. Eles cairão pela espada de seus inimigos diante dos seus próprios olhos. Entregarei todo o Judá nas mãos do rei da Babilônia, que os deportará para a Babilônia[c] e os ferirá à espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo hebraico magor significa “pavor” ou “terror” e retoma o nome dado a Pasur no contexto: “Terror por Todos os Lados”.'
    reason: cross_reference
  - marker: b
    text: 'Ou: “todos os seus amigos”. O hebraico diz literalmente “todos os que amam você” e pode incluir pessoas próximas e aliados.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os levará para o exílio na Babilônia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִנְנִי נֹתֶנְךָ
  choice: Eis que estou fazendo de você
  rationale: “Eis que” mantém a força solene da fórmula profética, enquanto o presente progressivo comunica a ação iminente do particípio; “fazer de” expressa naturalmente a construção idiomática com נתן.
- source_word: לְמָגוֹר לְךָ
  choice: motivo de pavor para você mesmo
  rationale: מָגוֹר denota pavor ou terror. “Motivo de pavor” soa natural em português e deixa claro que Pasur se tornará aterrorizante até para si próprio.
- source_word: אֹהֲבֶיךָ
  choice: todos os que o amam
  rationale: Traduz diretamente o particípio de אהב sem restringir indevidamente o grupo a amigos, familiares ou aliados.
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: Eles cairão pela espada de seus inimigos
  rationale: Conserva a imagem hebraica de cair pela espada e seu sentido de morte violenta.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: diante dos seus próprios olhos
  rationale: Expressa de modo idiomático a ênfase de que Pasur testemunhará pessoalmente a morte deles.
- source_word: אֶתֵּן בְּיַד
  choice: Entregarei ... nas mãos de
  rationale: Mantém a metáfora hebraica de ser entregue ao poder e controle de outra pessoa, em formulação corrente em português.
- source_word: וְהִגְלָם בָּבֶלָה
  choice: os levará para o exílio na Babilônia
  rationale: O hifil de גלה indica remoção forçada para o exílio; a formulação explicita esse sentido sem reduzir o verbo a mero deslocamento.
- source_word: וְהִכָּם בֶּחָרֶב
  choice: os ferirá à espada
  rationale: Mantém a amplitude de נכה, “golpear/ferir”, sem tornar explícita a morte de todos, algo que o verbo isoladamente não exige.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová; Iavé
  rationale: O texto hebraico apresenta o nome próprio divino. A transliteração “Yahweh” o preserva, em vez de substituí-lo por um título.
- issue: Relação de לְמָגוֹר com o novo nome dado a Pasur
  choice: motivo de pavor para você mesmo
  alternative: terror por todos os lados
  rationale: A sintaxe deste versículo especifica pavor para o próprio Pasur e para os que o amam. A alusão contextual a “Terror por Todos os Lados” é registrada em nota, sem substituir a formulação própria deste versículo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantiveram-se imagens hebraicas compreensíveis, como “cair pela espada”, “nas mãos” e “à espada”, enquanto construções menos naturais foram vertidas idiomaticamente.
