  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: pt
  text: Cantem a Yahweh[a]; louvem Yahweh, pois ele livrou a vida[b] do pobre da mão dos malfeitores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Hebraico “a alma do pobre”; aqui, “vida” expressa a vida ou o próprio ser da pessoa em perigo.
    reason: lexical_alternative
  - marker: c
    text: Ou “do poder dos malfeitores”; literalmente, “da mão dos malfeitores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” reproduz de modo direto a convocação poética, sem acrescentar “louvores”, ideia já expressa pelo imperativo seguinte.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica aquele a quem se dirige o cântico; em português, “cantar a Yahweh” é claro e natural.
- source_word: הַלְלוּ
  choice: louvem
  rationale: Imperativo plural intensivo de הלל em contexto de adoração; “louvem” é o equivalente corrente e conciso.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para os dois imperativos. “Pois” mantém o vínculo causal e o tom poético.
- source_word: הִצִּיל
  choice: livrou
  rationale: O hifil perfeito de נצל descreve uma ação de resgate concluída. O pretérito perfeito português comunica isso naturalmente.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto de livramento de agressores, נֶפֶשׁ designa a vida ou o próprio ser da pessoa ameaçada, sem exigir o sentido técnico de uma alma imaterial.
- source_word: אֶבְיוֹן
  choice: pobre
  rationale: O substantivo se refere a alguém pobre ou necessitado. “Pobre” é direto, comum e preserva o singular representativo do hebraico.
- source_word: מִיַּד
  choice: da mão de
  rationale: Mantém a imagem hebraica de estar sob a mão, isto é, sob o poder ou domínio de alguém.
- source_word: מְרֵעִים
  choice: malfeitores
  rationale: O particípio substantivado designa pessoas que praticam o mal. “Malfeitores” é conciso e apropriado ao registro profético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio sem substituir o nome por um título.
- issue: Sentido de נֶפֶשׁ no contexto de livramento
  choice: vida
  alternative: alma; pessoa
  rationale: O foco é o resgate de uma pessoa ameaçada por agentes humanos. “Vida” comunica esse sentido contextual sem resolver o termo como uma afirmação antropológica técnica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo imperativo preservado. “Da mão” conserva a metáfora hebraica, enquanto as notas esclarecem seu sentido idiomático. A repetição de “Yahweh” reproduz a ênfase do original.
