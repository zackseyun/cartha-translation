    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que tiver se vendido a você”. Neste contexto jurídico, a forma hebraica pode ser entendida em sentido passivo ou reflexivo.'
    reason: lexical_alternative
  revision_rationale: A revisão restitui o sentido de מֵעִמָּךְ por «livre de seu serviço», formulação contextual e idiomática para a libertação da condição de serviço, e corrige a concordância e a coerência do singular distributivo. As notas preservam a ambiguidade passiva/reflexiva do Nifal e a alternativa temporal, sem resolver disputas além do que o hebraico permite.
