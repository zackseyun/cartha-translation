source:
  edition: WLC
  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: pt
  text: Ao fim de sete anos[a], cada um de vocês deverá libertar seu irmão hebreu[b] que lhe tiver sido vendido[c] e o tiver servido durante seis anos; deverá deixá-lo partir livre de seu serviço. Mas os seus antepassados não me ouviram nem inclinaram os ouvidos para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de sete anos”. A expressão hebraica pode indicar a conclusão de um período de sete anos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu compatriota hebreu” ou “seu parente hebreu”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que tiver se vendido a você”. Neste contexto jurídico, a forma hebraica pode ser entendida em sentido passivo ou reflexivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: Ao fim de sete anos
  rationale: Preserva o marco temporal da expressão hebraica sem definir além do texto os pormenores do calendário.
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: cada um de vocês libertará
  rationale: אִישׁ distribui a obrigação entre os destinatários; neste contexto jurídico, 'libertará' comunica naturalmente o sentido de שׁלח.
- source_word: אָחִיו הָעִבְרִי
  choice: seu irmão hebreu
  rationale: Mantém tanto a forma masculina singular quanto a linguagem familiar e pactual do hebraico.
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: que tiver sido vendido a vocês
  rationale: Representa de modo direto o Nifal, preservando em nota a possível leitura reflexiva própria do contexto jurídico.
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: e os tiver servido durante seis anos
  rationale: Expressa o serviço completado antes da libertação e reproduz a alternância hebraica entre o coletivo e o singular distributivo de modo inteligível em português.
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: vocês o deixarão partir livre
  rationale: Comunica o ato e o resultado jurídico da soltura em português natural; 'livre' preserva חָפְשִׁי sem acrescentar uma categoria social não explicitada.
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי
  choice: Mas os seus antepassados não me ouviram
  rationale: '''Ouviram'' preserva a metáfora auditiva e sua implicação de obediência; ''antepassados'' é atual e evita limitar אבות aos pais imediatos.'
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  choice: nem inclinaram os ouvidos para mim
  rationale: Mantém a imagem hebraica da atenção deliberada em formulação compreensível e digna.
theological_decisions:
- issue: Linguagem de parentesco pactual no masculino singular
  choice: seu irmão hebreu
  alternative: seu compatriota hebreu / seu parente hebreu
  rationale: A opção mantém a retórica familiar e a forma jurídica masculina do texto, sem neutralizá-las nem restringir necessariamente אָח a irmão biológico.
- issue: Venda e serviço por dívida
  choice: tiver sido vendido ... tiver servido
  alternative: tiver se vendido ... tiver trabalhado
  rationale: A redação preserva a condição jurídica de serviço mediante venda sem importar para o versículo categorias posteriores de escravidão; a ambiguidade passiva/reflexiva é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural 'vocês' torna explícitos os destinatários coletivos, enquanto 'cada um' preserva a distribuição individual da obrigação. A repetição literal de שׁלח foi levemente variada ('libertará' / 'deixarão partir') para evitar rigidez pouco natural, conservando o sentido jurídico. Todos os marcadores de nota aparecem no texto.
