revisions:
- from: Ao fim de sete anos[a], cada um de vocês libertará seu irmão hebreu[b] que tiver sido vendido a vocês[c] e os tiver servido durante seis anos; vocês o deixarão partir livre. Mas os seus antepassados não me ouviram nem inclinaram os ouvidos para mim.
  to: Ao fim de sete anos[a], cada um de vocês deverá libertar seu irmão hebreu[b] que lhe tiver sido vendido[c] e o tiver servido durante seis anos; deverá deixá-lo partir livre de seu serviço. Mas os seus antepassados não me ouviram nem inclinaram os ouvidos para mim.
  rationale: A revisão restitui o sentido de מֵעִמָּךְ por «livre de seu serviço», formulação contextual e idiomática para a libertação da condição de serviço, e corrige a concordância e a coerência do singular distributivo. As notas preservam a ambiguidade passiva/reflexiva do Nifal e a alternativa temporal, sem resolver disputas além do que o hebraico permite.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:54Z'
review_pass:
  verdict: revise
  source_fidelity: A redação capta bem o marco de sete anos, a obrigação distributiva, o parentesco hebraico, a venda e o serviço de seis anos. Contudo, «vocês o deixarão partir livre» omite מֵעִמָּךְ («de junto de você/de seu serviço»), e «os tiver servido» cria concordância plural inadequada com «seu irmão hebreu» e enfraquece a distribuição singular do hebraico.
  naturalness: O registro é claro e moderno, mas a alternância entre «cada um», «a vocês», «os» e «vocês» produz uma construção menos fluida. A revisão mantém «vocês» para os destinatários, mas emprega os pronomes singulares exigidos pelo valor distributivo de «cada um».
  terminology: «Irmão hebreu», «vendido» e «livre» são escolhas adequadas e não importam categorias históricas posteriores. «Antepassados» é natural para אֲבוֹתֵיכֶם. «Inclinaram os ouvidos para mim» preserva bem a imagem idiomática.
  issues:
  - severity: medium
    issue: Omissão de מֵעִמָּךְ
    rationale: «Vocês o deixarão partir livre» não traduz o complemento final «de junto de você», que no contexto especifica a saída do serviço ou domínio do destinatário.
  - severity: medium
    issue: Concordância e referência pronominal em «os tiver servido»
    rationale: O antecedente é singular («seu irmão hebreu»), de modo que o objeto de «servir» deve ser singular («o»). O hebraico usa o singular de modo distributivo após «cada um».
  - severity: low
    issue: Oscilação desnecessária entre singular distributivo e plural coletivo
    rationale: «Vendido a vocês» e «vocês o deixarão» são inteligíveis, mas deixam menos nítido que a obrigação recai sobre cada indivíduo, como indicam אִישׁ e os sufixos singulares.
  revised_text: Ao fim de sete anos[a], cada um de vocês deverá libertar seu irmão hebreu[b] que lhe tiver sido vendido[c] e o tiver servido durante seis anos; deverá deixá-lo partir livre de seu serviço. Mas os seus antepassados não me ouviram nem inclinaram os ouvidos para mim.
  revised_footnotes:
