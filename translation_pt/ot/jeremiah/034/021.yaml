  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: pt
  text: Entregarei Zedequias, rei de Judá, e seus oficiais nas mãos dos seus inimigos, nas mãos dos que procuram tirar-lhes a vida e nas mãos do exército do rei da Babilônia, que se retirou de diante de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que está se retirando de diante de vocês”. O hebraico diz literalmente “os que estão subindo de sobre vocês”, expressão que, neste contexto, indica que as forças estavam se afastando do cerco da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: No contexto político da corte, שַׂר designa autoridades do rei; “oficiais” preserva a amplitude do termo sem especificar indevidamente príncipes ou comandantes.
- source_word: אֶתֵּן בְּיַד
  choice: entregarei ... nas mãos de
  rationale: A construção hebraica significa colocar alguém sob o poder de outro. “Entregarei” é natural em português, enquanto a repetição de “nas mãos” conserva a força retórica do original.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: os que procuram tirar-lhes a vida
  rationale: A expressão idiomática significa buscar a vida de alguém com intenção de matá-lo; esta formulação comunica o sentido com clareza sem eliminar a referência à vida.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: o exército do rei da Babilônia
  rationale: Neste contexto, חֵיל indica força militar, e “exército” é o equivalente português mais claro.
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: que se retirou de diante de vocês
  rationale: Literalmente, a expressão descreve o exército como aquele que está ‘subindo de sobre’ os habitantes, isto é, afastando-se temporariamente do cerco. O particípio pode permitir nuance progressiva ou resultativa; o texto principal adota a leitura contextual de retirada já ocorrida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a repetição enfática de “nas mãos”, mas emprega-se “entregarei” para expressar naturalmente o idioma hebraico. “Vocês” representa o plural da segunda pessoa dirigido aos habitantes de Jerusalém.
