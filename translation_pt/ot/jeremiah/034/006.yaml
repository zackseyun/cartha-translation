  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: pt
  text: Então o profeta Jeremias falou todas estas palavras a Zedequias, rei de Judá, em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente essa progressão, e “falou” introduz a comunicação da mensagem precedente.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém tanto o nome tradicional em português quanto o título definido explícito, em ordem natural no idioma.
- source_word: אֶל צִדְקִיָּהוּ
  choice: a Zedequias
  rationale: A preposição marca o destinatário da fala; “a” é a formulação portuguesa direta e natural. Zedequias é a forma tradicional do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Traduz diretamente a cadeia construta. As vírgulas apresentam o título como aposto de Zedequias, segundo o uso natural do português.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דְּבָרִים pode designar palavras, coisas ou assuntos; aqui retoma a mensagem profética verbal, por isso “palavras” é a opção mais precisa. “Todas” e “estas” preservam os dois elementos de ênfase do hebraico.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta, conservada no fim da frase para fluidez e para manter destacado o cenário.
