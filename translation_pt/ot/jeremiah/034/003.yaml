  register: Português moderno, claro e digno, com tratamento por «você» para legibilidade brasileira ampla. Mantiveram-se as imagens das mãos e dos olhos; a expressão incomum sobre as bocas foi vertida idiomaticamente no texto e registrada literalmente em nota.
