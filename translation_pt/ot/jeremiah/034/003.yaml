  text: וְ/אַתָּ֗ה לֹ֚א תִמָּלֵט֙ מִ/יָּד֔/וֹ כִּ֚י תָּפֹ֣שׂ תִּתָּפֵ֔שׂ וּ/בְ/יָד֖/וֹ תִּנָּתֵ֑ן וְֽ֠/עֵינֶי/ךָ אֶת עֵינֵ֨י מֶֽלֶךְ בָּבֶ֜ל תִּרְאֶ֗ינָה וּ/פִ֛י/הוּ אֶת פִּ֥י/ךָ יְדַבֵּ֖ר וּ/בָבֶ֥ל תָּבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: pt
  text: E você não escapará da mão dele, pois certamente será capturado e entregue na mão dele. Seus olhos verão os olhos do rei da Babilônia, e ele falará diretamente com você[a]; e você irá para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a boca dele falará com a sua boca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: não escapará das mãos dele
  rationale: A expressão indica escapar do poder ou controle de alguém. O plural idiomático «das mãos» soa natural em português e preserva a imagem hebraica.
- source_word: כִּי תָפֹשׂ תִּתָּפֵשׂ
  choice: pois certamente será capturado
  rationale: A combinação enfática do infinitivo absoluto com o verbo finito expressa certeza; «certamente» comunica essa força com naturalidade.
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: e entregue nas mãos dele
  rationale: O nifal de נתן com «na mão de» descreve ser entregue ao controle de alguém. A formulação portuguesa mantém a imagem e evita uma tradução excessivamente mecânica.
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: Seus olhos verão os olhos do rei da Babilônia
  rationale: Preserva a formulação concreta e enfática do hebraico, que destaca o encontro pessoal e direto com o rei da Babilônia.
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: e ele falará com você face a face
  rationale: A expressão literal «a boca dele falará com a sua boca» indica comunicação direta. A tradução idiomática comunica o sentido claramente, enquanto a imagem literal é preservada em nota.
- source_word: וּבָבֶל תָּבוֹא
  choice: e você irá para a Babilônia
  rationale: Embora בוא possa significar «vir» ou «ir» conforme o ponto de vista, «irá» é natural aqui na perspectiva do destinatário.
