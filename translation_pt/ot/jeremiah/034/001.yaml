  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh, quando Nabucodonosor[a], rei da Babilônia, todo o seu exército, todos os reinos da terra[b] sob o domínio de sua mão e todos os povos guerreavam contra Jerusalém e contra todas as suas cidades, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz a forma “Nebucadrezar”; “Nabucodonosor” é a forma tradicional em português.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os reinos da região”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Mantém a fórmula profética convencional que apresenta uma comunicação divina, sem parafraseá-la como “mensagem”.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Expressa em português natural a fórmula hebraica pela qual a palavra divina chega ao profeta.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת indica origem ou procedência; “da parte de” é idiomático em português e Yahweh representa o nome divino יְהוָה.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e imediatamente reconhecível do nome em português; a forma mais próxima do hebraico é registrada em nota.
- source_word: חֵילוֹ
  choice: todo o seu exército
  rationale: חַיִל designa aqui as forças militares do rei; “exército” é claro e atual.
- source_word: מַמְלְכוֹת אֶרֶץ
  choice: os reinos da terra
  rationale: Preserva a amplitude de אֶרֶץ no contexto imperial, mantendo em nota a alternativa igualmente possível “da região”.
- source_word: מֶמְשֶׁלֶת יָדוֹ
  choice: sob o domínio de sua mão
  rationale: Conserva tanto a noção de governo e poder quanto a imagem concreta da mão presente no hebraico.
- source_word: הָעַמִּים
  choice: os povos
  rationale: O plural indica grupos político-étnicos distintos; “povos” preserva essa pluralidade sem interpretá-los necessariamente como Estados nacionais.
- source_word: נִלְחָמִים עַל
  choice: guerreavam contra
  rationale: O particípio indica ação em curso, e עַל assume sentido hostil neste contexto militar.
- source_word: כָּל עָרֶיהָ
  choice: todas as cidades dela
  rationale: Mantém explícito o sufixo feminino referente a Jerusalém, entendida como cidade principal do território cujas cidades estavam sendo atacadas.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Liga o cenário histórico à fala divina que começa no versículo seguinte; os dois-pontos são naturais nessa função introdutória.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; não se afirma com isso certeza absoluta sobre a vocalização antiga.
- issue: Alcance de מַמְלְכוֹת אֶרֶץ
  choice: reinos da terra
  alternative: reinos da região
  rationale: A expressão pode ter alcance amplo ou regional. O texto principal mantém a formulação abrangente, enquanto a nota preserva a leitura geográfica mais restrita sem decidir além do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima à estrutura hebraica sem se tornar obscura. O sujeito composto permanece no plural (“guerreavam”), e a imagem semítica “domínio de sua mão” foi conservada deliberadamente.
