  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male slave and each man his female slave[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: pt
  text: que cada homem libertasse seu escravo e cada homem sua escrava, o hebreu e a hebreia, para que nenhum deles escravizasse um judeu, seu irmão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um judeano, seu irmão”. O termo hebraico pode designar um “judeu” em sentido étnico-religioso ou, neste contexto histórico, mais especificamente um habitante ou membro de Judá.'
    reason: Preserva a amplitude histórica e semântica de יְהוּדִי.
lexical_decisions:
- source_word: לְשַׁלַּח
  choice: libertasse
  rationale: No contexto da aliança sobre manumissão, o verbo indica pôr em liberdade, não apenas mandar embora.
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: seu escravo ... sua escrava
  rationale: Os termos designam pessoas em condição de escravidão; a tradução mantém tanto a força jurídica e social quanto o contraste de gênero.
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: o hebreu e a hebreia
  rationale: Preserva as formas étnicas masculina e feminina do hebraico sem acrescentar substantivos redundantes em português.
- source_word: חָפְשִׁים
  choice: libertasse
  rationale: Embora seja literalmente um predicativo, 'livres', seu sentido é expresso naturalmente em português pelo verbo 'libertar', sem perda do resultado da ação.
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: para que ninguém mais escravizasse
  rationale: 'A construção expressa finalidade: a libertação deveria impedir a continuação da escravidão. ''Mais'' torna explícita essa cessação indicada pelo contexto.'
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: seu irmão judeu
  rationale: A expressão distributiva significa que ninguém deveria escravizar seu compatriota. 'Irmão' conserva a linguagem de parentesco comunitário, e 'judeu' é claro ao leitor moderno.
theological_decisions:
- issue: Termos de condição servil
  choice: escravo e escrava
  alternative: servo e serva
  rationale: A passagem trata de libertação de pessoas mantidas em escravidão; 'servo' poderia atenuar indevidamente a condição social e jurídica.
- issue: Sentido de יְהוּדִי
  choice: judeu no texto principal
  alternative: judeu da Judeia / judeano
  rationale: O termo admite o sentido étnico-religioso posterior e o sentido histórico-geográfico ligado a Judá. O texto usa a forma mais reconhecível e a nota preserva a alternativa histórica.
- issue: Linguagem de parentesco
  choice: seu irmão judeu
  alternative: seu compatriota judeu
  rationale: '''Irmão'' mantém a metáfora de parentesco e solidariedade interna do texto hebraico, sem convertê-la em mera nacionalidade.'
translation_notes:
  register: Português moderno, digno e de leitura natural. A repetição distributiva 'cada homem ... cada homem' foi mantida; a formulação final foi levemente condensada para evitar uma ordem artificial em português.
