  text: הִנְ/נִ֨י מְצַוֶּ֜ה נְאֻם יְהוָ֗ה וַ/הֲשִׁ֨בֹתִ֜י/ם אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/נִלְחֲמ֣וּ עָלֶ֔י/הָ וּ/לְכָד֖וּ/הָ וּ/שְׂרָפֻ֣/הָ בָ/אֵ֑שׁ וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מֵ/אֵ֥ין יֹשֵֽׁב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: pt
  text: 'Eis que eu ordeno, declara Yahweh: farei que eles voltem a esta cidade; eles lutarão contra ela, a conquistarão e a queimarão com fogo. Farei das cidades de Judá uma desolação, sem nenhum habitante.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem ninguém morando nelas”. A expressão hebraica ressalta a desolação completa e a ausência de moradores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי מְצַוֶּה
  choice: Eis que estou dando uma ordem
  rationale: Preserva a partícula profética de atenção e o valor imediato do particípio, em português atual e solene.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e translitera diretamente o nome divino.
- source_word: וַהֲשִׁבֹתִים
  choice: farei com que eles voltem
  rationale: Expressa de modo transparente o sentido causativo do hifil de שוב; no contexto, o referente são as forças inimigas que retornam à cidade.
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: Eles lutarão contra ela
  rationale: Reproduz diretamente a ação militar contra a cidade sem ampliar o sentido para além do hebraico.
- source_word: וּלְכָדוּהָ
  choice: a conquistarão
  rationale: Em contexto de cerco, לכד indica tomar ou conquistar uma cidade.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: a queimarão
  rationale: O português não precisa explicitar 'com fogo', semanticamente redundante, para comunicar integralmente a ação.
- source_word: אֶתֵּן שְׁמָמָה
  choice: farei ... uma desolação
  rationale: Preserva a construção resultativa e o tom forte da sentença de juízo.
- source_word: מֵאֵין יֹשֵׁב
  choice: sem nenhum habitante
  rationale: Comunica de forma natural a ausência completa de moradores indicada pelo idioma hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; a transliteração preserva esse caráter sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva o tom profético e a sequência enfática das ações. O marcador [a] aparece no texto junto à expressão que esclarece.
