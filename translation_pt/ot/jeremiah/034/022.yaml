  source_fidelity: 'A tradução reproduz corretamente a sequência principal: Yahweh faz as forças inimigas retornarem, elas combatem e conquistam Jerusalém, e as cidades de Judá ficam desoladas e sem moradores. Contudo, «a queimarão» deixa implícito o complemento explícito do hebraico בָּאֵשׁ, «com fogo».'
