  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/012.yaml
  text: Then the word of Yahweh came to Jeremiah from Yahweh[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeremias da parte de Yahweh[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (o nome divino), tradicionalmente traduzido como “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz um novo desenvolvimento; em português, “Então” expressa naturalmente a sequência, enquanto o verbo integra a fórmula profética “a palavra ... veio”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva a forma tradicional da fórmula profética e sua ligação com a revelação, sem a explicitação interpretativa de “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: A preposição marca o destinatário da revelação; o nome segue a forma portuguesa consagrada.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת indica fonte ou procedência. “Da parte de” soa natural em português e preserva a repetição enfática do nome divino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta que vem no versículo seguinte; os dois-pontos cumprem essa função com naturalidade em português, sem o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo pelo título tradicional.
- issue: Repetição de יְהוָה na fórmula
  choice: preservar as duas ocorrências
  alternative: omitir a segunda por aparente redundância
  rationale: A repetição está no texto hebraico e pode ter valor formal ou enfático; não deve ser suavizada silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula profética e a repetição incomum do nome divino; os dois-pontos introduzem naturalmente a fala do versículo seguinte.
