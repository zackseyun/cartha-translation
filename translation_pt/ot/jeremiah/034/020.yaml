base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: pt
  text: Eu os entregarei nas mãos de seus inimigos e nas mãos dos que atentam contra a vida deles[a]. Seus cadáveres servirão de alimento às aves do céu e aos animais da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os que procuram a vida deles”, isto é, os que procuram matá-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם בְּיַד
  choice: Eu os entregarei nas mãos de
  rationale: A construção נתן בְּיַד indica entregar alguém ao poder ou controle de outro. “Entregarei nas mãos de” preserva a imagem hebraica e soa natural em português.
- source_word: אֹיְבֵיהֶם
  choice: seus inimigos
  rationale: Equivalente direto e corrente para o termo hebraico.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: os que atentam contra a vida deles
  rationale: A expressão idiomática significa procurar tirar a vida de alguém. “Atentam contra a vida” comunica essa intenção homicida sem reduzir a formulação a uma simples declaração de que os matarão.
- source_word: וְהָיְתָה נִבְלָתָם לְמַאֲכָל
  choice: Seus cadáveres servirão de alimento
  rationale: נְבֵלָה designa o corpo morto, e a construção com היה descreve o estado resultante. “Cadáveres” mantém a crueza da imagem aplicada a seres humanos; “servirão de alimento” é idiomático em português.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves do céu
  rationale: Tradução transparente da expressão hebraica, com עוֹף em sentido coletivo.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: e aos animais da terra
  rationale: בְּהֵמָה refere-se a animais terrestres, muitas vezes de maior porte. “Animais da terra” é claro e preserva o paralelismo com “aves do céu” sem sugerir necessariamente ferocidade.
theological_decisions:
- issue: Imagem de juízo envolvendo cadáveres insepultos devorados por animais
  choice: Manter de modo concreto a exposição desonrosa dos cadáveres
  alternative: Resumir a passagem como morte ou derrota às mãos dos inimigos
  rationale: O texto apresenta a privação de sepultamento e a entrega dos corpos aos animais como parte do juízo. A tradução conserva essa imagem severa, sem a suavizar nem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “nas mãos de” conserva deliberadamente o paralelismo hebraico; “deles” evita a possível ambiguidade de “sua vida”.
