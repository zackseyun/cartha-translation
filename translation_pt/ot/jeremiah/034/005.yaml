  naturalness: '"Fizeram queimas funerárias por seus antepassados" soa pouco idiomático e pode sugerir uma ação feita em benefício deles, em vez de uma homenagem em sua honra. A repetição explícita de "queimas cerimoniais" na segunda parte torna o paralelismo compreensível e evita elipse algo pesada.'
  terminology: '"Yahweh" representa adequadamente o Tetragrama. "Queimas cerimoniais" mantém a generalidade do hebraico; a nota explica com a cautela necessária que provavelmente envolviam aromáticos. "Ai, senhor!" é uma boa reprodução do grito de lamento e não confunde אַדֹן com o nome divino.'
