  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: pt
  text: 'Você morrerá em paz. Assim como se fizeram queimas cerimoniais em honra de seus antepassados, os reis que o precederam, também farão queimas cerimoniais em sua honra[a]. E lamentarão por você, dizendo: “Ai, senhor!”[b] Pois eu falei esta palavra — declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, queimas cerimoniais em honra de reis falecidos, provavelmente de especiarias ou outras substâncias aromáticas; não se refere à queima do corpo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Ah, senhor!”. Trata-se de um clamor formal de luto por um governante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׁלוֹם תָּמוּת
  choice: Você morrerá em paz
  rationale: Preserva o idiomatismo hebraico e indica as circunstâncias pacíficas, ou ao menos não violentas, da morte sem reduzir a expressão a tranquilidade emocional.
- source_word: וּכְמִשְׂרְפוֹת
  choice: Assim como fizeram queimas funerárias
  rationale: O substantivo se refere a queimas cerimoniais ligadas ao funeral de reis. A formulação evita afirmar no texto que eram necessariamente especiarias, mantendo a cautela exigida pela evidência lexical.
- source_word: אֲבוֹתֶיךָ הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: seus antepassados, os reis anteriores a você
  rationale: “Antepassados” comunica naturalmente a referência aos predecessores da linhagem real, explicitada pela aposição seguinte, sem sugerir apenas os pais biológicos.
- source_word: כֵּן יִשְׂרְפוּ לָךְ
  choice: também as farão por você
  rationale: O pronome retoma “queimas funerárias”; “farão” produz português natural e evita a leitura equivocada de que queimariam o próprio rei.
- source_word: וְהוֹי אָדוֹן יִסְפְּדוּ לָךְ
  choice: 'E lamentarão por você, dizendo: “Ai, senhor!”'
  rationale: O verbo designa lamentação formal, e הוֹי é uma exclamação de luto. “Dizendo” é uma explicitação natural que introduz o clamor citado.
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: Pois eu falei esta palavra
  rationale: Mantém no possível a repetição da raiz דבר por meio de “palavra/falei” e conserva a ênfase explícita no pronome “eu”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Traduz a fórmula profética de modo corrente e representa diretamente o nome divino do texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Natureza das queimas reais
  choice: queimas funerárias cerimoniais, provavelmente de substâncias aromáticas
  alternative: cremação do corpo; queima de especiarias afirmada diretamente
  rationale: O contexto promete honras funerárias reais, não a cremação do cadáver. Como o objeto queimado não é expresso no versículo, a tradução principal mantém certa generalidade e a nota fornece a explicação cultural provável.
- issue: Sentido de morrer “em paz”
  choice: manter a expressão aberta
  alternative: morrer sem violência; morrer tranquilamente
  rationale: A expressão pode contrastar com uma morte violenta ou desonrosa, mas o hebraico não exige que se escolha apenas um desses matizes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mas o paralelismo, a fórmula de lamentação e a ênfase da declaração divina foram preservados.
