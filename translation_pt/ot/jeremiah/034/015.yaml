  source_fidelity: A ideia geral está bem preservada, incluindo a ênfase em «vocês mesmos», a avaliação «aos meus olhos», a proclamação de liberdade e a referência à casa associada ao nome divino. Contudo, «mudado de atitude» é mais interpretativo e menos preciso que o hebraico שוב, que aqui indica voltar/retornar à conduta de obediência. A tradução revista recupera esse movimento sem impor a noção de arrependimento interior.
  naturalness: O registro é claro e moderno. «Hoje, vocês mesmos tinham voltado» mantém de modo aceitável em português a relação retrospectiva que prepara o contraste do versículo seguinte. A ligação das duas ações por «e» reflete melhor a coordenação hebraica do que a divisão em duas frases.
  terminology: '«Firmado uma aliança» é uma solução idiomática e solene para כרת ברית; a nota conserva adequadamente a expressão literal. «Casa» e «chamada pelo meu nome» preservam a formulação bíblica. A nota a, porém, precisava de correção gramatical: depois de «literalmente», cabe o infinitivo «cortar», não o particípio «cortado».'
