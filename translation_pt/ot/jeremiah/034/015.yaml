base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: pt
  text: Hoje, vocês mesmos tinham voltado e feito o que é certo aos meus olhos, proclamando liberdade, cada um ao seu próximo; e tinham firmado uma aliança[a] diante de mim, na casa que é chamada pelo meu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cortar uma aliança”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo em Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: tinham mudado de atitude
  rationale: שׁוּב significa voltar ou retornar. No contexto, indica que eles haviam abandonado temporariamente a conduta anterior e retomado a obediência; “mudado de atitude” comunica isso sem afirmar necessariamente arrependimento interior pleno. O mais-que-perfeito prepara o contraste com a nova reversão no versículo seguinte.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém a referência temporal direta e imediata do hebraico.
- source_word: אַתֶּם
  choice: vocês mesmos
  rationale: O pronome explícito é enfático; “vocês mesmos” preserva essa ênfase de modo natural em português.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: o que é certo aos meus olhos
  rationale: Preserva a imagem hebraica e expressa a avaliação moral feita por Deus.
- source_word: לִקְרֹא דְרוֹר
  choice: proclamando liberdade
  rationale: דְּרוֹר designa libertação ou emancipação formal, especialmente no contexto da libertação de escravizados. “Proclamando liberdade” conserva o caráter público e jurídico da ação.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  rationale: Reproduz a construção distributiva do hebraico e mantém a referência pessoal masculina do contexto imediato sem tornar a frase artificial em português.
- source_word: וַתִּכְרְתוּ בְרִית
  choice: tinham firmado uma aliança
  rationale: “Firmar uma aliança” é português natural e solene. A expressão hebraica literal, “cortar uma aliança”, preservada em nota, pode evocar o rito descrito no contexto.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Preserva a linguagem de presença divina e o caráter solene da aliança.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: na casa que é chamada pelo meu nome
  rationale: Mantém a expressão bíblica de pertencimento e identificação com Deus. “Casa” traduz בַּיִת diretamente; a identificação com o templo é esclarecida em nota.
theological_decisions:
- issue: Expressão de celebração da aliança כרת ברית
  choice: firmado uma aliança
  alternative: cortado uma aliança
  rationale: A tradução principal prioriza clareza idiomática em português, enquanto a nota conserva a imagem ritual do hebraico e sua possível ligação com a cerimônia mencionada no contexto.
- issue: Alcance de אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  alternative: cada pessoa ao seu semelhante
  rationale: A formulação escolhida preserva a forma distributiva e masculina do texto, relevante no contexto jurídico-social, sem introduzir uma generalização ausente da expressão hebraica.
- issue: Sentido de שׁוּב no contexto
  choice: mudado de atitude
  alternative: se arrependido
  rationale: A escolha expressa uma reversão observável de conduta sem resolver a questão da sinceridade ou profundidade espiritual, especialmente porque o versículo seguinte relata outra mudança de direção.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O mais-que-perfeito composto preserva a relação discursiva com a reversão posterior do versículo 16. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
