revisions:
- from: Hoje vocês mesmos tinham mudado de atitude e feito o que é certo aos meus olhos, proclamando liberdade, cada um ao seu próximo. Tinham firmado uma aliança[a] diante de mim, na casa que é chamada pelo meu nome[b].
  to: Hoje, vocês mesmos tinham voltado e feito o que é certo aos meus olhos, proclamando liberdade, cada um ao seu próximo; e tinham firmado uma aliança[a] diante de mim, na casa que é chamada pelo meu nome[b].
  rationale: A revisão substitui a paráfrase mais ampla «mudado de atitude» por «voltado», que reproduz o valor contextual de שוב como retorno à prática correta, sem escolher a leitura mais forte «arrepender-se». Também coordena as duas ações principais e corrige a forma da glosa literal na nota. Não há alteração do sentido, dos referentes nem da ambiguidade teológica do texto.
