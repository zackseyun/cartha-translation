  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh: “Vocês não me deram ouvidos quanto a proclamar liberdade[a], cada homem ao seu irmão e cada homem ao seu próximo. Eis que eu proclamo liberdade para vocês — para a espada, para a peste e para a fome[b]”, declara Yahweh. “Farei de vocês motivo de horror[c] para todos os reinos da terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “soltura” ou “libertação”. O mesmo termo hebraico é repetido mais adiante para produzir uma ironia deliberada.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Yahweh os deixa “livres” ou os entrega à espada, à peste e à fome como juízo.
    reason: cultural_note
  - marker: c
    text: Ou “objeto de horror” ou “terror”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: me deram ouvidos
  rationale: Expressão portuguesa natural que conserva a imagem auditiva do hebraico e deixa implícita, sem explicitação excessiva, a ideia de desobediência.
- source_word: לִקְרֹא דְרוֹר / דְרוֹר
  choice: proclamar liberdade / liberdade
  rationale: “Liberdade” comunica a emancipação formal de escravizados no contexto e é repetida nas duas ocorrências para preservar a ironia retórica deliberada.
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: cada homem ao seu irmão e cada homem ao seu próximo
  rationale: Mantém a distribuição masculina singular e a repetição de אִישׁ, além de distinguir “irmão” de “próximo”.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com solenidade e vivacidade o anúncio divino iminente.
- source_word: קֹרֵא לָכֶם דְרוֹר
  choice: proclamo liberdade para vocês
  rationale: O presente comunica a ação vívida do particípio; “para vocês” representa לָכֶם e permite que a direção aos agentes de juízo seja expressa na sequência.
- source_word: אֶל הַחֶרֶב אֶל הַדֶּבֶר וְאֶל הָרָעָב
  choice: para a espada, para a peste e para a fome
  rationale: 'Preserva a preposição repetida e o efeito chocante da reversão: a liberdade anunciada os entrega aos instrumentos do juízo.'
- source_word: לְזַוֲעָה
  choice: motivo de horror
  rationale: Expressa de modo idiomático que eles se tornarão algo que provoca horror e consternação entre os reinos.
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: reinos da terra
  rationale: Reflete o alcance internacional da expressão, em vez de restringi-la à terra local de Judá.
theological_decisions:
- issue: Ironia da “liberdade” divina
  choice: Repetir “liberdade” nas duas orações
  alternative: Usar “libertação” ou “entrega” na segunda ocorrência
  rationale: 'O mesmo termo hebraico, דְרוֹר, é repetido intencionalmente: por não libertarem seus irmãos, eles recebem uma “liberdade” que os deixa expostos à espada, à peste e à fome. A repetição mantém a tensão e a ironia teológica.'
- issue: Linguagem distributiva masculina no mandamento de libertação
  choice: cada homem ao seu irmão e cada homem ao seu próximo
  alternative: cada pessoa ao seu semelhante
  rationale: A formulação conserva o masculino singular e a estrutura distributiva do hebraico no contexto jurídico-social, sem neutralizar silenciosamente a expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “quanto a proclamar” evita transformar o sentido de ouvir em uma paráfrase explícita de obedecer. As repetições de “cada homem” e “para” foram mantidas por seu valor retórico e jurídico.
