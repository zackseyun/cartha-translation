id: JER.34.4
reference: Jeremiah 34:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: pt
  text: 'Contudo, ouça a palavra de Yahweh, Zedequias, rei de Judá: Assim diz Yahweh a seu respeito: Você não morrerá pela espada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz uma ressalva consoladora em contraste com o juízo anunciado anteriormente, preservando o valor adversativo do hebraico.
- source_word: שְׁמַע
  choice: ouça
  rationale: O imperativo convoca Zedequias a receber a declaração divina; “ouça” é natural e mantém a fórmula profética.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a expressão profética tradicional e o nome divino presente no texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio divino, sem substituí-lo por um título.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Traduz diretamente a construção que identifica o cargo e o reino de Zedequias.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula solene do mensageiro profético em português claro e consagrado.
- source_word: עָלֶיךָ
  choice: a seu respeito
  rationale: No contexto de uma declaração sobre o destino do rei, עַל indica assunto ou referência, não necessariamente hostilidade.
- source_word: לֹא תָמוּת
  choice: Você não morrerá
  rationale: Expressa de modo direto e natural o resultado futuro indicado pelo imperfeito negado.
- source_word: בֶּחָרֶב
  choice: pela espada
  rationale: Conserva a imagem hebraica de morte violenta por arma, sem restringi-la indevidamente à morte em batalha.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência profética preservada. A forma de tratamento “você” torna explícita a segunda pessoa singular em registro corrente brasileiro, enquanto “a seu respeito” evita a possível ambiguidade de “sobre você”.
