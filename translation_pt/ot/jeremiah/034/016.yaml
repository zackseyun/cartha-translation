  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male slave and his female slave return, though you had set them free to go where they wished; then you subjugated them to be your male and female slaves.'
translation:
  language: pt
  text: 'Mas vocês voltaram atrás e profanaram o meu nome: cada um de vocês fez seu escravo e sua escrava voltar, embora os tivessem libertado para irem aonde quisessem; depois, vocês os subjugaram para serem escravos e escravas de vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: vocês voltaram atrás
  rationale: Expressa a reversão da decisão anterior e preserva, em português natural, a imagem concreta do verbo שׁוּב.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: e profanaram o meu nome
  rationale: “Profanar” comunica com precisão o sentido do piel de חלל aplicado ao nome divino, sem reduzir a acusação a mero desrespeito.
- source_word: וַתָּשִׁבוּ
  choice: fez ... voltar
  rationale: 'Preserva a força causativa do hifil: cada senhor fez com que as pessoas anteriormente libertadas retornassem.'
- source_word: אִישׁ ... וְאִישׁ
  choice: cada um de vocês
  rationale: Transmite o valor distributivo da repetição hebraica de modo claro e idiomático, abrangendo individualmente os destinatários responsáveis.
- source_word: עַבְדּוֹ וְשִׁפְחָתוֹ
  choice: seu escravo e sua escrava
  rationale: Mantém tanto a condição de escravidão, central no contexto de libertação e reescravização, quanto a distinção de gênero presente nos dois substantivos.
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: os tivessem libertado
  rationale: Comunica a concessão efetiva de liberdade, e não apenas o ato de mandá-los embora.
- source_word: לְנַפְשָׁם
  choice: para irem aonde quisessem
  rationale: No contexto da alforria, a expressão indica que os libertos podiam dispor de si mesmos; a formulação torna essa autonomia clara em português corrente.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: vocês os subjugaram
  rationale: O verbo כבש descreve a imposição de domínio ou sujeição e preserva a gravidade da ação denunciada.
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: para serem escravos e escravas de vocês
  rationale: Reproduz o estado resultante e a relação de posse, mantendo explícitos os termos masculino e feminino.
theological_decisions:
- issue: Terminologia da escravidão em contexto de alforria e reescravização
  choice: escravo / escrava
  alternative: servo / serva
  rationale: A libertação seguida de retorno compulsório ao domínio torna a condição de escravidão inequívoca; “servo” poderia atenuar indevidamente a realidade descrita.
- issue: Força distributiva de אִישׁ
  choice: cada um de vocês
  alternative: cada homem
  rationale: O hebraico individualiza a responsabilidade dos proprietários. Em português, “cada um de vocês” preserva essa distribuição com naturalidade sem afirmar mais sobre o gênero dos destinatários do que o contexto exige.
- issue: Sentido contextual de לְנַפְשָׁם
  choice: para irem aonde quisessem
  alternative: para si mesmos
  rationale: A opção escolhida explicita a autonomia concedida pela libertação sem resolver qualquer tensão teológica; traduz o valor idiomático da expressão no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a acusação direta, a alternância entre responsabilidade individual e coletiva e a distinção entre escravos e escravas. Não foram necessárias notas de rodapé.
