  text: וְ/חֵ֣יל מֶֽלֶךְ בָּבֶ֗ל נִלְחָמִים֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֛ל כָּל עָרֵ֥י יְהוּדָ֖ה הַ/נּֽוֹתָר֑וֹת אֶל לָכִישׁ֙ וְ/אֶל עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּ/עָרֵ֥י יְהוּדָ֖ה עָרֵ֥י מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/007.yaml
  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: pt
  text: enquanto o exército do rei da Babilônia combatia contra Jerusalém e contra todas as cidades restantes de Judá[a], contra Laquis e contra Azeca, pois somente elas restavam, entre as cidades de Judá, como cidades fortificadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isto é, Laquis e Azeca”. O hebraico pode ser entendido como identificando especificamente as cidades restantes de Judá que ainda estavam sob ataque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: exército
  rationale: No contexto de cerco, o termo designa a força militar do rei da Babilônia; “exército” é claro e natural em português.
- source_word: נִלְחָמִים
  choice: combatia
  rationale: O particípio expressa uma ação militar em andamento. Em português, o singular concorda naturalmente com o substantivo coletivo “exército”.
- source_word: הַנּוֹתָרוֹת
  choice: restantes
  rationale: O particípio modifica “cidades” e indica as que ainda não haviam caído.
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: contra Laquis e contra Azeca
  rationale: Mantém a repetição da preposição hebraica e preserva a possível ambiguidade sintática entre continuação da lista de alvos e identificação específica das cidades restantes.
- source_word: כִּי הֵנָּה נִשְׁאֲרוּ
  choice: pois eram essas ... que ainda restavam
  rationale: Retoma enfaticamente as duas cidades nomeadas e comunica sua permanência sem acrescentar ao texto principal um termo explícito para “somente”, ausente do hebraico.
- source_word: בְּעָרֵי יְהוּדָה
  choice: entre as cidades de Judá
  rationale: '“Entre” expressa de modo natural a nuance partitiva: Laquis e Azeca faziam parte do conjunto das cidades de Judá.'
- source_word: עָרֵי מִבְצָר
  choice: cidades fortificadas
  rationale: A expressão designa cidades dotadas de defesas, e esta é a formulação corrente e precisa em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “contra” conserva a estrutura hebraica e evita resolver silenciosamente sua ambiguidade; “ainda restavam” torna natural a ideia de sobrevivência após a queda de outras cidades.
