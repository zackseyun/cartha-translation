  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male slaves and the female slaves whom they had set free[a], and they forced them into slavery as male and female slaves.
translation:
  language: pt
  text: Depois disso, porém, voltaram atrás, trouxeram de volta os escravos e as escravas que tinham libertado e os obrigaram a voltar à condição de escravos e escravas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os subjugaram como escravos e escravas”. O verbo hebraico significa subjugar ou colocar sob domínio; no contexto, trata-se de reescravização forçada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: voltaram atrás
  rationale: O qal de שׁוב indica aqui uma reversão da decisão anterior; “voltaram atrás” expressa isso de modo natural e preserva a repetição verbal com וַיָּשִׁבוּ.
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressão temporal simples que marca a ação posterior.
- source_word: וַיָּשִׁבוּ
  choice: trouxeram de volta
  rationale: O hifil de שׁוב tem força causativa. “Trouxeram de volta” é natural em português e mantém a relação lexical com “voltaram atrás”.
- source_word: הָעֲבָדִים וְהַשְּׁפָחוֹת
  choice: os escravos e as escravas
  rationale: O contexto é de libertação seguida de reescravização, portanto “escravos” é mais exato que “servos”. A formulação conserva a distinção de gênero do par hebraico.
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: tinham libertado
  rationale: O idioma hebraico significa soltar da escravidão. O mais-que-perfeito composto deixa clara a anterioridade dessa libertação.
- source_word: וַיִּכְבְּשׁוּם
  choice: os obrigaram a voltar à condição de escravos e escravas
  rationale: כּבשׁ denota subjugar ou colocar sob domínio. Neste contexto, a coerção resulta especificamente em reescravização; a formulação explicita esse sentido sem ocultar a força do verbo.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: à condição de escravos e escravas
  rationale: 'O ל indica o estado resultante: essas pessoas foram novamente reduzidas à condição de escravidão.'
