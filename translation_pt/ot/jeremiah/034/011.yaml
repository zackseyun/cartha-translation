translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “voltaram atrás / trouxeram de volta” procura refletir a repetição da raiz שׁוב no hebraico. A distinção entre escravos e escravas foi mantida, sem empregar termos arcaicos como “servas” ou “escravas domésticas”.
