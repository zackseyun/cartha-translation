base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: pt
  text: as autoridades de Judá e as autoridades de Jerusalém, os oficiais da corte[a], os sacerdotes e todo o povo da terra que passaram entre as partes do bezerro—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eunucos”. O termo hebraico pode designar tanto eunucos propriamente ditos quanto oficiais da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: líderes
  rationale: שַׂר designa governantes ou autoridades de alta posição. “Líderes” é atual, claro e funciona naturalmente tanto para Judá quanto para Jerusalém.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: הַסָּרִסִים
  choice: oficiais da corte
  rationale: סָרִיס pode designar eunucos propriamente ditos ou funcionários palacianos. No contexto desta enumeração social, “oficiais da corte” expressa a função provavelmente pretendida sem excluir a alternativa, preservada em nota.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português padrão de כֹּהֲנִים.
- source_word: כֹל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a expressão coletiva hebraica sem acrescentar a interpretação mais específica de “povo comum”.
- source_word: הָעֹבְרִים
  choice: que passaram
  rationale: O particípio identifica os que participaram do rito da aliança; a oração relativa no passado é natural em português e adequada ao contexto retrospectivo.
- source_word: בֵּין
  choice: entre
  rationale: Equivalente direto e idiomático da preposição na descrição do rito da aliança.
- source_word: בִּתְרֵי
  choice: as partes
  rationale: בֶּתֶר denota uma parte ou pedaço resultante de corte. “Partes” é natural em português e o contexto anterior esclarece que o animal havia sido dividido.
- source_word: הָעֵגֶל
  choice: o bezerro
  rationale: עֵגֶל significa normalmente “bezerro”, em consonância com o contexto imediato do animal cortado em duas partes.
theological_decisions:
- issue: Sentido de סָרִיסִים na enumeração dos grupos sociais
  choice: oficiais da corte
  alternative: eunucos
  rationale: O termo hebraico pode indicar tanto eunucos literais quanto funcionários da corte. A enumeração favorece aqui uma designação administrativa, mas a ambiguidade genuína é mantida mediante nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura de enumeração e o travessão final foram mantidos porque o versículo continua sintaticamente no contexto seguinte.
