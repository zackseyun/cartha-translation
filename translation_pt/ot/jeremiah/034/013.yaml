  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of slaves, saying,'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel: Eu mesmo fiz uma aliança[a] com os pais de vocês, no dia em que os tirei da terra do Egito, da casa da escravidão[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “cortei uma aliança”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “da casa de escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e convencional em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica e sua identificação pactual.
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: Expressa a presença enfática do pronome independente, embora o verbo já indique a primeira pessoa.
- source_word: כָּרַתִּי בְרִית
  choice: fiz uma aliança
  rationale: Emprega a expressão idiomática natural em português; o sentido literal é registrado em nota.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: com os pais de vocês
  rationale: Mantém o substantivo masculino plural do hebraico e usa uma forma de segunda pessoa amplamente compreensível.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Conserva a forma temporal mais concreta do hebraico sem soar artificial.
- source_word: הוֹצִיאִי אוֹתָם
  choice: os tirei
  rationale: Traduz naturalmente o hifil de יצא e mantém a conhecida linguagem do êxodo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva integralmente a expressão histórico-pactual.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Mantém a imagem concreta e a referência explícita à escravidão, sem abrandá-la.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz a estipulação citada no versículo seguinte; os dois-pontos são a pontuação mais natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva no texto o nome pessoal divino, sem substituí-lo por um título.
- issue: Sentido de עֲבָדִים na fórmula do êxodo
  choice: escravos
  alternative: servidão; servos
  rationale: O contexto trata da libertação da escravidão no Egito; “escravos” mantém a realidade social concreta e evita suavização.
- issue: Ênfase de אָנֹכִי
  choice: Eu mesmo
  alternative: Eu
  rationale: O pronome independente pode marcar proeminência além da pessoa já codificada no verbo; a tradução conserva essa possível ênfase sem ampliá-la teologicamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Assim diz” conserva o registro profético; “pais de vocês” evita tanto arcaísmo quanto neutralização do masculino explícito; a frase termina com dois-pontos porque a fala prossegue no versículo seguinte.
