source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹךְ֙ וְ/אָ֣מַרְתָּ֔ אֶל צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel: “Vá e fale com Zedequias, rei de Judá, e diga-lhe: ‘Assim diz Yahweh: Eis que estou entregando esta cidade nas mãos[a] do rei da Babilônia, e ele a queimará com fogo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob o poder do rei da Babilônia”.'
    reason: Alternativa lexical que explicita o sentido idiomático de בְּיַד.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética de mensageiro com cadência solene e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta e natural da expressão hebraica em construto.
- source_word: הָלֹךְ
  choice: Vá
  rationale: O infinitivo absoluto tem força imperativa; o imperativo português comunica a ordem de modo conciso.
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: falar com ... e diga-lhe
  rationale: Preserva os dois atos de fala do hebraico sem produzir repetição artificial em português.
- source_word: צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Zedequias, rei de Judá
  rationale: Emprega as formas portuguesas tradicionais dos nomes e mantém o título em aposição.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que estou entregando
  rationale: “Eis que” conserva a solenidade e a iminência de הִנְנִי; o progressivo representa o particípio e a certeza da ação anunciada.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Equivalente português direto do substantivo definido seguido do demonstrativo.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: nas mãos do rei da Babilônia
  rationale: Conserva a imagem bíblica de domínio e entrega, usando o plural idiomático mais natural em português; a interpretação explícita é fornecida em nota.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: e ele a queimará
  rationale: Explicita naturalmente em português o sujeito masculino, o rei da Babilônia, e mantém a cidade como objeto pronominal. O verbo “queimar” já expressa a ação pelo fogo, evitando uma redundância pouco natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva o nome em transliteração, sem substituí-lo por um título.
- issue: Imagem de transferência de domínio em בְּיַד
  choice: nas mãos do rei da Babilônia
  alternative: sob o poder do rei da Babilônia
  rationale: O texto principal conserva a metáfora hebraica, enquanto a nota esclarece seu sentido sem limitar a imagem apenas à posse física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética e “Eis que” preservam a solenidade do original; a sintaxe do discurso foi ajustada para fluidez sem eliminar a repetição intencional dos verbos de fala. O marcador [a] foi colocado junto à expressão a que a nota efetivamente se refere.
