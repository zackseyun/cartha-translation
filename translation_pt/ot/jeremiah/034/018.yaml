  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: pt
  text: E entregarei os homens que violaram a minha aliança[a], que não cumpriram as palavras da aliança[b] que fizeram diante de mim, como o bezerro[c] que cortaram em dois e entre cujas partes passaram.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que transgrediram a minha aliança». O verbo hebraico pode significar «passar» ou «transgredir» e cria um eco com «passaram entre» no fim do versículo.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, as estipulações ou condições da aliança.
    reason: lexical_alternative
  - marker: c
    text: Cortar um animal e passar entre suas partes era um ato de celebração da aliança, pelo qual os participantes invocavam sobre si o juízo correspondente caso a quebrassem; compare Gênesis 15:9–17.
    reason: cultural_note
  - marker: d
    text: O hebraico liga de modo abrupto «os homens» a «o bezerro», sem uma palavra equivalente a «como». A ideia mais provável é que os violadores da aliança seriam entregues a um destino simbolizado pelo bezerro dividido; o versículo seguinte desenvolve o juízo.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E entregarei
  rationale: Embora נתן signifique literalmente “dar”, em contexto de juízo pode significar entregar alguém ao poder de outros. O contexto imediato desenvolve essa entrega aos inimigos.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O plural masculino de אִישׁ se refere aos homens que participaram formalmente da aliança; a tradução mantém essa referência específica.
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: que violaram a minha aliança
  rationale: Com “aliança”, עבר expressa transgressão ou violação. “Violaram” é natural em português e conserva a força jurídica e moral; a nota registra o eco com o verbo “passaram” no fim do versículo.
- source_word: לֹא הֵקִימוּ אֶת־דִּבְרֵי הַבְּרִית
  choice: não cumpriram as palavras da aliança
  rationale: הקים nesse contexto significa confirmar, manter ou levar a efeito. “Cumpriram” comunica de modo claro a obrigação assumida, enquanto “palavras da aliança” preserva a formulação concreta do hebraico.
- source_word: אֲשֶׁר כָּרְתוּ לְפָנָי
  choice: que fizeram diante de mim
  rationale: כרת ברית é o idioma hebraico para fazer literalmente uma aliança. “Diante de mim” mantém a ideia da presença e do testemunho divinos.
- source_word: הָעֵגֶל אֲשֶׁר כָּרְתוּ לִשְׁנַיִם
  choice: o bezerro que cortaram em dois
  rationale: עֵגֶל designa um bovino jovem, e a expressão seguinte descreve concretamente sua divisão em duas partes no rito da aliança.
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: e entre cujas partes passaram
  rationale: A formulação mantém a ação ritual literal e reproduz em português, tanto quanto possível, o verbo de movimento que também está por trás de “violaram” na primeira oração.
theological_decisions:
- issue: Relação sintática entre os homens julgados e o bezerro dividido
  choice: Manter a aposição abrupta por meio de um travessão, sem inserir “como” no texto principal.
  alternative: 'Explicitar a comparação: “farei com eles como fizeram com o bezerro” ou “como o bezerro”.'
  rationale: O hebraico coloca “o bezerro” de forma comprimida, sem partícula explícita de comparação. O contexto indica que o rito invocava sobre os transgressores um destino correspondente ao do animal, mas explicitar plenamente essa consequência resolveria uma elipse que o versículo preserva. O travessão conserva a tensão sintática, e a nota esclarece as principais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com escolhas naturais para leitores brasileiros. O artigo em “a minha aliança” é idiomático no português do Brasil. O travessão conserva deliberadamente a construção hebraica comprimida, enquanto as notas evitam que a dificuldade seja confundida com erro editorial.
