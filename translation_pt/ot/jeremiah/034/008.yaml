base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh, depois que o rei Zedequias fez uma aliança com todo o povo que estava em Jerusalém, para proclamar-lhes libertação[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liberdade” ou “alforria”. O termo hebraico se refere aqui à emancipação formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: A palavra que veio a Jeremias
  rationale: Preserva a fórmula profética hebraica e a imagem concreta de uma palavra revelada que vem ao profeta, em português natural.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Expressa a origem da palavra e translitera o nome divino pessoal presente no texto hebraico.
- source_word: אַחֲרֵי כְּרֹת ... בְּרִית
  choice: depois que ... fez uma aliança
  rationale: Traduz naturalmente a expressão idiomática hebraica, literalmente 'cortar uma aliança', sem perder o caráter formal do compromisso.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: o rei Zedequias
  rationale: Emprega a forma portuguesa convencional do nome próprio e conserva o título.
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: com todo o povo que estava em Jerusalém
  rationale: Mantém a abrangência de כָּל e reproduz a oração relativa do hebraico de maneira clara.
- source_word: לִקְרֹא לָהֶם דְּרוֹר
  choice: para proclamar-lhes libertação
  rationale: קרא indica aqui uma proclamação formal, e דְּרוֹר designa libertação ou emancipação jurídica, não apenas liberdade em sentido abstrato.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido jurídico de דְּרוֹר
  choice: libertação
  alternative: liberdade; alforria
  rationale: '''Libertação'' conserva a ideia de emancipação formal exigida pelo contexto, enquanto ''liberdade'' pode soar mais abstrata e ''alforria'' pode ser excessivamente específica no português contemporâneo.'
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima à fórmula profética hebraica. 'Proclamar-lhes' mantém concisão e formalidade sem arcaísmo excessivo.
