    issue: Construção «haviam entrado na aliança de libertar»
    rationale: A expressão é sintaticamente pesada e não deixa clara a finalidade/obrigação associada à entrada na aliança. O hebraico apresenta os participantes da aliança e, em seguida, o conteúdo de seu compromisso.
  - severity: medium
    issue: «Não mais os mantivessem a seu serviço»
    rationale: Embora contextualizável, a expressão pode sugerir apenas a interrupção de um serviço, inclusive voluntário. O verbo hebraico, no cenário de manumissão, expressa a continuação de submeter essas pessoas à escravidão.
