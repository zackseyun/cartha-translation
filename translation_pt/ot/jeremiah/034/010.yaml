  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male slave and each man his female slave, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: pt
  text: Assim, todos os oficiais e todo o povo que haviam entrado na aliança, para que cada homem deixasse livre o seu escravo e cada homem a sua escrava[b], e para que não mais os escravizassem, obedeceram[a] e os libertaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouviram”. O verbo hebraico geralmente significa “ouvir” ou “escutar”, mas aqui tem o sentido de acatar ou obedecer, como mostra a ação que vem em seguida.
    reason: lexical_alternative
  - marker: b
    text: O hebraico distingue explicitamente “seu escravo” de “sua escrava”.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: obedeceram
  rationale: Embora שׁמע tenha como sentido básico “ouvir” ou “escutar”, neste contexto de compromisso pactual seguido de ação expressa cumprimento ou obediência.
- source_word: הַשָּׂרִים
  choice: oficiais
  rationale: Designa autoridades civis ou políticas; “oficiais” é atual e adequado ao contexto, sem o sentido dinástico que “príncipes” poderia sugerir.
- source_word: בָּאוּ בַבְּרִית
  choice: haviam entrado na aliança
  rationale: Reproduz de maneira natural a expressão hebraica para participar formalmente de uma aliança.
- source_word: לְשַׁלַּח ... וַיְשַׁלֵּחוּ
  choice: libertar ... os libertaram
  rationale: No contexto de manumissão, שׁלח significa deixar ir ou pôr em liberdade. “Libertar” comunica com clareza o ato jurídico-social e mantém a repetição lexical.
- source_word: אִישׁ ... וְאִישׁ
  choice: cada homem ... e cada homem
  rationale: Preserva a repetição distributiva e a forma masculina explícita do hebraico.
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: o seu escravo ... a sua escrava
  rationale: A combinação distingue explicitamente o escravizado do sexo masculino e a escravizada; o contexto de emancipação favorece “escravo/escrava”, não o mais brando “servo/serva”.
- source_word: חָפְשִׁים
  choice: deixando-os livres
  rationale: Expressa a condição de liberdade em que deveriam ser postos, com formulação natural em português.
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: para que não mais os mantivessem a seu serviço
  rationale: 'A construção indica finalidade: a libertação impediria que os antigos senhores continuassem a sujeitá-los ao trabalho. A formulação evita sugerir mero serviço voluntário.'
theological_decisions:
- issue: Terminologia da escravidão em contexto de emancipação
  choice: escravo e escrava
  alternative: servo e serva
  rationale: O versículo trata da libertação de pessoas submetidas a trabalho compulsório. “Escravo/escrava” torna visível essa condição social sem amenizá-la.
- issue: Linguagem distributiva marcada pelo gênero
  choice: cada homem ... e cada homem
  alternative: cada um ... e cada um
  rationale: A repetição de אִישׁ é explícita no hebraico. Mantê-la conserva tanto a distribuição individual da obrigação quanto a forma masculina do texto-fonte.
- issue: Sentido contextual de שׁמע
  choice: obedeceram
  alternative: ouviram
  rationale: A ação imediatamente narrada demonstra que não se trata apenas de percepção auditiva, mas de acatamento do compromisso assumido; a alternativa lexical permanece registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “cada homem” foi mantida deliberadamente por fidelidade à construção distributiva hebraica; “libertar” foi preferido a “mandar embora” para explicitar o contexto de manumissão.
