  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: pt
  text: E não lhes restará nenhum remanescente, pois trarei calamidade sobre os homens de Anatote, no ano de sua punição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no ano de sua visitação”. O termo hebraico pode significar “visitação” em sentido neutro, mas aqui se refere a uma visitação punitiva; por isso, “punição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִית
  choice: E não lhes restará remanescente algum
  rationale: שְׁאֵרִית designa aquilo que resta, especialmente um remanescente sobrevivente. “Remanescente” preserva o vínculo lexical e a ressonância profética; a construção “não lhes restará ... algum” expressa naturalmente o idiomatismo de לֹא תִהְיֶה לָהֶם.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão da declaração anterior de juízo. “Pois” mantém essa relação causal de modo conciso e digno.
- source_word: אָבִיא
  choice: trarei
  rationale: O hifil de בוא significa fazer vir, isto é, “trazer”. O futuro é adequado ao anúncio de juízo.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto de juízo, רָעָה indica uma ocorrência danosa ou desastrosa, não maldade moral. “Calamidade” comunica esse sentido com clareza.
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  choice: sobre os homens de Anatote
  rationale: אַנְשֵׁי significa literalmente “homens de”, e o contexto imediato trata dos homens de Anatote que conspiravam contra Jeremias. “Sobre” combina naturalmente com “trarei calamidade”.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: no ano de sua punição
  rationale: פְּקֻדָּה pode designar visitação, inspeção ou punição conforme o contexto. Neste oráculo de juízo, “punição” torna explícito o sentido contextual, enquanto “ano” preserva שְׁנַת.
theological_decisions:
- issue: Sentido de רָעָה quando Deus é o sujeito que a traz
  choice: calamidade
  alternative: mal; desgraça
  rationale: O contexto descreve o juízo divino como um acontecimento destrutivo. “Calamidade” preserva esse sentido sem sugerir que Deus pratique maldade moral.
- issue: Escopo de אַנְשֵׁי עֲנָתוֹת
  choice: os homens de Anatote
  alternative: o povo de Anatote
  rationale: O hebraico emprega um substantivo masculino plural específico, e o contexto identifica os conspiradores da cidade. A tradução conserva essa especificidade em vez de ampliá-la silenciosamente para toda a população.
- issue: Valor contextual de פְּקֻדָּה
  choice: punição
  alternative: visitação
  rationale: O termo admite uma ideia mais ampla de visitação ou intervenção, mas o contexto de ameaça estabelece seu caráter punitivo. A alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Remanescente” mantém a terminologia profética tradicional sem tornar a frase excessivamente arcaica; “Anatote” segue a forma portuguesa corrente do topônimo.
