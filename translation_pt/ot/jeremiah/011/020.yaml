id: JER.11.20
reference: Jeremiah 11:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: pt
  text: Mas, ó Yahweh dos Exércitos, que julgas com justiça e sondas os rins e o coração[a], deixa-me ver tua vingança contra eles[b], pois a ti revelei minha causa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os rins e o coração”, imagem hebraica para os pensamentos, desejos e motivações mais profundos.
    reason: cultural_note
  - marker: b
    text: Ou “teu ato de vingar” ou “tua vindicação”.
    reason: lexical_alternative
  - marker: c
    text: Ou “minha disputa” ou “minha queixa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Mas tu, ó Yahweh dos Exércitos
  rationale: A conjunção assume valor adversativo no fluxo do discurso; o pronome explicita naturalmente o vocativo em português. O nome divino é transliterado como Yahweh, e צְבָאוֹת é preservado no título tradicional e abrangente «dos Exércitos».
- source_word: שֹׁפֵט צֶדֶק
  choice: que julgas com justiça
  rationale: A oração relativa conserva o valor verbal contínuo do particípio, e «com justiça» expressa de modo natural a maneira justa de julgar.
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: e sondas os rins e o coração
  rationale: «Sondas» comunica exame profundo; os termos concretos da antropologia hebraica são mantidos, enquanto a nota explica seu sentido figurado.
- source_word: אֶרְאֶה
  choice: deixa-me ver
  rationale: Embora seja formalmente um imperfeito na primeira pessoa, o contexto de oração favorece uma petição de nuance volitiva.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: tua vingança contra eles
  rationale: «Vingança» é o equivalente lexical direto de נְקָמָה neste contexto de retribuição divina justa; «contra eles» exprime naturalmente a relação indicada por מִן.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: pois a ti revelei minha causa
  rationale: «Pois» introduz o fundamento da petição; a posição de «a ti» preserva a ênfase do hebraico. «Causa» mantém a dimensão jurídica de רִיב, e «revelei» conserva a imagem de descobrir ou expor.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva a referência explícita ao nome da aliança sem substituir o nome por um título.
- issue: Imagem antropológica «rins e coração»
  choice: manter a imagem concreta no texto principal
  alternative: pensamentos e motivações mais profundos; íntimo e coração
  rationale: A formulação hebraica é preservada para não apagar sua antropologia própria; a nota esclarece a função figurada para o leitor moderno.
- issue: Sentido de נִקְמָה
  choice: vingança
  alternative: ato de vingar; vindicação
  rationale: O termo pode incluir tanto a retribuição contra os adversários quanto a consequente vindicação do profeta. O texto mantém o equivalente mais direto e a nota registra a amplitude possível.
- issue: Sentido jurídico de רִיב
  choice: causa
  alternative: disputa; queixa
  rationale: «Causa» comunica de forma concisa o caráter de pleito apresentado a Deus sem excluir as nuances de disputa ou queixa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o vocativo solene, o paralelismo participial e as imagens concretas do hebraico, recorrendo a notas apenas onde a transparência ao original poderia dificultar a compreensão.
