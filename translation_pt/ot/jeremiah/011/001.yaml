lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética tradicional e a amplitude de דָּבָר, que pode designar palavra, assunto ou mensagem.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Reproduz naturalmente em português o idioma hebraico da palavra divina que chega ao profeta.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma consagrada do nome em português.
- source_word: מֵאֵת
  choice: da parte de
  rationale: Expressa com clareza a origem da palavra em Yahweh e soa mais natural neste contexto do que o simples 'de'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém o marcador discursivo hebraico e indica que a fala divina prossegue no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome próprio e a nota registra a convenção tradicional alternativa.
