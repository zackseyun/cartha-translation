  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: pt
  text: Mas você, não ore por este povo, nem eleve clamor ou oração em favor deles, pois não estou ouvindo quando clamam a mim por causa da calamidade deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica também pode significar “mal” em outros contextos; aqui, provavelmente se refere à calamidade do povo, que o levou a clamar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção seguida do pronome independente introduz uma mudança enfática e contrastiva na fala dirigida a Jeremias.
- source_word: אַל תִּתְפַּלֵּל
  choice: não ore
  rationale: A partícula negativa com a forma verbal expressa proibição; “orar” conserva o sentido amplo do verbo sem restringi-lo a um termo técnico como “interceder”.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: por este povo
  rationale: A preposição indica ação em benefício ou em favor de alguém; a formulação é natural e mantém o sentido intercessório.
- source_word: וְאַל תִּשָּׂא
  choice: nem eleve
  rationale: נשא traz a imagem de levantar ou elevar. “Nem eleve” preserva essa imagem e liga naturalmente a segunda proibição à primeira.
- source_word: בַעֲדָם
  choice: em favor deles
  rationale: A expressão explicita que o clamor e a oração seriam apresentados em benefício do povo.
- source_word: רִנָּה וּתְפִלָּה
  choice: clamor ou oração
  rationale: רנה designa aqui um clamor urgente, não um grito de alegria. Embora a conjunção seja formalmente “e”, “ou” é natural em português sob o alcance de uma proibição.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: pois não estou ouvindo
  rationale: A construção negativa com particípio apresenta a recusa divina de dar ouvidos; a forma progressiva conserva mais diretamente o aspecto da expressão hebraica, sem convertê-la automaticamente em futuro.
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: quando clamam a mim
  rationale: A expressão temporal é vertida de modo corrente; “clamam a mim” conserva a direção do apelo indicada por אֵלַי.
- source_word: בְּעַד רָעָתָם
  choice: por causa da calamidade que os atingiu
  rationale: רעה pode indicar mal moral ou calamidade. Neste contexto, designa mais provavelmente a situação desastrosa que leva o povo a clamar; “que os atingiu” torna explícita essa relação sem atribuir maldade ao conteúdo do clamor.
theological_decisions:
- issue: Sentido de רָעָה na cláusula final
  choice: calamidade que os atingiu
  alternative: mal ou maldade deles
  rationale: O contexto descreve o povo clamando em situação de juízo e aflição. A leitura como calamidade explica a ocasião do clamor, ao passo que “maldade” poderia sugerir indevidamente que eles clamam a Deus em favor de seu próprio pecado. A nota preserva a amplitude lexical do hebraico.
- issue: Valor temporal de אֵינֶנִּי שֹׁמֵעַ
  choice: não estou ouvindo
  alternative: não ouvirei
  rationale: A construção participial favorece uma recusa apresentada como vigente. Evitou-se resolver o enunciado exclusivamente como futuro, embora essa seja uma tradução contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de termos ligados à oração e a imagem de “elevar” o clamor foram mantidas, evitando linguagem denominacional ou excessivamente técnica.
