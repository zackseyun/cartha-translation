  naturalness: O português é claro e de registro bíblico moderno. «Como é hoje» é mais direto e fiel do que «como se vê hoje». A pontuação da fala deve seguir a convenção portuguesa, com o ponto final dentro das aspas.
  terminology: «Confirmar o juramento» é uma opção defensável para הָקִים neste contexto. «Pais», embora possa significar progenitores em português contemporâneo, mantém aqui o uso bíblico e genealógico de «pais/antepassados»; a nota explicita a alternativa. «Yahweh» e «Amém» estão adequados.
