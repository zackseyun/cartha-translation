reference: Jeremiah 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: pt
  text: 'para que eu confirme o juramento que fiz aos seus pais[a], de lhes dar uma terra que mana leite e mel, como é hoje.” Então respondi: “Amém, Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ligada à ordem precedente e preserva a força final da expressão hebraica.
- source_word: הָקִים
  choice: eu confirme
  rationale: No hifil, tendo “juramento” por objeto, comunica fazer valer ou ratificar o que foi jurado; “confirme” preserva essa ideia sem sugerir que o juramento estivesse incompleto.
- source_word: הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: o juramento que fiz
  rationale: Expressão idiomática em português para o cognato hebraico “o juramento que jurei”, evitando repetição pouco natural sem perder o sentido.
- source_word: לַאֲבוֹתֵיכֶם
  choice: aos seus pais
  rationale: Mantém a forma masculina explícita do hebraico e sua possível referência pactual aos antepassados patriarcais; a alternativa mais abrangente consta em nota.
- source_word: לָתֵת לָהֶם
  choice: de lhes dar
  rationale: Conserva a relação sintática com o conteúdo do juramento e usa colocação pronominal natural no registro escrito.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: uma terra que mana leite e mel
  rationale: Preserva a imagem hebraica tradicional de abundância com formulação corrente e digna em português bíblico.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: Explicita com naturalidade que a realidade presente confirma a dádiva prometida, preservando a referência ao dia presente.
- source_word: וָאַעַן וָאֹמַר
  choice: Então respondi
  rationale: O binômio hebraico é uma fórmula narrativa; condensá-lo evita a rigidez de “respondi e disse” sem perda de conteúdo em português.
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a resposta tradicional de assentimento, sem resolver interpretativamente seu alcance como “assim seja” ou “verdadeiramente”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, enquanto “SENHOR” reflete a tradição de substituição na leitura.
- issue: Alcance de לַאֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A escolha principal conserva a forma masculina e a possível evocação dos patriarcas, enquanto a nota registra o sentido genealógico mais amplo sem decidir além do hebraico.
- issue: Valor de הָקִים com “juramento”
  choice: confirme
  alternative: cumpra
  rationale: “Confirme” mantém a ideia de fazer valer ou estabelecer o juramento; “cumpra” é contextualmente possível, mas enfatiza mais diretamente sua execução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a imagem bíblica “mana leite e mel” e o nome Yahweh; condensa a fórmula narrativa hebraica para evitar artificialidade. O marcador [a] aparece no texto principal.
