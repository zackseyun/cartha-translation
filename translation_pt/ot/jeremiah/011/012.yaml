source:
  edition: WLC
  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: pt
  text: Então as cidades de Judá e os habitantes de Jerusalém irão e clamarão aos deuses aos quais queimam incenso; mas esses deuses de modo algum os salvarão no tempo da sua aflição[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo da sua calamidade” ou “no tempo do seu desastre”.
    reason: alternativa lexical para רָעָתָם
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: Então ... irão
  rationale: O perfeito qal com waw, dentro da sequência profética, aponta para uma ação futura decorrente do contexto anterior. “Então” expressa essa progressão sem ampliar o sentido.
- source_word: עָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Reproduz de modo direto e claro a cadeia construta hebraica.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: e os habitantes de Jerusalém
  rationale: O particípio designa coletivamente a população residente; “habitantes” é natural e preciso em português moderno.
- source_word: וְזָעֲקוּ אֶל
  choice: e clamarão aos
  rationale: זעק descreve um grito urgente por socorro. “Clamar” preserva a intensidade e se encaixa no registro bíblico corrente sem ser obscuro.
- source_word: הָאֱלֹהִים
  choice: os deuses
  rationale: O contexto e a oração relativa sobre queimar incenso indicam divindades falsas no plural.
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: aos quais queimam incenso
  rationale: A oração relativa identifica os deuses pelo ato cúltico dirigido a eles. “Queimar incenso” é uma tradução transparente de קטר neste contexto.
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: mas esses deuses de modo algum os salvarão
  rationale: O infinitivo absoluto junto do verbo finito reforça a negação. “De modo algum” transmite essa ênfase com naturalidade; a repetição de “esses deuses” torna inequívoco o sujeito em português.
- source_word: בְּעֵת רָעָתָם
  choice: no tempo da sua aflição
  rationale: רָעָה aqui denota a adversidade sofrida, não o mal moral. “Aflição” mantém a amplitude do termo e é compreensível em português atual.
theological_decisions:
- issue: Referente de אֱלֹהִים
  choice: deuses falsos adorados por Judá e Jerusalém
  alternative: um “deus” genérico
  rationale: A menção ao incenso oferecido a essas divindades e o contexto imediato da denúncia da idolatria exigem o plural “deuses”, sem necessidade de inserir no texto o qualificativo interpretativo “falsos”.
- issue: Ênfase de הוֹשֵׁעַ לֹא יוֹשִׁיעוּ
  choice: de modo algum os salvarão
  alternative: não os salvarão
  rationale: A construção com infinitivo absoluto reforça a negação; a tradução escolhida conserva essa ênfase sem acrescentar uma afirmação teológica além da gramática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se “irão e clamarão” para representar os dois verbos hebraicos, e o marcador da nota foi colocado após “aflição”, termo ao qual a alternativa lexical se refere.
