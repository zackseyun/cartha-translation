source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: pt
  text: E Yahweh dos Exércitos, que plantou você, anunciou uma calamidade contra você por causa da maldade da casa de Israel e da casa de Judá, maldade que eles fizeram para si, provocando-me à ira ao queimarem incenso[a] a Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas fumegantes”. O verbo hebraico se refere à produção de fumaça em uma oferta ritual, muitas vezes pela queima de incenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: E Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de modo claro e atual, preservando a força do título.
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: que plantou você
  rationale: Mantém a metáfora vegetal do contexto imediato e a referência feminina singular do hebraico sem acrescentar sua identificação.
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: anunciou uma calamidade contra você
  rationale: Neste primeiro uso, רָעָה designa a calamidade pronunciada como juízo, não maldade moral; 'anunciou' expressa naturalmente דִּבֶּר.
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: a maldade da casa de Israel e da casa de Judá
  rationale: Aqui a mesma raiz tem sentido moral. 'Casa' preserva a expressão corporativa e familiar do hebraico.
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: maldade que fizeram para si mesmas
  rationale: A repetição de 'maldade' esclarece o antecedente, e 'para si mesmas' conserva o dativo לָהֶם e seu possível sentido reflexivo ou resultativo.
- source_word: לְהַכְעִסֵנִי
  choice: provocando-me à ira
  rationale: Expressa o valor causativo do hifil e mantém a fala divina em primeira pessoa.
- source_word: לְקַטֵּר לַבָּעַל
  choice: ao queimarem incenso a Baal
  rationale: קטר descreve a produção ritual de fumaça, frequentemente pela queima de incenso; a formulação é precisa e natural em português.
theological_decisions:
- issue: Tradução do título יהוה צבאות
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh dos exércitos celestiais
  rationale: Preserva o nome da aliança e traduz o título sem restringir explicitamente os exércitos a uma única categoria.
- issue: Dois sentidos de רעה no mesmo versículo
  choice: calamidade no primeiro uso e maldade no segundo
  alternative: mal em ambos os usos; desgraça e perversidade
  rationale: Distingue o juízo anunciado por Deus do mal moral cometido por Israel e Judá, preservando o jogo lexical sem sugerir equivalência moral entre ambos.
- issue: Valor de לָהֶם em אֲשֶׁר עָשׂוּ לָהֶם
  choice: para si mesmas
  alternative: que cometeram; que fizeram para provocar-me
  rationale: Conserva no texto a possibilidade reflexiva ou resultativa do dativo, em vez de omiti-la ou fundi-la silenciosamente com a oração de propósito seguinte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'você' para evitar o tom arcaizante de 'tu/ti' em variedades que não o usam correntemente. A repetição de 'maldade' evita ambiguidade sintática, e o feminino plural 'si mesmas' retoma as duas 'casas'.
