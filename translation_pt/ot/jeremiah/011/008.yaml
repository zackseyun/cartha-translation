source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּ֣לְכ֔וּ אִ֕ישׁ בִּ/שְׁרִיר֖וּת לִבָּ֣/ם הָ/רָ֑ע וָ/אָבִ֨יא עֲלֵי/הֶ֜ם אֶֽת כָּל דִּבְרֵ֧י הַ/בְּרִית הַ/זֹּ֛את אֲשֶׁר צִוִּ֥יתִי לַ/עֲשׂ֖וֹת וְ/לֹ֥א עָשֽׂוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: pt
  text: Contudo, eles não ouviram nem inclinaram os ouvidos[a]; pelo contrário, cada um seguiu a obstinação do seu coração mau. Por isso, fiz cair sobre eles todas as palavras desta aliança, as quais lhes ordenei que cumprissem[b], mas eles não as cumpriram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não escutaram”; no contexto, a expressão também envolve a recusa em atender e obedecer.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “todas as palavras desta aliança”; a expressão pode incluir os juízos ameaçados pela aliança, e não apenas seus mandamentos.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. Em paralelo com “inclinar os ouvidos”, “ouviram” preserva a imagem auditiva e, no contexto da aliança, também sugere a recusa em atender e obedecer.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: inclinaram os ouvidos
  rationale: Mantém a metáfora hebraica de voltar atentamente o ouvido, em formulação digna e compreensível em português moderno.
- source_word: וַיֵּלְכוּ אִישׁ
  choice: cada um seguiu
  rationale: אִישׁ tem função distributiva, “cada um”, sem restringir a referência aos homens. “Seguiu” comunica naturalmente a metáfora hebraica de andar como modo de conduta.
- source_word: בִּשְׁרִירוּת
  choice: a obstinação
  rationale: שׁרירות denota teimosia, obstinação e persistência na própria vontade. “Obstinação” se ajusta ao registro e ao contexto de rebeldia contra a aliança.
- source_word: לִבָּם הָרָע
  choice: do seu coração mau
  rationale: O hebraico traz “coração” no singular com sufixo plural, em construção distributiva. Após “cada um”, o singular “seu coração mau” expressa naturalmente que cada pessoa agiu segundo a maldade interior.
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: Por isso, fiz cair sobre eles
  rationale: A sequência apresenta a ação divina como consequência da rebeldia. “Fiz cair sobre eles” transmite de modo idiomático o sentido de trazer sobre alguém as sanções anunciadas.
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: todas as palavras desta aliança
  rationale: Preserva literalmente a amplitude de דִּבְרֵי, sem limitar a expressão apenas a mandamentos, termos ou maldições.
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת
  choice: as quais lhes ordenei que cumprissem
  rationale: “Cumprir” é português natural para realizar as palavras ou exigências de uma aliança; “lhes” explicita pelo contexto o destinatário da ordem.
- source_word: וְלֹא עָשׂוּ
  choice: mas eles não as cumpriram
  rationale: O pronome “as” retoma “palavras” e torna explícito o objeto implícito do verbo hebraico, preservando a ênfase na falta de execução.
theological_decisions:
- issue: Alcance das “palavras desta aliança”
  choice: Manter “todas as palavras desta aliança” no texto principal.
  alternative: “todas as maldições desta aliança” ou “todos os termos desta aliança”
  rationale: Embora o contexto permita que a expressão inclua especialmente os juízos ameaçados pela aliança, o hebraico diz “palavras”. A tradução conserva essa amplitude e evita estreitar a interpretação.
- issue: Sentido de שׁמע no contexto da aliança
  choice: Traduzir por “ouviram”, com nota indicando a dimensão de atender e obedecer.
  alternative: “obedeceram”
  rationale: A recusa em obedecer está implicada, mas a associação imediata com “inclinar os ouvidos” favorece a preservação da imagem auditiva sem eliminar a força responsiva do verbo.
- issue: Referência distributiva de אִישׁ
  choice: “cada um”
  alternative: “cada homem”
  rationale: Neste contexto, אִישׁ distribui a afirmação entre os integrantes do povo e não destaca especificamente o sexo masculino.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A metáfora de inclinar os ouvidos foi preservada; a metáfora de “andar” foi vertida naturalmente por “seguir”. Os pronomes no singular depois de “cada um” conservam a distribuição individual expressa no hebraico.
