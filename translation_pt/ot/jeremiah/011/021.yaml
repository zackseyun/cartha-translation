id: JER.11.21
reference: Jeremiah 11:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh a respeito dos homens de Anatote que procuram tirar a sua vida[a] e dizem: “Não profetize em nome de Yahweh, senão você morrerá pelas nossas mãos”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é, literalmente, “procuram a sua vida”; aqui significa que tentam matá-lo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz, literalmente, “e você não morrerá pelas nossas mãos”. No contexto, a frase funciona como uma ameaça: se Jeremias continuar profetizando, eles o matarão.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a conclusão decorrente do contexto anterior e soa natural em português atual.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Conserva a fórmula profética solene e apresenta diretamente o nome divino.
- source_word: עַל אַנְשֵׁי עֲנָתוֹת
  choice: a respeito dos homens de Anatote
  rationale: עַל introduz o objeto do pronunciamento, enquanto אַנְשֵׁי mantém a referência masculina específica aos homens da cidade.
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: que procuram tirar a sua vida
  rationale: Expressa com clareza o sentido do idioma hebraico — procurar matar alguém — sem perder sua referência à vida da pessoa.
- source_word: לֵאמֹר
  choice: e dizem
  rationale: Introduz naturalmente em português a fala direta dos homens, tornando explícita a relação sintática do hebraico.
- source_word: לֹא תִנָּבֵא בְּשֵׁם יְהוָה
  choice: Não profetize em nome de Yahweh
  rationale: Reproduz a proibição singular e a ideia de falar sob a autoridade do nome divino.
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: senão você morrerá pelas nossas mãos
  rationale: No contexto, a construção funciona como ameaça condicionada à desobediência. A nota preserva a forma negativa incomum do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama; a transliteração Yahweh preserva o nome pessoal sem substituí-lo por um título.
- issue: Referência masculina em אַנְשֵׁי עֲנָתוֹת
  choice: os homens de Anatote
  alternative: o povo de Anatote
  rationale: A escolha conserva a forma masculina plural do texto e evita generalizá-la sem necessidade.
- issue: Força da oração final וְלֹא תָמוּת בְּיָדֵנוּ
  choice: 'ameaça: “senão você morrerá pelas nossas mãos”'
  alternative: “e você não morrerá pelas nossas mãos”
  rationale: O contexto favorece uma ameaça, mas a redação hebraica é formalmente negativa; essa tensão é mantida em nota, sem ocultar a alternativa literal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Assim diz” mantém a solenidade da fórmula profética; “você” torna inequívoco o destinatário singular. As notas preservam o idioma hebraico e a forma negativa incomum da ameaça.
