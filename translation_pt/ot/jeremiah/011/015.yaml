base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: pt
  text: Que direito tem a minha amada de estar em minha casa[a], ao praticar suas muitas tramas perversas? Poderá a carne consagrada[b] afastar de você a sua maldade?[c] Então você se alegra!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que faz a minha amada em minha casa...?” A “casa” refere-se ao templo do SENHOR.'
    reason: lexical_alternative
  - marker: b
    text: “Carne consagrada” provavelmente se refere à carne dos sacrifícios. No contexto, a pergunta parece negar que o rito sagrado possa afastar a maldade persistente.
    reason: cultural_note
  - marker: c
    text: 'O hebraico desta parte é difícil. Mais literalmente: “E carne santa passará de sobre você, pois a sua maldade — então você se alegrará”. “Maldade” também pode ser traduzido por “calamidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: Que direito tem a minha amada de estar em minha casa
  rationale: 'A construção idiomática מֶה לְ... בְּ... expressa uma contestação retórica: “que direito” ou “o que faz” alguém em certo lugar. “Minha amada” preserva a linguagem relacional e a ironia dirigida à comunidade feminina de Judá/Jerusalém; “minha casa” mantém a imagem hebraica, embora no contexto designe o templo.'
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: depois de praticar suas muitas tramas perversas
  rationale: A sintaxe hebraica é difícil. מְזִמָּה pode indicar plano ou trama e aqui tem força moral negativa. A formulação temporal liga naturalmente a conduta perversa à pergunta retórica sem esconder a dificuldade textual, registrada em nota.
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: a carne consagrada
  rationale: A expressão significa literalmente “carne de santidade” ou “carne santa” e provavelmente se refere à carne de sacrifícios. “Carne consagrada” conserva a imagem cultual em português atual.
- source_word: יַעַבְרוּ מֵעָלָיִךְ
  choice: afastar de você
  rationale: עבר significa primariamente “passar”. Com מֵעַל, pode transmitir a ideia de algo ser retirado ou afastado. A pergunta explicita a provável lógica contextual, segundo a qual o rito não elimina a maldade, enquanto a nota preserva a redação mais literal.
- source_word: רָעָתֵכִי
  choice: a sua maldade
  rationale: רָעָה pode significar tanto maldade quanto calamidade. O contexto de tramas perversas e falsa confiança ritual favorece o sentido moral, sem excluir a alternativa em nota.
- source_word: תַּעֲלֹזִי
  choice: você se alegra
  rationale: O verbo expressa alegria intensa ou exultação. “Você se alegra” é corrente e preserva a segunda pessoa feminina e o tom irônico.
theological_decisions:
- issue: Identidade de “minha amada”
  choice: Judá/Jerusalém, como povo da aliança, é interpelada ironicamente no feminino.
  alternative: Uma adoradora individual ou a comunidade do templo sem ênfase irônica.
  rationale: Os pronomes e verbos femininos apontam para uma entidade coletiva feminina. Manter “minha amada” conserva a tensão entre vínculo de aliança e infidelidade.
- issue: Função da carne consagrada
  choice: A pergunta nega implicitamente que a participação no sacrifício possa afastar a maldade persistente.
  alternative: A carne sacrificial se afasta da mulher, ou o texto fala da remoção de uma calamidade; a linha hebraica permanece textualmente difícil.
  rationale: A proximidade entre carne consagrada, maldade e alegria sustenta a crítica à confiança no rito, mas a nota registra a forma literal e a alternativa sem transformar a inferência em certeza absoluta.
- issue: Sentido de רָעָה
  choice: Maldade moral.
  alternative: Calamidade ou desgraça resultante do juízo.
  rationale: O contexto imediato acusa práticas perversas, favorecendo “maldade”; contudo, a polissemia hebraica é genuína e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A interpelação feminina foi mantida por meio de “amada” e “você”. A ordem das notas acompanha os elementos que explicam, e a pontuação ressalta o tom retórico e irônico sem resolver em excesso a sintaxe hebraica.
