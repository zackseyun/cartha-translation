reference: Jeremiah 11:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: pt
  text: Pois teus deuses, ó Judá, tornaram-se tão numerosos quanto tuas cidades; e vocês levantaram tantos altares à Vergonha[a] quantas são as ruas de Jerusalém, altares para fazer ofertas a Baal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vergonha” é uma designação depreciativa para uma divindade pagã, provavelmente Baal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “altares para queimar incenso a Baal”. O verbo hebraico muitas vezes se refere especificamente a fazer uma oferta em fumaça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ligada ao contexto anterior e conserva a força explicativa da conjunção.
- source_word: מִסְפַּר
  choice: tão numerosos quanto / tantos... quantas
  rationale: Expressa a correspondência numérica de modo natural em português, preservando os dois paralelos do hebraico.
- source_word: עָרֶיךָ
  choice: tuas cidades
  rationale: Traduz o plural de עִיר com sufixo masculino singular, dirigindo-se a Judá como entidade personificada.
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: teus deuses, ó Judá, tornaram-se
  rationale: 'Mantém Judá como vocativo e entende o perfeito de היה como estado resultante: os deuses chegaram a igualar em número as cidades.'
- source_word: חֻצוֹת
  choice: ruas
  rationale: Equivalente atual e acessível para vias ou espaços públicos urbanos; 'praças' também é possível em certos contextos.
- source_word: שַׂמְתֶּם
  choice: vocês levantaram
  rationale: No contexto de altares, שׂים indica colocá-los ou estabelecê-los. A forma 'vocês' preserva a mudança do singular coletivo para a segunda pessoa do plural.
- source_word: מִזְבְּחוֹת
  choice: altares
  rationale: Equivalente comum e direto do substantivo cultual no plural.
- source_word: לַבֹּשֶׁת
  choice: à Vergonha
  rationale: בֹּשֶׁת significa literalmente 'vergonha' e funciona aqui como designação depreciativa de uma divindade pagã. A inicial maiúscula preserva seu uso quase titular sem substituir o termo por uma identificação interpretativa.
- source_word: לְקַטֵּר
  choice: para fazer ofertas
  rationale: O verbo designa a produção de fumaça em uma oferta, muitas vezes pela queima de incenso. Como o objeto não é expresso no hebraico, a formulação ampla evita especificá-lo indevidamente; a tradução mais específica consta em nota.
- source_word: לַבָּעַל
  choice: a Baal
  rationale: Forma usual do nome da divindade, com a preposição indicando o destinatário ou a dedicação do ato cultual.
theological_decisions:
- issue: Judá é tratado no singular, mas o verbo שַׂמְתֶּם está na segunda pessoa do plural
  choice: Usar 'teus/tuas' com Judá personificado e depois 'vocês levantaram' para seus habitantes coletivamente.
  alternative: Uniformizar todo o versículo no singular ou no plural.
  rationale: A mudança de número está no texto hebraico e deve permanecer perceptível, sem ser corrigida silenciosamente.
- issue: Identificação de לַבֹּשֶׁת
  choice: Traduzir literalmente como 'Vergonha' no texto e explicar em nota a provável referência a Baal.
  alternative: Substituir diretamente por 'Baal' ou traduzir como 'coisa vergonhosa'.
  rationale: A opção mantém a linguagem polêmica do profeta e, ao mesmo tempo, não apresenta como explícita uma identificação que é inferida do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O vocativo 'ó Judá' preserva a solenidade sem arcaísmo excessivo. A alternância entre 'teus/tuas' e 'vocês' é deliberada, pois reproduz a passagem do singular personificado ao plural coletivo no hebraico.
