  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: pt
  text: Ouçam as palavras desta aliança e transmitam-nas aos homens de Judá[a] e aos habitantes de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “homem de Judá”; a forma singular pode ter sentido coletivo ou distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural de שׁמע pede atenção às palavras da aliança. “Ouçam” preserva a forma direta sem explicitar além do texto a ideia de obedecer.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: as palavras desta aliança
  rationale: Mantém de modo natural o substantivo plural דְּבָרִים em estado construto, o termo teológico בְּרִית e o demonstrativo.
- source_word: וְדִבַּרְתָּם
  choice: e transmitam-nas
  rationale: A forma verbal está no singular, mas a fala divina parece dirigir-se a mais de um ouvinte, como indica o imperativo plural anterior. Em português, o plural mantém a continuidade da ordem; “-nas” retoma explicitamente “as palavras”. “Transmitam” expressa fala comunicada aos destinatários sem acrescentar a força técnica de “proclamar”.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: aos homens de Judá
  rationale: אִישׁ é singular na forma, mas tem valor coletivo ou distributivo. “Aos homens de Judá” conserva a referência masculina e soa natural em português.
- source_word: וְעַל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: e aos habitantes de Jerusalém
  rationale: No paralelismo com אֶל, עַל introduz o público ao qual as palavras devem ser comunicadas. O particípio substantivado יֹשְׁבֵי é bem representado por “habitantes”.
theological_decisions:
- issue: Linguagem coletiva de אִישׁ יְהוּדָה
  choice: aos homens de Judá
  alternative: a cada homem de Judá; ao povo de Judá
  rationale: A tradução principal preserva a forma masculina do hebraico e seu sentido coletivo. A nota registra o possível valor distributivo, evitando que essa nuance seja perdida.
- issue: Alternância de número entre שִׁמְעוּ e וְדִבַּרְתָּם
  choice: ambos os verbos no plural em português
  alternative: Ouçam... e transmita-as
  rationale: O hebraico passa do imperativo plural para uma forma verbal de segunda pessoa masculina singular com sufixo de objeto. Como a identidade do destinatário singular não é explicitada neste versículo e uma alternância literal seria abrupta e obscura em português, mantém-se o plural como comando continuado, sem resolver a questão em favor de um indivíduo nomeado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Aliança” conserva o vocabulário bíblico corrente; “habitantes” é formal sem ser arcaico.
