  - severity: low
    issue: 'A nota diz: «Hebraico: ‘a cada homem de Judá’».'
    rationale: O hebraico traz literalmente «homem de Judá»; o valor de «cada» é uma possibilidade distributiva inferida da construção, não uma citação literal.
