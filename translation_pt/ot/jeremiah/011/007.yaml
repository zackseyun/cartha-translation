  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: pt
  text: 'Pois adverti solenemente os seus pais desde o dia em que os tirei da terra do Egito até o dia de hoje, levantando-me cedo e advertindo-os, dizendo: “Escutem a minha voz[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Obedeçam à minha voz”. Em contextos de aliança, a expressão hebraica pode significar escutar de modo a obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior e mantém uma ligação discursiva natural em português.
- source_word: הָעֵד הַעִדֹתִי
  choice: adverti solenemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. No contexto da aliança, עוּד tem força de advertência e testemunho solene.
- source_word: בַּאֲבוֹתֵיכֶם
  choice: os seus pais
  rationale: Preserva o termo familiar masculino e a formulação histórico-pactual do hebraico, em vez de generalizá-lo como “antepassados”.
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: desde o dia em que os tirei da terra do Egito
  rationale: A construção temporal liga o início da advertência ao êxodo. Embora עלה no hifil seja literalmente “fazer subir”, “tirar da terra do Egito” comunica de modo natural o conhecido sentido idiomático em português.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressa a continuidade das advertências desde o êxodo até o momento profético.
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: Repetidas vezes os adverti
  rationale: O idioma “levantar cedo e advertir” denota ação diligente, insistente e reiterada. A formulação escolhida transmite seu sentido em português corrente sem sugerir que o foco seja literalmente o horário da manhã.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: É o introdutor comum de discurso direto.
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: Escutem a minha voz
  rationale: Preserva a imagem auditiva do hebraico e deixa implícita a dimensão de obediência, explicitada na nota.
theological_decisions:
- issue: Força pactual de שִׁמְעוּ בְּקוֹלִי
  choice: Escutem a minha voz
  alternative: Obedeçam à minha voz
  rationale: A expressão frequentemente implica obedecer em contextos de aliança, mas sua forma hebraica é auditiva. O texto principal preserva essa tensão lexical e a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Repetidas vezes” verte funcionalmente o idioma hebraico de diligência e persistência; “os seus pais” conserva a linguagem histórica da aliança.
