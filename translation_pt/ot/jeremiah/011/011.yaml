reference: Jeremiah 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh: “Eis que estou trazendo sobre eles uma calamidade[a] da qual não poderão escapar. Clamarão a mim, mas não lhes darei ouvidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desgraça” ou “desastre”. Aqui, o hebraico רָעָה se refere a uma calamidade destrutiva, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a relação de consequência com a acusação precedente e soa natural no registro profético.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula hebraica do mensageiro profético e representa o nome divino como nome próprio.
- source_word: הִנְנִי מֵבִיא
  choice: Eis que estou trazendo
  rationale: “Eis que” conserva a solenidade e a imediatez do anúncio, enquanto a construção progressiva representa o particípio que indica uma ação iminente ou já decidida.
- source_word: רָעָה
  choice: uma calamidade
  rationale: Neste contexto, o termo designa uma desgraça destrutiva enviada como juízo, não o mal moral. “Calamidade” comunica isso com clareza em português.
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: da qual não poderão escapar
  rationale: Traduz idiomaticamente a ideia de não conseguirem sair ou livrar-se da calamidade.
- source_word: וְזָעֲקוּ אֵלַי
  choice: Clamarão a mim
  rationale: “Clamar” expressa um pedido urgente de socorro em meio à aflição.
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: mas não lhes darei ouvidos
  rationale: A expressão comunica a recusa de atender ao clamor, e não mera incapacidade auditiva; “mas” explicita naturalmente o contraste contextual.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: calamidade
  alternative: mal; desgraça; desastre
  rationale: O contexto indica uma ocorrência destrutiva como juízo da aliança. A escolha evita sugerir que Yahweh pratique o mal moral, sem ocultar que ele próprio anuncia trazer a calamidade.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Recusa divina de ouvir o clamor
  choice: não lhes darei ouvidos
  alternative: não os ouvirei
  rationale: O verbo שׁמע, neste contexto, envolve atender ou responder. A tradução preserva a severidade da recusa sem afirmar que Deus literalmente não perceberá o clamor.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A fórmula profética e “Eis que” mantêm a solenidade do original sem recorrer a sintaxe arcaica.
