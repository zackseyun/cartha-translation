  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י פֹקֵ֖ד עֲלֵי/הֶ֑ם הַ/בַּֽחוּרִים֙ יָמֻ֣תוּ בַ/חֶ֔רֶב בְּנֵי/הֶם֙ וּ/בְנ֣וֹתֵי/הֶ֔ם יָמֻ֖תוּ בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos: “Eis que vou castigá-los.[a] Os jovens morrerão à espada, e seus filhos e suas filhas morrerão de fome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que trarei juízo sobre eles”. O hebraico emprega literalmente o verbo “visitar” com a expressão “sobre eles”; em contextos de juízo, esse verbo frequentemente indica chamar alguém a prestar contas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a conclusão decorrente do contexto anterior de modo natural e mantém a relação inferencial do hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro com cadência solene, mas compreensível no português atual.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de maneira estabelecida, sem restringir a expressão apenas a forças humanas.
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Eis que vou castigá-los
  rationale: הִנְנִי enfatiza a ação divina iminente, enquanto פקד com עַל, neste contexto judicial, indica chamar à responsabilidade ou punir.
- source_word: הַבַּחוּרִים
  choice: Os jovens
  rationale: Designa homens jovens, provavelmente em idade de combate; em português, o artigo e o contexto tornam natural a referência masculina.
- source_word: יָמֻתוּ בַחֶרֶב
  choice: morrerão pela espada
  rationale: Mantém a fórmula hebraica de morte violenta por guerra ou ataque e seu paralelismo com a fome.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Conserva a distinção explícita entre descendentes do sexo masculino e feminino.
- source_word: יָמֻתוּ בָּרָעָב
  choice: morrerão de fome
  rationale: Comunica em português idiomático a morte causada pela רָעָב, que aqui denota fome coletiva ou escassez severa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido judicial de הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Eis que vou castigá-los
  alternative: Eis que trarei juízo sobre eles; eis que os visitarei
  rationale: A construção anuncia ação judicial divina iminente. “Castigá-los” é clara e não transforma a expressão em um termo teológico mais técnico do que o hebraico exige.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a ênfase profética; “vou castigá-los” expressa a iminência de forma idiomática. A coordenação com “e” evita uma pausa excessivamente rígida entre os dois resultados do juízo.
