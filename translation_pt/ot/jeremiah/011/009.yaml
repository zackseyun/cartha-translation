id: JER.11.9
reference: Jeremiah 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י נִֽמְצָא קֶ֨שֶׁר֙ בְּ/אִ֣ישׁ יְהוּדָ֔ה וּ/בְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Foi descoberta uma conspiração[a] entre os homens de Judá[b] e entre os habitantes de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma trama foi descoberta” ou “foi descoberta uma conspiração traiçoeira”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o homem de Judá”; o singular tem sentido coletivo neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “E ... disse” preserva essa ligação sem acrescentar uma relação temporal ou lógica mais específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלָי
  choice: me disse
  rationale: A construção portuguesa com pronome oblíquo é a forma natural de expressar “disse a mim”.
- source_word: נִמְצָא
  choice: Foi descoberta
  rationale: O nifal perfeito de מצא indica que a conspiração foi encontrada ou revelada. “Foi descoberta” comunica naturalmente o resultado da descoberta.
- source_word: קֶשֶׁר
  choice: uma conspiração
  rationale: Neste contexto profético, קֶשֶׁר designa uma trama ou conspiração, possivelmente com caráter de traição.
- source_word: בְּאִישׁ יְהוּדָה
  choice: entre os homens de Judá
  rationale: Embora אִישׁ esteja no singular, tem sentido coletivo neste contexto. O plural em português torna esse sentido claro sem apagar a forma hebraica, registrada em nota.
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: e entre os habitantes de Jerusalém
  rationale: O particípio substantivado de ישב refere-se aos que moram em Jerusalém; “habitantes” é claro, digno e corrente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Natureza de קֶשֶׁר
  choice: conspiração
  alternative: trama; conspiração traiçoeira
  rationale: O termo pode envolver rebelião ou traição, mas o versículo não especifica aqui todos os contornos políticos ou religiosos. “Conspiração” preserva a amplitude contextual.
translation_notes:
  register: Português moderno, claro e solene, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A ordem da frase segue de perto o hebraico, enquanto “me disse” e “foi descoberta” mantêm naturalidade em português.
