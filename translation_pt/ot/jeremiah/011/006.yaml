source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: pt
  text: 'Então Yahweh me disse: “Proclame todas estas palavras nas cidades de Judá e nas ruas de Jerusalém[a], dizendo: ‘Ouçam[b] as palavras desta aliança e ponham-nas em prática.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas praças de Jerusalém”; o termo hebraico se refere a espaços públicos abertos da cidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Escutem”. O verbo também pode envolver a ideia de obedecer, mas a oração seguinte já expressa explicitamente a ação: “e ponham-nas em prática”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, preservando sua função pactual em vez de substituí-lo por um título.
- source_word: קְרָא
  choice: Proclame
  rationale: O imperativo pede uma declaração pública; “proclame” transmite essa força de modo natural e digno.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: No contexto profético, דְּבָרִים designa as palavras da mensagem, sentido confirmado pela fala citada em seguida.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Reprodução direta e natural da indicação geográfica.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: e nas ruas de Jerusalém
  rationale: חֻצוֹת indica espaços públicos urbanos ao ar livre; “ruas” é claro em português, embora “praças” também seja possível.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz explicitamente o conteúdo da proclamação, como no hebraico.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Preserva o sentido básico de ouvir ou escutar sem antecipar a obediência, que é expressa pela oração seguinte.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: as palavras desta aliança
  rationale: Mantém tanto a ligação lexical com “palavras” no início do versículo quanto a formulação pactual do texto.
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: e ponham-nas em prática
  rationale: Expressa naturalmente em português a ideia de fazer ou cumprir as palavras da aliança, sem reduzir a frase a uma repetição de “obedecer”.
theological_decisions:
- issue: Tradução do nome pactual יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Preserva o nome pessoal no texto e evita substituí-lo pelo título “SENHOR”.
- issue: Se שִׁמְעוּ deve ser traduzido literalmente ou interpretado como obediência
  choice: Ouçam ... e ponham-nas em prática
  alternative: Obedeçam às palavras desta aliança
  rationale: O hebraico distingue o ato de ouvir do ato de fazer. A tradução mantém essa sequência retórica e teológica, sem fundir os dois verbos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Então” apresenta naturalmente a sequência narrativa; os imperativos no plural preservam os destinatários coletivos. A construção “ponham-nas em prática” evita o pouco idiomático “façam-nas” sem perder o sentido concreto do hebraico.
