  to: Eles voltaram às iniquidades de seus antepassados mais antigos[a], que se recusaram a ouvir as minhas palavras[b], e eles mesmos foram atrás de outros deuses para servi-los. A casa de Israel e a casa de Judá quebraram a minha aliança[c], que fiz com seus antepassados.
  rationale: A revisão substitui uma expressão portuguesa menos idiomática por “antepassados mais antigos”, que representa o contraste temporal do hebraico sem restringi-lo aos pais imediatos nem sugerir uma sequência genealógica técnica. Também reposiciona a âncora da nota sobre “cortar uma aliança” para o termo que ela explica. O restante do texto preserva a fidelidade lexical, a ênfase do pronome independente e o registro pactual do original.
