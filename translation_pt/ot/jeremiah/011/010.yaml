source:
  edition: WLC
  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: pt
  text: Eles voltaram às iniquidades de seus antepassados mais antigos[a], que se recusaram a ouvir as minhas palavras[b], e eles mesmos foram atrás de outros deuses para servi-los. A casa de Israel e a casa de Judá quebraram a minha aliança[c], que fiz com seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus primeiros pais” ou “seus pais anteriores”; isto é, seus antepassados das gerações antigas.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “ouvir” também pode incluir o sentido de escutar com disposição para obedecer.
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega literalmente a expressão “cortei uma aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: voltaram às iniquidades
  rationale: O hebraico descreve o retorno a um padrão anterior de pecado. “Iniquidades” conserva o peso moral de עָוֹן, enquanto “voltaram às” expressa o sentido idiomático de שׁוב על.
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: seus primeiros antepassados
  rationale: A expressão significa literalmente “seus primeiros pais”. “Primeiros antepassados” preserva a ênfase nas gerações mais antigas sem sugerir apenas os pais imediatos.
- source_word: מֵאֲנוּ לִשְׁמוֹעַ אֶת דְּבָרַי
  choice: se recusaram a ouvir as minhas palavras
  rationale: מָאֵן indica recusa, e שׁמע mantém aqui a amplitude entre ouvir e acolher obedientemente; “ouvir” preserva essa tensão.
- source_word: וְהֵמָּה
  choice: e eles mesmos
  rationale: O pronome independente tem força enfática e destaca que a geração presente repetiu pessoalmente a infidelidade ancestral.
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם
  choice: foram atrás de outros deuses para servi-los
  rationale: “Foram atrás” conserva a metáfora de הלך אחרי, que implica seguir em lealdade, e “servi-los” traduz diretamente עבד sem limitar seu alcance cultual a um único ato de adoração.
- source_word: הֵפֵרוּ ... אֶת בְּרִיתִי
  choice: quebraram a minha aliança
  rationale: Em contexto de aliança, o Hifil de פרר significa romper ou violar. “Quebraram” é claro, natural e mantém a força relacional do termo.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: A casa de Israel e a casa de Judá
  rationale: A repetição de “casa” reproduz a linguagem coletiva e pactual do hebraico.
- source_word: אֲשֶׁר כָּרַתִּי אֶת אֲבוֹתָם
  choice: que fiz com seus antepassados
  rationale: Em português, “fazer uma aliança” é a expressão natural para o idioma hebraico literalmente formulado como “cortar uma aliança”; אֶת indica aqui a parte com quem a aliança foi feita.
theological_decisions:
- issue: Continuidade da aliança entre a geração presente e os antepassados
  choice: A geração presente retorna às iniquidades antigas e rompe a aliança feita com seus antepassados.
  alternative: Tratar a aliança apenas como referência histórica, sem implicação para a geração presente.
  rationale: O texto hebraico vincula explicitamente a rebelião atual à dos antepassados e declara que Israel e Judá romperam a aliança feita com eles, preservando a continuidade pactual sem impor um sistema teológico posterior.
- issue: Sentido de “ouvir” as palavras de Deus
  choice: Manter “ouvir”, permitindo que o contexto inclua a ideia de resposta obediente.
  alternative: Traduzir diretamente como “obedecer”.
  rationale: שׁמע pode envolver obediência responsiva, mas a forma lexical do texto é “ouvir”; a tradução conserva a ambiguidade significativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a linguagem pactual de “casa” e “aliança”, a ênfase de וְהֵמָּה e a metáfora de seguir outros deuses, evitando arcaísmos desnecessários.
