  terminology: “Iniquidades”, “outros deuses”, “casa de Israel/casa de Judá” e “aliança” são escolhas adequadas ao registro e ao vocabulário do texto. A nota sobre o idiomatismo de “cortar uma aliança” deve estar ancorada em “aliança”, e não em “antepassados”.
