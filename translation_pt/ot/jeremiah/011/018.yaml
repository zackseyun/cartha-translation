  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: pt
  text: E Yahweh me fez saber, e eu soube; então me mostraste[a] os atos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa da terceira pessoa (“Yahweh”) para a segunda (“me mostraste”), provavelmente porque Jeremias se dirige diretamente a Yahweh. Algumas traduções uniformizam a frase como “ele me mostrou”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Mantém a conjunção hebraica e translitera o nome divino, preservando sua função como nome próprio.
- source_word: הוֹדִיעַנִי
  choice: me fez saber
  rationale: Reproduz de modo natural a força causativa do hifil de ידע sem especificar um objeto que o hebraico deixa implícito.
- source_word: וָאֵדָעָה
  choice: e eu soube
  rationale: Conserva a coordenação explícita do hebraico e evita impor uma relação causal mais definida do que o texto expressa.
- source_word: אָז
  choice: então
  rationale: Expressa de forma concisa a sequência temporal indicada pelo advérbio.
- source_word: הִרְאִיתַנִי
  choice: me mostraste
  rationale: Preserva a segunda pessoa masculina singular e traduz naturalmente o valor causativo do hifil de ראה.
- source_word: מַעַלְלֵיהֶם
  choice: os atos deles
  rationale: Traduz o termo de maneira clara, preservando sua possível coloração moral sem acrescentar explicitamente 'maus'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Mudança da terceira pessoa para a segunda pessoa ao falar com Deus
  choice: 'Preservar: ''Yahweh... me mostraste'''
  alternative: 'Uniformizar na terceira pessoa: ''Yahweh... ele me mostrou'''
  rationale: O hebraico muda explicitamente da menção de Yahweh para uma interpelação direta; manter essa mudança conserva a textura retórica e a ambiguidade do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem artificialidade. A colocação de 'me' antes de 'mostraste' favorece a leitura brasileira e continua plenamente compreensível em âmbito internacional.
