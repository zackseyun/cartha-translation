  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: pt
  text: 'E você lhes dirá: “Assim diz o SENHOR, o Deus de Israel: Maldito o homem que não ouvir as palavras desta aliança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção portuguesa amplamente reconhecida, em versaletes.
- source_word: אָרוּר
  choice: Maldito
  rationale: Preserva a fórmula solene de maldição da aliança e a força do particípio passivo hebraico.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o singular genérico e individualizador do hebraico, sem restringir a referência a uma pessoa específica.
- source_word: לֹא יִשְׁמַע
  choice: não ouvir
  rationale: Conserva o sentido básico de שׁמע e sua implicação contextual de acolher e obedecer, sem reduzir a ambiguidade ao verbo 'obedecer'.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: as palavras desta aliança
  rationale: Reproduz de perto a construção hebraica, na qual as estipulações são apresentadas como palavras da aliança.
theological_decisions:
- issue: Relação entre ouvir e obedecer
  choice: não ouvir
  alternative: não obedecer
  rationale: O hebraico שׁמע pode implicar obediência, mas sua formulação explícita é 'ouvir'; a tradução preserva essa amplitude sem resolver a tensão lexical.
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa mais difundida sem acrescentar uma vocalização discutida ao texto principal.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do hebraico. A fórmula profética e a declaração de maldição mantêm tom formal e público; 'desta aliança' é natural e fiel ao demonstrativo hebraico.
