source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: pt
  text: 'Mas eu era como um cordeiro manso levado ao abate[a] e não sabia que tramavam planos contra mim: “Destruamos a árvore com seu alimento[b] e o eliminemos da terra dos vivos, para que seu nome nunca mais seja lembrado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um cordeiro domesticado” ou “como um cordeiro acostumado às pessoas”; o adjetivo hebraico é de sentido incerto.
    reason: lexical_alternative
  - marker: b
    text: Hebraico obscuro, literalmente “a árvore com seu pão/alimento”. Muitos entendem a expressão como a destruição completa da árvore juntamente com seu fruto ou produto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: como um cordeiro manso
  rationale: כֶּבֶשׂ significa “cordeiro”. אַלּוּף é difícil neste contexto e provavelmente descreve um animal domesticado, dócil ou confiante. “Manso” comunica de modo natural sua vulnerabilidade, enquanto a nota preserva outras possibilidades.
- source_word: יוּבַל לִטְבוֹחַ
  choice: levado ao abate
  rationale: O passivo de יבל com o infinitivo de טבח indica ser levado ou conduzido para o abate; a formulação preserva a imagem do hebraico.
- source_word: וְלֹא יָדַעְתִּי
  choice: e não sabia
  rationale: Tradução direta e natural do perfeito na primeira pessoa, expressando o desconhecimento do profeta.
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: tramavam planos
  rationale: A construção cognata enfatiza planejamento deliberado. “Tramavam planos” preserva a intenção hostil sem reproduzir de maneira artificial a repetição hebraica.
- source_word: נַשְׁחִיתָה
  choice: Destruamos
  rationale: O coortativo na primeira pessoa do plural introduz diretamente a proposta dos conspiradores.
- source_word: עֵץ בְּלַחְמוֹ
  choice: a árvore com seu alimento
  rationale: A expressão é obscura. לֶחֶם significa normalmente “pão” ou “alimento”; a tradução mantém essa imagem incomum sem decidir que se trata especificamente do fruto ou da seiva.
- source_word: וְנִכְרְתֶנּוּ
  choice: e eliminemos esse homem
  rationale: כרת significa literalmente “cortar, extirpar”. O sufixo masculino e as cláusulas seguintes apontam para Jeremias. “Eliminemos esse homem” torna clara a mudança da imagem da árvore para o alvo humano, sem sugerir que o objeto continue sendo a árvore.
- source_word: מֵאֶרֶץ חַיִּים
  choice: da terra dos vivos
  rationale: Expressão hebraica consagrada que designa o âmbito dos que estão vivos.
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: para que seu nome nunca mais seja lembrado
  rationale: O nifal de זכר pode significar “ser lembrado” ou “ser mencionado”. Aqui, “ser lembrado” comunica a intenção de apagar por completo a memória do profeta.
theological_decisions:
- issue: Sentido da metáfora violenta na fala dos conspiradores
  choice: Apresentar a imagem como parte de um plano contra a vida de Jeremias, sem alegorização cristológica no texto.
  alternative: Interpretar a passagem primariamente como profecia tipológica da paixão de Cristo.
  rationale: O contexto imediato registra o testemunho de Jeremias sobre uma conspiração para matá-lo. Possíveis leituras tipológicas pertencem à interpretação posterior e não devem ser incorporadas à tradução.
- issue: Referente do sufixo em וְנִכְרְתֶנּוּ
  choice: Entender o masculino singular como referência pessoal a Jeremias.
  alternative: Manter “cortemos a árvore”, tomando o sufixo como continuação exclusiva da metáfora.
  rationale: As expressões seguintes — “terra dos vivos” e “seu nome” — indicam que a pessoa de Jeremias é o alvo explícito, embora a linguagem de cortar prolongue o campo metafórico da árvore.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A fala dos conspiradores conserva tom deliberativo. A expressão hebraica obscura sobre a árvore foi mantida próxima da forma original e explicada em nota.
