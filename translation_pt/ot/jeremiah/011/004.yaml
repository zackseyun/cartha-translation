id: JER.11.4
reference: Jeremiah 11:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: pt
  text: 'que ordenei aos pais de vocês[a], no dia em que os tirei da terra do Egito, da fornalha de ferro[b], dizendo: “Escutem a minha voz[c] e façam tudo conforme eu lhes ordenar; e vocês serão o meu povo, e eu serei o seu Deus”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos antepassados de vocês”. O hebraico diz literalmente “aos pais de vocês”.
    reason: lexical_alternative
  - marker: b
    text: “Fornalha de ferro” é uma metáfora que descreve o Egito como lugar de dura opressão e sofrimento.
    reason: cultural_note
  - marker: c
    text: A expressão “escutem a minha voz” também pode ser traduzida como “obedeçam à minha voz”, pois no hebraico ouvir frequentemente inclui a ideia de obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי
  choice: que ordenei
  rationale: Mantém a oração relativa ligada à aliança mencionada no versículo anterior e preserva a força autoritativa de צוה.
- source_word: אֲבוֹתֵיכֶם
  choice: aos pais de vocês
  rationale: Reproduz a forma masculina plural explícita do hebraico; a nota esclarece que a referência abrange as gerações anteriores.
- source_word: בְּיוֹם הוֹצִיאִי אוֹתָם
  choice: no dia em que os tirei
  rationale: Conserva a moldura temporal concreta do êxodo e expressa de modo natural a ação de fazer sair.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva a fórmula geográfica e histórica característica da linguagem do êxodo.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: da fornalha de ferro
  rationale: Mantém intacta a metáfora hebraica de opressão severa, sem substituí-la por uma explicação interpretativa.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Escutem a minha voz
  rationale: Preserva a imagem auditiva do hebraico; o contexto seguinte deixa explícita a exigência de pôr a ordem em prática.
- source_word: וַעֲשִׂיתֶם אוֹתָם כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: e façam tudo conforme eu lhes ordenar
  rationale: Expressa com naturalidade a execução integral das ordens, evitando o português pouco idiomático de uma reprodução literal como 'façam-nas'.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: e vocês serão o meu povo
  rationale: Reproduz a fórmula relacional da aliança de maneira direta e corrente.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: e eu serei o seu Deus
  rationale: Completa a fórmula da aliança em português idiomático, preservando sua reciprocidade.
theological_decisions:
- issue: Linguagem ancestral marcada pelo gênero
  choice: aos pais de vocês
  alternative: aos antepassados de vocês
  rationale: O hebraico emprega literalmente 'pais'. A forma foi mantida no texto, enquanto a nota registra o alcance coletivo da expressão.
- issue: Nuance de obediência em שִׁמְעוּ בְקוֹלִי
  choice: Escutem a minha voz
  alternative: Obedeçam à minha voz
  rationale: A expressão hebraica frequentemente implica obediência, mas a ordem seguinte de fazer tudo já explicita essa dimensão. A tradução conserva, portanto, tanto a imagem de ouvir quanto a tensão entre ouvir e agir.
- issue: Metáfora da fornalha de ferro
  choice: fornalha de ferro
  alternative: lugar de dura opressão
  rationale: A metáfora identifica o Egito como lugar de sofrimento intenso. Mantê-la evita transformar uma imagem teológica e poética em explicação direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a ligação sintática com o versículo anterior, mantém as imagens do hebraico e usa “vocês” para tornar explícito o plural sem recorrer a formas regionais ou arcaizantes.
