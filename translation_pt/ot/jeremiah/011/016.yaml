  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: pt
  text: O SENHOR deu a você o nome de “oliveira verdejante, bela de fruto e de forma”. Ao som de um grande estrondo, ele ateou fogo nela, e seus ramos foram destruídos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: oliveira verdejante
  rationale: Expressa a imagem de uma oliveira viçosa e cheia de vigor, em português natural e digno.
- source_word: יְפֵה פְרִי תֹאַר
  choice: bela, com frutos formosos
  rationale: Preserva tanto a beleza da árvore quanto a qualidade visual de seu fruto, sem reduzir a expressão apenas a 'bons frutos'.
- source_word: הֲמוּלָּה גְדֹלָה
  choice: um grande estrondo
  rationale: O substantivo pode indicar tumulto, ruído ou estrondo; no contexto do fogo destrutivo, 'estrondo' mantém a força sonora sem especificar indevidamente sua causa.
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: seus galhos foram destruídos
  rationale: O verbo descreve dano ou ruína dos ramos; 'foram destruídos' comunica claramente o resultado, preservando a imagem arbórea.
theological_decisions:
- issue: Referente do pronome em הִצִּית
  choice: ele ateou fogo nela
  alternative: foi ateado fogo nela
  rationale: O hebraico apresenta um sujeito masculino singular não explicitado; no contexto imediato, o SENHOR é o referente mais natural. A tradução conserva o pronome sem acrescentar explicação teológica.
- issue: Tratamento do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR, sem introduzir uma vocalização discutida no texto principal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação preserva a metáfora poética e a transição brusca da beleza para o juízo.
