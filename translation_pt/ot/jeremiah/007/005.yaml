  text: כִּ֤י אִם הֵיטֵיב֙ תֵּיטִ֔יבוּ אֶת דַּרְכֵי/כֶ֖ם וְ/אֶת מַֽעַלְלֵי/כֶ֑ם אִם עָשׂ֤וֹ תַֽעֲשׂוּ֙ מִשְׁפָּ֔ט בֵּ֥ין אִ֖ישׁ וּ/בֵ֥ין רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/005.yaml
  text: For if you truly make your ways and your deeds good[a], if you truly do justice between a man and his neighbor[b],
translation:
  language: pt
  text: Pois, se de fato melhorarem os seus caminhos e as suas ações[a], se de fato praticarem a justiça entre um homem e seu próximo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se corrigirem completamente os seus caminhos e as suas ações”. O hebraico emprega, nas duas orações condicionais do versículo, um infinitivo absoluto junto ao verbo conjugado para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se de fato fizerem justiça entre um homem e outro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Preserva tanto a força conectiva de כִּי como a condição introduzida por אִם, sem explicitar além do necessário o contraste com a falsa confiança do versículo anterior.
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: realmente tornarem bons
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação. “Realmente” comunica a ênfase, enquanto “tornarem bons” mantém a relação direta com “caminhos” e “ações” sem impor a interpretação mais específica de “corrigirem”.
- source_word: דַּרְכֵיכֶם
  choice: os seus caminhos
  rationale: Conserva a metáfora hebraica transparente para a maneira de viver e soa natural em português bíblico moderno.
- source_word: מַעַלְלֵיכֶם
  choice: as suas ações
  rationale: Expressa atos ou feitos em linguagem atual e clara, mantendo o sentido moral do comportamento.
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: se realmente praticarem
  rationale: A construção enfática é novamente representada por “realmente”; “praticarem” combina naturalmente com “justiça” em português.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto, indica a prática de julgamento justo nas relações sociais, não apenas uma sentença judicial isolada.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: entre um homem e o seu próximo
  rationale: Mantém o masculino singular representativo do hebraico e a fórmula relacional da comunidade, sem neutralizar a forma do texto-fonte.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: um homem
  alternative: uma pessoa; alguém
  rationale: O hebraico emprega o substantivo masculino singular אִישׁ numa fórmula jurídico-social de alcance representativo. A tradução conserva a forma masculina sem restringir indevidamente a aplicação do princípio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural hebraica. A repetição de “realmente” preserva o paralelismo enfático do original; “caminhos” mantém a metáfora concreta.
