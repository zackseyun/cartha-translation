  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: pt
  text: Corte o seu cabelo e jogue-o fora[a]; entoe uma lamentação nas alturas áridas, pois Yahweh rejeitou e abandonou a geração da sua ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua coroa”. O substantivo hebraico pode indicar consagração, coroa ou diadema, bem como cabelo associado à consagração; aqui, as ordens de cortar e jogar fora favorecem o sentido de cabelo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a geração debaixo da sua ira”. O hebraico diz literalmente “a geração da sua ira”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: Corte
  rationale: O imperativo feminino singular de גזז indica cortar ou tosquiar. “Corte” é natural em português e se ajusta ao cabelo como objeto.
- source_word: נִזְרֵךְ
  choice: o seu cabelo
  rationale: נזר pode indicar consagração, coroa ou cabelo ligado à consagração. Os verbos “cortar” e “jogar fora” favorecem a referência ao cabelo; a nota preserva a sobreposição lexical sem explicitar no texto uma consagração que o substantivo não torna inequívoca.
- source_word: וְהַשְׁלִיכִי
  choice: e jogue-o fora
  rationale: O imperativo de שלך exprime descarte deliberado. A formulação é clara e corrente em português.
- source_word: וּשְׂאִי ... קִינָה
  choice: entoe uma lamentação
  rationale: A combinação de נשׂא com קינה significa iniciar ou levantar um lamento. “Entoe uma lamentação” comunica naturalmente sua expressão audível.
- source_word: עַל שְׁפָיִם
  choice: sobre as alturas desertas
  rationale: שְׁפָיִם designa elevações nuas, áridas ou desertas. Esta escolha evita confundir automaticamente a expressão com os lugares altos de culto.
- source_word: כִּי מָאַס
  choice: pois ... rejeitou
  rationale: מאס comunica rejeição. “Rejeitou” preserva o peso pactual e judicial sem acrescentar desprezo emocional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּטֹּשׁ
  choice: e abandonou
  rationale: נטש significa deixar, desamparar ou abandonar. “Abandonou” é atual, claro e vigoroso.
- source_word: דּוֹר עֶבְרָתוֹ
  choice: a geração da sua ira
  rationale: Mantém de perto a construção hebraica, literalmente “a geração de sua ira”, preservando sua concisão e severidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original apresenta o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração.
- issue: Sentido de נִזְרֵךְ
  choice: o seu cabelo
  alternative: a sua coroa; o seu cabelo consagrado
  rationale: A ordem de cortar e descartar favorece “cabelo”, mas o campo semântico inclui coroa e consagração. A nota conserva essa ambiguidade sem importar um voto nazireu técnico.
- issue: Relação expressa por דּוֹר עֶבְרָתוֹ
  choice: a geração da sua ira
  alternative: a geração debaixo da sua ira
  rationale: A tradução formal conserva a construção genitiva ambígua e a força profética, enquanto a nota apresenta a leitura relacional mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos femininos dirigem-se à cidade personificada. A pontuação separa a ação simbólica, a lamentação e sua causa; todos os marcadores de nota aparecem no texto.
