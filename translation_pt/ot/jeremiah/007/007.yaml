  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁכַּנְתִּ֤י אֶתְ/כֶם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה בָּ/אָ֕רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/007.yaml
  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: pt
  text: então farei com que vocês habitem neste lugar, na terra que dei aos seus pais[a], desde os tempos antigos e para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica abrange o passado remoto e o futuro indefinido; também pode ser traduzida por “desde a antiguidade e para sempre”.
    reason: temporal_ambiguity
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: então farei com que vocês habitem
  rationale: 'O hifil de שׁכן tem força causativa: Deus fará com que o povo habite ou permaneça ali. A formulação preserva essa força sem sugerir que Deus habitará com eles.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Mantém o substantivo מָקוֹם e o demonstrativo, sem especificar além do hebraico se o referente é Judá, Jerusalém ou a área do templo.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Neste contexto, אֶרֶץ designa a terra concedida aos antepassados, não o planeta Terra.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que dei
  rationale: Tradução direta e natural da oração relativa e do perfeito hebraico.
- source_word: לַאֲבוֹתֵיכֶם
  choice: aos seus pais
  rationale: Preserva a forma masculina explícita de אָבוֹת; 'antepassados' é uma alternativa legítima e aparece em nota.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: desde os tempos antigos e para sempre
  rationale: A expressão percorre o tempo remoto em direção ao futuro indefinido. Esta tradução conserva os sentidos retrospectivo e prospectivo de עוֹלָם sem impor a noção metafísica de eternidade em ambos os membros.
theological_decisions:
- issue: Se a promessa implica posse incondicional e permanente da terra
  choice: Manter a declaração como promessa ligada às condições apresentadas no contexto anterior, sem acrescentar linguagem de incondicionalidade.
  alternative: Traduzir como concessão absoluta da terra, independentemente da obediência à aliança.
  rationale: O versículo segue as condições de Jeremias 7:5-6. A tradução afirma a dádiva ancestral e a perspectiva duradoura, mas não resolve debates teológicos mais amplos sobre a permanência da posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção causativa foi mantida de modo explícito, e a ambiguidade temporal de עוֹלָם foi preservada em tradução e nota.
