source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Eis que a minha ira e o meu furor estão sendo derramados sobre este lugar, sobre o ser humano[a] e sobre os animais, sobre as árvores do campo e sobre o fruto da terra. Isso arderá e não será apagado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. O hebraico אָדָם está no singular, mas tem sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão consequente da denúncia anterior e mantém o tom profético formal.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em português natural e reconhecível.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e preserva explicitamente o nome da aliança.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força solene da proclamação divina sem recorrer a uma expressão coloquial.
- source_word: אַפִּי וַחֲמָתִי
  choice: a minha ira e o meu furor
  rationale: Mantém os dois termos hebraicos distintos e comunica sua intensificação retórica.
- source_word: נִתֶּכֶת
  choice: estão sendo derramados
  rationale: Expressa a imagem do derramamento e o aspecto contínuo ou iminente do particípio; a concordância portuguesa segue os dois substantivos coordenados.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: sobre este lugar
  rationale: No contexto do derramamento do juízo, “sobre” indica naturalmente seu alvo.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Comunica o valor genérico do singular hebraico sem restringi-lo ao sexo masculino.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: Representa naturalmente em português a categoria coletiva de criaturas não humanas, sem limitá-la necessariamente ao gado.
- source_word: עֵץ הַשָּׂדֶה
  choice: as árvores do campo
  rationale: Verte o singular coletivo hebraico por um plural idiomático e preserva a imagem rural.
- source_word: פְּרִי הָאֲדָמָה
  choice: o fruto da terra
  rationale: Mantém a imagem agrícola e a formulação concreta do hebraico.
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: Isso arderá e não será apagado
  rationale: Preserva a imagem de combustão e evita definir silenciosamente o antecedente do verbo feminino singular, que permanece algo aberto no hebraico.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção explicita o nome divino יהוה e ao mesmo tempo distingue dele o título אֲדֹנָי, sem produzir a repetição artificial “Senhor SENHOR”.
- issue: Valor genérico de הָאָדָם
  choice: o ser humano
  alternative: o homem
  rationale: O substantivo está no singular, mas tem força genérica no contraste com os animais e o restante da criação atingida pelo juízo. “O ser humano” preserva essa abrangência em português atual.
- issue: Antecedente da imagem final de combustão
  choice: Isso arderá e não será apagado
  alternative: Ela arderá e não se apagará
  rationale: O hebraico emprega uma forma feminina singular sem nomear fogo; o demonstrativo neutro em português conserva melhor a referência ampla ou ambígua e evita vinculá-la indevidamente a um substantivo feminino próximo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com cadência profética. A formulação evita arcaísmos desnecessários, preserva o paralelismo da enumeração e mantém a tensão da imagem final sem acrescentar explicitamente a palavra “fogo”.
