id: JER.7.15
reference: Jeremiah 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁלַכְתִּ֥י אֶתְ/כֶ֖ם מֵ/עַ֣ל פָּנָ֑/י כַּ/אֲשֶׁ֤ר הִשְׁלַ֨כְתִּי֙ אֶת כָּל אֲחֵי/כֶ֔ם אֵ֖ת כָּל זֶ֥רַע אֶפְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: pt
  text: E eu lançarei vocês para longe da minha presença[a], assim como lancei todos os seus irmãos[b], toda a descendência de Efraim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de sobre a minha face”; também pode ser traduzido como “de diante de mim”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se refere aos israelitas aparentados com Judá, especialmente os do reino do norte.
    reason: cultural_note
  - marker: c
    text: Aqui, Efraim representa o reino do norte de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: E eu lançarei
  rationale: O hifil de שׁלך comunica expulsão enérgica. “Lançarei” conserva a metáfora e a força judicial do hebraico.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: Pronome de segunda pessoa masculina plural; “vocês” é a forma corrente e amplamente compreensível em português.
- source_word: מֵעַל פָּנָי
  choice: para longe da minha presença
  rationale: A expressão significa literalmente “de sobre/diante da minha face” e, neste contexto, indica expulsão de diante de Deus. A formulação escolhida é natural e mantém a dimensão relacional e judicial.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca claramente a comparação entre o juízo anunciado contra Judá e o juízo anterior contra Efraim.
- source_word: הִשְׁלַכְתִּי
  choice: lancei
  rationale: Repete em português o mesmo verbo da primeira oração, preservando a correspondência retórica do hebraico.
- source_word: כָּל אֲחֵיכֶם
  choice: todos os seus irmãos
  rationale: Mantém a metáfora familiar e o masculino plural do hebraico; no contexto, refere-se aos israelitas aparentados de Judá.
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: toda a descendência de Efraim
  rationale: זֶרַע designa coletivamente descendentes. “Descendência” é natural em português e preserva Efraim como nome próprio, sem substituir a metonímia pela sua interpretação.
theological_decisions:
- issue: Sentido da expressão divina מֵעַל פָּנָי
  choice: para longe da minha presença
  alternative: de diante de mim; para longe da minha face
  rationale: A tradução expressa rejeição e expulsão de diante de Deus sem desenvolver além do texto uma doutrina sobre a presença ou a onipresença divina.
- issue: Referência de אֲחֵיכֶם
  choice: irmãos
  alternative: parentes; povo irmão
  rationale: “Irmãos” preserva o termo de parentesco e a forma masculina do original; uma nota esclarece que se trata dos demais israelitas, sobretudo os do reino do norte.
- issue: Valor metonímico de Efraim
  choice: manter Efraim no texto
  alternative: reino do norte; Israel
  rationale: O original nomeia Efraim. A tradução conserva o nome e explica em nota seu uso representativo para o reino do norte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com uso de “vocês”. A repetição de “lançar” conserva o paralelismo verbal do hebraico. As notas aparecem na ordem em que seus referentes ocorrem no texto.
