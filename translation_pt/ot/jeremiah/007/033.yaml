  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: pt
  text: Os cadáveres deste povo servirão de alimento às aves dos céus e aos animais da terra, sem que ninguém os espante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O cadáver deste povo servirá de alimento [...] e ninguém os espantará.” O hebraico emprega “cadáver” no singular, possivelmente em sentido coletivo, e deixa implícito o objeto da frase final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: servirão
  rationale: No discurso profético, a forma apresenta um resultado futuro. Com לְמַאֲכָל, a expressão portuguesa “servirão de alimento” comunica naturalmente a ideia de tornar-se comida.
- source_word: נִבְלַת
  choice: os cadáveres
  rationale: Embora o hebraico use o singular, o substantivo pode ter sentido coletivo. O plural em português deixa claro que se trata dos mortos dentre o povo e preserva a imagem de desonra.
- source_word: הָעָם הַזֶּה
  choice: deste povo
  rationale: “Povo” corresponde diretamente a עַם e mantém a referência coletiva a Judá sem introduzir a conotação política de “nação”.
- source_word: לְמַאֲכָל
  choice: de alimento
  rationale: 'Expressa de modo conciso e contundente a finalidade indicada pelo substantivo hebraico: aquilo que será comido.'
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves dos céus
  rationale: “Aves” traduz naturalmente o coletivo עוֹף, e “dos céus” conserva a formulação elevada e o paralelismo espacial do hebraico.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: e aos animais da terra
  rationale: בְּהֵמָה é coletivo e, neste contexto, abrange os animais terrestres que consumirão os mortos. “Animais” é claro em português moderno sem atenuar a cena.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém os espante
  rationale: A expressão indica que não haverá quem faça os animais fugir. O pronome “os” torna explícito o objeto implícito no hebraico, referindo-se às aves e aos animais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com dicção profética moderadamente elevada. “Animais da terra” favorece a compreensão internacional e brasileira; “aves dos céus” preserva o paralelismo do original. O marcador foi colocado após a frase inteira porque a nota trata tanto do número de “cadáver” quanto da formulação da oração final.
