  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: pt
  text: Por isso, eis que vêm dias — declara o SENHOR — em que não se chamará mais Tofete e Vale de Ben-Hinom, mas Vale da Matança; e sepultarão em Tofete, por falta de lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão ou consequência introduzida pelo hebraico.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva o marcador enfático e profético em registro digno, sem reduzi-lo a simples indicação visual.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Fórmula profética natural em português; SENHOR segue a convenção tradicional para o tetragrama.
- source_word: הַתֹּפֶת
  choice: Tofete
  rationale: Transliteração consolidada do nome próprio do local.
- source_word: גֵיא בֶן הִנֹּם
  choice: vale de Ben-Hinom
  rationale: Mantém o nome hebraico e traduz o elemento geográfico גֵיא.
- source_word: גֵיא הַהֲרֵגָה
  choice: vale da Matança
  rationale: Reproduz o novo nome ominoso dado ao lugar, com substantivo forte e inteligível.
- source_word: וְקָבְרוּ
  choice: e enterrarão mortos
  rationale: O objeto está elíptico no hebraico; 'mortos' torna a ação idiomática e é diretamente inferido do contexto de matança e sepultamento.
- source_word: מֵאֵין מָקוֹם
  choice: por falta de espaço
  rationale: Tradução idiomática da expressão hebraica que indica inexistência de lugar disponível.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção portuguesa amplamente reconhecida sem acrescentar interpretação denominacional.
- issue: Relação entre Tofete e o vale de Ben-Hinom
  choice: nem
  alternative: e
  rationale: No escopo de 'já não será chamado', o waw coordena dois nomes que deixarão de ser usados; 'nem' comunica essa coordenação negativa com naturalidade, sem decidir se designam exatamente a mesma extensão geográfica.
- issue: Objeto implícito de 'enterrarão'
  choice: mortos
  alternative: omitir o objeto
  rationale: A explicitação mínima evita uma construção pouco natural em português e permanece vinculada ao contexto imediato, sem especificar quem são os mortos.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A ordem profética e o paralelismo do hebraico foram preservados, com pontuação ajustada à fluência portuguesa.
