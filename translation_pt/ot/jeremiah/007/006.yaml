  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: pt
  text: Não oprimam o estrangeiro[a], o órfão[b] nem a viúva; não derramem sangue inocente neste lugar; e não sigam[c] outros deuses, para o mal de vocês mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residente estrangeiro”. O termo hebraico indica um não nativo que vivia no meio da comunidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquele que não tem pai”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não vão atrás de outros deuses”.
    reason: literal_idiom
lexical_decisions:
- source_word: גֵּר
  choice: o estrangeiro
  rationale: Designa o não israelita que reside no meio da comunidade e se encontra em condição social vulnerável. “Estrangeiro” é claro e corrente, enquanto a nota preserva a nuance de residência.
- source_word: יָתוֹם
  choice: o órfão
  rationale: É a designação portuguesa natural para a pessoa privada do amparo paterno; a nota registra o sentido mais estrito possível de “sem pai”.
- source_word: אַלְמָנָה
  choice: a viúva
  rationale: Equivalente direto e preciso para a categoria social vulnerável mencionada no hebraico.
- source_word: תַעֲשֹׁקוּ
  choice: oprimam
  rationale: Preserva a ideia de abuso, exploração e injustiça praticados contra pessoas vulneráveis.
- source_word: דָם נָקִי
  choice: sangue inocente
  rationale: Mantém a expressão hebraica consagrada para a morte injusta de quem não tem culpa.
- source_word: תִּשְׁפְּכוּ
  choice: derramem
  rationale: “Derramar sangue” é a expressão idiomática natural em português e corresponde ao uso do verbo com דָם.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Reproduz explicitamente a referência dêitica ao lugar em que Jeremias profere a mensagem.
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: não sigam
  rationale: Comunica naturalmente a ideia hebraica de ir atrás de alguém em lealdade ou culto; a metáfora literal é indicada em nota.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Equivalente direto, sem acrescentar a nuance étnica de “deuses estrangeiros”.
- source_word: לְרַע לָכֶם
  choice: para o próprio mal de vocês
  rationale: Conserva a formulação compacta e a consequência prejudicial voltada contra os próprios destinatários.
theological_decisions:
- issue: Tríade ética de grupos vulneráveis
  choice: o estrangeiro, o órfão e a viúva
  alternative: o residente estrangeiro, aquele que não tem pai e a viúva
  rationale: Mantém distintas as três categorias sociais da aliança, sem reduzi-las a uma expressão genérica como “os vulneráveis”.
- issue: Descrição da idolatria como movimento de lealdade
  choice: não sigam outros deuses
  alternative: não vão atrás de outros deuses
  rationale: “Sigam” expressa em português atual a adesão religiosa implicada pelo idioma hebraico, enquanto a nota conserva sua imagem verbal.
- issue: Sentido de לְרַע לָכֶם
  choice: para o próprio mal de vocês
  alternative: para o mal de vocês
  rationale: Explicita de modo natural que o prejuízo recai sobre os próprios ouvintes, sem decidir se a frase enfatiza intenção ou consequência.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas aos ouvintes. “Vocês” assegura ampla legibilidade brasileira. A coordenação com “nem” e os pontos e vírgulas preserva a sequência enfática das proibições.
