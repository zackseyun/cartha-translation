reference: Jeremiah 7:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: pt
  text: Desde o dia em que os seus antepassados saíram da terra do Egito até hoje, tenho enviado a vocês todos os meus servos, os profetas, dia após dia[a], levantando-me cedo e enviando-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “levantando-me cedo e enviando” comunica a ação persistente e diligente de Deus ao enviar repetidamente os profetas.
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר
  choice: Desde o dia em que
  rationale: Marca o ponto inicial de um período que se estende até o presente indicado no versículo; a formulação é natural e mantém a imagem temporal do hebraico.
- source_word: יָצְאוּ אֲבוֹתֵיכֶם
  choice: os seus antepassados saíram
  rationale: Neste contexto histórico, אָבוֹת designa as gerações anteriores de Israel, não apenas pais imediatos; “antepassados” comunica esse sentido com clareza.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém a formulação histórica e pactual mais plena, em vez de reduzi-la simplesmente a “do Egito”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Expressão portuguesa corrente que comunica continuidade até o momento de referência.
- source_word: וָאֶשְׁלַח
  choice: tenho enviado
  rationale: O pretérito perfeito composto expressa adequadamente os envios repetidos ao longo do período que vai do êxodo “até hoje”.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Torna explícito e natural para leitores brasileiros o pronome hebraico de segunda pessoa do plural.
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: todos os meus servos, os profetas
  rationale: A aposição identifica os profetas como servos comissionados por Deus; a vírgula esclarece essa relação.
- source_word: יוֹם
  choice: dia após dia
  rationale: O substantivo empregado adverbialmente ressalta a repetição contínua, com mais vivacidade do que apenas “diariamente”.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: levantando-me cedo e enviando-os
  rationale: Preserva a forma verbal e a imagem do conhecido idioma hebraico de Jeremias, enquanto a nota esclarece seu sentido de ação persistente e diligente.
theological_decisions:
- issue: Sentido de עֲבָדַי aplicado aos profetas
  choice: servos
  alternative: escravos
  rationale: O contexto destaca os profetas como agentes comissionados de Deus, não sua condição jurídica de escravidão; “servos” preserva a relação de submissão e serviço sem introduzir uma ênfase alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A vocês” evita ambiguidade regional; “terra do Egito” e o idioma “levantando-me cedo” preservam elementos formais relevantes do hebraico.
