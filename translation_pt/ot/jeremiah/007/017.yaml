base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: pt
  text: Você não vê o que eles estão fazendo nas cidades de Judá e nas ruas de Jerusalém?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praças” ou “lugares abertos” de Jerusalém.
