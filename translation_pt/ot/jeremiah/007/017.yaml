lexical_decisions:
- source_word: הַאֵינְךָ
  choice: Você não
  rationale: Reproduz a pergunta retórica negativa dirigida diretamente a Jeremias, com formulação natural em português.
- source_word: רֹאֶה
  choice: vê
  rationale: Preserva tanto o sentido visual quanto o perceptivo do verbo, em linguagem simples e direta.
- source_word: מָה
  choice: o que
  rationale: Introduz naturalmente em português o conteúdo daquilo que Jeremias vê.
- source_word: הֵמָּה
  choice: eles
  rationale: Representa o pronome independente hebraico sem acrescentar uma ênfase artificial; a pergunta retórica mantém a força da declaração.
- source_word: עֹשִׂים
  choice: estão fazendo
  rationale: A locução progressiva comunica a ação em curso expressa pelo particípio hebraico.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Mantém de forma clara a relação geográfica e a construção nominal do hebraico.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: e nas ruas de Jerusalém
  rationale: “Ruas” é uma tradução natural de חֻצוֹת neste contexto urbano, enquanto a nota preserva as alternativas lexicais legítimas.
