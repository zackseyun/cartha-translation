  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: pt
  text: “É a mim que eles provocam?”, declara Yahweh. “Não provocam a si mesmos, para sua própria vergonha[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para a vergonha de seus rostos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֹתִי
  choice: É a mim que
  rationale: A construção interrogativa com o objeto pronominal anteposto dá ênfase a “mim”; a formulação portuguesa preserva essa focalização.
- source_word: מַכְעִסִים
  choice: estão provocando
  rationale: O hifil de כעס expressa provocar ou incitar à ira. “Estão provocando” é natural e mantém a ação em curso sem acrescentar explicitamente “à ira”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e verte o nome divino como nome próprio.
- source_word: הֲלוֹא אֹתָם
  choice: Não é a si mesmos
  rationale: A pergunta retórica espera resposta afirmativa; “a si mesmos” comunica em português que as consequências de sua conduta recaem sobre eles próprios.
- source_word: לְמַעַן בֹּשֶׁת פְּנֵיהֶם
  choice: para vergonha do próprio rosto
  rationale: Preserva tanto a relação de resultado ou finalidade de לְמַעַן quanto a imagem concreta e coletiva do hebraico, que traz literalmente “rosto” no singular distributivo da expressão portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Objeto da provocação e efeito do pecado
  choice: Distinguir a provocação dirigida a Yahweh do dano e da vergonha que recaem sobre os próprios agentes
  alternative: Parafrasear toda a segunda pergunta como “Não estão provocando a si mesmos?”
  rationale: 'A redação mantém a tensão da pergunta hebraica: eles provocam Yahweh, mas sua ação resulta em vergonha para eles mesmos, sem sugerir que Deus seja prejudicado.'
translation_notes:
  register: Português moderno, claro e solene, com sintaxe retórica próxima do hebraico. Conserva-se “rosto” para preservar a imagem vívida do original; a nota oferece uma leitura idiomática sem substituir o texto principal.
