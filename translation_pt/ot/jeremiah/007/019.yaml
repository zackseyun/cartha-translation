    issue: A segunda pergunta contém uma construção sintaticamente deficiente e semanticamente ambígua.
    rationale: «Não é a si mesmos» não fornece em português um predicado inteligível que retome «provocando». O hebraico permite a elipse verbal, mas em português é mais seguro explicitar «provocam».
  - severity: medium
    issue: «Para vergonha do próprio rosto» é pouco idiomático e altera o número da imagem hebraica.
    rationale: פְּנֵיהֶם significa «seus rostos». A formulação idiomática deve comunicar a vergonha deles, com nota para a expressão literal.
  - severity: low
    issue: A nota atual não explicita a imagem lexical preservada no original.
    rationale: A alternativa proposta é possível como paráfrase, mas uma nota literal ligada a «vergonha» documenta melhor a expressão hebraica «vergonha de seus rostos».
