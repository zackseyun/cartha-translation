id: JER.7.21
reference: Jeremiah 7:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: “Acrescentem seus holocaustos aos seus sacrifícios[a] e comam a carne.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas ofertas de comunhão”; o termo hebraico pode referir-se mais especificamente a sacrifícios dos quais o adorador comia.
    reason: Leitura alternativa que preserva a possível especificidade cultual de זֶבַח no contraste com os holocaustos.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética natural e digna em português, que preserva o caráter declarativo do hebraico.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz o título צְבָאוֹת pela forma bíblica portuguesa corrente, sem restringi-lo apenas a forças humanas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: עֹלוֹתֵיכֶם
  choice: seus holocaustos
  rationale: Holocausto é o termo cultual consagrado em português para a oferta inteiramente queimada no altar.
- source_word: סְפוּ עַל
  choice: Acrescentem ... aos
  rationale: Expressa naturalmente a ordem de juntar uma categoria de oferta à outra e conserva sua força irônica no contexto.
- source_word: זִבְחֵיכֶם
  choice: seus sacrifícios
  rationale: Preserva o sentido mais amplo do termo hebraico; a possibilidade contextual mais específica fica registrada em nota.
- source_word: וְאִכְלוּ בָשָׂר
  choice: e comam a carne
  rationale: Carne é a equivalência portuguesa natural para בָשָׂר no contexto de animais sacrificados e mantém a referência concreta ao alimento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o nome próprio divino; a transliteração preserva essa distinção em vez de substituí-lo por um título.
- issue: Especificidade de זִבְחֵיכֶם em contraste com os holocaustos
  choice: seus sacrifícios
  alternative: suas ofertas de comunhão; seus sacrifícios pacíficos
  rationale: זֶבַח pode designar sacrifícios de modo geral, embora neste contraste provavelmente evoque ofertas das quais o adorador comia. O texto principal mantém a amplitude lexical, e a nota preserva a leitura mais específica.
translation_notes:
  register: Português moderno, claro e digno, com forma profética reconhecível. Emprega “holocaustos” em seu sentido sacrificial histórico, não no sentido moderno ligado ao genocídio. O imperativo plural “Acrescentem” corresponde aos destinatários coletivos.
