  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: pt
  text: 'Então você lhes dirá: “Esta é a nação que não deu ouvidos à voz de Yahweh, seu Deus, nem aceitou a correção. A fidelidade[a] pereceu e foi cortada da boca deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A verdade pereceu”. O termo hebraico אֱמוּנָה pode significar “fidelidade”, “confiabilidade” ou “verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Então você lhes dirá
  rationale: O waw ligado ao perfeito, neste discurso profético, tem força sequencial. “Então” expressa naturalmente a progressão, e o futuro preserva o valor injuntivo da fala dirigida ao profeta.
- source_word: זֶה הַגּוֹי
  choice: Esta é a nação
  rationale: גּוֹי pode significar “nação” ou “povo”. “Nação” preserva o substantivo coletivo singular e a forma enfática da denúncia profética.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: não deu ouvidos à voz
  rationale: A construção שׁמע בְּקוֹל envolve ouvir com resposta obediente. A expressão portuguesa mantém a imagem auditiva e comunica a recusa em atender sem reduzi-la simplesmente a “desobedecer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: O sufixo masculino singular concorda gramaticalmente com o coletivo singular “nação”. Em português, “seu Deus” mantém essa concordância e permanece natural.
- source_word: לֹא לָקְחוּ מוּסָר
  choice: nem aceitou a correção
  rationale: מוּסָר abrange disciplina, instrução e correção. “Aceitou a correção” é idiomático e adequado ao contexto de repreensão.
- source_word: אָבְדָה הָאֱמוּנָה
  choice: A fidelidade pereceu
  rationale: אֱמוּנָה pode designar fidelidade, confiabilidade ou verdade. “Fidelidade” conserva aqui a dimensão moral e relacional, enquanto “pereceu” reproduz a força de אָבְדָה.
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: e foi cortada da boca deles
  rationale: O nifal de כרת significa “ser cortado” ou “ser eliminado”. A formulação mantém a metáfora forte do hebraico e traduz literalmente “da boca deles”, apesar da mudança natural do coletivo singular para seus integrantes.
theological_decisions:
- issue: Sentido de אֱמוּנָה no contexto de repreensão da aliança
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” destaca a dimensão ética e relacional da acusação contra o povo, sem excluir a ideia de veracidade. Como “verdade” também é lexicalmente possível, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A expressão “deu ouvidos à voz” preserva o idioma auditivo hebraico; “foi cortada da boca deles” conserva deliberadamente sua metáfora incomum. O marcador da nota foi colocado junto de “fidelidade”, termo ao qual a alternativa lexical se refere.
