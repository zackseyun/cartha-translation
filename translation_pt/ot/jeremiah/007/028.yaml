  source_fidelity: 'O texto reproduz com precisão a sequência do hebraico: a ordem dirigida ao profeta, a designação coletiva «esta é a nação», a recusa em dar ouvidos à voz de Yahweh e em receber correção, e a perda da fidelidade/verdade, descrita pela metáfora de ser cortada da boca deles. «Seu Deus» é uma solução natural em português para o sufixo singular que concorda com «nação».'
