  text: וְ/עָשִׂ֜יתִי לַ/בַּ֣יִת אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלָ֗י/ו אֲשֶׁ֤ר אַתֶּם֙ בֹּטְחִ֣ים בּ֔/וֹ וְ/לַ֨/מָּק֔וֹם אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/שִׁלֽוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: pt
  text: Assim farei à casa que é chamada pelo meu nome[a], na qual vocês confiam, e ao lugar que dei a vocês e aos seus pais, exatamente como fiz a Siló.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “sobre a qual o meu nome é invocado”. Esse modo de dizer hebraico indica que a casa pertence ao SENHOR ou é identificada com ele.
    reason: lexical_alternative
  - marker: b
    text: Siló foi um antigo local de santuário, cuja destruição servia de advertência; veja 1 Samuel 4 e Jeremias 7:12.
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Assim farei
  rationale: A conjunção liga o versículo à advertência anterior; “Assim” comunica naturalmente a consequência, enquanto a forma breve mantém implícito o ato de juízo, como no hebraico.
- source_word: לַבַּיִת
  choice: à casa
  rationale: Preserva o termo hebraico “casa”, que aqui designa o templo, sem apagar a distinção lexical entre a construção e o “lugar” mencionado depois.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: que é chamada pelo meu nome
  rationale: Expressa em português corrente o idioma hebraico pelo qual a casa pertence ao SENHOR ou é identificada com ele; a forma mais literal é registrada em nota.
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: na qual vocês confiam
  rationale: O presente traduz naturalmente a confiança contínua expressa pelo particípio hebraico, e “na qual” retoma “casa” com clareza.
- source_word: וְלַמָּקוֹם
  choice: e ao lugar
  rationale: Mantém a distinção do hebraico entre “casa” e “lugar”, sem acrescentar o demonstrativo “este”, ausente do texto.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: que dei a vocês e aos seus pais
  rationale: Reproduz a coordenação e mantém “pais”, correspondente direto de אֲבוֹתֵיכֶם, em referência à história da aliança.
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלֹה
  choice: exatamente como fiz a Siló
  rationale: Torna clara e natural a comparação enfática com o juízo anterior sobre Siló, sem explicá-la dentro do texto.
theological_decisions:
- issue: Linguagem da aliança aplicada ao santuário
  choice: Manter “casa” e “lugar” como termos distintos
  alternative: Traduzir “casa” por “templo” ou ambos por “santuário”
  rationale: A distinção lexical preserva o alcance da advertência profética sem impor uma especificação teológica além do hebraico.
- issue: Expressão “chamada pelo meu nome”
  choice: Usar a forma idiomática clara no texto e explicar a forma literal em nota
  alternative: Traduzir literalmente “sobre a qual o meu nome é invocado”
  rationale: A escolha comunica identificação e pertencimento sem resolver em excesso as nuances do idioma hebraico.
- issue: Referência a אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” corresponde de modo mais direto ao texto hebraico e mantém a linguagem histórico-pactual, embora “antepassados” seja uma interpretação contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A redação conserva a brevidade ameaçadora do hebraico e a distinção entre “casa” e “lugar”. O marcador [b] foi colocado após “Siló”, onde a nota histórica se aplica diretamente.
