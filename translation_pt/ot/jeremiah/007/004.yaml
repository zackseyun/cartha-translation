source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: pt
  text: 'Não confiem em palavras enganosas[a], dizendo: “O templo de Yahweh, o templo de Yahweh, o templo de Yahweh são estes.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras mentirosas”. O hebraico pode destacar tanto a falsidade das palavras quanto seu efeito enganador.'
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica repete “o templo de Yahweh” três vezes e termina literalmente com “são estes”. A repetição é retórica e expressa uma confiança indevida no próprio templo; a referência exata de “estes” não é totalmente clara.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: Não confiem
  rationale: אַל com o imperfeito expressa proibição. בטח significa confiar ou apoiar-se; o plural é preservado. O dativo לָכֶם tem nuance reflexiva que, neste contexto, já fica naturalmente implícita em português.
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: em palavras enganosas
  rationale: Depois de בטח, אֶל introduz aquilo em que se confia. שׁקר pode salientar tanto a falsidade quanto o efeito enganador; “palavras enganosas” conserva ambas as nuances.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo das palavras enganosas; “dizendo” reproduz a construção de modo direto e natural.
- source_word: הֵיכַל יְהוָה
  choice: Templo de Yahweh
  rationale: הֵיכַל designa aqui o templo de Jerusalém. A construção nominal é mantida com concisão, e o nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: הֵמָּה
  choice: são estes
  rationale: O pronome masculino plural tem força demonstrativa. A tradução preserva a formulação incomum e a possível referência demonstrativa do hebraico, sem substituí-la interpretativamente por “este é o templo”.
theological_decisions:
- issue: Fórmula tríplice sobre o templo
  choice: Repetir literalmente “Templo de Yahweh” três vezes
  alternative: Parafrasear como “Este é o templo de Yahweh” ou “O templo de Yahweh nos protegerá”
  rationale: A repetição constitui o núcleo retórico do slogan e denuncia a confiança indevida no santuário. Mantê-la evita explicar além do que o texto afirma.
- issue: Sentido de הֵמָּה ao fim do slogan
  choice: “são estes”
  alternative: “este é o templo de Yahweh”
  rationale: O hebraico apresenta um pronome demonstrativo plural cuja referência exata é discutida. A forma escolhida conserva a estranheza e a ambiguidade genuínas, em vez de resolvê-las silenciosamente.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e segue a decisão lexical fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e compreensível internacionalmente. A repetição enfática e a formulação demonstrativa incomum do hebraico foram preservadas; o travessão apenas ajuda a leitura do fecho do slogan.
