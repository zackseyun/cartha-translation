  naturalness: O texto é claro, mas a ausência do artigo definido em “Templo de Yahweh” soa excessivamente telegráfica em português corrente. Em construção com nome próprio, “o templo de Yahweh” é a forma idiomática e não reduz a força sloganística da repetição. A retirada do travessão também permite que a ordem marcada do hebraico permaneça sem sugerir uma ruptura explicativa adicional.
  terminology: “Yahweh” segue a decisão fornecida para o Tetragrama. “Palavras enganosas” é uma opção portuguesa natural para דברי השקר e a alternativa “palavras mentirosas” na nota preserva a possibilidade lexical. “Confiam” e “dizendo” são adequados ao registro e à sintaxe.
