id: JER.7.16
reference: Jeremiah 7:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: pt
  text: Quanto a você, não ore por este povo, não eleve em favor deles clamor nem oração e não interceda junto a mim[a], pois não estou ouvindo você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não insista comigo” ou “não me suplique”; o verbo hebraico pode indicar súplica urgente ou intercessão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois não ouvirei você”. O hebraico admite sentido futuro, embora a forma participial também sustente “não estou ouvindo você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: A conjunção seguida do pronome independente destaca Jeremias em contraste com o povo; a formulação reproduz esse foco de modo natural em português.
- source_word: אַל תִּתְפַּלֵּל
  choice: não ore
  rationale: אַל com o imperfeito expressa proibição direta; o imperativo negativo é a equivalência idiomática em português.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: por este povo
  rationale: בְּעַד indica ação em favor de alguém; a expressão é concisa e mantém o sentido intercessório.
- source_word: וְאַל תִּשָּׂא
  choice: não eleve
  rationale: Preserva a imagem de נשׂא, literalmente levantar ou elevar, aplicada aqui ao clamor e à oração.
- source_word: רִנָּה וּתְפִלָּה
  choice: clamor nem oração
  rationale: רִנָּה designa aqui um clamor vocal e suplicante, enquanto תְּפִלָּה é oração; 'nem' expressa naturalmente a abrangência da proibição após a negação.
- source_word: בַעֲדָם
  choice: em favor deles
  rationale: Reproduz o valor representativo e intercessório de בְּעַד com o sufixo pronominal.
- source_word: וְאַל תִּפְגַּע בִּי
  choice: e não interceda junto a mim
  rationale: No hifil, פגע pode denotar súplica insistente ou intercessão. O contexto de oração em favor do povo favorece 'interceder', sem eliminar a alternativa lexical registrada em nota.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: pois não estou ouvindo você
  rationale: A construção negativa com particípio apresenta a recusa divina como vigente. A forma progressiva conserva esse aspecto, enquanto a nota registra a possível leitura futura.
theological_decisions:
- issue: Natureza da proibição da intercessão de Jeremias
  choice: Uma proibição divina direta da intercessão profética por este povo neste momento de juízo
  alternative: Uma advertência hiperbólica, e não uma proibição efetiva
  rationale: A repetição de אַל e a declaração final de que Deus não está ouvindo tornam a proibição enfática. A tradução preserva sua severidade sem ampliar o versículo com conclusões doutrinárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Quanto a você' preserva o contraste enfático; 'eleve' mantém a imagem hebraica sem soar excessivamente arcaico. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
