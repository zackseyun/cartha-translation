  text: הַ/בָּנִ֞ים מְלַקְּטִ֣ים עֵצִ֗ים וְ/הָֽ/אָבוֹת֙ מְבַעֲרִ֣ים אֶת הָ/אֵ֔שׁ וְ/הַ/נָּשִׁ֖ים לָשׁ֣וֹת בָּצֵ֑ק לַ/עֲשׂ֨וֹת כַּוָּנִ֜ים לִ/מְלֶ֣כֶת הַ/שָּׁמַ֗יִם וְ/הַסֵּ֤ךְ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: pt
  text: Os filhos ajuntam lenha, os pais acendem o fogo, e as mulheres amassam a massa para fazer bolos para a Rainha dos Céus[a] e derramar libações a outros deuses, a fim de me provocar à ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica מְלֶכֶת הַשָּׁמַיִם é tradicionalmente entendida como “Rainha dos Céus”, provavelmente um título de uma deusa cultuada em Judá. Alguns propõem “obra dos céus”, mas o contexto favorece uma divindade pessoal que recebe ofertas.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: ajuntam lenha
  rationale: O particípio indica recolher ou juntar; “lenha” expressa naturalmente o uso da madeira no fogo sem restringi-la a gravetos.
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: acendem o fogo
  rationale: Expressa de modo claro e corrente o ato de fazer o fogo arder.
- source_word: לָשׁוֹת בָּצֵק
  choice: amassam a massa
  rationale: Preserva o sentido concreto de sovar ou amassar a massa, em vez de apenas misturá-la.
- source_word: כַּוָּנִים
  choice: bolos
  rationale: Refere-se a bolos moldados usados no culto; o contexto comunica sua função ritual.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Rainha dos Céus
  rationale: A leitura tradicional e contextualmente mais provável entende a expressão como título de uma divindade feminina.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: e derramar ofertas de bebida
  rationale: Mantém tanto a ação ritual de derramar quanto o caráter cultual das ofertas, em linguagem acessível.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Traduz diretamente o substantivo e o adjetivo, sem interpretar “outros” como “estrangeiros”.
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: a fim de me provocar à ira
  rationale: Preserva a construção de finalidade e a força causativa do verbo.
theological_decisions:
- issue: Identificação de מְלֶכֶת הַשָּׁמַיִם
  choice: Rainha dos Céus
  alternative: obra dos céus
  rationale: O contexto descreve ritos idólatras domésticos dirigidos a uma divindade pessoal, e a expressão reaparece nesse sentido em Jeremias. A alternativa debatida é registrada em nota sem eliminar a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Rainha dos Céus” conserva o título tradicional; “ofertas de bebida” prioriza clareza sobre o termo mais técnico “libações”.
