base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: pt
  text: Pois eu não falei aos seus antepassados nem lhes ordenei, no dia em que os tirei da terra do Egito, a respeito de holocausto e sacrifício.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre holocaustos e sacrifícios”. A linguagem profética provavelmente ressalta que a exigência central da aliança era a obediência, não o ritual sacrificial; compare o versículo seguinte.'
    reason: lexical_alternative
  - marker: b
    text: Esta declaração não implica necessariamente que leis sacrificiais nunca tenham sido dadas, mas pode constituir um contraste enfático dentro deste contexto profético.
    reason: theological_tension
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da repreensão anterior, preservando a força causal e argumentativa.
- source_word: לֹא דִבַּרְתִּי
  choice: eu não falei
  rationale: Reproduz diretamente o verbo comum para “falar” e mantém a força retórica da negação.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: aos seus antepassados
  rationale: Em português atual, “antepassados” comunica naturalmente a referência histórica aos pais de Israel sem a possível ambiguidade de “pais”.
- source_word: וְלֹא צִוִּיתִים
  choice: nem lhes dei ordem
  rationale: Expressa de modo natural o verbo “ordenar” e preserva o paralelismo negativo da frase.
- source_word: בְּיוֹם הוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: no dia em que os tirei da terra do Egito
  rationale: Mantém a formulação temporal concreta do hebraico e sua ligação com o êxodo.
- source_word: עַל דִּבְרֵי
  choice: a respeito de
  rationale: Introduz com naturalidade o assunto em questão sem acrescentar uma interpretação.
- source_word: עוֹלָה
  choice: holocausto
  rationale: É o termo bíblico português estabelecido para a oferta inteiramente queimada no altar.
- source_word: וָזָבַח
  choice: e sacrifício
  rationale: Conserva o singular coletivo hebraico e a distinção entre a oferta queimada e a categoria sacrificial mais geral.
theological_decisions:
- issue: Se a tradução deve suavizar a negação para evitar aparente tensão com as leis sacrificiais da Torá.
  choice: 'Manter a negação direta: “não falei... nem lhes dei ordem... a respeito de holocausto e sacrifício”.'
  alternative: Explicitar uma prioridade relativa, como “não falei principalmente”, ou inserir “de início”.
  rationale: O hebraico formula uma negação enfática. A tradução deve preservar essa tensão profética; o contexto imediato ressalta a primazia da obediência, mas essa explicação não deve ser incorporada silenciosamente ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Antepassados” evita a ambiguidade moderna de “pais”; “holocausto” preserva a terminologia sacrificial tradicional. A ordem da frase segue de perto o hebraico, sem sacrificar a naturalidade.
