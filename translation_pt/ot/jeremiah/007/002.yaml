  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲמֹ֗ד בְּ/שַׁ֨עַר֙ בֵּ֣ית יְהוָ֔ה וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וְ/אָמַרְתָּ֞ שִׁמְע֣וּ דְבַר יְהוָ֗ה כָּל יְהוּדָה֙ הַ/בָּאִים֙ בַּ/שְּׁעָרִ֣ים הָ/אֵ֔לֶּה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: pt
  text: 'Ponha-se à porta da casa de Yahweh e proclame ali esta palavra. Diga: “Ouçam a palavra de Yahweh, todos vocês de Judá que entram por estas portas para adorar[a] Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para se prostrar diante de Yahweh”. O verbo hebraico pode indicar o ato físico de curvar-se ou prostrar-se, especialmente em adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: Ponha-se
  rationale: O imperativo manda Jeremias tomar posição em um lugar determinado. “Ponha-se” expressa isso com naturalidade e dignidade em português.
- source_word: בְּשַׁעַר
  choice: à porta
  rationale: A preposição בְּ com שַׁעַר pode indicar posição na entrada ou junto dela. “À porta” é idiomático em português e preserva a referência ao acesso do templo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica literal “casa de YHWH”; “templo” seria correto no contexto, mas menos transparente à forma do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וְקָרָאתָ
  choice: proclame
  rationale: Neste contexto profético, קרא designa um anúncio público e solene.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Preserva o singular e a fórmula profética do hebraico; “esta mensagem” seria uma alternativa mais dinâmica.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural dirigido aos que entram; “Ouçam” é claro, corrente e conserva a fórmula de convocação profética.
- source_word: כָּל יְהוּדָה הַבָּאִים
  choice: todos vocês de Judá que entram
  rationale: Explicita naturalmente em português o grupo coletivamente chamado “todo Judá” e identificado pelo particípio “os que entram”.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: adorar
  rationale: No contexto do templo, o verbo se refere ao culto prestado a Yahweh, embora seu sentido concreto de prostrar-se permaneça relevante e seja registrado em nota.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o tetragrama como nome próprio. “Yahweh” preserva essa função e não o substitui por um título.
- issue: Sentido cultual de לְהִשְׁתַּחֲוֺת
  choice: adorar
  alternative: prostrar-se diante de
  rationale: “Adorar” comunica naturalmente a finalidade da entrada no templo, enquanto a nota preserva a imagem física inerente ao verbo hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom público e solene da proclamação profética, sem arcaísmos desnecessários.
