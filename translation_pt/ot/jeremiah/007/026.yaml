source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: pt
  text: Contudo, eles não me ouviram nem inclinaram os ouvidos[a]; mas endureceram a nuca e agiram com mais maldade do que seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que significa escutar com atenção ou dar ouvidos.
    reason: cultural_note
  - marker: b
    text: Ou “antepassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: não me ouviram
  rationale: Com אֶל, שׁמע indica escutar e dar ouvidos, não apenas perceber um som. “Não me ouviram” conserva a formulação relacional e deixa a desobediência implícita no contexto.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: nem inclinaram os ouvidos
  rationale: Mantém a imagem hebraica de voltar ou estender o ouvido para escutar atentamente, em paralelismo com a oração anterior.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: endureceram a nuca
  rationale: Preserva a metáfora hebraica tradicional de obstinação sem substituí-la por uma explicação interpretativa.
- source_word: הֵרֵעוּ
  choice: agiram com mais maldade
  rationale: O hifil de רעע expressa agir mal ou perversamente; diante da construção comparativa seguinte, a tradução explicita que a conduta deles foi mais má.
- source_word: מֵאֲבוֹתָם
  choice: do que seus pais
  rationale: אָבוֹת pode designar pais ou antepassados. “Pais” mantém de perto a forma hebraica e continua compreensível como referência às gerações anteriores.
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: Contudo ... nem ...; pelo contrário ... e ...
  rationale: As conjunções dão continuidade ao discurso, mas o contexto exige força adversativa. A construção portuguesa comunica o contraste e mantém o encadeamento das orações.
theological_decisions:
- issue: Força interpretativa de שׁמע
  choice: não me ouviram
  alternative: não me obedeceram
  rationale: O texto descreve a recusa de dar ouvidos a Deus. “Ouviram” preserva o sentido lexical e a tensão entre escutar e obedecer, sem inserir no texto principal uma conclusão mais explícita.
- issue: Alcance de אָבוֹת
  choice: pais
  alternative: antepassados
  rationale: A palavra pode apontar tanto para os pais quanto, de modo mais amplo, para gerações ancestrais. A opção principal segue mais de perto o hebraico, e a nota registra o sentido mais abrangente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se as imagens hebraicas de inclinar os ouvidos e endurecer a nuca; a comparação moral é expressa naturalmente, sem suavizar o sentido.
