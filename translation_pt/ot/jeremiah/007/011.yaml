  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: pt
  text: Será que esta casa, chamada pelo meu nome, se tornou, aos olhos de vocês, um covil de ladrões[a]? Também eu, sim, eu mesmo o vi — declaração de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma caverna de homens violentos” ou “um covil de salteadores”. A expressão hebraica pode enfatizar pessoas violentas e sem lei, além de ladrões em sentido específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעָרַת
  choice: esconderijo
  rationale: O substantivo designa uma caverna ou covil usado como refúgio. “Esconderijo” comunica naturalmente, em português atual, a ideia de um lugar onde criminosos se abrigam.
- source_word: פָּרִצִים
  choice: ladrões
  rationale: O termo pode designar homens violentos e transgressores, inclusive salteadores. “Ladrões” preserva a formulação bíblica reconhecível sem eliminar a amplitude lexical, registrada em nota.
- source_word: הָיָה
  choice: se tornou
  rationale: 'O perfeito, nesta pergunta retórica, admite sentido resultativo: a casa passou a funcionar como esconderijo de criminosos.'
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Preserva a expressão hebraica literal, que no contexto se refere claramente ao templo.
- source_word: נִקְרָא שְׁמִי עָלָיו
  choice: que é chamada pelo meu nome
  rationale: Mantém a fórmula hebraica de associação, pertencimento e autoridade divina em linguagem portuguesa clara.
- source_word: בְּעֵינֵיכֶם
  choice: aos olhos de vocês
  rationale: Reproduz de modo natural o idioma avaliativo hebraico e usa uma forma de tratamento amplamente compreensível.
- source_word: גַּם אָנֹכִי
  choice: Eu mesmo também
  rationale: Conserva a ênfase do pronome e a partícula גם, estabelecendo contraste com a percepção do povo.
- source_word: הִנֵּה רָאִיתִי
  choice: vi isso
  rationale: O marcador הִנֵּה intensifica a afirmação e chama atenção para ela. Em português, a ênfase é comunicada pela construção “Eu mesmo também vi isso”, evitando o pouco natural “eis que vi”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa com solenidade e clareza a fórmula profética de confirmação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração “Yahweh” preserva essa função.
- issue: Imagem do templo na pergunta retórica
  choice: se tornou ... um esconderijo de ladrões
  alternative: é ... um covil de ladrões
  rationale: “Se tornou” comunica o possível valor resultativo de הָיָה, enquanto “esconderijo” destaca que o templo era tratado como refúgio após os crimes, sem afirmar que os crimes eram necessariamente praticados ali.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A ordem foi ajustada moderadamente para fluência, preservando a pergunta retórica, a ênfase divina e a ambiguidade de פָּרִצִים.
