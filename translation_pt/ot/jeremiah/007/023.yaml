source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: pt
  text: 'Mas esta foi a ordem que lhes dei: “Escutem a minha voz[a], e eu serei o seu Deus, e vocês serão o meu povo. Andem por todo o caminho que eu lhes ordenar, para que tudo vá bem com vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Obedeçam à minha voz”. A expressão hebraica “escutar a minha voz” muitas vezes inclui a ideia de obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz uma correção contrastiva ao que foi negado no versículo anterior. “Mas” comunica naturalmente essa força adversativa.
- source_word: הַדָּבָר הַזֶּה
  choice: esta foi a ordem
  rationale: Embora דָּבָר possa significar “palavra”, “assunto” ou “coisa”, sua combinação com צִוִּיתִי indica aqui o conteúdo de uma ordem.
- source_word: צִוִּיתִי אוֹתָם לֵאמֹר
  choice: que lhes dei
  rationale: Com “ordem” já expresso, “que lhes dei” evita a repetição pouco natural “ordem que lhes ordenei”, enquanto a citação preserva o conteúdo imperativo.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Escutem a minha voz
  rationale: Preserva de modo transparente o idioma hebraico, que literalmente fala em escutar a voz, sem apagar sua frequente implicação de obediência.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: eu serei o seu Deus
  rationale: Formulação natural em português para a conhecida fórmula relacional da aliança.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: vocês serão o meu povo
  rationale: Mantém o paralelismo recíproco da fórmula da aliança em linguagem atual e amplamente compreensível.
- source_word: וַהֲלַכְתֶּם
  choice: Andem
  rationale: Conserva a metáfora bíblica de caminhar como modo de conduzir a vida e corresponde à força diretiva do contexto.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: por todo o caminho
  rationale: Reflete o singular definido “o caminho” modificado por “todo”, preservando a imagem de um curso integral de vida, sem convertê-la em vários caminhos ou maneiras.
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: que eu lhes ordenar
  rationale: O futuro do subjuntivo é natural após “que” nesta formulação e permite a dimensão prospectiva do imperfeito hebraico.
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: para que tudo vá bem com vocês
  rationale: Expressa com clareza a finalidade e o bem-estar contidos no idioma hebraico, em português corrente.
theological_decisions:
- issue: Fórmula da aliança
  choice: “eu serei o seu Deus, e vocês serão o meu povo”
  alternative: “eu serei Deus para vocês, e vocês serão povo para mim”
  rationale: A opção escolhida comunica naturalmente a relação recíproca da aliança sem acrescentar conteúdo doutrinário ao texto.
- issue: Sentido de obediência em שִׁמְעוּ בְקוֹלִי
  choice: Manter “Escutem a minha voz” no texto principal
  alternative: “Obedeçam à minha voz”
  rationale: A expressão hebraica frequentemente inclui obediência, mas seu sentido lexical e sua imagem são os de ouvir ou escutar. A tradução principal preserva essa forma e a nota explicita a nuance sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Emprega “vocês” como plural não marcado para maior clareza internacional e brasileira; conserva a metáfora de ouvir a voz e caminhar pelo caminho.
