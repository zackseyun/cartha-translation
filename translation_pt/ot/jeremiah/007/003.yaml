reference: Jeremiah 7:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: “Corrijam os seus caminhos e as suas ações[a], e deixarei que vocês habitem neste lugar[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tornem bons os seus caminhos e as suas ações”; isto é, melhorem a sua conduta e os seus atos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “farei vocês habitar neste lugar” ou “deixarei que vocês permaneçam neste lugar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem corrente e solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e verte צְבָאוֹת pelo título tradicional e semanticamente amplo, sem restringi-lo apenas a exércitos humanos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica que identifica o Deus de Israel.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: Corrijam os seus caminhos e as suas ações
  rationale: O imperativo causativo exige uma reforma concreta. “Corrijam” comunica naturalmente esse sentido, enquanto “caminhos” preserva a metáfora hebraica para a conduta e “ações” expressa os atos praticados.
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: e deixarei que vocês habitem
  rationale: O hifil de שכן pode indicar fazer habitar ou permitir que alguém permaneça. A formulação escolhida expressa permissão para continuar residindo sem eliminar a ambiguidade por meio de nota.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Mantém a referência deliberadamente ampla de מָקוֹם, que no contexto pode abranger o templo, Jerusalém e, por extensão, a terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de וַאֲשַׁכְּנָה אֶתְכֶם no contexto da aliança
  choice: deixarei que vocês habitem
  alternative: farei vocês habitar; deixarei que vocês permaneçam
  rationale: A escolha apresenta a permanência no lugar como dependente da resposta do povo, mas a nota conserva a possível nuance causativa e evita resolver indevidamente a tensão entre ação divina e residência continuada.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Vocês” explicita o plural dos imperativos e pronomes hebraicos. “Habitem” conserva o registro bíblico sem soar arcaico; as notas preservam as principais alternativas lexicais e causativas.
