source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּֽלְכוּ֙ בְּ/מֹ֣עֵצ֔וֹת בִּ/שְׁרִר֖וּת לִבָּ֣/ם הָ/רָ֑ע וַ/יִּהְי֥וּ לְ/אָח֖וֹר וְ/לֹ֥א לְ/פָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: pt
  text: Mas eles não ouviram[a] nem inclinaram o ouvido; pelo contrário, seguiram seus próprios planos[b], na teimosia de seu coração mau[c], e foram para trás, não para a frente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não escutaram” ou “não atenderam”. Neste contexto, trata-se de ouvir com atenção de modo a acolher o que foi dito.
    reason: lexical_alternative
  - marker: b
    text: Ou “seguiram seus próprios conselhos” ou “seus próprios projetos”.
    reason: lexical_alternative
  - marker: c
    text: No hebraico, “na teimosia de seu coração mau”. Aqui, “coração” inclui a vontade e o pensamento interiores, não apenas as emoções.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: O verbo abrange ouvir, escutar com atenção e atender. “Não ouviram”, esclarecido pela nota, preserva essa amplitude sem transformar implicitamente o termo em “não obedeceram”.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: inclinaram o ouvido
  rationale: Mantém a metáfora hebraica de voltar o ouvido com atenção e continua compreensível em português atual.
- source_word: וַיֵּלְכוּ בְּמֹעֵצוֹת
  choice: seguiram seus próprios planos
  rationale: Neste contexto, הלך com ב descreve a conduta orientada por algo, e מֹעֵצוֹת indica deliberações, planos ou projetos. “Seguiram seus próprios planos” comunica isso de modo natural.
- source_word: בִּשְׁרִרוּת
  choice: na teimosia
  rationale: O termo denota obstinação e vontade própria endurecida. “Teimosia” é claro e direto, sem perder a censura moral.
- source_word: לִבָּם הָרָע
  choice: de seu coração mau
  rationale: Preserva o singular coletivo do hebraico e a imagem do coração como centro interior da vontade e do pensamento, sem reduzi-lo às emoções.
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: foram para trás, não para a frente
  rationale: Reproduz o contraste direcional entre retrocesso e avanço em linguagem portuguesa natural, sem importar a imagem diferente de voltar as costas.
theological_decisions:
- issue: Antropologia moral em “seu coração mau”
  choice: Manter a avaliação moral explícita do coração como mau, sem ampliá-la.
  alternative: Parafrasear como “natureza pecaminosa” ou afirmar que o coração era inteiramente mau.
  rationale: O versículo associa o coração mau à teimosia, mas não formula aqui uma doutrina mais abrangente sobre natureza humana, depravação ou condição da aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a metáfora de inclinar o ouvido e o contraste entre trás e frente, mas usa “seguir planos” para expressar naturalmente a metáfora hebraica de conduta. O ponto e vírgula organiza a longa sequência sem apagar a ligação adversativa do texto.
