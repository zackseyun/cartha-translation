base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/027.yaml
  text: You shall speak all these words to them[a], but they will not listen to you; you shall call to them, but they will not answer you.
translation:
  language: pt
  text: Você dirá a eles todas estas palavras, mas eles não lhe darão ouvidos[a]; você os chamará, mas eles não lhe responderão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles não escutarão você” ou “eles não obedecerão a você”. O verbo hebraico שׁמע pode significar ouvir, escutar ou obedecer, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Você dirá
  rationale: O qatal qal de segunda pessoa masculina singular com waw, neste contexto de instrução profética, tem valor futuro e diretivo. “Você dirá” preserva ambos os aspectos em português natural.
- source_word: אֲלֵיהֶם
  choice: a eles
  rationale: A preposição אֶל indica aqui os destinatários da fala de Jeremias, sem exigir o sentido adversativo “contra eles”.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Embora דְּבָרִים também possa significar “coisas” ou “assuntos”, o contexto de proclamação profética favorece “palavras”.
- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: mas eles não lhe darão ouvidos
  rationale: שׁמע com אֶל pode indicar ouvir, escutar ou atender. A expressão idiomática “dar ouvidos” mantém a linguagem auditiva e sugere, sem reduzir o sentido apenas a isso, a recusa em obedecer. “Mas” expressa naturalmente o contraste contextual do waw.
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: você os chamará
  rationale: קרא seguido de אֶל descreve chamar alguém. A construção com objeto direto é natural em português e não acrescenta a ideia específica de gritar ou proclamar formalmente.
- source_word: וְלֹא יַעֲנוּכָה
  choice: mas eles não lhe responderão
  rationale: ענה no qal significa “responder”. O pronome sufixado de segunda pessoa é representado por “lhe”, e “mas” explicita o contraste natural no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dar ouvidos” é uma expressão amplamente compreensível e preserva a amplitude semântica de שׁמע. O paralelismo entre falar/chamar e não dar ouvidos/não responder foi mantido.
