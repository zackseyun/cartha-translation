  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: pt
  text: Farei cessar, nas cidades de Judá e nas ruas[a] de Jerusalém, o som do júbilo e o som da alegria, a voz do noivo e a voz da noiva, pois a terra ficará em ruínas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praças”; o termo hebraico pode indicar ruas ou espaços públicos abertos.
    reason: lexical_alternative
  - marker: b
    text: Ou “a terra ficará desolada” ou “se tornará uma desolação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Farei cessar
  rationale: 'O hifil de שׁבת expressa ação causativa: o próprio Deus fará esses sons cessarem. A formulação preserva tanto a agência divina em primeira pessoa quanto o sentido do verbo.'
- source_word: מֵעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Embora מִן indique origem ou remoção, em português a construção idiomática com “fazer cessar” pede a indicação do lugar com “nas”; o desaparecimento dos sons desses locais permanece claro no contexto.
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: e nas ruas de Jerusalém
  rationale: חֻצוֹת pode designar ruas ou espaços públicos abertos. “Ruas” é claro e natural, sem excluir a alternativa registrada em nota.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: o som do júbilo e o som da alegria
  rationale: קוֹל significa “som” ou “voz”; com substantivos abstratos, “som” comunica a celebração audível. “Júbilo” e “alegria” mantêm distintos os dois termos hebraicos e preservam o paralelismo.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: a voz do noivo e a voz da noiva
  rationale: Com pessoas, “voz” é natural e conserva a repetição hebraica da fórmula associada às celebrações de casamento.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual os sons festivos cessarão.
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  choice: a terra ficará em ruínas
  rationale: A construção היה com לְ indica a passagem a um estado de devastação. “Ficará em ruínas” é idiomático e transmite o resultado concreto do juízo, embora o hebraico use um substantivo singular.
theological_decisions:
- issue: Agência divina no juízo
  choice: “Farei cessar” mantém Deus como sujeito explícito da remoção da alegria em Judá e Jerusalém.
  alternative: “Cessarão” ou “deixarão de se ouvir”, com formulação impessoal.
  rationale: O verbo hebraico está na primeira pessoa e na forma causativa; tornar a frase impessoal enfraqueceria uma ênfase expressa no texto.
- issue: Natureza da devastação da terra
  choice: “a terra ficará em ruínas” apresenta a devastação como resultado do juízo sem especificar além do texto sua extensão ou duração.
  alternative: “a terra ficará desolada” ou “a terra se tornará uma desolação”.
  rationale: O substantivo חָרְבָּה descreve ruína ou desolação. A tradução conserva a força concreta e evita acrescentar uma interpretação doutrinária sobre o alcance do juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a repetição de “som” e “voz” foram mantidos para refletir a cadência hebraica, enquanto a sintaxe locativa foi ajustada ao uso natural do português.
