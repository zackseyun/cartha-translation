  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: pt
  text: Eles construíram os lugares altos de Tofete, no vale de Ben-Hinom, para queimar no fogo seus filhos e suas filhas — algo que eu não ordenei, nem me veio ao coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “nem me passou pela mente”. O hebraico diz literalmente: “nem subiu sobre o meu coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: Eles construíram
  rationale: O qal perfeito indica uma ação realizada, com relevância no contexto presente. Em português, o pretérito perfeito é mais natural que uma forma composta.
- source_word: בָּמוֹת
  choice: altares de sacrifício
  rationale: Aqui בָּמוֹת designa locais de culto onde se ofereciam sacrifícios. A expressão comunica a função cultual de modo claro, sem sugerir apenas elevações geográficas.
- source_word: הַתֹּפֶת
  choice: Tofete
  rationale: Nome próprio tradicionalmente transliterado em português; o artigo hebraico não precisa ser reproduzido.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: no vale de Ben-Hinom
  rationale: Traduz גֵיא e translitera o nome geográfico, preservando sua função própria.
- source_word: לִשְׂרֹף
  choice: para queimar
  rationale: O infinitivo com ל expressa finalidade.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Mantém a distinção explícita entre os dois grupos no hebraico.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Expressão portuguesa direta e convencional para a ação descrita.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: algo que eu não ordenei
  rationale: Explicita naturalmente que a oração relativa retoma a prática de queimar os filhos e as filhas.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: nem me veio ao coração
  rationale: Preserva a imagem antropomórfica do hebraico e continua compreensível em português, sem convertê-la diretamente em uma afirmação sobre cognição.
theological_decisions:
- issue: Repúdio divino ao sacrifício de crianças
  choice: nem me veio ao coração
  alternative: nem me passou pela mente
  rationale: A formulação mantém a metáfora hebraica e sua forte rejeição da prática, sem resolver a expressão como uma tese sobre conhecimento ou presciência divina.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. “Altares de sacrifício” esclarece o sentido cultual de בָּמוֹת; a expressão final conserva deliberadamente a imagem hebraica, apoiada por nota.
