  to: Eles construíram os lugares altos de Tofete, no vale de Ben-Hinom, para queimar no fogo seus filhos e suas filhas — algo que eu não ordenei, nem me veio ao coração.[a]
  rationale: Substitui-se «altares de sacrifício» por «lugares altos», preservando o sentido técnico e mais amplo de בָּמוֹת. Mantém-se a formulação final e a nota, que conservam a imagem hebraica sem transformar a expressão em uma afirmação doutrinária sobre o conhecimento divino; a âncora é posicionada junto à expressão explicada.
