    issue: «altares de sacrifício» para בָּמוֹת
    rationale: בָּמוֹת refere-se a lugares altos ou santuários cultuais, que podiam incluir altares, mas não se limita a eles. «Altares» reduz indevidamente o sentido espacial e cultual do termo.
  - severity: low
    issue: Posição da âncora de nota
    rationale: A nota explica «nem me veio ao coração», mas a âncora está no fim do versículo. Colocá-la após essa expressão torna a referência inequívoca.
