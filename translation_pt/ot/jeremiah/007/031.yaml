review_pass:
  verdict: revise
  source_fidelity: A tradução representa adequadamente a construção, a localização, a finalidade de queimar filhos e filhas no fogo e a enérgica negação divina. Contudo, בָּמוֹת não designa simplesmente «altares», mas os «lugares altos»/santuários cultuais; «altares de sacrifício» restringe e altera o referente.
  naturalness: O português é atual e claro. «Nem me veio ao coração» conserva de forma compreensível a imagem hebraica, e a nota oferece a alternativa idiomática.
  terminology: «Tofete» e «Ben-Hinom» são formas adequadas. «Lugares altos» é o equivalente terminológico estabelecido e mais fiel para בָּמוֹת. A âncora da nota deve acompanhar a expressão final que ela explica.
  issues:
