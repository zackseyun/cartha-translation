  language: pt
  text: 'Vejam: vocês estão confiando em palavras enganosas sem proveito algum.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: A forma chama enfaticamente a atenção dos destinatários. O plural concorda com o grupo interpelado e é mais natural no português atual do que “Eis”.
- source_word: בֹּטְחִים
  choice: estão confiando
  rationale: O particípio expressa ação contínua ou característica; a locução progressiva comunica esse aspecto com naturalidade.
- source_word: לָכֶם
  choice: incorporado em “vocês estão confiando”
  rationale: O dativo acompanha idiomaticamente o verbo e não exige expressão separada em português; explicitar “para vocês mesmos” daria ao reflexivo um peso incerto.
- source_word: עַל
  choice: em
  rationale: Com “confiar”, a regência portuguesa natural é “confiar em”.
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: palavras enganosas
  rationale: A expressão designa palavras marcadas pela falsidade e capazes de induzir ao erro; “enganosas” é claro, corrente e preserva essa força.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: que não trazem proveito algum
  rationale: Reproduz a negação enfática da utilidade ou benefício em português natural, mantendo a ligação semântica com as palavras nas quais o povo confia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O imperativo plural deixa explícita a interpelação coletiva presente no contexto e nas formas plurais do versículo.
