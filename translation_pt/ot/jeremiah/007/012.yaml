source:
  edition: WLC
  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: pt
  text: Pois vão agora ao meu lugar, que ficava em Siló, onde fiz o meu nome habitar outrora[a], e vejam o que fiz com ele por causa da maldade do meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde fiz habitar o meu nome”; mais tradicionalmente: “onde estabeleci o meu nome”. O hebraico preserva a imagem do nome de Deus habitando ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a advertência anterior, preservando a força causal do hebraico.
- source_word: לְכוּ נָא
  choice: vão agora
  rationale: O imperativo plural com נָא expressa aqui uma exortação enfática e imediata; esta formulação é natural em português.
- source_word: מְקוֹמִי
  choice: meu lugar
  rationale: Tradução direta que mantém a associação do local com Deus sem especificar além do texto.
- source_word: אֲשֶׁר בְּשִׁלוֹ
  choice: que ficava em Siló
  rationale: O contexto apresenta Siló como o antigo local do santuário e como exemplo histórico de juízo; o passado explicita naturalmente essa relação.
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: onde [...] fiz o meu nome habitar
  rationale: Preserva a imagem verbal hebraica da habitação do nome divino, em vez de reduzi-la a uma formulação mais abstrata.
- source_word: בָּרִאשׁוֹנָה
  choice: no princípio
  rationale: Indica que Siló foi o local anterior associado ao nome de Deus. A formulação é clara e digna em português.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Mantém a sequência de imperativos e o chamado a considerar a evidência histórica.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: o que fiz com ele
  rationale: O pronome retoma naturalmente “meu lugar”; em português, o masculino concorda com “lugar” e evita a impressão de referência a uma pessoa.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Expressa de modo claro a relação causal entre a maldade de Israel e o juízo sobre Siló.
- source_word: רָעַת עַמִּי יִשְׂרָאֵל
  choice: a maldade do meu povo Israel
  rationale: Neste contexto, רָעָה designa conduta moralmente má, e não calamidade; “maldade” transmite essa acusação com clareza.
theological_decisions:
- issue: Linguagem da presença divina em שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: onde fiz o meu nome habitar
  alternative: onde estabeleci o meu nome
  rationale: A tradução conserva a imagem hebraica do nome de Deus habitando no local e sua associação pactual com Siló, sem sugerir que a essência divina estivesse confinada ali.
- issue: Sentido temporal da oração relativa sobre Siló
  choice: que ficava em Siló
  alternative: que fica em Siló
  rationale: Siló funciona no argumento como antigo santuário já atingido pelo juízo. O passado torna essa relação histórica clara sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. A construção mantém tom solene sem arcaísmo, conserva os imperativos no plural e preserva a imagem teológica central do hebraico.
