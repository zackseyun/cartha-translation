revisions:
- from: Pois os filhos de Judá fizeram o que é mau aos meus olhos — declara Yahweh. Puseram suas abominações[a] na casa sobre a qual o meu nome é invocado[b], contaminando-a.
  to: Pois os filhos de Judá fizeram o que é mau aos meus olhos — declara Yahweh. Puseram suas abominações[a] na casa que é chamada pelo meu nome[b], para contaminá-la.
  rationale: A revisão substitui uma reprodução demasiado literal, mas enganosa em português, do idiomatismo «ser chamado pelo nome», por uma formulação natural que preserva seu sentido. A nota mantém a literalidade relevante e identifica o templo. A oração final passa a expressar explicitamente a finalidade/resultado da profanação, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:31:12Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução representa adequadamente a acusação, a fórmula profética, as «abominações» e a referência ao santuário. Contudo, «sobre a qual o meu nome é invocado» não comunica com clareza em português o idiomatismo hebraico de uma casa identificada pelo nome de Yahweh; pode sugerir que o nome é invocado em oração sobre o edifício. «Para contaminá-la» reproduz mais diretamente o valor final do infinitivo hebraico do que o gerúndio.
  naturalness: O registro é moderno e solene. «Que é chamada pelo meu nome» é uma formulação natural e suficientemente próxima do idiomatismo de origem. «Para contaminá-la» é mais claro que «contaminando-a» quanto à relação da última oração com a ação precedente.
  terminology: «Yahweh» preserva adequadamente o Tetragrama. «Abominações» é uma boa equivalência ampla para שִׁקּוּצֵיהֶם, sem limitar o termo a ídolos. «Filhos de Judá» mantém a expressão coletiva hebraica e é compreensível no registro bíblico.
  issues:
  - severity: medium
    issue: A relativa «sobre a qual o meu nome é invocado» é semanticamente ambígua em português.
    rationale: A construção hebraica significa que a casa é chamada pelo nome de Yahweh, isto é, que leva/porta seu nome. Em português, «nome invocado sobre» tende a ser entendido como um ato de invocação realizado sobre a casa, não como o idiomatismo de designação ou pertença.
  - severity: low
    issue: O gerúndio «contaminando-a» enfraquece a relação final expressa por לְטַמְּאוֹ.
    rationale: O infinitivo com לְ pode expressar propósito ou resultado pretendido. «Para contaminá-la» preserva essa relação de modo claro e natural.
  revised_text: Pois os filhos de Judá fizeram o que é mau aos meus olhos — declara Yahweh. Puseram suas abominações[a] na casa que é chamada pelo meu nome[b], para contaminá-la.
