  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: pt
  text: Pois os filhos de Judá fizeram o que é mau aos meus olhos — declara Yahweh. Puseram suas abominações[a] na casa que é chamada pelo meu nome[b], para contaminá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico se refere a coisas repulsivas, especialmente no culto; aqui provavelmente inclui ídolos.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo em Jerusalém. Literalmente, “a casa sobre a qual o meu nome é chamado”; a expressão indica a casa identificada pelo nome de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da sentença anterior e mantém de modo natural a conexão argumentativa.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a expressão hebraica de parentesco, que também pode designar coletivamente o povo de Judá.
- source_word: הָרַע בְּעֵינַי
  choice: o que é mau aos meus olhos
  rationale: Mantém tanto o adjetivo substantivado quanto a metáfora hebraica da avaliação divina, em português claro.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética com dignidade e conserva o nome divino expresso no hebraico.
- source_word: שִׁקּוּצֵיהֶם
  choice: suas abominações
  rationale: O termo designa coisas repulsivas, frequentemente objetos cultuais ou ídolos; 'abominações' preserva a força religiosa sem restringir indevidamente o referente.
- source_word: בַּבַּיִת
  choice: na casa
  rationale: Traduz literalmente o substantivo; no contexto, a casa é o templo de Jerusalém.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: sobre a qual o meu nome é invocado
  rationale: Conserva a imagem e a ambiguidade da construção hebraica mais de perto que a formulação idiomática 'que leva o meu nome'.
- source_word: לְטַמְּאוֹ
  choice: contaminando-a
  rationale: Expressa naturalmente o resultado ou propósito da ação, incluindo a profanação ritual e moral do santuário.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente em vez de substituí-lo por um título.
- issue: Natureza das שִׁקּוּצֵיהֶם
  choice: abominações
  alternative: coisas detestáveis; ídolos
  rationale: O contexto cultual provavelmente inclui ídolos, mas o termo hebraico é mais amplo; a tradução evita identificar todos os objetos de forma excessivamente específica.
- issue: Sentido da casa sobre a qual o nome é invocado
  choice: manter a expressão metafórica no texto
  alternative: a casa que leva o meu nome
  rationale: A formulação conserva a linguagem de pertencimento, identificação e presença associada ao nome divino sem explicar em excesso sua teologia.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das orações segue o hebraico sem rigidez; o travessão destaca naturalmente a fórmula profética. Todos os marcadores de nota aparecem no texto.
