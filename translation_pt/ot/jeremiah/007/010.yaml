  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: pt
  text: 'Então vocês vêm e ficam de pé diante de mim nesta casa[a], que leva o meu nome, e dizem[b]: “Fomos livrados!” — para fazerem todas estas abominações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “neste templo”. Hebraico: “nesta casa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode significar: “Estamos salvos!” ou “Estamos seguros!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: Então vocês vêm
  rationale: O waw dá sequência à acusação, e o presente torna vívida a ação habitual no discurso profético.
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: e ficam diante de mim
  rationale: Expressa de modo natural o ato de se colocar ou permanecer na presença de Deus, sem acrescentar a ideia formal de apresentação.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: Preserva o sentido literal de בַּיִת e sua ressonância como casa de Deus; no contexto, trata-se do templo.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: sobre a qual o meu nome é invocado
  rationale: Mantém mais de perto o idioma hebraico de o nome ser chamado sobre algo, indicando pertença e identificação com Deus.
- source_word: וַאֲמַרְתֶּם
  choice: e dizem
  rationale: Prossegue a sequência acusatória no presente e concorda naturalmente com o sujeito explícito em português.
- source_word: נִצַּלְנוּ
  choice: Fomos livrados!
  rationale: O nifal perfeito indica que os falantes alegam ter sido libertos ou postos a salvo; 'livrados' conserva a amplitude do verbo sem impor linguagem doutrinária posterior.
- source_word: לְמַעַן עֲשׂוֹת
  choice: para fazerem
  rationale: Reproduz de forma concisa a relação final, cuja ironia denuncia o uso da suposta libertação como licença para praticar o mal.
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: todas estas abominações
  rationale: Conserva a força moral e cultual do termo תּוֹעֵבוֹת, sem reduzir seu alcance apenas à idolatria.
theological_decisions:
- issue: Terminologia referente ao templo
  choice: casa
  alternative: templo
  rationale: Embora o referente imediato seja o templo de Jerusalém, o hebraico diz 'casa'; conservar essa forma preserva a imagem da casa que leva o nome de Deus.
- issue: Construção do nome divino sobre a casa
  choice: sobre a qual o meu nome é invocado
  alternative: que leva o meu nome
  rationale: A formulação escolhida preserva a estrutura e a tensão do idioma hebraico, enquanto a alternativa explicita de modo mais idiomático a ideia de pertença.
- issue: Sentido de נִצַּלְנוּ
  choice: Fomos livrados!
  alternative: Estamos salvos! / Estamos seguros!
  rationale: A fala pode expressar libertação já recebida ou a segurança que dela se presume. 'Fomos livrados' mantém o valor perfectivo sem decidir que se trata de salvação em sentido doutrinário pleno.
- issue: Força de לְמַעַן
  choice: para fazerem
  alternative: a fim de poderem fazer
  rationale: 'A construção final é mantida com sua ironia incisiva: eles tratam o livramento como oportunidade ou licença para continuar praticando atos abomináveis.'
translation_notes:
  register: Português moderno, digno e acessível, com 'vocês' para a segunda pessoa plural. A tradução mantém 'casa' e a expressão hebraica relativa ao nome divino, mas usa sintaxe corrente. O travessão destaca a ironia acusatória da oração final.
