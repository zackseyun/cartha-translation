  source_fidelity: A sequência verbal no presente é defensável no contexto acusatório profético. Contudo, “ficam diante de mim” pode sugerir mera permanência, enquanto עמד pede mais especificamente a ação de pôr-se/em estar de pé diante de alguém. Além disso, “sobre a qual o meu nome é invocado” reproduz literalmente a forma hebraica, mas em português pode ser entendido como pessoas invocando o nome de Deus sobre o edifício, em vez do idioma de pertença/identificação expresso no hebraico.
  naturalness: “Vêm e ficam de pé diante de mim” é claro e natural em português moderno. “Que leva o meu nome” comunica idiomaticamente o valor da expressão hebraica sem impor uma interpretação doutrinária.
  terminology: “Casa”, “livrados” e “abominações” preservam adequadamente os termos-chave e o registro profético. A nota sobre “templo” conserva a alternativa contextual; a nota sobre “salvos” e “seguros” conserva possibilidades para נִצַּלְנוּ.
