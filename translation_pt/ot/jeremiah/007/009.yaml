base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: pt
  text: Será que vocês vão roubar, assassinar, cometer adultério, jurar falsamente, queimar incenso a Baal, seguir[a] outros deuses que vocês não conheceram[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ir atrás de”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “que vocês não reconheceram”. O verbo hebraico pode indicar conhecimento, experiência ou reconhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/גָנֹב
  choice: Será que vocês vão roubar
  rationale: A partícula interrogativa הֲ introduz uma pergunta retórica, e a sequência verbal projeta a acusação como uma lista contundente. “Será que vocês vão” soa natural em português e preserva a força interrogativa.
- source_word: רָצֹחַ
  choice: assassinar
  rationale: רצח designa normalmente a morte ilícita de uma pessoa, não o ato de matar em sentido geral. “Assassinar” conserva essa especificidade moral e jurídica.
- source_word: וְ/נָאֹף
  choice: cometer adultério
  rationale: נאף é o verbo específico para adultério; a locução escolhida é clara e idiomática em português atual.
- source_word: וְ/הִשָּׁבֵעַ לַ/שֶּׁקֶר
  choice: jurar falsamente
  rationale: A expressão se refere a prestar juramento falso ou em favor de uma falsidade. A tradução mantém de forma concisa o sentido jurídico e ético.
- source_word: וְ/קַטֵּר לַ/בָּעַל
  choice: queimar incenso a Baal
  rationale: Em contexto cultual, קטר indica queimar incenso ou produzir fumaça como oferta. A formulação é direta e reconhecível.
- source_word: וְ/הָלֹךְ אַחֲרֵי
  choice: seguir
  rationale: O idioma hebraico significa literalmente “ir/andar atrás de” e, neste contexto, implica adesão religiosa. “Seguir” comunica naturalmente essa ideia, enquanto a nota registra a imagem mais literal.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a correspondência direta da expressão hebraica e evita tornar “outros” interpretativamente em “estrangeiros”.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: que vocês não conheciam
  rationale: A oração relativa modifica “outros deuses”. O imperfeito português expressa a ausência anterior de conhecimento ou relação sem restringir o verbo a mera informação mental.
theological_decisions:
- issue: Natureza de “conhecer” outros deuses
  choice: que vocês não conheciam
  alternative: que vocês não reconheciam
  rationale: ידע pode envolver conhecimento, experiência, relação ou reconhecimento. A tradução principal mantém o sentido amplo e mais literal de “conhecer”, sem decidir que o texto se refere especificamente ao reconhecimento religioso.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural e construção interrogativa natural. O travessão final preserva a continuidade sintática e retórica com o versículo seguinte. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
