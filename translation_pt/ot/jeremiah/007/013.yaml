id: JER.7.13
reference: Jeremiah 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: pt
  text: E agora, porque vocês praticaram todos estes atos — declara Yahweh —, e eu lhes falei, levantando-me cedo e falando[a], mas vocês não escutaram; eu os chamei, mas vocês não responderam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “levantar-se cedo e falar” retrata uma ação diligente e persistente; isto é, Yahweh lhes falou repetidas vezes, com empenho.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o contexto anterior quanto a transição para a consequência anunciada.
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: porque vocês praticaram todos estes atos
  rationale: Expressa naturalmente a relação causal e mantém o sentido moral de מַעֲשִׂים sem reduzir a expressão a coisas genéricas.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e representa o nome divino como nome próprio, não como título.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: eu lhes falei
  rationale: É uma correspondência direta e natural; o pronome plural identifica o povo como destinatário.
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: levantando-me cedo e falando
  rationale: Preserva a imagem concreta do idioma hebraico, enquanto a nota esclarece sua força de persistência e repetição.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mas vocês não escutaram
  rationale: Escutar conserva a metáfora auditiva e permite que a implicação de obedecer permaneça presente sem ser explicitada em excesso.
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: eu os chamei
  rationale: Transmite de modo conciso o apelo dirigido ao povo; chamar também pode sugerir convocação sem impor esse sentido.
- source_word: וְלֹא עֲנִיתֶם
  choice: mas vocês não responderam
  rationale: Mantém a imagem relacional de chamado e resposta e soa natural em português contemporâneo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. Yahweh conserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Tratamento do idioma הַשְׁכֵּם וְדַבֵּר
  choice: Preservar no texto a imagem de levantar cedo e falar
  alternative: falar insistentemente; falar repetidas vezes
  rationale: A forma literal mantém a textura e a intensidade da imagem hebraica; a nota explica seu valor idiomático sem eliminar a metáfora.
- issue: Valor de שׁמע na repreensão profética
  choice: escutaram
  alternative: obedeceram
  rationale: O verbo pode envolver obediência, mas escutaram preserva a ambiguidade entre ouvir e acolher obedientemente a palavra divina.
translation_notes:
  register: Português moderno, claro e digno, com formas pronominais de ampla legibilidade brasileira. Os travessões isolam a fórmula profética sem interromper a progressão causal. O ponto e vírgula separa os dois pares paralelos — falar/não escutar e chamar/não responder. A vírgula final foi mantida porque o período continua no versículo seguinte.
