source:
  edition: WLC
  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: pt
  text: Ó Esperança de Israel, seu Salvador no tempo da angústia, por que haverias de ser como um estrangeiro na terra[a], como um viajante que se desvia para passar a noite?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um residente estrangeiro na terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um viajante que para somente para pernoitar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  choice: Esperança
  rationale: No vocativo dirigido a Deus, o substantivo designa aquele em quem Israel deposita sua esperança. “Esperança” preserva o sentido contextual e a força de título divino.
- source_word: מוֹשִׁיעוֹ
  choice: seu Salvador
  rationale: O sufixo masculino singular retoma Israel como coletivo singular. “Seu Salvador” conserva essa relação gramatical e identifica Deus como aquele que salva Israel.
- source_word: בְּעֵת צָרָה
  choice: no tempo da angústia
  rationale: A expressão indica um período de crise ou aflição. “No tempo da angústia” é clara, solene e próxima da forma hebraica.
- source_word: לָמָּה תִהְיֶה
  choice: por que haverias de ser
  rationale: A construção comunica uma pergunta retórica de lamento, com nuance modal, e não apenas uma previsão futura.
- source_word: כְּגֵר בָּאָרֶץ
  choice: como um estrangeiro na terra
  rationale: גֵר descreve alguém que reside fora de seu lugar de origem e não pertence plenamente à comunidade local. “Estrangeiro” comunica com clareza essa condição, enquanto a nota registra uma alternativa mais específica.
- source_word: וּכְאֹרֵחַ
  choice: como um viajante
  rationale: O substantivo designa alguém de passagem. “Viajante” é atual e compreensível, sem o tom arcaico de alternativas como “viandante”.
- source_word: נָטָה לָלוּן
  choice: que se desvia para passar a noite
  rationale: A formulação preserva tanto a ideia de desviar-se ou fazer uma parada quanto o caráter temporário da hospedagem noturna.
theological_decisions:
- issue: Vocativo divino e títulos atribuídos a Deus
  choice: Entender “Esperança de Israel” e “seu Salvador” como formas de dirigir-se diretamente a Deus.
  alternative: 'Ler as expressões apenas como descrições impessoais: “a esperança de Israel, aquele que o salva”.'
  rationale: O contexto é uma oração dirigida ao SENHOR. A forma vocativa mantém a força devocional e teológica do hebraico sem acrescentar conteúdo doutrinário posterior.
- issue: Comparação de Deus com alguém apenas de passagem
  choice: Preservar a pergunta retórica sem explicar por que Deus parece ausente.
  alternative: Explicitar a ideia como “por que ages como se não te importasses com a terra?”.
  rationale: As imagens do estrangeiro e do viajante expressam a tensão do lamento. Explicá-las no corpo do texto eliminaria parte da ambiguidade poética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ó” conserva o vocativo solene; “haverias de ser” transmite a força retórica do lamento. As iniciais maiúsculas em “Esperança” e “Salvador” refletem seu emprego como títulos divinos no discurso direto.
