  text: אָבְלָ֣ה יְהוּדָ֔ה וּ/שְׁעָרֶ֥י/הָ אֻמְלְל֖וּ קָדְר֣וּ לָ/אָ֑רֶץ וְ/צִוְחַ֥ת יְרוּשָׁלִַ֖ם עָלָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
translation:
  language: pt
  text: Judá está de luto, e seus portões definham; estão escurecidos por terra[a], e o clamor de Jerusalém sobe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estão de luto por terra»; ou: «escurecem até o chão». O verbo hebraico pode indicar tornar-se escuro e, no contexto de luto, também evocar vestes ou aspecto enegrecidos.'
    reason: A construção hebraica קָדְרוּ לָאָרֶץ admite mais de uma nuance entre escurecimento, luto e abatimento junto ao chão; a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: אָבְלָה
  choice: está de luto
  rationale: O qal perfeito de אבל expressa luto ou pesar. A construção portuguesa descreve com naturalidade o estado presente de Judá no quadro profético.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: שְׁעָרֶיהָ
  choice: seus portões
  rationale: Preserva a imagem concreta dos portões, que representam por metonímia a vida pública e cívica.
- source_word: אֻמְלְלוּ
  choice: definham
  rationale: Comunica enfraquecimento e abatimento progressivos sem restringir a imagem ao mundo vegetal.
- source_word: קָדְרוּ
  choice: escurecem
  rationale: Reproduz o sentido de ficar escuro ou sombrio, associado aqui ao luto, sem acrescentar explicitamente a ideia de sentar-se.
- source_word: לָאָרֶץ
  choice: por terra
  rationale: Expressão portuguesa natural que conserva a imagem de abatimento junto ao chão e a possível noção de humilhação.
- source_word: צִוְחַת
  choice: o clamor
  rationale: Expressa um grito coletivo e intenso de aflição, apropriado à voz poética da cidade.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e padrão do nome próprio em português.
- source_word: עָלָתָה
  choice: sobe
  rationale: Mantém o movimento vertical literal do verbo עלה e funciona naturalmente no presente poético em português.
