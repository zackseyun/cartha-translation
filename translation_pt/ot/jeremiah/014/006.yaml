  yaml_path: translation/ot/jeremiah/014/006.yaml
  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: pt
  text: E os jumentos selvagens[a] estão de pé nas alturas desnudas; ofegam[b] como chacais[c]. Seus olhos falham, porque não há erva.
  philosophy: optimal-equivalence
  footnotes:
