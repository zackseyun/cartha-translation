    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָאִים
  choice: Até os jumentos selvagens
  rationale: פְרָאִים designa jumentos selvagens ou onagros, não animais domesticados. “Jumentos selvagens” é claro e natural em português moderno; “até” dá continuidade enfática à descrição da seca no contexto.
- source_word: עָמְדוּ
  choice: ficam parados
  rationale: Embora seja uma forma perfeita, o contexto apresenta vividamente uma condição contínua durante a seca. “Ficam parados” comunica tanto a postura quanto a duração da cena.
- source_word: עַל שְׁפָיִם
  choice: nos altos descampados
  rationale: שְׁפָיִם refere-se a elevações nuas, expostas e sem árvores. “Altos descampados” preserva a elevação e a aridez sem sugerir os lugares altos de culto.
- source_word: שָׁאֲפוּ רוּחַ
  choice: aspiram o ar
  rationale: A expressão retrata os animais puxando ou sorvendo ar. “Aspiram o ar” conserva de perto a imagem hebraica e permite registrar em nota a leitura contextual “ofegam por ar”.
- source_word: כַּתַּנִּים
  choice: como chacais
  rationale: Neste cenário terrestre e desértico, תַּנִּים provavelmente designa chacais, animais associados a lugares desolados na literatura profética.
- source_word: כָּלוּ עֵינֵיהֶם
  choice: Seus olhos se enfraquecem
  rationale: כלה com “olhos” descreve olhos que falham, perdem a força ou se tornam apagados por exaustão. A formulação mantém a imagem corporal do hebraico sem especificar além do texto.
- source_word: כִּי אֵין עֵשֶׂב
  choice: porque não há capim
  rationale: עֵשֶׂב indica erva ou vegetação usada como alimento por animais. “Capim” é natural e preciso para animais que pastam neste contexto.
