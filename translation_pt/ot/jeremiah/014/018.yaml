  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: pt
  text: Se saio para o campo, eis os mortos pela espada! E, se entro na cidade, eis os debilitados pela fome! Pois tanto o profeta como o sacerdote andam pela terra e não sabem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula hebraica final é difícil. O verbo traduzido por «andam» também pode ter sentido comercial: «tanto o profeta como o sacerdote percorrem a terra negociando e não entendem». Outra leitura possível é: «foram para uma terra que não conhecem». Literalmente, o final diz: «e não sabem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: Se saio para o campo
  rationale: O condicional אִם com a forma perfeita apresenta uma observação vívida. O presente em português mantém essa força, e “campo” preserva o contraste lexical com “cidade”, abrangendo aqui a região fora dela.
- source_word: וְהִנֵּה
  choice: eis
  rationale: A partícula chama a atenção para a cena percebida. “Eis” é conciso, digno e preserva a imediatez sem explicitar mais do que o hebraico.
- source_word: חַלְלֵי חֶרֶב
  choice: os mortos pela espada
  rationale: A expressão designa pessoas traspassadas ou mortas pela espada. A formulação é natural e mantém o caráter concreto da cena.
- source_word: בָּאתִי הָעִיר
  choice: entro na cidade
  rationale: Com um destino, בוא pode significar entrar. Esta opção é direta e idiomática em português.
- source_word: תַּחֲלוּאֵי רָעָב
  choice: os que adoecem de fome
  rationale: A expressão pode apontar para pessoas enfermas em consequência da fome, em paralelo com os mortos pela espada. O presente verbal retrata a calamidade em curso.
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: Pois tanto o profeta como o sacerdote
  rationale: “Pois” conserva a função explicativa de כִּי, e “tanto... como...” representa a repetição enfática de גַם.
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: vagueiam pela terra
  rationale: סחר pode descrever circulação, inclusive com sentido comercial. “Vagueiam” comunica movimento desorientado no contexto, enquanto a nota registra outras leituras possíveis.
- source_word: וְלֹא יָדָעוּ
  choice: e não sabem o que fazer
  rationale: O hebraico diz literalmente “e não sabem”, sem objeto expresso. A complementação idiomática comunica a perplexidade sugerida pelo contexto, mas é assinalada em nota por causa da dificuldade da cláusula.
theological_decisions:
- issue: Situação do profeta e do sacerdote sob o juízo
  choice: Apresentá-los como desorientados e sem saber o que fazer
  alternative: Entendê-los como comerciantes na terra ou como pessoas que foram para uma terra desconhecida
  rationale: A cláusula hebraica final é difícil. A tradução principal mantém a imagem de movimento e ignorância, sem atribuir aos líderes uma culpa específica nem transformar sua atividade em solução positiva.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com legibilidade brasileira. “Eis” preserva a força de הִנֵּה; “vagueiam” mantém o tom de desorientação. A única nota reúne as ambiguidades interligadas da cláusula final, e seu marcador aparece no texto.
