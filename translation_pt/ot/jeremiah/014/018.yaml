  source_fidelity: A tradução preserva bem o contraste entre campo e cidade e as imagens de mortos pela espada e vítimas da fome. Contudo, «vagueiam» e sobretudo «não sabem o que fazer» interpretam e ampliam a cláusula hebraica difícil. O hebraico termina simplesmente com «e não sabem», sem objeto expresso; convém manter essa elipse na tradução principal e registrar as alternativas na nota.
  naturalness: O português é claro, atual e de registro apropriado. «Eis» funciona bem no registro profético. «Os que adoecem de fome» é compreensível, mas descreve um processo; «os debilitados pela fome» representa de modo mais natural o grupo de pessoas atingidas pela enfermidade/fraqueza causada pela fome.
  terminology: «Campo», «cidade», «espada», «profeta» e «sacerdote» são escolhas adequadas. «Andam pela terra» é mais neutro do que «vagueiam» para o verbo ambíguo סחרו, que pode envolver deslocamento ou atividade comercial.
