  naturalness: 'Há duas formulações que soam menos idiomáticas em português moderno: “a quem eles estão profetizando” e, sobretudo, a sequência “sem que haja quem os sepulte — nem a eles, nem suas mulheres...”. Uma redação mais direta mantém o registro solene e melhora a clareza.'
