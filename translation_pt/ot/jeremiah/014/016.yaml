  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: pt
  text: E o povo a quem eles profetizam será lançado nas ruas de Jerusalém por causa da fome e da espada, sem que haja quem lhes dê sepultura — a eles, a suas mulheres, a seus filhos e a suas filhas. E derramarei sobre eles o mal deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a maldade deles”, “o mal que lhes é devido” ou “a calamidade deles”. A palavra hebraica pode indicar tanto o mal moral quanto a calamidade resultante.
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: a quem eles estão profetizando
  rationale: Preserva o valor participial contínuo do hebraico e indica que a fala profética é dirigida ao povo, em português natural.
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלַםִ
  choice: será lançado nas ruas de Jerusalém
  rationale: O particípio Hophal expressa que o povo será lançado e ficará exposto nas ruas; o singular coletivo concorda naturalmente com “o povo”.
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: por causa da fome e da espada
  rationale: מִפְּנֵי tem sentido causal neste contexto. Mantém-se “espada” como imagem concreta hebraica de morte violenta e juízo.
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: sem que haja quem os sepulte
  rationale: Reproduz a construção existencial com particípio e exprime claramente a ausência de qualquer pessoa que realize o sepultamento.
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: nem a eles, nem suas mulheres, nem seus filhos, nem suas filhas
  rationale: 'Explicita de modo idiomático a abrangência enfática da enumeração: todos ficarão sem sepultura.'
- source_word: וְשָׁפַכְתִּי
  choice: E derramarei
  rationale: Conserva a metáfora hebraica de derramar, importante na linguagem de juízo.
- source_word: אֶת רָעָתָם
  choice: o mal que lhes pertence
  rationale: 'Mantém deliberadamente a relação ambígua indicada pelo sufixo: pode tratar-se da maldade deles ou do mal, isto é, da calamidade, que recairá sobre eles.'
theological_decisions:
- issue: Sentido de רָעָתָם na fórmula de juízo divino
  choice: o mal que lhes pertence
  alternative: a maldade deles; o mal que lhes é devido; a calamidade deles
  rationale: A expressão hebraica pode apontar tanto para o mal moral praticado por eles quanto para a calamidade que lhes cabe como juízo. A formulação principal evita decidir silenciosamente entre causa moral e consequência judicial, e a nota registra os sentidos possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Estão profetizando” preserva o aspecto participial; “espada” e “derramarei” mantêm as imagens do hebraico. A construção “nem... nem...” esclarece que o povo e todos os familiares enumerados ficarão sem sepultura.
