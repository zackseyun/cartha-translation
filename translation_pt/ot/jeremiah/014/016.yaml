    rationale: “Sem que haja quem os sepulte — nem a eles, nem suas mulheres...” mistura regências e deixa a enumeração truncada. “Sem que haja quem lhes dê sepultura — a eles, a suas mulheres, a seus filhos e a suas filhas” é clara e conserva a abrangência enfática do hebraico.
  - severity: low
    issue: “Estão profetizando” é excessivamente perifrástico neste contexto
    rationale: O particípio hebraico pode ser vertido pelo presente simples em português sem perda relevante de aspecto. “A quem eles profetizam” é mais idiomático e mantém a ação profética dirigida ao povo.
  - severity: low
