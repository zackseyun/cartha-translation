source:
  edition: WLC
  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: pt
  text: Porque o solo está rachado[a], pois não houve chuva na terra, os lavradores se envergonham; cobrem a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está consternado” ou “está quebrado”. O verbo hebraico pode indicar estar quebrado ou consternado; no contexto da seca, provavelmente descreve o solo aberto em rachaduras.
    reason: lexical_alternative
  - marker: b
    text: Cobrir a cabeça é um sinal cultural de vergonha, pesar ou luto.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Porque
  rationale: Introduz a causa da situação descrita e mantém de modo natural a força causal do hebraico.
- source_word: הָאֲדָמָה
  choice: o solo
  rationale: Refere-se à terra cultivável atingida pela seca; “solo” distingue esse termo de בָּאָרֶץ, traduzido como “na terra”.
- source_word: חַתָּה
  choice: está devastado
  rationale: O verbo pode expressar tanto destruição ou ruptura quanto consternação. “Devastado” funciona naturalmente para o solo e conserva parte dessa amplitude, enquanto a nota registra alternativas relevantes.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para o estado do solo sem repetir “porque” de maneira pesada.
- source_word: גֶשֶׁם
  choice: chuva
  rationale: Equivalente direto, claro e corrente para a precipitação ausente.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Designa a região atingida pela seca e preserva a distinção em relação ao solo cultivável.
- source_word: בֹּשׁוּ
  choice: ficam envergonhados
  rationale: Mantém o sentido de vergonha e humilhação, ligado ao gesto de cobrir a cabeça.
- source_word: אִכָּרִים
  choice: os lavradores
  rationale: Termo moderno e digno para os trabalhadores que cultivam a terra, com vínculo claro ao contexto agrícola.
- source_word: חָפוּ רֹאשָׁם
  choice: cobrem a cabeça
  rationale: Preserva o gesto cultural concreto sem incorporar sua interpretação diretamente ao texto.
