  text: וְ/אַדִּ֣רֵי/הֶ֔ם שָׁלְח֥וּ צעורי/הם לַ/מָּ֑יִם בָּ֣אוּ עַל גֵּבִ֞ים לֹא מָ֣צְאוּ מַ֗יִם שָׁ֤בוּ כְלֵי/הֶם֙ רֵיקָ֔ם בֹּ֥שׁוּ וְ/הָכְלְמ֖וּ וְ/חָפ֥וּ רֹאשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: pt
  text: Os seus nobres mandam seus subordinados buscar água.[a] Eles vão às cisternas[b], mas não encontram água; voltam com os recipientes vazios. Ficam envergonhados e humilhados e cobrem a cabeça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus jovens” ou “seus menores”. O contexto de nobres enviando pessoas de posição inferior para buscar água favorece o sentido social de “subordinados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “covas”, “poços” ou “reservatórios”.
    reason: lexical_alternative
  - marker: c
    text: Cobrir a cabeça era um sinal cultural de vergonha, luto ou aflição.
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: os seus nobres
  rationale: O termo designa pessoas poderosas, proeminentes ou nobres. No contexto da seca e da hierarquia social, “nobres” expressa naturalmente o contraste com aqueles que são enviados.
- source_word: צְעוּרֵיהֶם
  choice: seus subordinados
  rationale: Embora possa indicar os jovens ou os menores, aqui provavelmente se refere a dependentes de posição inferior enviados pelos nobres. “Subordinados” preserva esse sentido social sem especificar indevidamente idade ou condição de escravo.
- source_word: לַמָּיִם
  choice: buscar água
  rationale: Com o verbo “mandar/enviar”, a expressão indica finalidade. Em português, “mandar buscar água” comunica essa função de modo claro e idiomático.
- source_word: גֵּבִים
  choice: cisternas
  rationale: O substantivo se refere a cavidades ou reservatórios destinados a reter água. “Cisternas” é preciso no contexto de seca, enquanto a nota preserva alternativas possíveis.
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: voltam com os recipientes vazios
  rationale: A construção descreve o retorno das pessoas com seus utensílios de água vazios. “Recipientes” mantém a referência genérica do hebraico.
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: ficam envergonhados e humilhados
  rationale: Os dois verbos relacionados intensificam a experiência de vergonha e desonra; dois termos distintos preservam o paralelismo hebraico em português natural.
- source_word: וְחָפוּ רֹאשָׁם
  choice: e cobrem a cabeça
  rationale: A tradução direta preserva o gesto cultural concreto sem substituir sua imagem por uma interpretação.
