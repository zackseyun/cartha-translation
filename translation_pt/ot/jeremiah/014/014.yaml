review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a acusação de profecia falsa, a alegação de falar em nome de Yahweh, a tríplice negação de comissão divina e a enumeração final. Contudo, «profetizam para vocês» pode sugerir benefício ou representação em português, enquanto לָכֶם marca os destinatários; «a vocês» é mais preciso. «Algo sem valor» é semanticamente possível para אֱלִיל, mas é pouco paralelo aos substantivos da lista e menos adequado ao registro do verso.
  naturalness: O texto é claro e moderno. «Estão profetizando» preserva bem a construção enfática. «A vocês», «futilidade» e «do coração deles» dão maior precisão e fluência sem elevar desnecessariamente o registro.
  terminology: «Yahweh», «mentiras», «visão falsa», «adivinhação» e «engano» são escolhas adequadas. «Futilidade» comunica a acepção contextual de אֱלִיל sem decidir pela alternativa concreta «ídolo», que permanece apropriadamente indicada em nota.
  issues:
