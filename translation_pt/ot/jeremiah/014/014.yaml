base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Os profetas estão profetizando mentiras em meu nome. Eu não os enviei, não lhes dei ordens nem falei com eles. Eles profetizam a vocês uma visão falsa, adivinhação, futilidade[a] e o engano do coração deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vacuidade”, “algo sem valor” ou “ídolo”; o termo hebraico pode ter esses sentidos em outros contextos.
    reason: Registra a amplitude lexical de אֱלִיל e a possibilidade da acepção concreta “ídolo”, sem torná-la obrigatória neste contexto.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor” e preservando sua função no texto hebraico.
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: mentiras / uma visão falsa
  rationale: Mantém o mesmo campo semântico de falsidade, com formulações naturais em português nos dois contextos.
- source_word: הַנְּבִאִים נִבְּאִים
  choice: os profetas estão profetizando
  rationale: Preserva a repetição entre o substantivo e o verbo, bem como o caráter contínuo da construção participial.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Expressão portuguesa corrente que conserva a alegação de autoridade e representação divinas.
- source_word: לֹא שְׁלַחְתִּים
  choice: eu não os enviei
  rationale: Expressa diretamente a ausência de comissão divina.
- source_word: וְלֹא צִוִּיתִים
  choice: não lhes dei ordens
  rationale: Forma natural e clara em português para a negação de qualquer ordem ou incumbência profética.
- source_word: וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: nem falei com eles
  rationale: Completa a tríplice negação de envio, ordem e comunicação divina.
- source_word: קֶסֶם
  choice: adivinhação
  rationale: Equivalente padrão para uma prática de obtenção ilícita de conhecimento oculto.
- source_word: אֱלִיל
  choice: algo sem valor
  rationale: No contexto, comunica a ideia abstrata de nulidade ou inutilidade sem impor a acepção concreta “ídolo”; a alternativa é registrada em nota.
- source_word: תַּרְמוּת לִבָּם
  choice: o engano do próprio coração
  rationale: Apresenta a mensagem como engano gerado no interior dos próprios profetas, em contraste com revelação recebida de Yahweh.
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: eles profetizam para vocês
  rationale: Mantém explícitos tanto o pronome enfático quanto os destinatários, em português amplamente compreensível.
theological_decisions:
- issue: Origem e natureza da mensagem dos falsos profetas
  choice: A tradução nega toda autorização divina e conserva a lista de conteúdos fraudulentos como apresentada no hebraico.
  alternative: Os quatro elementos da lista podem ser entendidos como categorias distintas ou como descrições parcialmente sobrepostas da mesma profecia falsa.
  rationale: A redação não transforma a enumeração em uma taxonomia técnica nem decide além do que o texto afirma; preserva o contraste entre a palavra de Yahweh e o engano procedente do coração humano.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de circulação internacional. A repetição “profetas estão profetizando” foi mantida deliberadamente por refletir a ênfase do hebraico. O marcador [a] aparece junto à expressão a que a nota se refere.
