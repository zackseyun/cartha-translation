    issue: «Profetizam para vocês»
    rationale: O dativo לָכֶם identifica o público destinatário da profecia. Em português, «para vocês» também pode ter o sentido de «em favor de vocês»; «a vocês» conserva melhor a direção do discurso.
  - severity: low
    issue: «Algo sem valor» e «do próprio coração»
    rationale: «Algo sem valor» quebra a série nominal e soa mais coloquial do que o contexto pede. «Futilidade» é uma formulação abstrata natural para a acepção contextual. O possessivo plural de לִבָּם fica mais explícito em «do coração deles».
