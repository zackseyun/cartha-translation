  text: The word of Yahweh that came to Jeremiah concerning the droughts[a].
translation:
  language: pt
  text: A palavra de Yahweh que veio a Jeremias a respeito das secas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito dos acontecimentos ligados à seca” ou “a respeito da seca”. O hebraico emprega uma forma plural, que pode indicar períodos repetidos de seca ou crises causadas por ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Esta é a palavra de Yahweh que veio a Jeremias
  rationale: A expressão hebraica é uma fórmula profética que apresenta a palavra divina dirigida ao profeta. A inclusão de “Esta é” produz um cabeçalho natural em português sem alterar o referente da oração relativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עַל דִּבְרֵי
  choice: a respeito de
  rationale: A locução introduz o assunto da palavra profética; esta formulação comunica naturalmente o valor idiomático de “sobre os assuntos de”.
- source_word: הַבַּצָּרוֹת
  choice: as secas
  rationale: “Secas” preserva o plural hebraico e se ajusta ao contexto de falta de chuva, sem ampliar o sentido para “fomes”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa por transliteração e evita substituí-lo por um título.
- issue: Alcance do plural הַבַּצָּרוֹת
  choice: as secas
  alternative: a seca
  rationale: O plural foi mantido, preservando a possibilidade de condições repetidas de seca ou de crises relacionadas, sem decidir entre essas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética permanece reconhecível, e o plural ambíguo do hebraico é preservado no texto e explicado em nota.
