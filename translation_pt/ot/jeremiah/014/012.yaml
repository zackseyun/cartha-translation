language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: pt
  text: Ainda que jejuem, não dou ouvidos ao seu clamor[a]; e, ainda que ofereçam holocausto e oferta de cereais[b], não os aceito[c]. Pelo contrário, pela espada, pela fome e pela peste[d], eu os estou destruindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “seu grito” ou “sua súplica”.
    reason: lexical_alternative
  - marker: b
    text: Em outros contextos, o termo hebraico pode designar uma oferta ou tributo de modo mais amplo; no contexto sacrificial, normalmente indica uma oferta de cereais.
    reason: lexical_alternative
  - marker: c
    text: Ou “não me agrado deles” ou “não lhes concedo favor”. O pronome hebraico é masculino plural e se refere primariamente às pessoas; a rejeição ocorre no contexto de suas ofertas.
    reason: ambiguity_preservation
  - marker: d
    text: Ou “praga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: Ainda que jejuem
  rationale: 'No contexto, כִּי introduz uma concessão: mesmo que o povo jejue, o SENHOR não atenderá ao seu clamor.'
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל
  choice: não dou ouvidos a
  rationale: A construção negativa com particípio expressa recusa contínua em atender; a locução portuguesa preserva mais do que mera percepção auditiva.
- source_word: רִנָּתָם
  choice: seu clamor
  rationale: רִנָּה designa aqui um grito ou clamor dirigido a Deus, sem precisar se é súplica ou lamento.
- source_word: יַעֲלוּ עֹלָה
  choice: ofereçam holocausto
  rationale: O hifil de עלה com עֹלָה é linguagem sacrificial e significa apresentar uma oferta inteiramente queimada.
- source_word: מִנְחָה
  choice: oferta de cereais
  rationale: Em contexto sacrificial, מִנְחָה normalmente designa a oferta feita de cereais, embora o termo possa ter sentido mais amplo.
- source_word: אֵינֶנִּי רֹצָם
  choice: não os aceito
  rationale: רצה pode indicar acolhimento favorável. O pronome masculino plural preserva a possível referência às pessoas, enquanto o contexto também vincula a recusa às ofertas apresentadas.
- source_word: כִּי
  choice: Pelo contrário
  rationale: A conjunção introduz o contraste entre os atos religiosos rejeitados e o juízo que Deus executará.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: com a espada, a fome e a peste
  rationale: Mantém a fórmula tríplice tradicional de instrumentos de juízo e soa natural em português.
- source_word: אָנֹכִי מְכַלֶּה אוֹתָם
  choice: eu os estou consumindo
  rationale: O pronome enfático אָנֹכִי e o particípio מְכַלֶּה apresentam Deus como aquele que está ativamente levando o povo ao fim.
theological_decisions:
- issue: Recusa divina de jejum, clamor e sacrifícios durante o juízo
  choice: O texto afirma que Deus não atende ao clamor nem acolhe favoravelmente o povo e seus atos sacrificiais, mas o está julgando.
  alternative: Entender a recusa como limitada apenas à oração ou apenas às ofertas.
  rationale: As duas orações paralelas abrangem jejum, clamor e sacrifícios, e a frase final contrapõe a esses atos o juízo por espada, fome e peste.
- issue: Referente do sufixo em רֹצָם
  choice: Usar o pronome masculino plural “os”, sem explicitar no corpo do texto se aponta exclusivamente para o povo ou para o que ele oferece.
  alternative: Traduzir de modo explícito como “não aceito essas ofertas”.
  rationale: A forma hebraica masculina plural favorece a referência às pessoas, mas a proximidade das ofertas permite que sua rejeição esteja incluída. A tradução conserva essa tensão em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Não dou ouvidos” comunica a recusa deliberada de atender; “holocausto” e “oferta de cereais” conservam a terminologia sacrificial corrente. A progressão e o aspecto participial da declaração final são mantidos em “estou consumindo”.
