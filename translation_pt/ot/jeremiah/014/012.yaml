  naturalness: «Não dou ouvidos ao seu clamor» e a terminologia sacrificial são naturais em registro bíblico moderno. Na fórmula final, «pela espada, pela fome e pela peste» é mais idiomático e mantém claramente o valor instrumental de בְּ do que «com a espada, a fome e a peste».
  terminology: «Holocausto», «oferta de cereais», «clamor», «espada», «fome» e «peste» são escolhas adequadas. O pronome masculino plural em «não os aceito» preserva a referência gramatical primária ao povo, sem negar que a rejeição ocorre no contexto de suas ofertas.
