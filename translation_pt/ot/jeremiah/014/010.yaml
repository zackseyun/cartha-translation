source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: pt
  text: 'Assim diz Yahweh a respeito deste povo: Assim eles têm amado vaguear[a]; não têm refreado os seus pés. Por isso, Yahweh não os aceita[b]. Agora ele se lembrará da iniquidade deles e os punirá por seus pecados[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm amado andar sem rumo” ou “têm amado perambular”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh não se agrada deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “visitará os pecados deles”; expressão hebraica que, neste contexto, significa chamá-los a juízo e puni-los por seus pecados.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָעָם הַזֶּה
  choice: a respeito deste povo
  rationale: Neste contexto, ל introduz o povo acerca do qual Yahweh faz a declaração; a formulação é clara e natural em português.
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: Eles gostam mesmo de andar sem rumo
  rationale: כֵּן tem aqui força enfática ou confirmativa, enquanto אָהַב com infinitivo exprime inclinação ou gosto habitual. A formulação comunica a afeição persistente pelo vaguear sem tornar o português artificial.
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: não refreiam os pés
  rationale: Mantém a imagem corporal hebraica de uma conduta não contida, em linguagem inteligível e digna.
- source_word: לֹא רָצָם
  choice: não os aceita
  rationale: רצה indica aqui acolhimento favorável; “aceita” preserva o sentido relacional e judicial, enquanto uma nota registra a alternativa ligada ao agrado.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: se lembrará da iniquidade deles
  rationale: Conserva o verbo “lembrar” e seu valor judicial no contexto, sem reduzi-lo a mera recordação mental.
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: e os chamará a prestar contas por seus pecados
  rationale: Em contexto de juízo, פקד significa voltar a atenção para as transgressões a fim de exigir contas. A escolha torna esse sentido claro sem inserir uma especificação punitiva além do idioma hebraico.
theological_decisions:
- issue: Sentido de לֹא רָצָם na resposta divina
  choice: Yahweh não os aceita
  alternative: Yahweh não se agrada deles
  rationale: “Não os aceita” expressa o desfavor divino no contexto, mas a alternativa é mantida em nota para não eliminar a amplitude de רצה.
- issue: Linguagem do juízo em וְיִפְקֹד חַטֹּאתָם
  choice: os chamará a prestar contas por seus pecados
  alternative: castigará os pecados deles / tratará dos pecados deles
  rationale: A tradução comunica a ação judicial de Deus e preserva a tensão do verbo פקד, que pode significar visitar, tratar ou punir conforme o contexto, sem impor um mecanismo doutrinário específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome Yahweh, a imagem dos pés não refreados e a linguagem judicial de lembrar e visitar, esclarecendo apenas o necessário para fluência.
