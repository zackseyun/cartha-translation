id: JER.14.21
reference: Jeremiah 14:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: pt
  text: Não nos desprezes por amor do teu nome; não desonres o teu trono glorioso[a]. Lembra-te; não quebres a tua aliança conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o trono da tua glória”.
    reason: alternativa lexical
lexical_decisions:
- source_word: תִּנְאַץ
  choice: desprezes
  rationale: O verbo נאץ expressa rejeição marcada por desprezo, não mera recusa. “Desprezar” conserva essa força em português corrente. O objeto “nos”, implícito no hebraico, é explicitado a partir do contexto da oração e da expressão final “conosco”.
- source_word: לְמַעַן שִׁמְךָ
  choice: por amor do teu nome
  rationale: A expressão apela ao nome de Deus — sua identidade, caráter e reputação — como fundamento do pedido. “Por amor do teu nome” preserva o valor final e pactual da locução sem reduzi-la a uma causa meramente circunstancial.
- source_word: תְּנַבֵּל
  choice: desonres
  rationale: No piel, נבל aqui significa tratar de modo vergonhoso ou desonrar. “Desonrar” combina naturalmente com “trono” e não introduz a ideia especificamente ritual que “profanar” poderia sugerir.
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: o teu trono glorioso
  rationale: A construção significa literalmente “o trono da tua glória”. “O teu trono glorioso” é uma formulação natural em português que preserva o sentido; a forma mais literal é registrada em nota.
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Mantém o imperativo direto dirigido a Deus e sua ressonância pactual, em linguagem portuguesa digna e natural.
- source_word: תָּפֵר
  choice: quebres
  rationale: O verbo פרר, usado com “aliança”, significa quebrar, violar ou anular. “Quebrar a aliança” é claro e conserva a imagem do hebraico.
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: a tua aliança conosco
  rationale: Traduz diretamente “tua aliança” e a relação expressa por אִתָּנוּ, sem acrescentar no texto a ideia implícita de que a aliança foi feita.
theological_decisions:
- issue: Referente de “o teu trono glorioso”
  choice: A expressão foi mantida sem identificar o trono com um referente específico.
  alternative: Entender a expressão especificamente como o templo/Sião, o trono terreno da glória de Deus, ou como o trono celestial de Deus.
  rationale: O hebraico é evocativo e admite referências sobrepostas. Especificar templo, Sião ou céu resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“teu”, “Lembra-te”). A pontuação preserva a sequência urgente das súplicas e mantém a pausa enfática entre “Lembra-te” e “não quebres”.
