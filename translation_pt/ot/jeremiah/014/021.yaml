  source_fidelity: O texto traduz com precisão as quatro súplicas do hebraico. “Não nos desprezes” comunica adequadamente a rejeição desdenhosa de נָאַץ, e a explicitação de “nos” é contextual e não altera o sentido. “Por amor do teu nome” expressa de modo idiomático o apelo de לְמַעַן שִׁמְךָ. “Não desonres o teu trono glorioso” preserva a construção sem determinar o referente do trono. “Lembra-te; não quebres a tua aliança conosco” reproduz os imperativos e a relação pactual de forma fiel.
