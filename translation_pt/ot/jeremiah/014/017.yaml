review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os principais referentes foram preservados, incluindo a primeira pessoa dos olhos, a duração contínua e a personificação «a virgem filha do meu povo». Contudo, «foi destroçada por uma grande devastação» não representa bem a construção cognata hebraica: «devastação» não corresponde naturalmente ao verbo «destroçada», e a relação causal resultante é imprecisa.'
  naturalness: O texto é em geral claro e solene. «E lhes dirás» é mais natural no registro profético e mais amplamente internacional do que «E você lhes dirá». «Que meus olhos derramem lágrimas» preserva os olhos como sujeito, como no hebraico, e é idiomático em português.
  terminology: «Ferida gravíssima» comunica adequadamente מַכָּה נַחְלָה מְאֹד. Para שֶׁבֶר גָּדוֹל נִשְׁבְּרָה, «sofreu uma grande ruína» é natural e conserva o sentido de devastação/ruptura; a nota informa de modo preciso a ênfase da construção cognata, sem forçar em português uma repetição artificial.
  issues:
  - severity: medium
    issue: A tradução de שֶׁבֶר גָּדוֹל נִשְׁבְּרָה mistura imagens não correspondentes.
    rationale: «Foi destroçada por uma grande devastação» faz de «devastação» o agente de «destroçada», sem reproduzir de modo claro o passivo cognato hebraico. Além disso, a nota sobre «quebrada ... quebra» não explica diretamente a redação adotada.
  - severity: low
    issue: «E você lhes dirá» é menos adequado ao registro profético internacional.
    rationale: Embora compreensível, o pronome explícito é desnecessário e mais marcado pelo uso brasileiro. «E lhes dirás» mantém clareza, solenidade e ampla recepção lusófona.
  - severity: low
    issue: A imagem hebraica tem «meus olhos» como sujeito.
    rationale: «Que lágrimas corram dos meus olhos» transmite o sentido, mas desloca o sujeito. «Que meus olhos derramem lágrimas» preserva melhor a forma e continua natural.
