revisions:
- from: 'E você lhes dirá esta palavra: “Que lágrimas corram dos meus olhos noite e dia e não cessem[a], pois a virgem filha do meu povo[b] foi destroçada por uma grande devastação[c], com uma ferida gravíssima”.'
  to: 'E lhes dirás esta palavra: “Que meus olhos derramem lágrimas noite e dia e não cessem[a], pois a virgem filha do meu povo[b] sofreu uma grande ruína[c], com uma ferida gravíssima.”'
  rationale: A revisão conserva a ambiguidade quanto à voz que fala e à identidade personificada da «virgem filha». Corrige a formulação da ruína para uma expressão portuguesa coerente e natural, enquanto a nota preserva explicitamente o efeito enfático da construção cognata hebraica. Também ajusta o registro e mantém os olhos como sujeito da oração, em conformidade mais estreita com o texto-fonte.
