source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: pt
  text: 'E lhes dirás esta palavra: “Que meus olhos derramem lágrimas noite e dia e não cessem[a], pois a virgem filha do meu povo[b] sofreu uma grande ruína[c], com uma ferida gravíssima.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não se aquietem” ou “e não se calem”; o verbo hebraico pode indicar ficar quieto ou cessar.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a virgem filha do meu povo”, personificação poética do povo como uma jovem mulher.'
    reason: cultural_note
  - marker: c
    text: O hebraico emprega um substantivo e um verbo da mesma raiz, literalmente algo como “uma grande quebra foi quebrada”, para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: E você lhes dirá
  rationale: O perfeito com waw introduz uma instrução profética. O futuro em português comunica naturalmente essa ordem no contexto, e “você” favorece ampla legibilidade brasileira.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Mantém o singular e o vocabulário profético de דָּבָר; “mensagem” seria possível, mas menos formalmente correspondente.
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: Que lágrimas corram dos meus olhos
  rationale: Reproduz de modo natural a imagem hebraica de lágrimas que descem dos olhos, evitando a expressão pouco idiomática “que meus olhos desçam lágrima”.
- source_word: לַיְלָה וְיוֹמָם
  choice: noite e dia
  rationale: Preserva o merismo que exprime continuidade.
- source_word: וְאַל תִּדְמֶינָה
  choice: e não cessem
  rationale: No contexto do choro, דמה indica ficar quieto ou parar; “não cessem” transmite que as lágrimas não devem parar, sem eliminar a alternativa lexical registrada em nota.
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: foi destroçada por uma grande devastação
  rationale: A combinação de termos semanticamente próximos procura conservar a intensidade da construção cognata hebraica sem produzir em português a formulação artificial “foi quebrada por uma grande quebra”.
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: a virgem filha do meu povo
  rationale: Retém a personificação poética do povo como uma jovem virgem, em vez de substituí-la diretamente por Judá ou Sião.
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: com uma ferida gravíssima
  rationale: מַכָּה pode designar golpe ou ferida, enquanto נַחְלָה מְאֹד intensifica sua gravidade. “Ferida gravíssima” é natural e não decide que ela seja incurável.
theological_decisions:
- issue: A identidade da “virgem filha do meu povo”
  choice: Conservar a personificação poética do povo como “a virgem filha do meu povo”.
  alternative: Explicitar como “o povo de Judá” ou “a filha de Sião”.
  rationale: O próprio verso diz “meu povo” e não nomeia diretamente Judá ou Sião. Manter a metáfora conserva sua força literária e evita acrescentar uma identificação interpretativa ao texto.
- issue: O referente das lágrimas
  choice: 'Manter a primeira pessoa: “dos meus olhos”.'
  alternative: Explicitar que os olhos são de Jeremias ou de Deus.
  rationale: O contexto literário permite discussão sobre a voz do lamento. A tradução preserva a primeira pessoa do hebraico sem resolver silenciosamente essa tensão.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira. A construção “esta palavra” preserva o registro profético; “destroçada por uma grande devastação” mantém a ênfase poética sem impor ao leitor uma reprodução morfologicamente literal e pouco natural do cognato hebraico.
