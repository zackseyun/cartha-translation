base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh a respeito dos profetas que profetizam em meu nome, embora eu não os tenha enviado, e que dizem: “Espada e fome não haverá nesta terra”[a]: pela espada e pela fome esses profetas perecerão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Guerra e fome não virão sobre esta terra”. Em hebraico, literalmente: “Espada e fome não haverá nesta terra”.'
    reason: Registra a alternativa idiomática para חֶרֶב e para a construção existencial sem substituir a imagem do texto principal.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão inferida do contexto anterior e preserva claramente a conexão discursiva.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino.
- source_word: עַל
  choice: a respeito de
  rationale: Introduz o tema do pronunciamento divino sem tornar explícito em excesso o caráter adversativo já indicado pelo juízo.
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: os profetas que profetizam
  rationale: Mantém a construção cognata e a repetição expressiva do hebraico.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Expressa naturalmente a alegação de representação ou autorização divina.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: embora eu não os tenha enviado
  rationale: Torna clara a relação concessiva e o contraste entre a alegação dos profetas e a declaração divina.
- source_word: וְהֵמָּה אֹמְרִים
  choice: e que dizem
  rationale: Traduz o particípio de forma direta e natural, sem acrescentar necessariamente uma nuance iterativa.
- source_word: חֶרֶב וְרָעָב
  choice: Espada e fome
  rationale: Conserva a imagem profética tradicional da espada, que pode representar guerra, em vez de explicitar uma única interpretação.
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: não haverá nesta terra
  rationale: Reproduz de modo idiomático e próximo a construção existencial hebraica.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: pela espada e pela fome
  rationale: Preserva o valor instrumental da preposição e o paralelismo solene.
- source_word: יִתַּמּוּ
  choice: serão exterminados
  rationale: No contexto de juízo e morte por espada e fome, comunica o sentido de chegarem ao fim ou serem destruídos com clareza.
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: esses profetas
  rationale: Retoma de modo natural em português os profetas específicos mencionados anteriormente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino e segue a orientação lexical fornecida sem importar uma formulação denominacional.
- issue: Sentido de חֶרֶב
  choice: espada
  alternative: guerra
  rationale: A imagem concreta do hebraico foi mantida, preservando sua força profética e a possibilidade de funcionar metonimicamente para guerra.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e compreensão internacional. A ordem marcada em “Espada e fome não haverá” foi mantida dentro da fala para preservar a ênfase e a cadência profética; o restante segue sintaxe portuguesa natural.
