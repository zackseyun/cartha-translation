  text: כִּ֤י גַם אַיֶּ֨לֶת֙ בַּ/שָּׂדֶ֔ה יָלְדָ֖ה וְ/עָז֑וֹב כִּ֥י לֹֽא הָיָ֖ה דֶּֽשֶׁא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: pt
  text: Pois até a corça no campo dá à luz e abandona sua cria[a], porque não há capim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «e a deixa»; o hebraico não explicita o objeto, mas o sentido é que a corça abandona o filhote recém-nascido por não haver pasto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que sustenta o lamento anterior e preserva a ligação discursiva.
- source_word: גַם
  choice: até
  rationale: 'Expressa a força enfática: a seca atinge até mesmo os animais selvagens.'
- source_word: אַיֶּלֶת
  choice: a corça
  rationale: Designa especificamente a fêmea do cervo; «corça» é precisa, corrente e digna em português.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Preserva de modo direto a imagem concreta e a indicação de lugar.
- source_word: יָלְדָה
  choice: dá à luz
  rationale: Traduz o ato de parir e usa o presente para transmitir a vivacidade poética da cena.
- source_word: וְעָזוֹב
  choice: e abandona sua cria
  rationale: O verbo significa deixar ou abandonar. Embora o objeto não esteja expresso em hebraico, o contexto aponta para o filhote recém-nascido; «sua cria» torna o sentido claro sem especificar sexo ou número além do necessário.
- source_word: כִּי לֹא הָיָה
  choice: porque não há
  rationale: Apresenta a causa do abandono; o presente harmoniza com a descrição vívida da seca.
- source_word: דֶּשֶׁא
  choice: capim
  rationale: Refere-se a erva tenra ou vegetação nova. «Capim» é concreto, natural para leitores brasileiros e apropriado como alimento de animais, sem ampliar para toda a vegetação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo conciso e a imagem severa da seca; «corça» conserva a precisão zoológica, e «capim» soa mais natural no contexto animal.
