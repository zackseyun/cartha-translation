id: JER.14.20
reference: Jeremiah 14:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: pt
  text: Reconhecemos, ó Yahweh, a nossa maldade, a iniquidade dos nossos pais[a], pois pecamos contra ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antepassados”. O hebraico diz literalmente “pais”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: Reconhecemos
  rationale: Embora ידע signifique literalmente “conhecer”, neste contexto penitencial indica reconhecer ou admitir a culpa. “Reconhecemos” conserva o aspecto cognitivo e a força confessional sem explicitar mais do que o hebraico.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título; a interjeição “ó” corresponde naturalmente ao vocativo da oração.
- source_word: רִשְׁעֵנוּ
  choice: a nossa maldade
  rationale: Expressa o substantivo abstrato רֶשַׁע como conduta moralmente perversa e mantém distinção em relação a עָוֹן.
- source_word: עֲוֹן
  choice: a iniquidade
  rationale: Preserva o peso moral do termo e o paralelismo com “maldade”, sem reduzir os dois substantivos a uma única palavra portuguesa.
- source_word: אֲבוֹתֵינוּ
  choice: dos nossos pais
  rationale: Reproduz a forma masculina plural do hebraico. A acepção mais ampla, “antepassados”, é registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural em português o fundamento da confissão apresentada na primeira oração.
- source_word: חָטָאנוּ
  choice: pecamos
  rationale: O perfeito hebraico é adequadamente expresso pelo pretérito perfeito português, indicando o pecado cometido e agora confessado.
- source_word: לָךְ
  choice: contra ti
  rationale: Com o verbo חטא, a preposição marca a parte ofendida; “pecar contra” é a construção idiomática em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, sem o substituir pelo título “SENHOR”; “Javé” é uma forma portuguesa tradicional, mas menos próxima da transliteração adotada.
- issue: Alcance de אֲבוֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: “Pais” mantém a forma masculina concreta do hebraico e a continuidade intergeracional da confissão. Como o termo também pode abranger gerações ancestrais, essa leitura é preservada em nota, sem neutralizar silenciosamente o texto.
translation_notes:
  register: 'Português moderno, digno e acessível, com sintaxe natural de oração confessional. Emprega “ti” em concordância com o tratamento divino tradicional e mantém os três termos de culpa suficientemente distintos: “maldade”, “iniquidade” e “pecamos”.'
