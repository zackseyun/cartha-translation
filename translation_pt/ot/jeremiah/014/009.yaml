  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: pt
  text: Por que haverias de ser como um homem atônito, como um guerreiro que não pode salvar? Contudo, tu estás no meio de nós, Yahweh, e teu nome é chamado sobre nós[a]. Não nos abandones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “somos chamados pelo teu nome”. Literalmente, “teu nome é chamado sobre nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: Por que serias
  rationale: A pergunta introduz um protesto reverente; o futuro do pretérito transmite em português a nuance modal do imperfeito hebraico, em vez de uma simples referência ao futuro.
- source_word: כְּאִישׁ נִדְהָם
  choice: como um homem atônito
  rationale: O particípio nifal descreve alguém tomado de espanto e momentaneamente sem reação. “Atônito” preserva essa ideia e combina com o paralelo de incapacidade que segue.
- source_word: כְּגִבּוֹר לֹא יוּכַל לְהוֹשִׁיעַ
  choice: como um guerreiro incapaz de salvar
  rationale: גִּבּוֹר designa aqui um homem forte no contexto de combate; “guerreiro” explicita a imagem. A construção com יכל expressa incapacidade, e הושיע é vertido por “salvar”.
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: Contudo, tu estás no meio de nós
  rationale: A conjunção assume valor contrastivo no contexto. “No meio de nós” preserva a imagem espacial e relacional de בְּקֶרֶב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: e o teu nome é invocado sobre nós
  rationale: A formulação conserva a imagem hebraica de o nome ser pronunciado ou invocado sobre o povo, indicando identificação, pertencimento e reivindicação divina. A equivalência idiomática é apresentada em nota.
- source_word: אַל תַּנִּחֵנוּ
  choice: Não nos abandones
  rationale: A forma volitiva negativa expressa uma súplica. Neste contexto, o hifil de נוח tem o sentido de deixar ou abandonar; “abandones” comunica claramente a força relacional do apelo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome pessoal divino. A transliteração preserva sua função no apelo dirigido ao Deus de Israel.
- issue: Fórmula de pertencimento וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: o teu nome é invocado sobre nós
  alternative: somos chamados pelo teu nome
  rationale: A tradução principal mantém a metáfora e a passividade do hebraico sem restringir a fórmula a uma única explicação teológica; a forma idiomática é conservada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com uso de “tu” coerente no discurso direto dirigido a Deus. A sintaxe conserva o paralelismo poético e a tensão entre a aparente incapacidade divina e sua presença no meio do povo.
