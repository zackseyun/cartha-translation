revisions:
- from: Por que serias como um homem atônito, como um guerreiro incapaz de salvar? Contudo, tu estás no meio de nós, Yahweh, e o teu nome é invocado sobre nós[a]. Não nos abandones.
  to: Por que haverias de ser como um homem atônito, como um guerreiro que não pode salvar? Contudo, tu estás no meio de nós, Yahweh, e teu nome é chamado sobre nós[a]. Não nos abandones.
  rationale: A revisão substitui “invocado” por “chamado”, preservando a voz passiva e a imagem da fórmula hebraica, sem impor uma explicação teológica específica. “Por que haverias de ser” torna explícita de forma idiomática a força retórica e modal do imperfeito hebraico. A nota mantém a alternativa idiomática e explica a literalidade da tradução principal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:39Z'
review_pass:
  verdict: revise
  source_fidelity: A oração, o paralelismo e os termos centrais são em geral bem representados. Contudo, “é invocado sobre nós” interpreta נִקְרָא (“é chamado”) como ato de invocação, em vez de conservar a formulação passiva do nome de Yahweh ser chamado sobre o povo. A nota atual já oferece adequadamente a equivalência idiomática.
  naturalness: “Por que haverias de ser” expressa de modo mais natural, em português atual, a pergunta retórica com nuance modal. O restante mantém um registro elevado e claro. A construção literal “teu nome é chamado sobre nós” é deliberadamente incomum, mas é esclarecida pela nota e preserva a imagem hebraica.
  terminology: “Yahweh”, “guerreiro”, “salvar” e “Não nos abandones” são escolhas adequadas. A fórmula do nome deve evitar “invocado”, pois isso especifica uma interpretação que o hebraico não exige.
  issues:
  - severity: medium
    issue: “o teu nome é invocado sobre nós” para וְשִׁמְךָ עָלֵינוּ נִקְרָא
    rationale: O verbo נקרא é passivo de “chamar”, e a expressão descreve o nome divino como chamado sobre o povo, uma fórmula de identificação/pertencimento. “Invocado” pode ser uma interpretação possível em outros contextos, mas aqui desloca o foco para a prática de invocação e não corresponde à formulação literal preservada pelo texto-fonte e pela trilha de auditoria inglesa.
  revised_text: Por que haverias de ser como um homem atônito, como um guerreiro que não pode salvar? Contudo, tu estás no meio de nós, Yahweh, e teu nome é chamado sobre nós[a]. Não nos abandones.
