  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה הַ/נְּבִאִ֜ים אֹמְרִ֤ים לָ/הֶם֙ לֹֽא תִרְא֣וּ חֶ֔רֶב וְ/רָעָ֖ב לֹֽא יִהְיֶ֣ה לָ/כֶ֑ם כִּֽי שְׁל֤וֹם אֱמֶת֙ אֶתֵּ֣ן לָ/כֶ֔ם בַּ/מָּק֖וֹם הַ/זֶּֽה׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: pt
  text: 'Então eu disse: “Ah, Senhor DEUS! Eis que os profetas lhes dizem: ‘Vocês não verão a espada, e a fome não os atingirá, pois eu lhes darei verdadeira paz neste lugar.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Mantém a distinção entre o título אֲדֹנָי e o nome divino יהוה, seguindo uma convenção reverente e reconhecível em português.
- source_word: לֹא תִרְאוּ חֶרֶב
  choice: Vocês não verão a espada
  rationale: Reproduz diretamente a expressão hebraica, em que “espada” representa guerra e violência sem apagar a imagem original.
- source_word: וְרָעָב לֹא יִהְיֶה לָכֶם
  choice: e não haverá fome entre vocês
  rationale: Expressa em português natural a construção hebraica de existência/ocorrência com לָכֶם, sem acrescentar uma ideia causal ausente.
- source_word: שְׁלוֹם אֱמֶת
  choice: verdadeira paz
  rationale: 'Preserva a combinação de שָׁלוֹם com אֱמֶת, entendendo o segundo termo como qualidade da paz: real, segura e não enganosa.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Equivalência direta e idiomática da expressão locativa hebraica.
theological_decisions:
- issue: A promessa divina citada pelos falsos profetas
  choice: Manter a fala em primeira pessoa — “eu lhes darei” — dentro da citação dos profetas
  alternative: Reformular como uma afirmação indireta de que Deus lhes daria paz
  rationale: O hebraico apresenta as palavras como discurso direto atribuído a Deus pelos profetas. Preservar essa forma deixa claro o peso da alegação deles sem endossá-la como verdadeira.
- issue: Sentido de שְׁלוֹם אֱמֶת
  choice: verdadeira paz
  alternative: paz duradoura / paz segura
  rationale: '“Verdadeira paz” conserva a tensão do texto: os profetas prometem uma paz alegadamente real, posteriormente desmentida pelo próprio Deus.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais (“vocês”, “lhes”). A interjeição “Ah!” conserva o tom de aflição do profeta. As aspas aninhadas distinguem a fala de Jeremias da mensagem citada dos profetas.
