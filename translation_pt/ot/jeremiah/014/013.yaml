  to: 'Então eu disse: “Ah, Senhor DEUS! Eis que os profetas lhes dizem: ‘Vocês não verão a espada, e a fome não os atingirá, pois eu lhes darei verdadeira paz neste lugar.’”'
  rationale: A revisão restitui “eis que”, presente no hebraico, e ajusta a formulação sobre a fome para refletir melhor o dativo “para vocês”, preservando a alegação em discurso direto atribuída aos profetas.
