  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: pt
  text: Ainda que as nossas iniquidades testemunhem contra nós[a], ó Yahweh, age por amor do teu nome; pois são muitos os nossos atos de infidelidade[b]; contra ti pecamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se as nossas iniquidades testemunham contra nós”. O hebraico pode ser entendido de modo condicional (“se”) ou concessivo (“ainda que”); o contexto desta oração favorece o sentido concessivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os nossos desvios” ou “as nossas apostasias”. O termo hebraico indica atos de afastamento e infidelidade para com Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ainda que
  rationale: A partícula pode ser condicional ou concessiva. Neste contexto de confissão seguida de súplica, o valor concessivo é o mais natural, sem eliminar a alternativa em nota.
- source_word: עֲוֺנֵינוּ
  choice: as nossas iniquidades
  rationale: O termo abrange culpa e perversidade moral, sendo mais forte do que uma referência genérica a pecados isolados.
- source_word: עָנוּ בָנוּ
  choice: testemunhem contra nós
  rationale: 'A construção possui nuance forense: as próprias iniquidades dão testemunho acusatório contra o povo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: עֲשֵׂה
  choice: age
  rationale: O imperativo é amplo e, nesta súplica, pede que Yahweh intervenha, sem especificar além do texto a natureza da ação.
- source_word: לְמַעַן שְׁמֶךָ
  choice: por amor do teu nome
  rationale: Expressão portuguesa natural que preserva o apelo à honra, reputação e caráter associados ao nome divino.
- source_word: רַבּוּ מְשׁוּבֹתֵינוּ
  choice: são muitos os nossos atos de infidelidade
  rationale: Comunica de modo claro os repetidos atos de afastamento e deslealdade pactual, evitando que um termo técnico estreite indevidamente o sentido.
- source_word: לְךָ חָטָאנוּ
  choice: contra ti pecamos
  rationale: Com o verbo 'pecar', a preposição identifica a parte ofendida; a formulação concisa preserva a ênfase inicial em Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. A transliteração 'Yahweh' o preserva sem substituí-lo por um título.
- issue: Sentido de מְשׁוּבֹתֵינוּ
  choice: nossos atos de infidelidade
  alternative: nossas apostasias; nossos desvios
  rationale: A expressão mantém a gravidade do afastamento reiterado de Yahweh, mas não importa para o verso um sentido técnico posterior de 'apostasia' que poderia ser mais estreito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa do singular mantém o discurso direto a Deus. A ordem “contra ti pecamos” conserva a ênfase do hebraico.
