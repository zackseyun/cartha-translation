  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: pt
  text: Será que há, entre os ídolos das nações[a], algum que faça chover? Ou podem os céus dar chuvas? Não és tu, Yahweh, nosso Deus? E esperamos em ti[b], pois tu fizeste[c] todas estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “vaidades das nações”; isto é, seus ídolos ou deuses sem valor.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aguardamos por ti” ou “pomos em ti a nossa esperança”. O verbo hebraico pode indicar espera acompanhada de esperança confiante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “realizaste”. O verbo hebraico pode significar “fazer”, “realizar” ou, conforme o contexto, “criar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ בְּהַבְלֵי הַגּוֹיִם
  choice: Será que há, entre os ídolos das nações, algum
  rationale: Mantém a força da pergunta retórica e explicita o referente contextual de הֲבָלִים como os deuses ou ídolos sem valor das nações, enquanto a nota preserva a imagem literal.
- source_word: מַגְשִׁמִים
  choice: que faça chover
  rationale: 'Expressa de modo natural em português a forma causativa do verbo גשם: produzir ou trazer chuva.'
- source_word: וְאִם הַשָּׁמַיִם יִתְּנוּ רְבִבִים
  choice: Ou podem os céus dar chuvas?
  rationale: O וְאִם introduz a segunda alternativa retórica; “podem” comunica a capacidade questionada, e “dar chuvas” conserva de perto נתן e o sentido pluvial de רְבִבִים.
- source_word: הֲלֹא אַתָּה הוּא
  choice: Não és tu
  rationale: Preserva a identificação enfática e retórica de Yahweh como aquele que de fato pode conceder a chuva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּנְקַוֶּה לָּךְ
  choice: E esperamos em ti
  rationale: קוה combina espera, esperança e expectativa confiante. “Esperamos em ti” é natural e conserva essa amplitude melhor do que uma formulação que indique apenas espera temporal.
- source_word: כִּי אַתָּה עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: pois tu fizeste todas estas coisas
  rationale: כִּי fornece a razão da esperança; “fizeste” preserva a amplitude de עשה, que pode significar fazer, realizar ou criar, sem resolver a ambiguidade no corpo do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Natureza dos הַבְלֵי הַגּוֹיִם
  choice: ídolos das nações
  alternative: vaidades das nações; coisas inúteis das nações
  rationale: No contexto da polêmica contra pretensos causadores de chuva, a expressão se refere aos falsos deuses ou ídolos. A nota conserva o sentido literal depreciativo de “vapores/vaidades”.
- issue: Sentido de עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: fizeste todas estas coisas
  alternative: realizaste todas estas coisas; criaste todas estas coisas
  rationale: “Fizeste” mantém aberta a referência tanto à criação quanto à ação soberana de Deus nos fenômenos mencionados, evitando impor uma única leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas retóricas permanecem diretas; “Yahweh” preserva o nome divino, e as notas registram ambiguidades lexicais reais sem sobrecarregar o versículo.
