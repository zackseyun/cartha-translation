base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Não ore pelo bem deste povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: me disse
  rationale: A construção portuguesa “disse-me/me disse” incorpora de modo natural a preposição e o sufixo de primeira pessoa.
- source_word: אַל תִּתְפַּלֵּל
  choice: Não ore
  rationale: אַל com a forma verbal seguinte expressa proibição; “orar” conserva o sentido comum do hitpael de פלל.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: por ... este povo
  rationale: בְּעַד marca a pessoa em favor de quem se intercede; “por” é direto e idiomático, enquanto “este povo” preserva o coletivo singular hebraico.
- source_word: לְטוֹבָה
  choice: pelo bem
  rationale: Expressa a finalidade benéfica da oração e acompanha de perto o hebraico sem especificar além do necessário se se trata de bem-estar, benefício ou bênção.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com ordem frasal natural para ampla legibilidade brasileira. A formulação concisa preserva a proibição e a tensão do texto sem explicitar “interceder” onde o hebraico diz literalmente “orar”.
