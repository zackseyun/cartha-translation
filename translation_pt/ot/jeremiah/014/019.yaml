  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: pt
  text: Acaso rejeitaste por completo Judá? Ou[a] tua alma[b] abomina Sião? Por que nos feriste, sem que haja cura para nós? Esperávamos paz, mas não houve bem algum; esperávamos um tempo de cura, mas eis o terror!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode entender a segunda pergunta sem sentido disjuntivo: “Tua alma abomina Sião?”.'
    reason: A partícula hebraica אִם pode introduzir aqui uma segunda pergunta paralela ou ligá-la à primeira com o sentido de “ou”.
  - marker: b
    text: 'Hebraico: “tua alma”, expressão vívida que pode designar o íntimo ou a pessoa inteira.'
    reason: A formulação literal preservada no texto pode ser entendida idiomaticamente como referência ao próprio Deus.
lexical_decisions:
- source_word: הֲ/מָאֹס מָאַסְתָּ
  choice: Acaso rejeitaste por completo
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ideia de rejeição. “Por completo” comunica essa ênfase em português natural, enquanto “acaso” marca a pergunta sem pressupor sua resposta.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do reino e do povo.
- source_word: אִם
  choice: Ou
  rationale: Neste paralelismo interrogativo, אִם pode introduzir a segunda pergunta em sentido disjuntivo. “Ou” conserva essa ligação possível com a primeira pergunta.
- source_word: בְּ/צִיּוֹן
  choice: Sião
  rationale: Forma portuguesa consagrada do nome que designa Jerusalém como centro do povo da aliança.
- source_word: גָּעֲלָה
  choice: abomina
  rationale: O verbo expressa forte aversão ou repulsa. “Abomina” preserva a intensidade visceral e o registro digno do lamento.
- source_word: נַפְשֶׁךָ
  choice: tua alma
  rationale: Mantém a imagem hebraica concreta para o íntimo ou a pessoa inteira, sem reduzi-la silenciosamente a um pronome simples.
- source_word: הִכִּיתָנוּ
  choice: nos feriste
  rationale: נכה significa golpear ou ferir. “Feriste” conserva a imagem do golpe e se liga naturalmente à ausência de cura.
- source_word: מַרְפֵּא
  choice: cura
  rationale: A mesma palavra ocorre duas vezes; “cura” funciona em ambos os contextos e mantém a metáfora de recuperação após um golpe.
- source_word: קַוֵּה
  choice: Esperávamos
  rationale: A forma expressa expectativa ou espera. O pretérito imperfeito apresenta de modo idiomático a expectativa continuada frustrada pelos acontecimentos.
- source_word: לְ/שָׁלוֹם
  choice: paz
  rationale: “Paz” é a tradução concisa e tradicional de שָׁלוֹם, preservando também sua abertura contextual a segurança e bem-estar.
- source_word: טוֹב
  choice: bem algum
  rationale: טוֹב é amplo; “bem algum” mantém essa generalidade e, com a negação, produz português natural.
- source_word: בְעָתָה
  choice: terror
  rationale: O substantivo denota terror ou consternação. “Terror” preserva o contraste forte com o tempo de cura esperado.
theological_decisions:
- issue: Linguagem de rejeição divina dirigida a Judá e Sião
  choice: Manter as perguntas diretas sobre rejeição e aversão, sem atenuá-las.
  alternative: Explicá-las como mera disciplina temporária ou abandono apenas aparente.
  rationale: O versículo apresenta uma oração de lamento em termos fortes e deixa a tensão teológica sem resolução explícita. A tradução não deve inserir uma explicação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na segunda pessoa do singular para conservar o caráter direto da oração. A repetição de “esperávamos” explicita a elipse poética para facilitar a leitura, e “eis” mantém a súbita virada retórica do hebraico.
