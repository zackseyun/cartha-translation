  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: pt
  text: Tu os plantaste; eles até criaram raízes. Crescem e até dão fruto. Tu estás perto em seus lábios, mas longe do íntimo deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “dos rins deles”. Na linguagem hebraica, os rins podiam representar o íntimo da pessoa, incluindo seus afetos e suas motivações ocultas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: Tu os plantaste
  rationale: O qal perfeito na segunda pessoa masculina singular, com sufixo de terceira pessoa masculina plural, atribui diretamente a Deus a ação de plantar. O pretérito perfeito preserva a forma poética da queixa.
- source_word: גַּם שֹׁרָשׁוּ
  choice: eles até criaram raízes
  rationale: שׁרשׁ indica criar ou lançar raízes; “criaram raízes” é natural em português e mantém a metáfora agrícola. “Até” expressa a ênfase de גַּם.
- source_word: יֵלְכוּ
  choice: Crescem
  rationale: Embora הלך signifique literalmente “ir/andar”, neste encadeamento agrícola descreve avanço ou desenvolvimento. “Crescem” comunica o sentido contextual sem explicitar prosperidade material.
- source_word: גַּם עָשׂוּ פֶרִי
  choice: e até dão fruto
  rationale: A combinação עשה + פֶרִי significa idiomaticamente produzir ou dar fruto; “dão fruto” preserva a imagem e “até” representa novamente גַּם.
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: Tu estás perto da boca deles
  rationale: A formulação conserva a imagem hebraica da boca e o contraste entre profissão verbal e realidade interior, sem substituir a metáfora por “lábios” ou “palavras”.
- source_word: וְרָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: mas longe do íntimo deles
  rationale: כִּלְיוֹת significa literalmente “rins”, mas na antropologia hebraica pode designar a interioridade, incluindo afetos e motivações ocultas. “Íntimo” transmite esse sentido em português corrente; a imagem anatômica fica registrada em nota.
theological_decisions:
- issue: Metáfora antropológica de כִּלְיוֹתֵיהֶם
  choice: do íntimo deles
  alternative: dos rins deles; do seu interior; do coração deles
  rationale: O contraste é entre a proximidade de Deus na fala deles e sua distância da vida interior. “Íntimo” evita introduzir “coração”, que não aparece no hebraico, e preserva a amplitude da referência à interioridade; a tradução literal é informada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “tu” mantém a interpelação direta e solene a Deus. A sintaxe conserva o paralelismo poético e a metáfora agrícola, enquanto a nota documenta a imagem antropológica literal.
