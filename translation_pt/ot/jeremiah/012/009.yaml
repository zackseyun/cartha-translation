base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: pt
  text: Acaso a minha herança é para mim uma ave de rapina malhada? Há aves de rapina contra ela por todos os lados?[a] Vão, reúnam todos os animais selvagens do campo[b]; tragam-nos para devorar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Acaso a minha herança é para mim uma ave de rapina malhada? A ave de rapina ao redor, contra ela?”. O singular “ave de rapina” pode ter sentido coletivo. Alguns intérpretes entendem aqui um predador como a hiena, traduzindo a primeira pergunta de modo semelhante a: “Acaso a minha herança é para mim uma hiena malhada?”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas as feras do campo”.'
    reason: translation_clarity
lexical_decisions:
- source_word: הַעַיִט
  choice: ave de rapina
  rationale: עַיִט normalmente designa uma ave predadora ou necrófaga. A tradução mantém a imagem zoológica sem especificar uma espécie.
- source_word: צָבוּעַ
  choice: malhada
  rationale: O termo indica coloração variegada ou marcada. “Malhada” é natural em português e comunica que a ave se destaca visualmente.
- source_word: נַחֲלָתִי
  choice: minha herança
  rationale: Preserva o sentido básico de posse recebida por herança e suas possíveis ressonâncias de aliança, sem identificar explicitamente o referente.
- source_word: לִי
  choice: para mim
  rationale: Mantém o dativo hebraico e a força retórica da pergunta, com formulação compreensível em português.
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: aves de rapina contra ela por todos os lados
  rationale: O singular pode ter valor coletivo. O plural produz sentido natural em português, enquanto “contra ela” preserva a possível nuance hostil de עָלֶיהָ.
- source_word: לְכוּ אִסְפוּ
  choice: Vão, reúnam
  rationale: Reproduz os dois imperativos como uma convocação direta para reunir os predadores.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: todos os animais selvagens
  rationale: Expressa naturalmente a locução bíblica referente aos animais não domesticados, evitando o tom arcaizante de “feras do campo”.
- source_word: הֵתָיוּ לְאָכְלָה
  choice: tragam-nos para devorá-la
  rationale: Explicita de modo natural o propósito predatório do ato de trazer os animais. O objeto feminino é recuperado do contexto, isto é, “a minha herança”.
theological_decisions:
- issue: Referente de “minha herança”
  choice: Mantido implicitamente como “minha herança”
  alternative: Judá, Jerusalém, a terra ou o povo da aliança
  rationale: O contexto sugere o povo ou a terra de YHWH sob juízo, mas o hebraico não restringe explicitamente o referente neste versículo.
- issue: Relação entre a herança e os predadores
  choice: Mantida a tensão entre a comparação com uma ave marcada e o cerco de aves predadoras
  alternative: Resolver a primeira imagem como hiena ou reformular toda a cena como presa terrestre
  rationale: A construção hebraica é difícil e imageticamente tensa; a tradução não deve harmonizá-la de maneira especulativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Acaso” marca a pergunta retórica sem arcaísmo excessivo; “animais selvagens” soa mais corrente do que “feras do campo”. Todos os marcadores de nota aparecem no texto principal.
