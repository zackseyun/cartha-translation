  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: pt
  text: Mas tu, ó Yahweh, me conheces; tu me vês e provas o meu coração, voltado para ti[a]. Arranca-os como ovelhas para o abate e separa-os[b] para o dia da matança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e provas o meu coração, que está contigo”. A expressão hebraica é compacta e pode indicar a orientação interior ou a lealdade de Jeremias em relação a Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “consagra-os”. Literalmente, “põe-nos à parte”; aqui, para o juízo, e não para uma finalidade de bênção.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para o dia do abate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: יְדַעְתָּנִי
  choice: me conheces
  rationale: O perfeito hebraico expressa aqui conhecimento estabelecido e presente; o presente é natural em português e mantém o contraste contextual.
- source_word: תִּרְאֵנִי
  choice: tu me vês
  rationale: Preserva o paralelismo com conhecer e provar, incluindo a ideia de percepção pessoal.
- source_word: וּבָחַנְתָּ לִבִּי אִתָּךְ
  choice: e provas como é o meu coração para contigo
  rationale: Mantém a imagem do coração submetido a exame e comunica, em português natural, sua orientação relacional para Yahweh, sem eliminar a dificuldade sintática da expressão compacta.
- source_word: הַתִּקֵם
  choice: Arranca-os
  rationale: O hifil de נתק indica puxar ou retirar à força. “Arranca-os” preserva a intensidade da petição e se ajusta à imagem das ovelhas destinadas ao abate.
- source_word: כְּצֹאן לְטִבְחָה
  choice: como ovelhas para o abate
  rationale: Reproduz diretamente a comparação e conserva sua forte imagem de morte.
- source_word: וְהַקְדִּשֵׁם
  choice: separa-os
  rationale: קדש no hifil significa pôr à parte. Neste contexto, a separação é para juízo, não para uma finalidade positiva ou cultual.
- source_word: לְיוֹם הֲרֵגָה
  choice: para o dia da matança
  rationale: “Matança” traduz de modo direto a morte violenta indicada por הֲרֵגָה e evita suavizar a petição.
theological_decisions:
- issue: Petição imprecatória contra os perversos
  choice: Manter explicitamente o pedido de juízo divino com as imagens de abate e matança.
  alternative: Atenuar a linguagem para uma preparação genérica para o juízo ou tratá-la apenas como exposição figurada.
  rationale: O hebraico fala de modo explícito em abate e matança. A tradução preserva a severidade da fala de Jeremias sem acrescentar uma justificativa teológica alheia ao versículo.
- issue: Sentido de קדש aplicado aos destinados ao juízo
  choice: Traduzir como “separa-os”.
  alternative: “consagra-os”.
  rationale: A raiz pode ter sentido de consagrar, mas aqui a separação tem como finalidade o dia da matança. “Separa-os” preserva o núcleo sem sugerir bênção ou aprovação moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A repetição de “tu” mantém a ênfase contrastiva do hebraico; “ó Yahweh” conserva o tom de invocação. A violência da petição não foi suavizada.
