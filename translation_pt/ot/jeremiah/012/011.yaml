base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: pt
  text: Ele fez dela uma desolação[a]; ela pranteia diante de mim, desolada. Toda a terra[b] está devastada, porque ninguém se importa com ela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Ele fez dela uma desolação”. Embora o verbo esteja no singular, o contexto anterior pode levar alguns a entendê-lo em referência aos devastadores mencionados ali.'
    reason: alternative_reading
  - marker: b
    text: “Terra” também pode ser traduzido como “país”; aqui provavelmente se refere à terra devastada de Judá.
    reason: alternative_reading
  - marker: c
    text: 'Literalmente: “ninguém põe isso sobre o coração”, isto é, ninguém lhe dá a devida importância ou se importa com isso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ
  choice: Fizeram dela
  rationale: 'O verbo está formalmente na 3ª pessoa masculina do singular, com sufixo feminino singular: literalmente, “ele fez dela”. Contudo, o contexto anterior aponta para os devastadores como sujeito coletivo implícito; o plural torna essa ligação discursiva clara, enquanto a nota preserva a forma hebraica.'
- source_word: לִשְׁמָמָה
  choice: uma desolação
  rationale: Preserva a força nominal de שְׁמָמָה e o tom solene da linguagem profética.
- source_word: אָבְלָה
  choice: ela está de luto
  rationale: O verbo אבל expressa luto. O pronome feminino retoma naturalmente “terra”, além de refletir o gênero gramatical do referente hebraico.
- source_word: עָלַי
  choice: diante de mim
  rationale: No contexto da fala divina e do lamento da terra, comunica que ela permanece enlutada na presença e à vista de Deus, sem recorrer ao pouco natural “sobre mim”.
- source_word: שְׁמֵמָה
  choice: desolada
  rationale: Mantém a concisão e a função predicativa do termo hebraico, reforçando o estado da terra.
- source_word: נָשַׁמָּה
  choice: foi devastada
  rationale: Expressa de modo natural em português o estado resultante de devastação indicado pelo verbo.
- source_word: כָּל הָאָרֶץ
  choice: Toda a terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. “Terra” é natural no contexto e preserva alguma amplitude lexical, enquanto a nota esclarece o provável referente local.
- source_word: כִּי אֵין אִישׁ
  choice: porque ninguém
  rationale: Embora אִישׁ seja masculino singular na forma, aqui tem sentido genérico. “Ninguém” reproduz com clareza e naturalidade o alcance universal da expressão em português.
- source_word: שָׂם עַל לֵב
  choice: leva isso a sério
  rationale: O hebraico diz literalmente “põe sobre o coração”, idioma que significa considerar profundamente ou dar a devida importância. A formulação escolhida comunica esse sentido em português corrente; a nota conserva a imagem original.
theological_decisions:
- issue: Referente de אֶרֶץ
  choice: terra, provavelmente a terra de Judá
  alternative: a terra no sentido universal; o país
  rationale: O contexto imediato trata da devastação da herança de YHWH e favorece uma referência à terra de Judá, mas “terra” no texto mantém a amplitude lexical do hebraico.
- issue: Sujeito de שָׂמָהּ
  choice: os devastadores, expresso pelo plural “Fizeram”
  alternative: “Ele fez”, preservando estritamente o verbo hebraico singular
  rationale: O singular hebraico cria uma tensão real, mas o contexto anterior fornece um sujeito coletivo de devastadores. A tradução principal explicita essa conexão, e a nota registra a forma singular.
- issue: Sentido de עָלַי
  choice: diante de mim
  alternative: sobre mim; por minha causa
  rationale: A expressão pode admitir mais de uma relação semântica. “Diante de mim” se ajusta ao lamento da terra na presença divina sem afirmar que Deus seja o objeto ou a causa do luto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A personificação feminina da terra foi mantida em “ela está de luto”. A ordem das frases e a repetição de “desolação/desolada” preservam a cadência e a ênfase do hebraico.
