id: JER.12.13
reference: Jeremiah 12:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: pt
  text: Semearam trigo, mas colheram espinhos; esgotaram-se, mas não tiveram proveito. Envergonhem-se das suas colheitas[a] por causa da ira ardente de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e vocês se envergonharão das suas colheitas”, caso וּבֹשׁוּ seja entendido como predição, e não como imperativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: Semearam trigo
  rationale: O perfeito qal descreve a ação concluída; em português, o pretérito perfeito é natural. חִטִּים designa especificamente trigo.
- source_word: וְקֹצִים קָצָרוּ
  choice: mas colheram espinhos
  rationale: Embora וְ seja formalmente aditivo, o contraste pede 'mas'. קֹצִים significa 'espinhos', e קָצָרוּ mantém o campo agrícola de colher.
- source_word: נֶחְלוּ
  choice: esgotaram-se
  rationale: Entendido como forma nifal de חלה, com o sentido contextual de enfraquecer-se ou exaurir-se pelo esforço, não como 'herdaram'.
- source_word: לֹא יוֹעִלוּ
  choice: não tiveram proveito
  rationale: O hifil de יעל expressa obter benefício ou proveito; a formulação comunica o resultado nulo do trabalho.
- source_word: וּבֹשׁוּ
  choice: Envergonhem-se
  rationale: A forma é tomada como imperativo masculino plural, produzindo a mudança profética da descrição em terceira pessoa para a interpelação direta. A leitura preditiva permanece na nota.
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: das suas colheitas
  rationale: תְּבוּאָה pode indicar produto, rendimento ou colheita. 'Colheitas' preserva o plural e se integra naturalmente à imagem agrícola.
- source_word: מֵחֲרוֹן אַף
  choice: por causa da ira ardente
  rationale: A expressão idiomática denota ira intensa e conserva a imagem de ardor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio.
- issue: Valor de וּבֹשׁוּ
  choice: 'imperativo: ''Envergonhem-se'''
  alternative: 'predição: ''vocês se envergonharão'''
  rationale: A forma e o sufixo de segunda pessoa em 'suas colheitas' favorecem a interpelação direta, mas a possibilidade preditiva é genuína e foi registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo agrícola foi preservado, assim como a mudança retórica para a segunda pessoa e a ambiguidade verbal relevante.
