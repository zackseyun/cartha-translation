  terminology: «Yahweh», «espada», «devorando» e «devastadores» são escolhas adequadas. «Nenhum ser vivo» conserva melhor o alcance de «carne alguma» do que «ninguém». A nota sobre אֶרֶץ deve distinguir os sentidos territorial e global sem introduzir «país» como se fosse a única alternativa.
