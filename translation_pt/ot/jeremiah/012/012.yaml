source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: pt
  text: Sobre todas as colinas desnudas no deserto vieram devastadores[a], pois a espada de Yahweh está devorando desde uma extremidade da terra até a outra extremidade da terra[b]; não há paz para nenhum ser vivo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “elevações desnudas” ou “colinas sem árvores”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode significar “terra” no sentido de território ou região, ou “terra” no sentido do mundo inteiro.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “para toda carne”; expressão que pode se referir a todas as pessoas ou, mais amplamente, a todos os seres vivos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: colinas desnudas
  rationale: Expressa elevações expostas e sem vegetação, evitando a possível conotação cultual de “lugares altos”.
- source_word: בַּמִּדְבָּר
  choice: do deserto
  rationale: No cenário poético, designa a região erma onde se encontram as colinas; “deserto” é natural e amplamente compreensível em português.
- source_word: שֹׁדְדִים
  choice: devastadores
  rationale: Abrange a ação de invasores que saqueiam e destroem, sendo mais adequado ao contexto militar do que o sentido exclusivamente patrimonial de “saqueadores”.
- source_word: חֶרֶב לַיהוָה
  choice: a espada de Yahweh
  rationale: Mantém a imagem da espada pertencente a Yahweh ou por ele manejada e translitera diretamente o nome divino.
- source_word: אֹכְלָה
  choice: está devorando
  rationale: Preserva a ação em curso e a personificação vívida da espada.
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: desde uma extremidade da terra até a outra
  rationale: “Terra” pode designar o território contextual de Judá sem eliminar a ambiguidade lexical com “mundo”; a formulação conserva a extensão total indicada pelo hebraico.
- source_word: אֵין שָׁלוֹם
  choice: não há paz
  rationale: “Paz” preserva o sentido amplo de segurança e bem-estar, com especial pertinência no contexto de guerra.
- source_word: לְכָל בָּשָׂר
  choice: para ninguém
  rationale: 'Transmite em português natural a força da negação hebraica: não há paz para nenhum ser vivo, especialmente nenhuma pessoa no contexto.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; “Yahweh” preserva explicitamente o nome pactual sem substituí-lo por um título.
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: país; mundo
  rationale: O contexto favorece a terra de Judá, mas o substantivo hebraico também pode ter alcance mais amplo. “Terra” mantém essa ambiguidade, esclarecida em nota.
- issue: Alcance de לְכָל בָּשָׂר
  choice: ninguém
  alternative: nenhuma criatura; carne alguma
  rationale: No contexto da devastação humana, “ninguém” é idiomático e claro, enquanto a nota conserva o hebraísmo e sua possível abrangência sobre seres vivos.
translation_notes:
  register: Português moderno, digno e acessível, com construção poética direta. “Colinas desnudas” conserva a imagem topográfica sem sugerir locais de culto; “está devorando” mantém a personificação. As notas preservam as ambiguidades reais de אֶרֶץ e בָּשָׂר.
