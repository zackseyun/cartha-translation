revisions:
- from: Sobre todas as colinas desnudas do deserto vieram devastadores[a], pois a espada de Yahweh está devorando desde uma extremidade da terra até a outra[b]; não há paz para ninguém[c].
  to: Sobre todas as colinas desnudas no deserto vieram devastadores[a], pois a espada de Yahweh está devorando desde uma extremidade da terra até a outra extremidade da terra[b]; não há paz para nenhum ser vivo[c].
  rationale: A revisão é limitada a ajustes de fidelidade lexical e de alcance semântico. «No deserto» traduz a função locativa de בַּמִּדְבָּר; a fórmula territorial conserva a repetição hebraica; e «nenhum ser vivo», esclarecido pela nota literal «toda carne», evita reduzir o referente a seres humanos. As âncoras das notas permanecem corretamente associadas aos respectivos termos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:33Z'
