  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: pt
  text: 'Assim diz Yahweh a respeito de todos os meus vizinhos perversos que tocam[a] na herança que dei como herança ao meu povo Israel: Eis que estou prestes a arrancá-los da sua terra[b], e arrancarei a casa de Judá do meio deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que invadem a herança”. Literalmente, “que tocam”; o contexto sugere interferência hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “arrancá-los do seu solo”. O verbo hebraico evoca o ato de arrancar uma planta pela raiz e é uma imagem recorrente de juízo em Jeremias.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e verte diretamente o nome divino.
- source_word: שְׁכֵנַי הָרָעִים
  choice: meus vizinhos perversos
  rationale: O substantivo aponta para povos vizinhos, e o adjetivo tem aqui sentido moral e hostil; “perversos” é natural e mais forte que “maus”.
- source_word: הַנֹּגְעִים
  choice: que invadem
  rationale: Embora o verbo signifique literalmente “tocar”, neste contexto territorial comunica interferência hostil; “invadem” torna esse sentido claro, enquanto a nota preserva a imagem literal.
- source_word: בַּנַּחֲלָה אֲשֶׁר הִנְחַלְתִּי
  choice: a herança que dei ... como herança
  rationale: Mantém a ligação lexical entre נַחֲלָה e o Hifil de נחל, com redação compreensível em português.
- source_word: הִנְנִי נֹתְשָׁם
  choice: Eis que estou prestes a arrancá-los
  rationale: “Eis que” conserva a ênfase discursiva, e a construção com particípio indica ação divina iminente. “Arrancar” preserva a imagem agrícola recorrente em Jeremias.
- source_word: מֵעַל אַדְמָתָם
  choice: da sua terra
  rationale: Expressa de modo natural o afastamento do solo ou território pertencente aos povos vizinhos.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a designação coletiva e nacional do hebraico.
- source_word: אֶתּוֹשׁ מִתּוֹכָם
  choice: arrancarei ... do meio deles
  rationale: Repete deliberadamente a imagem de נתש e traduz מִתּוֹכָם como remoção dentre os povos vizinhos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente sem substituir por um título.
- issue: Aspecto de נֹתְשָׁם após הִנְנִי
  choice: estou prestes a arrancá-los
  alternative: eu os arrancarei
  rationale: A combinação הִנְנִי com particípio destaca uma ação iminente, ao passo que o segundo נתש, finito, é vertido naturalmente pelo futuro.
- issue: Sentido contextual de הַנֹּגְעִים
  choice: que invadem
  alternative: que tocam
  rationale: O contexto sugere agressão contra a herança territorial de Israel; a tradução explicita essa hostilidade, e a nota registra a formulação literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “herança” e “arrancar” foi mantida para refletir os vínculos lexicais e a imagem do hebraico.
