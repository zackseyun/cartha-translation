source:
  edition: WLC
  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: pt
  text: 'Até quando a terra lamentará, e a relva de todos os campos secará? Por causa da maldade dos que nela habitam, os animais e as aves pereceram, pois eles dizem: “Ele não verá o nosso fim.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o nosso futuro” ou “o nosso desfecho”. O referente do sujeito implícito em “verá” não é expresso no hebraico.'
    reason: Registra a amplitude de אַחֲרִיתֵנוּ e preserva a identidade não especificada do sujeito da forma verbal hebraica.
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: ficará de luto
  rationale: Preserva a personificação da terra e comunica naturalmente a ideia de lamentação prolongada.
- source_word: עֵשֶׂב כָּל־הַשָּׂדֶה
  choice: a vegetação de todos os campos
  rationale: ‘Vegetação’ abrange o hebraico ‘eseb, que pode indicar erva, capim ou plantas do campo; o plural idiomático em português expressa a abrangência de kol hassadeh.
- source_word: סָפְתָה
  choice: foram exterminados
  rationale: O verbo pode transmitir ser eliminado, consumido ou varrido; ‘foram exterminados’ preserva a gravidade da destruição dos animais e das aves.
- source_word: אַחֲרִיתֵנוּ
  choice: o nosso fim
  rationale: Tradução concisa que mantém a referência ambígua ao desfecho, destino ou futuro final dos falantes.
theological_decisions:
- issue: Identidade do sujeito de לֹא יִרְאֶה (‘não verá’)
  choice: “Ele não verá” sem identificar o referente
  alternative: “Deus não verá” ou “O profeta não verá”
  rationale: O texto hebraico usa apenas um sujeito verbal implícito. Não se deve decidir no corpo do texto se os ímpios falam de Deus ou de Jeremias.
- issue: Sentido de אַחֲרִיתֵנוּ
  choice: “o nosso fim”
  alternative: “o nosso futuro” ou “o que nos acontecerá”
  rationale: ‘Fim’ preserva a tensão entre desfecho, destino e futuro, sem tornar explícita uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A personificação da terra foi mantida, e as ambiguidades do pronome implícito e de ‘fim’ não foram resolvidas no texto principal.
