  naturalness: O texto é claro e de registro apropriado. «Relva» é uma tradução mais direta e idiomática de עֵשֶׂב neste contexto agrícola do que «vegetação», sem perder a abrangência pretendida.
  terminology: «Lamentará», «relva», «maldade», «pereceram» e «nosso fim» mantêm tom bíblico moderno e não introduzem interpretação doutrinária. A nota preserva adequadamente a amplitude de אַחֲרִיתֵנוּ e a referência indeterminada do sujeito verbal.
