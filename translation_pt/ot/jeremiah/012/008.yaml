  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
translation:
  language: pt
  text: Minha herança tornou-se para mim como um leão na floresta; ela levantou a voz contra mim[a]. Por isso, eu a odeio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela rugiu contra mim”. O hebraico diz literalmente “ela deu sua voz contra mim”, expressão de clamor hostil; a imagem do leão torna “rugiu” uma possibilidade contextual.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu a odiei” ou “passei a odiá-la”. A forma verbal hebraica pode ser entendida como passada ou como ação consumada com efeito presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  choice: Minha herança
  rationale: נַחֲלָה designa herança, patrimônio ou posse recebida por lote. “Herança” preserva a dimensão relacional e pactual do que pertence a YHWH e é natural em português.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: אַרְיֵה é o termo masculino comum para “leão”, e כְּ introduz a comparação. O gênero feminino dos pronomes seguintes decorre de נַחֲלָה, não exige “leoa”.
- source_word: בַיָּעַר
  choice: na floresta
  rationale: יַעַר significa floresta ou região arborizada; “floresta” é a correspondência mais direta e corrente.
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: ela levantou a voz contra mim
  rationale: A expressão diz literalmente que ela “deu sua voz contra mim” e comunica um brado hostil. “Levantou a voz contra mim” conserva o idioma e a hostilidade sem tornar explícito demais o rugido sugerido pela imagem do leão.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressão inferencial que apresenta a consequência da hostilidade precedente; “Por isso” é clara, digna e natural.
- source_word: שְׂנֵאתִיהָ
  choice: eu a odeio
  rationale: O qatal de שׂנא pode ter valor passado ou perfectivo relevante ao presente. “Eu a odeio” preserva diretamente a linguagem severa do texto sem atenuá-la para “rejeito”.
- source_word: -הּ / -הָ (sufixos pronominais femininos)
  choice: ela / a
  rationale: Os pronomes retomam נַחֲלָה, substantivo feminino, aqui personificado. O português permite preservar essa personificação de modo natural por meio de “ela” e “a”.
theological_decisions:
- issue: A atitude divina expressa por שְׂנֵאתִיהָ
  choice: eu a odeio
  alternative: eu a rejeitei / passei a odiá-la
  rationale: A fala de YHWH apresenta sua herança em linguagem contundente de juízo pactual. A tradução direta conserva o choque e a tensão teológica do hebraico, sem reduzi-los a uma rejeição meramente administrativa.
- issue: A identidade feminina da herança personificada
  choice: ela levantou a voz; eu a odeio
  alternative: levantou sua voz; eu a odeio, evitando o pronome explícito
  rationale: O feminino gramatical de נַחֲלָה sustenta uma personificação ativa no hebraico. Mantê-la em português dá coerência à herança que se volta hostilmente contra o falante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e o paralelismo do hebraico foram preservados sem literalismo áspero. A pontuação divide a comparação, a hostilidade e sua consequência. Os marcadores [a] e [b] aparecem no texto principal.
