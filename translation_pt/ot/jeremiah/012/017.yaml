source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: pt
  text: Mas, se não ouvirem[a], certamente arrancarei aquela nação pela raiz e a destruirei, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedecerem”. O verbo hebraico pode significar tanto “ouvir” como “obedecer”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a promessa do versículo anterior; “Mas, se” expressa naturalmente essa força contextual.
- source_word: לֹא יִשְׁמָעוּ
  choice: não ouvirem
  rationale: שׁמע pode significar tanto ouvir/escutar como obedecer. “Não ouvirem” preserva a imagem lexical hebraica, enquanto a nota registra explicitamente a nuance de obediência.
- source_word: וְנָתַשְׁתִּי ... נָתוֹשׁ
  choice: arrancarei pela raiz ... eu a arrancarei
  rationale: A repetição procura representar o verbo finito seguido do infinitivo absoluto da mesma raiz, mantendo a ênfase e a metáfora agrícola característica de Jeremias em português natural.
- source_word: הַגּוֹי הַהוּא
  choice: aquela nação
  rationale: גּוֹי designa aqui uma entidade nacional entre os povos vizinhos; “nação” é direto e adequado ao contexto.
- source_word: וְאַבֵּד
  choice: e a destruirei
  rationale: O sentido causativo de אבד é fazer perecer ou destruir. O pronome explicita em português que a nação continua sendo o objeto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e translitera o nome divino יְהוָה como “Yahweh”.
theological_decisions:
- issue: Sentido de שׁמע na resposta à instrução divina
  choice: ouvirem, com nota alternativa “obedecerem”
  alternative: obedecerem
  rationale: O contexto envolve obediência, mas o verbo conserva o campo semântico de ouvir. A tradução e a nota preservam ambas as dimensões sem resolver indevidamente a ambiguidade.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome pessoal divino, não apenas um título; a transliteração o torna visível ao leitor.
- issue: Força enfática de נָתוֹשׁ após וְנָתַשְׁתִּי
  choice: repetição de “arrancar”
  alternative: “arrancarei completamente pela raiz”
  rationale: A repetição mantém mais de perto a forma enfática e a insistência retórica do hebraico, sem reduzir o infinitivo absoluto a um simples advérbio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arrancar pela raiz” preserva a metáfora agrícola; o segundo “arrancarei” mantém a ênfase hebraica, embora produza deliberadamente uma repetição retórica.
