id: JER.12.10
reference: Jeremiah 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רֹעִ֤ים רַבִּים֙ שִֽׁחֲת֣וּ כַרְמִ֔/י בֹּסְס֖וּ אֶת חֶלְקָתִ֑/י נָֽתְנ֛וּ אֶת חֶלְקַ֥ת חֶמְדָּתִ֖/י לְ/מִדְבַּ֥ר שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: pt
  text: Muitos pastores arruinaram a minha vinha[a]; pisotearam a minha porção; fizeram da minha preciosa porção um deserto desolado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Muitos governantes” ou “Muitos líderes”. O hebraico diz “pastores”, metáfora profética comum para os que governam ou têm responsabilidade sobre outros.
    reason: lexical_alternative
  - marker: b
    text: Ou “transformaram a minha preciosa porção num deserto desolado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: Muitos pastores
  rationale: Preserva a metáfora hebraica de pastores, que no discurso profético pode designar governantes ou líderes, sem restringir sua referência no texto principal.
- source_word: שִׁחֲתוּ
  choice: arruinaram
  rationale: Expressa grave dano ou devastação sem exigir a ideia de aniquilação total e combina naturalmente com a imagem da vinha.
- source_word: כַרְמִי
  choice: a minha vinha
  rationale: Tradução direta que mantém a imagem profética da vinha e sua possível referência figurada à terra ou ao povo do SENHOR.
- source_word: בֹּסְסוּ
  choice: pisotearam
  rationale: Mantém a imagem física de calcar sob os pés e comunica devastação de modo claro em português atual.
- source_word: חֶלְקָתִי
  choice: a minha porção
  rationale: Preserva a amplitude do termo hebraico, que pode indicar porção, parcela ou terreno, sem explicitar a imagem como terra ou herança.
- source_word: נָתְנוּ
  choice: fizeram de ... um
  rationale: Reproduz de modo idiomático a construção resultativa hebraica, literalmente ligada a pôr ou dar, com o sentido contextual de fazer algo tornar-se outra coisa.
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: a minha preciosa porção
  rationale: Conserva a repetição de 'porção' e comunica o valor afetivo e desejável expresso por חֶמְדָּה. A anteposição de 'preciosa' soa digna e natural neste contexto poético.
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: um deserto desolado
  rationale: Mantém os dois elementos da expressão hebraica — deserto e desolação — em formulação portuguesa clara e concisa.
theological_decisions:
- issue: Se 'pastores' deve ser interpretado explicitamente como governantes ou líderes
  choice: Manter a metáfora 'pastores' no texto principal
  alternative: governantes; líderes
  rationale: O hebraico apresenta diretamente a metáfora. Mantê-la preserva a imagem profética e evita definir de forma excessivamente estreita quem está em vista.
- issue: Se as imagens de vinha e porção devem ser explicadas como Judá, Israel, a terra ou a herança
  choice: Manter 'vinha' e 'porção' como imagens literais e metafóricas
  alternative: minha terra; minha herança; meu povo
  rationale: As imagens admitem sentidos sobrepostos. A tradução não deve eliminar essa tensão literária e teológica por meio de uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A repetição de 'porção' e as imagens de pastores, vinha e deserto foram mantidas por sua importância poética e teológica.
