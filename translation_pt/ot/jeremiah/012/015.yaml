  text: וְ/הָיָ֗ה אַֽחֲרֵי֙ נָתְשִׁ֣/י אוֹתָ֔/ם אָשׁ֖וּב וְ/רִֽחַמְתִּ֑י/ם וַ/הֲשִׁבֹתִ֛י/ם אִ֥ישׁ לְ/נַחֲלָת֖/וֹ וְ/אִ֥ישׁ לְ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: pt
  text: E acontecerá que, depois de os ter arrancado pela raiz[a], voltarei e terei compaixão deles[b] e os farei voltar, cada um para a sua herança e cada um para a sua terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de os desarraigar”. O verbo hebraico evoca arrancar uma planta pela raiz, metáfora de juízo frequente em Jeremias.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltarei a ter compaixão deles” ou “voltarei e terei misericórdia deles”.'
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “cada homem... e cada homem”; a forma masculina singular é distributiva e se refere a cada indivíduo entre os povos restaurados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Introduz uma circunstância futura de modo natural e mantém a função discursiva da expressão hebraica.
- source_word: נָתְשִׁי
  choice: eu os arrancar pela raiz
  rationale: Preserva a metáfora concreta de נתש, recorrente em Jeremias para o juízo, e é clara em português atual.
- source_word: אָשׁוּב וְרִחַמְתִּים
  choice: voltarei a ter compaixão deles
  rationale: Entende אָשׁוּב como indicação de ação renovada e expressa de maneira idiomática que Deus tornará a agir com compaixão, sem eliminar a noção de retorno.
- source_word: וַהֲשִׁבֹתִים
  choice: e os farei voltar
  rationale: 'Reproduz o sentido causativo do hifil de שׁוב: Deus fará com que os povos deslocados retornem.'
- source_word: אִישׁ ... וְאִישׁ
  choice: cada um ... e cada um
  rationale: Conserva a força distributiva da construção hebraica sem restringir desnecessariamente a referência aos indivíduos do sexo masculino.
- source_word: לְנַחֲלָתוֹ
  choice: para a sua herança
  rationale: Mantém a ideia de posse herdada e sua ressonância territorial e pactual.
- source_word: לְאַרְצוֹ
  choice: para a sua terra
  rationale: Traduz diretamente o sentido territorial de אֶרֶץ neste contexto.
theological_decisions:
- issue: Natureza da restauração prometida depois do juízo
  choice: A promessa inclui o retorno concreto dos povos deslocados às respectivas heranças e terras.
  alternative: Uma restauração apenas espiritual, sem ênfase no retorno geográfico.
  rationale: Os termos hebraicos para “herança” e “terra”, juntamente com o causativo “farei voltar”, apontam para restauração territorial; a tradução não amplia a afirmação além disso.
- issue: Sentido de אָשׁוּב antes de וְרִחַמְתִּים
  choice: “voltarei a ter compaixão”
  alternative: “retornarei e terei compaixão”
  rationale: A formulação escolhida é idiomática em português e preserva a noção de que Deus tornará a agir compassivamente. A alternativa mais formal permanece possível, mas pode sugerir deslocamento espacial de Deus de maneira indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arrancar pela raiz” preserva a imagem profética; “farei voltar” conserva o valor causativo; “cada um” comunica naturalmente a distribuição individual.
