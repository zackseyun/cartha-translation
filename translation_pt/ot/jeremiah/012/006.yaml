  - severity: low
    issue: «Gritaram atrás de você a plenos pulmões» é pouco natural e pode sugerir mais concretamente uma perseguição física.
    rationale: A construção hebraica permite a imagem de chamar após alguém em voz alta, mas não exige que se explicite perseguição nem a metáfora corporal de «a plenos pulmões».
