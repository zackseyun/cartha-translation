  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: pt
  text: Pois até seus irmãos[b] e a casa de seu pai — até eles o traíram; até eles gritaram por você, em alta voz.[a] Não confie neles, mesmo que lhe digam coisas boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamaram por você em alta voz”. A expressão pode indicar um clamor público hostil ou uma perseguição acompanhada de gritos.'
    reason: lexical_alternative
  - marker: b
    text: “Seus irmãos” está no masculino plural em hebraico e, neste contexto, refere-se aos parentes homens próximos de Jeremias; “a casa de seu pai” abrange o grupo familiar mais amplo.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: Mantém o termo familiar masculino plural do hebraico, que neste contexto aponta diretamente para os parentes homens de Jeremias.
- source_word: וּבֵית אָבִיךָ
  choice: e a casa de seu pai
  rationale: Preserva a expressão social hebraica para a família ou unidade doméstica paterna, sem reduzi-la simplesmente a “família”.
- source_word: בָּגְדוּ בָךְ
  choice: o traíram
  rationale: Expressa de modo natural e vigoroso a deslealdade ou perfídia indicada por בגד; o perfeito hebraico é apresentado como ação consumada.
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: gritaram atrás de você a plenos pulmões
  rationale: קרא com אַחֲרֵי descreve um chamado ou grito dirigido atrás de alguém, e מָלֵא intensifica a voz. A formulação preserva a possibilidade de clamor hostil ou perseguição verbal.
- source_word: אַל תַּאֲמֵן בָּם
  choice: Não confie neles
  rationale: No hifil, אמן pode significar crer ou confiar; a advertência sobre palavras enganosamente favoráveis favorece o sentido relacional de confiança.
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: mesmo que lhe digam coisas boas
  rationale: Representa o valor concessivo contextual de כִּי e conserva a referência ampla de טוֹבוֹת a palavras favoráveis, agradáveis ou amistosas.
