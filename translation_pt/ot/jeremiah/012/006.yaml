  source_fidelity: 'O sentido central está bem preservado: os irmãos e a casa paterna agiram traiçoeiramente, levantaram clamor após o destinatário, e não devem receber confiança apesar de palavras favoráveis. A formulação «gritaram atrás de você» é possível, mas soa algo rígida em português; «gritaram por você, em alta voz» preserva melhor o chamado dirigido a alguém sem afirmar que o clamor era necessariamente hostil.'
  naturalness: O registro é moderno e adequado. «Em alta voz» é mais idiomático e menos interpretativo que «a plenos pulmões» neste contexto. A nota cultural deve estar ancorada em «irmãos», e não ao fim da última oração.
  terminology: «Irmãos», «casa de seu pai», «traíram» e «Não confie neles» são escolhas adequadas. «Casa de seu pai» conserva apropriadamente a expressão social hebraica.
  issues:
