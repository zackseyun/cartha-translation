base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: pt
  text: Abandonei a minha casa; desamparei a minha herança; entreguei aquela que a minha alma ama nas mãos dos seus inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a amada da minha alma” ou “aquela que a minha alma ama”, uma expressão profundamente afetiva. “Nas mãos” significa sob o poder ou controle dos inimigos. O sufixo hebraico em “seus inimigos” é feminino, mas o texto não especifica se o referente é a herança, Judá/Jerusalém personificados ou a pessoa amada.'
    reason: lexical_alternative_and_ambiguity
lexical_decisions:
- source_word: עָזַבְתִּי
  choice: Abandonei
  rationale: O qal perfeito na primeira pessoa do singular apresenta a ação como realizada. “Abandonei” preserva a gravidade do ato e soa natural em português.
- source_word: בֵּיתִי
  choice: a minha casa
  rationale: Mantém o sentido comum e a abertura metafórica de בַּיִת, sem restringi-lo ao templo ou à casa de Israel.
- source_word: נָטַשְׁתִּי
  choice: deixei
  rationale: Distingue o segundo verbo de עָזַבְתִּי e conserva o paralelismo sem repetição pesada. No contexto, “deixei” comunica renúncia ou desamparo.
- source_word: נַחֲלָתִי
  choice: a minha herança
  rationale: Expressa com transparência a posse recebida ou pertencente por vínculo e preserva as ressonâncias pactuais de terra e povo.
- source_word: נָתַתִּי
  choice: entreguei
  rationale: Embora נתן signifique normalmente “dar”, diante de “nas mãos dos inimigos”, “entreguei” comunica naturalmente a transferência ao poder deles sem acrescentar uma causa não expressa.
- source_word: יְדִדוּת נַפְשִׁי
  choice: aquela a quem amo
  rationale: A expressão feminina e afetiva designa alguém profundamente amado. A formulação é natural e digna em português, preservando a personificação sem o artificialismo de “a amada da minha alma”.
- source_word: בְּכַף
  choice: nas mãos de
  rationale: כַּף significa literalmente “palma”, mas aqui integra a expressão idiomática de sujeição ao poder ou controle de alguém. “Nas mãos de” é o equivalente corrente em português.
- source_word: אֹיְבֶיהָ
  choice: seus inimigos
  rationale: O possessivo português não marca gênero e permite que a referência continue ligada à figura feminina da pessoa amada, sem decidir explicitamente entre herança, Judá ou Jerusalém personificados.
theological_decisions:
- issue: Referente do sufixo feminino em אֹיְבֶיהָ
  choice: Manter a figura feminina em “aquela a quem amo” e usar “seus inimigos”, sem identificar o referente com maior precisão.
  alternative: Explicitar “os inimigos de Judá”, “os inimigos de Jerusalém” ou “os inimigos da minha herança”.
  rationale: O hebraico emprega um sufixo feminino, mas não determina de modo inequívoco se ele remete à herança, a Judá/Jerusalém personificados ou à figura amada. A tradução conserva essa ambiguidade poética e teológica.
- issue: Força afetiva de יְדִדוּת נַפְשִׁי
  choice: “aquela a quem amo”
  alternative: “a amada da minha alma” ou “o amor da minha alma”
  rationale: A escolha preserva a profunda afeição divina e a personificação feminina, mas evita uma construção pouco natural em português moderno. A nota registra uma alternativa mais formal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo dos três verbos foi preservado, assim como a personificação feminina e a ambiguidade do referente. O marcador da nota aparece após a oração à qual se aplicam suas observações.
