id: JER.12.1
reference: Jeremiah 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: pt
  text: 'Tu és justo, Yahweh, quando apresento minha causa diante de ti[a]. Contudo, quero falar contigo sobre questões de justiça[b]: Por que o caminho dos perversos prospera? Por que vivem tranquilos todos os que agem traiçoeiramente[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “embora eu contenda contigo”. O verbo hebraico pode significar contender ou pleitear uma causa.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “juízos”; o plural pode referir-se a questões ou causas relacionadas à justiça.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “os traiçoeiros de traição”, expressão intensiva para os que agem com grande traição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: justo
  rationale: Como adjetivo predicativo, afirma a retidão moral de Yahweh; “justo” é natural em português e mantém a dimensão moral e judicial do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: quando apresento minha causa diante de ti
  rationale: ריב pode significar contender, pleitear ou apresentar uma causa. A formulação conserva a imagem jurídica e o tom respeitoso, sem eliminar a possibilidade de confronto indicada em nota.
- source_word: אַךְ
  choice: contudo
  rationale: Marca a transição concessiva entre a afirmação da justiça divina e a pergunta ousada do profeta.
- source_word: מִשְׁפָּטִים
  choice: questões de justiça
  rationale: O plural pode designar assuntos, causas ou juízos ligados à justiça; a expressão preserva a amplitude moral e jurídica.
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: quero falar contigo
  rationale: Expressa de modo natural o desejo do profeta de dirigir sua queixa a Deus, preservando o caráter dialogal.
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: o caminho dos perversos
  rationale: “Caminho” mantém a metáfora hebraica para o modo de vida ou a conduta; “perversos” comunica a culpa moral de רְשָׁעִים.
- source_word: צָלֵחָה
  choice: prospera
  rationale: O verbo descreve sucesso ou prosperidade e se encaixa na pergunta tradicional sobre o êxito aparente dos perversos.
- source_word: שָׁלוּ
  choice: vivem tranquilos
  rationale: Comunica a ideia de quietude, facilidade ou segurança sem introduzir necessariamente o sentido teológico mais amplo de “paz”.
- source_word: בֹּגְדֵי בָגֶד
  choice: todos os que agem traiçoeiramente
  rationale: Preserva a força verbal da expressão; a construção intensiva com substantivo cognato é explicada em nota para evitar uma formulação artificial no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; “Yahweh” preserva sua função como nome próprio da aliança.
- issue: Tom da fala de Jeremias em כִּי אָרִיב אֵלֶיךָ
  choice: uma causa apresentada respeitosamente, mas com ousadia
  alternative: contenda direta com Deus
  rationale: A tradução mantém juntas a afirmação da justiça de Deus e a queixa judicial do profeta, sem transformar a fala em rebelião nem suavizar sua tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a metáfora jurídica, o paralelismo das duas perguntas e a tensão entre a justiça confessada de Deus e a prosperidade observada dos perversos.
