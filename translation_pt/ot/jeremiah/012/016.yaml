source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: pt
  text: 'E acontecerá que, se de fato aprenderem os caminhos do meu povo[a], a jurar pelo meu nome: “Tão certo como Yahweh vive”[b], assim como ensinaram o meu povo a jurar por Baal, então serão edificados no meio do meu povo[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente aprenderem” ou “aprenderem plenamente”. O hebraico combina um infinitivo absoluto com o verbo conjugado para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Fórmula hebraica de juramento. Também pode ser traduzida: “Vive Yahweh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “serão estabelecidos entre o meu povo”. O hebraico diz literalmente: “serão edificados no meio do meu povo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Expressa de modo natural a fórmula hebraica que introduz uma situação futura e seu resultado.
- source_word: לָמֹד יִלְמְדוּ
  choice: de fato aprenderem
  rationale: A combinação do infinitivo absoluto com o verbo finito dá ênfase à ação de aprender, sem necessariamente acrescentar a ideia específica de diligência.
- source_word: דַּרְכֵי עַמִּי
  choice: os caminhos do meu povo
  rationale: Preserva a metáfora hebraica ampla, que pode abranger conduta, práticas e culto.
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: a jurar pelo meu nome
  rationale: Mantém a construção de finalidade ou conteúdo e a linguagem religiosa de prestar juramento invocando o nome divino.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz em português corrente a força performativa da fórmula hebraica de juramento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca claramente o paralelo entre o ensino idólatra anterior e a possível aprendizagem da lealdade a Yahweh.
- source_word: לִמְּדוּ אֶת עַמִּי
  choice: ensinaram o meu povo
  rationale: Tradução direta do verbo causativo de aprender, referindo-se à influência anterior dessas nações.
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: a jurar por Baal
  rationale: Mantém o paralelismo com jurar pelo nome de Yahweh e o contraste entre as duas lealdades religiosas.
- source_word: וְנִבְנוּ
  choice: então serão edificados
  rationale: Conserva a metáfora passiva de construir, permitindo o sentido contextual de serem estabelecidos ou integrados sem explicitá-lo excessivamente.
- source_word: בְּתוֹךְ עַמִּי
  choice: no meio do meu povo
  rationale: Representa de perto a expressão hebraica e preserva a imagem de inclusão no interior da comunidade.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva a distinção entre o nome pessoal e um título, sem importar uma formulação denominacional.
- issue: Sentido de וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: serão edificados no meio do meu povo
  alternative: serão estabelecidos entre o meu povo; serão reconstruídos no meio do meu povo
  rationale: A tradução conserva a metáfora de edificação e a abertura teológica do hebraico quanto à natureza precisa do estabelecimento ou da incorporação dessas nações junto ao povo de Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura mantém a solenidade profética sem recorrer a formas arcaicas. A expressão “de fato” comunica a ênfase verbal hebraica; “serão edificados” preserva deliberadamente a metáfora e sua ambiguidade.
