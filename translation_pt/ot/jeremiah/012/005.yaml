  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: pt
  text: Se você correu com homens a pé, e eles o deixaram exausto, como poderá competir com cavalos? E, se numa terra de paz você se sente seguro, o que fará na mata densa do Jordão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no orgulho do Jordão”, “na majestade do Jordão” ou “na cheia do Jordão”. A expressão hebraica גְּאוֹן הַיַּרְדֵּן é discutida; pode referir-se à vegetação densa junto ao rio ou, mais literalmente, ao seu “orgulho” ou “majestade”.
    reason: alternative_reading
lexical_decisions:
- source_word: רַגְלִים
  choice: homens a pé
  rationale: O termo significa literalmente “pés” e, por extensão, pessoas que se deslocam a pé. A expressão mantém o contraste claro com os cavalos sem impor um contexto estritamente militar.
- source_word: רַצְתָּה
  choice: você correu
  rationale: Tradução direta do verbo “correr”, adequada à condição que introduz as duas perguntas retóricas.
- source_word: וַיַּלְאוּךָ
  choice: eles o deixaram exausto
  rationale: Expressa de modo natural o sentido causativo de cansar ou esgotar alguém e conserva a intensidade da comparação.
- source_word: תְּתַחֲרֶה
  choice: poderá competir
  rationale: O verbo indica entrar em disputa ou rivalidade; “competir” se ajusta à imagem da corrida sem restringi-la indevidamente.
- source_word: הַסּוּסִים
  choice: cavalos
  rationale: Correspondência lexical direta, preservando o contraste crescente entre homens a pé e cavalos.
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: numa terra de paz
  rationale: Conserva tanto o substantivo concreto “terra” quanto o termo “paz”, que aqui descreve condições tranquilas e seguras.
- source_word: בּוֹטֵחַ
  choice: você se sente seguro
  rationale: Neste contexto, בטח aponta para segurança ou confiança circunstancial. A formulação evita transformar a frase numa declaração explícita de fé em Deus.
- source_word: תַּעֲשֶׂה
  choice: o que fará
  rationale: Reproduz de maneira direta e idiomática a pergunta retórica formada com o verbo amplo “fazer”.
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: a mata cerrada do Jordão
  rationale: A expressão provavelmente designa a vegetação densa e perigosa junto ao Jordão. A nota preserva as possibilidades mais literais, pois o sentido exato é discutido.
theological_decisions:
- issue: Sentido de בּוֹטֵחַ no contexto
  choice: 'segurança circunstancial: “você se sente seguro”'
  alternative: “você confia”
  rationale: O contraste é entre circunstâncias tranquilas e um perigo maior, não uma afirmação doutrinária explícita sobre confiança em Deus.
- issue: Interpretação de גְּאוֹן הַיַּרְדֵּן
  choice: a mata cerrada e perigosa junto ao Jordão
  alternative: “o orgulho/a majestade do Jordão” ou “a cheia do Jordão”
  rationale: O provável referente contextual é a vegetação densa da região ribeirinha, mas a expressão hebraica permanece debatida; por isso, as alternativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Homens a pé” evita o tom arcaico de “infantes”; “o deixaram exausto” transmite com naturalidade o desgaste intenso; e a colocação do marcador após “Jordão” liga corretamente a nota à expressão hebraica discutida.
