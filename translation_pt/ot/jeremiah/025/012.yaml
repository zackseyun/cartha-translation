source:
  edition: WLC
  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: pt
  text: Quando se completarem setenta anos, castigarei o rei da Babilônia e aquela nação — oráculo de Yahweh[a] — por sua iniquidade; castigarei também a terra dos caldeus e farei dela uma desolação perpétua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declara Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desolações para sempre”; o singular em português traduz de modo idiomático o plural hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות
  choice: Quando se completarem
  rationale: A construção introduz a circunstância futura no momento em que o período chegar ao fim. A oração temporal é natural em português e preserva a força do hebraico.
- source_word: שִׁבְעִים שָׁנָה
  choice: setenta anos
  rationale: Correspondência direta do numeral com o substantivo.
- source_word: אֶפְקֹד עַל
  choice: castigarei
  rationale: פקד com עַל, em contexto de juízo e com a iniquidade como causa, significa punir ou pedir contas. “Castigarei” expressa claramente esse sentido.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução normal da construção nominal hebraica.
- source_word: הַגּוֹי הַהוּא
  choice: aquela nação
  rationale: גוי designa aqui a Babilônia como entidade política; “nação” conserva esse aspecto geopolítico.
- source_word: נְאֻם יְהוָה
  choice: oráculo de Yahweh
  rationale: Mantém o caráter formal da fórmula profética. A alternativa funcional “declara Yahweh” é registrada em nota.
- source_word: אֶת עֲוֺנָם
  choice: por sua iniquidade
  rationale: עון denota a iniquidade ou culpa que motiva o castigo. A preposição “por” explicita naturalmente essa relação em português.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: a terra dos caldeus
  rationale: Preserva a designação étnico-histórica do texto em vez de substituí-la por “babilônios”.
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: e farei dela
  rationale: שׂים com ל indica fazer com que algo passe a determinado estado. O pronome singular é retomado por “dela”, referindo-se naturalmente à terra.
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: uma desolação perpétua
  rationale: O plural hebraico pode funcionar de modo abstrato ou intensivo; o singular é idiomático em português. “Perpétua” comunica a duração indefinida e duradoura do juízo profético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Referente do pronome singular אֹתוֹ
  choice: A terra dos caldeus
  alternative: O conjunto formado pelo rei, pela nação e pela terra da Babilônia
  rationale: “Terra” é o antecedente singular explícito mais próximo, e a imagem de uma terra transformada em desolação é coerente. A leitura coletiva continua possível, mas não foi imposta ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “castigarei” esclarece que a terra também está sob o juízo sem alterar as relações sintáticas essenciais. Os travessões destacam a fórmula profética, e “caldeus” mantém a referência histórica.
