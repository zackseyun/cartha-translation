id: JER.25.8
reference: Jeremiah 25:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת יַ֕עַן אֲשֶׁ֥ר לֹֽא שְׁמַעְתֶּ֖ם אֶת דְּבָרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/008.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Because you have not listened to my words[b],'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos[a]: Visto que vocês não deram ouvidos às minhas palavras[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não obedeceram às minhas palavras”. O verbo hebraico pode indicar ouvir com uma resposta obediente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência que decorre da acusação precedente.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética solene em português atual; o presente é idiomático ao introduzir a declaração divina.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um termo claro e abrangente, tradicionalmente associado às forças sob o comando divino.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz com clareza a causa do juízo anunciado e evita a sequência estilisticamente pesada de duas orações iniciadas por 'porque'.
- source_word: לֹא שְׁמַעְתֶּם
  choice: não deram ouvidos
  rationale: Locução portuguesa natural que conserva tanto a ideia de escutar quanto a implicação contextual de atender ou obedecer.
- source_word: אֶת דְּבָרָי
  choice: às minhas palavras
  rationale: Reproduz de perto o conteúdo do hebraico e se ajusta à regência da locução 'dar ouvidos a'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Amplitude de שׁמע
  choice: não deram ouvidos
  alternative: não obedeceram
  rationale: A escolha mantém a imagem auditiva e, ao mesmo tempo, sugere a resposta obediente exigida, sem reduzir a ambiguidade lexical do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética foi mantida de modo conciso, e o plural 'vocês' torna explícita a segunda pessoa plural indicada pelo hebraico.
