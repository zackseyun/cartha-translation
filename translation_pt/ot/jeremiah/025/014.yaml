  text: כִּ֣י עָֽבְדוּ בָ֤/ם גַּם הֵ֨מָּה֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדוֹלִ֑ים וְ/שִׁלַּמְתִּ֥י לָ/הֶ֛ם כְּ/פָעֳלָ֖/ם וּ/כְ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: pt
  text: Pois muitas nações e grandes reis farão deles também seus servos[a], e eu lhes retribuirei conforme as suas obras e conforme o que fizeram com as próprias mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pois muitas nações e grandes reis também serviram com eles” ou “também se serviram deles”. A formulação hebraica é compacta; no contexto, provavelmente significa que a própria Babilônia seria obrigada a servir a muitas nações e grandes reis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da sentença anterior e preserva de modo natural o valor causal-explicativo.
- source_word: עָבְדוּ בָם
  choice: farão até mesmo deles seus servos
  rationale: 'Embora a forma hebraica seja Qal e a construção seja compacta, o contexto de Jeremias 25:12-14 indica a inversão do domínio: os babilônios serão submetidos por outras nações. A formulação torna esse sentido contextual claro sem recorrer ao termo mais forte ''escravizar''.'
- source_word: גַּם הֵמָּה
  choice: até mesmo deles
  rationale: 'Preserva a ênfase da expressão e destaca a inversão: aqueles que dominaram outros também serão submetidos.'
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Em contexto geopolítico, גּוֹיִם designa naturalmente nações.
- source_word: וּמְלָכִים גְּדוֹלִים
  choice: e grandes reis
  rationale: Tradução direta e idiomática que pode incluir a ideia contextual de reis poderosos.
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: e eu lhes retribuirei
  rationale: O Piel de שׁלם expressa retribuição ou pagamento correspondente; 'retribuirei' conserva o tom judicial e solene.
- source_word: כְּפָעֳלָם
  choice: conforme as suas obras
  rationale: Traduz פעל como o conjunto de seus atos, em linguagem portuguesa clara e digna.
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: e conforme o que fizeram com as próprias mãos
  rationale: Mantém a imagem concreta das mãos e expressa o idiomatismo hebraico com naturalidade, evitando uma repetição pesada de 'obra'.
theological_decisions:
- issue: Referente de 'deles/lhes' na inversão do juízo
  choice: Os pronomes se referem à Babilônia e aos caldeus, que serão submetidos por muitas nações e grandes reis.
  alternative: Ler a oração mais literalmente como 'muitas nações e grandes reis também se serviram deles/os serviram'.
  rationale: O contexto imediato anuncia o juízo contra o rei da Babilônia e sua terra. A leitura escolhida comunica essa inversão, mas a ambiguidade gramatical da construção hebraica é preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução principal explicita a inversão sugerida pelo contexto, enquanto a nota conserva a ambiguidade genuína da construção hebraica.
