  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: pt
  text: E Yahweh enviou a vocês todos os seus servos, os profetas, levantando-se cedo e enviando-os[a]; mas vocês não escutaram nem inclinaram os ouvidos para ouvir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantando-se cedo e enviando”. É uma expressão idiomática que comunica o envio repetido e diligente dos profetas.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁלַח
  choice: E ... enviou
  rationale: O perfeito qal com conjunção é apresentado como ação passada, coordenada com o discurso do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Representa a preposição direcional com sufixo de segunda pessoa masculina plural em português moderno e amplamente compreensível.
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: todos os seus servos, os profetas
  rationale: Mantém a aposição que identifica os servos como os profetas; “servos” expressa aqui agentes comissionados, sem enfatizar condição escrava.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: levantando-se cedo e enviando-os
  rationale: Preserva a imagem do idioma hebraico e sua força de ação reiterada e diligente; o pronome retoma os profetas.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mas vocês não escutaram
  rationale: “Escutaram” comunica audição atenta e responsiva; “mas” explicita naturalmente o contraste contextual.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם
  choice: nem inclinaram os ouvidos
  rationale: Conserva a metáfora hebraica de prestar atenção. O plural idiomático em português concorda naturalmente com o destinatário coletivo.
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: Mantém o complemento literal da imagem de inclinar os ouvidos, deixando implícita a dimensão de dar atenção e obedecer.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva essa referência sem substituí-la por um título, embora a vocalização histórica exata seja discutida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. Conserva-se a imagem hebraica de levantar-se cedo e inclinar os ouvidos, explicando-se em nota apenas o idioma menos transparente.
