base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: pt
  text: 'E se eles se recusarem a pegar da sua mão o cálice para beber, você lhes dirá: “Assim diz Yahweh dos Exércitos: Vocês certamente beberão[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês terão mesmo de beber”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: Registra uma possibilidade modal para a expressão enfática hebraica e explica a construção gramatical; a âncora foi posicionada junto à expressão a que se refere.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, se
  rationale: Expressa de modo natural a situação futura e condicional introduzida pelo idioma hebraico.
- source_word: יְמָאֲנוּ
  choice: eles se recusarem
  rationale: O piel de מאן indica recusa ativa ou falta deliberada de disposição.
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ
  choice: pegar da sua mão o cálice
  rationale: Mantém os sentidos concretos de 'pegar', 'mão' no singular e 'cálice', sem explicar no texto a metáfora da ira divina.
- source_word: לִשְׁתּוֹת
  choice: para beber
  rationale: Reproduz o propósito de pegar o cálice e é idiomático em português.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: você lhes dirá
  rationale: Reflete a instrução futura dada ao profeta sem tornar a construção desnecessariamente rígida.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética tradicional de mensageiro de modo claro e digno.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e conserva de forma transparente o título צבאות.
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: Vocês certamente beberão
  rationale: O advérbio 'certamente' comunica a ênfase do infinitivo absoluto seguido do verbo finito, preservando a certeza enfática da declaração.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Explicitação do significado do cálice
  choice: Manter apenas 'o cálice'
  alternative: o cálice da ira; o cálice da minha ira
  rationale: Embora o contexto identifique o cálice com o juízo divino, o versículo conserva a metáfora sem essa explicação, e a tradução faz o mesmo.
- issue: Força de שָׁתוֹ תִשְׁתּוּ
  choice: Vocês certamente beberão
  alternative: Vocês terão mesmo de beber
  rationale: A formulação principal preserva a certeza enfática sem decidir exclusivamente entre obrigação e resultado inevitável; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Usa 'você/vocês' por naturalidade contemporânea; mantém a fórmula profética e a imagem concreta do cálice.
