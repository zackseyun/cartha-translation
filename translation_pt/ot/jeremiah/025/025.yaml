source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: pt
  text: e todos os reis de Zimri[a], e todos os reis de Elão, e todos os reis da Média[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identidade de Zimri é incerta; o nome pode designar um povo ou uma região que não se consegue identificar com segurança.
    reason: cultural_note
  - marker: b
    text: 'Ou: “dos medos”. O hebraico pode designar tanto a Média quanto o povo medo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: e
  rationale: A conjunção וְ é traduzida por “e”, preservando a sequência coordenada; o marcador de objeto direto אֵת não tem equivalente expresso necessário em português.
- source_word: כָּל
  choice: todos
  rationale: Diante do plural construto, כָּל indica a totalidade dos reis de cada povo ou região.
- source_word: מַלְכֵי
  choice: os reis de
  rationale: É o plural construto de מֶלֶךְ; “os reis de” é a formulação idiomática em português neste contexto enumerativo.
- source_word: זִמְרִי
  choice: Zimri
  rationale: O nome é transliterado, pois a identificação do povo ou da região permanece incerta.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo עֵילָם.
- source_word: מָדָי
  choice: Média
  rationale: Aqui o nome é entendido geograficamente como a região da Média, em paralelo com os demais nomes territoriais; “os medos” continua sendo uma alternativa possível.
theological_decisions: []
translation_notes:
  register: 'Português atual, claro e digno, com formas próprias da tradição bíblica lusófona. A repetição de “e todos os reis” acompanha deliberadamente a estrutura cumulativa do hebraico. Os marcadores das notas foram associados aos termos correspondentes: [a] a Zimri e [b] à Média.'
