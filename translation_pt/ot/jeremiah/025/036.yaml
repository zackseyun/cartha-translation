id: JER.25.36
reference: Jeremiah 25:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: pt
  text: Ouve-se o grito dos pastores[a] e o lamento dos poderosos do rebanho[b], pois Yahweh está devastando a pastagem deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem dos pastores, do rebanho e da pastagem provavelmente se refere, de modo figurado, aos governantes, aos que estavam sob seus cuidados e ao território deles.
    reason: cultural_note
  - marker: b
    text: Ou “dos chefes do rebanho” ou “dos nobres do rebanho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל צַעֲקַת
  choice: Ouve-se o grito
  rationale: קוֹל introduz aquilo que se ouve, e צַעֲקָה denota um grito de aflição. A construção verbal é natural em português e preserva a ênfase auditiva do hebraico.
- source_word: הָרֹעִים
  choice: os pastores
  rationale: Mantém a imagem concreta do hebraico, que no contexto provavelmente representa governantes ou dirigentes, sem substituir a metáfora por sua interpretação.
- source_word: וִילְלַת
  choice: e o lamento
  rationale: יללה expressa choro intenso ou lamentação. “Lamento” comunica a dor com dignidade e naturalidade em português atual.
- source_word: אַדִּירֵי הַצֹּאן
  choice: os poderosos do rebanho
  rationale: אַדִּירֵי pode designar os poderosos, nobres ou chefes. “Poderosos” preserva mais diretamente o sentido lexical e mantém aberta a função exata dessas figuras dentro da metáfora.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa do grito e do lamento, em registro profético conciso.
- source_word: שֹׁדֵד
  choice: está devastando
  rationale: O particípio apresenta Yahweh em ação, arrasando ou devastando. A locução progressiva transmite essa força em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַרְעִיתָם
  choice: a pastagem deles
  rationale: מַרְעִית designa pastagem ou lugar de pastoreio. A tradução conserva a rede de imagens de pastores e rebanho e evita tornar explícito um possível referente político ou territorial.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Interpretação política da linguagem de pastores e rebanho
  choice: Preservar no texto as imagens de pastores, rebanho e pastagem
  alternative: Explicitar governantes, povo e território
  rationale: Embora a metáfora provavelmente se refira a dirigentes e àqueles sob seus cuidados, o hebraico não abandona a imagem pastoril. Mantê-la preserva a textura profética e a abertura interpretativa.
- issue: Sentido de אַדִּירֵי הַצֹּאן
  choice: os poderosos do rebanho
  alternative: os chefes do rebanho ou os nobres do rebanho
  rationale: O termo indica destaque, poder ou nobreza, mas não define de maneira inequívoca uma função formal. “Poderosos” conserva essa amplitude sem eliminar a provável referência a líderes.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura evita um fragmento nominal pouco natural por meio de “Ouve-se”, sem alterar o conteúdo auditivo do verso. As imagens pastorais e a intensidade da devastação foram preservadas.
