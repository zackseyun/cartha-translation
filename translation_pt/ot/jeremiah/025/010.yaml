  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: pt
  text: E farei desaparecer do meio deles o som da alegria e o som do júbilo[a], a voz do noivo e a voz da noiva[b], o som das pedras de moinho e a luz da lamparina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porei fim, no meio deles, ao som da alegria e ao som do júbilo”. O verbo hebraico é causativo: “fazer perecer/desaparecer”.'
    reason: lexical_alternative
  - marker: b
    text: “A voz do noivo e a voz da noiva” evoca as celebrações de casamento, uma imagem recorrente da vida normal da comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: farei desaparecer
  rationale: O hifil de אבד tem sentido causativo, “fazer perecer/desaparecer”. Como os objetos são sons e sinais da vida cotidiana, “farei desaparecer” preserva esse valor sem sugerir a destruição física de sons.
- source_word: מֵהֶם
  choice: do meio deles
  rationale: A preposição מן com o pronome indica remoção do interior da comunidade; “do meio deles” é natural em português e conserva essa ideia.
- source_word: קוֹל
  choice: som / voz
  rationale: קוֹל pode indicar tanto som quanto voz. “Som” é natural para manifestações de alegria e para as pedras de moinho; “voz” é mais apropriado para o noivo e a noiva.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: alegria e júbilo
  rationale: Os dois termos próximos são distinguidos em português, mantendo o paralelismo celebrativo sem recorrer a vocabulário arcaico.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: a voz do noivo e a voz da noiva
  rationale: Mantém a repetição de קוֹל e a imagem concreta das celebrações de casamento como sinal da vida comunitária normal.
- source_word: קוֹל רֵחַיִם
  choice: o som das pedras de moinho
  rationale: רֵחַיִם é uma forma dual referente ao par de pedras usado para moer; a tradução preserva a imagem da atividade doméstica cotidiana.
- source_word: אוֹר נֵר
  choice: a luz da lamparina
  rationale: נֵר designa aqui a pequena lâmpada doméstica a óleo; “lamparina” comunica melhor esse objeto ao leitor moderno do que o termo mais amplo “lâmpada”.
theological_decisions:
- issue: Imagem do juízo profético
  choice: Preservar a enumeração concreta dos sons e da luz que desaparecerão da comunidade.
  alternative: Resumir interpretativamente como “acabarei com toda a alegria e com a vida cotidiana”.
  rationale: O hebraico retrata o juízo por meio da cessação de sinais específicos da vida festiva, familiar e doméstica. A tradução mantém essas imagens sem ampliar nem explicar o seu sentido no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida conserva o ritmo solene da lista hebraica; “júbilo” distingue os dois termos de alegria, e “lamparina” torna concreta a iluminação doméstica antiga.
