  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: pt
  text: Então peguei o cálice da mão de Yahweh[a] e fiz todas as nações às quais Yahweh me havia enviado beber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “da mão de Yahweh”, expressão que indica que o cálice foi recebido diretamente dele.
    reason: cultural_note
  - marker: b
    text: 'Ou “e dei de beber a todas as nações”; o verbo hebraico está na forma causativa: “fiz beber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Então peguei
  rationale: O wayyiqtol de לקח dá sequência à narrativa. “Então peguei” expressa essa progressão de modo natural em português.
- source_word: הַכּוֹס
  choice: o cálice
  rationale: Reproduz o substantivo definido כּוֹס e mantém a imagem concreta, sem acrescentar neste versículo a expressão “da ira”.
- source_word: מִיַּד יְהוָה
  choice: da mão de Yahweh
  rationale: Conserva a imagem hebraica da mão como origem direta do cálice, em vez de reduzi-la simplesmente a “de Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: וָאַשְׁקֶה
  choice: e fiz beber
  rationale: A forma hifil de שׁקה é causativa. “Fiz beber” preserva essa força sem tornar a frase excessivamente técnica.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: No contexto dos oráculos, גּוֹיִם designa as nações, e não apenas grupos genéricos de pessoas.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: às quais Yahweh me havia enviado
  rationale: A oração relativa modifica “todas as nações”. O mais-que-perfeito composto deixa clara a anterioridade do envio em relação ao ato de fazê-las beber.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Caráter figurado da ação de fazer as nações beberem
  choice: Manter a imagem concreta sem explicá-la no corpo do versículo
  alternative: Explicitar que se trata de receber o juízo ou a ira divina
  rationale: O versículo descreve a ação profética por meio da imagem do cálice. Explicitar seu sentido teológico aqui eliminaria a força da metáfora e acrescentaria palavras não presentes no verso.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A ordem da oração relativa evita ambiguidade quanto às nações às quais o profeta foi enviado; a construção “fiz beber” mantém deliberadamente o valor causativo e o tom solene do original.
