lexical_decisions:
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nome próprio tradicional da nação ou território; preserva a forma nominal do hebraico, sem convertê-la no gentílico “edomitas”.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma portuguesa tradicional do nome próprio מוֹאָב; mantém a referência à nação ou território, em vez de substituí-la pelo gentílico “moabitas”.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Reproduz a expressão de parentesco hebraica, literalmente “filhos de Amom”, que permanece clara em português; “os amonitas” é a alternativa idiomática registrada em nota.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '[marcadores de objeto direto omitidos; conjunções representadas na enumeração]'
  rationale: אֶת não tem equivalente lexical natural em português. A repetição de וְ é vertida por uma enumeração portuguesa fluente, com “e” antes do último elemento.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com as formas tradicionais dos nomes próprios. A estrutura concisa de enumeração e o ponto e vírgula foram preservados por se tratar de um item dentro da lista do contexto maior. O marcador da nota foi colocado após “filhos de Amom”, expressão à qual a alternativa lexical efetivamente se refere.
