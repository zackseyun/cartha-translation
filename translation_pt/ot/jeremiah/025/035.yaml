  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: pt
  text: Não haverá fuga para os pastores[b], nem escape para os poderosos do rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem escape dos nobres do rebanho”.'
    reason: Alternativa lexical para אַדִּירֵי (“poderosos”, “nobres”) e formulação mais formal que reflete a relação expressa por מן.
  - marker: b
    text: “Pastores” e “rebanho” são metáforas proféticas para os líderes do povo e para o povo sob sua direção.
    reason: Nota cultural que esclarece a imagem sem substituí-la no texto.
lexical_decisions:
- source_word: וְאָבַד
  choice: Desapareceu
  rationale: O qal perfeito de אבד anuncia de modo vívido que a possibilidade de fuga deixou de existir; “desapareceu” preserva tanto a ideia de perda quanto a força profética.
- source_word: מָנוֹס
  choice: toda possibilidade de fuga
  rationale: O substantivo pode indicar fuga, refúgio ou meio de escapar. Neste contexto de juízo, a formulação natural em português expressa que já não há saída, sem reduzir o termo a um lugar físico de refúgio.
- source_word: מִן הָרֹעִים
  choice: para os pastores
  rationale: Embora מן indique separação ou retirada, a expressão idiomática portuguesa “desapareceu ... para” comunica naturalmente que a fuga foi tirada dos pastores, preservando a metáfora do hebraico.
- source_word: וּפְלֵיטָה
  choice: toda possibilidade de escape
  rationale: פְּלֵיטָה pode significar escape, livramento ou sobrevivência. No paralelismo com מָנוֹס, refere-se à possibilidade de sair vivo; “escape” mantém a pequena variação lexical do verso.
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: para os poderosos do rebanho
  rationale: אַדִּירֵי designa pessoas poderosas, majestosas ou nobres. “Poderosos do rebanho” é próximo do hebraico, preserva a imagem pastoral e evita o tom feudal que “senhores do rebanho” poderia sugerir.
theological_decisions:
- issue: Metáfora pastoral para os dirigentes e o povo
  choice: Preservar “pastores” e “poderosos do rebanho” no texto principal.
  alternative: Explicitar “líderes” ou “governantes” no texto principal.
  rationale: O hebraico sustenta a imagem de pastores e rebanho no contexto. Mantê-la evita substituir a figura profética por uma interpretação, enquanto a nota esclarece seu provável referente.
- issue: Relação semântica de מן com a perda da fuga
  choice: Verter idiomaticamente como a inexistência de fuga “para” os líderes.
  alternative: Traduzir formalmente “a fuga desapareceu dos pastores”.
  rationale: A alternativa mais formal reproduz a separação marcada por מן, mas soa pouco natural em português. A escolha mantém o sentido de que os líderes foram privados de qualquer saída.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “toda possibilidade de” explicita a elipse poética do segundo membro e comunica com clareza a ausência completa de saída. Os marcadores aparecem no texto principal.
