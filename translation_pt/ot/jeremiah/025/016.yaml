base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: pt
  text: Beberão, cambalearão e agirão como loucos[a] por causa da espada que estou enviando entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficarão desvairados». O verbo hebraico pode indicar comportamento irracional ou um estado de desvario.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: Beberão
  rationale: O perfeito qal com waw, na sequência profética e após a ordem anterior para que as nações bebam, tem valor futuro. A forma mantém a imagem concreta do cálice.
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: cambalearão
  rationale: O verbo comunica agitação violenta ou movimento instável. No contexto da bebida do juízo, «cambalear» exprime naturalmente o efeito descrito.
- source_word: וְהִתְהֹלָלוּ
  choice: agirão como loucos
  rationale: A forma verbal indica comportamento desvairado ou irracional. A escolha preserva a nuance comportamental sem afirmar além do texto uma condição clínica ou permanente.
- source_word: מִפְּנֵי הַחֶרֶב
  choice: por causa da espada
  rationale: 'מִפְּנֵי tem aqui sentido causal: a espada enviada provoca o cambalear e o comportamento desvairado.'
- source_word: הַחֶרֶב
  choice: a espada
  rationale: Mantém o sentido lexical direto e a imagem profética concreta de guerra e juízo.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: que estou enviando
  rationale: O particípio com pronome explícito apresenta a ação divina como iminente ou em curso; a locução portuguesa reproduz essa força com naturalidade.
- source_word: בֵּינֹתָם
  choice: entre eles
  rationale: A preposição indica a presença ou introdução da espada no meio das nações. «Entre eles» é natural e conserva a formulação relacional do hebraico.
theological_decisions:
- issue: Natureza das imagens de juízo
  choice: Conservar as imagens concretas de beber, cambalear e agir como loucos como efeitos do juízo divino mediante a espada.
  alternative: Parafrasear de modo abstrato como terror geral ou colapso político.
  rationale: O contexto é o oráculo do cálice da ira, e o versículo relaciona explicitamente a condição das nações à espada enviada por Deus. A tradução mantém a tensão e a vivacidade proféticas sem as reduzir a abstrações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Cambalearão» preserva a imagem corporal, e «agirão como loucos» comunica a nuance comportamental do hebraico sem recorrer a terminologia clínica.
