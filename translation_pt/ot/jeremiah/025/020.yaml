  text: וְ/אֵת֙ כָּל הָ/עֶ֔רֶב וְ/אֵ֕ת כָּל מַלְכֵ֖י אֶ֣רֶץ הָ/ע֑וּץ וְ/אֵ֗ת כָּל מַלְכֵי֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/אֶת אַשְׁקְל֤וֹן וְ/אֶת עַזָּה֙ וְ/אֶת עֶקְר֔וֹן וְ/אֵ֖ת שְׁאֵרִ֥ית אַשְׁדּֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/020.yaml
  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
translation:
  language: pt
  text: e toda a população mista[a], todos os reis da terra de Uz e todos os reis da terra dos filisteus[b] — Ascalom, Gaza, Ecrom e o remanescente de Asdode[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a população mista”. O termo talvez designe uma população estrangeira de origens diversas, e não um grupo étnico específico.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a terra dos filisteus”; tradicionalmente, “Filístia”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “o que restou de Asdode” ou “os sobreviventes de Asdode”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  choice: os povos de origem mista
  rationale: O termo provavelmente designa uma população mista, e não uma única etnia. O plural coletivo em português comunica naturalmente a ideia sem identificá-la de modo indevido com os árabes.
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: os reis da terra de Uz
  rationale: Preserva a expressão geopolítica hebraica e translitera Uz como nome próprio tradicional.
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: os reis da terra dos filisteus
  rationale: Reproduz de modo transparente a construção hebraica, mantendo a associação étnica e geográfica.
- source_word: אַשְׁקְלוֹן
  choice: Ascalom
  rationale: Forma tradicional e amplamente reconhecível em português para o nome da cidade filisteia.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma portuguesa corrente do topônimo.
- source_word: עֶקְרוֹן
  choice: Ecrom
  rationale: Forma tradicional portuguesa do nome da cidade.
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: o remanescente de Asdode
  rationale: Mantém a noção profética de resto sem determinar se se trata especificamente dos sobreviventes ou do que restou da cidade-Estado.
