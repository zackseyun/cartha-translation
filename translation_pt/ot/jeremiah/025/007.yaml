  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: pt
  text: Contudo, vocês não me deram ouvidos — declara Yahweh —, para me provocar à ira com a obra das suas mãos,[a] para o próprio mal de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com aquilo que as suas mãos fizeram”. Em Jeremias, essa expressão muitas vezes se refere a ídolos ou a práticas idolátricas.'
    reason: Alternativa lexical e esclarecimento do idiomatismo hebraico, sem tornar explícita no texto principal uma referência apenas implícita.
lexical_decisions:
- source_word: וְלֹא שְׁמַעְתֶּם אֵלַי
  choice: Contudo, vocês não me deram ouvidos
  rationale: A construção continua a acusação com valor adversativo. “Dar ouvidos” expressa naturalmente em português o sentido de ouvir com atenção e acolhimento, sem reduzir o verbo apenas à audição nem explicitar plenamente “obedecer”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e translitera o nome divino expresso pelo Tetragrama.
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: provocando-me à ira
  rationale: O particípio em português liga a recusa do povo à provocação de Yahweh sem decidir rigidamente entre propósito e resultado, ambiguidade possível em לְמַעַן neste contexto.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: com as obras das suas mãos
  rationale: Preserva o idiomatismo hebraico e seu alcance coletivo. Em Jeremias, a expressão frequentemente alude a ídolos ou práticas idolátricas, mas isso não é explicitado no corpo do versículo.
- source_word: לְרַע לָכֶם
  choice: para o próprio mal de vocês
  rationale: Conserva a repetição semântica de לְ e o sentido de consequência prejudicial que recai sobre os próprios destinatários.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Explicitação de idolatria em בְּמַעֲשֵׂה יְדֵיכֶם
  choice: manter “as obras das suas mãos” no texto e explicar a possível referência em nota
  alternative: os ídolos que vocês fizeram
  rationale: Embora a expressão possa referir-se a ídolos no uso de Jeremias, o versículo não os nomeia de modo explícito; a tradução mantém a amplitude e a tensão do original.
- issue: Finalidade ou resultado em לְמַעַן
  choice: usar “provocando-me”, sem marcar intenção deliberada de forma inequívoca
  alternative: a fim de me provocar; de modo que me provocaram
  rationale: לְמַעַן pode indicar propósito ou resultado. A formulação escolhida preserva a ligação causal sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. Os travessões destacam com naturalidade a fórmula profética. A redação preserva o idiomatismo hebraico e evita explicitar idolatria ou intenção deliberada além do que o verso afirma.
