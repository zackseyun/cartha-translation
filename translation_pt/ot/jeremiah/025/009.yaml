revisions:
- from: Vejam! Mandarei buscar todos os clãs do norte — declara Yahweh — e também Nabucodonosor, rei da Babilônia, meu servo[a]. Eu os trarei contra esta terra, contra os seus habitantes e contra todas estas nações ao redor. Eu os consagrarei à destruição[b] e farei deles motivo de horror, de assobios de desprezo[c] e ruínas perpétuas.
  to: Eis que mandarei buscar e reunirei todos os clãs do norte — declara Yahweh — e também Nabucodonosor, rei da Babilônia, meu servo[a]. Eu os trarei contra esta terra, contra os seus habitantes e contra todas estas nações ao redor. Eu os consagrarei à destruição[b] e farei deles um horror, objeto de assobio[c] e ruínas perpétuas.
