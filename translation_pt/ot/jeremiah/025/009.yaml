  source_fidelity: A tradução preserva adequadamente os agentes, os alvos do juízo e o sentido técnico de חרם. Contudo, “Vejam!” introduz um destinatário plural que não está expresso em הִנְנִי; e “Mandarei buscar” não torna explícito o segundo verbo, “tomarei/reunirei”.
  naturalness: O registro é moderno e claro. A enumeração final fica mais idiomática e mais próxima do hebraico se distinguir “horror”, “objeto de assobio” e “ruínas”, sem a construção um tanto pesada “motivo de horror, de assobios de desprezo e ruínas”.
  terminology: “Yahweh”, “meu servo”, “clãs”, “consagrarei à destruição” e “ruínas perpétuas” são escolhas adequadas. A nota sobre “meu servo” é equilibrada e não impõe uma leitura de piedade pessoal.
