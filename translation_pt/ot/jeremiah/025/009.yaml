language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: pt
  text: Eis que mandarei buscar e reunirei todos os clãs do norte — declara Yahweh — e também Nabucodonosor, rei da Babilônia, meu servo[a]. Eu os trarei contra esta terra, contra os seus habitantes e contra todas estas nações ao redor. Eu os consagrarei à destruição[b] e farei deles um horror, objeto de assobio[c] e ruínas perpétuas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu servo” identifica aqui Nabucodonosor como instrumento do propósito de Yahweh; não significa necessariamente que ele fosse um adorador fiel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eu os destruirei completamente”. O verbo hebraico pode indicar pôr pessoas ou coisas sob interdição, destinando-as à destruição.'
    reason: lexical_alternative
  - marker: c
    text: O assobio era uma reação de espanto, escárnio ou desprezo diante da devastação.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  choice: Vejam!
  rationale: Introduz com solenidade e vivacidade o anúncio divino. O plural impessoal dirige a atenção dos ouvintes sem recorrer ao arcaico “Eis”.
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: Mandarei buscar
  rationale: Expressa a ação iminente e certa de convocar e reunir os povos do norte. A formulação portuguesa evita uma coordenação rígida e pouco natural, sem perder a força profética.
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: todos os clãs do norte
  rationale: מִשְׁפָּחוֹת designa aqui grupos de parentesco ou povos, não apenas famílias nucleares; “clãs” preserva esse alcance sociopolítico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e verte o tetragrama como o nome pessoal Yahweh.
- source_word: וְאֶל נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל עַבְדִּי
  choice: e também Nabucodonosor, rei da Babilônia, meu servo
  rationale: A construção hebraica é sintaticamente incomum. “E também” apresenta Nabucodonosor como incluído entre os agentes convocados, sem reproduzir de modo ininteligível a preposição hebraica.
- source_word: וַהֲבִאֹתִים
  choice: Eu os trarei
  rationale: O futuro comunica a sequência da ação divina no anúncio profético e deixa o plural abranger as forças anteriormente convocadas.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: contra esta terra
  rationale: No contexto de invasão hostil, עַל tem sentido adversativo, não meramente espacial.
- source_word: וְהַחֲרַמְתִּים
  choice: Eu os consagrarei à destruição
  rationale: 'Preserva o sentido técnico de חרם: colocar sob interdição, destinando à destruição, em vez de reduzir a expressão a uma simples intensificação de “destruir”.'
- source_word: לְשַׁמָּה
  choice: motivo de horror
  rationale: Comunica tanto o estado devastado quanto a reação de espanto e horror provocada nos observadores.
- source_word: לִשְׁרֵקָה
  choice: assobios de desprezo
  rationale: Explicita de modo breve o valor cultural do assobio como reação de escárnio, espanto ou desprezo diante da devastação.
- source_word: לְחָרְבוֹת עוֹלָם
  choice: ruínas perpétuas
  rationale: Reproduz a imagem forte e duradoura do hebraico sem enfraquecê-la para uma expressão apenas genérica de desolação.
theological_decisions:
- issue: O título “meu servo” aplicado a Nabucodonosor
  choice: Manter literalmente “meu servo”, entendendo-o no contexto como agente do propósito judicial de Yahweh.
  alternative: Interpretar o título como declaração de devoção pessoal ou fidelidade à aliança.
  rationale: O contexto enfatiza a soberania de Yahweh ao usar o rei babilônico para executar juízo; não afirma necessariamente que Nabucodonosor seja um adorador fiel.
- issue: O sentido técnico de חרם
  choice: “consagrarei à destruição”
  alternative: “destruirei completamente”
  rationale: A escolha conserva a dimensão de destinação irrevogável à destruição e evita apagar a carga religiosa do termo hebraico.
- issue: Duração expressa por עוֹלָם
  choice: “perpétuas”
  alternative: “duradouras” ou “para sempre”
  rationale: Mantém a força retórica do juízo anunciado sem acrescentar uma explicação teológica sobre a extensão metafísica do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação destaca a fórmula profética sem fragmentar excessivamente o período. “Vejam!” preserva a função de chamar a atenção; “clãs” mantém o sentido coletivo antigo; “assobios de desprezo” torna inteligível uma imagem cultural que, isolada, seria opaca para muitos leitores atuais.
