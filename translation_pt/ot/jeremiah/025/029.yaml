  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: pt
  text: Pois eis que, na cidade sobre a qual o meu nome é invocado[a], estou começando a trazer calamidade. E vocês ficarão impunes? Não ficarão impunes, pois estou convocando a espada contra todos os habitantes da terra[b] — declara Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na cidade que é chamada pelo meu nome». Literalmente, o idioma hebraico diz: «na cidade sobre a qual o meu nome é invocado».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todos os habitantes do país» ou «da região». O termo hebraico pode significar tanto «terra» em sentido amplo como uma terra ou território específico.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: na cidade sobre a qual o meu nome é invocado
  rationale: Preserva a imagem hebraica de o nome divino ser invocado sobre a cidade, indicando pertencimento e vínculo, sem reduzir a expressão ao idioma mais fluido, porém menos formal, «chamada pelo meu nome».
- source_word: מֵחֵל לְהָרַע
  choice: eu começo a trazer calamidade
  rationale: A construção indica início da ação. No hifil, neste contexto judicial, רעה designa calamidade ou dano, não mal moral praticado por Deus; «trazer calamidade» comunica isso naturalmente.
- source_word: הִנָּקֵה תִנָּקוּ ... לֹא תִנָּקוּ
  choice: E vocês ficariam impunes? Não ficarão impunes
  rationale: O infinitivo absoluto intensifica a pergunta retórica. A repetição de «impunes» conserva a ligação verbal e o contraste enfático entre pergunta e resposta.
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: estou convocando a espada
  rationale: Mantém a personificação concreta da espada como agente de juízo chamado por Deus; evita generalizá-la como «guerra».
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: אֶרֶץ admite «terra» em sentido amplo ou «país/território». O contexto do oráculo dirigido às nações favorece o alcance amplo, mantendo-se a alternativa em nota.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: «Declara» expressa naturalmente a fórmula profética נְאֻם; «Yahweh» translitera o nome divino, e «dos Exércitos» comunica o título צְבָאוֹת em português atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Se לְהָרַע atribui mal moral a Deus
  choice: trazer calamidade
  alternative: fazer o mal; trazer dano
  rationale: No contexto de juízo, o verbo se refere à calamidade aplicada como punição. A tradução evita a inferência, estranha ao sentido contextual, de que Deus pratique mal moral.
- issue: Alcance de הָאָרֶץ
  choice: terra, em sentido amplo
  alternative: país ou território
  rationale: O contexto imediato amplia o juízo de Jerusalém às nações; ainda assim, a polissemia hebraica é genuína e fica registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sintaxe retém a força retórica e a imagem hebraica, enquanto «calamidade», «ficariam impunes» e «convocando a espada» evitam construções artificiais. Os marcadores [a] e [b] aparecem no texto principal.
