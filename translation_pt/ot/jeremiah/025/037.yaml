source:
  edition: WLC
  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: pt
  text: E as pastagens tranquilas são devastadas por causa da ira ardente de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pastagens de paz”; a expressão hebraica diz mais literalmente “pastagens de paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: são devastadas
  rationale: O nifal de דמם pode indicar silêncio ou imobilidade; neste contexto de juízo sobre pastagens, a expressão comunica a desolação resultante sem apagar completamente a ideia subjacente de cessação.
- source_word: נְאוֹת
  choice: pastagens
  rationale: No contexto pastoril de Jeremias, o termo designa lugares de pasto ou de apascentamento, e não habitações em sentido genérico.
- source_word: הַשָּׁלוֹם
  choice: tranquilas
  rationale: Na construção נְאוֹת הַשָּׁלוֹם, o substantivo 'paz' qualifica as pastagens como seguras e sossegadas. 'Tranquilas' é natural em português, enquanto a forma mais literal é preservada em nota.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição introduz aqui a causa da devastação, não uma relação espacial.
- source_word: חֲרוֹן אַף
  choice: ira ardente
  rationale: A tradução conserva tanto a intensidade da ira quanto a imagem hebraica de calor ou ardor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como nome próprio, em vez de ser substituído por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e corresponde de modo mais provável à sua vocalização antiga.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a imagem pastoril, a causalidade explícita e a intensidade do idioma hebraico para a ira divina.
