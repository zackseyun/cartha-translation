  source_fidelity: O sentido central é bem representado, incluindo o apelo à mudança de conduta, o singular distributivo de אִישׁ, a referência coletiva às ações e a abrangência temporal da concessão da terra. Contudo, “voltem ... do seu mau caminho” é menos claro em português do que um verbo que expresse diretamente o afastamento de uma conduta.
  naturalness: “Afastem-se, por favor, cada um do seu mau caminho” é mais idiomático e inequívoco em português moderno. “Desde tempos antigos e para sempre” é claro e conserva a orientação retrospectiva e prospectiva da expressão hebraica.
  terminology: “Yahweh”, “mau caminho”, “maldade” e “habitem” são escolhas adequadas. A nota a deve acompanhar a fórmula introdutória, como no texto-base e na trilha de auditoria inglesa; a nota atual está ancorada em lugar inadequado e oferece uma alternativa que altera a construção da frase.
