base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: pt
  text: 'dizendo[a]: “Afastem-se, por favor, cada um do seu mau caminho e da maldade das suas ações, e habitem na terra que Yahweh deu a vocês e aos seus pais, desde tempos antigos e para sempre[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Voltem, por favor, cada um do seu mau caminho e da maldade das suas ações.”'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que abrange o passado remoto e o futuro duradouro, ressaltando a continuidade da dádiva da terra feita por Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz o conteúdo da mensagem profética e mantém a construção de ligação com o contexto anterior.
- source_word: שׁוּבוּ נָא
  choice: Por favor, voltem
  rationale: שׁוּב expressa voltar ou abandonar um rumo, especialmente em apelos ao arrependimento; נָא marca súplica ou insistência cortês, não necessariamente tempo.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular distributivo após o imperativo plural individualiza o apelo. Em português atual, “cada um” conserva esse valor sem tornar a frase artificial.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: do seu mau caminho
  rationale: Preserva a metáfora bíblica do caminho como conduta ou curso de vida e mantém o singular distributivo do hebraico.
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: e da maldade das suas ações
  rationale: Representa tanto o substantivo abstrato רֹעַ, “maldade”, quanto מַעֲלָלִים, “ações/feitos”, preservando a mudança do singular distributivo para a interpelação plural.
- source_word: וּשְׁבוּ
  choice: e habitem
  rationale: יָשַׁב, no contexto da terra concedida, indica residência estabelecida; “habitem” é digno, claro e semanticamente preciso.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Embora עַל seja literalmente “sobre”, em português “na terra” expressa naturalmente a habitação no território concedido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: a vocês e aos seus pais
  rationale: Mantém a referência familiar e pactual de אָבוֹת e reproduz os dois complementos do verbo “deu” de modo natural.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: desde a antiguidade e para sempre
  rationale: 'Preserva a assimetria temporal do idioma hebraico: o primeiro membro olha para o passado remoto, e o segundo, para a continuidade futura.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Sentido do apelo שׁוּבוּ נָא
  choice: Por favor, voltem
  alternative: Voltem agora
  rationale: נָא funciona aqui como partícula de súplica, e não exige uma leitura temporal; a tradução mantém o caráter urgente de apelo sem acrescentar “agora”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a metáfora do “caminho”, o apelo cortês, a alternância entre o singular distributivo e o plural coletivo, e a tensão temporal da expressão final.
