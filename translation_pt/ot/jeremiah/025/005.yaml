    rationale: Pode ser entendida como retorno procedente de um caminho, em vez de afastamento ou abandono de uma conduta má, que é o sentido exigido por שׁוּבוּ ... מִדַּרְכּוֹ.
  - severity: medium
    issue: A nota a está ligada a “ações” e não à introdução/imperativo que ela pretende comentar.
    rationale: A alternativa proposta corresponde ao apelo inteiro, não apenas a “maldade das suas ações”; além disso, “e abandonem...” não é uma alternativa sintaticamente equivalente ao segmento marcado.
