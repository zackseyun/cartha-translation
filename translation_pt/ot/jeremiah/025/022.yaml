  text: וְ/אֵת֙ כָּל מַלְכֵי צֹ֔ר וְ/אֵ֖ת כָּל מַלְכֵ֣י צִיד֑וֹן וְ/אֵת֙ מַלְכֵ֣י הָ/אִ֔י אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
translation:
  language: pt
  text: e todos os reis de Tiro, todos os reis de Sidom e os reis da região costeira[a] que fica do outro lado do mar;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilha”. O termo hebraico אִי pode significar “ilha”, mas, na linguagem profética, muitas vezes se refere de modo mais amplo a uma costa ou região marítima.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: todos
  rationale: Preserva o alcance abrangente do hebraico e soa natural na enumeração.
- source_word: מַלְכֵי
  choice: reis de
  rationale: Reproduz diretamente a construção nominal hebraica, sem ampliar o sentido para o termo mais genérico “governantes”.
- source_word: צֹר
  choice: Tiro
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: הָאִי
  choice: a região costeira
  rationale: O substantivo pode indicar uma ilha, mas na linguagem profética também designa litoral ou região marítima; “região costeira” conserva essa amplitude no contexto geográfico.
- source_word: אֲשֶׁר בְּעֵבֶר הַיָּם
  choice: que fica do outro lado do mar
  rationale: Representa explicitamente a oração relativa e conserva o sentido espacial de algo situado além ou do outro lado do mar.
- source_word: וְאֵת ... וְאֵת ... וְאֵת
  choice: e ... , ... e ...
  rationale: Mantém a coordenação da lista em português natural; as partículas de objeto direto não recebem tradução independente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade à estrutura hebraica. A repetição de “todos os reis” foi preservada para Tiro e Sidom; o singular coletivo de הָאִי foi vertido por “região costeira”, mantendo em nota a alternativa “ilha”.
