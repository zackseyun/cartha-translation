  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: pt
  text: 'Você lhes dirá: “Assim diz Yahweh dos Exércitos, o Deus de Israel: Bebam, embriaguem-se, vomitem, caiam e não se levantem, por causa da espada que estou enviando entre vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Você lhes dirá
  rationale: O waw seguido do perfeito assume força diretiva no discurso profético. O futuro em português preserva o tom de incumbência e soa natural.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada, que mantém a solenidade e a atualidade da declaração divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Equivalente atual e inteligível do título divino, indicando as forças sob o comando de Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: Bebam, embriaguem-se
  rationale: Mantém os imperativos plurais e expressa o processo de ficar embriagado em registro digno e corrente.
- source_word: וּקְיוּ
  choice: vomitem
  rationale: O verbo raro designa o ato de vomitar; esta é a equivalência moderna mais clara e direta.
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: caiam e não se levantem
  rationale: Preserva a formulação simples do hebraico sem explicitar além do texto a ideia contextual de queda definitiva.
- source_word: מִפְּנֵי הַחֶרֶב
  choice: por causa da espada
  rationale: Expressa naturalmente o valor causal da locução neste contexto.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: que estou enviando para o meio de vocês
  rationale: Preserva a nuance espacial de בֵּינֵיכֶם, retratando a espada entrando e agindo entre os destinatários, sem reduzi-la ao sentido interpretativo de 'contra vocês'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. A transliteração 'Yahweh' preserva essa função e evita substituí-lo por um título.
- issue: Alcance de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos celestiais; das hostes
  rationale: A opção mantém a amplitude do título sem especificar apenas forças celestiais nem recorrer ao termo menos corrente 'hostes'.
translation_notes:
  register: 'Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a sequência incisiva dos imperativos, a metáfora da embriaguez e a imagem espacial da espada enviada ao meio dos povos. Nenhuma nota é necessária: a alternativa lexical para וּקְיוּ pode ser representada adequadamente por ''vomitem'' no texto principal.'
