  text: וְ/הָֽיְתָה֙ כָּל הָ/אָ֣רֶץ הַ/זֹּ֔את לְ/חָרְבָּ֖ה לְ/שַׁמָּ֑ה וְ/עָ֨בְד֜וּ הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה אֶת מֶ֥לֶךְ בָּבֶ֖ל שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: pt
  text: E toda esta terra se tornará uma ruína e motivo de horror[a], e estas nações servirão ao rei da Babilônia durante setenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objeto de espanto”, destacando a reação de consternação provocada pela devastação da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E ... se tornará
  rationale: O perfeito qal com conjunção em discurso profético tem valor futuro; “se tornará” expressa naturalmente o estado resultante.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: toda esta terra
  rationale: No contexto histórico do oráculo, אֶרֶץ designa a terra ou região sob julgamento, não o planeta inteiro; a tradução preserva כָּל e o demonstrativo.
- source_word: לְחָרְבָּה
  choice: uma ruína
  rationale: O substantivo indica devastação ou ruína; esta forma é concreta, clara e natural em português.
- source_word: לְשַׁמָּה
  choice: motivo de horror
  rationale: שַׁמָּה pode destacar a reação de espanto e horror provocada pela devastação. “Motivo de horror” torna explícita essa dimensão sem resolver excessivamente a nuance lexical.
- source_word: וְעָבְדוּ
  choice: servirão
  rationale: Com objeto direto referente a um rei, עבד significa servir, incluindo aqui a sujeição política.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: estas nações
  rationale: גּוֹיִם refere-se neste contexto a povos organizados politicamente; “nações” é direto e preciso.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: Tradução direta da construção hebraica, com regência portuguesa natural de “servir” quando significa prestar serviço ou sujeitar-se a alguém.
- source_word: שִׁבְעִים שָׁנָה
  choice: durante setenta anos
  rationale: “Durante” expressa de modo idiomático a duração indicada pela expressão numeral hebraica.
theological_decisions:
- issue: Alcance de “terra” no oráculo de julgamento
  choice: “terra” refere-se à região sob julgamento
  alternative: “terra” poderia ser entendida em sentido mais amplo ou hiperbólico como toda a terra
  rationale: O contexto imediato trata de Judá e das nações vizinhas sob o domínio babilônico. “Terra” preserva a flexibilidade de אֶרֶץ sem universalizar indevidamente o alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e o ritmo profético foram preservados; “motivo de horror” evita a formulação menos natural “um horror” e mantém a reação evocada por שַׁמָּה.
