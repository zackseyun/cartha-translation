language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: pt
  text: Lamentem em alta voz[a], pastores, e gritem; revolvam-se no pó[b], poderosos do rebanho[c], pois se completaram os dias para o seu abate e para as suas dispersões[d]; vocês cairão como um vaso precioso[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “Uivem”. O verbo hebraico indica uma lamentação alta e intensa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “revolvam-se”. Provavelmente se refere ao gesto de luto de rolar ou se revolver no pó ou nas cinzas.
    reason: cultural_note
  - marker: c
    text: Ou “nobres do rebanho” ou “maiorais do rebanho”.
    reason: lexical_alternative
  - marker: d
    text: O hebraico desta expressão é difícil. Também pode ser entendido como uma referência ao momento em que eles seriam espalhados; outras interpretações a relacionam a serem despedaçados.
    reason: alternative_reading
  - marker: e
    text: Ou “um vaso desejável” ou “um vaso estimado”. A imagem é a de um objeto valioso e vulnerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentem em alta voz
  rationale: O imperativo plural de ילל indica lamentação ruidosa. A expressão comunica a intensidade em português atual sem reduzir o termo a um lamento interior.
- source_word: הָרֹעִים
  choice: pastores
  rationale: Mantém a metáfora pastoral do hebraico e o vocativo direto, sem interpretá-la no texto principal como referência explícita a governantes.
- source_word: וְזַעֲקוּ
  choice: e gritem
  rationale: זעק expressa um clamor forte, especialmente em aflição. “Gritem” distingue esse clamor da lamentação da oração anterior.
- source_word: וְהִתְפַּלְּשׁוּ
  choice: revolvam-se no pó
  rationale: O hitpael de פלשׁ descreve aqui um gesto corporal de luto e humilhação. A menção ao pó explicita o cenário implícito no costume, sem apagar a imagem.
- source_word: אַדִּירֵי הַצֹּאן
  choice: poderosos do rebanho
  rationale: אַדִּיר pode designar pessoas poderosas, nobres ou majestosas. “Poderosos” preserva status e força, bem como a metáfora do rebanho.
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  choice: pois se completaram os dias do seu abate
  rationale: Reproduz a imagem hebraica de dias que chegaram à sua plenitude e conserva a linguagem vívida de abate.
- source_word: וּתְפוֹצוֹתִיכֶם
  choice: e das suas dispersões
  rationale: A forma nominal plural aponta para dispersões ou espalhamentos. A construção foi ligada a “se completaram os dias” para produzir português inteligível, sem esconder em nota a dificuldade do hebraico.
- source_word: וּנְפַלְתֶּם
  choice: vocês cairão
  rationale: O perfeito com waw tem valor consequente ou futuro no anúncio de juízo. “Cairão” é direto e natural.
- source_word: כִּכְלִי חֶמְדָּה
  choice: como um vaso precioso
  rationale: כְּלִי é objeto ou recipiente, e חֶמְדָּה indica algo desejável, estimado ou precioso. “Vaso precioso” conserva a imagem de um objeto valioso e frágil.
theological_decisions:
- issue: Identidade metafórica dos pastores e dos poderosos do rebanho
  choice: Manter no texto principal as imagens de pastores e rebanho.
  alternative: Interpretar diretamente como governantes, líderes ou nobres.
  rationale: Embora em Jeremias a imagem frequentemente aponte para dirigentes, o hebraico apresenta a metáfora sem explicá-la aqui. Preservá-la evita impor uma identificação mais estreita.
- issue: Intensidade da linguagem de juízo
  choice: Traduzir לִטְבוֹחַ por “abate”.
  alternative: Atenuar para “morte” ou “destruição”.
  rationale: O termo hebraico é deliberadamente violento; a tradução não deve suavizar a imagem.
- issue: Relação sintática de וּתְפוֹצוֹתִיכֶם
  choice: Entender “das suas dispersões” em paralelo com “do seu abate”, sob a ideia dos dias que se completaram.
  alternative: Suprir uma oração independente, como “chegou a sua dispersão”, ou adotar uma leitura ligada a despedaçamento.
  rationale: O hebraico é conciso e difícil. A opção escolhida respeita a forma nominal atestada e oferece uma construção portuguesa coerente, enquanto a nota registra a incerteza.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais no plural em “vocês”, naturais para leitores brasileiros. A repetição de imagens concretas — pastores, rebanho, abate e vaso — foi preservada. “Revolvam-se” mantém solenidade sem recorrer a linguagem arcaica; a nota esclarece o gesto cultural.
