  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: pt
  text: A palavra que veio a Jeremias acerca de todo o povo de Judá[a], no quarto ano de Jeoaquim, filho de Josias, rei de Judá — esse foi o primeiro ano de Nabucodonosor, rei da Babilônia —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «contra todo o povo de Judá». A preposição hebraica pode ter ambos os sentidos em contextos proféticos.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Em introduções proféticas, דָּבָר costuma designar uma comunicação divina. “A palavra” preserva a fórmula profética tradicional sem explicitação excessiva.
- source_word: אֲשֶׁר הָיָה עַל יִרְמְיָהוּ
  choice: que veio a Jeremias
  rationale: A construção היה על, usada com um profeta, indica idiomaticamente que uma palavra lhe veio; esta formulação é natural em português e mantém o sentido da expressão hebraica.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: acerca de todo o povo de Judá
  rationale: עַל pode indicar referência ou oposição. “Acerca de” preserva aqui o sentido amplo da introdução do oráculo, sem antecipar que a palavra seja exclusivamente contra o povo.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: no quarto ano de Jeoaquim
  rationale: Tradução idiomática da fórmula hebraica de datação régia.
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: filho de Josias, rei de Judá
  rationale: Reproduz de modo direto a genealogia e o título real.
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית
  choice: esse foi o primeiro ano
  rationale: O pronome retoma o ano anteriormente mencionado e identifica as duas referências cronológicas; “esse” torna a retomada clara em português.
- source_word: לִנְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: de Nabucodonosor, rei da Babilônia
  rationale: Emprega as formas portuguesas reconhecíveis do nome e do título, traduzindo idiomaticamente o marcador hebraico de datação régia.
theological_decisions:
- issue: Sentido de עַל diante de “todo o povo de Judá”
  choice: acerca de todo o povo de Judá
  alternative: contra todo o povo de Judá
  rationale: Embora o capítulo contenha juízo, a preposição na introdução pode apenas indicar o referente da mensagem. “Acerca de” mantém a amplitude semântica e não determina antecipadamente a direção hostil do oráculo.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecidas dos nomes bíblicos. A estrutura cronológica do hebraico e o travessão final foram preservados porque a frase prossegue no versículo seguinte.
