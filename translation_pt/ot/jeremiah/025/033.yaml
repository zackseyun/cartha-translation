  text: וְ/הָי֞וּ חַֽלְלֵ֤י יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: pt
  text: Naquele dia, os mortos de Yahweh[a] estarão de uma extremidade da terra até a outra.[b] Não serão lamentados, nem recolhidos, nem sepultados; serão esterco sobre a superfície do solo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mortos por Yahweh”. A construção hebraica pode tornar mais explícita a ação de Yahweh ao matá-los.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “de uma extremidade do território até a outra”. A palavra hebraica pode significar “terra” ou “território”; aqui, “terra” é preferido por causa do amplo alcance do oráculo.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “sobre a face do solo”.'
    reason: literal_rendering
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: mortos de Yahweh
  rationale: חַלְלֵי é o plural construto de “morto, traspassado”. A formulação compacta preserva a relação genitiva do hebraico sem tornar explícita no corpo do texto uma agência que a construção apenas pode implicar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal natural em português, adequado ao registro profético.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: de uma extremidade da terra até a outra
  rationale: Reproduz o merismo que indica alcance total. “Terra” é preferido pelo contexto internacional do oráculo, embora “território” seja lexicalmente possível.
- source_word: לֹא יִסָּפְדוּ
  choice: não serão lamentados
  rationale: O nifal de ספד indica que os mortos não receberão lamento fúnebre.
- source_word: וְלֹא יֵאָסְפוּ
  choice: nem recolhidos
  rationale: No contexto, refere-se a recolher os cadáveres, provavelmente com vistas ao sepultamento.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: nem sepultados
  rationale: Equivalente passivo direto e digno do verbo קבר.
- source_word: לְדֹמֶן
  choice: esterco
  rationale: Mantém a imagem concreta, degradante e deliberadamente forte de דֹמֶן.
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: sobre a superfície do solo
  rationale: Expressa naturalmente a locução literal “sobre a face do solo”, preservando a imagem dos corpos expostos.
- source_word: יִהְיוּ
  choice: serão
  rationale: Mantém o valor simples de היה e, com o predicativo “esterco”, comunica o resultado degradante sem acrescentar uma comparação explícita ausente do texto.
theological_decisions:
- issue: Sentido da construção חַלְלֵי יְהוָה
  choice: mortos de Yahweh
  alternative: mortos por Yahweh
  rationale: O construto hebraico é compacto e pode destacar a relação dos mortos com o juízo de Yahweh sem explicitar gramaticalmente a agência. A alternativa esclarece uma leitura provável, mas mais interpretativa.
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: território
  rationale: O contexto do oráculo dirigido às nações favorece alcance amplo, mas אֶרֶץ também pode designar uma terra ou território específico; essa possibilidade é preservada em nota.
- issue: Força predicativa de לְדֹמֶן ... יִהְיוּ
  choice: serão esterco
  alternative: serão como esterco
  rationale: A construção hebraica não contém partícula comparativa explícita. A tradução escolhida conserva a contundência da identificação metafórica, sem negar que o sentido contextual descreva o destino e a degradação dos cadáveres.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A cadência profética é preservada pela sequência tripla “nem recolhidos, nem sepultados” e pela imagem final contundente. Evitaram-se tanto arcaísmos como explicitações doutrinárias não exigidas pelo hebraico.
