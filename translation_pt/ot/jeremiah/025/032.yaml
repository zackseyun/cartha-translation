  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Eis que uma calamidade[a] avança de nação em nação[b], e uma grande tempestade está se levantando desde as regiões mais remotas da terra[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mal” ou “desastre”. O termo hebraico pode indicar tanto o mal quanto uma calamidade; aqui, o contexto aponta para uma devastação resultante do juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de uma nação para outra”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “dos confins da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro e sua cadência solene, sem recorrer a linguagem antiquada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressão consagrada e clara em português para o título divino; mantém a ideia de forças organizadas sem restringir o referente apenas a exércitos humanos.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força apresentativa e a urgência profética do hebraico em registro elevado, mas ainda compreensível.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto de juízo, indica um acontecimento destrutivo, não necessariamente maldade moral. “Calamidade” é natural em português e mantém a gravidade do termo.
- source_word: יֹצֵאת
  choice: avança
  rationale: O particípio retrata a ação em curso. “Avança” comunica de modo natural o movimento progressivo da calamidade entre as nações.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de nação em nação
  rationale: Expressa a progressão sucessiva entre povos sem acrescentar a ideia de uma nação atacando outra, que as preposições não tornam explícita.
- source_word: סַעַר גָּדוֹל
  choice: uma grande tempestade
  rationale: Mantém a imagem vigorosa de uma tempestade associada ao juízo divino em linguagem corrente.
- source_word: יֵעוֹר
  choice: está se levantando
  rationale: Traduz idiomaticamente o nifal “ser despertado, ser incitado” aplicado a uma tempestade e conserva a vivacidade da cena; a forma hebraica também pode receber valor futuro.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: desde as regiões mais remotas da terra
  rationale: Preserva a noção espacial das extremidades distantes da terra e o valor de procedência da preposição.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: calamidade
  alternative: mal; desastre
  rationale: O contexto descreve uma devastação que percorre as nações. “Mal” poderia ser entendido como maldade moral, embora essa seja uma possibilidade lexical do termo hebraico. “Calamidade” comunica aqui o sentido contextual sem atribuir ao texto uma afirmação sobre Deus produzir mal moral.
- issue: Valor temporal e imagético de יֵעוֹר
  choice: está se levantando
  alternative: será despertada; é incitada
  rationale: O imperfeito pode apresentar a ação como iminente ou futura, enquanto o contexto profético permite uma descrição vívida em desenvolvimento. A tradução escolhida mantém essa vivacidade sem definir rigidamente a cronologia.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A fórmula profética e a imagem da tempestade foram preservadas, enquanto as construções verbais foram tornadas idiomáticas em português. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
