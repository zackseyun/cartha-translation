base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: pt
  text: 'E você profetizará a eles todas estas palavras e lhes dirá: “O SENHOR rugirá do alto e, de sua santa morada, fará ressoar a sua voz. Rugirá com grande força contra a sua pastagem; responderá com um brado, como os que pisam uvas, a todos os habitantes da terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּנָּבֵא אֲלֵיהֶם
  choice: profetizará contra eles
  rationale: A preposição אֶל pode indicar direção ou oposição; neste contexto de anúncio de juízo, “contra eles” comunica adequadamente a força contextual.
- source_word: יִתֵּן קוֹלוֹ
  choice: fará ressoar a sua voz
  rationale: A expressão idiomática hebraica significa literalmente “dará sua voz”; a formulação escolhida conserva a imagem vocal em português natural e solene.
- source_word: שָׁאֹג יִשְׁאַג
  choice: rugirá com força
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “com força” reproduz essa ênfase sem uma repetição artificial em português.
- source_word: נָוֵהוּ
  choice: sua pastagem
  rationale: נָוֶה pode designar pastagem, habitação ou redil. “Pastagem” preserva a imagem pastoral e o contraste com o rugido.
- source_word: הֵידָד
  choice: um brado
  rationale: Designa um grito forte, aqui comparado ao brado rítmico dos que pisam uvas.
- source_word: יַעֲנֶה
  choice: responderá
  rationale: Mantém o sentido comum do verbo ענה e a formulação do texto massorético, preservando a imagem potencialmente incomum de resposta em meio ao brado.
- source_word: הָאָרֶץ
  choice: terra
  rationale: Pode significar “terra” ou “país”; o alcance de “todos os habitantes” e o contexto internacional favorecem “terra”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: O SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção portuguesa amplamente reconhecida, sem acrescentar interpretação denominacional.
- issue: Referente de “sua pastagem”
  choice: Mantida a metáfora sem explicitar o referente
  alternative: Explicitar como a terra ou o povo do SENHOR
  rationale: O hebraico não identifica expressamente o referente; explicitá-lo eliminaria uma ambiguidade genuína.
- issue: Força de יַעֲנֶה
  choice: responderá
  alternative: gritará / entoará um brado
  rationale: A tradução conserva a tensão lexical do verbo hebraico, em vez de harmonizá-lo silenciosamente com o substantivo “brado”.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. O nome divino aparece em versalete convencional como “SENHOR”. A construção inicial evita duplicar o pronome, pois o hebraico não apresenta ênfase independente suficiente para justificar “você, você” em português.
