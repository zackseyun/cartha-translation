id: JER.25.31
reference: Jeremiah 25:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: pt
  text: Um estrondo chegou até os confins da terra[a], pois Yahweh tem uma causa contra as nações[b]; ele entra em juízo com toda carne[c]. Entregou os perversos à espada[d] — declaração de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tumulto” ou “rugido”, em vez de “estrondo”.
    reason: lexical_alternative
  - marker: b
    text: “Tem uma causa contra” traduz um termo jurídico hebraico que também pode ser vertido como “tem uma controvérsia com” ou “move uma ação contra”.
    reason: lexical_alternative
  - marker: c
    text: “Toda carne” é uma expressão idiomática hebraica que significa toda a humanidade.
    reason: lexical_alternative
  - marker: d
    text: Ou “entregou-os à espada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  choice: estrondo
  rationale: Expressa a comoção ruidosa e ameaçadora do contexto de juízo, preservando a força sonora do termo hebraico.
- source_word: בָּא
  choice: chegou
  rationale: O perfeito hebraico é traduzido como ação consumada no discurso profético, apresentando o acontecimento vindouro com vividez e certeza.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: até os confins da terra
  rationale: Formulação portuguesa natural para a extremidade ou extensão mais remota da terra, sem restringir a imagem a um único ponto geográfico.
- source_word: רִיב
  choice: uma causa
  rationale: Mantém o sentido jurídico de disputa ou processo presente no contexto profético, em linguagem clara e não excessivamente técnica.
- source_word: בַּגּוֹיִם
  choice: contra as nações
  rationale: Embora a preposição possa ser entendida como 'com' ou 'entre', a construção jurídica portuguesa 'ter uma causa contra' comunica adequadamente a força adversativa do contexto.
- source_word: נִשְׁפָּט הוּא
  choice: ele entra em juízo
  rationale: Preserva a flexibilidade e o caráter forense da forma hebraica, sem reduzi-la apenas ao ato de proferir uma sentença.
- source_word: לְכָל בָּשָׂר
  choice: com toda carne
  rationale: Conserva a imagem idiomática hebraica e seu alcance universal; a nota esclarece que a expressão se refere a toda a humanidade.
- source_word: הָרְשָׁעִים
  choice: os perversos
  rationale: Representa a categoria moral expressa pelo adjetivo substantivado, em português corrente e solene.
- source_word: נְתָנָם לַחֶרֶב
  choice: Entregou os perversos à espada
  rationale: Comunica o sentido idiomático de destiná-los à morte pela guerra, preservando a imagem da espada e explicitando o antecedente do pronome hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Mantém a fórmula profética solene e sua função de autenticar o oráculo.
theological_decisions:
- issue: Linguagem jurídica do juízo divino
  choice: “tem uma causa” e “entra em juízo”
  alternative: “tem uma controvérsia” e “julga”
  rationale: Os termos רִיב e נִשְׁפָּט formam uma cena forense. A tradução preserva a tensão textual em que Yahweh apresenta sua causa e atua no juízo, sem impor uma explicação sistemática adicional.
- issue: Alcance de כָל־בָּשָׂר
  choice: “toda carne” no texto principal
  alternative: “toda a humanidade”
  rationale: A opção mantém o idioma bíblico e o alcance universal da expressão; a nota oferece ao leitor seu sentido corrente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o paralelismo profético, a imagem sonora inicial, o campo jurídico e o idioma concreto “toda carne”, esclarecido em nota.
