source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: pt
  text: Como um leão jovem, ele deixou seu covil, pois a terra deles se tornou uma desolação por causa da ira ardente do opressor[a] e por causa da ira ardente dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da ira ardente da pomba”. A forma hebraica escrita pode ser lida assim, mas o contexto favorece fortemente o sentido “o opressor”.'
    reason: alternative_reading
  - marker: b
    text: O termo “dele” provavelmente se refere ao SENHOR no contexto ao redor, embora alguns entendam que se refere ao opressor mencionado na frase anterior.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: deixou
  rationale: O qal perfeito descreve uma ação concluída. “Deixou” é natural em português e evita intensificar o verbo como faria “abandonou”.
- source_word: כַּכְּפִיר
  choice: como um leão novo
  rationale: כפיר designa normalmente um leão jovem, já vigoroso e perigoso; “leão novo” comunica isso de modo claro.
- source_word: סֻכּוֹ
  choice: seu covil
  rationale: Embora סֻכָּה denote literalmente uma cabana ou abrigo, na imagem do leão indica sua morada; “covil” preserva naturalmente a metáfora.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ação anterior e mantém de forma clara a ligação explicativa.
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: a terra deles se tornou uma desolação
  rationale: Preserva a ideia resultante e a forma substantiva de שַׁמָּה, em vez de reduzi-la apenas ao adjetivo “desolada”.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Expressa de maneira idiomática o valor causal da construção.
- source_word: חֲרוֹן
  choice: ira ardente
  rationale: Mantém a metáfora hebraica do calor intenso aplicado à ira, sem recorrer ao termo menos transparente “furor”.
- source_word: הַיּוֹנָה
  choice: o opressor
  rationale: No contexto de devastação e juízo, a leitura ligada à opressão é a mais coerente. Como a forma escrita também permite a leitura “a pomba”, essa possibilidade é preservada em nota.
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: e por causa da ira ardente dele
  rationale: Traduz o idioma אַף (“nariz” como sede da ira) por português natural. “Dele” conserva a possível ambiguidade do referente e mantém o paralelismo com a expressão anterior.
theological_decisions:
- issue: Referente da imagem do leão e do pronome final
  choice: A imagem é apresentada sem explicitar o sujeito, e o pronome final é traduzido de modo a poder referir-se ao SENHOR no contexto imediato.
  alternative: A imagem pode referir-se a Nabucodonosor ou a outro destruidor humano, e o pronome final pode retomar o opressor.
  rationale: Jeremias 25:30-38 tem o SENHOR como agente principal do juízo, o que favorece a referência a ele. Contudo, a sintaxe hebraica e a menção interveniente ao opressor deixam margem para outra compreensão; por isso, a tradução não insere um nome que elimine a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a imagem do leão e a repetição de “ira ardente”. Os marcadores foram posicionados junto às expressões às quais as notas efetivamente se referem.
