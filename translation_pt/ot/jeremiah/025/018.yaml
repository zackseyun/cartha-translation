base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: pt
  text: Jerusalém, as cidades de Judá, seus reis e seus oficiais, para fazer deles uma ruína, motivo de horror[a], alvo de assobios de desprezo[b] e de maldição, como está neste dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivo de espanto”. O termo hebraico pode destacar a reação de consternação provocada pela devastação.
    reason: lexical_alternative
  - marker: b
    text: Ou “objeto de assobio”. O hebraico se refere ao som de escárnio feito por quem observa um lugar arruinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do topônimo em português.
- source_word: עָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Reproduz com clareza e naturalidade a relação do construto hebraico.
- source_word: מְלָכֶיהָ אֶת שָׂרֶיהָ
  choice: seus reis e seus oficiais
  rationale: Os sufixos femininos retomam coletivamente Jerusalém/Judá; שָׂרִים designa aqui autoridades político-administrativas, sem exigir o sentido restrito de príncipes.
- source_word: לָתֵת אֹתָם
  choice: para fazer deles
  rationale: Neste encadeamento, נתן seguido de substantivos com לְ expressa o resultado ou estado ao qual os referentes são reduzidos.
- source_word: לְחָרְבָּה
  choice: uma ruína
  rationale: Expressa de maneira concreta e acessível a devastação indicada pelo hebraico.
- source_word: לְשַׁמָּה
  choice: motivo de horror
  rationale: Comunica tanto a condição devastada quanto a reação consternada que ela provoca.
- source_word: לִשְׁרֵקָה
  choice: alvo de assobios de desprezo
  rationale: Preserva a imagem sonora hebraica e explicita seu caráter de escárnio para o leitor moderno.
- source_word: וְלִקְלָלָה
  choice: de maldição
  rationale: Mantém a expressão compacta e a ideia de que os lugares se tornam exemplo proverbial em fórmulas de maldição.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê neste dia
  rationale: Apresenta a situação contemporânea ao enunciado como evidência visível, preservando a força demonstrativa de 'este dia'.
