  source_fidelity: A tradução preserva adequadamente os referentes principais, o alcance universal de «todos os reinos» e a sequência temporal em «beberá depois deles». «Sesaque» deve permanecer transliterado, com a identificação provável em nota. Porém, «cada um junto ao outro» não representa de modo claro nem natural o idiomatismo אִישׁ אֶל־אָחִיו; no contexto da enumeração, «uns após os outros» comunica apropriadamente a relação sucessiva sem introduzir parentesco literal.
  naturalness: O registro é em geral claro e digno. «Cada um junto ao outro» é pouco idiomático em português e produz uma construção semanticamente confusa. «Uns após os outros» é natural e mantém o movimento enumerativo. A chamada da nota deve acompanhar «Sesaque», termo explicado pela nota, e não «norte».
  terminology: «Reis do norte», «próximos e distantes», «reinos da terra», «solo» e «Sesaque» são escolhas adequadas. A nota descreve com prudência a provável cifra e não transforma a identificação de Sesaque com Babilônia em leitura do texto principal.
