base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: pt
  text: e todos os reis do norte, tanto os próximos como os distantes, uns após os outros, e todos os reinos da terra que estão sobre a face do solo. E o rei de Sesaque[a] beberá depois deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sesaque é amplamente entendido como um nome cifrado para Babilônia, provavelmente formado por um sistema semelhante ao atbash.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: os reis do norte
  rationale: Preserva a construção genitiva hebraica e o sentido geográfico sem especificar uma região além do que o texto diz.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: tanto os próximos como os distantes
  rationale: Reproduz de modo natural o par abrangente do hebraico e mantém sua referência aos reis.
- source_word: אִישׁ אֶל אָחִיו
  choice: cada um junto ao outro
  rationale: Mantém a imagem relacional ou espacial do idioma hebraico sem reduzi-la a parentesco literal nem impor exclusivamente uma sequência temporal.
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: todos os reinos da terra
  rationale: O contexto e a expressão seguinte indicam alcance amplo; 'terra' é a formulação portuguesa natural.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: que estão sobre a face do solo
  rationale: Conserva a expressão hebraica de extensão universal e distingue אֲדָמָה, 'solo', de אֶרֶץ, 'terra'.
- source_word: שֵׁשַׁךְ
  choice: Sesaque
  rationale: Translitera o nome presente no texto hebraico, deixando sua provável identificação com Babilônia para a nota.
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: beberá depois deles
  rationale: Preserva a continuação da imagem do cálice no contexto e a relação temporal expressa por אַחֲרֵיהֶם sem acrescentar 'do cálice'.
theological_decisions:
- issue: Identidade de Sesaque
  choice: Manter 'Sesaque' no texto e explicar em nota sua provável referência a Babilônia.
  alternative: Traduzir diretamente como 'Babilônia'.
  rationale: O hebraico traz שֵׁשַׁךְ, não בָּבֶל. A transliteração preserva a opacidade deliberada do texto, enquanto a nota informa a identificação amplamente aceita sem convertê-la em certeza textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a estrutura cumulativa do versículo e a distinção lexical entre 'terra' e 'solo'.
