  source_fidelity: 'A tradução preserva todos os elementos centrais do hebraico: a ação futura de trazer, o alvo («aquela terra»), a totalidade das palavras previamente pronunciadas contra ela, a totalidade do que está escrito no livro e a profecia de Jeremias relativa/dirigida contra todas as nações. «Sobre aquela terra» e «contra ela» refletem adequadamente os usos judiciais de עַל no contexto. A oração final mantém a força adversativa adotada na trilha inglesa, e a nota preserva a alternativa semanticamente possível.'
  naturalness: 'O texto é claro, digno e natural em português moderno: «E trarei sobre aquela terra todas as minhas palavras que falei contra ela — tudo o que está escrito neste livro [...]» tem boa legibilidade e conserva o encadeamento profético do original. O travessão delimita de modo eficaz a explicação aposicional.'
  terminology: «Terra», «palavras», «livro», «profetizou» e «nações» são escolhas estáveis, claras e apropriadas ao registro bíblico. A nota sobre «rolo» transmite adequadamente a alternativa lexical de סֵפֶר, e a nota sobre «a respeito de» preserva a amplitude possível de עַל sem enfraquecer indevidamente o contexto judicial.
