  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/הבאיתי עַל הָ/אָ֣רֶץ הַ/הִ֔יא אֶת כָּל דְּבָרַ֖/י אֲשֶׁר דִּבַּ֣רְתִּי עָלֶ֑י/הָ אֵ֤ת כָּל הַ/כָּתוּב֙ בַּ/סֵּ֣פֶר הַ/זֶּ֔ה אֲשֶׁר נִבָּ֥א יִרְמְיָ֖הוּ עַל כָּל הַ/גּוֹיִֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: pt
  text: E trarei sobre aquela terra todas as minhas palavras que falei contra ela — tudo o que está escrito neste livro[a], o que Jeremias profetizou contra todas as nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “neste rolo”. A palavra hebraica pode designar um livro ou um rolo escrito.
    reason: lexical_alternative
  - marker: b
    text: Ou “a respeito de todas as nações”. A preposição hebraica pode ter sentido mais amplo, embora aqui o contexto favoreça “contra”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: E trarei
  rationale: O hifil de בוא expressa fazer vir; em português, “trarei sobre” comunica naturalmente a execução futura dos juízos anunciados.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: sobre aquela terra
  rationale: אֶרֶץ designa aqui o território sob juízo, e עַל, com “trazer”, é bem representado por “sobre”.
- source_word: אֶת כָּל דְּבָרַי
  choice: todas as minhas palavras
  rationale: Mantém a ligação textual entre a palavra divina pronunciada e seu cumprimento, sem explicitar “juízos” além do que diz o hebraico.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: que falei contra ela
  rationale: O perfeito hebraico refere-se às declarações já feitas; “contra” expressa o valor adversativo de עַל neste contexto judicial.
- source_word: אֵת כָּל הַכָּתוּב
  choice: tudo o que está escrito
  rationale: Reproduz a abrangência da construção hebraica em linguagem portuguesa clara e idiomática.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: neste livro
  rationale: סֵפֶר pode designar livro ou rolo; “livro” é claro para leitores modernos, enquanto a alternativa histórica é preservada em nota.
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: o que Jeremias profetizou
  rationale: Representa de modo direto e natural o nifal נִבָּא com Jeremias como sujeito.
- source_word: עַל כָּל הַגּוֹיִם
  choice: contra todas as nações
  rationale: Embora עַל possa significar “a respeito de”, o contexto de anúncios de punição favorece o sentido adversativo “contra”.
theological_decisions:
- issue: Alcance e força das profecias na oração final
  choice: contra todas as nações
  alternative: a respeito de todas as nações
  rationale: A preposição עַל com נבא admite um sentido temático mais amplo, mas o contexto literário é predominantemente judicial. A tradução principal conserva essa força, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas acompanha sua ocorrência no texto; o travessão marca a aposição explicativa sem alterar a sintaxe essencial.
