  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: O título régio é tradicionalmente vertido como “faraó” em português; o artigo definido torna a expressão natural neste contexto enumerativo.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: rei do Egito
  rationale: A cadeia construta identifica o faraó como governante do Egito e funciona em aposição direta.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד pode designar servo, escravo ou membro do serviço real. “Servos” preserva aqui a amplitude do termo sem impor uma condição jurídica específica.
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: שַׂר pode indicar príncipes, chefes, comandantes ou autoridades. “Oficiais” é uma formulação moderna e ampla, adequada aos agentes da corte e do Estado.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: Mantém o sentido coletivo de עַם e a abrangência expressa por כָּל.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: coordenação natural em português
  rationale: As ocorrências repetidas do marcador de objeto estruturam a enumeração no hebraico. Como não têm equivalente lexical direto em português, os elementos são coordenados de modo natural.
