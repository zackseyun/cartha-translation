source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: pt
  text: Não sigam outros deuses, nem os sirvam, nem se prostrem diante deles. Não provoquem a minha ira com as obras das suas mãos, e eu não lhes causarei nenhum mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu não trarei desgraça sobre vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: sigam
  rationale: A expressão idiomática significa ir atrás de alguém no sentido de segui-lo ou aderir a ele. “Sigam” comunica naturalmente essa lealdade em português.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta da expressão, sem acrescentar a nuance não explícita de deuses estrangeiros.
- source_word: לְעָבְדָם
  choice: os sirvam
  rationale: Preserva o sentido básico de servir a divindades e mantém a distinção em relação ao ato de prostrar-se mencionado em seguida.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: nem se prostrem diante deles
  rationale: Expressa o gesto físico de reverência indicado pelo verbo, sem fundi-lo com o serviço religioso da oração anterior.
- source_word: תַכְעִיסוּ אֹתִי
  choice: provoquem a minha ira
  rationale: Reproduz o valor causativo do Hifil e mantém o tom profético de advertência.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: com as obras das suas mãos
  rationale: Mantém a imagem hebraica dos objetos produzidos pelas mãos humanas, que no contexto aponta especialmente para ídolos.
- source_word: וְלֹא אָרַע לָכֶם
  choice: e eu não lhes causarei nenhum mal
  rationale: Comunica o sentido causativo de não causar dano ou calamidade, evitando atribuir a Deus maldade moral.
theological_decisions:
- issue: Relação lógica e sentido da cláusula final
  choice: e eu não lhes causarei nenhum mal
  alternative: e eu não trarei desgraça sobre vocês
  rationale: O hebraico emprega uma conjunção simples, a negação e a primeira pessoa causativa do verbo. A tradução preserva a forma de promessa ou consequência sem transformá-la explicitamente em oração de finalidade. A nota registra o possível sentido de calamidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação negativa foi distribuída como “não... nem... nem...” para clareza, e o paralelismo e as imagens centrais do hebraico foram preservados.
