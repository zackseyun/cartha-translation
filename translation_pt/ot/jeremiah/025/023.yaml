  text: and Dedan[a], and Tema, and Buz, and all who clip the corners of their hair,
translation:
  language: pt
  text: também Dedã, Temá, Buz e todos os que cortam as extremidades do cabelo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todos os que cortam a extremidade”. A expressão provavelmente se refere aos que cortam ou raspam o cabelo nas laterais da cabeça; alguns entendem que se refere especificamente à barba.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּדָן
  choice: Dedã
  rationale: Nome próprio de povo ou lugar, transliterado segundo a forma portuguesa corrente.
- source_word: תֵּימָא
  choice: Temá
  rationale: Nome próprio do oásis ou grupo tribal árabe; a acentuação explicita a pronúncia natural em português.
- source_word: בּוּז
  choice: Buz
  rationale: Nome próprio de povo ou região, transliterado diretamente.
- source_word: כָּל
  choice: todos
  rationale: Quantificador inclusivo adequado à enumeração de povos.
- source_word: קְצוּצֵי
  choice: os que cortam
  rationale: O particípio de קצץ descreve os membros do grupo por sua prática de cortar ou aparar.
- source_word: פֵאָה
  choice: o cabelo nas têmporas
  rationale: Literalmente, 'canto' ou 'extremidade'; neste uso etnográfico, provavelmente indica o cabelo nas laterais da cabeça, embora possa referir-se à barba.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A enumeração foi ligada por “também” para refletir a continuidade sintática do versículo. “Nas têmporas” comunica naturalmente a provável referência às laterais da cabeça, enquanto a nota preserva a ambiguidade lexical.
