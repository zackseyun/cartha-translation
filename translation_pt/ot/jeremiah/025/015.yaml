base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: pt
  text: 'Pois assim me disse Yahweh, o Deus de Israel: “Tome da minha mão este cálice do vinho da ira[a] e faça todas as nações às quais estou enviando você beberem dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do furor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim me disse
  rationale: Preserva a ligação discursiva de כִּי e a fórmula profética כֹה אָמַר, com ordem natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título “Senhor” e preservando sua função no texto hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta e consagrada da construção hebraica.
- source_word: קַח
  choice: Receba
  rationale: Neste contexto, o objeto vem da mão de Yahweh; “receba” expressa naturalmente o ato ordenado sem perder o sentido de tomar.
- source_word: כּוֹס הַיַּיִן הַחֵמָה הַזֹּאת
  choice: este cálice do vinho da ira
  rationale: Mantém a imagem concreta do cálice, o demonstrativo e a metáfora profética do vinho associado à ira divina.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Conserva literalmente a imagem de Deus entregando o cálice ao profeta.
- source_word: וְהִשְׁקִיתָה אֹתוֹ
  choice: faça com que dele bebam
  rationale: Expressa o valor causativo do hifil de שׁקה; “dele” torna claro que as nações beberão do cálice/vinho sem repetição pesada.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: No contexto do juízo internacional de Jeremias, גּוֹיִם designa nações, não especificamente gentios em sentido religioso posterior.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: às quais eu envio você
  rationale: Preserva a comissão divina e a referência explícita ao destinatário, em português moderno e amplamente compreensível.
theological_decisions:
- issue: Sentido de חֵמָה na imagem do cálice
  choice: ira
  alternative: furor
  rationale: “Ira” mantém o peso judicial da reação divina sem eliminar a intensidade que também permite a tradução “furor”; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva-se “Yahweh” como nome divino e a metáfora profética do cálice. O pronome “você” favorece legibilidade brasileira sem regionalismo excessivo.
