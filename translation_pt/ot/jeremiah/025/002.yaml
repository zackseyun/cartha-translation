  text: אֲשֶׁ֨ר דִּבֶּ֜ר יִרְמְיָ֤הוּ הַ/נָּבִיא֙ עַל כָּל עַ֣ם יְהוּדָ֔ה וְ/אֶ֛ל כָּל יֹשְׁבֵ֥י יְרוּשָׁלִַ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/002.yaml
  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
translation:
  language: pt
  text: que o profeta Jeremias dirigiu a todo o povo de Judá[b] e a todos os habitantes de Jerusalém, dizendo:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que o profeta Jeremias falou... dizendo».'
    reason: lexical_alternative
  - marker: b
    text: A preposição hebraica também pode ser entendida como «a respeito de» ou, em certos contextos, «contra»; aqui foi traduzida como indicação dos destinatários da fala de Jeremias.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa que retoma «a palavra» no versículo 1; «que» é a forma natural em português.
- source_word: דִּבֶּר
  choice: dirigiu
  rationale: Com os complementos introduzidos por עַל e אֶל, expressa uma fala dirigida a determinados ouvintes. «Dirigiu» evita a repetição pouco elegante de «falou... dizendo».
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Conserva o nome tradicional em português e apresenta o título em ordem idiomática, sem perder seu caráter apositivo.
- source_word: עַל
  choice: a
  rationale: Neste contexto, em paralelo com אֶל, marca o grupo ao qual Jeremias dirigiu sua fala. A preposição hebraica também pode indicar assunto ou oposição, ambiguidade registrada em nota.
- source_word: כָּל עַם יְהוּדָה
  choice: todo o povo de Judá
  rationale: Mantém o sentido coletivo singular de עַם e a designação tradicional «Judá».
- source_word: וְאֶל
  choice: e a
  rationale: Introduz o segundo grupo de destinatários da fala em coordenação com o primeiro.
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: todos os habitantes de Jerusalém
  rationale: Tradução clara e digna do particípio substantivado, literalmente «todos os que habitam em Jerusalém».
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva a fórmula hebraica que introduz o discurso apresentado no versículo seguinte.
theological_decisions:
- issue: Sentido de עַל diante de «todo o povo de Judá»
  choice: 'Destinatários da fala: «a todo o povo»'
  alternative: «sobre todo o povo» ou «contra todo o povo»
  rationale: O paralelismo com וְאֶל antes dos habitantes de Jerusalém favorece a leitura de discurso dirigido aos grupos mencionados. A alternativa é preservada em nota para não eliminar a amplitude semântica da preposição.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Dirigiu a» comunica que se trata de uma mensagem falada aos destinatários, enquanto as notas preservam tanto a alternativa mais formal de דִּבֶּר quanto a ambiguidade de עַל.
