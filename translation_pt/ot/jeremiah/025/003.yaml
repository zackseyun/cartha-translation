id: JER.25.3
reference: Jeremiah 25:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: pt
  text: Desde o décimo terceiro ano de Josias, filho de Amom, rei de Judá, até hoje, durante estes vinte e três anos, a palavra de Yahweh tem vindo a mim, e eu tenho falado a vocês com insistência[a], mas vocês não têm escutado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantando-me cedo e falando”, expressão hebraica que indica ação persistente e repetida.
    reason: Preserva a imagem lexical do idiomatismo hebraico enquanto o texto principal comunica seu sentido em português natural.
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: Desde ... até
  rationale: Expressa com clareza o intervalo temporal que começa no décimo terceiro ano de Josias e se estende ao presente do discurso.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: o décimo terceiro ano
  rationale: A construção indica o ano de reinado, não uma duração de treze anos.
- source_word: לְיֹאשִׁיָּהוּ בֶן אָמוֹן מֶלֶךְ יְהוּדָה
  choice: de Josias, filho de Amom, rei de Judá
  rationale: Mantém a identificação genealógica e o título real em português natural.
- source_word: הַיּוֹם הַזֶּה
  choice: o dia de hoje
  rationale: Conserva a referência enfática ao momento presente, com registro mais solene que simplesmente 'hoje'.
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: ao todo, vinte e três anos
  rationale: Torna explícito que a expressão recapitula a duração do período, sem reproduzir uma construção demonstrativa pouco natural em português.
- source_word: הָיָה דְבַר יְהוָה אֵלָי
  choice: a palavra de Yahweh tem vindo a mim
  rationale: O pretérito perfeito composto comunica ocorrências repetidas durante o período que se estende até o presente, sem reduzir a fórmula profética a um único episódio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: e eu tenho falado a vocês
  rationale: O pretérito perfeito composto acompanha o período contínuo de vinte e três anos e é amplamente compreensível em português, especialmente no Brasil.
- source_word: אַשְׁכֵּים וְדַבֵּר
  choice: com insistência
  rationale: Comunica a força iterativa e diligente do idiomatismo hebraico em português natural; a imagem literal é preservada em nota.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mas vocês não têm escutado
  rationale: Preserva a metáfora auditiva de שׁמע e evita explicitar 'obedecer', embora a desobediência esteja implicada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva seu caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido do idiomatismo profético אַשְׁכֵּים וְדַבֵּר
  choice: com insistência
  alternative: levantando-me cedo e falando; repetidas vezes
  rationale: A formulação principal transmite a persistência da proclamação sem fazer o leitor moderno supor que a ênfase seja apenas o horário; a imagem hebraica permanece acessível na nota.
- issue: Escutar ou obedecer em וְלֹא שְׁמַעְתֶּם
  choice: não têm escutado
  alternative: não têm obedecido; não deram ouvidos
  rationale: 'Mantém a abertura semântica do verbo: o contexto implica recusa e desobediência, mas o texto usa linguagem de audição.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A pontuação em travessões esclarece que os vinte e três anos resumem o intervalo anterior. Emprega-se “vocês” por ser uma forma plural corrente e inequívoca; “tem vindo” e “tenho falado” apresentam a atividade repetida ao longo do período até o presente.
