revisions:
- from: Desde o décimo terceiro ano de Josias, filho de Amom, rei de Judá, até o dia de hoje — ao todo, vinte e três anos —, a palavra de Yahweh tem vindo a mim, e eu tenho falado a vocês com insistência[a], mas vocês não têm escutado.
  to: Desde o décimo terceiro ano de Josias, filho de Amom, rei de Judá, até hoje, durante estes vinte e três anos, a palavra de Yahweh tem vindo a mim, e eu tenho falado a vocês com insistência[a], mas vocês não têm escutado.
  rationale: A revisão preserva integralmente o sentido e as escolhas centrais do rascunho, mas substitui a expressão meramente totalizadora “ao todo” por “durante estes”, que mantém a recapitulação dêitica do hebraico, e corrige a pontuação. A nota continua ancorada na expressão que traduz o idiomatismo hebraico.
