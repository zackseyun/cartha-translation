base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/024.yaml
  text: and all the kings of Arabia[a], and all the kings of the mixed peoples who dwell in the wilderness[b];
translation:
  language: pt
  text: e todos os reis da Arábia, e todos os reis dos povos mistos[a] que habitam no deserto[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da população mista» ou «da multidão mista». O hebraico distingue este grupo da «Arábia» mencionada na frase anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou «na região erma».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  choice: reis de/dos
  rationale: Plural construto de מֶלֶךְ, regendo os nomes dos grupos seguintes; em português, a relação é expressa naturalmente por «reis da/dos».
- source_word: עֲרָב
  choice: Arábia
  rationale: Nome próprio referente à região ou aos povos da Arábia; «Arábia» se ajusta à lista geopolítica do contexto.
- source_word: הָעֶרֶב
  choice: os povos mistos
  rationale: O termo é distinto do precedente עֲרָב e provavelmente designa uma população ou coletividade de composição mista. A tradução mantém essa distinção lexical sem identificar o grupo de modo mais específico do que o hebraico permite.
- source_word: הַשֹּׁכְנִים
  choice: que habitam
  rationale: Particípio qal plural de ישׁב, usado como qualificador do grupo anterior; «que habitam» é claro, digno e natural em português atual.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר pode indicar deserto ou região erma. «No deserto» é a formulação mais direta e natural neste contexto geográfico.
- source_word: וְאֵת ... וְאֵת
  choice: e ... e
  rationale: Os marcadores de objeto não são traduzidos, enquanto a repetição da conjunção preserva a estrutura aditiva da lista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «e todos os reis» conserva o ritmo enumerativo do hebraico. «Povos mistos» preserva a diferença entre עֲרָב e הָעֶרֶב; «deserto» comunica de modo corrente o sentido geográfico de מִדְבָּר.
