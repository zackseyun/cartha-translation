  text: וְ/נָתַשְׁתִּ֥י אֲשֵׁירֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הִשְׁמַדְתִּ֖י עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: pt
  text: Arrancarei do meio de vocês os seus postes de Aserá[a] e destruirei as suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas aserás” ou “os seus postes sagrados”. O termo hebraico pode designar objetos de culto associados à deusa Aserá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: Arrancarei
  rationale: O verbo נתשׁ expressa arrancar ou remover pela raiz. “Arrancarei” conserva a força da imagem e soa natural em português.
- source_word: אֲשֵׁירֶיךָ
  choice: os seus postes de Aserá
  rationale: Neste contexto de remoção de elementos idolátricos, o plural provavelmente designa objetos cultuais ligados ao culto da deusa Aserá. A formulação mantém o nome específico sem reduzi-lo ao genérico “ídolos”.
- source_word: מִקִּרְבֶּךָ
  choice: do meio de vocês
  rationale: Reproduz o sentido de “do teu meio” em linguagem corrente. Embora o hebraico use a segunda pessoa masculina singular, ela se dirige coletivamente ao povo; “vocês” torna esse referente claro no português moderno.
- source_word: וְהִשְׁמַדְתִּי
  choice: destruirei
  rationale: O hifil de שׁמד indica causar destruição ou fazer perecer. “Destruirei” comunica diretamente a força do juízo sem intensificação indevida.
- source_word: עָרֶיךָ
  choice: as suas cidades
  rationale: עִיר normalmente significa “cidade”; esta é a correspondência direta e natural no contexto.
theological_decisions:
- issue: Referente de אֲשֵׁירֶיךָ
  choice: objetos cultuais associados a Aserá (“postes de Aserá”)
  alternative: “suas aserás” ou “seus postes sagrados”
  rationale: A sequência contextual trata da eliminação de práticas e objetos idolátricos, favorecendo um referente concreto. Como o termo hebraico também pode designar Aserá ou objetos sagrados associados a ela, a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma plural “vocês” explicita o destinatário coletivo implícito no singular hebraico. O nome “Aserá” segue a forma portuguesa corrente.
