base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: pt
  text: E o remanescente de Jacó estará entre muitos povos como o orvalho que vem de Yahweh, como chuvas sobre a relva, que[a] não esperam pelo homem nem aguardam pelos seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os verbos hebraicos estão no singular e podem significar tanto “esperar” como “ter esperança”. A oração provavelmente descreve o orvalho e as chuvas, que vêm sem depender da ação humana; também pode ser entendida como referência ao remanescente de Jacó.
    reason: ambiguidade lexical e sintática
  - marker: b
    text: 'Hebraico: “filhos do homem”, expressão que significa os seres humanos.'
    reason: expressão idiomática hebraica
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... estará
  rationale: No discurso profético, a construção introduz uma situação futura ou resultante. “Estará” é claro e natural em português moderno.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: o remanescente de Jacó
  rationale: “Remanescente” preserva o motivo profético do grupo sobrevivente, e “Jacó” mantém o nome explícito do hebraico.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: entre muitos povos
  rationale: “Entre” expressa naturalmente a ideia de estar no meio de vários grupos humanos; “povos” evita reduzir o termo a Estados políticos.
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: como o orvalho que vem de Yahweh
  rationale: A expressão indica a procedência divina do orvalho. “Yahweh” representa diretamente o nome divino יְהוָה.
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: como chuvas sobre a relva
  rationale: רְבִיבִים designa chuvas ou pancadas de chuva; “relva” mantém a imagem concreta da vegetação rasteira.
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: não esperam pelo homem
  rationale: קוה pode significar esperar ou ter esperança. No quadro do orvalho e da chuva, “esperar” comunica melhor a ausência de iniciativa ou controle humano, sem ocultar a alternativa lexical, registrada em nota.
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: nem aguardam pelos seres humanos
  rationale: “Aguardar” preserva o paralelismo sem repetição rígida; “seres humanos” traduz de modo atual a expressão idiomática “filhos de Adão/do homem”.
theological_decisions:
- issue: Referente da oração relativa אֲשֶׁר לֹא יְקַוֶּה...
  choice: A redação principal liga a oração às imagens do orvalho e das chuvas, ressaltando que elas vêm de Deus sem depender da ação humana.
  alternative: A oração pode ser entendida de modo mais amplo como referente ao remanescente de Jacó, que não dependeria de apoio humano.
  rationale: As imagens meteorológicas são os antecedentes imediatos e combinam naturalmente com a procedência divina indicada por “de Yahweh”. Contudo, o singular hebraico permite que se perceba uma possível ligação com “remanescente”; por isso, a alternativa é preservada em nota.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém “remanescente”, “Jacó” e “Yahweh” por sua precisão textual e teológica, enquanto verte a expressão antropológica final em linguagem corrente.
