  source_fidelity: 'A tradução preserva adequadamente os dois imperfeitos hebraicos com valor volitivo possível: “Que ... se erga” e “que ... sejam eliminados”. Mantém a imagem literal da mão, a relação de superioridade expressa por עַל (“sobre”) e a distinção lexical razoável entre צָרֶיךָ (“adversários”) e אֹיְבֶיךָ (“inimigos”). “Sejam eliminados” comunica de modo natural o resultado de יִכָּרֵתוּ sem especificar um meio de destruição.'
