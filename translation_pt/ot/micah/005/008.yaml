  text: תָּרֹ֥ם יָדְ/ךָ֖ עַל צָרֶ֑י/ךָ וְ/כָל אֹיְבֶ֖י/ךָ יִכָּרֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: pt
  text: Que a sua mão se erga sobre os seus adversários,[a] e que todos os seus inimigos sejam eliminados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A sua mão se erguerá sobre os seus adversários, e todos os seus inimigos serão eliminados.” Os imperfeitos hebraicos também podem ser entendidos como declarações futuras.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: se erga
  rationale: O qal imperfeito de רוּם, com יָד como sujeito feminino, descreve a mão elevada acima dos adversários. “Se erga” conserva a imagem concreta e comunica vitória ou supremacia sem recorrer ao menos natural “seja exaltada”.
- source_word: יָדְךָ
  choice: a sua mão
  rationale: Mantém literalmente a imagem hebraica da mão, que no contexto representa poder e força, sem substituir a metáfora por sua interpretação.
- source_word: עַל
  choice: sobre
  rationale: Preserva tanto a imagem espacial da mão erguida quanto a ideia contextual de superioridade sobre os adversários.
- source_word: צָרֶיךָ
  choice: os seus adversários
  rationale: צַר designa quem se opõe ou hostiliza. “Adversários” mantém leve distinção lexical em relação a אֹיְבֶיךָ, traduzido como “inimigos” no segundo segmento.
- source_word: וְכָל
  choice: e todos
  rationale: Reproduz de modo natural a conjunção e a abrangência total da expressão hebraica.
- source_word: אֹיְבֶיךָ
  choice: os seus inimigos
  rationale: É o equivalente corrente de אֹיֵב e preserva o paralelismo sem apagar a distinção em relação a “adversários”.
- source_word: יִכָּרֵתוּ
  choice: sejam eliminados
  rationale: O nifal imperfeito de כרת significa literalmente “sejam cortados”, mas, aplicado a inimigos, a expressão comunica sua remoção ou destruição. “Sejam eliminados” é natural em português e mantém aberta a forma exata dessa derrota.
theological_decisions:
- issue: Valor modal dos imperfeitos no contexto profético
  choice: 'Desejo ou declaração volitiva: “Que ... se erga ... e que ... sejam eliminados”'
  alternative: 'Predição futura: “A sua mão se erguerá ... e todos os seus inimigos serão eliminados”'
  rationale: Os imperfeitos hebraicos podem assumir nuance jussiva neste contexto, mas também admitem leitura futura. A tradução principal conserva a força volitiva, e a nota registra a alternativa preditiva sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a imagem hebraica da mão erguida e a distinção entre “adversários” e “inimigos”. O marcador [a] aparece no texto principal.
