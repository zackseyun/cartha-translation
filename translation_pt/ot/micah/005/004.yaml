revisions:
- from: Ele será a paz.[a] Quando a Assíria entrar em nossa terra e pisar em nossas fortalezas,[b] levantaremos contra ela sete pastores e oito líderes dentre os homens.[c]
  to: Ele será a paz.[a] Quando a Assíria[d] entrar em nossa terra e pisar em nossas fortalezas,[b] levantaremos contra ela sete pastores e oito líderes dentre os homens.[c]
  rationale: Acrescenta-se a nota necessária para a ambiguidade real de אַשּׁוּר e ajusta-se a formulação da alternativa ligada ao demonstrativo. O texto principal permanece inalterado em sentido e estilo; o novo marcador é posto diretamente após «Assíria», o elemento a que a nota se refere.
