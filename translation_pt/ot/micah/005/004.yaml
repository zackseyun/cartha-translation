id: MIC.5.4
reference: Micah 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: pt
  text: Ele será a paz.[a] Quando a Assíria[d] entrar em nossa terra e pisar em nossas fortalezas,[b] levantaremos contra ela sete pastores e oito líderes dentre os homens.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida de modo mais formal como “Este será paz”. O sujeito retoma o governante mencionado no contexto anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “palácios”. O termo hebraico pode designar palácios reais ou fortalezas.
    reason: lexical_alternative
  - marker: c
    text: “Sete ... e oito” é uma expressão numérica hebraica que sugere uma quantidade ampla ou suficiente, embora também possa ser entendida como uma contagem literal.
    reason: cultural_note
  - marker: d
    text: Ou “o assírio”. O hebraico אַשּׁוּר pode designar a Assíria como nação ou o invasor assírio pessoalmente; neste último caso, “contra ela” seria “contra ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זֶה
  choice: Ele será
  rationale: O perfeito com conjunção tem sentido futuro no discurso profético, e o demonstrativo זֶה retoma de modo anafórico o governante mencionado no contexto anterior. O pronome pessoal produz português natural sem explicitar além do texto a identidade dele.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: “Paz” é a correspondência concisa e tradicional para שָׁלוֹם neste contexto; não exclui as ideias mais amplas de bem-estar, segurança e integridade.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: O termo pode designar a nação ou, por metonímia, o invasor assírio. O texto principal conserva o nome geopolítico, enquanto a leitura pessoal é registrada em nota.
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: Quando a Assíria entrar em nossa terra
  rationale: כִּי introduz aqui naturalmente uma circunstância temporal, e a preposição com verbo de movimento indica a entrada no território.
- source_word: וְכִי יִדְרֹךְ
  choice: e pisar
  rationale: A escolha preserva a imagem concreta de pôr os pés ou calcar, que no contexto militar implica avanço hostil, sem substituí-la diretamente por uma interpretação como “invadir”.
- source_word: בְאַרְמְנֹתֵינוּ
  choice: em nossas fortalezas
  rationale: אַרְמוֹן pode indicar palácios reais ou redutos fortificados. “Fortalezas” se ajusta ao cenário de invasão, e a alternativa “palácios” é mantida em nota.
- source_word: וַהֲקֵמֹנוּ עָלָיו
  choice: levantaremos contra ela
  rationale: O hifil de קום expressa fazer surgir ou mobilizar líderes. “Ela” concorda em português com “a Assíria”; o hebraico usa sufixo masculino singular, compatível também com a personificação do invasor.
- source_word: שִׁבְעָה רֹעִים
  choice: sete pastores
  rationale: Mantém-se a metáfora hebraica de pastores como governantes ou dirigentes.
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: e oito líderes dentre os homens
  rationale: נְסִיכִים designa chefes, príncipes ou dirigentes instituídos. “Líderes” comunica a função em português atual, e “dentre os homens” preserva a relação expressa por אָדָם sem sugerir necessariamente toda a humanidade.
theological_decisions:
- issue: Identidade do sujeito em “Ele será a paz”
  choice: O sujeito é apresentado pessoalmente como o governante retomado do contexto imediato.
  alternative: “Este será a paz” ou “Este será paz”, conservando de modo mais explícito o demonstrativo.
  rationale: Miqueias 5 fala no contexto imediato de um governante vindouro. O pronome pessoal acompanha o fluxo do discurso sem acrescentar ao versículo uma identificação doutrinária não declarada nele.
- issue: Referente de אַשּׁוּר e do pronome em עָלָיו
  choice: O texto principal apresenta a Assíria como nação e usa o pronome feminino exigido pela concordância portuguesa.
  alternative: Ler “o assírio” e, consequentemente, “contra ele”, entendendo o inimigo de forma pessoal.
  rationale: O hebraico permite tanto a referência geopolítica quanto a representação pessoal do invasor. A nota preserva essa ambiguidade real, que a concordância de gênero do português não consegue reproduzir integralmente na mesma frase.
- issue: Sentido de “sete ... e oito”
  choice: Os números são traduzidos literalmente, deixando que a nota indique sua provável força idiomática de quantidade ampla ou suficiente.
  alternative: Entender a expressão como uma contagem estritamente exata de quinze líderes.
  rationale: A formulação numérica progressiva é um recurso hebraico conhecido. Manter os números no texto evita transformar uma interpretação provável em paráfrase.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora dos “pastores” e a expressão numérica foram mantidas; termos potencialmente arcaicos como “príncipes de homens” foram evitados. Todos os marcadores aparecem junto ao elemento que explicam.
