base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: pt
  text: E ele se porá de pé e apascentará na força de Yahweh, na majestade do nome de Yahweh, seu Deus. E eles habitarão em segurança[a], pois agora[b] ele será grande até os confins da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles habitarão”. O verbo hebraico significa literalmente “habitar”, “sentar-se” ou “permanecer”; a ideia de segurança é inferida do contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “agora”. Algumas traduções usam “então” para tornar mais fluida a sequência profética, mas o advérbio hebraico é “agora”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: E ele se firmará
  rationale: עמד significa literalmente “ficar de pé” ou “permanecer”. Neste contexto régio e pastoral, “se firmará” conserva a ideia de assumir sua posição e permanecer estabelecido, em português natural, sem ampliar o sentido para “surgirá”.
- source_word: וְרָעָה
  choice: e apascentará
  rationale: רעה designa a ação de pastorear, cuidar ou alimentar o rebanho. “Apascentará” preserva tanto a imagem pastoral quanto sua conhecida dimensão régia.
- source_word: בְּעֹז יְהוָה
  choice: na força de Yahweh
  rationale: עֹז indica força ou poder, e a preposição ב pode exprimir esfera ou meio. “Na força de Yahweh” mantém a forma compacta e a imagem do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, em vez de ser substituído por um título, preservando seu caráter de nome pessoal no texto hebraico.
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: na majestade do nome de Yahweh, seu Deus
  rationale: גָּאוֹן pode denotar majestade, grandeza ou exaltação. A tradução conserva a cadeia nominal e retém explicitamente “seu Deus”, sem suavizar sua tensão teológica.
- source_word: וְיָשָׁבוּ
  choice: E eles habitarão em segurança
  rationale: ישב significa habitar, permanecer ou sentar-se. A segurança não está expressa por um termo separado, mas é fortemente sugerida pelo contexto; por isso ela é explicitada no texto e sinalizada em nota.
- source_word: כִּי עַתָּה
  choice: pois agora
  rationale: כִּי introduz a razão, e עַתָּה significa normalmente “agora”. A tradução preserva a referência temporal hebraica, embora “então” pudesse tornar mais linear a sequência profética.
- source_word: יִגְדַּל
  choice: ele será grande
  rationale: גדל aqui comunica grandeza ou exaltação. “Será grande” é natural e evita sugerir necessariamente um processo gradual de crescimento.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: até os confins da terra
  rationale: A expressão designa as extremidades ou regiões mais distantes da terra. “Até os confins da terra” é uma formulação idiomática, digna e precisa em português.
theological_decisions:
- issue: Referente dos verbos e pronomes no singular
  choice: O sujeito é mantido apenas como “ele”, remetendo ao governante prometido no contexto anterior.
  alternative: Acrescentar explicitamente “o Messias”, “o Cristo”, “o rei” ou “o governante davídico”.
  rationale: O contexto imediato identifica um governante vindouro, mas este versículo contém somente formas verbais e pronominais de terceira pessoa. Não se acrescenta um título interpretativo que o hebraico não explicita aqui.
- issue: Relação de אֱלֹהָיו com o governante
  choice: Manter literalmente “seu Deus”.
  alternative: Parafrasear ou omitir a expressão para evitar possível tensão cristológica.
  rationale: O hebraico diz expressamente “Yahweh, seu Deus”. A tradução conserva essa formulação e não resolve por paráfrase as questões teológicas que ela possa suscitar.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Apascentará” preserva a imagem pastoral e régia sem soar excessivamente técnico; “confins da terra” mantém uma expressão bíblica ainda compreensível. A pontuação em “Yahweh, seu Deus” esclarece a aposição sem alterar o conteúdo.
