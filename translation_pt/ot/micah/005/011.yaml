  text: וְ/הִכְרַתִּ֥י כְשָׁפִ֖ים מִ/יָּדֶ֑/ךָ וּֽ/מְעוֹנְנִ֖ים לֹ֥א יִֽהְיוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: pt
  text: E eliminarei da sua mão as feitiçarias[a], e você não terá mais adivinhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as práticas de magia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “intérpretes de presságios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: E eliminarei
  rationale: O hifil de כרת expressa a ação de cortar, suprimir ou eliminar. “Eliminarei” comunica com naturalidade a remoção completa anunciada por Deus.
- source_word: כְשָׁפִים
  choice: as feitiçarias
  rationale: O substantivo plural designa práticas de magia condenadas no contexto. “Feitiçarias” é claro em português e mantém a referência às práticas, sem restringi-las a um método específico.
- source_word: מִיָּדֶךָ
  choice: da sua mão
  rationale: A tradução conserva a imagem hebraica da mão como esfera de posse, controle ou prática, em vez de substituí-la silenciosamente por “do seu meio”.
- source_word: וּמְעוֹנְנִים
  choice: adivinhos
  rationale: O particípio designa praticantes de adivinhação, possivelmente observadores ou intérpretes de sinais e presságios. “Adivinhos” é uma designação ampla e compreensível, enquanto a nota preserva a possibilidade mais específica.
- source_word: לֹא יִהְיוּ לָךְ
  choice: você não terá mais
  rationale: A construção literal “não haverá para você” indica que tais praticantes deixarão de estar à disposição ou entre o povo. “Não terá mais” transmite naturalmente esse resultado e torna explícita a cessação implícita no anúncio.
theological_decisions:
- issue: Natureza das práticas condenadas
  choice: O texto apresenta práticas mágicas e seus praticantes como realidades que Deus eliminará do povo.
  alternative: מְעוֹנְנִים pode ser entendido mais especificamente como observadores ou intérpretes de sinais e presságios.
  rationale: A redação principal mantém a denúncia ampla do ocultismo sem identificar de forma indevidamente estreita o método de adivinhação; a nota registra a nuance lexical possível.
- issue: Imagem da mão
  choice: Manter “da sua mão”.
  alternative: Traduzir idiomaticamente como “do seu meio” ou “de entre vocês”.
  rationale: A imagem hebraica pode envolver posse, controle ou prática. Preservá-la evita resolver uma metáfora que o texto deixa aberta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O singular “você” representa o destinatário coletivo personificado no hebraico. A expressão “da sua mão” foi mantida deliberadamente para preservar a imagem do texto-fonte.
