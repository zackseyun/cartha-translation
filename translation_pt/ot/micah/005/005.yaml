source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: pt
  text: Eles pastorearão a terra da Assíria com a espada e a terra de Ninrode em suas entradas[a]. Ele nos livrará da Assíria[b] quando ele entrar em nossa terra e quando pisar em nosso território.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seus portões”. O hebraico diz literalmente “em suas entradas” ou “em suas aberturas”, não usando a palavra habitual para “portão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do assírio”. O hebraico pode designar a Assíria como nação ou personificá-la como o inimigo invasor; os verbos seguintes estão no masculino singular.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: Eles pastorearão
  rationale: Preserva o sentido básico de רעה, “pastorear”, e a imagem pastoral ligada ao governante no contexto, embora aqui a espada dê à ação o sentido de domínio militar.
- source_word: אֶרֶץ אַשּׁוּר
  choice: a terra da Assíria
  rationale: Mantém tanto o elemento territorial de אֶרֶץ quanto a repetição da construção “terra de”.
- source_word: בַּחֶרֶב
  choice: com a espada
  rationale: Expressa naturalmente o uso instrumental da preposição ב e conserva a imagem militar concreta.
- source_word: אֶרֶץ נִמְרֹד
  choice: a terra de Ninrode
  rationale: Mantém a alusão geográfica e tradicional do nome próprio sem substituí-la por uma identificação interpretativa.
- source_word: בִּפְתָחֶיהָ
  choice: em suas entradas
  rationale: פתח designa abertura ou entrada; a tradução evita substituí-lo pelo termo hebraico mais específico para “portão”.
- source_word: וְהִצִּיל
  choice: Ele nos livrará
  rationale: O hifil de נצל significa “livrar, resgatar”. O objeto “nos” está elíptico no hebraico, mas é recuperado naturalmente do discurso em primeira pessoa plural e torna a frase idiomática em português.
- source_word: מֵאַשּׁוּר
  choice: da Assíria
  rationale: Conserva no texto principal o nome nacional/geográfico usado anteriormente, sem excluir a possível personificação do poder invasor.
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: quando ela entrar em nossa terra
  rationale: כִּי é entendido temporalmente. O pronome feminino segue o gênero gramatical de “Assíria” em português; a forma verbal hebraica masculina e a leitura “o assírio” são registradas em nota.
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: e quando pisar dentro de nossas fronteiras
  rationale: Preserva a imagem concreta de דרך, “pisar”, enquanto o plural idiomático “fronteiras” comunica a região delimitada por גבול.
theological_decisions:
- issue: Mudança de sujeito do plural para o singular
  choice: Manter “Eles pastorearão ... Ele nos livrará”
  alternative: Harmonizar todo o versículo com sujeito plural ou singular
  rationale: O hebraico passa deliberadamente da ação plural para um libertador singular. A tradução conserva essa tensão em vez de identificar ou fundir os sujeitos.
- issue: Referente de אַשּׁוּר na oração de livramento e invasão
  choice: Usar “Assíria” no texto principal
  alternative: “o assírio”
  rationale: O contexto emprega linguagem territorial, mas também permite personificar a potência invasora. A leitura nacional fica no texto, e a leitura pessoal é preservada em nota.
- issue: Objeto implícito de וְהִצִּיל
  choice: Explicitar “nos”
  alternative: “Ele livrará” sem objeto expresso
  rationale: Embora o hebraico não expresse o objeto nessa forma verbal, o contexto em primeira pessoa plural (“nossa terra”, “nossas fronteiras”) o torna claro; a explicitação produz português natural sem definir a identidade do libertador.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a metáfora incomum de “pastorear com a espada” e a mudança de sujeito do plural para o singular, sem suavizar a tensão do hebraico.
