  text: וְ/עָשִׂ֜יתִי בְּ/אַ֧ף וּ/בְ/חֵמָ֛ה נָקָ֖ם אֶת הַ/גּוֹיִ֑ם אֲשֶׁ֖ר לֹ֥א שָׁמֵֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/014.yaml
  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: pt
  text: E executarei vingança, com ira e furor, contra as nações que não escutaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não obedeceram” ou “não deram ouvidos”. O verbo hebraico pode indicar tanto escutar quanto responder com obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: E executarei
  rationale: O verbo עשה é amplo, mas, com נָקָם como objeto, forma a ideia idiomática de executar ou realizar vingança. “Executarei” é natural e conserva o tom judicial.
- source_word: בְּאַף
  choice: com ira
  rationale: אַף significa literalmente “nariz”, mas aqui é um termo idiomático para ira. A preposição בְּ é expressa naturalmente por “com” neste contexto.
- source_word: וּבְחֵמָה
  choice: e furor
  rationale: חֵמָה intensifica a expressão anterior. “Furor” distingue o termo de “ira” e mantém a força da linguagem profética.
- source_word: נָקָם
  choice: vingança
  rationale: נָקָם denota vingança ou ato de vingar, sobretudo no contexto do juízo divino. “Vingança” preserva o caráter retributivo mais diretamente que “castigo”.
- source_word: אֶת הַגּוֹיִם
  choice: contra as nações
  rationale: אֶת marca o objeto direto, mas em português a expressão idiomática “executar vingança” pede naturalmente “contra” para indicar o alvo.
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: que não escutaram
  rationale: שׁמע pode significar ouvir, escutar, dar ouvidos ou obedecer. “Não escutaram” preserva o sentido lexical básico e deixa implícita a recusa em atender, sem resolver a ambiguidade.
theological_decisions:
- issue: Sentido de שָׁמֵעוּ em relação às nações julgadas
  choice: não escutaram
  alternative: não obedeceram; não deram ouvidos
  rationale: O verbo hebraico pode abranger tanto ouvir quanto responder obedientemente. A formulação principal preserva essa tensão sem restringir o sentido à mera percepção sonora nem explicitar apenas a obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ira e furor” mantém o paralelismo intensificador profético; as vírgulas destacam a maneira pela qual a vingança é executada.
