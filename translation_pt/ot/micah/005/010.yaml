  text: וְ/הִכְרַתִּ֖י עָרֵ֣י אַרְצֶ֑/ךָ וְ/הָרַסְתִּ֖י כָּל מִבְצָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: pt
  text: Eliminarei as cidades da tua terra e derrubarei todas as tuas fortalezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Eliminarei
  rationale: O hifil de כרת expressa aqui a remoção das cidades. Em português, «eliminarei» comunica de modo natural e vigoroso o sentido de fazê-las desaparecer, sem sugerir literalmente o corte físico de uma cidade.
- source_word: עָרֵי
  choice: as cidades
  rationale: עִיר designa normalmente uma cidade; o plural definido pelo sufixo subsequente é vertido naturalmente como «as cidades».
- source_word: אַרְצֶךָ
  choice: da sua terra
  rationale: אֶרֶץ, neste contexto territorial, é bem representado por «terra». A forma «sua» mantém leitura natural e ampla em português moderno.
- source_word: וְהָרַסְתִּי
  choice: e derrubarei
  rationale: הרס significa derrubar ou demolir. «Derrubarei» preserva a imagem concreta de desmantelar estruturas defensivas e é corrente em português.
- source_word: כָּל
  choice: todas
  rationale: כָּל com o substantivo plural sufixado tem sentido abrangente; «todas» concorda naturalmente com «fortalezas».
- source_word: מִבְצָרֶיךָ
  choice: as suas fortalezas
  rationale: מִבְצָר designa lugares fortificados ou fortalezas. «Fortalezas» é claro, digno e conserva o sentido militar e defensivo.
