  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: pt
  text: Mas você, Belém Efrata, pequena demais para estar entre os clãs de Judá[a], de você sairá para mim aquele que será governante em Israel, cujas saídas remontam à antiguidade, aos dias da eternidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pequena entre os milhares de Judá”. Aqui, “milhares” pode designar as divisões tribais ou os clãs de Judá.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cujas origens remontam a tempos antigos, aos dias de outrora”. O hebraico também pode ser entendido em sentido mais forte, como apontando para existência “desde a eternidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: Belém Efrata
  rationale: Mantém os dois nomes do lugar, distinguindo esta Belém de outras e preservando a especificidade do hebraico.
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: pequena demais para estar entre os clãs de Judá
  rationale: A construção com לִהְיוֹת favorece a ideia de ser pequena demais para figurar entre as divisões de Judá. אַלְפֵי significa literalmente “milhares”, mas aqui pode designar agrupamentos tribais ou clãs.
- source_word: מִמְּךָ לִי יֵצֵא
  choice: de você sairá para mim
  rationale: Preserva tanto o movimento concreto expresso por יֵצֵא como o dativo לִי, sem explicitar além do texto a natureza da relação ou comissão divina.
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: ser governante em Israel
  rationale: “Governante” expressa מוֹשֵׁל, e “em Israel” acompanha de perto a preposição בְּ sem prejudicar a naturalidade em português.
- source_word: מוֹצָאֹתָיו
  choice: cujas saídas
  rationale: A escolha formalmente transparente conserva as conotações verbais e o plural do termo, evitando decidir no texto principal se ele significa estritamente “origens”. A alternativa mais idiomática é registrada em nota.
- source_word: מִקֶּדֶם
  choice: desde a antiguidade
  rationale: No contexto temporal, קֶדֶם aponta para tempos remotos; a formulação é natural em português e não força por si só uma afirmação metafísica.
- source_word: מִימֵי עוֹלָם
  choice: desde os dias da eternidade
  rationale: A expressão mantém a amplitude de עוֹלָם, que pode indicar antiguidade remota, duração indefinida ou eternidade, preservando a tensão do hebraico.
theological_decisions:
- issue: Se a cláusula final afirma explicitamente preexistência eterna ou fala de uma origem histórica muito antiga
  choice: cujas saídas vêm desde a antiguidade, desde os dias da eternidade
  alternative: cujas origens remontam a tempos antigos, aos dias de outrora
  rationale: O texto hebraico admite desde uma referência a origens remotas até uma leitura mais forte ligada à eternidade. A redação principal preserva essa tensão, sem reduzir a frase a mera antiguidade nem tornar explícita uma conclusão dogmática além do hebraico.
translation_notes:
  register: Português atual, digno e acessível, com “você” para a interpelação direta à cidade e construções naturais para leitores brasileiros. Conservou-se deliberadamente a expressão incomum “cujas saídas” por sua transparência em relação ao hebraico e por sua importância interpretativa; a leitura idiomática “origens” aparece em nota.
