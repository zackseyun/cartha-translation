id: MIC.5.2
reference: Micah 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: pt
  text: Por isso, ele os entregará[a] até o tempo em que aquela que está em trabalho de parto der à luz[b]. Então, o restante dos irmãos dele voltará para os filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os deixará à mercê” ou “os abandonará”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico não identifica explicitamente “aquela que está em trabalho de parto”. Ela é entendida de várias maneiras: como Sião ou Judá personificada, como a mãe do governante prometido ou como outra figura.'
    reason: alternative_reading
  - marker: c
    text: Ou “os descendentes de Israel” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a inferência em relação ao contexto anterior, preservando a ligação lógica.
- source_word: יִתְּנֵם
  choice: ele os entregará
  rationale: O verbo נתן com sufixo de terceira pessoa masculina plural tem aqui o sentido idiomático de entregar ou deixar à mercê; a formulação preserva o caráter judicial sem afirmar abandono definitivo.
- source_word: עַד עֵת
  choice: até o tempo em que
  rationale: Mantém a referência explícita ao tempo e introduz naturalmente a oração temporal em português.
- source_word: יוֹלֵדָה יָלָדָה
  choice: aquela que está em trabalho de parto der à luz
  rationale: Preserva a referência feminina não identificada do particípio e apresenta o parto como o acontecimento que encerra o período mencionado.
- source_word: וְיֶתֶר
  choice: Então, o restante
  rationale: Traduz a ideia dos que restam sem empregar 'remanescente', termo que poderia adquirir um sentido teológico técnico não exigido pelo substantivo.
- source_word: אֶחָיו
  choice: dos irmãos dele
  rationale: Conserva o termo familiar masculino e sua possível relação com o governante do contexto, sem interpretá-lo como simples referência genérica a compatriotas.
- source_word: יְשׁוּבוּן
  choice: voltará
  rationale: O verbo שוב indica retorno; a concordância no singular com o coletivo português 'o restante' produz uma frase natural, enquanto o sentido plural permanece implícito.
- source_word: עַל
  choice: para
  rationale: Com o verbo de retorno e um grupo humano como destino, 'para' comunica de forma clara o movimento ou a reintegração, sem o obscuro literalismo de 'sobre'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica, mantendo a forma masculina e a designação tradicional de Israel.
theological_decisions:
- issue: Identidade daquela que está em trabalho de parto
  choice: Não identificada no texto principal
  alternative: Sião/Judá personificada, a mãe do governante prometido ou uma figura histórica mais imediata
  rationale: O hebraico não identifica explicitamente a mulher; manter a referência aberta preserva a ambiguidade e evita impor uma interpretação teológica específica.
- issue: Alcance de 'os irmãos dele'
  choice: Mantida a relação familiar sem expansão interpretativa
  alternative: Compatriotas israelitas, parentes do governante futuro ou integrantes da nação dividida que voltam a se unir
  rationale: Embora o contexto associe provavelmente o pronome ao governante mencionado, o versículo não define com maior precisão a relação.
- issue: Sentido do retorno
  choice: Traduzido simplesmente como retorno aos filhos de Israel
  alternative: Reunião política, retorno geográfico ou restauração da aliança
  rationale: O verbo שוב pode carregar mais de uma ressonância; a tradução evita restringi-lo a apenas uma delas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe evita arcaísmos, mantém a mulher não identificada e conserva as expressões familiares do hebraico sem impor uma interpretação denominacional.
