  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה וְ/הִכְרַתִּ֥י סוּסֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הַאֲבַדְתִּ֖י מַרְכְּבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: pt
  text: 'E acontecerá naquele dia — declara Yahweh —: eliminarei do seu meio[a] os seus cavalos e destruirei os seus carros de guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre vocês”.'
    reason: Alternativa lexical para מִקִּרְבֶּךָ, literalmente relacionado ao que está no interior ou no meio da comunidade.
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula hebraica que introduz um acontecimento futuro, em português natural e solene.
- source_word: בַיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente corrente da fórmula temporal profética, sem definir além do texto a natureza exata desse dia.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força solene da fórmula profética de pronunciamento divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O hifil de כרת indica remoção decisiva; “eliminarei” comunica esse sentido com naturalidade, sem a estranheza de um decalque como “cortarei” neste contexto.
- source_word: סוּסֶיךָ
  choice: os seus cavalos
  rationale: Reproduz o plural com sufixo de segunda pessoa, dirigido coletivamente ao povo.
- source_word: מִקִּרְבֶּךָ
  choice: do seu meio
  rationale: Expressa de modo direto a remoção de dentro da comunidade e conserva a forma coletiva singular do hebraico.
- source_word: וְהַאֲבַדְתִּי
  choice: destruirei
  rationale: 'Traduz o valor causativo do hifil de אבד: fazer perecer ou destruir.'
- source_word: מַרְכְּבֹתֶיךָ
  choice: os seus carros de guerra
  rationale: “Carros de guerra” identifica naturalmente em português moderno os veículos militares antigos, evitando que “carros” seja entendido como automóveis.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido da eliminação dos cavalos e carros de guerra
  choice: Declaração concreta de que Deus removerá recursos militares
  alternative: Condenação explícita da confiança no poder militar; purificação explícita da dependência da guerra
  rationale: O contexto pode sugerir essas implicações, mas o versículo apenas declara a ação. A tradução não introduz uma interpretação teológica além do que está expresso.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A colocação do marcador foi ajustada para acompanhar a expressão hebraica à qual a nota lexical pertence. Os travessões destacam a fórmula profética sem alterar a sintaxe básica.
