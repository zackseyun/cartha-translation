base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: pt
  text: Eliminarei do seu meio as suas imagens esculpidas e as suas colunas sagradas[a], e você não mais se prostrará diante da obra das suas mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas pedras erguidas”. O termo hebraico designa pedras ou colunas levantadas em contextos de culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “você não mais adorará aquilo que as suas mãos fizeram”. O hebraico descreve mais literalmente o ato de se prostrar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Eliminarei
  rationale: O hifil de כרת expressa a retirada decisiva ou destruição. Em português, “eliminarei” comunica naturalmente o sentido de remover por completo, sem exigir a reprodução literal do idioma “cortar”.
- source_word: פְסִילֶיךָ
  choice: as suas imagens esculpidas
  rationale: פֶּסֶל designa uma imagem moldada por entalhe, normalmente cultual. A tradução preserva a concretude do termo sem recorrer ao vocábulo mais genérico “ídolos”.
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: as suas colunas sagradas
  rationale: מַצֵּבָה refere-se a uma pedra erguida ou coluna de função cultual. “Colunas sagradas” torna explícito esse caráter, evitando que o leitor entenda meros elementos arquitetônicos.
- source_word: מִקִּרְבֶּךָ
  choice: do seu meio
  rationale: Reproduz de modo natural a imagem hebraica de retirar esses objetos de dentro da comunidade ou do território personificado.
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: e você não mais se prostrará
  rationale: O verbo שׁחה denota curvar-se ou prostrar-se, frequentemente como ato de culto. “Prostrar-se” conserva tanto o gesto físico quanto sua dimensão religiosa.
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: diante da obra das suas mãos
  rationale: Mantém a expressão concreta e polemicamente carregada para aquilo que os próprios seres humanos fabricaram. “Diante de” é a regência portuguesa natural para o ato de prostrar-se perante algo.
theological_decisions:
- issue: Tradução dos objetos cultuais condenados
  choice: Manter a distinção entre “imagens esculpidas” e “colunas sagradas”.
  alternative: Resumir os dois objetos como “ídolos” ou traduzir o segundo apenas como “colunas”.
  rationale: O hebraico nomeia duas categorias distintas de objetos de culto ilícito. Preservar essa distinção mantém a precisão da denúncia e “sagradas” esclarece a função cultual das colunas.
- issue: Sentido da oração final
  choice: “você não mais se prostrará diante da obra das suas mãos”
  alternative: “você não mais adorará a obra das suas mãos”
  rationale: A tradução escolhida preserva o gesto físico expresso pelo verbo hebraico e, no contexto, também comunica seu sentido de adoração, sem reduzir a imagem a uma formulação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. O singular “você” acompanha o destinatário coletivo personificado no hebraico. A ordem dos marcadores foi normalizada para que cada nota apareça junto à expressão pertinente.
