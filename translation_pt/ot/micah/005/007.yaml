  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: pt
  text: E o remanescente de Jacó estará entre as nações, no meio de muitos povos, como um leão entre os animais da floresta[a], como um leão jovem entre os rebanhos de ovelhas, o qual, se passar[b], pisoteia e despedaça, e não há quem possa livrar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “feras da floresta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando passar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... estará
  rationale: O waw seguido da forma verbal introduz aqui um resultado futuro no discurso profético. “Estará” expressa com clareza essa orientação futura.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: o remanescente de Jacó
  rationale: “Remanescente” é a expressão profética consolidada para o grupo sobrevivente, sem ampliar o sentido do hebraico.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui nações ou povos. “Nações” é natural e evita introduzir a distinção posterior sugerida por “gentios”.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: no meio de muitos povos
  rationale: Preserva o sentido espacial de בְּקֶרֶב e o paralelismo com “entre as nações”.
- source_word: בְּבַהֲמוֹת יַעַר
  choice: entre os animais da floresta
  rationale: “Animais” comunica de forma corrente o sentido de בְּהֵמוֹת; “da floresta” mantém a relação nominal do hebraico. A alternativa mais vívida “feras” é registrada em nota.
- source_word: כִּכְפִיר
  choice: como um leão novo
  rationale: כְּפִיר indica um leão jovem e vigoroso; “leão novo” é claro e preserva a imagem sem sugerir necessariamente um filhote pequeno.
- source_word: בְּעֶדְרֵי צֹאן
  choice: entre os rebanhos de ovelhas
  rationale: עֶדְרֵי צֹאן descreve rebanhos de animais de pequeno porte, aqui naturalmente entendidos como ovelhas na imagem de presa.
- source_word: אֲשֶׁר אִם עָבַר
  choice: que, se passar por eles
  rationale: Mantém o valor condicional de אִם e liga naturalmente em português a ação do leão aos rebanhos; a possível leitura temporal é preservada em nota.
- source_word: וְרָמַס וְטָרַף
  choice: pisoteia e despedaça
  rationale: “Pisoteia” reproduz a ação de esmagar sob os pés, e “despedaça” expressa a ação predatória de rasgar a presa.
- source_word: וְאֵין מַצִּיל
  choice: e não há quem possa livrar
  rationale: Reproduz o idioma hebraico que afirma a inexistência de qualquer libertador ou resgatador, sem explicitar um objeto ausente no texto.
theological_decisions:
- issue: A imagem do remanescente como leão entre as nações
  choice: Manter a metáfora de força irresistível e domínio sem definir o modo específico de seu cumprimento.
  alternative: Interpretá-la exclusivamente como conquista militar ou apenas como influência simbólica.
  rationale: O hebraico apresenta uma imagem de domínio predatório, mas não determina se seu cumprimento é militar, político ou escatológico em sentido mais restrito.
- issue: Valor de אִם na ação do leão
  choice: Preservar a formulação condicional “se passar”.
  alternative: Traduzir temporalmente como “quando passar”.
  rationale: אִם permite uma formulação condicional, enquanto o contexto também admite uma situação típica ou esperada; a nota conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e as duas comparações leoninas foram preservadas, evitando tanto arcaísmos desnecessários quanto explicações doutrinárias inseridas no versículo.
