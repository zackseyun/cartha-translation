source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: pt
  text: 'E eu disse: “Ouçam agora, chefes de Jacó e governantes da casa de Israel: não cabe a vocês conhecer a justiça[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “julgamento”. O hebraico *mishpat* pode indicar julgamento legal, justiça ou aquilo que é correto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O waw consecutivo dá continuidade ao discurso. “E eu disse” preserva essa ligação narrativa sem impor uma sequência estritamente temporal.
- source_word: שִׁמְעוּ נָא
  choice: Ouçam agora
  rationale: O imperativo plural exige atenção, e נָא acrescenta urgência ou insistência. “Agora” comunica melhor essa força profética do que uma fórmula moderna de cortesia.
- source_word: רָאשֵׁי יַעֲקֹב
  choice: chefes de Jacó
  rationale: “Chefes” conserva a metáfora hebraica de רֹאשׁ para líderes, permanece natural em português e mantém “Jacó” como designação pactual do povo.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: e governantes da casa de Israel
  rationale: קָצִין designa dirigente, governante ou autoridade. “Governantes” se ajusta à responsabilidade cívica e judicial do contexto; “casa de Israel” preserva a expressão nacional e pactual.
- source_word: הֲלוֹא לָכֶם
  choice: Não cabe a vocês
  rationale: A pergunta com הֲלוֹא espera resposta afirmativa, e a construção com לְ expressa responsabilidade ou dever. “Não cabe a vocês” transmite isso de modo idiomático.
- source_word: לָדַעַת
  choice: conhecer
  rationale: יָדַע significa fundamentalmente “conhecer”. Aqui inclui compreensão prática e reconhecimento do que a função dos líderes exige, sem que seja necessário explicitar isso no texto.
- source_word: הַמִּשְׁפָּט
  choice: a justiça
  rationale: מִשְׁפָּט pode indicar julgamento, decisão judicial, justiça ou aquilo que é correto. Nesta repreensão a autoridades, “justiça” comunica melhor a dimensão ética e judicial.
theological_decisions:
- issue: Sentido de מִשְׁפָּט no contexto da responsabilidade dos líderes
  choice: justiça
  alternative: julgamento
  rationale: O contexto censura líderes que deveriam conhecer e exercer o que é justo. “Justiça” abrange a responsabilidade pública, ética e judicial, enquanto a nota preserva a alternativa lexical legítima “julgamento”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as designações bíblicas “Jacó” e “casa de Israel”, além da pergunta retórica e da metáfora de liderança em “chefes”.
