id: MIC.3.11
reference: Micah 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: pt
  text: 'Seus líderes julgam por suborno, seus sacerdotes ensinam por pagamento, e seus profetas praticam adivinhação por dinheiro. Mesmo assim, apoiam-se em Yahweh[a], dizendo: “Yahweh não está no nosso meio? Nenhuma desgraça virá sobre nós”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiam em Yahweh”. O verbo hebraico traz a imagem de apoiar-se em alguém para obter sustentação.
    reason: lexical_alternative
  - marker: b
    text: Ou “Nenhuma calamidade virá sobre nós”. A palavra hebraica pode significar “mal” em sentido amplo, mas aqui se refere à desgraça ou ao desastre resultante do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: seus líderes
  rationale: O plural de רֹאשׁ com sufixo feminino singular designa as autoridades da cidade ou comunidade; “líderes” comunica o sentido idiomático sem o literalismo obscuro de “cabeças”.
- source_word: בְּשֹׁחַד
  choice: por suborno
  rationale: שֹׁחַד é um suborno; a preposição indica a vantagem corrupta em troca da qual os líderes julgam.
- source_word: יִשְׁפֹּטוּ
  choice: julgam
  rationale: שׁפט refere-se aqui ao exercício judicial das autoridades civis.
- source_word: כֹהֲנֶיהָ
  choice: seus sacerdotes
  rationale: Tradução direta que preserva o paralelismo entre líderes, sacerdotes e profetas.
- source_word: בִּמְחִיר
  choice: por pagamento
  rationale: מְחִיר denota preço ou pagamento; a escolha deixa claro que a instrução sacerdotal foi comercializada.
- source_word: יוֹרוּ
  choice: ensinam
  rationale: A forma hifil de ירה descreve a instrução, particularmente a instrução sacerdotal; “ensinam” é natural e suficientemente abrangente.
- source_word: נְבִיאֶיהָ
  choice: seus profetas
  rationale: Tradução direta, mantendo a tríade de ofícios corruptos.
- source_word: בְּכֶסֶף
  choice: por dinheiro
  rationale: כֶּסֶף significa literalmente “prata”, mas frequentemente designa dinheiro; neste contexto comercial, “dinheiro” é a expressão portuguesa mais natural.
- source_word: יִקְסֹמוּ
  choice: praticam adivinhação
  rationale: קסם refere-se à busca de revelação por adivinhação; a formulação explícita evita ambiguidades.
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: Mesmo assim, apoiam-se em Yahweh
  rationale: O nifal de שׁען traz a imagem de apoiar-se em alguém. “Mesmo assim” explicita o contraste irônico entre a corrupção descrita e a alegada confiança em Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲלוֹא
  choice: não está
  rationale: Na pergunta retórica, הֲלוֹא espera resposta afirmativa e expressa a falsa segurança dos falantes.
- source_word: רָעָה
  choice: desgraça
  rationale: Neste contexto, רָעָה designa calamidade ou desastre vindouro, e não maldade moral.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem convertê-lo em título.
- issue: Sentido de רָעָה na cláusula final
  choice: desgraça
  alternative: mal; calamidade; desastre
  rationale: Os líderes negam que o juízo calamitoso os alcance. “Desgraça” preserva a amplitude do dano anunciado sem sugerir especificamente mal moral.
- issue: Contraste introduzido por וְ
  choice: Mesmo assim
  alternative: e
  rationale: Embora וְ costume significar “e”, aqui liga a corrupção dos dirigentes à sua confiança religiosa presunçosa; a tradução contrastiva torna explícita a ironia contextual sem alterar a proposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo das três classes dirigentes foi preservado. “Por suborno”, “por pagamento” e “por dinheiro” reproduzem a progressão retórica, enquanto “apoiam-se” conserva a metáfora hebraica.
