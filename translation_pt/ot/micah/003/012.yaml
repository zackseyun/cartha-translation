  text: לָ/כֵן֙ בִּ/גְלַלְ/כֶ֔ם צִיּ֖וֹן שָׂדֶ֣ה תֵֽחָרֵ֑שׁ וִ/ירוּשָׁלִַ֨ם֙ עִיִּ֣ין תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: pt
  text: Por isso, por causa de vocês, Sião será arada como um campo; Jerusalém se tornará ruínas, e o monte do templo[a] se transformará em elevações cobertas de floresta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o monte da casa”; isto é, do templo. Ou “o monte do santuário”.
    reason: lexical_alternative
  - marker: b
    text: Ou “lugares altos de floresta” ou “alturas de floresta”. A expressão provavelmente retrata o monte do templo abandonado, selvagem e tomado pela vegetação.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural a consequência dos pecados dos líderes denunciados no contexto anterior e mantém a força do anúncio de juízo.
- source_word: בִּגְלַלְכֶם
  choice: por causa de vocês
  rationale: Atribui diretamente aos destinatários a responsabilidade pelo juízo, em português atual e claro.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome do lugar em português.
- source_word: שָׂדֶה תֵחָרֵשׁ
  choice: será arada como um campo
  rationale: Preserva a voz passiva e a imagem agrícola de Sião reduzida a terreno lavrável.
- source_word: עִיִּין תִּהְיֶה
  choice: se tornará um monte de ruínas
  rationale: Expressa tanto a transformação anunciada quanto a imagem concreta de escombros amontoados.
- source_word: הַר הַבַּיִת
  choice: o monte da Casa
  rationale: Mantém a expressão hebraica, na qual “a Casa” designa o templo, sem tornar explícita no texto principal uma interpretação que o original deixa implícita.
- source_word: לְבָמוֹת יָעַר
  choice: em elevações cobertas de mata
  rationale: Comunica a imagem topográfica de abandono e vegetação selvagem sugerida por “elevações” e “floresta”, sem impor necessariamente o sentido cultual de “lugares altos”.
theological_decisions:
- issue: Explicitar הַבַּיִת como “templo” no texto principal
  choice: Manter “a Casa” em “o monte da Casa”
  alternative: o monte do templo; o monte do santuário
  rationale: “A Casa” é uma designação hebraica do templo, mas a formulação mais literal preserva a dicção profética e sua ressonância; a identificação é esclarecida em nota.
- issue: Entender בָּמוֹת com sentido cultual ou topográfico
  choice: elevações cobertas de mata
  alternative: lugares altos de uma floresta; alturas de floresta
  rationale: Neste contexto de devastação, יָעַר orienta a expressão para a imagem de terreno selvagem e tomado pela vegetação. A alternativa lexical é mantida em nota, pois בָּמוֹת pode significar “lugares altos”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A construção paralela conserva a progressão do juízo profético; “vocês” comunica diretamente a acusação do plural hebraico.
