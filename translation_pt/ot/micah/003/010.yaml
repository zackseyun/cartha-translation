base_translation:
  language: en
  yaml_path: translation/ot/micah/003/010.yaml
  text: who builds Zion with bloodshed and Jerusalem with injustice[a].
translation:
  language: pt
  text: que constroem Sião com derramamento de sangue e Jerusalém com injustiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sangue”; o plural hebraico muitas vezes se refere idiomaticamente a derramamento de sangue ou culpa de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּנֶה
  choice: que constroem
  rationale: O particípio masculino singular descreve coletivamente os líderes denunciados nos versículos anteriores. Em português, o plural retoma naturalmente os chefes e governantes de 3.9, sem alterar o referente contextual.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: בְּדָמִים
  choice: com derramamento de sangue
  rationale: O plural hebraico דָּמִים frequentemente designa derramamento de sangue ou culpa de sangue. A expressão escolhida comunica de modo natural os meios violentos empregados.
- source_word: וִירוּשָׁלִַם
  choice: e Jerusalém
  rationale: Mantém a conjunção e usa a forma consagrada do nome próprio em português.
- source_word: בְּעַוְלָה
  choice: com injustiça
  rationale: עַוְלָה indica injustiça, perversidade ou ação errada; 'injustiça' se ajusta à denúncia social e judicial do contexto e é clara em português atual.
theological_decisions:
- issue: Natureza da acusação na retórica profética
  choice: Os líderes edificam ou consolidam Sião e Jerusalém por meios violentos e injustos.
  alternative: Traduzir literalmente 'com sangues', deixando o idioma hebraico sem explicação no corpo do texto.
  rationale: Neste contexto, o plural hebraico aponta para derramamento de sangue ou culpa de sangue, não para sangue usado literalmente como material de construção. A tradução preserva a força da acusação profética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção no plural liga este fragmento de modo natural aos líderes mencionados no contexto imediato.
