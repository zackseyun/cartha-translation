  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: pt
  text: Mas eu, ao contrário, estou cheio de poder, do Espírito de Yahweh, de justiça e de força[a], para declarar a Jacó sua transgressão[b] e a Israel seu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estou cheio de poder pelo Espírito de Yahweh, e de justiça e força”. A sequência hebraica pode enumerar aquilo de que o profeta está cheio ou indicar que o Espírito de Yahweh é a fonte desse poder.'
    reason: alternative_reading
  - marker: b
    text: “Transgressão” também pode ser traduzido como “rebelião”, ressaltando a atitude de desafio contra Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: Mas eu, ao contrário
  rationale: Expressa o forte contraste com os líderes e profetas corruptos mencionados anteriormente e preserva a ênfase do pronome אָנֹכִי.
- source_word: מָלֵאתִי
  choice: estou cheio
  rationale: 'O perfeito hebraico descreve adequadamente um estado presente resultante: o profeta se encontra plenamente capacitado.'
- source_word: כֹחַ
  choice: poder
  rationale: No contexto, designa a capacitação necessária para o ministério profético, não apenas força física.
- source_word: אֶת רוּחַ יְהוָה
  choice: do Espírito de Yahweh
  rationale: Apresenta o Espírito de Deus como conteúdo da plenitude do profeta, mantendo em nota a possibilidade de entendê-lo como a fonte do poder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Comunica aqui o discernimento moral e judicial necessário para denunciar publicamente o mal.
- source_word: גְבוּרָה
  choice: força
  rationale: Transmite a firme capacidade de enfrentar o pecado e complementa 'poder' sem introduzir uma qualidade ausente do hebraico.
- source_word: לְהַגִּיד
  choice: para declarar
  rationale: Reflete a finalidade da capacitação e o caráter público e solene da proclamação profética.
- source_word: פִּשְׁעוֹ
  choice: sua transgressão
  rationale: Preserva a gravidade de פֶּשַׁע, que pode designar uma violação deliberada ou rebelião contra Deus.
- source_word: חַטָּאתוֹ
  choice: seu pecado
  rationale: É o equivalente amplo e natural para o termo hebraico, preservando o paralelismo com 'transgressão'.
theological_decisions:
- issue: Se רוּחַ יְהוָה designa o Espírito de Deus ou apenas um impulso divino impessoal
  choice: o Espírito de Yahweh
  alternative: o espírito de Yahweh
  rationale: Nos contextos de capacitação profética, a expressão aponta naturalmente para o Espírito pertencente a Deus; a maiúscula comunica essa leitura sem acrescentar uma distinção inexistente no hebraico.
- issue: Relação sintática entre כֹחַ e אֶת רוּחַ יְהוָה
  choice: 'uma série daquilo de que o profeta está cheio: poder, o Espírito de Yahweh, justiça e força'
  alternative: 'o Espírito de Yahweh como fonte do poder: ''cheio de poder pelo Espírito de Yahweh, e de justiça e força'''
  rationale: A sequência hebraica admite mais de uma análise. O texto principal acompanha sua forma cumulativa, enquanto a nota preserva a leitura instrumental sem decidir silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'Mas eu, ao contrário' torna explícito o contraste contextual sem ampliar o conteúdo. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
