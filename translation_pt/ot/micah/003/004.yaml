base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: pt
  text: Então eles clamarão ao SENHOR, mas ele não lhes responderá; naquele tempo, esconderá deles o seu rosto, porque tornaram perversas as suas ações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque agiram perversamente em suas ações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a consequência futura da denúncia anterior de forma direta e natural em português.
- source_word: יִזְעֲקוּ
  choice: clamarão
  rationale: O verbo expressa um grito urgente por socorro; “clamarão” preserva a intensidade e o contexto religioso sem paráfrase excessiva.
- source_word: אֶל יְהוָה
  choice: ao SENHOR
  rationale: A preposição indica a quem se dirige o clamor. “SENHOR”, em maiúsculas, representa de modo reconhecível o nome divino YHWH na tradição bíblica portuguesa.
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: mas ele não lhes responderá
  rationale: 'Embora a conjunção seja literalmente “e”, o contexto exige valor adversativo: eles clamarão, mas não receberão resposta.'
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: esconderá deles o seu rosto
  rationale: Mantém a imagem hebraica tradicional de retirada da atenção ou do favor divino, sem reduzir seu conteúdo a uma explicação.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Reproduz de maneira idiomática a indicação temporal do juízo.
- source_word: כַּאֲשֶׁר
  choice: porque
  rationale: Neste contexto, introduz o fundamento do juízo, e não apenas uma comparação.
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  choice: tornaram más as suas ações
  rationale: Preserva no texto principal a forma causativa de הֵרֵעוּ e seu objeto explícito, embora a construção também possa ser entendida idiomaticamente como agir perversamente.
theological_decisions:
- issue: Imagem antropomórfica da retirada divina
  choice: esconderá deles o seu rosto
  alternative: se afastará deles; retirará deles o seu favor
  rationale: A imagem hebraica deve ser mantida porque comunica juízo e retirada da atenção favorável de Deus sem esgotar a expressão em uma única interpretação.
- issue: Sentido da cláusula que fundamenta o juízo
  choice: porque tornaram más as suas ações
  alternative: porque agiram perversamente
  rationale: A opção principal conserva a estrutura causativa e a referência explícita às ações dos culpados; a nota registra a leitura idiomática possível sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva-se a expressão bíblica “esconder o rosto” e evita-se linguagem confessional específica.
