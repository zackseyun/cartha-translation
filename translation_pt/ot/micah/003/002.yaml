base_translation:
  language: en
  yaml_path: translation/ot/micah/003/002.yaml
  text: you who hate good and love evil[a], who strip their skin from off them and their flesh from off their bones—
translation:
  language: pt
  text: vocês que odeiam o bem e amam o mal, que lhes arrancam a pele e lhes tiram a carne de cima dos ossos —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: odeiam o bem
  rationale: Os particípios no plural dão continuidade à interpelação do contexto anterior. A forma verbal é natural em português, e «o bem» preserva o contraste moral conciso.
- source_word: וְאֹהֲבֵי רעה
  choice: e amam o mal
  rationale: Mantém o paralelismo com «odeiam o bem» e entende רעה em seu sentido moral amplo, não apenas como dano.
- source_word: גֹּזְלֵי
  choice: arrancam
  rationale: Neste retrato violento de pele, carne e ossos, o verbo comunica a ideia de tomar ou remover à força, preservando a intensidade da metáfora.
- source_word: עוֹרָם מֵעֲלֵיהֶם
  choice: lhes arrancam a pele
  rationale: A construção com pronome dativo possessivo é idiomática em português e expressa que a pele é removida do corpo das vítimas.
- source_word: וּשְׁאֵרָם
  choice: e a carne
  rationale: No paralelismo anatômico com pele e ossos, «carne» é o equivalente mais claro e direto.
- source_word: מֵעַל עַצְמוֹתָם
  choice: de cima dos ossos
  rationale: Preserva a imagem espacial e brutal da carne sendo removida dos ossos, sem reduzir a metáfora a uma abstração.
theological_decisions:
- issue: Violência metafórica na denúncia dos governantes corruptos
  choice: Manter a imagem explícita de arrancar pele e carne dos ossos.
  alternative: Parafrasear como «exploram completamente o povo».
  rationale: O hebraico emprega deliberadamente uma imagem chocante de esquartejamento para retratar a opressão predatória. Suavizá-la apagaria parte essencial da força profética.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação dá continuidade à interpelação iniciada no versículo anterior; o travessão final conserva a frase aberta para a continuação do pensamento.
