id: MIC.3.9
reference: Micah 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: pt
  text: 'Ouçam isto, por favor[a], chefes da casa de Jacó e governantes da casa de Israel, vocês que detestam a justiça e tornam torto tudo o que é reto[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ouçam isto agora”. A partícula hebraica נָא pode expressar urgência, além de apelo.
    reason: lexical_alternative
  - marker: b
    text: Ou “pervertem tudo o que é direito”. A tradução “tornam torto tudo o que é reto” preserva o contraste figurado do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural convoca diretamente os dirigentes. “Ouçam” é natural em português e preserva a força da convocação profética.
- source_word: נָא
  choice: por favor
  rationale: A partícula pode expressar apelo ou urgência. “Por favor” conserva aqui seu valor apelativo, enquanto a alternativa “agora” destaca a urgência.
- source_word: זֹאת
  choice: isto
  rationale: Traduz diretamente o demonstrativo que funciona como objeto do imperativo, sem acrescentar “palavra” ou “mensagem” ao texto.
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: chefes da casa de Jacó
  rationale: Embora רָאשֵׁי signifique literalmente “cabeças de”, “chefes” comunica em português atual a função de liderança sem produzir uma expressão artificial, mantendo “casa de Jacó”.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: e governantes da casa de Israel
  rationale: קְצִינֵי designa governantes, autoridades ou dirigentes. “Governantes” se ajusta ao contexto cívico e judicial e preserva o paralelismo.
- source_word: הַמֲתַעֲבִים
  choice: vocês que detestam
  rationale: O particípio descreve a forte aversão dos dirigentes à justiça. O pronome explícito torna natural em português a passagem da interpelação à acusação.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: No contexto da denúncia contra líderes corruptos, o termo se refere à justiça em sentido judicial e social, e não apenas a um julgamento isolado.
- source_word: וְאֵת כָּל הַיְשָׁרָה
  choice: tudo o que é reto
  rationale: Preserva a imagem de retidão e prepara o contraste deliberado com “torto”, usando uma formulação clara em português.
- source_word: יְעַקֵּשׁוּ
  choice: tornam torto
  rationale: Reproduz a imagem concreta do hebraico e seu contraste verbal com “reto”; alternativas como “pervertem” comunicam o sentido, mas enfraquecem a figura.
theological_decisions:
- issue: Designações coletivas do povo da aliança
  choice: casa de Jacó ... casa de Israel
  alternative: povo de Jacó ... povo de Israel
  rationale: O hebraico repete בֵּית (“casa de”) nas duas expressões. A tradução preserva essa repetição, o paralelismo poético e o sentido corporativo sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a interpelação profética, o paralelismo entre Jacó e Israel e o contraste imagético entre o reto e o torto.
