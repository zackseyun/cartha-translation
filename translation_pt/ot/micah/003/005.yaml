base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: pt
  text: 'Assim diz Yahweh a respeito dos profetas que fazem meu povo se desviar, que mordem com os dentes[a] e proclamam: “Paz!”, mas, contra quem não põe nada na boca deles[b], consagram a guerra[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem de “morder com os dentes” provavelmente retrata profetas predatórios que anunciam bem-estar quando são alimentados ou pagos.
    reason: metáfora
  - marker: b
    text: A expressão significa literalmente pôr algo na boca deles; no contexto, refere-se a lhes dar comida ou pagamento.
    reason: esclarecimento lexical
  - marker: c
    text: 'Ou: “declaram guerra santa contra essa pessoa”. O hebraico diz “consagram a guerra”, empregando linguagem cultual para preparar um ataque.'
    reason: leitura alternativa
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino da aliança, distinguindo-o do título “Senhor”.
- source_word: עַל הַנְּבִיאִים
  choice: a respeito dos profetas
  rationale: עַל introduz aqui o assunto do pronunciamento; “contra” seria possível pelo teor condenatório, mas é menos preciso sintaticamente neste ponto.
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: que fazem meu povo se desviar
  rationale: Preserva o sentido causativo do particípio hifil de תעה sem reduzir a expressão a um simples erro involuntário.
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: que mordem com os dentes
  rationale: Mantém a imagem concreta e agressiva do hebraico, provavelmente ligada ao interesse material dos profetas.
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: 'e proclamam: “Paz!”'
  rationale: קרא pode indicar anunciar ou proclamar; “Paz” conserva a amplitude de שָׁלוֹם, incluindo bem-estar e segurança.
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: mas, contra quem não põe nada na boca deles
  rationale: Conserva a formulação figurada do hebraico, acrescentando “nada” para tornar explícito em português o objeto subentendido; a imagem sugere alimento ou pagamento.
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: consagram a guerra
  rationale: Preserva a linguagem cultual de קדשׁ e sua tensão retórica, em vez de substituí-la simplesmente por “declaram” ou “preparam” guerra.
theological_decisions:
- issue: Acusação de exploração praticada pelos profetas
  choice: Manter as imagens de morder, pôr algo na boca e consagrar a guerra
  alternative: Explicitar no texto principal que os profetas pregam favoravelmente quando recebem comida ou pagamento e atacam quem não lhes paga
  rationale: O hebraico denuncia mensagens proféticas condicionadas pelo benefício recebido, mas o faz por imagens fortes. Preservá-las evita restringir indevidamente a acusação a uma forma específica de suborno.
- issue: Sentido cultual de “consagrar a guerra”
  choice: Conservar a expressão formal “consagram a guerra”
  alternative: “declaram guerra santa” ou “preparam guerra”
  rationale: A expressão hebraica usa linguagem de santificação ou preparação ritual para a guerra. “Guerra santa” explicita uma interpretação possível, enquanto “preparam” perde a força cultual; a nota registra ambas as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A ordem marcada da última oração foi mantida para refletir a topicalização hebraica de quem se torna alvo da guerra, sem perder clareza.
