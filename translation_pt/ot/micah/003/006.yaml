base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: pt
  text: Por isso, será noite para vocês[a], sem visão, e escuridão para vocês, sem adivinhação. O sol se porá sobre os profetas[b], e o dia escurecerá sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “de visão” / “de adivinhação”; a preposição hebraica pode ser traduzida de modo mais literal, mas aqui provavelmente indica privação: “sem visão” e “sem adivinhação”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o sol virá sobre os profetas”; a expressão idiomática indica que o sol se porá sobre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural a consequência judicial da denúncia anterior.
- source_word: לַיְלָה
  choice: será noite
  rationale: Explicita o sentido futuro implícito da oração nominal hebraica no contexto de juízo.
- source_word: מֵחָזוֹן
  choice: sem visão
  rationale: Toma a preposição מִן em sentido privativo, indicando que os profetas ficarão privados de visão reveladora.
- source_word: וְחָשְׁכָה
  choice: e escuridão
  rationale: Mantém o paralelismo poético com “será noite” e comunica a obscuridade que se aproxima.
- source_word: מִקְּסֹם
  choice: sem adivinhação
  rationale: Preserva o paralelo privativo com “sem visão” e emprega o termo corrente para קסם no contexto profético.
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: O sol se porá sobre os profetas
  rationale: Embora בוא signifique literalmente “vir”, quando o sujeito é o sol a expressão indica idiomaticamente o pôr do sol.
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: e o dia escurecerá sobre eles
  rationale: Conserva a imagem de um dia que se torna sombrio sobre os profetas sob juízo.
theological_decisions:
- issue: Natureza das imagens de juízo
  choice: O versículo retrata o juízo sobre profetas corruptos como privação de visão e adivinhação, por meio de imagens de noite, escuridão, pôr do sol e dia escurecido.
  alternative: Entender a linguagem apenas como desonra social ou como descrição de um evento astronômico literal.
  rationale: O contexto imediato trata de profetas, visões e adivinhação; assim, as imagens indicam principalmente a perda de acesso à revelação e o juízo divino, sem eliminar sua força poética nem exigir um fenômeno cósmico literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo e as imagens poéticas do hebraico, esclarecendo em notas as expressões cuja tradução idiomática se afasta da forma mais literal.
