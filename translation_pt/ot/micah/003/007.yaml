  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: pt
  text: Os videntes ficarão envergonhados, e os adivinhos ficarão humilhados; todos eles cobrirão o lábio superior[a], porque não há resposta da parte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobrirão o bigode”. O hebraico descreve provavelmente um gesto de vergonha, luto ou impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: ficarão envergonhados
  rationale: Expressa o resultado de vergonha anunciado no juízo profético, sem forçar uma voz passiva que o hebraico não exige.
- source_word: הַחֹזִים
  choice: os videntes
  rationale: Termo português conciso e estabelecido para pessoas que alegam receber visões.
- source_word: וְחָפְרוּ
  choice: serão humilhados
  rationale: Preserva a dimensão pública de desonra e forma um paralelo natural, sem reduzir o verbo a mera emoção interior.
- source_word: הַקֹּסְמִים
  choice: os adivinhos
  rationale: Traduz diretamente os praticantes de adivinhação e mantém a conotação religiosa negativa do contexto.
- source_word: וְעָטוּ עַל שָׂפָם
  choice: cobrirão o lábio superior
  rationale: Mantém a imagem corporal do hebraico. A possível referência ao bigode e o sentido provável do gesto são registrados em nota.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Conserva a ênfase explícita na totalidade dos videntes e adivinhos.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa da vergonha e humilhação.
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: não há resposta da parte de Deus
  rationale: Preserva a construção nominal e apresenta Deus como a fonte da resposta ausente, sem acrescentar objeto indireto ou explicação interpretativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto exige o sentido singular, referindo-se ao Deus cuja falta de resposta desmascara esses praticantes.
theological_decisions:
- issue: Entender a cláusula final como silêncio divino ou como ausência de um oráculo válido
  choice: não há resposta da parte de Deus
  alternative: Deus não responde; não há resposta divina
  rationale: 'A formulação nominal conserva a tensão do hebraico: não especifica se Deus se recusa a responder ou se nenhuma revelação autêntica existe, apenas afirma que não vem resposta de Deus.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo profético foi preservado, assim como a imagem concreta do gesto.
