id: MIC.6.2
reference: Micah 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: pt
  text: Ouçam, montes, a causa de Yahweh, e vocês, fundamentos duradouros da terra; pois Yahweh tem uma causa contra o seu povo[a] e entrará em contenda com Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com o seu povo”; neste contexto jurídico, o sentido é “contra o seu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural convoca diretamente os montes e, em seguida, os fundamentos da terra como testemunhas. “Ouçam” é natural e preserva a força profética.
- source_word: הָרִים
  choice: montes
  rationale: Mantém a imagem poética e o vocativo direto sem acrescentar uma partícula vocativa artificial em português moderno.
- source_word: רִיב
  choice: causa
  rationale: O termo tem sentido forense e pactual, podendo indicar causa judicial, disputa ou acusação. “Causa” comunica a cena jurídica sem especificá-la em excesso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָאֵתָנִים
  choice: duradouros
  rationale: O adjetivo sugere firmeza, permanência ou antiguidade. “Duradouros” combina naturalmente com os fundamentos da terra e preserva essa amplitude.
- source_word: מֹסְדֵי אָרֶץ
  choice: fundamentos da terra
  rationale: Reproduz a construção hebraica e a imagem cósmica das estruturas fundamentais da terra.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual as testemunhas da criação devem ouvir.
- source_word: עִם עַמּוֹ
  choice: contra o seu povo
  rationale: Embora עִם signifique literalmente “com”, junto de רִיב indica aqui a parte contra a qual Yahweh apresenta sua causa.
- source_word: יִתְוַכָּח
  choice: entrará em contenda
  rationale: O hitpael de יכח descreve disputa, argumentação ou confronto judicial. A expressão preserva o tom forense e a relação com רִיב.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada do nome do povo da aliança.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza da controvérsia de Yahweh com o povo
  choice: 'linguagem judicial: “causa” e “contenda”'
  alternative: disputa; processo; controvérsia
  rationale: רִיב e יִתְוַכָּח formam uma cena de acusação ou litígio da aliança. A tradução mantém esse quadro sem impor uma estrutura jurídica moderna excessivamente específica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “causa” preserva a coesão jurídica do hebraico; “entrará em contenda” evita a impressão de que Yahweh apenas discutirá informalmente.
