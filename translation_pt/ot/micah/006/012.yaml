  text: whose rich men are full of violence[a], and her inhabitants speak lies; their tongue is deceitful in their mouth.
translation:
  language: pt
  text: cujos ricos estão cheios de violência[a], e seus moradores falam mentiras; a língua deles é enganosa na boca deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “opressão”. O termo hebraico também pode abranger injustiça cruel e destrutiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: cujos
  rationale: Mantém a ligação relativa com a cidade mencionada no contexto anterior e introduz naturalmente os grupos que pertencem a ela.
- source_word: עֲשִׁירֶיהָ
  choice: seus ricos
  rationale: Representa o plural masculino e a referência aos membros ricos da cidade, provavelmente sua elite econômica, sem acrescentar uma qualificação ausente do hebraico.
- source_word: מָלְאוּ חָמָס
  choice: estão cheios de violência
  rationale: Expressa de modo natural o estado resultante indicado pelo perfeito e conserva o sentido principal de חָמָס, que também pode abranger opressão e injustiça cruel.
- source_word: וְיֹשְׁבֶיהָ
  choice: e cujos moradores
  rationale: O particípio substantivado designa os que vivem na cidade; a repetição de “cujos” torna clara em português a relação com ela.
- source_word: דִּבְּרוּ שָׁקֶר
  choice: falam mentiras
  rationale: O presente comunica uma conduta habitual na acusação profética; “mentiras” é uma forma corrente e direta de traduzir שָׁקֶר.
- source_word: וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶם
  choice: na boca deles, a língua é enganosa
  rationale: Preserva as imagens concretas de “língua” e “boca”, ao mesmo tempo que verte o substantivo רְמִיָּה de forma predicativa e natural como “enganosa”.
