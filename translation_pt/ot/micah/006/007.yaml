  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: pt
  text: Será que Yahweh se agradará de milhares de carneiros, de miríades de ribeiros de azeite[a]? Daria eu o meu primogênito pela minha transgressão, o fruto do meu ventre[b] pelo pecado da minha vida[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de dezenas de milhares de torrentes de azeite”. A expressão hebraica é hiperbólica e descreve uma quantidade imensa de azeite.
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que significa “meu descendente” ou “meu filho”.
    reason: idiom_clarification
  - marker: c
    text: A palavra hebraica também pode significar “oferta pelo pecado”; nesse caso, a expressão pode ser entendida como uma oferta pelo pecado em favor da minha vida. Aqui, “pecado” corresponde melhor ao paralelo com “minha transgressão”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: Será que ... se agradará
  rationale: A construção interrogativa com רצה pergunta se Yahweh teria prazer ou aceitaria tais ofertas. “Se agradará” preserva o valor avaliativo e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּאַלְפֵי אֵילִים
  choice: de milhares de carneiros
  rationale: Com o verbo “agradar-se”, a regência portuguesa pede “de”; “carneiros” é o sentido sacrificial normal de אֵילִים.
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: de miríades de ribeiros de azeite
  rationale: “Miríades” comunica uma quantidade imensa, e “ribeiros de azeite” conserva a hipérbole concreta de נַחֲלֵי שָׁמֶן.
- source_word: הַאֶתֵּן
  choice: Darei
  rationale: Mantém a segunda pergunta retórica e a escalada solene do versículo.
- source_word: בְּכוֹרִי
  choice: o meu primogênito
  rationale: Preserva a referência ao primeiro filho sem acrescentar “filho”, ausente do hebraico.
- source_word: פִּשְׁעִי
  choice: minha transgressão
  rationale: Expressa uma violação grave, preservando a linguagem moral e sacrificial do contexto.
- source_word: פְּרִי בִטְנִי
  choice: o fruto do meu ventre
  rationale: Reproduz de perto a imagem hebraica para a descendência. Em português, “ventre” funciona poeticamente sem exigir que se determine o gênero do falante.
- source_word: חַטַּאת נַפְשִׁי
  choice: o pecado da minha vida
  rationale: חַטָּאת é entendido como “pecado” pelo paralelismo com “transgressão”; נֶפֶשׁ pode designar a própria vida ou pessoa. “Minha vida” preserva essa amplitude sem impor uma dicotomia corpo-alma.
theological_decisions:
- issue: Se חַטַּאת significa “pecado” ou “oferta pelo pecado”
  choice: pecado
  alternative: oferta pelo pecado
  rationale: O paralelismo com “minha transgressão” favorece o sentido moral abstrato, embora o sentido cultual seja lexicalmente possível e por isso seja registrado em nota.
- issue: Se o texto aprova sacrifícios extravagantes ou o sacrifício de filhos
  choice: Manter as perguntas como uma escalada retórica, sem indicar aprovação divina
  alternative: Ler as ofertas como meios aceitáveis de obter o favor divino
  rationale: A forma interrogativa culmina na proposta chocante de entregar o primogênito e prepara a resposta do contexto. A tradução não suaviza a imagem nem sugere que Yahweh a deseje.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético e perguntas retóricas preservados. “Azeite” foi preferido a “óleo” por ser a designação corrente do óleo de oliva no contexto bíblico. Todas as notas estão marcadas no texto.
