  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: pt
  text: Com que me apresentarei diante de Yahweh e me curvarei diante do Deus do alto?[a] Apresentar-me-ei diante dele com holocaustos, com bezerros de um ano?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante do Deus Altíssimo”. Em hebraico, literalmente, “diante do Deus do alto” ou “diante do Deus da altura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמָּה
  choice: Com que
  rationale: Mantém o sentido instrumental da pergunta e é uma formulação natural em português.
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: me apresentarei diante de / me apresentarei diante dele
  rationale: קדם indica aqui comparecer ou aproximar-se diante de alguém; a repetição foi preservada para manter o efeito retórico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אִכַּף
  choice: me curvarei
  rationale: Expressa a postura corporal de inclinar-se em reverência sem reduzi-la apenas a uma atitude interior.
- source_word: לֵאלֹהֵי מָרוֹם
  choice: diante do Deus que está nas alturas
  rationale: Preserva a descrição espacial e exaltada de מָרוֹם sem convertê-la automaticamente no título fixo 'Deus Altíssimo'.
- source_word: בְעוֹלוֹת
  choice: com holocaustos
  rationale: '''Holocausto'' é o termo sacrificial corrente em português para a oferta inteiramente queimada; o plural e a preposição instrumental foram mantidos.'
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: com bezerros de um ano
  rationale: Reproduz de modo claro e natural a espécie dos animais e sua idade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Se מָרוֹם deve ser entendido como título divino fixo
  choice: o Deus que está nas alturas
  alternative: o Deus Altíssimo; o Deus exaltado
  rationale: A construção hebraica é descritiva e literalmente associa Deus à altura; a tradução evita importar o título mais caracteristicamente expresso por עֶלְיוֹן.
- issue: Força retórica da pergunta sobre os sacrifícios
  choice: pergunta sem explicação interpretativa acrescentada
  alternative: paráfrase que declare explicitamente a insuficiência dos sacrifícios
  rationale: O versículo formula uma pergunta cuja tensão se desenvolve no contexto seguinte; a tradução não antecipa nem resolve essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'me apresentarei diante de' preserva a repetição hebraica; 'nas alturas' mantém a imagem do original. O marcador [a] aparece no texto principal.
