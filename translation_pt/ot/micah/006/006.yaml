revisions:
- from: Com que me apresentarei diante de Yahweh e me curvarei diante do Deus que está nas alturas?[a] Eu me apresentarei diante dele com holocaustos, com bezerros de um ano?
  to: Com que me apresentarei diante de Yahweh e me curvarei diante do Deus do alto?[a] Apresentar-me-ei diante dele com holocaustos, com bezerros de um ano?
  rationale: A revisão torna explícita a segunda pergunta retórica e ajusta a expressão relativa a מָרוֹם para uma formulação portuguesa concisa, fiel ao singular hebraico e não tituladora. A nota foi corrigida para não atribuir literalidade a um plural ausente no texto-fonte.
