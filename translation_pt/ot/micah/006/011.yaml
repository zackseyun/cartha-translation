base_translation:
  language: en
  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: pt
  text: Acaso declararei inocente alguém que tem balanças desonestas e uma bolsa de pesos falsos?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso serei puro com balanças desonestas e uma bolsa de pesos falsos?” O verbo hebraico pode significar “ser puro” ou “ser absolvido, ser considerado inocente”; o contexto favorece o sentido forense.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pedras de engano”, isto é, pedras usadas como pesos no comércio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֶזְכֶּה
  choice: Acaso absolverei
  rationale: O verbo זכה, no qal imperfeito com ה interrogativo, admite a ideia de ser puro ou de considerar alguém inocente. No contexto do processo pactual, a formulação forense “absolverei” expressa melhor a pergunta retórica divina.
- source_word: בְּ/מֹאזְנֵי רֶשַׁע
  choice: quem usa balanças perversas
  rationale: מֹאזְנַיִם são balanças comerciais, e רֶשַׁע lhes atribui caráter moralmente perverso. A inserção mínima de “quem usa” torna natural em português o sentido instrumental da construção sem perder sua força ética.
- source_word: וּ/בְ/כִיס
  choice: e uma bolsa
  rationale: כִּיס designa uma bolsa ou saco, aqui o recipiente em que o comerciante guardava os pesos.
- source_word: אַבְנֵי מִרְמָה
  choice: pesos falsos
  rationale: Literalmente, “pedras de engano”; no comércio, eram pedras usadas como pesos. “Pesos falsos” comunica com clareza tanto a função quanto a fraude.
theological_decisions:
- issue: Sujeito e sentido da pergunta retórica
  choice: O SENHOR pergunta se absolverá quem pratica fraude comercial.
  alternative: O falante pergunta se ele próprio pode ser puro tendo balanças perversas e pesos falsos.
  rationale: O contexto de Miqueias 6 apresenta o SENHOR conduzindo uma acusação pactual. Assim, a leitura forense preserva com maior probabilidade a primeira pessoa divina e a condenação da fraude, embora a forma hebraica também permita a leitura reflexiva indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Acaso” marca naturalmente a pergunta retórica; “absolverei” conserva o cenário judicial, e “balanças perversas” mantém a forte avaliação moral do hebraico.
