revisions:
- from: Os decretos de Onri são observados, assim como todas as práticas da casa de Acabe; vocês seguem os conselhos deles. Por isso, farei de você uma desolação, e de seus habitantes, alvo de assobios de desprezo[a]; e vocês levarão sobre si a vergonha do meu povo.[b]
  to: Os decretos de Onri são observados, assim como todas as práticas da casa de Acabe; vocês seguem os conselhos deles, de modo que eu faça de você uma desolação e de seus habitantes alvo de assobios de desprezo[a]; e vocês levarão sobre si a desonra do meu povo.[b]
  rationale: A revisão conserva as decisões lexicais sólidas do rascunho, mas ajusta a relação introduzida por לְמַעַן para refletir mais diretamente seu valor de finalidade შედეგante/resultado no anúncio de juízo. Também substitui “vergonha” por “desonra”, termo que corresponde mais precisamente ao alcance de חֶרְפָּה e continua compatível com as leituras alternativas registradas na nota.
