source:
  edition: WLC
  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: pt
  text: Os decretos de Onri são observados, assim como todas as práticas da casa de Acabe; vocês seguem os conselhos deles, de modo que eu faça de você uma desolação e de seus habitantes alvo de assobios de desprezo[a]; e vocês levarão sobre si a desonra do meu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, assobios de zombaria ou desprezo diante da ruína.
    reason: Nota cultural que explica a imagem concreta de לִשְׁרֵקָה sem substituí-la no texto.
  - marker: b
    text: Também pode ser entendido como “a afronta contra o meu povo” ou “a desonra do meu povo”. A expressão hebraica é concisa e admite mais de uma interpretação.
    reason: Preserva a ambiguidade sintática e teológica de חֶרְפַּת עַמִּי.
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: são observados
  rationale: O nifal imperfeito tem aqui valor passivo ou impessoal. O plural em português concorda naturalmente com “decretos” e comunica que as determinações de Onri continuam sendo seguidas.
- source_word: חֻקּוֹת עָמְרִי
  choice: os decretos de Onri
  rationale: חֻקּוֹת designa determinações ou normas prescritas. “Decretos” conserva o matiz formal e político sem sugerir que fossem leis legítimas de Deus.
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: todas as práticas da casa de Acabe
  rationale: מַעֲשֵׂה pode indicar obras, atos ou práticas. No contexto de conduta habitual, “práticas” é claro e natural; “casa” preserva a referência dinástica.
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: vocês seguem os conselhos deles
  rationale: A imagem hebraica é literalmente caminhar nos conselhos deles, isto é, pautar a conduta por suas políticas ou planos. “Seguem” comunica esse sentido em português corrente, enquanto “conselhos” mantém a amplitude do substantivo.
- source_word: לְמַעַן תִּתִּי
  choice: Por isso, farei
  rationale: לְמַעַן pode exprimir propósito ou resultado. Neste anúncio judicial, “por isso” apresenta de modo natural o resultado consequente sem impor uma finalidade moral desejada pelos acusados.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: שַׁמָּה denota devastação e pode incluir a ideia de espanto. “Desolação” conserva de modo conciso a imagem profética.
- source_word: וְיֹשְׁבֶיהָ
  choice: seus habitantes
  rationale: O sufixo feminino singular remete à cidade ou comunidade personificada. Como o referente explícito não aparece neste versículo, “seus habitantes” é mais natural em português do que uma personificação feminina obscura.
- source_word: לִשְׁרֵקָה
  choice: alvo de assobios de desprezo
  rationale: O substantivo descreve assobios dirigidos a uma ruína em zombaria ou espanto. A formulação preserva a imagem concreta e esclarece sua função cultural.
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: vocês levarão sobre si a vergonha do meu povo
  rationale: “Levar sobre si” representa נשׂא de maneira idiomática, enquanto “a vergonha do meu povo” mantém a concisão e a ambiguidade do encadeamento hebraico.
theological_decisions:
- issue: Sentido de וְחֶרְפַּת עַמִּי, “a vergonha do meu povo”
  choice: Manter no texto principal “a vergonha do meu povo”
  alternative: “a afronta contra o meu povo”, “a desonra do meu povo” ou “a vergonha que cabe ao meu povo”
  rationale: A construção hebraica é compacta e não determina inequivocamente se a vergonha pertence ao povo, é dirigida contra ele ou é suportada por ele em consequência do juízo. A tradução preserva essa tensão, e a nota registra as possibilidades.
- issue: Relação expressa por לְמַעַן entre a conduta e o juízo
  choice: “Por isso, farei”
  alternative: “para que eu faça” ou “de modo que eu faça”
  rationale: O contexto permite propósito ou resultado. Em português, a leitura estritamente final poderia sugerir que o povo praticava o mal com a intenção de provocar o juízo. “Por isso” expressa a consequência judicial sem negar a amplitude semântica da partícula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural das formas verbais dirigidas ao povo, enquanto “você” conserva o singular corporativo de אֹתְךָ. A redação evita arcaísmos como “escárnio” e esclarece discretamente a imagem cultural dos assobios.
