  naturalness: O português é claro, atual e adequado ao registro profético. A alternância deliberada entre “vocês” plural e “você” corporativo é compreensível. “Alvo de assobios de desprezo” é natural; a nota explica apropriadamente o gesto de escárnio.
  terminology: “Decretos”, “casa de Acabe”, “desolação” e “conselhos” são escolhas adequadas. Para חֶרְפַּת עַמִּי, “desonra” é mais próximo de “reprovação/desgraça” do que “vergonha”, sem eliminar a ambiguidade do genitivo hebraico.
