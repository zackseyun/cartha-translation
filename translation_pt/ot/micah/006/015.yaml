base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: pt
  text: Você semeará, mas não colherá; pisará azeitonas, mas não passará azeite no corpo; e pisará uvas para obter vinho novo[a], mas não beberá vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pisará azeitonas... e vinho novo”; na segunda expressão, o verbo “pisar” é provavelmente subentendido. “Uvas para obter” explicita em português o produto e o processo pressupostos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: semeará
  rationale: O verbo זרע significa normalmente semear. A escolha preserva a imagem agrícola e sua correspondência direta com colher.
- source_word: תִקְצוֹר
  choice: não colherá
  rationale: קצר é o verbo usual para ceifar ou colher cereais. “Colher” é natural e acessível em português, além de manter o contraste com “semeará”.
- source_word: תִדְרֹךְ זַיִת
  choice: esmagará azeitonas
  rationale: דרך significa literalmente pisar, mas aqui descreve o processamento das azeitonas para extração de azeite. “Esmagará” comunica naturalmente a ação em português sem obscurecer a imagem concreta.
- source_word: תָסוּךְ שֶׁמֶן
  choice: não se ungirá com o azeite
  rationale: סוך designa aplicar ou passar óleo no corpo. A forma reflexiva preserva a ideia de que a pessoa não desfrutará o azeite produzido.
- source_word: תִירוֹשׁ
  choice: vinho novo
  rationale: תירוש denota o produto recente da uva, mosto ou vinho novo. “Vinho novo” mantém a amplitude do termo e evita restringi-lo a suco não fermentado.
- source_word: וְתִירוֹשׁ
  choice: pisará uvas para produzir vinho novo
  rationale: O hebraico apresenta “e vinho novo” sem repetir o verbo; o verbo דרך da oração anterior é entendido por elipse. A explicitação das uvas e da finalidade torna a imagem inteligível em português.
- source_word: תִשְׁתֶּה יַיִן
  choice: não beberá o vinho
  rationale: יין é o termo comum para vinho. O artigo em português retoma naturalmente o vinho que seria obtido da produção mencionada.
- source_word: אַתָּה
  choice: você
  rationale: O pronome repetido enfatiza o destinatário. Em português moderno, uma ocorrência explícita de “você”, seguida de verbos no futuro com sujeito subentendido, preserva o foco sem produzir repetição artificial.
theological_decisions:
- issue: Natureza da imagem de juízo
  choice: Juízo expresso como trabalho agrícola frustrado e privação do fruto produzido
  alternative: Infortúnio geral sem conotações de maldição pactual
  rationale: O versículo apresenta o padrão de trabalhar sem colher e produzir sem desfrutar. A tradução conserva essa linguagem severa de juízo sem acrescentar uma explicação teológica que o texto não explicita neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” oferece endereço direto natural; “azeite” é preferível a “óleo” no contexto de azeitonas. A tradução explicita a elipse hebraica na terceira oração e registra a forma mais literal em nota.
