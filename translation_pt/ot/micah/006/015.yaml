  naturalness: O texto é claro e fluente. «Passará azeite no corpo» é mais natural em português contemporâneo e comunica melhor o uso cotidiano pressuposto. «Pisará» também conserva a imagem concreta do verbo hebraico de modo mais consistente do que alternar «esmagará» e «pisará».
  terminology: «Azeite», «vinho novo» e «vinho» são escolhas adequadas. A substituição de «se ungirá com o azeite» por «passará azeite no corpo» evita uma conotação técnico-ritual sem perder o sentido reflexivo.
