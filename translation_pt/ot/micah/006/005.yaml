  terminology: Balaque, Balaão, Beor, Sitim e Gilgal são formas portuguesas correntes. «Atos justos de Yahweh» preserva adequadamente a amplitude de צִדְקוֹת; as alternativas da nota são úteis e não impõem uma leitura teológica estreita.
