  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: pt
  text: Meu povo, por favor, lembre-se do que Balaque, rei de Moabe, planejou[a] e do que Balaão, filho de Beor, lhe respondeu — desde Sitim até Gilgal[b] — para que conheça os atos justos de Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aconselhou” ou “tramou”.
    reason: lexical_alternative
  - marker: b
    text: Sitim e Gilgal são nomes de lugares que evocam o percurso de Israel desde as planícies de Moabe até a terra prometida.
    reason: cultural_note
  - marker: c
    text: Ou “os atos salvadores de Yahweh” ou “os atos de justiça de Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Meu povo
  rationale: Vocativo de Yahweh dirigido a Israel; preserva de modo natural a relação de aliança.
- source_word: זְכָר נָא
  choice: por favor, lembre-se
  rationale: O imperativo com נָא expressa apelo ou insistência cortês; esta formulação é clara e atual em português.
- source_word: מַה יָּעַץ
  choice: do que ... planejou
  rationale: Neste contexto, יעץ se refere ao plano hostil de Balaque contra Israel. A nota preserva as nuances de aconselhar e tramar.
- source_word: בָּלָק מֶלֶךְ מוֹאָב
  choice: Balaque, rei de Moabe
  rationale: Emprega as formas portuguesas correntes dos nomes e apresenta o título em aposição natural.
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: e do que ... lhe respondeu
  rationale: Mantém o valor direto de ענה, 'responder', e o interrogativo substantivo 'o que', sem substituí-lo interpretativamente por 'como'.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Emprega as formas portuguesas tradicionais e preserva a construção patronímica.
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: desde Sitim até Gilgal
  rationale: Translitera os topônimos e mantém a ligação sintática compacta e um tanto ambígua do hebraico; os travessões evitam determinar em excesso a que parte da recordação a expressão se liga.
- source_word: לְמַעַן דַּעַת
  choice: para que você conheça
  rationale: Expressa a finalidade e explicita, a partir do vocativo singular coletivo, o sujeito de segunda pessoa implícito.
- source_word: צִדְקוֹת
  choice: os atos justos
  rationale: Preserva a ligação lexical com justiça/retidão e, ao mesmo tempo, permite que a expressão inclua os atos históricos de fidelidade e livramento de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de צִדְקוֹת יְהוָה
  choice: os atos justos de Yahweh
  alternative: os atos salvadores de Yahweh; os atos de justiça de Yahweh
  rationale: A expressão pode abranger as ações justas, fiéis à aliança e libertadoras de Yahweh na história. 'Atos justos' conserva essa amplitude sem restringir o sentido apenas à salvação ou à justiça forense.
- issue: Referência de מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: manter a expressão parentética sem explicitar seu vínculo
  alternative: entendê-la explicitamente como resumo da jornada de Israel ou ligá-la à resposta de Balaão
  rationale: A construção hebraica é condensada e sua ligação sintática exata não é inequívoca; os travessões preservam essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular em “lembre-se” e “você” acompanha o vocativo coletivo singular “meu povo”. Os nomes seguem formas portuguesas correntes; a pontuação preserva a concisão e a ambiguidade sintática do hebraico.
