revisions:
- from: Pois eu tirei você da terra do Egito e o resgatei da casa de escravos[a]; enviei adiante de você Moisés, Arão e Miriã.
  to: Pois eu tirei você da terra do Egito e resgatei você da casa da escravidão[a]; enviei à sua frente Moisés, Arão e Miriã.
  rationale: A revisão substitui uma expressão portuguesa ambígua por uma formulação idiomática que corresponde ao sentido da fórmula hebraica, preservando em nota a construção mais literal com «escravos». Também uniformiza a referência a Israel e torna natural a expressão locativa referente aos líderes enviados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:10Z'
review_pass:
  verdict: revise
  source_fidelity: A sequência das ações divinas, o singular coletivo dirigido a Israel, a libertação do Egito, o resgate e o envio de Moisés, Arão e Miriã são preservados. Contudo, «casa de escravos» em português pode designar uma casa ocupada por escravos ou a eles pertencente, e não comunica com clareza a expressão hebraica idiomática בֵּית עֲבָדִים, que designa a condição/lugar de escravidão.
  naturalness: «Da casa da escravidão» é a formulação bíblica e idiomática mais natural em português. «À sua frente» é mais fluente e preciso do que «adiante de você» neste contexto de líderes enviados perante o povo. A repetição de «você» evita a alternância um tanto abrupta entre «você» e «o» no mesmo enunciado.
  terminology: «Resgatei» é uma boa tradução de פדה e mantém o campo semântico de redenção sem impor desenvolvimento doutrinário posterior. Os nomes Moisés, Arão e Miriã estão corretos em português. A nota deve preservar a alternativa mais literal «casa de escravos».
  issues:
  - severity: medium
    issue: «casa de escravos» é semanticamente ambíguo e pouco idiomático em português.
    rationale: Embora reflita a forma plural de עֲבָדִים, a expressão pode sugerir uma residência de escravos, em vez da fórmula de opressão/escravidão expressa por בֵּית עֲבָדִים. «Casa da escravidão» comunica adequadamente o idiomatismo hebraico; a literalidade pode ser mantida em nota.
  - severity: low
    issue: Alternância entre «você» e «o».
    rationale: Como «você» é o objeto expresso na primeira oração, «o resgatei» é gramaticalmente possível, mas a mudança torna a frase menos uniforme no registro moderno adotado.
  revised_text: Pois eu tirei você da terra do Egito e resgatei você da casa da escravidão[a]; enviei à sua frente Moisés, Arão e Miriã.
  revised_footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “da casa de escravos”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma expressão portuguesa ambígua por uma formulação idiomática que corresponde ao sentido da fórmula hebraica, preservando em nota a construção mais literal com «escravos». Também uniformiza a referência a Israel e torna natural a expressão locativa referente aos líderes enviados.
