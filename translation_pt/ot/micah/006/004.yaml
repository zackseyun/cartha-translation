  text: כִּ֤י הֶעֱלִתִ֨י/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מִ/בֵּ֥ית עֲבָדִ֖ים פְּדִיתִ֑י/ךָ וָ/אֶשְׁלַ֣ח לְ/פָנֶ֔י/ךָ אֶת מֹשֶׁ֖ה אַהֲרֹ֥ן וּ/מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: pt
  text: Pois eu tirei você da terra do Egito e resgatei você da casa da escravidão[a]; enviei à sua frente Moisés, Arão e Miriã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “da casa de escravos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão apresentada pelo SENHOR no contexto, preservando a ligação argumentativa.
- source_word: הֶעֱלִתִיךָ
  choice: tirei você
  rationale: Embora o hifil de עלה expresse literalmente fazer subir, na fórmula do êxodo o português natural pede 'tirar do Egito'; a ideia de movimento para fora é preservada sem tradução rígida.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Tradução direta e corrente da expressão geográfica.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Preserva a imagem concreta do hebraico, cujo substantivo plural designa escravos, em vez de substituí-la silenciosamente pela abstração 'escravidão'.
- source_word: פְּדִיתִיךָ
  choice: o resgatei
  rationale: Expressa libertação mediante resgate e mantém o peso redentor do verbo פדה, sem exigir uma elaboração doutrinária posterior.
- source_word: וָאֶשְׁלַח לְפָנֶיךָ
  choice: enviei adiante de você
  rationale: Traduz naturalmente a ação de enviar e conserva o sentido espacial ou representativo de לפניך, isto é, à frente do povo.
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: Moisés, Arão e Miriã
  rationale: Emprega as formas portuguesas correntes dos três nomes e preserva explicitamente Miriã entre os líderes enviados.
theological_decisions:
- issue: Sentido concreto de עֲבָדִים na fórmula do êxodo
  choice: casa de escravos
  alternative: casa de escravidão
  rationale: A leitura principal conserva o plural concreto 'escravos' e a imagem hebraica de uma casa caracterizada por seus cativos. A alternativa idiomática é registrada em nota, sem apagar a nuance social do original.
- issue: Tradução de פדה
  choice: resgatei
  alternative: redimi
  rationale: '''Resgatei'' comunica com clareza moderna o campo semântico de libertação por resgate. ''Redimi'' também é possível, mas pode soar mais técnico ou exclusivamente teológico para leitores comuns.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular 'você/o' representa Israel coletivamente, como no hebraico. A colocação de 'da casa de escravos' junto a 'resgatei' evita a coordenação pesada do original sem alterar as relações sintáticas essenciais.
