source:
  edition: WLC
  text: אַתָּ֤ה תֹאכַל֙ וְ/לֹ֣א תִשְׂבָּ֔ע וְ/יֶשְׁחֲ/ךָ֖ בְּ/קִרְבֶּ֑/ךָ וְ/תַסֵּג֙ וְ/לֹ֣א תַפְלִ֔יט וַ/אֲשֶׁ֥ר תְּפַלֵּ֖ט לַ/חֶ֥רֶב אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: pt
  text: Você comerá, mas não ficará satisfeito, e seu vazio permanecerá dentro de você.[a] Você levará algo embora, mas não conseguirá salvar nada; e o que conseguir salvar, eu entregarei à espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “seu vazio permanecerá dentro de você” é difícil. Também pode ser entendida como “sua humilhação estará no meio de você” ou “seu abatimento estará dentro de você”.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: você comerá
  rationale: O Qal imperfeito de אכל tem sentido preditivo no anúncio de juízo; a forma é direta e natural em português.
- source_word: תִשְׂבָּע
  choice: não ficará satisfeito
  rationale: שׂבע indica ficar saciado ou satisfeito depois de comer. A formulação mantém o contraste com comer.
- source_word: יֶשְׁחֲךָ
  choice: seu vazio permanecerá
  rationale: A forma hebraica é rara e difícil. No contexto de comer sem saciedade, 'vazio' expressa adequadamente a privação interna, enquanto a nota preserva outras leituras possíveis.
- source_word: בְּקִרְבֶּךָ
  choice: dentro de você
  rationale: קֶרֶב pode indicar o interior ou o meio. Aqui, a expressão naturalmente descreve uma aflição interna.
- source_word: תַסֵּג
  choice: tentará pôr seus bens a salvo
  rationale: O Hifil de סוג pode significar remover, retirar ou levar embora. Como o objeto está implícito e o verbo seguinte trata de salvar, a formulação explicita com cautela uma tentativa de retirar bens do perigo.
- source_word: תַפְלִיט
  choice: não conseguirá salvá-los
  rationale: O Hifil de פלט significa fazer escapar, salvar ou livrar. O pronome retoma o objeto implícito da ação anterior.
- source_word: תְּפַלֵּט
  choice: conseguir salvar
  rationale: Repete-se o verbo פלט; repetir 'salvar' conserva a ligação lexical e a progressão do juízo.
- source_word: לַחֶרֶב
  choice: à espada
  rationale: Mantém a metáfora profética tradicional para morte violenta ou destruição pela guerra.
- source_word: אֶתֵּן
  choice: eu entregarei
  rationale: נתן significa dar, mas 'entregar à espada' é idiomático em português e conserva claramente a ação divina de sujeitar o que restar ao juízo.
theological_decisions:
- issue: Sentido da cláusula obscura וְיֶשְׁחֲךָ בְּקִרְבֶּךָ
  choice: vazio interior como parte do juízo
  alternative: humilhação no meio de você; abatimento ou definhamento dentro de você
  rationale: O contexto imediato associa o juízo à alimentação sem saciedade e à perda. 'Vazio' se ajusta ao paralelismo, mas a dificuldade lexical exige que as alternativas permaneçam visíveis em nota.
- issue: Objeto implícito de תַסֵּג e תַפְלִיט
  choice: bens que se tenta retirar e salvar
  alternative: pessoas, provisões ou outro objeto não especificado
  rationale: O hebraico não nomeia o objeto. 'Seus bens' fornece uma leitura contextualmente plausível e inteligível, sem transformar a passagem em afirmação doutrinária; ainda assim, trata-se de uma explicitação tradutória.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com futuro profético claro. A primeira oração permanece concisa; na segunda, o objeto implícito foi explicitado para tornar compreensível a sequência retirar–salvar, e a repetição de 'salvar' conserva a ligação entre as duas formas de פלט.
