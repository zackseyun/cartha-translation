revisions:
- from: Ainda há, na casa do perverso, tesouros de perversidade e uma medida reduzida[a], que é amaldiçoada?
  to: Ainda há na casa do perverso tesouros de perversidade e uma medida insuficiente[a], amaldiçoada?
  rationale: A revisão substitui «reduzida» por «insuficiente», expressão mais natural e semanticamente precisa para uma medida abaixo do padrão, e simplifica a nota para manter o dado lexical técnico sem transformar em definição uma inferência contextual.
