  text: ע֗וֹד הַ/אִשׁ֙ בֵּ֣ית רָשָׁ֔ע אֹצְר֖וֹת רֶ֑שַׁע וְ/אֵיפַ֥ת רָז֖וֹן זְעוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
translation:
  language: pt
  text: Ainda há na casa do perverso tesouros de perversidade e uma medida insuficiente[a], amaldiçoada?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico “efa”, uma medida padrão para produtos secos; aqui pode referir-se ao recipiente de medição de um comerciante. Ou: “uma efa deficiente, amaldiçoada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: ainda
  rationale: Expressa a continuidade das práticas injustas e funciona naturalmente na pergunta retórica.
- source_word: הַאִשׁ
  choice: há...?
  rationale: Embora a forma hebraica seja difícil, o contexto favorece entendê-la com força interrogativa; a construção com “há” é natural em português.
- source_word: בֵּית רָשָׁע
  choice: na casa do perverso
  rationale: Preserva a expressão concreta e o singular hebraico sem acrescentar uma referência masculina inexistente no substantivo.
- source_word: אֹצְרוֹת רֶשַׁע
  choice: tesouros de perversidade
  rationale: Mantém a formulação hebraica e sua tensão entre bens concretos e sua origem ou caráter moral injusto, sem explicitar além do texto que foram adquiridos por fraude.
- source_word: אֵיפַת
  choice: medida
  rationale: O efa era uma unidade e também, neste contexto comercial, o recipiente usado para medir secos; “medida” comunica a função de modo claro.
- source_word: רָזוֹן
  choice: reduzida
  rationale: Indica uma medida menor que o padrão, usada para entregar quantidade insuficiente; “reduzida” é clara e digna em português atual.
- source_word: זְעוּמָה
  choice: amaldiçoada
  rationale: Preserva a forte avaliação condenatória do termo, em vez de enfraquecê-la para simples reprovação.
theological_decisions:
- issue: Leitura interrogativa da oração inicial apesar da dificuldade textual
  choice: 'Pergunta retórica: “Ainda há...?”'
  alternative: Afirmação declarativa sobre a permanência dos ganhos injustos na casa do perverso
  rationale: A sequência de acusações divinas em forma de pergunta, inclusive no versículo seguinte, favorece a leitura interrogativa, sem ocultar que a forma hebraica é difícil.
- issue: Relação entre os “tesouros” e a perversidade
  choice: “tesouros de perversidade”
  alternative: “tesouros adquiridos perversamente”
  rationale: A tradução conserva a ambiguidade do genitivo hebraico, que pode caracterizar os tesouros ou indicar que foram acumulados por meios perversos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da pergunta foi ajustada à sintaxe natural do português, preservando o tom acusatório e a imagem comercial do hebraico.
