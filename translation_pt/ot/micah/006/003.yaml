base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: pt
  text: Meu povo, o que fiz a você? Como o cansei[a]? Responda-me[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Como sobrecarreguei você?»'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Responda contra mim» ou «Dê testemunho contra mim», refletindo o possível cenário judicial da passagem.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Meu povo
  rationale: Vocativo com sufixo de primeira pessoa do singular; preserva o tratamento pessoal e pactual, com naturalidade em português atual.
- source_word: מֶה
  choice: o que
  rationale: Pronome interrogativo direto, introduzindo a primeira pergunta retórica.
- source_word: עָשִׂיתִי לְךָ
  choice: fiz a você
  rationale: O perfeito qal de עשה com ל indica uma ação dirigida ao interlocutor. O pretérito perfeito é natural em português e não acrescenta a ideia adversativa de «contra você».
- source_word: וּמָה
  choice: Como
  rationale: Embora corresponda formalmente a «e o que», aqui introduz uma pergunta sobre o modo como Deus teria causado cansaço ao povo; «Como» reproduz isso com clareza.
- source_word: הֶלְאֵתִיךָ
  choice: o cansei
  rationale: 'O hifil de לאה tem sentido causativo: «fazer ficar cansado». A forma concisa conserva a força retórica; a alternativa «sobrecarreguei» é indicada em nota.'
- source_word: עֲנֵה
  choice: Responda
  rationale: Imperativo masculino singular de ענה, dirigido ao povo como interlocutor coletivo. «Responda» é atual, direto e adequado à pergunta anterior.
- source_word: בִּי
  choice: -me
  rationale: Com ענה, ב pode marcar a pessoa a quem se responde ou contra quem se testemunha. «Responda-me» é a leitura contextual mais natural, sem eliminar a possível nuance judicial, registrada em nota.
theological_decisions:
- issue: Tom pactual e possível cenário judicial
  choice: Manter no texto a interpelação pessoal e direta de Deus ao seu povo, sem acrescentar linguagem judicial explícita.
  alternative: «Responda contra mim» ou «Dê testemunho contra mim».
  rationale: O contexto pode evocar uma controvérsia judicial da aliança, mas a construção hebraica também admite simplesmente uma resposta dirigida a Deus. A nota preserva a ambiguidade sem impor o cenário judicial ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular «você» acompanha o tratamento hebraico do povo como interlocutor coletivo; os pronomes átonos evitam repetição excessiva sem tornar a frase arcaica.
