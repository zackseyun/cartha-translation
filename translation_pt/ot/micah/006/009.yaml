source:
  edition: WLC
  text: ק֤וֹל יְהוָה֙ לָ/עִ֣יר יִקְרָ֔א וְ/תוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑/ךָ שִׁמְע֥וּ מַטֶּ֖ה וּ/מִ֥י יְעָדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: pt
  text: A voz do SENHOR clama à cidade; a sabedoria vê o teu nome[a]. Ouçam a vara e quem a designou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é sabedoria temer o teu nome”. O hebraico desta expressão é difícil, e a sua interpretação é debatida.'
    reason: Preserva no texto a leitura da forma massorética “vê”, ao mesmo tempo que registra de modo transparente a interpretação alternativa refletida no rascunho e em algumas tradições de tradução.
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  choice: A voz do SENHOR
  rationale: Preserva a construção hebraica e representa o nome divino יהוה segundo a convenção editorial em versaletes.
- source_word: וְתוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑ךָ
  choice: é sensato temer o teu nome
  rationale: O texto massorético é sintaticamente difícil. תושיה pode indicar sabedoria prática ou sensatez, e יראה pode ser entendido como forma de 'temer'; a formulação portuguesa conserva essa leitura sem introduzir um sujeito artificial como 'a sabedoria'.
- source_word: מַטֶּ֖ה
  choice: a vara
  rationale: Mantém a imagem concreta da vara, que no contexto pode representar disciplina ou castigo, sem explicitar a metáfora no corpo do texto.
- source_word: וּמִ֥י יְעָדָֽהּ
  choice: e aquele que a designou
  rationale: מי é tomado no sentido de 'aquele que', e יעד no sentido de designar ou determinar; o sufixo feminino retoma 'vara'.
theological_decisions:
- issue: Resposta adequada ao nome divino
  choice: temer o teu nome
  alternative: reconhecer o teu nome / ver o teu nome
  rationale: A vocalização massorética favorece uma forma ligada a ירא, 'temer'. 'Temer' preserva a tensão bíblica entre reverência e receio diante do juízo, sem reduzi-la a mero reconhecimento.
- issue: Agente que determina a vara
  choice: aquele que a designou
  alternative: quem a estabeleceu / quem determinou o castigo
  rationale: Mantém o agente sem identificá-lo explicitamente no texto e evita converter de modo interpretativo a 'vara' em 'castigo'.
translation_notes:
  register: Português atual, digno e de leitura ampla, com imperativo plural natural no português brasileiro. O travessão e as aspas tornam perceptível a passagem do anúncio profético para a convocação, sem alegar que a pontuação pertence ao hebraico original.
