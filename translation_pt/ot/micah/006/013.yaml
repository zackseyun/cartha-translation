  text: וְ/גַם אֲנִ֖י הֶחֱלֵ֣יתִי הַכּוֹתֶ֑/ךָ הַשְׁמֵ֖ם עַל חַטֹּאתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/013.yaml
  text: Therefore I too have begun to strike you[a], making you desolate because of your sins.
translation:
  language: pt
  text: Por isso, eu também comecei a ferir você[a], deixando você desolado por causa dos seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o fiz adoecer ao golpeá-lo.” O verbo hebraico também pode ter o sentido de causar doença ou fraqueza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Por isso ... também
  rationale: No contexto, a combinação introduz a ação divina como consequência das acusações anteriores e mantém a ênfase aditiva de גַם.
- source_word: אֲנִי
  choice: eu
  rationale: O pronome explícito foi preservado para enfatizar que o próprio SENHOR executa o juízo.
- source_word: הֶחֱלֵיתִי
  choice: comecei
  rationale: O hifil de חלה pode indicar causar doença ou fraqueza, mas, seguido do infinitivo 'ferir', admite naturalmente o sentido incoativo 'começar a ferir'.
- source_word: הַכּוֹתֶךָ
  choice: a ferir você
  rationale: O infinitivo de נכה com sufixo de segunda pessoa masculina singular expressa golpe punitivo; 'ferir' é atual, claro e digno.
- source_word: הַשְׁמֵם
  choice: deixando-o desolado
  rationale: O hifil de שמם apresenta a desolação como resultado ou efeito do golpe, preservando a severidade do juízo.
- source_word: עַל
  choice: por causa de
  rationale: A preposição introduz aqui o fundamento causal do juízo.
- source_word: חַטֹּאתֶךָ
  choice: seus pecados
  rationale: O plural comunica as diversas violações denunciadas no contexto imediato.
theological_decisions:
- issue: Formula de juízo divino em הֶחֱלֵיתִי הַכּוֹתֶךָ
  choice: comecei a ferir você
  alternative: fiz você adoecer ao feri-lo
  rationale: A construção pode ter sentido causativo ligado à doença ou fraqueza, mas a sequência com o infinitivo de נכה favorece a leitura incoativa. A alternativa genuína é preservada em nota, sem restringir o juízo a enfermidade física.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém tom digno e judicial; 'você' representa com clareza a segunda pessoa singular dirigida ao povo personificado.
