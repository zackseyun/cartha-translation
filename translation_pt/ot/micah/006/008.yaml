  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: pt
  text: Ele já declarou a você, ó ser humano,[a] o que é bom. E o que Javé exige de você, senão que pratique a justiça, ame o amor leal[b] e ande humildemente com o seu Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega um substantivo singular para se dirigir representativamente ao ser humano em geral.
    reason: cultural_note
  - marker: b
    text: Também pode ser traduzido como “misericórdia”, “bondade” ou “lealdade pactual”. O hebraico חֶסֶד expressa amor fiel e leal no âmbito de um relacionamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד לְךָ
  choice: Ele já declarou a você
  rationale: O hifil de נגד significa dar a conhecer ou declarar. “Já declarou” expressa uma revelação anterior que continua válida no contexto retórico.
- source_word: אָדָם
  choice: ó ser humano
  rationale: O substantivo singular dirige-se representativamente ao ouvinte humano. “Ser humano” preserva a referência humana abrangente e, com o vocativo singular, mantém a força retórica.
- source_word: טּוֹב
  choice: bom
  rationale: Mantém o sentido moral amplo de טוֹב sem restringi-lo a “justo” ou “benéfico”.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa diretamente o nome divino e usa sua forma corrente em português.
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: exige de você
  rationale: Neste contexto, דרש com מן indica aquilo que Deus requer ou espera; “exige de você” comunica a força ética e pactual da expressão.
- source_word: כִּי אִם
  choice: senão que
  rationale: Na pergunta retórica, a construção introduz, em sentido exceptivo, o conteúdo do que é exigido.
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: pratique a justiça
  rationale: Expressa naturalmente em português a conduta ativa indicada por עשה e o sentido ético de מִשְׁפָּט.
- source_word: וְאַהֲבַת חֶסֶד
  choice: ame o amor leal
  rationale: Preserva a repetição conceitual de “amar” e o campo semântico de חֶסֶד, que abrange amor fiel, bondade, misericórdia e lealdade relacional.
- source_word: וְהַצְנֵעַ לֶכֶת
  choice: ande humildemente
  rationale: A expressão adverbial descreve uma maneira humilde ou modesta de conduzir a vida; “andar” conserva a metáfora hebraica.
- source_word: עִם אֱלֹהֶיךָ
  choice: com o seu Deus
  rationale: Traduz diretamente עִם e preserva a dimensão relacional da vida com Deus.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; bondade; lealdade pactual
  rationale: “Amor leal” conserva tanto o afeto quanto a fidelidade duradoura de חֶסֶד, sem limitar o termo apenas à compaixão. As alternativas genuínas são registradas em nota.
- issue: Alcance de אָדָם
  choice: ó ser humano
  alternative: ó homem; humanidade
  rationale: O hebraico apresenta um destinatário singular que representa o ser humano em geral. A tradução mantém o vocativo singular sem fazer a referência universal parecer exclusivamente masculina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a pergunta retórica, o paralelismo da tríade ética e a metáfora bíblica de andar com Deus.
