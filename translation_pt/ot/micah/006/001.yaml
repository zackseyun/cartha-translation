id: MIC.6.1
reference: Micah 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: pt
  text: 'Ouçam agora o que Yahweh diz: “Levante-se[a], apresente sua causa diante dos montes, e que as colinas ouçam a sua voz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contenda com os montes” ou “apresente uma causa contra os montes”. O verbo hebraico tem conotações de disputa judicial; aqui, provavelmente, os montes são convocados como testemunhas na ação de aliança movida por Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Ouçam agora
  rationale: O imperativo plural convoca os ouvintes a prestar atenção, e נָא acrescenta urgência ou insistência. “Ouçam agora” é natural e solene em discurso profético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹמֵר
  choice: diz
  rationale: O particípio introduz a declaração divina com sentido presente; “diz” é a formulação portuguesa mais natural.
- source_word: קוּם
  choice: Levante-se
  rationale: O imperativo masculino singular convoca uma pessoa, provavelmente o profeta, a entrar em ação. “Levante-se” é atual, claro e digno.
- source_word: רִיב
  choice: apresente sua causa
  rationale: O verbo possui conotações de disputa judicial. A expressão comunica esse cenário forense sem sugerir de modo indevido que os montes sejam necessariamente os réus.
- source_word: אֶת הֶהָרִים
  choice: diante dos montes
  rationale: Com ריב, אֶת pode indicar a parte envolvida na disputa; no contexto, os montes parecem servir como testemunhas. “Diante dos montes” preserva essa leitura contextual, enquanto a nota registra alternativas genuínas.
- source_word: וְתִשְׁמַעְנָה
  choice: e que ... ouçam
  rationale: O imperfeito nessa sequência tem força volitiva ou jussiva. “E que ... ouçam” reproduz essa continuação exortativa com naturalidade.
- source_word: הַגְּבָעוֹת
  choice: as colinas
  rationale: Equivalente geográfico direto que preserva o paralelismo poético com “montes”.
- source_word: קוֹלֶךָ
  choice: a sua voz
  rationale: קוֹל significa naturalmente “voz” neste contexto de proclamação oral.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Papel dos montes na cena judicial
  choice: diante dos montes
  alternative: contra os montes; com os montes
  rationale: O contexto subsequente favorece a compreensão dos montes como testemunhas da controvérsia de Yahweh, mas a construção hebraica admite outras relações; por isso, a tradução principal evita torná-los réus e a nota conserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O plural “Ouçam” segue o hebraico, enquanto “Levante-se” preserva a mudança para o singular. A fala introduzida por “diz” foi marcada com aspas para tornar clara a transição de voz.
