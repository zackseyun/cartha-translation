id: MIC.7.2
reference: Micah 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: pt
  text: A pessoa fiel desapareceu da terra[a], e não há ninguém íntegro entre os seres humanos. Todos ficam à espreita para derramar sangue; cada um caça seu irmão[b] com uma rede[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do país”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “seu irmão”; o termo também pode designar outro membro da comunidade, não apenas um irmão de sangue.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com uma armadilha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: desapareceu
  rationale: O qal perfeito expressa uma perda já consumada. “Desapareceu” mantém o tom de lamento e, neste contexto coletivo, evita limitar o sentido à morte física.
- source_word: חָסִיד
  choice: a pessoa fiel
  rationale: Designa quem se caracteriza por lealdade e devoção. A formulação é natural em português, preserva o singular representativo e evita restringir o referente a um sexo.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Mantém a concisão e a amplitude do hebraico; no contexto, pode indicar a terra habitada ou o território do povo.
- source_word: וְיָשָׁר
  choice: ninguém íntegro
  rationale: יָשָׁר descreve retidão moral. Com אָיִן, “não há ninguém íntegro” reproduz naturalmente a negação existencial.
- source_word: בָּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם é genérico neste contexto e se refere à humanidade, não apenas aos homens.
- source_word: כֻּלָּם לְדָמִים יֶאֱרֹבוּ
  choice: Todos ficam à espreita para derramar sangue
  rationale: A expressão descreve uma emboscada com intenção homicida. “Derramar sangue” torna explícito em português o valor idiomático do plural hebraico “sangues” sem enfraquecer sua violência.
- source_word: אִישׁ
  choice: cada um
  rationale: O substantivo tem força distributiva aqui e destaca a responsabilidade individual.
- source_word: אָחִיהוּ
  choice: seu irmão
  rationale: Preserva a imagem concreta de traição dentro da própria comunidade, sem reduzir o termo a irmão biológico.
- source_word: יָצ֥וּדוּ חֵרֶם
  choice: caça ... com uma rede
  rationale: O verbo pertence ao campo semântico da caça e captura; חֵרֶם designa aqui uma rede usada para apanhar a vítima.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: entre os seres humanos
  alternative: entre as pessoas
  rationale: O hebraico abrange a humanidade em geral. A tradução evita uma leitura exclusivamente masculina e mantém o alcance universal da denúncia.
- issue: Alcance de אָחִיהוּ
  choice: seu irmão
  alternative: seu semelhante
  rationale: A forma literal intensifica a denúncia da ruptura dos vínculos comunitários. A nota esclarece que o sentido pode ultrapassar o parentesco biológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo, o tom severo do lamento profético, o singular representativo e a imagem de caça do texto hebraico.
