  text: כִּ/ימֵ֥י צֵאתְ/ךָ֖ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אַרְאֶ֖/נּוּ נִפְלָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
translation:
  language: pt
  text: Como nos dias em que você saiu da terra do Egito, mostrarei a ele coisas maravilhosas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mostrarei a eles coisas maravilhosas”. O sufixo hebraico está no singular (“a ele”), mas pode referir-se coletivamente a Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּימֵי
  choice: Como nos dias
  rationale: A preposição כְּ introduz uma comparação com o período do êxodo; “Como nos dias” conserva essa força comparativa de modo natural e digno.
- source_word: צֵאתְךָ
  choice: em que você saiu
  rationale: O infinitivo construto com sufixo de segunda pessoa masculina singular significa literalmente “seu sair”. A oração temporal é clara em português e mantém a referência direta ao interlocutor.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Preserva todos os elementos da expressão hebraica tradicional do êxodo, bem como seu tom solene.
- source_word: אַרְאֶנּוּ
  choice: mostrarei a ele
  rationale: O hifil de ראה significa “fazer ver, mostrar”, e o sufixo é masculino singular. A tradução mantém o singular gramatical em vez de o converter silenciosamente em plural.
- source_word: נִפְלָאוֹת
  choice: coisas maravilhosas
  rationale: Designa feitos extraordinários que despertam admiração. “Coisas maravilhosas” preserva a amplitude sem restringir o sentido a milagres em acepção técnica.
theological_decisions:
- issue: Referente do sufixo masculino singular em אַרְאֶנּוּ
  choice: Manter “a ele” no texto principal, possivelmente com referência coletiva a Israel/Jacó.
  alternative: Traduzir “a eles”, entendendo diretamente a coletividade do povo.
  rationale: A forma hebraica é singular, embora o contexto permita que Israel seja concebido coletivamente. A tradução conserva a tensão gramatical e contextual em vez de resolvê-la no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O tratamento por “você” torna explícita a segunda pessoa singular do hebraico sem recorrer ao regionalismo “tu”; a colocação pronominal em “mostrarei” mantém um tom bíblico natural, sem arcaísmo excessivo.
