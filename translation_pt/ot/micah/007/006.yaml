source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: pt
  text: Pois o filho trata o pai com desprezo[a]; a filha se levanta contra a mãe, e a nora, contra a sogra; os inimigos de um homem são os homens de sua própria casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desonra o pai”. O verbo hebraico pode indicar tratar alguém de maneira vergonhosa ou com desprezo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os homens de sua casa”. A expressão pode referir-se de modo mais amplo aos integrantes da própria casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do lamento anterior e preserva a relação causal-explicativa de modo natural em português.
- source_word: בֵן
  choice: o filho
  rationale: O singular sem artigo tem valor representativo; em português, o artigo definido é idiomático nessa série de relações familiares genéricas.
- source_word: מְנַבֵּל
  choice: trata ... com desprezo
  rationale: O particípio piel de נבל expressa ação contínua ou característica de aviltar, desonrar ou tratar alguém de forma vergonhosa; esta formulação comunica claramente o desprezo relacional.
- source_word: אָב
  choice: o pai
  rationale: O vínculo possessivo é evidente pela relação familiar e não precisa ser explicitado em português.
- source_word: בַּת קָמָה בְאִמָּהּ
  choice: a filha se levanta contra a mãe
  rationale: Preserva a imagem verbal de קום e torna explícito o valor adversativo da preposição ב neste contexto.
- source_word: כַּלָּה בַּחֲמֹתָהּ
  choice: a nora, contra a sogra
  rationale: No contexto das relações domésticas, כַּלָּה e חמות designam especificamente nora e sogra; a elipse do verbo é natural e acompanha a estrutura hebraica.
- source_word: אֹיְבֵי אִישׁ
  choice: os inimigos de um homem
  rationale: Mantém o substantivo masculino singular representativo אִישׁ sem neutralizá-lo.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: os de sua própria casa
  rationale: Reproduz o paralelismo com 'inimigos' e o idioma doméstico sem restringir indevidamente a expressão apenas a homens adultos; o sentido literal é registrado em nota.
theological_decisions:
- issue: Linguagem de gênero na expressão doméstica final
  choice: Manter 'um homem' para אִישׁ e traduzir אַנְשֵׁי בֵיתוֹ idiomaticamente como 'os de sua própria casa'.
  alternative: '''os homens de sua casa'' ou ''os membros de sua família'''
  rationale: אִישׁ é explicitamente masculino e foi preservado. Já אַנְשֵׁי בֵיתוֹ, embora literalmente masculino, pode funcionar como expressão coletiva para os integrantes da casa. A tradução principal conserva essa amplitude real, enquanto a nota apresenta a forma literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de relações familiares preserva a progressão enfática do hebraico; a elipse em 'e a nora, contra a sogra' evita repetição pesada sem perder o sentido.
