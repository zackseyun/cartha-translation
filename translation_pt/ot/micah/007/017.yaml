  verdict: revise
  source_fidelity: A imagem inicial e o paralelismo de temor são bem preservados. Contudo, “se voltarão” acrescenta uma ideia de mudança de direção/atitude que אינה é expressa pelo verbo פחד; no contexto, a construção com אֶל comunica aproximação ou comparecimento temeroso diante de Yahweh. “Virão com temor a” reproduz isso de forma mais segura.
  naturalness: O texto é claro, poético e amplamente compreensível. “Virão com temor” evita a conotação potencialmente interpretativa de “se voltarão aterrorizados” e mantém um português moderno e digno.
  terminology: “Yahweh” segue a decisão do projeto. “Serpente”, “pó”, “animais que rastejam” e a dupla “temor/medo” conservam adequadamente as imagens e o registro. “Fortalezas” é uma opção contextual mais direta para מִסְגְּרֹתֵיהֶם, com as alternativas mantidas em nota.
  issues:
