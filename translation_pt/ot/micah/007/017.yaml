id: MIC.7.17
reference: Micah 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: pt
  text: Lamberão o pó como a serpente; como os animais que rastejam pelo chão, sairão tremendo de suas fortalezas[a]. Virão com temor a Yahweh, nosso Deus, e terão medo de ti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seus recintos”, “de seus esconderijos” ou “dos lugares onde estão encerrados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficarão atemorizados diante de ti”; o verbo hebraico também pode incluir a ideia de reverência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: Lamberão o pó
  rationale: Preserva a imagem concreta de humilhação expressa pelo piel de לחך e pelo substantivo עָפָר.
- source_word: כַּנָּחָשׁ
  choice: como a serpente
  rationale: “Serpente” é natural no registro bíblico em português e mantém a possível ressonância de Gênesis 3.14 sem torná-la explícita.
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: como os animais que rastejam pelo chão
  rationale: Comunica de modo claro a referência ampla a criaturas rastejantes, sem restringi-la indevidamente a uma classe zoológica.
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  choice: sairão tremendo de seus esconderijos
  rationale: רגז descreve tremor ou agitação; a preposição מן indica a saída. “Esconderijos” representa o sentido contextual de lugares fechados ou protegidos, sem pressupor fortificações militares.
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: Eles se voltarão aterrorizados para Yahweh, nosso Deus
  rationale: A formulação preserva a direção marcada por אֶל e o forte temor de פחד, evitando repetir “sairão/virão” em português.
- source_word: וְיִרְאוּ מִמֶּךָּ
  choice: e terão medo de ti
  rationale: Mantém ירא como temor no paralelismo com פחד e traduz מן, após verbo de temor, de modo idiomático como “de ti”; a possível nuance de reverência permanece registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração representa o nome próprio divino e segue a orientação fornecida para o projeto, sem substituir o nome por um título.
- issue: Nuance dos dois verbos de temor, פחד e ירא
  choice: aterrorizados / terão medo
  alternative: virão com temor / ficarão reverentes diante de ti
  rationale: O contexto de nações humilhadas e o paralelismo favorecem medo intenso; a possível nuance de reverência em ירא não é eliminada, mas indicada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe poética e as imagens concretas foram preservadas, enquanto a ordem da terceira oração foi ajustada para soar natural. Todos os marcadores de nota aparecem no texto.
