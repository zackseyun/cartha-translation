  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: pt
  text: 'Eu, porém, olharei com expectativa para Yahweh;

    esperarei[a] pelo Deus da minha salvação.

    Meu Deus me ouvirá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terei esperança no Deus da minha salvação”. O verbo hebraico pode expressar uma espera marcada pela esperança.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַאֲנִי
  choice: Eu, porém
  rationale: A conjunção e o pronome independente destacam o contraste entre a confiança do profeta e a corrupção e falta de lealdade descritas no contexto anterior.
- source_word: בַּיהוָה אֲצַפֶּה
  choice: olharei para Yahweh
  rationale: צפה descreve o ato de olhar ou vigiar com expectativa. A tradução conserva a imagem visual e apresenta Yahweh como aquele para quem o profeta se volta confiantemente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אוֹחִילָה
  choice: esperarei
  rationale: O verbo יחל pode indicar tanto esperar como ter esperança. “Esperarei” forma uma progressão natural depois de “olharei”, enquanto a nota preserva explicitamente a outra nuance lexical.
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: pelo Deus da minha salvação
  rationale: Mantém a estrutura da expressão hebraica e seu peso poético e teológico, em português natural.
- source_word: יִשְׁמָעֵנִי
  choice: me ouvirá
  rationale: Traduz diretamente o sentido básico de שׁמע. No contexto de oração, pode sugerir uma resposta favorável, mas “me responderá” tornaria explícito algo apenas implícito.
- source_word: אֱלֹהָי
  choice: Meu Deus
  rationale: Preserva a confissão pessoal e inicia a oração final com naturalidade em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Nuance de esperança em אוֹחִילָה
  choice: esperarei
  alternative: terei esperança; esperarei com esperança
  rationale: O verbo admite as ideias relacionadas de esperar e ter esperança. O texto principal mantém a concisão e o paralelismo, e a nota registra a ambiguidade genuína sem resolvê-la silenciosamente.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A disposição em três linhas preserva o movimento poético: olhar expectante, espera confiante e certeza de ser ouvido.'
