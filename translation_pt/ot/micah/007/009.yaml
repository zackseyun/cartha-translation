id: MIC.7.9
reference: Micah 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: pt
  text: Suportarei a indignação de Yahweh, pois pequei contra ele, até que ele defenda a minha causa e faça justiça por mim. Ele me levará para a luz; verei a sua justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua retidão”. O termo hebraico pode indicar tanto retidão quanto justiça, especialmente num contexto jurídico de vindicação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: a indignação de Yahweh
  rationale: זַעַף expressa ira ou indignação; “indignação” preserva o tom moral e judicial da disciplina merecida. O nome יהוה é transliterado como “Yahweh”.
- source_word: אֶשָּׂא
  choice: Suportarei
  rationale: נשא, neste contexto, significa carregar ou aguentar uma consequência; “suportarei” é natural em português e comunica a aceitação da disciplina.
- source_word: כִּי חָטָאתִי לוֹ
  choice: pois pequei contra ele
  rationale: כִּי introduz a causa, e ל com חטא indica aquele contra quem se pecou.
- source_word: יָרִיב רִיבִי
  choice: ele defenda a minha causa
  rationale: A construção com verbo e substantivo cognatos é uma expressão jurídica para assumir e sustentar a causa de alguém.
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: e faça justiça por mim
  rationale: מִשְׁפָּטִי aponta aqui para uma decisão judicial favorável ou vindicação; a formulação conserva tanto a ação jurídica quanto seu benefício para a pessoa que fala.
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: Ele me levará para a luz
  rationale: O hifil de יצא é causativo, “fazer sair”; em português, “levar para a luz” conserva de modo natural a imagem de sair da aflição ou escuridão para a vindicação.
- source_word: אֶרְאֶה בְּצִדְקָתוֹ
  choice: verei a sua justiça
  rationale: ראה admite o sentido simples de “ver”. צדקה, neste contexto forense, descreve a justiça manifestada por Yahweh ao vindicar a pessoa que fala.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a leitura indicada pela camada de consulta fornecida.
- issue: Sentido de בְּצִדְקָתוֹ no contexto de vindicação
  choice: sua justiça
  alternative: sua retidão
  rationale: צדקה abrange retidão e justiça. Como o contexto é jurídico — defender a causa e fazer justiça — “justiça” é natural no texto principal, enquanto a nota preserva “retidão” como alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A linguagem jurídica do hebraico foi preservada sem tecnicismo excessivo; a repetição de “justiça” reflete a coesão forense do verso.
