  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: pt
  text: Mostrarás fidelidade a Jacó e amor leal a Abraão, que juraste aos nossos antepassados desde os tempos antigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת (’emet)
  choice: fidelidade
  rationale: Neste contexto de promessas da aliança, o termo expressa constância e confiabilidade, não apenas verdade em sentido abstrato.
- source_word: חֶסֶד (ḥesed)
  choice: amor leal
  rationale: Reproduz a combinação de amor, compromisso e lealdade duradoura inerente ao termo, evitando restringi-lo a mera bondade ou misericórdia.
- source_word: אֲבֹתֵינוּ (’avotenu)
  choice: nossos antepassados
  rationale: Forma atual, inclusiva e amplamente compreensível para os ancestrais de Israel; evita que 'pais' seja entendido apenas como progenitores imediatos.
- source_word: מִימֵי קֶדֶם (mimei qedem)
  choice: desde os tempos antigos
  rationale: Expressão portuguesa natural que preserva a ideia de um passado remoto.
theological_decisions:
- issue: Relação entre a fidelidade e o amor leal prometidos e o juramento divino
  choice: conforme juraste
  alternative: os quais juraste
  rationale: O relativo אֲשֶׁר pode introduzir o conteúdo ou a conformidade com o juramento. 'Conforme juraste' mantém a ligação com a promessa feita aos antepassados sem sugerir de modo artificial que os substantivos abstratos foram, eles próprios, o objeto gramatical direto do juramento.
- issue: Jacó e Abraão como destinatários representativos
  choice: a Jacó ... a Abraão
  alternative: à descendência de Jacó ... à descendência de Abraão
  rationale: Mantém os nomes e a forma poética do hebraico, sem explicitar uma interpretação corporativa que o texto deixa implícita.
translation_notes:
  register: Português atual, digno e claro, com futuro verbal sem pronome explícito. 'Amor leal' comunica o caráter pactual de חֶסֶד de modo acessível; 'antepassados' tem legibilidade ampla tanto no Brasil quanto em outros contextos lusófonos.
