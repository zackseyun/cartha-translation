  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: pt
  text: Pastoreia o teu povo com o teu cajado, o rebanho da tua herança, que habita isolado numa floresta, no meio do Carmelo[a]. Que ele paste em Basã e Gileade, como nos dias antigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em meio a terras de pastagem” ou “em terra fértil”. O hebraico Carmelo pode designar tanto a região do Carmelo como uma terra fértil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  choice: Pastoreia
  rationale: O imperativo é dirigido a Deus. “Pastoreia” conserva a metáfora pastoral e inclui cuidado, direção e alimentação do rebanho.
- source_word: בְשִׁבְטֶךָ
  choice: com o teu cajado
  rationale: No contexto do pastoreio, שֵׁבֶט designa naturalmente o cajado do pastor. A escolha mantém a imagem de cuidado e direção, sem realçar indevidamente a punição.
- source_word: צֹאן נַחֲלָתֶךָ
  choice: o rebanho da tua herança
  rationale: A expressão mantém tanto a imagem coletiva do rebanho como a linguagem de pertença pactual comunicada por “herança”.
- source_word: שֹׁכְנִי לְבָדָד
  choice: que habita isolado
  rationale: A formulação expressa uma condição contínua de moradia separada e concorda naturalmente em português com o coletivo singular “rebanho”.
- source_word: יַעַר
  choice: numa floresta
  rationale: Preserva a imagem hebraica de terreno arborizado e do relativo isolamento do rebanho.
- source_word: בְּתוֹךְ כַּרְמֶל
  choice: no meio do Carmelo
  rationale: Mantém Carmelo como topônimo, em harmonia com a menção posterior de Basã e Gileade, sem ocultar em nota a possibilidade de o termo indicar terra fértil ou de pastagem.
- source_word: יִרְעוּ
  choice: Que ele paste
  rationale: O imperfeito de valor volitivo continua a oração como pedido. O singular retoma naturalmente o substantivo coletivo “rebanho”, enquanto “paste” preserva a imagem pastoral.
- source_word: בָשָׁן וְגִלְעָד
  choice: em Basã e Gileade
  rationale: Conserva os nomes das regiões conhecidas por suas pastagens férteis.
- source_word: כִּימֵי עוֹלָם
  choice: como nos dias antigos
  rationale: Neste contexto, עוֹלָם aponta para um passado remoto, não para a eternidade em sentido metafísico.
theological_decisions:
- issue: Cuidado divino ou disciplina em שֵׁבֶט
  choice: “cajado” no quadro da metáfora pastoral
  alternative: “vara”, com possível ênfase em autoridade ou disciplina
  rationale: O contexto imediato pede que Deus cuide do povo e lhe dê pastagem. “Cajado” mantém coesa a metáfora do pastor sem introduzir uma ênfase punitiva que o verso não destaca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A linguagem pastoral e a estrutura de oração foram preservadas, evitando arcaísmos desnecessários.
