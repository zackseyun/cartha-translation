base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: pt
  text: 'As duas mãos se dedicam ao mal, para fazê-lo bem[a]: o governante pede, o juiz age por pagamento[b], e o poderoso declara o desejo de sua alma; assim, eles o entrelaçam[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As mãos se ocupam do mal com habilidade”. O hebraico ressalta empenho e competência na prática do mal.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é conciso: “o juiz por pagamento”. Pode significar que o juiz pede suborno ou que julga em troca de suborno.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “eles o torcem juntos”. A imagem é de corrupção coordenada, como um plano trançado ou entrelaçado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  choice: As duas mãos se dedicam ao mal
  rationale: O dual כַּפַּיִם permite explicitar “as duas mãos”, ressaltando empenho integral. “Se dedicam ao mal” expressa de modo natural o envolvimento ativo indicado pela construção difícil com עַל.
- source_word: לְהֵיטִיב
  choice: para fazê-lo bem
  rationale: 'Preserva a ironia do hifil de יטב: eles demonstram habilidade em praticar o mal.'
- source_word: הַשַּׂר שֹׁאֵל
  choice: o governante pede
  rationale: שַׂר designa uma autoridade ou dirigente; “governante” é claro e amplo. “Pede” mantém o verbo simples שׁאל sem especificar no texto principal o objeto elíptico.
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: o juiz age por pagamento
  rationale: A expressão hebraica é elíptica. Esta formulação conserva a relação do juiz com pagamento corrupto sem acrescentar que ele pede ou julga, possibilidades explicitadas em nota.
- source_word: וְהַגָּדוֹל
  choice: o poderoso
  rationale: O adjetivo substantivado indica uma pessoa socialmente importante ou influente. “Poderoso” comunica essa posição com naturalidade em português.
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: declara o desejo de sua alma
  rationale: Mantém a linguagem interior de נֶפֶשׁ e não restringe הַוָּה a uma forma específica de cobiça ou perversidade, preservando sua amplitude semântica.
- source_word: וַיְעַבְּתוּהָ
  choice: assim, eles o entrelaçam
  rationale: O verbo עבת sugere torcer, trançar ou entrelaçar. O pronome retoma de maneira implícita o mal ou esquema corrupto articulado pelos envolvidos.
