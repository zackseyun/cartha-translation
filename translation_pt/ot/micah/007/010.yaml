base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: pt
  text: 'Então minha inimiga verá, e a vergonha a cobrirá — aquela que me diz: “Onde está Yahweh, o seu Deus?” Meus olhos a verão[a]; agora ela será pisoteada como a lama das ruas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meus olhos a contemplarão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “ela será entregue ao pisoteio, como a lama das ruas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵרֶא אֹיַבְתִּי
  choice: Então minha inimiga verá
  rationale: O imperfeito qal feminino singular de ראה, seguido por אֹיַבְתִּי, dá continuidade à sequência do contexto. “Então” expressa a progressão discursiva, e “inimiga” preserva o gênero feminino marcado no hebraico e retomado ao longo do versículo.
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: e a vergonha a cobrirá
  rationale: Mantém a imagem hebraica de a vergonha envolver a inimiga, em formulação natural e digna em português.
- source_word: הָאֹמְרָה אֵלַי
  choice: aquela que me dizia
  rationale: O particípio feminino substantivado identifica a inimiga por sua provocação. O imperfeito “dizia” comunica naturalmente a zombaria proferida contra a falante.
- source_word: אַיּוֹ יְהוָה אֱלֹהָיִךְ
  choice: Onde está Yahweh, o seu Deus?
  rationale: Reproduz diretamente a pergunta de escárnio. “Yahweh” translitera o nome divino, enquanto “o seu Deus” representa o sufixo feminino singular dirigido à personagem coletiva feminina.
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: Meus olhos a verão
  rationale: Conserva o sujeito enfático “meus olhos” e o sentido básico de ראה. A construção com ב pode também sugerir contemplar o que acontece à inimiga, possibilidade registrada em nota.
- source_word: עַתָּה תִּהְיֶה לְמִרְמָס
  choice: agora ela será pisoteada
  rationale: “Agora” preserva a reversão marcada por עַתָּה. A expressão לְמִרְמָס designa aquilo que é entregue ao pisoteio; a voz passiva oferece em português uma equivalência clara e natural.
- source_word: כְּטִיט חוּצוֹת
  choice: como a lama das ruas
  rationale: Preserva a comparação com a lama ou o lodo dos espaços públicos, onde é pisada pelos transeuntes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Tom de vindicação em עֵינַי תִּרְאֶינָּה בָּהּ
  choice: Meus olhos a verão
  alternative: Meus olhos contemplarão o que acontecerá com ela
  rationale: A tradução principal conserva a forma concreta e a ambiguidade do hebraico, sem explicitar se a visão envolve satisfação com a queda da inimiga.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O feminino explícito em “inimiga” e nas retomadas pronominais preserva a personificação feminina do texto hebraico. A sintaxe mantém o paralelismo e a mudança repentina da zombaria para a vindicação.
