  text: אַל תַּאֲמִ֣ינוּ בְ/רֵ֔עַ אַֽל תִּבְטְח֖וּ בְּ/אַלּ֑וּף מִ/שֹּׁכֶ֣בֶת חֵיקֶ֔/ךָ שְׁמֹ֖ר פִּתְחֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: pt
  text: Não confiem no próximo[a]; não depositem confiança no amigo íntimo[b]. Da mulher que se deita em teu regaço[c], guarda as portas da tua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amigo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “confidente” ou “companheiro íntimo”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “da mulher que se deita no teu regaço”. Refere-se à companheira de maior intimidade, provavelmente a esposa.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: próximo
  rationale: O termo abrange alguém de relação social próxima e pode significar tanto “próximo” como “amigo”. “Próximo” mantém essa amplitude sem pressupor intimidade.
- source_word: אַלּוּף
  choice: amigo íntimo
  rationale: Neste contexto, designa um associado familiar ou confidente, e não um chefe. A expressão também intensifica a proximidade em relação ao primeiro termo.
- source_word: תַּאֲמִינוּ
  choice: confiem
  rationale: O hifil de אמן com ב indica depositar confiança em alguém, não apenas aceitar algo como verdadeiro.
- source_word: תִּבְטְחוּ
  choice: depositem confiança
  rationale: A formulação preserva o paralelismo sinonímico com o primeiro verbo, evitando repetição rígida em português.
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: Mesmo diante da mulher que repousa em seus braços
  rationale: A expressão retrata literalmente uma mulher deitada no regaço ou junto ao peito do interlocutor, isto é, uma relação doméstica de máxima intimidade, provavelmente a esposa. “Mesmo diante de” comunica naturalmente que nem na presença dela se deve falar sem cautela.
- source_word: חֵיק
  choice: braços
  rationale: Embora denote literalmente peito, regaço ou seio, “nos braços” expressa de modo natural em português a intimidade física evocada pelo idioma hebraico.
- source_word: שְׁמֹר
  choice: guardem
  rationale: O imperativo pede proteção vigilante e combina com a metáfora das portas.
- source_word: פִּתְחֵי פִיךָ
  choice: as portas da sua boca
  rationale: Mantém a imagem hebraica vívida de controlar o acesso à fala, sem reduzi-la a uma paráfrase.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas plurais coerentes com os imperativos hebraicos. A metáfora “portas da sua boca” foi preservada; “repousa em seus braços” evita o arcaísmo de “seio” ou “regaço” no texto principal.
