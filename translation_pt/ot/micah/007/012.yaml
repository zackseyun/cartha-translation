source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: pt
  text: Naquele dia, virão até você da Assíria e das cidades do Egito[a], e do Egito até o Rio[b], de mar a mar e de montanha a montanha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico מָצוֹר também pode ser entendido como “fortaleza”, “cerco” ou “cidades fortificadas”, em vez de uma designação do Egito.
    reason: lexical_alternative
  - marker: b
    text: “O Rio” provavelmente se refere ao Eufrates.
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: Naquele dia
  rationale: Expressão temporal profética natural em português, preservando a referência enfática a um dia anunciado.
- source_word: וְעָדֶיךָ יָבוֹא
  choice: virão até você
  rationale: Embora o verbo hebraico esteja no singular, a enumeração de regiões favorece um sujeito coletivo; o plural comunica naturalmente a chegada de pessoas de muitos lugares. O pronome singular mantém o destinatário coletivo personificado.
- source_word: לְמִנִּי אַשּׁוּר
  choice: desde a Assíria
  rationale: A locução indica a origem ou o limite de procedência; 'Assíria' é a forma portuguesa consagrada do topônimo.
- source_word: וְעָרֵי מָצוֹר
  choice: e as cidades do Egito
  rationale: No paralelismo geográfico, מָצוֹר é entendido como designação poética do Egito; a possibilidade de significar 'fortaleza' ou 'cidades fortificadas' é preservada em nota.
- source_word: וּלְמִנִּי מָצוֹר
  choice: e desde o Egito
  rationale: A leitura como topônimo mantém a sequência geográfica com a Assíria e o Rio, sem ocultar em nota a ambiguidade lexical.
- source_word: וְעַד נָהָר
  choice: até o Rio
  rationale: Em contexto geopolítico bíblico, 'o Rio' provavelmente designa o Eufrates. A formulação concisa preserva o caráter alusivo do hebraico.
- source_word: וְיָם מִיָּם
  choice: de mar a mar
  rationale: Expressão idiomática que representa a ampla extensão indicada pelo hebraico.
- source_word: וְהַר הָהָר
  choice: e de montanha a montanha
  rationale: Reproduz o paralelismo espacial e a ideia de extensão abrangente, acrescentando apenas a preposição exigida pelo português natural.
theological_decisions:
- issue: Referente do verbo singular יָבוֹא em meio a várias regiões de procedência
  choice: 'Sentido coletivo no plural: ''virão até você'''
  alternative: 'Singular: ''ele virá até você'' ou ''alguém virá até você'''
  rationale: A lista de terras e limites sugere a chegada coletiva de pessoas dispersas. O plural evita insinuar sem base segura um único mensageiro, embora a forma verbal singular seja reconhecida.
- issue: Sentido de מָצוֹר neste versículo
  choice: Topônimo poético referente ao Egito
  alternative: 'Substantivo comum: ''fortaleza'', ''cerco'' ou ''cidade(s) fortificada(s)'''
  rationale: O paralelismo com Assíria e o Rio favorece uma sequência de referências geográficas. Como a ambiguidade lexical é genuína, a alternativa é explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição 'desde... desde...' conserva o movimento geográfico do texto, enquanto 'de mar a mar' e 'de montanha a montanha' mantêm o paralelismo poético.
