id: MIC.7.19
reference: Micah 7:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: pt
  text: Ele voltará a ter compaixão de nós; subjugará as nossas iniquidades. Tu lançarás[a] nas profundezas do mar todos os pecados deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico muda inesperadamente da terceira pessoa (“Ele...”) para o tratamento direto na segunda pessoa: “Tu lançarás”. Alguns testemunhos antigos e traduções regularizam a frase como “e ele lançará”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico traz “pecados deles”; muitas traduções usam “nossos pecados” para harmonizar a expressão com “nossas iniquidades” na oração anterior.
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב
  choice: voltará a
  rationale: 'Com o verbo seguinte, expressa a repetição da ação: Deus voltará a ter compaixão. A formulação preserva a ideia de retorno sem soar artificial em português.'
- source_word: יְרַחֲמֵנוּ
  choice: ter compaixão de nós
  rationale: רחם comunica compaixão profunda e misericordiosa. A expressão é clara, atual e conserva a força afetiva do termo.
- source_word: יִכְבֹּשׁ
  choice: subjugará
  rationale: כבש significa sujeitar ou dominar. Com “iniquidades” como objeto, a escolha mantém a imagem de uma vitória decisiva sobre elas sem ampliar indevidamente a metáfora.
- source_word: עֲוֺנֹתֵינוּ
  choice: as nossas iniquidades
  rationale: עון pode designar iniquidade e culpa. “Iniquidades” preserva a distinção lexical em relação a חטאת, traduzido depois por “pecados”.
- source_word: וְתַשְׁלִיךְ
  choice: Tu lançarás
  rationale: A forma verbal está na segunda pessoa masculina singular e cria uma mudança real em relação à terceira pessoa das orações anteriores. A tradução conserva essa mudança do texto massorético.
- source_word: בִּמְצֻלוֹת יָם
  choice: nas profundezas do mar
  rationale: מצולות designa lugares profundos, especialmente do mar. A expressão portuguesa é natural e mantém a imagem vívida de remoção completa.
- source_word: חַטֹּאותָם
  choice: os pecados deles
  rationale: O sufixo hebraico é de terceira pessoa do plural, “deles”, e não de primeira pessoa do plural, “nossos”. A tradução preserva a leitura recebida apesar da mudança abrupta de referente.
theological_decisions:
- issue: Mudanças de pessoa e de referente dentro do versículo
  choice: 'Manter as formas do texto massorético: terceira pessoa (“Ele...”), depois tratamento direto na segunda pessoa (“Tu lançarás”) e, por fim, o sufixo de terceira pessoa do plural (“pecados deles”).'
  alternative: 'Regularizar toda a frase: “Ele voltará a ter compaixão de nós; subjugará as nossas iniquidades e lançará todos os nossos pecados nas profundezas do mar.”'
  rationale: As mudanças estão presentes no hebraico e podem refletir uma passagem para a oração direta ou uma dificuldade textual. Mantê-las evita resolver silenciosamente uma ambiguidade genuína; as formas regularizadas são registradas nas notas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Tu lançarás” é mantido por precisão textual, mesmo com a mudança abrupta de pessoa; “iniquidades” conserva a distinção lexical e o tom poético do versículo.
