revisions:
- from: Quem é Deus como tu[a], que perdoa a iniquidade e passa por cima da transgressão do remanescente da sua herança? Ele não retém para sempre a sua ira, pois tem prazer no amor leal.[b]
  to: Que Deus é como tu, que perdoa a iniquidade[a] e passa por alto a transgressão para o remanescente de sua herança? Ele não retém para sempre a sua ira, pois tem prazer no amor leal.[b]
  rationale: A revisão torna a pergunta inicial idiomática, restitui o valor beneficiário de לִשְׁאֵרִית e usa uma expressão portuguesa mais natural para עֹבֵר עַל. Mantêm-se a distinção lexical entre «iniquidade» e «transgressão», a formulação sóbria sobre a ira e «amor leal» para חֶסֶד. A âncora da nota a foi deslocada para «iniquidade», a expressão diretamente explicada pela nota.
