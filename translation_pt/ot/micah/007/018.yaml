source:
  edition: WLC
  text: מִי אֵ֣ל כָּמ֗וֹ/ךָ נֹשֵׂ֤א עָוֺן֙ וְ/עֹבֵ֣ר עַל פֶּ֔שַׁע לִ/שְׁאֵרִ֖ית נַחֲלָת֑/וֹ לֹא הֶחֱזִ֤יק לָ/עַד֙ אַפּ֔/וֹ כִּֽי חָפֵ֥ץ חֶ֖סֶד הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: pt
  text: Que Deus é como tu, que perdoa a iniquidade[a] e passa por alto a transgressão para o remanescente de sua herança? Ele não retém para sempre a sua ira, pois tem prazer no amor leal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que carrega a iniquidade”. Nesse contexto, a expressão hebraica tem o sentido de remover a culpa ou perdoar.'
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico חֶסֶד (ḥésed), que também pode ser traduzido como “misericórdia”, “amor constante” ou “amor da aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: Quem é Deus como tu
  rationale: Mantém a pergunta retórica exclamativa e a afirmação da incomparabilidade de Deus, com formulação natural em português e possível eco do nome Miqueias.
- source_word: נֹשֵׂא עָוֹן
  choice: que perdoa a iniquidade
  rationale: Embora נֹשֵׂא tenha literalmente a imagem de carregar, a expressão idiomática aqui comunica remover ou perdoar a culpa; 'perdoa' é claro e natural, enquanto 'iniquidade' preserva a gravidade moral do termo.
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: e passa por cima da transgressão
  rationale: Preserva a imagem verbal hebraica de passar por cima de uma ofensa, sem nivelá-la completamente ao verbo anterior.
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: do remanescente da sua herança
  rationale: O לְ assinala aqueles em favor de quem ocorre o perdão; a construção portuguesa com 'do remanescente' liga naturalmente ambos os atos ao povo beneficiado. 'Remanescente' e 'herança' conservam a linguagem profética e pactual.
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: Ele não retém para sempre a sua ira
  rationale: '''Retém'' representa o sentido de manter ou conservar, em registro digno e corrente; ''ira'' expressa o idiomatismo de אַף com a força adequada ao contexto.'
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: pois tem prazer no amor leal
  rationale: '''Tem prazer'' comunica חָפֵץ, e ''amor leal'' procura reunir em linguagem portuguesa clara as dimensões de misericórdia, fidelidade e compromisso presentes em חֶסֶד.'
theological_decisions:
- issue: Tradução de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; amor da aliança
  rationale: '''Amor leal'' preserva tanto o amor quanto a fidelidade relacional do termo, sem limitá-lo apenas à compaixão nem explicitar no texto uma formulação interpretativa como ''amor da aliança''.'
- issue: Distinção entre עָוֹן e פֶּשַׁע
  choice: iniquidade ... transgressão
  alternative: culpa ... rebelião; pecado ... ofensa
  rationale: Mantém dois termos distintos como no hebraico, sem impor uma diferenciação teológica rígida além da textura lexical do texto.
- issue: Imagem de נֹשֵׂא no idioma de perdão
  choice: perdoa
  alternative: carrega; remove
  rationale: A escolha comunica o valor idiomático no contexto. Uma nota registra a imagem mais literal, preservando a transparência em relação ao hebraico sem produzir uma frase portuguesa potencialmente ambígua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'tu' por corresponder à interpelação direta e solene do hebraico; evita arcaísmos verbais, pois a única forma associada é 'é'. As notas esclarecem as duas principais densidades lexicais sem sobrecarregar o versículo.
