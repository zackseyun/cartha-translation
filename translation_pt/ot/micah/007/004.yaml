source:
  edition: WLC
  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: pt
  text: O melhor deles é como um espinheiro; o íntegro é pior que uma cerca de espinhos. Chegou o dia dos seus sentinelas, o dia do seu castigo[a]; agora virá a confusão deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua visitação” ou “da sua prestação de contas”. O termo hebraico pode indicar visitação, inspeção ou punição; aqui, o contexto aponta para o dia em que o juízo recai.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָם
  choice: o melhor deles
  rationale: O substantivo/adjetivo com sufixo de terceira pessoa plural tem sentido comparativo no contexto e designa o melhor entre o povo descrito.
- source_word: כְּחֵדֶק
  choice: como um espinheiro
  rationale: חֵדֶק designa uma planta espinhosa; “espinheiro” preserva de modo claro a imagem de algo nocivo e hostil.
- source_word: יָשָׁר
  choice: o mais íntegro
  rationale: O adjetivo substantivado se refere à pessoa considerada moralmente reta; o superlativo relativo harmoniza-se com “o melhor deles” e expressa naturalmente o contraste.
- source_word: מִמְּסוּכָה
  choice: pior que uma cerca de espinhos
  rationale: A preposição מִן introduz a comparação, e מְסוּכָה denota uma cerca ou sebe, provavelmente espinhosa no contexto. “Pior” explicita a comparação negativa implícita sem eliminar a imagem.
- source_word: מְצַפֶּיךָ
  choice: seus sentinelas
  rationale: O particípio de צפה pode designar os que vigiam e anunciam o que se aproxima, provavelmente sentinelas proféticos neste contexto. A formulação mantém a concisão e a possível ambiguidade da relação genitiva.
- source_word: פְּקֻדָּתְךָ
  choice: seu castigo
  rationale: פְּקֻדָּה pode indicar visitação, inspeção, prestação de contas ou punição. No oráculo de juízo, “castigo” comunica com clareza a força judicial, enquanto a alternativa mais ampla é registrada em nota.
- source_word: בָאָה
  choice: chegou
  rationale: O perfeito apresenta o acontecimento como já chegado ou firmemente realizado; “chegou” reproduz esse aspecto de maneira natural.
- source_word: תִהְיֶה מְבוּכָתָם
  choice: agora será a confusão deles
  rationale: A tradução conserva a construção nominal do hebraico, “a confusão deles será”, e sua referência temporal, sem transformar o enunciado em uma paráfrase excessivamente explicativa.
theological_decisions:
- issue: Sentido de פְּקֻדָּתְךָ no oráculo de juízo
  choice: seu castigo
  alternative: sua visitação; sua prestação de contas
  rationale: A denúncia da corrupção social culmina no anúncio de calamidade, favorecendo o sentido punitivo. A tradução não especifica agente, forma ou doutrina do castigo além do que o contexto afirma; a amplitude lexical é preservada em nota.
- issue: Relação entre “o dia dos seus sentinelas” e “o dia do seu castigo”
  choice: manter as duas expressões em aposição
  alternative: o dia anunciado pelos seus sentinelas, isto é, o dia do seu castigo
  rationale: O hebraico é conciso e não explicita se os sentinelas anunciaram esse dia ou se ele lhes pertence em outro sentido. A aposição preserva essa tensão em vez de resolver a relação silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “o dia” torna a aposição clara em português sem explicar além do hebraico. “Será a confusão deles” preserva deliberadamente a forma nominal e algo da estranheza enfática do original.
