  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: pt
  text: Não se alegre por minha causa[a], minha inimiga; ainda que eu tenha caído, me levantarei. Ainda que eu esteja nas trevas[b], Yahweh será uma luz para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não exulte sobre mim”. O hebraico diz literalmente que a inimiga não deve alegrar-se em relação à pessoa que fala; o contexto indica alegria hostil diante de sua queda.'
    reason: lexical_alternative
  - marker: b
    text: 'No hebraico, “caí” e “levantei-me” estão na forma perfeita: literalmente, “caí, levantei-me”. Em linguagem poética, a segunda forma pode apresentar a futura restauração como tão certa que já é vista como realizada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמְחִי ... לִי
  choice: Não se alegre com a minha desgraça
  rationale: A construção proíbe a inimiga de se alegrar por causa da situação do eu lírico. A formulação é natural em português e evita a possível leitura positiva de “alegrar-se comigo”; a explicitação “com a minha desgraça” é contextual, por isso a alternativa mais formal consta em nota.
- source_word: אֹיַבְתִּי
  choice: minha inimiga
  rationale: O substantivo está no singular feminino e recebe sufixo de primeira pessoa; a forma portuguesa preserva tanto o gênero gramatical quanto a referência singular.
- source_word: כִּי נָפַלְתִּי קָמְתִּי
  choice: ainda que eu tenha caído, me levantarei
  rationale: O primeiro כִּי tem força concessiva no contexto. Embora ambos os verbos sejam formalmente perfeitos, a sequência poética expressa uma queda presente e a certeza da reversão; o futuro em português comunica essa confiança sem apagar a forma hebraica, registrada em nota.
- source_word: כִּי אֵשֵׁב בַּחֹשֶׁךְ
  choice: Ainda que eu esteja sentado nas trevas
  rationale: O segundo כִּי também é entendido concessivamente. ישׁב conserva a imagem concreta de estar sentado, enquanto “nas trevas” mantém a metáfora poética de aflição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אוֹר לִי
  choice: luz para mim
  rationale: Mantém a metáfora nominal e traduz לִי naturalmente como relação ou benefício, sem necessidade de artigo em português.
theological_decisions:
- issue: Forma de apresentar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa por transliteração e evita substituir o nome por um título.
- issue: Valor temporal de קָמְתִּי
  choice: me levantarei
  alternative: levantei-me; tenho me levantado
  rationale: O perfeito hebraico pode apresentar poeticamente a restauração como certa. O futuro português expressa a reversão confiante após a queda, enquanto a nota preserva a tensão formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se o paralelismo poético, a imagem concreta de estar sentado nas trevas e a referência feminina singular à inimiga. A primeira linha usa uma pequena explicitação contextual para evitar ambiguidade idiomática, devidamente assinalada em nota.
