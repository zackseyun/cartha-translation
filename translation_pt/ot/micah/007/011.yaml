  text: י֖וֹם לִ/בְנ֣וֹת גְּדֵרָ֑יִ/ךְ י֥וֹם הַ/ה֖וּא יִרְחַק חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: pt
  text: Dia de construir os seus muros! Naquele dia, a fronteira será afastada para longe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o decreto será afastado para longe”. A palavra hebraica pode significar “fronteira/limite” ou “decreto/estatuto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: Dia
  rationale: Preserva a forma breve e elíptica do anúncio profético, sem acrescentar um verbo como “virá”.
- source_word: לִ/בְנ֣וֹת
  choice: de construir
  rationale: A preposição ל com o infinitivo construto de בנה expressa finalidade ou destinação; “dia de construir” é natural em português e mantém a concisão.
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: os seus muros
  rationale: O termo designa muros ou barreiras de cercamento. “Muros” se ajusta ao contexto de restauração sem especificar fortificações.
- source_word: י֥וֹם הַ/ה֖וּא
  choice: Naquele dia
  rationale: Tradução idiomática da expressão temporal profética, referindo-se ao dia que acaba de ser anunciado.
- source_word: יִרְחַק
  choice: será afastada para longe
  rationale: Expressa o sentido de tornar-se distante ou ser removido para longe, sem especificar quem produz esse afastamento.
- source_word: חֹֽק
  choice: a fronteira
  rationale: Embora também possa significar decreto ou estatuto, aqui o sentido espacial harmoniza com a imagem dos muros e de uma restauração territorial.
theological_decisions:
- issue: Sentido de חֹק na oração final
  choice: fronteira ou limite espacial
  alternative: decreto ou estatuto
  rationale: 'A referência imediata à construção de muros favorece o sentido espacial: a linha limitadora é afastada. Como o sentido jurídico continua lexicalmente possível, ele é preservado em nota, sem eliminar a ambiguidade genuína.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação comunica o caráter enfático do anúncio elíptico hebraico. O possessivo “seus” mantém a referência à destinatária feminina coletiva sem forçar marcação de gênero em português.
