id: MIC.7.13
reference: Micah 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הָ/אָ֛רֶץ לִ/שְׁמָמָ֖ה עַל יֹֽשְׁבֶ֑י/הָ מִ/פְּרִ֖י מַֽעַלְלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: pt
  text: Mas a terra se tornará uma desolação por causa de seus habitantes, por causa do fruto de suas obras.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a terra ficará desolada».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «do fruto de suas obras», expressão que indica as consequências produzidas pelo que fizeram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: O perfeito qal com conjunção, no contexto profético, tem sentido futuro; a expressão também comunica a transição para um estado de devastação.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto imediato de juízo, refere-se mais naturalmente ao território atingido; em português, «terra» também preserva a possível amplitude do termo hebraico.
- source_word: לִשְׁמָמָה
  choice: uma desolação
  rationale: Preserva a força nominal do hebraico e exprime um estado severo de devastação.
- source_word: עַל יֹשְׁבֶיהָ
  choice: por causa de seus habitantes
  rationale: A preposição indica aqui causa, e o particípio com sufixo designa os que habitam a terra.
- source_word: מִפְּרִי מַעַלְלֵיהֶם
  choice: por causa do fruto de suas obras
  rationale: Mantém a metáfora hebraica do fruto como resultado produzido pela conduta, ao mesmo tempo que torna explícita a relação causal no contexto.
theological_decisions:
- issue: Estrutura causal do juízo
  choice: A desolação da terra é apresentada como consequência ligada aos habitantes e ao fruto de suas obras.
  alternative: Traduzir mais literalmente a segunda expressão como «procedente do fruto de suas obras».
  rationale: O hebraico acumula expressões causais. Repetir «por causa de» comunica claramente essa relação sem acrescentar uma explicação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a metáfora «fruto de suas obras» e a possibilidade semântica de «terra», evitando linguagem excessivamente arcaica.
