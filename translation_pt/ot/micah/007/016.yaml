source:
  edition: WLC
  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: pt
  text: As nações verão e se envergonharão de todo o seu poder[a]. Porão a mão sobre a boca[b]; seus ouvidos ficarão surdos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se envergonharão por causa de todo o seu poder”. A expressão hebraica pode indicar vergonha em relação ao poder que possuem ou por causa dele.'
    reason: lexical_alternative
  - marker: b
    text: Pôr a mão sobre a boca é um gesto que expressa silêncio, espanto ou submissão.
    reason: cultural_note
  - marker: c
    text: 'Ou: “seus ouvidos ficarão tapados” ou “seus ouvidos perderão a sensibilidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: verão
  rationale: O qal imperfeito de ראה expressa ver ou perceber; o futuro se ajusta ao contexto profético.
- source_word: גוֹיִם
  choice: as nações
  rationale: גּוֹיִם designa nações ou povos; aqui o contexto é coletivo e geopolítico, não um contraste técnico entre judeus e gentios.
- source_word: וְיֵבֹשׁוּ
  choice: e se envergonharão
  rationale: בוש no qal expressa vergonha ou desonra. A forma pronominal é natural em português e evita explicitar um agente que o hebraico não menciona.
- source_word: מִכֹּל גְּבוּרָתָם
  choice: de todo o seu poder
  rationale: A preposição מִן pode indicar relação ou causa. A formulação compacta preserva essa abertura, enquanto 'poder' comunica naturalmente גְּבוּרָה neste contexto.
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: Porão a mão sobre a boca
  rationale: Mantém a imagem idiomática hebraica de silêncio, espanto ou submissão, conservando 'mão' no singular como no original.
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: seus ouvidos ficarão surdos
  rationale: A expressão indica que os ouvidos se tornam surdos ou incapazes de ouvir; a tradução conserva diretamente a imagem.
