  text: אַ֣לְלַי לִ֗/י כִּ֤י הָיִ֨יתִי֙ כְּ/אָסְפֵּי קַ֔יִץ כְּ/עֹלְלֹ֖ת בָּצִ֑יר אֵין אֶשְׁכּ֣וֹל לֶ/אֱכ֔וֹל בִּכּוּרָ֖ה אִוְּתָ֥ה נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: pt
  text: 'Ai de mim![a] Pois fiquei como os que recolhem os frutos do verão, como as sobras da vindima: não há cacho para comer, nem figo temporão[b] que a minha alma deseja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que aflição para mim!”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “primeiro fruto maduro”; provavelmente se refere ao apreciado figo que amadurece cedo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: Ai de mim!
  rationale: Expressa de modo natural e enfático em português a interjeição hebraica de lamento e aflição.
- source_word: כִּי הָיִיתִי
  choice: Pois fiquei
  rationale: O perfeito de היה apresenta o estado a que o falante chegou; “fiquei” transmite tanto a mudança quanto a condição resultante.
- source_word: כְאָסְפֵּי קַיִץ
  choice: como os que recolhem os frutos do verão
  rationale: Mantém a forma nominal ligada aos recolhedores e comunica com clareza a cena da coleta de produtos da estação.
- source_word: כְעֹלְלֹת בָּצִיר
  choice: como os que respigam na colheita das uvas
  rationale: עֹלְלוֹת evoca a busca do pouco que resta após a colheita; “respigam” conserva a imagem de recolher sobras, e “colheita das uvas” explicita o contexto de בָּצִיר em linguagem acessível.
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכֹל
  choice: não há cacho para comer
  rationale: אֶשְׁכּוֹל designa um cacho, sobretudo de uvas; o contexto imediato torna desnecessário repetir “de uvas”.
- source_word: בִּכּוּרָה
  choice: figo temporão
  rationale: O termo significa algo que amadurece primeiro e, neste contexto, provavelmente se refere ao apreciado figo precoce. “Figo temporão” preserva essa referência provável sem apagar o sentido de maturação antecipada.
- source_word: אִוְּתָה נַפְשִׁי
  choice: que a minha alma deseja
  rationale: Conserva a expressão antropológica hebraica e sua intensidade, permanecendo compreensível em português atual e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário agrícola compreensível. A construção paralela dos dois grupos de recolhedores foi preservada, assim como a expressão hebraica “minha alma deseja”.
