id: MIC.2.9
reference: Micah 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: pt
  text: Vocês expulsam as mulheres do meu povo[a] de seus lares agradáveis; de seus filhos pequenos tiram para sempre o meu esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as esposas do meu povo”. O hebraico pode se referir às mulheres em geral ou, mais especificamente, às esposas.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha glória”. O termo hebraico pode significar esplendor, glória, majestade ou honra.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: as mulheres do meu povo
  rationale: נְשֵׁי, construto plural de אִשָּׁה, pode significar “mulheres” ou “esposas”. O sentido mais amplo se ajusta à denúncia contra a opressão de mulheres vulneráveis, sem excluir a possibilidade específica indicada em nota.
- source_word: תְּגָרְשׁוּן
  choice: vocês expulsam
  rationale: O Piel de גרשׁ expressa remoção forçada. “Expulsam” é natural, direto e preserva a coerção do verbo.
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: de seus lares agradáveis
  rationale: בַּיִת pode ser “casa” ou “lar”, e תַּעֲנֻגִים comunica prazer ou coisas agradáveis. “Lares agradáveis” transmite tanto o lugar de moradia quanto seu caráter aprazível; o sufixo feminino singular é entendido coletivamente em referência às mulheres.
- source_word: מֵעַל עֹלָלֶיהָ
  choice: de seus filhos pequenos
  rationale: עוֹלָל designa criança pequena ou bebê. “Filhos pequenos” conserva essa especificidade etária sem tornar a frase artificial; מֵעַל é expresso idiomaticamente por “de”.
- source_word: תִּקְחוּ
  choice: tiram
  rationale: לקח significa “tomar”; neste contexto de privação, “tiram” comunica naturalmente que algo lhes é removido.
- source_word: הֲדָרִי
  choice: o meu esplendor
  rationale: הָדָר pode indicar esplendor, glória, majestade ou honra. “Esplendor” mantém o registro elevado e a ambiguidade quanto à relação entre a majestade divina e a dignidade concedida por Deus.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: עוֹלָם indica duração permanente ou indefinidamente prolongada. “Para sempre” é a formulação portuguesa natural para a força da denúncia profética.
theological_decisions:
- issue: Referente de “meu” em “meu povo” e “meu esplendor”
  choice: 'Conservar a primeira pessoa divina: “meu povo” e “meu esplendor”.'
  alternative: Entender “meu esplendor” mais especificamente como a dignidade ou honra que Deus concedeu às crianças.
  rationale: O discurso profético circundante apresenta o SENHOR como falante. A tradução mantém o possessivo sem explicação interpretativa no corpo do texto, preservando a tensão entre o esplendor pertencente a Deus e a dignidade divina retirada das crianças.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Lares” realça a dimensão humana da expulsão, enquanto “filhos pequenos” preserva a faixa etária indicada pelo hebraico. Os marcadores aparecem junto às expressões a que se referem.
