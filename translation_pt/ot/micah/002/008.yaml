  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: pt
  text: Mas, ultimamente, o meu povo se levantou como inimigo; vocês arrancam o manto de sobre a veste dos que passam em segurança[a], dos que voltam da guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que se afastam da guerra” ou “dos que evitam a guerra”. A expressão hebraica final é difícil e pode descrever civis pacíficos, em vez de soldados que voltam para casa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: Mas, ultimamente
  rationale: O advérbio significa literalmente “ontem”, mas aqui indica o passado recente; o waw tem força adversativa no contexto.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva a construção possessiva e o tom de vínculo pactual.
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: se levantou como inimigo
  rationale: Expressa o ato de assumir uma postura hostil sem afirmar necessariamente uma transformação de identidade.
- source_word: מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן
  choice: vocês arrancam o manto de cima da roupa
  rationale: Mantém os dois termos de vestuário e representa מִמּוּל como remoção de cima da peça ou da pessoa vestida; “arrancam” comunica a violência do hiphil de פשט.
- source_word: מֵעֹבְרִים בֶּטַח
  choice: dos que passam confiantes
  rationale: Traduz o particípio de עבר como pessoas em trânsito e בֶּטַח como sua condição de segurança despreocupada.
- source_word: שׁוּבֵי מִלְחָמָה
  choice: dos que voltam da guerra
  rationale: Adota a leitura direta de שוב como “voltar”, preservando em nota a dificuldade e as alternativas possíveis.
theological_decisions:
- issue: Sentido da expressão difícil שׁוּבֵי מִלְחָמָה
  choice: dos que voltam da guerra
  alternative: os que se afastam da guerra / os que evitam a guerra
  rationale: A leitura principal oferece sentido coerente no contexto de viajantes vulneráveis sendo saqueados, mas o hebraico admite outras análises; a nota conserva a ambiguidade sem transformá-la em questão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” explicita o sujeito plural do verbo e “confiantes” comunica segurança despreocupada sem sugerir necessariamente fé religiosa.
