  text: ק֣וּמוּ וּ/לְכ֔וּ כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה בַּ/עֲב֥וּר טָמְאָ֛ה תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: pt
  text: Levantem-se e vão embora, pois este não é o lugar de descanso[a]; porque está contaminado, ele traz destruição[b] — uma destruição terrível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este não é o descanso”. O substantivo hebraico pode significar “descanso” ou “lugar de descanso” e provavelmente se refere aqui à terra como lugar de repouso estabelecido para Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele destrói — sim, uma destruição terrível”. O hebraico emprega um verbo e um substantivo da mesma raiz para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ וּ/לְכ֔וּ
  choice: Levantem-se e vão embora
  rationale: Os dois imperativos plurais são preservados. “Vão embora” comunica naturalmente, no contexto, a ordem de deixar o lugar, sem recorrer ao mais formal “partam”.
- source_word: כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה
  choice: pois este não é o lugar de descanso
  rationale: מְנוּחָה pode indicar tanto descanso quanto lugar de repouso. O demonstrativo e o contexto da terra favorecem aqui o sentido concreto de “lugar de descanso”.
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  choice: Por causa da impureza
  rationale: A formulação conserva o valor causal de בַּעֲבוּר e evita inserir explicitamente um sujeito para טָמְאָה, cuja forma e sintaxe admitem discussão. “Impureza” mantém as dimensões moral e cultual.
- source_word: תְּחַבֵּ֖ל וְ/חֶ֥בֶל
  choice: ele causa destruição, uma destruição
  rationale: A tradução reproduz de modo legível a repetição enfática da raiz חבל no verbo e no substantivo. O pronome retoma naturalmente “lugar de descanso”, sem identificar mais precisamente o agente da destruição.
- source_word: נִמְרָֽץ
  choice: terrível
  rationale: O adjetivo expressa intensidade ou severidade. “Terrível” é claro, forte e natural em português profético, sem especificar indevidamente que a destruição seja violenta ou dolorosa.
theological_decisions:
- issue: Referente das formas femininas na oração causal
  choice: A redação mantém “impureza” sem fornecer sujeito explícito e usa “ele” para retomar o lugar de descanso na oração seguinte.
  alternative: “Porque ele está contaminado, ele causa destruição” ou “porque ela está contaminada, a terra causa destruição”.
  rationale: As formas femininas podem ser relacionadas a מְנוּחָה e, no contexto, à terra como lugar de repouso; contudo, explicitar “terra” resolveria uma referência que o hebraico não nomeia diretamente. A tradução preserva a tensão do texto.
- issue: Força de וְחבל נמרץ
  choice: uma destruição terrível
  alternative: “sim, uma destruição severa” ou “e uma destruição violenta”.
  rationale: O substantivo cognato intensifica o verbo precedente. A repetição de “destruição” conserva essa ênfase retórica, e “terrível” transmite a intensidade de נִמְרָץ sem restringir seu sentido.
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais naturais ao público brasileiro. A repetição final foi mantida para refletir a ênfase hebraica, e as notas registram as principais alternativas lexicais e sintáticas.
