source:
  edition: WLC
  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: pt
  text: “Certamente reunirei todos vocês, ó Jacó; certamente ajuntarei o remanescente de Israel. Eu os colocarei juntos como as ovelhas de Bozra[a], como um rebanho no meio de sua pastagem[b]; farão grande barulho por causa de gente[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como ovelhas num curral”. O hebraico é tradicionalmente entendido como o nome geográfico “Bozra”, mas alguns relacionam a forma a uma palavra que designa um cercado para ovelhas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no meio de seu cercado”. Aqui, a palavra hebraica pode designar uma área de pastagem; outras traduções entendem um recinto para o rebanho.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ficarão apinhados de gente”. A expressão hebraica é difícil e também pode indicar que o barulho se deve à presença de pessoas.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: Certamente reunirei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Certamente” comunica essa ênfase de modo natural em português.
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: todos vocês, ó Jacó
  rationale: O sufixo singular trata Jacó como entidade coletiva. A expressão mantém tanto a totalidade dos destinatários quanto a interpelação direta.
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: certamente ajuntarei
  rationale: A segunda construção intensiva corresponde à primeira. “Ajuntarei” preserva a ideia de reunir os dispersos e evita repetição lexical desnecessária.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: “Remanescente” é a tradução profética estabelecida para a parcela sobrevivente ou preservada do povo.
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: Eu os colocarei juntos
  rationale: Embora o sufixo hebraico seja singular, seu referente é coletivo. O plural em português explicita naturalmente a referência aos integrantes do remanescente.
- source_word: כְּצֹאן בָּצְרָה
  choice: como as ovelhas de Bozra
  rationale: O texto massorético permite a leitura tradicional do nome geográfico Bozra. A possível interpretação como curral é preservada em nota.
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: como um rebanho no meio de sua pastagem
  rationale: Neste contexto pastoril, הַדָּבְרוֹ designa uma área de pasto. “Pastagem” mantém a imagem concreta e o paralelismo.
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: farão grande barulho por causa da multidão
  rationale: O verbo descreve ruído ou agitação intensa, e מֵאָדָם indica de maneira difícil a presença humana associada a esse rumor. “Multidão” transmite a imagem de um agrupamento humano numeroso sem sugerir necessariamente hostilidade.
theological_decisions:
- issue: Promessa de restauração dirigida a Jacó/Israel
  choice: Manter a promessa divina de reunir Jacó e o remanescente de Israel sem restringir sua referência além do que o texto declara.
  alternative: Interpretar a promessa exclusivamente como restauração espiritual ou exclusivamente como acontecimento escatológico desvinculado do Israel histórico.
  rationale: O hebraico nomeia diretamente Jacó e Israel e emprega a linguagem profética do remanescente. A tradução conserva essa referência histórica e coletiva sem impor um sistema teológico posterior.
- issue: Relação entre “todos vocês” e “o remanescente”
  choice: Conservar lado a lado as duas expressões, sem explicar como “todos” se relaciona com “remanescente”.
  alternative: Harmonizar as expressões, fazendo “todos” significar explicitamente apenas o remanescente ou ampliando “remanescente” para todo Israel.
  rationale: A justaposição cria uma tensão genuína no texto. A tradução não deve resolvê-la interpretativamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição enfática das duas promessas foi mantida, com variação natural entre “reunirei” e “ajuntarei”. “Ó Jacó” assinala com clareza o vocativo sem soar arcaico, e as ambiguidades pastorais e da cláusula final foram preservadas em notas.
