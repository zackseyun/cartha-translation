  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: pt
  text: Aquele que abre caminho subiu diante deles[a]; eles abriram passagem, atravessaram o portão e saíram por ele. Seu rei passou adiante deles[b], e o SENHOR estava à frente deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Rompedor”. O particípio hebraico pode funcionar como uma designação daquele que rompe um obstáculo ou abre o caminho.'
    reason: lexical_alternative
  - marker: b
    text: 'A identidade daquele que abre caminho é discutida: pode ser entendido como um líder militar, o rei ou o próprio SENHOR. O hebraico deixa implícita a relação entre essas figuras.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: aquele que abre caminho
  rationale: O particípio substantivado de פרץ designa quem rompe uma barreira ou abre passagem. A formulação mantém a imagem e é clara em português atual.
- source_word: עָלָה
  choice: subiu
  rationale: O perfeito qal indica ação vista como completa; o pretérito preserva isso naturalmente na sequência narrativa profética.
- source_word: לִפְנֵיהֶם
  choice: diante deles / adiante deles
  rationale: A expressão espacial indica posição à frente. A pequena variação evita rigidez sem alterar o sentido.
- source_word: פָּרְצוּ
  choice: abriram passagem
  rationale: Retoma a raiz פרץ e descreve o rompimento do obstáculo, mantendo ligação verbal com quem abre caminho.
- source_word: וַיַּעֲבֹרוּ שַׁעַר
  choice: atravessaram o portão
  rationale: עבר com שׁער descreve o movimento através da abertura; 'atravessaram o portão' é idiomático e preciso.
- source_word: וַיֵּצְאוּ בוֹ
  choice: saíram por ele
  rationale: O pronome retoma o portão, e a preposição ב pode ser expressa naturalmente por 'por' nesse contexto.
- source_word: מַלְכָּם
  choice: seu rei
  rationale: Preserva diretamente o sentido régio do substantivo e sua distinção formal em relação ao SENHOR.
- source_word: וַיהוָה
  choice: o SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o Tetragrama, em maiúsculas.
- source_word: בְּרֹאשָׁם
  choice: à frente deles
  rationale: A expressão literalmente relacionada à 'cabeça' indica a posição de liderança. A tradução idiomática conserva o sentido processional.
theological_decisions:
- issue: Identidade de הַפֹּרֵץ, aquele que abre caminho
  choice: Designar a figura de modo descritivo, sem identificá-la no texto principal.
  alternative: Entendê-la explicitamente como líder militar, rei messiânico ou o próprio SENHOR.
  rationale: O hebraico não declara se aquele que abre caminho é idêntico ao rei ou ao SENHOR; a tradução preserva essa ambiguidade.
- issue: Relação entre 'seu rei' e 'o SENHOR'
  choice: Manter as duas expressões distintas.
  alternative: Tratálas como referências em aposição à mesma figura.
  rationale: O texto coordena as duas designações sem explicitar identidade entre elas; fundi-las resolveria uma tensão que o hebraico mantém.
- issue: Valor temporal de וַיַּעֲבֹר e a mudança para וַיהוָה בְּרֹאשָׁם
  choice: 'Traduzir o rei no passado e a cláusula final com aspecto descritivo: ''ia à frente deles''.'
  alternative: 'Usar presente profético em ambas: ''passa... está/vai''.'
  rationale: A sequência narrativa favorece o passado, enquanto a cláusula nominal final descreve a posição do SENHOR no cortejo.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. Conserva a imagem de abertura de caminho e a distinção entre o rompedor, o rei e o SENHOR.
