base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: pt
  text: “Não profetizem”, eles profetizam.[a] “Não se deve profetizar sobre essas coisas;[b] a humilhação não nos alcançará.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por “profetizar” significa literalmente “gotejar” ou “destilar” e aparece três vezes neste versículo. Neste contexto, é usado figuradamente para proferir oráculos.
    reason: Explicar o jogo de palavras hebraico, impossível de reproduzir naturalmente em português.
  - marker: b
    text: 'Ou: “Não profetizarão a estes”. A construção hebraica e a delimitação das falas são incertas.'
    reason: Preservar a ambiguidade sintática e referencial do texto.
  - marker: c
    text: 'O texto hebraico também pode ser entendido como: “as humilhações não cessarão” ou “não se afastarão”.'
    reason: Registrar uma dificuldade textual e lexical genuína na cláusula final.
lexical_decisions:
- source_word: תַּטִּפוּ / יַטִּיפוּן / יַטִּפוּ
  choice: profetizem / profetizam / profetizar
  rationale: O verbo נָטַף significa literalmente “gotejar” e, neste contexto profético, “proferir uma mensagem profética”. A repetição em português preserva o jogo verbal e a censura dirigida aos profetas.
- source_word: לָאֵלֶּה
  choice: sobre essas coisas
  rationale: A expressão admite referência a “estas coisas” ou possivelmente a “estas pessoas”. O contexto favorece o conteúdo incômodo da profecia, sem tornar a referência mais específica do que o hebraico.
- source_word: כְּלִמּוֹת
  choice: humilhação
  rationale: O plural hebraico pode exprimir atos de desonra, insultos ou vergonha intensa. “Humilhação” comunica de modo natural o resultado desonroso temido ou negado pelos interlocutores.
theological_decisions:
- issue: Identidade e delimitação das falas
  choice: Atribuir “Não profetizem” aos opositores, seguida da formulação impessoal “Não se deve profetizar”
  alternative: 'Ler a segunda ocorrência como declaração do profeta: “Eles não profetizarão a estes”'
  rationale: A sequência hebraica é abrupta e permite diferentes delimitações. A tradução segue a leitura contextual de uma tentativa de silenciar a pregação, enquanto a nota registra a incerteza sintática.
- issue: Sentido de לֹא יִסַּג כְּלִמּוֹת
  choice: “a humilhação não nos alcançará”
  alternative: “as humilhações não cessarão/não se afastarão”
  rationale: A forma massorética pode ser relacionada a סוּג, “recuar, afastar-se”, mas a leitura contextual tradicional entende a afirmação presunçosa de que a desonra não os atingirá. A tensão textual é preservada em nota, sem ocultar a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “profetizar” mantém a força retórica do hebraico; a formulação impessoal “não se deve” evita marcar gênero ou número onde a construção é discutida.
