  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: pt
  text: 'Acaso se dirá, ó casa de Jacó: “O Espírito de Yahweh está impaciente?[a] São estas as suas ações?” As minhas palavras não fazem bem a quem anda com retidão?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “O Espírito de Yahweh é curto?” A expressão hebraica também pode sugerir: “É curta a paciência de Yahweh?”'
    reason: Registra a imagem literal hebraica e a interpretação idiomática ligada à paciência divina, sem introduzir uma ação de encurtamento não explicitada no texto.
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: Deveria ser dito
  rationale: Mantém a forma passiva e a força de pergunta retórica introdutória, em português natural, sem identificar além do texto quem profere a acusação.
- source_word: בֵּית יַעֲקֹב
  choice: ó casa de Jacó
  rationale: Preserva o vocativo profético dirigido coletivamente ao povo de Jacó.
- source_word: הֲקָצַר֙ ר֣וּחַ יְהוָ֔ה
  choice: O Espírito de Yahweh está impaciente?
  rationale: Expressa de modo idiomático a imagem hebraica de um espírito 'encurtado', mantendo רוּחַ como 'Espírito' e registrando em nota as alternativas ligadas a paciência e limitação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama.
- source_word: אִם אֵ֖לֶּה מַעֲלָלָ֑יו
  choice: São estas as suas ações?
  rationale: Conserva a pergunta retórica paralela e traduz מַעֲלָלִים pelo termo amplo 'ações', sem especificar quais atos estão em vista.
- source_word: דְבָרַי יֵיטִיבוּ
  choice: as minhas palavras não fazem bem
  rationale: Mantém o plural 'palavras' e o sentido causativo de יטב, formulando a pergunta retórica que espera resposta afirmativa.
- source_word: עִם הַיָּשָׁר הוֹלֵךְ
  choice: a quem anda com retidão
  rationale: Reproduz a metáfora bíblica de 'andar' como modo contínuo de vida e traduz הַיָּשָׁר sem transformar a expressão em rótulo abstrato.
theological_decisions:
- issue: Se רוּחַ יְהוָה deve ser entendido pessoalmente como o Espírito de Yahweh ou idiomaticamente como a paciência/disposição de Yahweh
  choice: Espírito de Yahweh
  alternative: paciência de Yahweh
  rationale: A tradução principal conserva o substantivo רוּחַ e sua associação direta com Yahweh, enquanto a nota preserva a leitura idiomática plausível e evita eliminar a ambiguidade teológica do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo e as perguntas retóricas preservam o tom profético; a metáfora de andar foi mantida por ser natural e reconhecível em português.
