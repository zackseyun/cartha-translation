    rationale: מִשְׁפָּחָה designa primariamente família, linhagem ou clã; embora possa abranger uma comunidade de parentesco, «povo» é semanticamente mais amplo e pode sugerir uma nação inteira. «Este clã» preserva melhor a amplitude pertinente ao contexto.
  - severity: low
    issue: «pois será um tempo de desgraça»
    rationale: O hebraico diz literalmente «pois é um tempo de calamidade». O futuro é compreensível no contexto profético, mas não é exigido pelo texto e reduz sua força de declaração presente.
  - severity: low
