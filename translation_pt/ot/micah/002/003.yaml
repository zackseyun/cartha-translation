  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: Eis que estou planejando uma desgraça contra este clã[a], da qual vocês não conseguirão livrar seus pescoços[b]. Vocês não andarão de cabeça erguida[c], pois é um tempo de desgraça[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta família”. O termo hebraico pode designar uma família, uma linhagem ou um grupo de parentesco mais amplo.
    reason: lexical_alternative
  - marker: b
    text: A imagem é a de pessoas que não conseguem retirar o pescoço de um jugo ou fardo imposto e, portanto, não podem escapar dele.
    reason: cultural_note
  - marker: c
    text: Ou “com arrogância”. A expressão também pode sugerir que o peso do juízo não lhes permitirá manter uma postura ereta.
    reason: lexical_alternative
  - marker: d
    text: O hebraico usa a mesma palavra para a “desgraça” planejada e para o “tempo de desgraça”, criando uma repetição intencional.
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a resposta de Yahweh às injustiças descritas no contexto anterior.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional com linguagem digna e clara, mantendo o nome divino.
- source_word: הִנְנִי
  choice: Vejam! Estou
  rationale: Expressa a força enfática e de apresentação do hebraico em português atual; o plural corresponde aos destinatários coletivos.
- source_word: חֹשֵׁב
  choice: planejando
  rationale: Mantém o sentido deliberativo e o eco da mesma raiz usada para os que planejam o mal no versículo anterior.
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: contra este povo
  rationale: Neste contexto de juízo coletivo, מִשְׁפָּחָה parece abranger uma comunidade ou grupo de parentesco mais amplo que uma família doméstica. A nota preserva as alternativas lexicais.
- source_word: רָעָה
  choice: desgraça
  rationale: Denota calamidade ou infortúnio como juízo, não maldade moral. Usar a mesma palavra nas duas ocorrências preserva a repetição retórica hebraica.
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: da qual vocês não conseguirão livrar o pescoço
  rationale: Preserva a imagem do pescoço preso sob um jugo, ao mesmo tempo que comunica claramente a impossibilidade de escapar.
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: Vocês não andarão de cabeça erguida
  rationale: Reproduz de modo idiomático a postura elevada indicada por רוֹמָה, deixando em aberto as nuances de orgulho e humilhação.
- source_word: כִּי עֵת רָעָה הִיא
  choice: pois será um tempo de desgraça
  rationale: Comunica que se trata de um período calamitoso e repete 'desgraça' para refletir a recorrência de רָעָה.
theological_decisions:
- issue: O sentido de רָעָה quando Yahweh anuncia seu juízo
  choice: desgraça nas duas ocorrências
  alternative: mal; calamidade; uma desgraça ... um tempo mau
  rationale: No contexto, a palavra descreve calamidade judicial, e não mal moral praticado por Deus. A repetição de 'desgraça' conserva a ligação lexical e evita resolver a tensão por meio de duas palavras portuguesas distintas.
- issue: A referência coletiva de הַמִּשְׁפָּחָה הַזֹּאת
  choice: este povo
  alternative: esta família; este clã
  rationale: O alvo do oráculo parece ser a comunidade coletiva. A escolha evita restringi-lo a uma casa, enquanto a nota registra a amplitude semântica do termo.
- issue: A nuance de רוֹמָה
  choice: de cabeça erguida
  alternative: com arrogância; orgulhosamente; em posição ereta
  rationale: A expressão portuguesa mantém tanto a imagem corporal quanto a possível conotação de orgulho, sem excluir a ideia de que o jugo impedirá uma postura ereta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural dirigido à comunidade, conserva Yahweh e mantém as imagens do pescoço sob o jugo e da cabeça erguida.
