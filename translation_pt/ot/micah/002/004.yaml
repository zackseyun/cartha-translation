base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: pt
  text: 'Naquele dia, alguém fará contra vocês um dito de zombaria e entoará um lamento[a], dizendo:


    “Estamos completamente arruinados!


    Ele muda a porção do meu povo.


    Como ele a tira de mim!


    Ao que se afasta, reparte os nossos campos.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete termos cognatos de pranto, com o sentido de “lamentará um lamento” ou “entoará um canto fúnebre”, para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: “Ao que se afasta” traduz uma expressão hebraica difícil. Também pode ser entendida como “ao rebelde”, “ao apóstata” ou “ao que volta”; menos provavelmente, pode referir-se ao conquistador.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: levantarão contra vocês uma sátira
  rationale: A expressão hebraica significa literalmente “levantar/tomar um mashal”. Neste contexto de juízo público, “sátira” comunica melhor o dito figurado e mordaz dirigido contra o povo, preservando o idioma com “levantarão”.
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: entoarão uma lamentação
  rationale: A sequência hebraica acumula termos cognatos de lamento para intensificar o pranto. Uma tradução portuguesa plenamente repetitiva ficaria pouco natural; “entoarão uma lamentação” conserva o caráter solene e ritual, enquanto a nota registra a repetição original.
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: Estamos completamente arruinados
  rationale: O infinitivo absoluto seguido da forma verbal intensifica a devastação. “Completamente arruinados” expressa essa ênfase em português natural e abrange tanto a ruína quanto a espoliação.
- source_word: חֵלֶק עַמִּי
  choice: a porção do meu povo
  rationale: “Porção” corresponde diretamente a חֵלֶק e preserva a linguagem de terra repartida, sem substituí-la pelo termo mais interpretativo “herança”.
- source_word: יָמִיר
  choice: transfere
  rationale: O Hifil de מוּר pode significar mudar, trocar ou transferir. Como o objeto é a porção territorial do povo, “transfere” comunica a mudança de posse sem especificar indevidamente seu mecanismo.
- source_word: אֵיךְ יָמִישׁ לִי
  choice: Como a tira de mim!
  rationale: אֵיךְ introduz uma exclamação de espanto, e o Hifil de מוּשׁ indica fazer algo afastar-se. O pronome “a” retoma naturalmente “a porção”.
- source_word: לְשׁוֹבֵב
  choice: ao que se afasta
  rationale: A forma difícil pode designar alguém que se desvia ou se afasta. Esta tradução é transparente e menos carregada teologicamente que “apóstata”, sem eliminar a ambiguidade, que é explicitada em nota.
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: reparte os nossos campos
  rationale: O verbo significa dividir ou repartir. “Reparte” é natural no contexto de redistribuição forçada das terras.
theological_decisions:
- issue: Identidade de לְשׁוֹבֵב
  choice: ao que se afasta
  alternative: ao rebelde; ao apóstata; àquele que faz voltar; possivelmente ao conquistador
  rationale: A forma hebraica e sua função sintática são discutidas. A tradução principal mantém o sentido básico de afastamento sem decidir se se trata especificamente de apostasia religiosa, rebelião ou de outro agente da perda da terra.
- issue: Sujeito dos verbos de transferência e repartição
  choice: “Ele”, sem identificação explícita
  alternative: Deus; o conquistador inimigo
  rationale: O hebraico emprega formas verbais na terceira pessoa sem nomear aqui o agente. Mantê-lo não identificado preserva a tensão do texto e evita acrescentar uma conclusão contextual ao verso.
translation_notes:
  register: Português atual, digno e de leitura ampla, com colocação pronominal natural no padrão brasileiro. O paralelismo poético foi disposto em linhas. “Sátira” evita o sentido moderno estreito de “provérbio” e expressa o caráter público e mordaz do mashal; as ambiguidades do agente e de לְשׁוֹבֵב foram preservadas.
