  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: pt
  text: Portanto, você não terá ninguém que lance a corda de medir por sorteio na assembleia de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «corda», «linha» ou «corda de demarcação». O termo hebraico se refere à corda usada para medir e repartir terras de herança.
    reason: lexical_alternative
  - marker: b
    text: Isto é, no meio da comunidade da aliança reunida quando a terra era repartida.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a consequência judicial decorrente da acusação anterior e conserva a força conclusiva da profecia.
- source_word: לֹא יִהְיֶה לְךָ
  choice: você não terá ninguém
  rationale: Expressa de modo natural em português a construção literal «não haverá para você», mantendo a interpelação direta no masculino singular sem identificar além do contexto o seu referente.
- source_word: מַשְׁלִיךְ
  choice: que lance
  rationale: O particípio funciona como substantivo, indicando a pessoa que realiza a ação. «Que lance» preserva a imagem concreta associada à distribuição da terra.
- source_word: חֶבֶל
  choice: a corda de medir
  rationale: Neste contexto de repartição territorial, o termo designa a corda usada para medir ou demarcar lotes de terra; a formulação torna a imagem clara sem convertê-la apenas em conceito abstrato.
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: Conserva o sentido do procedimento pelo qual a terra era distribuída em lotes, de forma concisa e compreensível.
- source_word: בִּקְהַל יְהוָה
  choice: na assembleia de Yahweh
  rationale: קָהָל designa a comunidade reunida, aqui no contexto da repartição da terra; «assembleia» preserva tanto a dimensão comunitária quanto a formalidade da ocasião.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando no texto o nome pessoal presente no hebraico.
theological_decisions:
- issue: Referente do juízo na segunda pessoa do singular
  choice: Manter a interpelação singular «você», dirigida ao opressor ou ao grupo representado coletivamente como uma só pessoa.
  alternative: Explicitar que ninguém pertencente ao grupo participará da futura repartição, ou restringir a declaração especificamente aos falsos profetas ou líderes.
  rationale: A forma hebraica é singular e o contexto imediato aponta para os que se apoderavam das terras, mas o versículo não especifica com precisão maior o subgrupo. A tradução conserva essa tensão sem acrescentar uma identificação.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A expressão concreta «corda de medir» preserva a imagem antiga, enquanto as notas esclarecem seu uso na repartição de terras.
