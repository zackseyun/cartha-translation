base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: pt
  text: 'Se um homem andasse por aí falando vento e falsidade, mentindo: “Pregarei a ti sobre vinho e bebida forte”, ele seria o pregador deste povo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais formal: “Profetizarei a ti sobre vinho e bebida forte”; então ele seria o profeta deste povo. O mesmo verbo hebraico aparece nas duas orações e é usado para o discurso profético, aqui com ironia mordaz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Se
  rationale: Introduz uma situação hipotética e sustenta o tom satírico sem acrescentar o sentido desiderativo de “quem dera”.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o singular masculino do hebraico e sua função retórica.
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: andasse por aí com vento e falsidade
  rationale: Mantém a imagem difícil do “vento”, que sugere vacuidade ou falta de substância, e explicita a falsidade sem reduzi-la a uma paráfrase interpretativa como “falastrão”.
- source_word: כִּזֵּב
  choice: mentindo
  rationale: Expressa de modo natural a ação enganosa que introduz a fala citada.
- source_word: אַטִּף
  choice: Pregarei
  rationale: O verbo נטף pode designar discurso profético, aqui empregado com ironia. “Pregarei” comunica proclamação religiosa pública em português corrente.
- source_word: לְךָ
  choice: a você
  rationale: Conserva a segunda pessoa singular do texto hebraico, provavelmente dirigida coletivamente ao povo.
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: sobre vinho e bebida forte
  rationale: A preposição apresenta o tema da mensagem; “bebida forte” mantém a categoria mais ampla de bebida intoxicante além do vinho.
- source_word: וְהָיָה מַטִּיף
  choice: ele seria o pregador
  rationale: Apresenta o resultado da hipótese e mantém em português a ligação lexical com “Pregarei”, preservando a ironia.
- source_word: הָעָם הַזֶּה
  choice: deste povo
  rationale: Reflete o coletivo singular hebraico e conserva o tom de censura profética.
theological_decisions:
- issue: Tradução de נטף em uma denúncia irônica de discurso profético
  choice: pregarei / pregador
  alternative: profetizarei / profeta
  rationale: “Pregar” comunica de modo acessível a proclamação religiosa que o povo deseja ouvir sem sugerir que o personagem tenha verdadeira autoridade profética. A alternativa mais técnica fica registrada em nota.
- issue: Sentido de רוּחַ na descrição do falso mensageiro
  choice: vento
  alternative: espírito
  rationale: “Vento” preserva a imagem de vacuidade favorecida pelo contexto de falsidade, sem apagar completamente a tensão lexical, registrada na análise; traduzir “espírito” poderia sugerir indevidamente inspiração autêntica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “andasse por aí com vento e falsidade” conserva deliberadamente a imagem incomum do hebraico; “bebida forte” mantém o registro bíblico sem restringir o referente a uma bebida específica.
