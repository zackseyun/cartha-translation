    rationale: A locução é pouco natural em português e obscurece a função de רוח como imagem de fala vazia no sintagma difícil. «Falando vento e falsidade» conserva a imagem lexical sem a leitura literal de companhia.
  - severity: low
    issue: «Pregarei a você»
    rationale: Embora correta, a construção é menos fluida no registro bíblico pretendido. «Pregarei a ti» preserva o singular do hebraico em formulação amplamente reconhecível.
