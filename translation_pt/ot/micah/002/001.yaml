  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: pt
  text: Ai dos que tramam perversidade e praticam o mal em seus leitos! Ao raiar da manhã, eles a põem em prática[a], porque têm poder em suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque a mão deles é o deus deles”, entendendo “deus” como uma descrição figurada do poder que eles exaltam.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Ai dos
  rationale: A interjeição profética introduz denúncia e ameaça; “Ai dos” preserva sua força oracular em português natural.
- source_word: חֹשְׁבֵי אָוֶן
  choice: os que tramam perversidade
  rationale: O particípio expressa planejamento intencional, e אָוֶן designa aqui conduta moralmente perversa. “Tramam” comunica a ideia de maquinação deliberada.
- source_word: וּפֹעֲלֵי רָע
  choice: e planejam o mal
  rationale: Embora פעל normalmente indique fazer ou realizar, no paralelismo com a atividade noturna a expressão descreve a elaboração do mal que será executado pela manhã. A formulação evita a pouco natural expressão portuguesa “produzem o mal”.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: em suas camas
  rationale: Retrata de modo claro e natural o cenário noturno em que elaboram seus planos.
- source_word: בְּאוֹר הַבֹּקֶר
  choice: Ao raiar da manhã
  rationale: Preserva a imagem da primeira luz do dia em português corrente e digno.
- source_word: יַעֲשׂוּהָ
  choice: eles o põem em prática
  rationale: O sufixo feminino retoma a perversidade ou ação planejada. A expressão explicita naturalmente a passagem do plano à execução sem especificar demais o objeto.
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: porque têm poder para isso
  rationale: A construção é entendida idiomaticamente como posse de capacidade ou poder. A tradução comunica o sentido imediato, embora não reproduza a imagem literal da mão; a leitura alternativa é preservada em nota.
theological_decisions:
- issue: Sentido de לְאֵל na oração final
  choice: Referência idiomática ao poder que eles possuem
  alternative: porque sua mão é o seu deus
  rationale: 'No contexto, a oração explica por que conseguem executar seus planos ao amanhecer: dispõem do poder necessário. A leitura de אֵל como “deus” é retoricamente possível, mas sintaticamente menos direta, por isso fica registrada em nota sem eliminar a ambiguidade genuína.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo entre planejar durante a noite e executar pela manhã foi mantido com linguagem clara e digna.
