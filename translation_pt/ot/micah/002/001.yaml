  naturalness: «Ai dos que tramam perversidade e praticam o mal em seus leitos» é natural, digno e claro em português moderno. «Ao raiar da manhã» preserva bem a imagem de בְּאוֹר הַבֹּקֶר. «Têm poder em suas mãos» mantém a imagem hebraica sem sacrificar a clareza.
  terminology: '«Perversidade» para אָוֶן e «mal» para רָע preservam o paralelismo sem redundância excessiva. A nota alternativa deve formular de modo mais exato a leitura que entende אֵל como «deus»: «a mão deles é o deus deles».'
