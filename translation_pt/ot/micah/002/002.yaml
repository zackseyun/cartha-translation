base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: pt
  text: Cobiçam campos e os tomam à força[a]; cobiçam casas e as levam. Oprimem um homem e sua casa, um homem e sua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os roubam” ou “se apoderam deles”.'
    reason: lexical_alternative
  - marker: b
    text: “Herança” refere-se especialmente à terra ancestral ou ao patrimônio familiar recebido por herança, e não apenas a bens em geral.
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: cobiçam
  rationale: Preserva o peso moral do desejo ilícito pelo que pertence a outro e, no hebraico, rege tanto “campos” como “casas”.
- source_word: שָׂדוֹת
  choice: campos
  rationale: Equivalente concreto e natural para parcelas de terra cultivável.
- source_word: גָזָלוּ
  choice: tomam à força
  rationale: Expressa a apropriação injusta ou violenta implícita no verbo, sem restringi-la a uma modalidade específica de roubo.
- source_word: בָתִּים
  choice: casas
  rationale: Mantém o foco concreto em bens imóveis e corresponde diretamente ao substantivo hebraico.
- source_word: נָשָׂאוּ
  choice: levam
  rationale: No contexto, indica remover ou tomar para si; “levam” é conciso e natural, e evita a formulação pouco idiomática “levam embora casas”.
- source_word: עָשְׁקוּ
  choice: oprimem
  rationale: Abrange exploração, fraude e espoliação econômica, preservando a amplitude da injustiça denunciada.
- source_word: גֶּבֶר
  choice: o homem
  rationale: Retém o masculino singular representativo e forma o primeiro membro do paralelismo.
- source_word: בֵיתוֹ
  choice: sua casa
  rationale: Conserva a ambiguidade entre a casa física e, por extensão, a família ou unidade doméstica.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém a forma masculina singular do segundo membro paralelo, sem neutralização ou pluralização.
- source_word: נַחֲלָתוֹ
  choice: sua herança
  rationale: Preserva o sentido legal e ancestral, especialmente o de terra patrimonial recebida por herança.
theological_decisions:
- issue: Substantivos masculinos singulares גֶּבֶר e אִישׁ
  choice: o homem ... o homem
  alternative: uma pessoa ... uma pessoa
  rationale: O hebraico apresenta duas designações masculinas singulares em paralelismo. A tradução conserva essa forma representativa sem introduzir uma leitura neutra ausente do texto.
- issue: Sentido de בֵיתוֹ
  choice: sua casa
  alternative: sua família / seus familiares
  rationale: “Casa” preserva deliberadamente a tensão entre imóvel e unidade doméstica, adequada ao contexto de desapropriação.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “cobiçam” explicita a coordenação hebraica: o verbo inicial rege “campos”, e a segunda conjunção liga “casas” como outro objeto do mesmo verbo. O paralelismo e o masculino singular foram preservados.'
