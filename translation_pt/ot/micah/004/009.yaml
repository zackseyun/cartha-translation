base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: pt
  text: Agora, por que você clama tão alto?[a] Acaso não há rei em você?[b] Ou seu conselheiro pereceu, pois as dores do parto se apoderaram de você[c] como de uma mulher em trabalho de parto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “solta um forte grito” ou “clama em alta voz”. O verbo hebraico indica um grito ou clamor forte; neste contexto, provavelmente expressa angústia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Não há rei em você?”. A expressão pode equivaler a “Você não tem rei?”, mas a tradução mantém a imagem do hebraico.
    reason: lexical_alternative
  - marker: c
    text: Ou “tomaram conta de você” ou “agarraram você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: Agora, por que
  rationale: עַתָּה é um advérbio temporal explícito, e לָמָּה introduz a pergunta. A tradução conserva tanto a transição temporal quanto a força retórica.
- source_word: תָרִיעִי רֵעַ
  choice: você grita tão alto
  rationale: O hifil de רוע/ריע, acompanhado de רֵעַ com valor adverbial, descreve um grito intenso. Em português, a expressão transmite de modo natural o clamor angustiado e seu volume.
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: Acaso não há rei em você?
  rationale: Mantém a construção incomum e metafórica 'em você', em vez de reduzi-la à simples ideia de posse; 'acaso' sinaliza a pergunta retórica.
- source_word: אִם יוֹעֲצֵךְ אָבָד
  choice: Ou será que seu conselheiro pereceu
  rationale: 'Neste contexto interrogativo, אִם apresenta uma alternativa: ''ou''. ''Conselheiro'' traduz diretamente o particípio de יעץ, e ''pereceu'' preserva a contundência de אָבָד sem especificar a causa.'
- source_word: הֶחֱזִיקֵךְ חִיל
  choice: as dores do parto se apoderassem de você
  rationale: חִיל designa aqui as dores associadas ao parto, esclarecidas pela comparação seguinte. הֶחֱזִיקֵךְ expressa que elas tomam a pessoa de modo forte; a flexão no plural produz português natural.
- source_word: כַּיּוֹלֵדָה
  choice: como de uma mulher que está dando à luz
  rationale: O particípio feminino retrata uma mulher no ato de dar à luz. A formulação conserva a imagem vívida e a referência feminina.
theological_decisions:
- issue: Personificação feminina de Sião/Jerusalém
  choice: Preservar o tratamento direto e a comparação com uma mulher dando à luz, sem acrescentar o nome 'Sião' ou 'Jerusalém'.
  alternative: Explicitar no texto 'filha de Sião' ou neutralizar a personificação feminina.
  rationale: As formas hebraicas dirigem-se a uma figura feminina singular, mas este versículo não a nomeia. A tradução mantém a imagem e evita inserir uma identificação contextual no texto.
- issue: Relação entre rei e conselheiro
  choice: Manter duas perguntas alternativas ligadas por 'ou', sem identificar o rei e o conselheiro como a mesma pessoa.
  alternative: Fundir as duas designações ou interpretá-las explicitamente como referências a Deus ou a um governante humano.
  rationale: O hebraico permite tensão quanto à identidade e à relação dessas figuras; a tradução não resolve essa ambiguidade teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o 'Agora' por corresponder ao עַתָּה explícito no texto hebraico, mantém a metáfora incomum 'rei em você' e usa linguagem comum para o clamor e as dores do parto.
