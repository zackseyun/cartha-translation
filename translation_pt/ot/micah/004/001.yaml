id: MIC.4.1
reference: Micah 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: pt
  text: E acontecerá, nos últimos dias[a], que o monte da casa de Yahweh será estabelecido como o principal dos montes[b]; será elevado acima das colinas, e povos afluirão a ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos dias vindouros”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “à cabeça dos montes”; a expressão pode indicar máxima proeminência, não apenas localização física.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico retrata os povos fluindo como uma corrente em direção ao monte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Expressa de modo natural e digno a fórmula profética que introduz uma situação futura, preservando seu caráter eventivo.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Conserva a expressão profética e sua abertura escatológica; a nota registra a alternativa temporal menos técnica.
- source_word: הַר בֵּית יְהוָה
  choice: o monte da casa de Yahweh
  rationale: Reproduz com clareza a cadeia construta hebraica e associa o monte à casa, isto é, ao santuário, de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: נָכוֹן
  choice: será estabelecido
  rationale: Comunica firmeza, estabilidade e posição reconhecida sem definir se a imagem é apenas física ou simbólica.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: como o principal dos montes
  rationale: Expressa a possível ideia de primazia contida em 'à cabeça dos montes', em paralelo com sua elevação acima das colinas.
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: ele se elevará acima das colinas
  rationale: Mantém a imagem de exaltação do monte em português corrente, sem decidir entre transformação topográfica e proeminência simbólica.
- source_word: וְנָהֲרוּ
  choice: afluirão
  rationale: O verbo evoca um fluxo semelhante ao de um rio; 'afluirão' preserva tanto a imagem quanto o movimento de muitos povos para um mesmo destino.
- source_word: עַמִּים
  choice: povos
  rationale: Preserva a referência a múltiplos grupos humanos sem substituí-la pelo termo mais político 'nações'.
- source_word: עָלָיו
  choice: a ele
  rationale: O referente contextual é o monte; com verbo de movimento, 'a ele' é natural em português.
theological_decisions:
- issue: Alcance da expressão profética בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  alternative: nos dias vindouros
  rationale: A formulação mantém o possível peso escatológico sem vinculá-la a um sistema específico; a nota preserva a leitura temporal mais ampla.
- issue: Natureza da exaltação do monte
  choice: Linguagem simultaneamente espacial e honorífica
  alternative: Mudança topográfica estritamente literal ou supremacia puramente simbólica
  rationale: O texto permite que a elevação denote altura e proeminência. A tradução conserva essa tensão em vez de escolher uma única interpretação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém a solenidade profética sem arcaísmos. 'Monte' e 'colinas' preservam o paralelismo poético; 'afluirão' conserva a metáfora hídrica de maneira idiomática.
