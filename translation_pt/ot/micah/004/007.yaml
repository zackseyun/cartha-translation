  text: וְ/שַׂמְתִּ֤י אֶת הַ/צֹּֽלֵעָה֙ לִ/שְׁאֵרִ֔ית וְ/הַ/נַּהֲלָאָ֖ה לְ/ג֣וֹי עָצ֑וּם וּ/מָלַ֨ךְ יְהוָ֤ה עֲלֵי/הֶם֙ בְּ/הַ֣ר צִיּ֔וֹן מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: pt
  text: Farei da que manca[a] um remanescente e da que foi afastada[b] uma nação poderosa; Yahweh reinará sobre eles no monte Sião, de agora em diante e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma forma feminina singular, “a que manca”, provavelmente como personificação da comunidade aflita; a mesma construção ocorre em “a que foi afastada”.
    reason: grammatical_and_literary_clarification
  - marker: b
    text: Também pode ser traduzido como “a que foi expulsa” ou “a que foi levada para longe”; a expressão evoca dispersão ou exílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Farei de
  rationale: Neste uso predicativo com לְ, o verbo שׂוּם indica transformar ou constituir alguém em algo; “fazer de” expressa naturalmente esse resultado em português.
- source_word: הַצֹּלֵעָה
  choice: a que manca
  rationale: Preserva o particípio feminino singular e a imagem concreta de alguém que manca, provavelmente uma personificação coletiva da comunidade ferida.
- source_word: לִשְׁאֵרִית
  choice: um remanescente
  rationale: Mantém o importante termo profético שְׁאֵרִית para o grupo que sobrevive ao juízo e é preservado.
- source_word: הַנַּהֲלָאָה
  choice: a que foi expulsa
  rationale: O particípio passivo feminino descreve quem foi afastado ou lançado para longe; “expulsa” comunica com clareza o contexto de exílio sem apagar a personificação singular.
- source_word: לְגוֹי עָצוּם
  choice: uma nação poderosa
  rationale: גּוֹי designa uma nação ou povo, e עָצוּם aqui comunica força ou poder; a expressão é clara e natural em português.
- source_word: וּמָלַךְ יְהוָה
  choice: Yahweh reinará
  rationale: מָלַךְ expressa o exercício da realeza, e o nome divino יהוה é transliterado como “Yahweh”, em vez de ser substituído por um título.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: Com o verbo “reinar”, עַל indica domínio sobre um povo. O plural do hebraico é preservado, embora os grupos tenham sido apresentados por personificações singulares.
- source_word: בְּהַר צִיּוֹן
  choice: no monte Sião
  rationale: Indica o lugar do reinado de Yahweh; “no monte Sião” é a forma idiomática em português.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: de agora em diante e para sempre
  rationale: Reproduz a progressão temporal desde o presente indicado até uma duração sem fim, em português natural.
theological_decisions:
- issue: Personificações femininas singulares para a comunidade restaurada
  choice: Manter “a que manca” e “a que foi expulsa”, seguidas pelo pronome plural “eles”.
  alternative: 'Converter tudo em plurais: “os que mancam” e “os que foram expulsos”.'
  rationale: O hebraico apresenta as duas figuras no feminino singular, provavelmente personificando Sião ou seu povo, mas depois usa o plural “sobre eles”. A tradução conserva essa mudança de número e sua tensão literária.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome pessoal divino presente na fonte hebraica.
- issue: Alcance temporal do reinado
  choice: de agora em diante e para sempre
  alternative: desde agora e até um tempo indefinido
  rationale: No contexto, עַד־עוֹלָם apresenta o reinado como duradouro sem limite expresso; “para sempre” mantém a formulação profética tradicional sem acrescentar uma definição sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo profético, o vocabulário teológico de “remanescente”, o nome Yahweh e a mudança deliberada do singular personificado para o plural coletivo.
