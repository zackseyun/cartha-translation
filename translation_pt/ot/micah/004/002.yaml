source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: pt
  text: 'Muitas nações virão e dirão: “Venham, subamos ao monte de Yahweh, à casa do Deus de Jacó, para que ele nos ensine os seus caminhos e andemos pelas suas veredas.” Pois de Sião sairá a Torá[a], e de Jerusalém, a palavra de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lei” ou “instrução”.
    reason: Alternativas lexicais legítimas para תּוֹרָה.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: virão
  rationale: Embora הלך signifique literalmente “ir/andar”, o movimento das nações é apresentado em direção a Sião; “virão” expressa naturalmente essa perspectiva de destino em português.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Tradução direta que preserva o alcance internacional da visão.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Venham, subamos
  rationale: Mantém o convite coletivo e a ideia de subida a Jerusalém em linguagem portuguesa natural.
- source_word: הַר יְהוָה
  choice: monte de Yahweh
  rationale: Preserva o sentido concreto de הַר e verte o nome divino como nome próprio.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: casa do Deus de Jacó
  rationale: Mantém o idiomatismo hebraico “casa”, sem explicitar interpretativamente “templo”.
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: para que ele nos ensine os seus caminhos
  rationale: Expressa a finalidade do convite e verte de modo idiomático a construção de ירה com מן.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: e andemos pelas suas veredas
  rationale: Preserva a metáfora bíblica do caminhar como conduta e a distinção poética entre “caminhos” e “veredas”.
- source_word: כִּי
  choice: Pois
  rationale: Introduz naturalmente a razão explicativa para a peregrinação e a busca de ensino.
- source_word: תּוֹרָה
  choice: Torá
  rationale: Conserva a amplitude covenantal e instrutiva do termo hebraico, sem reduzi-lo apenas a legislação; a nota fornece equivalentes acessíveis.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Tradução direta que preserva tanto a noção de palavra divina quanto o nome pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה no contexto profético de Sião
  choice: Torá
  alternative: lei; instrução
  rationale: “Torá” mantém a amplitude semântica de ensino divino e sua ressonância pactual e canônica; a nota registra alternativas legítimas.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe poética foi preservada sem rigidez; a elipse verbal na última oração foi representada por vírgula: “e de Jerusalém, a palavra de Yahweh”.'
