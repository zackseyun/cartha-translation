source:
  edition: WLC
  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: pt
  text: Levante-se e debulhe, filha de Sião, pois farei seu chifre de ferro e seus cascos de bronze. Você esmagará muitos povos; consagrarei[a] a Javé o ganho[b] deles e a riqueza deles ao Senhor de toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porei sob anátema”. O verbo hebraico indica a entrega irrevogável de algo a Deus e, em certos contextos, inclui sua destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lucro” ou “despojo”. O termo hebraico pode designar ganho e, por vezes, traz uma conotação de cobiça ou injustiça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי
  choice: Levante-se
  rationale: Imperativo feminino singular dirigido à filha de Sião; é atual, claro e preserva o chamado à ação.
- source_word: וָד֣וֹשִׁי
  choice: e debulhe
  rationale: Preserva a metáfora agrícola de separar o grão por pisoteio, desenvolvida pelas imagens dos cascos e do esmagamento.
- source_word: בַת צִיּ֗וֹן
  choice: filha de Sião
  rationale: Mantém a personificação profética de Sião/Jerusalém e sua função vocativa.
- source_word: קַרְנֵ֞ךְ
  choice: seu chifre
  rationale: Conserva a imagem bíblica concreta de força e poder ofensivo, sem substituí-la por uma interpretação abstrata.
- source_word: בַּרְזֶל֙
  choice: ferro
  rationale: Reproduz o metal associado à força na transformação figurada do chifre.
- source_word: וּפַרְסֹתַ֨יִךְ֙
  choice: e seus cascos
  rationale: Mantém a figura do animal que pisa o cereal na debulha e prepara a imagem do esmagamento dos povos.
- source_word: נְחוּשָׁ֔ה
  choice: bronze
  rationale: É a designação mais provável e convencional do metal neste contexto de resistência e poder.
- source_word: וַהֲדִקּ֖וֹת
  choice: Você esmagará
  rationale: Expressa com clareza a ação forte de triturar ou reduzir em pedaços e corresponde à metáfora da debulha.
- source_word: עַמִּ֣ים רַבִּ֑ים
  choice: muitos povos
  rationale: Traduz o plural עַמִּים de modo mais direto que 'nações' e preserva sua referência coletiva.
- source_word: וְהַחֲרַמְתִּ֤י
  choice: consagrarei
  rationale: Comunica a entrega irrevogável a Deus sem reduzir o verbo apenas à destruição; a possibilidade técnica de pôr sob anátema é indicada em nota.
- source_word: לַֽיהוָה֙
  choice: a Javé
  rationale: Representa explicitamente o nome divino e preserva sua distinção em relação a אֲדוֹן, 'Senhor', no segundo membro.
- source_word: בִּצְעָ֔ם
  choice: o ganho deles
  rationale: Mantém a amplitude do termo, que pode significar ganho, lucro ou despojo e pode, sem necessariamente fazê-lo aqui, ter conotação de cobiça ou injustiça.
- source_word: וְחֵילָ֖ם
  choice: e a riqueza deles
  rationale: No paralelismo com 'ganho' e no contexto dos bens tomados dos povos, 'riqueza' é mais adequada que os sentidos alternativos 'força' ou 'exército'.
- source_word: לַאֲד֥וֹן כָּל־הָאָֽרֶץ
  choice: ao Senhor de toda a terra
  rationale: Preserva o título universal e a distinção lexical entre אֲדוֹן e o nome divino יהוה.
theological_decisions:
- issue: Sentido de חרם no contexto de vitória e bens tomados
  choice: consagrarei ... o ganho deles
  alternative: porei o ganho deles sob anátema; destinarei o ganho deles à destruição
  rationale: O objeto do verbo são os bens, não os povos. 'Consagrarei' mantém em primeiro plano a entrega irrevogável a Deus, enquanto a nota preserva a possibilidade de essa entrega envolver o anátema e a destruição.
- issue: Conotação moral de בֶּצַע
  choice: o ganho deles
  alternative: o lucro injusto deles; o despojo deles
  rationale: Embora o termo possa trazer conotação de cobiça ou injustiça, o contexto também permite o sentido de ganho ou despojo. A tradução principal evita tornar obrigatória uma nuance moral discutível e a nota conserva a amplitude lexical.
- issue: Mudança de sujeito entre o esmagamento e a consagração
  choice: Você esmagará ...; consagrarei
  alternative: Você esmagará ... e consagrará
  rationale: 'O hebraico passa explicitamente da segunda pessoa feminina para a primeira pessoa singular. A tradução conserva essa tensão: Sião esmaga os povos, enquanto o próprio Deus declara que consagrará os bens.'
- issue: Distinção entre יהוה e אֲדוֹן
  choice: Javé ... Senhor
  alternative: SENHOR ... Senhor
  rationale: A forma explícita 'Javé' evita apagar a distinção lexical e retórica entre o nome divino e o título 'Senhor' dentro do mesmo versículo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A metáfora agrícola e animal foi mantida sem explicação dentro do texto. Empregou-se 'Javé' para preservar a diferença entre o nome divino e o título 'Senhor'. Os marcadores [a] e [b] aparecem no texto principal na ordem correspondente às notas.
