reference: Micah 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: pt
  text: Cada homem se sentará debaixo da sua videira e debaixo da sua figueira[a], e não haverá quem o amedronte, pois a boca de Yahweh dos Exércitos[b] falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada um se sentará debaixo da sua videira e debaixo da sua figueira”. O hebraico diz literalmente “cada homem”, forma masculina singular empregada em sentido distributivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos” ou “SENHOR das hostes”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: se sentará
  rationale: Embora o verbo esteja no plural, ele é seguido pelo distributivo אִישׁ; por isso, o singular em português expressa naturalmente que cada pessoa se sentará. “Sentar-se” preserva a imagem concreta de repouso seguro.
- source_word: אִישׁ
  choice: cada homem
  rationale: O substantivo masculino singular tem sentido distributivo depois do verbo plural. “Cada homem” conserva tanto a distribuição individual quanto a forma masculina do hebraico.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: debaixo da sua videira e debaixo da sua figueira
  rationale: A tradução direta mantém a imagem tradicional de paz, segurança e prosperidade estabelecida.
- source_word: וְאֵין מַחֲרִיד
  choice: e não haverá quem os faça tremer
  rationale: O particípio מַחֲרִיד designa quem causa tremor ou medo. A construção “não haverá quem” exprime a ausência de qualquer agente ameaçador, e “os” retoma coletivamente os indivíduos mencionados de modo distributivo.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento e a garantia da promessa divina.
- source_word: פִּי יְהוָה צְבָאוֹת
  choice: a boca de Yahweh dos Exércitos
  rationale: “Boca” preserva o idiomatismo hebraico que ressalta a certeza da declaração; “Yahweh” representa o nome divino, e “dos Exércitos” traduz צְבָאוֹת de modo transparente.
- source_word: דִּבֵּר
  choice: falou
  rationale: O perfeito apresenta a declaração como firmemente pronunciada; “falou” preserva a fórmula solene e combina naturalmente com o sujeito “a boca”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama; a transliteração “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Linguagem masculina representativa em אִישׁ
  choice: cada homem
  alternative: cada um; cada pessoa
  rationale: A forma masculina singular do hebraico é distributiva. A tradução mantém essa forma sem eliminar seu alcance representativo.
- issue: Sentido de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos exércitos; das hostes
  rationale: A expressão pode abranger forças militares e celestiais. “Dos Exércitos” conserva essa amplitude sem explicitar uma interpretação mais restrita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “debaixo da sua” e a expressão “a boca de Yahweh” foram mantidas para preservar a imagem e a ênfase do hebraico.
