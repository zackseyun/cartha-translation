id: MIC.4.12
reference: Micah 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: pt
  text: Mas eles não conhecem os pensamentos[a] de Yahweh nem entendem o seu plano, pois ele os ajuntou como feixes para a eira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os planos” ou “as intenções de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: A imagem dos feixes reunidos para a eira indica que as nações foram ajuntadas para serem debulhadas e julgadas.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mas eles
  rationale: O pronome explícito recebe valor contrastivo no contexto; “Mas eles” expressa com naturalidade essa oposição.
- source_word: יָדְעוּ
  choice: não conhecem
  rationale: 'O perfeito hebraico descreve aqui a condição presente das nações: elas desconhecem o que Yahweh pretende.'
- source_word: מַחְשְׁבוֹת
  choice: os pensamentos
  rationale: Preserva o sentido amplo de ideias ou intenções e mantém a distinção em relação a עֲצָה, traduzido por “plano”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הֵבִינוּ
  choice: nem entendem
  rationale: בין indica compreender ou discernir; a formulação é clara e evita repetição excessiva com “conhecem”.
- source_word: עֲצָתוֹ
  choice: o seu plano
  rationale: עֵצָה pode significar conselho, propósito ou plano; “plano” é natural no contexto da intenção divina para as nações.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de que as nações não percebem o propósito de seu próprio ajuntamento.
- source_word: קִבְּצָם
  choice: ele os ajuntou
  rationale: O sujeito implícito é Yahweh, e o sufixo se refere às nações hostis. O perfeito é apresentado como ação já realizada na visão profética.
- source_word: כֶּעָמִיר
  choice: como feixes
  rationale: עָמִיר designa feixe ou montão de cereal cortado; “feixes” conserva claramente a imagem agrícola.
- source_word: גֹּרְנָה
  choice: na eira
  rationale: A terminação direcional aponta para o movimento até a eira; em português, “ajuntar como feixes na eira” comunica naturalmente o destino resultante.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Sujeito de קִבְּצָם, “ele os ajuntou”
  choice: Yahweh é o sujeito implícito e ajunta as nações para julgamento.
  alternative: Sujeito não especificado; Sião como agente
  rationale: Yahweh é o referente mais coerente no contexto imediato, e a imagem da eira apresenta o ajuntamento das nações segundo o plano divino, preparando o julgamento.
- issue: Valor temporal do perfeito קִבְּצָם
  choice: “ele os ajuntou”
  alternative: “ele os tem ajuntado”; “ele os ajunta”
  rationale: O perfeito pode apresentar como consumado o ato visto profeticamente. A tradução mantém essa perspectiva sem explicar em excesso sua relação temporal com a cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eira” mantém o termo bíblico tradicional e preciso; a nota esclarece a imagem. A coordenação “não conhecem... nem entendem” reproduz o paralelismo hebraico com naturalidade.
