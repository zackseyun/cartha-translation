base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
translation:
  language: pt
  text: Naquele dia, declara Yahweh, reunirei as que mancam[a]; ajuntarei as que foram expulsas[b] e as que afligi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a que manca”, no feminino singular, usado aqui com sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as que foram afastadas” ou “as banidas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as que levei à aflição”. O hebraico atribui explicitamente a Yahweh a aflição anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética de modo natural e solene em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula de pronunciamento profético; “declara” conserva sua força solene, e o nome divino é transliterado como Yahweh.
- source_word: אֹסְפָה
  choice: reunirei
  rationale: Expressa o ato de tornar a trazer e reunir o povo, adequado ao contexto de restauração.
- source_word: הַצֹּלֵעָה
  choice: as que mancam
  rationale: O particípio feminino singular tem sentido coletivo. A formulação plural é natural em português e evita um substantivo potencialmente estigmatizante.
- source_word: וְהַנִּדָּחָה
  choice: as que foram expulsas
  rationale: Mantém o sentido passivo de pessoas enxotadas, afastadas ou banidas, mais explícito do que o termo amplo “dispersas”.
- source_word: אֲקַבֵּצָה
  choice: ajuntarei
  rationale: Conserva alguma distinção lexical em relação a אֹסְפָה, ao mesmo tempo que reforça a promessa de restauração.
- source_word: וַאֲשֶׁר הֲרֵעֹתִי
  choice: aquelas a quem causei sofrimento
  rationale: Preserva a referência relativa e a agência divina explícita do hifil na primeira pessoa, sem sugerir intenção maliciosa.
theological_decisions:
- issue: Agência divina no sofrimento anterior
  choice: aquelas a quem causei sofrimento
  alternative: aquelas que deixei sofrer
  rationale: O hebraico atribui explicitamente a Yahweh a ação causadora. A tradução mantém a tensão entre o juízo divino anterior e a restauração prometida, sem suavizar a agência.
- issue: Relação de וַאֲשֶׁר com o grupo precedente
  choice: 'aposição explicativa: “as que foram expulsas, aquelas a quem...”'
  alternative: 'grupo adicional: “e as que...”'
  rationale: A construção pode apresentar as pessoas afligidas como caracterização adicional das expulsas. A redação mantém essa ligação sem afirmar que se trata necessariamente de um grupo inteiramente distinto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo hebraico é preservado por “reunirei/ajuntarei”; as formas coletivas femininas são vertidas no plural para soar naturais em português.
