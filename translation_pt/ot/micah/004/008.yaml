id: MIC.4.8
reference: Micah 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: pt
  text: E tu, torre do rebanho[a], colina[b] da filha de Sião, a ti ela virá; sim, virá a soberania de outrora[c], o reino para a filha de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Migdal-Éder” (nome de lugar); também é possível “torre de vigia do rebanho”.
    reason: alternative_reading
  - marker: b
    text: Ou “Ofel da filha de Sião”, entendendo “Ofel” como nome de lugar, e não como o substantivo comum “colina”.
    reason: alternative_reading
  - marker: c
    text: “A soberania de outrora” provavelmente se refere à restauração do antigo governo régio de Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: torre do rebanho
  rationale: Reproduz o sentido literal da construção hebraica e preserva a imagem profética. Como a expressão também pode ser um topônimo conhecido, essa possibilidade é indicada em nota.
- source_word: עֹפֶל
  choice: colina
  rationale: O substantivo pode designar uma elevação ou funcionar como o topônimo Ofel. “Colina” comunica com clareza o sentido topográfico no texto principal, sem eliminar a alternativa nominal registrada em nota.
- source_word: בַּת צִיּוֹן
  choice: filha de Sião
  rationale: Mantém a personificação profética e sua imagem feminina, em vez de reduzi-la simplesmente a “Sião”.
- source_word: עָדֶיךָ
  choice: a ti
  rationale: Preserva o sentido direcional de “até ti/para ti” e combina naturalmente com o verbo “vir”.
- source_word: תֵּאתֶה
  choice: ela virá
  rationale: A forma verbal é feminina singular e antecipa naturalmente הַמֶּמְשָׁלָה, aqui traduzido pelo feminino “soberania”. O pronome explicita essa ligação catafórica em português.
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: a soberania de outrora
  rationale: מֶמְשָׁלָה expressa governo, domínio ou soberania; הָרִאשֹׁנָה tem aqui valor temporal, referindo-se ao que havia antes. “De outrora” evita a leitura estritamente ordinal de “primeira” e conserva a ideia de restauração.
- source_word: מַמְלֶכֶת
  choice: o reino
  rationale: Mantém a força política e régia do substantivo e sua função de esclarecer, em aposição, a soberania mencionada anteriormente.
- source_word: לְבַת יְרוּשָׁלִָם
  choice: da filha de Jerusalém
  rationale: A construção é apresentada como relação do reino com a Jerusalém personificada. “Da filha de Jerusalém” segue a leitura contextual adotada pela camada de consulta, sem desfazer a metáfora.
theological_decisions:
- issue: Se as designações iniciais devem ser traduzidas como títulos descritivos ou tratadas como nomes próprios ligados a tradições geográficas ou messiânicas
  choice: 'Traduções descritivas no texto principal: “torre do rebanho” e “colina da filha de Sião”'
  alternative: Empregar os topônimos “Migdal-Éder” e/ou “Ofel da filha de Sião”
  rationale: As expressões hebraicas conservam sentidos comuns transparentes e funcionam bem como imagens topográficas. As possibilidades de nomes próprios são genuínas, mas não devem ser impostas ao texto; por isso, aparecem em notas.
- issue: Se “a soberania de outrora” deve ser identificada explicitamente como a monarquia davídica restaurada
  choice: Manter no texto apenas a linguagem política e restauradora expressa pelo hebraico
  alternative: Expandir interpretativamente para “a antiga soberania davídica”
  rationale: O contexto pode apontar para a restauração do governo régio anterior de Jerusalém, mas o versículo não menciona Davi de modo explícito. A tradução preserva essa abertura e evita inserir uma identificação teológica além do que está escrito.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “tu” para conservar o endereço singular e solene. A repetição de “virá” e o reforço “sim” reproduzem a progressão enfática do hebraico. “Soberania” foi preferido a “domínio” também por permitir que a concordância feminina do verbo hebraico permaneça perceptível e natural em português.
