id: MIC.4.5
reference: Micah 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: pt
  text: Pois todos os povos[a] andam[b], cada um em nome do seu deus; nós, porém, andaremos em nome de Yahweh[c], nosso Deus, para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as nações”. O termo hebraico pode designar povos ou nações.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido “andarão”. Aqui, “andar” inclui a ideia de viver ou conduzir-se em lealdade religiosa.
    reason: ambiguity
  - marker: c
    text: “Yahweh” representa o nome divino יהוה (YHWH), tradicionalmente vertido em algumas traduções como “SENHOR” ou “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ou fundamento ligado à promessa anterior; “Pois” preserva essa relação discursiva sem tornar a conexão mais causal do que o hebraico exige.
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: עַמִּים pode designar povos ou nações. “Povos” conserva melhor a ideia plural de grupos humanos distintos.
- source_word: יֵלְכוּ
  choice: andam
  rationale: O verbo הלך significa literalmente “andar” e, neste contexto religioso, também sugere modo de vida e lealdade. O presente expressa adequadamente a prática habitual contrastada com a resolução de Israel.
- source_word: אִישׁ
  choice: cada um
  rationale: Embora אִישׁ seja formalmente masculino singular, aqui tem função distributiva em relação a “todos os povos”; “cada um” preserva essa função sem restringir a referência a homens.
- source_word: בְּשֵׁם
  choice: em nome de
  rationale: A expressão pode envolver lealdade, invocação ou autoridade. “Em nome de” mantém o paralelismo das duas metades e não reduz sua amplitude semântica.
- source_word: אֱלֹהָיו
  choice: seu deus
  rationale: O substantivo singular com sufixo masculino singular acompanha o distributivo אִישׁ. “Seu deus” preserva a forma singular sem afirmar nem negar a realidade dos deuses dos povos.
- source_word: וַאֲנַחְנוּ
  choice: nós, porém
  rationale: A conjunção é formalmente aditiva, mas neste contexto marca contraste. “Nós, porém” reproduz com naturalidade a ênfase explícita do pronome hebraico.
- source_word: נֵלֵךְ
  choice: andaremos
  rationale: O imperfeito pode expressar ação futura, contínua ou resoluta. “Andaremos” conserva o paralelismo verbal e comunica a decisão duradoura do povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta da forma com sufixo, que expressa a relação de Deus com o povo que fala.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente e solene que preserva a intensificação hebraica de duração perpétua.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” conserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Referência a אֱלֹהָיו, o deus de cada povo
  choice: seu deus
  alternative: seus deuses
  rationale: O hebraico está no singular e concorda com a construção distributiva “cada um”. A tradução mantém essa gramática sem resolver a tensão teológica quanto à natureza ou existência dessas divindades.
- issue: Força temporal dos dois verbos imperfeitos
  choice: andam / andaremos
  alternative: andarão / andaremos
  rationale: A primeira forma descreve naturalmente a prática característica dos povos, enquanto a segunda expressa a resolução futura e contínua do grupo que fala. A nota registra a possibilidade de entender a primeira também como futura.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “em nome de” e “andar” conserva o paralelismo hebraico; “nós, porém” torna explícito o contraste já presente no contexto. A pontuação com ponto e vírgula separa as duas lealdades contrastantes sem enfraquecer sua unidade.
