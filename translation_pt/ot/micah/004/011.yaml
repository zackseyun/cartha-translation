source:
  edition: WLC
  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: pt
  text: 'E agora muitas nações se reuniram contra você, dizendo: “Que ela seja profanada, e que os nossos olhos contemplem Sião.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga o versículo ao contexto quanto a mudança temporal e discursiva marcada por עַתָּה.
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: se reuniram contra você
  rationale: O nifal perfeito descreve uma reunião já ocorrida e relevante para a cena presente; עַל tem sentido hostil no contexto.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Tradução direta e natural para grupos nacionais que se juntam contra Sião.
- source_word: תֶּחֱנָף
  choice: Que ela seja profanada
  rationale: O verbo expressa tornar-se impura, contaminada ou profanada. “Profanada” comunica de modo digno e acessível a violação de Sião sem limitar o termo exclusivamente à impureza ritual.
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  choice: e que os nossos olhos contemplem Sião
  rationale: Mantém o idioma corporal explícito “nossos olhos” e traduz חזה como olhar ou contemplar, aqui com o tom hostil de assistir à humilhação de Sião.
theological_decisions:
- issue: Mudança da segunda pessoa na narração para a terceira pessoa feminina na fala das nações
  choice: “contra você” e depois “Que ela seja profanada”
  alternative: Manter “você” também dentro da citação
  rationale: O hebraico primeiro se dirige diretamente à cidade com sufixo feminino de segunda pessoa, mas na fala citada emprega uma forma feminina de terceira pessoa. A tradução conserva essa mudança em vez de uniformizá-la.
- issue: Amplitude semântica de תֶּחֱנָף
  choice: “seja profanada”
  alternative: “seja contaminada” ou “seja tornada impura”
  rationale: A escolha preserva a dimensão religiosa e moral possível no verbo, sem especificar uma modalidade doutrinária ou ritual que o contexto não resolve.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna natural o endereço direto à Sião; “contemplem” preserva a imagem dos olhos e sugere o olhar deliberado e hostil das nações.
