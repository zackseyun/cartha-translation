  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: pt
  text: Contorça-se e gema[a], filha de Sião, como uma mulher que está dando à luz, pois agora você sairá da cidade e habitará no campo, e irá até a Babilônia. Ali você será resgatada[b]; ali Yahweh a redimirá das mãos de seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “grite”. O verbo hebraico pode indicar um grito de dor, de acordo com a imagem do parto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você será libertada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: Contorça-se
  rationale: O imperativo feminino singular, no contexto do parto, descreve as convulsões e a aflição física sem reduzir a imagem simplesmente a 'sofrer'.
- source_word: וָ/גֹ֛חִי
  choice: e gema
  rationale: O verbo coordenado expressa um som de dor; 'gema' é natural em português e se ajusta à imagem do parto. A alternativa 'grite' é registrada em nota.
- source_word: בַּת צִיּוֹן
  choice: filha Sião
  rationale: Preserva a personificação e a forma compacta do idioma profético hebraico, sem explicitar indevidamente 'filha de Sião'.
- source_word: כַּ/יּֽוֹלֵדָה
  choice: como a mulher que está dando à luz
  rationale: Torna explícita e natural a comparação com uma parturiente, preservando a imagem concreta.
- source_word: מִ/קִּרְיָה
  choice: da cidade
  rationale: O substantivo designa a cidade, aqui entendida contextualmente como Jerusalém, sem inserir o nome no texto.
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: e habitará no campo
  rationale: Mantém os sentidos básicos de permanecer/habitar e campo, sem acrescentar 'aberto', ausente do hebraico.
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: irá até a Babilônia
  rationale: A preposição עַד marca o destino ou limite alcançado; 'até a Babilônia' conserva essa força em português corrente.
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: Ali você será resgatada
  rationale: O nifal de נצל indica livramento de perigo. 'Resgatada' é claro e preserva a voz passiva; 'libertada' consta como alternativa em nota.
- source_word: יִגְאָלֵ֣/ךְ
  choice: a redimirá
  rationale: Distingue גאל do verbo anterior e conserva sua dimensão relacional e restauradora no contexto do exílio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: das mãos de seus inimigos
  rationale: Conserva a metáfora hebraica da mão como poder ou domínio; o plural soa mais natural em português com 'inimigos'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força de גאל no contexto de exílio e restauração
  choice: redimirá
  alternative: resgatará; reclamará para si
  rationale: O versículo já emprega נצל para o resgate. Traduzir גאל por 'redimir' mantém a distinção lexical e sua dimensão de restauração por parte daquele que reivindica/liberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a personificação profética de Sião, a metáfora do parto e a sequência entre resgate e redenção. Os pronomes femininos retomam 'filha Sião'.
