base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: pt
  text: Agora, reúna-se em bandos[a], ó filha de tropas! Um cerco foi armado contra nós. Com uma vara, ferem[b] na bochecha o juiz de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «faça cortes em si mesma» ou «reúna-se em tropas». O verbo hebraico pode referir-se a fazer incisões no próprio corpo ou a ajuntar-se em bandos; o contexto militar favorece esta última ideia.
    reason: lexical_alternative
  - marker: b
    text: Ou «ferirão». O imperfeito hebraico pode ter sentido futuro no contexto profético.
    reason: lexical_alternative
  - marker: c
    text: «Juiz de Israel» pode designar, de modo mais amplo, o governante ou líder de Israel. No contexto, alguns também veem uma antecipação messiânica.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: reúna-se em tropas
  rationale: O hitpolel de גדד pode indicar reunir-se em bandos ou fazer cortes no próprio corpo. O contexto militar e a expressão seguinte, «filha de tropas», favorecem a ideia de mobilização, enquanto a forma reflexiva é preservada.
- source_word: בַת גְּדוּד
  choice: filha de tropas
  rationale: Mantém a personificação hebraica de uma cidade ou comunidade como «filha» e o sentido militar de גְּדוּד.
- source_word: מָצוֹר שָׂם עָלֵינוּ
  choice: um cerco foi armado contra nós
  rationale: Expressa de modo natural a imposição do cerco e não introduz um agente específico, pois o sujeito do verbo hebraico não é declarado.
- source_word: בַּשֵּׁבֶט
  choice: com uma vara
  rationale: שֵׁבֶט pode significar vara, bastão ou cetro; como instrumento usado para ferir, «vara» é a opção mais direta.
- source_word: יַכּוּ
  choice: ferem
  rationale: O imperfeito hebraico admite valor presente vívido ou futuro no discurso profético. O presente retrata vividamente a humilhação durante o cerco; a possibilidade futura é indicada em nota.
- source_word: עַל הַלְּחִי
  choice: no rosto
  rationale: לְחִי designa a face lateral, bochecha ou maxilar. «No rosto» é idiomático em português e conserva o caráter público e humilhante do golpe.
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: o juiz de Israel
  rationale: Traduz diretamente o particípio substantivado de שׁפט, sem decidir se a referência é especificamente a um juiz, rei ou governante.
theological_decisions:
- issue: Possível significado messiânico de «o juiz de Israel»
  choice: Manter «o juiz de Israel» sem identificação messiânica explícita no texto principal.
  alternative: Entender a expressão como o governante contemporâneo de Judá ou como antecipação tipológica do Messias.
  rationale: O contexto imediato descreve o cerco e a humilhação do líder de Israel/Judá. A proximidade do anúncio do governante procedente de Belém permite uma leitura messiânica contextual, mas este versículo não identifica inequivocamente o juiz como o Messias.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção vocativa e a personificação «filha de tropas» preservam a imagem hebraica; as ambiguidades lexical, temporal e teológica são mantidas por notas.
