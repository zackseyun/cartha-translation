  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: pt
  text: E julgará entre muitos povos e decidirá disputas envolvendo nações poderosas, mesmo as distantes[a]. Eles transformarão suas espadas em lâminas de arado[b] e suas lanças em podadeiras. Uma nação não levantará a espada contra outra, nem aprenderão mais a guerrear[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repreenderá” ou “arbitrará” em favor de nações poderosas, mesmo as distantes.'
    reason: lexical_alternative
  - marker: b
    text: Ou “relhas de arado”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica também pode significar “treinar para a guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: Ele julgará entre muitos povos
  rationale: Preserva o sentido judicial de שׁפט e distingue עַמִּים, “povos”, de גּוֹיִם, “nações”, mantendo também a referência singular sem identificar explicitamente o sujeito.
- source_word: וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: e resolverá as questões de nações poderosas, mesmo as distantes
  rationale: O hifil de יכח pode indicar repreender, corrigir ou decidir uma causa; em paralelismo com “julgar” e neste contexto de paz internacional, “resolverá as questões” comunica sua força forense sem eliminar totalmente a amplitude lexical. עֲצֻמִים é vertido por “poderosas”, e עַד רָחוֹק, por “mesmo as distantes”.
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: Eles transformarão suas espadas em lâminas de arado[a]
  rationale: כתת descreve o ato de bater ou martelar para refazer; “transformarão” exprime com naturalidade em português o resultado concreto da conversão de armas em instrumentos agrícolas. “Lâminas de arado” é compreensível e preciso para אִתִּים.
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: e suas lanças em podadeiras
  rationale: מַזְמֵרוֹת designa instrumentos de poda. “Podadeiras” é conciso, atual e preserva a imagem agrícola.
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: Uma nação não levantará a espada contra outra
  rationale: Mantém a metáfora hebraica de levantar a espada, mas torna natural em português o uso distributivo do singular גּוֹי.
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: nem aprenderão mais a guerrear[b]
  rationale: Preserva o verbo למד, “aprender”, e expressa מִלְחָמָה de forma idiomática. A nota registra a possibilidade contextual de treinamento militar.
theological_decisions:
- issue: Identidade do sujeito singular dos dois primeiros verbos
  choice: Emprego de “Ele” sem identificar nominalmente o referente
  alternative: Explicitar “o SENHOR”, um governante messiânico ou Sião/Jerusalém personificada
  rationale: O hebraico apresenta um sujeito singular não expresso. O contexto anterior orienta a referência, mas este versículo não a nomeia; a tradução conserva essa tensão em vez de impor uma identificação teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação conserva o paralelismo profético e evita arcaísmos desnecessários. Todos os marcadores de nota aparecem no texto.
