  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: pt
  text: Ouçam, todos os povos; preste atenção, ó terra, com tudo o que nela há. Que o Senhor Yahweh seja testemunha contra vocês[a], o Senhor, do seu santo templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja testemunha entre vocês”. No contexto, “contra vocês” provavelmente expressa o sentido judicial.
    reason: alternative_reading
  - marker: b
    text: Ou “do seu santo palácio” ou “do seu santo santuário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ עַמִּים כֻּלָּם
  choice: Ouçam, todos os povos
  rationale: Mantém o imperativo plural e a convocação direta e solene dirigida à totalidade dos povos.
- source_word: הַקְשִׁיבִי
  choice: preste atenção
  rationale: Reproduz com clareza a força do imperativo feminino singular, cujo destinatário personificado é a terra.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: ó terra, com tudo o que nela há
  rationale: O paralelismo com todos os povos favorece o sentido global de אֶרֶץ; a expressão portuguesa comunica naturalmente todo o conteúdo da terra.
- source_word: וִיהִי
  choice: Que ... seja
  rationale: Expressa de modo natural em português a força jussiva da forma hebraica.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título composto e representa explicitamente o nome divino, sem produzir a repetição pouco natural 'Senhor SENHOR'.
- source_word: בָּכֶם לְעֵד
  choice: testemunha contra vocês
  rationale: Conserva a metáfora jurídica de עֵד e traduz בָּכֶם pelo valor adversativo mais provável no contexto de acusação profética.
- source_word: מֵהֵיכַל קָדְשׁוֹ
  choice: desde o seu santo templo
  rationale: Templo é a acepção mais reconhecível de הֵיכָל para a santa morada divina; 'desde' mantém a ideia de testemunho procedente desse lugar.
theological_decisions:
- issue: Representação de יְהוָה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano SENHOR
  rationale: A tradução explicita o nome da aliança presente no texto hebraico e preserva אֲדֹנָי como 'Senhor', sem inserir uma formulação denominacional.
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: país; terra de Israel
  rationale: O paralelismo com 'todos os povos' e com tudo o que há na terra favorece uma convocação universal.
- issue: Valor de בָּכֶם
  choice: contra vocês
  alternative: entre vocês; no meio de vocês
  rationale: O cenário de testemunho e acusação torna provável o sentido judicial adversativo, embora a preposição hebraica permita uma leitura locativa.
translation_notes:
  register: Português atual, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A segunda pessoa plural foi expressa por 'vocês', enquanto a terra personificada recebe o singular formal 'preste atenção'. A ordem final mantém a repetição enfática de 'o Senhor' no hebraico.
