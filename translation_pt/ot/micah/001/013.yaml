source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: pt
  text: Atrele o carro de guerra ao corcel veloz, ó moradora de Laquis[a]; ela foi o princípio do pecado para a filha de Sião[b][c], pois em você foram encontradas as rebeliões de Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma forma feminina singular e se dirige a Laquis como a uma mulher. Também se pode traduzir: “você que mora em Laquis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ela foi a primeira causa de pecado para a filha de Sião”. A expressão pode indicar que Laquis foi um ponto de origem pelo qual Judá adotou a rebelião de Israel.'
    reason: alternative_reading
  - marker: c
    text: “Filha de Sião” é uma personificação poética hebraica de Sião ou Jerusalém.
    reason: cultural_note
  - marker: d
    text: 'Ou: “as transgressões de Israel”. A palavra hebraica pode enfatizar uma revolta deliberada, e não apenas uma conduta errada em sentido geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם
  choice: Atrele
  rationale: O imperativo de רתם ordena prender um animal a um veículo. “Atrele” é natural em português e preserva a imagem concreta.
- source_word: הַמֶּרְכָּבָה
  choice: o carro de guerra
  rationale: מֶרְכָּבָה designa um carro, frequentemente militar. “Carro de guerra” evita a associação moderna de “carro” com automóvel.
- source_word: לָרֶכֶשׁ
  choice: ao corcel veloz
  rationale: רֶכֶשׁ refere-se a um animal de montaria ou tração conhecido pela rapidez. “Corcel veloz” mantém o singular e explicita essa qualidade.
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: ó moradora de Laquis
  rationale: O particípio feminino singular funciona como vocativo e personifica a cidade; a formulação portuguesa conserva tanto o tratamento direto quanto o gênero feminino.
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: ela foi o princípio do pecado
  rationale: רֵאשִׁית expressa começo ou ponto inicial, e חַטָּאת, neste contexto acusatório, significa pecado. A tradução evita definir além do texto o mecanismo histórico dessa origem.
- source_word: לְבַת צִיּוֹן
  choice: para a filha de Sião
  rationale: A preposição ל é vertida por “para”, enquanto “filha de Sião” preserva a personificação poética hebraica em forma idiomática portuguesa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da acusação precedente; “pois” conserva com naturalidade a força explicativa.
- source_word: בָךְ
  choice: em você
  rationale: Mantém a segunda pessoa feminina singular e o discurso dirigido à cidade personificada.
- source_word: נִמְצְאוּ
  choice: foram encontradas
  rationale: Reproduz diretamente o nifal perfeito plural de מצא e concorda com “rebeliões”.
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: as rebeliões de Israel
  rationale: פֶּשַׁע pode indicar transgressão deliberada ou revolta. “Rebeliões” preserva sua força volitiva e profética.
theological_decisions:
- issue: Sentido de חַטָּאת na acusação profética
  choice: pecado
  alternative: oferta pelo pecado
  rationale: O contexto trata de culpa e rebelião encontradas em Laquis, não de um sacrifício ritual.
- issue: Força de רֵאשִׁית חַטָּאת
  choice: Laquis como princípio ou ponto inicial do pecado para a filha de Sião
  alternative: Laquis como pecado principal, primeira causa específica ou primeira cidade julgada
  rationale: A sintaxe favorece a ideia de começo ou origem, mas não explica precisamente o processo histórico; a tradução mantém essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O vocativo “ó moradora” conserva a personificação feminina; “carro de guerra” impede uma leitura anacrônica, e “corcel” mantém o tom poético sem obscurecer o sentido.
