source:
  edition: WLC
  text: וְ/נָמַ֤סּוּ הֶֽ/הָרִים֙ תַּחְתָּ֔י/ו וְ/הָ/עֲמָקִ֖ים יִתְבַּקָּ֑עוּ כַּ/דּוֹנַג֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ כְּ/מַ֖יִם מֻגָּרִ֥ים בְּ/מוֹרָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: pt
  text: 'E os montes se derreterão debaixo dele,

    e os vales se abrirão em fendas,

    como a cera diante do fogo,

    como águas derramadas por uma encosta.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: se derreterão
  rationale: O verbo נמס indica derreter-se ou dissolver-se. “Se derreterão” é natural em português e prepara a comparação posterior com a cera.
- source_word: הֶהָרִים
  choice: os montes
  rationale: Equivalente direto do substantivo definido plural; “montes” preserva o registro bíblico-poético sem ser obscuro.
- source_word: תַּחְתָּיו
  choice: debaixo dele
  rationale: A preposição com sufixo masculino singular remete ao SENHOR no versículo anterior. “Debaixo dele” mantém o pronome e a coesão do hebraico.
- source_word: וְהָעֲמָקִים
  choice: e os vales
  rationale: עֲמָקִים designa vales ou lugares profundos. “Vales” é a correspondência ampla e natural, em paralelo com “montes”.
- source_word: יִתְבַּקָּעוּ
  choice: se abrirão em fendas
  rationale: A forma verbal expressa partir-se, fender-se ou abrir-se. A escolha comunica vividamente a ruptura do terreno sem sugerir necessariamente um agente humano.
- source_word: כַּדּוֹנַג
  choice: como a cera
  rationale: דּוֹנַג significa “cera”; a comparação é mantida de modo direto.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: diante do fogo
  rationale: A expressão significa literalmente “de diante do fogo” e descreve a cera exposta à presença do fogo. “Diante do fogo” conserva a imagem e soa natural.
- source_word: כְּמַיִם
  choice: como águas
  rationale: O plural poético hebraico é preservado por “águas”, evocando uma massa de água em movimento.
- source_word: מֻגָּרִים
  choice: derramadas
  rationale: O particípio passivo de נגר descreve águas feitas fluir ou vertidas. “Derramadas” preserva tanto a voz passiva quanto a imagem.
- source_word: בְּמוֹרָד
  choice: por uma encosta
  rationale: מוֹרָד designa uma descida ou declive. Em conjunto com “derramadas”, “por uma encosta” comunica naturalmente o movimento descendente.
theological_decisions:
- issue: Referente do pronome em “debaixo dele”
  choice: O pronome remete ao SENHOR, cuja vinda é descrita no versículo anterior.
  alternative: Substituir o pronome por “debaixo do SENHOR” para explicitar o referente.
  rationale: O contexto imediato de Miqueias 1:3 identifica o SENHOR como aquele que vem e pisa os lugares altos da terra. Manter “dele” preserva a coesão pronominal e a forma do hebraico sem apagar a referência contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética em quatro linhas. “Montes” e “águas” preservam o tom bíblico sem arcaísmo excessivo; não foram necessárias notas de rodapé.
