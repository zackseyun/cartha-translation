  text: וְ/שַׂמְתִּ֥י שֹׁמְר֛וֹן לְ/עִ֥י הַ/שָּׂדֶ֖ה לְ/מַטָּ֣עֵי כָ֑רֶם וְ/הִגַּרְתִּ֤י לַ/גַּי֙ אֲבָנֶ֔י/הָ וִ/יסֹדֶ֖י/הָ אֲגַלֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: pt
  text: Por isso, farei de Samaria um monte de ruínas no campo[a], um lugar para plantar vinhas; farei suas pedras descerem para o vale[b] e deixarei à mostra seus alicerces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um monte de ruínas no campo”. A expressão hebraica é compacta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “derramarei suas pedras na ravina”. O verbo hebraico transmite literalmente a ideia de fazê-las fluir ou despencar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Por isso, farei
  rationale: O perfeito qal na primeira pessoa, ligado pelo waw no discurso profético, expressa uma declaração futura. “Por isso” comunica naturalmente a ligação com o juízo anunciado no contexto.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: לְעִי הַשָּׂדֶה
  choice: um monte de ruínas em campo aberto
  rationale: עִי designa um amontoado de ruínas ou escombros, e שׂדה pode indicar campo ou terreno aberto. A formulação explicita o caráter destrutivo sem perder a imagem espacial.
- source_word: לְמַטָּעֵי כָרֶם
  choice: um lugar para plantar vinhas
  rationale: 'A expressão indica destinação ou resultado: o local urbano demolido passará a servir ao plantio de vinhas.'
- source_word: וְהִגַּרְתִּי
  choice: farei ... rolarem
  rationale: O hifil de נגר comunica fazer fluir ou derramar. Com pedras como objeto, “fazer rolar” transmite em português a imagem concreta de pedras despencando encosta abaixo, preservando o sentido causativo.
- source_word: לַגַּי
  choice: para o vale
  rationale: גַּי pode designar vale ou ravina. “Vale” é a opção mais ampla e acessível, sem excluir um desfiladeiro estreito.
- source_word: אֲבָנֶיהָ
  choice: suas pedras
  rationale: O sufixo feminino singular remete a Samaria. Em português, “suas” mantém a referência clara sem impor uma personificação pronominal pouco natural.
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: deixarei à mostra seus alicerces
  rationale: O piel de גלה significa descobrir, expor ou deixar nu. A expressão portuguesa retrata a demolição completa até os alicerces.
theological_decisions:
- issue: Personificação de Samaria nos sufixos femininos
  choice: Empregar os possessivos naturais “suas” e “seus”
  alternative: Usar uma personificação explícita, como “as pedras dela” e “os alicerces dela”
  rationale: O hebraico usa sufixos femininos por concordância com a cidade personificada. Como o possessivo português não marca gênero do possuidor, a tradução conserva a referência à cidade sem introduzir uma personificação artificial nem apagar a imagem profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Monte de ruínas” torna explícito o sentido de עִי; “farei ... rolarem” preserva de modo natural a imagem dinâmica do verbo hebraico. Todos os marcadores de nota aparecem no texto.
