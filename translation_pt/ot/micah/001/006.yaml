  naturalness: O registro é claro e atual. “No campo” é mais natural e semanticamente preciso neste contexto do que “em campo aberto”. “Farei suas pedras descerem para o vale” conserva a imagem de queda provocada sem a especificação adicional de que elas rolariam.
  terminology: “Monte de ruínas”, “vinhas”, “vale” e “alicerces” são escolhas adequadas. Os possessivos “suas/seus” mantêm a referência a Samaria de modo idiomático em português, sem exigir uma personificação pronominal artificial.
