source:
  edition: WLC
  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: pt
  text: Pois as feridas dela são incuráveis[a]; isso chegou até Judá, alcançou o portão do meu povo[b], chegou até Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ferida dela é incurável”. O termo hebraico traduzido como “feridas” está no plural, mas pode ter sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tocou o portão do meu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: incuráveis
  rationale: O adjetivo descreve uma condição sem cura ou desesperadora; “incuráveis” expressa com clareza a gravidade definitiva do juízo.
- source_word: מַכּוֹתֶיהָ
  choice: as feridas dela
  rationale: A forma hebraica é plural e traz sufixo feminino. O plural foi preservado, enquanto “dela” mantém a personificação sem identificar explicitamente o referente.
- source_word: בָאָה
  choice: o mal chegou
  rationale: O verbo feminino singular retoma conceitualmente a calamidade ou aflição. Em português, explicitar “o mal” produz uma frase natural sem determinar além do contexto a natureza do desastre.
- source_word: עַד יְהוּדָה
  choice: até Judá
  rationale: עַד indica o limite ou alcance da calamidade; “até Judá” é direto e idiomático.
- source_word: נָגַע
  choice: alcançou
  rationale: O verbo pode significar tocar, alcançar ou atingir. “Alcançou” retrata a progressão da calamidade sem especificar indevidamente se houve mero contato ou golpe.
- source_word: שַׁעַר
  choice: o portão
  rationale: “Portão” conserva a imagem concreta da entrada fortificada de Jerusalém e tem leitura corrente em português.
- source_word: עַמִּי
  choice: meu povo
  rationale: Mantém a primeira pessoa e o tom relacional e pactual da expressão hebraica.
- source_word: יְרוּשָׁלַיִם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
theological_decisions:
- issue: Referente dos sufixos femininos e sujeito da calamidade
  choice: Preservar “dela” na primeira oração e depois apresentar “o mal” como aquilo que avança.
  alternative: Entender todas as formas femininas como referência direta à cidade personificada, provavelmente Samaria, ou traduzir de modo impessoal como “isso”.
  rationale: O hebraico combina personificação feminina e mudança de construção. A tradução evita identificar expressamente a mulher/cidade e não elimina a possível mudança para a calamidade ou juízo como sujeito.
- issue: Número de מַכּוֹתֶיהָ
  choice: 'Traduzir pelo plural formal: “as feridas dela são incuráveis”.'
  alternative: 'Usar o coletivo singular: “a ferida dela é incurável”.'
  rationale: O plural está expresso no hebraico e funciona naturalmente em português; a nota registra a leitura coletiva singular possível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara. A repetição de “chegou” no fim preserva a progressão enfática até Jerusalém. “Portão” foi preferido a “porta” para evocar a entrada fortificada da cidade.
