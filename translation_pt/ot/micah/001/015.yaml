  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: pt
  text: Ainda trarei contra você aquele que tomará posse[a], ó moradora de Maressa; até Adulão chegará a glória de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um herdeiro”, “um possuidor” ou “um conquistador”. O hebraico provavelmente faz um jogo de palavras com o nome Maressa.
    reason: lexical_alternative
  - marker: b
    text: Ou “a nobreza de Israel”, “a riqueza de Israel” ou “o esplendor de Israel”.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: Ainda
  rationale: 'Expressa a continuação do juízo anunciado: a ação divina não terminou e terá novo desdobramento.'
- source_word: הַיֹּרֵשׁ
  choice: quem tomará posse
  rationale: O termo deriva de ירשׁ, que pode indicar herdar, possuir ou desapossar. A formulação comunica naturalmente a tomada de posse no contexto de conquista e conserva parte do jogo de palavras com Maressa.
- source_word: אָבִי לָךְ
  choice: trarei contra você
  rationale: O hifil de בוא com ל pode significar trazer a ou contra alguém. O contexto de invasão e juízo favorece o sentido hostil, sem precisar identificar o invasor.
- source_word: יוֹשֶׁבֶת
  choice: ó moradora
  rationale: O particípio feminino singular trata a cidade como mulher e a interpela diretamente; a expressão portuguesa preserva essa personificação.
- source_word: מָרֵשָׁה
  choice: Maressa
  rationale: Transliteração portuguesa corrente do topônimo hebraico; o jogo sonoro com o verbo ירשׁ não pode ser plenamente reproduzido e é explicado em nota.
- source_word: עַד עֲדֻּלָּם
  choice: até Adulão
  rationale: עַד marca aqui a extensão espacial do movimento até a localidade de Adulão.
- source_word: יָבוֹא
  choice: chegará
  rationale: No conjunto com עַד, traduz de modo natural o movimento expresso por בוא, isto é, chegar até determinado lugar.
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: a glória de Israel
  rationale: Mantém a amplitude de כָּבוֹד, que pode indicar glória, honra, esplendor, riqueza ou a elite honrada da nação, sem decidir um referente mais estreito.
theological_decisions:
- issue: Referente de “a glória de Israel”
  choice: Manter a expressão ampla “a glória de Israel”.
  alternative: “a nobreza de Israel”, “a riqueza de Israel” ou “o esplendor de Israel”
  rationale: O hebraico permite mais de um referente relacionado. A tradução literal preserva a ambiguidade literária e teológica, enquanto a nota registra as principais possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com interpelação profética direta. “Moradora” preserva a personificação feminina da cidade; a ordem da segunda oração conserva a ênfase inicial no destino, Adulão.
