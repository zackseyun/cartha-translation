  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: pt
  text: Todas as suas imagens esculpidas serão despedaçadas[a], e todos os seus ganhos de prostituição serão queimados no fogo. Reduzirei todos os seus ídolos a uma desolação, pois foi de pagamento de prostituta que ela os ajuntou[b], e ao pagamento de prostituta voltarão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «imagens entalhadas».'
    reason: lexical_alternative
  - marker: b
    text: A expressão refere-se metaforicamente às riquezas obtidas por meio da infidelidade idólatra de Samaria.
    reason: cultural_note
  - marker: c
    text: 'A construção também pode ser entendida como: «voltarão a se tornar pagamento de prostituta».'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: imagens esculpidas dela
  rationale: Preserva o sentido concreto de imagens produzidas por entalhe ou escultura, sem recorrer ao arcaísmo «imagens de escultura».
- source_word: יֻכַּתּוּ
  choice: serão despedaçadas
  rationale: Expressa a destruição violenta indicada pela forma passiva e soa natural em português.
- source_word: אֶתְנַנֶּיהָ
  choice: seus pagamentos de prostituição
  rationale: Mantém explícita a ideia de remuneração por prostituição e permite que o possessivo feminino remeta a Samaria personificada.
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: serão queimados no fogo
  rationale: Conserva a menção expressa ao fogo e reproduz com naturalidade o idioma hebraico.
- source_word: עֲצַבֶּיהָ
  choice: seus ídolos
  rationale: Identifica claramente as imagens cultuais e mantém a variação lexical presente em relação a פְּסִילֶיהָ.
- source_word: אָשִׂים שְׁמָמָה
  choice: Farei ... uma desolação
  rationale: Preserva a construção causativa e a força nominal de שְׁמָמָה, ainda que com formulação portuguesa solene.
- source_word: מֵאֶתְנַן זוֹנָה קִבָּצָה
  choice: ela os ajuntou com o pagamento de uma prostituta
  rationale: O feminino singular conserva Samaria como sujeito personificado; «com» comunica a origem ou os meios pelos quais os objetos foram acumulados.
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: eles voltarão a ser pagamento de prostituta
  rationale: Expressa em português corrente a reversão indicada por שוב, sem definir além do texto o mecanismo dessa volta.
theological_decisions:
- issue: Metáfora da prostituição aplicada à idolatria e à riqueza associada a ela
  choice: Manter explicitamente a linguagem de prostituição no texto principal
  alternative: Substituí-la por «ganhos imorais» ou «riquezas idólatras»
  rationale: O hebraico repete אֶתְנַן e זוֹנָה; suavizar a figura apagaria a força deliberada da denúncia profética.
- issue: Personificação feminina de Samaria
  choice: Empregar formas femininas e possessivos que remetam a Samaria
  alternative: Tratar a cidade de modo impessoal
  rationale: As formas femininas do hebraico integram a imagem da cidade personificada e se harmonizam naturalmente com «Samaria» em português.
- issue: Sentido da cláusula final
  choice: «eles voltarão a ser pagamento de prostituta»
  alternative: «voltarão para o pagamento de uma prostituta»
  rationale: A formulação escolhida representa uma leitura provável segundo a qual as riquezas tomadas voltarão à mesma esfera de prostituição cultual, enquanto a nota registra a construção mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada em «Farei de todos os seus ídolos uma desolação» para evitar uma inversão artificial, mantendo a solenidade e o paralelismo do oráculo. A metáfora sexual foi preservada sem eufemismo.
