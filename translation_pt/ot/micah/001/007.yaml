  to: Todas as suas imagens esculpidas serão despedaçadas[a], e todos os seus ganhos de prostituição serão queimados no fogo. Reduzirei todos os seus ídolos a uma desolação, pois foi de pagamento de prostituta que ela os ajuntou[b], e ao pagamento de prostituta voltarão[c].
