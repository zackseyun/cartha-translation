review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de juízo e a metáfora de prostituição. Contudo, a cláusula final hebraica diz literalmente que «eles voltarão ao pagamento de prostituta»; «voltarão a ser» resolve interpretativamente uma ambiguidade que o texto deve conservar. «Com o pagamento» na cláusula anterior também enfraquece a noção de origem expressa por מִן.
  naturalness: «Imagens esculpidas dela» é pouco idiomático em português moderno; «suas imagens esculpidas» é natural e mantém a referência à cidade personificada. «Reduzirei ... a uma desolação» transmite de modo claro e solene a expressão hebraica.
  terminology: «Ganhos de prostituição» comunica de modo natural pagamentos/riquezas associados à prostituição, sem suavizar a metáfora. «Pagamento de prostituta» é mantido nas duas ocorrências finais para refletir a repetição de אֶתְנַן זוֹנָה.
  issues:
  - severity: medium
    issue: A cláusula final é tornada excessivamente interpretativa.
    rationale: «Eles voltarão a ser pagamento de prostituta» escolhe a possibilidade de transformação, enquanto וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ diz, de forma mais direta, «voltarão ao pagamento de prostituta». A tradução principal deve preservar essa ambiguidade.
  - severity: low
    issue: «Imagens esculpidas dela» não soa natural.
    rationale: A posição de «dela» é gramatical, mas marcada e pouco fluente. O possessivo anteposto é a formulação portuguesa normal.
  - severity: low
    issue: «Com o pagamento» não exprime com precisão a origem indicada por מִן.
    rationale: A preposição hebraica indica que ela os reuniu a partir/de ganhos de prostituta; «com» pode sugerir apenas instrumento.
