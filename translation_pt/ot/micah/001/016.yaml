  text: קָרְחִ֣י וָ/גֹ֔זִּי עַל בְּנֵ֖י תַּעֲנוּגָ֑יִ/ךְ הַרְחִ֤בִי קָרְחָתֵ/ךְ֙ כַּ/נֶּ֔שֶׁר כִּ֥י גָל֖וּ מִמֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: pt
  text: Raspe a cabeça e corte o cabelo por causa dos filhos de sua alegria. Aumente sua calvície como a da águia[a], pois eles foram para o exílio, para longe de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como a do abutre». O termo hebraico נֶשֶׁר pode designar uma grande ave necrófaga, e não especificamente uma águia; em qualquer caso, a imagem é de uma calvície bem visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  choice: Raspe a cabeça
  rationale: O imperativo feminino singular descreve um gesto de luto. A formulação é direta, natural em português e explicita a ação pretendida.
- source_word: וָגֹזִּי
  choice: e corte o cabelo
  rationale: גזז significa cortar ou tosquiar. Em paralelo com o primeiro imperativo, a expressão comunica claramente o corte do cabelo como sinal de luto sem recorrer ao pouco natural «tosquie-se».
- source_word: עַל
  choice: por causa de
  rationale: A preposição introduz aqui o motivo do lamento; «por causa de» expressa essa relação sem ambiguidade.
- source_word: בְּנֵי תַּעֲנוּגָיִךְ
  choice: os filhos que lhe dão alegria
  rationale: Preserva a referência aos filhos e transmite em linguagem natural o afeto contido literalmente em «filhos dos seus deleites», sem restringir necessariamente o sentido a filhos homens.
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: Aumente a sua calvície
  rationale: Mantém o imperativo e a imagem incomum do hebraico, referente a ampliar a área raspada ou calva como expressão de luto.
- source_word: כַּנֶּשֶׁר
  choice: como a da águia
  rationale: «Águia» é a tradução tradicional de נֶשֶׁר, mas a elipse «como a da» deixa claro que a comparação recai sobre a calvície. A possível identificação como abutre é registrada em nota.
- source_word: כִּי גָלוּ
  choice: pois eles foram levados ... para o exílio
  rationale: O perfeito apresenta a razão do luto. A forma passiva natural em português preserva explicitamente o tema do exílio e admite a ideia de deportação inerente ao contexto.
- source_word: מִמֵּךְ
  choice: de você
  rationale: Marca a separação dos filhos em relação à mulher, cidade ou comunidade personificada a quem se dirige o imperativo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil. Os imperativos femininos singulares foram preservados, sem identificar além do que o versículo declara a destinatária personificada. A imagem deliberadamente forte e incomum da calvície ritual foi mantida.
