  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/גַת֙ אַל תַּגִּ֔ידוּ בָּכ֖וֹ אַל תִּבְכּ֑וּ בְּ/בֵ֣ית לְעַפְרָ֔ה עָפָ֖ר התפלשתי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: pt
  text: Em Gate, não contem isso; não chorem de modo algum.[a] Em Bete-Leafrá[b], revolva-se no pó.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico vocalizado diz, literalmente, “chorar, não chorem”, uma proibição enfática. Alguns propõem ler a primeira palavra como o nome da cidade de Aco: “em Aco, não chorem”, mantendo a sequência de jogos de palavras com nomes de lugares.'
    reason: alternative_reading
  - marker: b
    text: Bete-Leafrá provavelmente evocava a expressão “casa do pó”, formando um jogo de palavras com “pó” na frase seguinte.
    reason: cultural_note
  - marker: c
    text: 'O texto consonantal traz uma forma de primeira pessoa: “eu me revolvi”. Pelo contexto, a leitura tradicional a entende como imperativo: “revolva-se”.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: Em Gate
  rationale: Mantém o topônimo como nome próprio e traduz naturalmente a preposição בְּ por “em”.
- source_word: אַל תַּגִּידוּ
  choice: não contem isso
  rationale: O hifil de נגד significa contar, comunicar ou anunciar. “Isso” explicita apenas o objeto implícito no hebraico e conserva a formulação breve, com possível eco de 2 Samuel 1:20.
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: não chorem de modo algum
  rationale: 'Segue a vocalização massorética de בָּכוֹ como infinitivo absoluto de בכה, que intensifica a proibição: literalmente, “chorar, não chorem”. A possível leitura conjectural como topônimo “Aco” é registrada em nota, sem substituir no texto principal a leitura do WLC.'
- source_word: בְּבֵית לְעַפְרָה
  choice: Em Bete-Leafrá
  rationale: Translitera o topônimo em forma legível em português. O provável jogo sonoro e semântico com עָפָר, “pó”, é explicado em nota.
- source_word: עָפָר
  choice: pó
  rationale: É o equivalente corrente e preserva tanto a imagem de luto e humilhação quanto o jogo de palavras com Bete-Leafrá.
- source_word: התפלשתי
  choice: revolva-se
  rationale: O contexto de ordens dirigidas às cidades favorece a leitura imperativa tradicional. “Revolva-se no pó” expressa com naturalidade o gesto corporal de luto, enquanto a forma consonantal de primeira pessoa é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, claro e digno, com formas verbais de uso amplo no Brasil. O texto principal segue prioritariamente a vocalização do WLC, enquanto as conjecturas ligadas aos jogos de palavras entre cidades ficam nas notas. A personificação feminina de Bete-Leafrá é comunicada pelo singular “revolva-se”, sem explicitação adicional.
