  source_fidelity: 'O texto principal segue adequadamente o hebraico massorético: «Em Gate» para בְּגַת, a proibição plural «não contem isso» para אַל תַּגִּידוּ, e a construção enfática «não chorem de modo algum» para o infinitivo absoluto seguido de imperfeito em בָּכוֹ אַל תִּבְכּוּ. «Em Bete-Leafrá, revolva-se no pó» preserva a mudança para o singular personificado e registra corretamente em nota a tensão entre o ketiv de primeira pessoa e a leitura imperativa tradicional.'
  naturalness: O português é contemporâneo, claro e adequado ao registro profético. «Não contem isso» é natural para o imperativo plural brasileiro, e «revolva-se no pó» comunica de modo digno o gesto de luto/humilhação dirigido à cidade personificada.
  terminology: «Gate», «Bete-Leafrá» e «pó» são escolhas consistentes. A nota sobre Bete-Leafrá explica o jogo com «casa do pó» sem transformar especulação etimológica em tradução do nome. As notas distinguem corretamente a leitura vocalizada do WLC, a proposta toponímica «Aco» e a forma consonantal de primeira pessoa.
