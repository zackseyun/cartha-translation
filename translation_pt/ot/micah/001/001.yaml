  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: pt
  text: A palavra de Yahweh que veio a Miqueias, o morastita[a], nos dias de Jotão, Acaz e Ezequias, reis de Judá, e que ele viu a respeito de Samaria e Jerusalém.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um homem de Moresete.
    reason: cultural_note
  - marker: b
    text: 'Ou: “contra Samaria e Jerusalém”. A preposição hebraica pode indicar o assunto da visão ou, neste contexto, ter sentido adversativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Palavra de Yahweh
  rationale: Preserva a fórmula profética tradicional e traduz diretamente o nome divino como Yahweh; em português, a ausência de artigo é natural em uma superscrição.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Expressa de modo natural o idioma profético pelo qual a revelação divina chega ao profeta.
- source_word: מִיכָה
  choice: Miqueias
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: הַמֹּרַשְׁתִּי
  choice: o morastita
  rationale: Mantém o gentílico hebraico e sua concisão; a nota esclarece que indica procedência de Moresete.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Reproduz naturalmente a fórmula cronológica hebraica sem explicitar além do texto que se trata dos reinados.
- source_word: יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Jotão, Acaz e Ezequias
  rationale: Emprega as formas portuguesas tradicionais dos nomes reais.
- source_word: מַלְכֵי יְהוּדָה
  choice: reis de Judá
  rationale: Tradução direta da construção hebraica, em aposição aos três nomes.
- source_word: אֲשֶׁר חָזָה
  choice: e que ele viu
  rationale: Conserva o verbo profético 'ver' e acrescenta a conjunção para tornar clara, em português, a retomada da palavra revelada.
- source_word: עַל
  choice: a respeito de
  rationale: Mantém o sentido amplo de assunto ou referência sem excluir a possível nuance adversativa, registrada em nota.
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: Samaria e Jerusalém
  rationale: Usa as formas portuguesas estabelecidas e preserva as cidades nomeadas no texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal presente no hebraico em vez de substituí-lo por um título.
- issue: Nuance da preposição עַל
  choice: a respeito de
  alternative: contra
  rationale: A preposição pode introduzir o assunto da visão ou assumir, no contexto de juízo, força adversativa; o texto principal preserva a formulação mais abrangente e a nota mantém a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas bíblicas portuguesas reconhecíveis. A sintaxe preserva o caráter de título profético sem soar excessivamente arcaica.
