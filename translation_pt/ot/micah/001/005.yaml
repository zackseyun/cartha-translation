id: MIC.1.5
reference: Micah 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: pt
  text: Tudo isso acontece por causa da transgressão[a] de Jacó e por causa dos pecados da casa de Israel. Qual é a transgressão de Jacó? Não é Samaria? E quais são os lugares altos[b] de Judá? Não são Jerusalém?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rebelião”, aqui e na segunda ocorrência de “transgressão”.
    reason: lexical_alternative
  - marker: b
    text: “Lugares altos” eram locais elevados de culto, muitas vezes associados a práticas religiosas não autorizadas ou idólatras.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/פֶשַׁע
  choice: por causa da transgressão
  rationale: A preposição בְּ é causal neste contexto e apresenta a razão do juízo anunciado. “Transgressão” preserva a dimensão moral e pactual de פֶשַׁע.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém-se o nome empregado no hebraico, sem assimilá-lo a “Israel”, preservando o paralelismo com “casa de Israel”.
- source_word: כָּל זֹאת
  choice: Tudo isso
  rationale: Expressão natural que remete ao quadro de juízo anterior sem acrescentar ao texto um substantivo interpretativo.
- source_word: וּ/בְ/חַטֹּאות
  choice: e por causa dos pecados
  rationale: A construção é paralela à primeira oração e também causal; neste contexto, חַטֹּאות significa “pecados”, não “ofertas pelo pecado”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão nacional e pactual, bem como sua forma paralela a “Jacó”.
- source_word: מִי
  choice: Qual é
  rationale: Embora מִי normalmente corresponda a “quem”, aqui introduz retoricamente a identificação da transgressão; “Qual é” comunica isso com naturalidade em português.
- source_word: פֶשַׁע
  choice: transgressão
  rationale: A mesma escolha é mantida nas duas ocorrências para conservar a repetição retórica. “Rebelião” continua sendo alternativa lexical legítima.
- source_word: הֲ/לוֹא
  choice: Não é / Não são
  rationale: A partícula introduz perguntas retóricas que esperam resposta afirmativa; as formas negativas preservam essa força em português.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa tradicional do topônimo, aqui empregado metonimicamente como centro representativo da corrupção do reino do norte.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Designa locais elevados de culto, frequentemente ligados no contexto bíblico a práticas não autorizadas ou idólatras. A tradução preserva a imagem espacial e a ressonância bíblica.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional do nome da tribo e do reino.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa tradicional do topônimo, apresentado como o centro representativo dos lugares altos de Judá.
theological_decisions:
- issue: Referência de “transgressão de Jacó” e “lugares altos de Judá”
  choice: Samaria e Jerusalém são mantidas como respostas metonímicas que identificam as capitais como centros representativos da transgressão e do culto corrompido.
  alternative: Entender as cidades como sendo, em sentido mais abstrato, a própria transgressão e os próprios lugares altos; ou ajustar a segunda pergunta para o singular.
  rationale: O hebraico responde às perguntas retóricas com os nomes das capitais. A tradução conserva essa estrutura e a tensão entre o plural “lugares altos” e a resposta “Jerusalém”, sem explicá-la excessivamente no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva as perguntas retóricas, o paralelismo e a tensão gramatical e metonímica do hebraico. O marcador [b] foi colocado junto de “lugares altos”, termo ao qual a nota cultural efetivamente se refere.
