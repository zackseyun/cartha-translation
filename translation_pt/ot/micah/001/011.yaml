  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: pt
  text: Passe adiante[b], nua e envergonhada, moradora de Safir[a]. A moradora de Zaanã não saiu. O lamento de Bete-Ezel tirará de vocês o seu apoio.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Safir, Zaanã e Bete-Ezel são nomes de lugares. Miqueias provavelmente faz jogos de palavras com seus sons ou sentidos: Safir pode sugerir beleza; Zaanã soa de modo semelhante ao verbo hebraico traduzido como “saiu”; e Bete-Ezel pode sugerir uma casa próxima ou um lugar ao lado.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “Passe”. A ordem pode indicar a partida para o exílio.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “O pranto de Bete-Ezel tira de vocês o seu lugar de permanência”. A última oração é difícil; o hebraico pode referir-se à perda de apoio ou refúgio próximo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: Siga adiante
  rationale: O imperativo é feminino singular e se dirige à cidade personificada como sua moradora. “Siga adiante” comunica o movimento forçado, provavelmente rumo ao exílio. O difícil לָכֶם fica absorvido idiomaticamente na exortação, em vez de receber uma tradução artificial.
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: moradora de Safir
  rationale: Mantém a forma feminina singular e a personificação da cidade, usando a transliteração portuguesa do topônimo.
- source_word: עֶרְיָה בֹשֶׁת
  choice: nua e envergonhada
  rationale: Expressa tanto a nudez quanto a humilhação em português natural, sem atenuar a imagem de exposição pública.
- source_word: לֹא יָצְאָה
  choice: não saiu
  rationale: Tradução direta do perfeito hebraico, preservando a ambiguidade sobre se a cidade não saiu para combater, socorrer ou lamentar.
- source_word: יוֹשֶׁבֶת צַאֲנָן
  choice: A moradora de Zaanã
  rationale: Conserva a construção personificada paralela à de Safir e translitera o nome do lugar.
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: O lamento de Bete-Ezel
  rationale: “Lamento” pode indicar tanto o pranto ocorrido em Bete-Ezel quanto o pranto por essa localidade, sem decidir a ambiguidade.
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: tirará de vocês o seu apoio
  rationale: Entende לקח com מן como remoção e עֶמְדָּתוֹ como aquilo que oferece sustentação ou apoio. O possessivo permanece deliberadamente aberto porque a cláusula hebraica é difícil.
