id: MIC.1.8
reference: Micah 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: pt
  text: Por causa disso, lamentarei e soltarei gritos de dor; andarei descalço e nu[a]. Farei um lamento como o dos chacais e um pranto como o das filhas da avestruz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “despido e nu”. O termo hebraico traduzido como “descalço” é difícil e pode descrever alguém privado de suas vestes ou de seus calçados, em sinal de luto e humilhação.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que significa “avestruzes” ou, possivelmente, “avestruzes fêmeas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה
  choice: lamentarei
  rationale: O verbo ספד indica lamentar, especialmente em contexto de luto. “Lamentarei” é natural e mantém distinção em relação ao clamor mais intenso do verbo seguinte.
- source_word: וְאֵילִילָה
  choice: e soltarei gritos de dor
  rationale: ילל expressa um clamor alto e penetrante. A formulação comunica a intensidade em português atual sem antecipar o vocabulário animal empregado na segunda metade do versículo.
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: andarei descalço e nu
  rationale: עָרוֹם significa claramente “nu”; שילל é difícil, mas provavelmente descreve alguém descalço, como sinal público de luto e humilhação. A possível leitura “despido” é preservada em nota.
- source_word: מִסְפֵּד
  choice: um lamento
  rationale: O substantivo designa uma expressão de lamentação ou luto. “Um lamento” é conciso e preserva a construção em que o profeta diz que fará esse lamento.
- source_word: כַּתַּנִּים
  choice: como o dos chacais
  rationale: תַּנִּים provavelmente se refere a chacais, cujos gritos evocam desolação na poesia profética. “Como o dos” deixa claro que a comparação envolve o som do lamento.
- source_word: וְאֵבֶל
  choice: e um pranto
  rationale: אֵבֶל designa luto ou manifestação de pesar. “Pranto” evita repetição e mantém uma leve distinção em relação a מִסְפֵּד.
- source_word: כִּבְנוֹת יַעֲנָה
  choice: como o das filhas da avestruz
  rationale: A tradução conserva a expressão poética hebraica literalmente, sem apagar sua imagem incomum; uma nota esclarece que ela se refere a avestruzes, possivelmente fêmeas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A intensidade crescente do lamento foi preservada, assim como a imagem poética incomum “filhas da avestruz”. Evitou-se vocabulário zoológico arcaico como “dragões” para תַּנִּים.
