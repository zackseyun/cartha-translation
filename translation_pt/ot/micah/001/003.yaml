  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: pt
  text: 'Pois vejam: o SENHOR está saindo do seu lugar; ele descerá e pisará sobre os lugares altos da terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 'Pois vejam:'
  rationale: כִּי introduz a razão da convocação anterior, e הִנֵּה chama enfaticamente a atenção. A forma plural inclusiva «vejam» comunica essa força de modo natural.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o tetragrama com SENHOR em versaletes.
- source_word: מִמְּקוֹמוֹ
  choice: do lugar onde habita
  rationale: Literalmente, «do seu lugar». No contexto teofânico, a expressão se refere ao lugar de onde o SENHOR sai; a formulação escolhida evita a impressão pouco natural de localização ou posse, sem especificar céu ou templo.
- source_word: יֹצֵא
  choice: está saindo
  rationale: O particípio retrata a ação como iminente ou já em curso e cria vivacidade profética.
- source_word: וְיָרַד
  choice: ele descerá
  rationale: O perfeito consecutivo dá sequência futura à saída anunciada.
- source_word: וְדָרַךְ
  choice: e pisará
  rationale: דָרַךְ significa pôr o pé, pisar ou marchar sobre; «pisará» preserva a imagem direta da teofania.
- source_word: עַל במותי אָרֶץ
  choice: sobre os lugares altos da terra
  rationale: Mantém a expressão espacial e sua possível ressonância cultual, sem restringi-la apenas a montanhas ou santuários.
theological_decisions:
- issue: Local de onde o SENHOR sai
  choice: lugar onde habita
  alternative: seu lugar
  rationale: A tradução comunica a ideia de morada divina sem decidir se o referente específico é o céu ou o templo.
- issue: Sentido de «lugares altos»
  choice: lugares altos da terra
  alternative: alturas da terra
  rationale: A formulação conserva a ambiguidade entre elevações geográficas e locais associados ao culto, importante no contexto profético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A pontuação enfatiza o chamado à atenção e preserva o caráter solene da teofania.
