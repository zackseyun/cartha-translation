source:
  edition: WLC
  text: לָ/כֵן֙ תִּתְּנִ֣י שִׁלּוּחִ֔ים עַ֖ל מוֹרֶ֣שֶׁת גַּ֑ת בָּתֵּ֤י אַכְזִיב֙ לְ/אַכְזָ֔ב לְ/מַלְכֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: pt
  text: Por isso, você dará presentes de despedida[a] para Moresete-Gate; as casas de Aczibe[b] serão um engano para os reis de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “presentes de separação” ou “presentes dados ao mandar alguém embora”; talvez haja aqui uma alusão à linguagem do divórcio.
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, “Aczibe” soa como a palavra traduzida por “engano”, “mentira” ou “decepção”, formando um jogo de palavras: as casas de Aczibe se mostrarão enganosas para os reis de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a inferência que introduz a consequência dos anúncios anteriores de julgamento.
- source_word: תִּתְּנִי
  choice: você dará
  rationale: O imperfeito qal na segunda pessoa feminina singular anuncia uma ação futura. O pronome preserva a referência feminina implícita sem identificar de forma indevida se a destinatária personificada é Judá, Sião, Jerusalém ou uma cidade específica.
- source_word: שִׁלּוּחִים
  choice: presentes de despedida
  rationale: O substantivo plural derivado de שׁלח indica algo dado por ocasião de uma partida ou dispensa. A expressão portuguesa é clara e não transforma a possível alusão ao divórcio em sentido técnico explícito.
- source_word: עַל
  choice: para
  rationale: Neste contexto de dar presentes relacionados a uma localidade, “para” comunica naturalmente a relação, embora a preposição hebraica também possa ter o sentido de “por” ou “a respeito de”.
- source_word: מוֹרֶשֶׁת גַּת
  choice: Moresete-Gate
  rationale: Transliteração portuguesa do topônimo composto, preservando os dois elementos do nome.
- source_word: בָּתֵּי אַכְזִיב
  choice: as casas de Aczibe
  rationale: Reproduz de perto a construção hebraica. “Casas” pode abranger famílias, domicílios ou povoações, mas a formulação literal conserva a imagem e o vínculo com o lugar.
- source_word: לְאַכְזָב
  choice: serão um engano
  rationale: A construção nominal preserva a relação sonora entre Aczibe e אַכְזָב, ao mesmo tempo que produz uma frase compreensível em português.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: para os reis de Israel
  rationale: 'Expressa a relação dativa: as casas de Aczibe se mostrarão enganosas ou decepcionantes para os reis de Israel.'
theological_decisions:
- issue: Destinatária do verbo na segunda pessoa feminina singular
  choice: Manter a destinatária sem identificação explícita, usando “você”
  alternative: Explicitar Judá, Jerusalém, Sião ou Moresete-Gate como a destinatária personificada
  rationale: A forma verbal exige uma destinatária feminina singular, mas o contexto permite mais de uma identificação. A tradução conserva essa ambiguidade real sem acrescentar uma interpretação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os topônimos foram aportuguesados; a ordem e o paralelismo do hebraico foram mantidos sem sacrificar a fluidez.
