  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: pt
  text: Pois a moradora de Marote sofre à espera do bem, porque a calamidade desceu da parte do SENHOR até a porta de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: se contorce à espera do bem
  rationale: חלה pode expressar adoecimento, fraqueza ou angústia intensa. “Se contorce” preserva a força corporal e aflitiva do verbo, enquanto “à espera do bem” torna natural em português a relação com לְטוֹב sem reduzir a expressão a uma espera meramente passiva.
- source_word: יוֹשֶׁבֶת מָרוֹת
  choice: a moradora de Marote
  rationale: O particípio feminino singular designa a habitante ou população personificada da localidade. “Moradora” conserva o gênero e a personificação; “Marote” translitera o topônimo.
- source_word: רָע
  choice: a desgraça
  rationale: Neste contexto de juízo que alcança uma cidade, רָע denota calamidade ou desastre, não maldade moral. “Desgraça” comunica uma calamidade grave em linguagem corrente e digna.
- source_word: מֵאֵת יְהוָה
  choice: da parte do SENHOR
  rationale: מֵאֵת marca procedência ou agência. “Da parte do” preserva que a calamidade procede do SENHOR; o tetragrama é representado pela convenção editorial “SENHOR”.
- source_word: לְשַׁעַר יְרוּשָׁלַיִם
  choice: até a porta de Jerusalém
  rationale: A preposição indica o ponto alcançado, e “porta” representa o acesso urbano e, por extensão, a própria cidade ameaçada.
theological_decisions:
- issue: A calamidade e a ação divina
  choice: “a desgraça desceu da parte do SENHOR”
  alternative: “o mal desceu do SENHOR”
  rationale: A tradução mantém explicitamente a procedência divina afirmada pelo hebraico, sem sugerir que Deus pratique maldade moral. O substantivo contextual é vertido como calamidade concreta.
- issue: Natureza da expectativa de Marote
  choice: “se contorce à espera do bem”
  alternative: “espera ansiosamente pelo bem”
  rationale: A opção preserva a intensidade e possível dimensão física de חָלָה, bem como a tensão entre a esperança de alívio e a chegada da calamidade, sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação conserva a personificação feminina da cidade, a intensidade incomum do verbo hebraico e a tensão teológica do juízo procedente do SENHOR.
