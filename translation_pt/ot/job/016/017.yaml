  language: pt
  text: embora não haja violência em minhas mãos[a] e minha oração seja pura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois não há violência em minhas mãos”. A preposição hebraica admite mais de uma relação; o texto principal adota o sentido concessivo indicado pelo contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “limpa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: embora
  rationale: No contexto, a preposição introduz naturalmente uma concessão ligada ao protesto de inocência de Jó; “embora” preserva essa força sem impor uma relação causal.
- source_word: לֹא
  choice: não haja
  rationale: Na oração nominal hebraica, a negação é expressa naturalmente em português pela construção existencial “não haja”.
- source_word: חָמָס
  choice: violência
  rationale: O substantivo pode abranger violência, injustiça ou mal praticado; “violência” é o equivalente direto e mantém a força moral do termo.
- source_word: בְּכַפָּי
  choice: em minhas mãos
  rationale: A formulação conserva a imagem concreta hebraica das mãos como esfera de ação e responsabilidade.
- source_word: וּתְפִלָּתִי
  choice: e minha oração
  rationale: תְּפִלָּה é o termo comum para oração; aqui designa a fala de Jó dirigida a Deus.
- source_word: זַכָּה
  choice: seja pura
  rationale: O adjetivo denota pureza ou limpeza. “Pura” combina naturalmente com “oração” e preserva sua dimensão moral sem transformar a frase numa alegação de impecabilidade absoluta.
theological_decisions:
- issue: A declaração de inocência de Jó
  choice: Apresentá-la como protesto de que Jó não praticou violência e de que sua oração é pura.
  alternative: Entendê-la como afirmação de ausência absoluta de todo pecado, ou apenas como declaração de pureza ritual.
  rationale: O texto afirma a inocência de Jó quanto à violência e qualifica sua oração; não exige que a tradução amplie isso para impecabilidade total nem que o restrinja à esfera ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A ordem segue de perto o hebraico, e o subjuntivo dá forma natural à construção concessiva iniciada por “embora”.
