  text: אַפּ֤/וֹ טָרַ֨ף וַֽ/יִּשְׂטְמֵ֗/נִי חָרַ֣ק עָלַ֣/י בְּ/שִׁנָּ֑י/ו צָרִ֓/י יִלְט֖וֹשׁ עֵינָ֣י/ו לִֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: pt
  text: 'Sua ira me dilacerou e me odiou;

    ele range os dentes contra mim;

    meu adversário afia os olhos contra mim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “afia os olhos contra mim”: imagem de um olhar fixo, penetrante e hostil.'
    reason: A metáfora hebraica é deliberadamente incomum; a nota esclarece seu sentido sem substituí-la no texto.
lexical_decisions:
- source_word: אַפּוֹ (אַף)
  choice: Sua ira
  rationale: אַף pode significar literalmente “nariz”, mas, por extensão idiomática, indica ira. “Ira” conserva a intensidade poética e permite manter a personificação do hebraico.
- source_word: טָרַף
  choice: me dilacerou
  rationale: O verbo descreve o ato de uma fera rasgar a presa. “Dilacerou” preserva essa imagem violenta sem acrescentar explicações.
- source_word: וַיִּשְׂטְמֵנִי (שׂטם)
  choice: e me odiou
  rationale: שׂטם expressa ódio ou hostilidade persistente. “Odiou” é direto e mantém a formulação forte e incomum na qual “ira” funciona como sujeito personificado.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: ele range os dentes contra mim
  rationale: A expressão retrata o ranger de dentes em hostilidade. A construção portuguesa é idiomática e “contra mim” conserva a direção adversativa de עָלַי.
- source_word: צָרִי
  choice: meu adversário
  rationale: O substantivo designa alguém que se opõe hostilmente. “Adversário” não restringe a referência a um inimigo militar, jurídico ou meramente humano.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: aguça os olhos contra mim
  rationale: לטש significa afiar ou aguçar. A tradução conserva a metáfora deliberadamente incomum do olhar tornado afiado e comunica sua direção hostil.
theological_decisions:
- issue: Identidade do sujeito hostil e do “adversário”
  choice: Manter as referências masculinas singulares sem identificar expressamente quem é o sujeito.
  alternative: Explicitar Deus como sujeito, identificar um inimigo humano ou entender toda a descrição apenas como linguagem figurada sobre um deles.
  rationale: O contexto permite que Jó retrate Deus em termos adversariais, mas este versículo não nomeia o referente. A tradução preserva essa ambiguidade e a tensão teológica do lamento.
- issue: Personificação da ira
  choice: Conservar “Sua ira” como sujeito de “me dilacerou e me odiou”.
  alternative: Naturalizar como “Em sua ira, ele me dilacerou e me odiou”.
  rationale: A sintaxe hebraica apresenta אַפּוֹ, “sua ira”, como sujeito, criando uma personificação intensa. Reformular com “ele” resolveria uma imagem que o texto deixa poeticamente marcada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com paralelismo poético preservado. “Dilacerou”, “range os dentes” e “aguça os olhos” mantêm a força concreta das imagens hebraicas; a sintaxe incomum da primeira linha foi mantida por ser significativa.
