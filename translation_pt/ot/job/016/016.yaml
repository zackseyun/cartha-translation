  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: pt
  text: 'Meu rosto está vermelho de chorar,

    e sobre minhas pálpebras há trevas profundas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sombra da morte”. O termo hebraico pode indicar tanto uma sombra mortal quanto trevas muito profundas; neste contexto, pode descrever a profunda escuridão sobre as pálpebras.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: meu rosto
  rationale: O plural hebraico com sufixo de primeira pessoa funciona idiomaticamente como referência ao rosto; a forma singular é natural e precisa em português.
- source_word: חמרמרה
  choice: está vermelho
  rationale: O verbo raro descreve uma alteração intensa na aparência do rosto. No contexto do choro, “está vermelho” comunica com clareza o efeito visível sem especificar indevidamente inchaço ou inflamação.
- source_word: מִנִּי בֶכִי
  choice: de tanto chorar
  rationale: A preposição indica a causa do estado do rosto, e a expressão portuguesa transmite naturalmente a intensidade implícita no contexto.
- source_word: וְעַל
  choice: e sobre
  rationale: Preserva a coordenação e a relação espacial da segunda linha poética em português corrente e digno.
- source_word: עַפְעַפַּי
  choice: minhas pálpebras
  rationale: Mantém o sentido anatômico específico do hebraico, em vez de generalizá-lo como “meus olhos”.
- source_word: צַלְמָוֶת
  choice: trevas profundas
  rationale: O termo poético pode designar escuridão ou obscuridade extrema, sem exigir uma referência direta à morte. A escolha conserva a força da imagem e sua ambiguidade é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo poético foi preservado em duas linhas, com linguagem digna e acessível. O marcador foi colocado após “trevas profundas”, expressão correspondente ao termo hebraico explicado na nota.
