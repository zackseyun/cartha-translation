source:
  edition: WLC
  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: pt
  text: Pois virão poucos anos[a], e irei pelo caminho do qual não voltarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “anos de número”, isto é, anos poucos ou limitados em número.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pela vereda da qual não voltarei”. A expressão se refere à jornada irreversível rumo à morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a declaração anterior de Jó e preserva a ligação causal de modo natural em português.
- source_word: שְׁנוֹת מִסְפָּר
  choice: poucos anos
  rationale: A expressão construta significa literalmente “anos de número”, um modo de dizer que os anos são poucos ou limitados.
- source_word: יֶאֱתָיוּ
  choice: virão
  rationale: O verbo significa “vir” ou “chegar”; com “anos” como sujeito, o futuro simples expressa de modo direto a aproximação do tempo restante.
- source_word: וְאֹרַח
  choice: e ... pelo caminho
  rationale: אֹרַח designa caminho ou vereda e mantém aqui a metáfora concreta da jornada rumo à morte.
- source_word: לֹא אָשׁוּב
  choice: do qual não voltarei
  rationale: Preserva a negação e relaciona naturalmente a impossibilidade de voltar ao caminho mencionado, sem substituir a imagem por uma explicação.
- source_word: אֶהֱלֹךְ
  choice: irei
  rationale: O Qal imperfeito de הלך significa “ir” ou “andar”; “irei” comunica com clareza o movimento futuro e iminente.
theological_decisions:
- issue: A referência implícita do caminho
  choice: Manter a metáfora do “caminho” sem inserir “morte” no texto principal
  alternative: Explicitar “o caminho da morte”
  rationale: O contexto aponta para a morte e para sua irreversibilidade, mas o hebraico conserva essa ideia em linguagem metafórica; a tradução não deve tornar explícito o que o verso deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da metáfora hebraica. “Poucos anos” comunica o valor idiomático da expressão sem perder sua brevidade, esclarecida em nota.
