  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: pt
  text: Será que não há fim para palavras ao vento? Ou o que o impele a responder assim?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲקֵץ
  choice: Será que não há fim
  rationale: קֵץ significa “fim” ou “limite”. A pergunta é retórica e expressa a exasperação de Jó; “Será que não há fim” comunica essa força com naturalidade em português.
- source_word: לְדִבְרֵי רוּחַ
  choice: para palavras ao vento
  rationale: A expressão significa literalmente “palavras de vento”. “Palavras ao vento” preserva a imagem de fala vazia ou inconsistente e é idiomática em português.
- source_word: אוֹ
  choice: Ou
  rationale: Mantém a conjunção disjuntiva que introduz a segunda pergunta retórica.
- source_word: מַה
  choice: o que
  rationale: Traduz diretamente o pronome interrogativo e deixa em aberto qual impulso ou motivo leva à resposta.
- source_word: יַמְרִיצְךָ
  choice: provoca você
  rationale: O hifil de מרץ pode indicar incitar, impelir ou dar ousadia. “Provoca você” combina com o tom confrontador, enquanto a nota registra a alternativa “dá coragem”.
- source_word: כִּי
  choice: para que
  rationale: Nesta construção, liga o impulso à resposta resultante. “Para que” produz uma pergunta natural em português sem impor uma relação causal rígida.
- source_word: תַעֲנֶה
  choice: responda assim
  rationale: ענה significa “responder”. “Assim” é uma expansão contextual mínima que comunica o caráter reprovador da pergunta.
