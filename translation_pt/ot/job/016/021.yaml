  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/021.yaml
  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: pt
  text: para que ele defendesse a causa de um homem diante de Deus[a], como um ser humano[b] defende a causa do seu próximo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pleiteasse por um homem com Deus”; o verbo hebraico pode ter o sentido jurídico de decidir, arbitrar ou argumentar uma causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filho do homem”, expressão que aqui significa um ser humano, sem ser necessariamente um título messiânico.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “do seu amigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: defendesse a causa
  rationale: O hifil de יכח admite sentidos jurídicos como decidir, argumentar ou pleitear uma causa. A expressão portuguesa comunica a atuação em favor de alguém sem definir de modo excessivo se se trata de arbitragem imparcial ou advocacia.
- source_word: לְגֶבֶר
  choice: de um homem
  rationale: גבר designa aqui um homem como litigante humano; na construção portuguesa, 'defender a causa de um homem' expressa naturalmente o valor benefactivo do ל.
- source_word: עִם אֱלוֹהַּ
  choice: diante de Deus
  rationale: Embora עִם signifique literalmente 'com', no cenário jurídico pode indicar a parte perante a qual a causa é tratada. 'Diante de Deus' soa natural em português e preserva a relação litigiosa sem converter o texto numa arbitragem neutra entre partes.
- source_word: וּבֶן אָדָם
  choice: como um ser humano
  rationale: בן אדם é aqui uma expressão idiomática para um ser humano, paralela a גבר, e não exige leitura como título messiânico. O valor comparativo é suprido pela elipse poética.
- source_word: לְרֵעֵהוּ
  choice: do seu próximo
  rationale: רֵעַ pode indicar próximo, amigo ou companheiro. 'Próximo' mantém a amplitude do termo, e a construção com 'defender a causa' representa o ל benefactivo paralelo.
theological_decisions:
- issue: Possível leitura messiânica de בן אדם
  choice: Traduzir idiomaticamente como 'ser humano', em seu sentido humano imediato.
  alternative: Conservar literalmente 'filho do homem' ou grafar 'Filho do Homem' como título.
  rationale: No paralelismo deste versículo, בן אדם designa um ser humano e corresponde a גבר. A capitalização ou uma formulação titular importaria associações cristológicas posteriores que o hebraico do contexto não exige.
- issue: Função jurídica do agente desejado
  choice: Preservar a ideia de alguém que pleiteia em favor do homem perante Deus.
  alternative: Apresentá-lo como árbitro neutro entre o homem e Deus.
  rationale: O ל de לְגֶבֶר favorece a leitura benefactiva, embora o verbo tenha amplitude jurídica. A formulação evita eliminar essa orientação em favor do homem.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de 'defender a causa' explicita a elipse do segundo hemistíquio e conserva o paralelismo jurídico.
