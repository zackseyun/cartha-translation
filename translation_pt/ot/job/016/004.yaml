base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: pt
  text: Eu também poderia falar como vocês, se vocês estivessem no meu lugar[a]; poderia amontoar palavras contra vocês[b] e balançar a cabeça para vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se a vida de vocês estivesse no lugar da minha”. O termo נֶפֶשׁ pode indicar vida, ser, pessoa ou alma, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “poderia encadear palavras contra vocês”. O verbo hebraico pode sugerir reunir, ligar ou acumular palavras.'
    reason: lexical_alternative
  - marker: c
    text: Balançar a cabeça era, neste contexto, um gesto de desprezo ou zombaria.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Eu também
  rationale: 'Preserva a ênfase na reciprocidade: Jó afirma que seria igualmente capaz de agir como seus amigos.'
- source_word: כָכֶם אֲדַבֵּרָה
  choice: poderia falar como vocês
  rationale: O valor potencial no cenário hipotético é expresso naturalmente por “poderia”, e “como vocês” mantém a comparação com o modo de falar dos amigos.
- source_word: לוּ יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: se vocês estivessem no meu lugar
  rationale: A expressão com נֶפֶשׁ contrapõe as próprias pessoas, vidas ou condições. Esta formulação comunica com clareza a troca hipotética de posições sem impor a ideia de uma alma separada do corpo.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: poderia amontoar palavras contra vocês
  rationale: O verbo sugere reunir, encadear ou acumular palavras; “amontoar palavras” preserva a imagem e o tom hostil do contexto.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: e balançar a cabeça diante de vocês
  rationale: Reproduz o gesto visível indicado pelo hebraico, deixando a nota explicar sua conotação cultural de desprezo ou zombaria.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento plural por “vocês”. A formulação idiomática “estivessem no meu lugar” torna explícita a troca de situação sugerida pelo paralelismo hebraico, enquanto a nota conserva a imagem lexical de נֶפֶשׁ. A repetição de “vocês” mantém o confronto retórico de Jó com seus interlocutores.
