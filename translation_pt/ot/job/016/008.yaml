base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: pt
  text: Tu me fizeste definhar — isso se tornou uma testemunha; minha magreza se levanta contra mim e responde diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Tu me fizeste definhar
  rationale: O verbo descreve alguém enrugado, mirrado ou ressequido; a formulação natural em português comunica o desgaste físico de Jó sem restringir a imagem apenas às rugas.
- source_word: כַחֲשִׁי
  choice: minha magreza
  rationale: Neste contexto, o substantivo aponta para o estado macilento ou consumido de Jó, cuja aparência física atua como prova contra ele.
- source_word: יַעֲנֶה
  choice: responde
  rationale: Preserva o sentido básico de “responder” e a personificação da magreza como acusadora, sem substituir o verbo por uma interpretação jurídica mais específica como “testemunhar”.
- source_word: בְּפָנַי
  choice: na minha cara
  rationale: Expressa de modo vivo e corrente a ideia de algo que confronta Jó diretamente, diante do seu próprio rosto.
theological_decisions:
- issue: Identidade do sujeito que faz Jó definhar
  choice: Manter a segunda pessoa sem acrescentar “Deus”
  alternative: Explicitar “Tu, Deus, me fizeste definhar”
  rationale: O contexto mostra que Jó se dirige a Deus, mas o hebraico não repete o nome divino neste versículo; a tradução preserva essa forma direta.
- issue: Função probatória do sofrimento físico
  choice: Conservar a aparência de Jó como testemunha que se levanta contra ele
  alternative: Explicar que a condição física comprova sua culpa
  rationale: O texto apresenta a imagem acusatória, mas não afirma que essa acusação seja verdadeira; explicitar culpa resolveria indevidamente a tensão do discurso.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento em segunda pessoa singular coerente com a fala direta a Deus. “Na minha cara” é intencionalmente vívido e direto, refletindo o confronto expresso por בְּפָנַי.
