id: JOB.16.19
reference: Job 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם עַ֭תָּה הִנֵּה בַ/שָּׁמַ֣יִם עֵדִ֑/י וְ֝/שָׂהֲדִ֗/י בַּ/מְּרוֹמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: pt
  text: Mesmo agora, eis que a minha testemunha está nos céus, e quem testemunha a meu favor[a] está nas alturas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha testemunha”. O segundo termo hebraico é aramaizante e quase sinônimo de “testemunha”; essa tradução mais literal ressalta o paralelismo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no alto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Mesmo agora
  rationale: A combinação dá ênfase temporal à situação presente de Jó; “Mesmo agora” reproduz essa imediatidade sem tratar גַּם como simples adição.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função dêitica de chamar atenção para a afirmação, em registro digno e corrente na linguagem bíblica portuguesa.
- source_word: בַשָּׁמַיִם
  choice: nos céus
  rationale: Neste contexto, שָׁמַיִם designa o âmbito celestial. O plural “nos céus” também preserva a forma hebraica e é natural em português.
- source_word: עֵדִי
  choice: a minha testemunha
  rationale: Tradução direta do substantivo com sufixo possessivo, preservando a imagem jurídica do apelo de Jó.
- source_word: וְשָׂהֲדִי
  choice: e quem testemunha a meu favor
  rationale: O termo aramaizante é próximo de “testemunha”. A formulação verbal expressa seu sentido forense sem introduzir a noção mais específica e interpretativa de “advogado”; a repetição literal é registrada em nota.
- source_word: בַּמְּרוֹמִים
  choice: nas alturas
  rationale: Preserva a imagem espacial elevada e o paralelismo com “nos céus”, sendo ao mesmo tempo natural em português.
theological_decisions:
- issue: Identidade da testemunha celestial de Jó
  choice: 'Descrever a figura apenas por sua função: “a minha testemunha” e “quem testemunha a meu favor”.'
  alternative: Identificá-la explicitamente como Deus, um mediador angelical ou uma personificação poética do testemunho de Jó.
  rationale: O hebraico afirma que Jó tem uma testemunha nos céus, mas não identifica inequivocamente essa figura. A tradução mantém aberta essa tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a ênfase solene de הִנֵּה; a sintaxe permanece clara sem determinar a identidade da testemunha celestial.
