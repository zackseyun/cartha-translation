  yaml_path: translation/ot/job/016/014.yaml
  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: pt
  text: Ele abre em mim brecha após brecha[a]; lança-se contra mim como um guerreiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “brecha sobre brecha”, preservando mais literalmente a construção hebraica.'
    reason: lexical_alternative
  - marker: b
    text: “Guerreiro” também pode ser traduzido por “homem valente” ou “campeão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: abre em mim brecha
  rationale: O verbo פרץ descreve um rompimento violento e traz o sufixo de primeira pessoa. A formulação mantém a imagem concreta de alguém abrindo uma brecha em Jó e soa natural em português.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: brecha após brecha
  rationale: A repetição do substantivo intensifica a ideia de golpes ou rupturas sucessivas. “Após” comunica claramente essa sucessão, sem eliminar a repetição poética do hebraico.
- source_word: יָרוּץ עָלַי
  choice: lança-se contra mim
  rationale: O verbo רוץ significa correr e, neste contexto hostil, retrata um avanço rápido contra Jó. “Lança-se contra mim” preserva a rapidez e a agressividade de modo idiomático, sem especificar uma manobra militar.
- source_word: כְגִבּוֹר
  choice: como um guerreiro
  rationale: גִּבּוֹר pode designar um homem forte, valente ou guerreiro. “Guerreiro” combina com a imagem de um ataque impetuoso e é claro para leitores atuais.
