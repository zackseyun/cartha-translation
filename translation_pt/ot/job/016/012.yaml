base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: pt
  text: Eu estava tranquilo, mas ele me despedaçou[a]; agarrou-me pela nuca e fez-me em pedaços; colocou-me como seu alvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por “despedaçou” é raro e também pode ser entendido como “sacudiu violentamente” ou “dilacerou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: tranquilo
  rationale: O adjetivo indica uma condição de tranquilidade, segurança ou ausência de perturbação. “Vivia tranquilo” soa natural em português e estabelece o contraste com a violência repentina.
- source_word: וַיְפַרְפְּרֵנִי
  choice: ele me despedaçou
  rationale: O verbo raro descreve uma ruptura violenta da tranquilidade de Jó. “Despedaçou” preserva a força da imagem, enquanto a incerteza lexical é registrada em nota.
- source_word: וְאָחַז
  choice: agarrou-me
  rationale: O verbo significa agarrar ou apoderar-se de alguém; “agarrou-me” comunica com clareza a força hostil da ação.
- source_word: בְּעָרְפִּי
  choice: pela nuca
  rationale: עֹרֶף designa a nuca ou a parte posterior do pescoço. “Pela nuca” preserva a precisão concreta da imagem e é corrente em português.
- source_word: וַיְפַצְפְּצֵנִי
  choice: me esmagou
  rationale: O verbo intensivo e raro exprime quebra ou destruição violenta. “Me esmagou” evita repetição excessiva com “despedaçou” e mantém a contundência, embora a expressão também possa sugerir fazer em pedaços.
- source_word: וַיְקִימֵנִי
  choice: colocou-me
  rationale: A forma causativa de קום indica fazer ficar de pé ou posicionar. Diante da metáfora do alvo, “colocou-me” é natural e semanticamente adequado.
- source_word: לוֹ
  choice: diante de si
  rationale: No contexto do alvo, a expressão apresenta Jó posicionado perante o agressor. “Diante de si” preserva a relação reflexiva sem acrescentar uma finalidade além do texto.
- source_word: לְמַטָּרָה
  choice: como alvo
  rationale: O substantivo designa um alvo ou ponto visado. “Como alvo” preserva de modo claro e conciso a metáfora de ataque.
theological_decisions:
- issue: Referente do sujeito masculino singular ao longo do versículo
  choice: Mantido apenas como “ele”, sem nomear o referente.
  alternative: Explicitar “Deus” ou entender um adversário não identificado.
  rationale: No discurso de Jó, Deus é o referente implícito mais provável, mas este versículo emprega somente formas verbais e pronominais de terceira pessoa. A tradução preserva essa formulação e a tensão retórica sem explicitação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência curta de ações mantém a violência e o ritmo cumulativo do hebraico; “nuca” preserva a imagem anatômica específica.
