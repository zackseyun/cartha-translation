    text: A imagem evoca o sangue que clama da terra por justiça; compare Gênesis 4:10.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: Ó terra
  rationale: O verbo na segunda pessoa feminina singular mostra que a terra é interpelada diretamente. “Terra” preserva melhor que “país” ou “região” o alcance amplo e poético do apelo; “Ó” marca o vocativo de modo digno e natural.
- source_word: אַל תְּכַסִּי
  choice: não cubra
  rationale: אַל com a forma verbal de valor volitivo expressa proibição ou desejo negativo urgente. “Não cubra” conserva a imagem concreta de impedir que o sangue fique oculto e sem reivindicar justiça.
- source_word: דָמִי
  choice: o meu sangue
  rationale: A expressão significa literalmente “meu sangue”. Embora o contexto permita entender sangue injustamente derramado, a formulação concreta preserva a ambiguidade poética e a alusão forense sem explicá-las no corpo do versículo.
- source_word: וְאַל יְהִי
  choice: e não haja
  rationale: A construção liga um segundo desejo negativo ao primeiro. “E não haja” reproduz naturalmente em português o sentido existencial e volitivo.
- source_word: מָקוֹם
  choice: lugar de repouso
  rationale: מָקוֹם significa basicamente “lugar”; no contexto, a expressão sugere um lugar onde o clamor pudesse repousar, cessar ou ser silenciado. “Lugar de repouso” torna essa imagem contextual perceptível sem declarar explicitamente uma interpretação judicial.
- source_word: לְזַעֲקָתִי
  choice: para o meu clamor
  rationale: זְעָקָה designa um grito de aflição que pode também funcionar como apelo por socorro ou justiça. “Clamor” é corrente no registro bíblico português e mantém as duas dimensões.
theological_decisions:
- issue: Alusão ao sangue inocente que clama por justiça
  choice: Manter as imagens concretas “meu sangue” e “meu clamor”, sem explicitar a alusão no texto principal.
  alternative: Traduzir “meu sangue derramado” e/ou “meu apelo por justiça”, tornando explícito o sentido forense.
  rationale: O versículo provavelmente evoca o motivo bíblico do sangue que clama da terra, mas o hebraico mantém tensão poética entre sangue, clamor de aflição e reivindicação de justiça. A tradução conserva essa abertura e registra a alusão em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O vocativo “Ó terra” preserva a força poética; “não haja” mantém um tom digno sem soar arcaico. As notas são ligadas aos termos pertinentes no texto principal.
