translation:
  language: pt
  text: Ó terra, não cubra o meu sangue[a][c], e não haja lugar para o meu clamor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu sangue derramado”. O hebraico diz literalmente “o meu sangue”, mas, neste contexto, pode referir-se ao sangue derramado injustamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o meu grito de socorro”. O termo pode indicar um grito de aflição que também funciona como apelo por justiça.'
    reason: lexical_alternative
