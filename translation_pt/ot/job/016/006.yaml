  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: pt
  text: Se eu falar, minha dor não diminui; e, se eu me calar, o que se afastará de mim?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que partirá de mim?” O hebraico é conciso e pode sugerir que algo da dor de Jó se vai.'
