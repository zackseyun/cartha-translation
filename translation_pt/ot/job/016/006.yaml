lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Se eu falar
  rationale: Expressa naturalmente em português a condição introduzida por אִם e a forma verbal de primeira pessoa, sem acrescentar uma nuance modal desnecessária.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: minha dor não diminui
  rationale: Embora o nifal de חשׂך tenha a imagem de ser contido ou refreado, com 'minha dor' o sentido contextual é que ela não é aliviada nem reduzida; 'não diminui' é claro e natural.
- source_word: וְאַחְדְּלָה
  choice: e, se eu me calar
  rationale: חדל significa cessar ou desistir; no paralelismo com 'falar', calar-se explicita de modo natural a ação elíptica.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: o que se afastará de mim?
  rationale: Preserva a formulação breve e elíptica do hebraico, sem inserir no texto principal que o referente implícito provavelmente é a dor.
