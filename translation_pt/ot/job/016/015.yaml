  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: pt
  text: Costurei pano de saco sobre a minha pele e lancei ao pó[a] o meu chifre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «rebaixei / profanei no pó o meu chifre». O verbo hebraico é difícil, e sua nuance exata é incerta.'
    reason: lexical_alternative
  - marker: b
    text: «Chifre» é uma metáfora hebraica de força, honra ou posição elevada.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: pano de saco
  rationale: Designa o tecido áspero usado em contexto de luto. «Pano de saco» é claro e tradicional em português, sem sugerir apenas um recipiente.
- source_word: תָּפַרְתִּי
  choice: Costurei
  rationale: O qal perfeito na primeira pessoa do singular significa «costurei». O pretérito perfeito preserva a ação concluída e soa natural no lamento.
- source_word: עֲלֵי גִלְדִּי
  choice: sobre a minha pele
  rationale: Mantém tanto a preposição de colocação sobre algo quanto o sentido concreto de גֶּלֶד, «pele».
- source_word: וְעֹלַלְתִּי
  choice: e enterrei
  rationale: O verbo é raro e difícil neste contexto. «Enterrei» comunica uma ação concreta de baixar ou meter no pó, sem adotar no texto principal a interpretação mais abstrata «profanei».
- source_word: בֶעָפָר
  choice: no pó
  rationale: Reproduz naturalmente o beth hebraico e se combina com «enterrei», preservando a imagem de humilhação.
- source_word: קַרְנִי
  choice: o meu chifre
  rationale: Preserva a metáfora hebraica concreta, em vez de substituí-la por uma interpretação como «força» ou «dignidade».
theological_decisions:
- issue: Metáfora do chifre
  choice: Manter «o meu chifre» no texto principal
  alternative: minha força; minha dignidade
  rationale: O chifre representa força, honra ou posição elevada, mas a tradução mantém a imagem poética e explica seu alcance em nota.
- issue: Sentido incerto de וְעֹלַלְתִּי
  choice: 'Traduzir por uma ação concreta: «enterrei»'
  alternative: rebaixei; lancei por terra; profanei
  rationale: A forma verbal e sua nuance são discutidas. «Enterrei no pó» se ajusta à imagem do luto e da humilhação, enquanto a nota conserva alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «enterrei no pó o meu chifre» conserva a ênfase poética no pó sem soar excessivamente arcaica. Todos os marcadores de nota aparecem no texto principal.
