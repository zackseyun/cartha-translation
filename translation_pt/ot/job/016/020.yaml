  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: pt
  text: Meus amigos são os que zombam de mim[a]; para Deus, meu olho derrama lágrimas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meus amigos são meus intercessores”. O termo hebraico מְלִיצַי também é entendido em sentido positivo como “intercessores”, “mediadores” ou “intérpretes”; neste contexto, porém, o sentido “os que zombam de mim” combina melhor com a queixa de Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: zombam de mim
  rationale: O termo pode designar pessoas que zombam ou escarnecem. No contexto da queixa de Jó contra seus amigos, a formulação verbal é natural em português e comunica o sentido adversarial sem perder a alternativa lexical, registrada em nota.
- source_word: רֵעָי
  choice: meus amigos
  rationale: רֵעַ significa normalmente amigo ou companheiro. “Meus amigos” é claro e preserva a ironia de que aqueles que deveriam apoiá-lo zombam dele.
- source_word: אֶל אֱלוֹהַ
  choice: diante de Deus
  rationale: A preposição אֶל indica direção para Deus. No contexto de lágrimas e apelo, “diante de Deus” é português natural e mantém a orientação do lamento para Deus.
- source_word: דָּלְפָה
  choice: derramam lágrimas
  rationale: O verbo descreve gotejar ou escorrer. Em português, “derramam lágrimas” expressa de modo idiomático o choro contínuo associado ao olho.
- source_word: עֵינִי
  choice: meus olhos
  rationale: Embora o hebraico use o singular coletivo “meu olho”, o plural é a forma corrente em português para falar do choro e evita uma construção pouco natural.
