  text: יַסְגִּירֵ֣/נִי אֵ֭ל אֶ֣ל עֲוִ֑יל וְ/עַל יְדֵ֖י רְשָׁעִ֣ים יִרְטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: pt
  text: Deus me entrega ao perverso[a] e me lança nas mãos dos ímpios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao irreligioso”.'
    reason: lexical_alternative
  - marker: b
    text: O sentido do verbo hebraico é incerto; provavelmente significa “me lança” ou “me arremessa” para o poder dos ímpios.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: me entrega
  rationale: O hifil de סגר expressa entregar alguém ao poder de outro. “Me entrega” é natural em português e preserva o caráter hostil da ação.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל designa Deus, sujeito da queixa de Jó, e não apenas um “poderoso” genérico.
- source_word: אֶל
  choice: ao
  rationale: A preposição indica transferência para o domínio de outra pessoa e integra naturalmente a construção portuguesa “entregar alguém a”.
- source_word: עֲוִיל
  choice: o perverso
  rationale: O substantivo singular caracteriza uma pessoa moralmente perversa ou irreligiosa. “O perverso” conserva o sentido ético sem reduzi-lo a falta de inteligência.
- source_word: וְעַל יְדֵי
  choice: e ... nas mãos dos
  rationale: A expressão com “mãos” representa poder ou domínio. “Nas mãos dos” mantém a imagem hebraica e soa idiomático em português.
- source_word: רְשָׁעִים
  choice: ímpios
  rationale: O plural designa pessoas caracterizadas pela maldade ou culpa moral. “Ímpios” mantém tanto o peso moral quanto o registro poético do contexto.
- source_word: יִרְטֵנִי
  choice: me lança
  rationale: O verbo é raro e de sentido difícil, mas provavelmente descreve um ato de lançar ou arremessar. “Me lança” preserva a força da ação sem impor uma direção não expressa claramente.
theological_decisions:
- issue: Referência de אֵל
  choice: Deus é quem entrega Jó ao perverso.
  alternative: Um “poderoso” genérico entrega Jó.
  rationale: No contexto de Jó, אֵל refere-se normalmente a Deus. A tradução preserva a tensão da acusação de Jó, sem atenuá-la nem explicá-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo e a imagem das “mãos” como domínio, além de sinalizar em nota a dificuldade do verbo final.
