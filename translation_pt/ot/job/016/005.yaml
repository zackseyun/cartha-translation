  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: pt
  text: Eu poderia fortalecê-los com a minha boca, e o movimento dos meus lábios poderia aliviar a dor de vocês.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o consolo dos meus lábios poderia aliviar a dor de vocês”. O termo hebraico traduzido como “movimento” também pode indicar um gesto ou uma expressão de solidariedade e consolo.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e o movimento dos meus lábios poderia conter”. O hebraico não declara o que seria contido; “a dor de vocês” é suprido com base no contexto.'
    reason: implicit_object
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: Eu poderia fortalecê-los
  rationale: O piel de אמץ com objeto na segunda pessoa do plural significa “fortalecer”. “Poderia” expressa naturalmente a situação hipotética iniciada no versículo anterior.
- source_word: בְּמוֹ פִי
  choice: com a minha boca
  rationale: Mantém a imagem concreta do hebraico, no qual a boca funciona como instrumento da fala.
- source_word: נִיד
  choice: o movimento
  rationale: Preserva a imagem possivelmente concreta de um movimento ou gesto dos lábios, sem ocultar que o substantivo também pode indicar uma expressão de solidariedade ou consolo.
- source_word: שְׂפָתַי
  choice: dos meus lábios
  rationale: Tradução direta que conserva o paralelismo entre “boca” e “lábios”.
- source_word: יַחְשֹׂךְ
  choice: poderia aliviar
  rationale: חשׂך significa reter, impedir ou poupar. No contexto de consolar quem sofre, “aliviar” comunica de modo natural o efeito pretendido, enquanto a nota registra a formulação mais literal.
