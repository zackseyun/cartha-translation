  text: שָׁמַ֣עְתִּי כְ/אֵ֣לֶּה רַבּ֑וֹת מְנַחֲמֵ֖י עָמָ֣ל כֻּלְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: pt
  text: Já ouvi muitas coisas como essas; todos vocês são consoladores que trazem sofrimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, «consoladores de sofrimento»; também pode significar «consoladores que causam transtorno».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Já ouvi
  rationale: O perfeito qal na primeira pessoa do singular expressa o que Jó ouviu anteriormente e que continua relevante; o pretérito perfeito composto não é natural aqui em português, e «já ouvi» comunica bem a experiência acumulada.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: muitas coisas como essas
  rationale: A combinação da preposição comparativa com o demonstrativo, seguida de רַבּוֹת, significa literalmente muitas coisas semelhantes a estas. A formulação é natural e mantém o tom desdenhoso de Jó.
- source_word: מְנַחֲמֵי
  choice: consoladores
  rationale: 'O particípio de נחם é empregado como substantivo. «Consoladores» preserva a ironia: os amigos vieram consolá-lo, mas suas palavras produzem o contrário.'
- source_word: עָמָל
  choice: que só trazem sofrimento
  rationale: עמל pode indicar sofrimento, aflição, fadiga ou transtorno. A oração relativa explicita de modo natural em português que esses consoladores causam sofrimento, sem eliminar as alternativas possíveis da construção hebraica.
- source_word: כֻּלְּכֶם
  choice: todos vocês
  rationale: Mantém tanto o plural explícito quanto a abrangência coletiva da censura dirigida a todos os amigos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das duas orações acompanha o hebraico; «só» reforça a ironia e o resultado negativo da suposta consolação.
