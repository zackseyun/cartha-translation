  source_fidelity: A tradução preserva adequadamente אַךְ עַתָּה como uma transição enfática e temporal (“Mas agora”), mantém o sujeito implícito de terceira pessoa em הֶלְאָנִי (“ele me deixou exausto”) e, sobretudo, conserva a mudança textual para a segunda pessoa em הֲשִׁמּוֹתָ (“tu devastaste”). “Toda a minha companhia” representa de modo plausível o coletivo עֲדָתִי sem restringi-lo a uma congregação religiosa formal.
  naturalness: O português é moderno, claro e digno. “Mas agora ele me deixou exausto; tu devastaste...” soa natural em registro poético e torna perceptível a mudança retórica de pessoa. O uso de “tu” é justificável aqui, pois explicita uma distinção gramatical relevante do hebraico.
