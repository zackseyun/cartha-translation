source:
  edition: WLC
  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: pt
  text: Mas agora ele me deixou exausto[a]; tu devastaste toda a minha companhia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele me esgotou” ou “ele me deixou cansado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “toda a minha assembleia” ou “toda a minha congregação”. O hebraico pode referir-se ao círculo reunido de Jó ou ao grupo de pessoas de sua casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Aqui a partícula marca uma virada enfática para a aflição presente de Jó. “Mas” é natural em português e conserva o contraste discursivo, sem lhe impor um sentido exclusivamente restritivo.
- source_word: עַתָּה
  choice: agora
  rationale: Mantém de modo direto e natural a referência temporal à condição presente de Jó.
- source_word: הֶלְאָנִי
  choice: ele me deixou exausto
  rationale: O verbo לאה expressa cansaço ou esgotamento. A forma traz sujeito masculino singular implícito e objeto na primeira pessoa; “ele” preserva essa forma sem identificar explicitamente o sujeito como Deus.
- source_word: הֲשִׁמּוֹתָ
  choice: tu devastaste
  rationale: A forma causativa de שמם comunica tornar desolado ou devastar. “Devastaste” preserva a força da expressão e a segunda pessoa do singular, inclusive a mudança de pessoa verbal no hebraico.
- source_word: כָּל
  choice: toda
  rationale: Expressa a totalidade e concorda naturalmente em português com “companhia”.
- source_word: עֲדָתִי
  choice: minha companhia
  rationale: עֵדָה pode significar assembleia ou congregação, mas, no contexto do lamento de Jó, pode designar seu círculo reunido ou grupo próximo. “Companhia” comunica esse sentido social sem sugerir necessariamente uma reunião religiosa formal.
theological_decisions:
- issue: Mudança de pessoa gramatical entre os dois verbos
  choice: 'Preservar a mudança: “ele me deixou exausto; tu devastaste...”'
  alternative: Harmonizar os dois verbos na segunda pessoa (“tu me deixaste exausto; tu devastaste...”) ou na terceira pessoa.
  rationale: O texto massorético passa da terceira pessoa masculina singular para a segunda pessoa masculina singular. A tradução conserva essa tensão e deixa aberta a possibilidade de Jó passar retoricamente de falar sobre Deus a dirigir-se a ele.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O pronome “tu” foi mantido para representar claramente a segunda pessoa singular e tornar perceptível a mudança em relação a “ele”. Os marcadores seguem imediatamente os termos a que se referem.
