base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: pt
  text: Seus arqueiros me cercam[a]; ele fende meus rins[b] e não poupa; derrama minha bile[c] no chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus poderosos” ou “seus chefes”. A forma hebraica é difícil; “seus arqueiros” combina com as imagens de ataque neste verso e no contexto mais amplo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “meus rins”, expressão literal para órgãos internos e, por extensão no idioma hebraico, para o íntimo da pessoa.'
    reason: cultural_note
  - marker: c
    text: Ou “meu fel”; alguns entendem o termo figuradamente como “minha amargura”, mas o sentido corporal combina com as imagens violentas do verso.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: me cercam
  rationale: O qal imperfeito plural de סבב descreve forças hostis rodeando Jó; “cercam” é natural e preserva a imagem de ataque.
- source_word: רַבָּיו
  choice: seus arqueiros
  rationale: A forma hebraica é difícil e também pode ser entendida como “seus grandes” ou “seus chefes”; no contexto, “arqueiros” se ajusta à sequência de imagens de ataque e ferimento.
- source_word: יְפַלַּח
  choice: me rasga
  rationale: O piel de פלח expressa uma ação violenta de fender ou abrir. “Rasga” transmite com clareza a brutalidade da imagem e se combina naturalmente com o objeto anatômico.
- source_word: כִּלְיוֹתַי
  choice: os rins
  rationale: O termo designa literalmente os rins. A tradução mantém a parte concreta do corpo, sem substituí-la por uma abstração interpretativa.
- source_word: לֹא יַחְמוֹל
  choice: não poupa
  rationale: Tradução concisa e idiomática de חמל em um contexto de violência, preservando a ideia de não mostrar clemência.
- source_word: יִשְׁפֹּךְ
  choice: derrama
  rationale: שפך significa normalmente “derramar”; a escolha conserva a imagem física vívida.
- source_word: מְרֵרָתִי
  choice: minha bile
  rationale: O substantivo pode indicar bile ou fel e se relaciona semanticamente à amargura. “Bile” é corporalmente claro e se ajusta à violência anatômica do verso.
theological_decisions:
- issue: Imagens antropológicas na linguagem poética do sofrimento
  choice: Manter no texto principal os termos corporais concretos “rins” e “bile”.
  alternative: Empregar abstrações interpretativas como “entranhas” e “amargura”.
  rationale: O verso representa o sofrimento de Jó por meio de imagens anatômicas viscerais. Preservá-las mantém a força da poesia hebraica e evita suavizar ou resolver interpretativamente a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe breve preserva o ritmo incisivo da poesia. Os pronomes e verbos mantêm a alternância do plural coletivo (“arqueiros... cercam”) para o agente singular (“ele... rasga... derrama”) presente no hebraico.
