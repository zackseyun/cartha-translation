base_translation:
  language: en
  yaml_path: translation/ot/job/016/010.yaml
  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: pt
  text: Escancararam a boca contra mim; com desprezo, bateram-me na face; juntos, se reúnem contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «juntos se enchem contra mim». O verbo hebraico final é incomum e difícil; no contexto, pode referir-se a adversários que se reúnem em força contra Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ עָלַי בְּפִיהֶם
  choice: Escancararam contra mim a boca
  rationale: Preserva a imagem hebraica de abrir muito a boca em atitude hostil ou zombeteira. O singular coletivo «a boca» acompanha de perto o hebraico e é natural em português.
- source_word: בְּחֶרְפָּה
  choice: com desprezo
  rationale: חֶרְפָּה abrange afronta, insulto e desonra; neste contexto, «com desprezo» comunica de modo claro a atitude humilhante associada ao golpe.
- source_word: הִכּוּ לְחָיָי
  choice: bateram no meu rosto
  rationale: לְחִי pode designar a face lateral, a bochecha ou a mandíbula. «Rosto» mantém a cena de agressão humilhante em português corrente, sem sugerir precisão anatômica excessiva.
- source_word: יַחַד
  choice: todos juntos
  rationale: Expressa com clareza a ação coletiva e concertada indicada pelo advérbio hebraico.
- source_word: עָלַי יִתְמַלָּאוּן
  choice: se ajuntam contra mim
  rationale: O hitpael de מלא é incomum e difícil aqui. No contexto, parece retratar adversários reunindo-se em força contra Jó; «se ajuntam» preserva esse sentido sem ocultar a incerteza, registrada em nota.
theological_decisions:
- issue: Identidade dos agressores
  choice: Manter o sujeito plural indefinido
  alternative: Identificá-los como amigos, inimigos ou forças espirituais
  rationale: O versículo não identifica explicitamente os agentes; nomeá-los resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. «Escancararam» conserva a força visual do original; «se ajuntam» é amplamente compreensível em português, inclusive no Brasil. A nota explicita a dificuldade do verbo final sem impor uma interpretação única.
