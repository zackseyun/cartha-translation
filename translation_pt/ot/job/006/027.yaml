  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: pt
  text: Vocês até lançariam sortes sobre o órfão[a] e negociariam a respeito do próprio amigo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançariam a sorte pelo órfão”. A expressão hebraica diz literalmente: “fariam cair sobre o órfão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cavariam uma cova para o próprio amigo”. O verbo hebraico é difícil aqui; muitos o entendem como negociar a respeito de um amigo ou explorá-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: até
  rationale: Intensifica a acusação e comunica a escalada chocante da conduta atribuída aos amigos de Jó.
- source_word: יָתוֹם
  choice: o órfão
  rationale: Designa uma pessoa privada do pai e socialmente vulnerável; “órfão” é natural e amplamente compreensível em português.
- source_word: תַּפִּילוּ
  choice: lançariam sortes sobre
  rationale: O hifil de נפל com עַל é provavelmente uma expressão ligada a fazer cair a sorte sobre alguém. A formulação conserva a imagem sem ocultar a dificuldade do hebraico.
- source_word: תִכְרוּ
  choice: negociariam às custas de
  rationale: O verbo é difícil neste contexto. A tradução expressa a provável ideia de negociar, regatear ou explorar alguém, mantendo em nota a alternativa concreta de cavar uma cova.
- source_word: רֵיעֲכֶם
  choice: o próprio amigo
  rationale: רֵעַ pode significar amigo, companheiro ou próximo. “O próprio amigo” se ajusta à repreensão dirigida por Jó aos seus companheiros e ressalta a traição.
- source_word: עַל ... עַל
  choice: sobre ... às custas de
  rationale: A primeira ocorrência preserva a imagem do lançamento de sortes. Na segunda, uma tradução estritamente uniforme seria pouco natural; “às custas de” comunica a exploração implícita na leitura contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com leitura natural no Brasil e compreensão internacional. O plural “vocês” representa a acusação dirigida aos companheiros de Jó. As duas incertezas lexicais reais são preservadas em notas, sem resolver indevidamente a ambiguidade do hebraico.
