  language: pt
  text: que ficam escuros por causa do gelo[a], e sobre eles a neve se esconde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ficam turvos por causa do gelo”. O particípio hebraico significa basicamente “escuros” ou “escurecidos”, mas, neste contexto, pode sugerir águas tornadas turvas pelas condições do inverno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: que ficam escuros
  rationale: O particípio de קדר expressa escurecer ou estar escuro. A formulação preserva o sentido visual básico sem impor a interpretação mais específica de águas turvas.
- source_word: מִנִּי
  choice: por causa de
  rationale: A preposição pode indicar origem ou causa; neste contexto, apresenta o gelo como causa do escurecimento.
- source_word: קָרַח
  choice: gelo
  rationale: קָרַח designa gelo ou geada; “gelo” combina naturalmente com a imagem invernal e com a neve no segundo membro.
- source_word: עָלֵימוֹ
  choice: sobre eles
  rationale: A preposição com sufixo masculino plural tem sentido espacial e retoma os cursos de água mencionados no contexto.
- source_word: יִתְעַלֶּם
  choice: se esconde
  rationale: A forma hitpael de עלם possui valor reflexivo; “se esconde” o preserva em português natural.
- source_word: שָׁלֶג
  choice: a neve
  rationale: O artigo é natural em português para a neve descrita genericamente nesta cena poética.
