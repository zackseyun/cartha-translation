base_translation:
  language: en
  yaml_path: translation/ot/job/006/002.yaml
  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: pt
  text: Ah, se a minha angústia[a] fosse devidamente pesada, e a minha calamidade fosse colocada junto com ela nas balanças[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu desgosto” ou “a minha irritação”. O termo hebraico pode indicar angústia interior, desgosto, irritação ou ira.
    reason: lexical_alternative
  - marker: b
    text: Ou “na balança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Ah, se
  rationale: Introduz um desejo irreal ou lamento enfático; a formulação é natural em português e conserva a carga emocional.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: fosse devidamente pesada
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação de pesar. “Devidamente” comunica a ênfase sem produzir uma repetição artificial em português.
- source_word: כַּעְשִׂי
  choice: a minha angústia
  rationale: O substantivo pode expressar aflição interior, desgosto, irritação ou ira. “Angústia” se ajusta ao lamento de Jó sem reduzir o termo apenas à tristeza nem defini-lo simplesmente como ira.
- source_word: וְהַוָּתִי
  choice: a minha calamidade
  rationale: O termo designa desastre, ruína ou calamidade e aponta para a dimensão objetiva do sofrimento de Jó.
- source_word: בְּמֹאזְנַיִם
  choice: na balança
  rationale: O dual hebraico se refere ao instrumento de pesagem. “Na balança” é a expressão corrente e digna em português.
- source_word: יִשְׂאוּ
  choice: fosse posta
  rationale: Literalmente, o verbo significa “levantar” ou “carregar”. No contexto da pesagem, a forma passiva idiomática comunica que a calamidade é colocada na balança, sem introduzir um agente ausente do hebraico.
- source_word: יָחַד
  choice: junto com
  rationale: Indica que a angústia e a calamidade devem ser consideradas e pesadas em conjunto.
