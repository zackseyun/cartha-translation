  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: pt
  text: 'Será que alguma vez eu disse: “Deem-me alguma coisa” ou: “Usem os seus recursos para subornar alguém em meu favor”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Será que alguma vez eu disse
  rationale: Expressa naturalmente em português a pergunta retórica enfática pela qual Jó nega ter feito tal pedido, sem transformar אָמַרְתִּי (“disse”) em “pedi”.
- source_word: הָבוּ לִי
  choice: Deem-me alguma coisa
  rationale: O imperativo plural é preservado. O complemento “alguma coisa” explicita de modo natural o objeto elíptico do verbo dar em português.
- source_word: וּמִכֹּחֲכֶם
  choice: Usem os seus recursos
  rationale: כֹּחַ significa literalmente “força” ou “poder”, mas neste contexto de desembolso indica provavelmente os meios ou recursos de que os amigos dispunham. A formulação portuguesa comunica esse sentido econômico sem recorrer ao pouco natural “da sua força”.
- source_word: שִׁחֲדוּ
  choice: subornar alguém
  rationale: O verbo está ligado ao substantivo que designa suborno ou presente usado como incentivo. “Subornar alguém” conserva sua força transacional e fornece o complemento normalmente exigido pelo verbo em português; a pessoa subornada permanece, como no hebraico, não identificada.
- source_word: בַעֲדִי
  choice: em meu favor
  rationale: Reproduz o sentido de agir ou pagar em benefício de Jó e soa natural no português contemporâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pergunta retórica natural. A segunda pessoa do plural foi vertida por “vocês” implícito nas formas e pelo possessivo “seus”, de ampla legibilidade brasileira. As duas alternativas introduzidas por “ou” permanecem como falas citadas de Jó.
