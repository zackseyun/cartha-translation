  text: כִּֽי עַ֭תָּה הֱיִ֣יתֶם לא תִּֽרְא֥וּ חֲ֝תַ֗ת וַ/תִּירָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: pt
  text: Pois agora vocês se tornaram nada[a]; veem o terror[b] e ficam com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “vocês se tornaram não”. Muitos entendem o sentido como “vocês se tornaram nada” ou “vocês se tornaram como isso”, isto é, como os cursos d’água inconfiáveis dos versículos anteriores.
    reason: textual_variant
  - marker: b
    text: 'Ou: “veem a calamidade e ficam com medo”. O substantivo pode indicar terror, consternação ou uma calamidade devastadora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou conclusão de Jó a partir da comparação anterior com os cursos d’água sazonais, sem tornar a relação excessivamente causal.
- source_word: עַתָּה
  choice: agora
  rationale: Marca a situação presente, em contraste com a expectativa anterior de Jó.
- source_word: הֱיִיתֶם
  choice: vocês se tornaram
  rationale: 'Expressa mudança de estado: os amigos mostraram ser tão inúteis ou inconfiáveis quanto os cursos d’água mencionados antes.'
- source_word: לא
  choice: nada
  rationale: O texto consonantal traz literalmente “não”, numa construção difícil. “Tornaram-se nada” comunica em português a leitura contextual de que os amigos se revelaram sem ajuda, preservando a dificuldade em nota.
- source_word: תִּרְאוּ
  choice: veem
  rationale: Mantém o sentido básico de ראה e apresenta a percepção da condição terrível de Jó como imediata.
- source_word: חֲתַת
  choice: terror
  rationale: O substantivo pode indicar terror, consternação ou uma calamidade devastadora. “Terror” preserva a força emocional e a ligação com o medo na oração seguinte.
- source_word: וַתִּירָאוּ
  choice: e ficam com medo
  rationale: Expressa em português natural a reação dos amigos diante do que veem, sem sugerir necessariamente um estado permanente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais naturais no presente. O pronome “vocês” torna explícito o plural hebraico e mantém boa legibilidade brasileira. A tradução conserva a aspereza semântica da primeira oração por meio de uma nota.
