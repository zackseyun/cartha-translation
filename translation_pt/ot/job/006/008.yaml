  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: pt
  text: Quem dera[a] o meu pedido se realizasse, e Deus me concedesse o que espero!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ao menos o meu pedido se realizasse, e Deus me concedesse o que espero!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática introduz um desejo intenso, não uma pergunta literal. “Quem dera” é natural em português e preserva o tom de lamento.
- source_word: תָּבוֹא
  choice: se realizasse
  rationale: Embora o verbo signifique literalmente “vir”, neste contexto o pedido “vir” significa concretizar-se ou ser atendido. O subjuntivo acompanha naturalmente a construção optativa “Quem dera”.
- source_word: שֶׁאֱלָתִי
  choice: o meu pedido
  rationale: O substantivo designa um pedido ou súplica. “Pedido” é claro, direto e adequado ao registro.
- source_word: וְתִקְוָתִי
  choice: o que espero
  rationale: תִּקְוָה pode significar “esperança”, “expectativa” ou aquilo que se espera. A formulação verbal é mais natural com “concedesse” e mantém o sentido concreto do desejo de Jó.
- source_word: יִתֵּן
  choice: me concedesse
  rationale: O verbo significa literalmente “dar”, mas “conceder” expressa de modo idiomático Deus tornar realidade aquilo que Jó espera. O pronome “me” explicita em português o beneficiário já indicado pelo contexto.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É o termo singular para “Deus”, frequente em Jó; o vocábulo por si só não significa “Todo-poderoso”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Quem dera” conserva a força optativa do hebraico; “o que espero” evita a expressão pouco natural “conceder minha esperança” sem eliminar a alternativa literal, registrada em nota.
