lexical_decisions:
- source_word: וְיֹאֵל
  choice: se dispusesse
  rationale: O hifil de יאל expressa disposição, consentimento ou vontade. “Se dispusesse” preserva essa nuance volitiva e soa natural no contexto do desejo formulado por Jó.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: אֱלוֹהַּ é uma designação singular comum de Deus no livro de Jó; a tradução direta dispensa transliteração.
- source_word: וִידַכְּאֵנִי
  choice: a me esmagar
  rationale: No piel, דכא comunica esmagar ou quebrantar violentamente. “Esmagar” conserva a intensidade destrutiva do lamento.
- source_word: יַתֵּר יָדוֹ
  choice: soltasse a mão
  rationale: A expressão concreta retrata Deus deixando de conter a mão para agir. A tradução mantém tanto a imagem hebraica quanto sua força idiomática.
- source_word: וִיבַצְּעֵנִי
  choice: acabasse comigo
  rationale: בצע pode indicar cortar, separar ou levar algo a um fim. Neste pedido de morte, “acabasse comigo” exprime destruição decisiva e final sem especificar indevidamente o modo.
theological_decisions:
- issue: Linguagem antropomórfica sobre a ação de Deus
  choice: Manter a expressão concreta “a mão”.
  alternative: Substituí-la por “seu poder” ou “seu juízo”.
  rationale: O hebraico emprega a imagem corporal para representar a ação divina. Preservá-la mantém a força emocional do pedido de Jó sem exigir que seja entendida como descrição física de Deus.
- issue: Desejo de Jó pela própria morte
  choice: Traduzir diretamente a súplica extrema, sem atenuá-la nem apresentá-la como aprovação divina.
  alternative: Suavizar a fala como mero pedido de alívio.
  rationale: O versículo registra a voz angustiada de Jó. A tradução deve preservar a tensão do lamento sem acrescentar uma avaliação doutrinária que o texto não explicita.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A construção no subjuntivo preserva o caráter de desejo ou súplica; “acabasse comigo” é idiomático sem ser coloquial demais. Os marcadores foram colocados junto às expressões hebraicas que explicam.
