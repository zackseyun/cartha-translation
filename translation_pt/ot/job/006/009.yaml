  text: que Deus se dispusesse a me esmagar[a], soltasse a sua mão[b] e acabasse comigo[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que Deus quisesse me esmagar”. O verbo hebraico expressa disposição ou consentimento.'
