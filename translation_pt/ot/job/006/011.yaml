  text: מַה כֹּחִ֥/י כִֽי אֲיַחֵ֑ל וּ/מַה קִּ֝צִּ֗/י כִּֽי אַאֲרִ֥יךְ נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: pt
  text: Que força tenho para continuar esperando? E qual é o meu fim, para que eu prolongue a minha vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que eu continue resistindo?” O hebraico diz literalmente “prolongue a minha alma”, expressão que pode se referir a prolongar a vida ou a continuar suportando a situação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Que força tenho
  rationale: A pergunta retórica expressa a falta de capacidade de Jó para continuar suportando sua situação. “Força” traduz naturalmente כֹּחַ e preserva o paralelismo conciso do hebraico.
- source_word: כִּי אֲיַחֵל
  choice: para continuar esperando
  rationale: O verbo יחל pode significar esperar ou ter esperança. “Continuar esperando” comunica o aspecto durativo sugerido pelo contexto sem decidir se Jó fala principalmente de expectativa ou esperança.
- source_word: וּמַה קִצִּי
  choice: E qual é o meu fim
  rationale: קֵץ designa fim ou limite. “Meu fim” mantém a formulação existencial e a ligação paralela com a primeira pergunta.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: para que eu prolongue a minha vida
  rationale: A expressão diz literalmente “prolongue a minha alma/vida”. Aqui נֶפֶשׁ representa a própria vida, e a tradução preserva a ideia de continuar vivendo, sem recorrer ao literalismo pouco natural “alongar minha alma”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com perguntas retóricas concisas. “Continuar esperando” preserva a amplitude entre espera e esperança; “prolongue a minha vida” transmite de modo natural o idioma hebraico, cuja imagem literal é registrada na nota.
