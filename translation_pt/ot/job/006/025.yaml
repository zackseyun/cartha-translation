  text: Como são vigorosas as palavras sinceras! Mas o que prova a repreensão que vem de vocês?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como são dolorosas as palavras francas! Mas o que demonstra a argumentação de vocês?” O hebraico permite nuances como “vigorosas”, “persuasivas” ou “dolorosas” na primeira frase, e “argumentação”, “censura” ou “repreensão” na segunda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: Como são vigorosas
  rationale: מַה introduz uma exclamação de grau, e o nifal de מרץ comunica força ou impacto. “Vigorosas” preserva essa ideia sem limitar o sentido a persuasão ou dor.
- source_word: אִמְרֵי יֹשֶׁר
  choice: as palavras sinceras
  rationale: A expressão designa palavras caracterizadas por retidão ou franqueza. “Sinceras” é natural em português e comunica a qualidade moral do discurso.
- source_word: וּמַה יּוֹכִיחַ
  choice: Mas o que prova
  rationale: A conjunção tem valor contrastivo no contexto. O hifil de יכח pode significar provar, demonstrar, argumentar ou repreender; “prova” mantém aberta a pergunta sobre o que a censura efetivamente demonstra.
- source_word: הוֹכֵחַ מִכֶּם
  choice: a repreensão que vem de vocês
  rationale: הוֹכֵחַ descreve o ato de repreender ou contestar, e מִכֶּם marca sua origem. A formulação traduz explicitamente a relação de procedência e soa natural em português.
