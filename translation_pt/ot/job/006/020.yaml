  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: pt
  text: Ficaram envergonhados porque confiaram; chegaram até ela[b] e ficaram decepcionados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram envergonhados ... ficaram confundidos”. O hebraico emprega dois verbos relacionados à vergonha e à desonra; o segundo também pode ser traduzido como “ficaram humilhados” ou “coraram de vergonha”.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, até a torrente sazonal mencionada no contexto anterior. Outra tradução possível: “chegaram lá”.'
    reason: cross_reference
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: ficam envergonhados
  rationale: O qal perfeito de בוש expressa vergonha ou o resultado de ver frustrada a expectativa. O presente narrativo/resultativo soa natural no contexto e preserva o campo semântico da vergonha.
- source_word: כִּי
  choice: porque
  rationale: 'Introduz naturalmente a causa da vergonha: eles haviam depositado confiança na torrente.'
- source_word: בָטָח
  choice: confiaram
  rationale: Embora a forma hebraica seja morfologicamente singular, o contexto traz verbos plurais e se refere coletivamente aos viajantes das caravanas; o plural mantém essa continuidade. 'Confiaram' representa diretamente בטח.
- source_word: בָּאוּ
  choice: chegam
  rationale: Tradução direta de בוא, apresentada no presente para acompanhar o caráter vívido e resultativo do verso.
- source_word: עָדֶיהָ
  choice: até ela
  rationale: Preserva o sufixo feminino, cujo referente contextual é a torrente sazonal mencionada antes, sem substituí-lo silenciosamente por um advérbio.
- source_word: וַיֶּחְפָּרוּ
  choice: ficam confundidos
  rationale: חפר aqui indica ficar consternado, envergonhado ou humilhado. 'Confundidos' conserva a proximidade com a linguagem de vergonha do primeiro verbo e também comunica a frustração ao chegar e não encontrar água.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a imagem concreta da torrente por meio de “até ela” e preserva a repetição semântica dos dois verbos hebraicos ligados à vergonha; as alternativas são registradas em nota.
