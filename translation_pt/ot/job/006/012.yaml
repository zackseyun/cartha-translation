  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: pt
  text: Será que a minha força é a força das pedras, ou a minha carne é de bronze?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu corpo é de bronze?”. O hebraico diz literalmente “minha carne”, ressaltando o contraste entre a fragilidade humana e a dureza do metal.'
