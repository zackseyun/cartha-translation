lexical_decisions:
- source_word: אִם
  choice: Será que... ou...
  rationale: Nos dois membros, אִם introduz uma pergunta retórica, não uma condição. “Será que... ou...” transmite essa força interrogativa de modo natural em português.
- source_word: כֹּחַ / כֹּחִי
  choice: força / minha força
  rationale: A repetição de “força” reproduz a repetição hebraica e mantém o paralelismo poético e corporal da queixa de Jó.
- source_word: אֲבָנִים
  choice: pedras
  rationale: É o sentido concreto do plural hebraico e preserva a imagem de resistência e dureza.
- source_word: בְּשָׂרִי
  choice: minha carne
  rationale: A tradução literal preserva o contraste vívido entre a fragilidade humana de Jó e a dureza do metal; “meu corpo” seria uma alternativa mais idiomática.
- source_word: נָחוּשׁ
  choice: bronze
  rationale: O termo pode designar bronze ou cobre; neste contexto, “bronze” comunica melhor a imagem tradicional de dureza e resistência.
