base_translation:
  language: en
  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: pt
  text: Minha alma se recusa a tocá-las[a]; elas são como a doença do meu alimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu apetite se recusa a tocá-las”. O hebraico néfesh pode significar “alma”, “pessoa” ou, em certos contextos, “apetite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “elas são para mim como alimento repugnante”, ou: “elas são como a enfermidade do meu pão/alimento”. A expressão hebraica é condensada e difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: se recusa
  rationale: O verbo מאן expressa recusa ou falta de disposição. O presente combina com o caráter imediato da queixa poética e preserva o sentido volitivo.
- source_word: לִנְגּוֹעַ
  choice: a tocar
  rationale: נגע significa normalmente “tocar” ou “entrar em contato”. A formulação direta conserva a imagem de aversão física.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נפש pode designar alma, vida, pessoa, garganta ou apetite. “Minha alma” preserva a amplitude antropológica e a intensidade pessoal do hebraico, sem restringir o sentido a “apetite”.
- source_word: הֵמָּה
  choice: elas
  rationale: O pronome retoma as coisas repulsivas mencionadas no contexto. Em português, “elas” mantém essa referência anafórica; o objeto de “tocar” é explicitado pelo pronome para dar fluidez à frase.
- source_word: כִּדְוֵי
  choice: como a doença de
  rationale: A forma deriva de דוה, ligada a doença ou enfermidade. A expressão em relação construta é compacta e difícil; a tradução mantém a metáfora sem decidir se o alimento é doentio, repulsivo ou causador de doença.
- source_word: לַחְמִי
  choice: meu alimento
  rationale: לחם significa literalmente “pão”, mas também pode indicar alimento em geral. “Meu alimento” comunica melhor o alcance provável neste contexto.
