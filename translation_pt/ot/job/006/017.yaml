  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/017.yaml
  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: pt
  text: Quando se aquecem, desaparecem[a]; com o calor[b], somem do seu lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se apagam”. Os dois verbos hebraicos podem evocar tanto o desaparecimento como o apagar-se.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “em seu calor”; também pode ser traduzido “no calor”.'
    reason: lexical_alternative
  - marker: c
    text: Neste contexto, “seu lugar” pode referir-se mais especificamente ao leito ou canal do curso de água.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: Quando
  rationale: Introduz naturalmente a oração temporal em português, sem a rigidez de “no tempo em que”.
- source_word: יְזֹרְבוּ
  choice: se aquecem
  rationale: O verbo raro indica tornar-se quente ou ser aquecido; a forma pronominal é natural em português e não especifica indevidamente a causa.
- source_word: נִצְמָתוּ
  choice: desaparecem
  rationale: No contexto dos cursos de água sazonais, expressa o fim ou desaparecimento das águas, preservando a força visual da imagem.
- source_word: בְּחֻמּוֹ
  choice: com o calor
  rationale: Traduz de modo natural a expressão literalmente “em seu calor”, preservando sem resolver em excesso a referência ambígua do sufixo.
- source_word: נִדְעֲכוּ
  choice: somem
  rationale: O verbo pode significar apagar-se ou extinguir-se; aplicado às águas sob o calor, “somem” comunica seu desaparecimento sem introduzir explicitamente “secar” onde o hebraico conserva outra imagem.
- source_word: מִמְּקוֹמָם
  choice: do seu lugar
  rationale: Mantém o sentido lexical amplo de “lugar”; “leito” ou “canal” seria uma especificação contextual possível, mas interpretativa.
