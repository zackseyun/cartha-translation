  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: pt
  text: Meus irmãos foram desleais como um uádi[a], como os leitos dos uádis que desaparecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um riacho, como os leitos de riachos”. O termo hebraico נחל pode indicar um riacho, um vale de torrente ou um curso de água sazonal; “uádi” preserva aqui a imagem de uma região árida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: meus irmãos
  rationale: Mantém o sentido familiar direto do hebraico, embora no contexto possa abranger companheiros próximos.
- source_word: בָּגְדוּ
  choice: foram desleais
  rationale: Expressa a quebra de lealdade e confiança sem limitar o verbo a um único ato específico de traição.
- source_word: כְמוֹ
  choice: como
  rationale: Equivalente comparativo natural em português.
- source_word: נָחַל
  choice: um uádi
  rationale: Preserva a imagem de um curso de água sazonal em região árida, mais precisa aqui do que a de um riacho perene.
- source_word: כַאֲפִיק
  choice: como os leitos dos
  rationale: אפיק designa o leito, canal ou curso por onde corre a água; “leitos” combina naturalmente com a imagem dos uádis.
- source_word: נְחָלִים
  choice: uádis
  rationale: Mantém coerência com o singular e conserva a ambientação árida do texto.
- source_word: יַעֲבֹרוּ
  choice: desaparecem
  rationale: 'No contexto dos cursos sazonais, o verbo descreve sua transitoriedade: passam e deixam de oferecer água. “Desaparecem” torna clara essa força contextual, desenvolvida nos versículos seguintes.'
