  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: pt
  text: Pois as flechas do Todo-Poderoso estão em mim[a]; meu espírito bebe o veneno delas[b]; os terrores de Deus se põem em ordem contra mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estão comigo». A preposição hebraica significa mais literalmente «comigo», mas a imagem das flechas e do veneno sugere o sentido «em mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a peçonha delas»; o termo também pode ser entendido de maneira mais abstrata como «a ira delas».'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: «dispõem-se contra mim», numa imagem de forças organizadas em formação de combate.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Jó para a legitimidade de sua queixa no contexto anterior, preservando a força explicativa sem torná-la mais específica do que o hebraico.
- source_word: חִצֵּי שַׁדַּי
  choice: as flechas do Todo-Poderoso
  rationale: Mantém a metáfora bélica e traduz o título divino שַׁדַּי por uma forma tradicional, clara e corrente em português.
- source_word: עִמָּדִי
  choice: estão em mim
  rationale: Embora a preposição signifique literalmente «comigo», o contexto das flechas e do veneno indica que elas atingiram Jó e estão nele.
- source_word: חֲמָתָם
  choice: o veneno delas
  rationale: No contexto imediato de flechas, o sentido concreto «veneno» se ajusta melhor à imagem do que o sentido abstrato «ira».
- source_word: שֹׁתָה רוּחִי
  choice: meu espírito bebe
  rationale: Conserva a imagem vívida do hebraico e entende רוּחַ como a vida interior de Jó, não como vento ou simples respiração.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: os terrores de Deus
  rationale: Expressa a intensidade do substantivo plural e traduz אֱלוֹהַּ pela designação divina comum «Deus».
- source_word: יַעַרְכוּנִי
  choice: se põem em ordem contra mim
  rationale: Preserva a imagem militar do verbo, que retrata os terrores como forças dispostas em formação de combate contra Jó.
theological_decisions:
- issue: Tradução paralela dos títulos divinos שַׁדַּי e אֱלוֹהַּ
  choice: «Todo-Poderoso» e «Deus»
  alternative: Transliterar שַׁדַּי como «Shaddai» ou uniformizar ambos os títulos
  rationale: O hebraico emprega duas designações distintas. Traduzir cada uma segundo seu sentido preserva essa distinção poética sem introduzir uma identificação denominacional.
- issue: Sentido de חֲמָתָם
  choice: O veneno das flechas
  alternative: A ira delas ou a ira de Deus
  rationale: A referência imediata às flechas e ao ato de beber favorece a leitura concreta, mas a alternativa abstrata é registrada em nota para preservar a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das imagens e o paralelismo poético foram preservados. «Se põem em ordem» mantém a metáfora militar sem recorrer a vocabulário excessivamente erudito.
