  text: יִ֭לָּ֣פְתוּ אָרְח֣וֹת דַּרְכָּ֑/ם יַעֲל֖וּ בַ/תֹּ֣הוּ וְ/יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: pt
  text: As veredas de seu curso serpenteiam para longe[a]; sobem para o ermo e desaparecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As rotas das caravanas se desviam; sobem para a região desolada e desaparecem.” A imagem hebraica é difícil, e alguns entendem que o versículo fala das caravanas, e não dos próprios caminhos ou cursos de água.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: serpenteiam para longe
  rationale: O nifal imperfeito pode descrever algo que se torce, serpenteia ou se desvia. A formulação mantém a imagem concreta e intransitiva dos caminhos ou leitos que deixam seu curso esperado.
- source_word: אָרְחוֹת
  choice: veredas
  rationale: O termo designa caminhos ou trilhas. “Veredas” preserva essa imagem no texto principal sem adotar como certa a leitura metonímica “caravanas”.
- source_word: דַּרְכָּם
  choice: de seu curso
  rationale: Embora דֶּרֶךְ signifique normalmente “caminho”, “curso” evita repetição e se ajusta à possível imagem de leitos ou canais de água, sem eliminar a ambiguidade do hebraico.
- source_word: יַעֲלוּ
  choice: sobem
  rationale: Mantém o sentido concreto mais comum do verbo עלה, “subir”, em vez de substituí-lo por uma interpretação da imagem difícil.
- source_word: בַתֹּהוּ
  choice: para o ermo
  rationale: תֹהוּ pode indicar vazio, desolação ou região deserta. “Ermo” é conciso, digno e adequado ao cenário, enquanto “para” expressa o movimento indicado pela preposição.
- source_word: וְיֹאבֵדוּ
  choice: e desaparecem
  rationale: אבד pode significar perecer, perder-se ou desaparecer. Neste contexto imagético, “desaparecem” comunica naturalmente o sumiço dos caminhos, cursos ou caravanas sem suavizar seu fim.
theological_decisions: []
