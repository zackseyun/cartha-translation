  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: pt
  text: Pode-se comer algo insípido sem sal, ou há algum gosto no visgo da malva?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos da segunda pergunta são incertos. “O visgo da malva” também pode ser entendido como “o suco da malva”; tradicionalmente, alguns traduzem a expressão por “a clara do ovo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Pode-se comer
  rationale: A partícula interrogativa com o imperfeito nifal de אכל introduz uma pergunta retórica; esta formulação preserva a voz passiva/impessoal de modo natural em português.
- source_word: תָּפֵל
  choice: comida sem sabor
  rationale: O termo indica algo insípido ou não temperado; explicitar o referente alimentar implícito torna o sentido claro sem alterar a imagem.
- source_word: מִ/בְּלִי מֶלַח
  choice: sem sal
  rationale: Expressa diretamente a ausência de sal; a coordenação com 'sem sabor' é idiomática em português.
- source_word: אִם יֶשׁ
  choice: ou há algum
  rationale: Aqui אִם introduz a segunda pergunta retórica paralela; 'ou há algum' reproduz essa relação naturalmente.
- source_word: טַעַם
  choice: gosto
  rationale: Equivalente direto que mantém a relação semântica com 'sem sabor' e soa natural no contexto de comida.
- source_word: בְּ/רִיר
  choice: na seiva viscosa da
  rationale: O substantivo raro pode indicar líquido viscoso, muco ou suco. 'Seiva viscosa' conserva tanto a ideia de líquido vegetal quanto a conotação desagradável, sem apresentar como certa uma identificação lexical insegura.
- source_word: חַלָּמוּת
  choice: malva
  rationale: A identificação da planta é incerta; 'malva' é uma proposta acadêmica comum e a incerteza é explicitada em nota.
