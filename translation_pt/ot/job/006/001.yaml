lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, na forma narrativa wayyiqtol, introduz a resposta de Jó ao discurso anterior. “Respondeu” é natural em português e preserva diretamente a função discursiva do hebraico.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: O verbo אמר, também em wayyiqtol, integra a fórmula narrativa hebraica “respondeu e disse”. A manutenção dos dois verbos preserva o estilo da fonte sem prejudicar a clareza em português.
- source_word: וַ
  choice: Então
  rationale: O waw inicial com wayyiqtol faz avançar a sequência narrativa. “Então” expressa essa progressão de modo natural e claro em português; “E” seria uma alternativa mais formalmente literal.
