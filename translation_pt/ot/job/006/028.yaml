base_translation:
  language: en
  yaml_path: translation/ot/job/006/028.yaml
  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: pt
  text: Mas agora, por favor, olhem para mim[a]; diante de vocês[b], eu mentiria[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltem-se para mim”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre os rostos de vocês”; isto é, “diante de vocês” ou “em sua presença”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “eu enganaria?”. O verbo hebraico pode significar “mentir” ou “falar falsamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Introduz um apelo imediato em contraste com a argumentação anterior, preservando tanto a nuance adversativa do waw no contexto quanto o sentido temporal de עַתָּה.
- source_word: הוֹאִילוּ
  choice: por favor
  rationale: O imperativo expressa disposição e, antes de outro imperativo, funciona idiomaticamente como um pedido cortês.
- source_word: פְנוּ בִי
  choice: olhem para mim
  rationale: פנה com ב pode indicar voltar-se para alguém ou dirigir-lhe a atenção. No contexto de avaliar a sinceridade de Jó diretamente, 'olhem para mim' é natural e preserva o apelo pessoal; 'voltem-se para mim' também é possível.
- source_word: וְעַל פְּנֵיכֶם
  choice: na presença de vocês
  rationale: A expressão literalmente relacionada às 'faces' enfatiza que Jó fala diretamente diante deles. A formulação escolhida comunica esse sentido em português natural.
- source_word: אִם אֲכַזֵּב
  choice: eu mentiria?
  rationale: Aqui אִם introduz uma pergunta retórica, não uma condição simples. O Piel de כזב pode significar mentir, falar falsamente ou enganar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase foi ajustada para que a pergunta retórica soe natural, sem eliminar a imagem concreta do hebraico, registrada em nota.
