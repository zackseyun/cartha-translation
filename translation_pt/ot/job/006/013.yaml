  text: הַ/אִ֬ם אֵ֣ין עֶזְרָתִ֣/י בִ֑/י וְ֝/תֻשִׁיָּ֗ה נִדְּחָ֥ה מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: pt
  text: Não há em mim ajuda alguma, e a sabedoria prática[a] foi afastada de mim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “capacidade de encontrar uma saída”; o termo hebraico pode indicar sabedoria eficaz, competência ou recursos práticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: Acaso não é verdade que não há
  rationale: Reproduz a pergunta retórica e mantém a negação existencial de אֵין. A formulação explícita evita que o português seja entendido como uma afirmação de que Jó ainda possui recursos interiores.
- source_word: עֶזְרָתִי בִי
  choice: ajuda em mim mesmo
  rationale: Conserva o sentido direto de עֶזְרָתִי, “minha ajuda”, e o valor interior de בִי, de modo natural no contexto da falta de recursos próprios.
- source_word: וְתֻשִׁיָּה
  choice: sabedoria prática
  rationale: תּוּשִׁיָּה pode indicar sabedoria eficaz, competência ou capacidade de encontrar uma saída. “Sabedoria prática” preserva tanto a ligação com a linguagem sapiencial quanto a ideia de eficácia.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: foi afastada de mim
  rationale: Mantém a voz passiva do nifal e o movimento de separação expresso pelo verbo e pela preposição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A abertura “Acaso não é verdade que” torna inteligível a combinação hebraica de partícula interrogativa e negação sem enfraquecer a força retórica. O paralelismo apresenta Jó como destituído de ajuda interior e de capacidade prática.
