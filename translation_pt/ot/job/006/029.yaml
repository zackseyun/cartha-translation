  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: pt
  text: Voltem atrás[a], por favor; que não haja injustiça. Voltem atrás mais uma vez; a minha justiça ainda está nisso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Reconsiderem, por favor; que não haja injustiça. Sim, reconsiderem: o meu direito ainda está nesta questão.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻֽׁבוּ
  choice: Voltem atrás
  rationale: O imperativo plural de שוב pede aos amigos de Jó que revertam sua avaliação. “Voltem atrás” preserva a imagem de mudança de direção e é natural em português.
- source_word: נָא
  choice: por favor
  rationale: A partícula suaviza o imperativo; “por favor” comunica esse tom de súplica em linguagem moderna.
- source_word: אַל תְּהִי עַוְלָה
  choice: que não haja injustiça
  rationale: Mantém a construção impessoal e o substantivo abstrato do hebraico, sem especificar além do texto quem cometeria a injustiça.
- source_word: וְשֻׁבוּ
  choice: Voltem atrás novamente
  rationale: A repetição do imperativo reforça o apelo. “Novamente” preserva essa insistência.
- source_word: עוֹד
  choice: ainda
  rationale: Indica que a justiça ou integridade de Jó continua presente na questão discutida.
- source_word: צִדְקִי
  choice: a minha justiça
  rationale: Preserva a dimensão moral e judicial de צדק, referindo-se aqui à retidão de Jó na controvérsia, sem transformar a frase numa declaração explícita de perfeição sem pecado.
- source_word: בָהּ
  choice: nisso
  rationale: Representa o sufixo pronominal feminino cujo referente permanece implícito, provavelmente a questão ou causa em discussão.
theological_decisions:
- issue: Sentido da afirmação de Jó sobre צִדְקִי
  choice: Jó afirma que sua justiça ou integridade permanece na questão em debate.
  alternative: Jó afirma que seu direito ou sua causa justa ainda está em jogo.
  rationale: “A minha justiça” mantém a tensão moral e forense do termo hebraico, enquanto o contexto limita a afirmação à controvérsia com os amigos, sem necessariamente implicar perfeição absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A formulação conserva a repetição enfática e a referência deliberadamente pouco explícita de בָהּ.
