source:
  edition: WLC
  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: pt
  text: Acaso o jumento selvagem[a] zurra diante do capim, ou o boi muge diante da sua forragem[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “asno selvagem”. O hebraico se refere especificamente ao jumento selvagem, também chamado onagro.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico indica alimento misturado preparado para animais, isto é, ração ou forragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽנְהַק
  choice: Acaso ... zurra
  rationale: נהק designa o som característico do jumento. “Zurrar” é o equivalente português preciso, e “acaso” comunica a força da pergunta retórica introduzida por הֲ.
- source_word: פֶּרֶא
  choice: jumento selvagem
  rationale: O substantivo designa especificamente o jumento selvagem ou onagro. A expressão é clara e evita confundi-lo com um cavalo selvagem.
- source_word: עֲלֵי דֶשֶׁא
  choice: diante do capim
  rationale: A expressão é literalmente “sobre/junto ao capim”, mas no contexto descreve o animal tendo alimento à disposição. “Diante do capim” conserva a imagem espacial sem explicar além do texto.
- source_word: אִם
  choice: ou
  rationale: Na segunda parte de perguntas retóricas paralelas, אִם introduz a alternativa coordenada e corresponde naturalmente a “ou”.
- source_word: יִגְעֶה
  choice: muge
  rationale: געה designa o som emitido por bovinos. “Mugir” é o verbo português exato e mantém o paralelismo com “zurrar”.
- source_word: שּׁוֹר
  choice: boi
  rationale: שׁוֹר refere-se a um bovino e, neste paralelo singular, “boi” é a forma corrente e natural.
- source_word: עַל בְּלִיל/וֹ
  choice: diante da sua forragem
  rationale: בְּלִיל designa alimento animal misturado, e o sufixo indica “sua”. “Forragem” preserva o sentido alimentar e o paralelismo espacial com “diante do capim”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os verbos específicos “zurrar” e “mugir” preservam o paralelismo poético. A formulação mantém as duas perguntas retóricas e evita explicitar a conclusão implícita de que animais alimentados não protestam.
