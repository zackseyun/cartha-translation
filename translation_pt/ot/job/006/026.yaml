    issue: «Vão ao vento» interpreta de modo excessivamente específico a expressão hebraica לָרוּחַ.
    rationale: A formulação portuguesa sugere que as palavras se dissipam ou são perdidas, ao passo que o hebraico conserva a imagem mais aberta de palavras tidas como vento. «São vento» mantém a elipse e a força metafórica.
  - severity: low
    issue: A explicação da leitura alternativa na nota vincula imprecisamente «considerar ... como vento» ao verbo «repreender».
    rationale: 'A alternativa é melhor expressa como um segundo elemento coordenado e elíptico do propósito: repreender palavras e tratar como vento as palavras de quem está desesperado.'
  revised_text: Vocês pensam em repreender palavras, quando as palavras de quem está desesperado são vento?[a]
