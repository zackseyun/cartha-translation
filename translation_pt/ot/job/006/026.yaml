  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: pt
  text: Vocês pensam em repreender palavras, quando as palavras de quem está desesperado são vento?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês pretendem corrigir meras palavras e tratar como vento as palavras de quem está desesperado?” A sintaxe hebraica permite entender a segunda oração tanto como uma afirmação (“as palavras de quem está desesperado são vento”) quanto como parte do propósito dos amigos (“tratar como vento ...”).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: repreender
  rationale: O infinitivo de יכח tem aqui sentido avaliativo e adversativo. “Repreender” preserva essa força sem suavizá-la para uma simples correção.
- source_word: מִלִּים
  choice: palavras
  rationale: Tradução direta e concisa, que evita acrescentar a ideia interpretativa de “meras palavras” ao texto principal.
- source_word: תַּחְשֹׁבוּ
  choice: pensam em
  rationale: חשב pode significar pensar, calcular ou planejar. Na pergunta retórica, “pensam em” expressa naturalmente a intenção cogitada.
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: vão ao vento
  rationale: Mantém a imagem concreta do vento e oferece em português uma construção natural para a relação indicada por ל, sem explicitar se as palavras são passageiras, vazias ou desprezadas.
- source_word: אִמְרֵ֥י נֹאָֽשׁ
  choice: as palavras de quem está desesperado
  rationale: O particípio singular נֹאָשׁ descreve alguém que perdeu a esperança. A formulação é natural, inclusiva quanto ao referente e conserva a condição pessoal de desespero.
theological_decisions:
- issue: Relação sintática da segunda oração
  choice: Entender “as palavras de quem está desesperado vão ao vento” como uma afirmação circunstancial ligada à pergunta principal.
  alternative: 'Entender a segunda oração como mais um objeto do propósito dos amigos: “e considerar como vento as palavras de quem está desesperado”.'
  rationale: O hebraico elíptico permite ambas as relações. O texto principal segue a leitura afirmativa, enquanto a nota preserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “palavras” conserva o paralelismo conciso do hebraico; “vão ao vento” mantém sua imagem poética sem tornar a frase artificial.
