  text: לַ/מָּ֣ס מֵרֵעֵ֣/הוּ חָ֑סֶד וְ/יִרְאַ֖ת שַׁדַּ֣י יַעֲזֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: pt
  text: Ao desesperado, é devida a bondade de seu amigo[b][a], mesmo que abandone o temor do Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O amigo que retém a bondade de quem está desesperado abandona o temor do Todo-Poderoso”. A sintaxe hebraica é condensada e pode ser entendida dessa maneira.'
    reason: alternative_reading
  - marker: b
    text: “Bondade” traduz חֶסֶד (ḥésed), termo que também pode expressar amor leal, misericórdia ou fidelidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: a quem está desesperado
  rationale: O termo deriva da ideia de derreter ou desfazer-se e descreve metaforicamente alguém que desmorona por dentro sob o sofrimento. A formulação comunica esse estado de modo natural em português.
- source_word: מֵרֵעֵהוּ
  choice: de seu amigo
  rationale: A preposição מִן indica a fonte da bondade esperada, e o sufixo de terceira pessoa masculina singular é preservado por “seu”.
- source_word: חָסֶד
  choice: bondade
  rationale: Neste contexto entre seres humanos, חֶסֶד designa bondade leal, misericórdia ou fidelidade demonstrada em compaixão. “Bondade” é clara no texto principal, enquanto a amplitude semântica é registrada em nota.
- source_word: וְיִרְאַת שַׁדַּי
  choice: o temor do Todo-Poderoso
  rationale: Mantém a expressão bíblica de temor reverente diante de Deus e preserva seu peso religioso.
- source_word: יַעֲזֹב
  choice: abandone
  rationale: O verbo significa deixar, abandonar ou desamparar. O subjuntivo se ajusta à leitura concessiva introduzida por “mesmo que”.
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Tradução portuguesa tradicional e inteligível do título divino שַׁדַּי, especialmente apropriada no livro de Jó.
theological_decisions:
- issue: Relação sintática da oração final
  choice: A pessoa desesperada deve receber bondade de seu amigo, mesmo que abandone o temor do Todo-Poderoso.
  alternative: O amigo que nega bondade a quem está desesperado abandona o temor do Todo-Poderoso.
  rationale: O hebraico é sintaticamente condensado e admite ambas as leituras. A principal se encaixa na censura de Jó aos amigos por não lhe oferecerem apoio leal; a alternativa relevante é preservada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conserva a expressão bíblica “temor do Todo-Poderoso” e sinaliza em notas tanto a amplitude de חֶסֶד quanto a ambiguidade sintática do hebraico.
