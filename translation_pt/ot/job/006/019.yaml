  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: pt
  text: As caravanas de Temá olharam[a]; os viajantes de Sabá esperaram por eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Caravanas» traduz uma palavra hebraica que pode significar literalmente «caminhos» ou «rotas»; aqui, ela se refere aos grupos de viajantes associados a essas rotas.
    reason: lexical_alternative
  - marker: b
    text: O pronome «eles» se refere aos cursos de água sazonais descritos nos versos anteriores. O verbo hebraico também pode expressar a ideia de esperar com esperança.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: olharam
  rationale: O verbo נבט significa olhar ou dirigir o olhar. A forma simples preserva a concisão poética e deixa o contexto indicar que as caravanas procuravam água.
- source_word: אָרְחוֹת
  choice: caravanas
  rationale: Embora o substantivo possa significar literalmente «caminhos» ou «rotas», aqui funciona metonimicamente para os grupos que percorrem essas rotas, em paralelo com «viajantes» no segundo membro.
- source_word: תֵּמָא
  choice: Temá
  rationale: Nome geográfico transliterado em forma corrente e com acento gráfico para orientar a pronúncia em português.
- source_word: הֲלִיכֹת
  choice: viajantes
  rationale: O termo, ligado à ideia de marcha ou jornada, designa aqui aqueles que viajam. «Viajantes» é natural e mantém o paralelismo sem repetir «caravanas».
- source_word: שְׁבָא
  choice: Sabá
  rationale: Nome geográfico vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: קִוּוּ
  choice: esperaram
  rationale: קוה pode expressar tanto esperar quanto ter esperança. «Esperaram» preserva naturalmente a expectativa concreta das caravanas por água, sem excluir a nuance de esperança.
- source_word: לָמוֹ
  choice: por eles
  rationale: Mantém o pronome hebraico e sua referência contextual aos cursos de água sazonais mencionados nos versos anteriores.
