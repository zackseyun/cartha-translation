  yaml_path: translation/ot/job/006/003.yaml
  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: pt
  text: Pois agora pesaria mais que a areia dos mares; por isso, minhas palavras foram precipitadas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minhas palavras foram descontroladas/confusas”. O verbo hebraico é difícil e pode indicar uma fala irrefreada ou desordenada.'
