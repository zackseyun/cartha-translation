lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da lamentação de Jó e mantém a ligação argumentativa com o versículo anterior.
- source_word: עַתָּה
  choice: agora
  rationale: Preserva o valor temporal e discursivo, destacando a realidade presente do sofrimento de Jó.
- source_word: מֵחוֹל יַמִּים
  choice: mais que a areia dos mares
  rationale: Expressa naturalmente a comparação e conserva o plural hebraico יַמִּים, “mares”.
- source_word: יִכְבָּד
  choice: pesaria mais
  rationale: Traduz o sentido de כבד, “ser pesado”, e recupera do contexto anterior o sujeito implícito — a aflição ou calamidade de Jó — sem inseri-lo explicitamente no versículo.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: Marca com clareza a consequência entre o peso extremo do sofrimento e a maneira de Jó falar.
- source_word: דְּבָרַי
  choice: minhas palavras
  rationale: Tradução direta que preserva o substantivo no plural.
- source_word: לָעוּ
  choice: foram impetuosas
  rationale: O verbo hebraico é raro e difícil. “Impetuosas” comunica fala irrefreada ou precipitada sem eliminar as possibilidades de descontrole ou confusão, registradas em nota.
