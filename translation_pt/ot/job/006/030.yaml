  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: pt
  text: Há injustiça em minha língua? Será que meu paladar não discerne calamidades?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas perversas” ou “coisas ruinosas”. O termo hebraico pode referir-se a calamidades ou males destrutivos, bem como a coisas moralmente perversas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Há
  rationale: Introduz de modo natural e conciso uma pergunta retórica de resposta afirmativa ou negativa.
- source_word: בִּלְשׁוֹנִי
  choice: em minha língua
  rationale: Preserva a metáfora corporal do hebraico e, no contexto, refere-se à fala de Jó.
- source_word: עַוְלָה
  choice: injustiça
  rationale: Expressa a dimensão moral de erro, injustiça ou perversidade sem recorrer a linguagem arcaica.
- source_word: אִם
  choice: Será que
  rationale: Introduz naturalmente em português a segunda pergunta retórica paralela, em vez de reproduzir mecanicamente a conjunção hebraica.
- source_word: חִכִּי
  choice: meu paladar
  rationale: Mantém a imagem concreta do órgão do gosto, usado metaforicamente para a capacidade de discernir.
- source_word: לֹא יָבִין
  choice: não discerne
  rationale: O verbo pode significar entender ou discernir; com o paladar como sujeito, “discernir” comunica melhor a percepção avaliativa.
- source_word: הַוּוֹת
  choice: coisas desastrosas
  rationale: O plural pode designar calamidades, males destrutivos ou coisas perversas. Esta formulação preserva a ideia de caráter ruinoso sem excluir por completo a referência ao sofrimento.
