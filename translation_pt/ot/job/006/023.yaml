  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: pt
  text: 'ou: “Livrem-me da mão do adversário e resgatem-me da mão dos violentos”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Livrem-me
  rationale: O hifil imperativo na segunda pessoa do plural, com sufixo de primeira pessoa, pede que os interlocutores façam Jó escapar. “Livrem-me” é natural e preserva o pedido direto.
- source_word: מִיַּד
  choice: das mãos de
  rationale: A expressão hebraica indica poder ou domínio. O plural idiomático em português, “das mãos de”, mantém a imagem concreta e soa natural.
- source_word: צָר
  choice: o adversário
  rationale: O singular designa alguém hostil, sem exigir um contexto estritamente militar. “Adversário” conserva essa amplitude.
- source_word: עָרִיצִים
  choice: os violentos
  rationale: O termo plural caracteriza pessoas cruéis, opressoras ou violentas. “Os violentos” preserva a força moral sem restringir o sentido a governantes tirânicos.
- source_word: תִּפְדּוּנִי
  choice: resgatem-me
  rationale: O verbo פדה expressa libertar ou obter a soltura, por vezes mediante resgate. “Resgatem-me” distingue este verbo de מלט e evita tornar necessariamente cultual ou soteriológico o contexto.
theological_decisions:
- issue: Sentido de פדה em contexto não cultual
  choice: resgatem-me
  alternative: redimam-me
  rationale: “Resgatar” mantém a ideia concreta de libertação e pode incluir o matiz de pagamento, sem impor ao verso uma conotação doutrinária que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O “ou” liga o verso à sequência retórica iniciada no contexto anterior. Mantém-se o paralelismo entre “livrem-me” e “resgatem-me” e a pergunta retórica final.
