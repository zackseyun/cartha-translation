  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: pt
  text: Isso ainda seria o meu consolo[a], e eu exultaria na dor implacável; pois não neguei as palavras do Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “e eu exultaria na dor que ele não poupa”. O hebraico desta oração é difícil e condensado.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: o meu consolo
  rationale: O substantivo derivado de נחם indica consolo ou conforto. “Consolo” é natural e digno em português e preserva a ideia do alívio interior que ainda restaria a Jó.
- source_word: וַאֲסַלְּדָה
  choice: e eu exultaria
  rationale: O raro verbo סלד é difícil, mas no contexto expressa uma reação intensa de alegria ou triunfo. “Exultaria” preserva essa força sem impor a imagem incerta de saltar.
- source_word: בְחִילָה
  choice: na dor implacável
  rationale: חִילָה pode indicar angústia, contorção ou dor intensa. Em conjunto com לֹא יַחְמֹל, a expressão comunica uma dor que não é poupada nem aliviada.
- source_word: לֹא יַחְמֹל
  choice: implacável
  rationale: חמל significa poupar ou ter compaixão. Integrar a oração comprimida ao adjetivo “implacável” produz português claro e conserva a noção de uma dor sem alívio; a forma mais explícita aparece na nota.
- source_word: כִחַדְתִּי
  choice: não neguei
  rationale: No piel, כחד pode significar negar, ocultar ou suprimir. Com “as palavras do Santo”, “não neguei” expressa naturalmente que Jó não as repudiou, sem excluir totalmente a nuance de não as encobrir.
- source_word: אִמְרֵי
  choice: as palavras do
  rationale: O plural construto de אמרה designa palavras ou declarações. “As palavras do” é a opção mais ampla e natural em português.
- source_word: קָדוֹשׁ
  choice: o Santo
  rationale: O adjetivo substantivado funciona aqui como título divino. “O Santo” é uma designação reconhecível de Deus e mantém a concisão do hebraico.
theological_decisions:
- issue: Título divino קָדוֹשׁ
  choice: o Santo
  alternative: o santo
  rationale: O contexto aponta para Deus, não para uma pessoa santa em sentido genérico. A inicial maiúscula sinaliza o uso titular sem acrescentar conteúdo doutrinário.
- issue: Interpretação da expressão difícil בְחִילָה לֹא יַחְמֹל
  choice: na dor implacável
  alternative: na dor que ele não poupa
  rationale: O hebraico é comprimido e sua sintaxe é difícil. A tradução principal comunica uma dor intensa e sem alívio em português natural, enquanto a nota preserva uma representação mais formal da possível construção e explicita sua dificuldade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula conserva a ligação explicativa entre o consolo de Jó e sua afirmação de fidelidade. A formulação principal busca equivalência ótima, e a nota mantém transparente a ambiguidade da oração central.
