base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: pt
  text: Ensinem-me, e eu me calarei; façam-me entender em que errei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam-me entender como me desviei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Ensinem-me
  rationale: O hifil de ירה tem aqui o sentido comum de ensinar ou instruir. “Ensinem-me” é natural, direto e adequado ao apelo de Jó a seus interlocutores.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: e eu me calarei
  rationale: Mantém o pronome explícito, que dá ênfase à resposta de Jó, e traduz אַחֲרִישׁ com o tom sóbrio de permanecer calado diante de uma correção válida.
- source_word: וּמַה שָּׁגִיתִי
  choice: em que errei
  rationale: A construção hebraica pede que os interlocutores identifiquem o erro de Jó. “Em que errei” expressa isso com clareza, enquanto a nota preserva a possibilidade de entender שׁגה com a imagem de desviar-se.
- source_word: הָבִינוּ לִי
  choice: façam-me entender
  rationale: Preserva o valor causativo do hifil de בין e o complemento לִי, apresentando o pedido para que lhe deem entendimento.
theological_decisions:
- issue: Natureza do suposto erro de Jó
  choice: em que errei
  alternative: como me desviei
  rationale: A tradução não afirma que Jó de fato apostatou nem define a natureza do erro; conserva o pedido condicional e aberto para que seus amigos demonstrem onde ele falhou.
translation_notes:
  register: Português moderno, claro e digno, com formas no plural porque Jó se dirige a seus interlocutores. A formulação mantém o paralelismo dos dois imperativos e a firme disposição de Jó de ouvir uma correção demonstrada.
