  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: pt
  text: 'Chamo à cova: “Você é meu pai”; e ao verme: “Minha mãe e minha irmã.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: cova
  rationale: No contexto de Jó 17, designa a cova sepulcral ou lugar de decomposição. “Cova” preserva a imagem concreta e sua proximidade semântica com a morte, sem impor uma identificação mais específica com o Sheol.
- source_word: קָרָאתִי
  choice: Chamo
  rationale: O perfeito hebraico pode apresentar a ação assumida ou declarada no discurso. O presente em português expressa naturalmente a personificação direta e corresponde ao sentido contextual de Jó afirmar sua afinidade com a sepultura.
- source_word: רִמָּה
  choice: verme
  rationale: Refere-se ao verme associado à decomposição. O singular coletivo e personificado do hebraico é mantido.
theological_decisions:
- issue: Personificação da cova e do verme como parentes próximos
  choice: Manter literalmente “meu pai”, “minha mãe e minha irmã”
  alternative: Explicitar que Jó considera a morte e a decomposição sua família ou destino
  rationale: A metáfora forte do texto hebraico deve permanecer sem explicação incorporada ao versículo; ela comunica a proximidade de Jó com a morte sem resolver além do que o texto afirma.
- issue: Identificação de שַׁחַת
  choice: “cova”
  alternative: “sepultura”, “abismo” ou “corrupção”
  rationale: “Cova” conserva a referência funerária concreta e a ambiguidade poética, evitando transformar o termo numa afirmação técnica sobre o estado dos mortos.
translation_notes:
  register: Português moderno, claro e digno, com pontuação que preserva o paralelismo hebraico. O tratamento “você” torna natural a fala personificada e é amplamente compreensível no português brasileiro; não há marcadores de nota porque nenhuma nota foi necessária.
