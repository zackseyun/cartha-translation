id: JOB.17.1
reference: Job 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: pt
  text: Meu espírito está arruinado[a]; meus dias se apagaram[b]; sepulturas me aguardam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Meu sopro está arruinado”. O termo hebraico רוּחַ pode significar “espírito”, “sopro” ou “respiração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “meus dias foram extintos”. O verbo provavelmente evoca algo que é apagado, como uma chama.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: meu espírito
  rationale: רוּחַ pode significar espírito, sopro ou respiração. No lamento de Jó, “meu espírito” comunica naturalmente sua vida interior arruinada, enquanto a alternativa física permanece na nota.
- source_word: חֻבָּלָה
  choice: está arruinado
  rationale: A forma passiva indica dano grave, ruína ou destruição. “Está arruinado” preserva essa força sem especificar além do hebraico como ocorreu o dano.
- source_word: יָמַי
  choice: meus dias
  rationale: Tradução direta do plural possessivo, referindo-se aos dias que constituem a vida de Jó.
- source_word: נִזְעָכוּ
  choice: se apagaram
  rationale: O verbo sugere que algo foi apagado ou extinto, evocando possivelmente uma chama. A formulação portuguesa é clara, expressiva e preserva a metáfora.
- source_word: קְבָרִים
  choice: sepulturas
  rationale: Mantém o plural concreto do hebraico, sem reduzi-lo ao singular coletivo “sepultura”.
- source_word: לִי
  choice: me aguardam
  rationale: Embora לִי signifique literalmente “para mim”, no contexto a formulação idiomática comunica que as sepulturas são o destino imediatamente diante de Jó.
theological_decisions:
- issue: Sentido de רוּחִי
  choice: meu espírito
  alternative: meu sopro
  rationale: A escolha não define uma antropologia técnica nem separa rigidamente a vida interior da respiração física; a ambiguidade lexical genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O paralelismo conciso do hebraico foi mantido; “sepulturas” preserva o plural incomum, e as notas conservam a ambiguidade de רוּחַ e a imagem de extinção em נִזְעָכוּ.
