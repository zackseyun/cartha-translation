  text: לַ֭יְלָה לְ/י֣וֹם יָשִׂ֑ימוּ א֝֗וֹר קָר֥וֹב מִ/פְּנֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: pt
  text: 'Eles transformam a noite em dia; dizem[a]: “A luz está perto, diante das trevas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo “dizem” não aparece no hebraico; foi suprido para indicar que as palavras seguintes expressam o que eles afirmam.
    reason: Torna transparente uma complementação interpretativa adotada para a leitura em português, sem atribuir o verbo ao texto hebraico.
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: Eles transformam a noite em dia
  rationale: Reproduz naturalmente em português a construção hebraica que expressa fazer da noite dia, sem explicar além do texto.
- source_word: אוֹר קָרוֹב
  choice: A luz está perto
  rationale: Mantém a formulação breve e concreta do hebraico, inclusive sua possível dimensão metafórica.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: diante das trevas
  rationale: Preserva a imagem espacial e a tensão entre a alegada proximidade da luz e a presença das trevas, sem reduzir a expressão a uma relação causal.
theological_decisions:
- issue: Identificação do sujeito plural
  choice: Manter o pronome genérico “Eles” sem identificar explicitamente seus referentes
  alternative: Explicitar “meus amigos” ou “meus pensamentos”
  rationale: O verso hebraico apresenta o sujeito apenas pela flexão verbal plural; identificá-lo resolveria uma ambiguidade contextual que o original conserva.
- issue: Introdução da fala direta
  choice: Suprir “dizem” e sinalizar a elipse em nota
  alternative: 'Traduzir sem verbo de elocução: “a luz está perto diante das trevas”'
  rationale: A fala direta comunica com clareza a leitura contextual adotada, mas a nota reconhece que o verbo não está expresso no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para leitores brasileiros e compreensão ampla no mundo lusófono. A expressão “diante das trevas” conserva deliberadamente a imagem e a tensão do hebraico.
