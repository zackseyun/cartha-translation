id: JOB.17.8
reference: Job 17:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָשֹׁ֣מּוּ יְשָׁרִ֣ים עַל זֹ֑את וְ֝/נָקִ֗י עַל חָנֵ֥ף יִתְעֹרָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: pt
  text: Os íntegros ficam horrorizados com isso, e o inocente se levanta contra o ímpio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o hipócrita”. O hebraico חָנֵף pode designar uma pessoa ímpia ou irreverente e, em alguns contextos, é tradicionalmente traduzido por “hipócrita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: ficam horrorizados
  rationale: No qal, שׁמם expressa aqui espanto intenso, próximo de horror. A formulação comunica essa forte reação de modo natural em português.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O adjetivo plural substantivado designa pessoas moralmente retas. “Os íntegros” é claro, conciso e preserva a categoria moral.
- source_word: עַל זֹאת
  choice: com isso
  rationale: A expressão indica a ocasião ou causa da reação. “Com isso” é idiomático em português sem explicitar além do hebraico se a ideia é ocasião ou causa.
- source_word: נָקִי
  choice: o inocente
  rationale: Designa alguém livre de culpa; “o inocente” comunica diretamente o sentido moral no contexto.
- source_word: חָנֵף
  choice: o ímpio
  rationale: O termo denota uma pessoa irreverente ou sem devoção, não necessariamente apenas alguém insincero. “Ímpio” preserva melhor a oposição ético-religiosa a “íntegros” e “inocente”.
- source_word: יִתְעֹרָר
  choice: se levanta
  rationale: A forma hitpolel expressa despertar ou incitar a si mesmo para agir. “Se levanta” preserva de maneira natural a força reflexiva e a mobilização para oposição.
- source_word: עַל חָנֵף
  choice: contra o ímpio
  rationale: 'Com o verbo de despertar ou levantar-se, עַל tem sentido adversativo: o inocente reage em oposição ao ímpio.'
theological_decisions:
- issue: Tradução de חָנֵף
  choice: o ímpio
  alternative: o hipócrita
  rationale: O hebraico possui alcance mais amplo que insinceridade e caracteriza alguém profano ou irreverente. “Ímpio” mantém o contraste moral e religioso do verso sem restringir o termo a uma categoria psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo entre “os íntegros” e “o inocente” e evita linguagem excessivamente arcaica.
