  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: pt
  text: Mas o justo se mantém firme em seu caminho, e quem tem as mãos limpas se torna cada vez mais forte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e quem tem as mãos limpas acrescenta força”. O hebraico diz literalmente “acrescenta força”, expressão que também pode ser entendida como “cresce em força” ou, em sentido mais específico, “ganha coragem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Mas ... se mantém firme
  rationale: A conjunção pode ser traduzida literalmente por “e”, mas, no contexto, introduz um contraste moderado com a descrição sombria anterior. O verbo אחז expressa agarrar ou conservar firmemente e, aqui, comunica perseverança.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo singular é usado como substantivo e apresenta a pessoa justa como tipo representativo, sem acrescentar uma indicação de gênero ausente do foco do hebraico.
- source_word: דַּרְכּוֹ
  choice: seu caminho
  rationale: Mantém tanto a imagem concreta de caminho quanto o sentido metafórico de conduta ou curso de vida.
- source_word: וּטֳהָר יָדַיִם
  choice: quem tem as mãos limpas
  rationale: Preserva a imagem hebraica tradicional de inocência ou pureza moral em formulação natural no português moderno.
- source_word: יֹסִיף אֹמֶץ
  choice: se torna cada vez mais forte
  rationale: A expressão significa literalmente “acrescenta força”. Esta formulação comunica com naturalidade o aumento progressivo de força ou firmeza sem restringir אֹמֶץ apenas à coragem.
