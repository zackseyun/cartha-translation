id: JOB.17.4
reference: Job 17:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: pt
  text: Pois escondeste o coração deles do entendimento[a]; por isso, não os exaltarás[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mente deles” ou “o seu íntimo”. Em hebraico, “coração” frequentemente designa o centro do pensamento e do discernimento, não apenas das emoções.
    reason: lexical_alternative
  - marker: b
    text: Ou “não os elevarás” ou “não permitirás que triunfem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação dentro do argumento poético; “Pois” conserva essa ligação de modo natural e digno em português.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém a imagem hebraica do coração como centro do pensamento, da vontade e do discernimento, sem reduzi-la apenas às emoções.
- source_word: צָפַנְתָּ
  choice: escondeste
  rationale: Expressa diretamente a ação divina de ocultar ou manter escondido e reflete adequadamente a forma verbal hebraica.
- source_word: מִשָּׂכֶל
  choice: do entendimento
  rationale: A preposição indica separação; “entendimento” comunica a ideia de discernimento ou compreensão sem estreitar indevidamente o sentido.
- source_word: עַל כֵּן
  choice: por isso
  rationale: É uma ligação inferencial clara e corrente entre a causa apresentada e sua consequência.
- source_word: לֹא תְרֹמֵם
  choice: não os exaltarás
  rationale: Preserva a imagem de elevar contida na raiz רום e deixa em aberto se a elevação seria honra, posição ou triunfo.
theological_decisions:
- issue: Referente dos sufixos e pronomes no plural (“deles” / “os”)
  choice: Conservar os pronomes sem identificar explicitamente o grupo.
  alternative: Explicitar que se trata dos adversários de Jó ou de seus aliados.
  rationale: Os verbos na segunda pessoa mostram que Jó se dirige a Deus, enquanto os elementos na terceira pessoa do plural apontam para outro grupo. Como o versículo isolado não o nomeia, a tradução evita uma expansão interpretativa.
- issue: Agência divina na falta de entendimento
  choice: Traduzir diretamente “escondeste”, preservando a afirmação de que Deus realizou a ação.
  alternative: Abrandar para uma formulação permissiva, como “permitiste que não entendessem”.
  rationale: O hebraico atribui a ação diretamente ao interlocutor divino; uma formulação permissiva resolveria uma tensão teológica que o texto mantém.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem das notas segue a ocorrência dos marcadores no texto. A construção “escondeste o coração deles do entendimento” é deliberadamente próxima da metáfora e da relação sintática hebraicas, preservando sua tensão poética.
