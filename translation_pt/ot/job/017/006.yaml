  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: pt
  text: Ele fez de mim um provérbio entre os povos[a], e me tornei alguém diante de quem as pessoas cospem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dito de zombaria entre os povos”. O termo hebraico parece indicar que Jó se tornou um exemplo proverbial de desprezo.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, algo como: “e me tornei um cuspe diante de rostos”. A expressão, de formulação incomum, descreve desprezo aberto e público.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Ele fez de mim
  rationale: O hifil com sufixo de primeira pessoa indica que alguém — no contexto, Deus — colocou Jó nessa condição. “Fez de mim” expressa naturalmente em português a relação com o predicativo seguinte, sem perder o sentido causativo.
- source_word: לִמְשֹׁל
  choice: um provérbio
  rationale: A forma incomum parece designar alguém que se tornou proverbial, aqui como objeto público de desprezo. “Provérbio” conserva a imagem hebraica; a nota esclarece seu sentido depreciativo no contexto.
- source_word: עַמִּים
  choice: entre os povos
  rationale: Mantém o plural do hebraico e expressa de modo idiomático a ampla exposição pública de Jó.
- source_word: וְתֹפֶת
  choice: alguém em cujo rosto cospem
  rationale: O substantivo raro está associado ao ato de cuspir ou ao objeto desse ato. A formulação torna inteligível a imagem de humilhação aberta sem reduzi-la ao termo genérico “vergonha”.
- source_word: לְפָנִים
  choice: em cujo rosto
  rationale: A expressão significa literalmente “diante de rostos”. Em ligação com a imagem de cuspir, “em cujo rosto” comunica em português o desprezo direto e público, enquanto a nota preserva a forma literal incerta.
- source_word: אֶהְיֶה
  choice: me tornei
  rationale: Embora seja formalmente um imperfeito, no paralelismo poético descreve a condição resultante em que Jó se encontra. “Me tornei” liga essa condição à ação anterior.
theological_decisions:
- issue: Identidade do sujeito implícito em וְהִצִּגַנִי
  choice: Ele
  alternative: Deus
  rationale: O contexto aponta para Deus, mas o verso hebraico não o nomeia explicitamente. O pronome preserva essa forma de referência sem acrescentar um nome ao texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção natural para o público brasileiro. “Provérbio” mantém a imagem lexical do hebraico, e a segunda oração explicita com moderação a cena de humilhação sem apagar a dificuldade da expressão original.
