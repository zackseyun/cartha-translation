base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: pt
  text: Por certo, zombadores estão comigo[a], e meu olho se demora em suas provocações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enganadores estão comigo”; o termo hebraico pode designar pessoas enganadoras ou zombeteiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua rebeldia” ou “em sua amargura”; a expressão hebraica é difícil e pode indicar conduta provocadora, rebelde ou amarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Por certo
  rationale: A expressão funciona aqui como fórmula enfática, não como condição; “Por certo” transmite a forte afirmação em português natural.
- source_word: הֲתֻלִים
  choice: zombadores
  rationale: O termo designa pessoas que escarnecem ou zombam; no contexto das falas hostis dos companheiros de Jó, “zombadores” é a opção mais adequada, embora “enganadores” também seja possível.
- source_word: עִמָּדִי
  choice: estão comigo
  rationale: A preposição com sufixo de primeira pessoa indica que essas pessoas estão na companhia ou presença imediata de Jó.
- source_word: וּבְהַמְּרוֹתָם
  choice: diante da provocação deles
  rationale: A forma pode apontar para conduta provocadora, rebelde ou amarga. “Provocação” preserva a relação com a hostilidade verbal sem restringi-la especificamente à rebelião contra Deus.
- source_word: תָּלַן
  choice: passam a noite
  rationale: O verbo significa literalmente alojar-se ou passar a noite. A tradução mantém a imagem hebraica vívida aplicada metaforicamente aos olhos de Jó.
- source_word: עֵינִי
  choice: meus olhos
  rationale: Embora o hebraico use o singular, o plural é a expressão corporal mais natural em português e não altera o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a metáfora concreta de passar a noite, mas usa “meus olhos” para maior naturalidade em português. Os marcadores aparecem junto aos termos a que se referem.
