  text: שִֽׂימָ/ה נָּ֭א עָרְבֵ֣/נִי עִמָּ֑/ךְ מִֽי ה֝֗וּא לְ/יָדִ֥/י יִתָּקֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: pt
  text: Estabelece, por favor, uma garantia por mim junto a ti[a]; quem é que apertará a minha mão[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sê tu mesmo o meu fiador”. O hebraico emprega linguagem jurídica de fiança ou garantia.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem é ele que baterá na minha mão?”. Bater ou apertar as mãos era um gesto usado para assumir ou confirmar uma fiança.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה
  choice: Deposita
  rationale: O imperativo de שׂים significa pôr ou colocar; “deposita” comunica com naturalidade o ato de constituir uma garantia no contexto jurídico.
- source_word: נָּא
  choice: por favor
  rationale: A partícula suaviza o imperativo e expressa a súplica de Jó.
- source_word: עָרְבֵנִי
  choice: uma garantia por mim
  rationale: A forma de ערב pertence à linguagem de fiança ou caução, e o sufixo indica que a garantia é prestada em favor de Jó.
- source_word: עִמָּךְ
  choice: junto a ti mesmo
  rationale: A expressão mantém a tensão de Jó pedir que a garantia seja constituída junto ao próprio Deus, sem esclarecer além do que o hebraico permite como Deus ocuparia ambos os papéis.
- source_word: מִי הוּא
  choice: quem é que
  rationale: Reproduz a pergunta retórica sem inserir explicitamente “outro”, ideia provável no contexto, mas não expressa lexicalmente.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: apertaria a minha mão
  rationale: Traduz de modo natural o gesto concreto de bater ou unir as mãos para confirmar uma fiança ou acordo, preservando a imagem jurídica.
theological_decisions:
- issue: Metáfora jurídica dirigida a Deus
  choice: Jó pede que a garantia em seu favor seja depositada junto ao próprio Deus.
  alternative: Jó pede genericamente que Deus providencie um fiador.
  rationale: עָרְבֵנִי עִמָּךְ associa a garantia diretamente a Deus, mas o texto conserva uma tensão quanto a Deus ser o garantidor, o depositário da garantia, ou ambos; a tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Deposita uma garantia” preserva o campo jurídico sem recorrer ao menos corrente “presta caução”; “apertaria a minha mão” torna inteligível o gesto antigo, explicado em nota.
