base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: pt
  text: Mas todos vocês, voltem e venham agora; não encontrarei entre vocês nenhum sábio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas todos vocês, voltem e venham, por favor”. O hebraico traz uma convocação enfática, provavelmente desafiando os amigos de Jó a apresentar novamente seus argumentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Marca uma transição fortemente adversativa de modo natural no português atual.
- source_word: כֻּלָּם
  choice: todos vocês
  rationale: Os verbos seguintes estão na segunda pessoa do plural, indicando que Jó se dirige diretamente a todos os interlocutores.
- source_word: תָּשֻׁבוּ
  choice: voltem
  rationale: O verbo שוב assume aqui força imperativa no desafio dirigido aos amigos de Jó; “voltem” preserva a ideia de retornar ou tentar novamente.
- source_word: וּבֹאוּ נָא
  choice: e venham
  rationale: בוא com נָא expressa uma convocação enfática. A formulação mantém a repetição retórica sem transformar נָא em cortesia indevida.
- source_word: וְלֹא אֶמְצָא
  choice: não encontrarei
  rationale: 'O imperfeito tem sentido futuro ou resultativo após a convocação: mesmo que tornem a apresentar-se, Jó não achará sabedoria entre eles.'
- source_word: בָכֶם
  choice: entre vocês
  rationale: A preposição situa o possível sábio no grupo dos destinatários; esta é a expressão idiomática em português.
- source_word: חָכָם
  choice: nenhum sábio
  rationale: O adjetivo masculino singular é substantivado. Com a negação, “nenhum sábio” comunica naturalmente que Jó não achará sequer um homem sábio entre seus interlocutores.
theological_decisions:
- issue: Forma masculina substantivada de חָכָם
  choice: nenhum sábio
  alternative: ninguém que seja sábio
  rationale: A tradução conserva o masculino singular do hebraico e sua referência contextual aos companheiros homens de Jó, sem ampliar nem neutralizar silenciosamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência verbal incomum “voltem... e venham” foi preservada por refletir a repetição enfática do hebraico; a nota registra a possível contribuição de נָא.
