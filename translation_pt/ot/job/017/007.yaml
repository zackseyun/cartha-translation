  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: pt
  text: Meu olho ficou turvo de aflição[a], e todos os meus membros são como uma sombra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de ira”, “de irritação” ou “de tristeza”. O termo hebraico pode expressar diferentes formas de agitação emocional; “aflição” se ajusta ao contexto de lamento e sofrimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha forma”, “minhas feições” ou “minha estrutura”. O termo hebraico provavelmente se refere, em conjunto, às partes ou aos traços do corpo de Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: perdeu o brilho
  rationale: O verbo כהה indica tornar-se apagado, fraco ou sem nitidez. A expressão comunica de modo natural o enfraquecimento da visão e preserva a imagem poética.
- source_word: מִכַּעַשׂ
  choice: de tanta tristeza
  rationale: כַּעַשׂ pode designar tristeza, aflição, irritação ou ira. No contexto do lamento e sofrimento de Jó, “tristeza” expressa adequadamente a causa emocional, enquanto as demais possibilidades ficam registradas em nota.
- source_word: עֵינִי
  choice: Meu olho
  rationale: O hebraico emprega o singular com sufixo de primeira pessoa. O singular foi mantido para preservar a forma e o tom poético do original.
- source_word: וִיצֻרַי
  choice: os membros do meu corpo
  rationale: O termo, derivado de יצר, parece referir-se às partes, feições ou à forma corporal de Jó. “Membros do meu corpo” é claro em português, harmoniza com a referência ao olho e conserva a dimensão física da imagem.
- source_word: כַּצֵּל
  choice: como uma sombra
  rationale: Mantém diretamente a comparação poética, que sugere falta de substância, debilidade ou definhamento.
- source_word: כֻּלָּם
  choice: todos
  rationale: Reproduz a abrangência coletiva do hebraico em relação às partes do corpo de Jó.
