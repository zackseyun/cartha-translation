base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: pt
  text: E onde, então, está a minha esperança? E a minha esperança — quem poderá vê-la?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quem a contemplará?» O verbo hebraico pode ser traduzido por «ver» ou «contemplar», e a forma verbal pode expressar tanto futuro simples quanto possibilidade («poderá»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: E onde
  rationale: אַיֵּה é um interrogativo de lugar, «onde?», e o וְ inicial mantém a continuidade do lamento de Jó.
- source_word: אֵפוֹ
  choice: então
  rationale: A partícula acrescenta ênfase ou força inferencial; «então» comunica isso de modo natural em português.
- source_word: תִקְוָתִי
  choice: a minha esperança
  rationale: תִּקְוָה denota esperança ou expectativa; «esperança» é a opção mais natural no contexto.
- source_word: וְתִקְוָתִי
  choice: E a minha esperança
  rationale: Mantém-se a repetição do substantivo presente no hebraico, preservando sua ênfase e força poética.
- source_word: מִי
  choice: quem
  rationale: Equivalente direto do pronome interrogativo pessoal.
- source_word: יְשׁוּרֶנָּה
  choice: poderá vê-la
  rationale: O verbo שׁור pode significar «ver», «contemplar» ou «avistar». O futuro com valor potencial preserva a leitura modal adequada ao contexto; o pronome feminino retoma «esperança».
