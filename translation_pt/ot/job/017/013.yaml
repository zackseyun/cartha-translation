  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: pt
  text: Se espero que o Sheol seja minha casa[a], estendi meu leito na escuridão,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o mundo dos mortos”. O termo hebraico “Sheol” se refere ao lugar dos mortos e tem sentido mais amplo do que apenas um local de sepultamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Mantém a força condicional ou hipotética do hebraico, sem transformá-la em afirmação temporal.
- source_word: אֲקַוֶּה
  choice: espero por
  rationale: Expressa expectativa e espera; no contexto, Jó contempla o Sheol como sua futura morada.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva a amplitude do conceito hebraico, que não se limita ao túmulo físico.
- source_word: בֵּיתִי
  choice: como minha casa
  rationale: 'Explicita de modo natural em português a relação nominal: o Sheol seria a morada de Jó.'
- source_word: בַּחֹשֶׁךְ
  choice: na escuridão
  rationale: Reproduz a preposição e o artigo, além da imagem sombria associada ao domínio dos mortos.
- source_word: רִפַּדְתִּי
  choice: estendo
  rationale: Conserva a imagem concreta de preparar ou estender um leito.
- source_word: יְצוּעָי
  choice: minha cama
  rationale: É a forma mais clara e corrente de designar o lugar onde alguém se deita, preservando a imagem do descanso.
theological_decisions:
- issue: Se שְׁאוֹל deve ser traduzido de modo interpretativo
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração evita reduzir o termo a um túmulo físico ou associá-lo automaticamente a uma formulação doutrinária posterior; a nota oferece equivalentes explicativos.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética próxima do hebraico. A repetição de “se” preserva a estrutura condicional e a tensão do contexto.
