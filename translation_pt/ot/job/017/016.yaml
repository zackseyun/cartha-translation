id: JOB.17.16
reference: Job 17:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּדֵּ֣י שְׁאֹ֣ל תֵּרַ֑דְנָה אִם יַ֖חַד עַל עָפָ֣ר נָֽחַת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: pt
  text: Descerão elas até as trancas do Sheol?[a] Desceremos juntos ao pó?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às partes do Sheol” ou “aos ferrolhos do Sheol”. A imagem hebraica provavelmente evoca as trancas dos portões do domínio dos mortos.
    reason: lexical_alternative
  - marker: b
    text: Ou “Juntos repousaremos no pó?” O hebraico da frase final é difícil e pode ser entendido em termos de descida ou, segundo alguns intérpretes, de repouso.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: trancas
  rationale: No contexto de Sheol, o termo provavelmente evoca trancas ou ferrolhos, representando poeticamente o domínio aprisionador dos mortos; a nota preserva outras possibilidades lexicais.
- source_word: שְׁאֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos, sem reduzi-lo simplesmente à sepultura.
- source_word: תֵּרַדְנָה
  choice: Descerão elas
  rationale: Mantém o verbo 'descer' e o feminino plural hebraico, que retoma as esperanças mencionadas no contexto. A forma interrogativa corresponde ao fluxo retórico.
- source_word: אִם
  choice: '[força interrogativa em] Desceremos'
  rationale: Embora normalmente signifique 'se', aqui pode introduzir uma pergunta retórica; a tradução naturaliza essa função sem inserir uma condição artificial.
- source_word: יַחַד
  choice: juntos
  rationale: Expressa de modo direto a ideia de descida conjunta.
- source_word: עַל עָפָר
  choice: ao pó
  rationale: Conserva a imagem hebraica do pó e, com o verbo de movimento, comunica naturalmente o destino da descida.
- source_word: נָחַת
  choice: Desceremos
  rationale: Entendido como ideia de descida, em paralelo com תֵּרַדְנָה. Como a forma e a sintaxe são difíceis e alguns a relacionam a descanso, a alternativa é registrada em nota.
theological_decisions:
- issue: Sentido de Sheol
  choice: Manter 'Sheol' como designação do domínio dos mortos
  alternative: Traduzir como 'sepultura' ou 'mundo dos mortos'
  rationale: A transliteração evita limitar indevidamente a amplitude do termo e preserva a cosmologia poética do texto.
- issue: Leitura da cláusula final
  choice: Entendê-la como descida conjunta ao pó
  alternative: Entendê-la como repouso conjunto no pó
  rationale: A leitura de descida ressalta o paralelismo com o primeiro hemistíquio, mas a alternativa tradicional e lexicalmente possível é mantida em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. O pronome 'elas' explicita apenas o gênero e o número presentes no verbo hebraico e remete às esperanças do contexto. 'Sheol' é mantido como termo técnico bíblico, esclarecido pela nota.
