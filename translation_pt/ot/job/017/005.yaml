  text: לְ֭/חֵלֶק יַגִּ֣יד רֵעִ֑ים וְ/עֵינֵ֖י בָנָ֣י/ו תִּכְלֶֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/005.yaml
  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: pt
  text: Quem denuncia amigos em troca de uma parte[a], os olhos de seus filhos desfalecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por uma porção”, “por lucro” ou, segundo outra interpretação, “com lisonjas”. A expressão hebraica é difícil, mas parece descrever alguém que trata os amigos visando vantagem pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: em troca de uma parte
  rationale: חֵלֶק significa normalmente “parte” ou “porção”. A construção é difícil neste contexto; “em troca de” comunica a provável ideia de vantagem pessoal sem acrescentar ao texto a noção específica de despojo.
- source_word: יַגִּיד
  choice: denuncia
  rationale: O hifil de נגד significa “declarar, contar, tornar conhecido”. Neste contexto, em relação aos amigos e à vantagem obtida, “denuncia” expressa o sentido adverso de expô-los ou delatá-los.
- source_word: רֵעִים
  choice: amigos
  rationale: רֵעִים designa amigos ou companheiros; “amigos” preserva claramente a dimensão de traição relacional.
- source_word: וְעֵינֵי בָנָיו
  choice: os olhos de seus filhos
  rationale: Tradução direta da construção hebraica; בנים pode designar filhos ou crianças, e aqui “filhos” mantém a relação familiar sem especificar idade.
- source_word: תִּכְלֶנָה
  choice: desfalecerão
  rationale: כלה pode indicar chegar ao fim, consumir-se ou falhar. Com “olhos” como sujeito, “desfalecerão” conserva a imagem de olhos que se consomem, perdem a força ou ficam debilitados.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial. A formulação preserva a dificuldade da primeira oração por meio de nota e evita explicitar “despojo”, ideia possível, mas não presente de modo inequívoco no substantivo hebraico.
