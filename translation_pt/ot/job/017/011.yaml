  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: pt
  text: Meus dias passaram; meus planos — os desejos do meu coração — foram desfeitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os bens do meu coração”, “as coisas preciosas do meu coração” ou “as heranças do meu coração”. A expressão hebraica é rara e difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: meus dias
  rationale: Mantém literalmente o substantivo com sufixo de primeira pessoa e conserva a expressão hebraica natural para o tempo de vida de Jó.
- source_word: עָבְרוּ
  choice: passaram
  rationale: O qal perfeito descreve os dias como já transcorridos; “passaram” é direto, natural e preserva o aspecto concluído.
- source_word: זִמֹּתַי
  choice: meus planos
  rationale: זִמָּה pode indicar plano, propósito ou intenção. Neste lamento, “planos” expressa naturalmente aquilo que Jó pretendia realizar sem introduzir a conotação negativa de “maquinações”.
- source_word: נִתְּקוּ
  choice: foram desfeitos
  rationale: O nifal de נתק comunica ruptura, separação ou corte. Aplicado a “planos”, “foram desfeitos” preserva a força da perda e soa natural em português, sem explicitar uma causa não indicada pelo texto.
- source_word: מוֹרָשֵׁי
  choice: os desejos do
  rationale: O termo é raro e difícil. No paralelismo com “meus planos”, pode designar aquilo que o coração guarda como precioso, isto é, seus desejos. Como sentidos ligados a posse ou herança também são possíveis, a ambiguidade lexical é registrada em nota.
- source_word: לְבָבִי
  choice: meu coração
  rationale: “Coração” conserva a imagem hebraica do centro interior dos pensamentos, propósitos e desejos.
