  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: pt
  text: Quem abriu um canal para a enxurrada[a] e um caminho para o relâmpago dos trovões?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a chuva torrencial” ou “para a torrente”. Literalmente, a expressão final é “para o relâmpago dos sons/vozes”; no contexto, “sons/vozes” provavelmente se refere a trovões.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: abriu
  rationale: O verbo descreve dividir ou fender de modo a formar um curso. Em português, “abriu um canal” expressa com naturalidade a ação de criar uma passagem para as águas.
- source_word: שֶּׁטֶף
  choice: a enxurrada
  rationale: O substantivo pode indicar uma torrente de água ou uma chuva avassaladora. “Enxurrada” combina naturalmente com “canal” e preserva a imagem de águas impetuosas.
- source_word: תְּעָלָה
  choice: um canal
  rationale: Designa um conduto ou curso para água; “canal” é claro, atual e adequado ao paralelismo poético.
- source_word: דֶרֶךְ
  choice: um caminho
  rationale: Indica a rota ou o curso estabelecido para o fenômeno celeste e mantém o paralelismo com “canal”.
- source_word: חֲזִיז
  choice: o relâmpago
  rationale: O termo raro provavelmente designa relâmpago ou raio. “Relâmpago” permite representar também o elemento קֹלוֹת sem fundi-lo por completo numa única palavra.
- source_word: קֹלוֹת
  choice: acompanhado de trovões
  rationale: Literalmente, “vozes/sons”; em contexto meteorológico, refere-se naturalmente aos trovões. A formulação idiomática conserva tanto o clarão quanto os sons da tempestade.
theological_decisions: []
