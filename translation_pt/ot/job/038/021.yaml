  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: pt
  text: Você sabe, pois naquela época você nasceu, e o número dos seus dias é grande![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os seus dias são muitos”. Literalmente, o hebraico diz: “e o número dos seus dias — muitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Você sabe disso
  rationale: O qal perfeito na 2ª pessoa masculina singular funciona aqui com força retórica e sarcástica. O presente em português comunica naturalmente essa ironia; “disso” explicita apenas o objeto subentendido pelo contexto anterior.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação irônica da pergunta precedente e mantém fluidez argumentativa sem tornar a relação excessivamente causal.
- source_word: אָז
  choice: naquele tempo
  rationale: Retoma o tempo dos acontecimentos da criação mencionados anteriormente. É uma formulação natural e um pouco mais explícita que “então”.
- source_word: תִּוָּלֵד
  choice: já tinha nascido
  rationale: 'O nifal imperfeito da raiz ילד é empregado retoricamente com referência ao passado: a ironia supõe que Jó já estivesse vivo naquela época. O mais-que-perfeito composto expressa bem essa anterioridade em português.'
- source_word: וּמִסְפַּר
  choice: e o número
  rationale: Preserva de modo natural a conjunção e o substantivo em estado construto.
- source_word: יָמֶיךָ
  choice: dos seus dias
  rationale: Reproduz a cadeia construta com o sufixo de segunda pessoa singular em português corrente.
- source_word: רַבִּים
  choice: é grande
  rationale: O adjetivo plural hebraico completa a expressão “o número dos seus dias”. Em português, “o número ... é grande” preserva a estrutura e a concordância com o núcleo singular.
theological_decisions: []
