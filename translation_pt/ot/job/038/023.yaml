  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: pt
  text: que reservei[a] para um tempo de angústia[b], para um dia de batalha e guerra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retive” ou “guardei”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “aflição”, “dificuldade” ou “adversidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa que retoma os depósitos de neve e granizo mencionados no versículo anterior; “que” é natural e mantém a ligação sintática.
- source_word: חָשַׂכְתִּי
  choice: reservei
  rationale: O verbo pode significar reter, poupar ou guardar para uso posterior. “Reservei” expressa aqui a ação deliberada de conservar esses fenômenos para uma ocasião futura.
- source_word: לְעֶת
  choice: para um tempo de
  rationale: A preposição indica destinação ou finalidade, e עֵת designa um tempo ou ocasião. A formulação é clara e preserva o paralelismo com “para um dia de”.
- source_word: צָר
  choice: angústia
  rationale: No contexto, designa aflição, dificuldade ou adversidade. “Angústia” conserva a força da expressão sem especificar indevidamente a natureza da calamidade.
- source_word: לְיוֹם
  choice: para um dia de
  rationale: Mantém a construção paralela e o sentido de destinação temporal.
- source_word: קְרָב
  choice: batalha
  rationale: É um termo militar direto; “batalha” é corrente, claro e adequado ao paralelismo.
- source_word: וּמִלְחָמָה
  choice: e guerra
  rationale: Preserva a coordenação hebraica de dois termos militares próximos, sem reduzir a expressão a uma única ideia.
theological_decisions:
- issue: Uso divino das forças naturais em contexto de juízo e conflito
  choice: Manter o sentido direto de que Deus reservou esses fenômenos para tempos de angústia, batalha e guerra.
  alternative: Interpretar toda a linguagem apenas como metáfora geral da providência, sem referência militar concreta.
  rationale: O texto menciona explicitamente batalha e guerra. A tradução conserva essa imagem e sua tensão teológica sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece ligada ao contexto anterior por começar com “que”, e a vírgula final reflete sua continuidade no discurso poético.
