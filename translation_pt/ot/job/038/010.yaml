  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: pt
  text: quando lhe estabeleci o meu limite[a] e coloquei ferrolhos e portas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando fixei para ele o meu decreto». O hebraico provavelmente se refere ao estabelecimento do limite do mar, e não ao ato literal de «quebrar» algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: prescrevi
  rationale: Embora שׁבר costume significar «quebrar», esse sentido é difícil aqui. O contexto e antigas versões favorecem a ideia de fixar ou prescrever o limite do mar.
- source_word: עָלָיו
  choice: lhe
  rationale: O sufixo masculino singular retoma o mar do contexto anterior; com «prescrevi», a construção portuguesa «lhe prescrevi» é natural.
- source_word: חֻקִּי
  choice: o meu limite
  rationale: חֹק pode designar decreto, determinação ou limite fixado. No contexto da contenção do mar, «limite» comunica com clareza a fronteira imposta por Deus sem eliminar a noção de decreto.
- source_word: וָאָשִׂים
  choice: coloquei
  rationale: Tradução direta e natural de שׂים, adequada à imagem concreta de instalar meios de contenção.
- source_word: בְּרִיחַ
  choice: trancas
  rationale: בְּרִיחַ indica uma barra ou tranca usada para fechar uma entrada. O plural coletivo harmoniza naturalmente com «portas».
- source_word: וּדְלָתָיִם
  choice: portas
  rationale: A forma dual sugere um par de folhas ou portas; «portas» preserva a imagem arquitetônica em português corrente.
theological_decisions:
- issue: Representação antropomórfica do domínio de Deus sobre o mar
  choice: Manter a imagem concreta de Deus impondo ao mar um limite com trancas e portas.
  alternative: Substituir a imagem por uma afirmação abstrata da soberania divina sobre a natureza.
  rationale: A poesia expressa a soberania de Deus por meio de uma cena arquitetônica vívida; preservá-la respeita a força do hebraico sem sistematizar além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Trancas e portas» mantém a imagem concreta; «o meu limite» é mais idiomático e preciso neste contexto do que «a minha fronteira».
