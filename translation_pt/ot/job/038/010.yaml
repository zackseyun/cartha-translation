    issue: «Prescrevi» tem uma colocação pouco idiomática com «limite» e «lhe» neste contexto.
    rationale: Embora possível, pode soar administrativo ou médico. «Estabeleci» expressa naturalmente a fixação soberana de um limite, coerente com o contexto e com a alternativa lexical reconhecida na nota.
  - severity: low
    issue: «Trancas» é semanticamente mais amplo que בְּרִיחַ.
    rationale: O termo hebraico evoca um ferrolho, barra ou trava de porta. «Ferrolhos» preserva mais especificamente a imagem arquitetônica sem tornar o verso obscuro.
