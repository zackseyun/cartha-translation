  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: pt
  text: De cujo ventre saiu o gelo, e quem deu à luz a geada[a] dos céus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a geada branca dos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: De que ventre
  rationale: Preserva literalmente a imagem de nascimento de בֶּטֶן, enquanto a construção interrogativa com מִי é expressa em português natural como “de que ventre”.
- source_word: יָצָא
  choice: saiu
  rationale: O verbo significa “sair”. A forma simples e atual mantém a imagem poética sem recorrer a uma expressão artificial ou arcaizante.
- source_word: הַקָּרַח
  choice: o gelo
  rationale: קֶרַח designa gelo; o artigo definido hebraico é naturalmente representado por “o”.
- source_word: וּכְפֹר שָׁמַיִם
  choice: e ... a geada dos céus
  rationale: כְּפוֹר pode indicar geada ou, mais especificamente, geada branca. “Geada” é clara e corrente; “dos céus” conserva a construção genitiva e a amplitude poética de שָׁמַיִם.
- source_word: מִי יְלָדוֹ
  choice: quem deu à luz
  rationale: ילד significa gerar ou dar à luz. A expressão explicita em português moderno a metáfora materna paralela ao “ventre” do primeiro membro; o sufixo masculino singular retoma a geada, embora o gênero gramatical seja ajustado em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com paralelismo poético e metáfora de nascimento preservados. “Céus” mantém o tom cósmico do hebraico sem impor uma distinção teológica entre céu atmosférico e morada divina.
