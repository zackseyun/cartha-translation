translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Acaso» sinaliza a força retórica sem tornar a frase arcaica; «a você» evita ambiguidade pronominal. O paralelismo e as imagens concretas do hebraico foram preservados.
