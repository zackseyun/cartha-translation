  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: pt
  text: Acaso as portas da morte foram reveladas a você, ou você viu as portas das trevas profundas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sombra da morte». O hebraico צַלְמָוֶת é tradicionalmente traduzido dessa forma, mas também pode indicar trevas profundas ou escuridão densa de modo mais geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ לְךָ
  choice: Acaso ... foram reveladas a você
  rationale: A partícula interrogativa introduz uma pergunta retórica, e o passivo «foram reveladas» preserva a voz nifal de גלה. «A você» explicita naturalmente o destinatário indicado por לְךָ.
- source_word: שַׁעֲרֵי מָוֶת
  choice: as portas da morte
  rationale: Mantém a cadeia construta e a imagem concreta das entradas do domínio da morte. «Portas» é a forma corrente e digna em português para portais ou acessos desse tipo.
- source_word: וְ/שַׁעֲרֵי
  choice: ou ... as portas
  rationale: Embora וְ tenha normalmente valor aditivo, «ou» expressa com naturalidade em português a segunda parte desta pergunta retórica paralela, sem transformar as imagens em alternativas excludentes.
- source_word: צַלְמָוֶת
  choice: trevas profundas
  rationale: O termo pode designar escuridão intensa ou densa obscuridade, especialmente em linguagem poética. A escolha evita restringi-lo necessariamente à análise tradicional «sombra da morte», preservada em nota.
- source_word: תִּרְאֶה
  choice: você viu
  rationale: O imperfeito qal de segunda pessoa masculina singular, no contexto da série de perguntas divinas sobre a experiência de Jó, é expresso naturalmente pelo pretérito perfeito em português.
