  text: בְּ/רָן יַ֭חַד כּ֣וֹכְבֵי בֹ֑קֶר וַ֝/יָּרִ֗יעוּ כָּל בְּנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: pt
  text: quando as estrelas da manhã cantavam juntas, e todos os filhos de Deus[a] davam gritos de alegria?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os seres celestiais” ou “os anjos”. Hebraico: “os filhos de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: quando ... cantavam
  rationale: A preposição בְּ com o infinitivo construto introduz aqui uma oração temporal ligada à pergunta do contexto anterior. רנן expressa canto ou brado jubiloso; “cantavam” se harmoniza com o paralelismo poético.
- source_word: יַחַד
  choice: juntas
  rationale: Indica simultaneidade ou ação em unidade. A concordância no feminino acompanha naturalmente “estrelas” em português.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: as estrelas da manhã
  rationale: Reproduz de modo natural a construção hebraica “estrelas da manhã” e preserva sua imagem poética.
- source_word: וַ/יָּרִיעוּ
  choice: davam gritos de alegria
  rationale: O hifil de רוע/ריע denota levantar um brado, frequentemente jubiloso. A formulação explicita o caráter festivo indicado pelo contexto e pelo paralelismo.
- source_word: כָּל
  choice: todos
  rationale: Preserva diretamente a totalidade expressa por כָּל e concorda com “filhos”.
- source_word: בְּנֵי אֱלֹהִים
  choice: os filhos de Deus
  rationale: Mantém a expressão hebraica formalmente transparente e teologicamente significativa, sem identificar interpretativamente esses seres como “anjos” no texto principal.
theological_decisions:
- issue: Identidade de בְּנֵי אֱלֹהִים
  choice: “os filhos de Deus” no texto principal
  alternative: “os seres celestiais”, “os seres divinos” ou “os anjos”
  rationale: Em Jó, a expressão provavelmente designa integrantes da corte celestial, mas “anjos” resolveria interpretativamente uma identificação que o hebraico deixa na fórmula “filhos de Deus”. A tradução preserva essa tensão e esclarece as alternativas em nota.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira e compreensão internacional. O pretérito imperfeito apresenta as duas ações simultâneas no cenário da criação; a ordem e o paralelismo do hebraico foram preservados sem rigidez artificial.
