translation_notes:
  register: Português moderno, claro e poeticamente digno. A ordem “Alguma vez na sua vida você...” mantém o tom direto do desafio divino. “Fez a alvorada saber” é deliberadamente poético para conservar a construção causativa e a personificação do hebraico.
