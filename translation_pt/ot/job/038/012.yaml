  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: pt
  text: Alguma vez na sua vida[a] você deu ordens à manhã e fez a alvorada saber o seu lugar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “desde os seus dias”, expressão que aqui significa “em algum momento da sua vida”.'
    reason: cultural_note
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: alguma vez na sua vida
  rationale: A construção interrogativa com מִן e “seus dias” pergunta se isso ocorreu em algum momento ao longo da vida de Jó. A formulação escolhida comunica naturalmente o sentido idiomático em português.
- source_word: צִוִּיתָ
  choice: deu ordens à
  rationale: O verbo צוה expressa uma ordem dada com autoridade. “Deu ordens à manhã” preserva a personificação poética e soa mais natural em português corrente do que “comandou a manhã”.
- source_word: בֹּקֶר
  choice: manhã
  rationale: “Manhã” representa o sentido comum de בֹּקֶר e mantém sua personificação como realidade da criação.
- source_word: יָדַעְתָּה
  choice: fez ... saber
  rationale: A forma causativa de ידע requer que o sujeito faça a alvorada saber algo. A tradução preserva tanto a causalidade quanto a personificação, sem substituí-las por uma interpretação mais explícita.
- source_word: שַׁחַר
  choice: alvorada
  rationale: “Alvorada” distingue שַׁחַר de בֹּקֶר (“manhã”) e conserva o paralelismo poético em linguagem digna e compreensível.
- source_word: מְקוֹמוֹ
  choice: o seu lugar
  rationale: Traduz diretamente “seu lugar”, sem acrescentar a ideia interpretativa de que seria um lugar previamente designado.
