  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: pt
  text: Onde está o caminho para a morada da luz,[a] e onde fica o lugar das trevas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Qual é o caminho onde habita a luz? E as trevas — onde fica o seu lugar?”'
