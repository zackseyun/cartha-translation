lexical_decisions:
- source_word: אֵי זֶה
  choice: Onde está / onde fica
  rationale: A expressão interrogativa pergunta por localização ou direção. As duas formulações são naturais em português e preservam o paralelismo sem rigidez.
- source_word: הַדֶּרֶךְ
  choice: o caminho
  rationale: דֶּרֶךְ pode significar caminho, estrada ou vereda. “Caminho” conserva tanto a ideia de percurso quanto a de acesso.
- source_word: יִשְׁכָּן
  choice: para a morada
  rationale: O verbo שׁכן significa habitar, residir. A formulação liga o caminho ao destino e mantém a personificação poética da luz como algo que possui morada.
- source_word: אוֹר
  choice: luz
  rationale: Equivalente direto e apropriado ao contraste cósmico com as trevas.
- source_word: וְחֹשֶׁךְ
  choice: e ... das trevas
  rationale: Preserva a coordenação e o contraste paralelo entre luz e trevas.
- source_word: מְקוֹמוֹ
  choice: o lugar das trevas
  rationale: מָקוֹם significa “lugar”, e o sufixo pronominal retoma “trevas”. A explicitação do referente soa natural em português.
