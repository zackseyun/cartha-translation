  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: pt
  text: Você pode fazer aparecer as Mazarote[a] no tempo certo ou guiar Aísh[b] com seus filhos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazarote é um raro termo astronômico hebraico, possivelmente referente às constelações ou ao zodíaco.
    reason: lexical_alternative
  - marker: b
    text: Aísh é um nome hebraico de uma estrela ou constelação. Algumas traduções tradicionais usam “Arcturo”; muitos o identificam com “a Ursa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: Você pode fazer sair
  rationale: O hifil de יצא tem sentido causativo. A expressão preserva a ideia de fazer os astros aparecerem ou saírem, sem definir além do hebraico o tipo de movimento.
- source_word: מַזָּרוֹת
  choice: as Mazarote
  rationale: O termo astronômico hebraico é raro e de referente incerto. A transliteração adaptada ao português evita a precisão indevida de opções como “constelações” ou “zodíaco”.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: A expressão indica o tempo próprio ou determinado para o aparecimento. “No tempo certo” é natural em português e mantém essa ideia.
- source_word: וְעַיִשׁ
  choice: Aixe
  rationale: O nome astronômico é incerto. A transliteração adaptada ao português preserva o nome hebraico sem adotar como certa a identificação tradicional com Arcturo ou com a Ursa.
- source_word: עַל בָּנֶיהָ
  choice: com seus filhos
  rationale: Mantém a metáfora familiar e o sufixo feminino do hebraico; no contexto, os “filhos” provavelmente são estrelas acompanhantes.
- source_word: תַנְחֵם
  choice: guiar
  rationale: O hifil de נחה significa conduzir ou guiar. “Guiar” expressa naturalmente a direção do conjunto astral pelo céu.
