  text: הֲ֭/בָאתָ עַד נִבְכֵי יָ֑ם וּ/בְ/חֵ֥קֶר תְּ֝ה֗וֹם הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: pt
  text: Você chegou às nascentes do mar[a] ou percorreu os recantos do abismo[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “fontes do mar”; também é possível: “recantos do mar”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “as regiões mais remotas das profundezas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ
  choice: Você chegou
  rationale: O qal perfeito de בוא, em pergunta dirigida a Jó, expressa chegar ou ir até um destino. “Você chegou” é natural e mantém o desafio direto.
- source_word: עַד
  choice: às
  rationale: A preposição indica movimento até um destino e se combina naturalmente com “chegou”.
- source_word: נִבְכֵי
  choice: nascentes
  rationale: O termo pode designar as fontes ou lugares de onde as águas brotam. “Nascentes” preserva a imagem concreta das origens ocultas do mar; a leitura “recantos” permanece possível e é indicada em nota.
- source_word: יָם
  choice: do mar
  rationale: יָם é aqui o substantivo comum “mar”, sem necessidade de tratá-lo como nome próprio.
- source_word: וּבְחֵקֶר
  choice: ou ... os recantos
  rationale: חֵקֶר pode referir-se ao que é sondado ou alcançado em suas regiões mais remotas e inescrutáveis. “Recantos” comunica os lugares ocultos do abismo sem repetir “profundezas do abismo”. A conjunção é vertida como “ou” para apresentar a segunda pergunta paralela.
- source_word: תְּהוֹם
  choice: do abismo
  rationale: תְּהוֹם designa as águas profundas ou o oceano abissal. “Abismo” conserva a força poética e cosmológica, sem necessariamente impor um sentido sobrenatural.
- source_word: הִתְהַלָּכְתָּ
  choice: percorreu
  rationale: O hitpael de הלך sugere andar por, transitar ou mover-se de um lado para outro. “Percorreu” expressa de modo natural a ideia de atravessar lugares inacessíveis.
theological_decisions:
- issue: Sentido cosmológico de תְּהוֹם
  choice: abismo
  alternative: profundezas oceânicas
  rationale: “Abismo” mantém a imagem poética e a possível ressonância cosmológica do hebraico, mas o contexto deixa claro que se trata das profundezas aquáticas; não se acrescenta uma interpretação demonológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal e vocabulário naturais para leitores brasileiros. O paralelismo interrogativo e a imagem poética dos lugares inacessíveis sob o mar foram preservados.
