base_translation:
  language: en
  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: pt
  text: Ou quem fechou o mar com portas, quando ele irrompeu e saiu do ventre?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jorrou”; o verbo hebraico sugere uma saída impetuosa.'
    reason: lexical_alternative
  - marker: b
    text: O verso personifica o mar como uma criança que sai do ventre, dando continuidade às imagens poéticas da criação.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: fechou
  rationale: Expressa a ação de encerrar ou conter o mar e combina naturalmente com a imagem concreta das portas.
- source_word: בִּדְלָתַיִם
  choice: com portas
  rationale: Preserva o sentido instrumental da preposição e a metáfora arquitetônica do substantivo dual hebraico.
- source_word: יָם
  choice: o mar
  rationale: O artigo definido é natural em português neste contexto cósmico, em que o mar é apresentado como realidade conhecida.
- source_word: בְּגִיחוֹ
  choice: quando ele irrompeu
  rationale: O verbo evoca uma saída impetuosa; “irrompeu” conserva a força e a vivacidade poética.
- source_word: מֵרֶחֶם
  choice: do ventre
  rationale: Mantém a imagem do nascimento sem especificar uma mãe, como no hebraico.
- source_word: יֵצֵא
  choice: e saiu
  rationale: Representa o verbo finito que completa a figura do nascimento, preservando a repetição poética sem produzir uma formulação excessivamente redundante em português.
theological_decisions:
- issue: Imagem poética da criação do mar
  choice: Manter o mar personificado como alguém que nasce e é contido por Deus.
  alternative: Parafrasear de modo abstrato como Deus impondo limites ao mar.
  rationale: O hebraico descreve poeticamente o mar saindo de um ventre e sendo fechado com portas. Preservar essa tensão imagética comunica a soberania divina sem transformar a metáfora em afirmação mitológica literal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética acessível. “Irrompeu e saiu” conserva os dois elementos verbais do hebraico; os marcadores seguem a ordem normal de leitura.
