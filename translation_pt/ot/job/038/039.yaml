  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: pt
  text: 'Você caça a presa para a leoa

    e sacia a fome dos leões jovens?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתָצוּד
  choice: Você caça
  rationale: A partícula interrogativa הֲ com o imperfeito qal de צוד introduz uma pergunta retórica dirigida a Jó. O presente em português expressa naturalmente a capacidade ou prática questionada.
- source_word: לְלָבִיא
  choice: para a leoa
  rationale: לָבִיא pode designar leão ou leoa; a associação com os leões jovens e seu sustento favorece contextualmente “leoa”, sem tornar explícita uma ideia ausente do texto.
- source_word: טָרֶף
  choice: a presa
  rationale: טָרֶף designa presa, especialmente como alimento de um predador; “presa” conserva essa imagem concreta.
- source_word: וְחַיַּת
  choice: a fome
  rationale: Embora חַיַּת tenha sentido literal ligado a “vida” ou “ser vivente”, na construção com מלא refere-se ao apetite ou à necessidade vital dos leões. “Fome” comunica de modo claro e natural o sentido contextual.
- source_word: כְּפִירִים
  choice: dos leões jovens
  rationale: כְּפִירִים designa leões jovens. A expressão evita restringir indevidamente o termo a filhotes muito pequenos.
- source_word: תְּמַלֵּא
  choice: sacia
  rationale: O piel de מלא significa literalmente “encher”; com “fome”, “saciar” é o equivalente idiomático natural em português e preserva a ideia de suprir plenamente.
