  yaml_path: translation/ot/job/038/009.yaml
  text: when I made a cloud its garment[a], and thick darkness its swaddling band,
translation:
  language: pt
  text: 'quando fiz de uma nuvem a sua veste,

    e da escuridão densa a sua faixa de envolver,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu pano de envolver”. O hebraico evoca a imagem de um recém-nascido sendo enfaixado, dando continuidade à metáfora do nascimento do mar no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: quando fiz
  rationale: A construção com בְּ e o infinitivo construto de שׂוּם, com sufixo de primeira pessoa, tem valor temporal. “Quando fiz” é natural em português e introduz as ações de Deus sobre o mar.
- source_word: עָנָן
  choice: das nuvens
  rationale: עָנָן significa “nuvem”. O plural coletivo soa natural em português na imagem de uma veste que envolve o mar.
- source_word: לְבֻשׁוֹ
  choice: a sua veste
  rationale: לְבוּשׁ designa roupa ou veste. “Veste” conserva a metáfora poética do hebraico; o pronome retoma o mar do contexto.
- source_word: וַעֲרָפֶל
  choice: e da escuridão densa
  rationale: עֲרָפֶל indica escuridão espessa, muitas vezes de caráter atmosférico. “Escuridão densa” comunica tanto a obscuridade quanto sua intensidade.
- source_word: חֲתֻלָּתוֹ
  choice: as suas faixas de recém-nascido
  rationale: O termo deriva da ideia de envolver ou enfaixar. Esta escolha preserva claramente a imagem do mar tratado como um recém-nascido e mantém o paralelismo com “veste”.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com leve elevação em “veste”. A estrutura em dois membros conserva o paralelismo hebraico. O plural “nuvens” é idiomático e coletivo; “faixas de recém-nascido” explicita sem eliminar a imagem do enfaixamento.
