  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: pt
  text: Por que caminho a luz se reparte[b][a], ou o vento leste se espalha sobre a terra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Onde está o caminho pelo qual a luz se reparte?” A expressão interrogativa hebraica pode perguntar tanto pelo lugar quanto pelo modo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o relâmpago”, em vez de “a luz”. A palavra hebraica normalmente significa “luz”, mas alguns a entendem aqui como um fenômeno luminoso ligado à tempestade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Por que
  rationale: Com הַדֶּרֶךְ, a expressão interrogativa pode perguntar pelo caminho ou lugar. “Por que caminho” reproduz naturalmente o sentido instrumental em português sem excluir a leitura locativa, registrada em nota.
- source_word: הַדֶּרֶךְ
  choice: caminho
  rationale: דֶּרֶךְ significa comumente “caminho, via”; “caminho” mantém a imagem poética e forma uma pergunta idiomática.
- source_word: יֵחָלֶק
  choice: se reparte
  rationale: O nifal de חלק pode ter sentido passivo ou reflexivo, “ser dividido/repartir-se”. “Se reparte” é conciso, natural e preserva essa amplitude.
- source_word: אוֹר
  choice: luz
  rationale: “Luz” é o valor lexical normal de אוֹר. A interpretação contextual mais específica, “relâmpago”, permanece em nota.
- source_word: יָפֵץ
  choice: se espalha
  rationale: O hifil de פוץ expressa dispersão. Embora a forma seja causativa, neste paralelismo poético o sujeito expresso pode ser entendido como aquilo que é espalhado; “se espalha” é natural em português e conserva a imagem meteorológica.
- source_word: קָדִים
  choice: o vento leste
  rationale: קָדִים designa frequentemente o vento oriental. “Vento leste” é claro e corrente no português de ampla compreensão.
- source_word: עֲלֵי אָרֶץ
  choice: sobre a terra
  rationale: A expressão pode significar “sobre a terra” ou “sobre o país”. O alcance cósmico do discurso favorece “terra”.
