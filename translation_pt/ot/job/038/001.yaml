  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: pt
  text: Então Yahweh respondeu a Jó do meio da tempestade e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do meio do redemoinho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה nesta forma narrativa indica responder; a escolha mantém a ligação com as falas anteriores de Jó e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת אִיּוֹב
  choice: a Jó
  rationale: אֶת marca o objeto direto e não recebe tradução própria; em português, o nome Jó é introduzido por 'a' como complemento de 'respondeu'.
- source_word: מִן־הַסְּעָרָה
  choice: do meio da tempestade
  rationale: סְעָרָה designa uma tempestade violenta e também pode evocar um redemoinho. 'Do meio da tempestade' expressa de modo natural que a voz procede do fenômeno, sem estreitar indevidamente a imagem.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Tradução direta da sequência narrativa de אמר; o sujeito já está explícito e não precisa ser repetido.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico apresenta o nome próprio divino. A transliteração preserva essa distinção, sem substituí-lo por um título.
- issue: Especificidade da imagem de סְעָרָה
  choice: tempestade
  alternative: redemoinho; vendaval
  rationale: O termo pode indicar uma tempestade violenta, possivelmente com movimento giratório. O texto principal mantém o sentido amplo, enquanto a nota registra uma alternativa imagética plausível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. A expressão 'do meio da tempestade' evita o menos idiomático 'para fora da tempestade' e conserva a origem da fala no fenômeno teofânico.
