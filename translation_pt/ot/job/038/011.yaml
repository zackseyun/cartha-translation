  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: pt
  text: 'E eu disse: “Até aqui você pode chegar, mas não passará daqui; aqui serão detidas as suas ondas orgulhosas”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqui será contido o orgulho das suas ondas”. O verbo hebraico significa literalmente “pôr, colocar”; a construção concisa indica o ponto em que as ondas elevadas do mar são contidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: e eu disse
  rationale: O wayyiqtol de אמר, na primeira pessoa do singular, dá continuidade à descrição divina com valor narrativo sequencial.
- source_word: עַד־פֹּה תָבוֹא
  choice: Até aqui você pode chegar
  rationale: Preserva o limite espacial e a interpelação direta ao mar personificado; “pode” comunica a extensão permitida pelo decreto divino.
- source_word: וְלֹא תֹסִיף
  choice: mas não passará daqui
  rationale: O hifil de יסף significa literalmente “acrescentar, continuar”; no contexto de um limite imposto ao mar, a formulação expressa naturalmente que ele não pode avançar além desse ponto.
- source_word: וּפֹא יָשִׁית
  choice: aqui serão detidas
  rationale: A construção hebraica é concisa e algo difícil; no contexto, descreve as ondas sendo contidas no ponto estabelecido. A tradução corrente mantém esse sentido, enquanto a nota registra a imagem mais literal de pôr ou colocar.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: as suas ondas orgulhosas
  rationale: גאון pode indicar orgulho, majestade ou elevação. Aplicado às ondas, “orgulhosas” preserva poeticamente a ideia de sua força elevada e impetuosa; גלים é traduzido pelo termo claro e abrangente “ondas”.
theological_decisions:
- issue: Personificação do mar sob a ordem divina
  choice: Manter o tratamento direto na segunda pessoa e a linguagem de limite imposto por Deus.
  alternative: Despersonalizar o mar como mera força natural.
  rationale: O hebraico se dirige poeticamente ao mar como “você”. Essa personificação realça a autoridade do Criador sem transformar o mar em divindade ou rival independente.
- issue: Sentido da cláusula final
  choice: Expressar que as ondas são detidas, registrando em nota a formulação hebraica mais literal.
  alternative: Traduzir literalmente com “serão postas/colocadas”, ainda que a expressão fique obscura em português.
  rationale: O contexto é inequívoco quanto à contenção do mar, mas a forma incomum do verbo merece ser preservada em nota, sem eliminar a tensão lexical do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta conserva o paralelismo enfático entre “até aqui” e “aqui”, bem como a personificação poética do mar.
