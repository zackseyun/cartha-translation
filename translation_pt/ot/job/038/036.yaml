  source_fidelity: 'A tradução mantém a estrutura interrogativa e o paralelismo do hebraico: “Quem pôs ... ou quem deu ...?”. “No íntimo” comunica de modo idiomático a referência difícil de בַּטֻּחוֹת sem alegar uma identificação anatômica indevida, e “à mente” é uma leitura contextual defensável para לַשֶּׂכְוִי. A nota preserva de forma explícita a alternativa antiga e plausível que entende o segundo termo como uma ave.'
