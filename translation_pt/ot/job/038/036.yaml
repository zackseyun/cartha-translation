  terminology: “Sabedoria” e “entendimento” correspondem bem a חָכְמָה e בִּינָה e preservam sua distinção. “Íntimo” e “mente” formam um paralelismo inteligível, enquanto a nota evita transformar uma opção lexical disputada em certeza.
