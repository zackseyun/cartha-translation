base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: pt
  text: Quem pôs sabedoria no íntimo[a], ou quem deu entendimento à mente?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Quem pôs sabedoria nas partes ocultas, ou quem deu entendimento ao galo?” Alguns entendem o segundo termo como referência a uma ave — tradicionalmente o galo e, às vezes, o íbis —, e não à mente.'
    reason: Registra uma alternativa lexical antiga e plausível para dois termos hebraicos de sentido incerto.
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz a pergunta retórica de Deus.
- source_word: שָׁת
  choice: pôs
  rationale: Expressa naturalmente a ideia de colocar ou depositar e forma bom paralelo com “deu”.
- source_word: בַּטֻּחוֹת
  choice: no íntimo
  rationale: O termo é difícil e provavelmente indica as partes interiores ou o ser interior; “no íntimo” preserva o sentido metafórico sem impor a tradução literal potencialmente enganosa “nos rins”.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e adequado ao paralelismo com “entendimento”.
- source_word: אוֹ
  choice: ou
  rationale: Conjunção disjuntiva que liga as duas orações paralelas.
- source_word: נָתַן
  choice: deu
  rationale: Tradução direta e natural, em paralelo com “pôs”.
- source_word: לַשֶּׂכְוִי
  choice: à mente
  rationale: O substantivo é muito discutido. O paralelismo com “no íntimo” e com “sabedoria” favorece a referência a uma faculdade interior, embora a possível referência a uma ave seja preservada em nota.
- source_word: בִינָה
  choice: entendimento
  rationale: Tradução usual que mantém sua relação semântica com “sabedoria”.
theological_decisions:
- issue: Interpretação de dois termos raros no contexto do discurso divino sobre a sabedoria
  choice: O versículo fala de sabedoria e entendimento concedidos ao ser interior humano.
  alternative: O versículo pode falar do conhecimento instintivo concedido a uma ave, tradicionalmente o galo e, às vezes, o íbis.
  rationale: A decisão é sobretudo lexical e contextual. O paralelismo poético favorece duas referências a faculdades interiores, mas a antiga e plausível leitura referente a uma ave deve permanecer visível na nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão. “No íntimo” soa natural no Brasil e em outros contextos lusófonos, preservando a imagem interior sem excessiva literalidade. A ambiguidade genuína do hebraico é mantida em nota.
