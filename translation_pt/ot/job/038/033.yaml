  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: pt
  text: Você conhece as leis dos céus? Pode estabelecer o domínio deles sobre a terra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu domínio” ou “sua autoridade”. O sufixo hebraico é singular (“seu”), provavelmente referindo-se coletivamente aos céus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Você conhece
  rationale: A partícula interrogativa com o perfeito qal de ידע expressa aqui uma pergunta sobre conhecimento presente. “Você conhece” é natural em português moderno e mantém a força do desafio divino.
- source_word: חֻקּוֹת
  choice: leis
  rationale: O substantivo designa determinações ou limites fixados. No contexto cósmico, “leis” comunica de modo claro a ordem estabelecida que rege os céus, sem restringir o termo à legislação humana.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: Preserva a forma plural e o registro cósmico do hebraico, sendo também uma expressão corrente e digna em português.
- source_word: אִם
  choice: Pode
  rationale: Aqui אִם introduz a segunda pergunta, paralela à primeira. A formulação “Pode...” transmite naturalmente em português o desafio retórico, em vez de uma tradução rígida como “se”.
- source_word: תָּשִׂים
  choice: estabelecer
  rationale: Embora o verbo tenha o sentido básico de pôr ou colocar, junto de מִשְׁטָר indica fazer vigorar ou estabelecer um domínio na esfera terrestre.
- source_word: מִשְׁטָרוֹ
  choice: o domínio deles
  rationale: מִשְׁטָר denota domínio, governo ou autoridade. “Domínio” preserva a ideia de poder governante; “deles” concorda naturalmente em português com “os céus”, enquanto a nota registra que o sufixo hebraico é formalmente singular.
- source_word: בָאָרֶץ
  choice: sobre a terra
  rationale: Neste contexto, a preposição situa a terra sob o domínio mencionado. “Sobre a terra” é idiomático em português e comunica essa relação de governo.
theological_decisions:
- issue: Natureza da ordem celeste mencionada
  choice: O versículo fala das leis cósmicas fixas e do domínio associado aos céus dentro da criação de Deus, sem especificar determinismo astrológico.
  alternative: Entender o texto como referência direta à influência astrológica das constelações sobre os acontecimentos terrestres.
  rationale: O contexto imediato trata dos astros e dos céus, mas os termos hebraicos ressaltam determinações fixas e domínio. A tradução mantém a linguagem de governo cósmico sem introduzir uma afirmação mais específica sobre causalidade astral.
- issue: Referente do sufixo singular em מִשְׁטָרוֹ
  choice: Tratá-lo no texto corrente como referente coletivo aos céus, com concordância portuguesa no plural.
  alternative: Traduzir literalmente por “seu domínio”, preservando o singular, mas criando em português possível ambiguidade com o interlocutor.
  rationale: O sufixo masculino singular provavelmente retoma “os céus” como uma realidade coletiva. “Deles” torna o referente claro e natural, enquanto a nota preserva a informação gramatical e as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Leis” evita o tom excessivamente jurídico ou arcaico de “estatutos” e “ordenanças”; “domínio” conserva a força governante do termo hebraico.
