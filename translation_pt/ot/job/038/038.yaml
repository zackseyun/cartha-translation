translation:
  language: pt
  text: quando o pó se torna uma massa compacta[a], e os torrões aderem uns aos outros?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando o pó é derramado para formar uma massa” / “quando o pó se torna duro como metal moldado”. O hebraico emprega a imagem de derramar ou moldar para descrever o solo tornando-se compacto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: quando ... se compacta
  rationale: A construção introduz uma circunstância temporal. O verbo evoca derramar ou fundir, mas, aplicado ao pó e em paralelo com os torrões que aderem, descreve naturalmente o solo que se torna compacto.
- source_word: עָפָר
  choice: o pó
  rationale: O termo designa pó ou terra solta; “o pó” preserva a imagem genérica e concreta do hebraico.
- source_word: לַמּוּצָק
  choice: numa massa
  rationale: O termo pode indicar algo derramado, fundido ou solidificado. Aqui, “numa massa” comunica o resultado da compactação sem tornar explícita demais a possível metáfora de metal fundido.
- source_word: וּרְגָבִים
  choice: e os torrões
  rationale: “Torrões” é a designação portuguesa natural para blocos ou aglomerados de terra.
- source_word: יְדֻבָּקוּ
  choice: se grudam uns aos outros
  rationale: A forma verbal indica que os torrões aderem ou ficam unidos. A expressão é clara, atual e conserva a imagem física.
