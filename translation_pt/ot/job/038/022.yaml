  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: pt
  text: Você já entrou nos depósitos da neve[a] ou viu os depósitos do granizo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tesouros da neve [...] tesouros do granizo”.'
