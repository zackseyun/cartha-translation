lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Você já entrou nos
  rationale: A partícula interrogativa com o perfeito de בוא introduz uma pergunta retórica. Em português, “entrar em” expressa naturalmente o movimento para dentro do lugar; “já” reforça o valor experiencial da pergunta sem alterar seu sentido.
- source_word: אֹצְרוֹת
  choice: depósitos
  rationale: אֹצָר pode designar tesouro, armazém ou depósito. “Depósitos” mantém a imagem concreta de reservas de fenômenos meteorológicos e é claro no português atual.
- source_word: שָׁלֶג
  choice: neve
  rationale: Equivalente meteorológico direto e corrente.
- source_word: וְאֹצְרוֹת
  choice: ou viu os depósitos
  rationale: Embora וְ seja normalmente aditivo, aqui liga os dois membros de uma pergunta retórica paralela. “Ou” produz coordenação natural em português sem apagar o paralelismo.
- source_word: בָּרָד
  choice: granizo
  rationale: Equivalente meteorológico direto e corrente.
- source_word: תִּרְאֶה
  choice: viu
  rationale: Embora a forma hebraica seja imperfeita, o contexto poético permite entendê-la em paralelo experiencial com o perfeito anterior. O pretérito perfeito é idiomático após “você já entrou” e preserva a pergunta sobre a experiência de Jó.
