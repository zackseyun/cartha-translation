  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: pt
  text: Onde você estava quando fundei a terra?[a] Diga, se é que você tem entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando lancei os fundamentos da terra”.'
    reason: Alternativa lexical que explicita a metáfora arquitetônica de יסד.
lexical_decisions:
- source_word: אֵיפֹה
  choice: Onde
  rationale: Advérbio interrogativo de lugar; a forma simples preserva a força direta do desafio divino.
- source_word: הָיִיתָ
  choice: você estava
  rationale: O perfeito qal na pergunta referente ao passado é expresso naturalmente em português pelo pretérito imperfeito.
- source_word: בְּיָסְדִי
  choice: quando fundei
  rationale: A preposição ב com infinitivo construto e sufixo de primeira pessoa tem valor temporal. “Fundei” conserva de modo conciso a metáfora arquitetônica de יסד.
- source_word: אָרֶץ
  choice: a terra
  rationale: O contexto cósmico da criação indica a terra, não uma região ou território específico.
- source_word: הַגֵּד
  choice: Diga
  rationale: O imperativo de נגד pede que Jó declare o que sabe. “Diga” é direto e natural; não se acrescenta um objeto indireto ausente no hebraico.
- source_word: אִם
  choice: se é que
  rationale: A partícula introduz um desafio condicional e retórico. “Se é que” comunica essa força sem converter a frase numa afirmação explícita.
- source_word: יָדַעְתָּ בִינָה
  choice: você tem entendimento
  rationale: A expressão literalmente associa o verbo “conhecer” a “entendimento”. Em português, “ter entendimento” é idiomático e mantém o sentido sapiencial de בינה.
theological_decisions:
- issue: Terminologia da criação no discurso divino
  choice: “quando fundei a terra”
  alternative: “quando lancei os fundamentos da terra”
  rationale: A formulação preserva Deus como aquele que estabeleceu a terra e mantém a metáfora arquitetônica, sem ampliar a imagem além do que está explicitamente expresso.
- issue: Força retórica da condição
  choice: “se é que você tem entendimento”
  alternative: “se você sabe discernir”
  rationale: A escolha conserva a ironia implícita no desafio de Deus sem transformar a condição em negação explícita nem resolver a tensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” torna o confronto direto e natural; “fundei” mantém concisão e solenidade moderada.
