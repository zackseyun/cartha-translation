  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: pt
  text: Em que foram afundadas as suas bases[a], ou quem assentou a sua pedra angular[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus fundamentos” ou “os seus encaixes”. O termo hebraico designa bases, pedestais ou suportes estruturais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem lançou a pedra do seu canto”; no contexto da construção, refere-se a assentar a pedra angular.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Sobre que
  rationale: Introduz naturalmente em português a pergunta pelo apoio ou fundamento, preservando a imagem arquitetônica.
- source_word: אֲדָנֶיהָ
  choice: as suas bases
  rationale: אֶדֶן pode indicar base, pedestal ou encaixe de fundação. “Bases” conserva a imagem concreta e é compreensível sem tecnicismo excessivo.
- source_word: הָטְבָּעוּ
  choice: foram afundadas
  rationale: O hofal de טָבַע expressa ação passiva de fazer afundar ou cravar. “Foram afundadas” preserva tanto a voz passiva quanto a força visual do verbo.
- source_word: אוֹ
  choice: ou
  rationale: Conjunção disjuntiva simples que liga as duas perguntas retóricas.
- source_word: מִי
  choice: quem
  rationale: Equivalente direto do pronome interrogativo hebraico.
- source_word: יָרָה
  choice: assentou
  rationale: Embora o verbo possa significar literalmente lançar ou atirar, no contexto da construção indica colocar a pedra em seu lugar; “assentou” é o verbo arquitetônico natural em português.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: a sua pedra angular
  rationale: A expressão significa literalmente “a pedra do seu canto”. “Pedra angular” é a forma arquitetônica consagrada em português e mantém o referente feminino à terra no contexto.
theological_decisions:
- issue: Metáfora arquitetônica da criação da terra
  choice: Manter as imagens concretas de bases e pedra angular.
  alternative: Parafrasear como “O que sustenta a terra?”
  rationale: A pergunta divina descreve poeticamente a terra como uma construção. Preservar essa metáfora respeita a poesia hebraica e evita convertê-la em explicação cosmológica abstrata.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo interrogativo e a metáfora de construção. “Assentou” oferece naturalidade técnica sem apagar o sentido literal, que é registrado em nota.
