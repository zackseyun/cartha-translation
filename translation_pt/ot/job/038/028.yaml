  text: הֲ/יֵשׁ לַ/מָּטָ֥ר אָ֑ב א֥וֹ מִי ה֝וֹלִ֗יד אֶגְלֵי טָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: pt
  text: Acaso a chuva tem pai, ou quem gerou as gotas de orvalho?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: Acaso a chuva tem
  rationale: A partícula interrogativa com יֵשׁ e a relação marcada por לְ formam uma pergunta de posse. Em português natural, “Acaso a chuva tem” preserva tanto a interrogação retórica quanto o sentido da construção hebraica.
- source_word: אָב
  choice: pai
  rationale: Mantém a imagem paterna literal e seu paralelismo com o verbo “gerou” na segunda metade do verso.
- source_word: אוֹ
  choice: ou
  rationale: Reproduz de modo direto a conjunção disjuntiva que liga as duas perguntas paralelas.
- source_word: מִי
  choice: quem
  rationale: Equivalente direto e natural do pronome interrogativo hebraico.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד significa gerar ou dar origem. “Gerou” é atual, digno e preserva a metáfora de procriação sem recorrer ao arcaísmo “engendrou”.
- source_word: אֶגְלֵי טָל
  choice: as gotas de orvalho
  rationale: Traduz de forma concreta e natural a construção nominal hebraica, preservando a imagem poética das gotas do orvalho.
theological_decisions:
- issue: Personificação da chuva e do orvalho
  choice: Preservar literalmente as imagens de pai e geração
  alternative: Explicitar Deus como fonte da chuva e do orvalho
  rationale: O hebraico formula perguntas poéticas sem nomear a resposta. A tradução mantém essa tensão retórica e não acrescenta uma identificação ausente do verso.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. “Acaso” sinaliza a força retórica da pergunta sem tornar a frase excessivamente coloquial; “gerou” conserva a imagem de filiação em linguagem corrente.
