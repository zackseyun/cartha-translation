translation:
  language: pt
  text: Cinja os lombos como um homem[a]; eu o interrogarei, e faça-me saber[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prepare-se resolutamente como um guerreiro”. O hebraico diz literalmente “cinja os seus lombos como um homem”, uma expressão de preparação para agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “responda-me”. O hebraico diz mais literalmente “faça-me saber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: Prepare-se com coragem
  rationale: A expressão hebraica literalmente manda cingir os lombos, imagem de quem prende a roupa à cintura para agir. A formulação portuguesa comunica preparação resoluta; “com coragem” preserva a força sugerida pela construção, sem usar o pouco natural “cingir os lombos” no texto principal.
- source_word: כְגֶבֶר
  choice: como homem
  rationale: גֶּבֶר designa um homem e pode salientar força ou valentia. Mantém-se a referência masculina explícita e a força desafiadora do símile.
- source_word: וְאֶשְׁאָלְךָ
  choice: eu o interrogarei
  rationale: שׁאל significa perguntar; neste desafio divino, “interrogar” expressa uma série incisiva de perguntas sem acrescentar uma moldura judicial obrigatória.
- source_word: וְהוֹדִיעֵנִי
  choice: você me fará saber
  rationale: O hifil de ידע significa literalmente “fazer saber”. A tradução preserva essa formulação mais precisa e sua tensão retórica, em vez de substituí-la diretamente por “responder”.
theological_decisions:
- issue: Expressão masculina no desafio divino
  choice: como homem
  alternative: como guerreiro
  rationale: O hebraico usa גֶּבֶר, termo masculino que pode conotar vigor. “Como homem” preserva a forma explícita sem converter a frase numa afirmação doutrinária sobre superioridade masculina; a nota esclarece o sentido idiomático.
- issue: Forma da resposta exigida por Deus
  choice: você me fará saber
  alternative: você me responderá
  rationale: A forma causativa do verbo ידע diz “fazer saber”. Preservá-la mantém a ironia e a tensão do desafio, sem explicar antecipadamente que se trata simplesmente de dar uma resposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de tratamento naturais para a leitura brasileira. A imagem hebraica literal foi preservada na nota, enquanto o texto principal traduz sua função idiomática. Todos os marcadores de nota aparecem no texto.
