lexical_decisions:
- source_word: כִּי
  choice: quando
  rationale: No encadeamento da pergunta retórica iniciada no versículo anterior, introduz a circunstância em que os leões aguardam a presa; o valor temporal é natural em português.
- source_word: יָשֹׁחוּ
  choice: se agacham
  rationale: Expressa o ato de baixar o corpo numa postura de caça; «agachar-se» é claro e idiomático no contexto animal.
- source_word: בַמְּעוֹנוֹת
  choice: em suas tocas
  rationale: מְעוֹנוֹת designa moradas ou covis; «tocas» comunica naturalmente os lugares onde os leões se abrigam. O possessivo é inferido pelo contexto.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: ficam à espreita
  rationale: A combinação do verbo «sentar/permanecer» com a expressão de finalidade «para emboscada» descreve idiomaticamente a ação de permanecer oculto aguardando a presa.
- source_word: בַסֻּכָּה
  choice: no esconderijo
  rationale: Neste contexto, סֻכָּה indica um lugar coberto e protegido, apropriado para uma emboscada, não uma cabana festiva. «Esconderijo» preserva essa função sem especificar indevidamente o tipo de cobertura.
