  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: pt
  text: para agarrar as extremidades da terra[a] e para que os perversos sejam sacudidos para fora dela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os confins da terra”. O hebraico diz literalmente “as asas da terra”, imagem poética que se refere às suas bordas ou extremidades.
    reason: lexical_alternative
  - marker: b
    text: A imagem é a da alvorada agarrando a terra e fazendo os perversos serem sacudidos para fora dela, como quem sacode o pó de uma roupa.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: para agarrar
  rationale: O infinitivo com לְ expressa propósito ou resultado em continuidade com o versículo anterior. “Agarrar” preserva a imagem concreta de tomar firmemente sem intensificá-la desnecessariamente.
- source_word: בְּכַנְפוֹת
  choice: as extremidades
  rationale: כָּנָף significa literalmente “asa”, mas, nesta expressão espacial, designa as bordas ou os confins da terra. “Extremidades” comunica a extensão exterior sem impor uma geometria literal.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: No contexto cósmico do discurso sobre a criação e a alvorada, a referência é à terra, não apenas a uma região ou território.
- source_word: וְיִנָּעֲרוּ
  choice: e ... sacudir
  rationale: O nifal hebraico descreve os perversos sendo sacudidos para fora. Em português, a coordenação ativa “e dela sacudir” retoma naturalmente o agente implícito do infinitivo anterior e conserva a imagem da remoção por sacudidela.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado designa pessoas moralmente más. “Os perversos” é claro, conciso e preserva a categoria moral do hebraico.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: O sufixo feminino singular retoma “a terra”. A colocação antes do verbo expressa com naturalidade a ideia de serem sacudidos para fora dela.
