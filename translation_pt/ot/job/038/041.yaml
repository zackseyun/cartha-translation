  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: pt
  text: Quem prepara para o corvo a sua presa quando seus filhotes clamam a Deus e vagueiam por falta de alimento?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “provê alimento para o corvo”. O verbo hebraico significa “deixar pronto” ou “prover”, e “presa” também pode ser traduzida de modo mais geral como “alimento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque seus filhotes clamam a Deus”. A conjunção também pode ser entendida em sentido causal (“porque”, “pois”), em vez de temporal (“quando”).'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “andam errantes” ou “perambulam”. O verbo hebraico pode indicar vaguear ou andar sem rumo à procura de alimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica no discurso de Deus.
- source_word: יָכִין
  choice: prepara
  rationale: O hifil de כון comunica a ideia de deixar pronto ou prover; “prepara” conserva o sentido concreto e soa natural em português.
- source_word: לָעֹרֵב
  choice: para o corvo
  rationale: A preposição indica o beneficiário; o singular definido funciona genericamente como representante da espécie.
- source_word: צֵידוֹ
  choice: a presa
  rationale: ציד pode designar caça, presa ou alimento obtido pela caça. “Presa” preserva a imagem animal concreta; o sufixo remete ao corvo, embora em português a relação já fique clara pelo contexto.
- source_word: כִּי
  choice: quando
  rationale: Aqui a conjunção pode introduzir a circunstância temporal em que se manifesta a necessidade dos filhotes; a alternativa causal é preservada em nota.
- source_word: ילדיו
  choice: seus filhotes
  rationale: O substantivo com sufixo refere-se às crias do corvo; “filhotes” é claro e idiomático em português.
- source_word: אֶל אֵל
  choice: a Deus
  rationale: אֵל é empregado aqui como designação comum de Deus, não exigindo transliteração como nome próprio.
- source_word: יְשַׁוֵּעוּ
  choice: clamam
  rationale: O piel de שוע denota clamar, especialmente em busca de auxílio; “clamam” mantém a força expressiva sem explicitar além do texto.
- source_word: יִתְעוּ
  choice: vagueiam
  rationale: O qal de תעה pode significar vagar ou andar errante; no contexto animal, “vagueiam” expressa a busca inquieta por alimento.
- source_word: לִבְלִי אֹכֶל
  choice: por falta de alimento
  rationale: A expressão indica privação e sugere a causa do vaguear; “alimento” evita a possível ambiguidade de “comida” como refeição preparada.
