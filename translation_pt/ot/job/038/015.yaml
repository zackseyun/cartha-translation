  text: וְ/יִמָּנַ֣ע מֵ/רְשָׁ אוֹרָ֑/ם וּ/זְר֥וֹעַ רָ֝מָ֗ה תִּשָּׁבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: pt
  text: A luz deles é retirada dos perversos, e o braço[a] erguido é quebrado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Braço” provavelmente simboliza aqui força ou poder, especialmente poder violento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será quebrado”. O imperfeito hebraico pode ser entendido tanto como futuro quanto como presente vívido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: é retirada
  rationale: O nifal imperfeito de מנע expressa que algo é impedido ou privado de alguém. A construção passiva preserva a forma hebraica e soa natural em português.
- source_word: מֵרְשָׁעִים
  choice: dos perversos
  rationale: 'A preposição מִן indica separação ou privação: a luz é retirada dos que praticam o mal. “Perversos” conserva a categoria moral sem especificar gênero.'
- source_word: אוֹרָם
  choice: A luz deles
  rationale: O substantivo com sufixo pronominal significa literalmente “a luz deles”, isto é, a luz de que os perversos desfrutariam; no contexto, a aurora expõe e frustra suas ações.
- source_word: וּזְרוֹעַ
  choice: e o braço
  rationale: זְרוֹעַ denota literalmente o braço e, por metáfora, força ou poder. Manter a imagem concreta preserva a poesia e permite que o leitor perceba seu sentido simbólico.
- source_word: רָמָה
  choice: erguido
  rationale: A forma de רום descreve o braço como levantado, imagem que pode sugerir poder arrogante ou violência pronta para agir. “Erguido” é atual e digno.
- source_word: תִּשָּׁבֵר
  choice: é quebrado
  rationale: O nifal imperfeito de שבר pode funcionar como presente vívido ou geral no discurso poético. A tradução passiva acompanha a descrição do efeito da aurora, sem excluir a possibilidade de valor futuro, indicada em nota.
theological_decisions:
- issue: Valor temporal de תִּשָּׁבֵר
  choice: 'presente vívido: “é quebrado”'
  alternative: 'futuro: “será quebrado”'
  rationale: O imperfeito hebraico admite ambos os valores. O presente combina melhor com a descrição poética imediata, enquanto a alternativa futura é preservada em nota para não eliminar a ambiguidade.
- issue: Sentido figurado de “braço”
  choice: manter a imagem literal no texto
  alternative: explicitar como “força” ou “poder”
  rationale: O braço provavelmente simboliza força, sobretudo poder violento, mas traduzir diretamente pela interpretação reduziria a força poética e resolveria uma metáfora que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e as imagens poéticas do hebraico foram preservadas sem tornar a frase artificial.
