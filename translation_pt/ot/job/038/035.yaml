  text: הַֽ/תְשַׁלַּ֣ח בְּרָקִ֣ים וְ/יֵלֵ֑כוּ וְ/יֹאמְר֖וּ לְ/ךָ֣ הִנֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: pt
  text: 'Você pode enviar os relâmpagos[a], para que eles vão e lhe digam: “Aqui estamos”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os raios”. O hebraico usa o plural e retrata os relâmpagos como mensageiros obedientes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Você pode enviar
  rationale: A partícula interrogativa com o hifil imperfeito de שׁלח introduz uma pergunta retórica dirigida a Jó. “Você pode enviar” comunica tanto a pergunta quanto o desafio implícito à sua capacidade.
- source_word: בְּרָקִים
  choice: os relâmpagos
  rationale: O substantivo está no plural e designa relâmpagos ou raios. “Os relâmpagos” é natural em português, conserva o plural hebraico e permite manter a personificação subsequente.
- source_word: וְיֵלֵכוּ
  choice: para que eles vão
  rationale: O waw seguido do imperfeito dá continuidade à sequência de finalidade ou resultado após “enviar”. A formulação explicita essa relação de modo natural sem eliminar a coordenação poética.
- source_word: וְיֹאמְרוּ
  choice: e lhe digam
  rationale: Mantém a imagem personificada dos relâmpagos como mensageiros que se movem e respondem ao chamado.
- source_word: לְךָ
  choice: lhe
  rationale: Representa de modo idiomático o dativo singular dirigido a Jó.
- source_word: הִנֵּנוּ
  choice: Aqui estamos
  rationale: É a resposta idiomática de quem se apresenta pronto e disponível, preservando a prontidão e a obediência sugeridas pelo hebraico sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Personificação dos relâmpagos no discurso divino
  choice: 'Conservar a imagem em que os relâmpagos vão e dizem: “Aqui estamos”.'
  alternative: Descrever apenas fenômenos naturais submetidos ao controle de Deus, sem personificação.
  rationale: O hebraico atribui explicitamente movimento e fala aos relâmpagos, retratando-os poeticamente como mensageiros obedientes. Manter essa figura comunica o domínio de Deus sobre a criação sem afirmar que os relâmpagos tenham consciência literal.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A personificação poética e a força retórica da pergunta foram preservadas.
