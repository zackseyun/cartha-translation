  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: pt
  text: Quem pode contar as nuvens com sabedoria, e quem pode virar os odres do céu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os jarros do céu”. O hebraico retrata a chuva como estando em recipientes no céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem pode
  rationale: O pronome interrogativo introduz uma pergunta retórica; com o verbo no imperfeito, “quem pode” expressa naturalmente em português a ideia de capacidade.
- source_word: יְסַפֵּר
  choice: contar
  rationale: O piel de ספר significa aqui contar ou numerar, em referência às nuvens.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: Neste contexto meteorológico e poético, o termo designa as nuvens, embora em outros contextos possa se referir ao céu.
- source_word: בְּחָכְמָה
  choice: com sabedoria
  rationale: Preserva o valor instrumental ou modal da preposição ב e a formulação poética do hebraico.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: e os odres do céu
  rationale: נֵבֶל pode designar um odre ou outro recipiente. “Odres do céu” conserva a metáfora concreta de recipientes celestes que contêm a chuva sem acrescentar “água”, ausente do texto.
- source_word: יַשְׁכִּיב
  choice: virar
  rationale: O hifil de שכב significa literalmente “fazer deitar”. Aplicado a recipientes, sugere incliná-los ou virá-los para derramar o conteúdo; “virar” preserva essa imagem sem explicitar além do texto o ato de derramar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Odres” mantém a imagem antiga do recipiente; a nota oferece a alternativa mais imediatamente compreensível “jarros”.
