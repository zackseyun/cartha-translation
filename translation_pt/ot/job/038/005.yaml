lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz a pergunta retórica divina.
- source_word: שָׂם
  choice: determinou
  rationale: O verbo שׂים pode significar pôr, fixar ou estabelecer; aqui, na imagem de construção, 'determinou' expressa naturalmente o estabelecimento das dimensões da terra.
- source_word: מְמַדֶּיהָ
  choice: as suas dimensões
  rationale: O plural com sufixo feminino singular refere-se à terra no contexto e designa suas medidas ou dimensões.
- source_word: כִּי תֵדָע
  choice: se é que você sabe
  rationale: Preserva a formulação condicional e comunica em português a ironia da pergunta retórica, sem convertê-la numa afirmação explícita.
- source_word: אוֹ
  choice: Ou
  rationale: Conjunção disjuntiva que liga as duas perguntas paralelas.
- source_word: נָטָה
  choice: estendeu
  rationale: Na linguagem de construção, descreve o ato de esticar ou estender uma linha para medir.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: Mantém a relação espacial e o antecedente feminino, a terra.
- source_word: קָּו
  choice: a linha de medir
  rationale: No contexto de construção, קו designa uma linha ou cordel usado para medição; a explicitação evita que 'linha' pareça abstrata em português.
theological_decisions:
- issue: Força retórica de כִּי תֵדָע
  choice: se é que você sabe
  alternative: pois você sabe / certamente você sabe
  rationale: A tradução escolhida mantém a aparente condição e, ao mesmo tempo, deixa perceptível a ironia divina, sem resolver a construção como uma declaração direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'você' para a interpelação singular. A imagem arquitetônica é preservada; 'linha de medir' torna explícita a função de קו. O marcador [a] aparece no texto principal.
