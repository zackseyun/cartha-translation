base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: pt
  text: Você pode erguer a voz para a nuvem[a], para que uma abundância de água cubra você[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as nuvens” ou “para a nuvem espessa”. O substantivo hebraico está no singular e pode destacar uma densa nuvem de chuva.
    reason: lexical_alternative
  - marker: b
    text: Ou “e uma profusão de águas cubra você”. A expressão hebraica pode sugerir abundância transbordante, e a conjunção também pode ser entendida de maneira mais coordenada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Você pode erguer
  rationale: A forma interrogativa do hifil de רוּם questiona a capacidade de levantar ou erguer. “Você pode erguer” conserva o desafio retórico e soa natural em português.
- source_word: לָעָב
  choice: para a nuvem
  rationale: עָב pode designar uma nuvem ou massa espessa de nuvens. O singular “a nuvem” reproduz o número do hebraico sem excluir o sentido coletivo.
- source_word: קוֹלֶךָ
  choice: a voz
  rationale: קוֹל significa normalmente “voz” quando se trata de falar ou chamar; o possessivo está expresso em português pela construção “erguer a voz” dirigida ao interlocutor.
- source_word: וְשִׁפְעַת מַיִם
  choice: para que uma abundância de água
  rationale: שִׁפְעָה indica abundância, profusão ou transbordamento. “Uma abundância de água” preserva a ênfase quantitativa sem impor a ideia de uma inundação destrutiva; “para que” explicita a relação provável de resultado.
- source_word: תְּכַסֶּךָּ
  choice: cubra você
  rationale: O piel de כסה significa “cobrir”. A forma verbal permanece no singular, concordando com “abundância”, e “você” representa de modo claro o sufixo de segunda pessoa masculina singular.
theological_decisions:
- issue: Relação entre as duas orações
  choice: 'A segunda oração expressa o resultado pretendido da primeira: erguer a voz para a nuvem a fim de ser coberto por água abundante.'
  alternative: 'A segunda oração pode ser coordenada de modo mais direto: “e uma abundância de água cubra você”.'
  rationale: O contexto apresenta uma pergunta retórica sobre a incapacidade humana de comandar o clima. “Para que” torna natural em português a relação de resultado sugerida, enquanto a nota preserva a possível leitura coordenada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Erguer a voz” mantém a imagem hebraica em formulação idiomática; o singular “nuvem” preserva de perto a forma do texto-fonte.
