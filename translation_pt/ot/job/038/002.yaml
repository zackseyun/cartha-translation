lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é este
  rationale: A combinação do interrogativo com o demonstrativo introduz um desafio enfático. A formulação é natural em português e mantém a força confrontadora.
- source_word: מַחְשִׁיךְ
  choice: obscurece
  rationale: Preserva a metáfora hebraica de tornar algo escuro ou difícil de perceber, sem substituí-la por uma explicação interpretativa como “confunde”.
- source_word: עֵצָה
  choice: conselho
  rationale: O termo pode indicar conselho, plano ou propósito. “Conselho” conserva melhor sua amplitude sem definir de modo excessivo se a referência principal é à sabedoria deliberativa ou à intenção divina.
- source_word: בְמִלִּין
  choice: com palavras
  rationale: 'A preposição tem valor instrumental: as palavras são o meio pelo qual o conselho é obscurecido. “Com palavras” é claro e idiomático em português.'
- source_word: בְּלִי דָעַת
  choice: sem conhecimento
  rationale: Reproduz diretamente a expressão hebraica e evita reduzi-la a um advérbio interpretativo ou trocar “conhecimento” por “entendimento”.
theological_decisions:
- issue: Sentido de עֵצָה no discurso divino
  choice: conselho
  alternative: plano; propósito
  rationale: No contexto, Deus repreende palavras que obscurecem a verdadeira sabedoria e talvez também a intenção divina. “Conselho” mantém abertas essas possibilidades sem impor uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do hebraico foram preservadas sem produzir uma construção artificial.
