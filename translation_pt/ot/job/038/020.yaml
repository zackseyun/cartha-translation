  text: para que a leves até o seu limite[a] e compreendas as veredas para a sua casa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os pronomes «a» e «seu» retomam o antecedente singular do contexto: a luz ou a escuridão nas perguntas paralelas de Jó 38:19–20.'
