lexical_decisions:
- source_word: כִּי
  choice: para que
  rationale: Neste contexto de pergunta retórica, introduz uma ideia de finalidade ou resultado e se liga naturalmente à pergunta do versículo anterior.
- source_word: תִקָּחֶנּוּ
  choice: a leves
  rationale: O imperfeito de segunda pessoa masculina singular com sufixo de objeto pode ser entendido de modo final neste contexto. O pronome remete à luz ou à escuridão mencionada no paralelismo anterior.
- source_word: אֶל גְּבוּלוֹ
  choice: até o seu limite
  rationale: גְּבוּל denota limite ou fronteira. «Limite» conserva a imagem espacial sem sugerir necessariamente um território político.
- source_word: וְכִי
  choice: e
  rationale: A conjunção liga a segunda oração paralela à primeira; em português, a finalidade já expressa por «para que» rege naturalmente os dois verbos.
- source_word: תָבִין
  choice: compreendas
  rationale: בין comunica entendimento ou discernimento. «Compreendas» é corrente e mantém a ideia de conhecer como se chega ao lugar descrito.
- source_word: נְתִיבוֹת
  choice: as veredas
  rationale: O termo designa caminhos, trilhas ou veredas. «Veredas» preserva a concretude e o tom poético.
- source_word: בֵּיתוֹ
  choice: a sua casa
  rationale: בַּיִת significa literalmente «casa». A escolha conserva a personificação poética da luz ou da escuridão como tendo morada própria.
theological_decisions:
- issue: Referente dos pronomes singulares
  choice: Preservar a referência ambígua à luz ou à escuridão
  alternative: Identificar explicitamente apenas a luz ou apenas a escuridão
  rationale: A forma singular depende das perguntas paralelas de Jó 38:19–20, e o hebraico não elimina de modo inequívoco a tensão entre os dois possíveis antecedentes.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção «para que... e...» mantém o paralelismo sem repetir desnecessariamente a conjunção final; «veredas» conserva a imagem poética concreta.
