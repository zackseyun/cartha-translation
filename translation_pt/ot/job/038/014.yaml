  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: pt
  text: A terra se transforma como barro sob um selo[a], e se apresentam como uma veste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A terra vira-se como barro sob um selo”. O verbo hebraico também pode ser entendido mais literalmente como “vira-se” ou “é virada”.'
    reason: lexical_alternative
  - marker: b
    text: O sujeito do verbo plural não é expresso no hebraico. Provavelmente são os aspectos ou contornos da terra que se tornam distintos à luz da aurora.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: se transforma
  rationale: O hitpael de הפך exprime mudança ou transformação, mantendo aqui um valor reflexivo/passivo sem definir de modo excessivo o processo.
- source_word: כְּחֹמֶר
  choice: como barro
  rationale: חֹמֶר designa barro ou argila; “barro” é corrente e comunica naturalmente a imagem de uma superfície que recebe uma impressão.
- source_word: חוֹתָם
  choice: sob um selo
  rationale: A construção hebraica é elíptica. “Sob um selo” explicita com moderação a imagem do barro pressionado por um selo.
- source_word: וְיִתְיַצְּבוּ
  choice: se apresentam
  rationale: O verbo plural descreve algo que surge ou assume forma visível. “Se apresentam” preserva o plural e evita introduzir no texto um sujeito que o hebraico deixa implícito.
- source_word: כְּמוֹ לְבוּשׁ
  choice: como uma veste
  rationale: לְבוּשׁ significa veste ou roupa. O singular poético é preservado, sem explicar se a comparação evoca contornos, pregas ou ornamentação.
