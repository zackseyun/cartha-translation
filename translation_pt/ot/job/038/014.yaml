translation_notes:
  register: Português moderno, poético e digno. “A terra” explicita o sujeito feminino subentendido pelo contexto e pela forma verbal hebraica. A ausência de sujeito expresso na segunda oração preserva a mudança para o plural e a ambiguidade do original.
