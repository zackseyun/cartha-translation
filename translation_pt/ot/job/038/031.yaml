base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: pt
  text: Você pode atar as correntes das Plêiades[a][b] ou soltar as cordas de Órion?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faixas” nos dois termos ligados à ideia de prender; o hebraico emprega duas imagens relacionadas de vínculos ou ligações celestes.
    reason: lexical_alternative
  - marker: b
    text: Algumas traduções tradicionais vertem מַעֲדַנּוֹת como “doces influências”, mas é mais provável que o hebraico se refira a laços, faixas ou correntes.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל provavelmente designa aqui a constelação de Órion; em outros contextos, a palavra pode significar “tolo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: Você pode atar
  rationale: A partícula interrogativa com o piel imperfeito na segunda pessoa introduz uma pergunta retórica sobre a incapacidade humana. “Atar” é natural em português e mantém a imagem concreta de prender ou ligar.
- source_word: מַעֲדַנּוֹת
  choice: as correntes
  rationale: O substantivo raro provavelmente indica laços, faixas ou vínculos. Em paralelo com “cordas” e junto de “atar”, “correntes” comunica claramente a ideia de ligações ou restrições, sem seguir a interpretação tradicional menos provável de “doces influências”.
- source_word: כִּימָה
  choice: as Plêiades
  rationale: O nome astronômico é tradicionalmente identificado com o aglomerado estelar das Plêiades; emprega-se seu nome corrente em português.
- source_word: מֹשְׁכוֹת
  choice: as cordas
  rationale: O termo designa algo estendido ou usado para puxar, daí “cordas” ou “faixas”. “Cordas” é concreto, claro e adequado ao paralelismo.
- source_word: כְּסִיל
  choice: Órion
  rationale: Neste contexto astronômico, em paralelo com as Plêiades, a palavra é tradicionalmente entendida como o nome da constelação de Órion, embora como substantivo comum possa significar “tolo”.
- source_word: תְּפַתֵּחַ
  choice: soltar
  rationale: Embora o verbo tenha o sentido básico de “abrir”, com “cordas” significa idiomaticamente soltá-las ou desatá-las. “Soltar” preserva a imagem e contrasta naturalmente com “atar”.
