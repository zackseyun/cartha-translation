  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: pt
  text: para fazer chover sobre uma terra onde não há homem[a], sobre um deserto em que não há ser humano,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde não há ninguém”. O hebraico emprega aqui אִישׁ (“homem”) e, no segundo membro, o termo relacionado mas distinto אָדָם (“ser humano, humanidade”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: fazer chover
  rationale: O infinitivo causativo (hifil) de מטר indica fazer a chuva cair. “Fazer chover” é natural em português e preserva o valor causativo.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica a superfície ou região que recebe a chuva; “sobre” é corrente e adequado ao paralelismo poético.
- source_word: אֶרֶץ
  choice: uma terra
  rationale: No contexto, designa uma extensão de terra, não o planeta inteiro. A forma indefinida corresponde bem ao hebraico sem artigo.
- source_word: לֹא אִישׁ
  choice: onde não há homem
  rationale: אִישׁ é o termo singular comum para “homem”. A construção existencial portuguesa transmite com naturalidade a ausência de habitantes e mantém a distinção lexical do segundo membro.
- source_word: מִדְבָּר
  choice: um deserto
  rationale: מִדְבָּר designa uma região erma e não cultivada; “deserto” é a opção mais natural e amplamente compreensível em português, sem exigir que se trate de areia.
- source_word: לֹא אָדָם בּוֹ
  choice: em que não há ser humano
  rationale: אָדָם tem aqui sentido humano genérico. “Ser humano” preserva esse alcance e distingue o termo do אִישׁ do membro anterior; “em que” incorpora naturalmente o pronome בּוֹ.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: ser humano
  alternative: homem; humanidade
  rationale: O contexto fala da ausência de qualquer pessoa. “Ser humano” conserva o sentido genérico sem apagar a diferença entre אָדָם e o אִישׁ precedente.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém-se a estrutura paralela do hebraico e a distinção entre אִישׁ e אָדָם.
