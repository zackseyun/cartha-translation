base_translation:
  language: en
  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: pt
  text: As águas ficam duras como pedra[a], e a superfície do abismo se congela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “As águas se escondem como pedra”. O verbo hebraico é incomum neste contexto e parece retratar as águas recolhendo-se ou ficando ocultas num estado endurecido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fica presa” ou “se solidifica”. O verbo hebraico descreve algo que é apanhado, preso ou unido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: como pedra
  rationale: A preposição כ introduz uma comparação. “Como pedra” conserva a imagem de dureza sem afirmar literalmente que a água se transforma em pedra.
- source_word: מַיִם
  choice: as águas
  rationale: Embora possa funcionar como substantivo de massa, a forma plural combina com o cenário cósmico e poético do discurso.
- source_word: יִתְחַבָּאוּ
  choice: ficam duras
  rationale: O sentido usual do verbo é “esconder-se”, mas, junto de “como pedra” e do paralelismo com a superfície do abismo que se prende ou congela, descreve aqui as águas endurecidas pelo frio. A tradução literal e a dificuldade lexical são preservadas em nota.
- source_word: וּפְנֵי
  choice: e a superfície de
  rationale: Literalmente “e a face de”; em referência a uma massa de água, “superfície” expressa naturalmente o sentido contextual.
- source_word: תְהוֹם
  choice: o abismo
  rationale: “Abismo” comunica a grande massa de águas profundas evocada por תְהוֹם e mantém o tom poético. “As profundezas” também seria possível.
- source_word: יִתְלַכָּדוּ
  choice: se congela
  rationale: O verbo denota ser apanhado, preso ou unido. No contexto do frio e do gelo, “se congela” comunica com clareza o efeito físico, enquanto a imagem verbal mais literal é registrada em nota.
