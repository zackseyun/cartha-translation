  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: pt
  text: Se alguém se aventurar a dizer uma palavra a você[a], você se cansará? Mas quem consegue conter as palavras?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se alguém tentar tratar de um assunto com você”.'
    reason: דָבָר também pode significar “assunto”, e הֲנִסָּה pode ser traduzido de maneira menos figurada como “tentar”.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: se alguém se aventurar
  rationale: O verbo נסה, aqui introduzido pela partícula interrogativa, expressa a tentativa cautelosa de falar. “Aventurar-se” comunica a hesitação de Elifaz sem sugerir que ele esteja pondo Jó à prova.
- source_word: דָבָר
  choice: dizer uma palavra
  rationale: דָבָר pode significar “palavra”, “assunto” ou “coisa”. No contexto, o sentido de fala é proeminente e cria uma ligação com “palavras” na segunda oração.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: Preserva a direção interpessoal do hebraico e é natural em português na construção “dizer uma palavra a você”.
- source_word: תִּלְאֶה
  choice: você se cansará
  rationale: Traduz diretamente a ideia de ficar cansado ou fatigado. No contexto, pode indicar enfado diante da fala, mas a tradução não limita o termo a impaciência ou irritação.
- source_word: וַעְצֹר
  choice: conter
  rationale: עצר significa deter, reter ou refrear. “Conter” expressa de modo conciso a incapacidade retórica de deixar de falar.
- source_word: בְּמִלִּין
  choice: as palavras
  rationale: Mantém o plural aramaizante do texto e o eco deliberado de דָבָר na primeira oração.
- source_word: מִי יוּכָל
  choice: quem consegue
  rationale: Forma portuguesa corrente para a pergunta retórica de capacidade, equivalente a “quem é capaz?”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “palavra/palavras” preserva a ligação lexical do hebraico, enquanto a nota mantém a ambiguidade entre fala e assunto.
