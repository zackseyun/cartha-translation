  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: pt
  text: Então um espírito passou diante do meu rosto[a]; os pelos do meu corpo se eriçaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um vento” ou “um sopro passou diante do meu rosto”. A palavra hebraica רוּחַ pode significar “espírito”, “vento” ou “sopro”; neste contexto, “espírito” parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: um espírito
  rationale: רוּחַ pode significar “espírito”, “vento” ou “sopro”. Neste contexto de uma presença misteriosa que provoca temor, “espírito” expressa melhor o sentido provável, sem tornar a referência definida.
- source_word: עַל פָּנַי
  choice: diante do meu rosto
  rationale: Embora a expressão seja literalmente “sobre o meu rosto”, em combinação com יַחֲלֹף indica movimento diante da face do falante. A tradução conserva a imagem concreta do hebraico.
- source_word: יַחֲלֹף
  choice: passou
  rationale: O verbo חלף significa passar ou passar adiante. “Passou diante do meu rosto” comunica de modo natural o movimento descrito.
- source_word: תְּסַמֵּר
  choice: se eriçaram
  rationale: O verbo descreve o ato de tornar rígido ou pôr em pé. Referindo-se aos pelos, “se eriçaram” é vívido e idiomático em português.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: os pelos do meu corpo
  rationale: A expressão significa literalmente “o pelo da minha carne”. “Os pelos do meu corpo” mantém o sentido físico e é mais natural no português moderno.
theological_decisions: []
