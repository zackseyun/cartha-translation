source:
  edition: WLC
  text: אַ֤ף שֹׁכְנֵ֬י בָֽתֵּי חֹ֗מֶר אֲשֶׁר בֶּ/עָפָ֥ר יְסוֹדָ֑/ם יְ֝דַכְּא֗וּ/ם לִ/פְנֵי עָֽשׁ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: pt
  text: quanto mais os que habitam em casas de barro[a], cujo alicerce está no pó e são esmagados mais depressa do que uma traça[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até mesmo os que habitam em casas de barro”. A partícula hebraica pode significar mais literalmente “até mesmo” ou “de fato”, mas aqui provavelmente intensifica a comparação com o versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante de uma traça”. A expressão hebraica é ambígua e pode indicar a rapidez ou a facilidade com que os seres humanos perecem; também pode ser entendida como “mais facilmente do que uma traça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: quanto mais
  rationale: 'No contexto da comparação iniciada no versículo anterior, a partícula intensifica a conclusão: se Deus encontra falhas em seus servos, isso se aplica ainda mais aos seres humanos frágeis.'
- source_word: שֹׁכְנֵי
  choice: os que habitam
  rationale: O particípio expressa habitação contínua e mantém a imagem poética com linguagem natural em português.
- source_word: בָתֵּי חֹמֶר
  choice: casas de barro
  rationale: A expressão designa moradias feitas de argila ou terra e funciona aqui como metáfora da fragilidade mortal humana.
- source_word: בֶּעָפָר
  choice: no pó
  rationale: Preserva a imagem literal e sua associação bíblica com a origem e a mortalidade humanas.
- source_word: יְסוֹדָם
  choice: cujo alicerce
  rationale: Traduz o substantivo singular com sufixo plural e liga de modo natural o alicerce aos habitantes descritos pela metáfora.
- source_word: יְדַכְּאוּם
  choice: são esmagados
  rationale: O verbo Piel exprime esmagamento. A forma passiva em português evita acrescentar um agente que não está identificado no hebraico.
- source_word: לִפְנֵי עָשׁ
  choice: diante de uma traça
  rationale: Mantém o sentido formal e a ambiguidade da expressão poética, que também pode indicar que os humanos são destruídos mais depressa ou mais facilmente do que uma traça.
theological_decisions:
- issue: Referência metafórica de “casas de barro”
  choice: Manter a metáfora como descrição da fragilidade mortal dos seres humanos, provavelmente com alusão ao corpo e à existência terrena.
  alternative: Entender primeiramente como referência literal a casas de adobe, dentro de uma imagem mais ampla da vulnerabilidade humana.
  rationale: O contexto contrasta seres celestiais e humanos e enfatiza a mortalidade. A tradução conserva a imagem sem fixar sua explicação no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Alicerce” é mais corrente que “fundamento” para a imagem de uma casa, e “barro” comunica de modo acessível a fragilidade da argila. A construção preserva a ambiguidade da frase final.
