base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: pt
  text: 'Ela ficou parada[a], mas eu não pude reconhecer sua aparência. Uma forma estava diante dos meus olhos; houve silêncio[b], e ouvi uma voz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele ficou parado». O sufixo hebraico em «sua aparência» é masculino singular, mas o referente continua sendo uma aparição não identificada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «houve quietude». O termo hebraico pode indicar tanto silêncio como uma calma profunda e sem ruído.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: parou
  rationale: O verbo עמד significa ficar de pé, permanecer ou deter-se. No contexto da visão, «parou» comunica com naturalidade que a aparição se deteve diante do narrador.
- source_word: וְלֹא אַכִּיר
  choice: mas eu não pude reconhecer
  rationale: O hifil de נכר significa reconhecer ou identificar. «Mas» explicita o contraste contextual entre a presença visível e a incapacidade de identificá-la, enquanto «não pude reconhecer» expressa o valor prático da frase.
- source_word: מַרְאֵהוּ
  choice: sua aparência
  rationale: מַרְאֶה designa aparência ou aspecto visível. «Sua» preserva em português a ambiguidade quanto ao caráter pessoal da figura, embora não marque o gênero masculino do sufixo hebraico.
- source_word: תְּמוּנָה
  choice: uma forma
  rationale: תְּמוּנָה pode indicar forma, imagem ou semelhança. «Uma forma» convém à percepção visual indistinta descrita no verso.
- source_word: לְנֶגֶד עֵינָי
  choice: estava diante dos meus olhos
  rationale: A expressão significa literalmente «diante dos meus olhos»; a formulação conserva a vivacidade da imagem e soa natural em português.
- source_word: דְּמָמָה
  choice: houve silêncio
  rationale: דְּמָמָה pode denotar silêncio, quietude ou calma profunda. «Houve silêncio» forma uma oração natural e mantém a pausa inquietante antes da voz.
- source_word: וָקוֹל אֶשְׁמָע
  choice: e ouvi uma voz
  rationale: קוֹל pode significar voz ou som. Como o verso seguinte apresenta palavras faladas, «voz» é a escolha contextual mais adequada.
theological_decisions:
- issue: Identidade e gênero da aparição
  choice: Uso de «ela» para retomar a aparição implícita, sem identificá-la como pessoa masculina
  alternative: «Ele ficou parado» ou uma construção sem pronome
  rationale: O sufixo hebraico é masculino singular, mas o referente continua sendo uma aparição não identificada. Em português, o feminino gramatical de «aparição» permite uma referência natural sem decidir que se trata de um ser masculino; a nota registra a alternativa formal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação conserva a progressão da visão e os dois-pontos introduzem a fala do verso seguinte.
