  text: הַֽ֭/אֱנוֹשׁ מֵ/אֱל֣וֹהַ יִצְדָּ֑ק אִ֥ם מֵ֝/עֹשֵׂ֗/הוּ יִטְהַר גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: pt
  text: Pode um mortal ser justo diante de Deus? Pode um homem ser puro diante de seu Criador?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Pode um mortal ser mais justo do que Deus? Pode um homem ser mais puro do que seu Criador?”'
    reason: Leitura alternativa da construção hebraica com a preposição מן, que pode ter sentido comparativo.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: o ser humano mortal
  rationale: אֱנוֹשׁ designa o ser humano e frequentemente ressalta sua fragilidade e mortalidade. A expressão é natural em português e mantém o contraste com Deus.
- source_word: מֵאֱלוֹהַ
  choice: diante de Deus
  rationale: Com יִצְדָּק, מן pode expressar comparação ou relação. “Diante de Deus” comunica de modo idiomático a posição do ser humano perante Deus, sem eliminar a leitura comparativa, registrada em nota.
- source_word: יִצְדָּק
  choice: ser justo
  rationale: O verbo צדק indica ser ou mostrar-se justo, estar com a razão. “Ser justo” preserva de modo conciso seu sentido moral e forense no paralelismo.
- source_word: אִם
  choice: Será que
  rationale: Aqui אִם introduz a segunda pergunta retórica. A repetição de “Será que” explicita o paralelismo com naturalidade em português.
- source_word: מֵעֹשֵׂהוּ
  choice: diante daquele que o fez
  rationale: O particípio com sufixo significa literalmente “aquele que o fez” ou “seu Criador”. A formulação escolhida é clara, digna e mantém o vínculo verbal direto com o ato de criar.
- source_word: יִטְהַר
  choice: ser puro
  rationale: טהר denota pureza ou limpeza. “Ser puro” corresponde ao sentido moral e espiritual sugerido por seu paralelo com צדק.
- source_word: גָּבֶר
  choice: um homem
  rationale: גָּבֶר é um substantivo masculino singular para homem, por vezes associado à força ou maturidade masculina. Aqui funciona em paralelo com אֱנוֹשׁ, e “um homem” evita acrescentar uma ênfase ausente no contexto.
theological_decisions:
- issue: A condição humana em relação a Deus
  choice: O verso formula perguntas retóricas sobre a possibilidade de um mortal ser justo ou puro diante de Deus.
  alternative: O verso pergunta se um ser humano pode ser mais justo do que Deus ou mais puro do que aquele que o fez.
  rationale: A preposição מן admite uma leitura relacional (“diante de”) ou comparativa (“mais ... do que”). O texto principal usa a expressão mais natural no contexto, enquanto a nota conserva a ambiguidade real do hebraico sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Será que” dá naturalidade às perguntas retóricas; “ser humano mortal” preserva a fragilidade evocada por אֱנוֹשׁ. O paralelismo poético e a ambiguidade comparativa/relacional foram mantidos por meio da nota.
