  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: pt
  text: Pelo que tenho visto, os que aram a maldade[a] e semeiam sofrimento[b] colhem isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “iniquidade”. O termo hebraico pode indicar maldade moral e, em certos contextos, adversidade ou dano.
    reason: lexical_alternative
  - marker: b
    text: Ou “desgraça” ou “dano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Conforme
  rationale: Introduz a observação baseada na experiência de Elifaz. “Conforme tenho visto” é natural em português e mantém a relação comparativa do hebraico.
- source_word: רָאִיתִי
  choice: tenho visto
  rationale: O perfeito na primeira pessoa expressa uma observação adquirida pela experiência; o pretérito perfeito composto comunica aqui uma experiência reiterada ou acumulada.
- source_word: חֹרְשֵׁי
  choice: os que aram
  rationale: O particípio substantivado designa pessoas e preserva de modo claro a metáfora agrícola.
- source_word: אָוֶן
  choice: maldade
  rationale: Neste paralelismo, o termo tem forte sentido moral. “Maldade” é corrente e digna, sem a tonalidade excessivamente técnica ou arcaizante de “iniquidade”.
- source_word: וְזֹרְעֵי
  choice: e semeiam
  rationale: Mantém a coordenação e a metáfora agrícola sem repetir desnecessariamente “os que”.
- source_word: עָמָל
  choice: sofrimento
  rationale: O termo pode indicar sofrimento, desgraça, dano ou penosa aflição. “Sofrimento” preserva aqui a ideia de mal nocivo produzido pelos agentes, sem reduzi-la a mero esforço.
- source_word: יִקְצְרֻהוּ
  choice: colhem isso
  rationale: Preserva a metáfora de semear e colher. “Isso” retoma coletivamente a maldade e o sofrimento mencionados, conforme o sufixo masculino singular hebraico.
theological_decisions:
- issue: Causalidade moral no discurso de Elifaz
  choice: Apresentar diretamente o princípio que Elifaz afirma ter observado, sem qualificá-lo na tradução.
  alternative: Transformá-lo numa doutrina absoluta de retribuição ou suavizá-lo como mera tendência geral.
  rationale: O versículo integra o argumento de Elifaz. A tradução deve conservar a força de sua alegação sem fazê-la passar, por acréscimos interpretativos, pelo veredito teológico final do livro.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo e a metáfora agrícola foram preservados; “maldade” evita arcaísmo, e as notas mantêm a amplitude lexical dos termos hebraicos.
