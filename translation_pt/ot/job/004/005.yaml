  text: כִּ֤י עַתָּ֨ה תָּב֣וֹא אֵלֶ֣י/ךָ וַ/תֵּ֑לֶא תִּגַּ֥ע עָ֝דֶ֗י/ךָ וַ/תִּבָּהֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: pt
  text: Mas agora isso chega a você[a], e você se cansa; toca em você[b], e você fica abalado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois agora isso chega a você”. A conjunção hebraica כִּי pode ser traduzida de várias maneiras; no texto principal, “mas” destaca o contraste no contexto.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, os verbos traduzidos como “chega” e “toca” estão no feminino singular, provavelmente com referência implícita à desgraça ou à aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: Embora a conjunção possa significar “pois” ou “de fato”, o sentido adversativo expressa melhor o contraste entre a maneira como Jó antes fortalecia outros e sua reação quando o sofrimento o alcança.
- source_word: עַתָּה
  choice: agora
  rationale: Marca a situação presente em contraste com a conduta anterior de Jó.
- source_word: תָּבוֹא
  choice: isso chega
  rationale: O verbo está na terceira pessoa feminina singular e tem sujeito implícito, provavelmente a desgraça ou aflição. “Isso” preserva a referência não expressa sem introduzir explicitamente um substantivo interpretativo.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: Expressa de modo natural que a aflição agora alcança Jó pessoalmente.
- source_word: וַתֵּלֶא
  choice: e você se cansa
  rationale: O verbo לאה indica cansaço ou perda de forças. A formulação evita interpretá-lo de forma mais moralizante como “fica impaciente”.
- source_word: תִּגַּע
  choice: toca
  rationale: Mantém o sentido básico e a imagem de נגע, preservando a progressão entre chegar a Jó e entrar em contato com ele.
- source_word: עָדֶיךָ
  choice: em você
  rationale: Com o verbo “tocar”, esta é a construção idiomática em português para o hebraico “até você” ou “a você”.
- source_word: וַתִּבָּהֵל
  choice: e você fica abalado
  rationale: בהל transmite alarme, perturbação ou consternação. “Fica abalado” comunica a reação emocional sem intensificá-la necessariamente como terror.
