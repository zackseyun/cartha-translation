    issue: A tradução principal «sem alcançar a sabedoria» restringe o sentido de ולא בחכמה.
    rationale: O hebraico diz literalmente «e não em/com sabedoria» e pode referir-se a morrer sem sabedoria, sem a obter, ou de modo não sábio. «Alcançar» introduz especificamente a noção de aquisição que não está expressa.
  - severity: low
    issue: «De dentro deles» torna mais rígida e estranha a imagem de בם.
    rationale: Embora preserve uma possível leitura interna de בם, a expressão portuguesa sugere uma remoção física do interior do corpo. «Neles» conserva a preposição hebraica e deixa a imagem deliberadamente elíptica.
