review_pass:
  verdict: revise
  source_fidelity: A pergunta retórica e a imagem da corda são bem representadas. Contudo, «sem alcançar a sabedoria» fixa uma interpretação temporal/teleológica que o conciso ולא בחכמה não explicita. A formulação deve conservar a ambiguidade entre morrer sem sabedoria e morrer não sabiamente. «De dentro deles» também soa mais interpretativo e menos idiomático do que a expressão hebraica obscura exige.
  naturalness: O texto é geralmente claro, mas «Não é arrancada de dentro deles a corda da sua tenda?» tem ordem e imagem pouco naturais em português. Uma inversão mais fluida preserva o tom elevado sem explicar em excesso a metáfora.
  terminology: «Corda da tenda» comunica adequadamente a leitura concreta de יתר. «Sabedoria» é o equivalente estabelecido de חכמה e deve permanecer sem a expansão «alcançar».
