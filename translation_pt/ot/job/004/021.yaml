  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: pt
  text: Não é arrancada, neles, a corda da sua tenda?[a] Eles morrem sem sabedoria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a corda deles é arrancada deles”. Tradicionalmente: “a sua excelência é removida”. O hebraico provavelmente evoca a imagem de uma tenda, cuja corda é arrancada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “morrem, e não com sabedoria” ou “morrem antes de alcançar a sabedoria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é...?
  rationale: Preserva a força da pergunta retórica hebraica, que espera concordância.
- source_word: נִסַּע
  choice: arrancada
  rationale: Expressa a remoção de algo fixado, como a corda de uma tenda; mantém a imagem concreta sem exigir uma ruptura violenta.
- source_word: יִתְרָם
  choice: a corda da sua tenda
  rationale: יתר pode designar uma corda, especialmente no contexto de tenda. A referência explícita à tenda torna compreensível a imagem sugerida pelo contexto imediato.
- source_word: בָּם
  choice: de dentro deles
  rationale: Representa a preposição ב com o sufixo pronominal e conserva a ideia de que a corda vital é retirada do interior deles.
- source_word: יָמוּתוּ
  choice: Eles morrem
  rationale: Tradução direta do verbo comum מות, sem acrescentar a intensidade de 'perecem'.
- source_word: וְלֹא בְחָכְמָה
  choice: sem alcançar a sabedoria
  rationale: Formulação natural em português que exprime uma leitura provável da frase hebraica, enquanto a nota registra sua ambiguidade.
theological_decisions:
- issue: Sentido da morte 'não em sabedoria'
  choice: sem alcançar a sabedoria
  alternative: e não com sabedoria; sem sabedoria
  rationale: O hebraico é conciso e pode indicar morrer sem possuir ou adquirir sabedoria, ou morrer de modo não sábio. A tradução adota uma leitura contextual plausível sem converter a ambiguidade em afirmação doutrinária; as alternativas são preservadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A metáfora da tenda é explicitada de modo moderado, e a ambiguidade da frase final é preservada por meio de nota.
