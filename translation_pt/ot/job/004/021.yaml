revisions:
- from: Não é arrancada de dentro deles a corda da sua tenda?[a] Eles morrem sem alcançar a sabedoria.[b]
  to: Não é arrancada, neles, a corda da sua tenda?[a] Eles morrem sem sabedoria.[b]
