source:
  edition: WLC
  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: pt
  text: Pelo sopro de Deus, eles perecem[a]; pelo vento impetuoso da sua ira, chegam ao fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Do sopro de Deus, eles perecem». A preposição hebraica pode indicar tanto a fonte como o meio.'
    reason: lexical_alternative
  - marker: b
    text: «Vento impetuoso» traduz o hebraico rúah, que também pode significar «vento», «sopro», «respiração» ou «espírito». Outra tradução possível para «chegam ao fim» é «são consumidos».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: pelo sopro de
  rationale: נְשָׁמָה denota sopro ou respiração. A preposição מִן pode indicar fonte ou meio; neste paralelismo poético, «pelo sopro de» exprime naturalmente causa ou instrumento sem perder a imagem.
- source_word: אֱלוֹהַ
  choice: Deus
  rationale: אֱלוֹהַ é a forma singular poética para Deus, frequente em Jó. «Deus» é o equivalente direto, sem acrescentar um título ausente do hebraico.
- source_word: יֹאבֵדוּ
  choice: eles perecem
  rationale: O verbo אבד tem o sentido básico de perecer ou ser destruído. «Perecem» conserva a força intransitiva e o tom poético.
- source_word: וּמֵרוּחַ
  choice: pelo vento impetuoso de
  rationale: רוּחַ pode significar vento, sopro, respiração ou espírito. Em paralelo com «sopro» e ligado à ira divina, descreve uma exalação destrutiva e forte; «vento impetuoso» comunica essa intensidade sem sugerir aqui o sentido teológico de «espírito».
- source_word: אַפּוֹ
  choice: sua ira
  rationale: אַף significa literalmente nariz ou narina e, por extensão idiomática, ira. «Sua ira» torna claro o sentido do hebraico, enquanto a imagem física permanece sugerida pelo vento impetuoso.
- source_word: יִכְלוּ
  choice: chegam ao fim
  rationale: כלה no qal pode significar acabar, chegar ao fim ou ser consumido. «Chegam ao fim» preserva o sentido resultativo e acompanha o paralelismo com «perecem» sem especificar indevidamente o modo de destruição.
theological_decisions:
- issue: Linguagem antropomórfica para a ira divina
  choice: Traduzir אַפּוֹ idiomaticamente como «sua ira», preservando a imagem de sopro e vento no verso.
  alternative: «suas narinas» ou «seu furor»
  rationale: O hebraico emprega uma imagem antropomórfica, mas «nariz/narinas» funciona idiomaticamente como referência à ira. A tradução escolhida comunica o sentido com clareza, mantém a força poética no contexto e não acrescenta afirmações doutrinárias.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo hebraico é preservado por dois membros coordenados; «vento impetuoso» evita a repetição pouco expressiva de «sopro» e conserva a intensidade da segunda imagem.
