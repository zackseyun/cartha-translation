  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: pt
  text: Eis que você instruiu[a] muitos e fortaleceu mãos enfraquecidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplinou” ou “corrigiu”; o verbo hebraico pode incluir a ideia de instrução por meio da correção.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marca discursiva que chama atenção para o que segue; preserva a ênfase e o tom elevado da fala poética sem soar excessivamente arcaica.
- source_word: יִסַּרְתָּ
  choice: instruiu
  rationale: O verbo יסר pode significar disciplinar, corrigir ou instruir mediante correção. Aqui, Elifaz recorda positivamente a atuação de Jó em favor de outros, por isso “instruiu” se ajusta bem ao contexto, enquanto a nota preserva as demais nuances.
- source_word: רַבִּים
  choice: muitos
  rationale: Equivalente direto e natural do termo quantitativo hebraico.
- source_word: יָדַיִם רָפוֹת
  choice: mãos enfraquecidas
  rationale: Preserva a metáfora corporal hebraica para pessoas desanimadas ou sem forças. “Enfraquecidas” expressa o estado das mãos com naturalidade em português.
- source_word: תְּחַזֵּק
  choice: fortaleceu
  rationale: O piel de חזק significa tornar forte ou fortalecer. Embora a forma seja imperfeita, o paralelismo com o perfeito anterior e o contexto retrospectivo favorecem o passado em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Eis que” mantém a ênfase poética; o paralelismo e a metáfora das mãos foram preservados.
