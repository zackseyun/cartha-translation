lexical_decisions:
- source_word: פַּחַד
  choice: medo
  rationale: O substantivo expressa medo, pavor ou terror; “medo” é claro e natural sem intensificar além do que o contexto exige.
- source_word: קְרָאַנִי
  choice: veio sobre mim
  rationale: Aqui קרא tem o sentido de encontrar, acometer ou sobrevir, e não o de chamar; a expressão comunica o caráter repentino da experiência.
- source_word: וּרְעָדָה
  choice: e o tremor
  rationale: Designa a reação física associada ao medo e mantém o paralelismo poético.
- source_word: וְרֹב עַצְמוֹתַי
  choice: todos os meus ossos
  rationale: Literalmente, “a multidão/abundância dos meus ossos”; no contexto poético, a expressão intensifica a reação corporal, e “todos os meus ossos” a transmite de modo natural.
- source_word: הִפְחִיד
  choice: fez estremecer
  rationale: A forma causativa de פחד indica que algo provocou pavor; com “ossos” como objeto, “fez estremecer” expressa naturalmente o efeito corporal sem perder a força causativa.
