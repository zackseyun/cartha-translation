  yaml_path: translation/ot/job/004/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: pt
  text: 'Então Elifaz, o temanita, respondeu e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa responder. A escolha preserva a ideia de réplica à fala anterior de Jó.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: O nome próprio é transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: הַתֵּימָנִי
  choice: o temanita
  rationale: O adjetivo gentílico identifica Elifaz como alguém de Temã. A forma concisa «o temanita» é natural na tradição bíblica em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Reproduz a fórmula hebraica convencional de introdução da fala sem fundir os dois verbos ou eliminar a estrutura solene do relato.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo inicial faz a narrativa avançar. «Então» expressa a sequência de modo natural em português moderno; o segundo waw é representado por «e».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula narrativa hebraica. Mantém-se a expressão tradicional «respondeu e disse», apesar de sua leve redundância em português, para preservar os dois verbos do original e o ritmo formal do diálogo.
