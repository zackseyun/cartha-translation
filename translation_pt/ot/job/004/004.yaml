lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: quem tropeçava
  rationale: O particípio de כשל descreve alguém que tropeça ou cambaleia. A formulação preserva a imagem concreta e soa natural em português.
- source_word: יְקִימוּן
  choice: levantavam
  rationale: 'O hifil de קום tem sentido causativo: fazer ficar em pé, levantar ou sustentar. O imperfeito, no contexto da descrição da conduta habitual de Jó, é bem representado pelo pretérito imperfeito português.'
- source_word: מִלֶּיךָ
  choice: suas palavras
  rationale: Tradução direta e idiomática do plural de מִלָּה, mantendo o meio pelo qual Jó ajudava os outros.
- source_word: בִרְכַּיִם
  choice: os joelhos
  rationale: Mantém literalmente a imagem corporal clara do verso.
- source_word: כֹּרְעוֹת
  choice: que vacilavam
  rationale: O particípio de כרע pode indicar joelhos que se dobram, cedem ou fraquejam. 'Vacilavam' comunica fraqueza e instabilidade sem eliminar a imagem poética.
- source_word: תְּאַמֵּץ
  choice: você fortalecia
  rationale: O piel de אמץ significa fortalecer ou tornar firme. O pretérito imperfeito acompanha a ação habitual expressa no primeiro hemistíquio.
