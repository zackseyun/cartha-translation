  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: pt
  text: Suas palavras levantavam[a] quem tropeçava, e você fortalecia os joelhos que cediam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sustentavam” ou “faziam ficar em pé”.'
