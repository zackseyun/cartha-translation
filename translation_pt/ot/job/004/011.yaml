lexical_decisions:
- source_word: לַיִשׁ
  choice: o leão
  rationale: O termo designa um leão, possivelmente com a nuance de força ou maturidade; “o leão” é natural e evita explicitar uma nuance incerta.
- source_word: אֹבֵד
  choice: perece
  rationale: O particípio de אבד exprime perecimento ou ruína; “perece” conserva o tom vívido e proverbial.
- source_word: מִבְּלִי
  choice: por falta de
  rationale: A expressão indica privação e, no contexto, a causa do perecimento.
- source_word: טָרֶף
  choice: presa
  rationale: O substantivo se refere à presa de um predador, mantendo a imagem leonina específica.
- source_word: בְנֵי
  choice: os filhotes do
  rationale: Embora literalmente signifique “filhos de”, no contexto animal “filhotes” é a forma portuguesa natural.
- source_word: לָבִיא
  choice: leão
  rationale: O termo pode designar leão ou leoa. O texto não exige a especificação do sexo, por isso a tradução principal preserva o sentido genérico e registra a alternativa em nota.
- source_word: יִתְפָּרָדוּ
  choice: se dispersam
  rationale: A forma verbal expressa separação ou dispersão; “se dispersam” preserva sua forma reflexiva e o desmembramento do grupo.
