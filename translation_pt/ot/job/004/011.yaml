  text: O leão perece por falta de presa, e os filhotes do leão[a] se dispersam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da leoa” ou “do leão feroz”. Os termos hebraicos usados para leão variam em nuance, e לָבִיא pode ser entendido como “leão” ou “leoa”.
