base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: pt
  text: O rugido do leão, a voz do leão feroz e os dentes dos leões jovens são quebrados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “são arrancados” ou “são removidos”. O verbo hebraico transmite a ideia de quebra ou remoção violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: rugido
  rationale: Substantivo em estado construto que designa o bramido característico do leão; “rugido” é a forma natural e poética em português.
- source_word: אַרְיֵה
  choice: leão
  rationale: Termo hebraico comum para leão, traduzido diretamente.
- source_word: קוֹל
  choice: voz
  rationale: Preserva o paralelismo poético com “rugido” e evita reduzir os dois termos a “som”.
- source_word: שָׁחַל
  choice: leão feroz
  rationale: Termo poético para leão, associado à força e ferocidade; o qualificativo distingue este vocábulo de אַרְיֵה sem adotar a interpretação incerta “leão negro”.
- source_word: שִׁנֵּי
  choice: os dentes dos
  rationale: Plural em estado construto, vertido de modo direto e natural.
- source_word: כְפִירִים
  choice: leões jovens
  rationale: Designa leões jovens e vigorosos, não necessariamente filhotes indefesos.
- source_word: נִתָּעוּ
  choice: são quebrados
  rationale: A forma passiva expressa a destruição violenta da capacidade predatória. “São quebrados” mantém a imagem abrangente e o paralelismo sintático, enquanto alternativas que enfatizam a remoção física são registradas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética compacta. A coordenação dos três elementos foi preservada, sem acrescentar um verbo como “se calam”, que não aparece explicitamente no hebraico.
