  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: pt
  text: Uma palavra chegou a mim em segredo, e meu ouvido captou um sussurro[a] dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu ouvido percebeu apenas um vestígio dela” ou “captou um som tênue vindo dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: a mim
  rationale: Preserva explicitamente a direção da comunicação. O וְ inicial funciona como ligação discursiva e não exige um advérbio temporal como “agora”.
- source_word: דָּבָר
  choice: uma palavra
  rationale: Mantém a formulação concisa e misteriosa do hebraico no contexto de uma revelação, sem ampliar o sentido para “mensagem”.
- source_word: יְגֻנָּב
  choice: chegou ... em segredo
  rationale: O passivo de גנב é metafórico aqui e descreve algo transmitido ou vindo furtivamente. A formulação evita a imagem enganosa de uma palavra literalmente “roubada”.
- source_word: וַתִּקַּח
  choice: captou
  rationale: Embora signifique literalmente “tomou”, com “meu ouvido” como sujeito o verbo descreve a percepção auditiva; “captou” conserva a imagem de recepção.
- source_word: אָזְנִי
  choice: meu ouvido
  rationale: Preserva o singular e a vívida imagem corporal do hebraico.
- source_word: שֵׁמֶץ
  choice: um sussurro
  rationale: No contexto auditivo, expressa naturalmente a ideia de um som tênue, embora o termo também possa indicar apenas um vestígio ou uma pequena parte.
- source_word: מֶנְהוּ
  choice: dela
  rationale: Retoma “palavra”, substantivo feminino em português, e traduz naturalmente a ideia de um sussurro proveniente dela.
theological_decisions: []
