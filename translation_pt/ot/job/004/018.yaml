id: JOB.4.18
reference: Job 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: pt
  text: Eis que ele não confia em seus servos e atribui erro[b] a seus mensageiros[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anjos”. A palavra hebraica pode referir-se tanto a mensageiros humanos como celestiais; aqui, o contexto provavelmente aponta para seres celestiais.
    reason: alternative_reading
  - marker: b
    text: Ou “falha”, “insensatez” ou “imperfeição”. O termo hebraico é raro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz uma afirmação enfática e chama a atenção para ela. A expressão mantém o tom elevado da poesia sem dificultar a compreensão.
- source_word: בַּעֲבָדָיו
  choice: em seus servos
  rationale: Com o verbo אמן no hifil, a preposição ב marca aquele em quem se deposita confiança. “Servos” ressalta aqui a posição subordinada, sem introduzir desnecessariamente a ideia social de escravidão.
- source_word: לֹא יַאֲמִין
  choice: não confia
  rationale: O hifil de אמן expressa confiança ou segurança depositada em alguém, não mera aceitação intelectual.
- source_word: וּבְמַלְאָכָיו
  choice: a seus mensageiros
  rationale: מַלְאָךְ pode designar tanto um mensageiro humano como um ser celestial. “Mensageiros” preserva a amplitude lexical, enquanto a nota registra a leitura contextual provável, “anjos”.
- source_word: יָשִׂים
  choice: atribui
  rationale: Neste uso com um substantivo abstrato, שׂים tem o sentido de imputar ou atribuir algo a alguém; “atribui” é natural e mantém essa relação.
- source_word: תָּהֳלָה
  choice: erro
  rationale: O substantivo raro pode indicar erro, falha, insensatez ou imperfeição. “Erro” oferece uma formulação concisa sem definir excessivamente a natureza da deficiência.
theological_decisions:
- issue: Se מַלְאָכָיו deve ser traduzido especificamente por “anjos” ou lexicalmente por “mensageiros”
  choice: mensageiros
  alternative: anjos
  rationale: O termo hebraico significa literalmente “mensageiros”, embora o paralelismo com “servos” e o contexto provavelmente apontem para seres celestiais. O texto mantém a amplitude do termo, e a nota apresenta a interpretação mais específica.
- issue: Como representar a deficiência atribuída por Deus aos seus mensageiros
  choice: erro
  alternative: falha, insensatez ou imperfeição
  rationale: Como תָּהֳלָה é um termo raro e semanticamente incerto, “erro” preserva a afirmação comparativa sobre a limitação dos mensageiros sem impor uma definição doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Eis que” conserva a ênfase do hebraico; a ordem da frase permanece natural em português. Os marcadores foram posicionados junto aos termos a que suas respectivas notas se referem.
