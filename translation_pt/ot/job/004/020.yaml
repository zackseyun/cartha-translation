  text: מִ/בֹּ֣קֶר לָ/עֶ֣רֶב יֻכַּ֑תּוּ מִ/בְּלִ֥י מֵ֝שִׂ֗ים לָ/נֶ֥צַח יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: pt
  text: Da manhã até a tarde, são esmagados; sem que ninguém lhes dê atenção[a], perecem para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem que ninguém preste atenção” / “sem que ninguém leve isso a sério”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Da manhã até a tarde
  rationale: A expressão temporal abrange o período de um único dia e ressalta a brevidade e fragilidade humanas, preservando a imagem hebraica em português natural.
- source_word: יֻכַּתּוּ
  choice: são esmagados
  rationale: 'A forma Hofal comunica ação passiva: ser golpeado, quebrado ou esmagado. A escolha preserva a força da imagem sem especificar a causa.'
- source_word: מִבְּלִי מֵשִׂים
  choice: sem que ninguém lhes dê atenção
  rationale: A expressão é elíptica, literalmente ligada a pôr ou fixar algo, provavelmente o coração ou a mente. Esta formulação transmite que ninguém presta atenção ao destino deles.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: A expressão enfatiza a permanência ou irreversibilidade do perecimento, sem acrescentar uma interpretação escatológica.
- source_word: יֹאבֵדוּ
  choice: perecem
  rationale: O Qal de אבד expressa perecer, perder-se ou chegar à ruína. “Perecem” mantém o sentido amplo e não introduz uma nuance teológica mais estreita.
theological_decisions:
- issue: A finalidade da mortalidade humana no discurso de Elifaz
  choice: Manter “perecem para sempre” como afirmação da fragilidade humana e da irreversibilidade da morte no contexto do discurso.
  alternative: Entender “para sempre” como referência explícita à condenação escatológica definitiva.
  rationale: O contexto descreve a fragilidade dos mortais diante de Deus. A tradução conserva a tensão e a força do hebraico sem expandi-las para uma doutrina explícita de juízo final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Da manhã até a tarde” soa natural, enquanto “são esmagados” preserva a contundência e a voz passiva do hebraico.
