lexical_decisions:
- source_word: זְכָר נָא
  choice: Lembre-se, por favor
  rationale: O imperativo de זכר, acompanhado da partícula נָא, pede recordação ou reflexão com força cortês; esta formulação é natural e digna em português moderno.
- source_word: מִי הוּא
  choice: que ... já
  rationale: A construção interrogativa com pronome é enfática. Em português, a pergunta retórica com «que» e «já» comunica naturalmente a ideia de «quem foi que alguma vez...?», sem rigidez.
- source_word: נָקִי
  choice: inocente
  rationale: נָקִי designa quem está livre de culpa; «inocente» é claro no contexto da afirmação moral de Elifaz. A alternativa «sem culpa» é registrada em nota.
- source_word: אָבָד
  choice: pereceu
  rationale: O qal perfeito de אבד indica perecer, arruinar-se ou deixar de existir; «pereceu» preserva a gravidade e funciona bem na pergunta retórica.
- source_word: וְאֵיפֹה
  choice: E onde
  rationale: A conjunção com o interrogativo introduz a pergunta paralela. «E onde» reproduz diretamente a coordenação hebraica.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O adjetivo plural substantivado se refere a pessoas moralmente retas. «Os íntegros» é atual, conciso e mantém a distinção lexical em relação a «inocente».
- source_word: נִכְחָדוּ
  choice: foram exterminados
  rationale: O nifal perfeito de כחד pode expressar ser eliminado, apagado ou destruído. «Foram exterminados» preserva o valor passivo e o paralelismo forte com «pereceu»; «eliminados» permanece como alternativa menos intensa.
theological_decisions:
- issue: A afirmação retórica de Elifaz sobre o destino dos inocentes e íntegros
  choice: Apresentar diretamente as perguntas retóricas de Elifaz, sem qualificação editorial.
  alternative: Acrescentar linguagem que indique que a afirmação será contestada pelo argumento mais amplo do livro.
  rationale: O versículo deve preservar a alegação teológica de Elifaz como parte do diálogo, sem endossá-la como voz do narrador nem antecipar a tensão desenvolvida no restante do livro.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O tom é digno e direto. «Lembre-se, por favor» evita arcaísmo; as perguntas mantêm a força retórica de Elifaz. Todos os marcadores de nota aparecem no texto principal.
