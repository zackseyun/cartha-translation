  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: pt
  text: 'Lembre-se, por favor: que inocente já pereceu?[a] E onde os íntegros foram destruídos?[b]'
  philosophy: optimal-equivalence
