base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: pt
  text: Em meio a pensamentos inquietantes, vindos de visões noturnas[a], quando sono profundo cai sobre os seres humanos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “provenientes de visões da noite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Em meio a pensamentos inquietantes
  rationale: O substantivo pode indicar pensamentos divididos, perturbadores ou inquietantes. A formulação conserva a perturbação mental do contexto e soa natural em português.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: vindos de visões noturnas
  rationale: A preposição מִן indica aqui a origem ou ocasião dos pensamentos; חֶזְיֹנוֹת לָיְלָה refere-se a visões ocorridas à noite.
- source_word: בִּנְפֹל
  choice: quando ... cai
  rationale: O infinitivo construto com בְּ introduz uma oração temporal; “quando” expressa essa relação com clareza.
- source_word: תַּרְדֵּמָה
  choice: sono profundo
  rationale: O termo designa sono pesado ou profundo, não apenas o sono comum.
- source_word: עַל אֲנָשִׁים
  choice: sobre os seres humanos
  rationale: Embora o substantivo hebraico esteja no plural masculino, neste contexto seu sentido é genérico. “Seres humanos” comunica diretamente essa abrangência sem alterar o referente.
theological_decisions:
- issue: Sentido genérico de אֲנָשִׁים
  choice: os seres humanos
  alternative: os homens
  rationale: O plural masculino hebraico refere-se genericamente às pessoas. Em português atual, “seres humanos” preserva com precisão o alcance universal e evita que “homens” seja entendido como exclusivamente masculino.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética preservada. “Visões noturnas” é idiomático; a nota registra a forma mais literal. O versículo permanece sintaticamente aberto, como no contexto hebraico, continuando no versículo seguinte.
