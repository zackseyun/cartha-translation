  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: pt
  text: Não é o seu temor de Deus[a] a sua confiança[b], e a integridade[c] dos seus caminhos, a sua esperança?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: «o seu temor»; o hebraico não explicita o objeto, embora, na literatura sapiencial, o termo geralmente se refira ao temor de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a sua segurança».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «a irrepreensibilidade».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é... ?
  rationale: Introduz uma pergunta retórica que espera concordância, preservando a força interrogativa sem convertê-la numa afirmação explícita.
- source_word: יִרְאָתְךָ
  choice: seu temor de Deus
  rationale: O substantivo significa temor ou reverência; embora o objeto não esteja expresso no hebraico, no contexto sapiencial a referência provável é a Deus. A nota preserva a forma mais estrita, «seu temor».
- source_word: כִּסְלָתֶךָ
  choice: sua confiança
  rationale: Neste contexto, o substantivo designa confiança ou segurança, não «insensatez», e forma um paralelo natural com «esperança».
- source_word: תִּקְוָתְךָ
  choice: sua esperança
  rationale: Equivalente corrente e natural para a expectativa confiante expressa por תִּקְוָה.
- source_word: וְתֹם
  choice: e a integridade
  rationale: תֹּם comunica inteireza moral, integridade ou irrepreensibilidade. «Integridade» é natural em português e evita sugerir perfeição absoluta.
- source_word: דְּרָכֶיךָ
  choice: dos seus caminhos
  rationale: Preserva a metáfora sapiencial hebraica para a conduta e continua compreensível em português moderno.
theological_decisions:
- issue: Objeto implícito de «temor»
  choice: temor de Deus no texto principal
  alternative: seu temor; sua reverência
  rationale: Deus é o referente contextual provável no discurso sapiencial, mas o hebraico não explicita o objeto; por isso, a ambiguidade formal é registrada em nota.
- issue: Relação sintática das expressões nominais
  choice: 'duas orações nominais paralelas: o temor é a confiança, e a integridade dos caminhos é a esperança'
  alternative: tratar «confiança», «esperança» e «integridade dos caminhos» como itens de uma mesma série
  rationale: A sequência hebraica se organiza mais naturalmente em dois pares paralelos e equilibrados, preservados pela pontuação portuguesa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção retórica e o paralelismo poético foram preservados; a vírgula antes de «a sua esperança» marca a elipse do verbo «ser» no segundo membro.
