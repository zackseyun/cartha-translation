  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: pt
  text: O olho que o viu não o verá novamente[a], e o seu lugar já não o contemplará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O olho que fixou o olhar nele não voltará a fazê-lo”. O hebraico emprega poeticamente “olho” no singular e, no segundo verso, personifica “o seu lugar”.'
