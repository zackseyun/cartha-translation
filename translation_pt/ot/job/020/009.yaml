lexical_decisions:
- source_word: עַיִן
  choice: O olho
  rationale: Preserva o singular poético e a imagem vívida do hebraico, sem transformar a expressão em “ninguém”.
- source_word: שְׁזָפַתּוּ
  choice: que o viu
  rationale: O verbo pode indicar ver ou contemplar atentamente; “viu” é natural em português e mantém o paralelismo sem especificar uma intensidade incerta.
- source_word: וְלֹא תוֹסִיף
  choice: não o verá novamente
  rationale: A construção com יסף e negação exprime que algo não voltará a acontecer; o verbo “ver” e o objeto “o” são retomados naturalmente do contexto.
- source_word: וְלֹא עוֹד
  choice: já não
  rationale: Expressa de maneira idiomática e atual a cessação definitiva indicada pelo hebraico.
- source_word: תְּשׁוּרֶנּוּ
  choice: o contemplará
  rationale: O verbo שׁור significa olhar ou contemplar. “Contemplará” conserva a nuance poética e distingue lexicalmente os dois membros do verso.
- source_word: מְקוֹמוֹ
  choice: o seu lugar
  rationale: Tradução literal que preserva a personificação do lugar como sujeito do ato de contemplar.
