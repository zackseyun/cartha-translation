base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: pt
  text: 'Ele suga o veneno de cobras[a];

    a língua da víbora o mata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “veneno das áspides”. A identificação exata das serpentes designadas pelos termos hebraicos é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: veneno
  rationale: Embora o sentido comum seja “cabeça”, neste contexto poético de serpentes e morte o termo designa idiomaticamente a substância tóxica. “Veneno” é natural e preserva o paralelismo.
- source_word: פְּתָנִים
  choice: najas
  rationale: O termo designa serpentes venenosas e é tradicionalmente traduzido por “áspides”. “Najas” comunica de modo atual a provável referência a cobras venenosas sem recorrer ao pouco transparente “áspides”.
- source_word: יִינָק
  choice: suga
  rationale: Preserva a imagem concreta e intensa do verbo hebraico “sugar”, em vez de substituí-la pela formulação mais interpretativa “bebe”.
- source_word: תַּהַרְגֵהוּ
  choice: o mata
  rationale: Traduz diretamente o verbo e seu objeto. O presente poético expressa com naturalidade a consequência certa descrita no verso.
- source_word: לְשׁוֹן
  choice: língua
  rationale: Mantém a imagem literal do hebraico, sem interpretá-la como “presa” ou “mordida”.
- source_word: אֶפְעֶה
  choice: víbora
  rationale: Equivalente moderno e amplamente compreensível para uma serpente venenosa, sem alegar identificação zoológica excessivamente precisa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética em dois versos. A tradução mantém as imagens concretas “suga” e “língua” e evita especificidade zoológica indevida por meio da nota.
