base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: pt
  text: 'Pois o júbilo dos perversos é breve,

    e a alegria do ímpio[a] dura apenas um instante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do hipócrita”. O termo hebraico também pode ter esse sentido, embora em Jó geralmente designe de modo mais amplo uma pessoa ímpia ou irreligiosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando de modo natural a força causal do hebraico.
- source_word: רִנְנַת
  choice: júbilo
  rationale: O substantivo designa uma manifestação ou grito de alegria; “júbilo” conserva a intensidade poética sem exigir que se explicite o aspecto vocal.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Refere-se a pessoas moralmente culpadas ou más; “perversos” é claro e adequado ao paralelismo da literatura sapiencial.
- source_word: מִקָּרוֹב
  choice: é breve
  rationale: Neste contexto, a expressão indica curta duração, e não proximidade espacial. A formulação comunica com clareza seu sentido temporal.
- source_word: וְשִׂמְחַת
  choice: e a alegria do
  rationale: Tradução direta da construção nominal, mantendo o paralelismo entre os dois membros do verso.
- source_word: חָנֵף
  choice: ímpio
  rationale: Em Jó, o termo costuma designar de forma ampla quem é profano ou irreligioso, não apenas alguém que simula devoção. “Ímpio” também corresponde bem a “perversos” no primeiro membro.
- source_word: עֲדֵי רָגַע
  choice: dura apenas um instante
  rationale: A expressão delimita a duração até um espaço mínimo de tempo; o verbo “dura”, implícito no hebraico, produz uma frase natural em português.
