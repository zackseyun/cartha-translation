  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: pt
  text: Você sabe isto desde os tempos antigos, desde que o ser humano foi posto sobre a terra?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת
  choice: isto
  rationale: O demonstrativo introduz aquilo que Zofar apresenta como conhecimento antigo; “isto” mantém a referência aberta e a força retórica.
- source_word: יָדַעְתָּ
  choice: você não sabe
  rationale: O perfeito em pergunta retórica pode ser expresso naturalmente em português pelo presente com negação retórica, sem mudar a expectativa de resposta afirmativa do hebraico.
- source_word: מִנִּי עַד
  choice: desde a antiguidade
  rationale: A expressão aponta para um passado remoto; esta formulação é clara, digna e corrente em português.
- source_word: מִנִּי שִׂים
  choice: desde que ... foi posto
  rationale: Reproduz o segundo marco temporal e a construção passiva implícita no infinitivo hebraico.
- source_word: שִׂים
  choice: foi posto
  rationale: Preserva o sentido básico de colocar ou estabelecer alguém em determinado lugar.
- source_word: אָדָם
  choice: o ser humano
  rationale: Aqui o singular é genérico e designa a humanidade, não especificamente um homem do sexo masculino; “o ser humano” conserva o singular representativo com clareza em português.
- source_word: עֲלֵי אָרֶץ
  choice: sobre a terra
  rationale: Tradução direta da expressão locativa, em registro natural e solene.
theological_decisions:
- issue: Sentido genérico de אָדָם na declaração sobre as origens humanas
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O contexto fala genericamente da presença humana na terra. “O ser humano” mantém o singular coletivo do hebraico sem sugerir que a afirmação se limite ao sexo masculino; “a humanidade” seria igualmente inclusivo, mas mudaria o singular representativo para um coletivo abstrato.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A pergunta foi formulada com negação retórica, construção idiomática em português que comunica a resposta afirmativa esperada. Não há marcadores de nota, pois nenhuma nota é necessária para preservar uma ambiguidade relevante.
