base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: pt
  text: Esta é a porção que cabe ao homem perverso, da parte de Deus, e a herança que o Poderoso lhe destinou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a herança de sua palavra, da parte do Poderoso”. O termo hebraico pode significar “palavra” ou “declaração”; aqui, provavelmente se refere ao que Deus declarou ou determinou para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Esta é
  rationale: O demonstrativo introduz o resumo conclusivo de Zofar; em português, a cópula expressa naturalmente a frase nominal hebraica.
- source_word: חֵלֶק
  choice: porção
  rationale: Designa a parte ou sorte atribuída a alguém e preserva o paralelismo poético com “herança”.
- source_word: אָדָם רָשָׁע
  choice: homem perverso
  rationale: Expressão singular masculina de valor genérico; “homem perverso” mantém a forma do hebraico e é natural no contexto sapiencial.
- source_word: מֵאֱלֹהִים
  choice: da parte de Deus
  rationale: Indica Deus como fonte da porção atribuída; a locução portuguesa comunica esse sentido com clareza.
- source_word: וְנַחֲלַת
  choice: a herança
  rationale: Mantém a imagem de algo atribuído como posse e o paralelismo com “porção”; a coordenação pode ser entendida em aposição explicativa.
- source_word: אִמְרוֹ
  choice: lhe destinou
  rationale: No contexto, a “palavra” ou “declaração” é entendida como aquilo que Deus determinou para o perverso. “Destinou” comunica a atribuição sem tornar o português obscuro, enquanto a leitura mais literal fica registrada em nota.
- source_word: מֵאֵל
  choice: o Poderoso
  rationale: Traduz o título divino אֵל segundo sua força e conserva a variação poética em relação a אֱלֹהִים, em vez de repetir simplesmente “Deus”.
theological_decisions:
- issue: Valor genérico de אָדָם no singular masculino
  choice: homem perverso
  alternative: pessoa perversa
  rationale: A expressão hebraica é masculina singular e representativa. A tradução conserva essa forma sem restringir o princípio moral apenas a um indivíduo específico.
- issue: Sentido de אִמְרוֹ
  choice: a herança que o Poderoso lhe destinou
  alternative: a herança de sua palavra, da parte do Poderoso
  rationale: A forma pode ser vertida literalmente em referência a uma palavra ou declaração, mas o paralelismo e o contexto favorecem o sentido da herança pronunciada ou determinada por Deus. A nota preserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção mantém o paralelismo entre “porção” e “herança” e preserva “o Poderoso” como título divino poético.
