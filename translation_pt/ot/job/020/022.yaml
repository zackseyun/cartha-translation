  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: pt
  text: Na plenitude da sua abundância[a], ele ficará angustiado; toda mão dos que sofrem[b] virá contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando estiver plena a sua fartura”. O hebraico é compacto, e o termo pode indicar suficiência, fartura ou abundância.'
    reason: lexical_alternative
  - marker: b
    text: “Toda mão dos que sofrem” também pode ser traduzido por “toda mão dos trabalhadores”, “dos que labutam” ou “dos que vivem na miséria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: No auge de
  rationale: A construção com ב e a forma de מלא tem valor temporal-circunstancial. “No auge de” expressa naturalmente o momento em que a plenitude é alcançada.
- source_word: שִׂפְקוֹ
  choice: sua abundância
  rationale: O substantivo indica suficiência ou fartura; no contexto da prosperidade do perverso, “abundância” conserva o sentido e soa natural em português.
- source_word: יֵצֶר לוֹ
  choice: a angústia virá sobre ele
  rationale: A expressão comunica aperto ou aflição que atinge alguém. Esta formulação reproduz a imagem de uma calamidade sobrevinda sem recorrer ao literalismo pouco natural “será estreito para ele”.
- source_word: כָּל יַד
  choice: toda mão
  rationale: Mantém a imagem hebraica da mão como instrumento de poder ou ação e preserva a força distributiva de כָּל.
- source_word: עָמֵל
  choice: de quem sofre
  rationale: עמל pode designar quem labuta, padece ou vive em miséria. “Quem sofre” é claro, digno e preserva a referência a uma pessoa marcada por sofrimento sem restringi-la indevidamente a um trabalhador.
- source_word: תְּבוֹאֶנּוּ
  choice: virá contra ele
  rationale: בוא com o sufixo objetivo significa vir a/sobre alguém; neste contexto, a mão sugere ação hostil, justificando “contra ele”.
