  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: pt
  text: Pois esmagou e abandonou os pobres; apoderou-se de uma casa e não a construirá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “apoderou-se de uma casa que não construiu”. O verbo hebraico também pode ser entendido, conforme o contexto, como “não a reconstruirá”.'
    reason: A forma verbal hebraica permite discussão quanto ao valor temporal e ao sentido contextual de “construir”; a tradução principal preserva o futuro mais direto, e a nota registra as alternativas sem as impor.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o juízo descrito no contexto e conserva o valor explicativo da conjunção hebraica.
- source_word: רִצַּץ
  choice: esmagou
  rationale: Preserva a imagem concreta e violenta de quebrar ou esmagar, sem reduzi-la ao sentido mais interpretativo de “oprimir”.
- source_word: עָזַב
  choice: abandonou
  rationale: Expressa de maneira natural a ideia de deixar ou desamparar culpavelmente os pobres.
- source_word: דַּלִּים
  choice: os pobres
  rationale: Neste contexto, designa pessoas pobres, fracas ou socialmente vulneráveis; “os pobres” é a formulação mais direta.
- source_word: בַּיִת גָּזַל
  choice: apoderou-se de uma casa
  rationale: גזל indica tomar por força ou mediante roubo; “apoderou-se” comunica apropriação ilícita e combina naturalmente com “uma casa”.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: que não construiu
  rationale: O yiqtol pode ser entendido, no encadeamento poético, como referência à casa da qual ele se apropriou sem tê-la construído. Essa leitura é sintaticamente natural e bem atestada; a possibilidade de sentido futuro ou resultativo é preservada em nota.
