base_translation:
  language: en
  yaml_path: translation/ot/job/020/006.yaml
  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: pt
  text: Ainda que sua grandeza[b] suba até os céus[a], e sua cabeça alcance as nuvens,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se sua altura subir até os céus”. O hebraico אִם pode ser entendido como uma condição simples (“se”) ou, neste contexto, em sentido concessivo (“ainda que”).'
    reason: lexical_alternative
  - marker: b
    text: “Sua grandeza” também pode ser traduzido por “sua altura” ou “sua exaltação”; a imagem pode envolver tanto elevação física quanto posição elevada ou orgulho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ainda que
  rationale: Neste contexto poético, introduz uma hipótese concessiva; “ainda que” preserva também a proximidade com o valor condicional da partícula.
- source_word: יַעֲלֶה
  choice: suba
  rationale: Expressa o movimento ascendente do Qal imperfeito de עלה e soa natural no paralelismo poético.
- source_word: לַשָּׁמַיִם
  choice: até os céus
  rationale: “Até” comunica o limite alcançado pela subida, e “os céus” preserva a forma e a elevação poética do hebraico.
- source_word: שִׂיאוֹ
  choice: sua grandeza
  rationale: O substantivo pode indicar altura, elevação ou exaltação. “Grandeza” mantém juntas a imagem vertical e a possível ideia de posição elevada, sem reduzi-lo à estatura física.
- source_word: וְרֹאשׁוֹ
  choice: e sua cabeça
  rationale: É o sentido lexical direto e preserva a figura de alguém que se ergue a uma altura imensa.
- source_word: לָעָב
  choice: as nuvens
  rationale: עָב designa nuvem ou nuvem espessa; o plural é idiomático em português e corresponde ao paralelismo com “os céus”.
- source_word: יַגִּיעַ
  choice: alcance
  rationale: Expressa naturalmente a ideia de chegar até determinado ponto, preservando a metáfora espacial.
theological_decisions:
- issue: Sentido de שִׂיאוֹ
  choice: sua grandeza
  alternative: sua altura; sua exaltação
  rationale: A escolha evita decidir exclusivamente entre altura física e exaltação de status ou orgulho, conservando a sobreposição poética possível no hebraico.
translation_notes:
  register: Português moderno, poético e digno, com sintaxe clara para leitores brasileiros e compreensão internacional. A formulação conserva o paralelismo hebraico e sua ambiguidade entre altura e exaltação.
