lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: a poupa
  rationale: חמל expressa poupar ou ter compaixão; no contexto da maldade saboreada como algo doce, comunica que ele não quer abrir mão dela, preservando a força concreta do verbo.
- source_word: לֹא יַעַזְבֶנָּה
  choice: não a deixa ir
  rationale: עזב pode significar deixar, abandonar ou soltar. Aqui, a formulação expressa naturalmente a recusa ativa de largar aquilo que ele saboreia.
- source_word: יִמְנָעֶנָּה
  choice: a retém
  rationale: מנע significa reter, impedir ou manter consigo. A escolha preserva a imagem de conservar na boca a coisa doce, sem acrescentar a ideia de simplesmente segurá-la.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: no céu da boca
  rationale: חך designa literalmente o palato ou céu da boca. A expressão portuguesa é clara, natural e mantém a precisão anatômica e poética do hebraico.
