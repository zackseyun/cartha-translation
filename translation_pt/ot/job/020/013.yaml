  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: pt
  text: Ele a poupa e não a deixa ir; ele a retém no céu da boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no seu palato”.'
