base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: pt
  text: Ele devolve aquilo pelo que trabalhou e não o engole; conforme a riqueza que obteve em troca[a], não se alegra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele restitui o fruto de seu trabalho e não o consome; quanto à riqueza obtida em troca, não exulta”. A segunda linha é concisa no hebraico e admite várias traduções estreitamente relacionadas.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵש״ִיב
  choice: devolve
  rationale: O particípio hifil de שוב expressa fazer voltar. “Devolve” é natural em português e comunica que o perverso precisa restituir o que adquiriu.
- source_word: יָגָע
  choice: aquilo por que trabalhou
  rationale: O termo pode indicar o trabalho árduo ou o que dele resulta. Como objeto de “devolve”, a formulação aponta naturalmente para o ganho de seu trabalho sem apagar a amplitude do hebraico.
- source_word: וְלֹא יִבְלָע
  choice: e não o engole
  rationale: בלע significa literalmente “engolir”. A tradução conserva a imagem concreta de não conseguir consumir ou reter o ganho; o pronome retoma aquilo que é devolvido.
- source_word: כְּחֵיל
  choice: conforme a riqueza
  rationale: חֵיל, neste contexto, indica mais provavelmente riqueza ou bens, não força militar. “Conforme” representa o sentido comparativo ou proporcional possível da preposição כ, cuja função exata é difícil neste verso.
- source_word: תְּמוּרָתוֹ
  choice: obtida em sua troca
  rationale: תְּמוּרָה pode denotar troca, compensação ou aquilo que se recebe em troca. A formulação explicita de modo moderado a relação entre a troca e a riqueza, mantendo o núcleo lexical.
- source_word: וְלֹא יַעֲלֹס
  choice: não se alegra
  rationale: עלס denota alegrar-se ou exultar. “Não se alegra” é claro e digno em português atual, indicando que ele não desfruta com satisfação da riqueza adquirida.
