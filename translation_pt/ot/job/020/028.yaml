  text: יִ֭גֶל יְב֣וּל בֵּית֑/וֹ נִ֝גָּר֗וֹת בְּ/י֣וֹם אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: pt
  text: Os rendimentos de sua casa serão levados embora[a], como algo que se escoa, no dia da ira dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irão para o exílio” ou “partirão”; o verbo pode indicar partir, ser exilado ou ser removido e, aqui, refere-se aos rendimentos ou aos bens da casa do perverso.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente se refere à ira de Deus, embora o hebraico deixe implícito a quem o pronome se refere.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: será levada embora
  rationale: O Qal imperfeito de גלה pode indicar partir, ir para o exílio ou ser removido. Com יְבוּל como sujeito, a expressão comunica a perda dos bens ou da produção da casa sem especificar um agente.
- source_word: יְבוּל
  choice: produção
  rationale: Designa produto, rendimento ou colheita. “Produção” abrange aquilo que a casa ou propriedade gera e se ajusta ao contexto de perda dos bens do perverso.
- source_word: בֵּיתוֹ
  choice: de sua casa
  rationale: Mantém a imagem hebraica de “casa”, que no contexto pode abranger a família, os bens e a propriedade.
- source_word: נִגָּרוֹת
  choice: escoando
  rationale: A forma de נגר retrata algo que se derrama ou flui para longe. “Escoando” preserva essa imagem dinâmica sem acrescentar explicitamente água ou outro agente.
- source_word: בְּיוֹם
  choice: no dia
  rationale: Reproduz de modo natural e solene a expressão temporal hebraica.
- source_word: אַפּוֹ
  choice: da ira dele
  rationale: O substantivo significa ira ou furor e traz sufixo masculino singular. A formulação mantém implícita a identidade do referente, como no hebraico.
theological_decisions:
- issue: Referente de “ira dele”
  choice: Manter o pronome sem identificar expressamente Deus no texto principal
  alternative: “no dia da ira de Deus”
  rationale: O contexto favorece fortemente a ira divina, mas o hebraico não nomeia Deus neste verso. A tradução conserva essa concisão e registra a leitura provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe mantém o paralelismo poético e a imagem de algo que escoa, sem resolver a ambiguidade do pronome final.
