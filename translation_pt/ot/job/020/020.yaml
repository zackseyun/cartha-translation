base_translation:
  language: en
  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: pt
  text: Pois ele não conheceu sossego em seu ventre; com aquilo que cobiça, não escapará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não conheceu tranquilidade em seu íntimo; não salvará nada daquilo que deseja.”'
    reason: A construção hebraica permite entender בַּחֲמוּדוֹ em relação ao que ele deseja preservar, e יְמַלֵּט também pode significar “salvar” ou “pôr a salvo”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do juízo descrito no contexto anterior e mantém o fluxo argumentativo do poema.
- source_word: לֹא יָדַע
  choice: não conheceu
  rationale: Reproduz de perto o perfeito hebraico negado e apresenta como fato estabelecido a falta de sossego do ímpio.
- source_word: שָׁלֵו
  choice: sossego
  rationale: Expressa tranquilidade ou descanso interior em português natural, sem especificar em excesso a ideia como contentamento.
- source_word: בְּבִטְנוֹ
  choice: em seu ventre
  rationale: Preserva a imagem corporal concreta de בטן, ligada no contexto ao apetite e ao desejo, com registro poético digno.
- source_word: בַּחֲמוּדוֹ
  choice: com aquilo que cobiça
  rationale: Reflete a relação de חֲמוּד com o que é desejado ou estimado e preserva a possível ideia instrumental da preposição, sem restringir o referente a tesouros materiais.
- source_word: לֹא יְמַלֵּט
  choice: não escapará
  rationale: O piel de מלט pode indicar escapar ou livrar-se; aqui a formulação mantém aberta a nuance de que os objetos cobiçados não lhe proporcionarão escape.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A tradução conserva a imagem visceral do hebraico e sua ambiguidade quanto a o homem escapar por meio do que cobiça ou salvar aquilo que deseja.
