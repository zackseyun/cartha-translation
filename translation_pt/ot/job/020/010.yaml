  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: pt
  text: Seus filhos buscarão o favor dos pobres[a], e as mãos dele devolverão a sua riqueza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aplacarão os pobres”; o verbo hebraico pode indicar tanto buscar o favor de alguém como apaziguar aqueles que foram prejudicados.
    reason: lexical_alternative
  - marker: b
    text: Ou “restituirão seus bens” ou “sua força”; o substantivo hebraico pode se referir a riqueza, posses, recursos ou vigor, embora “riqueza” se ajuste melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O substantivo hebraico está no masculino plural com sufixo de terceira pessoa masculina singular; “filhos” conserva essa forma específica.
- source_word: יְרַצּוּ
  choice: buscarão o favor de
  rationale: O piel de רצה pode expressar a busca de aceitação ou favor e, neste contexto, também admite a ideia de aplacar pessoas prejudicadas.
- source_word: דַלִּים
  choice: os pobres
  rationale: דלים designa pessoas pobres, necessitadas ou socialmente fracas; “os pobres” é direto e natural no contexto.
- source_word: יָדָיו
  choice: suas próprias mãos
  rationale: “Mãos” traduz literalmente o plural, e “próprias” ressalta que a restituição será feita pessoalmente por ele.
- source_word: תָּשֵׁבְנָה
  choice: devolverão
  rationale: O hifil de שוב significa fazer voltar, devolver ou restituir; “devolverão” é claro e idiomático.
- source_word: אוֹנוֹ
  choice: sua riqueza
  rationale: אוֹן pode indicar riqueza, bens, recursos ou força. O contexto de restituição aos pobres favorece o sentido material de “riqueza”.
theological_decisions: []
