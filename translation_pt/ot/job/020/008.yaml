base_translation:
  language: en
  yaml_path: translation/ot/job/020/008.yaml
  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: pt
  text: Como um sonho, ele voa para longe e não é encontrado[a]; é afugentado como uma visão da noite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não o encontram”. O hebraico emprega um verbo no plural com sujeito indefinido e um sufixo de objeto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como uma visão noturna”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Como um sonho
  rationale: O prefixo כְּ marca comparação, e חֲלוֹם significa “sonho”. A formulação mantém de modo natural a imagem poética.
- source_word: יָעוּף
  choice: ele voa
  rationale: O verbo עוּף significa literalmente “voar”. A tradução conserva a imagem vívida de desaparecimento rápido, sem reduzi-la a “desaparece”.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: e não é encontrado
  rationale: Embora o hebraico tenha verbo ativo no plural indefinido, literalmente “e não o encontram”, a construção passiva é idiomática em português e mantém o foco naquele que desaparece.
- source_word: וְיֻדַּד
  choice: é afugentado
  rationale: A forma passiva expressa ser impelido ou enxotado para longe. “Afugentado” preserva esse movimento sem exigir que o agente seja identificado.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: como uma visão da noite
  rationale: חֶזְיוֹן significa “visão”, e לָיְלָה pode funcionar aqui como complemento genitivo. A expressão conserva o tom poético e a estrutura hebraica.
