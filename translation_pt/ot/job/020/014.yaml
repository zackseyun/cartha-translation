translation:
  language: pt
  text: A comida, em seu ventre, se transforma[a]; é veneno de cobras dentro dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu pão, em suas entranhas, se altera; é fel de áspides dentro dele”.'
    reason: Alternativas lexicais mais literais para לַחְמוֹ, בְּמֵעָיו, נֶהְפָּךְ, מְרוֹרַת e פְּתָנִים.
lexical_decisions:
- source_word: לַחְמוֹ
  choice: a comida
  rationale: Embora לֶחֶם signifique literalmente “pão” em muitos contextos, aqui designa de modo mais amplo aquilo que ele comeu. “A comida” soa natural em português e mantém a imagem concreta da digestão.
- source_word: בְּמֵעָיו
  choice: em seu ventre
  rationale: O termo se refere às entranhas ou aos órgãos internos. “Em seu ventre” é corrente, digno e adequado à imagem corporal do versículo.
- source_word: נֶהְפָּךְ
  choice: se transforma
  rationale: O nifal de הפך indica mudança de estado. “Se transforma” expressa claramente que a comida passa a ser algo nocivo, sem especificar além do hebraico como ocorre essa mudança.
- source_word: מְרוֹרַת
  choice: veneno de
  rationale: Embora o substantivo possa evocar “amargor” ou “fel”, em associação com serpentes refere-se ao veneno. “Veneno” comunica diretamente a imagem ao leitor moderno.
- source_word: פְּתָנִים
  choice: cobras
  rationale: O hebraico designa serpentes venenosas, tradicionalmente chamadas de “áspides”. “Cobras” é uma equivalência moderna amplamente compreensível, sem pretender uma identificação zoológica absolutamente certa.
- source_word: בְּקִרְבּוֹ
  choice: dentro dele
  rationale: A expressão localiza o veneno no interior do homem. “Dentro dele” é natural em português e preserva a força corporal da imagem.
