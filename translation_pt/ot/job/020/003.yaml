lexical_decisions:
- source_word: מוּסַר
  choice: repreensão
  rationale: No contexto, indica uma censura verbal recebida por Zofar; “repreensão” comunica isso melhor do que o sentido mais amplo de disciplina ou instrução.
- source_word: כְּלִמָּתִי
  choice: que me humilha
  rationale: A construção associa a repreensão à humilhação ou desonra do falante. A oração relativa é natural em português e preserva essa relação.
- source_word: אֶשְׁמָע
  choice: Ouço
  rationale: Expressa de modo direto a recepção presente da repreensão, conforme o imperfeito hebraico no contexto.
- source_word: רוּחַ
  choice: o espírito
  rationale: Preserva a imagem hebraica do impulso ou disposição interior sem reduzi-la interpretativamente a “mente”.
- source_word: מִבִּינָתִי
  choice: que vem do meu entendimento
  rationale: 'Torna explícito e natural em português o valor de origem da preposição מִן: o impulso interior procede do entendimento do falante.'
- source_word: יַעֲנֵנִי
  choice: me responde
  rationale: Representa diretamente o sentido comum do Qal de ענה com o sufixo de primeira pessoa, preservando a imagem de uma resposta interior.
