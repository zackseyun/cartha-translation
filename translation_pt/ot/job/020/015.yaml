    issue: Possível ambiguidade do referente em “do seu ventre”.
    rationale: O hebraico מִבִּטְנוֹ se refere ao homem que engoliu as riquezas, não a Deus. Em português, o possessivo “seu” após “Deus” pode momentaneamente sugerir que o ventre seja o de Deus. “Do ventre dele” torna o referente inequívoco.
  revised_text: Engoliu riquezas[a], mas as vomitará; Deus as expulsará do ventre dele.
