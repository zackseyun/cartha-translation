  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: pt
  text: Engoliu riquezas[a], mas as vomitará; Deus as expulsará do ventre dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bens” ou “fortuna” (חַיִל).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: riquezas
  rationale: Neste contexto sapiencial, o termo designa bens ou recursos materiais. “Riquezas” é natural em português e corresponde ao ganho que o perverso engoliu figuradamente.
- source_word: בָּלַע
  choice: engoliu
  rationale: Preserva a metáfora concreta de ingestão, retomada por “vomitará” e “ventre”.
- source_word: וַיְקִאֶנּוּ
  choice: mas as vomitará
  rationale: O verbo significa “vomitar”. A conjunção adversativa torna clara a reversão poética sem alterar o sentido; o pronome plural retoma naturalmente “riquezas” em português.
- source_word: מִבִּטְנוֹ
  choice: do seu ventre
  rationale: Mantém a imagem corporal vívida do hebraico בֶּטֶן e evita a formulação mais clínica “estômago”.
- source_word: יוֹרִשֶׁנּוּ
  choice: as expulsará
  rationale: 'O hifil expressa ação causativa: Deus fará com que as riquezas sejam retiradas do interior dele. “Expulsará” conserva a força da imagem.'
- source_word: אֵל
  choice: Deus
  rationale: É a tradução direta do termo singular אֵל neste contexto e preserva explicitamente a agência divina.
theological_decisions:
- issue: Agência do juízo na expulsão das riquezas do perverso
  choice: Deus é explicitamente o sujeito que expulsa as riquezas.
  alternative: Apresentar a perda como consequência impessoal ou deixar o agente indefinido.
  rationale: O hebraico nomeia אֵל como sujeito de יוֹרִשֶׁנּוּ; por isso, a tradução preserva a agência divina explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A metáfora corporal — engolir, vomitar e ventre — foi preservada. A concordância pronominal plural (“as”) segue o substantivo português “riquezas”, embora o hebraico empregue sufixo singular retomando חַיִל.
