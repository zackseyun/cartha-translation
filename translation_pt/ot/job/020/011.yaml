base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: pt
  text: Seus ossos estão cheios do vigor de sua juventude[a], mas esse vigor se deitará com ele no pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus ossos estão cheios de sua juventude”; o termo hebraico pode indicar a própria juventude ou o vigor associado a ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: seus ossos
  rationale: Preserva a imagem concreta do hebraico, cujo substantivo significa normalmente “ossos”.
- source_word: מָלְאוּ
  choice: estavam cheios
  rationale: O qal perfeito, com o sujeito plural “ossos”, descreve o vigor que caracterizava sua juventude; o imperfeito português evita sugerir um simples evento pontual.
- source_word: עֲלוּמָיו
  choice: do vigor da juventude
  rationale: O termo pode indicar tanto a juventude como a força própria dessa fase; a formulação comunica o sentido contextual sem eliminar a alternativa lexical.
- source_word: וְעִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a ideia de acompanhamento, aqui até a morte e o pó.
- source_word: עַל־עָפָר
  choice: no pó
  rationale: Embora a preposição seja literalmente “sobre”, “no pó” expressa naturalmente em português a imagem bíblica de morte e sepultamento.
- source_word: תִּשְׁכָּב
  choice: se deitará
  rationale: O qal imperfeito feminino singular é entendido em sentido futuro, retomando a juventude ou o vigor juvenil que acompanhará o homem ao pó.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível. A repetição de “vigor” na segunda oração esclarece o referente singular implícito do verbo hebraico e evita o pronome ambíguo “ele”, que em português poderia parecer referir-se ao homem.
