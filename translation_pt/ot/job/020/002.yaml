  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: pt
  text: Por isso, meus pensamentos me fazem responder[a], por causa da agitação que há dentro de mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus pensamentos me respondem” ou “meus pensamentos inquietos respondem dentro de mim”. A expressão hebraica é condensada e pode indicar tanto pensamentos que respondem no íntimo quanto pensamentos que o impelem a responder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa da pressa que há em mim”. O termo hebraico pode ter o sentido de pressa, mas, neste contexto, provavelmente se refere à agitação interior ou à urgência exaltada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a consequência ou inferência em relação ao discurso anterior, com naturalidade em português moderno.
- source_word: שְׂעִפַּי
  choice: meus pensamentos
  rationale: Preserva o substantivo sem acrescentar explicitamente um adjetivo emocional; a ideia de inquietação aparece na segunda oração.
- source_word: יְשִׁיבוּנִי
  choice: me fazem responder
  rationale: O hifil de שוב, nesta construção poética comprimida, pode indicar que os pensamentos impelem o falante a dar uma resposta. A nota conserva a alternativa mais literal de que eles lhe respondem interiormente.
- source_word: וּבַעֲבוּר
  choice: por causa de
  rationale: Expressa claramente a relação causal; a conjunção prefixada é incorporada com naturalidade à sintaxe portuguesa.
- source_word: חוּשִׁי
  choice: a agitação
  rationale: Embora o termo possa relacionar-se à pressa, no contexto indica provavelmente urgência excitada ou agitação interior.
- source_word: בִי
  choice: que há dentro de mim
  rationale: Mantém de modo explícito a localização interna indicada pela preposição com sufixo de primeira pessoa.
