  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: pt
  text: Ele a puxa para fora[a], e ela sai do seu corpo; uma ponta reluzente sai de sua vesícula biliar; terrores vêm sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele a saca”. O objeto é implícito no hebraico; no contexto, trata-se provavelmente de uma arma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: Ele a arranca
  rationale: O verbo significa puxar ou sacar. O objeto está implícito, mas o contexto indica a arma cravada no corpo; o pronome feminino retoma naturalmente essa arma em português.
- source_word: וַיֵּצֵא
  choice: e ela sai
  rationale: O verbo indica sair. A formulação direta conserva a sequência vívida da retirada da arma e de sua saída do corpo.
- source_word: מִגֵּוָה
  choice: do seu corpo
  rationale: גֵּוָה pode designar o corpo ou torso. “Corpo” é claro e evita especificar uma região anatômica além do que o hebraico exige.
- source_word: וּבָרָק
  choice: uma ponta reluzente
  rationale: בָּרָק denota relâmpago ou brilho fulgurante e, neste contexto, provavelmente descreve por metonímia a ponta brilhante da arma. O artigo indefinido corresponde à ausência de artigo no hebraico.
- source_word: מִמְּרֹרָתוֹ
  choice: de sua vesícula biliar
  rationale: O termo pode designar a vesícula biliar, o fel ou, figuradamente, a amargura. A cena de ferimento favorece o sentido anatômico; “vesícula biliar” torna a imagem corporal compreensível em português moderno.
- source_word: יַהֲלֹךְ עָלָיו
  choice: vêm sobre ele
  rationale: A construção com הלך e על descreve algo que sobrevém à pessoa. “Vêm sobre ele” preserva a imagem e concorda com o sujeito plural.
- source_word: אֵמִים
  choice: terrores
  rationale: O substantivo plural expressa terrores ou coisas aterradoras. “Terrores” conserva tanto o número quanto a intensidade.
