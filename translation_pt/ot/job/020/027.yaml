id: JOB.20.27
reference: Job 20:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְגַלּ֣וּ שָׁמַ֣יִם עֲוֺנ֑/וֹ וְ֝/אֶ֗רֶץ מִתְקוֹמָ֘מָ֥ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: pt
  text: Os céus revelarão a sua iniquidade[a], e a terra se levantará contra ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua culpa”; a palavra hebraica pode indicar tanto a conduta perversa como a culpa decorrente dela.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “o país se levantará contra ele”, embora “a terra” corresponda melhor ao paralelismo com “os céus” neste contexto poético.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: revelarão
  rationale: O piel imperfeito de גלה indica tornar conhecido ou expor; “revelarão” é natural em português e preserva o tom judicial e poético.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural hebraico, embora possa funcionar coletivamente, é bem representado por “os céus”, que mantém o registro elevado e a personificação cósmica.
- source_word: עֲוֺנוֹ
  choice: a sua iniquidade
  rationale: עָוֹן pode indicar tanto a perversidade moral como a culpa decorrente dela. “Iniquidade” preserva o peso moral no contexto de acusação, sem eliminar a alternativa lexical.
- source_word: וְאֶרֶץ
  choice: e a terra
  rationale: Embora אֶרֶץ também possa significar “terra” no sentido de região ou país, aqui “a terra” corresponde melhor ao paralelismo cósmico com “os céus”.
- source_word: מִתְקוֹמָמָה
  choice: se levantará
  rationale: A forma verbal de קום descreve levantar-se em oposição; a construção reflexiva conserva a personificação vívida do hebraico.
- source_word: לוֹ
  choice: contra ele
  rationale: Com o verbo de levantar-se em hostilidade, ל tem sentido adversativo; “contra ele” expressa naturalmente essa relação em português.
theological_decisions:
- issue: Referência da exposição cósmica
  choice: Os céus expõem a iniquidade do ímpio, e a terra se levanta contra ele.
  alternative: Os céus expõem a culpa do ímpio.
  rationale: O texto permite que עָוֹן denote o ato perverso ou a culpa vinculada a ele. A tradução mantém “iniquidade” no corpo e registra “culpa” em nota, sem resolver além do hebraico.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo entre “os céus” e “a terra” e a personificação de ambos foram preservados.
