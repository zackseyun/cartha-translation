  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/021.yaml
  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: pt
  text: Nada restou para ele devorar[a]; por isso, sua prosperidade não durará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Não houve sobrevivente para o seu comer”, isto é, nada restou daquilo que ele consumia.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “durará” é difícil; outras possibilidades são “permanecerá” ou, com menor probabilidade neste contexto, “prosperará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Nada restou
  rationale: A expressão combina a negação existencial com שָׂרִיד, literalmente “sobrevivente” ou “remanescente”. No contexto, indica que nada escapou ao consumo do perverso nem ficou de sobra.
- source_word: לְאָכְלוֹ
  choice: para ele devorar
  rationale: O infinitivo de אכל significa literalmente “comer”. “Devorar” comunica de modo natural o consumo voraz sugerido pelo contexto, sem eliminar em nota a forma mais literal.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressão inferencial comum que introduz a consequência da afirmação anterior.
- source_word: לֹא יָחִיל
  choice: não durará
  rationale: O verbo יָחִיל é difícil neste contexto. “Não durará” expressa de maneira concisa a leitura segundo a qual a prosperidade não continuará, preservando em nota alternativas plausíveis.
- source_word: טוּבוֹ
  choice: sua prosperidade
  rationale: Embora טוּב possa designar o “bem” ou as “coisas boas” de alguém, aqui se refere naturalmente aos bens, ao bem-estar ou à boa fortuna do perverso.
