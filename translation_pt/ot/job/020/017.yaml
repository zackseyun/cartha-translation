base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: pt
  text: Não verá as correntes,[a] os rios, os ribeiros de mel e coalhada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não verá os canais, os rios, os uádis de mel e coalhada».'
    reason: Alternativa lexical que preserva outras possibilidades para os três termos hebraicos referentes a cursos de água.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Não verá
  rationale: No discurso poético, אַל com o imperfeito expressa que o ímpio não chegará a ver nem desfrutar a abundância retratada; o futuro negativo é natural em português.
- source_word: בִפְלַגּוֹת
  choice: os canais
  rationale: פְלַגּוֹת designa divisões ou canais de água. A preposição ב é entendida idiomaticamente com o verbo de percepção, sem a tradução rígida «em».
- source_word: נַהֲרֵי
  choice: os rios
  rationale: É o plural construto de נָהָר, «rios», e mantém a acumulação poética de cursos de água.
- source_word: נַחֲלֵי
  choice: os ribeiros de
  rationale: נַחֲלֵי pode designar ribeiros, torrentes ou uádis. «Ribeiros» conserva o terceiro termo da sequência hebraica e comunica com clareza a imagem de água corrente.
- source_word: דְּבַשׁ
  choice: mel
  rationale: Equivalente português habitual, apropriado à imagem bíblica de fartura.
- source_word: וְחֶמְאָה
  choice: e coalhada
  rationale: חֶמְאָה pode indicar coalhada, nata ou manteiga. «Coalhada» preserva a imagem de um produto lácteo espesso sem sugerir necessariamente manteiga processada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração de três cursos de água foi mantida para não omitir נַחֲלֵי nem eliminar a intensificação poética do hebraico.
