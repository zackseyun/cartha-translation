  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: pt
  text: 'Como o seu próprio esterco[a], ele perecerá para sempre; os que o viram dirão: “Onde está ele?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como os seus próprios dejetos” ou “Como o seu próprio excremento, ele perecerá para sempre”. O hebraico emprega uma imagem deliberadamente humilhante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Como seu próprio esterco
  rationale: גֶּלֶל designa esterco ou excremento. “Esterco” é direto e natural em português, preserva a imagem deliberadamente humilhante e, com “seu próprio”, expressa o sufixo possessivo.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: נֶצַח indica duração permanente; “para sempre” conserva a força da completa e duradoura extinção no contexto poético de juízo.
- source_word: יֹאבֵד
  choice: perecerá
  rationale: O verbo אבד comunica perecimento ou ruína. “Perecerá” mantém essa força e se ajusta ao registro poético, sem reduzi-lo ao simples desaparecimento.
- source_word: רֹאָיו
  choice: os que o viram
  rationale: O particípio com sufixo se refere aos que o viam ou o haviam visto. “Os que o viram” é idiomático e aponta naturalmente para pessoas que o conheceram antes de sua queda.
- source_word: יֹאמְרוּ
  choice: dirão
  rationale: אמר significa diretamente “dizer”; a expressão interrogativa seguinte deixa claro que a fala assume a forma de pergunta.
- source_word: אַיּוֹ
  choice: Onde está ele?
  rationale: A forma interrogativa com sufixo pergunta pela localização dele. A tradução simples evita acrescentar elementos interpretativos como “agora” ou “para onde foi”.
