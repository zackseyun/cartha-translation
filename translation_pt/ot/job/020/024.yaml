  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: pt
  text: Fugirá de uma arma de ferro; um arco de bronze o atravessará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o traspassará”. Literalmente, “passará através dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: Fugirá
  rationale: O qal imperfeito de ברח indica fugir ou escapar; neste contexto poético de juízo, o futuro comunica bem o sentido.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: de uma arma de ferro
  rationale: נשק pode designar armamento em sentido amplo; aqui o singular natural, qualificado por בַּרְזֶל, preserva a imagem de uma arma feita de ferro.
- source_word: תַּחְלְפֵהוּ
  choice: o atravessará
  rationale: חלף tem o sentido básico de passar ou atravessar. Com o arco como sujeito e o homem como objeto, descreve poeticamente o projétil atravessando-o, sem explicitar além do hebraico o substantivo implícito 'flecha'.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: um arco de bronze
  rationale: קֶשֶׁת é 'arco', e נְחוּשָׁה designa bronze ou cobre; 'bronze' é a opção histórica e idiomática adequada à imagem bélica.
