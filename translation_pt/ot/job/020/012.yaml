  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: pt
  text: Embora o mal seja doce em sua boca[a], ele o esconde debaixo da sua língua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se o mal é doce em sua boca”. A partícula hebraica pode ser entendida em sentido condicional (“se”) ou concessivo (“embora”); o contexto favorece o sentido concessivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Embora
  rationale: A partícula pode ser condicional ou concessiva. No fluxo da descrição do perverso, o valor concessivo é natural, sem eliminar a alternativa na nota.
- source_word: תַּמְתִּיק
  choice: seja doce
  rationale: O hifil de מתק pode significar “tornar doce” e, idiomaticamente com רָעָה como sujeito, “ser doce/agradável”. A formulação preserva a metáfora do paladar em português natural.
- source_word: בְּפִיו
  choice: em sua boca
  rationale: Traduz literalmente פֶּה e mantém a imagem concreta desenvolvida no paralelo “debaixo da língua”.
- source_word: רָעָה
  choice: o mal
  rationale: Neste contexto sapiencial, designa o mal moral saboreado pelo perverso; “o mal” é amplo, claro e natural.
- source_word: יַכְחִידֶנָּה
  choice: ele o esconde
  rationale: O verbo no hifil expressa ocultação; o pronome retoma “o mal” segundo o gênero exigido em português.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: debaixo da língua
  rationale: Preserva a imagem espacial vívida de reter ou saborear secretamente o mal.
