source:
  edition: WLC
  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: pt
  text: Toda escuridão está guardada para os seus tesouros[a]; um fogo não atiçado[b] o consumirá; ele prejudicará o sobrevivente em sua tenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda escuridão está reservada para ele”. A expressão hebraica que envolve “suas coisas ocultas/seus tesouros” é difícil e pode se referir tanto à calamidade reservada para ele como ao que está escondido entre as suas reservas.'
    reason: alternative_reading
  - marker: b
    text: “Um fogo não atiçado” pode indicar um fogo que não foi aceso ou avivado pelo sopro humano, sugerindo um fogo enviado por Deus ou que não depende de ação humana.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “prejudicará o remanescente em sua tenda” ou “consumirá o que restar em sua tenda”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Toda escuridão
  rationale: Preserva a imagem abrangente de trevas, que no contexto sugere calamidade e juízo sem substituir a metáfora por uma explicação.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: está guardada para os seus tesouros
  rationale: “Guardada” mantém tanto a ideia de algo escondido como a de algo reservado. A expressão hebraica é difícil, e “para os seus tesouros” conserva a possível referência às reservas ocultas do perverso sem eliminar a leitura de calamidade reservada para ele.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: um fogo ... o consumirá
  rationale: O verbo hebraico significa literalmente comer ou devorar; com fogo como sujeito, “consumirá” é natural em português e mantém sua força destrutiva.
- source_word: לֹא נֻפָּח
  choice: não atiçado
  rationale: Expressa um fogo que não foi avivado pelo sopro humano. A formulação é natural em português e deixa implícita, sem impor, a possibilidade de origem divina.
- source_word: יֵרַע שָׂרִיד
  choice: devorará o que restar
  rationale: No paralelismo com o fogo que consome, esta formulação apresenta a ação destrutiva sobre o remanescente, mas a nota registra a dificuldade lexical e a possível referência a um sobrevivente.
- source_word: בְּאָהֳלוֹ
  choice: em sua tenda
  rationale: Mantém a imagem concreta do hebraico, que também pode representar a casa ou a família da pessoa.
theological_decisions:
- issue: Possível agente divino no “fogo não atiçado”
  choice: Manter apenas a imagem do fogo não atiçado no texto
  alternative: Explicitar “um fogo enviado por Deus”
  rationale: O hebraico não nomeia o agente; explicitar Deus resolveria uma implicação teológica que o texto deixa aberta.
- issue: Identidade do que resta na tenda
  choice: Usar a expressão impessoal “o que restar”
  alternative: Traduzir como “o sobrevivente”
  rationale: שָׂרִיד pode designar um sobrevivente ou um remanescente. A escolha principal se ajusta à imagem do fogo consumindo tudo, enquanto a nota preserva a leitura pessoal.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira e vocabulário amplamente internacional. “Tenda” conserva a imagem concreta de Jó; “atiçado” é corrente e mais natural do que uma reprodução mecânica de “soprado”. As notas preservam as ambiguidades reais do hebraico.
