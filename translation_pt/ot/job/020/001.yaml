  yaml_path: translation/ot/job/020/001.yaml
  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: pt
  text: Então Zofar, o naamatita, respondeu e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Zofar, o naamatita, respondeu e disse.”'
    reason: Alternativa lexical para o waw narrativo inicial.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Na fórmula narrativa do diálogo, ענה significa normalmente “responder”. A escolha preserva a forma convencional e indica que Zofar reage ao discurso anterior.
- source_word: צֹפַר
  choice: Zofar
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַנַּעֲמָתִי
  choice: o naamatita
  rationale: O gentílico com artigo identifica Zofar por sua procedência ou associação com Naamá; “naamatita” é uma forma portuguesa clara e tradicional.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: אמר é o verbo comum para “dizer”. Manter “respondeu e disse” reproduz o paralelismo formular hebraico sem paráfrase desnecessária.
- source_word: וַ
  choice: Então
  rationale: O waw inicial faz a narrativa avançar. “Então” expressa com naturalidade a sequência em português; a nota registra a alternativa formal “E”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a fórmula semítica “respondeu e disse” por sua correspondência direta com o hebraico, embora seja menos idiomática na fala cotidiana.
