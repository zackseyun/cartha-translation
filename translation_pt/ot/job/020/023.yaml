base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: pt
  text: Quando ele estiver prestes a encher o ventre, Deus enviará contra ele o ardor da sua ira e fará chover sobre ele o ardor da sua ira como seu alimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e fará chover sobre ele o ardor da sua ira enquanto ele come”. A expressão hebraica final é difícil e pode ligar o juízo que cai mais diretamente à comida ou ao momento de comer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא
  choice: Quando ele estiver prestes a encher
  rationale: A construção introduz a circunstância em que sobrevém o juízo. Esta formulação mantém a referência temporal e o infinitivo concreto “encher”, sem convertê-lo no mais interpretativo “saciar”.
- source_word: בִטְנוֹ
  choice: o ventre
  rationale: “Ventre” preserva a imagem corporal concreta e, em português corrente e digno, ajusta-se melhor ao registro poético do que “barriga” ou o clínico “estômago”.
- source_word: יְשַׁלַּח
  choice: Deus enviará
  rationale: O verbo significa “enviar”. Deus é o sujeito implícito mais natural no contexto; explicitá-lo evita a ambiguidade pronominal que surgiria em português entre o ímpio e aquele cuja ira é enviada.
- source_word: בּוֹ
  choice: contra ele
  rationale: A preposição indica aqui a direção hostil da ira contra o ímpio.
- source_word: חֲרוֹן אַפּוֹ
  choice: o ardor da sua ira
  rationale: Conserva a metáfora hebraica do calor ou ardor da ira em expressão natural e solene.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: e o fará chover sobre ele
  rationale: Mantém a imagem do juízo que cai como chuva. O pronome “o” retoma o ardor da ira, e עָלֵימוֹ é entendido como singular poético conforme o referente do contexto.
- source_word: בִּלְחוּמוֹ
  choice: como seu alimento
  rationale: A expressão difícil parece relacionar o juízo à comida ou ao ato de comer. “Como seu alimento” segue de perto a possibilidade instrumental/predicativa sem ocultar a incerteza, registrada em nota.
theological_decisions:
- issue: Sujeito implícito dos verbos de juízo
  choice: Explicitar “Deus” como sujeito de “enviará” e “fará chover”
  alternative: Manter apenas “ele”, ou empregar construção passiva/impessoal
  rationale: O contexto apresenta a retribuição divina, e “sua ira” aponta naturalmente para Deus. Em português, “ele” poderia ser confundido com o ímpio; a explicitação esclarece a sintaxe sem acrescentar uma afirmação teológica estranha ao contexto.
- issue: Relação da frase final com o alimento
  choice: “como seu alimento” no texto, com alternativa temporal em nota
  alternative: “enquanto ele come” ou “sobre a sua comida”
  rationale: O hebraico é lexical e sintaticamente difícil. A escolha preserva a ligação direta com alimento, mas a nota mantém aberta a leitura temporal plausível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ventre” preserva a força poética sem soar coloquial; a repetição de “ele” segue a estrutura do verso, enquanto “Deus” é explicitado para impedir confusão entre os referentes.
