  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: pt
  text: 'Veja agora: sua força está nos lombos, e seu vigor[a], nos músculos[b] do ventre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poder”; os dois termos hebraicos traduzidos como “força” e “vigor” têm sentidos muito próximos.
    reason: lexical_alternative
  - marker: b
    text: Ou “tendões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja agora
  rationale: A expressão chama enfaticamente a atenção para o que será descrito. “Veja agora” conserva a vivacidade do hebraico em português atual, sem recorrer ao mais arcaizante “eis”.
- source_word: כֹחוֹ
  choice: sua força
  rationale: כֹחַ indica força ou vigor; aqui descreve concretamente a robustez física da criatura.
- source_word: בְמָתְנָיו
  choice: nos lombos
  rationale: מָתְנַיִם designa a região dos lombos ou quadris. “Lombos” preserva a amplitude anatômica e o registro poético.
- source_word: וְאֹנוֹ
  choice: e seu vigor
  rationale: אוֹן pode significar força, vigor ou potência. “Vigor” mantém o paralelismo com “força” sem sugerir uma distinção semântica rígida entre os dois termos.
- source_word: בִּשְׁרִירֵי
  choice: nos músculos
  rationale: שְׁרִירִים pode referir-se aos músculos, tendões ou partes firmes do corpo. “Músculos” é a opção anatômica mais clara e natural para leitores modernos.
- source_word: בִטְנוֹ
  choice: do ventre
  rationale: בֶּטֶן, neste contexto anatômico, refere-se ao ventre ou abdômen. “Ventre” é claro, digno e adequado à poesia.
