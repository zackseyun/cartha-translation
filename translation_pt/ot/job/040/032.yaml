  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: pt
  text: Ponha a mão sobre ele; lembre-se da batalha e não tente de novo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não acrescente”; isto é, “não repita a tentativa” ou “não tente de novo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: Ponha
  rationale: O imperativo de שׂים indica colocar a mão sobre o Leviatã; “ponha” é direto e natural em português.
- source_word: עָלָיו
  choice: sobre ele
  rationale: A preposição עַל com sufixo masculino singular significa naturalmente “sobre ele” e preserva a imagem física.
- source_word: כַּפֶּךָ
  choice: a mão
  rationale: Embora כַּף possa designar a palma, “mão” é a expressão idiomática natural neste contexto; o possessivo é indicado pela forma verbal de segunda pessoa e pode ser explicitado como “a mão” em português sem perda.
- source_word: זְכֹר
  choice: lembre-se
  rationale: Mantém a força imperativa de זכר em linguagem portuguesa corrente.
- source_word: מִלְחָמָה
  choice: da batalha
  rationale: “Batalha” reproduz a imagem de combate expressa por מִלְחָמָה, sem reduzi-la a uma simples dificuldade.
- source_word: אַל תּוֹסַף
  choice: não tente de novo
  rationale: A expressão significa literalmente “não acrescente”, mas aqui adverte a não repetir a tentativa de pôr a mão sobre o Leviatã; “tente” explicita apenas o objeto elíptico dado pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção imperativa natural. A coordenação com “e não tente” preserva mais diretamente a forma negativa do hebraico, sem converter de modo definitivo a advertência em predição.
