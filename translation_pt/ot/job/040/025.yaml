  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: pt
  text: Você consegue puxar o Leviatã com um anzol[a] ou fazer descer sua língua com uma corda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puxar o Leviatã com um anzol”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “afundar sua língua com uma corda” ou “prender sua língua com uma corda”. A imagem hebraica é difícil e talvez se refira a dominar a criatura pela boca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: puxar
  rationale: O qal imperfeito de משׁך descreve puxar ou retirar; no contexto de pesca, “puxar” comunica naturalmente a tentativa de capturar e trazer o animal.
- source_word: לִוְיָתָן
  choice: o Leviatã
  rationale: Mantém a designação tradicional transliterada. Em português, o artigo definido é natural diante desse nome de criatura.
- source_word: בְּחַכָּה
  choice: com um anzol
  rationale: חכה designa um gancho usado na pesca; “anzol” expressa com precisão e naturalidade a imagem.
- source_word: וּבְחֶבֶל
  choice: com uma corda
  rationale: חבל pode significar corda ou cordão. “Corda” é clara, concreta e não restringe indevidamente o termo a uma linha de pesca.
- source_word: תַּשְׁקִיעַ
  choice: fazer ... baixar
  rationale: O hifil de שׁקע significa fazer afundar, descer ou baixar. A formulação conserva a imagem concreta e sua dificuldade sem especificar um método de contenção não declarado no hebraico.
- source_word: לְשֹׁנוֹ
  choice: sua língua
  rationale: Traduz diretamente o substantivo hebraico “língua”, sem substituí-lo interpretativamente por “boca”.
theological_decisions:
- issue: Identidade do Leviatã
  choice: Preservar “Leviatã” sem identificar a criatura
  alternative: Explicá-lo como crocodilo, monstro marinho ou ser mitológico
  rationale: O verso não resolve a identidade exata da criatura; manter a designação hebraica preserva a ambiguidade e evita importar uma interpretação específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi mantida, e a segunda oração conserva deliberadamente a estranheza da imagem hebraica. Todos os marcadores de nota aparecem no texto principal.
