  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: pt
  text: Pode alguém capturá-lo diante de seus olhos? Pode perfurar-lhe o nariz com laços?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele o capturará diante dos olhos dele? Perfurará seu nariz com armadilhas?” O hebraico é conciso e difícil; algumas traduções entendem os verbos de modo menos genérico.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “com laços”. Versões tradicionais às vezes empregam uma imagem mais próxima de “ganchos”, mas o substantivo normalmente se refere a laços ou armadilhas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: diante dos seus próprios olhos
  rationale: A construção com בְּ e “olhos” indica que a captura seria tentada abertamente, enquanto o animal vê; esta formulação preserva a imagem e evita entendê-la como meio instrumental.
- source_word: יִקָּחֶנּוּ
  choice: Pode alguém capturá-lo
  rationale: לקח significa literalmente “tomar”, mas, neste contexto de caça e domínio sobre um animal, “capturar” expressa naturalmente o sentido. A forma interrogativa explicita a força retórica exigida pelo contexto.
- source_word: בְּמוֹקְשִׁים
  choice: com laços
  rationale: מוֹקֵשׁ designa normalmente um laço, armadilha ou cilada, não especificamente um gancho. “Laços” conserva o valor lexical e a concisão do hebraico, embora a imagem seja difícil.
- source_word: יִנְקָב
  choice: perfurar
  rationale: נקב significa furar, perfurar ou atravessar por perfuração. “Perfurar” é claro, atual e apropriado à ação exercida sobre o nariz do animal.
- source_word: אָף
  choice: nariz
  rationale: Aqui אַף tem o sentido anatômico concreto de “nariz”, exigido pela ação de perfurar; “narina” seria possível, mas mais específico do que o termo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas retóricas acompanham o desafio do contexto; “seus próprios olhos” esclarece que os olhos são os do animal, e as notas preservam a dificuldade sintática e lexical do hebraico.
