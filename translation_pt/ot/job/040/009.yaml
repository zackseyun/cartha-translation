  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: pt
  text: Ou você tem um braço como o de Deus[a] e pode trovejar com uma voz como a dele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “como o de um deus”, caso אֵל seja entendido em sentido mais genérico; o contexto favorece fortemente “Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Ou você tem
  rationale: Na sequência de perguntas retóricas, introduz um novo desafio ligado ao anterior; “Ou você tem” transmite naturalmente essa força continuativa em português.
- source_word: זְרוֹעַ
  choice: braço
  rationale: Preserva a imagem concreta do hebraico, que também sugere força e poder sem substituir a metáfora por sua interpretação.
- source_word: כָּאֵל
  choice: como o de Deus
  rationale: O contexto favorece a referência a Deus; “como o de” explicita de modo idiomático que a comparação é entre braços.
- source_word: לָךְ
  choice: você tem
  rationale: Embora literalmente seja “para você”, a construção expressa posse e é naturalmente vertida pelo verbo “ter”.
- source_word: וּבְקוֹל
  choice: com uma voz
  rationale: A preposição indica o meio ou modo pelo qual se troveja.
- source_word: כָּמֹהוּ
  choice: como a dele
  rationale: O sufixo remete a Deus e, em português, a forma possessiva concorda naturalmente com “voz”.
- source_word: תַרְעֵם
  choice: pode trovejar
  rationale: A forma verbal comunica a capacidade de produzir ou emitir trovão; “trovejar” preserva a ressonância da manifestação divina na tempestade.
theological_decisions:
- issue: Referência de אֵל na comparação divina
  choice: Deus
  alternative: um deus
  rationale: No contexto imediato, é o próprio Deus quem desafia Jó quanto a atributos divinos. A forma definida “Deus” preserva o sentido contextual mais provável sem acrescentar uma afirmação doutrinária externa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A metáfora do braço e a imagem sonora de trovejar foram preservadas.
