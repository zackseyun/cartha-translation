  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: pt
  text: Pois os montes produzem alimento para ele,[a] e todos os animais selvagens do campo brincam ali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os montes dão sua produção para ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “e todos os animais do campo brincam ali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação da provisão concedida ao Beemote; “Pois” expressa naturalmente essa relação em português.
- source_word: בּוּל
  choice: alimento
  rationale: O termo designa a produção ou rendimento da terra; no contexto, “alimento” comunica com clareza sua função para o animal.
- source_word: הָרִים
  choice: os montes
  rationale: Traduz diretamente o plural definido e soa natural no registro poético bíblico em português.
- source_word: יִשְׂאוּ לוֹ
  choice: produzem para ele
  rationale: Com בּוּל, o verbo נשׂא tem o sentido idiomático de dar ou produzir o rendimento que alimenta o animal.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: e todos os animais selvagens
  rationale: A expressão hebraica coletiva refere-se aos animais silvestres terrestres; a formulação é atual e amplamente compreensível.
- source_word: יְשַׂחֲקוּ
  choice: brincam
  rationale: O Piel de שׂחק descreve atividade lúdica; “brincam” preserva o sentido sem recorrer a linguagem arcaica.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que remete ao ambiente dos montes mencionado na primeira oração.
