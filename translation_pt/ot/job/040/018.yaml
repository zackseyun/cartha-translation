  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: pt
  text: Seus ossos são tubos de bronze[a]; seus ossos são como uma barra de ferro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «condutos de bronze» ou «canais de bronze»; a imagem hebraica pode destacar condutos ou canais, e não especificamente tubos.
    reason: lexical_alternative
  - marker: b
    text: O hebraico pode também ser entendido como «uma peça fundida de ferro»; o termo traduzido por «ossos» pode, em alguns contextos, referir-se mais amplamente à estrutura corporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: seus ossos
  rationale: O substantivo עֶצֶם normalmente designa os ossos; o sentido anatômico direto também sustenta o paralelismo do verso.
- source_word: אֲפִיקֵי
  choice: tubos de
  rationale: אֲפִיקִים pode indicar canais ou condutos. Aplicado aos ossos, «tubos» conserva a imagem concreta de estruturas cilíndricas e resistentes, sem reduzi-la a uma afirmação genérica de força.
- source_word: נְחוּשָׁה
  choice: bronze
  rationale: נְחוּשָׁה pode referir-se a cobre ou bronze; na comparação poética de resistência e em paralelo com ferro, «bronze» é natural e provável.
- source_word: גְּרָמָיו
  choice: seus membros
  rationale: Embora גֶּרֶם possa significar «osso», «membros» preserva a variação poética e amplia a imagem da robustez corporal sem repetir a primeira linha.
- source_word: כִּמְטִיל
  choice: como barras de
  rationale: מָטִיל indica algo fundido ou moldado. Neste contexto corporal, «barras» comunica de modo claro a rigidez e a solidez pesada da imagem.
- source_word: בַּרְזֶל
  choice: ferro
  rationale: É o equivalente português habitual e forma o par metálico esperado com «bronze».
