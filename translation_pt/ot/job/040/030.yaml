  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: pt
  text: Será que os negociantes farão negócio a respeito dele? Será que o repartirão entre os mercadores?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Será que os companheiros farão dele um banquete?» O hebraico da primeira oração é difícil, e alguns entendem חַבָּרִים em sentido não comercial.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «cananeus»; neste contexto, provavelmente significa «mercadores».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: farão negócio
  rationale: Embora כרה normalmente signifique «cavar», aqui a construção com עַל e o paralelismo comercial favorecem o sentido idiomático de negociar ou fechar negócio.
- source_word: עָלָיו
  choice: por ele
  rationale: Na expressão de negociação, «por ele» comunica naturalmente em português que o animal é o objeto do negócio.
- source_word: חַבָּרִים
  choice: negociantes
  rationale: O substantivo pode significar companheiros ou associados, mas o paralelo com a distribuição entre mercadores favorece aqui um referente comercial.
- source_word: יֶחֱצוּהוּ
  choice: o repartirão
  rationale: חצה significa dividir ou repartir; esta escolha preserva a amplitude do verbo sem afirmar explicitamente que o animal seria cortado em pedaços.
- source_word: בֵּין
  choice: entre
  rationale: «Entre» é a forma portuguesa natural diante de um grupo plural.
- source_word: כְּנַעֲנִים
  choice: mercadores
  rationale: Embora a forma hebraica diga literalmente «cananeus», o termo pode designar mercadores por metonímia, sentido favorecido pelo contexto comercial.
