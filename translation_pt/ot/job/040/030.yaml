  source_fidelity: A estrutura interrogativa dupla, os agentes plurais e o paralelismo comercial são preservados. «Repartirão» traduz adequadamente יֶחֱצוּהוּ sem especificar corte em pedaços, e «mercadores» é uma interpretação contextual defensável de כְּנַעֲנִים, devidamente anotada. Contudo, «farão negócio por ele» em português pode sugerir agir em favor dele, em vez de negociar a seu respeito ou visando sua aquisição.
  naturalness: A revisão para «farão negócio a respeito dele» elimina essa ambiguidade e permanece natural em registro bíblico moderno. Na nota a, «farão um banquete com ele» pode sugerir que os companheiros comem juntamente com ele; «farão dele um banquete» expressa claramente a alternativa de consumir a criatura.
  terminology: «Negociantes» e «mercadores» mantêm o paralelismo comercial provável, sem apagar a alternativa não comercial de חַבָּרִים. A nota sobre «cananeus» preserva o termo hebraico subjacente.
