base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: pt
  text: Cinge os teus lombos como homem[a]; eu te interrogarei, e tu me farás saber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Prepara-te como um guerreiro”. Em hebraico, literalmente: “Cinge os teus lombos como homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Cinge
  rationale: O imperativo de אזר preserva a imagem concreta de prender a roupa à cintura para se preparar. A partícula נָא reforça a exortação, mas não exige aqui uma palavra temporal como “agora”; a força urgente é comunicada pelo imperativo.
- source_word: כְגֶבֶר
  choice: como homem
  rationale: גבר designa um homem e pode sugerir força ou valentia. “Como homem” conserva a expressão masculina e sua concisão, sem explicitar indevidamente “guerreiro”.
- source_word: חֲלָצֶיךָ
  choice: os lombos
  rationale: חֲלָצַיִם refere-se à região dos lombos ou da cintura. “Cingir os lombos” mantém a metáfora corporal e o idioma de preparação.
- source_word: אֶשְׁאָלְךָ
  choice: eu te interrogarei
  rationale: שאל significa perguntar; no desafio divino, “interrogar” transmite adequadamente a sequência de perguntas incisivas.
- source_word: וְהוֹדִיעֵנִי
  choice: e tu me farás saber
  rationale: 'O hifil de ידע tem sentido causativo: fazer saber, informar. A tradução conserva essa forma, em vez de reduzi-la ao mais interpretativo “responde-me”.'
theological_decisions:
- issue: Linguagem masculina em גבר
  choice: como homem
  alternative: como guerreiro / como homem forte
  rationale: A forma masculina dirigida a Jó é preservada. Embora גבר possa evocar vigor, traduzi-la por “guerreiro” tornaria explícita uma nuance possível, mas não obrigatória.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve solenidade adequada à fala divina. “Cinge os lombos” conserva deliberadamente o idioma concreto do hebraico; a nota oferece uma formulação mais dinâmica. O marcador [a] foi colocado após a frase inteira, à qual a alternativa se refere.
