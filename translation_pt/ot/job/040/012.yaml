  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: pt
  text: Olhe para todo orgulhoso e humilhe-o; esmague os perversos onde estão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no lugar deles”.'
    reason: Alternativa lexical para תַּחְתָּם, que pode indicar o lugar ocupado pelos perversos.
lexical_decisions:
- source_word: רְאֵה
  choice: Olhe para
  rationale: O imperativo dirige a atenção de Jó aos orgulhosos como alvos de juízo; “olhe para” é natural e preserva essa força.
- source_word: כָל גֵּאֶה
  choice: todo orgulhoso
  rationale: 'כָל com o adjetivo substantivado tem sentido distributivo: cada pessoa orgulhosa.'
- source_word: הַכְנִיעֵהוּ
  choice: humilhe-o
  rationale: O hifil imperativo de כנע com sufixo masculino singular significa fazer o orgulhoso baixar-se; a escolha preserva o contraste entre orgulho e humilhação.
- source_word: וַהֲדֹךְ
  choice: esmague
  rationale: O imperativo exprime abatimento violento e decisivo no contexto de juízo; “esmague” comunica essa intensidade sem ampliar o sentido.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa coletivamente os moralmente culpados; “os perversos” é uma formulação corrente e digna em português.
- source_word: תַּחְתָּם
  choice: onde estão
  rationale: A expressão pode indicar o lugar ocupado por eles, isto é, “onde estão”; a alternativa mais literal “no lugar deles” é preservada em nota.
theological_decisions:
- issue: Natureza da ordem dada a Jó
  choice: Manter os imperativos como desafio divino que descreve atos de juízo.
  alternative: Entender as palavras como concessão literal de autoridade a Jó para executar o juízo divino.
  rationale: O contexto apresenta ações próprias do governo de Deus para desafiar Jó. A tradução conserva a força imperativa sem declarar se Jó recebeu de fato tal autoridade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O singular distributivo foi mantido em “todo orgulhoso” e retomado por “-o”. A nota foi posicionada junto de “onde estão”, expressão à qual corresponde.
