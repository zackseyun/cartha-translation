base_translation:
  language: en
  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: pt
  text: Yahweh respondeu a Jó e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também vertido como “Jeová”.'
    reason: Registra a forma hebraica do nome divino e uma forma alternativa conhecida em português.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa “responder”. A escolha preserva a estrutura explícita do hebraico e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino, em vez de ser substituído por um título.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: A partícula assinala “Jó” como objeto direto e não possui equivalente lexical natural em português.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: אמר é o verbo comum para “dizer”. A tradução mantém os dois verbos de fala presentes no original — “respondeu” e “disse” — sem apagar a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente pelo título “SENHOR”; a nota registra uma forma portuguesa alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Então” expressa naturalmente a progressão narrativa de וַ־; a fórmula solene “respondeu a Jó e disse” é mantida por refletir os dois verbos do hebraico.
