  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: pt
  text: Veja agora o Beemote[a], que fiz junto com você; ele come capim como o boi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fera”. Muitos intérpretes entendem “Beemote” como o nome ou a designação de uma criatura específica; outros o identificam com o hipopótamo ou com outro animal de grande porte.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja agora
  rationale: A combinação chama a atenção do interlocutor com imediatismo. “Veja agora” é natural em português moderno e preserva a força discursiva sem o tom arcaico de “eis”.
- source_word: בְהֵמוֹת
  choice: Beemote
  rationale: No contexto, o termo funciona como designação de uma criatura específica. A transliteração tradicional em português preserva a força literária e evita impor uma identificação zoológica incerta.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que fiz
  rationale: Traduz diretamente a oração relativa e o sentido comum do verbo עשה, com formulação idiomática e concisa.
- source_word: עִמָּךְ
  choice: junto com você
  rationale: 'Expressa acompanhamento ou associação na criação: Deus fez essa criatura assim como fez o interlocutor, sem sugerir necessariamente proximidade física.'
- source_word: חָצִיר
  choice: capim
  rationale: O substantivo indica erva ou vegetação herbácea. “Capim” é claro e natural no contexto da alimentação de um grande animal.
- source_word: כַבָּקָר
  choice: como o boi
  rationale: Preserva a comparação vívida com o gado bovino. O singular “o boi” funciona naturalmente em português como referência representativa.
- source_word: יֹאכֵל
  choice: ele come
  rationale: Mantém o verbo no presente e a referência masculina singular à criatura, conforme a construção hebraica.
theological_decisions:
- issue: Identificação de בְהֵמוֹת
  choice: Tratar o termo como nome ou designação de uma criatura específica e transliterá-lo como “Beemote”.
  alternative: Traduzir genericamente como “a fera” ou identificá-lo especificamente como hipopótamo ou outro animal de grande porte.
  rationale: A forma hebraica e o contexto poético permitem entender o termo como designação particular, mas não estabelecem com segurança uma espécie zoológica. A transliteração preserva essa ambiguidade e evita introduzir certeza interpretativa ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” comunica diretamente o singular hebraico; “capim” é corrente e concreto. A ordem da frase acompanha de perto o hebraico sem soar artificial.
