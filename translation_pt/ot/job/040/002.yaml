  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: pt
  text: Será que quem contende com o Todo-Poderoso o corrigirá?[a] Quem discute com Deus responda a isso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que o crítico do Todo-Poderoso o instruirá ou repreenderá?” O hebraico combina linguagem de disputa, correção e repreensão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “responda a isto” ou “responda-lhe”. O sufixo hebraico pode apontar para a questão levantada, em vez de se referir diretamente a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: Acaso quem contende
  rationale: O termo deriva de ריב, “contender, disputar, pleitear”. A construção interrogativa com “acaso” preserva a força retórica, e “quem contende” expressa de modo natural o sentido jurídico e controverso.
- source_word: עִם
  choice: com
  rationale: A preposição significa literalmente “com” e, neste contexto de disputa, também comunica oposição sem precisar explicitar “contra”.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução tradicional e inteligível do título divino שַׁדַּי, adequada ao uso recorrente no livro de Jó.
- source_word: יִסּוֹר
  choice: vai corrigi-lo
  rationale: O verbo יסר pode significar disciplinar, instruir, repreender ou corrigir. Aqui, a sintaxe e o paralelismo apresentam o ser humano como quem presume corrigir o Todo-Poderoso. A forma “vai corrigi-lo?” transmite bem a censura retórica.
- source_word: מוֹכִיחַ
  choice: Quem contesta
  rationale: O particípio de יכח pode designar quem argumenta, repreende ou pleiteia uma causa. “Contesta” mantém o tom jurídico e a ideia de questionar Deus, em linguagem corrente e concisa.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Esta forma poética singular, frequente em Jó, é adequadamente traduzida por “Deus”, sem acréscimo de ênfase ausente no hebraico.
- source_word: יַעֲנֶנָּה
  choice: responda a isso
  rationale: O verbo significa “responder”. O sufixo feminino singular provavelmente aponta para a questão ou acusação levantada, por isso “a isso” é natural em português; a referência permanece suficientemente ambígua para justificar nota.
theological_decisions:
- issue: Se o versículo retrata um ser humano corrigindo Deus ou Deus corrigindo um ser humano
  choice: A pergunta retórica apresenta o contendiente humano como alguém que presume corrigir o Todo-Poderoso.
  alternative: O que contende com o Todo-Poderoso deve aceitar correção.
  rationale: A sintaxe e o paralelismo favorecem o contendiente humano como sujeito de יִסּוֹר. A segunda oração reforça essa leitura ao exigir uma resposta daquele que contesta Deus, preservando a força da repreensão divina sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” marca a pergunta retórica; “contende” e “contesta” preservam o campo jurídico-discursivo sem tornar a frase excessivamente técnica. As notas mantêm as ambiguidades reais dos verbos e do sufixo hebraico.
