  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: pt
  text: Será que ele lhe fará muitas súplicas[a] ou lhe falará com palavras suaves[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedidos de misericórdia”. O termo hebraico indica pedidos insistentes por favor ou misericórdia.
    reason: lexical_alternative
  - marker: b
    text: Ou “palavras gentis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: Será que ele fará muitas
  rationale: Representa a partícula interrogativa e o sentido causativo de רבה de modo natural em português, preservando a ideia de multiplicar pedidos.
- source_word: אֵלֶיךָ
  choice: lhe
  rationale: Expressa de maneira idiomática a direção “a você” com referência ao interlocutor singular.
- source_word: תַּחֲנוּנִים
  choice: súplicas
  rationale: O termo designa pedidos insistentes por favor ou misericórdia; “súplicas” é claro, digno e preciso em português.
- source_word: אִם
  choice: ou
  rationale: No paralelismo interrogativo, introduz a segunda alternativa, não uma condição.
- source_word: יְדַבֵּר
  choice: falará
  rationale: Traduz diretamente o verbo דבר e produz uma construção natural em português.
- source_word: רַכּוֹת
  choice: com palavras suaves
  rationale: O adjetivo feminino plural funciona substantivamente e se refere a uma fala branda; a explicitação de “palavras” é natural e evita sugerir necessariamente lisonja.
