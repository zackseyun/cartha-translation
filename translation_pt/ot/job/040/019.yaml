  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: pt
  text: Ele é o primeiro entre as obras de Deus[a]; que aquele que o fez aproxime sua espada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele é o principal dos caminhos de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico da oração final é difícil. Pode significar: “somente seu Criador pode aproximar-se dele com a espada” ou “aquele que o fez o proveu de uma espada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: o primeiro
  rationale: Expressa primazia e, possivelmente, precedência, sem restringir o termo apenas a uma ideia temporal.
- source_word: דַּרְכֵי אֵל
  choice: entre as obras de Deus
  rationale: No contexto da criação, “obras” comunica naturalmente as atividades criadoras de Deus; “entre” torna idiomática em português a ideia de posição principal no conjunto.
- source_word: אֵל
  choice: Deus
  rationale: É a forma portuguesa comum e adequada para o título divino אֵל neste contexto.
- source_word: הָעֹשׂוֹ
  choice: aquele que o fez
  rationale: Reproduz com clareza a forma participial substantivada e seu sufixo pronominal.
- source_word: יַגֵּשׁ
  choice: pode aproximar
  rationale: Conserva o sentido causativo de “fazer chegar perto”, enquanto “pode” reflete a leitura contextual segundo a qual apenas o Criador é capaz de fazê-lo.
- source_word: חַרְבּוֹ
  choice: sua espada
  rationale: Mantém o sufixo masculino singular e preserva, tanto quanto o português permite, a incerteza sobre o referente do possessivo.
theological_decisions:
- issue: Interpretação da difícil oração final
  choice: somente aquele que o fez pode aproximar sua espada
  alternative: que aquele que o fez aproxime sua espada; seu Criador o equipou com uma espada
  rationale: O hebraico é sintaticamente condensado e admite mais de uma interpretação. O texto principal segue uma leitura contextual possível, mas a nota registra as alternativas sem transformar uma construção incerta em afirmação doutrinária.
- issue: Sentido de רֵאשִׁית דַּרְכֵי אֵל
  choice: o primeiro entre as obras de Deus
  alternative: o principal dos caminhos de Deus
  rationale: A formulação escolhida favorece a primazia da criatura no contexto das obras criadas, enquanto a nota preserva a alternativa mais formal e a possível ideia de preeminência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem dos marcadores acompanha as expressões a que cada nota se refere; todas as ambiguidades relevantes são explicitadas.
