base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: pt
  text: Você chegaria a anular a minha justiça? Você me condenaria para que você tenha razão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu juízo”. O hebraico mishpati pode significar juízo, justiça ou direito legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Você chegaria a
  rationale: A combinação interrogativa com אַף intensifica a pergunta e expressa espanto; «chegaria a» transmite esse tom com naturalidade em português.
- source_word: תָּפֵר
  choice: anular
  rationale: O hifil de פרר indica invalidar ou tornar sem efeito; «anular» preserva com clareza a força jurídica do termo.
- source_word: מִשְׁפָּטִי
  choice: a minha justiça
  rationale: מִשְׁפָּט pode indicar juízo, justiça ou direito legal. No contexto, «a minha justiça» abrange o governo justo de Deus e não limita a referência a uma única sentença.
- source_word: תַּרְשִׁיעֵנִי
  choice: Você me condenaria
  rationale: 'O hifil de רשע tem sentido forense: declarar culpado ou condenar. A escolha mantém o cenário jurídico.'
- source_word: לְמַעַן
  choice: para
  rationale: Introduz propósito ou resultado; «para» é natural e mantém a acusação retórica de autovindicação.
- source_word: תִּצְדָּק
  choice: se declarar justo
  rationale: No contexto forense, צדק significa ser ou mostrar-se justo, ter razão. «Se declarar justo» conserva o contraste jurídico com «condenar», sem sugerir necessariamente que outra parte formalmente o justifique.
theological_decisions:
- issue: Linguagem forense em contraste com uma formulação moral genérica
  choice: «anular a minha justiça ... me condenaria ... se declarar justo»
  alternative: «desacreditar a minha retidão ... dizer que estou errado para você ter razão»
  rationale: מִשְׁפָּט, רשע e צדק formam um conjunto marcadamente jurídico. A redação escolhida preserva a tensão da contestação de Jó à justiça divina, sem reduzi-la a uma divergência pessoal.
- issue: Sentido de מִשְׁפָּטִי
  choice: «a minha justiça»
  alternative: «o meu juízo»
  rationale: «Justiça» destaca a ordem e a atuação justas de Deus no contexto; «juízo» continua sendo uma possibilidade lexical legítima e, por isso, é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de «Você» sustenta o paralelismo retórico, e o registro jurídico do hebraico foi preservado sem arcaísmo excessivo.
