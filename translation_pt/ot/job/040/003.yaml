  yaml_path: translation/ot/job/040/003.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: pt
  text: Então Jó respondeu a Yahweh e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; alternativamente, “Yahweh” ou “Jeová”.'
    reason: Leitura alternativa do nome divino e explicitação da forma consonantal hebraica.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O Qal wayyiqtol de ענה introduz a resposta de Jó. “Respondeu” é natural em português e preserva a função narrativa do verbo.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marca hebraica de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: O Qal wayyiqtol de אמר integra a fórmula hebraica convencional de introdução da fala. Manter “respondeu ... e disse” preserva a estrutura do texto-fonte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde de perto à vocalização acadêmica amplamente aceita; “Jeová” é uma forma portuguesa tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula narrativa hebraica preservada. “Então” representa adequadamente a progressão do wayyiqtol no contexto; a ordem “respondeu a Yahweh e disse” mantém de perto a construção do original.
