  text: Will he make a covenant with you[b][a], that you would take him as a slave forever?
translation:
  language: pt
  text: Será que ele fará uma aliança com você[a]? Você o tomará como escravo para sempre[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “cortar uma aliança com você”, expressão convencional que significa “fazer uma aliança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como servo para sempre”. A palavra hebraica pode significar “servo” ou “escravo”; aqui, “escravo” ressalta a condição permanente de sujeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: Será que ele fará uma aliança
  rationale: A partícula interrogativa introduz uma pergunta retórica. A combinação כרת ברית significa literalmente “cortar uma aliança”, mas é uma expressão hebraica convencional cujo equivalente natural em português é “fazer uma aliança”.
- source_word: עִמָּךְ
  choice: com você
  rationale: Representa diretamente a relação indicada pela preposição e usa uma forma moderna, amplamente compreensível em português.
- source_word: תִּקָּחֶנּוּ
  choice: para que você o tome
  rationale: Mantém o sentido básico de לקח, “tomar”, e expressa de modo natural a relação de finalidade ou consequência com a pergunta anterior, sem convertê-la numa afirmação.
- source_word: לְעֶבֶד
  choice: como escravo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, a ideia de sujeição permanente favorece “escravo”, embora a alternativa legítima seja registrada em nota.
- source_word: עוֹלָם
  choice: para sempre
  rationale: Expressa a duração indefinida ou permanente indicada pelo hebraico e preserva a força retórica da pergunta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A formulação preserva a pergunta retórica e a imagem jurídica de uma aliança, evitando o literalismo pouco natural de “cortar uma aliança” no texto principal.
