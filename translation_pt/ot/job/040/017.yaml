  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: pt
  text: Ele enrijece a cauda como um cedro; os tendões de suas coxas[a] são entrelaçados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seus lombos” ou, mais especificamente, “de seus órgãos genitais”; o termo hebraico é incerto e muito debatido.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: enrijece
  rationale: Neste contexto corporal, o verbo descreve mais provavelmente uma ação física sobre a cauda. “Enrijece” combina com a comparação ao cedro, embora o sentido exato do verbo aqui seja incomum.
- source_word: זְנָבוֹ
  choice: a cauda
  rationale: Tradução direta do substantivo com sufixo masculino singular; o possessivo fica claro pelo sujeito da oração.
- source_word: כְמוֹ אָרֶז
  choice: como um cedro
  rationale: Preserva diretamente a imagem poética de firmeza e imponência.
- source_word: גִּידֵי
  choice: os tendões de
  rationale: גיד designa tendões ou ligamentos; “tendões” é preciso, corrente e adequado à descrição anatômica.
- source_word: פחדו
  choice: suas coxas
  rationale: O termo é raro e incerto neste contexto. “Coxas” oferece uma leitura corporal compreensível sem ocultar em nota as alternativas relativas aos lombos ou aos órgãos genitais.
- source_word: יְשֹׂרָגוּ
  choice: são entrelaçados
  rationale: O verbo exprime entrelaçar ou trançar; a forma passiva mantém a imagem de tendões fortemente unidos.
