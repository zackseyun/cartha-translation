base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: pt
  text: Orne-se[a], por favor, de majestade e grandeza; vista-se de esplendor e honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Revista-se agora de orgulho e altivez; vista-se de glória e majestade.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדֵה
  choice: Orne-se
  rationale: Imperativo masculino singular de עדה, aqui em sentido reflexivo. “Orne-se” é natural em português e mantém o paralelismo com “vista-se” no segundo membro.
- source_word: נָא
  choice: por favor
  rationale: A partícula pode expressar pedido ou ênfase. “Por favor” preserva a força exortativa do desafio, enquanto “agora” continua sendo uma possibilidade contextual.
- source_word: גָאוֹן
  choice: majestade
  rationale: Neste contexto, indica elevação e imponência régia, não necessariamente orgulho moralmente censurável.
- source_word: גֹבַהּ
  choice: grandeza
  rationale: Literalmente relacionado a “altura”, aqui exprime elevada imponência em paralelo com גָאוֹן. “Grandeza” comunica esse sentido de modo claro e poético em português.
- source_word: הוֹד
  choice: esplendor
  rationale: Designa magnificência visível ou imponência; “esplendor” preserva a imagem régia e distingue o termo de גָאוֹן.
- source_word: הָדָר
  choice: honra
  rationale: Pode indicar honra, majestade, beleza ou dignidade. “Honra” mantém uma nuance própria ao lado de “esplendor” sem repetir “majestade”.
- source_word: תִּלְבָּשׁ
  choice: vista-se
  rationale: A forma verbal dá continuidade à força imperativa. “Vista-se” preserva explicitamente a metáfora de vestir atributos e soa natural em português.
theological_decisions:
- issue: Se גָאוֹן e גֹבַהּ devem receber conotações morais negativas ou indicar grandeza régia e divina
  choice: Foram traduzidos positivamente como “majestade e grandeza”.
  alternative: “orgulho e altivez”
  rationale: No contexto, Deus desafia Jó a assumir a imponência e a autoridade que caracterizam o governo divino. A imagem de vestir-se e o paralelo com “esplendor e honra” favorecem atributos de grandeza régia, sem eliminar a alternativa lexical registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. A forma pronominal “orne-se” corresponde ao masculino singular dirigido a Jó; “por favor” reproduz a partícula exortativa sem arcaísmo.
