lexical_decisions:
- source_word: אַחַת
  choice: uma vez
  rationale: O numeral feminino “um” tem valor adverbial junto a “falei”; “uma vez” reproduz a expressão hebraica de modo natural.
- source_word: דִּבַּרְתִּי
  choice: Falei
  rationale: O perfeito na primeira pessoa indica a fala anterior e concluída de Jó; o pretérito perfeito é natural em português.
- source_word: וְלֹא אֶעֱנֶה
  choice: e não responderei
  rationale: ענה no qal significa “responder”. A conjunção foi mantida como “e”, sem impor um contraste que o hebraico apenas permite pelo contexto.
- source_word: וּשְׁתַּיִם
  choice: duas vezes
  rationale: O numeral “dois” também é adverbial, em paralelismo com “uma vez”.
- source_word: וְלֹא אוֹסִיף
  choice: e nada mais acrescentarei
  rationale: יסף no hifil pode significar acrescentar, continuar ou repetir. A formulação preserva a imagem hebraica de acrescentar, ao mesmo tempo que comunica naturalmente que Jó não continuará falando.
