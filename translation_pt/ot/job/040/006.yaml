  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: pt
  text: Então Yahweh respondeu a Jó do meio da tempestade e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do meio do redemoinho”.
    reason: Alternativa lexical legítima para סְעָרָה, que pode designar uma tempestade violenta ou redemoinho.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Então ... respondeu
  rationale: O waw consecutivo dá sequência à narrativa, e ענה significa aqui “responder”. “Então” expressa naturalmente a progressão em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת אִיּוֹב
  choice: a Jó
  rationale: אֵת marca Jó como objeto direto de “respondeu”; em português, a preposição “a” é a regência natural do verbo “responder” quando se indica a pessoa.
- source_word: מִן סְעָרָה
  choice: do meio da tempestade
  rationale: סְעָרָה designa tempestade, vendaval ou redemoinho. “Do meio da tempestade” comunica com naturalidade que a voz procede do fenômeno, sem especificar além do termo hebraico.
- source_word: וַיֹּאמַר
  choice: 'e disse:'
  rationale: Fórmula narrativa que introduz o discurso direto iniciado no versículo seguinte; os dois-pontos sinalizam essa continuação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e representa uma transliteração amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva a sequência narrativa e a imagem teofânica sem tornar סְעָרָה mais específico do que o hebraico permite.
