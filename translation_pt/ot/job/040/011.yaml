  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: pt
  text: Dá vazão aos ímpetos da tua ira[a]; olha para todo orgulhoso e humilha-o.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Espalha os transbordamentos da tua ira”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “todo orgulhoso”; o objeto singular de “humilha-o” apresenta cada pessoa orgulhosa individualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Dá vazão
  rationale: O imperativo expressa o ato de soltar ou fazer irromper com força. Em combinação com a ira, “dar vazão” comunica isso de modo natural, sem a estranheza de “espalhar ímpetos”.
- source_word: עֶבְרוֹת
  choice: ímpetos
  rationale: O plural de עֶבְרָה evoca manifestações intensas ou transbordantes de furor. “Ímpetos” conserva a pluralidade e a força emocional.
- source_word: אַפֶּךָ
  choice: tua ira
  rationale: Embora אַף signifique literalmente “nariz”, aqui integra o idioma hebraico para a ira. “Ira” mantém o registro elevado e a intensidade do contexto.
- source_word: וּרְאֵה
  choice: olha para
  rationale: O imperativo pede observação dirigida a cada orgulhoso, preparando a ordem seguinte.
- source_word: כָל גֵּאֶה
  choice: todo orgulhoso
  rationale: 'O adjetivo singular substantivado tem sentido distributivo: cada pessoa orgulhosa.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: e humilha-o
  rationale: O hifil de שׁפל significa fazer descer, rebaixar ou humilhar. “Humilha-o” é conciso e preserva o contraste entre orgulho e rebaixamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com uso de “tu” coerente com a fala direta a Deus. A formulação principal evita uma combinação metafórica pouco natural, enquanto a nota preserva mais de perto a imagem e a possibilidade lexical do hebraico.
