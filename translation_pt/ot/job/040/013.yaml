translation:
  language: pt
  text: Esconde-os juntos no pó[a]; amarra-lhes os rostos no lugar oculto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sepulta-os juntos no pó”. O verbo hebraico pode significar “esconder” e, neste contexto, também pode sugerir sepultamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “amarra-lhes os rostos em segredo” ou “em ocultamento”. A expressão hebraica final é difícil; provavelmente se refere a um lugar oculto e retoma o verbo “esconder” do início do verso.'
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Esconde-os
  rationale: O verbo טמן significa “esconder, ocultar”. Com “no pó”, pode sugerir sepultamento, mas “esconde” preserva o sentido básico e a possível correspondência verbal com בַּטָּמוּן no fim do verso.
- source_word: בֶּעָפָר
  choice: no pó
  rationale: עָפָר designa pó ou terra solta. “Pó” conserva a linguagem poética e sua associação contextual com mortalidade e morte.
- source_word: יָחַד
  choice: juntos
  rationale: O advérbio indica ação coletiva. “Juntos” é direto e natural em português.
- source_word: פְּנֵיהֶם
  choice: o rosto
  rationale: A expressão hebraica é literalmente “os rostos deles”. Na construção idiomática portuguesa com pronome dativo plural, “amarra-lhes o rosto” mantém a referência distributiva sem produzir uma formulação artificial.
- source_word: חֲבֹשׁ
  choice: amarra
  rationale: חבשׁ tem o sentido básico de amarrar ou prender. “Amarra” preserva a imagem concreta e não especifica além do texto se se trata de confinamento, cobertura ou restrição.
- source_word: בַּטָּמוּן
  choice: no lugar oculto
  rationale: 'Provavelmente é uma forma substantivada/passiva relacionada a טמן: “aquilo que está oculto” ou “lugar oculto”. A escolha preserva a imagem e a correspondência com o verbo inicial.'
