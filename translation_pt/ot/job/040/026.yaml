  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: pt
  text: Você consegue passar uma corda[a] pelo nariz dele ou furar sua mandíbula[b] com um gancho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um junco no nariz dele”. O termo hebraico significa literalmente “junco” ou “caniço”, mas aqui provavelmente indica uma corda feita de juncos.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua bochecha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Você consegue passar
  rationale: A partícula interrogativa com o verbo introduz uma pergunta retórica que desafia Jó; “Você consegue” expressa naturalmente a ideia de capacidade, e “passar” se ajusta ao ato de introduzir uma corda.
- source_word: אַגְמוֹן
  choice: uma corda
  rationale: Embora o termo designe literalmente junco ou caniço, neste contexto provavelmente se refere a uma corda feita de fibras vegetais, usada para controlar um animal.
- source_word: בְּאַפּוֹ
  choice: pelo nariz dele
  rationale: אַף significa nariz ou narina; “pelo nariz” comunica em português a imagem de fazer passar a corda por essa parte.
- source_word: וּבְחוֹחַ
  choice: com um gancho
  rationale: חוֹחַ pode significar espinho ou gancho; o contexto de captura e contenção favorece “gancho”.
- source_word: תִּקּוֹב
  choice: furar
  rationale: O verbo descreve perfurar ou atravessar; “furar” é claro, concreto e natural em português corrente.
- source_word: לֶחֱיוֹ
  choice: sua mandíbula
  rationale: לְחִי pode significar mandíbula ou face/bochecha; no contexto de colocar um gancho para conter o animal, “mandíbula” transmite melhor a imagem, sem eliminar a alternativa lexical.
