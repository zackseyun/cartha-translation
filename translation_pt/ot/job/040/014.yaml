  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: pt
  text: Então, até eu louvarei você[a], porque sua mão direita pode salvar você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque sua mão direita pode salvar para você mesmo”. O hebraico inclui uma preposição que pode indicar vantagem: “para você/para si mesmo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Então até
  rationale: Mantém tanto a continuidade com o desafio anterior quanto a ênfase da combinação hebraica, de modo natural em português.
- source_word: אֲנִי
  choice: eu
  rationale: 'Conserva o pronome explícito e enfático: o próprio Deus é quem fala.'
- source_word: אוֹדֶךָ
  choice: o louvarei
  rationale: O hifil de ידה pode expressar louvor ou reconhecimento; neste contexto, Deus declara que louvaria Jó caso ele demonstrasse tal poder.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da declaração anterior.
- source_word: תוֹשִׁיעַ
  choice: pode salvar
  rationale: O hifil de ישׁע significa salvar ou livrar. No contexto do desafio condicional, a formulação comunica capacidade demonstrada, sem transformar a frase em mera predição.
- source_word: לְךָ
  choice: salvá-lo
  rationale: O dativo de vantagem é expresso idiomaticamente pelo objeto em português; a nuance mais literal, 'para si mesmo', é preservada em nota.
- source_word: יְמִינֶךָ
  choice: a sua mão direita
  rationale: Preserva a imagem hebraica concreta, na qual a mão direita representa força ou poder.
theological_decisions:
- issue: Metáfora antropomórfica de poder
  choice: a sua mão direita pode salvá-lo
  alternative: a sua própria força pode salvá-lo
  rationale: O texto hebraico emprega a imagem concreta da mão direita. A tradução mantém a metáfora sem substituí-la por sua interpretação.
- issue: Nuance do dativo לְךָ
  choice: salvá-lo, com nota indicando 'salvar para si mesmo'
  alternative: salvar para si mesmo
  rationale: A construção hebraica admite a nuance de vantagem ou interesse próprio. O texto principal usa português corrente, enquanto a nota conserva a forma e a ambiguidade relevantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” expresso pelas formas “o” e “sua”. A ordem preserva a ênfase em “até eu”, e a metáfora da mão direita permanece visível.
