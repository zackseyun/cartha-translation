lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: o cobrem
  rationale: Traduz diretamente a ideia de cobrir ou abrigar e se ajusta naturalmente à imagem da sombra.
- source_word: צֶאֱלִים
  choice: lótus
  rationale: Mantém a identificação botânica tradicional, embora o sentido exato do termo hebraico seja incerto.
- source_word: צִלֲלוֹ
  choice: com sua sombra
  rationale: Preserva o sentido de sombra protetora e refrescante; o singular coletivo é natural em português.
- source_word: יְסֻבּוּהוּ
  choice: o cercam
  rationale: Expressa de modo direto o sentido de rodear ou circundar.
- source_word: עַרְבֵי נָחַל
  choice: os salgueiros do riacho
  rationale: Conserva a tradução tradicional para as árvores ribeirinhas e usa 'riacho' como equivalente claro e corrente de נחל no contexto.
