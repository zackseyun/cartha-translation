  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: pt
  text: Eis que sou insignificante[a]; o que posso te responder? Pus a mão sobre a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sou de pouca importância»; tradicionalmente: «sou vil».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Partícula que chama a atenção e introduz o reconhecimento de Jó; «Eis que» mantém a força solene sem alongar a frase.
- source_word: קַלֹּתִי
  choice: sou insignificante
  rationale: A forma de קלל expressa pequenez, pouca importância ou pouco valor neste contexto. «Sou insignificante» comunica a humilhação de Jó sem acrescentar a ideia mais forte de depravação moral.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: o que posso te responder?
  rationale: O interrogativo מָה funciona como objeto de «responder». O verbo modal «posso» torna natural em português o sentido retórico de incapacidade sugerido pelo contexto.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Ponho a mão sobre a boca
  rationale: Preserva literalmente o gesto idiomático de silêncio e submissão. O presente é natural em português como descrição da atitude assumida por Jó no momento de sua resposta.
theological_decisions:
- issue: Se a autodescrição de Jó deve receber um sentido moralmente carregado
  choice: sou insignificante
  alternative: sou indigno; sou desprezível
  rationale: O hebraico aponta mais diretamente para pequenez ou pouca importância. «Desprezível» poderia sugerir corrupção moral além do que o verso afirma, enquanto «indigno» explicitaria uma interpretação possível, mas não necessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Te responder» evita a formalidade marcada de «responder-te», enquanto «Eis que» conserva a solenidade poética. A ordem e a imagem do hebraico foram mantidas sempre que naturais.
