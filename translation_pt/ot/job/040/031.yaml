  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: pt
  text: Você consegue encher a pele dele de arpões[a] ou a cabeça de lanças de pesca[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de ferros farpados»; o termo hebraico é raro e pode designar, de modo mais geral, instrumentos pontiagudos ou farpados de caça.
    reason: lexical_alternative
  - marker: b
    text: Ou «de anzóis»; a expressão hebraica pode designar, de modo mais geral, um instrumento de pesca.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: Você pode crivar
  rationale: A partícula interrogativa com o Piel imperfeito de מלא introduz uma pergunta retórica. Em português, «pode crivar» comunica naturalmente o desafio e, com os instrumentos perfurantes, preserva a ideia de encher o couro de golpes.
- source_word: בְשֻׂכּוֹת
  choice: de arpões
  rationale: O substantivo raro parece designar instrumentos pontiagudos ou farpados usados na caça ou pesca. «Arpões» é concreto, compreensível e adequado ao paralelismo.
- source_word: עוֹרוֹ
  choice: o couro dele
  rationale: «Couro» é uma designação natural para a pele resistente de um animal grande e mantém a imagem vívida do hebraico.
- source_word: וּבְצִלְצַל דָּגִים
  choice: de lanças de pesca
  rationale: A expressão designa literalmente um instrumento associado à pesca. «Lanças de pesca» preserva a associação com peixes e o paralelismo com «arpões», sem eliminar a incerteza lexical.
- source_word: רֹאשׁוֹ
  choice: a cabeça
  rationale: Tradução direta, mantendo o paralelismo anatômico com «o couro dele».
