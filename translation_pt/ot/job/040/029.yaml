  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: pt
  text: Você brincará com ele[a] como se brinca com um pássaro ou o amarrará para suas meninas[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com isso”; o hebraico usa um pronome masculino singular, referente ao Leviatã.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “suas moças” ou “suas jovens mulheres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: Você brincará
  rationale: O Qal de שׂחק pode expressar brincar ou divertir-se. A forma futura mantém a pergunta retórica e soa natural em português.
- source_word: בּוֹ
  choice: com ele
  rationale: O sufixo pronominal é masculino singular e retoma o Leviatã; “ele” preserva essa referência gramatical e discursiva.
- source_word: כַּצִּפּוֹר
  choice: como se fosse um pássaro
  rationale: צִפּוֹר é o termo comum para ave ou pássaro. Esta formulação torna explícita, em português natural, a comparação com um animal tratado como brinquedo ou bicho domesticado.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: ou o amarrará
  rationale: קשר significa amarrar ou prender. O “ou” reproduz adequadamente a coordenação da segunda pergunta retórica em português, e “amarrará” conserva a imagem concreta.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: para suas meninas
  rationale: נַעֲרוֹת designa jovens do sexo feminino e pode significar meninas, moças ou jovens servas. “Meninas” é claro e atual, sem introduzir por si só a ideia de servidão.
