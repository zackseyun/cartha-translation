  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: pt
  text: 'aquele que diz a um rei: “Canalha!”[a]

    e aos nobres: “Malvados!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Homem sem valor!”. O termo hebraico expressa vileza ou falta de valor; aqui não é necessariamente o nome próprio posterior “Belial”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “malvado” está no singular, mas é dirigido ao plural “nobres”; por clareza, foi traduzido no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: aquele que diz
  rationale: O infinitivo construto com artigo tem função substantivada e retoma, no contexto, a pessoa que fala dessa maneira.
- source_word: לְמֶלֶךְ
  choice: a um rei
  rationale: A preposição introduz o destinatário da fala, e o substantivo sem artigo tem sentido genérico.
- source_word: בְּלִיָּעַל
  choice: Canalha!
  rationale: Aqui é um insulto que expressa vileza ou falta de valor, e não o nome próprio posterior “Belial”. “Canalha” comunica isso de modo natural e vigoroso em português.
- source_word: רָשָׁע
  choice: Perversos!
  rationale: Embora a forma hebraica seja singular, ela se dirige ao plural “nobres”; o plural em português torna clara a referência sem alterar o sentido.
- source_word: אֶל
  choice: a
  rationale: Introduz o destinatário da fala em paralelismo com לְמֶלֶךְ.
- source_word: נְדִיבִים
  choice: nobres
  rationale: No paralelismo com “rei”, o termo designa pessoas de posição elevada ou principesca; “nobres” preserva bem o sentido sociopolítico.
