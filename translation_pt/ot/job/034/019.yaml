  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: pt
  text: que não mostra parcialidade para com os príncipes nem dá preferência ao rico em vez do pobre, pois todos eles são obra de suas mãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשָׂא פְּנֵי שָׂרִים
  choice: não mostra parcialidade para com os príncipes
  rationale: A expressão idiomática נָשָׂא פְנֵי significa favorecer ou tratar com parcialidade; esta formulação comunica o sentido com naturalidade e preserva שָׂרִים como «príncipes».
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: nem dá preferência ao rico em vez do pobre
  rationale: נִכַּר, no contexto de tratamento de pessoas, indica reconhecer ou distinguir favoravelmente. «Dá preferência» expressa esse valor sem sugerir mera percepção visual; «em vez do» representa a relação comparativa de לִפְנֵי.
- source_word: שׁוֹעַ
  choice: rico
  rationale: O substantivo designa alguém abastado ou de alta posição; o contraste explícito com דָל favorece «rico».
- source_word: דָל
  choice: pobre
  rationale: No contraste social com שׁוֹעַ, refere-se à pessoa pobre ou humilde.
- source_word: מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: todos eles são obra de suas mãos
  rationale: Mantém a imagem hebraica das mãos de Deus como agente criador e a abrangência de כֻּלָּם.
theological_decisions:
- issue: A imparcialidade divina entre pessoas de diferentes posições sociais
  choice: não mostra parcialidade... nem dá preferência
  alternative: não reconhece o rico acima do pobre
  rationale: A escolha explicita o sentido judicial e relacional dos idiomas hebraicos sem introduzir uma doutrina adicional; a razão apresentada pelo texto é que ambos foram feitos por Deus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome «suas» retoma Deus no contexto imediato do discurso.
