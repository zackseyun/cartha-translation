source:
  edition: WLC
  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: pt
  text: Pois ele não determina para o homem nenhum outro momento para comparecer diante de Deus em juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ele não determina mais nada a respeito do homem, para que este vá a Deus em juízo”. O hebraico é difícil e condensado; o sentido pode ser que Deus não necessita de outra audiência nem de demora adicional antes de julgar.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e preserva o fluxo argumentativo do discurso de Eliú.
- source_word: לֹא
  choice: não
  rationale: Negação simples e natural em português.
- source_word: עַל אִישׁ
  choice: para o homem
  rationale: Com יָשִׂים, עַל pode indicar aquilo que é posto ou determinado para alguém. A formulação mantém o singular masculino genérico do hebraico.
- source_word: יָשִׂים
  choice: determina
  rationale: O verbo significa pôr, colocar ou estabelecer; aqui, no contexto judicial, 'determina' comunica naturalmente a ideia de fixar uma ocasião.
- source_word: עוֹד
  choice: nenhum outro momento
  rationale: עוֹד traz a noção de algo adicional, posterior ou novamente. Como o hebraico é elíptico, 'momento' explicita com moderação o objeto implícito exigido pelo português.
- source_word: לַהֲלֹךְ
  choice: para comparecer
  rationale: Embora literalmente seja 'ir', no contexto forense 'comparecer' expressa de modo idiomático a ida à presença do juiz.
- source_word: אֶל אֵל
  choice: diante de Deus
  rationale: Literalmente 'a Deus'; em contexto judicial, 'diante de Deus' comunica a ideia de apresentar-se perante ele sem identificar אֵל com o nome divino.
- source_word: בַּמִּשְׁפָּט
  choice: em juízo
  rationale: Preserva de forma concisa o sentido judicial de מִשְׁפָּט e mantém o tom digno do texto.
theological_decisions:
- issue: Interpretação da construção difícil e elíptica com עוֹד e um objeto implícito depois de יָשִׂים
  choice: Deus não precisa determinar outra ocasião para que o homem compareça diante dele em juízo.
  alternative: Ele não volta a considerar o homem antes de levá-lo a juízo; ou ele não fixa para o homem um tempo de comparecimento diante de Deus.
  rationale: No contexto, Eliú ressalta o conhecimento perfeito de Deus e a ausência de necessidade de nova audiência ou demora. A nota registra a dificuldade do hebraico e evita apresentar a expansão interpretativa como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Em juízo' conserva o cenário forense; 'comparecer' torna idiomático o infinitivo 'ir'. A explicitação 'momento' é mantida no corpo, mas a incerteza da construção hebraica é reconhecida em nota.
