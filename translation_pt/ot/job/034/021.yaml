base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: pt
  text: Pois os olhos dele estão sobre os caminhos do homem[a], e ele vê todos os seus passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os caminhos de uma pessoa”. O hebraico diz literalmente “os caminhos de um homem”, empregando o masculino singular em sentido genérico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando de modo natural o valor causal-explicativo.
- source_word: עֵינָיו
  choice: os olhos dele
  rationale: Mantém o substantivo plural com sufixo de terceira pessoa masculina singular. O referente é Deus no contexto, mas o versículo emprega o pronome.
- source_word: עַל
  choice: estão sobre
  rationale: Preserva a imagem hebraica dos olhos voltados atentamente para os caminhos humanos, em registro digno e claro.
- source_word: דַּרְכֵי אִישׁ
  choice: os caminhos do homem
  rationale: דֶּרֶךְ designa caminhos e, metaforicamente, a conduta ou o curso da vida. אִישׁ está no masculino singular e tem aqui força representativa genérica.
- source_word: וְכָל
  choice: e ... todos
  rationale: Expressa diretamente a conjunção e a totalidade indicada pelo hebraico.
- source_word: צְעָדָיו
  choice: os seus passos
  rationale: Conserva a imagem concreta dos passos, que também pode representar ações e trajetória de vida.
- source_word: יִרְאֶה
  choice: ele vê
  rationale: O imperfeito qal descreve neste contexto uma realidade geral e contínua; o presente é natural em português.
theological_decisions:
- issue: Masculino genérico אִישׁ
  choice: o homem
  alternative: a pessoa
  rationale: A formulação conserva o masculino singular do hebraico e sua força representativa, sem restringir o sentido apenas aos homens; a nota explicita a abrangência genérica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção mantém o paralelismo entre “caminhos” e “passos” e preserva o pronome referente a Deus, em vez de explicitar o nome divino no corpo do versículo.
