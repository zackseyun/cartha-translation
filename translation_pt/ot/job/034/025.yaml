  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: pt
  text: Por isso, ele reconhece as obras deles; derruba-os durante a noite[a], e eles são esmagados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derruba-os de noite”. O hebraico não declara explicitamente o objeto de “derruba”, mas o contexto aponta para os governantes ímpios que estão sob julgamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência lógica do argumento anterior.
- source_word: יַכִּיר
  choice: reconhece
  rationale: O hifil de נכר indica reconhecer ou tomar conhecimento; a escolha preserva a ideia de que Deus discerne e identifica os atos deles.
- source_word: מַעְבָּדֵיהֶם
  choice: as obras deles
  rationale: Refere-se ao que eles fazem. “Obras” é claro, conciso e mantém o peso moral do contexto.
- source_word: וְהָפַךְ
  choice: derruba-os
  rationale: הפך pode significar virar, subverter ou derrubar. O objeto não está expresso no hebraico, mas o contexto aponta para os poderosos ímpios; o pronome explicita essa referência sem alterar o sentido contextual.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: Representa o uso temporal adverbial e preserva o cenário noturno do juízo repentino.
- source_word: וְיִדַּכָּאוּ
  choice: e eles são esmagados
  rationale: O verbo דכא comunica ser esmagado ou quebrantado; a forma passiva e a força do juízo são preservadas.
theological_decisions:
- issue: Sujeito implícito e objeto não expresso na cena de juízo
  choice: Deus permanece como sujeito, e os ímpios poderosos são o objeto implícito de “derruba”.
  alternative: Entender literalmente que “ele vira a noite”, ou adotar uma leitura impessoal dos verbos.
  rationale: Jó 34:24–26 descreve Deus conhecendo e julgando homens poderosos e ímpios. Explicitar “-os” comunica em português o referente fornecido pelo contexto, enquanto a nota registra que o objeto não aparece no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e a intensidade judicial do hebraico.
