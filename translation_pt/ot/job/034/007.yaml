  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: pt
  text: Que homem há como Jó, que bebe a zombaria como água?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Que homem há
  rationale: A combinação introduz uma pergunta retórica de espanto e comparação. “Que homem há” soa natural em português e preserva a referência masculina singular a Jó.
- source_word: כְּאִיּוֹב
  choice: como Jó
  rationale: A preposição כ marca comparação; “como Jó” é a formulação portuguesa mais natural.
- source_word: יִשְׁתֶּה
  choice: bebe
  rationale: O imperfeito caracteriza a conduta de Jó no discurso de Eliú; o presente expressa bem esse valor habitual ou característico.
- source_word: לַּעַג
  choice: a zombaria
  rationale: O substantivo denota escárnio, ridicularização ou zombaria. “Zombaria” é claro e mantém a ideia de expressão insultuosa sem tornar a imagem excessivamente abstrata.
- source_word: כַּמָּיִם
  choice: como água
  rationale: Preserva diretamente a comparação vívida de algo ingerido livremente ou em abundância.
