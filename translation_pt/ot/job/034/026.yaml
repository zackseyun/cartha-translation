revisions:
- from: Ele os golpeia como ímpios[a], em lugar onde todos podem ver.[b]
  to: Ele os golpeia em lugar dos ímpios[a], diante dos que veem.[b]
  rationale: A revisão mantém «golpeia» e «ímpios», mas substitui a interpretação principal «como ímpios» por «em lugar dos ímpios», que reproduz mais de perto a formulação hebraica e o percurso lexical inglês, deixando «como ímpios» como leitura alternativa. Também substitui «onde todos podem ver» por «diante dos que veem», evitando a generalização de «todos» e refletindo diretamente o particípio plural רֹאִים. As notas foram corrigidas para não apresentar «sob os ímpios» como sentido contextual literal e para explicar corretamente a construção final.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:10:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução capta corretamente o ato punitivo de סְפָקָם e o caráter público de בִּמְקוֹם רֹאִים. Contudo, «como ímpios» interpreta תַּחַת רְשָׁעִים em um sentido possível, mas reduz a ambiguidade da expressão e soa menos diretamente ligado à construção hebraica. «Sob os ímpios» na nota é uma alternativa literal inadequada neste contexto: o hebraico não requer que os atingidos estejam fisicamente sob pessoas ímpias. Além disso, a nota b inverte a relação sintática: בִּמְקוֹם רֹאִים significa «em lugar de/num lugar de pessoas que veem», não literalmente «em lugar de pessoas que veem» como explicação de toda a expressão, e a tradução principal deve conservar mais claramente o plural «os que veem».'
  naturalness: «Ele os golpeia ... diante dos que veem» é moderno, claro e de registro apropriado. «Em lugar onde todos podem ver» é compreensível, mas «todos» amplia os observadores sem apoio explícito no particípio plural; «num lugar onde há quem veja» ou «diante dos que veem» é mais fiel. A construção «em lugar onde» também é menos fluente que «num lugar onde».
  terminology: «Ímpios» é uma boa equivalência estabelecida para רְשָׁעִים e mantém registro bíblico sem acrescentar «homens». «Golpeia» é apropriado para a ação de juízo e evita impor «derruba» ou morte. Para תַּחַת, «como ímpios» pode ser mantido como opção interpretativa em nota, mas a formulação principal «em lugar dos ímpios» preserva melhor a tensão semântica adotada no audit trail inglês.
  issues:
  - severity: medium
    issue: A nota a apresenta «sob os ímpios» como alternativa literal para תַּחַת רְשָׁעִים.
    rationale: Embora תחת isoladamente possa significar «sob», aqui a expressão poética ligada ao julgamento não deve sugerir uma localização física abaixo dos ímpios. A nota deve registrar de modo cuidadoso as leituras «em lugar dos ímpios» e «como ímpios», sem afirmar uma literalidade contextual enganosa.
  - severity: medium
    issue: A nota b explica de modo impreciso a expressão hebraica e a tradução principal amplia רֹאִים para «todos».
    rationale: רֹאִים é «os que veem/onlookers», e a frase é «num lugar de/entre os que veem», isto é, publicamente. «Todos» é uma generalização não expressa; «diante dos que veem» conserva o sentido e a concisão.
  revised_text: Ele os golpeia em lugar dos ímpios[a], diante dos que veem.[b]
  revised_footnotes:
