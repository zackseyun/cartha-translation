    text: Ou, “como ímpios”. A expressão também pode ser entendida mais literalmente como “em lugar dos ímpios”.
    reason: lexical_alternative
  - marker: b
    text: Ou, “num lugar onde há os que veem” ou “à vista dos que veem”. O hebraico diz literalmente “num lugar de os que veem”.
    reason: lexical_alternative
