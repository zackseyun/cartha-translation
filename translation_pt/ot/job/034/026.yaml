  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them down in the place of the wicked[b][a], in a place where people can see.
translation:
  language: pt
  text: Ele os golpeia em lugar dos ímpios[a], diante dos que veem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “como ímpios”. A expressão também pode ser entendida mais literalmente como “em lugar dos ímpios”.
    reason: lexical_alternative
  - marker: b
    text: Ou, “num lugar onde há os que veem” ou “à vista dos que veem”. O hebraico diz literalmente “num lugar de os que veem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: como
  rationale: A preposição significa literalmente “sob” e também pode indicar substituição ou correspondência. Neste contexto poético de juízo, “como” comunica naturalmente que eles recebem o tratamento destinado aos ímpios, sem tornar a expressão portuguesa obscura; a ambiguidade hebraica é preservada em nota.
- source_word: רְשָׁעִים
  choice: ímpios
  rationale: O adjetivo substantivado plural designa pessoas moralmente perversas. “Ímpios” é conciso, digno e não acrescenta uma referência masculina ausente do hebraico.
- source_word: סְפָקָם
  choice: Ele os golpeia
  rationale: Aqui, o verbo ספק com o sufixo pronominal expressa uma ação contundente de castigo. “Golpeia” preserva a força do verbo sem acrescentar explicitamente a ideia de morte ou queda.
- source_word: בִּמְקוֹם
  choice: em lugar
  rationale: A locução introduz o âmbito ou local em que o castigo acontece. Em português, a forma indefinida liga-se naturalmente à oração seguinte.
- source_word: רֹאִים
  choice: onde todos podem ver
  rationale: O particípio plural significa literalmente “os que veem”. A formulação idiomática expressa o caráter público do juízo; “todos” generaliza os observadores presentes sem restringi-los a um grupo específico, e a alternativa mais literal é registrada em nota.
