  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: pt
  text: Ele despedaça os poderosos sem investigação[a] e põe outros no lugar deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem precisar fazer uma investigação” ou “sem busca”. A expressão hebraica é concisa e diz literalmente “não investigação/busca”; no contexto, pode indicar que nenhuma apuração prolongada é necessária antes que Deus derrube os poderosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: despedaça
  rationale: O hifil de רעע exprime quebrar ou arruinar com força. “Despedaça” comunica a ação decisiva de derrubar em juízo.
- source_word: כַּבִּירִים
  choice: os poderosos
  rationale: Designa pessoas de grande poder, provavelmente governantes ou membros da elite no contexto, sem especificar um cargo.
- source_word: לֹא חֵקֶר
  choice: sem investigação
  rationale: Reproduz diretamente a expressão hebraica formada pela negação e pelo substantivo “investigação/busca”, sem resolver além do necessário a concisão e a possível ambiguidade poética.
- source_word: וַיַּעֲמֵד
  choice: põe
  rationale: O hifil de עמד significa fazer ficar de pé, estabelecer ou colocar; junto de “no lugar deles”, “põe” é natural e preserva a ideia de substituição.
- source_word: אֲחֵרִים
  choice: outros
  rationale: Mantém o plural indefinido do hebraico; a expressão seguinte esclarece que se trata de substitutos.
- source_word: תַּחְתָּם
  choice: no lugar deles
  rationale: Embora literalmente possa significar “debaixo deles”, neste contexto de remoção e substituição o sentido idiomático é “no lugar deles”.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: Deus é retomado pelo pronome “Ele”.
  alternative: Manter o sujeito sem expressão explícita ou entender uma construção impessoal.
  rationale: No discurso de Eliú, o contexto imediato trata da ação judicial de Deus sobre governantes. O português requer uma retomada clara do sujeito, sem acrescentar conteúdo doutrinário estranho ao texto.
- issue: Sentido de לֹא חֵקֶר
  choice: “sem investigação”, preservando a formulação breve do hebraico.
  alternative: “sem precisar investigar” ou “de modo insondável”.
  rationale: A primeira alternativa explicita que Deus não necessita de uma apuração prolongada; a segunda entende a expressão como inescrutabilidade. O texto principal evita decidir silenciosamente entre essas nuances, e a nota registra a principal possibilidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Despedaça” conserva a força poética; “põe outros no lugar deles” soa natural sem perder a imagem de substituição.
