  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: pt
  text: Meu pai[a], que Jó seja posto à prova ao máximo[b], por causa de suas respostas, semelhantes às de homens perversos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ó meu pai”. O hebraico diz literalmente “meu pai”, provavelmente como vocativo, embora também seja interpretado de outras maneiras.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “até a perpetuidade” ou “para sempre”; aqui, a expressão provavelmente indica uma prova extrema ou completa, e não duração sem fim.
    reason: lexical_alternative
  - marker: c
    text: Ou “junto com homens perversos” ou “entre homens perversos”. A preposição hebraica pode indicar comparação ou associação.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Meu pai
  rationale: A forma significa literalmente “meu pai” e é mantida como vocativo, a leitura mais direta do texto consonantal, embora a expressão seja incomum no contexto.
- source_word: יִבָּחֵן
  choice: que ... seja posto à prova
  rationale: O nifal imperfeito de בחן indica ser provado ou examinado; a construção volitiva em português expressa adequadamente o desejo formulado no contexto.
- source_word: עַד נֶצַח
  choice: ao máximo
  rationale: A expressão significa literalmente “até a perpetuidade/para sempre”, mas, neste contexto de exame, provavelmente intensifica a extensão ou o rigor da prova, sem necessariamente indicar duração infinita.
- source_word: עַל
  choice: por causa de
  rationale: 'A preposição introduz aqui o fundamento do pedido de Eliú: as respostas de Jó.'
- source_word: תְּשֻׁבוֹת
  choice: respostas
  rationale: O substantivo designa respostas ou réplicas e se ajusta naturalmente ao contexto do debate.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: semelhantes às de homens perversos
  rationale: A construção com ב pode ter sentido comparativo ou associativo. A redação principal adota a comparação, em português natural, enquanto a nota conserva a alternativa de associação.
theological_decisions:
- issue: Sentido do desejo de Eliú quanto à prova de Jó
  choice: Eliú deseja que Jó seja provado de modo completo ou rigoroso por causa de respostas semelhantes às de homens perversos.
  alternative: Eliú deseja que Jó seja provado para sempre ou em companhia de homens perversos.
  rationale: A formulação preserva o teor acusatório da fala de Eliú sem transformar a expressão temporal intensiva em afirmação doutrinária sobre uma prova literalmente interminável. A ambiguidade da associação ou comparação é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção volitiva natural (“que ... seja”) e linguagem acessível. “Posto à prova ao máximo” comunica exame rigoroso sem sugerir necessariamente duração eterna. A pontuação antes de “semelhantes” favorece a leitura natural e comparativa, cuja alternativa é preservada em nota.
