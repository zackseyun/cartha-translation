  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: pt
  text: 'Pois ele retribui a cada pessoa conforme o que ela faz[a]

    e faz cada um encontrar o que corresponde ao seu caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz recair sobre cada pessoa o que lhe corresponde” ou “traz sobre ela o que lhe é devido”; o verbo hebraico pode ter sentido causativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a afirmação de Eliú no contexto e preserva naturalmente o valor explicativo da conjunção.
- source_word: פֹעַל אָדָם
  choice: o que cada pessoa faz
  rationale: Expressa o ato ou feito humano em português corrente. “Cada pessoa” comunica a referência humana genérica do singular אָדָם sem limitar o sentido aos homens.
- source_word: יְשַׁלֶּם לוֹ
  choice: ele retribui a cada pessoa
  rationale: O piel de שׁלם indica dar a alguém a devida retribuição por sua conduta; “retribui” preserva a nuance judicial sem soar arcaico.
- source_word: וּכְאֹרַח אִישׁ
  choice: o resultado do seu caminho
  rationale: “Caminho” conserva a metáfora hebraica para a maneira de viver. “Resultado” torna explícito apenas o complemento implícito exigido pela construção portuguesa e pela ideia de correspondência introduzida por כְּ.
- source_word: יַמְצִאֶנּוּ
  choice: faz com que cada um encontre
  rationale: Reproduz o sentido causativo do hifil de מצא e mantém a formulação deliberadamente menos interpretativa do que “faz recair sobre ele”.
theological_decisions:
- issue: Retribuição divina segundo a conduta humana
  choice: O versículo declara que Deus retribui cada pessoa de acordo com seus atos e seu modo de viver.
  alternative: Entender a frase como afirmação de que todo sofrimento é sempre punição direta e exata por um pecado pessoal.
  rationale: A tradução preserva o princípio geral de justiça divina exposto por Eliú, mas não transforma o verso numa solução simplista para a tensão teológica do livro de Jó.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O paralelismo hebraico é mantido, mas a repetição de substantivos masculinos genéricos é vertida de modo inclusivo e natural. A nota conserva alternativas para o valor causativo sem impô-las ao texto principal.
