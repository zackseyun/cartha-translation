  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: pt
  text: Não há trevas nem sombra profunda[a] onde os que praticam a maldade possam se esconder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sombra da morte”; o termo hebraico também pode indicar escuridão muito profunda ou densas sombras em contextos poéticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Não há
  rationale: Expressa naturalmente em português a negação existencial que introduz os dois substantivos coordenados.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: É a tradução corrente do substantivo e mantém o tom poético, além de formar um paralelo natural com “sombra profunda”.
- source_word: צַלְמָוֶת
  choice: sombra profunda
  rationale: No contexto poético, indica escuridão ou sombra muito densa; esta opção preserva a imagem sem pressupor que a morte esteja diretamente em vista.
- source_word: לְהִסָּתֶר
  choice: possam se esconder
  rationale: O infinitivo com לְ indica a possibilidade ou finalidade de ocultação diante da negação precedente; uma oração finita é mais natural em português.
- source_word: שָׁם
  choice: onde
  rationale: Embora corresponda literalmente a “ali”, funciona de modo natural como relativo locativo ligado às trevas e à sombra mencionadas.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a maldade
  rationale: Reproduz de forma clara e corrente a ideia de pessoas que fazem ou produzem o mal, sem perder a força moral da expressão hebraica.
- source_word: אָוֶן
  choice: maldade
  rationale: Neste contexto, o termo designa conduta moralmente perversa, especialmente em relação aos que procuram ocultar seus atos.
theological_decisions:
- issue: Sentido de צַלְמָוֶת no contexto poético
  choice: sombra profunda
  alternative: sombra da morte; escuridão profunda
  rationale: O tema imediato é a impossibilidade de os malfeitores se ocultarem da visão de Deus, não a morte em si. A tradução principal comunica escuridão intensa, enquanto a leitura tradicional é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Trevas” conserva o registro poético bíblico sem soar excessivamente arcaico; “os que praticam a maldade” é mais natural no uso corrente do que uma reprodução rígida como “trabalhadores da iniquidade”.
