source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: pt
  text: Será que ele deve retribuir segundo o seu critério[a], porque você rejeitou isso[b]? Pois é você quem deve escolher, não eu; diga, então, o que sabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com você”. A expressão hebraica inicial é idiomática e difícil; o sentido parece ser que a retribuição de Deus não é determinada pela preferência de Jó.'
    reason: lexical_alternative
  - marker: b
    text: “Isso” pode se referir ao julgamento de Deus, à maneira como Deus governa ou à retribuição em questão.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: segundo o seu critério
  rationale: A expressão hebraica, literalmente difícil (‘da parte de você’ ou ‘segundo você’), pergunta se a retribuição divina deve corresponder à avaliação ou preferência de Jó. ‘Segundo o seu critério’ comunica esse sentido de modo natural sem eliminar a dificuldade, registrada em nota.
- source_word: יְשַׁלְּמֶנָּה
  choice: deve retribuir
  rationale: O Piel de שלם expressa pagar, recompensar ou retribuir. ‘Retribuir’ preserva o sentido amplo de recompensa ou compensação, sem exigir em português um objeto pronominal cujo referente hebraico é incerto.
- source_word: כִּי מָאַסְתָּ
  choice: porque você rejeitou isso
  rationale: מאס significa ‘rejeitar’, ‘recusar’ ou ‘desprezar’. O demonstrativo torna a frase natural em português, enquanto a nota preserva a incerteza quanto ao referente implícito.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Pois é você quem deve escolher, não eu
  rationale: A formulação conserva o contraste enfático entre ‘você’ e ‘eu’ e expressa a força contextual de que Jó deve formular sua própria posição.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: diga, então, o que sabe
  rationale: Mantém o imperativo direto e a conclusão do desafio de Eliú em português atual e digno.
theological_decisions:
- issue: Se a retribuição de Deus é determinada pela preferência de Jó
  choice: A pergunta é formulada retoricamente, sem afirmar que Jó governa a retribuição divina.
  alternative: Traduzir de forma mais literal como ‘Será que ele retribuirá da sua parte?’
  rationale: O contexto favorece uma crítica à pretensão de submeter a retribuição divina ao critério humano, mas a nota mantém aberta a construção idiomática hebraica.
- issue: Referente do objeto rejeitado
  choice: Usar o demonstrativo neutro ‘isso’ e explicar sua ambiguidade em nota.
  alternative: Identificá-lo explicitamente como ‘o julgamento de Deus’, ‘o modo de Deus governar’ ou ‘a retribuição proposta’.
  rationale: O hebraico não nomeia o referente; especificá-lo no texto resolveria indevidamente uma ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem retórica e o contraste entre Jó e Eliú foram preservados; as ambiguidades genuínas da expressão inicial e do objeto de ‘rejeitou’ foram mantidas por meio de notas.
