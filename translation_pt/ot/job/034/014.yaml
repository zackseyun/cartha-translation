  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: pt
  text: Se ele dirigisse o seu coração para si mesmo[a] e recolhesse para si o seu espírito e o seu sopro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ele dirigisse o seu coração para isso e recolhesse para si o seu espírito e o seu sopro”. A expressão hebraica “dirigir o coração” pode significar voltar a atenção ou o propósito para algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição hipotética, sem acrescentar ênfase ausente do hebraico.
- source_word: יָשִׂים
  choice: dirigisse
  rationale: O verbo שׂים significa literalmente “pôr” ou “colocar”; com “coração”, “dirigisse” comunica em português atual a ideia de voltar a atenção ou o propósito para algo.
- source_word: אֵלָיו
  choice: para si mesmo
  rationale: A preposição אֶל com o sufixo masculino singular admite aqui sentido reflexivo. A formulação mantém Deus como referente, conforme o contexto, sem ocultar a alternativa lexical indicada na nota.
- source_word: לִבּוֹ
  choice: o coração
  rationale: Preserva a expressão antropológica hebraica, na qual “coração” abrange atenção, intenção e vontade.
- source_word: רוּחוֹ
  choice: o seu espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. “Espírito” preserva a distinção em relação a נְשָׁמָה e se ajusta ao contexto da vida concedida por Deus.
- source_word: וְנִשְׁמָתוֹ
  choice: e o seu sopro
  rationale: נְשָׁמָה designa o sopro, especialmente o sopro vital. “Sopro” mantém o paralelismo sem fundir os dois termos hebraicos.
- source_word: יֶאֱסֹף
  choice: recolhesse
  rationale: אָסַף significa reunir ou recolher. “Recolhesse” conserva a imagem lexical e, no contexto, sugere que Deus toma de volta o princípio vital.
theological_decisions:
- issue: Referente dos pronomes masculinos no singular
  choice: 'Os pronomes são entendidos como referentes a Deus, e o primeiro אֵלָיו recebe sentido reflexivo: “para si mesmo”.'
  alternative: A expressão pode ser entendida como “dirigisse o coração para isso”, isto é, se voltasse sua atenção ou propósito para a ação descrita.
  rationale: O argumento de Eliú trata do domínio de Deus sobre a vida que ele concede. O contexto favorece a leitura reflexiva, mas a construção hebraica permite uma nuance menos definida, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura condicional permanece aberta porque a consequência aparece no versículo seguinte. “Espírito” e “sopro” preservam os dois termos distintos do hebraico.
