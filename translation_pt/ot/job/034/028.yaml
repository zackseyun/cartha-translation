  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/הָבִ֣יא עָ֭לָי/ו צַֽעֲקַת דָּ֑ל וְ/צַעֲקַ֖ת עֲנִיִּ֣ים יִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: pt
  text: para fazer chegar diante dele[a] o clamor do pobre[b]; e ele ouve o clamor dos aflitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre ele” ou “contra ele”; a preposição hebraica admite mais de uma interpretação neste trecho.
    reason: lexical_alternative
  - marker: b
    text: Ou “do fraco”. Os dois termos hebraicos traduzidos por “pobre” e “aflitos” têm sentidos próximos, mas não idênticos; também podem ser traduzidos por “o pobre... os oprimidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: para fazer chegar
  rationale: O לְ prefixado ao infinitivo construto hifil de בוא expressa propósito ou resultado em relação ao contexto anterior. “Para fazer chegar” conserva essa força e soa natural em português.
- source_word: עָלָיו
  choice: diante dele
  rationale: Com בוא, a preposição על pode indicar que o clamor chega à presença ou à atenção de alguém. “Diante dele” comunica naturalmente a apresentação da causa a Deus, sem ocultar outras análises possíveis.
- source_word: צַעֲקַת
  choice: o clamor
  rationale: צְעָקָה designa um grito ou clamor, frequentemente motivado por aflição. “Clamor” é direto, digno e adequado ao contexto judicial.
- source_word: דָּל
  choice: do pobre
  rationale: דַּל pode designar quem é pobre, fraco ou socialmente desamparado. “Pobre” é a tradução mais corrente aqui e mantém a vulnerabilidade social do termo.
- source_word: וְצַעֲקַת
  choice: e ... o clamor
  rationale: A repetição de “clamor” preserva o paralelismo retórico do hebraico.
- source_word: עֲנִיִּים
  choice: dos aflitos
  rationale: עֲנִיִּים pode significar pobres, necessitados, aflitos ou oprimidos. “Aflitos” distingue o termo de דָּל sem negar a sobreposição entre ambos.
- source_word: יִשְׁמָע
  choice: ele ouve
  rationale: O imperfeito pode exprimir ação característica na poesia sapiencial. O presente descreve Deus como aquele que ouve tais clamores.
theological_decisions:
- issue: Referente do pronome em עָלָיו e sujeito de יִשְׁמָע
  choice: O clamor é levado diante de Deus, e Deus ouve o clamor dos aflitos.
  alternative: O clamor é levantado contra o opressor e Deus o ouve; ou o clamor sobrevém ao opressor, que o ouve.
  rationale: No contexto imediato, Eliú descreve a opressão praticada pelos perversos e o conhecimento judicial de Deus. O sujeito implícito de “ouve” é mais naturalmente Deus, e “diante dele” representa bem a ideia de o clamor chegar à sua atenção. A ambiguidade da preposição, porém, é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo poético e a repetição de “clamor” foram mantidos; o ponto e vírgula torna clara a relação entre as duas orações sem resolver além do necessário a tensão sintática.
