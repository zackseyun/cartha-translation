  text: יִגְוַ֣ע כָּל בָּשָׂ֣ר יָ֑חַד וְ֝/אָדָ֗ם עַל עָפָ֥ר יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/015.yaml
  text: all flesh would perish together[a], and man would return to dust.
translation:
  language: pt
  text: toda carne pereceria ao mesmo tempo, e o ser humano[a] voltaria ao pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. O hebraico usa aqui אָדָם no singular, com sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: pereceria
  rationale: O verbo גוע descreve expirar ou morrer. “Pereceria” conserva a solenidade da afirmação e, no condicional, retoma naturalmente a condição expressa no versículo anterior.
- source_word: כָּל בָּשָׂר
  choice: toda carne
  rationale: Mantém o idioma hebraico e sua força retórica, sem restringir de modo indevido a referência aos seres humanos.
- source_word: יָחַד
  choice: ao mesmo tempo
  rationale: Expressa aqui a simultaneidade coletiva de modo claro e idiomático em português.
- source_word: אָדָם
  choice: o ser humano
  rationale: O substantivo singular tem sentido coletivo e genérico neste paralelismo. “O ser humano” preserva o singular e comunica de forma inequívoca a referência à humanidade.
- source_word: עַל עָפָר
  choice: ao pó
  rationale: Com o verbo שוב, “voltar ao pó” é a formulação idiomática portuguesa correspondente à imagem hebraica da mortalidade e da origem terrestre.
- source_word: יָשׁוּב
  choice: voltaria
  rationale: שוב significa “voltar, retornar”; o futuro hebraico assume valor condicional por continuidade com o versículo anterior.
theological_decisions:
- issue: Sentido genérico e coletivo de אָדָם
  choice: o ser humano
  alternative: a humanidade
  rationale: A forma hebraica é singular, mas representa coletivamente a humanidade. A tradução principal preserva esse singular genérico; a nota registra a alternativa coletiva sem limitar a referência ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. “Toda carne” preserva o paralelismo e a imagem do hebraico; “ao mesmo tempo” evita a possível ambiguidade de “juntamente”, e “o ser humano” comunica o valor coletivo de אָדָם com naturalidade.
