  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/006.yaml
  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: pt
  text: Acaso eu mentiria a respeito do meu direito?[a] Minha ferida é incurável[b], embora eu não tenha cometido transgressão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contra o meu direito, sou considerado mentiroso”, entendendo a primeira oração como uma declaração, e não como uma pergunta retórica.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “minha flecha é incurável”; “flecha” provavelmente representa a ferida ou aflição que o atingiu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: a respeito de
  rationale: 'Com אכזב e מִשְׁפָּטִי, expressa o assunto da declaração: “a respeito do meu direito”. A leitura adversativa “contra” continua possível na construção alternativa indicada em nota.'
- source_word: מִשְׁפָּטִי
  choice: meu direito
  rationale: Preserva o sentido jurídico da reivindicação justa de Jó sem restringir o termo a uma sentença judicial; “minha causa” também seria possível.
- source_word: אֲכַזֵּב
  choice: Acaso eu mentiria
  rationale: Entende a forma verbal como uma pergunta retórica, adequada à fala citada por Eliú. A sintaxe hebraica também admite uma declaração com sentido semelhante a “sou considerado mentiroso”, preservada em nota.
- source_word: אָנ֖וּשׁ
  choice: é incurável
  rationale: O adjetivo descreve algo sem cura ou desesperadamente grave e concorda semanticamente com a aflição representada pela flecha.
- source_word: חִצִּי
  choice: minha ferida
  rationale: Literalmente, “minha flecha”; no contexto, a flecha representa a ferida ou aflição que atingiu Jó. A tradução comunica o referente natural em português e a imagem literal é preservada em nota.
- source_word: בְלִי
  choice: embora eu não tenha cometido
  rationale: O hebraico exprime ausência, literalmente “sem transgressão”. A formulação concessiva explicita em português a relação contextual entre a aflição grave e a alegada ausência de delito, sem afirmar mais do que a reivindicação citada.
- source_word: פָשַׁע
  choice: transgressão
  rationale: Mantém o peso moral e jurídico do termo, que pode designar delito ou rebelião, em vez de reduzi-lo ao sentido genérico de erro.
theological_decisions:
- issue: Interpretação da afirmação de Jó citada por Eliú
  choice: Apresentar a primeira oração como pergunta retórica e a segunda como protesto de sofrimento imerecido.
  alternative: 'Ler a primeira oração como declaração: “Contra o meu direito, sou considerado mentiroso”.'
  rationale: O hebraico é condensado e admite mais de uma análise. A leitura principal preserva a reivindicação de Jó de que negar seu direito seria mentir, enquanto a nota mantém a alternativa sem resolver indevidamente a tensão.
- issue: Imagem da flecha
  choice: Traduzir o referente metafórico como “ferida” no texto.
  alternative: Manter literalmente “minha flecha”.
  rationale: A flecha representa a aflição infligida a Jó. “Ferida” é natural e inteligível em português, enquanto a nota conserva a imagem concreta do hebraico.
- issue: Ausência de transgressão
  choice: 'Formular como a alegação de Jó: “embora eu não tenha cometido transgressão”.'
  alternative: 'Traduzir de modo nominal e literal: “sem transgressão”.'
  rationale: A forma verbal é idiomática em português e, dentro da citação resumida por Eliú, não transforma a reivindicação de Jó numa declaração doutrinária independente sobre impecabilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acaso” sinaliza de modo natural a pergunta retórica; “direito”, “ferida incurável” e “transgressão” preservam, respectivamente, os campos jurídico, corporal e moral do hebraico. Os marcadores aparecem no texto em ordem de ocorrência.
