  - severity: low
    issue: A alternativa «pode conter» na nota a é pouco idiomática sem objeto.
    rationale: Em português, «conter» é normalmente transitivo neste sentido. «Restringir» expressa de forma mais natural a alternativa semântica de conter/refrear.
  - severity: low
    issue: «Um poderoso justo» na nota b é uma alternativa pouco natural e não reflete bem a determinação contextual.
    rationale: «Um justo poderoso» ou «o poderoso justo» são formulações portuguesas mais naturais; a primeira preserva melhor a possibilidade de leitura não titular.
