  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: pt
  text: Será que alguém que odeia a justiça pode governar?[a] E você condenará Aquele que é justo e poderoso?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pode dominar”, “pode restringir” ou, mais literalmente, “pode atar”. Neste contexto, o verbo hebraico provavelmente se refere ao exercício de governo ou de controle.
    reason: lexical_alternative
  - marker: b
    text: Ou “o justo poderoso” ou “o grande justo”. A expressão é mais naturalmente entendida aqui como uma referência a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Será que
  rationale: Introduz naturalmente em português a pergunta retórica enfática, sem tornar explícito demais o valor possível de אַף.
- source_word: שׂוֹנֵא
  choice: alguém que odeia
  rationale: O particípio substantivado caracteriza uma pessoa por sua atitude contínua; esta formulação é natural e clara.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto, designa a ordem judicial e moral necessária ao governo, e não apenas um julgamento isolado.
- source_word: יַחֲבוֹשׁ
  choice: pode governar
  rationale: Embora o sentido básico do verbo seja “atar”, aqui ele provavelmente expressa exercer domínio ou contenção; “governar” se ajusta ao argumento sobre justiça e autoridade.
- source_word: וְאִם
  choice: E
  rationale: Liga a segunda pergunta retórica à primeira de modo natural, sem reproduzir como condição um hebraísmo que aqui tem força interrogativa.
- source_word: צַדִּיק
  choice: o Justo
  rationale: Preserva a ideia de retidão e permite que o adjetivo substantivado qualifique o provável referente divino.
- source_word: כַּבִּיר
  choice: o Poderoso
  rationale: O adjetivo substantivado pode significar “poderoso” ou “grande”; no contexto, provavelmente se refere a Deus. A maiúscula sinaliza esse referente provável sem eliminar a alternativa.
- source_word: תַּרְשִׁיעַ
  choice: você condenará
  rationale: O hifil de רשע significa declarar culpado ou condenar; a forma em futuro conserva a interpelação retórica direta.
theological_decisions:
- issue: Referente de צַדִּיק כַּבִּיר
  choice: Provável referência a Deus, expressa como “o Justo, o Poderoso”
  alternative: “um poderoso justo” ou “o grande justo”, em referência genérica a um governante poderoso e justo
  rationale: O argumento de Eliú ganha força ao perguntar se Jó condenaria Deus, o governante perfeitamente justo. A redação e as maiúsculas indicam essa leitura provável, enquanto a nota preserva a ambiguidade gramatical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Será que” comunica a força retórica; a repetição dos artigos em “o Justo, o Poderoso” apresenta os termos como duas qualificações do mesmo referente e evita a construção menos natural “o justo Poderoso”.
