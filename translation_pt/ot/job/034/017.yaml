  naturalness: «Será que alguém que odeia a justiça pode governar?» é claro e natural. «E você condenará Aquele que é justo e poderoso?» é mais fluente em português do que a aposição «o Justo, o Poderoso», sem perder o tom solene e interrogativo.
  terminology: «Justo» e «poderoso» reproduzem adequadamente צדّיק e כביר. A nota a deve evitar «conter», que normalmente requer complemento nesse uso; «restringir» comunica melhor a alternativa de contenção. A nota b deve formular alternativas portuguesas idiomáticas e não apresentar «um poderoso justo», que é menos natural e enfraquece indevidamente a determinação contextual.
