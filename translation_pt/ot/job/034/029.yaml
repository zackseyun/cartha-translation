id: JOB.34.29
reference: Job 34:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: pt
  text: Se ele concede tranquilidade, quem pode condenar?[a] Se esconde o rosto, quem pode contemplá-lo?[b] Isso vale tanto para uma nação como para um homem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “declará-lo culpado?”. O verbo hebraico pode ter o sentido jurídico de declarar alguém perverso ou culpado.
    reason: lexical_alternative
  - marker: b
    text: Ou “vê-lo?”. O verbo hebraico significa olhar, ver ou contemplar.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “e sobre uma nação e sobre um homem, juntamente”. A expressão indica que isso se aplica tanto a uma nação como a um indivíduo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: concede tranquilidade
  rationale: 'O hifil de שׁקט tem força causativa: Deus faz haver calma ou repouso. “Concede tranquilidade” preserva essa força sem restringir o sentido à paz formal.'
- source_word: יַרְשִׁעַ
  choice: condenar
  rationale: O hifil de רשע tem sentido forense de declarar alguém perverso ou culpado. “Condenar” é conciso e natural no contexto retórico.
- source_word: יַסְתֵּר פָּנִים
  choice: esconde o rosto
  rationale: Mantém literalmente a expressão antropomórfica hebraica e sua ressonância de ocultação ou retirada divina, sem reduzi-la apenas à retirada do favor.
- source_word: יְשׁוּרֶנּוּ
  choice: contemplá-lo
  rationale: O verbo שור significa olhar, ver ou contemplar. “Contemplá-lo” conserva o tom digno e o sufixo masculino singular que se refere a Deus.
- source_word: גּוֹי
  choice: nação
  rationale: Aqui גוי designa uma coletividade social ou política; “nação” evita introduzir a ideia de gentios, ausente do contexto.
- source_word: אָדָם
  choice: homem
  rationale: O singular contrasta o indivíduo com a coletividade representada pela nação. “Homem” preserva essa forma singular e representativa.
- source_word: יָחַד
  choice: tanto... como
  rationale: Neste contexto, יחד indica aplicação conjunta ou igual aos dois referentes, expressa naturalmente em português pela construção correlativa.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: Isso vale tanto para uma nação como para um homem
  rationale: A formulação comunica o alcance da afirmação anterior sobre a coletividade e o indivíduo, sem impor à preposição על um sentido exclusivamente punitivo ou espacial.
theological_decisions:
- issue: Ocultação do rosto divino
  choice: Manter “esconde o rosto”
  alternative: “afasta-se” ou “retira seu favor”
  rationale: A expressão literal preserva a antropomorfia e a tensão teológica da ocultação divina, cujo efeito não é limitado pelo texto à perda de favor.
- issue: Alcance da oração final
  choice: Aplicar a afirmação igualmente a uma nação e a um indivíduo
  alternative: 'Entender על com força adversativa ou punitiva: “contra uma nação e contra um homem”'
  rationale: A oração final amplia o princípio aos âmbitos coletivo e individual. A tradução evita especificar uma relação hostil que a preposição flexível não exige.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção retórica clara. Preserva-se a imagem hebraica de Deus esconder o rosto; a oração final é explicitada apenas o necessário para soar natural em português.
