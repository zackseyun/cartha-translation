  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: pt
  text: Jó fala sem conhecimento, e suas palavras são sem entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: sem conhecimento
  rationale: A construção com ב e o substantivo abstrato דעת indica a maneira de falar, caracterizada pela falta de conhecimento. “Sem conhecimento” é natural em português e mantém a força do hebraico.
- source_word: יְדַבֵּר
  choice: fala
  rationale: O imperfeito funciona aqui como presente em uma avaliação de Eliú acerca da fala de Jó; “fala” é direto e natural.
- source_word: דְבָרָיו
  choice: suas palavras
  rationale: O plural דברים designa palavras ou declarações; “suas palavras” preserva de modo direto a formulação e o paralelismo poético.
- source_word: בְהַשְׂכֵּיל
  choice: não têm entendimento
  rationale: A forma de שכל comunica entendimento, discernimento ou sensatez. A expressão escolhida preserva a negação e produz português corrente, em paralelo com “sem conhecimento”.
- source_word: לֹא
  choice: sem / não
  rationale: A primeira negação é vertida idiomaticamente por “sem”; na segunda oração, “não têm” expressa com naturalidade a ausência indicada pela construção hebraica.
