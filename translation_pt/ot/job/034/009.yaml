  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: pt
  text: 'Pois ele disse[a]: “O homem não ganha nada em ter prazer em Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O homem não tira proveito algum quando Deus se agrada dele”, ou: “O homem não ganha nada ao buscar o favor de Deus”. A expressão hebraica é compacta e admite mais de uma interpretação.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a acusação de Eliú no contexto anterior e mantém o fluxo argumentativo.
- source_word: אָמַר
  choice: ele disse
  rationale: O perfeito hebraico aponta para uma declaração anterior atribuída a Jó; o pretérito perfeito é natural em português.
- source_word: לֹא יִסְכָּן
  choice: não ganha nada
  rationale: Expressa de modo corrente a ideia de não obter proveito, vantagem ou benefício.
- source_word: גָּבֶר
  choice: O homem
  rationale: O substantivo masculino singular tem aqui sentido representativo ou genérico; a forma foi preservada sem restringir a afirmação a um indivíduo específico.
- source_word: בִּרְצֹתוֹ
  choice: em ter prazer
  rationale: Representa o infinitivo de רצה com o homem como sujeito mais provável, comunicando prazer ou deleite sem eliminar a concisão ambígua do hebraico.
- source_word: עִם אֱלֹהִים
  choice: em Deus
  rationale: Embora עִם costume significar “com”, a expressão relacional fica mais natural em português como “ter prazer em Deus”; outras construções possíveis são registradas na nota.
theological_decisions:
- issue: Interpretação de בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: o homem não obtém proveito em ter prazer em Deus
  alternative: o homem não obtém proveito quando Deus se agrada dele; ou ao buscar o favor de Deus
  rationale: O sufixo é entendido, de modo mais direto, com o homem como sujeito, em harmonia com a acusação de que a devoção não traz proveito. Como a construção hebraica é compacta e admite outras análises, a tensão interpretativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Pois” conserva a ligação argumentativa; “não ganha nada” é idiomático, e “ter prazer em Deus” mantém o sentido religioso sem acrescentar terminologia confessional.
