  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: pt
  text: Pois ele acrescenta rebeldia ao seu pecado; bate palmas entre nós[a] e multiplica suas palavras contra Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bate uma mão contra a outra”. O gesto provavelmente expressa desprezo, desafio ou zombaria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a Deus”. A preposição hebraica pode indicar mais neutralmente direção, mas o contexto favorece o sentido adversativo: “contra Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o juízo expresso no contexto anterior, com valor explicativo natural em português.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: acrescenta ... ao seu pecado
  rationale: Preserva a imagem de adicionar uma nova falta a um pecado já existente e reproduz de modo natural a construção com עַל.
- source_word: פֶשַׁע
  choice: rebeldia
  rationale: O termo denota transgressão com nuance de revolta ou desafio, mais forte do que uma falta genérica.
- source_word: בֵּינֵינוּ
  choice: entre nós
  rationale: Representa diretamente a expressão hebraica e situa o gesto no meio dos presentes.
- source_word: יִסְפּוֹק
  choice: bate palmas
  rationale: Mantém o gesto concreto tradicionalmente associado ao verbo neste contexto, sem incorporar ao texto principal uma interpretação específica de sua intenção.
- source_word: וְיֶרֶב
  choice: e multiplica
  rationale: Conserva a imagem enfática de tornar numerosas ou acumular palavras.
- source_word: אֲמָרָיו
  choice: suas palavras
  rationale: É a tradução direta, ampla e não interpretativamente carregada do substantivo plural.
- source_word: לָאֵל
  choice: contra Deus
  rationale: Embora ל possa indicar simples direção, o contexto acusatório e a progressão retórica favorecem o sentido adversativo.
theological_decisions:
- issue: Se as palavras são dirigidas simplesmente “a Deus” ou proferidas “contra Deus”.
  choice: contra Deus
  alternative: a Deus
  rationale: A sequência — pecado, rebeldia, gesto desafiador e palavras numerosas — favorece uma acusação de oposição. A alternativa mais neutra permanece registrada em nota para preservar a ambiguidade da preposição hebraica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa. “Bate palmas” preserva o gesto concreto, enquanto a nota evita que a associação moderna com aplauso oculte sua provável força de desprezo ou desafio.
