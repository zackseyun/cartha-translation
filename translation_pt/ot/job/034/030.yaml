  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: pt
  text: para impedir que um homem ímpio reine[a] e que o povo caia em armadilhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que um homem ímpio não reine, para que não haja armadilhas para o povo”. O hebraico é condensado e admite várias traduções próximas, construídas em torno de “reinar” e “armadilhas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: para impedir que ... reine
  rationale: O מִן prefixado ao infinitivo construto de מלך tem aqui sentido preventivo, dependente da ação divina mencionada no contexto anterior. Esta formulação expressa isso naturalmente em português.
- source_word: אָדָם
  choice: um homem
  rationale: Refere-se a um indivíduo que exerce governo, não à humanidade em geral.
- source_word: חָנֵף
  choice: ímpio
  rationale: Em Jó, o termo caracteriza alguém moral e religiosamente irreverente; “ímpio” preserva essa força melhor que “hipócrita”.
- source_word: מִמֹּקְשֵׁי
  choice: caia em armadilhas
  rationale: A expressão hebraica é comprimida e contém o plural ligado a “armadilha”. A formulação comunica de modo natural a ideia provável de impedir que o povo seja enredado, sem eliminar a ambiguidade, registrada na nota.
- source_word: עָם
  choice: o povo
  rationale: Designa a comunidade submetida ao governo em questão.
theological_decisions:
- issue: Sintaxe comprimida do versículo
  choice: A ação divina impede que um homem ímpio reine e que o povo seja enredado.
  alternative: “para que um homem ímpio não reine, para que não haja armadilhas para o povo”; também se pode relacionar a frase às “armadilhas do povo”.
  rationale: O hebraico é elíptico e depende do versículo anterior. A leitura escolhida acompanha a lógica preventiva do contexto, mas a nota conserva alternativas próximas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Ímpio” conserva o teor sapiencial e religioso; a oração com “para impedir” torna explícita apenas a relação preventiva indicada pelo contexto.
