source:
  edition: WLC
  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: pt
  text: De fato[a], Deus não age perversamente, e o Todo-Poderoso não perverte a justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus não condena injustamente” ou “Deus não declara culpado”. O verbo hebraico pode ter sentido judicial em alguns contextos.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: De fato
  rationale: A combinação reforça e confirma enfaticamente a afirmação. “De fato” comunica essa força asseverativa em português atual e natural.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל funciona como título ou designação do Deus de Israel. “Deus” é a forma mais natural e evita redundância com o título paralelo “Todo-Poderoso”.
- source_word: יַרְשִׁיעַ
  choice: não age perversamente
  rationale: O hifil de רשע pode ter sentido forense, como “declarar culpado” ou “condenar”, mas o paralelismo com a afirmação de que Deus não perverte a justiça favorece aqui o sentido mais amplo de agir perversamente. A nota preserva a possibilidade judicial.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: É a tradução tradicional, clara e contextualmente adequada do título divino שַׁדַּי no livro de Jó.
- source_word: יְעַוֵּת
  choice: não perverte
  rationale: O verbo expressa a ideia de torcer ou distorcer. “Perverter a justiça” é uma combinação precisa, natural e de tom jurídico em português.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto, מִשְׁפָּט indica a justiça ou o julgamento justo como princípio. “Justiça” forma o paralelo mais claro e idiomático.
theological_decisions:
- issue: Sentido de יַרְשִׁיעַ em relação ao caráter de Deus
  choice: Deus não age perversamente
  alternative: Deus não condena injustamente; Deus não declara culpado
  rationale: O versículo afirma a integridade moral e judicial de Deus. Embora a forma verbal possa ter sentido forense, o paralelismo imediato favorece uma negação mais ampla de ação perversa, sem eliminar a leitura judicial, que é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Age perversamente” preserva a força moral do verbo sem restringi-lo indevidamente ao âmbito judicial; a nota registra essa ambiguidade legítima.
