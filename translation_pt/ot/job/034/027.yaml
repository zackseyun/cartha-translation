  text: אֲשֶׁ֣ר עַל כֵּ֭ן סָ֣רוּ מֵֽ/אַחֲרָ֑י/ו וְ/כָל דְּ֝רָכָ֗י/ו לֹ֣א הִשְׂכִּֽילוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: pt
  text: porque se desviaram de segui-lo[a] e não consideraram nenhum de seus caminhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de detrás dele”, expressão hebraica que significa “de segui-lo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e não compreenderam nenhum de seus caminhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: porque
  rationale: A expressão introduz a causa do juízo descrito no contexto anterior; “porque” transmite de modo natural sua força causal.
- source_word: סָרוּ
  choice: se desviaram
  rationale: O verbo סור indica afastar-se ou desviar-se, aqui com nuance moral e relacional.
- source_word: מֵאַחֲרָיו
  choice: de segui-lo
  rationale: A expressão literalmente significa “de detrás dele”, idioma hebraico que, neste contexto, significa deixar de seguir alguém.
- source_word: וְכָל דְּרָכָיו
  choice: nenhum de seus caminhos
  rationale: Embora o hebraico diga literalmente “todos os seus caminhos”, sob a negação a formulação portuguesa natural é “nenhum de seus caminhos”.
- source_word: לֹא הִשְׂכִּילוּ
  choice: não consideraram
  rationale: O hifil de שׂכל pode exprimir compreender, considerar ou agir com discernimento. “Não consideraram” preserva aqui a ideia de não prestar atenção aos caminhos dele sem reduzir o sentido a mera incapacidade intelectual.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em מֵאַחֲרָיו e דְּרָכָיו
  choice: Manter os pronomes em minúsculas, deixando o contexto apontar para Deus
  alternative: Explicitar “Deus” ou entender a referência como um governante ou juiz humano
  rationale: O discurso mais amplo de Eliú favorece Deus como referente, mas o hebraico emprega apenas sufixos pronominais. A tradução conserva essa forma e não elimina por explicitação uma possível ambiguidade imediata.
- issue: Amplitude semântica de הִשְׂכִּילוּ
  choice: não consideraram
  alternative: não compreenderam
  rationale: O verbo admite ambos os sentidos. Neste contexto, “consideraram” comunica atenção reflexiva e responsabilidade moral, sem afirmar apenas uma deficiência cognitiva.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção mantém a causalidade, a metáfora relacional do desvio e a ambiguidade lexical de שׂכל por meio de nota.
