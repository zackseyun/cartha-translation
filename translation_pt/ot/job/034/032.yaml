  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: pt
  text: O que não vejo, ensina-me[a]; se pratiquei o mal, não voltarei a fazê-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que não vejo, mostra-me/ensina-me”. O hebraico é elíptico e também pode ser entendido como: “Além do que vejo, ensina-me”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “não acrescentarei mais”, isto é, “não continuarei” ou “não voltarei a fazê-lo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: O que não vejo
  rationale: A expressão hebraica é elíptica. Esta formulação comunica naturalmente aquilo que o falante não percebe ou reconhece, preservando a imagem de ver.
- source_word: אַתָּה הֹרֵנִי
  choice: ensina-me
  rationale: O hifil de ירה significa com frequência ensinar ou instruir. A escolha expressa um pedido de correção divina em português corrente e digno.
- source_word: אִם
  choice: se
  rationale: Introduz de modo direto a condição formulada pelo falante.
- source_word: עָוֶל פָּעַלְתִּי
  choice: pratiquei o mal
  rationale: עָוֶל designa maldade, injustiça ou conduta errada, e פעל significa fazer ou praticar. A expressão portuguesa é clara e mantém a amplitude moral do original.
- source_word: לֹא אֹסִיף
  choice: não voltarei a fazê-lo
  rationale: Com a negação, יסף comunica não tornar a fazer ou não continuar. A tradução explicita de maneira natural o objeto subentendido.
theological_decisions:
- issue: A fala como expressão de disposição para aprender e abandonar o mal diante de Deus
  choice: Manter o pedido de instrução e o compromisso condicional de não repetir o mal.
  alternative: Empregar terminologia doutrinária mais forte, como confissão formal ou arrependimento pleno.
  rationale: O hebraico apresenta humildade, abertura à correção e propósito de não persistir no erro, mas não exige terminologia teológica mais específica.
- issue: Ambiguidade da frase inicial
  choice: Traduzir no texto como “O que não vejo”, registrando em nota a construção mais literal e a alternativa possível.
  alternative: “Além do que vejo” ou “Fora do que vejo”.
  rationale: A construção é elíptica e admite mais de uma análise. A tradução principal oferece o sentido contextual mais natural sem ocultar a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente naturalizada, sem eliminar a concisão nem a ambiguidade genuína do hebraico.
