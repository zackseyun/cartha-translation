  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: pt
  text: e anda em companhia dos que praticam a maldade[a] e caminha com homens perversos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “associa-se aos que praticam a maldade”. O verbo hebraico pode indicar viajar em companhia de alguém ou associar-se a outros.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens maus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: e anda em companhia
  rationale: A combinação idiomática expressa associação ou companheirismo, embora conserve uma imagem de deslocamento. A formulação portuguesa é natural e mantém essa imagem em paralelo com “caminha”.
- source_word: עִם
  choice: com
  rationale: É a preposição comum de companhia ou associação nas duas orações.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a maldade
  rationale: Reproduz o sentido ativo de “praticantes/fazedores” e o valor moral de אָוֶן, em português corrente, sem reduzir a expressão a um simples adjetivo.
- source_word: וְ/לָ/לֶכֶת
  choice: e caminha
  rationale: Preserva a imagem hebraica de andar, que pode indicar tanto companhia quanto conduta ou modo de vida.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: homens perversos
  rationale: Mantém a referência explicitamente masculina de אַנְשֵׁי e comunica de modo natural o sentido moral de רֶשַׁע.
theological_decisions:
- issue: Expressão de gênero em אַנְשֵׁי רֶשַׁע
  choice: homens perversos
  alternative: pessoas perversas; os perversos
  rationale: O hebraico emprega explicitamente o substantivo masculino plural “homens”. A tradução conserva esse dado textual sem ampliar nem neutralizar a referência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo entre “anda em companhia” e “caminha com” preserva a imagem e a tensão sem transformar os dois membros em repetições idênticas.
