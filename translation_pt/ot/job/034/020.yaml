  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: pt
  text: Num instante, eles morrem; à meia-noite, um povo é sacudido e desaparece; o poderoso é removido, não por mão humana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não por mão”; provavelmente, sem intervenção humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: num instante
  rationale: Expressa diretamente um período extremamente breve e preserva a força temporal do hebraico.
- source_word: יָמֻתוּ
  choice: eles morrem
  rationale: Tradução direta do verbo comum para morrer, adequada ao foco na mortalidade súbita.
- source_word: וַחֲצוֹת לָיְלָה
  choice: à meia-noite
  rationale: Equivalente idiomático e natural da expressão hebraica 'na metade da noite'.
- source_word: יְגֹעֲשׁוּ
  choice: é sacudido
  rationale: Preserva a ideia de abalo ou agitação intensa e concorda com o coletivo singular עָם.
- source_word: עָם
  choice: um povo
  rationale: Mantém o substantivo coletivo singular e seu caráter indefinido.
- source_word: וְיַעֲבֹרוּ
  choice: e desaparece
  rationale: No contexto, עבר indica que o povo passa e deixa de estar presente; 'desaparece' comunica isso naturalmente sem repetir 'morre'.
- source_word: וְיָסִירוּ
  choice: é removido
  rationale: A forma hebraica tem agente não expresso; a passiva em português preserva essa indeterminação.
- source_word: אַבִּיר
  choice: o poderoso
  rationale: Representa o substantivo singular que designa alguém forte ou poderoso, sem transformá-lo desnecessariamente em plural coletivo.
- source_word: לֹא בְיָד
  choice: não por mão humana
  rationale: Torna explícito o sentido idiomático provável de ausência de ação humana, preservando a imagem da 'mão'.
theological_decisions:
- issue: Agência implícita em לֹא בְיָד
  choice: não por mão humana
  alternative: não por mão
  rationale: A expressão provavelmente nega a intervenção humana e sugere, sem declarar de modo explícito, uma ação além dos meios humanos. A nota registra a forma literal para preservar a tensão e a imagem hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa e paralelismo próximo ao hebraico. O marcador [a] aparece imediatamente após a expressão anotada.
