  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: pt
  text: 'Portanto, homens de entendimento, escutem-me: longe de Deus agir com maldade e do Todo-Poderoso cometer injustiça.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “longe de Deus a maldade, e do Todo-Poderoso a injustiça”. O hebraico expressa que tais males são inconcebíveis em relação a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão ou inferência de Eliú com base no argumento anterior.
- source_word: אַנֲשֵׁי לֵבָב
  choice: homens de entendimento
  rationale: Literalmente, “homens de coração”; no idioma hebraico, “coração” pode designar entendimento e discernimento. A tradução preserva tanto o sentido idiomático quanto a forma masculina plural.
- source_word: שִׁמְעוּ לִי
  choice: escutem-me
  rationale: Expressa de modo natural em português o imperativo de ouvir com atenção o que o orador dirá.
- source_word: חָלִילָה לָאֵל מֵרֶשַׁע
  choice: longe de Deus praticar a maldade
  rationale: חָלִילָה é uma rejeição enfática; a formulação portuguesa comunica que a maldade é inconcebível em relação a Deus, explicitando a ação implícita na construção hebraica.
- source_word: וְשַׁדַּי
  choice: e do Todo-Poderoso
  rationale: שַׁדַּי funciona aqui como título divino e é traduzido por seu equivalente tradicional e compreensível em português.
- source_word: מֵעָוֶל
  choice: cometer injustiça
  rationale: עָוֶל designa injustiça, perversidade ou ação errada. “Cometer injustiça” mantém o paralelismo com “praticar a maldade” e soa natural em português.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: Como o termo funciona como título divino, sua tradução torna o sentido acessível sem tratá-lo como nome próprio.
- issue: Expressão masculina אַנֲשֵׁי לֵבָב
  choice: homens de entendimento
  alternative: pessoas de entendimento
  rationale: Mantém a forma masculina plural do hebraico e traduz idiomaticamente o valor cognitivo de “coração”.
- issue: Forma da negação enfática חָלִילָה
  choice: longe de Deus praticar a maldade
  alternative: longe de Deus a maldade
  rationale: A opção escolhida explicita em português a ação elíptica sem resolver além do necessário a afirmação hebraica de que maldade e injustiça são inconcebíveis em Deus.
translation_notes:
  register: Português moderno, claro e solene, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. “Escutem-me” conserva o apelo direto; “praticar” e “cometer” dão fluidez ao paralelismo sem apagar a formulação nominal possível no hebraico.
