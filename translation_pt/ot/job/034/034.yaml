  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: pt
  text: Homens de entendimento me dirão,[a] e um homem sábio que me escuta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “homens de coração”, expressão que indica pessoas de entendimento ou discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: homens de entendimento
  rationale: Literalmente, “homens de coração”. No hebraico, “coração” pode designar a faculdade de pensar e discernir; “homens de entendimento” comunica naturalmente o sentido idiomático e mantém a forma masculina do texto.
- source_word: יֹאמְרוּ לִי
  choice: me dirão
  rationale: A forma yiqtol admite aqui sentido prospectivo. “Me dirão” expressa de modo conciso a expectativa de Eliú quanto ao juízo de ouvintes discernentes.
- source_word: וְגֶבֶר חָכָם
  choice: e o homem sábio
  rationale: גֶּבֶר pode ressaltar o homem adulto ou forte, mas o paralelismo favorece aqui o sentido simples de “homem”; חָכָם significa “sábio”. O singular definido soa natural em português com valor representativo.
- source_word: שֹׁמֵעַ לִי
  choice: que me escuta
  rationale: O particípio caracteriza o homem sábio como alguém que ouve Eliú. “Escuta” preserva o ato de ouvir com atenção sem acrescentar a ideia mais forte de obedecer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira. A vírgula final preserva a continuidade sintática com o versículo seguinte; a estrutura paralela e a referência masculina do hebraico foram mantidas.
