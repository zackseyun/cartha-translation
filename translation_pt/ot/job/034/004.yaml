base_translation:
  language: en
  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: pt
  text: Escolhamos para nós o que é justo[a]; discernamos entre nós o que é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Escolhamos a justiça para nós; reconheçamos entre nós o que é bom.”'
    reason: Alternativa lexical que preserva מִשְׁפָּט como substantivo abstrato e ידע em seu sentido mais formal.
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: o que é justo
  rationale: O substantivo pode significar justiça, juízo ou decisão judicial. Aqui, como objeto de uma exortação à avaliação conjunta, “o que é justo” preserva o sentido ético e judicial com naturalidade em português.
- source_word: נִבְחֲרָה
  choice: escolhamos
  rationale: O imperfeito qal na primeira pessoa do plural tem força coortativa; “escolhamos” expressa diretamente essa exortação.
- source_word: לָּנוּ
  choice: para nós
  rationale: A preposição ל com o pronome da primeira pessoa plural indica vantagem ou referência. “Para nós” mantém a forma do hebraico sem acrescentar uma ênfase reflexiva obrigatória.
- source_word: נֵדְעָה
  choice: discernamos
  rationale: Embora ידע costume significar “saber/conhecer”, neste contexto de avaliação do que é bom o verbo assume a nuance de reconhecer mediante discernimento. “Discernamos” comunica essa função naturalmente.
- source_word: בֵינֵינוּ
  choice: entre nós
  rationale: A expressão indica deliberação mútua no grupo; “entre nós” é idiomático e próximo da formulação hebraica.
- source_word: מַה טּוֹב
  choice: o que é bom
  rationale: A tradução conserva a amplitude de טוֹב — aquilo que é bom, benéfico ou correto — sem restringir indevidamente o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas exortativas naturais. A repetição de “nós” preserva a dimensão coletiva da deliberação, e a nota mantém a alternativa mais formal para os principais termos ambíguos.
