  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: pt
  text: Quem lhe confiou a terra[a]? E quem colocou sobre ele o mundo inteiro?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem o encarregou da terra? E quem lhe confiou o mundo inteiro?” O verbo hebraico פקד pode significar nomear, encarregar ou confiar uma responsabilidade; no segundo membro, o verbo significa literalmente “pôr” ou “colocar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד עָלָיו אֶרֶץ
  choice: o encarregou de cuidar da terra
  rationale: A construção פקד com עַל pode expressar a atribuição de responsabilidade. Em português, “encarregou de cuidar” comunica naturalmente a pergunta retórica sobre quem teria confiado a Deus a administração da terra, sem sugerir que a terra foi colocada literalmente acima dele.
- source_word: עָלָיו
  choice: o
  rationale: O sufixo masculino singular se refere mais naturalmente a Deus no contexto; integrado à locução verbal portuguesa, torna-se o objeto “o” em “o encarregou”.
- source_word: אָרְצָה
  choice: a terra
  rationale: Em paralelo com תֵּבֵל e num contexto de alcance cósmico, אֶרֶץ designa a terra, não uma região local.
- source_word: שָׂם
  choice: confiou
  rationale: O sentido básico é “pôr, colocar”, mas neste paralelismo pode indicar colocar algo sob a responsabilidade de alguém. “Confiou” produz uma formulação clara em português e mantém a ideia de incumbência presente no primeiro membro.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: o mundo inteiro
  rationale: תֵּבֵל denota o mundo habitado ou ordenado, e כֻּלָּהּ ressalta sua totalidade; “o mundo inteiro” preserva essa ênfase de modo idiomático.
theological_decisions:
- issue: Referente do pronome em עָלָיו
  choice: 'O pronome se refere a Deus: “o encarregou”.'
  alternative: A construção pode ser traduzida de forma mais espacial, como “pôs a terra sobre ele”, ou entendida em algumas leituras como referência a outra entidade.
  rationale: No argumento de Eliú em Jó 34:10–15, a pergunta enfatiza que nenhuma autoridade superior incumbiu Deus de governar a terra. O masculino singular aponta naturalmente para Deus, embora a forma condensada do hebraico permita variações de tradução.
- issue: Relação entre os dois membros do versículo
  choice: Ambos expressam a atribuição de responsabilidade sobre a criação.
  alternative: 'O segundo membro pode ser vertido mais literalmente: “quem colocou o mundo inteiro?”'
  rationale: O paralelismo favorece entender שׂם como uma segunda formulação da incumbência. A nota conserva a alternativa mais literal e evita ocultar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução explicita idiomaticamente a ideia administrativa sugerida por פקד com עַל, enquanto a nota preserva uma formulação mais próxima da imagem e da ambiguidade do hebraico.
