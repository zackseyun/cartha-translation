base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: pt
  text: 'Pois Jó disse: “Estou com a razão, e Deus tirou-me o direito.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha justiça” ou “a justiça que me era devida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Eliú com valor argumentativo, ligando naturalmente este versículo ao contexto anterior.
- source_word: אָמַר
  choice: disse
  rationale: O qatal relata uma declaração anterior de Jó. Em português, o pretérito perfeito é a forma natural e suficiente neste contexto.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: צָדַקְתִּי
  choice: Eu estou com a razão
  rationale: Expressa a alegação de Jó de estar certo em sua causa, preservando a nuance forense sem sugerir necessariamente perfeição moral absoluta.
- source_word: וְאֵל
  choice: e Deus
  rationale: אֵל designa Deus sem exigir ampliação titular; a conjunção foi mantida como aditiva, sem introduzir um contraste não explicitado.
- source_word: הֵסִיר
  choice: me negou
  rationale: O hifil de סור significa remover ou tirar. Com 'justiça', 'me negou' transmite de modo natural em português a ideia de privação daquilo que Jó considera devido a ele.
- source_word: מִשְׁפָּטִי
  choice: justiça
  rationale: O termo pode indicar justiça, direito ou decisão judicial. 'Justiça' mantém sua força jurídica e moral; o pronome sufixado é expresso naturalmente pela construção 'me negou justiça'.
theological_decisions:
- issue: Nuance forense da afirmação de Jó
  choice: “Eu estou com a razão”
  alternative: “Eu sou justo”
  rationale: Vincula a fala à reivindicação de Jó em sua controvérsia, sem transformá-la em uma alegação abrangente de impecabilidade moral.
- issue: Sentido de מִשְׁפָּטִי
  choice: “me negou justiça”
  alternative: “tirou de mim o meu direito” ou “negou a justiça que me era devida”
  rationale: Preserva as dimensões jurídica e moral do hebraico, enquanto a nota registra alternativas que tornam explícita a ideia de direito devido.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A formulação conserva o tom forense do hebraico e sua ambiguidade entre justiça e direito.
