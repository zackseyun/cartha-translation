base_translation:
  language: en
  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: pt
  text: Se você tem entendimento, ouça isto; dê atenção à voz das minhas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao som das minhas palavras». O hebraico pode significar literalmente «à voz» ou «ao som das minhas palavras».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Se
  rationale: A conjunção com a partícula condicional introduz um apelo condicionado à capacidade de entender. Em português atual, «Se» expressa isso naturalmente, sem necessidade de representar separadamente o וְ.
- source_word: בִּינָה
  choice: entendimento
  rationale: O substantivo denota entendimento ou discernimento. «Entendimento» é claro, amplo e adequado ao apelo de Eliú.
- source_word: שִׁמְעָה
  choice: ouça
  rationale: O imperativo de שׁמע é traduzido diretamente por «ouça», preservando sua força e distinguindo-o do verbo seguinte, que ressalta atenção.
- source_word: זֹּאת
  choice: isto
  rationale: O demonstrativo aponta para o conteúdo que Eliú apresenta. «Isto» preserva a forma concisa sem acrescentar um substantivo interpretativo.
- source_word: הַאֲזִינָה
  choice: dê atenção
  rationale: O verbo pede escuta atenta. «Dê atenção» diferencia este segundo imperativo de «ouça» e soa natural e digno em português moderno.
- source_word: לְקוֹל
  choice: à voz
  rationale: קוֹל pode significar «voz» ou «som». Com «das minhas palavras», «à voz» preserva a construção concreta e poética do hebraico; a alternativa «ao som» permanece possível.
- source_word: מִלָּי
  choice: das minhas palavras
  rationale: O substantivo plural se refere às palavras ou declarações faladas de Eliú. A tradução mantém o plural concreto e a relação possessiva.
