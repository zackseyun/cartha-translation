  text: Ouçam minhas palavras, sábios; vocês que sabem, deem-me ouvidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע; “ouçam” preserva a força direta da ordem e forma um paralelismo natural com o segundo imperativo.
- source_word: חֲכָמִים
  choice: sábios
  rationale: Adjetivo plural substantivado em função vocativa. “Sábios” é conciso, natural e não acrescenta um substantivo ausente no hebraico.
- source_word: מִלָּי
  choice: as minhas palavras
  rationale: Plural com sufixo de primeira pessoa singular; a tradução mantém o sentido concreto de palavras ou enunciados.
- source_word: וְיֹדְעִים
  choice: vocês que têm conhecimento
  rationale: Particípio plural substantivado e vocativo. A formulação conserva a ideia daqueles que sabem, sem especificar indevidamente o objeto desse conhecimento.
- source_word: הַאֲזִינוּ
  choice: deem-me ouvidos
  rationale: Imperativo plural no hiphil de אזן, verbo ligado a “ouvido”. A expressão portuguesa preserva essa imagem e o paralelismo poético sem deixar de ser compreensível.
- source_word: לִי
  choice: -me
  rationale: A preposição com sufixo de primeira pessoa singular é representada pelo pronome enclítico em “deem-me ouvidos”.
