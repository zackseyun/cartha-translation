    issue: «não voltarei a agir mal» acrescenta repetição
    rationale: O hebraico לא אחבל significa literalmente «não agirei mal/corruptamente»; o texto não contém termo equivalente a «de novo» ou «voltarei a». Embora a ideia possa ser inferida no contexto penitencial, ela não deve ser incorporada à tradução principal.
  - severity: medium
    issue: «o castigo» explicita no texto principal o objeto elíptico de נשאתי
    rationale: O objeto de «suportei/carreguei» não é indicado no hebraico e pode ser entendido de modos diversos, incluindo castigo, correção ou culpa. Para preservar essa ambiguidade, é mais seguro não suprir «o castigo» no texto principal.
