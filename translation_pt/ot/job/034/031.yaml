base_translation:
  language: en
  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: pt
  text: 'Pois, será que alguém disse a Deus: “Suportei; não agirei mal[a]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Suportei; não agirei corruptamente.” O hebraico não especifica o que foi suportado; pode estar implícito castigo, correção ou culpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou argumentativa da conjunção no contexto.
- source_word: אֶל אֵל
  choice: a Deus
  rationale: É a tradução natural da preposição אֶל com אֵל, que aqui designa Deus.
- source_word: הֶאָמַר
  choice: será que alguém disse
  rationale: Embora a forma verbal seja morfologicamente a terceira pessoa masculina do singular, o contexto favorece uma pergunta retórica de sentido indefinido; esta formulação torna isso claro em português sem transformar a pergunta em afirmação.
- source_word: נָשָׂאתִי
  choice: Suportei o castigo
  rationale: נשׂא significa basicamente carregar ou suportar, mas o objeto está implícito. No contexto, 'o castigo' oferece uma leitura provável e inteligível, enquanto a nota preserva a elipse hebraica.
- source_word: לֹא אֶחְבֹּל
  choice: não voltarei a agir mal
  rationale: חבל pode ter aqui sentido ético, como agir mal ou corruptamente. 'Não voltarei' expressa em português natural a ideia contextual de cessar tal conduta, embora 'de novo' não esteja lexicalmente expresso.
theological_decisions:
- issue: Objeto não expresso de נָשָׂאתִי
  choice: castigo no texto, com ressalva em nota
  alternative: deixar apenas 'Suportei' ou entender 'culpa'/'correção'
  rationale: O hebraico não especifica o que foi suportado. A tradução principal precisa ser compreensível, mas a nota evita apresentar uma interpretação contextual como se fosse lexicalmente explícita.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica natural. A elipse do original é explicitada com cautela no texto e documentada na nota; preserva-se a alternativa ética mais literal para חבל.
