lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta forma narrativa, introduz uma resposta ou nova intervenção no diálogo. “Respondeu” preserva a fórmula discursiva hebraica e é natural em português.
- source_word: אֱלִיהוּא
  choice: Eliú
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: וַיֹּאמַר
  choice: dizendo
  rationale: אמר é o verbo comum para “dizer”. O gerúndio evita a construção pouco natural “respondeu e disse”, mantendo, porém, os dois verbos da fórmula hebraica.
- source_word: וַ
  choice: Então
  rationale: O waw inicial com a forma narrativa faz o discurso avançar. “Então” expressa com naturalidade essa progressão em português moderno.
