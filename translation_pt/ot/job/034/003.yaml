base_translation:
  language: en
  yaml_path: translation/ot/job/034/003.yaml
  text: For the ear tests words[a], as the palate tastes food.
translation:
  language: pt
  text: Pois o ouvido examina as palavras, assim como o paladar prova a comida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o palato saboreia o que se come”.'
    reason: Preserva a tradução mais literal de חֵךְ e a construção substantivada לֶאֱכֹל.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da exortação anterior e preserva de modo natural a força causal ou explicativa.
- source_word: אֹזֶן
  choice: o ouvido
  rationale: O singular tem sentido genérico e proverbial; o artigo definido é idiomático em português.
- source_word: מִלִּין
  choice: as palavras
  rationale: Designa palavras ou falas; “palavras” mantém a correspondência direta e clara com o hebraico.
- source_word: תִּבְחָן
  choice: examina
  rationale: O verbo בחן significa testar ou examinar. “Examina” comunica avaliação criteriosa sem sugerir apenas percepção auditiva.
- source_word: חֵךְ
  choice: o paladar
  rationale: Embora חֵךְ designe literalmente o céu da boca ou palato, no contexto representa a faculdade de saborear; “paladar” preserva a imagem sensorial em português corrente.
- source_word: יִטְעַם
  choice: prova
  rationale: O verbo טעם significa provar ou saborear. “Prova” é natural com comida e mantém a analogia entre avaliar palavras e experimentar alimento.
- source_word: לֶאֱכֹל
  choice: a comida
  rationale: O infinitivo com ל pode ser entendido substantivamente como aquilo que se come, isto é, comida.
