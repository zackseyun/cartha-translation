  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: pt
  text: À esquerda[a], quando ele age, não consigo percebê-lo; ele se encobre à direita[b], e não o vejo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Esquerda” e “direita” também podem corresponder, respectivamente, ao norte e ao sul; aqui se preserva o contraste espacial da poesia hebraica.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ele se volta para a direita”. O hebraico traz um verbo que normalmente significa “envolver” ou “cobrir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  choice: à esquerda
  rationale: Preserva o sentido espacial básico e o contraste poético com יָמִין, sem converter desnecessariamente os termos em pontos cardeais.
- source_word: בַּעֲשֹׂתוֹ
  choice: quando ele age
  rationale: A preposição ב com o infinitivo construto e o sufixo de terceira pessoa masculina singular tem sentido temporal; a formulação é natural e mantém a referência à atividade de Deus.
- source_word: אָחַז
  choice: não consigo percebê-lo
  rationale: Embora o sentido básico seja 'agarrar' ou 'apanhar', no contexto exprime a incapacidade de alcançar ou apreender Deus; 'percebê-lo' comunica esse valor contextual sem sugerir contato físico.
- source_word: יַעְטֹף
  choice: ele se encobre
  rationale: Mantém o sentido lexical mais concreto de עטף, 'envolver, cobrir', e preserva a imagem difícil do hebraico em vez de resolvê-la como simples movimento ou giro.
- source_word: יָמִין
  choice: à direita
  rationale: Preserva o contraste corporal e espacial com 'à esquerda', bem como o paralelismo hebraico.
- source_word: אֶרְאֶה
  choice: não o vejo
  rationale: Traduz diretamente ראה, 'ver'; o objeto pronominal é recuperado do contexto.
theological_decisions:
- issue: Referente dos verbos e pronomes na terceira pessoa
  choice: Deus é o referente implícito, expresso em português pelos pronomes 'ele' e 'o'.
  alternative: Manter um referente masculino não identificado.
  rationale: Deus não é nomeado neste versículo, mas é claramente o objeto da busca de Jó no contexto imediato de Jó 23:8–10. Os pronomes tornam a frase natural sem acrescentar uma afirmação doutrinária alheia ao texto.
- issue: Imagem de יַעְטֹף
  choice: Preservar a ideia de Deus encobrir-se à direita.
  alternative: Traduzir 'ele se volta para a direita'.
  rationale: O verbo normalmente denota envolver ou cobrir. A tradução conserva a tensão poética entre a atividade divina e sua invisibilidade, sem reduzir a expressão difícil a um mero deslocamento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético. 'Quando ele age' evita uma expressão excessivamente coloquial, e 'se encobre' mantém a imagem lexical e a ambiguidade do texto hebraico.
