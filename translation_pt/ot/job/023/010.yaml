  text: כִּֽי יָ֭דַע דֶּ֣רֶךְ עִמָּדִ֑/י בְּ֝חָנַ֗/נִי כַּ/זָּהָ֥ב אֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: pt
  text: Mas ele conhece o caminho que percorro[a]; quando me puser à prova[b], sairei como ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conhece o meu caminho”. Mais literalmente, o hebraico diz: “conhece o caminho comigo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se me puser à prova” ou “depois de me pôr à prova”; a construção hebraica permite mais de uma nuance temporal.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: Embora a partícula muitas vezes signifique “pois” ou “porque”, aqui introduz um contraste entre a incapacidade de Jó de encontrar Deus e o pleno conhecimento que Deus tem dele.
- source_word: יָדַע
  choice: conhece
  rationale: O presente expressa de modo natural o conhecimento atual e completo atribuído a Deus.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: o caminho que percorro
  rationale: A formulação torna compreensível em português a expressão hebraica incomum, literalmente “o caminho comigo”, preservando a metáfora do caminho sem excluir a alternativa “meu caminho”.
- source_word: בְּחָנַנִי
  choice: quando me tiver provado
  rationale: בחן significa provar, testar ou examinar. “Provado” combina naturalmente com a imagem do ouro e a construção temporal mantém aberta a relação entre a prova e seu resultado.
- source_word: כַּזָּהָב
  choice: como ouro
  rationale: Preserva diretamente a comparação e a imagem de refinação sem explicitar se ela indica purificação ou comprovação.
- source_word: אֵצֵא
  choice: sairei
  rationale: Reproduz o sentido básico de יצא e, neste contexto, comunica o resultado da prova de maneira concisa e digna.
theological_decisions:
- issue: Relação entre a prova divina e a vindicação de Jó
  choice: Manter a imagem da prova e do ouro sem definir se o resultado é sobretudo vindicação ou purificação moral.
  alternative: Explicitar o verso como declaração de inocência comprovada ou como processo de santificação.
  rationale: O hebraico admite ambas as associações, mas não resolve sozinho a tensão; a tradução não deve importar uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O caminho que percorro” evita o português pouco natural de uma reprodução estritamente literal, enquanto a nota registra tanto a forma hebraica quanto a tradução tradicional possível.
