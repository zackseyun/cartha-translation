review_pass:
  verdict: revise
  source_fidelity: A tradução capta bem o contraste contextual de כִּי, o conhecimento divino do caminho de Jó e a imagem de resultado expressa por «como ouro». «O caminho que percorro» é uma explicitação idiomática aceitável de דֶּרֶךְ עִמָּדִי, desde que a nota preserve a formulação hebraica e a alternativa «meu caminho».
  naturalness: O registro é claro, moderno e apropriado. Contudo, «quando me tiver provado» pode ser entendido em português como «quando tiver demonstrado/provado algo a meu respeito», não necessariamente como submeter Jó a uma prova. «Quando me puser à prova» comunica inequivocamente o sentido de בחן e continua natural.
  terminology: «Pôr à prova» é o equivalente português mais claro para o campo semântico de בחן neste contexto. «Ouro» e «sairei» preservam adequadamente a metáfora, sem impor se ela trata de purificação ou vindicação.
  issues:
  - severity: medium
    issue: Ambiguidade de «me tiver provado»
    rationale: Em português contemporâneo, «provar alguém» pode significar demonstrar algo sobre essa pessoa, além de testá-la. O hebraico בחן requer aqui o sentido de testar/examinar, reforçado pela comparação com ouro. «Puser à prova» elimina uma ambiguidade que não está em primeiro plano no texto-fonte.
