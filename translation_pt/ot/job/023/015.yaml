  text: עַל כֵּ֭ן מִ/פָּנָ֣י/ו אֶבָּהֵ֑ל אֶ֝תְבּוֹנֵ֗ן וְ/אֶפְחַ֥ד מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: pt
  text: Por isso, fico aterrorizado diante dele[a]; quando reflito[b], tenho medo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa dele”; literalmente, “de sua face/presença”.
    reason: lexical_alternative
  - marker: b
    text: Ou “quando considero atentamente” ou “quando medito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca a conclusão lógica decorrente dos versículos anteriores e soa natural em português atual.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: A expressão com פָּנִים e מִן descreve a reação de Jó perante a presença de Deus. “Diante dele” preserva essa relação sem tornar explícita uma causalidade apenas implícita.
- source_word: אֶבָּהֵל
  choice: fico aterrorizado
  rationale: O nifal de בהל comunica forte perturbação ou terror. A formulação preserva a intensidade da reação de Jó em português claro.
- source_word: אֶתְבּוֹנֵן
  choice: quando reflito
  rationale: A forma reflexiva de בין expressa consideração atenta ou reflexão. A oração temporal comunica naturalmente a ligação contextual entre refletir e sentir medo.
- source_word: וְאֶפְחַד
  choice: tenho medo
  rationale: פחד denota medo; “tenho medo” é direto, corrente e mantém o paralelismo com a primeira oração.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: Com o verbo פחד, o sufixo preposicionado indica aquele de quem Jó tem medo; “dele” é a correspondência portuguesa mais direta.
theological_decisions:
- issue: Referente dos sufixos masculinos da terceira pessoa
  choice: Mantidos como “dele”, com referência contextual a Deus.
  alternative: Explicitar “Deus” no corpo do versículo.
  rationale: O hebraico emprega pronomes, e o contexto identifica o referente. Preservar os pronomes evita acrescentar um título ausente do versículo.
- issue: Intensidade da reação de Jó perante Deus
  choice: 'Empregada linguagem forte: “aterrorizado” e “tenho medo”.'
  alternative: Abrandar como “perturbado” ou reinterpretar como simples reverência.
  rationale: O texto apresenta temor intenso e genuíno. A tradução conserva essa tensão sem a resolver doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. “Por isso” e “tenho medo” mantêm naturalidade, enquanto “aterrorizado” preserva a força poética e emocional do hebraico.
