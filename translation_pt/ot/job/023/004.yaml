base_translation:
  language: en
  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: pt
  text: Eu apresentaria diante dele a minha causa[a] e encheria a minha boca de argumentos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu poria em ordem diante dele uma causa judicial”. O hebraico emprega aqui linguagem forense.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “contestações”, “provas” ou “repreensões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: eu apresentaria
  rationale: O verbo ערך expressa pôr em ordem ou dispor. Neste contexto judicial e hipotético, “apresentaria” comunica de modo natural a exposição ordenada de uma causa.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Reproduz naturalmente a ideia de estar perante a presença de alguém e preserva o cenário de audiência judicial.
- source_word: מִשְׁפָּט
  choice: a minha causa
  rationale: Embora o substantivo também possa significar “julgamento” ou “justiça”, aqui designa a questão judicial que Jó deseja expor. O possessivo, não expresso formalmente no hebraico, é exigido naturalmente pelo contexto.
- source_word: וּפִי
  choice: a minha boca
  rationale: Mantém a imagem concreta do hebraico, que se combina diretamente com o verbo “encher”.
- source_word: אֲמַלֵּא
  choice: encheria
  rationale: O imperfeito continua o sentido hipotético da primeira oração; o condicional em português torna essa relação explícita e preserva a metáfora de encher a boca.
- source_word: תּוֹכָחוֹת
  choice: argumentos
  rationale: O termo pode indicar repreensões, provas ou contestações. No contexto forense, “argumentos” transmite melhor a defesa fundamentada que Jó pretende apresentar, sem restringir indevidamente o sentido.
theological_decisions:
- issue: A linguagem forense da fala de Jó dirigida a Deus
  choice: Preservar a imagem de Jó apresentando uma causa e formulando argumentos diante de Deus.
  alternative: Generalizar como “expor minha queixa” ou suavizar para “declarar meus motivos”.
  rationale: A combinação de ערך, משפט e תוכחות cria uma cena judicial e conserva a ousadia teológica da fala de Jó. A tradução não a suaviza nem a transforma em irreverência explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A construção mantém o paralelismo e a metáfora corporal do hebraico, enquanto “causa” e “argumentos” preservam o cenário judicial.
