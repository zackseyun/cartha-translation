source:
  edition: WLC
  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: pt
  text: Eis que vou para o leste, mas ele não está lá; vou para o oeste, mas não o percebo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição que chama a atenção para a declaração de Jó. “Vejam” é atual e natural, sem o tom arcaico de “eis”.
- source_word: קֶדֶם
  choice: leste
  rationale: No paralelismo com אָחוֹר, designa de modo natural uma direção geográfica; “leste” torna clara a busca de Jó em direções opostas.
- source_word: אֶהֱלֹךְ
  choice: vou
  rationale: O imperfeito qal na primeira pessoa descreve o movimento de Jó em sua busca; “vou” é simples e não especifica indevidamente a maneira de deslocamento.
- source_word: וְאֵינֶנּוּ
  choice: mas ele não está lá
  rationale: O referente é Deus no contexto. “Lá” é uma explicitação idiomática exigida pela busca direcional, e “mas” expressa o contraste implícito no fracasso da busca.
- source_word: אָחוֹר
  choice: oeste
  rationale: Como contraparte de קֶדֶם, pode indicar a direção oposta, o oeste, embora a expressão também admita a leitura espacial “para trás”.
- source_word: לֹא אָבִין לוֹ
  choice: não o percebo
  rationale: בין pode significar entender, discernir ou perceber. No contexto de procurar a presença de Deus, “percebo” preserva a ideia de não conseguir detectá-lo, sem reduzi-la à visão física.
theological_decisions:
- issue: Referente dos pronomes masculinos na terceira pessoa
  choice: Os pronomes se referem a Deus, traduzidos como “ele” e “o”.
  alternative: Um referente implícito não especificado.
  rationale: O contexto imediato trata da procura de Jó por Deus; explicitar o referente apenas por meio dos pronomes portugueses é contextualmente justificado e não acrescenta uma conclusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “vou” foi mantida para tornar natural em português a construção elíptica do segundo membro e preservar o paralelismo poético.
