  text: הַ/בְּ/רָב כֹּ֭חַ יָרִ֣יב עִמָּדִ֑/י לֹ֥א אַךְ ה֝֗וּא יָשִׂ֥ם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: pt
  text: Acaso ele contenderia comigo com grande poder? Não; certamente me daria atenção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poria o coração em mim”; possivelmente: “poria força em mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: com a grandeza do seu poder
  rationale: Preserva tanto רָב, no sentido de grandeza ou abundância, como כֹּחַ, “poder”, e mantém a pergunta sobre se Deus recorreria à sua força esmagadora.
- source_word: יָרִיב עִמָּדִי
  choice: contenderia comigo
  rationale: O verbo ריב tem aqui matiz forense, pois Jó imagina apresentar sua causa diante de Deus. “Contenderia comigo” conserva esse sentido jurídico sem recorrer a linguagem excessivamente técnica.
- source_word: לֹא אַךְ
  choice: Não; antes
  rationale: A expressão nega enfaticamente a possibilidade anterior e introduz, em contraste, aquilo que Jó espera que Deus faça.
- source_word: יָשִׂם בִּי
  choice: daria atenção a mim
  rationale: שׂים com ב pode indicar dirigir a atenção a alguém. No contexto judicial de Jó 23:3–7, a ideia mais provável é que Deus lhe daria ouvidos, embora a construção hebraica admita outras leituras.
theological_decisions:
- issue: Sentido da ação de Deus no segundo membro do versículo
  choice: Deus daria atenção a Jó, ouvindo sua causa em vez de esmagá-lo pelo poder.
  alternative: Deus poria força em Jó; ou voltaria para ele sua atenção em sentido mais geral.
  rationale: 'O contexto imediato é judicial: Jó deseja comparecer diante de Deus e expor sua causa. A tradução mantém a tensão entre o poder divino e a confiança de Jó de que Deus não se limitaria a dominá-lo pela força. A nota conserva as alternativas lexicais genuínas.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Acaso” sinaliza naturalmente a pergunta retórica; “contenderia” preserva o cenário jurídico, e a nota registra a ambiguidade real do hebraico.
