  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: pt
  text: Ainda hoje, minha queixa é rebelde[a]; minha mão está pesada por causa do meu gemido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha queixa é amarga”. O termo hebraico significa mais literalmente rebelião ou desafio, embora alguns o entendam de modo mais brando neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “minha mão está pesada sobre o meu gemido”. Alguns entendem “mão” como referência idiomática a uma expressão contida ou sobrecarregada; outros propõem a emenda “a mão dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Ainda hoje
  rationale: A expressão dá ênfase temporal à persistência da situação de Jó até o presente. “Ainda hoje” é natural em português e conserva essa força.
- source_word: מְרִי
  choice: rebelde
  rationale: O substantivo normalmente expressa rebelião ou desafio. Empregado aqui para caracterizar a queixa, “rebelde” preserva a força incisiva do hebraico sem suavizá-la pelo contexto.
- source_word: שִׂיחִי
  choice: minha queixa
  rationale: O termo pode indicar reflexão, discurso ou queixa. No contexto de lamento e em paralelo com o gemido, “queixa” é a opção mais adequada.
- source_word: יָדִי
  choice: minha mão
  rationale: O texto massorético traz naturalmente o sufixo da primeira pessoa do singular. A formulação incomum é mantida, em vez de adotar a emenda “a mão dele”.
- source_word: כָּבְדָה
  choice: está pesada
  rationale: O verbo comunica peso ou gravidade; a construção estativa em português representa com clareza o sentido contextual.
- source_word: עַל
  choice: por causa de
  rationale: A preposição possui sentido amplo, literalmente “sobre”, mas aqui pode indicar a relação causal entre o peso da mão e o gemido. A tradução mantém legibilidade, enquanto a nota registra a formulação literal.
- source_word: אַנְחָתִי
  choice: meu gemido
  rationale: O substantivo designa suspiro ou gemido de lamento. “Gemido” transmite adequadamente a intensidade do sofrimento de Jó.
theological_decisions:
- issue: Se a autocaracterização da queixa de Jó deve ser suavizada para não sugerir desafio pecaminoso
  choice: Manter “rebelde” no texto principal
  alternative: “amarga” ou “minha queixa é uma rebelião”
  rationale: O hebraico apresenta a fala de Jó em termos fortes. A tradução preserva a tensão teológica entre seu sofrimento e uma queixa que assume tom de desafio, sem decidir antecipadamente como ela deve ser avaliada.
- issue: Identidade da “mão” na segunda oração
  choice: Manter “minha mão”, conforme o texto massorético
  alternative: “a mão dele”, mediante emenda textual
  rationale: Embora a leitura com “minha mão” seja difícil e permita interpretações idiomáticas, ela é a leitura atestada pelo texto hebraico fornecido e não deve ser substituída silenciosamente por uma emenda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e a imagem incomum da mão foram preservadas, enquanto “por causa de” torna explícita uma relação contextual possível; a literalidade e as leituras alternativas aparecem em nota.
