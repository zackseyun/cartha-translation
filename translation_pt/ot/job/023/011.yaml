  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: pt
  text: Meu pé se manteve firme nas suas pegadas[a]; guardei o seu caminho e não me desviei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu pé se apegou à sua pegada”; a imagem hebraica é a de seguir bem de perto as pegadas de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: nos seus passos
  rationale: אֲשׁוּר designa passo ou pegada. O plural é natural em português e preserva a imagem de seguir de perto os passos de Deus.
- source_word: אָחֲזָה
  choice: se manteve firme
  rationale: O verbo אחז significa agarrar ou segurar. Com “meu pé” como sujeito, a formulação expressa adesão firme sem sugerir uma apreensão violenta.
- source_word: רַגְלִי
  choice: Meu pé
  rationale: Mantém o singular concreto do hebraico e a imagem do pé colocado nas pegadas de outro.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: דֶּרֶךְ é “caminho” e pode também representar a conduta. A tradução conserva tanto a metáfora espacial quanto sua dimensão ética.
- source_word: שָׁמַרְתִּי
  choice: guardei
  rationale: שׁמר pode significar guardar, observar ou cumprir. “Guardei” preserva a ideia de observância cuidadosa e fidelidade.
- source_word: וְלֹא אָט
  choice: e não me desviei
  rationale: No contexto da imagem de caminho, אָט comunica afastar-se ou desviar-se. A forma reflexiva é idiomática em português.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “seus passos” e “seu caminho”
  choice: Deus é o referente contextual, expresso sem nomeá-lo no versículo.
  alternative: Um caminho justo não especificado.
  rationale: No contexto imediato, Jó fala de Deus e de sua própria integridade diante dele (Jó 23:10-12). Manter os pronomes conserva a referência pessoal e evita explicitação desnecessária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com naturalidade brasileira. A tradução mantém a imagem concreta do pé e dos passos, bem como o paralelismo entre seguir, guardar e não se desviar.
