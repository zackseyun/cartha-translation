  text: שָׁ֗ם יָ֭שָׁר נוֹכָ֣ח עִמּ֑/וֹ וַ/אֲפַלְּטָ֥ה לָ֝/נֶ֗צַח מִ/שֹּׁפְטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: pt
  text: Ali, uma pessoa íntegra poderia argumentar com ele[a], e eu me livraria para sempre do meu juiz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poderia discutir com ele” ou “apresentar sua causa diante dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu seria libertado para sempre daquele que me julga”.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: Advérbio locativo que aponta para o lugar imaginado do encontro com Deus no contexto. “Ali” é natural em português e mantém a referência espacial.
- source_word: יָשָׁר
  choice: uma pessoa íntegra
  rationale: O adjetivo expressa retidão moral e integridade. A formulação inclusiva e natural “uma pessoa íntegra” não acrescenta ao hebraico uma especificação masculina desnecessária.
- source_word: נוֹכָח
  choice: poderia argumentar
  rationale: No contexto forense, indica debater ou defender uma causa. “Poderia argumentar” preserva tanto o caráter jurídico quanto o potencial sugerido pelo contexto, sem tornar a expressão excessivamente técnica.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a preposição e o pronome hebraicos. O contexto identifica Deus como referente, mas conservar o pronome mantém a forma do discurso de Jó.
- source_word: וַאֲפַלְּטָה
  choice: e eu me livraria
  rationale: O verbo פלט comunica escapar, ser libertado ou ficar livre. A forma reflexiva “me livraria” é idiomática em português e preserva a ideia de escapar de um julgamento adverso sem impor a noção técnica de absolvição.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa um resultado duradouro ou permanente; “para sempre” é a formulação corrente e mantém a força do hebraico.
- source_word: מִשֹּׁפְטִי
  choice: do meu juiz
  rationale: A expressão pode significar literalmente “do meu juiz” ou “daquele que me julga”. “Meu juiz” conserva de modo conciso a imagem judicial e a possível tensão quanto ao papel do referente.
theological_decisions:
- issue: Referente e nuance jurídica de “meu juiz”
  choice: Manter “meu juiz” sem explicitar se é Deus como julgador ou aquele de cujo julgamento Jó espera livrar-se.
  alternative: “daquele que me julga” ou “do meu acusador”
  rationale: A linguagem do versículo é forense, mas o hebraico não exige que o papel seja interpretado como o de um acusador. A tradução conserva a ambiguidade e a tensão do discurso de Jó.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Argumentar” mantém o cenário judicial sem soar excessivamente técnico; “uma pessoa íntegra” comunica o valor moral de יָשָׁר com naturalidade.
