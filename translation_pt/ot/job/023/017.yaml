  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: pt
  text: Pois não fui silenciado por causa das trevas[a], nem porque a escuridão profunda cobriu o meu rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não fui eliminado por causa das trevas, nem porque a escuridão densa cobriu o meu rosto”. O hebraico deste versículo é difícil, especialmente quanto ao sentido de “não fui silenciado/eliminado” e quanto a se a segunda oração se refere a “meu rosto” ou à escuridão “diante de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ligada ao que precede e mantém o fluxo argumentativo sem tornar a relação mais explícita do que o hebraico.
- source_word: נִצְמַתִּי
  choice: não fui silenciado
  rationale: O nifal de צמת pode significar ser silenciado, eliminado ou destruído. Aqui, “não fui silenciado” se ajusta à continuação da fala de Jó, sem ocultar em nota a possibilidade de “não fui eliminado”.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: por causa das trevas
  rationale: מִפְּנֵי é entendido causalmente neste contexto. “Trevas” reproduz o חֹשֶׁךְ poético com linguagem natural e digna.
- source_word: וּמִפָּנַי
  choice: o meu rosto
  rationale: A forma com sufixo de primeira pessoa pode ser entendida literalmente como “meu rosto”, embora também admita a leitura adverbial “diante de mim”; a ambiguidade é registrada na nota.
- source_word: כִּסָּה
  choice: cobriu
  rationale: Equivalente direto e concreto do verbo כסה, preservando a imagem poética.
- source_word: אֹפֶל
  choice: escuridão profunda
  rationale: Distingue אֹפֶל do חֹשֶׁךְ da primeira oração e comunica uma escuridão mais densa ou sombria.
