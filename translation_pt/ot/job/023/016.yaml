id: JOB.23.16
reference: Job 23:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: pt
  text: Mas Deus fez meu coração desfalecer[a], e o Todo-Poderoso me aterrorizou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou meu coração brando”. O verbo hebraico significa literalmente “tornar macio, brando”; aqui, provavelmente indica que Jó perdeu o ânimo ou a coragem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Mas Deus
  rationale: 'אֵל é a designação divina comum, traduzida por “Deus”. Embora וְ possa significar simplesmente “e”, o contexto admite valor adversativo: Jó contrasta sua intenção de comparecer diante de Deus com o temor que o próprio Deus lhe causa.'
- source_word: הֵרַךְ
  choice: fez ... desfalecer
  rationale: O verbo significa literalmente “tornar macio, brando”. Aplicado ao coração, expressa a perda de ânimo ou coragem; “fez meu coração desfalecer” conserva a imagem interior e comunica o sentido idiomático em português atual.
- source_word: לִבִּי
  choice: meu coração
  rationale: O termo designa o coração como centro da vida interior, da vontade e da coragem. “Meu coração” preserva a metáfora hebraica sem exigir explicitação interpretativa no corpo do texto.
- source_word: וְשַׁדַּי
  choice: e o Todo-Poderoso
  rationale: שַׁדַּי é um título divino. “O Todo-Poderoso” é sua tradução tradicional, clara e semanticamente apropriada em português.
- source_word: הִבְהִילָנִי
  choice: me aterrorizou
  rationale: A forma causativa de בהל indica causar pavor, alarme ou perturbação intensa. “Me aterrorizou” reproduz adequadamente a força do verbo.
theological_decisions:
- issue: Tradução paralela dos títulos divinos אֵל e שַׁדַּי
  choice: Deus ... o Todo-Poderoso
  alternative: Deus ... Shaddai
  rationale: O primeiro termo é uma designação comum de Deus, e o segundo funciona aqui como título divino. Traduzir ambos comunica seu sentido ao leitor e mantém o paralelismo sem introduzir uma interpretação doutrinária particular.
- issue: Agência divina no medo de Jó
  choice: Deus fez o coração de Jó desfalecer e o aterrorizou
  alternative: O coração de Jó desfaleceu diante de Deus, e ele ficou aterrorizado
  rationale: As formas verbais hebraicas atribuem diretamente a Deus a ação causativa. A tradução preserva essa tensão teológica em vez de atenuar a agência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Desfalecer” é um pouco elevado, mas permanece corrente no registro bíblico e expressa melhor a perda de coragem do que uma tradução literal potencialmente ambígua, como “amoleceu”.
