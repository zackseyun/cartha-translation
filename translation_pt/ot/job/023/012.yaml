  text: מִצְוַ֣ת שְׂ֭פָתָי/ו וְ/לֹ֣א אָמִ֑ישׁ מֵ֝/חֻקִּ֗/י צָפַ֥נְתִּי אִמְרֵי פִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: pt
  text: Não me desviei do mandamento dos seus lábios; guardei como tesouro as palavras da sua boca mais do que a porção que me foi destinada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma interpretação tradicional de uma frase hebraica difícil: “guardei como tesouro as palavras da sua boca mais do que o alimento de que necessito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: do mandamento
  rationale: O singular em estado construto pede uma referência singular; “mandamento” é claro, digno e preserva o vínculo direto com “seus lábios”.
- source_word: שְׂפָתָיו
  choice: dos seus lábios
  rationale: A tradução concreta preserva o paralelismo poético com “sua boca”; o sufixo masculino singular refere-se a Deus no contexto.
- source_word: לֹא אָמִישׁ
  choice: Não me desviei
  rationale: Expressa naturalmente o sentido causativo de não se afastar nem sair do caminho indicado.
- source_word: מֵחֻקִּי
  choice: mais do que a porção que me foi destinada
  rationale: A frase hebraica é difícil. Esta formulação mantém o possível sentido comparativo e a ideia de uma porção prescrita ou atribuída, sem especificar indevidamente que se trata de alimento.
- source_word: צָפַנְתִּי
  choice: guardei como tesouro
  rationale: Reúne os sentidos de armazenar, conservar e valorizar, adequados ao uso sapiencial do verbo.
- source_word: אִמְרֵי
  choice: as palavras
  rationale: Equivalente corrente e direto para o plural construto.
- source_word: פִיו
  choice: da sua boca
  rationale: Preserva a imagem concreta e o paralelismo com “seus lábios”.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “seus lábios” e “sua boca”
  choice: Deus
  alternative: Um falante não especificado
  rationale: No contexto de Jó 23, Jó descreve sua fidelidade diante de Deus e às palavras dele; por isso, Deus é o referente mais natural, sem necessidade de acrescentar seu nome ao versículo.
- issue: Interpretação de מֵחֻקִּי
  choice: 'Sentido comparativo: “mais do que a porção que me foi destinada”'
  alternative: “do meu decreto/estatuto” ou “mais do que o alimento de que necessito”
  rationale: A forma hebraica recebida é difícil. A leitura escolhida produz sentido coerente e preserva a noção de algo prescrito ou atribuído, enquanto a interpretação tradicional ligada ao alimento é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A imagem poética de lábios/boca foi mantida, e a ambiguidade da frase final foi preservada por meio de nota.
