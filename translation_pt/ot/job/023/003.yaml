  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: pt
  text: Quem dera eu soubesse onde encontrá-lo e pudesse chegar até o seu lugar[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu lugar fixo” ou “sua morada”. O termo hebraico indica um lugar fixo ou estabelecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática introduz um desejo intenso, e não uma pergunta literal sobre quem daria algo. “Quem dera” preserva com naturalidade a força optativa em português.
- source_word: יָדַעְתִּי
  choice: eu soubesse
  rationale: Embora a forma seja formalmente um perfeito na primeira pessoa, dentro da construção optativa expressa o estado desejado. O subjuntivo português comunica esse valor com clareza.
- source_word: וְאֶמְצָאֵהוּ
  choice: onde encontrá-lo
  rationale: 'O hebraico diz literalmente “e eu o encontrasse”, mas o verbo “saber” deixa implícita a informação locativa: saber onde encontrá-lo. A formulação portuguesa torna explícita essa elipse sem mudar o sentido contextual.'
- source_word: אָבוֹא
  choice: Então eu chegaria
  rationale: O imperfeito prossegue o desejo de Jó e apresenta o que ele faria se pudesse localizar Deus. O condicional é natural em português e mantém essa relação implícita.
- source_word: עַד
  choice: até
  rationale: A preposição indica movimento até um destino. “Até” conserva de perto esse valor espacial.
- source_word: תְּכוּנָתוֹ
  choice: o lugar onde ele está
  rationale: O substantivo designa um lugar fixo ou estabelecido. Esta tradução conserva o sentido locativo e evita impor a imagem mais específica de residência, assento ou trono.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares
  choice: Deus é o referente implícito em “-lo” e “ele”.
  alternative: Repetir explicitamente “Deus”.
  rationale: O contexto imediato mostra que Jó deseja encontrar Deus e apresentar-lhe sua causa. Manter os pronomes segue o hebraico e não acrescenta ao versículo um nome que nele não aparece.
- issue: Possível conotação judicial de תְּכוּנָתוֹ
  choice: 'Traduzir de maneira locativa e não judicial: “o lugar onde ele está”.'
  alternative: “seu tribunal”, “seu trono” ou “seu assento”.
  rationale: Embora o contexto mais amplo envolva Jó apresentando sua causa, o termo em si denota um lugar fixo ou estabelecido. Uma tradução judicial resolveria de modo indevido uma nuance apenas contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem dera” transmite a intensidade do desejo sem soar arcaico; a divisão em duas frases reproduz com clareza o movimento do anseio para a ação pretendida. O marcador da nota foi colocado junto à expressão a que se refere.
