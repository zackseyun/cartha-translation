lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה nesta fórmula narrativa significa normalmente “responder”. A escolha preserva o caráter dialogal e é natural em português.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: אמר é o verbo comum para “dizer”. Mantê-lo reproduz de perto a fórmula hebraica “respondeu e disse” e sua cadência literária.
- source_word: וַ...וַ...
  choice: Então ... e ...
  rationale: A sequência de formas com waw faz a narrativa avançar. “Então” expressa naturalmente a progressão inicial, enquanto “e” preserva o segundo elo da fórmula de introdução da fala.
