  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: pt
  text: Mas ele permanece o mesmo[a]; quem poderá fazê-lo voltar atrás? O que a sua alma deseja[b], ele faz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ele é um”. A expressão hebraica provavelmente indica que ele mantém um só propósito ou não muda de intenção.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “O que ele deseja”. Em hebraico, “sua alma” é uma maneira de falar da vontade ou do desejo da própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא בְאֶחָד
  choice: Mas ele permanece o mesmo
  rationale: A conjunção assume valor contrastivo no contexto. A expressão literalmente difícil «ele [está] em um» indica aqui constância ou firmeza de propósito; «permanece o mesmo» comunica esse sentido sem formular uma afirmação metafísica mais ampla.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: quem poderá fazê-lo voltar atrás?
  rationale: O hifil de שׁוב expressa fazer voltar, reverter ou mudar o curso. A formulação preserva a imagem e a pergunta retórica sobre a impossibilidade de alterar o propósito divino.
- source_word: וְנַפְשׁוֹ אִוְּתָה
  choice: O que a sua alma deseja
  rationale: נֶפֶשׁ pode designar alma, pessoa ou o próprio ser, enquanto אוה expressa desejo ou vontade. Manter «alma» conserva a forma antropomórfica hebraica, esclarecida em nota.
- source_word: וַיָּעַשׂ
  choice: ele faz
  rationale: Tradução direta do verbo comum עשה, sem acrescentar a ideia mais forte de «realizar plenamente» ou «consumar».
theological_decisions:
- issue: A afirmação sobre a constância do propósito de Deus
  choice: ele permanece o mesmo
  alternative: ele é um; ele tem um só propósito; ele é imutável
  rationale: O hebraico בְאֶחָד é conciso e ambíguo. No contexto, parece descrever a firmeza ou singularidade do propósito de Deus. «Permanece o mesmo» torna o sentido provável compreensível, enquanto a nota preserva a formulação literal e evita transformar o verso numa definição abrangente da imutabilidade divina.
- issue: A linguagem antropomórfica de «sua alma»
  choice: O que a sua alma deseja
  alternative: O que ele deseja
  rationale: A retenção de «alma» preserva a expressão hebraica e sua tensão antropomórfica, sem sugerir uma antropologia técnica aplicada a Deus; a nota oferece a equivalência idiomática.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e o paralelismo do hebraico foram preservados quando naturais; as notas mantêm visíveis a literalidade e a ambiguidade relevantes.
