  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: pt
  text: Pois ele cumprirá o que determinou para mim[a], e muitas coisas semelhantes estão com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu decreto”, “meu estatuto” ou “minha porção determinada”. O hebraico pode indicar algo prescrito ou fixado para Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi dito antes, preservando a força causal do hebraico e o fluxo natural em português.
- source_word: יַשְׁלִים
  choice: cumprirá
  rationale: O hifil de שׁלם expressa levar algo à plena realização; “cumprirá” combina naturalmente com aquilo que Deus determinou.
- source_word: חֻקִּי
  choice: o que determinou para mim
  rationale: No contexto, חֹק aponta para algo fixado, prescrito ou atribuído a Jó. A formulação comunica esse sentido sem sugerir equivocadamente que se trata de uma lei promulgada pelo próprio Jó.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: e muitas coisas semelhantes
  rationale: Reproduz a referência a numerosas coisas da mesma espécie sem definir além do que o hebraico permite.
- source_word: עִמּוֹ
  choice: estão com ele
  rationale: Mantém de modo direto a expressão hebraica e sua amplitude, que pode sugerir coisas presentes no conselho, na disposição ou no poder de Deus.
theological_decisions:
- issue: Se חֻקִּי deve ser entendido em sentido jurídico estrito ou como aquilo que Deus fixou para Jó
  choice: o que determinou para mim
  alternative: meu decreto; meu estatuto; minha porção determinada
  rationale: O contexto trata do propósito soberano de Deus para o caminho e o destino de Jó, não de uma norma decretada por Jó. A tradução conserva a ideia de algo divinamente fixado, sem restringir indevidamente o campo semântico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” preserva a ligação explicativa; “cumprirá” é idiomático e mantém a ideia de levar à realização. A frase final permanece deliberadamente ampla, como no hebraico.
