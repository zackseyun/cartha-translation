  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: pt
  text: No meio dos arbustos, eles zurram; debaixo das urtigas[a], ficam amontoados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos espinheiros” ou “das sarças”. A identificação exata da planta hebraica é incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são ajuntados” ou “se encolhem juntos”. O verbo hebraico indica que são reunidos ou ficam apertados uns contra os outros; a nuance exata no contexto é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין שִׂיחִים
  choice: no meio dos arbustos
  rationale: בֵּין com um substantivo plural pode indicar localização entre ou no meio de vários elementos. A expressão é natural em português e שִׂיחִים designa vegetação baixa, como arbustos.
- source_word: יִנְהָקוּ
  choice: eles zurram
  rationale: O verbo נהק é usado para o zurro de jumentos. A tradução conserva a imagem animalizante, áspera e deliberadamente degradante do contexto.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Equivalente espacial direto e idiomático em português.
- source_word: חָרוּל
  choice: urtigas
  rationale: Tradução tradicional plausível para uma planta silvestre desagradável ou espinhosa, sem alegar identificação botânica segura; a incerteza é registrada em nota.
- source_word: יְסֻפָּחוּ
  choice: amontoam-se
  rationale: A forma verbal sugere ajuntamento ou aglomeração. 'Amontoam-se' preserva a ideia de pessoas apertadas umas contra as outras e a dureza da cena, sem acrescentar explicitamente medo ou procura de abrigo.
