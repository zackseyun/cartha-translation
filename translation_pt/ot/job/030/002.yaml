lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: Expressa a força aditiva e enfática no argumento desdenhoso de Jó, com naturalidade em português.
- source_word: כֹּחַ יְדֵיהֶם
  choice: a força das mãos deles
  rationale: Mantém a imagem concreta das mãos como expressão da capacidade física e laboral.
- source_word: לָמָה לִּי
  choice: de que me serviria?
  rationale: Traduz idiomaticamente a pergunta retórica, comunicando falta de utilidade sem perder seu tom de rejeição.
- source_word: עָלֵימוֹ
  choice: deles
  rationale: 'Relaciona o sufixo pronominal ao substantivo seguinte de modo idiomático: o vigor que lhes pertence.'
- source_word: אָבַד
  choice: desapareceu
  rationale: Comunica a perda completa indicada pelo verbo, em linguagem natural e digna.
- source_word: כָּלַח
  choice: vigor
  rationale: O substantivo raro parece designar maturidade, plena força ou vigor; a escolha se ajusta ao contexto da capacidade física perdida e preserva a alternativa em nota.
