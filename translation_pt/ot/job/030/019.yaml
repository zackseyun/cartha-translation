  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: pt
  text: Ele me lançou na lama[a], e fiquei semelhante ao pó e à cinza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no barro” ou “na argila”. O termo hebraico pode designar barro, argila ou lama.
    reason: lexical_alternative
  - marker: b
    text: Ou “fui feito semelhante ao pó e à cinza” ou “sou comparado ao pó e à cinza”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Ele me lançou
  rationale: O hifil com sufixo de primeira pessoa expressa a ação enérgica de lançar. O sujeito masculino singular, implícito em hebraico e identificado pelo contexto como Deus, é explicitado por “Ele”.
- source_word: לַחֹמֶר
  choice: na lama
  rationale: חֹמֶר pode designar barro, argila ou lama. Aqui, “lama” comunica naturalmente a imagem de rebaixamento, sem restringi-la ao material de olaria.
- source_word: וָאֶתְמַשֵּׁל
  choice: fiquei semelhante
  rationale: A forma verbal indica ser tornado ou vir a ser semelhante. “Fiquei semelhante” preserva o estado resultante e a força comparativa, sem decidir de modo rígido entre sentido passivo e resultativo.
- source_word: כֶּעָפָר
  choice: ao pó
  rationale: Mantém a comparação e a imagem bíblica de fragilidade, mortalidade e humilhação.
- source_word: וָאֵפֶר
  choice: e à cinza
  rationale: “Pó e cinza” é uma combinação natural em português e conserva a imagem hebraica e suas ressonâncias bíblicas.
theological_decisions:
- issue: Sujeito implícito do verbo na terceira pessoa masculina singular
  choice: Explicitá-lo como “Ele”, em referência contextual a Deus
  alternative: Empregar uma construção impessoal ou omitir lexicalmente o sujeito
  rationale: No discurso de Jó, o antecedente contextual é Deus. A maiúscula ajuda a indicar essa referência em português, sem inserir um título divino ausente do texto.
- issue: Nuance de וָאֶתְמַשֵּׁל
  choice: “fiquei semelhante”
  alternative: “fui reduzido a” ou “sou comparado a”
  rationale: A tradução escolhida conserva a ambiguidade entre mudança de estado e formulação passiva, evitando intensificar o texto com “reduzido” ou tratá-lo apenas como comparação verbal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lançou” preserva a força poética; “lama” é corrente e expressiva. Os marcadores aparecem junto aos termos a que se referem.
