  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: pt
  text: Tu me ergues ao vento[a] e me fazes cavalgar sobre ele; tu me desfazes no tumulto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu me ergues sobre o vento”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica final é difícil. A frase também pode ser entendida como “tu me sacodes na tempestade” ou “tu me dissolves em ruína”.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Tu me ergues
  rationale: O verbo נשׂא pode significar levantar, carregar ou levar. “Ergues” preserva a imagem concreta e a ação violenta do vento no contexto.
- source_word: אֶל רוּחַ
  choice: ao vento
  rationale: רוּחַ pode significar vento, sopro ou espírito; a imagem de ser transportado e o contexto destrutivo favorecem “vento”. “Ao vento” acompanha de perto a preposição אֶל sem excluir a ideia de ser erguido sobre ou lançado ao vento.
- source_word: תַּרְכִּיבֵנִי
  choice: me fazes cavalgar sobre ele
  rationale: A forma causativa de רכב significa “fazer cavalgar” ou “fazer montar”. “Sobre ele” retoma explicitamente o vento, como exige a fluência do português.
- source_word: וּתְמֹגְגֵנִי
  choice: tu me desfazes
  rationale: De מוג, com o sentido de derreter, dissolver ou fazer desfalecer. “Desfazes” comunica de modo natural a desintegração ou ruína de Jó sem reduzir o verbo à ideia menos direta de apenas sacudi-lo.
- source_word: תשוה
  choice: no tumulto
  rationale: A palavra final é textualmente e lexicalmente difícil. “No tumulto” preserva uma leitura ligada a estrondo ou agitação destrutiva e se harmoniza com a imagem do vento, sem especificar com certeza indevida que se trata de uma tempestade.
theological_decisions:
- issue: A ação divina descrita por Jó
  choice: 'Manter a segunda pessoa direta: “Tu me ergues... tu me desfazes”'
  alternative: Empregar uma construção impessoal ou atenuada
  rationale: O hebraico apresenta Jó dirigindo a acusação diretamente a Deus. A tradução preserva essa tensão teológica sem explicar, suavizar ou endossar a percepção de Jó.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” para conservar a força da fala direta de Jó. A formulação mantém o paralelismo poético e assinala, em nota, a incerteza real da última palavra hebraica.
