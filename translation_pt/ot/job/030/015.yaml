id: JOB.30.15
reference: Job 30:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: pt
  text: Terrores se voltam contra mim; perseguem como o vento a minha dignidade[a], e a minha salvação[b] passa como uma nuvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha nobreza”, “a minha honra” ou “a minha prosperidade”. O termo hebraico pode se referir a uma condição elevada ou honrosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “o meu livramento” ou “o meu bem-estar”. Aqui, o termo hebraico pode indicar resgate ou uma condição de segurança e prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: se voltam contra mim
  rationale: O hofal de הפך exprime algo voltado ou revertido contra Jó. O presente dá vivacidade ao lamento, e o plural em português concorda naturalmente com “terrores”.
- source_word: בַּלָּהוֹת
  choice: terrores
  rationale: O substantivo designa terrores ou horrores repentinos; “terrores” conserva de modo conciso a força emocional do hebraico.
- source_word: תִּרְדֹּף
  choice: perseguem
  rationale: רדף significa perseguir ou caçar. Embora a forma verbal hebraica seja feminina singular, בלהות pode ser entendido coletivamente; o plural retoma “terrores” com naturalidade em português.
- source_word: כָּרוּחַ
  choice: como o vento
  rationale: רוּחַ tem aqui o sentido comum de “vento”; a comparação sugere impetuosidade ou dispersão e corresponde poeticamente à nuvem no segundo membro.
- source_word: נְדִבָתִי
  choice: a minha dignidade
  rationale: O termo difícil pode indicar nobreza, honra ou condição elevada. “Dignidade” comunica de forma corrente a posição honrosa que Jó perdeu, sem pressupor nobreza hereditária.
- source_word: וּכְעָב
  choice: como uma nuvem
  rationale: עָב designa uma nuvem, por vezes uma nuvem espessa. “Uma nuvem” basta para preservar a imagem poética.
- source_word: עָבְרָה
  choice: passa
  rationale: עבר descreve aqui algo que passa e desaparece. O presente mantém a vivacidade e o paralelismo verbal do verso.
- source_word: יְשֻׁעָתִי
  choice: a minha salvação
  rationale: ישועה pode significar salvação, livramento ou bem-estar. “Salvação” mantém a correspondência lexical, enquanto a nota registra os sentidos contextuais possíveis.
theological_decisions:
- issue: Possível leitura doutrinária excessiva de יְשֻׁעָתִי
  choice: a minha salvação
  alternative: o meu livramento; o meu bem-estar
  rationale: No contexto, o substantivo pode apontar para resgate pessoal ou prosperidade, sem necessariamente carregar um sentido soteriológico posterior. A nota preserva essa amplitude.
- issue: Sentido do difícil נְדִבָתִי
  choice: a minha dignidade
  alternative: a minha nobreza; a minha honra; a minha prosperidade
  rationale: O contexto trata da perda da condição elevada de Jó. “Dignidade” é natural e abrangente, mas a ambiguidade lexical genuína é mantida em nota.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura poética paralela foi preservada sem rigidez excessiva. Os marcadores estão ligados aos termos efetivamente explicados: [a] a “dignidade” e [b] a “salvação”.'
