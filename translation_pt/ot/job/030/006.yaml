source:
  edition: WLC
  text: בַּ/עֲר֣וּץ נְחָלִ֣ים לִ/שְׁכֹּ֑ן חֹרֵ֖י עָפָ֣ר וְ/כֵפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: pt
  text: Moram nas ravinas dos vales secos,[a] em buracos no chão e entre as rochas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas ravinas dos leitos dos riachos”; o termo hebraico pode indicar vales, leitos de torrentes ou cursos d’água sazonais.
    reason: lexical_alternative
  - marker: b
    text: Ou “em cavidades da terra e nos penhascos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: nas ravinas
  rationale: עָרוּץ indica um corte, canal ou desfiladeiro escavado pela água. “Ravinas” comunica essa formação de modo natural e preciso em português.
- source_word: נְחָלִים
  choice: dos vales secos
  rationale: נַחַל pode designar um vale ou leito de curso d’água sazonal. “Vales secos” torna compreensível ao leitor comum o cenário dos wadis sem sugerir rios perenes.
- source_word: לִשְׁכֹּן
  choice: Moram
  rationale: O infinitivo construto tem aqui valor verbal ligado à expressão locativa. O presente “moram” reproduz com naturalidade a ideia de habitação.
- source_word: חֹרֵי
  choice: em buracos
  rationale: חֹרֵי, de חוֹר, designa buracos ou cavidades. “Buracos” preserva a imagem áspera e degradante do contexto.
- source_word: עָפָר
  choice: no chão
  rationale: עָפָר pode significar pó, terra solta ou chão. Na combinação “buracos no chão”, esta opção é idiomática e descreve claramente cavidades na terra, sem transformar o pó em material no qual se escavam buracos.
- source_word: וְכֵפִים
  choice: e entre as rochas
  rationale: כֵפִים refere-se a rochas ou penhascos. “Entre as rochas” explicita a relação locativa subentendida e mantém o paralelismo do verso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vales secos” evita o empréstimo pouco comum “uádis”, enquanto as notas preservam a amplitude geográfica do hebraico. Os marcadores foram colocados junto às expressões a que se referem.
