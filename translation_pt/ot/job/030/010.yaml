  verdict: revise
  source_fidelity: A primeira e a segunda orações correspondem bem a תִּעֲבוּנִי e רָחֲקוּ מֶנִּי. Contudo, «cospem no meu rosto» especifica que o cuspe atinge fisicamente o rosto de Jó. O hebraico diz literalmente que eles não retêm/poupam cuspe «de diante do meu rosto», expressão que certamente comunica desprezo pessoal, mas que não exige essa especificação.
  naturalness: «Eles me detestam e se mantêm longe de mim» é natural e claro. «Não se contêm e cospem no meu rosto» é fluente, mas sua coordenação acrescenta uma interpretação mais concreta que o texto hebraico não fixa. «Não hesitam em cuspir diante de mim» é moderno, idiomático e preserva melhor a margem semântica.
  terminology: «Detestam» transmite adequadamente a aversão intensa de תעב. «Mantêm-se longe de mim» representa bem רחק. «Cuspir diante de mim» conserva o ato público de ultraje e evita transformar a expressão de presença («meu rosto») em uma afirmação inequívoca de contato físico.
  issues:
  - severity: medium
    issue: «No meu rosto» torna explícito que o cuspe é lançado sobre o rosto de Jó.
    rationale: Em וּמִפָּנַי לֹא חָשְׂכוּ רֹק, a construção pode denotar cuspe lançado diante da presença de Jó ou dirigido contra ele; o hebraico não requer de modo inequívoco que o cuspe o atinja no rosto. A tradução deve preservar essa latitude.
  - severity: low
    issue: A nota usa «não retêm o cuspe diante do meu rosto», mas o texto principal apresenta uma ação mais específica («cospem no meu rosto»).
    rationale: 'A nota e o texto principal devem estar alinhados: a nota pode explicar a formulação literal e o ultraje pessoal sem afirmar contato físico.'
