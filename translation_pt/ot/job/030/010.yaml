  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: pt
  text: Eles me detestam, mantêm-se longe de mim e não hesitam em cuspir diante de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não retêm o cuspe de diante do meu rosto”. A expressão hebraica descreve um ato aberto de desprezo dirigido pessoalmente a Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: Eles me detestam
  rationale: O verbo תעב expressa forte repulsa ou aversão. “Detestam” preserva essa intensidade em português atual e natural.
- source_word: רָחֲקוּ מֶנִּי
  choice: se mantêm longe de mim
  rationale: רחק indica estar ou manter-se distante; a formulação conserva tanto a distância física quanto a rejeição social sugerida pelo contexto.
- source_word: וּמִפָּנַי
  choice: no meu rosto
  rationale: A expressão significa literalmente “de diante/do meu rosto”; em associação com רֹק, “no meu rosto” comunica de modo idiomático o insulto dirigido pessoalmente a Jó.
- source_word: לֹא חָשְׂכוּ
  choice: não se contêm
  rationale: חשׂך pode significar reter, poupar ou refrear. “Não se contêm” expressa a ausência deliberada de qualquer restrição diante do ato de cuspir.
- source_word: רֹק
  choice: cospem
  rationale: O substantivo רֹק designa cuspe ou saliva. A verbalização produz uma frase natural em português sem perder a ação concreta e humilhante.
