  yaml_path: translation/ot/job/030/029.yaml
  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: pt
  text: 'Tornei-me irmão dos chacais

    e companheiro dos avestruzes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «das filhas do avestruz», expressão hebraica que designa os avestruzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: irmão
  rationale: Preserva diretamente a metáfora hebraica de parentesco e associação íntima com animais ligados à desolação.
- source_word: הָיִיתִי
  choice: tornei-me
  rationale: O perfeito de היה descreve aqui a condição a que Jó chegou; «tornei-me» expressa com naturalidade a mudança resultante.
- source_word: לְתַנִּים
  choice: dos chacais
  rationale: תַנִּים, neste cenário poético de desolação, designa provavelmente chacais. A construção portuguesa «irmão dos chacais» transmite naturalmente a relação marcada por לְ.
- source_word: וְרֵעַ
  choice: e companheiro
  rationale: «Companheiro» conserva o paralelismo com «irmão» sem acrescentar uma intimidade afetiva que o contexto não exige.
- source_word: לִבְנוֹת יַעֲנָה
  choice: dos avestruzes
  rationale: A expressão hebraica literal «filhas do avestruz» funciona como designação dos avestruzes; a forma natural é usada no texto e a expressão literal é registrada em nota.
