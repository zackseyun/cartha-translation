revisions:
- from: Como por uma larga brecha, eles vêm[a]; em meio ao estrondo, avançam rolando.
  to: Como por uma larga brecha, eles vêm[a]; em meio à ruína, eles rolam.
  rationale: A revisão substitui «estrondo» por «ruína» para refletir o sentido mais abrangente de שֹׁאָה, simplifica o segundo membro para a imagem verbal direta do hitpael de גלל e remove da nota o acréscimo interpretativo «sobre mim». Mantém-se a leitura principal «como por uma larga brecha», com a alternativa comparativa e a alternativa literal para תַּחַת registradas em nota.
