review_pass:
  verdict: revise
  source_fidelity: A tradução capta a imagem de invasão por uma brecha e o movimento impetuoso. Contudo, «estrondo» restringe שֹׁאָה a um som ou impacto, quando o termo designa mais amplamente ruína, devastação ou calamidade. A nota também introduz «sobre mim», ausente do hebraico e desnecessária para representar a ambiguidade sintática.
  naturalness: «Como por uma larga brecha, eles vêm» é natural e conserva uma leitura espacial plausível. «Em meio à ruína, eles rolam» é idiomático e mantém o paralelismo conciso e imagético. A expressão «avançam rolando» é possível, mas explicita uma progressão já expressa por «vêm» na primeira cola.
  terminology: «Brecha» é o equivalente adequado de פֶרֶץ; «larga» é claro e natural. «Ruína» representa melhor שֹׁאָה neste contexto do que «estrondo». A nota deve limitar-se às alternativas efetivamente sustentadas pelo texto, sem acrescentar um alvo pessoal para o movimento.
  issues:
  - severity: medium
    issue: «Estrondo» para שֹׁאָה
    rationale: O termo hebraico pode evocar colapso súbito, mas seu campo semântico central inclui ruína, devastação e desolação. «Estrondo» focaliza indevidamente o componente sonoro.
  - severity: high
    issue: A nota acrescenta «sobre mim»
    rationale: O hebraico não traz pronome ou complemento que diga explicitamente que eles rolam contra/sobre Jó. O contexto pode sugerir hostilidade contra ele, mas isso não deve ser inserido como alternativa textual.
  - severity: low
    issue: «Avançam rolando» é levemente redundante
    rationale: O avanço/chegada já está expresso por יֶאֱתָיוּ («eles vêm»); «rolam» traduz diretamente o segundo verbo e preserva a concisão poética.
