base_translation:
  language: en
  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: pt
  text: Como por uma larga brecha, eles vêm[a]; em meio à ruína, eles rolam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Como uma larga brecha, eles vêm; debaixo da ruína, eles rolam».'
    reason: O prefixo כְ pode ser entendido como comparação direta («como») ou, com a imagem de uma brecha, como introduzindo a leitura espacial «como por». תַּחַת normalmente significa «debaixo de», embora aqui também possa situar a ação em meio à calamidade.
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: Como por uma ... brecha
  rationale: פֶרֶץ designa uma brecha ou abertura, especialmente em uma muralha. A formulação com «por» preserva a leitura espacial possível da imagem, enquanto «como» mantém a força comparativa do prefixo כְּ.
- source_word: רָחָב
  choice: larga
  rationale: O adjetivo qualifica a brecha como ampla. «Larga» é concreto, natural e conserva a intensidade da imagem.
- source_word: יֶאֱתָיוּ
  choice: eles vêm
  rationale: O verbo expressa vir ou avançar. «Eles vêm» mantém a simplicidade e o movimento vívido do hebraico sem acrescentar interpretação.
- source_word: תַּחַת
  choice: em meio a
  rationale: Embora תַּחַת normalmente signifique «debaixo de», aqui pode situar o avanço no cenário da calamidade. «Em meio a» produz português idiomático; a nota conserva a alternativa mais formal.
- source_word: שֹׁאָה
  choice: estrondo
  rationale: שֹׁאָה pode indicar devastação, ruína ou um colapso estrondoso. «Estrondo» combina com a imagem dinâmica da brecha e do movimento que se segue, sem reduzir o termo apenas ao estado resultante de ruína.
- source_word: הִתְגַּלְגָּלוּ
  choice: avançam rolando
  rationale: O hitpael de גלל retrata movimento de rolar ou precipitar-se. «Avançam rolando» preserva o aspecto dinâmico e a ideia de progressão, evitando o pouco natural «rolam a si mesmos».
