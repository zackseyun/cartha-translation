base_translation:
  language: en
  yaml_path: translation/ot/job/030/009.yaml
  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: pt
  text: E agora me tornei a canção deles[a] e sou, para eles, motivo de comentário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a canção de escárnio deles”. No contexto, “a canção deles” tem sentido zombeteiro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma palavra”; também pode significar “um dito” ou “um provérbio” usado a respeito de alguém, aqui com desprezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a transição temporal e o contraste implícito com a antiga posição de Jó, sem tornar a conjunção mais adversativa do que o hebraico exige.
- source_word: נְגִינָתָם
  choice: a canção deles
  rationale: Preserva a metáfora direta e o singular coletivo do hebraico. O contexto indica que se trata de uma canção de escárnio, nuance registrada em nota.
- source_word: הָיִיתִי
  choice: me tornei
  rationale: Expressa a mudança que resultou na atual humilhação de Jó, sentido adequado ao perfeito de היה neste contexto.
- source_word: וָאֱהִי
  choice: virei
  rationale: Dá continuidade natural à descrição da mudança de condição de Jó e evita repetição pesada em português.
- source_word: לָהֶם
  choice: para eles
  rationale: 'Representa a relação dativa: é na consideração e no discurso dessas pessoas que Jó adquiriu tal condição.'
- source_word: לְמִלָּה
  choice: motivo de comentário
  rationale: Comunica de modo natural que Jó se tornou objeto do que eles dizem. Não fixa o substantivo como 'provérbio', pois מִלָּה significa basicamente 'palavra' ou 'dito', embora o contexto lhe dê tom depreciativo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura poética concisa. A metáfora hebraica da canção foi mantida, enquanto a segunda expressão foi vertida idiomaticamente sem ocultar sua amplitude lexical.
