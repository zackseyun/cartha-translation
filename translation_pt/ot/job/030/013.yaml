  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: pt
  text: Eles destroem a minha vereda; promovem a minha ruína[a]. Não há quem os ajude[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tiram proveito disso” ou “fazem-na avançar”. O verbo hebraico pode indicar ser útil, trazer proveito ou favorecer o avanço de algo; aqui, provavelmente, a ruína de Jó.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem que ninguém os ajude”. A frase final é concisa e pode indicar tanto que eles agem sem auxílio como que não têm quem os ajude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: destroem
  rationale: O verbo expressa a ação de derrubar, desmantelar ou arruinar. “Destroem” é natural em português e mantém a violência da imagem aplicada à vereda de Jó.
- source_word: נְתִיבָתִי
  choice: a minha vereda
  rationale: נְתִיבָה designa uma vereda, trilha ou caminho. “Vereda” preserva a imagem concreta e sua possível dimensão metafórica sem a explicar em excesso.
- source_word: לְהַוָּתִי
  choice: a minha ruína
  rationale: הַוָּה pode indicar ruína, calamidade ou destruição. “Minha ruína” é conciso e adequado ao contexto hostil.
- source_word: יֹעִילוּ
  choice: promovem
  rationale: O hifil de יעל pode indicar ser útil, favorecer ou fazer algo avançar. “Promovem” comunica que eles contribuem ativamente para a ruína de Jó, enquanto a nota preserva a alternativa de que tirem proveito dela.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: Não há quem os ajude
  rationale: A formulação conserva de modo natural a concisão da oração nominal hebraica. A nota registra a leitura alternativa, segundo a qual eles agem sem precisar de auxílio.
