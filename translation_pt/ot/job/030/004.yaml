  text: os que colhem erva-salgada entre os arbustos[a], e a raiz das giestas é seu alimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “malva”; a identificação da planta hebraica é incerta, embora provavelmente se trate de uma planta silvestre tolerante ao sal.
