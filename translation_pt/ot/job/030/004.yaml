lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: os que colhem
  rationale: O particípio de קטף descreve o ato de apanhar ou arrancar vegetação. “Colhem” é natural em português e mantém a imagem concreta de quem busca plantas para sobreviver.
- source_word: מַלּוּחַ
  choice: erva-salgada
  rationale: O nome da planta é incerto, mas provavelmente designa uma planta silvestre tolerante ao sal. “Erva-salgada” comunica essa provável identificação sem sugerir uma espécie doméstica conhecida.
- source_word: עֲלֵי שִׂיחַ
  choice: entre os arbustos
  rationale: Neste contexto, על indica provavelmente o local onde a planta é apanhada, em meio à vegetação rasteira. A expressão é clara e natural em português.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: a raiz da giesta
  rationale: רתמים designa a giesta do deserto. O singular construto hebraico seguido do nome plural da planta pode ser expresso naturalmente como “a raiz da giesta”.
- source_word: לַחְמָם
  choice: é alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, também denota comida ou sustento em sentido amplo. Aqui, “alimento” expressa melhor a subsistência obtida da raiz.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe que continua naturalmente a descrição do versículo anterior. Preserva-se a aspereza da cena de sobrevivência e sinaliza-se em nota a incerteza botânica e a amplitude semântica de “pão”.
