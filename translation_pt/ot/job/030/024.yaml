  text: אַ֣ךְ לֹא בְ֭/עִי יִשְׁלַח יָ֑ד אִם בְּ֝/פִיד֗/וֹ לָהֶ֥ן שֽׁוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: pt
  text: Certamente ninguém estende a mão contra uma ruína[a], se em sua calamidade há um clamor por socorro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente ninguém estende a mão para um monte de ruínas; se em seu desastre há um clamor por socorro”. O hebraico deste versículo é difícil, sobretudo as expressões traduzidas por “contra uma ruína” e a forma que pode significar “para elas” ou “delas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: Entendido como partícula asseverativa, introduzindo a afirmação de Jó sem lhe dar sentido restritivo ou adversativo.
- source_word: בְּעִי
  choice: contra uma ruína
  rationale: A forma é rara e difícil, provavelmente relacionada a ruína ou monte de ruínas. Com a expressão seguinte, “estender a mão”, “contra” comunica uma ação hostil dirigida ao que já está arruinado, sem ocultar a dificuldade do hebraico.
- source_word: יִשְׁלַח יָד
  choice: estende a mão
  rationale: Preserva a imagem do idioma hebraico e permite que o contexto sugira o sentido de atacar, sem explicitá-lo em excesso.
- source_word: אִם
  choice: se
  rationale: Mantém o valor condicional possível da partícula e evita resolver de modo indevido a sintaxe obscura do segundo membro.
- source_word: בְּפִידוֹ
  choice: em sua calamidade
  rationale: פיד denota calamidade ou desastre; a tradução conserva tanto a preposição quanto o sufixo pessoal.
- source_word: לָהֶן
  choice: não expresso no texto principal
  rationale: A forma, literalmente próxima de “para elas/delas”, é extremamente difícil no contexto e pode remeter à ruína ou integrar uma construção obscura. Não se acrescenta “deles” sem referente claro; a incerteza é registrada na nota.
- source_word: שׁוּעַ
  choice: um clamor por socorro
  rationale: O termo designa um grito ou clamor de quem pede auxílio; a formulação torna essa nuance clara em português corrente.
theological_decisions:
- issue: Relação lógica entre a mão estendida e o clamor na calamidade
  choice: Preservar a construção condicional e a tensão do versículo
  alternative: Parafrasear como uma pergunta retórica ou como afirmação de que o aflito estende a mão pedindo ajuda
  rationale: O hebraico é notoriamente obscuro e admite reconstruções diferentes. A tradução não deve escolher uma interpretação teológica ou narrativa além do que o texto sustenta com segurança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe relativamente formal para conservar a concisão e a ambiguidade do hebraico. O marcador [a] aparece no texto principal.
