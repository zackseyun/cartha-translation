  text: אִם לֹ֣א בָ֭כִיתִי לִ/קְשֵׁה י֑וֹם עָֽגְמָ֥ה נַ֝פְשִׁ֗/י לָ/אֶבְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: pt
  text: Não chorei eu por aquele que passava por um dia difícil? Não se entristeceu a minha alma pelo necessitado?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por quem enfrentava adversidade”. O hebraico diz literalmente algo como “pelo difícil de dia”, expressão que pode indicar alguém passando por um dia ou tempo de aflição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Não ... eu ...? / Não ...?
  rationale: Introduz aqui perguntas retóricas que sustentam a defesa de Jó; a formulação interrogativa conserva essa força em português.
- source_word: בָכִיתִי
  choice: chorei
  rationale: Expressa o ato de derramar lágrimas e mantém o peso emotivo e poético do hebraico.
- source_word: לִקְשֵׁה יוֹם
  choice: por aquele que passava por um dia difícil
  rationale: Conserva a imagem hebraica do “dia difícil”, mas explicita de modo natural que se trata de alguém vivendo um período de aflição.
- source_word: עָגְמָה
  choice: se entristeceu
  rationale: Comunica dor e pesar interior, em paralelo com o choro da primeira linha, sem restringir o sentido à amargura.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva a expressão antropológica e o registro poético hebraicos; no contexto, designa o íntimo ou a própria pessoa de Jó, sem definição técnica.
- source_word: לָאֶבְיוֹן
  choice: pelo necessitado
  rationale: אֶבְיוֹן designa quem carece de recursos e auxílio. “Necessitado” é claro, digno e inclui a vulnerabilidade expressa pelo termo.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי
  choice: a minha alma
  alternative: eu / o meu íntimo
  rationale: A expressão poética hebraica é mantida sem pressupor que “alma” seja aqui um componente imaterial tecnicamente definido e separado da pessoa.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira. A inversão moderada em “Não chorei eu...?” reforça a pergunta retórica sem tornar a frase arcaica; o paralelismo e a imagem do “dia difícil” foram preservados.
