  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: pt
  text: Mas agora os mais jovens do que eu riem de mim — eles, cujos pais eu me recusei a pôr com os cães do meu rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com meus cães pastores”. O hebraico diz literalmente “com os cães do meu rebanho”.
    reason: A expressão pode designar cães usados para guardar ou conduzir o rebanho, mas o texto hebraico conserva uma formulação mais ampla.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Expressa o forte contraste entre a honra anterior de Jó e sua humilhação presente.
- source_word: שָׂחֲקוּ עָלַי
  choice: riem de mim
  rationale: Preserva a imagem concreta do riso dirigido contra Jó; no contexto, esse riso comunica zombaria e desprezo.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: os que são mais jovens do que eu
  rationale: Traduz naturalmente o hebraísmo relativo à idade, literalmente ligado a ser menor 'em dias', sem acrescentar explicitamente 'homens'.
- source_word: אֲשֶׁר מָאַסְתִּי אֲבוֹתָם
  choice: eles, cujos pais eu desprezava
  rationale: מָאַס exprime rejeição ou desprezo. A retomada por 'eles' esclarece em português que a oração relativa se refere aos jovens mencionados.
- source_word: לָשִׁית עִם כַּלְבֵי צֹאנִי
  choice: a ponto de não os colocar junto com os cães do meu rebanho
  rationale: Mantém a comparação humilhante e a expressão concreta do hebraico. 'A ponto de não' torna inteligível em português a relação entre o desprezo e o infinitivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. O travessão preserva a ênfase nos jovens e permite ligar claramente a oração sobre os pais deles. A formulação mantém a severidade social da fala de Jó sem suavizá-la nem ampliá-la.
