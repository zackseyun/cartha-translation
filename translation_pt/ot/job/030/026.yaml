base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: pt
  text: Pois esperei o bem, mas veio a desgraça[a]; aguardei a luz, mas veio a escuridão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o mal» ou «a calamidade». Aqui, o hebraico provavelmente se refere à adversidade, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão da lamentação de Jó no contexto, preservando a força causal do hebraico.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo é usado como substantivo e designa aquilo que é benéfico ou favorável, sem restringir o sentido a prosperidade material.
- source_word: קִוִּיתִי
  choice: esperei
  rationale: Expressa expectativa esperançosa; em português, «esperei o bem» comunica naturalmente tanto espera quanto esperança.
- source_word: וַיָּבֹא
  choice: veio
  rationale: Preserva a repetição enfática do mesmo verbo nas duas metades e a brusca inversão das expectativas.
- source_word: רָע
  choice: a desgraça
  rationale: Neste contexto, רָע indica adversidade ou calamidade, não necessariamente mal moral. «Desgraça» é natural e evita uma leitura moral indevida.
- source_word: וַאֲיַחֲלָה
  choice: aguardei
  rationale: Comunica espera expectante e distingue lexicalmente este verbo de קִוִּיתִי, sem eliminar a sobreposição de sentido.
- source_word: לְאוֹר
  choice: a luz
  rationale: Mantém a imagem hebraica aberta a sentidos literais e metafóricos, em contraste direto com a escuridão.
- source_word: אֹפֶל
  choice: a escuridão
  rationale: Preserva o forte contraste com «luz» em linguagem clara e digna; o termo também pode sugerir trevas densas ou sombra profunda.
