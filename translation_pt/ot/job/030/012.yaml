  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: pt
  text: À minha direita, levanta-se uma ralé[a]; eles mandam embora os meus pés[b] e constroem contra mim os seus caminhos de calamidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levanta-se uma corja”. O termo hebraico פִּרְחַח é raro e se refere a um grupo desprezível ou indisciplinado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “eles mandam embora os meus pés”. A expressão pode significar que eles fazem Jó recuar, desviam seus passos ou o fazem perder o apoio.
    reason: lexical_alternative
  - marker: c
    text: Ou “levantam contra mim os caminhos da sua ruína”. O hebraico mantém, em sentido hostil, a imagem de construir ou aterrar uma estrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: À minha direita
  rationale: A expressão indica posição espacial hostil. Embora o hebraico não traga aqui um sufixo possessivo explícito, o ponto de referência é Jó; “à minha direita” torna essa relação natural em português sem eliminar a imagem.
- source_word: פִּרְחַח
  choice: uma ralé
  rationale: O substantivo raro designa coletivamente um grupo desprezível ou indisciplinado. “Ralé” conserva o caráter coletivo e o tom de desprezo de Jó; “bando” seria menos marcado e “jovens” apagaria esse tom.
- source_word: יָקוּמוּ
  choice: levanta-se
  rationale: קום descreve o ato de se levantar ou tomar posição, aqui de modo hostil. O singular concorda naturalmente com o coletivo “ralé”.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: eles mandam embora os meus pés
  rationale: A construção é obscura e diz literalmente algo próximo de “mandaram embora os meus pés”. A tradução mantém a estranheza da imagem, em vez de decidir que eles fazem Jó fugir, desviam seus pés ou lhe dão uma rasteira.
- source_word: וַיָּסֹלּוּ
  choice: constroem
  rationale: סלל é empregado para levantar, preparar ou construir uma estrada. “Constroem” preserva a metáfora viária e é compreensível em português atual.
- source_word: עָלַי
  choice: contra mim
  rationale: No contexto de agressão, a preposição tem força adversativa, não apenas espacial.
- source_word: אָרְחוֹת אֵידָם
  choice: os seus caminhos de calamidade
  rationale: A expressão conserva tanto a imagem dos caminhos quanto o sufixo de terceira pessoa em אֵידָם. “Calamidade” comunica a gravidade de אֵיד sem determinar se é a ruína que os agressores causam ou aquela associada à sua investida.
theological_decisions: []
