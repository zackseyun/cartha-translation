  text: בְּ/רָב כֹּ֭חַ יִתְחַפֵּ֣שׂ לְבוּשִׁ֑/י כְּ/פִ֖י כֻתָּנְתִּ֣/י יַֽאַזְרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/018.yaml
  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: pt
  text: Com grande força, minha roupa fica deformada[a]; como a abertura de minha túnica, ela me aperta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha roupa fica mudada”, “minha roupa fica desfigurada” ou, possivelmente, “ele agarra minha roupa”. O verbo hebraico é difícil; em geral, entende-se que a aflição de Jó o deforma ou o comprime como uma roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: Com grande força
  rationale: A construção com ב é tomada em sentido instrumental ou adverbial, indicando a intensidade ou o meio da ação.
- source_word: יִתְחַפֵּשׂ
  choice: fica deformada
  rationale: O hitpael de חפשׂ é difícil neste contexto. “Fica deformada” comunica a alteração aflitiva da roupa sem ocultar, na nota, as alternativas lexicais possíveis.
- source_word: לְבוּשִׁי
  choice: minha roupa
  rationale: לְבוּשׁ designa roupa ou vestimenta em sentido geral; “roupa” é natural, atual e preserva o singular coletivo.
- source_word: כְּפִי
  choice: como a abertura de
  rationale: פִּי significa literalmente “boca de”, mas, aplicado a uma túnica, refere-se naturalmente à sua abertura; a tradução preserva a imagem sem convertê-la de modo excessivamente interpretativo em “gola”.
- source_word: כֻתָּנְתִּי
  choice: minha túnica
  rationale: כֻּתֹּנֶת é uma peça de roupa semelhante a uma túnica; “túnica” é a correspondência portuguesa convencional e adequada ao contexto antigo.
- source_word: יַאַזְרֵנִי
  choice: ela me aperta
  rationale: O verbo אזר significa cingir ou envolver. No contexto da imagem de uma roupa constritiva, “aperta” expressa naturalmente o efeito sobre Jó, embora “cinge” permaneça uma alternativa mais formal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a metáfora do vestuário e a ambiguidade do verbo difícil é registrada em nota. “Abertura” foi preferido a “gola” por ficar mais próximo do hebraico, e o pronome “ela” explicita que a roupa é o sujeito da segunda oração.
