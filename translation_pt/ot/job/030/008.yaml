base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: pt
  text: Filhos de insensatos, sim, filhos sem nome[a], foram expulsos da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos sem nome” é uma expressão hebraica para pessoas sem posição social, honra ou reputação.
    reason: cultural_note
  - marker: b
    text: 'Ou: “foram açoitados para fora da terra”. O verbo hebraico é raro e pode indicar golpes ou expulsão; neste contexto, provavelmente significa que foram enxotados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: filhos de insensatos
  rationale: Preserva a construção hebraica de pertencimento a uma classe. “Insensatos” comunica não só falta de juízo, mas também a baixeza moral associada a נָבָל, sem recorrer a uma expressão excessivamente coloquial.
- source_word: גַּם
  choice: sim
  rationale: Neste contexto, acrescenta e reforça a segunda descrição em aposição; “sim” reproduz essa ênfase com naturalidade em português.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: filhos sem nome
  rationale: Mantém visível a formulação hebraica e sua ideia de pessoas sem reputação, honra ou posição social; a nota esclarece o valor idiomático.
- source_word: נִכְּאוּ
  choice: foram expulsos
  rationale: O verbo raro pode sugerir golpes ou expulsão. Com מִן הָאָרֶץ, o contexto favorece o resultado de serem enxotados ou expulsos, embora a incerteza lexical seja preservada em nota.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: “Terra” conserva a amplitude de אֶרֶץ e, neste contexto social, pode designar o território ou lugar habitado do qual foram expulsos.
