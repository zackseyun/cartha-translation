  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: pt
  text: Assim, minha lira[a] se tornou pranto, e minha flauta[b] se tornou o som dos que choram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha harpa”. O termo hebraico כִּנּוֹר pode designar uma lira ou um instrumento de cordas semelhante a uma harpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu instrumento de sopro”. O termo hebraico עוּגָב designa um instrumento de sopro, mas sua forma exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se tornou
  rationale: A forma de היה no contexto descreve a mudança para um estado resultante; “se tornou” comunica com naturalidade a reversão sofrida por Jó.
- source_word: לְאֵבֶל
  choice: pranto
  rationale: אֵבֶל denota luto ou manifestação de pesar. “Pranto” preserva o paralelismo poético com “som dos que choram” e evita uma formulação abstrata demais.
- source_word: כִּנֹּרִי
  choice: minha lira
  rationale: כִּנּוֹר designa um instrumento antigo de cordas, semelhante a uma lira ou harpa. “Lira” é conciso e evita sugerir especificamente a harpa moderna.
- source_word: וְעֻגָבִי
  choice: minha flauta
  rationale: עוּגָב designa de modo geral um instrumento de sopro cuja forma exata é incerta. “Flauta” é uma designação portuguesa clara e tradicional, com a incerteza registrada em nota.
- source_word: לְקוֹל
  choice: som
  rationale: קוֹל pode significar “voz” ou “som”; em relação ao instrumento e ao choro, “som” produz uma imagem natural. A elipse de “se tornou” no segundo membro preserva o paralelismo compacto do hebraico.
- source_word: בֹּכִים
  choice: dos que choram
  rationale: O particípio plural refere-se a pessoas em ato de chorar. “Os que choram” mantém a referência pessoal e soa natural em português.
