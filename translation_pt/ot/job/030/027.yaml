  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: pt
  text: Minhas entranhas fervem e não se aquietam[a]; dias de aflição vêm ao meu encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Meu interior ferve e não fica quieto; dias de sofrimento vêm sobre mim».'
    reason: Alternativas lexicais possíveis para מֵעַי, דמם, קדם e עֹנִי, preservando a imagem de agitação interior e a aproximação do sofrimento.
lexical_decisions:
- source_word: מֵעַי
  choice: minhas entranhas
  rationale: Preserva a imagem visceral dos órgãos internos e, no contexto poético, comunica também o íntimo profundamente agitado, sem substituí-lo pela interpretação mais abstrata «coração».
- source_word: רֻתְּחוּ
  choice: fervem
  rationale: Mantém a metáfora forte de ferver ou estar em ebulição, expressando a intensa perturbação física e emocional de Jó.
- source_word: וְלֹא דָמּוּ
  choice: e não se aquietam
  rationale: דמם pode indicar ficar quieto, calar-se ou cessar. «Não se aquietam» soa natural em português e preserva a ideia de agitação contínua.
- source_word: קִדְּמֻנִי
  choice: vêm ao meu encontro
  rationale: O verbo descreve aquilo que vem à frente de alguém ou o encontra. A expressão conserva a personificação dos dias de aflição sem acrescentar explicitamente uma hostilidade que o verbo não exige por si só.
- source_word: יְמֵי עֹנִי
  choice: dias de aflição
  rationale: Neste lamento, עֹנִי designa sofrimento ou miséria em sentido amplo, e não apenas pobreza econômica. «Aflição» mantém essa abrangência em registro digno e corrente.
theological_decisions: []
