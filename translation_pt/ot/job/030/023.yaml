  verdict: revise
  source_fidelity: A tradução comunica corretamente a certeza de Jó, a morte e a imagem da casa destinada a todos os viventes. Contudo, o verbo hebraico תְּשִׁיבֵנִי é hifil de שוב e traz, de modo relevante, a ideia de fazer voltar/retornar. «Me levarás» é possível como acomodação idiomática, mas omite essa nuance no texto principal, deixando-a apenas na nota.
  naturalness: «Pois sei que me farás voltar à morte e à casa destinada a todo ser vivo» é português moderno, claro e poeticamente sóbrio. A coordenação explícita por «e» reproduz melhor a conjunção hebraica do que a justaposição das duas expressões preposicionais.
  terminology: «Morte», «casa destinada» e «todo ser vivo» preservam a linguagem imagética sem identificar indevidamente a casa com Sheol ou com uma formulação doutrinária posterior. «Sheol» fica apropriadamente limitado à nota como possibilidade interpretativa.
