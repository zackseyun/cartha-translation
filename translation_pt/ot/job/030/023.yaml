base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: pt
  text: Pois sei que me farás voltar à morte e à casa destinada a todo ser vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me levarás à morte”. O verbo hebraico tem o sentido básico de fazer alguém voltar ou retornar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração no contexto, preservando naturalmente a força conectiva.
- source_word: יָדַעְתִּי
  choice: eu sei
  rationale: O perfeito qal de um verbo estativo expressa aqui conhecimento firme; o presente é a forma natural em português.
- source_word: מָוֶת
  choice: à morte
  rationale: O substantivo denota diretamente a morte, sem nomear explicitamente a sepultura ou o Sheol.
- source_word: תְּשִׁיבֵנִי
  choice: me levarás
  rationale: O hifil de שׁוב pode significar fazer voltar ou reconduzir. Neste contexto, 'levarás' comunica de modo natural o movimento causado em direção à morte, enquanto a alternativa mais formal é registrada em nota.
- source_word: וּבֵית מוֹעֵד
  choice: à casa destinada
  rationale: A segunda expressão continua a ideia de destino. מוֹעֵד pode indicar aquilo que foi designado; 'destinada' preserva essa noção sem transformar a expressão em 'casa de reunião'.
- source_word: לְכָל חָי
  choice: a todo ser vivo
  rationale: Mantém o singular distributivo e a universalidade do hebraico em português claro e idiomático.
theological_decisions:
- issue: Interpretação da imagem da morte
  choice: A morte é apresentada como o destino universal dos seres humanos, figuradamente descrito como uma casa destinada a todo ser vivo.
  alternative: A 'casa destinada' pode ser entendida mais especificamente como a sepultura ou o Sheol, o destino comum de todos.
  rationale: O hebraico menciona a morte e uma casa destinada a todo ser vivo, mas não emprega o termo Sheol. A tradução conserva a metáfora e deixa sua referência exata em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva a imagem poética e evita especificar uma doutrina do além que o hebraico não explicita.
