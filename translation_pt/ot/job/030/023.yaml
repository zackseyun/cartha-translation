    rationale: O hifil de שוב normalmente significa «fazer voltar», «reconduzir» ou «fazer retornar». A nota atual reconhece isso, mas a tradução principal «me levarás» reduz essa dimensão lexical. Uma redação principal que a retenha é viável e natural em português.
  - severity: low
    issue: A conjunção entre «morte» e «casa» está apenas implícita.
    rationale: O hebraico coordena explicitamente os dois destinos com ו. Incluir «e» torna a sintaxe portuguesa mais transparente e reflete melhor a estrutura da fonte.
  revised_text: Pois sei que me farás voltar à morte e à casa destinada a todo ser vivo.[a]
