  terminology: «Afligiu» traduz adequadamente וַיְעַנֵּנִי no contexto. «Freio» é a equivalência concreta apropriada para רֶסֶן; a nota pode explicar o sentido figurado de abandono da contenção. «Corda do arco» deve permanecer como alternativa lexical para יתר.
