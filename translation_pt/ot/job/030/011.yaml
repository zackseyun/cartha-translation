base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: pt
  text: Porque ele afrouxou a minha corda[a] e me afligiu, eles lançaram fora o freio[b] diante de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto escrito pode ser entendido como «sua corda»; a leitura marginal é «minha corda». Ou: «afrouxou a corda do meu arco».'
    reason: textual_variant; lexical_alternative
  - marker: b
    text: Literalmente, «enviaram/soltaram o freio diante de mim»; isto é, deixaram de se conter na presença de Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Porque
  rationale: Introduz a causa da zombaria e da hostilidade descritas no contexto.
- source_word: יִתְרוֹ
  choice: a minha corda
  rationale: O hebraico traz literalmente «sua corda», mas o sufixo pode ser entendido objetivamente, isto é, a corda de Jó que Deus afrouxou. «Corda» preserva a amplitude da metáfora sem especificar em excesso; «corda do arco» consta na nota como alternativa viável.
- source_word: פִּתַּח
  choice: afrouxou
  rationale: Com «corda» como objeto, comunica naturalmente a ideia de soltar ou deixar frouxa.
- source_word: וַיְעַנֵּנִי
  choice: e me afligiu
  rationale: Deriva de ענה II, «afligir, humilhar», e não de ענה I, «responder»; o contexto trata do sofrimento e da humilhação de Jó.
- source_word: וְרֶסֶן
  choice: todo o freio
  rationale: O substantivo significa literalmente «freio» ou «rédea» e, na expressão, representa a contenção abandonada. A formulação mantém a imagem e comunica idiomaticamente a falta de limites.
- source_word: מִפָּנַי
  choice: diante de mim
  rationale: Indica a presença de Jó e a conduta desavergonhada praticada perante ele ou contra ele.
- source_word: שִׁלֵּחוּ
  choice: perderam
  rationale: Literalmente, «soltaram» ou «mandaram embora». Com «freio», a expressão portuguesa «perder todo o freio» transmite de modo natural o abandono da contenção.
theological_decisions:
- issue: Referente do sujeito singular em «ele afrouxou»
  choice: Manter «ele» sem identificar explicitamente o sujeito
  alternative: Explicitar «Deus»
  rationale: O contexto pode apontar para Deus, mas o hebraico usa apenas o pronome implícito. Não explicitar preserva a forma e evita resolver no texto aquilo que permanece inferido.
- issue: Relação possessiva de יִתְרוֹ
  choice: Traduzir como «a minha corda»
  alternative: «sua corda»
  rationale: 'Embora o sufixo seja formalmente de terceira pessoa masculina singular, pode ter valor objetivo: a corda de Jó que Deus solta. Essa leitura produz uma metáfora coerente com a aflição de Jó, mas a incerteza textual e lexical é sinalizada em nota.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «afrouxou» e «me afligiu» em registro corrente. A expressão «perderam todo o freio» conserva a metáfora hebraica e soa natural; as notas registram tanto a possível referência à corda de arco quanto a formulação literal da segunda oração.
