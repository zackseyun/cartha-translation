  text: קֹדֵ֣ר הִ֭לַּכְתִּי בְּ/לֹ֣א חַמָּ֑ה קַ֖מְתִּי בַ/קָּהָ֣ל אֲשַׁוֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: pt
  text: Ando escurecido[a], mas não pelo sol[b]; levanto-me na assembleia e clamo por socorro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enlutado” ou “enegrecido”. O termo hebraico pode evocar tanto o pesar quanto uma aparência escurecida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não pelo sol”. A ideia é que sua condição escurecida não foi causada pela exposição ao sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: escurecido
  rationale: O particípio de קדר pode indicar aparência escura ou enegrecida e também evocar luto. “Escurecido” conserva essa amplitude sem decidir entre condição física e pesar.
- source_word: הִלַּכְתִּי
  choice: ando
  rationale: Embora a forma hebraica seja perfeita, no discurso poético ela descreve vividamente a condição e a conduta contínuas de Jó; o presente é natural em português.
- source_word: בְּלֹא חַמָּה
  choice: mas não pelo sol
  rationale: חַמָּה designa o sol ou seu calor. A formulação preserva a expressão concreta e a ideia contextual de que o aspecto escurecido de Jó não foi causado pelo sol.
- source_word: קַמְתִּי
  choice: levanto-me
  rationale: קום introduz a ação pública de Jó. “Levanto-me” mantém o movimento expresso no hebraico e se ajusta ao paralelismo poético.
- source_word: בַקָּהָל
  choice: no meio da assembleia
  rationale: קהל é uma reunião ou grupo reunido. “Assembleia” é amplo e evita conotações eclesiásticas posteriores; “no meio de” expressa naturalmente a presença de Jó entre os reunidos.
- source_word: אֲשַׁוֵּעַ
  choice: clamo por socorro
  rationale: שוע no Piel denota um clamor urgente por ajuda. “Clamo por socorro” comunica claramente a súplica desesperada.
