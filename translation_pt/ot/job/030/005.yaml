  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: pt
  text: São expulsos do meio da comunidade[a]; gritam contra eles como contra um ladrão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da ravina» ou «do desfiladeiro». O termo hebraico também pode designar uma depressão do terreno.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «gritam atrás deles como atrás de um ladrão». O sujeito de «gritam» não é especificado no hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: do meio da comunidade
  rationale: מִן marca separação, e גֵּו pode indicar o meio ou interior. O contexto de expulsão social favorece «do meio da comunidade», sem adotar o sentido geográfico menos seguro de «ravina».
- source_word: יְגֹרָשׁוּ
  choice: são expulsos
  rationale: A forma expressa expulsão forçada e mantém em foco aquilo que é feito a essas pessoas.
- source_word: יָרִיעוּ
  choice: gritam
  rationale: O verbo significa levantar um grito ou clamor. Mantém-se o sujeito indeterminado, como no hebraico, em vez de acrescentar explicitamente «as pessoas».
- source_word: עָלֵימוֹ
  choice: contra eles
  rationale: Com um verbo de gritar, עַל pode indicar a direção hostil do clamor. «Contra eles» é natural em português e conserva essa força.
- source_word: כַּגַּנָּב
  choice: como contra um ladrão
  rationale: A comparação descreve o clamor dirigido a eles como o que se dirige contra um ladrão; a repetição implícita da preposição torna a relação clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção passiva natural. A tradução principal preserva o sujeito indeterminado de «gritam» e entende a cena como exclusão social; a nota registra a possível leitura geográfica e a alternativa ligada à ideia de perseguição.
