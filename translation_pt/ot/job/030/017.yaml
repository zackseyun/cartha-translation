  text: À noite, meus ossos são perfurados em mim,[a] e as dores que me corroem[b] não repousam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “meus ossos são perfurados de sobre mim”. A formulação hebraica é difícil; algumas traduções entendem o verbo de modo mais geral como “roer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meus tendões” ou “minhas veias”. O termo hebraico é raro e pode designar literalmente estruturas ou canais do corpo, em vez das dores associadas a eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: À noite
  rationale: Expressa naturalmente em português o uso temporal de “noite”.
- source_word: עֲצָמַי
  choice: meus ossos
  rationale: Preserva a imagem corporal concreta do sofrimento de Jó.
- source_word: נִקַּר
  choice: são perfurados
  rationale: Mantém o sentido central de נקר, “perfurar/furar”, e sua imagem física violenta; uma leitura mais geral, “são corroídos”, permanece possível.
- source_word: מֵעָלָי
  choice: dentro de mim
  rationale: A expressão hebraica é difícil, literalmente próxima de “de sobre mim”; no contexto, esta formulação comunica de modo compreensível a aflição sentida no interior do corpo.
- source_word: וְעֹרְקַי
  choice: as dores que me corroem
  rationale: O termo é raro e incerto. A tradução contextual e metonímica produz uma linha coerente, sem ocultar em nota as possibilidades anatômicas mais literais.
- source_word: לֹא יִשְׁכָּבוּן
  choice: não repousam
  rationale: Conserva a personificação e a imagem de deitar-se ou descansar, com formulação natural em português.
