base_translation:
  language: en
  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: pt
  text: 'Por causa da privação e da fome, estão definhados[a];

    roem a terra seca, na noite[b] de desolação e ruína.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na privação e na fome, estão ressequidos; raspam a terra seca, em meio à desolação e à ruína.” Várias palavras deste versículo são raras e difíceis, especialmente as traduzidas por “definhados” e “roem”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica geralmente significa “ontem” ou “na noite passada”; aqui é entendida de modo mais amplo como “na noite”, de acordo com o contexto poético.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: Por causa da privação e da fome
  rationale: As preposições descrevem a condição ou causa de seu estado. “Privação” expressa falta extrema, e “fome” se refere aqui à carência pessoal, não necessariamente a uma fome coletiva.
- source_word: גַּלְמוּד
  choice: estão definhados
  rationale: O termo raro pode indicar alguém ressequido, estéril, solitário ou emagrecido. No contexto de privação e fome, “definhados” comunica naturalmente a deterioração física sem ocultar a incerteza lexical, registrada em nota.
- source_word: הַעֹרְקִים
  choice: roem
  rationale: O particípio é raro e difícil. À luz do contexto de busca desesperada por alimento e do verso seguinte, “roem” preserva a imagem dura, quase animalesca, embora “raspam” ou “fogem para” sejam possibilidades.
- source_word: צִיָּה
  choice: a terra seca
  rationale: O substantivo designa sequidão, região árida ou terra ressequida. A tradução conserva a imagem concreta.
- source_word: אֶמֶשׁ
  choice: na noite
  rationale: Embora frequentemente signifique “ontem” ou “na noite passada”, no contexto poético pode ser entendido em referência à noite. A dificuldade é preservada em nota.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: desolação e ruína
  rationale: Os substantivos próximos e intensificadores retratam devastação e completo abandono; a dupla portuguesa mantém o paralelismo sem os fundir.
