  text: תֵּהָפֵ֣ךְ לְ/אַכְזָ֣ר לִ֑/י בְּ/עֹ֖צֶם יָדְ/ךָ֣ תִשְׂטְמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: pt
  text: Tu te tornaste cruel comigo[a]; com a força da tua mão, atacas-me[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu te tornaste impiedoso comigo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “opões-te a mim” ou “persegues-me”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: te tornaste
  rationale: O nifal de הפך expressa aqui mudança de estado. “Te tornaste” é natural em português e preserva essa mudança sem explicitar uma reflexividade maior do que o hebraico exige.
- source_word: לְאַכְזָר
  choice: cruel
  rationale: אַכְזָר denota alguém cruel, impiedoso ou implacável. “Cruel” é a correspondência mais direta e funciona naturalmente como predicativo.
- source_word: לִי
  choice: comigo
  rationale: Neste contexto relacional adversativo, “comigo” produz em português a construção idiomática “tornar-se cruel comigo”, sem precisar intensificar para “contra mim”.
- source_word: בְּעֹצֶם
  choice: com a força
  rationale: עֹצֶם comunica força ou poder, e a preposição בְּ tem valor instrumental. “Com a força” preserva ambos de modo claro.
- source_word: יָדְךָ
  choice: da tua mão
  rationale: Mantém a imagem concreta da mão em vez de substituí-la pela interpretação abstrata “poder”.
- source_word: תִשְׂטְמֵנִי
  choice: atacas-me
  rationale: O verbo שׂטם comunica hostilidade ativa, oposição ou ataque. “Atacas-me” se ajusta ao contexto de Jó sem introduzir necessariamente a ideia prolongada de perseguição.
theological_decisions:
- issue: Descrição antropomórfica da ação de Deus
  choice: Manter a acusação direta na segunda pessoa e a imagem concreta “tua mão”.
  alternative: 'Suavizar ou abstrair a fala, por exemplo: “o teu poder está contra mim”.'
  rationale: A lamentação de Jó dirige a Deus uma acusação deliberadamente contundente. A tradução preserva essa tensão teológica sem endossá-la como avaliação do narrador nem atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com segunda pessoa singular para conservar o discurso direto a Deus. A colocação enclítica em “atacas-me” sustenta um registro bíblico moderadamente elevado, ainda amplamente compreensível. Os marcadores seguem a ordem em que aparecem no texto.
