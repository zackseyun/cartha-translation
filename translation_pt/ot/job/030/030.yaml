  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: pt
  text: Minha pele ficou escura sobre mim[a], e meus ossos ardem de calor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha pele escureceu e se desprende de mim”. O hebraico diz literalmente “escureceu de sobre mim” e pode descrever pele escurecida sobre o corpo ou pele que escurece e se desprende.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meus ossos ardem de febre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: minha pele
  rationale: עוֹר, em referência ao corpo humano, é expresso naturalmente por “pele”.
- source_word: שָׁחַר
  choice: escurece
  rationale: O verbo descreve a pele tornando-se escura ou negra; “escurece” preserva o sentido sem exagerar a especificidade.
- source_word: מֵעָלָי
  choice: e cai de mim
  rationale: Literalmente, “de sobre mim”. No contexto da pele enferma, a formulação pode indicar que ela se desprende; a nota preserva a expressão mais literal e a ambiguidade.
- source_word: וְעַצְמִי
  choice: e meus ossos
  rationale: Embora a forma seja singular, עֶצֶם pode ter sentido coletivo; o plural é natural em português.
- source_word: חָרָה
  choice: ardem
  rationale: O verbo comunica a ideia vívida de queimar ou estar abrasado, adequadamente expressa por “ardem”.
- source_word: מִנִּי חֹרֶב
  choice: de calor
  rationale: חֹרֶב denota calor ou secura abrasadora; “de calor” mantém a imagem ampla, enquanto “febre” seria uma interpretação possível, porém mais específica.
