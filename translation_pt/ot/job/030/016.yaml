base_translation:
  language: en
  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: pt
  text: E agora a minha alma se derrama dentro de mim[a]; dias de aflição se apoderam de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha alma se derrama sobre mim”. A preposição hebraica significa literalmente “sobre mim”, mas a expressão provavelmente descreve um colapso interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o contexto anterior quanto a transição temporal para a condição presente de Jó, sem tornar explicitamente adversativa uma conjunção que não exige isso.
- source_word: עָלַי
  choice: dentro de mim
  rationale: A preposição significa literalmente “sobre mim”, mas, nesta expressão com נַפְשִׁי e “derramar-se”, o português idiomático favorece “dentro de mim” para comunicar o colapso interior. A forma mais literal é mantida em nota.
- source_word: תִּשְׁתַּפֵּךְ
  choice: se derrama
  rationale: Conserva a metáfora hebraica de algo que se esvazia ou se derrama, e a forma pronominal reflete adequadamente a conjugação reflexiva do verbo.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: “Alma” preserva a linguagem poética e a amplitude antropológica de נֶפֶשׁ, que aqui se refere ao ser interior de Jó, sem reduzi-lo apenas à vida física.
- source_word: יֹאחֲזוּנִי
  choice: se apoderam de mim
  rationale: Expressa com naturalidade e força o sentido de agarrar, dominar ou tomar posse, mantendo os “dias de aflição” como sujeito personificado.
- source_word: יְמֵי
  choice: dias de
  rationale: Reproduz naturalmente em português a relação construta com o substantivo seguinte, sem necessidade de artigo definido.
- source_word: עֹנִי
  choice: aflição
  rationale: Abrange sofrimento, miséria e humilhação sem restringir o sentido à pobreza econômica, adequando-se ao contexto de Jó 30.
