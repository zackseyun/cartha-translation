base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: pt
  text: Clamo a ti, mas não me respondes; ponho-me de pé, e apenas olhas para mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquei de pé, e olhaste atentamente para mim.” O hebraico pode ser entendido em sentido passado, e o verbo traduzido por “olhas” também pode indicar olhar com atenção ou considerar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Clamo
  rationale: O piel de שׁוע expressa um clamor intenso por socorro. “Clamo” conserva a força do apelo sem explicitar além do hebraico o conteúdo do pedido.
- source_word: אֵלֶיךָ
  choice: a ti
  rationale: 'A preposição אֶל com sufixo de segunda pessoa masculina singular indica naturalmente a direção do clamor: “a ti”.'
- source_word: תַעֲנֵנִי
  choice: não me respondes
  rationale: ענה no qal significa comumente “responder”. A formulação direta preserva a queixa de Jó sem acrescentar que Deus não o salva ou o ignora.
- source_word: עָמַדְתִּי
  choice: fico de pé
  rationale: Embora a forma seja perfeita, o contexto poético admite um presente vívido que acompanha os verbos anteriores e retrata a postura contínua de Jó. A leitura passada permanece indicada em nota.
- source_word: וַתִּתְבֹּנֶן
  choice: e apenas olhas
  rationale: התבונן pode significar olhar atentamente, observar ou considerar. “Apenas olhas” comunica, pelo contexto, o contraste entre observar e responder, sem transformar a observação em desprezo explícito.
- source_word: בִּי
  choice: para mim
  rationale: Com התבונן, בִּי é vertido de modo idiomático em português como “para mim”.
theological_decisions:
- issue: Se a ausência de resposta divina deve ser apresentada de modo mais interpretativo do que no hebraico
  choice: Manter a queixa de oração sem resposta e de observação divina, sem acrescentar que Deus não salva ou ignora Jó
  alternative: Traduzir como “clamo por socorro, mas não me salvas” ou “ficas indiferente a mim”
  rationale: O texto afirma que Deus não responde e olha para Jó, mas não emprega verbos que signifiquem explicitamente “não salvar”, “ignorar” ou “ser indiferente”. A tradução conserva a tensão teológica e emocional sem intensificá-la interpretativamente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O presente vívido sustenta a fluidez do lamento; a nota preserva a alternativa temporal e a nuance mais atenta do olhar.
