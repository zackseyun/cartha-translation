base_translation:
  language: en
  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: pt
  text: Por causa do seu dia[a], ficam estarrecidos os que vêm depois[b], e os que vieram antes são tomados de horror[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu dia”, provavelmente o dia da calamidade ou do juízo que lhe sobrevém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os posteriores... os anteriores”. Alguns entendem o par em sentido geográfico: “os do ocidente... os do oriente”.'
    reason: alternative_reading
  - marker: c
    text: A expressão hebraica retrata o tremor ou horror apoderando-se deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: por causa de
  rationale: Com יוֹמוֹ e os verbos de reação, introduz aquilo que provoca o espanto; em português, “por causa de” comunica essa relação com naturalidade.
- source_word: יוֹמוֹ
  choice: seu dia
  rationale: Preserva a expressão concreta do hebraico, que no contexto provavelmente aponta para o dia da calamidade ou do juízo que sobrevém ao ímpio.
- source_word: נָשַׁמּוּ
  choice: ficam estarrecidos
  rationale: Expressa espanto intenso e desolador, com mais força que o simples “ficam admirados”.
- source_word: אַחֲרֹנִים
  choice: os que vêm depois
  rationale: Mantém o sentido temporal mais direto de “os posteriores”, sem especificar indevidamente gerações ou uma relação pessoal com o ímpio.
- source_word: וְקַדְמֹנִים
  choice: os que vieram antes
  rationale: Forma o contraste temporal natural com אַחֲרֹנִים, embora o par também admita uma interpretação geográfica.
- source_word: אָחֲזוּ
  choice: são tomados de
  rationale: Reproduz de modo idiomático a ideia de uma emoção intensa que se apodera de alguém.
- source_word: שָׂעַר
  choice: horror
  rationale: O substantivo denota tremor ou horror, possivelmente evocando a reação física de arrepio; “horror” transmite claramente a força emocional.
