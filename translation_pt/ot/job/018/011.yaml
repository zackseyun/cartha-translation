  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: pt
  text: De todos os lados, terrores o apavoram e o fazem fugir a cada passo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos seus calcanhares”. O hebraico diz literalmente “aos seus pés” e pode descrever terrores que o perseguem ou o fazem fugir por onde quer que ele pise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: de todos os lados
  rationale: Expressa de modo natural a ideia adverbial de algo que cerca a pessoa em todas as direções.
- source_word: בִּעֲתֻהוּ
  choice: o apavoram
  rationale: O verbo בעת indica causar terror ou alarme intenso; “apavoram” preserva a força poética sem produzir uma repetição tão rígida quanto “terrores o aterrorizam”.
- source_word: בַלָּהוֹת
  choice: terrores
  rationale: Equivalente direto do plural hebraico, que designa horrores ou causas súbitas de pavor.
- source_word: וֶהֱפִיצֻהוּ
  choice: e o dispersam
  rationale: Preserva o sentido causativo de espalhar ou dispersar e mantém a imagem forte e incomum do hebraico sem decidir que o sentido seja simplesmente “afugentar”.
- source_word: לְרַגְלָיו
  choice: aos seus pés
  rationale: Mantém a formulação literal e ambígua do hebraico, enquanto a nota apresenta o possível sentido contextual de terrores que o perseguem ou impulsionam a cada passo.
