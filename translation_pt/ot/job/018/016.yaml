lexical_decisions:
- source_word: מִתַּחַת
  choice: por baixo
  rationale: Expressa a procedência ou localização inferior e forma um paralelo espacial natural com “por cima”.
- source_word: שָׁרָשָׁיו
  choice: suas raízes
  rationale: Preserva o plural hebraico e a imagem vegetal.
- source_word: יִבָשׁוּ
  choice: secarão
  rationale: Reproduz diretamente o sentido de ficar seco, com forma futura adequada ao contexto.
- source_word: וּמִמַּעַל
  choice: por cima
  rationale: Mantém o contraste poético entre a parte subterrânea e a parte superior da planta.
- source_word: יִמַּל
  choice: será cortada
  rationale: O verbo pode descrever vegetação cortada ou que murcha; “será cortada” preserva a imagem de remoção sem especificar demais o modo.
- source_word: קְצִירוֹ
  choice: sua ramagem
  rationale: Embora o substantivo normalmente se relacione à colheita ou ao que é ceifado, o paralelo com “raízes” aponta aqui para o crescimento superior da planta; “ramagem” expressa esse sentido coletivo.
