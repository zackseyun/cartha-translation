  text: 'Por baixo, suas raízes secarão;

    por cima, sua ramagem[a] será cortada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua colheita será cortada”. O substantivo hebraico geralmente significa “colheita”, mas, nesta imagem vegetal, pode se referir ao crescimento superior da planta. O verbo também pode ser entendido como “murchar”.
