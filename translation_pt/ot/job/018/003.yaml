  yaml_path: translation/ot/job/018/003.yaml
  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: pt
  text: Por que somos considerados como animais[a] e tidos por impuros aos olhos de vocês?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como bestas” ou “como gado”. O hebraico בְּהֵמָה é um termo amplo para animal ou besta e aqui forma uma comparação depreciativa.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traduzido por “tidos por impuros” é difícil e também tem sido entendido de outras maneiras. A tradução segue a compreensão de que Bildade protesta por ser ele e seus companheiros vistos como impuros ou contaminados.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz naturalmente em português a pergunta retórica de Bildade.
- source_word: נֶחְשַׁבְנוּ
  choice: somos considerados
  rationale: Expressa o sentido passivo de חשׁב e a avaliação feita pelos interlocutores.
- source_word: כַבְּהֵמָה
  choice: como animais
  rationale: בְּהֵמָה é um termo amplo para animal ou besta, muitas vezes referente a animais domésticos; “animais” preserva a comparação depreciativa sem restringi-la indevidamente a gado.
- source_word: נִטְמִינוּ
  choice: tidos por impuros
  rationale: A forma hebraica é difícil; esta tradução segue a compreensão ligada à impureza e mantém o paralelismo avaliativo com “somos considerados”.
- source_word: בְּעֵינֵיכֶם
  choice: aos olhos de vocês
  rationale: Conserva a metáfora do idioma hebraico e é natural e clara em português moderno.
theological_decisions:
- issue: Sentido do difícil נִטְמִינוּ
  choice: tidos por impuros
  alternative: considerados estúpidos / tratados como insensíveis
  rationale: A leitura relacionada à impureza ou profanação se ajusta ao paralelismo e à expressão “aos olhos de vocês”, mas a dificuldade textual e lexical é reconhecida em nota, sem apresentar a interpretação como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” explicita o plural de בְּעֵינֵיכֶם; “tidos por” evita a repetição de “considerados” e preserva o paralelismo.
