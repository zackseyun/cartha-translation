  yaml_path: translation/ot/job/018/001.yaml
  text: Then Bildad the Shuhite answered and said:[a]
translation:
  language: pt
  text: Então Bildade, o suíta, respondeu e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Bildade, o suíta, respondeu e disse.”'
    reason: Alternativa lexical para o waw inicial, que pode ser traduzido de modo mais formal por “E”.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa naturalmente “responder”; a escolha preserva o fato de Bildade estar replicando a Jó.
- source_word: בִּלְדַּד
  choice: Bildade
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הַשֻּׁחִי
  choice: o suíta
  rationale: Gentílico que identifica Bildade por sua origem ou grupo; “suíta” é a forma tradicional em português e mantém a função do hebraico.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Mantém os dois verbos da fórmula hebraica de introdução do discurso, sem reduzir “respondeu e disse” a um único verbo.
- source_word: וַ
  choice: Então
  rationale: Neste contexto, o waw faz a narrativa avançar; “Então” expressa com naturalidade a sequência discursiva em português.
