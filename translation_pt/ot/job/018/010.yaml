lexical_decisions:
- source_word: טָמוּן
  choice: está escondida
  rationale: Preserva o sentido passivo e resultativo do particípio de טמן, indicando que a corda foi ocultada e permanece assim.
- source_word: בָּאָרֶץ
  choice: no chão
  rationale: No contexto de uma armadilha, אֶרֶץ designa naturalmente o solo onde a corda é ocultada.
- source_word: חַבְלוֹ
  choice: sua corda
  rationale: חבל pode significar corda ou cordão; aqui se refere à corda ligada ao mecanismo da armadilha. “Corda” é concreto e amplamente compreensível.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: e sua armadilha
  rationale: מַלְכֹּדֶת designa uma armadilha ou laço. “Armadilha” é a opção mais abrangente e acessível.
- source_word: עֲלֵי נָתִיב
  choice: no caminho
  rationale: Expressa de modo natural a localização da armadilha sobre o trajeto por onde a pessoa passa.
