base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: pt
  text: Ele não tem prole nem posteridade entre o seu povo[a], e não há sobrevivente nos lugares onde residia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos nem netos”; o par hebraico expressa a eliminação completa de sua descendência.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos lugares onde residia temporariamente”, “em suas moradas” ou “em seus assentamentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: filhos
  rationale: No paralelismo com נֶכֶד, designa a descendência imediata ou prole. “Filhos” é natural e claro em português, sem restringir o sentido a um único filho do sexo masculino.
- source_word: נֶכֶד
  choice: descendentes
  rationale: Embora possa indicar “neto”, nesta combinação com נִין amplia a linha de posteridade e expressa o corte completo da descendência.
- source_word: בְּעַמּוֹ
  choice: entre o seu povo
  rationale: Preserva o sentido comunitário de עַם e verte de modo idiomático a preposição בְּ.
- source_word: שָׂרִיד
  choice: ninguém lhe sobrevive
  rationale: Expressa de forma natural a ausência de qualquer pessoa restante ligada a ele; evita “remanescente”, que pode soar coletivo ou adquirir conotações teológicas desnecessárias.
- source_word: בִּמְגוּרָיו
  choice: nos lugares onde morava
  rationale: מָגוּר pode indicar morada ou lugar de permanência temporária. A formulação é clara e mantém a referência plural aos lugares de residência, deixando a alternativa mais específica em nota.
