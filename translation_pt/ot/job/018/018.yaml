  text: יֶ֭הְדְּפֻ/הוּ מֵ/א֣וֹר אֶל חֹ֑שֶׁךְ וּֽ/מִ/תֵּבֵ֥ל יְנִדֻּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/018.yaml
  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: pt
  text: Expulsam-no da luz para as trevas[a] e o banem do mundo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Perseguem-no da luz para as trevas”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode designar, mais especificamente, o mundo habitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Expulsam-no
  rationale: O qal imperfeito na terceira pessoa do plural, com sufixo masculino singular, apresenta agentes não especificados que o afastam à força. “Expulsam-no” preserva a voz ativa, o sujeito plural implícito e a ideia de remoção forçada.
- source_word: מֵאוֹר
  choice: da luz
  rationale: A preposição מִן indica afastamento ou origem; “da luz” expressa com naturalidade o ponto de partida e mantém o contraste poético.
- source_word: אֶל חֹשֶׁךְ
  choice: para as trevas
  rationale: אֶל marca direção. “Para as trevas” comunica o movimento entre dois domínios e usa uma formulação portuguesa natural e digna.
- source_word: וּמִתֵּבֵל
  choice: do mundo
  rationale: תֵּבֵל designa o mundo, frequentemente com a nuance de mundo habitado. “Do mundo” é conciso e natural, enquanto a nuance mais específica fica registrada em nota.
- source_word: יְנִדֻּהוּ
  choice: o banem
  rationale: A forma verbal causativa com sufixo masculino singular indica fazê-lo afastar-se ou excluí-lo. “Banem” transmite exclusão deliberada e evita repetir “expulsam” no paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com colocação pronominal compatível com registro bíblico digno. O sujeito plural permanece implícito, como é natural em português e como no hebraico, sem identificar quem pratica a ação.
