base_translation:
  language: en
  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: pt
  text: Sua força passa fome, e a calamidade está pronta ao seu lado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pronta para o seu tropeço”. A palavra hebraica pode ser entendida como “lado” ou, segundo algumas interpretações, como “tropeço/manqueira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: passa
  rationale: O imperfeito qal de היה tem aqui valor descritivo no discurso poético. Em português, “passa fome” exprime naturalmente o estado atribuído à força, sem lhe dar sentido volitivo.
- source_word: רָעֵב
  choice: fome
  rationale: O adjetivo indica fome ou privação. A expressão corrente “passa fome” comunica intensidade sem tornar o verso artificial.
- source_word: אֹנוֹ
  choice: sua força
  rationale: אוֹן pode designar força, vigor ou recursos. “Força” preserva a imagem do poder do ímpio sendo debilitado e se harmoniza com o contexto.
- source_word: וְאֵיד
  choice: e a calamidade
  rationale: אֵיד denota desastre ou calamidade. “Calamidade” mantém o registro poético e o sentido de desgraça destrutiva.
- source_word: נָכוֹן
  choice: está pronta
  rationale: A forma comunica algo preparado ou posto em prontidão. “Está pronta” é clara e conserva a imagem da calamidade prestes a agir.
- source_word: לְצַלְעוֹ
  choice: ao seu lado
  rationale: צלע pode significar lado ou costela; também se propõe uma relação com tropeço ou manqueira. “Ao seu lado” preserva a imagem concreta de uma calamidade muito próxima, mantendo a alternativa em nota.
