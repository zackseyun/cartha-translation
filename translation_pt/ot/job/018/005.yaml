  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: pt
  text: 'De fato, a luz dos perversos se apagará,

    e a chama do seu fogo não brilhará[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a centelha do seu fogo não brilhará». O hebraico שְׁבִיב pode significar «centelha» e também «chama».
    reason: alternativa_lexical
lexical_decisions:
- source_word: גַּם
  choice: Sim
  rationale: A partícula tem aqui força enfática, introduzindo a afirmação de Bildade; “Sim” transmite essa ênfase com naturalidade em português.
- source_word: אוֹר
  choice: luz
  rationale: Preserva a imagem concreta do hebraico, empregada poeticamente para representar vida ou prosperidade.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural substantivado designa genericamente pessoas moralmente más; “perversos” é claro e digno em português atual.
- source_word: יִדְעָךְ
  choice: se apagará
  rationale: O verbo descreve uma luz que se extingue. A forma pronominal é natural em português e não introduz um agente explícito.
- source_word: וְלֹא
  choice: e ... não
  rationale: Reproduz de modo direto e natural a coordenação negativa entre os dois membros poéticos.
- source_word: יִגַּהּ
  choice: brilhará
  rationale: Expressa a emissão de luz e mantém o paralelismo poético com “luz” e “chama”.
- source_word: שְׁבִיב
  choice: chama
  rationale: O termo pode designar chama ou centelha; “chama” se ajusta bem ao paralelismo e à expressão “do seu fogo”.
- source_word: אִשּׁוֹ
  choice: seu fogo
  rationale: Traduz diretamente o substantivo “fogo” com o sufixo possessivo masculino singular, sem substituir a imagem por “lâmpada”.
