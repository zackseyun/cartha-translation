  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: pt
  text: Em sua tenda habita aquilo que não lhe pertence[a]; enxofre é espalhado sobre sua morada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil e elíptico. A expressão também pode sugerir que nada do que era seu permanece na tenda; ou “enxofre”, mencionado no fim do versículo e feminino em hebraico, pode ser o sujeito de “habita”.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: habita
  rationale: O verbo שכן significa “habitar, estabelecer-se”. A forma feminina singular não tem sujeito expresso inequívoco; a tradução mantém a construção impessoalmente aberta, enquanto a nota registra a possível ligação com “enxofre”, substantivo feminino colocado no fim do versículo.
- source_word: בְּאָהֳלוֹ
  choice: em sua tenda
  rationale: אֹהֶל designa literalmente uma tenda. A opção conserva a imagem concreta e doméstica característica do livro de Jó.
- source_word: מִבְּלִי לוֹ
  choice: o que não lhe pertence
  rationale: A expressão é elíptica e indica ausência ou falta em relação a ele. Esta formulação preserva a ideia de despossessão sem identificar de modo categórico quem ou o que ocupa a tenda.
- source_word: יְזֹרֶה
  choice: é espalhado
  rationale: A forma ativa masculina de זרה pode ter uso impessoal. A passiva em português evita introduzir um agente não mencionado no hebraico.
- source_word: עַל נָוֵהוּ
  choice: sobre sua morada
  rationale: נָוֶה pode significar morada, habitação ou pastagem. O paralelismo com “tenda” favorece aqui o sentido de residência.
- source_word: גָפְרִית
  choice: enxofre
  rationale: גָפְרִית é enxofre, associado no contexto bíblico à devastação e ao juízo. “Enxofre” é o termo moderno e claro em português.
theological_decisions:
- issue: Sintaxe ambígua e imagem de juízo no primeiro hemistíquio
  choice: A tenda do perverso, após sua ruína, passa a abrigar algo que não lhe pertence, e sua morada é coberta de enxofre.
  alternative: 'O próprio enxofre é o sujeito posposto de “habita”: “O enxofre habita em sua tenda”; ou nada do que era dele permanece ali.'
  rationale: 'O hebraico é comprimido: תִּשְׁכּוֹן é feminino singular, e מִבְּלִי לוֹ é elíptico. O texto principal mantém a alienação e a despossessão sem definir a presença ocupante; a nota conserva as principais possibilidades gramaticais e evita resolver uma ambiguidade real.'
translation_notes:
  register: Português moderno, claro e digno, com ordem próxima à do hebraico. “Tenda” e “morada” preservam o paralelismo concreto; “enxofre” evita o arcaísmo de equivalentes tradicionais.
