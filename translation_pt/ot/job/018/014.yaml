  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: pt
  text: Ele é arrancado da segurança da sua tenda[a] e conduzido ao rei dos terrores.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele é arrancado da sua tenda, que era a sua segurança”. O hebraico pode indicar tanto a segurança encontrada na tenda como a própria tenda considerada sua segurança.'
    reason: lexical_alternative
  - marker: b
    text: “O rei dos terrores” é uma expressão poética, muitas vezes entendida como uma personificação da morte.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: é arrancado
  rationale: O nifal de נתק expressa ser desprendido, arrancado ou removido à força. “É arrancado” conserva o caráter violento e passivo da ação.
- source_word: מֵאָהֳלוֹ
  choice: da sua tenda
  rationale: אֹהֶל significa literalmente “tenda”. Embora possa representar a moradia ou a família, a tradução mantém a imagem concreta do hebraico.
- source_word: מִבְטַחוֹ
  choice: da segurança
  rationale: מִבְטָח pode significar segurança, confiança ou aquilo em que se confia. Nesta construção, “da segurança da sua tenda” comunica naturalmente a tenda como lugar ou fonte de segurança, sem excluir a leitura apositiva.
- source_word: וְתַצְעִדֵהוּ
  choice: e conduzido
  rationale: O hifil de צעד significa fazer alguém andar ou avançar, daí “conduzir” ou “fazer marchar”. A forma hebraica não deixa claro, neste contexto, o agente feminino ou impessoal; a construção passiva em português evita especificá-lo indevidamente.
- source_word: לְמֶלֶךְ
  choice: ao rei
  rationale: A preposição לְ indica direção, “a” ou “até”. “Ao rei” é conciso e natural neste contexto.
- source_word: בַּלָּהוֹת
  choice: dos terrores
  rationale: O plural designa terrores, horrores ou acontecimentos aterradores. “Rei dos terrores” preserva a expressão poética e sua força evocativa.
theological_decisions:
- issue: Identidade do “rei dos terrores”
  choice: Manter a expressão poética sem identificar explicitamente seu referente.
  alternative: A morte personificada, o Sheol ou um governante demoníaco dos terrores.
  rationale: O hebraico não define o referente. A tradução conserva a ambiguidade e evita introduzir uma identificação doutrinária que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantêm-se as imagens concretas de “tenda” e “rei dos terrores”; a voz passiva em “é conduzido” evita definir um agente que permanece incerto no hebraico.
