  yaml_path: translation/ot/job/018/008.yaml
  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: pt
  text: 'Pois seus próprios pés o levam para uma rede,

    e ele caminha sobre uma malha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e anda sobre uma trama de rede”.'
    reason: A palavra hebraica pode indicar uma malha, trama ou rede entrelaçada; a alternativa explicita a natureza da armadilha.
lexical_decisions:
- source_word: שֻׁלַּח בְּרֶשֶׁת בְּרַגְלָיו
  choice: seus próprios pés o levam para uma rede
  rationale: O hebraico emprega uma forma passiva, literalmente próxima de “ele é enviado/lançado numa rede por seus pés”. A formulação ativa em português preserva a imagem paradoxal de que os próprios passos do ímpio o conduzem à armadilha, evitando o pouco natural “é enviado pelos pés”.
- source_word: שְׂבָכָה
  choice: malha
  rationale: O termo designa uma trama ou rede entrelaçada. “Malha” conserva a distinção lexical em relação a רֶשֶׁת, traduzido como “rede” no primeiro hemistíquio.
- source_word: יִתְהַלָּךְ
  choice: caminha
  rationale: A forma verbal descreve o ato de andar ou caminhar; no contexto, ele avança sobre a superfície traiçoeira da malha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. O paralelismo poético foi mantido em duas linhas, e “próprios” torna explícita a força contextual de “seus pés” sem acrescentar uma interpretação teológica.
