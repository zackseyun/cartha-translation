lexical_decisions:
- source_word: יֹאחֵז
  choice: agarra
  rationale: O qal imperfeito de אחז indica agarrar ou apoderar-se; “agarra” mantém a imagem vívida e personifica naturalmente a armadilha.
- source_word: בְּעָקֵב
  choice: pelo calcanhar
  rationale: עָקֵב significa “calcanhar”; com ב, a expressão indica o ponto pelo qual a vítima é apanhada.
- source_word: פָּח
  choice: armadilha
  rationale: פָּח designa uma armadilha ou laço. “Armadilha” distingue este termo do substantivo raro do segundo hemistíquio.
- source_word: יַחֲזֵק
  choice: prende com firmeza
  rationale: O hifil imperfeito de חזק comunica domínio ou retenção firme; a formulação preserva a força do verbo e o paralelismo poético.
- source_word: עָלָיו
  choice: o
  rationale: A relação hostil ou controladora expressa por על com sufixo é vertida idiomaticamente pelo objeto direto de “prende” em português.
- source_word: צַמִּים
  choice: laço
  rationale: O substantivo raro parece indicar algum tipo de laço, nó corredio ou dispositivo de captura; “laço” é claro sem alegar precisão indevida.
