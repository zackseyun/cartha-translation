  text: Uma armadilha o agarra pelo calcanhar[a]; um laço o prende com firmeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma armadilha o apanha no calcanhar; um nó corredio o agarra”. O último substantivo é raro e talvez designe um tipo específico de laço ou nó corredio.'
