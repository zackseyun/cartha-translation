base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: pt
  text: Você, que se dilacera em sua ira — será que, por sua causa, a terra será abandonada, ou uma rocha será removida de seu lugar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Aquele que dilacera sua vida (ou alma) em sua ira”. Em hebraico, o versículo começa com uma expressão participial na terceira pessoa e depois passa a dirigir-se diretamente a Jó na segunda pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: Você, que se despedaça
  rationale: O particípio de טרף retrata o ato violento de rasgar ou dilacerar, e נֶפֶשׁ pode designar a própria pessoa. A forma reflexiva natural em português comunica a ira autodestrutiva sem restringir נֶפֶשׁ ao sentido de “alma”.
- source_word: בְּאַפּוֹ
  choice: em sua ira
  rationale: אַף significa literalmente “nariz”, mas é um termo comum para ira. O possessivo foi harmonizado com a interpelação direta indicada por לְמַעַנְךָ.
- source_word: הֲלְמַעַנְךָ
  choice: será que, por sua causa
  rationale: A expressão interrogativa com לְמַעַן introduz uma pergunta retórica sobre o mundo mudar por causa de Jó. “Por sua causa” é corrente e preserva a censura.
- source_word: תֵּעָזַב אָרֶץ
  choice: a terra ficará deserta
  rationale: אָרֶץ tem aqui alcance proverbial ou cósmico. O nifal de עזב pode indicar que a terra seja deixada ou abandonada; “ficará deserta” expressa naturalmente em português o resultado desse abandono.
- source_word: וְיֶעְתַּק
  choice: será removida
  rationale: O verbo עתק denota deslocar ou retirar de um lugar. A voz passiva mantém o paralelismo da pergunta retórica.
- source_word: צוּר מִמְּקֹמוֹ
  choice: uma rocha ... do seu lugar
  rationale: צוּר é uma rocha ou penhasco. O artigo indefinido lhe dá sentido proverbial e evita sugerir um título divino; מִמְּקֹמוֹ indica seu lugar próprio.
theological_decisions:
- issue: Mudança da terceira para a segunda pessoa
  choice: 'Traduzir a frase inteira como interpelação direta a Jó: “Você, que se despedaça...”'
  alternative: 'Manter a abertura formalmente na terceira pessoa: “Aquele que despedaça a própria vida em sua ira — será que, por sua causa...”'
  rationale: O hebraico começa com particípio e sufixos de terceira pessoa, mas logo passa à segunda pessoa singular em לְמַעַנְךָ. A interpelação direta reproduz com naturalidade a força discursiva, enquanto a nota registra a mudança gramatical genuína.
- issue: Força retórica e ordem do mundo
  choice: Conservar perguntas retóricas que censuram a expectativa de uma alteração da ordem estabelecida por causa de Jó.
  alternative: Converter as perguntas em afirmações explícitas sobre a imutabilidade da ordem moral.
  rationale: O texto usa imagens cósmicas em forma interrogativa. Mantê-las evita tornar explícita uma formulação doutrinária que o versículo apenas sugere retoricamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Despedaça” preserva a imagem vigorosa do hebraico; “será que” torna clara a pergunta retórica. O marcador [a] aparece no texto principal.
