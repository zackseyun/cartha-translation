  yaml_path: translation/ot/job/018/007.yaml
  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: pt
  text: Seus passos vigorosos serão restringidos[a], e seu próprio conselho o derrubará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Seus passos fortes se estreitarão”; אוֹן pode indicar “força” ou “vigor”, e o verbo também pode ser traduzido por “se estreitarão” ou “serão limitados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu próprio plano o lançará por terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: serão restringidos
  rationale: O verbo, no plural e com “passos” como sujeito, comunica a ideia de estreitamento ou limitação do movimento. “Serão restringidos” é claro em português e preserva a imagem de avanço impedido.
- source_word: צַעֲדֵי
  choice: passos
  rationale: O plural construto de צַעַד designa passos ou passadas. “Passos” é a forma mais direta e natural no contexto poético.
- source_word: אוֹנוֹ
  choice: vigorosos
  rationale: אוֹן pode indicar força ou vigor. Aqui caracteriza os passos do homem, de modo que “vigorosos” expressa naturalmente a força de seu antigo avanço sem recorrer ao sentido menos provável de riqueza.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: o derrubará
  rationale: A forma causativa tem como sujeito feminino singular o termo seguinte, “seu conselho”, e como objeto “o”. “O derrubará” transmite de modo conciso o resultado hostil de ser lançado por terra.
- source_word: עֲצָתוֹ
  choice: seu próprio conselho
  rationale: עֵצָה pode significar conselho, plano ou desígnio. “Seu próprio conselho” preserva a amplitude lexical e ressalta a ironia de que aquilo que ele mesmo concebeu causa sua queda.
