base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: pt
  text: Até quando vocês continuarão armando ciladas com palavras[a]? Entendam, e depois falaremos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pondo limites às palavras”. A expressão hebraica é difícil; alguns a entendem como uma queixa contra uma conversa interminável, e não como referência a ciladas verbais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e depois falemos”. A forma verbal pode ser entendida tanto como futuro quanto como convite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Até quando
  rationale: Expressão interrogativa temporal idiomática que preserva o tom impaciente da pergunta.
- source_word: תְּשִׂימוּן
  choice: continuarão armando
  rationale: שׂים significa basicamente “pôr/colocar”; com “ciladas”, “armar” é a colocação natural em português. “Continuarão” explicita a força reiterativa sugerida pela pergunta “até quando”, sem alterar o caráter da repreensão.
- source_word: קִנְצֵי לְמִלִּין
  choice: ciladas com palavras
  rationale: A expressão hebraica é difícil. Esta leitura comunica a provável acusação de usar palavras como armadilhas, enquanto a nota conserva a alternativa mais literal ligada a “fins/limites”.
- source_word: תָּבִינוּ
  choice: Entendam
  rationale: Imperativo plural direto de בין, dirigido aos interlocutores; mantém o foco em compreender ou discernir antes de falar.
- source_word: וְאַחַר
  choice: e depois
  rationale: 'Forma corrente e digna de indicar a sequência: primeiro entender, depois falar.'
- source_word: נְדַבֵּר
  choice: falaremos
  rationale: O imperfeito na primeira pessoa do plural admite valor futuro simples; a possível nuance de convite é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para tornar explícito o plural hebraico. A formulação principal favorece naturalidade sem ocultar, na nota, a dificuldade lexical da expressão central.
