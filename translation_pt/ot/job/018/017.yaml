  text: זִֽכְר/וֹ אָ֭בַד מִנִּי אָ֑רֶץ וְ/לֹא שֵׁ֥ם ל֝֗/וֹ עַל פְּנֵי חֽוּץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: pt
  text: A sua memória desaparece da terra[a], e ele não tem nome nas ruas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A lembrança dele se perde no país, e ele não tem nome na praça pública.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹ
  choice: a sua memória
  rationale: O substantivo derivado de זכר denota memória ou lembrança; a formulação expressa naturalmente aquilo que resta da pessoa na recordação humana.
- source_word: אָבַד
  choice: desaparece
  rationale: O verbo pode significar perecer, perder-se ou desaparecer. Aqui, com “memória” como sujeito, “desaparece” preserva a ideia de apagamento completo em português natural.
- source_word: מִנִּי אָרֶץ
  choice: da terra
  rationale: אֶרֶץ pode indicar terra ou país. Neste contexto poético de apagamento total, “da terra” mantém a amplitude da expressão sem restringi-la a um território específico.
- source_word: וְלֹא שֵׁם לוֹ
  choice: e ele não tem nome
  rationale: A construção hebraica indica que nenhum nome, renome ou lembrança pública lhe resta; a forma escolhida é direta e conserva essa polissemia.
- source_word: עַל־פְּנֵי חוּץ
  choice: nas ruas
  rationale: חוּץ designa o espaço exterior e público, incluindo rua ou praça. “Nas ruas” comunica de modo natural a esfera pública onde o nome de alguém seria conhecido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. O plural idiomático “nas ruas” representa o espaço público expresso pelo singular coletivo hebraico; a nota preserva as alternativas “país” e “praça pública”.
