  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: pt
  text: Devora os membros de sua pele[a]; o primogênito da morte devora seus membros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as partes de sua pele”. A expressão hebraica é incomum. “O primogênito da morte” talvez personifique a aflição mais mortal ou o principal agente da morte.'
    reason: Registra uma alternativa idiomática para a construção difícil do primeiro segmento e uma possível interpretação da metáfora בְּכוֹר מָוֶת, sem fixá-la no texto principal.
lexical_decisions:
- source_word: יֹאכַל
  choice: devora
  rationale: O Qal imperfeito de אכל descreve metaforicamente uma ação destrutiva. O presente dá vivacidade ao paralelismo poético; no primeiro segmento, o pronome feminino retoma de modo natural a calamidade ou aflição do contexto, embora o hebraico não explicite o sujeito.
- source_word: בַּדֵּי / בַּדָּיו
  choice: os membros / os seus membros
  rationale: בדים pode designar partes, membros ou ramificações. No contexto corporal de pele e aflição, “membros” comunica melhor as partes do corpo e mantém a repetição do termo hebraico.
- source_word: עוֹרוֹ
  choice: a sua pele
  rationale: עוֹר significa normalmente pele ou couro; “pele” é a expressão natural para o corpo humano neste contexto.
- source_word: בְּכוֹר מָוֶת
  choice: o primogênito da morte
  rationale: A tradução formal preserva a imagem poética e sua ambiguidade, sem reduzi-la a uma doença específica ou a outra explicação interpretativa.
theological_decisions:
- issue: Sentido de בְּכוֹר מָוֶת
  choice: Manter “o primogênito da morte” como agente poético de destruição.
  alternative: A aflição mais mortal; o principal agente da morte; uma doença fatal.
  rationale: A expressão hebraica é metafórica e discutida. Preservar sua formulação evita impor uma identificação doutrinária ou médica que o texto não determina.
- issue: Sujeito do primeiro יֹאכַל
  choice: Usar “ela”, entendido naturalmente à luz da calamidade ou aflição do contexto anterior.
  alternative: Empregar construção impessoal, como “algo devora”, ou antecipar “o primogênito da morte” como sujeito.
  rationale: O hebraico não traz sujeito expresso no primeiro segmento. A opção mantém a distinção entre os dois segmentos sem afirmar que “o primogênito da morte” seja necessariamente o sujeito de ambos.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. “Primogênito da morte” mantém deliberadamente a imagem marcante do hebraico; “membros” conserva a repetição lexical e o sentido corporal.
