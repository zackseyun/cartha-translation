  text: א֭וֹר חָשַׁ֣ךְ בְּ/אָהֳל֑/וֹ וְ֝/נֵר֗/וֹ עָלָ֥י/ו יִדְעָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: pt
  text: 'A luz em sua tenda escurece,

    e sua lâmpada, acima dele, se apaga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre ele”. A preposição hebraica pode indicar posição sobre ou acima; a frase provavelmente retrata a lâmpada iluminando o homem ímpio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: luz
  rationale: O sentido concreto comum preserva a imagem poética de iluminação dentro da morada.
- source_word: חָשַׁךְ
  choice: escurece
  rationale: O verbo indica tornar-se escuro; «escurece» comunica de modo natural o processo ou resultado, sem confundi-lo com o apagar da lâmpada no segundo verso.
- source_word: בְּאָהֳלוֹ
  choice: em sua tenda
  rationale: Mantém a imagem concreta de אֹהֶל, que poeticamente também pode representar a morada ou o lar.
- source_word: וְנֵרוֹ
  choice: e a lâmpada
  rationale: נֵר designa especificamente uma lâmpada ou sua chama, preservando o paralelismo concreto.
- source_word: עָלָיו
  choice: acima dele
  rationale: עַל pode indicar posição sobre ou acima; «acima dele» soa natural na imagem doméstica de uma lâmpada que ilumina a pessoa.
- source_word: יִדְעָךְ
  choice: se apaga
  rationale: O verbo expressa apagar-se ou extinguir-se, especialmente de chama ou lâmpada; a forma pronominal é corrente, clara e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira. Preserva o paralelismo e a imagem hebraica da tenda e da lâmpada. Não se acrescentou nota, pois «acima dele» representa diretamente o valor espacial de עָלָיו sem eliminar uma ambiguidade relevante em português.
