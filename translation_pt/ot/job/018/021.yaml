source:
  edition: WLC
  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: pt
  text: Certamente, estas são as moradas do injusto[a]; este é o lugar daquele que não conhece a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do malfeitor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: A partícula tem aqui força enfática e conclusiva, não restritiva; “Certamente” comunica essa ênfase em português natural.
- source_word: אֵלֶּה
  choice: estas
  rationale: O demonstrativo plural retoma o destino descrito nos versículos anteriores.
- source_word: מִשְׁכְּנוֹת
  choice: moradas
  rationale: O termo designa lugares de habitação de modo amplo. “Moradas” preserva o plural e evita especificar indevidamente “tendas”.
- source_word: עַוָּל
  choice: o injusto
  rationale: O substantivo descreve alguém caracterizado pela injustiça ou pela prática do mal. “O injusto” conserva sua nuance moral e jurídica.
- source_word: וְזֶה
  choice: este é
  rationale: O demonstrativo introduz a segunda afirmação paralela; o verbo de ligação, implícito no hebraico, é necessário em português.
- source_word: מְקוֹם
  choice: o lugar
  rationale: É a correspondência mais direta e mantém a relação poética com “moradas” sem ampliar o sentido.
- source_word: לֹא יָדַע אֵל
  choice: daquele que não conhece a Deus
  rationale: A formulação portuguesa torna explícita a pessoa implícita associada ao lugar, mantendo literalmente o verbo “conhecer” e sua possível carga relacional e moral.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל se refere ao Deus verdadeiro; “Deus” é a tradução natural, sem acrescentar um título ausente do texto.
theological_decisions:
- issue: Sentido de “não conhece a Deus”
  choice: Manter a expressão “não conhece a Deus”, permitindo seu sentido relacional e moral
  alternative: Parafrasear como simples desconhecimento da existência de Deus
  rationale: No contexto sapiencial, conhecer a Deus pode envolver reconhecê-lo e viver em relação correta com ele. A tradução não reduz a expressão à mera informação intelectual nem a transforma em fórmula doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo entre “moradas” e “lugar” foi preservado, assim como a passagem do plural na primeira oração ao singular na segunda.
