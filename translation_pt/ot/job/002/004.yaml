  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: pt
  text: 'Então o Adversário[a] respondeu a Javé, dizendo: “Pele por pele![b] Tudo o que um homem tem, ele dará pela própria vida.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Satanás”; o hebraico apresenta uma forma semelhante a um título: “o satanás/adversário”.'
    reason: alternative_reading
  - marker: b
    text: “Pele por pele” é uma expressão proverbial, provavelmente indicando que uma pessoa abrirá mão de uma coisa para proteger a própria vida.
    reason: cultural_note
  - marker: c
    text: Ou “pela própria alma” ou “por si mesmo”. Neste contexto, “vida” expressa melhor o sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: o Adversário
  rationale: O artigo definido hebraico indica aqui uma designação ou função, não necessariamente um nome próprio. “O Adversário” preserva esse valor e se ajusta ao cenário de corte celestial.
- source_word: יְהוָה
  choice: Javé
  rationale: Forma consagrada e amplamente inteligível em português para representar o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: עוֹר בְּעַד עוֹר
  choice: Pele por pele
  rationale: Mantém a formulação breve, proverbial e deliberadamente enigmática do hebraico, sem impor ao texto uma interpretação específica.
- source_word: בְּעַד
  choice: por
  rationale: Nos dois usos, a preposição comunica troca ou substituição. “Por” conserva a concisão do provérbio e funciona naturalmente em “pela própria vida”.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo masculino singular é empregado genericamente. “Um homem” mantém a forma proverbial e a correspondência com o hebraico.
- source_word: נַפְשׁוֹ
  choice: própria vida
  rationale: Neste contexto, נֶפֶשׁ se refere à vida ou à pessoa viva que alguém procura preservar, e não especificamente a uma alma imaterial.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: Tudo o que um homem tem
  rationale: Expressa de modo natural em português a construção possessiva hebraica, sem acrescentar conteúdo.
- source_word: יִתֵּן
  choice: dará
  rationale: O imperfeito apresenta uma generalização proverbial sobre o que alguém está disposto a fazer para preservar a vida; o futuro do indicativo comunica bem essa força.
theological_decisions:
- issue: Identidade e função de הַשָּׂטָן no prólogo de Jó
  choice: o Adversário
  alternative: Satanás
  rationale: O hebraico traz o artigo definido e apresenta a figura por sua função. A tradução evita transformar silenciosamente o título em nome próprio, sem negar possíveis relações com usos canônicos posteriores.
- issue: Sentido de נֶפֶשׁ neste contexto
  choice: vida
  alternative: alma ou o próprio ser
  rationale: A fala trata da disposição humana de entregar posses para continuar vivo. “Vida” preserva o sentido contextual sem introduzir uma definição antropológica sobre corpo e alma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A locução “dizendo” preserva o verbo hebraico de fala sem produzir a redundância pouco natural “respondeu e disse”. A expressão “Pele por pele” permanece concisa e ambígua, como no original.
