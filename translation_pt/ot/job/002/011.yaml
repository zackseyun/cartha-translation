  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: pt
  text: 'Quando os três amigos de Jó souberam de toda essa calamidade que lhe havia sobrevindo[a], vieram, cada um do seu lugar: Elifaz, o temanita; Bildade, o suíta; e Zofar, o naamatita. Combinaram entre si ir até Jó para mostrar-lhe solidariedade[c] e consolá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda essa desgraça” ou “toda essa adversidade”. O termo hebraico refere-se aqui à calamidade que atingiu Jó, não a um mal moral cometido por ele.
    reason: lexical_alternative
  - marker: c
    text: Ou “lamentar com ele” ou “manifestar-lhe compaixão”. O verbo hebraico pode descrever uma demonstração de solidariedade ou condolência diante do sofrimento ou da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Quando ... souberam
  rationale: A forma narrativa com waw faz a narrativa avançar; em português, a oração temporal introduz naturalmente a reação dos amigos, sem acrescentar um marcador explícito como “agora”.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: os três amigos de Jó
  rationale: Reproduz de modo natural a cadeia construta e o sentido comum de רֵעַ neste contexto.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: toda essa calamidade
  rationale: רָעָה designa aqui desgraça ou sofrimento ocorrido, e não mal moral praticado por Jó. “Calamidade” preserva a gravidade do contexto.
- source_word: הַבָּאָה עָלָיו
  choice: que lhe havia sobrevindo
  rationale: Mantém a ideia de algo que veio sobre Jó, com o mais-que-perfeito composto marcando a anterioridade em relação ao que os amigos souberam.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: vieram, cada um do seu lugar
  rationale: אִישׁ tem valor distributivo, “cada um”; a formulação preserva tanto o movimento quanto a origem distinta de cada amigo.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: o temanita / o suíta / o naamatita
  rationale: Gentílicos transliterados segundo formas bíblicas portuguesas correntes e compreensíveis.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Eles combinaram encontrar-se
  rationale: O nifal de יעד indica coordenação deliberada ou encontro marcado; a expressão portuguesa comunica tanto o acordo quanto a reunião planejada.
- source_word: לָבוֹא
  choice: para ir
  rationale: Embora o infinitivo hebraico seja literalmente “vir”, “ir” expressa naturalmente em português o movimento planejado em direção a Jó a partir da perspectiva dos amigos, sem sugerir uma segunda chegada já consumada.
- source_word: לָנוּד לוֹ
  choice: mostrar solidariedade a Jó
  rationale: נוּד pode indicar manifestar compaixão, condolência ou participação no luto. “Mostrar solidariedade” distingue essa ação do verbo seguinte, “consolar”.
- source_word: וּלְנַחֲמוֹ
  choice: e consolá-lo
  rationale: נחם no piel significa consolar; “consolá-lo” é direto, atual e mantém Jó como objeto.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém distintos os dois atos finais: manifestar solidariedade/condolência e consolar. Os nomes e gentílicos seguem formas portuguesas bíblicas correntes.'
