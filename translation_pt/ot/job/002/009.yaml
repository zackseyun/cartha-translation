  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִשְׁתּ֔/וֹ עֹדְ/ךָ֖ מַחֲזִ֣יק בְּ/תֻמָּתֶ֑/ךָ בָּרֵ֥ךְ אֱלֹהִ֖ים וָ/מֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: pt
  text: 'Então, sua mulher lhe disse: “Ainda se apega à sua integridade? Abençoe a Deus e morra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “Abençoe a Deus e morra”; muitos entendem “abençoe” aqui como um eufemismo reverencial com o sentido de “amaldiçoe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa de modo natural a sequência em português.
- source_word: אִשְׁתּוֹ
  choice: a mulher de Jó
  rationale: A construção significa literalmente “sua mulher”. O nome “Jó” evita uma referência pronominal menos clara no versículo isolado e é natural em português.
- source_word: עֹדְךָ
  choice: Você ainda
  rationale: 'O advérbio עוֹד com sufixo de segunda pessoa indica continuidade: Jó ainda persiste nessa atitude.'
- source_word: מַחֲזִיק בְּתֻמָּתֶךָ
  choice: se apega à sua integridade
  rationale: חזק com ב expressa agarrar-se firmemente ou continuar a manter algo; “apegar-se” conserva essa força. תֻּמָּה denota integridade, retidão ou irrepreensibilidade, sem necessariamente afirmar ausência absoluta de pecado.
- source_word: בָּרֵךְ
  choice: Abençoe
  rationale: A forma hebraica significa literalmente “abençoar”. Embora muitos a entendam aqui como eufemismo reverencial para “amaldiçoar”, a tradução principal preserva a forma explícita do texto hebraico e registra o provável sentido contextual em nota.
- source_word: אֱלֹהִים
  choice: a Deus
  rationale: O substantivo é o título divino אֱלֹהִים, não o nome próprio YHWH; “Deus” é a correspondência adequada.
- source_word: וָמֻת
  choice: e morra
  rationale: A conjunção liga dois imperativos de maneira direta e contundente; “e morra” preserva a brevidade do hebraico.
theological_decisions:
- issue: Uso eufemístico de “abençoar” em referência a Deus
  choice: Manter “Abençoe a Deus e morra” no texto principal, explicando em nota o provável sentido “Amaldiçoe a Deus e morra”.
  alternative: Traduzir diretamente “Amaldiçoe a Deus e morra”.
  rationale: O texto massorético traz ברך, “abençoar”, mas o contexto leva muitos a reconhecer um eufemismo reverencial com sentido oposto. Manter a forma lexical no texto e esclarecer a leitura contextual preserva tanto a evidência original quanto a tensão interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você” torna natural a interpelação direta; “se apega” comunica persistência firme sem soar arcaico. A nota preserva a ambiguidade lexical e contextual do hebraico.
