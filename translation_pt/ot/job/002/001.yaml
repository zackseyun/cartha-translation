  terminology: «Filhos de Deus», «Yahweh» e «o Adversário» são escolhas consistentes com o hebraico e com a política declarada. As notas preservam corretamente as alternativas interpretativas sem fixar a identidade dos filhos de Deus nem transformar o título em nome próprio.
