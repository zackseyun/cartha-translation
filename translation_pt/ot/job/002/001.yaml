base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: pt
  text: Mais uma vez, houve um dia em que os filhos de Deus[a] vieram apresentar-se diante de Yahweh, e o Adversário[b] também veio entre eles, a fim de apresentar-se diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Deus”. A expressão pode referir-se a seres celestiais ou a membros do conselho divino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Satanás”; o hebraico traz o artigo definido: “o satã”, que provavelmente funciona aqui como título, com o sentido de “o adversário” ou “o acusador”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Mais uma vez, houve um dia em que
  rationale: A fórmula retoma a cena de Jó 1:6. “Mais uma vez” explicita a recorrência narrativa, enquanto “houve um dia” conserva de modo reconhecível o idioma hebraico sem reduzi-lo simplesmente a “certo dia”.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: os filhos de Deus
  rationale: Tradução formalmente transparente do hebraico, que preserva a imagem e sua tensão interpretativa, sem decidir no corpo do texto entre seres celestiais e integrantes do conselho divino.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: apresentar-se diante de Yahweh
  rationale: Neste cenário de assembleia ou corte, o hitpael de יצב indica comparecer e tomar posição perante um superior. “Apresentar-se diante de” é natural em português e mantém o sentido cerimonial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: הַשָּׂטָן
  choice: o Adversário
  rationale: O artigo definido hebraico favorece aqui a compreensão como título ou função. “O Adversário” comunica o sentido lexical e evita impor ao texto o uso posterior de “Satanás” como nome próprio fixo.
- source_word: בְּתוֹכָם
  choice: para o meio deles
  rationale: Expressa naturalmente em português a entrada do Adversário no interior do grupo reunido.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: a fim de apresentar-se diante de Yahweh
  rationale: Mantém a repetição intencional da ação aplicada anteriormente aos filhos de Deus e torna clara sua finalidade.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser traduzido como nome próprio ou como título
  choice: o Adversário
  alternative: Satanás; o Satã; o acusador
  rationale: A presença do artigo definido indica mais naturalmente um título ou função neste contexto. A tradução conserva esse sinal gramatical e não antecipa uma identificação mais plenamente fixada em tradições posteriores.
- issue: Identidade dos בְּנֵי הָאֱלֹהִים
  choice: os filhos de Deus
  alternative: os seres celestiais; os seres divinos; os membros do conselho divino
  rationale: A expressão literal preserva a linguagem do texto e deixa aberta a identificação exata do grupo, que a nota explica sem resolver dogmaticamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “apresentar-se diante de Yahweh” foi mantida para preservar o paralelismo do hebraico; “a fim de” evita uma sequência pesada de infinitivos na segunda ocorrência.
