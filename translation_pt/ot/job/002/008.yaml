  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: pt
  text: Então ele pegou um caco de cerâmica[a] para se raspar[b], enquanto estava sentado no meio das cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um fragmento de cerâmica”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se coçar”. O verbo hebraico pode indicar coçar ou arranhar, mas “raspar” combina melhor com o uso de um caco de cerâmica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele pegou
  rationale: O wayyiqtol de לקח faz a narrativa avançar. “Então” expressa naturalmente a sequência em português sem acrescentar uma relação causal.
- source_word: לוֹ
  choice: ele pegou
  rationale: O pronome dativo tem valor reflexivo ou de interesse, mas pode ficar implícito na formulação idiomática em português; “pegou para si” seria desnecessariamente rígido.
- source_word: חֶרֶשׂ
  choice: um caco de cerâmica
  rationale: חֶרֶשׂ designa aqui um fragmento de objeto de barro. A expressão é precisa, atual e mais imediatamente compreensível do que o termo técnico “óstraco”.
- source_word: לְהִתְגָּרֵד
  choice: para se raspar
  rationale: O infinitivo hitpael apresenta a ação voltada contra o próprio corpo de Jó. “Raspar-se” combina com o uso de um caco áspero e preserva a intensidade da cena.
- source_word: בּוֹ
  choice: com ele (expresso de modo implícito na construção “um caco... para se raspar”)
  rationale: A preposição com o pronome indica o instrumento. Em português, a relação instrumental já fica clara pela sequência e não precisa ser repetida de modo pesado.
- source_word: וְהוּא יֹשֵׁב
  choice: enquanto estava sentado
  rationale: A oração descreve uma circunstância simultânea à ação de se raspar; “enquanto” comunica essa relação de maneira natural.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: no meio das cinzas
  rationale: A expressão preserva o sentido espacial de בְּתוֹךְ, “no meio de”, sem definir além do texto se se tratava de um monte de cinzas ou de um lugar coberto por elas.
