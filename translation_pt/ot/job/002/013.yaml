  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: pt
  text: E sentaram-se com ele no chão durante sete dias e sete noites, e nenhum deles lhe disse palavra alguma, pois viram que a sua dor[a] era muito grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o seu sofrimento era muito grande»; ou: «a sua aflição era muito grande». O termo hebraico pode abranger a dor em sentido amplo, incluindo sofrimento físico e angústia emocional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: sentaram-se
  rationale: Preserva a ação concreta de ישׁב e a postura solene de luto, sem a tornar no mais interpretativo «ficaram».
- source_word: אִתּוֹ
  choice: com ele
  rationale: Expressa diretamente o sentido comitativo e a presença física dos companheiros junto de Jó.
- source_word: לָאָרֶץ
  choice: no chão
  rationale: Neste contexto, אֶרֶץ designa o chão onde se sentaram como gesto de luto; «no chão» é natural em português.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: durante sete dias e sete noites
  rationale: Mantém a expressão temporal completa; «durante» explicita naturalmente em português a duração indicada pelo hebraico.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: e nenhum deles lhe disse palavra alguma
  rationale: Reproduz a ênfase hebraica no silêncio absoluto, com uma formulação clara e digna em português.
- source_word: כִּי רָאוּ
  choice: pois viram
  rationale: כִּי introduz aqui a razão do silêncio; «pois» conserva a ligação causal com fluidez narrativa.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: que a sua dor era muito grande
  rationale: «Dor» é o equivalente direto de כְּאֵב e preserva sua amplitude sem decidir entre sofrimento físico e angústia emocional; «muito grande» representa גָדַל...מְאֹד.
