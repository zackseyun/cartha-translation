  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: pt
  text: Então o Adversário saiu da presença de Yahweh e feriu Jó com feridas dolorosas, desde a planta do pé até o alto da cabeça[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: ha-satan, “o adversário”; tradicionalmente, “Satanás”. Aqui, o termo vem com o artigo definido e pode funcionar como título: “o Adversário”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “com furúnculos dolorosos” ou “com feridas graves”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: o Adversário
  rationale: O artigo definido hebraico favorece aqui a compreensão como título ou função. “O Adversário” preserva esse sentido sem antecipar a leitura do termo como nome próprio.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: A construção com פָּנִים indica idiomaticamente presença, e o tetragrama é transliterado como “Yahweh”.
- source_word: וַיַּךְ
  choice: feriu
  rationale: O verbo נכה exprime um golpe ou ação direta de ferir; “feriu” é natural, atual e mantém a força verbal.
- source_word: בִּשְׁחִין רָע
  choice: com feridas dolorosas
  rationale: שְׁחִין designa uma afecção inflamada da pele, frequentemente entendida como úlceras ou furúnculos; רָע caracteriza a aflição como grave ou dolorosa, não como moralmente má.
- source_word: מִכַּף רַגְלוֹ
  choice: desde a planta do pé
  rationale: כַּף, em referência ao pé, significa a planta. O singular coletivo é preservado de forma natural em português.
- source_word: עַד קָדְקֳדוֹ
  choice: até o alto da cabeça
  rationale: קָדְקֹד indica o topo ou ponto mais alto da cabeça; a formulação comunica claramente que a afecção cobria todo o corpo.
theological_decisions:
- issue: Tradução de הַשָּׂטָן no prólogo de Jó
  choice: o Adversário
  alternative: Satanás
  rationale: O hebraico traz o artigo definido, sugerindo um título ou papel neste contexto. A tradução evita transformar silenciosamente o termo em nome próprio, enquanto a forma tradicional é registrada em nota.
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome divino e segue a orientação terminológica fornecida.
- issue: Natureza da afecção em בִּשְׁחִין רָע
  choice: feridas dolorosas
  alternative: furúnculos dolorosos; úlceras graves
  rationale: O substantivo admite mais de uma identificação dermatológica, e o texto não permite determinar com segurança uma lesão clínica específica. A tradução principal mantém essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Então” reproduz a progressão narrativa; “desde... até...” conserva a expressão merismática de extensão corporal completa. As notas mantêm visíveis as ambiguidades lexical e teológica do hebraico.
