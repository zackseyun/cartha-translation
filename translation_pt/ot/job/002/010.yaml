base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: pt
  text: 'Mas ele lhe disse: “Você fala como fala uma das mulheres insensatas. Receberemos de Deus o bem e não receberemos o mal[a]?” Em tudo isso, Jó não pecou com os seus lábios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a adversidade” ou “a desgraça”. Neste contexto, o hebraico רָע se refere ao que é danoso ou desfavorável, em contraste com “o bem”; não indica necessariamente o mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Você fala como fala uma das mulheres insensatas
  rationale: “Insensatas” expressa a falta de discernimento em sentido moral e religioso indicada por נְבָלוֹת, não mera pouca inteligência. A repetição de “fala” preserva de modo natural a construção enfática hebraica.
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Receberemos de Deus o bem
  rationale: O imperfeito, em paralelo com a oração seguinte, funciona como pergunta retórica. “O bem” conserva o artigo e a categoria ampla de experiências favoráveis ou bênçãos.
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  choice: e não receberemos também o mal
  rationale: “O mal” preserva o contraste lexical direto entre הַטּוֹב e הָרָע e mantém a tensão do texto. A nota esclarece que, neste contexto, a expressão pode designar adversidade ou desgraça, sem exigir a ideia de mal moral.
- source_word: בְּכָל־זֹאת
  choice: Em tudo isso
  rationale: Forma idiomática e fiel de introduzir a avaliação do narrador.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: Jó não pecou com os seus lábios
  rationale: Mantém a imagem corporal do hebraico e deixa explícito que a avaliação narrativa se refere às palavras de Jó.
theological_decisions:
- issue: Sentido de הָרָע em relação a Deus
  choice: o mal
  alternative: a adversidade; a desgraça
  rationale: A formulação principal conserva a antítese hebraica entre “o bem” e “o mal”, sem resolver silenciosamente sua tensão teológica. A nota orienta o leitor para o sentido contextual de circunstâncias danosas ou desfavoráveis, sem afirmar que Deus seja autor do mal moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ele lhe respondeu” retoma naturalmente a esposa mencionada no contexto. A pergunta retórica foi mantida como uma única sequência, e “com os seus lábios” preserva a expressão concreta do hebraico.
