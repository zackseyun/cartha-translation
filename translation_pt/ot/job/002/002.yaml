  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: pt
  text: 'E Yahweh disse ao Acusador[a]: “De onde você vem?” E o Acusador respondeu a Yahweh e disse: “De percorrer a terra e de andar por ela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o satan”; aqui, provavelmente um título que significa “o acusador” ou “o adversário”, não necessariamente um nome próprio.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: O artigo definido hebraico favorece aqui uma designação de função, e “Acusador” expressa com clareza a dimensão adversarial sem tratá-la necessariamente como nome próprio.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: De onde você vem?
  rationale: Reproduz de modo natural em português a pergunta pela procedência, preservando a força direcional de מִן.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: Em português atual, a combinação hebraica formulaica “respondeu e disse” pode ser expressa naturalmente por “respondeu”, sem perda do conteúdo discursivo.
- source_word: מִשֻּׁט
  choice: De percorrer
  rationale: Comunica o movimento de um lugar para outro ou de um lado para outro, sem acrescentar a ideia mais específica de patrulhamento.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: Neste contexto, אֶרֶץ se refere naturalmente ao mundo terrestre, não a uma região particular.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: e andar por ela
  rationale: Preserva o sentido de deslocar-se repetidamente pela terra em linguagem portuguesa clara e corrente.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser entendido como nome próprio ou como título/função
  choice: o Acusador
  alternative: Satanás; o adversário
  rationale: O artigo definido e a função no cenário da corte celestial favorecem uma designação funcional. A tradução evita impor ao texto, neste ponto, a leitura posterior de um nome próprio, sem excluir possíveis relações teológicas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as repetições foram levemente naturalizadas, preservando o sentido e a tensão do hebraico.
