base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: pt
  text: Quando levantaram os olhos, ainda de longe,[a] não o reconheceram. Então levantaram a voz e choraram; cada um rasgou o próprio manto e lançou pó para o alto, sobre a própria cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à distância”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em direção aos céus”, isto é, para o alto, como gesto de luto.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: levantaram os olhos
  rationale: Preserva a expressão hebraica em uma formulação natural e compreensível em português.
- source_word: מֵרָחוֹק
  choice: ainda de longe
  rationale: Expressa claramente a distância espacial e se liga naturalmente ao momento em que eles avistaram Jó.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: não o reconheceram
  rationale: O verbo indica que, por causa da aparência de Jó, eles não conseguiram identificá-lo.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: levantaram a voz
  rationale: Mantém o idioma hebraico de lamentação e é corrente em português; o singular coletivo é natural com sujeito plural.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: Comunica de modo direto o pranto de luto sem acrescentar intensidade não explicitada.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: cada um rasgou o próprio manto
  rationale: Representa o uso distributivo de אִישׁ e identifica מְעִיל como veste exterior, preservando o gesto de luto.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: lançou pó para o alto, sobre a própria cabeça
  rationale: Reproduz tanto o lançamento do pó sobre a cabeça quanto a direção ascendente indicada por הַשָּׁמָיְמָה, em português natural. A construção distributiva harmoniza com 'cada um'.
