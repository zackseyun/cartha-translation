source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: pt
  text: 'Então Yahweh disse ao Acusador[a]: “Você considerou o meu servo Jó?[b] Pois não há ninguém como ele na terra: homem íntegro e reto, que teme a Deus e se afasta do mal. Ele ainda se mantém firme em sua integridade, embora você tenha me incitado contra ele para destruí-lo sem motivo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico הַשָּׂטָן, “o Acusador”; tradicionalmente, “Satanás”.
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “Você pôs o coração no meu servo Jó?”'
    reason: lexical_alternative
  - marker: c
    text: “Destruí-lo” traduz uma expressão que literalmente significa “engoli-lo”. “Sem motivo” também pode ser traduzido por “por nada” e provavelmente retoma Jó 1:9, onde o Acusador pergunta se Jó teme a Deus “por nada”.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: Com o artigo definido, a expressão funciona aqui como título ou papel; “Acusador” comunica sua função sem impor a leitura posterior como nome próprio.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: Você pôs o coração em
  rationale: Mantém a imagem antropológica hebraica, embora em português também possa significar “Você prestou atenção a” ou “Você considerou”.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Expressa naturalmente a relação de serviço e pertencimento sem realçar indevidamente a condição de escravo.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: não há ninguém como ele na terra
  rationale: O alcance terrestre se ajusta à cena cósmica e preserva a formulação comparativa.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: homem íntegro e reto
  rationale: “Íntegro” comunica inteireza moral, não perfeição sem pecado, e também preserva o vínculo lexical com תֻמָּה mais adiante.
- source_word: יְרֵא אֱלֹהִים
  choice: que teme a Deus
  rationale: Preserva a força verbal e o sentido de temor reverente.
- source_word: וְסָר מֵרָע
  choice: se afasta do mal
  rationale: Reproduz de modo claro o movimento de afastamento expresso pelo verbo hebraico.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: Ele ainda se mantém firme em sua integridade
  rationale: Comunica tanto a persistência indicada por עֹדֶנּוּ quanto a força de מַחֲזִיק, preservando o campo semântico de integridade.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: embora você tenha me incitado contra ele
  rationale: A relação concessiva é natural no contexto, enquanto “me incitado contra ele” mantém sem suavização a agência divina expressa no hebraico.
- source_word: לְבַלְּעוֹ
  choice: para destruí-lo
  rationale: O verbo significa literalmente “engolir”, mas aqui a metáfora aponta para arruinar ou destruir; a opção no corpo do texto é natural, com a imagem literal registrada em nota.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Expressa a ausência de causa ou justificativa. A nota preserva a alternativa “por nada” e sua possível ligação literária com Jó 1:9.
theological_decisions:
- issue: A participação divina no sofrimento de Jó
  choice: “você tenha me incitado contra ele”
  alternative: “você tenha me levado a permitir que lhe fizessem mal”
  rationale: O hebraico atribui diretamente a Yahweh a ação provocada pelo Acusador. A tradução não suaviza essa tensão nem introduz uma solução teológica ausente do texto.
- issue: A identidade de הַשָּׂטָן
  choice: “o Acusador” como título funcional
  alternative: “Satanás” como nome próprio
  rationale: O artigo definido favorece a leitura como papel ou título nesta cena, sem excluir desenvolvimentos teológicos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens do hebraico foram preservadas quando naturais; metáforas potencialmente opacas e alternativas literariamente relevantes foram registradas em notas.
