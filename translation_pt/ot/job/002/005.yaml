  - severity: low
    issue: «em seus ossos e em sua carne»
    rationale: É compreensível, mas «nos seus ossos e na sua carne» é mais idiomático em português para a esfera corporal atingida, mantendo o singular coletivo hebraico por meio de «carne» e o plural natural «ossos».
