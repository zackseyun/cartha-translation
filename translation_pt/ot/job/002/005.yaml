  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: pt
  text: Mas estende, por favor, a tua mão e toca nos seus ossos e na sua carne; ele certamente te amaldiçoará diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “te abençoará”; aqui, o verbo é entendido como uma expressão eufemística que significa “te amaldiçoará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Mas
  rationale: Introduz de modo natural a contraproposta adversativa do acusador.
- source_word: שְׁלַח נָא
  choice: estende, por favor
  rationale: A expressão idiomática significa estender a mão para agir contra alguém; “por favor” representa a partícula de pedido נָא.
- source_word: יָדְךָ
  choice: a tua mão
  rationale: Conserva a imagem concreta do hebraico e integra a expressão de ação direta.
- source_word: וְגַע
  choice: e toca
  rationale: Mantém o sentido básico de נגע, enquanto o contexto deixa clara a intenção de ferir ou afligir.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: em seus ossos e em sua carne
  rationale: Preserva a expressão corporal concreta; o plural “ossos” é idiomático em português e representa o singular coletivo hebraico.
- source_word: אִם לֹא
  choice: com certeza
  rationale: Neste contexto de afirmação enfática semelhante a juramento, a locução não introduz uma condição real, mas expressa convicção forte.
- source_word: אֶל פָּנֶיךָ
  choice: na tua própria face
  rationale: Expressa confronto direto e aberto, preservando a imagem hebraica sem recorrer ao coloquial “na tua cara”.
- source_word: יְבָרֲכֶךָּ
  choice: te amaldiçoará
  rationale: Embora o verbo normalmente signifique “abençoar”, neste contexto ele funciona como substituição eufemística de “amaldiçoar”; a forma literal é registrada em nota.
theological_decisions:
- issue: Uso eufemístico de ברך nas cenas de provação de Jó
  choice: Traduzir “te amaldiçoará” no texto principal
  alternative: Traduzir literalmente “te abençoará” e explicar o sentido pelo contexto
  rationale: O desafio do acusador é que Jó rejeitará Deus sob sofrimento. “Abençoará” obscureceria essa acusação para leitores modernos; a nota conserva transparência quanto à forma hebraica e à tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa do singular preserva a fala direta dirigida a Deus. “Na tua própria face” mantém a força confrontadora da expressão sem adotar um tom excessivamente coloquial.
