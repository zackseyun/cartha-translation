  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: pt
  text: 'E o SENHOR disse ao Acusador: “Veja, ele está em suas mãos; apenas poupe a vida dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção tradicional e amplamente reconhecida de representar o nome divino por SENHOR em versaletes, em harmonia com a camada inglesa auditada.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: O artigo definido favorece aqui a função ou título do personagem, e não necessariamente o nome próprio “Satanás”.
- source_word: הִנּוֹ
  choice: Veja
  rationale: Transmite de modo natural a partícula de apresentação e chamada de atenção no português atual.
- source_word: בְיָדֶךָ
  choice: em suas mãos
  rationale: Conserva a imagem idiomática de entrega ao poder ou controle do Acusador; o plural é a forma idiomática mais natural em português.
- source_word: נַפְשׁוֹ
  choice: a vida dele
  rationale: Neste contexto, נֶפֶשׁ indica a vida da pessoa, não uma “alma” separável em sentido técnico.
- source_word: שְׁמֹר
  choice: poupe
  rationale: No contexto de uma limitação imposta ao dano permitido, comunica naturalmente a ordem de preservar a vida de Jó.
theological_decisions:
- issue: Identidade e função de הַשָּׂטָן
  choice: o Acusador
  alternative: Satanás
  rationale: Mantém o valor funcional do substantivo com artigo definido e evita transformar sem necessidade o título em nome próprio.
- issue: Sentido antropológico de נֶפֶשׁ
  choice: a vida dele
  alternative: a alma dele
  rationale: A proibição diz respeito a matar Jó; “vida” preserva o sentido contextual sem importar uma formulação específica sobre a constituição humana.
- issue: Alcance da permissão divina
  choice: ele está em suas mãos; apenas poupe a vida dele
  alternative: entrego-o em suas mãos, mas preserve sua vida
  rationale: Preserva tanto a concessão de poder ao Acusador quanto seu limite explícito, sem ampliar nem atenuar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva a imagem hebraica de estar “nas mãos” de alguém, usando o plural idiomático em português, e evita terminologia confessional desnecessária.
