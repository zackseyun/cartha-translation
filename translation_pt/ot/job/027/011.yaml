  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: pt
  text: Eu os instruirei acerca da mão de Deus[a]; não esconderei o que está com o Todo-Poderoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito da mão de Deus”. A expressão pode se referir ao poder, à ação ou ao modo de Deus agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que pertence ao Todo-Poderoso”, “o conselho do Todo-Poderoso” ou “o que procede do Todo-Poderoso”. A expressão hebraica é concisa e um tanto elíptica.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Eu os instruirei
  rationale: O hifil imperfeito na primeira pessoa do singular de ירה tem aqui sentido didático. “Instruirei” é natural, digno e preserva o caráter declarativo da fala de Jó.
- source_word: אֶתְכֶם
  choice: os
  rationale: Pronome objeto direto da segunda pessoa masculina plural; “os” expressa naturalmente o referente plural em português.
- source_word: בְּיַד אֵל
  choice: acerca da mão de Deus
  rationale: A preposição ב é entendida como introduzindo o assunto da instrução. Mantém-se a metáfora hebraica da “mão”, que pode abranger poder, ação ou modo de agir de Deus.
- source_word: אֵל
  choice: Deus
  rationale: אֵל funciona aqui como título ou designação divina; “Deus” é a tradução portuguesa padrão e clara.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: o que está com o Todo-Poderoso
  rationale: A expressão hebraica é concisa e elíptica. A formulação relativamente literal preserva sua amplitude sem especificar indevidamente conselho, propósito ou juízo.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução tradicional e inteligível do título divino שַׁדַּי, especialmente apropriada no livro de Jó.
- source_word: לֹא אֲכַחֵד
  choice: não esconderei
  rationale: O piel imperfeito de כחד significa ocultar ou esconder. “Não esconderei” é direto e natural no contexto de comunicar conhecimento.
theological_decisions:
- issue: A ação divina expressa pela “mão de Deus”
  choice: Manter a metáfora “mão de Deus”
  alternative: Explicitar como “poder de Deus” ou “o que Deus faz”
  rationale: A metáfora bíblica é rica e pode abranger poder, atividade e trato divino. Preservá-la evita restringir o sentido a uma única interpretação.
- issue: O conteúdo associado ao Todo-Poderoso na segunda oração
  choice: 'Traduzir de modo amplo: “o que está com o Todo-Poderoso”'
  alternative: “o conselho do Todo-Poderoso”, “o que pertence ao Todo-Poderoso” ou “o que procede do Todo-Poderoso”
  rationale: O hebraico não explicita um substantivo como “conselho”, “propósito” ou “juízo”. A tradução escolhida conserva a elipse e a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Acerca de” mantém um registro levemente formal sem ser arcaico. A ordem das notas acompanha as expressões às quais se referem, corrigindo a colocação aparentemente invertida dos marcadores na camada inglesa.
