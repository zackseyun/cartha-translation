  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: pt
  text: Acaso ele se deleitará no Todo-Poderoso? Invocará a Deus em todo o tempo?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “se ele se deleita no Todo-Poderoso”; aqui, a partícula hebraica introduz uma pergunta retórica.
    reason: lexical_alternative
  - marker: b
    text: “Invocar” também pode ser traduzido por “clamar a Deus” ou “orar a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Acaso ...?
  rationale: Neste contexto, a partícula introduz uma pergunta retórica, não uma oração condicional. “Acaso” expressa com naturalidade essa força interrogativa em português.
- source_word: עַל
  choice: 'no'
  rationale: Com o verbo התענג e um objeto pessoal, a preposição indica aquele em quem se encontra prazer; “deleitar-se no Todo-Poderoso” preserva essa relação.
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: O título divino é traduzido, e não transliterado, de modo claro e tradicional em português.
- source_word: יִתְעַנָּג
  choice: se deleitará
  rationale: A forma hitpael tem nuance reflexiva; “deleitar-se” a preserva e mantém o tom poético.
- source_word: יִקְרָא
  choice: invocará
  rationale: Tendo Deus como objeto, קרא significa chamar por ele ou dirigir-se a ele em oração. “Invocar” mantém essa amplitude sem reduzir o sentido apenas à oração formal.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: O substantivo divino singular é traduzido simplesmente como “Deus”, sem ampliação não justificada.
- source_word: בְּכָל עֵת
  choice: em todo o tempo
  rationale: A expressão comunica constância e preserva de perto a formulação abrangente do hebraico.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: Por ser um título divino, é traduzido para tornar seu sentido acessível, em vez de ser transliterado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Acaso” assinala a pergunta retórica; “em todo o tempo” conserva o paralelismo e a abrangência poética do hebraico.
