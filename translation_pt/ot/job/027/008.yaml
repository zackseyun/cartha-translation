  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: pt
  text: Pois que esperança tem o ímpio[a], ainda que tenha obtido lucro, quando Deus lhe tira a vida[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hipócrita”. O termo hebraico pode designar alguém irreverente, ímpio ou hipócrita.
    reason: lexical_alternative
  - marker: b
    text: A oração anterior é difícil; também pode ser entendida como “quando obtém lucro”. Mais literalmente, “quando Deus lhe arranca a vida” ou “lhe tira a alma”.
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: esperança
  rationale: O substantivo indica aquilo que se espera; “esperança” é natural em português e preserva a força da pergunta retórica.
- source_word: חָנֵף
  choice: ímpio
  rationale: Em Jó, o termo costuma designar quem é irreverente ou moralmente afastado de Deus, e não apenas alguém insincero; “ímpio” comunica bem esse sentido amplo.
- source_word: יִבְצָע
  choice: Deus o elimina
  rationale: A forma e a sintaxe são difíceis. No paralelismo com Deus tirando a vida, esta tradução entende o verbo no sentido de cortar ou pôr fim a alguém e explicita Deus como sujeito; a possibilidade de referência a obter lucro é preservada em nota.
- source_word: יֵשֶׁל
  choice: tira
  rationale: No contexto, o verbo descreve Deus removendo ou arrancando a vida. “Tira” é claro, natural e não enfraquece a ação divina.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a designação poética singular de Deus frequente no livro de Jó.
- source_word: נַפְשׁוֹ
  choice: a vida
  rationale: Aqui נֶפֶשׁ designa a vida da pessoa, que Deus retira na morte; “vida” evita impor ao verso uma afirmação técnica sobre a natureza da alma.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: Traduzir por “vida”
  alternative: “alma”
  rationale: O verso fala da morte do indivíduo, sem formular uma doutrina específica sobre a composição metafísica do ser humano.
- issue: Agente e sentido de יִבְצָע
  choice: Entender Deus como agente que elimina o ímpio
  alternative: 'Entender o ímpio como quem obtém lucro: “quando obtém lucro” ou “ainda que tenha lucrado”'
  rationale: O paralelismo com a oração seguinte favorece a ação divina que põe fim à vida, mas o hebraico é conciso e genuinamente discutido; a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura paralela e a pergunta retórica do hebraico foram preservadas; as ambiguidades lexicais relevantes aparecem nas notas.
