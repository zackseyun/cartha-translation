- from: Ele constrói sua casa como a traça[a], como o abrigo que um vigia faz.[b]
  to: Ele constrói sua casa como a traça, como uma cabana que um vigia faz.[a]
  rationale: A revisão elimina uma nota especulativa sobre o primeiro símile e troca o artigo definido por uma construção indefinida, mais próxima do hebraico. Mantém-se a repetição de «como», a imagem da traça e a referência a uma construção temporária feita por quem vigia.
