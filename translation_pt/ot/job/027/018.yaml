lexical_decisions:
- source_word: בָּנָה
  choice: constrói
  rationale: Embora seja uma forma perfeita, no discurso poético descreve de modo característico o que o ímpio faz; o presente comunica naturalmente esse valor em português.
- source_word: כָעָשׁ
  choice: como a traça
  rationale: עָשׁ normalmente designa a traça. A comparação ressalta a fragilidade e a pouca duração da casa, sem tornar explícito aquilo que o hebraico deixa condensado.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: O paralelismo com o abrigo e os verbos de construção favorece o sentido concreto de edificação, não o de família ou casa como linhagem.
- source_word: וּכְסֻכָּה
  choice: como o abrigo
  rationale: סֻכָּה é uma estrutura provisória, como uma cabana ou choça. “Abrigo” é claro e natural, enquanto a nota conserva opções mais específicas.
- source_word: עָשָׂה
  choice: faz
  rationale: Assim como בָּנָה, a forma perfeita tem valor genérico no contexto poético; “faz” mantém a simplicidade do hebraico.
- source_word: נֹצֵר
  choice: um vigia
  rationale: O particípio designa quem guarda ou observa, provavelmente um vigia de campo ou vinha que ergue um abrigo temporário.
