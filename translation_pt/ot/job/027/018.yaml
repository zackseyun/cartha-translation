  - severity: low
    issue: «como o abrigo que um vigia faz» emprega artigo definido para uma estrutura indefinida.
    rationale: כְּסֻכָּה contém o comparativo com substantivo sem artigo. «Como uma cabana que um vigia faz» preserva melhor essa indefinição e é igualmente natural.
