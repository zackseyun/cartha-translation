  text: Ele constrói sua casa como a traça, como uma cabana que um vigia faz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um abrigo que um guarda faz”. Trata-se de uma estrutura provisória, como a que se faz em campo ou vinha.'
