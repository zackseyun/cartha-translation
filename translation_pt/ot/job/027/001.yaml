  text: And Job again took up his discourse and said:[a]
translation:
  language: pt
  text: E Jó retomou seu discurso e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu provérbio”, “sua parábola” ou “seu oráculo”; o termo hebraico pode designar vários tipos de ditos solenes ou figurados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: tornou a
  rationale: O verbo יסף significa literalmente acrescentar ou continuar; nesta construção idiomática com o infinitivo, “tornou a” expressa de modo natural que Jó retomou a fala.
- source_word: שְׂאֵת
  choice: proferir
  rationale: O infinitivo de נשׂא significa literalmente levantar ou carregar, mas, na expressão שׂאת משל, introduz o ato de enunciar solenemente uma fala. “Proferir” comunica essa função em português corrente e digno.
- source_word: מְשָׁלוֹ
  choice: seu discurso
  rationale: מָשָׁל pode designar provérbio, parábola, dito figurado ou pronunciamento. Aqui introduz uma fala poética extensa, para a qual “discurso” é a opção contextual mais clara, enquanto a nota preserva a amplitude lexical.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Forma narrativa padrão de אמר; “e disse” conserva a introdução formal da fala.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
