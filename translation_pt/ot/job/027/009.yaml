  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: pt
  text: Será que Deus ouvirá seu clamor quando a aflição vier sobre ele?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu grito” ou “seu pedido de socorro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “se a aflição vier sobre ele”; a conjunção hebraica também pode ser entendida de modo condicional, embora o sentido temporal “quando” se ajuste bem ao contexto.
    reason: alternative_reading
  - marker: c
    text: “Aflição” também pode ser traduzida por “angústia”, “adversidade” ou “dificuldade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: seu clamor
  rationale: צְעָקָה designa um grito ou clamor, muitas vezes motivado por sofrimento e dirigido como apelo. “Seu clamor” é natural, conciso e preserva a urgência da expressão.
- source_word: יִשְׁמַע
  choice: ouvirá
  rationale: 'O yiqtol funciona naturalmente como futuro numa pergunta retórica: questiona-se se Deus ouvirá o clamor dessa pessoa.'
- source_word: אֵל
  choice: Deus
  rationale: אֵל é uma designação comum de Deus e assim se verte com clareza e naturalidade em português.
- source_word: כִּי
  choice: quando
  rationale: A conjunção admite vários sentidos; aqui, a leitura temporal produz uma frase coerente no contexto, sem excluir a possibilidade condicional registrada em nota.
- source_word: תָבוֹא
  choice: vier
  rationale: בוא significa literalmente “vir”. O futuro do subjuntivo é exigido naturalmente em português depois de “quando” para um acontecimento futuro.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Com בוא, a preposição עַל expressa algo que sobrevém a alguém; “vier sobre ele” conserva de perto a imagem hebraica.
- source_word: צָרָה
  choice: aflição
  rationale: צָרָה abrange aflição, angústia, adversidade ou dificuldade. “Aflição” comunica sofrimento e pressão sem restringir a referência apenas a uma emoção interior.
theological_decisions: []
