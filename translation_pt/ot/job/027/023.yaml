  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: pt
  text: Ele bate palmas contra ele e assobia para ele, do seu lugar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sibila para ele”. O verbo hebraico pode indicar assobiar ou sibilar; o sentido exato do som permanece aberto.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico não declara quem pratica as ações: “ele bate palmas ... e assobia”. Pode-se entender o sujeito como Deus, outras pessoas ou uma força impessoal.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: bate palmas
  rationale: Com כַּפֵּימוֹ (“suas mãos”), o verbo שׂפק descreve o gesto de bater palmas. A formulação preserva a ação concreta sem definir se expressa zombaria, triunfo ou espanto.
- source_word: עָלֵימוֹ
  choice: contra ele
  rationale: A preposição עַל com sufixo pode significar “sobre”, “contra” ou, neste contexto gestual hostil, “contra ele”. A escolha mantém a direção adversativa da ação.
- source_word: כַּפֵּימוֹ
  choice: palmas
  rationale: כַּף pode designar a palma ou a mão. Em português, “bater palmas” é a expressão natural e já implica o uso das mãos.
- source_word: וְיִשְׁרֹק
  choice: assobia
  rationale: שרק pode designar assobiar ou emitir um som de desprezo semelhante a uma vaia. “Assobia” preserva a imagem sonora sem determinar além do hebraico a natureza exata do som.
- source_word: עָלָיו
  choice: para ele
  rationale: Com o verbo שרק, “para ele” expressa naturalmente em português o alvo do assobio, mantendo a referência pronominal masculina singular.
- source_word: מִמְּקֹמוֹ
  choice: do seu lugar
  rationale: מָקוֹם significa de modo amplo “lugar”. A tradução literal conserva aberta tanto a localização quanto a identidade do sujeito.
theological_decisions:
- issue: Identidade do sujeito do versículo
  choice: Mantém-se o sujeito masculino singular implícito, vertido como “ele”, sem identificá-lo.
  alternative: Explicitar Deus, outras pessoas, o vento oriental ou alguma força impessoal como sujeito.
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, mas não há sujeito expresso. Como o contexto admite mais de uma interpretação, especificá-lo resolveria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bate palmas” é idiomático; “contra ele” preserva o tom hostil, enquanto “assobia” evita impor uma interpretação mais específica que o verbo hebraico. Os marcadores aparecem no texto principal.
