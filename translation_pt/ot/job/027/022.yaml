  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: pt
  text: Ele atira contra ele[a] e não o poupa; ele certamente foge da sua mão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “ele lança/atira contra ele”. O objeto lançado não é expresso no hebraico; no contexto, a construção pode sugerir um ataque violento.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fugindo, ele foge”, construção de infinitivo absoluto com verbo finito que intensifica a ação; também pode ser traduzida por “ele foge, sim, foge” ou “foge às pressas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Ele se lança contra ele
  rationale: O verbo significa literalmente “lançar/atirar”, e עַל pode indicar movimento hostil “contra/sobre”. A forma reflexiva produz em português uma cena de ataque violento inteligível, embora o pronome reflexivo não esteja expresso no hebraico; a nota conserva a construção mais literal e sua ambiguidade.
- source_word: וְלֹא יַחְמֹל
  choice: e não o poupa
  rationale: חמל pode significar “poupar” ou “ter compaixão”. No contexto de juízo e ataque, “não o poupa” é conciso e preserva tanto a severidade quanto a ausência de misericórdia.
- source_word: מִיָדוֹ
  choice: da sua mão
  rationale: Mantém a imagem literal de יָד, que também pode representar poder, domínio ou alcance. “Sua” conserva a referência pronominal sem identificar além do que o hebraico permite.
- source_word: בָּרוֹחַ יִבְרָח
  choice: ele foge, sim, foge
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação. A repetição idiomática com “sim” reproduz a ênfase sem acrescentar necessariamente rapidez ou direção, ideias apenas implícitas no contexto.
theological_decisions:
- issue: Identidade do sujeito de “se lança” e referente de “sua mão”
  choice: Manter o sujeito apenas como “Ele” e o possessivo como “sua”, sem nomeá-lo
  alternative: Explicitar “Deus” ou entender como continuação da ação do vento oriental
  rationale: O hebraico não nomeia o sujeito neste versículo. Embora o contexto possa levar à identificação com Deus, possivelmente agindo por meio do vento oriental do versículo anterior, explicitá-la resolveria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição “foge, sim, foge” conserva a ênfase hebraica; os pronomes permanecem deliberadamente não identificados para preservar a ambiguidade do original.
