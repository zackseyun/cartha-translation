base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: pt
  text: 'Pois, enquanto meu fôlego ainda estiver em mim,

    e o sopro de Deus estiver nas minhas narinas,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito de Deus estiver nas minhas narinas”. O termo hebraico רוּחַ pode significar “sopro”, “vento” ou “espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz e fundamenta a declaração solene de Jó no contexto, sem tornar a relação mais estritamente causal do que o hebraico exige.
- source_word: כָל עוֹד
  choice: enquanto ainda houver
  rationale: Expressa duração contínua e preserva a ideia de que essa condição permanece vigente.
- source_word: נִשְׁמָתִי
  choice: fôlego
  rationale: נְשָׁמָה designa aqui o fôlego vital; “fôlego” é natural em português e se ajusta ao paralelismo do verso.
- source_word: בִי
  choice: em mim
  rationale: Preserva de modo direto a imagem hebraica de presença interior.
- source_word: וְרוּחַ
  choice: e o sopro
  rationale: רוּחַ pode significar sopro, vento ou espírito. O paralelismo com “fôlego” e a referência às narinas favorecem o sentido concreto de “sopro”, sem eliminar a alternativa “Espírito”.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a tradução simples e exata do título divino singular, particularmente frequente em Jó.
- source_word: בְּאַפִּי
  choice: nas minhas narinas
  rationale: Mantém o sentido físico de אַף neste contexto e a imagem poética concreta da respiração.
theological_decisions:
- issue: Sentido de רוּחַ אֱלוֹהַּ em paralelo com נִשְׁמָתִי
  choice: o sopro de Deus
  alternative: o Espírito de Deus
  rationale: O contexto imediato trata da continuidade da vida e da respiração, e “nas minhas narinas” favorece “sopro”. Como רוּחַ também pode significar “Espírito”, essa possibilidade é preservada em nota, sem resolver indevidamente a tensão lexical e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com disposição em dois membros para refletir o paralelismo poético. “Fôlego” e “sopro” preservam a distinção lexical do hebraico sem soar artificiais.
