id: JOB.27.2
reference: Job 27:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַי אֵ֭ל הֵסִ֣יר מִשְׁפָּטִ֑/י וְ֝/שַׁדַּ֗י הֵמַ֥ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: pt
  text: Tão certo como Deus vive[a], ele tirou de mim a justiça, e o Todo-Poderoso amargurou minha vida[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão de juramento; literalmente, “Vive Deus”.
    reason: idiom
  - marker: b
    text: Ou “amargurou minha alma” ou “me amargurou”. O hebraico נֶפֶשׁ pode significar “alma”, “vida” ou a própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: Tão certo como Deus vive
  rationale: A construção חַי seguida do título divino é uma fórmula de juramento. Esta expressão preserva sua força solene em português natural.
- source_word: אֵל
  choice: Deus
  rationale: Aqui, אֵל é o título divino comum dentro da fórmula de juramento, não um nome próprio a ser transliterado.
- source_word: הֵסִיר
  choice: tirou
  rationale: O hifil de סור significa remover ou tirar. A forma direta comunica que, segundo a queixa de Jó, Deus lhe retirou aquilo que lhe era devido.
- source_word: מִשְׁפָּטִי
  choice: de mim a justiça
  rationale: מִשְׁפָּט pode indicar justiça, direito, juízo ou reivindicação legítima. A formulação preserva a amplitude do termo e expressa a alegação de Jó de que lhe foi negado tratamento justo.
- source_word: וְשַׁדַּי
  choice: e o Todo-Poderoso
  rationale: שַׁדַּי é traduzido como título divino, mantendo o paralelismo solene com 'Deus'.
- source_word: הֵמַר
  choice: amargurou
  rationale: O hifil de מרר significa tornar amargo ou amargurar. O verbo português conserva a metáfora e é natural no contexto poético.
- source_word: נַפְשִׁי
  choice: minha vida
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. Neste contexto, 'minha vida' comunica de modo natural a experiência inteira de Jó sem impor um sentido antropológico técnico.
theological_decisions:
- issue: Tradução dos títulos divinos אֵל e שַׁדַּי
  choice: Deus ... o Todo-Poderoso
  alternative: Deus ... Shaddai
  rationale: Traduzir os títulos comunica seu sentido ao leitor e preserva o paralelismo do juramento, sem tratar שַׁדַּי como se necessariamente fosse um nome próprio.
- issue: A acusação de Jó de que Deus retirou seu מִשְׁפָּט
  choice: tirou de mim a justiça
  alternative: tirou de mim o meu direito
  rationale: 'A tradução mantém a tensão explícita da fala de Jó: ele afirma sob juramento que Deus lhe negou justiça. Não se suaviza a acusação nem se determina de forma indevida se o termo significa justiça em geral ou sua reivindicação legítima.'
translation_notes:
  register: Português moderno, solene e acessível, com cadência adequada à poesia e ao juramento. A vírgula final indica que o juramento continua no versículo seguinte.
