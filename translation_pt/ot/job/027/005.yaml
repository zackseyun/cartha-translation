  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: pt
  text: Longe de mim dar razão a vocês[a]! Até morrer, não afastarei de mim a minha integridade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “justificar vocês” ou “declarar que vocês estão certos”. O verbo hebraico tem sentido forense: declarar que alguém está com a razão.'
    reason: lexical_alternative
  - marker: b
    text: Ou “irrepreensibilidade”. O termo hebraico pode indicar integridade moral ou irrepreensibilidade na defesa que Jó faz de si mesmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Longe de mim
  rationale: Expressão portuguesa corrente de forte repúdio, equivalente ao idiomatismo hebraico, sem tornar explícita de modo artificial a noção subjacente de profanação.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: dar razão a vocês
  rationale: 'O hifil de צדק tem aqui sentido forense: reconhecer ou declarar alguém como estando com a razão. A formulação é natural no contexto de uma disputa e evita associações teológicas indevidas que “justificar” poderia despertar.'
- source_word: עַד אֶגְוָע
  choice: Até morrer
  rationale: גוע significa morrer ou expirar. A tradução é direta, solene e natural em português moderno.
- source_word: לֹא אָסִיר
  choice: não afastarei
  rationale: Preserva a imagem concreta do hifil de סור, isto é, fazer algo afastar-se ou ser removido, e combina naturalmente com “de mim”.
- source_word: תֻּמָּתִי
  choice: a minha integridade
  rationale: תֻּמָּה designa inteireza moral, integridade ou irrepreensibilidade. “Integridade” expressa a reivindicação de Jó sem transformá-la numa alegação explícita de impecabilidade absoluta.
- source_word: מִמֶּנִּי
  choice: de mim
  rationale: Reproduz a preposição e o sufixo de primeira pessoa do hebraico; em português, junto de “minha integridade”, mantém com naturalidade a ênfase reflexiva.
theological_decisions:
- issue: Natureza da afirmação de Jó sobre sua condição moral
  choice: a minha integridade
  alternative: a minha irrepreensibilidade; a minha inocência
  rationale: A frase apresenta a recusa de Jó em aceitar a avaliação de seus interlocutores e sua determinação de sustentar sua inteireza moral. “Integridade” preserva essa tensão sem afirmar impecabilidade absoluta nem importar categorias doutrinárias posteriores.
- issue: Sentido forense da resposta aos interlocutores
  choice: dar razão a vocês
  alternative: justificar vocês; declarar vocês justos
  rationale: No contexto do debate, Jó se recusa a reconhecer que seus interlocutores estão certos. A tradução conserva o caráter judicial do verbo, mas usa linguagem acessível e não o restringe a um uso teológico técnico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” corresponde ao plural hebraico e deixa claro que Jó se dirige aos seus interlocutores. A exclamação após a fórmula inicial comunica a força do repúdio. O marcador [b] foi colocado após “integridade”, termo ao qual a nota lexical efetivamente se refere.
