base_translation:
  language: en
  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: pt
  text: De fato, todos vocês já viram isso; por que, então, se tornam tão fúteis?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que, então, agem de modo tão fútil?” O hebraico combina um substantivo e um verbo da mesma raiz, הבל, ligada a vazio, vaidade e futilidade, criando um jogo de palavras difícil de reproduzir plenamente em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição enfática que chama a atenção dos interlocutores; o plural corresponde ao grupo a quem Jó se dirige e é natural no português atual.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: todos vocês
  rationale: Preserva tanto a segunda pessoa do plural quanto a abrangência enfática da expressão.
- source_word: חֲזִיתֶם
  choice: já viram isso
  rationale: O verbo חזה indica ver ou perceber por observação. “Já viram” liga naturalmente essa experiência anterior à pergunta de censura; “isso” explicita em português o objeto implícito pelo contexto.
- source_word: וְלָמָּה
  choice: Então, por que
  rationale: 'Expressa a progressão inferencial: visto que eles próprios observaram a realidade, Jó questiona a conduta deles.'
- source_word: זֶּה
  choice: tanta
  rationale: Entendido como intensificador na construção, e não como simples demonstrativo; “tanta” transmite a força enfática de modo idiomático.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: continuam falando tanta futilidade
  rationale: O substantivo e o verbo cognato da raiz הבל formam um jogo enfático associado a vazio, vaidade ou inutilidade. O contexto imediato favorece a fala inútil dos interlocutores, embora o hebraico possa abranger agir ou tornar-se fútil; a nota preserva essa amplitude.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vejam” evita o arcaísmo de “Eis”; “futilidade” mantém a imagem de vazio sem impor uma interpretação doutrinária. A formulação principal privilegia o contexto de discurso, enquanto a nota registra a ambiguidade lexical genuína.
