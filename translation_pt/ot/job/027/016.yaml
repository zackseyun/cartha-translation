  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: pt
  text: Embora ele amontoe prata como pó e prepare roupas como barro,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ele amontoar prata como pó e preparar vestes como barro”. A partícula hebraica pode ser entendida de modo condicional (“se”) ou concessivo (“embora”); o sentido concessivo se ajusta ao fluxo do argumento.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Embora
  rationale: 'Neste contexto poético, a partícula pode introduzir uma concessão: mesmo que o ímpio acumule riquezas, o versículo seguinte mostra que elas não permanecerão com ele.'
- source_word: יִצְבֹּר
  choice: amontoe
  rationale: Preserva a imagem concreta de ajuntar em grande quantidade, em harmonia com a comparação com o pó.
- source_word: כֶּעָפָר
  choice: como pó
  rationale: Expressa de modo natural a comparação e mantém a imagem hiperbólica de abundância.
- source_word: כָּסֶף
  choice: prata
  rationale: Mantém o sentido concreto do termo hebraico e a força poética, embora prata também pudesse funcionar como dinheiro.
- source_word: וְכַחֹמֶר
  choice: como barro
  rationale: Conserva a imagem de algo comum e abundante; 'argamassa' é possível em certos contextos, mas menos provável aqui.
- source_word: יָכִין
  choice: prepare
  rationale: O hifil de כון tem aqui o sentido de preparar ou deixar pronto.
- source_word: מַלְבּוּשׁ
  choice: roupas
  rationale: Equivalente coletivo claro e corrente em português moderno; 'vestes' seria uma alternativa mais elevada.
theological_decisions:
- issue: Valor concessivo ou condicional de אִם
  choice: Embora
  alternative: Se
  rationale: 'A leitura concessiva se ajusta ao desenvolvimento do argumento: ainda que o ímpio acumule bens, outros acabarão desfrutando deles. A ambiguidade hebraica é preservada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. 'Roupas' evita arcaísmo; 'amontoe', 'prata', 'pó' e 'barro' preservam as imagens concretas da poesia hebraica.
