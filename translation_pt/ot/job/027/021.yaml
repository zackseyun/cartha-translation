  text: יִשָּׂאֵ֣/הוּ קָדִ֣ים וְ/יֵלַ֑ךְ וִֽ֝/ישָׂעֲרֵ֗/הוּ מִ/מְּקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: pt
  text: O vento do leste o leva, e ele se vai; arrebata-o do seu lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “varre-o do seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: o leva embora
  rationale: O verbo נשׂא significa levantar, carregar ou levar. Neste contexto de vento destrutivo, “leva embora” expressa com naturalidade a remoção forçada.
- source_word: קָדִים
  choice: o vento leste
  rationale: קָדִים designa com frequência o vento vindo do leste, associado em poesia hebraica a calor e destruição.
- source_word: וְיֵלַךְ
  choice: e ele se vai
  rationale: Mantém o sentido básico de הלך, “ir”, e comunica o resultado da ação do vento sem tornar a expressão excessivamente explicativa.
- source_word: וִישָׂעֲרֵהוּ
  choice: arrasta-o com violência
  rationale: A forma verbal de סער evoca a ação impetuosa de uma tempestade. A escolha conserva a violência da imagem em português natural, embora “arrebata-o como uma tempestade” reflita mais explicitamente a raiz.
- source_word: מִמְּקֹמוֹ
  choice: para longe do seu lugar
  rationale: מִן indica afastamento e מָקוֹם significa “lugar”. A formulação portuguesa explicita de modo idiomático que ele é removido de onde estava.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Vento leste” tem leitura amplamente compreensível no Brasil e em outras variedades do português; a nota conserva mais diretamente a imagem tempestuosa e a amplitude lexical de סער.
