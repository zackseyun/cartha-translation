    rationale: «Com violência» e «para longe» explicitam aspectos plausíveis da imagem, mas o hebraico diz de modo mais compacto que o vento o arrebata/varre «do seu lugar».
  - severity: low
    issue: «Vento leste» é menos natural que «vento do leste».
    rationale: A forma com «do» é a colocação mais corrente no português moderno para um vento procedente do leste.
  revised_text: O vento do leste o leva, e ele se vai; arrebata-o do seu lugar.[a]
