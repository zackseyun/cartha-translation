  text: תַּשִּׂיגֵ֣/הוּ כַ֭/מַּיִם בַּלָּה֑וֹת לַ֝֗יְלָה גְּנָבַ֥תּ/וּ סוּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: pt
  text: Terrores o alcançam como águas; durante a noite, uma tempestade o leva às escondidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante a noite, um vendaval o arrebata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: o alcançam
  rationale: O hifil de נשׂג, tendo “terrores” como sujeito, descreve calamidades que chegam até ele e o apanham. “O alcançam” conserva com naturalidade a imagem de um desastre que o persegue.
- source_word: כַמַּיִם
  choice: como águas
  rationale: Mantém o plural hebraico e a comparação com águas avassaladoras sem explicitar interpretativamente “inundações”.
- source_word: בַּלָּהוֹת
  choice: terrores
  rationale: O termo designa terrores ou horrores súbitos. “Terrores” é conciso, digno e adequado ao contexto poético.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: O substantivo tem função adverbial. A expressão é natural em português e preserva o cenário noturno.
- source_word: גְּנָבַתּוּ
  choice: o leva às escondidas
  rationale: A forma deriva de גנב, “roubar”. No contexto, a tempestade o arrebata furtivamente; esta formulação preserva a ideia lexical de ação clandestina sem sugerir literalmente que a pessoa seja um objeto roubado.
- source_word: סוּפָה
  choice: uma tempestade
  rationale: סופה indica uma tempestade violenta; “tempestade” é claro e não restringe o sentido a um redemoinho.
