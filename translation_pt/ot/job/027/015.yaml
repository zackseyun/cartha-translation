  text: שריד/ו בַּ/מָּ֣וֶת יִקָּבֵ֑רוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: pt
  text: Os que lhe sobreviverem serão sepultados pela morte[a], e suas viúvas não chorarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão sepultados na morte”. A expressão hebraica é condensada e pode indicar tanto o meio ou destino do sepultamento quanto o sepultamento em meio à morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: os que lhe sobreviverem
  rationale: O substantivo singular com sufixo de terceira pessoa masculina funciona coletivamente, como confirma o verbo no plural; esta formulação exprime com naturalidade os sobreviventes que lhe restarem.
- source_word: בַּמָּוֶת
  choice: pela morte
  rationale: A preposição בְּ com מָוֶת é comprimida e pode indicar meio ou circunstância. “Pela morte” preserva a imagem incisiva da morte como aquilo que determina ou acompanha o sepultamento.
- source_word: יִקָּבֵרוּ
  choice: serão sepultados
  rationale: O nifal de קבר tem sentido passivo, “ser sepultado”; “serão sepultados” é corrente, digno e exato em português.
- source_word: וְאַלְמְנֹתָיו
  choice: e suas viúvas
  rationale: אַלְמָנָה significa “viúva”; o plural com sufixo masculino singular é reproduzido diretamente sem explicar além do que o hebraico afirma.
- source_word: לֹא תִבְכֶּינָה
  choice: não chorarão
  rationale: בכה designa o ato de chorar ou derramar lágrimas. “Não chorarão” mantém a precisão e a simplicidade do original.
