  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: pt
  text: Apego-me à minha justiça[a] e não a deixarei; meu coração não me reprova em nenhum dia da minha vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à minha integridade”. A palavra hebraica geralmente significa “justiça” ou “retidão”, mas, em Jó, pode incluir a ideia de integridade pessoal.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu coração não me censura durante todos os meus dias”. O hebraico também pode ser entendido como uma referência à autorreprovação ao longo da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: à minha justiça
  rationale: צִדְקָה denota normalmente justiça ou retidão. Neste contexto, também se aproxima da ideia de integridade pessoal, mas “justiça” preserva melhor sua força moral e judicial.
- source_word: הֶחֱזַקְתִּי
  choice: Apego-me
  rationale: O hifil de חזק expressa segurar firmemente ou manter-se apegado. O presente comunica em português a postura resoluta de Jó no contexto.
- source_word: וְלֹא אַרְפֶּהָ
  choice: e não a deixarei
  rationale: רפה no hifil significa soltar, deixar cair ou afrouxar. O pronome feminino retoma “minha justiça”; a formulação é natural e mantém essa referência.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: meu coração não me reprova
  rationale: חרף pode significar censurar, insultar ou afrontar. Com “meu coração” como sujeito, descreve autorreprovação interior, sem substituir o idioma hebraico pelo termo interpretativo “consciência”.
- source_word: מִיָּמָי
  choice: por nenhum dos meus dias
  rationale: Com a negação, מן + ימים indica que Jó não se reprova por nenhum dia de sua vida. A expressão explicita em português o alcance distributivo provável, preservando em nota a alternativa temporal.
theological_decisions:
- issue: Se צִדְקָה deve ser traduzida no sentido moral mais forte de “justiça” ou no sentido contextual de “integridade”.
  choice: justiça
  alternative: integridade
  rationale: “Justiça” conserva o valor lexical moral e judicial do substantivo e a força da reivindicação de Jó. “Integridade” é contextualmente plausível, mas pode suavizar sua afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apego-me” mantém a imagem de segurar firmemente sem soar excessivamente técnico; “coração” preserva o idioma antropológico hebraico em vez de interpretá-lo diretamente como “consciência”.
