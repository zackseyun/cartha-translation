  text: my lips will not speak injustice[a], nor will my tongue utter deceit.
translation:
  language: pt
  text: meus lábios não falarão injustiça[a], nem minha língua proferirá engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma construção semelhante a um juramento, com “se” (אִם), para expressar forte negação; literalmente: “se meus lábios falarem injustiça...”, isto é, “certamente meus lábios não falarão injustiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: não
  rationale: Neste contexto de juramento, אִם introduz uma negação enfática elíptica, não uma condição simples. Em português natural, a força resoluta é expressa por “não” com o futuro.
- source_word: תְּדַבֵּרְנָה
  choice: falarão
  rationale: O piel de דבר significa “falar”. O imperfeito tem aqui sentido futuro e resoluto; o plural concorda naturalmente em português com “meus lábios”.
- source_word: שְׂפָתַי
  choice: meus lábios
  rationale: Preserva a imagem corporal e o paralelismo poético, mantendo linguagem natural em português.
- source_word: עַוְלָה
  choice: injustiça
  rationale: Expressa o teor moral de erro e perversidade sem confundi-lo com o “engano” do segundo membro.
- source_word: וּלְשׁוֹנִי
  choice: nem minha língua
  rationale: A conjunção dá continuidade à negação anterior; “nem” reproduz essa relação e preserva o paralelismo com “meus lábios”.
- source_word: יֶהְגֶּה
  choice: proferirá
  rationale: Com “língua” como sujeito e “engano” como objeto, o verbo הגה indica emitir ou enunciar palavras. “Proferirá” é digno, claro e adequado ao paralelismo.
- source_word: רְמִיָּה
  choice: engano
  rationale: O substantivo denota engano, fraude ou traição. “Engano” é amplo, natural e distinto de “injustiça”.
