  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: pt
  text: Ainda que ele a prepare[a], o justo a vestirá[b], e o inocente repartirá a prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele a prepara, mas o justo a vestirá”. O imperfeito hebraico pode ser traduzido sem a nuance concessiva; o contexto do versículo anterior favorece “Ainda que ele a prepare”.'
    reason: lexical_alternative
  - marker: b
    text: 'Os objetos implícitos vêm do versículo anterior: a roupa, em “a vestirá”, e os bens acumulados, representados pela prata.'
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: Ainda que ele a prepare
  rationale: 'O hifil de כון significa “preparar, deixar pronto”. O contexto do versículo anterior dá à construção valor concessivo: embora o ímpio prepare a roupa, outra pessoa a usará. O pronome “a” retoma “roupa” do versículo anterior.'
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo substantivado no singular. “O justo” é natural em português e preserva seu sentido representativo sem acrescentar “homem” ao texto.
- source_word: יִלְבָּשׁ
  choice: a vestirá
  rationale: O qal de לבש significa “vestir, usar como roupa”. O objeto feminino implícito é suprido a partir da roupa mencionada no versículo anterior.
- source_word: כֶסֶף
  choice: a prata
  rationale: כֶּסֶף pode significar prata ou dinheiro. Neste contexto de bens acumulados, “a prata” conserva a imagem concreta do hebraico.
- source_word: נָקִי
  choice: o inocente
  rationale: Adjetivo substantivado que designa quem está livre de culpa ou má conduta, em contraste moral com o ímpio.
- source_word: יַחֲלֹק
  choice: repartirá
  rationale: O qal de חלק significa “dividir, repartir”. “Repartirá” expressa naturalmente a distribuição da prata acumulada.
