base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: pt
  text: O rico se deita, mas não será reunido[a]; abre os olhos, e não está mais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será reunido aos seus antepassados”; de modo mais geral, “não será reunido”. O hebraico é conciso e pode aludir à morte e ao sepultamento sem dizê-lo expressamente.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “e ele não é” ou “e ele não está”; expressão que pode significar que desapareceu ou já não está mais.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: o rico
  rationale: O adjetivo funciona como substantivo e designa uma pessoa rica. “O rico” é conciso, natural em português e não acrescenta um substantivo ausente no hebraico.
- source_word: יִשְׁכַּב
  choice: se deita
  rationale: Preserva o sentido básico de שׁכב e o presente vívido da poesia, sem reduzir a expressão ao ato cotidiano de ir dormir.
- source_word: וְלֹא יֵאָסֵף
  choice: mas não será recolhido
  rationale: Mantém a formulação passiva e lacônica do hebraico. O verbo pode aludir à morte, ao sepultamento ou a ser reunido aos antepassados, mas o complemento não está expresso; por isso, a tradução não o acrescenta ao texto principal.
- source_word: עֵינָיו פָּקַח
  choice: abre os olhos
  rationale: Expressa em ordem natural portuguesa a ação repentina descrita literalmente como “seus olhos abriu”, preservando a vivacidade poética.
- source_word: וְאֵינֶנּוּ
  choice: e já não existe
  rationale: A expressão hebraica significa literalmente “e ele não está/não é” e funciona como idioma para alguém que desapareceu ou deixou de existir. A tradução conserva a brusquidão e a possível referência à morte.
