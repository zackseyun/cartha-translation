  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: pt
  text: Se seus filhos se multiplicarem, serão para a espada; e seus descendentes não terão pão suficiente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não se saciarão de pão”, isto é, não terão alimento suficiente.
    reason: Esclarece o sentido idiomático de שבע com “pão” e registra uma formulação mais literal sem tornar o texto principal artificial.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz de modo direto a condição expressa pela oração hebraica, sem convertê-la em concessão ou afirmação temporal.
- source_word: יִרְבּוּ בָנָיו
  choice: os seus filhos se multiplicarem
  rationale: Preserva tanto o sentido de aumento numérico de רבה quanto o masculino plural explícito de בנים.
- source_word: לְמוֹ חָרֶב
  choice: serão para a espada
  rationale: Mantém a formulação concisa e severa do hebraico, em que a espada representa morte violenta, sem acrescentar agente nem explicitar além do texto como isso ocorrerá.
- source_word: וְצֶאֱצָאָיו
  choice: e os seus descendentes
  rationale: צאצאים abrange a descendência, não somente os filhos imediatos; “descendentes” é claro e atual.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: não terão pão suficiente
  rationale: Expressa naturalmente o idioma hebraico de não ficar saciado de pão, preservando a imagem concreta do pão e o sentido de privação alimentar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “serão para a espada” conserva a concisão e a tensão da expressão hebraica.
