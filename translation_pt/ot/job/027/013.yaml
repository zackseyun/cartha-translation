base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: pt
  text: 'Esta é a porção do homem perverso com Deus[a] e a herança que os violentos recebem[b] do Todo-Poderoso:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da parte de Deus”, no sentido da porção que Deus atribui ao homem perverso.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tomam”. Aqui, “recebem” corresponde ao contexto de uma porção ou herança atribuída.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Esta é
  rationale: O demonstrativo introduz a declaração; em português, acrescenta-se naturalmente a cópula para formar a oração completa.
- source_word: חֵלֶק
  choice: porção
  rationale: Expressa a parte ou o destino atribuído a alguém e mantém o paralelo, sem o confundir, com “herança”.
- source_word: אָדָם רָשָׁע
  choice: homem perverso
  rationale: Preserva o singular genérico e o sentido moral característico da literatura sapiencial; “perverso” é corrente, digno e claro.
- source_word: עִם אֵל
  choice: junto de Deus
  rationale: Conserva a preposição hebraica עִם, literalmente “com/junto de”, e a ambiguidade da relação; o contexto também permite entendê-la como a porção proveniente de Deus.
- source_word: נַחֲלַת
  choice: herança
  rationale: Designa aquilo que cabe a alguém como posse ou quinhão recebido e corresponde ao termo tradicional e natural em português.
- source_word: עָרִיצִים
  choice: os cruéis
  rationale: O termo descreve pessoas implacáveis e opressoras; “cruéis” é natural em português amplo, sem restringir o sentido a governantes tirânicos.
- source_word: מִשַּׁדַּי
  choice: do Todo-Poderoso
  rationale: Traduz o título divino שַׁדַּי por seu equivalente consagrado e inteligível em português.
- source_word: יִקָּחוּ
  choice: recebem
  rationale: Embora o verbo signifique literalmente “tomam”, no contexto de porção e herança ele indica aquilo que lhes cabe ou é concedido; “recebem” comunica esse uso com naturalidade.
theological_decisions:
- issue: Relação expressa por עִם אֵל
  choice: junto de Deus
  alternative: da parte de Deus
  rationale: A redação principal preserva a forma e a tensão do hebraico, enquanto a nota registra a leitura idiomática possível, segundo a qual Deus é a fonte da porção atribuída ao perverso.
- issue: Título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: Trata-se de um título divino, não de uma resolução doutrinária do nome; o equivalente tradicional comunica seu valor ao leitor comum.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre “porção” e “herança”, preserva a ambiguidade de עִם אֵל no texto e evita linguagem denominacional.
