  text: יְהִ֣י כְ֭/רָשָׁע אֹ֣יְבִ֑/י וּ/מִתְקוֹמְמִ֥/י כְ/עַוָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: pt
  text: Seja o meu inimigo como o perverso, e quem se levanta contra mim, como o injusto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o meu inimigo seja como um perverso, e o meu adversário, como um injusto.”'
    reason: Alternativa estilística e lexical que explicita a força volitiva e verte a expressão participial por “meu adversário”.
lexical_decisions:
- source_word: יְהִי
  choice: Seja
  rationale: O jussivo qal de היה expressa desejo ou imprecação; “Seja” preserva de modo conciso e natural essa força volitiva.
- source_word: כְרָשָׁע
  choice: como o perverso
  rationale: A preposição כְּ marca comparação, e רָשָׁע designa uma pessoa moralmente má. “O perverso” mantém a descrição de caráter sem acrescentar especificação de gênero inexistente no sentido pretendido.
- source_word: אֹיְבִי
  choice: o meu inimigo
  rationale: O substantivo אֹיֵב com sufixo de primeira pessoa singular significa diretamente “meu inimigo”.
- source_word: וּמִתְקוֹמְמִי
  choice: e quem se levanta contra mim
  rationale: A forma participial de קום descreve alguém que se põe em oposição ao falante; a tradução conserva essa imagem verbal em português natural.
- source_word: כְעַוָּל
  choice: como o injusto
  rationale: עַוָּל caracteriza quem pratica injustiça ou age de modo errado. “Injusto” preserva o sentido ético e o paralelismo com “perverso”.
theological_decisions:
- issue: Força da declaração contra os opositores de Jó
  choice: 'Manter a forma de desejo ou imprecação: “Seja...”'
  alternative: Entender como simples comparação ou afirmação descritiva
  rationale: A forma jussiva יְהִי apresenta o verso como desejo dirigido ao destino do inimigo, sem explicar ou suavizar a tensão teológica da fala de Jó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi mantida, bem como a imagem de alguém que “se levanta contra” Jó.
