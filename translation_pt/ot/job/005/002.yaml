base_translation:
  language: en
  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: pt
  text: Pois a irritação mata o insensato, e o ciúme[a] faz morrer o ingênuo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a inveja”. O termo hebraico pode indicar ciúme ou inveja; aqui se refere a uma paixão destrutiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Elifaz e mantém a ligação argumentativa com o versículo anterior.
- source_word: לֶאֱוִיל
  choice: o insensato
  rationale: Expressa a insensatez moral e prática de אֱוִיל, sem sugerir mera falta de inteligência.
- source_word: יַהֲרָג
  choice: mata
  rationale: O imperfeito qal tem valor geral ou proverbial; o presente comunica isso de modo direto.
- source_word: כָּעַשׂ
  choice: a irritação
  rationale: O termo pode indicar desgosto, ira, provocação ou agitação interior. “Irritação” preserva aqui a ideia de uma paixão perturbadora e destrutiva sem restringi-la à ira aberta.
- source_word: וּפֹתֶה
  choice: o ingênuo
  rationale: Designa alguém simples, inexperiente e facilmente persuadido; “ingênuo” é claro no português atual e evita a ideia de deficiência intelectual.
- source_word: תָּמִית
  choice: faz morrer
  rationale: Preserva o valor causativo do hifil de מות e a variação verbal do paralelismo hebraico.
- source_word: קִנְאָה
  choice: o ciúme
  rationale: No paralelismo, refere-se a uma paixão destrutiva. “Ciúme” é uma leitura natural, enquanto “inveja” continua sendo uma alternativa lexical legítima, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com tom digno. O paralelismo hebraico foi preservado, assim como a distinção entre “mata” e a forma causativa “faz morrer”.
