  text: הִנֵּה זֹ֭את חֲקַרְנ֥וּ/הָ כֶּֽן הִ֑יא שְׁ֝מָעֶ֗/נָּה וְ/אַתָּ֥ה דַֽע לָֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: pt
  text: Veja, foi isso que investigamos, e assim é. Escute e saiba disso por si mesmo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz com ênfase a conclusão de Elifaz; “Veja” é natural e mantém a força de chamada de atenção.
- source_word: חֲקַרְנוּהָ
  choice: foi isso que investigamos
  rationale: Expressa a investigação cuidadosa indicada pelo verbo חקר e retoma o conteúdo anterior com “isso”.
- source_word: כֶּן הִיא
  choice: assim é
  rationale: Preserva a afirmação enfática de que a conclusão corresponde ao que foi apurado.
- source_word: שְׁמָעֶנָּה
  choice: Escute
  rationale: Mantém o imperativo singular e, no contexto sapiencial, comunica ouvir com atenção e acolher o ensino.
- source_word: וְאַתָּה דַע לָךְ
  choice: e saiba disso por si mesmo
  rationale: Conserva a ênfase explícita em “você” por meio do imperativo dirigido ao ouvinte e traduz לָךְ idiomaticamente como apropriação e verificação pessoal.
theological_decisions:
- issue: Estatuto da afirmação de Elifaz
  choice: Manter a declaração categórica “assim é” como fala da personagem
  alternative: Atenuar para “parece ser assim”
  rationale: O hebraico apresenta certeza, não hesitação. A tradução não deve validar nem corrigir teologicamente Elifaz, mas representar fielmente sua afirmação.
- issue: Ênfase em וְאַתָּה
  choice: Representar a interpelação pessoal por “saiba disso por si mesmo”
  alternative: Omitir a ênfase e traduzir apenas “saiba disso”
  rationale: O pronome explícito contrasta a investigação coletiva (“investigamos”) com a responsabilidade pessoal de Jó.
translation_notes:
  register: 'Português moderno, digno e acessível, com tratamento verbal no singular por meio de “escute” e “saiba”. A ordem foi levemente ajustada para fluência sem eliminar a progressão: investigação, certeza, audição e conhecimento pessoal.'
