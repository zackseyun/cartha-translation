  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: pt
  text: Seus filhos estão longe da segurança[a]; são esmagados à porta da cidade[b], e não há quem os livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “longe do livramento”, “longe da salvação” ou “longe do socorro”.
    reason: lexical_alternative
  - marker: b
    text: A porta da cidade era o lugar habitual de julgamentos legais e decisões públicas.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: ficam longe
  rationale: O verbo רחק indica distância ou afastamento. Aqui descreve a condição dos filhos em relação à segurança ou ao livramento; “ficam longe” é natural e mantém o valor do hebraico.
- source_word: בָנָיו
  choice: seus filhos
  rationale: בנים pode designar filhos do sexo masculino ou, de modo mais amplo, descendentes. “Filhos” é a forma portuguesa mais direta e não exige uma especificação ausente do contexto.
- source_word: מִיֶּשַׁע
  choice: da segurança
  rationale: יֶשַׁע pode significar segurança, socorro, livramento ou salvação. Neste contexto sapiencial, “segurança” expressa a situação concreta de proteção, enquanto a nota preserva as alternativas lexicais.
- source_word: וְיִדַּכְּאוּ
  choice: são esmagados
  rationale: דכא transmite a ideia forte de esmagar, quebrantar ou oprimir. “São esmagados” preserva a voz passiva e a intensidade da expressão.
- source_word: בַשַּׁעַר
  choice: junto à porta da cidade
  rationale: שַׁעַר é literalmente o portão ou a porta, mas no antigo contexto urbano esse local servia para julgamentos e decisões públicas. A explicitação “da cidade” evita que o leitor imagine uma porta doméstica, e a nota esclarece sua função social.
- source_word: וְאֵין מַצִּיל
  choice: e não há quem os livre
  rationale: A construção combina אֵין, indicando inexistência, com o particípio de נצל, “livrar, resgatar”. A formulação portuguesa é idiomática e conserva a ausência total de um libertador.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo e a força da cena hebraica. Os marcadores foram associados ao termo que efetivamente explicam: [a] a “segurança” e [b] a “porta da cidade”.'
