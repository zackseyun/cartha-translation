id: JOB.5.13
reference: Job 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹכֵ֣ד חֲכָמִ֣ים בְּ/עָרְמָ֑/ם וַ/עֲצַ֖ת נִפְתָּלִ֣ים נִמְהָֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: pt
  text: Ele apanha os sábios na própria astúcia[a], e o conselho dos tortuosos[b] é levado às pressas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por sua própria esperteza” ou “em sua astúcia”. O termo hebraico pode indicar prudência em outros contextos, mas aqui tem sentido negativo.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos perversos” ou “dos sinuosos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “é apressado” ou “é arrastado depressa”. A ideia contextual é que o conselho avança precipitadamente para o fracasso.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: apanha
  rationale: O particípio qal de לכד tem força verbal e retrata Deus prendendo os sábios na armadilha dos próprios ardis. “Apanha” é natural e conserva essa imagem.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O adjetivo plural substantivado designa os que são considerados sábios e preserva a ironia de serem eles mesmos apanhados.
- source_word: בְּעָרְמָם
  choice: na própria astúcia
  rationale: עָרְמָה pode indicar prudência, mas o paralelismo aqui lhe confere sentido negativo. “Na própria” expressa de modo idiomático o sufixo possessivo e o meio ou âmbito em que são apanhados.
- source_word: וַעֲצַת
  choice: e o conselho
  rationale: עֵצָה pode significar conselho ou plano. “Conselho” mantém o vocabulário sapiencial e a forma nominal da oração hebraica.
- source_word: נִפְתָּלִים
  choice: dos tortuosos
  rationale: A forma derivada de פתל comunica algo torcido e, figuradamente, caráter moralmente sinuoso. “Tortuosos” preserva a metáfora e o valor ético.
- source_word: נִמְהָרָה
  choice: é levado às pressas
  rationale: O nifal perfeito feminino singular concorda com “conselho” e indica que ele é apressado ou arrastado rapidamente. A formulação conserva a passividade sem explicitar no texto o resultado de fracasso.
theological_decisions:
- issue: Sujeito implícito do particípio לֹכֵד
  choice: “Ele”, referindo-se a Deus no contexto
  alternative: Uma construção impessoal, como “quem apanha”
  rationale: Embora o versículo não repita o sujeito, Jó 5:9-16 descreve as ações de Deus. O pronome retoma esse referente contextual sem acrescentar uma identificação estranha ao discurso.
- issue: Valor moral de עָרְמָה e נִפְתָּלִים
  choice: 'Sentido negativo: “astúcia” e “tortuosos”'
  alternative: Termos mais neutros, como “prudência” e “complexos”
  rationale: O paralelismo apresenta esquemas que Deus frustra; por isso, ambos os termos têm aqui força moral negativa. A tradução mantém essa caracterização sem intensificá-la além do hebraico.
- issue: Resultado expresso por נִמְהָרָה
  choice: Manter a imagem de movimento apressado sem declarar explicitamente o fracasso
  alternative: “é rapidamente frustrado” ou “chega depressa ao fim”
  rationale: O contexto sugere o colapso precipitado do conselho, mas o verbo propriamente enfatiza a pressa. A tradução preserva essa tensão em vez de converter a implicação contextual em afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua ocorrência no texto. A formulação mantém o paralelismo sapiencial, a metáfora de captura e a passividade da segunda oração.
