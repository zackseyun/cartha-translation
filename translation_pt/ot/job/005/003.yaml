  text: אֲֽנִי רָ֭אִיתִי אֱוִ֣יל מַשְׁרִ֑ישׁ וָ/אֶקּ֖וֹב נָוֵ֣/הוּ פִתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: pt
  text: Eu vi um insensato criando raízes e, de repente, amaldiçoei sua morada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declarei amaldiçoada a sua morada” ou “declarei que sua morada estava condenada”. O verbo hebraico pode indicar tanto uma maldição direta quanto um pronunciamento de juízo baseado no que foi observado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome explícito dá ênfase ao testemunho pessoal do falante; “eu mesmo” torna essa ênfase perceptível em português natural.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico relata uma experiência observada. O pretérito perfeito é a forma mais natural em português neste testemunho.
- source_word: אֱוִיל
  choice: um insensato
  rationale: Preserva a categoria moral e sapiencial do termo, sem reduzi-lo a falta de inteligência.
- source_word: מַשְׁרִישׁ
  choice: criando raízes
  rationale: Mantém a metáfora do particípio causativo de lançar raízes e tornar-se estabelecido.
- source_word: וָאֶקּוֹב
  choice: amaldiçoei
  rationale: Traduz diretamente o sentido lexical mais forte de pronunciar uma maldição, sem presumir eficácia mágica.
- source_word: נָוֵהוּ
  choice: sua morada
  rationale: Expressão digna e abrangente para o lugar de habitação, sem especificar além do hebraico.
- source_word: פִתְאֹם
  choice: de repente
  rationale: Reproduz a noção de súbito e, na ordem da frase hebraica, liga-se naturalmente ao pronunciamento seguinte.
theological_decisions:
- issue: Sentido da reação do falante em וָאֶקּוֹב
  choice: Elifaz afirma que amaldiçoou a morada do insensato.
  alternative: Elifaz declarou que a morada estava amaldiçoada ou condenada.
  rationale: O sentido lexical direto favorece o ato de amaldiçoar, mas o contexto sapiencial também permite entender a expressão como um pronunciamento observacional de juízo; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Insensato” conserva o sentido sapiencial; “criando raízes” mantém a imagem concreta. A conjunção “e” reflete o encadeamento hebraico sem introduzir contraste ausente no texto.
