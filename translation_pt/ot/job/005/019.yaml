base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: pt
  text: Em seis aflições ele livrará você[a]; e, em sete, mal algum tocará em você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão poética hebraica “em seis ... e em sete” indica livramento repetido ou completo, não necessariamente um limite literal de exatamente sete aflições.
    reason: cultural_note
  - marker: b
    text: Ou “dano algum atingirá você” ou “calamidade alguma alcançará você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: Em seis
  rationale: A preposição ב com o numeral introduz as circunstâncias contadas; “em seis” preserva de modo natural a forma do paralelismo numérico.
- source_word: צָרוֹת
  choice: aflições
  rationale: צָרוֹת abrange situações de angústia, adversidade ou tribulação. “Aflições” é corrente, digna e ampla, sem restringir o sentido ao sofrimento físico.
- source_word: יַצִּילֶךָּ
  choice: ele livrará você
  rationale: O hifil de נצל significa livrar ou resgatar de perigo. “Livrará” conserva o registro poético e a referência implícita a Deus, sem inserir seu nome no versículo.
- source_word: וּבְשֶׁבַע
  choice: até na sétima
  rationale: A fórmula crescente “seis... sete” expressa intensificação e abrangência. “Até na sétima” soa natural em português e mantém os números e o movimento culminante do hebraico.
- source_word: לֹא יִגַּע בְּךָ
  choice: não tocará em você
  rationale: נגע com ב pode significar tocar, atingir ou alcançar alguém. A formulação mantém a imagem hebraica e é idiomática em português.
- source_word: רָע
  choice: mal algum
  rationale: רָע pode indicar mal, dano ou calamidade. “Mal algum” preserva sua amplitude sem decidir entre mal moral e acontecimento nocivo, embora o contexto favoreça dano ou calamidade.
theological_decisions:
- issue: Referente do sujeito implícito em “ele livrará você”
  choice: Manter “ele”, com inicial minúscula, sem substituir por “Deus”.
  alternative: “Deus livrará você”
  rationale: O contexto identifica o referente como Deus, mas o hebraico apresenta apenas um verbo na terceira pessoa do singular. A tradução conserva essa forma e evita acrescentar um nome ausente do versículo.
- issue: Sentido da fórmula numérica “seis... sete”
  choice: Conservar os números e indicar a progressão com “até na sétima”.
  alternative: Interpretar como contagem estritamente literal ou parafrasear como “em todas as aflições”.
  rationale: O paralelismo numérico hebraico comunica repetição, intensificação ou totalidade, sem exigir um limite literal de sete. Preservar a fórmula mantém a força poética e sua tensão.
- issue: Alcance de רָע
  choice: Traduzir de forma ampla como “mal algum”.
  alternative: “dano algum” ou “calamidade alguma”
  rationale: No contexto, o termo provavelmente aponta para dano ou calamidade, mas “mal” mantém a amplitude lexical do hebraico sem impor uma distinção teológica que o verso não explicita.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto conserva o paralelismo numérico e a imagem de “tocar”, com dicção poética digna e acessível.
