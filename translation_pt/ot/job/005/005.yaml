base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: pt
  text: Os famintos comem a colheita dele e a tiram até do meio dos espinhos; os sedentos ofegam pelas riquezas deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e uma armadilha devora as riquezas deles”. O hebraico da oração final é difícil; o texto principal segue a leitura comum que põe “os sedentos” em paralelo com “os famintos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: a colheita dele
  rationale: קָצִיר designa a colheita ou o produto colhido; a formulação conserva o sufixo possessivo masculino singular.
- source_word: רָעֵב
  choice: os famintos
  rationale: O adjetivo substantivado indica quem tem fome. O plural genérico é natural em português e corresponde ao paralelismo com “os sedentos”.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: e a tiram até do meio dos espinhos
  rationale: A expressão difícil retrata a retirada da colheita apesar dos espinhos ou de dentro deles; “até do meio” preserva a ênfase sem definir se eram uma cerca protetora.
- source_word: צִנִּים
  choice: espinhos
  rationale: O sentido comum se ajusta à imagem agrícola e evita especificar indevidamente arbustos ou ganchos.
- source_word: וְשָׁאַף
  choice: anseiam por
  rationale: שָׁאַף pode expressar ofegar ou desejar avidamente. “Anseiam por” comunica o desejo intenso de modo natural, mantendo a imagem implícita.
- source_word: צַמִּים
  choice: os sedentos
  rationale: Esta leitura do texto consonantal cria paralelismo com “os famintos”; a possível leitura ligada a armadilha é registrada em nota.
- source_word: חֵילָם
  choice: as riquezas deles
  rationale: חַיִל pode indicar bens, recursos ou riqueza. O plural “riquezas” é idiomático e o pronome conserva o sufixo plural do hebraico.
theological_decisions: []
translation_notes:
