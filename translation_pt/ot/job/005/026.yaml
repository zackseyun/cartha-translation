  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: pt
  text: Você chegará à sepultura em plena maturidade[a], como se recolhe um monte de cereal no tempo certo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em idade madura”, “em idade avançada” ou “em pleno vigor”. O termo hebraico é raro e seu sentido é discutido; pode indicar maturidade, vigor pleno ou idade avançada.
    reason: lexical_alternative
  - marker: b
    text: A construção hebraica é poética e difícil, podendo significar “como um monte de cereal é levado ou recolhido em seu tempo”. A imagem compara a morte no momento apropriado ao cereal colhido e juntado quando está pronto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: você chegará
  rationale: O qal imperfeito de בוא tem sentido futuro no contexto. “Chegará” expressa naturalmente o movimento até a sepultura e evita a possível estranheza de “virá à sepultura” em português.
- source_word: בְכֶלַח
  choice: em plena maturidade
  rationale: כֶּלַח é raro e seu sentido é discutido, podendo apontar para idade madura, vigor ou pleno desenvolvimento. “Em plena maturidade” conserva a amplitude sem limitar a expressão apenas à velhice nem afirmar vigor físico no momento da morte.
- source_word: אֱלֵי קָבֶר
  choice: à sepultura
  rationale: A preposição é direcional, e קבר designa normalmente a sepultura ou lugar de enterro. A contração “à” produz uma formulação portuguesa natural.
- source_word: כַּעֲלוֹת
  choice: como ... recolhido
  rationale: Na comparação agrícola, o infinitivo de עלה sugere o cereal sendo levado ou juntado após a colheita. “Recolhido” explicita de modo natural a ação implícita sem perder a imagem.
- source_word: גָּדִישׁ
  choice: um monte de cereal
  rationale: גָּדִישׁ designa mais propriamente um monte ou uma pilha de cereal cortado, não necessariamente um único feixe. A escolha preserva a imagem agrícola concreta.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: A expressão significa “em seu tempo” ou “no momento apropriado”. “No tempo certo” comunica a oportunidade adequada e mantém a ligação com a colheita.
