id: JOB.5.17
reference: Job 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֤ה אַשְׁרֵ֣י אֱ֭נוֹשׁ יוֹכִחֶ֣/נּֽוּ אֱל֑וֹהַּ וּ/מוּסַ֥ר שַׁ֝דַּ֗י אַל תִּמְאָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: pt
  text: Eis que feliz é o ser humano a quem Deus corrige[a]; portanto, não despreze a disciplina do Todo-Poderoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “repreende” ou “censura”. O verbo hebraico indica uma repreensão que visa corrigir.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Shaddai”, título divino tradicionalmente traduzido por “o Todo-Poderoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força discursiva que chama a atenção para uma afirmação importante, em registro bíblico digno e ainda compreensível.
- source_word: אַשְׁרֵי
  choice: feliz é
  rationale: Reproduz a fórmula hebraica de bem-aventurança, indicando uma condição favorável e digna de ser desejada, não apenas uma emoção passageira.
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: O substantivo designa aqui uma pessoa humana ou mortal em sentido genérico; esta formulação comunica naturalmente essa abrangência em português.
- source_word: יוֹכִחֶנּוּ
  choice: a quem Deus corrige
  rationale: O hifil de יכח expressa repreensão corretiva. “Corrige” preserva tanto a censura quanto sua finalidade formativa e se liga naturalmente a “disciplina”.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Equivalente português normal do título divino empregado no livro de Jó.
- source_word: מוּסַר
  choice: disciplina
  rationale: No vocabulário sapiencial, o termo abrange correção e formação; “disciplina” conserva melhor essas duas dimensões.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução portuguesa tradicional e semanticamente significativa do título divino Shaddai.
- source_word: אַל תִּמְאָס
  choice: não despreze
  rationale: Expressa a ordem de não tratar a disciplina com desdém nem rejeitá-la como indigna.
theological_decisions:
- issue: Sentido genérico de אֱנוֹשׁ
  choice: o ser humano
  alternative: o homem; o mortal; a pessoa
  rationale: O provérbio se refere genericamente a um mortal. “O ser humano” mantém esse valor sem restringir a aplicação a homens, embora o hebraico esteja no singular gramaticalmente masculino.
- issue: Relação entre a correção divina e מוּסַר
  choice: corrige ... disciplina
  alternative: repreende ... correção; censura ... instrução
  rationale: 'A redação conserva a tensão teológica do versículo: uma intervenção divina possivelmente dolorosa é apresentada como condição feliz e como disciplina que não deve ser desprezada, sem defini-la como mera punição.'
- issue: Valor lógico da justaposição entre as duas orações
  choice: portanto
  alternative: e; por isso
  rationale: 'O hebraico emprega וּ, que pode funcionar contextualmente como ligação consequencial. “Portanto” explicita a inferência natural: por ser feliz quem recebe a correção de Deus, não se deve desprezar sua disciplina.'
translation_notes:
  register: Português moderno, claro e digno, com leve elevação sapiencial. “Eis que” conserva a ênfase introdutória; “feliz é” soa mais corrente do que “bem-aventurado”, sem reduzir a fórmula a mero estado emocional. A sintaxe proverbial foi mantida de forma natural para leitores brasileiros e amplamente compreensível no espaço lusófono.
