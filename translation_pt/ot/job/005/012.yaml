  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: pt
  text: Ele frustra os planos dos astutos, de modo que as mãos deles não alcançam êxito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: frustra
  rationale: O particípio descreve Deus como aquele que desfaz ou impede a realização dos planos; “frustra” comunica naturalmente esse efeito.
- source_word: מַחְשְׁבוֹת
  choice: planos
  rationale: No contexto, refere-se a desígnios ou projetos deliberados, não apenas a pensamentos interiores.
- source_word: עֲרוּמִים
  choice: astutos
  rationale: Preserva a ideia de pessoas sagazes ou ardilosas sem acrescentar uma qualificação mais específica do que o hebraico.
- source_word: יְדֵיהֶם
  choice: as mãos deles
  rationale: Mantém a imagem concreta hebraica das mãos como agentes da execução dos planos.
- source_word: תּוּשִׁיָּה
  choice: êxito
  rationale: O termo pode indicar eficácia, resultado sólido, capacidade prática ou sucesso; aqui, em paralelo com planos impedidos e mãos incapazes de realizá-los, “êxito” expressa adequadamente o sentido contextual.
theological_decisions:
- issue: Agência divina na derrota dos astutos
  choice: Ele frustra
  alternative: Seus planos são frustrados
  rationale: A forma ativa do hebraico atribui diretamente a ação ao referente divino do contexto; a tradução conserva essa agência sem ampliá-la.
- issue: Sentido contextual de תּוּשִׁיָּה
  choice: não alcançam êxito
  alternative: não realizam nada sólido
  rationale: “Êxito” se ajusta ao contexto de planos que não chegam à execução, embora o termo hebraico tenha uma faixa semântica mais ampla. A construção evita transformar o verso numa afirmação absoluta de que as mãos nada fazem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A formulação preserva a metáfora das mãos e a estrutura causal do hebraico.
