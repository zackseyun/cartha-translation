  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: pt
  text: 'Chame, agora: há alguém que lhe responda? E a quem, dentre os seres santos, você recorrerá?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santos”. Aqui, o hebraico provavelmente se refere a seres celestiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא נָא
  choice: Chame agora
  rationale: O imperativo קְרָא lança um desafio, e נָא acrescenta urgência. “Chame agora” conserva a concisão e o tom disputativo sem intensificar indevidamente a emoção.
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: haverá quem lhe responda?
  rationale: A construção existencial interrogativa é retórica; o particípio com sufixo significa literalmente “alguém que lhe responda”. O futuro em português expressa naturalmente a expectativa implícita no desafio.
- source_word: וְאֶל־מִי מִקְּדֹשִׁים
  choice: E a qual dos santos
  rationale: 'A preposição מן tem sentido partitivo: “qual dentre os santos”. “Santos” reproduz o substantivo plural קדֹשים sem definir no texto principal se são seres celestiais ou humanos; a provável referência celestial é esclarecida em nota.'
- source_word: תִּפְנֶה
  choice: você recorrerá
  rationale: פנה significa literalmente “voltar-se”, mas, neste contexto, indica dirigir-se a alguém em busca de resposta ou auxílio. “Recorrerá” torna essa função clara em português natural.
theological_decisions:
- issue: Identidade dos קְדֹשִׁים (“santos”)
  choice: Manter “santos” no texto e indicar em nota a provável referência a seres celestiais
  alternative: “seres santos” ou “seres celestiais”
  rationale: O contexto de Jó favorece membros santos da corte celestial, mas o termo hebraico não explicita aqui a identidade deles. A tradução preserva essa abertura e evita introduzir associações confessionais específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” comunica diretamente a segunda pessoa singular; o travessão preserva a pausa enfática. A formulação mantém o caráter de desafio retórico da fala de Elifaz.
