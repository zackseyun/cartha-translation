base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: pt
  text: Você rirá da devastação e da fome e não terá medo dos animais selvagens da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não tenha medo dos animais selvagens da terra”. A forma hebraica pode ser entendida como uma proibição, embora neste contexto provavelmente expresse uma promessa de segurança.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: devastação
  rationale: O substantivo indica destruição violenta, ruína ou devastação. “Devastação” expressa com naturalidade uma calamidade ampla e mantém o paralelismo com “fome”.
- source_word: כָפָן
  choice: fome
  rationale: O termo designa fome severa ou uma situação de escassez. “Fome” é claro em português e funciona como categoria de calamidade ao lado de “devastação”.
- source_word: תִּשְׂחָק
  choice: você rirá
  rationale: O verbo שׂחק significa rir e, neste contexto, comunica confiança destemida diante das calamidades. A tradução preserva a imagem poética sem explicitar indevidamente escárnio ou triunfo.
- source_word: חַיַּת הָאָרֶץ
  choice: animais selvagens da terra
  rationale: חַיָּה pode indicar um animal, especialmente um animal selvagem. Esta formulação é clara para leitores modernos e preserva tanto a referência à vida selvagem quanto o complemento “da terra”.
- source_word: אַל תִּירָא
  choice: não terá medo
  rationale: Embora אַל com o imperfeito normalmente possa expressar uma proibição, a sequência de garantias neste discurso favorece aqui uma afirmação de segurança futura. A ambiguidade gramatical é preservada em nota.
theological_decisions:
- issue: Força de אַל תִּירָא no contexto
  choice: garantia futura (“não terá medo”)
  alternative: proibição ou exortação (“não tenha medo”)
  rationale: O versículo integra uma série de proteções apresentadas como futuras e faz paralelo com “você rirá”. A garantia futura corresponde melhor ao fluxo do discurso, enquanto a nota conserva a leitura proibitiva genuinamente possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna explícito o sujeito singular sem recorrer ao registro mais arcaico de “tu rirás”. O paralelismo poético e a metáfora de rir diante das calamidades foram mantidos.
