  text: לָ/שׂ֣וּם שְׁפָלִ֣ים לְ/מָר֑וֹם וְ֝/קֹדְרִ֗ים שָׂ֣גְבוּ יֶֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: pt
  text: 'para colocar os abatidos em lugar elevado,

    e os que estão de luto[a] são erguidos à salvação[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estão sombrios” ou “os enlutados”; o particípio hebraico evoca a tristeza por meio da imagem da escuridão.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao livramento” ou “à segurança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: para colocar
  rationale: O infinitivo construto de שׂוּם expressa propósito ou resultado em ligação com o contexto anterior. “Para colocar” mantém essa relação e o sentido verbal sem acrescentar interpretação.
- source_word: שְׁפָלִים
  choice: os abatidos
  rationale: O adjetivo designa pessoas em condição baixa, humilhadas ou rebaixadas. “Os abatidos” preserva a dimensão existencial e social sem restringir o termo à virtude moral da humildade.
- source_word: לְמָרוֹם
  choice: em lugar elevado
  rationale: מָרוֹם indica altura ou lugar alto. A expressão conserva a imagem espacial e o contraste deliberado com os que estão em condição baixa.
- source_word: וְקֹדְרִים
  choice: os que estão de luto
  rationale: O particípio de קדר pode descrever quem está escurecido, sombrio ou de luto. A escolha comunica naturalmente a aflição humana no contexto, enquanto a nota preserva a imagem de escuridão.
- source_word: שָׂגְבוּ
  choice: são erguidos
  rationale: O verbo comunica elevação, exaltação ou colocação em posição alta e segura. “São erguidos” mantém o paralelismo com o primeiro verso e reproduz o valor resultativo sem explicá-lo em excesso.
- source_word: יֶשַׁע
  choice: à salvação
  rationale: יֶשַׁע abrange salvação, livramento e segurança. “Salvação” retém a amplitude lexical e a ressonância teológica, sem excluir o sentido concreto de socorro neste contexto sapiencial.
theological_decisions:
- issue: Sentido de יֶשַׁע em contexto sapiencial
  choice: salvação
  alternative: livramento; segurança
  rationale: O substantivo hebraico pode indicar resgate, livramento ou condição segura. “Salvação” preserva essa amplitude e seu peso teológico, mas não impõe ao versículo um desenvolvimento doutrinário posterior; as alternativas contextuais são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém a estrutura de propósito ligada ao contexto anterior, o paralelismo de elevação e a tensão entre a imagem espacial e o sentido de resgate.
