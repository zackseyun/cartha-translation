  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: pt
  text: De dia, eles encontram trevas e, ao meio-dia, tateiam como de noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹמָם
  choice: De dia
  rationale: Expressa naturalmente o acusativo adverbial temporal e mantém o contraste com “de noite”.
- source_word: יְפַגְּשׁוּ
  choice: eles encontram
  rationale: Traduz diretamente a ideia de deparar-se com algo, preservando a imagem inesperada de encontrar trevas durante o dia.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Equivalente corrente e digno que conserva tanto a imagem concreta quanto sua possível força metafórica no contexto sapiencial.
- source_word: וְכַלַּיְלָה
  choice: como de noite
  rationale: O prefixo comparativo כְּ é explicitado por “como”; “de noite” é idiomático em português e mantém a comparação sem acrescentar interpretação.
- source_word: יְמַשְׁשׁוּ
  choice: tateiam
  rationale: Verbo preciso para procurar o caminho pelo tato, especialmente na escuridão, preservando a imagem hebraica.
- source_word: בַצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Designa especificamente o meio-dia e ressalta o paradoxo de tatearem no momento de maior claridade.
