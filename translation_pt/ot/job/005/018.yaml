base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: pt
  text: Pois é ele quem causa dor, mas enfaixa; ele esmaga, mas suas mãos curam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma escrita em hebraico traz “sua mão”, mas o verbo está no plural, “curam”. O texto traduz “suas mãos” para refletir o sentido e a concordância do verbo.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando a força causal e discursiva do hebraico.
- source_word: הוּא
  choice: é ele quem
  rationale: Expressa com naturalidade em português a ênfase do pronome independente hebraico.
- source_word: יַכְאִיב
  choice: causa dor
  rationale: Reproduz diretamente o sentido causativo do Hifil de כאב, sem substituir a ideia geral de dor pela imagem mais específica de uma ferida.
- source_word: וְיֶחְבָּשׁ
  choice: mas trata a ferida
  rationale: חבש descreve o ato de enfaixar ou cuidar de uma lesão. A formulação torna explícito o objeto implícito e comunica naturalmente a imagem de tratamento em português; a conjunção é adversativa por causa do contraste poético.
- source_word: יִמְחַץ
  choice: ele esmaga
  rationale: Preserva a força intensa de מחץ e o contraste com a cura no membro seguinte.
- source_word: וְיָדוֹ
  choice: mas suas mãos
  rationale: O substantivo hebraico está no singular, mas o verbo seguinte está no plural feminino. O texto principal adota o sujeito plural idiomático, sem ocultar a discordância textual, que é indicada na nota.
- source_word: תִּרְפֶּינָה
  choice: curam
  rationale: רפא significa diretamente curar; o plural do verbo massorético é refletido na forma portuguesa.
theological_decisions:
- issue: A ação divina tanto na dor quanto na restauração
  choice: Atribuir diretamente a Deus tanto o ato de causar dor e esmagar quanto o de tratar e curar.
  alternative: 'Atenuar a primeira ação como mera permissão divina, por exemplo: “ele permite a dor”.'
  rationale: O hebraico apresenta Deus explicitamente como sujeito das duas ações. A tradução conserva essa tensão teológica em vez de resolvê-la ou suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “É ele quem” conserva a ênfase do pronome hebraico; “trata a ferida” comunica de modo natural a imagem de enfaixar uma lesão. O paralelismo e o contraste entre aflição e cura foram mantidos.
