base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: pt
  text: Assim, há esperança para o pobre, e a injustiça fecha a boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a perversidade fecha a boca”; mais literalmente, “sua boca se fecha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Assim, há
  rationale: O wayyiqtol de היה apresenta o resultado da descrição anterior. “Assim” explicita a ligação discursiva, e o presente comunica naturalmente a força proverbial do enunciado.
- source_word: לַדַּל
  choice: para o pobre
  rationale: דַּל pode designar quem é pobre, fraco ou socialmente vulnerável. “O pobre” é claro e idiomático, sem excluir a ideia de fragilidade e falta de poder.
- source_word: תִּקְוָה
  choice: esperança
  rationale: תִּקְוָה significa “esperança” ou “expectativa”; “esperança” expressa bem o contraste com o silenciamento da injustiça.
- source_word: וְעֹלָתָה
  choice: e a injustiça
  rationale: עַוְלָה denota injustiça, perversidade ou prática errada. “Injustiça” se ajusta ao contexto social e preserva a personificação retomada pelo possessivo em “a boca”.
- source_word: קָפְצָה פִּיהָ
  choice: fecha a boca
  rationale: A expressão significa literalmente que “sua boca se fechou/fecha”. A tradução conserva a imagem hebraica de a injustiça ser silenciada e permanece natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção proverbial no presente. A imagem concreta do hebraico foi preservada em vez de ser substituída por uma paráfrase como “é silenciada”.
