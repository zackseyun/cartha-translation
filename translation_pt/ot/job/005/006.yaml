  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: pt
  text: Pois a aflição não sai do pó[a], nem o sofrimento brota da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois a iniquidade não sai do pó, nem a miséria brota da terra”. Os termos hebraicos também podem ter sentidos morais ou relacionados à calamidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao argumento anterior e preserva com naturalidade a relação lógica.
- source_word: יֵצֵא
  choice: não sai
  rationale: Mantém o sentido básico de יצא, “sair”, descrevendo a origem ou emergência negada.
- source_word: מֵעָפָר
  choice: do pó
  rationale: עָפָר designa “pó”; a forma definida é natural em português e conserva a imagem da matéria terrestre.
- source_word: אָוֶן
  choice: aflição
  rationale: No contexto de Jó, pode indicar desgraça, sofrimento ou maldade. “Aflição” se ajusta ao tema do sofrimento sem restringir o termo ao mal moral.
- source_word: וּמֵאֲדָמָה
  choice: nem ... da terra
  rationale: אֲדָמָה é o solo ou chão; “terra” é claro, corrente e apropriado à imagem agrícola.
- source_word: יִצְמַח
  choice: brota
  rationale: Preserva a metáfora vegetal de צמח e combina naturalmente com “terra”.
- source_word: עָמָל
  choice: sofrimento
  rationale: עָמָל pode indicar trabalho penoso, fadiga, miséria ou sofrimento. Aqui “sofrimento” mantém o paralelismo com אָוֶן e evita sugerir apenas trabalho produtivo.
theological_decisions:
- issue: Força semântica de אָוֶן e עָמָל na declaração de Elifaz
  choice: O versículo fala de aflição e sofrimento que não surgem espontaneamente da terra.
  alternative: Os termos podem referir-se à iniquidade e à desgraça, ou ao trabalho penoso e à miséria.
  rationale: A formulação preserva a imagem agrícola e o argumento de Elifaz sem transformar sua observação em uma afirmação doutrinária mais forte sobre culpa moral ou causalidade do sofrimento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção poética conserva o paralelismo entre “pó” e “terra” e entre “sai” e “brota”.
