  text: אוּלָ֗ם אֲ֭נִי אֶדְרֹ֣שׁ אֶל אֵ֑ל וְ/אֶל אֱ֝לֹהִ֗ים אָשִׂ֥ים דִּבְרָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: pt
  text: Mas eu buscaria a Deus e apresentaria a Deus a minha causa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Mas eu
  rationale: אוּלָם introduz contraste, e o pronome independente אֲנִי dá ênfase ao sujeito. Em português, “Mas eu” preserva ambos com naturalidade.
- source_word: אֶדְרֹשׁ
  choice: buscaria
  rationale: O verbo דרשׁ expressa aqui voltar-se para Deus em busca de auxílio ou resposta. O condicional comunica o caráter de conselho pessoal presente na fala de Elifaz.
- source_word: אֶל אֵל
  choice: a Deus
  rationale: A preposição indica direção, e אֵל funciona como designação divina. “Buscar a Deus” é uma construção clara e corrente em português.
- source_word: וְאֶל אֱלֹהִים
  choice: e ... a Deus
  rationale: A repetição de “Deus” mantém o paralelismo poético entre אֵל e אֱלֹהִים sem criar uma distinção de referentes que o hebraico não exige.
- source_word: אָשִׂים
  choice: apresentaria
  rationale: Embora שׂים signifique literalmente “pôr” ou “colocar”, com דִּבְרָה comunica a ideia idiomática de expor ou apresentar uma questão.
- source_word: דִּבְרָתִי
  choice: a minha causa
  rationale: O substantivo pode designar matéria, questão ou causa levada à apreciação de alguém. “Minha causa” preserva a possível nuance jurídica sem reduzir o sentido a uma queixa.
theological_decisions:
- issue: Tradução paralela de אֵל e אֱלֹהִים
  choice: Ambos traduzidos como “Deus”
  alternative: “o Poderoso” e “Deus”, ou transliterar “El”
  rationale: Os dois termos se referem ao mesmo Deus dentro de um paralelismo poético. A tradução uniforme evita sugerir uma distinção teológica não indicada pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. A repetição de “Deus” foi mantida para refletir o paralelismo e a ênfase do hebraico.
