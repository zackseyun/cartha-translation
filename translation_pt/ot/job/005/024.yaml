  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: pt
  text: Você saberá que a sua tenda está em paz; quando inspecionar a sua morada, não dará por falta de nada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pecará”. O verbo hebraico pode significar “pecar”, mas, neste contexto, provavelmente tem o sentido de “não encontrar nada faltando” ou “não achar falta de nada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Você saberá
  rationale: O perfeito qal com conjunção tem valor futuro no contexto desta promessa. A formulação comunica a certeza de modo natural em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que será conhecido.
- source_word: שָׁלוֹם
  choice: está em paz
  rationale: Preserva diretamente a ideia ampla de paz, segurança e integridade expressa por shalom, sem reduzi-la apenas à segurança física.
- source_word: אָהֳלֶךָ
  choice: a sua tenda
  rationale: Mantém a imagem concreta e o contexto antigo do hebraico, podendo representar também a casa e o âmbito familiar.
- source_word: וּפָקַדְתָּ
  choice: quando inspecionar
  rationale: פקד pode significar visitar, verificar ou passar em revista. Aqui, a inspeção da morada se harmoniza com a constatação subsequente de que nada falta.
- source_word: נָוְךָ
  choice: a sua morada
  rationale: No paralelismo com 'tenda', designa o lugar de habitação; 'morada' preserva a abrangência do termo sem impor o sentido alternativo de pastagem.
- source_word: וְלֹא תֶחֱטָא
  choice: não dará por falta de nada
  rationale: חטא pode expressar errar, deixar de alcançar ou faltar, além do sentido moral de pecar. Após a inspeção da morada, a leitura contextual mais provável é que nada será encontrado em falta.
theological_decisions:
- issue: Sentido de וְלֹא תֶחֱטָא
  choice: 'Sentido não moral: ''não dará por falta de nada'''
  alternative: '''não pecará'''
  rationale: O contexto imediato trata da paz e integridade da casa. A sequência entre inspecionar a morada e não encontrar falta favorece o sentido não moral, mas a nota preserva a leitura lexical tradicional e a genuína ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Conserva-se a imagem antiga da tenda e emprega-se 'morada' como paralelo poético.
