  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: pt
  text: 'que dá chuva sobre a terra

    e envia água sobre os campos,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: que dá
  rationale: O particípio qal com artigo tem função substantivada e continua a descrição de Deus no versículo anterior; “que dá” preserva naturalmente essa força relativa.
- source_word: מָטָר
  choice: chuva
  rationale: Equivalente português comum e preciso para precipitação.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: sobre a face da terra
  rationale: Mantém a imagem hebraica de “face/superfície” e o paralelismo com o segundo membro; “terra” convém ao alcance geral da declaração.
- source_word: וְשֹׁלֵחַ
  choice: e envia
  rationale: Reproduz o particípio qal paralelo ao primeiro verbo e conserva o paralelismo verbal.
- source_word: מַיִם
  choice: água
  rationale: Embora a forma hebraica seja morfologicamente plural, “água” como nome massivo é a expressão natural em português.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: sobre a face dos campos
  rationale: חוּצוֹת pode indicar espaços exteriores, áreas abertas ou ruas; no contexto de chuva e natureza, “campos” comunica de modo natural as extensões abertas, sem eliminar as alternativas em nota.
theological_decisions:
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: região
  rationale: A afirmação descreve de modo amplo a providência divina ao dar chuva, embora o substantivo hebraico também possa designar uma região ou terra específica.
- issue: Sentido contextual de חוּצוֹת
  choice: campos
  alternative: ruas ou campo aberto
  rationale: O paralelismo com a chuva sobre a terra favorece áreas abertas; a nota conserva a amplitude lexical do hebraico sem impor um cenário urbano.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição “sobre a face” foi mantida para preservar a imagem e o paralelismo poético do hebraico; a quebra de linha representa os dois membros do verso.
