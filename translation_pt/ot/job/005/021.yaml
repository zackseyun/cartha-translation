base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: pt
  text: Você ficará a salvo do açoite da língua[a] e não temerá a destruição[b] quando ela vier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o açoite da língua”, metáfora para palavras ofensivas ou caluniosas.'
    reason: lexical_alternative
  - marker: b
    text: Ou “devastação” ou “ruína”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט
  choice: do açoite
  rationale: שׁוֹט designa literalmente um chicote ou açoite. Com “língua”, forma uma metáfora vívida de agressão verbal; “açoite” preserva essa imagem em português digno e natural.
- source_word: לָשׁוֹן
  choice: da língua
  rationale: Aqui, לָשׁוֹן representa metonimicamente a fala, em especial palavras ofensivas ou caluniosas. “Língua” mantém a imagem concreta do hebraico.
- source_word: תֵּחָבֵא
  choice: ficará a salvo
  rationale: O nifal de חבא significa ser escondido ou mantido oculto. A formulação “ficará a salvo” expressa naturalmente, em português, a proteção indicada no contexto, sem eliminar a relação com o perigo verbal.
- source_word: וְלֹא תִירָא
  choice: e não temerá
  rationale: Tradução direta do imperfeito negado, preservando o tom de certeza ou promessa da declaração.
- source_word: מִשֹּׁד
  choice: a destruição
  rationale: שֹׁד pode indicar destruição violenta, devastação ou ruína. “Destruição” é claro, abrangente e adequado ao contexto.
- source_word: כִּי יָבֹוא
  choice: quando ela vier
  rationale: כִּי é entendido aqui em sentido temporal. O pronome feminino retoma naturalmente “destruição” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A metáfora hebraica do açoite e da língua foi preservada; “ficará a salvo” evita a construção pouco idiomática “será escondido do”.
