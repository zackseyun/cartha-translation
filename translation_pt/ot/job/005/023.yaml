  - marker: b
    text: Literalmente, “fez as pazes com você” ou “está em paz com você”. O hebraico descreve relações pacíficas entre a pessoa e os animais selvagens.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
