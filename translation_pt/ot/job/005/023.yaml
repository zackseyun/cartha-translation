  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva naturalmente a ligação lógica em português.
- source_word: עִם אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ
  choice: você terá uma aliança com as pedras do campo
  rationale: O hebraico apresenta uma oração nominal sem verbo explícito; “terá” é suprido em português para expressar a relação futura indicada pelo contexto, mantendo a imagem poética concreta.
- source_word: אַבְנֵי הַשָּׂדֶה
  choice: as pedras do campo
  rationale: Preserva a imagem hebraica e sua possível alusão às pedras como obstáculos agrícolas, sem explicá-la excessivamente no texto principal.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: e os animais selvagens do campo
  rationale: Nesta expressão, חַיָּה designa de modo natural os animais não domesticados; a formulação é clara e atual.
- source_word: הָשְׁלְמָה לָךְ
  choice: estarão em paz com você
  rationale: Transmite a relação pacífica expressa pelo hifil de שׁלם e verte לָךְ segundo a regência idiomática portuguesa de “estar em paz com”.
