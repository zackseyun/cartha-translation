  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: pt
  text: Pois você terá uma aliança com as pedras do campo[a], e os animais selvagens do campo estarão em paz com você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pedras que estão no campo”. A expressão pode evocar pedras que dificultam o cultivo, mas o texto hebraico mantém a imagem de uma aliança com elas.'
