  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: pt
  text: Mas ele salva o necessitado da espada da boca deles[a] e da mão do forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele livrou o necessitado da espada, da boca deles e da mão do forte”. A formulação hebraica é condensada, e alguns entendem “da boca deles” separadamente, em vez de ligá-la a “espada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: ele salva
  rationale: O verbo ישׁע indica salvar ou livrar. Embora a forma possa ter valor passado, o presente exprime naturalmente a máxima poética no discurso de Elifaz; Deus é o sujeito implícito no contexto.
- source_word: מֵחֶרֶב
  choice: da espada
  rationale: חֶרֶב significa “espada”, e a preposição מִן indica aquilo de que o necessitado é salvo. O artigo definido é natural diante da expressão seguinte.
- source_word: מִפִּיהֶם
  choice: da boca deles
  rationale: A expressão significa literalmente “da boca deles”. Ligada a “espada”, forma a imagem comprimida “a espada da boca deles”, preservando a associação entre fala destrutiva e arma; a leitura sintática alternativa é registrada em nota.
- source_word: וּמִיַּד
  choice: e da mão
  rationale: יָד é literalmente “mão” e também pode denotar poder ou domínio. A imagem concreta foi mantida, em paralelo com “espada”.
- source_word: חָזָק
  choice: do forte
  rationale: O adjetivo חָזָק é usado substantivamente para designar quem é forte ou poderoso. O singular “do forte” acompanha a forma hebraica e mantém o contraste com o necessitado.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: אֶבְיוֹן designa uma pessoa pobre, carente ou socialmente vulnerável. “O necessitado” conserva essa amplitude sem restringir o sentido apenas à pobreza econômica.
theological_decisions:
- issue: Força metafórica de “a espada da boca deles”
  choice: Manter a metáfora como “a espada da boca deles”.
  alternative: Traduzir de modo explicativo como “suas palavras destrutivas” ou separar “da espada” de “da boca deles”.
  rationale: A formulação hebraica justapõe espada e boca numa imagem poética vívida. Preservá-la evita reduzir sua força literária ou definir em excesso o tipo de dano causado pela fala; a possível construção alternativa permanece indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada ao uso natural do português sem desfazer o paralelismo poético nem resolver a ambiguidade sintática do hebraico.
