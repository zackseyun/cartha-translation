  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: pt
  text: 'Pois o ser humano nasce para a aflição,

    e os filhos da chama voam para o alto.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as faíscas voam para o alto”. O hebraico diz literalmente “os filhos da chama” — ou, possivelmente, “os filhos de Reshef” —, expressão geralmente entendida como referência às faíscas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação proverbial de Elifaz e mantém a ligação causal com o contexto anterior.
- source_word: אָדָם
  choice: o ser humano
  rationale: O substantivo singular é genérico. Esta formulação conserva a referência representativa à humanidade em português atual, sem restringi-la ao sexo masculino.
- source_word: לְעָמָל
  choice: para a aflição
  rationale: עָמָל abrange sofrimento, dificuldade, fadiga e miséria. “Aflição” comunica aqui o caráter penoso da existência, sem reduzi-lo meramente a trabalho.
- source_word: יוּלָּד
  choice: nasce
  rationale: A forma passiva em uma máxima geral é expressa naturalmente pelo presente gnômico em português.
- source_word: וּבְנֵי רֶשֶׁף
  choice: e os filhos da chama
  rationale: Mantém a imagem literalmente marcada e a ambiguidade de רֶשֶׁף, que pode designar chama e, possivelmente, o nome Reshef; a interpretação idiomática “faíscas” fica registrada em nota.
- source_word: יַגְבִּיהוּ עוּף
  choice: voam para o alto
  rationale: Reúne naturalmente em português a ideia combinada de voar e elevar-se, preservando o movimento ascendente da imagem hebraica.
