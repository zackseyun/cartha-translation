base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: pt
  text: Na fome, ele resgatará você da morte[a]; e, na guerra, do poder da espada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “redimirá você” ou “livrará você”. O verbo hebraico transmite a ideia de libertar, resgatar ou salvar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “das mãos da espada”, uma expressão idiomática que significa “do poder da espada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: Na fome
  rationale: רָעָב pode indicar fome ou escassez generalizada. Aqui designa a calamidade da fome, e o בְּ marca a circunstância em que ocorre o resgate.
- source_word: פָּדְךָ
  choice: ele resgatará você
  rationale: פדה expressa libertar ou salvar mediante resgate. “Resgatar” preserva essa força lexical em português sem tornar explícita uma ideia de pagamento que o verso não desenvolve; “você” representa a segunda pessoa masculina singular de modo natural e amplamente compreensível.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: A preposição מִן indica afastamento ou livramento, e מָוֶת é mantido como o substantivo concreto “morte”.
- source_word: וּבְמִלְחָמָה
  choice: e, na guerra
  rationale: מִלְחָמָה pode significar guerra ou batalha. “Guerra” conserva o alcance geral do termo e forma um paralelo natural com “na fome”.
- source_word: מִידֵי
  choice: do poder
  rationale: A expressão hebraica literalmente fala das “mãos” da espada, mas “poder” comunica em português o sentido idiomático de domínio ou capacidade de ferir, enquanto a imagem literal é registrada em nota.
- source_word: חָרֶב
  choice: da espada
  rationale: חֶרֶב é o termo comum para espada e, neste contexto, representa por metonímia a violência mortal da guerra.
theological_decisions:
- issue: Sentido de פדה no contexto sapiencial
  choice: resgatará
  alternative: redimirá; livrará
  rationale: O verso promete preservação da morte em meio a calamidades, não apresenta de modo explícito uma doutrina mais ampla de redenção. “Resgatará” mantém a força de libertação do verbo hebraico sem resolver o termo em uma leitura soteriológica posterior.
- issue: Sujeito implícito do verbo
  choice: ele
  alternative: Deus
  rationale: O hebraico traz o sujeito apenas na forma verbal, identificado pelo contexto. Manter “ele”, em vez de inserir o nome “Deus”, evita tornar explícito no verso o que permanece gramaticalmente implícito.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa inteligibilidade brasileira. A colocação de “você” evita a ambiguidade regional de “o resgatará”, e a pontuação evidencia o paralelismo poético entre fome e guerra.
