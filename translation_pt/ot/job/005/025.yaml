  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: pt
  text: Você saberá que sua prole[a] será numerosa, e seus descendentes serão como a erva da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua semente”; o hebraico usa um termo coletivo para a prole.
    reason: lexical_alternative
  - marker: b
    text: Ou “da região”. A palavra hebraica pode significar “terra” em sentido amplo ou uma região específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Você saberá
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado por וְ, tem aqui valor prospectivo e expressa certeza; “Você saberá” é natural e preserva essa força.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que será conhecido, e não uma oração causal.
- source_word: רַב
  choice: será numerosa
  rationale: Com o substantivo coletivo זֶרַע, indica grande quantidade. O singular “numerosa” concorda naturalmente com “descendência”, e o futuro se harmoniza com o caráter prospectivo da afirmação.
- source_word: זַרְעֶךָ
  choice: a sua descendência
  rationale: O substantivo coletivo זֶרַע designa aqui a prole. “Descendência” mantém o valor coletivo e é claro no português atual.
- source_word: וְצֶאֱצָאֶיךָ
  choice: e os seus descendentes
  rationale: Designa aqueles que procedem de alguém, sua posteridade. “Descendentes” preserva o paralelismo sem repetir exatamente “descendência”.
- source_word: כְּעֵשֶׂב
  choice: como a relva
  rationale: A comparação evoca vegetação abundante. “Relva” é conciso, digno e adequado à imagem poética.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar tanto “terra” em sentido amplo quanto “região/território”; “terra” conserva melhor a amplitude da imagem, e a alternativa é registrada em nota.
