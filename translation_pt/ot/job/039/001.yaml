  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: pt
  text: Você sabe quando as cabras-monteses dão à luz?[a] Você observa as cervas no trabalho de parto?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as cabras selvagens dos rochedos”; o hebraico se refere a caprinos selvagens que vivem nas montanhas, possivelmente íbexes.
    reason: lexical_alternative
  - marker: b
    text: O hebraico se refere especificamente às fêmeas dos cervídeos.
    reason: lexical_clarification
  - marker: c
    text: O verbo também pode significar “vigiar” ou “velar por”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Você sabe
  rationale: A partícula interrogativa com o perfeito de ידע forma aqui uma pergunta retórica; o presente expressa naturalmente sua força em português.
- source_word: עֵת לֶדֶת
  choice: quando ... dão à luz
  rationale: A construção, literalmente ligada ao “tempo de dar à luz”, é vertida por uma oração temporal clara e natural.
- source_word: יַעֲלֵי סָלַע
  choice: cabras-monteses
  rationale: A expressão significa literalmente “cabras do rochedo” e designa caprinos selvagens das montanhas, possivelmente íbexes; a escolha evita precisão zoológica indevida.
- source_word: חֹלֵל
  choice: no trabalho de parto
  rationale: O termo evoca as contorções ou dores do parto; esta formulação comunica o estado sem acrescentar que o parto já se consumou.
- source_word: אַיָּלוֹת
  choice: cervas
  rationale: O substantivo feminino plural designa fêmeas de cervídeos; “cervas” preserva essa especificidade.
- source_word: תִּשְׁמֹר
  choice: Você observa
  rationale: שׁמר pode significar guardar, vigiar ou observar. Neste contexto, “observa” preserva o sentido de acompanhar atentamente sem impor a ideia de proteção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. O paralelismo interrogativo foi preservado. “Cabras-monteses” é corrente e compreensível; “cervas” mantém a referência às fêmeas. “Observa” evita resolver o verbo como cuidado protetor, preservando sua amplitude semântica em nota.
