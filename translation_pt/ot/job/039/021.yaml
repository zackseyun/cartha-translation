source:
  edition: WLC
  text: יַחְפְּר֣וּ בָ֭/עֵמֶק וְ/יָשִׂ֣ישׂ בְּ/כֹ֑חַ יֵ֝צֵ֗א לִ/קְרַאת נָֽשֶׁק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: pt
  text: Ele escarva no vale[a] e se alegra com sua força; sai ao encontro das armas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cava no vale” ou “escarva o chão no vale”. O verbo hebraico significa literalmente “cavar” e descreve aqui o cavalo revolvendo o chão com os cascos.
    reason: lexical_alternative
  - marker: b
    text: Ou “da batalha”. O substantivo hebraico pode designar armas ou armamento coletivamente e, por extensão, o próprio combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: escarva
  rationale: Embora חפר signifique literalmente “cavar”, no contexto do cavalo descreve o ato de raspar ou revolver o chão com os cascos. “Escarva” comunica essa ação de modo conciso e natural.
- source_word: בָעֵמֶק
  choice: no vale
  rationale: עֵמֶק designa normalmente um vale ou uma região baixa; “no vale” é a correspondência mais direta.
- source_word: וְיָשִׂישׂ
  choice: e se alegra
  rationale: שׂושׂ expressa alegria ou exultação. “Se alegra” é claro, atual e preserva a força positiva do verbo.
- source_word: בְּכֹחַ
  choice: com sua força
  rationale: A preposição בְּ com כֹּחַ admite nuances como “em” ou “com”. “Com sua força” soa natural em português e retrata o vigor no qual o cavalo se compraz, sem impor uma relação causal.
- source_word: יֵצֵא
  choice: sai
  rationale: יצא significa simplesmente “sair”. “Sai” mantém a formulação direta, sem acrescentar a ideia mais específica de investir ou disparar.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: לִקְרַאת indica movimento para encontrar ou enfrentar algo; “ao encontro de” preserva essa direção e é idiomático.
- source_word: נָשֶׁק
  choice: as armas
  rationale: נֶשֶׁק pode designar armas ou armamento coletivamente e, por extensão, a batalha. “As armas” mantém aqui a imagem militar concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa adequada à poesia. “Escarva” preserva a imagem concreta do movimento dos cascos, enquanto as notas registram tanto o sentido literal do verbo quanto a possível extensão de “armas” para “batalha”.
