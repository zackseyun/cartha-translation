  yaml_path: translation/ot/job/039/019.yaml
  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: pt
  text: Você dá força ao cavalo? Você veste de crina o pescoço dele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com trovão”, conforme uma antiga tradição interpretativa de רַעְמָה. Aqui, o termo é traduzido por “crina” porque a imagem imediata é a de vestir o pescoço do cavalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Você dá
  rationale: A partícula interrogativa com o imperfeito de נתן introduz uma pergunta retórica dirigida a Jó. “Você dá” preserva o desafio direto sem acrescentar uma ideia modal.
- source_word: לַסּוּס
  choice: ao cavalo
  rationale: O artigo definido hebraico favorece “o cavalo”, empregado aqui de modo genérico.
- source_word: גְּבוּרָה
  choice: força
  rationale: O termo denota força, poder ou vigor; “força” expressa com clareza o vigor físico do cavalo no contexto.
- source_word: הֲתַלְבִּישׁ
  choice: Você reveste
  rationale: O hifil de לבש significa vestir ou revestir. “Reveste” mantém a metáfora poética de cobrir ou adornar o pescoço do cavalo.
- source_word: צַוָּארוֹ
  choice: o pescoço dele
  rationale: O sufixo masculino singular retoma “cavalo”. A formulação é natural em português e não exige que o referente seja entendido como um animal especificamente macho.
- source_word: רַעְמָה
  choice: uma crina
  rationale: No contexto, o substantivo designa provavelmente a crina do cavalo; a referência ao pescoço e a metáfora de revesti-lo favorecem esse sentido, embora exista uma tradição interpretativa antiga que entende “trovão”.
