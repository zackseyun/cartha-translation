  yaml_path: translation/ot/job/039/023.yaml
  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: pt
  text: Sobre ele, a aljava retine[a]; o lampejo da lança e do dardo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contra ele, a aljava retine”. A preposição e o verbo hebraicos admitem pequenas diferenças de nuance espacial e sonora.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a chama/lâmina da lança e do dardo”, expressão poética que descreve o brilho fulgurante dessas armas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: sobre ele
  rationale: Preserva a relação espacial expressa por עַל com sufixo masculino singular, sem excluir a possível nuance hostil de armas que soam contra o cavalo.
- source_word: תִּרְנֶה
  choice: ressoa
  rationale: Expressa o som agudo e vibrante da aljava no cenário de batalha; em português, concorda naturalmente com o sujeito singular 'aljava'.
- source_word: אַשְׁפָּה
  choice: a aljava
  rationale: É o termo português corrente e preciso para o estojo em que se carregam flechas.
- source_word: לַהַב
  choice: o lampejo
  rationale: O substantivo significa literalmente 'chama' ou, em certos contextos, 'lâmina'; aqui comunica poeticamente o brilho fulgurante das armas.
- source_word: חֲנִית
  choice: lança
  rationale: Equivalente português amplo e usual para esta arma de haste.
- source_word: כִידוֹן
  choice: dardo
  rationale: Mantém a distinção em relação a חֲנִית e designa de modo natural uma arma mais leve, própria para arremesso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva o paralelismo poético e as ambiguidades lexical e espacial do hebraico; 'ressoa' evita uma imagem indevidamente específica do movimento da aljava, enquanto 'lampejo' comunica o valor figurado de לַהַב.
