lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: se agacham
  rationale: O verbo כרע descreve o abaixar físico das fêmeas ao dar à luz. “Agacham-se” é natural em português e se ajusta ao contexto animal.
- source_word: יַלְדֵיהֶן
  choice: seus filhotes
  rationale: A forma nominal de ילד designa aquilo que nasceu; no contexto de animais, “filhotes” é a expressão mais idiomática e precisa.
- source_word: תְּפַלַּחְנָה
  choice: dão à luz
  rationale: No contexto, o verbo denota o ato de parir. “Dão à luz” comunica isso com clareza e dignidade em português atual.
- source_word: חֶבְלֵיהֶם
  choice: dores do parto
  rationale: Embora חבל tenha outros sentidos, como “cordas”, a imagem imediata do nascimento indica as dores associadas ao parto.
- source_word: תְּשַׁלַּחְנָה
  choice: livram-se
  rationale: שלח significa literalmente enviar, soltar ou deixar ir. Aqui expressa que, ao parirem, as fêmeas ficam livres das dores do parto.
