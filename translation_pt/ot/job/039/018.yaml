lexical_decisions:
- source_word: כָּעֵת
  choice: Quando
  rationale: A expressão introduz a circunstância temporal da ação; «quando» é natural e preserva essa função.
- source_word: בַּמָּרוֹם
  choice: nas alturas
  rationale: מָרוֹם indica altura ou elevação. A expressão mantém o tom poético sem afirmar que a ave esteja voando plenamente.
- source_word: תַּמְרִיא
  choice: se ergue
  rationale: O hifil sugere elevar-se ou fazer-se subir. «Se ergue» preserva a imagem e evita a especificidade excessiva de «voa» ou «paira».
- source_word: תִּשְׂחַק
  choice: ri de
  rationale: שׂחק pode significar rir ou zombar; com ל, aqui expressa riso dirigido ao cavalo e ao cavaleiro, possivelmente com sentido de desprezo.
- source_word: לַסּוּס
  choice: do cavalo
  rationale: O artigo hebraico favorece o singular genérico definido, expresso naturalmente em português por «o cavalo».
- source_word: וּלְרֹכְבוֹ
  choice: e de seu cavaleiro
  rationale: O sufixo remete ao cavalo. «Seu cavaleiro» conserva essa relação de modo conciso e natural.
