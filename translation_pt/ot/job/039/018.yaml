  text: Quando se ergue nas alturas[a], ela ri[b] do cavalo e de seu cavaleiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «abre as asas nas alturas» ou «bate as asas e se eleva». O verbo hebraico provavelmente descreve um movimento para cima, mas sua nuance exata é discutida.'
