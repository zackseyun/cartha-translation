  text: הֲ/יֹ֣אבֶה רֵּ֣ים עָבְדֶ֑/ךָ אִם יָ֝לִ֗ין עַל אֲבוּסֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/009.yaml
  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: pt
  text: Será que o boi selvagem aceitará servir você? Passará a noite junto ao seu cocho?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto à sua manjedoura”. O termo hebraico se refere a um lugar onde os animais se alimentam.
    reason: lexical_alternative
  - marker: b
    text: Ou “touro selvagem” ou “auroque”; não se sabe ao certo qual animal é designado pelo termo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: Será que ... aceitará
  rationale: O verbo אבה expressa disposição ou consentimento, não mera capacidade. “Aceitará” comunica de modo natural a ideia de consentir em servir.
- source_word: רֵּים
  choice: boi selvagem
  rationale: A identificação exata do animal é incerta. “Boi selvagem” é claro, tradicionalmente bem estabelecido e evita a especificidade indevida de “auroque”.
- source_word: עָבְדֶךָ
  choice: servir você
  rationale: O verbo עבד indica aqui serviço ou trabalho prestado a um senhor humano; a formulação preserva o contraste entre um animal domesticado e um animal indomável.
- source_word: אִם
  choice: Passará
  rationale: אִם introduz a segunda pergunta retórica no paralelismo. Em português, uma nova pergunta sem “ou” soa natural e mantém a força poética.
- source_word: יָלִין
  choice: Passará a noite
  rationale: O verbo לין significa alojar-se ou permanecer durante a noite. A expressão escolhida é corrente e retrata claramente a permanência do animal no lugar de alimentação.
- source_word: עַל
  choice: junto a
  rationale: Embora a preposição possa significar literalmente “sobre”, neste contexto espacial indica proximidade ao cocho; “junto a” é idiomático e conserva essa relação.
- source_word: אֲבוּסֶךָ
  choice: seu cocho
  rationale: אֲבוּס designa um recipiente ou lugar onde animais se alimentam. “Cocho” é concreto, natural e amplamente compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural para perguntas retóricas. “Você” favorece ampla legibilidade brasileira, enquanto “cocho” mantém concreta a imagem rural.
