  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: pt
  text: Você o faz saltar como o gafanhoto? A majestade de seu resfolegar é aterradora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você o faz estrondear como o gafanhoto?” O verbo hebraico pode indicar fazer tremer, estremecer ou mover-se violentamente; alguns entendem que a imagem ressalta tanto o som quanto o movimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Você o faz saltar
  rationale: O hifil de רעשׁ pode expressar fazer tremer, sacudir ou mover-se violentamente. No contexto do cavalo e da comparação com o gafanhoto, “saltar” comunica de modo natural o movimento súbito e vigoroso, sem eliminar em nota a possível dimensão sonora.
- source_word: כָּאַרְבֶּה
  choice: como o gafanhoto
  rationale: O substantivo singular pode ter valor representativo ou coletivo; o artigo em português apresenta o gafanhoto como tipo da comparação e preserva a concisão poética.
- source_word: הוֹד
  choice: A majestade
  rationale: הוֹד denota majestade, esplendor ou imponência. “Majestade” mantém o registro elevado e descreve bem o efeito impressionante do cavalo.
- source_word: נַחְרוֹ
  choice: de seu resfolegar
  rationale: O termo se refere ao forte sopro pelas narinas. “Resfolegar” é preciso para o ruído e a respiração vigorosa do cavalo, sendo mais adequado que “relinchar”.
- source_word: אֵימָה
  choice: causa terror
  rationale: O substantivo significa terror ou pavor. A formulação predicativa é natural em português e conserva a força da oração nominal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Resfolegar” preserva a imagem concreta da respiração ruidosa do cavalo; a alternativa lexical do primeiro verbo é mantida em nota para não apagar a ambiguidade do hebraico.
