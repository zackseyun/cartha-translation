lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: É por causa do seu entendimento
  rationale: A construção interrogativa com מִן apresenta o entendimento de Jó como suposta causa ou fundamento da ação. A formulação portuguesa conserva a pergunta retórica sem substituir בִּינָה por um termo mais amplo como “sabedoria”.
- source_word: יַאֲבֶר
  choice: alça voo
  rationale: O hifil de אבר descreve o movimento de voo da ave. “Alça voo” é natural e digno em português, sem impor especificamente a ideia de planar.
- source_word: נֵץ
  choice: gavião
  rationale: נֵץ designa uma ave de rapina do tipo gavião ou falcão, sem permitir identificação zoológica precisa. “Gavião” é uma equivalência ampla e facilmente compreendida.
- source_word: יִפְרֹשׂ
  choice: estende
  rationale: פרשׂ significa abrir, estender ou desdobrar. A coordenação verbal direta reproduz naturalmente a sequência hebraica.
- source_word: כְּנָפוֹ
  choice: as asas
  rationale: Embora a forma hebraica seja singular, ela pode ter sentido coletivo; o plural é a expressão idiomática normal em português para uma ave em voo.
- source_word: לְתֵימָן
  choice: em direção ao sul
  rationale: A preposição לְ marca direção, e תֵימָן indica o sul. A tradução preserva explicitamente essa orientação.
