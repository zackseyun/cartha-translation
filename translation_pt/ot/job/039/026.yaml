  yaml_path: translation/ot/job/039/026.yaml
  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: pt
  text: É pelo seu entendimento que o gavião alça voo[a] e estende as asas em direção ao sul?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falcão”; o hebraico נֵץ pode designar, de modo mais geral, uma ave de rapina desse tipo.
