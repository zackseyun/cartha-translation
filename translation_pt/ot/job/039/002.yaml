lexical_decisions:
- source_word: תִּסְפֹּר
  choice: Você conta
  rationale: O qal imperfeito na segunda pessoa masculina singular integra a pergunta retórica de Deus. O presente em português expressa com naturalidade a capacidade e o conhecimento postos em questão.
- source_word: יְרָחִים
  choice: os meses
  rationale: O substantivo significa “meses”; o artigo definido é natural no contexto do período de gestação.
- source_word: תְּמַלֶּאנָה
  choice: que elas completam
  rationale: O piel imperfeito na terceira pessoa feminina plural tem como sujeito as fêmeas mencionadas no contexto. A formulação conserva a construção ativa hebraica e a ideia de levar os meses da gestação até o termo.
- source_word: וְיָדַעְתָּ
  choice: e sabe
  rationale: O qal perfeito na segunda pessoa masculina singular, ligado pela conjunção, prossegue a sequência retórica. Em português, o presente coordenado é natural e mantém a força interrogativa.
- source_word: עֵת
  choice: o momento
  rationale: עֵת designa um tempo ou ocasião determinada. “O momento” é corrente e preciso no contexto do parto, sem explicitar além do hebraico a ideia de nomeação divina.
- source_word: לִדְתָּנָה
  choice: em que dão à luz
  rationale: O infinitivo construto de ילד com sufixo feminino plural é vertido como oração temporal idiomática, mantendo as fêmeas como referente.
