  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: pt
  text: Ele ri do tumulto da cidade[a]; não ouve os gritos do condutor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “barulho da cidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “feitor” ou “capataz”. O termo hebraico pode designar, de modo mais amplo, alguém que impele outros ou exige trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: ri
  rationale: O imperfeito qal de שׂחק descreve a reação desdenhosa do jumento selvagem ao ambiente urbano. “Ri” é direto e preserva a imagem hebraica sem ampliá-la para “zomba” ou “escarnece”.
- source_word: לַהֲמוֹן
  choice: do tumulto
  rationale: הָמוֹן pode indicar ruído, estrondo ou agitação. “Tumulto” reúne a ideia de barulho e movimentação, adequada ao contraste entre a cidade e a liberdade do animal selvagem.
- source_word: קִרְיָה
  choice: da cidade
  rationale: קִרְיָה designa uma cidade ou povoação. O artigo definido soa natural em português para a referência genérica à vida urbana.
- source_word: תְּשֻׁאוֹת
  choice: os gritos
  rationale: O substantivo plural denota clamores ou gritos fortes. “Os gritos” conserva o valor concreto do plural e se liga naturalmente ao agente mencionado em seguida.
- source_word: נֹגֵשׂ
  choice: condutor
  rationale: נֹגֵשׂ pode designar quem impele, oprime ou exige trabalho. Neste contexto animal, “condutor” expressa quem controla ou toca o animal sem importar indevidamente a linguagem específica de trabalho forçado.
- source_word: לֹא יִשְׁמָע
  choice: não ouve
  rationale: A expressão significa literalmente “não ouve”. A formulação preserva o hebraico e deixa implícita, sem explicá-la em excesso, a ideia contextual de que o animal está livre das ordens humanas.
