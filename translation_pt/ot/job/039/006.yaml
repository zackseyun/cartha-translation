  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: pt
  text: 'a quem dei a estepe[a] como sua casa

    e a terra salgada[b] como suas moradas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o deserto» ou «a região árida».
    reason: lexical_alternative
  - marker: b
    text: Ou «a planície de sal» ou «o ermo salgado».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: a quem
  rationale: O pronome relativo retoma o jumento selvagem do versículo anterior; «a quem» expressa com clareza a relação com aquilo que Deus lhe deu.
- source_word: שַׂמְתִּי
  choice: dei
  rationale: Embora o verbo possa significar «pus» ou «estabeleci», neste contexto indica que Deus destinou ou concedeu ao animal seu habitat.
- source_word: עֲרָבָה
  choice: a estepe
  rationale: Designa uma região árida e aberta. «Estepe» preserva melhor esse perfil geográfico sem sugerir necessariamente um deserto de areia; «deserto» continua sendo uma alternativa acessível.
- source_word: בֵיתוֹ
  choice: como casa
  rationale: Mantém a metáfora literal de «casa» e explicita de modo natural em português a função da estepe como lar do animal.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: como morada
  rationale: O hebraico emprega o plural «suas moradas», que pode ter força poética ou coletiva. O singular é mais natural em português, sem eliminar a forma original, registrada em nota.
- source_word: מְלֵחָה
  choice: a terra salgada
  rationale: Refere-se a terreno salino, árido e pouco fértil. «Terra salgada» é claro e mantém a imagem ambiental sem restringi-la especificamente a uma planície de sal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção poética paralela. «Estepe» oferece precisão geográfica; as opções mais comuns constam em nota. A ordem dos marcadores foi regularizada para corresponder à sequência das notas.
