  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: pt
  text: Você confiará nele porque sua força é grande e deixará a seu cargo o seu trabalho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu trabalho árduo” ou “o fruto do seu trabalho”. O termo hebraico pode se referir tanto ao trabalho em si como ao que esse trabalho produz.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח
  choice: Você confiará
  rationale: O qal imperfeito de בטח, em uma pergunta retórica dirigida a Jó, é expresso naturalmente por “confiará”.
- source_word: בּוֹ
  choice: nele
  rationale: A preposição ב com sufixo masculino singular retoma o boi selvagem; “confiar nele” é idiomático em português.
- source_word: כִּי
  choice: só porque
  rationale: כִּי apresenta como fundamento da confiança a grande força do animal. O acréscimo idiomático de “só” ressalta o caráter questionador sem alterar a proposição causal.
- source_word: רַב כֹּחוֹ
  choice: sua força é grande
  rationale: Preserva a construção predicativa e emprega “força”, apropriado ao contexto de um animal de trabalho.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: e deixará a ele
  rationale: Mantém o sentido concreto de עזב, “deixar”, e a direção indicada por אֵל; no contexto, implica confiar algo aos cuidados do animal.
- source_word: יְגִיעֶךָ
  choice: o fruto do seu trabalho
  rationale: יְגִיעַ pode indicar tanto o trabalho penoso quanto aquilo que ele produz. No contexto agrícola e com o verbo “deixar”, o produto do trabalho oferece a leitura mais natural, sem excluir a alternativa em nota.
