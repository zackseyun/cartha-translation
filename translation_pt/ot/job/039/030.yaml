  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: pt
  text: Seus filhotes sugam o sangue[a], e onde estão os mortos[b], ali ela está.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sorvem o sangue”. O verbo hebraico é vívido e pode sugerir sugar, engolir avidamente ou sorver.
    reason: lexical_alternative
  - marker: b
    text: Ou “os abatidos” ou “os cadáveres”. O hebraico diz “os mortos”; o termo frequentemente se refere aos que morreram de forma violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: seus filhotes
  rationale: O substantivo designa as crias da ave mencionada no contexto. “Filhotes” é natural e amplo, sem especificar indevidamente a fase de desenvolvimento.
- source_word: יְעַלְעוּ
  choice: sugam
  rationale: O verbo descreve de modo vívido a ingestão ávida de sangue, podendo sugerir sugar, sorver ou engolir. “Sugam” preserva a imagem gráfica e admite alternativas em nota.
- source_word: דָם
  choice: o sangue
  rationale: Corresponde diretamente ao sentido lexical e mantém a força concreta da imagem.
- source_word: וּבַאֲשֶׁר
  choice: e onde
  rationale: A construção relativa introduz uma oração locativa; “e onde” reproduz isso de maneira direta e natural.
- source_word: חֲלָלִים
  choice: os mortos à espada
  rationale: O termo indica pessoas mortas violentamente ou feridas de morte. “Mortos à espada” comunica o caráter violento, embora “os que foram mortos” seja uma alternativa mais abrangente.
- source_word: שָׁם הוּא
  choice: ali ela está
  rationale: O pronome retoma a ave do contexto. Em português, usa-se o feminino por referência à águia, e “ali ela está” mantém o presente da descrição poética.
