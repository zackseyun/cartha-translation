translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação principal entende os montes como o território percorrido em busca de pasto; a nota preserva a possível relação apositiva entre “montes” e “lugar de pastagem”.
