  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: pt
  text: Percorre os montes em busca do seu pasto[a] e procura tudo o que é verde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Percorre os montes, seu lugar de pastagem”.'
    reason: lexical_alternative
  - marker: b
    text: “Tudo o que é verde” refere-se à vegetação verde e fresca.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: percorre
  rationale: O Qal de תור indica explorar, esquadrinhar ou andar por uma região. “Percorre” expressa com naturalidade o movimento livre do jumento selvagem pelos montes.
- source_word: הָרִים
  choice: os montes
  rationale: הָרִים, com artigo definido, significa literalmente “os montes” ou “as montanhas”. “Montes” é claro e natural neste contexto de pastagem.
- source_word: מִרְעֵהוּ
  choice: seu pasto
  rationale: מִרְעֶה designa pasto ou lugar de pastagem, e o sufixo de terceira pessoa masculina singular é preservado por “seu”.
- source_word: וְאַחַר
  choice: e ... em busca de
  rationale: Com o verbo דרשׁ, אַחַר comunica direção ou perseguição de um objetivo. Em português, a construção é expressa naturalmente por “procura” e pela ideia de busca.
- source_word: כָּל
  choice: tudo
  rationale: כָּל abrange toda ocorrência daquilo que é verde. “Tudo o que” preserva a amplitude distributiva sem tornar a frase artificial.
- source_word: יָרוֹק
  choice: o que é verde
  rationale: יָרוֹק pode designar, de modo amplo, aquilo que é verde, especialmente vegetação fresca. A expressão mantém essa generalidade do hebraico.
- source_word: יִדְרֹשׁ
  choice: procura
  rationale: Neste contexto de alimentação animal, דרשׁ significa buscar ou procurar ativamente; “procura” é corrente e preciso.
