  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: pt
  text: Ela trata seus filhotes com dureza[a], como se não fossem seus; seu trabalho é em vão, sem temor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ela endurece seus filhos contra si mesma, como se não fossem seus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: trata ... com dureza
  rationale: O hifil de קשׁח expressa tornar duro ou agir com dureza. No contexto do comportamento da avestruz para com a prole, esta formulação é natural e mantém a força do hebraico.
- source_word: בָּנֶיהָ
  choice: seus filhotes
  rationale: Embora o sentido literal seja “seus filhos”, no contexto animal “filhotes” comunica naturalmente a referência à prole.
- source_word: לְלֹא לָהּ
  choice: como se não fossem seus
  rationale: Explicita em português a construção concisa “como não dela”, preservando a ideia de tratar a prole como se não lhe pertencesse.
- source_word: לְרִיק
  choice: em vão
  rationale: Equivalente corrente e conciso para ריק quando denota inutilidade ou esforço sem resultado.
- source_word: יְגִיעָהּ
  choice: seu esforço
  rationale: Denota o trabalho ou desgaste relacionado à geração e ao cuidado da prole; “esforço” é amplo, claro e natural.
- source_word: בְּלִי פָחַד
  choice: não teme
  rationale: A expressão significa literalmente “sem temor”. A formulação verbal liga com naturalidade a falta de receio à possibilidade de o esforço ter sido inútil, sem eliminar essa relação contextual.
