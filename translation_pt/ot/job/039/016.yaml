translation_notes:
  register: Português moderno, digno e acessível, com vocabulário compreensível no Brasil e em outros contextos lusófonos. A oração final foi reorganizada para clareza idiomática, preservando o sentido de ausência de temor diante da possível inutilidade do esforço.
