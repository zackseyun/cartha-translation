  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: pt
  text: Você pode amarrar o boi selvagem[a] ao sulco com sua corda, ou ele gradeará[b] os vales atrás de você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o auroque” ou “o touro selvagem”. O hebraico רֵים designa um bovino selvagem forte, não o mítico “unicórnio” de algumas traduções antigas.
    reason: lexical_alternative
  - marker: b
    text: Ou “lavrará” ou “nivelará”. Neste contexto agrícola, o verbo hebraico provavelmente se refere mais especificamente a trabalhar o solo, destorroando-o ou nivelando-o com uma grade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Você pode amarrar
  rationale: O verbo קשׁר significa amarrar ou prender. A construção com “pode” expressa naturalmente em português a pergunta retórica sobre a capacidade humana de dominar o animal.
- source_word: רֵים
  choice: o boi selvagem
  rationale: Designa um bovino selvagem forte, possivelmente o auroque. “Boi selvagem” é claro para leitores atuais e evita o incorreto “unicórnio” de traduções antigas.
- source_word: בְּתֶלֶם
  choice: ao sulco
  rationale: תלם é o sulco aberto na terra. “Ao sulco” comunica que o animal seria preso para realizar trabalho agrícola.
- source_word: עֲבֹתוֹ
  choice: com sua corda
  rationale: עבות denota uma corda grossa ou cordão; o sufixo masculino singular remete ao boi selvagem. A formulação preserva a imagem concreta do animal atado.
- source_word: אִם
  choice: ou
  rationale: Aqui אִם introduz a segunda pergunta alternativa, não uma condição; “ou” reproduz adequadamente o paralelismo retórico.
- source_word: יְשַׂדֵּד
  choice: gradeará
  rationale: No contexto agrícola, שׂדד provavelmente indica trabalhar, destorroar ou nivelar o solo com grade, uma operação distinta de abrir o primeiro sulco.
- source_word: עֲמָקִים
  choice: os vales
  rationale: O sentido lexical comum é “vales” ou “lugares baixos”. A tradução mantém a imagem topográfica sem restringi-la interpretativamente a campos ou sulcos.
- source_word: אַחֲרֶיךָ
  choice: atrás de você
  rationale: A expressão retrata o animal seguindo o trabalhador sob sua direção; “atrás de você” é natural e vívido em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi formulada com “pode” para transmitir capacidade sem perder a força do hebraico. “Gradeará” conserva a precisão agrícola; a nota oferece alternativas mais gerais.
