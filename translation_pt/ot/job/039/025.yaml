  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: pt
  text: 'Ao toque da trombeta, ele diz[a]: “Ah!”[b] De longe, fareja a batalha, o trovão dos comandantes e o grito de guerra.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao som da trombeta”. A expressão hebraica marca a ocasião em que a trombeta soa.'
    reason: lexical_alternative
  - marker: b
    text: “Ah!” é uma exclamação de entusiasmo, que retrata a prontidão do cavalo para a batalha.
    reason: cultural_note
  - marker: c
    text: 'Ou: “o estrondo dos comandantes e o brado”. “Trovão” é uma metáfora para o forte ruído da batalha; o termo traduzido como “grito de guerra” também pode indicar um brado ou um toque de sinal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Ao toque da trombeta
  rationale: A expressão marca a ocasião em que a trombeta soa. “Ao toque da trombeta” é natural em português e conserva o valor temporal do idioma hebraico.
- source_word: יֹאמַר
  choice: ele diz
  rationale: Mantém o sentido comum do verbo e a personificação vívida do cavalo de guerra, sem intensificar o texto para “grita”.
- source_word: הֶאָח
  choice: Ah!
  rationale: Interjeição breve de entusiasmo e prontidão. Em português, “Ah!” soa natural sem sugerir necessariamente descoberta ou triunfo, como poderia ocorrer com “Aha!”.
- source_word: וּמֵרָחוֹק
  choice: De longe
  rationale: Reproduz com clareza e concisão a indicação de distância.
- source_word: יָרִיחַ מִלְחָמָה
  choice: fareja a batalha
  rationale: Preserva a imagem concreta da percepção pelo olfato; “fareja” é especialmente natural quando o sujeito é um cavalo e pode também evocar sua percepção antecipada do combate.
- source_word: רַעַם שָׂרִים
  choice: o trovão dos comandantes
  rationale: Conserva a metáfora literal de “trovão” e entende שָׂרִים no contexto militar como chefes de tropas.
- source_word: וּתְרוּעָה
  choice: e o grito de guerra
  rationale: No cenário de batalha, a palavra pode designar um brado ou um toque de sinal. “Grito de guerra” expressa a leitura contextual mais provável, enquanto a nota preserva a alternativa.
