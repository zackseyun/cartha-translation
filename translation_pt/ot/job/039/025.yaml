  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e as imagens concretas do hebraico foram preservadas sem rigidez artificial; as ambiguidades de תְרוּעָה e da expressão inicial foram registradas em notas.
