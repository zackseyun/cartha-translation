  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: pt
  text: Quem deixou livre o jumento selvagem? Quem soltou as amarras do asno selvagem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Quem desatou as amarras do jumento selvagem?» O termo hebraico עָרוֹד pode ser entendido, de modo mais geral, como outra designação do jumento selvagem; alguns o traduzem por «onagro».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz as duas perguntas retóricas de Deus.
- source_word: שִׁלַּח
  choice: deixou ... sair
  rationale: O piel perfeito de שלח, junto de חָפְשִׁי, expressa libertar ou deixar partir; esta formulação é natural em português.
- source_word: פֶּרֶא
  choice: jumento selvagem
  rationale: Designa o equídeo selvagem; «jumento selvagem» é claro e corrente para leitores de português.
- source_word: חָפְשִׁי
  choice: livre
  rationale: Descreve o estado de liberdade resultante da soltura e preserva diretamente a imagem hebraica.
- source_word: וּמֹסְרוֹת
  choice: as amarras
  rationale: O plural se refere a laços ou restrições; «amarras» é concreto, atual e combina naturalmente com «soltou».
- source_word: עָרוֹד
  choice: asno selvagem
  rationale: O termo designa outro asno ou jumento selvagem. A variação lexical mantém o paralelismo sem acrescentar ao hebraico a ideia incerta de rapidez.
- source_word: פִתֵּחַ
  choice: soltou
  rationale: Com «amarras», o verbo significa afrouxar, desatar ou soltar; «soltou» comunica isso com naturalidade.
