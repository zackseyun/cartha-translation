translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi preservada. “Faz seu ninho nas alturas” comunica de maneira idiomática a elevação do local do ninho, enquanto as notas registram as ambiguidades lexicais relevantes.
