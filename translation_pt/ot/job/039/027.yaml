  text: אִם עַל פִּ֭י/ךָ יַגְבִּ֣יהַּ נָ֑שֶׁר וְ֝/כִ֗י יָרִ֥ים קִנּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/027.yaml
  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: pt
  text: É por sua ordem[a] que a águia[b] se eleva[c] e faz seu ninho nas alturas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “segundo a sua boca”, expressão que significa “por sua ordem” ou “conforme a sua palavra”.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “águia” também pode designar, de modo mais amplo, uma grande ave de rapina, possivelmente incluindo um abutre em alguns contextos.
    reason: lexical_alternative
  - marker: c
    text: Ou “voa bem alto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: É ... que
  rationale: No contexto, introduz uma pergunta retórica, não uma condição; esta construção interrogativa é natural em português.
- source_word: עַל־פִּיךָ
  choice: por sua ordem
  rationale: A expressão significa literalmente “segundo a sua boca”, mas funciona como uma locução idiomática referente à ordem ou ao comando de alguém.
- source_word: יַגְבִּיהַּ
  choice: se eleva
  rationale: O hifil de גבה expressa subir ou alcançar grande altura; com uma ave como sujeito, “se eleva” preserva a imagem sem acrescentar detalhes.
- source_word: נָשֶׁר
  choice: águia
  rationale: É a tradução tradicional e adequada à imagem de voo e nidificação em lugares altos, embora o termo hebraico possa abranger certas grandes aves de rapina.
- source_word: וְכִי
  choice: e
  rationale: Coordena a segunda ação com a primeira dentro da mesma pergunta retórica.
- source_word: יָרִים קִנּוֹ
  choice: faz seu ninho nas alturas
  rationale: A expressão hebraica diz que a ave “eleva” o ninho; em português, a formulação escolhida comunica naturalmente que ela o estabelece em lugar alto, sem sugerir que carregue um ninho já pronto para cima.
