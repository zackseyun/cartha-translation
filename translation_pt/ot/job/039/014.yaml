  text: Pois ela deixa seus ovos no chão e os aquece sobre o pó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abandona seus ovos no chão”. O verbo hebraico pode ter um sentido mais forte do que simplesmente “deixa”; porém, a linha seguinte sugere que os ovos ficam expostos no chão, não necessariamente que sejam totalmente abandonados.'
