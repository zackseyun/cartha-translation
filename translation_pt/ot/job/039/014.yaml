lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da descrição anterior da avestruz, preservando a força causal ou explicativa do hebraico.
- source_word: תַעֲזֹב
  choice: deixa
  rationale: עזב pode significar deixar, abandonar ou desamparar. “Deixa” é natural neste contexto e não intensifica indevidamente a ideia de negligência absoluta.
- source_word: לָאָרֶץ
  choice: no chão
  rationale: Embora a construção seja literalmente “à terra”, “no chão” expressa com naturalidade em português a localização dos ovos e preserva a imagem concreta.
- source_word: בֵּצֶיהָ
  choice: seus ovos
  rationale: Tradução direta do substantivo plural com sufixo feminino singular, referente à avestruz do contexto.
- source_word: וְעַל עָפָר
  choice: sobre o pó
  rationale: Mantém a preposição e a imagem poética de עָפָר, com registro bíblico natural.
- source_word: תְּחַמֵּם
  choice: os aquece
  rationale: O Piel de חמם significa fazer aquecer ou manter quente. “Os aquece” é direto, legível e retoma naturalmente “ovos”, sem recorrer ao termo mais técnico “incuba”.
