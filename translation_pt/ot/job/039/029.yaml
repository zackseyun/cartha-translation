  rationale: Expressa de modo natural o ponto elevado de onde a águia observa e age.
- source_word: חָפַר
  choice: procura
  rationale: Embora o verbo geralmente signifique “cavar”, neste contexto descreve a busca da águia por alimento; “procura” transmite o sentido contextual sem introduzir uma imagem inadequada.
- source_word: אֹכֶל
  choice: alimento
  rationale: Mantém o sentido amplo do substantivo hebraico; “presa” seria possível no contexto, mas é mais específico.
- source_word: לְמֵרָחוֹק
  choice: de longe
  rationale: Tradução portuguesa clara e idiomática da expressão de grande distância.
- source_word: עֵינָיו יַבִּיטוּ
  choice: seus olhos observam
  rationale: Conserva a imagem concreta dos olhos como sujeito e o sentido de olhar dirigido, sem acrescentar ao verbo um objeto que não está explícito no hebraico.
