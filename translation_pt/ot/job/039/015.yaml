  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: pt
  text: e se esquece de que um pé pode esmagá-los[a], e um animal selvagem pode pisoteá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pode esmagá-la [...] pode pisoteá-la». O sufixo feminino singular provavelmente se refere coletivamente aos ovos ou às crias que ela deixou para trás.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: e se esquece
  rationale: O wayyiqtol qal na terceira pessoa feminina do singular prossegue a descrição vívida da avestruz; o presente é natural em português neste discurso poético.
- source_word: כִּי
  choice: de que
  rationale: Aqui a conjunção introduz o conteúdo daquilo que ela esquece, não uma oração causal.
- source_word: רֶגֶל
  choice: um pé
  rationale: 'O singular tem sentido indefinido e conserva a imagem concreta: qualquer pé poderia causar o dano.'
- source_word: תְּזוּרֶהָ
  choice: pode esmagá-los
  rationale: No contexto, o verbo indica dano causado ao se pisar. O sufixo feminino singular é vertido idiomaticamente no plural, referindo-se coletivamente aos ovos mencionados no contexto.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: e um animal selvagem
  rationale: A expressão significa literalmente «animal do campo» e, neste contexto, designa com naturalidade um animal silvestre terrestre.
- source_word: תְּדוּשֶׁהָ
  choice: pode pisoteá-los
  rationale: O verbo דושׁ significa pisar ou calcar; «pisotear» preserva a força da imagem e o paralelismo com a oração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção «se esquece de que» é idiomática; «animal selvagem» evita a formulação mais literal e menos natural «animal do campo».
