  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: pt
  text: Habita no penhasco e ali passa a noite[a], no dente do rochedo[b] e na fortaleza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e ali se aloja” ou “e ali pernoita”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dente do rochedo”, imagem hebraica de uma ponta ou saliência rochosa aguda.
    reason: cultural_note
  - marker: c
    text: Ou “lugar fortificado” ou “baluarte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: penhasco
  rationale: No primeiro uso, designa uma formação rochosa elevada e íngreme, habitat apropriado para a ave; “penhasco” é claro e natural em português.
- source_word: יִשְׁכֹּן
  choice: habita
  rationale: Expressa residência ou permanência habitual e mantém um registro poético digno sem soar arcaico.
- source_word: וְיִתְלֹנָן
  choice: e ali passa a noite
  rationale: O verbo indica alojar-se ou permanecer durante a noite; “ali” explicita naturalmente o lugar já mencionado.
- source_word: עַל
  choice: sobre
  rationale: Marca localização sobre a formação rochosa e preserva a relação espacial do hebraico.
- source_word: שֶׁן סֶלַע
  choice: o dente do rochedo
  rationale: Preserva a metáfora hebraica concreta de uma saliência ou ponta rochosa aguda, em vez de reduzi-la simplesmente a “pico”.
- source_word: סֶלַע
  choice: rochedo
  rationale: No segundo uso, “rochedo” mantém o campo semântico da formação rochosa e evita repetição pouco elegante de “penhasco”.
- source_word: וּמְצוּדָה
  choice: sua fortaleza
  rationale: מְצוּדָה denota fortaleza ou lugar seguro e inacessível. A formulação appositiva comunica que a saliência rochosa funciona como refúgio fortificado; o possessivo é contextual, não lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poeticamente digno, com boa legibilidade brasileira. A metáfora “dente do rochedo” foi mantida por sua força visual; “sua fortaleza” lê וּמְצוּדָה em aposição contextual, enquanto a nota registra a construção mais literal.
