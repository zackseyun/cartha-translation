  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: pt
  text: Com ímpeto e fúria, ele devora o chão[b] e não consegue ficar parado ao som da trombeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se contém ao som da trombeta”. O verbo é frequentemente traduzido de modo mais literal por “crer”, mas aqui parece ter sentido idiomático.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “engole o chão”, imagem vívida da velocidade e da avidez com que o cavalo avança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: Com ímpeto
  rationale: רַעַשׁ pode indicar tremor, tumulto ou comoção violenta. No contexto do cavalo de guerra, “ímpeto” comunica de modo natural a força impetuosa da arrancada sem sugerir necessariamente um terremoto.
- source_word: וְרֹגֶז
  choice: e fúria
  rationale: רֹגֶז abrange agitação, tremor e ira. Em paralelo com רַעַשׁ, “fúria” preserva a intensidade e a excitação feroz do cavalo.
- source_word: יְגַמֶּא
  choice: devora
  rationale: O verbo גמא significa literalmente engolir ou sorver. “Devora” conserva a metáfora vívida do cavalo que percorre rapidamente o terreno.
- source_word: אָרֶץ
  choice: o chão
  rationale: Neste contexto, אֶרֶץ designa o terreno sob o cavalo, não o mundo ou um território. “Chão” é claro, concreto e idiomático em português.
- source_word: וְלֹא יַאֲמִין
  choice: não consegue ficar parado
  rationale: Embora אמן no hifil costume significar “crer”, aqui pode ter o sentido idiomático de permanecer firme, conter-se ou ficar quieto. A tradução expressa a impaciência incontida do cavalo, mantendo em nota a alternativa lexical relevante.
- source_word: כִּי
  choice: ao
  rationale: Na construção com קוֹל שׁוֹפָר, a formulação “ao som” exprime naturalmente a circunstância desencadeadora e corresponde de perto ao sentido contextual.
- source_word: קוֹל שׁוֹפָר
  choice: som da trombeta
  rationale: שׁוֹפָר é uma trombeta ou buzina de chifre empregada como sinal, inclusive na batalha. “Trombeta” comunica com clareza essa função militar.
