  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: pt
  text: Seus filhotes ficam fortes; crescem em campo aberto[a]; saem e não voltam para elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na natureza” ou “em campo aberto e não cultivado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: ficam fortes
  rationale: Neste contexto, o verbo חלם descreve os filhotes adquirindo vigor e desenvolvendo-se de modo saudável; “ficam fortes” é natural e preserva a ideia de robustez.
- source_word: בְנֵיהֶם
  choice: seus filhotes
  rationale: Embora o termo signifique literalmente “seus filhos”, o contexto animal pede “filhotes”, sem restringir a referência aos machos.
- source_word: יִרְבּוּ
  choice: crescem
  rationale: רבה pode significar “multiplicar-se” ou “aumentar”, mas, no paralelismo sobre o desenvolvimento dos filhotes, “crescem” expressa adequadamente sua maturação sem tornar o verso artificial.
- source_word: בַבָּר
  choice: em campo aberto
  rationale: בָּר designa aqui terreno aberto e não cultivado. “Em campo aberto” conserva essa imagem, enquanto a nota registra uma alternativa contextual.
- source_word: יָצְאוּ
  choice: saem
  rationale: Tradução direta de יצא, indicando que os filhotes partem do lugar onde estavam com as mães.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: e não voltam para elas
  rationale: שוב com ל indica retorno às progenitoras. “Não voltam para elas” preserva a referência contextual sem acrescentar a ideia mais forte de “nunca”.
