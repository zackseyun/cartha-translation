  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: pt
  text: Você confiará nele para trazer de volta a sua semente e recolhê-la na sua eira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a sua semente”; neste contexto, a expressão provavelmente se refere ao cereal ou produto colhido e trazido do campo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין בּוֹ
  choice: Você confiará nele
  rationale: O hifil de אמן, com בּוֹ, expressa depositar confiança no boi selvagem; “confiará nele” conserva tanto o sentido prático de depender do animal quanto a forma interrogativa.
- source_word: כִּי
  choice: para
  rationale: A conjunção introduz o conteúdo ou resultado esperado dessa confiança. Em português, “confiar nele para” comunica essa relação com mais naturalidade do que o literal “confiar nele que”.
- source_word: יָשׁוּב
  choice: trazer de volta
  rationale: 'Embora שׁוב signifique normalmente “voltar”, aqui o objeto expresso exige sentido transitivo/contextual: fazer a semente ou produção voltar do campo.'
- source_word: זַרְעֶךָ
  choice: a sua semente
  rationale: Mantém o sentido lexical direto de זֶרַע e a ambiguidade entre semente e, metonimicamente, cereal ou produto colhido; a nota esclarece o provável referente contextual.
- source_word: וְגָרְנְךָ יֶאֱסֹף
  choice: e recolhê-la à sua eira
  rationale: גֹּרֶן designa especificamente a eira, e אָסַף significa recolher ou ajuntar. O pronome feminino retoma naturalmente “semente” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. “Eira” preserva o termo agrícola preciso; a formulação mantém a pergunta retórica e a referência masculina ao boi selvagem.
