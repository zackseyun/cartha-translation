base_translation:
  language: en
  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: pt
  text: As asas da avestruz batem com alegria — seriam elas as penas de voo e a plumagem da cegonha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As asas da avestruz batem orgulhosamente, mas seriam elas as penas de voo e a plumagem da cegonha?” O hebraico é difícil e tem sido entendido de várias maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: asas
  rationale: O singular hebraico tem sentido coletivo; o plural é natural em português para a anatomia pareada da ave.
- source_word: רְנָנִים
  choice: da avestruz
  rationale: No contexto zoológico de Jó 39, o termo designa a avestruz, embora sua forma e etimologia permitam associações com gritos ou canto.
- source_word: נֶעֱלָסָה
  choice: batem alegremente
  rationale: A forma verbal comunica movimento exuberante ou exultação; aplicada às asas, esta expressão reúne ação física e alegria.
- source_word: אִם
  choice: mas seriam elas
  rationale: A partícula introduz uma comparação interrogativa e possivelmente contrastiva. A formulação preserva a força retórica sem transformar a comparação em afirmação.
- source_word: אֶבְרָה
  choice: penas de voo
  rationale: O termo indica penas maiores da asa ou rêmiges. 'Penas de voo' é específico e mais acessível ao leitor comum do que o tecnicismo 'rêmiges'.
- source_word: חֲסִידָה
  choice: da cegonha
  rationale: Neste contexto, a palavra é o nome da ave, 'cegonha', e não o adjetivo relacionado a lealdade ou bondade.
- source_word: וְנֹצָה
  choice: e a plumagem
  rationale: O substantivo se refere às penas ou à plumagem; 'plumagem' mantém o tom poético e combina bem com 'penas de voo'.
