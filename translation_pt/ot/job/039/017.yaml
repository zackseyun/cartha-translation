  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: pt
  text: porque Deus a privou de sabedoria e não lhe concedeu uma porção de entendimento[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque Deus a fez esquecer a sabedoria” ou “porque Deus fez com que lhe faltasse sabedoria”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não lhe repartiu em entendimento”, isto é, não lhe concedeu uma porção de entendimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa do comportamento da avestruz no contexto e preserva de modo natural a força causal.
- source_word: הִשָּׁהּ
  choice: a privou de
  rationale: 'Expressa o sentido causativo do hifil de נשה: Deus fez com que a sabedoria lhe faltasse. A formulação é idiomática sem reduzir o verbo a simples esquecimento.'
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a tradução padrão do título divino singular empregado em Jó, sem expansão não exigida pelo contexto.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Designa aqui o juízo sensato ou a capacidade instintiva; “sabedoria” é direto e adequado ao paralelismo.
- source_word: וְלֹא
  choice: e não
  rationale: Mantém de forma clara a coordenação e a negação hebraicas.
- source_word: חָלַק לָהּ
  choice: lhe deu parte
  rationale: Conserva a ideia distributiva de חלק, isto é, atribuir ou repartir uma porção, em português natural.
- source_word: בַּבִּינָה
  choice: no entendimento
  rationale: Preserva a distinção semântica em relação a “sabedoria” e reflete a preposição hebraica na expressão “parte no entendimento”.
theological_decisions:
- issue: A ação de Deus na falta de sabedoria da avestruz
  choice: 'Deus permanece como sujeito explícito: ele a privou de sabedoria e não lhe deu parte no entendimento.'
  alternative: Suavizar a atribuição, traduzindo apenas que ela “não tem sabedoria”.
  rationale: O hebraico nomeia explicitamente Deus como agente. A tradução conserva essa tensão teológica em vez de atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “lhe deu parte no entendimento” preserva a imagem distributiva do hebraico, enquanto a nota esclarece sua forma mais literal.
