  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: pt
  text: Ele ri do medo[a] e não se intimida; não recua diante da espada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “zomba do medo”. O verbo hebraico pode transmitir desprezo ou zombaria, além de riso.'
