    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: ri
  rationale: O Qal imperfeito de שׂחק preserva aqui a imagem vívida do cavalo que reage ao perigo com riso destemido; a possível nuance de zombaria fica indicada em nota.
- source_word: לְפַחַד
  choice: do medo
  rationale: פחד designa medo, pavor ou terror. Em português, “rir do medo” expressa de modo natural a construção hebraica com ל sem intensificar desnecessariamente o termo.
- source_word: יֵחָת
  choice: não se intimida
  rationale: O Nifal de חתת pode indicar ficar quebrantado, aterrorizado ou consternado. No contexto da coragem em combate, “não se intimida” comunica com clareza que o cavalo não se deixa abalar pelo perigo.
- source_word: יָשׁוּב
  choice: não recua
  rationale: שׁוב significa voltar ou voltar atrás; no cenário militar, “recuar” é a equivalência portuguesa mais natural e concisa.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: A expressão מִפְּנֵי apresenta a ameaça em face da qual alguém poderia retroceder. “Diante de” mantém essa imagem espacial e funciona naturalmente com “recuar”.
- source_word: חָרֶב
  choice: a espada
  rationale: חרב é o singular “espada”, empregado aqui como imagem representativa da ameaça armada no combate; o artigo definido preserva essa referência genérica.
