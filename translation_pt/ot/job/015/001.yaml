lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Traduz ענה na fórmula narrativa de réplica. “Respondeu” indica naturalmente que Elifaz reage ao discurso anterior de Jó.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio hebraico em português.
- source_word: הַתֵּימָנִי
  choice: o temanita
  rationale: Preserva de forma concisa o gentílico hebraico que identifica Elifaz como natural ou habitante de Temã.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Mantém o segundo verbo da fórmula hebraica “respondeu e disse”, sem eliminar a repetição presente no texto-fonte.
- source_word: וַ
  choice: Então
  rationale: Expressa a progressão narrativa indicada pelo waw inicial de maneira natural no português moderno.
