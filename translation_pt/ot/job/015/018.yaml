  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: pt
  text: o que os sábios declararam[a] e não esconderam de seus pais—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o que seus pais não esconderam», ou: «e nada esconderam do que receberam de seus pais». O hebraico permite mais de uma interpretação da relação entre «esconderam» e «seus pais».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: o que
  rationale: Introduz o conteúdo retomado do versículo anterior; «o que» é natural em português e corresponde ao valor relativo de «aquilo que».
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O substantivo masculino plural designa concretamente os sábios transmissores da tradição; «os sábios» é corrente e digno em português.
- source_word: יַגִּידוּ
  choice: declaram
  rationale: O hifil de נגד expressa tornar conhecido ou declarar; o presente mantém o caráter geral da afirmação e o tom elevado.
- source_word: וְלֹא
  choice: e não
  rationale: Coordena e nega a segunda ação sem acrescentar uma relação temporal ausente do hebraico.
- source_word: כִחֲדוּ
  choice: esconderam
  rationale: O verbo significa esconder ou ocultar; «esconderam» é claro e preserva a imagem verbal do hebraico.
- source_word: מֵאֲבוֹתָם
  choice: de seus pais
  rationale: Reproduz de modo compacto a preposição מִן com «seus pais», sem decidir se os pais são a fonte da tradição ou aqueles de quem algo não foi escondido.
theological_decisions:
- issue: Relação sintática de מֵאֲבוֹתָם com כִחֲדוּ
  choice: não esconderam de seus pais
  alternative: o que seus pais não esconderam; e nada esconderam do que receberam de seus pais
  rationale: O hebraico é sintaticamente compacto e admite mais de uma construção. O texto principal conserva a formulação direta e a nota registra as leituras possíveis, evitando resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O travessão preserva a continuidade sintática com o contexto. A formulação deliberadamente compacta mantém a ambiguidade do hebraico.
