  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: pt
  text: Na verdade, você anula[a] o temor de Deus[b] e reduz a meditação[c] diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enfraquece o temor” ou “torna o temor sem efeito”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “temor”; neste contexto, provavelmente o temor de Deus, isto é, a reverência dirigida a ele.'
    reason: lexical_alternative
  - marker: c
    text: Ou “oração”, “devoção” ou “queixa diante de Deus”; o termo hebraico pode indicar reflexão ou fala dirigida a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Na verdade
  rationale: A partícula tem força enfática nesta acusação de Elifaz; “Na verdade” transmite essa ênfase de modo natural em português.
- source_word: אַתָּה
  choice: você
  rationale: O pronome hebraico de segunda pessoa masculina singular está expresso para dar ênfase. “Você” oferece leitura ampla e natural, especialmente para leitores brasileiros.
- source_word: תָּפֵר
  choice: anula
  rationale: A forma causativa de פרר significa quebrar, invalidar ou tornar sem efeito. “Anula” preserva a força incisiva da acusação.
- source_word: יִרְאָה
  choice: o temor de Deus
  rationale: O substantivo significa temor ou reverência. Neste contexto religioso, e em paralelo com “diante de Deus”, “o temor de Deus” torna explícito o referente implícito sem reduzir o termo a mero medo.
- source_word: וְתִגְרַע
  choice: e reduz
  rationale: גרע significa diminuir, reduzir ou retirar. “Reduz” é claro e natural, mantendo o paralelismo verbal.
- source_word: שִׂיחָה
  choice: a meditação
  rationale: שִׂיחָה pode indicar meditação, reflexão, oração, queixa ou fala. “Meditação” conserva melhor sua amplitude reflexiva e religiosa neste contexto.
- source_word: לִפְנֵי אֵל
  choice: diante de Deus
  rationale: A expressão significa literalmente “diante de Deus” ou “na presença de Deus”; a forma escolhida é concisa, digna e natural.
theological_decisions:
- issue: Sentido religioso de יִרְאָה
  choice: o temor de Deus
  alternative: temor; reverência
  rationale: Elifaz acusa Jó de prejudicar a piedade, não de eliminar o medo em sentido genérico. A explicitação “de Deus” corresponde ao paralelo “diante de Deus”, enquanto a nota preserva a forma mais concisa do hebraico.
- issue: Sentido de שִׂיחָה em relação a Deus
  choice: meditação
  alternative: oração; devoção; queixa
  rationale: O termo hebraico é semanticamente amplo. “Meditação” mantém essa abertura melhor que “oração”, que seria mais específica, sem excluir uma reflexão dirigida a Deus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético foi mantido; as ambiguidades reais de יִרְאָה e שִׂיחָה aparecem nas notas.
