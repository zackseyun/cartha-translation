base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: pt
  text: Você ouviu no conselho de Deus[a] e reservou a sabedoria para si?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o segredo de Deus” ou “o conselho confidencial de Deus”. O hebraico סוֹד pode indicar um conselho reservado, um círculo íntimo ou uma deliberação secreta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: no conselho
  rationale: סוֹד pode designar um conselho confidencial, um círculo íntimo ou uma deliberação secreta. “No conselho” preserva aqui a imagem de acesso privilegiado à deliberação divina.
- source_word: אֱלוֹהַ
  choice: de Deus
  rationale: אֱלוֹהַ é a forma singular para “Deus”, muito frequente em Jó.
- source_word: תִּשְׁמָע
  choice: você ouviu
  rationale: שׁמע pode significar ouvir ou escutar. O pretérito perfeito em uma pergunta retórica comunica naturalmente a alegação de que Jó teria tido acesso ao conselho divino.
- source_word: וְ/תִגְרַע
  choice: e restringiu
  rationale: גרע significa diminuir, reduzir, subtrair ou reter. Com אֵלֶיךָ חָכְמָה, “restringiu” preserva a ideia de limitar a sabedoria exclusivamente a si.
- source_word: אֵלֶיךָ
  choice: a você mesmo
  rationale: A preposição אֶל com o sufixo de segunda pessoa indica direção ou relação com o interlocutor; no contexto, expressa apropriação exclusiva.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: Equivalente corrente de חָכְמָה, aqui no sentido geral de sabedoria ou discernimento.
theological_decisions:
- issue: Sentido de סוֹד em referência a Deus
  choice: conselho de Deus
  alternative: segredo de Deus; conselho confidencial de Deus
  rationale: A pergunta de Elifaz ridiculariza a pretensão de Jó a um acesso privilegiado às deliberações divinas. “Conselho” mantém a possível imagem de uma assembleia deliberativa, enquanto a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à interpelação direta. “Será que” marca com naturalidade a força retórica da pergunta sem eliminar sua forma interrogativa.
