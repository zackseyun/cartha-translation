  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: pt
  text: Eles concebem sofrimento e dão à luz maldade[a]; seu ventre prepara o engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles ficam grávidos de sofrimento e geram iniquidade”.'
    reason: Alternativa lexical e metafórica que reproduz mais literalmente o estado de gravidez expresso pelo particípio e outra acepção possível de אָוֶן.
lexical_decisions:
- source_word: הָרֹה
  choice: concebem
  rationale: O particípio qal de הרה integra a metáfora de gestação e parto. “Concebem” é natural em português e mantém a sequência figurada com “dão à luz”.
- source_word: עָמָל
  choice: sofrimento
  rationale: עמל pode indicar sofrimento, desgraça, fadiga ou ação nociva. “Sofrimento” conserva a amplitude poética do termo, embora “maldade” também seja possível neste contexto moral.
- source_word: וְיָלֹד
  choice: dão à luz
  rationale: O verbo ילד pertence diretamente ao campo semântico do parto; “dão à luz” torna explícita e natural a imagem em português.
- source_word: אָוֶן
  choice: maldade
  rationale: און pode denotar perversidade, iniquidade, mal ou desgraça. Em paralelo com “engano” e na acusação moral de Elifaz, “maldade” comunica adequadamente sua força ética.
- source_word: וּבִטְנָם
  choice: seu ventre
  rationale: בטן significa ventre ou interior e, aqui, sustenta a imagem gestacional. O possessivo singular “seu” pode ter referente plural em português, acompanhando o sentido coletivo do sujeito.
- source_word: תָּכִין
  choice: prepara
  rationale: O hifil de כון significa preparar, tornar pronto ou estabelecer. “Prepara” preserva a ideia de algo formado internamente antes de vir à luz.
- source_word: מִרְמָה
  choice: engano
  rationale: מרמה denota engano, fraude ou traição. “Engano” é corrente, conciso e não restringe indevidamente o sentido.
theological_decisions:
- issue: Número do sujeito implícito
  choice: 'Plural genérico: “Eles concebem... seu ventre...”'
  alternative: 'Singular representativo: “Ele concebe... seu ventre...”'
  rationale: Embora הָרֹה esteja no singular, o sufixo de terceira pessoa masculina plural em וּבִטְנָם e o contexto, que descreve os perversos como classe, favorecem o plural genérico. A tensão gramatical é reconhecida sem transformar o verso numa afirmação sobre um indivíduo específico.
- issue: Relação semântica entre עָמָל e אָוֶן
  choice: “sofrimento” e “maldade”
  alternative: “maldade” e “iniquidade”
  rationale: Os dois substantivos possuem campos semânticos parcialmente sobrepostos. A tradução escolhida evita uma repetição niveladora e conserva tanto a consequência danosa quanto a dimensão moral, sem impor uma distinção absoluta entre os termos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora contínua de concepção, parto e ventre foi preservada; evitou-se linguagem excessivamente técnica ou confessional.
