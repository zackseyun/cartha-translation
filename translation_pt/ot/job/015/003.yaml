base_translation:
  language: en
  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: pt
  text: Acaso ele deve argumentar com palavras inúteis[a] ou com discursos pelos quais nada se consegue?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso ele deve arrazoar com fala sem proveito ou com palavras pelas quais nada se consegue?”'
    reason: Alternativa lexical para הוֹכֵחַ e דָבָר; a formulação «pelas quais nada se consegue» explicita o valor instrumental de בָּם sem restringir o benefício a uma leitura específica.
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: argumentar
  rationale: O infinitivo absoluto de יכח tem aqui força verbal no contexto interrogativo e pode expressar argumentar, contestar ou arrazoar. “Argumentar” se ajusta ao debate entre Elifaz e Jó sem impor uma nuance jurídica ou de repreensão formal.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: com palavras inúteis
  rationale: דָבָר designa aqui fala ou palavras, em paralelo com מִלִּים. סכן comunica utilidade ou proveito; “palavras inúteis” expressa de modo natural a fala que não beneficia.
- source_word: וּמִלִּים
  choice: ou com discursos
  rationale: מִלִּים significa “palavras”, mas “discursos” evita repetição rígida e preserva o paralelismo sinonímico. A conjunção é vertida como “ou” para formar uma pergunta retórica natural em português.
- source_word: לֹא יוֹעִיל בָּם
  choice: que não trazem proveito
  rationale: יועיל significa trazer benefício, ajudar ou ser proveitoso. O sufixo em בָּם remete às palavras; a formulação conserva a ideia de fala que não produz benefício.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com forma interrogativa retórica. “Acaso” explicita naturalmente a força interrogativa fornecida pelo contexto; o paralelismo hebraico é preservado sem repetição excessivamente rígida.
