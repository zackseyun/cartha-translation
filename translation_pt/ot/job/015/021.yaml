base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: pt
  text: Há sons aterradores em seus ouvidos; na prosperidade[a], o destruidor vem sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em paz” ou “em segurança”; o hebraico שָׁלוֹם pode indicar paz, bem-estar, segurança ou prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Um som
  rationale: קוֹל pode significar “som” ou “voz”. Como está ligado a פְּחָדִים, indica aqui algo ouvido, não necessariamente fala articulada; “som” preserva melhor essa ideia.
- source_word: פְּחָדִים
  choice: terrores
  rationale: O plural expressa terrores ou alarmes aterradores, com mais força do que o simples sentimento interior de medo.
- source_word: בְּאָזְנָיו
  choice: está em seus ouvidos
  rationale: Mantém a imagem concreta do hebraico, literalmente “em seus ouvidos”, sem acrescentar a noção de que o som “ressoa”.
- source_word: בַּשָּׁלוֹם
  choice: em plena prosperidade
  rationale: שָׁלוֹם pode indicar paz, segurança, bem-estar ou prosperidade. Neste contexto, “prosperidade” comunica a condição favorável na qual a calamidade chega de repente; “plena” torna natural em português a construção circunstancial.
- source_word: שׁוֹדֵד
  choice: o destruidor
  rationale: O particípio designa quem devasta ou saqueia. “Destruidor” é claro, amplo e adequado ao contexto de ruína, sem restringir a ação ao saque.
- source_word: יְבוֹאֶנּוּ
  choice: vem sobre ele
  rationale: A forma verbal significa literalmente que o agente “vem” com um sufixo de objeto masculino singular. “Vem sobre ele” transmite a chegada hostil e preserva o presente vívido da poesia hebraica.
