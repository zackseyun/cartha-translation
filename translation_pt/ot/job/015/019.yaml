  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: pt
  text: Somente a eles foi dada a terra[a], e nenhum estrangeiro passou entre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica também pode referir-se à terra em sentido amplo, isto é, ao mundo. Neste contexto, pode indicar o território dado exclusivamente a esse povo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e nenhum estranho passou pelo meio deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: Somente a eles
  rationale: A combinação do dativo לָהֶם com לְבַדָּם enfatiza exclusividade. “Somente a eles” é natural em português e preserva essa ênfase.
- source_word: נִתְּנָה
  choice: foi dada
  rationale: O nifal de נתן tem sentido passivo; “foi dada” mantém de modo direto a voz do hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto um território. Aqui, a ideia de concessão exclusiva e ausência de estrangeiros favorece o sentido territorial, embora o português “terra” preserve parte da amplitude lexical.
- source_word: זָר
  choice: estrangeiro
  rationale: זָר indica alguém alheio ao grupo. “Estrangeiro” expressa isso claramente sem especificar uma etnia ou nacionalidade.
- source_word: עָבַר בְּתוֹכָם
  choice: passou pelo meio deles
  rationale: A expressão combina movimento com localização no interior do grupo. “Passou pelo meio deles” é corrente, digna e próxima da estrutura hebraica.
