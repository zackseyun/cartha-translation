source:
  edition: WLC
  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: pt
  text: 'pois estendeu a mão contra Deus[a]

    e se mostrou poderoso contra o Todo-Poderoso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois estendeu a mão em direção a Deus e se fortaleceu contra o Todo-Poderoso”.'
    reason: Preserva os sentidos mais literais de אֶל (“em direção a”) e יִתְגַּבָּר (“fortalecer-se”), que também são possíveis.
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do juízo descrito no contexto. “Pois” preserva a ligação causal e funciona naturalmente neste verso poético.
- source_word: נָטָה ... יָדוֹ
  choice: estendeu a mão
  rationale: Mantém a imagem concreta do hebraico; no contexto, o gesto expressa oposição hostil.
- source_word: אֶל
  choice: contra
  rationale: Embora normalmente indique direção (“para”), o contexto hostil pede “contra” em português. A alternativa mais literal é registrada em nota.
- source_word: אֵל
  choice: Deus
  rationale: Traduz o título divino de modo simples e o distingue de שַׁדַּי no segundo membro do paralelismo.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução corrente e inteligível do título divino, preservando o contraste irônico com a força que o ser humano atribui a si mesmo.
- source_word: יִתְגַּבָּר
  choice: se mostrou poderoso
  rationale: Preserva o valor reflexivo do hitpael e a ideia de alguém que se apresenta ou se faz forte diante de Deus.
theological_decisions:
- issue: Títulos divinos no paralelismo
  choice: “Deus” para אֵל e “o Todo-Poderoso” para שַׁדַּי
  alternative: “Deus” e “Shaddai”
  rationale: A tradução dos dois títulos comunica seu sentido ao leitor comum e mantém a distinção poética entre eles.
- issue: Caráter da ação humana diante de Deus
  choice: “contra Deus” e “se mostrou poderoso”
  alternative: “em direção a Deus” e “se fortalece”
  rationale: O contexto indica hostilidade, mas a nota conserva a formulação direcional e reflexiva mais estritamente lexical, sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura poética em dois membros. O pretérito perfeito traduz naturalmente as ações verbais no contexto. O marcador [a] aparece no texto principal.
