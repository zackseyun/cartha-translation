base_translation:
  language: en
  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: pt
  text: É a sua própria boca que o condena, não eu; são os seus próprios lábios que testemunham contra você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “respondem contra você”. O verbo hebraico pode significar mais literalmente “responder”, mas aqui provavelmente tem o sentido de dar testemunho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: o condena
  rationale: O hifil de רשע significa declarar culpado ou condenar; “condena” preserva a força forense e soa natural em português.
- source_word: פִיךָ
  choice: a sua própria boca
  rationale: Literalmente, “sua boca”. “Própria” explicita a ênfase contextual de que as palavras de Jó o incriminam.
- source_word: וְלֹא אָנִי
  choice: não eu
  rationale: Mantém de modo conciso o contraste enfático do hebraico entre a boca de Jó e o próprio Elifaz.
- source_word: וּשְׂפָתֶיךָ
  choice: os seus próprios lábios
  rationale: Traduz literalmente a imagem dos lábios e reproduz a ênfase paralela de autoincriminação.
- source_word: יַעֲנוּ
  choice: testemunham
  rationale: 'Embora o verbo possa significar “responder”, neste contexto seu uso tem provável nuance forense: as palavras de Jó depõem contra ele.'
- source_word: בָךְ
  choice: contra você
  rationale: Com a nuance forense do verbo, a preposição indica que o testemunho é adverso a Jó.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A construção clivada (“É... que”; “são... que”) preserva com naturalidade a ênfase de que a condenação procede das próprias palavras de Jó, não de Elifaz.
