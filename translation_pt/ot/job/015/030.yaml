source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: pt
  text: Ele não se afastará das trevas; uma chama ressecará seus brotos[a], e ele desaparecerá pelo sopro de sua boca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Seus brotos” mantém a imagem vegetal: o ímpio é retratado como uma árvore cuja vegetação nova é queimada e ressecada.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “e ele desaparecerá pelo sopro da boca de Deus”, caso o pronome seja entendido como referência a Deus, e não ao ímpio.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: não escapará das trevas
  rationale: סור com מן expressa afastar-se ou livrar-se de algo. Em português corrente, “não escapará das trevas” comunica naturalmente que o ímpio não conseguirá fugir da calamidade, embora seja um pouco mais interpretativo que “não se afastará”.
- source_word: יֹנַקְתּוֹ
  choice: seus brotos
  rationale: O substantivo designa broto ou rebento de uma planta. “Brotos” preserva com clareza a imagem do ímpio como árvore cuja vegetação nova é destruída.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: uma chama ressecará
  rationale: O Piel de יבש significa secar, ressecar ou fazer murchar, e שַׁלְהֶבֶת denota chama. “Ressecará” combina naturalmente com os brotos e mantém a imagem de destruição pelo fogo.
- source_word: וְיָסוּר
  choice: ele desaparecerá
  rationale: Aqui סור indica a remoção ou o fim do ímpio. “Desaparecerá” transmite o resultado em português idiomático sem precisar definir mais precisamente o modo de sua perdição.
- source_word: בְּרוּחַ פִּיו
  choice: pelo sopro de sua boca
  rationale: רוּחַ pode significar sopro, vento ou espírito. Com “boca”, “sopro” é o sentido concreto mais provável e preserva a possível alusão tanto à fala destrutiva do ímpio quanto ao sopro de juízo divino.
- source_word: פִּיו
  choice: sua boca
  rationale: O sufixo masculino singular remete mais naturalmente ao ímpio, o referente imediato. Como também pode ser entendido como referência à boca de Deus, a ambiguidade é registrada em nota.
theological_decisions:
- issue: Referente de “sua boca” na oração final
  choice: a boca do ímpio
  alternative: a boca de Deus
  rationale: A continuidade sintática favorece o ímpio como referente do pronome. Entretanto, a linguagem do sopro da boca também pode evocar o juízo divino; por isso, a alternativa é preservada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora vegetal e sinaliza, por meio de nota, a ambiguidade do referente no último sintagma.
