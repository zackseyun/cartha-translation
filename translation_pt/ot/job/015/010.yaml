  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: pt
  text: Tanto os de cabelos brancos como os idosos estão entre nós, mais velhos que seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “grande/poderoso em dias, mais do que seu pai”; no contexto, o sentido é “mais velho que seu pai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: tanto ... como
  rationale: A construção correlativa expressa a ênfase inclusiva dos dois grupos e soa natural em português.
- source_word: שָׂב
  choice: gente de cabelos brancos
  rationale: Preserva a imagem concreta dos cabelos brancos como sinal de idade avançada, sem restringir desnecessariamente o termo ao sexo masculino.
- source_word: יָשִׁישׁ
  choice: pessoas muito idosas
  rationale: Distingue o termo do paralelo anterior e comunica sua possível intensificação da idade avançada.
- source_word: בָּנוּ
  choice: entre nós há
  rationale: 'Expressa de modo idiomático o sentido social e locativo: esses anciãos pertencem ao círculo ou à comunidade representada por Elifaz.'
- source_word: כַּבִּיר
  choice: com mais anos de vida
  rationale: No contexto comparativo, modificado por 'dias', indica superioridade em idade, embora seu sentido lexical básico seja 'grande' ou 'poderoso'.
- source_word: מֵאָבִיךָ יָמִים
  choice: do que seu pai
  rationale: Completa naturalmente em português a comparação de idade formulada no hebraico como superioridade em 'dias'.
