base_translation:
  language: en
  yaml_path: translation/ot/job/015/017.yaml
  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: pt
  text: Eu lhe direi[a]; escute-me. Relatarei o que vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhe mostrarei”.'
    reason: Alternativa lexical para אֲחַוְךָ; o verbo pode introduzir a exposição de Elifaz com o sentido de mostrar ou fazer saber.
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: Eu lhe direi
  rationale: O piel de חוה introduz o que Elifaz está prestes a expor. “Direi” comunica naturalmente o ato de falar, sem sugerir uma demonstração visual.
- source_word: שְׁמַע לִי
  choice: escute-me
  rationale: O imperativo com לִי pede atenção dirigida ao falante. “Escute-me” é corrente e preserva a força do apelo.
- source_word: וְזֶה חָזִיתִי
  choice: O que vi, isso
  rationale: A formulação mantém o valor demonstrativo de זֶה por meio de “isso”, ao mesmo tempo que expressa em português natural a relação com חָזִיתִי.
- source_word: חָזִיתִי
  choice: vi
  rationale: O perfeito indica a observação pessoal reivindicada por Elifaz. Em português, o pretérito perfeito simples expressa isso de modo natural e direto.
- source_word: וַאֲסַפֵּרָה
  choice: relatarei
  rationale: A forma cohortativa exprime a intenção de narrar ou expor aquilo que foi observado. “Relatarei” conserva essa nuance melhor do que o genérico “direi”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal de boa legibilidade brasileira. A repetição enfática “O que vi, isso relatarei” preserva o demonstrativo hebraico e o paralelismo do discurso.
