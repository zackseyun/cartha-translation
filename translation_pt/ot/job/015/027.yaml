lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão ou explicação da descrição anterior, preservando a força causal.
- source_word: כִסָּה
  choice: cobriu
  rationale: O verbo significa cobrir ou ocultar; o pretérito perfeito é natural na sequência poética em português.
- source_word: פָנָיו
  choice: o rosto
  rationale: O sentido concreto de 'rosto' corresponde ao paralelismo da imagem corporal.
- source_word: בְּחֶלְבּוֹ
  choice: com a sua gordura
  rationale: Mantém a metáfora corporal concreta de prosperidade excessiva ou autocomplacência, sem a tornar abstrata.
- source_word: וַיַּעַשׂ
  choice: acumulou
  rationale: Embora o verbo tenha o sentido amplo de 'fazer', aqui uma formulação idiomática comunica a formação ou deposição de gordura corporal.
- source_word: פִּימָה
  choice: gordura
  rationale: O substantivo raro provavelmente indica espessura ou camada adiposa; 'gordura' é claro e preserva a imagem.
- source_word: עֲלֵי
  choice: sobre
  rationale: Expressa de modo natural a relação espacial indicada pela preposição.
- source_word: כָסֶל
  choice: os quadris
  rationale: O termo pode designar lombos, flancos ou quadris; 'quadris' é corporalmente claro para leitores modernos, sem precisão indevida.
