  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: pt
  text: A aflição e a angústia o aterrorizam; elas o dominam como um rei pronto para o combate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o ataque”. A palavra hebraica traduzida como “combate” é rara e talvez se refira mais especificamente a um ataque armado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: o aterrorizam
  rationale: O piel de בעת expressa causar terror ou pavor intenso; “aterrorizam” preserva essa força causativa em português natural.
- source_word: צַר
  choice: aflição
  rationale: O substantivo denota aperto, adversidade ou aflição. A escolha é clara e forma um paralelismo poético natural com “angústia”.
- source_word: מְצוּקָה
  choice: angústia
  rationale: O termo comunica pressão severa, situação angustiante ou aperto. “Angústia” distingue os dois membros do paralelismo sem enfraquecer sua intensidade.
- source_word: תִּתְקְפֵהוּ
  choice: elas o dominam
  rationale: Embora o verbo hebraico esteja formalmente no feminino singular, o contexto apresenta “aflição e angústia” como forças associadas. O plural é mais natural em português, e “dominam” preserva a ideia de prevalecer poderosamente sobre alguém.
- source_word: כְּמֶלֶךְ
  choice: como um rei
  rationale: Reproduz diretamente a comparação introduzida por כְּ, com formulação idiomática em português.
- source_word: עָתִיד
  choice: pronto
  rationale: No contexto militar, o termo indica alguém preparado ou disposto para agir; “pronto” é conciso e natural.
- source_word: לַכִּידוֹר
  choice: para o combate
  rationale: כידור é um termo raro e incerto, mas o contexto favorece uma ação militar. “Combate” comunica o sentido provável sem especificar indevidamente a forma do ataque.
