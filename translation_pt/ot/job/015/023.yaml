source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: pt
  text: 'Ele vagueia em busca de pão[a]: “Onde está?” Ele sabe que um dia de escuridão é iminente para ele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimento”. Em hebraico, “pão” também pode designar comida em geral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em sua mão”. A expressão provavelmente indica que o dia de escuridão está próximo ou iminente para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: vagueia
  rationale: O particípio qal descreve uma ação contínua e inquieta de andar sem rumo definido; “vagueia” preserva esse sentido sem pressupor exílio ou condição de fugitivo.
- source_word: לַלֶּחֶם
  choice: em busca de pão
  rationale: לֶחֶם significa literalmente “pão”, embora também possa designar alimento em geral. A expressão “em busca de” torna natural em português a finalidade indicada pela preposição.
- source_word: אַיֵּה
  choice: Onde está?
  rationale: O interrogativo significa “onde?”. O verbo e o referente implícitos são supridos em português a partir de “pão”, preservando a concisão e o desespero da procura.
- source_word: יָדַע
  choice: Ele sabe
  rationale: O perfeito de ידע expressa conhecimento ou consciência já estabelecida; “sabe” é a correspondência mais direta.
- source_word: נָכוֹן
  choice: está preparado
  rationale: A forma transmite a ideia de algo preparado, pronto ou estabelecido. “Está preparado” conserva essa noção sem tornar explícita a causa da calamidade.
- source_word: בְּיָדוֹ
  choice: próximo dele
  rationale: A expressão é literalmente “em sua mão”, mas aqui provavelmente indica que o dia de escuridão está perto ou iminente para ele. “Próximo dele” comunica essa proximidade em português natural.
- source_word: יוֹם חֹשֶׁךְ
  choice: um dia de escuridão
  rationale: A construção descreve um dia caracterizado pela escuridão. A tradução mantém a imagem hebraica sem reduzi-la a “calamidade”, “condenação” ou “juízo”.
theological_decisions:
- issue: Força metafórica de “dia de escuridão”
  choice: um dia de escuridão
  alternative: um dia de calamidade; o dia da condenação; um dia de juízo
  rationale: No discurso de Elifaz, a expressão aponta para uma desgraça iminente que atingirá o perverso, mas o hebraico permanece imagético e não identifica expressamente essa desgraça como um ato específico de juízo divino. A imagem e sua tensão teológica foram preservadas.
- issue: Sentido de בְּיָדוֹ
  choice: próximo dele
  alternative: em sua mão; ao seu alcance; reservado para ele
  rationale: A formulação literal é ambígua. O contexto favorece a iminência do dia sombrio, mas a nota registra a imagem hebraica para não ocultar a possibilidade de outras nuances.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. “Vagueia” mantém o tom poético; “em busca de pão” é idiomático sem perder a imagem concreta. A pergunta direta conserva a urgência do hebraico, e as notas registram as duas extensões semânticas relevantes.
