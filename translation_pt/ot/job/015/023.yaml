  rationale: A revisão elimina o gerúndio interpretativo “perguntando” e reproduz de modo mais direto a justaposição hebraica entre a procura por pão e a pergunta. Também substitui a dupla explicação “preparado e próximo” por “iminente”, que expressa de forma idiomática o sentido contextual provável de “pronto em sua mão”; a nota conserva a formulação literal e a incerteza interpretativa.
