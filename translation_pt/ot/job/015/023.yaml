  terminology: “Pão”, “dia de escuridão” e “vagueia” são escolhas adequadas. A nota sobre “pão” como alimento em geral é pertinente. A nota sobre “em sua mão” deve indicar que o sentido provável é a proximidade ou iminência, sem apresentar essa explicação como certeza absoluta.
