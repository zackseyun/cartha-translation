  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: pt
  text: Você foi o primeiro homem a nascer[a]? Foi trazido à luz antes das colinas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você nasceu como Adão, o primeiro homem?” O hebraico diz “o primeiro homem” e pode aludir a Adão sem usar inequivocamente o nome próprio.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: como o primeiro homem
  rationale: A partícula interrogativa introduz uma pergunta retórica, e רִאשׁוֹן indica prioridade temporal. אָדָם é entendido aqui como substantivo comum, “homem”, sem excluir uma possível alusão a Adão.
- source_word: תִּוָּלֵד
  choice: você nasceu
  rationale: O nifal de ילד significa normalmente “nascer”; esta formulação é direta e natural em português.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: e ... antes das colinas
  rationale: A expressão coordena a segunda parte da pergunta e conserva a imagem poética de uma existência anterior às colinas.
- source_word: חוֹלָלְתָּ
  choice: foi dado à luz
  rationale: O verbo emprega linguagem de parto ou nascimento. “Foi dado à luz” preserva essa imagem e evita repetir exatamente o verbo anterior.
theological_decisions:
- issue: Se אָדָם deve ser entendido como o nome próprio Adão ou como “homem” em sentido comum
  choice: “o primeiro homem”, com nota sobre a possível alusão a Adão
  alternative: “Adão, o primeiro homem”
  rationale: O hebraico não marca inequivocamente אָדָם como nome próprio neste contexto. A tradução mantém a formulação genérica e a ambiguidade, enquanto a nota registra a possível alusão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por acaso” explicita o caráter retórico da partícula interrogativa; “colinas” conserva a imagem primordial do texto poético.
