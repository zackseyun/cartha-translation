  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: pt
  text: Que ele não confie no vazio[a], enganado, pois o vazio será sua retribuição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vazio” traduz שָׁוְא, repetido na segunda metade do versículo; também pode significar “vaidade”, “falsidade” ou “inutilidade”.
    reason: lexical_alternative
  - marker: b
    text: '“Enganado” traduz נִתְעָה, que também pode ser entendido como “desencaminhado” ou “andando errante”. Outra tradução possível para a última oração é: “pois a vaidade será sua retribuição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Não confie ele
  rationale: A partícula negativa com a forma verbal de valor jussivo expressa advertência ou proibição dirigida a uma terceira pessoa; a formulação preserva esse valor sem transformar o discurso em segunda pessoa.
- source_word: בַשָּׁוְא
  choice: no vazio
  rationale: שָׁוְא abrange vazio, vaidade, falsidade e inutilidade. “Vazio” conserva a imagem e permite repetir a mesma palavra na segunda metade do verso.
- source_word: נִתְעָה
  choice: enganando a si mesmo
  rationale: O nifal de תעה pode indicar estar enganado, ser desencaminhado ou andar errante. No contexto, a formulação reflexiva comunica naturalmente a autoilusão, enquanto a nota preserva a ambiguidade da voz e do sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da advertência e mantém a concisão poética.
- source_word: שָׁוְא
  choice: vazio
  rationale: A repetição do mesmo termo português reproduz o efeito retórico da repetição hebraica.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: será o que receberá em troca
  rationale: תְּמוּרָה designa troca, substituição ou aquilo que se recebe em retorno. A expressão corrente evita o tom excessivamente jurídico de “recompensa” e conserva a ideia de retorno correspondente.
