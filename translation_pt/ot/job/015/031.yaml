  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preserva-se a repetição poética de “vazio” e a terceira pessoa da advertência. A construção “Não confie ele” é deliberadamente formal para representar o jussivo hebraico; as notas registram a ambiguidade de נִתְעָה e a amplitude semântica de שָׁוְא.
