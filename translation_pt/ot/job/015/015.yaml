  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: pt
  text: 'Vejam: ele não confia nem mesmo em seus santos[a], e os céus não são puros aos seus olhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus seres santos”. Aqui, a expressão provavelmente se refere a seres celestiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Reproduz de modo natural e atual a função enfática da interjeição hebraica, chamando a atenção dos ouvintes para a afirmação.
- source_word: בִקְדֹשָׁיו
  choice: em seus santos
  rationale: Mantém a expressão ampla e literal do hebraico, sem substituir no texto principal o provável referente celestial por uma interpretação explícita.
- source_word: לֹא יַאֲמִין
  choice: não confia
  rationale: Neste contexto, o hifil de אמן expressa depositar confiança; “não confia” comunica isso de forma direta e idiomática.
- source_word: וְשָׁמַיִם
  choice: e os céus
  rationale: Preserva o plural hebraico e o paralelismo poético com “seus santos”.
- source_word: לֹא זַכּוּ
  choice: não são puros
  rationale: זכה indica aqui pureza ou limpeza, não primariamente inocência judicial; “puros” se ajusta à imagem cósmica e moral.
- source_word: בְעֵינָיו
  choice: aos seus olhos
  rationale: Conserva a imagem hebraica da avaliação feita por Deus e é uma expressão natural em português.
theological_decisions:
- issue: Referente de “seus santos”
  choice: Manter “seus santos” no texto, com nota indicando o provável sentido de seres celestiais
  alternative: Traduzir diretamente como “seus seres santos” ou “seus anjos”
  rationale: O paralelismo com “os céus” favorece a referência a seres celestiais, mas o hebraico não diz explicitamente “anjos”. A formulação principal preserva a amplitude e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. “Vejam” evita o tom arcaizante de “Eis” sem perder a força enfática; “nem mesmo” torna explícito o valor enfático natural no contexto.
