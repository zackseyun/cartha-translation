lexical_decisions:
- source_word: הֶחָכָם
  choice: um sábio
  rationale: A partícula interrogativa introduz uma pergunta retórica. O masculino singular foi mantido, com sentido genérico no contexto.
- source_word: יַעֲנֶה
  choice: deve responder
  rationale: O imperfeito na pergunta retórica exprime o que seria apropriado ou esperado, preservando o tom de censura.
- source_word: דַעַת רוּחַ
  choice: conhecimento feito de vento
  rationale: A expressão é literalmente ambígua, 'conhecimento de vento/espírito'. Aqui, 'vento' comunica falta de substância; a formulação conserva a metáfora sem reduzi-la apenas a 'conhecimento vazio'.
- source_word: וִימַלֵּא
  choice: e encher
  rationale: O verbo continua a pergunta retórica e mantém a imagem concreta de preencher o interior do corpo.
- source_word: קָדִים
  choice: o vento oriental
  rationale: Designa o vento que vem do leste, frequentemente quente, severo ou destrutivo. 'Vento oriental' é uma equivalência clara e digna em português internacional.
- source_word: בִּטְנוֹ
  choice: o ventre
  rationale: Preserva a vívida metáfora corporal do hebraico; 'ventre' é natural e digno neste registro poético.
