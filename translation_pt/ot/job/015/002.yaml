  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: pt
  text: Será que um sábio deve responder com conhecimento de vento[a] e encher o seu ventre de vento oriental?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido contextual: “conhecimento vazio” ou “conhecimento sem substância”.'
