source:
  edition: WLC
  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: pt
  text: Durante todos os seus dias, o perverso se contorce[a], e certo número de anos está reservado[b] para o homem cruel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vive angustiado”; o verbo hebraico pode expressar contorção, tremor ou angústia semelhante às dores de parto.
    reason: lexical_alternative
  - marker: b
    text: Ou “está escondido” ou “está guardado”; o hebraico também pode indicar que os anos foram postos à parte ou fixados para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: Durante todos os seus dias, o perverso
  rationale: A expressão totalizante כָּל יְמֵי é vertida naturalmente como “durante todos os seus dias”. O singular substantivado רָשָׁע é preservado por “o perverso”, que apresenta uma pessoa perversa como tipo representativo sem acrescentar “homem” ao texto principal.
- source_word: הוּא מִתְחוֹלֵל
  choice: se contorce
  rationale: O pronome independente הוּא reforça o sujeito, mas não requer tradução separada em português. A forma participial reflexiva/intensiva de חול sugere ação contínua de contorcer-se, tremer ou sofrer como em dores de parto; “se contorce” conserva a imagem sem acrescentar explicitamente “em tormento”.
- source_word: וּמִסְפַּר שָׁנִים
  choice: e certo número de anos
  rationale: A expressão indica uma quantidade determinada, embora não especificada. “Certo número de anos” comunica melhor essa nuance que uma simples referência genérica a “alguns anos”.
- source_word: נִצְפְּנוּ
  choice: está reservado
  rationale: O nifal de צפן pode significar estar escondido, guardado ou reservado. A concordância no singular com “certo número” é natural em português, e “reservado” preserva a noção de um período fixado para alguém.
- source_word: לֶעָרִיץ
  choice: para o homem cruel
  rationale: עָרִיץ designa alguém violento, opressor ou implacável. “Homem cruel” mantém o referente masculino singular e evita restringir o sentido à tirania política.
theological_decisions:
- issue: Natureza da afirmação de Elifaz sobre o sofrimento do perverso
  choice: Preservar a declaração absoluta tal como formulada pelo personagem
  alternative: Atenuar a frase para indicar que o perverso sofre apenas em certos momentos
  rationale: O hebraico diz “todos os dias” e apresenta a afirmação como parte do argumento de Elifaz. A tradução não deve harmonizá-la antecipadamente com outras perspectivas do livro nem endossá-la como conclusão isolada do narrador.
- issue: Sentido do período reservado ao homem cruel
  choice: Manter ambíguo o que os anos reservados implicam
  alternative: Explicitar que são anos de castigo, sofrimento ou vida limitada
  rationale: O texto não fornece aqui um complemento explícito. Acrescentar “de sofrimento” ou “de castigo” resolveria uma tensão interpretativa que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluência, preservando o paralelismo e a ambiguidade do hebraico.
