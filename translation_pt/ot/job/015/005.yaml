  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: pt
  text: 'Pois a sua iniquidade ensina a sua boca[a],

    e você escolhe a língua dos ardilosos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua culpa ensina a sua boca”. O termo hebraico pode indicar iniquidade, culpa ou a consequência da culpa, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos astutos” ou “dos perspicazes”. O termo hebraico pode ter sentido negativo ou positivo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a acusação de Elifaz e mantém o fluxo argumentativo do contexto.
- source_word: יְאַלֵּף
  choice: ensina
  rationale: O piel de אלף expressa ensinar ou treinar; “ensina” preserva com naturalidade a personificação da iniquidade.
- source_word: עֲוֺנְךָ
  choice: a sua iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou consequência da culpa. Aqui designa a falha moral que, segundo Elifaz, molda a fala de Jó.
- source_word: פִיךָ
  choice: a sua boca
  rationale: Mantém a imagem concreta do hebraico e é compreensível como referência à fala.
- source_word: וְתִבְחַר
  choice: e você escolhe
  rationale: Reproduz diretamente o qal de בחר e conserva o caráter pessoal da acusação.
- source_word: לְשׁוֹן
  choice: a língua
  rationale: Preserva a imagem poética paralela a “boca”, em vez de substituí-la por uma abstração como “linguagem”.
- source_word: עֲרוּמִים
  choice: dos ardilosos
  rationale: עָרוּם pode ser positivamente “prudente” ou negativamente “astuto/ardiloso”. Neste contexto acusatório, “ardilosos” comunica melhor a conotação de fala manipuladora.
theological_decisions:
- issue: Nuance moral de עָוֹן na acusação
  choice: a sua iniquidade
  alternative: a sua culpa; o seu pecado
  rationale: “Iniquidade” preserva a força ética da acusação sem limitar o termo à responsabilidade jurídica expressa por “culpa” nem generalizá-lo como “pecado”.
- issue: Valor moral de עֲרוּמִים
  choice: dos ardilosos
  alternative: dos astutos; dos prudentes
  rationale: Embora o termo possa ter sentido positivo em outros contextos, a acusação de Elifaz pede aqui uma nuance negativa. A tradução registra, porém, a amplitude lexical em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A ordem poética e as imagens de “boca” e “língua” foram mantidas; “ardilosos” explicita a conotação negativa exigida pelo discurso acusatório sem apagar em nota a ambiguidade lexical do hebraico.
