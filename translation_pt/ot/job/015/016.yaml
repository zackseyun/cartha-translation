source:
  edition: WLC
  text: אַ֭ף כִּֽי נִתְעָ֥ב וְֽ/נֶאֱלָ֑ח אִישׁ שֹׁתֶ֖ה כַ/מַּ֣יִם עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: pt
  text: quanto menos o homem, que é detestável e corrupto[a], que bebe a injustiça[b] como água!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imundo”. O termo hebraico é raro e descreve alguém poluído, impuro ou moralmente degradado.
    reason: lexical_alternative
  - marker: b
    text: Ou “iniquidade”, “perversidade” ou “má conduta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: quanto menos
  rationale: 'No contexto, a expressão introduz o segundo termo de um argumento a fortiori: se nem os céus são puros diante de Deus, quanto menos o ser humano descrito neste versículo.'
- source_word: נִתְעָב
  choice: detestável
  rationale: O particípio nifal indica alguém repulsivo ou abominável; “detestável” preserva a força moral e é natural no português atual.
- source_word: נֶאֱלָח
  choice: corrupto
  rationale: O termo raro comunica a ideia de estar poluído, imundo ou moralmente degradado. “Corrupto” expressa com clareza a contaminação moral, enquanto a alternativa “imundo” é registrada em nota.
- source_word: אִישׁ
  choice: o homem
  rationale: O substantivo hebraico é masculino singular e tem aqui sentido representativo. “O homem” preserva a forma da fonte e liga naturalmente o versículo ao argumento anterior.
- source_word: שֹׁתֶה
  choice: que bebe
  rationale: O particípio foi expresso por uma oração relativa, preservando a ideia característica ou habitual.
- source_word: כַמַּיִם
  choice: como água
  rationale: Reproduz diretamente a comparação, que sugere facilidade, habitualidade e abundância.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O substantivo denota injustiça, perversidade ou má conduta. “Injustiça” mantém a força ética em linguagem contemporânea sem recorrer a vocabulário arcaizante.
theological_decisions:
- issue: Linguagem masculina representativa
  choice: o homem
  alternative: uma pessoa; a humanidade
  rationale: אִישׁ está no masculino singular e funciona representativamente. A tradução conserva essa forma sem restringir artificialmente a aplicação moral da declaração.
- issue: Sentido moral de עַוְלָה
  choice: injustiça
  alternative: iniquidade; perversidade; má conduta
  rationale: “Injustiça” comunica de modo direto o mal moral retratado, sem acrescentar terminologia doutrinária posterior; a amplitude lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “quanto menos” conserva o argumento a fortiori, e a ordem da frase mantém o impacto retórico da descrição hebraica.
