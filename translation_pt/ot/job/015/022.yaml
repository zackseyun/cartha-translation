  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: pt
  text: Não espera voltar das trevas e está destinado à espada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a espada o espreita”, “está reservado para a espada” ou “é esperado pela espada”. O verbo hebraico é difícil, mas a frase provavelmente comunica a iminência de uma morte violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: Não espera
  rationale: Neste contexto, o hifil de אמן expressa expectativa ou confiança quanto a um resultado futuro, não crença religiosa; a formulação é natural em português.
- source_word: שׁוּב
  choice: voltar
  rationale: 'O infinitivo indica o conteúdo da expectativa: retornar ou sair de novo da condição descrita como trevas.'
- source_word: מִנִּי חֹשֶׁךְ
  choice: das trevas
  rationale: A preposição מן indica procedência ou saída; “das trevas” conserva a imagem de calamidade, perigo ou morte sem a explicar em excesso.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: e está reservado para a espada
  rationale: A forma ligada a צפה é difícil. “Está reservado” conserva a orientação passiva e a ideia contextual de morte violenta iminente, enquanto a nota registra outras leituras plausíveis.
- source_word: חָרֶב
  choice: a espada
  rationale: A espada representa morte violenta ou juízo; o artigo soa natural em português e preserva a figura hebraica.
