base_translation:
  language: en
  yaml_path: translation/ot/job/015/032.yaml
  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: pt
  text: Antes do tempo dele, isso se completará[a], e seu ramo[b] não permanecerá verde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso se cumprirá antes do dia dele”. O verbo hebraico significa literalmente “será cheio” ou “se completará”, e seu sentido exato neste contexto é discutido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu ramo de palmeira” ou “seu broto superior”. O termo hebraico designa uma parte semelhante a um ramo de árvore ou planta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: antes do tempo dele
  rationale: Expressa de modo natural o sentido idiomático de algo ocorrer antes do dia ou tempo que lhe caberia, em consonância com o contexto de fim prematuro.
- source_word: תִּמָּלֵא
  choice: isso se completará
  rationale: Preserva o sentido básico do nifal de מלא, “encher-se, completar-se”, sem introduzir como certa a metáfora financeira de uma dívida paga. O pronome “isso” retoma de maneira discreta o que foi mencionado no contexto anterior.
- source_word: כִפָּתוֹ
  choice: seu ramo
  rationale: Mantém a imagem vegetal sem especificar indevidamente uma palmeira; o termo também pode designar um ramo alto ou broto superior.
- source_word: לֹא רַעֲנָנָה
  choice: não permanecerá verde
  rationale: Conserva a imagem concreta de frescor e vigor vegetal expressa por רענן e sugere que o ramo não continuará viçoso.
theological_decisions:
- issue: Natureza do que se completa antes do tempo
  choice: isso se completará
  alternative: sua retribuição será paga por inteiro
  rationale: O contexto pode apontar para a retribuição mencionada anteriormente, mas o hebraico deste versículo não repete o substantivo nem contém por si só linguagem financeira. A formulação escolhida mantém a referência contextual e a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Tempo dele” comunica melhor que o mais literal “dia dele” a ideia contextual de um momento prematuramente antecipado. Os marcadores foram colocados junto aos termos a que suas notas se referem.
