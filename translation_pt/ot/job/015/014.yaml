id: JOB.15.14
reference: Job 15:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי יִזְכֶּ֑ה וְ/כִֽי יִ֝צְדַּ֗ק יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: pt
  text: O que é o ser humano, para que seja puro[a]? E o nascido de mulher, para que seja justo[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpo”. O verbo hebraico pode indicar limpeza ou pureza, inclusive em sentido moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “esteja com a razão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: O que é o ser humano
  rationale: A pergunta retórica trata da condição ou capacidade humana. “Ser humano” comunica o sentido genérico de אֱנוֹשׁ e sua conotação de humanidade frágil e mortal, sem restringi-lo ao sexo masculino.
- source_word: כִּי
  choice: para que
  rationale: Depois da pergunta com מָה, introduz a consequência ou possibilidade posta retoricamente; “para que” reproduz de modo natural essa relação em português.
- source_word: יִזְכֶּה
  choice: seja puro
  rationale: O Qal de זכה pode indicar estar limpo ou puro, inclusive em sentido moral. “Puro” mantém essa amplitude melhor que uma formulação estritamente física.
- source_word: וְכִי
  choice: E ... para que
  rationale: O וְ coordena os dois membros paralelos. Manter “E” preserva a forma cumulativa do hebraico, em vez de transformar os membros em alternativas.
- source_word: יִצְדַּק
  choice: seja justo
  rationale: O Qal de צדק expressa ser justo ou estar com a razão. “Seja justo” conserva o sentido amplo de estado ou avaliação, sem impor uma formulação técnica de justificação.
- source_word: יְלוּד אִשָּׁה
  choice: o nascido de mulher
  rationale: Reproduz com concisão o idiomatismo hebraico para uma pessoa em sua condição humana e mortal, mantendo o singular representativo e o paralelismo poético.
theological_decisions:
- issue: Alcance antropológico de אֱנוֹשׁ e יְלוּד אִשָּׁה
  choice: “o ser humano” e “o nascido de mulher”, com referência genérica à humanidade
  alternative: “o homem” e “um filho de mulher”
  rationale: As formas hebraicas estão no singular representativo, mas seu alcance é toda a humanidade. A redação escolhida torna esse alcance claro em português atual sem eliminar a imagem do segundo membro.
- issue: Nuance moral ou forense de יִצְדַּק
  choice: “seja justo”
  alternative: “esteja com a razão” ou “seja declarado justo”
  rationale: O contexto poético permite uma noção moral e também avaliativa. “Seja justo” preserva a amplitude lexical e evita introduzir uma doutrina técnica de justificação.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Ser humano” tem leitura amplamente internacional e natural no Brasil; “o nascido de mulher” conserva a expressão concreta do hebraico.
