base_translation:
  language: en
  yaml_path: translation/ot/job/015/012.yaml
  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: pt
  text: Por que o seu coração o arrasta, e por que os seus olhos faiscam[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piscam”, “fazem sinais” ou, possivelmente, “se reviram”; o verbo hebraico é raro, e seu sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Por que
  rationale: Embora literalmente seja “o que”, a partícula introduz aqui uma pergunta retórica sobre causa ou motivo; “Por que” expressa o sentido com naturalidade em português.
- source_word: יִקָּחֲךָ
  choice: o arrasta
  rationale: A forma de לקח, tendo “seu coração” como sujeito e o pronome de segunda pessoa como objeto, descreve figuradamente o coração levando a pessoa consigo; “arrasta” preserva a força da imagem sem explicá-la em excesso.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: “Coração” representa a interioridade, incluindo pensamento e emoção. A imagem literal é clara e natural em português.
- source_word: וּמַה
  choice: e por que
  rationale: Repete a pergunta retórica sobre causa ou motivo e mantém o paralelismo da frase hebraica.
- source_word: יִרְזְמוּן
  choice: faiscam
  rationale: O verbo é raro e seu sentido exato é incerto. “Faiscam” comunica um olhar intenso ou agitado e conserva a imagem vívida dos olhos; outras possibilidades são registradas em nota.
- source_word: עֵינֶיךָ
  choice: os seus olhos
  rationale: A tradução literal é natural e preserva a linguagem corporal da acusação.
