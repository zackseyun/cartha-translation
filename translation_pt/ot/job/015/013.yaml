  text: that you turn your spirit against God and bring words out of your mouth?[a]
translation:
  language: pt
  text: para que você dirija seu espírito contra Deus e faça sair palavras da sua boca?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Deus” ou “em direção a Deus”. O hebraico diz literalmente “a/para Deus”; “contra Deus” foi usado no texto porque o contexto é acusatório e sugere oposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: para
  rationale: No encadeamento com a pergunta do versículo anterior, introduz o resultado ou expressão da atitude censurada. Em português, “para” produz uma continuação interrogativa natural, sem exigir a repetição de “que”.
- source_word: תָשִׁיב
  choice: voltar
  rationale: O hifil de שׁוב expressa fazer voltar, virar ou dirigir. “Voltar” conserva a imagem de orientar a disposição interior em determinada direção.
- source_word: אֶל אֵל
  choice: contra Deus
  rationale: אֶל significa literalmente “a/para, em direção a”. O contexto acusatório sugere uma orientação hostil, por isso “contra Deus” comunica a força contextual; a tradução mais literal fica preservada em nota.
- source_word: רוּחֶךָ
  choice: seu espírito
  rationale: רוּחַ aqui designa a disposição ou realidade interior de Jó, não vento ou respiração. “Espírito” preserva a amplitude antropológica do termo sem restringi-lo a “temperamento”.
- source_word: וְהֹצֵאתָ
  choice: e deixar sair
  rationale: O hifil de יצא significa fazer sair ou trazer para fora. “Deixar sair” mantém a imagem concreta de palavras procedendo da boca e soa natural em português.
- source_word: מִפִּיךָ
  choice: da sua boca
  rationale: A preposição מִן marca a origem. Com “deixar sair”, “da sua boca” expressa naturalmente essa fonte.
- source_word: מִלִּין
  choice: palavras
  rationale: O plural aramaizante מִלִּין significa palavras ou enunciados; “palavras” é direto e corrente.
theological_decisions:
- issue: Direção do espírito de Jó em relação a Deus
  choice: contra Deus
  alternative: a Deus / em direção a Deus
  rationale: A preposição hebraica por si só indica direção, mas a acusação de Elifaz apresenta essa orientação como oposição. A nota mantém visível a ambiguidade lexical e evita tratá-la como inexistente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O verso continua sintaticamente a pergunta do versículo anterior; por isso começa com “para”. A construção preserva a imagem concreta do espírito voltado e das palavras saindo da boca.
