source:
  edition: WLC
  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: pt
  text: 'Pois a comunidade dos ímpios[a] é estéril,

    e o fogo consome as tendas do suborno[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a comunidade do hipócrita”. Em Jó, o hebraico חָנֵף pode significar “hipócrita”, mas frequentemente tem o sentido mais amplo de “ímpio” ou “irreverente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as tendas do suborno” ou “as tendas de um suborno”. A expressão se refere a habitações marcadas por ganhos corruptos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a ligação argumentativa do contexto.
- source_word: עֲדַת
  choice: a comunidade dos
  rationale: Expressa um grupo reunido sem a conotação especificamente religiosa que “congregação” poderia sugerir ao leitor moderno.
- source_word: חָנֵף
  choice: ímpios
  rationale: Em Jó, o termo costuma designar quem é irreverente ou moralmente afastado de Deus, e não apenas alguém socialmente fingido. O singular hebraico tem sentido coletivo depois de עֲדַת.
- source_word: גַּלְמוּד
  choice: estéril
  rationale: Comunica a ideia de ausência de fruto, descendência ou produtividade, mantendo a imagem concisa do hebraico.
- source_word: וְאֵשׁ
  choice: e o fogo
  rationale: Mantém a coordenação simples da segunda oração e sua imagem concreta.
- source_word: אָכְלָה
  choice: consome
  rationale: O perfeito hebraico pode formular uma verdade geral ou apresentar vividamente a ação; o presente transmite essa força proverbial.
- source_word: אָהֳלֵי
  choice: as tendas
  rationale: Preserva a imagem concreta e o cenário do texto, em vez de generalizá-la como “casas” ou “moradas”.
- source_word: שֹׁחַד
  choice: do suborno
  rationale: Mantém o substantivo específico do hebraico e sua construção condensada com “tendas”, sem inserir explicitamente agentes que o original não nomeia.
theological_decisions: []
