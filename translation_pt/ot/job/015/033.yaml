  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: pt
  text: Como a videira, ele arrancará suas uvas ainda verdes[a] e, como a oliveira, deixará cair sua flor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrancará suas uvas ainda verdes”. O verbo hebraico costuma ter um sentido mais forte de violência, despojo ou arrancamento; aqui descreve a perda prematura do fruto.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua florada” ou “sua floração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: arrancará
  rationale: O verbo geralmente expressa violência, dano ou despojo. Na imagem agrícola, “arrancará” conserva essa força concreta e comunica a perda prematura do fruto sem transformar o verbo em uma ideia abstrata.
- source_word: כַּגֶּפֶן
  choice: como a videira
  rationale: Equivalente corrente de גפן e reprodução natural da comparação introduzida por כ.
- source_word: בִּסְרוֹ
  choice: suas uvas ainda verdes
  rationale: בֹּסֶר designa uvas imaturas. “Ainda verdes” expressa com clareza que o fruto se perde antes de amadurecer; o sufixo masculino singular é representado pelo possessivo “suas”.
- source_word: וְיַשְׁלֵךְ
  choice: e deixará cair
  rationale: Embora a forma verbal possa significar “lançar” ou “atirar”, no contexto de uma árvore que perde sua flor, “deixará cair” é português natural e mantém a imagem de perda antes da frutificação.
- source_word: כַּזַּיִת
  choice: como a oliveira
  rationale: Neste contexto, זית se refere à árvore, pois a comparação envolve a queda de sua flor.
- source_word: נִצָּתוֹ
  choice: sua flor
  rationale: O substantivo designa a flor ou floração da planta. O singular e o sufixo possessivo do hebraico são preservados.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. O paralelismo das duas comparações agrícolas foi mantido, bem como o caráter ativo e severo do primeiro verbo. A formulação não explicita além do hebraico se a perda ocorre por ação própria, força externa ou como figura do juízo.
