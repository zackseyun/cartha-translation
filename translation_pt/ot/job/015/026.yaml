base_translation:
  language: en
  yaml_path: translation/ot/job/015/026.yaml
  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: pt
  text: Ele avança contra ele com o pescoço[a], com as espessas saliências dos seus escudos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele investe contra ele com o pescoço estendido, com as espessas saliências dos seus escudos”. A imagem hebraica é vívida e um tanto condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: avança
  rationale: O verbo significa literalmente “corre”, mas, neste contexto hostil, “avança” comunica um movimento impetuoso de ataque sem acrescentar uma imagem militar excessivamente específica.
- source_word: אֵלָיו
  choice: contra ele
  rationale: Com um verbo de movimento em contexto de confronto, a preposição אֶל assume naturalmente sentido adversativo; “contra ele” torna essa direção hostil clara em português.
- source_word: בְּצַוָּאר
  choice: com o pescoço
  rationale: A expressão hebraica é comprimida e diz literalmente “com o pescoço”. A tradução mantém a imagem concreta no texto principal, sem decidir se o pescoço está estendido, erguido ou rígido.
- source_word: בַּעֲבִי
  choice: com as grossas
  rationale: עֳבִי expressa espessura ou volume. “Grossas” transmite essa característica de modo natural em ligação com as saliências dos escudos.
- source_word: גַּבֵּי
  choice: saliências
  rationale: No contexto de escudos, o termo provavelmente designa suas partes convexas ou ressaltadas. “Saliências” é preciso e mais compreensível ao leitor comum do que o termo técnico “bossas”.
- source_word: מָגִנָּיו
  choice: dos seus escudos
  rationale: A forma hebraica é plural e traz sufixo masculino singular; por isso, mantém-se o plural “seus escudos”, apesar da imagem incomum.
