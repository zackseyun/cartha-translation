base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: pt
  text: Ele habitou em cidades arruinadas[a], em casas onde ninguém mora, destinadas a se tornar montões de entulho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele morou em cidades destruídas, em casas nas quais eles não moram, preparadas para se tornarem montões de ruínas”. O hebraico deste versículo é conciso e permite traduções próximas entre si, especialmente na oração central.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Ele habitou
  rationale: O verbo שכן significa “habitar, morar, estabelecer-se”. O pretérito perfeito traduz naturalmente a forma narrativa hebraica e mantém a referência ao percurso do ímpio no contexto.
- source_word: עָרִים נִכְחָדוֹת
  choice: cidades arruinadas
  rationale: O particípio passivo de כחד descreve cidades destruídas, eliminadas ou reduzidas à desolação. “Arruinadas” é claro e se harmoniza com as casas abandonadas e os montões de entulho.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: em casas onde ninguém mora
  rationale: A construção hebraica é compacta e difícil, incluindo um sufixo pronominal plural. A formulação com sujeito indefinido comunica com naturalidade o sentido provável de casas desabitadas, sem fingir que a sintaxe não admite outra leitura.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: destinadas
  rationale: O hitpael de עתד pode expressar estar preparado, reservado ou destinado. Aqui indica que as casas estavam encaminhadas para a condição descrita a seguir.
- source_word: לְגַלִּים
  choice: a se tornar montões de entulho
  rationale: גַּלִּים designa montões, especialmente de pedras ou ruínas. “Montões de entulho” torna concreto o quadro de edificações reduzidas a escombros.
