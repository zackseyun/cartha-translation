  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: pt
  text: Ele não enriquecerá, sua riqueza não permanecerá, e sua produção[a] não penderá até a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus bens”, “seu ganho” ou “sua abundância”. O termo hebraico é raro e seu sentido é incerto.
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final talvez evoque ramos ou produtos que, por sua abundância, pendem até o chão. Outros a entendem de modo mais geral: seus bens não se espalharão pela terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: não enriquecerá
  rationale: O qal de עשר expressa tornar-se rico ou adquirir riqueza; “enriquecerá” preserva o sentido verbal e é natural em português.
- source_word: יָקוּם
  choice: não permanecerá
  rationale: Embora o sentido básico seja “ficar de pé” ou “erguer-se”, com חֵילוֹ a ideia contextual é que a riqueza não se manterá nem durará.
- source_word: חֵילוֹ
  choice: sua riqueza
  rationale: חַיִל pode significar força, recursos ou riqueza; neste contexto de prosperidade frustrada, “riqueza” comunica com clareza o referente.
- source_word: יִטֶּה
  choice: não penderá
  rationale: נטה pode significar inclinar, estender ou fazer pender. “Pender” conserva a possível imagem concreta de produção ou ramos vergados pelo peso da abundância.
- source_word: מִנְלָם
  choice: sua produção
  rationale: A forma é rara e de interpretação incerta. “Produção” cria uma imagem coerente com o verbo “pender” e com a menção da terra, sem ocultar em nota outras possibilidades lexicais.
theological_decisions:
- issue: A imagem da cláusula final
  choice: Conservar a imagem concreta de uma produção que pende até a terra
  alternative: Generalizar como bens que não se espalham pela terra
  rationale: A construção hebraica admite mais de uma compreensão. A tradução principal mantém a imagem vívida favorecida pela combinação de נטה com לָאָרֶץ, enquanto a nota registra a leitura mais geral sem decidir uma questão teológica inexistente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Enriquecerá” e “permanecerá” comunicam naturalmente os valores verbais; “penderá até a terra” preserva a metáfora concreta e a ambiguidade é explicitada nas notas.
