  text: הַ/מְעַ֣ט מִ֭מְּ/ךָ תַּנְחֻמ֣וֹת אֵ֑ל וְ֝/דָבָ֗ר לָ/אַ֥ט עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: pt
  text: Por acaso são pequenas demais para você as consolações de Deus[a], ou uma palavra dita com brandura a você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “São de pouca importância para você as consolações de Deus e uma palavra dita com brandura a você?”'
    reason: Preserva a possibilidade de מְעַט indicar algo considerado de pouca importância e registra o valor coordenativo comum de וְ, “e”.
lexical_decisions:
- source_word: הַמְעַט
  choice: são pequenas demais
  rationale: A partícula interrogativa com מְעַט introduz uma pergunta retórica sobre considerar algo insuficiente ou de pouco valor; a formulação preserva essa força em português natural.
- source_word: מִמְּךָ
  choice: para você
  rationale: 'Nesta construção, a preposição indica relação com o destinatário: pequenas ou insuficientes para ele.'
- source_word: תַּנְחֻמוֹת
  choice: consolações
  rationale: O plural designa manifestações ou palavras de consolo; “consolações” mantém o plural e o tom digno.
- source_word: אֵל
  choice: Deus
  rationale: O título divino refere-se aqui claramente a Deus.
- source_word: וְדָבָר
  choice: ou a palavra
  rationale: דָבָר significa aqui “palavra” no contexto de fala. A conjunção pode ser entendida como ligando um segundo elemento da pergunta; “ou” produz a leitura interrogativa mais natural, sem ocultar a alternativa coordenativa.
- source_word: לָאַט
  choice: dita com brandura
  rationale: O termo expressa suavidade ou gentileza. “Dita com brandura” explicita de modo natural em português o ato de falar implícito.
- source_word: עִמָּךְ
  choice: a você
  rationale: Embora עִם normalmente signifique “com”, no contexto da palavra dirigida a Jó, “a você” comunica com naturalidade a relação com o destinatário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Por acaso” reforça a natureza retórica da pergunta sem alterar seu conteúdo; “com brandura” mantém o tom elevado sem soar arcaico.
