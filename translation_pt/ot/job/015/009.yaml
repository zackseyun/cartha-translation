  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: pt
  text: O que você sabe que nós não sabemos? O que você entende que não está conosco?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que nós não temos”. O hebraico diz literalmente: “e não está conosco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: O que
  rationale: Pronome interrogativo que introduz duas perguntas retóricas; “O que” conserva a concisão do hebraico e soa natural em português.
- source_word: יָדַעְתָּ
  choice: você sabe
  rationale: Qal perfeito, segunda pessoa masculina singular, empregado aqui com sentido presente numa pergunta retórica.
- source_word: וְלֹא נֵדָע
  choice: que nós não sabemos
  rationale: Depois da expressão interrogativa, a conjunção com a negação e o verbo na primeira pessoa do plural é expressa naturalmente como oração relativa, preservando o contraste.
- source_word: תָּבִין
  choice: você entende
  rationale: O verbo בין indica entender ou discernir; “entende” é claro, corrente e mantém o paralelismo com “sabe”.
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: que nós não temos
  rationale: A expressão hebraica significa literalmente “e não está conosco”. Neste contexto, “não temos” comunica naturalmente a ideia idiomática de algo que não se encontra em posse ou alcance do grupo, enquanto a forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para o singular e “nós” explícito para realçar o contraste retórico. A segunda oração emprega a formulação idiomática “não temos”, acompanhada da alternativa mais literal em nota.
