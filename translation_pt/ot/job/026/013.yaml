  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: pt
  text: Por seu sopro, ele tornou esplêndidos os céus[a]; sua mão traspassou a serpente fugitiva[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por seu Espírito” ou “Por seu vento”. A palavra hebraica pode significar sopro, vento ou espírito.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua mão formou a serpente fugitiva”. O verbo hebraico admite interpretações diferentes, embora “traspassou” combine melhor com a imagem de combate desta linha.
    reason: alternative_reading
  - marker: c
    text: A expressão “serpente fugitiva” provavelmente evoca uma serpente cósmica associada ao caos; compare Isaías 27:1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: Por seu sopro
  rationale: רוּחַ pode significar sopro, vento ou espírito. “Sopro” conserva a imagem poética concreta do poder criador de Deus sem impor uma identificação pessoal que o hebraico não exige; בְּ indica o meio ou instrumento.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: “Céus” preserva o sentido cosmológico e o registro elevado da poesia, sendo mais abrangente que “céu” no sentido apenas atmosférico.
- source_word: שִׁפְרָה
  choice: ficaram esplêndidos
  rationale: O verbo שׁפר comunica beleza, esplendor ou brilho. A formulação expressa em português natural o resultado da ação divina e mantém o aspecto poético do texto.
- source_word: חֹלֲלָה
  choice: traspassou
  rationale: Nesta construção poética, חול admite mais de uma análise, incluindo “traspassar” e “formar”. Com “sua mão” como sujeito e a serpente como objeto, “traspassou” se ajusta melhor à provável imagem de combate, sem ocultar a alternativa em nota.
- source_word: יָדוֹ
  choice: sua mão
  rationale: Mantém a imagem concreta hebraica da mão como expressão do poder ativo de Deus.
- source_word: נָחָשׁ בָּרִיחַ
  choice: a serpente fugitiva
  rationale: בָּרִיחַ pode descrever aquilo que foge, desliza ou se estende. “Serpente fugitiva” é uma leitura defensável no contexto da imagem de combate cósmico e não identifica além do texto a figura evocada.
theological_decisions:
- issue: Se רוּחַ deve ser traduzido como “Espírito”, sugerindo referência trinitária distinta
  choice: sopro no texto principal
  alternative: Espírito ou vento
  rationale: O hebraico permite as três acepções, mas não exige aqui uma referência pessoal explícita ao Espírito. “Sopro” conserva a imagem poética, enquanto a nota mantém abertas as demais leituras.
- issue: Se נָחָשׁ בָּרִיחַ deve ser identificado explicitamente como Satanás ou Leviatã
  choice: serpente fugitiva
  alternative: Leviatã, serpente do caos ou Satanás em leitura tipológica
  rationale: O verso emprega uma imagem que provavelmente evoca combate cósmico, mas não nomeia Satanás nem Leviatã. A tradução preserva a imagem e a tensão sem resolver sua identidade.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Esplêndidos” preserva a linguagem elevada sem soar arcaico; “traspassou” mantém a força da imagem de combate. As notas registram ambiguidades lexicais e interpretativas reais.
