  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: pt
  text: Ele traçou um círculo sobre a superfície das águas[a], no limite entre a luz e as trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele estabeleceu um limite sobre a face das águas, até onde a luz encontra as trevas”.'
    reason: Alternativa lexical que preserva em חֹק o sentido de limite estabelecido e em עַד a ideia de extensão até o ponto de encontro.
lexical_decisions:
- source_word: חֹק חָג
  choice: traçou um círculo
  rationale: A combinação expressa a marcação de um limite circular. “Traçou um círculo” conserva a imagem concreta e soa natural em português, sem reduzir חֹק a um decreto abstrato.
- source_word: עַל פְּנֵי מָיִם
  choice: sobre a superfície das águas
  rationale: פְּנֵי designa literalmente a face ou superfície; esta formulação preserva a imagem espacial em português corrente.
- source_word: עַד תַּכְלִית
  choice: no limite
  rationale: עַד introduz a extensão alcançada, e תַּכְלִית indica limite ou extremidade. “No limite” comunica a função da expressão de modo conciso.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: entre a luz e as trevas
  rationale: Literalmente, “luz com trevas”. No contexto, a expressão indica a linha em que ambas se encontram ou se separam; “entre” torna essa relação inteligível sem eliminar a imagem poética.
