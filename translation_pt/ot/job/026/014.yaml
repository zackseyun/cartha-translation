id: JOB.26.14
reference: Job 26:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: pt
  text: Eis que estas são apenas as extremidades[a] dos seus caminhos, e quão leve é o sussurro[b] que ouvimos a respeito dele! Mas quem pode compreender o trovão do seu poder?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os confins» ou «as bordas dos seus caminhos». O hebraico apresenta somente os limites mais externos daquilo que Deus faz.
    reason: lexical_alternative
  - marker: b
    text: Ou «que tênue indício de algo ouvimos a respeito dele». A expressão hebraica é rara e enfatiza quão pouco se ouve, em contraste com o «trovão» do seu poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Eis que
  rationale: Introduz enfaticamente o que será mostrado. «Eis que» conserva a força dêitica do hebraico e permanece claro em português, sem acrescentar um destinatário plural como faria «vejam».
- source_word: קְצוֹת
  choice: as extremidades
  rationale: O termo indica limites, pontas ou bordas. «Extremidades» comunica que apenas as margens externas da atuação divina estão ao alcance da percepção humana; «apenas» torna explícita em português essa limitação sugerida pelo contexto.
- source_word: דרכ/ו
  choice: dos seus caminhos
  rationale: Mantém a metáfora hebraica dos «caminhos» de Deus, que pode abranger tanto sua maneira de agir quanto suas obras, sem restringir indevidamente o sentido.
- source_word: שֵּׁמֶץ דָּבָר
  choice: leve é o sussurro
  rationale: A expressão rara denota algo mínimo ou apenas tenuemente ouvido. «Sussurro» preserva a imagem auditiva e forma o contraste poético com o «trovão», enquanto «leve» ressalta sua tenuidade.
- source_word: נִשְׁמַע בּ/וֹ
  choice: ouvimos a respeito dele
  rationale: 'Expressa naturalmente o sentido coletivo ou impessoal: os seres humanos ouvem muito pouco acerca de Deus. «A respeito dele» evita decidir que se trata necessariamente de fala vinda diretamente dele.'
- source_word: רַעַם גבורת/ו
  choice: o trovão do seu poder
  rationale: Conserva a imagem concreta de «trovão» e o contraste sonoro com «sussurro». «Poder» traduz de modo conciso a força ou potência indicada por גְּבוּרָה.
- source_word: יִתְבּוֹנָן
  choice: pode compreender
  rationale: O verbo envolve discernir ou entender atentamente. A pergunta retórica destaca a incapacidade humana de abarcar a plena manifestação do poder divino.
theological_decisions:
- issue: Alcance do conhecimento humano de Deus na linguagem poética
  choice: O verso afirma que aquilo que os seres humanos percebem dos caminhos de Deus corresponde apenas às suas extremidades, em contraste com a plenitude incompreensível do seu poder.
  alternative: Ler a limitação como referência estrita somente às obras cósmicas mencionadas no contexto imediato.
  rationale: O contexto descreve atos cósmicos de Deus, mas as expressões «seus caminhos» e «trovão do seu poder» permitem uma afirmação poética mais ampla. A tradução preserva essa abertura sem transformar o verso numa formulação filosófica sobre tudo o que se pode conhecer de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eis que» mantém a ênfase poética sem recorrer a uma forma excessivamente arcaica. A ordem da frase foi ajustada para soar natural, preservando o contraste entre o sussurro percebido e o trovão incompreensível.
