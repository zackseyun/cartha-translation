lexical_decisions:
- source_word: אֶת מִי
  choice: a quem
  rationale: A partícula אֶת diante do interrogativo indica aqui a pessoa a quem as palavras foram declaradas; “a quem” preserva de modo natural a força retórica.
- source_word: הִגַּדְתָּ מִלִּין
  choice: você declarou palavras
  rationale: O hifil de נגד significa “declarar, contar, dar a conhecer”, e מִלִּין designa palavras ou enunciados. A formulação mantém o tom poético elevado sem acrescentar um demonstrativo ausente no hebraico.
- source_word: וְנִשְׁמַת מִי
  choice: e o sopro de quem
  rationale: נְשָׁמָה pode designar “sopro” e, por extensão, “espírito”. “Sopro” conserva a imagem concreta, enquanto “de quem” expressa naturalmente a relação possessiva do interrogativo.
- source_word: יָצְאָה מִמֶּךָּ
  choice: saiu de você
  rationale: יצא significa literalmente “sair”. A tradução preserva a imagem de algo que procede do interlocutor e mantém o aspecto concluído da forma verbal hebraica.
theological_decisions:
- issue: Sentido de נְשָׁמָה
  choice: sopro no texto principal
  alternative: espírito
  rationale: O contexto de palavras que saem da pessoa favorece a imagem concreta do sopro, mas o alcance semântico pode incluir “espírito”; por isso, a alternativa é preservada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética concisa. Mantém-se a repetição interrogativa e a imagem concreta do hebraico.
