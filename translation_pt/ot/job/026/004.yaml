  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: pt
  text: A quem você declarou palavras, e o sopro[a] de quem saiu de você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espírito”. O substantivo hebraico pode significar “sopro” ou, em certos contextos, “espírito”.'
