  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: pt
  text: 'As colunas do céu tremem

    e ficam atônitas por causa da sua repreensão.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se abalam”, em vez de “tremem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficam pasmas” ou “ficam espantadas”, em vez de “ficam atônitas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, “da sua repreensão”; a preposição também pode indicar a causa da reação: “por causa da sua repreensão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: as colunas do céu
  rationale: Preserva a imagem cósmica e o sentido literal do construto hebraico. “Colunas” é corrente em português e evita reinterpretar a expressão como “fundamentos” ou “montanhas”.
- source_word: יְרוֹפָפוּ
  choice: tremem
  rationale: O verbo רפף indica tremer, sacudir ou estremecer. “Tremem” conserva tanto o movimento quanto o tom de assombro, sem sugerir necessariamente que as colunas estejam prestes a cair.
- source_word: וְיִתְמְהוּ
  choice: e ficam atônitas
  rationale: תמהּ descreve uma reação de espanto ou perplexidade. “Ficam atônitas” é natural e dignificado, mantendo a personificação e sem acrescentar a ideia de repulsa moral.
- source_word: מִגַּעֲרָתוֹ
  choice: diante da sua repreensão
  rationale: A preposição מִן pode exprimir origem ou causa. “Diante de” comunica de modo idiomático a reação provocada pela repreensão divina, enquanto as notas preservam as possibilidades mais literais e causais.
theological_decisions:
- issue: Imagem cósmica das “colunas do céu”
  choice: Manter a imagem poética sem explicá-la ou reinterpretá-la.
  alternative: Traduzir a expressão como referência a montanhas, fundamentos ou a uma cosmologia literalizada.
  rationale: O verso emprega linguagem cósmica poética. A tradução preserva a imagem e sua força teológica sem impor uma identificação externa ao texto.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A ordem poética foi mantida, e a personificação das colunas foi preservada. A quebra de linha apenas acompanha o paralelismo do verso.
