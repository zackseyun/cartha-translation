  text: נֹטֶ֣ה צָפ֣וֹן עַל תֹּ֑הוּ תֹּ֥לֶה אֶ֝֗רֶץ עַל בְּלִי מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: pt
  text: Ele estende o norte sobre o vazio[a][b]; suspende a terra sobre o nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o céu do norte”. O hebraico diz simplesmente “o norte”, que neste contexto poético pode se referir aos céus setentrionais.
    reason: lexical_alternative
  - marker: b
    text: Ou “a vastidão sem forma”. O termo hebraico pode indicar vazio, desolação ou ausência de forma.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: estende
  rationale: O particípio qal de נטה expressa estender ou expandir; “estende” é natural em português e preserva a imagem cósmica.
- source_word: צָפוֹן
  choice: o norte
  rationale: O substantivo significa literalmente “norte”. Neste contexto poético, pode designar a região setentrional do céu, mas a tradução literal preserva a ambiguidade.
- source_word: תֹּהוּ
  choice: o vazio
  rationale: תֹּהוּ pode indicar vazio, desolação ou ausência de forma. “O vazio” é claro e mantém a amplitude poética do termo.
- source_word: תֹּלֶה
  choice: suspende
  rationale: O particípio qal de תלה significa pendurar ou suspender. “Suspende” comunica com naturalidade que a terra é mantida sem suporte visível.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No contexto cosmológico, אֶרֶץ se refere à terra ou ao mundo, não a uma região específica.
- source_word: בְּלִי מָה
  choice: o nada
  rationale: A expressão significa “sem coisa alguma”. Com עַל, “sobre o nada” preserva tanto a construção espacial quanto a força idiomática.
- source_word: עַל
  choice: sobre
  rationale: A preposição aparece nas duas orações e “sobre” funciona naturalmente em ambas, preservando o paralelismo hebraico.
theological_decisions:
- issue: Imagens cosmológicas
  choice: Manter a descrição poética do domínio de Deus sobre a criação sem convertê-la em afirmação científica moderna.
  alternative: Interpretar o versículo como descrição científica precisa da terra no espaço, ou explicitar “norte” como referência mitológica.
  rationale: O texto sapiencial apresenta imagens cósmicas de forma poética. A tradução deve reproduzi-las sem reduzir sua força nem acrescentar uma interpretação científica ou mitológica que o hebraico não torna explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo foi preservado com “sobre” nas duas orações; “suspende” evita a possível ambiguidade coloquial de “pendura” sem enfraquecer a imagem.
