  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: pt
  text: Com seu poder, ele aquietou o mar; e, com seu entendimento, despedaçou Raabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, Raabe é um nome poético para uma potência do caos ou um monstro marinho que Deus subjuga; alternativamente, pode-se traduzir de modo interpretativo como “o monstro marinho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Com seu poder
  rationale: A preposição בְּ é instrumental neste contexto. “Poder” comunica naturalmente a força divina em escala cósmica.
- source_word: רָגַע
  choice: aquietou
  rationale: Com “o mar” como objeto, o verbo é entendido como fazer cessar a agitação, pôr em repouso. “Aquietou” preserva o tom poético sem eliminar a possível ressonância cósmica.
- source_word: הַיָּם
  choice: o mar
  rationale: Tradução direta que mantém tanto o sentido comum quanto a evocação poética do mar como força caótica.
- source_word: וּבִתְבוּנָתוֹ
  choice: e, com seu entendimento
  rationale: תְּבוּנָה indica entendimento, discernimento ou inteligência. “Entendimento” preserva o vínculo com o tema da sabedoria em Jó.
- source_word: מָחַץ
  choice: despedaçou
  rationale: O verbo expressa esmagar ou ferir de modo devastador. “Despedaçou” transmite a derrota decisiva em linguagem poética atual.
- source_word: רָהַב
  choice: Raabe
  rationale: Neste contexto cosmológico, o termo funciona melhor como nome poético de uma potência caótica ou monstro marinho. A transliteração preserva a imagem hebraica, e a nota esclarece o referente sem impor uma única interpretação.
theological_decisions:
- issue: Se רָהַב deve ser traduzido como nome próprio ou interpretado genericamente
  choice: O nome próprio “Raabe”, referente à potência caótica ou ao monstro marinho subjugado por Deus
  alternative: “orgulho” como substantivo abstrato; ou “o monstro marinho” como tradução interpretativa
  rationale: O paralelismo com o mar e o contexto cosmológico favorecem uma figura mitopoética. Manter “Raabe” conserva a tensão e a imagem do hebraico; a nota oferece a leitura interpretativa sem inseri-la no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem paralela dos dois meios divinos — poder e entendimento — foi preservada, assim como a linguagem poética de conflito cósmico.
