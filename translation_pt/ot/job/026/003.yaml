base_translation:
  language: en
  yaml_path: translation/ot/job/026/003.yaml
  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: pt
  text: Como aconselhaste quem não tem sabedoria[a] e deste a conhecer sabedoria sólida em abundância!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que conselho deste a quem não tem sabedoria, e quanta sabedoria sólida deste a conhecer!” A palavra hebraica inicial pode ser traduzida por “que” ou “como”; o texto principal usa a forma exclamativa com “como” para expressar a ironia de Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Como
  rationale: Em contexto exclamativo e irônico, מַה pode introduzir uma exclamação de modo ou intensidade. “Como” comunica naturalmente a censura sarcástica de Jó sem eliminar a alternativa interrogativa/exclamativa com “que”.
- source_word: יָּעַצְתָּ
  choice: aconselhaste
  rationale: O verbo יעץ significa aconselhar ou dar conselho. “Aconselhaste” preserva de modo direto a forma verbal e o tom do discurso sapiencial.
- source_word: לְלֹא חָכְמָה
  choice: quem não tem sabedoria
  rationale: A construção indica o destinatário caracterizado pela falta de sabedoria. Esta formulação é natural em português e não especifica além do que o hebraico permite.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente e adequado no contexto da literatura sapiencial.
- source_word: וְתוּשִׁיָּה
  choice: sabedoria sólida
  rationale: תּוּשִׁיָּה pode designar sabedoria eficaz, bom senso ou capacidade prática. “Sabedoria sólida” conserva sua ligação com o campo da sabedoria e sugere consistência e eficácia sem reduzi-la simplesmente a sucesso.
- source_word: לָרֹב
  choice: em abundância
  rationale: A expressão indica grande quantidade ou extensão. “Em abundância” mantém a intensificação irônica e segue de perto a construção hebraica.
- source_word: הוֹדָעְתָּ
  choice: deste a conhecer
  rationale: O hifil de ידע significa causar conhecimento ou tornar conhecido. “Deste a conhecer” é direto, digno e evita a conotação teológica mais específica que “revelaste” poderia introduzir.
theological_decisions: []
