lexical_decisions:
- source_word: מֶה
  choice: Como
  rationale: No contexto, introduz exclamações retóricas de forte ironia, e não uma pergunta simples com «o que».
- source_word: עָזַרְתָּ
  choice: você ajudou
  rationale: Traduz diretamente o verbo עזר e mantém a segunda pessoa na repreensão dirigida a Bildade.
- source_word: לְלֹא כֹחַ
  choice: quem não tem força
  rationale: Expressa naturalmente em português a referência singular e indefinida a alguém destituído de força.
- source_word: הוֹשַׁעְתָּ
  choice: salvou
  rationale: Preserva o sentido básico de ישׁע e o paralelismo irônico com «ajudou».
- source_word: זְרוֹעַ
  choice: o braço
  rationale: Mantém a imagem poética hebraica do braço como símbolo de capacidade e poder.
- source_word: לֹא עֹז
  choice: sem vigor
  rationale: Comunica a ausência de עֹז e evita uma repetição rígida de «força», ao mesmo tempo que conserva o paralelismo semântico.
