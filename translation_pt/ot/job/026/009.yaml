  text: מְאַחֵ֥ז פְּנֵי כִסֵּ֑ה פַּרְשֵׁ֖ז עָלָ֣י/ו עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: pt
  text: Ele encobre a face do seu trono[a], estendendo sobre ele a sua nuvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segura a face do trono”. O verbo hebraico significa mais literalmente “agarrar”, “segurar” ou “reter”, mas, neste contexto, provavelmente indica que a face do trono fica encoberta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: encobre
  rationale: Embora o verbo אָחַז normalmente expresse agarrar, segurar ou reter, neste contexto poético ele descreve, em paralelo com a nuvem estendida, a ocultação da parte visível do trono. “Encobre” comunica essa imagem sem apagar a alternativa mais literal, registrada em nota.
- source_word: פְּנֵי
  choice: a face de
  rationale: Preserva a imagem concreta do hebraico פָּנִים, que também pode designar a superfície ou parte visível de algo.
- source_word: כִסֵּה
  choice: seu trono
  rationale: כִּסֵּא significa “trono”. O possessivo explicita naturalmente que o trono pertence ao sujeito divino implícito, em harmonia com “sua nuvem” no segundo membro.
- source_word: פַּרְשֵׁז
  choice: estendendo
  rationale: O verbo raro no texto massorético é entendido pelo contexto e pela tradição lexical como ação de estender ou espalhar; o gerúndio mantém a relação poética com a primeira oração.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O sufixo masculino singular retoma naturalmente “trono”; em português, “sobre ele” conserva com clareza essa referência.
- source_word: עֲנָנוֹ
  choice: a sua nuvem
  rationale: Mantém o singular e o sufixo possessivo do hebraico, apresentando a nuvem como pertencente ao sujeito divino.
theological_decisions:
- issue: Sujeito implícito e referência possessiva
  choice: Deus encobre o próprio trono com a sua nuvem.
  alternative: Traduzir de modo mais impessoal como “o trono”, sem explicitar no primeiro membro a relação possessiva.
  rationale: O contexto descreve os atos cósmicos de Deus, e o sufixo de “sua nuvem” favorece a continuidade do mesmo referente. A tradução explicita essa relação sem acrescentar uma afirmação doutrinária alheia ao verso.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Face do seu trono” conserva a imagem poética hebraica; “encobre” evita o menos natural “agarra” no corpo do texto, enquanto a nota preserva a ambiguidade lexical genuína.
