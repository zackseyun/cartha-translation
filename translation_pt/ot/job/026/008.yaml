  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: pt
  text: Ele encerra as águas em suas nuvens densas[a], e a nuvem não se rompe sob elas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em suas nuvens”; o termo hebraico pode enfatizar nuvens espessas ou densas.
    reason: lexical_alternative
  - marker: b
    text: “Elas” pode referir-se às águas ou às massas de nuvens; o hebraico emprega um pronome plural.
    reason: referential_ambiguity
lexical_decisions:
- source_word: צֹרֵר
  choice: encerra
  rationale: O particípio de צרר expressa a ação de atar, envolver ou confinar. “Encerra” preserva a imagem de Deus contendo as águas nas nuvens e soa natural em português poético.
- source_word: מַיִם
  choice: as águas
  rationale: O plural hebraico é mantido como “as águas”, forma natural no registro poético e adequada à imagem cósmica.
- source_word: בְּעָבָיו
  choice: em suas nuvens densas
  rationale: עָב designa nuvem e pode enfatizar uma massa espessa. “Nuvens densas” comunica esse matiz e mantém o sufixo possessivo de terceira pessoa masculina singular.
- source_word: וְלֹא
  choice: e ... não
  rationale: A coordenação hebraica é preservada de modo simples. O contraste resulta naturalmente da relação entre conter as águas e a nuvem não se romper, sem precisar explicitá-lo com “contudo”.
- source_word: נִבְקַע
  choice: não se rompe
  rationale: O nifal de בקע indica ser fendido ou aberto. “Não se rompe” conserva a imagem física e a voz média/passiva natural em português; “não se abre” também seria possível.
- source_word: עָנָן
  choice: a nuvem
  rationale: Mantém-se o singular hebraico, que pode ter valor genérico ou coletivo no paralelismo poético.
- source_word: תַּחְתָּם
  choice: sob elas
  rationale: O sufixo hebraico é masculino plural e seu referente permanece gramaticalmente ambíguo. “Elas” retoma naturalmente “as águas” em português, sem eliminar em nota a possibilidade de referência às massas de nuvens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A ordem das imagens e o singular “a nuvem” seguem de perto o hebraico, enquanto “encerra” e “se rompe” proporcionam fluência natural.
