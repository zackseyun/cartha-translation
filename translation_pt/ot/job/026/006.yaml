  text: עָר֣וֹם שְׁא֣וֹל נֶגְדּ֑/וֹ וְ/אֵ֥ין כְּ֝ס֗וּת לָֽ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: pt
  text: O Sheol está nu diante dele, e Abadom[a] não tem cobertura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Destruição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: está nu
  rationale: O adjetivo significa “nu, despido, descoberto”. A formulação direta preserva a imagem poética e o paralelismo com “cobertura” no segundo membro.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém-se a transliteração do termo hebraico, cujo campo conceitual é mais amplo que “sepultura” e designa o domínio dos mortos na imagética bíblica.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: Reproduz de modo natural o sentido de “à frente de, diante de, na presença de”, sem explicitar além do hebraico que o referente contextual é Deus.
- source_word: אֵין
  choice: não tem
  rationale: Com o sintagma nominal seguinte, “não tem cobertura” é uma construção portuguesa natural que conserva a afirmação existencial do original.
- source_word: כְּסוּת
  choice: cobertura
  rationale: Preserva a ideia de algo que cobre ou oculta e mantém a ligação metafórica com “nu” no primeiro membro.
- source_word: אֲבַדּוֹן
  choice: Abadom
  rationale: A forma tradicional portuguesa translitera o termo hebraico e preserva sua força como designação quase própria, em paralelo com Sheol; o sentido lexical “Destruição” é registrado em nota.
theological_decisions:
- issue: Referente do sufixo masculino singular em נֶגְדּוֹ
  choice: “dele”, tendo Deus como referente contextual
  alternative: Um observador não especificado no discurso imediato
  rationale: O contexto descreve o conhecimento e o poder de Deus sobre os domínios ocultos. A tradução pronominal preserva a forma hebraica sem inserir o nome “Deus” no versículo.
- issue: Valor de אֲבַדּוֹן
  choice: Abadom como designação do domínio da destruição, em paralelo com Sheol
  alternative: O substantivo abstrato “Destruição”
  rationale: A transliteração conserva a ambiguidade entre nome próprio, lugar personificado e conceito, enquanto a nota fornece o sentido lexical.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. “Está nu” mantém a imagem concreta do hebraico; “Abadom” segue a forma reconhecível em português e recebe explicação lexical em nota.
