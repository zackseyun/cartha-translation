  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: pt
  text: Os espíritos dos mortos tremem sob as águas[a], e os que nelas habitam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Os mortos se contorcem sob as águas». O hebraico רְפָאִים pode significar «os mortos» ou «as sombras dos mortos», e יְחוֹלָלוּ também pode ser traduzido por «se contorcem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: os espíritos dos mortos
  rationale: Neste contexto poético sobre o domínio de Deus sobre o mundo dos mortos, רְפָאִים designa os mortos ou suas sombras, não o antigo povo dos refains. A expressão comunica esse sentido de modo claro e digno em português atual.
- source_word: יְחוֹלָלוּ
  choice: tremem
  rationale: O verbo pode expressar tremor, contorção ou dores de parto. Aqui, diante da soberania divina sobre as regiões cósmicas e subterrâneas, «tremem» transmite naturalmente a agitação temerosa, sem excluir em nota a imagem mais física de contorcer-se.
- source_word: מִתַּחַת מַיִם
  choice: debaixo das águas
  rationale: Preserva a relação espacial do hebraico e soa natural em português, mantendo a imagem poética das profundezas sob as águas.
- source_word: וְשֹׁכְנֵיהֶם
  choice: assim como os que nelas habitam
  rationale: O sufixo plural remete mais naturalmente às águas. «Nelas» explicita o antecedente sem identificar além do que o hebraico permite; «assim como» expressa a coordenação de elementos sujeitos ao mesmo verbo.
theological_decisions:
- issue: Referente de רְפָאִים
  choice: os espíritos dos mortos no mundo dos mortos
  alternative: os refains como povo antigo; simplesmente os mortos ou as sombras
  rationale: O contexto poético descreve o domínio de Deus sobre as esferas cósmicas e o mundo dos mortos. Por isso, o termo tem aqui seu sentido poético ligado aos falecidos, e não um sentido étnico.
- issue: Relação de וְשֹׁכְנֵיהֶם com o verbo
  choice: os habitantes das águas também tremem
  alternative: 'ligação mais solta: «e os que nelas habitam»'
  rationale: O hebraico coordena os habitantes com os רְפָאִים sob o verbo יְחוֹלָלוּ. «Assim como» torna essa relação inteligível em português sem definir quem são esses habitantes.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom permanece poético e digno. «Espíritos dos mortos» evita o sentido étnico impróprio de «refains», enquanto a nota preserva as alternativas lexicais genuínas. O marcador [a] aparece no texto principal.
