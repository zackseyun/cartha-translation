  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: pt
  text: Pois que interesse ele tem por sua casa depois dele,[a][b] quando o número de seus meses é cortado?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que prazer ele tem em sua casa depois dele?”'
    reason: lexical_alternative
  - marker: b
    text: “Casa” também pode incluir a família ou os descendentes.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e o número de seus meses é determinado” ou “é repartido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que sustenta o argumento anterior e preserva o nexo discursivo do hebraico.
- source_word: מַה חֶפְצוֹ
  choice: que interesse ele tem
  rationale: A expressão é retórica. חֵפֶץ pode indicar prazer, desejo ou interesse; esta formulação é natural em português sem eliminar a alternativa mais literal.
- source_word: בְּבֵיתוֹ
  choice: por sua casa
  rationale: A preposição marca o objeto do interesse. 'Casa' mantém a imagem literal e pode abranger casa, família ou descendência.
- source_word: אַחֲרָיו
  choice: depois de si
  rationale: Reproduz de modo conciso a referência ao que permanece após a morte do homem, sem explicitar mais do que o hebraico.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: quando o número de seus meses
  rationale: O waw é expresso por uma ligação temporal adequada ao contexto; 'meses' preserva a figura concreta do texto.
- source_word: חֻצָּצוּ
  choice: é cortado
  rationale: O passivo pode indicar que a extensão da vida chega ao fim. A concordância singular segue 'o número', embora o hebraico também admita a compreensão de meses determinados ou repartidos.
