  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: pt
  text: Passam os seus dias em prosperidade e, num instante, descem ao Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura”, “ao mundo dos mortos” ou “à morte”. O termo hebraico é Sheol.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: passam
  rationale: No piel, בלה expressa aqui o transcurso ou consumo dos dias. “Passam os seus dias” comunica isso de modo natural, sem sugerir necessariamente desgaste físico.
- source_word: בַטּוֹב
  choice: em prosperidade
  rationale: Embora טוֹב signifique literalmente “bem” ou “coisa boa”, neste contexto indica uma condição de bem-estar e abundância desfrutada pelos ímpios.
- source_word: יְמֵיהֶם
  choice: os seus dias
  rationale: Tradução direta que preserva a expressão temporal hebraica.
- source_word: וּבְרֶגַע
  choice: e, num instante
  rationale: רֶגַע designa um período extremamente breve. “Num instante” preserva o contraste entre uma vida inteira de prosperidade e a rapidez da descida ao mundo dos mortos.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico amplo do domínio dos mortos, sem o restringir a “sepultura”, “morte” ou ao conceito posterior de “inferno”.
- source_word: יֵחָתּוּ
  choice: descem
  rationale: Em ligação com שְׁאוֹל, o verbo é entendido como movimento descendente para o domínio dos mortos. “Descem” conserva a imagem espacial e é natural em português.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos; a morte
  rationale: O hebraico se refere ao destino ou domínio dos mortos sem exigir a noção doutrinária posterior de “inferno”. Manter “Sheol” conserva a abertura conceitual e teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. O pronome sujeito foi omitido por ser desnecessário em português, sem perda do referente plural. A nota foi vinculada a “Sheol”, termo ao qual suas alternativas lexicais efetivamente se referem.
