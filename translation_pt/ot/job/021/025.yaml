  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: pt
  text: enquanto outro morre com a alma amargurada, sem ter desfrutado do bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e este morre com amargura na alma e não comeu do bem”. O hebraico conserva a imagem de comer para falar da experiência do bem na vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: enquanto outro
  rationale: No contexto, o conectivo e o demonstrativo introduzem contraste com a pessoa descrita no versículo anterior. “Enquanto outro” expressa naturalmente essa contraposição em português.
- source_word: יָמוּת
  choice: morre
  rationale: O imperfeito descreve aqui um caso geral, não necessariamente uma previsão futura; o presente traduz adequadamente esse valor gnômico.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: com a alma amargurada
  rationale: Mantém נֶפֶשׁ como “alma” e comunica de modo natural o estado interior marcado pela amargura, sem reduzi-lo apenas às circunstâncias externas.
- source_word: וְ/לֹא אָכַל
  choice: sem ter desfrutado
  rationale: Embora אָכַל signifique literalmente “comer”, nesta construção indica participar do bem ou experimentá-lo. “Sem ter desfrutado” comunica o sentido idiomático; a nota preserva a imagem concreta do hebraico.
- source_word: בַּ/טּוֹבָה
  choice: do bem
  rationale: “Do bem” preserva a amplitude do substantivo hebraico, que pode abranger bem-estar, prosperidade e aquilo que é bom, sem restringi-lo a bens materiais.
