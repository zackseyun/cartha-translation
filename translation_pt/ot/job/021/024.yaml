  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: pt
  text: Suas vasilhas estão cheias de leite[a], e a medula de seus ossos está bem umedecida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus úberes estão cheios de leite”. O termo hebraico é raro e pode referir-se tanto a úberes quanto a recipientes de leite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: seus recipientes
  rationale: O substantivo é raro e discutido, podendo indicar recipientes de leite ou úberes. “Recipientes” preserva a imagem de abundância sem atribuir diretamente úberes ao homem descrito; a alternativa é registrada em nota.
- source_word: מָלְאוּ
  choice: estão cheios
  rationale: O perfeito descreve aqui o estado próspero da pessoa; o presente expressa naturalmente esse valor resultativo ou estativo em português.
- source_word: חָלָב
  choice: leite
  rationale: É o sentido lexical comum e, no contexto, representa fartura e prosperidade.
- source_word: וּמֹחַ
  choice: e a medula
  rationale: Mantém a imagem corporal concreta do hebraico em português natural.
- source_word: עַצְמוֹתָיו
  choice: de seus ossos
  rationale: 'Reproduz diretamente a relação construta: “a medula de seus ossos”.'
- source_word: יְשֻׁקֶּה
  choice: é bem irrigada
  rationale: O pual indica que a medula recebe umidade ou líquido. “Bem irrigada” conserva a metáfora de vigor e florescimento, embora seja uma formulação poética incomum em português.
