  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: pt
  text: Escutem com atenção as minhas palavras, e que isso seja o consolo de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as consolações de vocês”; o substantivo está no plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Escutem com atenção
  rationale: O imperativo plural seguido do infinitivo absoluto intensifica o chamado a ouvir. A formulação adverbial comunica essa ênfase de modo natural em português.
- source_word: מִלָּתִי
  choice: as minhas palavras
  rationale: Embora o substantivo esteja formalmente no singular, neste apelo ele designa aquilo que Jó dirá; o plural é a expressão idiomática mais natural em português e corresponde ao sentido contextual.
- source_word: וּתְהִי זֹאת
  choice: e que isso seja
  rationale: Preserva o valor volitivo do jussivo e mantém a referência compacta do demonstrativo ao ato de escutá-lo.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: o consolo que vocês me oferecem
  rationale: O hebraico diz literalmente 'os consolos de vocês'. A explicitação natural em português indica que ouvi-lo deve constituir o consolo vindo dos interlocutores, sem eliminar a possível ironia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural expresso por “vocês”, de ampla legibilidade brasileira. A possível ironia de Jó permanece implícita, como no hebraico.
