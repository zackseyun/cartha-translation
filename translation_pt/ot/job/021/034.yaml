  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: pt
  text: Como, então, vocês podem me consolar com palavras vazias[a], quando em suas respostas permanece a deslealdade?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como vocês podem me consolar em vão, quando em suas respostas permanece a deslealdade?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Como, então
  rationale: A expressão introduz uma pergunta retórica; “então” comunica naturalmente a força conectiva do waw no contexto.
- source_word: תְּנַחֲמוּנִי
  choice: vocês podem me consolar
  rationale: O piel de נחם com sufixo de primeira pessoa significa “consolar-me”. O modal “podem” expressa o desafio retórico de modo natural em português.
- source_word: הָבֶל
  choice: com palavras vazias
  rationale: הבל denota vazio, futilidade ou vaidade. “Palavras vazias” torna explícito o sentido contextual — o conteúdo do consolo oferecido pelos amigos — sem reduzi-lo apenas a uma tentativa malsucedida.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: as suas respostas
  rationale: תשובה significa “resposta” ou “réplica”; “respostas” é claro e natural para os discursos dos amigos.
- source_word: נִשְׁאַר
  choice: continuam sendo
  rationale: O nifal de שׁאר significa “restar, permanecer”. Aqui, “continuam sendo” comunica idiomaticamente que, ao fim, as respostas permanecem caracterizadas pela deslealdade.
- source_word: מָעַל
  choice: pura deslealdade
  rationale: מעל indica infidelidade, violação de confiança ou traição. “Deslealdade” preserva a dimensão relacional da acusação; “pura” exprime a força predicativa sem transformar o termo em simples erro factual.
