  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: pt
  text: Vocês não perguntaram aos que passam pelo caminho[a] e não reconhecem os sinais deles[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos viajantes” ou “aos que seguem pela estrada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as marcas deles” ou “os indícios deles”; a expressão provavelmente se refere às evidências conhecidas por meio dos relatos dos viajantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Vocês não...
  rationale: Mantém a pergunta retórica que espera concordância e preserva o tom de repreensão.
- source_word: שְׁאֶלְתֶּם
  choice: perguntaram
  rationale: Equivalente direto, corrente e natural para o verbo hebraico 'perguntar, indagar'.
- source_word: עֹבְרֵי דָרֶךְ
  choice: aos que passam pela estrada
  rationale: Reproduz de perto a construção participial e o substantivo singular 'caminho/estrada', referindo-se a viajantes experientes.
- source_word: וְאֹתֹתָם
  choice: os sinais deles
  rationale: Preserva o sentido lexical comum de אוֹת, sem explicitar no corpo do texto se são indícios, marcas ou testemunhos.
- source_word: לֹא תְנַכֵּרוּ
  choice: não reconhecem
  rationale: Verte naturalmente o piel de נכר neste contexto e conserva a ligação semântica com 'sinais'.
