  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: pt
  text: Quanto a mim, é contra um ser humano a minha queixa? Se não, por que o meu espírito não haveria de ficar impaciente?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: minha queixa
  rationale: No contexto da resposta de Jó, o termo designa sua fala de lamento ou queixa, não mera conversa.
- source_word: לְאָדָם
  choice: contra algum ser humano
  rationale: A preposição pode indicar o destinatário ou alvo da queixa; a formulação preserva a pergunta retórica e deixa claro o sentido humano genérico de אָדָם.
- source_word: תִקְצַר רוּחִי
  choice: meu espírito não ficaria impaciente
  rationale: A expressão idiomática descreve o espírito que se torna curto, isto é, incapaz de suportar pacientemente; 'ficaria impaciente' é natural em português e mantém a imagem antropológica de 'espírito'.
theological_decisions:
- issue: Alvo implícito da queixa de Jó
  choice: Manter a pergunta sem explicitar que a queixa é dirigida a Deus
  alternative: É diante de Deus a minha queixa?
  rationale: O hebraico pergunta literalmente se a queixa é 'para/contra o ser humano'. Embora o contraste sugira um alvo não humano, explicitar 'Deus' resolveria uma implicação que o texto deixa subentendida.
- issue: Valor de וְאִם
  choice: Se não
  alternative: E, se fosse assim
  rationale: A construção elíptica retoma a resposta negativa esperada à primeira pergunta. 'Se não' preserva essa concisão e a ligação lógica sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial 'Quanto a mim' conserva a ênfase de הֶאָנֹכִי; 'algum ser humano' evita que 'homem' seja entendido apenas como pessoa do sexo masculino.
