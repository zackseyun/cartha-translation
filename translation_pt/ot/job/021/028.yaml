  text: כִּ֤י תֹֽאמְר֗וּ אַיֵּ֥ה בֵית נָדִ֑יב וְ֝/אַיֵּ֗ה אֹ֤הֶל מִשְׁכְּנ֬וֹת רְשָׁעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: pt
  text: 'Pois vocês dizem: “Onde está a casa do nobre[a]? E onde está a tenda, a morada dos perversos[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do príncipe”. O termo hebraico pode indicar uma pessoa nobre, influente ou de posição principesca, e não apenas alguém generoso.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é condensada e diz literalmente algo como “a tenda, as moradas dos perversos”. Pode significar “a tenda onde os perversos moram” ou identificar a tenda como a morada deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a alegação dos interlocutores e a liga ao argumento anterior com valor explicativo.
- source_word: תֹאמְרוּ
  choice: vocês dizem
  rationale: O imperfeito expressa aqui uma afirmação representativa ou habitual; o presente é natural em português.
- source_word: בֵית נָדִיב
  choice: a casa do nobre
  rationale: Preserva a imagem básica de בֵית e entende נָדִיב como pessoa de posição social elevada, sem restringi-lo necessariamente a um título régio.
- source_word: אֹהֶל
  choice: tenda
  rationale: Mantém a imagem concreta e o sentido comum do substantivo hebraico.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: a morada dos perversos
  rationale: Expressa em português natural a relação comprimida com 'tenda'. Embora מִשְׁכְּנוֹת seja formalmente plural, a construção pode funcionar de modo explicativo ou coletivo em relação à tenda singular.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente culpáveis e preserva a categoria ética do hebraico em linguagem atual.
