  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: pt
  text: Ambos jazem no pó, e os vermes[a] os cobrem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as larvas». O termo hebraico רִמָּה pode designar vermes ou larvas em contextos de decomposição corporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Juntos
  rationale: O advérbio destaca o destino comum das duas pessoas contrastadas no contexto, sem afirmar necessariamente que foram sepultadas no mesmo lugar.
- source_word: עַל עָפָר
  choice: no pó
  rationale: Embora עַל possa significar literalmente «sobre», em contexto de morte e sepultamento «no pó» é natural em português e conserva a imagem bíblica.
- source_word: יִשְׁכָּבוּ
  choice: jazem
  rationale: «Jazem» expressa de modo conciso e digno o ato de estar deitado na morte, adequado ao valor geral do imperfeito hebraico neste contexto.
- source_word: רִמָּה
  choice: vermes
  rationale: O substantivo pode designar vermes ou larvas associados à decomposição. O plural genérico «vermes» é corrente em português e mantém a amplitude do termo.
- source_word: תְּכַסֶּה
  choice: cobrem
  rationale: O singular hebraico concorda com um substantivo coletivo; em português, o plural «vermes» pede naturalmente o verbo no plural, sem alterar o sentido.
- source_word: עֲלֵיהֶם
  choice: os
  rationale: O sentido da preposição é incorporado de modo idiomático à construção portuguesa «os cobrem».
