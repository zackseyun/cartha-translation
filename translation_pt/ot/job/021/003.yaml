  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: pt
  text: Tenham paciência comigo[a], e eu falarei; depois que eu tiver falado[b], você poderá zombar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Suportem-me”. O hebraico usa literalmente o verbo “carregar, suportar”, aqui no sentido de tolerar alguém e permitir que fale.
    reason: lexical_alternative
  - marker: b
    text: Ou “depois que eu falar, você zombará”. O hebraico pode indicar futuro simples (“zombará”) ou ter sentido permissivo ou concessivo (“poderá zombar”); o texto principal adota esta última leitura por se ajustar melhor ao contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּ/נִי
  choice: Tenham paciência comigo
  rationale: O verbo נָשָׂא significa literalmente “levantar, carregar, suportar”, mas neste contexto discursivo pede que os ouvintes tolerem Jó e lhe deem espaço para falar. A expressão escolhida é natural em português e preserva essa força interpessoal.
- source_word: וְ/אָנֹכִי אֲדַבֵּר
  choice: e eu falarei
  rationale: O pronome אָנֹכִי explicita e realça a primeira pessoa, enquanto אֲדַבֵּר é o verbo comum para “falar”. A formulação conserva a coordenação simples e a ênfase em Jó como falante.
- source_word: וְ/אַחַר דַּבְּרִי
  choice: depois que eu tiver falado
  rationale: דַּבְּרִי é literalmente “meu falar”, isto é, o ato de Jó falar. Uma oração temporal com futuro composto é idiomática em português e mantém a sequência temporal.
- source_word: תַלְעִיג
  choice: você poderá zombar
  rationale: O hifil de לעג significa “zombar, escarnecer”. A forma verbal é singular, em contraste com o imperativo plural inicial; por isso, o texto mantém “você”. “Poderá” expressa a leitura permissiva ou concessiva apropriada ao contexto sem ocultar a alternativa de futuro simples.
