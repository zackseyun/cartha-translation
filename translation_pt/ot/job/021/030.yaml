source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: pt
  text: Pois o perverso é poupado para o dia da calamidade[a]; eles são levados para o dia da ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é retido” ou “é reservado para o dia da calamidade”. O verbo hebraico pode significar ser poupado, retido ou reservado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles são trazidos para o dia da ira”. O verbo final pode indicar que são levados ou trazidos até esse dia.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva a ligação argumentativa com o contexto.
- source_word: לְיוֹם אֵיד
  choice: para o dia da calamidade
  rationale: A preposição לְ com “dia” aponta aqui para uma ocasião futura; אֵיד denota calamidade, desastre ou ruína.
- source_word: יֵחָשֶׂךְ
  choice: é poupado
  rationale: O nifal de חשׂך pode significar ser poupado, retido ou preservado. “É poupado” expressa com naturalidade a ausência de juízo imediato, sem ocultar as demais possibilidades, registradas em nota.
- source_word: רָע
  choice: o perverso
  rationale: O adjetivo singular funciona como substantivo e designa uma pessoa má. “O perverso” mantém o singular representativo e soa natural no registro bíblico moderno.
- source_word: לְיוֹם עֲבָרוֹת
  choice: para o dia da ira
  rationale: עֲבָרוֹת, formalmente plural, pode intensificar a ideia de furor ou ira. A expressão idiomática “dia da ira” preserva a força judicial sem impor um plural pouco natural.
- source_word: יוּבָלוּ
  choice: eles são levados
  rationale: O hofal de יבל indica ser levado, conduzido ou trazido. O plural hebraico é mantido em “eles”, preservando a mudança abrupta do singular para o plural.
theological_decisions:
- issue: Relação do versículo com o momento do juízo divino
  choice: O perverso é poupado do desastre imediato e levado para um futuro dia de ira.
  alternative: O perverso é mantido longe do dia da calamidade, sem necessariamente ser reservado para enfrentá-lo.
  rationale: As duas expressões temporais com לְיוֹם e o paralelismo verbal favorecem a ideia de adiamento ou reserva para um juízo futuro, coerente com o argumento de Jó de que os perversos muitas vezes não recebem retribuição imediata. As notas preservam a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a mudança do singular “o perverso” para o plural “eles”, presente no hebraico, e mantém as ambiguidades principais em notas.
