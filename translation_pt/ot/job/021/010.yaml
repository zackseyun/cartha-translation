  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: pt
  text: Seu touro cobre e não falha[a]; sua vaca pare e não perde a cria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “e não rejeita” ou “e não torna estéril”. O verbo hebraico é difícil neste contexto; o texto principal traduz o sentido indicado pelo paralelismo: a cobertura do touro é bem-sucedida, não infrutífera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: seu touro
  rationale: שׁוֹר designa um bovino; no contexto reprodutivo, trata-se do macho usado para a cobertura, portanto “touro” é mais preciso que “boi”.
- source_word: עִבַּר
  choice: cobre
  rationale: Neste contexto de reprodução animal, a forma verbal indica que o macho cobre a fêmea. “Cobre” é expressão corrente e concisa em português para o acasalamento de animais.
- source_word: וְלֹא יַגְעִל
  choice: e não falha
  rationale: O verbo é lexicalmente difícil neste contexto. O paralelismo aponta para uma cobertura eficaz, não infrutífera; “não falha” comunica o resultado sem impor uma acepção técnica incerta.
- source_word: תְּפַלֵּט
  choice: dá cria
  rationale: A forma verbal descreve a vaca trazendo à luz sua cria. “Dá cria” é natural em português e adequado ao contexto pecuário.
- source_word: פָּרָתוֹ
  choice: sua vaca
  rationale: פָּרָה significa “vaca”; o texto não exige a especificação etária de “novilha”.
- source_word: וְלֹא תְשַׁכֵּל
  choice: e não perde o bezerro
  rationale: שׁכל no Piel expressa ficar privada da cria. “Não perde o bezerro” preserva a amplitude entre aborto e perda no parto, evitando restringir o sentido indevidamente.
