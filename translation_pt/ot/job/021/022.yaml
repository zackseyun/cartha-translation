  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: pt
  text: Pode alguém ensinar conhecimento a Deus, visto que ele julga os que estão no alto?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os exaltados”; possivelmente, “os seres celestiais”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: a Deus
  rationale: A construção interrogativa introduz uma pergunta retórica; em português, acrescenta-se naturalmente o sujeito indefinido “alguém”, enquanto לְאֵל é expresso por “a Deus”.
- source_word: יְלַמֶּד
  choice: pode ensinar
  rationale: O piel de למד significa “ensinar, instruir”. O auxiliar “pode” torna explícita, de modo natural em português, a força retórica da pergunta sem alterar seu sentido.
- source_word: דָּעַת
  choice: conhecimento
  rationale: O substantivo denota conhecimento ou entendimento; “conhecimento” preserva a forma abstrata e a formulação direta do hebraico.
- source_word: וְהוּא
  choice: visto que ele
  rationale: Embora וְ possa ser traduzido literalmente por “e”, aqui a segunda oração fundamenta a pergunta retórica. “Visto que” comunica essa relação lógica em português corrente.
- source_word: רָמִים
  choice: os que estão nas alturas
  rationale: O adjetivo plural substantivado pode indicar seres ou pessoas elevados. Esta expressão preserva a amplitude do referente, sem decidir entre poderosos terrenos e seres celestiais.
- source_word: יִשְׁפּוֹט
  choice: julga
  rationale: O qal de שפט tem o sentido direto de “julgar”; a escolha mantém a afirmação da autoridade judicial de Deus.
theological_decisions:
- issue: Referente de רָמִים
  choice: os que estão nas alturas
  alternative: os exaltados; os seres celestiais
  rationale: O hebraico não exige que o referente seja limitado a governantes terrenos nem a seres celestiais. A formulação ampla conserva essa ambiguidade e a ênfase na supremacia de Deus.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A pergunta retórica foi preservada, e a expressão ambígua רָמִים não foi estreitada por interpretação.
