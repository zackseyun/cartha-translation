base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: pt
  text: 'Contudo, eles dizem a Deus: “Afasta-te de nós[a]! Não queremos conhecer os teus caminhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Desvia-te de nós” ou “Vai embora de nós”.'
    reason: Alternativas lexicais possíveis para סוּר מִמֶּנּוּ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Contudo, eles dizem
  rationale: O discurso de Jó descreve a postura característica dos ímpios; o presente é natural em português, e “contudo” explicita o contraste contextual entre sua prosperidade e sua rejeição de Deus.
- source_word: לָאֵל
  choice: a Deus
  rationale: אֵל é aqui a designação comum de Deus, não um nome próprio distinto.
- source_word: סוּר מִמֶּנּוּ
  choice: Afasta-te de nós
  rationale: O imperativo סוּר pede que Deus se retire ou se desvie deles. “Afasta-te de nós” conserva a ordem direta, solene e contundente.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: conhecer os teus caminhos
  rationale: Em ligação com חפץ, o substantivo דַּעַת pode ser expresso naturalmente em português pelo infinitivo “conhecer”. דְּרָכֶיךָ designa os modos de agir ou caminhos morais de Deus.
- source_word: לֹא חָפָצְנוּ
  choice: Não queremos
  rationale: חפץ expressa desejo, vontade ou prazer. “Não queremos” comunica com clareza a recusa volitiva, sem acrescentar uma nuance emocional mais forte.
theological_decisions:
- issue: A fala dos ímpios dirigida a Deus
  choice: 'Discurso direto mantido: “Afasta-te de nós!”'
  alternative: Paráfrase indireta ou suavizada, como “Deixa-nos em paz”
  rationale: O hebraico apresenta um imperativo direto e contundente dirigido a Deus. A tradução preserva o choque teológico da rejeição humana sem atenuá-lo.
- issue: Relação entre as duas orações
  choice: Coordenação preservada sem explicitação causal
  alternative: “pois não queremos conhecer os teus caminhos”
  rationale: O וְ hebraico coordena as declarações. Evitar “pois” preserva a ambiguidade quanto a uma possível relação explicativa e mantém o paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “tu” acompanha a segunda pessoa singular do hebraico e sustenta o tom direto da interpelação.
