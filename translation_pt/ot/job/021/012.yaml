base_translation:
  language: en
  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: pt
  text: Cantam ao som do tamborim e da lira e se alegram ao som da flauta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Cantam
  rationale: O verbo significa literalmente «erguem/levantam», mas aqui aparece sem objeto expresso e em contexto musical; «cantam» comunica de modo natural a ideia de erguer a voz, sem acrescentar um objeto estranho ao verso.
- source_word: כְּתֹף
  choice: ao som do tamborim
  rationale: תֹּף designa um instrumento de percussão manual, frequentemente traduzido por «tamborim»; a construção «ao som de» explicita em português a função instrumental da preposição.
- source_word: כִּנּוֹר
  choice: lira
  rationale: Instrumento antigo de cordas; «lira» é uma equivalência corrente e mais historicamente adequada do que «harpa» em muitos contextos.
- source_word: עוּגָב
  choice: flauta
  rationale: O termo designa um instrumento de sopro, embora sua identificação exata seja incerta; «flauta» preserva a categoria instrumental e é compreensível ao leitor moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A repetição de «ao som» acompanha a estrutura musical do verso e evita uma formulação artificial. Não se introduzem notas porque as incertezas lexicais não afetam de modo substancial o sentido do versículo.
