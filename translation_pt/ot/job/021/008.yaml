base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: pt
  text: A sua descendência está firmemente estabelecida diante deles, com eles, e os seus descendentes estão diante dos seus olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַרְעָם
  choice: sua descendência
  rationale: זֶרַע designa coletivamente a prole ou posteridade. “Descendência” preserva esse sentido coletivo sem restringi-lo apenas aos filhos mais novos.
- source_word: נָכוֹן
  choice: está firmemente estabelecida
  rationale: A forma passiva ou adjetival exprime algo firme, estabelecido ou seguro. “Firmemente estabelecida” conserva o caráter estativo e a ideia de estabilidade, sem reduzir o termo apenas à segurança.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Reproduz de modo natural a imagem espacial do hebraico e sugere que eles vivem para ver a prosperidade de sua descendência.
- source_word: עִמָּם
  choice: junto deles
  rationale: Expressa claramente a ideia de companhia ou presença indicada por עִם e evita uma repetição pouco fluida de “com eles” após “diante deles”.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: e seus descendentes
  rationale: צֶאֱצָאִים se refere à progenitura ou aos descendentes. “Descendentes” é claro, atual e mantém o paralelismo com o termo coletivo anterior.
- source_word: לְעֵינֵיהֶם
  choice: perante seus olhos
  rationale: Preserva a imagem concreta do hebraico, indicando observação direta, e mantém o paralelismo com “diante deles”.
theological_decisions: []
translation_notes:
