base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: pt
  text: Quantas vezes[a] se apaga a lâmpada[b] dos ímpios, lhes sobrevém a calamidade e ele lhes reparte dores[c] em sua ira?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com que frequência”. A pergunta é retórica: Jó contesta a ideia de que os ímpios sejam regularmente julgados dessa maneira.'
    reason: lexical_alternative
  - marker: b
    text: “Lâmpada” é uma metáfora para a vida, a prosperidade ou a continuação da boa sorte de uma pessoa.
    reason: cultural_note
  - marker: c
    text: 'Ou: “sofrimentos” ou “dores de parto”. O termo hebraico pode expressar vários sentidos relacionados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Quantas vezes
  rationale: Neste contexto, o interrogativo pergunta retoricamente pela frequência. “Quantas vezes” é natural em português e preserva o desafio de Jó à ideia de que esse juízo sempre ou regularmente alcança os ímpios.
- source_word: נֵר
  choice: lâmpada
  rationale: Preserva a imagem concreta do hebraico, usada metaforicamente para a vida, a prosperidade ou a continuidade da boa sorte de alguém.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Equivalente tradicional, conciso e ainda corrente em português para pessoas moralmente perversas no contexto da literatura sapiencial.
- source_word: יִדְעָךְ
  choice: se apaga
  rationale: O verbo descreve uma lâmpada que se extingue. “Se apaga” é idiomático e não explicita um agente que o hebraico não nomeia.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: e a desgraça deles vem sobre eles
  rationale: Mantém a imagem da calamidade sobrevindo aos próprios ímpios e traduz אֵיד por uma palavra clara e atual.
- source_word: חֲבָלִים
  choice: sofrimentos
  rationale: O substantivo pode designar dores, aflições ou dores de parto. “Sofrimentos” comunica o sentido amplo exigido pelo paralelismo sem restringir indevidamente a imagem.
- source_word: יְחַלֵּק
  choice: distribui
  rationale: O Piel de חלק significa dividir, repartir ou distribuir. “Distribui” é natural e preserva a ideia de atribuir aflições como porções.
- source_word: בְּאַפּוֹ
  choice: em sua ira
  rationale: A expressão idiomática denota ira. A formulação é direta, digna e mantém o pronome do texto sem nomear explicitamente seu referente.
theological_decisions:
- issue: Referente do sujeito implícito em יְחַלֵּק e do sufixo em בְּאַפּוֹ
  choice: Manter “ele” e “sua” sem acrescentar “Deus”
  alternative: 'Explicitar: “Deus lhes distribui sofrimentos em sua ira”'
  rationale: O contexto aponta fortemente para Deus, mas o hebraico não o nomeia nesta oração. A tradução conserva essa implicitudine e evita tornar explícito o que permanece contextual no texto-fonte.
- issue: Alcance retórico de כַּמָּה
  choice: Repetir “Quantas vezes” no início da segunda pergunta
  alternative: Usar apenas uma ocorrência no início do versículo, deixando-a reger todas as orações
  rationale: O hebraico emprega o interrogativo uma vez, mas seu valor retórico se estende às descrições coordenadas. A repetição em português torna esse alcance claro sem alterar o argumento de Jó.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A imagem da lâmpada e a referência pronominal implícita a Deus foram preservadas; a repetição de “Quantas vezes” esclarece em português o alcance da pergunta retórica.
