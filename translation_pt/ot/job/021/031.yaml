  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: pt
  text: Quem lhe declara, cara a cara, o seu caminho[a]? E, pelo que ele fez[b], quem lhe retribui?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «diante dele». Literalmente, «sobre a sua face», uma expressão de confronto direto em sua presença.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é conciso: «e ele fez; quem lhe retribui?» A tradução explicita o sentido provável: «pelo que ele fez».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Mantém a forma interrogativa retórica do hebraico, sem transformar sua força negativa implícita numa negação explícita.
- source_word: יַגִּיד
  choice: denuncia
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer; no contexto de confrontar a conduta do ímpio, «denuncia» comunica uma declaração acusatória feita abertamente.
- source_word: עַל־פָּנָיו
  choice: lhe denuncia na cara
  rationale: A expressão significa literalmente «sobre a face dele» e, idiomaticamente, indica confronto direto em sua presença; «na cara» preserva essa força em português corrente.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Preserva a metáfora hebraica de דֶּרֶךְ para o modo de agir ou a conduta, permanecendo compreensível no contexto.
- source_word: וְהוּא עָשָׂה
  choice: pelo que ele fez
  rationale: A construção hebraica é elíptica, literalmente «e ele fez»; a formulação explicita com moderação que seus atos constituem a razão da retribuição.
- source_word: יְשַׁלֶּם לוֹ
  choice: lhe dá o troco
  rationale: O piel de שלם expressa pagar de volta ou retribuir. «Dar o troco» é uma expressão corrente que aqui comunica retribuição, não uma simples transação comercial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e vigoroso. A primeira pergunta conserva a metáfora de «caminho» e o tom de confronto direto; a segunda mantém a ideia de retribuição. «Na cara» e «dar o troco» são idiomáticos e amplamente compreensíveis, sem perder a dignidade do discurso poético.
