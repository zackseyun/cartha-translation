  naturalness: «Na cara» e sobretudo «dar o troco» são excessivamente coloquiais para o registro poético e sapiencial do versículo. «Cara a cara» mantém a força de confronto direto com maior dignidade, e «retribui» é claro e idiomático em português internacional.
