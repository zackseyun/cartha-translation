  text: בָּתֵּי/הֶ֣ם שָׁל֣וֹם מִ/פָּ֑חַד וְ/לֹ֤א שֵׁ֖בֶט אֱל֣וֹהַּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: pt
  text: Suas casas estão seguras, livres do medo, e a vara de Deus não está sobre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “vara de Deus” é uma figura para o golpe, a disciplina, o castigo ou a aflição que vêm de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: suas casas
  rationale: O plural com sufixo significa literalmente “suas casas”. Embora possa abranger as famílias ou unidades domésticas, a forma concreta preserva a imagem hebraica e soa natural em português.
- source_word: שָׁלוֹם מִפָּחַד
  choice: estão seguras, livres do medo
  rationale: שָׁלוֹם indica aqui segurança e bem-estar, enquanto מִפָּחַד expressa afastamento do medo ou pavor. A formulação comunica naturalmente essa relação sem reduzir שָׁלוֹם ao simples estado emocional de paz.
- source_word: שֵׁבֶט
  choice: vara
  rationale: שֵׁבֶט pode designar vara, bastão ou cetro. Neste contexto, funciona como imagem do golpe, castigo, disciplina ou aflição procedente de Deus; “vara” preserva a metáfora sem especificá-la em excesso.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Forma poética singular comum para Deus no livro de Jó; não há fundamento textual para ampliar o título.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל indica que a vara está ou vem sobre alguém. “Sobre eles” preserva a imagem e mantém um tom poético natural.
- source_word: וְלֹא
  choice: e ... não
  rationale: A conjunção coordena a segunda afirmação com a primeira; “e ... não” reproduz essa estrutura de modo claro em português.
theological_decisions:
- issue: Natureza da ação divina representada pela “vara de Deus”
  choice: Manter a metáfora “a vara de Deus”
  alternative: o castigo de Deus; a disciplina de Deus; o flagelo de Deus
  rationale: A metáfora hebraica pode abranger golpe, castigo, disciplina ou aflição. Explicitar apenas uma dessas ideias eliminaria uma amplitude que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima do paralelismo hebraico; a vírgula em “seguras, livres do medo” explicita naturalmente a relação entre שָׁלוֹם e מִפָּחַד.
