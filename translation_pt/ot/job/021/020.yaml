id: JOB.21.20
reference: Job 21:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: pt
  text: Que os próprios olhos dele vejam sua ruína[b][a], e que ele beba da ira do Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os olhos dele verão sua calamidade, e ele beberá da ira do Todo-Poderoso”. Os verbos hebraicos no imperfeito podem ser entendidos como predições, em vez de um desejo.'
    reason: alternative_reading
  - marker: b
    text: “Sua ruína” também pode ser traduzido por “sua calamidade” ou “seu desastre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: Que ... vejam
  rationale: O qal imperfeito na 3ª pessoa do plural concorda com o sujeito plural “olhos”. No contexto, pode expressar um desejo de que o ímpio sofra pessoalmente o juízo; a leitura preditiva permanece indicada em nota.
- source_word: עיניו
  choice: os próprios olhos dele
  rationale: Traduz literalmente a ideia de “seus olhos”, acrescentando “próprios” para tornar explícita, em português natural, a ênfase na experiência pessoal do ímpio.
- source_word: כִּידוֹ
  choice: sua ruína
  rationale: כִּיד denota calamidade, desastre ou ruína. “Ruína” é conciso e não sugere necessariamente aniquilação.
- source_word: וּמֵחֲמַת
  choice: e ... da ira de
  rationale: חֵמָה pode significar ira, furor e, em certos contextos, veneno. Com o verbo “beber” e o juízo divino, “beber da ira” preserva adequadamente a metáfora.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Equivalente tradicional e inteligível do título divino שַׁדַּי, frequente em Jó.
- source_word: יִשְׁתֶּה
  choice: que ele beba
  rationale: O qal imperfeito na 3ª pessoa do singular é entendido em paralelo com a primeira oração como expressão de desejo. “Beba” preserva a metáfora hebraica em vez de explicá-la como “experimente”.
theological_decisions:
- issue: Valor dos verbos no imperfeito
  choice: 'Desejo de tom volitivo: “Que ... vejam ... que ele beba”'
  alternative: 'Predição futura: “Os olhos dele verão ... ele beberá”'
  rationale: O contexto apresenta Jó insistindo em que o próprio ímpio enfrente as consequências. Contudo, a forma hebraica também admite valor preditivo, preservado em nota.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem dos marcadores [b][a] acompanha sua incidência: [b] esclarece “ruína”, enquanto [a] abrange a leitura verbal alternativa do versículo inteiro.'
