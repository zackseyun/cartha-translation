base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: pt
  text: Por que os maus continuam vivos, envelhecem e até se tornam poderosos em riqueza[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se tornam poderosos em força/poder”. O termo hebraico pode indicar riqueza, recursos, força ou poder militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz diretamente a pergunta de protesto de Jó, sem acrescentar explicação ausente do hebraico.
- source_word: רְשָׁעִים
  choice: os maus
  rationale: Expressão natural e amplamente compreensível para pessoas moralmente perversas no contexto sapiencial.
- source_word: יִחְיוּ
  choice: continuam vivos
  rationale: O imperfeito comunica continuidade da vida; a formulação preserva o espanto diante da ausência do juízo esperado.
- source_word: עָתְקוּ
  choice: envelhecem
  rationale: No paralelismo, indica que avançam em idade; é uma formulação corrente e não elimina por completo a ideia de prolongamento próspero da vida.
- source_word: גַּם
  choice: e até
  rationale: 'Marca a escalada enfática: além de viverem e envelhecerem, chegam a adquirir grande poder ou recursos.'
- source_word: גָּבְרוּ
  choice: se tornam poderosos
  rationale: Expressa aumento de força, capacidade ou poder, mantendo o caráter progressivo da afirmação.
- source_word: חָיִל
  choice: em riqueza
  rationale: Neste contexto sobre a prosperidade dos maus, 'riqueza' representa bem recursos e prosperidade material, embora o termo também possa significar força ou poder.
