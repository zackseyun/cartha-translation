  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: pt
  text: Contudo, ele será levado à sepultura[c], e sobre o monte de terra[b][a] se manterá vigília.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele manterá vigília sobre o monte de terra”, caso o sujeito do verbo seja o próprio sepultado; o hebraico não explicita o sujeito.'
    reason: alternative_reading
  - marker: b
    text: “Monte de terra” traduz uma palavra hebraica que designa um amontoado ou massa empilhada; aqui, provavelmente se refere à terra elevada sobre uma sepultura.
    reason: cultural_note
  - marker: c
    text: O hebraico diz literalmente “às sepulturas”, no plural; a expressão pode referir-se coletivamente ao lugar de sepultamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Contudo, ele
  rationale: A conjunção pode significar simplesmente “e”, mas o contexto favorece uma nuance de contraste com a prosperidade anterior do perverso; “contudo” a expressa sem ampliar o sentido.
- source_word: לִקְבָרוֹת
  choice: à sepultura
  rationale: Embora o substantivo hebraico esteja no plural, o singular é a forma idiomática em português para indicar o destino funerário; a forma plural do original é registrada em nota.
- source_word: יוּבָל
  choice: será levado
  rationale: O hofal de יבל indica que ele será conduzido ou transportado. O futuro corresponde naturalmente à forma verbal e ao contexto funerário.
- source_word: וְעַל
  choice: sobre
  rationale: Preserva a relação espacial expressa por על sem especificar indevidamente se a pessoa está acima, junto ou incumbida do túmulo.
- source_word: גָּדִישׁ
  choice: monte de terra
  rationale: O termo designa um amontoado ou massa empilhada; neste contexto, provavelmente é a elevação de terra sobre a sepultura.
- source_word: יִשְׁקֹד
  choice: alguém manterá vigília
  rationale: O verbo ativo significa vigiar ou manter-se atento. “Alguém” conserva a referência humana indefinida sem identificar um sujeito que o hebraico deixa implícito.
theological_decisions:
- issue: Sujeito de יִשְׁקֹד
  choice: 'Entender o sujeito como uma pessoa não especificada: “alguém manterá vigília”.'
  alternative: 'Entender o próprio sepultado como sujeito: “ele manterá vigília sobre o monte de terra”.'
  rationale: A forma verbal é masculina singular, mas o sujeito não é expresso. O contexto permite mais de uma identificação, por isso a tradução principal evita atribuí-la dogmaticamente ao morto e a nota preserva a alternativa.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Manterá vigília” preserva o caráter ativo do verbo e o cenário funerário; “monte de terra” mantém a imagem concreta sem impor a interpretação de um monumento construído.
