  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: pt
  text: O que é o Todo-Poderoso, para que o sirvamos? E que vantagem teríamos se lhe fizéssemos súplicas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: O que é
  rationale: 'Mantém a forma da pergunta retórica e sua força desdenhosa: os ímpios questionam a importância ou o valor de servir a Deus.'
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino tradicionalmente, tornando seu sentido claro ao leitor moderno em vez de apenas transliterá-lo.
- source_word: כִּי
  choice: para que
  rationale: Na primeira oração, introduz de modo natural em português a consequência ou finalidade questionada retoricamente.
- source_word: נַעַבְדֶנּוּ
  choice: o sirvamos
  rationale: O verbo עבד, tendo Deus como objeto, expressa serviço, lealdade e devoção; «servir» preserva essa amplitude.
- source_word: וּמַה
  choice: E que
  rationale: Conserva o paralelismo da segunda pergunta retórica em português natural.
- source_word: נּוֹעִיל
  choice: vantagem teríamos
  rationale: Expressa a ideia de proveito ou benefício e evidencia a perspectiva utilitária dos falantes.
- source_word: כִּי
  choice: se
  rationale: Na segunda oração, apresenta idiomaticamente a condição considerada pelos falantes.
- source_word: נִפְגַּע בּוֹ
  choice: lhe fizéssemos súplicas
  rationale: פגע com ב pode indicar dirigir uma súplica ou apelo insistente a alguém; a formulação comunica claramente o contexto de oração sem restringi-lo à intercessão por terceiros.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: o Todo-Poderoso
  alternative: Shaddai
  rationale: Trata-se de um título divino, e sua tradução comunica o sentido ao leitor comum sem introduzir uma interpretação denominacional.
- issue: Sentido de נִפְגַּע בּוֹ
  choice: lhe fizéssemos súplicas
  alternative: rogássemos a ele
  rationale: A opção preserva o sentido de súplica dirigida a Deus e evita interpretar o verbo como intercessão necessariamente feita em favor de outra pessoa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela das duas perguntas foi preservada, assim como o tom utilitário e desdenhoso atribuído aos ímpios no contexto.
