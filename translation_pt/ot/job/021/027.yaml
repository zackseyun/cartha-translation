  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: pt
  text: Vejam, eu conheço os pensamentos de vocês e as maquinações com que vocês me fazem injustiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e as maquinações contra mim que vocês tramam” ou “e os planos violentos que vocês tramam contra mim”. O verbo hebraico pode transmitir a ideia de praticar violência, oprimir ou fazer injustiça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: muito bem
  rationale: A partícula introduz uma afirmação enfática. Em português, integrada a “Eu sei”, a expressão “muito bem” transmite com naturalidade essa força de certeza e confronto.
- source_word: יָדַעְתִּי
  choice: Eu sei
  rationale: O perfeito qal de primeira pessoa singular expressa aqui conhecimento presente; “Eu sei” é a forma idiomática em português.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: o que vocês estão pensando
  rationale: Reproduz de modo corrente o sentido de “os pensamentos de vocês”, mantendo o foco no conteúdo mental sem antecipar toda a hostilidade explicitada na oração seguinte.
- source_word: וּמְזִמּוֹת
  choice: e os planos
  rationale: O substantivo indica planos ou maquinações deliberadas. “Planos”, junto de “tramam contra mim”, comunica a intenção hostil sem acrescentar explicitamente “maus”.
- source_word: עָלַי
  choice: contra mim
  rationale: A preposição, neste contexto hostil, tem sentido adversativo e é naturalmente traduzida por “contra mim”.
- source_word: תַּחְמֹסוּ
  choice: tramam
  rationale: O verbo ligado a חמס pode indicar agir com violência, oprimir ou cometer injustiça. Na construção com מְזִמּוֹת, “tramam” produz uma formulação natural que preserva a ideia de planos hostis; a nota registra o componente mais forte de violência ou injustiça.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A formulação mantém o paralelismo entre pensamentos e planos, enquanto a nota preserva a intensidade e a amplitude semântica do verbo hebraico.
