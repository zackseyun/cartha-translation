    issue: O verbo תַּחְמֹסוּ não está representado de forma suficiente no texto principal.
    rationale: “Tramam” verte a noção já contida em מְזִמּוֹת (“planos/maquinações”), mas não o ato de violentar, oprimir ou prejudicar injustamente que o verbo hebraico acrescenta.
  - severity: low
    issue: A nota apresenta alternativas, mas o texto principal não conserva a relação entre as maquinações e o mal praticado contra Jó.
    rationale: A revisão explicita que as maquinações são os meios pelos quais os interlocutores fazem injustiça a Jó, sem resolver indevidamente a amplitude lexical de חמס.
