  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: pt
  text: Eles deixam seus pequeninos sair como um rebanho[a][b], e seus filhos dançam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como ovelhas”. O termo hebraico pode designar coletivamente ovelhas, cabras ou animais de pequeno porte.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas criancinhas”. O termo hebraico se refere a crianças muito novas.
    reason: lexical_alternative
  - marker: c
    text: Ou “saltitam” ou “pulam”. O verbo hebraico indica movimento vivo e alegre.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: deixam ... sair
  rationale: O piel de שלח significa enviar, soltar ou deixar sair. No contexto, a expressão portuguesa comunica naturalmente que as crianças saem livremente, sem acrescentar a ideia de expulsão.
- source_word: כַצֹּאן
  choice: como um rebanho
  rationale: צֹאן é um termo coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. “Como um rebanho” preserva a imagem coletiva e é idiomático em português.
- source_word: עֲוִילֵיהֶם
  choice: seus pequeninos
  rationale: עויל designa crianças muito novas. “Pequeninos” mantém a noção de pouca idade sem restringir o sentido apenas a recém-nascidos.
- source_word: יַלְדֵיהֶם
  choice: seus filhos
  rationale: A forma nominal de ילד pode indicar filhos ou crianças. “Seus filhos” é natural e mantém o paralelismo com “seus pequeninos”.
- source_word: יְרַקֵּדוּן
  choice: dançam
  rationale: רקד descreve movimento vivo, como dançar, saltitar ou pular. “Dançam” expressa com clareza a cena alegre, enquanto as outras possibilidades são registradas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A inversão necessária em “deixam seus pequeninos sair” evita uma formulação excessivamente literal e conserva a imagem pastoril.
