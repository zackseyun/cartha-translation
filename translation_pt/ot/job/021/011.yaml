  source_fidelity: 'A tradução preserva adequadamente os dois membros do paralelismo hebraico: o ato de deixar/mandar sair os pequeninos em comparação com um rebanho e o movimento alegre dos filhos. “Como um rebanho” representa bem o coletivo צֹאן, sem restringi-lo indevidamente a uma espécie.'
