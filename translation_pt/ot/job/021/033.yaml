source:
  edition: WLC
  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: pt
  text: Os torrões do vale lhe são agradáveis[a]; toda a humanidade segue depois dele[b], e os que foram antes dele são incontáveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os torrões do uádi (ou do leito do ribeiro) lhe são agradáveis.” A palavra hebraica pode designar um vale, uma ravina, um uádi ou o leito de uma corrente.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase pode evocar tanto um cortejo fúnebre quanto o caminho universal para a morte: incontáveis pessoas foram antes dele, e toda a humanidade segue depois.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ לוֹ
  choice: lhe são agradáveis
  rationale: O verbo מתק expressa doçura ou agrado. Em português, “lhe são agradáveis” preserva a metáfora de repouso na sepultura sem produzir a estranheza excessiva de “são doces para ele”.
- source_word: רִגְבֵי נָחַל
  choice: os torrões do vale
  rationale: רֶגֶב designa torrão ou porção compacta de terra; נַחַל pode indicar vale, ravina, uádi ou leito de corrente. “Vale” é natural no contexto funerário, enquanto a nota conserva a amplitude lexical.
- source_word: וְאַחֲרָיו
  choice: depois dele
  rationale: A expressão pode ser espacial ou temporal e combina com a imagem de procissão e com a sucessão humana rumo à morte.
- source_word: כָּל אָדָם
  choice: toda a humanidade
  rationale: אָדָם tem aqui sentido coletivo e genérico, não limitado ao sexo masculino.
- source_word: יִמְשׁוֹךְ
  choice: segue
  rationale: Embora משך signifique literalmente puxar ou arrastar, com אַחֲרָיו comunica idiomaticamente o movimento de seguir alguém, sem decidir se se trata de cortejo fúnebre ou do caminho universal para a morte.
- source_word: וּלְפָנָיו
  choice: os que foram antes dele
  rationale: A formulação preserva a dimensão temporal de precedência e continua compatível com a imagem espacial de pessoas à frente.
- source_word: אֵין מִסְפָּר
  choice: são incontáveis
  rationale: Expressa com clareza moderna o idiomatismo hebraico “não há número”.
theological_decisions:
- issue: Sentido das imagens de sepultamento e morte
  choice: Manter a linguagem concreta de terra, sucessão e precedência, permitindo tanto a imagem de um cortejo fúnebre quanto a do movimento universal da humanidade para a morte.
  alternative: Explicitar apenas um funeral honroso, ou transformar a linha somente numa afirmação abstrata sobre a mortalidade universal.
  rationale: O hebraico sustenta ambas as nuances; escolher exclusivamente uma delas resolveria uma tensão legítima do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Torrões” mantém a imagem concreta; “agradáveis” comunica o hebraico de forma natural. Os marcadores [a] e [b] aparecem no texto principal.
