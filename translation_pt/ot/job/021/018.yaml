  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: pt
  text: 'Que eles sejam como a palha diante do vento,

    e como a palha miúda que a tempestade arrebata[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que a tempestade rouba” ou “que a tempestade leva de repente”. O verbo hebraico significa literalmente “roubar” e é empregado poeticamente para descrever uma remoção súbita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que eles sejam
  rationale: O imperfeito de היה tem aqui valor volitivo ou próximo do jussivo no discurso retórico de Jó. “Que eles sejam” conserva essa modalidade sem transformá-la numa afirmação simples nem numa ordem direta.
- source_word: כְּתֶבֶן
  choice: como a palha
  rationale: תבן designa normalmente a palha, isto é, os talos secos que restam dos cereais. “Palha” é claro, corrente e adequado à imagem.
- source_word: לִפְנֵי רוּחַ
  choice: diante do vento
  rationale: A expressão retrata algo exposto à força do vento e impelido por ele. “Diante do vento” preserva a imagem hebraica de modo natural e digno.
- source_word: וּכְמֹץ
  choice: e como a palha miúda
  rationale: מֹץ é o resíduo leve separado do grão, levado facilmente pelo vento. “Palha miúda” distingue esse material da palha de תבן e é mais imediatamente compreensível do que termos regionais ou técnicos.
- source_word: גְּנָבַתּוּ
  choice: arrebata
  rationale: O verbo גנב significa literalmente “roubar”, mas, aplicado poeticamente a uma tempestade, comunica remoção súbita e impetuosa. “Arrebata” preserva essa força e soa natural em português; a acepção literal é registrada em nota.
- source_word: סוּפָה
  choice: a tempestade
  rationale: סוּפָה designa tempestade ou tormenta e, conforme o contexto, pode também sugerir um vendaval. “Tempestade” mantém a amplitude do termo sem restringi-lo necessariamente a um redemoinho.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo poético, o tom volitivo do primeiro verbo e a imagem agrícola, distinguindo “palha” de “palha miúda” sem recorrer a vocabulário excessivamente técnico.
