  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: pt
  text: Quando me lembro, fico apavorado, e um tremor toma conta do meu corpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Quando
  rationale: Embora אִם normalmente introduza condição, aqui pode ter valor temporal ou circunstancial ligado à lembrança recorrente; “Quando” expressa naturalmente o sentido no contexto e mantém a decisão auditada.
- source_word: זָכַרְתִּי
  choice: me lembro
  rationale: O qal perfeito de זכר, neste contexto, descreve o ato de trazer à memória o assunto aterrador; o presente em português comunica bem essa reação recorrente.
- source_word: וְנִבְהָלְתִּי
  choice: fico apavorado
  rationale: בהל no nifal denota ser tomado por alarme, terror ou consternação. “Fico apavorado” é atual e comunica intensidade maior do que simples surpresa.
- source_word: פַּלָּצוּת
  choice: um tremor
  rationale: O substantivo raro indica estremecimento, horror ou calafrio causado pelo medo; “um tremor” preserva a manifestação física sem especificar além do texto.
- source_word: אָחַז בְּשָׂרִי
  choice: toma conta do meu corpo
  rationale: Literalmente, “agarra minha carne”. A expressão escolhida conserva a ideia de domínio súbito e traduz בשר como o corpo físico neste contexto.
