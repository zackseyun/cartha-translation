  text: פְּנוּ אֵלַ֥/י וְ/הָשַׁ֑מּוּ וְ/שִׂ֖ימוּ יָ֣ד עַל פֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: pt
  text: Voltem-se para mim e fiquem estarrecidos[a]; ponham a mão sobre a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem espantados”. O verbo hebraico pode indicar ficar atônito, estarrecido ou desolado; aqui expressa uma reação de choque.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Voltem-se para mim
  rationale: O imperativo plural de פנה com אֶל indica voltar o rosto ou a atenção para o falante. A forma pronominal é natural em português e preserva a direção enfática do hebraico.
- source_word: וְהָשַׁמּוּ
  choice: e fiquem estarrecidos
  rationale: O Hifil imperativo plural de שׁמם pode expressar espanto, choque ou consternação. “Fiquem estarrecidos” comunica aqui uma reação intensa diante do caso de Jó sem reduzir o sentido a mera surpresa.
- source_word: וְשִׂימוּ יָד
  choice: ponham a mão
  rationale: שׂים significa pôr ou colocar. Embora יָד não tenha possessivo explícito, o imperativo plural deixa claro que cada ouvinte deve pôr a própria mão; a expressão portuguesa dispensa explicitar “sua”.
- source_word: עַל פֶּה
  choice: sobre a boca
  rationale: A construção descreve o gesto de cobrir a boca, associado ao silêncio ou ao choque. “Sobre a boca” mantém a imagem de forma clara e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Estarrecidos” preserva a força emocional do hebraico, enquanto a nota registra sua amplitude lexical.
