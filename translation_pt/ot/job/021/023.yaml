  text: זֶ֗ה יָ֭מוּת בְּ/עֶ֣צֶם תֻּמּ֑/וֹ כֻּ֝לּ֗/וֹ שַׁלְאֲנַ֥ן וְ/שָׁלֵֽיו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: pt
  text: Um morre no auge do seu vigor,[a] inteiramente tranquilo e seguro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este morre em plena força, inteiramente tranquilo e sem perturbação.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Um
  rationale: O demonstrativo introduz um caso representativo no contraste desenvolvido por Jó. Em português, “um” expressa naturalmente esse valor indefinido sem tornar rígido o mais literal “este”.
- source_word: יָמוּת
  choice: morre
  rationale: O imperfeito tem aqui valor geral ou gnômico; o presente comunica uma observação sobre a experiência humana, e não uma previsão específica.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: no auge do seu vigor
  rationale: A combinação aponta para uma condição plena, íntegra e ainda não debilitada. A expressão idiomática evita a tradução literal de עֶצֶם como “osso” e não atribui a תֻּם o sentido moral de integridade.
- source_word: כֻּלּוֹ
  choice: inteiramente
  rationale: O termo intensifica toda a descrição seguinte e funciona naturalmente como advérbio em português.
- source_word: שַׁלְאֲנַן
  choice: tranquilo
  rationale: Expressa repouso, despreocupação e ausência de perturbação sem limitar o sentido à prosperidade material.
- source_word: וְשָׁלֵיו
  choice: seguro
  rationale: Reforça o paralelismo com a ideia de estabilidade e ausência de ameaça, sem produzir uma repetição exata de “tranquilo”.
