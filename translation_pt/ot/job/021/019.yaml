  text: אֱל֗וֹהַּ יִצְפֹּן לְ/בָנָ֥י/ו אוֹנ֑/וֹ יְשַׁלֵּ֖ם אֵלָ֣י/ו וְ/יֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: pt
  text: Deus guarda a iniquidade dele para os filhos dele?[a][b] Que Deus lhe dê a retribuição, para que ele mesmo a conheça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir a primeira oração sem forma interrogativa: “Deus guarda a iniquidade dele para os filhos dele”. O contexto favorece entendê-la como uma ideia que Jó contesta.'
    reason: alternative_reading
  - marker: b
    text: O hebraico diz “filhos”; no contexto, o termo também pode abranger os descendentes de um homem.
    reason: lexical_alternative
  - marker: c
    text: “Iniquidade” traduz um termo hebraico que também pode indicar mal, desgraça ou a consequência punitiva da iniquidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É o equivalente natural do substantivo singular usado com frequência em Jó, sem acrescentar uma nuance que a forma hebraica não explicita.
- source_word: יִצְפֹּן
  choice: guarda
  rationale: O verbo צפן pode significar guardar, reservar ou ocultar. “Guarda” comunica de modo claro a ideia de conservar algo para o futuro.
- source_word: לְבָנָיו
  choice: para os filhos dele
  rationale: O hebraico diz literalmente “para seus filhos”, no masculino plural. A formulação portuguesa preserva “filhos” e esclarece que eles pertencem ao perverso, não a Deus.
- source_word: אוֹנוֹ
  choice: a iniquidade do perverso
  rationale: אָוֶן pode indicar iniquidade, mal ou a desgraça decorrente dele. “Iniquidade” mantém mais diretamente a expressão hebraica e deixa a possível dimensão punitiva para a nota.
- source_word: יְשַׁלֵּם
  choice: Que Deus lhe dê a retribuição
  rationale: O Piel de שׁלם exprime retribuir ou pagar de volta. A construção volitiva em português representa a provável força jussiva no argumento de Jó.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome aponta para o próprio perverso. O contraste com os filhos é reforçado naturalmente pela continuação “ele mesmo”.
- source_word: וְיֵדָע
  choice: para que ele mesmo a conheça
  rationale: ידע significa “conhecer” ou “saber”. Neste contexto, a expressão indica que o próprio homem deve conhecer por experiência a retribuição.
theological_decisions:
- issue: Se a primeira oração é uma afirmação de Jó ou uma ideia que ele contesta
  choice: Apresentá-la como pergunta retórica, seguida do pedido corretivo de Jó.
  alternative: 'Traduzir todo o versículo como declaração: “Deus guarda a iniquidade dele para seus filhos; que lhe retribua, e ele saberá”.'
  rationale: No contexto de Jó 21, Jó questiona a noção de que a devida consequência para o perverso possa ficar reservada aos seus filhos. A pergunta retórica e a força volitiva de יְשַׁלֵּם preservam essa tensão argumentativa sem transformar a interpretação em certeza textual.
- issue: Se אָוֶן designa culpa moral ou sua consequência punitiva
  choice: Usar “iniquidade” no texto e registrar a alternativa em nota.
  alternative: Traduzir “castigo” ou “desgraça”.
  rationale: “Iniquidade” corresponde de forma mais direta ao termo, enquanto a nota preserva a ambiguidade lexical e reconhece que o contexto de retribuição pode apontar para as consequências do mal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição explícita de “Deus” na segunda oração evita ambiguidade de sujeito; “do perverso” recupera o referente do contexto imediato e impede que os possessivos sejam entendidos como referência a Deus.
