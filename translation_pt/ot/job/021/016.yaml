  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: pt
  text: 'Vejam: não está nas mãos deles a sua prosperidade?[a] Longe de mim o conselho dos perversos!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam, a prosperidade deles não está nas mãos deles.”'
    reason: O hebraico pode ser entendido como pergunta retórica ou como afirmação negativa; a nota preserva essa ambiguidade interpretativa genuína e mantém a partícula inicial de chamamento.
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula enfática que chama a atenção para o argumento; “Vejam” é natural e atual, sem a solenidade arcaizante de “eis”.
- source_word: טוּבָם
  choice: a sua prosperidade
  rationale: No contexto, o substantivo “bem” designa a boa situação ou prosperidade dos perversos, não sua bondade moral.
- source_word: בְיָדָם
  choice: nas próprias mãos deles
  rationale: Mantém a imagem hebraica de algo estar sob o poder ou controle de alguém, com a ênfase contextual expressa por “próprias”.
- source_word: עֲצַת רְשָׁעִים
  choice: o conselho dos perversos
  rationale: Conserva o sentido de orientação, plano ou modo de pensar associado aos רְשָׁעִים, aqui vertidos como “perversos”.
- source_word: רָחֲקָה מֶנִּי
  choice: Longe de mim
  rationale: Reproduz de modo idiomático e enfático a rejeição do conselho dos perversos.
theological_decisions:
- issue: Se a primeira oração é interrogativa ou declarativa
  choice: 'Pergunta retórica: “não está nas próprias mãos deles...?”'
  alternative: 'Declaração: “a prosperidade deles não está nas próprias mãos”'
  rationale: A sequência consonantal e a construção permitem mais de uma leitura contextual. A formulação interrogativa segue a compreensão refletida na camada de consulta e preserva a tensão do discurso de Jó; a alternativa é registrada em nota, sem resolver silenciosamente a ambiguidade.
- issue: Relação de Jó com o pensamento dos perversos
  choice: Exclamação enfática de repúdio
  alternative: Declaração simples sem pontuação enfática
  rationale: “Longe de mim” expressa distanciamento claro do conselho dos perversos; o ponto de exclamação comunica essa força sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vejam” comunica a partícula de atenção de modo corrente; a ordem da segunda oração preserva a concisão e a ênfase do hebraico.
