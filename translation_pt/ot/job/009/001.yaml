lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa, introduz a resposta de Jó ao discurso anterior; “respondeu” preserva claramente o sentido dialógico.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: אמר é o verbo comum de fala, e “disse” preserva a fórmula hebraica “respondeu e disse” sem expansão interpretativa.
- source_word: וַ
  choice: Então
  rationale: O waw prefixado aos verbos no wayyiqtol indica sequência narrativa; “Então” expressa de modo natural a progressão em relação à fala anterior, enquanto “E” seria mais formalmente literal.
