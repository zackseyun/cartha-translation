base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: pt
  text: Se eu estiver com a razão, minha própria boca me condenará; mesmo sendo íntegro, ela provará que sou perverso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mesmo sendo íntegro, ele provará que sou perverso”, entendendo Deus como sujeito implícito da segunda oração.'
    reason: Leitura alternativa possível, pois o sujeito de וַיַּעְקְשֵׁנִי não é expresso.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: 'Introduz aqui uma condição: “Se eu estiver com a razão”. O paralelismo permite repetir “se” na segunda oração para tornar explícita em português a relação sintática implícita no hebraico.'
- source_word: אֶצְדָּק
  choice: estiver com a razão
  rationale: O qal de צדק tem sentido estativo e forense, “estar com a razão/ser considerado justo”, e não o causativo “justificar a mim mesmo”.
- source_word: פִּי
  choice: minha própria boca
  rationale: Embora literalmente seja “minha boca”, “própria” ressalta de modo natural a ironia de que as palavras de Jó se voltariam contra ele.
- source_word: יַרְשִׁיעֵנִי
  choice: me condenará
  rationale: O hifil de רשע, neste contexto forense, significa declarar culpado ou condenar.
- source_word: תָּם
  choice: íntegro
  rationale: Em Jó, תם denota inteireza moral e irrepreensibilidade, sem necessariamente afirmar perfeição absoluta. “Íntegro” é corrente e preserva essa nuance.
- source_word: וַיַּעְקְשֵׁנִי
  choice: ela me declarará perverso
  rationale: O verbo deriva de עקשׁ, “ser tortuoso/perverso”. Mantendo “minha boca” como sujeito, a expressão indica que o próprio discurso de Jó o apresentaria ou declararia perverso; “declarará” também preserva o tom forense do primeiro membro.
theological_decisions:
- issue: Sujeito de וַיַּעְקְשֵׁנִי
  choice: '“Minha própria boca” continua como sujeito: “ela me declarará perverso”.'
  alternative: 'Deus é o sujeito implícito: “ele me declarará perverso” ou “ele me fará parecer perverso”.'
  rationale: O paralelismo favorece a continuidade do sujeito entre as duas orações. Contudo, como o hebraico não repete expressamente o sujeito, a leitura que subentende Deus permanece possível e é registrada em nota, sem eliminar a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o campo forense por meio de “com a razão”, “condenará” e “declarará”, ao mesmo tempo que conserva na nota a ambiguidade quanto ao sujeito da última oração.
