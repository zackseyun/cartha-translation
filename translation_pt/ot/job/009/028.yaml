  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: pt
  text: Tenho medo de todos os meus sofrimentos[a]; sei que não me absolverás[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Temo todas as minhas dores», «todas as minhas tristezas» ou «todas as minhas aflições».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não me considerarás inocente» ou «não me deixarás sem punição».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Tenho medo
  rationale: O qal perfeito na primeira pessoa do singular expressa aqui um estado presente de temor; «tenho medo» é natural e preserva o sentido, enquanto «temo» também seria possível.
- source_word: כָל
  choice: todos
  rationale: Mantém diretamente o quantificador hebraico.
- source_word: עַצְּבֹתָי
  choice: meus sofrimentos
  rationale: O termo pode indicar dores, tristezas ou aflições. «Sofrimentos» abrange a experiência de Jó sem restringi-la apenas à dor física ou emocional.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: Embora formalmente perfeito, o verbo tem valor estativo presente neste contexto.
- source_word: כִּי
  choice: que
  rationale: Introduz naturalmente em português o conteúdo daquilo que Jó sabe.
- source_word: לֹא
  choice: não
  rationale: Corresponde à negação hebraica simples.
- source_word: תְנַקֵּנִי
  choice: me absolverás
  rationale: O piel de נקה pode significar declarar inocente, absolver ou deixar sem punição. «Absolver» preserva a nuance forense do debate de Jó com Deus.
theological_decisions:
- issue: Nuance forense de נקה na fala de Jó dirigida a Deus
  choice: não me absolverás
  alternative: não me considerarás inocente; não me deixarás sem punição
  rationale: A formulação conserva a convicção de Jó de que Deus não o declarará livre de culpa no julgamento, sem solucionar a tensão teológica nem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das notas segue a ocorrência dos marcadores no texto; a ambiguidade lexical do hebraico é preservada nas notas.
