  text: אֲשֶׁר בִּ/שְׂעָרָ֥ה יְשׁוּפֵ֑/נִי וְ/הִרְבָּ֖ה פְצָעַ֣/י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/017.yaml
  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: pt
  text: que me esmaga numa tempestade[a][b] e multiplica minhas feridas sem causa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma tempestade” ou “no vendaval”. A preposição hebraica pode indicar circunstância ou instrumento.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser traduzido por “me fere” ou “me machuca”; menos provavelmente aqui, “investe contra mim”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sem motivo” ou “gratuitamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo que dá continuidade à descrição de Deus no contexto anterior; é a ligação mais natural em português.
- source_word: בִּשְׂעָרָה
  choice: numa tempestade
  rationale: שְׂעָרָה designa tempestade, tormenta ou vendaval. A preposição ב pode indicar circunstância ou instrumento; a formulação escolhida conserva a imagem vívida sem eliminar essa flexibilidade.
- source_word: יְשׁוּפֵנִי
  choice: me esmaga
  rationale: O verbo raro שׁוף admite sentidos como esmagar ou ferir. Neste contexto, o paralelismo com a multiplicação das feridas favorece uma ação de grande violência.
- source_word: וְהִרְבָּה
  choice: e multiplica
  rationale: O hifil de רבה significa fazer aumentar ou tornar numeroso; “multiplica” é conciso e combina naturalmente com “feridas”.
- source_word: פְצָעַי
  choice: minhas feridas
  rationale: פצע indica ferida ou lesão; “feridas” é direto, claro e apropriado à poesia.
- source_word: חִנָּם
  choice: sem causa
  rationale: חִנָּם pode significar gratuitamente, sem motivo ou sem causa. “Sem causa” mantém a força moral e quase forense da queixa de Jó.
theological_decisions:
- issue: Se חִנָּם afirma a inocência moral absoluta de Jó ou expressa sua percepção de sofrimento imerecido
  choice: Traduzir diretamente por “sem causa”, preservando a força da queixa.
  alternative: “sem motivo” ou “sem que eu o mereça”
  rationale: O versículo apresenta a reclamação de Jó sem oferecer aqui sua resolução. A tradução não deve atenuar sua acusação nem introduzir uma conclusão doutrinária sobre a justiça divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção poética concisa. “Numa” favorece naturalidade brasileira sem comprometer a compreensão internacional; as notas preservam as ambiguidades lexicais do hebraico.
