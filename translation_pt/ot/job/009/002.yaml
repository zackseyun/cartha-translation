source:
  edition: WLC
  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: pt
  text: De fato, sei que é assim; mas como pode um mortal[a] ser justo diante de Deus?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: ’enosh, termo que ressalta a fragilidade humana; também pode ser traduzido por “ser humano” ou “homem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como pode um mortal ser declarado justo perante Deus?”; ou ainda: “ter razão diante de Deus?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: De fato
  rationale: Introduz a enfática concordância de Jó com o que foi dito antes, em português natural e solene.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito expressa aqui um conhecimento estabelecido; o presente comunica adequadamente esse valor estativo.
- source_word: כִי כֵן
  choice: que é assim
  rationale: Mantém a confirmação do que acaba de ser afirmado sem explicitar um referente além do hebraico.
- source_word: וּמַה
  choice: mas como pode
  rationale: A conjunção com o interrogativo marca uma virada argumentativa, passando da concessão à pergunta que a problematiza.
- source_word: יִצְדַּק
  choice: ser justo
  rationale: Preserva o sentido básico do verbo צדק e sua possível nuance forense, sem antecipar uma formulação doutrinária posterior.
- source_word: אֱנוֹשׁ
  choice: um mortal
  rationale: Expressa o singular representativo e a conotação de fragilidade humana do substantivo hebraico.
- source_word: עִם אֵל
  choice: diante de Deus
  rationale: Embora עִם signifique literalmente “com”, neste contexto a expressão descreve a condição da pessoa em relação a Deus; “diante de Deus” transmite com naturalidade essa força relacional e possivelmente judicial.
theological_decisions:
- issue: Nuance forense da justiça humana em relação a Deus
  choice: ser justo diante de Deus
  alternative: ser declarado justo perante Deus; ter razão diante de Deus
  rationale: A formulação conserva tanto o sentido moral quanto a possível dimensão judicial da pergunta, sem especificar um mecanismo teológico de justificação que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Mortal” preserva a fragilidade implícita em אֱנוֹשׁ, enquanto “ser justo diante de Deus” mantém aberta a tensão entre justiça moral e condição forense.
