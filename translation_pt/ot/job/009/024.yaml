source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: pt
  text: 'A terra foi entregue na mão do perverso[a];

    ele cobre[b] o rosto de seus juízes.

    Se não, quem é, então?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O país foi entregue na mão de um homem perverso». O hebraico אֶרֶץ pode significar «terra» ou «país», e רָשָׁע pode referir-se a um indivíduo perverso ou ao perverso em sentido genérico.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico não identifica expressamente a quem se refere o sujeito de «cobre». Pode tratar-se de Deus, do governante perverso ou de um agente não especificado.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: A terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região ou país. No contexto poético, a afirmação parece tratar da ordem do mundo; a alternativa «o país» é preservada em nota.
- source_word: נִתְּנָה
  choice: foi entregue
  rationale: O perfeito nifal de נתן exprime ação passiva e o estado dela resultante. «Foi entregue» é natural em português e mantém a ideia de transferência de domínio.
- source_word: בְיַד
  choice: nas mãos de
  rationale: A expressão hebraica significa estar sob o poder de alguém. O plural idiomático em português mantém a metáfora da mão sem recorrer à formulação menos natural «na mão de».
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo masculino singular pode indicar um indivíduo perverso ou ter valor genérico. «O perverso» conserva a concisão e não define se se trata de um governante específico ou de uma figura representativa.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: o rosto dos juízes dela
  rationale: A tradução mantém a imagem concreta do rosto e torna explícito, por meio de «dela», que o sufixo retoma «a terra», evitando a ambiguidade possessiva que «seus» criaria em português.
- source_word: יְכַסֶּה
  choice: ele cobre
  rationale: O piel imperfeito de terceira pessoa masculina singular significa literalmente «ele cobre». O pronome é necessário para uma formulação portuguesa clara, mas seu referente continua não identificado e é explicado em nota.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Se não, quem é, então?
  rationale: A frase funciona como desafio retórico. «Então» representa אֵפוֹא, enquanto «Se não» evita acrescentar um antecedente que o hebraico não explicita.
theological_decisions:
- issue: Identidade do agente de «cobre» e do referente da pergunta retórica
  choice: Manter o referente de «ele» sem identificação explícita.
  alternative: Identificá-lo como Deus, como o perverso, ou reformular a oração na passiva sem agente.
  rationale: Embora o contexto possa levar o leitor a entender Deus como agente último, o verso não nomeia o sujeito de יְכַסֶּה. A tradução conserva a tensão entre as leituras possíveis em vez de decidir teologicamente por uma delas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção poética concisa. «Perverso» comunica maldade moral com naturalidade; «juízes» e «rosto» preservam a linguagem concreta do hebraico. A quebra em três linhas acompanha as unidades retóricas do verso.
