  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: pt
  text: Se eu me lavasse com neve e limpasse as mãos com álcali,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sabão”; o termo hebraico se refere mais precisamente a um agente alcalino de limpeza.
