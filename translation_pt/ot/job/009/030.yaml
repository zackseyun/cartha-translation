lexical_decisions:
- source_word: אִם
  choice: Mesmo que
  rationale: 'Neste argumento hipotético, a condição tem força concessiva à luz da continuação: ainda que Jó empregasse os meios mais extremos de limpeza, não conseguiria alterar sua situação diante de Deus.'
- source_word: הִתְרָחַצְתִּי
  choice: eu me lavasse
  rationale: Preserva o sentido reflexivo do hitpael de רחץ e soa natural em português.
- source_word: במו שָׁלֶג
  choice: com neve
  rationale: Expressa diretamente o meio de lavagem sem acrescentar a interpretação possível, mas não explícita, de água de neve.
- source_word: וַהֲזִכּוֹתִי
  choice: e limpasse
  rationale: Reproduz o sentido causativo de tornar limpo e mantém o paralelismo concreto com lavar, sem eliminar sua ressonância moral.
- source_word: בְּבֹר
  choice: com álcali
  rationale: O termo designa uma substância alcalina usada para limpeza; “álcali” é mais preciso do que “sabão” e menos propenso a sugerir sabão moderno do que outras opções.
- source_word: כַּפָּי
  choice: as mãos
  rationale: Embora o termo denote literalmente as palmas, “as mãos” é a expressão idiomática natural neste contexto de limpeza.
theological_decisions:
- issue: Força da condição introduzida por אִם
  choice: Mesmo que
  alternative: Se
  rationale: O verso integra uma hipótese cujo resultado é negado na sequência do argumento. A formulação concessiva torna essa relação natural em português sem resolver a tensão entre limpeza física e inocência moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção concessiva acompanha o fluxo do argumento, e a nota preserva a alternativa tradicional.
