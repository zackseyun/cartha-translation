  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: pt
  text: Se um flagelo mata de repente, ele zomba da provação[a] dos inocentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele ri do desespero dos inocentes” ou “ele zomba do definhamento dos inocentes”. O substantivo hebraico pode indicar provação, colapso ou abatimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva o valor condicional direto da partícula hebraica, sem transformá-la no mais interpretativo “quando”.
- source_word: שׁוֹט
  choice: um flagelo
  rationale: Mantém tanto a imagem concreta de um açoite como o sentido figurado de uma aflição devastadora.
- source_word: יָמִית
  choice: mata
  rationale: Expressa de modo claro e atual o hifil de מות, “fazer morrer, matar”.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: É a formulação portuguesa natural para a ação súbita indicada pelo advérbio.
- source_word: לְמַסַּת
  choice: da provação
  rationale: Representa uma possibilidade contextual do substantivo raro, associado a prova, abatimento ou colapso, sem reduzi-lo apenas a um estado emocional.
- source_word: נְקִיִּם
  choice: dos inocentes
  rationale: Designa os que estão livres de culpa e se ajusta ao argumento de Jó sobre sofrimento imerecido.
- source_word: יִלְעָג
  choice: ele zomba
  rationale: Conserva a força acusatória do verbo e o sujeito masculino singular implícito no hebraico.
theological_decisions:
- issue: Sujeito de “ele zomba”
  choice: O pronome “ele” conserva o sujeito implícito, permitindo que o contexto aponte para Deus.
  alternative: O flagelo personificado zomba, ou o verbo tem sujeito indefinido.
  rationale: Não inserir explicitamente “Deus” preserva a ambiguidade gramatical e, ao mesmo tempo, mantém a forte tensão teológica da acusação de Jó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Flagelo” preserva a metáfora do açoite e sua extensão para uma calamidade destrutiva; “provação” mantém aberta a dificuldade lexical do segundo hemistíquio.
