  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: pt
  text: Não há entre nós um árbitro[a] que ponha a mão sobre nós dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mediador”. O termo hebraico pode designar alguém que decide ou intervém entre duas partes em disputa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Não há
  rationale: Expressa de modo natural em português a construção existencial negativa do hebraico.
- source_word: בֵּינֵינוּ
  choice: entre nós
  rationale: Preserva a relação entre as duas partes em disputa, Jó e Deus.
- source_word: מוֹכִיחַ
  choice: árbitro
  rationale: No contexto jurídico do capítulo, designa alguém que intervém e decide entre partes em litígio; evita atribuir ao termo uma categoria teológica mais específica do que o hebraico exige.
- source_word: יָשֵׁת
  choice: que ponha
  rationale: A oração relativa comunica a ação esperada ou hipotética desse árbitro ausente, com formulação idiomática em português.
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém a imagem concreta do hebraico, provavelmente ligada à autoridade exercida sobre as duas partes.
- source_word: עַל שְׁנֵינוּ
  choice: sobre nós dois
  rationale: Indica que a mão do árbitro alcançaria igualmente ambos os litigantes e preserva a preposição e a dualidade explícitas.
theological_decisions:
- issue: Se מוֹכִיחַ deve ser traduzido por um termo de possível ressonância cristológica, como “mediador”
  choice: árbitro
  alternative: mediador
  rationale: O contexto imediato apresenta a queixa de Jó pela ausência de quem julgue ou intervenha entre ele e Deus. “Árbitro” conserva o sentido forense sem impor ao versículo uma identificação teológica posterior; “mediador” continua sendo uma alternativa lexical legítima e aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a concisão, a imagem da mão e a tensão jurídica e teológica do original.
