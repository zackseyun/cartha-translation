  text: Passam como barcos de junco, como a águia que se lança sobre a presa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: barcos de junco
  rationale: A expressão designa embarcações leves feitas de junco ou papiro. “Barcos de junco” é natural, claro e conserva a imagem de rapidez.
- source_word: יָטוּשׂ
  choice: se lança
  rationale: O verbo descreve o movimento veloz e impetuoso da águia em direção ao alimento; “se lança” comunica esse movimento sem acrescentar precisão ausente no hebraico.
- source_word: אֹכֶל
  choice: presa
  rationale: Embora o sentido básico seja “alimento”, no contexto da águia o referente natural é aquilo que ela captura para comer; “presa” reproduz a imagem idiomática em português.
