id: JOB.9.11
reference: Job 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֤ן יַעֲבֹ֣ר עָ֭לַ/י וְ/לֹ֣א אֶרְאֶ֑ה וְ֝/יַחֲלֹ֗ף וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: pt
  text: Eis que ele passa junto de mim, e eu não o vejo; segue adiante, e eu não o percebo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o compreendo”; o hebraico pode indicar tanto percepção e discernimento quanto compreensão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz com ênfase uma observação imediata. Embora tenha tom elevado, “eis que” continua reconhecível no português bíblico moderno e reproduz melhor a força deítica do hebraico do que um simples “de fato”.
- source_word: יַעֲבֹר עָלַי
  choice: passa junto de mim
  rationale: A combinação de עבר com עלי descreve Deus passando em relação próxima a Jó. “Junto de mim” preserva a proximidade sem impor a imagem física de passar por cima dele.
- source_word: וְלֹא אֶרְאֶה
  choice: e eu não o vejo
  rationale: Tradução direta da forma verbal negada. Evita acrescentar a ideia explícita de incapacidade presente em “não consigo vê-lo”.
- source_word: וְיַחֲלֹף
  choice: segue adiante
  rationale: חלף comunica a ideia de passar e prosseguir. “Segue adiante” diferencia o segundo verbo do primeiro sem perder o paralelismo de movimento.
- source_word: וְלֹא אָבִין לוֹ
  choice: e eu não o percebo
  rationale: בין pode indicar discernir ou entender. No contexto da passagem imperceptível de Deus, “percebo” expressa discernimento experiencial, preservando em nota a alternativa intelectual.
theological_decisions:
- issue: Referência do sujeito e dos pronomes na terceira pessoa
  choice: O sujeito e o objeto pronominal referem-se a Deus, sem inserir seu nome ou título no versículo.
  alternative: Entender o sujeito como alguém indefinido.
  rationale: O contexto imediato, especialmente Jó 9:10–12, trata da atividade insondável de Deus. Os pronomes mantêm essa referência pessoal sem explicitar mais do que o hebraico.
- issue: Sentido de אָבִין לוֹ
  choice: “não o percebo”, com foco no discernimento da presença e ação divina.
  alternative: “não o compreendo”, com foco na compreensão intelectual de Deus.
  rationale: O paralelismo com “não o vejo” favorece a percepção, mas o campo semântico de בין também admite compreensão; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leve elevação poética adequada a Jó. “Eis que” preserva a ênfase do original; “passa junto de mim” soa natural e evita uma espacialidade excessivamente literal. O único marcador, [a], aparece no texto principal.
