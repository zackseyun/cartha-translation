  text: 'Se eu disser: “Vou esquecer a minha queixa, deixar de lado a expressão abatida e me animar”,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Se eu disser
  rationale: A construção introduz uma hipótese; o futuro do subjuntivo é a forma natural em português para expressá-la.
- source_word: אֶשְׁכְּחָה
  choice: Vou esquecer
  rationale: Expressa a resolução que Jó imagina tomar, preservando a força volitiva da forma hebraica.
- source_word: שִׂיחִי
  choice: a minha queixa
  rationale: Embora o termo possa indicar reflexão ou fala interior, neste contexto de lamento ele se refere mais naturalmente à queixa de Jó.
- source_word: אֶעֶזְבָה פָנַי
  choice: deixar de lado a expressão abatida
  rationale: Traduz o sentido idiomático de abandonar o semblante marcado pela tristeza, sem reproduzir literalmente uma expressão pouco natural em português.
- source_word: וְאַבְלִיגָה
  choice: e me mostrar alegre
  rationale: O verbo sugere conter ou aliviar a aflição e assumir um aspecto mais animado; a formulação mantém a relação com a expressão exterior sem afirmar necessariamente alegria interior.
