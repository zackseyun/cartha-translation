  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: pt
  text: que sozinho estende os céus e pisa sobre as alturas do mar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caminha sobre as ondas do mar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: estende
  rationale: O particípio qal de נטה descreve o ato de estender ou desdobrar; “estende” é natural em português e conserva a força descritiva da forma hebraica.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: No contexto cosmológico e poético, o plural “os céus” corresponde bem ao uso hebraico e evita restringir a referência apenas ao céu visível.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: Expressa de modo claro e conciso que Deus realiza a ação sem auxílio, preservando a ênfase exclusiva do hebraico.
- source_word: וְדוֹרֵךְ
  choice: e pisa
  rationale: דרך no qal pode significar pisar ou caminhar sobre algo. “Pisa” mantém a imagem física vívida sem acrescentar a ideia destrutiva de “esmagar”.
- source_word: עַל
  choice: sobre
  rationale: “Sobre” é uma correspondência natural da preposição neste quadro poético e combina idiomaticamente com “pisa”.
- source_word: בָּמֳתֵי
  choice: as alturas
  rationale: במה significa normalmente “altura” ou “lugar elevado”. A tradução principal conserva a metáfora incomum “alturas do mar”, sem reduzi-la interpretativamente a “ondas”.
- source_word: יָם
  choice: o mar
  rationale: O singular corresponde ao hebraico e preserva a imagem cósmico-poética.
theological_decisions:
- issue: Imagem cósmica da soberania divina sobre a criação
  choice: Manter a descrição poética de Deus sozinho estendendo os céus e pisando sobre as alturas do mar.
  alternative: Traduzir de modo mais interpretativo como “caminha sobre as ondas do mar”.
  rationale: A formulação conserva a imagem elevada e a afirmação da ação singular de Deus sem transformá-la em explicação doutrinária nem eliminar a tensão lexical da expressão hebraica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à continuidade da oração no contexto. “Alturas do mar” preserva deliberadamente a imagem poética hebraica; a leitura interpretativa “ondas” fica na nota.
