  naturalness: “Deus não faz sua ira voltar atrás” soa calcado e atribui à ira uma ação de retorno de maneira pouco fluente. “Deus não faz recuar a sua ira” é moderno, claro e mantém a imagem verbal. “Debaixo dele se curvam” preserva a concisão poética e é mais idiomático que “se agacham” neste contexto.
