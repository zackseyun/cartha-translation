base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: pt
  text: Deus não faz recuar a sua ira; debaixo dele se curvam os ajudantes de Raabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Raabe: aqui, nome poético de uma força poderosa associada ao caos e vencida por Deus; em outros contextos bíblicos, o nome também pode representar o Egito.'
    reason: O referente de רהב é cultural e poeticamente carregado, e não fica plenamente claro para leitores modernos sem explicação.
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: não faz sua ira voltar atrás
  rationale: Preserva a construção causativa de שׁוב e a imagem hebraica de uma ira que Deus não faz recuar, sem substituir o texto por uma explicação interpretativa.
- source_word: תחתו
  choice: debaixo dele
  rationale: Tradução direta da expressão espacial, que também comunica submissão ao poder divino.
- source_word: שָׁחֲחוּ
  choice: se agacham
  rationale: Expressa a postura rebaixada e constrangida sugerida pelo verbo; evita limitar o sentido a um ato voluntário de reverência.
- source_word: עֹזְרֵי רָהַב
  choice: os ajudantes de Raabe
  rationale: Mantém Raabe como nome da figura ou força caótica personificada, em vez de resolver a referência como simples orgulho ou como um monstro específico.
theological_decisions:
- issue: Identidade de רהב (Raabe)
  choice: Manter o nome próprio “Raabe” com nota explicativa
  alternative: “orgulho”, “monstro do caos” ou identificação direta com o Egito
  rationale: O contexto evoca uma força cósmica subjugada, mas a referência hebraica conserva abertura poética e intertextual; a tradução não deve impor uma única identificação.
- issue: Natureza da submissão dos ajudantes
  choice: “se agacham”
  alternative: “se curvam” ou “jazem prostrados”
  rationale: A forma verbal indica abatimento ou postura encurvada sob Deus, sem exigir que seja adoração voluntária.
translation_notes:
  register: Português atual, digno e de leitura ampla. A ordem das orações e a imagética espacial do hebraico foram preservadas. “Raabe” distingue-se, pelo contexto e pela nota, da mulher de Jericó com o mesmo nome na forma portuguesa.
