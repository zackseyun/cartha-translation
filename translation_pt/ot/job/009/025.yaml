  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: pt
  text: Meus dias são mais velozes que um corredor; fogem e não veem o bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a prosperidade» ou «o bem-estar», em vez de «o bem».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Meus dias
  rationale: Preserva o possessivo plural e a expressão hebraica natural para os dias da vida de Jó.
- source_word: קַלוּ
  choice: são mais velozes
  rationale: O verbo קלל exprime aqui rapidez; a construção comparativa com מִנִּי pede «mais... que» em português.
- source_word: מִנִּי רָץ
  choice: que um corredor
  rationale: A preposição introduz comparação, e רָץ designa de modo geral alguém que corre; «corredor» evita especificar indevidamente um mensageiro.
- source_word: בָּרְחוּ
  choice: fogem
  rationale: Reproduz a imagem vívida dos dias que escapam, com o sujeito plural mantido.
- source_word: לֹא רָאוּ
  choice: não veem
  rationale: O presente comunica naturalmente, no contexto, que os dias passam sem experimentar aquilo que é bom.
- source_word: טוֹבָה
  choice: o bem
  rationale: Mantém a amplitude semântica do hebraico, que pode incluir prosperidade e bem-estar, sem restringir o sentido.
