source:
  edition: WLC
  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: pt
  text: Eu serei condenado[a]; então, por que me esforço em vão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei perverso”. O verbo hebraico pode ter sentido moral (“ser perverso”) ou forense (“ser considerado culpado”, “ser condenado”).'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Eu
  rationale: O pronome independente de primeira pessoa dá ênfase ao sujeito; o português o explicita para preservar essa ênfase.
- source_word: אֶרְשָׁע
  choice: serei condenado
  rationale: O Qal de רשע pode ter sentido moral, “ser perverso”, ou forense, “ser considerado culpado/condenado”. O contexto judicial de Jó 9 favorece aqui o sentido forense, mantendo-se a nuance futura do imperfeito.
- source_word: לָמָה זֶּה
  choice: então, por que
  rationale: A expressão idiomática significa “por que, então?” ou “por que, nesse caso?”. A formulação escolhida comunica naturalmente a força inferencial em português.
- source_word: הֶבֶל
  choice: em vão
  rationale: הֶבֶל denota vazio, inutilidade ou futilidade; nesta frase, caracteriza como inútil o esforço de Jó.
- source_word: אִיגָע
  choice: me esforço
  rationale: O verbo יגע expressa trabalhar arduamente, fatigar-se ou esforçar-se. “Me esforço” transmite tanto a ação pessoal quanto a fadiga implícita, em linguagem corrente e digna.
theological_decisions:
- issue: Sentido forense ou moral de רשע
  choice: 'Sentido forense: “serei condenado”'
  alternative: 'Sentido moral/descritivo: “serei perverso” ou “serei considerado perverso”'
  rationale: O contexto trata da impossibilidade percebida por Jó de demonstrar sua inocência diante de Deus e de sua expectativa de não ser absolvido. A tradução forense acompanha esse argumento sem eliminar a ambiguidade lexical, que é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem “então, por que” conserva a ligação lógica com o contexto, e “me esforço em vão” reproduz de modo idiomático a ideia de trabalho inútil.
