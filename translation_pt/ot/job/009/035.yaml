base_translation:
  language: en
  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: pt
  text: Então eu falaria e não teria medo dele, pois não é assim comigo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois as coisas não estão assim comigo”; mais literalmente: “pois não assim eu comigo”. A cláusula final em hebraico é elíptica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Então eu falaria
  rationale: A forma de primeira pessoa expressa intenção ou resolução hipotética no contexto; “Então” mantém a dependência do desejo expresso nos versículos anteriores.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: sem medo dele
  rationale: Traduz naturalmente a coordenação negativa e o verbo ירא com sufixo masculino singular, sem alterar o sentido de “e não o temeria”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior.
- source_word: לֹא כֵן
  choice: não é assim
  rationale: Preserva a expressão comparativa elíptica do hebraico em português corrente, sem especificar indevidamente a situação implícita.
- source_word: אָנֹכִי עִמָּדִי
  choice: comigo mesmo
  rationale: Mantém de perto o incomum “eu... comigo” do hebraico e sua referência pessoal/reflexiva, preservando a dificuldade da cláusula.
theological_decisions:
- issue: Interpretação da cláusula final elíptica
  choice: pois não é assim comigo mesmo
  alternative: pois as coisas não estão assim comigo; pois eu não sou assim em mim mesmo
  rationale: A cláusula hebraica é muito concisa e admite mais de uma compreensão. A redação principal conserva sua tensão e estranheza controlada, enquanto a nota registra alternativas sem impor uma leitura psicológica ou doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A formulação preserva deliberadamente a elipse e a ambiguidade do hebraico final.
