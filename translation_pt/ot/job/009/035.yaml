  to: Então eu falaria e não teria medo dele, pois não é assim comigo[a].
  rationale: A revisão explicita a coordenação verbal do hebraico («falaria e não teria medo») e substitui «comigo mesmo» por «comigo», uma formulação mais natural que preserva a elipse e a ambiguidade da cláusula final. A nota permanece necessária para indicar que o hebraico não explicita plenamente o sentido da expressão.
