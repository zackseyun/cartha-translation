  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: pt
  text: Se é questão de força, eis que ele é poderoso; e, se é questão de julgamento[a], quem me convocará[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Julgamento” também pode ser traduzido por “justiça” ou “causa judicial”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é difícil. Também é possível entender: “quem marcará uma audiência para mim?” Pelo contexto, alguns traduzem: “quem poderá convocá-lo?”, referindo-se a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: Se é questão de força
  rationale: A construção introduz a força como a primeira categoria em consideração. A expansão idiomática “é questão de” comunica naturalmente em português o valor da preposição לְ.
- source_word: אַמִּיץ
  choice: poderoso
  rationale: Expressa força irresistível e evita repetir “forte” logo depois de “força”, mantendo o tom elevado.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a função enfática e a força retórica da partícula hebraica.
- source_word: וְאִם לְמִשְׁפָּט
  choice: e, se é questão de julgamento
  rationale: Mantém o paralelismo com a primeira oração e conserva a imagem jurídica do contexto. “Julgamento” deixa aberta a possibilidade de referência à justiça ou a uma causa judicial.
- source_word: מִי יוֹעִידֵנִי
  choice: quem me convocará
  rationale: Segue a forma massorética, na qual o sufixo -נִי é de primeira pessoa (“me”). No contexto jurídico, o hifil de יעד pode indicar convocar ou designar alguém para comparecer; a dificuldade semântica é explicitada em nota.
theological_decisions:
- issue: A imagem judicial no desafio de Jó diante de Deus
  choice: Manter a linguagem de julgamento e convocação sem atenuar a tensão da fala de Jó.
  alternative: 'Traduzir de modo mais geral: “se é uma questão de justiça, quem marcará uma audiência para mim?”'
  rationale: O contexto de Jó 9 apresenta a impossibilidade de levar uma causa contra Deus. A tradução conserva essa tensão, sem harmonização doutrinária.
- issue: Objeto de יוֹעִידֵנִי
  choice: 'Traduzir o sufixo massorético como primeira pessoa: “me convocará”.'
  alternative: Adotar a leitura contextual “quem poderá convocá-lo?”, entendendo Deus como objeto.
  rationale: A forma hebraica preservada pelo WLC contém explicitamente o objeto de primeira pessoa. Embora “convocá-lo” se ajuste bem ao argumento contextual, isso exige tratar a construção como anômala ou pressupor outra leitura; por isso, fica na nota como alternativa.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo retórico. “Eis que” foi mantido por sua força enfática; a formulação jurídica permanece compreensível sem empregar tecnicismo excessivo.
