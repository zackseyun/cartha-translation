  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: pt
  text: Se alguém quisesse contender com ele[a], não poderia responder-lhe nem uma vez em mil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “discutir com ele” ou “litigar contra ele”. O verbo hebraico pode ter a nuance de uma disputa judicial.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não lhe responderia uma de mil”; o sentido é que não poderia responder nem sequer uma vez em mil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição hipotética expressa pelo hebraico.
- source_word: יַחְפֹּץ
  choice: quisesse
  rationale: Expressa desejo ou disposição e se encaixa naturalmente na construção hipotética em português.
- source_word: לָרִיב
  choice: contender
  rationale: Preserva tanto a ideia geral de confronto quanto a possível nuance de disputa judicial, sem tornar o texto excessivamente técnico.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz formalmente a preposição hebraica; o caráter adversativo já é comunicado por «contender».
- source_word: לֹא יַעֲנֶנּוּ
  choice: não poderia responder-lhe
  rationale: No contexto de uma disputa com Deus, indica incapacidade de apresentar resposta, e não simplesmente recusa.
- source_word: אַחַת מִנִּי אָלֶף
  choice: nem uma vez em mil
  rationale: Forma portuguesa natural que preserva a desproporção hiperbólica e explicita que não conseguiria responder sequer uma vez.
theological_decisions:
- issue: Referência dos pronomes na declaração de Jó
  choice: Um ser humano é incapaz de responder a Deus numa disputa.
  alternative: Uma pessoa genérica é incapaz de responder a outro oponente humano.
  rationale: O contexto imediato trata da sabedoria e do poder de Deus (Jó 9:2-4). Ainda assim, mantém-se «alguém» e «ele» em vez de inserir explicitamente «Deus», preservando a forma e a referência contextual do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Contender» mantém a nuance forense do original; as notas registram alternativas e a construção hebraica condensada.
