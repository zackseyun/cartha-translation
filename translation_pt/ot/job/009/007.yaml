  text: who says to the sun[b][a], ‘Do not rise,’ and seals up the stars.
translation:
  language: pt
  text: 'que diz ao sol[b]: “Não nasça”,[a] e sela as estrelas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e ele não nasce”; o hebraico pode expressar tanto a ordem dirigida ao sol quanto o resultado da palavra de Deus.
    reason: lexical_alternative
  - marker: b
    text: Aqui, o hebraico חֶרֶס provavelmente significa “sol” em uso poético; em outros contextos, a palavra pode se referir a barro ou cerâmica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: que diz
  rationale: O particípio prossegue a descrição de Deus iniciada no contexto anterior e funciona como oração relativa; “que diz” é natural e preserva esse valor descritivo.
- source_word: לַחֶרֶס
  choice: ao sol
  rationale: Neste contexto poético, associado a “nascer” e às estrelas, חֶרֶס designa o sol, e não barro ou objeto de cerâmica.
- source_word: וְלֹא יִזְרָח
  choice: “Não nasça”
  rationale: O imperfeito pode ser entendido vividamente como o conteúdo da ordem dirigida ao sol. A leitura resultativa, “e ele não nasce”, permanece indicada em nota.
- source_word: וּבְעַד
  choice: e
  rationale: Com חתם, a preposição integra a imagem de fechar ou vedar; em português, “sela as estrelas” transmite a ideia sem reproduzir a preposição de modo artificial.
- source_word: כּוֹכָבִים
  choice: as estrelas
  rationale: Tradução direta do plural; o artigo definido é natural em português nesta afirmação cósmica.
- source_word: יַחְתֹּם
  choice: sela
  rationale: Preserva a imagem concreta de חתם, a ação de selar, sugerindo que Deus impede que as estrelas apareçam.
