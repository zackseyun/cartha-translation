  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: pt
  text: Ele não me deixa recuperar o fôlego[a], pois me enche de amarguras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retomar o fôlego”; literalmente, “fazer voltar meu fôlego/espírito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de coisas amargas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: não me deixa
  rationale: O verbo נתן significa literalmente “dar”, mas, seguido do infinitivo, expressa aqui permissão. “Não me deixa” transmite a construção de modo natural em português.
- source_word: הָשֵׁב רוּחִי
  choice: recuperar o fôlego
  rationale: A expressão combina o infinitivo causativo de שוב, “fazer voltar/restaurar”, com רוּחַ, “fôlego/espírito/vento”. No contexto da aflição incessante de Jó, refere-se a ter um momento para voltar a respirar ou se recompor; “recuperar o fôlego” preserva ambas as nuances melhor que uma formulação estritamente literal.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão da afirmação anterior. “Pois” mantém o sentido causal e o registro poético.
- source_word: יַשְׂבִּיעַנִי
  choice: me enche
  rationale: A forma causativa de שבע significa “saciar, fazer ficar cheio”. Neste contexto negativo, “enche” comunica com clareza a ideia de ser cumulativamente tomado por experiências penosas.
- source_word: מַמְּרֹרִים
  choice: de amarguras
  rationale: O substantivo plural pode designar “coisas amargas” ou experiências amargas. O plural “amarguras” é natural em português e conserva melhor que o singular a forma e a força cumulativa do hebraico.
