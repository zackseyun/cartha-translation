base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: pt
  text: 'Eis que ele arrebata[a]; quem pode fazê-lo voltar[b]? Quem pode lhe dizer: “O que você está fazendo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ele arrebatar”. O verbo hebraico sugere tomar de repente e à força; também pode ser traduzido por “agarra” ou “leva embora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, entendendo o pronome como referência ao que foi arrebatado: “quem pode trazê-lo de volta?”. O hebraico significa literalmente “fazê-lo voltar”.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Se
  rationale: Neste contexto, a partícula introduz uma situação enfática ou hipotética. “Se” produz uma frase natural em português e preserva a força condicional possível, enquanto a nota registra a leitura apresentativa “Eis que”.
- source_word: יַחְתֹּף
  choice: arrebata
  rationale: O verbo חטף indica tomar de modo súbito e enérgico. “Arrebata” comunica tanto a força quanto a retirada do que foi tomado, sem acrescentar um objeto ausente no hebraico.
- source_word: יְשִׁיבֶנּוּ
  choice: fazê-lo voltar
  rationale: A forma causativa de שוב significa fazer voltar ou trazer de volta. A tradução mantém a referência pessoal mais provável do sufixo, sem reduzir a ideia à mera anulação de um ato.
- source_word: מִי
  choice: quem pode
  rationale: Nas duas perguntas retóricas, מִי expressa não apenas identidade, mas a impossibilidade de alguém resistir a Deus. “Quem pode” torna essa força clara em português corrente.
- source_word: יֹאמַר אֵלָיו
  choice: lhe dizer
  rationale: Equivale naturalmente a “dizer a ele” e mantém Deus como destinatário da pergunta, sem acrescentar explicitamente a ideia de protesto.
- source_word: מַה תַּעֲשֶׂה
  choice: O que você está fazendo?
  rationale: A forma verbal tem aqui o valor idiomático de uma contestação dirigida a uma ação em curso ou considerada. O presente progressivo é natural e direto em português.
theological_decisions:
- issue: Referente dos sufixos masculinos da terceira pessoa
  choice: 'Entender “ele” e “-lo” como referências pessoais a Deus: “ele arrebata... fazê-lo voltar”.'
  alternative: 'Entender o objeto de יְשִׁיבֶנּוּ como aquilo que Deus arrebatou: “quem pode trazê-lo de volta?”.'
  rationale: O contexto descreve a ação irresistível de Deus, e a pergunta seguinte fala diretamente a ele. Ainda assim, a forma hebraica permite que o sufixo seja relacionado ao que foi arrebatado; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Arrebata” conserva a energia do hebraico sem soar excessivamente coloquial; “lhe dizer” e “você está fazendo” dão naturalidade à pergunta direta.
