  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: pt
  text: 'É tudo a mesma coisa; por isso digo[a]: “Ele[b] destrói tanto o íntegro como o perverso”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por isso eu disse”. A forma perfeita hebraica pode ser entendida, neste contexto, como uma declaração presente ou passada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “isso destrói tanto o íntegro como o perverso”, entendendo o sujeito de modo mais impessoal.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: É tudo a mesma coisa
  rationale: A expressão comunica que, quanto ao desfecho em vista, a distinção não faz diferença. Esta formulação é natural em português e preserva a afirmação sombria de Jó sem reduzir o hebraico ao numeral literal «um».
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca com clareza a conclusão que Jó tira da afirmação anterior, em linguagem atual e digna.
- source_word: אָמַרְתִּי
  choice: digo
  rationale: Embora a forma hebraica seja perfeita, no contexto ela pode introduzir a conclusão que Jó enuncia naquele momento. A possibilidade de uma referência passada é preservada em nota.
- source_word: תָּם
  choice: o íntegro
  rationale: Em Jó, o termo indica inteireza e retidão de caráter, não perfeição sem pecado. «Íntegro» expressa esse sentido de modo claro e natural.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Designa a pessoa moralmente culpável e forma um contraste claro com «o íntegro».
- source_word: הוּא מְכַלֶּה
  choice: Ele destrói
  rationale: O pronome masculino singular e o particípio apontam mais naturalmente para Deus como sujeito implícito no contexto de Jó 9. «Destrói» conserva a força do verbo כלה. A leitura mais impessoal é registrada em nota.
theological_decisions:
- issue: Sujeito implícito de «destrói»
  choice: «Ele», referindo-se a Deus na fala de Jó
  alternative: «isso destrói», com sentido mais impessoal
  rationale: O contexto de Jó 9 trata do poder e do governo de Deus, tornando a referência pessoal a leitura mais provável. A tradução mantém sem atenuação a dura queixa teológica de Jó, enquanto a nota preserva a possibilidade de uma construção mais impessoal.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. «É tudo a mesma coisa» mantém a força idiomática sem excessiva coloquialidade; «íntegro» e «perverso» preservam o contraste sapiencial com dignidade.
