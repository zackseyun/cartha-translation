  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: pt
  text: Sou íntegro; não conheço a mim mesmo[a]; desprezo a minha vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conheço a minha alma” ou “não conheço o meu próprio ser”. O hebraico néfesh pode significar alma, vida ou a própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: íntegro
  rationale: O termo expressa inteireza de caráter e conduta irrepreensível, sem necessariamente afirmar perfeição moral absoluta. “Íntegro” é natural em português e se ajusta à caracterização de Jó no livro.
- source_word: אָנִי
  choice: eu (expresso na forma verbal “sou”)
  rationale: O pronome de primeira pessoa dá ênfase ao sujeito. Em português, a construção “Sou íntegro” conserva essa afirmação enfática sem exigir o pronome explícito.
- source_word: לֹא אֵדַע
  choice: não conheço
  rationale: Mantém o sentido básico de יָדַע e preserva a formulação abrupta e ambígua do hebraico, em vez de explicá-la como indiferença ou falta de consideração.
- source_word: נַפְשִׁי
  choice: a mim mesmo
  rationale: נֶפֶשׁ pode designar a pessoa, o próprio ser, a alma ou a vida. Aqui, a forma reflexiva comunica naturalmente em português a referência ao próprio Jó, enquanto a amplitude lexical é indicada em nota.
- source_word: אֶמְאַס
  choice: desprezo
  rationale: מָאַס significa rejeitar ou desprezar. “Desprezo” preserva a forte carga afetiva do verbo e se combina naturalmente com “minha vida”.
- source_word: חַיָּי
  choice: a minha vida
  rationale: O plural hebraico חַיִּים com sufixo de primeira pessoa se refere à existência de Jó; “a minha vida” é a equivalência portuguesa mais clara e natural.
theological_decisions: []
