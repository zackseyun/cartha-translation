  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: pt
  text: Ele desloca montanhas[a] sem que elas percebam[b], quando as transtorna em sua ira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “remove montanhas”. O verbo hebraico pode indicar fazer algo mudar de lugar.'
    reason: lexical_alternative
  - marker: b
    text: O verso personifica poeticamente as montanhas, dizendo que elas não percebem quando Deus as transtorna.
    reason: cultural_note
  - marker: c
    text: 'Ou: “em seu furor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: desloca
  rationale: O particípio hifil de עתק indica fazer algo mudar de lugar. “Desloca” expressa com naturalidade essa ação e preserva a possibilidade de movimento ou remoção.
- source_word: הָרִים
  choice: montanhas
  rationale: Equivalente corrente de הָרִים; o plural foi preservado.
- source_word: וְלֹא יָדָעוּ
  choice: sem que elas percebam
  rationale: A formulação idiomática mantém as montanhas como sujeito plural e conserva sua personificação poética, sem acrescentar um objeto explícito ausente no hebraico.
- source_word: אֲשֶׁר
  choice: quando
  rationale: No contexto, o relativo introduz a circunstância em que as montanhas não percebem o ocorrido; “quando” comunica bem esse valor temporal-circunstancial.
- source_word: הֲפָכָם
  choice: as transtorna
  rationale: A forma de הפך significa virar, revirar ou transtornar, e o pronome feminino plural retoma naturalmente “montanhas” em português. “Transtorna” transmite a violenta alteração descrita no verso.
- source_word: בְּאַפּוֹ
  choice: em sua ira
  rationale: אַף designa idiomaticamente ira ou furor. “Em sua ira” é claro, digno e mantém o valor circunstancial da expressão.
