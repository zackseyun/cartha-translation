lexical_decisions:
- source_word: עֹשֶׂה
  choice: que faz
  rationale: O particípio qal tem aqui valor descritivo e retoma Deus no contexto anterior; “que faz” é natural em português.
- source_word: גְדֹלוֹת
  choice: coisas grandiosas
  rationale: O adjetivo feminino plural está substantivado. A formulação mantém a amplitude do hebraico sem restringi-lo a obras ou feitos.
- source_word: עַד אֵין חֵקֶר
  choice: além de toda investigação
  rationale: A expressão comunica que os atos de Deus não podem ser plenamente investigados ou compreendidos, preservando a ideia de insondabilidade.
- source_word: וְנִפְלָאוֹת
  choice: e maravilhas
  rationale: O substantivo designa atos extraordinários que despertam admiração; “maravilhas” é conciso e consagrado sem ser arcaico.
- source_word: עַד אֵין מִסְפָּר
  choice: sem conta
  rationale: A expressão indica quantidade inumerável; “sem conta” é clara, corrente e mantém o paralelismo poético.
