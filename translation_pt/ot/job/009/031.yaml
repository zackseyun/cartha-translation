  text: אָ֭ז בַּ/שַּׁ֣חַת תִּטְבְּלֵ֑/נִי וְ֝/תִֽעֲב֗וּ/נִי שַׂלְמוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/031.yaml
  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: pt
  text: então me mergulharias no poço[a], e as minhas próprias roupas teriam nojo de mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no fosso». O termo hebraico pode significar «poço», «fosso» ou, em alguns contextos, «destruição».
    reason: lexical_alternative
  - marker: b
    text: Ou «as minhas vestes me abominariam».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: então
  rationale: 'Advérbio temporal e sequencial que dá continuidade ao argumento de Jó: mesmo que ele se lavasse, isto aconteceria em seguida.'
- source_word: בַּשַּׁחַת
  choice: no poço
  rationale: שַׁחַת pode designar poço, fosso ou, em certos contextos, destruição. Com o verbo de movimento, a expressão portuguesa «mergulhar no poço» comunica naturalmente o sentido direcional sem especificar em excesso a imagem.
- source_word: תִּטְבְּלֵנִי
  choice: me mergulharias
  rationale: O verbo טבל significa mergulhar ou imergir. «Mergulharias» preserva a imagem forte de Jó sendo lançado novamente à imundície após a purificação hipotética do versículo anterior.
- source_word: וְתִעֲבוּנִי
  choice: teriam nojo de mim
  rationale: תעב expressa forte repulsa, aversão ou abominação. A locução corrente «ter nojo de» mantém a intensidade e torna vívida a personificação das roupas.
- source_word: שַׂלְמוֹתָי
  choice: as minhas próprias roupas
  rationale: O termo se refere a vestes ou roupas. «Próprias» realça a ironia de que até aquilo que pertence intimamente a Jó sentiria repulsa dele.
theological_decisions:
- issue: Agência indicada pelo verbo na segunda pessoa
  choice: 'A fala se dirige diretamente a Deus: «me mergulharias».'
  alternative: Leitura impessoal ou circunstancial, na qual Jó simplesmente acabaria no poço.
  rationale: O verbo hebraico está na segunda pessoa masculina singular e continua a interpelação direta de Jó a Deus. A tradução preserva, sem atenuar, a tensão da queixa de Jó.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. O futuro do pretérito mantém a construção hipotética do contexto. A ordem das notas foi normalizada conforme a posição dos marcadores no texto.
