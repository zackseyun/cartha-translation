  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: pt
  text: Ele é sábio de coração e poderoso em força; quem se obstinou contra ele e saiu ileso[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prosperou” ou “saiu em paz”. O verbo hebraico pode indicar sair inteiro, incólume ou em paz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: sábio de coração
  rationale: Preserva a imagem hebraica do coração como centro do entendimento e da vontade, em linguagem poética compreensível em português.
- source_word: וְאַמִּיץ כֹּחַ
  choice: e poderoso em força
  rationale: Reproduz a combinação enfática de termos ligados a poder e força sem reduzir a expressão a um único adjetivo.
- source_word: מִי
  choice: quem
  rationale: Introduz de modo direto e natural a pergunta retórica.
- source_word: הִקְשָׁה
  choice: se obstinou
  rationale: Expressa a ação de tornar-se duro ou teimoso diante de alguém e conserva o sentido de resistência deliberada.
- source_word: אֵלָיו
  choice: contra ele
  rationale: Neste uso idiomático, a preposição indica oposição hostil, não mera direção.
- source_word: וַיִּשְׁלָם
  choice: e saiu ileso
  rationale: Comunica o sentido contextual de atravessar o confronto inteiro, sem dano, preservando a ideia básica de שלם.
theological_decisions:
- issue: Sujeito implícito no início do versículo
  choice: Ele, referindo-se a Deus
  alternative: Manter as predicações sem sujeito explícito
  rationale: Embora o hebraico não expresse o sujeito, o contexto identifica Deus; o pronome é necessário para uma frase natural e completa em português.
- issue: Resultado de resistir a Deus
  choice: saiu ileso
  alternative: prosperou
  rationale: A forma de שלם admite a noção de permanecer inteiro ou incólume. A tradução mantém aberta a dimensão do êxito sem limitar a frase à prosperidade material.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A ordem e o paralelismo hebraicos foram preservados quando naturais; “se obstinou” evita a rigidez pouco idiomática de “endureceu a si mesmo”.
