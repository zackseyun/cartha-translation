base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: pt
  text: que fez a Ursa[a], Órion e as Plêiades, e as câmaras do sul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “que faz a Ursa, Órion e as Plêiades”. O particípio hebraico pode descrever tanto uma ação contínua quanto uma ação realizada.
    reason: lexical_alternative
  - marker: b
    text: “As câmaras do sul” provavelmente se refere, em linguagem poética, às regiões ocultas ou às constelações do céu meridional.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: que fez
  rationale: O particípio qal de עשה descreve Deus em continuidade com o versículo anterior. O passado expressa aqui sua obra criadora, embora o hebraico também possa ter sentido presente ou contínuo.
- source_word: עָשׁ
  choice: a Ursa
  rationale: O termo designa uma constelação, provavelmente a Ursa. O nome astronômico corrente é mais claro que uma transliteração e evita a identificação tradicional, porém excessivamente específica, com Arcturo.
- source_word: כְּסִיל
  choice: Órion
  rationale: Em contexto astronômico, o termo é amplamente identificado com a constelação de Órion; usa-se seu nome português corrente.
- source_word: כִימָה
  choice: as Plêiades
  rationale: O termo é tradicional e amplamente identificado com o aglomerado estelar das Plêiades; o nome português comunica diretamente o referente provável.
- source_word: חַדְרֵי תֵמָן
  choice: as câmaras do sul
  rationale: A expressão significa literalmente 'câmaras/aposentos do sul'. A tradução conserva a imagem poética e não explicita como constelações aquilo que o hebraico deixa figurado.
