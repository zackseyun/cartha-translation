  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: pt
  text: Pois ele não é homem como eu, para que eu lhe responda e juntos compareçamos em juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que eu pudesse responder-lhe, e nós comparecêssemos juntos para julgamento”.'
    reason: Alternativa que explicita o valor potencial dos verbos e traduz מִשְׁפָּט por “julgamento”, em vez da formulação forense “em juízo”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Jó e mantém o encadeamento argumentativo com o contexto anterior.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: ele não é homem como eu
  rationale: Preserva o contraste direto entre Deus e Jó como litigantes; “homem” reflete o substantivo masculino singular אִישׁ sem transformar a frase numa afirmação abstrata.
- source_word: אֶעֱנֶנּוּ
  choice: para que eu lhe responda
  rationale: ענה significa responder; no contexto jurídico, a expressão também sugere apresentar uma resposta ou defesa diante da outra parte.
- source_word: נָבוֹא יַחְדָּו
  choice: juntos compareçamos
  rationale: A primeira pessoa do plural inclui Jó e Deus, e “comparecer juntos” exprime naturalmente a apresentação conjunta num contexto judicial.
- source_word: בַּמִּשְׁפָּט
  choice: em juízo
  rationale: מִשְׁפָּט pode indicar julgamento, causa ou procedimento judicial. “Em juízo” preserva a metáfora forense e mantém um registro digno e compreensível.
theological_decisions:
- issue: Imagem forense entre Jó e Deus
  choice: Apresentar a situação como a impossibilidade de Jó e Deus comparecerem em juízo como litigantes equiparáveis.
  alternative: 'Traduzir de modo mais abstrato: “cheguemos juntos para julgamento”.'
  rationale: O vocabulário hebraico é jurídico, mas o versículo expressa a queixa de Jó sobre a desigualdade entre as partes, sem acrescentar uma formulação doutrinária além do que o texto afirma.
- issue: Linguagem masculina em אִישׁ
  choice: Usar “homem”.
  alternative: Usar “ser humano” ou “pessoa”.
  rationale: O hebraico emprega um substantivo masculino singular, e Jó compara Deus consigo mesmo como homem; a tradução conserva esse contraste concreto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Em juízo” mantém a linguagem jurídica sem recorrer ao coloquial “no tribunal”; a ordem “juntos compareçamos” evita ambiguidade e conserva a concisão poética.
