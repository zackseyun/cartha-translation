  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: pt
  text: Que ele retire de cima de mim a sua vara[a], e que o seu terror não me apavore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ele afaste de mim a sua vara, e que o pavor que ele causa não me aterrorize.”'
    reason: Alternativas lexicais para יָסֵר, מֵעָלַי, אֵימָתוֹ e תְּבַעֲתַנִּי.
lexical_decisions:
- source_word: יָסֵר
  choice: Que ele retire
  rationale: O hifil de סור tem aqui força volitiva, exprimindo o desejo de Jó; “que ele retire” preserva essa nuance em português natural.
- source_word: מֵעָלַי
  choice: de cima de mim
  rationale: Reproduz a imagem literal de algo que pesa ou permanece sobre Jó, sem soar artificial em português.
- source_word: שִׁבְטוֹ
  choice: a sua vara
  rationale: שֵׁבֶט pode indicar vara, bastão ou cetro; no contexto de aflição, “vara” comunica melhor um instrumento de golpe ou disciplina.
- source_word: וְאֵמָתוֹ
  choice: e o seu terror
  rationale: אֵימָה designa terror ou pavor; “seu terror” mantém a intensidade e a ideia do medo provocado por Deus.
- source_word: אַל
  choice: e que ... não
  rationale: A construção portuguesa com “que ... não” transmite a negação volitiva ligada à forma verbal seguinte.
- source_word: תְּבַעֲתַנִּי
  choice: me apavore
  rationale: O verbo בעת significa aterrorizar ou apavorar. “Apavore” é atual e forte, evitando a repetição pouco elegante de “terror” e “aterrorize”.
theological_decisions:
- issue: Referente dos pronomes da terceira pessoa do singular
  choice: Deus é mencionado indiretamente como “ele/sua/seu”.
  alternative: 'Discurso direto: “Retira de mim a tua vara, e não me apavore o teu terror.”'
  rationale: O hebraico emprega verbo e sufixos de terceira pessoa, em harmonia com o discurso de Jó a respeito de Deus nesta seção. A tradução conserva essa gramática e não a transforma silenciosamente em discurso direto.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “De cima de mim” preserva a imagem hebraica; a colocação pronominal e as formas volitivas são naturais sem perder solenidade.
