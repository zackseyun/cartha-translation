  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: pt
  text: Mesmo que eu tivesse razão, não responderia; imploraria clemência ao meu juiz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: tivesse razão
  rationale: Expressa aqui a ideia forense de estar com a razão ou ter uma causa justa, sem afirmar uma condição moral absoluta.
- source_word: אֶעֱנֶה
  choice: responderia
  rationale: Preserva o sentido jurídico de apresentar resposta ou defesa diante de quem julga.
- source_word: אֶתְחַנָּן
  choice: imploraria clemência
  rationale: O verbo denota suplicar favor ou misericórdia; “implorar clemência” é natural em português e mantém o contexto judicial.
- source_word: לִמְשֹׁפְטִי
  choice: ao meu juiz
  rationale: Mantém de forma direta a relação expressa pelo sufixo de primeira pessoa e o papel judicial do referente.
theological_decisions:
- issue: A tensão entre ter razão e ainda assim pedir clemência
  choice: Preservar ambas as afirmações sem explicá-las ou harmonizá-las
  alternative: Interpretar a fala como confissão de culpa ou como acusação explícita de injustiça divina
  rationale: 'O hebraico mantém deliberadamente a tensão: mesmo na hipótese de estar com a razão, Jó não apresentaria resposta, mas pediria clemência ao seu juiz.'
translation_notes:
  register: Português moderno, claro e digno, com linguagem forense acessível. A construção condicional foi vertida de modo natural, sem tornar explícito o referente divino além do que este versículo declara.
