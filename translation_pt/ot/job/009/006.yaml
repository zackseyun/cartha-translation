  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: pt
  text: 'Ele sacode a terra do seu lugar,

    e suas colunas estremecem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tremem” ou “se abalam”.'
    reason: Alternativas lexicais para יִתְפַלָּצוּן, que descreve um tremor violento.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: Ele sacode
  rationale: O particípio hifil de רגז tem força causativa e descreve Deus no contexto. “Sacode” é natural em português e preserva a ação vigorosa.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O contexto cósmico favorece “terra”, em vez do sentido mais local de “território” ou “país”.
- source_word: מִמְּקוֹמָהּ
  choice: para fora do seu lugar
  rationale: Expressa com clareza o afastamento ou deslocamento a partir do lugar próprio, preservando a imagem hebraica.
- source_word: וְעַמּוּדֶיהָ
  choice: e suas colunas
  rationale: עמוד designa uma coluna ou pilar. “Colunas” preserva a imagem cosmológica poética sem reinterpretá-la como “alicerces”.
- source_word: יִתְפַלָּצוּן
  choice: estremecem
  rationale: O verbo indica tremor intenso. “Estremecem” comunica essa força sem atribuir necessariamente uma emoção às colunas.
theological_decisions:
- issue: Imagem cosmológica das colunas da terra
  choice: Preservar literalmente a imagem poética como “suas colunas”
  alternative: Interpretar como “seus alicerces” ou modernizar a cosmologia
  rationale: O hebraico emprega linguagem cosmológica poética. A tradução mantém essa imagem sem transformá-la numa descrição científica nem suavizá-la por interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Colunas” conserva a concretude da poesia hebraica; “para fora do seu lugar” explicita de modo idiomático a ideia de deslocamento.
