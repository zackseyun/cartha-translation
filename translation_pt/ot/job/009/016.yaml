  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: pt
  text: Se eu o chamasse e ele me respondesse,[a] eu não acreditaria que estivesse escutando a minha voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se eu clamasse e ele me respondesse, eu não acreditaria que tivesse dado ouvidos à minha voz.”'
    reason: Registra as alternativas lexicais legítimas para קרא e אזן, preservando a possibilidade de um clamor e da expressão idiomática “dar ouvidos”.
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma situação condicional e hipotética, sem convertê-la em afirmação temporal ou concessiva explícita.
- source_word: קָרָאתִי
  choice: eu o chamasse
  rationale: קרא pode significar chamar ou clamar. “Chamasse” é amplo e natural; o objeto “o” explicita em português o destinatário implícito no contexto.
- source_word: וַיַּעֲנֵנִי
  choice: e ele me respondesse
  rationale: Traduz diretamente a ideia de responder e mantém a sequência hipotética exigida em português.
- source_word: לֹא אַאֲמִין
  choice: eu não acreditaria
  rationale: O futuro do pretérito expressa adequadamente a força modal do imperfeito hebraico dentro da construção condicional.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo em que Jó não acreditaria, e não uma oração causal.
- source_word: יַאֲזִין
  choice: estivesse escutando
  rationale: אזן indica dar ouvidos, escutar atentamente. A forma progressiva preserva a ideia de atenção sem recorrer a uma expressão excessivamente arcaica.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Reproduz diretamente o sentido lexical de קוֹלִי, sem interpretá-lo como “minha súplica”.
theological_decisions:
- issue: A declaração de Jó sobre a resposta divina
  choice: 'Apresentar a incredulidade subjetiva de Jó: mesmo se Deus lhe respondesse, Jó não acreditaria que Deus estivesse realmente escutando.'
  alternative: Traduzir como uma negação absoluta de que Deus escuta, ou enfraquecer a frase como simples espanto.
  rationale: O hebraico formula uma hipótese e expressa a incapacidade pessoal de Jó de crer que recebeu atenção divina; não estabelece diretamente uma doutrina geral de que Deus jamais ouve orações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A mesóclise e formulações arcaicas foram evitadas; a estrutura condicional mantém a tensão e a ambiguidade do hebraico.
