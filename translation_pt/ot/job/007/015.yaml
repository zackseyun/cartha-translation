base_translation:
  language: en
  yaml_path: translation/ot/job/007/015.yaml
  text: so that my soul chooses strangling[b][a], death rather than my bones.
translation:
  language: pt
  text: de modo que minha alma escolhe o estrangulamento[a] — a morte — em vez destes meus ossos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sufocação” ou “a asfixia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “morte, em vez de meus ossos”. A expressão poética parece indicar que Jó prefere morrer a permanecer em sua condição corporal afligida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: prefere
  rationale: O verbo בחר significa “escolher”. Diante da comparação expressa no segundo segmento, “prefere” comunica com naturalidade a escolha de uma coisa em lugar de outra, sem eliminar a força volitiva do hebraico.
- source_word: מַחֲנָק
  choice: o estrangulamento
  rationale: O substantivo designa estrangulamento, sufocação ou asfixia. “Estrangulamento” preserva a imagem concreta e extrema do texto.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode designar alma, vida, pessoa ou o próprio eu. “Minha alma” mantém a expressão poética hebraica sem impedir o sentido de “eu mesmo” ou “minha vida”.
- source_word: מָוֶת
  choice: a morte
  rationale: Equivalente direto e corrente de מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: a continuar nestes meus ossos
  rationale: 'A expressão é literalmente “mais do que/de meus ossos”. O acréscimo contextual “a continuar” torna inteligível a comparação: Jó prefere a morte à permanência em sua existência corporal afligida, enquanto “ossos” preserva a imagem do original.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com preservação da linguagem corporal intensa do poema. A construção “de modo que” mantém a ligação sintática com o contexto anterior; “prefere” explicita de forma idiomática a comparação já presente no verso.
