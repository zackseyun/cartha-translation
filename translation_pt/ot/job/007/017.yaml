source:
  edition: WLC
  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: pt
  text: Que é o ser humano, para que o engrandeças[a] e ponhas nele o teu coração?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe dês tanta importância” ou “o tornes grande”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Que é o ser humano
  rationale: Mantém a abertura interrogativa e o singular representativo. “Ser humano” comunica a humanidade mortal e frágil sem restringir a referência ao sexo masculino.
- source_word: כִּי תְגַדְּלֶנּוּ
  choice: para que o engrandeças
  rationale: O piel de גדל pode significar “tornar grande”, “engrandecer” ou “dar grande importância”. A formulação preserva a imagem hebraica e a pergunta retórica, sem decidir se a atenção divina é honra ou inquietante vigilância.
- source_word: וְכִי תָשִׁית אֵלָיו לִבֶּךָ
  choice: e ponhas nele o teu coração
  rationale: Reproduz de perto שׁית/שים + לב e conserva a linguagem antropomórfica e poética. Em português, a expressão sugere dirigir a alguém atenção e interesse.
theological_decisions:
- issue: Singular representativo de אֱנוֹשׁ
  choice: o ser humano
  alternative: o homem; a humanidade mortal
  rationale: “O ser humano” preserva o singular representativo e inclui toda a humanidade, enquanto o contexto e o substantivo hebraico salientam a condição humana frágil e mortal.
- issue: Sentido da atenção divina
  choice: engrandecer e pôr o coração nele
  alternative: dar-lhe tanta importância e voltar para ele a atenção
  rationale: 'A redação mantém a tensão do discurso de Jó: as mesmas imagens podem indicar consideração elevada ou uma atenção divina sentida como opressiva. Não se resolve essa ambiguidade por paráfrase.'
- issue: Antropomorfismo de לִבֶּךָ
  choice: o teu coração
  alternative: a tua atenção; a tua mente
  rationale: Conservar “coração” respeita a imagem concreta do hebraico e evita reduzir seu campo semântico a uma única faculdade.
translation_notes:
  register: Português moderno, poético e digno, com construção sintética adequada ao paralelismo hebraico. O tratamento por “tu” acompanha as formas verbais e o possessivo singular dirigidos a Deus.
