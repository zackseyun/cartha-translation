lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: A conjunção admite valor causal, condicional ou circunstancial. Aqui, “quando” introduz de modo natural o pensamento de Jó e se liga à frustração desse alívio no versículo seguinte.
- source_word: אָמַרְתִּי
  choice: digo
  rationale: Embora a forma hebraica seja perfeita, o presente em português expressa naturalmente o pensamento recorrente ou imediato de Jó no contexto.
- source_word: תְּנַחֲמֵנִי
  choice: me consolará
  rationale: O Piel de נחם indica consolar ou confortar; “consolará” mantém o sentido de alívio esperado em linguagem digna e corrente.
- source_word: עַרְשִׂי
  choice: minha cama
  rationale: עֶרֶשׂ designa cama ou leito. “Cama” é claro e natural e permite variar o termo no membro paralelo.
- source_word: יִשָּׂא
  choice: aliviará
  rationale: נשא significa literalmente levantar, carregar ou suportar. Com “queixa”, “aliviará” comunica de modo natural a ideia de a cama ajudar a carregar o peso da aflição, sem obscurecer o sentido do verso.
- source_word: בְשִׂיחִי
  choice: a minha queixa
  rationale: שִׂיחַ pode indicar reflexão, meditação ou fala de lamento. No contexto do sofrimento de Jó, “queixa” representa melhor seu valor lamentoso.
- source_word: מִשְׁכָּבִי
  choice: meu leito
  rationale: מִשְׁכָּב designa cama, leito ou lugar onde alguém se deita. “Leito” preserva o paralelismo poético sem repetição exata de “cama”.
