  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pois eu disse” ou “Se eu dissesse”. O hebraico כִּי permite mais de uma leitura aqui; “Quando digo” se ajusta melhor ao contexto imediato e à passagem para o versículo seguinte.
