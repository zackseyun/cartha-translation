  text: וַ/תִּפְקְדֶ֥/נּוּ לִ/בְקָרִ֑ים לִ֝/רְגָעִ֗ים תִּבְחָנֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: pt
  text: para que o visites todas as manhãs[a] e o examines a cada momento?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltes a tua atenção para ele todas as manhãs”. O verbo hebraico pode significar “visitar”, “voltar a atenção para” ou “tomar nota de”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o ponhas à prova a cada momento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: o visites
  rationale: O verbo פקד pode significar visitar, voltar a atenção para ou tomar nota de alguém. Aqui, em paralelo com “examines” e no contexto da queixa de Jó, “visites” preserva a amplitude e a tensão da atenção divina, sem necessariamente sugerir uma visita benevolente.
- source_word: לִבְקָרִים
  choice: todas as manhãs
  rationale: O plural com ל indica ocorrência repetida; “todas as manhãs” é natural em português e mantém a força iterativa.
- source_word: לִרְגָעִים
  choice: a cada momento
  rationale: רגעים designa momentos breves ou instantes; “a cada momento” expressa repetição contínua em português corrente.
- source_word: תִּבְחָנֶנּוּ
  choice: o examines
  rationale: בחן significa testar ou examinar mediante escrutínio. “Examines” comunica com naturalidade a inspeção persistente sugerida pelo contexto.
- source_word: ־נּוּ
  choice: o
  rationale: O sufixo pronominal masculino singular retoma o ser humano mencionado no versículo anterior; o pronome “o” preserva essa referência singular.
theological_decisions:
- issue: Tom da vigilância divina
  choice: Retratar a ação de Deus como atenção próxima e contínua, sentida por Jó como escrutínio pesado.
  alternative: Entender a visita como cuidado exclusivamente benevolente.
  rationale: A pergunta integra a queixa de Jó. A tradução deve preservar a tensão retórica e não transformar a ação em linguagem inequivocamente consoladora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a pergunta retórica e o paralelismo poético do hebraico.
