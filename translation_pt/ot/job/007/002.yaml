  text: Like a slave who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: pt
  text: Como o escravo que anseia pela sombra[a], e como o trabalhador contratado que espera pelo seu salário[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo” em vez de “escravo”; o termo hebraico pode ter ambos os sentidos. “Sombra” refere-se aqui ao alívio do calor.
    reason: lexical_alternative
  - marker: b
    text: Ou “pagamento” ou “recompensa” em vez de “salário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: como o escravo
  rationale: עֶבֶד pode designar servo ou escravo; aqui, “escravo” preserva melhor a condição de sujeição e a vulnerabilidade associadas ao trabalho árduo da comparação.
- source_word: יִשְׁאַף
  choice: anseia
  rationale: O verbo שׁאף expressa desejo intenso, por vezes com a imagem de ofegar. “Anseia” comunica essa intensidade em português natural e digno.
- source_word: צֵל
  choice: sombra
  rationale: Neste contexto de trabalho exaustivo sob o calor, צֵל indica a sombra que oferece alívio; “sombra” é a correspondência portuguesa direta e idiomática.
- source_word: וּ/כְ/שָׂכִיר
  choice: e como o trabalhador contratado
  rationale: שָׂכִיר é alguém contratado para trabalhar em troca de pagamento. A expressão mantém tanto a ideia de trabalho quanto a relação econômica.
- source_word: יְקַוֶּה
  choice: espera
  rationale: קוה pode significar esperar ou aguardar com expectativa. Aqui descreve a espera do trabalhador pela remuneração devida.
- source_word: פָעֳל/וֹ
  choice: pelo seu salário
  rationale: Embora פעל possa referir-se a trabalho ou obra, em associação com שָׂכִיר aponta naturalmente para a remuneração resultante do trabalho.
