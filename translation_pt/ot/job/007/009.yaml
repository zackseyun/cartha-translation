source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: pt
  text: Como a nuvem se desfaz e desaparece, assim quem desce ao Sheol[a] não sobe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura” ou “ao mundo dos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: se desfaz
  rationale: O verbo indica chegar ao fim ou acabar. Tendo “nuvem” como sujeito, “se desfaz” expressa naturalmente sua dissipação sem introduzir a ideia mais forte de destruição.
- source_word: עָנָן
  choice: nuvem
  rationale: Sentido nominal direto, preservando a imagem comum da nuvem que se dissipa.
- source_word: וַיֵּלַךְ
  choice: e vai embora
  rationale: Literalmente, “e vai”. A formulação portuguesa é natural e, em paralelo com “se desfaz”, comunica o desaparecimento da nuvem sem ampliar indevidamente o verbo.
- source_word: כֵּן
  choice: assim
  rationale: Introduz de modo conciso a correspondência entre a imagem da nuvem e a condição de quem desce ao Sheol.
- source_word: יוֹרֵד
  choice: quem desce
  rationale: O particípio tem função substantivada e sentido genérico. “Quem desce” preserva esse valor e a imagem espacial.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração conserva o termo hebraico e sua amplitude conceitual, sem reduzi-lo apenas à sepultura nem defini-lo plenamente como mundo dos mortos.
- source_word: לֹא יַעֲלֶה
  choice: não torna a subir
  rationale: Mantém a imagem vertical correspondente a “desce”. “Torna a subir” exprime com clareza idiomática o não retorno enfatizado no contexto.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O termo pode apontar para a sepultura ou para o domínio dos mortos. Mantê-lo como “Sheol” preserva a ambiguidade conceitual do hebraico e evita transformar a observação de Jó sobre a irreversibilidade da morte, sob a perspectiva humana do discurso, numa afirmação doutrinária exaustiva sobre a ressurreição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva o paralelismo descer/subir e a imagem poética da nuvem, evitando linguagem excessivamente técnica ou confessional.
