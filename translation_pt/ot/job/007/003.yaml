base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: pt
  text: Assim, meses de vazio[a] me foram atribuídos, e noites de sofrimento[b] me foram destinadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meses de futilidade”, “meses de vaidade” ou “meses de inutilidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “noites de labuta”, “noites de trabalho penoso” ou “noites de aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Retoma a comparação do versículo anterior e introduz a situação correspondente de Jó com naturalidade e força conclusiva.
- source_word: הָנְחַ֣לְתִּי לִי
  choice: recebi como herança
  rationale: O hofal de נחל apresenta Jó como aquele a quem uma porção foi dada. A expressão preserva a imagem de herança ou quinhão imposto, sem sugerir que ele o escolheu.
- source_word: יַרְחֵי שָׁוְא
  choice: meses de inutilidade
  rationale: שָׁוְא pode indicar vazio, vaidade, inutilidade ou frustração. No lamento, caracteriza meses sem proveito ou propósito percebido.
- source_word: וְלֵילוֹת עָמָל
  choice: e noites de sofrimento
  rationale: עָמָל abrange trabalho penoso, aflição, dificuldade e sofrimento. O contexto das noites dolorosas de Jó favorece o sentido experiencial de sofrimento.
- source_word: מִנּוּ לִי
  choice: me foram destinadas
  rationale: O verbo passivo plural concorda com 'noites' e comunica que elas foram designadas ou atribuídas a Jó.
