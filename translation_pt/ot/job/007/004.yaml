source:
  edition: WLC
  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: pt
  text: 'Quando me deito[a], digo: “Quando me levantarei?” Mas a noite se prolonga[b], e fico farto de me revirar até o amanhecer[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se me deito”. A partícula hebraica pode ter sentido condicional, mas aqui provavelmente introduz uma situação que se repete: “Quando me deito”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e a tarde/noite é medida”. A expressão indica que a noite parece estender-se lentamente.
    reason: lexical_alternative
  - marker: c
    text: A palavra hebraica pode significar “crepúsculo” e, neste contexto, provavelmente se refere ao crepúsculo da manhã, isto é, ao amanhecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Quando
  rationale: Embora normalmente possa significar “se”, aqui introduz uma circunstância recorrente na descrição do sofrimento noturno de Jó; “quando” expressa melhor esse valor habitual.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: me deito, digo
  rationale: Os verbos no qatal descrevem aqui uma experiência habitual e repetida; o presente comunica isso naturalmente em português.
- source_word: מָתַי אָקוּם
  choice: Quando me levantarei?
  rationale: קום significa levantar-se ou erguer-se. O futuro preserva a pergunta impaciente de Jó sobre quando poderá deixar o leito.
- source_word: וּמִדַּד עָרֶב
  choice: Mas a noite se prolonga
  rationale: A expressão contém literalmente a ideia de a tarde/noite ser medida ou estendida. “Se prolonga” comunica o lento arrastar do período noturno; “noite” torna explícito o sentido contextual de עֶרֶב, iniciado ao entardecer.
- source_word: וְשָׂבַעְתִּי
  choice: e fico farto de
  rationale: O verbo שבע significa ficar cheio ou saciado. No contexto negativo, “ficar farto de” preserva a imagem e expressa cansaço extremo de modo idiomático.
- source_word: נְדֻדִים
  choice: me revirar
  rationale: O plural designa movimentos inquietos ou agitação. A formulação verbal natural em português retrata Jó virando-se repetidamente no leito.
- source_word: עֲדֵי נָשֶׁף
  choice: até o amanhecer
  rationale: נֶשֶׁף pode designar o crepúsculo da tarde ou da manhã. Como é o término de uma noite de inquietação, o contexto favorece o crepúsculo matutino, isto é, o amanhecer.
