base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: pt
  text: Meus dias passam mais depressa que a lançadeira do tecelão[a] e chegam ao fim sem esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido de modo mais geral como “que o instrumento do tecelão” ou como referência ao próprio tecelão; “lançadeira” se ajusta à imagem de movimento rápido.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Meus dias
  rationale: Mantém a expressão concreta do hebraico, que apresenta a brevidade da vida de Jó em termos dos dias que ele vive.
- source_word: קַלּוּ
  choice: passam mais depressa
  rationale: Expressa naturalmente em português o sentido verbal de rapidez e conserva a força comparativa da forma hebraica.
- source_word: מִנִּי אָרֶג
  choice: que a lançadeira do tecelão
  rationale: Embora אֹרֵג possa designar o tecelão ou algo ligado à tecelagem, a imagem tradicional da lançadeira em rápido movimento se ajusta bem à comparação de velocidade; a ambiguidade lexical é registrada em nota.
- source_word: וַיִּכְלוּ
  choice: e chegam ao fim
  rationale: Reproduz o sentido de כלה, isto é, terminar ou esgotar-se, aplicado aqui aos dias de Jó.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: sem esperança
  rationale: Forma portuguesa concisa e natural para a ausência de תִּקְוָה, sem acrescentar interpretação teológica.
