  text: מָ֭אַסְתִּי לֹא לְ/עֹלָ֣ם אֶֽחְיֶ֑ה חֲדַ֥ל מִ֝מֶּ֗/נִּי כִּי הֶ֥בֶל יָמָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: pt
  text: Eu a rejeito[a]; não viverei para sempre. Deixa-me em paz, pois os meus dias são apenas um sopro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu a desprezo” ou “Eu a repudio”. O hebraico não declara o objeto; no contexto, pode-se entender “minha vida”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “vapor”, ressaltando como a vida é breve e insubstancial.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Eu a rejeito
  rationale: O verbo מָאַס pode significar rejeitar, desprezar ou repudiar. Como o objeto não está expresso no hebraico, o pronome feminino retoma naturalmente a vida mencionada no contexto, sem inseri-la explicitamente no texto.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: não viverei para sempre
  rationale: Reproduz com clareza a negação, a ideia de duração indefinida e o verbo viver, sem converter a afirmação em desejo.
- source_word: חֲדַל מִמֶּנִּי
  choice: Deixa-me em paz
  rationale: Equivalente idiomático moderno do imperativo 'cessa/desiste' seguido de 'de mim', preservando a súplica de Jó.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão apresentada para a súplica.
- source_word: הֶבֶל
  choice: apenas um sopro
  rationale: Sopro expressa a brevidade e a inconsistência sugeridas por הֶבֶל; 'apenas' torna explícita a força diminutiva contextual sem recorrer ao tradicional e ambíguo 'vaidade'.
- source_word: יָמָי
  choice: os meus dias
  rationale: Tradução direta do plural possessivo que designa o tempo de vida de Jó.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “Deixa-me” conserva um tom literário natural; “a” mantém o objeto implícito ligado à vida pelo contexto. Todos os marcadores de nota aparecem no texto.
