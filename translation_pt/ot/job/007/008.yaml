  text: לֹֽא תְ֭שׁוּרֵ/נִי עֵ֣ין רֹ֑אִי עֵינֶ֖י/ךָ בִּ֣/י וְ/אֵינֶֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: pt
  text: O olho de quem me vê não mais me contemplará[a]; teus olhos estarão sobre mim[b], mas eu não estarei mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O olho que me vê não me verá.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “teus olhos [estão] sobre mim, e eu não estou”. A expressão pode indicar que, quando Deus olhar para Jó, ele já terá desaparecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: não me contemplarão
  rationale: O verbo שׁור exprime olhar, observar ou contemplar. “Contemplar” preserva a ênfase visual e o tom elevado do lamento, sem soar arcaico.
- source_word: עֵין רֹאִי
  choice: os olhos de quem me vê
  rationale: Embora o hebraico tenha literalmente “o olho daquele que me vê”, o plural idiomático em português é mais natural e mantém a imagem concreta do observador.
- source_word: לֹא
  choice: não ... mais
  rationale: A negação simples recebe valor temporal pelo contexto da partida iminente de Jó. “Não ... mais” comunica que quem agora o vê deixará de vê-lo.
- source_word: עֵינֶיךָ
  choice: teus olhos
  rationale: Mantém o plural do hebraico e a expressão antropomórfica concreta dirigida a Deus.
- source_word: בִּי
  choice: sobre mim
  rationale: Com “olhos”, a preposição ב pode indicar atenção dirigida. “Sobre mim” conserva de perto a imagem hebraica e é inteligível em português.
- source_word: וְאֵינֶנִּי
  choice: mas eu já não existirei
  rationale: A expressão significa literalmente “e eu não [estarei/existirei]”. A formulação escolhida preserva a força existencial e futura do contexto, sem restringir a ideia apenas a estar fora de vista.
theological_decisions:
- issue: Destinatário de “teus olhos”
  choice: Deus, a quem Jó se dirige diretamente
  alternative: Um observador genérico
  rationale: O contexto imediato apresenta Jó falando com Deus. A tradução mantém a segunda pessoa sem acrescentar o nome divino, que não aparece neste versículo.
- issue: Sentido de וְאֵינֶנִּי
  choice: Ausência ou não existência iminente, expressa sem definir além do texto a condição de Jó após a morte
  alternative: “Eu terei desaparecido”, entendido somente como ausência do campo de visão
  rationale: A construção hebraica pode indicar que alguém já não está presente ou já não existe. “Já não existirei” mantém a intensidade do lamento sem desenvolver uma doutrina específica sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A colocação pronominal e o vocabulário evitam tanto coloquialismo excessivo quanto arcaísmo. “Teus olhos” conserva a forma poética da interpelação direta.
