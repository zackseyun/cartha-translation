  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: pt
  text: então me aterrorizas com sonhos e me assustas com visões[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e me aterrorizas em sonhos, e a partir de visões me assustas». As preposições hebraicas podem ser traduzidas mais formalmente por «em/por meio de» e «a partir de».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: então
  rationale: A conjunção liga a frase à queixa anterior; em português, «então» expressa naturalmente a sequência ou consequência contextual.
- source_word: חִתַּתַּנִי
  choice: me aterrorizas
  rationale: O Piel de חתת com sufixo de primeira pessoa descreve intensa perturbação causada por Deus; «aterrorizas» preserva essa força sem sugerir destruição física.
- source_word: בַחֲלֹמוֹת
  choice: com sonhos
  rationale: A preposição ב pode indicar meio ou circunstância; «com sonhos» é natural e comunica que os sonhos são o meio do terror.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: com visões
  rationale: מן pode indicar origem ou meio. Em paralelo com «com sonhos», «com visões» produz português fluente, enquanto a nota preserva a construção mais formal «a partir de visões».
- source_word: תְּבַעֲתַנִּי
  choice: me assustas
  rationale: O Piel de בעת denota causar pavor ou alarme. «Assustas» oferece um paralelo natural a «aterrorizas» sem repetir o mesmo verbo.
