  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: pt
  text: Também eu não refrearei a minha boca[a]; falarei na angústia do meu espírito[b]; eu me queixarei na amargura da minha alma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não segurarei a minha boca”. O idioma hebraico fala literalmente de não reter ou refrear a boca.
    reason: lexical_alternative
  - marker: b
    text: Ou “na aflição do meu espírito”.
    reason: lexical_alternative
  - marker: c
    text: Ou “lamentarei” ou “falarei”. O verbo hebraico pode indicar meditar, falar, lamentar ou queixar-se, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva o valor aditivo mais comum de גַּם sem transformá-lo em um conector causal como “portanto”.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: não refrearei a minha boca
  rationale: Mantém a imagem hebraica de não restringir a boca, ao mesmo tempo que comunica com clareza a decisão de não reprimir a fala.
- source_word: אֲדַבְּרָה
  choice: falarei
  rationale: Expressa naturalmente a resolução de Jó e conserva o sentido direto do verbo דבר.
- source_word: בְּצַר רוּחִי
  choice: na angústia do meu espírito
  rationale: צַר denota aflição ou angústia; “espírito” preserva רוּחַ como termo distinto de נֶפֶשׁ no paralelismo.
- source_word: אָשִׂיחָה
  choice: eu me queixarei
  rationale: No contexto de sofrimento e amargura, o verbo tem força de fala lamentosa ou queixosa, embora seu campo semântico também inclua meditar e falar.
- source_word: בְּמַר נַפְשִׁי
  choice: na amargura da minha alma
  rationale: Conserva a imagem poética de מַר e traduz נֶפֶשׁ de modo distinto de רוּחַ, sem impor uma antropologia técnica.
theological_decisions:
- issue: Os termos antropológicos רוּחַ e נֶפֶשׁ no paralelismo poético
  choice: Traduzir distintamente por “espírito” e “alma”
  alternative: Empregar “mente” e “coração”, ou verter ambos por “interior”
  rationale: O hebraico emprega dois termos diferentes em paralelo. Preservar essa distinção mantém a textura poética e a tensão antropológica sem afirmar uma doutrina específica sobre a composição humana.
- issue: Força de אָשִׂיחָה no lamento de Jó
  choice: “eu me queixarei”
  alternative: “lamentarei”, “falarei” ou “meditarei”
  rationale: O contexto favorece uma queixa lamentosa, mas a nota registra a amplitude lexical para não ocultar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva as imagens poéticas hebraicas e distingue “espírito” de “alma”, sem dar a esses termos um sentido doutrinário técnico.
