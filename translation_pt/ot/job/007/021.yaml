  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: pt
  text: Por que não perdoas minha transgressão nem removes minha iniquidade?[a] Pois agora me deitarei no pó; tu me buscarás com diligência,[b] mas eu já não existirei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, os verbos podem ser traduzidos por “levantar/carregar minha transgressão” e “fazer passar minha iniquidade”; no contexto, são expressões de perdão e remoção da culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “me buscarás cedo”. O verbo hebraico pode conter uma nuance de busca matinal, mas aqui provavelmente indica uma busca intensa ou diligente.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: perdoas
  rationale: נשׂא significa literalmente “levantar” ou “carregar”, mas, tendo uma transgressão como objeto, expressa idiomaticamente o perdão ou o afastamento da culpa.
- source_word: פִשְׁעִי
  choice: minha transgressão
  rationale: פשע designa uma transgressão ou rebelião, muitas vezes uma violação deliberada; “transgressão” conserva sua força moral e distingue o termo do paralelo עון.
- source_word: וְתַעֲבִיר
  choice: removes
  rationale: O hifil de עבר pode significar fazer passar, afastar ou remover. Com עון como objeto, “remover” comunica naturalmente a eliminação da iniquidade ou culpa.
- source_word: עֲוֺנִי
  choice: minha iniquidade
  rationale: עון pode indicar iniquidade, culpa ou a consequência da iniquidade. Aqui, em paralelo com פשע, “iniquidade” preserva o peso moral e a distinção lexical.
- source_word: כִּי עַתָּה
  choice: Pois agora
  rationale: A expressão introduz a razão da súplica com referência à morte iminente de Jó, sem tornar explícito mais do que o hebraico afirma.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: me deitarei no pó
  rationale: A tradução conserva a imagem concreta do pó, associada à mortalidade e ao sepultamento, em vez de substituí-la pela interpretação direta “morrerei”.
- source_word: וְשִׁחֲרְתַּנִי
  choice: tu me buscarás com diligência
  rationale: No piel, שׁחר pode denotar uma busca intensa ou diligente, embora também conserve possível associação com buscar cedo pela manhã.
- source_word: וְאֵינֶנִּי
  choice: mas eu já não existirei
  rationale: A expressão é literalmente “e eu não [estarei/existirei]”. A formulação portuguesa mantém sua força existencial no contexto futuro e deixa clara a ausência definitiva prevista por Jó.
theological_decisions:
- issue: Distinção entre os dois termos relativos ao pecado
  choice: “transgressão” para פשע e “iniquidade” para עון
  alternative: Empregar “pecado” para ambos, ou “ofensa” e “culpa”
  rationale: O hebraico emprega termos relacionados, mas distintos. Preservar essa diferença respeita o paralelismo poético e evita reduzir a variedade moral do texto.
- issue: Imagem da morte em לֶעָפָר אֶשְׁכָּב
  choice: Manter “me deitarei no pó”
  alternative: Traduzir interpretativamente como “morrerei”
  rationale: A imagem poética de mortalidade e sepultamento pertence ao texto e deve permanecer sem que sua tensão seja resolvida por paráfrase.
- issue: Sentido existencial de וְאֵינֶנִּי
  choice: “mas eu já não existirei”
  alternative: “mas eu já terei partido” ou, literalmente, “e eu não estarei”
  rationale: A escolha expressa de modo natural a declaração de Jó sobre sua morte e ausência, sem introduzir uma descrição específica do estado após a morte.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais correntes no registro bíblico internacional. O paralelismo entre “transgressão” e “iniquidade” e a imagem poética do pó foram preservados; a segunda pessoa singular mantém o discurso direto de Jó a Deus.
