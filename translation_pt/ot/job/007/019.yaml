  text: כַּ֭/מָּה לֹא תִשְׁעֶ֣ה מִמֶּ֑/נִּי לֹֽא תַ֝רְפֵּ֗/נִי עַד בִּלְעִ֥/י רֻקִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: pt
  text: Até quando não desviarás de mim o teu olhar[a] nem me deixarás em paz, até que eu engula a minha saliva?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não voltarás o teu olhar para longe de mim». «Engolir a saliva» é uma expressão para um intervalo extremamente breve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Até quando
  rationale: Em contexto de lamento, introduz uma queixa temporal; «Até quando» é natural em português e preserva a força da pergunta.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: não desviarás de mim o teu olhar
  rationale: O verbo expressa voltar ou dirigir o olhar. No contexto, Jó pede que Deus cesse de observá-lo fixamente; a formulação conserva esse sentido e a imagem hebraica.
- source_word: תַרְפֵּנִי
  choice: me deixarás em paz
  rationale: A forma causativa de רפה tem o sentido de soltar, desistir ou dar trégua. «Deixar em paz» comunica isso de modo claro e natural.
- source_word: עַד
  choice: para que
  rationale: Embora עַד normalmente indique limite temporal («até»), nesta construção a pergunta pede uma trégua suficiente para realizar o gesto; «para que» produz português natural sem perder a ideia de intervalo mínimo.
- source_word: בִּלְעִי רֻקִּי
  choice: eu engula a minha saliva
  rationale: Preserva literalmente a imagem vívida do hebraico, uma expressão que indica um momento extremamente breve. «Saliva» é corrente e digna em português amplo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível no Brasil e compreensível internacionalmente. A segunda pessoa do singular preserva o discurso direto de Jó a Deus; a imagem corporal do original foi mantida.
