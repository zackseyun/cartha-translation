base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: pt
  text: O ser humano não está sujeito a um serviço árduo na terra[a]? E seus dias não são como os de um trabalhador contratado?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ser humano não está em guerra na terra?” O hebraico צָבָא pode indicar serviço militar ou guerra, mas aqui provavelmente se refere, de modo mais amplo, a um serviço ou trabalho penoso, como sugere o paralelo com “um trabalhador contratado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não está...? E não são...?
  rationale: Preserva a força de uma pergunta retórica que espera resposta afirmativa; a repetição na segunda oração produz sintaxe portuguesa natural.
- source_word: צָבָא
  choice: sujeito a serviço árduo
  rationale: O termo pode indicar guerra, serviço militar ou um período imposto de serviço. O paralelo com o trabalhador contratado favorece aqui a ideia mais ampla de serviço penoso e compulsório, sem eliminar a alternativa militar, registrada em nota.
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: Expressa a humanidade em sentido genérico e mantém a associação do termo hebraico com a condição humana frágil e mortal, sem restringir a referência ao sexo masculino.
- source_word: עַל־אָרֶץ
  choice: na terra
  rationale: Locução natural em português para o cenário universal da experiência humana.
- source_word: וְכִימֵי
  choice: E não são os seus dias como os de
  rationale: Explicita naturalmente em português a comparação introduzida por כ e mantém ambas as metades sob a força da pergunta retórica.
- source_word: שָׂכִיר
  choice: um trabalhador contratado
  rationale: Designa alguém que trabalha por remuneração durante um período; a expressão é atual e evita o tom arcaico ou depreciativo de alternativas tradicionais.
- source_word: יָמָיו
  choice: os seus dias
  rationale: Mantém a imagem temporal concreta do hebraico, em vez de interpretá-la simplesmente como 'vida'.
