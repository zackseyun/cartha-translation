  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: pt
  text: Minha carne está coberta de vermes e crostas de pó; minha pele endurece[a] e volta a se romper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha pele se fecha e volta a supurar”. Os dois últimos verbos hebraicos são difíceis; a linha provavelmente descreve a pele que forma uma crosta por breve tempo e depois torna a se abrir.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: se veste de
  rationale: Preserva a metáfora concreta do hebraico, em que a carne aparece como revestida pelos sinais da enfermidade.
- source_word: בְּשָׂרִי
  choice: minha carne
  rationale: É o equivalente lexical direto e mantém a ênfase física e corporal do lamento de Jó.
- source_word: רִמָּה
  choice: vermes
  rationale: O termo designa vermes ou larvas ligados à decomposição; “vermes” preserva o sentido amplo sem especificar em excesso.
- source_word: גיש עפר
  choice: crostas de pó
  rationale: גיש é raro e parece indicar uma massa, crosta ou torrão; “crostas de pó” comunica de modo natural a matéria endurecida aderida à pele, mantendo עפר como “pó”.
- source_word: עוֹרִי
  choice: minha pele
  rationale: É o sentido comum e direto do substantivo no contexto corporal.
- source_word: רָגַע
  choice: endurece
  rationale: No contexto da pele enferma, pode descrever a pele que se contrai, fecha ou forma uma crosta; “endurece” oferece uma imagem concreta sem alegar cura completa.
- source_word: וַיִּמָּאֵס
  choice: volta a se romper
  rationale: Embora o verbo normalmente se relacione a rejeitar ou tornar repugnante, aqui o contexto favorece a descrição difícil de uma lesão que torna a abrir; a formulação preserva o ciclo sugerido pela linha.
