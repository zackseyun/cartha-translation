base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: pt
  text: Acaso sou eu o mar ou um monstro marinho[a], para que ponhas uma sentinela sobre mim[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dragão” ou “serpente”. O hebraico tannin designa uma grande criatura ameaçadora, muitas vezes associada ao mar e às imagens do caos.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que mantenhas vigilância sobre mim” ou “para que estabeleças uma guarda sobre mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Acaso sou eu o mar
  rationale: A partícula interrogativa הֲ introduz uma pergunta retórica. “O mar” preserva diretamente a imagem hebraica, enquanto “acaso” comunica com naturalidade o caráter retórico.
- source_word: אֲנִי
  choice: eu
  rationale: O pronome de primeira pessoa está expresso no hebraico para dar ênfase; sua presença foi mantida em português.
- source_word: אִם
  choice: ou
  rationale: 'Neste par de alternativas retóricas, אִם tem função disjuntiva: “o mar ou um monstro marinho”.'
- source_word: תַּנִּין
  choice: monstro marinho
  rationale: תַּנִּין pode designar uma grande criatura ameaçadora, dragão ou serpente. Em paralelo com “o mar”, “monstro marinho” preserva a imagem poética sem impor uma identidade mitológica específica.
- source_word: כִּי
  choice: para que
  rationale: 'No contexto da pergunta retórica, a construção introduz a consequência ou finalidade implícita: ser tratado como algo que exige vigilância. “Para que” é natural em português e mantém essa relação sem transformar a frase numa afirmação causal rígida.'
- source_word: תָשִׂים
  choice: ponhas
  rationale: O verbo שׂים significa pôr, colocar ou estabelecer. O presente do subjuntivo ajusta-se naturalmente à construção portuguesa iniciada por “para que”.
- source_word: עָלַי
  choice: sobre mim
  rationale: עַל indica aqui vigilância ou supervisão exercida sobre Jó; “sobre mim” preserva a relação espacial e figurada.
- source_word: מִשְׁמָר
  choice: uma sentinela
  rationale: מִשְׁמָר pode indicar guarda, vigilância ou custódia. “Uma sentinela” comunica de modo claro a imagem concreta de vigilância imposta, mantendo em nota a alternativa mais abstrata.
theological_decisions:
- issue: Imagem de תַּנִּין na linguagem poética do caos
  choice: “monstro marinho”, sem ampliar a mitologia além do texto
  alternative: “dragão” ou “serpente”
  rationale: A associação entre o mar e uma grande criatura ameaçadora apresenta Jó como se Deus o tratasse como um perigo que precisa ser contido. A tradução preserva essa tensão da queixa sem importar um sistema mitológico mais desenvolvido.
- issue: Força da queixa dirigida a Deus
  choice: Manter a pergunta direta na segunda pessoa
  alternative: Atenuar para uma reflexão impessoal
  rationale: O hebraico apresenta Jó interpelando diretamente Deus. A tradução conserva a ousadia e a tensão teológica da fala, sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “sou eu” conserva a ênfase do pronome hebraico; “acaso” marca a pergunta retórica. A formulação mantém a imagem poética e a queixa direta de Jó.
