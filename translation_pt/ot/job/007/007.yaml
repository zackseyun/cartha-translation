  text: זְ֭כֹר כִּי ר֣וּחַ חַיָּ֑/י לֹא תָשׁ֥וּב עֵ֝ינִ֗/י לִ/רְא֥וֹת טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: pt
  text: Lembra-te de que minha vida é um sopro[a]; meu olho não voltará a ver o bem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vento». A palavra hebraica רוּחַ pode significar «sopro», «vento» ou «espírito»; aqui expressa o caráter passageiro da vida.
    reason: lexical_alternative
  - marker: b
    text: Isto é, meu olho não tornará a ver o bem; «ver o bem» também pode significar experimentar bem-estar ou prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo qal masculino singular, dirigido a Deus no contexto. A forma pronominal conserva o apelo direto e solene em português.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo daquilo que Deus deve lembrar; em português, «lembrar-se de que» expressa naturalmente essa relação.
- source_word: רוּחַ
  choice: um sopro
  rationale: Neste lamento, רוּחַ retrata a vida como fugaz e insubstancial. «Sopro» comunica essa imagem com clareza, sem impor o sentido antropológico de «espírito».
- source_word: חַיָּי
  choice: minha vida
  rationale: Equivalente natural da forma com sufixo de primeira pessoa, preservando o sentido abrangente da existência ou duração da vida de Jó.
- source_word: לֹא תָשׁוּב
  choice: não voltará
  rationale: Mantém a imagem verbal de retorno e concorda com o sujeito singular «meu olho».
- source_word: עֵינִי
  choice: meu olho
  rationale: Preserva o singular hebraico e sua expressão poética, em vez de normalizá-lo para o plural português.
- source_word: לִרְאוֹת
  choice: a ver
  rationale: Reproduz o sentido básico de ראה e permite tanto a leitura visual quanto a idiomática de experimentar.
- source_word: טוֹב
  choice: o bem
  rationale: Conserva a amplitude semântica do hebraico, que pode abranger bem-estar, felicidade e prosperidade, sem especificar indevidamente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Lembra-te» e «meu olho» preservam o tom poético e a forma singular do hebraico; «um sopro» torna natural a metáfora de transitoriedade.
