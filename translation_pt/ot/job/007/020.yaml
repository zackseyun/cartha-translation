  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: pt
  text: Se pequei[a], que posso eu fazer-te, ó vigilante da humanidade[b]? Por que me fizeste teu alvo[c], a ponto de eu me tornar um peso para mim mesmo[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Pequei”. A construção também pode ser entendida como uma concessão retórica: “Ainda que eu tenha pecado”.'
    reason: ambiguity
  - marker: b
    text: Ou “ó vigilante do ser humano”. O hebraico emprega o singular “ser humano” em sentido genérico, abrangendo a humanidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “Por que fizeste de mim um alvo para ti?”.
    reason: lexical_alternative
  - marker: d
    text: O texto hebraico massorético diz “um peso para mim mesmo”; algumas versões antigas refletem “um peso para ti”.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: Se pequei
  rationale: A forma hebraica é um perfeito na primeira pessoa, literalmente “pequei”. No contexto da argumentação de Jó, a formulação condicional ou concessiva comunica com naturalidade o sentido retórico sem transformar a frase numa confissão inequívoca; a forma literal é registrada em nota.
- source_word: מָה אֶפְעַל לָךְ
  choice: que posso fazer contra ti
  rationale: A pergunta é retórica e ressalta a incapacidade de Jó de afetar Deus. “Posso” expressa essa força contextual, e “contra ti” torna clara em português a relação adversativa sugerida pela queixa, sem entender a frase como uma oferta de serviço.
- source_word: נֹצֵר הָאָדָם
  choice: ó vigilante da humanidade
  rationale: נֹצֵר pode designar quem vigia, guarda ou observa. “Vigilante” preserva a tensão entre cuidado protetor e escrutínio constante. הָאָדָם é singular genérico e aqui se refere à humanidade.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Por que me fizeste teu alvo
  rationale: מִפְגָּע pode indicar algo atingido ou exposto ao ataque. “Teu alvo” é claro e natural, e incorpora idiomaticamente o dativo לָךְ; a construção mais formal, “um alvo para ti”, fica em nota.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: a ponto de eu me tornar um peso para mim mesmo
  rationale: O texto massorético lê עָלַי, “sobre/para mim”, favorecendo “para mim mesmo”. “A ponto de” expressa naturalmente o resultado no fluxo da queixa. A leitura de algumas versões antigas, “para ti”, é preservada em nota.
theological_decisions:
- issue: 'Força de חָטָאתִי: confissão direta ou concessão retórica'
  choice: Se pequei
  alternative: Pequei
  rationale: A morfologia isolada favorece “pequei”, mas o contexto permite que Jó conceda hipoteticamente a acusação para perguntar como seu pecado poderia afetar Deus. A tradução principal preserva essa força argumentativa, e a nota mantém visível a forma literal.
- issue: Sentido de נֹצֵר aplicado a Deus
  choice: vigilante
  alternative: guardião
  rationale: “Vigilante” não decide se a observação divina é protetora ou opressiva, ambiguidade importante na queixa de Jó; “guardião” tenderia a impor uma conotação positiva.
- issue: Leitura de עָלַי no final do versículo
  choice: para mim mesmo
  alternative: para ti
  rationale: “Para mim mesmo” segue o texto massorético e retém a leitura mais difícil. “Para ti”, refletido por algumas versões antigas, é uma variante relevante, mas não deve substituir silenciosamente o texto hebraico recebido.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó vigilante” mantém o tom poético sem soar arcaico. “Humanidade” comunica o valor coletivo de הָאָדָם, enquanto a nota preserva sua forma singular genérica. As ambiguidades textuais e retóricas relevantes são explicitadas sem resolver indevidamente a tensão teológica da queixa de Jó.
