base_translation:
  language: en
  yaml_path: translation/ot/job/007/010.yaml
  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: pt
  text: Não voltará mais para sua casa, e seu lugar já não o reconhecerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּב
  choice: voltará
  rationale: O verbo שׁוב expressa voltar ou retornar; o futuro em português comunica naturalmente a afirmação de que o morto não regressará.
- source_word: עוֹד (primeira ocorrência)
  choice: mais
  rationale: Com a negação, indica que o retorno não ocorrerá novamente; «não voltará mais» é idiomático e evita a redundância de «não voltará novamente».
- source_word: לְבֵיתוֹ
  choice: para sua casa
  rationale: Preserva o sentido concreto de בַּיִת e a imagem hebraica, sem ampliar para «lar» ou «família».
- source_word: יַכִּירֶנּוּ
  choice: o reconhecerá
  rationale: O hifil de נכר pode significar reconhecer ou identificar. Com «seu lugar» como sujeito personificado, «reconhecer» é claro e conserva a força poética.
- source_word: עוֹד (segunda ocorrência)
  choice: já não
  rationale: Na segunda oração, a combinação com a negação indica cessação permanente; «já não» oferece cadência natural em português.
- source_word: מְקֹמוֹ
  choice: seu lugar
  rationale: Tradução direta de מָקוֹם, preservando tanto sua abrangência quanto a personificação poética do lugar associado à pessoa.
theological_decisions:
- issue: Alcance da afirmação sobre a morte
  choice: Manter a declaração poética de que a pessoa não retorna à casa nem é reconhecida por seu lugar.
  alternative: Explicitar que não há retorno à vida terrena ou formular uma doutrina sobre o estado após a morte.
  rationale: O verso descreve a ausência do morto de seu antigo ambiente, mas não desenvolve aqui uma doutrina completa da vida após a morte; explicá-la no texto resolveria além do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem natural e paralelismo conciso. A personificação de «seu lugar» foi mantida. Não se acrescentou nota, pois «reconhecer» traduz diretamente a nuance lexical principal e dispensa uma alternativa necessária.
