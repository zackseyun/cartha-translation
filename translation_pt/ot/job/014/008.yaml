  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: pt
  text: Ainda que sua raiz envelheça na terra[a], e seu toco morra no pó[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se sua raiz envelhecer na terra». A partícula hebraica pode ter sentido condicional, embora, no fluxo da comparação com a árvore, provavelmente tenha aqui sentido concessivo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «cepo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ainda que
  rationale: 'Neste contexto poético, a partícula introduz uma situação concessiva dentro da comparação com a árvore: mesmo em condição aparentemente irremediável, ainda pode haver renovação. A leitura condicional «Se» continua possível e é registrada em nota.'
- source_word: יַזְקִין
  choice: envelheça
  rationale: O verbo expressa tornar-se velho. «Envelheça» preserva o sentido progressivo e soa natural em português.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto botânico, «terra» comunica o lugar em que a raiz está e mantém o tom poético, além de formar um paralelo adequado com «pó».
- source_word: שָׁרְשׁוֹ
  choice: sua raiz
  rationale: Preserva o singular poético hebraico, que pode representar coletivamente o sistema de raízes da árvore.
- source_word: וּבֶעָפָר
  choice: e no pó
  rationale: «Pó» é a correspondência direta e poética de עָפָר, preservando também suas ressonâncias de mortalidade.
- source_word: יָמוּת
  choice: morra
  rationale: Traduz diretamente o verbo comum «morrer», sem acrescentar a ideia de murchar ou apodrecer.
- source_word: גִּזְעוֹ
  choice: seu toco
  rationale: «Toco» designa com clareza a parte do tronco que permanece após o corte e se ajusta à imagem da árvore cortada no contexto imediato.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com cadência poética. «Ainda que» preserva a provável força concessiva sem ocultar a leitura condicional, indicada em nota; «toco» é concreto e natural no contexto de uma árvore cortada.
