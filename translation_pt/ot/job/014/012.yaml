  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: pt
  text: Assim, o homem se deita e não se levanta; até os céus deixarem de existir[a], eles não despertarão nem serão acordados do seu sono[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida como “até não haver mais céus”. Ela apresenta um limite temporal cósmico, praticamente inalcançável.
    reason: lexical_alternative
  - marker: b
    text: 'O verso emprega o sono como imagem da morte: “não despertarão nem serão acordados do seu sono”.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Assim, o homem
  rationale: אִישׁ é o singular masculino “homem”, empregado aqui de modo representativo. A conjunção וְ foi vertida como “Assim” para ligar a afirmação à comparação precedente e dar continuidade ao argumento.
- source_word: שָׁכַב
  choice: se deita
  rationale: O verbo שׁכב significa “deitar-se” e, neste contexto, funciona como imagem eufemística da morte. A tradução conserva a metáfora, sem substituí-la diretamente por “morre”.
- source_word: וְלֹא יָקוּם
  choice: e não se levanta
  rationale: קום descreve o ato de levantar-se. O presente de valor geral soa natural em português e preserva tanto a imagem concreta quanto sua possível ressonância com a ideia de voltar da morte, sem explicitar uma doutrina.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: até os céus deixarem de existir
  rationale: A construção hebraica é literalmente próxima de “até não [haver] céus”. Esta formulação portuguesa comunica de modo natural o horizonte temporal cósmico e hiperbólico.
- source_word: לֹא יָקִיצוּ
  choice: eles não despertarão
  rationale: יקיץ significa “despertar”. O verbo hebraico passa ao plural, generalizando a afirmação do homem representativo para os mortos; o pronome “eles” torna essa mudança de número perceptível em português.
- source_word: וְלֹא יֵעֹרוּ
  choice: nem serão acordados
  rationale: A forma verbal de עור transmite a ideia de ser despertado ou provocado a despertar. “Serão acordados” conserva o valor passivo e forma um paralelismo natural com “despertarão”.
- source_word: מִשְּׁנָתָם
  choice: do seu sono
  rationale: O substantivo significa “sono” e prolonga a imagem da morte como repouso. O possessivo singular “seu” concorda idiomaticamente com o referente plural “eles” no português brasileiro.
theological_decisions:
- issue: Se a imagem da morte deve ser explicitada como aniquilação ou como negação da ressurreição
  choice: Conservar as imagens de deitar-se, levantar-se, despertar e dormir sem expansão doutrinária
  alternative: Traduzir explicitamente como “morre e não voltará a viver” ou inserir uma referência direta à ressurreição
  rationale: O verso expressa poeticamente a mortalidade humana a partir da perspectiva de Jó. A redação mantém a tensão do texto e não transforma a linguagem poética numa declaração sistemática sobre aniquilação ou ressurreição final.
- issue: Representação de gênero em אִישׁ
  choice: homem
  alternative: pessoa ou ser humano
  rationale: O hebraico emprega o substantivo masculino singular אִישׁ de maneira representativa. “Homem” preserva a forma marcada do original sem impedir seu alcance geral no contexto.
- issue: Mudança do singular para o plural
  choice: Manter “o homem” no singular e depois “eles” no plural
  alternative: Regularizar todo o verso no singular ou explicitar “os mortos”
  rationale: A mudança de número está no hebraico e amplia a figura do homem individual para uma coletividade implícita. Mantê-la preserva uma característica significativa do texto; inserir “os mortos” tornaria explícito o que permanece metafórico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição das imagens de deitar-se, levantar-se, despertar e sono foi preservada. A passagem do singular “o homem” ao plural “eles” reproduz deliberadamente a mudança de número do hebraico.
