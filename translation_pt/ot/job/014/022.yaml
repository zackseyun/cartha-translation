  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: pt
  text: De fato, sua carne nele sofre[a], e sua alma[b] nele lamenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somente a sua carne sofre nele, e sua alma nele lamenta.” O hebraico é compacto: אַךְ pode significar “de fato”, “somente” ou “contudo”. A expressão עָלָיו, repetida nos dois membros, significa literalmente “sobre ele” e pode ter aqui o sentido de “nele” ou “por si mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: “Alma” também pode ser traduzida como “vida”, “pessoa” ou “ser”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: A partícula pode ser enfática ou restritiva. “De fato” comunica a ênfase conclusiva sem impor o sentido exclusivamente restritivo de “somente”; a alternativa é registrada em nota.
- source_word: בְּשָׂרוֹ
  choice: sua carne
  rationale: Preserva a imagem concreta de בָּשָׂר e o paralelismo poético com נַפְשׁוֹ, sem substituí-la pela interpretação mais ampla “corpo”.
- source_word: עָלָיו
  choice: nele
  rationale: O hebraico diz literalmente “sobre ele” e repete a expressão nos dois membros. Em português, “nele” mantém a referência pessoal e produz uma formulação natural; a construção literal e outras possibilidades são indicadas em nota.
- source_word: יִכְאָב
  choice: sente dor
  rationale: Expressa o valor experiencial do verbo כאב em português atual, sem especificar indevidamente a natureza da dor.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: “Alma” conserva a tensão poética com “carne”. Como נֶפֶשׁ também pode significar vida, pessoa ou ser, essas possibilidades são registradas em nota.
- source_word: תֶּאֱבָל
  choice: pranteia
  rationale: O verbo אבל denota estar de luto, lamentar ou prantear. “Pranteia” preserva o tom poético e a força emocional do verso.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ em paralelo com בָּשָׂר
  choice: “alma”, preservando o contraste poético entre carne e alma
  alternative: “vida”, “pessoa” ou “ser”
  rationale: A tradução mantém a tensão antropológica da poesia sem transformar o paralelismo em uma afirmação dogmática sobre a constituição humana.
- issue: Condição descrita no verso
  choice: Manter a linguagem de dor e pranto sem explicar se ela se refere à morte, ao processo de morrer ou à existência pessoal
  alternative: Explicitar uma condição pós-morte ou limitar a descrição ao momento da morte
  rationale: O verso é compacto e não resolve por si só essas questões; a tradução não deve acrescentar uma definição teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e poeticamente conciso, com ampla legibilidade brasileira. “Pranteia” mantém o registro poético sem arcaísmo excessivo. A repetição de “nele” procura refletir a repetição de עָלָיו, enquanto a nota preserva a forma literal e a ambiguidade do hebraico.
