  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: pt
  text: Minha transgressão está selada numa bolsa, e tu recobres[a] a minha iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aplicas uma camada sobre”, “costuras por cima” ou “fixas sobre a minha iniquidade”. O verbo hebraico é difícil, e a imagem exata é discutida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: está selada
  rationale: 'O particípio passivo de חתם expressa um estado resultante: algo fechado e protegido por um selo. “Está selada” preserva esse valor sem acrescentar uma ação não expressa.'
- source_word: בִּצְרוֹר
  choice: numa bolsa
  rationale: צְרוֹר pode designar um embrulho, saquitel ou bolsa atada. “Bolsa” mantém a imagem concreta em português corrente.
- source_word: פִּשְׁעִי
  choice: minha transgressão
  rationale: פֶּשַׁע pode significar transgressão ou rebelião. “Transgressão” conserva o peso moral e se ajusta ao contexto poético sem explicitar em excesso a ideia de revolta.
- source_word: וַתִּטְפֹּל
  choice: tu recobres
  rationale: O verbo טפל é lexicalmente difícil e pode evocar aplicar, rebocar, coser ou prender algo por cima. “Recobres” mantém a direção básica da imagem e sua ambiguidade melhor do que uma formulação que sugerisse perdão.
- source_word: עַל
  choice: sobre, incorporado no verbo “recobres”
  rationale: Com טפל, עַל indica que algo é aplicado por cima. Em português, esse sentido é expresso naturalmente por “recobrir” com objeto direto.
- source_word: עֲוֺנִי
  choice: a minha iniquidade
  rationale: עָוֹן abrange iniquidade, culpa e, por vezes, sua consequência. “Iniquidade” mantém o peso moral e a distinção em relação a פֶּשַׁע.
theological_decisions:
- issue: Sentido da imagem de selar e recobrir o pecado
  choice: A fala de Jó retrata Deus guardando e fechando sua transgressão para levá-la em conta contra ele.
  alternative: A imagem poderia ser entendida como ocultação ou remoção do pecado, sugerindo perdão.
  rationale: No contexto imediato do lamento, Jó se queixa de que Deus observa e registra seu pecado. A tradução mantém a imagem concreta e não introduz explicitamente nem perdão nem punição, embora o contexto favoreça a leitura negativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O pronome “tu” acompanha o discurso direto poético dirigido a Deus. “Recobres” preserva a imagem sem resolver indevidamente a dificuldade lexical. O marcador [a] aparece no texto principal.
