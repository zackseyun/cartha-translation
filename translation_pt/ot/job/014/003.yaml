base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: pt
  text: E é sobre alguém assim que fixas os olhos e me levas a juízo contigo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de ti”. O hebraico diz literalmente “contigo”, o que pode sugerir comparecer diante de Deus para julgamento ou entrar em litígio com ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Até
  rationale: A partícula tem força enfática e, neste contexto, expressa a surpresa indignada de Jó diante da atenção judicial de Deus a um ser humano tão frágil.
- source_word: עַל זֶה
  choice: sobre alguém assim
  rationale: A expressão é literalmente “sobre este/isto”, mas retoma o ser humano frágil descrito nos versículos anteriores. “Alguém assim” torna clara a referência pessoal sem explicar demais.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: fixas os olhos
  rationale: A formulação hebraica é literalmente “abres os olhos”, aqui no sentido de dirigir atenção ou escrutínio a alguém. “Fixas os olhos” comunica naturalmente esse sentido em português sem reduzir a imagem à mera vigilância.
- source_word: וְאֹתִי
  choice: e me
  rationale: O pronome objeto destacado no hebraico põe o próprio Jó em foco. A ordem natural do português mantém essa referência pessoal direta.
- source_word: תָבִיא
  choice: levas
  rationale: O hifil de בוא significa fazer vir ou trazer. “Levas” conserva o movimento para a situação judicial e soa natural em português.
- source_word: בְמִשְׁפָּט
  choice: a juízo
  rationale: מִשְׁפָּט designa aqui julgamento ou processo judicial. “A juízo” preserva a imagem forense sem impor a ideia moderna de um tribunal formal.
- source_word: עִמָּךְ
  choice: contigo
  rationale: A preposição significa normalmente “com”. No contexto judicial, pode sugerir comparecer diante de Deus ou entrar em causa com ele; “contigo” preserva essa tensão do hebraico.
theological_decisions:
- issue: Relação judicial expressa por עִמָּךְ na fala de Jó a Deus
  choice: contigo
  alternative: diante de ti; contra ti
  rationale: A tradução mantém o valor mais direto da preposição e não decide silenciosamente se Jó comparece apenas perante Deus como juiz ou se entra com ele numa causa de caráter adversarial.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal na segunda pessoa do singular para a fala direta de Jó a Deus. A pergunta retórica é explicitada pela pontuação, conforme o sentido do contexto poético. A imagem hebraica dos olhos foi mantida em expressão idiomática natural.
