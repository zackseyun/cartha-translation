  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: pt
  text: A água desgasta as pedras; suas enxurradas[a] levam embora o solo da terra. Assim, destróis a esperança do mortal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “enxurradas” é raro e de sentido incerto; também pode indicar “derramamentos”, “escoamentos” ou, possivelmente, “aquilo que brota dela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  choice: as pedras
  rationale: O plural comum “pedras” preserva a imagem poética da erosão e soa mais natural aqui do que “rochas”.
- source_word: שָׁחֲקוּ מַיִם
  choice: A água desgasta
  rationale: A construção poética hebraica é condensada, mas apresenta a água como agente do desgaste. O singular coletivo “a água” é idiomático em português e “desgasta” expressa abrasão gradual.
- source_word: תִּשְׁטֹף
  choice: levam embora
  rationale: No contexto da erosão, comunica de modo natural a ação de lavar ou arrastar o solo. O plural concorda com “enxurradas” na formulação portuguesa.
- source_word: סְפִיחֶיהָ
  choice: suas enxurradas
  rationale: O termo raro e incerto parece designar derramamentos, escoamentos ou fluxos associados à água. “Enxurradas” produz uma imagem coerente, sem ocultar a incerteza, registrada em nota.
- source_word: עֲפַר אָרֶץ
  choice: o solo da terra
  rationale: Embora עָפָר possa significar “pó”, “solo” representa bem a camada solta que a água arrasta nesta imagem de erosão.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: a esperança do mortal
  rationale: “Mortal” conserva o singular representativo e a ênfase de אֱנוֹשׁ na fragilidade humana, sem restringir a referência ao sexo masculino.
- source_word: הֶאֱבַדְתָּ
  choice: destróis
  rationale: O hifil de אבד significa fazer perecer ou destruir. “Destróis” mantém a força do verbo e a segunda pessoa singular na fala dirigida a Deus.
theological_decisions:
- issue: A conclusão é uma declaração dirigida diretamente a Deus
  choice: Assim, destróis a esperança do mortal
  alternative: E destróis a esperança do mortal
  rationale: A forma verbal hebraica está na segunda pessoa masculina singular e dirige a acusação a Deus. “Assim” explicita a comparação implícita com as imagens naturais anteriores, sem atenuar a tensão teológica.
- issue: Sentido representativo de אֱנוֹשׁ
  choice: o mortal
  alternative: o ser humano
  rationale: “O mortal” preserva a referência singular à humanidade e ressalta sua fragilidade e transitoriedade, importantes no contexto de Jó 14.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega-se a segunda pessoa singular (“destróis”) para conservar a interpelação direta a Deus e o paralelismo poético conciso.
