base_translation:
  language: en
  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: pt
  text: Quem pode fazer surgir algo puro do impuro? Ninguém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem pode fazer surgir o que é puro do que é impuro? Nem um sequer.”'
    reason: Alternativa lexical que explicita os adjetivos substantivados e reproduz mais literalmente לֹא אֶחָד.
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; o contexto, junto com o verbo, comunica a ideia de capacidade.
- source_word: יִתֵּן
  choice: pode fazer sair
  rationale: Embora נתן signifique literalmente “dar”, nesta construção tem sentido idiomático de produzir ou fazer surgir; “pode fazer sair” expressa a origem indicada por מִן e a impossibilidade implícita.
- source_word: טָהוֹר
  choice: o puro
  rationale: Adjetivo empregado substantivamente. A formulação concisa conserva aberta a referência a algo ou alguém puro.
- source_word: מִטָּמֵא
  choice: do impuro
  rationale: A preposição מִן com o adjetivo substantivado טָמֵא indica procedência. “Do impuro” mantém o paralelismo e não restringe a impureza ao âmbito ritual, moral ou hereditário.
- source_word: לֹא אֶחָד
  choice: Ninguém
  rationale: Equivalente português natural da negação absoluta que responde à pergunta retórica; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Referência da linguagem de pureza e impureza
  choice: Declaração geral sobre a impossibilidade de fazer o puro proceder do impuro, aplicada no contexto à condição humana.
  alternative: Referência específica ao nascimento de pais impuros, ou provérbio mais amplo acerca de impureza moral e ritual.
  rationale: O hebraico é breve e proverbial. A tradução não define se a impureza é ritual, moral, hereditária ou existencial, preservando a ambiguidade e a tensão do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A oposição “puro/impuro” preserva a concisão e a ambiguidade do hebraico.
