  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: pt
  text: Tu chamarias, e eu te responderia; ansiarias[a] pela obra das tuas mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: terias saudade; ou: desejarias intensamente.'
    reason: lexical_alternative
  - marker: b
    text: “A obra das tuas mãos” refere-se aqui ao ser humano como criatura feita por Deus.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: Tu chamarias
  rationale: O imperfeito qal de קרא recebe valor modal no contexto do desejo hipotético expresso por Jó. “Chamarias” preserva esse cenário esperado, em vez de apresentá-lo como futuro certo.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: A conjunção e o pronome enfático estabelecem a resposta de Jó à ação de Deus. A formulação direta preserva o paralelismo.
- source_word: אֶעֱנֶךָּ
  choice: te responderia
  rationale: Tradução direta do qal imperfeito de ענה com sufixo de segunda pessoa. O condicional acompanha o valor modal de תִּקְרָא.
- source_word: לְמַעֲשֵׂה
  choice: pela obra
  rationale: מַעֲשֶׂה pode indicar obra, feito ou aquilo que foi produzido. Com “tuas mãos”, “obra” mantém a imagem da criação divina.
- source_word: יָדֶיךָ
  choice: das tuas mãos
  rationale: Mantém literalmente a imagem antropomórfica do hebraico, sem reduzi-la no texto principal a uma explicação abstrata.
- source_word: תִכְסֹף
  choice: ansiarias
  rationale: O verbo כסף expressa desejo intenso, anseio ou saudade. “Ansiarias” é natural, conciso e conserva a força afetiva do termo, enquanto o condicional mantém o cenário desejado por Jó.
theological_decisions:
- issue: Se o versículo deve expressar simples consideração de Deus pela criatura ou seu desejo intenso por ela
  choice: ansiarias pela obra das tuas mãos
  alternative: terias consideração pela obra das tuas mãos
  rationale: כסף indica mais naturalmente anseio ou desejo intenso, não mera atenção. A tradução conserva a tensão da esperança de Jó de que Deus voltaria a desejar sua criatura, sem transformar essa esperança em afirmação doutrinária já resolvida.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com a segunda pessoa singular do hebraico. A ordem poética e a imagem “obra das tuas mãos” foram preservadas; os condicionais comunicam o caráter esperado e hipotético do contexto.
