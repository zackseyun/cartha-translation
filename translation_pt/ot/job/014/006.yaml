review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o imperativo dirigido a Deus, o afastamento do olhar sobre o ser humano, a ideia contextual de alívio em וְיֶחְדָּל e a comparação com o trabalhador contratado. A forma verbal final deve explicitar que é o homem, e não o destinatário divino do imperativo, quem completa o seu dia.
  naturalness: «Desvia o teu olhar dele» é mais fluente na ordem normal do português do que «Desvia dele o teu olhar». «Até que ele complete» elimina uma possível ambiguidade de sujeito criada pelo infinitivo «até completar».
  terminology: «Trabalhador contratado» comunica com clareza o sentido de שָׂכִיר e mantém registro moderno e digno. «Completar o seu dia» é uma opção defensável para a leitura de realização/chegada ao termo de יִרְצֶה; a nota conserva a alternativa de satisfação.
  issues:
  - severity: low
    issue: Ordem menos natural em «Desvia dele o teu olhar».
    rationale: A construção não é incorreta, mas «Desvia o teu olhar dele» é mais idiomática e igualmente fiel ao afastamento expresso por מֵעָלָיו.
  - severity: medium
    issue: O infinitivo em «até completar o seu dia» deixa o sujeito sintaticamente menos nítido.
    rationale: Embora o contexto favoreça o homem como sujeito, a sequência após um imperativo dirigido a Deus pode momentaneamente permitir leitura imprecisa. O hebraico tem sujeito masculino singular referente ao homem; «até que ele complete» o preserva claramente.
  revised_text: Desvia o teu olhar dele[a], para que ele descanse, até que ele complete o seu dia, como um trabalhador contratado.
