  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: pt
  text: Desvia o teu olhar dele[a], para que ele descanse, até que ele complete o seu dia, como um trabalhador contratado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Desvia o teu olhar dele e deixa que ele cesse, até que, como um trabalhador contratado, desfrute o seu dia». O hebraico permite traduções que enfatizam tanto a cessação e o alívio quanto a satisfação de chegar ao fim do dia que lhe foi atribuído.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: Desvia ... o teu olhar
  rationale: O imperativo pede que Deus retire do ser humano seu olhar atento ou perscrutador. A formulação é natural em português e mantém a imagem do olhar.
- source_word: מֵעָלָיו
  choice: dele
  rationale: A combinação preposicional indica afastamento de sobre a pessoa; com «desvia ... o olhar», «dele» expressa isso de modo idiomático.
- source_word: וְיֶחְדָּל
  choice: para que ele descanse
  rationale: O verbo חָדַל significa basicamente «cessar» ou «parar». No contexto, aponta para uma pausa na aflição ou no escrutínio divino; «descanse» comunica essa ideia sem sugerir que a pessoa deixe de existir.
- source_word: עַד
  choice: até
  rationale: Marca o limite temporal do descanso solicitado.
- source_word: יִרְצֶה
  choice: completar
  rationale: רָצָה pode indicar prazer, satisfação ou aceitação. Na comparação com o trabalhador contratado, a expressão pode retratar tanto chegar ao fim do dia estipulado quanto ter satisfação nele. «Completar» se ajusta ao contexto, enquanto a nota preserva a alternativa.
- source_word: כְּשָׂכִיר
  choice: como um trabalhador contratado
  rationale: שָׂכִיר designa alguém contratado por salário. A expressão é clara, atual e preserva a realidade socioeconômica da imagem.
- source_word: יוֹמוֹ
  choice: o seu dia
  rationale: Tradução literal e natural. A comparação com o trabalhador já deixa implícito que se trata do dia de trabalho ou do período que lhe foi atribuído.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome «teu» explicita naturalmente que Jó se dirige a Deus, sem inserir o nome divino. A construção preserva a imagem do trabalhador contratado e registra em nota a ambiguidade lexical dos verbos חָדַל e רָצָה.
