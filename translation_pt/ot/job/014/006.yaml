    text: 'Ou: «Desvia o teu olhar dele e deixa que ele cesse, até que, como um trabalhador contratado, desfrute o seu dia». O hebraico permite traduções que enfatizam tanto a cessação e o alívio quanto a satisfação de chegar ao fim do dia que lhe foi atribuído.'
    reason: lexical_alternative
