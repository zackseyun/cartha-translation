lexical_decisions:
- source_word: מֵ/רֵיחַ
  choice: Ao sentir o cheiro de
  rationale: Preserva a imagem poética de reação à simples proximidade da água; em português, a construção é mais natural do que uma reprodução rígida de 'desde o cheiro'.
- source_word: מַיִם
  choice: água
  rationale: Embora a forma hebraica seja morfologicamente plural, funciona normalmente como substantivo massivo; o singular é idiomático em português.
- source_word: יַפְרִחַ
  choice: brotará
  rationale: O hifil de פרח pode indicar brotar, germinar ou florescer. 'Brotará' combina com a renovação de uma árvore cortada sem adiantar a imagem até a floração.
- source_word: וְ/עָשָׂה
  choice: e produzirá
  rationale: עשה é amplo ('fazer, produzir'); no contexto botânico, 'produzirá' comunica naturalmente o surgimento de novo crescimento.
- source_word: קָצִיר
  choice: ramos
  rationale: Embora geralmente signifique 'colheita', neste contexto pode designar aquilo que a planta produz, entendido como brotos ou ramos. 'Ramos' torna a imagem botânica inteligível, enquanto a nota preserva a incerteza lexical.
- source_word: כְּמוֹ
  choice: como
  rationale: Equivalente comparativo direto e natural em português.
- source_word: נָטַע
  choice: uma planta
  rationale: O termo designa algo plantado. 'Uma planta' é conciso e evita acrescentar explicitamente 'árvore', embora esse seja o referente do contexto mais amplo.
