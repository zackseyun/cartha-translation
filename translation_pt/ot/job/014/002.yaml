base_translation:
  language: en
  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: pt
  text: Como uma flor, ele surge e murcha[a]; foge como a sombra e não permanece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «é cortado»; o verbo hebraico pode ser entendido como «murchar» ou «desvanecer-se», ou como «ser cortado», especialmente na imagem da flor.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Como a flor
  rationale: צִיץ designa uma flor ou um botão florido; «flor» é natural em português e preserva a imagem poética da fragilidade humana.
- source_word: יָצָא
  choice: brota
  rationale: Embora o verbo signifique literalmente «sair», junto de «flor» o português idiomático «brota» transmite seu aparecimento sem perder a imagem concreta.
- source_word: וַיִּמָּל
  choice: e murcha
  rationale: No contexto da flor, «murcha» expressa naturalmente a leitura de desvanecer-se; a possível leitura «é cortado» é preservada em nota.
- source_word: וַיִּבְרַח
  choice: foge
  rationale: Mantém a força vívida do verbo ברח, em vez de reduzir a imagem a uma simples passagem do tempo.
- source_word: כַּצֵּל
  choice: como a sombra
  rationale: Equivalente direto e natural que conserva a comparação com algo fugaz e inconsistente.
- source_word: וְלֹא יַעֲמוֹד
  choice: e não permanece
  rationale: עמד significa literalmente «ficar de pé», mas aqui indica continuidade ou duração; «não permanece» comunica esse sentido com clareza.
