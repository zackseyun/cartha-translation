source:
  edition: WLC
  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: pt
  text: Seus filhos são honrados[a], mas ele não fica sabendo; são rebaixados, mas ele não percebe o que lhes acontece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Seus filhos alcançam honra».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: são honrados
  rationale: O qal de כבד, com «seus filhos» como sujeito, exprime que eles se tornam importantes ou alcançam honra. «São honrados» é natural em português e preserva a oposição com «são rebaixados».
- source_word: בָנָיו
  choice: seus filhos
  rationale: O substantivo hebraico está no masculino plural com sufixo de terceira pessoa masculina singular; «seus filhos» mantém essa especificidade.
- source_word: וְלֹא יֵדָע
  choice: mas ele não fica sabendo
  rationale: ידע significa «saber». «Não fica sabendo» comunica naturalmente que o homem permanece alheio à mudança na situação dos filhos; «mas» explicita o contraste contextual permitido pela conjunção hebraica.
- source_word: וְיִצְעֲרוּ
  choice: são rebaixados
  rationale: צער aqui indica tornar-se pequeno, insignificante ou de condição inferior, em contraste com ser honrado. «São rebaixados» preserva esse paralelismo antitético sem especificar a causa.
- source_word: וְלֹא יָבִין
  choice: mas ele não percebe
  rationale: בין pode significar entender, discernir ou perceber. «Percebe» se ajusta ao contexto da falta de consciência do morto quanto à condição dos filhos.
- source_word: לָמוֹ
  choice: o que lhes acontece
  rationale: A forma pronominal retoma os filhos e marca relação com eles. A expressão portuguesa torna essa referência clara sem escolher rigidamente entre os valores possíveis «quanto a eles», «a respeito deles» ou «por eles».
theological_decisions:
- issue: Conhecimento dos mortos sobre os acontecimentos de seus descendentes
  choice: Manter a afirmação poética de que o homem não sabe nem percebe as mudanças na condição dos filhos.
  alternative: Transformar o verso numa declaração doutrinária abrangente sobre o estado dos mortos.
  rationale: O contexto apresenta a perspectiva da lamentação de Jó. A tradução não deve ampliar a observação poética para além do que o verso afirma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre honra e rebaixamento foi mantido, assim como a diferença entre «saber» (ידע) e «perceber» (בין).
