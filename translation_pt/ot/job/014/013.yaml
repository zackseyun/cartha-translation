  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: pt
  text: Quem dera que me escondesses no Sheol[a], que me mantivesses oculto até que a tua ira se afastasse, que fixasses para mim um prazo[b] e te lembrasses de mim!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sepultura” ou “no mundo dos mortos”. Em hebraico, Sheol.
    reason: lexical_alternative
  - marker: b
    text: Ou “um limite” ou “algo determinado”. O substantivo hebraico pode indicar algo fixado, prescrito ou delimitado.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera que
  rationale: A expressão idiomática introduz um desejo intenso, não uma pergunta literal; esta formulação conserva a força optativa em português natural.
- source_word: בִּשְׁאוֹל
  choice: no Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem reduzi-lo à sepultura nem identificá-lo com concepções posteriores de inferno.
- source_word: תַּצְפִּנֵנִי
  choice: me escondesses
  rationale: O verbo expressa esconder ou guardar fora da vista e inicia o paralelismo poético.
- source_word: תַּסְתִּירֵנִי
  choice: me mantivesses oculto
  rationale: Conserva a intensificação paralela sem repetir exatamente o primeiro verbo.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: até que a tua ira se afastasse
  rationale: Comunica de modo natural a ideia de a ira divina recuar ou desviar-se, preservando o sentido do hebraico.
- source_word: תָּשִׁית לִי חֹק
  choice: fixasses para mim um prazo
  rationale: חֹק denota algo fixado ou prescrito; no contexto, “prazo” preserva a noção de um período ou termo determinado sem tornar explícito mais do que o texto permite.
- source_word: וְתִזְכְּרֵנִי
  choice: e te lembrasses de mim
  rationale: Tradução direta e relacional da lembrança divina pedida por Jó.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: A transliteração mantém a amplitude e a tensão do conceito hebraico, evitando tanto reduzi-lo ao túmulo físico quanto importar uma doutrina posterior de inferno.
- issue: Referência de חֹק
  choice: um prazo
  alternative: um limite; um decreto; um tempo determinado
  rationale: O contexto favorece algo temporalmente fixado, mas o substantivo também pode indicar algo prescrito ou delimitado; a nota registra essa amplitude.
translation_notes:
  register: Português moderno, digno e poeticamente natural, com formas de segunda pessoa singular coerentes com a fala dirigida a Deus. “Quem dera” comunica o lamento intenso; “Sheol” preserva o termo culturalmente específico, esclarecido em nota.
