  text: תִּתְקְפֵ֣/הוּ לָ֭/נֶצַח וַֽ/יַּהֲלֹ֑ךְ מְשַׁנֶּ֥ה פָ֝נָ֗י/ו וַֽ/תְּשַׁלְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: pt
  text: Tu o dominas para sempre, e ele se vai[a]; mudas o seu rosto[b] e o mandas embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vai embora” ou “parte”. O verbo hebraico significa literalmente “vai” e, neste contexto, pode referir-se à partida da vida ou da cena humana.
    reason: lexical_alternative
  - marker: b
    text: Ou “aparência”. Em hebraico, “rosto” também pode designar a aparência exterior ou a fisionomia.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: Tu o dominas
  rationale: O hifil de תקף expressa ser forte contra alguém, prevalecer sobre ele ou dominá-lo. “Tu o dominas” conserva a ação divina direta e a força poética sem soar artificial.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: נֶצַח indica duração contínua ou permanente; no contexto, ressalta o caráter definitivo da vitória sobre o ser humano mortal.
- source_word: וַיַּהֲלֹךְ
  choice: e ele se vai
  rationale: הלך significa literalmente “ir”. “Ele se vai” é natural em português e preserva a possibilidade de uma partida da vida ou da cena humana sem explicitar além do hebraico que se trata da morte.
- source_word: מְשַׁנֶּה
  choice: mudas
  rationale: O particípio de שנה, “mudar”, funciona aqui em sequência predicativa na interpelação direta a Deus. “Mudas” reproduz essa continuidade verbal de modo natural.
- source_word: פָנָיו
  choice: o seu rosto
  rationale: פנים significa literalmente “rosto”, embora também possa designar a aparência ou fisionomia. A tradução principal mantém a imagem concreta hebraica.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: e o mandas embora
  rationale: O piel de שלח pode significar mandar embora, despedir ou expulsar. “Mandas embora” conserva a amplitude da expressão sem impor a ideia mais forte de expulsão.
theological_decisions:
- issue: A partida do ser humano
  choice: se vai
  alternative: morre / falece
  rationale: O contexto trata da mortalidade, mas o verbo hebraico é simplesmente “ir”. A tradução preserva a alusão à morte sem convertê-la numa afirmação lexicalmente mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” para refletir a segunda pessoa singular dirigida diretamente a Deus. A formulação mantém o paralelismo poético e evita explicitar a morte onde o hebraico usa o verbo amplo “ir”.
