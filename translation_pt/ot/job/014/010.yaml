  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: pt
  text: Mas o homem morre e perde as forças[a]; o ser humano expira, e onde está ele?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fica sem forças» ou «torna-se fraco».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega em paralelo גֶּבֶר (aqui, «homem») e אָדָם (aqui, «ser humano»), ressaltando a mortalidade humana.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: o homem
  rationale: Mantém o singular masculino e a referência ao indivíduo, sem acrescentar ao termo a ideia específica de guerreiro ou homem forte.
- source_word: יָמוּת
  choice: morre
  rationale: O presente expressa naturalmente, em português, a verdade geral ou proverbial indicada pelo imperfeito hebraico neste contexto poético.
- source_word: וַיֶּחֱלָשׁ
  choice: perde as forças
  rationale: Reproduz o sentido de tornar-se fraco ou impotente e soa natural após «morre», sem sugerir apenas uma enfermidade passageira.
- source_word: וַיִּגְוַע
  choice: expira
  rationale: Verbo conciso e digno para o ato de morrer, preservando a distinção poética em relação a «morre».
- source_word: אָדָם
  choice: o ser humano
  rationale: Conserva o sentido humano genérico e permite que o paralelismo lexical com גֶּבֶר permaneça perceptível em português.
- source_word: וְאַיּוֹ
  choice: e onde está?
  rationale: Traduz diretamente a conjunção e a pergunta hebraica; em português, o referente humano já está claro, dispensando o pronome.
theological_decisions:
- issue: A pergunta sobre o estado da pessoa após a morte
  choice: e onde está?
  alternative: e já não existe
  rationale: A tradução preserva a pergunta e sua tensão poética, sem transformá-la numa afirmação doutrinária sobre inexistência ou sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. «Perde as forças» comunica com clareza o enfraquecimento de חלש, e o travessão dá à pergunta final o impacto retórico do hebraico.
