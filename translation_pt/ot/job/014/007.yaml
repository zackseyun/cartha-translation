  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: pt
  text: 'Pois há esperança para uma árvore: se for cortada, brotará de novo[a], e seu renovo[b] não cessará.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se renovará”. O verbo hebraico pode expressar renovação; no contexto de uma árvore, o texto principal traduz concretamente a imagem como novo brotar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu broto tenro” ou “seu broto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando a força causal do hebraico.
- source_word: יֵשׁ
  choice: há
  rationale: Equivalente português natural da construção existencial hebraica.
- source_word: לָעֵץ
  choice: para uma árvore
  rationale: O singular tem sentido genérico; o artigo indefinido comunica que se trata de qualquer árvore, não de uma árvore específica.
- source_word: תִּקְוָה
  choice: esperança
  rationale: Expressa aqui a possibilidade de vida renovada depois do corte.
- source_word: אִם יִכָּרֵת
  choice: se for cortada
  rationale: Mantém diretamente a forma condicional e a voz passiva do hebraico.
- source_word: וְעוֹד יַחֲלִיף
  choice: brotará de novo
  rationale: No contexto de uma árvore cortada, o verbo indica renovação mediante novo crescimento; a formulação concreta reproduz naturalmente a imagem botânica.
- source_word: וְיֹנַקְתּוֹ
  choice: e seu renovo
  rationale: O substantivo designa um broto tenro que nasce da árvore; “renovo” é claro, digno e adequado ao paralelismo poético.
- source_word: לֹא תֶחְדָּל
  choice: não deixará de crescer
  rationale: O verbo significa literalmente “não cessará”; “de crescer” explicita com naturalidade a ação implícita no contexto do renovo, sem alterar a imagem.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A formulação preserva o tom proverbial e poético, mantendo a condição expressa por “se” e tornando explícito apenas o crescimento já implícito na frase final.
