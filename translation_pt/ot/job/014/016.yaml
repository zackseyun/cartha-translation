base_translation:
  language: en
  yaml_path: translation/ot/job/014/016.yaml
  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: pt
  text: Pois agora contas os meus passos[a]; não vigias o meu pecado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «numeras os meus passos».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não observas atentamente o meu pecado»; também é possível: «não ficas à espreita do meu pecado».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a força explicativa do conectivo no contexto, em português natural e digno.
- source_word: עַתָּה
  choice: agora
  rationale: Preserva o valor temporal e o contraste entre a situação presente de Jó e a alternativa pela qual ele anseia.
- source_word: צְעָדַי
  choice: os meus passos
  rationale: Reproduz diretamente a imagem concreta dos passos de Jó.
- source_word: תִּסְפּוֹר
  choice: contas
  rationale: O Qal de ספר significa normalmente contar ou numerar; «contas» é claro e corrente.
- source_word: לֹא
  choice: não
  rationale: Expressa diretamente a negação hebraica.
- source_word: תִשְׁמוֹר עַל
  choice: vigias
  rationale: Comunica a ideia de observar atentamente ou manter sob vigilância, sem especificar além do que permite o hebraico.
- source_word: חַטָּאתִי
  choice: o meu pecado
  rationale: Conserva o singular hebraico, que aqui pode ter sentido coletivo ou abstrato.
theological_decisions:
- issue: Sentido da oração negativa לֹא תִשְׁמוֹר עַל חַטָּאתִי no contexto
  choice: «não vigias o meu pecado» como declaração presente
  alternative: «não vigiarias o meu pecado» como parte de uma situação hipotética; ou «não ficas à espreita do meu pecado»
  rationale: A forma hebraica é um imperfeito simples negado e, tomada por si, admite naturalmente uma declaração presente. A tradução conserva a tensão com os versículos próximos, sem harmonizá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é concisa e digna; mantém o paralelismo, o singular «pecado» e a ambiguidade contextual da segunda oração.
