base_translation:
  language: en
  yaml_path: translation/ot/job/014/018.yaml
  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: pt
  text: Mas até um monte, ao cair, se desfaz[a], e uma rocha é deslocada do seu lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «murcha» ou «definha»; o verbo geralmente descreve algo que perde o vigor, mas aqui é usado poeticamente a respeito de um monte.
    reason: lexical_alternative
  - marker: b
    text: Ou «é removida do seu lugar».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas até
  rationale: Expressa a transição adversativa enfática e introduz a imagem de algo aparentemente permanente que também perece.
- source_word: הַר נוֹפֵל
  choice: um monte, ao cair
  rationale: O substantivo é genérico, e o particípio נוֹפֵל pode ter valor circunstancial; a formulação portuguesa conserva a imagem dinâmica sem sugerir apenas um estado já concluído.
- source_word: יִבּוֹל
  choice: se desfaz
  rationale: O verbo costuma significar murchar ou definhar, mas, aplicado metaforicamente a um monte, indica deterioração e desaparecimento; «se desfaz» soa natural e preserva essa extensão poética.
- source_word: וְצוּר
  choice: e uma rocha
  rationale: «Rocha» é a equivalência ampla e natural de צוּר neste paralelismo com «monte».
- source_word: יֶעְתַּק
  choice: é deslocada
  rationale: Transmite o sentido de ser removida ou tirada de uma posição, sem especificar o agente.
- source_word: מִמְּקֹמוֹ
  choice: do seu lugar
  rationale: Reprodução direta e idiomática da imagem de algo fixo que é removido da própria posição.
