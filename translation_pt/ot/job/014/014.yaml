source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: pt
  text: Se um homem morrer, voltará a viver? Esperarei todos os dias do meu árduo serviço, até que venha a minha mudança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu alívio” ou “minha renovação”. O termo hebraico pode indicar mudança, substituição, alívio ou renovação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição retórica sem transformá-la numa afirmação temporal.
- source_word: גֶּבֶר
  choice: um homem
  rationale: Preserva o singular masculino do hebraico e, no contexto, apresenta o ser humano mortal.
- source_word: הֲיִחְיֶה
  choice: voltará a viver?
  rationale: A ideia de voltar não está lexicalmente expressa, mas é implicada pela pergunta sobre viver depois de morrer; esta formulação é clara e natural em português.
- source_word: כָּל יְמֵי צְבָאִי
  choice: todos os dias do meu árduo serviço
  rationale: צָבָא pode indicar serviço, campanha ou período designado. A expressão comunica tanto a duração como o caráter penoso da experiência de Jó, sem impor uma imagem estritamente militar.
- source_word: אֲיַחֵל
  choice: Esperarei
  rationale: O verbo pode significar esperar ou ter esperança. Aqui, a construção com “até que” destaca a espera perseverante, sem excluir a esperança.
- source_word: חֲלִיפָתִי
  choice: minha mudança
  rationale: É a opção mais aberta para um termo que pode designar mudança, substituição, alívio ou renovação; evita definir a natureza do acontecimento além do que o hebraico permite.
theological_decisions:
- issue: Se o versículo afirma claramente a ressurreição ou expressa uma esperança ainda aberta e tensa.
  choice: Manter a pergunta “voltará a viver?” e traduzir חֲלִיפָתִי por “minha mudança”.
  alternative: Traduzir o termo como “minha renovação”, “meu alívio” ou, de modo mais explícito, “minha ressurreição”.
  rationale: Jó formula uma pergunta e imagina uma mudança futura, mas não apresenta aqui uma declaração doutrinária inequívoca. A tradução preserva a possibilidade de renovação após a morte sem convertê-la numa afirmação dogmática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência natural. O marcador foi colocado junto de “mudança”, termo ao qual a nota lexical se refere.
