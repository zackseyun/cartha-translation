base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: pt
  text: O ser humano[a], nascido de mulher, tem poucos dias e é cheio de inquietação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o homem”, em sentido genérico, referindo-se à condição humana.'
    reason: lexical_alternative
  - marker: b
    text: Ou “perturbação”, “agitação” ou “aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: O ser humano
  rationale: O substantivo singular apresenta uma afirmação representativa sobre a condição humana. “O ser humano” preserva o singular genérico em português atual sem restringir a referência ao sexo masculino.
- source_word: יְלוּד אִשָּׁה
  choice: nascido de mulher
  rationale: Reproduz com naturalidade a construção participial hebraica e conserva sua expressão concreta da origem e fragilidade humanas.
- source_word: קְצַר יָמִים
  choice: tem poucos dias
  rationale: Mantém a imagem hebraica dos “dias” escassos, indicando a brevidade da vida, e soa claro em português.
- source_word: וּשְׂבַע רֹגֶז
  choice: e é cheio de inquietação
  rationale: “Cheio” corresponde à ideia de estar saciado ou repleto, enquanto “inquietação” comunica uma existência perturbada sem limitar o termo apenas a sofrimento exterior.
- source_word: רֹגֶז
  choice: inquietação
  rationale: O termo pode abranger agitação, perturbação e aflição. “Inquietação” preserva essa amplitude no contexto do lamento de Jó.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: O ser humano
  alternative: O homem
  rationale: O versículo descreve a condição de toda pessoa por meio de um singular representativo. A opção escolhida mantém essa referência universal sem transformar a expressão em um coletivo abstrato nem sugerir exclusividade masculina.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. A formulação conserva as imagens concretas do hebraico — nascer de mulher, ter poucos dias e estar cheio de inquietação — sem recorrer a construções arcaicas.
