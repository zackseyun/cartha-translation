id: JOB.14.5
reference: Job 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: pt
  text: Já que os seus dias estão determinados[a], o número dos seus meses está contigo; estabeleceste o seu limite[b], e ele não pode ultrapassá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se os seus dias estão determinados”. A partícula hebraica pode introduzir uma condição, mas, neste contexto, provavelmente apresenta a base do apelo de Jó: “Já que os seus dias estão determinados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sua fronteira” ou “a sua determinação”. O termo hebraico pode indicar um limite fixo e prescrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Já que
  rationale: A partícula pode introduzir uma condição, mas, no contexto, provavelmente apresenta a base do apelo de Jó. “Já que” expressa de modo natural esse valor causal ou assumido.
- source_word: חֲרוּצִים
  choice: determinados
  rationale: O particípio passivo indica que os dias foram fixados ou decididos; “determinados” preserva essa força sem especificar além do texto como isso ocorre.
- source_word: יָמָיו
  choice: os seus dias
  rationale: Tradução direta da forma com sufixo masculino singular, referindo-se aos dias da vida humana.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: o número dos seus meses
  rationale: Mantém a expressão nominal hebraica de maneira clara e natural em português.
- source_word: אִתָּךְ
  choice: está contigo
  rationale: Preserva a formulação concreta do hebraico, que no contexto sugere que Deus conhece e detém o número dos meses, sem reduzir a expressão apenas a conhecimento ou controle.
- source_word: חֻקּוֹ
  choice: o seu limite
  rationale: O substantivo pode indicar uma determinação prescrita ou uma fronteira fixa; “limite” combina naturalmente com o verbo seguinte.
- source_word: עָשִׂיתָ
  choice: estabeleceste
  rationale: Embora o verbo tenha o sentido geral de “fazer”, com “limite” comunica adequadamente a ideia de fixar ou estabelecer.
- source_word: וְלֹא יַעֲבוֹר
  choice: e ele não pode ultrapassá-lo
  rationale: O sujeito é o ser humano, e o objeto implícito é o limite. A formulação exprime claramente que a pessoa não pode ir além da fronteira estabelecida.
theological_decisions:
- issue: Determinação divina da duração da vida humana
  choice: O texto apresenta os dias humanos como determinados por Deus, com um limite que a pessoa não pode ultrapassar.
  alternative: A frase poderia ser entendida mais fracamente como uma referência apenas ao conhecimento divino da duração da vida.
  rationale: A combinação de “determinados”, “está contigo” e “estabeleceste o seu limite” sustenta tanto o conhecimento quanto a ação soberana de Deus, sem transformar o versículo em uma formulação doutrinária mais ampla.
- issue: Valor da partícula inicial אִם
  choice: 'Valor causal ou assumido: “Já que”.'
  alternative: 'Valor condicional: “Se os seus dias estão determinados”.'
  rationale: O contexto favorece a leitura como fundamento do pedido de Jó, mas a nota preserva a ambiguidade gramatical real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular em “contigo” e “estabeleceste” mantém a fala direta de Jó a Deus e evita a ambiguidade referencial que “com você” poderia produzir. Os marcadores [a] e [b] aparecem no texto principal.
