base_translation:
  language: en
  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: pt
  text: O ouro e o vidro[a] não se igualam a ela, nem se pode trocá-la por um objeto de ouro refinado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cristal». O termo hebraico pode designar um material luxuoso transparente; «vidro» é o sentido lexical mais provável.
    reason: lexical_alternative
  - marker: b
    text: Ou «nem se pode dar em troca por ela um recipiente de ouro refinado».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: não se igualam a ela
  rationale: O verbo ערך pode indicar avaliar ou comparar. No contexto do valor incomparável da sabedoria, a expressão comunica que ouro e vidro não alcançam o valor dela; o sufixo feminino retoma a sabedoria.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto e natural do nome do metal precioso.
- source_word: זְכוֹכִית
  choice: vidro
  rationale: Provavelmente designa vidro, que no mundo antigo era um material raro e luxuoso. A alternativa tradicional «cristal» é preservada em nota.
- source_word: תְמוּרָתָהּ
  choice: nem se pode trocá-la por
  rationale: תמורה expressa troca ou substituição. A formulação verbal é natural em português e mantém a imagem comercial de algo dado em troca pela sabedoria.
- source_word: כְּלִי פָז
  choice: um objeto de ouro refinado
  rationale: כְּלִי é amplo e pode indicar objeto, utensílio ou recipiente; «objeto» evita restringir indevidamente o referente. פָז denota ouro de alta qualidade ou refinado.
