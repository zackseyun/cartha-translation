  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: pt
  text: Mas onde se pode encontrar a sabedoria[a]? E onde está o lugar do entendimento?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “De onde será encontrada a sabedoria?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Mas ... a sabedoria
  rationale: O artigo hebraico é naturalmente preservado em português. O וְ é traduzido como “Mas” para marcar a virada retórica entre a mineração descrita anteriormente e a busca pela sabedoria.
- source_word: מֵאַיִן
  choice: de onde
  rationale: Preserva a noção de origem ou fonte presente no hebraico, com formulação natural em português.
- source_word: תִּמָּצֵא
  choice: se pode encontrar
  rationale: O nifal imperfeito de מצא significa “ser encontrada”. A construção portuguesa exprime com naturalidade a força modal e retórica da pergunta, sem convertê-la numa simples previsão futura.
- source_word: וְאֵי זֶה
  choice: E onde fica
  rationale: אֵי é o interrogativo “onde”; זֶה integra a expressão idiomática. “Onde fica” produz uma pergunta natural sobre o lugar, sem traduzir זֶה de maneira artificial como “este”.
- source_word: מְקוֹם
  choice: o lugar
  rationale: Tradução direta e corrente de מְקוֹם, adequada ao paralelismo poético.
- source_word: בִּינָה
  choice: entendimento
  rationale: Mantém o vocabulário sapiencial e o paralelismo com “sabedoria”; “discernimento” e “compreensão” também seriam possíveis.
