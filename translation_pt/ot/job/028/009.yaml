  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: pt
  text: Ele estende a mão ao sílex[a]; revira montanhas pela raiz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra o sílex”, “na rocha dura” ou “sobre a rocha dura”. O hebraico pode descrever a mão aplicada à rocha dura no trabalho de mineração.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da raiz de montanhas”. O singular “raiz” pode ter sentido coletivo; “pela raiz” expressa em português que as montanhas são revolvidas a partir de sua base.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: na rocha de sílex
  rationale: חַלָּמִישׁ designa sílex ou rocha especialmente dura. Com שׁלח יד, a preposição בְּ indica o objeto sobre o qual se trabalha; “na rocha de sílex” preserva a imagem da mineração em pedra dura e soa natural em português.
- source_word: שָׁלַח יָדוֹ
  choice: põe a mão
  rationale: A expressão idiomática שׁלח יד descreve estender ou aplicar a mão a uma tarefa. “Põe a mão” comunica intervenção humana ativa sem reproduzir mecanicamente o sentido literal de “enviar”.
- source_word: הָפַךְ
  choice: revolve
  rationale: הפך pode significar virar, revirar ou revolver. No contexto de escavação, “revolve” expressa a alteração profunda das montanhas sem acrescentar uma ideia de destruição ausente do verbo.
- source_word: מִשֹּׁרֶשׁ
  choice: desde as raízes
  rationale: Embora שֹׁרֶשׁ esteja no singular, sua relação com o plural הָרִים permite sentido coletivo. O plural “raízes” é idiomático em português e indica que as montanhas são revolvidas desde sua base.
- source_word: הָרִים
  choice: montanhas
  rationale: הָרִים significa diretamente “montanhas”. A ausência de artigo em português mantém o caráter genérico e poético da afirmação.
