  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: pt
  text: Deus entende o caminho dela[a] e conhece o seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o caminho que leva até ela”. O hebraico também pode ser entendido nesse sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo no singular e o contexto indicam o único Deus.
- source_word: הֵבִין
  choice: entende
  rationale: O hifil de בין expressa compreensão ou discernimento. O presente comunica naturalmente a verdade geral e permanente afirmada no poema.
- source_word: דַּרְכָּהּ
  choice: o caminho dela
  rationale: O sufixo feminino retoma a sabedoria. 'Caminho' preserva a metáfora hebraica sem decidir se significa especificamente o caminho que leva até ela.
- source_word: וְהוּא
  choice: e
  rationale: A conjunção liga as duas afirmações. Em português, repetir explicitamente o pronome seria possível, mas desnecessário, pois a continuidade do sujeito é clara.
- source_word: יָדַע
  choice: conhece
  rationale: O verbo ידע denota conhecimento; o presente exprime adequadamente a verdade atemporal sobre Deus.
- source_word: אֶת מְקוֹמָהּ
  choice: o seu lugar
  rationale: מקום significa lugar ou localização. O possessivo retoma naturalmente a sabedoria no português corrente.
theological_decisions:
- issue: Referente dos sufixos femininos em 'seu caminho' e 'seu lugar'
  choice: Os sufixos retomam a sabedoria, expressa em português por 'dela' e 'seu'.
  alternative: 'Traduzir de modo menos personificado: ''o caminho até ela ... onde ela está''.'
  rationale: O contexto imediato trata da sabedoria, substantivo feminino tanto em hebraico quanto em português. A formulação mantém essa referência sem afirmar que a personificação seja uma pessoa distinta.
- issue: Sentido de 'caminho'
  choice: Preservar a metáfora aberta como 'o caminho dela'.
  alternative: Interpretar como 'o caminho que leva até ela'.
  rationale: O hebraico permite discussão sobre se מדובר do caminho próprio da sabedoria ou do acesso a ela. A tradução principal evita resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. A referência feminina é natural porque 'sabedoria' é feminino em português. Evitou-se a repetição enfática de 'ele' por soar menos fluida, sem alterar o referente divino.
