  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: pt
  text: Ele abre canais através das rochas[a], e seu olho vê tudo o que é precioso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cursos de água” ou “canais de água”; o termo hebraico costuma designar cursos de água, mas, neste contexto de mineração, provavelmente se refere a canais ou passagens abertos na rocha.
    reason: lexical_alternative
  - marker: b
    text: Ou “tudo o que é valioso” ou “todo minério precioso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: através das rochas
  rationale: צוּר designa rocha ou penhasco, especialmente rocha dura. Com o verbo בִּקֵּעַ, a preposição בְּ indica aqui o meio rochoso pelo qual se abrem passagens; “através das rochas” é natural em português e condiz com o contexto de mineração.
- source_word: יְאֹרִים
  choice: canais
  rationale: יְאֹרִים pode designar cursos de água, rios ou canais. No contexto da mineração, “canais” preserva a imagem de passagens abertas na rocha sem especificar de modo excessivo que sejam poços ou galerias.
- source_word: בִּקֵּעַ
  choice: abre
  rationale: בקע significa fender, rachar ou abrir. “Abre canais” expressa com clareza a ação de escavar passagens na rocha e mantém a força da imagem hebraica.
- source_word: יְקָר
  choice: tudo o que é precioso
  rationale: יְקָר denota aquilo que é precioso, valioso ou raro. A expressão não limita o referente a minério ou pedras preciosas, preservando a amplitude do hebraico.
- source_word: רָאֲתָה עֵינוֹ
  choice: seus olhos veem
  rationale: O hebraico diz literalmente “seu olho viu”. O presente combina com a descrição poética do trabalho do mineiro; o plural idiomático em português mantém a imagem concreta da visão sem soar artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva a imagem poética da mineração e evita restringir יְקָר a um tipo específico de material.
