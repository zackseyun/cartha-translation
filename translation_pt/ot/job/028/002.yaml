base_translation:
  language: en
  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: pt
  text: O ferro é tirado do pó, e da pedra se funde o cobre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bronze”. O termo hebraico pode designar cobre ou bronze; “cobre” é preferível aqui porque o contexto trata da extração de metal da pedra que contém minério.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: ferro
  rationale: É o sentido comum do substantivo hebraico e o equivalente direto e natural em português.
- source_word: מֵעָפָר
  choice: do pó
  rationale: עָפָר pode indicar pó, terra solta ou solo. “Pó” preserva a imagem concreta e poética do hebraico sem impedir que o contexto indique extração do solo.
- source_word: יֻקָּח
  choice: é tirado
  rationale: O passivo de לקח significa literalmente “é tomado/tirado”. A formulação mantém a expressão hebraica, enquanto o contexto de mineração esclarece o processo.
- source_word: וְאֶבֶן
  choice: e da pedra
  rationale: 'אֶבֶן significa “pedra”. A preposição “de” explicita em português a relação de origem indicada pelo sentido da oração: o metal é obtido da pedra que contém minério.'
- source_word: יָצוּק
  choice: se funde
  rationale: יצק pode significar derramar, moldar ou fundir. No contexto de metais extraídos da rocha, “se funde” comunica o processamento do minério sem recorrer ao menos corrente “se acendra”.
- source_word: נְחוּשָׁה
  choice: cobre
  rationale: O termo pode designar cobre ou bronze. “Cobre” é preferível neste contexto de extração mineral, pois o cobre provém do minério, ao passo que o bronze é uma liga produzida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com paralelismo conciso. “É tirado” preserva a forma passiva e concreta do hebraico; “se funde” oferece uma expressão natural para o processo metalúrgico. O marcador foi colocado após “cobre”, termo ao qual a variante lexical se refere.
