  source_fidelity: A tradução preserva corretamente o sujeito feminino retomado do contexto («a sabedoria»), o alcance de «todo ser vivo», a imagem de «olhos» e o paralelismo dos dois passivos. Contudo, «encoberta das aves» não comunica de modo suficientemente claro em português a relação de privação expressa por מִן; pode sugerir que as aves a cobrem.
