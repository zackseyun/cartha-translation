  text: וְֽ֭/נֶעֶלְמָה מֵ/עֵינֵ֣י כָל חָ֑י וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם נִסְתָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: pt
  text: Ela está oculta aos olhos de todo ser vivo e escondida das aves dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «das aves do céu». O hebraico diz literalmente «das aves dos céus».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Ela está oculta
  rationale: O nifal perfeito, no feminino singular, retoma a sabedoria do contexto. O pronome feminino explicita essa referência natural em português, e «está oculta» preserva o sentido passivo e resultativo.
- source_word: מֵעֵינֵי
  choice: aos olhos de
  rationale: Equivalente idiomático e natural da construção hebraica com מן + עיניים, conservando a imagem dos olhos sem sugerir apenas opinião ou entendimento.
- source_word: כָל חָי
  choice: todo ser vivo
  rationale: Mantém o alcance universal da expressão hebraica e soa natural em português, sem restringi-la aos seres humanos.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: e das aves dos céus
  rationale: «Aves» expressa naturalmente עוֹף neste contexto. «Dos céus» reproduz de perto o plural hebraico e mantém o registro poético; «do céu» é alternativa corrente.
- source_word: נִסְתָּרָה
  choice: encoberta
  rationale: O nifal perfeito feminino mantém o paralelismo com «está oculta». «Encoberta» evita repetição mecânica e preserva o sentido de algo escondido da percepção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A estrutura paralela e a imagem hebraica dos olhos foram preservadas; o feminino de «ela» retoma a sabedoria mencionada no contexto.
