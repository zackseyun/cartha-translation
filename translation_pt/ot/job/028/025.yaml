  language: pt
  text: 'quando deu peso ao vento[a]

    e regulou as águas por medida,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando estabeleceu um peso para o vento”. Em outros contextos, a palavra traduzida como “vento” também pode significar “espírito” ou “sopro”; aqui, o paralelo com “as águas” favorece “vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: quando deu
  rationale: O infinitivo construto com לְ dá continuidade temporal à ação divina descrita no contexto. Em português, “quando deu” expressa naturalmente essa relação e combina bem com “peso”.
- source_word: לָרוּחַ
  choice: ao vento
  rationale: Embora רוּחַ também possa significar “espírito” ou “sopro”, o paralelismo com “as águas” e o contexto da ordem criada favorecem o sentido meteorológico.
- source_word: מִשְׁקָל
  choice: peso
  rationale: O substantivo denota peso ou pesagem. “Deu peso ao vento” preserva a imagem poética de Deus atribuindo ao vento sua medida própria.
- source_word: וּמַיִם
  choice: as águas
  rationale: A forma hebraica é plural e “as águas” preserva tanto essa forma quanto o paralelismo poético.
- source_word: תִּכֵּן
  choice: mediu
  rationale: O verbo comunica medir, pesar ou determinar precisamente; “mediu” mantém a imagem de ordenação quantitativa em paralelo com “peso”.
- source_word: בְּמִדָּה
  choice: com precisão
  rationale: A expressão indica medida, proporção ou padrão determinado. “Com precisão” evita a redundância pouco natural de “mediu com medida”, sem perder a ideia de determinação exata.
theological_decisions:
- issue: Continuidade do sujeito em relação ao versículo anterior
  choice: Sujeito divino implícito em “deu” e “mediu”
  alternative: Explicitar “ele” ou “Deus”
  rationale: O sujeito continua sendo Deus no contexto. O português permite omiti-lo naturalmente, preservando a coesão sem acrescentar um nome ausente nesta oração hebraica.
translation_notes:
  register: Português moderno, poético e acessível, com leitura natural no Brasil e compreensão internacional. A divisão em dois versos preserva o paralelismo hebraico; a vírgula final mantém a continuidade sintática indicada pelo texto de consulta.
