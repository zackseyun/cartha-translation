  text: לֹֽא תְ֭סֻלֶּה בְּ/כֶ֣תֶם אוֹפִ֑יר בְּ/שֹׁ֖הַם יָקָ֣ר וְ/סַפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: pt
  text: Não pode ser avaliada pelo ouro de Ofir, pelo ônix precioso[a] e pela safira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “berilo”; não se sabe ao certo qual pedra preciosa é indicada pelo termo hebraico.
    reason: lexical_alternative
  - marker: b
    text: Possivelmente “lápis-lazúli”, conforme a classificação antiga dos minerais, e não a moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: ser avaliada
  rationale: O Pual de סלל, neste contexto de valor e materiais preciosos, expressa avaliação ou estimativa de preço. “Ser avaliada” comunica naturalmente que a sabedoria não pode ter seu valor determinado por essas riquezas.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: pelo ouro de Ofir
  rationale: כֶּתֶם designa ouro refinado ou fino, e Ofir indica sua procedência famosa. “Pelo ouro de Ofir” exprime em português o padrão ou meio de avaliação introduzido pela preposição בְּ.
- source_word: שֹׁהַם יָקָר
  choice: ônix precioso
  rationale: A identificação exata de שֹׁהַם é incerta; “ônix” conserva a tradução tradicional e reconhecível. יָקָר ressalta seu grande valor e é traduzido naturalmente por “precioso”.
- source_word: סַפִּיר
  choice: safira
  rationale: “Safira” preserva a designação tradicional, embora a classificação mineral antiga talvez corresponda ao lápis-lazúli; essa incerteza é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético natural. A construção com “nem... ou...” mantém a enumeração de bens incapazes de servir como medida do valor da sabedoria; as notas preservam a incerteza na identificação das pedras.
