base_translation:
  language: en
  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: pt
  text: Coral e cristal nem merecem ser mencionados; o preço da sabedoria é maior que o das pérolas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאמוֹת
  choice: coral
  rationale: O plural designa provavelmente corais ou material precioso semelhante; “coral” é a identificação tradicional e se ajusta à lista de objetos valiosos.
- source_word: גָבִישׁ
  choice: cristal
  rationale: O termo raro é geralmente entendido como cristal, possivelmente cristal de rocha.
- source_word: לֹא יִזָּכֵר
  choice: nem merecem ser mencionados
  rationale: A expressão idiomática indica que esses bens não entram em consideração na comparação com a sabedoria, não mera ausência de menção.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: o preço da sabedoria
  rationale: מֶשֶׁךְ é raro e pode envolver aquisição, valor ou preço. No contexto comercial do poema, “preço” comunica naturalmente o valor necessário para obter a sabedoria, sem sugerir que ela possa de fato ser comprada.
- source_word: פְּנִינִים
  choice: pérolas
  rationale: A identificação exata é incerta; pode referir-se a pérolas, corais ou outras pedras preciosas. “Pérolas” preserva a tradução tradicional e evita repetir “coral” na mesma linha.
theological_decisions:
- issue: A possibilidade de adquirir a sabedoria
  choice: o preço da sabedoria
  alternative: a aquisição da sabedoria
  rationale: O contexto enfatiza o valor incomparável e a impossibilidade de comprar a sabedoria. “Preço” mantém a linguagem econômica do capítulo sem afirmar que uma transação seja possível.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. O comparativo “maior que o das pérolas” explicita de modo natural que se compara o preço da sabedoria ao preço das pérolas.
