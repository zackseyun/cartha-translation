base_translation:
  language: en
  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: pt
  text: Mas a sabedoria — de onde vem? E onde está o lugar do entendimento?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “De onde vem a sabedoria, e onde está o lugar do entendimento?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Mas a sabedoria
  rationale: חָכְמָה significa “sabedoria”. Embora וְ possa ser simplesmente “e”, aqui introduz a retomada contrastiva da pergunta central; “mas” expressa essa função com naturalidade em português.
- source_word: מֵאַיִן
  choice: de onde
  rationale: 'A preposição מִן com o interrogativo אַיִן pergunta pela origem ou procedência: “de onde”.'
- source_word: תָּבוֹא
  choice: vem
  rationale: O imperfeito qal feminino singular de בוא, tendo “sabedoria” como sujeito, exprime aqui uma pergunta geral sobre sua procedência; o presente “vem” é natural e preserva o sentido.
- source_word: וְאֵי זֶה
  choice: E onde fica
  rationale: A expressão é locativa, “e onde?”. Diante de “lugar”, “onde fica” produz uma pergunta idiomática em português sem alterar seu conteúdo.
- source_word: מְקוֹם
  choice: o lugar
  rationale: מָקוֹם denota “lugar”. A formulação mantém a imagem espacial deliberada do hebraico.
- source_word: בִּינָה
  choice: entendimento
  rationale: בִּינָה designa entendimento, compreensão ou discernimento. “Entendimento” preserva a distinção lexical em relação a “sabedoria” sem estreitar o sentido.
theological_decisions: []
