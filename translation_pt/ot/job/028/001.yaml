  text: De fato, há uma mina de prata[a] e um lugar onde se refina o ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma fonte de prata”. O termo hebraico pode indicar fonte ou lugar de origem; “mina” foi adotado porque o contexto trata da mineração e da extração de metais.'
