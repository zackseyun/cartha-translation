lexical_decisions:
- source_word: כִּי
  choice: De fato
  rationale: Aqui a partícula introduz enfaticamente a reflexão poética; “De fato” expressa essa força sem impor uma relação causal.
- source_word: יֵשׁ
  choice: há
  rationale: Equivalente português natural da partícula existencial.
- source_word: לַכֶּסֶף מוֹצָא
  choice: há uma mina para a prata
  rationale: מוֹצָא designa literalmente uma saída, origem ou fonte; no contexto da extração mineral, “mina” comunica adequadamente o referente concreto, enquanto a nota preserva a amplitude lexical.
- source_word: וּמָקוֹם לַזָּהָב
  choice: e um lugar ... o ouro
  rationale: Mantém a ideia de um lugar relacionado ao ouro, em construção portuguesa natural com a oração verbal seguinte.
- source_word: יָזֹקּוּ
  choice: onde se refina
  rationale: O verbo pode indicar refinar, fundir ou depurar metal. A construção impessoal com “se” representa naturalmente o sujeito humano indefinido do plural hebraico.
