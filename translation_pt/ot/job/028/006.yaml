  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: pt
  text: Suas pedras são uma jazida de safira[a], e nesse lugar há pó de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “lápis-lazúli”; não se sabe ao certo qual gema antiga o termo hebraico designava.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: jazida
  rationale: Embora o sentido básico seja “lugar”, no contexto poético de mineração a expressão indica um lugar onde a pedra preciosa é encontrada. “Jazida” comunica isso com naturalidade em português, sem explicitar além do contexto.
- source_word: סַפִּיר
  choice: safira
  rationale: É a tradução tradicional e mais reconhecível, embora a identificação exata da gema antiga seja incerta; a alternativa “lápis-lazúli” é preservada em nota.
- source_word: אֲבָנֶיהָ
  choice: suas pedras
  rationale: Mantém o plural e o sufixo possessivo feminino singular, cujo referente no contexto é a terra.
- source_word: וְעַפְרֹת
  choice: e ... pó
  rationale: Preserva a imagem concreta de terra ou matéria pulverizada associada ao ouro, evitando a interpretação mais específica “minério”.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto e corrente do nome do metal precioso.
- source_word: לוֹ
  choice: nela há
  rationale: A construção hebraica é literalmente possessiva (“para ela”), mas “nela há” expressa de modo natural em português o conteúdo ou a presença do pó de ouro e concorda com o referente feminino “terra”.
theological_decisions: []
