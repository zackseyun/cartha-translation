  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: pt
  text: Então ele a viu e a declarou[a]; estabeleceu-a e também a sondou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a contou”, “a enumerou”, “a relatou” ou “a expôs”. O verbo hebraico pode ter os sentidos de contar ou enumerar, bem como de relatar ou declarar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal do poema de modo natural e direto em português.
- source_word: רָאָהּ
  choice: ele a viu
  rationale: Preserva o sentido concreto de ראה e o sufixo feminino, cujo referente imediato é a sabedoria.
- source_word: וַיְסַפְּרָהּ
  choice: e a declarou
  rationale: ספר pode envolver contar, enumerar, relatar ou declarar. “Declarou” conserva, no contexto, a ideia de expressar ou expor a sabedoria sem eliminar a amplitude lexical, registrada na nota.
- source_word: הֱכִינָהּ
  choice: estabeleceu-a
  rationale: O hifil de כון comunica estabelecer, firmar ou pôr em ordem; “estabeleceu-a” mantém essa força de modo conciso e digno.
- source_word: וְגַם
  choice: e também
  rationale: Reproduz a força cumulativa da expressão hebraica.
- source_word: חֲקָרָהּ
  choice: a sondou
  rationale: חקר indica investigar ou perscrutar profundamente. “Sondou” expressa essa ideia com concisão poética.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Todos são vertidos como pronomes femininos referentes à sabedoria no contexto imediato.
  alternative: Entendê-los de modo mais abstrato como referência à medida ou à ordenação da sabedoria.
  rationale: A sabedoria é o antecedente feminino imediato e funciona como objeto de todos os verbos. O português permite preservar explicitamente esse referente por meio de “a”.
- issue: A sondagem divina da sabedoria
  choice: Manter a afirmação poética de que Deus “a sondou”.
  alternative: Parafrasear como Deus conhecendo-a plenamente ou determinando-a.
  rationale: A tradução conserva a linguagem e a tensão poética do hebraico, sem explicar como Deus pode sondar a sabedoria nem impor uma formulação doutrinária externa.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo conciso. As construções pronominais preservam o referente feminino, a sabedoria. “Sondou” mantém a intensidade investigativa e o tom poético do original.
