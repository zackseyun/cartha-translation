source:
  edition: WLC
  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: pt
  text: O ouro refinado não pode ser dado em troca dela[a][c], nem se pode pesar prata para pagar o seu preço.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro puro” em vez de “ouro refinado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, não se pode pesar prata suficiente para pagar por ela; no contexto, o versículo ressalta o valor incalculável da sabedoria.
    reason: cultural_note
  - marker: c
    text: A construção já foi traduzida como “Ela não pode ser dada em troca de ouro refinado”, mas a sintaxe hebraica favorece “o ouro refinado” como sujeito do verbo.
    reason: previous_rendering
lexical_decisions:
- source_word: יֻתַּן
  choice: pode ser dado
  rationale: O passivo de נתן, negado por לֹא, expressa a impossibilidade de oferecer ouro como pagamento; a forma modal é natural em português.
- source_word: סְגוֹר
  choice: ouro refinado
  rationale: No contexto poético de avaliação, o termo designa ouro depurado ou de alta qualidade, não apenas ouro em sentido genérico.
- source_word: תַּחְתֶּיהָ
  choice: em troca dela
  rationale: תחת com o sufixo feminino indica substituição ou troca. O pronome retoma a sabedoria no contexto anterior.
- source_word: יִשָּׁקֵל
  choice: se pode pesar
  rationale: O verbo passivo alude à prática antiga de pesar a prata usada como pagamento e mantém o paralelismo de impossibilidade com a primeira oração.
- source_word: כֶּסֶף
  choice: prata
  rationale: Mantém a imagem econômica concreta do hebraico, embora a prata funcionasse como dinheiro.
- source_word: מְחִירָהּ
  choice: o seu preço
  rationale: מְחִיר designa preço ou valor de compra; a expressão é concisa e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Dela” preserva a referência feminina à sabedoria. A segunda oração explicita a finalidade do ato de pesar sem abandonar a imagem antiga da prata como pagamento.
