  text: בַּ/עֲשֹׂת֣/וֹ לַ/מָּטָ֣ר חֹ֑ק וְ֝/דֶ֗רֶךְ לַ/חֲזִ֥יז קֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: pt
  text: quando estabeleceu uma lei para a chuva e um caminho para o relâmpago dos trovões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o raio acompanhado de trovões”.'
    reason: A relação precisa entre חֲזִיז (“relâmpago, raio”) e קֹלוֹת (“sons, trovões”) é compacta e ambígua; a alternativa apresenta em português uma relação meteorológica possível.
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: quando estabeleceu
  rationale: 'A preposição בְּ com o infinitivo construto e o sufixo pronominal tem valor temporal: “quando ele fez”. Com חֹק como objeto, “estabeleceu uma lei” expressa naturalmente em português o ato de instituir a ordem.'
- source_word: לַמָּטָר
  choice: para a chuva
  rationale: מָטָר designa a chuva e vem com artigo; a formulação preserva tanto a determinação quanto a ideia de uma norma destinada a ela.
- source_word: חֹק
  choice: uma lei
  rationale: חֹק é algo prescrito ou fixado. “Lei” comunica aqui uma ordem estabelecida para o fenômeno natural sem restringir o sentido a um mero limite físico.
- source_word: וְדֶרֶךְ
  choice: e um caminho
  rationale: דֶּרֶךְ significa “caminho, via” e conserva a imagem poética de um percurso traçado no céu.
- source_word: לַחֲזִיז
  choice: para o relâmpago
  rationale: חֲזִיז denota o clarão do raio ou relâmpago. “Relâmpago” é corrente e preciso em português, sem acrescentar a ideia específica de impacto contida em “raio”.
- source_word: קֹלוֹת
  choice: dos trovões
  rationale: קוֹל significa literalmente “voz, som”; no contexto meteorológico, o plural pode designar trovões. A tradução mantém a construção poética incomum em vez de ampliá-la para “tempestades”.
theological_decisions:
- issue: A ordem cósmica estabelecida por Deus
  choice: Descrever Deus estabelecendo uma lei para a chuva e um caminho para o fenômeno associado aos trovões.
  alternative: Explicitar que Deus controla providencialmente a natureza.
  rationale: O verso retrata poeticamente a ordenação divina da criação, mas não formula uma explicação doutrinária mais ampla; a tradução preserva essa implicação sem desenvolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. “Lei” é inteligível ao leitor comum e preserva a noção de uma ordem fixada; “relâmpago dos trovões” mantém deliberadamente a imagem compacta e pouco comum do hebraico, esclarecida pela nota.
