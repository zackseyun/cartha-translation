  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: pt
  text: Ele represa as nascentes dos rios[a] e traz à luz o que está escondido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele estanca a infiltração dos rios”. O termo hebraico traduzido por “nascentes” é raro e pode evocar água que “chora” ou goteja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: as nascentes de
  rationale: O termo é raro e difícil. No contexto da mineração e do controle da água em Jó 28, provavelmente se refere a pontos de onde a água brota ou se infiltra. “Nascentes” oferece sentido claro em português, enquanto a possível imagem de água que “chora” ou goteja é preservada em nota.
- source_word: נְהָרוֹת
  choice: os rios
  rationale: É o plural comum de “rio”; a escolha mantém a imagem dos cursos de água no contexto subterrâneo.
- source_word: חִבֵּשׁ
  choice: represa
  rationale: O verbo significa literalmente atar, conter ou estancar. Neste contexto, “represa” expressa de modo natural a ação de conter o fluxo da água sem perder o sentido prático.
- source_word: תַּעֲלֻמָהּ
  choice: o que está escondido
  rationale: O substantivo designa algo oculto ou encoberto. A formulação ampla preserva a possibilidade de referência a minérios, tesouros ou outras coisas escondidas, sem especificar além do hebraico.
- source_word: יֹצִא
  choice: traz
  rationale: A forma causativa de יצא significa fazer sair ou trazer para fora. “Traz” funciona naturalmente com a expressão portuguesa “trazer à luz”.
- source_word: אוֹר
  choice: à luz
  rationale: A expressão “trazer à luz” preserva o contraste entre aquilo que está escondido e sua revelação.
