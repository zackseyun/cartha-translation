  text: לֹֽא יַ֭עַרְכֶ/נָּה פִּטְדַת כּ֑וּשׁ בְּ/כֶ֥תֶם טָ֝ה֗וֹר לֹ֣א תְסֻלֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: pt
  text: O topázio de Cuxe não se iguala a ela[a]; ela não pode ser avaliada em ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o crisólito de Cuxe” ou “o peridoto de Cuxe”; a identificação exata de פִּטְדָה é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: não se iguala a ela
  rationale: O verbo ערך expressa aqui comparação de valor ou posição. A formulação conserva o sentido comparativo, e o sufixo feminino remete à sabedoria no contexto.
- source_word: פִּטְדַת כּוּשׁ
  choice: o topázio de Cuxe
  rationale: פִּטְדָה designa uma pedra preciosa cuja identificação mineral exata é incerta. “Topázio” preserva a tradução tradicional e reconhecível; a incerteza é registrada em nota. כּוּשׁ é transliterado como “Cuxe”, forma corrente em português bíblico.
- source_word: בְּכֶתֶם טָהוֹר
  choice: em ouro puro
  rationale: כֶּתֶם indica ouro fino ou refinado, e טָהוֹר reforça sua pureza. A preposição ב introduz o padrão ou meio de avaliação.
- source_word: תְסֻלֶּה
  choice: não pode ser avaliada
  rationale: No paralelismo e no tema do capítulo, o verbo se refere à estimativa de valor ou preço, não apenas à pesagem física.
