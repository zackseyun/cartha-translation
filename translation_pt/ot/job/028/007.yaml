  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: pt
  text: Há um caminho que nenhuma ave de rapina conhece e que o olho do falcão[a] nunca viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milhafre”. O hebraico designa uma ave de rapina, mas a espécie exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: vereda
  rationale: Denota um caminho ou trilha; “vereda” preserva a imagem poética de uma rota oculta e continua compreensível em português.
- source_word: לֹא יְדָעוֹ עָיִט
  choice: que nenhuma ave de rapina conhece
  rationale: עָיִט é um termo genérico para ave de rapina, e o sufixo em יְדָעוֹ retoma a vereda. A construção com “nenhuma” é natural e mantém o sentido.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: e que ... nunca viram
  rationale: שׁזף exprime ver ou avistar. “Nunca viram” comunica com clareza que a vereda escapou até mesmo à visão aguçada da ave.
- source_word: עֵין אַיָּה
  choice: os olhos do falcão
  rationale: O hebraico diz literalmente “olho do”, preservando a imagem visual. O plural idiomático “olhos” soa natural em português sem alterar o referente coletivo ou genérico.
- source_word: אַיָּה
  choice: falcão
  rationale: Designa uma ave de rapina cuja espécie exata é incerta; “falcão” é uma identificação tradicional e clara, enquanto a incerteza lexical é registrada em nota.
