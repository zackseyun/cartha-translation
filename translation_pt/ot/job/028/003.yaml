  text: קֵ֤ץ שָׂ֤ם לַ/חֹ֗שֶׁךְ וּֽ/לְ/כָל תַּ֭כְלִית ה֣וּא חוֹקֵ֑ר אֶ֖בֶן אֹ֣פֶל וְ/צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: pt
  text: Ele põe fim às trevas e sonda, até os limites mais extremos, as pedras da escuridão e das trevas profundas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “a pedra da escuridão e da sombra da morte”.'
    reason: Alternativa lexical que preserva o singular de אֶבֶן e a tradução tradicional de צַלְמָוֶת.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: põe fim às trevas
  rationale: A expressão portuguesa é natural e conserva a imagem hebraica de estabelecer um fim ou limite para a escuridão.
- source_word: וּלְכָל תַּכְלִית
  choice: todos os limites
  rationale: תַּכְלִית indica aqui limite, extremo ou ponto mais distante; o plural idiomático em português comunica a abrangência de כָל sem introduzir a ideia moral de perfeição.
- source_word: הוּא חוֹקֵר
  choice: sonda
  rationale: חקר expressa busca minuciosa e investigação profunda. “Sonda” é conciso, corrente e especialmente adequado ao contexto de exploração subterrânea.
- source_word: אֶבֶן
  choice: as pedras
  rationale: Embora singular na forma, אֶבֶן pode ter sentido coletivo no contexto da mineração. O plural torna esse sentido claro em português, sem excluir em nota a leitura singular tradicional.
- source_word: אֹפֶל
  choice: escuridão
  rationale: אֹפֶל denota escuridão densa ou sombria. “Escuridão” distingue o termo de “trevas” usado para חֹשֶׁךְ e mantém linguagem acessível.
- source_word: וְצַלְמָוֶת
  choice: e das trevas profundas
  rationale: No contexto das profundezas de uma mina, צַלְמָוֶת pode designar escuridão intensíssima. A tradução tradicional “sombra da morte” é preservada em nota.
theological_decisions:
- issue: Sentido de צַלְמָוֶת
  choice: trevas profundas
  alternative: sombra da morte
  rationale: A imagem imediata é a escuridão subterrânea encontrada pelo minerador, favorecendo o sentido contextual de trevas intensas. Como o termo também admite a leitura tradicional associada à morte, essa alternativa não é apagada, mas apresentada em nota.
- issue: Número de אֶבֶן
  choice: as pedras
  alternative: a pedra
  rationale: O singular hebraico pode ser coletivo no cenário de mineração. O texto principal explicita esse valor coletivo, enquanto a nota conserva a forma singular tradicional e a ambiguidade da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sonda” mantém a força investigativa do hebraico; a aposição após “todos os limites” conserva a estrutura compacta e algo ambígua do original.
