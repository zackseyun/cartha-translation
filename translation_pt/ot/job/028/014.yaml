  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: pt
  text: 'O abismo diz: “Ela não está em mim”; e o mar diz: “Ela não está comigo”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: as profundezas
  rationale: Representa a grande profundidade aquática e mantém o paralelismo poético com “o mar”. O plural idiomático soa natural em português sem acrescentar uma nuance mitológica específica.
- source_word: אָמַר
  choice: dizem / diz
  rationale: Embora a forma hebraica seja qatal, no discurso poético ela apresenta uma declaração vívida; o presente preserva a personificação e a atualidade da cena.
- source_word: לֹא בִי הִיא
  choice: Ela não está em mim
  rationale: O pronome feminino הִיא retoma “sabedoria”, substantivo feminino também em português. A tradução conserva tanto essa referência quanto o sentido direto da preposição בְּ.
- source_word: יָם
  choice: o mar
  rationale: É o equivalente comum e direto de יָם e preserva a imagem hebraica e seu paralelismo com as profundezas.
- source_word: אֵין עִמָּדִי
  choice: Ela não está comigo
  rationale: Mantém a imagem espacial e pessoal de ausência expressa pelo hebraico, sem tornar a frase mais interpretativa como “eu não a possuo”.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, de ampla compreensão, com boa legibilidade brasileira. O feminino “ela” deixa explícita a referência gramatical à sabedoria, preservando a personificação do contexto. A concordância plural em “as profundezas dizem” decorre da opção idiomática portuguesa; a nota registra o singular hebraico.
