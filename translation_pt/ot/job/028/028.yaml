base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: pt
  text: 'E ele disse ao ser humano[a]: “Eis: o temor do Senhor é sabedoria; e afastar-se do mal é entendimento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao homem». O hebraico אָדָם está no singular e é usado de modo representativo para a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a ligação narrativa do wayyiqtol sem impor uma sequência temporal mais específica.
- source_word: לָאָדָם
  choice: ao ser humano
  rationale: אָדָם é singular e tem aqui sentido representativo, referindo-se à humanidade; «ser humano» mantém o singular e comunica naturalmente a abrangência genérica em português.
- source_word: הֵן
  choice: Eis que
  rationale: Conserva a função enfática e solene da partícula que chama atenção para a declaração.
- source_word: יִרְאַת אֲדֹנָי
  choice: o temor do Senhor
  rationale: Mantém «temor», sem reduzir o campo semântico a mera reverência, e traduz אֲדֹנָי como o título divino «Senhor».
- source_word: הִיא
  choice: isso é
  rationale: Explicita a força identificadora e enfática do pronome independente hebraico.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente do termo central da literatura sapiencial.
- source_word: וְסוּר
  choice: e afastar-se
  rationale: O infinitivo expressa uma ação moral deliberada e forma o segundo elemento paralelo da declaração.
- source_word: מֵרָע
  choice: do mal
  rationale: O contexto sapiencial favorece o sentido ético de רָע.
- source_word: בִּינָה
  choice: entendimento
  rationale: Equivalente natural que preserva o paralelismo conceitual com «sabedoria».
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: ser humano
  alternative: homem; humanidade
  rationale: O substantivo hebraico está no singular, mas representa a humanidade em geral. «Ser humano» conserva o referente singular representativo sem sugerir que a declaração se limita ao sexo masculino; a alternativa formal «homem» é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a solenidade sapiencial de «Eis que», o termo teologicamente carregado «temor» e o paralelismo entre sabedoria e entendimento.
