id: JOB.28.24
reference: Job 28:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: pt
  text: Pois ele olha até os confins da terra[a] e vê tudo o que há debaixo de todos os céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até as regiões mais distantes da terra”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “céus” no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior sobre o conhecimento que Deus tem da sabedoria; “Pois” expressa naturalmente essa função explicativa.
- source_word: הוּא
  choice: ele
  rationale: O pronome retoma Deus no contexto. A minúscula segue o uso normal do português moderno sem enfraquecer a referência pessoal.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: até os confins da terra
  rationale: A expressão indica os limites mais remotos da terra. “Até os confins da terra” conserva a imagem espacial em linguagem corrente e digna.
- source_word: יַבִּיט
  choice: olha
  rationale: O hifil de נבט indica olhar dirigido. “Olha” preserva o sentido básico, enquanto o alcance abrangente é comunicado pelo restante do verso.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: tudo o que há debaixo de todos os céus
  rationale: A formulação torna natural em português o objeto implícito de “vê”, preservando a imagem espacial de תַּחַת, a força abrangente de כָּל e o plural hebraico “céus”.
- source_word: יִרְאֶה
  choice: vê
  rationale: ראה é o verbo comum para “ver”. “Vê” mantém o paralelismo com “olha” e o sentido lexical direto.
theological_decisions:
- issue: Referência do pronome הוּא
  choice: O sujeito é Deus, em continuidade com a descrição de seu conhecimento abrangente.
  alternative: Deixar o referente do pronome sem identificação contextual.
  rationale: No contexto imediato de Jó 28, aquele que conhece o lugar da sabedoria e contempla toda a criação é Deus. Trata-se de identificação contextual clara, não de acréscimo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva o paralelismo entre “olha” e “vê”, bem como a abrangência cósmica do hebraico. Os marcadores aparecem no texto em ordem de ocorrência.
