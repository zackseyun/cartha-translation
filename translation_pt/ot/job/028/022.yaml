  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: pt
  text: 'Abadom e a Morte dizem[a]: “Com nossos ouvidos, ouvimos falar dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A Destruição e a morte disseram: ‘Com nossos ouvidos, ouvimos um rumor a respeito dela.’”'
    reason: Alternativas lexicais e temporais legítimas para אֲבַדּוֹן, אָמְרוּ e שִׁמְעָהּ.
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abadom
  rationale: Emprega a forma portuguesa tradicional do nome/título hebraico, em vez do abstrato “Destruição”. Em paralelo com “a Morte”, aparece personificado como domínio ou poder que fala.
- source_word: וָמָוֶת
  choice: e a Morte
  rationale: O artigo torna a expressão natural em português, e a inicial maiúscula sinaliza a personificação poética, sem afirmar que se trate literalmente de um ser pessoal.
- source_word: אָמְרוּ
  choice: dizem
  rationale: Embora a forma hebraica seja perfeita, o presente exprime bem a declaração vívida ou geral no contexto poético imediato.
- source_word: בְּאָזְנֵינוּ
  choice: Com nossos próprios ouvidos
  rationale: Preserva a imagem hebraica da audição direta. “Próprios” é uma explicitação idiomática que dá naturalidade e ênfase à expressão em português.
- source_word: שָׁמַעְנוּ
  choice: ouvimos
  rationale: O pretérito perfeito português comunica uma audição passada com relevância para a declaração atual, sem exigir uma construção composta pouco natural.
- source_word: שִׁמְעָהּ
  choice: falar dela
  rationale: A construção idiomática “ouvimos falar dela” expressa conhecimento indireto, por notícia ou rumor. O pronome feminino remete à sabedoria no contexto.
theological_decisions:
- issue: Personificação de Abadom e da Morte
  choice: Apresentar ambos como interlocutores personificados
  alternative: Traduzir אֲבַדּוֹן como o abstrato “Destruição” e escrever “morte” sem personificação gráfica
  rationale: O texto atribui a ambos fala e audição. A personificação conserva a força poética sem impor uma afirmação ontológica além do que o verso diz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a personificação e a ideia de conhecimento apenas indireto sobre a sabedoria.
