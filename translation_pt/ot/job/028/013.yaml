  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: pt
  text: 'O ser humano[a] não conhece o valor dela[b],

    e ela não é encontrada na terra dos viventes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico está no singular e designa representativamente o ser humano mortal.
    reason: lexical_alternative
  - marker: b
    text: Ou «a avaliação dela» ou «o preço dela». O termo hebraico se refere ao valor atribuído a algo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: O substantivo singular designa o ser humano mortal de modo representativo. Esta formulação conserva o singular e expressa com naturalidade a referência genérica em português.
- source_word: יָדַע
  choice: não conhece
  rationale: O perfeito hebraico enuncia aqui uma verdade geral; o presente do indicativo é natural em português. Evita-se «não pode conhecer», que acrescentaria uma ideia de incapacidade não explícita.
- source_word: עֶרְכָּהּ
  choice: o seu valor
  rationale: O termo derivado de ערך indica avaliação, valor ou preço. «Valor» é amplo e idiomático no contexto, sem restringir o sentido a um preço comercial.
- source_word: תִּמָּצֵא
  choice: ela não é encontrada
  rationale: A forma nifal é vertida passivamente, sem acrescentar a modalidade de impossibilidade que haveria em «não pode ser encontrada».
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: na terra dos viventes
  rationale: A expressão preserva o conhecido idioma hebraico para o domínio da vida humana na terra e mantém o registro poético.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com legibilidade brasileira. O pronome feminino «ela» retoma «sabedoria» no contexto anterior. A ordem das notas segue a ocorrência dos marcadores no texto.
