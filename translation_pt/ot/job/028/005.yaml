  yaml_path: translation/ot/job/028/005.yaml
  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: pt
  text: Da terra vem o pão, mas, por baixo, ela é revolvida como que pelo fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, por baixo, ela é revolvida como fogo”. A comparação hebraica pode indicar o modo (“como que pelo fogo”) ou apenas semelhança (“como fogo”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: terra
  rationale: O contexto contrapõe a superfície produtiva ao subsolo explorado; “terra” preserva esse sentido amplo sem sugerir um território específico.
- source_word: מִמֶּנָּה
  choice: da terra
  rationale: A expressão retoma o substantivo feminino “terra”; a repetição torna a relação clara e natural em português.
- source_word: יֵצֵא
  choice: vem
  rationale: Expressa de modo corrente o movimento de procedência indicado pelo verbo hebraico, sem transformar a frase numa construção causativa.
- source_word: לָחֶם
  choice: pão
  rationale: Mantém a imagem concreta do hebraico, em que “pão” representa aquilo que a terra produz para alimento.
- source_word: וְתַחְתֶּיהָ
  choice: mas, por baixo
  rationale: “Mas” explicita o contraste contextual entre a superfície fértil e o subsolo revolvido; “por baixo” é claro e idiomático.
- source_word: נֶהְפַּךְ
  choice: ela é revolvida
  rationale: O passivo preserva a ideia de a terra ser virada ou transtornada, adequada à atividade mineradora descrita no capítulo.
- source_word: כְּמוֹ אֵשׁ
  choice: como que pelo fogo
  rationale: A formulação comunica a comparação com o efeito do fogo, mantendo por meio da nota a possibilidade de simples semelhança com o fogo.
