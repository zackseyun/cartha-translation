  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: pt
  text: Ele abre uma galeria longe de onde as pessoas moram[a]; esquecidos por quem passa a pé[b], eles ficam suspensos[c], longe dos seres humanos, e balançam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele abre um canal ou leito de torrente longe de onde está o peregrino”. O hebraico é difícil, especialmente as palavras נַחַל e גָּר; muitos entendem a frase à luz da mineração descrita no capítulo e, por isso, interpretam נַחַל como uma escavação ou galeria.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “esquecidos do pé” ou “esquecidos pelo pé”. A ideia pode ser que o lugar ou os trabalhadores estão fora da vista ou do alcance de quem caminha na superfície.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “são baixados” ou “ficam pendurados”. O verbo hebraico pode indicar suspensão ou descida, provavelmente por cordas numa mina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: abre
  rationale: O verbo expressa romper ou abrir passagem. Em português, “abre uma galeria” comunica naturalmente a escavação forçada sugerida pelo contexto.
- source_word: נַחַל
  choice: galeria
  rationale: Embora normalmente designe um ribeiro, vale ou leito de torrente, no contexto da mineração pode indicar um corte ou passagem escavada. “Galeria” preserva a imagem subterrânea sem especificar necessariamente um poço vertical.
- source_word: מֵעִם גָּר
  choice: longe de onde as pessoas moram
  rationale: A expressão hebraica é difícil. מֵעִם indica afastamento, e גָּר pode designar quem reside ou peregrina. A formulação locativa oferece sentido claro, mantendo em nota a leitura mais literal.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: esquecidos pelos pés
  rationale: 'Mantém a metáfora compacta do hebraico: os mineiros ou o lugar estão fora do alcance e da percepção de quem anda na superfície.'
- source_word: דַּלּוּ
  choice: ficam suspensos
  rationale: O verbo pode indicar estar pendurado, ser baixado ou ficar suspenso. No cenário mineiro, sugere trabalhadores sustentados ou descidos por cordas.
- source_word: מֵאֱנוֹשׁ
  choice: longe dos seres humanos
  rationale: אֱנוֹשׁ designa o ser humano mortal. A expressão inclusiva e digna refere-se à sociedade humana da qual os mineiros estão afastados.
- source_word: נָעוּ
  choice: balançam
  rationale: O verbo descreve movimento instável ou de um lado para outro, adequado à imagem de trabalhadores suspensos.
