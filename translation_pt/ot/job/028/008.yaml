  text: לֹֽא הִדְרִיכֻ֥/הוּ בְנֵי שָׁ֑חַץ לֹֽא עָדָ֖ה עָלָ֣י/ו שָֽׁחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: pt
  text: As feras altivas não pisaram esse caminho[a]; o leão não passou por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos da altivez”. A expressão provavelmente se refere a animais selvagens altivos, em especial predadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: não pisaram esse caminho
  rationale: Neste contexto, o hifil de דרך descreve percorrer ou pôr os pés num caminho. A referência explícita a “esse caminho” torna natural em português o pronome hebraico masculino e preserva a imagem do caminho oculto dos versículos anteriores.
- source_word: בְנֵי שָׁחַץ
  choice: as feras altivas
  rationale: A expressão significa literalmente “filhos da altivez”. Em paralelo com שׁחל (“leão”), provavelmente designa animais selvagens imponentes, sobretudo predadores. “Feras altivas” comunica essa leitura sem eliminar a expressão literal, registrada em nota.
- source_word: עָדָה עָלָיו
  choice: não passou por ele
  rationale: O verbo com על indica passar por cima, sobre ou através de algo. “Passou por ele” é idiomático em português para atravessar um caminho e mantém o paralelismo com “pisaram”.
- source_word: שָׁחַל
  choice: o leão
  rationale: Termo poético hebraico para leão, possivelmente com conotação de força ou ferocidade. “O leão” é claro, digno e não acrescenta ao texto uma especificação incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com leitura natural no Brasil e compreensão internacional. “Feras altivas” conserva a personificação poética do hebraico; “esse caminho” explicita apenas o referente contextual do pronome.
