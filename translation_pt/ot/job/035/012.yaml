id: JOB.35.12
reference: Job 35:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: pt
  text: Ali clamam, mas não responde[a], por causa do orgulho[b] dos homens maus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não identifica expressamente o sujeito de “não responde”; o contexto aponta para Deus.
    reason: alternative_reading
  - marker: b
    text: Ou “arrogância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: O advérbio é primariamente locativo e aponta para a situação descrita no contexto. “Ali” é natural em português e preserva esse valor sem convertê-lo em uma indicação meramente temporal.
- source_word: יִצְעֲקוּ
  choice: clamam
  rationale: O verbo צעק expressa um clamor motivado por aflição ou necessidade. “Clamam” conserva a intensidade e se ajusta ao registro bíblico digno sem ser antiquado.
- source_word: וְלֹא
  choice: mas não
  rationale: Embora a conjunção possa ser simplesmente aditiva, o contraste entre clamar e não receber resposta é expresso naturalmente em português por “mas”.
- source_word: יַעֲנֶה
  choice: não responde
  rationale: A forma verbal é masculina singular e não traz sujeito nominal explícito. O português permite omitir o pronome, preservando melhor essa contenção do hebraico; o presente comunica a afirmação geral no contexto.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A locução prepositiva indica aqui causa ou motivo. “Por causa de” é clara, corrente e semanticamente adequada.
- source_word: גְּאוֹן
  choice: orgulho
  rationale: Neste contexto, associado aos maus, o termo tem sentido negativo de orgulho ou arrogância. “Orgulho” é conciso e natural; “arrogância” permanece uma alternativa válida.
- source_word: רָעִים
  choice: homens maus
  rationale: O adjetivo substantivado está no masculino plural e designa seres humanos moralmente maus. “Homens maus” torna explícita a referência humana e preserva o gênero gramatical da fonte.
theological_decisions:
- issue: Sujeito implícito de “não responde”
  choice: 'Manter o sujeito sem nome e sem pronome explícito: “não responde”.'
  alternative: “Deus não responde” ou “ele não responde”.
  rationale: O contexto aponta para Deus como aquele que poderia responder ao clamor, mas o hebraico não o nomeia nesta oração. A omissão natural do sujeito em português preserva essa ambiguidade formal sem obscurecer o sentido contextual.
- issue: Referência masculina plural em רָעִים
  choice: “homens maus”
  alternative: “os maus” ou “pessoas más”
  rationale: A fonte usa uma forma masculina plural para os malfeitores. A tradução conserva essa referência em vez de neutralizá-la, sem acrescentar uma identificação além da indicada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A elipse do sujeito em “não responde” é idiomática em português e reproduz a reserva do hebraico. “Clamam” mantém a força do pedido angustiado; “homens maus” preserva a forma masculina plural da fonte.
