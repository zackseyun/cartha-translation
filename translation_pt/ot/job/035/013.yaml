  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: pt
  text: De fato, Deus não ouve o que é vazio[a], e o Todo-Poderoso não lhe dá atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vaidade”, “a falsidade” ou “o que não tem valor”. O termo hebraico pode descrever aquilo que é vazio, inútil ou enganoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: Aqui a partícula tem força enfática ou asseverativa. “De fato” comunica essa ênfase com naturalidade, sem o sentido restritivo de “somente”.
- source_word: שָׁוְא
  choice: o que é vazio
  rationale: O termo pode indicar vazio, vaidade, falsidade ou inutilidade. A expressão preserva a amplitude sem restringi-lo especificamente a uma oração falsa ou a palavras orgulhosas.
- source_word: יִשְׁמַע
  choice: não ouve
  rationale: O imperfeito expressa aqui uma afirmação geral. “Não ouve” mantém o verbo básico e o paralelismo com a atenção mencionada na segunda linha.
- source_word: אֵל
  choice: Deus
  rationale: É o equivalente corrente e natural para este título divino no contexto.
- source_word: וְשַׁדַּי
  choice: e o Todo-Poderoso
  rationale: Traduz o título divino שַׁדַּי de modo consagrado e compreensível em português.
- source_word: יְשׁוּרֶנָּה
  choice: não lhe dá atenção
  rationale: O verbo significa olhar, observar ou considerar. Esta formulação expressa consideração atenta e preserva o paralelo sem sugerir mera percepção visual; “lhe” retoma “o que é vazio”.
theological_decisions:
- issue: Referente e sentido de שָׁוְא na afirmação de Eliú
  choice: Aquilo que é vazio, fútil ou insincero não recebe a atenção de Deus
  alternative: “Falsidade” em abstrato ou “vaidade” como fala orgulhosa
  rationale: A tradução mantém a tensão moral e retórica do hebraico sem transformar a frase numa negação da onisciência divina nem limitar o termo a uma categoria específica de oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De fato” dá ênfase natural; “o que é vazio” evita o tom potencialmente arcaico ou excessivamente abstrato de “vacuidade”, e a nota conserva as alternativas lexicais genuínas.
