lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto a transição temporal-discursiva sem especificar indevidamente uma relação adversativa ou conclusiva.
- source_word: כִּי
  choice: visto que
  rationale: Expressa naturalmente em português a força explicativa ou causal da conjunção neste contexto.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: ele não puniu em sua ira
  rationale: Entende פקד no sentido de visitação punitiva e liga אַפּוֹ à circunstância da ação. A formulação é natural em português e evita a construção pouco idiomática 'sua ira não puniu'.
- source_word: וְלֹא יָדַע
  choice: e não deu muita atenção
  rationale: ידע pode indicar reconhecer ou levar em conta, não apenas conhecer intelectualmente; a expressão comunica esse valor contextual.
- source_word: בַּפַשׁ
  choice: à transgressão
  rationale: A palavra hebraica é rara e incerta; 'transgressão' se ajusta ao contexto judicial, enquanto outras possibilidades são registradas em nota.
- source_word: מְאֹד
  choice: muita
  rationale: Intensifica a locução verbal 'dar atenção' de maneira corrente em português.
theological_decisions:
- issue: Sentido de uma oração hebraica notoriamente difícil
  choice: A fala declara que Deus não puniu em sua ira e não deu muita atenção à transgressão.
  alternative: A oração pode referir-se à falta de uma visitação punitiva ou ao fato de Deus não reconhecer plenamente uma grande insolência ou ofensa.
  rationale: A tradução acompanha uma leitura contextual plausível, mas conserva nas notas a incerteza lexical. Como a afirmação faz parte do discurso de Eliú, ela não é reformulada para eliminar sua tensão teológica nem transformada em declaração sistemática sobre o conhecimento ou a justiça de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final reflete a continuação sintática do pensamento no versículo seguinte.
