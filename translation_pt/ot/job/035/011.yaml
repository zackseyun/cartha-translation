  yaml_path: translation/ot/job/035/011.yaml
  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: pt
  text: que nos ensina mais do que ensina aos animais da terra e nos torna mais sábios do que as aves dos céus[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que nos ensina a partir dos animais da terra e nos torna sábios a partir das aves dos céus”. A preposição hebraica também pode indicar fonte, em vez de comparação.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: nos ensina
  rationale: O particípio piel de למד com sufixo de primeira pessoa do plural expressa instrução ativa; “nos ensina” é natural, claro e preserva o paralelismo.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: mais do que aos animais da terra
  rationale: A preposição מִן é entendida primariamente em sentido comparativo. A inclusão de “aos” explicita em português que Deus ensina os seres humanos em grau superior ao dos animais, sem sugerir que ensina humanos mais do que ensina sobre os animais.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: do que as aves dos céus
  rationale: Mantém o uso comparativo paralelo de מִן e conserva a imagem poética elevada de “aves dos céus”.
- source_word: יְחַכְּמֵנוּ
  choice: nos torna mais sábios
  rationale: O piel de חכם tem sentido causativo, “tornar sábio”; “mais sábios” torna explícita a comparação indicada pela preposição hebraica.
theological_decisions:
- issue: Sentido da preposição מִן nos dois membros poéticos
  choice: 'Comparativo: Deus ensina os seres humanos mais do que aos animais e os torna mais sábios do que as aves.'
  alternative: 'Origem ou fonte: Deus nos ensina por meio dos animais da terra e nos dá sabedoria por meio das aves dos céus.'
  rationale: O paralelismo poético e o contexto favorecem uma comparação entre a capacidade concedida aos humanos e a dos animais. A alternativa possível é preservada em nota, sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Animais” evita o tom arcaico ou potencialmente pejorativo de “bestas”; “aves dos céus” preserva a expressão poética hebraica. O ponto de interrogação reflete a função desta oração no contexto da pergunta iniciada no versículo anterior.
