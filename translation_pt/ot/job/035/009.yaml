  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: pt
  text: Por causa das muitas opressões, eles clamam; pedem socorro por causa do braço dos poderosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pedem socorro do braço dos poderosos”. A preposição hebraica pode ser traduzida por “de”, embora provavelmente indique aqui a causa do pedido. “Braço” é uma imagem hebraica de força ou poder.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מֵרֹב
  choice: Por causa das muitas
  rationale: A preposição מִן com רֹב indica aqui causa ou origem. A formulação comunica com naturalidade que os clamores surgem da grande quantidade de opressões.
- source_word: עֲשׁוּקִים
  choice: opressões
  rationale: Neste contexto, a forma plural derivada de עשק designa atos ou casos de opressão, e não principalmente as pessoas oprimidas.
- source_word: יַזְעִיקוּ
  choice: eles clamam
  rationale: O Hifil de זעק expressa levantar um clamor em situação de aflição. “Clamam” é corrente, digno e preserva o sentido de protesto angustiado.
- source_word: יְשַׁוְּעוּ
  choice: pedem socorro
  rationale: O verbo שוע no Piel indica um pedido de ajuda. A escolha diferencia levemente este verbo do clamor da oração anterior e mantém o paralelismo.
- source_word: מִזְּרֹעַ
  choice: por causa do braço dos
  rationale: זְרוֹעַ significa literalmente “braço” e funciona como imagem de força ou poder. A preposição מִן é entendida no sentido causal, sem eliminar a possibilidade de leitura como origem ou afastamento.
- source_word: רַבִּים
  choice: poderosos
  rationale: No contexto de opressão, רַבִּים aponta para pessoas socialmente fortes ou poderosas, e não simplesmente para um grande número de pessoas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a imagem concreta de “braço” e o paralelismo entre clamar e pedir socorro. O pronome “eles” preserva o sujeito humano plural e indefinido do hebraico.
