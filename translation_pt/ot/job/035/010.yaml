  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: pt
  text: 'Mas ninguém diz: “Onde está Deus, meu Criador[a], que dá canções durante a noite?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “meus criadores”, forma plural empregada aqui com referência ao único Deus; por isso, “meu Criador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ninguém
  rationale: A conjunção com a negação contrasta com o contexto anterior. O sujeito indefinido, implícito em hebraico, é expresso naturalmente em português por “ninguém”.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma verbal seja perfeita, o contexto apresenta uma observação geral e habitual; o presente é natural em português.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Interrogativo de localização ou presença, vertido de modo idiomático na pergunta direta.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Título divino singular comum no livro de Jó; “Deus” é a tradução clara e corrente.
- source_word: עֹשָׂי
  choice: meu Criador
  rationale: A forma hebraica é morfologicamente plural, com sufixo de primeira pessoa, mas designa aqui o único Deus. O singular comunica o referente sem sugerir vários criadores; a forma plural é registrada em nota.
- source_word: נֹתֵן
  choice: que dá
  rationale: O particípio descreve uma ação característica de Deus e é expresso naturalmente por uma oração relativa.
- source_word: זְמִרוֹת
  choice: canções
  rationale: O termo significa canções ou cânticos, por vezes associados ao louvor. “Canções” preserva a amplitude lexical sem acrescentar um sentido litúrgico obrigatório.
- source_word: בַּלָּיְלָה
  choice: durante a noite
  rationale: Expressa com clareza o âmbito temporal e mantém o tom poético da imagem.
theological_decisions:
- issue: Número gramatical de עֹשָׂי ao se referir a Deus
  choice: 'Sentido singular: “meu Criador”'
  alternative: 'Plural formal: “meus criadores”'
  rationale: Embora a forma hebraica seja plural, o referente no verso é o Deus singular. O texto principal usa o singular para não produzir uma leitura politeísta enganosa, enquanto a nota conserva a forma gramatical para transparência.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A pergunta direta e a imagem poética das canções na noite foram preservadas.
