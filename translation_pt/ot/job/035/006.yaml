  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: pt
  text: Se você pecar, que efeito terá sobre ele? E, se as suas transgressões forem muitas, o que você lhe fará?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Se você pecar
  rationale: A construção condicional com o perfeito hebraico expressa aqui uma hipótese geral; o futuro do subjuntivo é natural em português e preserva essa força.
- source_word: מַה תִּפְעָל בּוֹ
  choice: que efeito terá sobre ele?
  rationale: פעל pode indicar fazer, produzir ou efetuar, e בּוֹ aponta para o efeito em relação a Deus. A formulação comunica a pergunta retórica sem afirmar que o pecado seja moralmente irrelevante para Deus.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: E, se as suas transgressões forem muitas
  rationale: O segundo “se” está elíptico no hebraico e é explicitado em português para conservar o paralelismo. “Transgressões” mantém a gravidade e a nuance de rebeldia de פשע.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: o que fará contra ele?
  rationale: עשה significa “fazer”, enquanto לּוֹ indica o referente da ação. “Contra ele” torna natural em português o sentido adversativo sugerido pelo paralelismo, sem acrescentar explicitamente “dano”.
theological_decisions:
- issue: Se a pergunta deve sugerir que o pecado humano é irrelevante para Deus ou, mais precisamente, que não pode prejudicá-lo nem diminuí-lo.
  choice: A tradução pergunta que efeito o pecado teria sobre Deus e o que faria contra ele.
  alternative: “Que mal você lhe causará?” ou a forma mais literal “o que fará a ele?”
  rationale: A redação preserva o argumento de Eliú sobre a transcendência e independência de Deus sem transformar isso numa alegação de indiferença moral divina. Evita também inserir “mal” ou “dano”, termos apenas implícitos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético foi preservado; a variação entre “ter efeito sobre” e “fazer contra” reflete os dois verbos hebraicos distintos e mantém a tensão retórica.
