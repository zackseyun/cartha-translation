  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: pt
  text: Assim, Jó abre a boca em vão[a]; sem conhecimento, multiplica palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abre a boca com palavras vazias”. O hebraico הֶבֶל pode indicar vazio, vaidade ou inutilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: Assim, Jó
  rationale: A conjunção liga o versículo à conclusão anterior de Eliú e, no contexto, tem valor inferencial. “Assim” expressa essa conexão sem introduzir contraste indevido.
- source_word: הֶבֶל
  choice: em vão
  rationale: O termo pode designar sopro, vapor, vazio, vaidade ou inutilidade. Aqui caracteriza adverbialmente o ato de Jó falar; “em vão” é natural em português e comunica a ideia de fala vazia ou inútil, mantendo a amplitude lexical em nota.
- source_word: יִפְצֶה פִּיהוּ
  choice: abre a boca
  rationale: A expressão פצה פה significa literalmente “abrir a boca” e funciona como idioma para começar a falar. A formulação direta também é natural em português.
- source_word: בִּבְלִי דַעַת
  choice: sem conhecimento
  rationale: בִּבְלִי indica ausência, e דַעַת significa “conhecimento”. A tradução conserva de modo direto a acusação de Eliú sem especificar além do hebraico.
- source_word: מִלִּין
  choice: palavras
  rationale: A forma plural aramaizante significa “palavras” ou “declarações”; “palavras” é o equivalente mais simples e adequado ao contexto.
- source_word: יַכְבִּר
  choice: multiplica
  rationale: O hifil de כָּבַר transmite a ideia de tornar numeroso ou abundante. “Multiplica palavras” preserva a força causativa e é compreensível em português.
