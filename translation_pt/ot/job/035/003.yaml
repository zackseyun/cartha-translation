  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: pt
  text: 'Pois você diz[a]: “Que vantagem isso traz para você? Que proveito tenho eu do meu pecado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que vantagem você tem? Que proveito tenho a mais do que se eu pecasse?” O hebraico é conciso e pode sugerir uma comparação entre agir com justiça e pecar.'
    reason: Registra a construção alternativa e a possível força comparativa de מן sem resolver a elipse no texto principal.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Eliú para a afirmação atribuída a Jó e mantém a ligação argumentativa com o versículo anterior.
- source_word: תֹאמַר
  choice: você diz
  rationale: O imperfeito qal na segunda pessoa do singular dirige-se a Jó; o presente é natural em português para apresentar a alegação que Eliú lhe atribui.
- source_word: מַה יִּסְכָּן לָךְ
  choice: Que vantagem isso traz para você?
  rationale: סכן expressa utilidade ou benefício. “Isso” torna a pergunta natural sem identificar de modo excessivamente específico o referente elíptico do hebraico.
- source_word: מָה אֹעִיל
  choice: Que proveito tenho eu
  rationale: O hifil de יעל indica obter proveito ou benefício. A formulação preserva a primeira pessoa e o paralelismo com a pergunta anterior.
- source_word: מֵחַטָּאתִי
  choice: do meu pecado
  rationale: A preposição מן pode indicar origem ou comparação. A tradução principal conserva a leitura direta de origem, enquanto a possível nuance comparativa é registrada na nota.
theological_decisions:
- issue: Sentido da citação atribuída por Eliú a Jó
  choice: Eliú apresenta Jó perguntando que vantagem pessoal resulta daquilo a que se refere de forma elíptica, em contraste com seu pecado.
  alternative: Eliú apresenta Jó perguntando que proveito ele tem por ser justo, em comparação com o que teria se pecasse.
  rationale: O hebraico é conciso e deixa implícito o referente de “isso”, bem como a força exata de מן. O texto principal não explicita “justiça” nem acrescenta uma comparação ausente na superfície; a nota preserva a leitura comparativa sugerida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém o encadeamento argumentativo; “proveito” preserva o paralelismo sem soar excessivamente técnico. O marcador [a] aparece imediatamente após a fórmula que introduz a citação.
