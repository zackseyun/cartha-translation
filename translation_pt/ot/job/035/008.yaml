source:
  edition: WLC
  text: לְ/אִישׁ כָּמ֥וֹ/ךָ רִשְׁעֶ֑/ךָ וּ/לְ/בֶן אָ֝דָ֗ם צִדְקָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: pt
  text: A sua maldade afeta um homem como você, e a sua justiça, um filho do homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ser humano”. Em hebraico, “um filho do homem”, expressão comum aqui para uma pessoa mortal, não um título messiânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: afeta um homem
  rationale: A preposição לְ indica aqui, numa construção elíptica retomada do contexto (vv. 6–7), a pessoa sobre quem recai o efeito. Em português, “afeta” explicita naturalmente essa relação sem alterar o argumento de Eliú.
- source_word: כָּמוֹךָ
  choice: como você
  rationale: 'Preserva de modo corrente a comparação explícita com Jó: trata-se de outro ser humano como ele.'
- source_word: רִשְׁעֶךָ
  choice: a sua maldade
  rationale: רֶשַׁע designa maldade ou conduta moralmente perversa; “maldade” mantém o sentido ético e o paralelismo com “justiça”.
- source_word: וּלְבֶן אָדָם
  choice: e ... um filho do homem
  rationale: Mantém a imagem masculina singular e representativa do hebraico, que neste contexto poético significa uma pessoa mortal e forma paralelo com “um homem como você”.
- source_word: צִדְקָתֶךָ
  choice: a sua justiça
  rationale: Traduz diretamente o substantivo que, em paralelo com “maldade”, denota retidão ou conduta justa.
theological_decisions:
- issue: Sentido de בֶּן אָדָם no contexto
  choice: expressão genérica para um ser humano, vertida formalmente como “um filho do homem”
  alternative: “um ser humano”; não “o Filho do Homem” como título messiânico
  rationale: Em Jó, a expressão é uma designação poética comum de uma pessoa mortal e está em paralelo com “um homem como você”. O artigo indefinido e as minúsculas ajudam a evitar uma leitura titular, enquanto a nota esclarece o idioma sem eliminar a imagem hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. O verbo elíptico foi explicitado como “afeta”; na segunda oração, sua repetição foi omitida de modo natural em português. A expressão hebraica “um filho do homem” foi preservada e esclarecida em nota.
