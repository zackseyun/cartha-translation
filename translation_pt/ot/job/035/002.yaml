  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: pt
  text: 'Você acha que isto é justo? Você diz[a]: “A minha justiça é maior do que a de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha justiça está diante de Deus”, ou: “Meu direito vem de Deus”. O hebraico é conciso, e a relação entre “minha justiça” e “Deus” é debatida.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Você acha que isto
  rationale: A partícula interrogativa, o demonstrativo e o verbo formam uma pergunta retórica; esta formulação é natural em português e conserva a referência enfática a “isto”.
- source_word: לְמִשְׁפָּט
  choice: é justo
  rationale: מִשְׁפָּט possui sentido judicial e ético; “justo” comunica aqui a avaliação de Eliú sobre a alegação de Jó.
- source_word: אָמַרְתָּ
  choice: ao dizer
  rationale: O perfeito introduz a declaração atribuída a Jó. “Ao dizer” liga naturalmente a citação à pergunta retórica sem exigir que se determine entre valor passado e presente.
- source_word: צִדְקִי
  choice: a minha justiça
  rationale: Preserva o campo moral e judicial de צדק e a relação lexical com a ideia de ser justo, sem restringi-la apenas a inocência ou direito legal.
- source_word: מֵאֵל
  choice: é maior que a de Deus
  rationale: Adota o valor comparativo possível de מִן; “a de Deus” explicita em português o termo elíptico da comparação. A construção hebraica continua debatida, por isso as demais leituras são registradas em nota.
theological_decisions:
- issue: Sentido da alegação de Jó na acusação de Eliú
  choice: 'Leitura comparativa: “A minha justiça é maior que a de Deus”'
  alternative: “Sou justo diante de Deus” ou “Meu direito vem de Deus”
  rationale: O hebraico צִדְקִי מֵאֵל é comprimido e permite análises distintas. No contexto da crítica de Eliú, a leitura comparativa é plausível, mas as alternativas teologicamente relevantes não devem ser ocultadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom retórico de Eliú e sinaliza em nota a ambiguidade real do hebraico.
