  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: pt
  text: Se você é justo, o que dá a ele?[a] Ou o que ele toma da sua mão?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a Deus. No contexto, Eliú afirma que a justiça humana não proporciona ganho a Deus.
    reason: cross_reference
  - marker: b
    text: 'Ou: “recebe da sua mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa no hebraico, sem acrescentar ideia temporal ou modal.
- source_word: צָדַקְתָּ
  choice: você é justo
  rationale: Expressa o estado de ser justo ou estar em conformidade com o que é certo. O presente comunica com naturalidade o valor geral da afirmação no contexto.
- source_word: מַה תִּתֶּן לוֹ
  choice: o que dá a ele?
  rationale: Mantém a pergunta retórica e a relação de destinatário marcada por ל, usando formulação natural e clara em português.
- source_word: מִיָּדְךָ
  choice: da sua mão
  rationale: Preserva a imagem concreta do hebraico, que indica aquilo que procede da posse ou da ação de alguém.
- source_word: יִקָּח
  choice: toma
  rationale: Traduz diretamente לקח, que pode significar tomar ou receber. “Toma” preserva a força lexical primária sem excluir o sentido contextual de receber.
theological_decisions:
- issue: Referente dos pronomes לוֹ e יִקָּח
  choice: Manter “ele/a ele” no texto principal, com nota identificando Deus como referente contextual.
  alternative: Substituir diretamente os pronomes por “Deus”.
  rationale: Em Jó 35:6–8, Eliú argumenta que a justiça humana não proporciona ganho a Deus. Contudo, como o hebraico deste versículo emprega pronomes, mantê-los preserva a forma e a tensão do texto sem tornar explícito no corpo algo indicado pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A imagem “da sua mão” foi preservada por ser inteligível e poeticamente adequada ao livro de Jó.
