  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: pt
  text: 'Muito menos quando você diz: “Você não o vê”. A causa está diante dele; espere por ele[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e contorça-se diante dele”. O verbo hebraico é difícil, e muitos o entendem aqui no sentido de “esperar por ele com expectativa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Muito menos quando
  rationale: A expressão introduz um argumento intensificador a partir do versículo anterior. “Muito menos quando” preserva essa força inferencial, em vez de tratá-la como simples concessão.
- source_word: תֹאמַר
  choice: você diz
  rationale: Traduz diretamente o verbo na segunda pessoa do singular, mantendo a fala de Eliú dirigida a Jó.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Você não o vê
  rationale: שׁור pode significar ver, contemplar ou perceber. No contexto, a frase expressa a alegação de Jó de que ele não vê Deus, sem atribuir ignorância a Deus.
- source_word: דִּין
  choice: A causa
  rationale: 'Aqui o substantivo tem sentido forense: a questão ou causa apresentada para julgamento. “A causa” conserva a imagem jurídica e soa natural em português.'
- source_word: לְפָנָיו
  choice: está diante dele
  rationale: A expressão indica que a causa se encontra perante Deus para decisão, preservando a linguagem judicial do hebraico.
- source_word: וּתְחוֹלֵל לוֹ
  choice: portanto, espere por ele
  rationale: O verbo é difícil e admite relação com contorcer-se ou agitar-se, mas neste contexto é tradicionalmente entendido como esperar com expectativa. “Espere por ele” comunica a exortação contextual; “portanto” explicita com leveza a relação lógica, enquanto a alternativa lexical é preservada em nota.
theological_decisions:
- issue: A invisibilidade de Deus e a causa de Jó
  choice: Eliú afirma que, embora Jó diga não ver Deus, sua causa continua diante de Deus, e Jó deve esperar por ele.
  alternative: Entender que Deus não vê a causa, ou que Jó deve contorcer-se diante dele.
  rationale: A sintaxe e o contexto favorecem tomar “você não o vê” como a queixa de Jó, não como afirmação de ignorância divina. A dificuldade real do último verbo não é ocultada, mas registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com tratamento por “você” para a segunda pessoa singular. A formulação conserva a imagem forense e registra em nota a ambiguidade do verbo final.
