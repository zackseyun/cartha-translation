base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: pt
  text: Vesti-me de retidão[a], e ela me vestiu; minha justiça era como um manto e um turbante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Vesti-me de justiça, e ela me vestiu». O termo hebraico pode significar «retidão» ou «justiça».'
    reason: lexical_alternative
  - marker: b
    text: O «turbante» era uma cobertura de cabeça feita de tecido enrolado e, nesta imagem, sugere honra e dignidade pública.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: justiça
  rationale: O termo pode expressar retidão ou justiça. «Justiça» é natural em português e mantém a qualidade moral que Jó apresenta como vestimenta; a nota registra «retidão» como alternativa legítima.
- source_word: לָבַשְׁתִּי
  choice: Vesti-me de
  rationale: Preserva a metáfora ativa de colocar uma roupa e soa natural em português.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: e ela me vestiu
  rationale: 'Mantém a repetição do verbo hebraico e sua inversão poética: Jó se veste de justiça, e a justiça o veste.'
- source_word: מְעִיל
  choice: manto
  rationale: Designa uma veste exterior e comunica com clareza a dignidade da imagem.
- source_word: צָנִיף
  choice: turbante
  rationale: Equivalente direto para uma cobertura de cabeça feita de tecido enrolado; uma nota esclarece a imagem cultural.
- source_word: מִשְׁפָּטִי
  choice: minha prática da justiça
  rationale: O substantivo pode indicar julgamento, justiça ou decisão judicial. A formulação explicita aqui a conduta pública e justa de Jó, diferenciando-a da qualidade moral expressa por צֶדֶק sem eliminar a relação entre os termos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «vesti» conserva o paralelismo poético hebraico; «prática da justiça» evita a formulação menos natural «minha justiça» e expressa o sentido público/judicial de מִשְׁפָּטִי.
