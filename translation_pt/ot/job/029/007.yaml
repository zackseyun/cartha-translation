  yaml_path: translation/ot/job/029/007.yaml
  text: When I went out to the gate by the city[a], when I prepared my seat in the square[b],
translation:
  language: pt
  text: Quando eu saía para o portão da cidade[a], quando preparava meu assento na praça[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o portão junto à cidade”. O hebraico diz literalmente “o portão” e acrescenta uma expressão que o relaciona com “a cidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na rua” ou “no espaço aberto”. O termo se refere a uma área pública ampla, não necessariamente a uma via estreita.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Quando eu saía
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de primeira pessoa tem valor temporal. O imperfeito português descreve com naturalidade a situação habitual do passado que Jó recorda.
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: para o portão da cidade
  rationale: Embora o hebraico mencione literalmente “o portão” e acrescente uma expressão que o relaciona com “a cidade”, a combinação designa naturalmente o portão urbano, centro da vida cívica e judicial. A nota preserva a forma menos condensada e a incerteza da relação espacial.
- source_word: בָּרְחוֹב
  choice: na praça
  rationale: רְחוֹב designa um espaço público amplo ou aberto, não necessariamente uma rua estreita. “Praça” comunica melhor o cenário cívico em português atual.
- source_word: אָכִין
  choice: preparava
  rationale: O hifil de כון pode significar preparar, dispor ou estabelecer. “Preparava” mantém o sentido sem sugerir indevidamente uma instalação permanente.
- source_word: מוֹשָׁבִי
  choice: meu assento
  rationale: No contexto do portão e da praça, מוֹשָׁב indica o assento ou lugar de sentar de Jó na assembleia pública, não sua moradia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição de “quando” preserva o paralelismo temporal hebraico; “portão” distingue a entrada urbana de uma porta doméstica.
