  text: בִּ/רְחֹ֣ץ הֲלִיכַ֣/י בְּ/חֵמָ֑ה וְ/צ֥וּר יָצ֥וּק עִ֝מָּדִ֗/י פַּלְגֵי שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/006.yaml
  text: when my steps were washed with curds[b][a], and the rock poured out for me streams of oil.
translation:
  language: pt
  text: quando meus passos eram banhados em coalhada[a], e a rocha derramava ao meu lado[b] ribeiros de azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nata” ou “manteiga”; o termo hebraico pode designar diferentes produtos lácteos espessos.
    reason: lexical_alternative
  - marker: b
    text: Ou “para mim”; a expressão hebraica é literalmente espacial e também pode ser traduzida por “comigo” ou “junto de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: quando ... eram banhados
  rationale: A preposição בְּ com o infinitivo construto introduz aqui uma circunstância temporal. A forma passiva em português preserva a imagem de abundância sem fazer dos “passos” agentes do banho.
- source_word: הֲלִיכַי
  choice: meus passos
  rationale: Mantém a imagem concreta do hebraico, em vez de substituí-la pela ideia mais abstrata de “minha caminhada” ou “meu modo de viver”.
- source_word: בְּחֵמָה
  choice: em coalhada
  rationale: חֵמָה designa um produto lácteo espesso, que pode ser entendido como coalhada, nata ou algo semelhante à manteiga. “Coalhada” comunica bem o produto antigo, e a alternativa lexical é registrada em nota.
- source_word: וְצוּר
  choice: e a rocha
  rationale: צוּר significa “rocha” ou “rochedo”; o artigo em português dá naturalidade à referência poética genérica.
- source_word: יָצוּק
  choice: derramava
  rationale: O verbo יצק descreve o ato de derramar. O imperfeito português combina com a recordação de uma condição habitual de abundância no passado.
- source_word: עִמָּדִי
  choice: ao meu lado
  rationale: Preserva o sentido espacial básico de “comigo” ou “junto de mim”, sem converter silenciosamente a expressão em uma ideia exclusivamente benefativa.
- source_word: פַּלְגֵי
  choice: ribeiros
  rationale: O termo designa canais ou correntes de líquido; “ribeiros” conserva a imagem poética de fluxo abundante.
- source_word: שָׁמֶן
  choice: azeite
  rationale: Embora שָׁמֶן possa significar óleo em geral, no ambiente agrícola israelita normalmente evoca o azeite de oliva; “azeite” produz em português a imagem concreta e natural pretendida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imagens poéticas concretas. “Eram banhados” evita a estranheza de atribuir ação reflexiva aos passos; “ao meu lado” mantém a ambiguidade espacial do hebraico, enquanto a possível leitura benefativa fica na nota.
