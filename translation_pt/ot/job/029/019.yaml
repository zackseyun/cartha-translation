  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: pt
  text: Minha raiz se estendia em direção às águas, e o orvalho passava a noite nos meus ramos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na minha colheita». O sentido da palavra hebraica neste contexto é incerto; «ramos» foi adotado por se ajustar melhor à imagem vegetal da raiz e do orvalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Minha raiz
  rationale: Mantém o singular morfológico com sufixo de primeira pessoa e conserva naturalmente a imagem vegetal em português.
- source_word: פָתוּחַ אֱלֵי מָיִם
  choice: se estendia até as águas
  rationale: O particípio descreve a raiz em estado aberto ou estendido na direção da água. A formulação comunica a imagem com naturalidade, sem reduzir o plural poético de מָיִם.
- source_word: וְטַל יָלִין
  choice: e o orvalho passava a noite
  rationale: Preserva o sentido temporal de לון, isto é, permanecer ou alojar-se durante a noite, em linguagem portuguesa clara e poética.
- source_word: בִּקְצִירִי
  choice: nos meus ramos
  rationale: Embora קָצִיר costume significar «colheita», neste contexto poético pode designar os ramos ou a folhagem. «Ramos» forma uma imagem vegetal coerente com a raiz e com o orvalho, enquanto a alternativa lexical mais comum é registrada em nota.
