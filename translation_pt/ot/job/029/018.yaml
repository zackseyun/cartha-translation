  text: וָ֭/אֹמַר עִם קִנִּ֣/י אֶגְוָ֑ע וְ֝/כַ/ח֗וֹל אַרְבֶּ֥ה יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: pt
  text: 'Então eu disse: “Morrerei no meu ninho e multiplicarei os meus dias como a areia.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “multiplicarei os meus dias como a fênix”. Alguns entendem a palavra hebraica traduzida como “areia” como o nome de uma ave neste versículo; porém, “areia” é o sentido mais provável no contexto e corresponde à imagem bíblica comum de uma quantidade muito grande.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu dizia
  rationale: O waw consecutivo dá sequência à recordação de Jó. O imperfeito português “dizia” expressa naturalmente o que ele pensava naquele período descrito no contexto, sem perder a progressão narrativa.
- source_word: עִם קִנִּי
  choice: no meu ninho
  rationale: Embora עִם normalmente signifique “com”, junto de “meu ninho” o sentido contextual é morrer em seu próprio lugar de segurança. “No meu ninho” preserva a metáfora poética e soa natural em português.
- source_word: אֶגְוָע
  choice: Morrerei
  rationale: O verbo significa morrer ou expirar. “Morrerei” é direto, claro e adequado ao registro poético.
- source_word: וְכַחוֹל
  choice: como a areia
  rationale: חוֹל significa normalmente “areia” e aqui evoca a imagem bíblica comum de quantidade muito grande. A interpretação minoritária como nome de uma ave é mantida em nota.
- source_word: אַרְבֶּה יָמִים
  choice: multiplicarei os meus dias
  rationale: O hifil de רבה comunica fazer aumentar ou tornar numerosos. A formulação conserva a força verbal e explicita naturalmente em português que se trata dos dias da vida de Jó.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora concreta do “ninho” e a imagem da “areia” foram preservadas. O imperfeito “eu dizia” enquadra a fala como expectativa habitual de Jó durante sua antiga prosperidade.
