  naturalness: '«E Jó continuou, retomando seu discurso, e disse» é excessivamente segmentado e apresenta uma combinação pouco natural: quem «continua» já está em andamento, enquanto «retoma» sugere recomeço. A formulação revisada é concisa, formal e clara.'
