  yaml_path: translation/ot/job/029/001.yaml
  text: And Job continued, taking up his discourse, and said:[a]
translation:
  language: pt
  text: Jó prosseguiu com seu discurso e disse:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu provérbio”, “sua parábola” ou “seu oráculo”. O termo hebraico mashal tem sentido amplo; aqui introduz o extenso discurso poético de Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: continuou
  rationale: O verbo יסף significa literalmente “acrescentar” e, nesta construção com infinitivo, comunica que Jó prosseguiu ou continuou a falar.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׂאֵת
  choice: retomando
  rationale: O infinitivo de נשׂא significa literalmente “levantar, tomar”; na expressão נשׂא משל, indica tomar a palavra ou proferir um discurso. “Retomando” preserva a ideia idiomática e evita a formulação pouco natural “levantando seu discurso”.
- source_word: מְשָׁלוֹ
  choice: seu discurso
  rationale: מָשָׁל possui amplo campo semântico, incluindo provérbio, parábola, pronunciamento e discurso. Aqui introduz uma fala poética extensa de Jó, por isso “discurso” se ajusta melhor ao contexto.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Tradução direta e natural da forma narrativa que introduz a fala seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural. A formulação conserva tanto a noção de continuidade em וַיֹּסֶף quanto a expressão idiomática de “tomar/retomar” o discurso em שְׂאֵת מְשָׁלוֹ, sem reproduzir uma redundância artificial.
