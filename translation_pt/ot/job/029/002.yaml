  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: pt
  text: Quem me dera[a] que eu estivesse como nos meses de outrora, como nos dias em que Deus velava por mim[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «Quem me dará...?». A expressão hebraica comunica um desejo: «Ah, se eu pudesse estar novamente como antes!»'
    reason: lexical_alternative
  - marker: b
    text: Ou «me guardava» ou «me protegia».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Quem me dera voltar
  rationale: A expressão hebraica, literalmente «Quem me dará...?», é uma fórmula de desejo ou lamento. «Quem me dera voltar» transmite esse desejo em português natural; «voltar» explicita de modo idiomático a ideia de recuperar a condição passada indicada pelas comparações temporais.
- source_word: כְיַרְחֵי קֶדֶם
  choice: aos meses de outrora
  rationale: יֶרַח significa «mês», e קֶדֶם tem aqui sentido temporal, referindo-se ao passado. «De outrora» preserva o tom poético e retrospectivo sem sugerir o sentido geográfico de «oriente».
- source_word: כִּימֵי
  choice: aos dias
  rationale: A segunda expressão temporal é paralela à primeira. Em português, a repetição de «voltar» ou de «como» seria desnecessária; «aos dias» mantém com clareza o paralelismo sem tornar a frase artificial.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a forma poética singular para «Deus», frequente em Jó. Não há base lexical neste versículo para acrescentar «Todo-Poderoso».
- source_word: יִשְׁמְרֵנִי
  choice: velava por mim
  rationale: O verbo שׁמר pode significar guardar, proteger ou vigiar. «Velava por mim» expressa cuidado protetor contínuo e combina com o registro poético do lamento.
theological_decisions:
- issue: A ação de Deus recordada por Jó
  choice: Deus velava por mim
  alternative: Deus me guardava / protegia
  rationale: A tradução comunica o cuidado protetor que Jó atribui a Deus no passado, sem definir o modo desse cuidado nem acrescentar uma formulação doutrinária além do hebraico.
translation_notes:
  register: Português moderno, claro e poético, com boa legibilidade brasileira. «Quem me dera» conserva o caráter emotivo do desejo; «outrora» dá dignidade ao lamento sem soar excessivamente arcaico. Os marcadores [a] e [b] aparecem no texto principal.
