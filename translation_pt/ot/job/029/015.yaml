base_translation:
  language: en
  yaml_path: translation/ot/job/029/015.yaml
  text: I was eyes to the blind[a], and feet to the lame.
translation:
  language: pt
  text: Eu era olhos para o cego[a] e pés para quem mancava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais dinâmica: “Eu era como olhos para o cego e como pés para quem mancava.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִם
  choice: olhos
  rationale: 'Mantém a imagem concreta e predicativa do hebraico: Jó supria, na prática, aquilo de que o cego necessitava.'
- source_word: הָיִיתִי
  choice: Eu era
  rationale: O qal perfeito descreve retrospectivamente o papel habitual de Jó; “eu era” é natural em português e preserva esse valor.
- source_word: לַעִוֵּר
  choice: para o cego
  rationale: A preposição ל indica relação ou benefício, e o singular adjetival tem sentido representativo; a formulação preserva a metáfora.
- source_word: וְרַגְלַיִם
  choice: e pés
  rationale: Conserva o paralelismo poético com “olhos” e a imagem de oferecer mobilidade e auxílio prático.
- source_word: לַפִּסֵּחַ
  choice: para o que não podia andar
  rationale: Expressa de modo claro e respeitoso a limitação de mobilidade indicada por פִּסֵּחַ, sem recorrer a um termo hoje potencialmente pejorativo.
- source_word: אָֽנִי
  choice: Eu
  rationale: O pronome independente reforça o sujeito. Em português, sua ênfase é suficientemente representada pelo “Eu” explícito no início, sem acrescentar uma expressão final artificial.
