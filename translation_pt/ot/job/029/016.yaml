base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: pt
  text: Eu era pai dos necessitados e investigava a causa que não conhecia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e investigava a causa de quem não conhecia”.'
    reason: O hebraico permite entender “não conhecia” como referência à causa desconhecida ou, por extensão, à pessoa desconhecida cuja causa Jó examinava.
lexical_decisions:
- source_word: אָב
  choice: pai
  rationale: Preserva a imagem literal e metafórica de cuidado, proteção e defesa, sem substituí-la por uma explicação interpretativa como “protetor”.
- source_word: אָנֹכִי
  choice: eu era
  rationale: O pronome independente dá ênfase ao sujeito; a oração nominal recebe o verbo “era” por causa do contexto passado e habitual de Jó 29.
- source_word: לָאֶבְיוֹנִים
  choice: dos necessitados
  rationale: אֶבְיוֹן designa pessoas pobres ou carentes. “Dos necessitados” é natural com “pai” em português e abrange sua vulnerabilidade econômica e social.
- source_word: וְרִיב
  choice: e ... a causa
  rationale: רִיב pode significar disputa, pleito ou processo. “Causa” conserva o sentido jurídico e combina naturalmente com a atuação de Jó em favor dos vulneráveis.
- source_word: לֹא יָדַעְתִּי
  choice: que eu não conhecia
  rationale: A construção pode qualificar a causa como desconhecida por Jó. Esta leitura segue de perto a ordem e a sintaxe mais direta do hebraico, sem excluir a possibilidade de referência à pessoa envolvida.
- source_word: אֶחְקְרֵהוּ
  choice: investigava
  rationale: חקר expressa busca ou exame cuidadoso. O imperfeito é vertido no passado habitual, de acordo com a recordação das práticas regulares de Jó; o sufixo masculino singular retoma “a causa”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a metáfora de “pai” e o tom jurídico de “causa”, preservando em nota a ambiguidade sintática do hebraico.
