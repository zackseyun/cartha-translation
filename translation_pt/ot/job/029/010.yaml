  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: pt
  text: A voz dos nobres se calou[a], e a língua deles ficou colada ao céu da boca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A voz dos príncipes se calou”. Literalmente, “as vozes dos nobres se ocultaram”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a língua deles aderiu ao palato”, expressão que indica que não podiam ou não queriam falar.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: voz
  rationale: No contexto, designa a fala dos homens de destaque, e não um som genérico.
- source_word: נְגִידִים
  choice: nobres
  rationale: O termo pode designar príncipes, líderes ou governantes; “nobres” preserva aqui a ideia ampla de elevada posição social sem pressupor um cargo monárquico específico.
- source_word: נֶחְבָּאוּ
  choice: se calava
  rationale: Embora o sentido básico do verbo seja “esconder-se”, aplicado à voz indica poeticamente que ela deixa de ser ouvida. “Se calava” comunica esse sentido com naturalidade.
- source_word: וּלְשׁוֹנָם
  choice: e a língua deles
  rationale: Mantém o singular coletivo do hebraico e soa natural em português.
- source_word: לְחִכָּם
  choice: ao céu da boca
  rationale: O substantivo denota o palato; “céu da boca” é a expressão corrente e clara em português.
- source_word: דָּבֵקָה
  choice: ficava colada
  rationale: O verbo significa “aderir” ou “ficar colado”. A formulação preserva a imagem concreta hebraica de incapacidade ou recusa de falar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A imagem poética da língua colada ao palato foi preservada em linguagem corrente, e a ambiguidade lexical dos títulos sociais e do verbo “esconder-se” foi registrada em nota.
