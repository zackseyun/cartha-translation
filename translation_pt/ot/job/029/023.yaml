  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: pt
  text: Esperavam por mim como se espera pela chuva, e escancaravam a boca para a chuva tardia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chuva da primavera”. O hebraico מַלְקוֹשׁ designa a chuva tardia, no fim da estação chuvosa; no ciclo agrícola da antiga terra de Israel, ela ocorria na primavera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: Esperavam
  rationale: O verbo יחל expressa espera acompanhada de expectativa ou esperança. “Esperavam” se ajusta à comparação com a chuva sem acrescentar uma carga emocional excessiva.
- source_word: כַמָּטָר
  choice: como pela chuva
  rationale: A preposição comparativa כְּ indica a maneira da espera; em português, “esperavam por mim como pela chuva” comunica naturalmente a expectativa por uma chuva necessária.
- source_word: לִי
  choice: por mim
  rationale: Mantém diretamente o pronome hebraico. Embora o contexto implique as palavras ou o conselho de Jó, isso não é explicitado no versículo.
- source_word: וּפִיהֶם
  choice: e ... a boca
  rationale: O hebraico traz “a boca deles”, com substantivo morfologicamente singular e sufixo plural. O português distributivo “abriam ... a boca” é natural e preserva o sentido coletivo.
- source_word: פָּעֲרוּ
  choice: abriam bem
  rationale: פער indica abrir amplamente, especialmente a boca. “Abriam bem a boca” preserva a imagem de modo claro e idiomático.
- source_word: לְמַלְקוֹשׁ
  choice: para a chuva da primavera
  rationale: מַלְקוֹשׁ designa a chuva tardia do ciclo agrícola, que cai na primavera na terra de Israel. A tradução comunica o referente climático a leitores modernos.
