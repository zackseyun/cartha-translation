  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: pt
  text: Os príncipes retinham suas palavras[a] e punham a mão sobre a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os nobres retinham a fala”.'
    reason: Alternativa lexical e idiomática para שָׂרִים e עָצְרוּ בְמִלִּים.
lexical_decisions:
- source_word: שָׂרִים
  choice: príncipes
  rationale: Designa pessoas de alta posição ou governantes. “Príncipes” preserva o status elevado e se ajusta à deferência pública descrita no contexto.
- source_word: עָצְרוּ
  choice: continham
  rationale: O verbo expressa restrição ou retenção; aqui, indica que eles se abstinham de falar.
- source_word: בְמִלִּים
  choice: suas palavras
  rationale: Embora a expressão seja literalmente “com/em palavras”, após עָצְרוּ ela se refere à fala que era contida. O possessivo implícito é explicitado para soar natural em português.
- source_word: וְכַף
  choice: a mão
  rationale: כַּף pode denotar a palma ou a mão. Na descrição convencional do gesto de silêncio, “a mão” é a formulação natural em português.
- source_word: יָשִׂימוּ
  choice: punham
  rationale: O imperfeito hebraico, dentro da recordação habitual de Jó 29, é bem representado pelo pretérito imperfeito português, indicando uma ação recorrente.
- source_word: לְפִיהֶם
  choice: sobre a boca
  rationale: Literalmente “à/sobre a boca deles”. A formulação comunica naturalmente o gesto de cobrir a boca e conserva o singular distributivo do hebraico.
