  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: pt
  text: Eles me escutavam e esperavam[a]; ficavam em silêncio diante do meu conselho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esperavam com expectativa”. O verbo também pode ter o sentido de esperar com esperança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficavam em silêncio em resposta ao meu conselho”. A frase final pode indicar o silêncio deles diante do conselho de Jó ou em relação a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: me ouviam
  rationale: A construção indica que Jó era o alvo da escuta. O imperfeito habitual em português combina com a retrospectiva do contexto e expressa atenção, não mera percepção auditiva.
- source_word: וְיִחֵלּוּ
  choice: esperavam
  rationale: O verbo יחל pode denotar esperar com expectativa ou ter esperança. “Esperavam” preserva a ação concreta e se ajusta ao paralelismo com ouvir e permanecer em silêncio.
- source_word: וְיִדְּמוּ
  choice: ficavam em silêncio
  rationale: דמם expressa silêncio ou quietude. A formulação portuguesa comunica uma atitude contínua e contida enquanto aguardavam as palavras de Jó.
- source_word: לְמוֹ עֲצָתִי
  choice: para ouvir meu conselho
  rationale: A preposição poética לְמוֹ relaciona o silêncio ao conselho de Jó. A explicitação moderada de “ouvir” produz português natural e entende o silêncio como espera pelo conselho, sem eliminar a leitura alternativa indicada em nota.
