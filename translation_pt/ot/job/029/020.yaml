  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: pt
  text: Minha glória permanecia sempre renovada comigo,[a] e o meu arco se renovava em minha mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha glória era nova comigo”. O adjetivo hebraico pode ser traduzido por “nova”, mas, neste contexto, provavelmente indica que ela permanecia renovada ou não se desvanecia.'
    reason: lexical_alternative
  - marker: b
    text: O “arco” provavelmente representa força ou vigor, embora o hebraico mantenha a imagem concreta.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: minha glória
  rationale: Preserva a imagem hebraica e sua amplitude semântica, que pode envolver honra, reputação e esplendor.
- source_word: חָדָשׁ
  choice: sempre renovada
  rationale: O adjetivo significa literalmente 'nova', mas, neste contexto poético, descreve a glória de Jó como continuamente viçosa ou não desvanecida. 'Sempre renovada' expressa essa continuidade com naturalidade.
- source_word: עִמָּדִי
  choice: permanecia ... comigo
  rationale: A expressão significa literalmente 'comigo'; o verbo 'permanecia' torna explícita em português a ideia contextual de que a glória continuava com Jó.
- source_word: קַשְׁתִּי
  choice: meu arco
  rationale: Mantém a imagem concreta do hebraico, ainda que o arco possa representar força ou vigor.
- source_word: בְּיָדִי
  choice: em minha mão
  rationale: Reproduz diretamente a expressão locativa hebraica e conserva a imagem de força disponível para uso.
- source_word: תַחֲלִיף
  choice: se renovava
  rationale: A forma verbal de חלף, neste contexto, comunica renovação contínua da força, em paralelo com a glória renovada, sem reduzir a expressão a mera substituição.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. A repetição de “renovada/se renovava” reflete a relação semântica entre os dois membros do verso. Os marcadores foram posicionados junto às expressões que explicam.
