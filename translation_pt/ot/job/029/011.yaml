  text: כִּ֤י אֹ֣זֶן שָׁ֭מְעָה וַֽ/תְּאַשְּׁרֵ֑/נִי וְ/עַ֥יִן רָ֝אֲתָ֗ה וַ/תְּעִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: pt
  text: Pois, ao ouvirem, chamavam-me feliz; ao me verem, davam testemunho a meu favor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «davam testemunho a meu respeito». O verbo hebraico pode significar «testemunhar» ou «dar testemunho»; no contexto, o testemunho é favorável a Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da honra que Jó desfrutava anteriormente e mantém com naturalidade a ligação causal-discursiva com o contexto.
- source_word: אֹזֶן שָׁמְעָה
  choice: quem me ouvia
  rationale: Transmite em português natural o uso genérico do singular hebraico, literalmente «um ouvido ouvia», sem perder a referência às pessoas que ouviam Jó ou ouviam falar dele.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: me chamava feliz
  rationale: O verbo declara Jó feliz, afortunado ou bem-aventurado. «Chamava feliz» preserva o caráter público dessa avaliação e evita restringir o sentido a uma emoção passageira.
- source_word: וְעַיִן רָאֲתָה
  choice: e quem me via
  rationale: Reproduz naturalmente o paralelismo com «quem me ouvia»; o hebraico emprega literalmente o olho como representação da pessoa que vê.
- source_word: וַתְּעִידֵנִי
  choice: dava testemunho a meu favor
  rationale: O verbo significa testemunhar ou atestar. O contexto indica um testemunho favorável sobre Jó, embora a construção também possa ser entendida de modo menos explícito como testemunho a respeito dele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A formulação «quem me ouvia... quem me via» evita a estranheza de personificar literalmente «ouvido» e «olho», ao mesmo tempo que conserva o paralelismo e o sentido genérico do hebraico.
