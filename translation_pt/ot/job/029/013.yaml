base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: pt
  text: A bênção daquele que estava perecendo veio sobre mim[a], e fiz o coração da viúva cantar de alegria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A bênção daquele que estava arruinado veio sobre mim”. O particípio hebraico pode indicar alguém que perecia, estava arruinado ou próximo da morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fiz o coração da viúva se alegrar” ou “gritar de alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: A bênção daquele que
  rationale: O estado construto de בְּרָכָה introduz uma relação genitiva com o particípio seguinte; esta formulação é natural em português.
- source_word: אֹבֵד
  choice: estava perecendo
  rationale: O particípio qal de אבד pode descrever alguém que perece, está arruinado ou próximo da morte. A construção progressiva preserva o caráter participial sem restringir indevidamente o tipo de perigo.
- source_word: עָלַי
  choice: sobre mim
  rationale: A preposição עַל com o sufixo de primeira pessoa combina com o verbo de movimento e conserva a imagem de a bênção vir sobre Jó.
- source_word: תָּבֹא
  choice: veio
  rationale: Embora seja formalmente um imperfeito, no retrospecto poético de Jó 29 tem valor passado; o pretérito perfeito é claro e natural.
- source_word: לֵב אַלְמָנָה
  choice: o coração da viúva
  rationale: Mantém a imagem hebraica do coração como centro da experiência interior e expressa naturalmente a relação construta.
- source_word: אַרְנִן
  choice: fiz ... cantar de alegria
  rationale: A forma hifil de רנן é causativa. A expressão comunica que Jó levou o coração da viúva a exteriorizar alegria, preservando tanto a causalidade quanto a imagem poética.
