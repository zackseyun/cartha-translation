  source_fidelity: 'A tradução reproduz com precisão a construção hebraica: a bênção do que perecia/estava em ruína veio sobre Jó, e ele fez o coração da viúva expressar alegria. “Veio sobre mim” preserva adequadamente עָלַי com o verbo de movimento, e “fiz ... cantar de alegria” comunica a força causativa do hifil אַרְנִן sem reduzir a imagem poética.'
