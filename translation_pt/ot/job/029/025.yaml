  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: pt
  text: Eu escolhia o caminho deles e me assentava como chefe[a]; habitava como um rei entre a tropa[b], como quem consola os enlutados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escolhia o rumo deles e me assentava à frente”. O hebraico pode indicar que Jó escolhia ou aprovava o caminho que os outros deviam seguir e então ocupava a posição de liderança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um rei entre um bando”. A palavra hebraica pode designar uma tropa, um bando ou um grupo.'
    reason: lexical_alternative
  - marker: c
    text: A comparação final é difícil no hebraico. Ela pode retratar Jó como alguém que consolava os enlutados, mesmo ocupando uma posição de honra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר
  choice: Eu escolhia
  rationale: O imperfeito qal na retrospectiva de Jó 29 pode expressar ação habitual no passado. O imperfeito português comunica que essa era a prática recorrente de Jó.
- source_word: דַּרְכָּם
  choice: o caminho deles
  rationale: Tradução direta de דֶּרֶךְ com sufixo de terceira pessoa masculina plural; preserva a possível ideia de escolher, aprovar ou determinar o rumo de outros.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: e me assentava como chefe
  rationale: Mantém a imagem concreta de sentar-se e expressa a posição de liderança indicada por רֹאשׁ.
- source_word: וְאֶשְׁכּוֹן
  choice: habitava
  rationale: שׁכן significa habitar, permanecer ou instalar-se. «Habitava» conserva o caráter poético sem soar excessivamente arcaico.
- source_word: כְּמֶלֶךְ
  choice: como um rei
  rationale: O prefixo כְּ marca comparação; a tradução mantém explicitamente o símile.
- source_word: בַּגְּדוּד
  choice: no meio da tropa
  rationale: גְּדוּד pode designar tropa, bando ou grupo. O singular «tropa» corresponde à forma hebraica, enquanto «no meio de» comunica naturalmente a posição destacada de Jó entre o grupo.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: como quem consola os que choram
  rationale: A construção é difícil, mas pode apresentar Jó como aquele que consola pessoas enlutadas. «Os que choram» é natural e mantém a referência a pessoas em luto sem restringi-la indevidamente a um contexto ritual.
