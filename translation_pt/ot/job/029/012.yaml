  text: כִּֽי אֲ֭מַלֵּט עָנִ֣י מְשַׁוֵּ֑עַ וְ֝/יָת֗וֹם וְֽ/לֹא עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: pt
  text: Pois eu livrava o pobre que clamava por socorro e o órfão[a] que não tinha quem o ajudasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que não tinha pai”. O termo hebraico designa mais especificamente uma pessoa sem pai e, portanto, socialmente vulnerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da honra descrita no contexto anterior e preserva a força explicativa da conjunção.
- source_word: אֲמַלֵּט
  choice: eu livrava
  rationale: O piel de מלט expressa uma ação efetiva de resgate. O imperfeito, no relato retrospectivo de Jó, descreve sua conduta habitual no passado.
- source_word: עָנִי
  choice: o pobre
  rationale: No contexto de justiça social, designa uma pessoa pobre e vulnerável; a formulação é clara e natural em português.
- source_word: מְשַׁוֵּעַ
  choice: que clamava por socorro
  rationale: A oração relativa reproduz naturalmente o particípio hebraico e comunica um clamor ativo e reiterado por ajuda.
- source_word: יָתוֹם
  choice: o órfão
  rationale: É a designação portuguesa mais natural para uma pessoa privada de proteção parental, embora o hebraico indique mais especificamente alguém sem pai; essa precisão é registrada em nota.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: que não tinha quem o ajudasse
  rationale: Expressa de modo idiomático a ausência de qualquer pessoa que prestasse auxílio ao órfão.
