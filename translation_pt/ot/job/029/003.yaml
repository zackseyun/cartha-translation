  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: pt
  text: 'quando a sua lâmpada brilhava sobre a minha cabeça,

    e à sua luz eu caminhava pela escuridão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e à luz dela eu caminhava na escuridão”. O sufixo hebraico em “à sua luz” pode referir-se a Deus, conforme o contexto, ou, mais imediatamente, à lâmpada.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: quando a sua lâmpada brilhava
  rationale: A preposição בְּ com o infinitivo construto tem valor temporal neste contexto de recordação. A formulação liga naturalmente o ato de brilhar à lâmpada e mantém o sufixo masculino como referência a Deus, seu possuidor.
- source_word: נֵרוֹ
  choice: a sua lâmpada
  rationale: נֵר designa concretamente uma lâmpada, não apenas a luz abstrata; a imagem concreta é preservada.
- source_word: עֲלֵי רֹאשִׁי
  choice: sobre a minha cabeça
  rationale: A expressão é espacial. “Sobre a minha cabeça” é clara e natural em português e conserva a imagem de uma lâmpada que ilumina do alto.
- source_word: לְאוֹרוֹ
  choice: à sua luz
  rationale: A preposição לְ indica aqui o meio ou a esfera em que Job caminhava. “À sua luz” é uma expressão idiomática em português; o sufixo pode apontar para Deus ou, mais imediatamente, para a lâmpada.
- source_word: אֵלֶךְ
  choice: eu caminhava
  rationale: Embora a forma seja um imperfeito hebraico, o contexto retrospectivo indica uma ação habitual ou contínua no passado; o pretérito imperfeito português expressa bem esse aspecto.
- source_word: חֹשֶׁךְ
  choice: pela escuridão
  rationale: Com um verbo de movimento, “pela escuridão” transmite o avanço em meio às trevas sem acrescentar artigo ausente no hebraico.
theological_decisions:
- issue: Referência dos sufixos masculinos em “sua lâmpada” e “sua luz”
  choice: No texto principal, os possessivos são entendidos como referência a Deus, cuja proteção e orientação Job recorda.
  alternative: 'Em “à sua luz”, o possessivo pode retomar mais imediatamente a lâmpada: “à luz dela”.'
  rationale: O contexto de Jó 29 apresenta Deus como aquele que cuidava de Job, favorecendo a referência pessoal. Contudo, a proximidade sintática de “lâmpada” torna possível o segundo referente; a nota preserva essa ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito mantém o tom nostálgico e habitual do discurso de Job; “lâmpada”, “luz” e “escuridão” preservam a sequência concreta e metafórica do hebraico.
