  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: pt
  text: Eu sorria para eles, e eles mal podiam acreditar nisso; não apagavam a luz do meu rosto.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu ria para eles”; o verbo hebraico pode indicar riso ou sorriso.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “eles não acreditavam” ou “não criam”.'
    reason: textual_ambiguity
  - marker: c
    text: 'Hebraico, literalmente: “não faziam cair a luz do meu rosto”; “a luz do rosto” representa uma expressão alegre ou favorável.'
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: Eu sorria
  rationale: O verbo שׂחק pode significar rir ou sorrir. Neste contexto, “sorria” expressa com naturalidade a atenção favorável e dignificante de Jó, sem sugerir zombaria, e combina com a imagem da luz do rosto.
- source_word: אֲלֵהֶם
  choice: para eles
  rationale: A preposição אֶל indica a direção do gesto; “sorria para eles” é a construção idiomática natural em português.
- source_word: לֹא יַאֲמִינוּ
  choice: mal podiam acreditar nisso
  rationale: Embora a formulação literal seja “não acreditavam”, o contexto pode indicar espanto diante do favor de Jó. A expressão escolhida comunica essa força idiomática sem eliminar a leitura literal, registrada em nota.
- source_word: וְאוֹר פָּנַי
  choice: a luz do meu rosto
  rationale: Mantém a metáfora hebraica de uma expressão luminosa, alegre ou favorável, em linguagem compreensível no português atual.
- source_word: לֹא יַפִּילוּן
  choice: não apagavam
  rationale: A forma causativa significa literalmente “não faziam cair”. Com “luz” como objeto, “não apagavam” preserva a imagem e comunica naturalmente que não faziam desaparecer a expressão favorável de Jó; a formulação literal é indicada em nota.
theological_decisions:
- issue: Sentido de לֹא יַאֲמִינוּ
  choice: mal podiam acreditar nisso
  alternative: não tinham confiança
  rationale: A frase pode descrever o espanto das pessoas diante do sorriso de Jó ou a falta de confiança delas. O contexto imediato e a construção com “sorrir para eles” favorecem o primeiro sentido, mas a alternativa permanece em nota para preservar a ambiguidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução principal usa equivalência ótima: conserva a metáfora da luz do rosto, mas evita o decalque pouco natural “fazer cair a luz”. As notas preservam as alternativas lexicais e sintáticas reais do hebraico.'
