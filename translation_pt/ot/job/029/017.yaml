base_translation:
  language: en
  yaml_path: translation/ot/job/029/017.yaml
  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: pt
  text: Eu quebrava as mandíbulas do injusto e arrancava a presa de seus dentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲשַׁבְּרָה
  choice: Eu quebrava
  rationale: O wayyiqtol integra a retrospectiva de Jó sobre sua conduta habitual no passado; em português, o imperfeito comunica naturalmente esse valor iterativo.
- source_word: מְתַלְּעוֹת
  choice: as presas
  rationale: O termo designa maxilares ou mandíbulas, mas, na imagem predatória, 'presas' expressa com clareza os dentes que agarram e retêm a vítima.
- source_word: עַוָּל
  choice: do injusto
  rationale: Designa aquele que pratica injustiça ou perversidade; 'injusto' é corrente, digno e adequado ao contraste moral do contexto.
- source_word: אַשְׁלִיךְ
  choice: arrancava
  rationale: Embora o verbo costume significar 'lançar' ou 'fazer sair', aqui descreve a retirada da presa dentre os dentes do opressor; 'arrancava' transmite idiomaticamente a ação de resgate sem alterar a imagem.
- source_word: טָרֶף
  choice: a vítima
  rationale: Literalmente, 'presa' ou aquilo que foi dilacerado. 'Vítima' evita a repetição sonora com 'presas' e explicita que a figura representa alguém resgatado da violência.
theological_decisions:
- issue: Natureza da declaração de Jó
  choice: Manter a fala como reivindicação de sua antiga atuação em favor dos oprimidos
  alternative: Converter a frase em máxima geral ou atribuir diretamente a ação a Deus
  rationale: A primeira pessoa e o contexto de Jó 29 apresentam a lembrança que Jó faz de sua própria conduta; a tradução não deve julgar nem reformular essa reivindicação.
- issue: Força da metáfora predatória
  choice: Preservar a imagem do injusto como predador e do oprimido como vítima retirada de seus dentes
  alternative: Parafrasear como punição do opressor e libertação do oprimido
  rationale: A metáfora concreta pertence ao texto hebraico e conserva sua intensidade poética e moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e usa o imperfeito para harmonizar com a retrospectiva habitual do capítulo.
