  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: pt
  text: Os jovens me viram e se retiraram[a]; os idosos se levantaram e ficaram de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se esconderam”. O verbo hebraico pode significar esconder-se; aqui, provavelmente expressa que os jovens recuavam respeitosamente na presença de Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: me viam
  rationale: Traduz diretamente ראה, com o aspecto habitual sugerido pelo contexto da recordação de Jó sobre sua antiga honra.
- source_word: נְעָרִים
  choice: os jovens
  rationale: Designa jovens do sexo masculino no contraste com os idosos; em português, «os jovens» é natural e suficientemente preciso no contexto.
- source_word: וְנֶחְבָּאוּ
  choice: e se retiravam
  rationale: O nifal de חבא significa literalmente esconder-se, mas aqui descreve provavelmente o recuo respeitoso dos jovens diante de Jó. A alternativa literal é preservada em nota.
- source_word: וִישִׁישִׁים
  choice: os idosos
  rationale: ישישים indica homens de idade avançada. «Os idosos» mantém o foco na idade sem sugerir o cargo formal que «anciãos» poderia implicar.
- source_word: קָמוּ
  choice: se levantavam
  rationale: 'Preserva a primeira ação de קום: erguer-se em sinal de respeito.'
- source_word: עָמָדוּ
  choice: permaneciam de pé
  rationale: Mantém a segunda ação distinta após «se levantavam», exprimindo que continuavam em pé, em vez de reduzir os dois verbos hebraicos a uma única ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. O imperfeito («viam», «retiravam», «levantavam», «permaneciam») apresenta ações habituais na lembrança de Jó. O marcador [a] aparece junto à expressão anotada.
