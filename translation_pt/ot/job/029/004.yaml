lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Preserva a força comparativa da lembrança iniciada no contexto e liga naturalmente o versículo ao desejo de Jó pelos dias passados.
- source_word: הָיִיתִי
  choice: eu era
  rationale: O perfeito de היה descreve retrospectivamente a condição de Jó; o pretérito imperfeito é natural em português para esse estado passado duradouro.
- source_word: בִּימֵי
  choice: nos dias do
  rationale: Mantém o idioma temporal hebraico de modo claro e corrente.
- source_word: חָרְפִּי
  choice: meu vigor
  rationale: חֹרֶף pode evocar o outono, a colheita e, por extensão, a plena maturidade ou fase florescente. “Meu vigor” comunica a condição próspera lembrada por Jó sem identificá-la indevidamente com juventude.
- source_word: בְּסוֹד
  choice: a intimidade com
  rationale: סוֹד abrange conselho confidencial, círculo íntimo e comunhão próxima. “A intimidade com Deus” preserva sobretudo a dimensão relacional, enquanto a alternativa mais literal ligada a conselho secreto é registrada em nota.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a tradução portuguesa normal de אֱלוֹהַּ; com “intimidade”, a relação é expressa naturalmente por “com Deus”.
- source_word: עֲלֵי
  choice: estava sobre
  rationale: Conserva a imagem espacial de uma presença ou favor divino estendido sobre a tenda, sem explicá-la como simples proteção.
- source_word: אָהֳלִי
  choice: a minha tenda
  rationale: Retém a imagem concreta hebraica; embora possa implicar casa e família, não a substitui por uma interpretação abstrata.
theological_decisions:
- issue: Sentido de בְּסוֹד אֱלוֹהַּ na antiga relação de Jó com Deus
  choice: “a intimidade com Deus”, expressando proximidade confidencial e favor divino
  alternative: “o conselho secreto de Deus” ou “a amizade de Deus”
  rationale: O campo semântico permite comunhão íntima e conselho confidencial. A formulação principal evita reduzir a expressão tanto a mera amizade quanto a uma revelação técnica, e a nota conserva a alternativa deliberativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece como continuação poética do versículo anterior. As imagens da estação de maturidade e da presença sobre a tenda são preservadas no texto ou nas notas.
