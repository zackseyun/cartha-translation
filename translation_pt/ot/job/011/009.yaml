  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: pt
  text: Sua medida é mais longa que a terra e mais larga que o mar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua extensão é mais longa que a terra e mais ampla que o mar”.'
    reason: Alternativa lexical para מִדָּהּ e para os adjetivos de dimensão.
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: mais longa
  rationale: Adjetivo feminino singular que concorda com מִדָּהּ; com מִן comparativo, a forma portuguesa natural é “mais longa que”.
- source_word: מֵאֶרֶץ
  choice: que a terra
  rationale: O מִן prefixado indica comparação, não separação. Em paralelismo cósmico com “o mar”, אֶרֶץ é bem traduzido por “a terra”.
- source_word: מִדָּהּ
  choice: sua medida
  rationale: מִדָּה pode designar medida, dimensão ou extensão. “Sua medida” preserva o substantivo concreto e a referência feminina retomada do contexto anterior.
- source_word: וּרְחָבָה
  choice: e mais larga
  rationale: Adjetivo feminino singular paralelo a אֲרֻכָּה; o comparativo explícito comunica claramente a construção hebraica.
- source_word: מִנִּי יָם
  choice: que o mar
  rationale: מִנִּי é forma poética de מִן com valor comparativo, e יָם significa normalmente “mar”; a escolha preserva a imagem e o paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura paralela e a imagem cósmica do hebraico foram preservadas.
