base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: pt
  text: Se ele passar e prender alguém, e convocar uma assembleia[a], quem poderá fazê-lo voltar[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Convocar uma assembleia” também pode ser traduzido por “reunir” ou “congregar”, possivelmente com sentido judicial.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quem poderá desfazer isso?” O hebraico pode ser entendido como fazer o próprio agente voltar ou, de modo mais geral, reverter sua ação.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva o valor condicional ou hipotético da partícula hebraica no argumento retórico de Zofar.
- source_word: יַחֲלֹף
  choice: passar
  rationale: Traduz o sentido básico de חלף, “passar” ou “atravessar”, sem acrescentar uma ideia destrutiva que o verbo não exige.
- source_word: וְיַסְגִּיר
  choice: e prender alguém
  rationale: O hifil de סגר pode significar “fechar”, “entregar” ou “aprisionar”. “Prender alguém” comunica com naturalidade a ação concreta; “alguém” explicita apenas o objeto indefinido implícito no hebraico.
- source_word: וְיַקְהִיל
  choice: e convocar uma assembleia
  rationale: O hifil de קהל significa fazer reunir, congregar ou convocar. A formulação preserva o caráter causativo e a possível dimensão pública ou judicial.
- source_word: וּמִי
  choice: quem
  rationale: A conjunção e o interrogativo introduzem a consequência retórica. Em português, “quem” após a sequência condicional expressa essa relação naturalmente, sem necessidade de traduzir a conjunção separadamente.
- source_word: יְשִׁיבֶנּוּ
  choice: poderá fazê-lo voltar
  rationale: O hifil de שוב significa fazer voltar ou levar de volta. O sufixo masculino singular é mantido pessoalmente em “-lo”, apontando de modo natural para o sujeito das ações.
theological_decisions:
- issue: Referente dos verbos no masculino singular e do sufixo final
  choice: 'O sujeito é Deus, e o sufixo final é traduzido pessoalmente: “fazê-lo voltar”.'
  alternative: 'O sufixo pode ser entendido de maneira mais abstrata: “quem poderá desfazer isso?”, isto é, reverter o que Deus fez.'
  rationale: O contexto mais amplo trata do conhecimento e da ação soberana de Deus. A leitura pessoal acompanha a sintaxe imediata e conserva a força da pergunta retórica, enquanto a possível leitura abstrata é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação mantém a estrutura condicional e a pergunta retórica do hebraico, explicitando somente o objeto indefinido exigido pela naturalidade de “prender” em português.
