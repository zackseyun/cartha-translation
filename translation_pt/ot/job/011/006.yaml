  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: pt
  text: e lhe revelasse as coisas ocultas da sabedoria[a], pois a verdadeira sabedoria tem dois lados[b]. Saiba, então, que Deus não leva em conta parte da sua iniquidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os segredos da sabedoria».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «pois ela é dupla em relação à sabedoria sólida». A expressão indica que a sabedoria é mais complexa ou multifacetada do que parece.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «Deus exige de você menos do que a sua culpa merece»; ou ainda: «Deus se esqueceu de parte da sua iniquidade». O verbo hebraico é difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד
  choice: e lhe revelasse
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. Como a oração continua o desejo expresso no contexto anterior, o subjuntivo «revelasse» comunica naturalmente essa relação em português.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: as coisas ocultas da sabedoria
  rationale: Preserva o plural concreto de תעלמות e sua relação com «sabedoria», sem limitar o sentido a segredos verbalmente confidenciados.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: a verdadeira sabedoria tem dois lados
  rationale: כפלים expressa dualidade, enquanto תושיה designa sabedoria sólida ou eficaz. «Tem dois lados» mantém a imagem e sugere uma realidade mais complexa do que parece, sem recorrer ao pouco natural «é dupla para a sabedoria».
- source_word: וְדַע
  choice: Saiba, então
  rationale: Traduz o imperativo e explicita de modo natural sua função conclusiva no discurso.
- source_word: יַשֶּׁה לְךָ ... מֵעֲוֺנֶךָ
  choice: Deus não leva em conta parte da sua iniquidade
  rationale: O verbo é difícil e pode relacionar-se a esquecer, fazer esquecer ou deixar de cobrar. No contexto da acusação de Zofar, a formulação comunica que Deus não exige de Jó tudo o que sua culpa mereceria, sem ocultar a incerteza lexical, registrada em nota.
- source_word: אֱלוֹהַ
  choice: Deus
  rationale: É a forma poética singular para Deus e não justifica uma ampliação como «Deus Todo-Poderoso».
theological_decisions:
- issue: A afirmação de Zofar sobre como Deus trata Jó
  choice: Zofar afirma que Deus deixa sem levar em conta parte da iniquidade de Jó
  alternative: Deus faz Jó esquecer sua iniquidade; ou Deus exige de Jó menos do que sua culpa merece
  rationale: O contexto favorece uma acusação segundo a qual Jó recebe menos punição do que mereceria. A tradução apresenta fielmente a fala de Zofar sem endossá-la como juízo divino ou doutrina do livro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «lhe» e «sua» de maneira natural; preserva a imagem da dualidade da sabedoria e põe a dificuldade do último verbo em nota, sem resolver indevidamente a ambiguidade.
