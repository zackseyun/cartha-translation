  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: pt
  text: 'Pois você diz: “Meu ensino[a] é puro, e sou limpo aos teus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha instrução” ou “meu discurso”. O substantivo hebraico pode referir-se ao que alguém recebeu ou apresentou como ensino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: você diz
  rationale: O wayyiqtol de אמר dirige-se a Jó. Embora a forma possa ser traduzida no passado, o presente expressa naturalmente a alegação que Zofar atribui a Jó no debate em curso.
- source_word: זַךְ
  choice: puro
  rationale: O adjetivo significa puro ou limpo. “Puro” combina naturalmente com “ensino” e evita repetir “limpo” na segunda oração.
- source_word: לִקְחִי
  choice: meu ensino
  rationale: O substantivo לקח pode indicar aquilo que se recebe ou transmite como ensino, instrução ou exposição. “Meu ensino” comunica de modo claro o conteúdo da posição apresentada por Jó, sem reduzi-lo a meras palavras.
- source_word: וּבַר
  choice: e sou limpo
  rationale: בַּר denota o que é limpo ou puro. “Limpo” preserva a metáfora hebraica e distingue este adjetivo de זַךְ, embora ambos tenham sentidos próximos.
- source_word: הָיִיתִי
  choice: sou
  rationale: Embora seja formalmente o perfeito de היה na primeira pessoa, dentro da afirmação citada descreve de maneira natural um estado alegado como presente.
- source_word: בְעֵינֶיךָ
  choice: aos teus olhos
  rationale: Mantém a imagem idiomática hebraica de avaliação segundo o olhar de alguém e preserva a segunda pessoa masculina singular, entendida no discurso citado como dirigida a Deus.
theological_decisions:
- issue: Referente da segunda pessoa singular em “aos teus olhos”
  choice: Deus, como destinatário da alegação citada
  alternative: O interlocutor humano de modo mais geral
  rationale: Zofar parece resumir Jó como alguém que alega estar limpo diante de Deus. A tradução conserva a segunda pessoa singular sem inserir uma explicação interpretativa no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” torna natural a fala de Zofar dirigida a Jó; dentro da citação, “teus” preserva a forma singular e distingue a fala atribuída a Jó como dirigida a Deus. A formulação mantém a tensão entre “puro” e “limpo”, sem transformar explicitamente a segunda expressão em uma declaração jurídica de inocência.
