  text: וּֽ֭/מִ/צָּהֳרַיִם יָק֣וּם חָ֑לֶד תָּ֝עֻ֗פָ/ה כַּ/בֹּ֥קֶר תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: pt
  text: Sua vida[a] se erguerá mais luminosa que o meio-dia[b]; mesmo que haja escuridão[c], ela se tornará como a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “duração da vida” ou, em sentido mais amplo, “existência terrena”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Sua vida será mais luminosa que o meio-dia; a escuridão será como a manhã”. O hebraico emprega expressões poéticas condensadas, sobretudo na segunda linha.'
    reason: alternative_reading
  - marker: c
    text: O raro termo hebraico traduzido como “escuridão” é incerto; outras possibilidades incluem “trevas” ou “obscuridade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: mais luminosa que o meio-dia
  rationale: A preposição מִן pode indicar comparação. No contexto da imagem poética, a vida de Jó é descrita como superando o brilho do meio-dia; “meio-dia” é a expressão portuguesa natural.
- source_word: יָקוּם
  choice: se erguerá
  rationale: Preserva a imagem de קום, “levantar-se/erguer-se”, sem reduzir o verbo apenas a “ser” ou “tornar-se”.
- source_word: חָלֶד
  choice: sua vida
  rationale: חָלֶד pode designar a duração da vida ou a existência terrena. “Sua vida” é claro e natural em português, enquanto a nota conserva o alcance temporal do termo.
- source_word: תָּעֻפָה
  choice: mesmo que haja escuridão
  rationale: O termo raro e difícil é entendido no contraste poético com “manhã” como escuridão ou trevas. A formulação concessiva explicita com naturalidade a relação implícita entre as duas imagens, sem ocultar a incerteza lexical.
- source_word: כַּבֹּקֶר
  choice: como a manhã
  rationale: Mantém o sentido comparativo de כ e traduz בֹּקֶר diretamente como “manhã”, preservando a imagem do retorno da luz.
- source_word: תִּהְיֶה
  choice: ela se tornará
  rationale: Embora היה possa significar simplesmente “ser”, “se tornará” comunica aqui a passagem poética da escuridão para uma condição semelhante à manhã. O pronome retoma “escuridão”.
