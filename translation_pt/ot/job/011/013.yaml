  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: pt
  text: Se você preparar seu coração e estender as mãos para ele,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estender a mão para ele”. O hebraico emprega no singular o substantivo que significa “palma” ou “mão”, mas a expressão normalmente se refere ao gesto de oração com as mãos estendidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição e preserva o caráter condicional da exortação de Zofar.
- source_word: אַתָּה
  choice: você
  rationale: O pronome de segunda pessoa singular dirige a fala diretamente a Jó; em português, fica expresso na forma natural da oração.
- source_word: הֲכִינוֹתָ
  choice: preparar
  rationale: O hifil de כון comunica tornar firme, dispor ou deixar pronto; “preparar” é claro e não especifica em excesso a ação interior.
- source_word: לִבֶּךָ
  choice: o coração
  rationale: לֵב designa a pessoa interior, incluindo pensamento e vontade. “Coração” preserva a imagem hebraica; com “você”, o artigo definido é idiomático em português e indica naturalmente posse.
- source_word: וּפָרַשְׂתָּ
  choice: e estender
  rationale: פרשׂ significa abrir, estender ou desdobrar; no contexto de oração, “estender” comunica naturalmente o gesto.
- source_word: אֵלָיו
  choice: para ele
  rationale: Mantém o pronome masculino singular e a direção do gesto sem substituir o pronome pelo nome explícito de Deus.
- source_word: כַּפֶּךָ
  choice: as mãos
  rationale: Embora כַּף esteja no singular (“palma/mão”), a expressão descreve o gesto de oração que em português é normalmente formulado no plural, “estender as mãos”.
theological_decisions:
- issue: Referente do pronome em אֵלָיו
  choice: O pronome é mantido como “para ele”, sendo Deus o referente contextual.
  alternative: Explicitar “para Deus” ou usar “em direção a ele”.
  rationale: O contexto identifica Deus como referente, mas o hebraico emprega um pronome. A tradução preserva essa forma e evita acrescentar uma especificação nominal ausente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura condicional, a imagem do coração e o pronome cujo referente é dado pelo contexto.
