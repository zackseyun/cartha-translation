lexical_decisions:
- source_word: כִּי אָז
  choice: Pois então
  rationale: Expressa de modo natural tanto a relação consequencial com a condição anterior quanto o momento futuro resultante.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: você levantará o rosto
  rationale: Preserva a imagem hebraica de confiança restaurada e ausência de desonra, mantendo boa compreensão em português.
- source_word: מִמּוּם
  choice: sem mancha
  rationale: מוּם denota defeito ou mancha; aqui tem força metafórica. A tradução conserva a imagem sem restringi-la explicitamente à vergonha ou à culpa.
- source_word: וְהָיִיתָ מֻצָק
  choice: estará firme
  rationale: Comunica o estado resultante de solidez, estabilidade ou segurança sugerido pelo particípio מֻצָק.
- source_word: וְלֹא תִירָא
  choice: e não terá medo
  rationale: Tradução direta, natural e corrente da negação futura do verbo ירא.
