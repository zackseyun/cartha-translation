  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: pt
  text: Você consegue sondar as profundezas de Deus? Consegue alcançar o limite do Todo-Poderoso?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Você consegue descobrir o que pode ser investigado acerca de Deus?» O hebraico חֵקֶר pode se referir à investigação, à busca ou àquilo que é investigado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o fim», «a plena extensão» ou «a perfeição do Todo-Poderoso», em vez de «o limite do Todo-Poderoso».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: sondar as profundezas
  rationale: חֵקֶר pode indicar investigação ou aquilo que é investigado até o fundo. A expressão portuguesa comunica naturalmente a tentativa de perscrutar o que está além do alcance humano, sem eliminar a ambiguidade lexical.
- source_word: אֱלוֹהַ
  choice: Deus
  rationale: Equivalente direto e corrente do título divino singular, em paralelo com שַׁדַּי.
- source_word: תִּמְצָא
  choice: consegue sondar
  rationale: Embora מצא signifique literalmente «encontrar», junto de חֵקֶר aponta para o êxito de uma investigação. «Consegue sondar» produz uma pergunta retórica natural em português.
- source_word: אִם
  choice: Consegue
  rationale: Neste paralelismo, אִם introduz a segunda pergunta retórica, e não uma condição. A repetição de «Consegue» reproduz essa função.
- source_word: עַד תַּכְלִית
  choice: alcançar os limites
  rationale: A combinação exprime chegar ao extremo, fim ou plena extensão. «Alcançar os limites» conserva a imagem espacial e funciona com naturalidade em português.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução tradicional, clara e contextual do título divino Shaddai.
- source_word: תִּמְצָא
  choice: alcançar
  rationale: No segundo membro, «alcançar» se ajusta idiomaticamente à ideia de chegar ao extremo ou à plena extensão, embora o verbo hebraico seja o mesmo do primeiro membro.
theological_decisions:
- issue: Linguagem sobre a possibilidade humana de compreender Deus
  choice: As perguntas retóricas negam a capacidade humana de sondar Deus exaustivamente ou alcançar toda a sua extensão.
  alternative: Entender o verso como negação absoluta de qualquer conhecimento verdadeiro de Deus.
  rationale: O hebraico enfoca a incapacidade de chegar às profundezas e ao extremo de Deus; não afirma que Deus seja totalmente incognoscível. A tradução mantém essa tensão sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo interrogativo foi preservado; «sondar» e «alcançar» evitam uma formulação rígida, enquanto as notas registram a amplitude dos substantivos hebraicos.
