  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: pt
  text: Pois ele conhece os que vivem na falsidade; quando vê a maldade, acaso não presta atenção[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não presta atenção” ou “e não considera”. A oração final em hebraico pode ser lida como uma negação simples, mas o contexto favorece fortemente a pergunta retórica: “acaso não presta atenção?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a afirmação de Zofar e mantém com naturalidade o encadeamento argumentativo.
- source_word: הוּא
  choice: ele
  rationale: Refere-se a Deus no contexto; a minúscula segue o uso normal do português, sem acrescentar uma distinção ausente no hebraico.
- source_word: יָדַע
  choice: conhece
  rationale: O perfeito expressa aqui um conhecimento estabelecido e geral de Deus; o presente comunica adequadamente esse valor gnômico.
- source_word: מְתֵי שָׁוְא
  choice: as pessoas falsas
  rationale: A expressão designa pessoas caracterizadas por שָׁוְא, termo que pode indicar falsidade, vazio ou inutilidade. Esta formulação preserva o sentido moral sem sugerir que elas não tenham valor humano.
- source_word: וַיַּרְא
  choice: quando vê
  rationale: A relação temporal torna natural em português a sequência com a pergunta retórica seguinte, sem alterar o sentido básico de ver.
- source_word: אָוֶן
  choice: a maldade
  rationale: No contexto, o termo aponta para conduta moralmente má, embora também possa incluir a desgraça ou o dano que ela produz.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: será que não presta atenção?
  rationale: Entendido como pergunta retórica, o verbo comunica observar atentamente ou tomar conhecimento. A expressão portuguesa é atual e preserva a força enfática da leitura contextual.
theological_decisions:
- issue: Força da oração final וְלֹא יִתְבּוֹנָן
  choice: 'Pergunta retórica: “será que não presta atenção?”'
  alternative: 'Negação declarativa: “e não presta atenção” ou “e não o considera”.'
  rationale: O hebraico permite formalmente uma negação simples, mas o argumento de Zofar enfatiza que Deus conhece as pessoas falsas e vê a maldade; por isso, a pergunta retórica se ajusta melhor ao contexto. A leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pessoas falsas” evita o masculino genérico desnecessário e também a implicação desumanizadora de “pessoas sem valor”. A pergunta “será que não...?” sinaliza de modo natural sua força retórica.
