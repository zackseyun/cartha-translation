  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: pt
  text: É mais alta que os céus — o que você pode fazer? Mais profunda que o Sheol[a] — o que você pode saber?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a sepultura” ou “o mundo dos mortos”. Hebraico: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: mais alta que os céus
  rationale: A expressão poética indica uma altura celeste inalcançável e retoma implicitamente aquilo que se pode descobrir acerca de Deus no versículo anterior. A formulação comparativa produz em português um paralelismo natural com “mais profunda que o Sheol”.
- source_word: מַה
  choice: o que
  rationale: O pronome interrogativo introduz perguntas retóricas em ambos os membros do verso; “o que” preserva sua força direta.
- source_word: תִּפְעָל
  choice: você pode fazer
  rationale: O imperfeito qal de פעל significa “fazer, realizar”. No contexto, a pergunta trata da capacidade humana, por isso “pode fazer” comunica melhor a força modal.
- source_word: עֲמֻקָּה
  choice: mais profunda
  rationale: O adjetivo feminino singular, com referente implícito retomado do contexto, forma o contraste poético com a altura dos céus. O comparativo é exigido de modo claro pelo מִן seguinte.
- source_word: מִשְּׁאוֹל
  choice: que o Sheol
  rationale: A preposição מִן marca a comparação. Mantém-se “Sheol” para não reduzir o termo apenas à sepultura nem definir em excesso a concepção hebraica do mundo dos mortos.
- source_word: תֵּדָע
  choice: você pode saber
  rationale: O imperfeito qal de ידע significa “saber, conhecer”. Em paralelo com “pode fazer”, expressa retoricamente o limite da capacidade humana.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: Aqui o termo funciona como imagem poética da profundidade extrema. A transliteração preserva sua amplitude conceitual, enquanto a nota oferece equivalentes explicativos sem impor uma identificação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. Emprega-se “você” por sua ampla legibilidade brasileira; a ordem das perguntas conserva a força retórica do hebraico.
