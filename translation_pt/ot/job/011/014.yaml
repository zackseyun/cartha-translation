  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: pt
  text: Se houver iniquidade em sua mão[a], afaste-a para longe e não deixe a injustiça habitar em suas tendas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se houver maldade sob o seu controle, remova-a.”'
    reason: lexical_alternative
  - marker: b
    text: “Suas tendas” se refere à esfera doméstica ou à vida do seu lar.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Se houver
  rationale: Introduz uma condição. A forma com “houver” torna explícita em português a ideia elíptica de existência, sem alterar a força condicional do hebraico.
- source_word: אָוֶן
  choice: iniquidade
  rationale: Neste contexto de exortação moral, o termo indica maldade ou conduta perversa. “Iniquidade” conserva seu peso ético e permite distingui-lo do termo paralelo עַוְלָה.
- source_word: בְּיָדְךָ
  choice: em sua mão
  rationale: Mantém a imagem concreta do hebraico, que pode indicar algo praticado, possuído ou sob o controle da pessoa.
- source_word: הַרְחִיקֵהוּ
  choice: afaste-a para longe
  rationale: O imperativo causativo exige uma ação deliberada de remoção, enquanto “para longe” preserva a ideia explícita de distanciamento.
- source_word: וְאַל
  choice: e não
  rationale: Representa de modo natural a conjunção seguida da partícula negativa que introduz a proibição.
- source_word: תַּשְׁכֵּן
  choice: deixe ... habitar
  rationale: O verbo deriva de שכן, “habitar, estabelecer-se”. Sob negação, a construção expressa a proibição de permitir que algo permaneça instalado.
- source_word: בְּאֹהָלֶיךָ
  choice: em suas tendas
  rationale: Preserva o plural e a ambientação concreta do hebraico, embora a expressão também abranja a esfera doméstica da pessoa.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O termo designa injustiça ou ação errada. “Injustiça” mantém o sentido ético e a variação vocabular do paralelismo poético.
theological_decisions:
- issue: Terminologia moral no paralelismo poético
  choice: 'Traduzir אָוֶן e עַוְלָה por termos éticos distintos, mas relacionados: “iniquidade” e “injustiça”.'
  alternative: Usar o mesmo termo para ambos ou traduzir ambos genericamente por “mal”.
  rationale: A escolha preserva a variedade lexical do hebraico e seu paralelismo sem impor uma distinção teológica técnica entre os dois tipos de pecado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A imagem hebraica da mão e o plural concreto “tendas” foram preservados no texto, com esclarecimentos em notas.
