  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: pt
  text: Você estará confiante, porque há esperança; examinará ao redor e se deitará em segurança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: Você estará confiante
  rationale: O verbo בטח expressa aqui a confiança ou sensação de segurança resultante da existência de esperança. “Estará confiante” é natural em português e evita sugerir uma garantia objetiva além do que o contexto afirma.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: porque há esperança
  rationale: Preserva de modo direto o valor causal de כִּי e o sentido comum de תִּקְוָה como “esperança”.
- source_word: וְחָפַרְתָּ
  choice: depois de examinar ao redor
  rationale: חפר significa literalmente “cavar”, mas neste contexto pode indicar examinar ou preparar o lugar antes de repousar. A expressão mantém essa ação contextual sem impor uma preparação específica.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: A expressão adverbial indica segurança e combina naturalmente com “deitar-se” em português.
- source_word: תִּשְׁכָּב
  choice: você se deitará
  rationale: Preserva a imagem concreta do verbo שׁכב, sem substituí-la pela interpretação mais geral “descansará”.
