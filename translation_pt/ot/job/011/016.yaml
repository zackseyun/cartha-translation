  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: pt
  text: Pois você se esquecerá do seu sofrimento; você se lembrará dele como de águas que já passaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você se lembrará dele apenas como de água que passou”. A imagem hebraica compara o sofrimento anterior a águas que já se foram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão ligada à promessa dos versículos anteriores, sem acrescentar uma ênfase ausente do contexto.
- source_word: אַתָּה
  choice: você
  rationale: Representa o pronome explícito de segunda pessoa masculina singular e conserva sua ênfase, com ampla legibilidade no português brasileiro.
- source_word: עָמָל
  choice: sofrimento
  rationale: O substantivo pode indicar aflição, desgraça, fadiga ou dificuldade. Aqui, “sofrimento” expressa de modo natural a experiência dolorosa que ficará para trás.
- source_word: תִּשְׁכָּח
  choice: se esquecerá
  rationale: O imperfeito qal de segunda pessoa masculina singular tem sentido futuro no contexto.
- source_word: כְמַיִם
  choice: como de águas
  rationale: A preposição כְּ estabelece a comparação, e o plural “águas” conserva a forma e a imagem poética hebraicas. A construção “lembrar-se dele como de” é idiomática em português.
- source_word: עָבְרוּ
  choice: já passaram
  rationale: O perfeito descreve águas que passaram e já não estão presentes; “já” evidencia naturalmente esse aspecto concluído.
- source_word: תִזְכֹּר
  choice: vai se lembrar dele
  rationale: O imperfeito qal tem sentido futuro. “Dele” explicita em português o referente implícito, o sofrimento, sem resolver além do necessário a comparação poética.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com preferência por “você” para legibilidade brasileira. O paralelismo foi preservado com ponto e vírgula, e a imagem das águas foi mantida sem explicação dentro do versículo.
