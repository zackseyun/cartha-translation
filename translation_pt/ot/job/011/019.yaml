  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
translation:
  language: pt
  text: Você se deitará, e ninguém o fará temer; muitos buscarão o seu favor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “muitos suplicarão o seu rosto”; uma expressão idiomática que significa buscar o seu favor.
