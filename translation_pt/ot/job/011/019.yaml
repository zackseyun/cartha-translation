lexical_decisions:
- source_word: רָבַצְתָּ
  choice: você se deitará
  rationale: Traduz diretamente a imagem de deitar-se ou repousar, que neste contexto sugere descanso seguro sem reduzir o verbo simplesmente a 'dormir'.
- source_word: מַחֲרִיד
  choice: o fará temer
  rationale: O particípio causativo descreve alguém que provoca tremor ou medo. A formulação é clara e preserva a relação com וְאֵין, 'ninguém'.
- source_word: חִלּוּ פָנֶיךָ
  choice: buscarão o seu favor
  rationale: A expressão idiomática significa procurar obter o favor de alguém ou suplicar-lhe. A tradução comunica o sentido relacional em português natural sem reproduzir literalmente 'seu rosto' no corpo do texto.
- source_word: רַבִּים
  choice: muitos
  rationale: Representa de modo direto o grande número de pessoas indicado pelo substantivo adjetival hebraico.
- source_word: וְאֵין
  choice: e ninguém
  rationale: Preserva de forma concisa e idiomática a conjunção seguida da negação existencial hebraica.
