base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: pt
  text: Será que suas palavras vazias farão as pessoas se calarem[a], e você zombará sem que ninguém o envergonhe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas bravatas”, “sua tagarelice” ou “suas mentiras”. O termo hebraico pode indicar fala vazia, ociosa, pretensiosa ou falsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: suas palavras vazias
  rationale: O substantivo pode designar fala vazia, ociosa, pretensiosa ou falsa. A escolha preserva o tom de censura sem afirmar de modo inequívoco que se trata de mentiras.
- source_word: מְתִים
  choice: as pessoas
  rationale: O plural refere-se aqui, de modo geral, aos seres humanos que ouviriam o discurso de Jó; “as pessoas” é natural e abrangente em português atual.
- source_word: יַחֲרִישׁו
  choice: farão ... se calar
  rationale: A forma verbal admite valor causativo, aqui expresso naturalmente pela construção “fazer ... se calar”.
- source_word: וַתִּלְעַג
  choice: Você zombará
  rationale: O verbo significa zombar ou escarnecer. A coordenação poética foi vertida como uma segunda pergunta retórica, sem acrescentar uma relação temporal que não é explícita no hebraico.
- source_word: מַכְלִם
  choice: o envergonhe
  rationale: O particípio causativo expressa causar vergonha ou desonra; “envergonhar” conserva essa força interpessoal sem reduzi-la a mera repreensão.
