lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa responder; a escolha preserva o sentido convencional e introduz naturalmente a réplica de Zofar.
- source_word: צֹפַר
  choice: Zofar
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: הַנַּעֲמָתִי
  choice: o naamatita
  rationale: O gentílico identifica Zofar por sua origem ou associação com Naamá; “naamatita” preserva de modo conciso a forma do hebraico e o uso bíblico estabelecido em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: אמר integra a fórmula narrativa hebraica. Manter “respondeu e disse” reproduz a sequência dos dois verbos sem prejudicar a clareza em português.
