base_translation:
  language: en
  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: pt
  text: Será que tantas palavras ficarão sem resposta? E será que um homem de lábios[a] terá razão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica “homem de lábios” descreve alguém caracterizado pela fala, provavelmente alguém que fala demais ou cuja fala é vazia. Outra tradução possível da oração: “E será justificado um homem de lábios?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: tantas palavras
  rationale: Expressa naturalmente a grande quantidade de palavras e, no contexto da pergunta retórica, sugere fala excessiva sem acrescentar uma qualificação ausente do hebraico.
- source_word: לֹא יֵעָנֶה
  choice: ficarão sem resposta
  rationale: O nifal de ענה tem aqui sentido passivo, “ser respondido”; a formulação portuguesa é idiomática e preserva a pergunta retórica.
- source_word: וְאִם
  choice: E será que
  rationale: Introduz a segunda pergunta retórica paralela. A formulação mantém a coordenação e comunica sua força melhor do que um condicional literal com “se”.
- source_word: אִישׁ שְׂפָתַיִם
  choice: um homem de lábios
  rationale: Mantém a imagem hebraica incomum, na qual “lábios” representa a fala e caracteriza alguém dado a palavras; a nota esclarece o idioma.
- source_word: יִצְדָּק
  choice: terá razão
  rationale: 'No qal, צדק tem aqui sentido avaliativo ou forense: estar certo, mostrar-se no direito. “Terá razão” é claro em português atual e evita associações teológicas desnecessárias de “ser justificado”.'
theological_decisions:
- issue: Sentido de יִצְדָּק
  choice: terá razão
  alternative: será justificado / será considerado justo
  rationale: O contexto é uma contestação verbal sobre quem está certo, não uma formulação técnica da doutrina da justificação; a tradução preserva o sentido forense cotidiano sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção retórica natural. Conservou-se no texto a imagem hebraica “homem de lábios”, embora incomum em português, e seu sentido provável foi explicado em nota.
