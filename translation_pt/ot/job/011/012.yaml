  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: pt
  text: Mas um homem sem juízo adquirirá entendimento quando a cria de um jumento selvagem nascer homem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “um homem vazio obterá coração”. Na expressão hebraica, “obter coração” significa adquirir juízo ou entendimento.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase é provavelmente irônica: o insensato adquirirá entendimento quando a cria de um jumento selvagem nascer homem — isto é, diante de uma impossibilidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo designa aqui um indivíduo masculino numa afirmação proverbial; mantém-se a forma masculina do hebraico.
- source_word: נָבוּב
  choice: sem entendimento
  rationale: Embora signifique literalmente “oco” ou “vazio”, descreve figuradamente alguém insensato; esta formulação comunica o sentido com naturalidade em português.
- source_word: יִלָּבֵב
  choice: adquirirá juízo
  rationale: A forma verbal significa literalmente “obterá coração”; no idioma hebraico, o coração representa discernimento ou bom senso.
- source_word: וְ
  choice: Mas
  rationale: A conjunção introduz, no contexto, um contraste irônico, mais bem expresso por “Mas” do que por um simples “E”.
- source_word: עַיִר פֶּרֶא
  choice: um jumentinho selvagem
  rationale: A expressão construta indica a cria do jumento selvagem; “jumentinho selvagem” é clara, corrente e preserva a imagem.
- source_word: אָדָם
  choice: homem
  rationale: 'O singular hebraico integra a comparação impossível: a cria animal nascer como homem.'
- source_word: יִוָּלֵד
  choice: nascer
  rationale: O nifal de ילד significa “ser nascido/nascer”; após “quando”, o infinitivo pessoal oferece uma construção portuguesa natural, enquanto o futuro da oração principal reflete o aspecto prospectivo do provérbio.
theological_decisions:
- issue: Força interpretativa do provérbio e da ironia
  choice: 'A frase é mantida como comparação irônica: o homem insensato adquirirá juízo quando a cria de um jumento selvagem nascer homem.'
  alternative: Entender o segundo membro como uma previsão positiva de que alguém semelhante a uma cria de jumento selvagem possa nascer ou tornar-se verdadeiramente humano.
  rationale: O hebraico é conciso e difícil, mas o paralelismo favorece uma condição absurda que sublinha a improbabilidade de o insensato adquirir juízo. A tradução preserva a formulação sem inserir “somente”, deixando a nota explicar a provável ironia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sem entendimento” evita o pouco natural “cabeça vazia”, e “adquirirá juízo” conserva o valor idiomático de “obter coração”. A construção difícil e sua tensão irônica são preservadas no texto e esclarecidas em notas.
