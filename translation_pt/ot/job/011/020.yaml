base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: pt
  text: 'Mas os olhos dos maus se consumirão,

    e não haverá refúgio para eles;

    a esperança deles será o último suspiro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico difícil; literalmente, algo como “o exalar da vida”. Pode indicar um suspiro derradeiro, isto é, a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים
  choice: os olhos dos maus
  rationale: Mantém a imagem hebraica dos olhos e emprega uma expressão natural em português para as pessoas perversas.
- source_word: תִּכְלֶינָה
  choice: se consumirão
  rationale: Com “olhos” como sujeito, o verbo descreve olhos que se esgotam ou definham de tanto esperar; “se consumirão” preserva a imagem e a expectativa frustrada.
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: não haverá refúgio para eles
  rationale: Expressa naturalmente em português o desaparecimento de qualquer lugar ou possibilidade de fuga, sem limitar מָנוֹס apenas ao ato de escapar.
- source_word: תִקְוָתָם
  choice: a esperança deles
  rationale: “Esperança” é o equivalente comum e mantém o contraste sombrio do verso.
- source_word: מַפַּח נָפֶשׁ
  choice: apenas o último suspiro
  rationale: A expressão hebraica difícil evoca a expiração da vida. “Último suspiro” conserva a imagem da morte em português natural; “apenas” explicita o valor restritivo sugerido pelo contexto, não uma palavra hebraica independente.
theological_decisions:
- issue: Sentido da esperança final dos maus
  choice: será apenas o último suspiro
  alternative: será o exalar da vida
  rationale: A tradução conserva a imagem de morte e a tensão do dito de Zofar, sem transformar a frase em uma afirmação doutrinária mais específica sobre o destino após a morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético em três linhas. “Maus” tem leitura mais corrente que “ímpios”, enquanto “refúgio” preserva a amplitude de מָנוֹס.
