  text: But if only God would speak and open his lips against you,[a]
translation:
  language: pt
  text: Mas quem dera que Deus falasse e abrisse os lábios com você,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra você” ou “a você”. A preposição hebraica significa literalmente “com”; no contexto, pode sugerir uma fala confrontadora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Marca a transição adversativa enfática em relação à fala anterior de Zofar, com naturalidade no português atual.
- source_word: מִי יִתֵּן
  choice: quem dera que
  rationale: A expressão idiomática hebraica formula um desejo intenso, não uma pergunta literal; “quem dera que” preserva essa força de modo natural e digno.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: O título divino singular é adequadamente traduzido por “Deus”, sem acréscimos não exigidos pelo texto.
- source_word: דַּבֵּר
  choice: falasse
  rationale: Depois da fórmula de desejo, o subjuntivo em português expressa naturalmente a ação desejada.
- source_word: וְיִפְתַּח
  choice: e abrisse
  rationale: Coordena a segunda ação com “falasse” dentro do mesmo desejo e mantém o sentido direto de abrir.
- source_word: שְׂפָתָיו
  choice: os lábios
  rationale: Preserva a imagem antropomórfica específica do hebraico, em vez de reduzi-la a “boca” ou simplesmente “falar”.
- source_word: עִמָּךְ
  choice: contra você
  rationale: Embora a preposição signifique literalmente “com”, o contexto apresenta a fala divina desejada por Zofar como resposta confrontadora a Jó; a nota conserva as alternativas genuínas.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus (“abrisse os lábios”)
  choice: Manter diretamente a imagem dos lábios
  alternative: Parafrasear como “falasse com você”
  rationale: A expressão corporal é a forma poética do texto para descrever a fala divina. Preservá-la mantém a imagem sem impor uma afirmação doutrinária sobre a corporeidade de Deus.
- issue: Força contextual de עִמָּךְ
  choice: Traduzir como “contra você” no texto
  alternative: “com você” ou “a você”
  rationale: A fala de Zofar espera que Deus responda e confronte Jó. “Contra você” comunica essa força contextual, enquanto a nota registra o valor mais literal e a ambiguidade da preposição.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Quem dera que” transmite naturalmente o desejo enfático; a imagem poética “abrisse os lábios” foi preservada. A vírgula final acompanha a continuidade sintática para o versículo seguinte.
