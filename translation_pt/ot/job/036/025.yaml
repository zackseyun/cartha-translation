  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: pt
  text: Toda a humanidade o viu[a][b]; o ser humano contempla de longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome hebraico é masculino singular. Pode ser entendido como “a ele”, em referência a Deus, ou como referência à sua obra ou ao seu feito mencionado no contexto; o contexto favorece esta última leitura.
    reason: alternative_reading
  - marker: b
    text: “A humanidade” e “o ser humano” são expressões genéricas para os seres humanos, correspondendo aos termos hebraicos אָדָם e אֱנוֹשׁ; este último também pode ressaltar a condição mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Toda a humanidade
  rationale: Expressa de modo natural e abrangente o sentido coletivo de כָּל com אָדָם, sem restringi-lo ao sexo masculino.
- source_word: חָזוּ
  choice: viu
  rationale: O perfeito de חזה indica percepção ou contemplação já realizada. “Viu” é claro e natural, enquanto o valor mais contemplativo do verbo é retomado no segundo membro pelo paralelismo.
- source_word: בּוֹ
  choice: o
  rationale: 'O pronome oblíquo masculino singular preserva em português a forma do hebraico e sua ambiguidade: pode retomar Deus pessoalmente ou algo masculino no contexto, como seu feito/trabalho.'
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: Mantém a referência genérica à humanidade e evita que “homem” seja entendido como exclusivamente masculino; a nuance de mortalidade é reconhecida, mas não precisa ser explicitada no corpo do verso.
- source_word: יַבִּיט
  choice: contempla
  rationale: Traduz o olhar atento ou prolongado expresso pelo hifil de נבט e conserva o tom poético sem arcaísmo.
- source_word: מֵרָחוֹק
  choice: de longe
  rationale: Equivalente conciso, corrente e poético para a ideia de observar a partir de certa distância.
theological_decisions:
- issue: Referente do pronome masculino singular בּוֹ
  choice: Manter a forma ambígua “o” no texto e explicar as possibilidades em nota
  alternative: Explicitar “a obra de Deus” ou traduzir “a ele”
  rationale: A gramática permite referência pessoal a Deus, enquanto o contexto imediato pode apontar para sua obra ou feito. O português possibilita conservar essa tensão sem decidir silenciosamente entre as leituras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A redação mantém o paralelismo poético, evita linguagem exclusivamente masculina e preserva a ambiguidade genuína do pronome hebraico.
