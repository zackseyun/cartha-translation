lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a força conectiva de וְ quanto a condição introduzida por אִם, com formulação natural em português.
- source_word: אֲסוּרִים
  choice: estiverem presos
  rationale: Mantém o sentido passivo do particípio de אסר e concorda naturalmente com a oração condicional, sem transformar a expressão em um substantivo como «prisioneiros».
- source_word: בַּזִּקִּים
  choice: em correntes
  rationale: Designa instrumentos de contenção; «correntes» é claro e corrente, enquanto «grilhões» permanece uma alternativa possível.
- source_word: יִלָּכְדוּן
  choice: capturados
  rationale: Representa o sentido passivo do nifal de לכד, «ser apanhado/capturado», e forma um paralelo natural com «presos».
- source_word: בְּחַבְלֵי
  choice: por cordas de
  rationale: Conserva a metáfora concreta de cordas ou laços e exprime de modo natural o meio pelo qual são capturados.
- source_word: עֹנִי
  choice: aflição
  rationale: O termo pode indicar aflição, miséria ou pobreza; neste contexto, «aflição» comunica sofrimento de modo amplo sem restringi-lo à carência econômica.
theological_decisions:
- issue: Natureza da imagem
  choice: Manter a imagem concreta de pessoas presas por correntes e cordas, permitindo que também represente sofrimento ou disciplina divina.
  alternative: Entender a linguagem como prisão exclusivamente literal ou como adversidade exclusivamente metafórica.
  rationale: As palavras do versículo são concretas, mas o contexto trata da maneira como Deus lida com os que sofrem. A tradução conserva essa tensão sem impor apenas uma das leituras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a metáfora concreta do hebraico. A vírgula final reflete que o versículo continua sintaticamente no seguinte.
