  text: כִּ֭י יְגָרַ֣ע נִטְפֵי מָ֑יִם יָזֹ֖קּוּ מָטָ֣ר לְ/אֵדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: pt
  text: Pois ele recolhe as gotas de água; elas destilam chuva de sua névoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «elas derramam chuva de seu vapor». O hebraico da segunda linha é difícil; «névoa» também pode ser traduzido por «vapor».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da grandeza de Deus no contexto; «Pois» comunica naturalmente a força causal ou explicativa.
- source_word: יְגָרַע
  choice: recolhe
  rationale: Embora o verbo costume significar «diminuir, retirar, subtrair», no contexto meteorológico indica que Deus retira ou reúne as gotas de água. «Recolhe» preserva esse núcleo lexical sem explicitar demais a ideia moderna de evaporação.
- source_word: נִטְפֵי מָיִם
  choice: as gotas de água
  rationale: Tradução direta e natural da construção hebraica.
- source_word: יָזֹקּוּ
  choice: elas destilam
  rationale: O verbo pode sugerir filtrar, refinar, destilar ou verter. «Destilam» preserva a imagem poética e a possível ideia de formação da chuva, sem eliminar a dificuldade do hebraico.
- source_word: מָטָר
  choice: chuva
  rationale: Equivalente comum, claro e preciso do substantivo hebraico.
- source_word: לְאֵדוֹ
  choice: de sua névoa
  rationale: אֵד pode designar névoa ou vapor. A preposição לְ é difícil neste verso; «de» oferece uma relação de origem coerente em português, enquanto a nota registra a alternativa. O sufixo masculino singular é mantido como «sua», com referência a Deus.
theological_decisions:
- issue: Referente do sufixo masculino singular em לְאֵדוֹ
  choice: «sua névoa», entendendo o sufixo como referência a Deus
  alternative: Sentido impessoal («da névoa») ou ajustes textuais/vocálicos que resultem em «névoa delas»
  rationale: Deus é o sujeito no contexto imediato do discurso de Eliú. Preservar o sufixo masculino singular mantém a ênfase textual no domínio de Deus sobre os fenômenos naturais, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo poético e a ambiguidade lexical do hebraico; evita terminologia científica anacrônica e explicitação excessiva.
