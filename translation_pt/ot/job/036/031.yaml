  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: pt
  text: 'Pois por meio deles ele julga os povos

    e dá alimento em abundância.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: por meio deles
  rationale: O pronome retoma os fenômenos descritos no contexto, provavelmente as nuvens ou os meios atmosféricos pelos quais Deus tanto julga como provê; a formulação preserva a referência pronominal do hebraico sem especificá-la além do texto.
- source_word: יָדִין
  choice: julga
  rationale: Mantém o sentido jurídico e governante do verbo דין, que no contexto também pode envolver a execução do juízo.
- source_word: עַמִּים
  choice: os povos
  rationale: Equivalente coletivo natural para o plural hebraico, sem restringi-lo a uma só nação.
- source_word: יִתֶּן אֹכֶל
  choice: dá alimento
  rationale: Tradução direta e natural; o contexto associa os mesmos fenômenos à provisão de alimento.
- source_word: לְמַכְבִּיר
  choice: em abundância
  rationale: Expressa o valor adverbial de abundância, bem atestado pelo contexto e pela tradição lexical.
theological_decisions:
- issue: O mesmo meio divino serve ao juízo e à provisão.
  choice: 'Preservar o paralelismo: ele julga os povos e dá alimento.'
  alternative: Explicitar que Deus usa chuva, nuvens ou relâmpagos para punir e sustentar.
  rationale: O hebraico mantém o antecedente de בָם implícito e apresenta lado a lado juízo e sustento; explicitar um fenômeno específico resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética em dois versos. “Por meio deles” é mais natural que “por eles” e conserva a ambiguidade referencial do original.
