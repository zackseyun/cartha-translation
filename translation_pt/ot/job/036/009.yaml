  text: וַ/יַּגֵּ֣ד לָ/הֶ֣ם פָּעֳלָ֑/ם וּ֝/פִשְׁעֵי/הֶ֗ם כִּ֣י יִתְגַּבָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/009.yaml
  text: then he declares to them their deeds and their transgressions[a], that they have acted arrogantly.
translation:
  language: pt
  text: 'então ele lhes declara seus atos e suas transgressões[a]: agiram com arrogância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que se tornaram fortes”; no contexto, o sentido provável é autoexaltação ou arrogância.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: então ele lhes revela
  rationale: O hifil de נגד significa contar, declarar ou tornar conhecido. “Revela” expressa de modo natural a ação de Deus de lhes dar conhecimento de sua conduta; “então” traduz o waw na sequência do contexto.
- source_word: פָּעֳלָם
  choice: seus atos
  rationale: O termo pode designar obra, feito ou ação. Em paralelo com “transgressões”, “atos” comunica o sentido moral sem sugerir trabalho profissional.
- source_word: וּפִשְׁעֵיהֶם
  choice: e suas transgressões
  rationale: פשע denota transgressão ou rebeldia contra a autoridade legítima. “Transgressões” mantém a gravidade moral e é claro em português.
- source_word: כִּי
  choice: ': que'
  rationale: כִּי é entendido como introdução do conteúdo revelado. Os dois-pontos tornam clara em português a relação explicativa sem convertê-la em causa.
- source_word: יִתְגַּבָּרוּ
  choice: agiram com arrogância
  rationale: O hitpael de גבר significa literalmente tornar-se forte ou mostrar-se forte, mas neste contexto moral provavelmente indica autoexaltação arrogante. A formulação escolhida transmite essa nuance sem acrescentar uma categoria doutrinária.
theological_decisions:
- issue: Nuance moral de יִתְגַּבָּרוּ
  choice: agiram com arrogância
  alternative: tornaram-se fortes; exaltaram-se
  rationale: Em paralelo com “transgressões”, a expressão provavelmente descreve autoafirmação ou autoexaltação pecaminosa, não força em sentido neutro. A nota conserva a possibilidade lexical mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Atos” é mais corrente que “feitos” neste contexto; a ambiguidade de יִתְגַּבָּרוּ é preservada em nota.
