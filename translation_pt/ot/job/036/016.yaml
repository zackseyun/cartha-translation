base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: pt
  text: De fato, ele o atraiu para fora da boca da angústia[a], para um lugar amplo, sem aperto debaixo dele[b]; e o que foi posto sobre a sua mesa estava cheio de fartura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das mandíbulas da aflição” ou “da boca de um lugar estreito”. O hebraico reúne as ideias de angústia e confinamento, em contraste com o “lugar amplo” que vem a seguir.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica é difícil. Outra tradução possível: “para um lugar espaçoso, sem nenhuma restrição debaixo dele”.'
    reason: textual_or_semantic_ambiguity
  - marker: c
    text: 'Hebraico: “cheio de gordura”, imagem de alimento rico e abundância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: De fato
  rationale: Expressa a força enfática e aditiva da locução hebraica de modo natural em português.
- source_word: הֲסִיתְךָ
  choice: ele o atraiu
  rationale: O verbo pode significar incitar, seduzir ou atrair. Neste contexto, descreve o movimento para fora da angústia; “atraiu” preserva essa ideia sem acrescentar uma conotação necessariamente negativa.
- source_word: מִפִּי צָר
  choice: para fora da boca da angústia
  rationale: Mantém a imagem concreta de “boca” e traduz צַר como “angústia”, preservando a tensão entre aflição e estreiteza que contrasta com o lugar amplo.
- source_word: רַחַב
  choice: um lugar amplo
  rationale: Conserva a metáfora espacial hebraica e produz uma expressão clara e digna em português.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: sem aperto debaixo de você
  rationale: A expressão é difícil. “Aperto” comunica tanto restrição espacial quanto aflição e mantém o contraste com “lugar amplo”; o sufixo feminino pode referir-se à área ou base subentendida sob a pessoa.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: e o que foi posto sobre a sua mesa
  rationale: נַחַת é raro e incerto; no contexto da mesa, provavelmente indica aquilo que foi colocado ou servido nela. A formulação preserva a cautela interpretativa e soa natural.
- source_word: מָלֵא דָשֶׁן
  choice: estava cheio de fartura
  rationale: דֶּשֶׁן denota literalmente gordura e, por extensão, alimento rico, prosperidade ou abundância. “Fartura” comunica a imagem de provisão abundante em português atual.
theological_decisions:
- issue: Sujeito divino implícito de הֲסִיתְךָ
  choice: Manter “ele”, sem inserir explicitamente “Deus”.
  alternative: Traduzir “Deus o atraiu”.
  rationale: O contexto aponta para Deus, mas o texto hebraico emprega apenas a forma verbal na terceira pessoa masculina singular. O pronome preserva a forma e deixa o contexto identificar o referente.
- issue: Imagem de angústia, estreiteza e amplitude
  choice: Preservar as metáforas espaciais “boca”, “lugar amplo” e “aperto”.
  alternative: Parafrasear como “ele o libertou da aflição”.
  rationale: A força poética do verso depende do contraste entre confinamento e espaço aberto; uma paráfrase abstrata eliminaria essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservam-se as imagens poéticas hebraicas e a ambiguidade da expressão espacial difícil, enquanto “fartura” evita o sentido corporal que “gordura” teria isoladamente no texto principal.
