  yaml_path: translation/ot/job/036/002.yaml
  text: Bear with me a little, and I will show you, for there are still words for God.
translation:
  language: pt
  text: Tenha um pouco de paciência comigo, e eu lhe mostrarei, pois ainda há palavras em favor de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: Espere por mim mais um pouco
  rationale: Expressa com naturalidade o pedido para que o ouvinte aguarde brevemente; o imperativo singular é preservado.
- source_word: וַאֲחַוֶּךָּ
  choice: e eu lhe mostrarei
  rationale: Mantém o sentido causativo/declarativo do verbo e corresponde à afirmação de que Eliú ainda apresentará algo ao ouvinte.
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: pois ainda há palavras em favor de Deus
  rationale: Reproduz a construção existencial elíptica do hebraico sem inserir explicitamente “tenho”. “Em favor de Deus” comunica que as palavras serão proferidas em defesa ou a favor dele, sentido adequado ao contexto.
theological_decisions:
- issue: Relação das palavras de Eliú com Deus na expressão לֶאֱלוֹהַּ
  choice: em favor de Deus
  alternative: para Deus
  rationale: “Para Deus” poderia sugerir, em português, palavras dirigidas a Deus. O contexto indica que Eliú continuará falando acerca de Deus e em defesa de sua justiça; “em favor de Deus” preserva essa orientação sem atribuir inspiração divina às palavras de Eliú.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “lhe”. A formulação preserva a concisão e a estrutura argumentativa do hebraico.
