lexical_decisions:
- source_word: וַיֹּסֶף
  choice: continuou
  rationale: Embora יסף signifique literalmente “acrescentar”, nesta fórmula introdutória de discurso indica que Eliú prosseguiu ou continuou a falar. “Continuou” é natural em português moderno e preserva a função narrativa.
- source_word: אֱלִיהוּא
  choice: Eliú
  rationale: O nome hebraico é transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: וַיֹּאמַר
  choice: dizendo
  rationale: O gerúndio evita a construção pouco natural “continuou e disse” e expressa de modo idiomático a sequência da fala, sem acrescentar conteúdo.
