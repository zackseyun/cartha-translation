base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: pt
  text: 'Quem lhe determinou o seu caminho? Ou quem lhe disse: “Você cometeu injustiça”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você agiu mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz duas perguntas retóricas.
- source_word: פָקַד
  choice: determinou
  rationale: Neste contexto, o verbo expressa estabelecer, prescrever ou encarregar; “determinou” comunica naturalmente a ideia de alguém definir para Deus o curso que ele deve seguir.
- source_word: עָלָיו
  choice: lhe
  rationale: Com פקד, a preposição pode indicar aquilo que é imposto ou determinado para alguém; o pronome oblíquo produz uma formulação portuguesa natural sem eliminar a relação expressa no hebraico.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Preserva tanto a imagem concreta de caminho quanto o sentido metafórico de conduta ou curso de ação.
- source_word: וּמִי
  choice: Ou quem
  rationale: A conjunção liga uma segunda pergunta retórica; “ou” exprime bem a progressão em português.
- source_word: אָמַר
  choice: disse
  rationale: O perfeito hebraico formula o desafio retórico sobre quem alguma vez fez tal acusação; o pretérito perfeito é natural em português.
- source_word: פָּעַלְתָּ
  choice: Você cometeu
  rationale: Embora o verbo isoladamente signifique fazer ou agir, com עַוְלָה a colocação idiomática portuguesa é “cometer injustiça”.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O substantivo denota injustiça, perversidade ou ação errada; “injustiça” mantém a dimensão moral e judicial do termo.
theological_decisions:
- issue: Referente dos sufixos masculinos e do verbo na segunda pessoa
  choice: 'O versículo se refere a Deus: ninguém determina seu caminho nem o acusa legitimamente de injustiça.'
  alternative: Uma leitura genérica acerca de um governante ou homem poderoso.
  rationale: O contexto imediato exalta o poder e a justiça de Deus (Jó 36:22–23). A tradução mantém os pronomes normais, sem acrescentar títulos ou explicações ao corpo do texto.
- issue: Força da segunda pergunta retórica
  choice: 'Preservar a acusação direta: “Você cometeu injustiça”.'
  alternative: 'Explicitar: “Quem pode acusá-lo de ter agido mal?”'
  rationale: A fala direta reflete mais de perto a sintaxe hebraica e conserva a força do desafio sem inserir o modal “pode”, ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Determinou” evita a estranheza de “nomeou o seu caminho”, enquanto conserva a noção de prescrever ou estabelecer. A fala direta usa “você”, corrente no português brasileiro e transparente internacionalmente.
