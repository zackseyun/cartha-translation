  source_fidelity: A tradução preserva as duas perguntas retóricas, a relação de prescrever/determinar o curso de alguém em פקד על־... דרך, e a acusação direta de ter praticado עוולה. “Lhe determinou o seu caminho” comunica adequadamente que ninguém estabelece o caminho de Deus para ele; o referente divino permanece contextual, como no hebraico.
