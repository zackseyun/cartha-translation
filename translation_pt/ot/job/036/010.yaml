  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: pt
  text: Ele abre os ouvidos deles para a disciplina[a] e lhes diz que se afastem da maldade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a instrução” ou “para a correção”. Literalmente, “abre o ouvido deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da iniquidade”. A palavra hebraica também pode significar “mal” e, em certos contextos, “sofrimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: abre
  rationale: O verbo גלה, com “ouvido” como objeto, forma uma imagem de desimpedir ou abrir os ouvidos para que se escute; “abre” preserva a metáfora com naturalidade em português.
- source_word: אָזְנָם
  choice: os ouvidos deles
  rationale: Embora o hebraico use o substantivo no singular coletivo, o plural é a forma natural e clara em português para um referente plural.
- source_word: לַמּוּסָר
  choice: para a disciplina
  rationale: מוּסָר abrange instrução, correção e disciplina. No contexto, o sofrimento tem função corretiva e pedagógica; “disciplina” mantém ambas as dimensões.
- source_word: וַיֹּאמֶר
  choice: e lhes diz
  rationale: אמר significa “dizer”. O objeto indireto está implícito pelo contexto e é expresso em português para tornar natural a construção com a oração seguinte.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo do que é dito, correspondendo naturalmente a “que”.
- source_word: יְשֻׁבוּן
  choice: se afastem
  rationale: שוב indica voltar ou mudar de direção. Com מִן, a expressão comunica abandonar aquilo de que se volta; “se afastem” transmite a exortação sem acrescentar intensidade.
- source_word: מֵאָוֶן
  choice: da maldade
  rationale: אָוֶן pode designar iniquidade, maldade ou sofrimento. Neste chamado à mudança de conduta, “maldade” expressa de modo claro e atual o sentido moral.
theological_decisions:
- issue: Natureza de מוּסָר no discurso de Eliú
  choice: disciplina como instrução corretiva
  alternative: instrução em sentido predominantemente pedagógico ou castigo com ênfase punitiva
  rationale: O contexto apresenta a aflição como meio pelo qual Deus instrui e chama as pessoas a abandonar a conduta má. “Disciplina” conserva a tensão entre ensino e correção sem impor uma teoria doutrinária específica do sofrimento.
- issue: Sentido moral de אָוֶן
  choice: maldade
  alternative: iniquidade, mal ou sofrimento
  rationale: A construção com o chamado a se afastar favorece o sentido ético. “Maldade” é compreensível e não torna o termo mais técnico do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O plural “os ouvidos” naturaliza o singular coletivo hebraico; a metáfora de abrir os ouvidos e a amplitude corretiva e pedagógica de “disciplina” foram preservadas.
