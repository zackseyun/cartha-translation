  text: אִֽם יִשְׁמְע֗וּ וְֽ/יַ֫עֲבֹ֥דוּ יְכַלּ֣וּ יְמֵי/הֶ֣ם בַּ/טּ֑וֹב וּ֝/שְׁנֵי/הֶ֗ם בַּ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: pt
  text: Se eles ouvirem[a] e servirem, completarão seus dias em prosperidade e seus anos em delícias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouvirem de modo obediente”; o verbo hebraico traduzido como “ouvirem” também pode indicar uma escuta obediente neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “passarão seus dias no bem e seus anos em coisas agradáveis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição de modo direto, preservando a formulação do hebraico.
- source_word: יִשְׁמְעוּ
  choice: ouvirem
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. “Ouvirem” mantém o sentido lexical básico e, no contexto, admite a ideia de resposta obediente sem explicitá-la em excesso.
- source_word: וְיַעֲבֹדוּ
  choice: e servirem
  rationale: עבד significa normalmente servir. A escolha abrange o serviço obediente a Deus sem restringir o sentido apenas ao culto.
- source_word: יְכַלּוּ
  choice: completarão
  rationale: O piel de כלה pode significar completar ou levar ao fim. Com “dias” e “anos”, refere-se a viver até o fim esse período; “completarão” preserva a força verbal e o paralelismo.
- source_word: יְמֵיהֶם
  choice: seus dias
  rationale: Tradução direta que permanece natural em português e conserva a linguagem poética.
- source_word: בַּטּוֹב
  choice: em prosperidade
  rationale: טוב substantivado designa aqui uma condição favorável de bem-estar. “Prosperidade” expressa esse sentido sem necessariamente o limitar à riqueza.
- source_word: וּשְׁנֵיהֶם
  choice: e seus anos
  rationale: Tradução direta que preserva o paralelismo com “seus dias”.
- source_word: בַּנְּעִימִים
  choice: em delícias
  rationale: O plural נְעִימִים denota coisas agradáveis, deleites ou uma condição prazerosa. “Delícias” é natural, conciso e preserva a forma plural e a intensidade poética.
theological_decisions:
- issue: Se o versículo promete prosperidade material como princípio teológico absoluto
  choice: A afirmação condicional de Eliú é traduzida diretamente, sem ser ampliada para uma garantia universal.
  alternative: Interpretá-la como garantia de que a obediência sempre produz prosperidade terrena, ou espiritualizá-la como bênção apenas interior.
  rationale: O hebraico apresenta a alegação condicional de Eliú em linguagem sapiencial. A tradução preserva tanto a referência evidente a circunstâncias favoráveis nesta vida quanto a tensão teológica do contexto, sem endossar uma generalização além da fala.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e o paralelismo poético foram preservados. “Delícias” evita o pouco natural “agradabilidade”, enquanto a nota registra uma alternativa mais literal. Os marcadores aparecem no texto em ordem alfabética.
