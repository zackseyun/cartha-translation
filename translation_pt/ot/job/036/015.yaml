base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: pt
  text: Ele livra o aflito em sua aflição[a] e abre os ouvidos deles na opressão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “livra o pobre em sua aflição”. Os termos hebraicos podem destacar pobreza, aflição ou opressão; a preposição também pode indicar meio, e não apenas circunstância.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio da opressão”. Literalmente, “descobre o ouvido deles”, expressão hebraica que significa tornar alguém disposto a ouvir ou receber instrução.'
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: livra
  rationale: O piel de חלץ expressa retirar do perigo ou libertar. “Livra” é natural, digno e mantém o sentido ativo de resgate.
- source_word: עָנִי
  choice: o aflito
  rationale: Embora possa significar “pobre”, o paralelismo com עָנְיוֹ e לַחַץ favorece aqui a condição de aflição ou opressão, sem restringir o sentido à pobreza econômica.
- source_word: בְעָנְיוֹ
  choice: por meio de sua aflição
  rationale: A preposição ב pode ser instrumental ou circunstancial. “Por meio de” preserva a leitura instrumental destacada pelo paralelismo, enquanto “sua” mantém o singular representativo do hebraico.
- source_word: וְיִגֶל ... אָזְנָם
  choice: e lhe abre os ouvidos
  rationale: Literalmente, גלה com “ouvido” significa descobri-lo; trata-se de uma expressão idiomática para tornar alguém receptivo à instrução. O hebraico passa do singular genérico para o sufixo plural; o português usa singular representativo com o plural idiomático “os ouvidos”.
- source_word: בַּלַּחַץ
  choice: em meio à opressão
  rationale: לַחַץ abrange opressão, pressão e angústia. Aqui a formulação circunstancial evita tornar a segunda oração excessivamente causal, sem excluir a possível nuance instrumental, registrada em nota.
theological_decisions:
- issue: A aflição como meio de livramento e instrução divina
  choice: A primeira oração conserva explicitamente a possível instrumentalidade da aflição; a segunda apresenta a opressão como contexto em que Deus abre os ouvidos.
  alternative: “Ele livra o aflito em sua aflição e abre seus ouvidos por meio da opressão.”
  rationale: As duas construções com ב permitem sentido instrumental ou circunstancial. A tradução mantém a tensão do discurso de Eliú e não afirma que todo sofrimento seja bom, punitivo ou diretamente causado por Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se o singular genérico “o aflito”, suavizando em português a mudança hebraica para o sufixo plural. As notas registram tanto a ambiguidade lexical quanto a alternância entre valor instrumental e circunstancial.
