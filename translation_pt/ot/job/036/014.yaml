  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: pt
  text: Eles morrem ainda jovens, e sua vida termina entre os prostitutos cultuais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os consagrados”. O termo hebraico provavelmente se refere a homens envolvidos em prostituição cultual associada ao culto pagão.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: morrem
  rationale: O qal imperfeito de מות tem נַפְשָׁם como sujeito gramatical; o plural em português expressa naturalmente a referência coletiva indicada pelo sufixo plural.
- source_word: בַּנֹּעַר
  choice: ainda jovens
  rationale: נֹעַר designa juventude ou o início da vida. A formulação é natural em português e preserva a ideia de morte prematura.
- source_word: נַפְשָׁם
  choice: eles
  rationale: נֶפֶשׁ pode significar alma, vida ou pessoa. Aqui integra a expressão idiomática de morrer; traduzir literalmente por “a alma deles morre” seria pouco natural e poderia sugerir uma distinção antropológica que o verso não pretende estabelecer.
- source_word: וְחַיָּתָם
  choice: e sua vida termina
  rationale: O substantivo refere-se à vida ou duração da vida. “Termina” explicita em português o predicado elíptico recuperado pelo paralelismo com a primeira oração.
- source_word: בַּקְּדֵשִׁים
  choice: entre os prostitutos cultuais
  rationale: O plural de קָדֵשׁ provavelmente designa homens ligados à prostituição em contexto de culto pagão. “Prostitutos cultuais” preserva tanto o sexo masculino quanto o caráter religioso da prática, sem recorrer ao termo tradicional e impreciso “sodomitas”.
theological_decisions:
- issue: Sentido de קְדֵשִׁים
  choice: prostitutos cultuais
  alternative: consagrados; prostitutos de templo
  rationale: O uso bíblico de קָדֵשׁ e o contexto de um fim vergonhoso favorecem a referência a homens envolvidos em prostituição cultual. A nota registra a leitura formalmente possível “consagrados” sem apagar a interpretação histórica mais provável.
- issue: Predicado elíptico da segunda oração
  choice: sua vida termina
  alternative: e sua vida entre os prostitutos cultuais
  rationale: O hebraico não repete o verbo, mas o paralelismo com “morre” fornece o predicado. Explicitá-lo produz uma oração completa e natural em português sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prostitutos cultuais” é preciso, evita o anacrônico e carregado “sodomitas” e mantém explícita a referência masculina do hebraico.
