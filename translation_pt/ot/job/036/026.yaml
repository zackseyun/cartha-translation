id: JOB.36.26
reference: Job 36:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: pt
  text: Eis que Deus é grande, e não o conhecemos[a]; o número dos seus anos é insondável[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “e não conhecemos” ou “e não sabemos”. O objeto “o” está implícito no contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não há como sondar o número dos seus anos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Eis que
  rationale: Introduz com ênfase a afirmação seguinte e conserva o tom elevado da poesia sapiencial, sem reduzir a expressão a um simples advérbio de confirmação.
- source_word: אֵל
  choice: Deus
  rationale: Aqui, אֵל é a designação poética comum de Deus; “Deus” é a forma clara e natural em português.
- source_word: שַׂגִּיא
  choice: grande
  rationale: O adjetivo expressa grandeza ou magnitude exaltada. “Grande” mantém a amplitude do termo sem restringi-lo a poder, posição ou extensão.
- source_word: וְלֹא נֵדָע
  choice: e não o conhecemos
  rationale: O hebraico diz literalmente “e não conhecemos/sabemos”, sem objeto expresso. O pronome “o” retoma Deus, exigência natural da construção portuguesa, sem transformar a frase na explicação mais interpretativa “ele está além do nosso conhecimento”.
- source_word: מִסְפַּר
  choice: o número
  rationale: Reproduz diretamente o substantivo em relação construta com “seus anos” e forma uma expressão natural em português.
- source_word: שָׁנָיו
  choice: dos seus anos
  rationale: Mantém a imagem poética e antropomórfica do hebraico, em vez de substituí-la pelo conceito interpretativo de “eternidade” ou “tempo de vida”.
- source_word: וְלֹא חֵקֶר
  choice: é insondável
  rationale: Expressa de modo conciso e idiomático a construção nominal “e não há investigação/sondagem”, comunicando que o número dos anos de Deus não pode ser perscrutado.
theological_decisions:
- issue: Objeto implícito em וְלֹא נֵדָע
  choice: 'Suprir o pronome “o”: “não o conhecemos”'
  alternative: 'Manter a oração sem objeto: “não conhecemos”; ou explicitar a interpretação: “ele está além do nosso conhecimento”'
  rationale: Deus é o referente imediato, e o português pede naturalmente um objeto nessa formulação. A redação escolhida preserva a concisão e também a tensão do hebraico quanto aos limites do conhecimento humano, sem explicar em que sentido Deus não é conhecido.
- issue: Sentido dos “anos” de Deus
  choice: Conservar a expressão “seus anos”
  alternative: Interpretar como “sua eternidade” ou “seu tempo de vida”
  rationale: O texto emprega uma imagem temporal e antropomórfica. Mantê-la evita introduzir um termo sistemático que não aparece explicitamente no hebraico.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “Eis que” preserva a força enfática de הֶן; “insondável” conserva a concisão do paralelismo. Os marcadores foram posicionados nas expressões às quais suas notas efetivamente se referem.
