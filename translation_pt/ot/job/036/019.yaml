base_translation:
  language: en
  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: pt
  text: Será que o seu clamor lhe servirá de alguma coisa quando vier a aflição[a][b], ou todos os esforços da sua força?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra interpretação do difícil texto hebraico: “Será que a sua riqueza lhe servirá para que você não fique aflito, ou todas as forças do seu vigor?”'
    reason: alternative_reading
  - marker: b
    text: O hebraico deste versículo é difícil, especialmente nas expressões tradicionalmente traduzidas por “seu clamor” e “quando vier a aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: servirá de alguma coisa
  rationale: O verbo ערך pode significar literalmente “pôr em ordem” ou “dispor”, mas aqui provavelmente tem o sentido idiomático de “ser útil, valer, bastar” dentro da pergunta retórica.
- source_word: שׁוּעֲךָ
  choice: o seu clamor
  rationale: A vocalização massorética favorece a derivação de שׁוע, “clamar por socorro”. “Clamor” preserva essa leitura sem excluir a ideia de súplica; a interpretação alternativa “riqueza” é registrada em nota.
- source_word: לֹא בְצָר
  choice: quando vier a aflição
  rationale: O hebraico é extremamente conciso e difícil. A tradução apresenta a provável força circunstancial da frase no contexto da pergunta, enquanto a construção negativa mais literal fica preservada na leitura alternativa da nota.
- source_word: וְכֹל
  choice: ou todos
  rationale: 'Embora וְ normalmente signifique “e”, aqui liga um segundo recurso possível dentro de uma pergunta retórica: nem o clamor nem a força seriam suficientes.'
- source_word: מַאֲמַצֵּי כֹחַ
  choice: todos os esforços da sua força
  rationale: A expressão reúne as ideias de esforço intenso e força. A formulação conserva ambos os elementos e o paralelismo poético, suprindo o possessivo a partir da interpelação direta.
