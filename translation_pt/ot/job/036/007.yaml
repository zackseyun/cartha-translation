  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: pt
  text: Ele não tira os olhos dos justos; mas, com reis no trono, ele os faz sentar para sempre[a], e eles são exaltados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os reis no trono — ele os faz sentar para sempre”. O hebraico é compacto, e alguns entendem que a cláusula fala diretamente dos reis, em vez de dizer que os justos são colocados com reis.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e ele os exalta”. O verbo final também pode ser entendido na voz ativa, tendo Deus como sujeito implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: tira
  rationale: גרע significa diminuir, retirar ou tirar. Com “os olhos” como objeto, “não tira os olhos” preserva a imagem hebraica e expressa vigilância contínua em português natural.
- source_word: מִצַּדִּיק
  choice: do justo
  rationale: O adjetivo singular pode ter valor genérico ou coletivo. “Do justo” mantém o singular formal do hebraico e permite que os sufixos pronominais seguintes sejam entendidos com naturalidade.
- source_word: עֵינָיו
  choice: os olhos
  rationale: Mantém a linguagem antropomórfica concreta do original, sem substituí-la pela abstração “cuidado” ou “atenção”.
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: com reis no trono
  rationale: A construção é compacta e elíptica. Esta formulação entende os reis como companhia ou esfera de honra do justo, sem acrescentar um verbo finito ausente nessa expressão.
- source_word: וַיֹּשִׁיבֵם
  choice: coloca-o
  rationale: O hifil de ישׁב significa fazer sentar, assentar ou colocar. O sufixo plural pode retomar o singular coletivo “justo”; em português, o singular torna a cadeia referencial mais clara sem alterar o sentido genérico.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: Expressa de modo corrente a duração contínua indicada por לָנֶצַח.
- source_word: וַיִּגְבָּהוּ
  choice: ele é exaltado
  rationale: A forma final é concisa e admite análise ambígua. A leitura resultativa/passiva preserva a elevação do justo sem definir explicitamente Deus como sujeito gramatical.
theological_decisions:
- issue: Linguagem antropomórfica sobre a atenção de Deus
  choice: Manter “os olhos”
  alternative: Traduzir por “cuidado”, “atenção” ou “olhar”
  rationale: A imagem concreta comunica a vigilância constante de Deus e deve ser preservada, em vez de ser explicada abstratamente.
- issue: Referente do sufixo pronominal na cláusula régia
  choice: Entendê-lo como o justo, tomado genericamente
  alternative: Entendê-lo como os reis que Deus faz sentar no trono
  rationale: “O justo” pode funcionar coletivamente e fornecer o referente semântico do plural hebraico; contudo, a sintaxe compacta permite a leitura alternativa, registrada em nota.
- issue: Sujeito do verbo final
  choice: 'Expressar o resultado passivamente: “ele é exaltado”'
  alternative: “E ele os exalta”, com Deus como sujeito implícito
  rationale: A formulação evita resolver além do necessário a ambiguidade morfológica e sintática do verbo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O ponto e vírgula ajuda a delimitar a cláusula régia elíptica. Mantêm-se a imagem concreta dos olhos e as ambiguidades reais da sintaxe hebraica por meio de notas.
