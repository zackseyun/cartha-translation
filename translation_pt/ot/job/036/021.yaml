  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: pt
  text: Tenha cuidado; não se volte para a iniquidade[a], pois foi isso que você escolheu em vez da aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mal”, “a maldade” ou, possivelmente, “a desgraça”; o termo hebraico אָוֶן admite esses sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lugar da aflição” ou “em vez da miséria”. O sentido provável é que ele não deve preferir a prática do mal ao sofrimento que está enfrentando.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Tenha cuidado
  rationale: O imperativo nifal de שׁמר funciona como advertência. A formulação é natural em português atual e mantém a força da exortação.
- source_word: אַל תֵּפֶן
  choice: não se volte
  rationale: A construção proibitiva com אַל e o verbo פנה expressa a ideia de não se dirigir ou inclinar para algo.
- source_word: אֶל אָוֶן
  choice: para a iniquidade
  rationale: אָוֶן pode indicar iniquidade, maldade, mal ou desgraça. Neste contexto de advertência moral, “iniquidade” comunica melhor o sentido ético, sem apagar as alternativas lexicais registradas em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da advertência de modo conciso e natural.
- source_word: עַל זֶה
  choice: isso
  rationale: O demonstrativo retoma a iniquidade mencionada anteriormente. A construção “foi isso que” torna clara a referência sem acrescentar conteúdo interpretativo.
- source_word: בָּחַרְתָּ
  choice: você escolheu
  rationale: O perfeito na segunda pessoa masculina singular apresenta a escolha como realizada e relevante para a advertência presente.
- source_word: מֵעֹנִי
  choice: em vez da aflição
  rationale: עֹנִי designa aflição, sofrimento ou miséria; no contexto de Jó, “aflição” é apropriado. O מִן tem aqui valor comparativo, indicando uma escolha de uma coisa em lugar de outra.
theological_decisions:
- issue: A advertência pode soar como afirmação de que Jó já escolheu a iniquidade.
  choice: 'Manter o perfeito: “foi isso que você escolheu”.'
  alternative: Suavizar para uma possibilidade futura, como “para que não escolha isso”.
  rationale: O hebraico usa בָּחַרְתָּ, forma perfeita, e a tradução deve preservar a acusação ou avaliação de Eliú sem transformá-la numa hipótese nem endossá-la como juízo do narrador.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Tenha cuidado” evita arcaísmo; “não se volte” preserva a metáfora direcional do hebraico. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
