  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: pt
  text: Mas você está cheio do julgamento do perverso[a]; o juízo e a justiça o prendem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você está cheio do julgamento destinado ao perverso” ou “do julgamento próprio do perverso”. O hebraico é condensado e permite mais de uma relação entre “julgamento” e “perverso”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o juízo e a justiça sustentam você”. O verbo hebraico pode significar sustentar, segurar firmemente ou agarrar; seu objeto não é expresso na frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: Mas ... julgamento
  rationale: A conjunção וְ tem valor adversativo provável no contexto, enquanto דִּין inicia a expressão forense “julgamento do perverso”.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo singular substantivado designa genericamente quem é perverso ou culpado, sem acrescentar uma referência masculina como “homem”.
- source_word: מָלֵאתָ
  choice: você está cheio
  rationale: O perfeito na segunda pessoa masculina singular descreve o estado de Jó e preserva a imagem hebraica de plenitude.
- source_word: דִּין
  choice: juízo
  rationale: Na segunda oração, “juízo” mantém o campo jurídico e a repetição conceitual de דִּין, embora uma pequena variação estilística em português evite uma formulação excessivamente pesada.
- source_word: וּמִשְׁפָּט
  choice: e a justiça
  rationale: מִשְׁפָּט pode indicar justiça, direito ou decisão judicial; “justiça” preserva a distinção parcial entre os dois termos forenses paralelos.
- source_word: יִתְמֹכוּ
  choice: se apoderam de você
  rationale: O verbo תמך pode significar sustentar, segurar ou tomar posse de algo. No contexto negativo, “se apoderam” comunica que juízo e justiça alcançam Jó, mas a nota conserva a ambiguidade lexical e sintática.
theological_decisions:
- issue: Sentido de “julgamento do perverso”
  choice: Mantida a construção genitiva comprimida
  alternative: “o julgamento destinado ao perverso” ou “o julgamento próprio do perverso”
  rationale: O hebraico não determina claramente se Jó sofre a sentença reservada ao perverso ou se está ocupado com a espécie de julgamento associada a ele; a tradução não resolve essa tensão.
- issue: Sujeito e objeto implícito de יִתְמֹכוּ
  choice: “o juízo e a justiça se apoderam de você”
  alternative: “o juízo e a justiça sustentam você” ou “o juízo e a justiça se mantêm firmes”
  rationale: O verbo está no plural e não traz objeto expresso. O contexto favorece uma leitura em que as realidades judiciais alcançam Jó, mas a nota registra tanto a leitura favorável quanto a possibilidade de não explicitar objeto.
translation_notes:
  register: Português atual, digno e acessível, com “você” para a interpelação direta a Jó. A formulação conserva o paralelismo forense e sinaliza em notas as duas ambiguidades centrais do hebraico.
