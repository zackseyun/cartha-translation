source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: pt
  text: Mas, se não escutarem, perecerão pela espada e morrerão sem conhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por falta de conhecimento”.'
    reason: alternativa lexical e sintática para כִּבְלִי דָעַת, que pode ter nuance causal
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o resultado positivo do versículo anterior; “Mas, se” expressa naturalmente essa força adversativa.
- source_word: לֹא יִשְׁמְעוּ
  choice: não escutarem
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. “Escutarem” conserva tanto a recepção da instrução quanto a ideia de lhe dar atenção, sem restringir o sentido a uma obediência explicitamente formulada.
- source_word: בְּשֶׁלַח
  choice: pela espada
  rationale: שׁלח designa aqui um instrumento de morte e pode referir-se de modo mais amplo a uma arma ou projétil. “Pela espada” é uma expressão idiomática clara e adequada ao contexto de juízo.
- source_word: יַעֲבֹרוּ
  choice: perecerão
  rationale: Embora עבר signifique literalmente passar ou atravessar, neste contexto a expressão indica passar desta vida, isto é, perecer. A escolha comunica o sentido em português natural e mantém o paralelismo com “morrerão”.
- source_word: וְיִגְוְעוּ
  choice: e morrerão
  rationale: גוע denota morrer ou expirar. “Morrerão” é claro, digno e natural no português contemporâneo.
- source_word: כִּבְלִי דָעַת
  choice: sem conhecimento
  rationale: 'A construção pode indicar o estado de morrer sem conhecimento ou, possivelmente, a causa: por falta de conhecimento. A tradução principal segue de perto a forma hebraica, e a alternativa causal é preservada em nota.'
theological_decisions:
- issue: Se שׁמע indica apenas ouvir ou uma resposta obediente
  choice: não escutarem
  alternative: não obedecerem
  rationale: “Escutarem” preserva a amplitude semântica do hebraico, que neste contexto envolve dar atenção à instrução divina, sem resolver o termo exclusivamente como obediência.
- issue: Se כִּבְלִי דָעַת expressa condição ou causa
  choice: sem conhecimento
  alternative: por falta de conhecimento
  rationale: A formulação principal conserva a construção hebraica como estado ou condição. Como a leitura causal também é plausível, ela aparece na nota sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perecerão pela espada” mantém o tom poético e judicial, enquanto “morrerão” torna natural o paralelismo. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
