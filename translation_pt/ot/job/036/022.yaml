base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: pt
  text: Eis que Deus é sublime em seu poder[a]; quem é mestre como ele?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por seu poder” ou “por meio de sua força”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Quem ensina como ele?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Vejam
  rationale: Partícula que chama a atenção para a afirmação. “Vejam” é natural no português moderno e mantém a força exortativa e poética.
- source_word: אֵל
  choice: Deus
  rationale: Aqui אֵל é um título divino comum referente a Deus; “Deus” é a forma natural no contexto.
- source_word: יַשְׂגִּיב
  choice: é exaltado
  rationale: O hifil de שׂגב expressa elevação, sublimidade ou manifestação de grandeza. “É exaltado” preserva a concisão e a ambiguidade poética sem reduzir o sentido a mero exercício de poder.
- source_word: בְּכֹחוֹ
  choice: em seu poder
  rationale: A preposição ב pode indicar esfera, modo ou instrumento. “Em seu poder” mantém essa abertura sem decidir entre “por seu poder” e “com sua força”.
- source_word: מִי כָמֹהוּ
  choice: quem é ... como ele?
  rationale: Reproduz diretamente a pergunta retórica comparativa e sua afirmação implícita da incomparabilidade divina.
- source_word: מוֹרֶה
  choice: mestre
  rationale: O particípio substantivado designa aquele que ensina. “Mestre” é conciso, digno e natural, abrangendo tanto professor quanto instrutor.
theological_decisions:
- issue: Sentido da exaltação de Deus em relação ao poder
  choice: O texto declara que Deus é exaltado em conexão com seu poder, sem especificar além disso o modo exato dessa exaltação.
  alternative: Deus age de modo sublime por seu poder; ou Deus torna seguro por sua força.
  rationale: O verbo e a preposição admitem nuances, mas o contexto poético enfatiza a grandeza suprema de Deus. A tradução evita transformar essa relação em uma afirmação doutrinária mais específica do que o hebraico exige.
- issue: A incomparabilidade de Deus como mestre
  choice: A pergunta retórica apresenta Deus como mestre sem igual.
  alternative: “Quem ensina como ele?”
  rationale: A construção hebraica permite destacar tanto a identidade do mestre incomparável quanto seu ato de ensinar. O texto principal conserva a formulação nominal; a nota registra a alternativa verbal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “Vejam” funciona como chamado geral de atenção; “mestre” preserva o tom poético e elevado sem soar arcaico.
