  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: pt
  text: Seu trovão o anuncia[a]; também o gado[b], a respeito do que se levanta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil. Literalmente, a expressão pode ser lida como “seu amigo”; muitos, porém, entendem que ela se refere ao ruído ou trovão da tempestade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “também o gado anuncia a respeito da tempestade que se levanta”. A expressão final diz literalmente “o que sobe” ou “o que se levanta” e provavelmente se refere a uma tempestade que vem chegando.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: anuncia
  rationale: O hifil de נגד significa com frequência “declarar, anunciar, dar a conhecer”. “Anuncia” é natural, digno e adequado ao contexto de uma tempestade que se aproxima.
- source_word: עָלָיו
  choice: o
  rationale: A preposição עַל com sufixo pode significar “a respeito dele” ou “contra ele”. O pronome objeto torna a frase natural em português sem especificar além do hebraico a identidade do referente.
- source_word: רֵעוֹ
  choice: seu trovão
  rationale: A forma é muito difícil. Embora a leitura literal tradicional possa ser “seu amigo”, o contexto meteorológico favorece a compreensão como ruído ou trovão; a alternativa é preservada em nota.
- source_word: מִקְנֶה
  choice: o gado
  rationale: O substantivo designa normalmente gado ou rebanhos. O sentido animal se ajusta ao quadro em que os animais percebem a tempestade que se aproxima.
- source_word: אַף
  choice: também
  rationale: A partícula acrescenta outro elemento à declaração e é expressa naturalmente por “também”.
- source_word: עַל
  choice: a respeito de
  rationale: Mantém o valor relacional neutro de עַל, sem optar por sentidos mais específicos como “contra”.
- source_word: עוֹלֶה
  choice: o que se aproxima
  rationale: O particípio de עלה significa literalmente “o que sobe” ou “o que se levanta”. No contexto, parece referir-se à tempestade que vem surgindo; “se aproxima” comunica essa imagem meteorológica sem inserir explicitamente “tempestade” no texto.
