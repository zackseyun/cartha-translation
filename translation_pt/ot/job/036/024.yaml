  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: pt
  text: Lembre-se de que você deve engrandecer a obra dele[a], que os homens têm celebrado em cânticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que os homens têm contemplado” ou “que os homens têm visto”. O verbo hebraico שֹׁרְרוּ é difícil; alguns o entendem no sentido de ver ou contemplar, em vez de cantar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Lembre-se
  rationale: Imperativo masculino singular de זכר. A forma pronominal é a exortação mais natural no português atual.
- source_word: כִּי
  choice: de
  rationale: Introduz o conteúdo daquilo que deve ser lembrado; em português, a construção idiomática é “lembrar-se de” seguida de infinitivo.
- source_word: תַשְׂגִּיא
  choice: engrandecer
  rationale: O hifil de שׂגא/שׂגה comunica tornar grande, magnificar ou exaltar. “Engrandecer” preserva a força exortativa e soa natural neste contexto de louvor.
- source_word: פָעֳלוֹ
  choice: a obra dele
  rationale: פֹּעַל pode indicar obra, feito ou atividade. “A obra dele” mantém o sentido amplo e conserva o pronome do hebraico, cujo referente contextual é Deus.
- source_word: אֲשֶׁר
  choice: sobre a qual
  rationale: Liga “obra” à oração seguinte e, com “cantar”, expressa em português o tema celebrado no canto.
- source_word: שֹׁרְרוּ
  choice: têm cantado
  rationale: A leitura tradicional entende o verbo poeticamente como cantar ou celebrar em canto. O perfeito é vertido de modo a expressar uma ação humana atestada ao longo do tempo; a alternativa ligada a ver ou contemplar é preservada em nota.
- source_word: אֲנָשִׁים
  choice: os homens
  rationale: O substantivo é masculino plural e pode ter força representativa. “Os homens” reproduz sua forma sem excluir a referência humana geral.
theological_decisions:
- issue: Referente do sufixo masculino singular em פָעֳלוֹ
  choice: dele, entendido contextualmente como Deus
  alternative: explicitar “de Deus”
  rationale: O contexto identifica Deus como referente, mas o texto hebraico emprega um pronome; a tradução conserva essa forma sem tornar explícito o que permanece implícito.
- issue: Sentido do verbo שֹׁרְרוּ
  choice: têm cantado
  alternative: têm contemplado / têm visto
  rationale: A interpretação tradicional como canto se ajusta ao paralelismo poético e à ideia de engrandecer a obra divina, mas a forma hebraica é difícil e permite uma análise relacionada a ver; a ambiguidade é registrada em nota.
- issue: Valor representativo de אֲנָשִׁים
  choice: os homens
  alternative: as pessoas / os seres humanos
  rationale: Mantém-se a expressão masculina do texto-fonte, entendida aqui de modo representativo, sem acrescentar uma limitação teológica ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “Lembre-se de engrandecer” integra naturalmente o imperativo e a exortação subsequente. A nota preserva a incerteza lexical genuína.
