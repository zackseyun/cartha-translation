  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: pt
  text: 'Ele cobre as mãos com o relâmpago[a]

    e lhe ordena que atinja o alvo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “luz”; no contexto da tempestade, provavelmente se refere ao relâmpago.'
    reason: lexical_alternative
  - marker: b
    text: A frase final é de difícil interpretação no hebraico. Outras possibilidades são “contra aquele que é atingido” ou “contra o intercessor”.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: as mãos
  rationale: O dual de כַּף pode designar as palmas ou, de modo mais amplo, as mãos. “As mãos” soa natural e preserva a imagem corporal.
- source_word: כִּסָּה
  choice: cobre
  rationale: כסה significa cobrir ou ocultar. “Cobre” mantém a imagem concreta sem explicá-la além do texto.
- source_word: אוֹר
  choice: o relâmpago
  rationale: Embora אוֹר normalmente signifique “luz”, o contexto poético de tempestade favorece o sentido contextual de “relâmpago”.
- source_word: וַיְצַו
  choice: ordena
  rationale: צוה expressa ordenar ou mandar e preserva a agência pessoal de Deus.
- source_word: עָלֶיהָ
  choice: lhe
  rationale: O sufixo feminino tem referente incerto, mas provavelmente retoma o relâmpago concebido como descarga ou seta. “Lhe” permite que o pronome se refira naturalmente a “relâmpago” em português sem apagar a dificuldade da construção.
- source_word: בְמַפְגִּיעַ
  choice: que atinja o alvo
  rationale: A forma derivada de פגע é notoriamente difícil. No contexto da tempestade, esta formulação comunica a provável ideia de Deus dirigir o relâmpago ao ponto de impacto, enquanto a nota preserva outras análises possíveis.
theological_decisions:
- issue: Possível sentido de “intercessor” em בְמַפְגִּיעַ
  choice: que atinja o alvo
  alternative: contra o intercessor
  rationale: O contexto imediato favorece a trajetória ou o impacto do relâmpago. A tradução não introduz um sentido teológico de intercessão onde a sintaxe e o contexto permanecem incertos; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético em dois versos. A formulação mantém a imagem incomum de Deus cobrindo as mãos com o relâmpago e sinaliza em notas as duas principais dificuldades lexicais.
