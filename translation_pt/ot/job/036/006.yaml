source:
  edition: WLC
  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: pt
  text: 'Não mantém vivo o perverso[a],

    mas faz justiça aos aflitos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixa o perverso viver”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos pobres”. A palavra hebraica pode designar pessoas aflitas, oprimidas, humilhadas ou economicamente pobres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: mantém vivo
  rationale: O piel de חיה, neste contexto, indica preservar ou manter com vida, não ressuscitar nem conceder vida em sentido teológico.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O singular hebraico tem valor genérico. “O perverso” conserva essa forma representativa e soa natural em português.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Aqui designa o resultado justo ou o direito concedido aos aflitos, e não apenas um ato judicial.
- source_word: עֲנִיִּים
  choice: os aflitos
  rationale: O termo pode abranger pessoas pobres, oprimidas, humilhadas ou afligidas; “os aflitos” preserva melhor essa amplitude.
- source_word: יִתֵּן
  choice: faz
  rationale: Embora נתן signifique literalmente “dar”, a expressão idiomática portuguesa “fazer justiça” transmite naturalmente a construção hebraica “dar justiça”.
- source_word: וּ
  choice: mas
  rationale: A conjunção, literalmente “e”, estabelece aqui contraste entre o tratamento dado ao perverso e o concedido aos aflitos.
theological_decisions:
- issue: Se יְחַיֶּה deve sugerir ressurreição ou concessão de vida em sentido teológico
  choice: “mantém vivo”, indicando preservação temporal
  alternative: “dá vida” ou “faz viver”
  rationale: 'O paralelismo trata do governo justo de Deus: ele não preserva o perverso, mas assegura justiça aos aflitos. Uma formulação ligada à ressurreição acrescentaria uma ideia não exigida pelo texto.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A inversão poética foi evitada; “faz justiça” é mais idiomático em português do que o literal “dá justiça”. Todos os marcadores de nota aparecem no texto.
