  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: pt
  text: Não anseie pela noite[a], quando os povos são removidos de seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «Não anseie pela noite, para os povos subirem de debaixo deles». O hebraico é difícil; «são removidos de seu lugar» reflete uma interpretação contextual comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל expressa uma proibição; em português, «Não» seguido do subjuntivo transmite naturalmente essa força.
- source_word: תִּשְׁאַף
  choice: anseie
  rationale: שׁאף pode indicar ofegar ou desejar intensamente. «Anseie» comunica aqui o desejo intenso e proibido sem soar excessivamente literal.
- source_word: הַלָּיְלָה
  choice: pela noite
  rationale: Representa diretamente o substantivo definido e se combina de modo natural com o verbo «ansiar» em português.
- source_word: לַעֲלוֹת
  choice: quando ... são arrancados
  rationale: O infinitivo de עלה é difícil neste contexto. A formulação temporal e passiva comunica a interpretação contextual comum de remoção, sem ocultar na nota a redação hebraica mais literal.
- source_word: עַמִּים
  choice: povos
  rationale: Preserva o plural e o sentido coletivo de grupos humanos ou nações.
- source_word: תַּחְתָּם
  choice: de seu lugar
  rationale: Embora תחת signifique literalmente «debaixo», neste contexto a expressão provavelmente retrata povos removidos de sua posição ou lugar. «De seu lugar» comunica esse sentido de modo idiomático.
theological_decisions: []
