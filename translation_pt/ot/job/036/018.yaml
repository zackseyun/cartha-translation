lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou a advertência ligada ao contexto anterior; “pois” preserva a força causal sem tornar a relação excessivamente explícita.
- source_word: חֵמָה
  choice: a ira
  rationale: Expressa cólera intensa e mantém em aberto se a referência é à ira de Jó, à ira divina ou à ira em sentido geral.
- source_word: פֶּן יְסִיתְךָ
  choice: cuidado para que ela não induza você
  rationale: A partícula פֶּן introduz uma advertência, e o hifil de סות pode significar incitar, seduzir ou desencaminhar. A formulação é natural em português e mantém a ira como provável sujeito do verbo.
- source_word: בְסָפֶק
  choice: à zombaria
  rationale: O termo é raro e difícil. “Zombaria” comunica a provável ideia contextual de um gesto ou atitude de escárnio, enquanto a leitura mais literal é registrada em nota.
- source_word: רָב כֹּפֶר
  choice: um grande resgate
  rationale: רָב qualifica naturalmente כֹּפֶר como elevado ou abundante. “Grande resgate” é claro e não restringe כֹּפֶר ao sentido mais específico de suborno.
- source_word: אַל יַטֶּךָּ
  choice: não deixe que ... o desvie
  rationale: O verbo נטה no hifil pode indicar fazer alguém se inclinar ou se afastar do rumo; “desviar” conserva essa imagem.
theological_decisions:
- issue: Referente de “ira”
  choice: Manter apenas “a ira”, sem identificar seu possuidor ou origem.
  alternative: “a ira de Deus” ou “a sua ira”
  rationale: O hebraico não explicita o referente, e defini-lo resolveria uma ambiguidade teológica genuína.
- issue: Sentido de כֹּפֶר
  choice: “resgate” no texto principal
  alternative: “preço de expiação”, “compensação” ou “suborno”
  rationale: “Resgate” preserva melhor a amplitude semântica do termo e evita impor uma interpretação jurídica, cultual ou moral específica.
translation_notes:
  register: Português moderno, digno e acessível, com “você” para ampla legibilidade brasileira. O travessão conserva a construção abrupta e enfática do hebraico; a formulação evita identificar indevidamente a origem da ira.
