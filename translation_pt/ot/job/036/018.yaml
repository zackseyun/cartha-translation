  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: pt
  text: Pois a ira — cuidado para que não o induza à zombaria[a]; e não deixe que um grande resgate[b][c] o desvie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “com bater de mãos” ou “com aplausos”. O termo hebraico é difícil e talvez se refira a bater as mãos ou a aplaudir, possivelmente como gesto de escárnio.'
