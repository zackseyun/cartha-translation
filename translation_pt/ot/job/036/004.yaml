  text: כִּֽי אָ֭מְנָם לֹא שֶׁ֣קֶר מִלָּ֑/י תְּמִ֖ים דֵּע֣וֹת עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: pt
  text: Pois, de fato, minhas palavras não são falsas; quem tem conhecimento completo está com você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que tem conhecimento completo está com você”; talvez se refira a Deus, e não ao próprio Eliú.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Pois, de fato
  rationale: Combina o valor explicativo de כִּי com a ênfase afirmativa de אָמְנָם, ligando o versículo ao discurso anterior sem perder a força da declaração.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: minhas palavras não são falsas
  rationale: Reproduz de maneira direta e idiomática a negação da falsidade aplicada às palavras de Eliú.
- source_word: תְּמִים
  choice: completo
  rationale: Expressa a ideia de inteireza ou plenitude no âmbito do conhecimento, evitando sugerir necessariamente perfeição moral ou impecabilidade.
- source_word: דֵּעוֹת
  choice: conhecimento
  rationale: O plural abstrato hebraico é vertido naturalmente pelo singular coletivo em português.
- source_word: עִמָּךְ
  choice: está com você
  rationale: Mantém o sentido direto da preposição e o tratamento singular dirigido a Jó.
theological_decisions:
- issue: Referente de “quem tem conhecimento completo”
  choice: A redação principal permite a leitura contextual de que Eliú fala de si mesmo.
  alternative: A expressão pode referir-se a Deus como aquele que possui conhecimento completo e está com Jó.
  rationale: A defesa imediata de “minhas palavras” favorece a autorreferência de Eliú, mas a construção hebraica não identifica explicitamente o sujeito; por isso, a alternativa teologicamente significativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Conhecimento completo” conserva a ousadia retórica da expressão hebraica sem impor a ideia de perfeição moral absoluta.
