  text: אֲשֶֽׁר יִזְּל֥וּ שְׁחָקִ֑ים יִ֝רְעֲפ֗וּ עֲלֵ֤י אָדָ֬ם רָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/028.yaml
  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: pt
  text: que as nuvens derramam; elas gotejam abundantemente sobre a humanidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o ser humano”. O hebraico emprega aqui o singular אָדָם em sentido genérico, referindo-se à humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo que liga o versículo ao antecedente do contexto anterior, sem explicitar além do hebraico aquilo que é derramado.
- source_word: יִזְּלוּ
  choice: derramam
  rationale: O verbo נזל descreve algo que flui para baixo; no contexto da chuva, “derramam” comunica naturalmente esse movimento.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: Na imagem poética meteorológica, o termo designa os céus ou as massas de nuvens; “as nuvens” corresponde melhor ao contexto imediato.
- source_word: יִרְעֲפוּ
  choice: fazem cair
  rationale: רָעַף indica gotejar ou deixar cair em forma de chuva. “Fazem cair” preserva a descida das gotas e permite que o objeto relativo continue implícito, como no hebraico.
- source_word: עֲלֵי
  choice: sobre
  rationale: Expressa o movimento descendente em direção às pessoas abaixo.
- source_word: אָדָם
  choice: a humanidade
  rationale: O singular hebraico é genérico e coletivo neste contexto. “A humanidade” transmite naturalmente em português a referência a todos os seres humanos.
- source_word: רָב
  choice: abundantemente
  rationale: Entendido adverbialmente, indica a grande quantidade da precipitação, não uma multidão de indivíduos.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: a humanidade
  alternative: o ser humano
  rationale: Aqui אָדָם representa coletivamente os seres humanos. A formulação principal comunica esse alcance genérico sem restringir a referência ao sexo masculino; a nota preserva a forma singular mais próxima do hebraico.
translation_notes:
  register: Português moderno, poético e digno. A oração permanece subordinada ao versículo anterior, como no hebraico. Evitou-se acrescentar “chuva” ao texto principal, embora esteja implícita no contexto.
