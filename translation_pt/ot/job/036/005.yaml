id: JOB.36.5
reference: Job 36:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: pt
  text: Eis que Deus é poderoso e não rejeita[a]; ele é poderoso em força de coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não despreza” ou “não repudia”. O hebraico não explicita o objeto do verbo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “força de coração”; a expressão também pode indicar força de entendimento, firmeza interior ou determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Eis que
  rationale: Introduz uma afirmação enfática e preserva o tom elevado e poético do discurso.
- source_word: אֵל
  choice: Deus
  rationale: É o termo poético comum para Deus neste contexto, sem necessidade de transformá-lo em um título ampliado.
- source_word: כַּבִּיר
  choice: poderoso
  rationale: Expressa grandeza e poder e permite conservar a repetição poética presente nos dois usos do termo hebraico.
- source_word: וְלֹא יִמְאָס
  choice: e não rejeita
  rationale: מאס pode significar rejeitar, desprezar ou repudiar. A formulação mantém implícito o objeto, como no hebraico, sem acrescentar 'ninguém' ao texto principal.
- source_word: כֹּחַ לֵב
  choice: força de coração
  rationale: Mantém a imagem literal e a concisão do hebraico, deixando para a nota as possibilidades de entendimento, firmeza interior ou determinação.
theological_decisions:
- issue: Objeto implícito de “não rejeita”
  choice: não rejeita, sem objeto expresso
  alternative: não rejeita ninguém; não despreza; não despreza os poderosos
  rationale: O hebraico não declara o objeto. A tradução preserva essa abertura em vez de especificar uma pessoa ou classe e, assim, evita resolver silenciosamente uma ambiguidade relevante.
- issue: Sentido de “força de coração”
  choice: preservar a expressão metafórica
  alternative: grande em entendimento; firme em propósito; poderoso em sabedoria
  rationale: No hebraico, “coração” pode referir-se ao entendimento, à disposição interior ou à determinação. A expressão literal conserva essa amplitude sem impor uma única interpretação.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira. “Eis que” conserva a ênfase discursiva; a repetição de “poderoso” reproduz o paralelismo hebraico. A formulação deliberadamente incomum “força de coração” preserva a metáfora e sua ambiguidade, esclarecidas em nota.
