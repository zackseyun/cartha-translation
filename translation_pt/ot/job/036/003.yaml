  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: pt
  text: Trarei de longe o meu conhecimento e atribuirei justiça ao meu Criador[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: Trarei
  rationale: נשׂא significa literalmente levantar, carregar ou levar; com “meu conhecimento” e a expressão de distância, “trarei” comunica naturalmente a ideia de buscar e apresentar conhecimento, sem apagar a metáfora.
- source_word: דֵעִי
  choice: o meu conhecimento
  rationale: דֵּעַ, com sufixo de primeira pessoa, designa conhecimento ou entendimento. “O meu conhecimento” é direto e preserva a formulação do hebraico.
- source_word: לְמֵרָחוֹק
  choice: de longe
  rationale: A expressão indica distância e, neste contexto, pode apontar para a origem ou o alcance do conhecimento. “De longe” preserva de forma concisa essa abertura semântica.
- source_word: וּלְפֹעֲלִי
  choice: ao meu Criador
  rationale: O particípio פֹּעֵל é literalmente “aquele que faz”, e o sufixo indica “aquele que me fez”. “Meu Criador” é natural, digno e contextualmente claro.
- source_word: אֶתֵּן
  choice: atribuirei
  rationale: Embora נתן signifique literalmente “dar”, com “justiça” como objeto e o Criador como destinatário, o sentido idiomático é reconhecer ou atribuir-lhe essa qualidade.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange justiça, retidão e aquilo que é correto. “Justiça” é natural em português e mantém em aberto tanto o caráter justo de Deus quanto a correção de seus atos; “retidão” permanece uma alternativa legítima.
theological_decisions:
- issue: Sentido de צֶדֶק aplicado a Deus
  choice: justiça
  alternative: retidão
  rationale: O termo hebraico pode designar justiça e retidão moral. “Justiça” conserva a dimensão judicial relevante no discurso de Eliú, enquanto a nota registra “retidão” para preservar o alcance mais amplo do caráter e dos atos de Deus.
- issue: Identidade de פֹעֲלִי
  choice: meu Criador
  alternative: aquele que me fez
  rationale: O particípio descreve literalmente quem faz ou realiza. No contexto, refere-se a Deus como aquele que fez o falante; “Criador” exprime isso naturalmente sem acrescentar uma distinção doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha de perto o paralelismo hebraico; “trarei de longe” preserva a imagem incomum do original, e as notas mantêm alternativas lexicais relevantes.
