base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: pt
  text: Mas os ímpios de coração[b] acumulam ira; não clamam por socorro quando[a] ele os prende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ele os prende” ou “pois ele os prende”. A conjunção hebraica também pode ser entendida em sentido causal, e não temporal.'
    reason: alternative_reading
  - marker: b
    text: “Os ímpios de coração” também podem ser traduzidos como “os hipócritas de coração” ou “os irreverentes no íntimo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: os ímpios de coração
  rationale: חנף pode designar pessoas ímpias, irreverentes ou hipócritas. No contexto de Jó, “ímpios” expressa melhor a falta de reverência a Deus, enquanto “de coração” preserva a referência à disposição interior.
- source_word: יָשִׂימוּ אָף
  choice: acumulam ira
  rationale: A expressão hebraica literalmente envolve “pôr” ira. “Acumulam ira” conserva a ideia de reter ou ajuntar ira interiormente e soa natural em português.
- source_word: לֹא יְשַׁוְּעוּ
  choice: não clamam por socorro
  rationale: No piel, שׁוע normalmente indica clamar em busca de ajuda. “Clamam por socorro” explicita naturalmente essa finalidade sem ampliar indevidamente o texto.
- source_word: כִּי
  choice: quando
  rationale: Aqui כִּי pode ter valor temporal, indicando que eles não clamam no momento em que são presos ou afligidos. A leitura causal também é possível e foi preservada em nota.
- source_word: אֲסָרָם
  choice: ele os prende
  rationale: אָסַר pode significar amarrar, prender ou pôr em grilhões. “Prende” mantém a amplitude do verbo e funciona naturalmente no contexto da aflição; o sujeito singular permanece pronominal, como no hebraico.
theological_decisions:
- issue: Referente do sujeito singular em “ele os prende”
  choice: Manter “ele”, com Deus como referente contextual.
  alternative: Explicitar “Deus os prende”.
  rationale: O hebraico emprega uma forma verbal na terceira pessoa do singular, e o contexto aponta para Deus. Manter o pronome preserva a forma e a discreta implicitude do texto-fonte.
- issue: Valor temporal ou causal de כִּי
  choice: 'Leitura temporal no texto: “quando”.'
  alternative: 'Leitura causal: “porque/pois ele os prende”.'
  rationale: A leitura temporal se encaixa bem no quadro de não clamarem durante a aflição, mas a conjunção hebraica admite uma relação causal genuína, registrada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A formulação conserva o paralelismo conciso e a ambiguidade relevante da conjunção hebraica.
