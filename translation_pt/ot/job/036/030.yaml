base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: pt
  text: Eis que ele estende sua luz[b] sobre ela[a] e cobre as raízes do mar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre ele”. O pronome hebraico é masculino singular, mas seu referente não é explícito; pode apontar para a nuvem ou a tempestade do contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “seu relâmpago” ou “seu clarão”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “as raízes do mar”; a expressão pode indicar suas partes mais profundas ou seus fundamentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Partícula discursiva que chama a atenção para a imagem seguinte; “eis que” mantém a força poética elevada e continua compreensível em português.
- source_word: פָּרַשׂ
  choice: estende
  rationale: Expressa o ato de espalhar ou desdobrar algo sobre uma extensão, preservando de modo natural a imagem hebraica.
- source_word: עָלָיו
  choice: sobre ela
  rationale: O sufixo hebraico é masculino singular, mas seu referente não é expresso. No contexto da tempestade, a tradução principal entende que retoma uma nuvem ou massa de tempestade; a ambiguidade é registrada em nota.
- source_word: אוֹרוֹ
  choice: a sua luz
  rationale: Mantém o sentido amplo e direto de אוֹר, sem restringi-lo a “relâmpago”, embora o contexto permita essa nuance.
- source_word: וְשָׁרְשֵׁי
  choice: e ... as raízes de
  rationale: Conserva a metáfora concreta e incomum do hebraico, que pode indicar as partes mais profundas ou fundamentais.
- source_word: הַיָּם
  choice: o mar
  rationale: Corresponde diretamente ao substantivo hebraico, sem generalizá-lo como “águas”.
- source_word: כִּסָּה
  choice: cobre
  rationale: Reproduz o sentido básico do verbo e se ajusta à sequência descritiva no presente poético.
theological_decisions:
- issue: Referente do pronome em עָלָיו
  choice: 'Entendido no texto principal como a nuvem ou massa de tempestade implícita: “sobre ela”.'
  alternative: “sobre ele”, possivelmente com referência a Deus, ou “ao redor dele”.
  rationale: O verso não identifica explicitamente o referente. A tradução principal segue o cenário meteorológico imediato, mas a nota preserva a possibilidade formal do masculino singular e evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe poética concisa. “Eis que” conserva o destaque discursivo do hebraico; as imagens “luz” e “raízes do mar” são mantidas no corpo do texto, enquanto as possíveis interpretações contextuais aparecem nas notas.
