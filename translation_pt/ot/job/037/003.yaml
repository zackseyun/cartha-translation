base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: pt
  text: Sob todos os céus, ele o envia; e o seu relâmpago, até os confins da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a sua luz sobre as asas da terra”. Em hebraico, literalmente “sua luz” e “asas da terra”; no contexto, a luz provavelmente se refere ao relâmpago, e as “asas” são as extremidades ou os confins da terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sob
  rationale: Reproduz diretamente a imagem espacial do hebraico e soa natural na expressão poética “sob todos os céus”.
- source_word: כָּל הַשָּׁמַיִם
  choice: todos os céus
  rationale: Mantém o plural e a abrangência do texto hebraico, preservando seu registro poético.
- source_word: יִשְׁרֵהוּ
  choice: ele o envia
  rationale: Expressa o sentido contextual de fazer sair ou dirigir, mantendo o objeto pronominal do hebraico sem identificá-lo além do que o versículo explicita.
- source_word: וְאוֹרוֹ
  choice: e o seu relâmpago
  rationale: Embora אוֹר signifique literalmente “luz”, o contexto da tempestade favorece “relâmpago”; a alternativa literal é registrada em nota.
- source_word: עַל
  choice: até
  rationale: Em português, “até” comunica naturalmente a extensão ou o alcance indicado no contexto, em vez de reproduzir de modo rígido o valor espacial de “sobre”.
- source_word: כַּנְפוֹת הָאָרֶץ
  choice: os confins da terra
  rationale: A expressão significa literalmente “as asas da terra” e designa poeticamente suas extremidades; “confins” preserva o tom elevado e comunica o sentido com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção poética. O plural “céus” e o pronome objeto em “ele o envia” preservam aspectos formais e a ambiguidade do hebraico; “relâmpago” e “confins” comunicam os referentes contextuais de maneira natural.
