  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: pt
  text: Do norte vem um brilho dourado; sobre Deus há uma majestade temível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: Do norte
  rationale: Reproduz diretamente a origem indicada pela preposição מִן e pelo substantivo צָפוֹן.
- source_word: זָהָב
  choice: esplendor dourado
  rationale: O sentido básico é “ouro”, mas no contexto poético e em combinação com o verbo de chegada pode designar um brilho ou esplendor áureo; a formulação preserva a imagem sem reduzir a expressão a ouro material.
- source_word: יֶאֱתֶה
  choice: vem
  rationale: Forma verbal rara, entendida aqui como “chegar/vir”; “vem” é natural e mantém a concisão do hebraico.
- source_word: עַל אֱלוֹהַּ
  choice: ao redor de Deus
  rationale: Embora עַל costume significar “sobre”, neste contexto pode exprimir aquilo que envolve ou cerca Deus; a escolha produz português natural e acompanha a leitura contextual sem acrescentar agente.
- source_word: נוֹרָא הוֹד
  choice: majestade temível
  rationale: הוֹד indica majestade, esplendor ou dignidade, enquanto נוֹרָא comunica algo que inspira temor reverente; “temível” preserva essa força.
theological_decisions:
- issue: Relação espacial expressa por עַל com referência a Deus
  choice: ao redor de Deus
  alternative: sobre Deus
  rationale: “Sobre Deus” poderia sugerir que a majestade se encontra acima dele ou lhe é imposta. “Ao redor de Deus” comunica sua presença envolvente no quadro poético, sem resolver a imagem em uma afirmação doutrinária mais específica.
- issue: Sentido de נוֹרָא
  choice: temível
  alternative: impressionante
  rationale: “Temível” conserva a dimensão de temor reverente e a intensidade teológica do termo, enquanto “impressionante” seria mais fraco e coloquial.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético conciso. “Esplendor dourado” mantém a imagem luminosa de זָהָב, e “majestade temível” conserva a tensão entre glória e temor.
