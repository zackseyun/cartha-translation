  text: וְ/עַתָּ֤ה לֹ֘א רָ֤אוּ א֗וֹר בָּהִ֣יר ה֭וּא בַּ/שְּׁחָקִ֑ים וְ/ר֥וּחַ עָ֝בְרָ֗ה וַֽ/תְּטַהֲרֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: pt
  text: E agora não se vê a luz[a], embora ela seja brilhante nas alturas[b]; mas passa um vento e as deixa límpidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se viu a luz, que é brilhante nas alturas”. A sequência hebraica é compacta e pode ser entendida sem sentido concessivo.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico pode designar os céus ou as massas de nuvens. O pronome em “as deixa límpidas” está no plural e provavelmente se refere a eles; o sentido geral também pode ser expresso como “deixa o céu limpo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação discursiva de וְ quanto o valor temporal de עַתָּה, com formulação natural em português.
- source_word: לֹא רָאוּ
  choice: não se vê
  rationale: O perfeito qal na terceira pessoa do plural pode expressar uma observação presente ou geral. A construção impessoal em português evita introduzir um referente humano indefinido e se ajusta à cena meteorológica.
- source_word: אוֹר
  choice: a luz
  rationale: Mantém o termo amplo do hebraico sem especificá-lo interpretativamente como luz solar.
- source_word: בָּהִיר הוּא
  choice: embora brilhe
  rationale: Expressa com naturalidade o brilho da luz e a relação concessiva provável no contexto, sem apagar na nota a possibilidade de uma sequência menos concessiva.
- source_word: בַּשְּׁחָקִים
  choice: nas alturas
  rationale: שְׁחָקִים pode designar os céus elevados ou as massas de nuvens. 'Nas alturas' conserva o tom poético sem restringir indevidamente o referente.
- source_word: וְרוּחַ
  choice: então passa um vento
  rationale: רוּחַ tem sentido meteorológico e é indefinido; 'então' comunica a progressão da cena sem impor uma oposição forte.
- source_word: עָבְרָה
  choice: passa
  rationale: O presente torna vívida a observação meteorológica e reproduz naturalmente o movimento do vento.
- source_word: וַתְּטַהֲרֵם
  choice: e as deixa límpidas
  rationale: טהר aqui significa tornar limpo ou claro. O pronome feminino plural retoma naturalmente 'as alturas' em português, preservando o objeto plural do hebraico.
