  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: pt
  text: 'Pois ele diz à neve[a]: “Caia sobre a terra”; à chuva: “Seja um aguaceiro”; e às chuvas[b]: “Sejam aguaceiros do seu poder”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esteja sobre a terra”, no sentido de que a neve recebe a ordem de aparecer ou permanecer no chão.'
    reason: lexical_alternative
  - marker: b
    text: A frase final também pode ser traduzida como “e os fortes aguaceiros do seu poder” ou “e as poderosas torrentes de chuva”. O hebraico é condensado e poético.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do domínio de Deus sobre os fenômenos atmosféricos no contexto anterior.
- source_word: לַשֶּׁלַג
  choice: à neve
  rationale: A preposição ל com אמר indica naturalmente o destinatário, preservando a personificação poética.
- source_word: יֹאמַר
  choice: diz
  rationale: O imperfeito descreve vividamente uma ação característica; o presente é natural em português.
- source_word: הֱוֵא אָרֶץ
  choice: Caia sobre a terra
  rationale: O imperativo de היה é literalmente amplo, mas aqui ordena que a neve se apresente ou esteja sobre a terra; “caia” comunica com naturalidade a imagem contextual, enquanto a nota preserva a alternativa.
- source_word: וְגֶשֶׁם מָטָר
  choice: 'à chuva: “Torne-se aguaceiro”'
  rationale: Mantém os dois termos próximos para chuva e reproduz o paralelismo como ordem, sem reduzir a expressão a um único elemento.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: 'e às chuvas: “Tornem-se um temporal do seu poder”'
  rationale: O plural מִטְרוֹת sugere chuvas intensificadas ou repetidas; a formulação conserva o paralelismo imperativo e a expressão de força divina, reconhecendo em nota a compressão poética.
- source_word: עֻזּוֹ
  choice: seu poder
  rationale: O sufixo masculino singular se refere mais naturalmente a Deus, sujeito implícito que governa o clima no contexto.
theological_decisions:
- issue: Referente do pronome em עֻזּוֹ
  choice: 'O pronome se refere a Deus: “seu poder”.'
  alternative: O pronome pode ser associado às chuvas, com o sentido de “sua força”.
  rationale: Deus é aquele que fala e controla o clima no contexto imediato. A leitura escolhida acompanha esse fluxo, sem ocultar que a construção hebraica admite discussão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a personificação foram preservados; “aguaceiro” e “temporal” distinguem de modo natural as intensidades da chuva.
