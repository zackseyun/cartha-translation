    issue: O sintagma nominal hebraico foi convertido em uma oração explicativa.
    rationale: «Como as nuvens ficam suspensas» explicita uma nuance possível de מִפְלְשֵׂי, enquanto o hebraico mantém um substantivo raro e ambíguo.
  - severity: medium
