  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: pt
  text: Você conhece o equilíbrio das nuvens, maravilhas daquele que é perfeito em conhecimento?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Você sabe
  rationale: A partícula interrogativa com o verbo ידע introduz uma pergunta retórica dirigida a Jó. A formulação direta preserva o desafio do hebraico sem acrescentar a ideia mais específica de compreensão profunda.
- source_word: עַל
  choice: como
  rationale: Neste contexto, a preposição introduz o fenômeno acerca do qual se pergunta. Em português, a construção com «como» produz uma pergunta natural e liga claramente o saber ao modo pelo qual as nuvens permanecem no céu.
- source_word: מִפְלְשֵׂי עָב
  choice: as nuvens ficam suspensas
  rationale: O substantivo raro מִפְלְשֵׂי tem sentido exato incerto e parece descrever a disposição, expansão ou sustentação das nuvens. «Ficam suspensas» comunica com clareza o fenômeno sem apresentar como certa uma imagem técnica de equilíbrio; a alternativa lexical é registrada em nota.
- source_word: מִפְלְאוֹת
  choice: maravilhas
  rationale: Expressa atos ou fenômenos extraordinários e mantém a linguagem elevada do verso em português corrente.
- source_word: תְּמִים
  choice: perfeito
  rationale: No contexto, indica inteireza ou perfeição, especialmente quanto ao conhecimento, e não apenas inocência moral.
- source_word: דֵּעִים
  choice: em conhecimento
  rationale: O plural hebraico pode comunicar plenitude ou abundância de saber. O singular abstrato é idiomático em português e conserva a expressão sem artificialidade.
theological_decisions:
- issue: Referente de «daquele que é perfeito em conhecimento»
  choice: Manter o referente implícito, permitindo que o contexto identifique Deus
  alternative: Inserir explicitamente «Deus» ou entender a expressão como referência genérica ou autorreferência de Eliú
  rationale: O contexto do discurso sobre o domínio do clima aponta naturalmente para Deus, mas o hebraico não traz aqui o nome divino. A tradução preserva essa forma indireta e não resolve além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A pergunta retórica foi preservada, bem como a incerteza lexical do termo raro e a referência implícita a Deus.
