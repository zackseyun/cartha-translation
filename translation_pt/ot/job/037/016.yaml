    rationale: Em hebraico, «maravilhas daquele que é perfeito em conhecimento» qualifica ou identifica o fenômeno mencionado; em português, a redação atual não expressa essa relação com clareza.
  revised_text: Você conhece o equilíbrio das nuvens, maravilhas daquele que é perfeito em conhecimento?
