  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: pt
  text: Você pode, com ele, estender[a] os céus[b], duros como um espelho de metal fundido[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “martelar para estender” ou “espalhar”. O verbo hebraico pode evocar tanto o ato de bater metal até deixá-lo fino quanto o de estender algo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o firmamento” ou “as nuvens”. O termo hebraico שׁחקים é poético e pode referir-se aos céus e, em alguns contextos, às nuvens.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “como um espelho fundido”. A expressão se refere a um espelho de metal moldado por fundição; a imagem apresenta os céus como duros e brilhantes.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: estender
  rationale: O hifil de רקע pode descrever espalhar ou bater algo até deixá-lo fino, especialmente metal. “Estender” é natural em português e preserva a ideia de formar uma ampla extensão, enquanto a nota registra a imagem metalúrgica possível.
- source_word: עִמּוֹ
  choice: com ele
  rationale: A forma pronominal significa literalmente “com ele”. Embora o referente contextual seja Deus, mantém-se o pronome do hebraico sem explicitar o referente no texto principal.
- source_word: לִשְׁחָקִים
  choice: os céus
  rationale: שׁחקים é um termo poético que pode designar os céus, o firmamento ou, em certos contextos, as nuvens. A comparação com um espelho metálico favorece aqui a extensão celeste visível.
- source_word: חֲזָקִים
  choice: sólidos
  rationale: O adjetivo comunica força, firmeza ou dureza. “Sólidos” se ajusta naturalmente à comparação com um espelho metálico e preserva a representação poética antiga sem transformá-la numa afirmação explicativa.
- source_word: כִּרְאִי
  choice: como um espelho
  rationale: רְאִי designa um espelho, e o prefixo כ introduz a comparação, traduzida diretamente por “como”.
- source_word: מוּצָק
  choice: de metal fundido
  rationale: O particípio passivo indica algo derramado ou moldado por fundição. A menção a metal torna compreensível para o leitor moderno a fabricação dos antigos espelhos, sem especificar bronze, que não aparece no hebraico.
