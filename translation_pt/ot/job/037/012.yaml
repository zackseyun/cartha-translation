source:
  edition: WLC
  text: וְ/ה֤וּא מְסִבּ֨וֹת מִתְהַפֵּ֣ךְ ב/תחבולת/ו לְ/פָעֳלָ֑/ם כֹּ֖ל אֲשֶׁ֥ר יְצַוֵּ֓/ם עַל פְּנֵ֖י תֵבֵ֣ל אָֽרְצָ/ה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: pt
  text: Ela dá voltas e muda de direção conforme ele a guia,[a][b] para que elas façam tudo o que ele lhes ordena sobre toda a face do mundo habitado, na terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «gira em circuitos»; o hebraico combina a ideia de dar voltas com a de mudar de direção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «sob sua direção» ou «conforme ele a conduz»; o termo hebraico sugere condução hábil.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: «o mundo habitado, em direção à terra», expressão sobreposta que descreve o âmbito terrestre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ela
  rationale: O pronome hebraico é masculino singular, mas retoma no contexto um fenômeno meteorológico, provavelmente a nuvem ou massa de nuvens; em português, o feminino concorda naturalmente com «nuvem», sem estreitar essa identificação no próprio texto.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: dá voltas e muda de direção
  rationale: A combinação exprime movimento circular ou em circuitos e mudança de rumo. A formulação preserva os dois aspectos sem sugerir necessariamente rotação violenta.
- source_word: בְּתַחְבֻלֹתוֹ
  choice: conforme ele a guia
  rationale: O substantivo indica direção hábil, condução ou controle. A expressão portuguesa é natural e mantém Deus como aquele que dirige o fenômeno.
- source_word: לְפָעֳלָם
  choice: para que elas façam
  rationale: O sufixo plural aponta para os agentes meteorológicos que executam a ordem. A oração final comunica de modo claro o propósito da movimentação.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: tudo o que ele lhes ordena
  rationale: Preserva a abrangência de כֹּל אֲשֶׁר e o sentido normal do piel de צוה, mantendo explícito o objeto plural.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: sobre toda a face do mundo habitado, na terra
  rationale: «Face» conserva a imagem espacial; «mundo habitado» expressa a nuance de תֵבֵל; «na terra» retém a expressão direcional/local final e sua sobreposição semântica.
theological_decisions:
- issue: Referente do pronome singular e dos sufixos plurais
  choice: O singular é vertido como «ela», sugerindo a nuvem mencionada pelo contexto, enquanto o plural «elas» permanece sem antecedente nominal inserido.
  alternative: Explicitar «as nuvens» ou tratar todo o fenômeno como singular.
  rationale: O contexto meteorológico sustenta a referência à nuvem ou ao sistema de nuvens, mas o hebraico alterna singular e plural. A tradução conserva essa tensão em vez de impor uma identificação científica ou uniformizar o número.
- issue: Agência e governo divino sobre os fenômenos meteorológicos
  choice: «conforme ele a guia» e «ele lhes ordena»
  alternative: Formulações impessoais ou uma tradução mais forte como «sob seu controle».
  rationale: O texto apresenta direção e comando divinos, mas não exige o vocabulário interpretativo mais abstrato de «controle soberano».
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção clara. A alternância entre «ela» e «elas» é deliberada para refletir a mudança de número do hebraico; as notas preservam as principais ambiguidades lexicais e espaciais.
