  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: pt
  text: você, cujas roupas ficam quentes quando a terra se aquieta por causa do vento do sul?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do sul”. O hebraico diz literalmente “do sul”, expressão que pode se referir de modo mais geral à região sul; “vento do sul” explicita o sentido meteorológico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: você, cujas
  rationale: O relativo introduz uma descrição do interlocutor, Jó. A formulação mantém o vínculo com a segunda pessoa e soa natural em português.
- source_word: בְּגָדֶיךָ
  choice: suas roupas
  rationale: בגד designa roupa ou vestimenta. “Roupas” é claro, atual e adequado ao registro poético sem soar arcaico.
- source_word: חַמִּים
  choice: ficam quentes
  rationale: O adjetivo significa “quentes” ou “aquecidas”. “Ficam quentes” expressa naturalmente em português a condição experimentada no cenário descrito.
- source_word: בְּהַשְׁקִט
  choice: quando ... se aquieta
  rationale: A forma de שקט com בְּ tem valor temporal e descreve a terra ficando quieta, imóvel ou em repouso. “Se aquieta” preserva tanto o sentido quanto a imagem poética.
- source_word: אֶרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar “terra” ou “região”. Aqui “a terra” preserva a amplitude e se ajusta ao contexto meteorológico.
- source_word: מִדָּרוֹם
  choice: por causa do vento sul
  rationale: דָּרוֹם significa literalmente “sul” ou “região sul”. No contexto meteorológico, pode indicar o vento quente vindo do sul; a tradução explicita essa relação causal, enquanto a nota conserva a forma mais literal.
