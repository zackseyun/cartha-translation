source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: pt
  text: Quanto ao Todo-Poderoso, não podemos compreendê-lo plenamente[a]. Ele é grande em poder; em justiça[b] e em abundante retidão, não oprime[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não podemos encontrá-lo”, “não podemos alcançá-lo” ou “não podemos sondá-lo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “juízo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não aflige”. Alguns entendem o verbo como “não responde”, mas esse sentido parece ajustar-se menos ao contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Traduz o título divino pelo equivalente tradicional e amplamente compreensível em português, em vez de transliterar “Shaddai”.
- source_word: לֹא מְצָאנֻהוּ
  choice: não podemos compreendê-lo plenamente
  rationale: O sentido literal é “não o encontramos”, mas, neste contexto de transcendência divina, a expressão indica a incapacidade de alcançar ou sondar Deus por completo. “Plenamente” evita sugerir que nenhum conhecimento de Deus seja possível.
- source_word: שַׂגִּיא כֹחַ
  choice: grande em poder
  rationale: Reproduz de modo natural e próximo a ideia hebraica de grandeza ou excelência em poder.
- source_word: וּמִשְׁפָּט
  choice: em justiça
  rationale: מִשְׁפָּט pode indicar julgamento ou justiça; junto de צְדָקָה, “justiça” comunica melhor a qualidade ética atribuída a Deus.
- source_word: וְרֹב צְדָקָה
  choice: e em abundante retidão
  rationale: Preserva tanto a ideia de abundância expressa por רֹב quanto a integridade moral de צְדָקָה; “retidão” evita a repetição imediata de “justiça”.
- source_word: לֹא יְעַנֶּה
  choice: não oprime
  rationale: Entende יְעַנֶּה como forma de ענה no sentido de afligir ou oprimir. No contexto da justiça e retidão divinas, “não oprime” é conciso e semanticamente adequado, sem acrescentar “injustamente”, que não aparece explicitamente no hebraico.
theological_decisions:
- issue: Relação da cláusula final לֹא יְעַנֶּה com a justiça e a retidão de Deus
  choice: A cláusula afirma que Deus não oprime.
  alternative: A cláusula poderia ser entendida como “ele não responde”.
  rationale: O sentido de “oprimir/afligir” se ajusta melhor à menção imediatamente anterior da justiça e da abundante retidão. A alternativa “não responde” permanece registrada, pois é lexicalmente possível, mas parece menos adequada à sintaxe e ao contexto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para clareza, preservando a sequência conceitual do hebraico e sua tensão entre a transcendência e a retidão de Deus.
