  source_fidelity: 'A tradução preserva adequadamente a progressão do hebraico: a inacessibilidade do Todo-Poderoso, sua grandeza em poder e a afirmação final ligada à justiça e à abundante retidão. “Não podemos compreendê-lo plenamente” comunica de modo legítimo o valor contextual de לֹא מְצָאנֻהוּ, sem reduzir a expressão a uma busca meramente física. “Não oprime” é uma opção defensável para יְעַנֶּה no contexto, e a nota registra a alternativa relevante.'
