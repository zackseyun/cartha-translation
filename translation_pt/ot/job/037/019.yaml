source:
  edition: WLC
  text: ה֭וֹדִיעֵ/נוּ מַה נֹּ֣אמַר ל֑/וֹ לֹ֥א נַ֝עֲרֹ֗ךְ מִ/פְּנֵי חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: pt
  text: Ensina-nos o que devemos dizer a ele; não conseguimos pôr nossas palavras em ordem, por causa da escuridão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conseguimos expor nossas palavras” ou “não conseguimos apresentar nossa causa”. “Escuridão” também pode representar a ignorância ou a incapacidade humana, embora o sentido literal seja possível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Ensina-nos
  rationale: O imperativo hifil de ידע significa literalmente “faz-nos saber”. No contexto, “Ensina-nos” comunica de modo natural o pedido de instrução e conserva o sentido causativo.
- source_word: מַה נֹּאמַר לוֹ
  choice: o que devemos dizer a ele
  rationale: 'A oração funciona como objeto do imperativo e tem força deliberativa: pede que seja mostrado o que se deve dizer a Deus.'
- source_word: לֹא נַעֲרֹךְ
  choice: não conseguimos pôr nossas palavras em ordem
  rationale: ערך significa “dispor”, “organizar” ou “pôr em ordem”. Embora “palavras” esteja implícito, explicitá-lo em português transmite com naturalidade a ideia retórica sem transformar a frase inequivocamente em linguagem jurídica.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: por causa da escuridão
  rationale: מִפְּנֵי tem aqui sentido causal. “Escuridão” preserva a imagem compacta do hebraico e sua possível referência literal ou figurada.
theological_decisions:
- issue: Sentido de “escuridão” na oração final
  choice: Manter “escuridão” sem explicar a imagem
  alternative: por causa da nossa ignorância; porque está escuro
  rationale: O hebraico não determina se a escuridão é literal ou se representa ignorância, confusão ou limitação humana diante de Deus; a tradução conserva essa tensão.
- issue: Objeto implícito de “pôr em ordem”
  choice: Explicitar “nossas palavras”
  alternative: não conseguimos pôr em ordem; não conseguimos apresentar nossa causa
  rationale: O contexto trata do que dizer a Deus. “Nossas palavras” torna a frase idiomática e mantém a amplitude da imagem, enquanto “nossa causa” imporia uma leitura judicial mais definida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação pronominal em “Ensina-nos” preserva um tom bíblico natural sem arcaísmo excessivo. O pronome “ele” mantém a referência do hebraico sem acrescentar explicitamente “Deus”.
