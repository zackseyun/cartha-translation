  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: pt
  text: Por isso também meu coração treme e salta do seu lugar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estremece” em vez de “treme”; o verbo hebraico pode indicar um tremor causado por medo, assombro ou agitação.
    reason: lexical_alternative
  - marker: b
    text: Ou “salta para fora do seu lugar”; a expressão hebraica retrata vividamente o coração como se fosse subitamente deslocado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: Também diante disso
  rationale: Preserva tanto a força conectiva de אַף ('também') quanto a referência de לְזֹאת ao fenômeno descrito anteriormente. 'Diante disso' expressa de modo natural em português a reação provocada pelo que Eliú contempla.
- source_word: יֶחֱרַד
  choice: treme
  rationale: חרד pode indicar tremor causado por medo, assombro ou agitação. 'Treme' mantém essa amplitude sem especificar uma emoção além do que o hebraico exige.
- source_word: לִבִּי
  choice: meu coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro da experiência interior, sem reduzi-la a uma simples referência ao eu ou à mente.
- source_word: וְיִתַּר
  choice: e salta
  rationale: O verbo é difícil neste contexto, mas descreve um movimento súbito do coração. 'Salta' conserva a vivacidade corporal da imagem e se liga naturalmente à expressão seguinte.
- source_word: מִמְּקוֹמוֹ
  choice: do seu lugar
  rationale: O sufixo retoma 'meu coração'. A formulação preserva a imagem de ele ser subitamente deslocado de seu lugar habitual.
