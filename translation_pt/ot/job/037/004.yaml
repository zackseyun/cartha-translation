  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: pt
  text: Depois dele[a], uma voz ruge; ele troveja com sua voz majestosa e não os retém[b], quando sua voz é ouvida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Depois disso, uma voz ruge». O hebraico também pode ser entendido adverbialmente, embora o contexto provavelmente retome o relâmpago do versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não os atrasa». O pronome «os» provavelmente se refere aos raios ou a outros efeitos da tempestade que acompanham o trovão.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «porque sua voz é ouvida». A conjunção hebraica pode ter sentido causal, além do sentido temporal adotado no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: A preposição com sufixo masculino singular provavelmente retoma o relâmpago do versículo anterior. A formulação preserva essa ligação anafórica e também o gênero gramatical natural de «relâmpago» em português.
- source_word: יִשְׁאַג קוֹל
  choice: uma voz ruge
  rationale: O verbo שׁאג descreve tipicamente o rugido do leão e, aqui, retrata vividamente o trovão. O substantivo קוֹל não traz sufixo possessivo nesta oração, por isso «uma voz» evita antecipar «sua».
- source_word: יַרְעֵם
  choice: ele troveja
  rationale: O hifil de רעם expressa a produção do trovão. «Ele troveja» é conciso e natural, mantendo a ação pessoal de Deus sem inserir explicitamente seu nome.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: com sua voz majestosa
  rationale: גָּאוֹן pode indicar majestade, grandeza ou exaltação. «Voz majestosa» comunica a grandeza divina em português atual e digno.
- source_word: וְלֹא יְעַקְּבֵם
  choice: e não os retém
  rationale: No piel, עקב pode significar reter, impedir ou atrasar. «Não os retém» preserva o objeto plural não explicitado e a ideia de efeitos da tempestade liberados sem impedimento.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: quando sua voz é ouvida
  rationale: כִּי admite aqui leitura temporal ou causal. A leitura temporal se encaixa naturalmente na sequência entre relâmpago e trovão; a alternativa causal é registrada em nota.
theological_decisions:
- issue: Referente do sujeito que troveja
  choice: O pronome «ele» refere-se a Deus, cuja voz se manifesta no trovão.
  alternative: A voz ou a tempestade poderia ser entendida de modo mais impessoal.
  rationale: O contexto imediato descreve a atuação de Deus na tempestade, e «sua voz majestosa» favorece um referente pessoal divino. A tradução conserva o pronome sem acrescentar «Deus» ao texto.
- issue: Referente do objeto plural em «não os retém»
  choice: O antecedente permanece implícito, como no hebraico, provavelmente indicando relâmpagos, raios ou efeitos da tempestade.
  alternative: Explicitar «os raios» ou traduzir o verbo como «não os atrasa».
  rationale: O hebraico contém apenas um sufixo masculino plural, sem substantivo expresso. Não explicitar o referente preserva a ambiguidade textual.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação mantém a imagem poética de uma voz que ruge, a sequência da tempestade e as ambiguidades genuínas do hebraico, com sintaxe digna e acessível.
