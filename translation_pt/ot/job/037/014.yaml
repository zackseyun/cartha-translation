  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: pt
  text: Escute isto, Jó; fique de pé e considere as maravilhas de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Escute
  rationale: O imperativo de אזן pede atenção ao que se diz. “Escute” é natural no português atual e preserva essa força.
- source_word: זֹּאת
  choice: isto
  rationale: O demonstrativo feminino singular aponta para aquilo que Eliú apresenta à atenção de Jó; “Escute isto” reproduz a construção de modo idiomático.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֲמֹד
  choice: pare
  rationale: Embora o imperativo signifique literalmente “fique de pé” ou “permaneça”, no paralelo com o chamado à reflexão comunica a ideia contextual de interromper-se e prestar atenção. “Pare” expressa essa função naturalmente sem exigir uma postura física específica.
- source_word: וְהִתְבּוֹנֵן
  choice: e reflita sobre
  rationale: O imperativo reflexivo de בין indica consideração atenta. “Reflita sobre” é claro, digno e adequado ao contexto.
- source_word: נִפְלְאוֹת
  choice: as maravilhas
  rationale: O plural de פלא designa coisas ou obras extraordinárias. “Maravilhas” mantém a concisão e também permite entender tanto feitos quanto fenômenos admiráveis.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל é uma designação divina comum. “Deus” transmite o sentido sem acrescentar qualificações interpretativas.
theological_decisions:
- issue: Tradução do título divino אֵל
  choice: Deus
  alternative: Deus poderoso
  rationale: O contexto não exige que a possível conotação de poder seja explicitada. “Deus” preserva a referência divina sem sobretraduzir.
- issue: Natureza das נִפְלְאוֹת
  choice: maravilhas
  alternative: obras maravilhosas de Deus
  rationale: A forma hebraica pode referir-se a feitos extraordinários, mas o substantivo conciso preserva a amplitude da expressão e não restringe sua referência apenas a ações.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência breve de imperativos conserva o tom direto de Eliú. Optou-se por “pare” em vez do literal “fique de pé” porque, no contexto, עֲמֹד convida Jó a deter-se para contemplar; a formulação evita a possível impressão de uma ordem meramente postural.
