  text: לָ֭/כֵן יְרֵא֣וּ/הוּ אֲנָשִׁ֑ים לֹֽא יִ֝רְאֶ֗ה כָּל חַכְמֵי לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: pt
  text: Por isso, os seres humanos o temem; ele não leva em conta nenhum dos sábios de coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “ele não vê todos os sábios de coração”. O verbo hebraico pode significar “ver” ou “levar em conta”; com a negação, a expressão também permite uma ambiguidade de escopo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida da descrição anterior da grandeza de Deus.
- source_word: יְרֵאוּהוּ
  choice: o temem
  rationale: Preserva o sentido direto de ירא, que pode abranger temor, reverência e assombro diante da majestade divina.
- source_word: אֲנָשִׁים
  choice: os seres humanos
  rationale: O substantivo designa pessoas humanas de modo genérico; esta formulação é inclusiva, clara e fiel ao referente coletivo.
- source_word: לֹא יִרְאֶה
  choice: ele não leva em conta
  rationale: ראה significa literalmente “ver”, mas pode comunicar consideração ou atenção; a expressão portuguesa transmite bem esse sentido contextual sem eliminar a alternativa literal, registrada em nota.
- source_word: כָּל
  choice: nenhum dos
  rationale: Sob negação, a construção hebraica tem força distributiva; “nenhum dos” é idiomático em português.
- source_word: חַכְמֵי לֵב
  choice: sábios de coração
  rationale: Mantém a metáfora hebraica e sua ambiguidade, sem acrescentar a ideia não explícita de serem sábios “aos próprios olhos”.
theological_decisions:
- issue: Sentido da falta de consideração de Deus pelos sábios de coração
  choice: Deus não leva em conta nenhum dos que são caracterizados como sábios de coração.
  alternative: Ele não vê nenhum dos sábios de coração; ou, menos provavelmente, nenhum sábio de coração o vê.
  rationale: O sujeito implícito do verbo singular é mais naturalmente Deus no contexto. “Leva em conta” representa o possível sentido idiomático de ראה, enquanto a nota conserva o valor literal e evita resolver inteiramente a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva “sábios de coração”, evitando introduzir “aos próprios olhos”, que não está expresso no hebraico.
