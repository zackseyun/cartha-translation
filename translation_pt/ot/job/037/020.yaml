  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: pt
  text: Deveria ser-lhe contado[a] que eu falaria? Se um homem[b] falar, certamente será engolido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Ele”, referindo-se a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um homem”; também pode ter sentido genérico: “alguém” ou “qualquer pessoa”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico deste versículo é difícil. Outra tradução possível é: “Deveria ser-lhe contado que eu falo? Ou deveria um homem dizer que seria engolido?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Deveria ser contado
  rationale: O passivo de ספר com a partícula interrogativa הֲ forma uma pergunta retórica impessoal; esta formulação mantém tanto a voz passiva quanto o valor modal.
- source_word: לוֹ
  choice: a ele
  rationale: O referente contextual é Deus, mas o hebraico não marca capitalização reverencial; a forma comum preserva o dado do original.
- source_word: כִּי אֲדַבֵּר
  choice: que eu falaria
  rationale: כִּי introduz o conteúdo do relato, e o imperfeito אֲדַבֵּר tem aqui força modal, indicando uma fala cogitada.
- source_word: אִם אָמַר אִישׁ
  choice: Se um homem falar
  rationale: A formulação conserva a condicional אִם, o substantivo singular אִישׁ e a concisão da oração hebraica, sem acrescentar um objeto inexistente.
- source_word: כִּי יְבֻלָּע
  choice: certamente será engolido
  rationale: O passivo de בלע mantém a imagem vívida de ser engolido; 'certamente' expressa a força asseverativa possível de כִּי neste contexto.
theological_decisions:
- issue: Pronome referente a Deus
  choice: a ele
  alternative: a Ele
  rationale: A capitalização reverencial não é uma característica lexical do hebraico; o contexto identifica o referente sem que a tradução imponha essa convenção gráfica.
- issue: Valor de אִישׁ
  choice: um homem
  alternative: alguém; qualquer pessoa
  rationale: A tradução principal retém o substantivo masculino singular do hebraico, enquanto a nota registra seu possível emprego genérico.
- issue: Sintaxe difícil da segunda metade
  choice: Se um homem falar, certamente será engolido
  alternative: Ou deveria um homem dizer que seria engolido?
  rationale: O texto hebraico é comprimido e admite mais de uma análise. A linha principal preserva a leitura condicional sem ocultar, na nota, a alternativa interrogativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura retórica e a imagem concreta do hebraico foram preservadas; as notas mantêm abertas as ambiguidades lexical e sintática.
