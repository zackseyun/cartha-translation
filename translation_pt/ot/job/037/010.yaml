  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: pt
  text: Do sopro de Deus vem o gelo[a], e a extensão das águas se solidifica[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pelo sopro de Deus vem o gelo”. A preposição hebraica pode indicar tanto origem (“do”) como meio (“pelo”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a extensão das águas fica congelada” ou “fica dura”. A expressão hebraica é poética e pode descrever a ampla superfície das águas tornando-se sólida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Do sopro de
  rationale: נִשְׁמָה designa concretamente o sopro ou a respiração. A preposição מִן pode indicar origem ou meio; o texto principal usa origem, enquanto a nota preserva a alternativa instrumental.
- source_word: אֵל
  choice: Deus
  rationale: אֵל é aqui o título divino comum e não exige uma ampliação como “Deus Todo-Poderoso”.
- source_word: יִתֶּן
  choice: se forma
  rationale: Embora נתן signifique literalmente “dar”, a construção descreve poeticamente o surgimento do gelo por ação divina. “Se forma” produz português natural sem apagar essa agência, expressa por “do sopro de Deus”.
- source_word: קָרַח
  choice: gelo
  rationale: קָרַח denota gelo, não apenas geada, e corresponde ao paralelo em que as águas se tornam sólidas.
- source_word: וְרֹחַב
  choice: e a vastidão
  rationale: רֹחַב significa largura, amplitude ou extensão. “Vastidão” comunica de modo poético e natural a ampla superfície das águas.
- source_word: מַיִם
  choice: das águas
  rationale: Mantém-se o plural hebraico, natural no registro poético português.
- source_word: בְּמוּצָק
  choice: se solidifica
  rationale: מוּצָק evoca algo fundido ou moldado que fica firme. No contexto meteorológico, indica que a extensão das águas endurece ou congela; “se solidifica” conserva a imagem sem a restringir além do necessário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com cadência poética. A formulação preserva a imagem concreta do sopro divino e mantém em nota tanto a ambiguidade da preposição quanto as possibilidades semânticas da solidificação das águas.
