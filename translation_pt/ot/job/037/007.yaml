  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: pt
  text: Ele sela a mão de cada pessoa[a], para que todos reconheçam a obra dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele fecha a mão de cada pessoa”. A expressão hebraica provavelmente significa que Deus interrompe o trabalho humano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: a mão
  rationale: Com o verbo חתם, o sintagma é vertido de modo idiomático como objeto direto em português. A expressão hebraica é difícil e provavelmente retrata a interrupção do trabalho humano.
- source_word: כָּל אָדָם
  choice: cada pessoa
  rationale: אָדָם é singular genérico e aqui se refere a qualquer ser humano; “cada pessoa” preserva essa força inclusiva em português atual.
- source_word: יַחְתּוֹם
  choice: sela
  rationale: O qal de חתם significa “selar”. A tradução conserva a metáfora sem explicitar no corpo do versículo a consequência inferida de deter o trabalho.
- source_word: לָדַעַת
  choice: para que ... reconheçam
  rationale: O infinitivo com ל expressa propósito ou resultado. Neste contexto, “reconheçam” comunica mais naturalmente a ideia de tomar conhecimento da atuação divina, sem eliminar a possibilidade básica de “conheçam”.
- source_word: כָּל אַנְשֵׁי
  choice: todos
  rationale: A construção plural é genérica; “todos” retoma naturalmente “cada pessoa” e evita uma formulação pesada ou exclusivamente masculina.
- source_word: מַעֲשֵׂהוּ
  choice: a obra dele
  rationale: O substantivo singular com sufixo de terceira pessoa masculina significa literalmente “sua obra”. “Dele” deixa claro em português que o referente é o agente mencionado no contexto, sem confusão com o sujeito plural da oração subordinada.
theological_decisions:
- issue: Referente do sujeito de “sela” e do sufixo em מַעֲשֵׂהוּ
  choice: Deus é o referente contextual.
  alternative: Um agente impessoal, o inverno ou a tempestade.
  rationale: No discurso de Eliú sobre o domínio de Deus sobre o clima, Deus é o antecedente mais coerente. Ainda assim, o nome divino não é inserido no versículo, preservando a forma pronominal do hebraico.
- issue: Sentido da finalidade expressa por לָדַעַת
  choice: As pessoas são levadas a reconhecer a obra de Deus.
  alternative: As pessoas passam a conhecer a própria obra, tomando מַעֲשֵׂהוּ como referente humano distributivo.
  rationale: O sufixo singular masculino e o contexto favorecem a referência à obra do agente divino. A tradução mantém “dele”, em vez de substituir por “de Deus”, preservando a estrutura e alguma abertura formal do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Cada pessoa” expressa o singular genérico de אָדָם; “todos” mantém o paralelismo inclusivo. A metáfora difícil de selar a mão foi preservada no texto e esclarecida em nota.
