  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: pt
  text: Da câmara vem a tempestade[a], e dos ventos dispersores vem o frio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do sul vem a tempestade”. O hebraico diz literalmente “da câmara”, talvez uma referência poética a uma região meridional ou a um depósito oculto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e do norte vem o frio” ou “e dos ventos que dispersam, o frio”. O termo hebraico é raro, e seu sentido exato é incerto.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: Da câmara
  rationale: חֶדֶר significa literalmente “quarto”, “câmara” ou “recinto interior”. A tradução mantém a imagem poética hebraica sem convertê-la, de modo incerto, em um ponto cardeal.
- source_word: תָּבוֹא
  choice: vem
  rationale: O verbo בוא significa normalmente “vir”, “entrar” ou “chegar”. “Vem” preserva a vivacidade e a estrutura do verso.
- source_word: סוּפָה
  choice: a tempestade
  rationale: סוּפָה designa uma tempestade violenta ou um vendaval. “Tempestade” é natural, abrangente e não restringe indevidamente o fenômeno a um redemoinho.
- source_word: וּמִמְּזָרִים
  choice: e dos ventos dispersores
  rationale: מְזָרִים é um termo raro e de sentido discutido. “Ventos dispersores” expressa uma possível relação com dispersar ou espalhar, ao mesmo tempo que a incerteza lexical e a leitura direcional ficam registradas em nota.
- source_word: קָרָה
  choice: o frio
  rationale: קָרָה pode indicar frio, geada ou tempo gelado. “O frio” é conciso e preserva a amplitude do termo.
