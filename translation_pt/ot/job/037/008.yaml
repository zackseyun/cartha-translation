  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: pt
  text: Então o animal selvagem entra em seu esconderijo[a] e permanece em suas tocas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entra no lugar onde fica à espreita e habita em suas moradas”.'
    reason: Alternativa lexical que preserva mais explicitamente os sentidos de אָרֶב como lugar de espreita e de מְעוֹנוֹת como moradas.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Então ... entra
  rationale: O wayyiqtol de בוא faz avançar a sequência poética. O presente vívido é natural em português e combina com a descrição dos fenômenos da natureza no contexto.
- source_word: חַיָּה
  choice: o animal selvagem
  rationale: חַיָּה pode designar um animal em geral ou uma fera. Aqui a referência é genérica; “animal selvagem” conserva a ideia de criatura não domesticada sem sugerir uma espécie específica.
- source_word: בְמוֹ אָרֶב
  choice: em seu esconderijo
  rationale: אָרֶב indica um lugar oculto onde se fica à espreita. “Esconderijo” expressa com clareza o refúgio oculto do animal, preservando a nuance lexical sem restringi-lo necessariamente a uma toca.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: e ... em suas tocas
  rationale: מְעוֹנוֹת significa lugares de habitação e, neste contexto animal, “tocas” é idiomático. O plural do hebraico foi preservado; o sufixo feminino retoma o substantivo coletivo חַיָּה.
- source_word: תִשְׁכֹּן
  choice: permanece
  rationale: שכן significa habitar, residir ou ficar. Depois de o animal entrar no abrigo, “permanece” comunica naturalmente a continuidade de sua estadia.
