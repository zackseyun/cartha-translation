  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: pt
  text: Você sabe como Deus coloca essas coisas sobre eles[a] e faz resplandecer a luz da sua nuvem[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando Deus as põe no lugar” ou “como Deus as determina”. A expressão hebraica é compacta e deixa implícitos o objeto e o referente, que dependem do contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “faz relampejar o brilho da sua nuvem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Você sabe
  rationale: A forma interrogativa de ידע dirige a Jó uma pergunta retórica. “Você sabe” é direta, atual e amplamente compreensível em português.
- source_word: בְּשׂוּם
  choice: como ... coloca
  rationale: A preposição בְּ com o infinitivo construto de שׂוּם pode indicar circunstância (“quando, ao colocar”) ou, depois de “sabe”, maneira (“como coloca”). A formulação mantém a expressão aberta e natural.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: אֱלוֹהַּ é a forma poética singular comum para Deus no livro de Jó; não há base contextual para ampliá-la com outro título.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: A preposição עַל com sufixo masculino plural significa naturalmente “sobre eles”. O referente permanece implícito, como no hebraico.
- source_word: וְהוֹפִיעַ
  choice: e faz resplandecer
  rationale: O hifil de יפע expressa fazer a claridade aparecer ou brilhar. “Faz resplandecer” preserva o sentido causativo em registro digno e inteligível.
- source_word: אוֹר
  choice: a luz
  rationale: אוֹר significa “luz” ou “claridade”; “a luz” se liga naturalmente à expressão seguinte, “da sua nuvem”.
- source_word: עֲנָנוֹ
  choice: da sua nuvem
  rationale: O substantivo singular com sufixo de terceira pessoa masculina singular é mantido literalmente, sem interpretar a nuvem como necessariamente tempestuosa nem converter o singular em plural.
theological_decisions:
- issue: Objeto implícito de שׂוּם e referente de “eles”
  choice: Manter a abertura do hebraico com “coloca essas coisas sobre eles”
  alternative: “dá ordens a eles”; “dispõe as nuvens”; “põe essas coisas em ação”
  rationale: O hebraico não explicita o objeto de שׂוּם, e o pronome plural depende do contexto meteorológico ao redor. A tradução evita identificar de modo definitivo ordens, nuvens, relâmpagos ou outros fenômenos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” evita a artificialidade de “tu” em grande parte do Brasil, enquanto “resplandecer” conserva o tom poético de Jó. A redação mantém deliberadamente a ambiguidade sintática e meteorológica do hebraico.
