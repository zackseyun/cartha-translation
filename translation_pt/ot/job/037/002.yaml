  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: pt
  text: Ouçam atentamente[a] o tremor[b] de sua voz e o ribombar[c] que sai de sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Ouçam, ouçam”; a construção hebraica intensifica a ordem.
    reason: lexical_alternative
  - marker: b
    text: Ou “a agitação” ou “a fúria”. O termo hebraico pode indicar tremor, agitação ou furor.
    reason: lexical_alternative
  - marker: c
    text: Ou “o murmúrio” ou “o som”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Escutem com atenção
  rationale: O imperativo seguido do infinitivo absoluto intensifica a ordem. A expressão comunica essa ênfase em português natural, sem uma repetição pouco idiomática.
- source_word: בְּרֹגֶז
  choice: o tremor
  rationale: רֹגֶז pode indicar tremor, agitação ou fúria. No contexto da tempestade, “tremor” preserva a ideia de um som que faz estremecer sem definir o termo como ira divina.
- source_word: קֹלוֹ
  choice: da voz dele
  rationale: קוֹל pode significar “voz” ou “som”. A referência subsequente à boca favorece “voz” e mantém a personificação poética.
- source_word: וְהֶגֶה
  choice: o estrondo
  rationale: הֶגֶה designa um som baixo, murmúrio ou gemido. No cenário de trovões, “estrondo” comunica de modo natural o rumor do trovão, embora seja mais forte que algumas alternativas lexicais.
- source_word: מִפִּיו יֵצֵא
  choice: que sai da sua boca
  rationale: A formulação preserva a imagem concreta do hebraico e soa natural em português.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus na imagem da tempestade
  choice: Manter “voz dele” e “sua boca”
  alternative: Substituir por expressões impessoais como “o som do trovão”
  rationale: O hebraico apresenta poeticamente o trovão como pronunciamento do próprio Deus. Manter a linguagem antropomórfica preserva a força literária e teológica sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A escolha “dele” evita a possível ambiguidade de “sua voz”, enquanto “sua boca” permanece inequívoco no contexto imediato.
