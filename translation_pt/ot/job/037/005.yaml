  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: pt
  text: Deus troveja maravilhosamente com a sua voz[a]; faz coisas grandiosas que não conhecemos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Deus troveja maravilhas com a sua voz»; o hebraico traz literalmente uma forma que pode significar «maravilhas», mas aqui provavelmente qualifica o modo como Deus troveja.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «faz coisas grandiosas além do nosso conhecimento» ou «faz coisas grandiosas que não podemos compreender».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: troveja
  rationale: O hifil de רעם descreve a produção do trovão. No contexto da tempestade e da voz divina, «troveja» é uma forma natural e direta em português.
- source_word: אֵל
  choice: Deus
  rationale: O título divino אֵל refere-se aqui a Deus sem exigir ampliação como «Deus Todo-Poderoso».
- source_word: בְּקוֹלוֹ
  choice: com a sua voz
  rationale: A preposição ב pode ter sentido instrumental; «com a sua voz» preserva de modo idiomático a voz de Deus como meio ou acompanhamento do trovão.
- source_word: נִפְלָאוֹת
  choice: maravilhosamente
  rationale: Embora a forma seja um plural substantivo, «maravilhas», ela pode funcionar adverbialmente nesta oração, qualificando como Deus troveja. A alternativa literal é preservada em nota.
- source_word: עֹשֶׂה
  choice: faz
  rationale: עשה tem o sentido amplo de fazer ou realizar; «faz» combina naturalmente com «coisas grandiosas».
- source_word: גְּדֹלוֹת
  choice: coisas grandiosas
  rationale: O adjetivo feminino plural é empregado substantivamente. «Coisas grandiosas» mantém a amplitude do hebraico sem restringi-lo a feitos ou obras específicos.
- source_word: וְלֹא נֵדָע
  choice: que não conhecemos
  rationale: A formulação conserva o valor básico de ידע, «conhecer», e liga naturalmente a oração às coisas grandiosas, sem intensificar o texto para «não podemos compreender».
theological_decisions:
- issue: Alcance da ignorância humana na oração final
  choice: As coisas grandiosas de Deus são descritas como coisas que não conhecemos.
  alternative: Deus faz coisas grandiosas que não podemos compreender.
  rationale: O hebraico emprega ידע, «conhecer». A tradução evita transformar a afirmação em incapacidade absoluta de compreensão, preservando a tensão e a modéstia da formulação original.
- issue: Função de נִפְלָאוֹת na primeira oração
  choice: 'Entendido adverbialmente: Deus troveja «maravilhosamente».'
  alternative: 'Entendido como objeto: Deus «troveja maravilhas».'
  rationale: A leitura adverbial produz português natural e se ajusta ao contexto, enquanto a leitura mais formalmente literal continua possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Troveja» mantém a imagem poética da tempestade; «coisas grandiosas» conserva a generalidade do hebraico. Os marcadores aparecem no texto na ordem natural das expressões comentadas.
