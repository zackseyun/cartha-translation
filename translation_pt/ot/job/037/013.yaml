id: JOB.37.13
reference: Job 37:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם לְ/שֵׁ֥בֶט אִם לְ/אַרְצ֑/וֹ אִם לְ֝/חֶ֗סֶד יַמְצִאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: pt
  text: Seja para correção[a], seja para a sua terra, seja por amor leal[b], ele faz com que isso aconteça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para castigo” ou “para disciplina”; literalmente, “para uma vara”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por misericórdia” ou “por bondade”.
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico também pode ser traduzido por “ele o faz chegar” ou “ele o realiza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: seja... seja... seja
  rationale: A repetição introduz três finalidades ou resultados alternativos, e não uma condição simples. A construção correlativa é natural em português e preserva a estrutura tríplice.
- source_word: לְשֵׁבֶט
  choice: para correção
  rationale: שֵׁבֶט significa literalmente “vara”, mas aqui funciona por metonímia para castigo ou disciplina. “Correção” conserva o alcance disciplinar sem limitar o sentido a punição severa.
- source_word: לְאַרְצוֹ
  choice: para a sua terra
  rationale: אֶרֶץ pode significar “terra” ou “país”; com o sufixo de terceira pessoa masculina singular, “a sua terra” expressa naturalmente o domínio sobre o qual Deus dirige os fenômenos meteorológicos.
- source_word: לְחֶסֶד
  choice: por amor leal
  rationale: חֶסֶד reúne as ideias de bondade, misericórdia e lealdade constante. “Amor leal” preserva essa riqueza sem pressupor que uma aliança específica esteja explícita no contexto.
- source_word: יַמְצִאֵהוּ
  choice: ele faz com que isso aconteça
  rationale: 'O Hifil de מצא tem aqui valor causativo: Deus faz o fenômeno mencionado no contexto ocorrer ou chegar. “Isso” retoma de modo natural a chuva, nuvem ou tempestade dos versículos anteriores.'
theological_decisions:
- issue: Finalidade divina nas três orações introduzidas por אִם
  choice: 'O versículo apresenta finalidades alternativas dos fenômenos meteorológicos: correção, benefício da terra de Deus ou amor leal.'
  alternative: Entender as expressões como destinos, ou restringir a primeira exclusivamente a juízo punitivo.
  rationale: O contexto imediato descreve o governo de Deus sobre nuvens, chuva e tempestade. A preposição לְ com a repetição de אִם favorece categorias de finalidade ou resultado, mantendo juntas tanto a disciplina quanto a benevolência divinas.
translation_notes:
  register: Português moderno, claro e digno, com construção correlativa facilmente compreensível. “Amor leal” mantém o peso semântico de חֶסֶד, e as notas conservam as alternativas lexicais genuínas.
