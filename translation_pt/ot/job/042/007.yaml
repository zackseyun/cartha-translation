source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: pt
  text: 'Depois que Yahweh disse essas palavras a Jó, Yahweh disse a Elifaz, o temanita: “Minha ira arde contra você e contra os seus dois amigos, porque vocês não falaram corretamente a meu respeito[a], como fez o meu servo Jó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês não me disseram o que é correto, como fez o meu servo Jó”. A preposição hebraica significa literalmente “a mim”, mas, neste contexto, provavelmente tem o sentido de “a meu respeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: Depois que
  rationale: Expressa com naturalidade em português a transição temporal narrativa; a fórmula hebraica וַיְהִי não precisa ser reproduzida de modo rígido como “e aconteceu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e seguindo a forma adotada pelo projeto.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: disse essas palavras
  rationale: Reproduz a concretude de דְּבָרִים em português corrente; “disse” é natural com o objeto “palavras”.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Elifaz, o temanita
  rationale: Emprega as formas portuguesas usuais do nome pessoal e do gentílico.
- source_word: חָרָה אַפִּי
  choice: Minha ira arde
  rationale: Preserva a metáfora vívida do hebraico sem a rigidez arcaizante de “se acendeu”.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: contra você e contra os seus dois amigos
  rationale: No idioma da ira ardente, a preposição indica os alvos da indignação; a repetição de “contra” dá clareza.
- source_word: לֹא דִבַּרְתֶּם
  choice: vocês não falaram
  rationale: O pretérito perfeito avalia naturalmente, em português, a fala concluída dos amigos.
- source_word: אֵלַי
  choice: a meu respeito
  rationale: No contexto, a expressão se refere provavelmente ao conteúdo do que os amigos disseram acerca de Deus, embora a preposição hebraica seja literalmente “a mim”.
- source_word: נְכוֹנָה
  choice: corretamente
  rationale: Mantém a amplitude da ideia de falar de maneira certa, adequada ou verdadeira, sem restringi-la apenas à exatidão factual.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: como fez o meu servo Jó
  rationale: Conserva o título significativo “meu servo” e completa em português a comparação elíptica do hebraico.
theological_decisions:
- issue: 'Sentido de אֵלַי: fala dirigida a Deus ou fala a respeito de Deus'
  choice: a meu respeito
  alternative: a mim
  rationale: O contexto dos discursos favorece uma avaliação do que os amigos afirmaram acerca de Deus. A nota preserva a leitura literalmente possível, sem eliminar a ambiguidade do hebraico.
- issue: Alcance de נְכוֹנָה na avaliação divina
  choice: corretamente
  alternative: o que é correto
  rationale: “Corretamente” permite que o juízo abranja verdade, adequação e retidão, sem decidir que se trata apenas de precisão proposicional ou de sinceridade moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se uma abertura temporal natural a uma reprodução rígida da fórmula narrativa hebraica; preservaram-se a imagem da ira que arde e a ambiguidade de אֵלַי por meio de nota.
