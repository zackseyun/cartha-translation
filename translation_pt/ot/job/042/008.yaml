source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: pt
  text: Agora, peguem para vocês sete touros e sete carneiros, vão até meu servo Jó e ofereçam um holocausto por vocês. Meu servo Jó orará por vocês, pois eu o aceitarei[a], para que eu não faça com vocês algo infame[b]. Pois vocês não falaram corretamente a meu respeito[c], como falou meu servo Jó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois levantarei o rosto dele”, uma expressão hebraica que significa “eu o aceitarei” ou “lhe mostrarei favor”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que eu não trate vocês conforme a insensatez de vocês”. O substantivo hebraico pode indicar insensatez culpável, infâmia ou um ato ultrajante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “vocês não falaram corretamente a mim”. O hebraico pode ser entendido como “a mim” ou, pelo sentido do contexto, “a meu respeito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: O hebraico contém explicitamente o marcador temporal וְעַתָּה, literalmente “e agora”. “Agora, portanto” conserva tanto a transição quanto a consequência prática do pronunciamento anterior.
- source_word: קְחוּ לָכֶם
  choice: peguem para vocês
  rationale: O imperativo acompanhado do dativo pronominal indica que eles devem obter os animais para o rito prescrito. A formulação é direta e preserva a nuance benefactiva.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: sete touros e sete carneiros
  rationale: פָרִים designa bovinos machos, e אֵילִים, carneiros adultos. O texto não exige acrescentar “jovens”.
- source_word: עַבְדִּי אִיּוֹב
  choice: meu servo Jó
  rationale: Neste contexto, עֶבֶד é uma designação honrosa da pessoa que serve fielmente a Deus; “servo” comunica isso melhor do que “escravo”.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: ofereçam um holocausto
  rationale: A construção é uma expressão sacrificial convencional. “Holocausto” designa a oferta inteiramente queimada, enquanto “ofereçam” produz português natural.
- source_word: בַּעַדְכֶם
  choice: por vocês
  rationale: A preposição indica benefício ou representação no contexto sacrificial. “Por vocês” é conciso e deixa claro que a oferta diz respeito aos próprios amigos.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: orará por vocês
  rationale: A forma verbal denota oração em favor de outras pessoas. A formulação mantém a função intercessora sem acrescentar categorias não expressas no texto.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: pois eu o aceitarei
  rationale: “Levantar o rosto” é um idioma hebraico de acolhimento ou favor. “Eu o aceitarei” é natural e mantém Jó como referente pessoal, com a imagem literal registrada em nota.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: para que eu não trate vocês conforme a insensatez de vocês
  rationale: נְבָלָה pode expressar insensatez culpável, infâmia ou ato ultrajante. A formulação comunica o sentido judicial provável sem sugerir que Deus praticaria maldade; a alternativa mais literal é preservada em nota.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: vocês não falaram corretamente a meu respeito
  rationale: אֵלַי significa formalmente “a mim”, mas, no contexto da controvérsia sobre o caráter e o governo de Deus, pode ter o sentido de “a meu respeito”. A ambiguidade é indicada em nota.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: como falou meu servo Jó
  rationale: O hebraico encerra com uma comparação elíptica. Repetir “falou” completa a oração naturalmente em português sem alterar o contraste.
theological_decisions:
- issue: A aceitação de Jó e sua função mediadora
  choice: Deus aceita Jó, cuja oração em favor dos amigos integra o meio prescrito para que eles não sejam julgados.
  alternative: A expressão poderia destacar apenas o favor pessoal de Deus para com Jó, sem realçar sua mediação.
  rationale: A sequência textual — sacrifício, oração de Jó e aceitação de Jó por Deus — sustenta uma função intercessora, mas a tradução evita impor categorias sacerdotais ou expiatórias posteriores.
- issue: O sentido de נְבָלָה aplicado à ação divina
  choice: Deus não tratará os amigos conforme a insensatez culpável deles.
  alternative: “Para que eu não faça com vocês algo infame/ultrajante.”
  rationale: O substantivo pode designar insensatez moral ou algo vergonhoso e ultrajante. O texto principal expressa a lógica judicial contextual, e a nota conserva a construção mais literal e sua tensão lexical.
- issue: Se os amigos falaram “a” Deus ou “a respeito de” Deus
  choice: a meu respeito
  alternative: a mim
  rationale: O contexto favorece a referência ao que os amigos afirmaram sobre Deus, mas a preposição hebraica permite a leitura formal “a mim”; por isso, a alternativa é explicitamente preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de “vocês” para legibilidade brasileira e internacional. “Agora, portanto” traduz o וְעַתָּה explícito e marca a passagem do juízo à instrução. As ambiguidades de נְבָלָה e אֵלַי são mantidas em notas, sem resolver silenciosamente a tensão do hebraico.
