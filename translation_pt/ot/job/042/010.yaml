base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: pt
  text: E Javé restaurou a condição de Jó[a] quando ele orou em favor de seus amigos[b]; e Javé lhe deu o dobro de tudo o que ele possuía antes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “restaurou a sorte de Jó” ou, mais literalmente, “reverteu o cativeiro de Jó”. A expressão hebraica se refere à restauração da condição de uma pessoa, não necessariamente à libertação de um cativeiro literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “por seus amigos”.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “acrescentou a Jó, em dobro, tudo o que era dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa amplamente reconhecida do nome divino, em vez de substituí-lo por um título.
- source_word: שָׁב אֶת שבית
  choice: restaurou a sorte de Jó
  rationale: A expressão idiomática hebraica indica a reversão e restauração da condição de alguém; neste contexto, não exige a ideia de libertação de um cativeiro literal.
- source_word: בְּהִתְפַּלְלוֹ
  choice: quando ele orou
  rationale: A preposição בְּ com o infinitivo construto exprime aqui uma circunstância temporal, preservando a relação entre a oração de Jó e sua restauração sem afirmar causalidade além do texto.
- source_word: בְּעַד רֵעֵהוּ
  choice: em favor de seus amigos
  rationale: בְּעַד indica intercessão em benefício de alguém, e רֵעַ se refere coletivamente aos companheiros de Jó.
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: lhe deu o dobro
  rationale: A combinação comunica que Javé acrescentou ou aumentou os bens de Jó em medida duplicada; a formulação é clara e natural em português.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: de tudo o que possuía antes
  rationale: A frase abrange tudo o que pertencia a Jó; “antes” torna explícita a comparação retrospectiva implícita no contexto e na duplicação.
theological_decisions:
- issue: Relação entre a oração de Jó e sua restauração
  choice: 'Ligação temporal: “quando ele orou”'
  alternative: 'Ligação causal: “porque ele orou”'
  rationale: A construção hebraica associa claramente a intercessão de Jó à restauração, mas não obriga a entender sua oração como causa mecânica da recompensa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Restaurou a sorte” conserva o caráter idiomático do hebraico, enquanto as notas registram as alternativas mais formais.
