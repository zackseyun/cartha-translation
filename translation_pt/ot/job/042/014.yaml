  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: pt
  text: Ele deu à primeira o nome de Jemima; à segunda, Quézia; e à terceira, Quéren-Hapuque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Quéren-Hapuque provavelmente significa “chifre de antimônio” ou “chifre de pintura para os olhos”, referindo-se a um recipiente de cosmético ou ao próprio pigmento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: deu ... o nome de
  rationale: A construção hebraica significa literalmente “chamou o nome de”; em português atual, “dar o nome de” expressa com naturalidade e precisão o ato de nomear.
- source_word: הָאַחַת ... הַשֵּׁנִית ... הַשְּׁלִישִׁית
  choice: à primeira ... à segunda ... à terceira
  rationale: Os ordinais comunicam claramente a sequência das três filhas e preservam a estrutura enumerativa do hebraico.
- source_word: יְמִימָה
  choice: Jemima
  rationale: Nome pessoal transliterado segundo a forma tradicional e reconhecível em português.
- source_word: קְצִיעָה
  choice: Quézia
  rationale: Nome pessoal transliterado em forma tradicional portuguesa, com acentuação que favorece a pronúncia adequada.
- source_word: קֶרֶן הַפּוּךְ
  choice: Quéren-Hapuque
  rationale: O nome composto é transliterado em forma legível para falantes de português; o hífen preserva sua composição, enquanto o sentido lexical é apresentado em nota.
