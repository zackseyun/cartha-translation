base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: pt
  text: 'Então Jó respondeu a Yahweh[a] e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “o SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: Registra a forma hebraica e as principais alternativas tradicionais para o nome divino.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה nesta fórmula narrativa significa “responder”. A escolha preserva a estrutura dialogal, embora não haja uma pergunta direta imediatamente anterior.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico אִיּוֹב.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: אֶת assinala o objeto direto definido em hebraico e não requer uma palavra correspondente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמַר
  choice: '[expresso pelos dois-pontos]'
  rationale: Na fórmula hebraica “respondeu ... e disse”, o português natural evita a redundância. Os dois-pontos introduzem diretamente as palavras de Jó e comunicam a função de וַיֹּאמַר.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio; a nota registra as formas tradicionais sem substituir silenciosamente o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A fórmula hebraica literalmente redundante “respondeu ... e disse” foi vertida de modo idiomático por “respondeu ...:”, sem perda de conteúdo discursivo.
