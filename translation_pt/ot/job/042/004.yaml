base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: pt
  text: Escute[a], por favor, e eu falarei; eu lhe perguntarei[b], e faça-me saber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui Jó repete quase literalmente as palavras anteriores do SENHOR em Jó 38:3 e 40:7.
    reason: cross_reference
  - marker: b
    text: 'Ou: “e declare-me”. Literalmente: “e faze-me saber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Escute
  rationale: Imperativo singular de שׁמע. “Escute” é direto, natural em português moderno e preserva o tom solene da fala.
- source_word: נָא
  choice: por favor
  rationale: Partícula de súplica ou cortesia; “por favor” comunica seu valor de modo claro e atual.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: e eu falarei
  rationale: Mantém a conjunção, o pronome enfático e o valor prospectivo do imperfeito sem interpretar excessivamente a relação entre as orações.
- source_word: אֶשְׁאָלְךָ
  choice: eu lhe perguntarei
  rationale: Traduz o verbo שאל e o sufixo de segunda pessoa masculina singular de maneira natural, preservando a ideia básica de perguntar.
- source_word: וְהוֹדִיעֵנִי
  choice: e faça-me saber
  rationale: O imperativo hifil de ידע com sufixo de primeira pessoa significa literalmente “faça-me saber”; a formulação conserva a força causativa e a sequência imperativa do hebraico.
theological_decisions:
- issue: Relação do versículo com Jó 38:3 e 40:7
  choice: Traduzir diretamente a fala que Jó retoma, sem acrescentar no texto expressões como “tu disseste”.
  alternative: Inserir uma introdução explícita à citação, como “Tu disseste”.
  rationale: O hebraico ecoa quase literalmente o desafio anterior do SENHOR, mas não contém uma fórmula introdutória. A nota registra a ligação sem adicionar palavras ao texto.
- issue: Força de וְהוֹדִיעֵנִי
  choice: 'Manter o imperativo causativo: “e faça-me saber”.'
  alternative: “e responda-me” ou “e declare-me”.
  rationale: “Faça-me saber” preserva a forma e a abertura semântica do hebraico, evitando restringi-la à noção de resposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A opção “Escute” evita a possível ambiguidade morfológica de “Ouça”, enquanto “faça-me saber” conserva a formulação causativa e solene do original.
