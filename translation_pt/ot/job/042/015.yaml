  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: pt
  text: 'Em toda a terra[a], não se encontraram mulheres tão bonitas quanto as filhas de Jó; e o pai delas lhes deu uma herança entre seus irmãos.


    [a] Ou: “em todo o país”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todo o país”.'
    reason: Alternativa lexical para הָאָרֶץ, que pode significar “terra” ou “país/território”.
lexical_decisions:
- source_word: נִמְצָא
  choice: não se encontraram
  rationale: Reproduz o sentido passivo-existencial de מצא. A concordância no plural é natural em português porque o sujeito é “mulheres”.
- source_word: נָשִׁים יָפוֹת
  choice: mulheres tão bonitas
  rationale: נָשִׁים significa “mulheres”, e יָפוֹת, “bonitas” ou “belas”. A construção comparativa com כ é expressa naturalmente por “tão bonitas quanto”.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: quanto as filhas de Jó
  rationale: O prefixo כ introduz a comparação; “quanto” completa de modo idiomático a estrutura portuguesa “tão... quanto”.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: הָאָרֶץ pode designar tanto a terra em sentido amplo quanto um país ou território. “Terra” conserva essa amplitude, enquanto a nota registra a leitura territorial.
- source_word: וַיִּתֵּן לָהֶם
  choice: lhes deu
  rationale: Tradução direta e natural de נתן com o objeto indireto pronominal.
- source_word: נַחֲלָה
  choice: uma herança
  rationale: נַחֲלָה designa herança ou propriedade hereditária; “uma herança” é claro e conciso.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: entre os irmãos
  rationale: בְּתוֹךְ significa “no meio de” ou “entre”, e אֲחֵיהֶם especifica os irmãos do sexo masculino.
theological_decisions:
- issue: Termo de parentesco marcado por gênero
  choice: entre os irmãos
  alternative: entre seus irmãos e irmãs
  rationale: O hebraico emprega explicitamente o masculino plural “irmãos”. A tradução mantém esse dado, inclusive o destaque social de as filhas receberem herança entre os herdeiros homens.
- issue: Alcance de הָאָרֶץ
  choice: em toda a terra
  alternative: em todo o país
  rationale: O substantivo pode ter alcance amplo ou territorial. O texto principal mantém a formulação abrangente, e a nota preserva a alternativa local sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em outros contextos lusófonos. A construção “tão bonitas quanto” comunica com clareza a comparação hebraica; o ponto e vírgula preserva a progressão das duas afirmações do versículo.
