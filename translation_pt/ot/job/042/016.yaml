base_translation:
  language: en
  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: pt
  text: Depois disso, Jó viveu cento e quarenta anos e viu seus filhos e os filhos de seus filhos, até a quarta geração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quatro gerações”. Também se pode traduzir de modo mais idiomático: “viveu para ver seus filhos e netos, até a quarta geração”. O hebraico diz literalmente “viu seus filhos e os filhos de seus filhos, quatro gerações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Traduz diretamente o verbo חיה e expressa a continuação da vida de Jó depois dos acontecimentos narrados.
- source_word: אַחֲרֵי זֹאת
  choice: Depois disso
  rationale: Forma natural em português para a expressão temporal que remete aos acontecimentos anteriores.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: cento e quarenta anos
  rationale: Reprodução direta e idiomática da expressão numérica hebraica.
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o sentido explícito de ראה sem acrescentar ao texto principal a ideia implícita de que Jó viveu o bastante para ver.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Preserva o plural masculino específico do hebraico, sem generalizá-lo como 'crianças' ou 'descendentes'.
- source_word: בְּנֵי בָנָיו
  choice: os filhos de seus filhos
  rationale: Conserva no texto principal a construção literal e masculina 'filhos de seus filhos'; 'netos' é mais idiomático, mas menos transparente quanto à forma hebraica.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: até a quarta geração
  rationale: Exprime naturalmente em português a extensão genealógica indicada pela frase hebraica, embora a forma mais literal seja 'quatro gerações'.
