  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: pt
  text: “Quem é este que oculta[a] o conselho sem conhecimento?” Portanto, falei, mas não compreendi — coisas maravilhosas demais para mim[b], que eu não conhecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “Quem é este que obscurece o conselho sem conhecimento?” A formulação de Jó aqui difere, em hebraico, da de Jó 38:2.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “coisas que estão além de mim” ou “maravilhas além da minha compreensão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é este
  rationale: Mantém a força interrogativa direta e introduz naturalmente, em português, a pergunta divina retomada por Jó.
- source_word: מַעְלִים
  choice: oculta
  rationale: O hifil de עלם expressa esconder ou ocultar. A escolha segue o verbo efetivamente presente em Jó 42:3, sem harmonizá-lo com o verbo diferente de Jó 38:2.
- source_word: עֵצָה
  choice: conselho
  rationale: Preserva a ideia de sabedoria deliberativa e de propósito, além de corresponder de perto ao termo hebraico.
- source_word: בְּלִי דָעַת
  choice: sem conhecimento
  rationale: Tradução direta da expressão hebraica, preservando o tema da limitação cognitiva de Jó.
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a conexão inferencial formal entre a pergunta citada e a confissão que se segue.
- source_word: הִגַּדְתִּי
  choice: falei
  rationale: No contexto, Jó reconhece aquilo que disse anteriormente. “Falei” é natural, sóbrio e não acrescenta uma força declarativa desnecessária.
- source_word: וְלֹא אָבִין
  choice: mas não entendia
  rationale: 'O conectivo adversativo explicita naturalmente o contraste contextual: Jó falou sem compreender. O passado imperfeito descreve sua falta de entendimento naquele momento.'
- source_word: נִפְלָאוֹת
  choice: coisas maravilhosas demais
  rationale: Expressa tanto o caráter extraordinário dessas realidades quanto o fato de ultrapassarem a capacidade de compreensão de Jó.
- source_word: מִמֶּנִּי
  choice: para mim
  rationale: Com “maravilhosas demais”, forma em português uma expressão natural para aquilo que excede a capacidade de Jó; a alternativa mais explícita, “além da minha compreensão”, é registrada em nota.
- source_word: וְלֹא אֵדָע
  choice: que eu não conhecia
  rationale: A ligação relativa torna clara, em português, a relação com “coisas maravilhosas demais”, sem alterar o conteúdo da confissão.
theological_decisions:
- issue: Relação entre Jó 42:3 e a repreensão divina de Jó 38:2
  choice: Traduzir o verbo de Jó 42:3 como “oculta”
  alternative: “obscurece o conselho sem conhecimento”
  rationale: Embora Jó retome ou adapte a pergunta anterior do Senhor, o texto hebraico de 42:3 emprega עלם, não חשך. A tradução preserva essa diferença lexical e registra a formulação tradicional em nota, sem harmonizar os dois versículos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a solenidade da confissão de Jó sem arcaísmos; as notas preservam alternativas lexicais relevantes e a diferença textual em relação a Jó 38:2.
