lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Também teve
  rationale: A construção idiomática ויהי + ל com sufixo expressa posse (“havia para ele” = “ele teve/tinha”). “Teve” é natural em português e se ajusta ao relato dos filhos concedidos a Jó; “também” marca a continuação narrativa em relação às bênçãos mencionadas anteriormente.
- source_word: שִׁבְעָנָה
  choice: sete
  rationale: O numeral cardinal é vertido diretamente por “sete”.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo hebraico designa especificamente descendentes do sexo masculino; “filhos” preserva essa referência.
- source_word: וְשָׁלֹשׁ
  choice: e três
  rationale: A conjunção e o numeral são traduzidos de modo direto e natural.
- source_word: בָּנוֹת
  choice: filhas
  rationale: O substantivo hebraico designa especificamente descendentes do sexo feminino; “filhas” é a correspondência normal e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa conserva o paralelismo simples do hebraico e usa “teve” em vez da reprodução literal e pouco natural “houve para ele”.
