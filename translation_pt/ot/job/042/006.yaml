  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: pt
  text: Por isso, desprezo a mim mesmo[a] e me arrependo no pó e na cinza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por isso, retiro o que disse e volto atrás quanto ao pó e à cinza”. O hebraico é conciso e debatido, especialmente quanto ao objeto implícito de “desprezo/rejeito” e ao sentido de “me arrependo/volto atrás/fui consolado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural em português a conclusão que Jó tira do encontro narrado no versículo anterior, preservando a força inferencial da locução hebraica.
- source_word: אֶמְאַס
  choice: desprezo a mim mesmo
  rationale: O verbo significa normalmente “rejeitar” ou “desprezar”, mas seu objeto não está expresso no hebraico. “A mim mesmo” explicita a leitura contextual tradicional sem ocultar, na nota, a possibilidade de Jó estar retratando suas palavras ou sua causa.
- source_word: וְנִחַמְתִּי
  choice: e me arrependo
  rationale: No nifal, נחם pode indicar arrepender-se, lamentar, voltar atrás ou ser consolado. Neste contexto, “me arrependo” comunica com clareza a resposta penitencial possível, enquanto a amplitude semântica é preservada na nota.
- source_word: עַל
  choice: 'no'
  rationale: Embora a preposição possa significar “sobre” ou “a respeito de”, “no pó e na cinza” é uma formulação portuguesa natural para indicar a condição ou postura de humilhação e luto.
- source_word: עָפָר וָאֵפֶר
  choice: pó e cinza
  rationale: Mantém a expressão hebraica tradicional ligada à mortalidade, humilhação e luto; “cinza” no singular é idiomático em português.
theological_decisions:
- issue: 'A resposta final de Jó: autodepreciação e arrependimento ou retratação de sua causa'
  choice: 'Jó expressa humilhação pessoal e arrependimento: “desprezo a mim mesmo e me arrependo no pó e na cinza”.'
  alternative: Jó retrata suas palavras ou sua causa e volta atrás quanto ao pó e à cinza.
  rationale: 'O hebraico é conciso: não declara o objeto de אֶמְאַס, e וְנִחַמְתִּי admite mais de um sentido. O contexto imediato favorece uma resposta humilde e penitencial, mas não elimina a leitura de retratação; por isso, a alternativa é registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal é natural, e a nota preserva a ambiguidade lexical e teológica do hebraico.
