  text: And Job died[a], old and full of days.
translation:
  language: pt
  text: E Jó morreu, idoso e cheio de dias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “satisfeito de dias” ou “tendo tido dias em abundância”; expressão hebraica que indica uma vida longa e plena.'
