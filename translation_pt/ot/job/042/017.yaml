lexical_decisions:
- source_word: וַיָּמָת
  choice: E ... morreu
  rationale: O wayyiqtol de מות dá sequência à narrativa. A conjunção “E” preserva de modo natural essa ligação em português.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e estabelecida do nome próprio em português.
- source_word: זָקֵן
  choice: já velho
  rationale: Traduz diretamente o adjetivo “velho, idoso”; “já” torna natural em português a descrição de sua condição ao morrer, sem acrescentar conteúdo substancial.
- source_word: וּשְׂבַע יָמִים
  choice: e com os seus dias completos
  rationale: Preserva a imagem hebraica de uma vida cuja medida de dias foi plenamente alcançada. A formulação é digna e compreensível, sem reduzir o idioma simplesmente a “viveu muito”.
