  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: pt
  text: Sei que podes fazer todas as coisas, e nenhum propósito teu pode ser frustrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum plano teu pode ser impedido”. O substantivo hebraico pode significar “plano” ou “propósito”, e o verbo pode ter o sentido de reter, impedir ou frustrar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Sei
  rationale: Embora a forma hebraica seja um perfeito, o verbo de conhecimento expressa aqui a confissão presente de Jó; “Sei” é natural e fiel ao valor estativo no contexto.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da confissão de Jó como conjunção integrante.
- source_word: כֹל
  choice: todas as coisas
  rationale: Em combinação com תוכל, comunica de modo abrangente que nada está além da capacidade de Deus.
- source_word: תּוּכָל
  choice: podes fazer
  rationale: O verbo יכל significa “ser capaz, poder”. O verbo “fazer” explicita naturalmente em português a ação subentendida depois de “todas as coisas”.
- source_word: וְלֹא
  choice: e nenhum
  rationale: Coordena a segunda afirmação negativa e permite uma formulação portuguesa clara com “propósito” como sujeito.
- source_word: יִבָּצֵר
  choice: pode ser frustrado
  rationale: O nifal de בצר com מן pode indicar que algo é impedido, retido ou tornado inacessível. Com מְזִמָּה, “ser frustrado” comunica que o propósito divino não pode ser impedido de se realizar.
- source_word: מִמְּךָ
  choice: teu
  rationale: Embora a forma seja literalmente “de ti”, o possessivo exprime com naturalidade em português a relação entre Deus e o propósito mencionado.
- source_word: מְזִמָּה
  choice: propósito
  rationale: O substantivo pode significar “plano”, “propósito” ou “intento”. “Propósito” preserva a intencionalidade sem a conotação negativa que “maquinação” poderia sugerir.
theological_decisions:
- issue: Afirmação da capacidade de Deus e da impossibilidade de impedir sua intenção
  choice: Sei que podes fazer todas as coisas, e nenhum propósito teu pode ser frustrado.
  alternative: Sei que podes fazer tudo, e nenhum plano teu pode ser impedido.
  rationale: A formulação afirma a capacidade abrangente de Deus e a impossibilidade de impedir seu propósito, sem acrescentar uma sistematização doutrinária além do que o hebraico diz. A nota conserva as alternativas lexicais genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O uso de “podes” e “teu” mantém a fala direta e solene dirigida a Deus sem arcaísmo excessivo.
