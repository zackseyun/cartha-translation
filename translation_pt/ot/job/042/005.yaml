  text: לְ/שֵֽׁמַע אֹ֥זֶן שְׁמַעְתִּ֑י/ךָ וְ֝/עַתָּ֗ה עֵינִ֥/י רָאָֽתְ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: pt
  text: Antes, eu só tinha ouvido falar de ti[a], mas agora o meu olho te viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pelo ouvir do ouvido”; isto é, por relato, ou de ouvir dizer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: só ... ouvido falar
  rationale: A expressão hebraica combina “ouvir” e “ouvido” e indica conhecimento recebido por relato. Em português corrente, “ouvir falar” comunica naturalmente esse sentido; “só” explicita o contraste contextual com a percepção direta da segunda oração.
- source_word: שְׁמַעְתִּיךָ
  choice: eu ... tinha ouvido falar de ti
  rationale: Embora a construção seja literalmente “eu te ouvi”, neste contexto ela se refere ao conhecimento anterior de Deus por meio do que fora ouvido. O mais-que-perfeito composto marca com clareza essa situação anterior em contraste com “agora”.
- source_word: וְעַתָּה
  choice: mas agora
  rationale: A conjunção introduz um contraste forte entre o conhecimento anterior, indireto, e a experiência presente; “mas agora” expressa esse valor adversativo de modo natural.
- source_word: עֵינִי
  choice: o meu olho
  rationale: Mantém-se o singular do hebraico e sua formulação poética, ainda que “meus olhos” fosse mais idiomático em português.
- source_word: רָאָתְךָ
  choice: te viu
  rationale: O pretérito perfeito traduz diretamente a forma verbal hebraica como acontecimento consumado, cujo significado presente é ressaltado por “agora”.
theological_decisions:
- issue: Natureza do ato de Jó “ver” Deus
  choice: te viu
  alternative: te percebeu; encontrou-se diretamente contigo
  rationale: O verbo hebraico comum para “ver” é mantido sem definir se a experiência foi visual, revelatória ou metafórica. Assim se preservam a força do contraste entre ouvir e ver e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com leve caráter poético. “Ouvir falar” favorece a compreensão ampla, enquanto a nota preserva a forma idiomática hebraica. O singular “o meu olho” conserva a imagem marcada do original.
