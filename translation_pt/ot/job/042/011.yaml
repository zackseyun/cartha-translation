source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: pt
  text: Então vieram a ele todos os seus irmãos, todas as suas irmãs e todos os que o conheciam anteriormente[a]. Comeram pão com ele em sua casa[b]. Demonstraram compaixão por ele e o consolaram por toda a desgraça que Yahweh havia trazido sobre ele. E cada um lhe deu uma quesitá[c] e um anel de ouro[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus antigos conhecidos”.'
    reason: lexical_alternative
  - marker: b
    text: “Comeram pão” é uma expressão hebraica comum para compartilhar uma refeição.
    reason: cultural_note
  - marker: c
    text: A quesitá era uma antiga unidade ou peça de valor; seu equivalente exato é incerto.
    reason: cultural_note
  - marker: d
    text: 'Ou: “uma argola de ouro para o nariz”; o termo hebraico pode designar uma argola usada no nariz ou na orelha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: vieram a ele
  rationale: Preserva de modo direto o movimento em direção a Jó expresso por בוא com אֵלָיו, em narrativa portuguesa natural.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: todos os seus irmãos, todas as suas irmãs
  rationale: Mantém a repetição de כָּל e a menção separada dos irmãos e das irmãs.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: e todos os que o conheciam anteriormente
  rationale: יֹדְעָיו designa pessoas que o conheciam, e לְפָנִים indica um tempo anterior. A formulação preserva essa referência temporal sem restringi-la indevidamente.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ
  choice: Comeram pão com ele em sua casa
  rationale: Conserva a imagem concreta do hebraico, embora 'comer pão' possa funcionar como expressão para compartilhar uma refeição.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Demonstraram compaixão por ele
  rationale: Neste contexto, נוד descreve uma expressão de solidariedade ou comiseração diante do sofrimento, não um gesto de zombaria.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: e o consolaram
  rationale: נחם, neste contexto, indica consolar alguém afligido.
- source_word: עַל כָּל הָרָעָה
  choice: por toda a desgraça
  rationale: רָעָה aqui se refere à calamidade sofrida por Jó, e não necessariamente ao mal moral.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: que Yahweh havia trazido sobre ele
  rationale: Mantém tanto a agência causativa explícita de הֵבִיא ... עָלָיו quanto o nome divino יהוה, sem suavizar a tensão do texto.
- source_word: קְשִׂיטָה אֶחָת
  choice: uma quesitá
  rationale: O referente e o valor exato de קְשִׂיטָה são incertos; a transliteração adaptada ao português preserva a especificidade do termo antigo.
- source_word: נֶזֶם זָהָב אֶחָד
  choice: um anel de ouro
  rationale: נֶזֶם designa um adorno em forma de argola, que podia ser usado no nariz ou na orelha; 'anel' mantém a formulação principal concisa, com a ambiguidade explicitada em nota.
theological_decisions:
- issue: Agência divina no sofrimento de Jó
  choice: que Yahweh havia trazido sobre ele
  alternative: que Yahweh havia permitido que viesse sobre ele
  rationale: O hebraico atribui explicitamente a Yahweh o ato de trazer a desgraça sobre Jó. A tradução conserva essa tensão teológica, em vez de substituir causalidade por mera permissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa é fluida, mas conserva imagens e repetições relevantes do hebraico. O nome divino é transliterado como “Yahweh”, e termos culturalmente incertos são mantidos no texto com esclarecimento em notas.
