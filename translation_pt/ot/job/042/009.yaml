  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: pt
  text: Então Elifaz, o temanita, Bildade, o suíta, e Zofar, o naamatita, foram e fizeram conforme Yahweh lhes havia dito; e Yahweh aceitou Jó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Yahweh levantou o rosto de Jó”, expressão que significa que ele lhe mostrou favor ou o aceitou.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: O wayyiqtol de הלך dá continuidade simples à narrativa; “foram” é natural e preserva a sequência com “fizeram”.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: o temanita / o suíta / o naamatita
  rationale: São gentílicos que identificam os três homens por lugar ou clã; as formas portuguesas transliteradas preservam esse caráter.
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: עשה tem sentido amplo e forma com כַּאֲשֶׁר a expressão idiomática “fizeram conforme”; não convém especificar uma ação além do hebraico.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: conforme Yahweh lhes havia dito
  rationale: A oração remete à instrução divina anterior; o mais-que-perfeito composto deixa clara essa anterioridade em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּשָּׂא ... אֶת־פְּנֵי אִיּוֹב
  choice: Yahweh aceitou Jó
  rationale: A expressão נשׂא פנים é um idioma de acolhimento favorável ou aceitação. “Aceitou Jó” comunica o sentido no contexto da intercessão, enquanto a imagem literal é preservada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido da expressão de favor divino para com Jó
  choice: Yahweh aceitou Jó
  alternative: Yahweh mostrou favor a Jó; Yahweh levantou o rosto de Jó
  rationale: No contexto, o idioma descreve a recepção favorável de Jó, especialmente como intercessor dos amigos. A tradução evita afirmar além disso como essa aceitação opera.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente reconhecíveis no Brasil. “Conforme” mantém a relação precisa com a ordem anterior; o ponto e vírgula preserva a progressão narrativa e destaca o resultado divino.
