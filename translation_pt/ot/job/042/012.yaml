id: JOB.42.12
reference: Job 42:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: pt
  text: Yahweh abençoou a última fase da vida de Jó mais do que a fase inicial[a]. Jó passou a ter quatorze mil ovelhas, seis mil camelos, mil juntas de bois[b] e mil jumentas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o fim de Jó mais do que o seu começo”.'
    reason: Registra a forma mais literal e a amplitude de אַחֲרִית, que pode indicar fim, período posterior ou desfecho.
  - marker: b
    text: Ou “mil pares de bois” ou “mil equipes de bois”.
    reason: צֶמֶד pode designar um par, uma junta ou uma equipe de animais de trabalho.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יְהוָה, preservando sua função como nome próprio no texto hebraico.
- source_word: בֵּרַךְ
  choice: abençoou
  rationale: Mantém o sentido teológico comum de ברך e atribui diretamente a Yahweh o favor e a prosperidade concedidos a Jó.
- source_word: אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ
  choice: a última fase da vida de Jó mais do que a fase inicial
  rationale: אַחֲרִית contrasta o período posterior de Jó com seu começo. “Última fase da vida” é natural em português e evita restringir a expressão apenas aos últimos dias, enquanto “fase inicial” explicita o paralelo comparativo.
- source_word: וַיְהִי לוֹ
  choice: Jó passou a ter
  rationale: Expressa de modo idiomático a construção existencial hebraica e indica a nova condição de Jó após a bênção.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: quatorze mil ovelhas
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “ovelhas” segue o sentido contextual tradicional da lista de bens de Jó.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: seis mil camelos
  rationale: Tradução direta do numeral e do substantivo.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: mil juntas de bois
  rationale: צֶמֶד designa um par unido para o trabalho; “junta de bois” é uma expressão portuguesa corrente e preserva o sentido agrícola.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: mil jumentas
  rationale: אֲתוֹנוֹת especifica animais fêmeas; “jumentas” preserva essa informação de modo conciso e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil e inteligível internacionalmente. “Última fase da vida” evita a impressão de que a bênção se limitou aos derradeiros dias de Jó; “juntas de bois” conserva a imagem agrícola do hebraico.
