  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: pt
  text: Contudo, estas coisas escondeste no teu coração[a]; eu sabia que isto estava contigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardaste no teu coração”. O verbo hebraico pode significar “esconder”, “guardar” ou “manter em reserva”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “estava contigo” pode significar “estava em tua mente” ou “fazia parte do teu propósito oculto”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Contudo, estas coisas
  rationale: A conjunção וְ pode significar simplesmente “e”, mas aqui introduz um contraste com os atos benéficos mencionados no versículo anterior. “Contudo” expressa naturalmente essa força adversativa, enquanto “estas coisas” preserva o demonstrativo plural.
- source_word: צָפַנְתָּ
  choice: escondeste
  rationale: O verbo צפן pode significar esconder, guardar ou reservar. Neste contexto, “escondeste” comunica melhor a ideia de uma intenção divina mantida em segredo, sem excluir as demais nuances.
- source_word: בִלְבָבֶךָ
  choice: no teu coração
  rationale: לֵבָב pode designar coração, mente, vontade ou interior. “No teu coração” preserva a metáfora antropológica hebraica e continua clara em português.
- source_word: יָדַעְתִּי
  choice: eu sabia
  rationale: O qatal na primeira pessoa do singular indica o conhecimento de Jó. No contexto discursivo, o imperfeito português “sabia” soa natural e descreve um estado de conhecimento, sem acrescentar a ideia de descoberta repentina.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo do que Jó sabia, sendo naturalmente traduzido pela conjunção integrante “que”.
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo feminino singular parece retomar de forma coletiva a questão oculta recém-mencionada. “Isto” conserva a referência comprimida e ambígua do hebraico.
- source_word: עִמָּךְ
  choice: estava contigo
  rationale: A expressão significa literalmente “contigo”. A tradução mantém o idioma hebraico e permite entender que a intenção permanecia com Deus ou pertencia ao seu propósito, sem tornar explícito o que o texto deixa implícito.
theological_decisions:
- issue: Natureza da intenção divina oculta na fala de Jó
  choice: Manter ambíguo o referente de “isto” e apresentar a declaração como a percepção de Jó acerca de um propósito divino oculto.
  alternative: Identificar “isto” especificamente como um plano secreto de Deus para afligir Jó, ou entender “estas coisas” apenas como as bênçãos do versículo anterior.
  rationale: O hebraico não define expressamente o referente além de algo escondido no coração de Deus. A formulação conserva a tensão da queixa de Jó sem transformar sua inferência numa afirmação doutrinária mais específica do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a fala direta dirigida a Deus. A ordem das orações e as metáforas centrais do hebraico foram preservadas, enquanto “sabia” foi escolhido por naturalidade discursiva em português.
