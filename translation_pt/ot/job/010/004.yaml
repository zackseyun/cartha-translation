  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: pt
  text: Você tem olhos de carne ou vê como vê um ser humano?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como vê um mortal”. O termo hebraico אֱנוֹשׁ designa genericamente o ser humano e muitas vezes sugere mortalidade ou fragilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עֵינֵי בָשָׂר לָךְ
  choice: Você tem olhos de carne
  rationale: A construção nominal com לָךְ expressa posse; em português, “você tem” é a forma natural. “Olhos de carne” preserva a imagem concreta e o contraste entre a percepção divina e a percepção humana corpórea.
- source_word: אִם
  choice: ou
  rationale: Aqui אִם introduz a segunda parte de uma pergunta alternativa, não uma condição.
- source_word: כִּ/רְאוֹת ... תִּרְאֶה
  choice: vê como vê
  rationale: A construção comparativa com כ e o infinitivo de ראה é expressa naturalmente por “como vê”; a repetição mantém em destaque o ato de ver.
- source_word: אֱנוֹשׁ
  choice: um ser humano
  rationale: O substantivo singular designa genericamente o ser humano e pode sugerir sua mortalidade ou fragilidade. “Um ser humano” comunica o sentido representativo com clareza no português atual, sem acrescentar explicitamente “mortal” ao texto.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção de Deus
  choice: Manter a pergunta concreta sobre “olhos de carne” e o modo humano de ver
  alternative: Parafrasear como “Você julga pelas aparências como os seres humanos?”
  rationale: O hebraico conserva a tensão retórica ao contrastar a visão de Deus com a percepção humana limitada e corpórea; uma paráfrase sobre julgamento resolveria interpretativamente mais do que o texto afirma.
- issue: Sentido genérico do singular אֱנוֹשׁ
  choice: um ser humano
  alternative: um homem; um mortal
  rationale: A formulação conserva o referente humano singular e genérico. Evita tanto restringi-lo ao sexo masculino quanto tornar explícita a conotação de mortalidade, que permanece possível no termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando o paralelismo, a pergunta retórica e a imagem de “olhos de carne”.
