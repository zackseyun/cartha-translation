lexical_decisions:
- source_word: הֲלֹא
  choice: Não me... e não me...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção negativa preserva sua força natural em português.
- source_word: כֶחָלָב
  choice: como leite
  rationale: A preposição comparativa כ é traduzida de modo direto e idiomático, preservando a imagem.
- source_word: תַּתִּיכֵנִי
  choice: me derramaste
  rationale: O hifil de נתך descreve fazer escorrer ou derramar; no contexto da metáfora de formação, «derramaste» mantém a imagem líquida do leite.
- source_word: וְכַגְּבִנָּה
  choice: e... como queijo
  rationale: A conjunção e a comparação são preservadas; גְּבִנָּה pode designar queijo ou um produto lácteo coalhado.
- source_word: תַּקְפִּיאֵנִי
  choice: me coalhaste
  rationale: O hifil de קפא expressa fazer engrossar ou coagular; «coalhar» é natural em português dentro da metáfora láctea.
