  text: Não me derramaste como leite e não me coalhaste como queijo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me fizeste coagular como coalhada?”. O substantivo hebraico pode ser traduzido mais especificamente como “queijo” ou, de modo mais geral, como um produto lácteo coalhado.'
