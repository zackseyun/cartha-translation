  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: pt
  text: Se eu me erguer[a], tu me caças como um leão e voltas a mostrar-te extraordinário contra mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil e elíptico: o verbo está na terceira pessoa masculina singular. Também pode ser entendido como “E, se ele se ergue” ou, pelo contexto, “Se minha cabeça se ergue”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “voltas a agir de modo extraordinário contra mim”. O verbo pode indicar mostrar-se extraordinário ou realizar uma ação prodigiosa; aqui, porém, isso ocorre num contexto hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Se ele se ergue
  rationale: A forma verbal hebraica é terceira pessoa masculina singular e o enunciado é elíptico. Esta tradução preserva a pessoa gramatical e a ambiguidade do sujeito, em vez de introduzir diretamente uma primeira pessoa.
- source_word: כַּשַּׁחַל
  choice: como um leão
  rationale: שַׁחַל designa um leão, com possível conotação de força ou ferocidade; a forma simples mantém a imagem sem explicitá-la em excesso.
- source_word: תְּצוּדֵנִי
  choice: tu me caças
  rationale: O verbo צוד descreve caçar ou perseguir como presa, em plena consonância com a imagem do leão.
- source_word: וְתָשֹׁב
  choice: e, de novo
  rationale: Embora שׁוב signifique literalmente voltar, aqui funciona naturalmente para indicar ação repetida.
- source_word: תִּתְפַּלָּא
  choice: realizas prodígios
  rationale: O hitpael de פלא exprime ação extraordinária, assombrosa ou prodigiosa. A escolha conserva essa força sem sugerir que a ação seja benevolente.
- source_word: בִי
  choice: contra mim
  rationale: No contexto adversativo da queixa de Jó, a preposição ב indica que a ação extraordinária é dirigida contra ele.
theological_decisions:
- issue: Ação extraordinária de Deus em contexto hostil
  choice: realizas prodígios contra mim
  alternative: mostras-te extraordinário contra mim
  rationale: A tradução conserva a tensão entre o caráter assombroso da ação divina e o sofrimento de Jó, sem converter os prodígios em benefícios nem reduzir a expressão a um simples ataque.
- issue: Sujeito elíptico de וְיִגְאֶה
  choice: Se ele se ergue
  alternative: Se eu me exalto
  rationale: A forma verbal é 3ms, mas o referente não está expresso. Preservar essa indeterminação evita resolver uma dificuldade real do hebraico, embora o contexto permita entender uma referência a Jó ou à sua cabeça.
translation_notes:
  register: Português moderno, digno e claro, com uso de “tu” para refletir a segunda pessoa singular do hebraico. A sintaxe mantém a elipse do texto-fonte, esclarecida em nota, e preserva a linguagem teologicamente tensa da queixa de Jó.
