  naturalness: «Tu me caças como um leão» é natural e vigoroso. A combinação «Se ele se ergue» com a oração dirigida a Deus é pouco idiomática e cria uma ambiguidade portuguesa diferente da ambiguidade do hebraico. «Voltas a mostrar-te extraordinário» é clara, moderna e preserva melhor a construção verbal.
