  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: pt
  text: Lembra-te, por favor, de que me fizeste como barro[a]; e me farás voltar ao pó?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «à semelhança do barro». A expressão hebraica é comparativa; não diz explicitamente «do barro», embora evoque claramente a imagem da criação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e me farás voltar ao pó.» A forma hebraica pode ser entendida como afirmação ou, neste contexto, como pergunta retórica.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר־נָא
  choice: Lembra-te, por favor
  rationale: O imperativo masculino singular dirige-se a Deus, e נָא dá ao pedido um tom de súplica. A formulação é natural, digna e mantém o apelo direto.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo que Jó pede a Deus que recorde; em português, «lembrar-se de que» expressa isso com naturalidade.
- source_word: כַחֹמֶר
  choice: como barro
  rationale: O prefixo כַּ marca comparação, não origem. «Como barro» preserva o símile e evoca, sem explicitar além do hebraico, a imagem da criação.
- source_word: עֲשִׂיתָנִי
  choice: me fizeste
  rationale: Traduz de modo direto o sentido amplo de עשה, sem substituir o verbo por outro mais específico, como «formar» ou «modelar».
- source_word: וְאֶל־עָפָר
  choice: e ... ao pó
  rationale: Mantém a coordenação com וְ e traduz עָפָר pelo termo tradicional e contextual «pó», adequado à linguagem de criação e mortalidade.
- source_word: תְּשִׁיבֵנִי
  choice: me farás voltar
  rationale: O hifil de שוב indica fazer voltar ou levar de volta. A formulação conserva esse valor causativo e, com a pontuação, admite a força de pergunta retórica do contexto.
theological_decisions:
- issue: A segunda oração é uma afirmação ou uma pergunta retórica?
  choice: 'Pergunta retórica: «e me farás voltar ao pó?»'
  alternative: 'Afirmação: «e me farás voltar ao pó.»'
  rationale: O hebraico não contém partícula interrogativa explícita, mas o contexto de lamento e apelo favorece a leitura interrogativa. Uma nota preserva a ambiguidade gramatical real.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Lembra-te» mantém a oração dirigida diretamente a Deus; «barro» e «pó» preservam a imagem concreta e a tensão entre criação e mortalidade.
