  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: pt
  text: Embora saibas que não sou perverso[a], não há quem me livre da tua mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não sou culpado”. O hebraico diz literalmente “não sou perverso”, enfatizando que Jó nega ser um homem perverso, não que reivindique ausência absoluta de pecado.'
    reason: lexical_alternative
  - marker: b
    text: “Da tua mão” é uma expressão hebraica que significa estar sob o poder ou domínio de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Embora saibas
  rationale: A expressão introduz concessivamente aquilo que Deus sabe e, no contexto da queixa de Jó, soa natural em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do saber de Deus; a força concessiva já está expressa por “Embora”.
- source_word: לֹא אֶרְשָׁע
  choice: não sou perverso
  rationale: O imperfeito de רשע tem sentido estativo no contexto. “Perverso” preserva a caracterização moral sem transformar a fala de Jó numa alegação de impecabilidade absoluta.
- source_word: וְאֵין
  choice: não há quem
  rationale: Reproduz de modo idiomático a construção existencial negativa ligada ao particípio seguinte.
- source_word: מִיָּדְךָ
  choice: da tua mão
  rationale: Mantém a imagem hebraica da mão como poder ou domínio, sem substituí-la por uma explicação.
- source_word: מַצִּיל
  choice: me livre
  rationale: O particípio Hifil de נצל indica quem livra ou resgata. O objeto “me” fica implícito no hebraico, mas é exigido naturalmente pelo contexto em português.
theological_decisions:
- issue: A afirmação de inocência de Jó diante de Deus
  choice: “não sou perverso”
  alternative: “não sou culpado” ou “sou inocente”
  rationale: O hebraico emprega רשע, termo moral que descreve alguém como perverso, e não uma fórmula que afirme perfeição moral absoluta. A tradução preserva a tensão da queixa de Jó.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Emprega-se a segunda pessoa singular (“saibas”, “tua”) por corresponder ao discurso direto de Jó a Deus e preservar concisão solene.
