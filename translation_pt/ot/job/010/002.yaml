reference: Job 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: pt
  text: 'Direi a Deus: “Não me condenes[a]; faze-me saber por que contendes comigo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não me declares culpado”; o verbo hebraico tem sentido judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “moves uma causa contra mim” ou “disputas comigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Direi
  rationale: O imperfeito qal na primeira pessoa pode ter valor futuro ou modal. No fluxo do discurso de Jó, “Direi” introduz naturalmente a fala que ele pretende dirigir a Deus.
- source_word: אֶל אֱלוֹהַּ
  choice: a Deus
  rationale: אֱלוֹהַּ é um título ou substantivo singular frequente em Jó; “Deus” é a forma natural em português, sem necessidade de transliteração.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Não me condenes
  rationale: A partícula negativa אַל com o imperfeito expressa proibição, e o hifil de רשע tem sentido judicial de declarar culpado ou condenar. A formulação é concisa, digna e corrente.
- source_word: הוֹדִיעֵנִי
  choice: faze-me saber
  rationale: O imperativo hifil de ידע significa causar conhecimento ou informar. “Faze-me saber” conserva a força causativa e combina com o registro elevado do apelo.
- source_word: עַל מַה
  choice: por que
  rationale: A expressão literalmente pergunta “por causa de quê” e, neste contexto, indaga o motivo ou fundamento.
- source_word: תְּרִיבֵנִי
  choice: contendes comigo
  rationale: O qal de ריב pode indicar contender, disputar ou mover uma causa. “Contendes comigo” preserva tanto o conflito pessoal quanto a possível nuance forense sem restringir o sentido.
theological_decisions:
- issue: Nuance judicial do apelo de Jó a Deus
  choice: “Não me condenes” e “contendes comigo”
  alternative: “Não me declares culpado” e “moves uma causa contra mim”
  rationale: O hebraico emprega linguagem de culpa e litígio, mas não exige uma paráfrase inteiramente técnica de tribunal. A tradução mantém a tensão de Jó interpelando Deus em termos judiciais sem impor uma doutrina mais sistematizada do juízo divino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa do singular foi mantida por ser natural na linguagem bíblica dirigida a Deus e por reproduzir de modo conciso as formas verbais hebraicas. As notas preservam as alternativas judiciais sem sobrecarregar o texto principal.
