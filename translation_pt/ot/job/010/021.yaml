  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: pt
  text: antes que eu vá — e não volte — para a terra de escuridão e sombra profunda,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “a terra de escuridão e da sombra da morte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: 'Partícula temporal que introduz naturalmente em português a oração no subjuntivo: “antes que eu vá”.'
- source_word: אֵלֵךְ
  choice: eu vá
  rationale: O Qal na primeira pessoa do singular expressa o ato simples de ir. A tradução evita explicitar “morrer”, embora o contexto aponte para o domínio dos mortos.
- source_word: וְלֹא אָשׁוּב
  choice: e não volte
  rationale: Mantém a coordenação e a negação do hebraico, sem acrescentar o intensificador interpretativo “nunca”.
- source_word: אֶל
  choice: para
  rationale: Preposição direcional natural em português com o verbo “ir”.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Neste contexto, designa uma região ou domínio, especificado pelas expressões seguintes, e não a terra em sentido geral.
- source_word: חֹשֶׁךְ
  choice: escuridão
  rationale: Equivalente direto e corrente do sentido básico do substantivo hebraico.
- source_word: צַלְמָוֶת
  choice: densas sombras
  rationale: Expressa poeticamente a escuridão profunda e preserva a imagem de sombra, sem impor no texto principal a análise tradicional “sombra da morte”.
theological_decisions:
- issue: Tradução de צַלְמָוֶת no contexto poético da morte
  choice: densas sombras
  alternative: sombra da morte; profunda escuridão
  rationale: O termo hebraico admite discussão entre a interpretação tradicional “sombra da morte” e o sentido de escuridão ou sombra muito profunda. O texto principal conserva a imagem poética de sombra em português natural, enquanto a nota registra a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões preservam o caráter parentético de “e não volte”, e o verso permanece aberto sintaticamente para sua continuação no versículo seguinte.
