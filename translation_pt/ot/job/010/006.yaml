  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: pt
  text: para procurares a minha iniquidade e buscares o meu pecado?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois procuras a minha culpa e buscas o meu pecado”.'
    reason: 'Alternativas sintática e lexical: כִּי pode ser entendido como causal, e עָוֹן pode significar «culpa».'
lexical_decisions:
- source_word: כִּי
  choice: para
  rationale: No contexto da pergunta retórica iniciada no versículo anterior, a conjunção introduz naturalmente a finalidade percebida por Jó; em português, o infinitivo após «para» mantém a subordinação e a fluidez.
- source_word: תְבַקֵּשׁ
  choice: procurares
  rationale: O piel de בקש expressa a busca ativa por algo; «procurares» comunica em português corrente a ideia de tentar descobrir uma falta.
- source_word: לַעֲוֺנִי
  choice: a minha iniquidade
  rationale: עָוֹן pode indicar iniquidade ou culpa. Aqui, «iniquidade» preserva o sentido moral e não afirma por si só que a culpa de Jó esteja comprovada.
- source_word: וּלְחַטָּאתִי
  choice: o meu pecado
  rationale: חַטָּאת significa aqui «pecado» e forma um paralelismo com עָוֹן, mantendo distintos os dois termos hebraicos.
- source_word: תִדְרֹשׁ
  choice: buscares
  rationale: דרש pode significar buscar, indagar ou investigar. «Buscares» preserva o paralelismo investigativo sem tornar a formulação excessivamente técnica.
theological_decisions:
- issue: Tradução do par עָוֹן e חַטָּאת
  choice: «iniquidade» e «pecado», sem afirmar que Jó seja de fato culpado
  alternative: «culpa» e «pecado»
  rationale: A fala expressa a queixa de Jó de que Deus parece procurar nele alguma falta. A tradução mantém essa tensão retórica sem antecipar um juízo teológico sobre sua culpa.
- issue: Relação de כִּי com a pergunta do versículo anterior
  choice: 'valor final: «para»'
  alternative: 'valor causal: «pois» ou «porque»'
  rationale: A leitura final integra melhor o versículo à pergunta retórica anterior, mas a conjunção hebraica admite uma leitura causal, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes com o discurso dirigido diretamente a Deus. A escolha «procurares... buscares» evita repetição exata e preserva o paralelismo hebraico.
