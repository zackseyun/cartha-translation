base_translation:
  language: en
  yaml_path: translation/ot/job/010/011.yaml
  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: pt
  text: Tu me revestiste de pele e carne e me entrelaçaste com ossos e tendões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me cobriste com ossos e tendões”. O verbo hebraico também pode ter o sentido de cobrir, envolver ou cercar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: pele
  rationale: No contexto do corpo humano, o substantivo designa naturalmente a pele; outras acepções, como couro, seriam inadequadas aqui.
- source_word: בָשָׂר
  choice: carne
  rationale: Preserva a referência concreta ao tecido corporal e o paralelismo poético com “pele”, sem ampliar o sentido para “corpo”.
- source_word: תַּלְבִּישֵׁנִי
  choice: me revestiste
  rationale: O hifil de לבש expressa o ato de vestir ou revestir. “Me revestiste” mantém a metáfora da formação corporal e soa natural e digna em português.
- source_word: בַעֲצָמוֹת
  choice: com ossos
  rationale: A preposição ב tem aqui valor instrumental ou associativo; “com ossos” comunica de modo natural os elementos empregados na formação do corpo.
- source_word: גִידִים
  choice: tendões
  rationale: O termo designa tecidos fibrosos ou conectivos. “Tendões” é claro no português atual e evita o caráter menos acessível de “nervos” ou “ligamentos” como generalizações anatômicas.
- source_word: תְּסֹכְכֵנִי
  choice: me entreteceste
  rationale: O verbo סכך pode exprimir cobrir, cercar ou entrelaçar. “Me entreteceste” preserva a imagem poética de composição e entrelaçamento do corpo sem eliminar a alternativa de cobertura, registrada em nota.
theological_decisions:
- issue: Imagem antropológica da formação divina
  choice: Apresentar o versículo como descrição poética de Deus formando o corpo de Jó, mantendo as metáforas de revestimento e entrelaçamento.
  alternative: Traduzir o segundo verbo estritamente como “cobriste” ou “cercaste”.
  rationale: O contexto imediato trata da formação corporal de Jó. A tradução comunica essa ação sem acrescentar afirmações doutrinárias além do texto e conserva em nota a ambiguidade lexical do verbo.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “me revestiste” e “me entreteceste” mantém naturalidade sem perder dignidade. “Entreteceste” é deliberadamente poético, mas inteligível no contexto.
