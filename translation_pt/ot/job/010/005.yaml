  text: הֲ/כִ/ימֵ֣י אֱנ֣וֹשׁ יָמֶ֑י/ךָ אִם שְׁ֝נוֹתֶ֗י/ךָ כִּ֣/ימֵי גָֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: pt
  text: 'Acaso os teus dias são como os dias de um mortal[a],

    ou os teus anos, como os dias de um homem vigoroso[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ser humano”; o termo hebraico pode enfatizar a fragilidade e a mortalidade humanas.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “um homem”; o termo hebraico pode trazer a ideia de força ou vigor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Acaso ... são como os dias de
  rationale: A partícula interrogativa הֲ, seguida da comparação com כִּימֵי, introduz uma pergunta retórica. “Acaso” torna essa força clara em português natural.
- source_word: אֱנוֹשׁ
  choice: um mortal
  rationale: אֱנוֹשׁ designa o ser humano e frequentemente ressalta sua fragilidade e mortalidade; “um mortal” preserva essa nuance e funciona como substantivo representativo em português.
- source_word: יָמֶיךָ
  choice: os teus dias
  rationale: Tradução direta do plural com sufixo de segunda pessoa masculina singular, dirigido a Deus.
- source_word: אִם
  choice: ou
  rationale: No paralelismo poético, אִם introduz o segundo termo alternativo da pergunta, e não uma condição.
- source_word: שְׁנוֹתֶיךָ
  choice: os teus anos
  rationale: Tradução direta, em paralelo poético com “os teus dias”.
- source_word: כִּימֵי
  choice: como os dias de
  rationale: Mantém a construção comparativa e sua correspondência com o primeiro hemistíquio.
- source_word: גָבֶר
  choice: um homem vigoroso
  rationale: גָבֶר pode significar “homem”, com associação a força ou vigor. “Homem vigoroso” preserva sua distinção lexical em relação a אֱנוֹשׁ sem especificar indevidamente “guerreiro”.
theological_decisions:
- issue: A comparação entre a duração de Deus e a duração humana
  choice: Preservar a pergunta retórica sem explicar sua implicação
  alternative: Explicitar que Deus não está limitado pelo tempo humano
  rationale: O hebraico formula a tensão por meio de pergunta poética; a tradução não deve converter a inferência teológica em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Teus” mantém o discurso direto singular dirigido a Deus. A disposição em dois versos reflete os dois membros do hebraico.
