  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: pt
  text: É bom para ti oprimires, desprezares a obra das tuas mãos e brilhares sobre o plano dos perversos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mostrares favor ao plano dos perversos». O verbo hebraico significa literalmente «brilhar» ou «resplandecer» e, aqui, pode indicar atenção favorável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: É bom para ti
  rationale: Mantém a forma direta da pergunta retórica e a relação pessoal expressa por לְךָ, sem interpretar antecipadamente como prazer ou aprovação.
- source_word: תַעֲשֹׁק
  choice: oprimires
  rationale: O verbo עָשַׁק denota oprimir, explorar ou lesar. «Oprimir» preserva a força da acusação de Jó.
- source_word: תִמְאַס
  choice: desprezares
  rationale: מָאַס expressa rejeição acompanhada de desdém; «desprezar» comunica ambos os aspectos com naturalidade.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: a obra das tuas mãos
  rationale: A expressão pode indicar o labor ou seu produto; no contexto, refere-se naturalmente àquilo que Deus formou.
- source_word: עֲצַת רְשָׁעִים
  choice: o plano dos perversos
  rationale: עֵצָה pode significar conselho, plano ou propósito. «Plano» é claro no português atual e se ajusta melhor a agentes perversos sem restringir a ideia a um conselho verbal.
- source_word: הוֹפָעְתָּ
  choice: lançares luz sobre
  rationale: O hifil de יָפַע conserva uma imagem de luz ou esplendor. A formulação portuguesa mantém a metáfora e deixa sua possível conotação favorável para a nota.
theological_decisions:
- issue: Acusação antropomórfica dirigida a Deus
  choice: Manter a pergunta direta e os verbos fortes de Jó.
  alternative: Suavizar como «pareceres oprimir» ou reformular como simples percepção de Jó.
  rationale: O hebraico apresenta uma contestação retórica intensa. A tradução preserva essa tensão sem endossar nem neutralizar a acusação dentro do próprio versículo.
- issue: Sentido da luz dirigida ao plano dos perversos
  choice: Preservar no texto a metáfora «lançares luz sobre».
  alternative: Explicitar «favoreceres» ou «mostrares favor ao plano dos perversos».
  rationale: O verbo literalmente pertence ao campo de brilhar ou resplandecer, mas no contexto pode sugerir atenção favorável. A nota registra essa leitura sem eliminar a imagem hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com «ti» e linguagem direta própria do lamento poético. A metáfora hebraica foi mantida, e sua interpretação provável foi indicada em nota.
