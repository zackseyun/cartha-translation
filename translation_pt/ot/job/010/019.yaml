base_translation:
  language: en
  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: pt
  text: Eu seria como se não tivesse existido; do ventre à sepultura seria levado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: como se
  rationale: Neste contexto, introduz a comparação com uma situação irreal; “como se” expressa naturalmente o sentido contrafactual em português.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Eu seria como se nunca tivesse existido
  rationale: A sequência das formas de היה, no contexto do desejo irreal de Jó, é bem representada por uma formulação contrafactual. “Nunca tivesse existido” comunica com clareza a ideia de não ter vindo à existência.
- source_word: מִבֶּטֶן
  choice: do ventre
  rationale: Preserva a imagem concreta do ventre materno e a ligação direta entre nascimento e sepultura.
- source_word: לַקֶּבֶר
  choice: à sepultura
  rationale: קֶבֶר designa a sepultura ou lugar de enterro, não o Sheol. “Sepultura” é natural, digna e exata neste contexto.
- source_word: אוּבָל
  choice: teria sido levado
  rationale: O Hofal de יבל tem sentido passivo-causativo, “ser levado/conduzido”. A forma contrafactual “teria sido levado” se ajusta ao desejo irreal expresso no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A concisão e o paralelismo do hebraico foram preservados; não se acrescentou nota porque a tradução comunica diretamente tanto o caráter contrafactual quanto a imagem do ventre à sepultura.
