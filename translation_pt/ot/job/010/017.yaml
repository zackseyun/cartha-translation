  source_fidelity: 'A primeira oração reproduz bem a imagem forense de testemunhas/evidências renovadas. A segunda preserva adequadamente a ira dirigida contra Jó. Na cláusula final, porém, «tropas sucessivas vêm contra mim» explicita demais elementos que o hebraico deixa comprimidos: introduz o verbo «vêm», transforma a construção «mudanças/revezamentos e combate/exército estão comigo» em ataque direto e fixa «צבא» como tropas. Uma formulação mais próxima preserva melhor a ambiguidade lexical e poética.'
  naturalness: O português da primeira metade é claro e natural. «Mudanças e combate estão comigo» mantém a concisão e o tom poético do original, sem exigir uma paráfrase militar. Embora deliberadamente mais marcado que prosa corrente, é inteligível e apropriado à poesia de Jó.
  terminology: «Testemunhas» é uma boa escolha para עֵדֶיךָ, com a alternativa probatória em nota. «Ira» é apropriado para כעס. Para חֲלִיפוֹת e צבא, «mudanças e combate» evita escolher sem necessidade entre revezamentos, hoste/exército, guerra e serviço penoso.
