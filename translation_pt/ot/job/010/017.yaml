  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: pt
  text: Renovas as tuas testemunhas contra mim[a], e aumentas a tua ira contra mim; mudanças e combate estão comigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as tuas provas contra mim”; o termo hebraico pode referir-se tanto a testemunhas quanto a testemunhos ou evidências apresentados contra Jó.
    reason: lexical_alternative
  - marker: b
    text: O hebraico é conciso e pode ser entendido como “mudanças [ou revezamentos] e combate estão comigo”. «Combate» também pode ser entendido como “um exército”, “guerra” ou “serviço penoso”. A expressão pode evocar sucessivas ondas de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: Renovas
  rationale: O piel de חדש expressa tornar novo ou renovar. Aqui sugere que Deus apresenta repetidamente novas testemunhas ou provas contra Jó.
- source_word: עֵדֶיךָ
  choice: as tuas testemunhas
  rationale: O plural עֵד pode designar testemunhas, testemunhos ou provas. “Testemunhas” preserva a imagem forense evocada por “contra mim”, sem excluir a leitura impessoal indicada na nota.
- source_word: נֶגְדִּי
  choice: contra mim
  rationale: Embora possa significar literalmente “diante de mim”, o contexto acusatório favorece o sentido adversativo “contra mim”.
- source_word: וְתֶרֶב
  choice: e aumentas
  rationale: A forma de רבה comunica aumento ou multiplicação e mantém o paralelismo verbal da queixa dirigida a Deus.
- source_word: כַּעַשְׂךָ
  choice: a tua ira
  rationale: כעס pode indicar ira, indignação ou vexação. “Ira” é natural no contexto e mantém a atribuição direta feita por Jó.
- source_word: עִמָּדִי
  choice: contra mim
  rationale: A expressão é literalmente “comigo”, mas, associada à ira, o português idiomático pede “contra mim”. Isso não muda o caráter hostil do contexto.
- source_word: חֲלִיפוֹת
  choice: sucessivas
  rationale: O substantivo pode indicar mudanças, alternâncias ou revezamentos. Como modifica a imagem militar de צבא na tradução, “sucessivas” comunica ondas que se substituem umas às outras.
- source_word: וְצָבָא
  choice: tropas
  rationale: צבא pode significar exército, hoste, guerra ou serviço. Em combinação com חֲלִיפוֹת, “tropas” torna clara a provável metáfora de forças que atacam em turnos.
- source_word: עִמִּי
  choice: vêm contra mim
  rationale: O hebraico diz de modo comprimido “comigo”. O verbo “vêm” e o valor adversativo são explicitados em português para tornar inteligível a imagem de sucessivos contingentes hostis.
