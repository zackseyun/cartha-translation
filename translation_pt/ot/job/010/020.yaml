  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: pt
  text: Não são poucos os meus dias? Então, para e deixa-me em paz[a], para que eu recobre um pouco o ânimo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afasta-te de mim” ou “retira-te de mim”. A expressão hebraica, com os verbos “cessar” e “pôr/voltar-se para longe de mim”, é compacta e idiomática.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “eu me anime um pouco” ou “eu tenha um pouco de alento”. O verbo sugere uma breve melhora ou recuperação do ânimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não são... ?
  rationale: Preserva a força da pergunta retórica negativa, que espera concordância.
- source_word: מְעַט יָמַי
  choice: poucos os meus dias
  rationale: Traduz diretamente a ideia de que os dias de Jó são poucos, isto é, que lhe resta pouco tempo de vida.
- source_word: יחדל ישית מִמֶּנִּי
  choice: para e deixa-me em paz
  rationale: A sequência hebraica é compacta e difícil. A tradução conserva os dois verbos e expressa de modo natural o pedido para que Deus cesse de agir contra Jó e o deixe sozinho.
- source_word: וְאַבְלִיגָה
  choice: para que eu recobre... o ânimo
  rationale: O verbo sugere breve melhora, alívio ou recuperação do ânimo, sem necessariamente indicar alegria plena ou recuperação física.
- source_word: מְעָט
  choice: um pouco
  rationale: Mantém o sentido adverbial de pequena medida ou breve grau de alívio.
