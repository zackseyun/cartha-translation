  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: pt
  text: Se eu pecar[a], tu me vigias[b] e não me absolverás da minha culpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se pequei... não me declaras inocente de culpa.”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “vigias” expressa observação rigorosa, não cuidado protetor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição e preserva sem resolver a tensão entre uma hipótese e uma situação recorrente.
- source_word: חָטָאתִי
  choice: eu pecar
  rationale: Embora seja uma forma perfeita, no contexto condicional o futuro do subjuntivo é a expressão mais natural em português e mantém o sentido geral ou hipotético.
- source_word: וּשְׁמַרְתָּנִי
  choice: tu me vigias
  rationale: Neste contexto, שׁמר indica observação atenta e fiscalizadora, não proteção; “vigias” comunica essa escrutinação.
- source_word: וּמֵעֲוֺנִי
  choice: da minha culpa
  rationale: עָוֹן pode designar iniquidade, culpa ou sua consequência. Com נקה, “culpa” produz uma formulação jurídica natural sem apagar a dimensão moral.
- source_word: לֹא תְנַקֵּנִי
  choice: não me absolverás
  rationale: O piel de נקה tem aqui sentido forense de declarar inocente ou isentar de culpa; “absolver” preserva a linguagem judicial.
theological_decisions:
- issue: Sentido forense ou purificatório de נקה
  choice: 'forense/judicial: “não me absolverás”'
  alternative: 'purificatório: “não me purificarás”; resultado penal: “não me deixarás sem castigo”'
  rationale: O contexto apresenta a queixa de Jó em termos próximos de vigilância e julgamento. A tradução forense preserva essa acusação sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com uso de “tu” coerente com o discurso direto a Deus. “Absolver” mantém o matiz jurídico; “culpa” soa mais natural em português do que “iniquidade” nesta construção.
