  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: pt
  text: Por que, então, me tiraste do ventre? Eu teria morrido, e nenhum olho me teria visto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu morreria, e nenhum olho me veria”. Os imperfeitos hebraicos admitem essa tradução mais formal, embora o contexto favoreça o sentido contrafactual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Por que, então,
  rationale: A conjunção liga a pergunta à queixa anterior; “então” expressa essa conexão discursiva sem tornar a formulação pesada.
- source_word: מֵרֶחֶם
  choice: do ventre
  rationale: Preserva a imagem concreta do nascimento e expressa naturalmente a origem espacial em português.
- source_word: הֹצֵאתָנִי
  choice: me tiraste
  rationale: O hifil de יצא indica fazer sair, aqui em referência ao nascimento; a escolha mantém a interpelação direta a Deus.
- source_word: אֶגְוַע
  choice: Eu teria morrido
  rationale: No contexto do lamento, o imperfeito expressa um resultado irreal, desejado retrospectivamente.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: e nenhum olho me teria visto
  rationale: “Olho” preserva a metonímia hebraica para qualquer observador, enquanto o condicional composto comunica a sequência contrafactual.
