  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: pt
  text: Se sou perverso, ai de mim! Mesmo que eu seja justo, não posso levantar a cabeça, cheio de desonra e vendo a minha aflição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e vê a minha aflição» ou «eis a minha aflição». A construção hebraica aqui é sintaticamente difícil; alguns entendem estas palavras como um apelo direto de Jó a Deus, e não como parte da descrição de sua própria condição.'
    reason: Leitura alternativa decorrente da ambiguidade sintática do hebraico.
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Se eu for perverso
  rationale: O verbo pode indicar ter agido perversamente, mas a formulação condicional com «perverso» mantém o sentido moral e cria o contraste direto com «justo».
- source_word: אַלְלַי לִי
  choice: ai de mim
  rationale: Expressão portuguesa corrente e digna que preserva a força da exclamação de lamento.
- source_word: וְצָדַקְתִּי
  choice: Mesmo que eu seja justo
  rationale: «Mesmo que» explicita a força concessiva do contexto, enquanto «justo» conserva as dimensões moral e judicial de צדק.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: não posso levantar a cabeça
  rationale: A expressão comunica a incapacidade de erguer a cabeça com confiança ou dignidade, não apenas uma decisão voluntária de não fazê-lo.
- source_word: שְׂבַע קָלוֹן
  choice: cheio de desonra
  rationale: Reproduz o sentido adjetival de estar saturado de humilhação e preserva a dimensão pública de קָלוֹן.
- source_word: וּרְאֵה עָנְיִי
  choice: e vendo a minha aflição
  rationale: Mantém o verbo de percepção e, no texto principal, dá continuidade à descrição da condição de Jó sem transformar de modo inequívoco a expressão em uma súplica dirigida a Deus.
theological_decisions:
- issue: Interpretação de וּרְאֵה עָנְיִי
  choice: 'Continuação da autodescrição de Jó: «e vendo a minha aflição».'
  alternative: 'Apelo direto a Deus: «e vê a minha aflição»; ou exclamação: «eis a minha aflição».'
  rationale: A construção hebraica é difícil e admite mais de uma análise. A leitura adotada preserva o fluxo da descrição, enquanto a nota registra explicitamente a possível mudança para uma fala dirigida a Deus, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sempre que naturais; a nota mantém aberta a dificuldade sintática da cláusula final.
