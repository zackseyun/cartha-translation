  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: pt
  text: Tu me concedeste vida e amor leal, e o teu cuidado[a] preservou o meu espírito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua supervisão” ou “a tua visitação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o meu sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja plural, o substantivo frequentemente expressa o conceito abstrato de vida; o singular é a forma natural em português.
- source_word: וָחֶסֶד
  choice: e amor leal
  rationale: חֶסֶד combina benevolência, lealdade e constância. “Amor leal” conserva essa riqueza sem limitar o termo a misericórdia nem impor uma formulação doutrinária específica.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: tu me concedeste
  rationale: A expressão, literalmente próxima de “fizeste comigo”, descreve aqui a concessão benevolente de vida e amor leal. “Tu me concedeste” comunica esse sentido de modo claro e natural.
- source_word: וּפְקֻדָּתְךָ
  choice: e o teu cuidado
  rationale: פְקֻדָּה pode indicar atenção, supervisão ou visitação. Como essa ação preserva o espírito de Jó, “cuidado” expressa naturalmente o sentido positivo no contexto, sem apagar as alternativas lexicais, registradas em nota.
- source_word: שָׁמְרָה
  choice: preservou
  rationale: O verbo significa guardar, proteger ou conservar. “Preservou” ressalta adequadamente a manutenção da vida de Jó.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: רוּחַ pode significar espírito, sopro ou respiração. “Meu espírito” representa bem a vida interior preservada por Deus, enquanto “meu sopro” permanece uma alternativa possível em nota.
theological_decisions:
- issue: Nuance de חֶסֶד como ação de Deus para com Jó
  choice: amor leal
  alternative: bondade; misericórdia; lealdade
  rationale: A tradução mantém as ideias de amor, constância e lealdade presentes no termo, sem exigir que a fala de Jó seja enquadrada numa formulação denominacional específica.
- issue: Sentido de פְקֻדָּה
  choice: cuidado divino atento
  alternative: supervisão; visitação
  rationale: O resultado declarado — a preservação do espírito — favorece o sentido benevolente de atenção cuidadosa. A nota conserva a amplitude lexical do substantivo.
- issue: Sentido de רוּחַ
  choice: espírito
  alternative: sopro; respiração
  rationale: O contexto admite tanto a dimensão interior quanto o fôlego vital. O texto principal usa a opção ampla e tradicional, e a nota preserva a leitura concreta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com colocação pronominal natural para leitores brasileiros. A formulação concisa acompanha o paralelismo hebraico e preserva em notas as ambiguidades de פְקֻדָּה e רוּחַ.
