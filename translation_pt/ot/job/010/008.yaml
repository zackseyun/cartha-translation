reference: Job 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָדֶ֣י/ךָ עִ֭צְּבוּ/נִי וַֽ/יַּעֲשׂ֑וּ/נִי יַ֥חַד סָ֝בִ֗יב וַֽ/תְּבַלְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: pt
  text: As tuas mãos me moldaram e me fizeram por inteiro, de todos os lados[a]; contudo, tu me engoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «juntamente ao redor», expressão que pode indicar que Deus formou Jó por completo, de todos os lados.'
    reason: cultural_note
  - marker: b
    text: 'Ou: «tu me destróis». O hebraico diz literalmente «tu me engoles», uma metáfora vívida de destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: As tuas mãos
  rationale: Mantém o substantivo plural com sufixo de segunda pessoa e a imagem concreta da ação criadora pessoal de Deus.
- source_word: עִצְּבוּנִי
  choice: me moldaram
  rationale: O piel de עצב tem aqui o sentido de dar forma; «moldaram» preserva a nuance artesanal e deliberada.
- source_word: וַיַּעֲשׂוּנִי
  choice: e me fizeram
  rationale: Traduz naturalmente o verbo comum עשה e mantém o paralelismo cumulativo com «me moldaram».
- source_word: יַחַד סָבִיב
  choice: por inteiro, de todos os lados
  rationale: Expressa em português corrente a ideia conjunta de totalidade e abrangência espacial presente em «juntamente/por completo ao redor».
- source_word: וַתְּבַלְּעֵנִי
  choice: contudo, tu me engoles
  rationale: Preserva a metáfora vívida de בלע, em vez de reduzi-la a «destróis»; «contudo» explicita o contraste contextual sem eliminar a tensão.
theological_decisions:
- issue: Linguagem antropomórfica da criação divina
  choice: Conservar «As tuas mãos» e os dois verbos concretos de formação.
  alternative: «Tu me criaste»
  rationale: A imagem apresenta Deus como artífice pessoal e sustenta a força retórica do lamento de Jó.
- issue: Tensão entre a formação cuidadosa e a ação destrutiva de Deus
  choice: 'Conservar o contraste: «contudo, tu me engoles».'
  alternative: «e agora me destróis»
  rationale: A queixa de Jó justapõe intencionalmente criação e destruição aparente; a tradução não deve harmonizar nem suavizar essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se «tu» para corresponder à segunda pessoa singular do hebraico e manter o discurso direto a Deus. A formulação «por inteiro, de todos os lados» torna inteligível a expressão hebraica compacta sem apagar sua dimensão espacial.
