  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: pt
  text: Minha alma detesta a minha vida[a]; darei livre curso à minha queixa[b]; falarei na amargura da minha alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha alma está cansada da minha vida”. O verbo hebraico pode expressar profundo cansaço, bem como aversão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “soltarei a minha queixa”. A expressão hebraica indica que Jó já não conterá seu lamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: detesta
  rationale: O verbo expressa profunda aversão, embora também possa sugerir extremo cansaço. “Detesta” comunica com naturalidade a forte carga emocional do hebraico.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva a expressão hebraica para o eu interior de Jó e mantém a repetição retórica no início e no fim do versículo.
- source_word: בְּחַיָּי
  choice: a minha vida
  rationale: Neste contexto, a expressão designa a vida de Jó como objeto de sua aversão.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: darei livre curso à minha queixa
  rationale: A construção idiomática indica que Jó deixará de conter sua lamentação. A formulação conserva a imagem de liberar algo sem soar artificial em português.
- source_word: שִׂיחִי
  choice: minha queixa
  rationale: No contexto do lamento de Jó, o termo denota fala aflita ou queixosa, não simples meditação.
- source_word: אֲדַבְּרָה
  choice: falarei
  rationale: O cohortativo expressa a resolução de Jó de falar.
- source_word: בְּמַר נַפְשִׁי
  choice: na amargura da minha alma
  rationale: Mantém a metáfora e pode indicar tanto a esfera emocional quanto a maneira em que Jó falará.
