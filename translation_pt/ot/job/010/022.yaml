  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: pt
  text: uma terra de trevas, como a escuridão profunda, de sombra da morte[a] e sem ordem, onde ela resplandece como a escuridão profunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trevas profundas”. O termo hebraico צַלְמָוֶת pode indicar especificamente a sombra da morte ou, de modo mais geral, uma escuridão muito profunda.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: terra
  rationale: No contexto, designa uma região ou domínio, e não o planeta; “terra” conserva a imagem espacial e é natural em português.
- source_word: עֵיפָתָה
  choice: de trevas
  rationale: O termo descreve obscuridade sombria. “De trevas” mantém a força descritiva e se integra naturalmente ao conjunto de imagens de escuridão.
- source_word: כְּמוֹ אֹפֶל
  choice: como a escuridão profunda
  rationale: אֹפֶל indica escuridão densa ou intensa. A repetição da expressão no fim do versículo foi preservada para manter a estrutura e o clímax paradoxal do hebraico.
- source_word: צַלְמָוֶת
  choice: sombra da morte
  rationale: A tradução tradicional continua lexicalmente possível e preserva a associação com a morte no contexto. A possibilidade de entender o termo como “sombra profunda” é indicada em nota.
- source_word: וְלֹא סְדָרִים
  choice: e sem ordem
  rationale: סְדָרִים se refere a ordem ou disposição. A formulação concisa comunica a ideia de um domínio caótico e desorganizado.
- source_word: וַתֹּפַע
  choice: que resplandece
  rationale: A forma verbal deriva de יפע, “brilhar, resplandecer”, e concorda com “terra”. A tradução conserva deliberadamente o paradoxo de uma terra que resplandece como escuridão.
