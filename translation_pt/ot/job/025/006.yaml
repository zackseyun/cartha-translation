id: JOB.25.6
reference: Job 25:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: pt
  text: quanto menos o ser humano[a], que é uma larva, e o filho do homem[b], que é um verme!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mortal”; o hebraico אֱנוֹשׁ frequentemente ressalta a fragilidade e a mortalidade humanas.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “o filho do homem”; aqui é uma expressão poética para um ser humano, não um título messiânico.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: quanto menos
  rationale: 'No contexto, a expressão dá continuidade ao argumento do maior para o menor iniciado no versículo anterior: se nem os corpos celestes são puros diante de Deus, quanto menos o ser humano frágil.'
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: O substantivo ressalta a humanidade em sua fragilidade e mortalidade. “O ser humano” preserva o valor representativo singular em português natural; a nota registra a nuance de mortalidade.
- source_word: רִמָּה
  choice: larva
  rationale: O termo designa especialmente uma larva associada à decomposição. “Larva” distingue este vocábulo de תּוֹלֵעָה e soa mais natural e digno no português amplo do que alternativas excessivamente regionais.
- source_word: בֶן אָדָם
  choice: o filho do homem
  rationale: A tradução literal conserva a textura e o paralelismo poéticos do hebraico. Aqui a expressão significa um ser humano, sem função titular ou messiânica.
- source_word: תּוֹלֵעָה
  choice: verme
  rationale: O vocábulo é o termo mais amplo para verme e fica adequadamente distinto de רִמָּה, traduzido como “larva”.
theological_decisions:
- issue: Se “filho do homem” deve ser entendido como expressão messiânica ou titular
  choice: expressão poética não titular para um ser humano
  alternative: título messiânico
  rationale: Em Jó 25:6, בֶן אָדָם está em paralelismo com אֱנוֹשׁ e expressa a fragilidade humana; o contexto não sustenta uma leitura messiânica. A forma literal é preservada, e a nota esclarece seu sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe poética e o argumento comparativo foram preservados; “larva” e “verme” mantêm a distinção lexical do hebraico.
