  text: הַמְשֵׁ֣ל וָ/פַ֣חַד עִמּ֑/וֹ עֹשֶׂ֥ה שָׁ֝ל֗וֹם בִּ/מְרוֹמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: pt
  text: Domínio e temor estão com ele[a]; ele faz a paz em suas alturas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O domínio e o temor pertencem a ele”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “em seus lugares elevados”; a expressão provavelmente se refere ao âmbito celestial exaltado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: Domínio
  rationale: O substantivo derivado de משל designa governo ou domínio. “Domínio” conserva o caráter abstrato e o paralelismo nominal da oração sem acrescentar a carga teológica mais específica de “soberania”.
- source_word: וָפַחַד
  choice: e temor
  rationale: פחד pode significar temor, pavor ou terror. “Temor” é natural e digno em português e preserva tanto a ideia de medo quanto a reverência provocada pela majestade divina, sem intensificar indevidamente para “terror”.
- source_word: עִמּוֹ
  choice: estão com ele
  rationale: A expressão significa literalmente “com ele”. Como a oração hebraica não traz verbo expresso, acrescenta-se “estão” em português, preservando a imagem de atributos associados a Deus e deixando aberta a nuance possessiva.
- source_word: עֹשֶׂה
  choice: ele estabelece
  rationale: O particípio de עשה descreve uma ação característica. No contexto de שָׁלוֹם nas alturas, “estabelece” expressa em português idiomático a ação de produzir ou manter a paz, embora “faz” seja a correspondência mais estrita.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: שׁלום abrange paz, integridade e bem-estar. “Paz” é a equivalência mais natural no cenário cósmico, sem excluir as nuances de ordem e harmonia.
- source_word: בִּמְרוֹמָיו
  choice: nas suas alturas
  rationale: מרום designa altura ou lugar elevado; o plural com sufixo é literalmente “suas alturas”. A formulação mantém a imagem poética e exaltada sem restringi-la explicitamente a “céus”.
theological_decisions:
- issue: Natureza da oração inicial
  choice: Afirmação de que domínio e temor estão com Deus
  alternative: “O domínio e o temor pertencem a ele”
  rationale: A oração nominal hebraica admite tanto a noção associativa ou locativa (“com ele”) quanto uma paráfrase possessiva. O texto principal preserva a formulação mais transparente e a nota registra a leitura possessiva.
- issue: Sentido das “alturas”
  choice: Manter a imagem espacial e poética sem identificar explicitamente o referente
  alternative: “nos seus céus” ou “nos seus lugares elevados”
  rationale: A expressão provavelmente aponta para o âmbito celestial exaltado, mas o hebraico diz literalmente “suas alturas”. A tradução conserva essa abertura e esclarece a provável referência em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém-se o paralelismo poético e a concisão do hebraico; os pronomes referentes a Deus aparecem em minúscula segundo o uso corrente. Todos os marcadores das notas constam no texto principal.
