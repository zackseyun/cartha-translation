  text: הֲ/יֵ֣שׁ מִ֭סְפָּר לִ/גְדוּדָ֑י/ו וְ/עַל מִ֝֗י לֹא יָק֥וּם אוֹרֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: pt
  text: Há número para as suas tropas?[a] E sobre quem não se levanta a sua luz?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus exércitos” ou “os seus bandos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “E sobre quem não surge a sua luz?”.
    reason: lexical_alternative
  - marker: c
    text: “Sua luz” pode referir-se à iluminação universal, ao esplendor ou ao alcance de Deus; o hebraico não especifica o sentido com maior precisão.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: Há, acaso, como contar
  rationale: Expressa de modo natural em português a pergunta existencial e retórica do hebraico, preservando a ideia de que suas tropas são incontáveis.
- source_word: לִגְדוּדָיו
  choice: as suas tropas
  rationale: גְּדוּד designa tropa, bando ou destacamento; “tropas” é claro, digno e adequado ao contexto do domínio divino.
- source_word: וְעַל־מִי
  choice: E sobre quem
  rationale: Mantém a imagem espacial de עַל e introduz naturalmente a segunda pergunta.
- source_word: לֹא יָקוּם
  choice: não se levanta
  rationale: קוּם significa levantar-se ou surgir; com “luz” como sujeito, “se levanta” conserva de perto a imagem hebraica sem eliminar sua amplitude metafórica.
- source_word: אוֹרֵהוּ
  choice: a sua luz
  rationale: Traduz diretamente אוֹר e o sufixo masculino singular, sem restringir a imagem a luz solar, esplendor ou favor.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “suas tropas” e “sua luz”
  choice: Os pronomes são mantidos e, no contexto, remetem a Deus.
  alternative: Substituí-los explicitamente por “de Deus”.
  rationale: Jó 25:2 estabelece Deus como referente, mas conservar os pronomes segue a forma hebraica e evita explicitação desnecessária.
- issue: Sentido de “sua luz”
  choice: Imagem ampla da luz de Deus, sem especificação adicional.
  alternative: Entendê-la especificamente como luz solar, esplendor divino, favor ou alcance universal.
  rationale: O hebraico não define de modo mais estreito o referente; a formulação literal preserva a ambiguidade e a tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção retórica “Há, acaso, como contar” comunica a incontabilidade sem transformar a pergunta em afirmação; “se levanta” preserva a metáfora do original.
