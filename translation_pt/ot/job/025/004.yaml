  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: pt
  text: Como, então, pode o ser humano ser justo diante de Deus?[a] E como pode ser puro quem nasceu de mulher?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com Deus”. O hebraico diz literalmente “com Deus”, mas a expressão pode indicar a condição de uma pessoa diante dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estar limpo” ou “ser inocente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Como, então, pode ...? / E como pode ...?
  rationale: O interrogativo מַה, precedido pela conjunção, introduz perguntas retóricas. “Como pode” comunica naturalmente essa força; “então” explicita no primeiro membro a ligação com o contexto, enquanto “e” preserva o paralelismo no segundo.
- source_word: יִצְדַּק
  choice: ser justo
  rationale: O Qal de צדק indica ser justo ou estar com a razão. “Ser justo” conserva a formulação ampla e evita restringir o sentido à declaração forense de justificação.
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: אֱנוֹשׁ designa o ser humano, frequentemente com a conotação de fragilidade e mortalidade. “O ser humano” mantém o sentido genérico e soa natural no português atual.
- source_word: עִם אֵל
  choice: diante de Deus
  rationale: A expressão significa literalmente “com Deus”, mas aqui descreve a condição da pessoa em relação a Deus, possivelmente com matiz judicial. “Diante de Deus” comunica esse uso idiomático sem eliminar a alternativa literal.
- source_word: יִזְכֶּה
  choice: ser puro
  rationale: O Qal de זכה pode significar ser puro, limpo ou inocente. “Ser puro” forma um paralelo natural com “ser justo” e preserva a amplitude moral e ritual do termo.
- source_word: יְלוּד אִשָּׁה
  choice: quem nasceu de mulher
  rationale: A expressão caracteriza a humanidade em sua condição criada e mortal. “Quem nasceu de mulher” preserva a imagem hebraica e seu alcance genérico em português natural.
theological_decisions:
- issue: Linguagem antropológica genérica
  choice: o ser humano ... quem nasceu de mulher
  alternative: um mortal ... o nascido de mulher
  rationale: As expressões hebraicas são singulares e genéricas. A redação escolhida inclui toda a humanidade, preserva o paralelismo e evita fazer o verso se referir apenas ao sexo masculino.
- issue: Condição humana em relação a Deus
  choice: diante de Deus
  alternative: com Deus
  rationale: Embora עִם seja literalmente “com”, o contexto pergunta como a justiça humana se sustenta em relação a Deus. “Diante de Deus” preserva a possível dimensão judicial sem impor uma formulação doutrinária mais específica.
- issue: Amplitude de pureza, limpeza e inocência
  choice: ser puro
  alternative: estar limpo ou ser inocente
  rationale: O verbo admite nuances morais, rituais e judiciais. “Ser puro” funciona bem no texto principal, enquanto a nota registra as alternativas sem decidir indevidamente entre elas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo poético foi preservado, assim como as duas perguntas retóricas. As notas mantêm alternativas lexicais genuínas do hebraico.
