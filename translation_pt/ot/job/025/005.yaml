  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: pt
  text: Eis que nem mesmo a lua brilha[a], e as estrelas não são puras aos olhos dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem mesmo a lua é luminosa” ou “não dá luz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as estrelas não são limpas”; possivelmente, “não são brilhantes aos olhos dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz com ênfase a observação poética e chama a atenção do ouvinte, preservando o tom elevado sem soar excessivamente arcaico.
- source_word: עַד
  choice: nem mesmo
  rationale: Diante de יָרֵחַ, funciona aqui como intensificador. “Nem mesmo” expressa com naturalidade que até a lua fica aquém diante de Deus.
- source_word: יָרֵחַ
  choice: a lua
  rationale: Equivalente direto do corpo celeste mencionado no paralelo poético.
- source_word: לֹא יַאֲהִיל
  choice: não brilha
  rationale: O verbo raro, no hifil, é entendido no sentido de emitir luz ou brilhar. A formulação é concisa, natural e adequada à imagem celeste.
- source_word: וְכוֹכָבִים
  choice: e as estrelas
  rationale: Mantém a coordenação simples e o paralelismo entre os corpos celestes.
- source_word: לֹא זַכּוּ
  choice: não são puras
  rationale: Preserva o sentido principal de pureza ou limpeza no contexto da avaliação divina, sem eliminar a possível nuance de luminosidade.
- source_word: בְעֵינָיו
  choice: aos olhos dele
  rationale: Conserva a metáfora hebraica de avaliação segundo a perspectiva de alguém e deixa claro, em português corrente, que o sufixo se refere a Deus no contexto.
theological_decisions:
- issue: Referente do sufixo masculino singular em בְעֵינָיו (“aos olhos dele”)
  choice: “dele” refere-se a Deus
  alternative: Um observador não especificado no argumento poético
  rationale: No contexto de Jó 25:2–6, Bildade fala da majestade de Deus e da impureza das criaturas diante dele. O antecedente contextual mais natural do sufixo é, portanto, Deus. A tradução não acrescenta o nome “Deus”, preservando a forma pronominal do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Eis que” mantém a solenidade poética; “nem mesmo” comunica naturalmente a força intensificadora; “aos olhos dele” preserva o idioma hebraico sem introduzir capitalização interpretativa.
