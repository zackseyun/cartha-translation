  yaml_path: translation/ot/job/025/001.yaml
  text: 'Then Bildad the Shuhite answered and said:'
translation:
  language: pt
  text: 'Então Bildade, o suíta, respondeu e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa naturalmente “responder”; a escolha preserva o caráter convencional da introdução de fala.
- source_word: בִּלְדַּד
  choice: Bildade
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: הַשֻּׁחִי
  choice: o suíta
  rationale: Gentílico que identifica Bildade por seu clã ou origem; “suíta” é a forma tradicional e natural em português, associada a Suá.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: אמר, nesta sequência narrativa, é adequadamente vertido por “disse”; a manutenção do segundo verbo reflete a fórmula hebraica.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Então ... respondeu e disse
  rationale: “Então” comunica a progressão narrativa do wayyiqtol inicial, enquanto “respondeu e disse” conserva a estrutura formular do hebraico sem resolver seus dois verbos em um só.
