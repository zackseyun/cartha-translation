  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: pt
  text: Será que o Todo-Poderoso sente algum prazer[a] em você ser justo, ou obtém algum ganho[b] se você tornar irrepreensíveis os seus caminhos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algum deleite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “algum lucro” ou “alguma vantagem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: sente algum prazer
  rationale: חֵפֶץ pode indicar prazer, deleite ou desejo. Com לְשַׁדַּי, a formulação verbal é natural em português e mantém a força da pergunta retórica.
- source_word: לְשַׁדַּי
  choice: o Todo-Poderoso
  rationale: שַׁדַּי é um título divino tradicionalmente traduzido por “o Todo-Poderoso” em Jó; a relação marcada por לְ é expressa de modo idiomático pela construção “sente... prazer”.
- source_word: כִּי תִצְדָּק
  choice: em você ser justo
  rationale: O Qal de צדק significa aqui ser justo ou estar com a razão, e não justificar a si mesmo. “Ser justo” preserva de modo claro o sentido moral.
- source_word: וְאִם
  choice: ou
  rationale: No paralelismo interrogativo, וְאִם introduz a segunda alternativa e é naturalmente vertido por “ou”.
- source_word: בֶּצַע
  choice: ganho
  rationale: בֶּצַע designa ganho, lucro ou vantagem; “ganho” conserva a metáfora de benefício sem sugerir necessariamente dinheiro.
- source_word: כִּי תַתֵּם
  choice: se você tornar irrepreensíveis
  rationale: O Hifil de תמם tem sentido causativo, “tornar completo/íntegro”. “Tornar irrepreensíveis” comunica a dimensão moral e mantém a ação atribuída ao interlocutor.
- source_word: דְּרָכֶיךָ
  choice: os seus caminhos
  rationale: O plural de דֶּרֶךְ pode representar a conduta ou o modo de viver. “Caminhos” preserva a metáfora hebraica e é compreensível em português.
theological_decisions:
- issue: Se o versículo implica que a justiça humana beneficia intrinsecamente a Deus
  choice: As perguntas retóricas apresentam a alegação de Elifaz de que Deus não obtém prazer ou ganho da justiça humana.
  alternative: Entender a fala mais suavemente como uma afirmação de que Deus não necessita da justiça humana, sem negar que se agrade dela.
  rationale: A tradução conserva os termos de prazer e ganho e a força retórica da fala de Elifaz, sem transformar a declaração do personagem numa conclusão teológica geral sobre se Deus se agrada da justiça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Será que” sinaliza naturalmente a pergunta retórica; “os seus caminhos” retém a imagem do hebraico, enquanto “irrepreensíveis” explicita sua dimensão moral.
