  text: וְ/ה֤וּא מִלֵּ֣א בָתֵּי/הֶ֣ם ט֑וֹב וַ/עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: pt
  text: Contudo, ele encheu de coisas boas as casas deles[a], mas o conselho dos perversos está longe de mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo menos literal, “de prosperidade”. O hebraico diz “de bem”, provavelmente no sentido de coisas boas ou benefícios.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fique longe de mim o conselho dos perversos”. A leitura mais direta do hebraico é uma declaração: “o conselho dos perversos está longe de mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Contudo, ele
  rationale: A conjunção com o pronome explícito introduz um contraste com a atitude dos perversos no contexto; “contudo” expressa naturalmente esse valor adversativo.
- source_word: מִלֵּא
  choice: encheu
  rationale: O verbo significa “encher”; o pretérito perfeito preserva a forma verbal e se ajusta à retrospectiva poética.
- source_word: בָתֵּיהֶם
  choice: as casas deles
  rationale: Mantém a imagem concreta e o plural do hebraico, sem ampliar o sentido para “famílias” ou “lares”.
- source_word: טוֹב
  choice: de coisas boas
  rationale: טוֹב funciona aqui de modo substantivado. “Coisas boas” é idiomático em português e permanece menos interpretativo do que “prosperidade” ou “bens”.
- source_word: וַעֲצַת
  choice: mas o conselho
  rationale: A conjunção recebe valor adversativo por causa do distanciamento expresso no segundo membro. “Conselho” conserva a amplitude de עֵצָה, que pode envolver conselho, propósito ou plano.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Traduz o adjetivo plural substantivado e comunica de forma clara a caracterização moral presente no hebraico.
- source_word: רָחֲקָה מֶנִּי
  choice: está longe de mim
  rationale: A forma qatal do verbo estativo é apresentada como declaração de distanciamento, não como imperativo ou pedido.
theological_decisions:
- issue: Valor da declaração no segundo membro
  choice: “o conselho dos perversos está longe de mim”
  alternative: “fique longe de mim o conselho dos perversos”
  rationale: O hebraico traz uma forma qatal, cuja leitura mais direta é declarativa. A alternativa optativa é possível no contexto, mas acrescenta uma nuance de desejo que a morfologia não exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem e as imagens principais do paralelismo hebraico foram preservadas, com ajustes mínimos para a naturalidade sintática.
