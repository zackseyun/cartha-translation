  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: pt
  text: Os justos verão e se alegrarão, e o inocente zombará deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido no presente: “Os justos veem e se alegram, e o inocente zomba deles”. Para “zomba”, também: “ri deles” ou “escarnece deles”.'
    reason: Ambiguidade aspectual dos verbos no imperfeito hebraico e alternativas lexicais para לעג.
lexical_decisions:
- source_word: יִרְאוּ
  choice: verão
  rationale: O qal imperfeito de ראה indica perceber ou testemunhar o que acontece. “Verão” é direto e acompanha a perspectiva prospectiva do contexto.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural substantivado designa pessoas caracterizadas pela justiça; “os justos” é natural, conciso e preserva a categoria moral do hebraico.
- source_word: וְיִשְׂמָחוּ
  choice: e se alegrarão
  rationale: O qal imperfeito de שׂמח expressa alegria diante do que foi visto. A forma pronominal “se alegrarão” é idiomática em português e evita intensificar indevidamente o sentido.
- source_word: וְנָקִי
  choice: e o inocente
  rationale: O adjetivo singular substantivado tem valor genérico e forma um paralelo deliberado com “os justos”. “O inocente” preserva tanto o singular quanto a ideia de ausência de culpa.
- source_word: יִלְעַג
  choice: zombará
  rationale: O qal imperfeito de לעג denota riso ou fala de desprezo. “Zombará” comunica com clareza o tom de escárnio sem recorrer a vocabulário excessivamente erudito.
- source_word: לָמוֹ
  choice: deles
  rationale: A forma pronominal retoma, no contexto, os ímpios cuja queda está sendo descrita. Com “zombar”, a regência natural em português é “zombar deles”.
theological_decisions:
- issue: Referente do pronome לָמוֹ
  choice: O pronome permanece como “deles”, retomando contextualmente os ímpios atingidos pelo juízo.
  alternative: Explicitar no texto “dos ímpios”.
  rationale: O contexto imediato favorece os ímpios como referente, mas explicitar o substantivo eliminaria a forma pronominal e acrescentaria ao versículo algo não expresso no hebraico.
- issue: Valor temporal dos verbos no imperfeito
  choice: 'Empregar o futuro: “verão”, “se alegrarão” e “zombará”.'
  alternative: 'Empregar o presente com valor geral ou vívido: “veem”, “se alegram” e “zomba”.'
  rationale: O futuro se ajusta à apresentação contextual da reação ao juízo descrito, embora o imperfeito hebraico também possa ser entendido como presente geral ou cena vívida; essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação e o paralelismo do hebraico foram mantidos; o singular genérico “o inocente” foi preservado.
