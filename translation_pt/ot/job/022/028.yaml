  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: pt
  text: 'Você decidirá uma questão[a], e ela se confirmará para você; a luz brilhará sobre os seus caminhos.


    [a] Ou: “Você decretará uma palavra, e ela permanecerá firme para você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você decretará uma palavra, e ela permanecerá firme para você.”'
    reason: Alternativa lexical que preserva mais literalmente אֹמֶר (“palavra”), o sentido básico de קום (“permanecer firme”) e a possibilidade mais formal de verter גזר por “decretar”.
lexical_decisions:
- source_word: תִגְזַר
  choice: determinará
  rationale: גזר pode expressar a ideia de cortar ou dividir e, por extensão, decidir, determinar ou decretar. “Determinará” preserva a firmeza da decisão ou declaração sem sugerir necessariamente autoridade régia.
- source_word: אֹמֶר
  choice: uma questão
  rationale: Embora אֹמֶר signifique literalmente “palavra”, “dito” ou “declaração”, após גזר pode designar aquilo que foi resolvido ou pronunciado. “Uma questão” comunica esse sentido prático; a tradução mais literal fica registrada na nota.
- source_word: יָקָם
  choice: ficará estabelecida
  rationale: קום significa levantar-se ou permanecer de pé e, neste contexto, indica que a determinação será confirmada ou adquirirá validade. A formulação evita ampliar a afirmação para além do idioma hebraico.
- source_word: לָךְ
  choice: para você
  rationale: A preposição ל indica relação ou benefício. “Para você” reproduz diretamente essa relação sem explicitação interpretativa adicional.
- source_word: דְּרָכֶיךָ
  choice: os seus caminhos
  rationale: דרך pode indicar caminho, conduta ou curso de vida. “Caminhos” conserva a metáfora poética que se combina com a imagem da luz.
- source_word: נָגַהּ אֹור
  choice: a luz brilhará
  rationale: נגה descreve o ato de brilhar ou resplandecer, tendo אוֹר como sujeito. A expressão portuguesa é clara e mantém a imagem do hebraico.
theological_decisions:
- issue: Natureza da promessa no discurso de Elifaz
  choice: Traduzir como uma afirmação confiante do resultado esperado, sem reforçá-la como garantia teológica incondicional.
  alternative: Entendê-la como promessa absoluta de prosperidade ou, no extremo oposto, como mera possibilidade.
  rationale: O versículo registra a afirmação de Elifaz dentro do debate de Jó; a tradução deve conservar a força de suas palavras sem apresentá-las como conclusão teológica definitiva do livro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Determinará uma questão” mantém certa solenidade poética sem soar arcaico; a nota conserva a formulação mais literal e formal.
