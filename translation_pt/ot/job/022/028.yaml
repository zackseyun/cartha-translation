  to: 'Você decidirá uma questão[a], e ela se confirmará para você; a luz brilhará sobre os seus caminhos.


    [a] Ou: “Você decretará uma palavra, e ela permanecerá firme para você.”'
  rationale: A revisão melhora a idiomaticidade do português sem alterar o sentido. “Decidirá uma questão” representa com naturalidade uma decisão ou pronunciamento firme; “se confirmará” traduz o resultado expresso por יָקָם. A nota mantém a alternativa mais literal e formal. O versículo continua a ser apresentado como a afirmação confiante de Elifaz, sem endossar ou intensificar sua teologia como garantia incondicional.
