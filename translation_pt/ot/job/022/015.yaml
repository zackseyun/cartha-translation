base_translation:
  language: en
  yaml_path: translation/ot/job/022/015.yaml
  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: pt
  text: Você seguirá pelo caminho antigo que os homens perversos trilharam?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o caminho de outrora” ou “o caminho de tempos antigos”. A expressão hebraica se refere a um caminho seguido há muito tempo, não necessariamente a algo eterno.
    reason: lexical_alternative
  - marker: b
    text: Ou “os homens da perversidade” ou “os homens da iniquidade”. A expressão hebraica significa literalmente “homens de perversidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרַח
  choice: o caminho
  rationale: אֹרַח designa caminho ou vereda e pode representar metaforicamente um modo de viver; “caminho” é natural em português e preserva a imagem.
- source_word: עוֹלָם
  choice: antigo
  rationale: Neste contexto, עוֹלָם indica algo de um passado remoto, não necessariamente eterno. “Antigo” qualifica naturalmente o caminho seguido pelos perversos de outrora.
- source_word: תִּשְׁמֹר
  choice: você seguirá
  rationale: Embora שׁמר signifique literalmente guardar, conservar ou observar, com “caminho” expressa manter-se numa conduta ou segui-la. “Seguirá” comunica o sentido idiomático com clareza.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo simples, introduzindo a oração que descreve o caminho.
- source_word: דָּרְכוּ
  choice: trilharam
  rationale: דרך significa pisar, marchar ou percorrer. “Trilharam” conserva a imagem concreta do caminho e também funciona para um modo de vida.
- source_word: מְתֵי אָוֶן
  choice: os homens perversos
  rationale: A expressão é literalmente “homens de perversidade”. Em português corrente, “homens perversos” preserva sua força moral sem tornar a frase artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção interrogativa natural. A escolha “trilharam” mantém a metáfora do caminho, enquanto “você seguirá” comunica idiomaticamente a ideia de adotar ou continuar nesse modo de vida.
