  yaml_path: translation/ot/job/022/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: pt
  text: 'Então Elifaz, o temanita, respondeu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה nesta forma narrativa introduz a fala como resposta, e “respondeu” transmite naturalmente sua função no diálogo.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הַתֵּמָנִי
  choice: o temanita
  rationale: O gentílico derivado de Temã é expresso de modo conciso pelo termo tradicional português “temanita”.
- source_word: וַיֹּאמַר
  choice: incorporado na introdução da fala
  rationale: Na fórmula hebraica וַיַּעַן ... וַיֹּאמַר, a tradução apenas por “respondeu” evita a expressão pouco natural “respondeu e disse” sem perder conteúdo em português.
- source_word: וַ
  choice: Então
  rationale: O primeiro waw marca a progressão narrativa; “Então” expressa de modo natural a sequência do diálogo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula hebraica literal “respondeu e disse” foi condensada idiomaticamente em “respondeu”, e os dois-pontos sinalizam a fala que começa no versículo seguinte.
