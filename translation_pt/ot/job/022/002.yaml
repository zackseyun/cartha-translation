source:
  edition: WLC
  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: pt
  text: Pode o homem ser útil a Deus? Na verdade, quem tem entendimento é útil a si mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pode o homem trazer proveito a Deus? Pois quem tem entendimento traz proveito a si mesmo.”'
    reason: Alternativa lexical e discursiva para סכן e כִּי.
lexical_decisions:
- source_word: הַלְאֵל
  choice: Pode ... a Deus?
  rationale: A partícula interrogativa הֲ e לְאֵל formam uma pergunta retórica na qual Deus é aquele a quem o possível benefício seria dirigido.
- source_word: יִסְכָּן
  choice: ser útil
  rationale: O verbo סכן, neste contexto, indica ser útil ou trazer proveito. “Ser útil” é natural em português e evita uma conotação exclusivamente comercial.
- source_word: גָּבֶר
  choice: o homem
  rationale: O substantivo masculino singular tem aqui sentido representativo e genérico; “o homem” preserva a forma hebraica e permanece claro no registro bíblico moderno.
- source_word: כִּי
  choice: Na verdade
  rationale: A expressão introduz o segundo membro com força explicativa ou enfática, adequada à progressão retórica do verso.
- source_word: יִסְכֹּן
  choice: é útil
  rationale: Mantém o paralelismo lexical com a primeira ocorrência de סכן e soa natural como afirmação geral em português.
- source_word: עָלֵימוֹ
  choice: a si mesmo
  rationale: A preposição עַל com o sufixo pronominal indica aqui que a vantagem recai sobre a própria pessoa.
- source_word: מַשְׂכִּיל
  choice: quem tem entendimento
  rationale: O particípio substantivado de שכל designa quem possui discernimento ou age com sabedoria; a escolha conserva a nuance de entendimento sem restringi-la indevidamente.
theological_decisions:
- issue: Se o versículo sugere que o ser humano pode acrescentar algum benefício a Deus
  choice: A primeira oração é vertida como pergunta retórica, e a segunda afirma que o benefício do entendimento recai sobre a própria pessoa.
  alternative: 'A segunda oração pode ser entendida de modo menos contrastivo: “pois o homem de entendimento traz proveito a si mesmo”.'
  rationale: O paralelismo contrapõe o possível proveito dado a Deus ao proveito que cabe ao próprio ser humano, sem ampliar a afirmação para além do que o verso diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “útil” preserva o paralelismo hebraico; a nota registra a alternativa “trazer proveito” e a leitura explicativa de כִּי.
