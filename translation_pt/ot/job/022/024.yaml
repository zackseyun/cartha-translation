  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: pt
  text: e ponha o ouro no pó[a], e o ouro de Ofir[c] entre as pedras dos leitos de torrentes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ponha o minério de ouro no pó”. O termo hebraico pode designar metal precioso ou minério, não apenas ouro refinado.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, leitos de cursos de água sazonais, também chamados de uádis; alternativamente, “das torrentes” ou “dos riachos”.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “Ofir”, lugar famoso pelo ouro fino; por isso, “o ouro de Ofir”.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשִׁית
  choice: e ponha
  rationale: שׁית significa pôr, colocar ou depositar. “Ponha” comunica naturalmente a exortação no português atual, e וְ é mantido como “e” na sequência poética.
- source_word: עַל עָפָר
  choice: no pó
  rationale: Embora עַל costume significar “sobre”, “no pó” é idiomático em português e preserva a imagem concreta de pôr o metal precioso no chão.
- source_word: בָּצֶר
  choice: o ouro
  rationale: Neste paralelismo com Ofir, o termo designa metal precioso, provavelmente ouro, embora também possa indicar minério ou ouro não refinado; a alternativa é preservada em nota.
- source_word: וּבְצוּר נְחָלִים
  choice: entre as pedras dos leitos de torrentes
  rationale: צוּר é rocha ou pedra, e נְחָלִים pode designar cursos sazonais e seus leitos. A formulação reproduz a paisagem rochosa sem recorrer ao termo menos conhecido “uádis” no texto principal.
- source_word: אוֹפִיר
  choice: o ouro de Ofir
  rationale: Ofir é um topônimo célebre por seu ouro fino. O hebraico traz apenas o nome, mas o paralelismo permite explicitar o referente como “o ouro de Ofir”.
theological_decisions:
- issue: Sentido da exortação de Elifaz
  choice: A imagem sugere abrir mão do ouro e deixar de confiar na riqueza material.
  alternative: Uma ordem para guardar o ouro em esconderijos naturais seguros.
  rationale: O contexto imediato, especialmente a continuação no v. 25, apresenta o Todo-Poderoso como o verdadeiro tesouro. Ainda assim, a tradução mantém a imagem poética concreta, sem inserir no corpo do versículo uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Leitos de torrentes” evita o empréstimo pouco familiar “uádis” no texto principal, enquanto a nota preserva a precisão geográfica. A ordem dos marcadores segue sua ocorrência no texto.
