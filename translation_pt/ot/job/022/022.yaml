base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: pt
  text: Receba, por favor, a instrução[a] da boca dele e guarde as palavras dele no seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “lei” ou “ensino” (hebraico: torá).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: receba
  rationale: O imperativo significa literalmente “tome”, mas, com “instrução”, “receba” expressa de modo natural a ideia de acolher e aceitar o ensino.
- source_word: נָא
  choice: por favor
  rationale: A partícula acrescenta apelo ou insistência, não um sentido temporal; “por favor” preserva o tom exortativo.
- source_word: מִפִּיו
  choice: da boca dele
  rationale: Mantém a imagem explícita do hebraico, que apresenta a instrução como proveniente diretamente de sua fala.
- source_word: תּוֹרָה
  choice: instrução
  rationale: No discurso sapiencial de Jó, o termo denota ensino autorizado sem exigir uma referência específica à Lei mosaica.
- source_word: וְשִׂים
  choice: guarde
  rationale: Embora o verbo básico seja “pôr”, com “no coração” ele comunica conservar ou armazenar interiormente; “guarde” reproduz naturalmente essa força.
- source_word: אֲמָרָיו
  choice: as palavras dele
  rationale: Tradução direta e corrente do plural, preservando o peso dos pronunciamentos mencionados.
- source_word: בִּלְבָבֶךָ
  choice: no seu coração
  rationale: Conserva a imagem hebraica do coração como centro interior do pensamento e da vontade, também natural em português.
theological_decisions:
- issue: Sentido de תּוֹרָה em um discurso sapiencial
  choice: instrução
  alternative: lei; ensino
  rationale: “Instrução” preserva a autoridade do ensino no contexto sem identificar indevidamente o termo com a Lei mosaica ou com uma formulação pactual específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “da boca dele” preserva a imagem concreta do hebraico; “guarde ... no seu coração” comunica com naturalidade a interiorização duradoura.
