  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: pt
  text: Mas a terra pertencia ao homem poderoso[a], e o homem favorecido[b] habitava nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homem de braço”, expressão que significa um homem forte ou poderoso.
    reason: lexical_alternative
  - marker: b
    text: Ou “o homem honrado”, “aquele que recebia favor” ou “aquele que era tratado com parcialidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mas o ... homem
  rationale: A conjunção וְ recebe valor adversativo no contexto, contrastando o tratamento dado aos fracos nos versículos próximos com a posição privilegiada do poderoso.
- source_word: זְרוֹעַ
  choice: poderoso
  rationale: Embora זְרוֹעַ signifique literalmente “braço”, a expressão אִישׁ זְרוֹעַ designa um homem dotado de força ou poder. “Homem poderoso” comunica o sentido idiomático com naturalidade.
- source_word: לוֹ הָאָרֶץ
  choice: a terra pertencia ao
  rationale: 'A construção com לְ e o pronome expressa posse ou domínio: literalmente, “para ele era a terra” ou “a terra era dele”.'
- source_word: וּנְשׂוּא פָנִים
  choice: o homem favorecido
  rationale: A expressão, literalmente relacionada a “rosto levantado”, pode indicar alguém tratado com favor, honrado ou beneficiado por parcialidade. “Favorecido” preserva essa amplitude sem decidir se o favor era justo.
- source_word: יֵשֶׁב בָּהּ
  choice: habitava nela
  rationale: יָשַׁב pode significar sentar-se, morar ou habitar. “Habitava nela” é claro, digno e adequado à ocupação da terra.
