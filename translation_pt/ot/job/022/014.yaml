base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: pt
  text: Nuvens densas o encobrem, e ele não vê; anda sobre a abóbada dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Nuvens densas são uma cobertura para ele, e ele não vê; ele anda sobre o círculo dos céus.”'
    reason: Registra alternativas lexicais para סֵתֶר e חוּג e a construção literal de עָבִים סֵתֶר לוֹ, sem impor uma relação de resultado à segunda oração.
lexical_decisions:
- source_word: עָבִים
  choice: Nuvens densas
  rationale: O plural designa nuvens, frequentemente nuvens espessas ou carregadas. “Nuvens densas” explicita aqui seu papel de ocultar.
- source_word: סֵתֶר
  choice: um esconderijo
  rationale: O substantivo pode indicar esconderijo, ocultação ou cobertura. “Esconderijo” preserva a imagem concreta de algo que o encobre.
- source_word: לוֹ
  choice: para ele
  rationale: A preposição com sufixo indica que as nuvens lhe servem de esconderijo, sem inserir explicitamente “Deus”, cujo referente vem do contexto.
- source_word: וְלֹא יִרְאֶה
  choice: e ele não vê
  rationale: A coordenação hebraica é preservada, sem decidir se a segunda oração expressa simples adição ou resultado.
- source_word: חוּג
  choice: abóbada
  rationale: O termo denota círculo ou arco. Em relação aos céus, “abóbada” comunica naturalmente a imagem do arco celeste.
- source_word: שָׁמַיִם
  choice: dos céus
  rationale: O plural português conserva a forma e o registro tradicionais do substantivo hebraico.
- source_word: יִתְהַלָּךְ
  choice: anda
  rationale: A forma verbal sugere andar ou mover-se de um lado para outro; “anda” mantém a imagem de modo conciso e natural.
theological_decisions:
- issue: Perspectiva do orador e sujeito implícito
  choice: Manter o pronome “ele”, deixando que o contexto identifique Deus como referente na alegação atribuída por Elifaz.
  alternative: Inserir explicitamente “Deus” ou ler a frase como uma declaração neutra sobre a transcendência divina.
  rationale: Jó 22:13-14 apresenta Elifaz relatando o que ele atribui ao ímpio. A tradução conserva essa perspectiva discursiva sem acrescentar ao versículo um nome ausente do hebraico.
- issue: Relação entre as nuvens e a falta de visão
  choice: 'Traduzir literalmente a coordenação: “e ele não vê”.'
  alternative: 'Explicitar resultado: “de modo que ele não vê”.'
  rationale: A conjunção hebraica permite uma leitura coordenada ou resultativa. A formulação escolhida preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação poética. “Abóbada dos céus” preserva a imagem cosmológica antiga sem transformá-la em descrição técnica; a nota registra as principais alternativas.
