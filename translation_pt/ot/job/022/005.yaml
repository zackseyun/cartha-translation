  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: pt
  text: Não é grande a sua maldade[a], e não têm fim as suas iniquidades[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perversidade”. A palavra hebraica também pode significar “calamidade” em outros contextos, mas aqui o paralelo com “suas iniquidades” aponta para o mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “não há limite para as suas iniquidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é
  rationale: Mantém a forma de pergunta retórica que espera resposta afirmativa e preserva o tom acusatório.
- source_word: רָעָתְךָ
  choice: a sua maldade
  rationale: Neste paralelismo com “suas iniquidades”, רָעָה tem sentido moral. “Maldade” é natural em português e evita a leitura de calamidade ou desgraça.
- source_word: רַבָּה
  choice: grande
  rationale: O adjetivo feminino singular concorda naturalmente com “maldade” e expressa sua magnitude; “abundante” seria possível, mas menos idiomático aqui.
- source_word: וְאֵין קֵץ
  choice: e não têm fim
  rationale: Expressa de modo natural a ausência de fim ou limite, ajustando o número verbal ao sujeito plural posposto em português.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: as suas iniquidades
  rationale: “Iniquidades” preserva o forte peso moral de עָוֹן e o plural do hebraico; na construção portuguesa, a preposição hebraica é absorvida pela expressão “não têm fim”.
theological_decisions:
- issue: Acusação moral ou linguagem de sofrimento em רָעָתְךָ
  choice: maldade, em sentido moral
  alternative: desgraça ou calamidade
  rationale: Embora רָעָה possa designar calamidade em outros contextos, o paralelismo imediato com “suas iniquidades” indica que Elifaz acusa Jó de conduta moralmente má.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pergunta retórica e o paralelismo acusatório do hebraico foram preservados.
