base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: pt
  text: Não está Deus na altura dos céus[a]? Veja as estrelas mais altas[b], como são elevadas!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas alturas dos céus”. A expressão hebraica diz literalmente “a altura dos céus”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o topo das estrelas”; o sentido provável é “as estrelas mais altas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não está...?
  rationale: Introduz uma pergunta retórica que espera concordância. A formulação preserva a força interrogativa sem acrescentar a ênfase de “certamente”.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É o equivalente direto e usual do termo singular, sem acréscimos interpretativos.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: nas alturas dos céus
  rationale: Expressa com naturalidade em português a localização elevada sugerida pelo sintagma hebraico literalmente singular, “a altura dos céus”.
- source_word: וּרְאֵה
  choice: Veja
  rationale: Mantém a força imperativa de ראה. A ligação com a pergunta anterior fica natural em português sem ser necessário traduzir o ו por “e”.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: as estrelas mais altas
  rationale: רֹאשׁ significa literalmente “cabeça, topo” e, neste contexto, indica a parte mais elevada ou as estrelas no alto. A tradução comunica o sentido sem a estranheza de “o topo das estrelas”.
- source_word: כִּי
  choice: como
  rationale: Introduz aqui uma observação exclamativa sobre a altura das estrelas; “como” reproduz essa função de modo idiomático.
- source_word: רָמּוּ
  choice: são elevadas
  rationale: O verbo רום indica estar alto ou elevado. “Elevadas” preserva o tom poético e, no contexto, denota altura espacial.
theological_decisions:
- issue: Se a pergunta deve apresentar a transcendência de Deus como afirmação puramente espacial ou como observação retórica na fala de Elifaz
  choice: Manter a pergunta retórica e sua imagem espacial sem explicação teológica adicional.
  alternative: Parafrasear para enfatizar o afastamento de Deus ou ampliar a frase como crítica teológica a Jó.
  rationale: O hebraico aponta retoricamente para a posição elevada de Deus e para a altura das estrelas, mas não explicita aqui uma conclusão mais ampla. A tradução preserva essa tensão no discurso de Elifaz.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Céus” conserva a imagem bíblica e “Veja” é corrente tanto no Brasil quanto em outras variedades amplamente compreensíveis do português.
