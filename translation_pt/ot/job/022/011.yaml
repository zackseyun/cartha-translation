base_translation:
  language: en
  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: pt
  text: ou trevas, de modo que você não consegue ver, e uma abundância de águas[a] cobre você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma inundação cobre você”. A expressão hebraica pode sugerir águas que transbordam, mas o texto principal mantém o sentido mais amplo de “uma abundância de águas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Mantém a força breve do conectivo hebraico, que introduz outra calamidade na descrição de Elifaz.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Expressa diretamente a escuridão que impede a visão e preserva o tom poético e solene.
- source_word: לֹא תִרְאֶה
  choice: de modo que você não consegue ver
  rationale: O hebraico diz literalmente “você não vê”. A formulação portuguesa explicita com naturalidade o sentido resultante da presença das trevas, sem mudar a imagem.
- source_word: וְשִׁפְעַת
  choice: e uma abundância de
  rationale: שִׁפְעָה pode indicar abundância ou transbordamento. “Uma abundância de” conserva o sentido amplo, enquanto a nota registra a possível imagem de inundação.
- source_word: מַיִם
  choice: águas
  rationale: Preserva o plural coletivo hebraico e a imagem poética.
- source_word: תְּכַסֶּךָּ
  choice: cobre você
  rationale: Traduz de modo transparente o Piel de כסה, “cobrir”, sem ampliar interpretativamente para “submergir” ou “dominar”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção “de modo que” suaviza a sequência nominal do hebraico sem eliminar sua relação contextual, e “águas” conserva o caráter poético do versículo.
