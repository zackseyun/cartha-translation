base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: pt
  text: É por você temê-lo[a] que ele o repreende[b] e entra em juízo com você?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do seu temor a ele”. Hebraico, literalmente: “por causa do seu temor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o censura” ou “o corrige”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “vem com você ao juízo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: É por você temê-lo
  rationale: 'A construção é interrogativa e causal: “é por causa do seu temor...?”. Em português, a forma verbal “por você temê-lo” expressa naturalmente a ideia, e “-lo” explicita o objeto subentendido — Deus — sem mudar o sentido.'
- source_word: יֹכִיחֶךָ
  choice: ele o repreende
  rationale: O hifil de יכח pode indicar repreender, corrigir ou contestar judicialmente. “Repreende” mantém a força moral e permite que a oração seguinte torne explícito o contexto forense.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: entra em juízo com você
  rationale: A expressão significa literalmente “vem com você ao juízo”. “Entra em juízo com você” é idiomático, preserva o cenário judicial e evita a interpretação mais específica de que Deus simplesmente “leva” Jó a julgamento.
- source_word: מִּשְׁפָּט
  choice: juízo
  rationale: Neste contexto, o termo designa julgamento ou processo judicial. “Juízo” conserva o sentido forense e combina naturalmente com a expressão portuguesa “entrar em juízo”.
theological_decisions:
- issue: Referente implícito do temor de Jó
  choice: Explicitar Deus como objeto por meio de “temê-lo”.
  alternative: 'Manter a elipse: “por causa do seu temor”.'
  rationale: O contexto identifica Deus como objeto do temor. A explicitação é necessária para uma formulação portuguesa natural e não acrescenta uma afirmação teológica nova.
- issue: Força da pergunta de Elifaz
  choice: Preservar uma pergunta retórica que espera resposta negativa.
  alternative: Formular uma pergunta neutra.
  rationale: 'A partícula interrogativa hebraica e o argumento de Elifaz indicam ironia: ele nega que Deus esteja julgando Jó por este temê-lo. A tradução mantém essa força sem inserir uma resposta na fala.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “temê-lo” evita uma elipse pouco natural; “o repreende” e “com você” mantêm um registro corrente sem perder a linguagem judicial do original.
