  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: pt
  text: Certamente, os nossos adversários foram eliminados[a], e o fogo consumiu o que restou deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico קִימָנוּ é difícil. Pode ser entendido como “os nossos adversários”, como no texto principal, ou, em algumas interpretações, como “os nossos bens” ou “as nossas posses”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o remanescente deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Certamente
  rationale: A expressão funciona aqui como uma afirmação enfática, não como uma condição real; “Certamente” comunica essa força de modo natural em português.
- source_word: נִכְחַד
  choice: foram eliminados
  rationale: O nifal de כחד expressa ser apagado, destruído ou suprimido. “Foram eliminados” preserva a voz passiva e o resultado da ação.
- source_word: קִימָנוּ
  choice: os nossos adversários
  rationale: A forma hebraica é difícil. Pelo contexto e pelo paralelismo com o restante deles consumido pelo fogo, “os nossos adversários” representa a interpretação contextual de pessoas que se levantaram contra nós, sem ocultar outras possibilidades, registradas em nota.
- source_word: וְיִתְרָם
  choice: o que restou deles
  rationale: יתר designa aquilo que sobra ou permanece, e o sufixo remete ao grupo anteriormente mencionado. A formulação é clara e idiomática em português.
- source_word: אָכְלָה אֵשׁ
  choice: o fogo consumiu
  rationale: A construção apresenta o fogo como sujeito de uma ação destrutiva. “Consumiu” mantém a imagem vívida e o aspecto verbal do hebraico.
theological_decisions: []
