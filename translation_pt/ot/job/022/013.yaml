  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: pt
  text: 'Mas você diz: “O que Deus sabe? Pode ele julgar através da escuridão profunda[a]?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Escuridão profunda” também pode ser traduzido por “nuvem escura” ou “trevas densas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ele julga através da escuridão profunda?” ou “Julgará ele através da escuridão profunda?” O imperfeito hebraico pode indicar ação presente ou futura, além da ideia de capacidade sugerida pela pergunta retórica.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Mas você diz
  rationale: O perfeito hebraico introduz aqui, em tom acusatório, a fala atribuída a Jó; o presente em português exprime naturalmente essa força discursiva, e “Mas” comunica o valor adversativo da conjunção.
- source_word: מַה
  choice: O que
  rationale: Pronome interrogativo que introduz o conteúdo do desafio atribuído a Jó.
- source_word: יָדַע
  choice: sabe
  rationale: O verbo denota conhecimento; o presente simples é natural na pergunta retórica em português.
- source_word: אֵל
  choice: Deus
  rationale: O título divino אֵל é traduzido de modo corrente e inteligível, sem transliteração desnecessária.
- source_word: הַבְעַד
  choice: através de
  rationale: A preposição indica que a escuridão densa funciona como algo interposto; “através de” preserva essa imagem.
- source_word: עֲרָפֶל
  choice: escuridão profunda
  rationale: O substantivo pode indicar trevas densas, nuvem escura ou neblina sombria; a escolha conserva o peso da imagem sem restringi-la apenas a uma nuvem.
- source_word: יִשְׁפּוֹט
  choice: Pode ele julgar
  rationale: Na pergunta retórica, o imperfeito pode sugerir dúvida quanto à capacidade ou possibilidade de Deus julgar, embora também admita leitura de ação presente ou futura.
theological_decisions:
- issue: Se יִשְׁפּוֹט deve ser expresso como capacidade, ação presente ou ação futura
  choice: Pode ele julgar através da escuridão profunda?
  alternative: Ele julga através da escuridão profunda? / Julgará ele através da escuridão profunda?
  rationale: No contexto, Elifaz atribui a Jó a ideia de que a escuridão impediria a percepção e o juízo divinos. A formulação com “pode” comunica naturalmente essa dúvida retórica, enquanto a nota preserva a amplitude do imperfeito hebraico.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com uso de “você” para o singular e ordem levemente enfática em “Pode ele julgar”. Os marcadores foram posicionados junto aos elementos que explicam: [a] após a expressão lexical e [b] após a pergunta verbal.'
