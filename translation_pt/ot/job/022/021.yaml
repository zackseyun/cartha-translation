  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: pt
  text: Chegue a um entendimento com ele, por favor, e esteja em paz; por meio disso[a], o bem virá a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “por meio deles” ou “por meio dessas coisas”, possivelmente em referência às duas exortações anteriores.'
    reason: O pronome hebraico está no plural, embora uma formulação singular seja mais natural em português; a nota preserva esse dado e a possível referência aos dois imperativos.
lexical_decisions:
- source_word: הַסְכֶּן
  choice: Entre em acordo
  rationale: O verbo, aqui no imperativo, expressa a ideia de estabelecer uma relação harmoniosa ou chegar a um entendimento. A formulação evita tanto o literalismo pouco natural de “acostume-se” quanto a explicitação teológica não presente na frase.
- source_word: וּשְׁלם
  choice: e fique em paz
  rationale: Reproduz o segundo imperativo de modo natural e mantém sua distinção em relação ao primeiro.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: o bem virá a você
  rationale: Preserva a personificação simples do bem como aquilo que chega ao destinatário, sem expandir para prosperidade material ou outra bênção específica.
theological_decisions:
- issue: Identidade do referente de עִמּוֹ (“com ele”)
  choice: Manter “com ele”
  alternative: Explicitar “com Deus”
  rationale: Embora o contexto permita entender que o referente é Deus, o versículo usa um pronome. Manter o pronome preserva a forma e a dependência contextual do original.
- issue: Relação entre as exortações e a chegada do bem
  choice: “por meio disso”
  alternative: “assim” ou “por causa disso”
  rationale: A preposição בְּ pode indicar meio ou relação consequencial. A tradução mantém a formulação instrumental do texto sem transformar a declaração em uma explicação causal mais rígida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Entre em acordo” comunica reconciliação ou harmonia sem recorrer a uma expressão excessivamente coloquial.
