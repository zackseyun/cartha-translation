source:
  edition: WLC
  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: pt
  text: Pois então você encontrará prazer no Todo-Poderoso e levantará o rosto para Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Levantar o rosto para Deus” pode sugerir aproximar-se dele com confiança, ter seu favor restaurado ou orar com ousadia.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Pois então
  rationale: כִּי introduz a consequência ligada à exortação anterior, e אָז marca o momento ou resultado subsequente.
- source_word: עַל שַׁדַּי
  choice: no Todo-Poderoso
  rationale: Com התענג, עַל indica aquele em quem se encontra prazer. “Todo-Poderoso” comunica de modo transparente o título divino שַׁדַּי.
- source_word: תִּתְעַנָּג
  choice: você encontrará prazer
  rationale: O hitpael de ענג exprime deleite desfrutado pessoalmente. Esta formulação é natural em português e evita a possível impressão de que “deleitar-se” seja um mandamento reflexivo neste contexto futuro.
- source_word: וְתִשָּׂא ... פָּנֶיךָ
  choice: e levantará o rosto
  rationale: Preserva a imagem concreta do hebraico נשׂא פנים e sua abertura semântica para confiança, favor restaurado ou oração destemida.
- source_word: אֶל אֱלוֹהַּ
  choice: para Deus
  rationale: אֶל marca direção, enquanto אֱלוֹהַּ é adequadamente traduzido pelo termo geral “Deus”, sem acrescentar um título ausente do hebraico.
theological_decisions:
- issue: Sentido da expressão “levantar o rosto para Deus”
  choice: Manter a expressão concreta “levantará o rosto para Deus”
  alternative: “olhará para Deus”, “orará a Deus com confiança” ou “poderá erguer a cabeça diante de Deus”
  rationale: A expressão pode sugerir aproximação confiante, favor restaurado ou oração ousada. A imagem literal preserva essa tensão poética e teológica sem restringi-la a uma só interpretação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo e a metáfora hebraica sem soar excessivamente arcaica.
