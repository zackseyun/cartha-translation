  source_fidelity: A tradução reproduz adequadamente a relação consequencial de כִּי אָז (“Pois então”), o deleite em שַׁדַּי (“no Todo-Poderoso”) e as duas formas verbais no futuro. “Levantará o rosto para Deus” mantém a imagem e a ambiguidade deliberada de וְתִשָּׂא אֶל־אֱלוֹהַּ פָּנֶיךָ, sem a reduzir a uma interpretação devocional específica.
  naturalness: O português é atual, claro e de registro digno. “Encontrará prazer no Todo-Poderoso” é natural e comunica bem o sentido de deleitar-se. A construção “levantará o rosto para Deus” é ligeiramente elevada, mas apropriadamente poética e inteligível no contexto de Jó.
  terminology: “Todo-Poderoso” é a tradução estabelecida e transparente de שַׁדַּי; “Deus” traduz adequadamente אֱלוֹהַּ. A nota explica a expressão figurada sem impor uma leitura doutrinária ou eliminar sua amplitude semântica.
