base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: pt
  text: Você não deu água para o cansado beber e negou pão ao faminto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como «pão» também pode referir-se, de modo mais amplo, a «alimento»; o texto principal mantém a palavra concreta da fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação simples da primeira acusação; em português, a segunda ação negativa é expressa naturalmente pelo verbo «negou».
- source_word: מַיִם
  choice: água
  rationale: Substantivo comum, empregado naturalmente como nome não contável em português.
- source_word: עָיֵף
  choice: o cansado
  rationale: O adjetivo hebraico é usado substantivamente e de modo genérico; «o cansado» conserva esse valor sem especificar uma pessoa concreta.
- source_word: תַּשְׁקֶה
  choice: deu ... para ... beber
  rationale: O hifil de שׁקה significa dar de beber ou fazer beber; esta formulação é clara e idiomática em português.
- source_word: וּמֵרָעֵב
  choice: e ... ao faminto
  rationale: O hebraico traz מִן, literalmente «do faminto», ligado a «reter». Com «negar», a regência portuguesa natural é «negar pão ao faminto», preservando o sentido de privação.
- source_word: תִּמְנַע
  choice: negou
  rationale: O qal de מנע significa reter, impedir ou negar. «Negou» comunica de modo natural a acusação moral de não fornecer o necessário.
- source_word: לָחֶם
  choice: pão
  rationale: Mantém o termo concreto do hebraico, embora ele possa designar alimento em sentido mais amplo.
