base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: pt
  text: Você mandou as viúvas embora de mãos vazias, e os braços dos órfãos foram esmagados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Braços” também pode representar a força ou o poder dos órfãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: viúvas
  rationale: Equivalente direto e corrente, preservando a condição de vulnerabilidade social e jurídica destacada no contexto sapiencial.
- source_word: שִׁלַּחְתָּ
  choice: mandou ... embora
  rationale: Expressa naturalmente em português o sentido causativo/intensivo de despedir ou mandar embora no contexto da acusação.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: Formulação idiomática que comunica com clareza o sentido adverbial de sair sem receber nada.
- source_word: זְרֹעוֹת
  choice: braços
  rationale: Preserva a imagem concreta do hebraico e sua possível conotação metafórica de força ou poder.
- source_word: יְתֹמִים
  choice: órfãos
  rationale: Termo moderno, claro e abrangente para crianças privadas da proteção paterna; no hebraico bíblico, pode designar especificamente os que não têm pai.
- source_word: יְדֻכָּא
  choice: foram esmagados
  rationale: Traduz o sentido passivo de דכא, 'esmagar, quebrar'. O plural segue a concordância natural em português com 'braços', embora a forma verbal hebraica seja singular.
