  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: pt
  text: 'Ele livra até mesmo quem não é inocente[a],

    e ele será livrado pela pureza de suas mãos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele livra o inocente”. O hebraico da primeira linha é difícil, e alguns entendem a expressão de modo diferente.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pela pureza de suas mãos”, expressão que indica inocência ou integridade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: livra
  rationale: O piel de מלט expressa fazer escapar, resgatar ou livrar. “Livra” é natural, conciso e permite manter a ligação lexical com o verbo do segundo verso.
- source_word: אִי נָקִי
  choice: até mesmo quem não é inocente
  rationale: A expressão hebraica é difícil. Esta tradução segue a compreensão tradicional de אִי como elemento de sentido negativo e comunica que o livramento alcança alguém que não é inocente, sem ocultar a leitura alternativa.
- source_word: נָקִי
  choice: inocente
  rationale: נָקִי indica ausência de culpa ou inocência em sentido moral ou judicial; “inocente” transmite esse valor com clareza.
- source_word: וְנִמְלַט
  choice: e essa pessoa será livrada
  rationale: O nifal de מלט pode significar “ser livrado” ou “escapar”. A forma passiva preserva o paralelismo e “essa pessoa” explicita naturalmente em português o referente implícito.
- source_word: בְּבֹר
  choice: pela pureza
  rationale: בֹּר é entendido aqui como pureza, e a preposição בְּ tem valor instrumental ou causal. “Pela pureza” mantém a concisão e a relação de meio apresentada pelo hebraico.
- source_word: כַּפֶּיךָ
  choice: das suas mãos
  rationale: A forma hebraica refere-se às mãos do interlocutor. “Suas mãos” preserva a imagem hebraica e é compreensível no registro bíblico moderno.
theological_decisions:
- issue: Sentido interpretativo do primeiro membro do versículo
  choice: Deus livra até mesmo alguém que não é inocente.
  alternative: Deus livra o inocente.
  rationale: A sintaxe hebraica é notoriamente difícil. A leitura adotada segue uma compreensão tradicional de אִי e se ajusta ao segundo membro, no qual a pessoa é livrada pela pureza das mãos do interlocutor. A nota preserva a alternativa sem transformar a declaração em uma doutrina mais ampla de intercessão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição “livra/será livrada” conserva o paralelismo e a ligação entre as duas formas do mesmo verbo hebraico. A imagem das mãos foi mantida, e sua força idiomática é explicada em nota.
