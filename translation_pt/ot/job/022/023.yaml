  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: pt
  text: Se você voltar para o Todo-Poderoso, será restaurado[a] e afastará a injustiça da sua tenda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será edificado” ou “será reconstruído”. O verbo hebraico significa literalmente “ser construído” e é usado aqui como metáfora de restauração ou restabelecimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “maldade” ou “ação errada”. “Tenda” também pode representar a casa ou o ambiente doméstico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma condição de modo direto e natural em português.
- source_word: תָּשׁוּב
  choice: você voltar
  rationale: O verbo שׁוב significa fundamentalmente voltar ou retornar. “Voltar” preserva esse sentido básico sem restringi-lo à formulação teológica “arrepender-se”.
- source_word: עַד
  choice: para
  rationale: Com o verbo “voltar”, expressa orientação ou movimento em direção a Deus; “para” é natural no português atual.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino שַׁדַּי pela forma tradicional, clara e amplamente reconhecida em português.
- source_word: תִּבָּנֶה
  choice: será restaurado
  rationale: O nifal de בנה significa literalmente “ser construído” ou “ser reconstruído”; no contexto, a metáfora comunica restauração ou restabelecimento. A forma passiva foi preservada.
- source_word: תַּרְחִיק
  choice: afastar
  rationale: 'O hifil de רחק tem sentido causativo: fazer ficar longe. “Afastar” expressa isso de maneira concisa e idiomática.'
- source_word: עַוְלָה
  choice: a injustiça
  rationale: O substantivo pode indicar injustiça, maldade ou ação errada. “Injustiça” mantém tanto a dimensão moral quanto a relacional.
- source_word: מֵאָהֳלֶךָ
  choice: da sua tenda
  rationale: Mantém a imagem concreta e cultural do hebraico; “tenda” também pode representar a casa ou o ambiente doméstico.
theological_decisions:
- issue: Tradução da metáfora de ser construído
  choice: será restaurado
  alternative: será edificado; será reconstruído
  rationale: “Restaurado” comunica naturalmente o restabelecimento indicado pela metáfora, enquanto a nota preserva as traduções mais literais.
- issue: Tradução de שׁוב
  choice: voltar
  alternative: arrepender-se; retornar
  rationale: “Voltar” preserva o alcance lexical e a orientação para Deus sem transformar implicitamente o verbo em um termo teológico mais específico.
- issue: Relação sintática da segunda oração
  choice: se afastar a injustiça
  alternative: e afastará a injustiça; afaste a injustiça
  rationale: A forma verbal hebraica admite discussão quanto à relação com a condição anterior. A repetição de “se” produz em português uma exortação condicional coerente com o contexto e com o paralelismo, sem tratá-la como promessa independente.
translation_notes:
  register: Português atual, digno e claro, com “você” para ampla legibilidade brasileira. Conserva a imagem da tenda e evita termos confessionais mais estreitos. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
