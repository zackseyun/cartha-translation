  text: תַּעְתִּ֣יר אֵ֭לָי/ו וְ/יִשְׁמָעֶ֑/ךָּ וּ/נְדָרֶ֥י/ךָ תְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: pt
  text: Você orará a ele, e ele ouvirá você; e você cumprirá os seus votos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “você pagará os seus votos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: Você orará
  rationale: O hifil de עתר pode expressar súplica ou oração insistente. “Orará” é natural em português atual e, com “a ele” e a resposta de Deus no verso, preserva claramente o sentido de petição.
- source_word: אֵלָיו
  choice: a ele
  rationale: A preposição אֶל com sufixo de terceira pessoa masculina singular significa literalmente “a ele”. O antecedente é Deus no contexto, mas manter o pronome evita uma explicitação desnecessária.
- source_word: וְיִשְׁמָעֶךָּ
  choice: e ele ouvirá você
  rationale: שׁמע significa “ouvir” ou “escutar”. “Ouvirá você” mantém o sentido direto e a fluidez no português brasileiro, sem ampliar a expressão para “responderá”, embora no contexto de oração haja a ideia de atenção favorável.
- source_word: וּנְדָרֶיךָ
  choice: e os seus votos
  rationale: נֶדֶר designa um voto feito a Deus. “Seus votos” preserva o plural sem acrescentar a noção mais específica de ofertas votivas.
- source_word: תְשַׁלֵּם
  choice: você cumprirá
  rationale: O piel de שלם, quando usado com votos, significa pagá-los no sentido de realizar o que foi prometido. “Cumprirá” comunica naturalmente esse idioma em português, enquanto “pagará” preserva mais de perto sua forma lexical.
theological_decisions:
- issue: Traduzir a cláusula final de modo idiomático (“cumprirá os seus votos”) ou mais literalmente (“pagará os seus votos”).
  choice: você cumprirá os seus votos
  alternative: você pagará os seus votos
  rationale: O hebraico se refere à realização daquilo que foi prometido a Deus. “Cumprirá” transmite com clareza a obrigação religiosa e evita que “pagará” seja entendido apenas em sentido monetário, enquanto a nota preserva a formulação mais literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa masculina singular do hebraico. O paralelismo das três formas verbais no futuro foi preservado, e o ponto e vírgula distingue a resposta divina da obrigação assumida por quem ora.
