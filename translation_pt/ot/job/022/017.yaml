  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: pt
  text: 'os quais diziam a Deus: “Afasta-te de nós! O que o Todo-Poderoso poderá fazer a eles?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: a eles. A fala muda de “nós” para “eles”.'
    reason: Sinaliza ao leitor a mudança pronominal incomum preservada do texto hebraico.
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Afasta-te de nós
  rationale: Reproduz o imperativo dirigido a Deus e mantém a primeira pessoa do plural do hebraico.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Equivalente tradicional e amplamente compreensível do título divino Shaddai.
- source_word: לָמוֹ
  choice: a eles
  rationale: Mantém a forma hebraica de terceira pessoa do plural, apesar da mudança de pessoa em relação a “de nós”.
theological_decisions:
- issue: Mudança pronominal dentro da fala citada
  choice: Preservar “de nós” e “a eles”
  alternative: Uniformizar como “de nós” e “a nós”
  rationale: O texto consonantal vocalizado distingue explicitamente מִמֶּנּוּ, “de nós”, de לָמוֹ, “a eles”. A tradução não elimina essa tensão discursiva.
translation_notes:
  register: Português moderno, claro e digno. “Afasta-te” conserva a solenidade do discurso poético sem soar excessivamente arcaico; a ordem das frases mantém o paralelismo hebraico.
