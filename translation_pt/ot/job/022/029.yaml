base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: pt
  text: 'Pois, quando forem abatidos, você dirá: “Há elevação!”[a] E ele salvará a pessoa de olhos baixos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “elevação” ou “exaltação”. O hebraico é elíptico; também se pode traduzir: “Exaltação!”'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “o de olhos baixos”; a expressão pode descrever uma pessoa humilde, abatida ou desalentada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois, quando
  rationale: Expressa de modo natural a relação causal e circunstancial com a promessa anterior, sem reduzir a conjunção a um valor exclusivamente causal ou temporal.
- source_word: הִשְׁפִּילוּ
  choice: forem abatidos
  rationale: O verbo descreve rebaixamento ou humilhação. A forma plural não explicita objeto, e a construção passiva em português comunica naturalmente o estado resultante sem sugerir humilhação voluntária.
- source_word: וַתֹּאמֶר
  choice: você dirá
  rationale: Mantém o destinatário singular do discurso e o valor prospectivo da afirmação no contexto.
- source_word: גֵּוָה
  choice: Exaltação!
  rationale: O substantivo é elíptico e difícil. Aqui contrasta com o abatimento e aponta para elevação ou restauração; a exclamação preserva melhor a concisão do hebraico do que acrescentar um verbo e um objeto.
- source_word: וְשַׁח עֵינַיִם
  choice: quem tem os olhos baixos
  rationale: Conserva a imagem concreta do hebraico, que literalmente descreve alguém de olhos baixos e pode indicar humildade, abatimento ou desalento.
- source_word: יוֹשִׁעַ
  choice: ele salvará
  rationale: Traduz o verbo no masculino singular e mantém implícito, como no hebraico, o sujeito entendido pelo contexto.
theological_decisions:
- issue: Sujeito de יוֹשִׁעַ
  choice: “ele salvará”, com Deus como sujeito implícito pelo contexto
  alternative: Explicitar “Deus salvará” ou entender um sujeito indefinido
  rationale: O verbo está na terceira pessoa masculina singular, mas o nome do sujeito não aparece nesta oração. O pronome preserva a concisão e não introduz um substantivo ausente do texto.
- issue: Sentido de גֵּוָה na oração elíptica
  choice: “Exaltação!” como declaração concisa de elevação
  alternative: “Há exaltação!”, “Para cima!” ou o sentido negativo de “orgulho”
  rationale: O contraste imediato com o abatimento favorece uma reversão positiva. A formulação nominal conserva a elipse e evita transformar indevidamente o substantivo em uma ordem explícita.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o destinatário singular. A exclamação nominal preserva a concisão e a dificuldade do hebraico, enquanto as notas registram as principais ambiguidades sem impor uma interpretação denominacional.
