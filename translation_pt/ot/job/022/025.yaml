  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: pt
  text: então o Todo-Poderoso será o seu ouro[a], e prata preciosa para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “então o Todo-Poderoso será o seu tesouro, e você terá prata em abundância”. Os termos hebraicos traduzidos por “ouro” e “preciosa” são difíceis e talvez enfatizem a riqueza dada por Deus, em vez de apresentarem o próprio Deus como o tesouro.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: então ... será
  rationale: No contexto da exortação condicional de Elifaz, a construção introduz a consequência futura; “então ... será” expressa isso naturalmente.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Tradução consagrada do título divino em Jó, clara e significativa em português.
- source_word: בְּצָרֶיךָ
  choice: o seu ouro
  rationale: No paralelismo com “prata”, o substantivo provavelmente indica metal precioso ou riqueza; “ouro” é natural, embora o termo hebraico seja difícil.
- source_word: וְכֶסֶף
  choice: e prata
  rationale: Mantém o segundo elemento coordenado do paralelismo poético, com o predicado subentendido a partir da primeira oração.
- source_word: תּוֹעָפוֹת
  choice: preciosa
  rationale: O termo raro e incerto parece qualificar a prata em termos de excelência ou abundância; “preciosa” preserva a ideia de grande valor sem definir excessivamente a nuance.
- source_word: לָךְ
  choice: para você
  rationale: Explicita o valor pessoal ou benefativo do dativo e produz uma formulação natural em português.
theological_decisions:
- issue: Sentido da promessa no discurso de Elifaz
  choice: O texto principal apresenta o Todo-Poderoso como a verdadeira riqueza de Jó.
  alternative: A frase pode prometer que o Todo-Poderoso dará a Jó ouro e prata em abundância.
  rationale: A estrutura poética hebraica admite tanto a identificação metafórica de Deus com o tesouro quanto a ideia de riqueza provida por Deus. O texto principal conserva a metáfora mais direta, e a nota registra a alternativa sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a ambiguidade interpretativa do hebraico.
