base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: pt
  text: Pois você tomava penhores[b] dos seus irmãos[a] sem motivo e tirava as roupas dos nus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode referir-se de modo mais amplo a outros membros da comunidade, não apenas a irmãos biológicos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “tomava dos seus irmãos bens como garantia”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode significar “os que mal estavam vestidos” ou “os quase nus”. O texto hebraico conserva a imagem incisiva de tirar as roupas dos nus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a acusação de Elifaz em ligação explicativa com o que precede, de modo natural em português.
- source_word: תַחְבֹּל
  choice: você tomava penhores
  rationale: O verbo חבל, neste contexto, refere-se a tomar um bem como penhor ou garantia de uma dívida. A forma verbal permite entender uma conduta reiterada no quadro das acusações.
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: Preserva o sentido literal masculino plural e sua possível dimensão social ou comunitária, sem restringi-lo necessariamente a irmãos biológicos.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Expressa que a ação era injustificada ou sem causa, não apenas realizada sem pagamento.
- source_word: וּבִגְדֵי
  choice: e ... de suas roupas
  rationale: בגד designa roupa ou veste; a formulação portuguesa integra o substantivo naturalmente ao verbo 'despia'.
- source_word: עֲרוּמִּים
  choice: os que estavam nus
  rationale: Mantém a imagem forte e paradoxal do hebraico; o termo também pode referir-se a pessoas malvestidas ou quase nuas.
- source_word: תַּפְשִׁיט
  choice: despia
  rationale: O hifil de פשט significa tirar ou fazer alguém tirar a roupa. 'Despia de suas roupas' transmite diretamente a acusação.
