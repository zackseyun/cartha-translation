    rationale: A âncora deve acompanhar o termo que a nota esclarece. A posição atual pode sugerir incorretamente que a alternativa «sem causa» se refere a bens dados como garantia.
  - severity: low
    issue: «Os que estavam nus» acrescenta um aspecto temporal e enfraquece a formulação paradoxal concisa.
    rationale: O hebraico traz simplesmente «os nus»; «dos nus» é mais fiel e idiomático no paralelismo com a retirada das roupas.
