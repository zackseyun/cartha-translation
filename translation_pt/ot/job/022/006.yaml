review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: a acusação é de tomar garantias injustificadamente dos próprios «irmãos» e de retirar as roupas dos nus. Contudo, a nota lexical sobre «bens como garantia» está ancorada em «sem motivo», embora explique «penhores»; além disso, «os que estavam nus» introduz desnecessariamente uma nuance temporal ausente do hebraico.'
  naturalness: «Pois você tomava penhores dos seus irmãos sem motivo» é natural e claro. No segundo membro, «despia de suas roupas os que estavam nus» é compreensível, mas a ordem marcada soa menos direta em português do que «tirava as roupas dos nus», que também conserva melhor o efeito paradoxal conciso do original.
  terminology: «Penhores» corresponde adequadamente a תַחְבֹּל no contexto de garantias por dívida. «Irmãos» preserva אַחֶיךָ, com a nota cultural apropriada. «Nus» corresponde a עֲרוּמִּים e não deve ser suavizado no texto principal.
  issues:
