lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão ou consequência introduzida pela locução hebraica.
- source_word: סְבִיבוֹתֶיךָ
  choice: cercam você
  rationale: Transmite a ideia espacial de algo que está ao redor da pessoa; a construção verbal é clara e natural em português.
- source_word: פַחִים
  choice: armadilhas
  rationale: O substantivo designa armadilhas ou laços usados para capturar; “armadilhas” é corrente e preserva a imagem de perigos ocultos.
- source_word: וִיבַהֶלְךָ
  choice: o apavora
  rationale: O verbo בהל descreve causar perturbação, pavor ou pânico; “apavora” preserva sua força sem acrescentar a ideia interpretativa de ser dominado ou subjugado.
- source_word: פַּחַד
  choice: terror
  rationale: O termo denota medo intenso ou pavor; “terror” corresponde à intensidade do contexto.
- source_word: פִּתְאֹם
  choice: repentino
  rationale: Embora seja formalmente um advérbio, sua relação com a ocorrência do terror pode ser expressa naturalmente em português pelo adjetivo “repentino”, preservando a ideia de irrupção inesperada.
