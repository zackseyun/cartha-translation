- source_word: וְלֹא עֵת
  choice: antes do seu tempo
  rationale: Expressa em português natural a ideia de um fim prematuro, literalmente ocorrido quando ainda não era o tempo devido.
- source_word: נָהָר
  choice: um rio
  rationale: Preserva o substantivo concreto e a indefinição do hebraico, sem transformar interpretativamente o rio no dilúvio.
- source_word: יוּצַק
  choice: levou embora
