- source_word: יְסוֹדָם
  choice: sua fundação
  rationale: Mantém o singular coletivo com sufixo plural e a metáfora da base sobre a qual a vida ou segurança deles estava estabelecida.
theological_decisions:
- issue: Natureza da imagem de julgamento
  choice: Descrever a destruição prematura dos perversos por águas avassaladoras sem identificar explicitamente o acontecimento.
  alternative: Entender a frase como alusão específica à geração destruída pelo dilúvio, ou apenas como metáfora geral de uma queda repentina.
  rationale: O contexto e a imagem aquática permitem uma alusão ao dilúvio, mas o hebraico não exige que a tradução decida entre referência histórica específica e imagem geral de julgamento.
