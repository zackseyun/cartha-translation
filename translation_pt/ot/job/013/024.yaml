  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: pt
  text: Por que escondes o teu rosto e me consideras teu inimigo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me tens por teu inimigo”.'
    reason: Registra uma formulação alternativa, mais formal, para a construção predicativa e a relação expressa por לָךְ.
lexical_decisions:
- source_word: לָמָה
  choice: Por que
  rationale: Interrogativo direto de causa ou razão; é a forma natural em português.
- source_word: פָנֶיךָ
  choice: o teu rosto
  rationale: Preserva a imagem concreta do hebraico, que pode implicar presença ou favor sem explicitar uma interpretação.
- source_word: תַסְתִּיר
  choice: escondes
  rationale: Traduz diretamente o hifil de סתר e mantém a força relacional da imagem de esconder o rosto.
- source_word: וְתַחְשְׁבֵנִי
  choice: e me consideras
  rationale: חשב pode significar pensar, considerar, reputar ou contar; nesta construção predicativa, “considerar” é claro e natural em português.
- source_word: לְאוֹיֵב לָךְ
  choice: teu inimigo
  rationale: Expressa de modo idiomático a relação indicada literalmente por “inimigo para ti”, sem alterar o sentido.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus em “escondes o teu rosto”
  choice: Manter a expressão concreta “escondes o teu rosto” no texto principal.
  alternative: “retiras a tua presença” ou “te afastas de mim”
  rationale: A formulação hebraica conserva a textura poética e a tensão relacional, sem reduzir a imagem a uma única interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “tu” em coerência com as formas verbais e possessivas, preservando o paralelismo poético e a imagem bíblica do rosto.
