  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: pt
  text: As máximas de vocês são provérbios de cinza[a]; as suas defesas são defesas de barro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As lembranças de vocês são provérbios de cinza; os seus baluartes são baluartes de barro”. O hebraico é conciso, e a frase final é difícil; “defesas/baluartes” reflete uma leitura contextual do substantivo repetido.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: as máximas de vocês
  rationale: Embora o substantivo esteja ligado à ideia de lembrança ou memorial, no contexto designa formulações memoráveis ou sentenças de autoridade apresentadas pelos amigos de Jó. “Máximas” comunica esse valor sapiencial em português natural.
- source_word: מִשְׁלֵי
  choice: provérbios de
  rationale: מָשָׁל pode designar provérbio, dito ou comparação. A construção “provérbios de cinza” preserva a metáfora nominal, concisa e própria da literatura sapiencial.
- source_word: אֵפֶר
  choice: cinza
  rationale: O sentido comum é “cinza”, imagem de inutilidade e fragilidade. O singular coletivo é idiomático em português.
- source_word: לְגַבֵּי
  choice: são
  rationale: A expressão hebraica é comprimida e difícil; aqui foi representada por uma cópula, necessária em português para expressar a identificação metafórica sem paráfrase excessiva.
- source_word: חֹמֶר
  choice: barro
  rationale: חֹמֶר denota barro, argila ou material semelhante à argamassa. “Barro” é corrente e transmite bem a fragilidade da imagem.
- source_word: גַּבֵּיכֶם
  choice: as suas defesas
  rationale: Embora גַּב possa significar literalmente “costas” ou uma superfície elevada, o contexto favorece a leitura metafórica de posições ou estruturas defensivas. “Defesas” exprime a precariedade dos argumentos dos interlocutores sem tornar o verso indecifrável.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A repetição “defesas são defesas” conserva o paralelismo e a formulação enfática do hebraico.
