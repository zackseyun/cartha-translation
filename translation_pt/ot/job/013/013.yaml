  text: הַחֲרִ֣ישׁוּ מִ֭מֶּ/נִּי וַ/אֲדַבְּרָה אָ֑נִי וְ/יַעֲבֹ֖ר עָלַ֣/י מָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: pt
  text: Calem-se diante de mim[a] e deixem-me falar; depois, venha sobre mim o que vier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Calem-se de mim, e eu falarei; e passe sobre mim o que quer que seja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Calem-se
  rationale: O imperativo hifil plural de חרשׁ ordena aos interlocutores que parem de falar. “Calem-se” é direto, natural e conserva a força da ordem.
- source_word: מִמֶּנִּי
  choice: diante de mim
  rationale: A preposição significa literalmente “de mim”, mas, junto de הַחֲרִישׁוּ, indica que os interlocutores devem se calar em relação a Jó, em sua presença. “Diante de mim” comunica essa relação sem uma formulação artificial.
- source_word: וַאֲדַבְּרָה
  choice: e deixem-me falar
  rationale: A forma coortativa na primeira pessoa expressa vontade ou determinação. “Deixem-me falar” preserva essa nuance e se liga naturalmente à ordem anterior.
- source_word: אָנִי
  choice: me
  rationale: O pronome independente enfatiza o próprio Jó como aquele que falará. Em português, essa ênfase fica suficientemente comunicada em “deixem-me falar”, sem acrescentar um “eu” pouco natural.
- source_word: וְיַעֲבֹר
  choice: depois, venha
  rationale: עבר significa literalmente “passar”, mas com עָלַי descreve aquilo que sobrevém a alguém. “Venha” mantém a força volitiva da forma verbal; “depois” explicita a progressão contextual.
- source_word: עָלַי
  choice: sobre mim
  rationale: Com עבר, a preposição עַל marca Jó como aquele sobre quem algo virá. “Sobre mim” conserva de modo claro a imagem hebraica.
- source_word: מָה
  choice: o que vier
  rationale: מָה tem aqui sentido indefinido, equivalente a “seja o que for”. A expressão idiomática “o que vier” preserva a indeterminação e a disposição de Jó para enfrentar as consequências.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A redação mantém a firmeza de Jó e a ambiguidade do que poderá sobrevir-lhe, sem especificar a natureza das consequências.
