  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: pt
  text: Pões os meus pés no tronco[a] e vigias todos os meus caminhos; marcas as plantas dos meus pés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa prisão para os pés”. O termo hebraico indica um dispositivo que imobilizava os pés.
    reason: lexical_alternative
  - marker: b
    text: Ou “traças uma delimitação ao redor das plantas dos meus pés”. O verbo hebraico pode indicar marcar, gravar ou delimitar; a imagem exata é incerta.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְתָשֵׂם
  choice: Pões
  rationale: O verbo שׂים significa pôr, colocar ou estabelecer. “Pões” é natural e direto no contexto de prender os pés.
- source_word: בַּסַּד
  choice: no tronco
  rationale: סַד designa um instrumento que imobiliza os pés. “Tronco” é uma designação portuguesa reconhecível para esse instrumento de prisão, embora o termo hebraico não especifique sua construção.
- source_word: וְתִשְׁמוֹר
  choice: vigias
  rationale: שׁמר pode significar guardar, observar ou vigiar. Aqui, “vigias” expressa a fiscalização restritiva de todos os movimentos de Jó.
- source_word: כָּל אָרְחוֹתָי
  choice: todos os meus caminhos
  rationale: אֹרַח denota caminho, vereda ou curso de vida. “Caminhos” conserva tanto a imagem concreta quanto sua possível dimensão existencial.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: ao redor das plantas dos meus pés
  rationale: Literalmente, a expressão fala das “raízes” dos pés, mas neste contexto refere-se à sua parte inferior ou base. “Plantas dos meus pés” comunica o provável sentido anatômico.
- source_word: תִּתְחַקֶּה
  choice: traças um limite
  rationale: A forma verbal de חקה pode indicar gravar, traçar ou demarcar. “Traças um limite” preserva a imagem de marcação e combina com o contexto de confinamento, sem reduzir a expressão à simples observação.
