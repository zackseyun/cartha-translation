  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: pt
  text: O que vocês sabem, eu também sei; não sou inferior a vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fico abaixo de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: O que vocês sabem
  rationale: A preposição כְּ com דַּעַת e o sufixo de segunda pessoa masculina plural introduz uma comparação entre o conhecimento dos amigos e o de Jó. Esta formulação é natural em português e forma bom paralelo com “eu também sei”.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: 'Embora seja formalmente um perfeito na primeira pessoa singular, aqui o verbo tem valor estativo presente: Jó afirma possuir o mesmo conhecimento.'
- source_word: גַם אָנִי
  choice: eu também
  rationale: A expressão enfatiza que Jó compartilha o conhecimento alegado por seus interlocutores.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: não sou inferior a vocês
  rationale: O particípio נֹפֵל seguido de מִן exprime inferioridade ou insuficiência numa comparação. No contexto, Jó nega ser intelectualmente inferior aos amigos.
- source_word: אָנֹכִי
  choice: sou
  rationale: O pronome independente reforça o sujeito; em português, a presença de “eu” na oração anterior e a construção direta comunicam a ênfase sem tornar a frase artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. A tradução conserva o paralelismo e a afirmação enfática de Jó sem explicitar além do texto que a comparação é especificamente intelectual.
