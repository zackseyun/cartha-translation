  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: pt
  text: Isso também será a minha salvação[a], pois nenhum ímpio[b] virá à presença dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento” ou “vindicação”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “irreverente” ou “profano”. O hebraico se refere a quem é irreverente diante de Deus, não apenas a alguém insincero ou hipócrita.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: Preserva de modo natural a força aditiva e enfática da partícula hebraica.
- source_word: הוּא
  choice: isso
  rationale: Embora formalmente seja um pronome de terceira pessoa, aqui retoma a situação ou afirmação anterior; “isso” comunica melhor essa função em português.
- source_word: לִי לִישׁוּעָה
  choice: será a minha salvação
  rationale: A construção indica benefício ou posse; esta formulação é idiomática, solene e mantém o amplo campo semântico de livramento e vindicação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação precedente de maneira clara e concisa.
- source_word: לְפָנָיו
  choice: à presença dele
  rationale: Expressa naturalmente o idioma hebraico de comparecer diante de alguém, mantendo o pronome do texto sem explicitar seu referente no corpo do versículo.
- source_word: חָנֵף
  choice: ímpio
  rationale: Designa alguém irreverente ou profano perante Deus, e não apenas uma pessoa insincera; “ímpio” preserva o sentido moral e religioso.
- source_word: יָבוֹא
  choice: virá
  rationale: O imperfeito hebraico admite aqui uma afirmação geral ou prospectiva; “virá” conserva a forma assertiva sem acrescentar explicitamente a ideia modal de permissão.
theological_decisions:
- issue: Referente do pronome em לְפָנָיו
  choice: “dele”, entendido no contexto como referência a Deus
  alternative: Referência mais geral àquele diante de quem Jó comparece
  rationale: O contexto aponta naturalmente para Deus, mas o texto principal mantém o pronome, evitando explicitar além do hebraico.
- issue: Sentido de יְשׁוּעָה na declaração de Jó
  choice: “salvação”, abrangendo livramento e possível vindicação
  alternative: “livramento” ou “vindicação”
  rationale: “Salvação” mantém a correspondência lexical e o registro solene, enquanto a nota preserva os matizes forense e libertador relevantes no contexto.
- issue: Força da declaração sobre o ímpio
  choice: “nenhum ímpio virá à presença dele”
  alternative: “um ímpio não pode comparecer diante dele”
  rationale: A formulação escolhida preserva a construção negativa e assertiva do hebraico sem decidir de forma excessiva entre impossibilidade, inadmissibilidade e resultado futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue sua ocorrência natural no texto. A formulação conserva a concisão e a tensão da afirmação de Jó.
