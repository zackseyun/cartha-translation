  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: pt
  text: Acaso amedrontarás[a] uma folha levada pelo vento e perseguirás a palha seca[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amedrontar” também pode ser traduzido por “aterrorizar”; o verbo hebraico expressa causar medo ou pavor e, neste contexto, pode ainda sugerir tratamento severo.
    reason: lexical_alternative
  - marker: b
    text: “Palha” também pode ser traduzido por “restolho”. O termo hebraico designa matéria vegetal seca e ressalta sua fragilidade e insignificância na comparação.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: uma folha
  rationale: O substantivo עָלֶה designa normalmente uma folha; o singular mantém a imagem poética concreta da extrema fragilidade.
- source_word: נִדָּף
  choice: levada pelo vento
  rationale: O particípio de נדף descreve algo impelido ou disperso, normalmente pelo vento. A formulação explicita de modo natural em português a força implícita na imagem.
- source_word: תַּעֲרֹוץ
  choice: amedrontarás
  rationale: ערץ pode significar causar medo ou pavor. “Amedrontar” preserva essa força sem excluir a possível conotação contextual de tratar com dureza.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção liga a segunda imagem paralela; o marcador hebraico de objeto direto não requer correspondência explícita em português.
- source_word: קַשׁ
  choice: palha
  rationale: קַשׁ pode indicar palha ou restolho. “Palha” é corrente, clara e comunica bem a leveza e insignificância da matéria vegetal seca.
- source_word: יָבֵשׁ
  choice: seca
  rationale: O adjetivo descreve diretamente a palha e intensifica a imagem de fragilidade.
- source_word: תִּרְדֹּף
  choice: perseguirás
  rationale: רדף significa perseguir ou ir atrás. “Perseguir” conserva o tom elevado e a ação agressiva do paralelismo.
