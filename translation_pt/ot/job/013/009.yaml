    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Será bom para vocês
  rationale: A partícula interrogativa com טוֹב introduz uma pergunta retórica voltada ao resultado futuro do exame divino; explicitar «para vocês» torna natural em português o sentido contextual sem acrescentar novo referente.
- source_word: כִּי
  choice: quando
  rationale: Introduz aqui a circunstância temporal em que se avaliará se o resultado lhes será favorável.
- source_word: יַחְקֹר אֶתְכֶם
  choice: ele os examinar
  rationale: חקר denota investigar ou perscrutar cuidadosamente; «examinar» é claro e preserva a ideia de escrutínio. «Os» marca o objeto plural.
- source_word: אִם
  choice: Ou
  rationale: Introduz a segunda pergunta retórica, apresentada como alternativa paralela.
- source_word: כְּהָתֵל בֶּאֱנוֹשׁ
  choice: como se zomba de um simples ser humano
  rationale: התל admite zombar, enganar ou brincar às custas de alguém. «Zombar» comunica bem a afronta no contexto; «simples ser humano» expressa o contraste implícito entre o humano frágil e Deus.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: vocês zombarão dele
  rationale: A forma verbal é de segunda pessoa masculina plural e o pronome singular se refere contextualmente a Deus. O futuro mantém a força prospectiva e retórica.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares
  choice: Os pronomes ficam como «ele/dele», referindo-se contextualmente a Deus.
  alternative: Explicitar «Deus» ou entender um examinador ou juiz não especificado.
  rationale: Jó 13:7–11 identifica Deus como aquele que perscrutará os interlocutores. Manter os pronomes preserva a forma hebraica sem tornar ambíguo o sentido no contexto.
- issue: Contraste entre Deus e אֱנוֹשׁ
  choice: «um simples ser humano»
  alternative: «um homem» ou «um mortal»
  rationale: A expressão torna perceptível que Deus não pode ser tratado como alguém meramente humano, sem introduzir uma doutrina adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento plural explícito por «vocês». A formulação mantém as duas perguntas retóricas e a ambiguidade lexical de התל é registrada em nota.
