translation:
  language: pt
  text: Será bom para vocês quando ele os examinar? Ou vocês zombarão dele[a] como se zomba de um mortal[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vocês o enganarão» ou «vocês brincarão com ele»; o verbo hebraico pode indicar zombar, enganar ou fazer de alguém objeto de diversão.'
