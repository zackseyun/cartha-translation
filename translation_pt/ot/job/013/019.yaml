  text: Quem é que discutirá comigo? Pois então eu me calaria e morreria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois agora eu me calaria e morreria”. O advérbio hebraico geralmente significa “agora”, mas aqui muitos o entendem no sentido de “então”, dentro da argumentação de Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Quem é que
  rationale: A combinação do interrogativo com o pronome independente é enfática. “Quem é que” conserva naturalmente essa força retórica em português.
- source_word: יָרִיב
  choice: discutirá
  rationale: O verbo ריב pode indicar contenda, disputa ou litígio. “Discutirá” é claro e natural, preservando o confronto verbal ou forense sem impor um cenário judicial específico.
- source_word: עִמָּדִי
  choice: comigo
  rationale: A preposição significa literalmente “com”; o caráter adversarial já é comunicado pelo verbo.
- source_word: כִּי
  choice: Pois
  rationale: Aqui a conjunção introduz a consequência ou razão ligada ao desafio retórico de Jó, e “pois” mantém bem o encadeamento argumentativo.
- source_word: עַתָּה
  choice: então
  rationale: 'Embora o advérbio costume significar “agora”, neste contexto pode ser entendido como resultado implícito do desafio anterior: “pois então”. A alternativa lexical é preservada em nota.'
- source_word: אַחֲרִישׁ
  choice: eu me calaria
  rationale: O verbo expressa ficar ou manter-se calado. O condicional em português torna explícita a relação contextual de resultado, sem eliminar a alternativa mais estritamente temporal registrada em nota.
- source_word: וְאֶגְוָע
  choice: e morreria
  rationale: גוע designa expirar ou morrer. “Morreria” conserva a força direta e sombria da declaração e concorda com a construção condicional adotada.
