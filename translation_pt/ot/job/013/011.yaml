base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: pt
  text: Será que a sua majestade[a] não os aterrorizaria, e o pavor dele[b] não cairia sobre vocês?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua exaltação”. O termo hebraico pode indicar elevação, dignidade ou condição exaltada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o pavor que ele inspira”. A expressão hebraica é possessiva e pode referir-se ao temor causado por ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Será que... não
  rationale: Mantém a forma de pergunta retórica que espera resposta afirmativa e soa natural em português.
- source_word: שְׂאֵתוֹ
  choice: a sua majestade
  rationale: O substantivo pode indicar elevação, dignidade ou exaltação; no contexto, “majestade” expressa a grandeza elevada de Deus e forma um paralelo adequado com o pavor do segundo membro.
- source_word: תְּבַעֵת
  choice: aterrorizaria
  rationale: O Piel de בעת comunica causar terror intenso; a forma condicional ajusta-se naturalmente à pergunta retórica em português.
- source_word: אֶתְכֶם
  choice: os
  rationale: Representa o objeto direto masculino plural; no texto, refere-se aos interlocutores de Jó.
- source_word: וּפַחְדּוֹ
  choice: o pavor que ele inspira
  rationale: 'Explicita uma leitura natural do genitivo: o pavor provocado por Deus. A nota preserva a alternativa formalmente possessiva e a ambiguidade possível.'
- source_word: יִפֹּל עֲלֵיכֶם
  choice: cairia sobre vocês
  rationale: Preserva a imagem hebraica de algo avassalador que desce sobre alguém, com formulação clara no português moderno.
theological_decisions:
- issue: Sentido do sufixo possessivo em וּפַחְדּוֹ
  choice: o pavor que ele inspira
  alternative: o pavor dele
  rationale: O contexto favorece o temor provocado pela majestade de Deus, mas o hebraico possessivo admite uma formulação menos explícita; a alternativa é registrada em nota para não eliminar a tensão lexical.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A sintaxe interrogativa preserva a força retórica do hebraico; as notas registram alternativas lexicais genuínas.
