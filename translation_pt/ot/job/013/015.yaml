  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: pt
  text: Ainda que ele me mate[a], não esperarei; contudo, defenderei os meus caminhos diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução tradicional: “Ainda que ele me mate, esperarei nele”. Essa forma reflete uma leitura alternativa do hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Ainda que
  rationale: Neste contexto, introduz concessão enfática diante da possibilidade de Deus tirar a vida de Jó; a formulação é natural e digna em português.
- source_word: יִקְטְלֵנִי
  choice: ele me mate
  rationale: Traduz diretamente o verbo קטל, “matar”, sem acrescentar causa, intenção ou modo.
- source_word: לֹא אֲיַחֵל
  choice: não esperarei
  rationale: Segue a negação לֹא do texto massorético. Em português, “esperar” preserva adequadamente a amplitude de יחל, que pode envolver tanto aguardar como ter esperança.
- source_word: אַךְ
  choice: contudo
  rationale: 'Expressa a virada adversativa: mesmo sem esperar, Jó permanece decidido a apresentar sua defesa.'
- source_word: דְּרָכַי
  choice: os meus caminhos
  rationale: Mantém a imagem hebraica, que aqui abrange a conduta e o curso de vida de Jó.
- source_word: אֶל־פָּנָיו
  choice: diante dele
  rationale: Equivalente idiomático de “à sua face”, comunicando que Jó falará diretamente na presença de Deus.
- source_word: אוֹכִיחַ
  choice: defenderei
  rationale: No contexto forense de Jó, o hifil de יכח indica expor ou sustentar uma causa; “defenderei” comunica essa função jurídica com naturalidade.
theological_decisions:
- issue: Seguir a leitura massorética לֹא (“não”) ou a leitura tradicional לוֹ (“nele/para ele”)
  choice: 'Adoção no texto principal da leitura massorética: “não esperarei”'
  alternative: “Ainda que ele me mate, esperarei nele”
  rationale: O texto hebraico fornecido traz לֹא, “não”. A tradução principal respeita essa leitura sem eliminar a tensão entre a falta de expectativa e a determinação de Jó de defender sua conduta. A leitura tradicional, antiga e teologicamente significativa, é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem recorrer a vocabulário arcaico. “Esperarei” preserva deliberadamente a possível nuance de aguardar e de ter esperança.
