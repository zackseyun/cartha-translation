base_translation:
  language: en
  yaml_path: translation/ot/job/013/020.yaml
  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: pt
  text: 'Apenas não faças duas coisas comigo; então não me esconderei da tua presença:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Apenas
  rationale: Introduz uma limitação ao pedido de Jó; “Apenas” comunica naturalmente a força restritiva.
- source_word: שְׁתַּיִם
  choice: duas coisas
  rationale: O hebraico traz apenas o numeral feminino “duas”, sem substantivo expresso; “coisas” explicita de modo natural o referente, desenvolvido nos versículos seguintes.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: não faças ... comigo
  rationale: Mantém a construção ampla de עשה com עם sem antecipar ou restringir indevidamente as duas ações que serão especificadas.
- source_word: אָז
  choice: então
  rationale: Marca de forma concisa a consequência de Deus atender ao pedido.
- source_word: מִפָּנֶיךָ
  choice: da tua presença
  rationale: Expressa em português corrente o sentido idiomático de “de diante da tua face”, isto é, da presença de Deus.
- source_word: לֹא אֶסָּתֵר
  choice: não me esconderei
  rationale: 'O nifal é entendido reflexivamente ou intransitivamente: Jó afirma que não se ocultará nem recuará se as duas condições forem concedidas.'
theological_decisions:
- issue: Sentido de מִפָּנֶיךָ
  choice: da tua presença
  alternative: da tua face
  rationale: “Presença” comunica o idioma hebraico com clareza e evita uma expressão pouco natural em português, sem eliminar a ideia relacional de estar diante de Deus.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” coerente com a fala direta de Jó a Deus. A formulação preserva a estrutura do pedido e a relação de consequência indicada por אָז.
