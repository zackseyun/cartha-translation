base_translation:
  language: en
  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: pt
  text: Vocês mostrarão parcialidade em favor dele? Defenderão a causa de Deus?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantarão o rosto dele?”, expressão idiomática hebraica que significa agir com parcialidade ou favoritismo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pleitearão em favor de Deus?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Vocês mostrarão favoritismo por ele?
  rationale: A expressão idiomática, literalmente ligada a “levantar o rosto”, denota tratar alguém com parcialidade. “Mostrar favoritismo” comunica com clareza a acusação ética e preserva o pronome masculino singular.
- source_word: אִם
  choice: '?'
  rationale: Aqui introduz a segunda pergunta retórica paralela. Em português natural, a relação é transmitida pela justaposição de duas perguntas, sem a necessidade de traduzir mecanicamente por “se” ou “ou”.
- source_word: לָאֵל
  choice: de Deus
  rationale: A preposição ל indica benefício, interesse ou representação. Na expressão portuguesa “defender a causa de Deus”, o genitivo transmite naturalmente a ideia de agir em favor de Deus.
- source_word: תְּרִיבוּן
  choice: Defenderão a causa
  rationale: O verbo ריב pertence ao campo da disputa e da controvérsia, frequentemente com matiz forense. “Defender a causa” conserva esse caráter de advocacia sem limitar a cena a um procedimento jurídico formal.
theological_decisions:
- issue: Se Jó acusa os amigos de defender Deus com parcialidade
  choice: Duas perguntas retóricas acusam os amigos de favorecer Deus e assumir a defesa da causa dele.
  alternative: “Vocês levantarão o rosto dele? Pleitearão em favor de Deus?”
  rationale: 'O contexto é forense e polêmico: Jó censura os amigos por falarem em defesa de Deus de modo parcial. A tradução mantém a tensão do texto, sem sugerir que Deus necessite de defesa nem resolver a validade da acusação de Jó.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” explicita a segunda pessoa plural do hebraico. “Defender a causa” preserva o tom forense e é mais corrente do que “contender” neste contexto.
