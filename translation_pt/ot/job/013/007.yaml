base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: pt
  text: Será que vocês vão falar injustamente em defesa de Deus[a] e usar de engano em favor dele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor de Deus” ou “a Deus”; e, na segunda parte, de modo semelhante, “em favor dele” ou “a ele”. A preposição hebraica admite mais de um sentido, embora o contexto favoreça a ideia de falar em defesa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: em defesa de Deus
  rationale: A preposição לְ pode indicar destinatário, benefício ou representação. O contexto, especialmente Jó 13:8, favorece a ideia de que os amigos falam em defesa de Deus; a nota preserva as demais possibilidades.
- source_word: תְּדַבְּרוּ
  choice: Será que vocês vão falar
  rationale: O imperfeito em uma pergunta de censura é expresso naturalmente em português por “será que vocês vão falar”, mantendo o tom de desafio moral.
- source_word: עַוְלָה
  choice: injustamente
  rationale: O substantivo denota injustiça, mal ou perversidade. A forma adverbial produz português natural com “falar” e conserva a força ética do termo.
- source_word: וְלוֹ
  choice: em favor dele
  rationale: O pronome retoma Deus, e לְ recebe aqui a mesma leitura representativa ou favorável do primeiro membro, preservando o paralelismo.
- source_word: רְמִיָּה
  choice: engano
  rationale: O termo designa engano, fraude ou perfídia. “Engano” preserva o caráter abstrato do substantivo sem reduzi-lo apenas a mentiras verbalizadas.
theological_decisions:
- issue: Se Jó acusa os amigos de falar em defesa de Deus ou de dirigir palavras injustas a Deus
  choice: Jó os censura por falarem injustamente em defesa de Deus
  alternative: Jó os censura por falarem injustiça a Deus
  rationale: O contexto imediato apresenta os amigos como defensores parciais de Deus. A tradução principal explicita essa leitura contextual, enquanto a nota registra a ambiguidade legítima da preposição hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Será que” comunica a censura retórica sem arcaísmo; “usar de engano” permite conservar o substantivo abstrato רְמִיָּה de modo idiomático.
