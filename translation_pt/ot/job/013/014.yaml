lexical_decisions:
- source_word: עַל מָה
  choice: Por que eu tomaria
  rationale: A expressão introduz uma pergunta retórica sobre motivo ou propósito. O condicional em português transmite com naturalidade a força deliberativa do hebraico.
- source_word: אֶשָּׂא
  choice: tomaria
  rationale: נשא pode significar levantar, carregar ou tomar. Neste contexto idiomático, “tomaria” preserva a ação concreta e forma uma pergunta natural em português.
- source_word: בְשָׂרִי
  choice: a minha carne
  rationale: Mantém a imagem concreta e vívida de בשר, sem suavizá-la para “corpo”.
- source_word: בְשִׁנָּי
  choice: entre os dentes
  rationale: Embora a preposição possa ser vertida literalmente por “em” ou “com”, “entre os dentes” reproduz a imagem de modo idiomático e claro em português.
- source_word: וְנַפְשִׁי
  choice: a minha vida
  rationale: נפש pode indicar vida, alma ou o próprio ser. Aqui, em paralelo com a expressão de pôr algo nas mãos e expor-se ao perigo, “vida” comunica melhor o sentido contextual.
- source_word: אָשִׂים
  choice: colocaria
  rationale: שׂים significa pôr, colocar ou estabelecer. “Colocaria” acompanha naturalmente o condicional da pergunta retórica.
- source_word: בְכַפִּי
  choice: nas mãos
  rationale: כף designa a palma ou a mão. A expressão portuguesa corrente “pôr a vida nas mãos” preserva a metáfora de arriscar a própria vida; o plural é idiomático em português.
