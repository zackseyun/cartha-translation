translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva o paralelismo entre visão e audição, mas emprega o plural idiomático “meus olhos/meus ouvidos”. O marcador da nota aparece no texto principal.
