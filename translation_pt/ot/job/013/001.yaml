  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: pt
  text: Vejam[a], meu olho viu tudo isso; meu ouvido ouviu e compreendeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis” ou “De fato”. O hebraico introduz uma afirmação enfática e chama a atenção para ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Vejam
  rationale: Funciona como uma chamada enfática à atenção dos interlocutores de Jó. O plural é natural no contexto discursivo e evita o tom arcaico de “eis”.
- source_word: כֹּל
  choice: tudo isso
  rationale: Embora כֹּל signifique literalmente “tudo”, o demonstrativo explicita de modo natural a referência resumida aos assuntos já discutidos.
- source_word: רָאֲתָה עֵינִי
  choice: meus olhos viram
  rationale: Conserva a imagem corporal e o paralelismo hebraico, usando o plural idiomático em português em vez do singular literal “meu olho viu”.
- source_word: שָׁמְעָה אָזְנִי
  choice: meus ouvidos ouviram
  rationale: Mantém a imagem e o paralelismo com os olhos, em formulação natural no português moderno.
- source_word: וַתָּבֶן לָהּ
  choice: e compreenderam
  rationale: O verbo בין expressa compreensão ou discernimento. A forma feminina singular retoma naturalmente אָזְנִי, “meu ouvido”; em português, o plural concorda com a formulação idiomática “meus ouvidos”. A construção לָהּ é idiomática e não precisa ser reproduzida literalmente.
