  text: וּ֭/קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑ה אֽוֹ אֲ֝דַבֵּ֗ר וַ/הֲשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: pt
  text: Então chama[a], e eu responderei; ou deixa-me falar, e responde-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Chama, e eu responderei; ou eu falarei, e responde-me.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: Então chama
  rationale: O imperativo qal masculino singular de קרא apresenta a primeira alternativa do desafio de Jó. A conjunção é vertida por “Então” para expressar com naturalidade a sequência implícita no contexto; a forma mais estrita “Chama” também é possível.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: O pronome independente de primeira pessoa acrescenta ênfase. O sujeito explícito “eu” preserva essa ênfase sem tornar a frase pesada.
- source_word: אֶעֱנֶה
  choice: responderei
  rationale: 'O imperfeito qal de primeira pessoa singular de ענה significa “responder”. O futuro em português comunica adequadamente a disposição de Jó: se Deus chamar, ele responderá.'
- source_word: אוֹ
  choice: ou
  rationale: Partícula disjuntiva simples que introduz a disposição alternativa do diálogo.
- source_word: אֲדַבֵּר
  choice: deixa-me falar
  rationale: 'Embora seja formalmente um imperfeito piel de primeira pessoa singular de דבר, neste paralelismo funciona naturalmente como proposta ou pedido: “deixa-me falar”.'
- source_word: וַהֲשִׁיבֵנִי
  choice: e responde-me
  rationale: Imperativo hifil masculino singular de שוב com sufixo de primeira pessoa. Neste uso, significa dar resposta. “Responde-me” mantém o tom direto e recíproco do desafio.
theological_decisions: []
translation_notes:
  register: Português atual, digno e direto, com construção amplamente compreensível e boa legibilidade brasileira. O tratamento verbal no singular preserva o discurso direto de Jó a Deus. A ênclise em “deixa-me” e “responde-me” mantém um registro literário natural.
