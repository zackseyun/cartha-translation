  source_fidelity: A intensificação de שִׁמְעוּ שָׁמוֹעַ está bem traduzida por «Escutem atentamente». Contudo, מִלָּתִי está no singular («minha palavra»), não no plural. Além disso, «chegue aos seus ouvidos» transforma a segunda parte em desejo de que a declaração alcance os ouvintes, ao passo que o hebraico mantém o apelo para que eles a ouçam/prestem atenção a ela.
  naturalness: «Escutem atentamente a minha palavra e prestem ouvidos à minha declaração» é natural em português contemporâneo, conserva o tom solene e mantém o paralelismo apelativo do verso. «Prestem ouvidos» comunica idiomaticamente a imagem de בְּאָזְנֵיכֶם.
  terminology: «Declaração» é uma opção adequada e formal para וַאֲחֲוָתִי. A nota pode oferecer «minha fala» e «minha explicação» como alternativas, sem apresentar «exposição», que é possível, mas menos direta neste contexto.
