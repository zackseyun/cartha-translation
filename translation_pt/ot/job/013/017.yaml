    issue: «Chegue aos seus ouvidos» enfraquece o apelo imperativo
    rationale: A construção introduz uma nuance de resultado ou desejo. Uma segunda exortação, «prestem ouvidos», representa melhor a continuidade sintática e retórica do hebraico.
