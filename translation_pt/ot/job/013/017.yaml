  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: pt
  text: 'Escutem atentamente a minha palavra

    e prestem ouvidos à minha declaração.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha fala” ou “minha explicação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Escutem com atenção
  rationale: O verbo finito seguido do infinitivo absoluto intensifica a ordem. A expressão idiomática comunica essa ênfase com naturalidade em português.
- source_word: מִלָּתִי
  choice: as minhas palavras
  rationale: מִלָּה pode significar “palavra” ou “fala”. O plural idiomático em português refere-se naturalmente ao que Jó está dizendo, sem alterar o sentido coletivo do singular hebraico.
- source_word: וַאֲחֲוָתִי
  choice: a minha declaração
  rationale: O substantivo derivado de חוה designa aquilo que é exposto ou declarado. “Declaração” preserva o tom deliberado e formal, sem impor o sentido mais interpretativo de “explicação”.
- source_word: בְּאָזְנֵיכֶם
  choice: chegue aos seus ouvidos
  rationale: A formulação conserva a imagem concreta dos “ouvidos” presente no hebraico, mas a integra numa construção portuguesa natural e compatível com o pedido enfático de Jó.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural. A primeira linha traduz idiomaticamente a intensificação hebraica; a segunda preserva a imagem dos ouvidos sem recorrer à construção pouco natural “esteja em seus ouvidos”.
