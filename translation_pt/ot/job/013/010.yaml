base_translation:
  language: en
  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: pt
  text: Ele certamente os repreenderá, se às escondidas vocês mostrarem parcialidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantarem rostos”, expressão hebraica que significa favorecer alguém ou mostrar parcialidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: certamente os repreenderá
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação. “Certamente” preserva essa ênfase, e “repreenderá” comunica a censura divina no contexto.
- source_word: אֶתְכֶם
  choice: os
  rationale: O pronome objeto está na segunda pessoa masculina plural e se refere coletivamente aos amigos de Jó; “os” o representa de forma natural.
- source_word: אִם
  choice: se
  rationale: Mantém o caráter condicional da advertência, sem apresentar a ação como fato já consumado.
- source_word: בַּסֵּתֶר
  choice: às escondidas
  rationale: Expressa uma ação praticada de modo oculto; é uma formulação natural em português e preserva a ideia adverbial do hebraico.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: vocês mostrarem parcialidade
  rationale: Traduz o sentido do idioma hebraico literalmente relacionado a “levantar rostos”, que denota favorecer alguém ou agir com parcialidade, especialmente em contexto judicial.
theological_decisions:
- issue: Sentido do idioma נשׂא פנים
  choice: mostrarem parcialidade
  alternative: favorecerem alguém; aceitarem pessoas
  rationale: A expressão aponta para tratamento tendencioso, aqui na defesa que os amigos fazem de Deus. “Mostrar parcialidade” conserva a força ética e judicial sem introduzir interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem natural para leitores brasileiros. O plural explícito “vocês” evita ambiguidade, e a nota preserva a imagem literal do idioma hebraico.
