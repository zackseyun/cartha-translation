  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: pt
  text: E ele se desfaz como coisa podre[a], como roupa comida pela traça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele se deteriora como podridão, como roupa comida pela traça”.'
    reason: Alternativa lexical e sintática que conserva de modo mais formal o substantivo רָקָב e a conjunção inicial.
lexical_decisions:
- source_word: וְהוּא
  choice: enquanto ele
  rationale: A conjunção com o pronome independente retoma o sujeito no contexto. “Enquanto ele” liga naturalmente a imagem aos verbos e mantém a relação contextual sem impor um contraste.
- source_word: כְּרָקָב
  choice: como coisa podre
  rationale: רָקָב designa podridão ou decomposição. A formulação concreta preserva a força visual da comparação e soa mais natural em português do que “como podridão”.
- source_word: יִבְלֶה
  choice: se desfaz
  rationale: בלה expressa desgaste ou deterioração progressiva. “Se desfaz” funciona tanto para a decomposição corporal quanto para a imagem paralela da roupa consumida.
- source_word: כְּבֶגֶד
  choice: como roupa
  rationale: בֶּגֶד é um termo geral para veste ou roupa. “Roupa” é claro, natural e amplamente compreensível, preservando o singular coletivo da imagem.
- source_word: אֲכָלוֹ
  choice: comida pela
  rationale: A forma de אכל com sufixo retoma a roupa como objeto consumido. A construção passiva “comida pela” reproduz com naturalidade o resultado expresso no hebraico.
- source_word: עָשׁ
  choice: traça
  rationale: O substantivo hebraico está no singular. O português também emprega naturalmente “a traça” em sentido genérico, permitindo preservar o número da fonte.
