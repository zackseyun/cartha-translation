  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: pt
  text: Quantas são as minhas iniquidades e os meus pecados?[a] Faze-me saber a minha transgressão[b] e o meu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quão grandes são as minhas iniquidades e os meus pecados?” O interrogativo hebraico pode perguntar tanto pela quantidade quanto pela extensão ou gravidade; o texto principal preserva o sentido quantitativo mais direto.'
    reason: lexical_alternative
  - marker: b
    text: “Transgressão” traduz פֶּשַׁע, termo que também pode ter o sentido de “rebeldia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Quantas são as minhas
  rationale: A construção interrogativa com לִי pergunta pela quantidade ou extensão. O plural dos substantivos favorece a leitura quantitativa direta, preservada em português natural.
- source_word: עֲוֺנוֹת
  choice: iniquidades
  rationale: עָוֹן designa culpa ou falta moral grave. “Iniquidades” conserva esse peso e mantém distinção em relação a חַטָּאוֹת.
- source_word: וְחַטָּאוֹת
  choice: e os meus pecados
  rationale: “Pecados” é a tradução direta e clara do plural de חַטָּאת; a repetição do possessivo soa natural em português e explicita a relação indicada por לִי.
- source_word: פִּשְׁעִי
  choice: a minha transgressão
  rationale: פֶּשַׁע indica transgressão e pode incluir a nuance de rebeldia deliberada. “Transgressão” preserva o peso do termo sem tornar essa nuance obrigatória.
- source_word: וְחַטָּאתִי
  choice: e o meu pecado
  rationale: A forma singular com sufixo de primeira pessoa é vertida diretamente, preservando o paralelismo lexical com “pecados” na primeira pergunta.
- source_word: הֹדִיעֵנִי
  choice: Faz-me conhecer
  rationale: 'O hifil de ידע tem sentido causativo: fazer saber ou tornar conhecido. “Faz-me conhecer” conserva essa força e permanece claro em português moderno.'
