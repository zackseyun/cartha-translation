base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: pt
  text: Mas eu falaria ao Todo-Poderoso e desejo argumentar com Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “discutir com Deus”, “arrazoar com Deus” ou “defender minha causa diante de Deus”. O verbo hebraico pode ter sentido forense: argumentar, demonstrar ou contestar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Mas
  rationale: Marca o forte contraste com a fala anterior dirigida aos amigos de Jó, em português natural.
- source_word: אֲנִי
  choice: eu
  rationale: Conserva o pronome explícito e enfático do hebraico.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: quero falar com o Todo-Poderoso
  rationale: O imperfeito expressa aqui intenção ou vontade; 'quero falar' comunica essa nuance com naturalidade. 'Todo-Poderoso' traduz o título שַׁדַּי.
- source_word: וְהוֹכֵחַ
  choice: apresentar meus argumentos
  rationale: O infinitivo absoluto ligado a אֶחְפָּץ tem sentido forense de argumentar, debater ou expor uma causa; a formulação escolhida preserva esse campo sem sugerir mera repreensão.
- source_word: אֶל אֵל
  choice: diante de Deus
  rationale: A preposição pode indicar a pessoa a quem os argumentos são dirigidos; 'diante de' torna natural em português o cenário forense possível.
- source_word: אֶחְפָּץ
  choice: desejo
  rationale: Expressa vontade intensa e mantém o tom solene do verso.
theological_decisions:
- issue: Tradução dos títulos divinos שַׁדַּי e אֵל
  choice: Todo-Poderoso ... Deus
  alternative: Shaddai ... Deus; Todo-Poderoso ... Poderoso
  rationale: Preserva os dois termos distintos em paralelo, traduzindo o título e evitando harmonização ou acréscimo doutrinário.
- issue: Natureza da fala de Jó perante Deus
  choice: apresentar meus argumentos diante de Deus
  alternative: discutir com Deus; arrazoar com Deus; defender minha causa diante de Deus
  rationale: Mantém a tensão de Jó querer confrontar Deus em um quadro potencialmente judicial, sem decidir se ele apenas argumenta, debate ou formalmente apresenta uma causa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Quero falar' evita o lusitanismo ou a rigidez de 'falaria' e expressa a intenção volitiva; a nota preserva a amplitude forense do verbo hebraico.
