  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: pt
  text: Quem dera vocês ficassem totalmente calados — isso seria sabedoria para vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática introduz um desejo enfático, não uma pergunta literal. “Quem dera” é natural em português e preserva a força optativa.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: vocês ficassem totalmente calados
  rationale: O infinitivo absoluto seguido do verbo finito da mesma raiz intensifica o silêncio. “Totalmente” comunica essa ênfase sem tornar a frase artificial.
- source_word: וּתְהִי
  choice: isso seria
  rationale: O verbo feminino singular retoma a ação ou situação anterior — o silêncio dos interlocutores. O pronome “isso” torna essa referência natural em português sem definir além do necessário a sintaxe hebraica.
- source_word: לָכֶם
  choice: para vocês
  rationale: A preposição indica relação ou benefício; “para vocês” reproduz naturalmente esse valor.
- source_word: לְחָכְמָה
  choice: sabedoria
  rationale: Mantém o sentido direto do substantivo חָכְמָה. Na construção portuguesa “isso seria sabedoria para vocês”, conserva-se também a formulação incisiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” explicita o plural hebraico e evita a marca regional de “vós”. O travessão representa a passagem enfática do desejo à avaliação resultante.
