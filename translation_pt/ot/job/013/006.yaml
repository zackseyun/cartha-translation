base_translation:
  language: en
  yaml_path: translation/ot/job/013/006.yaml
  text: Please hear my argument[b][a], and listen to the pleadings of my lips.
translation:
  language: pt
  text: Ouçam, por favor, a minha argumentação[a] e prestem atenção às contestações dos meus lábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha repreensão”; o termo hebraico pode indicar correção, censura ou uma argumentação fundamentada.
    reason: lexical_alternative
  - marker: b
    text: Ou “às disputas dos meus lábios”; a expressão hebraica tem sentido forense de controvérsia ou defesa verbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Ouçam, por favor
  rationale: O imperativo plural convoca os interlocutores de Jó a escutar, enquanto נָא suaviza o pedido; a formulação é natural em português e mantém o tom de súplica.
- source_word: תוֹכַחְתִּי
  choice: a minha argumentação
  rationale: תּוֹכַחַת pode indicar repreensão, correção ou exposição argumentativa. No contexto forense de Jó, “argumentação” comunica melhor a apresentação de seu caso sem restringir o termo a uma censura moral.
- source_word: וְרִבוֹת
  choice: e às contestações
  rationale: רִיבוֹת pertence ao campo semântico de disputa, controvérsia e pleito. “Contestações” conserva a tonalidade forense e verbal do contexto.
- source_word: שְׂפָתַי
  choice: dos meus lábios
  rationale: Preserva a imagem concreta do hebraico, em vez de a reduzir simplesmente a “minhas palavras”.
- source_word: הַקְשִׁיבוּ
  choice: prestem atenção
  rationale: O verbo pede escuta atenta. A expressão diferencia este segundo imperativo de “ouçam” e reproduz a intensificação no paralelismo poético.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo entre “ouçam” e “prestem atenção”, bem como a imagem hebraica dos “lábios” e a ambiguidade jurídico-corretiva dos substantivos.
