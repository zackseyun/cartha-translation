  text: הִנֵּה נָ֭א עָרַ֣כְתִּי מִשְׁפָּ֑ט יָ֝דַ֗עְתִּי כִּֽי אֲנִ֥י אֶצְדָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/018.yaml
  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: pt
  text: 'Vejam: preparei a minha causa; sei que serei declarado justo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficará provado que tenho razão”. O verbo hebraico é forense e indica ser reconhecido ou declarado como estando com a razão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Vejam
  rationale: A combinação chama enfaticamente a atenção para o que Jó está prestes a afirmar. “Vejam” é natural e atual, enquanto os dois-pontos comunicam a transição enfática; נָא acrescenta ênfase ou imediatismo, sem exigir aqui um “por favor”.
- source_word: עָרַכְתִּי
  choice: já preparei
  rationale: ערך significa ordenar ou dispor. No contexto judicial, “preparei” comunica de modo idiomático que Jó organizou sua argumentação; “já” reforça o aspecto consumado e a prontidão expressa no contexto.
- source_word: מִשְׁפָּט
  choice: a minha causa
  rationale: 'Aqui o substantivo tem sentido forense: a causa ou pleito que Jó pretende apresentar. O possessivo, embora não esteja marcado no substantivo hebraico, é exigido naturalmente pelo verbo na primeira pessoa e pelo contexto.'
- source_word: יָדַעְתִּי כִּי
  choice: sei que
  rationale: O perfeito de ידע expressa uma convicção estabelecida, e כִּי introduz o conteúdo dessa certeza.
- source_word: אֲנִי אֶצְדָּק
  choice: serei declarado justo
  rationale: O verbo צדק, nesta moldura judicial, indica que Jó será reconhecido ou declarado como estando com a razão. A formulação conserva o sentido forense e a ênfase do pronome explícito, sem transformar a fala em uma formulação doutrinária posterior.
theological_decisions:
- issue: Sentido forense da afirmação de Jó
  choice: “serei declarado justo” como resultado favorável em sua causa
  alternative: “serei justificado” ou “ficará provado que tenho razão”
  rationale: A linguagem imediata é a de um litígio. O texto expressa a confiança de Jó em obter um veredito que reconheça sua razão, não uma exposição técnica de uma doutrina posterior da justificação. A nota preserva uma alternativa portuguesa clara e idiomática.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vejam” evita o arcaísmo de “eis” e mantém a convocação enfática; “causa” sustenta a imagem judicial. O marcador [a] aparece no texto principal e sua nota explicita a alternativa lexical sem resolver além do necessário a tensão da declaração de Jó.
