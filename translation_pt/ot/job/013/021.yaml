  text: כַּ֭פְּ/ךָ מֵ/עָלַ֣/י הַרְחַ֑ק וְ֝/אֵ֥מָתְ/ךָ֗ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: pt
  text: Afasta de mim a tua mão[a], e que o teu pavor[b] não me apavore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tira de sobre mim a tua mão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o teu terror”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: a tua mão
  rationale: כַּף designa literalmente a palma ou a mão; aqui, “mão” preserva de modo natural a imagem concreta da ação ou pressão divina.
- source_word: מֵעָלַי הַרְחַק
  choice: Afasta de mim
  rationale: O imperativo causativo de רחק, combinado com מֵעָלַי, pede que a mão seja removida de sobre Jó e mantida longe; “afasta de mim” expressa isso em português corrente sem perder a força do imperativo.
- source_word: אֵמָתְךָ
  choice: o teu terror
  rationale: אֵימָה indica terror ou pavor. “O teu terror” mantém o substantivo e o sufixo de segunda pessoa, sem reduzir a expressão apenas ao medo subjetivo de Jó.
- source_word: אַל תְּבַעֲתַנִּי
  choice: que ... não me apavore
  rationale: אַל com a forma verbal expressa proibição ou desejo negativo; בעת significa aterrorizar, apavorar ou deixar consternado. A construção portuguesa preserva o terror como sujeito do verbo.
theological_decisions:
- issue: Linguagem antropomórfica a respeito de Deus (“a tua mão”)
  choice: Manter literalmente “a tua mão”.
  alternative: o teu poder; o teu golpe
  rationale: O hebraico emprega uma imagem corporal concreta. Mantê-la preserva a força poética e evita decidir se a referência específica é ao poder, à aflição ou à disciplina de Deus.
- issue: Sentido de אֵמָתְךָ
  choice: Traduzir como “o teu terror”.
  alternative: o pavor de ti; o temor que inspiras
  rationale: A formulação conserva a ambiguidade entre o terror associado à presença de Deus e o efeito aterrorizante que ele produz, sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética é natural, a imagem da mão divina é preservada e o paralelismo entre afastar a mão e não ser apavorado pelo terror de Deus permanece claro.
