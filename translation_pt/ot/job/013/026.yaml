  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: pt
  text: Pois escreves coisas amargas contra mim[a] e me fazes herdar as iniquidades da minha juventude[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «decretas coisas amargas contra mim»; literalmente, o hebraico diz «escreves coisas amargas contra mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «me fazes carregar a culpa pelas iniquidades da minha juventude» ou «o castigo pelas iniquidades da minha juventude». A palavra hebraica pode indicar a iniquidade, a culpa ou sua consequência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Jó e mantém a ligação argumentativa com o contexto de forma natural em português.
- source_word: תִכְתֹּב עָלַי
  choice: escreves ... contra mim
  rationale: Preserva o sentido literal de כתב, «escrever», e o valor adversativo de עַל, sem restringir a expressão a uma acusação ou decreto formal.
- source_word: מְרֹרוֹת
  choice: coisas amargas
  rationale: Expressa o plural substantivado de modo claro e preserva a abertura semântica entre acusações, decretos e experiências penosas.
- source_word: וְתוֹרִישֵׁנִי
  choice: e me fazes herdar
  rationale: Mantém a força causativa do hifil de ירשׁ e a metáfora da herança.
- source_word: עֲוֺנוֹת
  choice: as iniquidades
  rationale: Conserva um termo amplo que pode abranger os atos perversos, a culpa e suas consequências, sem resolver a ambiguidade do hebraico.
- source_word: נְעוּרָי
  choice: da minha juventude
  rationale: Reproduz diretamente a construção com sufixo de primeira pessoa e soa natural em português.
theological_decisions:
- issue: Sentido de עֲוֺנוֹת no contexto
  choice: iniquidades da juventude, com possível implicação de culpa ou consequências
  alternative: a culpa ou o castigo pelas iniquidades da juventude
  rationale: O substantivo hebraico pode indicar a iniquidade, a culpa decorrente dela ou sua consequência punitiva. O texto principal mantém essa tensão, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na segunda pessoa do singular em coerência com o discurso direto de Jó a Deus. A formulação conserva as metáforas hebraicas de escrever e herdar.
