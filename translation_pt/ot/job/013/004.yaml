  text: וְֽ/אוּלָ֗ם אַתֶּ֥ם טֹֽפְלֵי שָׁ֑קֶר רֹפְאֵ֖י אֱלִ֣ל כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: pt
  text: Mas vocês são rebocadores de mentiras[a]; todos vocês são médicos inúteis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que espalham falsidade” ou “fabricantes de mentiras”. O verbo hebraico evoca a aplicação de uma camada ou revestimento, sugerindo que eles encobrem a realidade com mentiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “médicos que não servem para nada”. A expressão hebraica os descreve como curadores sem valor ou eficácia. “Médicos-idólatras” é uma alternativa menos provável, baseada em outro sentido possível do substantivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Marca o contraste enfático com a fala anterior de Jó de forma natural no português atual.
- source_word: אַתֶּם
  choice: vocês
  rationale: Expressa diretamente o pronome masculino plural, com ampla legibilidade brasileira e compreensão internacional.
- source_word: טֹפְלֵי
  choice: rebocadores de
  rationale: Preserva a imagem concreta de espalhar ou aplicar uma camada, em vez de reduzi-la à interpretação mais abstrata de inventar ou falsificar.
- source_word: שָׁקֶר
  choice: mentiras
  rationale: O plural idiomático em português comunica o sentido coletivo do singular hebraico e combina naturalmente com a acusação figurada.
- source_word: רֹפְאֵי
  choice: médicos
  rationale: Mantém a metáfora nominal de pessoas que deveriam curar, mas fracassam como conselheiros.
- source_word: אֱלִל
  choice: inúteis
  rationale: Neste contexto, o termo indica nulidade, falta de valor ou eficácia; qualifica os médicos como incapazes de trazer cura.
- source_word: כֻּלְּכֶם
  choice: todos vocês
  rationale: Conserva a abrangência enfática da expressão hebraica e sua referência a todos os interlocutores de Jó.
