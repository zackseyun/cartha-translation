  register: Português moderno, digno e direto, com uso de “vocês” para clareza ampla. A formulação deliberadamente incomum “rebocadores de mentiras” conserva a metáfora concreta e a força poética do hebraico; as notas oferecem equivalentes mais interpretativos.
