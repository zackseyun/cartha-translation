  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: pt
  text: Quando Eliú viu que os três homens não tinham resposta[a], sua ira se acendeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não havia resposta na boca dos três homens”, expressão que significa que eles não tinham resposta para dar.'
