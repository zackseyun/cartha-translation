lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando ... viu
  rationale: O wayyiqtol dá continuidade à narrativa; a oração temporal com “Quando” expressa naturalmente a sequência que culmina na reação de Eliú.
- source_word: אֱלִיהוּא
  choice: Eliú
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כִּי
  choice: que
  rationale: 'Introduz aqui o conteúdo percebido por Eliú: ele viu que não havia resposta.'
- source_word: אֵין מַעֲנֶה
  choice: não tinham resposta
  rationale: Expressa em português corrente a ausência de uma resposta que os três homens pudessem dar, de acordo com o contexto do diálogo.
- source_word: בְּפִי
  choice: não tinham resposta
  rationale: A expressão literal “na boca de” é um idiomatismo hebraico. A tradução no corpo do texto comunica seu sentido natural, enquanto a nota preserva a imagem concreta do original.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: os três homens
  rationale: Tradução direta e natural da expressão nominal contada.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira se acendeu
  rationale: Preserva a metáfora hebraica de ardor e soa digna e idiomática em português, sem recorrer ao literalismo opaco de “seu nariz ardeu”.
