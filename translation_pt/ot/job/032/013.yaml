  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: pt
  text: 'Não venham dizer: “Encontramos a sabedoria; Deus o afugentará[a], não um ser humano.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus o refutará, não um ser humano”, ou “Deus o derrotará, não um ser humano”. O verbo hebraico geralmente significa “afugentar”, “impelir” ou “dispersar”, mas aqui pode se referir de modo mais amplo a derrotar ou refutar Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Não venham
  rationale: Expressa em português natural a advertência contra uma possível alegação, preservando a força preventiva de פֶּן.
- source_word: תֹּאמְרוּ
  choice: dizer
  rationale: Representa a segunda pessoa do plural no discurso dirigido aos amigos de Jó; a locução “não venham dizer” comunica bem o sentido prospectivo.
- source_word: מָצָאנוּ חָכְמָה
  choice: Encontramos a sabedoria
  rationale: Mantém a afirmação de resultado do perfeito hebraico e conserva o termo central “sabedoria” sem paráfrase.
- source_word: אֵל
  choice: Deus
  rationale: No contexto, designa Deus e estabelece o contraste explícito com um agente humano.
- source_word: יִדְּפֶנּוּ
  choice: o afugentará
  rationale: Preserva a imagem concreta do verbo נדף, que normalmente significa impelir, dispersar ou afugentar, sem eliminar a possibilidade contextual de derrotar ou refutar Jó.
- source_word: לֹא אִישׁ
  choice: não o ser humano
  rationale: Comunica o contraste genérico entre Deus e um agente humano sem sugerir que a oposição diga respeito exclusivamente a um homem do sexo masculino.
theological_decisions:
- issue: Sentido de אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Deus o afugentará, não o ser humano
  alternative: Deus o refutará, não o ser humano; Deus o derrotará, não o ser humano
  rationale: A tradução principal conserva a imagem lexical de נדף, enquanto a nota registra sentidos contextuais possíveis sem resolver indevidamente a ambiguidade.
- issue: Valor genérico de אִישׁ no contraste com Deus
  choice: ser humano
  alternative: homem
  rationale: O referente é qualquer agente humano em oposição a Deus; “ser humano” torna esse sentido genérico claro no português atual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não venham dizer” reproduz de forma idiomática a advertência de abertura; “ser humano” preserva o contraste genérico com Deus.
