base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: pt
  text: Então aqueles três homens pararam de responder a Jó[a], porque ele era justo aos seus próprios olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra tradição textual: “porque ele era justo aos olhos deles”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: pararam
  rationale: O verbo שבת, seguido aqui de um infinitivo com מִן, expressa cessação. “Pararam de” é natural em português atual e preserva claramente a ideia de deixar de responder.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: aqueles três homens
  rationale: A expressão identifica os três homens já presentes no contexto discursivo. “Aqueles” funciona naturalmente como referência retrospectiva em português, enquanto “homens” mantém o gênero e os referentes do hebraico.
- source_word: מֵעֲנוֹת
  choice: de responder
  rationale: O infinitivo de ענה significa responder ou replicar. Depois de “pararam”, a construção idiomática portuguesa exige “de responder”.
- source_word: אֶת אִיּוֹב
  choice: a Jó
  rationale: את marca o objeto direto e não recebe tradução independente. Em português, “responder a alguém” pede a preposição “a”; o nome próprio é vertido na forma tradicional “Jó”.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual os três homens deixaram de responder. “Porque” é claro e corrente.
- source_word: צַדִּיק
  choice: justo
  rationale: צַדִּיק possui força moral e judicial. “Justo” é a correspondência bíblica natural em português e, nesta construção, evita tornar a frase excessivamente pesada.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: O sufixo no texto hebraico fornecido é masculino singular. A expressão idiomática “aos seus próprios olhos” explicita naturalmente o caráter reflexivo da avaliação sem afirmar que ela era objetivamente correta.
theological_decisions:
- issue: Se Jó é declarado objetivamente justo ou apenas justo segundo sua própria avaliação
  choice: “ele era justo aos seus próprios olhos”
  alternative: “ele era justo aos olhos deles”
  rationale: A forma hebraica fornecida traz sufixo singular, “seus olhos”, referindo-se a Jó. A tradução conserva a tensão narrativa e não transforma a autoavaliação de Jó em veredito objetivo. A leitura plural de outra tradição textual é preservada em nota.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas usa construções naturais: “pararam de responder” e “aos seus próprios olhos”. O marcador [a] aparece imediatamente após “Jó”, em correspondência com a nota da variante textual.'
