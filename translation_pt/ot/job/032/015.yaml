  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: pt
  text: Eles ficaram consternados[a]; já não respondem; as palavras se afastaram deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram arrasados” ou “ficaram confusos”; o verbo hebraico pode indicar estar quebrantado ou consternado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as palavras se afastaram deles”, isto é, eles não têm mais nada a dizer.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: ficaram consternados
  rationale: O verbo חתת pode expressar estar quebrantado, aterrorizado ou consternado. No contexto, descreve o colapso retórico dos amigos de Jó diante da discussão; “consternados” comunica de modo natural tanto o abalo quanto o silêncio resultante.
- source_word: עָנוּ
  choice: respondem
  rationale: ענה, neste contexto de debate, significa responder ou replicar. “Respondem” é corrente e se ajusta ao discurso de Eliú.
- source_word: לֹא ... עוֹד
  choice: já não
  rationale: Com a negação, עוֹד indica uma ação que deixou de continuar. “Já não” expressa isso de forma idiomática e concisa.
- source_word: הֶעְתִּיקוּ
  choice: se afastaram
  rationale: O hifil de עתק pode significar mover, retirar ou afastar. Com “palavras” como sujeito e מֵהֶם indicando separação, “se afastaram” preserva a personificação vívida do hebraico.
- source_word: מֵהֶם
  choice: deles
  rationale: 'A preposição מן marca separação: as palavras se afastaram dos amigos de Jó.'
- source_word: מִלִּים
  choice: as palavras
  rationale: Mantém o sentido básico do substantivo e a imagem hebraica, sem substituir a expressão pela explicação contextual “não têm mais nada a dizer”.
