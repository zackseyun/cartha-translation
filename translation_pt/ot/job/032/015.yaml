translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção conserva o paralelismo e a personificação do hebraico. O pretérito em “ficaram” apresenta o estado resultante, enquanto “já não respondem” torna atual o silêncio observado por Eliú.
