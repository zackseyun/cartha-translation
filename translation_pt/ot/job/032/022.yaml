base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: pt
  text: Pois não sei adular[a]; se o fizesse, logo o meu Criador me levaria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dirigir-me a alguém com títulos lisonjeiros”. O verbo hebraico pode se referir a tratar alguém por títulos honoríficos de modo adulador ou parcial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me arrebataria”. O hebraico não diz explicitamente “me mataria”, embora possa estar implícita uma remoção em juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da recusa de Eliú em agir com parcialidade, ligando naturalmente este versículo ao anterior.
- source_word: לֹא יָדַעְתִּי
  choice: não sei
  rationale: Com o verbo seguinte, expressa falta de habilidade ou prática; o presente comunica bem o sentido contextual.
- source_word: אֲכַנֶּה
  choice: adular
  rationale: No piel e neste contexto, indica dirigir-se a alguém com títulos ou palavras lisonjeiras para favorecê-lo; “adular” é claro, conciso e atual.
- source_word: כִּמְעַט
  choice: logo
  rationale: Neste aviso, indica uma consequência iminente; “logo” preserva naturalmente o valor temporal.
- source_word: יִשָּׂאֵנִי
  choice: me levaria
  rationale: נשא pode significar levantar, carregar ou levar. Aqui sugere remoção sob juízo sem explicitar que se trate de morte.
- source_word: עֹשֵׂנִי
  choice: meu Criador
  rationale: O particípio significa literalmente “aquele que me fez”. “Meu Criador” é natural e preserva a relação pessoal entre criatura e Criador.
theological_decisions:
- issue: Natureza da ação divina ameaçada
  choice: logo o meu Criador me levaria
  alternative: logo o meu Criador me mataria
  rationale: O verbo hebraico נשא não explicita a morte. A formulação escolhida mantém a ideia de remoção em juízo sem tornar a consequência mais específica do que o texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Pois” mantém a ligação argumentativa; “se o fizesse” explicita apenas a relação condicional implícita entre as duas orações. Os marcadores aparecem junto aos termos a que se referem.
