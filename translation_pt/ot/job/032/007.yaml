base_translation:
  language: en
  yaml_path: translation/ot/job/032/007.yaml
  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: pt
  text: 'Eu disse[a]: “Os dias devem falar, e muitos anos devem dar a conhecer a sabedoria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu pensei: ‘A idade deve falar, e muitos anos devem dar a conhecer a sabedoria.’” O hebraico usa “dias” e “muitos anos” metonimicamente para a idade avançada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu dizia
  rationale: O qal perfeito na primeira pessoa do singular significa literalmente “eu disse”. No contexto, Eliú recorda a expectativa que vinha mantendo; o imperfeito português “eu dizia” introduz essa perspectiva anterior com naturalidade. “Eu pensei” explicita o sentido contextual, mas se afasta mais do verbo hebraico.
- source_word: יָמִים
  choice: Os dias
  rationale: Mantém a imagem poética e a metonímia hebraica, na qual “dias” representa idade avançada ou pessoas idosas, sem resolver silenciosamente a figura.
- source_word: יְדַבֵּרוּ
  choice: devem falar
  rationale: O piel imperfeito expressa aqui a expectativa de Eliú sobre quem convém que fale. “Devem falar” comunica essa expectativa melhor do que uma simples previsão futura.
- source_word: וְרֹב שָׁנִים
  choice: e os muitos anos
  rationale: Reproduz o paralelismo concreto com “os dias” e preserva a personificação poética. O artigo dá naturalidade em português à expressão personificada.
- source_word: יֹדִיעוּ
  choice: devem revelar
  rationale: O hiphil de ידע significa “fazer saber, dar a conhecer”. “Revelar” conserva o sentido causativo e resulta natural com “sabedoria”; “ensinar” seria mais interpretativo.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: Traduz diretamente o substantivo abstrato e preserva o vocabulário temático do livro.
