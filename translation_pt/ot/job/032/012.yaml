  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: pt
  text: Eu lhes prestei muita atenção[a], e eis que, entre vocês, não houve quem refutasse Jó[b], quem respondesse às suas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu escutei vocês com atenção”. O verbo hebraico expressa consideração atenta ou observação cuidadosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “corrigir Jó” ou “repreender Jó”. O termo hebraico pode indicar tanto uma refutação em debate quanto uma correção ou repreensão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Eu prestei muita atenção em vocês
  rationale: O verbo no hitpolel de בין comunica consideração ou observação atenta; no contexto do debate, a expressão portuguesa transmite naturalmente que Eliú escutou os interlocutores com cuidado.
- source_word: וְהִנֵּה
  choice: mas eis que
  rationale: “Eis que” preserva a força retórica do marcador hebraico, enquanto “mas” explicita com naturalidade o contraste entre a atenção de Eliú e sua conclusão negativa.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: nenhum de vocês foi capaz de refutar Jó
  rationale: מוכיח, de יכח, pode designar quem contesta, demonstra o erro ou repreende. No contexto de uma disputa verbal, “refutar” expressa bem a dimensão argumentativa.
- source_word: עוֹנֶה אֲמָרָיו
  choice: nem de responder às palavras dele
  rationale: A construção indica responder ao que Jó disse; “às palavras dele” permanece próxima do hebraico e é clara em português.
- source_word: מִכֶּם
  choice: nenhum de vocês
  rationale: A preposição indica alguém procedente do grupo dos amigos. Integrá-la à construção negativa como “nenhum de vocês” é idiomático e fiel ao sentido.
