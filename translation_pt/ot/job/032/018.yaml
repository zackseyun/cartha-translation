  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: pt
  text: Pois estou cheio de palavras; o espírito no meu íntimo me pressiona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o espírito do meu ventre”; também pode ser entendido como “o espírito nas minhas entranhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Eliú para sua necessidade de falar, preservando a força causal e explicativa do hebraico.
- source_word: מָלֵתִי מִלִּים
  choice: estou cheio de palavras
  rationale: Mantém a imagem hebraica de palavras acumuladas dentro dele e expressa naturalmente um estado presente em português.
- source_word: הֱצִיקַתְנִי
  choice: me pressiona
  rationale: O verbo comunica aperto ou pressão. No contexto, descreve o impulso interior que o leva a falar sem transformar explicitamente essa pressão em compulsão.
- source_word: רוּחַ
  choice: o espírito
  rationale: Refere-se aqui ao impulso ou princípio interior de Eliú; “espírito” preserva a amplitude antropológica do termo hebraico.
- source_word: בִּטְנִי
  choice: no meu íntimo
  rationale: Traduz de modo natural a imagem hebraica do ventre como sede da vida interior, enquanto a expressão mais literal é preservada em nota.
