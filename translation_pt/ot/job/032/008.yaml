source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: pt
  text: Mas há um espírito no ser humano[a], e o sopro do Todo-Poderoso lhes dá entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Certamente há um espírito numa pessoa, e o sopro do Todo-Poderoso lhe dá entendimento». O hebraico passa do singular, «ser humano», ao plural, «lhes»; algumas traduções uniformizam a frase no singular.'
    reason: Leitura alternativa e explicação da mudança de número no hebraico.
lexical_decisions:
- source_word: אָכֵן
  choice: Mas
  rationale: Introduz uma correção enfática em contraste com a ideia anterior de que apenas a idade traz sabedoria; «Mas» expressa naturalmente essa função no contexto.
- source_word: רוּחַ
  choice: espírito
  rationale: Neste paralelismo, designa o princípio imaterial no ser humano e permanece distinto de נִשְׁמָה, traduzido como «sopro».
- source_word: הִיא
  choice: há
  rationale: A oração nominal hebraica admite em português uma formulação existencial natural, sem impor uma construção clivada que resolveria a relação entre os dois membros.
- source_word: בֶאֱנוֹשׁ
  choice: no ser humano
  rationale: אֱנוֹשׁ denota aqui o humano mortal em sentido genérico. «Ser humano» comunica esse valor de modo atual e abrangente.
- source_word: וְנִשְׁמַת
  choice: e o sopro do
  rationale: נִשְׁמָה significa naturalmente «sopro» e, assim, preserva a distinção poética em relação a רוּחַ, «espírito».
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Tradução tradicional e clara do título divino שַׁדַּי, adequada ao registro bíblico em português.
- source_word: תְּבִינֵם
  choice: lhes dá entendimento
  rationale: O hifil de בין tem sentido causativo, «dar entendimento», e o sufixo de terceira pessoa masculina plural é preservado por «lhes».
theological_decisions:
- issue: Linguagem antropológica e mudança de número
  choice: O singular genérico «ser humano» é seguido pelo plural «lhes», preservando a passagem do singular para o plural no hebraico.
  alternative: 'Harmonizar no singular: «há um espírito no ser humano, e o sopro do Todo-Poderoso lhe dá entendimento».'
  rationale: O texto hebraico usa אֱנוֹשׁ no singular e um sufixo plural em תְּבִינֵם. A tradução mantém essa tensão gramatical em vez de uniformizá-la.
- issue: Relação entre «espírito» e «sopro»
  choice: 'Manter duas expressões coordenadas: «há um espírito... e o sopro... dá entendimento».'
  alternative: 'Interpretá-las como aposição enfática: «é o espírito no ser humano, o sopro do Todo-Poderoso, que lhes dá entendimento».'
  rationale: A coordenação preserva a possível distinção e o paralelismo do hebraico, sem afirmar que «espírito» e «sopro» são necessariamente a mesma realidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. «Ser humano» evita o possível sentido exclusivamente masculino de «homem» e representa com precisão o singular genérico אֱנוֹשׁ. A colocação pronominal em «lhes dá» é corrente e clara.
