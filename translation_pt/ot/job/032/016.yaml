  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição causal de כִּי foi preservada por “porque... porque”, e os tempos verbais foram ajustados naturalmente ao contexto narrativo sem eliminar as alternativas lexicais genuínas.
