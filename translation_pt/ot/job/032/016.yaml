  text: וְ֭/הוֹחַלְתִּי כִּי לֹ֣א יְדַבֵּ֑רוּ כִּ֥י עָ֝מְד֗וּ לֹא עָ֥נוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: pt
  text: E esperei[a], porque eles não falavam, porque haviam parado[b] e não respondiam mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mantive a esperança”, pois o verbo pode indicar uma espera acompanhada de expectativa; aqui o contexto favorece “esperei”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ficaram de pé”; no contexto, a expressão indica que eles haviam parado de falar e permaneciam em silêncio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: E esperei
  rationale: O hifil perfeito na primeira pessoa singular de יחל pode expressar espera com expectativa, mas, no contexto em que Eliú adia sua fala enquanto os mais velhos permanecem calados, “esperei” é a opção mais natural. A conjunção וְ é preservada por “E”.
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: porque eles não falavam
  rationale: כִּי introduz a razão da espera. O imperfeito negativo descreve a ausência continuada de fala naquele momento, expressa naturalmente em português pelo pretérito imperfeito.
- source_word: כִּי עָמְדוּ
  choice: porque haviam parado
  rationale: עָמְדוּ significa literalmente “ficaram de pé” ou “pararam”; no contexto do debate, indica que os interlocutores cessaram sua argumentação. O mais-que-perfeito composto deixa clara a situação já estabelecida.
- source_word: לֹא עָנוּ עוֹד
  choice: não respondiam mais
  rationale: A combinação de ענה com עוֹד indica que as respostas cessaram. O pretérito imperfeito harmoniza com “não falavam” e comunica o estado de silêncio continuado.
theological_decisions: []
