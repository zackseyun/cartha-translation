  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: pt
  text: Então a ira de Eliú, filho de Baraquel, o buzita, da família de Rão, acendeu-se contra Jó. Sua ira se acendeu porque Jó se justificava em vez de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque considerava a si mesmo mais justo do que Deus”.'
    reason: Leitura alternativa da difícil construção comparativa מֵאֱלֹהִים.
lexical_decisions:
- source_word: וַיִּחַר אַף / חָרָה אַפּוֹ
  choice: a ira ... acendeu-se / sua ira se acendeu
  rationale: Preserva a imagem hebraica da ira que se acende e também a repetição enfática do original, com formulação natural em português.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: Eliú, filho de Baraquel
  rationale: Transliteração tradicional e reconhecível dos nomes em português, mantendo de modo direto a relação genealógica.
- source_word: הַבּוּזִי
  choice: o buzita
  rationale: Reproduz a designação étnica ou clânica marcada pelo artigo no hebraico.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: da família de Rão
  rationale: מִשְׁפָּחָה pode indicar família ou clã; “família” é claro e corrente, sem excluir o sentido de agrupamento familiar mais amplo.
- source_word: בְּאִיּוֹב
  choice: contra Jó
  rationale: Com um verbo de ira, a preposição בְּ marca naturalmente a pessoa contra quem a ira se dirige.
- source_word: עַל
  choice: porque
  rationale: Neste contexto, introduz a causa da ira de Eliú.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: Jó justificava a si mesmo
  rationale: O verbo tem matiz declarativo ou forense, e נַפְשׁוֹ funciona reflexivamente. A repetição explícita de “Jó” evita ambiguidade referencial em português.
- source_word: מֵאֱלֹהִים
  choice: em vez de Deus
  rationale: 'Expressa o contraste comparativo: a autodefesa de Jó ocorre em detrimento da vindicação de Deus, sem afirmar de modo excessivamente explícito que Jó formulou uma tese abstrata de superioridade moral.'
theological_decisions:
- issue: Sentido de עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: porque Jó justificava a si mesmo em vez de Deus
  alternative: porque considerava a si mesmo mais justo do que Deus
  rationale: A construção hebraica é difícil. O texto principal conserva o contraste entre a autovindicação de Jó e a vindicação de Deus sem resolver além do necessário a tensão teológica; a leitura comparativa mais forte é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição da imagem da ira que se acende acompanha a ênfase do hebraico; “buzita” e “Rão” seguem formas portuguesas reconhecíveis.
