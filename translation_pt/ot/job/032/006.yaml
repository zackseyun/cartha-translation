- from: 'Então Eliú, filho de Baraquel, o buzita, respondeu: “Eu sou jovem em idade[b], e vocês são idosos; por isso, fiquei retraído e tive medo de lhes declarar o que sei.[a]”'
  to: 'Então Eliú, filho de Baraquel, o buzita, respondeu e disse: “Eu sou jovem em idade[b], e vocês são idosos; por isso, hesitei e tive medo de lhes declarar o que sei.[a]”'
  rationale: A revisão substitui uma expressão portuguesa potencialmente imprecisa por “hesitei”, que reflete melhor a relutância temerosa de זָחַלְתִּי, e restaura a fórmula narrativa dupla do hebraico. As notas, seus marcadores e o sentido do versículo são preservados.
