base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: pt
  text: 'Então Eliú, filho de Baraquel, o buzita, respondeu e disse: “Eu sou jovem em idade[b], e vocês são idosos; por isso, hesitei e tive medo de lhes declarar o que sei.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recuei e tive medo de lhes dizer o que sei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “jovem em dias”, expressão que significa relativamente jovem em idade.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: A fórmula narrativa hebraica combina “respondeu” e “disse”. Em português atual, “respondeu” introduz naturalmente a fala e evita a redundância pouco idiomática “respondeu e disse”, sem pressupor que tenha havido uma pergunta direta.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: Eliú, filho de Baraquel, o buzita
  rationale: Empregam-se as formas portuguesas tradicionais dos nomes; o gentílico הַבּוּזִי é mantido como designação de origem ou parentesco.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Eu sou jovem em idade
  rationale: Expressa com naturalidade o sentido do idiomatismo hebraico “jovem em dias”, preservado literalmente na nota.
- source_word: יְשִׁישִׁים
  choice: idosos
  rationale: Designa pessoas de idade avançada de modo claro, respeitoso e corrente em português.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca de modo natural a consequência lógica entre a diferença de idade e a relutância de Eliú.
- source_word: זָחַלְתִּי
  choice: fiquei retraído
  rationale: O verbo raro comunica a ideia de recuar ou mostrar-se tímido. “Fiquei retraído” preserva essa hesitação sem exagerar o medo já expresso pelo verbo seguinte.
- source_word: וָאִירָא
  choice: e tive medo
  rationale: Mantém a segunda expressão coordenada de temor, sem fundi-la com a relutância indicada por זָחַלְתִּי.
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: de lhes declarar o que sei
  rationale: חוה significa declarar ou dar a conhecer; דֵּעִי pode ser expresso naturalmente como “o que sei”, sem reduzir o conteúdo a mera opinião.
theological_decisions: []
