  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֣שֶׁת רֵעָי/ו֮ חָרָ֪ה אַ֫פּ֥/וֹ עַ֤ל אֲשֶׁ֣ר לֹא מָצְא֣וּ מַעֲנֶ֑ה וַ֝/יַּרְשִׁ֗יעוּ אֶת אִיּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: pt
  text: E sua ira se acendeu contra os três amigos de Jó, porque não haviam encontrado resposta e, mesmo assim, haviam condenado Jó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “haviam declarado Jó culpado” ou “haviam tratado Jó como perverso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: contra os três amigos de Jó
  rationale: Com חרה אף, a preposição ב marca o alvo da ira. Embora o hebraico diga literalmente “seus três amigos”, explicitar “de Jó” evita em português a impressão equivocada de que eram amigos de Eliú.
- source_word: חָרָה אַפּוֹ
  choice: sua ira se acendeu
  rationale: Preserva de modo natural e digno a metáfora hebraica convencional de ira ardente, sem reproduzir literalmente a referência idiomática ao nariz.
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: Introduz de maneira clara e concisa a causa da ira de Eliú.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: não haviam encontrado resposta
  rationale: מַעֲנֶה designa uma resposta ou réplica no debate. O mais-que-perfeito composto apresenta essa falta de resposta como situação anterior que motivou a ira.
- source_word: וַיַּרְשִׁיעוּ
  choice: haviam condenado
  rationale: 'O Hifil de רשע tem sentido declarativo ou forense: considerar ou declarar alguém culpado. “Condenado” expressa esse sentido sem acrescentar uma conclusão teológica além do texto.'
- source_word: וַ
  choice: e, mesmo assim,
  rationale: 'O waw é formalmente conjuntivo, mas a relação lógica é adversativa: eles não acharam resposta e, apesar disso, condenaram Jó.'
- source_word: אֶת אִיּוֹב
  choice: Jó
  rationale: O marcador de objeto direto não se traduz; o nome próprio recebe sua forma portuguesa tradicional.
theological_decisions:
- issue: Sentido da ação dos amigos contra Jó
  choice: “haviam condenado Jó”, em sentido declarativo ou forense
  alternative: “haviam declarado Jó culpado” ou “haviam tratado Jó como perverso”
  rationale: O Hifil de רשע favorece a noção de declarar culpado ou condenar no contexto de uma disputa. A nota conserva as alternativas lexicais legítimas sem transformar a frase numa afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Jó” evita a ambiguidade referencial que “seus três amigos” teria em português. A formulação mantém a metáfora da ira que se acende e explicita com moderação o contraste discursivo do waw.
