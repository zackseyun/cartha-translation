  text: הֵ֤ן הוֹחַ֨לְתִּי לְֽ/דִבְרֵי/כֶ֗ם אָ֭זִין עַד תְּב֥וּנֹֽתֵי/כֶ֑ם עַֽד תַּחְקְר֥וּ/ן מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: pt
  text: Vejam, esperei[a] pelas suas palavras; escutei os seus raciocínios[b], até que vocês buscassem o que dizer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tive esperança nas suas palavras”. O verbo hebraico pode indicar espera acompanhada de expectativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “o seu entendimento” ou “os seus discernimentos”.
    reason: lexical_alternative
  - marker: c
    text: De forma mais literal, “até que vocês buscassem palavras”. A expressão hebraica é compacta e também pode ser entendida como “até que examinassem o que dizer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula discursiva que chama a atenção dos ouvintes. “Vejam” é atual e natural, sem o tom arcaico de “eis”.
- source_word: הוֹחַלְתִּי
  choice: esperei
  rationale: O verbo יחל pode expressar espera ou esperança. No contexto, Eliú destaca que se conteve enquanto os outros falavam; “esperei” comunica diretamente essa ideia.
- source_word: לְדִבְרֵיכֶם
  choice: pelas suas palavras
  rationale: A construção preposicional indica aquilo pelo qual Eliú esperava. A formulação preserva “palavras” e soa natural em português.
- source_word: אָזִין
  choice: escutei
  rationale: O hifil de אזן indica ouvir com atenção. “Escutei” é claro e sugere atenção deliberada sem expansão excessiva.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: os seus raciocínios
  rationale: O plural pode designar entendimentos, discernimentos ou formulações do pensamento. No debate, “raciocínios” expressa naturalmente o conteúdo argumentativo ouvido por Eliú.
- source_word: עַד
  choice: enquanto
  rationale: Neste contexto, a partícula delimita o período durante o qual Eliú ouviu os outros buscarem uma resposta. “Enquanto” produz uma relação temporal natural em português; a alternativa mais literal “até que” é registrada na nota.
- source_word: תַּחְקְרוּן
  choice: procuravam
  rationale: חקר descreve busca ou investigação cuidadosa. Com “o que dizer”, “procuravam” preserva a ideia de empenho na busca sem criar uma expressão artificial.
- source_word: מִלִּין
  choice: o que dizer
  rationale: O termo poético significa literalmente “palavras”. Na expressão compacta, refere-se às palavras que os interlocutores buscavam para formular sua resposta; “o que dizer” comunica esse sentido idiomático.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e de ampla compreensão, com tratamento por “vocês”, adequado ao plural do hebraico e natural para leitores brasileiros. A ordem poética foi suavemente ajustada para clareza, enquanto as ambiguidades de יחל, תבונות e da oração final foram preservadas em notas.
