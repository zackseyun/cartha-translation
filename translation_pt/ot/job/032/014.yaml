  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: pt
  text: Ele não dirigiu palavras contra mim,[a] e eu não lhe responderei com as palavras de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não ordenou palavras contra mim”. O verbo hebraico pode significar pôr em ordem ou dispor palavras e, por extensão, dirigir um argumento contra alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com as declarações de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: dirigiu
  rationale: Com מִלִּין e אֵלַי, o verbo descreve a apresentação ou o direcionamento de palavras num debate; “dirigiu” é natural e mantém o sentido disputativo sem excluir a ideia básica de ordenar.
- source_word: אֵלַי
  choice: contra mim
  rationale: Embora a preposição possa significar “a mim” ou “para mim”, o contexto de controvérsia favorece palavras ou argumentos dirigidos contra Eliú.
- source_word: מִלִּין
  choice: palavras
  rationale: Tradução direta do plural aramaizante que designa palavras ou discurso; o verbo e o contexto comunicam a nuance argumentativa.
- source_word: אִמְרֵיכֶם
  choice: os argumentos de vocês
  rationale: Neste contexto, refere-se ao conteúdo das falas dos amigos que Eliú não pretende reutilizar. “Argumentos” diferencia o termo de מִלִּין e expressa naturalmente sua função no debate.
- source_word: אֲשִׁיבֶנּוּ
  choice: não lhe responderei
  rationale: O hifil de שוב significa aqui “responder”; o sufixo masculino singular retoma Jó, expresso naturalmente em português pelo pronome “lhe”.
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: e eu não lhe responderei com os argumentos de vocês
  rationale: O בְּ é entendido instrumentalmente (“com”), e a coordenação conserva a afirmação de Eliú de que sua resposta não repetirá a argumentação dos amigos.
