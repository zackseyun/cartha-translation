source:
  edition: WLC
  text: וֶֽ/אֱלִיה֗וּ חִכָּ֣ה אֶת אִ֭יּוֹב בִּ/דְבָרִ֑ים כִּ֤י זְֽקֵנִים הֵ֖מָּה מִמֶּ֣/נּוּ לְ/יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/004.yaml
  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: pt
  text: E Eliú havia esperado para falar com Jó[a], porque eles eram mais velhos do que ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, a construção diz algo como “Eliú esperou Jó em palavras”; o sentido é que ele esperou para falar com Jó.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “eles eram mais velhos do que ele em dias”, isto é, em idade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: E Eliú
  rationale: O waw liga o versículo à narrativa anterior e pode ser traduzido naturalmente por “E”; o nome é transliterado na forma portuguesa consagrada, “Eliú”.
- source_word: חִכָּה
  choice: havia esperado
  rationale: O verbo significa “esperar”. O mais-que-perfeito composto apresenta essa espera como anterior à reação de Eliú narrada em seguida.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: para falar com Jó
  rationale: A construção é literalmente incomum, algo como “esperou Jó em palavras”. No contexto, indica que Eliú aguardou antes de dirigir suas palavras a Jó; a formulação portuguesa comunica esse sentido sem reproduzir uma sintaxe obscura.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz diretamente a razão pela qual Eliú esperou.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ
  choice: eles eram mais velhos do que ele
  rationale: O plural remete aos interlocutores mencionados no contexto. Aqui זְקֵנִים descreve idade comparativa, não o cargo de “anciãos”.
- source_word: לְיָמִים
  choice: em idade
  rationale: A expressão hebraica é literalmente “em dias”, mas funciona idiomaticamente como referência à idade. A ideia já é expressa com naturalidade por “mais velhos”; a nota preserva a forma literal.
theological_decisions: []
