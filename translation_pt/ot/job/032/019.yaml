  text: הִנֵּֽה בִטְנִ֗/י כְּ/יַ֥יִן לֹא יִפָּתֵ֑חַ כְּ/אֹב֥וֹת חֲ֝דָשִׁ֗ים יִבָּקֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: pt
  text: Eis que meu ventre é como vinho sem saída[a]; como odres novos[b], prestes a arrebentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu ventre é como vinho que não foi aberto”; o hebraico diz literalmente “meu ventre é como vinho não aberto”.
    reason: lexical_alternative
  - marker: b
    text: Odres eram recipientes feitos de peles de animais e usados para guardar líquidos, especialmente vinho.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Partícula que chama a atenção para a comparação vívida de Eliú; “eis que” preserva sua força apresentativa em registro digno e compreensível.
- source_word: בִטְנִי
  choice: meu ventre
  rationale: Mantém a imagem concreta do hebraico, que pode também evocar o íntimo da pessoa e a pressão interior, sem substituí-la por uma interpretação como “coração” ou “espírito”.
- source_word: כְּיַיִן
  choice: como vinho
  rationale: Reproduz diretamente a comparação. O contexto sugere vinho sob pressão, mas o hebraico não explicita que esteja fermentando.
- source_word: לֹא יִפָּתֵחַ
  choice: sem saída
  rationale: O nifal significa literalmente “não é aberto”. Na imagem, trata-se de vinho sem abertura por onde se liberar; “sem saída” comunica essa ideia com naturalidade, e a forma literal é registrada em nota.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: como odres novos
  rationale: אֹבוֹת designa aqui recipientes de pele, especialmente apropriados para vinho; “odres” é o termo português tradicional e preciso, esclarecido em nota cultural. חֲדָשִׁים é traduzido diretamente por “novos”.
- source_word: יִבָּקֵעַ
  choice: está prestes a romper-se
  rationale: בקע expressa abrir-se por ruptura ou arrebentar. A formulação comunica a pressão iminente sugerida pela comparação e mantém o verbo no singular, como no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção sem sujeito expresso em “está prestes a romper-se” conserva a concisão e certa ambiguidade da imagem hebraica, cujo verbo está no singular embora “odres novos” esteja no plural.
