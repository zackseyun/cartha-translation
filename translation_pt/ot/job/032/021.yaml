  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: pt
  text: Por favor, que eu não seja parcial com ninguém, nem bajule pessoa alguma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nem dê títulos lisonjeiros a pessoa alguma».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Por favor, que eu não
  rationale: A combinação expressa um pedido ou desejo negativo enfático e cortês; esta formulação conserva essa força em português natural.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: seja parcial com ninguém
  rationale: A expressão idiomática hebraica, literalmente «levantar o rosto de um homem», significa favorecer alguém ou agir com parcialidade. A construção negativa com «ninguém» comunica naturalmente o referente humano indefinido.
- source_word: וְאֶל אָדָם
  choice: nem ... pessoa alguma
  rationale: אָדָם designa aqui um ser humano e forma paralelismo com אִישׁ. «Pessoa alguma» mantém o sentido abrangente sem repetição pesada.
- source_word: לֹא אֲכַנֶּה
  choice: bajule
  rationale: No piel, כנה pode indicar dirigir-se a alguém por títulos lisonjeiros ou usar linguagem aduladora. «Bajular» expressa de modo claro e atual a ideia ética central.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi preservado por «ninguém» / «pessoa alguma», e a alternativa mais literal de אֲכַנֶּה foi registrada em nota.
