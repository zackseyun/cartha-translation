  source_fidelity: A tradução de רַבִּים como «os muitos» segue a trilha inglesa apresentada, mas, neste contexto, o substantivo designa mais naturalmente «os grandes»/pessoas de destaque, não uma quantidade de pessoas. Além disso, יֶחְכָּמוּ é melhor expresso aqui pelo presente gnômico «são sábios» do que pelo incoativo «se tornam sábios». «O que é justo» traduz adequadamente מִשְׁפָּט, cuja amplitude semântica é indicada pela nota.
  naturalness: «Os muitos» é pouco idiomático em português e soa como uma tradução excessivamente literal. «Os grandes» e «os mais velhos» preservam o paralelismo de modo claro, digno e natural.
  terminology: «Os grandes» mantém a possível referência a pessoas importantes ou eminentes sem especificar uma função. «Os mais velhos» exprime o contraste etário sem introduzir o sentido institucional de «anciãos». A nota para מִשְׁפָּט conserva alternativas relevantes.
