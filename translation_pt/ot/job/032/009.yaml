  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: pt
  text: Não são os grandes que são sábios, nem os mais velhos que entendem o que é justo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a justiça» ou «o juízo». O hebraico mishpat pode referir-se a juízo legal, justiça ou àquilo que é correto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Não são
  rationale: A negação abre a afirmação proverbial e, em português, a construção «Não são... que» preserva naturalmente sua ênfase.
- source_word: רַבִּים
  choice: os muitos
  rationale: O adjetivo substantivado designa pessoas numerosas, em paralelo com «os idosos»; não há necessidade de lhe atribuir o sentido social de «os grandes».
- source_word: יֶחְכָּמוּ
  choice: se tornam sábios
  rationale: O qal de חכם pode expressar ser ou tornar-se sábio. A forma verbal portuguesa preserva essa nuance possível e se ajusta à reflexão de Eliú sobre a origem da sabedoria.
- source_word: וּזְקֵנִים
  choice: nem os idosos
  rationale: O contexto destaca idade avançada, não necessariamente o cargo de ancião. «Idosos» é atual, respeitoso e não acrescenta uma limitação masculina que o português não precisa explicitar.
- source_word: יָבִינוּ
  choice: entendem
  rationale: בין indica entender ou discernir; «entendem» é direto e natural com o complemento seguinte.
- source_word: מִשְׁפָּט
  choice: o que é justo
  rationale: A expressão comunica aqui discernimento moral e judicial, ao mesmo tempo que evita restringir o termo a um processo ou veredito. As alternativas lexicais são registradas em nota.
