  text: Sua confiança será cortada[a][b], e sua segurança será casa de aranha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua esperança será cortada”; o substantivo hebraico pode indicar confiança, esperança ou segurança neste contexto.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido como “será cortada” é raro e de sentido discutido; também pode ter a nuance de “será rompida” ou, menos provavelmente aqui, “será desprezada”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, sua segurança é tão frágil quanto a casa ou teia de uma aranha.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: sua
  rationale: O pronome relativo liga o versículo à pessoa descrita no contexto anterior. Em português, a construção com possessivo evita uma oração relativa truncada e mantém a ligação contextual.
- source_word: יָקוֹט
  choice: será cortada
  rationale: O verbo é raro e de sentido discutido. A ideia de algo ser cortado ou rompido se ajusta ao colapso da segurança retratado no paralelismo, sem ocultar a incerteza lexical, registrada em nota.
- source_word: כִּסְלוֹ
  choice: sua confiança
  rationale: Neste contexto sapiencial, o substantivo indica confiança, esperança ou segurança e corresponde semanticamente a מִבְטַחוֹ no segundo membro.
- source_word: וּבֵית עַכָּבִישׁ
  choice: como a casa de uma aranha
  rationale: A expressão preserva a metáfora hebraica da casa da aranha. A inserção de 'como' torna explícita em português a relação metafórica implícita entre o objeto de confiança e essa estrutura frágil.
- source_word: מִבְטַחוֹ
  choice: aquilo em que confia
  rationale: O substantivo pode designar a confiança ou seu objeto. Esta formulação apresenta naturalmente em português o fundamento no qual a pessoa deposita confiança e evita repetição excessiva.
