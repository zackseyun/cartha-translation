  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: pt
  text: Eis que[a], Deus não rejeita o íntegro, nem ampara os malfeitores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Certamente».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «não segura a mão dos malfeitores»; ou «não sustenta a mão dos malfeitores».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Vejam
  rationale: Introduz uma afirmação enfática e chama a atenção dos ouvintes. «Vejam» é atual e natural em português, preservando a força declarativa do hebraico.
- source_word: אֵל
  choice: Deus
  rationale: É o termo poético comum para Deus neste contexto; o texto não explicita «Todo-Poderoso».
- source_word: יִמְאַס
  choice: rejeita
  rationale: Expressa recusar ou repudiar, sem acrescentar a conotação emocional mais forte de «desprezar».
- source_word: תָּם
  choice: o íntegro
  rationale: O adjetivo substantivado designa uma pessoa íntegra, irrepreensível. «O íntegro» conserva a formulação genérica e combina com o vocabulário moral característico de Jó.
- source_word: יַחֲזִיק בְּיַד
  choice: sustenta a mão
  rationale: Mantém a imagem concreta de tomar ou firmar a mão e, ao mesmo tempo, comunica a ideia contextual de dar apoio.
- source_word: מְרֵעִים
  choice: malfeitores
  rationale: 'Preserva a força ativa do particípio: pessoas que praticam o mal.'
theological_decisions:
- issue: Sentido da expressão וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: nem sustenta a mão dos malfeitores
  alternative: nem apoia os malfeitores; nem agarra a mão dos malfeitores
  rationale: A tradução conserva a imagem hebraica da mão, mas deixa perceptível o sentido de apoiar ou auxiliar. Assim, não reduz a expressão a uma paráfrase nem força exclusivamente o sentido literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «Vejam» funciona como chamado geral de atenção; «íntegro» mantém o tom sapiencial sem linguagem excessivamente técnica.
