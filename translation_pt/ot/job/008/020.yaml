review_pass:
  verdict: revise
  source_fidelity: «Deus não rejeita o íntegro» transmite adequadamente אֵל לֹא יִמְאַס תָּם. Na segunda cola, «sustenta a mão dos malfeitores» conserva palavras da imagem, mas não é uma expressão portuguesa clara para o idiomatismo hebraico de prestar apoio. «Não ampara os malfeitores» comunica com precisão o sentido contextual; uma nota preserva a formulação literal e a sua ambiguidade lexical.
  naturalness: «Vejam» dirige-se a vários ouvintes e soa como um imperativo discursivo, enquanto הֶן introduz primariamente uma afirmação enfática. «Eis que» é uma introdução proverbial e poética natural, digna e amplamente compreensível. «Ampara os malfeitores» é mais idiomático que «sustenta a mão dos malfeitores».
  terminology: «Íntegro» é uma boa tradução de תָּם no vocabulário moral de Jó, e «malfeitores» representa adequadamente מְרֵעִים. «Amparar» reproduz o valor de apoio da expressão יַחֲזִיק בְּיַד sem impor uma leitura doutrinária.
  issues:
  - severity: medium
    issue: «Vejam» para הֶן
    rationale: O plural imperativo acrescenta um destinatário plural e uma força apelativa que o marcador hebraico não exige. «Eis que» conserva melhor a função enfática introdutória.
  - severity: medium
    issue: «sustenta a mão dos malfeitores»
    rationale: Embora próximo da imagem hebraica, o enunciado é pouco idiomático em português e pode sugerir suporte físico à mão. O sentido contextual é que Deus não dá amparo aos malfeitores; o literal deve ser mantido em nota.
  revised_text: Eis que[a], Deus não rejeita o íntegro, nem ampara os malfeitores[b].
