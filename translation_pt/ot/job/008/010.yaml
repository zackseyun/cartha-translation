lexical_decisions:
- source_word: הֲלֹא
  choice: Não serão... que
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção preserva naturalmente essa força em português.
- source_word: הֵם
  choice: eles
  rationale: Retoma as gerações passadas mencionadas no contexto anterior, sem explicitar além do hebraico.
- source_word: יוֹרוּךָ
  choice: ensinarão você
  rationale: O hifil de ירה significa aqui ensinar ou instruir; esta formulação é clara e natural para leitores brasileiros.
- source_word: יֹאמְרוּ לָךְ
  choice: lhe dirão
  rationale: Representa distintamente o verbo אמר e forma um par natural com 'ensinarão você'.
- source_word: וּמִלִּבָּם
  choice: do coração deles
  rationale: Preserva a imagem antropológica hebraica de לֵב, que pode abranger pensamento, sentimento e interioridade.
- source_word: יוֹצִיאוּ
  choice: farão sair
  rationale: Conserva a imagem causativa do hifil de יצא, em que as palavras saem do interior da pessoa.
- source_word: מִלִּים
  choice: palavras
  rationale: Equivalente direto e adequado ao contexto sapiencial.
