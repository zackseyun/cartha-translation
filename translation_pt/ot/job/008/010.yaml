  language: pt
  text: Não lhe ensinarão eles e lhe dirão, e farão surgir palavras do coração deles?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da mente deles» ou «do íntimo deles»; em hebraico, «coração» frequentemente designa o centro do pensamento, bem como dos sentimentos.
