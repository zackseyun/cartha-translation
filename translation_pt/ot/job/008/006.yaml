source:
  edition: WLC
  text: אִם זַ֥ךְ וְ/יָשָׁ֗ר אָ֥תָּה כִּי עַ֭תָּה יָעִ֣יר עָלֶ֑י/ךָ וְ֝/שִׁלַּ֗ם נְוַ֣ת צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: pt
  text: Se você é puro e reto, certamente agora mesmo ele despertará em seu favor[a] e restaurará[b] sua morada justa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acordará por você” ou “se mobilizará em seu favor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornará completa” ou “retribuirá”; o verbo hebraico pode ter o sentido de restaurar, completar ou retribuir.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “a morada da sua justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz de modo direto a condição apresentada por Bildade.
- source_word: זַךְ
  choice: puro
  rationale: Expressa pureza moral sem tornar explícita uma declaração forense de inocência.
- source_word: יָשָׁר
  choice: reto
  rationale: Termo corrente e digno para a retidão moral característica da linguagem sapiencial.
- source_word: כִּי עַתָּה
  choice: certamente agora mesmo
  rationale: Entende כִּי como enfático na oração consequente e transmite tanto a certeza afirmada por Bildade quanto a ideia de imediatismo.
- source_word: יָעִיר עָלֶיךָ
  choice: ele despertará em seu favor
  rationale: Preserva a imagem do verbo עור, cujo sentido é despertar ou pôr-se em ação, e traduz עָלֶיךָ como ação em benefício de Jó.
- source_word: וְשִׁלַּם
  choice: e restaurará
  rationale: No piel, שׁלם pode significar completar, retribuir ou restaurar; com a morada como objeto, 'restaurará' comunica naturalmente o restabelecimento do lar.
- source_word: נְוַת
  choice: morada
  rationale: Designa habitação ou lar e mantém um registro digno sem restringir o sentido à construção física.
- source_word: צִדְקֶךָ
  choice: justa
  rationale: A construção hebraica é vertida de modo adjetival e natural em português, sem eliminar a forma mais literal, registrada em nota.
theological_decisions:
- issue: Sujeito implícito dos verbos na oração consequente
  choice: Manter o pronome 'ele', que no contexto se refere a Deus
  alternative: Inserir explicitamente 'Deus'
  rationale: As formas verbais hebraicas não nomeiam o sujeito. O pronome mantém a referência contextual sem acrescentar um substantivo ausente do texto.
- issue: Força da afirmação de Bildade
  choice: Traduzir diretamente a sua alegação condicional
  alternative: Acrescentar linguagem que distancie o narrador da teologia retributiva de Bildade
  rationale: O versículo apresenta a fala de Bildade; traduzi-la fielmente não implica endosso narrativo de sua perspectiva.
- issue: Relação entre 'morada' e 'justiça'
  choice: morada justa
  alternative: morada da sua justiça
  rationale: A formulação adjetival é natural em português e preserva a qualificação moral, enquanto a construção formalmente mais literal permanece em nota para conservar a possível tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A metáfora do despertar é preservada, e as principais alternativas lexicais do hebraico são apresentadas em notas.
