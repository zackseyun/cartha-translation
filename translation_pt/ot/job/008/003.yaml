id: JOB.8.3
reference: Job 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: pt
  text: Acaso Deus perverte a justiça, ou o Todo-Poderoso perverte o que é justo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso Deus distorce o juízo, ou o Todo-Poderoso distorce a justiça?”'
    reason: Alternativa lexical que torna explícitos os sentidos de מִשְׁפָּט como “juízo” e צֶדֶק como “justiça”, além da imagem de entortar presente no verbo.
lexical_decisions:
- source_word: הַאֵל
  choice: Acaso Deus
  rationale: A partícula interrogativa הַ introduz uma pergunta retórica de resposta negativa esperada; “Acaso” expressa isso naturalmente em português, e אֵל funciona aqui como o título comum “Deus”.
- source_word: יְעַוֵּת
  choice: perverte
  rationale: O piel de עוה indica tornar torto ou desvirtuar, especialmente em contexto jurídico e moral; “perverte” conserva a força forense do verbo.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste paralelismo, o termo aponta para a justiça ou o julgamento justo como norma jurídico-moral; “justiça” é claro e corrente.
- source_word: וְאִם
  choice: ou
  rationale: Embora a forma seja literalmente “e se”, no par de perguntas retóricas ela introduz a alternativa paralela; “ou” reproduz essa função em português.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: O título divino é traduzido por seu equivalente tradicional e inteligível em português, em vez de ser transliterado.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: A expressão comunica retidão e justiça em sentido moral-jurídico, mantendo alguma distinção em relação a מִשְׁפָּט sem recorrer ao menos natural “a retidão” neste contexto.
theological_decisions:
- issue: Tradução dos títulos divinos אֵל e שַׁדַּי
  choice: Deus ... o Todo-Poderoso
  alternative: El ... Shaddai
  rationale: No contexto, ambos funcionam como títulos divinos. Traduzi-los comunica seu sentido ao leitor comum sem tratá-los indevidamente como nomes próprios.
- issue: Distinção entre מִשְׁפָּט e צֶדֶק
  choice: a justiça ... o que é justo
  alternative: o juízo ... a justiça
  rationale: Os termos se sobrepõem no campo jurídico-moral, mas não são idênticos. A formulação escolhida conserva a distinção e o paralelismo sem resolver artificialmente sua tensão semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Acaso” marca a força retórica, e a repetição de “perverte” preserva o paralelismo enfático do hebraico.
