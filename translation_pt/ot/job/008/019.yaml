base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: pt
  text: Eis que isto[a] é a alegria do seu caminho, e do pó outros brotarão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele é a alegria do seu caminho”. O pronome hebraico pode ser entendido de modo mais pessoal, mas o contexto favorece uma retomada da situação da planta descrita.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “outro brotará do pó”. A palavra hebraica traduzida por “outros” está no singular, mas o verbo está no plural, favorecendo “outros brotarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Eis que
  rationale: Partícula enfática que chama a atenção para a conclusão da imagem poética; “eis que” conserva sua vivacidade em português corrente e digno.
- source_word: הוּא
  choice: essa
  rationale: Embora seja formalmente um pronome masculino singular, aqui pode retomar de modo dêitico a situação ou o destino da planta descrita; “essa” expressa essa retomada naturalmente, sem eliminar a leitura pessoal alternativa.
- source_word: מְשׂוֹשׂ
  choice: a alegria
  rationale: O substantivo denota alegria, regozijo ou prazer. “A alegria” preserva a formulação poética e sua possível nota irônica.
- source_word: דַּרְכּוֹ
  choice: do seu caminho
  rationale: דרך pode indicar caminho, trajetória ou curso. “Caminho” mantém tanto a imagem concreta quanto a ressonância figurada.
- source_word: וּמֵעָפָר
  choice: e do pó
  rationale: A preposição מן marca origem, e עפר significa pó ou terra solta. “Do pó” é conciso e preserva a dicção e a imagem bíblicas.
- source_word: אַחֵר
  choice: outros
  rationale: Embora a forma seja singular, o verbo seguinte está no plural; “outros” concorda com esse verbo e comunica que substitutos surgirão.
- source_word: יִצְמָחוּ
  choice: brotarão
  rationale: O verbo צמח descreve o brotar ou crescer da vegetação. “Brotarão” conserva de maneira vívida e concisa a metáfora botânica.
theological_decisions:
- issue: Referente do pronome הוּא
  choice: 'Retomada dêitica da situação descrita: “essa”'
  alternative: 'Referência pessoal: “ele”'
  rationale: O contexto imediato favorece uma conclusão sobre o destino ou curso da planta metafórica, mas a forma hebraica permite leitura pessoal; a nota preserva a ambiguidade.
- issue: Número de אַחֵר diante do verbo plural
  choice: 'Plural contextual: “outros brotarão”'
  alternative: 'Singular formal: “outro brotará”'
  rationale: A forma אַחֵר é singular, porém יִצְמָחוּ está no plural. O texto principal segue a concordância verbal sem ocultar a alternativa morfológica.
translation_notes:
  register: Português moderno, claro e literário, com ampla legibilidade brasileira. “Eis que” mantém o tom enfático da poesia sapiencial; “pó”, “caminho” e “brotarão” preservam a rede de imagens sem explicá-la excessivamente.
