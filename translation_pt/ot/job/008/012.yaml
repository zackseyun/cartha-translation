base_translation:
  language: en
  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: pt
  text: Quando ainda está verde[a], sem ter sido cortado[b], seca antes de qualquer outra relva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu broto” ou “em seu crescimento fresco”. O termo hebraico se refere ao crescimento novo e verde de uma planta.
    reason: lexical_alternative
  - marker: b
    text: Ou “sem ser arrancado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Ainda
  rationale: O advérbio com sufixo indica que a planta permanece nesse estado; “ainda” expressa de modo conciso essa continuidade.
- source_word: בְאִבּוֹ
  choice: em seu broto
  rationale: A expressão se refere ao crescimento vegetal novo e fresco. “Em seu broto” conserva a imagem botânica concreta, enquanto a nota registra alternativas naturais.
- source_word: לֹא יִקָּטֵף
  choice: sem ser cortado
  rationale: A forma passiva de קטף pode indicar cortar ou arrancar uma planta. “Sem ser cortado” é claro no contexto e preserva a ideia de que a planta seca sem intervenção humana.
- source_word: וְלִפְנֵי
  choice: antes de
  rationale: A preposição estabelece uma comparação temporal; em português, “antes de” comunica naturalmente que essa planta seca mais cedo.
- source_word: כָל חָצִיר
  choice: qualquer outra erva
  rationale: No contexto comparativo, “outra” torna explícito que a planta mencionada seca antes das demais ervas, sem alterar o sentido.
- source_word: יִיבָשׁ
  choice: seca
  rationale: O verbo יבש significa secar ou murchar. “Seca” mantém a imagem literal e combina com a dependência de água descrita no contexto.
