  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: pt
  text: Pois somos de ontem e não sabemos, porque os nossos dias sobre a terra são uma sombra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que sustenta a exortação anterior de Bildade, preservando a força argumentativa do hebraico.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: somos de ontem
  rationale: Mantém de modo natural a imagem hebraica de origem recente e, por consequência, da experiência humana limitada.
- source_word: וְלֹא נֵדָע
  choice: e nada sabemos
  rationale: Expressa idiomaticamente a negação do verbo ידע no contexto da limitada experiência humana; a nota registra uma formulação portuguesa menos enfática e mais estritamente formal.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da ignorância humana e evita a repetição pouco fluida de “pois”, sem alterar a relação lógica.
- source_word: צֵל
  choice: uma sombra
  rationale: Preserva a metáfora poética de transitoriedade e falta de substância.
- source_word: יָמֵינוּ
  choice: os nossos dias
  rationale: Reproduz diretamente o substantivo com o sufixo de primeira pessoa do plural.
- source_word: עֲלֵי אָרֶץ
  choice: sobre a terra
  rationale: Mantém a localização da vida humana no âmbito terreno e o registro poético do verso.
