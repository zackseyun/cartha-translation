base_translation:
  language: en
  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: pt
  text: Até quando você continuará dizendo essas coisas[a], e as palavras da sua boca serão um vento impetuoso?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até quando você falará essas coisas, e as palavras da sua boca serão um vento poderoso?”'
    reason: Alternativas lexicais legítimas para תְּמַלֶּל e כַּבִּיר; a nota preserva uma tradução mais formal sem alterar a metáfora.
lexical_decisions:
- source_word: עַד אָן
  choice: Até quando
  rationale: Expressão interrogativa idiomática que introduz uma repreensão impaciente e soa natural em português.
- source_word: תְּמַלֶּל
  choice: você continuará dizendo
  rationale: O contexto favorece uma ação persistente; “continuará dizendo” comunica a impaciência da pergunta sem ultrapassar o campo semântico de falar ou proferir.
- source_word: אֵלֶּה
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e remete de modo amplo às declarações anteriores de Jó, sem repetir antecipadamente “palavras”.
- source_word: וְרוּחַ כַּבִּיר
  choice: e ... serão um vento impetuoso
  rationale: Mantém a metáfora direta de רוּחַ como “vento”. “Impetuoso” expressa a força de כַּבִּיר e, no contexto, a violência retórica atribuída às palavras de Jó.
- source_word: אִמְרֵי פִיךָ
  choice: as palavras da sua boca
  rationale: Conserva a concretude da construção hebraica e o paralelismo poético, em linguagem corrente e digna.
