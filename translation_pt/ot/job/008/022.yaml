  text: שֹׂנְאֶ֥י/ךָ יִלְבְּשׁוּ בֹ֑שֶׁת וְ/אֹ֖הֶל רְשָׁעִ֣ים אֵינֶֽ/נּוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: pt
  text: Os que odeiam você se vestirão de vergonha, e a tenda dos perversos deixará de existir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “a tenda dos perversos não existe”.'
    reason: alternativa lexical e temporal
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: os que odeiam você
  rationale: O particípio ativo qal no plural, com sufixo de segunda pessoa masculina singular, funciona como substantivo. A formulação é natural em português e mantém o objeto pessoal "você".
- source_word: יִלְבְּשׁוּ
  choice: se vestirão de
  rationale: O verbo לבשׁ significa vestir ou usar uma roupa. Com "vergonha", a construção reflexiva preserva de modo claro e natural a metáfora hebraica.
- source_word: בֹשֶׁת
  choice: vergonha
  rationale: Mantém tanto a ideia de humilhação pública quanto a experiência de desonra, sem especificar além do hebraico.
- source_word: וְאֹהֶל
  choice: e a tenda
  rationale: Preserva a imagem concreta de אֹהֶל. Embora possa representar por metonímia a casa ou família, "tenda" continua compreensível no contexto poético.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural substantivado designa uma classe de pessoas moralmente culpadas. "Perversos" é corrente, digno e evita restringir o sentido a um tipo específico de delito.
- source_word: אֵינֶנּוּ
  choice: deixará de existir
  rationale: A forma é literalmente uma negação existencial, "ela não existe". No fluxo futuro dos versículos 20–22, "deixará de existir" comunica naturalmente o resultado anunciado, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Força temporal da oração final
  choice: 'futura/resultativa: "a tenda dos perversos deixará de existir"'
  alternative: 'presente existencial: "a tenda dos perversos não existe"'
  rationale: O contexto imediato anuncia resultados futuros para Jó e seus adversários. A tradução futura acompanha esse fluxo sem ocultar que a forma hebraica, considerada isoladamente, é uma negação existencial não marcada como futuro.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o paralelismo poético, a metáfora de vestir a vergonha e a imagem concreta da tenda. O marcador foi colocado na oração a que a nota efetivamente se refere.
