base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: pt
  text: 'Embora o seu começo tenha sido pequeno[a],

    o seu futuro crescerá muito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o seu começo foi pequeno, e o seu futuro crescerá muito.”'
    reason: Alternativa sintática que traduz as duas conjunções hebraicas de modo coordenado; “Embora” na tradução principal explicita o contraste contextual.
lexical_decisions:
- source_word: וְהָיָה
  choice: Embora ... tenha sido
  rationale: A conjunção com a forma de היה pode ser entendida simplesmente como “e ... foi”, mas, no paralelismo, introduz naturalmente uma circunstância concessiva em contraste com o futuro prometido.
- source_word: רֵאשִׁיתְךָ
  choice: o seu começo
  rationale: רֵאשִׁית indica o começo, a primeira parte ou a condição inicial; “o seu começo” é direto e natural em português.
- source_word: מִצְעָר
  choice: pequeno
  rationale: O termo expressa pequenez ou pouca importância. “Pequeno” mantém de modo conciso o contraste com o grande crescimento posterior.
- source_word: אַחֲרִיתְךָ
  choice: o seu futuro
  rationale: אַחֲרִית pode designar o fim, o resultado posterior ou o futuro. “O seu futuro” evita que “fim” seja entendido como morte, embora expresse um pouco menos diretamente a ideia de resultado final.
- source_word: יִשְׂגֶּה
  choice: crescerá
  rationale: O verbo expressa tornar-se grande, aumentar ou crescer. “Crescerá” comunica com naturalidade o movimento entre um começo pequeno e uma condição posterior abundante.
- source_word: מְאֹד
  choice: muito
  rationale: מְאֹד intensifica fortemente o verbo; “muito” é claro e idiomático com “crescerá”.
theological_decisions: []
