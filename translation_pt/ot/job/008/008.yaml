  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: pt
  text: Pois, pergunte à geração anterior, por favor, e volte sua atenção para a investigação[a] dos pais deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as descobertas dos pais deles”. O substantivo hebraico pode indicar tanto o ato de investigar quanto aquilo que foi descoberto por meio da investigação.
    reason: lexical_alternative
  - marker: b
    text: “Pais” também pode ser entendido em sentido mais amplo como “antepassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a exortação de Bildade como fundamento do que ele acaba de afirmar; “Pois” conserva essa relação discursiva de modo natural.
- source_word: שְׁאַל נָא
  choice: pergunte, por favor
  rationale: O verbo está no imperativo, e נָא acrescenta apelo cortês ou enfático, não necessariamente uma ideia temporal.
- source_word: לְדֹר רִישׁוֹן
  choice: à geração passada
  rationale: דּוֹר significa “geração”, e רִאשׁוֹן, neste contexto, aponta para uma geração anterior, não necessariamente para a primeira de todas.
- source_word: וְכוֹנֵן
  choice: e considere
  rationale: O imperativo de כון expressa aqui a ideia de dirigir ou fixar atentamente a mente em algo; “considere” comunica isso com clareza e naturalidade.
- source_word: לְחֵקֶר
  choice: as descobertas
  rationale: חֵקֶר pode designar tanto a investigação quanto aquilo que ela apurou. No contexto da sabedoria ancestral, “descobertas” comunica naturalmente o resultado da busca, enquanto a nota preserva a ambiguidade lexical.
- source_word: אֲבוֹתָם
  choice: dos pais deles
  rationale: O sufixo retoma mais naturalmente a geração passada. “Pais deles” preserva o modo hebraico de falar dos antepassados, sem impedir a leitura mais ampla indicada em nota.
