id: JOB.8.5
reference: Job 8:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: pt
  text: Mas, se você buscar a Deus com empenho[a] e suplicar o favor do Todo-Poderoso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «buscar a Deus desde cedo»; o verbo hebraico pode ter o sentido de buscar cedo, embora aqui provavelmente indique buscar com empenho ou diligência.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «Shaddai», tradicionalmente traduzido por «Todo-Poderoso».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Mas, se
  rationale: A partícula introduz uma condição; «mas» expressa o contraste discursivo com o versículo anterior, sem perder a força condicional.
- source_word: אַתָּה
  choice: você
  rationale: O pronome de segunda pessoa masculina singular está explícito no hebraico. «Você» oferece ampla legibilidade brasileira e é natural no português moderno.
- source_word: תְּשַׁחֵר
  choice: buscar ... com empenho
  rationale: O piel de שׁחר pode indicar buscar cedo ou buscar com diligência. No contexto, a ideia mais provável é recorrer seriamente a Deus, e «com empenho» conserva esse sentido em linguagem natural.
- source_word: אֶל אֵל
  choice: a Deus
  rationale: A preposição indica direção, expressa naturalmente em português pela regência «buscar a Deus»; אֵל é traduzido pelo título comum «Deus».
- source_word: וְ/אֶל
  choice: e ... do
  rationale: A conjunção coordena as orações. Com o verbo de súplica, a direção para שַׁדַּי é expressa idiomaticamente em português por «suplicar o favor do».
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Traduz o título divino tradicionalmente vertido como «Todo-Poderoso», enquanto a forma hebraica é registrada em nota.
- source_word: תִּתְחַנָּן
  choice: suplicar o favor
  rationale: O hitpael de חנן descreve rogar por graça ou favor. «Suplicar o favor» comunica tanto a intensidade do pedido quanto sua dimensão relacional.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: Todo-Poderoso
  alternative: Shaddai
  rationale: O título é traduzido para comunicar seu sentido tradicional ao leitor, sem transformar uma interpretação etimológica incerta em afirmação dogmática; a transliteração aparece na nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção mantém o paralelismo hebraico e a oração condicional incompleta, que prossegue no versículo seguinte.
