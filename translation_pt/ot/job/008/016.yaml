  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: pt
  text: Ele está cheio de viço diante do sol[a], e seus brotos se estendem sobre o seu jardim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diante do sol” também pode ter o sentido de “exposto ao sol” ou “sob a luz do sol”, não necessariamente “antes do nascer do sol”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e seu broto sai sobre o seu jardim”. O substantivo hebraico singular que indica crescimento tenro pode ser entendido coletivamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: cheio de viço
  rationale: O adjetivo descreve algo úmido, bem irrigado e, por consequência, vigoroso. “Cheio de viço” é natural em português e conserva a imagem vegetal sem reduzi-la simplesmente a “molhado”.
- source_word: הוּא
  choice: ele
  rationale: O pronome masculino mantém a personificação usada na comparação de Bildade, embora a imagem seja a de uma planta.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: diante do sol
  rationale: 'Reproduz o sentido espacial literal da expressão e preserva sua abertura poética: exposto ao sol ou sob a sua luz, sem impor a leitura temporal “antes do nascer do sol”.'
- source_word: וְעַל
  choice: e ... sobre
  rationale: Conserva a coordenação e a relação espacial expressas no hebraico, com sintaxe natural em português.
- source_word: גַּנָּתוֹ
  choice: o seu jardim
  rationale: Traduz diretamente o substantivo com o sufixo possessivo masculino singular.
- source_word: יֹנַקְתּוֹ
  choice: seus brotos
  rationale: O substantivo designa crescimento tenro, broto ou rebento. Embora esteja no singular em hebraico, pode ter valor coletivo; o plural oferece uma imagem clara e natural em português.
- source_word: תֵצֵא
  choice: se estendem
  rationale: O verbo significa literalmente “sair” ou “vir para fora”. No contexto do crescimento vegetal sobre o jardim, “se estendem” expressa naturalmente esse movimento sem perder a imagem.
