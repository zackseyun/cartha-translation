  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: pt
  text: Ele se apoia em sua casa[a], mas ela não fica de pé; agarra-se a ela[b], mas ela não permanece de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confia em sua casa”. O verbo hebraico pode indicar tanto depender de algo para obter sustentação como apoiar-se fisicamente nele.'
    reason: lexical_alternative
  - marker: b
    text: A repetição da imagem de “ficar de pé” e “permanecer de pé” preserva o paralelismo hebraico; o sentido é que aquilo em que ele se apoia se mostra instável.
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: se apoia
  rationale: O nifal de שׁען pode indicar tanto apoiar fisicamente o próprio peso como depender de algo. “Se apoia” preserva a imagem concreta e permite o sentido implícito de confiança.
- source_word: עַל
  choice: em
  rationale: Com “apoiar-se”, a preposição portuguesa idiomática é “em”, expressando contato e sustentação.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: בַּיִת significa normalmente “casa”. Embora a imagem possa representar aquilo em que o ímpio confia, a tradução mantém a figura sem interpretá-la de modo restritivo.
- source_word: וְלֹא יַעֲמֹד
  choice: mas ela não fica de pé
  rationale: עמד significa ficar ou manter-se de pé. O presente convém ao caráter proverbial do verso, e “mas” comunica naturalmente o contraste.
- source_word: יַחֲזִיק בּוֹ
  choice: agarra-se a ela
  rationale: O hifil de חזק com ב pode expressar agarrar ou segurar firmemente. “Agarra-se” mantém a ação física vívida e a ligação com “casa”.
- source_word: וְלֹא יָקוּם
  choice: mas ela não permanece de pé
  rationale: קום pode significar levantar-se, ficar de pé ou manter-se estabelecido. Em paralelo com עמד, “permanece de pé” conserva a imagem de instabilidade e introduz uma leve variação poética.
