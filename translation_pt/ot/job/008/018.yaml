    issue: «for arrancado» não representa de modo suficientemente próximo o verbo בלע.
    rationale: O hebraico usa «engolir/tragar/consumir», não o verbo ou a imagem de arrancar. Embora a remoção esteja implicada pelo contexto vegetal, ela não deve substituir a imagem lexical do original.
  - severity: low
    issue: «Nunca vi você» acrescenta uma universalidade temporal que o perfeito negativo hebraico não explicita.
    rationale: «Não vi você» preserva a negação concreta sem a intensificação interpretativa de «nunca».
  - severity: low
    issue: O marcador da nota b está ligado a «dizendo», embora a nota explique «negará».
    rationale: O marcador deve ancorar-se no vocábulo cuja alternativa lexical é documentada.
