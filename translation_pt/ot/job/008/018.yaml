base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: pt
  text: 'Se ele for tragado de seu lugar[a], então o lugar o negará[b]: “Não vi você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do lugar dela”. O sufixo hebraico pode ter a planta da imagem como referente, embora o texto também a personifique em relação ao perverso.
    reason: lexical_alternative
  - marker: b
    text: Ou “o repudiará” / “agirá falsamente com ele”. O verbo hebraico pode indicar negação, repúdio ou trato enganoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força condicional do hebraico no contexto poético, sem convertê-la em afirmação temporal.
- source_word: יְבַלְּעֶנּוּ
  choice: ele for arrancado
  rationale: O Piel de בלע descreve ser engolido, consumido ou eliminado. No quadro vegetal, “arrancado” comunica naturalmente a remoção completa, sem impor a formulação menos idiomática “engolido do seu lugar”.
- source_word: מִמְּקוֹמוֹ
  choice: do seu lugar
  rationale: O sufixo masculino singular admite referência tanto ao homem retratado quanto à planta da imagem. “Seu” preserva essa ambiguidade em português.
- source_word: וְכִחֶשׁ בּוֹ
  choice: então o lugar o negará
  rationale: כחש pode significar negar, repudiar ou agir falsamente. O lugar é personificado como sujeito, explicitado em português para evitar ambiguidade gramatical.
- source_word: לֹא רְאִיתִיךָ
  choice: Nunca vi você
  rationale: Reproduz a fala direta e a imagem concreta de visão. “Nunca” expressa de modo natural a negação enfática de qualquer vínculo anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “lugar” explicita o sujeito da personificação, que ficaria pouco claro apenas com um pronome. A imagem vegetal e sua aplicação pessoal permanecem deliberadamente sobrepostas.
