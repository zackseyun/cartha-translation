  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: pt
  text: Suas raízes se entrelaçam sobre um monte de pedras[a]; ele contempla uma casa de pedras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele contempla uma casa de pedra” ou “ele olha para dentro de uma casa de pedras”. A expressão hebraica é literalmente “casa de pedras” e pode indicar tanto uma estrutura de pedras como um lugar pedregoso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: sobre
  rationale: Indica a posição das raízes em relação ao amontoado e preserva a imagem de que se estendem por cima das pedras.
- source_word: גַּל
  choice: monte de pedras
  rationale: No contexto, designa provavelmente um amontoado de pedras, não uma onda; a explicitação mantém concreta a imagem poética.
- source_word: שָׁרָשָׁיו
  choice: suas raízes
  rationale: Mantém o plural possessivo e a metáfora da pessoa comparada a uma planta.
- source_word: יְסֻבָּכוּ
  choice: se entrelaçam
  rationale: Expressa raízes enredadas ou entretecidas e soa natural em português, sem exigir que o passivo hebraico seja reproduzido mecanicamente.
- source_word: בֵּית אֲבָנִים
  choice: uma casa de pedras
  rationale: Reproduz de perto a expressão hebraica e conserva sua possível ambiguidade entre uma estrutura construída e um lugar pedregoso.
- source_word: יֶחֱזֶה
  choice: ele contempla
  rationale: Preserva a força visual de 'ver/contemplar' e a personificação masculina singular da figura vegetal.
