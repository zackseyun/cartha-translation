  yaml_path: translation/ot/job/008/011.yaml
  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: pt
  text: Pode o papiro crescer onde não há pântano? Pode o junco florescer sem água?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planta do brejo” em vez de “junco”; o hebraico menciona em paralelo duas plantas de áreas alagadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽגְאֶה
  choice: Pode ... crescer?
  rationale: A partícula interrogativa introduz uma pergunta retórica, e גאה descreve aqui o crescimento de uma planta. A formulação com “pode” transmite naturalmente a impossibilidade implícita.
- source_word: גֹּמֶא
  choice: papiro
  rationale: O termo designa uma planta aquática, provavelmente o papiro, associada a regiões pantanosas; “papiro” preserva a identificação mais específica.
- source_word: בְּ/לֹא בִצָּה
  choice: onde não há pântano
  rationale: בלא expressa ausência, e ביצה indica pântano ou brejo. A construção locativa é clara e natural em português.
- source_word: יִשְׂגֶּה
  choice: florescer
  rationale: Neste contexto vegetal, o verbo comunica crescimento vigoroso ou prosperidade. “Florescer” conserva esse sentido, sem exigir que a planta produza flores literalmente.
- source_word: אָחוּ
  choice: junco
  rationale: O substantivo refere-se a vegetação de áreas alagadas, mas sua identificação botânica exata é incerta. “Junco” é uma designação corrente e compreensível, mantendo o paralelismo com “papiro”.
- source_word: בְלִי מָיִם
  choice: sem água
  rationale: Tradução direta e idiomática da expressão privativa, preservando a dependência da planta em relação à água.
