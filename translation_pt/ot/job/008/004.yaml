id: JOB.8.4
reference: Job 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם בָּנֶ֥י/ךָ חָֽטְאוּ ל֑/וֹ וַֽ֝/יְשַׁלְּחֵ֗/ם בְּ/יַד פִּשְׁעָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: pt
  text: Se os seus filhos pecaram contra ele, ele os entregou nas mãos da transgressão deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele os entregou ao poder da transgressão deles”. A expressão hebraica é literalmente “na mão da transgressão deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva o valor condicional normal da partícula hebraica e não transforma a hipótese de Bildade numa afirmação causal.
- source_word: בָּנֶיךָ
  choice: os seus filhos
  rationale: Traduz o plural masculino de בֵּן de modo direto; em português, “filhos” conserva a forma masculina do hebraico.
- source_word: חָטְאוּ
  choice: pecaram
  rationale: O pretérito perfeito expressa naturalmente a ação concluída indicada pelo qatal hebraico.
- source_word: לוֹ
  choice: contra ele
  rationale: Com חטא, a preposição לְ pode indicar a pessoa ofendida. O pronome é mantido, sem ser substituído explicitamente por “Deus”.
- source_word: וַיְשַׁלְּחֵם
  choice: ele os entregou
  rationale: Embora שלח tenha o sentido básico de enviar, em combinação com “na mão de” comunica a ideia de entregar alguém ao domínio ou às consequências de algo.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva em português a metáfora hebraica de estar sob a mão, isto é, sob o poder de algo; o plural idiomático português torna a imagem natural.
- source_word: פִּשְׁעָם
  choice: a transgressão deles
  rationale: “Transgressão” preserva a nuance de violação deliberada ou rebeldia de פשע e evita nivelá-la com o termo mais amplo חטא usado antes.
theological_decisions:
- issue: Referente de “ele” em “pecaram contra ele”
  choice: Manter o pronome “ele”, cujo referente contextual mais provável é Deus.
  alternative: Explicitar “pecaram contra Deus”.
  rationale: O contexto aponta fortemente para Deus, mas o hebraico usa um pronome. Mantê-lo preserva a forma e a discreta ambiguidade do discurso.
- issue: Relação entre a ação divina e a transgressão dos filhos
  choice: “ele os entregou nas mãos da transgressão deles”
  alternative: “ele os castigou por causa da transgressão deles”
  rationale: A formulação preserva tanto a ação do sujeito quanto a imagem da própria transgressão como poder ao qual eles são entregues, sem impor uma explicação doutrinária mais específica da retribuição.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A metáfora hebraica foi mantida no texto principal de modo idiomático (“nas mãos”), enquanto a nota registra tanto a forma literal no singular quanto a alternativa explicativa “ao poder”.
