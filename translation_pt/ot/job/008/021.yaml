base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: pt
  text: Ele ainda[a] encherá de riso a tua boca e de gritos os teus lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Até que ele encha de riso a tua boca e de gritos os teus lábios.»'
    reason: Alternativa sintática e lexical para עַד, que pode introduzir uma oração temporal com o sentido de «até que».
lexical_decisions:
- source_word: עַד
  choice: ainda
  rationale: No contexto da promessa iniciada no versículo anterior, comunica que Deus ainda realizará essa restauração. A leitura temporal «até que» continua possível e é preservada em nota.
- source_word: יְמַלֵּה
  choice: encherá
  rationale: O piel imperfeito tem aqui força futura e promissória; o sujeito masculino singular implícito é Deus, retomado do contexto imediato.
- source_word: שְׂחוֹק
  choice: riso
  rationale: Reproduz diretamente o sentido comum do substantivo e preserva a imagem concreta de alegria restaurada, sem introduzir a ideia negativa de zombaria.
- source_word: פִּיךָ
  choice: a sua boca
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa masculina singular, mantendo a imagem corporal do paralelismo poético.
- source_word: וּשְׂפָתֶיךָ
  choice: e os seus lábios
  rationale: Preserva o paralelismo concreto com «a sua boca», em vez de substituir a imagem por uma abstração como «fala».
- source_word: תְרוּעָה
  choice: gritos
  rationale: O termo designa um clamor forte, muitas vezes alegre ou triunfal. «Gritos» mantém a amplitude lexical; o contexto de «riso» sinaliza seu caráter positivo sem explicitá-lo além do hebraico.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: «Ele», isto é, Deus, fica implícito na forma verbal portuguesa «encherá» e é retomado do contexto imediato.
  alternative: 'Formulação passiva: «a sua boca ainda se encherá de riso».'
  rationale: O versículo 20 apresenta Deus como agente, e o verbo hebraico masculino singular prossegue naturalmente com esse sujeito. A forma ativa conserva a afirmação de que a restauração procede de Deus, sem acrescentar seu nome ao texto deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem «encherá de riso a sua boca» evita rigidez excessiva e mantém o paralelismo poético entre boca/riso e lábios/gritos. O pronome de tratamento «sua» é amplamente compreensível no português contemporâneo.
