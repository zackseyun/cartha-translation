source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: pt
  text: Assim são as veredas de todos os que se esquecem de Deus; e a esperança do ímpio[a] perecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hipócrita”. O termo hebraico pode designar uma pessoa irreverente ou sem devoção a Deus; neste contexto, “ímpio” expressa melhor o sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Introduz a conclusão comparativa decorrente da imagem dos versículos anteriores, preservando de modo natural a força inferencial do hebraico.
- source_word: אָרְחוֹת
  choice: veredas
  rationale: Mantém a imagem concreta de caminhos como metáfora do curso da vida; o plural do hebraico é preservado.
- source_word: שֹׁכְחֵי אֵל
  choice: todos os que se esquecem de Deus
  rationale: Expressa idiomaticamente a construção participial hebraica. אֵל funciona aqui como designação comum de Deus, não como nome próprio a ser transliterado.
- source_word: תִקְוַת
  choice: a esperança do
  rationale: “Esperança” comunica de modo natural a expectativa confiante indicada pelo substantivo no contexto sapiencial.
- source_word: חָנֵף
  choice: ímpio
  rationale: Em Jó, o termo geralmente caracteriza alguém moral e religiosamente irreverente, não apenas uma pessoa insincera; “ímpio” preserva esse sentido amplo.
- source_word: תֹּאבֵד
  choice: perecerá
  rationale: Traduz o valor de אבד com a gravidade adequada ao contexto de juízo e mantém a forma verbal futura do enunciado.
theological_decisions:
- issue: Sentido de חָנֵף no contexto sapiencial de juízo
  choice: ímpio
  alternative: hipócrita
  rationale: “Hipócrita” poderia restringir o termo à falsidade ou à incoerência pessoal. “Ímpio” representa melhor sua dimensão moral e religiosa em Jó sem impor uma categoria psicológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Veredas” conserva a metáfora poética sem soar arcaico demais; a estrutura paralela e a tensão sapiencial do hebraico foram mantidas.
