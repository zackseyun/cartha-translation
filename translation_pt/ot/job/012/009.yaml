source:
  edition: WLC
  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: pt
  text: Quem, entre todos estes, não sabe que foi a mão de Yahweh que fez isso?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Quem... não sabe
  rationale: A pergunta retórica hebraica é expressa naturalmente no presente em português e pressupõe que todos reconhecem o fato.
- source_word: בְּכָל אֵלֶּה
  choice: entre todos estes
  rationale: 'A preposição בְּ tem aqui sentido partitivo: “entre/de todos estes”, retomando os seres mencionados nos versículos anteriores.'
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que se sabe.
- source_word: יַד
  choice: a mão
  rationale: Preserva a imagem hebraica comum para agência e poder, sem reduzi-la a uma explicação abstrata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָשְׂתָה זֹּאת
  choice: fez isso
  rationale: עָשָׂה pode significar “fazer” ou “realizar”; o pretérito perfeito e o demonstrativo singular reproduzem de modo natural a construção hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio YHWH. “Yahweh” preserva esse nome, enquanto “SENHOR” representa a substituição tradicional por um título.
- issue: Ênfase da construção כִּי יַד יְהוָה עָשְׂתָה זֹּאת
  choice: que foi a mão de Yahweh que fez isso
  alternative: que a mão de Yahweh fez isso
  rationale: A construção clivada é idiomática em português e ressalta a agência divina expressa pela imagem da “mão”, sem alterar o conteúdo proposicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Estes” mantém a referência aos seres vivos dos versículos anteriores; a imagem concreta da “mão” e o nome divino são preservados.
