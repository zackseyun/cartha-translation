  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: pt
  text: Com ele estão a força e a sabedoria eficaz; pertencem a ele tanto aquele que se desvia como aquele que leva outros a se desviar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o enganado e o enganador”. Essa formulação é possível no contexto, mas o texto principal preserva o contraste verbal das formas hebraicas: um se desvia, e o outro leva alguém a se desviar.'
    reason: Alternativa lexical para os dois particípios hebraicos.
lexical_decisions:
- source_word: עִמּוֹ
  choice: Com ele estão
  rationale: 'Preserva a expressão hebraica de associação e posse: a força e a sabedoria pertencem a Deus e estão à sua disposição.'
- source_word: עֹז
  choice: força
  rationale: Equivalente corrente e natural para a ideia de força ou poder expressa pelo substantivo.
- source_word: תּוּשִׁיָּה
  choice: sabedoria eficaz
  rationale: Comunica não apenas sabedoria abstrata, mas discernimento sólido, prático e capaz de produzir resultado, nuance frequente do termo na literatura sapiencial.
- source_word: לוֹ
  choice: pertencem a ele
  rationale: Explicita a relação de posse ou domínio indicada pela preposição com sufixo, em paralelo com a primeira oração.
- source_word: שֹׁגֵג
  choice: aquele que se desvia
  rationale: 'Preserva o valor ativo e intransitivo do particípio Qal: alguém que erra ou se desvia.'
- source_word: מַשְׁגֶּה
  choice: aquele que leva outros a se desviar
  rationale: Expressa o valor causativo do particípio Hifil e mantém o contraste verbal com aquele que se desvia.
theological_decisions:
- issue: A relação de Deus com quem se desvia e com quem leva outros a se desviar
  choice: Ambos pertencem a ele, isto é, estão sob seu domínio, sem especificar causalidade moral.
  alternative: Deus conhece ambos; Deus governa providencialmente ambos; Deus causa diretamente o erro e o engano.
  rationale: O hebraico faz uma afirmação forte de posse ou domínio, mas não define de que modo Deus se relaciona causalmente com o desvio. A formulação conserva essa tensão sem transformar Deus explicitamente no autor moral do engano.
translation_notes:
  register: Português moderno, claro e digno, com construção paralela. “Sabedoria eficaz” evita reduzir תּוּשִׁיָּה a sabedoria abstrata; “leva outros a se desviar” torna natural em português o sentido causativo do segundo particípio.
