base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: pt
  text: Ele tira o entendimento dos líderes do povo da terra[a] e os faz vaguear por um deserto sem caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos líderes do povo do país”. Literalmente: “cabeças do povo da terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “num lugar desolado, sem caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: tira
  rationale: O particípio no hifil expressa a ação de remover ou tirar. “Tira” é direto, natural e mantém o caráter geral da afirmação.
- source_word: לֵב
  choice: entendimento
  rationale: Embora signifique literalmente “coração”, aqui לֵב designa a capacidade interior de pensar e julgar; “entendimento” evita uma leitura meramente emocional.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: os líderes dos povos da terra
  rationale: רָאשֵׁי, literalmente “cabeças de”, funciona como expressão para líderes. A construção hebraica permite relacionar הָאָרֶץ a “terra” e entender עַם coletivamente; a redação escolhida é natural e preserva o possível alcance amplo da expressão.
- source_word: וַיַּתְעֵם
  choice: e os faz vaguear
  rationale: A forma causativa de תעה indica que Deus os faz andar sem direção; “faz vaguear” conserva tanto a causalidade quanto a imagem espacial.
- source_word: בְּתֹהוּ לֹא דָרֶךְ
  choice: por um deserto sem caminho
  rationale: תֹהוּ descreve um espaço vazio e desolado, enquanto לֹא דָרֶךְ significa literalmente “sem caminho”. A formulação mantém a imagem concreta e a desorientação dos líderes.
theological_decisions:
- issue: Sujeito implícito das formas verbais
  choice: Deus é mantido como o agente por meio do pronome “Ele”, conforme o contexto imediato.
  alternative: Deixar o sujeito inteiramente implícito em português.
  rationale: No contexto de Jó 12, os verbos continuam descrevendo as ações de Deus. O pronome explicita a continuidade sintática necessária em português sem acrescentar uma interpretação doutrinária.
- issue: Alcance de עַם הָאָרֶץ
  choice: “dos povos da terra”, leitura de alcance amplo.
  alternative: “do povo da terra”, possível referência aos líderes de uma população ou território específico.
  rationale: A expressão é lexicalmente ambígua, pois עַם pode ser coletivo e אֶרֶץ pode significar “terra”, “país” ou “território”. A alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Líderes” traduz o idiomatismo “cabeças”, e “deserto sem caminho” conserva a imagem poética sem soar artificial.
