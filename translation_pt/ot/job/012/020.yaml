  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: pt
  text: 'Ele tira a fala dos que são dignos de confiança[a]

    e priva os anciãos do discernimento.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tira o lábio dos que são confiáveis”; isto é, priva-os da fala ou da eloquência.
    reason: lexical_alternative
  - marker: b
    text: Ou “juízo”, “sensatez” ou “entendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: tira
  rationale: O particípio hifil expressa a ação de remover ou tirar. “Tira” é natural em português e mantém o paralelismo sem tornar os dois membros idênticos.
- source_word: שָׂפָה
  choice: a palavra
  rationale: Literalmente “lábio”, aqui é uma metonímia para fala ou capacidade de se expressar. “A palavra” comunica de modo digno e natural a privação da fala.
- source_word: לְנֶאֱמָנִים
  choice: dos que são dignos de confiança
  rationale: נֶאֱמָנִים pode designar pessoas fiéis, confiáveis ou merecedoras de confiança. A formulação preserva a nuance social sem restringir o termo a um cargo ou ao sexo masculino.
- source_word: טַעַם
  choice: discernimento
  rationale: Embora o sentido concreto seja “sabor”, o uso figurado indica juízo, sensatez ou capacidade de discernir, especialmente apropriada aos anciãos.
- source_word: זְקֵנִים
  choice: os anciãos
  rationale: O termo pode indicar idosos ou pessoas mais velhas reconhecidas por experiência e posição. “Anciãos” preserva tanto a idade quanto a possível dignidade social.
- source_word: יִקָּח
  choice: priva
  rationale: O verbo significa literalmente “toma”, mas neste paralelismo tem sentido privativo. “Priva” explicita naturalmente em português que Deus lhes retira o discernimento.
