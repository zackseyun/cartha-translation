base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: pt
  text: Eles tateiam nas trevas, sem luz; ele os faz cambalear[a] como um embriagado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os faz vaguear”. O verbo hebraico pode indicar vaguear ou andar sem rumo; neste contexto, a comparação com um embriagado favorece “os faz cambalear”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: tateiam
  rationale: O piel imperfeito de משש descreve procurar ou avançar pelo tato quando não se pode ver. “Tateiam” preserva de modo natural essa imagem em português.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: “Trevas” expressa a escuridão física ou figurada do contexto e forma uma combinação idiomática com “tateiam”.
- source_word: וְלֹא אוֹר
  choice: sem luz
  rationale: Embora a construção seja literalmente “e não luz”, “sem luz” transmite o contraste de maneira clara e natural.
- source_word: וַיַּתְעֵם
  choice: ele os faz cambalear
  rationale: A forma de תעה é causativa, com sujeito singular implícito e objeto masculino plural. O verbo pode indicar vaguear ou andar sem rumo; a comparação seguinte com um embriagado favorece “cambalear” no texto, sem eliminar a alternativa lexical.
- source_word: כַּשִּׁכּוֹר
  choice: como um embriagado
  rationale: O termo designa uma pessoa bêbada. “Um embriagado” mantém o singular da comparação e um registro digno e corrente.
theological_decisions:
- issue: Sujeito implícito de וַיַּתְעֵם
  choice: ele os faz cambalear
  alternative: eles cambaleiam
  rationale: A forma verbal é terceira pessoa masculina singular com sufixo de objeto masculino plural; portanto, o hebraico apresenta um agente singular implícito — Deus no contexto — que os faz andar desorientados.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tateiam nas trevas” preserva a imagem poética, e “embriagado” evita um tom excessivamente coloquial.
