  text: הֲ/לֹא אֹ֭זֶן מִלִּ֣ין תִּבְחָ֑ן וְ֝/חֵ֗ךְ אֹ֣כֶל יִטְעַם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/011.yaml
  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: pt
  text: Não é o ouvido que examina as palavras[a], assim como o paladar prova a comida?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «põe à prova o que é dito».'
    reason: Alternativa lexical que preserva a amplitude de מִלִּין e תִּבְחָן, podendo referir-se ao discurso e ao seu exame.
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é... que
  rationale: Introduz uma pergunta retórica que espera concordância; esta construção preserva a força interrogativa em português natural.
- source_word: אֹזֶן
  choice: ouvido
  rationale: Mantém a imagem concreta do órgão da audição, usado aqui também para a capacidade de discernir.
- source_word: מִלִּין
  choice: palavras
  rationale: Equivalente direto do plural aramaizante/hebraico para palavras ou declarações, adequado ao paralelismo.
- source_word: תִּבְחָן
  choice: examina
  rationale: Expressa a ideia de submeter palavras a avaliação; em português, combina naturalmente com «palavras» e preserva o sentido de testar.
- source_word: חֵךְ
  choice: paladar
  rationale: Embora o termo designe literalmente o céu da boca ou palato, «paladar» comunica com naturalidade o órgão/faculdade que prova, sem perder o paralelismo sensorial.
- source_word: אֹכֶל
  choice: comida
  rationale: Tradução concreta e corrente para aquilo que se come.
- source_word: יִטְעַם
  choice: prova
  rationale: O verbo significa provar pelo gosto; «prova» também ecoa discretamente a ideia de avaliação no primeiro membro.
- source_word: לוֹ
  choice: não expresso separadamente
  rationale: O pronome dativo pode ter valor idiomático ou de interesse próprio. Torná-lo explícito como «para si» seria pouco natural e poderia sugerir uma ênfase reflexiva indevida; o sentido está incorporado no ato de o paladar provar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo claro entre ouvir e saborear. «Paladar» foi preferido a «palato» por ser mais natural para leitores comuns, e «comida» a «alimento» por sua clareza cotidiana.
