  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: pt
  text: Com ele estão a sabedoria e o poder; a ele pertencem o conselho e o entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: Com ele estão
  rationale: A preposição עִם com sufixo significa naturalmente “com ele”. Em português, a construção expressa associação e, no paralelismo poético, sugere que essas qualidades se encontram junto de Deus sem substituir a preposição por “nele”.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: Equivalente corrente de חָכְמָה, abrangendo sabedoria, capacidade e compreensão verdadeira.
- source_word: וּגְבוּרָה
  choice: e o poder
  rationale: גְבוּרָה pode indicar força, poder ou valentia. “Poder” soa natural e digno em português e, neste contexto, descreve a capacidade soberana de Deus.
- source_word: לוֹ
  choice: a ele pertencem
  rationale: O ל com sufixo marca posse na oração sem verbo. “A ele pertencem” explicita essa relação de modo natural e preserva o paralelismo.
- source_word: עֵצָה
  choice: o conselho
  rationale: עֵצָה designa conselho, deliberação ou plano. “Conselho” mantém a amplitude do termo e o registro poético.
- source_word: וּתְבוּנָה
  choice: e o entendimento
  rationale: תְבוּנָה denota entendimento, discernimento ou perspicácia. “Entendimento” é claro, corrente e adequado ao paralelo com conselho e sabedoria.
theological_decisions:
- issue: Referente dos sufixos pronominais masculinos
  choice: Manter “ele”, deixando que o contexto identifique Deus
  alternative: Explicitar “Deus” no versículo
  rationale: O contexto imediato identifica Deus como referente, mas o hebraico emprega apenas sufixos pronominais. Manter o pronome evita acrescentar um nome ausente do verso.
- issue: Relação das qualidades com Deus
  choice: Preservar tanto a associação de עִמּוֹ quanto a posse indicada por לוֹ
  alternative: Uniformizar ambas as metades como “nele estão” ou “dele são”
  rationale: As duas construções hebraicas não são idênticas. A tradução conserva a variação poética e não transforma associação em inerência metafísica explícita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo equilibrado. “Poder” foi preferido a “força” por se ajustar melhor à descrição contextual da soberania divina; nenhuma nota é necessária porque a alternativa “nele” é menos direta que o hebraico עִם e pode ser preservada adequadamente na documentação lexical.
