  text: מַשְׂגִּ֣יא לַ֭/גּוֹיִם וַֽ/יְאַבְּדֵ֑/ם שֹׁטֵ֥חַ לַ֝/גּוֹיִ֗ם וַ/יַּנְחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: pt
  text: Ele engrandece as nações e as destrói; amplia as nações e as conduz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estende as nações e as leva embora”. O primeiro verbo pode evocar extensão ou expansão; o último também pode ser entendido, no contexto, como conduzir para longe.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: engrandece
  rationale: O particípio causativo de שׂגא indica fazer crescer ou tornar grande. “Engrandece” preserva esse sentido sem especificar prosperidade.
- source_word: לַגּוֹיִם
  choice: as nações
  rationale: גּוֹיִם refere-se aqui, de modo amplo, a povos organizados como nações, sem estabelecer contraste específico entre Israel e gentios.
- source_word: וַיְאַבְּדֵם
  choice: e as destrói
  rationale: A forma verbal expressa fazer perecer ou destruir; a tradução é direta e mantém o contraste com o engrandecimento das nações.
- source_word: שֹׁטֵחַ
  choice: amplia
  rationale: O particípio de שטח sugere estender ou espalhar. Aplicado a nações, “amplia” comunica naturalmente expansão territorial ou de influência.
- source_word: וַיַּנְחֵם
  choice: e as leva embora
  rationale: נחה significa conduzir ou guiar. Neste paralelismo sobre ascensão e queda nacionais, “leva embora” preserva a ideia de condução com possível remoção, sem torná-la necessariamente benevolente.
theological_decisions:
- issue: Sentido do movimento das nações no segundo hemistíquio
  choice: Deus amplia as nações e depois as conduz para longe ou as remove.
  alternative: Deus amplia as nações e as guia.
  rationale: O contexto ressalta a soberania divina sobre a ascensão e a queda das nações. Embora נחה possa significar “guiar”, o paralelismo com destruição permite uma condução que resulta em afastamento; a nota conserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética concisa. “Engrandece” e “amplia” distinguem os dois verbos de expansão; “leva embora” mantém a tensão contextual, enquanto a nota registra a leitura mais neutra “guia”.
