  - severity: low
    issue: “Transtornam” é menos preciso para וְיַהַפְכוּ.
    rationale: No contexto das águas liberadas, o verbo descreve revolver, virar ou subverter a terra. “Revolvem” conserva melhor a imagem material e destrutiva, sem restringi-la a uma catástrofe determinada.
