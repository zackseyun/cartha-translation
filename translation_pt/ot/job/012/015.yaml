  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: pt
  text: 'Eis: se ele retém as águas, elas secam; se as solta, elas revolvem a terra[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a região”. A palavra hebraica pode se referir à terra em sentido amplo ou a uma região específica, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula que chama a atenção para uma afirmação enfática e vívida. “Vejam” comunica essa força em português atual, sem o tom arcaico de “Eis”.
- source_word: יַעְצֹר בַּמַּיִם
  choice: retém as águas
  rationale: O verbo עצר expressa conter ou impedir o fluxo. “Retém” é conciso e preserva a ideia do domínio de Deus sobre as águas.
- source_word: וְיִבָשׁוּ
  choice: elas secam
  rationale: Mantém o sujeito gramatical plural implícito do hebraico, retomado em português pelas águas, sem explicar além do que o verso declara.
- source_word: וִישַׁלְּחֵם
  choice: se as solta
  rationale: O sufixo pronominal retoma naturalmente as águas. “Solta” expressa sua liberação e mantém o paralelismo condicional com a primeira oração.
- source_word: וְיַהַפְכוּ
  choice: elas transtornam
  rationale: הפך descreve uma inversão ou perturbação violenta. “Transtornam” preserva a imagem de upheaval destrutivo sem reduzi-la explicitamente a uma inundação.
- source_word: אָרֶץ
  choice: a terra
  rationale: “Terra” preserva em português a amplitude lexical de אֶרֶץ, que pode designar tanto o mundo terrestre quanto uma região ou território.
theological_decisions:
- issue: Alcance de אֶרֶץ na descrição poética da soberania divina
  choice: a terra
  alternative: o território; o solo
  rationale: A formulação ampla se ajusta ao retrato cósmico do poder de Deus, mas a nota conserva a possibilidade lexical mais localizada sem vincular o verso a um episódio específico de inundação.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo equilibrado. O plural “águas” e a repetição pronominal preservam a forma poética hebraica; “Vejam” dá força ao chamado de atenção inicial.
