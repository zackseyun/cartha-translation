  text: וְֽ/אוּלָ֗ם שְׁאַל נָ֣א בְהֵמ֣וֹת וְ/תֹרֶ֑/ךָּ וְ/ע֥וֹף הַ֝/שָּׁמַ֗יִם וְ/יַגֶּד לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: pt
  text: Mas, por favor, pergunte aos animais, e eles lhe ensinarão; pergunte às aves dos céus[a], e elas lhe contarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às aves do céu”. O hebraico traz literalmente “às aves dos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Introduz uma mudança contrastiva na fala de Jó; “Mas” é natural, conciso e fiel ao valor adversativo.
- source_word: שְׁאַל נָא
  choice: por favor, pergunte
  rationale: O imperativo significa “pergunte”, e נָא acrescenta apelo ou insistência cortês, não necessariamente uma referência temporal como “agora”.
- source_word: בְהֵמוֹת
  choice: aos animais
  rationale: Neste contexto, o termo abrange animais terrestres em geral, e não apenas gado; “animais” também forma um paralelo claro com as aves.
- source_word: וְתֹרֶךָּ
  choice: e eles lhe ensinarão
  rationale: A forma causativa de ירה significa “ensinar, instruir”. Embora o verbo hebraico esteja no feminino singular em concordância com um substantivo coletivo, o português emprega naturalmente o plural com “animais”.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: às aves dos céus
  rationale: עוֹף designa criaturas voadoras e, aqui, “aves” é a opção natural. “Dos céus” preserva de perto o plural hebraico e o tom poético.
- source_word: וְיַגֶּד לָךְ
  choice: e elas lhe contarão
  rationale: O causativo de נגד significa “contar, declarar, dar a conhecer”. “Contarão” é claro e corrente; o plural concorda naturalmente com “aves” em português.
- source_word: שְׁאַל … וְעוֹף
  choice: pergunte … pergunte às aves
  rationale: O segundo “pergunte” explicita em português a elipse do imperativo hebraico, evitando uma construção truncada sem alterar o sentido.
