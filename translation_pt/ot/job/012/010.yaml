base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: pt
  text: Em cuja mão está a vida de todo ser vivo[a] e o sopro de toda a humanidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a alma de todo ser vivo e o espírito de toda carne humana”.'
    reason: Registra traduções lexicais mais formais de נֶפֶשׁ, רוּחַ e כָּל בְּשַׂר אִישׁ, preservando a possibilidade antropológica do original.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Em cuja mão
  rationale: A combinação do relativo com a expressão preposicional é vertida de modo natural, preservando a metáfora hebraica da mão como domínio e poder.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste paralelismo, o termo indica a vida que anima os seres vivos; “vida” evita impor ao texto uma distinção posterior e mais estreita entre corpo e alma.
- source_word: כָּל חָי
  choice: todo ser vivo
  rationale: Expressa de maneira abrangente e natural tudo o que vive, sem restringir indevidamente a referência.
- source_word: וְרוּחַ
  choice: e o sopro
  rationale: No paralelismo com נֶפֶשׁ e em relação à humanidade mortal, רוּחַ designa naturalmente o sopro vital, embora também possa ser traduzido por “espírito”.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: de toda a humanidade
  rationale: A expressão literalmente ligada à “carne humana” refere-se coletivamente aos seres humanos em sua condição mortal; esta formulação comunica o sentido com clareza em português atual.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ e רוּחַ
  choice: “vida” e “sopro”
  alternative: “alma” e “espírito”
  rationale: A escolha ressalta o domínio de Deus sobre a vida de criaturas e seres humanos sem introduzir uma dicotomia antropológica mais definida do que o hebraico exige; a alternativa é registrada em nota.
- issue: Referência humana coletiva em כָּל בְּשַׂר אִישׁ
  choice: “toda a humanidade”
  alternative: “toda carne humana”
  rationale: A formulação escolhida conserva a abrangência coletiva e é mais idiomática, enquanto a alternativa reproduz mais visivelmente a imagem hebraica da carne mortal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a metáfora “em cuja mão” e usa equivalência ótima no paralelismo antropológico.
