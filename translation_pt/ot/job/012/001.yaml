  footnotes:
  - marker: a
    text: 'Ou: “E Jó respondeu e disse.”'
    reason: Alternativa lexical para o waw inicial, que pode ser representado por “Então” ou, mais literalmente, por “E”.
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, na forma narrativa wayyiqtol, introduz a réplica de Jó ao discurso anterior; “respondeu” preserva a fórmula convencional do diálogo.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: O verbo אמר, na forma narrativa wayyiqtol, é o verbo comum de fala; “e disse” conserva a fórmula hebraica sem paráfrase desnecessária.
- source_word: וַ
  choice: Então
  rationale: O waw prefixado ao verbo inicial assinala a sequência narrativa. “Então” é natural em português moderno e indica a progressão do diálogo; “E” também é possível.
