  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: pt
  text: 'Derrama desprezo sobre os nobres[a]

    e afrouxa o cinturão dos poderosos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «príncipes».
    reason: lexical_alternative
  - marker: b
    text: Ou «fortes». Afrouxar o cinturão retrata a perda de força, prontidão ou autoridade.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: derrama
  rationale: Preserva a metáfora concreta do verbo שׁפך, que significa derramar, e forma em português a expressão natural «derramar desprezo sobre».
- source_word: בּוּז
  choice: desprezo
  rationale: Expressa o sentido de desdém ou humilhação pública e se encaixa naturalmente com «derrama».
- source_word: נְדִיבִים
  choice: nobres
  rationale: Neste contexto de inversão da posição social, designa pessoas de elevada condição ou autoridade; «nobres» evita restringir o termo a príncipes de uma monarquia.
- source_word: מְזִיחַ
  choice: cinturão
  rationale: Designa a faixa ou cinto usado para cingir o corpo. «Cinturão» preserva a imagem antiga com clareza e dignidade em português moderno.
- source_word: אֲפִיקִים
  choice: poderosos
  rationale: No paralelismo com «nobres», refere-se a pessoas fortes ou detentoras de poder. «Poderosos» comunica bem a dimensão social sem excluir a ideia de força.
- source_word: רִפָּה
  choice: afrouxa
  rationale: O verbo רפה indica tornar frouxo ou soltar. «Afrouxa» preserva a ação concreta aplicada ao cinturão.
theological_decisions:
- issue: Imagem metafórica da humilhação e perda de poder causadas por Deus
  choice: afrouxa o cinturão dos poderosos
  alternative: desarma os poderosos; tira a força dos poderosos
  rationale: A formulação mantém a imagem concreta e a tensão poética do hebraico, sem limitá-la a uma interpretação exclusivamente militar nem substituir a metáfora por sua provável implicação.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é poética, concisa e digna; o paralelismo hebraico e a metáfora do cinturão foram preservados.
