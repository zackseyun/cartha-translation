  text: מוּסַ֣ר מְלָכִ֣ים פִּתֵּ֑חַ וַ/יֶּאְסֹ֥ר אֵ֝ז֗וֹר בְּ/מָתְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: pt
  text: Ele desata as amarras dos reis[a] e ata um cinto em volta da cintura deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a disciplina dos reis”. O substantivo hebraico pode indicar disciplina, amarras ou vínculos; “amarras” se ajusta melhor ao contraste entre “desata” e “ata”.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato da imagem é incerto. Ela pode sugerir humilhação ou sujeição — Deus destitui reis de seu poder e os trata como servos ou prisioneiros —, embora cingir alguém também possa evocar preparação para agir.
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: amarras
  rationale: O substantivo pode significar “disciplina” ou uma atadura, vínculo ou grilhão. Com o verbo “desatar” e em contraste com “ata”, o sentido concreto “amarras” comunica melhor o paralelismo sem especificar indevidamente o tipo de restrição.
- source_word: פִּתֵּחַ
  choice: desata
  rationale: O verbo significa literalmente “abrir” e, neste contexto, “soltar” ou “desatar”. “Desata” conserva a imagem física e forma um contraste claro com “ata”.
- source_word: מְלָכִים
  choice: reis
  rationale: É o equivalente direto e comum do substantivo hebraico; “governantes” seria uma generalização desnecessária.
- source_word: וַיֶּאְסֹר
  choice: ata
  rationale: O verbo significa “atar” ou “prender”. “Ata” mantém a imagem concreta e espelha naturalmente “desata” na primeira oração.
- source_word: אֵזוֹר
  choice: cinto
  rationale: O termo designa um cinto ou faixa usada em torno da cintura. “Cinto” é claro, atual e suficientemente neutro para não resolver a função ambígua da imagem.
- source_word: בְּמָתְנֵיהֶם
  choice: à cintura deles
  rationale: A expressão se refere à cintura ou aos lombos. Esta formulação é natural no português moderno e evita o tom arcaico de “lombos”.
theological_decisions:
- issue: Sentido da imagem de reversão aplicada aos reis
  choice: Manter literalmente o contraste entre Deus desatar as amarras dos reis e atar-lhes um cinto, sem definir de modo conclusivo o efeito dessa ação.
  alternative: Interpretar que Deus liberta os reis e os prepara para agir; ou que remove sua autoridade e depois os subjuga.
  rationale: O hebraico é conciso e metafórico. Os verbos opostos sugerem uma reversão sob a soberania divina, mas não determinam sem ambiguidade se o cinto representa humilhação, sujeição ou preparação. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo “desata/ata” reproduz a força retórica do hebraico, e “à cintura” evita linguagem arcaica.
