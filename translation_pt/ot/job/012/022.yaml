  text: מְגַלֶּ֣ה עֲ֭מֻקוֹת מִנִּי חֹ֑שֶׁךְ וַ/יֹּצֵ֖א לָ/א֣וֹר צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: pt
  text: Ele revela coisas profundas das trevas e traz à luz a sombra da morte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trevas profundas” ou “escuridão mortal” (hebraico צַלְמָוֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: revela
  rationale: O particípio de גלה expressa descobrir ou tornar conhecido; “revela” conserva os dois matizes e é natural em português.
- source_word: עֲמֻקוֹת
  choice: coisas profundas
  rationale: O adjetivo feminino plural substantivado pode indicar coisas, lugares ou realidades profundas e ocultas. “Coisas profundas” preserva o plural e a abertura entre os sentidos espacial e metafórico.
- source_word: מִנִּי חֹשֶׁךְ
  choice: em meio às trevas
  rationale: A expressão indica que aquilo que estava oculto nas trevas é revelado. “Em meio às trevas” comunica naturalmente essa proveniência sem sugerir que as coisas profundas sejam produzidas pela escuridão.
- source_word: וַיֹּצֵא
  choice: traz
  rationale: 'O hifil de יצא tem força causativa: fazer sair. Na construção portuguesa “traz à luz”, essa causalidade é transmitida de modo claro e idiomático.'
- source_word: לָאוֹר
  choice: à luz
  rationale: Marca o movimento em direção à luz; “traz à luz” é uma expressão portuguesa natural e mantém a imagem do hebraico.
- source_word: צַלְמָוֶת
  choice: a sombra da morte
  rationale: A tradução tradicional é lexicalmente possível e preserva a força poética, enquanto a alternativa “trevas profundas” é registrada em nota.
theological_decisions:
- issue: Tradução de צַלְמָוֶת
  choice: a sombra da morte
  alternative: trevas profundas; escuridão mortal
  rationale: A questão é lexical e poética, não uma definição doutrinária. A leitura tradicional combina com a imagem de Deus expondo o que está mais oculto, mas a compreensão do termo como escuridão extrema continua possível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a ambiguidade lexical relevante sem recorrer a linguagem excessivamente arcaica.
