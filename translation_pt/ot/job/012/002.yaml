  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: pt
  text: Sem dúvida, vocês é que são o povo[a], e com vocês morrerá a sabedoria!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente vocês são o povo, e com vocês perecerá a sabedoria”. A frase é geralmente entendida como ironia dirigida aos amigos de Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Sem dúvida
  rationale: A combinação introduz uma afirmação enfática usada aqui com evidente ironia. “Sem dúvida” é natural em português e preserva o tom mordaz.
- source_word: אַתֶּם
  choice: vocês
  rationale: Pronome de segunda pessoa masculina plural dirigido aos amigos de Jó; “vocês” oferece ampla legibilidade brasileira.
- source_word: עָם
  choice: o povo
  rationale: Mantém o substantivo coletivo e o artigo da expressão idiomática, cuja força irônica sugere que os interlocutores se consideram a totalidade do povo relevante.
- source_word: וְעִמָּכֶם
  choice: e com vocês
  rationale: 'Reproduz diretamente a ideia de acompanhamento: a sabedoria morreria juntamente com eles.'
- source_word: תָּמוּת
  choice: morrerá
  rationale: Tradução direta do qal imperfeito de מות, no feminino singular em concordância com “sabedoria”; preserva a personificação vívida.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: Equivalente usual e contextualmente adequado, referindo-se à sabedoria que os amigos parecem reivindicar de modo exclusivo.
