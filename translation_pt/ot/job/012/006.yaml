  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: pt
  text: As tendas dos devastadores estão tranquilas, e os que provocam a Deus vivem seguros — aqueles cujo deus lhe põe [algo] na mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqueles que Deus põe em sua mão”; ou: “aqueles em cujas mãos Deus põe [algo]”. O hebraico da oração final é difícil e pode se referir à providência do Deus verdadeiro ou, ironicamente, ao próprio poder do perverso como seu “deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: estão tranquilas
  rationale: O verbo derivado de שלה comunica sossego e tranquilidade, não apenas prosperidade material; a expressão preserva o contraste irônico do contexto.
- source_word: אֹהָלִים
  choice: tendas
  rationale: Mantém a imagem concreta do hebraico, embora no poema as tendas também representem as casas ou famílias de seus moradores.
- source_word: לְשֹׁדְדִים
  choice: dos devastadores
  rationale: O particípio designa pessoas que saqueiam e destroem violentamente. “Devastadores” conserva essa amplitude sem limitar o sentido ao furto.
- source_word: וּבַטֻּחוֹת
  choice: vivem seguros
  rationale: Expressa a segurança indicada por בטח e forma um paralelismo natural com “estão tranquilas”.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: os que provocam a Deus
  rationale: O particípio causativo de רגז descreve os que provocam ou despertam a ira de Deus; a formulação é clara e idiomática em português.
- source_word: לַאֲשֶׁר
  choice: aqueles cujo
  rationale: É entendido como introdução de uma oração relativa que continua descrevendo os ímpios seguros. A dificuldade sintática é registrada em nota.
- source_word: הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: cujo deus põe em suas mãos
  rationale: A tradução toma אֱלוֹהַּ como sujeito e entende בְּיָדוֹ no sentido de colocar algo sob posse ou poder. A ausência de objeto explícito e outras análises possíveis tornam a oração deliberadamente difícil; as alternativas são preservadas em nota.
theological_decisions:
- issue: Referente de אֱלוֹהַּ na oração final
  choice: “deus” em minúscula, como objeto de confiança ou poder do perverso
  alternative: '“Deus”, o Deus verdadeiro: “aqueles que Deus põe em sua mão” ou “aqueles em cujas mãos Deus põe [algo]”'
  rationale: No contexto imediato, Jó ressalta a tranquilidade dos perversos. A leitura escolhida pode intensificar ironicamente sua impiedade, tratando como deus aquilo que lhes dá poder. Como a sintaxe hebraica admite outras leituras e a interpretação é disputada, a nota mantém aberta a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem poética de “tendas” e a ambiguidade da oração final, sem impor uma solução denominacional.
