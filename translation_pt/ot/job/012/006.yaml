  source_fidelity: 'A tradução preserva bem o paralelismo principal: as tendas dos saqueadores estão em sossego, e os que provocam Deus desfrutam segurança. A oração final hebraica é realmente difícil, e a leitura irônica com “deus” em minúscula é possível, desde que as alternativas permaneçam assinaladas em nota. Contudo, o singular בְּיָדוֹ (“em sua mão”) não deve tornar-se o plural “em suas mãos”, e a elipse do objeto deve ser indicada para que o português não pareça simplesmente incompleto por descuido.'
  naturalness: “As tendas dos devastadores estão tranquilas” e “vivem seguros” são claras e adequadas ao registro poético moderno. Na última oração, “põe em suas mãos” soa pouco natural sem objeto e deixa o referente de “suas” indistinto. “Põe-lhe [algo] na mão” conserva a elipse e oferece um português mais fluente.
  terminology: “Tendas”, “devastadores”, “Deus” e “deus” são escolhas defensáveis. A minúscula em “deus” comunica a leitura irônica sem a apresentar como indiscutível, pois a nota explicita as leituras concorrentes.
