  text: מוֹלִ֣יךְ יוֹעֲצִ֣ים שׁוֹלָ֑ל וְֽ/שֹׁפְטִ֥ים יְהוֹלֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: pt
  text: Ele leva embora os conselheiros despojados[a] e torna insensatos os juízes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saqueados” ou “como despojo”; o hebraico pode enfatizar que os conselheiros são levados embora em humilhação e despojamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: leva embora
  rationale: O particípio hifil de הלך tem sentido causativo e descreve a ação contínua de Deus; “leva embora” expressa naturalmente o movimento e sugere condução ao exílio ou cativeiro sem acrescentar isso ao texto.
- source_word: יוֹעֲצִים
  choice: conselheiros
  rationale: O plural designa pessoas que dão conselho, provavelmente figuras de liderança; “conselheiros” é direto, atual e preserva o contexto político e sapiencial.
- source_word: שׁוֹלָל
  choice: despojados
  rationale: A forma está ligada à ideia de despojo e apresenta os conselheiros privados de seus bens ou dignidade. “Despojados” preserva essa amplitude melhor que uma especificação como “descalços”.
- source_word: שֹׁפְטִים
  choice: juízes
  rationale: É o sentido comum de שפט e mantém o paralelismo entre duas classes de líderes, sem ampliar desnecessariamente para “governantes”.
- source_word: יְהוֹלֵל
  choice: faz ... perderem o juízo
  rationale: O piel de הלל II é causativo e indica tornar alguém insensato ou irracional. A expressão portuguesa é natural e comunica a perda de discernimento sem afirmar necessariamente insanidade clínica.
theological_decisions:
- issue: Sujeito implícito do versículo
  choice: “Ele”, em referência a Deus
  alternative: Omitir o pronome e depender apenas do contexto verbal
  rationale: O contexto de Jó 12 atribui essas ações a Deus. O pronome explícito torna clara a continuidade discursiva em português sem introduzir conteúdo teológico novo.
- issue: Natureza da ação sobre os juízes
  choice: Deus os faz perder o juízo
  alternative: Deus os torna loucos ou os faz agir como tolos
  rationale: A tradução preserva a afirmação forte da causalidade divina e a amplitude do verbo hebraico, evitando tanto suavizá-la para mera permissão quanto restringi-la à loucura clínica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Leva embora” mantém a força verbal do hebraico; “perderem o juízo” é idiomático sem ser coloquial demais. O marcador [a] aparece imediatamente após o termo a que se refere.
