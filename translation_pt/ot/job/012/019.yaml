base_translation:
  language: en
  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: pt
  text: Ele leva embora os sacerdotes, despojados[a], e derruba os poderosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «levados como despojo» ou «espolhados».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os fortes», «os duradouros» ou «os firmemente estabelecidos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: leva ... embora
  rationale: O particípio hifil de הלך indica fazer alguém ir; no contexto de juízo e humilhação, a expressão natural «leva embora» comunica condução forçada para longe.
- source_word: כֹּהֲנִים
  choice: os sacerdotes
  rationale: É o sentido lexical comum e preserva a referência direta a figuras religiosas de destaque.
- source_word: שׁוֹלָל
  choice: despojados
  rationale: A forma ligada a שלל retrata os sacerdotes privados de bens, posição ou honra. «Despojados» conserva melhor essa amplitude que uma referência mais específica a nudez ou a andar descalço.
- source_word: אֵתָנִים
  choice: os que parecem inabaláveis
  rationale: אֵתָנִים pode indicar pessoas fortes, duradouras ou firmemente estabelecidas. Esta formulação exprime sua aparente estabilidade no contexto, sem reduzir o termo apenas à força física.
- source_word: יְסַלֵּף
  choice: derruba
  rationale: O piel de סלף tem a ideia de torcer, transtornar ou subverter. Aqui, aplicado a pessoas firmemente estabelecidas, «derruba» comunica de modo natural o resultado dessa ação desestabilizadora.
theological_decisions:
- issue: Continuidade do sujeito implícito no contexto de Jó 12
  choice: Usar «Ele», com referência a Deus
  alternative: Explicitar «Deus»
  rationale: Os versículos próximos continuam descrevendo as ações soberanas de Deus. O pronome preserva o fluxo poético hebraico sem inserir novamente o nome divino.
- issue: Sentido de אֵתָנִים
  choice: os que parecem inabaláveis
  alternative: os poderosos; os fortes; os duradouros
  rationale: A escolha preserva a tensão entre a firmeza atribuída a essas pessoas e o fato de Deus poder derrubá-las, sem limitar o referente a uma classe política ou militar.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e o paralelismo foram preservados, enquanto «leva ... embora» e «derruba» mantêm fluidez idiomática.
