base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: pt
  text: Ou fale à terra[a], e ela lhe ensinará; e os peixes do mar lhe contarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao país” ou “à região”; o hebraico אֶרֶץ pode significar “terra”, “país” ou “região”.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou
  rationale: A partícula disjuntiva dá continuidade à sequência de apelos do contexto; “Ou” é natural e fiel.
- source_word: שִׂ֣יחַ
  choice: fale
  rationale: Neste imperativo, seguido de לָאָרֶץ, o verbo indica dirigir a palavra à terra, em paralelo com consultar os animais e as aves nos versículos anteriores.
- source_word: לָ/אָ֣רֶץ
  choice: com a terra
  rationale: אֶרֶץ pode significar “terra” ou “território”. O alcance abrangente da enumeração — animais, aves e peixes — favorece “terra”. Em português, “falar com” expressa naturalmente o ato de se dirigir a alguém ou a algo personificado.
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: e ela lhe ensinará
  rationale: O hifil de ירה significa “ensinar/instruir”. O pronome feminino retoma naturalmente “terra” em português e preserva sua personificação.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: e ... lhe contarão
  rationale: No piel, ספר pode significar “contar”, “relatar” ou “declarar”. “Contarão” é claro, atual e mantém o paralelismo didático.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: os peixes do mar
  rationale: Tradução direta da construção hebraica, preservando sua imagem e cadência poética.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A personificação da terra permanece explícita por meio de “ela”. O tratamento com “lhe” oferece ampla legibilidade internacional e brasileira.
