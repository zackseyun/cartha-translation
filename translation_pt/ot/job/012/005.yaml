  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: pt
  text: Uma tocha é desprezada na opinião de quem está tranquilo; ela está pronta para os que escorregam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica final está ligada ao escorregar do pé e pode ser entendida literalmente como “para os escorregões do pé” ou como referência aos que escorregam. O verso contém palavras e construções de sentido incerto.
    reason: Preserva a imagem corporal e registra a dificuldade lexical e sintática sem impor uma análise única.
lexical_decisions:
- source_word: לַפִּיד
  choice: a tocha
  rationale: Sentido lexical direto de um objeto flamejante usado para iluminação; preserva a imagem concreta do hebraico.
- source_word: בּוּז
  choice: é desprezada
  rationale: Mantém o valor nominal de 'desprezo' em formulação portuguesa natural, sem suavizar a atitude expressa.
- source_word: לְעַשְׁתּוּת
  choice: pelo pensamento
  rationale: O termo raro é tradicionalmente relacionado a 'pensamentos' ou 'opinião'; a construção preserva essa leitura sem expandi-la interpretativamente.
- source_word: שַׁאֲנָן
  choice: de quem vive tranquilo
  rationale: Expressa a condição de segurança, sossego ou despreocupação indicada pelo adjetivo.
- source_word: נָכוֹן
  choice: está pronta
  rationale: Conserva o sentido de estar preparada ou destinada, bem como a tensão da formulação elíptica.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: para os que tropeçam
  rationale: Traduz idiomaticamente a expressão referente ao vacilar ou escorregar do pé, entendendo a forma como particípio plural; o detalhe literal é registrado em nota.
theological_decisions:
- issue: Referente de 'ela' e sentido da segunda oração
  choice: Preservar a tocha como referente gramatical de 'ela', sem explicar de que modo está pronta para quem tropeça.
  alternative: Interpretar a imagem como calamidade ou desprezo reservado aos que estão prestes a cair.
  rationale: O verso é poético, comprimido e lexicalmente difícil. Explicitar a metáfora resolveria uma ambiguidade que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética concisa. A formulação conserva a estranheza e a ambiguidade genuínas do hebraico em vez de impor uma interpretação explicativa.
