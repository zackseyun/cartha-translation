  text: גַּם לִ֤/י לֵבָ֨ב כְּֽמוֹ/כֶ֗ם לֹא נֹפֵ֣ל אָנֹכִ֣י מִ/כֶּ֑ם וְ/אֶת מִי אֵ֥ין כְּמוֹ אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: pt
  text: Eu também tenho entendimento, assim como vocês[a]; não sou inferior a vocês. E quem não sabe coisas como essas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “também tenho coração, como vocês”. Aqui, “coração” se refere à capacidade de pensar e compreender.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Eu também tenho entendimento
  rationale: לֵבָב significa literalmente “coração”, mas aqui designa a capacidade de pensar e compreender. “Tenho entendimento” comunica com naturalidade a afirmação de Jó de que possui a mesma capacidade intelectual de seus interlocutores, enquanto a nota preserva a imagem hebraica.
- source_word: כְּמוֹכֶם
  choice: assim como vocês
  rationale: Expressa a comparação entre Jó e seus interlocutores. “Assim como vocês” é claro e natural no português contemporâneo.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: não sou inferior a vocês
  rationale: A construção com נפל e מן significa ficar abaixo de alguém ou ser-lhe inferior. A tradução verte diretamente o sentido idiomático, sem reproduzir de modo artificial a imagem de “cair abaixo”.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: E quem não sabe coisas como essas?
  rationale: A cláusula hebraica é elíptica e admite uma reprodução mais literal, porém obscura. No contexto, a pergunta retórica afirma que aquilo que os amigos disseram é conhecimento comum; esta formulação transmite essa força com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A ordem e o paralelismo do hebraico foram preservados na medida em que soam naturais; a metáfora antropológica de “coração” foi explicada em nota.
