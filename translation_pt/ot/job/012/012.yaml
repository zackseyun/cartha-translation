  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: pt
  text: Com os idosos está a sabedoria[a], e com muitos anos de vida[b], o entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entre os idosos há sabedoria”. A preposição hebraica pode indicar associação ou localização.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “extensão de dias”; isto é, vida longa ou muitos dias.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: Com os idosos
  rationale: A preposição בְּ pode indicar associação ou localização. “Com os idosos” preserva a concisão e o paralelismo do hebraico sem restringir desnecessariamente a referência a homens.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente de חָכְמָה na literatura sapiencial e adequado à afirmação proverbial do versículo.
- source_word: וְאֹרֶךְ יָמִים
  choice: e com muitos anos de vida
  rationale: A expressão hebraica significa literalmente “extensão de dias”. A formulação escolhida comunica de modo natural a ideia de vida longa e mantém a associação paralela com a idade avançada.
- source_word: תְּבוּנָה
  choice: entendimento
  rationale: תְּבוּנָה denota entendimento, discernimento ou perspicácia. “Entendimento” forma um paralelo natural com “sabedoria” sem apagar totalmente a distinção entre os termos.
