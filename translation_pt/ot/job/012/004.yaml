base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: pt
  text: Sou motivo de riso para o meu amigo[a], eu, que clamei a Deus, e ele me respondeu[b]; eu, justo e íntegro, sou motivo de riso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o seu amigo”. O sufixo hebraico está formalmente na terceira pessoa, mas o contexto favorece “meu amigo”, pois Jó fala de si e de seus companheiros.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “e ele lhe respondeu”. O objeto está na terceira pessoa, mas, no contexto, refere-se ao próprio Jó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: motivo de riso
  rationale: Expressa de modo natural a ideia de alguém exposto à zombaria, mantendo o valor predicativo do substantivo hebraico.
- source_word: לְרֵעֵהוּ
  choice: para o meu amigo
  rationale: Embora o sufixo massorético seja formalmente de terceira pessoa, o contexto apresenta Jó falando de si diante de seu companheiro; a leitura formal alternativa é preservada em nota.
- source_word: אֶהְיֶה
  choice: sou
  rationale: O imperfeito descreve aqui a condição presente de Jó; o presente português comunica isso diretamente sem sugerir necessariamente uma mudança de estado.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: eu, que clamei a Deus
  rationale: A oração relativa identifica Jó como aquele que invocou Deus e prepara a sequência com a resposta divina.
- source_word: וַיַּעֲנֵהוּ
  choice: e ele me respondeu
  rationale: O sujeito implícito é Deus, e o referente contextual do objeto de terceira pessoa é o próprio Jó. A forma mais literal é registrada em nota.
- source_word: צַדִּיק תָּמִים
  choice: o justo e íntegro
  rationale: Os adjetivos caracterizam a retidão e a inteireza moral de Jó. “Íntegro” evita que תָּמִים seja entendido como perfeição absoluta ou impecabilidade.
theological_decisions:
- issue: Se תָּמִים atribui perfeição sem pecado a Jó
  choice: “íntegro” como descrição de inteireza moral
  alternative: “perfeito”
  rationale: No vocabulário sapiencial e no próprio livro de Jó, o termo descreve integridade, não necessariamente impecabilidade absoluta.
- issue: Relação de צַדִּיק תָּמִים com שְׂחֹק
  choice: manter “o justo e íntegro” em aposição a Jó, como alvo do riso
  alternative: entender a expressão como “motivo de riso para o homem justo e íntegro”
  rationale: O hebraico não repete a preposição לְ diante de צַדִּיק תָּמִים; a leitura apositiva reflete melhor a sintaxe e preserva a afirmação contundente de que o homem justo e íntegro se tornou objeto de zombaria.
translation_notes:
  register: Português atual, digno e acessível, com cadência poética. O travessão conserva a retomada enfática de “motivo de riso”, e “justo e íntegro” mantém a tensão da autodescrição de Jó sem introduzir a ideia de perfeição absoluta.
