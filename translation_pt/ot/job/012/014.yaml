- from: Eis que, se ele derruba, não se pode reconstruir; se encerra um homem[a], não se pode abrir.
  to: Eis que, se ele derruba, não se pode reconstruir; se ele confina um homem[a], ninguém pode libertá-lo.
  rationale: A revisão substitui a combinação pouco idiomática «encerra um homem ... não se pode abrir» por uma construção portuguesa clara. «Confina» mantém o sentido de fechar alguém dentro, e «ninguém pode libertá-lo» torna explícito o resultado que o hebraico deixa expresso pela imagem passiva de algo que não pode ser aberto. Mantêm-se a ênfase inicial, o sujeito pronominal implícito no contexto e o masculino singular de אִישׁ.
