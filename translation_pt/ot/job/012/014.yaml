  - severity: medium
    issue: «Encerra um homem» não é a formulação mais natural para «confinar um homem».
    rationale: Embora possível em registro formal, «encerrar um homem» pode sugerir concluir ou finalizar alguém; «confina um homem» expressa com maior clareza o sentido contextual de fechar alguém dentro.
