  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: pt
  text: Eis que, se ele derruba, não se pode reconstruir; se ele confina um homem[a], ninguém pode libertá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «encerra um homem» ou «fecha um homem lá dentro».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz uma afirmação enfática e chama a atenção. «Eis que» preserva essa força em registro digno e ainda compreensível, sem reduzir a partícula a uma simples conjunção.
- source_word: יַהֲרוֹס
  choice: derruba
  rationale: O verbo הרס indica demolir ou pôr abaixo. «Derruba» é natural em português e conserva a imagem de construção retomada por «reconstruir».
- source_word: וְלֹא יִבָּנֶה
  choice: não se pode reconstruir
  rationale: O nifal de בנה é passivo, «ser construído/reconstruído». Neste paralelismo, a formulação expressa de modo idiomático o resultado irreversível da ação, sem precisar explicitar um sujeito ausente no hebraico.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: encerra um homem
  rationale: סגר com עַל אִישׁ comunica fechar alguém dentro, deter ou confinar. «Encerra um homem» mantém a imagem concreta e a forma masculina singular de אִישׁ sem especificar indevidamente prisão formal.
- source_word: וְלֹא יִפָּתֵחַ
  choice: não se pode abrir
  rationale: O nifal de פתח significa «ser aberto». A construção impessoal em português preserva a passividade e corresponde ao paralelo «não se pode reconstruir».
theological_decisions:
- issue: Referência ao sujeito divino
  choice: ele
  alternative: Deus / o SENHOR
  rationale: O hebraico emprega verbos na terceira pessoa do singular sem nome ou título divino explícito neste versículo. «Ele» preserva o fluxo do contexto, no qual Jó fala de Deus, sem acrescentar uma designação ausente do texto.
- issue: Força modal das formas com וְלֹא
  choice: não se pode reconstruir / não se pode abrir
  alternative: não será reconstruído / não será aberto
  rationale: Embora as formas hebraicas possam ser vertidas mais literalmente como futuros passivos, o contexto descreve a eficácia incontestável da ação divina. A construção com «não se pode» comunica naturalmente em português essa impossibilidade resultante, mantendo o paralelismo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e conciso. «Eis que» conserva a ênfase da partícula inicial; «encerra» evita restringir a cena a encarceramento jurídico. O marcador [a] aparece no texto principal.
