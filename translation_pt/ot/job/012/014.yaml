  naturalness: '«Eis que» é aceitável e mantém o tom elevado. «Não se pode reconstruir» é natural. «Não se pode abrir», depois de «encerra um homem», fica sintaticamente solto: não se sabe o que seria aberto. «Ninguém pode libertá-lo» comunica de modo natural o efeito do fechamento, sem o restringir a uma prisão jurídica.'
  terminology: «Um homem» preserva o singular masculino de אִישׁ. «Libertá-lo» é a explicitação idiomática portuguesa do resultado de um homem ser fechado/confinado; não introduz uma doutrina ou instituição penal. O pronome «ele» preserva a referência divina implícita sem acrescentar um título.
