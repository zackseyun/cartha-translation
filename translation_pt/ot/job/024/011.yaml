base_translation:
  language: en
  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: pt
  text: Entre as fileiras deles[a], extraem azeite[b]; pisam nos lagares, mas passam sede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os muros deles” ou “entre os terraços deles”; o termo hebraico pode se referir a fileiras, muros ou áreas agrícolas em terraços.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é raro e de sentido incerto; está relacionado a “azeite” ou “brilho” e, neste contexto, provavelmente se refere à produção ou extração de azeite.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: Entre
  rationale: Expressa diretamente a relação espacial indicada pela preposição hebraica.
- source_word: שׁוּרֹתָם
  choice: as fileiras deles
  rationale: O substantivo pode indicar fileiras, muros ou áreas dispostas em terraços. “Fileiras” mantém a imagem concreta sem definir além do que o hebraico permite; a nota registra as alternativas.
- source_word: יַצְהִירוּ
  choice: extraem azeite
  rationale: O verbo é raro e difícil, mas neste contexto de trabalho agrícola provavelmente designa a produção ou extração de azeite. “Extraem azeite” é natural em português e evita a expressão menos idiomática “espremem azeite”.
- source_word: יְקָבִים
  choice: lagares
  rationale: Termo corrente e preciso em português para instalações onde se pisam ou prensam uvas.
- source_word: דָּרְכוּ
  choice: pisam
  rationale: O verbo descreve a ação de pisar, especialmente uvas no lagar. “Pisam nos lagares” conserva a ação sem acrescentar explicitamente “uvas”, que está implícito no contexto.
- source_word: וַיִּצְמָאוּ
  choice: mas passam sede
  rationale: 'A conjunção adversativa explicita a amarga ironia contextual: os trabalhadores lidam com produtos agrícolas, porém continuam privados de bebida. “Passam sede” é atual e idiomático.'
