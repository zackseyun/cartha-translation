  source_fidelity: A tradução mantém os três membros concisos e a sintaxe deliberadamente difícil do hebraico. «Veloz» é uma interpretação contextual legítima de קַל, com «leve» devidamente preservado como alternativa na nota. «Sobre a superfície das águas», «a porção deles na terra é amaldiçoada» e «não se volta para o caminho das vinhas» refletem adequadamente o texto-base sem resolver indevidamente as tensões de referente ou de imagem.
  naturalness: O português é moderno, claro e suficientemente solene para Jó. Embora «veloz sobre a superfície das águas» conserve uma imagem incomum, essa estranheza é inerente ao hebraico e é mitigada pela nota explicativa; não exige alteração.
  terminology: «Amaldiçoada» reproduz apropriadamente o passivo de תקלל. «Porção», «terra» e «vinhas» são escolhas estáveis, naturais e semanticamente adequadas. As notas preservam tanto a alternativa singular («dele») quanto a leitura alternativa de קַל e a possível implicação de «caminho das vinhas».
