  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: pt
  text: Ele é veloz sobre a superfície das águas[a]; a porção deles na terra é amaldiçoada[b]; ele não se volta para o caminho das vinhas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele é leve sobre a superfície das águas». O hebraico é difícil, e alguns entendem a abertura como uma descrição de transitoriedade, não de velocidade.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico é difícil; alguns leem «a porção dele na terra é amaldiçoada», em vez de «a porção deles na terra é amaldiçoada».
    reason: textual_variant
  - marker: c
    text: 'Ou: «ele não se volta para a estrada das vinhas», talvez no sentido de que já não retorna à terra cultivada ou a lugares prósperos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: veloz
  rationale: Embora o adjetivo signifique literalmente «leve», neste contexto pode exprimir rapidez ou transitoriedade; «veloz» preserva o sentido provável sem eliminar a alternativa indicada em nota.
- source_word: עַל־פְּנֵי מַיִם
  choice: sobre a superfície das águas
  rationale: Reproduz de modo natural em português a imagem idiomática hebraica de estar «sobre a face das águas».
- source_word: תְּקֻלַּל
  choice: é amaldiçoada
  rationale: O Pual de קלל admite naturalmente o sentido passivo «ser amaldiçoado», adequado ao sujeito «porção».
- source_word: חֶלְקָתָם
  choice: a porção deles
  rationale: Segue a forma plural apresentada no texto hebraico, deixando em nota a possível leitura singular.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: «Terra» combina naturalmente com uma porção territorial e também preserva a amplitude lexical do hebraico.
- source_word: לֹא יִפְנֶה
  choice: ele não se volta para
  rationale: Mantém a imagem verbal de virar-se ou dirigir-se para algo, sem impor o sentido mais interpretativo de «retornar».
- source_word: דֶּרֶךְ כְּרָמִים
  choice: o caminho das vinhas
  rationale: Tradução próxima da construção hebraica, preservando a ambiguidade entre um caminho entre vinhas e um caminho que leva a elas.
