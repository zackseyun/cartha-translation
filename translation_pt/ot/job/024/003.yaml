lexical_decisions:
- source_word: חֲמוֹר
  choice: jumento
  rationale: Equivalente corrente e claro para o animal doméstico de carga; preserva o singular do hebraico.
- source_word: יְתוֹמִים
  choice: dos órfãos
  rationale: Preserva o plural hebraico, que pode ter sentido coletivo ou distributivo, sem restringir a referência a um único órfão.
- source_word: יִנְהָגוּ
  choice: levam embora
  rationale: Expressa o sentido de conduzir ou tocar o animal para longe e, no contexto da opressão descrita, comunica a retirada indevida sem tornar o verbo mais violento do que o hebraico exige.
- source_word: יַחְבְּלוּ
  choice: tomam como penhor
  rationale: Mantém o sentido jurídico-econômico específico de tomar um bem como garantia de dívida.
- source_word: שׁוֹר
  choice: boi
  rationale: Termo natural em português para o bovino de trabalho pressuposto pelo contexto agrário.
- source_word: אַלְמָנָה
  choice: da viúva
  rationale: Reproduz naturalmente em português a relação possessiva da construção hebraica.
