  text: Levam embora o jumento dos órfãos[a] e tomam como penhor o boi da viúva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o jumento de órfãos”. O plural hebraico pode ser entendido em sentido coletivo ou distributivo.'
