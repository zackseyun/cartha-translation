  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: pt
  text: Contudo, ele arrasta os poderosos com a sua força; levanta-se, mas não tem segurança de continuar vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levanta-se, e não confia na vida”; ou: “levanta-se, e ninguém se sente seguro de continuar vivo”. O sujeito da oração final em hebraico é ambíguo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: arrasta
  rationale: O verbo משׁך significa normalmente puxar, arrastar ou levar. Com “os poderosos” como objeto e “com a sua força” como expressão instrumental, “arrasta” preserva o caráter coercivo mais naturalmente do que “prolonga”.
- source_word: אַבִּירִים
  choice: os poderosos
  rationale: אַבִּירִים designa fortes ou poderosos; “os poderosos” comunica tanto força quanto posição de poder em português corrente.
- source_word: בְּכֹחוֹ
  choice: com a sua força
  rationale: כֹּחַ indica força ou poder, e a preposição בְּ tem valor instrumental. “Com a sua força” mantém essa relação de modo natural.
- source_word: יָקוּם
  choice: levanta-se
  rationale: קום no qal significa levantar-se ou pôr-se de pé. “Levanta-se” conserva a imagem verbal sem definir se se trata de agir, afirmar-se ou permanecer de pé.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: mas não tem segurança de continuar vivo
  rationale: A construção pode expressar ausência de confiança ou garantia quanto à vida. O sujeito verbal singular é mantido no texto principal, enquanto “continuar vivo” comunica em português o sentido contextual de sobrevivência sem tornar “vida” um objeto abstrato de confiança.
theological_decisions:
- issue: Sujeito ambíguo na oração final
  choice: 'O texto principal mantém o mesmo sujeito singular: “não tem segurança de continuar vivo”.'
  alternative: 'A oração pode ser entendida de modo impessoal ou resultativo: “ninguém se sente seguro de continuar vivo”.'
  rationale: O verbo hebraico está no singular e pode retomar o opressor, mas a expressão comprimida também permite entender a insegurança causada por ele. A nota conserva essa tensão sem impor uma resolução denominacional.
- issue: Relação lógica introduzida por וְ
  choice: mas
  alternative: e
  rationale: Embora וְ seja frequentemente aditivo, aqui “mas” exprime de modo natural o contraste entre levantar-se com poder e não possuir segurança quanto à própria vida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e preserva a concisão e a ambiguidade do hebraico por meio de nota.
