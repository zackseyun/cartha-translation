  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: pt
  text: Ao raiar do dia, o assassino se levanta[a]; mata o pobre e o necessitado[b] e, à noite, é como um ladrão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «À luz do dia» ou «Com a luz». O hebraico se refere literalmente à chegada da luz, provavelmente ao amanhecer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «assassina o pobre e o necessitado». Aqui, o hebraico usa um verbo diferente da palavra traduzida como «assassino»; por isso, o texto principal preserva a distinção com «mata».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: Ao raiar do dia
  rationale: A expressão literalmente aponta para a chegada da luz. Em português, «ao raiar do dia» comunica naturalmente o sentido temporal de amanhecer, sem eliminar a imagem da luz.
- source_word: יָקוּם
  choice: se levanta
  rationale: O qal imperfeito de קום indica aqui levantar-se ou pôr-se em ação; «se levanta» é direto e adequado ao paralelismo poético.
- source_word: רוֹצֵחַ
  choice: o assassino
  rationale: O particípio funciona como substantivo e descreve genericamente esse tipo de pessoa. «Assassino» expressa o sentido específico de quem comete homicídio.
- source_word: יִקְטָל
  choice: mata
  rationale: O hebraico emprega aqui קטל, e não repete רצח. «Mata» preserva em português essa distinção lexical entre «assassino» e o verbo seguinte.
- source_word: עָנִי וְאֶבְיוֹן
  choice: o pobre e o necessitado
  rationale: O par designa pessoas vulneráveis e carentes. A formulação mantém os dois termos e é clara no português atual.
- source_word: וּבַלַּיְלָה
  choice: e, durante a noite
  rationale: A expressão introduz o segundo cenário temporal e mantém o contraste com o raiar do dia.
- source_word: יְהִי
  choice: torna-se
  rationale: היה pode indicar «ser» ou «tornar-se». Neste contexto, «torna-se como» comunica que, à noite, o assassino assume a atuação ou condição comparável à de um ladrão, preservando a possível nuance dinâmica do verbo.
- source_word: כַגַּנָּב
  choice: como um ladrão
  rationale: A preposição comparativa כ introduz uma comparação simples; «como um ladrão» é natural e fiel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura poética contrasta o raiar do dia com a noite. «Ao raiar do dia» preserva a imagem da luz, enquanto «durante a noite» soa natural. A opção «torna-se como um ladrão» mantém a possível nuance de mudança ou papel em יְהִי, sem transformar a comparação em identificação absoluta.
