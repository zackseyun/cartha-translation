  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: pt
  text: Ficam encharcados pela chuva torrencial das montanhas[a] e, sem abrigo, abraçam a rocha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ficam molhados pela torrente das montanhas” ou “pela chuva torrencial das montanhas”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “abraçam a rocha” indica que se apertam contra ela em busca de proteção.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם
  choice: pelas chuvas
  rationale: זֶרֶם pode indicar chuva torrencial, enxurrada ou torrente. No contexto de pessoas expostas nas montanhas, “pelas chuvas” comunica com naturalidade a causa de ficarem encharcadas, enquanto a nota preserva as alternativas.
- source_word: הָרִים
  choice: das montanhas
  rationale: Mantém o plural hebraico e expressa que a chuva procede das montanhas ou ocorre nelas.
- source_word: יִרְטָבוּ
  choice: ficam encharcados
  rationale: O verbo significa ficar molhado. “Encharcados” transmite a intensidade sugerida por זֶרֶם e pela exposição ao tempo.
- source_word: וּמִבְּלִי
  choice: e, sem
  rationale: Representa de modo direto e atual a construção que indica ausência ou falta.
- source_word: מַחְסֶה
  choice: abrigo
  rationale: Designa proteção ou refúgio; “abrigo” se ajusta ao contexto físico de exposição à chuva.
- source_word: חִבְּקוּ
  choice: abraçam
  rationale: Preserva a imagem concreta e vívida do verbo hebraico, que literalmente significa abraçar; no contexto, implica apertar-se contra a rocha.
- source_word: צוּר
  choice: a rocha
  rationale: Mantém a imagem concreta de rocha ou penhasco. O artigo definido soa natural em português como referência genérica à rocha disponível.
