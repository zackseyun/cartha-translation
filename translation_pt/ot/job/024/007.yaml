  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: pt
  text: Passam a noite nus[a], sem roupa, e não têm nenhuma cobertura contra o frio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pernoitam nus, sem uma veste, e não têm cobertura no frio.”'
    reason: Alternativa lexical que preserva os sentidos possíveis de יָלִינוּ, עָרוֹם, לְבוּשׁ e a formulação mais literal de בַּקָּרָה.
lexical_decisions:
- source_word: עָרוֹם
  choice: nus
  rationale: O adjetivo indica ausência de roupa ou vestimenta insuficiente. “Nus” é direto e vívido, preservando a miséria social retratada no contexto.
- source_word: יָלִינוּ
  choice: passam a noite
  rationale: O verbo לין significa passar a noite ou pernoitar. “Passam a noite” é natural no português atual e não acrescenta a ideia específica de dormir.
- source_word: מִבְּלִי
  choice: sem
  rationale: A expressão indica ausência ou privação; “sem” é a equivalência mais concisa e natural.
- source_word: לְבוּשׁ
  choice: roupa
  rationale: O substantivo pode designar roupa ou uma peça de vestuário. “Roupa” comunica bem o sentido genérico em linguagem corrente.
- source_word: כְּסוּת
  choice: cobertura
  rationale: O termo designa algo usado para cobrir, inclusive uma veste. “Cobertura” preserva essa amplitude sem especificar indevidamente um cobertor ou uma peça de roupa.
- source_word: בַּקָּרָה
  choice: contra o frio
  rationale: A expressão é literalmente “no frio”, mas, ligada a “cobertura”, “contra o frio” explicita de modo natural a função protetora, sem mudar o quadro descrito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “nus, sem roupa” foi mantida porque reflete a ênfase do hebraico, em vez de ser suavizada como redundância estilística.
