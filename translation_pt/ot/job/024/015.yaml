base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: pt
  text: 'O olho do adúltero espera o crepúsculo[a], dizendo: “Nenhum olho me verá”; e ele cobre o rosto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a penumbra”. O termo hebraico pode indicar a luz tênue da transição entre dia e noite; aqui, o contexto sugere o fim do dia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “põe ocultação do rosto”, isto é, cobre ou disfarça o rosto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: olho
  rationale: 'Preserva a imagem concreta repetida no hebraico: o olho do adúltero e nenhum olho que o veja.'
- source_word: נֹאֵף
  choice: adúltero
  rationale: O particípio masculino singular designa de modo conciso um homem que comete adultério.
- source_word: שָׁמְרָה
  choice: espera
  rationale: Embora o verbo tenha o sentido básico de guardar ou vigiar, aqui expressa a espera atenta pela chegada da pouca luz.
- source_word: נֶשֶׁף
  choice: crepúsculo
  rationale: O substantivo indica a luz tênue da transição entre dia e noite; o contexto favorece o crepúsculo vespertino sem exigir uma especificação maior no texto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a forma usual de introduzir fala ou pensamento, sem decidir se as palavras foram pronunciadas em voz alta.
- source_word: תְשׁוּרֵנִי
  choice: me verá
  rationale: Traduz naturalmente o verbo 'olhar, contemplar, ver' e conserva o motivo visual do versículo.
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  choice: e ele cobre o rosto
  rationale: Expressa em português corrente a construção hebraica comprimida, literalmente relacionada a pôr ocultação do rosto, sem acrescentar explicitamente o motivo de evitar reconhecimento.
