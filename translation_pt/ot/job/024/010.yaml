lexical_decisions:
- source_word: עָרוֹם
  choice: nus
  rationale: Tradução direta do adjetivo, que pode indicar nudez ou falta extrema de vestuário; o contexto ressalta a privação.
- source_word: הִלְּכוּ
  choice: andam
  rationale: Expressa de modo natural uma ação ou condição habitual, sem acrescentar a ideia específica de vaguear.
- source_word: בְּלִי
  choice: sem
  rationale: Equivalente português claro e direto para a ausência indicada pela preposição.
- source_word: לְבוּשׁ
  choice: roupa
  rationale: Termo atual e amplamente compreensível para vestuário, adequado à construção idiomática 'sem roupa'.
- source_word: רְעֵבִים
  choice: famintos
  rationale: Comunica a condição de quem sofre fome no contexto de exploração, sem chegar ao sentido mais forte e específico de estar morrendo de fome.
- source_word: נָשְׂאוּ
  choice: carregam
  rationale: Verbo natural para o transporte do produto da colheita pelos trabalhadores.
- source_word: עֹמֶר
  choice: feixes
  rationale: Embora o substantivo hebraico esteja no singular, o plural pode representar naturalmente em português seu provável uso coletivo, em concordância semântica com os vários trabalhadores.
