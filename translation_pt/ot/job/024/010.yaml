  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: pt
  text: Andam nus, sem roupa; com fome, carregam feixes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um feixe”. O substantivo hebraico está no singular, mas aqui pode ter sentido coletivo.
