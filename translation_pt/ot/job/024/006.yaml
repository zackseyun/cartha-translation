  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: pt
  text: No campo, colhem a forragem dele[a] e recolhem o que resta[b] na vinha do perverso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “a forragem dele”. O pronome pode indicar a forragem pertencente ao proprietário perverso; seu referente, porém, não é explícito.
    reason: lexical_alternative
  - marker: b
    text: Ou “respigam”. O verbo hebraico se refere a recolher as sobras ou a produção tardia.
    reason: lexical_alternative
  - marker: c
    text: Ou “recolhem o que resta da vinha do perverso”. O hebraico não repete explicitamente a preposição “na”. “O perverso” pode designar de modo genérico um proprietário perverso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: No campo
  rationale: A preposição בְּ é locativa, e “no campo” é a forma natural e direta em português.
- source_word: בְּלִילוֹ
  choice: a forragem dele
  rationale: בְּלִיל designa alimento misturado para animais, não cereal comum para consumo humano. O sufixo masculino singular foi preservado por “dele”, embora seu referente permaneça incerto.
- source_word: יקצירו
  choice: colhem
  rationale: O verbo קצר significa ceifar ou colher. “Colhem” é atual, compreensível e se combina naturalmente com “forragem”.
- source_word: וְכֶרֶם
  choice: e ... na vinha
  rationale: O hebraico traz literalmente “e a vinha”, sem repetir a preposição. “Na vinha” expressa com naturalidade a leitura locativa exigida pelo contexto, sem ocultar na nota a alternativa sintática.
- source_word: רָשָׁע
  choice: do perverso
  rationale: O adjetivo singular substantivado indica alguém perverso, provavelmente o proprietário. “Do perverso” preserva o singular e evita acrescentar “homem”, ausente no hebraico.
- source_word: יְלַקֵּשׁוּ
  choice: recolhem o que resta
  rationale: O piel de לקשׁ refere-se à coleta tardia ou ao recolhimento das sobras da produção. A expressão comunica o sentido de respigar em português corrente, sem recorrer a vocabulário agrícola pouco conhecido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. “Forragem” conserva a precisão agrícola; “recolhem o que resta” torna o sentido de respigar imediatamente compreensível. As notas preservam a ambiguidade do sufixo em בְּלִילוֹ e da construção sem preposição explícita diante de “vinha”.
