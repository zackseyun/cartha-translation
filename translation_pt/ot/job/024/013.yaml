  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: pt
  text: Eles estão entre os que se rebelam contra a luz[a]; não reconhecem os caminhos dela[b] nem permanecem nas veredas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles estavam entre os rebeldes contra a luz”. O verbo hebraico está formalmente no passado, mas, neste contexto poético, pode descrever uma classe contínua de pessoas.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus caminhos... suas veredas”. Os sufixos retomam mais naturalmente “a luz”; por isso, foram explicitados como “os caminhos dela” e “as veredas dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הָיוּ
  choice: Eles estão
  rationale: O pronome independente dá ênfase ao grupo descrito. Embora הָיוּ seja formalmente passado, o contexto poético caracteriza uma classe de pessoas de modo geral e contínuo; por isso, o presente é natural em português.
- source_word: בְּמֹרְדֵי
  choice: entre os que se rebelam
  rationale: A preposição ב indica inclusão em uma classe, e a formulação verbal conserva o sentido ativo do particípio ligado a מרד.
- source_word: אוֹר
  choice: a luz
  rationale: A expressão direta preserva tanto o sentido literal quanto as possíveis conotações morais da imagem, sem explicitá-las indevidamente.
- source_word: לֹא הִכִּירוּ
  choice: não reconhecem
  rationale: הכיר pode significar reconhecer, conhecer ou admitir. “Reconhecem” mantém a possível tensão entre percepção e aceitação e se ajusta ao objeto “caminhos”.
- source_word: דְרָכָיו
  choice: os caminhos dela
  rationale: O sufixo masculino singular retoma mais naturalmente אוֹר, substantivo masculino em hebraico. Em português, o pronome feminino concorda naturalmente com “luz” e evita uma personificação mais forte que o original.
- source_word: וְלֹא יָשְׁבוּ
  choice: nem permanecem
  rationale: ישב pode significar sentar-se, habitar ou permanecer. Com “veredas”, o sentido contextual é continuar ou permanecer nelas, não sentar-se literalmente.
- source_word: בִּנְתִיבֹתָיו
  choice: em suas veredas
  rationale: נתיבות designa caminhos ou trilhas. “Veredas” preserva a distinção lexical em relação a דרכים (“caminhos”) e mantém o paralelismo poético.
theological_decisions:
- issue: Referente dos sufixos em “seus caminhos” e “suas veredas” no hebraico
  choice: Os sufixos se referem à luz, vertidos como “os caminhos dela” e “suas veredas”.
  alternative: Entendê-los como referência a um antecedente pessoal implícito e traduzir “os caminhos dele” e “suas veredas”.
  rationale: אוֹר (“luz”) é o antecedente gramatical masculino singular mais próximo, e a imagem do versículo se concentra na rebelião contra a luz. A tradução evita introduzir uma personalização teológica que o hebraico não torna explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Veredas” conserva o tom poético sem soar excessivamente arcaico; “permanecem” exprime naturalmente a ideia de manter-se nos caminhos.
