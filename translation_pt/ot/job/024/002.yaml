  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: pt
  text: Deslocam os marcos de divisa[a]; roubam um rebanho e o pastoreiam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Retiram os marcos de divisa”. O verbo hebraico pode indicar deslocar ou remover os marcos de uma propriedade para avançar sobre a terra alheia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “roubam um rebanho e o apascentam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: marcos de divisa
  rationale: O plural designa aqui os limites de propriedades, provavelmente os marcos físicos que os assinalavam. “Marcos de divisa” torna concreto o sentido jurídico e social.
- source_word: יַשִּׂיגוּ
  choice: deslocam
  rationale: No contexto fundiário, o verbo indica mover ou retirar marcos para avançar sobre a terra alheia. “Deslocam” preserva essa ação sem determinar se os marcos foram eliminados por completo.
- source_word: עֵדֶר
  choice: um rebanho
  rationale: O substantivo coletivo singular normalmente se refere a um rebanho; o artigo indefinido representa naturalmente a forma sem artigo do hebraico.
- source_word: גָּזְלוּ
  choice: roubam
  rationale: O verbo denota tomar injustamente, inclusive mediante força. “Roubam” comunica de modo claro a apropriação ilícita, sem exigir que ela tenha sido furtiva.
- source_word: וַיִּרְעוּ
  choice: e o levam para pastar
  rationale: O verbo רעה descreve apascentar ou fazer o rebanho pastar. A formulação é natural em português e preserva a imagem de que os perversos passam a tratar abertamente como seu o rebanho roubado.
