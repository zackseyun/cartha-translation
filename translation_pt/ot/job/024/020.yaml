base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: pt
  text: O ventre se esquece dele; o verme o acha saboroso.[a] Ele não é mais lembrado, e a injustiça é quebrada como uma árvore.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o verme se alimenta dele com prazer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o injusto é quebrado como uma árvore”. O hebraico emprega o substantivo abstrato “injustiça” ou “perversidade”, que aqui pode representar a pessoa que pratica o mal.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ רֶחֶם
  choice: O ventre se esquece dele
  rationale: Mantém a personificação e a imagem concisa do hebraico. O presente dá à descrição um caráter vívido e geral, adequado ao contexto poético.
- source_word: מְתָקוֹ רִמָּה
  choice: o verme se alimenta dele com prazer
  rationale: Expressa de modo natural em português a ideia de que o verme o considera doce ou agradável como alimento, sem eliminar a imagem macabra.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: Ele não é mais lembrado
  rationale: Reproduz a voz passiva e o sentido de cessação expresso por עוֹד לֹא.
- source_word: וַתִּשָּׁבֵר כָּעֵץ
  choice: é quebrada como uma árvore
  rationale: Preserva a forma passiva e a comparação direta do texto hebraico.
- source_word: עַוְלָה
  choice: a injustiça
  rationale: Conserva o substantivo abstrato hebraico em linguagem portuguesa natural, sem convertê-lo silenciosamente na pessoa injusta.
theological_decisions:
- issue: Se עַוְלָה deve ser entendido abstratamente como “injustiça” ou concretamente como “o injusto”.
  choice: a injustiça é quebrada como uma árvore
  alternative: o injusto é quebrado como uma árvore
  rationale: A forma hebraica é um substantivo abstrato, por isso essa forma é mantida no texto principal. Como o abstrato pode representar concretamente quem pratica a injustiça, a outra leitura é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe poética e as imagens fortes do hebraico foram preservadas; as ambiguidades relevantes aparecem nas notas.
