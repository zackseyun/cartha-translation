source:
  edition: WLC
  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: pt
  text: A seca e o calor também arrebatam as águas da neve[a]; assim o Sheol[b] arrebata os que pecaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “águas da neve”; pode referir-se à água proveniente do derretimento da neve.
    reason: lexical_alternative
  - marker: b
    text: “Sheol” é o termo hebraico para o domínio dos mortos; também pode ser traduzido por “sepultura”. O hebraico no fim do versículo é muito conciso, e sua relação sintática é incerta.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: seca
  rationale: Expressa a aridez como força que faz desaparecer a água e forma, com “calor”, um par natural em português.
- source_word: גַם
  choice: e
  rationale: No contexto, a partícula acrescenta o segundo elemento do par. A coordenação simples é natural em português; a ideia aditiva permanece no conjunto “a seca e o calor”.
- source_word: חֹם
  choice: calor
  rationale: Equivalente direto e corrente do substantivo hebraico.
- source_word: יִגְזְלוּ
  choice: arrebatam
  rationale: Preserva a imagem vigorosa de tomar ou arrancar algo, sem a estranheza que “roubam” teria com sujeitos inanimados. O verbo também pode ser entendido como regente da segunda oração, por elipse poética.
- source_word: מֵימֵי שֶׁלֶג
  choice: as águas da neve
  rationale: Mantém a expressão poética hebraica de modo inteligível, sem substituir no texto a imagem literal pela interpretação “água do degelo”.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem reduzi-lo a “sepultura” nem identificá-lo com uma noção posterior de inferno.
- source_word: חָטָאוּ
  choice: os que pecaram
  rationale: Representa a forma verbal perfeita plural, entendendo-a como referente humano tomado pelo Sheol, em vez de convertê-la simplesmente no substantivo “pecadores”.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Manter “Sheol” como designação hebraica do domínio dos mortos.
  alternative: “a sepultura”, “o mundo dos mortos” ou “a morte”
  rationale: A transliteração conserva a amplitude do termo e evita importar a ideia mais específica de punição final.
- issue: Relação sintática entre שְׁאוֹל e חָטָאוּ
  choice: 'Entender “os que pecaram” como o objeto implícito do verbo “arrebatam”, retomado por elipse na comparação: “assim o Sheol arrebata...”'
  alternative: 'Ler de modo mais fragmentário: “Sheol — pecaram”, ou emendar/interpretar o texto como “assim o Sheol consome os pecadores”.'
  rationale: O hebraico é extremamente conciso e sua sintaxe é difícil. A tradução explicita uma leitura contextual plausível sem transformar o perfeito verbal em uma afirmação doutrinária mais específica; a nota registra a dificuldade.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira ampla. “Arrebatam” conserva a força poética de גזל e permite reproduzir a comparação elíptica. Os marcadores aparecem junto às expressões que esclarecem.
