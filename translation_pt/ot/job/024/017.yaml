  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: pt
  text: Pois, para todos eles, a manhã é escuridão profunda[a][b], pois conhecem[c] os terrores da escuridão profunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, para todos eles, a manhã é como escuridão profunda”. A concisa oração hebraica não tem verbo expresso; sua relação pode ser expressa em português como identificação direta ou como comparação.'
    reason: alternative_reading
  - marker: b
    text: O hebraico צַלְמָוֶת (tsalmávet) também pode ser traduzido por “sombra da morte”. Aqui, provavelmente significa “escuridão profunda” ou “trevas”.
    reason: lexical_alternative
  - marker: c
    text: O verbo está no singular em hebraico (“ele conhece” ou “ele reconhece”), provavelmente com sentido genérico, referindo-se aos perversos como grupo; por isso, foi usado o plural no texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação que dá continuidade à descrição dos perversos; “pois” expressa naturalmente essa relação no contexto.
- source_word: יַחְדָּו
  choice: todos eles
  rationale: Embora signifique literalmente “juntos”, aqui tem força coletiva; “todos eles” comunica isso com clareza em português.
- source_word: בֹּקֶר
  choice: a manhã
  rationale: Mantém o sentido comum do termo e o contraste marcante com a escuridão profunda.
- source_word: לָמוֹ
  choice: para eles
  rationale: Representa a relação expressa pela preposição com o sufixo pronominal na oração nominal hebraica.
- source_word: צַלְמָוֶת
  choice: escuridão profunda
  rationale: No contexto, o termo indica trevas densas ou profunda escuridão, sem exigir uma referência direta à morte; a mesma tradução é mantida nas duas ocorrências.
- source_word: יַכִּיר
  choice: conhecem
  rationale: A forma hebraica está no singular, mas pode ter sentido genérico, referindo-se a cada integrante da classe dos malfeitores; o plural retoma naturalmente “todos eles” em português.
- source_word: בַּלְהוֹת
  choice: os terrores
  rationale: O substantivo plural denota terrores ou horrores repentinos; a construção “os terrores da escuridão profunda” é natural e preserva a relação entre os termos.
