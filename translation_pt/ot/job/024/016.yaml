  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָתַ֥ר בַּ/חֹ֗שֶׁךְ בָּ֫תִּ֥ים יוֹמָ֥ם חִתְּמוּ לָ֗/מוֹ לֹא יָ֥דְעוּ אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: pt
  text: No escuro, ele arromba casas[a]; de dia, eles se trancam[b]; não conhecem a luz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele abre passagem até as casas”. O verbo hebraico significa mais literalmente “escavar” ou “abrir passagem”, provavelmente através das paredes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles se fecham” ou “se escondem”. Mais literalmente: “selam para si”.'
    reason: lexical_alternative
  - marker: c
    text: “A luz” pode referir-se literalmente à luz do dia e, ao mesmo tempo, ter uma possível conotação moral neste contexto de pessoas perversas que evitam ser expostas.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: arromba
  rationale: O verbo descreve literalmente o ato de escavar ou abrir passagem, especialmente através de uma parede. No contexto de invasão de casas, “arromba” comunica com naturalidade a ação criminosa sem perder a ideia de entrada forçada.
- source_word: בַּחֹשֶׁךְ
  choice: no escuro
  rationale: Expressão corrente em português que preserva tanto o cenário noturno quanto a ideia de ocultação.
- source_word: בָּתִּים
  choice: casas
  rationale: Equivalente direto do substantivo plural para moradias e adequado ao contexto de invasão.
- source_word: יוֹמָם
  choice: de dia
  rationale: Forma breve e natural que mantém o contraste poético com “no escuro”.
- source_word: חִתְּמוּ לָמוֹ
  choice: eles se trancam
  rationale: O verbo significa “selar, fechar”, e לָמוֹ permite aqui um sentido reflexivo ou de interesse próprio. A formulação retrata os criminosos fechando-se ou escondendo-se durante o dia.
- source_word: לֹא יָדְעוּ אוֹר
  choice: não conhecem a luz
  rationale: 'Mantém o idioma hebraico e sua ambivalência: falta de familiaridade com a luz do dia e possível ressonância moral.'
theological_decisions:
- issue: Possível força moral e simbólica de אוֹר (“luz”)
  choice: Manter “a luz” sem explicar seu simbolismo no texto principal.
  alternative: Traduzir de modo interpretativo como “a luz do dia” ou “o que é certo”.
  rationale: O contraste imediato é entre a atividade no escuro e o esconderijo diurno, mas “luz” pode também sugerir exposição moral. A tradução conserva os dois níveis possíveis.
- issue: Mudança do singular para o plural no hebraico
  choice: Preservar “ele arromba” seguido de “eles se trancam”.
  alternative: 'Uniformizar todo o versículo no plural: “eles arrombam”.'
  rationale: O texto hebraico começa com um verbo no singular e passa ao plural. Preservar a mudança evita corrigir silenciosamente a forma do original e pode refletir a passagem de um criminoso representativo para o grupo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A concisão e o paralelismo do verso foram preservados; manteve-se também a mudança de número gramatical presente no hebraico.
