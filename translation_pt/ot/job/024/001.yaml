id: JOB.24.1
reference: Job 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: pt
  text: Por que os tempos não são reservados pelo Todo-Poderoso[a], e por que os que o conhecem não veem os seus dias[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tempos determinados”. A construção também pode ser entendida como “Por que os tempos não são guardados pelo Todo-Poderoso?”'
    reason: lexical_alternative
  - marker: b
    text: “Os seus dias” provavelmente são as ocasiões em que Deus age, intervém ou executa juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz diretamente a pergunta de queixa de Jó, com força e naturalidade em português.
- source_word: מִשַּׁדַּי
  choice: pelo Todo-Poderoso
  rationale: Com o verbo passivo, entende-se o prefixo מ como relacionado ao agente ou à fonte. A formulação mantém Deus como aquele em cujo poder estaria a reserva dos tempos, sem ampliar a expressão.
- source_word: נִצְפְּנוּ
  choice: são reservados
  rationale: O verbo צפן pode significar esconder, guardar ou reservar. “São reservados” preserva a voz passiva e se ajusta à ideia de tempos mantidos para uma ocasião determinada.
- source_word: עִתִּים
  choice: os tempos
  rationale: A tradução concisa preserva a abertura semântica do hebraico; “tempos determinados” é apresentada em nota como possibilidade contextual.
- source_word: וְיֹדְעָיו
  choice: os que o conhecem
  rationale: Expressa de modo idiomático o particípio com sufixo e preserva o sentido relacional de conhecer a Deus.
- source_word: חָזוּ
  choice: veem
  rationale: Traduz naturalmente o sentido de ver ou contemplar, sem acrescentar uma dimensão visionária que o contexto não exige.
- source_word: יָמָיו
  choice: os seus dias
  rationale: Mantém literalmente o plural com sufixo e conserva a expressão poética sem especificar no texto principal que seriam dias de juízo ou intervenção.
theological_decisions:
- issue: Sentido de “os seus dias” em relação a Deus
  choice: Manter “os seus dias” no texto principal.
  alternative: “os dias em que ele age”, “seus dias de juízo” ou “seus juízos determinados”
  rationale: A expressão hebraica é poeticamente condensada e provavelmente alude às ocasiões em que Deus intervém ou julga. A tradução literal preserva a tensão teológica e evita tornar explícito o que o texto deixa implícito.
- issue: Relação dos tempos com o Todo-Poderoso
  choice: “reservados pelo Todo-Poderoso”
  alternative: “ocultos do Todo-Poderoso” ou “guardados com o Todo-Poderoso”
  rationale: A construção hebraica admite discussão quanto à função do prefixo מ. A leitura adotada entende o Todo-Poderoso como agente ou fonte da reserva, em harmonia com a pergunta sobre os momentos da ação divina, sem excluir em nota a dificuldade lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura interrogativa e o paralelismo do hebraico foram preservados; termos interpretativamente mais específicos ficaram nas notas.
