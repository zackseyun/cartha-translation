base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: pt
  text: Eis que, como jumentos selvagens no deserto, eles saem para o seu trabalho, buscando alimento desde cedo; a terra árida é pão para ele, para os jovens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “a terra árida é pão para ele, para os jovens”. O hebraico traz “para ele” no singular, talvez com sentido distributivo. O último termo também pode ser traduzido por “meninos”, “crianças” ou, conforme o contexto, “filhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Introduz vividamente a cena e chama a atenção dos ouvintes; o plural é natural em português para uma exortação dirigida ao público.
- source_word: פְּרָאִים
  choice: jumentos selvagens
  rationale: Designa equídeos não domesticados próprios de regiões ermas; a expressão é clara e atual.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Indica uma região erma e inculta; “deserto” comunica naturalmente o cenário, sem exigir absoluta ausência de vegetação.
- source_word: בְּפָעֳלָם
  choice: para o seu trabalho
  rationale: Apresenta a saída deles como atividade necessária para obter sustento; “trabalho” é natural e preserva o sentido básico.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: procurando alimento desde cedo
  rationale: O particípio pode reunir as ideias de buscar diligentemente e começar cedo; טֶרֶף pode significar presa, mas neste contexto humano refere-se ao sustento.
- source_word: עֲרָבָה
  choice: a terra árida
  rationale: Distingue esta palavra de מִדְבָּר e expressa uma planície ou estepe seca em linguagem amplamente compreensível.
- source_word: לוֹ
  choice: lhe
  rationale: Preserva o singular hebraico, provavelmente distributivo, em vez de regularizá-lo silenciosamente para o plural.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém a imagem concreta do hebraico, em que pão também representa o sustento básico.
- source_word: לַנְּעָרִים
  choice: para os filhos
  rationale: No contexto, refere-se naturalmente aos jovens dependentes que precisam ser alimentados; “filhos” evita restringir indevidamente a adolescentes ou empregados.
