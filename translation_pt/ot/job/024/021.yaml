  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: pt
  text: Ele explora a mulher estéril, que não dá à luz,[a] e não faz o bem à viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alimenta-se da mulher estéril”. O verbo hebraico significa literalmente “apascentar” ou “alimentar”, mas, neste contexto, provavelmente tem sentido predatório.'
