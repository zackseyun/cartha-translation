lexical_decisions:
- source_word: רֹעֶה
  choice: devora
  rationale: Embora o particípio de רעה signifique normalmente “apascentar/alimentar-se”, o contexto hostil favorece um sentido predatório. “Devora” comunica de modo natural a exploração destrutiva, enquanto a nota preserva o valor lexical mais literal.
- source_word: עֲקָרָה
  choice: mulher estéril
  rationale: Expressa claramente a referência feminina singular e a incapacidade reprodutiva indicada pelo hebraico, em português atual e digno.
- source_word: לֹא תֵלֵד
  choice: que não dá à luz
  rationale: Segue de perto o hebraico sem acrescentar explicitamente a ideia modal de incapacidade, já sugerida por “estéril”.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente padrão e natural para a categoria social vulnerável mencionada no texto.
- source_word: לֹא יְיֵטִיב
  choice: não faz o bem a
  rationale: Preserva o sentido amplo do hifil de יטב — fazer o bem, beneficiar ou tratar bem — sem restringi-lo a uma forma específica de bondade.
