  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: pt
  text: Desviam os necessitados da estrada[a]; juntos, os pobres da terra[b] se escondem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do caminho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do país”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַטּוּ
  choice: Desviam
  rationale: O hifil de נטה expressa fazer alguém se desviar ou afastar. “Desviam” conserva o sentido causativo sem acrescentar uma ideia de violência física que o verbo, por si só, não exige.
- source_word: אֶבְיוֹנִים
  choice: os necessitados
  rationale: אֶבְיוֹן designa pessoas pobres ou carentes em situação vulnerável. “Necessitados” mantém uma distinção útil em relação a עֲנִיֵּי na segunda oração.
- source_word: מִדָּרֶךְ
  choice: da estrada
  rationale: דֶּרֶךְ pode significar estrada, caminho ou via. “Da estrada” representa concretamente a exclusão do espaço de passagem, enquanto a nota preserva a alternativa mais ampla.
- source_word: יַחַד
  choice: juntos
  rationale: O advérbio indica condição ou ação coletiva. “Juntos” é direto e modifica naturalmente a oração seguinte.
- source_word: חֻבְּאוּ
  choice: se escondem
  rationale: O pual de חבא admite valor passivo ou de estado. A construção reflexiva idiomática em português comunica que os pobres ficam escondidos ou se retiram para se esconder, sem especificar além do texto a causa imediata.
- source_word: עֲנִיֵּי אָרֶץ
  choice: os pobres da terra
  rationale: עָנִי pode indicar o pobre, aflito ou oprimido. “Os pobres da terra” é natural e preserva a amplitude de אֶרֶץ, que pode ser entendida como terra ou país.
