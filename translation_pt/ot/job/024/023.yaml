  naturalness: O texto revisto permanece moderno e legível. “Os olhos dele estão sobre os caminhos deles” evita a ambiguidade sintática excessiva de “seus olhos”, que em português pode ser lido como referente aos plurais imediatamente anteriores.
  terminology: “Segurança” traduz adequadamente לָבֶטַח. “São sustentados” é uma representação mais fiel e natural, neste contexto, de וְיִשָּׁעֵן do que “encontram apoio”. “Caminhos” preserva a imagem hebraica e seu possível valor ético.
