  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: pt
  text: Ele lhes dá segurança[a], e eles são sustentados[b]; os olhos dele estão sobre os caminhos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o singular “a ele” e, em seguida, “ele é sustentado”. Aqui essas formas são traduzidas coletivamente como “lhes” e “eles”, porque o verso termina com “os caminhos deles”.
    reason: alternative_reading
  - marker: b
    text: 'Ou, mais formalmente: “Ele dá segurança a ele, e ele é sustentado; os olhos dele estão sobre os caminhos deles.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: dá
  rationale: O qal imperfeito de נתן, com לָבֶטַח, expressa aqui a concessão de segurança; o presente combina com a afirmação poética geral.
- source_word: לוֹ
  choice: lhes
  rationale: Embora a forma hebraica seja singular, “a ele”, o plural final דַּרְכֵיהֶם favorece uma leitura coletiva ou distributiva dos perversos como grupo.
- source_word: לָבֶטַח
  choice: segurança
  rationale: Preserva o sentido objetivo de proteção ou condição segura, sem reduzi-lo à confiança interior.
- source_word: וְיִשָּׁעֵן
  choice: e eles encontram apoio
  rationale: O nifal de שׁען pode indicar ser sustentado ou apoiar-se. A formulação natural em português mantém essa amplitude e, em leitura coletiva, concorda com o plural sugerido pelo fim do verso.
- source_word: וְעֵינֵיהוּ
  choice: seus olhos
  rationale: Representa naturalmente o plural hebraico “os olhos dele”; o possuidor singular é provavelmente Deus no contexto, embora não seja nomeado no verso.
- source_word: עַל
  choice: sobre
  rationale: Expressa atenção ou vigilância dirigida aos caminhos deles e preserva a imagem do hebraico.
- source_word: דַּרְכֵיהֶם
  choice: os caminhos deles
  rationale: Mantém a metáfora de דרך e permite que permaneça perceptível o sentido figurado de conduta.
theological_decisions:
- issue: Alternância entre referentes singulares e plurais no verso
  choice: Traduzir a primeira metade coletivamente (“lhes... eles”), mantendo singular o possuidor de “seus olhos” e plural “os caminhos deles”
  alternative: 'Traduzir mais formalmente: “Ele dá segurança a ele, e ele encontra apoio; seus olhos estão sobre os caminhos deles.”'
  rationale: O hebraico mistura formas singulares e plurais. O plural “caminhos deles” favorece a compreensão coletiva dos perversos, enquanto “seus olhos” aponta com maior naturalidade para o observador singular, provavelmente Deus. A tradução conserva essa tensão sem uniformizar a sintaxe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Encontram apoio” evita a rigidez de “são sustentados” e conserva a possibilidade semântica de apoio ou sustentação. A repetição “seus... deles” mantém a alternância referencial do hebraico, embora produza deliberadamente certa ambiguidade poética.
