  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: pt
  text: 'Arrancam um órfão do peito[a]

    e tomam do pobre um penhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Arrancam o órfão do peito da mãe”. A expressão hebraica é difícil; o sentido parece ser que os perversos tomam com violência até mesmo uma criança órfã ainda amamentada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: Arrancam
  rationale: O verbo גזל indica tomar algo de modo violento ou injusto. “Arrancam” comunica a força e a crueldade da ação neste contexto.
- source_word: מִשֹּׁד
  choice: do peito
  rationale: A expressão hebraica é difícil. A leitura tradicional “do peito” ou “do seio” retrata a retirada violenta de uma criança ainda amamentada e se ajusta ao contexto de exploração dos vulneráveis, sem explicitar no texto principal de quem é o peito.
- source_word: יָתוֹם
  choice: o órfão
  rationale: יָתוֹם designa o órfão ou a criança sem pai. “O órfão” é conciso, natural e preserva a categoria social vulnerável mencionada no hebraico.
- source_word: וְעַל
  choice: do
  rationale: Com חבל neste contexto econômico, עַל introduz a pessoa de quem se toma o penhor. A construção portuguesa “do pobre” expressa naturalmente essa relação.
- source_word: עָנִי
  choice: o pobre
  rationale: Embora עָנִי também possa significar “aflito” ou “necessitado”, o sentido socioeconômico “pobre” é o mais adequado no contexto de dívida e penhor.
- source_word: יַחְבֹּלוּ
  choice: tomam ... um penhor
  rationale: Neste uso, חבל se refere a tomar uma garantia por dívida. “Tomam do pobre um penhor” mantém a imagem jurídica e econômica do hebraico em linguagem clara.
