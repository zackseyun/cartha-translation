source:
  edition: WLC
  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: pt
  text: São exaltados por pouco tempo e depois já não existem[a]; são abatidos e, como todos, são recolhidos[b]; como a ponta de uma espiga[c], são cortados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e depois desaparecem”. A expressão hebraica significa literalmente “e ele já não existe”, com sentido distributivo no contexto plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são levados embora”. O verbo hebraico é raro, e seu sentido exato é discutido.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “como a cabeça de uma espiga”.'
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ
  choice: são exaltados
  rationale: O verbo רום descreve aqui elevação a uma posição de destaque; a forma passiva preserva o contraste com a posterior humilhação.
- source_word: מְעַט
  choice: por pouco tempo
  rationale: Embora signifique literalmente “um pouco”, o contexto de desaparecimento indica duração breve.
- source_word: וְאֵינֶנּוּ
  choice: e depois já não existem
  rationale: A expressão idiomática indica que alguém já não está presente ou deixou de existir. O singular morfológico é entendido distributivamente dentro da sequência de verbos no plural.
- source_word: וְהֻמְכוּ
  choice: são abatidos
  rationale: Expressa rebaixamento ou redução de condição e mantém o contraste vertical com “são exaltados”.
- source_word: כַכֹּל
  choice: como todos
  rationale: Mantém de modo conciso a comparação abrangente do hebraico, entendida no contexto como referência ao destino comum das pessoas.
- source_word: יִקָּפְצוּן
  choice: são recolhidos
  rationale: O verbo raro e discutido parece indicar que são reunidos ou removidos. “Recolhidos” conserva a imagem sem definir além do necessário o modo de sua morte.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: como a ponta de uma espiga
  rationale: רֹאשׁ é “cabeça/ponta”, e שִׁבֹּלֶת é a espiga de cereal. A formulação portuguesa comunica naturalmente a imagem agrícola.
- source_word: יִמָּלוּ
  choice: são cortados
  rationale: No contexto da colheita, o verbo provavelmente descreve o corte da parte superior da planta; a tradução também preserva a metáfora de um fim repentino.
theological_decisions:
- issue: O alcance de כַכֹּל na comparação com o destino comum
  choice: como todos
  alternative: como tudo
  rationale: O contexto trata de pessoas perversas e de sua morte; “todos” preserva a formulação ampla sem acrescentar uma afirmação doutrinária específica sobre o destino final.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela e o contraste entre exaltação e abatimento foram preservados; as ambiguidades dos verbos raros são registradas em notas.
