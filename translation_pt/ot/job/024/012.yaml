base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: pt
  text: Da cidade, os que estão morrendo gemem[a], e a alma dos feridos de morte clama por socorro; contudo, Deus não considera isso uma insensatez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na cidade, os homens gemem”. O hebraico מְתִים é difícil aqui e pode significar “homens”, em vez de “os que estão morrendo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “contudo, Deus não atribui culpa” ou “contudo, Deus não dá atenção ao clamor”. A expressão hebraica é difícil, e o referente de “isso” não é explícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Da cidade
  rationale: Preserva o sentido mais natural de origem ou procedência expresso por מִן, sem excluir que a cidade seja também o cenário dos gemidos.
- source_word: מְתִים
  choice: os que estão morrendo
  rationale: O termo é difícil e também pode ser entendido como “homens”; no paralelismo com os feridos de morte, a referência aos que estão morrendo comunica melhor o sofrimento mortal sem sugerir que mortos literalmente gemem.
- source_word: יִנְאָקוּ
  choice: gemem
  rationale: Expressa de modo natural e vívido o som produzido pelo sofrimento.
- source_word: וְנֶפֶשׁ
  choice: e a alma
  rationale: Mantém a imagem hebraica e seu peso emotivo, embora נֶפֶשׁ possa também designar vida ou pessoa.
- source_word: חֲלָלִים
  choice: dos feridos de morte
  rationale: O termo designa pessoas abatidas ou mortalmente feridas; esta formulação preserva sua ligação com morte violenta e combina naturalmente com o clamor por socorro.
- source_word: תְּשַׁוֵּעַ
  choice: clama por socorro
  rationale: Torna explícito, em português idiomático, o pedido urgente de ajuda comunicado pelo verbo.
- source_word: וֶאֱלוֹהַּ
  choice: contudo, Deus
  rationale: A conjunção assume valor adversativo diante do contraste entre o clamor humano e a aparente falta de resposta divina.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: não considera isso uma insensatez
  rationale: A expressão é difícil. A tradução conserva o sentido básico de תִּפְלָה como insensatez, absurdo ou impropriedade, evitando definir de modo excessivo se “isso” é a violência, a situação ou o clamor.
theological_decisions:
- issue: A aparente ausência de resposta divina diante da injustiça
  choice: contudo, Deus não considera isso uma insensatez
  alternative: 'contudo, Deus não atribui culpa; ou: contudo, Deus não dá atenção ao clamor'
  rationale: A formulação mantém a acusação tensa de Jó e a ambiguidade do difícil idioma hebraico, sem harmonizá-la antecipadamente com uma explicação doutrinária da justiça divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A construção preserva o paralelismo poético, a imagem de “alma” e a tensão não resolvida da última oração.
