  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: pt
  text: E, se não é assim, quem poderá desmentir-me e reduzir a nada a minha palavra?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: E, se não é assim
  rationale: Introduz o desafio condicional com referência às afirmações anteriores de Jó; a explicitação de “é assim” torna a frase natural em português.
- source_word: אֵפוֹ
  choice: '[expresso pela estrutura da frase]'
  rationale: A partícula discursiva reforça a inferência; em português, a construção condicional seguida da pergunta já transmite naturalmente esse valor, sem exigir um “então” potencialmente pesado.
- source_word: מִי
  choice: quem
  rationale: Pronome interrogativo direto que introduz o desafio retórico.
- source_word: יַכְזִיבֵנִי
  choice: poderá provar que sou mentiroso
  rationale: O hifil de כזב pode significar demonstrar que alguém é falso ou mentiroso. A formulação preserva a força pessoal e forense do desafio; “poderá” explicita em português a capacidade implícita na pergunta retórica.
- source_word: וְיָשֵׂם לְאַל
  choice: e reduzir a nada
  rationale: A combinação idiomática comunica tornar algo nulo, sem valor ou sem efeito. “Reduzir a nada” é natural e mantém a imagem resultativa.
- source_word: מִלָּתִי
  choice: as minhas palavras
  rationale: Embora o substantivo esteja no singular coletivo ou discursivo, o plural idiomático em português refere-se naturalmente ao que Jó acaba de dizer e evita a possível leitura de “minha palavra” como promessa.
