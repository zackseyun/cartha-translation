id: JOB.3.5
reference: Job 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: pt
  text: Que a escuridão e a sombra profunda[a] o tomem de volta; que uma nuvem se estabeleça sobre ele; que as escuridões do dia[b] o aterrorizem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sombra da morte” ou “escuridão profunda”, para צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: A expressão “as escuridões do dia” é difícil; também pode significar “a escuridão do dia”, “os eclipses do dia” ou, menos provavelmente, “as amarguras do dia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: o tomem de volta
  rationale: O verbo גאל tem o sentido de reivindicar ou recuperar o que pertencia a alguém. No contexto da maldição, a expressão indica que a escuridão retoma o dia, sem as conotações positivas que “redimir” normalmente teria em português.
- source_word: חֹשֶׁךְ
  choice: escuridão
  rationale: Equivalente comum e direto, adequado à imagem de o dia do nascimento ser desfeito.
- source_word: צַלְמָוֶת
  choice: sombra profunda
  rationale: Preserva a imagem sombria sem decidir entre a análise tradicional “sombra da morte” e o sentido mais amplo “escuridão profunda”; as alternativas constam em nota.
- source_word: תִּשְׁכָּן עָלָיו
  choice: se estabeleça sobre ele
  rationale: שׁכן exprime morar, permanecer ou instalar-se. “Se estabeleça sobre” é natural em português e conserva a ideia de uma nuvem que passa a permanecer sobre o dia.
- source_word: עֲנָנָה
  choice: uma nuvem
  rationale: Mantém a imagem meteorológica concreta e o singular do hebraico.
- source_word: יְבַעֲתֻהוּ
  choice: o aterrorizem
  rationale: בעת no piel comunica causar terror ou pavor intenso; “aterrorizem” preserva essa força.
- source_word: כִּמְרִירֵי יוֹם
  choice: as escuridões do dia
  rationale: A expressão é difícil. “Escuridões” conserva o plural poético e se ajusta ao campo imagético do contexto, embora outras interpretações sejam possíveis e estejam registradas em nota.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética. A formulação preserva a personificação do dia e a estranheza deliberada do plural hebraico em “escuridões”.
