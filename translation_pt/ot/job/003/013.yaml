base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: pt
  text: Pois agora eu teria me deitado e ficado quieto[a]; teria dormido; então, haveria descanso para mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ficado em sossego”; ou: “e ficado em paz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “então eu estaria em repouso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior de Jó e preserva com naturalidade a força causal do hebraico.
- source_word: עַתָּה
  choice: agora
  rationale: Expressa o resultado presente, mas hipotético, de Jó ter morrido ao nascer; o valor contrafactual é transmitido pelos verbos no condicional.
- source_word: שָׁכַבְתִּי
  choice: eu estaria deitado
  rationale: Mantém a imagem corporal de deitar-se, empregada poeticamente para a morte, sem explicitar a metáfora.
- source_word: וְאֶשְׁקֹט
  choice: e em sossego
  rationale: Comunica quietude sem perturbação e evita interpretar o termo de modo mais específico como paz.
- source_word: יָשַׁנְתִּי
  choice: teria dormido
  rationale: Preserva o verbo comum 'dormir' e sua função metafórica, sem substituí-lo diretamente por 'morrer'.
- source_word: אָז
  choice: então
  rationale: Marca a etapa consequente na sequência poética.
- source_word: יָנוּחַ לִי
  choice: estaria descansando
  rationale: É uma formulação portuguesa natural para o hebraico que literalmente pode indicar que haveria descanso para Jó; diferencia o repouso final do sossego da oração anterior.
theological_decisions:
- issue: A morte retratada pelas imagens de deitar-se, dormir e descansar
  choice: Conservar literalmente as imagens poéticas, sem formular uma doutrina explícita sobre o estado dos mortos.
  alternative: Traduzir 'dormir' como 'estar morto' ou ampliar para 'descansar na morte'.
  rationale: O hebraico descreve poeticamente o repouso desejado da morte mediante verbos cotidianos. Preservá-los mantém a tensão poética e teológica do texto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas verbais contrafactuais claras. 'Em sossego' preserva a ideia de quietude sem repetir 'descansando'. Todos os marcadores de nota aparecem no texto principal.
