  text: לֹ֤א שָׁלַ֨וְתִּי וְ/לֹ֖א שָׁקַ֥טְתִּי וְֽ/לֹא נָ֗חְתִּי וַ/יָּ֥בֹא רֹֽגֶז׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/026.yaml
  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: pt
  text: Não tive tranquilidade[a], não tive sossego, não tive descanso; e veio a perturbação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não estive em paz”. O hebraico emprega três verbos de sentido próximo para intensificar a completa falta de alívio de Jó.
    reason: lexical_alternative
  - marker: b
    text: Ou “agitação”, “tumulto” ou “inquietação”. O termo hebraico pode indicar diferentes formas de perturbação e desassossego.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: tive tranquilidade
  rationale: O verbo expressa tranquilidade, bem-estar ou segurança sem perturbação. “Tive tranquilidade” é natural em português e inicia a sequência sem restringir o sentido à segurança exterior.
- source_word: שָׁקַטְתִּי
  choice: tive sossego
  rationale: שׁקט indica quietude ou ausência de perturbação. “Sossego” mantém a distinção em relação a “tranquilidade” e “descanso”.
- source_word: נָחְתִּי
  choice: tive descanso
  rationale: De נוח, “descansar” ou “repousar”. A expressão preserva o paralelismo nominal das três orações e sua progressão enfática.
- source_word: רֹגֶז
  choice: perturbação
  rationale: O substantivo pode indicar agitação, inquietação, tumulto ou perturbação. “Perturbação” conserva a amplitude entre sofrimento interior e transtorno exterior, sem reduzi-lo a ira.
- source_word: וַיָּבֹא
  choice: veio
  rationale: Traduz diretamente a chegada da perturbação. Não se acrescenta “sobre mim”, pois o hebraico não explicita esse complemento.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: não tive ... não tive ... não tive
  rationale: A repetição de “não tive” reproduz a cadência enfática das três negações hebraicas, em vez de condensá-las numa única construção.
