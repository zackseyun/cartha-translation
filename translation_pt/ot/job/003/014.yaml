  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: pt
  text: 'com reis e conselheiros da terra,

    que construíram ruínas para si;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente direto e natural para os governantes reais mencionados no contexto.
- source_word: יֹעֲצֵי אָרֶץ
  choice: conselheiros da terra
  rationale: Preserva a construção hebraica e seu alcance amplo, sem restringir 'terra' a um país específico.
- source_word: הַבֹּנִים חֳרָבוֹת
  choice: que construíram ruínas
  rationale: 'Mantém o paradoxo expressivo do hebraico: construir aquilo que é descrito como ruínas ou lugares devastados. Evita explicar no corpo do texto se eram monumentos, cidades reconstruídas ou edificações destinadas à desolação.'
- source_word: לָמוֹ
  choice: para si
  rationale: Expressa o dativo reflexivo plural em português corrente.
theological_decisions:
- issue: Identidade e finalidade das 'ruínas' construídas pelos reis
  choice: Preservar a formulação ambígua 'construíram ruínas para si'
  alternative: Explicitar como 'reconstruíram lugares devastados', 'construíram palácios' ou 'ergueram monumentos funerários'
  rationale: O texto hebraico não define inequivocamente o referente nem a finalidade de חֳרָבוֹת; a tradução não deve resolver essa tensão por conjectura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura poética em dois versos. A expressão incomum 'construíram ruínas' foi mantida deliberadamente por refletir a formulação hebraica.
