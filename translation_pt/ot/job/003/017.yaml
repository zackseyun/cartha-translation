  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: pt
  text: Ali os perversos deixam de se agitar,[a] e ali descansam os exaustos de forças.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cessam sua agitação”, “deixam o tumulto” ou “cessam sua fúria”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os cansados de força”, isto é, os que tiveram suas forças esgotadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali
  rationale: O advérbio locativo aponta para o lugar descrito no lamento e sua repetição preserva o paralelismo poético.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa o substantivo adjetival que designa pessoas moralmente más, em linguagem atual e digna.
- source_word: חָדְלוּ
  choice: deixam de
  rationale: O perfeito hebraico descreve a condição própria daquele lugar; o presente transmite naturalmente esse valor descritivo no contexto.
- source_word: רֹגֶז
  choice: causar agitação
  rationale: O substantivo pode indicar agitação, tumulto, ira ou inquietação. Com חָדְלוּ, a formulação verbal comunica que cessa a perturbação produzida pelos perversos sem restringir o termo à ira.
- source_word: וְשָׁם
  choice: e ali
  rationale: Mantém a conjunção, a repetição locativa e o paralelismo da poesia hebraica.
- source_word: יָנוּחוּ
  choice: descansam
  rationale: Traduz diretamente o verbo נוח, que significa repousar ou estar em descanso.
- source_word: יְגִיעֵי כֹחַ
  choice: os que estão exaustos, sem forças
  rationale: Torna inteligível o hebraísmo literalmente relacionado aos 'cansados de força', isto é, pessoas cuja força se esgotou.
