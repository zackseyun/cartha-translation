  text: כִּ֤י לֹ֣א סָ֭גַר דַּלְתֵ֣י בִטְנִ֑/י וַ/יַּסְתֵּ֥ר עָ֝מָ֗ל מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: pt
  text: porque não fechou as portas do ventre que me gerou[a], nem escondeu dos meus olhos o sofrimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as portas do meu ventre”. Aqui, “ventre” se refere ao ventre materno em que Jó foi gerado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a desgraça”, “a aflição”, “a fadiga penosa” ou “a tristeza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa da maldição pronunciada no contexto anterior e preserva de modo natural o valor causal.
- source_word: סָגַר
  choice: fechou
  rationale: Equivalente direto e idiomático para a ação de fechar portas.
- source_word: דַּלְתֵי
  choice: as portas
  rationale: Mantém a imagem concreta do hebraico ligada ao ventre materno.
- source_word: בִטְנִי
  choice: do ventre que me gerou
  rationale: O hebraico traz literalmente 'meu ventre', expressão que, na voz masculina de Jó, se refere idiomaticamente ao ventre em que ele esteve. A formulação explicita essa relação sem atribuir a Jó um útero próprio.
- source_word: וַיַּסְתֵּר
  choice: nem escondeu
  rationale: A negação da primeira oração estende-se naturalmente à segunda; 'nem' reproduz essa relação em português.
- source_word: עָמָל
  choice: o sofrimento
  rationale: Neste lamento, o termo designa amplamente aflição penosa; 'sofrimento' é natural e mantém a amplitude contextual.
- source_word: מֵעֵינָי
  choice: dos meus olhos
  rationale: Preserva a imagem hebraica de algo ocultado aos olhos, abrangendo tanto ver quanto experimentar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com equivalência ótima. A construção 'ventre que me gerou' evita a estranheza potencial de 'meu ventre' na fala de Jó, enquanto a nota preserva a forma e a ambiguidade lexical do hebraico.
