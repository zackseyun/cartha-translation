lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה no wayyiqtol introduz uma fala com o sentido de responder. Embora não haja uma pergunta explícita imediatamente anterior, “respondeu” preserva a fórmula narrativa hebraica e pode indicar uma reação à situação ou ao discurso precedente.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: אמר é o verbo comum para dizer. “Disse” mantém sua força narrativa simples e, junto com “respondeu”, conserva a fórmula hebraica de introdução da fala.
