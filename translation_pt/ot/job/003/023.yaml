  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: pt
  text: ao homem cujo caminho está oculto[a] e a quem Deus cercou[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuja vereda está encoberta”.'
    reason: Alternativa lexical que conserva tanto a metáfora de דֶּרֶךְ quanto o estado expresso por נִסְתָּרָה.
  - marker: b
    text: 'Ou: “a quem Deus encerrou” ou “a quem Deus confinou”.'
    reason: Alternativas para a imagem de bloquear ou confinar expressa por וַיָּסֶךְ com בַּעֲדוֹ.
lexical_decisions:
- source_word: לְגֶבֶר
  choice: ao homem
  rationale: A preposição לְ liga este segmento à pergunta retórica iniciada no versículo 20. O substantivo masculino singular גֶּבֶר designa aqui um homem individual.
- source_word: דַּרְכּוֹ
  choice: seu caminho
  rationale: דֶּרֶךְ pode indicar uma estrada ou, figuradamente, o rumo da vida. “Caminho” conserva a metáfora sem determinar além do texto em que sentido ele está oculto.
- source_word: נִסְתָּרָה
  choice: está oculto
  rationale: O nifal expressa um estado passivo. A formulação preserva a ambiguidade entre um caminho que o homem não consegue discernir e um caminho ocultado de modo mais geral.
- source_word: וַיָּסֶךְ ... בַּעֲדוֹ
  choice: a quem Deus cercou
  rationale: O verbo com בַּעַד comunica a ideia de fechar ou pôr uma barreira ao redor de alguém. “Cercou” mantém a imagem e é corrente em português, sem especificar o tipo de barreira.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É o termo poético singular para Deus, frequente em Jó. “Deus” é o equivalente direto; títulos como “Todo-poderoso” acrescentariam uma designação ausente do hebraico.
theological_decisions:
- issue: Agência no cerco imposto ao homem
  choice: Deus permanece como sujeito explícito de “cercou”.
  alternative: Usar uma construção impessoal ou passiva que atenue a agência divina.
  rationale: O hebraico nomeia אֱלוֹהַּ como agente. A queixa de Jó atribui diretamente a Deus esse confinamento, e a tradução não deve suavizar a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe que continua a pergunta retórica dos versículos anteriores. “Caminho” preserva a metáfora hebraica, e “cercou” mantém explícita a ação divina sem impor uma interpretação denominacional.
