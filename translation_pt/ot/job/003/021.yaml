  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: pt
  text: os que esperam pela morte[a], mas ela não vem, e cavam em busca dela mais do que em busca de tesouros escondidos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ela não está”. O hebraico diz literalmente “e ela não está”, no sentido de que a morte não aparece nem chega.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: os que esperam
  rationale: O particípio de חכה expressa espera com expectativa. “Esperam” preserva o sentido lexical básico sem intensificá-lo indevidamente como “anseiam”.
- source_word: לַמָּוֶת
  choice: pela morte
  rationale: A preposição לְ introduz o objeto da espera; em português, a construção idiomática é “esperar pela morte”.
- source_word: וְאֵינֶנּוּ
  choice: mas ela não vem
  rationale: Literalmente, “e ela não está/não existe”, com o sufixo masculino retomando “morte” em hebraico. No contexto, a ideia é que a morte esperada não chega; “mas ela não vem” torna explícita essa implicação natural em português.
- source_word: וַיַּחְפְּרֻהוּ
  choice: e cavam à procura dela
  rationale: חפר significa literalmente “cavar”. A formulação mantém a imagem vívida de procurar algo enterrado e, ao mesmo tempo, soa compreensível em português.
- source_word: מִמַּטְמוֹנִים
  choice: mais do que de tesouros escondidos
  rationale: מַטְמוֹן designa um tesouro oculto ou armazenado, e מִן tem força comparativa neste contexto. A escolha conserva a relação entre cavar e procurar riquezas escondidas.
