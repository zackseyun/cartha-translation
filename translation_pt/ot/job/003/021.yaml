translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A metáfora concreta de cavar em busca da morte foi preservada. O verso permanece sintaticamente ligado ao contexto anterior, por isso termina com vírgula.
