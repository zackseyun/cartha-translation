base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: pt
  text: Pois meu suspiro vem antes do meu pão[a], e meus gemidos[b] se derramam como água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu alimento”; no hebraico, “pão” pode designar de modo mais amplo aquilo que se come.
    reason: lexical_alternative
  - marker: b
    text: Ou “meus rugidos”; o termo hebraico pode evocar um grito alto, semelhante ao rugido de um animal, intensificando a angústia de Jó.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da condição de Jó no lamento e preserva naturalmente a força explicativa do hebraico.
- source_word: לִפְנֵי
  choice: antes de
  rationale: 'Expressa aqui uma relação temporal: o suspiro precede o ato de comer.'
- source_word: לַחְמִי
  choice: meu pão
  rationale: Mantém a imagem concreta do hebraico לֶחֶם, que também pode designar alimento em sentido mais amplo.
- source_word: אַנְחָתִי
  choice: meu suspiro
  rationale: Comunica a expressão de aflição e conserva o singular coletivo, distinguindo-a dos clamores plurais da segunda linha.
- source_word: תָבֹא
  choice: vem
  rationale: O presente traduz com naturalidade a condição contínua descrita no lamento poético.
- source_word: וַיִּתְּכוּ
  choice: se derramam
  rationale: Reproduz a imagem de algo que flui abundantemente e combina de modo natural com a comparação 'como água'.
- source_word: כַמַּיִם
  choice: como água
  rationale: Preserva diretamente o símile hebraico.
- source_word: שַׁאֲגֹתָי
  choice: meus gemidos
  rationale: Expressa em português corrente os clamores intensos de Jó; uma nota conserva o sentido mais literal de rugidos.
