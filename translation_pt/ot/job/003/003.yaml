base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: pt
  text: 'Pereça o dia em que nasci e a noite que disse: “Foi concebido um homem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi concebido um menino!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: Pereça
  rationale: 'O presente do subjuntivo em formulação optativa comunica de modo conciso a força jussiva e imprecatória do hebraico: trata-se de um desejo de maldição, não de uma previsão.'
- source_word: יוֹם
  choice: o dia
  rationale: O contexto torna definido o dia específico do nascimento de Jó.
- source_word: אִוָּלֶד בּוֹ
  choice: em que nasci
  rationale: Reproduz naturalmente em português o nifal de ילד, com sentido passivo de nascer, e a relação temporal expressa por בּוֹ.
- source_word: וְהַלַּיְלָה
  choice: e a noite
  rationale: Mantém a coordenação poética entre o dia do nascimento e a noite da concepção.
- source_word: אָמַר
  choice: que disse
  rationale: Preserva a personificação da noite como aquela que faz o anúncio.
- source_word: הֹרָה
  choice: Foi concebido
  rationale: A forma perfeita é vertida como anúncio de um acontecimento consumado; a construção passiva evita fazer da noite o sujeito que concebe.
- source_word: גָבֶר
  choice: um homem
  rationale: Conserva o valor masculino de גָבֶר e sua formulação marcada, embora no contexto possa indicar um filho do sexo masculino.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e inteligível, com concisão poética. A inversão inicial “Pereça o dia” conserva o tom solene da imprecação sem soar arcaica em excesso. O marcador [a] aparece no texto junto à expressão a que se refere.
