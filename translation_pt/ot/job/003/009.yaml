  text: יֶחְשְׁכוּ֮ כּוֹכְבֵ֪י נִ֫שְׁפּ֥/וֹ יְקַו לְ/א֥וֹר וָ/אַ֑יִן וְ/אַל יִ֝רְאֶ֗ה בְּ/עַפְעַפֵּי שָֽׁחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: pt
  text: Que escureçam as estrelas do seu crepúsculo[a]; que ela espere pela luz, mas não haja luz alguma; e que não veja as pálpebras da alvorada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as estrelas do seu anoitecer”. O termo hebraico pode designar o crepúsculo, especialmente o vespertino.
    reason: lexical_alternative
  - marker: b
    text: “As pálpebras da alvorada” é uma imagem poética hebraica para o primeiro aparecimento da luz da manhã.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: Escureçam
  rationale: O qal imperfeito tem força volitiva no contexto da maldição. “Escureçam” expressa de modo conciso o desejo de que as estrelas fiquem escuras.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: as estrelas do seu crepúsculo
  rationale: Preserva a relação construta, o sufixo possessivo e o sentido poético de נֶשֶׁף como crepúsculo, provavelmente o crepúsculo vespertino neste contexto.
- source_word: יְקַו לְאוֹר
  choice: espere ela pela luz
  rationale: קוה denota espera expectante. A ordem marcada conserva o tom poético e deixa claro que a noite personificada é o sujeito.
- source_word: וָאַיִן
  choice: mas não haja luz alguma
  rationale: Explicita o referente elíptico sem alterar o sentido e mantém a força volitiva da maldição e a expectativa frustrada.
- source_word: וְאַל יִרְאֶה
  choice: e não veja
  rationale: 'אַל com o imperfeito expressa uma volição negativa: que a noite não chegue a ver a aurora.'
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: as pálpebras da alvorada
  rationale: Mantém a metáfora hebraica vívida para o primeiro despontar da luz matinal. “Alvorada” oferece registro poético natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. Conserva-se a personificação da noite pelo pronome feminino “ela” e a imagem concreta das “pálpebras da alvorada”.
