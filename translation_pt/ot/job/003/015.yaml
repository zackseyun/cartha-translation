lexical_decisions:
- source_word: א֣וֹ
  choice: ou
  rationale: Dá continuidade à série poética de possibilidades não realizadas iniciada nos versículos anteriores.
- source_word: עִם
  choice: com
  rationale: Expressa diretamente a companhia dos governantes mortos com quem Jó imagina estar.
- source_word: שָׂרִים
  choice: príncipes
  rationale: Designa autoridades de alta posição e conserva o registro elevado do poema; “governantes” ou “nobres” também são possíveis.
- source_word: זָהָב לָהֶם
  choice: que possuíam ouro
  rationale: Verte de modo natural a construção hebraica de posse, literalmente próxima de “para quem havia ouro”.
- source_word: הַמְמַלְאִים
  choice: que enchiam
  rationale: O particípio descreve os príncipes mediante uma oração relativa; o imperfeito português se ajusta à descrição de sua riqueza habitual.
- source_word: בָּתֵּיהֶם
  choice: as suas casas
  rationale: Mantém o sentido básico de בַּיִת sem especificá-lo interpretativamente como “palácios”.
- source_word: כָּסֶף
  choice: prata
  rationale: Preserva a imagem concreta do metal precioso, em paralelo com o ouro, em vez do sentido mais abstrato de “dinheiro”.
