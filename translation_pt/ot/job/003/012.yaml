  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: pt
  text: Por que os joelhos me receberam[a], e por que os seios, para que eu mamasse?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A referência aos “joelhos” provavelmente retrata o recém-nascido sendo acolhido sobre os joelhos ou no colo ao nascer.
    reason: cultural_note
  - marker: b
    text: 'O verbo hebraico se refere ao bebê sugando leite; também se pode traduzir: “para que eu sugasse o leite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz diretamente a pergunta do lamento de Jó, com força interrogativa natural em português.
- source_word: קִדְּמוּנִי
  choice: me receberam
  rationale: O verbo קדם pode indicar vir ao encontro ou receber. Com “joelhos”, o contexto aponta para o acolhimento do recém-nascido ao nascer.
- source_word: בִרְכָּיִם
  choice: os joelhos
  rationale: Mantém a imagem concreta do hebraico; o artigo definido torna a expressão natural em português sem explicitar de quem eram os joelhos.
- source_word: וּמַה
  choice: e por que
  rationale: Embora literalmente possa ser “e o que”, no paralelismo interrogativo retoma o sentido causal de מַדּוּעַ.
- source_word: שָׁדַיִם
  choice: os seios
  rationale: Preserva o termo anatômico do hebraico sem acrescentar “da minha mãe”, informação implícita, mas não expressa.
- source_word: כִּי
  choice: para que
  rationale: Introduz aqui a finalidade ou consequência ligada à menção dos seios.
- source_word: אִינָק
  choice: eu mamasse
  rationale: O verbo descreve a ação do bebê que suga leite. “Mamar” expressa isso de modo claro, atual e inequívoco em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A formulação conserva a imagem concreta e abrupta do lamento hebraico, inclusive a elipse na segunda pergunta (“e por que os seios”), sem identificar explicitamente a pessoa que recebeu ou amamentou Jó.
