  text: The small and the great are there[a], and the slave is free from his master.
translation:
  language: pt
  text: O pequeno e o grande estão ali, e o escravo está livre de seu senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O pequeno e o grande estão ali, e o servo está livre de seu senhor.” O termo hebraico עֶבֶד pode significar “servo” ou “escravo”; aqui, “escravo” foi usado porque o contraste com estar livre de um senhor realça a condição de sujeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: o pequeno
  rationale: Em contraste com גָדוֹל, indica sobretudo posição ou importância social. “O pequeno” conserva a concisão e a antítese do hebraico.
- source_word: גָדוֹל
  choice: o grande
  rationale: Em paralelo antitético com קָטֹן, refere-se a quem ocupa posição elevada ou tem maior importância.
- source_word: שָׁם
  choice: ali
  rationale: Retoma o domínio da morte descrito no contexto; “ali” preserva a referência dêitica de modo natural em português.
- source_word: הוּא
  choice: estão
  rationale: Embora o pronome seja formalmente singular, a afirmação abrange o par precedente. O plural é necessário para uma formulação natural em português, sem acrescentar “igualmente”, ideia não explícita no texto.
- source_word: עֶבֶד
  choice: escravo
  rationale: O contraste direto com estar livre de um senhor põe em destaque a condição de sujeição, favorecendo “escravo” em vez de “servo”.
- source_word: חָפְשִׁי
  choice: livre
  rationale: O adjetivo expressa liberdade em oposição à escravidão; “livre” reproduz diretamente esse contraste.
- source_word: מֵאֲדֹנָיו
  choice: de seu senhor
  rationale: A preposição indica separação, e אֲדוֹן designa aqui o senhor humano do escravo. “Livre de seu senhor” é natural e mantém a relação expressa no hebraico.
