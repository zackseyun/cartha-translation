base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: pt
  text: Que aquele dia seja trevas; que Deus, do alto, não o busque[a], e que nenhuma claridade[b] brilhe sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não cuide dele» ou «não lhe dê atenção»; o verbo hebraico pode significar buscar, voltar a atenção para ou cuidar.
    reason: lexical_alternative
  - marker: b
    text: Ou «luz» ou «brilho».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: aquele dia
  rationale: Retoma o dia do nascimento de Jó e reproduz naturalmente a expressão demonstrativa hebraica.
- source_word: יְהִי חֹשֶׁךְ
  choice: seja trevas
  rationale: O subjuntivo introduzido por «que» preserva a força volitiva ou imprecatória do jussivo, enquanto «trevas» mantém a forma nominal e o tom poético.
- source_word: יִדְרְשֵׁהוּ
  choice: não o busque
  rationale: דרש significa primariamente buscar ou procurar e, neste contexto, também pode sugerir dar atenção ou cuidar. «Busque» conserva a imagem hebraica sem explicá-la em excesso.
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: Deus, lá do alto
  rationale: Mantém a referência explícita a Deus e o sentido espacial de מִמָּעַל. As vírgulas evitam que «do alto» pareça parte de um título divino.
- source_word: תּוֹפַע
  choice: brilhe
  rationale: Expressa de maneira corrente o surgimento ou emissão de luz indicado pelo verbo יפע.
- source_word: נְהָרָה
  choice: claridade
  rationale: O substantivo raro denota luz, brilho ou claridade. «Claridade» preserva essa amplitude e soa natural no paralelismo poético.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O pronome retoma «aquele dia», masculino em português, e «sobre» conserva a relação espacial da preposição hebraica.
theological_decisions:
- issue: Referência direta a Deus numa imprecação
  choice: Manter «Deus, lá do alto»
  alternative: O céu lá do alto
  rationale: O hebraico nomeia Deus explicitamente. A linguagem ousada do lamento de Jó não deve ser suavizada por uma formulação impessoal.
- issue: Sentido de Deus não «buscar» o dia
  choice: Conservar a metáfora «não o busque»
  alternative: não cuide dele / não lhe dê atenção
  rationale: A formulação mantém a ambiguidade lexical entre procurar, voltar a atenção para e cuidar, sem impor uma interpretação teológica única.
translation_notes:
  register: Português moderno, poético e digno, com sintaxe clara para leitores brasileiros e de outras comunidades lusófonas. A repetição de «que» sustenta o ritmo imprecatório do original; «seja trevas» conserva deliberadamente sua imagem nominal compacta.
