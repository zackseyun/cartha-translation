translation:
  language: pt
  text: os que se alegram intensamente[a] e exultam quando[b] encontram uma sepultura[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que se alegram até a exultação». A expressão hebraica é um intensificador idiomático.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «porque encontram». A conjunção hebraica pode ter sentido causal ou temporal neste contexto.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: «a sepultura». O hebraico também permite entender o termo de modo genérico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: os que se alegram
  rationale: O artigo com o particípio tem função substantiva e continua a descrição do versículo anterior. Esta formulação preserva essa ligação com naturalidade em português.
- source_word: אֱלֵי גִיל
  choice: intensamente
  rationale: A expressão, literalmente «até/rumo à exultação», funciona como intensificador idiomático. «Intensamente» comunica o grau elevado da alegria sem tornar o português artificial.
- source_word: יָשִׂישׂוּ
  choice: exultam
  rationale: O verbo reforça poeticamente a alegria já mencionada. «Exultam» preserva esse aumento de intensidade e evita achatar os dois termos hebraicos numa só palavra portuguesa.
- source_word: כִּי
  choice: quando
  rationale: A conjunção pode indicar aqui a circunstância temporal que provoca a exultação, embora uma leitura causal também seja possível e seja registrada em nota.
- source_word: יִמְצְאוּ
  choice: encontram
  rationale: Tradução direta e natural de מצא, preservando a simplicidade contundente da frase hebraica.
- source_word: קָבֶר
  choice: uma sepultura
  rationale: O substantivo hebraico não traz artigo e pode ser entendido indefinidamente. «Sepultura» expressa concretamente o lugar de enterro sem substituir o termo pela ideia mais abstrata de morte.
