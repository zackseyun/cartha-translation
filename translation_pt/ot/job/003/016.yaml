  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: pt
  text: Ou como um feto morto e oculto[a], eu não teria existido, como bebês que nunca viram a luz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma criança natimorta e oculta”. O termo hebraico pode referir-se ao feto de um aborto espontâneo ou a uma criança natimorta.
    reason: lexical_alternative
  - marker: b
    text: “Ver a luz” é uma expressão hebraica para entrar na vida terrena ou experimentá-la.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou
  rationale: Introduz outra possibilidade na sequência de situações em que Jó deseja não ter chegado à existência; a conjunção simples preserva o encadeamento poético.
- source_word: כְ/נֵ֣פֶל
  choice: como um feto morto
  rationale: O substantivo נֵפֶל pode designar o feto de um aborto espontâneo ou uma criança natimorta. “Feto morto” mantém em português a referência ao ser que não chegou a experimentar a vida fora do ventre, sem restringir indevidamente o termo a apenas uma dessas possibilidades.
- source_word: טָ֭מוּן
  choice: oculto
  rationale: O particípio de טמן significa “escondido, oculto”. “Oculto” preserva a imagem sem especificar que se trate de sepultamento.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: eu não teria existido
  rationale: No desejo contrafactual de Jó, a forma verbal expressa que ele não teria chegado a existir. O pretérito condicional composto é natural em português e deixa claro que Jó contempla uma alternativa ao próprio nascimento.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: como bebês
  rationale: עֹלְלִים designa crianças muito pequenas. “Bebês” é atual, claro e apropriado ao paralelo com o feto morto.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: que nunca viram a luz
  rationale: Mantém a metáfora hebraica de “ver a luz”, aqui referente a entrar na vida terrena ou experimentá-la.
