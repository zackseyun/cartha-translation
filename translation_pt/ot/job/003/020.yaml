base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: pt
  text: Por que se dá[a] luz[b] ao aflito, e vida aos amargurados de alma?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por que ele dá luz ao aflito, e vida aos amargurados de alma?» O hebraico não declara quem dá, embora o contexto provavelmente indique Deus.'
    reason: alternative_reading
  - marker: b
    text: «Luz» é uma imagem poética da continuidade da existência; o hebraico conserva essa metáfora, em vez de dizer diretamente «vida» na primeira oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz diretamente a pergunta angustiada de Jó, preservando sua força e concisão poética.
- source_word: יִתֵּן
  choice: se dá
  rationale: Embora a forma hebraica seja ativa, na terceira pessoa masculina singular, o sujeito não é expresso. A construção portuguesa com «se dá» mantém o agente sem identificação explícita.
- source_word: לְעָמֵל
  choice: ao aflito
  rationale: עָמֵל designa aqui alguém em sofrimento ou miséria, não simplesmente uma pessoa que trabalha. «Aflito» é claro, digno e adequado ao contexto do lamento.
- source_word: אוֹר
  choice: luz
  rationale: Conserva a imagem poética hebraica, que neste contexto representa a continuidade da existência, sem substituí-la diretamente por «vida».
- source_word: וְחַיִּים
  choice: e vida
  rationale: חַיִּים tem forma plural em hebraico, mas costuma designar idiomaticamente a vida; o singular é a forma natural em português.
- source_word: לְמָרֵי נָפֶשׁ
  choice: aos amargurados de alma
  rationale: Preserva a expressão hebraica e sua profundidade emocional. «Alma» representa aqui o íntimo da pessoa em sofrimento.
theological_decisions:
- issue: Sujeito implícito de יִתֵּן
  choice: Manter o doador implícito por meio de «se dá».
  alternative: Traduzir «Por que ele dá...» ou explicitar «Por que Deus dá...».
  rationale: O contexto provavelmente sugere Deus como doador, mas o hebraico não o nomeia neste versículo. A formulação adotada preserva a tensão retórica e teológica da queixa de Jó sem tornar a acusação mais explícita que o original.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem das palavras foi ajustada à sintaxe natural do português, mantendo o paralelismo, a metáfora da luz e a linguagem emocional do hebraico.
