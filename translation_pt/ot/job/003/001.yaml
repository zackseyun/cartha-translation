  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: pt
  text: Depois disso, Jó abriu a boca e amaldiçoou seu dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o dia de seu nascimento”. O hebraico diz literalmente “seu dia”.'
    reason: alternativa lexical; esclarece a referência contextual sem expandir o texto principal
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal e mantém a sequência narrativa.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: abriu a boca
  rationale: Preserva o idioma hebraico e sua força retórica solene, em vez de reduzi-lo a “começou a falar”.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיְקַלֵּל
  choice: amaldiçoou
  rationale: Comunica diretamente o sentido do Piel de קלל neste contexto, sem atenuar a linguagem contundente que introduz o lamento.
- source_word: אֶת יוֹמוֹ
  choice: o seu dia
  rationale: Reproduz a expressão hebraica concisa, literalmente “seu dia”, deixando que o contexto posterior esclareça que se trata do dia do nascimento de Jó.
theological_decisions:
- issue: Explicitar ou não que “o seu dia” é o dia do nascimento de Jó
  choice: Manter “o seu dia” no texto principal
  alternative: “o dia do seu nascimento” ou “seu aniversário”
  rationale: Embora o contexto esclareça em seguida que se trata do dia do nascimento, este versículo não inclui explicitamente a ideia de nascimento. A formulação concisa preserva a progressão e a ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção idiomática “abriu a boca” foi preservada por sua solenidade e por ser compreensível em português.
