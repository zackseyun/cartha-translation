  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: pt
  text: Por que não morri no ventre[a], ao sair do útero[b], não expirei?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desde o ventre» ou «do ventre». O hebraico usa um termo para o ventre materno.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa aqui outro termo relacionado para o ventre materno; também pode ser traduzido por «ventre».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo causal natural em português, adequado ao tom de lamento.
- source_word: מֵרֶחֶם
  choice: ao sair do ventre
  rationale: A preposição מן, com o contexto de nascimento, permite o sentido temporal de morrer ao sair do ventre, sem reduzir a expressão simplesmente a “ao nascer”.
- source_word: אָמוּת
  choice: não morri
  rationale: O imperfeito na pergunta retrospectiva é expresso naturalmente pelo pretérito perfeito em português.
- source_word: מִבֶּטֶן
  choice: do útero
  rationale: בטן pode designar o ventre materno; “útero” mantém a referência materna e distingue o termo de רחם, traduzido aqui por “ventre”.
- source_word: יָצָאתִי
  choice: quando saí
  rationale: Preserva a imagem concreta de sair, em vez de substituí-la pela interpretação mais abstrata “nasci”.
- source_word: וְאֶגְוָע
  choice: não expirei
  rationale: גוע é distinto de מות e pode enfatizar o ato de expirar ou dar o último suspiro; a negação inicial rege também esta cláusula paralela.
