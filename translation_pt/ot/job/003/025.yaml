  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: pt
  text: Pois o medo que eu temia veio sobre mim[a][b], e aquilo que eu receava veio a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que eu temia veio sobre mim”. O hebraico emprega um substantivo e um verbo da mesma raiz (“o medo que eu temia”) para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: O verbo da primeira oração pode significar “veio sobre mim” ou “me alcançou”; a segunda oração diz mais literalmente “veio a mim”, preservando uma pequena variação no paralelismo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Jó para o lamento anterior, com valor causal ou explicativo.
- source_word: פַחַד פָּחַדְתִּי
  choice: o medo que eu temia
  rationale: Preserva, em português natural, a construção hebraica de substantivo e verbo cognatos, que dá ênfase à intensidade do medo.
- source_word: וַיֶּאֱתָיֵנִי
  choice: veio sobre mim
  rationale: Expressa uma calamidade que alcança ou sobrevém a alguém e mantém uma leve distinção em relação a יָבֹא לִי no segundo membro.
- source_word: וַאֲשֶׁר יָגֹרְתִּי
  choice: e aquilo que me apavorava
  rationale: Reproduz o segundo membro paralelo com linguagem corrente e comunica o temor intenso indicado por גור.
- source_word: יָבֹא לִי
  choice: veio até mim
  rationale: Mantém a imagem simples de movimento e a ligeira variação em relação a 'veio sobre mim'; o passado é adequado à calamidade já experimentada por Jó.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição intencional em “o medo que eu temia” conserva a ênfase hebraica sem tornar a frase excessivamente artificial.
