  text: הַ/לַּ֥יְלָה הַ/הוּא֮ יִקָּחֵ֪/ה֫וּ אֹ֥פֶל אַל יִ֭חַדְּ בִּ/ימֵ֣י שָׁנָ֑ה בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים אַל יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: pt
  text: Quanto àquela noite, que a escuridão se apodere dela; que ela não se alegre entre os dias do ano[a], nem entre na contagem dos meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ela não seja unida aos dias do ano”. O verbo hebraico é raro aqui; alguns entendem a frase como exclusão do calendário, em vez de ausência de alegria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Quanto àquela noite
  rationale: A expressão está deslocada para o início, com ênfase tópica. A formulação preserva essa marca e soa natural em português.
- source_word: יִקָּחֵהוּ
  choice: que ... se apodere dela
  rationale: לקח significa literalmente tomar. Neste contexto personificado e hostil, “apoderar-se” comunica a ideia de a escuridão tomar posse da noite sem ampliar indevidamente o sentido.
- source_word: אֹפֶל
  choice: escuridão
  rationale: אֹפֶל pode designar escuridão ou trevas densas. “Escuridão” é claro e amplo, enquanto a personificação é preservada pelo verbo.
- source_word: אַל יִחַדְּ
  choice: que ela não se alegre
  rationale: O verbo é raro e ambíguo neste uso. A leitura ligada a alegria ou participação jubilosa é adequada ao paralelismo e ao contexto da maldição; a possível leitura de junção ou inclusão é preservada em nota.
- source_word: בִּימֵי שָׁנָה
  choice: entre os dias do ano
  rationale: A preposição indica aqui inclusão num conjunto; “entre” expressa naturalmente a participação no ciclo anual.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: na contagem dos meses
  rationale: A formulação preserva a imagem de enumeração presente em מִסְפָּר e é idiomática em português.
- source_word: אַל יָבֹא
  choice: nem entre
  rationale: בוא significa vir ou entrar. Em combinação com “contagem”, “entrar” expressa inclusão no cômputo, e “nem” liga naturalmente as duas proibições.
