lexical_decisions:
- source_word: יַחַד
  choice: juntos
  rationale: O advérbio indica que os prisioneiros compartilham coletivamente essa condição; “juntos” é natural e direto em português.
- source_word: אֲסִירִים
  choice: os prisioneiros
  rationale: Designa pessoas mantidas em confinamento; “prisioneiros” é claro e adequado ao contexto da cessação da opressão na morte.
- source_word: שַׁאֲנָנוּ
  choice: descansam
  rationale: Expressa tranquilidade e ausência de perturbação. “Descansam” comunica essa condição de modo natural, sem acrescentar uma ideia técnica sobre o estado dos mortos.
- source_word: לֹא שָׁמְעוּ
  choice: não ouvem
  rationale: Embora a forma verbal seja qatal, o contexto poético descreve uma condição presente e contínua; o presente português transmite bem esse valor resultativo.
- source_word: קוֹל
  choice: a voz
  rationale: Preserva a referência ao comando ou à exigência audível da pessoa que impõe trabalho ou cobrança.
- source_word: נֹגֵשׂ
  choice: capataz
  rationale: O particípio designa alguém que pressiona, força trabalho ou exige pagamento. “Capataz” oferece uma imagem concreta e corrente, enquanto a nota preserva alternativas mais amplas.
