  text: יִקְּבֻ֥/הוּ אֹרְרֵי י֑וֹם הָ֝/עֲתִידִ֗ים עֹרֵ֥ר לִוְיָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: pt
  text: 'Que o amaldiçoem os que amaldiçoam o dia,

    os preparados para despertar Leviatã.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Leviatã é apresentado poeticamente como uma poderosa criatura ligada ao caos; sua identificação exata neste versículo é incerta.
    reason: A imagem depende de um contexto cultural antigo e não deve ser silenciosamente identificada com um animal específico ou com uma categoria teológica posterior.
lexical_decisions:
- source_word: יִקְּבֻהוּ
  choice: Que a amaldiçoem
  rationale: O jussivo expressa um desejo ou convocação. O pronome feminino retoma naturalmente “a noite” do contexto imediato em português, embora o sufixo hebraico não marque feminino.
- source_word: אֹרְרֵי יוֹם
  choice: os que amaldiçoam os dias
  rationale: A construção significa literalmente “os que amaldiçoam dia”. O plural idiomático em português apresenta esse grupo como pessoas conhecidas por lançar maldições sobre dias, em consonância com o sentido contextual e com a camada inglesa auditada.
- source_word: הָעֲתִידִים
  choice: os que estão prontos
  rationale: O particípio indica os que estão preparados ou dispostos; “estão prontos” preserva essa ideia sem pressupor que realmente tenham tal poder.
- source_word: עֹרֵר
  choice: despertar
  rationale: O infinitivo significa suscitar, acordar ou provocar. “Despertar” mantém a imagem poética de fazer Leviatã levantar-se.
- source_word: לִוְיָתָן
  choice: o Leviatã
  rationale: Mantém o nome tradicional da criatura, sem reduzir a imagem a um animal comum nem impor uma identificação específica.
theological_decisions:
- issue: Natureza e poder de Leviatã
  choice: Preservar Leviatã como figura poética não explicada no corpo do texto
  alternative: Identificá-lo diretamente como dragão, monstro marinho, crocodilo ou ser demoníaco
  rationale: O texto evoca uma criatura poderosa associada ao caos, mas não resolve aqui sua natureza nem afirma que os amaldiçoadores realmente consigam despertá-la.
- issue: Referente do objeto de “amaldiçoem”
  choice: Usar o pronome feminino “a”, retomando a noite no contexto
  alternative: Usar “o”, ligando o pronome ao dia mencionado no próprio versículo
  rationale: O discurso de Jó continua a imprecação contra a noite de seu nascimento. Em português, a concordância semântica com “noite” torna a referência mais natural, sem apagar a presença de “dias” na oração seguinte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. A formulação evita arcaísmos e mantém a intensidade imprecatória e a ambiguidade da imagem de Leviatã.
