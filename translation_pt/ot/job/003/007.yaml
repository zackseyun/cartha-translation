- source_word: רְנָנָה
  choice: grito de alegria
  rationale: Expressa uma manifestação vocal jubilosa, provavelmente ligada à celebração de um nascimento, sem explicitar além do hebraico.
- source_word: תָּבֹא ... בּוֹ
  choice: entre nela
  rationale: Reproduz naturalmente o movimento figurado de vir para dentro da noite, em vez de enfraquecê-lo para simples ocorrência.
