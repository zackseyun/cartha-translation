  source_fidelity: 'O hebraico traz שני imperfeitos em sequência volitiva: “que ele me pese” e “que Deus conheça a minha integridade”. A tradução de ידע por “reconheça” é possível em certos contextos forenses, mas acrescenta a ideia de atestação que não está explicitada; “conheça” reproduz com maior precisão o verbo hebraico. Tornar Deus sujeito já na primeira oração é uma explicitação contextual segura, pois o segundo membro o nomeia e ele é o examinador implícito.'
