  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: pt
  text: Que Deus me pese em balanças justas[a] e conheça a minha integridade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em balanças de justiça” ou “em balanças honestas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a minha irrepreensibilidade” ou “a minha inocência”.'
