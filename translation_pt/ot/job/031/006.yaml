lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Que ele me pese
  rationale: 'O imperfeito qal com sufixo de primeira pessoa tem aqui força volitiva: Jó convida Deus a examiná-lo. A formulação preserva tanto essa nuance quanto a metáfora da pesagem.'
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: em balanças justas
  rationale: מֹאזְנַיִם designa balanças, e צֶדֶק comunica justiça, retidão ou exatidão. “Balanças justas” é natural em português e mantém a imagem de uma avaliação imparcial.
- source_word: וְיֵדַע
  choice: e que ... reconheça
  rationale: A conjunção seguida do imperfeito pode prolongar a força volitiva do primeiro verbo. Neste contexto forense, “reconheça” exprime que a pesagem comprovará a integridade de Jó, sem reduzir o verbo a mera aquisição de informação.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Forma poética singular frequente em Jó, sem fundamento no versículo para uma expansão como “Deus Todo-Poderoso”.
- source_word: תֻּמָּתִי
  choice: a minha integridade
  rationale: תֻּמָּה denota inteireza moral, integridade ou irrepreensibilidade. “Integridade” preserva a reivindicação de retidão de Jó sem necessariamente afirmar impecabilidade absoluta.
theological_decisions:
- issue: Alcance da autodescrição de Jó
  choice: a minha integridade
  alternative: a minha inocência; a minha irrepreensibilidade
  rationale: Jó pede uma avaliação divina justa e reivindica inteireza moral. “Integridade” mantém a tensão do texto sem converter sua defesa em uma declaração inequívoca de ausência absoluta de pecado.
- issue: Sentido de וְיֵדַע aplicado a Deus
  choice: e que Deus reconheça
  alternative: e que Deus conheça; então Deus conhecerá
  rationale: “Reconheça” evita sugerir que Deus antes ignorava a condição de Jó e, ao mesmo tempo, conserva o sentido de constatar ou atestar resultante da avaliação. A nota registra a tradução mais estritamente lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe volitiva “Que ele... e que...” preserva o paralelismo hebraico; “balanças justas” mantém a metáfora forense sem soar arcaica.
