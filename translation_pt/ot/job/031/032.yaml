  text: בַּ֭/חוּץ לֹא יָלִ֣ין גֵּ֑ר דְּ֝לָתַ֗/י לָ/אֹ֥רַח אֶפְתָּֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/032.yaml
  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: pt
  text: O estrangeiro não passava a noite ao relento; eu abria as minhas portas ao viajante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O forasteiro não pernoitava do lado de fora; eu abria a minha porta ao viajante.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: ao relento
  rationale: Expressa naturalmente, em português, a ideia de permanecer fora, ao ar livre, no contexto de alguém sem abrigo para a noite.
- source_word: יָלִין
  choice: passava a noite
  rationale: Preserva o sentido específico de pernoitar e, com o imperfeito, comunica uma situação habitual na declaração de Jó.
- source_word: גֵּר
  choice: o estrangeiro
  rationale: Designa o não nativo que vive ou circula entre o povo, muitas vezes em condição social vulnerável; 'estrangeiro' é corrente e acessível, embora 'forasteiro' também seja possível.
- source_word: דְּלָתַי
  choice: as minhas portas
  rationale: Mantém o plural do hebraico e transmite de modo natural a imagem de hospitalidade.
- source_word: לָאֹרַח
  choice: ao viajante
  rationale: No contexto, אֹרַח se refere à pessoa em viagem que necessita de hospedagem, não ao caminho em si.
- source_word: אֶפְתָּח
  choice: eu abria
  rationale: O imperfeito português expressa adequadamente a ação habitual evocada pela forma verbal hebraica no contexto da defesa de Jó.
