  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: pt
  text: Não permiti que minha boca pecasse, pedindo com uma maldição a vida dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um juramento”. O substantivo hebraico pode significar tanto “maldição, imprecação” como “juramento”; neste contexto de desejar o mal, “maldição” parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: permiti
  rationale: A construção com o infinitivo expressa permissão; na forma negativa, comunica que Jó não consentiu nesse uso da fala.
- source_word: לַחֲטֹא
  choice: que ... pecasse
  rationale: O infinitivo preserva aqui o sentido moral usual de חטא, indicando a ação errada que Jó não permitiu.
- source_word: חִכִּי
  choice: minha boca
  rationale: Embora o substantivo signifique literalmente 'palato', na poesia pode representar o órgão da fala; 'boca' é a metonímia natural em português.
- source_word: לִשְׁאֹל
  choice: pedindo
  rationale: O infinitivo apresenta o modo ou conteúdo do pecado verbal; o gerúndio liga naturalmente esse ato a 'pecasse'.
- source_word: בְּאָלָה
  choice: com uma maldição
  rationale: אָלָה pode designar maldição ou imprecação e, em certos contextos, juramento. A referência contextual a desejar dano favorece 'maldição', mantendo-se a alternativa em nota.
- source_word: נַפְשׁוֹ
  choice: a vida dele
  rationale: נפשׁ pode significar 'vida' ou a própria pessoa. Aqui se refere à vida do inimigo, sem implicar uma afirmação metafísica sobre a alma.
