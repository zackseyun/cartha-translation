  text: גַּם ה֭וּא עָוֺ֣ן פְּלִילִ֑י כִּֽי כִחַ֖שְׁתִּי לָ/אֵ֣ל מִ/מָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/028.yaml
  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: pt
  text: Isso também seria uma iniquidade sujeita a julgamento[a], pois eu teria negado o Deus do alto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma iniquidade punível pelos juízes”, “um delito judicial” ou “uma iniquidade passível de juízo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois eu teria sido infiel ao Deus do alto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Isso também
  rationale: Retoma a conduta descrita no versículo anterior e a acrescenta à série de atos que Jó afirma não ter praticado.
- source_word: עָוֺן
  choice: iniquidade
  rationale: Preserva tanto o peso moral quanto a dimensão jurídica do termo neste contexto de declaração judicial.
- source_word: פְּלִילִי
  choice: sujeita a julgamento
  rationale: Expressa de modo natural em português a ideia de uma falta passível de decisão ou punição judicial, sem eliminar as alternativas lexicais possíveis.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual a conduta mencionada constituiria uma iniquidade sujeita a julgamento.
- source_word: כִחַשְׁתִּי
  choice: eu teria negado
  rationale: No contexto da veneração dos astros, o verbo indica negar ou renegar a lealdade devida a Deus; o condicional decorre da sequência hipotética do capítulo.
- source_word: לָאֵל
  choice: o Deus
  rationale: O português rege naturalmente o verbo 'negar' sem repetir a preposição hebraica; o artigo produz uma construção idiomática com o qualificativo seguinte.
- source_word: מִמָּעַל
  choice: do alto
  rationale: Mantém a expressão breve e o contraste vertical com os corpos celestes mencionados no contexto, sem acrescentar explicitamente 'céu'.
theological_decisions:
- issue: Se מִמָּעַל deve ser ampliado como referência explícita ao céu
  choice: o Deus do alto
  alternative: Deus que está no alto; Deus nos céus
  rationale: A formulação conserva a brevidade e a imagem espacial do hebraico. Evita introduzir 'céus', palavra não expressa no texto, e mantém o contraste contextual com o culto aos astros.
- issue: Se כִחַשְׁתִּי descreve negação ou infidelidade
  choice: eu teria negado
  alternative: eu teria sido infiel a
  rationale: Ambos os sentidos são lexicalmente possíveis. 'Negado' se ajusta ao contexto de deslealdade religiosa, enquanto a nota preserva a leitura relacional de infidelidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Iniquidade” conserva a gravidade moral e jurídica; “sujeita a julgamento” esclarece o raro termo judicial sem tornar a tradução excessivamente técnica.
