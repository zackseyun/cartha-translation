lexical_decisions:
- source_word: מִסְפַּר
  choice: o número dos
  rationale: Preserva a expressão concreta do hebraico, que também pode sugerir uma prestação de contas completa.
- source_word: צְעָדַי
  choice: meus passos
  rationale: Mantém tanto o sentido literal quanto a possível metáfora da conduta ou trajetória de vida.
- source_word: אַגִּידֶנּוּ
  choice: Eu lhe declararia
  rationale: O hifil de נגד significa declarar, contar ou dar a conhecer; a formulação conserva o tom formal e forense, tratando o sufixo masculino como objeto indireto.
- source_word: כְּמוֹ
  choice: como
  rationale: Expressa de modo natural a comparação introduzida pela partícula hebraica.
- source_word: נָגִיד
  choice: um príncipe
  rationale: Comunica a dignidade e confiança da comparação; o termo também pode designar governante, líder ou nobre.
- source_word: אֲקָרֲבֶנּוּ
  choice: eu me aproximaria dele
  rationale: Reproduz o sentido de aproximar-se e mantém explícito o sufixo pessoal masculino sem identificar seu referente.
theological_decisions:
- issue: Referente dos sufixos masculinos em “lhe declararia” e “me aproximaria dele”
  choice: Mantido implicitamente como “lhe/dele”
  alternative: Identificá-lo como Deus ou como o acusador de Jó
  rationale: O hebraico não nomeia o referente neste versículo, e o contexto imediato permite mais de uma compreensão; a tradução preserva essa abertura.
