  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: pt
  text: Se andei com falsidade[a], e meu pé se apressou rumo ao engano[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Andar” é uma expressão hebraica que também se refere à conduta ou ao modo de viver.
    reason: cultural_note
  - marker: b
    text: 'Ou: “se apressou atrás do engano”. A preposição hebraica pode indicar direção: “para”, “rumo a” ou “atrás de”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição na fórmula de autoimprecação de Jó, sem acrescentar uma ênfase ausente do hebraico.
- source_word: הָלַכְתִּי
  choice: tenho andado
  rationale: Preserva a metáfora hebraica de andar como modo de viver e expressa naturalmente uma conduta que se estende até o presente contexto.
- source_word: עִם
  choice: com
  rationale: Mantém o sentido direto de associação ou companhia expresso pela preposição hebraica.
- source_word: שָׁוְא
  choice: a falsidade
  rationale: No paralelismo com מִרְמָה, o termo tem aqui sentido ético de falsidade, mais adequado do que ideias abstratas como vazio ou vaidade.
- source_word: וַתַּחַשׁ
  choice: e ... se apressou
  rationale: Reproduz o movimento rápido indicado pelo verbo e conserva a personificação poética do pé.
- source_word: עַל
  choice: rumo a
  rationale: Com verbo de movimento, a preposição pode indicar direção; esta formulação comunica isso em português sem apagar a possibilidade de entendê-la como ir atrás de algo.
- source_word: מִרְמָה
  choice: engano
  rationale: Expressa conduta enganosa ou fraudulenta sem restringir o sentido a fraude comercial ou a traição.
- source_word: רַגְלִי
  choice: o meu pé
  rationale: Mantém o singular do hebraico e sua imagem poética da conduta como um caminho percorrido.
