  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: pt
  text: Fiz uma aliança com meus olhos; como, então, poderia fixar os olhos numa virgem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que, então, eu olharia atentamente para uma virgem?”'
    reason: Alternativa lexical e sintática para וּמָה אֶתְבּוֹנֵן, preservando a possibilidade de uma pergunta com o sentido de “por que deveria eu olhar?”.
lexical_decisions:
- source_word: בְּרִית
  choice: aliança
  rationale: Preserva o sentido de compromisso solene e vinculante e corresponde naturalmente à expressão hebraica כרת ברית.
- source_word: כָּרַתִּי
  choice: fiz
  rationale: Embora o hebraico diga literalmente 'cortei', 'fiz uma aliança' é a expressão idiomática corrente em português.
- source_word: לְעֵינַי
  choice: com os meus olhos
  rationale: 'Traduz de modo natural a relação expressa pela preposição ל: os olhos são apresentados como participantes ou objeto do compromisso autoimposto.'
- source_word: וּמָה
  choice: como, então, poderia
  rationale: Expressa a pergunta retórica e a força inferencial que liga a conduta à aliança mencionada na oração anterior.
- source_word: אֶתְבּוֹנֵן
  choice: fixá-los
  rationale: O verbo indica olhar atento ou contemplação deliberada, não um simples olhar passageiro; o pronome retoma naturalmente 'olhos' em português.
- source_word: עַל
  choice: numa
  rationale: A contração de 'em uma' é idiomática em português com 'fixar os olhos em'.
- source_word: בְּתוּלָה
  choice: virgem
  rationale: Mantém o sentido lexical específico do substantivo hebraico, sem ampliá-lo para o mais genérico 'jovem'.
theological_decisions:
- issue: Natureza moral do olhar
  choice: Não acrescentar 'com desejo' ou 'de modo cobiçoso' ao texto
  alternative: Explicitar 'olhar com desejo para uma virgem'
  rationale: O contexto pode implicar intenção sexual, mas essas palavras não aparecem no hebraico; a tradução preserva a concisão e a tensão do original.
- issue: Valor interrogativo de וּמָה
  choice: Entender como 'como, então, poderia'
  alternative: Traduzir como 'por que, então, olharia'
  rationale: As duas leituras são possíveis no contexto. O texto principal realça a incompatibilidade lógica com a aliança, enquanto a nota conserva a alternativa volitiva ou causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Aliança' mantém o peso formal do hebraico; 'fixar os olhos' comunica um olhar deliberado sem inserir explicitamente uma motivação sexual ausente do texto.
