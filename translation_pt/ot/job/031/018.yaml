  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: pt
  text: pois, desde a minha juventude, ele me criou como um pai[a], e, desde o ventre de minha mãe, eu a guiei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta oração é difícil. Também pode ser entendido como “ele cresceu comigo como se eu fosse seu pai” ou, segundo outra leitura, “eu o criei como um pai”.
    reason: alternative_reading
  - marker: b
    text: O pronome feminino “a” provavelmente se refere à viúva mencionada no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a justificativa da declaração de Jó no contexto; “pois” conserva o nexo argumentativo.
- source_word: מִנְּעוּרַי
  choice: desde a minha juventude
  rationale: Expressa o ponto inicial temporal de modo natural e fiel em português.
- source_word: גְּדֵלַנִי
  choice: ele me criou
  rationale: Conserva o verbo com sujeito masculino implícito e objeto de primeira pessoa conforme o texto massorético, sem corrigir silenciosamente a construção difícil.
- source_word: כְאָב
  choice: como um pai
  rationale: Mantém a comparação marcada por כְּ e sua imagem paterna.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: e, desde o ventre de minha mãe
  rationale: Preserva a expressão temporal enfática e a coordenação do hebraico.
- source_word: אַנְחֶנָּה
  choice: eu a guiei
  rationale: Traduz o hifil de נחה e mantém o sufixo feminino singular, provavelmente referente à viúva do versículo anterior.
theological_decisions:
- issue: Mudança de referente dentro do versículo
  choice: Manter o sujeito masculino implícito na primeira oração e o objeto feminino na segunda.
  alternative: Entender ambas as orações como descrições gerais do cuidado paterno de Jó, ou adotar uma leitura textual segundo a qual Jó criou o órfão.
  rationale: A forma massorética apresenta uma transição gramatical incomum. A tradução preserva essa tensão em vez de uniformizar os referentes ou introduzir uma emenda no texto principal.
- issue: Sentido da difícil forma גְּדֵלַנִי
  choice: “ele me criou”
  alternative: “ele cresceu comigo como se eu fosse seu pai” ou “eu o criei como um pai”
  rationale: A formulação principal segue de perto as pessoas gramaticais do texto consonantal e vocalizado recebido. Como o sentido contextual é debatido, as leituras mais usuais são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção deliberadamente incomum na primeira oração para refletir a dificuldade real do hebraico. As vírgulas destacam as duas expressões temporais sem tornar o versículo excessivamente arcaico.
