  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: pt
  text: 'se comi meu bocado sozinho,

    e o órfão[a] não comeu dele—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a pessoa sem pai». O hebraico refere-se literalmente a alguém que não tem pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: se comi
  rationale: No contexto dos juramentos de inocência de Jó 31, o waw introduz mais uma condição, por isso o português natural pede “se”; o verbo é qal na primeira pessoa do singular.
- source_word: פִּתִּי
  choice: o meu pedaço de pão
  rationale: פַּת designa um pedaço ou bocado, frequentemente de pão. “Pedaço de pão” mantém a imagem concreta e é mais natural em português corrente do que “meu bocado”.
- source_word: לְבַדִּי
  choice: sozinho
  rationale: Expressa que Jó teria comido sem compartilhar; “sozinho” é direto e idiomático, sem intensificar para “somente para mim”.
- source_word: וְלֹא אָכַל
  choice: e ... não comeu
  rationale: A conjunção coordena a segunda parte da condição, e o perfeito qal de terceira pessoa masculina singular é adequadamente expresso pelo pretérito perfeito.
- source_word: יָתוֹם
  choice: o órfão
  rationale: O termo hebraico designa especificamente alguém sem pai. “Órfão” é a forma moderna, clara e amplamente compreendida em português; a nuance lexical mais estrita é registrada em nota.
- source_word: מִמֶּנָּה
  choice: dele
  rationale: O sufixo feminino singular retoma פִּתִּי; em português, “dele” concorda naturalmente com “pedaço de pão” e significa que o órfão não participou dessa porção.
