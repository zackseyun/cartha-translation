source:
  edition: WLC
  text: אִם נִפְתָּ֣ה לִ֭בִּ/י עַל אִשָּׁ֑ה וְ/עַל פֶּ֖תַח רֵעִ֣/י אָרָֽבְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: pt
  text: Se o meu coração foi seduzido por uma mulher[a] e fiquei à espreita à porta do meu próximo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi atraído”, “foi enganado” ou “foi persuadido”. O verbo hebraico pode indicar sedução, atração, engano ou persuasão; aqui aparece num contexto de tentação sexual.
    reason: lexical_alternative
  - marker: b
    text: Ou “do meu amigo” ou “do meu companheiro”. A palavra hebraica pode ter qualquer um desses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  choice: foi seduzido
  rationale: O nifal de פתה pode indicar ser seduzido, atraído, persuadido ou enganado. Neste contexto de tentação sexual, “foi seduzido” expressa com naturalidade o desejo interior sem acrescentar um ato físico não declarado no versículo.
- source_word: לִבִּי
  choice: o meu coração
  rationale: Preserva a imagem antropológica hebraica do coração como centro dos desejos, intenções e decisões.
- source_word: עַל אִשָּׁה
  choice: por uma mulher
  rationale: No contexto, a expressão identifica a mulher como foco ou ocasião da sedução. A formulação portuguesa é natural, embora a preposição hebraica admita nuances como “por causa de” ou “em relação a”.
- source_word: פֶּתַח
  choice: à porta
  rationale: “Porta” é uma tradução concisa e natural para פתח e se ajusta à cena de alguém que espera secretamente junto à entrada da casa.
- source_word: רֵעִי
  choice: do meu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” mantém o sentido social amplo e evita presumir amizade íntima.
- source_word: אָרָבְתִּי
  choice: fiquei à espreita
  rationale: ארב descreve esperar escondido ou de modo furtivo, geralmente com intenção hostil ou ilícita. “Fiquei à espreita” comunica essa clandestinidade com clareza em português.
theological_decisions:
- issue: Enquadramento moral do juramento de Jó sobre adultério
  choice: Preservar a progressão entre a sedução do coração e a ação deliberada de ficar à espreita junto à porta do próximo.
  alternative: Explicitar como tentativa de adultério ou suavizar como mera atração romântica.
  rationale: O hebraico apresenta desejo interior e conduta clandestina, mas não nomeia diretamente o adultério neste versículo. A tradução conserva sua gravidade ética sem tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “foi seduzido” mantém a voz passiva do hebraico; “fiquei à espreita” transmite a ação furtiva sem recorrer a linguagem arcaica.
