  text: אִם לֹ֣א אָ֭מְרוּ מְתֵ֣י אָהֳלִ֑/י מִֽי יִתֵּ֥ן מִ֝/בְּשָׂר֗/וֹ לֹ֣א נִשְׂבָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/031.yaml
  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: pt
  text: 'Se os homens da minha tenda[a] não disseram: “Quem não se fartou da carne dele?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os homens da minha casa”; “tenda” pode representar a casa ou o círculo doméstico de uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da carne dele”; aqui, a expressão provavelmente se refere à carne ou à comida fornecida por Jó à sua mesa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Se ... não
  rationale: Mantém a estrutura condicional da fórmula de juramento hebraica e a tensão de uma declaração que prossegue no contexto, sem convertê-la silenciosamente em uma afirmação enfática.
- source_word: מְתֵי אָהֳלִי
  choice: os homens da minha tenda
  rationale: Preserva a imagem concreta do hebraico; no contexto, a expressão pode abranger os homens da casa ou do círculo doméstico de Jó.
- source_word: מִי יִתֵּן
  choice: Quem
  rationale: Neste contexto, a expressão introduz uma pergunta retórica, não o desejo normalmente expresso por “Quem dera”.
- source_word: מִבְּשָׂרוֹ
  choice: da carne dele
  rationale: Reproduz de perto o hebraico e conserva a possível ressonância de “carne”, embora no contexto provavelmente se refira à carne ou comida fornecida por Jó.
- source_word: לֹא נִשְׂבָּע
  choice: não se fartou
  rationale: 'Expressa de modo natural o sentido do nifal de שׂבע: comer até ficar satisfeito ou plenamente saciado.'
theological_decisions:
- issue: Referente do sufixo em מִבְּשָׂרוֹ
  choice: dele
  alternative: da minha carne / da carne que eu oferecia
  rationale: O hebraico traz um pronome de terceira pessoa, cujo referente é entendido pelo contexto. A tradução conserva essa forma sem explicitar além do texto que se trata da provisão de Jó.
- issue: Sentido da declaração dos homens da tenda
  choice: Mantida como pergunta retórica sobre ter-se fartado
  alternative: Entender como desejo hostil de devorar a carne de alguém
  rationale: O contexto imediato pode suscitar discussão, mas a formulação lexical combina naturalmente com o testemunho da generosa provisão de Jó. A tradução não acrescenta uma interpretação específica ao enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção concisa. “Fartou” comunica satisfação plena ao comer; “carne” preserva tanto a proximidade lexical quanto a ambiguidade do original.
