  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: pt
  text: Se neguei aos pobres aquilo que desejavam[a], ou fiz desfalecer os olhos da viúva[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “impedi que os pobres alcançassem o que desejavam”; no contexto, pode referir-se àquilo de que necessitavam.'
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica que indica longa espera, anseio ou esperança frustrada.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma das condições na autoimprecação de Jó 31; “Se” preserva de modo natural a estrutura do juramento.
- source_word: אֶמְנַע
  choice: neguei
  rationale: O qal de מנע significa reter, impedir ou negar. No contexto, “neguei” expressa com naturalidade a privação de algo desejado pelos pobres.
- source_word: מֵחֵפֶץ דַּלִּים
  choice: aos pobres aquilo que desejavam
  rationale: A construção hebraica pode ser entendida literalmente como privar os pobres de seu desejo, isto é, daquilo que desejavam. A formulação mantém o sentido de חֵפֶץ sem limitar implicitamente o referente a uma necessidade.
- source_word: דַּלִּים
  choice: os pobres
  rationale: דַּלִּים pode designar os pobres, fracos ou socialmente desfavorecidos; “os pobres” é claro e adequado ao contexto de responsabilidade social.
- source_word: וְ
  choice: ou
  rationale: Embora a conjunção seja normalmente “e”, em uma sequência de condições negativas de autoimprecação o português usa naturalmente “ou” para ligar acusações alternativas.
- source_word: עֵינֵי אַלְמָנָה
  choice: os olhos da viúva
  rationale: Preserva a imagem concreta e a forma representativa singular do hebraico.
- source_word: אֲכַלֶּה
  choice: fiz desfalecer
  rationale: O piel de כלה pode significar consumir, acabar ou fazer definhar. Com “olhos”, forma um idioma de expectativa prolongada e frustrada; “fiz desfalecer” conserva a metáfora sem a explicar no corpo do texto.
theological_decisions: []
