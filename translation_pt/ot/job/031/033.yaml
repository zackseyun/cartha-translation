base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: pt
  text: se encobri minhas transgressões como um homem[a], escondendo minha iniquidade no meu seio—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como Adão”. O hebraico אָדָם pode significar “homem” ou ser lido como o nome próprio “Adão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz diretamente a oração condicional na fórmula de juramento de Jó, sem acrescentar ênfase interpretativa.
- source_word: כִּסִּיתִי
  choice: encobri
  rationale: Preserva a imagem concreta de cobrir e, em português atual, também comunica naturalmente a ideia de ocultar uma falta.
- source_word: כְאָדָם
  choice: como um homem
  rationale: Mantém no texto principal a leitura de אָדָם como substantivo comum, enquanto a possível leitura como nome próprio é registrada em nota.
- source_word: פְּשָׁעָי
  choice: minhas transgressões
  rationale: Conserva o teor moral e jurídico de פֶּשַׁע e sua possível nuance de rebeldia, sem reduzi-lo ao termo mais genérico “pecados”.
- source_word: לִטְמוֹן
  choice: escondendo
  rationale: Expressa de modo natural o meio pelo qual as transgressões teriam sido encobertas.
- source_word: בְּחֻבִּי
  choice: no íntimo do peito
  rationale: Retém a imagem corporal de algo oculto junto ao peito, mas evita a formulação pouco natural “em meu seio” no português corrente.
- source_word: עֲוֹנִי
  choice: minha iniquidade
  rationale: Preserva o peso moral de עָוֹן e mantém distinção lexical em relação a “transgressões”.
theological_decisions:
- issue: Sentido de אָדָם em כְאָדָם
  choice: 'substantivo comum: “como um homem”'
  alternative: 'nome próprio: “como Adão”'
  rationale: O hebraico admite tanto a referência genérica ao ser humano quanto uma alusão a Adão. A tradução principal conserva a leitura comum sem eliminar a leitura teologicamente significativa, que aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção permanece incompleta com travessão porque o versículo integra a sequência condicional do juramento de Jó.
