id: JOB.31.34
reference: Job 31:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: pt
  text: 'porque[a] tive medo da grande multidão,

    e o desprezo dos clãs[b] me aterrorizou,

    de modo que fiquei calado e não saí pela porta—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se”. O hebraico é elíptico no contexto do juramento de inocência de Jó e pode apresentar uma situação hipotética: “se tive medo...”'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Ou: “das famílias”. O termo hebraico pode indicar famílias extensas ou grupos mais amplos de parentesco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: Introduz naturalmente a razão hipotética para o silêncio de Jó dentro de seu juramento de inocência; a possível leitura condicional é preservada em nota.
- source_word: אֶעֱרוֹץ
  choice: tive medo
  rationale: Expressa de modo corrente o temor ou pavor indicado por ערץ, sem tornar a frase desnecessariamente enfática.
- source_word: הָמוֹן רַבָּה
  choice: a grande multidão
  rationale: Preserva tanto a ideia coletiva de הָמוֹן quanto a dimensão ou força social indicada por רַבָּה.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: e o desprezo dos clãs
  rationale: בּוּז designa desprezo ou escárnio; 'clãs' comunica melhor que 'famílias' os grupos amplos de parentesco e sua pressão social no contexto antigo.
- source_word: יְחִתֵּנִי
  choice: me aterrorizou
  rationale: O hifil de חתת descreve alguém levado ao medo ou à perda de coragem; a escolha conserva a força emocional do verbo.
- source_word: וָאֶדֹּם
  choice: de modo que fiquei calado
  rationale: Torna explícita, de maneira natural em português, a relação resultativa entre o medo descrito e o silêncio, sem alterar o conteúdo da oração.
- source_word: לֹא אֵצֵא פָתַח
  choice: não saí pela porta
  rationale: Mantém a imagem concreta de permanecer dentro por temor, evitando substituir 'porta/entrada' pela expressão interpretativa 'de casa'.
theological_decisions:
- issue: Relação de Jó com a opinião pública em seu juramento de inocência
  choice: Manter a frase como motivo hipotético de silêncio e reclusão
  alternative: Lê-la como confissão de que Jó realmente cedeu ao medo público
  rationale: O contexto do juramento favorece uma situação negada ou subordinada à autodefesa de Jó; a tradução não deve transformar essa estrutura elíptica em admissão inequívoca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e o travessão final preservam a continuidade sintática do juramento. As notas conservam as ambiguidades reais de כִּי e מִשְׁפָּחוֹת.
