  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: pt
  text: E qual é a porção que vem de Deus, do alto, e a herança que vem do Todo-Poderoso, das alturas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶה
  choice: E qual é
  rationale: A conjunção mantém a ligação com o argumento anterior, e a expressão interrogativa introduz uma pergunta retórica.
- source_word: חֵלֶק
  choice: porção
  rationale: O termo designa uma parte ou cota atribuída e forma um paralelo poético natural com “herança”.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: É a forma poética singular comum para Deus no livro de Jó; “Deus” comunica o sentido sem acrescentar um título ausente do hebraico.
- source_word: מִמָּעַל
  choice: lá do alto
  rationale: A expressão indica procedência desde o alto. No texto principal, fica ligada de modo natural a Deus, preservando-se em nota a possibilidade de uma leitura mais adverbial.
- source_word: וְנַחֲלַת
  choice: e a herança
  rationale: O substantivo indica herança ou propriedade recebida por atribuição e corresponde poeticamente a “porção”.
- source_word: שַׁדַּי
  choice: Todo-Poderoso
  rationale: Traduz o título divino tradicionalmente vertido assim, tornando seu valor compreensível ao leitor moderno.
- source_word: מִמְּרֹמִים
  choice: das alturas
  rationale: O plural hebraico refere-se às alturas e, com a preposição, expressa procedência; a tradução evita especificar “céu”, que não aparece explicitamente.
theological_decisions:
- issue: Títulos divinos na poesia hebraica
  choice: Traduzir אֱלוֹהַּ por “Deus” e שַׁדַּי por “Todo-Poderoso”
  alternative: “Deus ... Shaddai”
  rationale: Os dois termos divinos aparecem em paralelo. Traduzir o título שַׁדַּי comunica seu sentido aos leitores sem introduzir uma distinção doutrinária não explicitada no verso.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético preservado. A formulação mantém a pergunta retórica e a repetição da ideia de procedência presente nas duas metades do verso.
