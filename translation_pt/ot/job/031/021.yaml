  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a estrutura condicional do juramento e o travessão final indica que a consequência continua no versículo seguinte. “Portão da cidade” evita a possível leitura doméstica de “porta” e torna o cenário cultural inteligível.
