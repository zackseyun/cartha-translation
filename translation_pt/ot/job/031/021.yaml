  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: pt
  text: se levantei a mão contra o órfão,[a] por ver que eu tinha apoio no portão da cidade —[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra quem não tinha pai”. O termo hebraico se refere especificamente a quem foi privado do pai e, por isso, se encontrava socialmente vulnerável.
    reason: lexical_alternative
  - marker: b
    text: O portão da cidade era o lugar onde os anciãos julgavam causas e onde se tomavam decisões públicas.
    reason: cultural_note
  - marker: c
    text: Literalmente, “minha ajuda”; aqui significa apoio ou respaldo num contexto jurídico e público.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz a condição do juramento de inocência de Jó, cuja consequência aparece no versículo seguinte.
- source_word: הֲנִיפוֹתִי עַל ... יָדִי
  choice: levantei a mão contra
  rationale: Reproduz de modo natural o gesto hostil indicado pelo hifil de נוּף com עַל, sem especificar indevidamente se houve ameaça ou agressão efetiva.
- source_word: יָתוֹם
  choice: órfão
  rationale: Termo corrente e digno em português; no contexto hebraico, designa especificamente quem perdeu o pai e ficou socialmente vulnerável.
- source_word: כִּי
  choice: por
  rationale: 'Expressa de maneira concisa o valor causal: o apoio percebido seria o motivo do abuso de poder.'
- source_word: אֶרְאֶה
  choice: ver
  rationale: Mantém o verbo de percepção do hebraico e se encaixa naturalmente na construção condicional iniciada por “se”.
- source_word: בַשַּׁעַר
  choice: no portão da cidade
  rationale: 'Explicita apenas o referente cultural implícito: o portão urbano era o local de julgamentos e decisões públicas.'
- source_word: עֶזְרָתִי
  choice: eu tinha apoio
  rationale: Traduz idiomaticamente o literal “minha ajuda” como apoio ou respaldo disponível no foro público.
theological_decisions: []
