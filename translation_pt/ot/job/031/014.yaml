  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: pt
  text: E o que eu faria quando Deus se levantasse? E, quando ele me chamasse a prestar contas[a], o que eu lhe responderia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quando ele me visitasse» / «quando ele me examinasse». O verbo hebraico pode significar visitar, inspecionar ou chamar a prestar contas; neste contexto, a ideia de responsabilização judicial parece predominar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: E o que
  rationale: Preserva a conjunção e introduz de modo natural a pergunta retórica abrupta de Jó.
- source_word: אֶעֱשֶׂה
  choice: eu faria
  rationale: O imperfeito hebraico, neste cenário futuro contemplado retoricamente, tem força modal e hipotética.
- source_word: כִּי יָקוּם
  choice: quando ... se levantasse
  rationale: Entende כִּי temporalmente e conserva a metáfora de Deus levantar-se para agir, sem explicá-la em excesso.
- source_word: אֵל
  choice: Deus
  rationale: Equivalente direto e natural do título divino אֵל neste contexto.
- source_word: וְכִי יִפְקֹד
  choice: E, quando ele me chamasse a prestar contas
  rationale: פקד pode indicar visitar, inspecionar ou exigir contas; o paralelismo com a resposta que Jó teria de dar favorece aqui a nuance judicial.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: o que eu lhe responderia
  rationale: Expressa naturalmente o sentido idiomático de dar uma resposta, preservando o pronome referente a Deus.
theological_decisions:
- issue: Imagem de julgamento divino
  choice: Apresentar Deus levantando-se e chamando Jó a prestar contas, sem limitar a cena ao juízo final.
  alternative: Traduzir de modo mais geral como Deus visitando ou examinando Jó, ou especificar um julgamento escatológico.
  rationale: O contexto e o paralelismo sustentam escrutínio e responsabilidade diante de Deus, mas o versículo não determina que se trate especificamente do juízo final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O subjuntivo em «quando ... se levantasse» e «quando ... chamasse» harmoniza-se com o cenário hipotético expresso por «faria» e «responderia».
