base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: pt
  text: 'Se fiz do ouro a minha confiança[a] e disse ao ouro puro[b]: “Você é a minha segurança”[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha esperança”.'
    reason: lexical_alternative
  - marker: b
    text: “Ouro puro” traduz כֶּתֶם, termo que se refere a ouro refinado ou de alta pureza.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Você é aquilo em que confio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição na fórmula de juramento de inocência de Jó e mantém a estrutura que prossegue nos versículos seguintes.
- source_word: שַׂמְתִּי
  choice: fiz
  rationale: No idioma formado com o objeto e seu complemento, comunica naturalmente que Jó teria constituído o ouro como sua fonte de confiança.
- source_word: זָהָב
  choice: ouro
  rationale: Correspondência direta e natural.
- source_word: כִּסְלִי
  choice: a minha confiança
  rationale: כֶּסֶל pode indicar confiança ou esperança. “Confiança” se ajusta à ideia de depender da riqueza e permite preservar a variação lexical em relação a מִבְטַחִי.
- source_word: וְלַכֶּתֶם
  choice: e disse ao ouro puro
  rationale: כֶּתֶם designa ouro refinado ou puro; a preposição ל marca o destinatário de “disse”. A inclusão de “disse” nesta decisão representa a construção completa em português.
- source_word: אָמַרְתִּי
  choice: disse
  rationale: O pretérito perfeito coordena-se naturalmente com “fiz” dentro da condição.
- source_word: מִבְטַחִי
  choice: a minha segurança
  rationale: מִבְטָח pode designar aquilo em que se confia ou que proporciona segurança. “Segurança” evita repetir “confiança” e conserva a variação do hebraico.
theological_decisions:
- issue: A negação de Jó de ter depositado confiança na riqueza
  choice: 'Manter a formulação condicional: “Se fiz do ouro a minha confiança...”'
  alternative: “Se pus a minha esperança no ouro...”
  rationale: A condição faz parte da declaração solene de inocência que se desenvolve no capítulo. A tradução preserva a denúncia implícita da dependência da riqueza sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você” torna natural a personificação do ouro; a pontuação mantém o versículo aberto porque a condição continua no contexto imediato.
