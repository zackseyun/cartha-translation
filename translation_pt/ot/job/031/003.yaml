lexical_decisions:
- source_word: הֲלֹא
  choice: Não é
  rationale: Preserva a forma de pergunta retórica, que espera resposta afirmativa, em português natural.
- source_word: אֵיד
  choice: desgraça
  rationale: Expressa infortúnio destrutivo ou ruína e mantém um registro poético claro.
- source_word: לְעַוָּל
  choice: para o injusto
  rationale: O substantivo designa quem se caracteriza pela injustiça ou perversidade; a forma singular é preservada.
- source_word: וְנֵכֶר
  choice: e a calamidade
  rationale: No paralelismo com אֵיד, indica um destino desastroso; evita o sentido menos provável de estranheza ou alienação sem eliminar essa dificuldade lexical da nota.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: para os que praticam o mal
  rationale: Reproduz de modo corrente a ideia participial de pessoas que fazem o mal, sem a rigidez de 'obreiros da iniquidade'.
theological_decisions:
- issue: Ordem moral na literatura sapiencial
  choice: Apresentar desgraça e calamidade como destinadas ao injusto e aos que praticam o mal, sem explicar o mecanismo.
  alternative: Tornar explícito que se trata de castigo direto de Deus ou apenas de consequências naturais.
  rationale: O hebraico afirma a relação entre o mal moral e a calamidade, mas neste versículo não especifica se ela ocorre por punição divina direta ou pela ordem moral mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. A pergunta retórica e a ambiguidade quanto ao mecanismo do juízo permanecem intactas.
