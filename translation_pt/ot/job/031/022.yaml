translation:
  language: pt
  text: Então, caia meu ombro de sua articulação[a], e meu braço se quebre junto ao osso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do ombro». O hebraico provavelmente retrata o ombro separando-se de seu lugar.
    reason: lexical_alternative
  - marker: b
    text: Ou «da articulação». O raro termo hebraico pode referir-se ao osso ou à estrutura articular do braço.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: meu ombro
  rationale: כָּתֵף designa normalmente o ombro ou a região lateral superior do corpo; «meu ombro» é natural e mantém o paralelismo com «meu braço».
- source_word: מִשִּׁכְמָה
  choice: de sua articulação
  rationale: O termo שִׁכְמָה aponta para a região do ombro/costas. No contexto desta maldição corporal, a expressão indica que o ombro se desprende do lugar em que se junta ao corpo; «articulação» comunica essa imagem sem transformar o verbo em «deslocar».
- source_word: תִפּוֹל
  choice: caia
  rationale: Preserva o sentido concreto e literal do verbo נפל, «cair», deixando que o complemento expresse a separação anatômica.
- source_word: וְאֶזְרֹעִי
  choice: e meu braço
  rationale: זְרוֹעַ significa normalmente «braço»; não há razão contextual para restringi-lo ao antebraço.
- source_word: מִקָּנָה
  choice: junto ao osso
  rationale: קָנֶה é raro neste uso anatômico e pode indicar a estrutura óssea ou articular do braço. «Junto ao osso» conserva a imagem corporal e evita afirmar com precisão indevida se a ruptura ocorre no osso ou na articulação.
- source_word: תִשָּׁבֵר
  choice: se quebre
  rationale: O nifal de שׁבר exprime aqui o sentido passivo «ser quebrado»; em português, «se quebre» formula naturalmente a imprecação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação de imprecação em paralelismo. A ordem «então caia... e... se quebre» preserva o caráter solene da aut maldição. As notas mantêm a incerteza anatômica dos dois termos hebraicos raros.
