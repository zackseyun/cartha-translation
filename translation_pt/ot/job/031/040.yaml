base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: pt
  text: 'Em vez de trigo, nasçam espinhos;

    e, em vez de cevada, erva fétida.[a]


    As palavras de Jó terminaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «erva nociva» ou «erva malcheirosa»; não se sabe ao certo qual planta o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: em vez de
  rationale: Neste contexto agrícola de imprecação, indica substituição, não posição física.
- source_word: חִטָּה
  choice: trigo
  rationale: É o equivalente corrente e preciso para o cereal mencionado.
- source_word: יֵצֵא
  choice: nasçam
  rationale: Aplicado à vegetação, descreve aquilo que brota ou nasce do solo; o subjuntivo preserva a força imprecatória.
- source_word: חוֹחַ
  choice: espinhos
  rationale: Representa de modo claro a vegetação espinhosa e nociva em contraste com o trigo.
- source_word: שְׂעֹרָה
  choice: cevada
  rationale: Equivalente português padrão para esse cereal.
- source_word: בָאְשָׁה
  choice: erva malcheirosa
  rationale: Preserva a provável associação do termo com mau cheiro e vegetação nociva, sem alegar uma identificação botânica exata.
- source_word: תַּמּוּ
  choice: Assim terminam
  rationale: Expressa com concisão a fórmula editorial de encerramento; 'assim' torna natural em português a transição para o colofão.
- source_word: דִּבְרֵי אִיּוֹב
  choice: as palavras de Jó
  rationale: Mantém a construção formal e não restringe o sentido a um tipo específico de discurso.
