  yaml_path: translation/ot/job/031/039.yaml
  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: pt
  text: se comi o que ela produziu sem pagamento, ou fiz seus donos perderem o ânimo[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “fiz a vida de seus donos expirar” ou “fiz seus donos ofegarem”. O verbo hebraico é raro, e a frase pode indicar opressão extrema ou causar a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: o que ela produziu
  rationale: Embora כֹּחַ signifique literalmente “força” ou “poder”, em referência à terra pode indicar sua capacidade produtiva, isto é, aquilo que ela produz. A expressão natural preserva o referente feminino da terra no contexto.
- source_word: אָכַלְתִּי
  choice: comi
  rationale: Tradução direta do verbo comum “comer”, aqui no sentido de consumir a produção da terra; o perfeito de primeira pessoa se encaixa na fórmula condicional de juramento iniciada por אִם.
- source_word: בְלִי כָסֶף
  choice: sem pagar
  rationale: כֶּסֶף significa literalmente “prata” e, por extensão, dinheiro ou pagamento. “Sem pagar” comunica com clareza a apropriação injusta em português corrente.
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: seus donos perderem a vida
  rationale: נֶפֶשׁ pode denotar vida, pessoa ou fôlego. A construção atribui o efeito aos donos da terra; “perderem a vida” preserva a leitura forte e concreta sem excluir, por nota, a possibilidade de aflição extrema.
- source_word: הִפָּחְתִּי
  choice: fiz ... perderem a vida
  rationale: O hifil raro de נפח pode sugerir fazer expirar, deixar sem fôlego ou fazer alguém ofegar. A tradução principal conserva a possível referência à morte, enquanto a nota registra a incerteza lexical.
