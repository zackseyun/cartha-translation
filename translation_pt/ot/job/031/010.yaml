base_translation:
  language: en
  yaml_path: translation/ot/job/031/010.yaml
  text: then let my wife grind for another man[a], and let other men kneel over her.
translation:
  language: pt
  text: então que minha mulher moa para outro homem, e que outros homens se ajoelhem sobre ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “e que outros homens se deitem com ela”. Neste contexto, “se ajoelhem sobre ela” provavelmente é um eufemismo sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: moa
  rationale: Preserva a imagem concreta de moer grãos, que neste contexto de maldição pode sugerir tanto trabalho servil quanto humilhação sexual, sem tornar explícito no texto principal o que o hebraico deixa figurado.
- source_word: לְאַחֵר
  choice: para outro homem
  rationale: אַחֵר significa “outro”; “homem” explicita de modo natural o referente masculino indicado pelo contexto.
- source_word: אִשְׁתִּי
  choice: minha mulher
  rationale: Em português corrente, “minha mulher” expressa naturalmente a relação conjugal indicada por אִשְׁתִּי e mantém a fluidez poética.
- source_word: וְעָלֶיהָ
  choice: sobre ela
  rationale: Mantém a imagem espacial direta da preposição עַל com o sufixo feminino.
- source_word: יִכְרְעוּן
  choice: se ajoelhem
  rationale: כרע significa normalmente “ajoelhar-se” ou “curvar-se”. Aqui provavelmente funciona como eufemismo sexual, mas a tradução principal conserva a imagem hebraica.
- source_word: אֲחֵרִין
  choice: outros homens
  rationale: O plural masculino substantivado refere-se, no contexto, a outros homens; a explicitação evita ambiguidade artificial em português.
theological_decisions:
- issue: Se o eufemismo sexual deve ser explicitado no texto principal
  choice: Conservar as imagens literais “moa” e “se ajoelhem sobre ela” no texto principal, registrando a provável conotação sexual em nota.
  alternative: “então que minha mulher moa para outro, e que outros homens se deitem com ela”
  rationale: O hebraico emprega verbos concretos que, pelo paralelismo e pelo contexto da maldição, provavelmente têm sentido sexual implícito, mas não usa uma expressão inequívoca para relações sexuais. Preservar a figura no texto e explicar a provável força eufemística na nota mantém a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe direta. “Minha mulher” tem boa legibilidade brasileira e comunica naturalmente o sentido conjugal; a formulação preserva o paralelismo e a dureza da maldição hebraica.
