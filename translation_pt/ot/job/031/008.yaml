  yaml_path: translation/ot/job/031/008.yaml
  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: pt
  text: então, que eu semeie, e outro coma; e que os meus descendentes sejam arrancados pela raiz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que aquilo que produzo seja arrancado pela raiz». O termo hebraico pode referir-se ao que brota, seja a descendência, seja a produção da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: que eu semeie
  rationale: O coortativo qal na primeira pessoa integra a automaldição de Jó; a construção com «que» preserva em português a força volitiva e imprecatória.
- source_word: וְאַחֵר יֹאכֵל
  choice: e outro coma
  rationale: Mantém o contraste conciso entre quem semeia e quem desfruta da colheita, preservando a imagem agrícola concreta do verbo אכל, «comer».
- source_word: וְצֶאֱצָאַי
  choice: os meus descendentes
  rationale: צֶאֱצָא pode designar aquilo que brota, incluindo descendência ou produção agrícola. «Descendentes» expressa naturalmente o provável sentido familiar sem eliminar a ressonância vegetal, esclarecida na nota.
- source_word: יְשֹׁרָשׁוּ
  choice: sejam arrancados pela raiz
  rationale: Expressa o sentido intensivo/causativo de שׁרשׁ e conserva de modo claro a metáfora da raiz aplicada aos descendentes.
