  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: pt
  text: Pois a calamidade vinda de Deus era um terror para mim[a], e eu não podia suportar a sua majestade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a calamidade de Deus era um terror para mim”. O hebraico traz mais formalmente “calamidade de Deus”, provavelmente no sentido de calamidade vinda dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa de sua exaltação, eu não podia resistir” ou, de modo mais literal, “por causa de sua exaltação, eu não podia”. O substantivo pode indicar exaltação ou majestade; o verbo expressa incapacidade, e seu objeto não é expresso formalmente no verso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da conduta descrita anteriormente por Jó; “pois” expressa com naturalidade essa função explicativa.
- source_word: פַחַד
  choice: motivo de pavor
  rationale: Preserva a força nominal e intensa de temor ou pavor, formando em português uma construção natural com “para mim”.
- source_word: אֵלַי
  choice: para mim
  rationale: A preposição com sufixo de primeira pessoa indica a relação pessoal de Jó com esse pavor.
- source_word: אֵיד
  choice: calamidade
  rationale: Designa desastre destrutivo ou ruína; “calamidade” é corrente e adequado ao contexto de juízo.
- source_word: אֵל
  choice: vinda de Deus
  rationale: 'Na construção אֵיד אֵל, o genitivo é provavelmente de origem: a calamidade procede de Deus. A nota preserva a alternativa formal “calamidade de Deus”.'
- source_word: וּמִשְּׂאֵתוֹ
  choice: e, diante de sua majestade
  rationale: שְׂאֵת pode expressar elevação, exaltação ou majestade. “Diante de” comunica de modo natural a incapacidade de Jó perante a grandeza exaltada de Deus, sem eliminar a nuance causal possível de מִן.
- source_word: לֹא אוּכָל
  choice: eu nada podia fazer
  rationale: יכל indica capacidade. Sem complemento explícito no hebraico, esta formulação preserva a abertura do sentido melhor que acrescentar apenas “suportar” ou um objeto definido.
theological_decisions:
- issue: Sentido de אֵל em contexto não onomástico
  choice: Deus
  alternative: o Poderoso; El
  rationale: O contexto fala do juízo e da majestade divina; “Deus” é claro e natural, sem acrescentar uma afirmação doutrinária.
- issue: Motivação de Jó
  choice: O pavor da calamidade divina e sua incapacidade perante a majestade de Deus o refreavam
  alternative: Jó temia somente a punição; Jó se referia apenas à exaltação abstrata de Deus
  rationale: A tradução conserva conjuntamente o temor do desastre e o reconhecimento da majestade divina, sem reduzir a tensão a mero interesse próprio ou a uma abstração teológica.
- issue: Objeto implícito de לֹא אוּכָל
  choice: Não explicitar se Jó não podia agir, resistir ou suportar
  alternative: eu não podia suportá-lo; eu não podia resistir a ele
  rationale: O hebraico declara literalmente incapacidade sem apresentar objeto expresso. “Eu nada podia fazer” mantém essa indeterminação, enquanto a nota registra leituras contextualmente possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Calamidade”, “pavor” e “majestade” preservam a solenidade poética sem arcaísmo. As notas mantêm as ambiguidades do genitivo אֵיד אֵל, da preposição em וּמִשְּׂאֵתוֹ e do complemento não expresso de לֹא אוּכָל.
