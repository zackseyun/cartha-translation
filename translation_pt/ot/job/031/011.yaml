  text: כִּי הוא זִמָּ֑ה ו/היא עָוֺ֥ן פְּלִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: pt
  text: Pois isso seria um ato vergonhoso, e seria uma iniquidade a ser julgada pelos juízes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma iniquidade punível pelos juízes».'
    reason: Alternativa lexical e sintática para פְּלִילִים, que pode salientar a punição judicial da ofensa.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a declaração anterior de Jó e mantém de modo natural o valor explicativo da conjunção.
- source_word: הוא
  choice: isso seria
  rationale: Retoma o ato mencionado no contexto. O condicional «seria» explicita em português a situação hipotética estabelecida nos versículos anteriores, sem alterar o sentido da oração nominal hebraica.
- source_word: זִמָּה
  choice: um ato vergonhoso
  rationale: Expressa um ato moralmente infame, sobretudo no âmbito sexual, em linguagem atual e digna. Evita tanto o termo mais estreito «lascívia» quanto uma formulação excessivamente técnica.
- source_word: וְהִיא
  choice: '[implícito na continuação: uma iniquidade]'
  rationale: O pronome feminino retoma זִמָּה. Em português, a coordenação sem repetir «seria» é mais natural e mantém a continuidade da predicação.
- source_word: עָוֺן
  choice: uma iniquidade
  rationale: Preserva o peso moral e a culpabilidade associados ao termo, em vez de reduzi-lo a um simples erro.
- source_word: פְּלִילִים
  choice: perante os juízes
  rationale: Conserva a referência judicial do plural hebraico e comunica que o ato pertence à esfera de julgamento. A leitura mais interpretativa, «punível pelos juízes», é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Pois» preserva a ligação argumentativa; «ato vergonhoso» comunica a forte censura moral sem arcaísmo; e a nota mantém a ambiguidade da expressão judicial hebraica.
