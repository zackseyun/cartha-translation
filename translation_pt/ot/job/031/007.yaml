lexical_decisions:
- source_word: תִּטֶּה
  choice: se desviou
  rationale: O verbo נטה expressa aqui o afastamento de um rumo correto. “Desviou” comunica com naturalidade essa ideia no contexto da declaração condicional de inocência.
- source_word: אַשֻּׁרִי
  choice: o meu passo
  rationale: O substantivo designa passo ou marcha. “O meu passo” preserva a imagem concreta do modo de viver.
- source_word: מִנִּי הַדָּרֶךְ
  choice: do caminho
  rationale: Mantém a metáfora hebraica do caminho como curso moral, sem explicitá-la de forma interpretativa.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: se o meu coração seguiu os meus olhos
  rationale: Reproduz a relação figurada entre visão e desejo interior. A repetição de “se” torna explícito em português o valor condicional que rege a sequência hebraica.
- source_word: לִבִּי
  choice: o meu coração
  rationale: “Coração” preserva a linguagem antropológica bíblica, que abrange desejo, vontade e pensamento.
- source_word: עֵינַי
  choice: os meus olhos
  rationale: A tradução literal conserva a imagem vívida daquilo que é visto conduzindo o desejo interior.
- source_word: וּבְכַפַּי דָּבַק
  choice: se apegou às minhas mãos
  rationale: דבק significa aderir ou apegar-se. A formulação mantém a figura de uma mancha vinculada às ações da pessoa; “mãos” é mais natural do que “palmas” neste contexto moral.
- source_word: מֻאוּם
  choice: alguma mancha
  rationale: O termo pode indicar mancha, defeito ou imperfeição. “Mancha” comunica adequadamente a ideia de mácula moral sem eliminar a imagem concreta.
theological_decisions:
- issue: Metáfora moral do caminho
  choice: Conservar “do caminho”.
  alternative: Explicitar como “da conduta correta” ou “do caminho certo”.
  rationale: A imagem concreta do caminho pertence à forma literária e teológica do texto; acrescentar “certo” ou substituir a metáfora por uma abstração resolveria algo que o hebraico deixa implícito.
- issue: Relação entre coração e olhos
  choice: Conservar literalmente “o meu coração seguiu os meus olhos”.
  alternative: Interpretar como “desejei aquilo que vi”.
  rationale: A formulação hebraica descreve, sem a explicar por completo, a dinâmica entre visão, desejo e vontade. Preservá-la evita reduzir a amplitude de “coração” ou especificar indevidamente o objeto visto.
- issue: Mácula nas mãos
  choice: Manter a imagem de uma mancha que se apega às mãos.
  alternative: Parafrasear como “cometi alguma injustiça”.
  rationale: As mãos podem representar os atos, mas o texto mantém uma metáfora concreta de contaminação ou culpa. A tradução não deve limitar a referência a uma forma específica de pecado.
