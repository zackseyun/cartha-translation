  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: pt
  text: Certamente eu o levaria sobre o ombro; eu o colocaria sobre mim como uma coroa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “coroas” (plural); o plural pode ter valor intensivo, daí “como uma coroa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Certamente
  rationale: No contexto do juramento de Jó, a expressão funciona como uma asseveração enfática, não como uma condição comum.
- source_word: עַל שִׁכְמִי
  choice: sobre o ombro
  rationale: Preserva de modo natural a expressão espacial e o singular hebraico, mantendo a imagem de exibição pública.
- source_word: אֶשָּׂאֶנּוּ
  choice: eu o levaria
  rationale: O verbo נשׂא indica aqui carregar ou levar; a formulação portuguesa é corrente e conserva a imagem concreta.
- source_word: אֶעֶנְדֶנּוּ
  choice: eu o prenderia em mim
  rationale: O verbo ענד pode indicar colocar ou prender um ornamento. A escolha preserva a ação física sem reduzir o sentido a mero enfeite.
- source_word: עֲטָרוֹת
  choice: como uma coroa
  rationale: Embora a forma hebraica seja plural, pode ter valor intensivo ou designar um adorno semelhante a uma coroa; o singular é mais natural no símile em português, e o plural é registrado em nota.
- source_word: לִי
  choice: em mim
  rationale: Com ענד, o pronome dativo indica que Jó prenderia o objeto à própria pessoa; a forma reflexiva explicita isso naturalmente em português.
