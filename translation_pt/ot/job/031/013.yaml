lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição na fórmula de juramento de inocência de Jó; a forma simples é natural e fiel.
- source_word: אֶמְאַס
  choice: rejeitei
  rationale: No contexto jurídico, מָאַס indica rejeitar, recusar ou desconsiderar uma reivindicação, não apenas sentir desprezo.
- source_word: מִשְׁפַּט
  choice: a causa
  rationale: מִשְׁפָּט pode designar justiça, direito ou causa judicial. Aqui, “causa” preserva de modo natural o sentido jurídico.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: do meu escravo ou da minha escrava
  rationale: Os termos indicam, respectivamente, uma pessoa escravizada do sexo masculino e uma do sexo feminino; a tradução torna explícito o status e mantém o contraste de gênero.
- source_word: בְּרִיבָם
  choice: quando apresentaram uma queixa
  rationale: רִיב pertence ao campo de disputa, contenda ou reclamação jurídica. A formulação verbal comunica com clareza que ambos podiam levantar uma causa.
- source_word: עִמָּדִי
  choice: contra mim
  rationale: Embora literalmente signifique “comigo”, no contexto de uma disputa expressa oposição ou demanda dirigida contra Jó.
