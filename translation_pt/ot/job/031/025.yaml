  text: se me alegrei porque minha riqueza era grande e porque minha mão havia adquirido muito—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz a condição na sequência do juramento de inocência de Jó.
- source_word: אֶשְׂמַח
  choice: me alegrei
  rationale: Expressa alegria ou satisfação; aqui, o possível deleite fundamentado na riqueza.
- source_word: כִּי
  choice: porque
  rationale: Tem sentido causal nas duas orações, indicando o motivo da alegria.
- source_word: רַב חֵילִי
  choice: minha riqueza era grande
  rationale: חַיִל designa aqui bens ou riqueza, e רַב indica sua grande quantidade.
- source_word: כַבִּיר מָצְאָה יָדִי
  choice: minha mão havia adquirido muito
  rationale: A expressão literalmente diz que a mão de Jó 'encontrou muito'; em contexto, é uma imagem do que ele obteve por sua própria ação ou capacidade. A formulação preserva a imagem da mão sem soar artificial em português.
theological_decisions:
- issue: Se o texto condena a riqueza em si ou a alegria fundamentada na abundância obtida pela própria capacidade
  choice: Jó nega ter-se alegrado por sua grande riqueza e pelo muito que sua própria mão adquiriu.
  alternative: Formular o verso de modo a sugerir que a simples posse de riqueza é a questão moral.
  rationale: As orações causais concentram a atenção no deleite motivado pela riqueza e na consciência da própria capacidade de adquiri-la, não na mera posse de bens.
translation_notes:
  register: Português moderno, digno e de leitura natural. A construção mantém o paralelismo hebraico e a imagem de agência pessoal contida em 'minha mão'.
