reference: Job 31:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם אֶ֭שְׂמַח בְּ/פִ֣יד מְשַׂנְאִ֑/י וְ֝/הִתְעֹרַ֗רְתִּי כִּֽי מְצָ֥א/וֹ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: pt
  text: Se me alegrei com a ruína[a] daquele que me odeia[b] e exultei[c] quando o mal o encontrou[d] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calamidade” ou “desastre”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “daquele que me odeia”; tradicionalmente, “do meu inimigo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “me regozijei”, com a possível nuance de satisfação indevida diante do mal sofrido por outra pessoa.
    reason: lexical_alternative
  - marker: d
    text: Ou “quando o dano o atingiu” ou “quando a desgraça lhe sobreveio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição na declaração de inocência de Jó; em português, “se” expressa naturalmente a estrutura do juramento.
- source_word: אֶשְׂמַח
  choice: me alegrei
  rationale: Traduz o sentido de alegrar-se e, no contexto retrospectivo da declaração, o pretérito mantém o peso moral da afirmação.
- source_word: בְּפִיד
  choice: com a ruína
  rationale: פִיד pode indicar ruína, calamidade ou desastre. “Ruína” é conciso e conserva a ideia de queda destrutiva.
- source_word: מְשַׂנְאִי
  choice: daquele que me odeia
  rationale: Preserva o valor verbal do particípio, em vez de o reduzir ao substantivo interpretativo “meu inimigo”.
- source_word: וְהִתְעֹרַרְתִּי
  choice: e exultei
  rationale: No paralelismo, a forma indica comoção ou entusiasmo diante da desgraça alheia. “Exultei” comunica alegria intensa sem impor no texto principal a nuance mais específica de regozijo malicioso.
- source_word: כִּי
  choice: quando
  rationale: Introduz aqui a circunstância temporal em que ocorreria a exultação; “quando” é natural e adequado ao contexto.
- source_word: מְצָאוֹ
  choice: o encontrou
  rationale: Mantém a imagem hebraica de o mal “encontrar” alguém, compreensível em português, embora “atingiu” também seja possível.
- source_word: רָע
  choice: o mal
  rationale: Neste contexto, רָע designa adversidade, dano ou desgraça, não necessariamente maldade moral. “O mal” preserva a amplitude e a concisão do hebraico.
theological_decisions:
- issue: A atitude de Jó diante da ruína de quem o odeia
  choice: Expressar a negação de alegria e exultação diante da ruína alheia sem intensificar o verbo principal para “regozijei-me maliciosamente”.
  alternative: “Se me alegrei com a calamidade do meu inimigo e me regozijei quando a desgraça o atingiu”.
  rationale: O contexto ético implica prazer indevido na desgraça de um adversário, mas o hebraico permite conservar essa implicação sem tornar explícita, no texto principal, uma motivação maliciosa mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e o travessão final, pois a oração condicional continua nos versículos seguintes. Todos os marcadores remetem diretamente às expressões pertinentes.
