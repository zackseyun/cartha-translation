  text: Does he not see my ways and count all my steps?[a]
translation:
  language: pt
  text: Acaso ele não vê os meus caminhos nem conta todos os meus passos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso ele não observa a minha conduta nem conta todos os meus passos?”'
