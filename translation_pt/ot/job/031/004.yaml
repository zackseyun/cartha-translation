lexical_decisions:
- source_word: הֲלֹא
  choice: Será que ... não
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; esta construção é natural no português moderno e conserva a forma interrogativa.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente tem alguma ênfase, mas o simples “ele” a transmite adequadamente no contexto sem intensificação excessiva.
- source_word: יִרְאֶה
  choice: vê
  rationale: Preserva o sentido comum de ראה e a imagem concreta do olhar divino, sem transformá-la em formulação doutrinária abstrata.
- source_word: דְרָכָי
  choice: os meus caminhos
  rationale: Mantém o plural e a metáfora hebraica, que pode abranger tanto o percurso quanto a maneira de viver.
- source_word: וְכָל
  choice: e ... todos
  rationale: Conserva a ligação cumulativa entre as duas orações e a totalidade expressa por כָּל.
- source_word: צְעָדַי
  choice: os meus passos
  rationale: É uma expressão natural em português e preserva a imagem dos movimentos ou atos individuais de Jó.
- source_word: יִסְפּוֹר
  choice: conta
  rationale: Reproduz diretamente o sentido de ספר e mantém a imagem concreta de enumerar cada passo.
theological_decisions:
- issue: Conhecimento divino expresso por verbos antropomórficos
  choice: Manter a pergunta retórica segundo a qual Deus vê os caminhos de Jó e conta todos os seus passos.
  alternative: Ele não observa a minha conduta e leva em conta todas as minhas ações?
  rationale: O hebraico apresenta as imagens concretas de ver e contar. A tradução conserva sua força teológica sem introduzir uma paráfrase abstrata sobre a onisciência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o paralelismo, a metáfora de “caminhos” e “passos” e o caráter retórico da pergunta.
