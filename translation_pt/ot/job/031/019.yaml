lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz a prótase do juramento de inocência de Jó e preserva a estrutura condicional do contexto.
- source_word: אֶרְאֶה
  choice: vi
  rationale: O imperfeito qal de primeira pessoa, neste exame retrospectivo, é expresso naturalmente em português pelo pretérito perfeito.
- source_word: אֹבֵד
  choice: alguém perecendo
  rationale: O particípio indica uma pessoa em processo de perecer ou arruinar-se; a formulação mantém o caráter contínuo e o referente indefinido.
- source_word: מִבְּלִי לְבוּשׁ
  choice: por falta de roupa
  rationale: Expressa privação e admite matiz causal; esta formulação é clara e natural em português.
- source_word: וְאֵין
  choice: ou ... sem
  rationale: Embora וְ seja formalmente conjuntivo, no paralelismo da condição coordenada o português emprega naturalmente «ou»; «sem» traduz de modo fluente a negação existencial.
- source_word: כְּסוּת
  choice: agasalho
  rationale: Designa aquilo que cobre, inclusive uma peça de vestir. «Agasalho» preserva alguma distinção em relação a «roupa» e comunica a falta de proteção corporal.
- source_word: לָאֶבְיוֹן
  choice: o necessitado
  rationale: אֶבְיוֹן indica quem sofre carência material; «necessitado» é corrente, digno e não restringe indevidamente o grau de pobreza.
