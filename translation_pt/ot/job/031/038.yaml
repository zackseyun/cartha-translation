lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz a condição na fórmula de juramento de inocência de Jó.
- source_word: עָלַי
  choice: contra mim
  rationale: 'Com o verbo זעק, a preposição tem aqui sentido adversativo: a terra personificada testemunharia contra Jó.'
- source_word: אַדְמָתִי
  choice: a minha terra
  rationale: Designa o terreno cultivável pertencente a Jó; “terra” é natural e mantém o contexto agrícola.
- source_word: תִזְעָק
  choice: clamar
  rationale: Expressa um grito forte de aflição ou acusação e preserva a personificação da terra.
- source_word: וְיַחַד
  choice: juntos
  rationale: Indica ação conjunta ou simultânea; em português, colocado depois do verbo, produz uma sequência natural.
- source_word: תְּלָמֶיהָ
  choice: os seus sulcos
  rationale: תלם é o sulco aberto pelo arado; “sulcos” conserva com precisão a imagem agrícola.
- source_word: יִבְכָּיוּן
  choice: chorarem
  rationale: O verbo בכה significa chorar ou lamentar; “chorarem” mantém a personificação poética e evita repetir “clamar”.
