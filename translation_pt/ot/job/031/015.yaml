  text: הֲֽ֝/לֹא בַ֭/בֶּטֶן עֹשֵׂ֣/נִי עָשָׂ֑/הוּ וַ֝/יְכֻנֶ֗/נּוּ בָּ/רֶ֥חֶם אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: pt
  text: Não foi aquele que me fez no ventre que também o fez? E não foi um só que nos formou no útero?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E não nos formou ele em um mesmo ventre?» O hebraico é compacto e pode indicar tanto um só Criador quanto, de modo poético, um ventre comum, enfatizando a mesma origem humana, não necessariamente a mesma mãe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não foi... que...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; essa construção é natural em português e preserva sua força.
- source_word: בַבֶּטֶן
  choice: no ventre
  rationale: No contexto, designa o ventre materno como lugar da formação pré-natal.
- source_word: עֹשֵׂנִי
  choice: aquele que me fez
  rationale: O particípio com sufixo funciona substantivamente e mantém tanto a ação verbal quanto o caráter pessoal da expressão.
- source_word: עָשָׂהוּ
  choice: também o fez
  rationale: O pronome singular remete ao servo do contexto anterior; «também» explicita em português o paralelismo comparativo já presente na pergunta hebraica.
- source_word: וַיְכֻנֶנּוּ
  choice: nos formou
  rationale: A forma verbal comunica a ideia de moldar ou formar, e o sufixo é mais naturalmente entendido como primeira pessoa do plural neste contexto.
- source_word: בָרֶחֶם
  choice: no útero
  rationale: רֶחֶם denota especificamente o útero; a escolha também evita repetir «ventre» sem necessidade.
- source_word: אֶחָד
  choice: um só
  rationale: A sintaxe hebraica permite tomar אֶחָד como sujeito, «um só», isto é, o mesmo Criador; essa leitura produz português claro sem transformar a frase numa afirmação de que ambos tiveram a mesma mãe.
theological_decisions:
- issue: Referente do pronome singular em עָשָׂהוּ
  choice: O pronome «o» remete ao servo mencionado no contexto imediato.
  alternative: Entender a afirmação de modo geral, como referente a qualquer outro ser humano.
  rationale: Jó 31:13-14 trata dos servos de Jó. O singular é preservado, enquanto a implicação mais ampla de humanidade comum permanece sem ser inserida na tradução.
- issue: Análise de אֶחָד em relação a בָרֶחֶם
  choice: '«Um só» é entendido como sujeito: o mesmo Criador formou ambos no útero.'
  alternative: Ler a expressão como «em um mesmo ventre» ou, mais literalmente, «em um ventre».
  rationale: O hebraico é compacto e admite mais de uma análise. A leitura adotada evita sugerir que Jó e seu servo nasceram da mesma mãe e preserva a afirmação de uma origem comum na ação criadora de Deus; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A alternância entre «ventre» e «útero» reproduz os dois substantivos hebraicos e evita repetição pesada. A pergunta retórica e a ambiguidade da última oração são preservadas, esta última por meio de nota.
