  text: אִם אֶרְאֶ֣ה א֖וֹר כִּ֣י יָהֵ֑ל וְ֝/יָרֵ֗חַ יָקָ֥ר הֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/026.yaml
  text: if I looked at the light when it shone[a], or at the moon moving in splendor[b],
translation:
  language: pt
  text: se olhei para a luz quando brilhava[a], ou para a lua avançando em esplendor[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o sol», pois aqui «a luz» provavelmente se refere ao sol, em paralelo com «a lua».
    reason: lexical_alternative
  - marker: b
    text: Ou «a lua caminhando em brilho / esplendor».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz uma condição na declaração solene de inocência de Jó; «se» é o equivalente natural em português.
- source_word: אֶרְאֶה
  choice: contemplei
  rationale: O imperfeito qal de ראה assume aqui valor passado no contexto das ações hipotéticas que Jó nega. «Contemplei» expressa um olhar atento e potencialmente admirativo, sem tornar explícita a adoração mencionada nos versículos seguintes.
- source_word: אוֹר
  choice: a luz
  rationale: Preserva o sentido lexical literal. No paralelismo com a lua, provavelmente se refere ao sol, mas o hebraico não o nomeia explicitamente.
- source_word: כִּי
  choice: quando
  rationale: Introduz a circunstância em que a luz era contemplada e produz uma construção natural em português.
- source_word: יָהֵל
  choice: brilhava
  rationale: Transmite de modo conciso e idiomático a emissão de luz indicada pelo verbo.
- source_word: וְיָרֵחַ
  choice: ou a lua
  rationale: A conjunção liga o segundo objeto celeste à condição e tem valor disjuntivo natural nesta série. A regência de «contemplei» aplica-se também a «a lua».
- source_word: יָקָר
  choice: em esplendor
  rationale: Neste contexto, o termo descreve a luminosidade majestosa da lua; a locução mantém sua força adverbial.
- source_word: הֹלֵךְ
  choice: avançando
  rationale: O particípio de הלך descreve o curso contínuo da lua pelo céu. «Avançando» conserva tanto a imagem de movimento quanto o aspecto progressivo.
theological_decisions:
- issue: Possível contexto de culto aos astros
  choice: Manter no texto principal as imagens celestes literais, sem explicitar a adoração.
  alternative: Traduzir אוֹר por «sol» para tornar mais evidente o contexto de repúdio à idolatria astral.
  rationale: Os versículos 27–28 esclarecem a possível atração cultual pelos corpos celestes, mas o versículo 26 menciona literalmente «luz» e «lua». A tradução preserva essa formulação e permite que o contexto revele a implicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Contemplei» corresponde ao olhar atento sugerido pelo contexto, enquanto «avançando em esplendor» preserva a imagem poética do percurso lunar. A vírgula final mantém a continuidade sintática da declaração nos versículos seguintes.
