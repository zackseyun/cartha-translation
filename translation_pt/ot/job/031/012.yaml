source:
  edition: WLC
  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: pt
  text: Pois ela é um fogo que consome até a destruição[a] e arrancaria pela raiz toda a minha produção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até Abadom”. O hebraico אֲבַדּוֹן pode significar “destruição” ou, em alguns contextos, designar o domínio ou a personificação da destruição.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando a força causal no contexto do juramento de Jó.
- source_word: אֵשׁ הִיא
  choice: ela é um fogo
  rationale: Mantém a metáfora predicativa e retoma naturalmente, em português, a conduta mencionada no contexto anterior.
- source_word: עַד אֲבַדּוֹן
  choice: até a destruição
  rationale: Expressa a extensão extrema do consumo; אֲבַדּוֹן tem aqui, mais naturalmente, o sentido comum de destruição, sem eliminar a possibilidade de Abadom.
- source_word: תֹּאכֵל
  choice: consome
  rationale: É uma formulação idiomática para a ação do fogo e conserva o sentido do verbo hebraico 'comer, devorar, consumir'.
- source_word: וּבְכָל תְּבוּאָתִי
  choice: e toda a minha produção
  rationale: Representa o alcance total da ruína sobre o rendimento ou produto de Jó; 'produção' é amplo e compatível com a imagem agrícola.
- source_word: תְשָׁרֵשׁ
  choice: arrancaria pela raiz
  rationale: Reproduz vividamente o sentido intensivo de remover pelas raízes; o condicional decorre do contexto de juramento dos versículos anteriores.
theological_decisions:
- issue: Sentido de אֲבַדּוֹן
  choice: 'substantivo comum: “destruição”'
  alternative: 'nome próprio ou designação do domínio da destruição: “Abadom”'
  rationale: Neste contexto sapiencial, o termo descreve mais naturalmente o alcance da ruína provocada pelo pecado; a nota preserva a ambiguidade lexical legítima.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora do fogo e a imagem agrícola das raízes foram preservadas; evitou-se interpretar além do que o hebraico exige.
