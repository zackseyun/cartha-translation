base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: pt
  text: Quem dera eu tivesse alguém que me ouvisse! Aqui está a minha assinatura[a]; que o Todo-Poderoso me responda, e que o meu acusador escreva a acusação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha marca” ou “o meu sinal”. O hebraico provavelmente se refere à marca com que Jó autenticava sua declaração.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “e um documento que o homem da minha contenda escreveu”. No contexto, Jó deseja receber por escrito a acusação da parte contrária.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: Quem dera eu tivesse
  rationale: A expressão idiomática hebraica manifesta um desejo intenso, não uma pergunta literal. “Quem dera” é uma formulação optativa natural e digna em português.
- source_word: שֹׁמֵעַ לִי
  choice: alguém que me ouvisse
  rationale: O particípio com לִי indica alguém disposto a ouvir Jó e sua causa; o subjuntivo se harmoniza com o desejo expresso por “quem dera”.
- source_word: הֶן
  choice: Aqui está
  rationale: A partícula chama a atenção para aquilo que Jó apresenta como sua autenticação; “Aqui está” comunica isso de modo atual e direto.
- source_word: תָּוִי
  choice: a minha assinatura
  rationale: תָּו designa uma marca ou sinal, aqui provavelmente a marca de autenticação aposta por Jó à sua declaração. “Assinatura” explicita sua função forense, enquanto a alternativa mais literal é mantida em nota.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: É a tradução portuguesa consagrada do título divino שַׁדַּי e preserva sua força sem acrescentar uma interpretação doutrinária específica.
- source_word: יַעֲנֵנִי
  choice: me responda
  rationale: No contexto judicial, o verbo pede que Deus responda à defesa ou ao desafio de Jó.
- source_word: וְסֵפֶר ... כָּתַב
  choice: e que ... escreva a acusação
  rationale: סֵפֶר é um documento escrito, e כָּתַב, embora formalmente perfeito, pode ser entendido no encadeamento optativo como um desejo. “Escreva a acusação” expressa a função jurídica do documento sem se prender ao suporte físico.
- source_word: אִישׁ רִיבִי
  choice: o meu acusador
  rationale: Literalmente, “o homem da minha contenda”; no cenário forense, identifica a parte que apresenta a causa ou acusação contra Jó.
theological_decisions:
- issue: Imagens forenses no apelo de Jó
  choice: 'Empregar linguagem jurídica clara: “assinatura”, “acusador” e “acusação”'
  alternative: Traduzir mais literalmente por “minha marca”, “o homem da minha contenda” e “um documento”
  rationale: O contexto apresenta Jó como quem autentica sua defesa e desafia a parte contrária a formular por escrito sua causa. A linguagem jurídica torna essa função clara sem resolver a tensão sobre quem é o acusador nem acrescentar conteúdo doutrinário.
- issue: Identidade do acusador
  choice: Manter “meu acusador” sem identificá-lo explicitamente com Deus ou com outra personagem
  alternative: Explicitar Deus como a parte que acusa Jó
  rationale: O hebraico nomeia apenas “o homem da minha contenda”. Preservar a referência aberta evita solucionar uma ambiguidade genuína do discurso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Quem dera” conserva o tom elevado sem arcaísmo excessivo; os artigos possessivos soam naturais no registro formal. A pontuação mantém em sequência o apelo para que Deus responda e para que a acusação seja apresentada por escrito.
