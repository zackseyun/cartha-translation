base_translation:
  language: en
  yaml_path: translation/ot/job/031/020.yaml
  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: pt
  text: se os lombos dele não me abençoaram[a], e se ele não se aqueceu com a lã das minhas ovelhas[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os lombos dele”, uma expressão corporal que se refere à pessoa necessitada, vestida e aquecida.'
    reason: lexical_alternative
  - marker: b
    text: Ou “com o velo das minhas ovelhas”. O substantivo hebraico pode designar o velo ou a lã tosquiada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: se ... não
  rationale: Mantém a forma condicional da fórmula de juramento de Jó, cujo desfecho imprecatório fica implícito no contexto.
- source_word: בֵרֲכוּנִי
  choice: não me abençoou
  rationale: Preserva o sentido usual de ברך no piel e a personificação corporal do hebraico, sem reduzir a expressão a simples agradecimento.
- source_word: חֲלָצָיו
  choice: a cintura dele
  rationale: חלץ designa a região dos lombos ou da cintura; em português corrente, “a cintura dele” conserva a imagem corporal e funciona metonimicamente para o corpo vestido e aquecido.
- source_word: וּמִגֵּז
  choice: com a lã
  rationale: גֵּז pode indicar o velo ou a lã tosquiada. A preposição é entendida instrumentalmente; “com a lã” é natural e claro em português.
- source_word: כְּבָשַׂי
  choice: das minhas ovelhas
  rationale: No contexto de obtenção de lã, “ovelhas” é mais natural do que “cordeiros” para o plural possessivo.
- source_word: יִתְחַמָּם
  choice: se ele não se aqueceu
  rationale: O hitpael expressa ficar ou manter-se aquecido. O pronome explicita em português a pessoa necessitada representada corporalmente na oração anterior.
