    issue: A alternativa da nota, «minha mão lançou um beijo», é incompleta em português.
    rationale: A expressão mais normal é «lançou um beijo» com sujeito pessoal, ou «mandou um beijo com a mão». Convém também conservar a relação com o gesto mão-boca indicada pelo texto hebraico.
