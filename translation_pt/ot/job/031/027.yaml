  source_fidelity: 'A primeira oração transmite bem וַיִּפְתְּ בַּסֵּתֶר לִבִּי: «meu coração foi seduzido em segredo» preserva tanto a atração interior quanto o caráter oculto. Na segunda, porém, «minha mão beijou minha boca» reproduz a construção hebraica de modo excessivamente literal e, em português, sugere impropriamente que a mão é o agente que beija a boca. A formulação revista conserva o gesto mão-boca e o verbo beijar, expressando-o de modo idiomático.'
  naturalness: «Meu coração foi seduzido em segredo» é natural e tem registro adequado. «Levei a mão à boca para beijá-la» é uma maneira clara e corrente de representar o gesto implícito; o pronome retoma «mão».
