  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: pt
  text: e meu coração foi seduzido em segredo[a], e levei a mão à boca para beijá-la—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático no contexto: “e mandei um beijo com a mão” — provavelmente um gesto de homenagem associado ao culto dos astros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: foi seduzido
  rationale: O verbo פתה, aqui com sentido passivo ou intransitivo, descreve o coração sendo atraído ou levado interiormente. “Foi seduzido” preserva a força da atração ilícita sem explicitar além do texto o culto aos astros.
- source_word: בַּסֵּתֶר
  choice: em segredo
  rationale: סתר denota ocultamento ou segredo. A locução “em segredo” é natural em português e mantém o caráter interior e encoberto da ação.
- source_word: לִבִּי
  choice: meu coração
  rationale: לֵב designa aqui o íntimo da pessoa, incluindo vontade e afetos; “meu coração” conserva a imagem hebraica de modo claro.
- source_word: וַתִּשַּׁק
  choice: beijou
  rationale: נשק significa ordinariamente “beijar”. A tradução mantém a ação concreta no texto principal, deixando para a nota a provável função ritual do gesto.
- source_word: יָדִי
  choice: minha mão
  rationale: Tradução direta de יָדִי; a mão participa do gesto de homenagem ou veneração.
- source_word: לְפִי
  choice: minha boca
  rationale: Literalmente, “à minha boca”. Depois de “beijou”, “minha boca” soa natural em português, enquanto a nota esclarece a provável expressão gestual completa.
theological_decisions:
- issue: Possível referência a um gesto de culto idólatra aos astros
  choice: Manter no texto principal a ação corporal concreta, sem acrescentar explicitamente que se trata de adoração.
  alternative: 'e minha mão lançou um beijo; ou: e beijei a mão em sinal de homenagem'
  rationale: O contexto dos versículos 26–28 aponta para veneração do sol ou da lua, mas este versículo descreve o gesto sem nomeá-lo diretamente como culto. A tradução preserva essa contenção e põe a interpretação cultural na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a sequência e as imagens concretas do hebraico; o travessão mantém a continuação sintática para o versículo seguinte.
