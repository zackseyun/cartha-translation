  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: pt
  text: Em tudo isso, Jó não pecou nem atribuiu qualquer impropriedade a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem acusou Deus de agir mal”; ou: “nem atribuiu insensatez a Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Em tudo isso
  rationale: Expressa naturalmente a totalidade das circunstâncias anteriores e preserva o valor abrangente da construção hebraica.
- source_word: לֹא חָטָא
  choice: não pecou
  rationale: Mantém o sentido religioso e moral direto do verbo חטא, sem o enfraquecer para uma ideia genérica de erro.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְלֹא נָתַן
  choice: nem atribuiu
  rationale: Embora נתן signifique literalmente “dar”, nesta construção indica imputar ou atribuir algo a Deus.
- source_word: תִּפְלָה
  choice: coisa alguma imprópria
  rationale: Comunica a ideia de impropriedade moral ou religiosa sem reduzir o termo a mera falta de inteligência; a formulação também preserva certa amplitude lexical.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A preposição ל marca aquele a quem a impropriedade seria atribuída; “Deus” é a tradução direta de אֱלֹהִים no contexto.
theological_decisions:
- issue: Sentido de תִּפְלָה quando atribuída a Deus
  choice: Jó não atribuiu a Deus coisa alguma imprópria
  alternative: Jó não acusou Deus de agir mal; Jó não atribuiu insensatez a Deus
  rationale: A tradução principal evita sugerir mera deficiência intelectual e conserva a ideia mais ampla de algo indevido, censurável ou impróprio. A nota registra alternativas legítimas sem resolver além do que permite o hebraico.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. “Em tudo isso” retoma os acontecimentos anteriores; “atribuiu” reproduz o valor idiomático da construção hebraica.
