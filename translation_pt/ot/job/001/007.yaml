  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: pt
  text: 'Então Yahweh disse ao Adversário[a]: “De onde você vem?” O Adversário respondeu a Yahweh e disse: “De percorrer a terra e andar por ela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Satã”. Aqui, o termo vem com o artigo definido e funciona como título: “o Adversário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַשָּׂטָן
  choice: o Adversário
  rationale: O artigo definido hebraico indica aqui um título ou função, não necessariamente um nome próprio. “Adversário” comunica naturalmente o sentido amplo do termo.
- source_word: מֵאַיִן תָּבֹא
  choice: De onde você vem?
  rationale: Expressa em português atual e natural a pergunta hebraica sobre procedência, sem alterar seu sentido.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: A fórmula hebraica literalmente redundante pode ser expressa com naturalidade por um único verbo de fala em português.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: de percorrer a terra
  rationale: “Percorrer” transmite o movimento de um lado para outro expresso pelo infinitivo hebraico; “a terra” convém ao cenário cósmico de Jó.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: e andar por ela
  rationale: Reproduz o movimento repetido sugerido pela forma verbal e mantém a referência pronominal à terra em português idiomático.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser entendido como nome próprio ou como título/função
  choice: 'título/função: “o Adversário”'
  alternative: 'nome próprio: “Satanás”; transliteração mais formal: “o Satã”'
  rationale: A presença do artigo definido no hebraico favorece fortemente uma designação funcional neste contexto. A tradução evita impor ao texto o uso posterior do termo como nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo usa “você”, forma natural no português brasileiro contemporâneo, sem perder a solenidade narrativa.
