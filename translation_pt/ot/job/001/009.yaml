id: JOB.1.9
reference: Job 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: pt
  text: 'Então o Acusador[a] respondeu a Yahweh: “Será que Jó teme a Deus por nada?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o satan” ou “o adversário”. O termo aparece com artigo definido e funciona aqui como título; por isso, “o Acusador”.'
    reason: alternative_reading
  - marker: b
    text: Ou “sem motivo” ou “sem receber nada em troca”. A expressão questiona se o temor de Deus demonstrado por Jó é desinteressado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Na fórmula narrativa de diálogo, ענה significa normalmente “responder”; a escolha preserva a estrutura da conversa em português natural.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: O artigo definido indica aqui um título ou função. “O Acusador” comunica o papel judicial e opositor sem tratar necessariamente o termo como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמַר
  choice: introdução dos dois-pontos
  rationale: O hebraico diz literalmente “e disse”; após “respondeu”, os dois-pontos introduzem a fala de modo natural e evitam redundância pouco idiomática em português sem perder conteúdo.
- source_word: הֲחִנָּם
  choice: por nada
  rationale: Preserva a pergunta sobre uma devoção sem benefício ou recompensa, mantendo também a possível nuance de “sem motivo”.
- source_word: יָרֵא
  choice: teme
  rationale: Mantém a força lexical de ירא e a expressão bíblica comum para o temor reverente diante de Deus, sem reduzi-la interpretativamente a “reverencia”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente direto e apropriado no contexto, em que o termo se refere ao Deus a quem Jó teme.
theological_decisions:
- issue: Sentido de הַשָּׂטָן com artigo definido
  choice: o Acusador
  alternative: o adversário; o Satanás; Satanás
  rationale: A forma com artigo funciona como designação de papel nesta cena. A tradução evita impor ao texto, como certeza, a identificação posterior do termo como nome próprio.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o nome divino; “Yahweh” preserva esse nome em transliteração, em vez de substituí-lo por um título.
- issue: Natureza do temor de Jó em הֲחִנָּם
  choice: por nada
  alternative: sem motivo; sem receber nada em troca; gratuitamente
  rationale: 'A formulação conserva a tensão da acusação: pode questionar tanto a ausência de benefício quanto a ausência de motivo, sem decidir de forma indevida entre essas nuances.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Respondeu a Yahweh:” reproduz de modo idiomático a fórmula hebraica “respondeu... e disse”. A pergunta mantém a concisão e a ambiguidade do original.
