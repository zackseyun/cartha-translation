  text: And seven sons and three daughters were born to him.
translation:
  language: pt
  text: E nasceram-lhe sete filhos e três filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: nasceram
  rationale: O nifal de ילד expressa o nascimento em construção passiva/resultativa. Em português, “nasceram-lhe” comunica isso de modo natural e fiel, sem a conotação mais forte de agência paterna que “foram gerados” poderia sugerir.
- source_word: לוֹ
  choice: -lhe
  rationale: A preposição ל com sufixo pronominal marca aqui a relação parental na fórmula de nascimento. O pronome dativo em “nasceram-lhe” preserva de modo conciso o sentido de “nasceram a ele”.
- source_word: שִׁבְעָה
  choice: sete
  rationale: Numeral cardinal que quantifica os filhos.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo designa especificamente descendentes do sexo masculino; “filhos” preserva essa informação e contrasta adequadamente com “filhas”.
- source_word: וְשָׁלֹשׁ
  choice: e três
  rationale: Conjunção coordenativa seguida do numeral cardinal que introduz o segundo grupo.
- source_word: בָּנוֹת
  choice: filhas
  rationale: O substantivo designa especificamente descendentes do sexo feminino; “filhas” é o equivalente natural e preciso em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e conciso. A colocação enclítica em “nasceram-lhe” conserva a fórmula relacional do hebraico e é amplamente compreensível, embora ligeiramente mais literária do que “ele teve”.
