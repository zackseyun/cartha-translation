base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: pt
  text: Seus filhos costumavam realizar um banquete, cada um em sua própria casa, no seu dia[a], e mandavam chamar suas três irmãs para comer e beber com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “no seu aniversário”. O hebraico diz literalmente “no seu dia”, expressão que pode indicar tanto o dia que cabia a cada filho quanto seu aniversário.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: costumavam
  rationale: No contexto de Jó 1:4–5, a forma verbal descreve uma prática habitual no passado; a locução portuguesa comunica claramente a repetição.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O substantivo é masculino plural e se refere especificamente aos filhos homens, em contraste com as irmãs mencionadas depois.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: realizar um banquete
  rationale: Expressa de modo natural o idioma hebraico, literalmente 'fazer um banquete', preservando seu caráter festivo.
- source_word: בֵּית אִישׁ
  choice: cada um em sua própria casa
  rationale: 'Reproduz o sentido distributivo: cada filho promovia o banquete em sua respectiva casa.'
- source_word: יוֹמוֹ
  choice: no seu dia
  rationale: Mantém a formulação deliberadamente não específica do hebraico, sem decidir entre o dia correspondente a cada filho e seu aniversário.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: mandavam então convidar
  rationale: A expressão portuguesa comunica tanto o envio de uma mensagem quanto o convite, além de manter o aspecto habitual do contexto.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: suas três irmãs
  rationale: Tradução direta da expressão definida pelo numeral e pela relação de posse.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: para comer e beber
  rationale: Preserva naturalmente o par de infinitivos que descreve a participação no banquete.
- source_word: עִמָּהֶם
  choice: com eles
  rationale: Indica a participação conjunta das irmãs com os irmãos.
theological_decisions:
- issue: Sentido de יוֹמוֹ ('seu dia')
  choice: Preservar no texto a expressão ambígua 'no seu dia'.
  alternative: Traduzir explicitamente como 'no dia que lhe cabia' ou 'no seu aniversário'.
  rationale: O hebraico não especifica se se trata do turno de cada filho no ciclo de banquetes ou de seu aniversário; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperfeito expressa o costume reiterado, e a nota preserva a ambiguidade lexical do original.
