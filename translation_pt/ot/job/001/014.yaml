  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: pt
  text: 'E um mensageiro veio até Jó e disse: “Os bois estavam arando, e as jumentas pastavam ao lado deles,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: E um mensageiro
  rationale: מַלְאָךְ pode designar um mensageiro humano ou um anjo; neste contexto, trata-se de alguém que vem relatar uma calamidade. A conjunção וּ é preservada como “E”.
- source_word: בָּא אֶל אִיּוֹב
  choice: veio até Jó
  rationale: בוא indica a chegada, e אֶל marca o movimento em direção a Jó. “Veio até Jó” é claro e natural em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: A forma narrativa faz a ação avançar; o sujeito permanece claro sem a necessidade de explicitar “ele”.
- source_word: הַבָּקָר
  choice: Os bois
  rationale: Embora בָּקָר possa designar gado bovino em geral, o contexto de arar favorece “bois”, animais empregados nesse trabalho.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: estavam arando
  rationale: A construção descreve uma ação em andamento no passado; “estavam arando” reproduz naturalmente esse aspecto.
- source_word: וְהָאֲתֹנוֹת
  choice: e as jumentas
  rationale: אֲתֹנוֹת designa especificamente jumentas. O português permite preservar essa informação de modo natural no texto principal, dispensando nota lexical.
- source_word: רֹעוֹת
  choice: pastavam
  rationale: רעה, neste contexto, descreve animais alimentando-se no pasto; “pastavam” é a formulação portuguesa mais direta.
- source_word: עַל יְדֵיהֶם
  choice: ao lado deles
  rationale: A expressão idiomática indica proximidade espacial. “Ao lado deles” comunica o sentido sem reproduzir literalmente a referência às mãos.
