source:
  edition: WLC
  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: pt
  text: E eis que[a] um vento forte veio do outro lado do deserto, atingiu os quatro cantos da casa, e ela caiu sobre os jovens, e eles morreram[b]. Só eu escapei para contar a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E de repente”.'
    reason: A expressão hebraica introduz o acontecimento com vivacidade e pode, neste contexto, salientar seu caráter súbito.
  - marker: b
    text: O termo hebraico traduzido como “jovens” também pode significar “rapazes” ou, em certos contextos, “servos”.
    reason: A amplitude lexical de נְעָרִים não permite determinar apenas pela palavra se a referência é etária ou funcional.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função apresentativa e a vivacidade do relato, em registro bíblico digno e ainda compreensível no português atual.
- source_word: רוּחַ גְּדוֹלָה
  choice: um vento forte
  rationale: Neste contexto, רוּחַ denota vento; 'forte' expressa naturalmente a grande intensidade indicada por גְּדוֹלָה sem especificar além do hebraico que se tratava de uma tempestade.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: veio do outro lado do deserto
  rationale: Reproduz o sentido espacial de מֵעֵבֶר, isto é, procedente do lado de lá, sem impor uma geografia mais precisa.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: atingiu os quatro cantos da casa
  rationale: No contexto destrutivo, 'atingiu' comunica a força de נגע e mantém a referência literal aos quatro cantos da casa.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: e ela caiu sobre os jovens
  rationale: O pronome feminino explicita em português que o sujeito singular é 'a casa', evitando que o leitor o associe ao vento; 'jovens' preserva a amplitude contextual de נְעָרִים.
- source_word: וַיָּמֻתוּ
  choice: e eles morreram
  rationale: Tradução direta de מות, sem acrescentar uma formulação causativa.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Só eu escapei
  rationale: Expressa de modo idiomático a dupla ênfase de exclusividade presente em רַק e לְבַדִּי.
- source_word: לְהַגִּיד לָךְ
  choice: para contar a você
  rationale: Formulação natural para a fala do mensageiro, com o destinatário singular preservado.
theological_decisions:
- issue: Identidade dos נְעָרִים atingidos pela queda da casa
  choice: os jovens
  alternative: os servos / os rapazes
  rationale: O substantivo pode designar jovens, rapazes ou servos conforme o contexto. A tradução não os identifica explicitamente nem apenas como filhos de Jó nem apenas como servos, preservando a indeterminação lexical do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto conserva certa solenidade narrativa em 'E eis que', mas emprega sintaxe corrente. A retomada 'ela' esclarece naturalmente que a casa caiu, sem alterar o referente do hebraico.
