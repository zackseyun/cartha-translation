base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: pt
  text: 'Enquanto este ainda estava falando, chegou outro e disse: “Fogo de Deus caiu do céu, queimou as ovelhas e os jovens e os consumiu. Só eu escapei para contar a você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: fogo de Deus
  rationale: Reproduz formalmente a expressão hebraica, preservando sua possível força intensiva ou sua referência à origem divina, sem explicá-la no corpo do texto.
- source_word: וַתִּבְעַר בַּצֹּאן וּבַנְּעָרִים
  choice: ardeu entre as ovelhas e os jovens
  rationale: Mantém o valor locativo/instrumental da preposição ב e a sequência verbal do hebraico, sem antecipar o verbo seguinte, que declara explicitamente o consumo.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: É o sentido lexical direto; no contexto, refere-se aos trabalhadores ou servos de Jó, mas 'jovens' preserva a forma do original.
- source_word: וַתֹּאכְלֵם
  choice: e os consumiu
  rationale: Traduz literalmente a imagem do fogo que 'come' suas vítimas, usando em português o verbo natural 'consumir'.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Só eu escapei
  rationale: 'Expressa naturalmente a ênfase cumulativa de רַק אֲנִי לְבַדִּי: apenas o mensageiro sobreviveu.'
theological_decisions:
- issue: Sentido de 'fogo de Deus'
  choice: Manter 'fogo de Deus' sem interpretação adicional
  alternative: Traduzir como 'um fogo terrível' ou identificar o fenômeno como raio
  rationale: A construção hebraica pode indicar fogo vindo de Deus ou funcionar como intensificador. O relato também atribui o fenômeno ao céu. A tradução preserva essa tensão e não define a causalidade além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Enquanto este ainda falava' preserva a fórmula narrativa recorrente. A fala direta usa sintaxe natural sem suavizar a sobreposição das calamidades.
