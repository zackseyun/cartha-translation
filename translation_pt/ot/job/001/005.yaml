base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: pt
  text: 'Quando os dias de banquete completavam seu curso, Jó mandava chamar seus filhos e os consagrava. Levantava-se de madrugada e oferecia holocaustos conforme o número de todos eles, pois dizia: “Talvez meus filhos tenham pecado e amaldiçoado Deus no coração de cada um”. Assim Jó fazia continuamente.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: terminava o ciclo dos dias de festa
  rationale: O verbo pode indicar que os dias festivos completavam sua rodada ou ciclo; a formulação preserva essa imagem e se ajusta ao contexto de festas realizadas sucessivamente.
- source_word: וַיְקַדְּשֵׁם
  choice: os consagrava
  rationale: Mantém o sentido ritual de separar ou preparar como santos, sem especificar procedimentos que o texto não descreve.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo bíblico português corrente para ofertas inteiramente queimadas, distinguindo este sacrifício de ofertas em sentido amplo.
- source_word: וּבֵרֲכוּ אֱלֹהִים
  choice: amaldiçoado a Deus
  rationale: Embora a forma lexical seja 'abençoar', aqui funciona como eufemismo reverencial para amaldiçoar, como exige o contexto de pecado temido por Jó.
- source_word: בִּלְבָבָם
  choice: em seu coração
  rationale: O singular coletivo em português comunica a interioridade de cada filho e acompanha de perto o hebraico.
- source_word: כָּל הַיָּמִים
  choice: todas as vezes
  rationale: No contexto de ciclos repetidos de banquetes e sacrifícios, exprime a prática habitual de Jó de modo natural, sem sugerir necessariamente um ritual diário.
theological_decisions:
- issue: Natureza da ação de Jó em favor dos filhos
  choice: Relatar que Jó os consagrava e oferecia um holocausto por cada um, sem afirmar que o rito garantia perdão automático.
  alternative: Explicitar que Jó fazia expiação vicária ou que seus filhos eram certamente perdoados.
  rationale: O versículo descreve a precaução piedosa de Jó diante de um pecado possível, mas não formula uma doutrina sobre a eficácia automática dos sacrifícios.
- issue: Pecado interior contra Deus
  choice: “amaldiçoado a Deus em seu coração”
  alternative: “se afastado de Deus” ou “renegado a Deus”
  rationale: A tradução conserva tanto a gravidade do verbo eufemístico quanto a localização interior do possível pecado, sem atenuar nem ampliar a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases reduz a extensão do período hebraico sem alterar sua progressão. “Mandava chamar” explicita naturalmente o envio de uma convocação subentendido no hebraico; “seus filhos” identifica o referente de “os” pelo contexto imediato. O aspecto habitual dos verbos foi mantido pelo imperfeito.
