id: JOB.1.21
reference: Job 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: pt
  text: 'E ele disse: “Nu saí do ventre de minha mãe, e nu voltarei para lá.[a] Yahweh[b] deu, e Yahweh tomou. Seja bendito o nome de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “para lá” e deixa o destino implícito. A expressão pode aludir figuradamente ao ventre, à terra ou sepultura, ou, de modo mais amplo, à condição de nada possuir.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente traduzido por “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: nu
  rationale: Traduz diretamente a condição de estar sem roupa e preserva também a ideia mais ampla de não possuir nada, adequada tanto ao nascimento quanto à morte.
- source_word: יצתי
  choice: saí
  rationale: O verbo יצא descreve aqui a saída do ventre no nascimento; “saí” é direto, natural e mantém a imagem concreta.
- source_word: מִבֶּטֶן אִמִּי
  choice: do ventre de minha mãe
  rationale: Formulação clara e próxima do hebraico, preservando a concretude corporal da expressão.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: e nu voltarei para lá
  rationale: Mantém a ênfase inicial em “nu” e traduz שָׁמָה como “para lá”, sem explicitar um destino que o hebraico deixa implícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: נָתַן
  choice: deu
  rationale: O pretérito perfeito comunica de modo simples a ação concluída e estabelece o paralelismo com “tomou”.
- source_word: לָקָח
  choice: tomou
  rationale: Traduz o sentido básico do verbo hebraico sem acrescentar um objeto nem explicitar além do texto aquilo que foi retirado.
- source_word: יְהִי
  choice: seja
  rationale: Expressa naturalmente em português o valor volitivo ou de desejo da forma jussiva.
- source_word: שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Preserva a construção hebraica e sua força reverente.
- source_word: מְבֹרָךְ
  choice: bendito
  rationale: Mantém o sentido de bênção da forma passiva, sem deslocá-lo interpretativamente para “louvado”.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, e uma nota registra a tradição de vertê-lo como “SENHOR”.
- issue: Referente de שָׁמָה (“para lá”)
  choice: manter “para lá” sem indicar explicitamente o destino
  alternative: voltar à terra; voltar à sepultura; voltar figuradamente ao ventre materno
  rationale: O hebraico deixa o referente implícito. A tradução conserva a possível alusão ao ventre, à terra ou sepultura e, de modo mais amplo, ao retorno à condição de nada possuir.
- issue: Agência divina na perda
  choice: “Yahweh tomou”
  alternative: “Yahweh tirou” ou “Yahweh levou embora”
  rationale: A formulação direta preserva a afirmação teologicamente forte de Job sem atenuá-la nem especificar o objeto da ação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe deliberadamente concisa para preservar o caráter proverbial e solene da fala. A repetição de “Yahweh” reproduz a ênfase do hebraico, e “para lá” mantém sua ambiguidade genuína.
