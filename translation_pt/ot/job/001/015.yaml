  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: pt
  text: Os de Sabá os atacaram[a] e os levaram; mataram os jovens[b] ao fio da espada[c]. Somente eu escapei para contar a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Sabá caiu sobre eles”. O nome “Sabá” provavelmente designa aqui invasores vindos de Sabá, isto é, os sabeus.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “os jovens” provavelmente eram os servos que cuidavam dos animais de Jó.
    reason: cultural_note
  - marker: c
    text: Literalmente, “pela boca da espada”, expressão hebraica que significa “ao fio da espada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: Os de Sabá os atacaram
  rationale: O hebraico diz literalmente que “Sabá caiu sobre” eles. Em contexto, Sabá designa coletivamente invasores provenientes de Sabá, e נפל על expressa um ataque repentino. A formulação mantém o nome próprio e comunica com naturalidade a incursão hostil.
- source_word: וַתִּקָּחֵם
  choice: e os levaram
  rationale: O sufixo masculino plural retoma os bois e as jumentas do versículo anterior. “Levaram” transmite adequadamente a tomada dos animais durante o saque sem acrescentar detalhes ausentes do texto.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נְעָרִים pode indicar jovens, servos ou ajudantes. “Os jovens” preserva o sentido lexical mais direto, enquanto uma nota esclarece a provável função deles no contexto.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: mataram ... ao fio da espada
  rationale: A expressão idiomática hebraica é literalmente “feriram pela boca da espada”. O contexto indica morte, pois apenas o mensageiro escapou; “ao fio da espada” conserva a imagem tradicional da arma sem reproduzir literalmente um idioma obscuro.
- source_word: וָאִמָּלְטָה
  choice: eu escapei
  rationale: מלט denota escapar ou ser posto a salvo. A forma direta em português se ajusta à fórmula narrativa do mensageiro e não atribui explicitamente a causa do livramento.
- source_word: רַק אֲנִי לְבַדִּי
  choice: Somente eu
  rationale: A combinação רַק ... לְבַדִּי enfatiza exclusividade. “Somente eu” reproduz essa ênfase de modo conciso e natural.
- source_word: לְהַגִּיד לָךְ
  choice: para contar a você
  rationale: נגד aqui se refere a transmitir a notícia. “Contar a você” é claro, atual e mantém explícito o destinatário singular.
theological_decisions: []
