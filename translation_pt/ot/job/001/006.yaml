base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: pt
  text: Houve um dia em que os filhos de Deus[b] vieram apresentar-se diante de Yahweh, e o Adversário[a] também veio no meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “Satanás”. O hebraico traz “o satan”, isto é, “o adversário”, com artigo definido, o que pode indicar aqui um título ou uma função, em vez de um nome próprio.
    reason: alternative_reading
  - marker: b
    text: A expressão “filhos de Deus” pode referir-se a seres celestiais que integram o conselho divino.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Houve um dia
  rationale: Preserva a fórmula narrativa hebraica e introduz a cena de modo natural, sem acrescentar um marcador temporal inexistente no texto-fonte.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: os filhos de Deus
  rationale: Mantém de perto a expressão hebraica e sua ambiguidade, sem substituí-la no texto principal por uma interpretação como “seres celestiais”.
- source_word: לְהִתְיַצֵּב
  choice: apresentar-se
  rationale: Neste contexto, o hitpael indica comparecer formalmente ou apresentar-se perante um superior; esta opção comunica essa força de modo idiomático.
- source_word: עַל יְהוָה
  choice: diante de Yahweh
  rationale: Com o verbo de apresentação, a preposição expressa comparecimento perante alguém; “diante de” é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e segue a camada inglesa auditada fornecida, sem ocultá-lo sob um título substitutivo.
- source_word: הַשָּׂטָן
  choice: o Adversário
  rationale: O substantivo hebraico vem com artigo definido e pode funcionar aqui como título ou designação de função, não necessariamente como nome próprio já fixado.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Expressa naturalmente a inclusão dessa figura entre o grupo reunido.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser traduzido como nome próprio ou como título
  choice: o Adversário
  alternative: Satanás; o acusador
  rationale: O artigo definido favorece a leitura como título ou função. A tradução conserva essa distinção e registra a forma tradicional em nota, sem decidir além do que o hebraico permite.
- issue: Se בְּנֵי הָאֱלֹהִים deve ser interpretado ou traduzido formalmente
  choice: os filhos de Deus
  alternative: os seres celestiais; os seres divinos
  rationale: Embora a expressão provavelmente designe integrantes da corte celestial, manter a forma hebraica preserva sua imagem e sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem das notas acompanha sua ocorrência no texto; a nota sobre “Adversário” fica junto ao termo, e a explicação mais ampla sobre “filhos de Deus” encerra o versículo sem interromper a leitura.
