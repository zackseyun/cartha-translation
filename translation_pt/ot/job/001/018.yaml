base_translation:
  language: en
  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: pt
  text: 'Enquanto ele ainda falava, chegou outro mensageiro e disse: “Seus filhos e suas filhas estavam comendo e bebendo vinho na casa do irmão mais velho deles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Enquanto ele ainda falava
  rationale: Preserva a ação em curso expressa pelo particípio e comunica com naturalidade que o mensageiro anterior ainda não havia terminado de falar.
- source_word: וְזֶה בָּא
  choice: chegou outro mensageiro
  rationale: Embora a expressão seja literalmente ‘e este veio’, no contexto ela apresenta mais um mensageiro na sequência; explicitar ‘mensageiro’ torna a referência clara em português.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Forma narrativa natural para introduzir o discurso direto.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Seus filhos e suas filhas
  rationale: Mantém a menção explícita, no hebraico, tanto aos filhos quanto às filhas.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: estavam comendo e bebendo vinho
  rationale: O imperfeito progressivo em português representa adequadamente as ações simultâneas e contínuas expressas pelos particípios hebraicos, sem substituir ‘comendo’ pela interpretação ‘festejando’.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: na casa do irmão mais velho deles
  rationale: Neste contexto, הַבְּכוֹר indica a ordem de nascimento. ‘Irmão mais velho’ é claro e idiomático em português, enquanto ‘irmão primogênito’ seria possível, mas menos natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. A repetição ‘filhos e filhas’ conserva a especificidade do hebraico; ‘deles’ evita que ‘seu irmão’ seja entendido como irmão de Jó.
