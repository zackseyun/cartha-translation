  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: pt
  text: 'E Yahweh disse ao Acusador[a]: “Veja! Tudo o que ele possui está em sua mão. Apenas não estenda a mão contra ele.” Então o Acusador saiu da presença de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Satã” ou “o adversário”. O hebraico traz o artigo definido, o que sugere um título ou uma função.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função de nome pessoal no hebraico.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: O artigo definido sugere aqui um título ou função. “Acusador” comunica a dimensão acusatória do papel no prólogo sem tratá-lo necessariamente como nome próprio.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Marcador enfático que chama a atenção do interlocutor; esta forma é atual e mantém sua força discursiva.
- source_word: כָל אֲשֶׁר לוֹ
  choice: Tudo o que ele possui
  rationale: Expressa naturalmente a totalidade dos bens pertencentes a Jó.
- source_word: בְּיָדֶךָ
  choice: está em suas mãos
  rationale: Conserva a imagem hebraica da mão como poder ou controle e prepara a repetição de “mão” na proibição seguinte.
- source_word: רַק
  choice: Apenas
  rationale: Assinala de modo claro a única restrição imposta à autoridade concedida.
- source_word: אֵלָיו
  choice: contra ele
  rationale: No contexto da expressão sobre estender a mão, indica uma ação hostil dirigida contra Jó.
- source_word: אַל תִּשְׁלַח יָדֶךָ
  choice: não estenda a mão
  rationale: Preserva a metáfora e a repetição deliberada de “mão” presentes no hebraico.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Forma narrativa direta e natural para o verbo hebraico de movimento.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: Traduz naturalmente o idioma que descreve a partida de diante de alguém, mantendo o cenário da corte celestial.
theological_decisions:
- issue: Tradução de הַשָּׂטָן no prólogo de Jó
  choice: o Acusador
  alternative: “o Satã” ou “o adversário”
  rationale: O hebraico traz o artigo definido e apresenta uma função ou título no cenário da corte celestial. A tradução evita impor ao texto, de modo inequívoco, a identificação posterior do termo como nome próprio, preservando sua ambiguidade histórica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “mãos/mão” conserva o vínculo imagético do hebraico; “Veja!” reproduz a ênfase de הִנֵּה sem arcaísmo.
