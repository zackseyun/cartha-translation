  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: pt
  text: Mas estende a tua mão, por favor, e toca em tudo o que ele tem, e ele certamente te amaldiçoará na tua face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “te abençoará”. No prólogo de Jó, essa expressão é geralmente entendida como uma forma eufemística de dizer “te amaldiçoará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Marca com naturalidade o forte contraste da resposta do acusador com a declaração anterior.
- source_word: שְׁלַח נָא יָדְךָ
  choice: estende a tua mão, por favor
  rationale: Conserva a imagem hebraica da mão como poder posto em ação e representa נָא como partícula de pedido ou desafio cortês.
- source_word: וְגַע
  choice: e toca
  rationale: Mantém o sentido básico de נגע e deixa que o contexto comunique a intenção de causar dano, sem explicitar além do hebraico.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: em tudo o que ele tem
  rationale: Expressão portuguesa clara e fiel para todas as posses de Jó.
- source_word: אִם לֹא
  choice: então, com certeza
  rationale: A construção funciona como fórmula enfática semelhante a um juramento; em português, expressa a certeza alegada sem simular uma condição incompleta.
- source_word: עַל פָּנֶיךָ
  choice: na tua própria face
  rationale: Comunica afronta direta e aberta, preservando a imagem do hebraico.
- source_word: יְבָרֲכֶךָּ
  choice: te amaldiçoará
  rationale: Embora ברך normalmente signifique 'abençoar', no prólogo de Jó é entendido no contexto como eufemismo reverencial para 'amaldiçoar'; a forma literal é registrada em nota.
theological_decisions:
- issue: Uso eufemístico de ברך no prólogo de Jó
  choice: Traduzir יְבָרֲכֶךָּ como “te amaldiçoará” no texto principal
  alternative: “te abençoará”
  rationale: O contexto adversativo indica que o acusador prevê uma rejeição aberta de Deus. “Amaldiçoará” comunica o sentido contextual predominante, enquanto a nota preserva a forma lexical literal e a tensão textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O uso de “tu” acompanha a fala direta a Deus e mantém concordância consistente. A tradução conserva a imagem de “estender a mão” e prefere “toca” a uma explicitação interpretativa como “fere”.
