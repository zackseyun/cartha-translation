  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: pt
  text: Não puseste uma cerca ao redor dele, ao redor da casa dele e ao redor de tudo o que ele possui, por todos os lados[a]? Abençoaste o trabalho das suas mãos, e os seus rebanhos se espalharam pela terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não o cercaste» ou «não o protegeste com uma cerca». O hebraico emprega a imagem concreta de um cercado protetor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «aumentaram muito na terra». O verbo hebraico sugere literalmente romper limites ou irromper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: puseste uma cerca ao redor
  rationale: Preserva a imagem concreta de uma barreira protetora, em vez de reduzi-la ao abstrato «protegeste».
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ
  choice: ao redor dele, ao redor da casa dele e ao redor de tudo o que ele possui
  rationale: A repetição reproduz a abrangência enfática do hebraico e, com o verbo de cercar, expressa proteção por todos os lados.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Comunica de modo natural a ideia de proteção circundante e completa.
- source_word: מַעֲשֵׂה יָדָיו
  choice: o trabalho das suas mãos
  rationale: Mantém o idioma hebraico transparente, referindo-se ao trabalho e à atividade produtiva de Jó.
- source_word: בֵּרַכְתָּ
  choice: Abençoaste
  rationale: Conserva a linguagem explícita de bênção e a atribuição da prosperidade à ação divina.
- source_word: מִקְנֵהוּ
  choice: os seus rebanhos
  rationale: Designa coletivamente os animais adquiridos e criados por Jó; o plural é corrente e natural em português.
- source_word: פָּרַץ
  choice: se espalharam
  rationale: Expressa a expansão vigorosa sugerida pelo verbo, cujo sentido básico envolve romper limites ou irromper.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: Com o verbo de expansão, indica que os rebanhos passaram a ocupar extensamente o território.
- source_word: הֲלֹא
  choice: Não puseste
  rationale: Preserva a forma de pergunta retórica e o tom acusatório da fala.
theological_decisions:
- issue: Manter a linguagem de bênção ou convertê-la apenas em prosperidade material
  choice: Abençoaste o trabalho das suas mãos
  alternative: Fizeste prosperar o trabalho das suas mãos
  rationale: O hebraico atribui diretamente a prosperidade à bênção de Deus; «abençoaste» preserva essa afirmação sem a reduzir ao seu efeito econômico.
- issue: Preservar a metáfora da proteção circundante
  choice: puseste uma cerca ao redor
  alternative: protegeste
  rationale: A formulação concreta mantém a força da imagem hebraica e não substitui a metáfora por uma explicação abstrata.
- issue: Representar a expansão dos rebanhos
  choice: se espalharam pela terra
  alternative: aumentaram muito na terra
  rationale: A escolha principal conserva a imagem dinâmica de romper limites e expandir-se, enquanto a alternativa explicita o crescimento quantitativo possível no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «ao redor» foi mantida para refletir a ênfase cumulativa do hebraico; «casa dele» evita uma sequência ambígua de possessivos.
