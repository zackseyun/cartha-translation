base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: pt
  text: 'Enquanto este ainda falava, chegou outro e disse: “Os caldeus se organizaram em três grupos de ataque[a], investiram contra os camelos e os levaram. Mataram os jovens[b] ao fio da espada[c]. Só eu escapei para lhe contar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se dividiram em três grupos” ou “se posicionaram em três destacamentos”; literalmente, “estabeleceram três cabeças”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “jovens” também pode se referir a ajudantes ou servos da casa.
    reason: lexical_alternative
  - marker: c
    text: 'Expressão idiomática hebraica: literalmente, “feriram pela boca da espada”, isto é, mataram com a espada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Enquanto este ainda falava
  rationale: עֹוד com o particípio indica uma ação ainda em curso; “este” preserva a referência anafórica ao mensageiro anterior, e “enquanto” expressa naturalmente a simultaneidade.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: chegou outro e disse
  rationale: Na sequência narrativa, o segundo זֶה apresenta o mensageiro seguinte; “outro” evita uma repetição pouco natural sem alterar a referência.
- source_word: כַּשְׂדִּים
  choice: Os caldeus
  rationale: Trata-se do etnônimo que identifica coletivamente o grupo invasor.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: se organizaram em três grupos de ataque
  rationale: A expressão literal, “estabeleceram três cabeças”, designa aqui três divisões ou destacamentos empregados no ataque. A tradução comunica o sentido militar sem especificar além do contexto.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: investiram contra
  rationale: פשט על descreve um avanço súbito ou uma incursão contra um alvo; “investiram contra” conserva o movimento violento e repentino.
- source_word: הַגְּמַלִּים ... וַיִּקָּחוּם
  choice: os camelos e os levaram
  rationale: O sufixo pronominal retoma os camelos; “levaram” expressa de modo natural que foram tomados pelos invasores.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נְעָרִים significa primariamente “jovens”, embora no contexto doméstico também possa designar ajudantes ou servos; a opção principal preserva essa amplitude lexical.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: Mataram ... ao fio da espada
  rationale: O hebraísmo “feriram pela boca da espada” indica morte pela espada. “Ao fio da espada” preserva a imagem idiomática em português corrente.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Só eu escapei
  rationale: A construção acumula partículas de exclusividade para enfatizar que o mensageiro foi o único a escapar; a formulação portuguesa é concisa e enfática.
- source_word: לְהַגִּיד לָךְ
  choice: para lhe contar
  rationale: הגיד significa contar ou relatar. O pronome “lhe” representa o destinatário singular e mantém o tom direto do relato.
