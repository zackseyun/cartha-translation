  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: pt
  text: Havia um homem na terra de Uz chamado Jó. Esse homem era íntegro e correto, temia a Deus e se afastava do mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “evitava o mal”. O verbo hebraico pode indicar afastar-se, desviar-se ou manter-se longe do mal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: Havia um homem
  rationale: Reproduz de modo natural em português a fórmula existencial que abre a narrativa e mantém a referência explícita a um indivíduo do sexo masculino.
- source_word: בְאֶרֶץ עוּץ
  choice: na terra de Uz
  rationale: Mantém o sentido geográfico comum de אֶרֶץ e translitera o topônimo tradicionalmente como “Uz”.
- source_word: אִיּוֹב שְׁמוֹ
  choice: chamado Jó
  rationale: Expressa naturalmente a identificação pelo nome sem acrescentar informação; “Jó” é a forma portuguesa consagrada do nome.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Esse homem era
  rationale: Retoma o personagem recém-apresentado e preserva a leve força demonstrativa de הַהוּא.
- source_word: תָּם
  choice: íntegro
  rationale: Comunica inteireza moral e conduta irrepreensível sem sugerir necessariamente perfeição absoluta ou ausência total de pecado.
- source_word: יָשָׁר
  choice: correto
  rationale: Expressa retidão ética em português atual e forma com “íntegro” uma combinação clara e natural.
- source_word: וִירֵא אֱלֹהִים
  choice: temia a Deus
  rationale: Preserva o valor verbal da expressão e seu sentido de temor reverente; o contexto requer “Deus” no singular.
- source_word: וְסָר מֵרָע
  choice: se afastava do mal
  rationale: Conserva a imagem verbal de desviar-se ou manter-se longe do mal, sem restringir o sentido a uma única nuance.
theological_decisions:
- issue: Alcance da descrição moral de Jó
  choice: Jó é descrito como íntegro e eticamente correto, sem afirmação explícita de perfeição absoluta.
  alternative: Entender תָּם como declaração de impecabilidade ou perfeição moral absoluta.
  rationale: No contexto sapiencial, תָּם elogia inteireza e integridade. “Íntegro” mantém a forte avaliação positiva sem resolver além do que o hebraico afirma.
- issue: Referente de אֱלֹהִים
  choice: Deus
  alternative: deuses
  rationale: Embora a forma hebraica seja morfologicamente plural, a expressão e o contexto narrativo apontam para o Deus singular.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A redação evita arcaísmos e conserva o tom sóbrio da abertura narrativa.
