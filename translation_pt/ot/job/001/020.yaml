base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: pt
  text: Então Jó se levantou, rasgou sua veste, rapou a cabeça, caiu por terra e se prostrou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorou”. O verbo hebraico descreve o ato de curvar-se ou prostrar-se, muitas vezes como expressão de reverência ou adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal consecutivo de קום dá sequência à narrativa; “se levantou” é natural em português e não exige que Jó estivesse necessariamente deitado.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: rasgou o manto
  rationale: קרע descreve o ato concreto de rasgar a roupa como sinal de luto, e מְעִיל designa uma veste exterior, aqui vertida naturalmente por “manto”.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: rapou a cabeça
  rationale: גזז significa cortar ou tosquiar; neste contexto de luto, a expressão indica cortar rente os cabelos da cabeça. “Rapou a cabeça” comunica o gesto de modo claro e corrente.
- source_word: וַיִּפֹּל אַרְצָה
  choice: lançou-se ao chão
  rationale: A forma direcional אַרְצָה indica movimento em direção ao solo. “Lançou-se ao chão” expressa uma ação deliberada sem sugerir uma queda acidental.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prostrou
  rationale: A forma verbal de שׁחה denota abaixar-se ou prostrar-se, muitas vezes em reverência ou adoração. “Se prostrou” preserva o gesto físico e sua possível força religiosa sem explicitar mais do que o versículo afirma.
theological_decisions:
- issue: Se o ato final de Jó deve ser explicitamente apresentado como adoração
  choice: se prostrou
  alternative: adorou; prostrou-se em adoração
  rationale: O contexto favorece um ato reverente dirigido a Deus, especialmente à luz da fala do versículo seguinte, mas o verbo neste versículo descreve diretamente a prostração e pode expressar reverência ou adoração conforme o contexto. A tradução mantém essa tensão sem reduzir o gesto a algo meramente físico nem inserir explicitamente “adoração” no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência breve de verbos preserva o ritmo solene e cumulativo do hebraico. “Manto” mantém o sentido de uma veste exterior significativa, e “lançou-se ao chão” evita que o gesto deliberado seja entendido como acidente.
