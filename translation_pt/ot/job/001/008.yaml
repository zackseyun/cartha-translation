  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: pt
  text: 'E Yahweh disse ao Acusador[a]: “Você voltou sua atenção para o meu servo Jó?[b] Pois não há ninguém como ele na terra: homem íntegro e reto, que teme a Deus e se afasta do mal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o acusador” (ou “o satã”); aqui, o termo parece indicar um título ou função, e não claramente um nome pessoal.'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “Você pôs o seu coração no meu servo Jó?”; isto é, “Você considerou atentamente o meu servo Jó?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: הַשָּׂטָן
  choice: o Acusador
  rationale: O artigo definido indica aqui, com maior probabilidade, um título ou função. “Acusador” comunica com clareza a nuance forense e oposicional do termo.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Você voltou sua atenção para
  rationale: Expressa em português natural o sentido idiomático de dirigir deliberadamente a atenção a alguém. A imagem hebraica literal é preservada em nota.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto, designa Jó como alguém que pertence a Deus e o serve; “servo” é mais adequado do que “escravo”.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Não há ninguém como ele na terra
  rationale: Transmite o caráter incomparável de Jó sem restringir אֶרֶץ a uma região específica.
- source_word: אִישׁ
  choice: homem
  rationale: Refere-se especificamente a Jó como indivíduo do sexo masculino e mantém a construção descritiva do hebraico.
- source_word: תָּם
  choice: íntegro
  rationale: Descreve inteireza e integridade moral, sem sugerir perfeição absoluta ou ausência total de pecado.
- source_word: יָשָׁר
  choice: reto
  rationale: Comunica retidão moral e forma uma combinação natural em português com “íntegro”.
- source_word: יְרֵא אֱלֹהִים
  choice: que teme a Deus
  rationale: Preserva o idioma bíblico e seu sentido de reverência piedosa contínua.
- source_word: וְסָר מֵרָע
  choice: e se afasta do mal
  rationale: O particípio indica a prática habitual de evitar e rejeitar o mal.
theological_decisions:
- issue: Se הַשָּׂטָן deve ser entendido como nome pessoal ou como título/função
  choice: Traduzido como “o Acusador”
  alternative: “Satanás”, “o Satanás” ou “o adversário”
  rationale: A presença do artigo definido favorece o entendimento do termo como título ou função nesta cena da corte celestial, sem antecipar seu uso posterior como nome próprio.
- issue: Se תָּם atribui perfeição sem pecado a Jó
  choice: Traduzido como “íntegro”
  alternative: “perfeito”, “irrepreensível” ou “completo”
  rationale: No contexto sapiencial, o termo caracteriza inteireza moral e conduta íntegra, não perfeição absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi mantida próxima ao hebraico onde isso soa natural; o idioma hebraico sobre “pôr o coração” foi vertido pelo seu sentido corrente e documentado em nota.
