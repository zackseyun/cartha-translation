  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: pt
  text: Seu gado incluía sete mil ovelhas[a], três mil camelos, quinhentas juntas de bois e quinhentas jumentas. Ele também tinha um número muito grande de servos[b]. Aquele homem era o maior de todos os filhos do Oriente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode abranger ovelhas e cabras, isto é, o gado miúdo.
    reason: Preservar a amplitude lexical de צֹאן, que não se limita necessariamente a ovelhas.
  - marker: b
    text: 'Ou: uma estrutura doméstica e de trabalho muito grande.'
    reason: עֲבֻדָּה pode indicar tanto os servos quanto, de modo mais amplo, o serviço e a organização da propriedade.
  - marker: c
    text: Isto é, de todos os povos ou habitantes do Oriente.
    reason: Esclarecer o sentido coletivo do idioma hebraico בְּנֵי קֶדֶם.
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: seus rebanhos e manadas
  rationale: O termo designa os animais domésticos que constituíam seus bens. A expressão portuguesa abrange naturalmente tanto os animais de pequeno porte quanto os bovinos e camelos enumerados em seguida.
- source_word: צֹאן
  choice: ovelhas
  rationale: É a forma corrente numa enumeração de animais, embora o termo hebraico possa designar coletivamente ovelhas e cabras; essa amplitude é preservada em nota.
- source_word: גְמַלִּים
  choice: camelos
  rationale: Equivalente lexical direto e natural em português.
- source_word: צֶמֶד בָּקָר
  choice: juntas de bois
  rationale: צֶמֶד indica um par atrelado para o trabalho. “Juntas de bois” preserva o sentido agrícola e é uma expressão portuguesa corrente.
- source_word: אֲתוֹנוֹת
  choice: jumentas
  rationale: Preserva explicitamente o gênero feminino indicado pelo hebraico e é mais conciso que “jumentos fêmeas”.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: um número muito grande de servos
  rationale: No contexto da riqueza de Jó, a expressão provavelmente se refere à numerosa força de trabalho ligada à sua casa e propriedade. A nota registra a possibilidade de a expressão destacar mais amplamente todo o serviço ou estabelecimento doméstico.
- source_word: גָּדוֹל מִכָּל
  choice: o maior de todos
  rationale: A construção comparativa apresenta Jó como alguém que superava todos os demais em grandeza, posição e prosperidade, sem restringir a comparação a apenas um desses aspectos.
- source_word: בְּנֵי קֶדֶם
  choice: filhos do Oriente
  rationale: Preserva o idioma hebraico e sua forma masculina representativa; uma nota esclarece que a expressão se refere ao povo ou aos habitantes das terras orientais.
theological_decisions:
- issue: Alcance da expressão בְּנֵי קֶדֶם
  choice: filhos do Oriente
  alternative: povos do Oriente; habitantes do Oriente
  rationale: A tradução mantém a forma cultural e geográfica do hebraico sem pressupor apenas descendentes masculinos; a nota esclarece seu valor coletivo.
- issue: Natureza da grandeza de Jó em גָּדוֹל מִכָּל
  choice: o maior de todos
  alternative: mais importante do que todos; mais rico do que todos
  rationale: “O maior” conserva a amplitude do hebraico, que pode envolver riqueza, posição e proeminência, evitando reduzir a afirmação exclusivamente à riqueza ou à autoridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração foi dividida em três frases para evitar uma construção excessivamente longa. “Juntas de bois” preserva o contexto agrícola; “jumentas” mantém o feminino explícito. As notas conservam ambiguidades lexicais reais sem sobrecarregar o texto principal.
