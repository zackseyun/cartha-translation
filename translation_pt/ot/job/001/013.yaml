base_translation:
  language: en
  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: pt
  text: Certo dia, seus filhos e suas filhas estavam comendo e bebendo vinho na casa do irmão mais velho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do irmão primogênito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Certo dia
  rationale: 'A expressão hebraica introduz uma nova cena narrativa e, apesar do artigo em הַיּוֹם, funciona idiomaticamente como referência indefinida: “certo dia” ou “um dia”.'
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: seus filhos e suas filhas
  rationale: Preserva a menção explícita aos dois grupos, sem reduzi-los ao termo genérico “filhos” ou “filhos e filhas” de modo ambíguo.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: estavam comendo e bebendo
  rationale: Os particípios hebraicos retratam ações em andamento no momento em que a cena é apresentada.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente lexical direto e natural no contexto.
- source_word: בְּבֵית
  choice: na casa
  rationale: Expressa de maneira clara e natural o local indicado pela preposição בְּ e pelo substantivo em construção.
- source_word: אֲחִיהֶם
  choice: do irmão
  rationale: O substantivo significa especificamente “irmão” e o sufixo plural se refere conjuntamente aos filhos e às filhas.
- source_word: הַבְּכוֹר
  choice: mais velho
  rationale: Neste contexto, identifica o irmão segundo a ordem de nascimento. “Mais velho” é idiomático em português moderno, enquanto “primogênito” preserva uma alternativa mais formal e literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Certo dia” reproduz naturalmente a função de abertura de cena; a construção progressiva preserva o caráter contínuo dos particípios hebraicos. O marcador [a] aparece no texto principal.
