  text: Sua ira se acendeu contra mim, e ele me considerou como um de seus inimigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחַר עָלַי אַפּוֹ
  choice: Sua ira se acendeu contra mim
  rationale: A construção חרה com אַף expressa a ira que se acende. O pretérito acompanha a forma narrativa hebraica, enquanto “contra mim” transmite naturalmente a direção hostil de עָלַי.
- source_word: וַיַּחְשְׁבֵנִי
  choice: ele me considera
  rationale: חשב significa aqui considerar, ter ou tratar alguém como pertencente a determinada categoria. “Considera” é claro e corrente em português.
- source_word: לוֹ כְצָרָיו
  choice: um de seus inimigos
  rationale: O hebraico diz literalmente que ele considera Job “como seus inimigos”, com o substantivo no plural. Em português, “um de seus inimigos” preserva o plural e explicita de modo natural que Job é incluído nesse grupo.
theological_decisions:
- issue: Referente do sujeito e dos sufixos de terceira pessoa
  choice: Deus continua sendo o sujeito implícito das ações.
  alternative: Um agente hostil não especificado.
  rationale: No contexto de Job 19:6-12, Job atribui essas ações a Deus. A tradução mantém sem atenuação a tensão da queixa de Job.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva a metáfora hebraica da ira que se acende e reproduz o aspecto passado dos verbos.
