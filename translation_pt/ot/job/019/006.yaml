base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: pt
  text: Saibam, então, que Deus me fez uma injustiça[a] e me cercou com a sua rede[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me tratou injustamente” ou “distorceu a justiça contra mim”. O verbo hebraico pode transmitir a ideia de entortar ou distorcer o que é justo.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua armadilha” ou “a sua rede de caça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: Saibam
  rationale: Imperativo plural de ידע, dirigido aos interlocutores de Jó e chamando-os a reconhecer o que ele afirma como fato.
- source_word: אֵפוֹ
  choice: então
  rationale: Partícula discursiva enfática ou inferencial; “então” se encaixa naturalmente no desenvolvimento do argumento sem lhe acrescentar uma conclusão mais forte do que o hebraico exige.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Título divino singular comum neste contexto; o termo não especifica um título como “Todo-poderoso”.
- source_word: עִוְּתַנִי
  choice: me fez injustiça
  rationale: O verbo עות pode expressar entortar, distorcer ou agir injustamente. A formulação comunica em português a força moral e judicial da acusação de Jó sem suavizá-la.
- source_word: מְצוּדוֹ
  choice: a sua rede
  rationale: O substantivo designa uma rede ou armadilha de caça. “Rede” preserva de modo claro e conciso a imagem concreta.
- source_word: הִקִּיף עָלַי
  choice: me cercou com
  rationale: A construção expressa a ideia de cercar ou envolver Jó; “me cercou com” liga naturalmente o verbo à imagem instrumental da rede.
theological_decisions:
- issue: A acusação de Jó contra Deus
  choice: Manter a afirmação direta de que Deus “me fez injustiça”.
  alternative: “Deus me afligiu” ou “Deus se voltou contra mim”.
  rationale: O verbo hebraico tem forte sentido de distorção ou injustiça. A tradução preserva a tensão teológica e a intensidade do lamento de Jó, sem apresentar a avaliação dele como afirmação doutrinária do narrador.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Saibam” conserva o destinatário plural, e “me fez injustiça” mantém deliberadamente a força incômoda da acusação de Jó.
