source:
  edition: WLC
  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: pt
  text: Meus parentes se foram[a], e meus conhecidos se esqueceram de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meus parentes deixaram de estar presentes”.'
    reason: Alternativa mais explícita para o sentido básico de חָדְלוּ, “cessaram/deixaram de estar”, preservando a formulação menos idiomática subjacente ao hebraico.
lexical_decisions:
- source_word: חָדְלוּ
  choice: me abandonaram
  rationale: O verbo significa fundamentalmente “cessar” ou “deixar de”. Com “meus parentes” como sujeito, “me abandonaram” expressa em português natural que eles deixaram de estar presentes ou de prestar apoio, sem transformar a frase na construção pouco idiomática “meus parentes cessaram”.
- source_word: קְרוֹבָי
  choice: meus parentes
  rationale: O termo designa literalmente os que são próximos e, neste contexto, provavelmente parentes. “Meus parentes” é claro, atual e coerente com a lamentação de Jó.
- source_word: וּמְיֻדָּעַי
  choice: meus conhecidos
  rationale: A forma derivada de ידע refere-se às pessoas conhecidas de Jó. “Meus conhecidos” preserva essa amplitude sem pressupor a intimidade implicada por “amigos”.
- source_word: שְׁכֵחוּנִי
  choice: se esqueceram de mim
  rationale: Tradução direta do verbo “esquecer”, mantendo a força retórica e relacional da lamentação.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução prioriza equivalência ótima: conserva o paralelismo da lamentação e torna idiomática a ideia de que os parentes cessaram sua presença ou apoio.'
