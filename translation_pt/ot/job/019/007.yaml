base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: pt
  text: 'Eis que[a] grito: “Violência!”, mas não sou respondido; clamo por socorro[b], mas não há justiça[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eis” ou “De fato”. O termo hebraico introduz uma declaração enfática e chama a atenção para ela.
    reason: lexical_alternative
  - marker: b
    text: Ou “grito por ajuda”. O verbo indica um apelo urgente por auxílio.
    reason: lexical_alternative
  - marker: c
    text: Ou “julgamento” ou “reparação judicial”. O termo hebraico tem aqui o sentido de justiça ou de uma decisão judicial adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula enfática que chama a atenção. “Vejam” é atual e natural, preservando a força dêitica sem o tom arcaico de “eis”.
- source_word: אֶצְעַק
  choice: eu grito
  rationale: O verbo צעק expressa um grito forte, frequentemente motivado por aflição; “grito” comunica intensidade e urgência.
- source_word: חָמָס
  choice: Violência
  rationale: O substantivo pode indicar violência, injustiça ou agravo. Neste contexto de denúncia, “Violência!” reproduz diretamente o clamor de quem acusa um grave mal sofrido.
- source_word: אֵעָנֶה
  choice: não sou respondido
  rationale: O nifal de ענה é mantido em sentido passivo, preservando a relação verbal entre o clamor de Jó e a ausência de resposta, sem substituí-la pela interpretação “não sou ouvido”.
- source_word: אֲשַׁוַּע
  choice: clamo por socorro
  rationale: O verbo שׁוע designa um apelo urgente por auxílio. “Clamo por socorro” é claro, digno e distingue levemente este pedido do grito anterior.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Aqui o termo abrange julgamento justo, defesa judicial e reparação. “Justiça” conserva o sentido jurídico e moral sem estreitá-lo indevidamente.
theological_decisions:
- issue: Natureza da queixa de Jó contra Deus
  choice: Manter a lamentação direta de Jó por não receber resposta nem encontrar justiça.
  alternative: Suavizar a formulação para evitar a impressão de que Deus não proporciona justiça.
  rationale: O hebraico apresenta sem atenuação o protesto de Jó diante da falta de resposta e de justiça. A tradução preserva essa tensão teológica sem endossar nem explicar a acusação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo poético é preservado por “eu grito” e “clamo”; a linguagem permanece direta e digna, sem amenizar a contundência da queixa de Jó.
