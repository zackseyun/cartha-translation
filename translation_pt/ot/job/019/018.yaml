  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: pt
  text: Até os meninos me desprezam; quando me levanto, falam contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até os insensatos me desprezam; se me levanto, falam contra mim”. O termo hebraico traduzido como “meninos” também pode indicar insensatos, insolentes ou jovens imaturos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Expressa a força inclusiva e enfática do hebraico no contexto: até pessoas de pouca posição social tratam Jó com desprezo.'
- source_word: עֲוִילִים
  choice: os meninos
  rationale: O termo é raro e pode designar pessoas imaturas, moralmente insensatas ou insolentes. Neste contexto, “os meninos” comunica com naturalidade a humilhação social de Jó sem tornar o substantivo mais específico do que o necessário; outras possibilidades são registradas em nota.
- source_word: מָאֲסוּ בִי
  choice: me desprezam
  rationale: מאס indica rejeição acompanhada de desdém; “desprezam” reproduz bem o tom afetivo e é idiomático em português.
- source_word: אָקוּמָה
  choice: quando me levanto
  rationale: Embora a forma possa ser entendida literalmente como “eu me levanto” ou condicionalmente como “se me levanto”, o contexto favorece uma circunstância temporal, possivelmente habitual.
- source_word: וַיְדַבְּרוּ בִי
  choice: falam contra mim
  rationale: דבר com ב pode indicar fala hostil dirigida contra alguém. A tradução preserva o ato verbal e sua hostilidade sem explicitar demais como “zombam”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Meninos” soa mais natural que “criancinhas” e evita impor ao termo hebraico uma faixa etária excessivamente precisa. A nota preserva tanto a incerteza lexical de עֲוִילִים quanto a possível nuance condicional de אָקוּמָה.
