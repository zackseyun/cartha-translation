  source_fidelity: 'A tradução preserva com precisão as imagens e a estrutura fundamental do hebraico: o caminho de Jó é obstruído por um muro, ele não consegue passar, e a escuridão é posta sobre suas veredas. «Fechou o meu caminho com um muro» comunica adequadamente גָּדַר, sem reduzir a imagem a uma abstração como «impediu».'
