  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: pt
  text: Ele fechou o meu caminho com um muro, de modo que não posso passar[a], e pôs escuridão sobre as minhas veredas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito está implícito no hebraico; pelo contexto, Jó está falando de Deus, embora o próprio versículo diga apenas «ele».
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: o meu caminho
  rationale: O substantivo designa caminho, estrada ou curso. A escolha é natural em português e conserva tanto a imagem concreta quanto a possível dimensão figurada da vida de Jó.
- source_word: גָדַר
  choice: fechou ... com um muro
  rationale: O verbo exprime cercar ou obstruir com muro. Esta formulação preserva a imagem concreta com mais clareza em português do que o simples «bloqueou».
- source_word: וְלֹא אֶעֱבוֹר
  choice: de modo que não posso passar
  rationale: A construção apresenta naturalmente o impedimento como resultado do caminho murado; «passar» traduz de modo direto o verbo hebraico.
- source_word: נְתִיבוֹתַי
  choice: as minhas veredas
  rationale: Mantém o plural e distingue poeticamente este termo de אָרְחִי, sem perder a ideia de caminhos ou trilhas.
- source_word: חֹשֶׁךְ
  choice: escuridão
  rationale: É a correspondência direta e comum, adequada aos sentidos literal e metafórico do poema.
- source_word: יָשִׂים
  choice: pôs
  rationale: O verbo significa pôr, colocar ou estabelecer. O pretérito perfeito soa natural no relato de Jó e representa a ação como realizada.
- source_word: וְעַל נְתִיבוֹתַי חֹשֶׁךְ יָשִׂים
  choice: e pôs escuridão sobre as minhas veredas
  rationale: Preserva a preposição e a imagem poética concreta da escuridão colocada sobre os caminhos, em vez de condensá-la interpretativamente como «escureceu».
theological_decisions:
- issue: Referente do sujeito na terceira pessoa
  choice: Ele
  alternative: Deus / o SENHOR
  rationale: O sujeito masculino singular está implícito em hebraico. O contexto identifica Deus como referente, mas o versículo não o nomeia; o pronome preserva essa característica e o fluxo literário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo e as imagens concretas do hebraico sem tornar a sintaxe excessivamente literal.
