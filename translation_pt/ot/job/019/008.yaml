  terminology: «Caminho», «veredas» e «escuridão» são escolhas fiéis e idiomáticas. A alternância entre «caminho» no singular e «veredas» no plural reproduz a distinção e o paralelismo do texto hebraico. O pronome «Ele» conserva corretamente o sujeito implícito, sem introduzir no texto o nome de Deus.
