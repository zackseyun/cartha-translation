  text: כְּ֭בוֹדִ/י מֵ/עָלַ֣/י הִפְשִׁ֑יט וַ֝/יָּ֗סַר עֲטֶ֣רֶת רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: pt
  text: 'Ele me despiu da minha honra[a]

    e tirou a coroa da minha cabeça.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da minha glória” ou “da minha dignidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: minha honra
  rationale: כָּבוֹד pode designar honra, glória, dignidade ou posição. No lamento de Jó sobre sua humilhação e perda de condição social, “honra” comunica com naturalidade o sentido concreto sem acrescentar uma conotação teológica indevida.
- source_word: מֵעָלַי
  choice: me ... da minha honra
  rationale: A expressão significa literalmente “de sobre mim”. Em português, a construção idiomática “despiu-me da minha honra” preserva a imagem de remoção sem rigidez literal.
- source_word: הִפְשִׁיט
  choice: despiu
  rationale: O verbo descreve tirar roupa ou aquilo que reveste alguém. “Despiu” conserva a metáfora vívida de Jó sendo privado de sua honra.
- source_word: וַיָּסַר
  choice: tirou
  rationale: O hifil de סור significa remover ou tirar. “Tirou” é claro e natural, além de manter o paralelismo poético.
- source_word: עֲטֶרֶת
  choice: a coroa
  rationale: O substantivo denota coroa, diadema ou grinalda como símbolo de honra e posição. “Coroa” preserva de modo direto essa imagem.
- source_word: רֹאשִׁי
  choice: minha cabeça
  rationale: A tradução direta mantém a imagem central da coroa sendo retirada da cabeça de Jó.
theological_decisions:
- issue: Agente não nomeado da ação
  choice: O pronome “Ele” permanece sem identificação explícita, referindo-se contextualmente a Deus.
  alternative: Explicitar “Deus” ou entender o sujeito como um adversário ou circunstância não especificados.
  rationale: O contexto imediato indica que Jó atribui sua aflição a Deus, mas o hebraico usa apenas a forma verbal masculina singular. Manter “Ele” conserva a concisão e a tensão teológica do original sem inserir o nome divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo e as metáforas de despojamento e perda de posição presentes no hebraico.
