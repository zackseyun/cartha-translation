  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: pt
  text: Mas eu sei que o meu Redentor[a] vive e que, depois, ele se levantará sobre o pó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu Defensor”. O termo hebraico גֹּאֵל pode designar um redentor, defensor ou alguém que reivindica a causa de um membro da família.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “e, por fim, ele ficará de pé sobre a terra”; também se pode entender: “e, como o último, ele se levantará sobre o pó”. O hebraico desta oração é difícil. “Pó” é a tradução literal e pode evocar a mortalidade, a sepultura ou a terra.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção com o pronome independente tem força enfática e contrastiva no contexto. “Mas eu” comunica isso de modo natural em português.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito expressa uma convicção estabelecida com relevância presente; o presente é a forma idiomática em português.
- source_word: גֹּאֲלִי
  choice: meu Redentor
  rationale: גאל designa aquele que resgata, defende ou reivindica a causa de um parente. “Redentor” conserva a amplitude e o peso tradicional sem identificar além do que o texto afirma; “Defensor” é registrado em nota.
- source_word: חָי
  choice: vive
  rationale: O adjetivo predicativo é expresso naturalmente pelo verbo “viver”, indicando uma realidade contínua.
- source_word: וְאַחֲרוֹן
  choice: e que, depois
  rationale: A forma pode ser entendida adverbialmente ou como substantivo. “Depois” preserva uma leitura possível sem impor uma formulação escatológica mais específica.
- source_word: עַל
  choice: sobre
  rationale: A preposição pode significar “sobre”, “em cima de” ou “por cima de”; “sobre” mantém aberta a relação espacial.
- source_word: עָפָר
  choice: o pó
  rationale: Tradução literal que conserva a imagem hebraica e sua possível evocação da mortalidade, da sepultura ou da terra.
- source_word: יָקוּם
  choice: se levantará
  rationale: קום pode significar levantar-se, erguer-se ou ficar de pé. “Se levantará” conserva a vivacidade e a ambiguidade sem restringir a imagem a um cenário judicial ou à ressurreição.
theological_decisions:
- issue: Identidade e função do גֹּאֵל de Jó
  choice: meu Redentor
  alternative: meu Defensor; meu resgatador familiar
  rationale: O hebraico não identifica explicitamente a figura como Deus, uma testemunha celestial ou o Messias. A tradução mantém a ressonância teológica sem resolver essa tensão.
- issue: Força escatológica de וְאַחֲרוֹן ... יָקוּם
  choice: depois, ele se levantará sobre o pó
  alternative: por fim, ele ficará de pé sobre a terra; como o último, ele se levantará sobre o pó
  rationale: A sintaxe e o alcance teológico da frase são discutidos. A redação principal permanece próxima do hebraico e a nota registra as principais alternativas sem transformar o verso em uma fórmula explícita de ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada naturalmente com “e que”, mantendo o paralelismo entre aquilo que Jó sabe e a oração seguinte. As ambiguidades lexical, espacial e teológica foram preservadas na redação e nas notas.
