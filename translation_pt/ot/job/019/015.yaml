  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: pt
  text: Os hóspedes da minha casa e as minhas servas me consideram um estranho; aos olhos deles, tornei-me um estrangeiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: os hóspedes da minha casa
  rationale: גָּר pode designar alguém que reside temporariamente ou como dependente estrangeiro. Neste contexto doméstico, “hóspedes da minha casa” comunica com naturalidade as pessoas acolhidas ou alojadas na casa, sem impor a ideia moderna de imigrantes.
- source_word: אַמְהֹתַי
  choice: as minhas servas
  rationale: O termo אָמָה designa serva ou escrava. “Servas” preserva a relação doméstica e social do texto em linguagem digna e corrente, sem especificar além do que o verso exige.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: me consideram um estranho
  rationale: 'A construção expressa a maneira como essas pessoas avaliam Jó: tratam-no mental e socialmente como alguém alheio.'
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: aos olhos deles, tornei-me um estrangeiro
  rationale: Mantém a metáfora hebraica “aos olhos deles” e o paralelismo entre זָר, “estranho”, e נָכְרִי, “estrangeiro”.
