  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: pt
  text: E, depois que a minha pele tiver sido destruída[b], ainda assim, da minha carne verei Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na minha carne verei Deus”; alternativamente: “sem a minha carne verei Deus”. A expressão hebraica é difícil e tem sido entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: 'A oração “depois que a minha pele tiver sido destruída” é textual e lexicalmente difícil; traduções mais literais incluem: “depois que tiverem arrancado a minha pele — isto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: E, depois que
  rationale: Preserva tanto a ligação com o versículo anterior quanto a relação temporal expressa pelo hebraico, em português natural.
- source_word: עוֹרִי
  choice: a minha pele
  rationale: É o equivalente humano mais natural de עוֹר e mantém a imagem corporal do sofrimento de Jó.
- source_word: נִקְּפוּ זֹאת
  choice: tiver sido destruída
  rationale: A expressão hebraica é difícil. A forma passiva comunica de modo claro a ruína da pele sem impor uma representação excessivamente específica; a nota registra a formulação mais literal.
- source_word: וּמִבְּשָׂרִי
  choice: ainda assim, da minha carne
  rationale: “Da minha carne” preserva o sentido concreto mais direto de מִן, enquanto “ainda assim” expressa o contraste contextual. A nota mantém abertas as interpretações “na minha carne” e “sem a minha carne”.
- source_word: אֶחֱזֶה
  choice: verei
  rationale: חזה significa ver ou contemplar. “Verei” é claro, atual e digno, sem acrescentar intensidade não exigida pelo contexto.
- source_word: אֱלוֹהַּ
  choice: a Deus
  rationale: אֱלוֹהַּ é a designação singular de Deus; a construção portuguesa exige a preposição “a” como complemento de “verei” nesta ordem sintática.
theological_decisions:
- issue: Se וּמִבְּשָׂרִי ensina explicitamente a ressurreição corporal
  choice: Manter “da minha carne” no texto principal e preservar a tensão interpretativa.
  alternative: “na minha carne” ou “sem a minha carne”
  rationale: A preposição e a sintaxe hebraicas são disputadas. “Na minha carne” favoreceria mais diretamente uma leitura de ressurreição corporal, enquanto “sem a minha carne” indicaria uma visão desencarnada. A tradução não resolve além do que o hebraico permite.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto mantém um tom digno e poético, com sintaxe clara. As duas notas estão marcadas no texto principal e registram as dificuldades reais do hebraico sem impor uma conclusão denominacional.
