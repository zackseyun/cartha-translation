- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה, nesta fórmula narrativa de diálogo, significa normalmente “responder”; a escolha conserva o sentido convencional e introduz naturalmente a fala de Jó.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: אמר é o verbo comum para “dizer”. Manter “disse” preserva a estrutura hebraica “respondeu e disse”, sem paráfrase desnecessária.
- source_word: וַ
  choice: Então
  rationale: O waw prefixado indica progressão narrativa; “Então” expressa essa sequência em português moderno e natural, enquanto a nota registra a correspondência mais formal com “E”.
