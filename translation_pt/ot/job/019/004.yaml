  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: pt
  text: E, mesmo que eu de fato tenha errado, meu erro fica comigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «meu erro passa a noite comigo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: E, mesmo que
  rationale: A combinação introduz uma concessão ligada ao versículo anterior; esta formulação preserva tanto a conexão quanto a força concessiva.
- source_word: אָמְנָם
  choice: de fato
  rationale: Reforça a concessão de modo natural no português contemporâneo, sem transformar a hipótese em confissão inequívoca.
- source_word: שָׁגִיתִי
  choice: eu tenha errado
  rationale: O verbo denota desviar-se ou cometer um erro. «Tenha errado» é claro e preserva a amplitude do termo sem especificá-lo indevidamente como pecado.
- source_word: אִתִּי
  choice: comigo
  rationale: Mantém o sentido mais direto da preposição e sugere que o eventual erro diz respeito ao próprio Jó.
- source_word: תָּלִין
  choice: fica
  rationale: O verbo significa literalmente alojar-se ou passar a noite, mas aqui comunica permanência; «fica» é idiomático, claro e conciso.
- source_word: מְשׁוּגָתִי
  choice: meu erro
  rationale: O substantivo corresponde ao campo semântico do verbo anterior e evita a interpretação mais específica «meu pecado».
theological_decisions:
- issue: Se Jó admite culpa ou apresenta apenas uma hipótese concessiva
  choice: mesmo que eu de fato tenha errado
  alternative: ainda que eu realmente estivesse errado
  rationale: 'A construção mantém a tensão do hebraico: Jó concede a possibilidade para fins de argumentação, sem necessariamente confessar culpa moral.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A metáfora literal de לין foi preservada em nota, enquanto o texto principal comunica seu sentido idiomático.
