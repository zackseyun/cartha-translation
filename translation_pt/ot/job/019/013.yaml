  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: pt
  text: Ele afastou de mim os meus irmãos[a], e os que me conhecem tornaram-se completamente estranhos a mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele pôs os meus irmãos longe de mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os meus conhecidos tornaram-se estranhos a mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: os meus irmãos
  rationale: Preserva o sentido lexical direto do plural masculino com sufixo de primeira pessoa. No contexto, pode abranger parentes próximos, mas «irmãos» mantém a forma e a força social do hebraico sem ampliar explicitamente para ambos os sexos.
- source_word: מֵעָלַי
  choice: de mim
  rationale: Em combinação com הִרְחִיק, a expressão indica afastamento da presença ou esfera de Jó. «De mim» é natural em português; a ideia de distância já está expressa pelo verbo «afastou».
- source_word: הִרְחִיק
  choice: afastou
  rationale: O hifil perfeito de רחק significa causar distância, remover ou afastar. «Afastou» conserva a força causativa de modo claro e idiomático.
- source_word: וְיֹדְעַי
  choice: os que me conhecem
  rationale: Traduz de forma transparente a expressão participial, literalmente «os meus conhecedores», sem restringi-la ao sentido possivelmente mais estreito de «conhecidos».
- source_word: אַךְ
  choice: completamente
  rationale: Neste contexto, a partícula intensifica o predicado e ressalta a totalidade da ruptura relacional.
- source_word: זָרוּ
  choice: tornaram-se ... estranhos
  rationale: O perfeito descreve o resultado de terem passado a agir ou estar como estranhos. Esta formulação conserva a imagem concreta do hebraico e sua dimensão relacional.
- source_word: מִמֶּנִּי
  choice: para mim
  rationale: A construção hebraica marca separação, literalmente «de mim»; em português, porém, «tornaram-se estranhos para mim» exprime naturalmente a mesma ruptura e evita a sequência pouco idiomática «estranhos de mim».
theological_decisions:
- issue: Sujeito implícito de הִרְחִיק
  choice: Manter o sujeito como «Ele», sem nomeá-lo no versículo.
  alternative: «Deus afastou de mim os meus irmãos.»
  rationale: O verbo hebraico tem sujeito masculino singular não expresso, e o contexto identifica Deus como referente. «Ele» preserva tanto a economia do original quanto a tensão da queixa de Jó, sem acrescentar uma explicitação interpretativa ao corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva o paralelismo e a progressão entre o afastamento causado por «Ele» e a completa ruptura dos relacionamentos de Jó.
