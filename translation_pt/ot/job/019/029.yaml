  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: pt
  text: Vocês mesmos, temam a espada, pois a ira traz os castigos da espada, para que saibam que há julgamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o Todo-Poderoso existe”. A expressão hebraica final é difícil e também tem sido entendida como “que há julgamentos” ou “que há um juiz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: Tenham vocês mesmos medo
  rationale: O imperativo plural de גור expressa uma advertência forte, e לָכֶם acrescenta ênfase nos próprios destinatários. A formulação é clara e natural em português.
- source_word: מִפְּנֵי חֶרֶב
  choice: da espada
  rationale: Com o verbo de temor, a locução preposicional indica aquilo diante de que se deve ter medo; “da espada” é idiomático e preserva a imagem hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da advertência anterior.
- source_word: חֵמָה
  choice: a ira
  rationale: Designa cólera intensa; “ira” mantém o tom moral e judicial do contexto sem reduzir o termo a uma emoção passageira.
- source_word: עֲוֺנוֹת חָרֶב
  choice: os castigos da espada
  rationale: Embora עֲוֺנוֹת normalmente possa significar “iniquidades” ou “culpas”, aqui a combinação com “espada” aponta para as consequências punitivas da culpa. A tradução mantém a concisão e o sentido judicial contextual.
- source_word: לְמַעַן תֵּדְעוּן
  choice: para que saibam
  rationale: A conjunção final com o imperfeito expressa propósito ou resultado pretendido.
- source_word: שדין
  choice: que há julgamento
  rationale: A expressão consonantal final é difícil. No contexto, a advertência visa fazer os amigos reconhecerem a realidade do julgamento, sem especificar além do que a leitura permite.
theological_decisions:
- issue: Interpretação da difícil expressão final שדין
  choice: que há julgamento
  alternative: que o Todo-Poderoso existe; que há julgamentos; que há um juiz
  rationale: A leitura centrada em “julgamento” se ajusta à advertência imediata sobre punição, mas o hebraico admite interpretações antigas e significativas diferentes. A nota preserva essa incerteza textual e teológica em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tenham vocês mesmos medo” conserva a ênfase do pronome hebraico; “espada”, “ira” e “julgamento” preservam o campo imagético e judicial do versículo.
