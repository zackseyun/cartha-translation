  text: כִּ֣י תֹ֭אמְרוּ מַה נִּרְדָּף ל֑/וֹ וְ/שֹׁ֥רֶשׁ דָּ֝בָ֗ר נִמְצָא בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: pt
  text: 'Se vocês disserem[a]: “Como vamos persegui-lo, visto que a raiz da questão se encontra em mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil. A oração final também pode ser entendida aproximadamente assim: “a raiz da questão se encontra nele”, dependendo de como se avaliam o texto consonantal e as versões antigas. O verbo traduzido por “perseguir” também pode ter o sentido mais forte de “hostilizar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz aqui uma declaração hipotética dos oponentes de Jó; em português, “se” expressa naturalmente essa função condicional.
- source_word: תֹאמְרוּ
  choice: vocês disserem
  rationale: O imperfeito qal na segunda pessoa masculina plural recebe valor adequado ao período condicional e mantém explícito o sujeito plural.
- source_word: מַה
  choice: Como
  rationale: Com o verbo, funciona adverbialmente, perguntando de que modo se dará a ação.
- source_word: נִּרְדָּף
  choice: vamos perseguir
  rationale: O verbo רדף pode significar perseguir, ir atrás ou hostilizar. “Perseguir” preserva tanto a imagem da perseguição quanto a hostilidade do contexto, mantendo a primeira pessoa do plural.
- source_word: לוֹ
  choice: -lo
  rationale: A preposição ל marca aqui o alvo da perseguição; o pronome oblíquo produz uma construção natural em português.
- source_word: וְשֹׁרֶשׁ
  choice: visto que a raiz
  rationale: A conjunção introduz a razão alegada para a perseguição. “Raiz” preserva a metáfora do fundamento ou origem.
- source_word: דָּבָר
  choice: da questão
  rationale: Neste contexto, דָּבָר aponta para o assunto ou caso em debate. “Questão” é corrente e mantém a amplitude do termo.
- source_word: נִמְצָא
  choice: se encontra
  rationale: Representa de modo natural o sentido passivo/resultativo do nifal sem explicar além do texto.
- source_word: בִי
  choice: em mim
  rationale: Segue diretamente o texto massorético vocalizado, embora a expressão seja difícil e exista uma leitura alternativa antiga e interpretativa, registrada em nota.
theological_decisions:
- issue: Localização da “raiz da questão”
  choice: em mim
  alternative: nele
  rationale: A tradução principal segue a vocalização massorética בִי, “em mim”, sem harmonizar a dificuldade. A alternativa “nele” é preservada na nota devido à consideração do texto consonantal e das versões antigas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a pergunta retórica, a primeira pessoa plural dos adversários e a tensão textual de “em mim”, sem resolver silenciosamente a dificuldade.
