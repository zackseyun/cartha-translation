base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: pt
  text: Quem dera que as minhas palavras fossem agora escritas! Quem dera que fossem gravadas num livro[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num rolo” ou “num documento escrito”. O termo hebraico traduzido por “livro” também pode indicar esses tipos de texto escrito.
    reason: cultural_note
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão idiomática introduz um desejo intenso, não uma pergunta literal. “Quem dera” transmite de modo natural em português sua força optativa.
- source_word: אֵפוֹ
  choice: agora
  rationale: A partícula acrescenta intensidade e imediatismo ao desejo; “agora” preserva essa urgência sem tornar a formulação pesada.
- source_word: וְיִכָּתְבוּן
  choice: fossem agora escritas
  rationale: A forma tem sentido passivo no contexto da construção optativa. O subjuntivo em português expressa naturalmente o desejo.
- source_word: מִלָּי
  choice: as minhas palavras
  rationale: É a tradução direta e corrente do substantivo plural com sufixo de primeira pessoa, referindo-se às declarações de Jó.
- source_word: בַּסֵּפֶר
  choice: num livro
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito. “Livro” é claro para leitores modernos, enquanto a amplitude histórica do termo é preservada em nota.
- source_word: וְיֻחָקוּ
  choice: fossem registradas
  rationale: חקק pode significar inscrever ou gravar, com possível ênfase na permanência. “Registradas” soa natural no paralelismo, e a alternativa mais concreta é indicada em nota.
