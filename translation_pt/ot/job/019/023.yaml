translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Quem dera” conserva o paralelismo emotivo do hebraico. A nota reúne as ambiguidades relacionadas ao suporte escrito e ao modo de inscrição.
