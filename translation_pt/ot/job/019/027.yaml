source:
  edition: WLC
  text: אֲשֶׁ֤ר אֲנִ֨י אֶֽחֱזֶה לִּ֗/י וְ/עֵינַ֣/י רָא֣וּ וְ/לֹא זָ֑ר כָּל֖וּ כִלְיֹתַ֣/י בְּ/חֵקִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/027.yaml
  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: pt
  text: a quem eu mesmo verei para mim[a]; os meus olhos o verão, e não um estranho[b]. Meus rins[c] se consomem dentro do meu peito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a meu favor». O sentido da expressão hebraica é difícil e enfático.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e não outra pessoa». Literalmente, «e não um estranho».'
    reason: lexical_alternative
  - marker: c
    text: No hebraico, os rins representam o íntimo da pessoa ou suas emoções mais profundas.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: a quem
  rationale: O pronome relativo retoma a pessoa mencionada no versículo anterior e funciona como objeto de אֶחֱזֶה.
- source_word: אֲנִי
  choice: eu mesmo
  rationale: O pronome independente é enfático, pois a pessoa verbal já está marcada no verbo.
- source_word: אֶחֱזֶה
  choice: verei
  rationale: Expressa ver ou contemplar; «verei» é claro, atual e preserva o paralelismo visual do verso.
- source_word: לִּי
  choice: para mim
  rationale: Mantém o dativo difícil e enfático sem o interpretar de modo decisivo como «a meu favor».
- source_word: וְעֵינַי רָאוּ
  choice: os meus olhos o verão
  rationale: Conserva a imagem concreta e entende o qatal em paralelo temporal com o verbo precedente; o objeto é retomado naturalmente em português.
- source_word: וְלֹא זָר
  choice: e não um estranho
  rationale: Preserva o sentido lexical mais concreto de זָר e a forma elíptica do hebraico, sem excluir a interpretação «e não outra pessoa».
- source_word: כָּלוּ
  choice: se consomem
  rationale: Comunica o esgotamento ou a intensa ansiedade expressa por כלה, mantendo a força poética.
- source_word: כִלְיֹתַי
  choice: meus rins
  rationale: Retém a imagem hebraica dos rins como sede da vida interior e das emoções profundas, explicada em nota.
- source_word: בְּחֵקִי
  choice: dentro do meu peito
  rationale: Preserva a imagem corporal de חֵיק em português natural, sem reduzi-la simplesmente a «dentro de mim».
theological_decisions:
- issue: Natureza da visão esperada por Jó
  choice: Apresentar como futura a visão pessoal daquele que foi mencionado no versículo anterior, sem definir quando ou de que modo ocorrerá.
  alternative: Especificar ressurreição corporal, vindicação ainda nesta vida ou visão de Deus após a morte.
  rationale: O hebraico enfatiza que o próprio Jó verá, mas este verso isoladamente não resolve a questão cronológica ou doutrinária.
- issue: Sentido de לִי
  choice: «para mim», preservando a dificuldade do dativo.
  alternative: «a meu favor» ou omitir a expressão como mero reforço reflexivo.
  rationale: A formulação evita transformar uma construção ambígua em uma afirmação forense inequívoca.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe poética e as imagens corporais do hebraico foram preservadas; as notas esclarecem as expressões que soariam opacas ou poderiam ser entendidas de mais de uma maneira.
