  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: pt
  text: Chamo meu servo[a], mas ele não responde[b]; com minha própria boca lhe imploro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu escravo”. O hebraico עֶבֶד pode designar um servo ou um escravo, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Chamei meu servo, mas ele não respondeu; com minha própria boca lhe implorei”. As formas verbais hebraicas também podem ser traduzidas mais estritamente no passado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: meu servo
  rationale: עֶבֶד pode designar servo ou escravo. No contexto doméstico, “servo” é natural e preserva a humilhação social de Jó, enquanto “escravo” permanece uma alternativa lexical legítima.
- source_word: קָרָאתִי
  choice: chamo
  rationale: Embora a forma seja perfeita, o discurso poético de lamentação permite entendê-la como descrição vívida da situação presente. “Chamo” soa natural em português e mantém aberta, em nota, a leitura estritamente passada.
- source_word: וְלֹא יַעֲנֶה
  choice: mas ele não responde
  rationale: ענה significa responder. “Mas” explicita o contraste contextual, e o presente retrata a falta de resposta na situação vivida por Jó.
- source_word: בְּמוֹ פִי
  choice: com minha própria boca
  rationale: 'A expressão é enfática e ressalta a humilhação pessoal: o próprio Jó precisa dirigir a súplica ao servo.'
- source_word: אֶתְחַנֶּן לוֹ
  choice: lhe imploro
  rationale: O hitpael de חנן expressa pedir favor ou misericórdia. “Imploro” transmite a súplica intensa sem acrescentar a modalidade não expressa de modo explícito em “tenho de”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A ordem final “com minha própria boca lhe imploro” preserva a ênfase hebraica na súplica pessoal e evita a construção menos idiomática “imploro a ele”.
