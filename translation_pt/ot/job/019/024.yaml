  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: pt
  text: com um estilete de ferro e com chumbo[a], que sejam gravadas na rocha para sempre![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O chumbo pode ter sido usado junto com o instrumento de ferro, talvez para preencher e tornar mais visíveis as letras entalhadas, embora o texto não explique sua função.
    reason: cultural_note
  - marker: b
    text: 'Ou: “que sejam talhadas na rocha para sempre”. O verbo hebraico geralmente significa “talhar” ou “cortar”; aqui se refere à inscrição permanente das palavras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: com estilete
  rationale: עֵט designa um instrumento de escrita ou gravação. Por estar associado ao ferro e à rocha, o contexto indica um estilete de gravar, não uma pena com tinta.
- source_word: בַּרְזֶל
  choice: de ferro
  rationale: Identifica diretamente o material de que é feito o estilete.
- source_word: וְעֹפָרֶת
  choice: e chumbo
  rationale: עֹפָרֶת é o metal chumbo. Talvez fosse usado para realçar as letras entalhadas, mas o texto apenas menciona o material, sem explicar sua função.
- source_word: לָעַד
  choice: para sempre
  rationale: Expressa permanência duradoura e preserva de modo natural, em português corrente, o desejo de uma inscrição permanente.
- source_word: בַּצּוּר
  choice: na rocha
  rationale: צוּר significa rocha ou penhasco. A preposição e o verbo de corte indicam palavras gravadas na própria rocha.
- source_word: יֵחָצְבוּן
  choice: que sejam gravadas
  rationale: A forma deriva de חצב, normalmente 'talhar, cortar, escavar'. Neste contexto, refere-se a palavras entalhadas na rocha; o imperfeito tem valor volitivo, continuando o desejo do versículo anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Estilete” preserva a imagem de um instrumento de escrita e gravação; “gravadas” comunica a função contextual, enquanto a nota mantém o sentido mais literal do verbo hebraico.
