  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: pt
  text: Suas tropas vêm juntas; levantam contra mim o seu caminho e acampam por toda a volta da minha tenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחַד
  choice: Juntas
  rationale: Expressa a ação coordenada ou simultânea das tropas e concorda naturalmente com o substantivo feminino plural em português.
- source_word: יָבֹאוּ
  choice: vêm
  rationale: Preserva o sentido básico de בוא e o presente vívido da descrição poética.
- source_word: גְדוּדָיו
  choice: as suas tropas
  rationale: גְּדוּד designa tropa, bando ou destacamento. “Tropas” mantém clara a metáfora militar sem especificar indevidamente o tamanho ou o caráter das forças; o possessivo preserva a referência pronominal do hebraico.
- source_word: וַיָּסֹלּוּ
  choice: levantam
  rationale: O verbo סלל pode descrever o ato de elevar, aterrar ou preparar uma estrada e também evocar uma rampa de cerco. “Levantam” conserva essa imagem concreta, esclarecida pela nota.
- source_word: עָלַי
  choice: contra mim
  rationale: No contexto de ataque e cerco, a preposição tem força adversativa, expressa naturalmente por “contra mim”.
- source_word: דַּרְכָּם
  choice: a estrada delas
  rationale: דֶּרֶךְ pode ser caminho, via ou estrada. “Estrada” combina com o verbo de construção e preserva a imagem de uma via elevada para o ataque; “delas” evita confundir o possessivo com o referente masculino anterior.
- source_word: וַיַּחֲנוּ
  choice: acampam
  rationale: Traduz diretamente חנה e mantém o cenário militar em linguagem atual.
- source_word: סָבִיב
  choice: ao redor
  rationale: Comunica o cerco em volta da tenda de modo natural; o contexto já sugere o envolvimento por todos os lados.
- source_word: לְאָהֳלִי
  choice: da minha tenda
  rationale: Preserva a imagem concreta de אֹהֶל, que no poema também pode representar a morada ou o lar de Jó.
theological_decisions:
- issue: Referente do sufixo masculino singular em גְדוּדָיו (“suas tropas”)
  choice: Manter o possessivo sem explicitar o referente; no contexto, ele aponta para Deus, descrito por Jó como quem o ataca.
  alternative: Explicitar “as tropas de Deus” ou entender o sufixo como referência a um comandante inimigo não identificado dentro da metáfora.
  rationale: Os versículos anteriores apresentam Deus como o agente da hostilidade, mas o hebraico conserva a forma pronominal. A tradução mantém essa forma e deixa o contexto identificar o referente, sem eliminar a tensão da linguagem de Jó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem inicial mantém o destaque poético de “Juntas”. “Estrada delas” é deliberadamente explícito para evitar a ambiguidade possessiva do português e preservar que a via pertence às tropas.
