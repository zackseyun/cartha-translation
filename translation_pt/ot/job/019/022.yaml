  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: pt
  text: Por que vocês me perseguem como Deus[a] e não se fartam da minha carne?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um deus”. O hebraico אֵל também pode significar “deus” ou, com menor probabilidade aqui, “um poderoso”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “da minha carne”. A expressão sugere que eles procuram se saciar consumindo ou devorando a própria carne de Jó — uma imagem vívida de hostilidade implacável.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz diretamente a pergunta de protesto de Jó.
- source_word: תִּרְדְּפֻנִי
  choice: vocês me perseguem
  rationale: O verbo רדף pode significar perseguir, ir atrás ou hostilizar. “Perseguem” preserva tanto a ação insistente quanto a hostilidade dos companheiros.
- source_word: כְמוֹ אֵל
  choice: como Deus
  rationale: A construção comparativa é direta, e “Deus” é o referente mais provável no contexto, embora אֵל também possa ser entendido de modo indefinido.
- source_word: וּמִבְּשָׂרִי
  choice: da minha carne
  rationale: Mantém de perto a preposição מן e a imagem concreta de בשר. Em ligação com שבע, sugere saciar-se à custa da carne de Jó.
- source_word: לֹא תִשְׂבָּעוּ
  choice: não se fartam
  rationale: שבע expressa ficar saciado ou satisfeito. “Fartar-se” conserva em português a metáfora vívida de consumo insaciável.
theological_decisions:
- issue: Referente de אֵל em כְמוֹ אֵל
  choice: Deus
  alternative: um deus; um poderoso
  rationale: No contexto do sofrimento de Jó, a comparação mais provável é com a ação severa de Deus. A nota preserva a amplitude lexical sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito “vocês” para refletir a forma verbal dirigida aos companheiros de Jó. “Fartar-se da minha carne” mantém a força poética e corporal do hebraico.
