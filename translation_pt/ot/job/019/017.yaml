base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: pt
  text: Minha mulher sente repulsa do meu hálito, e causo nojo aos filhos do meu próprio corpo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra interpretação do difícil hebraico: “e minha súplica se dirige aos filhos do meu corpo” ou “imploro o favor dos filhos do meu corpo”.'
    reason: alternative_reading
  - marker: b
    text: Hebraico, literalmente, “aos filhos do meu ventre”. A expressão pode referir-se aos próprios filhos de Jó ou, de modo mais geral, a seus parentes consanguíneos próximos.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: meu hálito
  rationale: רוּחַ pode significar vento, espírito ou respiração. Neste contexto corporal e relacional, “hálito” expressa com naturalidade a respiração que causa repulsa.
- source_word: זָרָה
  choice: repugna
  rationale: A forma transmite a ideia de algo estranho, alheio ou repelente. “Repugna” torna explícito o efeito sobre a mulher de Jó sem perder o sentido contextual de afastamento.
- source_word: לְאִשְׁתִּי
  choice: à minha mulher
  rationale: A preposição ל marca a pessoa afetada; com o verbo “repugnar”, a construção idiomática em português é “repugna à minha mulher”.
- source_word: וְחַנֹּתִי
  choice: e sou repulsivo
  rationale: A forma hebraica é difícil. A tradução adotada entende o segundo membro em paralelo com o primeiro, descrevendo a repulsa causada por Jó. A leitura ligada a súplica ou pedido de favor é preservada em nota.
- source_word: לִבְנֵי
  choice: aos filhos de
  rationale: בנים significa literalmente “filhos”. A escolha mantém a transparência lexical, embora a expressão completa possa designar descendentes ou parentes consanguíneos próximos.
- source_word: בִטְנִי
  choice: meu próprio corpo
  rationale: בטן significa literalmente ventre ou barriga. Na expressão de parentesco, “meu próprio corpo” preserva a ênfase em vínculo biológico e evita sugerir literalmente que o homem Jó tenha dado à luz.
theological_decisions:
- issue: Sentido da forma difícil וְחַנֹּתִי
  choice: Entendê-la como descrição de Jó sendo repulsivo, em paralelismo com a primeira oração.
  alternative: 'Entendê-la como súplica: “minha súplica se dirige aos filhos do meu corpo” ou “imploro o favor dos filhos do meu corpo”.'
  rationale: A morfologia e o sentido exato são disputados. O paralelismo favorece a descrição de repulsa, mas a alternativa tradicional ligada a חנן é linguisticamente relevante e, por isso, não deve ser ocultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Hálito” comunica melhor que “respiração” o aspecto corporal desagradável; “minha mulher” é natural e direto. A expressão idiomática hebraica foi parcialmente esclarecida no texto, enquanto sua forma literal e sua possível abrangência familiar foram preservadas em nota.
