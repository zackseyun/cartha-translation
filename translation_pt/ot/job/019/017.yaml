  naturalness: «Meu hálito repugna à minha mulher» é gramatical, mas soa mais abstrato e menos natural do que «Minha mulher sente repulsa do meu hálito». «Me causam nojo» é claro, idiomático e mantém o tom de humilhação do lamento.
  terminology: «Hálito», «minha mulher» e «filhos do meu próprio corpo» são adequados. A nota a deve refletir a incerteza de וחנתי sem apresentar a alternativa como se fosse uma tradução literalmente inequívoca; a nota b deve ancorar a expressão «filhos do meu próprio corpo», não o fim do versículo de modo ambíguo.
