  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: pt
  text: Tenham compaixão de mim[a], tenham compaixão de mim, meus amigos, pois a mão de Deus me atingiu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham misericórdia de mim” ou “Sejam bondosos comigo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “me tocou”; neste contexto, o verbo comunica um impacto prejudicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Tenham compaixão de mim
  rationale: O imperativo plural de חנן dirige-se aos amigos de Jó e, neste contexto, pede tratamento compassivo. A formulação é natural em português e mantém o apelo interpessoal.
- source_word: חָנֻּנִי (repetido)
  choice: tenham compaixão de mim
  rationale: A repetição foi preservada para transmitir a urgência emocional e a intensificação poética do apelo de Jó.
- source_word: רֵעָי
  choice: meus amigos
  rationale: רֵעַ denota normalmente amigo ou companheiro. “Meus amigos” preserva a interpelação direta àqueles de quem Jó esperava solidariedade.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do apelo e liga as orações com dignidade e naturalidade em português.
- source_word: יַד אֱלוֹהַּ
  choice: a mão de Deus
  rationale: Preserva a metáfora hebraica comum para a ação ou o poder divino, sem a reduzir a uma expressão abstrata.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Forma poética singular para Deus, especialmente frequente em Jó; o equivalente direto não exige ampliação.
- source_word: נָגְעָה בִּי
  choice: me atingiu
  rationale: נגע com ב pode significar tocar, atingir ou afligir. No contexto do sofrimento de Jó, “me atingiu” comunica o impacto danoso sem abandonar a imagem concreta nem explicá-la em excesso.
theological_decisions:
- issue: Agência no sofrimento de Jó
  choice: pois a mão de Deus me atingiu
  alternative: pois a mão de Deus me tocou; pois a mão de Deus me afligiu
  rationale: O hebraico atribui explicitamente o sofrimento de Jó à ação divina por meio de uma expressão metafórica. A tradução mantém essa tensão sem suavizá-la nem sistematizá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural “tenham” deixa claro que Jó se dirige aos amigos; a repetição enfática e a metáfora “a mão de Deus” foram mantidas.
