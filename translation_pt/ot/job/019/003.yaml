  yaml_path: translation/ot/job/019/003.yaml
  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: pt
  text: Já por dez vezes vocês me humilham; não têm vergonha de me maltratar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de agir injustamente comigo”, “de me tratar com dureza” ou, mais literalmente, “de me tratar como um estranho”. O verbo hebraico é difícil e pode indicar que eles tratam Jó como alguém alheio ou que não reconhecem.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Já por dez vezes
  rationale: Preserva o número retórico do hebraico e expressa em português natural a ideia de repetição acumulada.
- source_word: תַּכְלִימוּנִי
  choice: vocês me humilham
  rationale: O hifil de כלם indica causar vergonha ou humilhação. O presente traduz bem a ação reiterada denunciada por Jó.
- source_word: לֹא תֵבֹשׁוּ
  choice: não têm vergonha
  rationale: Formulação corrente e direta que conserva a acusação moral do hebraico.
- source_word: תַּהְכְּרוּ לִי
  choice: me maltratar
  rationale: O verbo é lexicalmente difícil neste contexto. A escolha comunica a conduta hostil contra Jó sem apagar, por meio da nota, a possível imagem de tratá-lo como estranho.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A construção “já por dez vezes” mantém a força retórica do original sem soar artificial.
