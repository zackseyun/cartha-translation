  text: How long will you torment me and crush me with words?[a]
translation:
  language: pt
  text: Até quando vocês me atormentarão e me esmagarão com palavras?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até quando vocês afligirão a minha alma e me esmagarão com palavras?”'
    reason: Alternativa lexical que explicita נַפְשִׁי e traduz תּוֹגְיוּן de modo menos intenso.
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Até quando
  rationale: Expressão temporal idiomática de lamento; esta formulação é natural em português e preserva a força retórica.
- source_word: תּוֹגְיוּן
  choice: vocês me atormentarão
  rationale: O hifil de יגה/יגה comunica a aflição interior e persistente causada pelos interlocutores; “atormentar” conserva essa intensidade.
- source_word: נַפְשִׁי
  choice: me
  rationale: נֶפֶשׁ designa aqui a própria pessoa em seu íntimo. O pronome evita uma leitura dualista indevida de “minha alma” e produz português corrente.
- source_word: וּתְדַכְּאוּנַנִי
  choice: e me esmagarão
  rationale: דכא evoca esmagar ou quebrantar. “Esmagar” mantém a imagem forte de violência metafórica e o paralelismo.
- source_word: בְמִלִּים
  choice: com palavras
  rationale: 'O בְּ tem valor instrumental: as palavras são o meio pelo qual os amigos o esmagam.'
