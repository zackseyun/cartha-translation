  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: pt
  text: Todos os meus amigos íntimos me detestam[a], e aqueles a quem amei se voltaram contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os homens do meu conselho/segredo”. A expressão se refere ao círculo de pessoas de confiança de Jó, seus companheiros íntimos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: me detestam
  rationale: O verbo תעב expressa forte repulsa; “detestam” preserva essa intensidade em português atual e natural.
- source_word: כָּל
  choice: Todos
  rationale: O quantificador é abrangente, e “todos” é a forma natural em concordância com “amigos”.
- source_word: מְתֵי סוֹדִי
  choice: meus amigos íntimos
  rationale: A expressão literalmente indica as pessoas do círculo de conselho ou confidência de Jó; “amigos íntimos” comunica de modo claro a proximidade e a confiança implicadas.
- source_word: וְזֶה
  choice: e aqueles
  rationale: Embora זֶה tenha forma singular, aqui seu referente é entendido coletivamente à luz do verbo plural e do paralelismo; “aqueles” produz sentido natural em português.
- source_word: אָהַבְתִּי
  choice: a quem amei
  rationale: A forma verbal expressa o afeto de Jó por essas pessoas; o pretérito perfeito é natural no lamento e preserva a relação temporal sem acrescentar nuances.
- source_word: נֶהְפְּכוּ
  choice: se voltaram
  rationale: O nifal de הפך indica reversão ou mudança de disposição; “se voltaram” expressa adequadamente essa mudança.
- source_word: בִי
  choice: contra mim
  rationale: No contexto de hostilidade, a preposição בִי tem sentido adversativo, transmitido idiomaticamente por “contra mim”.
