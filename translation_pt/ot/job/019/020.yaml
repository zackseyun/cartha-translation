base_translation:
  language: en
  yaml_path: translation/ot/job/019/020.yaml
  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: pt
  text: Meus ossos[a] aderem à minha pele e à minha carne, e escapei com a pele dos meus dentes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «meu osso», no singular, provavelmente usado em sentido coletivo para toda a estrutura óssea de Jó.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «escapei por um triz». A expressão hebraica descreve uma fuga ou sobrevivência por uma margem mínima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: à minha pele e à minha carne
  rationale: As preposições com ב são expressas naturalmente em português com «a» depois de «estar colado». «Pele» e «carne» preservam o paralelismo corporal concreto.
- source_word: דָּבְקָה עַצְמִי
  choice: Os meus ossos estão colados
  rationale: דבק indica aderir ou ficar colado. Embora עַצְמִי esteja no singular, ele provavelmente tem sentido coletivo e descreve a extrema magreza de Jó; o plural é mais natural e claro em português.
- source_word: וָאֶתְמַלְּטָה
  choice: e escapei apenas
  rationale: O verbo מלט comunica escapar ou sobreviver. «Apenas» explicita a extrema limitação expressa pela imagem seguinte sem substituir essa imagem.
- source_word: בְּעוֹר שִׁנָּי
  choice: com a pele dos meus dentes
  rationale: A tradução mantém a imagem hebraica surpreendente e reproduz de perto a preposição ב. Como os dentes literalmente não têm pele, a expressão comunica uma sobrevivência por margem mínima.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O paralelismo corporal e a imagem incomum da «pele dos dentes» foram preservados; uma nota esclarece o sentido idiomático sem apagar a formulação hebraica.
