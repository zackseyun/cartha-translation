  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: pt
  text: Ele me derruba por todos os lados, e eu desapareço[a]; ele arranca a minha esperança como se arranca uma árvore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu vou” ou “e eu pereço”. O hebraico diz literalmente “e eu vou”, provavelmente expressando o resultado de Jó ser derrubado: ele desaparece ou fica arruinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: me derruba
  rationale: O verbo נתץ indica derrubar, demolir ou destruir. “Me derruba” conserva a força destrutiva e se aplica naturalmente à ruína de uma pessoa.
- source_word: סָבִיב
  choice: por todos os lados
  rationale: Expressa ação ao redor, de todos os lados, ressaltando a abrangência da destruição.
- source_word: וָאֵלַךְ
  choice: e eu desapareço
  rationale: 'Literalmente, “e eu vou”. No contexto, a expressão aponta para o resultado da destruição: Jó se vai, desaparece ou fica arruinado. A nota preserva a formulação literal e a ambiguidade.'
- source_word: וַיַּסַּע
  choice: arranca
  rationale: נסע pode indicar retirar ou puxar algo fixado. Com a comparação a uma árvore, “arranca” comunica a remoção violenta sem acrescentar explicitamente “pela raiz”, que não aparece no hebraico.
- source_word: כָּעֵץ
  choice: como se arranca uma árvore
  rationale: A formulação explicita em português a relação entre o verbo e a comparação, mantendo a imagem da árvore retirada de seu lugar.
- source_word: תִּקְוָתִי
  choice: a minha esperança
  rationale: תקוה significa esperança ou expectativa; “esperança” é a opção mais natural e adequada ao lamento de Jó.
