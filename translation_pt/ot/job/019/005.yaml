  yaml_path: translation/ot/job/019/005.yaml
  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: pt
  text: Se de fato vocês se exaltam contra mim[a] e usam a minha desonra como prova contra mim[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se fazem grandes sobre mim”. O verbo hebraico pode indicar que alguém se exalta sobre outra pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “argumentam contra mim com a minha desonra” ou “apresentam a minha desonra como prova contra mim”. O verbo hebraico pode ter sentido forense de provar ou fundamentar uma acusação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: Se de fato
  rationale: Preserva tanto a condição introduzida por אִם como a ênfase de אָמְנָם, em português natural e atual.
- source_word: עָלַי
  choice: contra mim
  rationale: Nos dois casos, a preposição expressa oposição hostil; a repetição foi mantida para refletir a estrutura enfática do hebraico.
- source_word: תַּגְדִּילוּ
  choice: vocês se engrandecem
  rationale: Conserva a imagem verbal de tornar-se grande ou exaltar-se diante de outra pessoa, sem reduzir o sentido simplesmente a vangloriar-se.
- source_word: וְתוֹכִיחוּ
  choice: e apresentam ... como prova
  rationale: Expressa de maneira clara o valor forense do hifil de יכח, que pode indicar provar, demonstrar ou sustentar uma acusação.
- source_word: חֶרְפָּתִי
  choice: a minha desonra
  rationale: Comunica o opróbrio e a humilhação social sofridos por Jó; é mais corrente do que “meu opróbrio” e evita sugerir apenas um sentimento interior de vergonha.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A formulação preserva a condição, a repetição de “contra mim” e a linguagem forense do hebraico, enquanto as notas registram alternativas lexicais genuínas.
