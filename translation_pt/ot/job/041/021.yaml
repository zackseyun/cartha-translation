  text: A clava[a] é considerada como palha[b], e ele ri do estrondo da lança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma arma de arremesso” ou “um projétil é considerado como palha”; o termo hebraico תוֹתָח é raro, e seu sentido exato é incerto.
