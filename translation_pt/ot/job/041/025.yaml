lexical_decisions:
- source_word: אֵין
  choice: não há ninguém
  rationale: A partícula existencial negativa introduz uma negação absoluta; esta formulação é natural em português.
- source_word: עַל עָפָר
  choice: sobre a terra
  rationale: Embora עָפָר possa significar literalmente “pó” ou “solo”, aqui a expressão abrange o domínio terrestre.
- source_word: מָשְׁלוֹ
  choice: igual a ele
  rationale: No contexto, מָשָׁל expressa comparação ou equivalência; “igual a ele” é mais claro do que uma formulação que poderia sugerir mera semelhança.
- source_word: הֶעָשׂוּ
  choice: feito
  rationale: Forma passiva de עשה que descreve o ser como feito ou criado.
- source_word: לִבְלִי
  choice: para não ter
  rationale: A construção indica ausência e pode também sugerir finalidade ou resultado; a formulação conserva essa nuance.
- source_word: חָת
  choice: medo
  rationale: O termo denota pavor, terror ou medo; “medo” é claro e corrente, enquanto a nota registra a alternativa mais intensa.
