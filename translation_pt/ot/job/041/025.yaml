  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: pt
  text: Sobre a terra, não há igual a ele[a], feito sem medo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há ninguém semelhante a ele”. O termo hebraico pode indicar semelhança ou igualdade neste contexto.'
