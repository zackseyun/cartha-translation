base_translation:
  language: en
  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: pt
  text: Seu coração é duro como pedra[a], duro como a pedra inferior do moinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “firme como pedra”. O verbo hebraico está ligado literalmente a algo derramado ou fundido e, por isso, rígido ou sólido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: seu coração
  rationale: לֵב designa o coração como centro interior do pensamento, da vontade e da disposição; “coração” preserva a imagem poética e é natural em português.
- source_word: יָצוּק
  choice: é duro
  rationale: O verbo יצק significa literalmente “derramar” ou “fundir”; nesta construção passiva, descreve algo fundido e, portanto, rígido, sólido ou duro. “É duro” comunica naturalmente o sentido no contexto.
- source_word: כְּמוֹ אָבֶן
  choice: como pedra
  rationale: Mantém de forma direta e idiomática a comparação concreta do hebraico.
- source_word: וְיָצוּק
  choice: duro
  rationale: A repetição do predicado reforça a descrição e preserva o paralelismo poético.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: como a pedra inferior do moinho
  rationale: Neste contexto, פֶלַח תַּחְתִּית refere-se à pedra de baixo do moinho, conhecida por seu peso e dureza. A formulação evita a possível falta de familiaridade de “mó inferior” sem perder precisão.
