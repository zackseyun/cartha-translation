  source_fidelity: O texto traduz adequadamente לִבּוֹ como “Seu coração” e reproduz o paralelismo das duas ocorrências de יָצוּק com “é duro ... duro”. “Como pedra” corresponde a כְּמוֹ אָבֶן, e “como a pedra inferior do moinho” comunica com precisão acessível a imagem de כְּפֶלַח תַּחְתִּית, isto é, a pedra inferior da mó.
