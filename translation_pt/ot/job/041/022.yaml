lexical_decisions:
- source_word: תַּחְתָּיו
  choice: Debaixo dele
  rationale: Preserva o sentido espacial da preposição com sufixo masculino singular e soa natural em português moderno.
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: pontas afiadas de cerâmica
  rationale: Expressa a construção que combina objetos ou pontas cortantes com cerâmica, evocando fragmentos de barro quebrado sem depender do termo menos corrente 'cacos' como única leitura.
- source_word: יִרְפַּד
  choice: ele se estende
  rationale: O verbo pode indicar estender, dispor ou formar uma camada/leito; a forma reflexiva comunica naturalmente a ação do Leviatã no contexto, embora a construção admita outra análise.
- source_word: חָרוּץ
  choice: trilho de debulhar
  rationale: Designa aqui, provavelmente, um instrumento agrícola cortante usado na debulha. 'Trilho de debulhar' é concreto e historicamente adequado.
- source_word: עֲלֵי טִיט
  choice: sobre a lama
  rationale: Mantém a relação espacial da preposição e traduz טִיט pelo termo corrente 'lama', adequado à imagem física.
