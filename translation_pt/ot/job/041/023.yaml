base_translation:
  language: en
  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: pt
  text: Faz as profundezas ferverem como uma panela; torna o mar semelhante a uma mistura de perfumista[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um unguento” ou “como uma mistura aromática”. O termo hebraico indica uma mistura preparada, muitas vezes associada a unguentos ou perfumes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: faz ... ferverem
  rationale: 'O hifil de רתח expressa ação causativa: fazer algo ferver ou borbulhar. A formulação é natural em português e preserva essa força.'
- source_word: כַּסִּיר
  choice: como uma panela
  rationale: סִיר designa um recipiente usado para cozinhar. “Panela” é claro, corrente e mantém a comparação concreta.
- source_word: מְצוּלָה
  choice: as profundezas
  rationale: מְצוּלָה refere-se às profundezas, especialmente às águas profundas do mar. O plural idiomático em português preserva a imagem poética e o paralelismo com “o mar”.
- source_word: יָם
  choice: o mar
  rationale: יָם significa normalmente “mar”; a tradução direta conserva a imagem concreta.
- source_word: יָשִׂים
  choice: torna ... semelhante a
  rationale: Embora שׂים costume significar “pôr” ou “colocar”, nesta construção comparativa tem o sentido de fazer com que algo seja ou pareça como outra coisa. A escolha explicita a comparação sem eliminar sua força poética.
- source_word: כַּמֶּרְקָחָה
  choice: semelhante a uma mistura de perfumista
  rationale: מֶרְקָחָה indica uma mistura preparada ou composta, frequentemente relacionada a perfumes ou unguentos. “Mistura de perfumista” preserva a ideia de composição e evita acrescentar ao hebraico uma segunda panela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poeticamente digno. A estrutura paralela dos dois membros foi mantida; a repetição mecânica de “faz” foi evitada com “torna”, sem alterar o sentido causativo. A ambiguidade de מֶרְקָחָה foi preservada em nota.
