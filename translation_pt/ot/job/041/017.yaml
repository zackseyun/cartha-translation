  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: pt
  text: Quando ele se ergue, os poderosos[a] ficam com medo; diante do estrondo[b], ficam fora de si.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os deuses”; o termo também pode designar seres poderosos ou homens valentes.'
    reason: Preserva a ambiguidade lexical de אֵלִים.
  - marker: b
    text: 'Ou: “diante das quebras” ou “das ondas que se quebram”.'
    reason: Registra a imagem concreta e as alternativas possíveis do plural שְׁבָרִים.
  - marker: c
    text: O sentido do verbo hebraico aqui é incerto; também pode indicar que eles perdem o rumo ou recuam aterrorizados.
    reason: Sinaliza a dificuldade da forma rara יִתְחַטָּאוּ sem impor uma interpretação única.
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Quando ele se ergue
  rationale: Expressa naturalmente a ideia temporal/causal de seu levantar-se, preservando a referência ao monstro descrito no contexto.
- source_word: אֵלִים
  choice: os poderosos
  rationale: Embora a forma possa significar literalmente “deuses”, no contexto designa seres de grande poder ou homens valentes que, apesar da força, sentem medo.
- source_word: מִשְּׁבָרִים
  choice: diante do estrondo
  rationale: O plural pode evocar quebras, impactos ou ondas que se quebram; “estrondo” comunica o efeito aterrador sem especificar além do texto.
- source_word: יִתְחַטָּאוּ
  choice: ficam fora de si
  rationale: A forma verbal é rara e difícil neste contexto; a tradução comunica perda de domínio ou orientação sob o terror, sem tratá-la como o sentido comum de purificação.
theological_decisions:
- issue: Identidade dos אֵלִים
  choice: os poderosos
  alternative: os deuses
  rationale: O contexto poético ressalta que até os mais fortes se apavoram; traduzir “os deuses” poderia introduzir uma afirmação ontológica que o verso não exige, enquanto a nota preserva a leitura literal possível.
translation_notes:
  register: Português atual, digno e de leitura ampla no Brasil. A construção paralela mantém a concisão e a intensidade poética do hebraico; “ficam fora de si” é idiomático e compreensível, enquanto as notas conservam as ambiguidades relevantes.
