translation:
  language: pt
  text: Ele olha para tudo o que é alto[a]; ele é rei sobre todos os filhos do orgulho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os altivos”; literalmente, na segunda linha, “todos os filhos do orgulho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: para tudo o que é altivo
  rationale: אֵת marca o objeto de יִרְאֶה, e a expressão כָּל גָּבֹהַּ abrange tudo ou todos os que são elevados. “Altivo” conserva tanto a imagem de elevação quanto sua possível conotação de soberba.
- source_word: יִרְאֶה
  choice: olha
  rationale: O verbo ראה significa “ver”. Aqui, “olha para” é natural em português e pode sugerir que ele encara sem temor tudo o que é altivo.
- source_word: הוּא
  choice: é
  rationale: O pronome independente realça o sujeito. Em português, a continuidade do sujeito e a estrutura paralela permitem expressar essa ênfase sem repetir “ele” de modo pesado.
- source_word: מֶלֶךְ עַל
  choice: rei sobre
  rationale: Mantém diretamente a metáfora régia e a ideia de supremacia ou domínio.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: todos os filhos do orgulho
  rationale: Preserva a expressão hebraica metafórica e sua abrangência, sem restringi-la a feras, seres humanos ou poderes cósmicos.
theological_decisions:
- issue: Sentido de “todos os filhos do orgulho”
  choice: Manter a designação poética para todos os seres caracterizados pelo orgulho, apresentando o Leviatã como rei sobre eles.
  alternative: Especificar feras ferozes ou poderes cósmicos orgulhosos.
  rationale: O hebraico não identifica uma classe única. A formulação literal preserva a ambiguidade poética e a tensão teológica.
- issue: Sentido de גָּבֹהַּ
  choice: Traduzir por “altivo”, permitindo o sentido simultâneo de elevado e orgulhoso.
  alternative: Traduzir apenas por “alto” ou explicitar “os orgulhosos”.
  rationale: O contexto aproxima a altura da soberba, especialmente pelo paralelo com שָׁחַץ, mas não exige eliminar a imagem concreta de elevação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção poética concisa. “Altivo” preserva melhor que “alto” a ligação contextual com o orgulho, enquanto a nota registra a possível leitura coletiva.
