  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: pt
  text: Quem primeiro me deu algo[a], para que eu lhe retribua? Tudo o que há debaixo de todos os céus é meu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Quem me precedeu, para que eu lhe retribua?” O verbo hebraico pode significar “preceder” ou “antecipar-se”, mas aqui provavelmente se refere a dar ou beneficiar primeiro, colocando o outro sob obrigação de retribuir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; “Quem” preserva sua força sem acrescentar ênfase ausente no hebraico.
- source_word: הִקְדִּימַנִי
  choice: primeiro me deu alguma coisa
  rationale: O hifil de קדם com sufixo de primeira pessoa pode significar literalmente “adiantou-se a mim” ou “precedeu-me”; ligado a “retribuir”, indica aqui dar ou beneficiar primeiro, como se Deus pudesse ficar obrigado a retribuir.
- source_word: וַאֲשַׁלֵּם
  choice: para que eu tenha de retribuir
  rationale: No contexto da pergunta retórica, expressa a consequência da ação anterior. “Tenha de” torna clara a ideia de obrigação implícita, sem transformar a forma verbal em uma promessa futura.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: debaixo de todos os céus
  rationale: Reproduz de modo natural e digno o plural hebraico e abrange toda a ordem criada sob os céus.
- source_word: לִי הוּא
  choice: é meu
  rationale: Expressa de modo conciso a posse enfaticamente afirmada no hebraico, no qual o pronome dativo vem em destaque.
theological_decisions:
- issue: Dívida divina e domínio sobre a criação
  choice: A pergunta nega retoricamente que alguém possa dar primeiro a Deus e, assim, obrigá-lo a retribuir; a frase seguinte afirma que tudo sob os céus lhe pertence.
  alternative: 'Traduzir de modo mais formal: “Quem me precedeu, para que eu retribua?”'
  rationale: A ligação entre הִקְדִּימַנִי e וַאֲשַׁלֵּם favorece o sentido de benefício anterior que criaria uma obrigação. A nota conserva, porém, a possibilidade lexical mais literal, sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo argumentativo e conserva em nota a ambiguidade lexical de הִקְדִּימַנִי.
