base_translation:
  language: en
  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: pt
  text: 'Em seu pescoço a força se aloja,

    e diante dele salta o pavor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e diante dele salta a consternação”. O substantivo hebraico דְּאָבָה é raro e, neste contexto poético, pode expressar desde abatimento ou consternação até pavor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: Em seu pescoço
  rationale: A preposição ב com צַוָּאר e o sufixo de terceira pessoa masculina singular tem sentido locativo; a formulação preserva a imagem da força instalada no pescoço.
- source_word: יָלִין
  choice: se aloja
  rationale: O verbo לין significa literalmente passar a noite ou alojar-se. Aqui personifica a força como presença estabelecida, imagem que 'se aloja' conserva em português natural.
- source_word: עֹז
  choice: a força
  rationale: Equivalente direto e corrente para o substantivo que denota força ou poder.
- source_word: וּלְפָנָיו
  choice: diante dele
  rationale: Expressa naturalmente em português o valor idiomático de 'à sua frente' ou 'perante ele'.
- source_word: תָּדוּץ
  choice: salta
  rationale: O verbo raro דוץ comunica a ideia de saltar ou dar pulos. 'Salta' mantém a personificação poética sem a conotação positiva que 'dança' poderia sugerir.
- source_word: דְּאָבָה
  choice: o pavor
  rationale: O substantivo raro pode indicar abatimento, consternação ou terror. No contexto da figura ameaçadora que avança, 'pavor' é natural, mas a nota preserva a amplitude lexical.
