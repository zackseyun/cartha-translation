  source_fidelity: 'A tradução reproduz com fidelidade os dois membros poéticos do hebraico: a força como presença estabelecida no pescoço e a emoção negativa personificada que salta diante dele. «Em seu pescoço» reflete adequadamente o valor locativo de בְּצַוָּארוֹ; «se aloja» conserva a imagem verbal de יָלִין; e «diante dele salta» corresponde diretamente a וּלְפָנָיו תָּדוּץ.'
