lexical_decisions:
- source_word: יַחְשֹׁב
  choice: considera
  rationale: O verbo expressa avaliação ou atribuição de valor; «considera» é natural e preserva a ideia de que o Leviatã trata materiais resistentes como insignificantes.
- source_word: לְתֶבֶן
  choice: como palha
  rationale: תֶּבֶן normalmente designa palha; a preposição לְ tem aqui valor comparativo.
- source_word: בַּרְזֶל
  choice: ferro
  rationale: É a designação comum e direta desse metal.
- source_word: לְעֵץ רִקָּבוֹן
  choice: como madeira podre
  rationale: A expressão é literalmente «como madeira de podridão/decomposição»; «madeira podre» reproduz a imagem de fragilidade em português corrente.
- source_word: נְחוּשָׁה
  choice: bronze
  rationale: O termo pode indicar cobre ou bronze; neste contexto de materiais resistentes, «bronze» é a tradução convencional e provável.
