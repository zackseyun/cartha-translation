  text: Não me calarei a respeito de seus membros[a], de sua força poderosa e da beleza de sua forma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não ficarei calado a respeito de suas partes, de seus poderes e da beleza de sua disposição.”'
