lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Não deixarei de falar
  rationale: 'Expressa naturalmente em português a ideia do hifil de חרשׁ neste contexto: não se abster de falar, preservando a resolução na primeira pessoa.'
- source_word: בַּדָּיו
  choice: seus membros
  rationale: בַּד pode designar partes ou membros do corpo; no contexto da descrição do Leviatã, “membros” é concreto, digno e anatomicamente apropriado.
- source_word: דְבַר
  choice: falar de
  rationale: A construção introduz o assunto sobre o qual o falante não ficará calado. A formulação verbal evita uma expressão artificial como “o relato de” e mantém o sentido contextual.
- source_word: גְּבוּרוֹת
  choice: sua grande força
  rationale: Embora o plural possa indicar poderes ou feitos poderosos, aqui a descrição física do Leviatã favorece a noção de força extraordinária.
- source_word: חִין
  choice: beleza
  rationale: חִין pode significar graça, encanto ou beleza. Neste contexto estético, “beleza” é claro e natural, sem sugerir indevidamente o sentido teológico de graça.
- source_word: עֶרְכּוֹ
  choice: sua estrutura
  rationale: Derivado de ערך, o termo aponta para disposição ou ordenação. “Estrutura” comunica de modo natural a constituição ordenada do corpo, preservando a possibilidade de referência à sua forma ou proporções.
