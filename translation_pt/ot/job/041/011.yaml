lexical_decisions:
- source_word: מִפִּיו
  choice: Da sua boca
  rationale: Traduz naturalmente a preposição מִן com פֶּה e o sufixo masculino singular. Em português, “sua” mantém a referência ao Leviatã sem forçar uma distinção entre pessoa e animal.
- source_word: לַפִּידִים
  choice: tochas
  rationale: Preserva a imagem concreta de objetos ardentes; “chamas” seria possível, mas menos específico.
- source_word: יַהֲלֹכוּ
  choice: saem
  rationale: Embora o verbo tenha o sentido básico de “andar/ir”, neste contexto descreve aquilo que procede da boca; “saem” é natural e conserva o movimento para fora.
- source_word: כִּידֹדֵי אֵשׁ
  choice: faíscas de fogo
  rationale: A expressão rara e debatida parece designar emissões ou projéteis ardentes. “Faíscas de fogo” se ajusta ao paralelismo, sem impor uma imagem bélica excessivamente específica.
- source_word: יִתְמַלָּטוּ
  choice: irrompem
  rationale: O sentido básico envolve escapar ou soltar-se; aqui, “irrompem” comunica a saída súbita e vigorosa das faíscas.
