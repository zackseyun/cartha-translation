translation:
  language: pt
  text: Da sua boca saem tochas; faíscas de fogo[a] irrompem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tições” ou “dardos flamejantes”; a expressão hebraica é rara.'
