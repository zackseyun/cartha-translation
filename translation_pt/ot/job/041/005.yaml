  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: pt
  text: Quem expôs a frente de sua veste? Quem pode entrar em seu freio duplo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem pode entrar na dobra de seu freio?” A expressão hebraica é difícil; pode referir-se metaforicamente à boca ou às mandíbulas do Leviatã, talvez a uma fileira dupla de dentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: descobriu
  rationale: O verbo significa revelar, descobrir ou deixar exposto. “Descobriu” preserva a imagem concreta sem especificar indevidamente que a cobertura foi arrancada.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: a parte da frente de sua veste
  rationale: Traduz concretamente a expressão “face/frente de sua veste”, mantendo a metáfora da cobertura exterior do Leviatã sem substituí-la por “pele” ou “escamas”.
- source_word: בְּכֶפֶל
  choice: por entre sua dupla
  rationale: כפל indica duplicidade, dobra ou algo dobrado. “Por entre sua dupla” conserva a obscuridade da imagem e sugere acesso ao espaço interior sem decidir entre dobra, mandíbula ou fileira dupla.
- source_word: רִסְנוֹ
  choice: rédea
  rationale: רסן designa rédea, freio ou cabresto. “Rédea” mantém a metáfora do equipamento de controle aplicado à região da boca, embora o referente exato seja incerto.
- source_word: מִי יָבוֹא
  choice: Quem pode entrar
  rationale: A pergunta retórica expressa desafio ou impossibilidade. “Pode entrar” comunica capacidade e combina naturalmente com a preposição e a imagem de acesso à boca.
