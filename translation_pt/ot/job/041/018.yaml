  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: pt
  text: A espada que o alcança não prevalece[a]; nem a lança, nem o dardo[b], nem a javelina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A espada que o alcança não se sustenta”. A expressão hebraica diz literalmente que a espada “não fica de pé”.'
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos traduzidos como “dardo” e “javelina” são raros e de sentido incerto. Para o primeiro, outras possibilidades incluem “projétil” ou “haste”; para o segundo, “cota de malha” ou “armadura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: que o alcança
  rationale: O verbo נשׂג/השיג pode significar “alcançar”, “atingir” ou “alcançar em perseguição”. Aqui, modifica “espada”; “que o alcança” preserva a força verbal sem afirmar que ela o fere.
- source_word: חֶרֶב
  choice: a espada
  rationale: Termo comum para espada. O artigo em português apresenta de modo natural a classe de arma no contexto poético.
- source_word: בְּלִי תָקוּם
  choice: não prevalece
  rationale: A expressão literalmente comunica que a espada “não fica de pé” ou “não se sustenta”. “Não prevalece” transmite em português corrente que ela não tem eficácia contra ele, enquanto a nota preserva a imagem hebraica.
- source_word: חֲנִית
  choice: lança
  rationale: Equivalente comum e acessível para uma arma de haste usada para golpear ou arremessar.
- source_word: מַסָּע
  choice: dardo
  rationale: O substantivo é raro e incerto, mas no contexto parece designar uma arma lançada ou projetada. “Dardo” se ajusta à sequência de armas; outras possibilidades são registradas em nota.
- source_word: וְשִׁרְיָה
  choice: javali
  rationale: Neste contexto, ao lado de espada, lança e outra arma, o sentido de arma pontiaguda é plausível. “Javali” é o nome tradicional português de uma lança curta ou arma de arremesso; a possibilidade de “cota de malha” ou “armadura” permanece na nota devido à incerteza lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética concisa. “Javali” é empregado em seu sentido menos comum de arma, não do animal; a nota explicita a incerteza do termo hebraico.
