  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: pt
  text: Seus espirros fazem brilhar a luz[a], e seus olhos são como as pálpebras da alvorada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus espirros lançam clarões”. O verbo hebraico é causativo (“fazem a luz brilhar”), e a expressão é intensamente poética.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como as pálpebras da alvorada”, imagem poética hebraica para a primeira luz do dia que começa a se abrir.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: seus espirros
  rationale: O substantivo derivado de עטש designa espirros. A tradução concreta preserva a imagem vívida; “bufos” seria possível no contexto poético, mas é menos diretamente ligado ao sentido do lema.
- source_word: תָּהֶל
  choice: fazem brilhar
  rationale: A forma causativa expressa a produção ou irradiação de luz. “Fazem brilhar” mantém esse valor causativo e soa natural em português.
- source_word: אוֹר
  choice: a luz
  rationale: É o sentido direto e transparente do substantivo; o artigo torna a construção verbal natural em português sem alterar a imagem.
- source_word: וְעֵינָיו
  choice: e seus olhos
  rationale: Tradução direta da conjunção seguida do substantivo com sufixo possessivo de terceira pessoa masculina singular.
- source_word: כְּעַפְעַפֵּי
  choice: como as pálpebras da
  rationale: O termo significa literalmente “pálpebras”. A formulação conserva a metáfora hebraica, em vez de substituí-la pela interpretação “primeiros raios”.
- source_word: שָׁחַר
  choice: alvorada
  rationale: “Alvorada” comunica com naturalidade o começo luminoso do dia e combina dignidade poética com ampla compreensão em português.
