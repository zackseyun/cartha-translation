base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: pt
  text: Eis que sua esperança é frustrada[a]; não se fica abatido só de vê-lo[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sua esperança se revela falsa» ou «sua confiança falha». O verbo hebraico pode indicar que a esperança se revela falsa, ilusória ou frustrada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não se é derrubado à vista dele?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz com ênfase a afirmação e preserva o tom elevado e poético do hebraico.
- source_word: תֹּחַלְתּוֹ
  choice: sua esperança
  rationale: Expressa diretamente a ideia de esperança ou expectativa sem restringir a ambiguidade do substantivo.
- source_word: נִכְזָבָה
  choice: se mostra enganosa
  rationale: 'Reflete o sentido resultativo de כזב: a esperança revela-se falsa, ilusória ou frustrante.'
- source_word: הֲגַם
  choice: não ... até mesmo
  rationale: A pergunta retórica em português comunica a força interrogativa, enquanto «até mesmo» preserva a intensificação aditiva.
- source_word: אֶל מַרְאָיו
  choice: à vista dele
  rationale: Tradução natural da reação provocada por sua aparência, sem acrescentar explicitamente «mera» ao texto principal.
- source_word: יֻטָל
  choice: se fica abatido
  rationale: Preserva a passividade do hophal e admite tanto a ideia de ser derrubado quanto a de sucumbir de medo.
theological_decisions: []
