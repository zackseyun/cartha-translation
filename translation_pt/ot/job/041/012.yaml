base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: pt
  text: De suas narinas sai fumaça, como de uma panela[a] fervente sobre juncos em chamas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caldeirão”. O termo hebraico דּוּד pode designar uma panela ou um recipiente maior, semelhante a um caldeirão.
    reason: lexical_alternative
  - marker: b
    text: Os juncos provavelmente são mencionados como combustível, contribuindo para a imagem de fumaça produzida por um fogo intenso.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: de suas narinas
  rationale: O substantivo נְחִירַיִם designa as narinas; a preposição מִן e o sufixo de terceira pessoa masculina singular resultam naturalmente em “de suas narinas”, preservando a imagem corporal vívida.
- source_word: יֵצֵא
  choice: sai
  rationale: O imperfeito de יצא descreve aqui uma ação característica. “Sai” é direto e natural em português.
- source_word: עָשָׁן
  choice: fumaça
  rationale: Equivalente comum e preciso de עָשָׁן neste contexto.
- source_word: כְּדוּד
  choice: como de uma panela
  rationale: דּוּד pode indicar uma panela ou um recipiente maior semelhante a um caldeirão. “Panela” é mais acessível no texto principal; a construção “como de” torna explícita, de modo natural em português, a origem da fumaça pressuposta pela comparação.
- source_word: נָפוּחַ
  choice: fervente
  rationale: O particípio sugere algo soprado, atiçado ou intensamente aquecido. No contexto de uma panela que produz fumaça, “fervente” comunica de modo idiomático o resultado da ação, sem sobrecarregar o verso.
- source_word: וְאַגְמֹן
  choice: e de juncos em chamas
  rationale: אַגְמוֹן designa junco ou vegetação semelhante. A imagem provavelmente é a de juncos empregados como combustível; “em chamas” explicita o calor pressuposto pelo contexto, enquanto a nota registra essa dimensão cultural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da imagem hebraica foi preservada, mas a elipse foi suavemente explicitada por “como de”. Os marcadores foram posicionados junto aos termos que explicam.
