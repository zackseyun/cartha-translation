  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: pt
  text: Atrás dele, uma trilha resplandece[a]; pensa-se que o abismo está encanecido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois dele, uma trilha resplandece.” O hebraico pode indicar sucessão temporal (“depois dele”) ou posição espacial (“atrás dele”); o contexto do rastro na água favorece “atrás dele”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “considera-se o abismo como grisalho” ou “como cabeleira branca”. A imagem é a da espuma que faz o mar parecer encanecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Atrás dele
  rationale: A expressão pode indicar sucessão espacial ou temporal. No contexto do rastro deixado pelo Leviatã na água, o sentido espacial é o mais provável, sem apagar a alternativa em nota.
- source_word: יָאִיר
  choice: resplandece
  rationale: O hifil de אור expressa dar luz ou brilhar; aqui descreve poeticamente a luminosidade do rastro espumoso.
- source_word: נָתִיב
  choice: uma vereda
  rationale: O substantivo designa caminho, trilha ou senda. “Vereda” mantém a metáfora poética de um caminho aberto sobre as águas.
- source_word: יַחְשֹׁב
  choice: quem a vê pensaria
  rationale: Embora a forma seja gramaticalmente masculina singular, pode ter valor impessoal. A formulação portuguesa comunica a impressão de um observador sem identificar um sujeito específico.
- source_word: תְּהוֹם
  choice: as águas profundas
  rationale: O termo designa a profundeza ou as águas profundas. Esta escolha é clara em português corrente e conserva a referência aquática do contexto.
- source_word: לְשֵׂיבָה
  choice: têm cabelos brancos
  rationale: O substantivo pode significar cabelos brancos, velhice ou brancura encanecida. A imagem personifica as águas cobertas de espuma, como se tivessem embranquecido.
