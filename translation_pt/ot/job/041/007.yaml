  yaml_path: translation/ot/job/041/007.yaml
  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: pt
  text: Seu orgulho são as fileiras de escudos, cerradas como por um selo bem ajustado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Suas majestosas fileiras de escudos estão bem cerradas, como por um selo bem ajustado.”'
    reason: Registra a possibilidade de גַּאֲוָה qualificar a imponência das fileiras, em vez de funcionar como o predicado nominal “seu orgulho”, e explicita a força comparativa ou elíptica de חוֹתָם צָר.
lexical_decisions:
- source_word: גַּאֲוָה
  choice: Seu orgulho
  rationale: Conserva o substantivo hebraico e a construção nominal abrupta, permitindo tanto a ideia de imponência quanto a de motivo de orgulho.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: as fileiras de escudos
  rationale: No contexto da descrição das escamas protetoras do Leviatã, אֲפִיקֵי indica linhas ou fileiras, e מָגִנִּים as compara a escudos.
- source_word: סָגוּר
  choice: fechadas
  rationale: Reproduz a ideia de estarem cerradas, sem abertura entre elas; a concordância em português segue 'fileiras'.
- source_word: חוֹתָם צָר
  choice: com um selo apertado
  rationale: Mantém a imagem literal de um selo firmemente ajustado; 'apertado' expressa צָר sem substituir a metáfora por mera intensidade adverbial.
theological_decisions:
- issue: Referente e função de גַּאֲוָה
  choice: '''Seu orgulho são as fileiras de escudos'''
  alternative: '''Suas orgulhosas fileiras de escudos'''
  rationale: A sintaxe hebraica pode ser entendida como uma oração nominal, na qual as fileiras são o orgulho ou a imponência da criatura. A tradução evita transformar com certeza o substantivo em adjetivo.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. A imagem dos escudos e do selo foi preservada, e a ambiguidade sintática principal foi indicada em nota.
