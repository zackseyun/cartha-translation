lexical_decisions:
- source_word: דַּלְתֵי
  choice: portas
  rationale: Preserva o plural concreto e a metáfora poética hebraica; “mandíbulas” explicaria a imagem, mas seria mais interpretativo.
- source_word: פָנָיו
  choice: seu rosto
  rationale: Mantém o sentido lexical comum e a imagem incomum do hebraico, enquanto o contexto indica a região da boca.
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo padrão que introduz uma pergunta retórica.
- source_word: פִתֵּחַ
  choice: abriu
  rationale: Traduz diretamente o perfeito retórico. “Pode abrir” explicitaria uma ideia de capacidade que o contexto sugere, mas que a forma hebraica não declara diretamente.
- source_word: סְבִיבוֹת
  choice: Ao redor de
  rationale: Expressa naturalmente em português aquilo que circunda os dentes.
- source_word: שִׁנָּיו
  choice: seus dentes
  rationale: Corresponde ao sentido básico do substantivo; “presas” intensificaria a imagem além do valor lexical.
- source_word: אֵימָה
  choice: terror
  rationale: Termo forte e conciso, adequado à oração nominal culminante e ao sentido de pavor intenso.
