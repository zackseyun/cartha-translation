  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: pt
  text: Seu sopro incendeia brasas[a], e uma chama sai de sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sua alma” ou “Sua garganta incendeia brasas”. O substantivo hebraico נֶפֶשׁ pode significar “alma”, “vida”, “garganta” ou, por extensão neste contexto, “sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: seu sopro
  rationale: Embora נֶפֶשׁ possa significar “alma”, “vida” ou “garganta”, neste contexto poético e fisiológico, em paralelo com “de sua boca”, “sopro” comunica naturalmente a imagem da expiração ardente.
- source_word: גֶּחָלִים
  choice: brasas
  rationale: O substantivo designa carvões em brasa ou brasas; “brasas” é conciso, natural e adequado à imagem de algo que se incendeia.
- source_word: תְּלַהֵט
  choice: incendeia
  rationale: A forma intensiva/causativa de להט indica fazer arder ou abrasar; “incendeia” preserva essa força em português atual.
- source_word: וְלַהַב
  choice: e uma chama
  rationale: לַהַב é um substantivo singular, “chama”; o artigo indefinido produz uma construção natural em português e mantém a imagem singular.
- source_word: מִפִּיו
  choice: de sua boca
  rationale: Tradução direta e idiomática da preposição מִן com “boca” e o sufixo possessivo.
- source_word: יֵצֵא
  choice: sai
  rationale: O verbo יָצָא significa sair; “sai de sua boca” é direto, natural e preserva o paralelismo poético.
