  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: pt
  text: O filho do arco não o põe em fuga[a]; para ele, as pedras de funda se tornam como restolho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o filho do arco”, isto é, um arqueiro ou homem armado de arco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: não o põe em fuga
  rationale: O hifil de ברח com sufixo de objeto masculino singular expressa fazer alguém fugir. “Pôr em fuga” preserva de modo natural a força causativa no contexto da ineficácia das armas contra o Leviatã.
- source_word: בֶן קָשֶׁת
  choice: o filho do arco
  rationale: 'A tradução formal preserva a imagem marcante do idioma hebraico, enquanto a nota esclarece seu sentido provável: arqueiro ou homem armado de arco.'
- source_word: לְקַשׁ
  choice: palha
  rationale: קשׁ designa palha ou restolho seco. “Palha” é corrente em português e comunica algo leve e insignificante diante do Leviatã.
- source_word: נֶהְפְּכוּ לוֹ
  choice: para ele, ... se tornam
  rationale: O nifal de הפך indica mudança de estado ou condição. A construção “para ele, ... se tornam” conserva a relação expressa por לוֹ sem interpretar o verbo apenas como percepção subjetiva.
- source_word: אַבְנֵי קָלַע
  choice: pedras de funda
  rationale: A expressão em estado construto refere-se às pedras usadas como projéteis numa funda; “pedras de funda” é clara e natural em português.
