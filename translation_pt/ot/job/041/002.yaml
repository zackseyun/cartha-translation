  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: pt
  text: Ninguém é tão feroz que ouse provocá-lo[a]. Quem, então, poderia permanecer de pé diante de mim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o desperte”. O verbo hebraico significa “despertar” ou “incitar”; aqui, refere-se a provocar o Leviatã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Ninguém é tão feroz
  rationale: A partícula negativa com o adjetivo forma, no contexto, uma afirmação idiomática sobre a inexistência de alguém suficientemente feroz; “feroz” preserva o sentido de dureza e destemor sem moralizá-lo como “cruel”.
- source_word: כִּי יְעוּרֶנּוּ
  choice: que ouse provocá-lo
  rationale: O verbo עור significa despertar ou incitar. Aqui, despertar o Leviatã implica provocá-lo; “ouse” explicita naturalmente em português a força retórica da falta de coragem, sem alterar o referente pronominal.
- source_word: וּמִי הוּא
  choice: Quem, então
  rationale: A conjunção e o interrogativo introduzem a conclusão inferencial do argumento. O pronome enfático hebraico não requer a forma pouco natural “quem é ele que” em português.
- source_word: לְפָנַי יִתְיַצָּב
  choice: poderia permanecer de pé diante de mim
  rationale: O hitpael de יצב expressa colocar-se ou manter-se em posição. A formulação comunica a ideia de conseguir sustentar-se diante de Deus e preserva “diante de mim” para לְפָנַי.
theological_decisions:
- issue: Relação entre a referência ao Leviatã e a pergunta sobre quem pode estar diante de Deus
  choice: 'A segunda oração passa do Leviatã para Deus: se ninguém ousa provocar a criatura, muito menos alguém pode permanecer diante do Criador.'
  alternative: Entender as duas orações como referências apenas ao Leviatã.
  rationale: O sufixo de primeira pessoa em לְפָנַי (“diante de mim”) identifica o falante divino e sustenta o argumento do menor para o maior, sem apagar a transição retórica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção retórica foi mantida, evitando linguagem excessivamente arcaica; “permanecer de pé” conserva a imagem do hebraico.
