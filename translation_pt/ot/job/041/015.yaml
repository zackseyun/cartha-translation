  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: pt
  text: As dobras de sua carne aderem umas às outras; estão firmemente fixadas nele[a] e não podem ser movidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão fundidas nele”. O hebraico evoca algo derramado ou moldado que se solidifica e fica firmemente fixo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: dobras
  rationale: O substantivo designa partes pendentes ou dobradas; “dobras” preserva a imagem corporal concreta e soa natural em português.
- source_word: בְשָׂרוֹ
  choice: de sua carne
  rationale: Mantém o sentido básico de בשר, sem ampliar para “corpo” nem interpretar como “couro” ou “pele”.
- source_word: דָבֵקוּ
  choice: aderem umas às outras
  rationale: דבק expressa adesão estreita. A formulação explicita de modo natural em português a relação recíproca entre as dobras.
- source_word: יָצוּק
  choice: estão fundidas
  rationale: Preserva a imagem de algo derramado ou moldado que se torna sólido e firmemente fixo, sem reduzir a expressão apenas a “fixadas”.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Tradução direta da preposição com o sufixo pronominal, adequada ao registro poético.
- source_word: בַּל
  choice: não
  rationale: Reproduz a partícula negativa poética sem intensificá-la indevidamente como “nunca”.
- source_word: יִמּוֹט
  choice: podem ser movidas
  rationale: O nifal de מוט pode indicar ser movido, abalado ou deslocado; com a negação, esta forma comunica claramente a imobilidade.
