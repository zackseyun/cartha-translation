  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: pt
  text: Cada uma se apega à sua companheira[a]; ficam presas umas às outras e não se separam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cada uma se apega a seu irmão»; «irmão» é uma alternativa mais formal nesta descrição poética das escamas do Leviatã.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Cada uma
  rationale: אִישׁ tem aqui sentido distributivo entre as escamas do Leviatã. O feminino concorda naturalmente com «escama», o referente no contexto, sem sugerir pessoas do sexo masculino.
- source_word: בְּאָחִיהוּ
  choice: à sua companheira
  rationale: A expressão significa literalmente «ao/com seu irmão». No contexto não humano, «companheira» preserva a relação entre escamas vizinhas e soa natural em português; a imagem formal de fraternidade fica registrada em nota.
- source_word: יְדֻבָּקוּ
  choice: adere
  rationale: O verbo דבק indica ligação ou aderência estreita. O singular acompanha o valor distributivo de «cada uma» e comunica com precisão o contato firme entre as escamas.
- source_word: יִתְלַכְּדוּ
  choice: elas se entrelaçam
  rationale: O verbo expressa serem presas ou firmemente ligadas umas às outras. «Entrelaçam» produz uma imagem clara da união apertada, sem impor terminologia técnica.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: e não podem ser separadas
  rationale: 'A formulação comunica de modo idiomático a força prática da negação: a união é tão firme que as escamas não se separam.'
