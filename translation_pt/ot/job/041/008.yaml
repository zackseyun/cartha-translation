lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: uma ... à outra
  rationale: A repetição distributiva expressa a proximidade de cada escama com a seguinte. O feminino retoma naturalmente as escamas descritas no contexto.
- source_word: יִגַּשׁוּ
  choice: se encosta
  rationale: O verbo נגשׁ indica aproximação; neste contexto, descreve escamas tão próximas que ficam encostadas umas às outras.
- source_word: וְרוּחַ
  choice: e nem o ar
  rationale: רוּחַ pode significar ar, vento, sopro ou espírito. Aqui, a descrição física favorece 'ar', sem eliminar a alternativa lexical registrada em nota.
- source_word: לֹא יָבוֹא
  choice: passa
  rationale: A construção negativa descreve a impossibilidade prática de o ar entrar ou passar pelo espaço entre as escamas. 'Nem ... passa' é natural em português.
- source_word: בֵינֵיהֶם
  choice: entre elas
  rationale: A preposição בין indica o espaço entre elementos adjacentes; o pronome feminino retoma 'escamas' no contexto imediato.
