  text: Uma se encosta à outra, e nem o ar passa entre elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e nenhum vento entra entre elas”. O hebraico רוּחַ pode significar “ar”, “vento” ou “sopro”; aqui, o sentido físico é o mais provável.'
