  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: pt
  text: Se houver para ele um anjo[a], um mediador, um entre mil, para declarar ao homem o que é reto para ele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um mensageiro, um intérprete».
    reason: lexical_alternative
  - marker: b
    text: Ou «a retidão dele».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: Se houver
  rationale: Expressa de modo natural em português a existência hipotética introduzida pela construção condicional hebraica.
- source_word: עָלָיו
  choice: para ele
  rationale: Neste contexto, indica relação ou atuação em favor do homem, sem tornar explícita uma noção de intercessão que o texto não exige.
- source_word: מַלְאָךְ
  choice: anjo
  rationale: O contexto favorece um mensageiro celestial, embora o sentido lexical mais amplo, «mensageiro», seja preservado em nota.
- source_word: מֵלִיץ
  choice: mediador
  rationale: Abrange a função intermediária da figura; «intérprete» continua sendo uma alternativa lexical possível.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: um entre mil
  rationale: Reproduz com naturalidade a expressão hebraica de raridade ou excepcionalidade.
- source_word: לְהַגִּיד
  choice: para declarar
  rationale: Mantém o propósito indicado pelo infinitivo e o tom solene do discurso.
- source_word: לְאָדָם
  choice: ao homem
  rationale: Refere-se ao indivíduo humano em questão e conserva a formulação masculina do contexto.
- source_word: יָשְׁרוֹ
  choice: o que é reto para ele
  rationale: A expressão portuguesa comunica melhor o sentido contextual de aquilo que é correto ou apropriado no caso do homem, sem atribuir-lhe inequivocamente uma qualidade moral própria.
theological_decisions:
- issue: Identidade e função de מַלְאָךְ מֵלִיץ
  choice: «um anjo, um mediador», sem identificação mais específica
  alternative: Um mensageiro ou intérprete humano; ou um intercessor celestial com implicações teológicas mais fortes
  rationale: O texto apresenta uma figura intermediária, mas não define sua identidade além desses termos. A tradução evita impor uma leitura angelológica ou cristológica específica.
- issue: Referente e sentido de יָשְׁרוֹ
  choice: «o que é reto para ele»
  alternative: «a retidão dele»
  rationale: O sufixo pode ser entendido em relação ao homem, mas a frase admite tanto a ideia de sua retidão quanto a do que é correto para ele. A formulação principal favorece o português idiomático, e a alternativa formal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem em aposição — «um anjo, um mediador» — conserva a estrutura hebraica e a ambiguidade funcional. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
