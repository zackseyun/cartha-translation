  source_fidelity: A tradução preserva adequadamente a construção passiva de וְהוּכַח («é corrigido»), o valor instrumental de בְּמַכְאוֹב («com dor»), a localização no leito e a imagem corporal de contenda/conflito nos ossos. «Contínuo» representa de modo legítimo o sentido durativo de אֵתָן, sem excluir a alternativa «forte».
  naturalness: O português é moderno, claro e de registro apropriado. «Em sua cama» é uma formulação natural para a situação de sofrimento no leito, e «conflito contínuo em seus ossos» conserva a expressão metafórica hebraica sem explicá-la em excesso.
  terminology: «Corrigido» mantém a nuance corretiva de יכח e evita introduzir a noção mais forte de punição. «Dor», «ossos» e «contínuo» são escolhas precisas e consistentes com o texto-fonte e com a trilha de auditoria inglesa.
