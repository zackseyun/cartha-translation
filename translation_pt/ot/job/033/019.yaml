  text: וְ/הוּכַ֣ח בְּ֭/מַכְאוֹב עַל מִשְׁכָּב֑/וֹ ו/ריב עֲצָמָ֣י/ו אֵתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: pt
  text: Ele também é corrigido com dor em sua cama e com conflito contínuo em seus ossos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e com forte conflito em seus ossos”. O adjetivo hebraico pode significar “duradouro, contínuo” ou “forte, poderoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: Ele também é corrigido
  rationale: O hofal de יכח indica ser corrigido, repreendido ou disciplinado. “Corrigido” conserva o caráter corretivo da ação sem defini-la como punição; “também” liga este meio de comunicação divina aos anteriores.
- source_word: בְּמַכְאוֹב
  choice: com dor
  rationale: מַכְאוֹב designa dor ou sofrimento, e a preposição ב pode indicar o meio pelo qual a pessoa é corrigida.
- source_word: עַל מִשְׁכָּבוֹ
  choice: em sua cama
  rationale: A expressão localiza a dor no leito, sugerindo a condição de alguém acamado; esta é uma formulação direta e natural em português.
- source_word: וְרִיב
  choice: e com conflito
  rationale: רִיב significa conflito, contenda ou disputa. Ligado aos ossos, descreve metaforicamente uma aflição corporal profunda.
- source_word: עֲצָמָיו
  choice: em seus ossos
  rationale: Mantém a imagem concreta do hebraico, na qual os ossos representam a estrutura física mais profunda do corpo.
- source_word: אֵתָן
  choice: contínuo
  rationale: אֵתָן pode indicar o que é duradouro, permanente ou forte. No contexto da aflição física, “contínuo” comunica sofrimento persistente, enquanto a possibilidade “forte” é preservada em nota.
theological_decisions:
- issue: A natureza do sofrimento como ação divina
  choice: O sofrimento é apresentado como meio de correção divina, sem formular uma doutrina completa de retribuição.
  alternative: Entender o sofrimento como castigo puramente punitivo ou como doença meramente natural, sem ação divina.
  rationale: No argumento de Eliú, a aflição é um dos meios pelos quais Deus se dirige à pessoa. “Corrigido” preserva esse sentido sem impor a ideia mais específica de punição retributiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e as imagens corporais do hebraico sem soar excessivamente arcaica.
