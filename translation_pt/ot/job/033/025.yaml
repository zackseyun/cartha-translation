translation:
  language: pt
  text: Sua carne se torna mais viçosa do que na juventude[a]; ele volta aos dias do seu vigor juvenil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua carne se torna viçosa como a de um jovem” ou “sua carne se torna mais viçosa do que a de um jovem”. O verbo hebraico é raro, e a comparação com a juventude pode ser entendida de maneiras ligeiramente diferentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele volta aos dias da sua juventude”. O substantivo hebraico pode indicar a própria juventude ou o vigor associado a ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: se torna mais viçosa
  rationale: O verbo raro expressa a ideia de tornar-se novamente fresco, tenro ou viçoso. A formulação preserva a imagem corporal concreta e o sentido de renovação sem recorrer ao mais interpretativo “é restaurada”.
- source_word: בְּשָׂרוֹ
  choice: sua carne
  rationale: Equivalente lexical direto, mantém a ênfase física e concreta do hebraico.
- source_word: מִנֹּעַר
  choice: do que na juventude
  rationale: Entende-se o מִן em sentido comparativo, indicando que a carne se torna mais viçosa do que era na juventude; outras construções são possíveis e ficam registradas em nota.
- source_word: יָשׁוּב
  choice: ele volta
  rationale: O verbo masculino singular refere-se mais naturalmente à pessoa, não apenas à carne, preservando a continuidade do sujeito.
- source_word: לִימֵי
  choice: aos dias do
  rationale: Tradução direta da expressão construta, conservando o idioma temporal do hebraico de modo natural em português.
- source_word: עֲלוּמָיו
  choice: seu vigor juvenil
  rationale: O substantivo pode denotar tanto a juventude quanto a vitalidade própria dessa fase. “Vigor juvenil” comunica naturalmente essa possível nuance no contexto de renovação física.
