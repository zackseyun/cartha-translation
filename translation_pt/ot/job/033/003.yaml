  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: pt
  text: 'A retidão do meu coração está nas minhas palavras,

    e os meus lábios expressam conhecimento com clareza.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os meus lábios proferem conhecimento puro” ou “os meus lábios dizem claramente o que sabem”. O termo hebraico traduzido como “com clareza” também pode transmitir a ideia de pureza ou franqueza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: retidão
  rationale: O substantivo indica retitude ou integridade moral. “Retidão” preserva a afirmação de Eliú sobre a sinceridade e correção de sua disposição interior.
- source_word: לִבִּי
  choice: do meu coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro do pensamento, da vontade e da disposição interior.
- source_word: אֲמָרַי
  choice: nas minhas palavras
  rationale: Reproduz de perto a construção hebraica, na qual “a retidão do meu coração” se relaciona diretamente com “minhas palavras”, sem acrescentar uma relação causal explícita.
- source_word: וְדַעַת
  choice: conhecimento
  rationale: É o equivalente direto do substantivo e pode designar aqui o conteúdo informado expresso pelos lábios.
- source_word: שְׂפָתַי
  choice: os meus lábios
  rationale: Conserva a metonímia poética e o paralelismo entre o coração e os lábios.
- source_word: בָּרוּר
  choice: com clareza
  rationale: O termo pode indicar clareza, pureza ou franqueza. “Com clareza” produz português natural sem eliminar as alternativas legítimas, registradas em nota.
- source_word: מִלֵּלוּ
  choice: expressam
  rationale: O verbo significa falar ou proferir. “Expressam” é natural com “lábios” e permite que “conhecimento” funcione claramente como objeto.
