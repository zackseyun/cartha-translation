base_translation:
  language: en
  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: pt
  text: Veja, o terror que inspiro não o apavorará, e minha mão[a] não pesará sobre você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é difícil. Também pode ser traduzido como “a pressão que exerço” ou “meu peso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz a garantia de Eliú com força de chamada de atenção, em linguagem atual e digna.
- source_word: אֵמָתִי
  choice: o terror que inspiro
  rationale: Expressa o terror ou pavor associado ao próprio Eliú. A formulação explicita em português a relação implícita no possessivo hebraico sem reduzi-la a mero medo subjetivo de Eliú.
- source_word: תְבַעֲתֶךָ
  choice: não o apavorará
  rationale: O piel de בעת indica causar grande medo ou terror; “apavorar” conserva essa intensidade e é natural em português.
- source_word: אַכְפִּי
  choice: minha mão
  rationale: O substantivo é lexicalmente difícil. “Mão” preserva a imagem tradicional e forma uma expressão compreensível com “pesará sobre você”, sem ocultar a incerteza, registrada em nota.
- source_word: עָלֶיךָ
  choice: sobre você
  rationale: Equivalente natural de עַל com o sufixo de segunda pessoa neste contexto de peso exercido sobre alguém.
- source_word: יִכְבָּד
  choice: não pesará
  rationale: Mantém o sentido concreto do qal de כבד, “ser pesado”, e produz uma construção idiomática em português com “sobre você”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Veja” evita o arcaísmo de “Eis”; “o terror que inspiro” torna natural o possessivo hebraico, e a imagem da mão que pesa é preservada no texto, com a incerteza lexical indicada em nota.
