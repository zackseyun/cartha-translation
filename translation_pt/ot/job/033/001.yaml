  text: וְֽ/אוּלָ֗ם שְׁמַֽע נָ֣א אִיּ֣וֹב מִלָּ֑/י וְֽ/כָל דְּבָרַ֥/י הַאֲזִֽינָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: pt
  text: Mas agora, Jó, por favor, ouça as minhas palavras e dê atenção a tudo o que digo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escute tudo o que digo”. O hebraico emprega duas expressões quase paralelas (“as minhas palavras” / “tudo o que digo”) e dois verbos relacionados a ouvir, dando ênfase ao apelo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas agora
  rationale: Marca uma transição enfática no discurso de Eliú; a expressão preserva tanto a nuance adversativa como a progressão discursiva em português natural.
- source_word: שְׁמַע־נָא
  choice: por favor, ouça
  rationale: O imperativo de שׁמע é apresentado como um pedido cortês por meio de נָא; esta formulação é atual, clara e respeitosa.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Adota a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִלָּי
  choice: as minhas palavras
  rationale: Tradução direta do substantivo plural com sufixo de primeira pessoa.
- source_word: וְכָל־דְּבָרַי
  choice: e ... tudo o que digo
  rationale: Expressa de modo natural a abrangência de כָּל e o sentido coletivo de דְּבָרַי, sem repetir mecanicamente 'palavras'.
- source_word: הַאֲזִינָה
  choice: dê atenção a
  rationale: O imperativo hiphil de אזן indica escuta atenta; 'dê atenção a' distingue este verbo de שׁמע e preserva a intensificação do paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A cortesia de נָא foi explicitada por “por favor”, e o paralelismo hebraico foi mantido sem repetição artificial.
