  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: pt
  text: 'Então ele lhe mostra favor e diz: “Livra-o de descer à cova[a]; encontrei um resgate[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A cova” também pode evocar a sepultura, a morte ou a destruição, e não apenas um buraco no chão.
    reason: lexical_alternative
  - marker: b
    text: Ou “um preço de expiação” ou “uma compensação”. O termo hebraico כֹּפֶר pode indicar um resgate ou pagamento que assegura libertação e, em certos contextos, ter conotações de expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: então ele lhe mostra favor
  rationale: O verbo חנן expressa conceder favor, graça ou misericórdia. “Mostra favor” preserva essa amplitude sem reduzi-lo apenas a compaixão emocional.
- source_word: וַיֹּאמֶר
  choice: e diz
  rationale: Embora seja uma forma narrativa sequencial, o presente dá fluidez à introdução da fala em português e acompanha o valor discursivo do contexto.
- source_word: פְּדָעֵהוּ
  choice: Livra-o
  rationale: פדה pode significar resgatar, redimir ou livrar. “Livra-o” expressa naturalmente a ordem e evita antecipar no verbo a ideia de preço, explicitada depois por כֹפֶר.
- source_word: מֵרֶדֶת
  choice: de descer
  rationale: O infinitivo construto de ירד com מִן indica impedir ou poupar alguém da descida; “de descer” reproduz a construção de maneira idiomática.
- source_word: שָׁחַת
  choice: à cova
  rationale: שחת designa a cova e pode evocar sepultura, morte ou destruição. “Cova” mantém a imagem concreta sem resolver suas conotações.
- source_word: מָצָאתִי
  choice: encontrei
  rationale: O perfeito na fala declara que a base do livramento foi encontrada. O pretérito perfeito é natural em português e pode implicar resultado presente no contexto.
- source_word: כֹפֶר
  choice: um resgate
  rationale: כֹפֶר pode denotar o preço ou compensação que assegura libertação. “Resgate” é claro e mantém possíveis implicações expiatórias sem torná-las explícitas demais.
theological_decisions:
- issue: Sentido de כֹפֶר na fala de Eliú
  choice: resgate
  alternative: preço de expiação; compensação; cobertura
  rationale: O contexto trata da base para poupar alguém de descer à cova. “Resgate” conserva a noção concreta de algo que assegura libertação, enquanto a nota registra a possível dimensão expiatória sem impor ao verso uma formulação doutrinária posterior.
- issue: Sujeito de וַיְחֻנֶּנּוּ e וַיֹּאמֶר
  choice: manter o pronome não especificado como “ele”
  alternative: identificá-lo explicitamente como Deus ou como o mensageiro do versículo anterior
  rationale: A forma hebraica não nomeia novamente o sujeito neste versículo, e a relação com o contexto admite discussão. A tradução preserva essa ambiguidade em vez de inserir uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase acompanha de perto o hebraico, mas usa construções naturais. Os marcadores aparecem imediatamente após os termos a que se referem.
