  yaml_path: translation/ot/job/033/002.yaml
  text: Look now[a], I have opened my mouth; my tongue speaks in my palate.
translation:
  language: pt
  text: 'Veja agora[a]: abri a boca; minha língua fala no céu da minha boca.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis, por favor: abri a boca; minha língua fala em meu palato”. A última oração é muito vívida e um tanto incomum no hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja agora
  rationale: A combinação chama a atenção do ouvinte e acrescenta urgência ou apelo. “Veja agora” reproduz essa força discursiva em português atual, sem recorrer ao mais solene “eis” nem transformar נָא necessariamente em pedido cortês.
- source_word: פָּתַחְתִּי פִי
  choice: abri a boca
  rationale: Mantém a imagem concreta e a expressão hebraica para começar a falar. O perfeito é vertido naturalmente pelo pretérito perfeito em português.
- source_word: דִּבְּרָה
  choice: fala
  rationale: A forma verbal é incomum, mas tem “minha língua” como sujeito. O presente comunica a fala em curso e conserva o paralelismo vívido sem acrescentar “começou a”.
- source_word: לְשׁוֹנִי
  choice: minha língua
  rationale: Preserva literalmente o órgão da fala usado de modo metonímico e seu paralelismo com “boca”.
- source_word: בְחִכִּי
  choice: no céu da minha boca
  rationale: חֵךְ designa o palato, isto é, o céu da boca. A expressão escolhida é anatomicamente concreta e mais acessível do que “no meu palato”, além de conservar a preposição e o sufixo possessivo do hebraico.
