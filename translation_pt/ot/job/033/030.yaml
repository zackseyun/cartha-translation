base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: pt
  text: para fazê-lo voltar da cova[a][b], para que seja iluminado pela luz da vida.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para trazer sua vida de volta” ou “para trazer sua alma de volta”. O termo hebraico pode indicar vida, alma ou a própria pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “da sepultura” ou “da destruição”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para trazê-lo à luz” ou “para que veja a luz da vida”. O hebraico é compacto e poético.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: trazer de volta
  rationale: O infinitivo hifil de שוב expressa retorno causativo. “Trazer de volta” preserva esse sentido concreto e se encaixa naturalmente na imagem de resgate.
- source_word: נַפְשׁוֹ
  choice: a sua vida
  rationale: נפש pode significar vida, ser ou pessoa. Neste contexto de livramento da cova, “vida” comunica com clareza o ser vivo ameaçado de morte, sem impor uma dicotomia entre corpo e alma.
- source_word: מִנִּי שָׁחַת
  choice: da cova
  rationale: שחת evoca uma cova e, poeticamente, a sepultura ou destruição. “Cova” conserva a imagem concreta e o contraste com a luz.
- source_word: לֵאוֹר
  choice: e iluminá-lo
  rationale: A forma hebraica é compacta e provavelmente expressa finalidade coordenada com o primeiro infinitivo. “E iluminá-lo” mantém a raiz אור e reproduz a passagem poética do resgate para a luz, embora outras análises sejam possíveis.
- source_word: בְּאוֹר הַחַיִּים
  choice: com a luz dos vivos
  rationale: O plural substantivado חַיִּים pode designar os vivos, e a expressão aponta para a luz desfrutada no mundo dos viventes. Esta formulação é natural em português e preserva a imagem poética, sem excluir a tradução tradicional “luz da vida”.
theological_decisions:
- issue: Sentido antropológico de נַפְשׁוֹ
  choice: a sua vida
  alternative: a sua alma
  rationale: O contexto imediato trata de livrar alguém da morte. “Vida” representa um sentido corrente de נפש e evita transformar o verso em uma afirmação específica sobre uma alma separável; “alma” continua lexicalmente possível e é indicada em nota.
- issue: Referência de הַחַיִּים
  choice: dos vivos
  alternative: da vida
  rationale: A expressão pode referir-se à esfera dos viventes ou ser entendida abstratamente como “vida”. A tradução principal explicita a leitura contextual sem eliminar a alternativa tradicional, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem mantém o paralelismo poético entre a cova e a luz. As ambiguidades de נפש, שחת e da construção final são preservadas nas notas.
