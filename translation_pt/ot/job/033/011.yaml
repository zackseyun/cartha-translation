  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: pt
  text: 'Ele põe meus pés no tronco;

    vigia todos os meus caminhos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guarda todos os meus caminhos”. O verbo hebraico pode significar tanto vigiar como guardar; neste contexto, parece indicar escrutínio, não proteção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: põe
  rationale: O verbo שׂים significa pôr, colocar ou estabelecer; “põe” é direto, natural e preserva a ação concreta.
- source_word: בַּסַּד
  choice: no tronco
  rationale: סַד designa um instrumento de madeira usado para prender os pés. “Tronco” é o termo tradicional e compreensível em português para esse tipo de imobilização punitiva.
- source_word: רַגְלָי
  choice: meus pés
  rationale: A forma com sufixo de primeira pessoa refere-se naturalmente aos dois pés.
- source_word: יִשְׁמֹר
  choice: vigia
  rationale: שׁמר pode significar guardar, proteger, observar ou vigiar. Neste contexto de confinamento e escrutínio, “vigia” comunica observação atenta sem sugerir necessariamente proteção.
- source_word: כָּל
  choice: todos
  rationale: O quantificador abrange a totalidade dos caminhos e concorda naturalmente com o substantivo plural.
- source_word: אָרְחֹתָי
  choice: meus caminhos
  rationale: אֹרַח denota caminho ou vereda e pode representar metaforicamente a conduta ou o curso da vida; “caminhos” preserva essa imagem.
theological_decisions:
- issue: Se a ação divina no segundo membro expressa proteção ou escrutínio punitivo
  choice: “vigia todos os meus caminhos”, com sentido contextual de escrutínio
  alternative: “guarda todos os meus caminhos”, possivelmente com sentido protetor
  rationale: Eliú está recapitulando a queixa de Jó de que Deus o prende e observa como adversário. “Vigia” se ajusta melhor ao paralelismo, mas a nota conserva a amplitude lexical do hebraico.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. Mantém-se a metáfora concreta do instrumento que prende os pés e a ambiguidade lexical de שׁמר por meio de nota.
