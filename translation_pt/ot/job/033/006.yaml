  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: pt
  text: Veja, diante de Deus sou como a sua boca[a]; eu também fui moldado do barro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sou como a sua boca para/diante de Deus”. A expressão pode significar “sou seu porta-voz diante de Deus”, “sou diante de Deus como você desejava” ou, possivelmente, “sou seu igual diante de Deus”.
    reason: alternative_reading
  - marker: b
    text: 'O verbo hebraico pode evocar uma porção de barro sendo apertada, pinçada ou separada da massa para ser modelada. Outra tradução possível: “eu também fui tirado do barro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Veja
  rationale: Partícula enfática que chama a atenção. “Veja” é corrente e preserva sua força de apresentação sem recorrer ao arcaizante “eis”.
- source_word: כְפִיךָ לָאֵל
  choice: diante de Deus sou como a sua boca
  rationale: Mantém de perto a expressão hebraica, literalmente “como a sua boca para/diante de Deus”, sem decidir no texto principal entre as interpretações debatidas de porta-voz, representante desejado ou igual humano.
- source_word: מֵחֹמֶר
  choice: do barro
  rationale: חֹמֶר designa barro ou argila. “Barro” é claro e natural, além de conservar a imagem da origem material comum dos seres humanos.
- source_word: קֹרַצְתִּי
  choice: fui moldado
  rationale: Expressa em português natural a formação a partir do barro. A imagem tátil mais específica do verbo — apertar, pinçar ou separar uma porção da massa — é preservada em nota.
- source_word: גַם אֲנִי
  choice: eu também
  rationale: 'Conserva a ênfase de Eliú em sua solidariedade com Jó: ele também tem a mesma origem humana.'
theological_decisions:
- issue: Relação reivindicada por Eliú entre Jó e Deus
  choice: Conservar a imagem aberta “sou como a sua boca” no texto principal
  alternative: Explicitar “sou seu porta-voz diante de Deus”, “sou diante de Deus como você desejava” ou “sou seu igual diante de Deus”
  rationale: O hebraico é comprimido e admite mais de uma interpretação. A segunda oração enfatiza a humanidade comum de Eliú e Jó, mas não obriga a transformar a primeira em uma afirmação técnica de mediação. A tradução mantém a tensão, e a nota apresenta as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação incomum “como a sua boca” é mantida deliberadamente por refletir a concisão e a ambiguidade do hebraico; as interpretações idiomáticas são fornecidas em nota.
