  language: pt
  text: então ele abre os ouvidos dos homens e sela a instrução deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sela a advertência deles” ou “sela a disciplina deles”. O hebraico מוּסָר pode significar instrução, correção, disciplina ou advertência.
