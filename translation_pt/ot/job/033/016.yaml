lexical_decisions:
- source_word: אָז
  choice: então
  rationale: Advérbio temporal que dá continuidade à descrição anterior da comunicação divina por sonhos e visões.
- source_word: יִגְלֶה אֹזֶן
  choice: abre os ouvidos
  rationale: A expressão hebraica, literalmente ligada a descobrir o ouvido, indica torná-lo receptivo à mensagem; esta formulação preserva a imagem de modo natural em português.
- source_word: אֲנָשִׁים
  choice: dos homens
  rationale: Mantém a forma masculina do hebraico e seu sentido representativo de seres humanos, sem acrescentar especificação ausente no texto.
- source_word: וּבְמֹסָרָם
  choice: a instrução deles
  rationale: מוּסָר pode significar instrução, correção, disciplina ou advertência. “Instrução” se ajusta ao contexto da comunicação divina destinada a afastar o ser humano de uma conduta nociva, enquanto a nota preserva as demais possibilidades.
- source_word: יַחְתֹּם
  choice: sela
  rationale: Preserva a metáfora hebraica de fixar, autenticar ou imprimir firmemente a mensagem recebida.
