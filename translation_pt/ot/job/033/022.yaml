review_pass:
  verdict: revise
  source_fidelity: A tradução principal preserva bem o paralelismo e a ambiguidade de לַמְמִתִים. Contudo, a preposição hebraica לְ em ambos os membros pede “para/a”, não “da/dos”; a formulação atual altera a relação sintática e semântica.
  naturalness: O português é claro e de registro apropriado. “Sua alma se aproxima para a cova” é menos idiomático do que “Sua alma se aproxima da cova”, mas esta última introduz uma mudança de sentido. “Chega perto da cova” é natural e mantém a ideia direcional.
  terminology: “Cova”, “alma” e “vida” são escolhas adequadas. A nota de “cova” deve conservar explicitamente o termo-base, como no registro inglês (“para ‘a cova’”). A nota sobre לַמְמִתִים é equilibrada e não resolve indevidamente a dificuldade textual.
  issues:
  - severity: medium
    issue: As preposições “da cova” e “dos que trazem a morte” não reproduzem o valor direcional de לַשַּׁחַת e לַמְמִתִים.
    rationale: O hebraico apresenta “aproxima-se para/até a cova” e, em paralelo, “[aproxima-se] para/até os que trazem a morte”. “De” sugere proximidade em relação a algo, em vez de movimento ou aproximação em sua direção.
  - severity: low
    issue: A nota a não identifica de modo explícito o vocábulo principal ao qual as alternativas se aplicam.
    rationale: Acrescentar “para ‘a cova’” torna a nota autossuficiente e espelha corretamente o propósito da nota lexical.
  revised_text: Sua alma chega perto da cova[a], e sua vida, dos que trazem a morte[b].
