base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: pt
  text: Sua alma chega perto da cova[a], e sua vida, dos que trazem a morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sepultura” ou “da destruição”, para “a cova”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos mortos” ou “dos agentes da morte”; a expressão hebraica é difícil e pode referir-se a agentes que causam a morte ou ao domínio ou aos poderes da morte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: se aproxima
  rationale: O verbo קרב significa “aproximar-se” ou “chegar perto”. O presente descreve com naturalidade, no contexto poético, o que acontece ao homem que sofre.
- source_word: לַשַּׁחַת
  choice: da cova
  rationale: שַׁחַת pode designar cova, sepultura ou destruição. “Cova” mantém a imagem concreta e sua associação poética com a morte.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: נֶפֶשׁ pode significar alma, vida, ser ou pessoa. “Sua alma” conserva a distinção poética em relação a “sua vida” no segundo membro, sem impor uma antropologia técnica.
- source_word: וְחַיָּתוֹ
  choice: e sua vida
  rationale: Neste paralelismo, o termo denota a vida ou existência viva; “sua vida” é claro e idiomático em português.
- source_word: לַמְמִתִים
  choice: dos que trazem a morte
  rationale: A expressão difícil pode ser entendida em sentido ativo ou causativo como “os que causam/trazem a morte”. Esta formulação preserva essa força sem identificar indevidamente agentes humanos específicos.
theological_decisions:
- issue: Nuance antropológica de נַפְשׁוֹ e וְחַיָּתוֹ em paralelismo
  choice: Traduzir o par como “sua alma” e “sua vida”, sem sugerir um dualismo rígido entre corpo e alma.
  alternative: Nivelar ambos como “sua vida” e “seu ser”, ou entender “alma” como componente imaterial técnico.
  rationale: Os dois membros formam um paralelismo poético quase sinonímico. A tradução preserva a diferença lexical sem definir doutrinariamente a constituição humana.
- issue: Referente de לַמְמִתִים
  choice: Manter a leitura ativa “os que trazem a morte”.
  alternative: “Os mortos”, “os agentes da morte” ou uma referência ao domínio/poderes da morte.
  rationale: A forma hebraica é difícil e admite mais de uma análise. O texto principal conserva a leitura ativa plausível, enquanto a nota registra as alternativas sem resolver artificialmente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse verbal no segundo membro (“e sua vida, dos...”) preserva o paralelismo conciso do hebraico; os marcadores aparecem junto aos termos pertinentes.
