  text: יִ֣כֶל בְּשָׂר֣/וֹ מֵ/רֹ֑אִי ו/שפי עַ֝צְמוֹתָ֗י/ו לֹ֣א רֻאּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/021.yaml
  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: pt
  text: Sua carne definha até desaparecer de vista,[a] e seus ossos, antes invisíveis, ficam expostos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua carne é consumida até não ser mais vista, e seus ossos, que não se viam, ficam descobertos.” O hebraico desta linha é conciso e um tanto difícil, especialmente a palavra traduzida por “ficam expostos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: definha
  rationale: O Qal imperfeito de כלה descreve o consumo ou esgotamento progressivo da carne; “definha” expressa com naturalidade a deterioração física no contexto.
- source_word: בְּשָׂרוֹ
  choice: sua carne
  rationale: Mantém a imagem concreta do hebraico e se refere ao corpo físico da pessoa.
- source_word: מֵרֹאִי
  choice: até desaparecer de vista
  rationale: A combinação מן + רֹאִי indica que a carne deixa de ser visível; a formulação portuguesa explicita de modo natural o resultado sem abandonar a imagem.
- source_word: וְשֻׁפִי
  choice: ficam expostos
  rationale: A forma hebraica é difícil. Pelo paralelismo e pelo contexto, indica que os ossos se tornam visíveis ou descobertos quando a carne definha; “ficam expostos” preserva essa ideia sem determinar além da evidência.
- source_word: עַצְמוֹתָיו
  choice: seus ossos
  rationale: Tradução direta do substantivo plural com sufixo de terceira pessoa masculina singular.
- source_word: לֹא רֻאּוּ
  choice: antes invisíveis
  rationale: O passivo negado de ראה afirma que os ossos não eram vistos; “antes” torna clara a contraposição temporal implícita com sua exposição posterior.
