  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: pt
  text: Preste atenção, Jó; escute-me. Fique em silêncio, e eu falarei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Preste atenção
  rationale: O imperativo hifil de קשׁב pede escuta atenta. “Preste atenção” é natural em português moderno e mantém a força do comando.
- source_word: אִיּוֹב
  choice: Jó
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁמַע לִי
  choice: escute-me
  rationale: שׁמע com ל indica escuta dirigida a alguém. “Escute-me” é idiomático, claro e preserva o imperativo.
- source_word: הַחֲרֵשׁ
  choice: Fique em silêncio
  rationale: O imperativo de חרשׁ, neste contexto, ordena que Jó permaneça calado enquanto Eliú fala. A formulação é natural e digna em português.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: A conjunção seguida do pronome independente destaca o sujeito. “E eu” conserva essa explicitação sem tornar a frase artificial.
- source_word: אֲדַבֵּר
  choice: falarei
  rationale: O imperfeito piel de דבר expressa aqui a ação que Eliú realizará em seguida. O futuro sintético é claro e adequado ao registro.
