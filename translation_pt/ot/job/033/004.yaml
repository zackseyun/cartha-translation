id: JOB.33.4
reference: Job 33:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: pt
  text: O Espírito de Deus me fez[a], e o sopro do Todo-Poderoso me dá vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O sopro de Deus me fez”. A palavra hebraica רוּחַ também pode significar “sopro” ou “vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Espírito
  rationale: Em רוּחַ אֵל, e em paralelo com “o sopro do Todo-Poderoso”, pode designar o Espírito divino que dá vida. A inicial maiúscula indica o referente divino, enquanto a nota preserva os sentidos possíveis de “sopro” e “vento”.
- source_word: אֵל
  choice: Deus
  rationale: Aqui אֵל é um título ou nome divino em paralelo com שַׁדַּי; “Deus” é a tradução portuguesa mais natural no contexto.
- source_word: עָשָׂתְנִי
  choice: me fez
  rationale: Traduz diretamente o sentido comum de עשה e expressa de maneira natural a ação concluída, sem acrescentar a nuance mais específica de “formou” ou “moldou”.
- source_word: נִשְׁמַת
  choice: sopro
  rationale: Refere-se ao sopro vital e conserva a imagem criacional e o paralelismo com רוּחַ.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: É a tradução tradicional e inteligível do título divino שַׁדַּי, adequada ao uso no livro de Jó.
- source_word: תְּחַיֵּנִי
  choice: me dá vida
  rationale: O piel de חיה tem sentido causativo, “fazer viver”. “Me dá vida” é natural e preserva melhor a ideia de concessão da vida do que “me mantém vivo”, que seria mais restritivo.
theological_decisions:
- issue: Se רוּחַ אֵל deve ser traduzido como o impessoal “sopro/vento de Deus” ou como “Espírito de Deus”
  choice: O Espírito de Deus
  alternative: O sopro de Deus; o vento de Deus
  rationale: O paralelismo com “o sopro do Todo-Poderoso” evoca a ação divina que cria e dá vida. “Espírito de Deus” mantém distintos רוּחַ e נְשָׁמָה, sem eliminar a ambiguidade lexical, que é explicitada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético entre “Espírito” e “sopro” e mantém a ambiguidade genuína de רוּחַ por meio da nota.
