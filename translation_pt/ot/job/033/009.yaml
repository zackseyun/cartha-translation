  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: pt
  text: ‘Sou puro, sem transgressão; sou inocente[a], e não há iniquidade[b] em mim.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estou limpo”; o termo hebraico pode indicar limpeza ou ausência de culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “não há culpa em mim”; “iniquidade” também pode ter o sentido de culpa ou delito.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: puro
  rationale: Adjetivo predicativo que expressa pureza moral. “Puro” é natural em português e mantém distinção em relação a חַף.
- source_word: בְּלִי פָשַׁע
  choice: sem transgressão
  rationale: בְּלִי indica ausência, e פֶּשַׁע denota transgressão ou rebeldia. A formulação conserva o sentido moral e jurídico sem o restringir a rebeldia pactual.
- source_word: חַף
  choice: inocente
  rationale: O termo pode indicar alguém limpo ou livre de culpa. “Inocente” comunica com clareza essa condição moral e jurídica em português, evitando a repetição conceitual e estilística de “puro” e “limpo”.
- source_word: עָוֺן
  choice: iniquidade
  rationale: O substantivo pode significar iniquidade, culpa ou delito. “Iniquidade” preserva seu peso moral e deixa aberta a amplitude semântica.
- source_word: לִי
  choice: em mim
  rationale: Embora literalmente seja “para mim/a mim”, no contexto predicativo a expressão idiomática portuguesa “em mim” comunica atribuição ou presença de iniquidade.
theological_decisions:
- issue: Grau da afirmação de inocência de Jó na citação feita por Eliú
  choice: Apresentar diretamente a alegação enfática de pureza e inocência, sem atenuá-la nem ampliá-la.
  alternative: Atenuar como “considero-me puro” ou intensificar com linguagem explícita de impecabilidade absoluta.
  rationale: O hebraico traz predicados diretos e enfáticos. A tradução mantém a tensão narrativa e teológica sem decidir se a alegação é correta nem importar uma doutrina sobre impecabilidade.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem paralela e a primeira pessoa enfática do hebraico foram preservadas de modo natural.
