  text: יָשֹׁ֤ר עַל אֲנָשִׁ֗ים וַ/יֹּ֗אמֶר חָ֭טָאתִי וְ/יָשָׁ֥ר הֶעֱוֵ֗יתִי וְ/לֹא שָׁ֥וָה לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: pt
  text: 'Ele canta diante das pessoas[a] e diz: “Pequei e torci o que era reto, mas isso não me trouxe proveito.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra interpretação do hebraico: “Ele olha para as pessoas”.'
    reason: A forma verbal יָשֹׁר é rara e sua identificação lexical é discutida.
  - marker: b
    text: 'Ou: “e isso não me foi retribuído”; também possível: “e não recebi o castigo que merecia”.'
    reason: A expressão וְלֹא שָׁוָה לִי é ambígua e pode referir-se à falta de proveito ou, no contexto, à ausência da retribuição esperada.
lexical_decisions:
- source_word: יָשֹׁר
  choice: canta
  rationale: A forma massorética pode ser entendida como um verbo ligado a שׁיר, “cantar”. A nota preserva a leitura alternativa tradicional, “olha”.
- source_word: הֶעֱוֵיתִי
  choice: torci
  rationale: Expressa literalmente a ideia de tornar torto ou perverter, mantendo o contraste com יָשָׁר, “reto”.
- source_word: וְלֹא שָׁוָה לִי
  choice: mas isso não me trouxe proveito
  rationale: שׁוה pode indicar valer, aproveitar ou ser vantajoso. A formulação é natural em português e evita impor a ideia específica de retribuição, que não está explicitada pelo verbo.
theological_decisions:
- issue: Relação entre o pecado confessado e sua consequência
  choice: “mas isso não me trouxe proveito”
  alternative: “e não fui castigado como merecia” / “e isso não me foi retribuído”
  rationale: O hebraico é conciso e admite mais de uma compreensão. A tradução principal conserva a afirmação de que o pecado não trouxe benefício, sem transformar explicitamente a frase numa declaração sobre remissão de castigo; a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com “reto” preservando o contraste concreto entre o que é direito e o ato de torná-lo torto. “Diante das pessoas” comunica de modo natural o valor público de עַל אֲנָשִׁים.
