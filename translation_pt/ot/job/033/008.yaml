  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: pt
  text: 'De fato, você falou aos meus ouvidos[a], e eu ouvi o som das suas palavras:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “em meus ouvidos; e o som de palavras eu ouvi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: Neste contexto, a partícula tem força enfática ou asseverativa, não restritiva. “De fato” introduz naturalmente a retomada das declarações de Jó.
- source_word: אָמַרְתָּ
  choice: você falou
  rationale: O qatal de segunda pessoa masculina singular apresenta a fala anterior de Jó. O pretérito perfeito é natural em português.
- source_word: בְאָזְנִי
  choice: aos meus ouvidos
  rationale: Preserva de modo idiomático e compreensível a imagem concreta do hebraico, literalmente “em meus ouvidos”.
- source_word: וְקוֹל
  choice: e ... o som
  rationale: קוֹל pode significar “voz” ou “som”. Diante de “palavras”, “o som” conserva a ênfase auditiva sem produzir a expressão menos natural “a voz de palavras”.
- source_word: מִלִּין
  choice: destas palavras
  rationale: A forma plural aramaizante significa “palavras”. O demonstrativo explicita em português que são as palavras de Jó, que serão citadas nos versículos seguintes, sem acrescentar conteúdo teológico.
- source_word: אֶשְׁמָע
  choice: eu ouvi
  rationale: Embora a forma seja um imperfeito, o contexto a coordena com a fala anterior relatada. O pretérito perfeito comunica naturalmente a percepção já ocorrida.
