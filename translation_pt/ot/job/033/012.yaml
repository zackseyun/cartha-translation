source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: pt
  text: Veja, nisso você não tem razão; eu lhe responderei, pois Deus é maior do que o ser humano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que o mortal”. O termo hebraico אֱנוֹשׁ muitas vezes ressalta a fragilidade e a mortalidade humanas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Veja
  rationale: Partícula discursiva que chama enfaticamente a atenção; “Veja” é natural no português atual e preserva essa força.
- source_word: זֹאת
  choice: nisso
  rationale: O demonstrativo aponta para a questão em debate; “nisso” expressa de modo idiomático essa referência.
- source_word: לֹא צָדַקְתָּ
  choice: você não tem razão
  rationale: Neste contexto argumentativo, צדק significa estar com a razão, não uma declaração geral sobre justiça moral.
- source_word: אֶעֱנֶךָּ
  choice: eu lhe responderei
  rationale: O imperfeito na primeira pessoa com sufixo de segunda pessoa masculina indica a resposta que Eliú passa a dar.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da resposta de Eliú, preservando explicitamente o nexo causal.
- source_word: יִרְבֶּה
  choice: é maior
  rationale: Com מִן, o verbo expressa comparação e superioridade, não multiplicidade numérica.
- source_word: אֱלוֹהַ
  choice: Deus
  rationale: Título divino singular, vertido diretamente por “Deus”.
- source_word: מֵאֱנוֹשׁ
  choice: do que o ser humano
  rationale: אֱנוֹשׁ designa o humano, frequentemente com a nuance de fragilidade e mortalidade. “O ser humano” preserva o contraste genérico entre Deus e a humanidade sem sugerir apenas o sexo masculino.
theological_decisions:
- issue: Sentido de לֹא צָדַקְתָּ
  choice: você não tem razão
  alternative: você não é justo
  rationale: A fala trata da correção da posição de Jó no debate, não de uma negação abrangente de sua justiça moral.
- issue: Tradução do termo humano אֱנוֹשׁ
  choice: o ser humano
  alternative: o mortal
  rationale: A expressão mantém o singular genérico e o contraste entre Deus e a humanidade; a nuance de mortalidade, genuína no termo hebraico, é registrada em nota sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” adequado ao diálogo direto. “Veja” conserva a chamada enfática; “não tem razão” soa natural em contexto de argumentação. A nota preserva a nuance lexical de fragilidade humana.
