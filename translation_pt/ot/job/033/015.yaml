  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: pt
  text: Num sonho, numa visão da noite, quando um sono profundo cai sobre os homens[a], quando adormecem no leito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pessoas”; o hebraico usa “homens” como referência genérica aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: Num sonho
  rationale: A preposição בְּ introduz o âmbito em que ocorre a comunicação. “Num sonho” é natural em português e mantém o paralelismo com “visão”.
- source_word: חֶזְיוֹן לַיְלָה
  choice: numa visão da noite
  rationale: Reproduz de perto a construção hebraica “visão de noite” e conserva sua imagem poética sem reduzi-la simplesmente a “visão noturna”.
- source_word: בִּנְפֹל
  choice: quando ... cai
  rationale: O infinitivo construto com בְּ tem valor temporal neste contexto; “quando ... cai” comunica claramente a construção.
- source_word: תַּרְדֵּמָה
  choice: um sono profundo
  rationale: O termo designa sono pesado ou profundo, por vezes associado no texto bíblico à ação divina. A tradução evita interpretá-lo mais especificamente como transe.
- source_word: עַל אֲנָשִׁים
  choice: sobre os homens
  rationale: Mantém a forma masculina plural do hebraico, que aqui tem referência humana genérica. Uma nota esclarece o alcance inclusivo.
- source_word: בִּתְנוּמוֹת
  choice: quando adormecem
  rationale: O plural hebraico descreve estados de sono ou sonolência. A formulação verbal é mais natural em português do que o literal e pouco idiomático “em sonos”, sem alterar a cena.
- source_word: עֲלֵי מִשְׁכָּב
  choice: no leito
  rationale: Expressa naturalmente a localização indicada por “sobre o leito”. O singular poético e coletivo do hebraico é preservado.
theological_decisions:
- issue: Referência genérica de אֲנָשִׁים
  choice: homens
  alternative: pessoas
  rationale: O substantivo hebraico está no masculino plural, mas funciona genericamente neste contexto. O texto principal conserva a forma, e a nota explicita que a referência inclui os seres humanos em geral.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A repetição de “quando” torna natural a sequência circunstancial e preserva o caráter de oração incompleta que continua no versículo seguinte.
