  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: pt
  text: 'para afastar o ser humano de sua ação[a]

    e esconder do homem o orgulho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “para retirar do ser humano a sua ação; e ele esconde do homem o orgulho”. O hebraico é condensado, e a frase pode indicar tanto afastar a pessoa de sua ação como retirar dela a própria ação.'
    reason: Leitura alternativa decorrente da sintaxe comprimida do hebraico.
lexical_decisions:
- source_word: לְהָסִיר
  choice: afastar ... de
  rationale: O infinitivo hifil de סור exprime aqui a ação de fazer alguém se desviar ou afastar de algo. A construção portuguesa comunica esse sentido causativo sem perder a concisão.
- source_word: אָדָם
  choice: o ser humano
  rationale: אָדָם designa aqui uma pessoa humana de modo geral. “O ser humano” é natural e mantém alguma distinção lexical em relação a גֶּבֶר no segundo membro.
- source_word: מַעֲשֶׂה
  choice: sua ação
  rationale: O substantivo pode significar obra, feito ou ação. “Sua ação” expressa com clareza o ato do qual a pessoa é afastada, deixando a leitura mais literal indicada em nota.
- source_word: וְגֵוָה
  choice: o orgulho
  rationale: גֵּוָה denota elevação ou altivez, com sentido negativo neste contexto. “Orgulho” preserva sua força moral e é amplamente compreensível.
- source_word: מִגֶּבֶר
  choice: do homem
  rationale: גֶּבֶר pode salientar vigor masculino, mas nem sempre exige a tradução explícita “homem forte”. “Do homem” conserva o singular e evita introduzir uma ênfase possivelmente excessiva.
- source_word: יְכַסֶּה
  choice: encobrir
  rationale: Embora seja morfologicamente um imperfeito, o verbo está em paralelismo com o infinitivo anterior e pode exprimir propósito ou resultado. “Encobrir” retém a metáfora concreta de כסה e a formulação incomum do hebraico.
theological_decisions:
- issue: Sentido da cláusula de propósito na descrição que Eliú faz da fala divina
  choice: Deus visa afastar o ser humano de sua ação e encobrir dele o orgulho.
  alternative: Deus visa retirar do ser humano a sua ação; então ele encobre do homem o orgulho.
  rationale: O hebraico é condensado e permite entender לְהָסִיר como afastar a pessoa de seu ato ou como retirar dela o próprio ato. O contexto de Jó 33:14–18 favorece a ideia de advertência e contenção, mas a nota preserva a alternativa mais literal sem eliminar a tensão sintática.
translation_notes:
  register: Português moderno, digno e de leitura ampla. O paralelismo poético foi mantido em duas linhas. “Encobrir do homem o orgulho” é deliberadamente mais próximo da metáfora e da ordem relacional do hebraico, embora seja menos idiomático que “ocultar o orgulho do homem”.
