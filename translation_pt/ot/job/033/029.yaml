  text: הֶן כָּל אֵ֭לֶּה יִפְעַל אֵ֑ל פַּעֲמַ֖יִם שָׁל֣וֹשׁ עִם גָּֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: pt
  text: Veja, Deus faz todas essas coisas duas ou três vezes com um homem[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pessoa”; o hebraico diz “um homem”, no singular representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sim
  rationale: Partícula discursiva que chama atenção e confirma enfaticamente a afirmação. Em português corrente, “Sim” funciona naturalmente neste contexto; “Eis que” seria mais solene e arcaizante.
- source_word: כָּל אֵלֶּה
  choice: todas essas coisas
  rationale: Retoma de modo abrangente as diversas ações divinas descritas nos versículos anteriores, com “coisas” suprindo de maneira idiomática o substantivo implícito.
- source_word: יִפְעַל
  choice: faz
  rationale: O verbo פעל indica realizar ou efetuar ações; “faz” combina naturalmente com “todas essas coisas” e preserva a formulação ampla.
- source_word: אֵל
  choice: Deus
  rationale: אֵל designa Deus neste contexto e não exige uma forma ampliada como “Deus Todo-Poderoso”.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: duas ou três vezes
  rationale: Reproduz em português idiomático a sequência hebraica literalmente próxima de “duas vezes, três”, expressando repetição sem generalizá-la para “repetidas vezes”.
- source_word: עִם
  choice: com
  rationale: Expressa diretamente as ações de Deus em relação ao ser humano, preservando a construção hebraica sem tornar a frase mais interpretativa com “por” ou “para”.
- source_word: גָּבֶר
  choice: um homem
  rationale: Mantém o substantivo masculino singular do hebraico, empregado aqui de modo representativo para um indivíduo humano; a nota esclarece sua abrangência.
theological_decisions:
- issue: Linguagem masculina representativa em גָּבֶר
  choice: um homem
  alternative: uma pessoa; um ser humano
  rationale: O hebraico usa um substantivo masculino singular com sentido representativo. O texto principal conserva essa forma, enquanto a nota evita que leitores modernos a entendam como necessariamente exclusiva do sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sim” preserva o valor enfático de הֶן sem recorrer ao mais arcaizante “Eis que”. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
