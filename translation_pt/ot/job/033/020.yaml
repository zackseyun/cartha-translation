translation:
  language: pt
  text: Assim, sua vida[a] sente repulsa pelo pão, e sua alma, pela comida apetitosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu apetite” ou “ele próprio”; literalmente, “sua vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “comida desejável” ou “comida de sua preferência”; a expressão hebraica indica comida que desperta desejo ou parece atraente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: sente repulsa
  rationale: O verbo זהם expressa aversão ou repugnância. A locução é natural em português e mantém a ideia de forte rejeição, sem introduzir uma voz passiva não exigida pelo texto.
- source_word: חַיָּתוֹ
  choice: sua vida
  rationale: O substantivo se refere à vida ou ao ser vivente. Mantém-se a formulação poética e o paralelismo com “sua alma”, embora o contexto permita entender a pessoa ou seu apetite.
- source_word: לָחֶם
  choice: pão
  rationale: Preserva o sentido concreto básico e a imagem poética, enquanto o segundo membro amplia a referência para comida em geral.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: נפשׁ pode indicar alma, vida, apetite ou a própria pessoa. “Sua alma” conserva a linguagem antropológica e o paralelismo do hebraico sem reduzir antecipadamente sua amplitude semântica.
- source_word: מַאֲכַל
  choice: comida
  rationale: Equivalente atual e abrangente para aquilo que se come.
- source_word: תַּאֲוָה
  choice: apetitosa
  rationale: Em ligação com “comida”, o termo caracteriza aquilo que normalmente desperta desejo ou apetite. “Apetitosa” comunica isso de modo natural; “desejável” permanece uma alternativa mais formal.
