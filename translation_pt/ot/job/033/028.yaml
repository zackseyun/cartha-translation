  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: pt
  text: Ele resgatou minha alma de passar para a cova[a][b], e minha vida verá a luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resgatou minha vida de descer à cova”.'
    reason: lexical_alternative
  - marker: b
    text: A “cova” é uma imagem hebraica comum para a morte ou a sepultura.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: resgatou
  rationale: O verbo expressa resgatar ou remir alguém do perigo. “Resgatou” preserva o sentido concreto de salvamento sem sugerir necessariamente o pagamento explícito de um preço.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. “Minha alma” preserva a distinção poética em relação a וְחַיָּתִי, “minha vida”, no segundo membro.
- source_word: מֵעֲבֹר
  choice: de entrar
  rationale: A preposição com o infinitivo expressa impedir que alguém passe ou entre em determinado estado ou lugar. “De entrar” comunica naturalmente em português o movimento em direção à cova.
- source_word: בַּשַּׁחַת
  choice: na cova
  rationale: שַׁחַת denota uma cova e, por extensão, a morte ou a sepultura. “Cova” mantém a imagem concreta do hebraico.
- source_word: וְחַיָּתִי
  choice: e minha vida
  rationale: O substantivo se refere à vida ou existência viva. A formulação conserva o paralelismo poético com “minha alma” e concorda com o verbo feminino que se segue.
- source_word: בָּאוֹר
  choice: a luz
  rationale: A expressão tem artigo definido e contrasta a luz da vida com a cova e a morte.
- source_word: תִּרְאֶה
  choice: verá
  rationale: O imperfeito pode ter valor futuro neste contexto. “Verá a luz” é natural em português e preserva a imagem hebraica de experimentar novamente a vida.
theological_decisions:
- issue: Referente do sujeito do verbo inicial
  choice: Ele resgatou minha alma
  alternative: Deus resgatou minha alma; Ele tem resgatado minha alma
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o sujeito não é expresso neste versículo. O contexto aponta para Deus; “Ele” preserva essa referência sem inserir explicitamente o nome divino onde o hebraico o deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém o paralelismo entre “minha alma” e “minha vida” e conserva as imagens poéticas da cova e da luz.
