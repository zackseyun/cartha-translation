  text: אִם יֵשׁ מִלִּ֥ין הֲשִׁיבֵ֑/נִי דַּ֝בֵּ֗ר כִּֽי חָפַ֥צְתִּי צַדְּקֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: pt
  text: Se você tem algo a dizer, responda-me; fale, pois desejo lhe dar razão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “justificá-lo”, “declará-lo justo” ou “defender sua inocência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Se você tem algo a dizer
  rationale: Expressa naturalmente em português a construção existencial idiomática, sem restringir מִלִּין a argumentos formais.
- source_word: הֲשִׁיבֵנִי
  choice: responda-me
  rationale: Mantém a força direta do imperativo e é idiomático no contexto de diálogo.
- source_word: דַּבֵּר
  choice: fale
  rationale: Reproduz de modo conciso o segundo imperativo e a ênfase do convite.
- source_word: כִּי חָפַצְתִּי
  choice: pois desejo
  rationale: Preserva a relação explicativa de כִּי e a expressão de vontade sincera em חָפַצְתִּי.
- source_word: צַדְּקֶךָ
  choice: lhe dar razão
  rationale: Comunica naturalmente que Eliú deseja reconhecer Jó como estando certo, evitando que 'justificar' seja entendido automaticamente como termo técnico doutrinário.
theological_decisions:
- issue: Sentido de צַדְּקֶךָ
  choice: lhe dar razão
  alternative: justificá-lo; declará-lo justo; defender sua inocência
  rationale: No contexto, Eliú afirma estar disposto a reconhecer que Jó tem razão se este puder responder. A tradução evita resolver a frase como uma declaração sobre justificação forense diante de Deus, ao mesmo tempo que a nota preserva alternativas lexicalmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Algo a dizer” soa mais natural que o literal “palavras”; “lhe dar razão” preserva o sentido contextual sem introduzir desnecessariamente linguagem teológica técnica.
