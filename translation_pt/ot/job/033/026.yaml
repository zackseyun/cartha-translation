source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: pt
  text: Ele suplica a Deus[a], e Deus o aceita; ele vê a face de Deus[b] com um grito de alegria, e Deus restitui ao ser humano a sua retidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ora a Deus com insistência”. O verbo hebraico pode destacar uma súplica fervorosa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua face”. A leitura mais natural é que ele vê a face de Deus.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “sua justiça”, “sua condição justa” ou “sua vindicação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: suplica
  rationale: O verbo עתר expressa aqui oração insistente ou súplica dirigida a Deus. “Suplica” preserva essa intensidade e é natural em português.
- source_word: אֶל אֱלוֹהַּ
  choice: a Deus
  rationale: אֱלוֹהַּ é a designação poética singular de Deus comum em Jó; não há base para acrescentar “Todo-Poderoso”.
- source_word: וַיִּרְצֵהוּ
  choice: e Deus o aceita
  rationale: רצה indica que Deus recebe favoravelmente o suplicante. Repetir “Deus” esclarece a mudança de sujeito implícita no hebraico e evita ambiguidade artificial em português.
- source_word: וַיַּרְא פָּנָיו
  choice: ele vê a face de Deus
  rationale: A leitura contextual mais natural é que o homem restaurado vê a face de Deus. A explicitação do referente torna a frase clara em português sem alterar seu sentido provável.
- source_word: בִּתְרוּעָה
  choice: com um grito de alegria
  rationale: תְּרוּעָה designa um brado audível, frequentemente festivo ou triunfante; a expressão mantém tanto o aspecto vocal quanto a alegria.
- source_word: וַיָּשֶׁב
  choice: e Deus restitui
  rationale: 'O hifil de שוב tem força causativa: fazer voltar, devolver ou restituir. A repetição do sujeito divino dá clareza à sequência.'
- source_word: לֶאֱנוֹשׁ
  choice: ao ser humano
  rationale: אֱנוֹשׁ ressalta a humanidade mortal. “Ser humano” é inclusivo, corrente e adequado ao referente genérico.
- source_word: צִדְקָתוֹ
  choice: a sua justiça
  rationale: צְדָקָה significa primariamente justiça ou retidão. “Sua justiça” preserva a amplitude lexical e não força uma formulação doutrinária posterior.
theological_decisions:
- issue: Referentes dos pronomes na sequência “ele o aceita; ele vê sua face”
  choice: Deus aceita o homem que suplica, e o homem vê a face de Deus.
  alternative: Deus vê a face do homem; ou, menos provavelmente, o homem recebe Deus favoravelmente.
  rationale: O contexto descreve o ser humano voltando-se para Deus e recebendo favor e restauração. Ver a face de Deus é a leitura idiomática e contextual mais natural. Os sujeitos foram explicitados para evitar confusão em português.
- issue: Sentido de צִדְקָתוֹ, “sua justiça”
  choice: A justiça, retidão ou condição justa do ser humano é restituída por Deus.
  alternative: Pode designar sua vindicação; uma leitura que entenda o sufixo como referência à justiça do próprio Deus é possível, mas menos natural.
  rationale: O sufixo remete mais naturalmente ao ser humano mencionado, e o contexto é de restauração. A formulação literal “sua justiça” mantém a tensão sem impor uma doutrina específica de justiça imputada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Deus” explicita sujeitos que o hebraico deixa implícitos. “Ser humano” traduz o uso genérico de אֱנוֹשׁ sem restringi-lo ao sexo masculino.
