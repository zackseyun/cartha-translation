lexical_decisions:
- source_word: אִם תּוּכַל
  choice: Se você puder
  rationale: Introduz um desafio condicional e expressa capacidade de modo direto e natural em português.
- source_word: הֲשִׁיבֵנִי
  choice: responda-me
  rationale: No contexto de debate, o hifil de שוב tem o sentido idiomático de responder ou replicar.
- source_word: עֶרְכָה
  choice: exponha seu caso
  rationale: O verbo ערך significa pôr em ordem ou dispor. Aqui, o contexto de contestação permite explicitar o objeto implícito como o caso ou argumento de Jó, sem apagar a ideia de apresentação ordenada.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Equivalente português natural para indicar a presença perante o interlocutor e preservar o tom de confronto.
- source_word: הִתְיַצָּבָה
  choice: tome posição
  rationale: O hitpael de יצב convoca o interlocutor a colocar-se de pé ou apresentar-se pronto; a expressão conserva tanto a postura quanto o tom adversarial.
