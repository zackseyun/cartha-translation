  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: pt
  text: Por que você contende com ele por ele não responder por nenhuma de suas palavras?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ele não responder por todas as suas palavras”. “Palavras” também pode referir-se a assuntos ou questões.'
    reason: A combinação da negação com “todas” no hebraico pode ter sentido abrangente (“nenhuma”) ou menos absoluto (“não todas”); דָּבָר também possui campo semântico mais amplo que fala literal.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: você contende
  rationale: O verbo ריב expressa disputar, litigar ou entrar em controvérsia; “contender” preserva o tom de acusação dirigida contra Deus.
- source_word: כִּי
  choice: porque
  rationale: Mantém o valor causal mais direto no contexto, sem transformar explicitamente a oração em uma citação ou alegação.
- source_word: כָל־דְּבָרָיו
  choice: nenhum dos seus atos
  rationale: דבר pode designar palavra, assunto, questão ou ação. Aqui, com “responder por”, “atos” comunica naturalmente os assuntos ou procedimentos de Deus, sem excluir a alternativa literal indicada em nota.
- source_word: לֹא יַעֲנֶה
  choice: ele não responde por
  rationale: ענה significa responder; com o objeto neste contexto, a expressão pode ter o sentido de prestar resposta ou dar explicação acerca de algo.
theological_decisions:
- issue: Deus prestar contas ou responder acerca de seus atos
  choice: ele não responde por nenhum dos seus atos
  alternative: ele não responde a nenhuma das palavras dele
  rationale: 'A formulação preserva a tensão do discurso de Eliú: o ser humano contende com Deus por não receber explicação. Não acrescenta uma conclusão doutrinária nem suaviza a afirmação.'
translation_notes:
  register: Português atual, digno e amplamente compreensível. A repetição interrogativa “Por que... porque” foi mantida para conservar a relação causal e a tensão do hebraico, embora seja menos fluida que uma paráfrase explicativa.
