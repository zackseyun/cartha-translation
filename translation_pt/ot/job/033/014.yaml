  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: pt
  text: Pois Deus fala uma vez, e duas vezes, mas ninguém o percebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois Deus fala de uma maneira e de duas». Os numerais hebraicos podem ser entendidos adverbialmente («uma vez... duas vezes») ou, de modo idiomático, como referência a diferentes maneiras de falar.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Eliú sobre como Deus se comunica, preservando a força causal e explicativa do hebraico.
- source_word: בְאַחַת ... וּבִשְׁתַּיִם
  choice: de um modo ... e de outro
  rationale: Expressa em português natural a sequência numérica idiomática, entendida como modos distintos de comunicação, sem sugerir a formulação pouco natural «em um e em dois».
- source_word: יְדַבֶּר
  choice: fala
  rationale: O imperfeito piel tem valor geral ou habitual; o presente comunica adequadamente essa verdade geral.
- source_word: אֵל
  choice: Deus
  rationale: É a tradução direta e contextual do título divino אֵל, sem acrescentar nuances não exigidas pelo texto.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: embora ninguém o perceba
  rationale: שׁור denota olhar, notar ou perceber. A construção concessiva é natural em português, e «ninguém» comunica o sujeito humano genérico implícito sem especificar gênero.
theological_decisions:
- issue: Sujeito humano implícito na oração final
  choice: ninguém
  alternative: ele não o percebe / a pessoa não o percebe
  rationale: O hebraico traz um sujeito masculino singular não expresso, usado genericamente. «Ninguém» mantém a referência humana indefinida e produz uma frase clara, sem restringi-la aos homens.
- issue: Referente do sufixo feminino em יְשׁוּרֶנָּה
  choice: o, retomando o falar ou agir comunicativo de Deus
  alternative: a, retomando uma fala ou comunicação subentendida
  rationale: O referente exato do sufixo não está expresso de forma inequívoca. O pronome neutro funcional «o» retoma em português o fato de Deus falar, sem introduzir um substantivo interpretativo no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação principal privilegia naturalidade sem ocultar na nota a ambiguidade entre frequência e modo presente no hebraico.
