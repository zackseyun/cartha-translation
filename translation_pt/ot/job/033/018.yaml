  text: יַחְשֹׂ֣ךְ נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת וְ֝/חַיָּת֗/וֹ מֵ/עֲבֹ֥ר בַּ/שָּֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: pt
  text: Ele poupa sua alma da cova[a] e sua vida de perecer pela arma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sepultura” ou “da destruição”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de passar pela arma”. O termo hebraico também pode indicar mais especificamente um projétil ou, possivelmente, uma espada; a ideia é ser preservado de uma morte violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: poupa
  rationale: O hifil de חשׂך pode significar reter, impedir ou poupar. No contexto, descreve a preservação de alguém diante da morte; “poupa” expressa isso de modo natural e mantém a ideia causativa.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: נפש pode designar a alma, a vida ou a própria pessoa. “Sua alma” conserva a imagem hebraica e forma um paralelismo poético com “sua vida”, sem exigir uma distinção antropológica rígida.
- source_word: מִנִּי שָׁחַת
  choice: da cova
  rationale: שׁחת pode indicar cova, sepultura ou destruição. “Cova” preserva a imagem concreta e, neste contexto poético, evoca o domínio da morte.
- source_word: וְחַיָּתוֹ
  choice: sua vida
  rationale: Aqui חיה se refere à vida da pessoa. “Sua vida” é claro, natural e corresponde ao paralelismo com נַפְשׁוֹ.
- source_word: מֵעֲבֹר
  choice: de perecer
  rationale: Embora עבר signifique literalmente passar ou atravessar, a construção neste contexto indica ser levado a uma morte violenta. “De perecer” comunica o sentido em português natural, enquanto a nota registra a imagem mais literal.
- source_word: בַּשָּׁלַח
  choice: pela arma
  rationale: שׁלח provavelmente designa aqui uma arma, talvez um projétil ou uma espada. O termo geral “arma” evita precisão indevida e preserva a referência à morte violenta.
theological_decisions:
- issue: Relação entre “alma” e “vida” no paralelismo
  choice: Manter “alma” e “vida” como termos paralelos
  alternative: Traduzir ambos simplesmente como “vida”
  rationale: O hebraico emprega dois termos distintos em paralelismo poético. A tradução não os transforma em componentes humanos rigidamente separados, mas também não apaga a variação lexical do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo poético e a imagem da cova, mas verte a expressão final de modo idiomático; a formulação literal e a incerteza quanto ao tipo de arma ficam registradas em nota.
