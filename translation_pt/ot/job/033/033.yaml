  text: אִם אַ֭יִן אַתָּ֥ה שְֽׁמַֽע לִ֑/י הַ֝חֲרֵ֗שׁ וַ/אֲאַלֶּפְ/ךָ֥ חָכְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/033/033.yaml
  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: pt
  text: Se não, escute-me[a]; fique em silêncio[b], e eu lhe ensinarei sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouça-me”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cale-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אַיִן
  choice: Se não
  rationale: 'A expressão introduz a condição contrária ao convite anterior: se Jó não tem nada a responder, deve ouvir. “Se não” preserva de modo conciso a força condicional.'
- source_word: שְׁמַע לִי
  choice: escute-me
  rationale: שׁמע com ל indica ouvir alguém com atenção. “Escute-me” é uma ordem natural em português e expressa melhor a atenção requerida do que o simples ato de ouvir.
- source_word: הַחֲרֵשׁ
  choice: fique em silêncio
  rationale: O imperativo de חרש exige que o interlocutor não fale. “Fique em silêncio” é direto, digno e natural em português moderno.
- source_word: וַאֲאַלֶּפְךָ
  choice: e eu lhe ensinarei
  rationale: 'O piel de אלף significa ensinar ou instruir. O imperfeito prefixado por waw, após os imperativos, é adequadamente expresso como o resultado futuro: “e eu lhe ensinarei”.'
- source_word: חָכְמָה
  choice: sabedoria
  rationale: חָכְמָה é o termo hebraico usual para sabedoria e mantém o vocabulário característico da literatura sapiencial sem explicitação desnecessária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em “escute-me” conserva um tom bíblico moderado sem soar arcaica; “lhe ensinarei” é natural no português brasileiro formal e evita repetição pesada do pronome.
