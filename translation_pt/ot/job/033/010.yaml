  text: הֵ֣ן תְּ֭נוּאוֹת עָלַ֣/י יִמְצָ֑א יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: pt
  text: Eis[a], ele encontra motivos de hostilidade[b] contra mim; considera-me seu inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato”. A partícula hebraica introduz enfaticamente a afirmação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “hostilidades contra mim”, “ocasiões contra mim” ou, possivelmente, “queixas contra mim”. O substantivo hebraico é raro e depende do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Introduz enfaticamente a afirmação e chama a atenção dos ouvintes; a forma plural é natural no discurso de Eliú dirigido ao grupo e evita o arcaísmo de “eis”.
- source_word: תְּנוּאוֹת
  choice: motivos de hostilidade
  rationale: O substantivo raro parece indicar hostilidades, pretextos ou ocasiões de oposição. A expressão preserva tanto o caráter adversativo quanto a ideia de algo que se encontra contra Jó.
- source_word: עָלַי
  choice: contra mim
  rationale: Neste contexto de hostilidade, a preposição עַל tem sentido adversativo.
- source_word: יִמְצָא
  choice: ele encontra
  rationale: Mantém o sentido básico de מצא sem intensificá-lo para “inventa”, o que resolveria indevidamente a tensão da acusação relatada.
- source_word: יַחְשְׁבֵנִי
  choice: considera-me
  rationale: Expressa de modo natural e digno o sentido de avaliar, reputar ou ter alguém por algo.
- source_word: לְאוֹיֵב לוֹ
  choice: seu inimigo
  rationale: A construção indica a condição na qual ele considera Jó; em português, “considera-me seu inimigo” comunica isso naturalmente.
theological_decisions:
- issue: Perspectiva do falante sobre o tratamento de Jó por Deus
  choice: 'Relatar a queixa atribuída a Jó: “ele encontra motivos de hostilidade contra mim; considera-me seu inimigo”.'
  alternative: “ele inventa acusações contra mim”
  rationale: O versículo apresenta a percepção de Jó conforme citada por Eliú, sem endossá-la como descrição doutrinária de Deus. “Encontra” conserva a força da queixa e a tensão teológica, mas não acrescenta a ideia mais forte de fabricação injusta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vejam” reproduz a chamada de atenção do hebraico; “considera-me” é corrente sem ser coloquial. A nota [b] deve ser marcada no texto após “motivos de hostilidade” para registrar a incerteza lexical.
