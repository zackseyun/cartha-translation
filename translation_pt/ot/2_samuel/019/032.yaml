  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: pt
  text: Barzilai, o gileadita, tinha descido de Rogelim[a] e atravessou o Jordão com o rei, para despedir-se dele junto ao Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desceu de Rogelim e atravessou com o rei o Jordão para acompanhá-lo”. O hebraico permite pequenas diferenças na maneira de expressar como Barzilai acompanhou o rei e se despediu dele junto ao rio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Transliteração corrente e clara do nome hebraico em português.
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: Preserva de modo conciso o gentílico que identifica Barzilai como natural ou habitante de Gileade.
- source_word: יָרַד
  choice: tinha descido
  rationale: O mais-que-perfeito situa a descida de Rogelim antes da ação narrativa seguinte, sem perder o sentido espacial do verbo.
- source_word: מֵרֹגְלִים
  choice: de Rogelim
  rationale: Mantém o topônimo transliterado e traduz diretamente a preposição de origem.
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: Expressa o movimento de cruzar o rio; a construção seguinte indica que Barzilai acompanhava o rei.
- source_word: אֶת הַמֶּלֶךְ
  choice: com o rei
  rationale: Embora אֶת normalmente marque o objeto direto, aqui o contexto de movimento favorece em português a ideia associativa de atravessar na companhia do rei.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma tradicional e natural em português para o nome do rio; o contexto dispensa acrescentar “rio”.
- source_word: לְשַׁלְּחוֹ
  choice: a fim de acompanhá-lo em sua partida
  rationale: Comunica a finalidade de acompanhar o rei na despedida e encaminhá-lo em sua viagem, evitando a impressão de que Barzilai simplesmente o mandou embora.
- source_word: אֶת בַּיַּרְדֵּן
  choice: junto ao Jordão
  rationale: Trata a expressão final como localização da despedida, sem decidir de forma rígida se a ação ocorreu à margem ou durante a travessia.
