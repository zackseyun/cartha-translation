base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: pt
  text: Por favor, permita que seu servo volte[a], para que eu morra em minha própria cidade, junto ao túmulo de meu pai e de minha mãe. Mas aqui está seu servo Quimã; que ele atravesse com meu senhor, o rei, e faça por ele o que for bom aos seus olhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por «deixe seu servo voltar».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o que lhe parecer bom».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Por favor, permita que ... volte
  rationale: שׁוּב no qal indica retornar, e נָא confere à fala o tom cortês de um pedido.
- source_word: עַבְדְּךָ
  choice: seu servo
  rationale: É uma autodesignação respeitosa diante do rei; «servo» preserva o registro cortês sem pôr em primeiro plano a ideia de escravidão.
- source_word: וְאָמֻת
  choice: para que eu morra
  rationale: A conjunção seguida do imperfeito expressa aqui a finalidade ligada ao pedido de voltar.
- source_word: בְּעִירִי
  choice: em minha própria cidade
  rationale: O sufixo de primeira pessoa indica pertença; «própria» comunica naturalmente o vínculo pessoal sem alterar o sentido.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: junto ao túmulo de meu pai e de minha mãe
  rationale: Embora עִם signifique literalmente «com», no contexto funerário «junto ao» comunica de modo natural a proximidade do lugar de sepultamento da família.
- source_word: וְהִנֵּה
  choice: Mas aqui está
  rationale: הִנֵּה tem força apresentativa, enquanto «mas» explicita de forma natural o contraste entre o retorno do falante e a ida de Quimã.
- source_word: כִמְהָם
  choice: Quimã
  rationale: Transliteração portuguesa reconhecível do nome pessoal hebraico.
- source_word: יַעֲבֹר עִם
  choice: que ele atravesse com
  rationale: O imperfeito tem força volitiva no contexto; «atravesse» preserva o motivo narrativo da travessia do Jordão.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém a forma respeitosa e o registro da fala dirigida ao rei.
- source_word: וַעֲשֵׂה לוֹ
  choice: e faça por ele
  rationale: עשה com ל pode indicar fazer algo em benefício de alguém; esta formulação é natural e não sugere ação hostil.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: o que for bom aos seus olhos
  rationale: Preserva a imagem idiomática hebraica, compreensível em português, sem excluir o sentido de «o que lhe parecer bom».
