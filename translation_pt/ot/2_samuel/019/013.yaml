base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: pt
  text: Vocês são meus irmãos[a]; vocês são meu osso e minha carne[b]. Então, por que seriam os últimos a trazer o rei de volta?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «meus parentes»; literalmente, «meus irmãos».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «meu osso e minha carne», expressão que indica parentesco próximo de sangue.'
    reason: cultural_note
  - marker: c
    text: Davi refere-se a si mesmo na terceira pessoa como «o rei».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: meus irmãos
  rationale: Preserva o sentido literal do hebraico e, no contexto, designa os membros da mesma parentela ou tribo de Davi.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: meus ossos e minha carne
  rationale: Mantém a imagem concreta do idioma hebraico para parentesco de sangue. O plural «ossos» é mais idiomático em português, embora o hebraico use o singular coletivo.
- source_word: וְלָמָה
  choice: Então, por que
  rationale: 'Expressa naturalmente a força inferencial da conjunção: o apelo decorre do parentesco que acaba de ser afirmado.'
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: seriam os últimos
  rationale: A forma verbal integra uma pergunta retórica de censura e exortação; o condicional comunica bem essa nuance em português corrente.
- source_word: לְהָשִׁיב
  choice: a trazer ... de volta
  rationale: 'Traduz o hifil de שוב como ação causativa: fazer o rei retornar, e não apenas ele próprio voltar.'
- source_word: אֶת־הַמֶּלֶךְ
  choice: o rei
  rationale: Conserva a referência de Davi a si mesmo na terceira pessoa, conforme o texto hebraico.
