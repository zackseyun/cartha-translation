base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: pt
  text: Pois o seu servo atravessará o Jordão com o rei apenas por um pequeno trecho. Por que o rei haveria de me retribuir com esta recompensa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me recompensar com esta retribuição”. No hebraico, o verbo e o substantivo são da mesma raiz (גמל), enfatizando a ideia de retribuição ou recompensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Pois ... apenas por um pequeno trecho
  rationale: כִּי introduz a razão da recusa de Barzilai, e מְעַט limita a extensão de seu acompanhamento. A formulação conserva o sentido causal e a ideia de uma distância curta em português corrente.
- source_word: יַעֲבֹר
  choice: atravessará
  rationale: O imperfeito descreve aqui a ação que Barzilai se dispõe a realizar. O futuro do indicativo soa natural no contexto de sua declaração respeitosa.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Na fala dirigida ao rei, trata-se de uma forma convencional de autodepreciação respeitosa; “servo” preserva esse registro sem destacar indevidamente a ideia de escravidão.
- source_word: אֶת הַ/יַּרְדֵּן
  choice: o Jordão
  rationale: 'Com o verbo עבר, marca aquilo que é atravessado: o rio Jordão.'
- source_word: אֶת הַ/מֶּלֶךְ
  choice: com o rei
  rationale: Aqui אֶת funciona como preposição de companhia, indicando que Barzilai atravessaria junto com o rei.
- source_word: וְ/לָמָּה
  choice: Por que ... haveria de
  rationale: Introduz uma pergunta retórica mediante a qual Barzilai recusa cortesmente a compensação oferecida pelo rei.
- source_word: יִגְמְלֵ/נִי
  choice: me retribuir
  rationale: גמל expressa a ideia de tratar alguém segundo o que fez, recompensando ou retribuindo. “Retribuir” mantém a noção de reciprocidade.
- source_word: הַ/גְּמוּלָה הַ/זֹּאת
  choice: com esta recompensa
  rationale: O substantivo designa recompensa ou retribuição. “Esta recompensa” é claro e mantém a referência à generosidade que o rei acabara de oferecer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento respeitoso próprio de uma fala dirigida ao rei. A construção “por um pequeno trecho” conserva a limitação expressa por מְעַט sem explicar além do que o hebraico afirma.
