base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: pt
  text: 'Então o rei lhe disse: “Por que você continua falando do seu caso? Já decidi[a]: você e Ziba dividirão as terras[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Eu disse”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: Então o rei lhe disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez natural em português. O pronome “lhe” representa לוֹ.
- source_word: לָמָּה תְּדַבֵּר עוֹד
  choice: Por que você continua falando
  rationale: A forma verbal com עוֹד indica fala continuada ou adicional. “Continua falando” comunica naturalmente essa ideia e o tom impaciente da pergunta.
- source_word: דְּבָרֶיךָ
  choice: do seu caso
  rationale: דָּבָר pode significar palavra, assunto ou questão. No contexto da disputa apresentada ao rei, “seu caso” expressa o sentido contextual sem transformar a frase em terminologia jurídica técnica.
- source_word: אָמַרְתִּי
  choice: Já decidi
  rationale: A forma significa literalmente “eu disse”, mas aqui a fala do rei tem força de decisão ou sentença. “Já decidi” comunica essa função; a tradução mais literal é preservada em nota.
- source_word: אַתָּה וְצִיבָא
  choice: você e Ziba
  rationale: Mantém explícito o pronome enfático dirigido a Mefibosete e emprega a forma portuguesa tradicional do nome Ziba.
- source_word: תַּחְלְקוּ
  choice: dividirão
  rationale: O imperfeito expressa aqui a determinação autoritativa do rei. O futuro do indicativo em português pode comunicar tanto o resultado estabelecido quanto a força da ordem.
- source_word: הַשָּׂדֶה
  choice: as terras
  rationale: Embora o substantivo singular signifique literalmente “o campo”, neste conflito patrimonial ele pode designar coletivamente a propriedade rural. “As terras” é idiomático no contexto, e a alternativa literal é registrada em nota.
