  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: pt
  text: Simei, filho de Gera, o benjaminita de Baurim, apressou-se e desceu com os homens de Judá[a] ao encontro do rei Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com o homem de Judá”; aqui, a expressão é entendida coletivamente como “com os homens de Judá”.'
