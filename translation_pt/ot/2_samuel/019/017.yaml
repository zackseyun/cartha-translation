lexical_decisions:
- source_word: וַיְמַהֵר
  choice: apressou-se
  rationale: Expressa a urgência do verbo hebraico de modo natural e digno em português.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Simei, filho de Gera
  rationale: Mantém o nome pessoal em forma tradicional portuguesa e reproduz o patronímico hebraico.
- source_word: בֶּן הַיְמִינִי
  choice: o benjaminita
  rationale: No contexto, a expressão identifica a pertença tribal de Simei, não um segundo patronímico imediato.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: de Baurim
  rationale: Indica de forma concisa e natural o lugar de origem de Simei.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido topográfico concreto do verbo hebraico.
- source_word: עִם אִישׁ יְהוּדָה
  choice: com os homens de Judá
  rationale: Embora אִישׁ esteja no singular, a expressão é entendida coletivamente neste contexto.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: Representa naturalmente o movimento com a finalidade de encontrar alguém.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Conserva título e nome em ordem idiomática no português.
