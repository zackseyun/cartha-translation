base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: pt
  text: Pois todos os da casa de meu pai não eram senão pessoas merecedoras de morte perante o meu senhor, o rei[a]. Mesmo assim, puseste o teu servo entre os que comem à tua mesa. Que direito ainda tenho[b] de clamar mais ao rei?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homens de morte”, isto é, pessoas sujeitas à morte ou merecedoras de execução.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “direito” traduz o hebraico tsedaqah no sentido de uma reivindicação justa ou de um direito, não principalmente de retidão moral pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: não passava de
  rationale: A construção expressa limitação enfática; a formulação portuguesa comunica naturalmente que toda a família se encontrava nessa condição.
- source_word: כָּל בֵּית אָבִי
  choice: toda a casa de meu pai
  rationale: Preserva a imagem hebraica de 'casa' como família ou linhagem extensa e permanece compreensível em português bíblico moderno.
- source_word: אַנְשֵׁי מָוֶת
  choice: gente condenada à morte
  rationale: O idiomatismo indica pessoas sujeitas à execução ou consideradas merecedoras da morte, não pessoas já mortas; 'gente' evita marcar sexo onde o foco é a família inteira.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: diante do meu senhor, o rei
  rationale: O lamed indica a condição dessas pessoas em relação ao julgamento do rei; 'diante de' expressa essa perspectiva sem tornar explícito além do hebraico quem pronunciou a condenação.
- source_word: וַתָּשֶׁת
  choice: Mesmo assim, puseste
  rationale: O verbo significa pôr ou colocar, e 'mesmo assim' torna natural em português o contraste contextual introduzido pelo waw.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: Neste contexto, é uma autodesignação cortês e humilde perante o rei, não uma afirmação necessária de escravidão.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: entre os que comem à tua mesa
  rationale: Mantém a imagem concreta da participação privilegiada e dependente à mesa real.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Que direito ainda tenho
  rationale: צְדָקָה designa aqui uma reivindicação justa ou base legítima para apelar, e não primariamente virtude moral pessoal.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: de voltar a clamar ao rei
  rationale: זעק conserva a força de clamar em petição ou queixa; 'voltar a' transmite o valor contextual de עוֹד de fazer isso novamente.
theological_decisions:
- issue: Sentido de אַנְשֵׁי מָוֶת
  choice: gente condenada à morte
  alternative: homens de morte
  rationale: A tradução explicita o sentido jurídico-contextual do idiomatismo sem introduzir uma doutrina sobre culpa herdada ou condenação divina.
- issue: Sentido de צְדָקָה
  choice: direito
  alternative: justiça
  rationale: Neste pedido dirigido ao rei, o termo aponta para uma reivindicação justa ou título para apelar; traduzir simplesmente por 'justiça' poderia sugerir aqui justiça moral abstrata.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento tradicionais ('meu senhor', 'teu', 'puseste') coerentes com a fala cortesã dirigida ao rei. A sintaxe foi levemente reorganizada para fluidez, preservando a força retórica e as ambiguidades relevantes do hebraico.
