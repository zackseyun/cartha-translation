    issue: «Palácio» torna «casa» excessivamente específico.
    rationale: בַּיִת significa literalmente «casa» e pode referir-se à residência real no contexto, mas não exige nem afirma especificamente um palácio.
  - severity: low
    issue: A alternância «palácio»/«residência» elimina a repetição de «sua casa».
    rationale: O hebraico emprega בֵּיתוֹ nas duas ocorrências; manter «sua casa» preserva a formulação e evita interpretar de modo diferente cada uso.
  - severity: low
    issue: «Visto que» explicita uma relação causal que o conectivo hebraico não determina.
    rationale: «Quando» representa de modo mais neutro a cláusula que descreve a chegada da palavra/mensagem de todo Israel.
