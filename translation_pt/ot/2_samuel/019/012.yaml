base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: pt
  text: 'O rei Davi mandou dizer aos sacerdotes Zadoque e Abiatar: “Digam aos anciãos de Judá: ‘Por que vocês seriam os últimos a trazer o rei de volta à sua casa, quando a mensagem de todo o Israel já chegou ao rei, à sua casa?[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando a proposta — ou o apelo — de todo o Israel chegou ao rei, à sua casa”. A expressão hebraica traduzida como “a mensagem de todo o Israel” é ampla e também pode se referir à notícia, proposta ou solicitação das tribos para que Davi voltasse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: mandou uma mensagem a
  rationale: Com אֶל e destinatários nomeados, o verbo descreve o envio de uma comunicação. A explicitação de “uma mensagem” produz português natural sem sugerir que Davi convocou os sacerdotes.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma corrente em português para o título seguido do nome, preservando a identificação real.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do plural que identifica o ofício de Zadoque e Abiatar.
- source_word: דַּבְּרוּ אֶל
  choice: Digam a
  rationale: No contexto de uma mensagem a ser transmitida, “digam a” comunica naturalmente a ordem, sem alterar seu conteúdo.
- source_word: זִקְנֵי יְהוּדָה
  choice: os anciãos de Judá
  rationale: Expressão tradicional e inteligível para os líderes comunitários e políticos de Judá.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Por que vocês seriam os últimos
  rationale: O condicional traduz bem a força retórica e exortativa do imperfeito hebraico.
- source_word: לְהָשִׁיב
  choice: a trazer ... de volta
  rationale: 'Preserva o sentido causativo de שוב: fazer o rei retornar, e não apenas descrever seu próprio retorno.'
- source_word: אֶת הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: o rei de volta ao seu palácio
  rationale: בַּיִת pode designar a residência real; “palácio” esclarece o destino institucional do rei no contexto, sem empregar o coloquial “para casa”.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: visto que a mensagem de todo o Israel
  rationale: דָּבָר é semanticamente amplo; “mensagem” é natural no contexto, enquanto a nota preserva as possibilidades de “proposta”, “apelo” ou “notícia”.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: já chegou ao rei
  rationale: O perfeito indica que a comunicação já o alcançou; “já” explicita a anterioridade relevante ao contraste retórico.
- source_word: אֶל בֵּיתוֹ
  choice: em sua residência
  rationale: Neste segundo uso, a preposição com בַּיִת provavelmente localiza o rei quando a mensagem o alcançou. “Residência” evita repetir “palácio” e mantém o referente claro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala dentro da fala foi preservada. A construção hebraica repetida com “casa” foi diferenciada como “palácio” e “residência” para clareza natural; a ambiguidade principal de דָּבָר foi mantida por meio de nota.
