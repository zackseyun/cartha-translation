revisions:
- from: 'Então o rei Davi mandou uma mensagem aos sacerdotes Zadoque e Abiatar: “Digam aos anciãos de Judá: ‘Por que vocês seriam os últimos a trazer o rei de volta ao seu palácio, visto que a mensagem de todo o Israel já chegou ao rei em sua residência?[a]’”'
  to: 'O rei Davi mandou dizer aos sacerdotes Zadoque e Abiatar: “Digam aos anciãos de Judá: ‘Por que vocês seriam os últimos a trazer o rei de volta à sua casa, quando a mensagem de todo o Israel já chegou ao rei, à sua casa?[a]’”'
  rationale: A revisão retira a especificação não exigida de «palácio», preserva as duas ocorrências de «casa» e substitui a conexão causal mais interpretativa por «quando». «Mandou dizer» é uma formulação idiomática que conserva o sentido de Davi enviar uma comunicação aos sacerdotes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:22:15Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente os participantes, a ordem aos sacerdotes, os anciãos de Judá, a pergunta retórica e a amplitude de דָּבָר («mensagem»). Contudo, «palácio» especifica indevidamente בַּיִת («casa») e a diferenciação entre «palácio» e «residência» obscurece a repetição deliberada de «sua casa» no hebraico. A relação introduzida por וּדְבַר é mais seguramente mantida por «quando», sem impor a explicação causal de «visto que».
  naturalness: O português é claro e de registro apropriado. «Mandou dizer aos sacerdotes...» é uma forma natural que evita introduzir «uma mensagem» como objeto explícito, preservando mais de perto a construção hebraica. A repetição de «sua casa» permanece inteligível e formalmente adequada.
  terminology: «Rei Davi», «sacerdotes», «anciãos de Judá» e «trazer ... de volta» são adequados. «Casa» deve ser preferido a «palácio» ou «residência», pois o hebraico não especifica palácio e repete o mesmo termo nas duas ocorrências.
