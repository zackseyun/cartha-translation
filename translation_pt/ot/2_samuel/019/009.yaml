base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: pt
  text: 'Então o rei se levantou e se sentou à porta da cidade[a]. Informaram a todo o povo, dizendo: “Vejam, o rei está sentado à porta da cidade.” Então todo o povo se apresentou diante do rei. Israel, porém,[b] havia fugido, cada homem para as suas tendas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A porta da cidade era também um espaço público onde se tratavam assuntos administrativos e judiciais.
    reason: cultural_note
  - marker: b
    text: 'Ou: “E Israel fugiu”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “porém” explicita o contraste no contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cada homem para as suas tendas”, expressão idiomática para a dispersão de cada um ao seu lugar de moradia ou território tribal.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então o rei se levantou
  rationale: O wayyiqtol de קום dá sequência à narrativa. “Levantou-se” é natural em português e preserva o movimento do relato.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: se sentou à porta da cidade
  rationale: ישׁב indica que o rei tomou assento; שׁער designa aqui o complexo da porta urbana, local público de reunião e administração. A explicitação “da cidade” evita que o leitor pense na porta de uma casa.
- source_word: הִגִּידוּ לֵאמֹר
  choice: Informaram a todo o povo
  rationale: O hifil de נגד significa informar, anunciar ou relatar. O sujeito plural indefinido é adequadamente mantido sem ser identificado, e a fórmula לֵאמֹר é expressa naturalmente pelos dois-pontos antes da fala.
- source_word: הִנֵּה
  choice: O rei está sentado
  rationale: הִנֵּה chama atenção para uma situação presente. Em português, a afirmação direta no discurso anunciado transmite esse valor com naturalidade; “eis que” seria possível, mas menos corrente.
- source_word: וַיָּבֹא כָל־הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Então todo o povo se apresentou diante do rei
  rationale: בוא לפני descreve a ida à presença de alguém. “Apresentou-se diante” preserva o cenário de audiência pública sem impor uma cerimônia específica.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Israel, porém, havia fugido
  rationale: O qatal נָס funciona naturalmente como informação anterior ou de pano de fundo. “Havia fugido” marca essa relação temporal, enquanto “porém” torna explícito o contraste contextual sem ocultar a possibilidade mais simples de traduzir וְ por “e”.
- source_word: אִישׁ לְאֹהָלָיו
  choice: cada homem para a sua tenda
  rationale: A expressão distributiva é literalmente masculina e conserva a imagem hebraica da dispersão de cada homem para sua tenda, isto é, para seu lugar de residência ou núcleo tribal.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ
  choice: cada homem
  alternative: cada um; todos
  rationale: Mantém o masculino singular explícito do hebraico e sua forma distributiva, sem neutralizá-lo nem ampliar indevidamente o referente.
- issue: Relação lógica introduzida por וְ antes de יִשְׂרָאֵל
  choice: porém
  alternative: e
  rationale: O contexto favorece um contraste entre o povo que comparece diante de Davi e Israel que se dispersara, mas a nota preserva a leitura coordenativa mais simples permitida pela conjunção hebraica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe narrativa é fluente sem perder a sequência e as imagens do hebraico. A pontuação elimina a reprodução mecânica de לֵאמֹר, e as notas preservam tanto a alternativa da conjunção quanto o sentido cultural da porta e da tenda.
