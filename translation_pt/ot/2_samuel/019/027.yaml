base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: pt
  text: 'E ele caluniou o teu servo diante do meu senhor, o rei[a], pois o teu servo disse: “Vou selar o jumento para mim, montá-lo e ir com o rei”, porque o teu servo tem dificuldade para andar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enganou o teu servo” ou “traiu o teu servo”. O verbo hebraico pode indicar engano ou conduta traiçoeira; “caluniou” foi adotado aqui porque o contexto trata de um relato falso apresentado ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: caluniou
  rationale: No contexto, o servo é acusado de apresentar ao rei um relato falso sobre Mefibosete. “Caluniou” expressa essa difamação, enquanto o verbo hebraico também pode abranger engano ou traição.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Designa o atendente pessoal de Mefibosete; “servo” é natural no contexto da casa real e não força a questão da condição jurídica.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Preserva a fórmula respeitosa de tratamento dirigida ao rei em português claro e solene.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Vou selar o jumento para mim
  rationale: O verbo de primeira pessoa tem valor volitivo ou intencional; “vou selar” comunica naturalmente o propósito declarado. חבש, com animal de montaria, significa preparar ou selar.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: montá-lo
  rationale: Traduz de modo idiomático o ato de subir no jumento e cavalgar, mantendo a sequência da intenção expressa.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: e ir com o rei
  rationale: הלך com אֶת indica acompanhamento; não se trata simplesmente de ir até o rei.
- source_word: פִסֵּחַ
  choice: aleijado
  rationale: Expressa a limitação física concreta descrita no texto. Aqui funciona como descrição narrativa, não como termo figurado.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: Mantém a autodesignação deferente usada diante do rei, em registro bíblico digno e amplamente compreensível.
