  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: pt
  text: 'Em todas as tribos de Israel, todo o povo discutia[a], dizendo: “O rei nos livrou do poder de nossos inimigos e nos salvou do poder dos filisteus[b], mas agora fugiu do país por causa de Absalão[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “debatia” ou “estava em disputa”. O hebraico sugere uma controvérsia generalizada entre as tribos, não apenas uma conversa casual.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da mão de nossos inimigos” e “da mão dos filisteus”; em hebraico, “mão” pode representar poder ou domínio.
    reason: lexical_alternative
  - marker: c
    text: Ou “para longe de Absalão” ou “de diante de Absalão”. A expressão hebraica, após o verbo “fugiu”, pode indicar afastamento de Absalão ou fuga por causa dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: discutia
  rationale: O particípio nifal de דין descreve aqui uma controvérsia ou deliberação ativa e generalizada. “Discutia” preserva essa força sem sugerir necessariamente uma briga.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: por todas as tribos de Israel
  rationale: Expressa de modo natural a extensão da discussão entre as tribos de toda a nação.
- source_word: הִצִּילָנוּ
  choice: nos livrou
  rationale: Verbo adequado ao contexto político-militar e distinto, em português, do verbo seguinte.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: do poder de nossos inimigos
  rationale: Comunica claramente o sentido do idioma hebraico “da mão de”, isto é, sob o poder ou domínio de alguém.
- source_word: מִלְּטָנוּ
  choice: nos salvou
  rationale: Preserva o sentido de resgate e evita repetir “livrou”, mantendo o paralelismo sem apagar a distinção verbal.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: do poder dos filisteus
  rationale: Mantém em português o paralelismo com a expressão anterior e explicita o sentido idiomático de כף.
- source_word: וְעַתָּה
  choice: mas agora
  rationale: A conjunção introduz um contraste contextual entre os feitos passados do rei e sua fuga presente.
- source_word: בָּרַח מִן הָאָרֶץ
  choice: fugiu do país
  rationale: “País” comunica naturalmente que Davi deixou o território, enquanto “fugiu da terra” seria menos idiomático no português atual.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: por causa de Absalão
  rationale: Após um verbo de fuga, a expressão indica afastamento diante da pressão ou ameaça de Absalão; a formulação preserva a relação causal sem impor uma precisão maior que a do hebraico.
