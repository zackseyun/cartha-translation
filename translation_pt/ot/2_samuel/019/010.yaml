    rationale: A alternativa literal deve ser «de diante de Absalão» (ou, mais livremente, «para longe de Absalão»), não apenas «diante de Absalão». Além disso, «pressão ou ameaça» interpreta o contexto, mas não é explicitamente afirmado pela expressão hebraica; a nota deve conservar a amplitude causal/espacial.
