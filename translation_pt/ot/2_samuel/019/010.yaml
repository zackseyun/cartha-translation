  source_fidelity: 'O sentido central está bem preservado: a controvérsia generalizada, as duas ações de livramento, o contraste introduzido por «mas agora» e a fuga de Davi relacionada a Absalão. «Por causa de Absalão» é uma solução moderna defensável para מֵעַל após «fugiu». Convém, porém, ajustar a nota correspondente para não apresentar «diante de Absalão» como equivalente isolado nem explicitar «pressão ou ameaça» como se fosse informação lexicalmente expressa.'
  naturalness: «Em todas as tribos de Israel» é mais idiomático e menos ambíguo do que «por todas as tribos de Israel» neste contexto. O restante tem registro moderno, claro e apropriado.
  terminology: «Rei», «filisteus», «Absalão», «livrou» e «salvou» são adequados. A explicitação de «poder» para o idiomatismo hebraico «mão» é clara e o paralelismo foi mantido.
