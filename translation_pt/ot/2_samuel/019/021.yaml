base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: pt
  text: 'Pois o teu servo sabe que pequei. E veja: hoje vim como o primeiro de toda a casa de José[a][b] a descer ao encontro do rei, meu senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A casa de José” designa as tribos descendentes de José, especialmente os agrupamentos tribais do norte associados a Efraim e Manassés.
    reason: cultural_note
  - marker: b
    text: 'Ou: “dentre toda a casa de José”. A construção hebraica também pode indicar que ele foi o primeiro a vir de todo o grupo ligado a José.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão apresentada por Simei em apoio à sua súplica e mantém a ligação discursiva natural em português.
- source_word: יָדַע עַבְדְּךָ
  choice: o teu servo sabe
  rationale: O perfeito expressa um estado presente de consciência; “teu servo” preserva a autodesignação deferente própria da linguagem dirigida ao rei.
- source_word: כִּי אֲנִי חָטָאתִי
  choice: que pequei
  rationale: Mantém o sentido moral e religioso normal de חטא e apresenta a ação passada como uma confissão atual, sem a redundância pouco natural de “que eu pequei”.
- source_word: וְהִנֵּה
  choice: 'E veja:'
  rationale: Conserva a força de chamar a atenção para a presença e a ação de Simei, em linguagem moderna e digna, sem recorrer ao arcaizante “eis”.
- source_word: בָאתִי הַיּוֹם
  choice: hoje vim
  rationale: Expressa a chegada já realizada e a presença atual do falante diante do rei.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: como o primeiro de toda a casa de José
  rationale: Apresenta רִאשׁוֹן predicativamente e preserva “casa de José” como designação coletiva, sem substituir o nome por uma interpretação tribal específica.
- source_word: לָרֶדֶת לִקְרַאת
  choice: a descer ao encontro de
  rationale: Preserva tanto o movimento descendente indicado por ירד quanto a ideia de deslocar-se para receber ou encontrar alguém.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: do rei, meu senhor
  rationale: Mantém os dois elementos do tratamento real e os organiza numa forma clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com tratamento em segunda pessoa (“teu”) e vocabulário bíblico amplamente compreensível. A formulação conserva a repetição semântica entre “vim” e “a descer”, presente na estrutura hebraica, e mantém a ambiguidade da relação marcada por לְ em “de toda a casa de José”, esclarecida em nota.
