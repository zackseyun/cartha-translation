base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: pt
  text: 'Então todos os homens de Judá responderam aos homens de Israel[a]: “Porque o rei é nosso parente próximo[b]. Por que, então, vocês ficaram irados por causa disso? Por acaso comemos alguma coisa às custas do rei? Ou ele nos deu algum presente?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “ao homem de Israel”, usando o singular em sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “o rei está perto de mim”; aqui, a proximidade provavelmente se refere a parentesco ou afinidade tribal.
    reason: lexical_alternative
  - marker: c
    text: Ou, possivelmente, “foi-nos trazida alguma coisa?”. O hebraico da cláusula final é difícil; no contexto, a pergunta nega que Judá tenha recebido algum benefício do rei.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Então ... responderam
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: todos os homens de Judá
  rationale: A expressão singular distributiva tem sentido coletivo. O plural é a forma natural em português e concorda com o grupo que fala.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: aos homens de Israel
  rationale: Embora אִישׁ esteja no singular, ele representa coletivamente os israelitas nesse confronto. A preposição עַל após ענה indica aqui a parte à qual se responde.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Porque o rei é nosso parente próximo
  rationale: קָרוֹב אֶל indica proximidade, provavelmente de parentesco ou afinidade tribal neste contexto. O plural “nosso” explicita em português a voz coletiva de Judá sem alterar o referente.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Por que, então, vocês ficaram irados por causa disso?
  rationale: חָרָה é um idiomatismo para ira. “Por causa disso” representa הַדָּבָר הַזֶּה como a questão em disputa.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Por acaso comemos alguma coisa às custas do rei?
  rationale: O infinitivo absoluto com o verbo finito reforça a pergunta retórica. “Por acaso” e “alguma coisa” preservam a ênfase, enquanto “às custas do rei” comunica o benefício material implícito em מִן הַמֶּלֶךְ.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Ou recebemos dele algum presente?
  rationale: A cláusula hebraica é difícil e emprega formas de נשׂא. No paralelismo, nega que Judá tenha recebido vantagem do rei; esta formulação é natural sem ocultar a incerteza, registrada em nota.
