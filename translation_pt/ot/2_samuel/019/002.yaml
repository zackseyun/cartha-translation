base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: pt
  text: 'E disseram a Joabe: “Veja, o rei está chorando e lamentando por Absalão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: E disseram
  rationale: O hofal de נגד indica que a informação foi comunicada a Joabe sem identificar o agente. Em português, a construção com sujeito indeterminado é mais natural que a passiva e mantém o agente sem identificação.
- source_word: לְיוֹאָב
  choice: a Joabe
  rationale: A preposição marca o destinatário da informação; o nome é transliterado na forma portuguesa consagrada.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção para o conteúdo da notícia. “Veja” conserva a vivacidade do relato em linguagem atual e digna.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido usado no hebraico, em vez de substituí-lo pelo nome de Davi.
- source_word: בֹּכֶה
  choice: está chorando
  rationale: O particípio descreve uma ação em curso; a perífrase portuguesa expressa claramente esse aspecto durativo.
- source_word: וַיִּתְאַבֵּל
  choice: e lamentando
  rationale: O hitpael de אבל descreve a manifestação de luto. A coordenação com “está chorando” apresenta ambas as ações como parte do estado contínuo do rei.
- source_word: עַל אַבְשָׁלֹם
  choice: por Absalão
  rationale: Com verbo de luto, עַל indica a pessoa que é objeto ou causa do pesar. “Lamentar por” é natural em português e preserva essa relação.
