  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: pt
  text: 'Então o rei disse a Simei: “Você não morrerá[a].” E o rei lhe jurou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Você não será executado”. O hebraico diz literalmente: “Você não morrerá”, expressão que aqui pode funcionar como uma promessa régia de não execução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido se refere ao rei já conhecido no contexto.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֹא תָמוּת
  choice: Você não morrerá
  rationale: Preserva a forma direta da promessa ou declaração régia sem explicitar além do hebraico se o sentido é não morrer naquele momento ou não ser executado.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: E o rei lhe fez esse juramento
  rationale: Expressa de maneira idiomática o verbo hebraico no nifal, “jurar”, com o destinatário pronominal; “esse” vincula o juramento à garantia imediatamente anterior sem acrescentar conteúdo.
theological_decisions:
- issue: Alcance da promessa régia לֹא תָמוּת
  choice: Você não morrerá
  alternative: Você não será morto
  rationale: A tradução principal conserva a ambiguidade e a formulação literal do hebraico; a alternativa explicita a possível referência ao perdão da execução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala direta usa “você”, natural no português brasileiro contemporâneo, enquanto “lhe fez esse juramento” mantém um tom narrativo respeitoso e idiomático.
