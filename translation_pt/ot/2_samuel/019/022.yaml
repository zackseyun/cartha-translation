  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: pt
  text: 'Mas Abisai, filho de Zeruia, respondeu: “Por causa disso, Simei não deve ser morto, já que amaldiçoou o ungido de Yahweh?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A combinação narrativa introduz uma resposta verbal; em português, “respondeu” expressa naturalmente ambos os verbos sem a redundância pouco idiomática “respondeu e disse”.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abisai, filho de Zeruia
  rationale: Emprega as formas portuguesas correntes dos nomes e conserva a identificação familiar do hebraico.
- source_word: הֲתַחַת זֹאת
  choice: Por causa disso ...?
  rationale: 'Expressa o valor causal da locução hebraica no contexto: Abisai pergunta se a conduta mencionada deve resultar na execução de Simei.'
- source_word: לֹא יוּמַת
  choice: não deve ser morto
  rationale: O Hofal de מות indica que alguém é levado à morte, aqui como punição; a formulação preserva a pergunta retórica sem transformar a proposta em simples previsão.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: כִּי
  choice: já que
  rationale: Introduz claramente a razão alegada por Abisai, com fluência natural em português.
- source_word: קִלֵּל
  choice: amaldiçoou
  rationale: Preserva a força do verbo e sua ligação com a maldição proferida por Simei no relato anterior.
- source_word: מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: Mantém a construção que designa o rei consagrado por Yahweh e verte explicitamente o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” representa diretamente o nome pessoal e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
- issue: Sentido de מְשִׁיחַ
  choice: ungido
  alternative: rei escolhido
  rationale: “Ungido” conserva a imagem e o título institucional do hebraico, sem explicitar além do texto a natureza da função régia.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação hebraica “respondeu e disse” foi condensada para “respondeu”, uso natural em narrativa portuguesa. A pergunta retórica e a justificativa de Abisai foram preservadas.
