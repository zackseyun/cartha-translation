base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: pt
  text: 'E eis que todos os homens de Israel[b] vieram até o rei e disseram ao rei: “Por que nossos irmãos, os homens de Judá, roubaram o senhor[a] e fizeram o rei, os de sua casa e todos os homens de Davi que estavam com ele atravessar o Jordão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levaram o senhor às escondidas”. O hebraico emprega o verbo comum para “roubar” como metáfora da ação de Judá sem a participação dos demais israelitas.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “todos os homens de Israel” e, depois, “os homens de Judá”, empregando linguagem coletiva masculina para os grupos representados.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Conserva a função de chamar a atenção e a vivacidade narrativa de הִנֵּה, em registro bíblico digno e ainda compreensível.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: אִישׁ está no singular formal, mas tem sentido coletivo; a tradução mantém a formulação masculina representativa do hebraico.
- source_word: בָּאִים
  choice: vieram
  rationale: O particípio, no fluxo narrativo, é expresso naturalmente pelo pretérito perfeito em português.
- source_word: גְּנָבוּךָ
  choice: roubaram o senhor de nós
  rationale: Preserva a metáfora acusatória do verbo comum גנב, ‘roubar’, enquanto ‘de nós’ explicita de modo natural em português a apropriação política implícita no contexto, sem sugerir sequestro literal.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: nossos irmãos, os homens de Judá
  rationale: Mantém tanto a linguagem de parentesco dentro de Israel quanto o valor coletivo de אִישׁ.
- source_word: וַיַּעֲבִרוּ
  choice: fizeram ... atravessar
  rationale: Reproduz diretamente o sentido causativo da forma hifil de עבר.
- source_word: בֵּיתוֹ
  choice: os de sua casa
  rationale: Indica as pessoas pertencentes à casa do rei, e não um edifício, sem limitar indevidamente a expressão apenas à família nuclear.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma tradicional e natural em português; o hebraico apresenta apenas o nome próprio.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: e todos os homens de Davi que estavam com ele
  rationale: Mantém a coordenação com os demais objetos do verbo causativo e expressa com clareza o acompanhamento indicado por עִמּוֹ.
