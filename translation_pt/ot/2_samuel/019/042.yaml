translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” preserva a vivacidade do marcador discursivo hebraico; “o senhor” traduz com naturalidade o pronome dirigido ao rei. A ordem dos marcadores foi ajustada para que cada nota acompanhe a expressão à qual realmente se refere.
