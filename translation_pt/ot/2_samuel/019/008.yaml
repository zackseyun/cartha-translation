  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: pt
  text: 'Agora, levante-se, saia e fale ao coração dos seus servos[a], pois juro por Yahweh: se você não sair, nem um só homem ficará com você esta noite. Isso será pior para você do que toda a adversidade que lhe sobreveio desde a sua juventude até agora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “fale ao coração dos seus servos”, expressão que significa falar com bondade, de modo tranquilizador, encorajador ou persuasivo.'
    reason: Explica o sentido possível do idioma hebraico preservado no texto principal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição urgente no discurso de forma direta e natural.
- source_word: קוּם צֵא
  choice: levante-se, saia
  rationale: Preserva os dois imperativos e a sequência concreta de ações.
- source_word: וְדַבֵּר עַל־לֵב
  choice: fale ao coração de
  rationale: Mantém a imagem transparente do idioma hebraico, cujo sentido contextual envolve falar de modo encorajador, tranquilizador ou persuasivo.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: No contexto régio e militar, designa os homens subordinados a Davi, sem exigir ênfase na condição de escravidão.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: pois juro por Yahweh
  rationale: Expressa naturalmente a força declarativa do juramento e translitera o nome divino presente no hebraico.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: se você não sair
  rationale: Reproduz com clareza a condição negativa que introduz a advertência juramentada.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: nem um só homem ficará com você esta noite
  rationale: O verbo indica permanecer ou passar a noite; “nem um só homem” conserva a forma masculina singular e reforça a ameaça de deserção total.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: Isso será pior para você do que toda a adversidade
  rationale: O contexto e a construção comparativa apontam para calamidade ou infortúnio, não para maldade moral; “adversidade” preserva essa amplitude.
- source_word: אֲשֶׁר בָּאָה עָלֶיךָ
  choice: que lhe sobreveio
  rationale: Formulação digna e corrente que comunica males ocorridos contra a pessoa.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: desde a sua juventude até agora
  rationale: Mantém o intervalo temporal completo indicado pelo hebraico.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de רָעָה neste contexto
  choice: adversidade
  alternative: mal / calamidade / desgraça
  rationale: A palavra se refere aqui aos infortúnios sofridos por Davi, não necessariamente ao mal moral; a escolha evita resolver o termo nessa direção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe urgente da fala foi mantida, assim como a imagem hebraica “falar ao coração”. O pronome “você” oferece clareza contemporânea sem tornar o registro coloquial.
