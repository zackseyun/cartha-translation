  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: pt
  text: Ele caluniou o teu servo diante do meu senhor, o rei. Mas o meu senhor, o rei, é como o anjo de Deus; portanto, faze o que parecer bom aos teus olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Ele caluniou
  rationale: O verbo, nesta construção, indica difamar ou apresentar acusações maliciosas; “caluniou” comunica com naturalidade a denúncia de Mefibosete contra Ziba.
- source_word: בְּעַבְדְּךָ אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: o teu servo diante do meu senhor, o rei
  rationale: Preserva a autodesignação humilde na terceira pessoa e entende אֶל como indicando a pessoa perante quem a calúnia foi apresentada.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: como o anjo de Deus
  rationale: Tradução formal que conserva a comparação cortesã e sua possível alusão a discernimento ou autoridade extraordinários, sem explicá-la no texto.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: portanto, faze o que parecer bom aos teus olhos
  rationale: A sequência com וַ recebe valor consequencial no contexto. A expressão idiomática é mantida de modo inteligível, indicando que a decisão fica a critério do rei.
theological_decisions:
- issue: Sentido de “anjo de Deus”
  choice: Manter literalmente “o anjo de Deus”
  alternative: “um anjo de Deus” ou uma paráfrase como “alguém com discernimento divino”
  rationale: O hebraico contém artigo definido, e a formulação literal preserva a linguagem do narrador/personagem sem impor uma identificação ou interpretação teológica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento régio em segunda pessoa (“teu”, “faze”) para conservar a relação retórica do hebraico. A pontuação divide a longa coordenação hebraica em duas frases para maior clareza, sem alterar o encadeamento lógico.
