  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: pt
  text: 'Então o homem de Israel respondeu ao homem de Judá: “Tenho dez partes no rei[a] e também tenho maior direito a Davi do que você.[b] Por que, então, você me tratou como alguém sem importância? Não fui eu o primeiro a propor que meu rei voltasse?[c]” Mas as palavras dos homens de Judá foram mais duras do que as dos homens de Israel.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “tenho dez mãos no rei”, expressão idiomática que significa dez partes, porções ou direitos — provavelmente em referência à reivindicação das dez tribos do norte em contraste com Judá.
    reason: cultural_note
  - marker: b
    text: 'Ou: “também tenho maior participação em Davi do que você”. O hebraico é elíptico, mas expressa uma comparação de direito ou participação.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Não foi minha palavra a primeira a tratar de trazer de volta o meu rei?” A frase hebraica é elíptica e pode referir-se à prioridade de Israel em propor a volta do rei.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “foram mais fortes” ou “mais veementes”. O termo hebraico pode indicar dureza, severidade ou força na fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: o homem de Israel / o homem de Judá
  rationale: Os singulares funcionam de modo representativo, provavelmente indicando o porta-voz de cada grupo. A forma singular é preservada no diálogo, enquanto o resumo final explicita naturalmente o sentido coletivo.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: Tenho dez partes no rei
  rationale: יָדוֹת significa literalmente “mãos”, mas aqui é uma expressão idiomática para partes, porções ou direitos. “Dez partes” preserva a imagem de participação e remete às dez tribos do norte sem inserir essa explicação no texto.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: e, além disso, tenho mais direito sobre Davi do que você
  rationale: A construção hebraica é elíptica e comparativa. O contexto indica uma reivindicação maior sobre Davi, não superioridade pessoal em sentido geral; a tradução explicita apenas o elemento necessário para comunicar essa relação.
- source_word: הֱקִלֹּתַנִי
  choice: você me tratou como alguém sem importância
  rationale: O hifil de קלל expressa tratar alguém como leve, insignificante ou de pouca consideração. A formulação comunica a afronta em português atual sem intensificá-la indevidamente para “odiar” ou “desprezar”.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Não foi minha proposta a primeira para trazer de volta o meu rei?
  rationale: דָבָר pode significar palavra, assunto ou proposta. A frase é elíptica, mas afirma a prioridade de Israel na iniciativa de restaurar o rei; “proposta” torna essa função clara sem resolver além do necessário.
- source_word: מַלְכִּי
  choice: o meu rei
  rationale: O sufixo de primeira pessoa é explícito e retoricamente importante, pois expressa lealdade e reivindicação pessoal; por isso, não foi reduzido a “o rei”.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: as palavras dos homens de Judá foram mais duras do que as dos homens de Israel
  rationale: קשׁה indica dureza, severidade ou aspereza. O singular אִישׁ tem sentido coletivo neste resumo, expresso naturalmente pelo plural em português; “mais duras” mantém aberta a nuance entre maior aspereza e maior veemência.
