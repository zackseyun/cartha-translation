    issue: Construção pouco natural em «Não foi minha proposta a primeira para trazer de volta o meu rei?»
    rationale: A frase reproduz a elipse hebraica de modo excessivamente literal. «Não fui eu o primeiro a propor que meu rei voltasse?» preserva a prioridade da iniciativa e é idiomática.
  - severity: low
    issue: «Mais direito sobre Davi» pode sugerir controle ou posse sobre uma pessoa.
    rationale: No contexto, a comparação diz respeito à participação ou reivindicação em relação a Davi como rei. «Maior direito a Davi» é mais natural em português e mantém essa nuance.
