base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: pt
  text: 'Então o rei disse a Barzilai: “Atravesse comigo, e eu o sustentarei junto de mim, em Jerusalém.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Substantivo definido que, no contexto, se refere a Davi.
- source_word: בַּרְזִלָּי
  choice: Barzilai
  rationale: Transliteração corrente do nome próprio hebraico, clara para leitores de língua portuguesa.
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: Atravesse comigo
  rationale: O imperativo עֲבֹר refere-se concretamente à travessia no contexto do Jordão. O pronome independente אַתָּה enfatiza o destinatário, mas sua tradução explícita como “você” seria pouco natural antes do imperativo em português; a forma verbal preserva a referência pessoal.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: e eu cuidarei do seu sustento
  rationale: כלכל descreve a provisão contínua das necessidades de alguém. A formulação é atual, digna e evita a possível leitura meramente emocional de “apoiarei”.
- source_word: עִמָּדִי
  choice: junto de mim
  rationale: Preserva a ideia de permanência na companhia do rei e distingue esta expressão do אִתִּי anterior sem ampliar o sentido para “sob meus cuidados”.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução direta do topônimo com a preposição ב.
theological_decisions: []
