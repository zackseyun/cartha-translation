  terminology: “Balsa”, “casa do rei”, “Simei”, “prostrou-se” e “Jordão” são escolhas adequadas. Mantém-se “casa do rei” para preservar a formulação hebraica, com nota que esclarece seu sentido coletivo sem restringi-lo indevidamente.
