  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: pt
  text: A balsa atravessou para levar a casa do rei para o outro lado[b] e para fazer o que lhe agradasse[c]. Simei, filho de Gera, prostrou-se diante do rei quando este atravessava o Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Aqui, “a casa do rei” se refere às pessoas da casa real e aos que a acompanhavam, não ao edifício onde o rei morava.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “fazer o bem aos olhos dele”, expressão que significa fazer o que lhe agradasse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: a balsa
  rationale: O substantivo designa aqui o meio usado para atravessar o rio. “Balsa” é uma expressão natural e suficientemente abrangente em português; a natureza exata da embarcação não é certa.
- source_word: וְעָבְרָה
  choice: atravessou
  rationale: O perfeito qal feminino concorda com הָעֲבָרָה. O pretérito perfeito simples exprime naturalmente a ação na sequência narrativa, sem impor anterioridade além do que o hebraico exige.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: para transportar a casa do rei
  rationale: O infinitivo hifil expressa fazer passar ou transportar para o outro lado. “Casa do rei” preserva a expressão hebraica, entendida no contexto como as pessoas e os bens ligados à casa real, não o edifício.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: A tradução mantém o sentido coletivo e dinástico de בַּיִת, esclarecido em nota para evitar que seja entendido como o palácio físico.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: e fazer o que lhe agradasse
  rationale: A expressão idiomática literal “fazer o bem aos olhos dele” indica fazer o que alguém considera bom ou deseja. A formulação portuguesa comunica esse sentido com naturalidade.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: prostrou-se diante do rei
  rationale: Embora literalmente diga “caiu diante do rei”, o contexto indica um gesto deliberado de submissão e súplica; “prostrou-se” transmite a ação com clareza.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: quando este atravessava o Jordão
  rationale: A construção infinitiva tem valor temporal. “Este” aponta naturalmente para o rei, o antecedente mais próximo, sem repetir o substantivo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção narrativa natural. Mantém-se “casa do rei” para preservar a imagem e a amplitude da expressão hebraica, acompanhada de esclarecimento. Os marcadores seguem as letras pertinentes da camada de consulta inglesa; a nota [a] foi omitida porque “balsa” já é uma opção portuguesa clara e a alternativa não acrescentaria informação necessária.
