base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: pt
  text: 'Barzilai disse ao rei: “Quantos são os dias dos anos da minha vida, para que eu suba com o rei a Jerusalém?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” é natural e fiel ao hebraico.
- source_word: בַּרְזִלַּי
  choice: Barzilai
  rationale: Transliteração corrente e legível do nome próprio hebraico.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Preserva o substantivo definido do hebraico sem acrescentar o nome de Davi.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: Quantos serão ainda os dias dos anos da minha vida
  rationale: Mantém a expressão hebraica enfática “dias dos anos da minha vida”; “serão ainda” torna clara, em português natural, a referência retórica ao tempo restante.
- source_word: כִּי אֶעֱלֶה
  choice: para que eu suba
  rationale: Reproduz a nuance modal/final da pergunta retórica e conserva a ideia bíblica de subir a Jerusalém.
- source_word: אֶת הַמֶּלֶךְ
  choice: com o rei
  rationale: Neste contexto, אֶת tem valor de acompanhamento, não de objeto direto.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa convencional do topônimo.
