base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: pt
  text: 'E o rei cobriu o rosto[a] e clamou em alta voz: “Meu filho Absalão! Absalão, meu filho, meu filho!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “envolveu o rosto” ou “velou o rosto”. O verbo hebraico sugere cobrir o rosto em sinal de luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: cobriu
  rationale: O verbo indica envolver ou cobrir; com “o rosto” como objeto e no contexto de luto, “cobriu” é a opção mais natural e evita especificar indevidamente como isso foi feito.
- source_word: פָּנָיו
  choice: o rosto
  rationale: Aqui o sentido concreto é exigido pela ação de cobrir e pelo contexto de luto.
- source_word: וַיִּזְעַק
  choice: clamou
  rationale: Expressa um grito forte sem determinar se era lamento, choro ou brado; assim, preserva a amplitude do verbo hebraico.
- source_word: קוֹל גָּדוֹל
  choice: em alta voz
  rationale: Equivalente português natural para o idioma hebraico literalmente “com uma grande voz”, mantendo a ênfase na intensidade.
- source_word: בְּנִי
  choice: meu filho
  rationale: Tradução direta do substantivo masculino singular com sufixo de primeira pessoa, emocionalmente adequada ao lamento de Davi.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: repetição de אַבְשָׁלוֹם / בְּנִי
  choice: “Meu filho Absalão! Absalão, meu filho, meu filho!”
  rationale: Conserva integralmente a repetição hebraica, que comunica a intensidade do luto, com pontuação natural em português.
