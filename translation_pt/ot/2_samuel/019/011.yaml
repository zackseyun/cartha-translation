base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: pt
  text: E Absalão, a quem ungimos para reinar sobre nós, morreu na batalha. E agora, por que vocês permanecem calados sobre trazer o rei de volta?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que vocês permanecem calados sobre fazer o rei voltar?”'
    reason: Alternativa lexical para o hifil de שוב (“fazer voltar”), preservando o sentido de silêncio expresso pelo hebraico.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: E Absalão
  rationale: O waw dá continuidade à fala; “E” conserva essa ligação sem impor um contraste que o hebraico não explicita.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: a quem ungimos para reinar sobre nós
  rationale: “Ungimos” preserva o verbo de investidura real, enquanto “para reinar sobre nós” expressa em português natural a relação indicada por עָלֵינוּ no contexto da monarquia.
- source_word: מֵת בַּמִּלְחָמָה
  choice: morreu na batalha
  rationale: Apresenta o acontecimento concluído de modo natural em narrativa portuguesa e mantém o contexto de conflito armado.
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Marca tanto a progressão temporal quanto a conclusão prática tirada da morte de Absalão.
- source_word: מַחֲרִשִׁים
  choice: se calam
  rationale: Conserva o sentido básico de permanecer em silêncio, sem reduzir a expressão à ideia mais interpretativa de hesitar.
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: quanto a trazer o rei de volta
  rationale: O hifil de שׁוּב significa fazer voltar ou trazer de volta; a construção “quanto a” liga naturalmente essa ação ao silêncio no português.
theological_decisions:
- issue: Uso do verbo de unção real em referência a Absalão
  choice: ungimos para reinar sobre nós
  alternative: fizemos rei sobre nós
  rationale: Embora Absalão seja apresentado no enredo como rival de Davi, o texto emprega o verbo comum de unção. Mantê-lo evita inserir no versículo uma avaliação teológica não expressa e preserva o peso político-religioso do ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa naturalmente a segunda pessoa do plural; “para reinar sobre nós” evita o pouco idiomático “ungimos sobre nós” sem apagar a linguagem de unção.
