base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: pt
  text: amando os que odeiam você e odiando os que amam você. Pois hoje você deixou claro que comandantes e servos nada significam para você.[a] Hoje sei que, se Absalão estivesse vivo e todos nós estivéssemos mortos hoje, isso seria certo aos seus olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “você declarou hoje que não há para você comandantes nem servos”. A expressão hebraica indica que, na avaliação de Davi, eles não contavam para nada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se ao menos Absalão estivesse vivo e todos nós estivéssemos mortos hoje”. As palavras de Joabe constituem uma dura acusação contrafactual, não uma citação literal de algo que Davi tenha dito.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: amando os que odeiam você
  rationale: Os particípios substantivados são vertidos verbalmente, preservando o contraste direto. O gerúndio exprime com naturalidade a ação pela qual Joabe acusa Davi no contexto da frase iniciada no versículo anterior.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: e odiando os que amam você
  rationale: Mantém o paralelismo antitético e a força verbal dos termos hebraicos, sem interpretar “os que amam” como amigos ou partidários.
- source_word: הִגַּדְתָּ הַיּוֹם
  choice: hoje você deixou claro
  rationale: No contexto, o verbo não descreve apenas uma declaração verbal; a conduta de Davi demonstrou publicamente sua atitude.
- source_word: שָׂרִים וַעֲבָדִים
  choice: comandantes e servos
  rationale: “Comandantes” corresponde ao cenário militar imediato, enquanto “servos” conserva a amplitude do serviço real sem sugerir necessariamente escravidão.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: comandantes e servos nada significam para você
  rationale: 'Expressa o sentido pragmático da construção: pela conduta de Davi, esses homens parecem não ter valor para ele. A formulação mais literal é preservada em nota.'
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: se Absalão estivesse vivo e todos nós estivéssemos mortos
  rationale: 'A acusação é contrafactual: Joabe afirma que Davi teria preferido a sobrevivência de Absalão à de seus homens leais. A nota registra a possibilidade de realçar o desejo irônico.'
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: isso seria certo aos seus olhos
  rationale: Conserva a imagem hebraica e seu matiz avaliativo, em vez de reduzi-la simplesmente a “isso agradaria você”.
