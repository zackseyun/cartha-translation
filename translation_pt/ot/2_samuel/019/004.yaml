  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: pt
  text: Assim, naquele dia, o povo entrou às escondidas na cidade, como os envergonhados se retiram às escondidas ao fugirem da batalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: entrou furtivamente / fogem às escondidas
  rationale: O verbo hitpael de גנב descreve uma ação feita às ocultas, de modo furtivo. A variação em português evita uma repetição pesada, preservando a correspondência entre a entrada do povo e a retirada vergonhosa dos derrotados.
- source_word: הַנִּכְלָמִים
  choice: envergonhados
  rationale: Expressa diretamente o estado de vergonha ou humilhação indicado pelo particípio.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: depois de terem fugido da batalha
  rationale: בְּנוּסָם indica a circunstância temporal da fuga; 'da batalha' comunica naturalmente que abandonaram o combate, sem sugerir apenas movimento ocorrido dentro dele.
