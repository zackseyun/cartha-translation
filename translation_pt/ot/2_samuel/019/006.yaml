  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: pt
  text: 'Então Joabe entrou na casa[a], foi até o rei e disse: “Hoje o senhor envergonhou[b] todos os seus servos, que salvaram hoje a sua vida[c], a vida de seus filhos e filhas e a vida de suas esposas e concubinas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” provavelmente se refere à residência real ou ao palácio.
    reason: cultural_note
  - marker: b
    text: Literalmente, o hebraico menciona “os rostos de todos os seus servos”. A expressão concreta comunica vergonha ou humilhação pública.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico néfesh significa aqui a vida física, e não especificamente a “alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: na casa
  rationale: Preserva o sentido concreto de ‘casa’; no contexto, trata-se provavelmente da residência real, sem substituir o termo por ‘palácio’ no texto principal.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: envergonhou
  rationale: O hifil de בוש expressa causar vergonha. A expressão concreta com ‘rostos’ é idiomática; ‘envergonhou’ comunica seu sentido natural em português, enquanto a forma literal é registrada em nota.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Mantém a relação de serviço e lealdade ao rei sem restringir o grupo apenas a soldados ou oficiais.
- source_word: הַמְמַלְּטִים
  choice: que salvaram
  rationale: O particípio de מלט indica livrar ou resgatar do perigo; ‘salvaram’ se ajusta ao contexto imediato de preservação da vida.
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: sua vida / a vida
  rationale: נפש designa aqui a vida física ameaçada, não especificamente uma alma imaterial.
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: seus filhos e filhas
  rationale: Formulação portuguesa natural que conserva ambos os grupos familiares explicitamente mencionados.
- source_word: נָשֶׁיךָ ... פִּלַגְשֶׁיךָ
  choice: suas mulheres e concubinas
  rationale: ‘Mulheres’ pode designar esposas no contexto, e ‘concubinas’ preserva a categoria social distinta de פילגש sem moralização.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: Então ... entrou ... e disse
  rationale: Reproduz o avanço narrativo da sequência verbal hebraica em português corrente.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto do resgate
  choice: vida
  alternative: alma
  rationale: O perigo em vista é a morte física de Davi e de sua família; traduzir por ‘alma’ introduziria aqui uma distinção antropológica que o contexto não exige.
- issue: Termos relativos às mulheres da casa real
  choice: mulheres e concubinas
  alternative: esposas e esposas secundárias
  rationale: A tradução conserva as categorias históricas do texto sem justificá-las, suavizá-las ou acrescentar avaliação moral.
- issue: Forma de tratamento dirigida ao rei
  choice: o senhor
  alternative: você / tu
  rationale: Em português moderno, ‘o senhor’ expressa naturalmente o tratamento respeitoso de um subordinado ao rei, sem transformar a referência em título divino.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A sintaxe inicial foi reorganizada para esclarecer que Joabe entrou na residência e se dirigiu ao rei. A repetição de ‘hoje’ foi mantida, assim como parte da repetição retórica de ‘vida’. O tratamento ‘o senhor’ é social e contextual, não uma designação divina.
