base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: pt
  text: 'Então o rei ficou profundamente abalado e subiu ao aposento sobre o portão[a], e chorou. Enquanto ia, dizia: “Meu filho Absalão! Meu filho, meu filho Absalão! Quem dera eu tivesse morrido em seu lugar[b], Absalão, meu filho, meu filho!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “ao aposento superior do portão”.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica, literalmente “quem dará?”, usada para manifestar um desejo intenso; isto é, “quem dera” ou “oxalá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: ficou profundamente abalado
  rationale: O verbo רגז pode indicar tremor, agitação ou forte perturbação emocional. No contexto do luto, a expressão comunica com naturalidade a comoção intensa do rei sem restringi-la a um tremor físico.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: o aposento sobre o portão
  rationale: עֲלִיָּה designa um cômodo superior; a construção com הַשַּׁעַר indica um aposento situado acima da estrutura do portão.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: בכה indica chorar ou prantear. “Chorou” é claro, digno e natural em português contemporâneo.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Enquanto ia, dizia
  rationale: A formulação preserva a circunstância do deslocamento e o caráter continuado do lamento, de modo idiomático em português.
- source_word: בְּנִי
  choice: meu filho
  rationale: Todas as repetições do tratamento filial são mantidas, pois constituem parte central da força emotiva do lamento.
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão hebraica literalmente pergunta “quem dará?”, mas funciona idiomaticamente para exprimir um desejo intenso. “Quem dera” conserva a força optativa e combina com o registro solene do lamento.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: eu tivesse morrido em seu lugar
  rationale: A construção exprime o desejo contrafactual de que Davi tivesse morrido no lugar de Absalão.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português bíblico.
