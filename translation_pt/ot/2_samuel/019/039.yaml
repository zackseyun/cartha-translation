base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: pt
  text: 'Então o rei disse: “Que Quimã atravesse comigo, e eu farei por ele o que parecer bom aos seus olhos. E tudo o que você quiser pedir de mim[a], farei por você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E tudo o que você escolher impor-me, farei por você”. A expressão hebraica é elíptica; literalmente, “tudo o que você escolher sobre mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Que Quimã atravesse comigo
  rationale: O imperfeito tem força jussiva, indicando a decisão ou o convite do rei. “Atravesse” preserva o verbo recorrente עבר no contexto da travessia do Jordão.
- source_word: כִּמְהָם
  choice: Quimã
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: e eu farei por ele
  rationale: Mantém a amplitude semântica de עשה sem especificar indevidamente qual benefício Davi concederia.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: o que parecer bom aos seus olhos
  rationale: Preserva de maneira compreensível a imagem do idioma hebraico, indicando aquilo que o interlocutor julga bom ou desejável.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: E tudo o que você quiser pedir de mim
  rationale: A expressão hebraica é elíptica, literalmente algo como “tudo o que escolher sobre mim”. No contexto, refere-se ao que Barzilai quiser solicitar que Davi assuma ou faça; a nota preserva a forma e a ambiguidade do original.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: farei por você
  rationale: Reproduz a promessa pessoal do rei a Barzilai em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O tratamento por “você” evita solenidade artificial, enquanto a expressão “aos seus olhos” conserva a imagem hebraica. O marcador de nota foi colocado após a oração a que se refere.
