  naturalness: O português é moderno e claro. A enumeração fica mais direta e natural com «e Ziba ... com seus quinze filhos e vinte servos», sem «além de» e sem a repetição desnecessária de «seus».
  terminology: «Benjamim», «Ziba», «servo da casa de Saul», «Jordão» e «rei» são adequados. «Diante do rei» preserva de modo apropriado a ambiguidade de לִפְנֵי הַמֶּלֶךְ; a nota alternativa é pertinente.
