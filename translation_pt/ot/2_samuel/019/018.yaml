base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: pt
  text: e mil homens de Benjamim com ele, e Ziba, servo da casa de Saul, com seus quinze filhos e vinte servos. Eles atravessaram o Jordão diante do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à frente do rei”. A expressão hebraica pode significar tanto na presença do rei como adiante dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: mil homens
  rationale: Mantém a expressão numérica hebraica e o sentido masculino, provavelmente referente a apoiadores ou homens adultos.
- source_word: מִבִּנְיָמִן
  choice: de Benjamim
  rationale: Expressa de forma concisa a origem ou afiliação tribal.
- source_word: צִיבָא
  choice: Ziba
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: servo da casa de Saul
  rationale: Neste contexto, נַעַר designa a função de Ziba como servidor da casa ou dinastia de Saul, não apenas sua idade.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: com seus quinze filhos
  rationale: Torna explícita e natural em português a relação dos filhos com a comitiva de Ziba.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: e seus vinte servos
  rationale: עֶבֶד pode significar servo ou escravo; aqui a enumeração do pessoal doméstico favorece o termo contextual mais amplo, sem afirmar além do texto a condição jurídica deles.
- source_word: וְצָלְחוּ
  choice: Eles atravessaram
  rationale: No contexto do Jordão, o verbo indica claramente a ação de passar de uma margem para a outra.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma corrente em português; a palavra “rio” é desnecessária para identificar o referente.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Preserva melhor a amplitude da expressão hebraica, que pode indicar tanto a presença do rei quanto uma posição adiante dele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A abertura com “e” preserva a continuidade sintática com o versículo anterior; “além de” organiza naturalmente a enumeração sem alterar os participantes.
