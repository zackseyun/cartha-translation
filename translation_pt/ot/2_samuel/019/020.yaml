base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: pt
  text: 'E ele disse ao rei: “Que meu senhor não me atribua culpa[a] e não se lembre do mal que o seu servo fez no dia em que meu senhor, o rei, saiu de Jerusalém, para que o rei não leve isso a sério[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não lance sobre mim a iniquidade”. A expressão hebraica tem forma forense: computar ou atribuir iniquidade a alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “pôr isso no coração”, expressão que significa dar séria atenção ao assunto ou guardá-lo contra alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: não me atribua culpa
  rationale: Preserva a forma forense do idioma hebraico, no qual a culpa é computada ou atribuída a alguém, e soa natural em português.
- source_word: עָוֺן
  choice: culpa
  rationale: Neste contexto, o substantivo designa a culpa ou delito que poderia ser lançado na conta do falante; “culpa” mantém essa dimensão jurídica e moral.
- source_word: תִּזְכֹּר
  choice: se lembre
  rationale: Tradução direta que preserva a implicação contextual de recordar a ofensa para agir contra o culpado, sem explicitar além do hebraico.
- source_word: הֶעֱוָה
  choice: fez o mal
  rationale: Expressa de modo claro e digno a admissão de conduta errada, sem recorrer a vocabulário arcaico.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Em uma fala dirigida ao rei, é uma autodesignação cortês e humilde; “servo” comunica melhor essa função social do que “escravo”.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: saiu de Jerusalém
  rationale: Segue de perto o hebraico e se ajusta ao contexto narrativo da retirada de Davi da cidade.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: leve isso a sério
  rationale: Comunica o sentido idiomático de dar importância ao assunto ou guardá-lo contra alguém, evitando a expressão potencialmente ambígua “levar a peito”.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém a repetição e a forma de tratamento presentes no hebraico, sem substituir o título pelo nome de Davi.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Preserva o possessivo e o tom deferente de uma fala dirigida ao rei; não se trata aqui do nome divino.
