base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: pt
  text: 'Mefibosete disse ao rei: “Que ele fique até com tudo, agora que o rei, meu senhor, chegou em segurança[a] à sua casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “em paz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum e natural para o wayyiqtol de אמר.
- source_word: מְפִיבֹשֶׁת
  choice: Mefibosete
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Preserva o título definido do hebraico sem acrescentar o nome de Davi.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Que ele fique até com tudo
  rationale: Expressa a força jussiva de יִקָּח e a concessão enfática marcada por גַּם; no contexto, trata-se da posse dos bens disputados.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: agora que
  rationale: Comunica naturalmente a relação temporal e causal da expressão neste contexto.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Mantém o tratamento respeitoso da corte em ordem natural no português moderno.
- source_word: בְּשָׁלוֹם
  choice: em segurança
  rationale: No contexto do retorno de Davi, indica que ele chegou são e salvo; a formulação mais literal é registrada em nota.
- source_word: אֶל בֵּיתוֹ
  choice: à sua casa
  rationale: Preserva o referente possessivo e evita interpretar בַּיִת mais especificamente como palácio ou lar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala mantém o respeito cortesão sem soar arcaica; a ambiguidade temporal-causal de אַחֲרֵי אֲשֶׁר é vertida de modo natural por “agora que”.
