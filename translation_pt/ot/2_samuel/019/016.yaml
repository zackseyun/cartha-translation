base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: pt
  text: Então o rei voltou e chegou até o Jordão. Judá[a] havia chegado a Gilgal para ir ao encontro do rei e fazê-lo atravessar o Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os homens de Judá. O hebraico emprega “Judá” coletivamente para a tribo ou o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O Qal narrativo de שׁוב indica o retorno do rei após sua fuga; “voltou” é claro e natural em português.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: chegou até o Jordão
  rationale: A construção com עַד apresenta o Jordão como o ponto alcançado, sem afirmar ainda que o rei o atravessou.
- source_word: וִיהוּדָה
  choice: Judá
  rationale: Mantém o nome próprio do hebraico, empregado coletivamente para a tribo ou o povo de Judá; a nota esclarece esse uso.
- source_word: בָּא הַגִּלְגָּלָה
  choice: havia chegado a Gilgal
  rationale: O qatal após a sequência narrativa apresenta naturalmente a chegada de Judá como circunstância de fundo; o he direcional indica movimento para Gilgal.
- source_word: לָלֶכֶת לִקְרַאת
  choice: para ir ao encontro
  rationale: Preserva os dois elementos verbais e expressa com naturalidade a finalidade da ida.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: fazê-lo atravessar o Jordão
  rationale: O Hifil de עבר tem sentido causativo. A formulação não especifica indevidamente o meio usado para a travessia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição final de “o rei” foi substituída pelo pronome “-lo” para maior naturalidade, sem perda de sentido. A divisão em duas frases torna clara a mudança do primeiro plano narrativo para a informação circunstancial sobre Judá.
