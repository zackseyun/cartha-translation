base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: pt
  text: 'Então Davi disse: “O que tenho eu a ver com vocês, filhos de Zeruia, que hoje vocês sejam meus adversários[a]? Será que alguém será executado hoje em Israel? Pois não sei eu que hoje sou rei sobre Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um adversário para mim”. A palavra hebraica é satan, isto é, “adversário” ou “oponente” neste contexto. O hebraico usa o singular; o plural em português concorda com os dois interlocutores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: O que tenho eu a ver com vocês?
  rationale: Expressa em português natural o idiomatismo hebraico de distanciamento e repreensão, preservando sua força interrogativa.
- source_word: בְּנֵי צְרוּיָה
  choice: filhos de Zeruia
  rationale: Mantém a designação familiar concreta usada como vocativo para Joabe e Abisai.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: Por que hoje vocês se tornam meus adversários?
  rationale: Traduz שָׂטָן como substantivo comum, no sentido de quem se opõe ou cria obstáculo. O plural em português concorda naturalmente com os vários interlocutores, enquanto a nota registra a forma hebraica singular.
- source_word: יוּמַת אִישׁ
  choice: Acaso alguém será morto
  rationale: A forma passiva indica que alguém seria levado à morte, possivelmente por execução. “Acaso” preserva o caráter retórico da pergunta, e “alguém” comunica o uso genérico de אִישׁ.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: não sei eu
  rationale: Preserva a pergunta retórica hebraica, que espera resposta afirmativa, sem reduzi-la a uma declaração simples.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: Reproduz de modo claro a preposição עַל e ressalta a autoridade régia de Davi sobre Israel.
theological_decisions:
- issue: Sentido de שָׂטָן
  choice: substantivo comum “adversário”
  alternative: o nome próprio “Satanás”
  rationale: Neste contexto narrativo, a palavra descreve a oposição dos filhos de Zeruia a Davi. Entendê-la como nome próprio introduziria uma identificação demonológica que o contexto e a gramática não exigem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As perguntas retóricas e a repetição de “hoje” foram mantidas. O pronome “vocês” torna natural o discurso direto dirigido a Joabe e Abisai.
