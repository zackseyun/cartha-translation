  yaml_path: translation/ot/2_samuel/019/015.yaml
  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: pt
  text: 'Ele conquistou o coração de todos os homens de Judá, como se fossem um só homem, e eles mandaram dizer ao rei: “Volte — você e todos os seus servos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: conquistou o coração
  rationale: A expressão hebraica descreve levar o coração ou a disposição de alguém a favorecer uma causa. “Conquistou o coração” comunica esse sentido naturalmente em português sem sugerir coerção.
- source_word: כְּאִישׁ אֶחָד
  choice: como se fossem um só homem
  rationale: Preserva a imagem hebraica de unanimidade, esclarecendo em português que todos os homens de Judá agiram em unidade.
- source_word: שׁוּב אַתָּה וְכָל־עֲבָדֶיךָ
  choice: Volte — você e todos os seus servos
  rationale: Mantém o imperativo singular e o pronome enfático, indicando que tanto o rei quanto todos os seus servos deveriam voltar.
theological_decisions:
- issue: Identidade do sujeito de וַיַּט
  choice: Ele
  alternative: Davi
  rationale: O hebraico emprega o verbo na terceira pessoa sem nomear novamente o sujeito. O pronome preserva a coesão com o contexto e evita tornar explícito no versículo o que permanece implícito no original.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A colocação “você” evita o regionalismo ou arcaísmo de “tu” e a possível ambiguidade religiosa de “o senhor”; o travessão marca a ênfase do pronome hebraico.
