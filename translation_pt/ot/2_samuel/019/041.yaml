base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: pt
  text: Então o rei atravessou para Gilgal, e Quimã atravessou com ele. Todo o povo de Judá conduziu o rei na travessia[a], e também metade do povo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fez o rei atravessar” ou “levou o rei para o outro lado”. Neste contexto, o verbo hebraico pode ter sentido causativo quando usado com objeto direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: O verbo עבר, neste contexto narrativo, descreve a travessia do Jordão; “atravessou” é natural e claro em português.
- source_word: הַגִּלְגָּלָה
  choice: para Gilgal
  rationale: O ה direcional ligado ao nome do lugar indica movimento em direção a Gilgal.
- source_word: וְכִמְהָן
  choice: e Quimã
  rationale: O nome pessoal é transliterado numa forma corrente e legível em português.
- source_word: עָבַר עִמּוֹ
  choice: atravessou com ele
  rationale: Repete o verbo da travessia e preserva a ligação narrativa entre o movimento do rei e o de Quimã.
- source_word: וְכָל עַם יְהוּדָה
  choice: Todo o povo de Judá
  rationale: Expressa de modo transparente a população ou o grupo de partidários associado a Judá.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: ajudou o rei a atravessar
  rationale: Com objeto direto, עבר pode assumir aqui sentido causativo ou de condução. A formulação portuguesa comunica a participação do povo na travessia sem sugerir mera coerção.
- source_word: וְגַם
  choice: e também
  rationale: Preserva naturalmente o valor aditivo da expressão hebraica.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: metade do povo de Israel
  rationale: Mantém a expressão quantitativa e a distinção política entre Judá e Israel sem interpretação adicional.
