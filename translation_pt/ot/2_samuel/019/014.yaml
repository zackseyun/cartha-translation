    text: Literalmente, “todos os dias”; expressão que, no contexto da nomeação, indica exercício contínuo ou duradouro do cargo.
    reason: Esclarece a expressão temporal hebraica sem introduzir uma duração mais específica do que o texto permite.
  revision_rationale: A revisão substitui a construção não idiomática «por todos os dias» por «de modo permanente» e verte o idiomatismo «diante de mim» como «a meu serviço». A nota preserva a formulação literal «todos os dias» e explica seu valor contextual. Os demais elementos do texto foram mantidos.
