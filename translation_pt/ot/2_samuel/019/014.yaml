  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: pt
  text: 'E digam a Amasa: “Você não é meu osso e minha carne? Que Deus faça o mesmo comigo e ainda mais, se você não for comandante do exército a meu serviço, de modo permanente, no lugar de Joabe[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todos os dias”; expressão que, no contexto da nomeação, indica exercício contínuo ou duradouro do cargo.
    reason: Esclarece a expressão temporal hebraica sem introduzir uma duração mais específica do que o texto permite.
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: E digam a Amasa
  rationale: Mantém o valor diretivo do imperfeito na segunda pessoa do plural e identifica Amasa como destinatário da mensagem.
- source_word: הֲלוֹא
  choice: Você não é
  rationale: Preserva a pergunta retórica, que espera uma resposta afirmativa.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: meu osso e minha carne
  rationale: Conserva literalmente a vívida expressão hebraica de parentesco, sem reduzi-la à paráfrase “meu parente”.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Deus faça o mesmo comigo e ainda mais
  rationale: Reproduz a fórmula solene de juramento sem explicitar a punição que o hebraico deixa indeterminada.
- source_word: אִם לֹא
  choice: se você não for
  rationale: Mantém a estrutura condicional própria da fórmula de juramento, embora nesse contexto ela comunique uma afirmação enfática.
- source_word: שַׂר צָבָא
  choice: comandante do exército
  rationale: Expressa com clareza o cargo de principal autoridade militar.
- source_word: תִּהְיֶה לְפָנַי
  choice: você não for, diante de mim, o comandante
  rationale: Retém a imagem hebraica “diante de mim”, que neste contexto também sugere serviço sob a autoridade do rei.
- source_word: כָּל הַיָּמִים
  choice: por todos os dias
  rationale: Reflete de perto a expressão hebraica e deixa sua nuance de permanência funcional ser esclarecida em nota.
- source_word: תַּחַת יוֹאָב
  choice: no lugar de Joabe
  rationale: 'Aqui תַּחַת indica substituição, não subordinação: Amasa ocuparia o posto de Joabe.'
theological_decisions:
- issue: Número e referência de אֱלֹהִים na fórmula de juramento
  choice: Deus
  alternative: deuses
  rationale: Apesar da forma morfologicamente plural, אֱלֹהִים tem sentido singular neste uso e se refere ao Deus de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e a ordem da frase foram ajustadas para fluidez, enquanto as imagens de parentesco, juramento e serviço “diante” do rei foram preservadas.
