revisions:
- from: 'E digam a Amasa: “Você não é meu osso e minha carne? Que Deus faça o mesmo comigo e ainda mais, se você não for, diante de mim, o comandante do exército por todos os dias[a], no lugar de Joabe.”'
  to: 'E digam a Amasa: “Você não é meu osso e minha carne? Que Deus faça o mesmo comigo e ainda mais, se você não for comandante do exército a meu serviço, de modo permanente, no lugar de Joabe[a].”'
  rationale: A revisão substitui a construção não idiomática «por todos os dias» por «de modo permanente» e verte o idiomatismo «diante de mim» como «a meu serviço». A nota preserva a formulação literal «todos os dias» e explica seu valor contextual. Os demais elementos do texto foram mantidos.
