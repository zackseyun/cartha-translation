base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: pt
  text: 'Assim, naquele dia, a vitória se transformou em luto para todo o povo[a], pois naquele dia o povo ouviu dizer[b]: “O rei está entristecido por seu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “naquele dia, o livramento tornou-se luto para todo o povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o povo ouviu, dizendo”, expressão idiomática para ouvir uma notícia ou ouvir dizer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: a vitória
  rationale: No contexto militar após a batalha, o termo indica o êxito ou livramento obtido; “vitória” é natural e evita a conotação predominantemente religiosa que “salvação” poderia assumir.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: se transformou em luto
  rationale: Expressa em português corrente a mudança resultante e o forte contraste do hebraico, literalmente próximo de “tornou-se luto”.
- source_word: אֵבֶל
  choice: luto
  rationale: Designa uma manifestação de pesar, aqui de caráter coletivo e público; “luto” reproduz melhor esse sentido do que apenas “tristeza”.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o termo geral do hebraico, embora no contexto inclua especialmente os combatentes e partidários de Davi.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: pois ... o povo ouviu dizer
  rationale: A construção hebraica introduz uma notícia ou fala relatada; “ouviu dizer” é a forma portuguesa idiomática correspondente.
- source_word: נֶעֱצַב
  choice: está entristecido
  rationale: O nifal comunica que o rei está tomado de dor ou tristeza; a escolha é clara, natural e mantém o peso emocional sem acrescentar a ideia específica de luto ritual.
- source_word: עַל בְּנוֹ
  choice: por causa de seu filho
  rationale: Com o verbo de tristeza, a preposição assinala a causa ou ocasião do pesar; esta formulação é clara em português e não especifica além do hebraico se a dor é pela morte ou a respeito do filho.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “naquele dia” foi mantida por corresponder à ênfase do hebraico. “Povo” conserva a amplitude lexical do original, sem restringir explicitamente o referente ao exército.
