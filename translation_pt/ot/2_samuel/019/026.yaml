  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: pt
  text: 'Quando ele chegou a Jerusalém para encontrar-se com o rei, o rei lhe perguntou: “Por que você não foi comigo, Mefibosete?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal. Em português, “Quando” faz a transição de modo natural sem reproduzir de forma rígida “e aconteceu que”.
- source_word: בָא
  choice: chegou
  rationale: O verbo בוא pode significar “vir”, “entrar” ou “chegar”. “Chegou” expressa com clareza a chegada dele a Jerusalém, sem impor uma perspectiva dêitica indevida.
- source_word: יְרוּשָׁלַם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: לִקְרַאת
  choice: para encontrar-se com
  rationale: לקראת indica movimento ou ação com a finalidade de ir ao encontro de alguém. “Encontrar-se com” é natural no contexto e não acrescenta necessariamente a ideia específica de saudação.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido usado no hebraico para Davi.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: o rei lhe perguntou
  rationale: Embora אמר seja literalmente “disse”, o conteúdo é uma pergunta direta; “perguntou” comunica naturalmente a função da fala em português, preservando o sujeito explícito repetido no hebraico.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente interrogativo direto e corrente em português.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: você não foi comigo
  rationale: Mantém o sentido básico de הלך, “ir”, e a perspectiva da partida anterior de Davi. “Você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: מְפִיבֹשֶׁת
  choice: Mefibosete
  rationale: Forma tradicional do nome pessoal em traduções portuguesas e adaptação regular à fonologia e ortografia do idioma.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com alta legibilidade brasileira. A tradução preserva “foi comigo”, correspondente ao verbo hebraico הלך, em vez de substituir pela formulação mais idiomática “veio comigo”. Não foi necessária nota de rodapé, pois a construção é natural em português.
