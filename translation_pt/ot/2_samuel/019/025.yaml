base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: pt
  text: Mefibosete, filho de Saul, desceu para encontrar-se com o rei. Ele não havia cuidado dos pés[a], nem aparado o bigode[b], nem lavado as roupas, desde o dia em que o rei partiu até o dia em que chegou em paz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não havia feito os pés”. A expressão se refere à falta dos cuidados habituais com os pés, embora o procedimento exato não seja especificado.
    reason: lexical_alternative
  - marker: b
    text: Ou “nem tratado do bigode”. O termo hebraico se refere especificamente à região do lábio superior, não necessariamente a toda a barba.
    reason: lexical_alternative
  - marker: c
    text: Ou “chegou são e salvo”. A expressão hebraica também pode indicar que ele chegou em segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: desceu
  rationale: Preserva o sentido espacial básico do verbo hebraico sem acrescentar uma perspectiva de movimento não exigida pelo contexto.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: para encontrar-se com o rei
  rationale: Expressa naturalmente o movimento em direção ao rei com a finalidade de encontrá-lo.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: não havia cuidado dos pés
  rationale: O hebraico diz literalmente que ele não havia 'feito' os pés; a formulação ampla comunica negligência dos cuidados pessoais sem especificar um procedimento incerto.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: nem aparado o bigode
  rationale: שָׂפָם designa a região do lábio superior ou o bigode; 'aparado o bigode' é claro e evita ampliar o termo para toda a barba.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: nem lavado as roupas
  rationale: Tradução direta e corrente do ato de lavar as vestes.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: desde o dia em que o rei partiu
  rationale: Representa de modo natural a construção temporal hebraica e mantém o verbo sem elevação desnecessária de registro.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: até o dia em que voltou em paz
  rationale: No contexto, בָּא descreve a chegada ou retorno do rei; 'em paz' preserva a ressonância de שָׁלוֹם e sua possível referência a uma chegada segura.
