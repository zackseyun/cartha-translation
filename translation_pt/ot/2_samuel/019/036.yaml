base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: pt
  text: Hoje tenho oitenta anos. Será que ainda consigo distinguir entre o bem e o mal[a]? Será que teu servo ainda consegue sentir o sabor do que come e do que bebe? Será que ainda consigo ouvir a voz de cantores e cantoras? Por que, então, teu servo ainda seria um peso para meu senhor, o rei?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que ainda consigo discernir entre o bem e o mal?” A expressão hebraica pode indicar discernimento moral ou prático; neste contexto de idade avançada e enfraquecimento dos sentidos, pode se referir de modo mais amplo à redução da capacidade de julgamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Hoje tenho oitenta anos
  rationale: Expressa em português natural o idioma hebraico de idade e mantém o advérbio temporal הַיּוֹם.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Será que ainda consigo distinguir entre o bem e o mal?
  rationale: A construção tem força interrogativa retórica. “Distinguir” comunica ידע בין, enquanto “o bem e o mal” preserva a formulação hebraica e sua possível amplitude moral ou prática.
- source_word: אִם
  choice: Será que ... consigo?
  rationale: Nas perguntas sucessivas, אִם introduz dúvida retórica; esta formulação é corrente em português e evita o literalismo de “se”.
- source_word: יִטְעַם ... אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: consegue sentir o sabor do que come e do que bebe
  rationale: טעם se refere aqui à capacidade sensorial de perceber o sabor. A terceira pessoa concorda naturalmente com o tratamento cortês “este seu servo”.
- source_word: עַבְדְּךָ
  choice: este seu servo
  rationale: É uma autorreferência cortês dirigida ao rei, não uma ênfase na condição jurídica de escravidão. “Este” torna natural a referência do falante a si mesmo em português.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: ainda consigo ouvir a voz de cantores e cantoras
  rationale: Mantém עוֹד e a distinção explícita entre as formas hebraicas masculina e feminina; “a voz” preserva o singular קוֹל.
- source_word: לְמַשָּׂא
  choice: um peso
  rationale: Transmite de forma idiomática o sentido metafórico de carga ou incômodo imposto ao rei.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Preserva o tratamento de corte dirigido a um rei humano e usa ordem natural em português.
theological_decisions:
- issue: Sentido de טוֹב לְרָע
  choice: o bem e o mal
  alternative: o que é bom e o que é ruim
  rationale: A expressão pode envolver discernimento moral ou juízo prático. A tradução mantém a formulação tradicional e a nota registra a amplitude contextual sem decidir além do hebraico.
