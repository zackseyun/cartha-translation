base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: pt
  text: Todo o povo atravessou o Jordão, e o rei atravessou também. Então o rei beijou Barzilai e o abençoou; e ele voltou para o seu lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “voltou” é mais naturalmente Barzilai, conforme o contexto.
    reason: ambiguidade do referente pronominal
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: O verbo עבר descreve aqui a travessia do rio; “atravessou” é a forma natural e concreta em português.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: עם tem o sentido amplo de “povo” e, neste contexto, não deve ser restringido sem necessidade a soldados ou tropas.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: A expressão designa o rio Jordão; em português, o nome sozinho é claro e idiomático neste contexto.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: e o rei atravessou também
  rationale: Mantém a repetição do verbo hebraico. “Também” torna natural em português a coordenação que acrescenta o rei ao povo que atravessou.
- source_word: וַיִּשַּׁק
  choice: beijou
  rationale: נשק significa “beijar” nesta forma e descreve diretamente o gesto de afeto e despedida.
- source_word: לְבַרְזִלַּי
  choice: Barzilai
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: וַיְבָרֲכֵהוּ
  choice: o abençoou
  rationale: Preserva o sentido explícito de ברך, sem reduzi-lo apenas a uma fórmula social de despedida.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: e ele voltou para o seu lugar
  rationale: A formulação conserva tanto o sentido de שׁוב e מקום quanto a ambiguidade gramatical do pronome masculino singular; pelo contexto, Barzilai é o referente mais provável.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A repetição de “atravessou” reflete o texto hebraico sem soar artificial, e a ambiguidade do último sujeito é preservada no texto principal e explicada em nota.
