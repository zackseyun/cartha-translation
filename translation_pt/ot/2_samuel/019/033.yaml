  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: pt
  text: Barzilai era muito idoso, tinha oitenta anos, e havia sustentado o rei durante a permanência dele em Maanaim, pois era um homem muito importante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem muito grande”. A expressão hebraica pode indicar grande riqueza, posição social ou influência; também pode ser traduzida por “um homem muito rico” ou “um homem muito proeminente”.
    reason: alternativa lexical
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: era muito idoso
  rationale: A construção predicativa, intensificada por מְאֹד, indica idade avançada. “Muito idoso” é natural, respeitoso e mantém a ênfase do hebraico.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: tinha oitenta anos
  rationale: O hebraísmo literal “filho de oitenta anos” é expresso de modo idiomático e claro em português.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: havia sustentado o rei
  rationale: כלכל descreve o suprimento material das necessidades do rei. “Havia sustentado” comunica esse apoio e situa naturalmente a ação antes dos acontecimentos narrados.
- source_word: בְּשִׁיבָתוֹ
  choice: durante a permanência dele
  rationale: ישב aqui se refere à estadia ou residência temporária. “Dele” preserva a referência mais natural ao rei sem repetir desnecessariamente o substantivo.
- source_word: בְמַחֲנַיִם
  choice: em Maanaim
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico מַחֲנַיִם.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de como Barzilai pôde prestar sustento ao rei.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: era um homem muito importante
  rationale: A expressão hebraica é ampla e pode indicar riqueza, posição ou influência. “Muito importante” conserva melhor essa amplitude do que uma tradução limitada apenas à riqueza; a nota registra as alternativas contextualmente plausíveis.
