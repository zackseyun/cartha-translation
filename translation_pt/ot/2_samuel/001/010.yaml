  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: pt
  text: Então fiquei de pé sobre ele e o matei[b], pois sabia que ele não viveria depois de ter caído. Em seguida, peguei a coroa que estava na cabeça dele e o bracelete que estava em seu braço[a] e os trouxe aqui ao meu senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorno de braço”. O termo hebraico designa um ornamento usado no braço.'
    reason: lexical_alternative
  - marker: b
    text: Este é o relato do amalequita a David. Compare 1 Samuel 31:4–5 com o relato anterior da morte de Saul.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: fiquei em pé junto dele
  rationale: עמד com על descreve a posição do amalequita em relação a Saul caído. “Junto dele” evita a impressão inadequada de que ele estivesse literalmente pisando sobre Saul, sem perder a proximidade indicada pelo contexto.
- source_word: וַאֲמֹתְתֵהוּ
  choice: o matei
  rationale: A forma causativa de מות afirma diretamente que o narrador causou a morte de Saul. “Matei” é claro, natural e não suaviza a alegação do amalequita.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: pois sabia que ele não continuaria vivo
  rationale: Expressa naturalmente a razão declarada pelo narrador e preserva o sentido de לא יחיה sem transformar sua avaliação em certeza médica de que Saul não poderia sobreviver.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: depois de ter caído
  rationale: Mantém o valor temporal da construção e apresenta a queda como anterior à ação de matá-lo.
- source_word: הַנֵּזֶר
  choice: a coroa
  rationale: נזר designa aqui a insígnia real usada na cabeça. “Coroa” é o equivalente moderno mais claro e acessível.
- source_word: וְאֶצְעָדָה
  choice: o bracelete
  rationale: O objeto é um adorno usado no braço. “Bracelete” é corrente e compreensível em português; a nota esclarece a referência mais ampla ao braço.
- source_word: זְרֹעוֹ
  choice: seu braço
  rationale: זרוע significa normalmente “braço”; o contexto não exige o sentido mais específico de “antebraço”.
- source_word: וָאֲבִיאֵם
  choice: os trouxe
  rationale: O wayyiqtol prossegue a sequência narrativa no passado. O pronome plural retoma a coroa e o bracelete.
- source_word: אֶל אֲדֹנִי הֵנָּה
  choice: aqui ao meu senhor
  rationale: “Meu senhor” conserva o tratamento respeitoso dirigido a David, enquanto “aqui” indica o local presente do falante.
theological_decisions:
- issue: A alegação narrativa sobre a morte de Saul
  choice: Traduzir diretamente a fala do amalequita como sua própria alegação de que matou Saul.
  alternative: Atenuar a declaração ou apresentá-la na tradução como mentira para harmonizá-la com 1 Samuel 31:4–5.
  rationale: O versículo registra discurso direto e afirma o que o amalequita disse. A tensão com o relato anterior deve permanecer como questão narrativa e interpretativa, não ser resolvida silenciosamente na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão narrativa hebraica sem literalismos pouco naturais. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
