source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: pt
  text: 'Não contem isso em Gate;

    não anunciem a notícia nas ruas de Ascalom,

    para que não se alegrem as filhas dos filisteus,

    para que não exultem as filhas dos incircuncisos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As filhas dos incircuncisos” é uma tradução literal de uma designação depreciativa ligada à circuncisão e à identidade pactual; aqui, refere-se às mulheres dos filisteus.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: contem isso
  rationale: 'O verbo נגד significa contar, relatar ou declarar. “Contem isso” é natural em português e explicita apenas o objeto implícito no contexto: a notícia da morte de Saul e Jônatas.'
- source_word: בְגַת
  choice: em Gate
  rationale: A preposição é locativa, e “Gate” é a forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: תְּבַשְּׂרוּ
  choice: anunciem a notícia
  rationale: No piel, בשר indica levar ou proclamar notícias. “Anunciem a notícia” preserva o caráter público da ação e mantém o paralelismo com “contem isso”.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: nas ruas de Ascalom
  rationale: חוּצוֹת pode designar ruas ou espaços abertos da cidade. “Ruas” é claro e idiomático, além de comunicar o cenário público.
- source_word: פֶּן
  choice: para que não
  rationale: A conjunção introduz resultado ou finalidade que se deseja evitar. “Para que não” reproduz isso em português atual e funciona naturalmente na repetição poética.
- source_word: תִּשְׂמַחְנָה
  choice: se alegrem
  rationale: שמח expressa alegria ou contentamento. “Alegrem-se” preserva o sentido e o tom elevado da lamentação.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: as filhas dos filisteus
  rationale: A tradução literal conserva a expressão poética coletiva, que apresenta as mulheres filisteias como participantes da celebração.
- source_word: תַּעֲלֹזְנָה
  choice: exultem
  rationale: עלז descreve alegria exuberante e é mais intenso que o verbo do membro paralelo. “Exultem” preserva essa intensificação.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: as filhas dos incircuncisos
  rationale: A expressão significa literalmente “filhas dos incircuncisos”. A forma escolhida mantém tanto o paralelismo quanto a força étnico-religiosa e polêmica do hebraico.
theological_decisions:
- issue: Tradução da designação pactual e depreciativa עֲרֵלִים
  choice: os incircuncisos
  alternative: os pagãos
  rationale: O termo hebraico se refere literalmente à ausência de circuncisão e evoca identidade pactual. A tradução literal conserva essa dimensão teológica e retórica, sem substituí-la por uma caracterização religiosa mais genérica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais no plural sem pronome regional. A disposição em linhas preserva o paralelismo da lamentação. “Gate”, “Ascalom” e “filisteus” seguem formas bíblicas correntes em português.
