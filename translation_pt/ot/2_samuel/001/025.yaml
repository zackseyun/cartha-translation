base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: pt
  text: Como caíram os valentes no meio da batalha! Jônatas, morto sobre as tuas alturas[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre os teus lugares altos”. O hebraico pode designar terreno elevado; o pronome está na segunda pessoa do singular, mas seu referente não é explicitado. No contexto da elegia, pode referir-se poeticamente à terra ou aos montes de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de lamento, não uma pergunta; preserva a força poética e o refrão da elegia.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O perfeito hebraico apresenta a queda como fato consumado; o pretérito perfeito é natural e solene em português.
- source_word: גִבֹּרִים
  choice: os valentes
  rationale: Expressa homens de valor e força, especialmente guerreiros, sem restringir o termo a uma patente militar.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: no meio da batalha
  rationale: Conserva a ideia de terem caído em pleno conflito, expressa por בְּתוֹךְ.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל
  choice: sobre
  rationale: Preposição locativa natural neste contexto poético.
- source_word: בָּמוֹתֶיךָ
  choice: os seus lugares altos
  rationale: Preserva tanto a noção de terreno elevado quanto a ambiguidade do sufixo masculino singular, sem substituir explicitamente seu referente por Israel.
- source_word: חָלָל
  choice: morto
  rationale: Aqui designa alguém abatido ou morto em combate; a construção nominal fragmentária preserva a concisão enfática do hebraico.
theological_decisions:
- issue: Referente do sufixo de segunda pessoa em בָּמוֹתֶיךָ
  choice: Manter no texto a referência aberta com “seus lugares altos”
  alternative: 'Explicitar uma personificação da terra ou dos montes de Israel: “nos seus lugares altos” dirigidos a Israel'
  rationale: O hebraico traz um sufixo masculino singular, mas o referente não é expresso neste versículo. Embora o contexto poético favoreça uma referência à paisagem de Israel, a tradução não deve resolver silenciosamente a ambiguidade.
- issue: Valor de חָלָל aplicado a Jônatas
  choice: morto
  alternative: ferido; traspassado; jaz morto
  rationale: No contexto da elegia pela morte de Jônatas, o termo indica um morto em combate. “Morto” comunica o resultado sem acrescentar um verbo de postura ausente do hebraico.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A construção exclamativa e o paralelismo conciso da elegia foram preservados; evitou-se o sentido cultual automático que “lugares altos” pode ter em outros contextos por meio de nota explicativa.
