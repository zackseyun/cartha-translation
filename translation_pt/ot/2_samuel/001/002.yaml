base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: pt
  text: No terceiro dia, eis que um homem veio do acampamento, de junto de Saul[a], com as roupas rasgadas e terra sobre a cabeça.[b] Quando chegou até Davi, caiu por terra e se prostrou.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vindo de onde estava Saul” ou “do lado de Saul”. A expressão hebraica indica associação ou proximidade com Saul, não necessariamente que o homem tenha sido enviado diretamente por ele.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “terra sobre a cabeça”, um sinal convencional de dor ou luto.
    reason: cultural_note
  - marker: c
    text: Ou “inclinou-se profundamente”. O verbo pode indicar um gesto de profundo respeito, submissão ou homenagem, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: A fórmula narrativa introduz o acontecimento seguinte; em português atual, a expressão temporal basta, sem acrescentar um marcador como “então” ou “ora” que não esteja explícito.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a apresentação vívida e deítica do hebraico sem introduzir a ideia não expressa de algo repentino.
- source_word: אִישׁ בָּא מִן־הַמַּחֲנֶה
  choice: um homem veio do acampamento
  rationale: Mantém o referente masculino singular e o sentido militar de מַחֲנֶה, que o contexto torna claro.
- source_word: מֵעִם שָׁאוּל
  choice: de junto de Saul
  rationale: Expressa origem associada à presença ou ao lado de Saul, sem sugerir indevidamente que Saul o tenha enviado.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: com as roupas rasgadas
  rationale: Formulação natural e acessível que preserva a descrição do sinal de luto.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: e terra sobre a cabeça
  rationale: Traduz אֲדָמָה de modo direto, preservando a imagem cultural em vez de substituí-la por uma explicação.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: Quando chegou até Davi
  rationale: Reproduz naturalmente a circunstância temporal expressa pelo infinitivo hebraico.
- source_word: וַיִּפֹּל אַרְצָה
  choice: caiu por terra
  rationale: Equivalente idiomático e digno para o movimento em direção ao chão.
- source_word: וַיִּשְׁתָּחוּ
  choice: e se prostrou
  rationale: Preserva o gesto corporal de profunda deferência sem defini-lo necessariamente como adoração.
theological_decisions:
- issue: Natureza do gesto expresso por וַיִּשְׁתָּחוּ
  choice: se prostrou
  alternative: adorou / prestou homenagem
  rationale: O contexto indica deferência diante de Davi, mas o verbo por si só pode abranger prostração, submissão ou homenagem. A tradução conserva essa amplitude e evita impor uma leitura cultual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” retém a vividez narrativa do hebraico; “de junto de Saul” preserva a associação sem sugerir envio oficial; “se prostrou” mantém a ambiguidade contextual do gesto.
