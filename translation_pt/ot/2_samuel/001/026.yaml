  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: pt
  text: Sinto angústia por você, meu irmão Jônatas! Você me era muito querido. Seu amor por mim era extraordinário, maior que o amor das mulheres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais do que o amor das mulheres” ou “superando o amor das mulheres”. A comparação poética em hebraico não especifica por si mesma a natureza nem a direção exata da comparação.
    reason: alternativa lexical e preservação da ambiguidade
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Sinto angústia por você
  rationale: A expressão comunica aflição pessoal no contexto do lamento. “Sinto angústia” conserva a intensidade, enquanto “por você” traduz naturalmente a relação marcada por עַל.
- source_word: אָחִי
  choice: meu irmão
  rationale: Mantém o sentido direto do hebraico e sua expressão de profunda proximidade.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: Você me era muito querido
  rationale: O verbo descreve alguém agradável, aprazível ou estimado. “Muito querido” é natural em português no contexto de um lamento pessoal e evita a estranheza de “muito agradável para mim”.
- source_word: נִפְלְאָתָה
  choice: era extraordinário
  rationale: Expressa aquilo que é excepcional ou maravilhoso; “extraordinário” combina naturalmente com “amor” e preserva a força avaliativa.
- source_word: אַהֲבָתְךָ לִי
  choice: Seu amor por mim
  rationale: Traduz o substantivo comum para “amor” e verte a relação preposicional em português idiomático.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: maior que o amor das mulheres
  rationale: Conserva a comparação e a ambiguidade da construção hebraica sem especificar se se trata do amor sentido por mulheres ou do amor dirigido a elas.
theological_decisions:
- issue: Natureza da comparação com “o amor das mulheres”
  choice: Manter a formulação geral “maior que o amor das mulheres”
  alternative: Explicitar “maior que o amor que as mulheres oferecem” ou “maior que o amor por mulheres”
  rationale: O hebraico não define a direção nem a natureza exata da comparação. A tradução evita impor categorias sexuais, românticas ou estritamente platônicas e conserva a tensão poética.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. “Você” oferece naturalidade ampla; “Jônatas” segue a convenção bíblica portuguesa. A colocação do marcador após a frase comparativa vincula claramente a nota à ambiguidade que ela explica.
