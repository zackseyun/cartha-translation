  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: pt
  text: 'e disse que ensinassem aos filhos de Judá “O Arco”. Eis que está escrito no Livro do Justo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְלַמֵּד
  choice: que ensinassem
  rationale: O infinitivo hebraico expressa o conteúdo da ordem introduzida por וַיֹּאמֶר; esta formulação é natural em português e mantém o sujeito indeterminado do ato de ensinar.
- source_word: בְּנֵי יְהוּדָה
  choice: aos filhos de Judá
  rationale: Preserva a expressão coletiva hebraica, compreensível como os homens ou o povo de Judá.
- source_word: קָשֶׁת
  choice: “O Arco”
  rationale: O substantivo pode significar simplesmente “arco”, mas, no contexto, provavelmente funciona como título da lamentação ou composição; as aspas preservam essa leitura sem acrescentar uma explicação ao texto.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Livro do Justo
  rationale: Traduz o título hebraico de modo transparente e evita tratar Yashar como nome próprio, embora essa transliteração seja possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão. “Eis que” conserva o marcador demonstrativo הִנֵּה e o tom literário da passagem. A construção mantém a ligação com o versículo anterior e termina com dois-pontos para introduzir a lamentação seguinte.
