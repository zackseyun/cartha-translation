base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: pt
  text: 'Davi lhe disse: “De onde você vem?” Ele respondeu: “Escapei do acampamento de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: De onde
  rationale: A expressão pergunta pela origem ou procedência. “De onde você vem?” é natural em português e preserva diretamente esse sentido.
- source_word: תָּבוֹא
  choice: você vem
  rationale: Embora seja formalmente um imperfeito, no contexto da pergunta direta refere-se à procedência imediata do homem. Em português, “De onde você vem?” é idiomático e adequado à cena narrativa.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: do acampamento de Israel
  rationale: מַחֲנֶה designa um acampamento, aqui em contexto militar. A formulação preserva a construção hebraica sem perder naturalidade.
- source_word: נִמְלָטְתִּי
  choice: Escapei
  rationale: O nifal de מלט indica ter conseguido escapar de perigo. O pretérito perfeito português expressa naturalmente a ação concluída e bem-sucedida.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: disse ... respondeu
  rationale: O hebraico repete o verbo comum “dizer”. Na segunda ocorrência, “respondeu” torna o diálogo natural em português sem alterar a relação discursiva explícita no contexto.
- source_word: דָּוִד
  choice: Davi
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
