base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: pt
  text: Então Davi agarrou suas vestes e as rasgou[a]; e todos os homens que estavam com ele fizeram o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “sua veste”, no singular, seguido de “as rasgou”, com pronome no plural. “Vestes” preserva o sentido do gesto em português e concorda com o pronome plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: agarrou
  rationale: Expressa de modo natural e concreto o ato de segurar firmemente a roupa antes de rasgá-la, sem acrescentar uma interpretação além da ação descrita.
- source_word: בִּבְגָדוֹ
  choice: as próprias vestes
  rationale: Embora a forma hebraica seja singular, “vestes” é uma formulação portuguesa natural e digna para o gesto de rasgar a roupa em sinal de luto; “próprias” deixa claro que eram as vestes de Davi.
- source_word: וַיִּקְרָעֵם
  choice: e as rasgou
  rationale: O sufixo hebraico é plural; a tradução conserva esse número e se harmoniza naturalmente com “vestes”.
- source_word: וְגַם
  choice: e ... fizeram o mesmo
  rationale: Reproduz em português corrente a extensão da mesma ação aos companheiros de Davi, explicitando apenas a elipse presente no hebraico.
- source_word: כָּל הָאֲנָשִׁים
  choice: todos os homens
  rationale: Mantém o sentido específico do substantivo hebraico, que aqui designa os homens presentes.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: Tradução direta e natural da oração relativa que identifica os acompanhantes de Davi.
