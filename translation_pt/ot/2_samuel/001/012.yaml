  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: pt
  text: Eles lamentaram, choraram e jejuaram até o entardecer por Saul, por Jônatas, seu filho, pelo povo de Yahweh e pela casa de Israel, porque haviam caído pela espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: lamentaram
  rationale: O verbo ספד indica lamentação ou luto pelos mortos. “Lamentaram” preserva a distinção em relação ao choro expresso pelo verbo seguinte.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: בכה significa chorar ou derramar lágrimas; “choraram” é natural, solene e claro em português atual.
- source_word: וַיָּצֻמוּ
  choice: jejuaram
  rationale: צום é o verbo comum para abster-se de alimento em sinal de luto ou devoção.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: A expressão indica o limite temporal do luto e do jejum; “até a tarde” é idiomático e fiel.
- source_word: עַל
  choice: por
  rationale: A preposição repetida introduz aqueles por quem se lamentava. “Por” expressa isso naturalmente em português.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: por seu filho Jônatas
  rationale: O hebraico identifica Jônatas como filho de Saul. A ordem portuguesa evita possível rigidez sem perder essa relação explícita.
- source_word: עַם יְהוָה
  choice: o povo de Yahweh
  rationale: A tradução mantém o sentido coletivo e pactual da construção hebraica e preserva o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O Tetragrama é apresentado como nome próprio, em vez de ser substituído pelo título “SENHOR”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: A expressão conserva o idioma coletivo bíblico, que designa Israel como uma comunidade ligada por origem e identidade.
- source_word: כִּי
  choice: porque
  rationale: Aqui a conjunção introduz a razão do luto.
- source_word: נָפְלוּ
  choice: haviam caído
  rationale: נפל significa “cair” e, neste contexto de batalha, funciona como expressão de morte. O mais-que-perfeito composto deixa clara a anterioridade em relação ao luto sem eliminar a imagem original.
- source_word: בֶּחָרֶב
  choice: pela espada
  rationale: A formulação preserva a imagem hebraica da espada como meio de morte violenta, sem reduzi-la à paráfrase “em batalha”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Alcance do plural em נָפְלוּ (“haviam caído”)
  choice: Manter o sujeito plural implícito
  alternative: Explicitar que Saul, Jônatas e israelitas haviam morrido
  rationale: O hebraico emprega um plural sem delimitar novamente seus referentes. A tradução conserva essa amplitude e não transforma a metáfora “caíram” em uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por” acompanha a estrutura enfática do hebraico. Não foram reproduzidas as notas inglesas porque seus marcadores estão deslocados e as informações pertinentes já aparecem diretamente no texto português.
