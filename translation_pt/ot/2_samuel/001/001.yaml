- from: Depois da morte de Saul, quando Davi voltou de derrotar os amalequitas,[a] permaneceu dois dias em Ziclague.
  to: Depois da morte de Saul, quando Davi voltou de ferir os amalequitas,[a] Davi permaneceu em Ziclague por dois dias.
  rationale: A revisão substitui uma formulação que sugere resultado militar conclusivo por “ferir”, mais próxima de נכה, e explicita a segunda menção a Davi, preservando a estrutura e a ênfase narrativa do hebraico. A nota lexical é mantida, com sua âncora junto de “amalequitas”.
