base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: pt
  text: Depois da morte de Saul, quando Davi voltou de ferir os amalequitas,[a] Davi permaneceu em Ziclague por dois dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Amaleque”, empregado coletivamente em referência ao povo amalequita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Depois
  rationale: A fórmula narrativa introduz a nova cena e se integra naturalmente à oração temporal; não se acrescenta um marcador como “então” ou “aconteceu”, ausente como palavra temporal explícita.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Depois da morte de Saul
  rationale: Preserva a construção temporal nominal do hebraico em português natural e digno.
- source_word: וְדָוִד שָׁב
  choice: quando Davi voltou
  rationale: A oração circunstancial expressa a ação anterior relevante para a permanência em Ziclague; em português, o pretérito perfeito com “quando” comunica a sequência sem exigir forma composta.
- source_word: מֵהַכּוֹת
  choice: de derrotar
  rationale: O infinitivo de נכה com מן indica a ação militar da qual Davi retornava. “Derrotar” é claro e natural, embora menos imagético que “ferir” ou “abater”.
- source_word: אֶת הָעֲמָלֵק
  choice: os amalequitas
  rationale: O singular etnônimo “Amaleque” funciona coletivamente; o plural gentílico comunica com clareza a referência ao povo.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: O contexto limita a estadia a dois dias; “permaneceu” evita sugerir residência duradoura.
- source_word: בְּצִקְלָג
  choice: em Ziclague
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo, com preposição locativa natural.
- source_word: יָמִים שְׁנָיִם
  choice: dois dias
  rationale: Expressa diretamente o acusativo hebraico de duração; o verbo já torna desnecessário acrescentar “por”.
