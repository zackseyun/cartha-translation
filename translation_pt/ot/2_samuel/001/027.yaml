  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: pt
  text: Como caíram os poderosos, e pereceram os instrumentos de guerra![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as armas de guerra” ou “as armaduras de guerra”. A expressão hebraica pode abranger diversos tipos de equipamento militar, não apenas armas ofensivas.
    reason: lexical_alternative
  - marker: b
    text: A expressão “instrumentos de guerra” pode referir-se metaforicamente aos próprios Saul e Jônatas, como a força guerreira de Israel, embora também possa ser entendida literalmente.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de lamento, não uma pergunta; preserva a força poética e o refrão do cântico.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O perfeito hebraico relata a queda consumada; o pretérito perfeito é natural em português e mantém a cadência solene.
- source_word: גִבּוֹרִים
  choice: os poderosos
  rationale: Designa homens valentes ou guerreiros; esta forma concisa preserva o tom elevado sem restringir o sentido a uma categoria militar explícita.
- source_word: וַיֹּאבְדוּ
  choice: pereceram
  rationale: אבד pode significar perecer, perder-se ou ser destruído; “pereceram” combina com o lamento e permite leitura literal ou figurada.
- source_word: כְּלֵי מִלְחָמָה
  choice: os instrumentos de guerra
  rationale: כְּלֵי é mais amplo que “armas” e pode abranger armas, armaduras e outros equipamentos militares; a escolha conserva essa amplitude e também admite a possível metáfora pessoal.
theological_decisions:
- issue: Referente de כְּלֵי מִלְחָמָה
  choice: Manter aberta a referência literal ou metafórica
  alternative: Entender exclusivamente como armas e equipamentos destruídos, ou exclusivamente como Saul e Jônatas
  rationale: No contexto do lamento, a expressão pode designar equipamento militar em sentido literal ou, metaforicamente, Saul e Jônatas como força guerreira de Israel; o texto não obriga a resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com estrutura poética concisa. “Como caíram” retoma naturalmente o refrão do lamento; “instrumentos de guerra” preserva melhor que “armas” a amplitude lexical do hebraico.
