  naturalness: O português é claro, digno e adequado ao lamento poético. “Campos de ofertas” é deliberadamente incomum, mas é justificável por reproduzir uma expressão hebraica difícil, com alternativas na nota. “Maculado” mantém um registro poético natural sem a conotação cultual excessiva de “profanado”.
  terminology: “Montes de Gilboa”, “valentes”, “ofertas” e “ungido com óleo” são escolhas adequadas. A formulação final preserva a ambiguidade gramatical disponível em português; a nota deve evitar resolvê-la em excesso.
