  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: pt
  text: Montes de Gilboa, que não haja sobre vocês nem orvalho nem chuva, nem campos de ofertas[a]; pois ali foi maculado o escudo dos valentes, o escudo de Saul[b], não ungido com óleo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nem campos férteis”, “nem campos de primeiros frutos” ou “nem campos de contribuições sagradas”. A expressão hebraica é difícil, e a palavra traduzida por “ofertas” muitas vezes indica algo separado para Deus.
    reason: lexical_alternative
  - marker: b
    text: A frase final pode descrever o escudo de Saul como não tratado com óleo, uma preparação habitual para a batalha, em vez de chamar o próprio Saul de “ungido”.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Montes de Gilboa
  rationale: Preserva o vocativo direto e a referência à região montanhosa de Gilboa, com formulação natural em português.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: que não haja sobre vocês nem orvalho nem chuva
  rationale: Expressa o valor optativo ou imprecatório de אַל e mantém a interpelação direta aos montes.
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: nem campos de ofertas
  rationale: Mantém de modo transparente o sentido frequente de תְרוּמוֹת como contribuições ou ofertas separadas, sem resolver a expressão hebraica difícil por meio de uma paráfrase conjectural.
- source_word: כִּי שָׁם
  choice: pois ali
  rationale: Introduz naturalmente, em português, a razão da imprecação.
- source_word: נִגְעַל
  choice: foi profanado
  rationale: Comunica a desonra e contaminação do escudo no campo de batalha; evita reduzir o termo à ideia meramente física de ter sido abandonado.
- source_word: מָגֵן גִּבּוֹרִים
  choice: o escudo dos valentes
  rationale: Valentes conserva o caráter elevado do lamento e denota guerreiros de força e renome.
- source_word: מָגֵן שָׁאוּל
  choice: o escudo de Saul
  rationale: Preserva a repetição apositiva da poesia hebraica, que passa dos valentes em geral a Saul em particular.
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: não ungido com óleo
  rationale: Reproduz de perto a formulação hebraica e, no contexto imediato, descreve mais naturalmente o escudo sem o tratamento habitual com óleo.
theological_decisions:
- issue: Possível associação de מָשִׁיחַ ao título teológico “Messias” ou “ungido” aplicado a Saul
  choice: Entender a expressão verbalmente, como referência ao escudo “não ungido com óleo”.
  alternative: 'Entender a frase como referência a Saul enquanto ungido, por exemplo: “o escudo de Saul, como se ele não tivesse sido ungido com óleo”.'
  rationale: A ligação imediata com “com óleo” e o tema do escudo favorecem a prática de passar óleo no escudo. A tradução evita introduzir uma afirmação messiânica ou régia que a sintaxe não exige, mas registra em nota a possibilidade de confusão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A cadência poética e as repetições do lamento foram preservadas. “Sobre vocês” mantém a personificação dos montes; “profanado” conserva a força de desonra do hebraico.
