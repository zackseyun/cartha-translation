base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/017.yaml
  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: pt
  text: Então Davi entoou esta lamentação por Saul e por seu filho Jônatas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lamentou com esta lamentação”. O verbo e o substantivo hebraicos formam uma expressão para proferir uma lamentação fúnebre formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: entoou
  rationale: O verbo קונן descreve proferir ou entoar uma lamentação formal. “Entoou” comunica o caráter performativo sem afirmar de modo estrito que Davi a cantou.
- source_word: הַקִּינָה
  choice: esta lamentação
  rationale: קִינָה designa uma lamentação formal, especialmente pelos mortos. “Lamentação” é claro, digno e adequado ao contexto fúnebre.
- source_word: הַזֹּאת
  choice: esta
  rationale: O demonstrativo modifica diretamente “lamentação” e é reproduzido de forma simples.
- source_word: עַל
  choice: por
  rationale: Neste contexto, עַל indica as pessoas cuja morte é objeto do lamento. Em português, “lamentação por” é natural e expressa o pesar.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O sufixo remete a Saul e identifica Jônatas como filho dele, sem acrescentar ênfase ausente no hebraico.
- source_word: וַ
  choice: Então
  rationale: O waw com wayyiqtol faz avançar a narrativa; “Então” expressa naturalmente a sequência em português.
theological_decisions: []
