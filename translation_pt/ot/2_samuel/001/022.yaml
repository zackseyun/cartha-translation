  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: pt
  text: Do sangue dos mortos, da gordura[a] dos valentes, o arco de Jônatas não recuava[b], e a espada de Saul não voltava vazia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gordura” também pode sugerir a parte mais rica ou seleta, intensificando a imagem do êxito no combate.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se retirava”. O verbo hebraico pode transmitir a ideia de retirar-se ou voltar para trás.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: Do sangue dos mortos
  rationale: Preserva a expressão hebraica de origem ou afastamento e a imagem marcial. חֲלָלִים designa aqui os mortos em combate.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: da gordura dos valentes
  rationale: Mantém a imagem concreta e poética de חֵלֶב, que também pode sugerir a parte mais rica ou seleta, enquanto גִּבּוֹרִים se refere a combatentes fortes e valorosos.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: o arco de Jônatas
  rationale: Reproduz naturalmente a relação de construção hebraica e conserva o paralelismo poético com a espada de Saul.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: não recuava
  rationale: Expressa de modo conciso o movimento de retirar-se ou voltar para trás, preservando a personificação do arco.
- source_word: וְחֶרֶב שָׁאוּל
  choice: e a espada de Saul
  rationale: Mantém a estrutura paralela do verso em português claro e elevado.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: não voltava vazia
  rationale: Conserva a expressão idiomática e a personificação da espada, indicando que ela não retornava sem cumprir seu efeito.
