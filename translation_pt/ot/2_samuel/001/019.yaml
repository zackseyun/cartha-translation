translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é poético e solene, mas acessível. O tratamento possessivo com «seu/suas» mantém a apóstrofe direta a Israel; as notas preservam as ambiguidades lexicais relevantes.
