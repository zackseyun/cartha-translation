base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: pt
  text: Ó Israel, teu esplendor[a] jaz morto sobre as tuas alturas[b]! Como caíram os poderosos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico צְבִי também pode ser traduzido por «beleza» ou «glória»; alguns o entendem mais concretamente como «gazela».
    reason: lexical_alternative
  - marker: b
    text: Ou «os seus lugares altos». Aqui, «alturas» preserva o sentido topográfico sem implicar necessariamente lugares altos de culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: seu esplendor
  rationale: צְבִי pode significar beleza, esplendor ou glória e, concretamente, gazela. No lamento por Saul e Jônatas, o sentido figurado de esplendor nacional se ajusta melhor ao contexto, sem eliminar a alternativa concreta, registrada em nota.
- source_word: יִשְׂרָאֵל
  choice: Ó Israel
  rationale: O nome próprio é mantido, e a partícula «Ó» explicita a força vocativa do lamento em português digno e natural.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica a localização daquele que jaz morto nas alturas de Israel.
- source_word: בָּמוֹתֶיךָ
  choice: as suas alturas
  rationale: בָּמוֹת designa elevações ou alturas. «Alturas» conserva o sentido topográfico e poético sem sugerir necessariamente locais de culto.
- source_word: חָלָל
  choice: jaz morto
  rationale: O termo designa alguém morto violentamente. A formulação predicativa «jaz morto» é idiomática em português e preserva a imagem do morto caído no terreno.
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz a exclamação característica do lamento e mantém a força do refrão.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O perfeito hebraico relata a queda consumada; o pretérito perfeito simples é natural em português e adequado ao refrão fúnebre.
- source_word: גִבּוֹרִים
  choice: os poderosos
  rationale: גִבּוֹרִים pode indicar poderosos, guerreiros ou heróis. «Os poderosos» preserva a amplitude poética e funciona bem no refrão repetido do cântico.
