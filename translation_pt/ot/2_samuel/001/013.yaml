base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: pt
  text: 'Davi disse ao jovem que lhe trouxe a notícia: “De onde você é?” Ele respondeu: “Sou filho de um imigrante amalequita[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou filho de um estrangeiro residente, um amalequita”. A expressão hebraica pode identificar o pai como um imigrante amalequita ou, de modo mais amplo, ligar o próprio jovem, por descendência, a um amalequita que vivia naquela terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר designa aqui um homem jovem; “o jovem” é natural em português e não acrescenta a ideia de servo.
- source_word: הַמַּגִּיד לוֹ
  choice: que lhe havia trazido a notícia
  rationale: O particípio de נגד identifica o jovem como aquele que comunicou a notícia a Davi; o mais-que-perfeito composto esclarece a relação com o relato anterior.
- source_word: אֵי מִזֶּה
  choice: De onde você é?
  rationale: A expressão idiomática pergunta pela origem da pessoa; esta é a formulação contemporânea mais natural em português.
- source_word: בֶּן אִישׁ
  choice: filho de
  rationale: A construção hebraica significa literalmente “filho de um homem”; em português, “filho de” preserva a relação de descendência sem rigidez desnecessária.
- source_word: גֵּר
  choice: imigrante
  rationale: גֵּר indica alguém de origem estrangeira que reside fora de sua terra ou entre outro povo. “Imigrante” comunica esse estatuto em linguagem moderna, enquanto a nota registra a alternativa mais formal.
- source_word: עֲמָלֵקִי
  choice: amalequita
  rationale: É a designação étnica convencional em português para alguém pertencente ao povo de Amaleque.
- source_word: אָנֹכִי
  choice: Sou
  rationale: O pronome independente introduz uma autoidentificação enfática; em português, a forma verbal “sou” expressa naturalmente a cópula e a primeira pessoa.
theological_decisions:
- issue: Relação sintática entre גֵּר e עֲמָלֵקִי
  choice: “um imigrante amalequita”, entendendo “amalequita” como qualificativo do pai
  alternative: “um estrangeiro residente, um amalequita”, podendo a identificação amalequita ligar-se mais amplamente ao próprio falante por descendência
  rationale: A construção hebraica é compacta e permite alguma diferença de análise quanto ao alcance da identificação étnica. O texto principal adota a leitura sintaticamente direta, e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” reproduz com naturalidade a pergunta direta, e “imigrante” evita o arcaísmo de “peregrino”, sem apagar o estatuto estrangeiro de גֵּר.
