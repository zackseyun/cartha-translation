base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/007.yaml
  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: pt
  text: 'Ele se virou e me viu[a]. Então me chamou, e eu disse: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “virou-se para trás”. A expressão indica que ele se virou para olhar atrás de si.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Ele se virou
  rationale: A construção significa literalmente que ele se voltou para trás. “Se virou” comunica com naturalidade o movimento no contexto, enquanto a nota preserva a forma espacial do hebraico.
- source_word: וַיִּרְאֵנִי
  choice: e me viu
  rationale: O verbo ראה com o sufixo de primeira pessoa significa diretamente “viu-me”; a ordem “me viu” é natural no português corrente.
- source_word: וַיִּקְרָא אֵלַי
  choice: Então me chamou
  rationale: קרא com אֶל indica chamar alguém. “Me chamou” preserva o sentido sem acrescentar a ideia mais forte de convocação; “Então” expressa naturalmente a progressão narrativa do wayyiqtol.
- source_word: וָאֹמַר
  choice: e eu disse
  rationale: אמר significa normalmente “dizer”. Embora “respondi” seja possível pelo contexto, “disse” permanece mais próximo da forma hebraica.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Expressão convencional de apresentação e disponibilidade pessoal, natural em português e fiel à força idiomática do hebraico.
