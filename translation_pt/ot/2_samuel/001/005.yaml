base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: pt
  text: 'Então Davi disse ao jovem que o informava: “Como você sabe que Saul e seu filho Jônatas estão mortos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi perguntou
  rationale: A construção narrativa com waw consecutivo faz a narrativa avançar. Como a fala introduzida é uma pergunta, “perguntou” é natural em português e explicita corretamente a função do verbo de dizer neste contexto.
- source_word: הַנַּעַר
  choice: ao jovem
  rationale: נַעַר pode designar um rapaz ou jovem. O contexto apresenta alguém capaz de relatar acontecimentos do campo de batalha, por isso “jovem” evita tanto infantilizá-lo quanto acrescentar a ideia de servo.
- source_word: הַמַּגִּיד לוֹ
  choice: que lhe trouxera a notícia
  rationale: O particípio identifica o jovem como aquele que estava dando a informação a Davi. “Trouxera a notícia” soa natural no contexto narrativo e preserva a ideia de comunicar um relato.
- source_word: אֵיךְ יָדַעְתָּ
  choice: Como você sabe
  rationale: A pergunta busca a base do conhecimento do mensageiro. Embora יָדַעְתָּ tenha forma perfeita, o presente é idiomático em português para um estado atual de conhecimento adquirido anteriormente.
- source_word: כִּי
  choice: que
  rationale: 'Aqui כִּי introduz o conteúdo conhecido: a morte de Saul e Jônatas.'
- source_word: מֵת
  choice: estão mortos
  rationale: O hebraico usa forma singular com sujeito composto. Em português, a concordância plural é necessária; “estão mortos” comunica claramente o estado resultante.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: Saul e seu filho Jônatas
  rationale: A ordem portuguesa torna inequívoco que Jônatas é filho de Saul, preservando toda a informação do hebraico. As formas dos nomes seguem o uso bíblico português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega-se “você” na fala direta por naturalidade contemporânea, sem acrescentar formalidade ou intimidade não marcadas no hebraico.
