    rationale: O hebraico apresenta vividamente a cena com «e eis que» antes de Saul e novamente antes das forças perseguidoras; não declara que o mensageiro viu Saul.
  - severity: medium
    issue: «já se aproximavam dele» é mais fraco que הִדְבִּקֻהוּ.
    rationale: O verbo denota alcançar, alcançar de perto ou pressionar de perto; mera aproximação pode ainda ocorrer a distância. «O estavam alcançando» conserva a ação em curso e a proximidade.
  - severity: low
    issue: A nota a usa «teria chegado», que pode sugerir incerteza sobre a afirmação do narrador.
    rationale: A construção hebraica enfatiza o caráter casual alegado da presença, não modaliza por si só a declaração.
