base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: pt
  text: 'Então o jovem que lhe trazia a notícia disse: “Eu me encontrava por acaso no monte Gilboa[a], e eis que Saul estava apoiado em sua lança; e eis que os carros de guerra e os cavaleiros[b] o estavam alcançando[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fui parar por acaso no monte Gilboa”. A construção hebraica enfatiza o caráter casual de sua presença.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os carros de guerra e seus condutores”; ou: “os carros de guerra e a cavalaria”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “já o tinham alcançado”; ou: “o perseguiam de perto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר הַמַּגִּיד לוֹ
  choice: o jovem que lhe trazia a notícia
  rationale: נַעַר designa aqui o jovem mensageiro, e o particípio de נגד o identifica como aquele que dava a informação a Davi. A formulação é natural e mantém o caráter descritivo da expressão.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: Por acaso eu estava
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ideia de ocorrência fortuita. A expressão portuguesa comunica claramente que sua presença ali teria sido acidental.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: no monte Gilboa
  rationale: Forma geográfica corrente e clara em português para um monte de nome próprio.
- source_word: וְהִנֵּה
  choice: e vi
  rationale: No relato direto, הִנֵּה chama vividamente a atenção para o que o mensageiro encontrou. 'E vi' reproduz essa função de maneira natural, sem o arcaísmo de 'eis' repetido.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: apoiado em sua lança
  rationale: O particípio nifal de שען indica que Saul se sustentava ou se apoiava fisicamente na lança.
- source_word: הָרֶכֶב
  choice: os carros de guerra
  rationale: רֶכֶב pode ser coletivo, designando os carros ou a força de carros. 'Carros de guerra' evita que o leitor moderno pense em veículos comuns.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: os cavaleiros
  rationale: A expressão idiomática refere-se a combatentes montados. 'Cavaleiros' é clara e acessível, embora a construção hebraica admita 'condutores' ou 'homens da cavalaria'.
- source_word: הִדְבִּקֻהוּ
  choice: já se aproximavam dele
  rationale: O hifil de דבק pode indicar alcançar, perseguir de perto ou apertar o cerco. No contexto da cena em andamento, 'se aproximavam dele' preserva a noção de ameaça iminente sem afirmar captura consumada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de וְהִנֵּה foi vertida por uma apresentação vívida da cena, em vez de repetir 'e eis', que soaria marcada ou arcaica. Os marcadores de nota foram colocados junto às expressões às quais se referem.
