revisions:
- from: 'Então o jovem que lhe trazia a notícia disse: “Por acaso eu estava no monte Gilboa[a] e vi Saul apoiado em sua lança. Os carros de guerra e os cavaleiros[b] já se aproximavam dele[c].”'
  to: 'Então o jovem que lhe trazia a notícia disse: “Eu me encontrava por acaso no monte Gilboa[a], e eis que Saul estava apoiado em sua lança; e eis que os carros de guerra e os cavaleiros[b] o estavam alcançando[c].”'
  rationale: A revisão restitui os dois marcadores de apresentação vívida do hebraico sem acrescentar «vi» e torna mais preciso o movimento de perseguição próxima. Mantém o registro moderno, a ambiguidade aspectual do verbo final e os âncoras das notas.
