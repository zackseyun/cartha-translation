base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: pt
  text: 'Então Davi lhe disse: “O seu sangue está sobre a sua própria cabeça[a], pois a sua própria boca testemunhou contra você[b], dizendo: ‘Eu mesmo matei o ungido de Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em tom de sentença: “Que o seu sangue recaia sobre a sua cabeça.” A expressão hebraica atribui a ele mesmo a responsabilidade por sua morte.'
    reason: lexical_alternative
  - marker: b
    text: Ou “deu testemunho contra você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: Então Davi lhe disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “lhe” traduz אֵלָיו.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: O seu sangue está sobre a sua própria cabeça
  rationale: Mantém a imagem da fórmula judicial hebraica, que atribui ao próprio homem a responsabilidade por sua morte. A construção nominal também pode ser entendida como desejo ou sentença, possibilidade registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da sentença de Davi em tom explicativo e judicial.
- source_word: פִּיךָ
  choice: a sua própria boca
  rationale: Preserva a metonímia corporal e enfatiza que a condenação procede das palavras do próprio acusado.
- source_word: עָנָה בְךָ
  choice: testemunhou contra você
  rationale: No contexto judicial, o verbo com בְּ comunica testemunho incriminador, não uma simples resposta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo do testemunho.
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: A forma pronominal independente é enfática e destaca a autoincriminação.
- source_word: מֹתַתִּי
  choice: matei
  rationale: Traduz de forma direta e natural o causativo que significa provocar a morte.
- source_word: מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: “Ungido” traduz o título real aplicado a Saul sem antecipar associações cristológicas posteriores; “de Yahweh” preserva a relação expressa pelo construto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome divino pessoal do texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual como nome próprio.
- issue: Sentido de מְשִׁיחַ no contexto real
  choice: ungido
  alternative: messias
  rationale: Aqui o termo designa Saul como rei consagrado. “Ungido” traduz o título em seu contexto narrativo sem importar associações cristológicas que o versículo não explicita.
- issue: Valor da frase nominal דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: 'declaração de responsabilidade: “O seu sangue está sobre a sua própria cabeça”'
  alternative: 'sentença ou desejo: “Que o seu sangue recaia sobre a sua cabeça”'
  rationale: Sem verbo expresso, o hebraico permite mais de uma nuance. O texto principal usa a leitura declarativa natural no contexto, e a nota preserva a alternativa volitiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O tratamento por “você” torna explícita a segunda pessoa sem arcaísmo; “sua própria” preserva a ênfase reflexiva do contexto. As notas mantêm a ambiguidade da frase nominal hebraica e uma alternativa formal para a linguagem forense.
