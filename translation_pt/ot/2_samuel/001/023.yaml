id: 2SA.1.23
reference: 2 Samuel 1:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁא֣וּל וִ/יהוֹנָתָ֗ן הַ/נֶּאֱהָבִ֤ים וְ/הַ/נְּעִימִם֙ בְּ/חַיֵּי/הֶ֔ם וּ/בְ/מוֹתָ֖/ם לֹ֣א נִפְרָ֑דוּ מִ/נְּשָׁרִ֣ים קַ֔לּוּ מֵ/אֲרָי֖וֹת גָּבֵֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: pt
  text: 'Saul e Jônatas, amados e agradáveis em vida,

    nem na morte se separaram;

    eram mais velozes que as águias[a]

    e mais fortes que os leões.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os abutres”; o termo hebraico pode designar mais amplamente uma grande ave de rapina.
    reason: lexical_alternative
  - marker: b
    text: Ou “mais poderosos que os leões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saul e Jônatas
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: הַנֶּאֱהָבִים
  choice: amados
  rationale: Preserva o sentido passivo/adjetival de אהב e o tom elevado da lamentação.
- source_word: וְהַנְּעִימִם
  choice: agradáveis
  rationale: Expressa a qualidade de serem aprazíveis ou estimados sem restringir o termo à beleza física nem convertê-lo em virtude moral.
- source_word: בְּחַיֵּיהֶם וּבְמוֹתָם
  choice: em vida, nem na morte
  rationale: Mantém o paralelismo hebraico entre vida e morte em português natural e poético.
- source_word: לֹא נִפְרָדוּ
  choice: não se separaram
  rationale: Reproduz de modo natural a nuance reflexiva/passiva do nifal de פרד.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: eram mais velozes que as águias
  rationale: No contexto comparativo, קלל indica rapidez; נשר designa uma grande ave de rapina e é tradicional e naturalmente traduzido como 'águia', embora 'abutre' seja lexicalmente possível.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: mais fortes que os leões
  rationale: גבר comunica força ou superioridade; 'mais fortes' é claro, atual e preserva a comparação poética.
theological_decisions:
- issue: Tom da lamentação de Davi por Saul e Jônatas
  choice: Preservar o elogio fúnebre e honorífico dirigido conjuntamente a Saul e Jônatas.
  alternative: Atenuar o elogio por causa das falhas anteriores de Saul, ou ampliá-lo como declaração de perfeição moral.
  rationale: O versículo celebra poeticamente os mortos no contexto de uma lamentação. A tradução não deve eliminar a tensão com o retrato anterior de Saul nem transformar o elogio memorial em avaliação moral absoluta.
translation_notes:
  register: Português moderno, digno e poético, com legibilidade brasileira. A disposição em versos reflete o paralelismo da lamentação. 'Agradáveis' conserva a amplitude de נעים, embora 'encantadores' ou 'amáveis' também sejam possíveis.
