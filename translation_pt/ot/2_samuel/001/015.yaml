  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: pt
  text: 'Então Davi chamou um dos jovens e disse: “Aproxime-se e ataque-o.”[a] O jovem o golpeou, e ele morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caia sobre ele” ou “fira-o”. O verbo hebraico pode indicar de modo mais geral uma investida violenta; neste contexto, fica claro que o ataque seria fatal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא significa chamar ou convocar. “Chamou” é direto e natural, sem acrescentar formalidade.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: um dos jovens
  rationale: נְעָרִים pode designar jovens, servos ou auxiliares. “Jovens” preserva mais diretamente a linguagem de idade e condição do hebraico, sem transformá-la em título funcional.
- source_word: גַּשׁ
  choice: Aproxime-se
  rationale: O imperativo de נגשׁ significa aproximar-se ou chegar perto. “Aproxime-se” mantém o comando breve e digno.
- source_word: פְּגַע בּוֹ
  choice: ataque-o
  rationale: פגע com ב pode indicar investir contra alguém, atacar ou ferir. “Ataque-o” preserva a amplitude do verbo; o contexto e a sequência deixam claro que a ordem tem resultado letal.
- source_word: וַיַּכֵּהוּ
  choice: o golpeou
  rationale: נכה é o verbo comum para golpear ou ferir. A tradução mantém separadas a ação e sua consequência, expressa na oração seguinte.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: מות é o verbo usual para morrer, e a construção narrativa apresenta a morte como o evento seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O jovem” explicita o sujeito da oração seguinte para evitar que “ele” seja momentaneamente associado a Davi. A ambiguidade lexical de פְּגַע בּוֹ é preservada no texto e documentada na nota.
