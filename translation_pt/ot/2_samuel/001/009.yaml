base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: pt
  text: 'E ele me disse: “Por favor, fique de pé sobre mim e mate-me, pois uma agonia se apoderou de mim[a], embora a minha vida ainda esteja em mim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cãibras ou convulsões se apoderaram de mim”. O termo hebraico é raro, e seu sentido exato é incerto.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pois toda a minha vida ainda está em mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: Por favor, fique de pé junto de mim
  rationale: Preserva o sentido básico de עָמַד e a súplica expressa por נָא; “junto de mim” comunica naturalmente a posição ao lado ou sobre o ferido sem impor precisão espacial indevida.
- source_word: וּמֹתְתֵנִי
  choice: e mate-me
  rationale: O causativo de מות é um pedido direto para que lhe cause a morte; “mate-me” é claro, atual e fiel ao contexto de batalha.
- source_word: אֲחָזַנִי
  choice: se apoderou de mim
  rationale: Expressa a força de algo que agarra ou domina a pessoa, correspondente a אָחַז.
- source_word: הַשָּׁבָץ
  choice: uma agonia
  rationale: O termo é raro e de sentido incerto. “Agonia” mantém a gravidade do estado sem especificar indevidamente um sintoma físico; alternativas são registradas em nota.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: embora a minha vida ainda esteja em mim
  rationale: נֶפֶשׁ designa aqui a vida que anima a pessoa. “Embora” representa a provável relação concessiva no contexto, preservando-se em nota a forma mais literal.
- source_word: וַיֹּאמֶר אֵלַי
  choice: E ele me disse
  rationale: Reproduz de modo simples e natural a sequência narrativa do wayyiqtol.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma
  rationale: No contexto, o termo se refere ao fato de Saul continuar vivo, não define tecnicamente uma antropologia ou o estado de uma alma imaterial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a urgência direta do campo de batalha. A incerteza do termo הַשָּׁבָץ e a construção mais literal da cláusula final são preservadas em notas.
