  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: pt
  text: 'Então Davi lhe disse: “Como você não teve medo de estender a mão para destruir o ungido de Yahweh[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o rei consagrado por Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” comunica com naturalidade a sequência dos acontecimentos.
- source_word: אֵלָיו
  choice: lhe
  rationale: Pronome dativo natural em português, referido ao mensageiro amalequita.
- source_word: אֵיךְ
  choice: Como
  rationale: Preserva a forma interrogativa hebraica e seu tom de censura espantada, sem substituí-la pela interpretação mais explícita “Por que”.
- source_word: לֹא יָרֵאתָ
  choice: você não teve medo
  rationale: Expressa de modo atual e claro o sentido de temer diante da gravidade do ato.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: estender a mão
  rationale: Mantém a imagem idiomática hebraica de agir contra alguém, aqui de maneira violenta, e continua inteligível em português.
- source_word: לְשַׁחֵת
  choice: destruir
  rationale: Conserva o alcance lexical de שׁחת; no contexto, a destruição implica matar Saul, mas o verbo hebraico não precisa ser estreitado.
- source_word: מְשִׁיחַ
  choice: ungido
  rationale: Refere-se a Saul como rei consagrado, sem importar automaticamente o título messiânico posterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” o preserva de modo transparente, sem trocá-lo pelo título “SENHOR”.
- issue: Sentido de מְשִׁיחַ aplicado a Saul
  choice: o ungido de Yahweh
  alternative: o messias de Yahweh; aquele que Yahweh ungiu
  rationale: “Ungido” preserva a consagração régia de Saul e evita impor ao contexto uma referência direta ao Messias escatológico.
- issue: Força retórica de אֵיךְ
  choice: Como você não teve medo...?
  alternative: Por que você não teve medo...?
  rationale: “Como” conserva a formulação e a censura espantada do hebraico; “Por que” explicitaria a função pragmática, mas reduziria a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a imagem bíblica “estender a mão” e a pergunta com “Como” para preservar a força do hebraico. O marcador [a] aparece imediatamente após a expressão explicada.
