  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: pt
  text: 'Ele me perguntou: “Quem é você?” Eu lhe respondi[a]: “Sou amalequita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na segunda oração, o hebraico traz formalmente “e ele disse”; pelo contexto, o sentido é “eu respondi”, pois o falante relata sua própria resposta a Saul.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Ele me perguntou
  rationale: O verbo significa literalmente “disse”, mas, por introduzir uma pergunta direta, “perguntou” comunica naturalmente sua função no contexto; לִי indica que Saul se dirige ao narrador.
- source_word: מִי אַתָּה
  choice: Quem é você?
  rationale: A pergunta nominal hebraica é vertida pela formulação interrogativa corrente em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Eu lhe respondi
  rationale: Embora o texto massorético tenha formalmente “e ele disse”, o discurso exige que o amalequita relate sua própria resposta a Saul. “Respondi” explicita de modo natural a função da fala, enquanto a nota preserva a forma hebraica.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Sou amalequita
  rationale: O gentílico identifica a origem do falante; a cópula é necessária em português, e o artigo é dispensável após “sou” nesta identificação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Perguntou” e “respondi” reproduzem as funções discursivas dos verbos de fala sem tornar o diálogo artificial; a nota registra a dificuldade formal do segundo verbo.
