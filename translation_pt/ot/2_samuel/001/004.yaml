base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: pt
  text: 'Davi lhe perguntou: “O que aconteceu?[a] Por favor, conte-me.” Ele respondeu: “O povo fugiu da batalha, e muitos do povo também caíram e morreram.[b] Saul e seu filho Jônatas também morreram.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que houve?” Literalmente: “O que foi o assunto?”'
    reason: lexical_alternative
  - marker: b
    text: Em relatos de batalha, “cair” é uma maneira comum de dizer que alguém foi abatido; “e morreram” explicita o resultado.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Saul e seu filho Jônatas também estão mortos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: O que aconteceu?
  rationale: A expressão pergunta literalmente o que foi ou ocorreu; em português atual, “O que aconteceu?” comunica com naturalidade que Davi pede um relato dos fatos.
- source_word: הַגֶּד נָא לִי
  choice: Por favor, conte-me
  rationale: O imperativo הַגֶּד pede que o homem relate a notícia, e נָא acrescenta cortesia ou insistência. A formulação escolhida conserva os dois aspectos.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: O povo fugiu da batalha
  rationale: נָס significa “fugiu”, e הָעָם designa coletivamente o povo ou a força combatente. “O povo” mantém a forma abrangente do hebraico.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם
  choice: e muitos do povo também caíram
  rationale: Em contexto de batalha, נפל pode indicar cair abatido. Preservar “caíram” mantém a imagem hebraica, enquanto a oração seguinte explicita que morreram.
- source_word: וַיָּמֻתוּ
  choice: e morreram
  rationale: O texto declara a morte além de dizer que muitos “caíram”; os dois verbos são mantidos para não eliminar a progressão do relato.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: Saul e seu filho Jônatas também morreram
  rationale: A formulação preserva a notícia culminante, a relação filial explicitada no hebraico e o valor verbal direto de מֵתוּ.
