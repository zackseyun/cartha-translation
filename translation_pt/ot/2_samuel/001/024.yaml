base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: pt
  text: 'Filhas de Israel, chorem por Saul,

    que as vestia de escarlate, com luxo[a],

    e punha adornos de ouro[b] sobre suas roupas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com requinte”, “com delícias” ou “com adornos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “joias de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Filhas de Israel
  rationale: Preserva o vocativo hebraico e o tom poético da lamentação, sem o achatar para “mulheres de Israel”.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: chorem por Saul
  rationale: No contexto de uma lamentação fúnebre, אֶל indica o objeto do pranto; “chorar por” é natural e claro em português.
- source_word: הַמַּלְבִּשְׁכֶם
  choice: que as vestia
  rationale: O particípio com artigo retoma Saul e expressa uma ação característica; o pretérito imperfeito se ajusta ao elogio memorial.
- source_word: שָׁנִי
  choice: escarlate
  rationale: Equivalente tradicional e preciso para o tecido ou cor tingida de vermelho vivo.
- source_word: עִם עֲדָנִים
  choice: com luxo
  rationale: A expressão é semanticamente difícil e pode indicar delícias, requinte, adornos ou luxo; “com luxo” comunica de modo natural a ideia geral sem especificar indevidamente.
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: adornava de ouro
  rationale: Traduz idiomaticamente a ação de colocar adornos de ouro e mantém o paralelismo poético sem redundância pesada.
- source_word: עַל לְבוּשְׁכֶן
  choice: as suas roupas
  rationale: Integra naturalmente o complemento em português, preservando a referência ao vestuário das mulheres.
