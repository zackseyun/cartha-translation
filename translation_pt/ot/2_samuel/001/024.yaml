  source_fidelity: A primeira oração e o vocativo refletem bem o hebraico. Contudo, «adornava de ouro as suas roupas» torna as roupas o objeto diretamente adornado e deixa implícito o substantivo עֲדִי («adornos/joias»). Uma formulação explícita preserva melhor a construção «punha adornos de ouro sobre as suas roupas».
  naturalness: «Filhas de Israel» e «chorem por Saul» são naturais no registro poético. A vírgula em «de escarlate, com luxo» esclarece a relação da expressão final com o ato de vestir. «Punha adornos de ouro sobre suas roupas» é claro e idiomático em português moderno.
  terminology: «Escarlate» é adequado para שָׁנִי. «Luxo» conserva de modo conciso a amplitude de עֲדָנִים, cuja nuance exata permanece discutível; a nota oferece alternativas. «Adornos de ouro» traduz explicitamente עֲדִי זָהָב.
