base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: pt
  text: Quando terminou o período de luto, Davi mandou trazê-la para sua casa. Ela se tornou sua esposa e deu à luz um filho. Mas o que Davi havia feito era mau aos olhos de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desagradou a Yahweh”. Mais literalmente: “a coisa que Davi fez era má aos olhos de Yahweh”.'
    reason: Registra uma tradução idiomática possível e apresenta a forma mais literal da avaliação moral hebraica.
lexical_decisions:
- source_word: הָאֵבֶל
  choice: o período de luto
  rationale: Designa o luto após a morte de Urias, incluindo sua dimensão social e ritual; “período de luto” explicita naturalmente o sentido temporal no contexto.
- source_word: וַיַּעֲבֹר
  choice: terminou
  rationale: Embora o verbo signifique literalmente “passou”, com “período de luto” o português idiomático pede “terminou”.
- source_word: וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: a recebeu em sua casa
  rationale: O verbo אָסַף comunica aqui que Davi fez Bate-Seba entrar em seu lar e passar a integrar sua casa; “recebeu” preserva esse sentido sem a rigidez de “reuniu”.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ela se tornou sua esposa
  rationale: A construção indica mudança de condição. “Esposa” é clara e natural para o vínculo matrimonial aqui descrito.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: lhe deu um filho
  rationale: Expressão portuguesa corrente para o parto indicado por ילד com objeto indireto, mantendo a relação expressa no hebraico.
- source_word: וַיֵּרַע
  choice: era mau
  rationale: Preserva a força moral de רָעַע, em vez de reduzir a frase à ideia mais subjetiva de mero desagrado.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: o que Davi havia feito
  rationale: Forma natural em português para o hebraico “a coisa que Davi fez”, referindo-se ao conjunto de seus atos.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica de avaliação divina e sua formulação solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em conformidade com a política do projeto.
theological_decisions:
- issue: Força da avaliação moral das ações de Davi
  choice: era mau aos olhos de Yahweh
  alternative: desagradou a Yahweh
  rationale: O hebraico formula um juízo moral explícito sobre o ato. A tradução escolhida evita enfraquecer a condenação, sem acrescentar uma classificação teológica que o verso não declara.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome pessoal divino que aparece no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sequência narrativa foi dividida em três frases para legibilidade, sem alterar sua progressão. A formulação final mantém a metáfora hebraica e a condenação moral explícita.
