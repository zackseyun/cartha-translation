  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: pt
  text: 'E, se a ira do rei se acender e ele lhe disser: “Por que vocês chegaram tão perto da cidade para lutar? Não sabiam o que eles disparariam do alto da muralha?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que eles lançariam do alto da muralha”. O verbo hebraico também pode ter o sentido mais amplo de arremessar projéteis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: E, se
  rationale: Introduz a situação condicional e preserva a ligação narrativa do waw, sem reproduzir de modo artificial a fórmula hebraica.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: a ira do rei se acender
  rationale: חֵמָה indica ira intensa, e a expressão portuguesa comunica naturalmente o aumento dessa ira, preservando a imagem dinâmica do hebraico.
- source_word: וְאָמַר לְךָ
  choice: e ele lhe disser
  rationale: O futuro do subjuntivo é a forma idiomática em português para a ação projetada dentro da condição.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo direto e natural.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: vocês chegaram tão perto da cidade
  rationale: נגשׁ significa aproximar-se. “Tão perto” torna explícito o tom de censura contextual sem alterar a ação descrita; o plural “vocês” representa a segunda pessoa plural.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: Expressa de forma concisa a finalidade do infinitivo hebraico no contexto militar.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Não sabiam
  rationale: Preserva a pergunta retórica que pressupõe resposta afirmativa e mantém a segunda pessoa plural.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: o que eles disparariam
  rationale: ירה no hifil frequentemente se refere a disparar ou lançar projéteis. “Disparariam” comunica bem o sentido militar, enquanto a nota registra a amplitude lexical.
- source_word: מֵעַל הַחוֹמָה
  choice: do alto da muralha
  rationale: Representa explicitamente o sentido de מֵעַל, “de cima de/sobre”, e “muralha” é apropriado para a fortificação urbana.
