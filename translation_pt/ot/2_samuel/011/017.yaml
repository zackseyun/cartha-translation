base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: pt
  text: Os homens da cidade saíram e lutaram contra Joabe, e alguns dos homens a serviço de Davi tombaram[a]; Urias, o hitita, também morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do povo, dos servos de Davi”, expressão partitiva que indica que alguns dos homens de Davi tombaram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O verbo יצא indica sair. Em português, “saíram” é natural e não exige escolher entre as perspectivas expressas em inglês por “came out” e “went out”.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Reproduz de modo direto a expressão construta e mantém a referência masculina apropriada aos combatentes.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: lutaram contra Joabe
  rationale: A construção descreve confronto hostil; “contra” comunica isso claramente em português corrente.
- source_word: וַיִּפֹּל
  choice: tombaram
  rationale: Mantém o conhecido uso militar de נפל para baixas em combate, sem explicitar além do texto se cada homem morreu naquele instante.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: alguns dos homens que serviam a Davi
  rationale: Expressa naturalmente o valor partitivo de מן e o sentido contextual de עבדים como integrantes das forças a serviço de Davi. Uma nota preserva a forma mais literal e sua repetição.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: e Urias, o hitita, também morreu
  rationale: “Também” preserva o valor aditivo e enfático de גם, destacando que Urias estava entre as baixas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. “Joabe” e “Urias” seguem as formas bíblicas tradicionais em português; “hitita” é mantido como designação étnica. A repetição partitiva do hebraico foi vertida no corpo do texto de forma idiomática e documentada em nota.
