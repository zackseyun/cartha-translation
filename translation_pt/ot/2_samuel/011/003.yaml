base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: pt
  text: 'Então Davi mandou buscar informações sobre a mulher, e alguém disse: “Não é esta Bate-Seba, filha de Eliã e esposa de Urias, o hitita?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: mandou buscar informações sobre a mulher
  rationale: O verbo דרשׁ indica procurar saber ou informar-se; a formulação explicita de modo natural em português que Davi encarregou alguém de obter informações.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: Gentílico tradicional, claro e corrente em português bíblico.
theological_decisions:
- issue: Sujeito de וַיֹּאמֶר
  choice: alguém disse
  alternative: ele disse
  rationale: A forma verbal masculina singular não identifica expressamente o falante. Pelo contexto, a resposta provavelmente vem de um mensageiro ou informante; “alguém” preserva essa indeterminação e evita atribuir a fala a Davi.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A pergunta retórica hebraica foi preservada sem suavizar a identificação da mulher por seus vínculos familiares e conjugais.
