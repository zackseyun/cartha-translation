  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: pt
  text: 'Urias disse a Davi: “A arca, Israel e Judá estão em abrigos temporários[a], e meu senhor Joabe e os servos de meu senhor estão acampados em campo aberto. E eu iria para casa comer, beber e me deitar com minha mulher?[b] Tão certo como você vive e como vive a sua alma, não farei tal coisa!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “cabanas”. O termo hebraico se refere a abrigos provisórios usados no campo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Acaso eu iria para casa...?” A construção hebraica expressa uma pergunta retórica e a recusa indignada de Urias.'
    reason: alternative_reading
  - marker: c
    text: 'Literalmente, a fórmula de juramento termina: “pela sua vida e pela vida da sua alma, se eu fizer tal coisa”. Depois do juramento, “se” expressa aqui uma forte negação, com a consequência da imprecação deixada implícita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O hebraico traz simplesmente o substantivo definido, sem acrescentar “de Deus” ou “da aliança”; a tradução preserva essa forma e o referente conhecido pelo contexto.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: estão alojados em abrigos temporários
  rationale: סֻכּוֹת designa cabanas ou abrigos provisórios. A formulação comunica com naturalidade a precariedade das acomodações de campanha sem substituí-las especificamente por tendas.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Aqui é um título humano respeitoso aplicado a Joabe, não uma referência ao nome divino.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: A expressão idiomática indica que as tropas estavam acampadas ao ar livre, expostas no campo.
- source_word: חֹנִים
  choice: estão acampados
  rationale: O particípio descreve a condição contínua de um acampamento militar.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: E eu iria para casa
  rationale: O imperfeito de primeira pessoa funciona no contexto como pergunta retórica indignada. O condicional português conserva a ideia de que tal conduta seria inconcebível diante das circunstâncias mencionadas.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: comer, beber e me deitar com minha mulher
  rationale: A sequência preserva as três ações e traduz com dignidade o eufemismo sexual “deitar-se com”.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Tão certo como você vive e como vive a sua alma
  rationale: A formulação mantém a solenidade e a duplicação da fórmula hebraica de juramento, incluindo נֶפֶשׁ como “alma”, sem a reduzir silenciosamente a “vida” ou “pessoa”.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: não farei tal coisa
  rationale: Depois da fórmula de juramento, אִם introduz uma imprecação elíptica e expressa forte negação; vertê-lo apenas como “se” deixaria a frase incompleta e enganosa em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita a rigidez regional de “tu” sem tornar a fala informal; “meu senhor” mantém o respeito hierárquico. A pergunta retórica e a fórmula solene de juramento preservam a intensidade da resposta de Urias.
