base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: pt
  text: 'Ele ordenou ao mensageiro: “Quando você terminar de contar ao rei todas as notícias da batalha,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os assuntos relativos à batalha”, isto é, o relato completo sobre a batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Ele deu esta ordem
  rationale: צוה expressa uma ordem ou instrução com autoridade; a formulação é natural em português narrativo e mantém essa força.
- source_word: הַמַּלְאָךְ
  choice: ao mensageiro
  rationale: Embora מַלְאָךְ também possa designar um anjo, o contexto militar mostra que aqui se trata de um mensageiro humano.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em narrativa hebraica, o infinitivo introduz discurso direto. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que o literal «dizendo».
- source_word: כְּכַלּוֹתְךָ
  choice: Quando você terminar
  rationale: A construção temporal indica o momento em que o mensageiro terá concluído o relato, sem exigir a ideia mais específica de imediatismo.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: tudo o que aconteceu na batalha
  rationale: Literalmente, «todas as palavras/coisas da batalha»; no contexto, refere-se ao relato completo dos acontecimentos da batalha. A opção comunica esse sentido de modo claro e idiomático.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: de contar ao rei
  rationale: O infinitivo «falar» com o destinatário descreve aqui a transmissão do relatório ao rei; «contar ao rei» exprime naturalmente essa função.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece aberta porque a fala continua no versículo seguinte. O pronome «você» torna explícita a segunda pessoa singular indicada pelo sufixo hebraico.
