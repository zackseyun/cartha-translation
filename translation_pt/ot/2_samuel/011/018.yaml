  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: pt
  text: Então, Joabe mandou comunicar a Davi todos os acontecimentos da batalha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo a respeito da batalha”. O hebraico diz literalmente “todas as palavras da batalha”, expressão que pode se referir a todos os detalhes ou ao relato da batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou uma mensagem
  rationale: O verbo significa literalmente “enviou/mandou”. Neste contexto, seguido do verbo “contou” e sem objeto expresso, a formulação deixa claro em português que Joabe mandou transmitir uma notícia.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיַּגֵּד
  choice: contou
  rationale: No hifil, נגד significa “contar, declarar, informar”. “Contou” é natural em português e preserva a construção narrativa.
- source_word: לְדָוִד
  choice: a Davi
  rationale: A preposição לְ marca o destinatário da informação; “a Davi” reproduz essa relação com clareza.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: todos os detalhes da batalha
  rationale: Literalmente, “todas as palavras/coisas da batalha”. No contexto de um relatório militar, “todos os detalhes” comunica naturalmente o conjunto dos acontecimentos ou informações, enquanto a nota preserva a expressão hebraica e sua amplitude.
- source_word: הַמִּלְחָמָה
  choice: a batalha
  rationale: Embora מִלְחָמָה também possa significar “guerra”, o contexto imediato trata de uma ação militar específica comunicada a Davi; por isso, “batalha” é a opção mais precisa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A combinação “mandou uma mensagem e contou” conserva os dois verbos hebraicos sem sugerir que Joabe tenha falado pessoalmente com Davi.
