base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: pt
  text: Pela manhã, Davi escreveu uma carta a Joabe e a enviou pela mão de Urias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio de Urias» ou «com Urias». O hebraico diz literalmente «pela mão de Urias», expressão que pode indicar o agente ou portador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pela manhã
  rationale: A fórmula narrativa com היה e a expressão temporal introduzem o acontecimento seguinte. Em português, «Pela manhã» preserva a transição com naturalidade, sem a formulação pesada «E aconteceu pela manhã».
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: Equivalente corrente e direto do verbo hebraico no contexto narrativo.
- source_word: סֵפֶר
  choice: uma carta
  rationale: Embora o substantivo possa designar um documento escrito em sentido amplo, o contexto de uma mensagem dirigida e enviada a Joabe favorece «carta».
- source_word: אֶל יוֹאָב
  choice: a Joabe
  rationale: A preposição assinala o destinatário; «a Joabe» é uma construção clara e natural em português.
- source_word: וַיִּשְׁלַח
  choice: a enviou
  rationale: O pronome retoma «uma carta» e torna explícito, com naturalidade em português, o objeto do verbo.
- source_word: בְּיַד אוּרִיָּה
  choice: pelas mãos de Urias
  rationale: Mantém de modo compreensível o idioma hebraico «pela mão de», que pode expressar o agente ou portador, e preserva a ironia sombria de Urias transportar a própria sentença.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem narrativa natural. A expressão «pelas mãos de Urias» conserva o sabor do hebraico sem perder clareza; a nota registra equivalentes idiomáticos.
