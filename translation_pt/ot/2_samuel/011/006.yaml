base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: pt
  text: 'Então Davi mandou dizer a Joabe: “Mande-me Urias, o hitita.” E Joabe enviou Urias a Davi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: Davi mandou dizer a Joabe
  rationale: O verbo שׁלח significa literalmente “enviar”. Como o objeto enviado fica implícito e a ordem vem logo em seguida, “mandou dizer” expressa naturalmente em português que Davi comunicou uma ordem a Joabe.
- source_word: שְׁלַח אֵלַי
  choice: Mande-me
  rationale: O imperativo שְׁלַח seguido de אֵלַי significa “envie a mim”. “Mande-me” preserva a ordem direta e soa natural no português corrente, sem acrescentar a ideia de retorno.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Urias, o hitita
  rationale: O nome é vertido na forma portuguesa consagrada “Urias”, e o gentílico חִתִּי como “hitita”. A vírgula favorece a leitura do gentílico como identificação apositiva.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: E Joabe enviou Urias a Davi
  rationale: A segunda ocorrência repete o verbo שׁלח na sequência narrativa. “Enviou” mantém o sentido literal, enquanto “E” reproduz com naturalidade o encadeamento do waw consecutivo.
