base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/022.yaml
  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: pt
  text: Então o mensageiro foi, chegou e contou a Davi tudo o que Joabe o havia enviado para comunicar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «tudo o que Joabe o enviou». A construção deixa implícito o que o mensageiro devia comunicar; por isso, a tradução explicita «para comunicar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Em contexto humano e militar, מַלְאָךְ designa quem leva uma mensagem; «mensageiro» é a opção direta e natural.
- source_word: וַיֵּלֶךְ וַיָּבֹא
  choice: foi, chegou
  rationale: A sequência narrativa indica que ele partiu e depois chegou. «Chegou» comunica em português o valor contextual de בוא com mais naturalidade do que a reprodução rígida «veio».
- source_word: וַיַּגֵּד לְדָוִד
  choice: contou a Davi
  rationale: O hifil de נגד significa contar, relatar ou dar a conhecer. «Contou a Davi» é corrente, claro e preserva a construção com destinatário.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: A expressão abrange a totalidade do conteúdo comunicado e encontra correspondência idiomática exata em «tudo o que».
- source_word: שְׁלָחוֹ יוֹאָב
  choice: Joabe o havia enviado para comunicar
  rationale: Literalmente, «Joabe o enviou». A formulação explicita a finalidade comunicativa já indicada pelo contexto e evita em português a ideia incompleta de que Davi ouviu simplesmente tudo aquilo para o qual o mensageiro fora enviado.
- source_word: לְדָוִד
  choice: a Davi
  rationale: O nome próprio segue a forma portuguesa consagrada, e a preposição marca o destinatário do relato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação breve preserva o ritmo narrativo hebraico, enquanto «chegou» e «para comunicar» asseguram naturalidade sem alterar o conteúdo.
