base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: pt
  text: 'Então Davi disse a Urias: “Fique aqui também hoje, e amanhã eu o mandarei partir.” Assim, Urias ficou em Jerusalém naquele dia e no dia seguinte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência de modo natural em português.
- source_word: שֵׁב בָּזֶה
  choice: Fique aqui
  rationale: Neste contexto, ישׁב indica permanecer temporariamente em um lugar, e בָּזֶה tem sentido idiomático de “aqui”.
- source_word: גַּם הַיּוֹם
  choice: também hoje
  rationale: Preserva o valor aditivo de גַּם e mantém uma ordem natural em português.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: e amanhã eu o mandarei partir
  rationale: שׁלח significa enviar ou deixar partir; “mandarei partir” comunica naturalmente que Davi permitiria ou determinaria a saída de Urias de Jerusalém, sem acrescentar destino não expresso.
- source_word: וַיֵּשֶׁב
  choice: Assim, Urias ficou
  rationale: O verbo retoma a ordem anterior com o sentido contextual de permanecer; “Assim” apresenta com clareza a resposta narrativa.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: naquele dia e no dia seguinte
  rationale: Expressa de forma clara e atual os dois períodos indicados pelo hebraico.
theological_decisions: []
