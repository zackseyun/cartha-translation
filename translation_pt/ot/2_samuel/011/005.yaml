  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: pt
  text: 'A mulher ficou grávida[a]. Ela enviou uma mensagem a Davi[b] e lhe comunicou: “Estou grávida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “A mulher concebeu”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz simplesmente “enviou”; pelo contexto, entende-se que ela enviou uma mensagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ficou grávida
  rationale: O verbo הרה indica que a mulher passou a estar grávida. “Ficou grávida” expressa com naturalidade em português tanto o acontecimento quanto a mudança de estado.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. Neste enunciado, a referência direta é à mulher mencionada no contexto, sem explicitar aqui a relação conjugal; por isso, “a mulher” preserva melhor a formulação hebraica.
- source_word: וַתִּשְׁלַח
  choice: mandou avisar
  rationale: Embora שׁלח signifique literalmente “enviar”, neste contexto o objeto implícito é uma mensagem. “Mandou avisar” é idiomático em português e mantém essa implicitude.
- source_word: וַתַּגֵּד
  choice: avisar
  rationale: O hifil de נגד significa contar, declarar ou comunicar. Integrado à construção “mandou avisar”, transmite de modo natural a comunicação feita a Davi, sem redundância artificial.
- source_word: לְדָוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico דָוִד.
- source_word: הָרָה אָנֹכִי
  choice: Estou grávida
  rationale: O adjetivo predicativo הָרָה com o pronome אָנֹכִי exprime o estado presente da mulher. “Estou grávida” é a formulação portuguesa direta e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo para brasileiros e ampla compreensão internacional. A repetição de “grávida” preserva a sequência enfática do hebraico; a divisão em duas frases torna clara a progressão narrativa.
