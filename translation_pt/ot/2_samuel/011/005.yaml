  source_fidelity: 'A primeira oração corresponde bem a וַתַּהַר, que descreve o início da gravidez. Na segunda, porém, “mandou avisar” introduz uma nuance causativa (ordenar que alguém avisasse) que não está expressa no hebraico. O texto hebraico mantém as duas ações: ela enviou (isto é, uma mensagem, por implicação contextual) e comunicou a Davi.'
  naturalness: “Ficou grávida” e “Estou grávida” são naturais, claras e adequadas ao registro narrativo. “Ela enviou uma mensagem a Davi e lhe comunicou” preserva melhor as duas ações hebraicas e continua fluente em português moderno.
  terminology: “A mulher”, “Davi” e “grávida” são escolhas corretas e consistentes. A nota deve limitar a explicação contextual ao verbo “enviou”, sem caracterizá-lo como se todo o enunciado hebraico fosse apenas uma formulação literal única.
