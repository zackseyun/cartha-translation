base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: pt
  text: Os arqueiros atiraram contra os teus servos do alto da muralha, e alguns dos servos do rei morreram; também morreu o teu servo Urias, o hitita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Os arqueiros atiraram
  rationale: O verbo ירה e o particípio הַמּוֹרִים indicam atiradores; «arqueiros» expressa naturalmente o sentido militar no contexto.
- source_word: אֶל עֲבָדֶיךָ
  choice: contra os teus servos
  rationale: Com o verbo «atirar», «contra» comunica de modo natural o alvo do ataque, enquanto «teus servos» preserva a linguagem deferente da corte.
- source_word: מֵעַל הַחוֹמָה
  choice: do alto da muralha
  rationale: A expressão indica que os disparos partiram de cima ou de sobre a muralha; esta formulação é clara e idiomática em português.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: e alguns dos servos do rei morreram
  rationale: A preposição מִן tem aqui valor partitivo, indicando que morreram alguns dentre os servos do rei.
- source_word: וְגַם
  choice: também
  rationale: Preserva a força aditiva e introduz a morte de Urias como ponto culminante do relatório.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: o teu servo Urias, o hitita
  rationale: Mantém a forma deferente de tratamento, a transliteração portuguesa tradicional do nome e a identificação étnica.
- source_word: מֵת
  choice: morreu
  rationale: Embora a forma possa descrever o estado «está morto», no fluxo do relato «morreu» corresponde naturalmente à sequência narrativa e ao verbo anterior.
