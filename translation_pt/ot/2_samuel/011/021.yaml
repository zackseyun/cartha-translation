source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: pt
  text: 'Quem feriu Abimeleque, filho de Jerubesete[a]? Não foi uma mulher que lançou sobre ele, do alto da muralha, a pedra superior de um moinho[b], e ele morreu em Tebes[c]? Por que vocês se aproximaram da muralha?’ Então você dirá: ‘Também morreu o seu servo Urias, o hitita.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Jerubesete”; compare com Juízes 9:1, onde aparece “Jerubaal”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “um pedaço de uma mó”. A expressão hebraica provavelmente se refere à pedra superior do moinho.'
    reason: lexical_alternative
  - marker: c
    text: Veja em Juízes 9:53 o episódio aqui mencionado.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: feriu
  rationale: Preserva o sentido concreto de ‘golpear/ferir’ do hebraico; o contexto e a frase seguinte deixam claro que o golpe foi fatal.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: Abimeleque, filho de Jerubesete
  rationale: Segue a forma do texto hebraico massorético sem harmonizá-la com ‘Jerubaal’ em Juízes 9.
- source_word: הֲלֹא
  choice: Não foi ...?
  rationale: Mantém a pergunta retórica que espera resposta afirmativa.
- source_word: פֶּלַח רֶכֶב
  choice: a pedra superior de um moinho
  rationale: Expressa o referente mais provável em português claro, sem ocultar em nota a possibilidade lexical de ‘um pedaço de mó’.
- source_word: מֵעַל הַחוֹמָה
  choice: do alto da muralha
  rationale: Torna explícita a posição elevada indicada pela preposição hebraica e se ajusta naturalmente ao ato de lançar a pedra.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: e ele morreu em Tebes
  rationale: Mantém a coordenação narrativa do hebraico sem tornar explícita uma relação causal além do que a sequência já comunica.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: Por que vocês se aproximaram da muralha?
  rationale: Reproduz diretamente o plural do verbo e a censura implícita no contexto militar.
- source_word: וְאָמַרְתָּ
  choice: Então você dirá
  rationale: O singular se dirige ao mensageiro e introduz a resposta que ele deverá dar.
- source_word: גַּם עַבְדְּךָ
  choice: Também morreu o seu servo
  rationale: ‘Também’ conserva o valor aditivo de גַּם, e ‘servo’ corresponde ao registro de subordinação em uma fala dirigida ao rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘vocês’ para marcar com naturalidade o plural de נִגַּשְׁתֶּם e ‘você’ para o singular dirigido ao mensageiro. Os marcadores foram posicionados junto aos elementos a que suas notas efetivamente se referem.
