base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: pt
  text: Ao cair da tarde[a], Davi se levantou da cama e andou pelo terraço da casa do rei[b]. Do terraço, viu uma mulher tomando banho; a mulher era muito bonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E aconteceu, à hora da tarde”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “casa do rei”; “palácio” é uma tradução contextual possível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Ao cair da tarde
  rationale: Introduz naturalmente, em português, a progressão narrativa e o momento da cena. A formulação hebraica mais literal é preservada em nota.
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Equivalente corrente e preciso de קום no contexto de alguém que deixa a cama.
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: da cama
  rationale: מִשְׁכָּב pode indicar cama ou lugar onde alguém se deita; “cama” é a opção contextual mais natural.
- source_word: וַיִּתְהַלֵּךְ
  choice: andou
  rationale: O hitpael pode sugerir movimento continuado ou de um lado para outro, mas o pretérito simples mantém a sequência narrativa com naturalidade, sem acrescentar a intenção sugerida por “foi passear”.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: pelo terraço da casa do rei
  rationale: גַּג designa o teto plano utilizável típico da arquitetura local; “terraço” comunica essa realidade com clareza. “Casa do rei” mantém a expressão hebraica, enquanto “palácio” fica registrado como possibilidade contextual.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: viu uma mulher tomando banho
  rationale: O particípio רֹחֶצֶת apresenta a ação em curso. “Tomando banho” é claro e idiomático para leitores brasileiros e amplamente compreensível em português.
- source_word: מֵעַל הַגָּג
  choice: Do terraço
  rationale: Explicita o ponto de observação de Davi, leitura sintática mais natural da expressão, sem eliminar seu valor espacial.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: era muito bonita
  rationale: Expressa de modo natural a avaliação visual da frase hebraica, literalmente relacionada à boa aparência, sem o artificialismo de “boa de aparência”.
