base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: pt
  text: 'Ele escreveu na carta: “Ponham Urias na linha de frente do combate mais intenso[a]. Depois, recuem de trás dele, para que seja atingido e morra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde o combate é mais intenso”.'
    reason: Alternativa idiomática para a expressão hebraica אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה, que pode indicar o setor em que a luta é mais severa.
lexical_decisions:
- source_word: וַיִּכְתֹּב בַּסֵּפֶר לֵאמֹר
  choice: Ele escreveu na carta
  rationale: O wayyiqtol é vertido como ação narrativa passada. Neste contexto, סֵפֶר designa a mensagem escrita enviada a Joabe, portanto “carta” é mais natural que “livro” ou “documento”. Os dois-pontos introduzem em português o conteúdo indicado por לֵאמֹר.
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: Ponham Urias
  rationale: O imperativo plural dirige a ordem aos responsáveis por posicionar Urias. “Ponham” é corrente, claro e preserva o número plural.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: na linha de frente, onde o combate for mais intenso
  rationale: A formulação expressa exposição direta na frente da batalha, enquanto חֲזָקָה caracteriza o combate como forte ou intenso. A tradução comunica o sentido militar em português natural.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: Depois, recuem de detrás dele
  rationale: שׁוּב indica voltar ou recuar, e מֵאַחֲרָיו especifica que os soldados posicionados atrás de Urias deveriam retirar-se. A redação mantém explicitamente a manobra de abandono, sem acrescentar que ele ficou “sozinho” ou “sem cobertura”.
- source_word: וְנִכָּה וָמֵת
  choice: para que seja atingido e morra
  rationale: O nifal de נכה indica que Urias seria atingido; o verbo separado וָמֵת explicita sua morte. Ambos são preservados, assim como a finalidade letal da ordem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A fala direta conserva o tom frio e imperativo da ordem. O marcador da nota foi colocado junto à expressão a que a alternativa lexical efetivamente se refere.
