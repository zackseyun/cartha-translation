  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: pt
  text: Assim, enquanto Joabe vigiava a cidade, posicionou Urias no lugar onde sabia que estavam os guerreiros valentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר
  choice: enquanto ... vigiava
  rationale: O infinitivo construto com בְּ forma uma oração temporal. No contexto do cerco, שׁמר indica observar ou manter a cidade sob vigilância; «enquanto vigiava» é natural e preserva essa relação temporal.
- source_word: אֶל הָעִיר
  choice: a cidade
  rationale: Com שׁמר, אֶל assinala o foco da vigilância. Em português, «vigiar a cidade» expressa isso naturalmente sem acrescentar uma preposição interpretativa como «contra».
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: posicionou Urias
  rationale: Embora נתן signifique literalmente «pôr» ou «colocar», no contexto militar descreve a colocação deliberada de Urias numa posição tática. «Posicionou» comunica essa nuance sem exagerá-la.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: מקום significa diretamente «lugar»; a nuance tática já é comunicada pelo verbo «posicionou».
- source_word: יָדַע
  choice: sabia
  rationale: ידע é o verbo comum para «saber». O imperfeito português ajusta-se ao conhecimento que Joabe já possuía no momento em que posicionou Urias.
- source_word: אַנְשֵׁי חַיִל
  choice: guerreiros valentes
  rationale: A expressão designa homens capazes, fortes ou formidáveis em combate. «Guerreiros valentes» torna explícito o contexto militar e evita que «homens poderosos» soe como título técnico ou referência ao grupo de elite de Davi.
- source_word: שָׁם
  choice: estavam
  rationale: O sentido locativo de «ali/lá» já está incorporado naturalmente na oração relativa «onde ... estavam».
- source_word: וַיְהִי
  choice: Assim, enquanto
  rationale: וַיְהִי introduz o acontecimento seguinte na narrativa, e a construção com בִּשְׁמֹר estabelece a circunstância temporal. «Assim, enquanto» preserva a progressão sem o artificial «e aconteceu».
