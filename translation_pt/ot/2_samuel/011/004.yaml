  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: pt
  text: Então Davi enviou mensageiros e mandou buscá-la. Ela veio até ele, e ele se deitou com ela. Ela estava se purificando da sua impureza[a]. Depois, voltou para casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela tinha se purificado da sua impureza”. O hebraico também pode ser entendido como uma observação de fundo sobre a purificação ritual após a menstruação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O passado simples expressa naturalmente o wayyiqtol narrativo de שלח em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Preserva o sentido concreto usual sem definir além do texto a função oficial desses enviados.
- source_word: וַיִּקָּחֶהָ
  choice: mandou buscá-la
  rationale: Embora לקח signifique literalmente “tomar”, neste contexto causativo-prático Davi envia mensageiros para trazê-la; “mandou buscá-la” é natural em português e mantém Davi como agente da ação, sem sugerir que ele próprio foi buscá-la.
- source_word: וַתָּבֹוא אֵלָיו
  choice: ela veio até ele
  rationale: Tradução direta do verbo de movimento com a preposição, sem acrescentar um eufemismo sexual.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: ele se deitou com ela
  rationale: Conserva o conhecido e dignificado idiomatismo bíblico para relações sexuais; “dormiu com ela” seria mais coloquial.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: Ela estava se purificando da sua impureza
  rationale: O hitpael de קדשׁ indica aqui purificação ritual, não santificação moral. O particípio apresenta informação de fundo, e “impureza” comunica em português atual a categoria ritual de טֻמְאָה.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: Depois, voltou para casa
  rationale: Expressa com fluidez a continuação da sequência narrativa; “para casa” é a forma portuguesa natural para בֵּיתָהּ neste contexto.
theological_decisions:
- issue: Função e temporalidade da oração sobre pureza ritual
  choice: 'Mantê-la como nota de fundo concomitante: “Ela estava se purificando da sua impureza”.'
  alternative: 'Entendê-la como ação já concluída: “Ela tinha se purificado da sua impureza”.'
  rationale: A construção participial pode apresentar circunstância de fundo, provavelmente ligada à purificação ritual após a menstruação e à cronologia da concepção. A tradução principal preserva esse valor sem transformar a observação ritual em juízo moral nem atribuir culpa ou inocência além do que o versículo declara.
- issue: Agência na expressão וַיִּקָּחֶהָ
  choice: “mandou buscá-la”, mantendo Davi como responsável pela iniciativa realizada por seus mensageiros.
  alternative: “tomou-a” ou “a trouxe”.
  rationale: “Mandou buscá-la” representa naturalmente a sequência hebraica em português, sem resolver por si só questões não explicitadas no versículo acerca de consentimento ou coerção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A narrativa permanece concisa. Emprega-se “impureza” no sentido ritual, e não como avaliação moral; a nota preserva a ambiguidade temporal do particípio hebraico.
