source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: pt
  text: 'Então Davi disse ao mensageiro: “Assim dirás a Joabe: ‘Que esta questão não te pareça má[a], pois a espada devora tanto um como outro[b]. Reforça o teu ataque contra a cidade e derruba-a.’ E encoraja-o[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não deixes que esta questão te desagrade”. Literalmente, o hebraico diz: “Que esta questão não seja má aos teus olhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Expressão idiomática hebraica: “pois assim e assim a espada devora”, isto é, a espada mata tanto uma pessoa como outra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “E fortalece-o”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Neste contexto, designa o homem enviado para levar a notícia a Davi, não um ser angelical.
- source_word: כֹּה תֹאמַר
  choice: Assim dirás
  rationale: Preserva a fórmula usada para introduzir uma mensagem que deve ser transmitida, com linguagem digna e clara.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: Que esta questão não te pareça má
  rationale: Mantém parte da imagem hebraica ligada à percepção de Joabe e evita apagar a coloração moral da fala de Davi; a formulação idiomática alternativa é registrada em nota.
- source_word: הַדָּבָר הַזֶּה
  choice: esta questão
  rationale: Abrange o acontecimento relatado, inclusive a morte de Urias, sem explicitar mais do que o hebraico.
- source_word: כִּי כָזֹה וְכָזֶה
  choice: tanto um como outro
  rationale: Expressa em português o caráter indiscriminado ou variável indicado pela locução hebraica no contexto da espada que devora.
- source_word: תֹּאכַל הֶחָרֶב
  choice: a espada devora
  rationale: Conserva a metáfora vívida do verbo hebraico 'comer/devorar', em vez de reduzi-la simplesmente a 'matar'.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ
  choice: Reforça o teu ataque
  rationale: Comunica naturalmente a ordem de intensificar a ação militar contra a cidade, embora o substantivo hebraico seja literalmente 'combate' ou 'guerra'.
- source_word: וְהָרְסָהּ
  choice: e derruba-a
  rationale: Representa o sentido de demolir ou deitar abaixo a cidade no contexto de um cerco.
- source_word: וְחַזְּקֵהוּ
  choice: E encoraja-o
  rationale: O sufixo masculino singular aponta naturalmente para Joabe; neste contexto, 'encorajar' transmite com clareza a ideia de fortalecê-lo moralmente.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa do singular coerentes com a fala dirigida a Joabe. A tradução preserva a metáfora da espada que devora e a ambiguidade lexical de חזק por meio de nota, sem suavizar a tentativa de Davi de normalizar a morte ocorrida.
