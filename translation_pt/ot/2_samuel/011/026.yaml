  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: pt
  text: Quando a mulher de Urias ouviu que Urias, seu marido, estava morto[a], ficou de luto por seu marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinha morrido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: ouviu
  rationale: O qal de שׁמע significa normalmente “ouvir”. “Ouviu” preserva a forma direta do hebraico; “soube” seria natural, mas um pouco mais interpretativo.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: a mulher de Urias
  rationale: A construção de relação pode ser traduzida naturalmente como “a mulher de Urias”, designação conjugal clara e corrente em português.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo do que ela ouviu, por isso “que” reproduz adequadamente a função da oração.
- source_word: מֵת
  choice: estava morto
  rationale: A forma descreve o estado de Urias como morto. “Estava morto” mantém esse valor, enquanto “tinha morrido” expressa o acontecimento e fica registrado como alternativa.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: Urias, seu marido
  rationale: A aposição hebraica identifica explicitamente Urias como marido dela. As vírgulas tornam essa relação clara em português sem eliminar a repetição deliberada do nome.
- source_word: וַתִּסְפֹּד
  choice: ficou de luto
  rationale: ספד denota o ato de prantear ou guardar luto por uma pessoa morta. “Ficou de luto” comunica isso de modo natural e digno no português atual.
- source_word: עַל
  choice: por
  rationale: Com uma expressão de luto, עַל é traduzido idiomaticamente por “por”.
- source_word: בַּעְלָהּ
  choice: seu marido
  rationale: Embora בַּעַל possa significar “senhor”, “dono” ou “mestre” em outros contextos, aqui a relação conjugal exige “marido”.
