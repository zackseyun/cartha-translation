  text: וַ/יִּשְׁכַּ֣ב אוּרִיָּ֗ה פֶּ֚תַח בֵּ֣ית הַ/מֶּ֔לֶךְ אֵ֖ת כָּל עַבְדֵ֣י אֲדֹנָ֑י/ו וְ/לֹ֥א יָרַ֖ד אֶל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: pt
  text: Mas Urias dormiu à entrada da casa do rei, com todos os servos do seu senhor, e não desceu à sua casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não foi para casa”. Literalmente, “não desceu à sua casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: dormiu
  rationale: O verbo שׁכב pode significar deitar-se ou dormir. Neste contexto narrativo, indica que Urias passou ali a noite; “dormiu” é natural e preserva a ação sem ampliar o texto.
- source_word: פֶּתַח
  choice: à entrada
  rationale: פֶּתַח designa uma abertura, entrada ou porta. “À entrada” expressa naturalmente a localização sem especificar a folha da porta.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: A expressão significa literalmente “casa do rei”. Embora se refira ao palácio, a formulação literal é clara em português e mantém a repetição de בַּיִת no versículo.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: com todos os servos do seu senhor
  rationale: אֵת aqui indica associação. “Com” é idiomático; “servos” se ajusta ao ambiente da corte, e “seu senhor” preserva a relação hierárquica com Davi.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: e não desceu à sua casa
  rationale: A tradução conserva o sentido espacial de ירד, “descer”, e o termo concreto בַּיִת, “casa”, sem o parafrasear como simplesmente “ir para casa”.
