  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: pt
  text: 'O mensageiro disse a Davi: “Os homens foram mais fortes do que nós[a] e saíram contra nós para o campo aberto; mas nós os repelimos[b] até a entrada do portão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prevaleceram contra nós”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ficamos sobre eles”; expressão militar que indica que os homens de Davi tomaram a ofensiva ou fizeram o inimigo recuar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: No contexto, trata-se de um mensageiro humano que leva um relatório militar a Davi, não de um ser angelical.
- source_word: כִּי
  choice: introdução implícita do conteúdo da fala
  rationale: Aqui a conjunção introduz o conteúdo do relatório; em português natural, não precisa ser traduzida por uma palavra separada.
- source_word: גָבְרוּ עָלֵינוּ
  choice: foram mais fortes do que nós
  rationale: Preserva a força comparativa de גבר com עַל e comunica naturalmente que os adversários inicialmente levaram vantagem.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Mantém o termo geral do hebraico, embora o contexto deixe claro que se trata dos combatentes inimigos.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: saíram contra nós para o campo aberto
  rationale: Expressa a saída hostil dos defensores da cidade para enfrentar as tropas no campo; “campo aberto” esclarece o contraste espacial implícito com a cidade.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: nós os repelimos
  rationale: A expressão, literalmente “ficamos/estivemos sobre eles”, tem sentido militar idiomático de tomar a ofensiva e fazê-los recuar, como indica o limite seguinte.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: até a entrada do portão
  rationale: Conserva tanto a ideia de limite espacial de עַד quanto a referência à abertura ou entrada do portão da cidade.
