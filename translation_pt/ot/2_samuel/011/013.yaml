base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: pt
  text: Davi chamou Urias[a], que comeu e bebeu em sua presença; e Davi o embriagou. Ao anoitecer, Urias saiu para se deitar em sua cama, junto aos servos de seu senhor[b], mas não desceu para a sua casa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “convidou Urias” ou “mandou chamá-lo”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, Davi.
    reason: referent_clarification
  - marker: c
    text: O hebraico diz literalmente “não desceu para a sua casa”; o verbo direcional foi preservado.
    reason: source_form
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: Davi mandou chamar Urias
  rationale: A construção קרא com ל pode expressar chamar ou mandar vir alguém. No contexto, Davi toma a iniciativa de convocar Urias; explicitar o nome evita a sequência ambígua de pronomes em português.
- source_word: לְפָנָיו
  choice: em sua presença
  rationale: A expressão significa literalmente 'diante dele'. 'Em sua presença' comunica com naturalidade que Urias comeu e bebeu diante de Davi.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: Davi o embriagou
  rationale: 'O hifil de שׁכר é causativo: Davi fez Urias ficar bêbado. A formulação preserva de modo direto a agência de Davi.'
- source_word: בָּעֶרֶב
  choice: Ao anoitecer
  rationale: Marca a transição temporal da narrativa de maneira natural e digna em português.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: para se deitar em sua cama
  rationale: שׁכב indica deitar-se, sem afirmar necessariamente que Urias dormiu; מִשְׁכָּב pode designar cama ou lugar de repouso.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: junto aos servos de seu senhor
  rationale: Mantém a estrutura possessiva do hebraico e a referência a Davi como senhor de Urias, sem substituir por uma interpretação mais específica no corpo do texto.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: mas não desceu para a sua casa
  rationale: Preserva o verbo direcional ירד, importante no contexto próximo, enquanto 'mas' expressa naturalmente o contraste narrativo.
