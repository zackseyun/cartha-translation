review_pass:
  verdict: revise
  source_fidelity: A leitura principal deve ser «reis», não «mensageiros». Embora a forma consonantal possa suscitar a alternativa «mensageiros», o contexto militar e a tradição textual/interpretativa refletida também em 1 Crônicas 20:1 sustentam «na época em que os reis saem para a guerra». A alternativa deve permanecer em nota, sem ser apresentada como a leitura inequívoca do hebraico.
  naturalness: A redação é em geral clara, mas «Joabe, seus servos com ele» é pouco natural em português. «Joabe, os seus servos com ele e todo o Israel» preserva a construção coordenada hebraica de modo legível. «Sitiaram Rabá» comunica mais precisamente a ação militar de pôr uma cidade sob cerco do que «cercaram».
  terminology: «Davi», «amonitas», «Rabá» e «Jerusalém» são adequados. «Servos» preserva de forma aceitável a amplitude de עֲבָדָיו. «Reis» deve substituir «mensageiros» no texto, e «mensageiros» deve figurar como leitura alternativa na nota.
  issues:
  - severity: high
    issue: A tradução principal adota «mensageiros» para הַמְּלָאכִים.
    rationale: Isso contraria a leitura contextual mais bem sustentada de «reis», adotada no audit trail inglês, e enfraquece o contraste narrativo de Davi permanecer em Jerusalém quando os reis saem para a guerra. A possibilidade lexical de «mensageiros» é real, mas deve ser preservada em nota.
  - severity: low
    issue: «Cercaram Rabá» é menos específico para וַיָּצֻרוּ עַל־רַבָּה.
    rationale: O verbo descreve o assédio militar de uma cidade; «sitiaram Rabá» é a formulação portuguesa mais precisa e natural.
  - severity: low
    issue: A sequência «Joabe, seus servos com ele» soa truncada.
    rationale: Uma leve reorganização melhora a fluidez sem alterar os referentes nem a coordenação do hebraico.
  revised_text: Na virada do ano[a], na época em que os reis saem para a guerra[b], Davi enviou Joabe, os seus servos com ele e todo o Israel. Eles devastaram os amonitas e sitiaram Rabá, mas Davi ficou em Jerusalém.
