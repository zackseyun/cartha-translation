source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: pt
  text: Na virada do ano[a], na época em que os reis saem para a guerra[b], Davi enviou Joabe, os seus servos com ele e todo o Israel. Eles devastaram os amonitas e sitiaram Rabá, mas Davi ficou em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no retorno/na virada do ano”, provavelmente uma referência à época das campanhas militares na primavera.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “na época em que os mensageiros saem”. O contexto militar favorece a leitura “reis”, como em 1 Crônicas 20:1.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: na virada do ano
  rationale: Preserva a imagem hebraica do retorno ou da virada do ano sem substituir no texto a expressão pela interpretação sazonal provável, isto é, o início da campanha na primavera.
- source_word: לְעֵת צֵאת הַמַּלְאָכִים
  choice: na época em que os mensageiros saem
  rationale: O texto massorético apresentado traz מַלְאָכִים, “mensageiros”. Embora “reis” seja bem atestado pela passagem paralela e se ajuste melhor ao contexto militar, a tradução principal segue a forma hebraica desta edição e registra a alternativa em nota.
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente narrativo direto e natural de שלח.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Mantém a amplitude do termo hebraico para pessoas a serviço do rei, sem restringi-las indevidamente a oficiais ou soldados.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Conserva a expressão coletiva hebraica, que no contexto se refere às forças de Israel.
- source_word: וַיַּשְׁחִתוּ
  choice: devastaram
  rationale: Expressa a ação destrutiva do hifil de שׁחת no contexto militar sem sugerir necessariamente extermínio total.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: Forma idiomática corrente em português para o gentílico hebraico, literalmente “filhos de Amom”.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: cercaram Rabá
  rationale: No contexto bélico, צור com על descreve o cerco de uma cidade; “cercaram” é conciso e natural.
- source_word: יוֹשֵׁב
  choice: ficou
  rationale: O particípio significa literalmente estar sentado ou residindo, mas aqui ressalta que Davi permaneceu em Jerusalém enquanto os demais partiram.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma portuguesa convencional do topônimo.
theological_decisions:
- issue: Leitura da expressão לְעֵת צֵאת הַמַּלְאָכִים
  choice: na época em que os mensageiros saem
  alternative: na época em que os reis saem para a guerra
  rationale: A edição hebraica fornecida lê “mensageiros”, e por isso essa leitura foi mantida no texto. A passagem paralela de 1 Crônicas 20:1 traz “reis”, leitura que também corresponde ao contexto de campanhas militares e produz o contraste narrativo com Davi, que ficou em Jerusalém. A nota preserva essa tensão textual sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem narrativa e o contraste final introduzido por “mas” foram preservados. As notas tornam explícitas tanto a expressão temporal hebraica quanto a dificuldade textual entre “mensageiros” e “reis”.
