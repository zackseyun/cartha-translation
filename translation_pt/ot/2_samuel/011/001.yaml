revisions:
- from: Na virada do ano[a], na época em que os mensageiros saem[b], Davi enviou Joabe, seus servos com ele e todo o Israel. Eles devastaram os amonitas e cercaram Rabá, mas Davi ficou em Jerusalém.
  to: Na virada do ano[a], na época em que os reis saem para a guerra[b], Davi enviou Joabe, os seus servos com ele e todo o Israel. Eles devastaram os amonitas e sitiaram Rabá, mas Davi ficou em Jerusalém.
  rationale: A revisão restaura «reis» como leitura principal, em conformidade com o contexto bélico e com o paralelo em 1 Crônicas, ao mesmo tempo que mantém em nota a alternativa «mensageiros» sem resolver silenciosamente a ambiguidade gráfica/lexical. Também substitui «cercaram» por «sitiaram» e melhora discretamente a fluidez da lista de enviados.
