base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: pt
  text: 'Disseram a Davi: “Urias não desceu para sua casa[a].” Então Davi disse a Urias: “Você não veio de viagem? Por que não desceu para sua casa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “descer para sua casa” significa ir para casa, possivelmente partindo de um lugar mais elevado ou das dependências oficiais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 'Contaram a Davi:'
  rationale: O hifil de נגד significa contar ou informar; לֵאמֹר introduz o conteúdo comunicado e é expresso naturalmente pelos dois-pontos.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Urias não desceu para casa
  rationale: Preserva o verbo concreto ירד e a referência ao lar, sem a formulação pouco natural 'para a sua casa'.
- source_word: וַיֹּאמֶר דָּוִד אֶל אוּרִיָּה
  choice: Então Davi perguntou a Urias
  rationale: Embora אמר seja literalmente 'disse', a fala que segue é interrogativa; 'perguntou' expressa naturalmente a função do enunciado, e 'então' mantém o avanço narrativo.
- source_word: הֲלוֹא מִדֶּרֶךְ אַתָּה בָא
  choice: Você não acabou de chegar de uma viagem?
  rationale: הֲלוֹא introduz uma pergunta que espera resposta afirmativa. מִדֶּרֶךְ designa aqui viagem ou deslocamento; 'acabou de' torna natural a ideia contextual de chegada recente sem interpretar בוא como 'voltar'.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Por que não desceu para casa?
  rationale: Mantém a repetição de ירד e verte ביתך idiomaticamente como 'casa', conservando a insistência de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “desceu para casa” foi mantida por sua importância narrativa; a ordem do primeiro período foi naturalizada sem omitir conteúdo.
