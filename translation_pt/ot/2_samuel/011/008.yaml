base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: pt
  text: 'Então Davi disse a Urias: “Desça à sua casa e lave os pés.[a]” Urias saiu da casa do rei, e, depois dele, saiu um presente do rei.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lave os pés” é uma expressão literal que também pode sugerir que Urias se refrescasse e se acomodasse em casa depois da viagem.
    reason: cultural_note
  - marker: b
    text: Ou “uma porção do rei”. O termo hebraico pode indicar algo levado ou enviado, inclusive uma porção ou um presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Desça
  rationale: Preserva o sentido direcional do imperativo de ירד, provavelmente do palácio para a casa de Urias, sem explicação excessiva.
- source_word: לְבֵיתְךָ
  choice: à sua casa
  rationale: Mantém o sentido concreto de בַּיִת e soa natural em português.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: e lave os pés
  rationale: Reproduz a expressão concreta hebraica, sem reduzir sua possível conotação de descanso e acomodação em casa a uma paráfrase interpretativa.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: da casa do rei
  rationale: Segue de perto o hebraico; embora “palácio” seja contextual e idiomático, “casa do rei” preserva a formulação da fonte e permanece compreensível.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: um presente do rei
  rationale: מַשְׂאֵת pode designar algo levado ou enviado, inclusive uma porção ou presente. No contexto, “presente” comunica com naturalidade aquilo que o rei fez seguir após Urias.
- source_word: אַחֲרָיו
  choice: atrás dele
  rationale: Expressa que o presente foi enviado seguindo Urias; a construção portuguesa é natural no contexto narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva-se a concretude do hebraico em “desça”, “casa do rei” e “lave os pés”; a última oração é levemente ajustada à sintaxe natural do português com o sujeito indeterminado “mandaram”.
