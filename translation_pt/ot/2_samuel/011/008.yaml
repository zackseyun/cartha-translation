  source_fidelity: 'A tradução preserva adequadamente os principais sentidos do hebraico: a ordem direcional («Desça»), a referência concreta à casa, «lave os pés» e o presente/porção real. Contudo, «mandaram» introduz um sujeito humano indeterminado que não está expresso no texto hebraico, cujo verbo feminino singular tem como sujeito «um presente».'
  naturalness: «Mandaram atrás dele um presente do rei» é compreensível, mas é menos fiel à construção hebraica e soa um pouco impessoal. «Depois dele, saiu um presente do rei» mantém o sujeito e a sequência narrativa de maneira clara e natural.
  terminology: «Davi», «Urias», «casa do rei» e «presente do rei» são escolhas apropriadas. As notas são pertinentes, mas os seus marcadores estão ligados às expressões erradas no texto.
