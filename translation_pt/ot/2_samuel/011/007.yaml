  text: וַ/יָּבֹ֥א אוּרִיָּ֖ה אֵלָ֑י/ו וַ/יִּשְׁאַ֣ל דָּוִ֗ד לִ/שְׁל֤וֹם יוֹאָב֙ וְ/לִ/שְׁל֣וֹם הָ/עָ֔ם וְ/לִ/שְׁל֖וֹם הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: pt
  text: Quando Urias chegou até ele, Davi perguntou se Joabe estava bem, se as tropas estavam bem e como ia a guerra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo בוא indica vir, entrar ou chegar; neste contexto narrativo, “chegou” expressa naturalmente a chegada de Urias à presença de Davi.
- source_word: אֵלָיו
  choice: até ele
  rationale: A preposição אֶל com sufixo pronominal indica movimento em direção a Davi; “até ele” mantém esse sentido relacional sem acrescentar formalidade cortesã ausente do hebraico.
- source_word: וַיִּשְׁאַל
  choice: perguntou
  rationale: שׁאל introduz aqui as perguntas de Davi sobre a situação da campanha; “perguntou” é claro, corrente e fiel.
- source_word: לִשְׁלוֹם
  choice: se ... estava bem / como ia
  rationale: A construção repetida com שָׁלוֹם pergunta pela condição ou pelo estado de cada referente. Em português, “se ... estava bem” é natural para pessoas, enquanto “como ia” transmite idiomaticamente a mesma ideia aplicada à guerra.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יוֹאָב em português.
- source_word: הָעָם
  choice: as tropas
  rationale: Embora עָם possa significar “povo”, o contexto militar mostra que aqui se refere aos homens envolvidos na campanha; “as tropas” torna o referente claro.
- source_word: הַמִּלְחָמָה
  choice: a guerra
  rationale: מִלְחָמָה pode designar guerra, combate ou batalha. “A guerra” corresponde ao contexto mais amplo da campanha contra Rabá.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição tripla do hebraico foi mantida em estrutura paralela, mas a expressão relativa à guerra foi vertida idiomaticamente para evitar o pouco natural “bem-estar da guerra”.
