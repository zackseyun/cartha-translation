source:
  edition: WLC
  text: בַּ/עֲב֤וּר דְּבָֽרְ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הוֹדִ֖יעַ אֶת עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: pt
  text: Por causa da tua palavra[a] e de acordo com o teu coração[b], fizeste toda esta grandeza[c], para dá-la a conhecer ao teu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da tua promessa” ou “por amor da tua palavra”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “de acordo com o teu coração”, isto é, conforme a tua própria intenção ou vontade.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico usa o singular: “toda esta grandeza”; algumas traduções dizem “todas estas grandes coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: Por causa da tua palavra
  rationale: Preserva a relação causal ou de fundamento expressa por בַּעֲבוּר e mantém a amplitude de דָּבָר, que neste contexto pode apontar para a palavra proferida ou promessa de Deus.
- source_word: וּכְלִבְּךָ
  choice: e de acordo com o teu coração
  rationale: Mantém a metáfora hebraica do coração como sede da intenção e da vontade, sem a reduzir interpretativamente a “vontade” ou “desejo”.
- source_word: עָשִׂיתָ
  choice: fizeste
  rationale: O pretérito perfeito traduz naturalmente em português a ação concluída referida na oração de Davi.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: toda esta grandeza
  rationale: Conserva o substantivo abstrato singular do hebraico, apresentando o ato divino como uma manifestação unificada de grandeza.
- source_word: לְהוֹדִיעַ
  choice: para dá-la a conhecer
  rationale: Expressa o valor causativo do hifil de ידע e explicita, por meio do pronome, que aquilo dado a conhecer é “toda esta grandeza”.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: É a formulação adequada à autodesignação humilde de Davi diante de Deus no contexto de uma oração régia.
theological_decisions:
- issue: Referência de “tua palavra” no contexto da aliança
  choice: tua palavra
  alternative: tua promessa; aquilo que disseste
  rationale: Embora o contexto favoreça a ideia de promessa, o hebraico emprega “palavra”. A formulação mais ampla preserva a expressão do texto sem impor uma categoria teológica mais estreita.
- issue: Linguagem antropomórfica em “de acordo com o teu coração”
  choice: de acordo com o teu coração
  alternative: segundo a tua vontade; conforme o teu desejo
  rationale: A tradução conserva a metáfora usada pelo próprio texto para a intenção interior de Deus, em vez de substituí-la por linguagem abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “tua/teu” pela coerência da oração dirigida diretamente a Deus e a metáfora hebraica do coração. A ordem das notas segue a posição dos marcadores no texto.
