  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: pt
  text: Mas o meu amor leal não se afastará dele[a], como o retirei de Saul, a quem retirei de diante de você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha bondade fiel” ou “minha fidelidade à aliança”. O termo hebraico indica amor firme e lealdade dentro de uma relação de compromisso.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de você”. A expressão pode se referir à remoção de Saul de sua posição em relação a Davi, e não apenas a um afastamento físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: o meu amor leal
  rationale: חֶסֶד expressa aqui amor firme e lealdade no âmbito da relação pactual. “Amor leal” é natural em português, conserva o peso relacional do termo e evita reduzi-lo apenas a misericórdia ou sentimento.
- source_word: יָסוּר
  choice: não se afastará
  rationale: O verbo סור pode significar afastar-se, desviar-se ou ser retirado. Com “amor leal” como sujeito, “não se afastará” é idiomático e mantém o contraste com a ação causativa posterior.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A preposição מן com sufixo indica separação daquele descendente real mencionado no contexto; “dele” transmite isso de forma concisa.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz diretamente a comparação entre o tratamento dado ao descendente de Davi e o dado a Saul.
- source_word: הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: o retirei de Saul
  rationale: O hifil de סור é causativo, “retirar”. O pronome “o” retoma naturalmente “meu amor leal”, sem acrescentar um substantivo ausente no hebraico.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: a quem retirei de diante de você
  rationale: Preserva a imagem hebraica “de diante de você” e o referente masculino Saul, sem explicar em excesso a natureza de sua remoção.
theological_decisions:
- issue: Natureza de חֶסֶד no contexto da aliança davídica
  choice: “amor leal”, preservando a fidelidade relacional e pactual sem impor uma fórmula doutrinária mais estreita
  alternative: misericórdia; bondade; fidelidade à aliança
  rationale: O contraste é entre a permanência do favor leal de Deus para com a linhagem davídica e sua retirada de Saul. “Amor leal” comunica tanto afeição quanto fidelidade duradoura.
- issue: Objeto implícito em “como o retirei de Saul”
  choice: Entender o pronome como retomada do “meu amor leal”
  alternative: Traduzir sem objeto explícito, ou interpretar a primeira forma como referência direta à remoção de Saul
  rationale: A sintaxe liga naturalmente o sufixo pronominal ao חַסְדִּי anterior, enquanto a oração relativa seguinte declara explicitamente que Saul também foi retirado. A tradução mantém essa distinção e a possível tensão do texto.
- issue: Sentido de “de diante de você”
  choice: Conservar a expressão espacial e relacional do hebraico
  alternative: da sua presença; do reinado diante de você; do seu caminho
  rationale: O contexto aponta para a remoção de Saul em relação a Davi, mas o hebraico não explicita aqui “do reinado”. Manter a imagem evita resolver a ambiguidade por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural para brasileiros. Emprega “você” para o singular dirigido a Davi e preserva a repetição de “retirei”, relevante para a estrutura do hebraico.
