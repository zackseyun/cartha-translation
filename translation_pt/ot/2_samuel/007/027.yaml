source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: pt
  text: 'Pois tu, SENHOR dos Exércitos, Deus de Israel, revelaste ao teu servo[a], dizendo: “Eu edificarei para ti uma casa[b]”. Por isso, o teu servo encontrou coragem[c] para fazer-te esta oração.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “descobriste o ouvido do teu servo”, idiomatismo hebraico que significa revelar ou dar a conhecer algo ao servo.
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode também ter aqui o sentido de casa dinástica, isto é, dinastia, além de evocar uma construção. O contexto da aliança davídica mantém essa ressonância.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “encontrou o seu coração”, isto é, encontrou ânimo ou resolução.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Emprega a convenção portuguesa amplamente reconhecida para o nome divino e traduz צְבָאוֹת de modo digno e inteligível, sem restringir o título apenas a exércitos humanos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Preserva diretamente a identificação pactual expressa pela construção hebraica.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: revelaste ao teu servo
  rationale: Traduz o sentido do idiomatismo hebraico, literalmente 'descobriste o ouvido do teu servo', em português natural; a forma literal é registrada em nota.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No contexto da oração régia, 'servo' expressa adequadamente a posição humilde de Davi diante de Deus, sem introduzir uma ênfase indevida em escravidão.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém explicitamente a fórmula hebraica que introduz o discurso direto.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Eu edificarei para ti uma casa
  rationale: Conserva 'casa' e sua ressonância intencional entre construção e dinastia, sem decidir no texto principal por 'templo' ou 'dinastia'.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa com naturalidade a relação de consequência entre a revelação divina e a oração de Davi.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: encontrou coragem
  rationale: Comunica em português corrente o sentido do idiomatismo, literalmente 'encontrou o seu coração', isto é, adquiriu ânimo ou resolução para orar.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: para fazer-te esta oração
  rationale: Forma portuguesa natural que preserva tanto o ato de orar dirigido a Deus quanto a referência específica à oração presente.
theological_decisions:
- issue: Fórmula idiomática de revelação
  choice: revelaste ao teu servo
  alternative: descobriste o ouvido do teu servo
  rationale: A tradução principal comunica claramente a revelação divina, enquanto a nota preserva a imagem hebraica para transparência textual.
- issue: Sentido de 'casa'
  choice: casa
  alternative: templo; dinastia
  rationale: O contexto da aliança davídica explora a amplitude semântica de בַּיִת. A tradução não reduz a palavra a apenas uma de suas possíveis referências.
- issue: Idiomatismo referente ao coração
  choice: encontrou coragem
  alternative: encontrou o seu coração; achou em seu coração
  rationale: A opção principal transmite o sentido de ânimo ou resolução em linguagem atual, e a nota conserva a expressão literal sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. Usa a segunda pessoa singular em registro solene de oração e preserva os termos-chave 'servo', 'casa' e 'oração'.
