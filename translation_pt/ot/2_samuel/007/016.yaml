base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: pt
  text: E a sua casa[b] e o seu reino serão firmados para sempre diante de você[a]; o seu trono será estabelecido para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante de você”; algumas testemunhas textuais trazem “diante de mim”.'
    reason: textual_variant
  - marker: b
    text: “Casa” aqui provavelmente significa uma casa real, isto é, uma dinastia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: serão firmados
  rationale: O nifal de אמן comunica tornar-se ou permanecer firme, seguro e duradouro. A forma passiva preserva essa nuance e distingue a expressão de נָכוֹן na segunda oração.
- source_word: בֵּיתְךָ
  choice: a sua casa
  rationale: בַּיִת pode designar aqui a casa real, isto é, a dinastia de Davi. Mantém-se o termo concreto do hebraico, e a acepção dinástica é esclarecida em nota.
- source_word: וּמַמְלַכְתְּךָ
  choice: e o seu reino
  rationale: מַמְלָכָה denota reino, realeza ou domínio real; “reino” é direto, natural e adequado ao contexto da promessa davídica.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A expressão indica duração perpétua. Sua repetição é preservada para conservar a ênfase do hebraico.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: O texto consonantal e a vocalização apresentada leem a segunda pessoa masculina singular, “diante de você”. A variante “diante de mim” é registrada em nota.
- source_word: כִּסְאֲךָ
  choice: o seu trono
  rationale: Tradução direta do assento real, que também representa por metonímia o governo e a realeza.
- source_word: יִהְיֶה נָכוֹן
  choice: será estabelecido
  rationale: A construção com נָכוֹן expressa firmeza e estabilidade. “Será estabelecido” é idiomático e mantém uma distinção moderada em relação a “serão firmados” na primeira oração.
theological_decisions:
- issue: Linguagem da promessa dinástica e possível alcance messiânico
  choice: Manter “casa”, “reino” e “trono” em sua formulação histórica e dinástica, sem explicitar uma interpretação messiânica no texto.
  alternative: Traduzir “casa” por “dinastia” ou formular a promessa de modo a indicar expressamente seu cumprimento messiânico.
  rationale: No contexto imediato, a promessa diz respeito à linhagem real duradoura de Davi. A formulação hebraica também permite maior alcance teológico, mas a tradução não deve resolver essa tensão por meio de explicitação interpretativa.
- issue: Variante textual em לְפָנֶיךָ
  choice: Seguir no texto principal a leitura massorética fornecida, “diante de você”.
  alternative: Adotar “diante de mim”, leitura atestada por algumas testemunhas textuais e coerente com a fala divina.
  rationale: A fonte WLC apresentada traz לְפָנֶיךָ, segunda pessoa singular. A leitura alternativa é relevante e deve ser preservada em nota, não substituída silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. Emprega-se “sua/você” de maneira coerente com a segunda pessoa indicada pelo texto hebraico; a estrutura paralela e a repetição de “para sempre” foram preservadas.
