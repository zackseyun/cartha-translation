source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: pt
  text: 'Em todos os lugares por onde andei entre todos os filhos de Israel, acaso alguma vez disse uma palavra a uma das tribos de Israel[a], à qual ordenei que pastoreasse o meu povo Israel: ‘Por que não construíram para mim uma casa de cedro?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma das tribos de Israel”. O texto paralelo em 1 Crônicas 17:6 traz “juízes de Israel”, provavelmente em referência aos líderes encarregados de pastorear o povo.'
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: andei
  rationale: Preserva a imagem concreta do caminhar de Deus no meio do povo e, no contexto, comunica sua presença móvel, em contraste com uma residência permanente.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Em todos os lugares por onde ... entre todos os filhos de Israel
  rationale: Expressa de modo natural a construção idiomática dupla e mantém tanto a dimensão espacial sugerida pelo verbo como a presença de Deus no meio de Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de forma transparente o etnônimo pactual masculino do hebraico, sem substituí-lo por uma formulação interpretativa.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: acaso alguma vez disse uma palavra
  rationale: Reproduz a força da pergunta retórica e a ênfase da construção hebraica com verbo e substantivo da mesma raiz.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: uma das tribos de Israel
  rationale: Traduz diretamente a leitura do Texto Massorético de Samuel; a leitura orientada aos líderes no paralelo de Crônicas é registrada em nota.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: à qual ordenei que pastoreasse
  rationale: Conserva a ligação gramatical com a expressão precedente e a metáfora pastoral de governar e cuidar do povo, mesmo que a referência à tribo seja semanticamente incomum.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: Preserva a relação de pertença pactual e a identificação de Israel em aposição.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Por que vocês não construíram para mim uma casa de cedro?
  rationale: Mantém o verbo no plural do hebraico por meio de “vocês” e verte naturalmente a referência a uma casa feita de cedro.
theological_decisions:
- issue: Etnônimo pactual marcado por gênero
  choice: os filhos de Israel
  alternative: o povo de Israel; os israelitas
  rationale: O hebraico emprega a designação nacional masculina tradicional. A tradução a conserva sem neutralizá-la, embora seu referente coletivo seja todo Israel.
- issue: Tensão textual e semântica entre “tribos” e líderes encarregados de pastorear
  choice: uma das tribos de Israel
  alternative: um dos juízes ou governantes de Israel
  rationale: O texto hebraico massorético de 2 Samuel traz “tribos”. A cláusula sobre pastorear e o paralelo de 1 Crônicas 17:6 apontam para líderes, mas essa leitura não foi inserida silenciosamente no texto principal; foi preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Acaso alguma vez” sustenta a força retórica; “pastoreasse” conserva a metáfora bíblica sem reduzir seu sentido a mero governo. O plural “vocês” na pergunta final reproduz o plural do verbo hebraico.
