  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: pt
  text: Quando os seus dias se completarem e você repousar com os seus antepassados,[a] farei surgir, depois de você, a sua descendência, que sairá do seu próprio corpo,[b] e estabelecerei o seu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Repousar com os antepassados” é uma expressão hebraica para morrer e juntar-se às gerações anteriores.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “que sairá das suas entranhas”, expressão que indica descendência biológica. O termo hebraico traduzido por “descendência” pode ter sentido coletivo ou referir-se a um descendente representativo.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Quando os seus dias se completarem
  rationale: כִּי introduz aqui a circunstância futura, e a expressão preserva a imagem hebraica dos dias que chegam à sua plenitude.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: e você repousar com os seus antepassados
  rationale: Mantém a metáfora hebraica tradicional para a morte, com formulação natural e digna em português atual.
- source_word: וַהֲקִימֹתִי
  choice: levantarei
  rationale: O hifil de קום, tendo a descendência como objeto, indica fazer surgir ou levantar um sucessor.
- source_word: זַרְעֲךָ
  choice: um descendente seu
  rationale: No contexto imediato, o sufixo masculino singular em מַמְלַכְתּוֹ apresenta um representante individual; a nota registra que זֶרַע também pode ter sentido coletivo.
- source_word: אַחֲרֶיךָ
  choice: depois de você
  rationale: Expressa de modo direto tanto a sequência temporal quanto a sucessão dinástica.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: que sairá do seu próprio corpo
  rationale: Comunica com clareza a descendência biológica e conserva, em forma compreensível, a imagem corporal do hebraico.
- source_word: וַהֲכִינֹתִי
  choice: e firmarei
  rationale: O hifil de כון significa tornar firme, estabelecer ou consolidar; “firmarei” preserva essa nuance.
- source_word: מַמְלַכְתּוֹ
  choice: o reino dele
  rationale: Traduz naturalmente a ideia de reino ou domínio real e mantém a referência masculina singular do texto.
theological_decisions:
- issue: Alcance de זַרְעֲךָ na promessa davídica
  choice: um descendente seu
  alternative: a sua descendência
  rationale: A construção aponta no verso para um sucessor individual, mas o substantivo hebraico pode ser coletivo ou designar um representante singular. A nota preserva essa amplitude sem inserir no texto uma identificação teológica posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Você” torna a fala direta natural; “antepassados” evita restringir אָבוֹת apenas aos pais imediatos. As notas explicitam os idiomas hebraicos e preservam a possível amplitude de זֶרַע.
