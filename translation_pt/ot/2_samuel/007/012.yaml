  rationale: A revisão preserva no texto a amplitude semântica de זַרְעֲךָ por meio de «a sua descendência», enquanto «o seu reino» conserva a referência a um sucessor individual sem importar uma identificação teológica posterior. A nota sobre a origem corporal e o alcance de «descendência» foi reunida sob um único marcador, pois ambas as observações decorrem da mesma unidade relativa hebraica.
