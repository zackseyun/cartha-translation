  - severity: low
    issue: «Firmarei o reino dele» é menos natural do que «estabelecerei o seu reino».
    rationale: כון no hifil admite «firmar», mas «estabelecer» é a colocação mais corrente em português para a consolidação de um reino e reflete bem o tom da promessa dinástica.
