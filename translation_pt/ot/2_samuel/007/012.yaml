  source_fidelity: O texto traduz com precisão a sequência temporal, o idiomatismo de morte, a descendência física e o estabelecimento do reino. Porém, «um descendente seu» fixa no texto uma leitura individual para זַרְעֲךָ, substantivo que pode ser coletivo ou designar um representante singular. A nota reconhece a amplitude, mas a formulação principal pode preservá-la melhor.
  naturalness: A redação é clara, moderna e de registro adequadamente solene. «Estabelecerei o reino dele» é mais idiomático e direto, neste contexto régio, do que «firmarei o reino dele».
  terminology: «Antepassados» comunica adequadamente אֲבֹתֶיךָ sem o limitar a pais imediatos. «Descendência» preserva a elasticidade de זֶרַע; «seu reino» mantém a referência masculina singular de מַמְלַכְתּוֹ sem identificar o descendente.
