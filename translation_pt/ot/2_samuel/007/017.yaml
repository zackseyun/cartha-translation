  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: pt
  text: De acordo com todas estas palavras e com toda esta visão[a], assim Natã falou a Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “revelação”. O termo hebraico se refere à revelação profética, muitas vezes recebida em forma de visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: De acordo com todas
  rationale: A preposição כְ indica conformidade, e כֹל significa “todo”; a formulação preserva a correspondência expressa no hebraico.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: דְּבָרִים pode significar “palavras”, “coisas” ou “assuntos”; no contexto da mensagem divina transmitida por Natã, “palavras” preserva melhor seu conteúdo verbal.
- source_word: וּכְכֹל
  choice: e com toda
  rationale: Mantém a conjunção e a repetição da estrutura hebraica, mas evita em português a repetição pouco natural de “de acordo”.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: esta visão
  rationale: חִזָּיוֹן designa uma visão de caráter revelador; “visão” é a correspondência mais direta e preserva o modo profético sem explicitação indevida.
- source_word: כֵּן
  choice: assim
  rationale: Retoma a comparação precedente e indica que Natã comunicou a mensagem exatamente dessa maneira.
- source_word: דִּבֶּר
  choice: falou
  rationale: דבר é o verbo comum para falar; “falou” conserva a formulação narrativa simples do original.
- source_word: נָתָן
  choice: Natã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל דָּוִד
  choice: a Davi
  rationale: אֶל indica aqui a pessoa a quem a fala foi dirigida; “a Davi” é uma formulação portuguesa direta e natural.
theological_decisions:
- issue: Natureza da revelação profética em חִזָּיוֹן
  choice: visão
  alternative: revelação; visão profética
  rationale: O termo hebraico apresenta a mensagem como revelação recebida em forma visionária. “Visão” mantém essa afirmação sem generalizá-la nem ampliá-la interpretativamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela do hebraico é preservada sem tornar a frase excessivamente rígida.
