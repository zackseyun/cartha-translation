  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: pt
  text: 'Agora, pois, isto é o que você dirá ao meu servo Davi: Assim diz Yahweh dos Exércitos: Eu tirei você da pastagem[a], de seguir o rebanho, para ser governante[b] sobre o meu povo, sobre Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do lugar onde ficava o rebanho”. O substantivo hebraico pode indicar uma pastagem ou um lugar onde os rebanhos permanecem.
    reason: lexical_alternative
  - marker: b
    text: Ou “líder” ou “príncipe”. O termo hebraico indica alguém designado para dirigir ou governar, sem necessariamente empregar o título específico de “rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Preserva tanto o valor temporal como a função de transição discursiva da expressão hebraica.
- source_word: כֹּה תֹאמַר
  choice: isto é o que você dirá
  rationale: Reproduz de modo natural em português a fórmula de instrução ao mensageiro e mantém sua força diretiva.
- source_word: לְעַבְדִּי לְדָוִד
  choice: ao meu servo Davi
  rationale: “Servo” é adequado como designação honrosa de Davi em sua relação com Deus; a aposição é expressa de forma natural em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada, clara e formal, que apresenta a mensagem divina como proclamação direta.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת sem restringir indevidamente o título a exércitos terrestres ou celestes.
- source_word: אֲנִי לְקַחְתִּיךָ
  choice: Eu tirei você
  rationale: No contexto, expressa naturalmente a ação de retirar Davi de sua antiga ocupação para lhe dar outra função.
- source_word: מִן הַנָּוֶה
  choice: da pastagem
  rationale: נָוֶה pode designar o lugar onde os rebanhos pastam ou permanecem; “pastagem” comunica com clareza o sentido provável.
- source_word: מֵאַחַר הַצֹּאן
  choice: de detrás do rebanho
  rationale: Preserva a imagem concreta e a formulação hebraica de Davi seguindo atrás do rebanho, sem substituir a expressão pela interpretação mais ampla “cuidar do rebanho”.
- source_word: לִהְיוֹת נָגִיד
  choice: para ser governante
  rationale: Expressa propósito e conserva o sentido de liderança governante de נָגִיד sem identificá-lo de maneira explícita com o título específico de rei.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: sobre o meu povo, sobre Israel
  rationale: Mantém a repetição de עַל, bem como a ênfase e a cadência da formulação hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de עֶבֶד aplicado a Davi
  choice: servo
  alternative: escravo
  rationale: Neste contexto, o termo identifica Davi por sua relação de serviço e submissão a Yahweh, com função honorífica e pactual, sem pôr em primeiro plano a condição social de escravo.
- issue: Título נָגִיד
  choice: governante
  alternative: líder ou príncipe
  rationale: O termo descreve alguém designado para governar, com possíveis conotações régias, mas não equivale necessariamente ao título formal “rei”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula “Assim diz” conserva o tom profético, enquanto “você dirá” evita arcaísmo. A repetição final “sobre o meu povo, sobre Israel” foi mantida por sua ênfase retórica no hebraico.
