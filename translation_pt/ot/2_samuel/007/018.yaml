  terminology: “Yahweh” reproduz consistentemente o nome divino, enquanto “Senhor Yahweh” distingue o título אַדֹנָי do tetragrama. “Minha casa” deve permanecer no texto; a nota esclarece sem substituir o importante vínculo literário com o restante do capítulo.
