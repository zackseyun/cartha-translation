  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: pt
  text: 'Então o rei Davi entrou, sentou-se diante de Yahweh e disse: “Quem sou eu, Senhor Yahweh, e o que é a minha casa[a], para me teres trazido até aqui?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha família” ou “os da minha casa”. Aqui, “casa” pode abranger a família, a casa real e a linhagem ou dinastia de Davi; o termo também retoma o uso repetido de “casa” neste capítulo.
    reason: Esclarece a amplitude semântica de בֵּיתִי sem eliminar a palavra-chave nem acrescentar uma afirmação interpretativa sobre o estágio de formação da dinastia.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrou
  rationale: O verbo בוא indica movimento para dentro de um lugar; “entrou” preserva essa ação concreta sem especificar um local que o texto não nomeia.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma natural em português que conserva tanto o título definido quanto o nome próprio.
- source_word: וַיֵּשֶׁב
  choice: sentou-se
  rationale: Neste contexto narrativo, após Davi entrar e antes de falar, o sentido físico de ישב, “sentar-se”, é o mais adequado.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” expressa de modo conciso a presença perante alguém, e Yahweh translitera o nome divino pessoal.
- source_word: מִי אָנֹכִי
  choice: Quem sou eu
  rationale: Expressão idiomática de humildade que reproduz a força retórica pessoal do hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Conserva os dois elementos do título composto, distinguindo אֲדֹנָי, “Senhor”, do nome divino יהוה, “Yahweh”.
- source_word: וּמִי בֵיתִי
  choice: e o que é a minha casa
  rationale: O hebraico usa literalmente “quem”, mas “o que é” é a formulação idiomática em português para esta pergunta de humildade; “casa” preserva a palavra-chave do capítulo.
- source_word: בֵּיתִי
  choice: minha casa
  rationale: “Casa” mantém a ligação literária e teológica com o jogo de sentidos ao longo do capítulo, abrangendo família, casa real e dinastia.
- source_word: כִּי
  choice: para que
  rationale: No contexto da pergunta retórica, “para que” expressa naturalmente a admiração de Davi diante do favor que o levou à sua posição atual, sem converter a oração numa explicação causal simples.
- source_word: הֲבִיאֹתַנִי
  choice: me tenhas trazido
  rationale: A forma causativa de בוא significa “trazer”; o subjuntivo é natural em português após a construção retórica “para que”.
- source_word: עַד הֲלֹם
  choice: até aqui
  rationale: Expressão portuguesa natural que preserva tanto a ideia de percurso quanto a de chegada à condição presente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal da aliança presente no texto hebraico e evita confundi-lo com o título אֲדֹנָי, que também ocorre no versículo.
- issue: Sentido de “minha casa”
  choice: Manter “minha casa” no texto principal, com esclarecimento em nota
  alternative: minha família; os da minha casa; minha dinastia
  rationale: '“Casa” é uma palavra temática central em 2 Samuel 7: Davi deseja construir uma casa para Deus, enquanto Deus promete estabelecer a casa de Davi. Uma substituição eliminaria parte dessa ligação e restringiria indevidamente sua amplitude.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi mantida de modo natural, e a terminologia central do capítulo foi preservada. O marcador [a] aparece imediatamente após a expressão que a nota explica.
