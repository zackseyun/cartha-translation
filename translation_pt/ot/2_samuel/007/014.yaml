  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: pt
  text: Eu serei pai para ele, e ele será filho para mim. Quando ele cometer iniquidade, eu o corrigirei com a vara dos homens e com golpes de seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “com os golpes dos filhos do homem”; isto é, golpes humanos.'
    reason: Esclarece a expressão hebraica בְּנֵי אָדָם sem sugerir indevidamente referência ao nome próprio Adão.
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Eu serei pai para ele
  rationale: Preserva a construção relacional com לְ e a fórmula da aliança, sem a suavizar para “serei o pai dele”.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: e ele será filho para mim
  rationale: Mantém o paralelismo recíproco da fórmula hebraica e continua natural em português.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Quando ele cometer iniquidade
  rationale: No contexto, אֲשֶׁר introduz a circunstância em que ocorrerá a correção. “Quando” evita tornar a frase excessivamente condicional, e “cometer iniquidade” conserva a gravidade moral do verbo.
- source_word: וְהֹכַחְתִּיו
  choice: eu o corrigirei
  rationale: O hifil de יכח expressa correção ou disciplina. “Corrigirei” comunica a finalidade corretiva e se liga naturalmente aos meios de castigo mencionados em seguida.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: com a vara dos homens
  rationale: Conserva a metáfora da vara e deixa em aberto se se trata de meios humanos comuns ou de castigo aplicado por agentes humanos.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: e com golpes de seres humanos
  rationale: נגעים designa aqui golpes ou feridas. “Seres humanos” transmite de modo atual e inclusivo o sentido coletivo de בְּנֵי אָדָם, enquanto a nota registra a forma literal.
theological_decisions:
- issue: Alcance da promessa filial em relação à dinastia de Davi e ao seu uso messiânico posterior
  choice: Traduzir o versículo em seu sentido histórico imediato, referente ao descendente real de Davi, sem inserir interpretação messiânica explícita no texto.
  alternative: Apresentar a declaração como referência direta e exclusiva ao Messias.
  rationale: A linguagem pertence primeiramente à aliança davídica e contempla a possibilidade de iniquidade e correção no descendente real. Usos posteriores da linguagem filial não justificam acrescentar ao hebraico uma interpretação cristológica explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula relacional “pai para ele / filho para mim” foi mantida por sua importância literária e pactual; expressões excessivamente arcaicas, como “castigarei com açoites”, foram evitadas.
