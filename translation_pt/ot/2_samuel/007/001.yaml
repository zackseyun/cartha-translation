  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: pt
  text: Quando o rei morava em sua casa[a], e Yahweh lhe havia dado descanso, por todos os lados, de todos os seus inimigos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em seu palácio». O hebraico diz «em sua casa»; essa forma também antecipa o jogo de sentidos com a palavra «casa» mais adiante no capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quando
  rationale: Introduz a circunstância temporal e a nova cena de modo natural, sem acrescentar um advérbio temporal ausente do hebraico.
- source_word: יָשַׁב
  choice: já morava
  rationale: Neste contexto, indica residência estabelecida, não o ato físico de sentar-se. O aspecto contínuo é expresso naturalmente em português; «já» ajuda a situar o estado anterior à ação seguinte sem funcionar como marcador discursivo equivalente a «ora».
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico, sem substituí-lo pelo nome de Davi.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Preserva o sentido básico de בַּיִת e antecipa o jogo literário com «casa» ao longo do capítulo; «palácio» é possível pelo contexto, mas mais interpretativo.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Mantém a ligação coordenativa e representa diretamente o nome divino יהוה.
- source_word: הֵנִיחַ לוֹ
  choice: lhe havia dado descanso
  rationale: Expressa o sentido causativo do hifil de נוח e, com o mais-que-perfeito, indica que esse descanso precedia a cena narrada.
- source_word: מִסָּבִיב מִכָּל אֹיְבָיו
  choice: de todos os seus inimigos ao redor
  rationale: Transmite tanto a fonte do descanso — os inimigos — quanto a segurança em toda a volta, em formulação corrente e fiel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; «Yahweh» preserva o nome pactual em vez de substituí-lo por um título.
- issue: Nuance da residência real em בַּיִת
  choice: casa
  alternative: palácio
  rationale: Embora «palácio» seja contextualmente possível, «casa» preserva a amplitude do termo hebraico e o jogo literário e teológico do capítulo, sem resolver antecipadamente seus vários sentidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada com naturalidade, sem perder a relação temporal nem a repetição literariamente importante de «casa». A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
