  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: pt
  text: 'Vá e diga ao meu servo Davi: “Assim diz Yahweh: É você quem construirá para mim uma casa para eu habitar nela?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você construiria para mim uma casa para eu habitar nela?” A pergunta hebraica dá ênfase a “você” e tem força retórica.'
    reason: Registra uma formulação alternativa para a pergunta enfática sem eliminar sua ambiguidade formal.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Vá e diga
  rationale: O imperativo seguido da forma verbal com valor sequencial expressa duas ordens diretas. “Vá e diga” é natural em português e preserva essa força.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: ao meu servo Davi
  rationale: “Servo” comunica adequadamente o uso honorífico e régio de עבד neste contexto. A aposição sem repetir a preposição é clara e natural em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e apresenta o tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: הַאַתָּה תִּבְנֶה לִּי
  choice: É você quem construirá para mim
  rationale: A construção interrogativa com o pronome enfático destaca “você”. Esta formulação preserva tanto a ênfase quanto o caráter retórico da pergunta.
- source_word: בַיִת
  choice: casa
  rationale: Embora se refira a um santuário, “casa” preserva o termo hebraico e o jogo literário posterior entre a casa para Deus e a casa de Davi.
- source_word: לְשִׁבְתִּי
  choice: para eu habitar nela
  rationale: O infinitivo com sufixo de primeira pessoa indica finalidade. A formulação portuguesa explicita de modo natural que a casa seria o lugar da habitação divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de בַיִת
  choice: casa
  alternative: templo
  rationale: “Casa” conserva a amplitude do hebraico e o contraste teológico-literário central do capítulo; “templo” anteciparia uma especificação não expressa pelo substantivo.
- issue: Força da pergunta הַאַתָּה תִּבְנֶה
  choice: É você quem construirá...?
  alternative: Você construiria...?
  rationale: A opção principal mantém explícita a ênfase no pronome e deixa que o contexto comunique a força retórica, sem transformar a pergunta em uma negação categórica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a solenidade da fórmula profética, evitando tanto arcaísmos quanto explicações inseridas no texto.
