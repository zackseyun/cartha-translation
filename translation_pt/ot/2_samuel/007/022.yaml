reference: 2 Samuel 7:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: pt
  text: Por isso, tu és grande, Senhor Yahweh[a], pois não há ninguém como tu, e não há Deus além de ti[b], conforme tudo o que ouvimos com os nossos ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor Yahweh”. O título combina אֲדֹנָי, “Senhor”, com o nome divino יהוה.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “não há deus exceto tu” ou “não há Deus fora de ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz a conclusão tirada dos atos e das promessas de Deus mencionados anteriormente, preservando de modo natural a força inferencial do hebraico.
- source_word: גָּדַלְתָּ
  choice: tu és grande
  rationale: 'O perfeito de גדל pode indicar o estado reconhecido como resultado: a grandeza de Deus. Esta formulação é direta, doxológica e natural em português.'
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי, “Senhor”, quanto o nome divino יהוה, evitando substituir o nome por outro título e evitando a sequência pouco clara “Senhor SENHOR”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da declaração anterior com uma ligação explicativa concisa e digna.
- source_word: אֵין כָּמוֹךָ
  choice: não há ninguém como tu
  rationale: Expressa de maneira natural a incomparabilidade afirmada pelo hebraico.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: e não há Deus além de ti
  rationale: זוּלָתֶךָ tem sentido exclusivo, “além de, fora de, exceto”. A redação mantém a confissão direta de exclusividade divina sem acrescentar elaboração teológica.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: conforme tudo o que ouvimos com os nossos ouvidos
  rationale: “Conforme” preserva a relação com o testemunho recebido, e “com os nossos ouvidos” mantém a expressão enfática concreta do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה no título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS; Soberano SENHOR
  rationale: O texto contém o nome divino, não apenas um título. “Senhor Yahweh” torna visíveis os dois elementos hebraicos e evita resolver a combinação por substituição silenciosa.
- issue: Exclusividade divina em אֵין אֱלֹהִים זוּלָתֶךָ
  choice: não há Deus além de ti
  alternative: não há deus exceto tu; não existe outro Deus fora de ti
  rationale: A tradução conserva a afirmação monoteísta em sua forma direta, sem ampliar o versículo com categorias filosóficas ou formulações confessionais posteriores.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” coerente com a oração dirigida diretamente a Deus. A construção mantém o paralelismo hebraico e a expressão concreta “com os nossos ouvidos” sem soar excessivamente arcaica.
