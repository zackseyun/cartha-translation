  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: pt
  text: E estabeleceste para ti o teu povo Israel, para ser teu povo para sempre; e tu, Yahweh[b], te tornaste o Deus deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eras o Deus deles”. O hebraico também pode ser entendido em sentido estativo; “te tornaste o Deus deles” destaca, neste contexto, o estabelecimento da relação de aliança.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino YHWH, aqui transliterado como “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: estabeleceste
  rationale: A forma causativa/intensiva de כון comunica tornar firme ou estabelecer. “Estabeleceste” conserva o sentido de constituição duradoura no contexto da aliança e soa natural em português.
- source_word: לְךָ
  choice: para ti
  rationale: A repetição da preposição com o pronome assinala que Israel pertence a Yahweh e foi destinado a ele; “para ti” preserva essa força sem ampliar o texto.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: o teu povo Israel
  rationale: Mantém tanto a relação de pertencimento quanto o nome nacional, com uma ordem clara e natural em português.
- source_word: לְךָ לְעָם
  choice: para ser teu povo
  rationale: Expressa de modo idiomático a identidade de aliança indicada pela construção hebraica, preservando também a repetição de “povo”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração permanente indicada pelo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, tornando explícito o nome presente no texto hebraico.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: te tornaste o Deus deles
  rationale: No contexto da constituição de Israel como povo de Yahweh, a construção היה com ל pode indicar o estabelecimento dessa relação recíproca. A formulação conserva a força verbal, enquanto a alternativa estativa é registrada em nota.
theological_decisions:
- issue: Formulação recíproca da aliança
  choice: “para ser teu povo para sempre; e tu, Yahweh, te tornaste o Deus deles”
  alternative: “para ser teu povo para sempre; e tu, Yahweh, eras o Deus deles”
  rationale: A tradução preserva a reciprocidade do texto — Israel constituído como povo de Yahweh e Yahweh em relação com Israel como seu Deus — sem acrescentar formulações doutrinárias posteriores. A nota mantém aberta a possibilidade de entender היה em sentido estativo.
translation_notes:
  register: Português moderno, claro e digno, com uso coerente de “tu” para a oração dirigida a Deus. A repetição de “povo” e de “para ti/teu” foi preservada por sua função na fórmula da aliança. A pontuação com ponto e vírgula evidencia as duas partes recíprocas sem romper a unidade do versículo.
