  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: pt
  text: e desde o dia em que designei juízes sobre o meu povo Israel. Eu lhe darei descanso de todos os seus inimigos.[a] Yahweh também lhe declara que Yahweh fará uma casa para você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhe dei descanso de todos os seus inimigos”. A forma hebraica admite discussão quanto à referência temporal neste contexto.'
    reason: ambiguity
  - marker: b
    text: 'Ou: “construirá uma casa para você”. Aqui, “casa” provavelmente se refere sobretudo a uma dinastia real, mas também ecoa o desejo de Davi de construir uma casa, isto é, um templo, para Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: e desde o dia
  rationale: Mantém tanto a ligação com o contexto anterior quanto o ponto inicial temporal expresso pela sequência preposicional hebraica.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: designei juízes
  rationale: Embora צוה tenha como sentido básico “ordenar”, com “juízes” neste contexto indica estabelecê-los ou encarregá-los de governar.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sobre o meu povo Israel
  rationale: A preposição עַל expressa aqui autoridade ou jurisdição exercida pelos juízes.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Eu lhe darei descanso de todos os seus inimigos
  rationale: O Hifil de נוח indica conceder descanso ou alívio. A leitura futura acompanha a sequência verbal e a promessa no contexto; a possível leitura como ação já realizada é registrada em nota.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Yahweh também lhe declara
  rationale: O Hifil de נגד significa anunciar ou declarar. “Também” representa a força conjuntiva de וְ na transição para um anúncio adicional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: que Yahweh fará uma casa para você
  rationale: A formulação preserva a amplitude de עשה e o jogo deliberado de sentidos de בַּיִת, que remete tanto a uma casa construída quanto, sobretudo aqui, a uma linhagem real.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração conserva o nome da aliança sem convertê-lo em título.
- issue: Sentido de בַּיִת na promessa a Davi
  choice: casa, com a implicação dinástica preservada
  alternative: dinastia; casa real; templo
  rationale: O hebraico explora intencionalmente a relação entre a casa que Davi desejava construir para Deus e a “casa” que Deus faria para Davi. Traduzir apenas por “dinastia” eliminaria esse jogo literário e teológico.
- issue: Valor temporal de וַהֲנִיחֹתִי
  choice: 'futuro: “darei descanso”'
  alternative: 'passado/perfeito: “dei descanso” ou “tenho dado descanso”'
  rationale: A forma pode ser lida em relação à sequência verbal de promessa como futura, leitura amplamente favorecida pelo contexto sintático. A vocalização e a relação com o repouso já mencionado permitem que se reconheça a leitura de ação concluída, mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para o singular de segunda pessoa conforme o uso brasileiro corrente. Conservou-se a abertura coordenada e dependente do contexto anterior (“e desde o dia”), em vez de transformar o fragmento em uma frase independente. A repetição de “Yahweh” reproduz a ênfase do hebraico.
