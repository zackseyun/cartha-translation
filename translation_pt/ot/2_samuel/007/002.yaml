base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: pt
  text: 'E o rei disse ao profeta Natã: “Veja: eu moro numa casa de cedro, mas a arca de Deus habita entre cortinas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentro de uma cortina”; o termo hebraico designa uma cortina ou peça de tecido de tenda e pode ter sentido coletivo, evocando as coberturas do tabernáculo.
    reason: alternativa lexical e esclarecimento do singular coletivo
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o avanço narrativo do wayyiqtol sem impor uma sequência temporal mais específica.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Preserva o título definido usado no hebraico, sem substituir explicitamente por “Davi”.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Forma idiomática em português para a identificação apositiva, preservando o nome e o título.
- source_word: רְאֵה נָא
  choice: Veja
  rationale: Funciona como chamada de atenção natural em português; o contexto e a pontuação comunicam a força discursiva de נָא sem transformá-la indevidamente em súplica.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: eu moro
  rationale: Expressa naturalmente a residência do rei. O pronome explícito conserva a leve ênfase de אָנֹכִי.
- source_word: בְּבֵית אֲרָזִים
  choice: numa casa de cedro
  rationale: Entende “cedro” como material de construção e usa uma formulação corrente em português.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: mas a arca de Deus
  rationale: A conjunção introduz um contraste evidente entre a residência do rei e o lugar onde está a arca.
- source_word: יֹשֵׁב
  choice: permanece
  rationale: Conserva o paralelismo conceitual com a habitação do rei, mas evita atribuir de modo excessivamente literal à arca o ato de “morar”.
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: entre cortinas
  rationale: Formulação natural que preserva a imagem concreta das peças de tecido ou cortinas da tenda; o singular hebraico pode ter sentido coletivo.
theological_decisions:
- issue: Alojamento da arca
  choice: “a arca de Deus permanece entre cortinas”
  alternative: “a arca de Deus está numa tenda”
  rationale: A tradução mantém a referência específica a יְרִיעָה, cortina ou peça de tecido de tenda, sem generalizá-la para “tenda” nem introduzir desenvolvimentos posteriores da teologia do templo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veja” conserva a chamada de atenção sem soar arcaico; “permanece entre cortinas” mantém o contraste e a imagem cultual concreta.
