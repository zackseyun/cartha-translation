base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: pt
  text: 'Mas, naquela noite, a palavra de Yahweh veio a Natã, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Mas
  rationale: A forma narrativa faz a ação avançar; no contexto imediato, “Mas” expressa naturalmente o contraste entre a aprovação anterior de Natã e a revelação divina que a corrige.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Tradução idiomática e temporalmente específica da expressão hebraica, literalmente “naquela/aquela noite” com preposição.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: Preserva a fórmula profética tradicional e comunica em português corrente que a revelação foi dirigida ao profeta, sem reduzir דָּבָר a uma simples informação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל נָתָן
  choice: a Natã
  rationale: אֶל indica o destinatário da revelação; “a Natã” é natural e direto em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o conteúdo do discurso divino que começa no versículo seguinte; os dois-pontos sinalizam essa continuação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse nome, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão da fórmula profética e usa “Mas” para tornar explícito o contraste narrativo presente no contexto.
