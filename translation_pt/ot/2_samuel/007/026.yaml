id: 2SA.7.26
reference: 2 Samuel 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: pt
  text: 'E que o teu nome seja engrandecido para sempre[a], para que se diga: “Yahweh dos Exércitos é Deus sobre Israel”. E que a casa[b] do teu servo Davi seja firmemente estabelecida diante de ti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se torne grande para sempre”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” se refere à família real ou dinastia de Davi, não apenas a uma construção.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: E que ... seja engrandecido
  rationale: O imperfeito com valor volitivo expressa desejo ou oração no contexto. “Seja engrandecido” comunica que o nome de Deus é reconhecido e manifestado como grande.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Preserva o idioma hebraico, no qual “nome” pode abranger reputação, renome e identidade revelada, sem explicitar além do texto.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa natural que preserva a ideia de duração perpétua.
- source_word: לֵאמֹר
  choice: para que se diga
  rationale: Explicita de modo natural o vínculo entre o engrandecimento do nome e a confissão citada, sem alterar seu conteúdo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino como nome próprio e traduz צְבָאוֹת pela forma portuguesa corrente, que pode abranger exércitos ou hostes celestiais.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: é Deus sobre Israel
  rationale: “Sobre Israel” preserva o valor mais provável de עַל, indicando autoridade ou soberania.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: E que a casa do teu servo Davi
  rationale: Retém “casa” para preservar a formulação e o jogo temático de 2 Samuel 7, enquanto a nota esclarece o sentido dinástico.
- source_word: יִהְיֶה נָכוֹן
  choice: seja firmemente estabelecida
  rationale: Reproduz tanto a ideia de estabelecimento quanto a de firmeza e estabilidade contida em נָכוֹן.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Tradução direta e natural que preserva o sentido relacional de permanência na presença e sob o olhar de Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de בַּיִת na promessa davídica
  choice: Manter “casa” no texto e esclarecer o sentido em nota
  alternative: dinastia; linhagem
  rationale: “Casa” preserva a repetição e o jogo de sentidos do capítulo, embora aqui designe principalmente a família real ou dinastia de Davi.
- issue: Força volitiva da segunda oração
  choice: E que ... seja firmemente estabelecida
  alternative: e a casa ... será estabelecida
  rationale: O contexto de oração favorece a continuidade do desejo expresso no primeiro verbo, embora a forma יִהְיֶה também possa ser lida como declaração futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. “Dos Exércitos” preserva o título tradicional sem recorrer ao menos corrente “das hostes”.
