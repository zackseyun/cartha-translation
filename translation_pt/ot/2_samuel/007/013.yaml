  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: pt
  text: Ele construirá uma casa para o meu nome[a], e eu firmarei o trono do seu reino para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um templo para o meu nome”. O hebraico diz literalmente “uma casa para o meu nome”, preservando o jogo de palavras do capítulo entre um templo e uma dinastia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ele
  rationale: O pronome independente masculino singular explicita o sujeito; em português, “Ele” é natural e não acrescenta uma ênfase ausente do contexto.
- source_word: יִבְנֶה
  choice: construirá
  rationale: O imperfeito qal tem valor futuro no contexto da promessa; o futuro simples comunica de modo claro a ação anunciada.
- source_word: בַּיִת
  choice: uma casa
  rationale: Embora aqui designe o santuário que será construído, “casa” preserva o sentido lexical e o jogo de palavras do capítulo entre casa como templo e casa como dinastia.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Reproduz de perto a construção hebraica com ל e mantém o idioma teológico sem explicá-lo excessivamente.
- source_word: וְכֹנַנְתִּי
  choice: e eu firmarei
  rationale: A forma verbal, em sequência de promessa, tem sentido futuro. “Firmarei” expressa tornar estável e duradouro o trono, com linguagem natural e digna.
- source_word: אֶת כִּסֵּא
  choice: o trono
  rationale: כִּסֵּא designa diretamente o trono real; o marcador de objeto אֶת não recebe tradução separada.
- source_word: מַמְלַכְתּוֹ
  choice: do seu reino
  rationale: A expressão traduz diretamente o domínio real pertencente ao descendente mencionado.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A locução portuguesa transmite a perpetuidade enfática da promessa pactual sem enfraquecê-la.
theological_decisions:
- issue: Se בַּיִת deve ser traduzido como “casa” ou interpretado como “templo”
  choice: casa
  alternative: templo
  rationale: O referente imediato é o santuário que o descendente de Davi edificará, mas “casa” preserva a tensão literária e teológica entre templo e dinastia que estrutura o capítulo.
- issue: A força de עַד עוֹלָם na promessa davídica
  choice: para sempre
  alternative: por muito tempo
  rationale: Neste contexto pactual, a expressão apresenta a permanência da promessa em sua plena força; uma formulação meramente temporal e indefinida a enfraqueceria.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A formulação conserva o paralelismo da promessa e o jogo lexical de “casa”, evitando explicitação denominacional.
