base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: pt
  text: E agora, Yahweh, Deus, confirma para sempre a palavra[a] que falaste a respeito do teu servo e de sua casa[b], e faze como falaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a promessa que fizeste».'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «casa» se refere à casa real, isto é, à dinastia de Davi, e não apenas à sua família ou residência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Após o nome divino, funciona como título e forma naturalmente a invocação «Yahweh Deus».
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Preserva o sentido lexical direto e a formulação hebraica; «a promessa» é possível pelo contexto, mas explicita uma inferência.
- source_word: דִּבַּרְתָּ
  choice: que falaste
  rationale: Retoma a fala anterior de Deus e mantém a repetição verbal presente no hebraico.
- source_word: עַל
  choice: a respeito de
  rationale: Indica o assunto da declaração divina em português natural e preciso.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: Expressa a linguagem convencional de humildade diante de Deus sem impor aqui o sentido mais forte de escravidão.
- source_word: בֵּיתוֹ
  choice: da casa dele
  rationale: Conserva a imagem central de «casa», ao mesmo tempo que o pronome «dele» deixa claro que se trata da casa do servo; neste contexto, a expressão inclui a linhagem ou dinastia de Davi.
- source_word: הָקֵם
  choice: confirma
  rationale: O imperativo causativo pede que Deus faça sua palavra permanecer firme; «confirma» combina naturalmente com «a palavra».
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a expressão portuguesa corrente para duração perpétua.
- source_word: וַעֲשֵׂה
  choice: e faze
  rationale: Mantém o imperativo amplo e conciso do hebraico, sem acrescentar o sentido interpretativo de «cumpre».
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: como falaste
  rationale: Preserva a repetição de דבר e destaca que Davi pede a Deus que aja de acordo com sua própria declaração.
theological_decisions:
- issue: Traduzir דָּבָר literalmente como «palavra» ou interpretativamente como «promessa» no contexto da aliança
  choice: a palavra
  alternative: a promessa
  rationale: Embora o contexto seja claramente promissório e ligado à aliança, o hebraico diz literalmente «a palavra que falaste». A tradução principal preserva essa formulação, e a nota registra a força contextual possível.
- issue: Explicitar בֵּיתוֹ como «dinastia» ou conservar a imagem de «casa»
  choice: da casa dele
  alternative: da dinastia dele
  rationale: O sentido dinástico é essencial em 2 Samuel 7, mas «casa» é a imagem-chave que liga família, linhagem e reinado. A nota esclarece o sentido sem apagar essa imagem.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa do singular («teu», «falaste», «faze») coerentes com a oração dirigida diretamente a Deus. A repetição de «falaste» reproduz deliberadamente a estrutura hebraica.
