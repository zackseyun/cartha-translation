reference: 2 Samuel 7:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: pt
  text: E quem é como o teu povo, como Israel, a única nação na terra que Deus foi resgatar para si como povo, para fazer para si um nome e realizar por vocês[a] coisas grandiosas e temíveis[b] em favor da tua terra, diante do teu povo, que resgataste para ti do Egito, das nações e de seus deuses[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico muda aqui inesperadamente para a segunda pessoa do plural: “por vocês”.'
    reason: pronoun_shift
  - marker: b
    text: Ou “coisas grandiosas e assombrosas”. O termo hebraico pode descrever feitos que despertam reverência, pavor ou medo.
    reason: lexical_alternative
  - marker: c
    text: A frase final é difícil em hebraico. Outras traduções possíveis são “do Egito, das nações e do seu deus” ou “do Egito, nações e deuses”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: E quem é como o teu povo, como Israel
  rationale: Mantém a pergunta retórica de incomparabilidade e a repetição enfática da comparação, sem reduzir Israel a uma simples aposição.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: a única nação na terra
  rationale: O numeral אֶחָד, neste contexto retórico, destaca a singularidade de Israel entre as nações; “única” comunica essa força naturalmente em português.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: que Deus foi
  rationale: Embora אֱלֹהִים tenha forma plural, o contexto apresenta o Deus de Israel como agente singular. “Foi” conserva a imagem concreta da ação divina.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: resgatar para si como povo
  rationale: “Resgatar” expressa o sentido de פדה e soa natural em português; “para si como povo” preserva tanto a posse quanto o resultado pactual da ação.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: para fazer para si um nome
  rationale: Reproduz o idioma de adquirir renome por meio de atos poderosos, com formulação clara e corrente.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: e realizar por vocês
  rationale: Retém o pronome de segunda pessoa do plural לָכֶם, apesar da mudança inesperada de pessoa no texto massorético, sem emendá-lo silenciosamente.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: coisas grandiosas e temíveis
  rationale: Expressa o valor conjunto da grandeza e dos atos que provocam temor ou espanto. “Temíveis” conserva a intensidade de נֹרָאוֹת.
- source_word: לְאַרְצְךָ
  choice: em favor da tua terra
  rationale: A preposição לְ permite sentido benefactivo; esta formulação é mais natural do que “para tua terra” e mantém אֶרֶץ como “terra”.
- source_word: מִפְּנֵי עַמְּךָ
  choice: diante do teu povo
  rationale: Preserva o sentido espacial da expressão, compatível com atos realizados à frente de Israel e com a expulsão do que estava diante dele.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: que resgataste para ti do Egito
  rationale: Repete “resgatar” para refletir a repetição de פדה e conserva a ideia de um povo adquirido para Deus.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: das nações e de seus deuses
  rationale: Oferece uma leitura contextual coerente para a cláusula final comprimida, entendendo nações e deuses como aquilo de que ou diante de que o povo foi libertado; a dificuldade é explicitada em nota.
theological_decisions:
- issue: Número e referente de אֱלֹהִים
  choice: “Deus”, no singular, referindo-se ao Deus de Israel
  alternative: “deuses”, no plural
  rationale: O contexto da oração e a ação singular atribuída ao agente apontam para o Deus de Israel; traduzir no plural alteraria o sentido teológico e discursivo da passagem.
- issue: Mudança de pessoa em לָכֶם
  choice: manter “por vocês”, segunda pessoa do plural
  alternative: 'harmonizar com o destinatário singular da oração: “por ti”'
  rationale: O texto massorético traz inequivocamente o plural. A tradução preserva essa tensão textual em vez de harmonizá-la sem aviso.
- issue: Cláusula final גּוֹיִם וֵאלֹהָיו
  choice: “das nações e de seus deuses”
  alternative: “do Egito, das nações e do seu deus” ou “do Egito, nações e deuses”
  rationale: A construção hebraica é sintaticamente difícil. A leitura escolhida se ajusta ao contexto do êxodo e da expulsão das nações, mas a nota conserva alternativas reais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “teu/ti” na oração dirigida a Deus e conserva “vocês” onde o hebraico muda de modo inesperado para a segunda pessoa do plural. A sintaxe longa da pergunta foi mantida, mas organizada com pontuação e escolhas idiomáticas naturais.
