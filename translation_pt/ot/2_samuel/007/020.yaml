  text: וּ/מַה יּוֹסִ֥יף דָּוִ֛ד ע֖וֹד לְ/דַבֵּ֣ר אֵלֶ֑י/ךָ וְ/אַתָּ֛ה יָדַ֥עְתָּ אֶֽת עַבְדְּ/ךָ֖ אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: pt
  text: E que mais Davi pode dizer a ti? Tu conheces o teu servo, Senhor Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor YHWH”. “Yahweh” é a vocalização convencional do nome divino יהוה.'
    reason: Esclarece a forma hebraica do título e a convenção adotada para representar o nome divino.
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: E que mais Davi pode dizer a ti?
  rationale: A construção idiomática com יסף, עוֹד e o infinitivo לְדַבֵּר significa literalmente «que acrescentará ainda Davi falar», mas em português corrente corresponde naturalmente a «que mais Davi pode dizer». O «E» preserva a continuidade da oração.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: Tu conheces
  rationale: O pronome explícito dá ênfase ao destinatário. O perfeito hebraico descreve aqui um conhecimento estabelecido e presente; o presente do indicativo comunica isso de modo natural.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: No contexto da oração real, עֶבֶד é a autodesignação humilde de Davi diante de Deus. «Servo» preserva essa relação sem salientar indevidamente a acepção social de «escravo».
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: אֲדֹנָי é traduzido como «Senhor», enquanto o nome divino יהוה é representado como «Yahweh», distinguindo título e nome e evitando a repetição «Senhor SENHOR».
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor Deus; Senhor YHWH
  rationale: A tradução mantém tanto o título אֲדֹנָי quanto o nome pessoal יהוה, sem converter silenciosamente o nome em outro título. A nota informa a forma consonantal e a convenção de pronúncia.
translation_notes:
  register: Português moderno, digno e acessível, com «Tu» para conservar a ênfase do pronome hebraico e concordância uniforme em «a ti» e «teu». A formulação da pergunta é idiomática, sem perder o sentido da construção hebraica.
