  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: pt
  text: Estive com você por onde quer que você andasse e eliminei todos os seus inimigos de diante de você. E farei para você um grande nome[a], como o nome dos grandes que há na terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “grande renome”. Em hebraico, “nome” muitas vezes tem o sentido de reputação ou fama, mas o texto principal preserva o modo de dizer bíblico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como o nome dos grandes homens que há na terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Estive
  rationale: O wayyiqtol de היה integra a sequência narrativa das ações passadas do SENHOR; o pretérito perfeito comunica isso naturalmente em português.
- source_word: עִמְּךָ
  choice: com você
  rationale: Preserva tanto a ideia direta de presença quanto a nuance de apoio divino.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: por onde quer que você andasse
  rationale: Expressa de forma idiomática e abrangente todos os lugares e trajetos de Davi.
- source_word: וָאַכְרִתָה
  choice: eliminei
  rationale: Neste contexto, o hifil de כרת indica remover ou destruir os inimigos; “eliminei” conserva a força do verbo sem soar artificial.
- source_word: אֶת כָּל אֹיְבֶיךָ
  choice: todos os seus inimigos
  rationale: Mantém explicitamente a totalidade expressa por כָּל.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Conserva o idioma espacial hebraico, indicando que os inimigos foram removidos da presença ou do caminho de Davi.
- source_word: וְעָשִׂיתִי לְךָ
  choice: E farei para você
  rationale: Embora a forma seja qatal, o contexto promissório favorece valor futuro; “para você” mantém a nuance benefativa da preposição לְ.
- source_word: שֵׁם גָּדוֹל
  choice: um grande nome
  rationale: Preserva o idioma bíblico e suas ressonâncias, embora “nome” aqui também denote reputação ou fama.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: como o nome dos grandes
  rationale: Repete “nome”, como no hebraico, e não restringe desnecessariamente o substantivo a uma formulação masculina explícita.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: que há na terra
  rationale: “Terra” preserva a amplitude e alguma ambiguidade de אֶרֶץ, enquanto o contexto permite uma comparação com as pessoas renomadas do mundo.
theological_decisions:
- issue: Valor temporal de וְעָשִׂיתִי no discurso da promessa divina
  choice: 'futuro: “E farei para você um grande nome”'
  alternative: 'perfeito/passado: “E fiz para você um grande nome” ou “E tenho feito para você um grande nome”'
  rationale: O discurso passa da recapitulação das ações anteriores de Deus à promessa; o futuro comunica melhor essa progressão e corresponde ao paralelo de 1 Crônicas 17:8, sem ocultar o caráter promissório da fala.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva os principais idiomas hebraicos (“de diante de você”, “um grande nome”) sem sacrificar a naturalidade. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
