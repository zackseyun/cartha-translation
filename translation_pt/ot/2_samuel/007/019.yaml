  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: pt
  text: E até isso foi pouco aos teus olhos, Senhor DEUS; também falaste a respeito da casa do teu servo para um futuro distante.[a] E esta é a instrução para o ser humano,[b] Senhor DEUS.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “para longe”; no contexto, a expressão se refere ao futuro distante.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico da cláusula final é difícil. Também pode ser traduzido: “esta é a lei (ou norma) do ser humano” ou “este é o estatuto para a humanidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: E até isso foi pouco aos teus olhos
  rationale: Preserva o idiomatismo hebraico de avaliação e o sentido de que a promessa já concedida pareceu pequena aos olhos de Deus, sem acrescentar a ideia comparativa de 'pequeno demais'.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor DEUS
  rationale: Evita a forma redundante 'Senhor SENHOR' e mantém a distinção convencional do nome divino no título composto.
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: também falaste a respeito de
  rationale: No contexto, a fala divina diz respeito à casa de Davi; esta construção é natural em português e comunica adequadamente a relação introduzida por אֶל.
- source_word: בֵּית עַבְדְּךָ
  choice: casa do teu servo
  rationale: Mantém o termo concreto 'casa', que neste contexto pode abranger família, linhagem e dinastia, sem resolver a polissemia no texto principal.
- source_word: לְמֵרָחוֹק
  choice: para um futuro distante
  rationale: Explicita o valor temporal contextual de 'ao longe', referindo-se ao que acontecerá muito adiante.
- source_word: תּוֹרַת
  choice: instrução
  rationale: תּוֹרָה pode indicar instrução, lei, norma ou ordenança. 'Instrução' preserva maior amplitude na cláusula notoriamente difícil.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Representa o substantivo coletivo/singular אָדָם de maneira inclusiva e natural, sem restringi-lo indevidamente a um homem específico.
theological_decisions:
- issue: Sentido da cláusula difícil וְזֹאת תּוֹרַת הָאָדָם
  choice: E esta é a instrução para o ser humano
  alternative: 'E esta é a lei/norma do ser humano; ou: este é o estatuto para a humanidade'
  rationale: A sintaxe e o sentido exato da expressão hebraica são disputados. O texto principal permanece próximo dos componentes lexicais, enquanto a nota conserva alternativas legítimas sem impor uma interpretação dinástica, antropológica ou messiânica específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento na segunda pessoa do singular acompanha a oração direta a Deus. A ordem das notas foi ajustada para que cada marcador apareça junto ao trecho que explica.
