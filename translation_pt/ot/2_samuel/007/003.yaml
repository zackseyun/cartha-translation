base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: pt
  text: 'E Natã disse ao rei: “Vá, faça tudo o que está em seu coração[a], pois Yahweh está com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que você tem no coração”. No idioma hebraico, “coração” pode indicar a intenção, a vontade ou o propósito interior, e não apenas as emoções.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva a sequência de modo natural e sem explicitar uma relação além da indicada.
- source_word: נָתָן
  choice: Natã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Traduz diretamente o substantivo comum definido do hebraico, sem acrescentar o nome de Davi, que não aparece neste versículo.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: tudo o que está em seu coração
  rationale: Preserva a imagem hebraica do coração como sede da intenção, vontade e propósito, mantendo uma expressão compreensível em português moderno.
- source_word: לֵךְ עֲשֵׂה
  choice: Vá, faça
  rationale: Os dois imperativos exprimem permissão e incentivo para agir. A formulação concisa conserva a estrutura hebraica e soa natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dada por Natã e mantém um registro digno, atual e claro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמָּךְ
  choice: está com você
  rationale: Preserva a ideia de presença e apoio sem explicitar além do que o hebraico afirma.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Alcance da afirmação de Natã
  choice: “Yahweh está com você” como razão do conselho de Natã
  alternative: Explicitar que Deus aprova especificamente o projeto do rei
  rationale: A tradução mantém a afirmação tal como aparece, sem transformá-la numa declaração explícita de aprovação divina do projeto, especialmente porque a narrativa subsequente introduz uma correção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a concisão dos imperativos e a metáfora hebraica do coração.
