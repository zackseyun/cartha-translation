  terminology: “Meu povo Israel”, “plantarei”, “afligir” e “como antes” são escolhas fiéis. “Filhos da perversidade” conserva a construção metafórica masculina do hebraico; a nota registra opções portuguesas correntes sem apagar o idiomatismo no texto principal.
