  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: pt
  text: Estabelecerei um lugar para o meu povo Israel e o plantarei, para que habite em seu próprio lugar e não seja mais perturbado. Os filhos da perversidade[a] não voltarão a afligi-lo, como antes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “malfeitores” ou “homens perversos”. Hebraico: “filhos da perversidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: Estabelecerei um lugar
  rationale: שׂוּם significa literalmente pôr ou colocar, mas, tendo מָקוֹם como objeto nesta promessa, comunica a ação de destinar e firmar um lugar. “Estabelecerei” preserva a iniciativa divina e soa natural em português.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: para o meu povo Israel
  rationale: 'A expressão é apositiva: Israel identifica “meu povo”. A tradução conserva tanto a relação de pertencimento quanto o nome nacional.'
- source_word: וּנְטַעְתִּיו
  choice: e o plantarei ali
  rationale: O sufixo masculino singular retoma Israel como povo coletivo. “Plantarei” conserva a metáfora agrícola de estabelecimento duradouro; “ali” explicita em português que o plantio ocorre no lugar mencionado, sem substituir a metáfora por uma abstração.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: para que habite em seu próprio lugar
  rationale: O verbo singular continua a tratar Israel como coletividade. Neste contexto de assentamento, תַּחְתָּיו tem o sentido idiomático de permanecer em seu lugar, não de estar fisicamente debaixo de algo.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: e não seja mais perturbado
  rationale: רגז pode indicar tremor, agitação ou perturbação. A voz passiva em português expressa adequadamente a desestabilização causada por inimigos, enquanto “mais” com a negação comunica cessação futura.
- source_word: בְנֵי עַוְלָה
  choice: os filhos da perversidade
  rationale: A formulação mantém a imagem hebraica literal e sua forma masculina. “Perversidade” abrange a ideia de maldade e injustiça presente em עַוְלָה; uma alternativa idiomática é registrada em nota.
- source_word: לְעַנּוֹתוֹ
  choice: a afligi-lo
  rationale: ענה no Piel pode significar afligir, oprimir ou humilhar. “Afligir” preserva essa amplitude e o pronome singular retoma naturalmente “o meu povo Israel”.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: como antes
  rationale: A expressão remete aos períodos anteriores de opressão. “Como antes” é conciso, atual e não especifica além do texto qual período está em vista.
theological_decisions:
- issue: Israel como coletivo singular
  choice: Manter em português o singular coletivo em “o plantarei”, “habite” e “afligi-lo”
  alternative: 'Empregar plurais referentes aos israelitas: “os plantarei”, “habitem” e “afligi-los”'
  rationale: O hebraico apresenta sufixos e verbos no masculino singular, tratando Israel como um povo coletivo. Diferentemente do inglês, o português permite manter essa concordância de modo natural, preservando mais diretamente a forma do texto sem implicação doutrinária.
- issue: Sentido idiomático de בְנֵי עַוְלָה
  choice: Conservar “filhos da perversidade” no texto principal
  alternative: Traduzir de modo idiomático como “malfeitores” ou “homens perversos”
  rationale: A expressão hebraica é explicitamente masculina e metafórica. Sua conservação mantém a força da forma original, enquanto a nota oferece equivalentes correntes sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a metáfora de plantar, o singular coletivo aplicado a Israel e o idioma hebraico “filhos da perversidade”, esclarecido em nota.
