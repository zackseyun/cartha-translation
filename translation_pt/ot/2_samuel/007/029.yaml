source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: pt
  text: E agora, queira abençoar a casa do teu servo, para que ela permaneça para sempre diante de ti. Pois tu, Senhor Yahweh[a], falaste e, pela tua bênção, a casa do teu servo será abençoada para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Adonai YHWH”, combinação do título “Senhor” com o nome divino Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Neste contexto, “casa” também pode ter o sentido de família, descendência ou dinastia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל
  choice: digna-te
  rationale: O hifil de יאל expressa disposição ou consentimento gracioso. Em contexto de oração, «digna-te» comunica uma súplica respeitosa e soa mais natural em português do que uma reprodução como «dispõe-te».
- source_word: וּבָרֵךְ
  choice: a abençoar
  rationale: O imperativo de ברך é ligado naturalmente a «digna-te» pela preposição «a», formando uma petição corrente em português sem alterar sua força.
- source_word: בֵּית עַבְדְּךָ
  choice: a casa do teu servo
  rationale: «Casa» preserva a amplitude de בַּיִת, que neste contexto pode abranger família, descendência e dinastia, além de manter o jogo literário do capítulo.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: para que ela permaneça para sempre diante de ti
  rationale: Embora היה signifique literalmente «ser/estar», «permaneça» torna explícita em português a continuidade indicada por לְעוֹלָם, sem acrescentar a ideia mais específica de estabelecimento.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa distintamente o título אֲדֹנָי e o nome divino יהוה, evitando a combinação ambígua «Senhor SENHOR».
- source_word: דִּבַּרְתָּ
  choice: falaste
  rationale: O perfeito hebraico aponta para a promessa já pronunciada por Deus; o pretérito perfeito simples é natural e mantém sua relevância no contexto.
- source_word: וּמִבִּרְכָתְךָ
  choice: e, pela tua bênção
  rationale: «Pela» exprime adequadamente a bênção divina como fonte ou meio do estado abençoado anunciado.
- source_word: יְבֹרַךְ
  choice: será abençoada
  rationale: A forma passiva no imperfeito é representada naturalmente pelo futuro do indicativo, em harmonia com a declaração confiante de Davi.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português claro e corrente para a duração permanente expressa por עוֹלָם neste contexto de aliança.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A forma escolhida preserva tanto o título quanto o nome pessoal presente no hebraico, sem fundi-los nem ocultar o tetragrama.
- issue: Sentido de בֵּית no contexto da promessa davídica
  choice: casa
  alternative: dinastia
  rationale: Embora a descendência dinástica esteja claramente em vista, «casa» conserva a polissemia e o jogo temático entre a casa que Davi desejava construir e a casa que Deus prometeu a Davi.
- issue: Força de לִהְיוֹת ... לְעוֹלָם
  choice: permaneça para sempre
  alternative: esteja para sempre
  rationale: «Permaneça» comunica a existência continuada solicitada na oração, mas não introduz o conceito mais específico de «ser estabelecida».
translation_notes:
  register: Português moderno, solene e acessível, com uso de «tu» coerente com a oração direta. «Digna-te» preserva o tom reverente sem recorrer a uma construção pouco idiomática; «casa» mantém deliberadamente a ambiguidade literária e teológica do hebraico.
