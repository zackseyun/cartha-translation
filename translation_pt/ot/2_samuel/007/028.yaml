  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: pt
  text: E agora, Senhor Yahweh[a], tu és Deus, e as tuas palavras são verdadeiras[b], e disseste ao teu servo esta coisa boa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor Yahweh”; Yahweh representa o nome divino escrito com as consoantes YHWH.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “as tuas palavras serão verdadeiras” ou “as tuas palavras são dignas de confiança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Mantém tanto o título אֲדֹנָי como o nome divino יהוה, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: tu és Deus
  rationale: Expressa em português natural a afirmação enfática de identidade presente no hebraico, sem o artificial “tu és o Deus” neste contexto de oração.
- source_word: דְבָרֶיךָ
  choice: as tuas palavras
  rationale: Preserva o plural do substantivo hebraico e evita restringi-lo interpretativamente a “promessas”.
- source_word: יִהְיוּ אֱמֶת
  choice: são verdadeiras
  rationale: Comunica de modo natural que as palavras de Deus são verdadeiras e dignas de confiança; uma nota preserva a possibilidade formal de valor futuro do imperfeito.
- source_word: וַתְּדַבֵּר
  choice: declaraste
  rationale: Mantém o sentido de falar ou comunicar solenemente algo, com melhor fluidez em português diante do objeto “este bem”, sem explicitar “prometeste”.
- source_word: אֶל עַבְדְּךָ
  choice: ao teu servo
  rationale: É a forma natural para a autodesignação reverente de Davi diante de Deus; “escravo” enfatizaria indevidamente outro aspecto do termo.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: este bem
  rationale: Preserva a formulação ampla “esta coisa boa” em português mais idiomático, sem especificá-la como “promessa” ou “bênção”.
theological_decisions:
- issue: Representação do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: “Yahweh” representa explicitamente o nome divino, enquanto “Senhor” traduz o título אֲדֹנָי; a alternativa tradicional substitui o nome por um título.
- issue: Valor temporal e semântico de יִהְיוּ אֱמֶת
  choice: as tuas palavras são verdadeiras
  alternative: as tuas palavras serão verdadeiras
  rationale: O presente expressa a afirmação contextual da veracidade e confiabilidade permanentes da fala divina, sem negar o valor futuro formal, registrado em nota.
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “tu” adequado ao tom de oração. “Declaraste este bem” evita tanto a rigidez de “falaste esta boa coisa” como a interpretação adicional de “prometeste esta bênção”.
