base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: pt
  text: Pois não habitei numa casa desde o dia em que tirei os filhos de Israel[a] do Egito até hoje, mas tenho andado de um lado para outro numa tenda e num tabernáculo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”.'
    reason: lexical_alternative
  - marker: b
    text: “Tabernáculo” também pode ser traduzido por “morada”. O hebraico mantém os termos “tenda” e “tabernáculo/morada” lado a lado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: habitei
  rationale: No contexto de residência, ישׁב significa habitar ou morar. “Habitei” mantém um registro digno e combina naturalmente com a expressão temporal que se estende do êxodo até o presente narrativo.
- source_word: בְּבַיִת
  choice: numa casa
  rationale: O substantivo não é definido no hebraico. “Casa” traduz o sentido direto sem antecipar interpretativamente “templo”.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: desde o dia em que fiz ... saírem
  rationale: A expressão indica o ponto inicial no tempo. O hifil de עלה apresenta Deus como aquele que fez Israel subir/sair; em português, com o Egito como origem, “fiz ... saírem” comunica esse valor causativo com naturalidade.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma masculina plural construta do hebraico e a expressão bíblica reconhecível, sem impedir a leitura coletiva do povo israelita.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com “fiz ... saírem”, a preposição “de” expressa naturalmente a procedência e o movimento para fora do Egito.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: É a forma portuguesa corrente e concisa para o limite temporal que alcança o presente do discurso.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: mas tenho andado de um lado para outro
  rationale: O contraste com a residência fixa justifica “mas”. A construção verbal comunica movimento contínuo e itinerante; o pretérito perfeito composto preserva a duração até o presente narrativo.
- source_word: בְּאֹהֶל
  choice: numa tenda
  rationale: Traduz o substantivo indefinido em seu sentido básico e conserva a imagem de uma estrutura portátil.
- source_word: וּבְמִשְׁכָּן
  choice: e num tabernáculo
  rationale: “Tabernáculo” é o termo cultual estabelecido para משׁכן neste contexto, enquanto a forma indefinida e a coordenação com “tenda” refletem de perto o hebraico.
theological_decisions:
- issue: Forma coletiva e marcada por gênero de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução conserva a forma lexical do hebraico e sua expressão tradicional, enquanto a nota registra a alternativa coletiva idiomática sem decidir que o referente se limite aos homens.
- issue: Terminologia cultual de מִשְׁכָּן
  choice: tabernáculo
  alternative: morada
  rationale: O contexto trata do santuário portátil anterior ao templo. “Tabernáculo” preserva essa referência histórica e cultual, mas a nota reconhece o sentido lexical mais amplo de “morada”.
- issue: Relação entre אֹהֶל e מִשְׁכָּן
  choice: numa tenda e num tabernáculo
  alternative: em uma tenda como morada
  rationale: A tradução mantém os dois substantivos coordenados conforme a forma do texto massorético, sem fundi-los nem definir de modo excessivo a relação entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a sintaxe temporal, o contraste entre residência fixa e deslocamento e os dois termos do santuário portátil, evitando substituir “casa” por “templo”.
