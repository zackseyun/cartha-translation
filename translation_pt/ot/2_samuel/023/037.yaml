  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: pt
  text: Zeleque, o amonita; Naarai, o beerotita, que carregava as armas de Joabe, filho de Zeruia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto consonantal hebraico também pode ser entendido como “os que carregavam as armas de Joabe”; a leitura tradicional é singular.
