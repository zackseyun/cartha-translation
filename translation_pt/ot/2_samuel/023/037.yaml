lexical_decisions:
- source_word: צֶלֶק
  choice: Zeleque
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais em português.
- source_word: הָעַמֹּנִי
  choice: o amonita
  rationale: Gentílico consagrado em português, que identifica a origem étnica ou nacional de Zeleque.
- source_word: נַחְרַי
  choice: Naarai
  rationale: Forma portuguesa tradicional do nome próprio, refletindo de modo legível a vocalização hebraica.
- source_word: הַבְּאֵרֹתִי
  choice: o beerotita
  rationale: Gentílico conciso derivado de Beerote, adequado ao formato da lista.
- source_word: נשאי כְּלֵי
  choice: que carregava as armas
  rationale: Expressa diretamente a função militar indicada por נשׂא e pelo sentido de כְּלֵי no contexto, sem restringir os objetos apenas à armadura defensiva.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joabe, filho de Zeruia
  rationale: Mantém integralmente a identificação familiar e emprega as formas portuguesas tradicionais dos nomes.
