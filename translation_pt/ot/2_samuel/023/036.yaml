- source_word: מִצֹּבָה
  choice: de Zobá
  rationale: A preposição מִן pode indicar origem geográfica ou associação. Em português, «de Zobá» preserva naturalmente ambas as possibilidades.
- source_word: בָּנִי
  choice: Bani
  rationale: Transliteração direta do nome próprio hebraico.
- source_word: הַגָּדִי
  choice: o gadita
  rationale: O gentílico designa alguém pertencente à tribo ou ao território de Gade; «gadita» é a forma concisa e tradicional em português.
