  text: חצרו הַֽ/כַּרְמְלִ֔י פַּעֲרַ֖י הָ/אַרְבִּֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/035.yaml
  text: Hezro the Carmelite[a], Paarai the Arbite[c][b];
translation:
  language: pt
  text: Hezro, o carmelita[a]; Paarai, o arbita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «carmelita» significa um homem de Carmelo, não um membro da ordem religiosa carmelita, surgida muito mais tarde.
    reason: cultural_note
  - marker: b
    text: 'Ou: «o homem de Arab».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חצרו
  choice: Hezro
  rationale: Nome próprio em uma lista dos guerreiros de Davi; a forma tradicional portuguesa «Hezro» representa adequadamente o hebraico consonantal e preserva a identificação nominal.
- source_word: הַכַּרְמְלִי
  choice: o carmelita
  rationale: Gentílico definido que indica um homem procedente de Carmelo. A forma concisa mantém o estilo da lista; a nota evita a associação anacrônica com a ordem religiosa posterior.
- source_word: פַּעֲרַי
  choice: Paarai
  rationale: Transliteração do nome próprio conforme a vocalização massorética, preservando a sequência vocálica do hebraico.
- source_word: הָאַרְבִּי
  choice: o arbita
  rationale: Gentílico definido, provavelmente referente a alguém procedente de Arab. «Arbita» conserva a forma gentílica e o estilo sucinto do rol.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de uma lista de nomes. Os gentílicos foram mantidos em formas naturais em português, com esclarecimentos apenas onde há risco de anacronismo ou onde a origem geográfica pode ser expressa alternativamente.
