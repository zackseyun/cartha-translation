  - severity: low
    issue: “Aoí” é uma transliteração opaca e menos apropriada da designação אֲחֹחִי.
    rationale: A forma é normalmente entendida como gentílico; “aoíta” é natural em português e corresponde à alternativa já reconhecida no material de auditoria.
