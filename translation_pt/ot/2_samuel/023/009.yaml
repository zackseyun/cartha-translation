base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: pt
  text: Depois dele vinha Eleazar, filho de Dodô[a], filho de aoíta. Ele era um dos três guerreiros valentes que estavam com Davi quando desafiaram[b] os filisteus, que haviam se reunido ali para a batalha, e os homens de Israel subiram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filho de Dodai, filho de Aoí”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando insultaram” ou “quando provocaram”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e os homens de Israel subiram”; neste contexto, a expressão talvez signifique que eles se retiraram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Depois dele vinha
  rationale: Introduz o guerreiro seguinte na sequência; o verbo suprido torna natural em português a identificação sem verbo explícito no hebraico.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: filho de Dodô, filho de Aoí
  rationale: Segue o texto consonantal entendendo os termos como nomes ou designações ancestrais; a leitura alternativa como Dodai e gentílico é preservada em nota.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: um dos três guerreiros valentes
  rationale: Expressa com clareza a pertença de Eleazar ao trio e conserva o sentido militar e heroico de גברים no contexto.
- source_word: עִם דָּוִד
  choice: que estavam com Davi
  rationale: Comunica a associação e presença junto a Davi, ligando naturalmente a expressão ao grupo dos três.
- source_word: בְּ/חָֽרְפָם
  choice: quando desafiaram
  rationale: No contexto militar, חרף envolve afrontar, provocar ou desafiar o inimigo. “Desafiaram” é natural e digno em português, enquanto a nuance de insulto verbal é registrada em nota.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma portuguesa convencional do nome do povo.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: que haviam se reunido ali para a batalha
  rationale: Entende o nifal de אסף como reunião dos filisteus e usa o mais-que-perfeito composto para indicar a reunião anterior ao confronto.
- source_word: וַֽ/יַּעֲלוּ אִישׁ יִשְׂרָאֵל
  choice: e os homens de Israel tinham subido
  rationale: Mantém o sentido lexical mais direto de עלה e a relação temporal, sem resolver a possível referência contextual a uma retirada; essa possibilidade fica em nota.
