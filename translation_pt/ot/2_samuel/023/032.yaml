  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: pt
  text: Eliába, o saalbonita[a], os filhos de Jasém, Jônatas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico é conciso e difícil aqui; literalmente: “Eliába, o saalbonita, os filhos de Jasém, Jônatas”. Alguns intérpretes entendem que há uma irregularidade textual e reconstroem a lista de outra maneira, por exemplo, tomando “Jônatas” como um dos “filhos de Jasém”. Esta tradução preserva a redação hebraica transmitida, sem emendá-la.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Eliába
  rationale: Nome próprio transliterado de acordo com a forma hebraica, com acento gráfico para orientar a pronúncia em português.
- source_word: הַשַּׁעַלְבֹנִי
  choice: o saalbonita
  rationale: Gentílico com artigo, indicando um homem de Saalbom/Saalbim; a forma portuguesa preserva a ligação com o topônimo.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de 'filho'. Embora a sequência seja difícil por vir seguida do singular 'Jônatas', a tradução mantém transparentemente o plural do texto hebraico.
- source_word: יָשֵׁן
  choice: Jasém
  rationale: Tratado como nome próprio na construção 'filhos de Jasém', sem emenda do texto transmitido.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
