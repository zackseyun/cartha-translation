  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: pt
  text: Abisai[a], irmão de Joabe, filho de Zeruia, era o chefe dos Três. Ele brandiu sua lança contra trezentos e os matou[b], e tinha renome entre os Três.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chefe dos Três”. Alguns intérpretes, com base no paralelo de 1Crônicas 11:20 e na incerteza textual desta seção, entendem que o grupo era “os Trinta”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “levantou/brandiu sua lança contra trezentos mortos”. O hebraico é conciso; literalmente: “despertou/levantou sua lança contra trezentos mortos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: chefe dos Três
  rationale: רֹאשׁ significa “cabeça, chefe”. Apesar da dificuldade textual e da variante sugerida pelo paralelo de 1Crônicas 11:20, a forma massorética e בַּשְּׁלֹשָׁה no fim do versículo favorecem “os Três” no texto principal.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: brandiu sua lança
  rationale: O verbo עורר tem o sentido básico de despertar, incitar ou levantar; com “lança” como objeto em contexto militar, “brandiu” expressa de modo natural o uso ativo da arma.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contra trezentos e os matou
  rationale: חָלָל designa alguém traspassado ou morto. A formulação hebraica é condensada; a tradução explicita em português a consequência implícita, enquanto a nota preserva a literalidade e a alternativa lexical.
- source_word: וְלוֹ שֵׁם
  choice: e tinha renome
  rationale: A expressão literalmente diz “e para ele havia um nome”, idioma hebraico que indica fama ou reputação. “Tinha renome” é natural e preserva o sentido.
- source_word: בַּשְּׁלֹשָׁה
  choice: entre os Três
  rationale: A preposição בְּ com o numeral tem aqui valor relacional; “entre os Três” exprime a posição de Abisai em relação ao grupo de guerreiros de elite.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abisai ... Joabe ... Zeruia
  rationale: Os nomes pessoais seguem formas portuguesas bíblicas correntes e reconhecíveis.
theological_decisions:
- issue: Identidade do grupo de guerreiros
  choice: os Três
  alternative: os Trinta
  rationale: A tradução mantém a leitura do Texto Massorético no corpo do versículo, sem eliminar a incerteza textual evidenciada pelo paralelo e pelas versões antigas; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Brandiu” conserva a imagem militar sem soar excessivamente técnica; “tinha renome” traduz de maneira natural o idioma hebraico. A ambiguidade entre “os Três” e “os Trinta” é preservada em nota.
