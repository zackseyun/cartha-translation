- source_word: הַמַּעֲכָתִי
  choice: o maacatita
  rationale: Preserva o gentílico hebraico, que indica associação étnica ou regional com Maaca.
- source_word: אֱלִיעָם
  choice: Eliã
  rationale: Forma portuguesa tradicional do nome hebraico, com terminação nasal natural na língua-alvo.
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Transliteração portuguesa clara e tradicional do nome hebraico.
- source_word: הַגִּלֹנִי
  choice: o gilonita
  rationale: Mantém a forma gentílica do hebraico, em vez de explicitar interpretativamente 'de Gilo'.
