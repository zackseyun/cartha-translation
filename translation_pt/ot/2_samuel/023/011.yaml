  text: וְ/אַחֲרָ֛י/ו שַׁמָּ֥א בֶן אָגֵ֖א הָרָרִ֑י וַ/יֵּאָסְפ֨וּ פְלִשְׁתִּ֜ים לַ/חַיָּ֗ה וַ/תְּהִי שָׁ֞ם חֶלְקַ֤ת הַ/שָּׂדֶה֙ מְלֵאָ֣ה עֲדָשִׁ֔ים וְ/הָ/עָ֥ם נָ֖ס מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: pt
  text: Depois dele veio Samá, filho de Agé, o hararita. Os filisteus se reuniram para a batalha[a]. Havia ali uma parcela do campo cheia de lentilhas, e o povo fugiu diante dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico לַחַיָּה é difícil. Pode indicar que os filisteus se reuniram «em tropa» ou numa formação semelhante; alguns também o entendem como referência ao lugar chamado Leí. Aqui, o contexto militar e o paralelo de 1 Crônicas 11:13 favorecem «para a batalha».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Depois dele veio
  rationale: Expressa a sequência na lista dos guerreiros; o verbo «veio», implícito no enunciado nominal hebraico, torna a frase natural em português sem alterar o sentido.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Samá, filho de Agé, o hararita
  rationale: Translitera os nomes e conserva «hararita» como designação de origem ou clã, sem tentar identificar de modo incerto a sua procedência.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: Os filisteus se reuniram
  rationale: Verte de modo natural o valor reflexivo/passivo do verbo no contexto de uma concentração militar.
- source_word: לַחַיָּה
  choice: para a batalha
  rationale: A expressão hebraica é difícil. A leitura funcional se ajusta ao contexto militar e ao paralelo de 1 Crônicas 11:13, enquanto a nota preserva outras possibilidades.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: uma parcela do campo
  rationale: Conserva a imagem concreta de uma porção delimitada do campo e a relação entre os substantivos.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: cheia de lentilhas
  rationale: Segue diretamente o hebraico, sem explicitar que a parcela estava plantada, detalhe apenas implícito.
- source_word: וְהָעָם
  choice: e o povo
  rationale: Mantém o termo abrangente do hebraico sem especificá-lo como exército ou tropas.
- source_word: נָס מִפְּנֵי פְלִשְׁתִּים
  choice: fugiu diante dos filisteus
  rationale: Reproduz em português corrente o idioma hebraico de fugir da presença ou diante de alguém.
