  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: pt
  text: 'Davi sentiu um forte desejo e disse: “Quem me dará água para beber do poço de Belém, que fica junto ao portão?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: “Quem me dera beber água do poço de Belém, junto ao portão!” Em hebraico, a pergunta “Quem me dará...?” expressa um forte desejo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: sentiu um forte desejo
  rationale: O hitpael de אוה expressa desejo intenso ou anseio. A formulação é natural em português e mantém a força emocional sem acrescentar conteúdo.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: É o verbo hebraico comum para dizer; o texto não explicita que Davi falou consigo mesmo nem que exclamou.
- source_word: מִי
  choice: Quem me dará
  rationale: Preserva a forma interrogativa hebraica, que neste contexto funciona como expressão de desejo, e soa natural em português.
- source_word: יַשְׁקֵנִי
  choice: me dará água para beber
  rationale: O hiphil de שקה significa dar de beber ou fazer beber. Com מַיִם expresso em seguida, esta construção comunica com clareza o sentido causativo.
- source_word: מַיִם
  choice: água
  rationale: Correspondência lexical direta.
- source_word: מִבֹּאר
  choice: do poço
  rationale: בְּאֵר normalmente designa um poço, não uma cisterna, e esse sentido se ajusta ao contexto de Belém.
- source_word: בֵּית לֶחֶם
  choice: Belém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: que fica junto ao portão
  rationale: Identifica o poço situado nas proximidades do portão da cidade. “Junto ao portão” é claro e evita a impressão potencialmente enganosa de que o poço estivesse dentro dele.
