base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: pt
  text: Helebe, filho de Baaná, o netofatita; Itai, filho de Ribai, de Gibeá dos filhos de Benjamim[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Gibeá dos benjamitas”. O hebraico diz literalmente “de Gibeá dos filhos de Benjamim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: Helebe
  rationale: Transliteração portuguesa do nome próprio, com vogal final de apoio para tornar natural a leitura da consoante hebraica final.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto e natural do marcador de filiação nesta lista de nomes.
- source_word: בַּעֲנָה
  choice: Baaná
  rationale: Transliteração legível em português, com acento gráfico para indicar a tonicidade final.
- source_word: הַנְּטֹפָתִי
  choice: o netofatita
  rationale: Gentílico que indica origem ou associação com Netofá; a forma tradicional é concisa e adequada à lista militar.
- source_word: אִתַּי
  choice: Itai
  rationale: Transliteração corrente e legível do nome próprio em português.
- source_word: רִיבַי
  choice: Ribai
  rationale: Transliteração direta do nome próprio hebraico.
- source_word: מִגִּבְעַת
  choice: de Gibeá
  rationale: A preposição מִן indica procedência; “de Gibeá” expressa naturalmente essa origem.
- source_word: בְּנֵי בִנְיָמִן
  choice: dos filhos de Benjamim
  rationale: Mantém a expressão hebraica literalmente, sem eliminar sua possível referência tribal; a forma mais idiomática aparece em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pontuação própria de uma lista de guerreiros. A formulação literal “filhos de Benjamim” foi preservada no texto, enquanto a equivalência tribal mais natural foi registrada em nota.
