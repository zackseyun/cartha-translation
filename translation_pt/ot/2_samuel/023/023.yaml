  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: pt
  text: Era honrado entre os trinta[a], mas não alcançou os três[b]. Davi o designou para o seu encargo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Era mais honrado do que os trinta”. A construção hebraica também pode ter sentido comparativo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não chegou aos três”, isto é, não alcançou a posição dos três guerreiros de maior destaque.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “para o seu encargo”. A expressão pode significar “para o seu comando” ou “sobre sua guarda”; “guarda pessoal” é um sentido militar possível neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים נִכְבָּד
  choice: Era honrado entre os trinta
  rationale: Preserva o valor passivo de נִכְבָּד e entende מִן como relação com o grupo, sem eliminar a possível leitura comparativa, registrada em nota.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: mas não chegou à posição dos três
  rationale: Expressa em português natural o uso idiomático de בוא אֶל para alcançar determinada categoria ou posição, mantendo a referência ao grupo de elite conhecido como “os três”.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: Davi o colocou no comando
  rationale: Neste contexto administrativo-militar, שׂים indica designação para uma função; “colocou no comando” é natural e não exige acrescentar o verbo técnico “nomear”.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: no comando de sua guarda pessoal
  rationale: מִשְׁמַעַת pode indicar comando, incumbência ou o grupo sujeito à autoridade de alguém. No contexto da corte militar de Davi, “guarda pessoal” é uma interpretação contextual plausível, explicitada em nota.
