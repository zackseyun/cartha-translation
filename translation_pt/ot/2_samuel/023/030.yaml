lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaia
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: פִּרְעָתֹנִי
  choice: o piratonita
  rationale: Adjetivo gentílico que indica a procedência de Piratom; a forma portuguesa em “-ita” é natural e concisa.
- source_word: הִדַּי
  choice: Hidai
  rationale: Transliteração do nome conforme o Texto Massorético de Samuel, sem substituí-lo pela variante da passagem paralela.
- source_word: מִנַּחֲלֵי
  choice: dos uádis de
  rationale: נחל designa frequentemente um vale ou leito de torrente, em geral sazonal; “uádis” preserva com precisão esse sentido geográfico.
- source_word: גָעַשׁ
  choice: Gaás
  rationale: Transliteração portuguesa do topônimo hebraico, com acento para orientar a pronúncia.
