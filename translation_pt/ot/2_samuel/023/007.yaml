translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. A metáfora dos espinhos e a imprecisão deliberada de “ferro” foram preservadas; as dificuldades idiomáticas e textuais foram registradas em notas.
