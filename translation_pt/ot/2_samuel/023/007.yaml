  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: pt
  text: Mas quem tocar neles[a] terá de estar munido de ferro e da haste de uma lança[b]; e eles serão completamente queimados no fogo, ali mesmo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Neles” se refere aos homens comparados a espinhos no versículo anterior.
    reason: cross_reference
  - marker: b
    text: 'Ou: “terá de se equipar com ferro e com a haste de uma lança”. Literalmente: “estará cheio de ferro e de madeira de uma lança”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “serão certamente queimados no fogo no próprio lugar”. O hebraico enfatiza o ato de queimar; a expressão final também pode ser traduzida por “no lugar onde estão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִגַּע בָּהֶם
  choice: Mas quem tocar neles
  rationale: A conjunção inicial introduz um contraste com a descrição anterior. A construção com אִישׁ é genérica, e “quem” soa natural em português sem perder esse sentido. נגע é vertido pelo sentido direto de “tocar”.
- source_word: יִמָּלֵא בַרְזֶל
  choice: terá de estar munido de ferro
  rationale: O nifal de מלא significa literalmente “estar cheio”, mas, com os instrumentos que seguem, comunica estar equipado ou protegido. “Estar munido” preserva a imagem sem especificar um instrumento de ferro que o hebraico não nomeia.
- source_word: וְעֵץ חֲנִית
  choice: e do cabo de uma lança
  rationale: A expressão literal é “madeira de uma lança” e designa naturalmente sua haste ou cabo. “Cabo” é claro e corrente em português.
- source_word: וּבָאֵשׁ
  choice: no fogo
  rationale: A preposição ב pode indicar meio ou esfera. “No fogo” é idiomático no contexto da queima dos espinhos.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: serão completamente queimados
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “completamente” transmite essa ênfase em português atual.
- source_word: בַּשָּׁבֶת
  choice: ali mesmo
  rationale: A forma rara é geralmente entendida em sentido local, “no lugar” ou “no próprio local”. “Ali mesmo” comunica que os espinhos são queimados onde estão, enquanto a nota registra a tradução mais literal.
