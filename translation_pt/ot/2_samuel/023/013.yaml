  source_fidelity: 'A tradução preserva adequadamente a sequência narrativa e os principais valores do hebraico: “desceram”, a circunstância temporal da colheita, a chegada a Davi e à caverna de Adulão, e o acampamento filisteu no vale de Refaim. A formulação difícil referente aos “trinta” é mantida sem harmonização indevida com a passagem paralela, e a nota registra apropriadamente a incerteza.'
