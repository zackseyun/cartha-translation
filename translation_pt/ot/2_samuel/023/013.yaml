  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: pt
  text: Então trinta dos trinta principais[a] desceram e, no tempo da colheita[b], chegaram até Davi, na caverna de Adulão, enquanto um destacamento filisteu[c] estava acampado no vale de Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “trinta dos trinta, principais”. A expressão é difícil. Pode significar “trinta dos principais” ou referir-se mais especificamente a integrantes dos “Trinta”, o grupo de guerreiros de elite de Davi.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “durante a colheita”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico חַיַּת פְּלִשְׁתִּים significa literalmente “ser vivo/animal dos filisteus”, mas aqui é empregado de modo idiomático para um destacamento ou tropa militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva o sentido direcional comum de ירד e mantém a sequência narrativa de modo natural.
- source_word: שְׁלֹשִׁים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: trinta dos trinta principais
  rationale: Conserva a repetição e a dificuldade da expressão hebraica, sem substituir o numeral apresentado no texto-fonte por uma conjectura mais harmoniosa.
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: Expressa naturalmente a chegada ao destino introduzido pelas sucessivas ocorrências de אֶל.
- source_word: אֶל קָצִיר
  choice: no tempo da colheita
  rationale: Entende a expressão literalmente direcional como uso temporal idiomático, adequado ao contexto.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: até Davi, na caverna de Adulão
  rationale: Apresenta Davi como o destino e a caverna de Adulão como o lugar em que ele se encontrava, em português claro e sem acrescentar a ideia explícita de encontro.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: um destacamento filisteu
  rationale: O substantivo, embora literalmente relacionado a um ser vivo ou animal, tem aqui valor militar idiomático; 'destacamento' comunica um grupo de tropas sem sugerir um exército inteiro.
- source_word: חֹנָה
  choice: estava acampado
  rationale: A forma participial descreve uma situação contínua de fundo.
- source_word: בְּעֵמֶק רְפָאִים
  choice: no vale de Refaim
  rationale: Mantém o topônimo hebraico por transliteração em forma corrente em português.
