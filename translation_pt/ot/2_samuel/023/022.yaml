  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: pt
  text: Esses feitos realizou Benaia, filho de Joiada, e ele tinha renome[a] entre os três guerreiros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «e ele tinha um nome», expressão hebraica que indica renome ou reputação.
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes, considerando a lista mais ampla dos guerreiros de Davi e leituras comparáveis, entendem «os trinta»; o texto hebraico aqui diz «os três».
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Esses feitos realizou
  rationale: O demonstrativo retoma as façanhas narradas anteriormente. “Esses feitos realizou” comunica essa função retrospectiva com clareza e conserva a ênfase inicial do hebraico.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Translitera os nomes pessoais em formas correntes em português e expressa naturalmente a relação de filiação.
- source_word: וְלוֹ שֵׁם
  choice: e ele conquistou renome
  rationale: A construção literal “e para ele [havia] nome” é um idioma que indica reputação ou fama. “Conquistou renome” soa natural no contexto das façanhas, sem apagar a expressão literal, registrada em nota.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: entre os três guerreiros
  rationale: Segue o texto hebraico massorético, que diz “três”. “Guerreiros” comunica de modo atual e digno o sentido contextual de גִּבֹּרִים como combatentes de elite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Esses feitos realizou” preserva a retomada enfática do hebraico sem soar excessivamente arcaica. Os marcadores aparecem no texto e as notas mantêm tanto o idioma hebraico quanto a questão textual.
