  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: pt
  text: O Espírito de Yahweh falou por meu intermédio[a], e a sua palavra estava sobre a minha língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou por mim”. A preposição hebraica pode indicar aqui o meio ou instrumento da fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: O Espírito de Yahweh
  rationale: Neste contexto de fala profética, רוּחַ designa o Espírito como agente da revelação, não vento ou sopro. O nome divino יְהוָה é transliterado como Yahweh.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta a fala divina como acontecimento declarado no testemunho poético de Davi; o pretérito perfeito é natural e fiel em português.
- source_word: בִּי
  choice: por meu intermédio
  rationale: A preposição בְּ pode indicar aqui o agente intermediário ou instrumento da fala. Esta formulação comunica com clareza que Yahweh falou mediante Davi, preservando na nota a alternativa mais concisa.
- source_word: וּמִלָּתוֹ
  choice: e a sua palavra
  rationale: מִלָּה significa palavra ou declaração; “palavra” mantém tanto a imagem lexical quanto o peso da fala divina.
- source_word: עַל לְשׁוֹנִי
  choice: estava na minha língua
  rationale: Reproduz de modo natural a imagem hebraica de a palavra estar sobre/na língua do falante, sem substituí-la pela expressão mais livre “na minha boca”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome divino presente no hebraico, em vez de substituí-lo por um título.
- issue: Sentido de רוּחַ neste contexto
  choice: Espírito
  alternative: sopro; vento
  rationale: A agência na fala profética favorece “Espírito”. A escolha não exige definir além do que o versículo afirma a relação entre o Espírito e Yahweh.
- issue: Valor de בִּי na mediação profética
  choice: por meu intermédio
  alternative: por mim; em mim
  rationale: O paralelismo com a palavra divina na língua de Davi favorece o sentido instrumental ou mediador, embora a preposição hebraica isoladamente também possa ter valor locativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por meu intermédio” torna explícita, sem parafrasear excessivamente, a função instrumental de בִּי; a nota registra a forma mais literal e concisa.
