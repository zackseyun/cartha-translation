  source_fidelity: 'A tradução reproduz adequadamente a estrutura e o sentido central do hebraico: o Espírito de Yahweh é o agente da fala, בִּי expressa a mediação de Davi, e a palavra de Yahweh é associada à língua do falante. Contudo, «na minha língua» em português tende a significar “no meu idioma”, não “sobre o órgão da fala”, e também suaviza a preposição עַל (“sobre”).'
  naturalness: «O Espírito de Yahweh falou por meu intermédio» é claro, digno e natural. «Estava sobre a minha língua» preserva a imagem concreta do hebraico e evita a ambiguidade moderna de «na minha língua».
  terminology: «Espírito», «Yahweh» e «palavra» são escolhas consistentes com o contexto profético e com as decisões fornecidas. «Por meu intermédio» comunica adequadamente a mediação instrumental sem impor uma formulação doutrinária adicional.
