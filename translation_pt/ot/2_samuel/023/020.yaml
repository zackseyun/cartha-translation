translation_notes:
  register: Português moderno, claro e solene, com nomes próprios em formas bíblicas correntes. A sintaxe conserva a cadeia genealógica do hebraico e a incerteza lexical de אֲרִאֵל; “ele também” evita uma coordenação pesada sem alterar a sequência narrativa.
