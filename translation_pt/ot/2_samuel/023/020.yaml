base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: pt
  text: Benaia, filho de Joiada, filho de um homem valente, de grandes feitos, natural de Cabzeel, abateu os dois arieis[a] de Moabe. Ele também desceu e abateu o leão no meio da cova, num dia de neve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do termo hebraico אֲרִאֵל (ariel) é incerto aqui. Pode referir-se a homens semelhantes a leões, a heróis, ou ser um título ou nome; por isso, o texto preserva a forma “arieis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: um homem valente
  rationale: A expressão descreve vigor e valentia no contexto da lista de guerreiros; uma tradução meramente literal como “homem vivo” seria enganosa em português.
- source_word: רַב פְּעָלִים
  choice: de grandes feitos
  rationale: Expressa notoriedade por ações ou façanhas marcantes, em linguagem natural e digna.
- source_word: מִקַּבְצְאֵל
  choice: natural de Cabzeel
  rationale: O prefixo מִן indica procedência; “natural de” comunica com clareza a origem geográfica.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: os dois arieis de Moabe
  rationale: אֲרִאֵל é incerto neste contexto. A transliteração adaptada “arieis” conserva a ambiguidade sem impor “heróis”, “homens semelhantes a leões” ou “filhos de Ariel”.
- source_word: הִכָּה
  choice: abateu
  rationale: No relato de façanhas marciais, o verbo indica derrubar ou matar. “Abateu” preserva a ação violenta sem recorrer a linguagem arcaica.
- source_word: יָרַד
  choice: desceu
  rationale: Tradução direta e natural do verbo narrativo, mantendo o movimento para o interior ou fundo da cova.
- source_word: הָאֲרִי
  choice: um leão
  rationale: O substantivo designa claramente um leão; em português, a primeira menção narrativa pede naturalmente o artigo indefinido.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: dentro de uma cova
  rationale: בּוֹר pode indicar cova, poço ou cisterna. “Cova” preserva o sentido amplo do local escavado sem especificar uma função não declarada.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: num dia de neve
  rationale: Forma idiomática em português que conserva a circunstância temporal de um dia marcado pela neve.
