- source_word: שָׁרָר
  choice: Sarar
  rationale: Nome próprio transliterado em forma adequada ao português.
- source_word: הָאֲרָרִי
  choice: o ararita
  rationale: A forma consonantal do texto aponta para «ararita», distinta de «hararita»; a diferença foi preservada, sem harmonização com a designação anterior.
