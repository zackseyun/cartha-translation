  text: Zalmon the Ahohite[a], Maharai the Netophathite;
translation:
  language: pt
  text: Zalmon, o aoíta[a]; Maarai, o netofatita;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas traduções, Zalmon aparece como “Salmon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמוֹן
  choice: Zalmon
  rationale: Nome próprio transliterado de modo próximo à forma consonantal hebraica; em português, também ocorre a variante tradicional “Salmon”.
- source_word: הָאֲחֹחִי
  choice: o aoíta
  rationale: Gentílico com artigo, provavelmente uma designação de clã. “Aoíta” mantém a forma concisa e típica de uma lista, sem explicitar de maneira interpretativa uma descendência de Aoá.
- source_word: מַהְרַי
  choice: Maarai
  rationale: Transliteração portuguesa do nome próprio hebraico, representando a sequência consonantal e evitando a grafia inglesa “Maharai”.
- source_word: הַנְּטֹפָתִי
  choice: o netofatita
  rationale: Gentílico com artigo que indica origem ou associação com Netofá; a forma gentílica preserva o estilo compacto da lista hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a estrutura nominal concisa própria da lista de guerreiros. Os gentílicos foram mantidos como títulos de identificação, e o sinal de fim de seção massorético não foi traduzido.
