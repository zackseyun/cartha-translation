source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: pt
  text: 'Estas são as últimas palavras de Davi:


    “Oráculo de Davi, filho de Jessé;[a]


    oráculo do homem elevado às alturas,


    do ungido do Deus de Jacó,[b]


    e do suave cantor dos cânticos de Israel.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Declaração” ou “Pronunciamento”. O termo hebraico introduz uma declaração solene, muitas vezes de caráter profético.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o ungido do Deus de Jacó”. Aqui a expressão se refere diretamente a Davi, embora também tenha ressonância régia e messiânica.'
    reason: theological_tension
  - marker: c
    text: A expressão hebraica é compacta e também pode ser entendida como “o suave cantor de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי ... הָאַחֲרֹנִים
  choice: últimas palavras
  rationale: Traduz diretamente a expressão hebraica e apresenta o dito como a declaração final de Davi.
- source_word: נְאֻם
  choice: declaração
  rationale: Em português corrente, “declaração” comunica com clareza a fórmula solene que introduz um pronunciamento autorizado; a nota preserva as alternativas “oráculo” e “pronunciamento”.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Mantém o sentido básico do substantivo sem acrescentar “guerreiro” ou “valente”, conotações possíveis mas não exigidas neste contexto.
- source_word: הֻקַם עָל
  choice: foi elevado
  rationale: Expressa a forma passiva e a ideia de elevação ou exaltação, sem especificar indevidamente o agente ou o modo.
- source_word: מְשִׁיחַ
  choice: o ungido
  rationale: Refere-se diretamente a Davi como rei ungido por Deus, preservando ao mesmo tempo a ressonância régia e messiânica do termo.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: o agradável cantor dos cânticos de Israel
  rationale: Torna natural em português a expressão poética compacta. “Agradável” representa נְעִים, e “cânticos de Israel” mantém explícito o substantivo זְמִרוֹת.
theological_decisions:
- issue: Se מְשִׁיחַ deve ser vertido como título messiânico
  choice: o ungido
  alternative: o Messias
  rationale: O referente imediato é Davi, o rei ungido pelo Deus de Jacó. “O ungido” conserva esse sentido histórico e a possível ressonância messiânica sem identificar explicitamente Davi com o Messias no texto principal.
- issue: Como entender a elevação expressa por הֻקַם עָל
  choice: foi elevado
  alternative: foi exaltado nas alturas
  rationale: A formulação escolhida preserva a passividade e a imagem de elevação sem decidir se a frase enfatiza posição política, honra divina ou ambas.
translation_notes:
  register: Português moderno, claro e solene, com estrutura poética em linhas para refletir o caráter oracular do texto. Evita arcaísmos e mantém os nomes nas formas portuguesas consagradas, “Davi”, “Jessé” e “Jacó”.
