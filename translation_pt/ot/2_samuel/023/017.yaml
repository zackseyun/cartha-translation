base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: pt
  text: 'E ele disse: “Longe de mim, ó Yahweh, fazer isso! Acaso eu beberia o sangue dos homens que foram com a vida em risco[a]?” Por isso, não quis beber aquela água[b]. Foi isso que fizeram os três guerreiros valentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “com suas vidas”; isto é, expondo-se a perigo de morte.
    reason: lexical_alternative
  - marker: b
    text: O hebraico tem literalmente “não quis bebê-los”, com sufixo masculino plural; no contexto, provavelmente se refere às águas, pois “água” é plural em hebraico. Davi a tratou como se fosse o sangue deles, pois arriscaram a vida para obtê-la.
    reason: referent_clarification
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Longe de mim, ó Yahweh
  rationale: A expressão idiomática comunica forte repulsa pessoal, e a forma vocativa preserva a invocação direta do nome divino.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: fazer tal coisa
  rationale: Expressa de modo natural a rejeição enfática do ato que Davi acaba de considerar.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Acaso eu beberia o sangue dos homens
  rationale: Mantém a pergunta retórica e explicita, pela forma verbal exigida em português, que Davi considera beber a água equivalente a beber o sangue deles.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: que foram arriscando a própria vida
  rationale: O sentido idiomático é o de se expor a perigo mortal; o singular distributivo 'a própria vida' é natural em português.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Por isso, não quis beber aquela água
  rationale: אָבָה indica disposição ou consentimento. 'Não quis' é corrente e fiel; 'aquela água' torna claro o referente do sufixo, cujo sentido contextual é singular coletivo.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: Foi isso que fizeram os três guerreiros valentes
  rationale: Preserva o resumo enfático da façanha e traduz גִּבֹּרִים segundo o contexto militar, em linguagem portuguesa natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome divino, não um título; a transliteração 'Yahweh' preserva essa distinção sem substituí-lo por 'Senhor'.
- issue: A água tratada como sangue
  choice: 'Pergunta retórica: “Acaso eu beberia o sangue dos homens...?”'
  alternative: “Não é este o sangue dos homens...?”
  rationale: A construção hebraica é condensada e permite a formulação tradicional nominal. A tradução escolhida comunica que, para Davi, beber a água equivaleria moralmente a beber o sangue dos homens, sem afirmar que a água se transformou literalmente em sangue.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita arcaísmos como 'Deus me livre' neste contexto solene, conserva o nome Yahweh e mantém a força da pergunta retórica.
