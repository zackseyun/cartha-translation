lexical_decisions:
- source_word: אָז
  choice: então ... então
  rationale: O advérbio ocorre duas vezes e estabelece a simultaneidade temporal das duas situações. A repetição foi mantida porque é clara em português e preserva a ênfase do hebraico.
- source_word: מְצוּדָה
  choice: fortaleza
  rationale: Expressa um lugar defensável ou refúgio fortificado sem especificar além do que o contexto permite.
- source_word: מַצַּב
  choice: guarnição
  rationale: No contexto militar, designa adequadamente o contingente ou posto estabelecido pelos filisteus em Belém.
- source_word: פְּלִשְׁתִּים
  choice: filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para esse povo.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: וְ
  choice: e
  rationale: Preserva de modo natural a coordenação direta entre as duas orações.
