source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: pt
  text: 'O Deus de Israel disse; a Rocha de Israel me falou: “Quem governa a humanidade com justiça, governando no temor de Deus[a][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso e também pode ser traduzido: “um governante justo, que governa a humanidade no temor de Deus”.'
    reason: alternative_reading
  - marker: b
    text: A declaração pode ser lida como um princípio sobre o rei ideal e também, em sentido messiânico, como uma descrição que encontra seu cumprimento pleno no Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: disse
  rationale: O perfeito hebraico introduz a declaração divina. O pretérito perfeito é natural em português no contexto das palavras que Deus comunicou a Davi.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão em estado construto identifica o Deus de Israel; o artigo é exigido pelo uso natural do português.
- source_word: לִי דִבֶּר
  choice: me falou
  rationale: לִי é entendido como objeto indireto, indicando que a fala foi dirigida a Davi. A formulação preserva o paralelismo com “disse” sem se tornar rígida.
- source_word: צוּר יִשְׂרָאֵל
  choice: a Rocha de Israel
  rationale: Mantém o título metafórico divino צוּר, que comunica firmeza, estabilidade e proteção sem o substituir por uma explicação.
- source_word: מוֹשֵׁל בָּאָדָם
  choice: quem governa a humanidade
  rationale: O particípio tem força geral, e אָדָם designa coletivamente os seres humanos. “Quem governa” expressa bem a máxima sobre o governante ideal.
- source_word: צַדִּיק
  choice: com justiça
  rationale: Embora formalmente seja um adjetivo, no verso poético comprimido qualifica o modo de governar. “Com justiça” é idiomático e mantém a noção de retidão.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: governando no temor de Deus
  rationale: A repetição do particípio é preservada por “governando”. “No temor de Deus” comunica reverência e responsabilidade diante de Deus sem reduzir o temor a mero medo.
theological_decisions:
- issue: Leitura régia geral ou messiânica
  choice: O texto principal apresenta uma descrição geral do governante justo, sem identificar explicitamente o Messias.
  alternative: A descrição pode ser entendida tipológica ou messianicamente como referente último ao Messias.
  rationale: O hebraico descreve o governo ideal, mas não nomeia aqui uma figura específica. A nota conserva a possível dimensão messiânica sem impô-la à formulação principal.
- issue: Relação sintática de צַדִּיק com מוֹשֵׁל
  choice: 'Entender צַדִּיק adverbialmente: o governante governa “com justiça”.'
  alternative: 'Entender צַדִּיק como predicativo ou qualificativo: “um governante justo”.'
  rationale: A poesia hebraica é extremamente concisa e permite ambas as maneiras de articular a ideia. A opção principal é mais natural em português e se ajusta ao paralelismo verbal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Humanidade” evita o uso potencialmente ambíguo de “homem” como coletivo. O paralelismo entre “disse” e “me falou” e a metáfora “Rocha de Israel” foram preservados. A vírgula final mantém a continuidade sintática e poética com o versículo seguinte.
