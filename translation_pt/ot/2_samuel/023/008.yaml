  naturalness: O registro é moderno e apropriado, e as transliterações são consistentes. A sequência “Josebe-Bassebete, taquemonita” fica mais natural com artigo (“um taquemonita”). A expressão “enfrentou oitocentos homens mortos” precisa ser corrigida, pois sugere combate contra cadáveres.
  terminology: “Guerreiros”, “Davi”, “Três”, “Trinta”, “Adino” e “eznita” são escolhas adequadas. “Taquemonita” é uma transliteração defensável; acrescentar “um” esclarece que se trata de uma designação gentilícia/patronímica.
