base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: pt
  text: 'Estes são os nomes dos guerreiros que pertenciam a Davi: Josebe-Bassebete[a], um taquemonita, chefe dos Três[b]. Ele era Adino, o eznita[c], que matou oitocentos homens numa só ocasião.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico deste versículo é difícil. “Josebe-Bassebete” segue o Texto Massorético; o trecho paralelo em 1 Crônicas 11:11 traz “Jasobeão, hacmonita”.
    reason: textual_variant
  - marker: b
    text: Ou “chefe dos Trinta”, segundo alguns testemunhos antigos e intérpretes; o Texto Massorético vocalizado traz “chefe dos Três”.
    reason: alternative_reading
  - marker: c
    text: Em hebraico, “Adino, o eznita”, expressão muito difícil. Muitos a entendem, em vez disso, como algo semelhante a “ele empunhou sua lança” ou “ele brandiu sua lança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: os guerreiros
  rationale: No contexto da lista militar, גִּבּוֹרִים designa homens valentes e poderosos em combate. “Guerreiros” comunica esse sentido de modo natural no português atual.
- source_word: אֲשֶׁר לְדָוִד
  choice: que pertenciam a Davi
  rationale: O lamed indica associação ou pertencimento ao grupo de Davi, sem necessariamente expressar propriedade pessoal.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Josebe-Bassebete
  rationale: A forma difícil do Texto Massorético é preservada como nome próprio transliterado, sem harmonização silenciosa com 1 Crônicas 11:11.
- source_word: תַּחְכְּמֹנִי
  choice: taquemonita
  rationale: Transliteração portuguesa da designação gentílica ou patronímica presente no texto de Samuel.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: chefe dos Três
  rationale: Segue a vocalização massorética e se ajusta ao grupo de guerreiros de elite; a leitura alternativa é indicada em nota.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino, o eznita
  rationale: A expressão é extremamente obscura. Sua leitura como nome e designação preserva o texto massorético, enquanto a possível interpretação verbal é registrada em nota.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: enfrentou oitocentos homens mortos
  rationale: עַל indica aqui ação hostil, e חָלָל se refere aos mortos em combate. A formulação conserva a sintaxe difícil e a relação entre o guerreiro e as vítimas.
- source_word: בְּפַעַם אֶחָד
  choice: numa só ocasião
  rationale: A expressão indica um único episódio ou confronto.
- source_word: הוּא
  choice: Ele era
  rationale: O pronome independente introduz enfaticamente a identificação seguinte e permite uma frase clara em português.
