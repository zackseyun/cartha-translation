  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: pt
  text: Mas ele tomou posição no meio da parcela de terra, defendeu-a e abateu os filisteus; e Yahweh trouxe uma grande vitória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande livramento” ou “uma grande salvação”. O termo hebraico pode ter qualquer um desses sentidos; aqui, refere-se à ação salvadora de Yahweh na batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: tomou posição
  rationale: O hitpael de יצב indica que ele deliberadamente se colocou e se manteve em posição; a expressão é natural em contexto de combate.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: no meio do campo
  rationale: חֶלְקָה designa uma parcela ou porção de terra. “Campo” é claro no contexto narrativo, e “no meio” traduz בְּתוֹךְ de modo idiomático.
- source_word: וַיַּצִּילֶהָ
  choice: defendeu-o
  rationale: נצל significa salvar, livrar ou resgatar. Aqui, o sufixo retoma a porção de terra; “defendeu-o” comunica que ele impediu que o campo caísse nas mãos do inimigo.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: derrubou os filisteus
  rationale: Em contexto militar, נכה frequentemente significa golpear ou abater. “Derrubou” preserva a força da ação sem reduzi-la à ideia mais geral de derrota.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahweh realizou
  rationale: עשה com o substantivo abstrato תְּשׁוּעָה expressa produzir ou efetuar algo; “realizou” conserva de modo natural a agência divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio, em vez de ser substituído por um título.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: uma grande vitória
  rationale: תְּשׁוּעָה pode denotar salvação, livramento ou vitória. No contexto imediato de batalha, “vitória” expressa com clareza o resultado concreto da ação salvadora de Deus, enquanto a nota preserva a amplitude lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva sua função como nome pessoal sem substituí-lo por um título.
- issue: Sentido de תְּשׁוּעָה no contexto militar
  choice: vitória
  alternative: livramento; salvação
  rationale: “Vitória” é o sentido contextual mais imediato, mas a nota registra os demais sentidos legítimos e mantém explícito que se trata da ação salvadora de Yahweh.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal acompanha o ritmo conciso da narrativa hebraica; o ponto e vírgula destaca a atribuição final e decisiva da vitória a Yahweh.
