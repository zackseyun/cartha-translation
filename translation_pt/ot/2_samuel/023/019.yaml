base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: pt
  text: Não era ele mais honrado que os três?[a] E tornou-se o comandante deles; contudo, não chegou a igualar-se aos três.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não era ele honrado entre os três?» O hebraico também pode ser entendido com sentido menos comparativo, embora a leitura «mais honrado que os três» se ajuste melhor à sintaxe e ao paralelo no contexto.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, ele não alcançou a categoria ou posição dos «três», o grupo de mais alta distinção entre os guerreiros de Davi.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: dos três
  rationale: Com נִכְבָּד, a preposição מִן tem valor comparativo. Em português, a construção superlativa relativa «o mais honrado dos três» expressa naturalmente essa comparação, sem sugerir mera inclusão no grupo.
- source_word: הֲכִי
  choice: Não era ele
  rationale: A combinação interrogativa introduz uma pergunta retórica que espera resposta afirmativa; «Não era ele...?» reproduz essa força em português corrente.
- source_word: נִכְבָּד
  choice: o mais honrado
  rationale: O nifal de כבד indica alguém honrado ou tido em elevada estima. A formulação comunica a comparação de posição presente no hebraico.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: Por isso, tornou-se o comandante deles
  rationale: שַׂר designa chefe ou comandante; no contexto militar, «comandante» é claro e natural. «Por isso» explicita de modo moderado a sequência resultante do wayyiqtol.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: contudo, não chegou a igualar-se aos três
  rationale: A expressão idiomática significa que ele não alcançou a posição ou categoria dos três, e não que deixou de chegar fisicamente até eles. «Igualar-se» torna clara a comparação de patente ou prestígio.
