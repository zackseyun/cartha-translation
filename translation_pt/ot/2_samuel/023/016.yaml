revisions:
- from: Então os três guerreiros valentes abriram caminho pelo acampamento dos filisteus, tiraram água do poço de Belém, que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas ele não quis bebê-la; em vez disso, derramou-a diante do SENHOR.[a]
  to: Então os três guerreiros valentes romperam pelo acampamento dos filisteus, tiraram água do poço de Belém, que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas ele não quis bebê-la; em vez disso, derramou-a ao SENHOR.[a]
  rationale: A revisão substitui uma formulação locativa por «ao SENHOR», que reflete a direção/dedicação expressa por לַיהוָה, e reforça o sentido de ruptura militar de וַיִּבְקְעוּ. O singular feminino em português continua a referir-se naturalmente à água, apesar dos sufixos plurais hebraicos associados a «águas».
