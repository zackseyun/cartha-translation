source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: pt
  text: Então os três guerreiros valentes romperam pelo acampamento dos filisteus, tiraram água do poço de Belém, que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas ele não quis bebê-la; em vez disso, derramou-a ao SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode indicar um derramamento com sentido de oferta ou libação ao SENHOR.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: abriram caminho pelo
  rationale: Expressa a ação militar de romper e atravessar uma posição inimiga, em português natural.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: os três guerreiros valentes
  rationale: Preserva tanto o caráter militar quanto a distinção desses combatentes de elite de Davi.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: pelo acampamento dos filisteus
  rationale: A preposição e o contexto indicam penetração e passagem pelo acampamento inimigo.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: tiraram água
  rationale: É uma formulação corrente e clara para retirar água de um poço.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: do poço de Belém, que ficava junto ao portão
  rationale: Identifica o poço associado a Belém e traduz a localização junto à porta urbana com linguagem acessível.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: carregaram-na e a levaram a Davi
  rationale: Mantém as duas ações sucessivas do hebraico e explicita naturalmente que o objeto é a água.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: ele não quis bebê-la
  rationale: אָבָה enfatiza vontade ou consentimento. O singular feminino concorda naturalmente com 'água', embora o hebraico use sufixo plural.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: derramou-a
  rationale: Conserva a ação concreta sem impor no texto principal uma classificação ritual específica; a construção com o nome divino comunica a dedicação.
- source_word: לַיהוָה
  choice: diante do SENHOR
  rationale: A formulação portuguesa comunica que o derramamento foi um ato dirigido e dedicado ao SENHOR, sem sugerir que o líquido tenha sido literalmente vertido sobre ele.
theological_decisions:
- issue: Natureza do ato de Davi ao derramar a água
  choice: Um derramamento dedicado ao SENHOR, com possível força de libação
  alternative: Uma simples rejeição simbólica da água, sem significado ritual
  rationale: נסך tem associações cultuais, e לַיהוָה apresenta o ato como dirigido ao SENHOR. O texto principal mantém a ação concreta, enquanto a nota registra a possível nuance de oferta sem a transformar numa categoria ritual inequívoca.
- issue: Número gramatical do objeto de beber e derramar
  choice: Singular em português, referindo-se à água
  alternative: 'Plural literal: ''bebê-las'' e ''derramou-as'''
  rationale: O hebraico usa sufixos plurais, provavelmente em concordância com מַיִם, palavra morfologicamente plural. Em português, 'água' é naturalmente singular; reproduzir o plural criaria uma estranheza sem valor semântico equivalente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Guerreiros valentes' evita o arcaísmo de 'valentes' como substantivo isolado. 'SENHOR' representa o nome divino יהוה segundo a convenção editorial.
