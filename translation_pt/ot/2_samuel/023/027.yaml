  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: הָעַנְּתֹתִי
  choice: de Anatote
  rationale: O gentílico hebraico indica procedência ou vínculo com Anatote; em português corrente, a locução de origem é mais clara e natural do que um gentílico raro.
- source_word: מְבֻנַּי
  choice: Mebunai
  rationale: Nome próprio transliterado diretamente, com grafia adequada ao português.
- source_word: הַחֻשָׁתִי
  choice: de Husa
  rationale: O gentílico hebraico indica procedência ou associação com Husa; a locução preserva o sentido sem criar um gentílico português pouco transparente.
