  text: וּ/בְלִיַּ֕עַל כְּ/ק֥וֹץ מֻנָ֖ד כֻּלָּ֑/הַם כִּֽי לֹ֥א בְ/יָ֖ד יִקָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: pt
  text: Mas todos os perversos são como espinhos lançados fora[a], pois não podem ser apanhados com a mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “perversos” provavelmente se refere aqui a pessoas perversas ou sem valor, e não ao nome próprio posterior “Belial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: Mas todos os perversos
  rationale: Aqui, בְּלִיַּעַל designa pessoas perversas ou sem valor, e não o nome próprio posterior “Belial”. “Perversos” comunica naturalmente a referência pessoal plural, explicitada por כֻּלָּהֶם.
- source_word: כְּקוֹץ
  choice: como espinhos
  rationale: Embora קוֹץ esteja no singular, tem sentido coletivo na comparação com o referente plural; “espinhos” é idiomático em português e preserva a imagem.
- source_word: מֻנָד
  choice: lançados fora
  rationale: O particípio passivo expressa algo afastado, repelido ou descartado. “Lançados fora” se ajusta à imagem dos espinhos e mantém a força verbal sem explicar além do texto.
- source_word: כֻּלָּהֶם
  choice: todos
  rationale: Preserva a abrangência distributiva do hebraico e concorda com a referência pessoal plural.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da comparação no segundo membro do verso.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: não podem ser apanhados com a mão
  rationale: Expressa a impossibilidade prática de segurar ou recolher diretamente tais espinhos. A formulação passiva preserva a construção hebraica e soa natural em português.
theological_decisions:
- issue: Sentido de בְּלִיַּעַל
  choice: termo descritivo para pessoas perversas
  alternative: nome próprio “Belial”
  rationale: Neste contexto, o termo hebraico funciona como caracterização moral de pessoas, não como referência inequívoca a uma figura personificada posterior.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. A ordem foi levemente ajustada para naturalidade, sem eliminar a comparação nem a relação causal entre os dois membros.
