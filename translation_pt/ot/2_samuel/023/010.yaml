base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: pt
  text: Ele se levantou e feriu os filisteus até que sua mão se cansou e se apegou à espada. Naquele dia, Yahweh deu uma grande vitória[a], e o povo voltou atrás dele somente para despojar os mortos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande livramento” ou “uma grande salvação”. O termo hebraico pode indicar resgate em sentido amplo; aqui se refere ao livramento decisivo concedido por Yahweh na batalha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “somente para despojar”, isto é, retirar dos caídos as armas e os bens depois da batalha.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: se levantou
  rationale: Expressa a ação decidida de entrar ou permanecer no combate, sem acrescentar detalhes ausentes do hebraico.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: feriu os filisteus
  rationale: Em contexto militar, נכה indica golpear e pode implicar matar; “feriu” preserva a formulação concisa sem explicitar além do texto.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: até que sua mão se cansou
  rationale: יגע comunica cansaço ou exaustão; a formulação é natural e mantém a mão como sujeito da oração.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: sua mão ... se apegou à espada
  rationale: דבק significa aderir, agarrar-se ou ficar preso. “Apegou-se” conserva a imagem vívida e sua possível ambiguidade, sem impor uma explicação médica.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh realizou uma grande vitória
  rationale: Com תְּשׁוּעָה como objeto, עשה descreve a produção ou realização do livramento; “realizou” é idiomático e mantém explícita a ação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: uma grande vitória
  rationale: No contexto imediato de batalha, “vitória” comunica o resultado militar concreto, enquanto a nota preserva os sentidos mais amplos de livramento e salvação.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: o povo voltou após ele
  rationale: Mantém a sequência e a expressão espacial do hebraico sem acrescentar que se tratava especificamente de tropas.
- source_word: אַךְ לְפַשֵּׁט
  choice: somente para despojar os mortos
  rationale: פשט, neste cenário, refere-se a retirar dos caídos armas, armaduras e outros despojos; “somente” representa a força restritiva de אַךְ.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de תְּשׁוּעָה no relato de batalha
  choice: vitória
  alternative: livramento; salvação
  rationale: “Vitória” se ajusta ao resultado militar imediato, mas a nota registra a amplitude semântica do termo e preserva sua ressonância teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem incomum da mão que se apega à espada foi mantida para preservar a vivacidade e a ambiguidade do hebraico. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
