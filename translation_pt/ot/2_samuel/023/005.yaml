  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: pt
  text: Pois a minha casa não é assim com Deus[a]; pois ele estabeleceu comigo uma aliança eterna, ordenada em tudo e preservada. Pois toda a minha salvação e todo o meu desejo — não fará ele isso brotar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não é assim a minha casa com Deus?” Muitos entendem a abertura como uma pergunta retórica positiva, em vez de uma declaração negativa.'
    reason: alternative_reading
  - marker: b
    text: 'A oração final é difícil no hebraico. Também pode ser entendida como uma forte afirmação: “pois ele certamente fará isso brotar” ou “florescer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois / contudo
  rationale: As ocorrências de כִּי cumprem funções discursivas diferentes. A primeira introduz uma explicação ligada ao oráculo anterior; no segundo período, o contexto pede em português uma transição adversativa que expresse a tensão entre a casa de Davi e a aliança estabelecida por Deus.
- source_word: לֹא כֵן בֵּיתִי
  choice: a minha casa não é assim
  rationale: Mantém a negação e a expressão relativamente aberta do hebraico. “Casa” conserva tanto o sentido doméstico quanto o dinástico, sem escolher silenciosamente apenas um deles.
- source_word: עִם אֵל
  choice: com Deus
  rationale: Reproduz o sentido relacional mais direto de עִם e evita uma paráfrase interpretativa como “diante de Deus”.
- source_word: בְרִית עוֹלָם
  choice: uma aliança eterna
  rationale: Expressão clara e corrente em português para uma aliança de duração permanente.
- source_word: שָׂם לִי
  choice: estabeleceu comigo
  rationale: Embora o verbo tenha o sentido básico de pôr ou colocar, no contexto de aliança “estabeleceu comigo” comunica com naturalidade a ação sem perder a relação indicada por לִי.
- source_word: עֲרוּכָה בַכֹּל
  choice: ordenada em tudo
  rationale: Preserva a ideia de algo disposto ou organizado de modo completo, com formulação concisa e digna.
- source_word: וּשְׁמֻרָה
  choice: e bem guardada
  rationale: 'Expressa o valor passivo e resultativo: a aliança está protegida e preservada. “Bem” torna natural em português a ideia de segurança, sem acrescentar uma garantia alheia ao termo.'
- source_word: כָל יִשְׁעִי
  choice: toda a minha salvação
  rationale: “Salvação” mantém a amplitude de יֵשַׁע, que pode incluir livramento, segurança e bem-estar concedidos por Deus.
- source_word: וְכָל חֵפֶץ
  choice: e todo o meu desejo
  rationale: “Desejo” representa o campo semântico de חֵפֶץ e preserva seu paralelismo com “salvação”, sem restringi-lo a prazer ou deleite.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: não fará ele tudo isso florescer?
  rationale: A pergunta retórica preserva לֹא e comunica a provável força afirmativa do contexto. “Fazer florescer” expressa o causativo de צמח; “tudo isso” retoma de modo legível a salvação e o desejo, embora o objeto permaneça implícito no hebraico.
theological_decisions:
- issue: Sentido da oração inicial כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Declaração negativa: “a minha casa não é assim com Deus”'
  alternative: 'Pergunta retórica positiva: “Não é assim a minha casa com Deus?”'
  rationale: O texto massorético vocalizado apresenta uma negação direta, embora a relação com a afirmação seguinte torne a frase difícil. A tradução principal conserva essa tensão e registra em nota a leitura positiva tradicional, sem harmonizar o texto por decisão teológica.
- issue: Força da oração final כִּי לֹא יַצְמִיחַ
  choice: Pergunta retórica com sentido afirmativo
  alternative: Afirmação direta, “pois ele certamente fará florescer”, ou declaração negativa, “pois ele não fará florescer”
  rationale: A sintaxe é comprimida e admite debate. A pergunta retórica mantém formalmente a negação e se ajusta à confiança expressa na aliança, sem transformar a construção ambígua em uma afirmação categórica no texto principal.
- issue: Referente implícito de יַצְמִיחַ
  choice: Retomada abrangente por “tudo isso”
  alternative: Referência exclusiva à salvação, ao desejo, à aliança ou à casa de Davi
  rationale: O hebraico não declara o objeto. A retomada neutra inclui os elementos imediatamente anteriores e evita identificar de forma exclusiva aquilo que Deus fará florescer.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Conserva “casa”, “aliança” e “salvação” por sua amplitude bíblica; evita terminologia denominacional. A construção inicial permanece deliberadamente tensa, enquanto as notas apresentam as alternativas textualmente plausíveis.
