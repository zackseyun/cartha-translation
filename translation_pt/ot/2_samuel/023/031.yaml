lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: Abi-Albom
  rationale: Nome próprio transliterado, com hífen para representar os dois elementos e facilitar a leitura em português; a forma aglutinada também é possível.
- source_word: הָעַרְבָתִי
  choice: o arbatita
  rationale: Gentílico com artigo, provavelmente ligado a um lugar chamado Arbá ou à Arabá; conserva-se como designação geográfica transliterada sem decidir uma identificação incerta.
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: Nome próprio transliterado em forma natural para leitores de português, sem traduzir seu possível significado etimológico.
- source_word: הַבַּרְחֻמִי
  choice: o barumita
  rationale: Gentílico com artigo, transliterado de acordo com a forma vocalizada do Texto Massorético; preserva-se em nota a possível relação com Baurim.
