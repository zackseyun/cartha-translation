  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: pt
  text: Ele é como a luz da manhã, quando o sol nasce[a], uma manhã sem nuvens; ao resplendor depois da chuva[b], a relva brota da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e como a luz da manhã”. A linha hebraica é elíptica e continua a descrição do governante no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do resplendor, da chuva, relva da terra” — imagem poética condensada da vegetação que surge após a chuva. A relação exata entre as expressões permanece ambígua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: Ele é como a luz
  rationale: A conjunção e a partícula comparativa introduzem uma comparação que continua a descrição do governante justo no versículo anterior. O pronome e o verbo são explicitados em português para tornar natural a construção nominal e elíptica do hebraico.
- source_word: בֹּקֶר
  choice: manhã
  rationale: “Manhã” é a correspondência comum e preserva a repetição poética nas duas ocorrências.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: quando o sol nasce
  rationale: O verbo descreve o sol irrompendo em luz ou surgindo; esta formulação comunica naturalmente ambos os aspectos no contexto.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: uma manhã sem nuvens
  rationale: Mantém a imagem hebraica e emprega uma construção clara e poética em português atual.
- source_word: מִנֹּגַהּ
  choice: ao resplendor
  rationale: נֹגַהּ indica brilho ou resplendor. A preposição hebraica é poeticamente comprimida; “ao” expressa a circunstância sob a qual o crescimento se torna visível, sem tratar a relação como inequivocamente causal.
- source_word: מִמָּטָר
  choice: depois da chuva
  rationale: Embora a forma preposicional seja literalmente “da chuva”, no quadro poético ela pode indicar a condição subsequente à chuva. A nota conserva a formulação literal e a ambiguidade da relação.
- source_word: דֶּשֶׁא
  choice: relva
  rationale: O termo designa vegetação verde e recém-brotada. “Relva” é conciso, digno e mais específico do que o genérico “vegetação”.
- source_word: מֵאָרֶץ
  choice: da terra
  rationale: Preserva a imagem da vegetação que surge do solo e a ressonância poética de אֶרֶץ.
theological_decisions:
- issue: Sujeito implícito da comparação
  choice: Explicitar “Ele é”, retomando o governante justo do versículo 3.
  alternative: 'Manter o fragmento impessoal: “E como a luz da manhã...”'
  rationale: O hebraico é elíptico, mas o contexto imediato fornece o referente. A explicitação torna a frase inteligível em português sem acrescentar uma identificação teológica além do contexto.
- issue: Relação entre resplendor, chuva e crescimento
  choice: Apresentar o resplendor posterior à chuva como o cenário em que a relva brota.
  alternative: 'Reproduzir literalmente: “do resplendor, da chuva, relva da terra”.'
  rationale: As preposições e a sintaxe do último segmento são muito condensadas. O texto principal comunica a imagem natural, enquanto a nota registra a forma literal e evita transformar uma relação poética ambígua em afirmação teológica ou causal rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A repetição de “manhã” e as imagens de luz, chuva e crescimento foram preservadas; a compressão extrema do último segmento foi esclarecida no texto e documentada em nota.
