lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asael
  rationale: Representa o nome próprio עֲשָׂהאֵל na forma consagrada e natural em português; a separação gráfica no texto massorético não indica dois nomes.
- source_word: אֲחִי יוֹאָב
  choice: irmão de Joabe
  rationale: Reproduz diretamente a relação familiar expressa pela cadeia construta hebraica.
- source_word: בַּשְּׁלֹשִׁים
  choice: estava entre os Trinta
  rationale: O בְּ indica inclusão no grupo definido dos guerreiros de Davi. O verbo “estava” é suprido em português para formar uma frase natural, sem alterar o sentido nominal do hebraico.
- source_word: אֶלְחָנָן
  choice: Elanã
  rationale: Forma portuguesa clara e convencional do nome próprio hebraico.
- source_word: בֶּן דֹּדֹו
  choice: filho de Dodô
  rationale: Segue a leitura massorética דֹּדֹו como nome próprio, sem harmonizá-la com a forma paralela de 1Crônicas 11:26.
- source_word: בֵּית לָחֶם
  choice: de Belém
  rationale: Expressa de modo transparente a procedência geográfica indicada pelo nome do lugar em aposição.
