  yaml_path: translation/ot/2_samuel/023/024.yaml
  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: pt
  text: Asael, irmão de Joabe, estava entre os Trinta; Elanã, filho de Dodô[a], de Belém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Dodô”; o texto paralelo em 1Crônicas 11:26 traz “Dodai”.'
