base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: pt
  text: Ele também golpeou um egípcio[a], um homem de aparência impressionante. O egípcio tinha uma lança na mão, e ele desceu até ele com um bastão[b], arrancou-lhe a lança da mão e o matou com a própria lança do egípcio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem bonito” ou “um homem de aparência notável”. A expressão hebraica se refere de modo amplo à aparência do egípcio; alguns, à luz do paralelo em 1 Crônicas 11:23, entendem que ela sugere uma estatura incomum.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma clava” ou “uma vara”. O termo hebraico שֵׁבֶט pode designar um bastão, uma vara, um cetro ou uma clava, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: abateu
  rationale: Neste contexto marcial, נכה indica atingir ou derrubar. “Abateu” funciona como resumo da façanha sem substituir a declaração explícita posterior de que ele matou o egípcio.
- source_word: אִישׁ מִצְרִי
  choice: um egípcio
  rationale: Expressão natural em português que comunica integralmente a identificação étnica do homem.
- source_word: אשר מַרְאֶה
  choice: um homem de aparência impressionante
  rationale: A expressão hebraica é elíptica e se refere de modo amplo ao aspecto visível. A tradução evita restringi-la indevidamente à beleza ou à grande estatura.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: O egípcio tinha uma lança na mão
  rationale: Formulação portuguesa natural para a construção possessiva, preservando a imagem concreta do texto.
- source_word: וַיֵּרֶד אֵלָיו
  choice: desceu contra o egípcio
  rationale: Mantém o sentido básico de ירד, “descer”, enquanto “contra” expressa naturalmente o movimento de confronto indicado pelo contexto.
- source_word: בַּשָּׁבֶט
  choice: levando apenas um bastão
  rationale: שֵׁבֶט pode designar bastão, vara, cetro ou clava. “Bastão” é amplo e concreto; “apenas” torna natural em português o contraste contextual com a lança, sem alterar o objeto mencionado.
- source_word: וַיִּגְזֹל
  choice: arrancou-lhe
  rationale: גזל descreve tomar à força. “Arrancou-lhe” comunica de maneira vívida e idiomática a retirada violenta da lança da mão do adversário.
- source_word: וַיַּהַרְגֵהוּ
  choice: o matou
  rationale: Tradução direta, clara e moderna do verbo הרג.
- source_word: בַּחֲנִיתוֹ
  choice: com a própria lança dele
  rationale: O sufixo remete mais naturalmente ao egípcio, de quem a lança acabara de ser tomada. A formulação explicita o referente e preserva a inversão dramática.
- source_word: וְהוּא
  choice: Ele também
  rationale: Transmite naturalmente a continuação aditiva da lista de feitos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação hebraica foi preservada sem introduzir um contraste explícito por meio de “mas”. Os marcadores [a] e [b] aparecem junto às expressões que esclarecem.
