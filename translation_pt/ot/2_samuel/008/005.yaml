  text: וַ/תָּבֹא֙ אֲרַ֣ם דַּמֶּ֔שֶׂק לַ/עְזֹ֕ר לַ/הֲדַדְעֶ֖זֶר מֶ֣לֶךְ צוֹבָ֑ה וַ/יַּ֤ךְ דָּוִד֙ בַּֽ/אֲרָ֔ם עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: pt
  text: Os arameus de Damasco vieram ajudar Hadadezer, rei de Zobá[b], e Davi matou vinte e dois mil homens de Arã[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz Arã, nome do povo e dos reinos arameus, em vez da designação tradicional “Síria”.
    reason: lexical_alternative
  - marker: b
    text: Hadadezer também aparece com a forma Hadarezer em algumas passagens e traduções.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: vieram
  rationale: O wayyiqtol de בוא dá sequência à narrativa. O plural concorda naturalmente em português com a explicitação coletiva “os arameus”.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: os arameus de Damasco
  rationale: A expressão designa o povo ou reino arameu sediado em Damasco. Esta forma é clara em português e evita o anacrônico “Síria”.
- source_word: לַעְזֹר
  choice: ajudar
  rationale: Tradução direta e corrente de עזר.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Transliteração do nome conforme a forma consonantal presente neste versículo; a variante Hadarezer é registrada em nota.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Reprodução natural da cadeia construta, em aposição ao nome próprio.
- source_word: וַיַּךְ
  choice: matou
  rationale: No contexto militar, נכה seguido da contagem de homens indica que foram abatidos. “Matou” comunica isso com clareza, sem acrescentar que todos fossem formalmente soldados.
- source_word: בַּאֲרָם
  choice: homens de Arã
  rationale: A preposição com נכה marca o grupo atingido; associada a אִישׁ, a construção portuguesa “homens de Arã” preserva de modo conciso o nome coletivo/político hebraico.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: vinte e dois mil homens
  rationale: Mantém tanto o número exato quanto אִישׁ, sem substituir interpretativamente “homens” por “soldados”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Os arameus de Damasco” explicita o referente coletivo na primeira oração, enquanto “Arã” na segunda conserva mais diretamente a formulação hebraica e é esclarecido em nota.
