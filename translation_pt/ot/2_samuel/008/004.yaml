base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: pt
  text: Davi capturou dele 1.700 cavaleiros e 20.000 soldados de infantaria.[a] Depois, Davi cortou os tendões de todos os cavalos dos carros de guerra,[b] mas deixou o suficiente para cem carros de guerra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico de Samuel diz “1.700 cavaleiros”. O texto paralelo de 1 Crônicas 18:4 diz “7.000 cavaleiros”.
    reason: textual_variant
  - marker: b
    text: 'Hebraico: “toda a força de carros”. O sentido contextual é que Davi incapacitou os cavalos que puxavam os carros.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “mas deixou cavalos suficientes para cem carros de guerra”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: capturou
  rationale: O verbo לכד descreve captura ou tomada em contexto militar; “capturou” é direto e natural em português.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: O sufixo hebraico é singular e retoma o rei derrotado, Hadadezer.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1.700 cavaleiros
  rationale: פָּרָשִׁים designa cavaleiros ou tropas de cavalaria. Mantém-se o número do texto massorético de Samuel.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20.000 soldados de infantaria
  rationale: A expressão literalmente se refere a homens a pé; a formulação escolhida comunica com clareza seu sentido militar.
- source_word: וַיְעַקֵּר
  choice: cortou os tendões
  rationale: Neste contexto, עקר indica incapacitar cavalos mediante o corte dos tendões. A expressão é mais clara em português atual do que um termo técnico raro.
- source_word: אֶת כָּל הָרֶכֶב
  choice: todos os cavalos dos carros de guerra
  rationale: Embora רֶכֶב possa significar “carros” ou “força de carros”, o verbo exige aqui, por metonímia, os cavalos que puxavam os carros.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: mas deixou o suficiente para cem carros
  rationale: יתר no hifil significa deixar de sobra ou reservar. A formulação preserva a referência elíptica do hebraico e expressa naturalmente a quantidade necessária para cem carros.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário militar claro. “Carros de guerra” evita que “carros” seja entendido como automóveis; na última oração, a forma abreviada “cem carros” é suficiente pelo contexto imediato.
