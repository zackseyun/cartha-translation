  terminology: “Cavaleiros”, “soldados de infantaria”, “cavalos dos carros de guerra” e “cortou os tendões” são escolhas compreensíveis e fiéis ao contexto militar. “Cortou os tendões” comunica o sentido de incapacitar os cavalos, sem recorrer a termo técnico arcaico.
