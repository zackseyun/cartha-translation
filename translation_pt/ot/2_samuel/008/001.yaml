base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: pt
  text: Depois disso, Davi feriu os filisteus e os subjugou. Davi tomou Metegue-Amá[a] da mão dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, «a rédea da cidade-mãe», expressão de sentido incerto. Pode referir-se, de modo figurado, ao controle da cidade principal. Compare 1 Crônicas 18:1, que traz «Gate e as cidades que dependiam dela».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: A expressão introduz a sequência temporal da narrativa. “Depois disso” é natural em português e evita a formulação excessivamente literal “e aconteceu depois disso”.
- source_word: וַיַּךְ
  choice: feriu
  rationale: נכה significa literalmente “ferir, golpear” e, em contexto militar, pode implicar derrota. “Feriu” preserva a força concreta do verbo sem antecipar o resultado expresso pelo verbo seguinte.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse povo.
- source_word: וַיַּכְנִיעֵם
  choice: os subjugou
  rationale: No hifil, כנע indica sujeitar ou pôr sob domínio. “Subjugou” comunica de modo conciso o resultado militar e político.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: לקח é o verbo comum para “tomar”. A opção ampla evita decidir antecipadamente se o objeto é um lugar, um título político ou uma expressão idiomática.
- source_word: מֶתֶג הָאַמָּה
  choice: Metegue-Amá
  rationale: A expressão hebraica é difícil e pode ser entendida literalmente como “a rédea da cidade-mãe”, talvez uma referência idiomática ao controle da cidade principal. A transliteração preserva a incerteza no texto principal, enquanto a nota apresenta o sentido literal e o paralelo de 1Crônicas 18:1.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Mantém o idioma hebraico de posse ou controle e continua claro e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “Davi” foi mantida, mas a longa coordenação hebraica foi dividida em duas frases para maior naturalidade. A expressão obscura מֶתֶג הָאַמָּה foi transliterada e explicada em nota, sem resolver indevidamente sua ambiguidade.
