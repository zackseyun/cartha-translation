base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: pt
  text: Davi ganhou fama quando voltou de derrotar Arã no vale do Sal — dezoito mil homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos e o texto paralelo de 1 Crônicas 18:12 indicam “Edom” em vez de “Arã”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד שֵׁם
  choice: Davi ganhou fama
  rationale: A expressão idiomática significa adquirir renome. Em português atual, “ganhou fama” comunica o sentido com naturalidade, sem sugerir que Davi criou literalmente um nome.
- source_word: בְּשֻׁבוֹ
  choice: quando voltou
  rationale: A preposição com o infinitivo construto e sufixo tem valor temporal; esta formulação é clara e natural.
- source_word: מֵהַכּוֹתוֹ
  choice: de derrotar
  rationale: A construção indica a ação da qual Davi retornou. “Derrotar” expressa adequadamente o sentido militar de נכה neste contexto sem especificar além do texto como ocorreu a derrota.
- source_word: אֶת אֲרָם
  choice: Arã
  rationale: Segue o nome próprio presente no texto massorético, usando a forma portuguesa tradicional, em vez do termo geopolítico posterior “Síria”.
- source_word: בְּגֵיא מֶלַח
  choice: no vale do Sal
  rationale: Traduz diretamente o topônimo hebraico com formulação geográfica natural em português.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dezoito mil homens
  rationale: O hebraico registra apenas o número; “homens” explicita o referente humano naturalmente subentendido no contexto militar.
theological_decisions:
- issue: Identidade do inimigo derrotado
  choice: Arã no texto principal
  alternative: Edom
  rationale: O texto massorético de 2 Samuel 8:13 traz “Arã”, enquanto outros testemunhos e o paralelo de 1 Crônicas 18:12 favorecem “Edom”. A tradução mantém a leitura da fonte hebraica indicada e registra a variante significativa em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão hebraica idiomática foi vertida pelo sentido natural em português, e a variante textual foi preservada em nota.
