  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: pt
  text: Ele golpeou Moabe e mediu os moabitas com uma corda[a], fazendo-os deitar no chão. Mediu duas extensões de corda para matar e uma extensão inteira de corda para deixar vivos. Assim, os moabitas se tornaram servos de Davi[b], levando-lhe tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um cordão” ou “com uma linha de medir”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico descreve Davi medindo os moabitas enquanto estavam deitados no chão: duas porções medidas foram destinadas à morte, e uma porção completa para serem poupados. Isso indica que alguns foram executados e outros, poupados.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ele atacou
  rationale: נכה significa literalmente golpear e, em contexto militar, atacar ou derrotar. “Atacou” conserva a ação militar sem tornar explícita uma derrota completa além do que o verbo isoladamente afirma.
- source_word: מוֹאָב
  choice: Moabe / os moabitas
  rationale: “Moabe” é a forma portuguesa tradicional do nome. Na retomada pelo sufixo plural e na descrição das pessoas deitadas no chão, “os moabitas” torna claro o referente coletivo.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: e mediu os moabitas com uma corda
  rationale: Preserva tanto o verbo concreto “medir” como o instrumento חבל, uma corda ou linha usada para medir.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: fazendo-os deitar no chão
  rationale: Expressa naturalmente o valor causativo da construção e mantém a descrição concreta do procedimento.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים
  choice: Mediu duas extensões de corda
  rationale: “Extensões de corda” comunica porções medidas segundo a corda, sem afirmar necessariamente que havia duas cordas distintas.
- source_word: לְהָמִית
  choice: para a morte
  rationale: Mantém a formulação abrupta e a antítese do hebraico, sem suavizar a execução dos grupos medidos.
- source_word: וּמְלֹא הַחֶבֶל
  choice: e uma extensão inteira de corda
  rationale: מְלֹא indica a medida cheia ou completa da corda. O artigo indefinido explicita com naturalidade uma porção completa em contraste com as duas anteriores.
- source_word: לְהַחֲיוֹת
  choice: para manter com vida
  rationale: O hifil de חיה significa conservar vivo ou deixar viver. A tradução mantém o contraste com a morte e expressa que esse grupo foi poupado.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: Assim, os moabitas se tornaram servos de Davi
  rationale: A construção descreve submissão política. “Servos” traduz diretamente עֲבָדִים sem impor a categoria social mais específica de escravos.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: levando-lhe tributo
  rationale: Neste contexto régio e político, מִנְחָה é tributo. O pronome “lhe” deixa claro que o tributo era levado a Davi.
theological_decisions:
- issue: Natureza do tratamento dado por Davi aos moabitas na fórmula de medição
  choice: Conservar a imagem concreta da medição e a distribuição entre morte e vida.
  alternative: Transformar a imagem em uma declaração geral de submissão ou declarar diretamente que dois terços foram mortos e um terço foi poupado.
  rationale: O hebraico descreve um procedimento severo, mas não formula a proporção como frações. A tradução mantém a tensão e a brutalidade do relato sem suavizá-lo nem explicá-lo além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva a concisão e a dureza do hebraico, esclarecendo apenas que o coletivo “Moabe” se refere aos moabitas.
