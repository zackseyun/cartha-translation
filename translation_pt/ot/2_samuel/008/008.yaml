base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: pt
  text: E de Betá[a] e de Berotai[b], cidades de Hadadezer, o rei Davi tomou uma quantidade muito grande de bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O relato paralelo em 1 Crônicas 18:8 chama este lugar de Tibate; o texto hebraico deste versículo traz Betá.
    reason: cross_reference
  - marker: b
    text: O mesmo relato paralelo chama o segundo lugar de Cum. Outra forma relacionada deste nome é Berotá.
    reason: lexical_alternative
  - marker: c
    text: Ou “cobre”; o termo hebraico pode designar cobre ou bronze, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: E de Betá
  rationale: Traduz diretamente a conjunção e a preposição e translitera o topônimo conforme a forma do texto hebraico deste versículo.
- source_word: וּמִבֵּרֹתַי
  choice: e de Berotai
  rationale: Mantém o mesmo padrão preposicional e translitera o topônimo conforme a forma hebraica massorética.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: cidades de Hadadezer
  rationale: A cadeia construta indica cidades pertencentes a Hadadezer ou sob seu domínio; “cidades” é a equivalência normal e adequada ao contexto.
- source_word: לָקַח
  choice: tomou
  rationale: Preserva o sentido básico e amplo do verbo, sem especificar além do texto se o foco recai sobre captura militar, confisco ou retirada de despojos.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma idiomática e dignificada em português para o título seguido do nome próprio.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode designar cobre ou bronze; “bronze” é adequado ao contexto histórico e ao uso posterior desse metal mencionado no relato paralelo, sem ocultar a alternativa lexical.
- source_word: הַרְבֵּה מְאֹד
  choice: muitíssimo
  rationale: Reproduz de modo conciso e enfático a grande quantidade expressa pela combinação hebraica.
