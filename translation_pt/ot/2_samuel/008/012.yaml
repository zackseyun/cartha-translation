base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: pt
  text: de Arã,[a] de Moabe, dos amonitas,[b] dos filisteus, de Amaleque e dos despojos de Hadadezer,[c] filho de Reobe, rei de Zobá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Arã, tradicionalmente traduzido por “Síria”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “dos filhos de Amom”.
    reason: lexical_alternative
  - marker: c
    text: Em algumas passagens, o nome aparece com a grafia “Hadarezer”.
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: de Arã
  rationale: Preserva o nome hebraico da região e do povo, em vez de substituí-lo pelo nome geopolítico posterior, Síria.
- source_word: וּמִמּוֹאָב
  choice: de Moabe
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome próprio da nação e do território.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: dos amonitas
  rationale: A expressão hebraica significa literalmente “dos filhos de Amom”; “dos amonitas” comunica naturalmente o referente étnico e nacional em português.
- source_word: וּמִפְּלִשְׁתִּים
  choice: dos filisteus
  rationale: Usa a forma portuguesa corrente do gentílico.
- source_word: וּמֵעֲמָלֵק
  choice: de Amaleque
  rationale: Mantém o nome próprio usado no hebraico, sem convertê-lo silenciosamente no gentílico “amalequitas”.
- source_word: וּמִשְּׁלַל
  choice: e dos despojos
  rationale: No contexto militar, שָׁלָל designa bens tomados na guerra; “despojos” é claro, digno e idiomático.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: A transliteração acompanha a forma consonantal deste versículo; a grafia alternativa é registrada em nota.
- source_word: בֶּן רְחֹב
  choice: filho de Reobe
  rationale: Traduz de modo direto e transparente a construção filial hebraica.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Conserva o título real e translitera o topônimo em forma natural para leitores de português.
