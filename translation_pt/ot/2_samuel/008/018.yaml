  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: pt
  text: Benaia, filho de Joiada, comandava os queretitas e os peletitas; e os filhos de Davi eram sacerdotes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ministros principais” ou “oficiais da corte”. A palavra hebraica é o termo usual para “sacerdotes”, mas alguns a entendem aqui em sentido mais amplo, ligado à corte, porque o contexto trata da administração real.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Os nomes são transliterados segundo formas portuguesas bíblicas correntes, preservando sua identificação e oferecendo leitura natural.
- source_word: וְהַכְּרֵתִי
  choice: os queretitas
  rationale: Designação de grupo transliterada diretamente do hebraico, sem definir de modo indevido sua identidade étnica ou militar.
- source_word: וְהַפְּלֵתִי
  choice: os peletitas
  rationale: Designação de grupo que forma par com “queretitas”; a transliteração conserva o termo da fonte sem interpretação excessiva.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Benaia ... comandava os queretitas e os peletitas
  rationale: A oração nominal hebraica omite uma expressão explícita de autoridade, mas o contexto da lista administrativa e o paralelo de 2 Samuel 20:23 sustentam a formulação natural “comandava”.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Este é o sentido lexical normal do termo hebraico. Embora o contexto permita a interpretação funcional “ministros principais” ou “oficiais da corte”, a tradução mantém no texto a tensão genuína da fonte e registra a alternativa em nota.
- source_word: הָיוּ
  choice: eram
  rationale: O perfeito qal de היה funciona aqui como cópula comum; “eram” reproduz a predicação sem acrescentar a nuance interpretativa de “serviam como”.
theological_decisions:
- issue: Os filhos de Davi são chamados כֹּהֲנִים
  choice: Manter “sacerdotes” no texto principal.
  alternative: “ministros principais” ou “oficiais da corte”
  rationale: O termo hebraico normalmente significa “sacerdotes”, ainda que isso crie tensão com as disposições sacerdotais e com a linhagem dos filhos de Davi. A tradução não resolve silenciosamente essa tensão; a possível acepção cortesã é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação esclarece as duas funções administrativas enumeradas. Os gentílicos seguem formas transparentes e correntes em português; a nota preserva a ambiguidade contextual sem enfraquecer o sentido lexical primário.
