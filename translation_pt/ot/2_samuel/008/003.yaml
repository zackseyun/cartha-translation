  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: pt
  text: Davi derrotou Hadadezer, filho de Reobe[a], rei de Zobá, quando ele foi restabelecer seu domínio[b] junto ao rio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Hadadezer”; algumas tradições textuais e o relato paralelo em 1 Crônicas trazem “Hadarezer”.'
    reason: textual_variant
  - marker: b
    text: Ou “restabelecer seu poder” ou “recuperar seu controle”; literalmente, “fazer sua mão voltar”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, provavelmente o rio Eufrates.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: derrotou
  rationale: No contexto militar, נכה indica golpear e frequentemente vencer. “Derrotou” comunica o resultado militar sem afirmar que Hadadezer foi morto.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Translitera a forma do nome preservada no WLC; a variante textual é registrada em nota.
- source_word: בֶּן רְחֹב
  choice: filho de Reobe
  rationale: Reproduz diretamente o patronímico hebraico em português natural.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Traduz diretamente a cadeia construta e translitera o topônimo segundo forma corrente em português.
- source_word: בְּלֶכְתּוֹ
  choice: quando este foi
  rationale: O infinitivo construto com בְּ expressa circunstância temporal. “Este” esclarece que o sujeito é Hadadezer, sem acrescentar conteúdo ao texto.
- source_word: לְהָשִׁיב יָדוֹ
  choice: restabelecer seu domínio
  rationale: Literalmente, “fazer sua mão voltar”. “Domínio” torna inteligível o idioma político-militar, preservando em nota as alternativas “poder” e “controle”.
- source_word: בִּנְהַר
  choice: junto ao Rio
  rationale: Mantém a designação absoluta e definida do hebraico sem inserir “Eufrates” no texto principal; a provável identificação é explicada em nota.
