source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: pt
  text: Davi pôs guarnições em Arã de Damasco[a], e os arameus ficaram sujeitos a Davi, pagando tributo[b]. E Yahweh deu vitória a Davi por onde quer que ele fosse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Síria de Damasco”. O nome hebraico é “Arã”. “Guarnições” também pode ser entendido como “oficiais” ou “postos militares”.
    reason: Preserva o topônimo hebraico e registra as ambiguidades geográfica e administrativa.
  - marker: b
    text: Lit. “tornaram-se servos de Davi, levando uma oferta”. Neste contexto, “oferta” provavelmente se refere ao tributo pago por um povo submetido.
    reason: Torna visíveis a forma mais literal de עֲבָדִים e a amplitude semântica de מִנְחָה.
  - marker: c
    text: Ou “Yahweh salvou/livrou Davi por onde quer que ele fosse”.
    reason: Preserva a alternativa mais formal para o verbo ישׁע e mantém o pretérito narrativo do hebraico.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: pôs
  rationale: O verbo שׂים significa colocar ou estabelecer; “pôs” é natural e direto neste contexto militar.
- source_word: נְצִבִים
  choice: guarnições
  rationale: No contexto de conquista e controle territorial, designa mais provavelmente forças ou postos militares estabelecidos, embora também possa referir-se a oficiais.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: em Arã de Damasco
  rationale: Preserva o nome hebraico Arã e representa de perto a construção que identifica o reino arameu centrado em Damasco.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: os arameus ficaram sujeitos a Davi
  rationale: A expressão descreve submissão política coletiva. “Ficaram sujeitos” comunica esse sentido em português corrente sem sugerir indevidamente escravidão individual; o gentílico evita a formulação pouco natural de tratar o território como “servos”.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: pagando tributo
  rationale: מִנְחָה pode significar presente, oferta ou tributo; em um contexto de vassalagem internacional, “tributo” é o sentido mais provável. “Pagando” explicita de maneira idiomática a prestação tributária continuada.
- source_word: וַיֹּשַׁע
  choice: dava vitória
  rationale: O hifil de ישׁע denota aqui a ação salvadora de Deus nas campanhas de Davi. “Dava vitória” expressa claramente o efeito militar sem eliminar a alternativa lexical “salvava/livrava”, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: por onde quer que ele fosse
  rationale: Equivalente idiomático que mantém a abrangência da expressão hebraica sem restringi-la explicitamente a marchas militares.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto emprega o tetragrama como nome próprio. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido político de עֲבָדִים
  choice: ficaram sujeitos a Davi
  alternative: tornaram-se servos de Davi
  rationale: No contexto, o termo descreve a submissão de um povo tributário. A escolha comunica a relação política sem impor a ideia moderna de escravidão individual, enquanto a alternativa mais formal continua possível.
- issue: Valor contextual de וַיֹּשַׁע
  choice: dava vitória
  alternative: salvava/livrava
  rationale: O contexto militar favorece o resultado “dava vitória”, mas o valor soteriológico mais amplo do verbo não é negado e aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe é narrativa e fluente; “Arã” e “Yahweh” preservam os nomes do hebraico. As notas mantêm ambiguidades lexicais relevantes sem sobrecarregar o versículo.
