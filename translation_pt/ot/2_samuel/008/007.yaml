  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: pt
  text: Davi tomou os escudos de ouro que pertenciam aos servos de Hadadezer e os levou para Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os escudos dourados”. O hebraico também pode ser entendido mais literalmente como “os escudos de ouro”. Uma interpretação minoritária entende o termo como “aljavas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Em narrativa, לקח normalmente significa “tomar”. “Tomou” preserva a amplitude do verbo sem acrescentar explicitamente a ideia mais forte de confiscar ou capturar.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: os escudos de ouro
  rationale: A interpretação tradicional de שִׁלְטֵי neste contexto é “escudos”, adequada ao cenário de despojos militares e ao paralelo bíblico. A construção “de ouro” acompanha de perto o hebraico; “escudos dourados” também é possível, enquanto “aljavas” representa uma proposta lexical minoritária.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: que pertenciam a
  rationale: Neste contexto, a expressão indica posse ou associação, não mera localização. “Pertenciam a” comunica isso naturalmente em português.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: os servos de Hadadezer
  rationale: עֲבָדִים pode designar servos, escravos ou oficiais conforme o contexto. Aqui, “servos” preserva a amplitude do termo e se ajusta aos integrantes da comitiva real.
- source_word: וַיְבִיאֵם
  choice: e os levou
  rationale: O hifil de בוא significa “fazer vir” ou “trazer”. Em português, com o destino expresso por “para Jerusalém”, “levou” é a formulação idiomática segundo a perspectiva narrativa, e o pronome “os” retoma os escudos.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe narrativa é direta, e “servos” evita especificar indevidamente se eram escravos, cortesãos ou oficiais.
