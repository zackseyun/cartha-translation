  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: pt
  text: Ele estabeleceu guarnições em Edom; por todo o Edom estabeleceu guarnições, e todo o Edom passou a servir Davi.[a] E Yahweh deu vitória a Davi por onde quer que ele fosse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “todo Edom, servos de Davi”. O nome da nação representa coletivamente seu povo; o termo hebraico pode significar escravos, servos ou súditos submetidos.'
    reason: lexical_alternative
  - marker: b
    text: Ou “Yahweh salvou/livrou Davi por onde quer que ele fosse”. Neste contexto militar, “deu vitória” expressa o sentido do livramento em batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: estabeleceu
  rationale: O verbo שׂים significa pôr, colocar ou estabelecer. Com “guarnições”, “estabeleceu” expressa naturalmente a instalação permanente desses postos sem acrescentar uma ação não indicada pelo hebraico.
- source_word: נְצִבִים
  choice: guarnições
  rationale: No contexto da conquista e do controle de Edom, o termo provavelmente designa forças ou postos militares estacionados. “Guarnições” comunica bem esse sentido, embora “governadores” ou “oficiais” seja lexicalmente possível.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: em Edom / por todo o Edom
  rationale: A preposição marca localização, e בְּכָל tem força abrangente ou distributiva. “Por todo o Edom” é claro e natural em português.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: todo o Edom passou a servir Davi
  rationale: A expressão apresenta Edom coletivamente como submetido ao serviço de Davi. Esta formulação preserva o nome nacional coletivo e a subordinação política, sem impor “escravos” como única nuance de עֲבָדִים.
- source_word: וַיּוֹשַׁע
  choice: deu vitória
  rationale: O hifil de ישׁע pode significar salvar, livrar ou dar vitória. No resumo militar, “deu vitória” torna explícito o sentido contextual e mantém Yahweh como agente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino; “Yahweh” preserva esse nome em vez de substituí-lo por um título.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: por onde quer que ele fosse
  rationale: 'A expressão idiomática indica abrangência: em todos os lugares ou empreendimentos de Davi. A tradução é natural e não restringe indevidamente הָלַךְ ao sentido de marchar.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração “Yahweh” conserva seu caráter de nome pessoal e evita substituí-lo por um título.
- issue: Natureza da sujeição de Edom a Davi
  choice: passou a servir Davi
  alternative: tornou-se escravo de Davi; ficou sujeito a Davi
  rationale: עֲבָדִים pode denotar escravos, servos ou povos politicamente submetidos. O contexto militar favorece sujeição tributária ou política, mas não permite definir com certeza sua forma exata; a nota registra a formulação mais literal e sua amplitude.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Edom” e “estabeleceu guarnições” foi mantida para refletir a ênfase do hebraico. “Todo o Edom” preserva a personificação coletiva da nação, enquanto a nota esclarece a concordância plural e a amplitude de עֲבָדִים.
