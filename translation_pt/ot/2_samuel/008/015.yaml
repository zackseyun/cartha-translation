source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: pt
  text: Assim, Davi reinou sobre todo o Israel e exercia a justiça e a retidão[a] em favor de todo o seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a justiça e o que era certo”. O par hebraico “justiça e retidão” é uma expressão tradicional para descrever o governo real ideal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O verbo מלך descreve aqui o exercício do reinado de Davi, não apenas sua subida ao trono.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: A preposição עַל com מלך indica o povo ou território governado, e כָּל preserva a abrangência da afirmação.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: exercia
  rationale: A construção com ויהי e particípio expressa uma atuação contínua ou habitual; o imperfeito português comunica bem esse aspecto.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto do governo real, o termo se refere à administração justa, e não somente a uma sentença judicial.
- source_word: וּצְדָקָה
  choice: retidão
  rationale: A escolha mantém distinta a dimensão moral de צְדָקָה dentro do par tradicional, evitando traduzir os dois substantivos pelo mesmo termo.
- source_word: לְכָל עַמּוֹ
  choice: em favor de todo o seu povo
  rationale: A formulação expressa a atuação governamental dirigida ao benefício do povo e preserva tanto a abrangência de כָּל quanto o sufixo possessivo.
theological_decisions:
- issue: Tradução do par régio מִשְׁפָּט וּצְדָקָה
  choice: a justiça e a retidão
  alternative: a justiça e o que era certo
  rationale: Manter dois substantivos distintos preserva as dimensões jurídica e moral que caracterizam o governo real ideal, sem reduzir o par a uma única ideia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Exercia” soa mais natural que “administrava” com os dois substantivos e preserva a ação habitual indicada pela construção hebraica. O marcador foi colocado junto ao par lexical que a nota explica.
