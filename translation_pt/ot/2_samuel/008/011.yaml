  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: pt
  text: O rei Davi também consagrou essas coisas[a] a Yahweh, juntamente com a prata e o ouro que havia consagrado dentre todas as nações que tinha subjugado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Essas coisas” se refere aos objetos mencionados no versículo anterior.
    reason: cross_reference
  - marker: b
    text: Ou “conquistado”. O verbo hebraico pode indicar a submissão de povos pela força.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: Expressa naturalmente a força aditiva, ligando o ato de Davi ao relato do versículo anterior.
- source_word: אֹתָם
  choice: essas coisas
  rationale: O pronome masculino plural retoma os objetos mencionados no versículo anterior; em português, “essas coisas” torna a referência impessoal clara sem especificá-la além do hebraico.
- source_word: הִקְדִּישׁ
  choice: consagrou
  rationale: No contexto de bens destinados a Deus, “consagrou” preserva o sentido cultual de separar algo como pertencente a Yahweh.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma corrente e digna em português para o título real seguido do nome.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo Tetragrama, com a preposição exigida pelo verbo em português.
- source_word: עִם
  choice: juntamente com
  rationale: Liga com clareza os objetos do versículo anterior à prata e ao ouro já consagrados.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: a prata e o ouro
  rationale: Mantém os dois metais distintos e definidos, em formulação natural em português.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: que havia consagrado
  rationale: O mais-que-perfeito composto indica naturalmente que essa consagração ocorreu em campanhas anteriores.
- source_word: מִכָּל הַגּוֹיִם
  choice: provenientes de todas as nações
  rationale: Explicita o valor de origem da preposição מִן e liga sem ambiguidade os metais ao produto obtido das nações.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: que tinha subjugado
  rationale: “Subjugar” comunica a imposição de domínio militar e político sem afirmar necessariamente anexação permanente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força do verbo כּבש no relato militar
  choice: subjugado
  alternative: conquistado
  rationale: A opção escolhida preserva a ideia de pôr povos sob domínio pela força, sem resolver além do texto a natureza ou permanência desse domínio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada moderadamente para fluência, preservando a referência retrospectiva, o caráter cultual de “consagrou” e a ambiguidade lexical de כּבש por meio de nota.
