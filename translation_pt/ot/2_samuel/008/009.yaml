  text: וַ/יִּשְׁמַ֕ע תֹּ֖עִי מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔ד אֵ֖ת כָּל חֵ֥יל הֲדַדְעָֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: pt
  text: Quando Toí, rei de Hamate, ouviu que Davi havia derrotado todo o exército de Hadadezer,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A passagem paralela em 1Crônicas 18:9 traz o nome do rei como “Toú”. O texto hebraico aqui traz “Toí”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo de שׁמע dá continuidade à sequência narrativa. “Ouviu” é direto, natural e menos interpretativo que “soube”.
- source_word: תֹּעִי
  choice: Toí
  rationale: Translitera a forma do nome presente no texto hebraico deste versículo; o acento gráfico orienta a pronúncia em português. A variante do paralelo é registrada em nota.
- source_word: מֶלֶךְ חֲמָת
  choice: rei de Hamate
  rationale: Reproduz de modo claro a cadeia construta que identifica o cargo e o reino de Toí, usando a forma portuguesa corrente do topônimo.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo do que Toí ouviu, não uma explicação causal.
- source_word: הִכָּה
  choice: havia derrotado
  rationale: No contexto militar, נכה denota abater ou infligir derrota. “Havia derrotado” expressa com naturalidade em português a ação anterior ao ato de ouvir, sem sugerir necessariamente que cada soldado tenha sido morto.
- source_word: אֵת כָּל חֵיל
  choice: todo o exército
  rationale: חַיִל refere-se aqui à força militar de Hadadezer; “todo o exército” é claro e corrente, preservando o alcance de כָּל.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Forma transliterada tradicional e reconhecível do nome pessoal em português.
