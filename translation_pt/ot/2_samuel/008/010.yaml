source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: pt
  text: Então Toi enviou seu filho Jorão ao rei Davi para saber como ele estava e abençoá-lo[a], porque Davi havia lutado contra Hadadezer e o derrotado, pois Hadadezer estava em guerra com Toi. Jorão trazia consigo[b] objetos de prata, de ouro e de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “felicitá-lo”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em sua mão estavam”; isto é, ele levava esses objetos consigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol dá prosseguimento à narrativa; “Então” expressa essa sequência com naturalidade.
- source_word: תֹּעִי ... יוֹרָם בְּנוֹ
  choice: Toi ... seu filho Jorão
  rationale: Os nomes são transliterados segundo a forma do texto de Samuel, e a ordem portuguesa identifica com clareza a relação familiar.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: para saber como ele estava
  rationale: Traduz de modo corrente o idiomatismo hebraico de perguntar pela paz ou pelo bem-estar de alguém.
- source_word: וּלְבָרֲכוֹ
  choice: e abençoá-lo
  rationale: Preserva o sentido lexical comum de ברך, sem eliminar a possível nuance diplomática de felicitação, indicada em nota.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: porque Davi havia lutado contra Hadadezer e o derrotado
  rationale: “Contra” explicita a oposição marcada por ב; “derrotado” comunica o sentido militar de נכה. O nome “Davi” evita uma sequência pronominal ambígua em português.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: pois Hadadezer estava em guerra com Toi
  rationale: Verte naturalmente a expressão hebraica comprimida, literalmente associada a “homem de guerras”, preservando a hostilidade continuada entre os reis.
- source_word: וּבְיָדוֹ הָיוּ
  choice: Jorão trazia consigo
  rationale: Expressa o sentido contextual da construção literal “em sua mão estavam”; a explicitação do sujeito evita atribuir os presentes a Toi ou Davi.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: objetos de prata, de ouro e de bronze
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou recipiente; “objetos” evita restringir indevidamente sua forma ou função. “Bronze” é a equivalência contextual usual de נְחֹשֶׁת.
theological_decisions:
- issue: Sentido de ברך no contexto da missão diplomática
  choice: abençoá-lo
  alternative: felicitá-lo
  rationale: A tradução principal conserva o valor lexical direto, enquanto a nota registra a nuance contextual plausível sem decidir além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe foi levemente explicitada para evitar referentes pronominais obscuros, sem acrescentar conteúdo ao relato.
