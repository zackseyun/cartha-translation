base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: pt
  text: Joabe, filho de Zeruia, estava à frente do exército[a], e Josafá, filho de Ailude, era o encarregado dos registros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comandava o exército”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico indica um funcionário da corte encarregado de registrar fatos e levar assuntos ao conhecimento do rei; também pode ser traduzido como “cronista” ou “secretário real”.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: estava à frente do exército
  rationale: A preposição עַל, nesta lista de cargos, indica autoridade ou supervisão. A expressão portuguesa comunica de modo natural que Joabe comandava o exército, sem perder o caráter administrativo da construção hebraica.
- source_word: מַזְכִּיר
  choice: secretário real
  rationale: O termo designa um alto funcionário da corte ligado ao registro e à comunicação de assuntos ao rei. “Secretário real” é claro em português moderno, enquanto a nota preserva a incerteza quanto às atribuições exatas do cargo.
- source_word: בֶּן
  choice: filho de
  rationale: Na identificação genealógica dos oficiais, בֶּן significa diretamente “filho de” e preserva o estilo formal da lista.
- source_word: וְ / וִ
  choice: e
  rationale: As conjunções prefixadas ligam os nomes e cargos em uma lista simples; “e” reproduz naturalmente essa coordenação.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Joabe / Zeruia / Josafá / Ailude
  rationale: Foram adotadas formas portuguesas tradicionais e amplamente reconhecíveis para os nomes próprios.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas nominais tradicionais. A construção “estava à frente” mantém proximidade com o hebraico e soa natural; “secretário real” torna inteligível o cargo cortesão, cuja função provável é esclarecida em nota.
