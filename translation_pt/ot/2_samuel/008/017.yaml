base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: pt
  text: Zadoque, filho de Aitube, e Aimeleque, filho de Abiatar, eram sacerdotes[a]; e Seraías era secretário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ministros principais” ou “oficiais do rei”. Alguns entendem aqui o termo hebraico num sentido administrativo mais amplo, pois o versículo faz parte de uma lista dos oficiais de Davi.
    reason: lexical_alternative
  - marker: b
    text: Ou “escrivão”. O termo hebraico designa um oficial responsável pela escrita ou pela administração.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Neste registro administrativo, a expressão genealógica indica mais naturalmente filiação direta.
- source_word: אֲחִיטוּב
  choice: Aitube
  rationale: Forma portuguesa estabelecida do nome próprio hebraico.
- source_word: אֲחִימֶלֶךְ
  choice: Aimeleque
  rationale: Forma portuguesa estabelecida do nome próprio hebraico.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forma portuguesa estabelecida do nome próprio hebraico.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Este é o sentido normal e principal do termo hebraico; o possível sentido administrativo mais amplo é preservado em nota.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Forma portuguesa reconhecível do nome próprio hebraico.
- source_word: סוֹפֵר
  choice: secretário
  rationale: Numa lista de oficiais da corte, o termo designa um responsável pela escrita e por funções administrativas; “secretário” comunica a função em português atual.
theological_decisions:
- issue: Sentido de כֹּהֲנִים numa lista de oficiais do rei
  choice: sacerdotes
  alternative: ministros principais ou oficiais do rei
  rationale: Embora o contexto seja administrativo, o sentido lexical predominante é “sacerdotes”. A possibilidade de um emprego cortesão mais amplo não é forte o bastante para substituir esse sentido no texto principal, mas é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos correntes em português. A ordem e a coordenação do hebraico foram preservadas, enquanto a pontuação esclarece os dois cargos. As notas foram posicionadas junto aos termos a que de fato se referem.
