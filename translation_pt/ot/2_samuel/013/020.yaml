    issue: «perguntou-lhe» em lugar de «disse-lhe»
    rationale: O hebraico emprega ויאמר, «disse», ainda que a fala seguinte seja uma pergunta. Em português, «disse-lhe» preserva a formulação narrativa e deixa que a pergunta faça sua própria função.
  - severity: medium
    issue: «Não leve este caso tão a sério» acrescenta «tão»
    rationale: O hebraico ordena que Tamar não ponha o coração nessa questão; não inclui um comparativo ou atenuador equivalente a «tão». A adição reduz a literalidade e modifica levemente o tom da fala.
  - severity: low
    issue: A nota a reproduz uma formulação que não corresponde exatamente ao texto principal revisado
    rationale: A citação da nota deve acompanhar a pergunta preservada no texto, incluindo a ausência de «Foi ... que».
