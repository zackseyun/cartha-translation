base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: pt
  text: 'Então Absalão, irmão dela, disse-lhe[a]: “Amnom, seu irmão, esteve com você? Agora, minha irmã, fique calada; ele é seu irmão. Não leve esta questão a sério.” E Tamar ficou, desolada[b], na casa de seu irmão Absalão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Amnom, seu irmão, esteve com você?” — expressão discreta que se refere à violência sexual.
    reason: lexical_alternative
  - marker: b
    text: Ou “devastada”. O termo hebraico transmite a ideia de desolação, ruína e profundo abatimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: Amnom
  rationale: Adota a forma tradicional e amplamente reconhecível do nome em português.
- source_word: הָיָה עִמָּךְ
  choice: esteve com você
  rationale: Preserva a expressão indireta do hebraico, que neste contexto se refere discretamente à violência sexual.
- source_word: הַחֲרִישִׁי
  choice: fique calada
  rationale: Expressa de modo natural e direto a ordem para que Tamar não fale sobre o ocorrido.
- source_word: אָחִיךְ הוּא
  choice: ele é seu irmão
  rationale: Mantém a justificativa perturbadora de Absalão sem suavizá-la nem explicá-la.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Não leve este caso tão a sério
  rationale: Reproduz idiomaticamente a ordem de não pôr o coração na questão, aqui com o sentido de não se deixar consumir por ela; o uso de 'tão' evita sugerir que Tamar não devesse dar qualquer importância ao ocorrido, embora preserve o tom minimizador de Absalão.
- source_word: וַתֵּשֶׁב
  choice: ficou
  rationale: No contexto, indica que Tamar permaneceu vivendo na casa de Absalão após o acontecimento.
- source_word: שֹׁמֵמָה
  choice: desolada
  rationale: Conserva a amplitude do termo hebraico, que comunica devastação, ruína e isolamento.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: na casa de seu irmão Absalão
  rationale: Preserva o cenário doméstico e a identificação familiar expressa no hebraico.
theological_decisions:
- issue: Eufemismo narrativo referente à violência sexual
  choice: Manter no texto principal a formulação indireta “esteve com você”.
  alternative: “violentou você” ou “teve relações com você”
  rationale: O hebraico emprega linguagem discreta dentro de uma narrativa de trauma. A tradução conserva essa característica textual, enquanto a nota esclarece a referência sem esconder a natureza da agressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala de Absalão permanece brusca e minimizadora, sem aprovação narrativa. A ordem dos constituintes foi ajustada para soar natural em português, e os dois marcadores de nota aparecem no texto principal.
