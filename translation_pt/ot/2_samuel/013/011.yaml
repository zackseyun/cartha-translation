base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: pt
  text: 'Quando ela levou a comida até ele para que comesse[a], ele a agarrou e lhe disse: “Venha, deite-se comigo, minha irmã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando ela se aproximou dele para que comesse”. O verbo hebraico pode indicar tanto que Tamar se aproximou como que levou a comida para perto dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  choice: ela levou a comida até ele para que comesse
  rationale: נגשׁ pode indicar aproximar-se ou levar algo para perto. O contexto imediato é Tamar servindo o alimento que preparou; explicitar “a comida”, implícita no hebraico, produz português natural sem mudar o sentido. A alternativa lexical é preservada em nota.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: ele a agarrou
  rationale: חזק com ב indica segurar com firmeza. “Agarrou” comunica a força coerciva do gesto em linguagem atual e direta.
- source_word: בּוֹאִי
  choice: Venha
  rationale: Imperativo feminino singular de בוא, preservado como ordem direta e concisa.
- source_word: שִׁכְבִי עִמִּי
  choice: deite-se comigo
  rationale: שכב com עִם funciona aqui como expressão sexual. “Deite-se comigo” conserva a formulação corporal e solene, sem obscurecer a exigência no contexto.
- source_word: אֲחוֹתִי
  choice: minha irmã
  rationale: O termo de parentesco é literal e essencial para a força moral e narrativa da cena.
theological_decisions:
- issue: Tradução da ordem sexual sem atenuação eufemística
  choice: deite-se comigo
  alternative: durma comigo
  rationale: A expressão hebraica tem sentido sexual reconhecível. A escolha mantém a gravidade e a forma concreta da fala, enquanto o contexto deixa inequívoca a intenção.
- issue: Preservação da forma de tratamento familiar
  choice: minha irmã
  alternative: —
  rationale: A relação familiar intensifica a transgressão narrada e, por isso, não deve ser omitida nem suavizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe narrativa é direta; a violência do gesto e a relação familiar permanecem explícitas. O marcador [a] aparece no texto principal.
