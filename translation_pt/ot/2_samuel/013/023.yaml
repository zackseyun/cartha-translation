base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: pt
  text: Passados dois anos completos[a], Absalão tinha tosquiadores de ovelhas trabalhando em Baal-Hazor, perto de Efraim, e convidou todos os filhos do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dois anos de dias”, expressão idiomática que indica um período completo de dois anos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁנָתַיִם יָמִים
  choice: Passados dois anos completos
  rationale: A construção narrativa וַיְהִי introduz a nova etapa da história, enquanto a expressão idiomática לִשְׁנָתַיִם יָמִים indica que se completou um período de dois anos. A formulação portuguesa comunica ambos os elementos com naturalidade, sem acrescentar um marcador como “ora” ou “então”.
- source_word: וַיִּהְיוּ גֹזְזִים לְאַבְשָׁלוֹם
  choice: Absalão tinha tosquiadores de ovelhas trabalhando
  rationale: O particípio גֹזְזִים designa os que tosquiavam, e לְאַבְשָׁלוֹם os relaciona a Absalão. A explicitação de “ovelhas” evita ambiguidade em português; “trabalhando” deixa claro que eram os tosquiadores, não Absalão pessoalmente, que realizavam a tarefa.
- source_word: בְּבַעַל חָצוֹר
  choice: em Baal-Hazor
  rationale: O topônimo é transliterado, e “em” apresenta de modo natural o local onde ocorria a tosquia.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: perto de Efraim
  rationale: Neste contexto geográfico, עִם expressa proximidade. “Perto de” transmite o sentido provável de modo idiomático.
- source_word: וַיִּקְרָא אַבְשָׁלוֹם
  choice: e convidou
  rationale: Embora קרא possa significar literalmente “chamar”, no contexto da celebração ligada à tosquia seu valor pragmático é o de fazer um convite.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: todos os filhos do rei
  rationale: Tradução direta e natural da construção nominal hebraica, preservando tanto a relação familiar quanto a referência régia.
