base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: pt
  text: 'Então Amnom disse a Tamar: “Leve a comida para o aposento interno[a], para que eu coma da sua mão”. Tamar pegou os bolos que havia preparado e os levou para o aposento interno, a Amnom, seu irmão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quarto” ou simplesmente “aposento”. O hebraico חֶדֶר designa um cômodo interno; “aposento interno” destaca aqui o ambiente reservado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: Leve
  rationale: Imperativo feminino singular de בוא em sentido causativo. Em português, “leve” expressa naturalmente o deslocamento da comida para o aposento indicado por Amnom.
- source_word: הַבִּרְיָה
  choice: a comida
  rationale: O substantivo designa alimento preparado para ser consumido; “comida” mantém o sentido amplo, enquanto o item específico é nomeado depois.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: para o quarto interior
  rationale: חֶדֶר indica um aposento interno. “Quarto interior” é claro em português, sugere o ambiente mais reservado da narrativa e permite traduzir de modo consistente as duas ocorrências.
- source_word: וְאֶבְרֶה
  choice: para que eu coma
  rationale: A forma verbal de ברה exprime aqui o propósito de comer; a construção portuguesa preserva adequadamente a nuance volitiva no contexto do pedido.
- source_word: מִיָּדֵךְ
  choice: da sua mão
  rationale: A tradução literal conserva a imagem hebraica e a intimidade manipuladora do pedido de Amnom.
- source_word: הַלְּבִבוֹת
  choice: os bolos
  rationale: O termo se refere aos bolos especiais preparados por Tamar no contexto anterior. “Bolos” é suficientemente específico sem conjecturar ingredientes ou formato.
- source_word: אָחִיהָ
  choice: seu irmão
  rationale: A relação de parentesco é explícita no hebraico e importante para a força narrativa e moral da passagem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Preservaram-se a repetição de “quarto interior”, a expressão concreta “da sua mão” e a identificação explícita de Amnom como irmão de Tamar.
