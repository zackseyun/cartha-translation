  text: Quando o rei Davi ouviu falar de tudo isso[a], ficou muito irado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E o rei Davi ouviu todas essas coisas, e isso ardeu muito nele”, isto é, “sua ira ardeu intensamente”.'
