lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Quando o rei Davi
  rationale: O וְ dá continuidade à narrativa e, neste contexto, pode ser expresso naturalmente por uma oração temporal em português. מֶלֶךְ e דָּוִד correspondem diretamente a “rei Davi”.
- source_word: שָׁמַע
  choice: ouviu falar de
  rationale: O verbo significa “ouvir”; com acontecimentos como objeto, “ouviu falar de” comunica com naturalidade que Davi recebeu notícia do ocorrido.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: tudo isso
  rationale: דְּבָרִים pode designar palavras, fatos, assuntos ou coisas. Aqui se refere aos acontecimentos relatados; “tudo isso” é amplo, claro e idiomático.
- source_word: וַ/יִּחַר ל/וֹ מְאֹד
  choice: ficou muito irado
  rationale: A expressão hebraica descreve idiomaticamente uma ira intensa, literalmente algo que “ardeu para ele”. “Ficou muito irado” preserva o início da reação e sua intensidade sem acrescentar “ira” como sujeito explícito.
