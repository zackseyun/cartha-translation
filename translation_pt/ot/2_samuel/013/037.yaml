base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: pt
  text: Mas Absalão fugiu e foi até Talmai, filho de Amiur, rei de Gesur. E ele[a] ficou de luto por seu filho todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “ficou de luto” não é expresso no hebraico; pelo contexto, entende-se que seja Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם בָּרַח
  choice: Mas Absalão fugiu
  rationale: A conjunção introduz contraste no fluxo narrativo, e בָּרַח indica fuga. O nome pessoal segue a forma portuguesa consagrada.
- source_word: וַיֵּלֶךְ אֶל
  choice: e foi para junto de
  rationale: A expressão indica que Absalão foi até Talmai; “para junto de” deixa claro que se dirigiu à pessoa, não a um lugar chamado Talmai.
- source_word: תַּלְמַי בֶּן עַמִּיחוּר
  choice: Talmai, filho de Amiúde
  rationale: Mantém o nome Talmai por transliteração e emprega a forma portuguesa tradicional Amiúde para o patronímico.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: rei de Gesur
  rationale: Reproduz diretamente a cadeia construta que identifica Talmai.
- source_word: וַיִּתְאַבֵּל
  choice: E ele ficou de luto
  rationale: O hitpael de אבל descreve luto por uma morte. O pronome conserva a referência implícita do hebraico sem inserir o nome de Davi no corpo do texto.
- source_word: עַל בְּנוֹ
  choice: por seu filho
  rationale: Com o verbo de luto, עַל é naturalmente expresso por “por”; o sufixo singular é preservado.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Mantém de modo claro e natural o idiomatismo temporal hebraico, sem determinar uma duração que o texto não explicita.
theological_decisions:
- issue: Identidade do sujeito de וַיִּתְאַבֵּל
  choice: Manter “ele” no texto e explicar que o contexto aponta para Davi
  alternative: Explicitar “Davi ficou de luto”
  rationale: O sujeito está implícito no hebraico. Embora o contexto indique Davi, inserir seu nome eliminaria uma característica real da formulação original.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecíveis no Brasil. A sintaxe narrativa é direta, e a ambiguidade gramatical do sujeito foi preservada e esclarecida em nota.
