base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: pt
  text: 'Ela lhe disse: “Não, meu irmão! Não me viole[a], pois não se faz uma coisa dessas em Israel. Não cometa essa infâmia.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não me humilhe” ou “não me estupre”. O verbo hebraico pode denotar violação sexual, com conotações de humilhação e desonra.
    reason: lexical_alternative
  - marker: b
    text: Ou “esse ato vergonhoso” ou “essa perversidade”. O termo hebraico designa um ato moralmente escandaloso, não mera insensatez.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Ela lhe disse
  rationale: O wayyiqtol introduz a fala de Tamar na sequência narrativa; em português, a conjunção pode ser omitida para maior naturalidade.
- source_word: אַל אָחִי
  choice: Não, meu irmão!
  rationale: O primeiro אַל tem força de exclamação negativa urgente antes do vocativo; “Não” preserva essa intensidade sem acrescentar um pedido de cortesia ausente do hebraico.
- source_word: תְּעַנֵּנִי
  choice: não me viole
  rationale: O Piel de ענה, neste contexto de violência sexual, abrange violação e humilhação. “Violar” comunica a agressão sexual sem eliminar totalmente as conotações de desonra.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: pois não se faz uma coisa dessas em Israel
  rationale: A construção passiva impessoal expressa uma norma moral comunitária; esta formulação é natural em português e mantém o apelo aos padrões de Israel.
- source_word: אַל תַּעֲשֵׂה אֶת הַנְּבָלָה הַזֹּאת
  choice: Não cometa essa infâmia
  rationale: “Cometer” combina naturalmente com um ato moralmente condenável, e “infâmia” transmite o caráter vergonhoso, vil e socialmente escandaloso de נְבָלָה, evitando o sentido moderno demasiado brando de “loucura” ou “tolice”.
