base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: pt
  text: Amnom ficou tão angustiado por causa de sua irmã Tamar que chegou a adoecer[a], pois ela era virgem, e parecia impossível aos olhos de Amnom fazer-lhe alguma coisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se fez adoecer”. A expressão hebraica pode indicar que Amnom fez a si mesmo adoecer ou que sua angústia resultou em doença.'
    reason: lexical_alternative
  - marker: b
    text: “Parecia impossível aos olhos de Amnom” é uma expressão hebraica que indica que Amnom não via nenhuma maneira viável de agir.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: ficou tão angustiado
  rationale: O verbo descreve Amnom sob forte pressão ou aflição interior. A formulação portuguesa expressa a intensidade indicada pela ligação com o adoecimento sem acrescentar uma causa psicológica específica.
- source_word: לְהִתְחַלּוֹת
  choice: que chegou a adoecer
  rationale: O hitpael de חלה pode ser entendido como ‘adoecer’ ou ‘fazer-se adoecer’. A construção escolhida é natural em português e mantém no rodapé a ambiguidade entre resultado e nuance reflexiva.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: Neste contexto, a preposição indica causa, e não benefício.
- source_word: אֲחֹתוֹ
  choice: sua irmã
  rationale: Preserva explicitamente o parentesco, elemento central para o sentido narrativo e moral do episódio.
- source_word: בְתוּלָה
  choice: virgem
  rationale: Equivalente direto e atual para a condição indicada pelo substantivo hebraico, sem recorrer a termos vagos ou arcaicos.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: parecia impossível aos olhos de Amnom
  rationale: Mantém a perspectiva subjetiva e a imagem do idioma hebraico, segundo o qual aquilo estava além do que Amnom julgava viável.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: fazer-lhe alguma coisa
  rationale: Reproduz a expressão deliberadamente ampla ‘fazer a ela qualquer coisa’, sem antecipar nem especificar o crime narrado depois.
