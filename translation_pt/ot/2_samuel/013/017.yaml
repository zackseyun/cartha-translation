base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: pt
  text: 'Então ele chamou o jovem que o servia e disse: “Por favor, mande esta para fora, para longe de mim, e tranque a porta atrás dela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: o jovem que o servia
  rationale: Preserva tanto o sentido de נַעַר como jovem quanto a força descritiva do particípio מְשָׁרֵת, indicando seu atendente pessoal sem reduzir a expressão a um título.
- source_word: שִׁלְחוּ נָא
  choice: Por favor, ponham ... para fora
  rationale: O imperativo plural ordena que a pessoa seja mandada embora ou expulsa; נָא atenua formalmente a ordem com uma expressão equivalente a “por favor”, embora o tom permaneça imperioso.
- source_word: זֹאת
  choice: esta
  rationale: O demonstrativo feminino singular refere-se a Tamar de modo deliberadamente distanciado e depreciativo. O português permite conservar o demonstrativo substantivado sem acrescentar “mulher” ou “pessoa”.
- source_word: מֵעָלַי הַחוּצָה
  choice: para fora, para longe de mim
  rationale: Combina o destino expresso por הַחוּצָה com a ideia de afastamento da presença de Amnom em מֵעָלַי, de maneira clara e natural em português.
- source_word: וּנְעֹל
  choice: e tranquem
  rationale: נעל pode significar fechar com tranca, barrar ou trancar. “Trancar” é natural, atual e não especifica além do necessário o mecanismo da porta.
- source_word: אַחֲרֶיהָ
  choice: atrás dela
  rationale: No contexto de fechar uma porta depois que alguém sai, “atrás dela” reproduz naturalmente a expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala conserva a brusquidão e o desprezo de Amnom por meio de “esta”, sem inserir um substantivo ausente do hebraico.
