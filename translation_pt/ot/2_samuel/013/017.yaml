review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: Amnom chama seu atendente e ordena que Tamar seja posta para fora e que a porta seja trancada atrás dela. «Esta» conserva adequadamente o demonstrativo feminino desdenhoso sem acrescentar «mulher». Contudo, «ponham» é plural, embora a narrativa identifique um único atendente; em português, isso produz uma discordância contextual desnecessária.'
  naturalness: O texto é moderno e claro, mas «ponham esta» após «o jovem que o servia» soa incoerente para o leitor. «Mande esta para fora» dirige naturalmente a ordem ao único atendente e mantém o caráter imperioso, apesar de «por favor».
  terminology: «O jovem que o servia», «esta», «trancar a porta» e «atrás dela» são escolhas adequadas e não introduzem interpretação teológica ou denominacional.
  issues:
  - severity: medium
    issue: Incompatibilidade contextual entre «o jovem» e o imperativo plural «ponham».
    rationale: Embora a forma hebraica vocalizada seja plural, o destinatário narrativo é um único atendente. Em português contemporâneo, «ponham» sugere que Amnom se dirige a várias pessoas e cria uma tensão que não é comunicativamente útil no texto-alvo. O singular «mande» transmite a ordem ao atendente sem alterar o sentido.
  revised_text: 'Então ele chamou o jovem que o servia e disse: “Por favor, mande esta para fora, para longe de mim, e tranque a porta atrás dela.”'
