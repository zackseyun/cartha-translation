base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: pt
  text: 'Mas ela lhe disse[a]: “Não! Pois este grande mal — mandar-me embora — é maior do que o outro mal que você me fez.” Mas ele não quis ouvi-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Não faça isso, pois este grande mal — mandar-me embora — é maior do que o outro mal que você me fez.” O hebraico é condensado e de sintaxe difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não!
  rationale: Embora אַל normalmente introduza uma proibição, aqui a fala é elíptica e expressa a recusa urgente de Tamar. “Não!” preserva a força do protesto em português natural.
- source_word: אוֹדֹת
  choice: Pois
  rationale: Neste contexto sintaticamente comprimido, o termo introduz o motivo ou assunto do protesto. “Pois” liga naturalmente a objeção de Tamar à explicação seguinte.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: este grande mal
  rationale: רָעָה pode indicar mal, dano ou injustiça. “Grande mal” conserva de modo direto tanto o peso moral do substantivo quanto o adjetivo גְּדוֹלָה.
- source_word: לְשַׁלְּחֵנִי
  choice: mandar-me embora
  rationale: O infinitivo com sufixo identifica o ato que Tamar denuncia; a formulação é clara e mantém a força da expulsão.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: é maior do que o outro que você me fez
  rationale: אַחֶרֶת remete a outro mal, anteriormente cometido. A tradução mantém explícita a comparação sem acrescentar uma identificação que o hebraico deixa implícita.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Mas ele não quis ouvi-la
  rationale: אָבָה expressa vontade ou recusa. “Não quis ouvi-la” preserva esse aspecto volitivo e é idiomático em português.
