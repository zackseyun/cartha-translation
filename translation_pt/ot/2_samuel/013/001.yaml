base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: pt
  text: Depois disso, Absalão, filho de Davi, tinha uma irmã bonita chamada Tamar, e Amnom, filho de Davi, a amou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era infatuado por ela” ou “a desejava”. O hebraico emprega o verbo comum para “amar”, mas a continuação da narrativa mostra que a afeição de Amnom era corrompida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: A fórmula narrativa com a expressão temporal assinala a sequência dos acontecimentos; esta tradução é natural em português e mantém a ligação com o contexto anterior.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: Absalão, filho de Davi, tinha
  rationale: A construção hebraica de posse com לְ é expressa naturalmente pelo verbo “ter”; “filho de Davi” é mantido por causa da repetição deliberada no versículo.
- source_word: אָחוֹת יָפָה
  choice: uma irmã muito bonita
  rationale: אָחוֹת significa “irmã”, e יָפָה descreve sua beleza. “Muito bonita” comunica com naturalidade a força positiva do adjetivo no português corrente.
- source_word: וּשְׁמָהּ תָּמָר
  choice: chamada Tamar
  rationale: Forma idiomática e concisa de reproduzir a oração hebraica “e o nome dela era Tamar”, sem perda de conteúdo.
- source_word: וַיֶּאֱהָבֶהָ
  choice: a amou
  rationale: O texto emprega o verbo hebraico comum para “amar”. A tradução mantém esse sentido lexical e deixa que a narrativa posterior revele a natureza corrompida do sentimento de Amnom.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Amnom, filho de Davi
  rationale: Mantém a identificação dinástica repetida no hebraico e evidencia as relações dentro da família real.
theological_decisions:
- issue: Tradução de אהב em uma narrativa moralmente carregada
  choice: a amou
  alternative: a desejou; ficou obcecado por ela
  rationale: Embora os acontecimentos seguintes mostrem que o sentimento de Amnom era corrompido e violento, este versículo usa o verbo comum para “amar” sem qualificá-lo. A tradução preserva a tensão literária e teológica, em vez de resolvê-la antecipadamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para soar natural, sem apagar a repetição de “filho de Davi” nem a ambiguidade moral do verbo “amar”.
