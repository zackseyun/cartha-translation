base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/038.yaml
  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: pt
  text: Mas Absalão fugiu e foi para Gesur[a], onde ficou três anos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E Absalão fugiu e foi para Gesur». A conjunção hebraica pode ser traduzida como «e» ou «mas» neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: «e esteve ali três anos»; também pode ser traduzido como «e permaneceu ali três anos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Mas Absalão
  rationale: A conjunção ו pode ser traduzida como «e» ou, no contexto narrativo, como «mas». Aqui, «mas» marca naturalmente a retomada com leve contraste em relação ao versículo anterior.
- source_word: בָּרַח
  choice: fugiu
  rationale: O verbo ברח denota fugir ou escapar; «fugiu» é direto e preserva o sentido de retirada para evitar perigo.
- source_word: וַ/יֵּלֶךְ
  choice: foi
  rationale: הלך na sequência narrativa significa de modo simples «foi».
- source_word: גְּשׁוּר
  choice: Gesur
  rationale: Transliteração tradicional e reconhecível do topônimo hebraico.
- source_word: וַ/יְהִי שָׁם
  choice: onde ficou
  rationale: O hebraico diz literalmente «e esteve ali». Em português, «onde ficou» expressa com naturalidade a permanência indicada pelo contexto e pela duração subsequente.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: três anos
  rationale: Tradução direta da expressão numeral que indica duração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação principal usa «onde ficou» para evitar a construção menos natural «e esteve ali» sem perder a referência locativa nem a duração.
