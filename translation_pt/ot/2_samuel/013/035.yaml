  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: pt
  text: 'Então Jonadabe disse ao rei: “Veja! Os filhos do rei chegaram. Assim como o seu servo disse, assim aconteceu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: יֽוֹנָדָב
  choice: Jonadabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Refere-se ao rei humano Davi; a construção é direta e idiomática.
- source_word: הִנֵּה
  choice: Veja!
  rationale: A partícula chama a atenção para a chegada que se torna visível naquele momento; “Veja!” conserva a vivacidade sem arcaísmo.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: Preserva o plural, importante no contexto, e traduz naturalmente a cadeia construta.
- source_word: בָּאוּ
  choice: chegaram
  rationale: O perfeito relata a chegada já constatada. O pretérito perfeito é natural em português e, com “Veja!”, mantém a imediaticidade da cena.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: Assim como o seu servo disse
  rationale: דבר designa aqui aquilo que foi dito; “seu servo” preserva a autodesignação cortês de Jonadabe perante o rei.
- source_word: כֵּן הָיָה
  choice: assim aconteceu
  rationale: Mantém a correlação explícita כִּ...כֵּן (“assim como... assim”) e confirma que os fatos corresponderam à declaração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A fala conserva o registro cortês da corte por meio de “seu servo”, sem reproduzir uma sintaxe excessivamente hebraizante.
