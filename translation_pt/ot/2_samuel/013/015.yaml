base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: pt
  text: 'Então Amnom a odiou com um ódio muito grande, pois o ódio com que a odiava era maior que o amor com que a havia amado. E Amnom lhe disse: “Levante-se, vá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: Então Amnom a odiou
  rationale: O waw consecutivo faz a narrativa avançar e é naturalmente expresso por “Então”. O sufixo feminino singular identifica Tamar como objeto do verbo “odiar”.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: com um ódio muito grande
  rationale: Mantém a construção enfática do hebraico, que combina o verbo “odiar” com o substantivo “ódio” e ainda o intensifica por “grande” e “muito”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da afirmação anterior. “Pois” conserva de modo natural o valor causal no português corrente e digno.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: o ódio ... era maior que o amor
  rationale: A preposição מִן estabelece uma comparação; “maior que” a expressa com clareza em português.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: com que a odiava
  rationale: Preserva a repetição deliberada da raiz hebraica de “odiar” e a relação da oração com o substantivo “ódio”.
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: com que a havia amado
  rationale: Preserva a repetição entre “amor” e “amar”; o mais-que-perfeito composto indica que esse amor era anterior ao ódio agora descrito.
- source_word: קוּמִי לֵכִי
  choice: Levante-se e vá embora
  rationale: Os dois imperativos femininos singulares são abruptos. “Vá embora” comunica em português o caráter de expulsão presente no contexto, enquanto a nota registra a forma mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição enfática de “odiou/ódio/odiava” e “amor/amado” foi mantida para refletir a força retórica do hebraico.
