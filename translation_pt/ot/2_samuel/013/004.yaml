base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: pt
  text: 'Ele lhe perguntou: “Por que você está tão definhado, filho do rei, manhã após manhã[a]? Não vai me contar?” Amnom lhe respondeu: “Eu amo Tamar[b], irmã de meu irmão Absalão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as manhãs”; mais literalmente, “manhã por manhã”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Estou apaixonado por Tamar”. O hebraico diz: “Eu amo Tamar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz diretamente uma pergunta sobre a causa e corresponde ao uso natural em português.
- source_word: כָּכָה דַּל
  choice: tão abatido
  rationale: דַּל pode indicar alguém enfraquecido, emagrecido ou de aparência definhada; “abatido” comunica de modo natural o declínio visível de Amnom sem limitar o sentido à magreza.
- source_word: בֶּן הַמֶּלֶךְ
  choice: filho do rei
  rationale: Mantém a forma hebraica e a força retórica do tratamento, sem substituí-la pelo título interpretativo “príncipe”.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição hebraica exprime recorrência; esta formulação preserva essa repetição de maneira clara em português.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Não vai me contar?
  rationale: Reproduz em português corrente a pergunta que pressupõe e incentiva uma resposta afirmativa.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: irmã de meu irmão Absalão
  rationale: Preserva a estrutura relacional do hebraico e a maneira significativa como Amnom identifica Tamar por sua relação com Absalão.
- source_word: אֲנִי אֹהֵב
  choice: Eu amo
  rationale: Traduz diretamente o verbo hebraico comum para “amar”, sem antecipar uma avaliação moral ou psicológica baseada no restante da narrativa.
theological_decisions:
- issue: A natureza do amor declarado por Amnom
  choice: Eu amo Tamar
  alternative: Estou apaixonado por Tamar; Desejo Tamar
  rationale: O hebraico emprega o verbo comum אָהֵב, “amar”. Embora o contexto narrativo exponha o caráter desordenado de seu desejo, esta fala não deve receber no texto principal uma interpretação mais específica do que a forma lexical permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Amnom” e “Absalão” seguem as formas bíblicas portuguesas tradicionais. A colocação de [a] junto à expressão que ela explica evita ambiguidade.
