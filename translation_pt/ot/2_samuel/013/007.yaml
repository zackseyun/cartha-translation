base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: pt
  text: 'Então Davi mandou chamar Tamar para casa e disse: “Por favor, vá à casa de seu irmão Amnom e prepare algo para ele comer[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prepare para ele um alimento revigorante” ou “prepare-lhe uma refeição”. O termo hebraico refere-se a alimento preparado para uma pessoa enferma ou convalescente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou dizer
  rationale: O verbo significa literalmente “enviou”, mas, seguido de אֶל e de לֵאמֹר introduzindo a mensagem, a expressão portuguesa “mandou dizer” comunica naturalmente que Davi enviou uma ordem ou recado.
- source_word: הַבַּיְתָה
  choice: que estava em casa
  rationale: Embora a forma tenha terminação direcional, o contexto favorece a localização de Tamar quando recebeu o recado. A oração evita a possível leitura de que Davi enviou Tamar para casa antes de transmitir a ordem.
- source_word: לְכִי נָא
  choice: Por favor, vá
  rationale: O imperativo feminino singular é preservado, e נָא é representado pela fórmula cortês “por favor”.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: à casa de seu irmão Amnom
  rationale: Reproduz com clareza a relação familiar expressa pela cadeia construta e usa uma ordem natural em português.
- source_word: וַעֲשִׂי לוֹ
  choice: prepare para ele
  rationale: Embora עשה seja amplo, “prepare” é a escolha idiomática no contexto culinário e mantém explícito o beneficiário.
- source_word: הַבִּרְיָה
  choice: uma comida
  rationale: O substantivo designa alimento, especialmente algo preparado para uma pessoa enferma ou convalescente. “Uma comida” é natural e contida; a nota registra as nuances mais específicas sem determiná-las no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mandou dizer” e “prepare” dão naturalidade sem perder os componentes do hebraico. O nome אַמְנוֹן é transliterado na forma portuguesa tradicional “Amnom”.
