  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: pt
  text: Mas ele não quis ouvi-la[a], e ele era mais forte do que ela[b], e a violentou[c] e se deitou com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “ouvir a voz dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele a dominou pela força”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico também pode significar “humilhar” ou “afligir”; aqui se refere à violação sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: não quis
  rationale: Com a negação e o infinitivo, o verbo expressa recusa deliberada ou falta de disposição. “Não quis” é natural em português e preserva o caráter volitivo da ação.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: ouvi-la
  rationale: A expressão significa literalmente “ouvir a voz dela”, mas, neste contexto, tem o sentido de dar ouvidos ao apelo dela. “Ouvi-la” comunica isso com clareza e naturalidade.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: como era mais forte do que ela
  rationale: A construção com חזק e מן indica que ele prevaleceu por ter mais força. A formulação mantém a comparação explícita e mostra a circunstância que possibilitou a agressão, sem fundi-la com o verbo seguinte.
- source_word: וַיְעַנֶּהָ
  choice: violentou-a
  rationale: Neste contexto de coerção sexual, ענה descreve a humilhação e violação infligidas à vítima. “Violentou-a” preserva a gravidade e a dimensão sexual do ato sem reduzir o termo a uma descrição meramente física.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: deitou-se com ela
  rationale: שכב com objeto direto é uma expressão hebraica para relação sexual. “Deitou-se com ela” conserva o idioma bíblico em português; o contexto deixa inequívoco que não houve consentimento.
