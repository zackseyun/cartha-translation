  to: 'Jonadabe lhe disse: “Deite-se na sua cama e finja estar doente.[a] Quando seu pai vier vê-lo, diga-lhe: ‘Por favor, permita que minha irmã Tamar venha, me dê alimento[b] e prepare diante dos meus olhos a refeição,[c] para que eu veja e coma da mão dela’”.'
