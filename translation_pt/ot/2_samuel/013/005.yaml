  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: pt
  text: 'Jonadabe lhe disse: “Deite-se na sua cama e finja estar doente.[a] Quando seu pai vier vê-lo, diga-lhe: ‘Por favor, permita que minha irmã Tamar venha, me dê alimento[b] e prepare diante dos meus olhos a refeição,[c] para que eu veja e coma da mão dela’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faça-se de doente”. O verbo hebraico indica que ele deveria aparentar estar enfermo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pão”, termo muitas vezes usado em sentido mais amplo para alimento.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico provavelmente se refere a alimento preparado especialmente para uma pessoa doente ou convalescente.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Deite-se na sua cama
  rationale: Expressa naturalmente em português a ordem de se deitar no próprio leito.
- source_word: וְהִתְחָל
  choice: finja estar doente
  rationale: 'O hitpael de חלה tem aqui sentido pretensivo: Amnom deve aparentar doença, não adoecer de fato.'
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Quando seu pai vier vê-lo
  rationale: A sequência instrucional é transmitida naturalmente por uma oração temporal em português.
- source_word: תָּבֹא נָא
  choice: Por favor, permita que ... venha
  rationale: Preserva a súplica cortês marcada por נָא e deixa claro que o pedido é dirigido ao pai.
- source_word: תָמָר אֲחוֹתִי
  choice: minha irmã Tamar
  rationale: Ordem idiomática em português para a identificação apositiva da personagem.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: me dê alimento
  rationale: ברה neste contexto indica alimentar ou prover sustento a alguém enfermo; a formulação evita confundi-lo com עשה, o verbo posterior para preparar.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: prepare diante dos meus olhos a comida própria para um doente
  rationale: Mantém o elemento visual de לְעֵינַי e comunica o provável sentido contextual de הַבִּרְיָה como alimento destinado a um enfermo ou convalescente.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: para que eu a veja
  rationale: Preserva o sentido literal de ראה sem acrescentar ao hebraico um objeto expresso; o pronome português retoma naturalmente a comida.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: e coma da mão dela
  rationale: 'Conserva a imagem importante para a narrativa: Tamar entregaria pessoalmente o alimento a Amnom.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” de forma implícita nos imperativos e mantém “da mão dela” por sua relevância narrativa. Os marcadores aparecem junto às expressões que explicam.
