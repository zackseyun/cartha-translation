  naturalness: O português é claro, moderno e de registro adequado. «Para que eu veja» é mais natural e mais fiel à ausência de objeto expresso no hebraico do que «para que eu a veja».
  terminology: «Jonadabe», «minha irmã Tamar», «alimento» e «da mão dela» são apropriados. «Refeição» traduz de modo neutro o termo para a comida preparada e permite que a provável conotação de alimento para enfermo permaneça na nota.
