base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: pt
  text: 'Enquanto eles estavam a caminho, chegou a Davi a notícia[a]: “Absalão matou todos os filhos do rei; não restou nenhum deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegou a Davi o relato”; o termo hebraico também pode indicar uma informação ainda não confirmada ou um rumor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Enquanto eles estavam a caminho
  rationale: A fórmula narrativa introduz uma circunstância simultânea. A tradução conserva o valor temporal em português natural e atual.
- source_word: הַשְּׁמֻעָה
  choice: a notícia
  rationale: שְׁמוּעָה pode designar notícia, relato ou rumor. “Notícia” é natural neste contexto, enquanto a nota preserva o caráter ainda não confirmado da informação.
- source_word: בָאָה אֶל דָּוִד
  choice: chegou a Davi
  rationale: Reproduz de modo direto e idiomático o verbo feminino singular cujo sujeito é “a notícia”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da fala, sem a construção mais pesada “dizendo”.
- source_word: הִכָּה
  choice: matou
  rationale: Embora נכה tenha o sentido básico de golpear, neste relato a alegação é explicitamente letal. “Matou” comunica com clareza o sentido contextual.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: todos os filhos do rei
  rationale: Tradução direta, natural e específica quanto ao gênero dos filhos mencionados.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: não restou nenhum deles
  rationale: Conserva a ideia do nifal de יתר, isto é, permanecer ou ser deixado, em formulação portuguesa concisa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem inicial preserva o enquadramento temporal hebraico; o discurso direto mantém a força dramática da notícia equivocada.
