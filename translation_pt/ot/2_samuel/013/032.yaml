base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: pt
  text: 'Então Jonadabe, filho de Simeia, irmão de Davi, respondeu: “Que meu senhor não diga: ‘Mataram todos os jovens, os filhos do rei’, pois somente Amnom morreu. Isso já estava decidido por Absalão[a] desde o dia em que Amnom violentou[b] Tamar, irmã de Absalão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isso estava estabelecido conforme a palavra — ou a ordem — de Absalão”, isto é, de acordo com sua intenção já firmada.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser traduzido como “humilhou” ou, de modo mais explícito neste contexto, “estuprou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Verbo narrativo comum para introduzir uma resposta; em português, dispensa a redundância pouco natural de ‘respondeu e disse’.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: filho de Simeia, irmão de Davi
  rationale: 'Preserva a cadeia de identificação: Simeia, e não Jonadabe, é apresentado como irmão de Davi.'
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Que meu senhor não diga
  rationale: Reproduz o valor proibitivo do jussivo e mantém o tratamento cortesão e deferente.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: os jovens, os filhos do rei
  rationale: ‘Jovens’ exprime o sentido contextual de נְעָרִים, e a aposição identifica-os como filhos do rei.
- source_word: הֵמִיתוּ
  choice: mataram
  rationale: O hifil de מות significa causar a morte, isto é, matar; a forma plural foi preservada.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: somente Amnom morreu
  rationale: Expressa com naturalidade a exclusividade marcada por לְבַדּוֹ.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Isso já estava decidido por Absalão
  rationale: Comunica uma decisão ou intenção firmada cuja origem está na palavra ou vontade de Absalão, sem tornar ‘ordem’ explícita no texto principal.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: desde o dia em que Amnom violentou
  rationale: No contexto, o piel de ענה indica violência sexual e humilhação. ‘Violentou’ é claro sem eliminar totalmente a amplitude lexical; o sujeito foi explicitado para evitar ambiguidade em português.
- source_word: אֲחֹתוֹ
  choice: irmã dele
  rationale: O pronome hebraico se refere a Absalão; ‘dele’ preserva a referência, esclarecida em nota por causa da possível ambiguidade criada pela explicitação de Amnom.
