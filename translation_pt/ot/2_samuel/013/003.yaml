  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: pt
  text: Amnom tinha um amigo chamado Jonadabe, filho de Simeia, que era irmão de Davi. Jonadabe era um homem muito sagaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muito sábio” ou “muito inteligente”. O termo hebraico tem sentido amplo; “sagaz” foi usado aqui porque, logo em seguida, a perspicácia de Jonadabe se manifesta de maneira moralmente duvidosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַמְנוֹן רֵעַ
  choice: Amnom tinha um amigo
  rationale: A construção hebraica com לְ expressa posse ou circunstância; em português, “tinha um amigo” comunica isso de modo natural. רֵעַ designa aqui um amigo ou companheiro.
- source_word: וּשְׁמוֹ יוֹנָדָב
  choice: chamado Jonadabe
  rationale: A fórmula hebraica “e seu nome era” é vertida de modo corrente e conciso em português, sem perda de sentido.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: filho de Simeia, que era irmão de Davi
  rationale: A oração relativa explicita que “irmão de Davi” se refere a Simeia, evitando uma ambiguidade sintática acidental em português.
- source_word: אִישׁ חָכָם מְאֹד
  choice: um homem muito sagaz
  rationale: חָכָם pode indicar sabedoria, inteligência ou habilidade. “Sagaz” preserva a percepção aguçada de Jonadabe sem atribuir necessariamente aprovação moral, adequada ao conselho moralmente perverso que ele dará no contexto.
