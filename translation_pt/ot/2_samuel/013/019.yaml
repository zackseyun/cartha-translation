base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: pt
  text: Então Tamar pôs cinzas sobre a cabeça, rasgou a túnica especial[a] que vestia, pôs a mão sobre a cabeça e saiu andando e gritando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «túnica de mangas compridas», «túnica ornamentada» ou «túnica de várias cores». A expressão hebraica é incerta; neste contexto, refere-se à veste distintiva usada pelas filhas virgens do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: cinzas
  rationale: O substantivo designa cinza usada como sinal de luto; em português, o plural «cinzas» é idiomático neste gesto.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: pôs cinzas sobre a cabeça
  rationale: Expressa naturalmente a ação ritual indicada pelo hebraico, sem acrescentar detalhes.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: a túnica especial[a]
  rationale: A expressão hebraica é incerta. «Especial» comunica que se tratava de uma veste distintiva, esclarecida pelo contexto imediato como própria das filhas virgens do rei, sem adotar como certa uma interpretação específica quanto a cores ou mangas.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: que vestia
  rationale: Tradução natural da oração relativa que identifica a túnica que estava sobre ela.
- source_word: קָרָעָה
  choice: rasgou
  rationale: Verbo corrente para o gesto concreto de rasgar a roupa em sinal de profunda aflição.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: pôs a mão sobre a cabeça
  rationale: Preserva literalmente o gesto corporal de dor e humilhação, sem o interpretar além do texto.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: saiu andando e clamando
  rationale: 'Reproduz de modo natural a ação contínua e simultânea: Tamar seguia seu caminho enquanto clamava em voz alta.'
- source_word: זָעָקָה
  choice: clamando
  rationale: Mantém a ideia de um grito forte sem decidir se era lamento, protesto ou grito de socorro.
