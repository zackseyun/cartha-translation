base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: pt
  text: Os jovens de Absalão[a] fizeram com Amnom o que Absalão havia ordenado.[b] Então todos os filhos do rei se levantaram, montaram, cada um, em sua mula e fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os servos de Absalão” ou “os assistentes de Absalão”. O termo hebraico pode designar jovens que prestavam serviço.
    reason: lexical_alternative
  - marker: b
    text: 'A ordem aparece explicitamente no versículo anterior: eles deveriam matar Amnom quando ele estivesse alegre por causa do vinho.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: os jovens de Absalão
  rationale: נַעַר pode designar um jovem, servo ou assistente. “Jovens” preserva a forma lexical sem definir além do texto a posição deles na casa de Absalão; o contexto deixa claro que eram seus subordinados.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: fizeram com Amnom o que
  rationale: A expressão descreve a ação dirigida contra Amnom. Esta formulação é natural em português e mantém a concisão do hebraico, deixando que a ordem explícita do versículo anterior identifique a ação violenta.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: Absalão havia ordenado
  rationale: O mais-que-perfeito composto expressa com clareza que a ordem precedeu seu cumprimento.
- source_word: וַיָּקֻמוּ כָּל בְּנֵי הַמֶּלֶךְ
  choice: todos os filhos do rei se levantaram
  rationale: Tradução direta e natural que retrata a reação imediata dos filhos do rei presentes.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: cada um montou na sua mula
  rationale: אִישׁ tem sentido distributivo, “cada um”, e פֶּרֶד designa uma mula.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: נוּס indica fuga urgente; “fugiram” é preciso, conciso e adequado ao registro narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a sequência rápida da narrativa e evita explicitar no corpo do versículo a morte de Amnom, pois o hebraico remete de modo conciso à ordem anterior.
