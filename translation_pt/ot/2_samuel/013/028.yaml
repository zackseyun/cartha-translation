  to: 'Então Absalão ordenou aos seus moços: “Fiquem atentos: quando o coração de Amnom estiver alegre com o vinho[a] e eu lhes disser: ‘Golpeiem Amnom’, matem-no. Não tenham medo. Não fui eu mesmo que lhes dei essa ordem? Sejam fortes e sejam homens valentes.”'
  rationale: A revisão torna explícita em português a sequência de ordens do hebraico, preserva a distinção lexical entre golpear e matar e emprega uma designação mais contextual para os agentes pessoais de Absalão. Mantêm-se a imagem do coração, a ambiguidade quanto ao grau de intoxicação e a formulação masculina da exortação final.
