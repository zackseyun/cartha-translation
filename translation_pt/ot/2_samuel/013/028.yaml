base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: pt
  text: 'Então Absalão ordenou aos seus moços: “Fiquem atentos: quando o coração de Amnom estiver alegre com o vinho[a] e eu lhes disser: ‘Golpeiem Amnom’, matem-no. Não tenham medo. Não fui eu mesmo que lhes dei essa ordem? Sejam fortes e sejam homens valentes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando Amnom estiver animado pelo vinho”. O idioma hebraico fala literalmente de seu coração estar alegre com o vinho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: seus jovens
  rationale: נַעַר pode designar jovem, servo, assistente ou homem de confiança. Neste contexto, são agentes pessoais de Absalão incumbidos da violência; “seus jovens” conserva o sentido básico sem domesticá-los como meros servos.
- source_word: רְאוּ נָא
  choice: Fiquem atentos
  rationale: O imperativo de ראה com נָא exige atenção imediata. A formulação é natural em português atual e mantém a força diretiva.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: quando o coração de Amnom estiver alegre por causa do vinho
  rationale: A expressão idiomática descreve um estado alegre e desinibido provocado pelo vinho, sem afirmar necessariamente embriaguez completa. A tradução preserva a imagem hebraica do coração.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Ataquem Amnom
  rationale: נכה tem sentido amplo de golpear ou ferir. “Ataquem” soa natural como sinal para iniciar a ação, enquanto a oração seguinte explicita o resultado letal.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: vocês o matarão
  rationale: O hifil de מות significa causar a morte, matar. O futuro no contexto transmite a ordem ligada ao sinal anterior.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: Proibição direta e idiomática em português contemporâneo.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Não fui eu mesmo que lhes dei essa ordem?
  rationale: A pergunta retórica apela à autoridade de Absalão, e “eu mesmo” expressa a ênfase de אָנֹכִי.
- source_word: חִזְקוּ
  choice: Sejam fortes
  rationale: Tradução direta do imperativo, que convoca força e coragem.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: sejam homens valentes
  rationale: בני חיל é uma expressão masculina para homens corajosos, capazes ou valentes, com conotação marcial neste contexto.
theological_decisions:
- issue: Expressão masculina em לִבְנֵי חָיִל
  choice: sejam homens valentes
  alternative: sejam valentes
  rationale: O hebraico se dirige a agentes masculinos e emprega uma expressão explicitamente masculina. Mantê-la preserva a forma e o contexto social do texto, sem ampliar nem neutralizar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem hebraica do coração foi mantida no texto, e uma alternativa idiomática aparece na nota. O discurso conserva o tom urgente e marcial sem recorrer a vocabulário arcaico.
