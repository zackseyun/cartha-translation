base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: pt
  text: 'Então Amnom se deitou e fingiu estar doente. Quando o rei foi vê-lo, Amnom disse ao rei: “Por favor, deixe que minha irmã Tamar venha e prepare diante dos meus olhos dois bolos[a], para que eu possa comer da mão dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dois bolinhos” ou “dois pastéis”; não se sabe ao certo que tipo de alimento o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se deitou
  rationale: Expressa naturalmente que Amnom tomou o leito como parte de seu fingimento, preservando o sentido narrativo de שׁכב.
- source_word: וַיִּתְחָל
  choice: fingiu estar doente
  rationale: O hitpael, neste contexto, indica simulação de doença, não uma enfermidade real.
- source_word: לִרְאֹתוֹ
  choice: foi vê-lo
  rationale: Traduz diretamente a ideia de ir ver Amnom; em português, a construção também comunica naturalmente a visita do rei.
- source_word: תָּבוֹא נָא
  choice: Por favor, deixe que ... venha
  rationale: Reproduz o pedido cortês expresso pelo imperfeito volitivo com נָא e sua formulação dirigida ao rei.
- source_word: תָּמָר אֲחֹתִי
  choice: minha irmã Tamar
  rationale: É a ordem mais natural em português, sem alterar a relação familiar explicitada no hebraico.
- source_word: וּתְלַבֵּב
  choice: prepare
  rationale: O verbo raro designa o preparo do alimento chamado לְבִבוֹת; “prepare” evita especificar um método culinário que o texto não define.
- source_word: לְעֵינַי
  choice: diante dos meus olhos
  rationale: Preserva a expressão visual concreta e enfatiza que Amnom quer observar Tamar preparando a comida.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: dois bolinhos
  rationale: O termo designa algum tipo de bolo ou massa preparada, mas sua forma exata é incerta. “Bolinhos” é compreensível e evita afirmar que tinham formato de coração.
- source_word: וְאֶבְרֶה
  choice: para que eu possa comer
  rationale: Comunica com clareza a finalidade da preparação e o sentido contextual do verbo ברה, comer ou tomar alimento.
- source_word: מִיָּדָהּ
  choice: da mão dela
  rationale: Mantém o singular e a imagem hebraica do serviço pessoal solicitado por Amnom.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a expressão concreta “diante dos meus olhos” e evitou-se atribuir aos bolinhos um formato de coração, não explicitado pelo hebraico.
