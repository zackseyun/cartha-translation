base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: pt
  text: Então o rei se levantou, rasgou as suas roupas[a] e se deitou no chão. E todos os seus servos estavam de pé, com as roupas rasgadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as próprias roupas era uma expressão habitual de dor, horror ou luto no mundo bíblico hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal wayyiqtol de קום dá continuidade à sequência narrativa e descreve a reação repentina do rei em português natural.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico, que no contexto se refere a Davi sem substituir o título pelo nome.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: rasgou as suas roupas
  rationale: Reproduz diretamente o gesto convencional de luto ou consternação; “roupas” é atual e amplamente compreensível.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: se deitou no chão
  rationale: שכב com אַרְצָה indica que ele se pôs deitado em direção ao chão; a forma pronominal é idiomática em português.
- source_word: וְכָל־עֲבָדָיו
  choice: E todos os seus servos
  rationale: עֲבָדִים pode designar servos ou membros da corte; “servos” preserva a amplitude do termo sem especificar uma função.
- source_word: נִצָּבִים
  choice: estavam de pé
  rationale: O particípio nifal descreve o estado ou postura contínua dos servos na cena.
- source_word: קְרֻעֵי בְגָדִים
  choice: com as roupas rasgadas
  rationale: Expressa o estado resultante indicado pelo particípio passivo e evita sugerir explicitamente quem rasgou cada roupa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa sem alterar a progressão da cena. O marcador [a] foi colocado junto ao gesto cultural que a nota explica.
