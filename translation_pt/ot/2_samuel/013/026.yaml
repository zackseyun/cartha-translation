base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: pt
  text: 'Então Absalão disse[a]: “Se não, por favor, deixe meu irmão Amnom ir conosco”. Mas o rei lhe perguntou: “Por que ele deveria ir com você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: “Se você não for, por favor, deixe meu irmão Amnom ir conosco”. O hebraico é elíptico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse / Mas ... perguntou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” introduz naturalmente o pedido de Absalão, e “Mas” marca a reação contrastante do rei; no segundo caso, “perguntou” é idiomático diante de uma fala interrogativa.
- source_word: וָלֹא
  choice: Se não
  rationale: A expressão hebraica é elíptica e retoma a recusa anterior do rei. “Se não” conserva sua concisão, enquanto a nota explicita o sentido contextual possível.
- source_word: נָא
  choice: por favor
  rationale: A partícula dá ao pedido um tom cortês e deferente; “por favor” é a forma natural no português moderno.
- source_word: יֵלֶךְ
  choice: deixe ... ir / deveria ir
  rationale: No pedido de Absalão, o jussivo é representado naturalmente por “deixe ... ir”. Na pergunta retórica do rei, o imperfeito é bem expresso por “deveria ir”.
- source_word: אִתָּנוּ
  choice: conosco
  rationale: Equivalente direto da preposição comitativa com sufixo da primeira pessoa do plural.
- source_word: אַמְנוֹן אָחִי
  choice: meu irmão Amnom
  rationale: Esta ordem é mais natural em português e preserva claramente a relação familiar expressa no hebraico.
- source_word: לָמָה
  choice: Por que
  rationale: Equivalente interrogativo direto e natural.
- source_word: עִמָּךְ
  choice: com você
  rationale: Traduz diretamente a preposição com o sufixo masculino singular, que se refere a Absalão.
