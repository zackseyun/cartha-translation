base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: pt
  text: Então Tamar foi à casa de Amnom, seu irmão, enquanto ele estava deitado. Ela pegou a massa, amassou-a, modelou-a em bolos[a] diante dele e cozinhou[b] os bolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fez bolos em forma de coração”. O verbo e o substantivo hebraicos são raros e talvez indiquem um formato associado à palavra “coração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ferveu os bolos”. O verbo hebraico pode indicar especificamente o cozimento por fervura, embora aqui talvez tenha o sentido mais geral de cozinhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Então ... foi
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: à casa de Amnom, seu irmão
  rationale: Reproduz com clareza o destino do movimento e preserva a relação de parentesco destacada no hebraico.
- source_word: וְהוּא שֹׁכֵב
  choice: enquanto ele estava deitado
  rationale: A oração é circunstancial e descreve o estado de Amnom; “deitado” evita acrescentar a ideia mais específica de estar na cama.
- source_word: הַבָּצֵק
  choice: a massa
  rationale: É o equivalente corrente e natural em contexto de preparo de alimento.
- source_word: וְתָלֹשׁ
  choice: amassou-a
  rationale: לוש designa normalmente o ato de amassar ou sovar massa; “amassou-a” é claro e amplamente compreensível.
- source_word: וַתְּלַבֵּב
  choice: modelou-a em bolos
  rationale: O verbo raro parece indicar a formação da massa no alimento nomeado em seguida, sem permitir afirmar com segurança que os bolos tinham formato de coração.
- source_word: לְעֵינָיו
  choice: diante dele
  rationale: Expressão idiomática que indica que a ação ocorreu em sua presença e à sua vista.
- source_word: וַתְּבַשֵּׁל
  choice: cozinhou
  rationale: בשל pode indicar especificamente cozinhar por fervura, mas o termo mais geral preserva a incerteza sobre o método exato.
- source_word: הַלְּבִבוֹת
  choice: os bolos
  rationale: Designa o alimento preparado. “Bolos” é natural e evita impor a associação etimológica incerta com “coração”.
