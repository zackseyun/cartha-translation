base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: pt
  text: 'Então ela pegou a travessa e despejou os bolinhos diante dele[a], mas ele se recusou a comer. Amnom disse: “Mandem todos sair da minha presença.” E todos saíram da presença dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serviu os bolinhos diante dele”. O verbo hebraico significa literalmente “derramar” ou “despejar”, usado aqui para a comida retirada da travessa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: a travessa
  rationale: O substantivo designa aqui o recipiente usado para levar ou servir a comida. “Travessa” é natural em português e evita especificar indevidamente uma frigideira ou panela.
- source_word: וַתִּצֹק לְפָנָיו
  choice: despejou os bolinhos diante dele
  rationale: יצק significa concretamente “derramar/despejar”. O objeto, não expresso neste versículo, é recuperado do contexto anterior; “os bolinhos” torna a ação compreensível sem reduzir o verbo ao sentido genérico de “servir”.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: ele se recusou a comer
  rationale: מָאֵן indica recusa deliberada, não simples falta de vontade ou apetite.
- source_word: הוֹצִיאוּ
  choice: Mandem ... sair
  rationale: O imperativo hifil de יצא é causativo. Em português, “mandem sair” comunica naturalmente a ordem para retirar os presentes.
- source_word: כָל אִישׁ
  choice: todos
  rationale: A expressão hebraica é literalmente “todo homem”, mas funciona coletivamente para todas as pessoas presentes; “todos” é idiomático e preserva o alcance contextual.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: daqui / da presença dele
  rationale: A locução significa afastamento da pessoa ou de sua presença. Na fala direta, “daqui” soa natural; na narração, “da presença dele” explicita o referente e preserva o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Amnom” segue a forma portuguesa tradicional do nome. A construção mantém a ação concreta do hebraico e evita linguagem excessivamente literal na ordem de retirada.
