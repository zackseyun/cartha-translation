  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: pt
  text: 'Então Absalão foi até o rei e disse: “Veja, seu servo tem tosquiadores. Por favor, que o rei e seus servos vão com seu servo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹזְזִים
  choice: fazendo a tosquia das ovelhas
  rationale: O particípio substantivado refere-se aos tosquiadores ou, por extensão contextual, ao evento da tosquia. Em português, explicitar o evento e as ovelhas comunica naturalmente a situação implícita no hebraico.
- source_word: עַבְדֶּךָ
  choice: o seu servo
  rationale: Mantém a forma respeitosa e autodepreciativa com que Absalão se dirige ao rei, sem substituí-la simplesmente por “eu”.
- source_word: יֵלֶךְ נָא
  choice: por favor, que ... venham
  rationale: Expressa o pedido cortês marcado por נָא. O plural verbal em português acomoda naturalmente o rei acompanhado de seus servos.
- source_word: הִנֵּה נָא
  choice: '[incorporado na apresentação do anúncio e no pedido cortês]'
  rationale: הִנֵּה chama a atenção para a situação presente, enquanto נָא suaviza a fala. Uma tradução literal como “eis, por favor” seria pouco natural; o valor discursivo é preservado pela formulação direta e cortês.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala conserva a etiqueta cortesã da terceira pessoa (“o rei”, “o seu servo”) e explicita que se trata da tosquia de ovelhas, informação culturalmente implícita no hebraico.
