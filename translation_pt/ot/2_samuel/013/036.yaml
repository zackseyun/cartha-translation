base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: pt
  text: Assim que ele terminou de falar, eis que chegaram os filhos do rei. Eles levantaram a voz e choraram. Também o rei e todos os seus servos choraram com um choro muito intenso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “choraram com um choro muito grande”, construção enfática que expressa luto intenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Assim que ele terminou de falar
  rationale: Expressa de modo natural a fórmula narrativa hebraica e a sequência temporal imediata, sem reproduzir mecanicamente “e aconteceu”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva o marcador de atenção e a vivacidade da chegada inesperada, em registro narrativo digno e compreensível.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: Reproduz diretamente a relação familiar indicada pela construção hebraica.
- source_word: בָּאוּ
  choice: chegaram
  rationale: No contexto, indica que os filhos do rei alcançaram o lugar da cena; “chegaram” é mais natural em português do que “vieram” sem um ponto de referência explícito.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: levantaram a voz
  rationale: Mantém a imagem do idioma hebraico, que aqui introduz um lamento audível e coletivo.
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: Traduz com precisão o verbo de choro e lamento no contexto.
- source_word: וְכָל עֲבָדָיו
  choice: e todos os seus servos
  rationale: “Servos” conserva a amplitude de עֲבָדִים, que no ambiente régio pode incluir servidores e auxiliares da corte, sem especificar indevidamente a função.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: choraram com um choro muito intenso
  rationale: Conserva, em português legível, a construção enfática formada pelo verbo e pelo substantivo cognato, juntamente com a forte intensificação de גָּדוֹל מְאֹד.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto preserva a vivacidade de וְהִנֵּה com “eis que” e mantém de forma legível a ênfase da construção cognata final. A nota foi posicionada junto à expressão que explica.
