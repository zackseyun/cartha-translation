  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: pt
  text: E o rei Davi ansiava por ir até Absalão[a], pois estava consolado a respeito de Amnom, porque ele estava morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta frase é difícil. O verbo está no feminino e pode pressupor um sujeito elíptico, como “a alma de Davi”: “a alma de Davi se consumia por ir até Absalão”. Outra interpretação antiga entende: “O rei Davi deixou de sair contra Absalão”.'
    reason: Explica com precisão que “alma” é um sujeito elíptico proposto, não uma palavra presente no texto, e preserva a principal leitura alternativa.
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל
  choice: ansiava por ir até
  rationale: 'A construção hebraica é difícil e parece empregar elipse, provavelmente com נֶפֶשׁ (“alma”, “vida interior”) subentendido: a alma de Davi se consumia ou ansiava por ir até Absalão. A formulação escolhida comunica naturalmente esse sentido sem inserir “alma” no texto principal.'
- source_word: נִחַם עַל
  choice: estava consolado a respeito de
  rationale: Preserva o sentido do nifal de נחם, indicando que Davi havia encontrado consolo quanto a Amnom, sem transformar a frase em mera resignação ou esquecimento.
- source_word: כִּי מֵת
  choice: visto que este estava morto
  rationale: Mantém a relação causal explícita do hebraico e identifica Amnom como referente, evitando a possível ambiguidade do pronome português “ele”.
theological_decisions:
- issue: Sentido da difícil expressão וַתְּכַל דָּוִד הַמֶּלֶךְ לָצֵאת אֶל אַבְשָׁלוֹם
  choice: Davi ansiava por ir até Absalão
  alternative: Davi deixou de sair contra Absalão
  rationale: O texto consonantal e a sintaxe permitem discussão. O sentido de anseio, entendendo um substantivo feminino como נֶפֶשׁ subentendido, harmoniza-se com o uso de כלה para desejo intenso e com 2 Samuel 14:1. A alternativa antiga de que Davi “deixou de sair contra” Absalão permanece registrada em nota, sem ser apagada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ansiava” expressa desejo intenso sem coloquialismo; “ir até” traduz naturalmente a direção indicada por אֶל. O marcador [a] aparece no texto principal.
