base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: pt
  text: Absalão não falou com Amnom, nem mal nem bem,[a] pois Absalão odiava Amnom porque Amnom havia violentado Tamar, irmã de Absalão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não falou com Amnom, nem de mal nem de bem”; expressão que indica que Absalão não lhe disse coisa alguma.
    reason: lexical_alternative
  - marker: b
    text: Ou “humilhado”. Neste contexto, o verbo hebraico se refere à violência sexual cometida por Amnom contra Tamar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: disse nada a
  rationale: Com a negação, a expressão é vertida naturalmente em português como “não disse nada a”, sem perder o sentido de não dirigir palavra a alguém.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: nem de mal nem de bem
  rationale: Preserva os dois polos do merismo hebraico e indica que Absalão não falou com Amnom sobre coisa alguma.
- source_word: כִּי
  choice: pois
  rationale: Introduz com clareza a razão do silêncio de Absalão.
- source_word: שָׂנֵא
  choice: odiava
  rationale: Expressa diretamente o ódio continuado de Absalão no contexto narrativo.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: por ele ter
  rationale: Comunica de modo natural a causa do ódio, evitando uma construção nominal pesada em português.
- source_word: עִנָּה
  choice: violentado
  rationale: Neste contexto, o verbo descreve a violência sexual e a humilhação impostas a Tamar; “violentado” mantém essa força sem transformar o verbo, isoladamente, em terminologia jurídica mais específica.
- source_word: אֲחֹתוֹ
  choice: sua irmã
  rationale: O sufixo se refere a Absalão; a colocação antes de “Tamar” torna essa relação clara e natural em português.
