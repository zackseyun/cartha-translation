base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: pt
  text: Absalão, porém, fugiu. Então o jovem que estava de vigia levantou os olhos[a], viu, e eis que muita gente vinha pela estrada atrás dele, pelo lado do monte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ergueu os olhos”, expressão que significa que ele olhou para cima ou ao longe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vinha da estrada atrás dele, do lado do monte”. A relação espacial exata no hebraico é condensada, e o referente de “dele” não é explícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: O verbo ברח expressa fuga ou escape; “fugiu” é conciso, natural e conserva a força narrativa.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: o jovem que estava de vigia
  rationale: A expressão combina נַעַר, “jovem/servo”, com o particípio צֹפֶה, “aquele que observa/vigia”. A formulação preserva os dois elementos sem impor o título oficial “sentinela”.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: levantou os olhos
  rationale: Mantém o conhecido idioma hebraico de olhar para cima ou ao longe, sendo claro e natural em português.
- source_word: וַיַּרְא וְהִנֵּה
  choice: viu que
  rationale: Em narrativa portuguesa, “viu que” comunica com naturalidade a percepção introduzida por הִנֵּה, sem recorrer ao arcaizante “e eis”.
- source_word: עַם רַב
  choice: muita gente
  rationale: Representa o coletivo עַם e a ideia de grande número expressa por רַב, sem sugerir uma multidão formalmente reunida.
- source_word: הֹלְכִים
  choice: vinha
  rationale: Embora הלך denote ir/andar, o movimento é de aproximação em relação ao observador; “vinha” expressa naturalmente essa perspectiva e concorda com o coletivo “gente”.
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: pela estrada atrás dele, pelo lado do monte
  rationale: A formulação permanece próxima da construção espacial comprimida do hebraico e não resolve de maneira indevida o referente ambíguo do pronome.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. Preserva-se a repetição narrativa apenas quando natural; o marcador hebraico הִנֵּה é integrado como “viu que”. A ambiguidade espacial no final do versículo é mantida e explicada em nota.
