base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: pt
  text: 'Mas o rei disse a Absalão: “Não, meu filho! Por favor, não vamos todos, para não sermos um peso para você.” Absalão insistiu com ele, mas o rei não quis ir; então o abençoou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: para não sermos um peso para você
  rationale: A expressão hebraica indica tornar-se pesado ou oneroso para alguém; esta formulação preserva a imagem de encargo em português natural.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalão insistiu com ele
  rationale: O verbo, nesta construção, comunica insistência ou pressão persistente. O sujeito implícito é Absalão, retomado explicitamente para evitar ambiguidade em português.
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: mas o rei não quis ir
  rationale: אָבָה expressa disposição ou consentimento; “não quis ir” é direto e natural. “O rei” explicita o sujeito pronominal hebraico para impedir que seja confundido com Absalão.
- source_word: וַיְבָרֲכֵהוּ
  choice: então o abençoou
  rationale: Mantém o sentido comum de ברך e a concisão do hebraico; pelo contexto, o rei abençoou Absalão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. As explicitações de “Absalão” e “o rei” servem apenas à clareza referencial e não acrescentam interpretação teológica.
