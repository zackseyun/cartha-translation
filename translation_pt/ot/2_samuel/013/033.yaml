  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: pt
  text: 'Agora, meu senhor, o rei, não leve a sério essa notícia[a], dizendo: “Todos os filhos do rei morreram”, pois somente Amnom morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não ponha esta palavra/assunto no coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz a correção de Jonadabe; é natural e preserva a transição.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: não leve a sério
  rationale: Expressa em português corrente o sentido do idioma hebraico, literalmente relacionado a pôr algo no coração, sem sugerir apenas emoção.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Preserva a forma respeitosa de tratamento da corte e identifica claramente o destinatário.
- source_word: דָּבָר
  choice: essa notícia
  rationale: No contexto, refere-se ao relato recebido por Davi; 'notícia' comunica isso com clareza, enquanto a nota preserva a amplitude literal de 'palavra/coisa'.
- source_word: לֵאמֹר
  choice: pensando
  rationale: Introduz naturalmente em português o conteúdo que Davi não deve acolher como verdadeiro; aqui o ato interior é mais provável que uma fala efetiva.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: Todos os filhos do rei
  rationale: Tradução direta da construção hebraica, mantendo a referência específica aos filhos homens do rei.
- source_word: מֵתוּ
  choice: morreram
  rationale: O perfeito hebraico apresenta a morte como acontecimento consumado; o pretérito perfeito é natural no relato em português.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: pois somente
  rationale: 'Reproduz a correção exclusiva: não morreram todos; Amnom foi o único morto.'
- source_word: מֵת
  choice: morreu
  rationale: Expressa naturalmente em português o fato consumado e mantém o contraste com o relato anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação explicativa 'meu senhor, o rei' conserva a deferência cortesã sem soar excessivamente arcaica. A formulação evita resolver questões teológicas inexistentes no versículo e mantém a força corretiva do hebraico.
