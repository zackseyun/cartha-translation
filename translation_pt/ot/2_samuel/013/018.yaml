base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: pt
  text: Ela usava uma túnica ricamente ornamentada[a], pois era assim que as filhas virgens do rei se vestiam, com mantos. Então o assistente dele a pôs para fora e trancou a porta atrás dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma túnica de muitas cores” ou “uma túnica comprida, com mangas”; o sentido exato do termo hebraico para essa veste é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: uma túnica ricamente ornamentada
  rationale: A expressão designa uma veste distintiva, mas o sentido exato de פַּסִּים é incerto. Esta formulação é natural em português e comunica o caráter especial da peça sem impor a interpretação tradicional de muitas cores; outras possibilidades são registradas em nota.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: pois era assim que se vestiam
  rationale: A construção explica um costume habitual; o imperfeito em português expressa esse uso reiterado com naturalidade.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: as filhas virgens do rei
  rationale: Preserva tanto a condição de filhas do rei quanto a referência explícita à virgindade, sem reduzi-la apenas ao estado civil.
- source_word: מְעִילִים
  choice: incorporado em “se vestiam”
  rationale: O termo pode indicar mantos ou vestes exteriores. Evitar a repetição de “túnica” ou “vestes” produz português mais natural, como permite a função explicativa da frase, embora o substantivo não seja representado separadamente.
- source_word: מְשָׁרְתוֹ
  choice: o assistente dele
  rationale: No contexto, refere-se ao servidor pessoal de Amnom. “Assistente” é atual e evita as conotações modernas ou institucionais de “ministro”.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: a pôs para fora
  rationale: Traduz de modo conciso a construção causativa, sem acrescentar um grau de violência não explicitado pelo verbo.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: trancou a porta atrás dela
  rationale: נעל indica fechar com tranca ou ferrolho; “trancou” é claro, natural e amplamente compreensível em português.
