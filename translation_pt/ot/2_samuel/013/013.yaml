language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: pt
  text: Quanto a mim, para onde levarei a minha desonra[a]? E você será como um dos infames de Israel[b]. Agora, por favor, fale com o rei[c], pois ele não me negará a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha vergonha” ou “o meu opróbrio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como um dos insensatos de Israel”. O termo hebraico costuma caracterizar pessoas moralmente vergonhosas ou vis, não apenas pessoas sem inteligência.
    reason: lexical_alternative
  - marker: c
    text: Isto é, “ele não se recusará a me dar a você”. A declaração de Tamar pode ser uma súplica genuína ou uma tentativa desesperada de adiar Amnom.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה
  choice: para onde
  rationale: O advérbio interrogativo, ligado ao verbo de movimento, introduz uma pergunta retórica sobre para onde Tamar poderia levar sua desonra.
- source_word: אוֹלִיךְ
  choice: levarei
  rationale: O hifil de הלך conserva a imagem concreta de levar ou carregar consigo a desonra; o futuro em português expressa naturalmente a consequência temida.
- source_word: חֶרְפָּתִי
  choice: a minha desonra
  rationale: O termo indica a vergonha e o descrédito públicos decorrentes do ato; “desonra” é atual, digno e adequado à dimensão social.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: como um dos infames
  rationale: נבל, neste contexto moral, designa alguém vergonhoso, vil e moralmente insensato, não apenas pouco inteligente. “Infames” comunica a condenação ética sem linguagem excessivamente arcaica.
- source_word: דַּבֶּר נָא
  choice: por favor, fale
  rationale: O imperativo com נָא expressa súplica urgente; esta formulação é natural no português moderno.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: ele não me negará a você
  rationale: A construção significa não reter ou recusar Tamar a Amnom. “Não me negará a você” preserva a relação verbal e torna inteligível a possível referência a uma concessão matrimonial.
theological_decisions:
- issue: Sentido da súplica de Tamar ao rei
  choice: Apresentar diretamente a afirmação de que o rei não a negaria a Amnom, sem decidir se a proposta era genuína ou uma estratégia para adiar a agressão.
  alternative: Explicitar que Tamar acreditava ser possível o casamento, ou afirmar que ela apenas tentava ganhar tempo.
  rationale: O próprio versículo não esclarece a viabilidade legal ou política da proposta nem a intenção íntima de Tamar; a tradução deve preservar essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem retórica e a metáfora de levar a desonra foram preservadas; “infames” evita reduzir נְבָלִים a deficiência intelectual.
