  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: pt
  text: Mas Absalão insistiu com ele[a], e o rei enviou Amnom e todos os filhos do rei com Absalão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «pressionou-o» ou «persuadiu-o». A expressão hebraica indica mais que um simples pedido: Absalão pressionou o rei com persistência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: insistiu com ele
  rationale: A construção idiomática com פרץ e בְּ expressa pressão persistente, não o sentido literal de “irromper”. “Insistiu com ele” é natural em português e preserva a força da súplica insistente de Absalão após a recusa anterior de Davi.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּשְׁלַח
  choice: o rei enviou
  rationale: שלח significa aqui mandar ou permitir que fossem ao banquete. O sujeito implícito é Davi; “o rei” explicita-o naturalmente e evita que “ele” seja confundido com Absalão.
- source_word: אִתּוֹ
  choice: com Absalão
  rationale: O hebraico diz literalmente “com ele”, referindo-se a Absalão. A repetição do nome elimina uma ambiguidade pronominal criada pela sintaxe natural do português.
- source_word: אֶת אַמְנוֹן
  choice: Amnom
  rationale: O marcador de objeto direto não é traduzido; emprega-se a forma portuguesa tradicional do nome.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: e todos os outros filhos do rei
  rationale: A expressão significa literalmente “e todos os filhos do rei”. Como Amnom já foi mencionado e também é filho do rei, “outros” torna explícita em português a relação inclusiva naturalmente entendida no hebraico.
