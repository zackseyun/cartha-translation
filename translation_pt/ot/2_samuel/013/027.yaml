    rationale: O hebraico diz literalmente «Amnom e todos os filhos do rei». A inclusão de Amnom no grupo pode parecer redundante em português, mas a tradução não deve transformar «todos» em «todos os outros», pois isso introduz uma exclusão não expressa no texto-fonte.
  - severity: low
    issue: A alternativa de nota «prevaleceu sobre ele» é pouco precisa em português neste contexto.
    rationale: Pode ser entendida como superioridade ou vitória. «Persuadiu-o» expressa mais naturalmente o possível efeito da insistência, enquanto a nota preserva a força de pressão persistente do idiomatismo hebraico.
