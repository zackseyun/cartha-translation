base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: pt
  text: Recabe e Baaná, filhos de Rimom, o beerotita, partiram e chegaram à casa de Isbosete no calor do dia, enquanto ele estava deitado para o descanso do meio-dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o deitar-se do meio-dia”, isto é, o descanso do meio-dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: Os filhos de Rimom, o beerotita
  rationale: בְּנֵי significa literalmente “filhos de”; como Recabe e Baaná são nomeados em seguida, o sentido familiar direto é o mais natural.
- source_word: רֵכָב וּבַעֲנָה
  choice: Recabe e Baaná
  rationale: As formas aportuguesadas preservam de modo reconhecível os nomes hebraicos.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: partiram e chegaram
  rationale: Mantém os dois movimentos sucessivos da narrativa, evitando a repetição pouco natural “foram e vieram” em português.
- source_word: כְּחֹם הַיּוֹם
  choice: no calor do dia
  rationale: Reproduz de perto a expressão hebraica e sua referência ao período quente do dia, sem reduzi-la interpretativamente a uma hora exata.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: à casa de Isbosete
  rationale: Tradução direta da cadeia construta, com forma portuguesa corrente do nome próprio.
- source_word: וְהוּא שֹׁכֵב
  choice: enquanto ele estava deitado
  rationale: Expressa naturalmente o valor circunstancial da oração no contexto da chegada dos homens.
- source_word: אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: para o descanso do meio-dia
  rationale: Comunica em português natural a expressão literalmente relacionada ao “deitar-se do meio-dia”, sem introduzir o tom informal e mais específico de “cochilo”.
