base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: pt
  text: Jônatas, filho de Saul, tinha um filho com deficiência nos pés.[a] O menino tinha cinco anos quando chegou de Jezreel a notícia a respeito de Saul e Jônatas. Sua cuidadora o pegou e fugiu. Quando ela se apressava para fugir, ele caiu e ficou manco. Seu nome era Mefibosete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com deficiência em ambos os pés». A expressão hebraica se refere literalmente a alguém atingido nos pés.'
    reason: Registra a possível explicitação do dual hebraico e preserva a formulação física literal sem impor um diagnóstico.
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: com deficiência nos pés
  rationale: Expressa de modo claro e respeitoso a limitação física indicada pelo hebraico, sem acrescentar uma causa ou diagnóstico. O plural רַגְלָיִם pode referir-se aos dois pés, possibilidade registrada na nota.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: tinha cinco anos
  rationale: Forma idiomática e exata de indicar idade em português.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן מִיִּזְרְעֶאל
  choice: quando chegou de Jezreel a notícia a respeito de Saul e Jônatas
  rationale: Mantém a relação temporal, o conteúdo geral da notícia e sua procedência, sem explicitar além do texto que se tratava da morte deles.
- source_word: אֹמַנְתּוֹ
  choice: sua cuidadora
  rationale: Designa naturalmente a mulher encarregada de cuidar e criar o menino; é mais imediatamente compreensível no português atual do que «ama».
- source_word: וַתִּשָּׂאֵהוּ
  choice: o pegou
  rationale: Representa o ato de levantar ou tomar a criança para levá-la durante a fuga, sem acrescentar detalhes não expressos.
- source_word: וַתָּנֹס ... לָנוּס
  choice: fugiu ... fugir
  rationale: Preserva a repetição lexical do hebraico e o sentido de fuga urgente.
- source_word: בְּחָפְזָהּ
  choice: Na pressa
  rationale: Conserva a circunstância de urgência associada à fuga em formulação natural.
- source_word: וַיִּפֹּל
  choice: ele caiu
  rationale: O verbo masculino singular aponta para o menino como sujeito, sem afirmar explicitamente que a cuidadora o deixou cair.
- source_word: וַיִּפָּסֵחַ
  choice: ficou manco
  rationale: Comunica o estado resultante da queda e o valor inceptivo/resultativo do verbo hebraico.
- source_word: מְפִיבֹשֶׁת
  choice: Mefibosete
  rationale: Transliteração tradicional e amplamente reconhecida em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Evitaram-se termos hoje potencialmente pejorativos para a deficiência. A coordenação hebraica foi vertida em períodos curtos para clareza narrativa, sem introduzir contraste ausente no original.
