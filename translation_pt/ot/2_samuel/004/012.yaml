  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: pt
  text: Então Davi ordenou aos jovens que os matassem. Eles lhes cortaram as mãos e os pés e os penduraram junto ao tanque[a], em Hebrom. Pegaram a cabeça de Is-Bosete e a sepultaram no túmulo de Abner, em Hebrom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: sobre o tanque. A preposição hebraica também pode indicar localização de modo mais geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד
  choice: Então Davi deu ordem
  rationale: O consecutivo narrativo faz a ação avançar; “então” expressa naturalmente a sequência, e “deu ordem” preserva a força de צוה em português corrente.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נְעָרִים pode designar jovens, servos ou auxiliares. “Os jovens” conserva o sentido lexical sem especificar uma função que o contexto não explicita.
- source_word: וַיַּהַרְגוּם
  choice: eles os mataram
  rationale: הרג é o verbo comum para matar; a formulação direta mantém a crueza da narrativa sem acrescentar interpretação judicial.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: cortaram-lhes as mãos e os pés
  rationale: קצץ significa cortar ou decep ar. A tradução preserva as duas partes do corpo mencionadas e usa uma construção portuguesa natural.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: os penduraram junto ao tanque
  rationale: תלה significa pendurar. ברכה designa aqui um tanque ou reservatório urbano. “Junto ao” toma עַל em sentido locativo geral, deixando em nota a possibilidade espacial mais estrita.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: A preposição portuguesa “em” indica naturalmente a localização tanto do tanque quanto do túmulo na cidade.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: a cabeça de Isbosete
  rationale: Tradução direta da cadeia construta, com o nome próprio vertido na forma portuguesa tradicional e legível.
- source_word: לָקָחוּ
  choice: pegaram
  rationale: לקח é o verbo comum “tomar/pegar”; “pegaram” é direto, atual e natural no português de ampla legibilidade brasileira.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: a sepultaram no túmulo de Abner
  rationale: O objeto pronominal retoma a cabeça. “Sepultaram” e “túmulo” dão dignidade adequada à referência funerária sem afastamento do hebraico.
theological_decisions:
- issue: Enquadramento moral e judicial da ordem de Davi
  choice: Relatar as ações de modo direto, sem acrescentar avaliação moral ou terminologia judicial não explícita.
  alternative: Empregar “executaram” ou explicar a ação como punição judicial.
  rationale: O versículo narra a ordem, a morte, a mutilação e a exposição dos homens, mas não apresenta nesta linha um comentário teológico explícito. A tradução preserva a tensão e a crueza do relato.
- issue: Relação entre a exposição dos homens e o sepultamento da cabeça de Isbosete
  choice: Manter a coordenação simples com “E”.
  alternative: Introduzir contraste explícito com “Mas” ou “porém”.
  rationale: O hebraico usa a conjunção וְ; embora o contexto possa sugerir contraste entre os tratamentos dados aos corpos, a tradução não o torna mais explícito do que o texto-fonte.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. “Tanque” foi preferido a “açude” ou “piscina” por representar melhor um reservatório urbano antigo. A colocação pronominal em “cortaram-lhes” e “a sepultaram” mantém clareza sem elevar excessivamente o registro.
