base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: pt
  text: 'Davi, porém, respondeu a Recabe e a Baaná, irmão de Recabe, filhos de Rimom, o beerotita, e lhes disse: “Tão certo como vive Yahweh, que resgatou a minha vida de toda aflição,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O verbo ענה nesta forma narrativa introduz a resposta de Davi; “respondeu” preserva naturalmente a fórmula do diálogo.
- source_word: רֵכָב
  choice: Recabe
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בַּעֲנָה
  choice: Baaná
  rationale: Transliteração clara do nome próprio, com acento gráfico para orientar a pronúncia em português.
- source_word: אָחִיו
  choice: seu irmão
  rationale: O singular com sufixo masculino singular identifica Baaná como irmão de Recabe; a formulação conserva essa relação sem a tornar plural.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: filhos de Rimom, o beerotita
  rationale: Preserva a filiação e o gentílico do hebraico; “beerotita” é uma formação portuguesa inteligível para alguém de Beerote.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Expressa em português corrente e solene a força da fórmula hebraica de juramento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: פָּדָה
  choice: resgatou
  rationale: “Resgatou” conserva a ideia de libertação mediante resgate associada a פדה e soa natural neste testemunho de livramento.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a própria pessoa de Davi em perigo, não especificamente uma alma imaterial.
- source_word: מִכָּל צָרָה
  choice: de toda aflição
  rationale: Reproduz tanto o sentido abrangente de כֹּל como a ideia de perigo, angústia ou adversidade de צָרָה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino. “Yahweh” mantém esse dado textual; “SENHOR” é a substituição tradicional por um título, mas não foi adotada no texto principal.
- issue: Sentido de פדה aplicado à vida de Davi
  choice: resgatou a minha vida
  alternative: livrou-me
  rationale: “Resgatou” mantém a força lexical de פדה sem exigir neste contexto uma teoria específica sobre o meio do resgate; “livrou-me” seria mais idiomático, porém lexicalmente menos marcado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa, preservando a identificação dos homens e a solenidade do juramento. O versículo termina com vírgula porque a declaração de Davi prossegue no versículo seguinte.
