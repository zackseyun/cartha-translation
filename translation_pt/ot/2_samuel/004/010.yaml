  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: pt
  text: 'Quando alguém me contou[a]: “Saul está morto!”, pensando que trazia boas notícias, eu o agarrei e o matei em Ziclague. Essa foi a recompensa que lhe dei pela notícia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “aquele que me contou, dizendo: ‘Saul está morto’, e que, aos seus próprios olhos, era como quem traz boas notícias”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é elíptica e irônica no hebraico: o mensageiro esperava receber pagamento pela notícia, mas a “recompensa” que recebeu foi a morte.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, introduz o caso anterior que Davi apresenta como fundamento para sua reação atual; o valor circunstancial-temporal é natural em português.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: alguém me contou
  rationale: O particípio substantivado significa literalmente “aquele que me contou”. “Alguém me contou” preserva o sentido em português corrente sem reproduzir desnecessariamente a fórmula hebraica “dizendo” antes da fala direta.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: “Saul está morto!”
  rationale: 'הִנֵּה chama a atenção para a informação; em português, a exclamação transmite essa força de modo mais natural do que “Eis que”. מֵת descreve o estado resultante: “está morto”.'
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: pensando que trazia boas notícias
  rationale: בְּעֵינָיו indica a avaliação do próprio mensageiro, e כִמְבַשֵּׂר o apresenta como portador de boas notícias. A formulação torna explícito o idioma sem eliminar a perspectiva subjetiva.
- source_word: וָאֹחֲזָה בוֹ
  choice: eu o agarrei
  rationale: אָחַז significa tomar ou segurar com firmeza. “Agarrei” é direto, atual e preserva a ação física anterior à morte.
- source_word: וָאֶהְרְגֵהוּ
  choice: e o matei
  rationale: Tradução direta do verbo הרג, sem acrescentar uma qualificação judicial que o hebraico não explicita.
- source_word: בְּצִקְלָג
  choice: em Ziclague
  rationale: Forma portuguesa tradicional e reconhecível do topônimo bíblico.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Essa foi a recompensa que lhe dei pela notícia
  rationale: A construção é elíptica e irônica. בְּשֹׂרָה pode relacionar-se à notícia anunciada e à recompensa esperada por ela; a tradução comunica a ironia sem tratá-la como formulação literal inequívoca.
theological_decisions:
- issue: Natureza da morte do mensageiro como recompensa
  choice: Manter a fala como descrição irônica da ação de Davi
  alternative: Explicitar que se tratou de uma execução judicial legítima
  rationale: O versículo relata que Davi o agarrou e matou, mas não usa aqui terminologia jurídica explícita. A tradução não deve importar uma avaliação denominacional ou moral além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a perspectiva subjetiva do mensageiro e a ironia da cláusula final. Todos os marcadores de nota aparecem no texto.
