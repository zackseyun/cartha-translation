source:
  edition: WLC
  text: אַ֞ף כִּֽי אֲנָשִׁ֣ים רְשָׁעִ֗ים הָרְג֧וּ אֶת אִישׁ צַדִּ֛יק בְּ/בֵית֖/וֹ עַל מִשְׁכָּב֑/וֹ וְ/עַתָּ֗ה הֲ/ל֨וֹא אֲבַקֵּ֤שׁ אֶת דָּמ/וֹ֙ מִ/יֶּדְ/כֶ֔ם וּ/בִעַרְתִּ֥י אֶתְ/כֶ֖ם מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: pt
  text: Quanto mais agora que homens perversos mataram um homem justo em sua própria casa, sobre a sua cama! Não devo eu, então, pedir contas a vocês pelo sangue dele[a] e eliminá-los da terra[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “exigir o sangue dele das mãos de vocês”; a expressão hebraica significa responsabilizar alguém pelo sangue derramado.
    reason: lexical_alternative
  - marker: b
    text: “Eliminá-los da terra” refere-se à remoção judicial dos assassinos, e não somente a uma purificação ritual.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Quanto mais quando
  rationale: No contexto, Davi passa do caso anterior, considerado menos grave, para este caso mais grave; a expressão introduz um argumento de maior razão.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: homens perversos
  rationale: Expressa de modo natural e direto a condenação moral contida em רְשָׁעִים.
- source_word: הָרְגוּ
  choice: mataram
  rationale: Traduz o verbo comum para matar sem acrescentar ao próprio verbo a qualificação jurídica de assassinato, embora o contexto indique homicídio traiçoeiro.
- source_word: אִישׁ צַדִּיק
  choice: um homem justo
  rationale: Mantém o valor lexical de צַדִּיק e o contraste moral entre a vítima e seus assassinos, sem reduzir o sentido apenas a 'inocente'.
- source_word: בְּבֵיתוֹ
  choice: dentro da própria casa
  rationale: Torna explícito, em português natural, o caráter agravante de o homem ter sido morto em seu espaço particular, conforme o sufixo possessivo hebraico.
- source_word: עַל מִשְׁכָּבוֹ
  choice: sobre a sua cama
  rationale: Reproduz diretamente a preposição עַל e o sentido usual de מִשְׁכָּב neste relato.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: não devo cobrar de vocês o sangue dele
  rationale: Preserva a imagem jurídica hebraica de exigir o sangue das mãos dos responsáveis, mas com uma formulação principal compreensível em português; a nota registra o idiomatismo literal.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: e eliminá-los da terra
  rationale: Comunica a remoção judicial dos homicidas. Aqui, בער não descreve apenas purificação ritual, mas a eliminação dos culpados por meio da pena.
theological_decisions:
- issue: Se a linguagem de responsabilidade pelo sangue deve ser convertida em vingança pessoal
  choice: Manter no texto a exigência do sangue como prestação de contas judicial
  alternative: vingar o sangue dele contra vocês
  rationale: A expressão hebraica é jurídica e atribui responsabilidade pelo derramamento de sangue; traduzi-la como vingança poderia estreitar indevidamente o sentido e sugerir mera retaliação pessoal.
- issue: Sentido da eliminação da terra
  choice: Entender como remoção judicial dos homicidas
  alternative: purificação meramente ritual
  rationale: O contexto imediato é a sentença de Davi contra os assassinos, de modo que a expressão aponta para sua eliminação da comunidade e da terra, não apenas para um ato cerimonial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação encerra a oração introduzida por “quanto mais”, e a pergunta retórica seguinte conserva a força judicial da fala de Davi. Os marcadores foram posicionados junto às expressões que cada nota efetivamente explica.
