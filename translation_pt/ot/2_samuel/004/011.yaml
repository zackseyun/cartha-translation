  source_fidelity: A tradução transmite corretamente o argumento de maior razão, a condenação dos agentes, a condição da vítima em sua casa e em sua cama, a responsabilização pelo sangue e a remoção judicial da terra. A formulação revista preserva mais claramente a progressão retórica hebraica e o valor jurídico do idiomatismo לגבי sangue.
  naturalness: “Quanto mais quando” é pouco natural como abertura de uma exclamação independente em português moderno. “Quanto mais agora que” torna explícita e fluente a inferência do caso anterior. “Pedir contas ... pelo sangue” é uma formulação jurídica portuguesa clara, enquanto a nota conserva a imagem literal hebraica.
  terminology: “Homens perversos”, “homem justo” e “sangue” são adequados. “Pedir contas ... pelo sangue” evita a leitura de que Davi exige literalmente o sangue físico dos culpados, sem converter o enunciado em simples vingança. “Eliminá-los da terra” mantém o sentido de remoção punitiva.
