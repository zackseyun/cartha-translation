  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: pt
  text: Quando o filho de Saul soube que Abner havia morrido em Hebrom, suas mãos ficaram sem forças[a], e todo o Israel ficou alarmado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que pode indicar perda de força ou de coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: o filho de Saul
  rationale: Mantém a identificação indireta de Is-Bosete presente no hebraico, sem inserir no texto um nome próprio que não aparece neste versículo.
- source_word: כִּי מֵת אַבְנֵר
  choice: que Abner havia morrido
  rationale: כִּי introduz o conteúdo do que foi ouvido, e o mais-que-perfeito expressa naturalmente que a morte ocorreu antes de Saul ser informado.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: Representa o uso locativo normal da preposição בְּ com o nome do lugar e emprega a forma portuguesa tradicional do topônimo.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: suas mãos ficaram sem forças
  rationale: Preserva a imagem corporal do hebraico, na qual as mãos se tornam frouxas ou fracas, sem limitar a expressão exclusivamente à perda de coragem.
- source_word: כָל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Conserva a designação nacional coletiva do texto hebraico.
- source_word: נִבְהָלוּ
  choice: ficou alarmado
  rationale: Expressa o estado de perturbação e temor indicado pelo verbo, com concordância natural para o sujeito coletivo 'todo o Israel'.
