base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: pt
  text: Eles entraram na casa enquanto ele estava deitado em sua cama, no quarto onde dormia[a]. Então o golpearam e o mataram. Depois, removeram-lhe a cabeça[b], pegaram a cabeça e seguiram pelo caminho da Arabá durante toda a noite.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no seu quarto de dormir”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “separaram-lhe a cabeça do corpo”; o verbo hebraico significa literalmente retirar ou remover, e o contexto indica a decapitação.'
    reason: lexical_alternative
  - marker: c
    text: A Arabá é a região de vale e planície da grande depressão que inclui o vale do Jordão; o hebraico emprega aqui um nome geográfico.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: entraram na casa
  rationale: O verbo בוא com הַבַּיִת indica movimento para dentro da casa; “entraram” é direto e natural em português.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: enquanto ele estava deitado em sua cama
  rationale: A oração é circunstancial; “enquanto” explicita naturalmente a simultaneidade sem alterar o sentido.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: no quarto onde dormia
  rationale: Preserva o sentido concreto da construção hebraica e evita que o moderno “quarto” seja entendido de modo excessivamente específico.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: o golpearam e o mataram
  rationale: 'Mantém os dois verbos e sua sequência: primeiro o golpe violento, depois a declaração explícita de que lhe causaram a morte.'
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: separaram-lhe a cabeça do corpo
  rationale: O hifil de סור significa retirar ou remover; no contexto, trata-se de decapitação. A formulação comunica isso sem fazer de “cortar” o sentido lexical explícito do verbo.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: pegaram a cabeça
  rationale: Traduz o sentido comum de לקח e conserva a repetição enfática de “cabeça” presente no hebraico.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: pelo caminho da Arabá
  rationale: Mantém tanto a ideia de rota expressa por דֶּרֶךְ quanto o nome geográfico Arabá.
- source_word: כָּל הַלַּיְלָה
  choice: durante toda a noite
  rationale: Expressão idiomática e fiel à duração indicada no hebraico.
