  source_fidelity: 'A tradução reproduz corretamente a relação sintática principal: o filho de Saul tinha dois comandantes, Baaná e Recabe, ambos filhos de Rimom, o beerotita, e vinculados à tribo de Benjamim. A explicação final sobre Beerote também está fiel ao nifal de חשב e à ideia de pertencimento tribal. A revisão apenas torna mais idiomática a designação dos grupos armados e torna a expressão tribal menos parafrástica.'
