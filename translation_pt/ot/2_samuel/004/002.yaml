  terminology: As formas Baaná, Recabe, Rimom, Beerote e Benjamim são adequadas em português. “Beerotita” é um gentílico transparente. A nota alternativa é válida, mas sua âncora deve acompanhar a expressão à qual se refere, não ficar no fim do versículo.
