source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: pt
  text: 'O filho de Saul tinha dois homens que eram comandantes de bandos de incursão: um se chamava Baaná, e o outro, Recabe. Eram filhos de Rimom, o beerotita, e eram dos filhos de Benjamim, pois Beerote também era considerada[a] parte de Benjamim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era contada como pertencente a Benjamim”.'
    reason: Registra uma alternativa formal para תֵּחָשֵׁב עַל e preserva a nuance de inclusão ou atribuição tribal.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dois homens
  rationale: Expressa naturalmente o masculino plural e identifica dois indivíduos do sexo masculino.
- source_word: שָׂרֵי גְדוּדִים
  choice: comandantes de grupos de ataque
  rationale: שָׂרֵי indica chefes ou comandantes, enquanto גְדוּדִים designa grupos armados, frequentemente associados a incursões; a formulação evita sugerir unidades formais de um exército regular.
- source_word: בֶן שָׁאוּל
  choice: O filho de Saul
  rationale: Mantém a expressão singular e sua referência contextual a Isbosete, mencionado no versículo anterior, sem inserir o nome ausente no hebraico deste versículo.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: um se chamava ... e o outro
  rationale: Reproduz em português natural a fórmula hebraica de identificação dos dois homens, sem a rigidez de 'o nome de um... e o nome do segundo'.
- source_word: בְּנֵי רִמּוֹן
  choice: Eram filhos de Rimom
  rationale: Preserva a filiação comum de Baaná e Recabe e evita uma ligação sintática ambígua em português.
- source_word: הַבְּאֶרֹתִי
  choice: o beerotita
  rationale: Verte o gentílico derivado de Beerote com uma forma portuguesa transparente.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: pertenciam aos filhos de Benjamim
  rationale: Conserva a linguagem tribal de 'filhos de Benjamim' e esclarece que a expressão identifica a filiação tribal, não uma descendência imediata.
- source_word: כִּי גַּם
  choice: pois ... também
  rationale: Introduz de modo natural a explicação de por que esses beerotitas são associados a Benjamim.
- source_word: בְּאֵרוֹת
  choice: Beerote
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: era considerada parte de Benjamim
  rationale: O nifal de חשׁב expressa ser considerado ou computado, e עַל neste contexto indica associação territorial ou tribal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A conjunção inicial וּ não recebeu um marcador temporal como “Ora” ou “Então”, pois funciona aqui como conexão narrativa. A divisão em duas frases reduz a sobrecarga sintática sem alterar as relações do texto hebraico.
