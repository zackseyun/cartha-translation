  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: pt
  text: E ali chegaram ao interior da casa, pegando trigo, e o feriram no ventre[a]. Depois, Recabe e Baaná, seu irmão, escaparam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, «debaixo da quinta costela». A expressão hebraica provavelmente se refere, de modo mais geral, ao abdômen ou ventre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: E ali
  rationale: Preserva o valor dêitico e a progressão narrativa sem recorrer ao arcaizante «e eis que».
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: chegaram ao interior da casa
  rationale: Expressa o movimento até a parte interna da casa de maneira natural e próxima da construção hebraica.
- source_word: לֹקְחֵי חִטִּים
  choice: pegando trigo
  rationale: Mantém a forma participial e a concisão da frase elíptica, sem tornar explícita a interpretação de que o trigo servia de pretexto para a entrada.
- source_word: וַיַּכֻּהוּ
  choice: o feriram
  rationale: Representa o verbo amplo «golpear/ferir» sem antecipar lexicalmente a morte narrada pelo contexto.
- source_word: אֶל הַחֹמֶשׁ
  choice: no ventre
  rationale: O substantivo designa provavelmente a região abdominal; «ventre» é claro, digno e evita transformar a tradução tradicional da expressão em precisão anatômica.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Depois, Recabe e Baaná, seu irmão
  rationale: Translitera os nomes em formas portuguesas reconhecíveis e usa «Depois» para marcar naturalmente a sequência narrativa.
- source_word: נִמְלָטוּ
  choice: escaparam
  rationale: Traduz diretamente o sentido do nifal de מלט, isto é, conseguir fugir ou escapar.
theological_decisions: []
