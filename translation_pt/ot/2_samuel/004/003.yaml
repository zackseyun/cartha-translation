  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: pt
  text: Mas os beerotitas fugiram para Gitaim e têm vivido ali como estrangeiros residentes até hoje[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm vivido ali como estrangeiros até hoje”. “Estrangeiros residentes” explicita que viviam ali como pessoas não nativas estabelecidas no local.'
    reason: Alternativa lexical para גָּרִים; a expressão principal preserva sua nuance de residência como não nativos.
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: fugiram
  rationale: O qal wayyiqtol de ברח indica fuga; o pretérito perfeito acompanha naturalmente a sequência hebraica sem impor um valor de mais-que-perfeito.
- source_word: הַבְּאֵרֹתִים
  choice: os beerotitas
  rationale: Forma gentílica plural que designa os habitantes ou naturais de Beerote; a transliteração gentílica é concisa e adequada ao registro bíblico.
- source_word: גִּתָּיְמָה
  choice: para Gitaim
  rationale: O nome do lugar recebe o ה direcional, que expressa movimento em direção a Gitaim; em português, isso se traduz naturalmente com “para”.
- source_word: וַיִּהְיוּ שָׁם
  choice: têm vivido ali
  rationale: A construção introduz uma situação iniciada no passado e prolongada até o presente do narrador; o pretérito perfeito composto comunica essa continuidade em português.
- source_word: גָּרִים
  choice: como estrangeiros
  rationale: O particípio de גור descreve pessoas que residem fora de sua comunidade ou terra de origem, sem plena condição nativa. “Estrangeiros” preserva o núcleo social da expressão em linguagem corrente.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente idiomático moderno da fórmula hebraica que estende a situação até o tempo do narrador.
- source_word: וַ
  choice: Mas
  rationale: A conjunção introduz uma observação explicativa com leve contraste em relação ao contexto anterior; “Mas” torna essa relação discursiva clara.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se os topônimos e gentílicos tradicionais em forma transliterada. A construção “têm vivido” exprime a continuidade até o presente do narrador, enquanto a nota preserva a nuance social e residencial de גָּרִים.
