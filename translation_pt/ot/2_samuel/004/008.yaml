source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: pt
  text: 'Eles levaram a cabeça de Isbosete a Davi, em Hebrom, e disseram ao rei: “Aqui está a cabeça de Isbosete, filho de Saul, seu inimigo, que procurou tirar-lhe a vida. Hoje, Yahweh concedeu ao meu senhor, o rei, vingança[a] contra Saul e contra a sua descendência.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “vinganças”, no plural, podendo indicar vingança em sentido intensivo ou atos de vingança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Eles levaram
  rationale: O wayyiqtol de בוא dá continuidade à narrativa. Em português, “levaram” expressa naturalmente o transporte da cabeça até Davi, sem necessidade de reproduzir a conjunção inicial.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: a cabeça de Isbosete
  rationale: רֹאשׁ designa literalmente a cabeça física; “Isbosete” translitera a forma massorética do nome presente no versículo.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: הִנֵּה
  choice: Aqui está
  rationale: Reproduz a função dêitica de apresentação de modo atual e natural, sem o tom arcaico de “eis”.
- source_word: אֹיִבְךָ אֲשֶׁר בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: seu inimigo, que procurou tirar-lhe a vida
  rationale: “Tirar-lhe a vida” comunica claramente o sentido do idioma hebraico com נֶפֶשׁ. A estrutura mantém aberta a referência sintática do relativo, sem inserir uma identificação interpretativa no texto.
- source_word: וַיִּתֵּן יְהוָה
  choice: Yahweh concedeu
  rationale: O verbo descreve a ação divina que os assassinos alegam já ter ocorrido; “concedeu” combina naturalmente com “vingança”. O nome divino é transliterado como “Yahweh”.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: ao meu senhor, o rei
  rationale: Preserva a forma de tratamento cortesã e o sufixo de primeira pessoa singular, distinguindo o senhor humano do nome divino.
- source_word: נְקָמוֹת
  choice: vingança
  rationale: O substantivo aparece no plural hebraico e pode indicar vingança em sentido intensivo ou atos de vingança; o singular coletivo é mais natural em português, com a forma da fonte registrada em nota.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: contra Saul e contra a sua descendência
  rationale: A preposição é traduzida conforme a regência portuguesa de “vingança”; זֶרַע refere-se coletivamente aos descendentes de Saul.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Javé
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Atribuição da vingança a Yahweh pelos assassinos
  choice: Manter a afirmação sem qualificadores, dentro do discurso direto
  alternative: Acrescentar linguagem que indique aprovação divina apenas alegada
  rationale: A frase registra a alegação dos assassinos, não uma avaliação explícita do narrador. A reação de Davi no contexto seguinte fornece a avaliação narrativa; inseri-la aqui anteciparia e interpretaria o texto.
- issue: Referente de “seu inimigo, que procurou tirar-lhe a vida”
  choice: Preservar a construção potencialmente ambígua
  alternative: Identificar explicitamente Saul como o inimigo que tentou matar Davi
  rationale: A história favorece Saul como referente, mas a sequência hebraica permite tensão sintática. A tradução evita resolver silenciosamente essa relação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Foram preferidas formas correntes como “Aqui está” e “tirar-lhe a vida”, mantendo o caráter solene do discurso dirigido ao rei.
