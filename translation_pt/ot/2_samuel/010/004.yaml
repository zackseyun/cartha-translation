base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: pt
  text: Então Hanum pegou os servos de Davi, raspou metade da barba de cada um, cortou-lhes as roupas ao meio, até as nádegas[a], e os mandou embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até a região do assento” ou “até as partes íntimas”. O termo hebraico é raro, e a referência anatômica exata é discutida. O sentido é que Hanum os expôs de maneira vergonhosa ao cortar suas roupas muito curtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O verbo לקח tem aqui seu sentido narrativo básico. “Pegou” é claro e não acrescenta a força de “capturou” ou “prendeu”.
- source_word: עַבְדֵי דָוִד
  choice: os servos de Davi
  rationale: עבד pode designar escravo, servo ou oficial. Neste contexto, trata-se de emissários a serviço do rei; “servos” preserva a amplitude do termo sem sugerir necessariamente escravidão.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: raspou metade da barba de cada um
  rationale: גלח significa raspar ou barbear. A formulação deixa claro que Hanum raspou metade da barba de cada homem, como ato deliberado de humilhação.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם
  choice: cortou as roupas deles
  rationale: כרת expressa cortar, frequentemente com a ideia de separar uma parte, e מַדְוִים designa peças de roupa sem especificar com segurança seu tipo exato.
- source_word: בַּחֵצִי
  choice: pela metade
  rationale: A expressão indica que as roupas foram cortadas no meio ou no ponto intermediário. “Pela metade” é natural em português e mantém essa noção.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: até a altura das nádegas
  rationale: שְׁתוֹת é um termo raro, provavelmente referente às nádegas, ao assento do corpo ou à região íntima. A tradução principal comunica de modo direto a exposição vergonhosa, enquanto a nota preserva a incerteza lexical.
- source_word: וַיְשַׁלְּחֵם
  choice: os mandou embora
  rationale: שלח significa aqui enviar ou despedir depois da humilhação. “Mandou embora” é corrente e preserva o fluxo narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão “de cada um” explicita naturalmente que metade da barba de cada emissário foi raspada. A nota foi colocada junto ao termo anatômico raro a que se refere.
