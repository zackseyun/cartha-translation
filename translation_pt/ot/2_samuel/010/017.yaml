  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: pt
  text: Quando isso foi comunicado a Davi, ele reuniu todo o Israel, atravessou o Jordão e chegou a Helã. Então os arameus se posicionaram em formação de batalha para enfrentar Davi e lutaram contra ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Quando isso foi comunicado a Davi
  rationale: Preserva a construção passiva e impessoal do hebraico, sem identificar quem levou a notícia. O demonstrativo retoma naturalmente os acontecimentos anteriores, e «quando» expressa a ligação narrativa.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: ele reuniu todo o Israel
  rationale: Mantém o coletivo amplo «Israel» sem acrescentar «exército», embora o contexto seja de mobilização militar.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: atravessou o Jordão
  rationale: Equivalência direta e idiomática para o movimento de cruzar o rio.
- source_word: וַיָּבֹא חֵלָמָה
  choice: e chegou a Helã
  rationale: O ה direcional indica movimento rumo ao lugar; no contexto, «chegou a» comunica naturalmente a chegada sem sugerir necessariamente entrada na cidade.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Então os arameus se posicionaram em formação de batalha
  rationale: O verbo tem sentido militar de dispor ou alinhar tropas. O coletivo geográfico «Aram» é expresso naturalmente em português por «os arameus».
- source_word: לִקְרַאת דָּוִד
  choice: para enfrentar Davi
  rationale: A locução significa ir ao encontro de alguém; no contexto inequivocamente hostil, «enfrentar» transmite de modo claro e natural a finalidade do encontro.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: e lutaram contra ele
  rationale: Embora a construção hebraica use literalmente «com ele», trata-se de um idioma que indica combate contra um oponente. «Contra ele» evita a ambiguidade moderna de cooperação ou aliança.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a sequência narrativa hebraica sem rigidez excessiva. «Helã» segue a adaptação portuguesa usual do topônimo; «arameus» evita o caráter menos natural de usar «Aram» como sujeito coletivo em português.
