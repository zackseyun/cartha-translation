  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: pt
  text: Quando Davi ouviu, enviou Joabe e todo o exército dos guerreiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o exército, isto é, os guerreiros”. A expressão hebraica pode apresentar “os guerreiros” como explicação de “o exército” ou como especificação: “o exército dos guerreiros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Quando Davi soube disso
  rationale: O Qal wayyiqtol de שׁמע significa que Davi ouviu ou tomou conhecimento. “Quando” expressa naturalmente a sequência narrativa em português, e “disso” retoma o acontecimento do contexto sem especificá-lo além do que o discurso permite.
- source_word: וַיִּשְׁלַח אֶת יוֹאָב
  choice: enviou Joabe
  rationale: שׁלח significa normalmente “enviar”. A partícula de objeto direto אֶת não recebe tradução, e o nome é vertido pela forma portuguesa corrente “Joabe”.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: e todo o exército
  rationale: צָבָא designa aqui uma força militar. “Todo o exército” é claro, atual e reproduz כָּל sem recorrer ao arcaico “hoste”.
- source_word: הַגִּבֹּרִים
  choice: de guerreiros
  rationale: גִּבּוֹרִים pode designar homens valentes, guerreiros ou combatentes de destaque. “Guerreiros” é natural no contexto militar e evita afirmar, sem necessidade, que se tratava formalmente de uma tropa de elite.
