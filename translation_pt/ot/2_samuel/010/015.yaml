  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: pt
  text: Quando Arã viu que tinha sido derrotado diante de Israel[a], os arameus se reuniram em conjunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Arã viu que havia sido derrotado diante de Israel, e eles se reuniram em conjunto.” O hebraico emprega o nome próprio singular “Arã” coletivamente para se referir aos arameus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando ... viu
  rationale: O wayyiqtol dá continuidade à narrativa; em português, “Quando” expressa naturalmente a relação temporal com a ação seguinte, sem perder o sentido de ראה, “ver”.
- source_word: אֲרָם
  choice: Arã
  rationale: Preserva o nome próprio hebraico do povo e território. Embora seja singular na forma, aqui tem sentido coletivo; por clareza, a oração seguinte explicita “os arameus”.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo percebido por Arã: que tinha sido derrotado, e não uma oração causal.'
- source_word: נִגַּף
  choice: tinha sido derrotado
  rationale: O nifal de נגף, neste contexto militar, indica sofrer derrota. A formulação é clara e não especifica além do hebraico o modo da derrota.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém a imagem hebraica de derrota “diante de” Israel e é uma expressão natural em português no contexto de confronto.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio.
- source_word: וַיֵּאָסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף significa reunir-se ou ajuntar-se. “Se reuniram” é corrente e evita a interpretação militar mais específica de “se reagruparam”.
- source_word: יָחַד
  choice: juntos
  rationale: O advérbio significa “juntos”; sua ideia já é transmitida naturalmente pela construção reflexiva plural “se reuniram”, evitando a redundância pouco idiomática “se reuniram juntos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Arã” preserva o nome próprio, enquanto “os arameus” torna claro o referente plural do verbo hebraico. A tradução evita “Síria”, termo historicamente posterior, e não acrescenta a noção interpretativa de que eles “se reagruparam” militarmente.
