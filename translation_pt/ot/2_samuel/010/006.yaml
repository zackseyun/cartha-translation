revisions:
- from: Quando os filhos de Amom viram que haviam se tornado repugnantes para Davi[a], mandaram contratar vinte mil soldados de infantaria dos arameus de Bete-Reobe e dos arameus de Zobá, mil homens do rei de Maaca e doze mil homens de Tobe[b].
  to: Quando os filhos de Amom viram que haviam se tornado odiosos para Davi[a], mandaram contratar vinte mil soldados de infantaria dos arameus de Bete-Reobe e dos arameus de Zobá, o rei de Maaca, com mil homens, e doze mil homens de Tobe[b].
  rationale: A revisão torna explícita, por meio da aposição «o rei de Maaca, com mil homens», a coordenação dos contingentes no hebraico. Também substitui uma transliteração alternativa imprecisa e ajusta levemente a expressão idiomática referente à hostilidade para uma formulação portuguesa mais natural, mantendo a imagem literal em nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:22:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'A enumeração dos contingentes, os números e a identificação dos arameus correspondem ao hebraico. Contudo, «mil homens do rei de Maaca» pode significar em português que os mil homens pertenciam ao rei, em vez de reproduzir a coordenação hebraica: contrataram «o rei de Maaca, [com] mil homens».'
  naturalness: O texto é claro e de registro adequado. «Mandaram contratar» é uma solução portuguesa natural para a sequência hebraica «enviaram e contrataram», cujo objeto de «enviaram» não é expresso.
  terminology: «Arameus», «Bete-Reobe», «Zobá», «Maaca» e «Tobe» são formas adequadas. «Odiosos para Davi» expressa com maior naturalidade a força idiomática de נבאשׁוּ, preservando a alternativa literal em nota. A leitura alternativa deve ser transliterada consistentemente como «Ish-Tobe».
  issues:
  - severity: medium
    issue: Ambiguidade sintática em «mil homens do rei de Maaca»
    rationale: O hebraico lista o rei de Maaca e mil homens como o contingente contratado. A formulação atual pode ser lida apenas como «mil homens pertencentes ao rei», sem deixar claro que o rei é também um elemento da lista. «O rei de Maaca, com mil homens» resolve isso sem acrescentar informação substancial.
  - severity: low
    issue: Transliteração inconsistente da leitura alternativa na nota b
    rationale: «Is-Tobe» não representa bem a consoante inicial de איש. «Ish-Tobe» é uma transliteração mais reconhecível e coerente para a leitura alternativa do composto.
  revised_text: Quando os filhos de Amom viram que haviam se tornado odiosos para Davi[a], mandaram contratar vinte mil soldados de infantaria dos arameus de Bete-Reobe e dos arameus de Zobá, o rei de Maaca, com mil homens, e doze mil homens de Tobe[b].
