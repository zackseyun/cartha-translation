    reason: alternative_reading
  revision_rationale: A revisão torna explícita, por meio da aposição «o rei de Maaca, com mil homens», a coordenação dos contingentes no hebraico. Também substitui uma transliteração alternativa imprecisa e ajusta levemente a expressão idiomática referente à hostilidade para uma formulação portuguesa mais natural, mantendo a imagem literal em nota.
