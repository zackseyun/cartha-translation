  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: pt
  text: Quando os filhos de Amom viram que haviam se tornado odiosos para Davi[a], mandaram contratar vinte mil soldados de infantaria dos arameus de Bete-Reobe e dos arameus de Zobá, o rei de Maaca, com mil homens, e doze mil homens de Tobe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “haviam se tornado um mau cheiro para Davi”.'
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “Ish-Tobe”, entendido como nome de lugar ou de clã; aqui, a expressão é traduzida como “homens de Tobe”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido básico de ראה e a construção narrativa “viram que”, que em português também pode indicar reconhecimento da situação.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Reproduz de modo claro a expressão hebraica, embora “amonitas” também fosse uma alternativa idiomática.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: haviam se tornado repugnantes para Davi
  rationale: Comunica o valor idiomático de באשׁ, que literalmente evoca mau cheiro e, neste contexto, indica terem se tornado ofensivos ou detestáveis para Davi.
- source_word: וַיִּשְׁלְחוּ וַיִּשְׂכְּרוּ
  choice: mandaram contratar
  rationale: A combinação verbal portuguesa expressa naturalmente o envio implícito de agentes para contratar tropas, sem inserir explicitamente “mensageiros” no texto.
- source_word: אֲרַם בֵּית רְחוֹב וְאֶת אֲרַם צוֹבָא
  choice: dos arameus de Bete-Reobe e dos arameus de Zobá
  rationale: “Arameus” representa diretamente o etnônimo hebraico אֲרַם; os topônimos são transliterados em forma legível em português.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: vinte mil soldados de infantaria
  rationale: רַגְלִי designa tropas que combatem a pé; “soldados de infantaria” é atual, claro e mantém o registro militar.
- source_word: מֶלֶךְ מַעֲכָה אֶלֶף אִישׁ
  choice: mil homens do rei de Maaca
  rationale: A relação de construto identifica o rei da região de Maaca, acompanhado por mil homens.
- source_word: אִישׁ טוֹב
  choice: homens de Tobe
  rationale: No contexto da enumeração militar, a expressão é entendida como referência aos homens provenientes de Tobe; a leitura “Is-Tobe” permanece possível e é registrada em nota.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: doze mil homens
  rationale: Tradução direta da contagem hebraica, preservando o estilo militar do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi levemente reorganizada para evitar a construção pouco natural “enviaram e contrataram”, sem alterar a sequência dos contingentes. Empregam-se “arameus”, historicamente mais preciso que o tradicional “sírios”, e formas portuguesas correntes dos topônimos.
