base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: pt
  text: Então Joabe e o povo que estava com ele avançaram para a batalha contra Arã[a], e os arameus fugiram dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Arã”; isto é, as forças arameias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: avançaram
  rationale: Embora o verbo נגשׁ signifique literalmente “aproximar-se”, a combinação com לַמִּלְחָמָה, em contexto militar, descreve o avanço para entrar em combate.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: e o povo que estava com ele
  rationale: Mantém o sentido básico de עָם e a estrutura do hebraico; no contexto, trata-se dos combatentes sob o comando de Joabe.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Expressa naturalmente em português o movimento e a finalidade de entrar em combate.
- source_word: בַּאֲרָם
  choice: contra Arã
  rationale: Preserva o nome próprio hebraico, enquanto a preposição é entendida em sentido hostil no contexto da batalha.
- source_word: וַיָּנֻסוּ
  choice: os arameus fugiram
  rationale: נוּס significa “fugir”. O sujeito implícito é explicitado para evitar, em português, a possível leitura de que Joabe e seu povo fugiram.
- source_word: מִפָּנָיו
  choice: dele
  rationale: A expressão hebraica indica fugir da presença ou diante de alguém; “fugiram dele” é natural e conserva Joabe como referente do sufixo singular.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem e o conteúdo do hebraico foram preservados, mas o sujeito elíptico de “fugiram” foi explicitado para impedir ambiguidade referencial não pretendida.
