base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: pt
  text: Os arameus fugiram diante de Israel, e Davi matou, entre os arameus, setecentos homens dos carros de guerra[a] e quarenta mil cavaleiros. Também feriu Sobaque, comandante do exército dele[b], que morreu ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “setecentos carros” ou “setecentos da força de carros”. O referente exato pode ser o contingente dos carros, daí “homens dos carros de guerra”. Em 1 Crônicas 19:18, consta “sete mil carros”.'
    reason: textual_variant
  - marker: b
    text: O hebraico traz “seu exército”, com sufixo singular. O referente desse sufixo não é explicitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Os arameus fugiram diante de Israel
  rationale: אֲרָם designa coletivamente Arã ou os arameus; em português, o gentílico plural torna a ação coletiva natural. מִפְּנֵי expressa fuga diante do inimigo.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: Davi matou
  rationale: הרג significa diretamente matar; a formulação é clara e preserva a distinção em relação a נכה mais adiante.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: setecentos homens dos carros de guerra
  rationale: רֶכֶב pode indicar carro ou força de carros. Como se trata de mortos em combate, a tradução explicita com cautela o referente humano sem alterar o número nem ocultar a dificuldade textual.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: quarenta mil cavaleiros arameus
  rationale: פָּרָשִׁים são cavaleiros ou tropas de cavalaria. A repetição de 'arameus' esclarece em português que ambos os grupos pertenciam a Arã.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Sobaque
  rationale: Transliteração portuguesa legível do nome próprio conforme a vocalização massorética.
- source_word: שַׂר צְבָאוֹ
  choice: comandante do exército dele
  rationale: שַׂר, no contexto militar, é 'comandante', e צָבָא é 'exército'. 'Dele' conserva o sufixo singular hebraico, embora seu referente permaneça contextualmente discutível.
- source_word: הִכָּה
  choice: feriu
  rationale: נכה pode significar ferir, golpear ou abater. 'Feriu', seguido de 'morreu ali', preserva a sequência do texto e evita fundir o golpe com a morte.
- source_word: וַיָּמָת שָׁם
  choice: e ele morreu ali
  rationale: Tradução direta, sem acrescentar que a morte foi instantânea ou ocorreu especificamente em batalha.
