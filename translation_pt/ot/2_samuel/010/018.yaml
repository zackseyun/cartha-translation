  register: Português moderno, digno e acessível, com vocabulário militar corrente. A tradução mantém a dificuldade de רֶכֶב em nota e conserva no texto o sufixo singular de צְבָאוֹ, sem harmonizá-lo silenciosamente com o coletivo 'arameus'.
