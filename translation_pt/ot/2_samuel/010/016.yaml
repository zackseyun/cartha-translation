base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: pt
  text: Hadadezer mandou chamar os arameus que estavam além do Rio[a] e os fez sair. Eles chegaram a Helã, tendo à frente Sobaque[b], comandante do exército de Hadadezer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, além do rio Eufrates.
    reason: cultural_note
  - marker: b
    text: Também transliterado como “Sobac”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “diante deles”; no contexto militar, provavelmente significa que ele os liderava ou marchava à frente deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou buscar
  rationale: No encadeamento com o hifil seguinte, expressa naturalmente em português que Hadadezer enviou uma ordem ou mensageiros para mobilizar os arameus, sem acrescentar um objeto não expresso no hebraico.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: e os fez sair para a batalha
  rationale: Preserva a força causativa do hifil de יצא. A expressão 'para a batalha' explicita o sentido militar contextual, sem substituir o verbo por uma paráfrase como 'mobilizou'.
- source_word: אֲרָם
  choice: os arameus
  rationale: Neste contexto, o termo designa as forças ou o povo arameu, não apenas a região de Arã. 'Arameus' evita a associação anacrônica que 'sírios' poderia produzir.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: além do Rio
  rationale: Mantém a formulação hebraica, que diz literalmente 'além do Rio'; a identificação provável com o Eufrates fica em nota.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: Eles chegaram a Helã
  rationale: Trata חֵילָם como topônimo, conforme o contexto e a tradição textual, usando uma transliteração adaptada à ortografia portuguesa.
- source_word: וְשׁוֹבַךְ
  choice: Sobá
  rationale: Transliteração portuguesa natural de שׁוֹבַךְ; a variante 'Sobaque' é registrada em nota.
- source_word: שַׂר צְבָא
  choice: comandante do exército
  rationale: Equivalente militar claro, atual e fiel à expressão hebraica.
- source_word: לִפְנֵיהֶם
  choice: tendo à frente
  rationale: Expressa naturalmente o sentido espacial literal de 'diante deles' e sua provável implicação militar de liderança.
