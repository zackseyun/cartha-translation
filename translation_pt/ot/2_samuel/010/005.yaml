base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: pt
  text: 'Quando informaram Davi, ele enviou alguém ao encontro deles[a], pois os homens estavam profundamente humilhados[b]. Então o rei disse: “Fiquem em Jericó até que a barba de vocês cresça; depois, voltem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “enviou ao encontro deles”. O texto não identifica quem Davi enviou.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “profundamente envergonhados” ou “muito desonrados”. O termo hebraico enfatiza a vergonha ou humilhação sofrida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Quando informaram Davi
  rationale: O hifil de נגד significa informar, contar ou relatar. O sujeito permanece indefinido, como no hebraico, e a construção temporal liga naturalmente esta ação ao envio feito por Davi.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: ele mandou alguém ao encontro deles
  rationale: A expressão hebraica diz literalmente que Davi 'enviou ao encontro deles', sem identificar quem foi enviado. Em português, 'mandou alguém' torna explícito apenas o participante necessariamente implícito na ação e evita a especificação não textual de 'mensageiros'.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual Davi enviou alguém ao encontro dos homens e mantém um fluxo narrativo digno e natural.
- source_word: נִכְלָמִים מְאֹד
  choice: profundamente humilhados
  rationale: O particípio nifal de כלם descreve pessoas submetidas à vergonha ou desonra, e מְאֹד intensifica esse estado. 'Profundamente humilhados' preserva a dimensão pública e passiva da afronta.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: '''Então'' apresenta com naturalidade a sequência narrativa, enquanto ''o rei'' conserva o título explícito do texto hebraico.'
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Fiquem em Jericó
  rationale: Neste contexto, ישׁב significa permanecer temporariamente. 'Fiquem em Jericó' é português atual e adequado para uma cidade.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: até que a barba de vocês cresça de novo
  rationale: צמח significa brotar ou crescer. Embora זְקַנְכֶם tenha forma singular coletiva, refere-se à barba de cada homem; a formulação portuguesa preserva esse uso distributivo. 'De novo' comunica a clara ideia contextual de crescimento após a barba ter sido cortada.
- source_word: וְשַׁבְתֶּם
  choice: depois, voltem
  rationale: שׁוב significa voltar ou retornar. 'Depois' explicita em português a sequência temporal já indicada por 'até' e pela conjunção hebraica.
