  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: pt
  text: Quando todos os reis que serviam a Hadadezer viram que tinham sido derrotados diante de Israel, fizeram as pazes com Israel e passaram a servi-lo. Assim, os arameus ficaram com medo de voltar a socorrer os amonitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: que serviam a Hadadezer
  rationale: Expressa naturalmente a relação de vassalagem ou submissão indicada pelo substantivo hebraico, sem sugerir necessariamente serviço doméstico.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: fizeram as pazes com Israel
  rationale: O verbo no hifil, com אֶת, tem aqui o sentido contextual de estabelecer paz com alguém.
- source_word: וַיַּעַבְדוּם
  choice: passaram a servi-lo
  rationale: Mantém o sentido político de sujeição a Israel; o singular retoma o nome coletivo Israel, conforme a gramática portuguesa.
- source_word: אֲרָם
  choice: os arameus
  rationale: Embora a forma hebraica seja o nome coletivo ou territorial 'Arã', neste contexto refere-se aos agentes arameus e concorda com o verbo plural.
- source_word: לְהוֹשִׁיעַ
  choice: socorrer
  rationale: Preserva a ideia de acudir ou livrar militarmente os amonitas, com formulação natural em português.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: Equivalente gentílico corrente para a expressão literal 'filhos de Amom'.
