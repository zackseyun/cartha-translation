base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: pt
  text: Então os filhos de Amom[a] saíram e se puseram em formação de batalha à entrada do portão, enquanto Aram de Zobá, Reobe, os homens de Tobe[b] e Maaca estavam à parte no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os amonitas”. O hebraico diz literalmente “os filhos de Amom”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Is-Tobe”. O hebraico אִישׁ טוֹב pode ser entendido como “os homens de Tobe” ou como o nome de lugar “Is-Tobe”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: No contexto militar, יצא descreve a saída das tropas amonitas da cidade para ocupar sua posição.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Mantém a forma do etnônimo hebraico; a alternativa idiomática “os amonitas” é registrada em nota.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: se puseram em formação de batalha
  rationale: A expressão militar indica que as tropas se organizaram em linha ou formação para combater, não apenas que iniciaram uma batalha.
- source_word: פֶּתַח הַשָּׁעַר
  choice: à entrada do portão
  rationale: Reproduz com clareza a localização junto à abertura do portão da cidade.
- source_word: וַאֲרַם צוֹבָא
  choice: enquanto Aram de Zobá
  rationale: Preserva o nome Aram, evitando o anacrônico “Síria”, e usa “enquanto” para tornar explícito o contraste de posição entre as forças.
- source_word: וּרְחוֹב
  choice: Reobe
  rationale: Transliteração portuguesa do nome geográfico רְחוֹב.
- source_word: וְאִישׁ טוֹב
  choice: os homens de Tobe
  rationale: Entende אִישׁ em sentido coletivo ligado a Tobe, isto é, o contingente daquela região; a possível leitura como topônimo composto é preservada em nota.
- source_word: וּמַעֲכָה
  choice: Maaca
  rationale: Transliteração portuguesa corrente do nome próprio מַעֲכָה.
- source_word: לְבַדָּם
  choice: ficaram separados
  rationale: Indica que as tropas aliadas estavam posicionadas à parte dos amonitas; “separados” expressa melhor essa disposição tática do que “sozinhos”.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta e não interpretativa de שָׂדֶה, em contraste contextual com a entrada do portão.
