lexical_decisions:
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: rei dos amonitas
  rationale: A expressão hebraica é literalmente “rei dos filhos de Amom”, modo idiomático de designar o povo amonita; “rei dos amonitas” é natural e exato em português.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: O verbo מלך no contexto indica que Hanum passou a exercer a realeza após a morte do pai; esta formulação comunica com clareza a sucessão ao trono.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: 'Expressa diretamente a ideia de sucessão presente no hebraico: Hanum assumiu a posição anteriormente ocupada pelo pai.'
- source_word: חָנוּן
  choice: Hanum
  rationale: Transliteração tradicional e amplamente reconhecível em português do nome hebraico Ḥānûn.
