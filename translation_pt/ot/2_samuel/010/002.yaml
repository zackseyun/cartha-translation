base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: pt
  text: 'Davi disse: “Mostrarei bondade a Hanum, filho de Naás, assim como o pai dele mostrou bondade a mim”. Então Davi enviou seus servos para consolá-lo por seu pai[a]. E os servos de Davi chegaram à terra dos amonitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito de seu pai”. A expressão hebraica indica que o consolo se relacionava ao pai de Hanum; no contexto, provavelmente envolve condolências.'
    reason: Preserva a relação menos explícita do hebraico, sem afirmar diretamente no texto que a morte do pai é o motivo do consolo.
lexical_decisions:
- source_word: חֶסֶד
  choice: bondade
  rationale: Neste contexto diplomático, indica benevolência leal demonstrada entre as partes. “Bondade” é clara e preserva a reciprocidade nas duas ocorrências.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanum, filho de Naás
  rationale: Emprega formas tradicionais e reconhecíveis dos nomes em português e conserva explicitamente a relação filial.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa de modo natural a comparação e a reciprocidade pretendidas.
- source_word: עָשָׂה ... חֶסֶד
  choice: mostrou bondade
  rationale: É a expressão idiomática portuguesa correspondente a “fazer bondade”, sem acrescentar uma noção técnica de aliança.
- source_word: לְנַחֲמוֹ
  choice: para consolá-lo
  rationale: O verbo, neste contexto de luto, significa oferecer consolo ou condolências.
- source_word: אֶל אָבִיו
  choice: pela perda de seu pai
  rationale: Torna explícito em português o sentido contextual de condolências pela morte do pai, enquanto a nota registra a formulação hebraica menos explícita.
- source_word: בְּיַד עֲבָדָיו
  choice: enviou seus servos
  rationale: A expressão hebraica “pela mão de seus servos” indica agência. A formulação escolhida é natural em português e comunica que os servos foram enviados como representantes de Davi.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: a terra dos amonitas
  rationale: “Amonitas” é o equivalente corrente e claro do etnônimo hebraico “filhos de Amom”.
