  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: pt
  text: Quando os filhos de Amom[a] viram que Arã[b] havia fugido, fugiram de Abisai e entraram na cidade. Então Joabe se retirou do combate contra os filhos de Amom[c] e foi para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os amonitas”. Hebraico: “os filhos de Amom”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “os arameus”. O hebraico traz o nome coletivo “Arã”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica indica que Joabe se afastou dos filhos de Amom, retirando-se do combate contra eles.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Preserva a expressão hebraica de parentesco e sua referência coletiva, sem perder clareza; “os amonitas” é a alternativa idiomática indicada em nota.
- source_word: רָאוּ כִּי
  choice: viram que
  rationale: Reproduz diretamente a percepção expressa no hebraico, sem explicitar mais do que o texto ao usar “perceberam”.
- source_word: נָס
  choice: havia fugido
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da fuga de Arã em relação ao momento em que os amonitas a viram.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome próprio hebraico com sua forma portuguesa tradicional, preservando também seu sentido coletivo; “os arameus” é explicitado como alternativa.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: fugiram de Abisai
  rationale: Expressa em português corrente o sentido militar de fugir da presença ou do avanço de Abisai, evitando o possível equívoco espacial de “fugiram diante de”.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: entraram na cidade
  rationale: É a forma portuguesa natural de descrever o movimento para dentro da cidade fortificada, mantendo o artigo definido do hebraico.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: Então Joabe se retirou do combate contra os filhos de Amom
  rationale: 'Torna explícito o sentido militar de שׁוב com מֵעַל: Joabe interrompeu o confronto e se afastou dos amonitas, sem sugerir que voltou para junto deles.'
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: e foi para Jerusalém
  rationale: Em português, “foi” se ajusta naturalmente ao ponto de vista narrativo; não se repete “voltou”, embora o contexto permita entender seu retorno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva “filhos de Amom” e “Arã” no texto principal, enquanto as notas oferecem os gentílicos mais idiomáticos. A construção militar difícil é vertida pelo sentido contextual e explicada em nota.
