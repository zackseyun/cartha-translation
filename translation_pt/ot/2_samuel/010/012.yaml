  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: pt
  text: Seja forte[a], e sejamos fortes por nosso povo e pelas cidades do nosso Deus; que Yahweh faça[b] o que é bom aos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenha coragem”. O verbo hebraico é um imperativo que exorta diretamente à força e à coragem.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh fará o que é bom aos seus olhos”. A forma hebraica também pode ser entendida como futuro simples, embora aqui seja traduzida como um desejo de submissão à vontade de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Seja forte
  rationale: O imperativo qal masculino singular é uma exortação direta. “Seja forte” preserva o sentido básico e forma um paralelismo natural com “sejamos fortes”.
- source_word: וְנִתְחַזַּק
  choice: e sejamos fortes
  rationale: O hitpael coortativo na primeira pessoa do plural expressa a disposição conjunta de mostrar força ou fortalecer-se. A formulação escolhida é clara e natural; a nota registra a nuance reflexiva.
- source_word: בְּעַד
  choice: em favor de
  rationale: No contexto militar, a preposição indica agir em defesa ou benefício de alguém. “Em favor de” comunica esse valor com mais precisão do que um simples “por”.
- source_word: עַמֵּנוּ
  choice: nosso povo
  rationale: עַם designa normalmente o povo, não apenas o exército, e corresponde à comunidade defendida.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: as cidades do nosso Deus
  rationale: Reproduz naturalmente a cadeia construta hebraica e mantém a associação teológica das cidades com o Deus de Israel.
- source_word: יהוה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: que Yahweh faça o que for bom aos seus olhos
  rationale: O yiqtol após as exortações pode exprimir um desejo de submissão ao resultado determinado por Deus. “Aos seus olhos” conserva a imagem idiomática hebraica.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Valor modal de יַעֲשֶׂה
  choice: 'desejo: “que Yahweh faça”'
  alternative: 'futuro declarativo: “Yahweh fará”'
  rationale: Depois dos imperativos e do coortativo, o yiqtol pode ser entendido como desejo ou entrega do resultado à vontade divina; como a forma também admite leitura futura, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre “Seja forte” e “sejamos fortes” foi preservado, e a expressão hebraica “aos seus olhos” foi mantida sem paráfrase excessiva.
