revisions:
- from: Seja forte[a], e sejamos fortes em favor do nosso povo e das cidades do nosso Deus; e que Yahweh faça[b] o que for bom aos seus olhos.
  to: Seja forte[a], e sejamos fortes por nosso povo e pelas cidades do nosso Deus; que Yahweh faça[b] o que é bom aos seus olhos.
  rationale: A revisão corrige o valor temporal indevidamente sugerido por «o que for bom», usando «o que é bom», mais próximo de הַטּוֹב. Também substitui «em favor de» por «por», opção mais idiomática no apelo à defesa do povo e das cidades, mantendo o sentido de בְּעַד. As âncoras e as notas permanecem coerentes com o texto.
