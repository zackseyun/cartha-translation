base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: pt
  text: 'Ele disse: “Se Arã for forte demais para mim, você me ajudará; mas, se os amonitas forem fortes demais para você, eu irei socorrê-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: for forte demais / forem fortes demais
  rationale: No contexto militar, חזק com מן indica superioridade ou prevalência. A expressão portuguesa comunica naturalmente que o inimigo está levando vantagem.
- source_word: אֲרָם
  choice: Arã
  rationale: Preserva o nome do povo ou território hebraico sem substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: para mim / para você
  rationale: Com חזק, מן marca comparação ou superioridade; em português, “forte demais para” exprime essa relação de modo idiomático.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: você virá em meu auxílio
  rationale: Traduz a ideia concreta de socorro militar de forma natural, mantendo a orientação pessoal “para mim” sem sugerir necessariamente salvação em sentido teológico.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a forma portuguesa corrente para o grupo étnico-nacional literalmente chamado “filhos de Amom”.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: eu irei socorrê-lo
  rationale: Preserva tanto o movimento expresso por הלך quanto a finalidade de prestar auxílio ou livramento no campo de batalha.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com ampla legibilidade brasileira. “Você” torna explícito o interlocutor singular masculino, e “socorrê-lo” evita repetição sem elevar o auxílio militar a uma afirmação teológica.
