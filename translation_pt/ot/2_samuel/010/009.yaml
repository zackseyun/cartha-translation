source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: pt
  text: Quando Joabe viu que a linha de batalha estava voltada contra ele tanto pela frente quanto pela retaguarda, escolheu dentre todos os melhores guerreiros de Israel[a] e os pôs em formação para enfrentar Arã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “escolheu dentre todos os homens escolhidos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Arã” refere-se aqui às forças arameias.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o sentido básico de ראה e o estilo narrativo hebraico; no contexto, inclui o reconhecimento da situação tática sem explicá-lo em excesso.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: a linha de batalha
  rationale: A expressão significa literalmente “a face da batalha”; no contexto militar, designa a frente ou linha de batalha.
- source_word: הָיְתָה אֵלָיו
  choice: estava voltada contra ele
  rationale: Expressa a orientação hostil da linha de batalha em relação a Joabe sem transformar a imagem em uma paráfrase extensa.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: tanto pela frente quanto pela retaguarda
  rationale: Preserva o contraste espacial e comunica com naturalidade que Joabe enfrentava forças em dois lados.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: escolheu dentre todos os melhores guerreiros de Israel
  rationale: בְּחוּרֵי denota homens escolhidos ou de elite, e מִכֹּל indica que a seleção foi feita dentre o conjunto deles. “Guerreiros” explicita adequadamente a função militar no contexto.
- source_word: וַיַּעֲרֹךְ
  choice: os pôs em formação
  rationale: Em contexto militar, ערך significa organizar ou dispor tropas para a batalha. A formulação é clara e atual.
- source_word: לִקְרַאת אֲרָם
  choice: para enfrentar Arã
  rationale: לקראת pode indicar ir ao encontro ou confrontar; “enfrentar” torna explícito o sentido militar sem acrescentar conteúdo estranho ao texto.
- source_word: אֲרָם
  choice: Arã
  rationale: Preserva o nome próprio hebraico em sua forma tradicional portuguesa, em vez de substituí-lo por uma designação geográfica posterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção conserva a imagem militar do hebraico, enquanto “os pôs em formação” evita o arcaísmo de uma tradução excessivamente literal.
