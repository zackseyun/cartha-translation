review_pass:
  verdict: revise
  source_fidelity: A pergunta retórica e a suspeita político-militar são preservadas, bem como a sequência investigar–espionar–derrubar. Contudo, “só porque” introduz uma restrição (“somente”) que o hebraico não expressa explicitamente, e “destruí-la” é mais forte e menos específico que o sentido de virar/derrubar da cidade.
  naturalness: O texto é claro e contemporâneo. A revisão mantém essa legibilidade, mas torna a primeira pergunta mais próxima do idiomatismo hebraico e evita “até você”, que é desnecessário em português neste contexto.
  terminology: “Líderes”, “senhor”, “amonitas”, “Hanum” e “servos” são adequados. “Enviados para o consolar” é mais natural e conciso que “pessoas para consolá-lo”, sem perder a função dos mensageiros.
  issues:
  - severity: medium
    issue: “só porque” acrescenta uma limitação não expressa no texto-fonte.
    rationale: A construção hebraica pergunta se Davi honra o pai de Hanum “aos seus olhos” porque enviou consoladores; não contém um equivalente explícito de “só”/“somente”.
  - severity: medium
    issue: “destruí-la” intensifica e estreita o sentido de וּלְהָפְכָהּ.
    rationale: הפך significa literalmente virar, reverter ou derrubar; “derrubá-la” conserva melhor a imagem e não antecipa necessariamente destruição total.
