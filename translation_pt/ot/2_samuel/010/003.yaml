base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: pt
  text: 'Então os líderes dos amonitas disseram a Hanum, seu senhor: “Você acha que Davi está honrando seu pai aos seus olhos porque lhe enviou enviados para o consolar?[a] Não foi para investigar a cidade, espioná-la e derrubá-la que Davi enviou seus servos a você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, enviados para consolá-lo pela morte de seu pai.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: os líderes dos amonitas
  rationale: שָׂרִים designa autoridades, oficiais ou príncipes. “Líderes” comunica naturalmente a função político-cortesã em português atual sem sugerir necessariamente parentesco real.
- source_word: אֲדֹנֵיהֶם
  choice: seu senhor
  rationale: אדון é aqui um título humano de autoridade. “Seu senhor” preserva a relação hierárquica dos líderes com Hanum.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Você acha que Davi está honrando
  rationale: A construção interrogativa com o idiomatismo “aos seus olhos” questiona a percepção de Hanum. “Você acha que” expressa esse valor idiomático com clareza, enquanto “honrando” preserva o sentido de כבד.
- source_word: מְנַחֲמִים
  choice: pessoas para consolá-lo
  rationale: O particípio descreve os enviados que foram consolar Hanum pela morte do pai. A formulação evita o pouco natural “consoladores” e explicita a função sem acrescentar identidade não presente no termo.
- source_word: הֲלוֹא
  choice: Não foi ... que
  rationale: Introduz uma pergunta retórica que espera concordância e transmite a suspeita acusatória dos líderes.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: investigar a cidade
  rationale: חקר indica examinar ou sondar minuciosamente. “Investigar” funciona bem no contexto de suspeita de reconhecimento militar.
- source_word: וּלְרַגְּלָהּ
  choice: espioná-la
  rationale: O Piel de רגל significa espionar ou explorar como espião; o pronome retoma “a cidade”.
- source_word: וּלְהָפְכָהּ
  choice: destruí-la
  rationale: הפך significa virar, derrubar ou arruinar. No contexto de ação hostil contra uma cidade, “destruí-la” comunica o resultado pretendido, embora “derrubá-la” seja alternativa possível.
- source_word: עֲבָדָיו
  choice: os servos dele
  rationale: עבד designa aqui os homens ou servidores do rei enviados em missão. “Os servos dele” preserva o termo básico e evita ambiguidade momentânea sobre o antecedente de “seus”.
theological_decisions:
- issue: Suspeita político-militar, não afirmação do narrador
  choice: Manter a acusação como pergunta retórica na fala dos líderes amonitas.
  alternative: Formular a suspeita como declaração factual de que Davi enviou espiões.
  rationale: O hebraico registra a interpretação hostil dos conselheiros de Hanum, sem confirmá-la como avaliação do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Hanum” segue uma transliteração portuguesa corrente; “amonitas” é a forma tradicional consolidada. A ordem das três ações suspeitas foi preservada.
