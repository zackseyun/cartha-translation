revisions:
- from: 'Então os líderes dos amonitas disseram a Hanum, seu senhor: “Você acha que Davi está honrando seu pai só porque lhe enviou pessoas para consolá-lo?[a] Não foi para investigar a cidade, espioná-la e destruí-la que Davi enviou os servos dele até você?”'
  to: 'Então os líderes dos amonitas disseram a Hanum, seu senhor: “Você acha que Davi está honrando seu pai aos seus olhos porque lhe enviou enviados para o consolar?[a] Não foi para investigar a cidade, espioná-la e derrubá-la que Davi enviou seus servos a você?”'
  rationale: A revisão remove a restrição acrescentada por “só”, traduz explicitamente o idiomatismo “aos seus olhos”, conserva a pergunta retórica e substitui “destruí-la” por “derrubá-la”, mais próximo do campo semântico de הפך. Também simplifica a designação dos mensageiros, preservando a nota cultural.
