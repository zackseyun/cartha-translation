  register: Português moderno, digno e acessível, com legibilidade brasileira. A tradução mantém 'povo' e 'filhos de Amom' para refletir de perto o hebraico, enquanto verte os idiomatismos militares de forma natural. Os marcadores foram colocados junto às expressões a que se referem.
