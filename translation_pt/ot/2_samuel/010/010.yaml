  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: pt
  text: E pôs o restante do povo sob o comando de seu irmão Abisai[b] e os dispôs em formação de batalha[c] para enfrentar os filhos de Amom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os amonitas”. Hebraico: “os filhos de Amom”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deu na mão de Abisai”, expressão que indica confiar as tropas à sua autoridade.
    reason: lexical_alternative
  - marker: c
    text: Ou “os organizou” / “dispôs a linha de batalha”. O verbo hebraico se refere a dispor tropas em formação de combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: o restante do povo
  rationale: Preserva a expressão hebraica, embora o contexto militar indique que se trata do restante das tropas.
- source_word: נָתַן בְּיַד
  choice: pôs sob o comando de
  rationale: Traduz de modo natural o idiomatismo literalmente equivalente a 'deu na mão de', que aqui indica confiar tropas à autoridade de alguém.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Mantém a relação familiar explicitamente indicada pelo hebraico.
- source_word: וַיַּעֲרֹךְ
  choice: os dispôs em formação de batalha
  rationale: 'Explicita o sentido militar do verbo ערך: organizar ou alinhar tropas para o combate. O objeto plural é recuperado naturalmente do contexto.'
- source_word: לִקְרַאת
  choice: para enfrentar
  rationale: No contexto de batalha, comunica com naturalidade o encontro hostil expresso pela preposição, sem perder sua orientação em direção ao adversário.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Preserva a formulação literal do hebraico e sua referência étnica; 'os amonitas' é uma alternativa mais idiomática.
