source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que farei surgir contra você uma desgraça vinda de sua própria casa. Tomarei suas mulheres diante dos seus olhos e as darei a alguém próximo de você[a], e ele se deitará com elas à vista deste sol[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu próximo”, “ao seu companheiro” ou “ao seu vizinho”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, abertamente, em plena luz do dia.
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título Senhor e preservando a forma pessoal presente no hebraico.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo digno e corrente a fórmula profética de mensageiro.
- source_word: הִנְנִי מֵקִים
  choice: Eis que farei surgir
  rationale: Conserva a função enfática de הִנְנִי e comunica em português natural a ação iminente expressa pelo particípio.
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto, designa calamidade ou dano como juízo, não maldade moral.
- source_word: מִבֵּיתֶךָ
  choice: vinda de sua própria casa
  rationale: Explicita que a calamidade procederá do âmbito doméstico e familiar do próprio Davi, sem abandonar a imagem de 'casa'.
- source_word: נָשֶׁיךָ
  choice: suas mulheres
  rationale: No contexto régio, refere-se às mulheres de Davi, isto é, suas esposas/concubinas; 'mulheres' preserva a amplitude lexical do hebraico.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus olhos
  rationale: Mantém a imagem concreta e vívida do hebraico.
- source_word: לְרֵעֶיךָ
  choice: a alguém próximo de você
  rationale: Preserva a relativa amplitude de רֵעַ — próximo, companheiro ou vizinho — sem dar uma identificação mais específica do que o versículo oferece.
- source_word: וְשָׁכַב עִם
  choice: ele se deitará com elas
  rationale: Mantém o eufemismo sexual solene do hebraico; o pronome evita repetição pesada e tem referente inequívoco.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: à vista deste sol
  rationale: Conserva a expressão concreta e incomum do texto, em vez de substituí-la inteiramente por 'em plena luz do dia'.
theological_decisions:
- issue: Sentido de רָעָה no juízo divino
  choice: desgraça, no sentido de calamidade judicial
  alternative: mal ou maldade moral
  rationale: O contexto fala do dano que Yahweh levantará contra Davi como juízo. A tradução mantém a atribuição da ação a Deus sem sugerir que ele pratique maldade moral.
- issue: Identidade de רֵעַ
  choice: alguém próximo de você
  alternative: vizinho ou companheiro
  rationale: O termo admite mais de um sentido relacional. Embora a narrativa posterior esclareça o referente, este versículo não o nomeia; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservaram-se a fórmula profética, o eufemismo sexual e a imagem marcante do sol. Todos os marcadores de nota constam no texto.
