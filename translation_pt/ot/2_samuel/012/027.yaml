  text: וַ/יִּשְׁלַ֥ח יוֹאָ֛ב מַלְאָכִ֖ים אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר֙ נִלְחַ֣מְתִּי בְ/רַבָּ֔ה גַּם לָכַ֖דְתִּי אֶת עִ֥יר הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: pt
  text: 'Então Joabe enviou mensageiros a Davi e disse: “Lutei contra Rabá e também tomei a cidade das águas[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a cidade da água”, provavelmente uma referência à parte de Rabá que controlava seu abastecimento de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto humano, o termo designa pessoas enviadas para transmitir uma notícia, não seres celestiais.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Lutei contra Rabá
  rationale: A construção descreve o combate dirigido contra a cidade; o pretérito perfeito é natural no relatório de Joabe e não acrescenta uma duração que o hebraico não explicita.
- source_word: רַבָּה
  choice: Rabá
  rationale: Mantém o nome próprio transliterado; a identificação como cidade amonita já é fornecida pelo contexto.
- source_word: גַּם
  choice: também
  rationale: Preserva o sentido aditivo que liga a tomada da cidade ao combate mencionado antes.
- source_word: לָכַדְתִּי
  choice: tomei
  rationale: “Tomar” é uma expressão militar corrente e digna para a conquista ou captura de uma cidade.
- source_word: עִיר הַמָּיִם
  choice: a cidade das águas
  rationale: Reproduz de maneira transparente a expressão hebraica, sem decidir se ela designa uma cidade junto às águas ou o setor que controlava o abastecimento.
theological_decisions: []
