base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: pt
  text: Mas agora ele está morto. Por que eu deveria continuar jejuando? Posso trazê-lo de volta? Eu vou até ele[a], mas ele não voltará para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu irei até ele.” O particípio hebraico pode expressar um futuro certo.'
    reason: Alternativa lexical que explicita o possível valor futuro do particípio hebraico.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Introduz o contraste entre o jejum de Davi enquanto a criança vivia e sua conduta depois da morte dela.
- source_word: מֵת
  choice: ele está morto
  rationale: Expressa naturalmente em português o estado resultante indicado pelo predicado hebraico.
- source_word: לָמָּה זֶּה אֲנִי צָם עוֹד
  choice: Por que eu deveria continuar jejuando?
  rationale: Reproduz a força retórica da pergunta e entende עוֹד como continuação do jejum.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: Será que posso trazê-lo de volta?
  rationale: O hifil de שוב indica fazer voltar; no contexto, “trazê-lo de volta” comunica isso com clareza, sem explicar além do texto.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Eu vou até ele
  rationale: Mantém o aspecto participial e permite a referência a um futuro entendido como certo, sem definir a natureza desse encontro.
- source_word: וְהוּא לֹא יָשׁוּב אֵלָי
  choice: mas ele não voltará para mim
  rationale: O imperfeito é naturalmente futuro neste contexto; “voltará” também preserva a ligação lexical com “trazê-lo de volta”.
theological_decisions:
- issue: Se a declaração de Davi ensina uma reunião consciente com a criança após a morte
  choice: Traduzir simplesmente que Davi vai até a criança, sem especificar a natureza desse ir.
  alternative: Entender apenas que Davi também morrerá e irá ao lugar dos mortos, ou entender que haverá uma reunião pessoal após a morte.
  rationale: O hebraico afirma que Davi irá até a criança e que ela não voltará a ele, mas não define o estado intermediário nem formula uma doutrina sobre o destino de crianças falecidas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva a concisão e a tensão teológica do hebraico.
