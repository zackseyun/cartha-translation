  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: pt
  text: Contudo[a], visto que você, por este ato, desprezou completamente os inimigos de Yahweh, também o filho que lhe nasceu certamente morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Muitas traduções entendem esta cláusula como: «você deu aos inimigos de Yahweh motivo para o desprezarem» ou «para blasfemarem contra ele», seguindo uma leitura interpretativa ou emendada do difícil texto hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Contudo
  rationale: Introduz uma forte ressalva adversativa após a declaração anterior de perdão, em linguagem atual e digna.
- source_word: כִּי
  choice: visto que
  rationale: Introduz a causa da consequência anunciada; a expressão evita uma sequência pouco fluida com «Contudo, porque».
- source_word: נִאֵץ נִאַצְתָּ
  choice: desprezou completamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ideia verbal; «completamente» preserva a ênfase, e «desprezou» comunica o sentido de tratar com profundo desdém.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: os inimigos de Yahweh
  rationale: Segue diretamente o texto massorético apresentado, no qual a expressão marcada por אֶת funciona como objeto do verbo, sem adotar silenciosamente uma emenda interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בַּדָּבָר הַזֶּה
  choice: por meio deste ato
  rationale: דָּבָר refere-se aqui ao acontecimento ou à conduta em questão; «ato» é natural no contexto, e a preposição expressa o meio ou a circunstância.
- source_word: גַּם
  choice: não expresso separadamente
  rationale: Seu valor aditivo ou enfático está incorporado à progressão da sentença; traduzi-lo por «também» produziria uma formulação menos natural sem acrescentar clareza.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: o filho que nasceu de você
  rationale: Preserva o sentido masculino específico de בֵּן e verte de modo natural o particípio passivo com לְךָ.
- source_word: מוֹת יָמוּת
  choice: certamente morrerá
  rationale: A construção com infinitivo absoluto e verbo finito exprime certeza enfática; «certamente morrerá» conserva essa força em português moderno.
theological_decisions:
- issue: Relação sintática na oração que contém «os inimigos de Yahweh»
  choice: 'Leitura primária do texto massorético: Davi desprezou completamente «os inimigos de Yahweh».'
  alternative: 'Leitura interpretativa ou emendada: Davi deu aos inimigos de Yahweh motivo para desprezar ou blasfemar; outra emenda elimina «os inimigos de» e entende que Davi desprezou Yahweh.'
  rationale: A forma consonantal apresentada traz אֶת antes de «os inimigos de Yahweh», indicando-os mais diretamente como objeto. Embora a leitura seja difícil no contexto, ela é mantida no texto principal por primazia da fonte hebraica, enquanto a interpretação tradicional amplamente adotada é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é sóbrio e digno; «você» torna a fala direta clara, enquanto «Yahweh» preserva o nome divino. A dificuldade real do hebraico é mantida no texto e esclarecida em nota.
