  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: pt
  text: Ele tirou da cabeça do rei deles a coroa[a]. A coroa pesava um talento de ouro[b] e tinha uma pedra preciosa; ela foi colocada na cabeça de Davi. Ele retirou da cidade uma quantidade enorme de despojos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a coroa de Milcom» (também grafado «Malcam»), caso מַלְכָּם seja entendido como o nome da divindade amonita, e não como «rei deles».'
    reason: alternative_reading
  - marker: b
    text: O talento era uma unidade de peso muito elevada, muitas vezes estimada em cerca de 34 quilogramas, embora os padrões exatos variassem na Antiguidade.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: No contexto régio, עֲטֶרֶת designa naturalmente uma coroa; «coroa» é claro, atual e mais comum do que «diadema».
- source_word: מַלְכָּם
  choice: rei deles
  rationale: A vocalização massorética e a morfologia permitem entender o termo como «rei» com sufixo de terceira pessoa do plural. A leitura como nome da divindade amonita é preservada em nota.
- source_word: מֵעַל רֹאשׁוֹ
  choice: da cabeça dele
  rationale: A construção indica remoção de sobre a cabeça. Em português, «tirou da cabeça» transmite de modo natural tanto a origem quanto o movimento de retirada.
- source_word: כִּכַּר זָהָב
  choice: um talento de ouro
  rationale: «Talento» é o equivalente tradicional para a grande unidade antiga de peso; uma nota esclarece sua dimensão aproximada.
- source_word: וְאֶבֶן יְקָרָה
  choice: e tinha uma pedra preciosa
  rationale: O hebraico é conciso, literalmente «e uma pedra preciosa». A formulação portuguesa explicita apenas a relação da pedra com a coroa, sem definir como estava fixada.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: ela foi colocada na cabeça de Davi
  rationale: A expressão comunica que a coroa veio a ficar sobre a cabeça de Davi; a voz passiva é natural em português e conserva o foco no objeto.
- source_word: שְׁלַל הָעִיר
  choice: despojos da cidade
  rationale: שָׁלָל refere-se aos bens tomados como espólio de guerra. «Despojos» preserva o contexto militar em linguagem digna e compreensível.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: retirou da cidade uma quantidade enorme
  rationale: O hifil de יצא tem o sentido de fazer sair ou levar para fora, e הַרְבֵּה מְאֹד intensifica a grande quantidade. A tradução mantém ambos os elementos em português natural.
theological_decisions:
- issue: Se מַלְכָּם significa «rei deles» ou é o nome da divindade amonita Milcom/Malcam
  choice: rei deles
  alternative: Milcom (também grafado Malcam)
  rationale: A vocalização e a análise morfológica fornecidas favorecem «rei deles», e a referência à retirada da coroa da cabeça combina diretamente com um rei humano. Como a leitura do nome divino é antiga e lexicalmente possível, ela não é eliminada, mas registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Repetiu-se «a coroa» no início da segunda frase para evitar um pronome de referência pouco clara. «Quantidade enorme de despojos» transmite a forte intensificação hebraica sem soar arcaico.
