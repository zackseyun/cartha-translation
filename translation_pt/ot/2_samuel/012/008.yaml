  to: E eu lhe dei a casa de seu senhor e coloquei em seu colo as esposas de seu senhor. Também lhe dei a casa de Israel e de Judá. E, se isso fosse pouco, eu lhe acrescentaria coisas como estas e ainda outras[b].
  rationale: A revisão substitui “mulheres” por “esposas”, conforme o sentido contextual do construto hebraico, e troca a expressão pouco natural “aos seus braços” por “em seu colo”, mediante um verbo explícito que comunica a imagem de בְּחֵיקֶךָ sem alegar aprovação moral ou especificar a natureza histórica da transferência. A nota a deixa de ser necessária, pois a tradução adotada já exprime diretamente a imagem corporal; a nota b é preservada.
