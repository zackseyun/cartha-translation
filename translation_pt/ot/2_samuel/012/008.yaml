base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: pt
  text: E eu lhe dei a casa de seu senhor e coloquei em seu colo as esposas de seu senhor. Também lhe dei a casa de Israel e de Judá. E, se isso fosse pouco, eu lhe acrescentaria coisas como estas e ainda outras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'A expressão hebraica é indefinida e cumulativa: “coisas como estas e outras mais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: eu lhe dei
  rationale: O wayyiqtol de נתן prossegue a narrativa dos benefícios concedidos a Davi; o pretérito perfeito é natural em português.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: a casa de seu senhor
  rationale: Mantém a imagem concreta de בַּיִת e sua possível amplitude de casa, bens, família ou domínio real, sem restringi-la a uma única acepção.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: as mulheres de seu senhor
  rationale: נָשִׁים pode significar mulheres ou esposas. “Mulheres” preserva aqui a amplitude lexical e evita especificar além do necessário a natureza da transferência ligada à sucessão real.
- source_word: בְּחֵיקֶךָ
  choice: entregando-as aos seus braços
  rationale: חֵיק designa peito, colo ou regaço e, neste contexto, expressa recepção ou posse íntima. “Aos seus braços” conserva a imagem corporal em português atual, enquanto a nota registra as alternativas mais literais.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: a casa de Israel e de Judá
  rationale: Preserva “casa” e o paralelismo do hebraico, deixando aberta a referência ao povo, domínio ou reino unido sob Davi.
- source_word: וְאִם מְעָט
  choice: se isso fosse pouco
  rationale: Expressa de modo natural a condição hipotética de insuficiência, sem torná-la mais categórica do que o hebraico.
- source_word: וְאֹסִפָה לְּךָ
  choice: eu lhe acrescentaria
  rationale: Reflete o hifil de יסף, “acrescentar”, e a força modal produzida pela condição precedente.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: coisas como estas e ainda outras
  rationale: Reproduz o caráter indefinido e cumulativo da expressão duplicada, indicando mais dádivas da mesma espécie sem especificá-las.
theological_decisions:
- issue: Se a transferência das mulheres de Saul deve ser explicitada como aprovação divina de relações conjugais
  choice: Declarar a transferência em linguagem próxima ao texto, sem acrescentar aprovação moral nem definir detalhadamente a relação conjugal.
  alternative: Traduzir interpretativamente como “dei-lhe o harém de seu senhor” ou suavizar como “confiei ao seu cuidado as mulheres de seu senhor”.
  rationale: O hebraico associa as mulheres à transferência da casa real e usa uma imagem de recepção íntima. A tradução preserva essa tensão sem impor juízo teológico ou explicação histórica ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “lhe/seu”. A coordenação foi dividida em três frases para legibilidade, sem alterar a progressão do hebraico. As notas preservam o sentido corporal de חֵיק e o caráter idiomático de כָּהֵנָּה וְכָהֵנָּה.
