base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: pt
  text: 'Então os seus servos lhe disseram: “Que coisa é essa que você fez? Enquanto a criança estava viva, você jejuou e chorou; mas, quando a criança morreu, você se levantou e comeu pão[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “comeu pão”, expressão que também pode significar alimentar-se ou fazer uma refeição.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Então os seus servos lhe disseram
  rationale: “Então” expressa o avanço da narrativa marcado pelo waw consecutivo. No contexto da corte real, “servos” é uma tradução natural de עֲבָדָיו, sem afirmar mais do que o termo exige sobre a condição jurídica deles.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Que coisa é essa que você fez?
  rationale: Mantém a formulação concreta e o espanto dos servos, sem reduzir a pergunta ao sentido explicativo de “Por que você fez isso?”.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Enquanto a criança estava viva
  rationale: No contraste com a morte da criança, a expressão introduz a circunstância temporal. “Criança” corresponde melhor ao filho ainda pequeno de Davi do que “menino”.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: você jejuou e chorou
  rationale: Tradução direta dos verbos צום e בכה, em linguagem atual e digna.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: mas, quando a criança morreu
  rationale: “Mas” explicita em português o forte contraste retórico entre a conduta de Davi antes e depois da morte; “morreu” preserva o caráter verbal e dinâmico do hebraico.
- source_word: קַמְתָּ
  choice: você se levantou
  rationale: Equivalente corrente e adequado de קום neste contexto.
- source_word: וַתֹּאכַל לָחֶם
  choice: e comeu pão
  rationale: Conserva a imagem concreta do hebraico, deixando a nota esclarecer que “comer pão” pode designar alimentar-se ou fazer uma refeição.
