  text: וַ/יִּלָּ֣חֶם יוֹאָ֔ב בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן וַ/יִּלְכֹּ֖ד אֶת עִ֥יר הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: pt
  text: Joabe combateu contra Rabá dos amonitas e conquistou a cidade real.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a capital”. Em hebraico, literalmente, “a cidade da realeza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: combateu contra
  rationale: O nifal de לחם indica entrar em combate ou guerrear. “Combateu contra” é natural em português e explicita adequadamente o adversário.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabá dos amonitas
  rationale: Rabá é o nome próprio da cidade, e בְּנֵי עַמּוֹן é a designação étnica e geopolítica usual. “Dos amonitas” preserva o referente em português atual.
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: לכד, em contexto militar e tendo uma cidade por objeto, significa tomar, capturar ou conquistar. “Conquistou” é a formulação mais natural neste contexto.
- source_word: עִיר הַמְּלוּכָה
  choice: a cidade real
  rationale: A expressão significa literalmente “a cidade da realeza/do reinado”. “Cidade real” permanece próxima do hebraico sem impor a interpretação mais específica de “capital”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. Mantém-se “cidade real” no texto para preservar a formulação e a possível amplitude do hebraico; a alternativa interpretativa “capital” aparece em nota.
