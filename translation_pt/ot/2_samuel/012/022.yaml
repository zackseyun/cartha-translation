    issue: «pois pensei» traduz אָמַרְתִּי
    rationale: O verbo hebraico é «disse». Embora possa introduzir fala interior em contexto, não há necessidade de substituir o verbo explícito por «pensei».
  - severity: low
    issue: «tenha compaixão de mim» para יְחָנֵּנִי
    rationale: A compaixão pode estar implicada, mas חנן enfatiza ser gracioso, mostrar favor. «Seja gracioso comigo» conserva essa nuance de modo mais preciso.
