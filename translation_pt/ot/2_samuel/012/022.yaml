  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: pt
  text: 'Ele respondeu: “Enquanto a criança ainda estava viva, jejuei e chorei, pois disse: ‘Quem sabe? Yahweh talvez seja gracioso comigo, e a criança viva.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Enquanto a criança ainda estava viva
  rationale: A construção בְּעוֹד indica a continuidade de uma situação no passado; “enquanto... ainda” preserva com naturalidade essa força temporal.
- source_word: צַמְתִּי וָאֶבְכֶּה
  choice: jejuei e chorei
  rationale: Os verbos צום e בכה significam diretamente jejuar e chorar; a formulação é clara, digna e corrente.
- source_word: כִּי אָמַרְתִּי
  choice: pois pensei
  rationale: כִּי introduz a razão da conduta de Davi. Nesse contexto, אָמַרְתִּי pode representar o que ele dizia consigo mesmo; “pensei” soa natural em português sem alterar o conteúdo.
- source_word: מִי יוֹדֵעַ
  choice: Quem sabe?
  rationale: A expressão idiomática comunica incerteza e esperança quanto ao que Deus talvez faça.
- source_word: יְחָנֵּנִי
  choice: tenha compaixão de mim
  rationale: O verbo חנן expressa a concessão favorável e imerecida de graça ou compaixão. Esta escolha é natural em português e mantém o objeto pessoal “de mim”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título.
- source_word: וְחַי הַיָּלֶד
  choice: e a criança viva
  rationale: Depois de “Quem sabe?” e da forma volitiva/contextualmente incerta anterior, o presente do subjuntivo exprime a esperança de Davi sem transformar a possibilidade em certeza.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Grau de certeza na esperança de Davi
  choice: “Talvez Yahweh tenha compaixão de mim, e a criança viva”
  alternative: “Yahweh terá compaixão de mim, e a criança viverá”
  rationale: מִי יוֹדֵעַ expressa incerteza. “Talvez” e o subjuntivo preservam a esperança sem atribuir a Davi uma certeza que o hebraico não afirma.
translation_notes:
  register: Português moderno, internacional e de boa legibilidade brasileira. O discurso é natural e solene, sem arcaísmos desnecessários. Não há marcadores de nota porque nenhuma nota foi julgada necessária para esta redação.
