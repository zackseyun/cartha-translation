  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: pt
  text: Pois você fez isso em segredo, mas eu farei isto diante de todo Israel e diante do sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em plena luz do dia”; literalmente, “diante do sol”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da sentença anunciada no versículo anterior, preservando a força explicativa do hebraico.
- source_word: עָשִׂיתָ בַסָּתֶר
  choice: você fez isso em segredo
  rationale: Mantém a referência elíptica à ação de Davi e expressa de modo natural o contraste entre o ato oculto e a exposição pública.
- source_word: וַאֲנִי
  choice: mas eu
  rationale: Embora a conjunção possa ser simplesmente aditiva, o contexto estabelece um contraste claro entre a ação secreta de Davi e a ação pública de Deus.
- source_word: אֶעֱשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: eu farei esta coisa
  rationale: Preserva a agência divina explícita, o futuro da declaração profética e a formulação concreta do hebraico sem especificar além do texto.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: diante de todo o Israel
  rationale: Comunica presença e visibilidade públicas, mantendo de perto a imagem espacial do original.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: e diante do sol
  rationale: Conserva a imagem hebraica literal e vívida; o sentido idiomático de plena luz do dia é indicado em nota.
theological_decisions:
- issue: Agência do juízo anunciado
  choice: 'Manter a primeira pessoa e a agência divina direta: “eu farei esta coisa”'
  alternative: “farei com que isso aconteça”
  rationale: O hebraico emprega diretamente um verbo na primeira pessoa. Ainda que o juízo se realize por agentes históricos no contexto narrativo, a formulação do versículo não deve ser atenuada.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do hebraico. “Esta coisa” foi mantido por sua concretude e ligação com a sentença precedente; “diante do sol” preserva a imagem original, explicada por nota.
