  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: pt
  text: Agora, portanto, a espada jamais se afastará da sua casa[a], porque você me desprezou[b] e tomou a esposa de Urias, o hitita, para ser sua esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua família” ou “da sua dinastia”; no hebraico, “casa” pode incluir tanto a família quanto a linhagem real.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “me desprezou”. A ofensa contra Urias e sua esposa é apresentada como desprezo contra o próprio Deus.'
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a transição temporal quanto a consequência do juízo anunciado, em português natural.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: jamais se afastará
  rationale: 'Reproduz de modo idiomático a negação duradoura: a espada não deixará a casa de Davi.'
- source_word: חֶרֶב
  choice: a espada
  rationale: Mantém a imagem hebraica de violência e conflito como instrumento de juízo.
- source_word: מִבֵּיתְךָ
  choice: da sua casa
  rationale: Preserva a metáfora ampla do hebraico, que pode abranger família, casa real e dinastia.
- source_word: עֵקֶב כִּי
  choice: porque
  rationale: Comunica com clareza a relação causal entre a conduta de Davi e o juízo anunciado.
- source_word: בְזִתָנִי
  choice: você me desprezou
  rationale: Mantém o objeto divino explícito e a força pessoal do verbo בזה, sem expansão interpretativa.
- source_word: וַתִּקַּח
  choice: e tomou
  rationale: Apresenta diretamente a ação concluída de Davi e coordena-a naturalmente com a acusação anterior.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: a esposa de Urias, o hitita
  rationale: Conserva a ênfase no vínculo matrimonial já existente e identifica Urias conforme o hebraico.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: para ser sua esposa
  rationale: Traduz de forma clara e próxima do hebraico a finalidade de tomá-la como esposa.
theological_decisions:
- issue: Referente do pronome de primeira pessoa em “você me desprezou”
  choice: Manter “me” como referência direta a Deus
  alternative: Expandir para “desprezou a palavra” ou “o mandamento do SENHOR”
  rationale: O hebraico traz explicitamente o sufixo de primeira pessoa singular. A formulação preserva a tensão teológica de que a ofensa contra Urias e sua esposa constitui desprezo contra o próprio Deus.
- issue: Alcance de “sua casa”
  choice: Manter a expressão ampla “sua casa”
  alternative: Restringir a “sua família”, “seus descendentes” ou “sua dinastia”
  rationale: O hebraico בַּיִת pode abranger família, unidade doméstica e linhagem real; a tradução não deve limitar indevidamente seu alcance.
- issue: Duração de עַד עוֹלָם no anúncio de juízo
  choice: Traduzir idiomaticamente por “jamais se afastará”
  alternative: Traduzir de modo mais literal por “não se afastará para sempre”
  rationale: A construção indica duração indefinidamente contínua no horizonte do juízo. “Jamais” preserva sua força sem impor uma formulação portuguesa ambígua ou artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem da espada, a amplitude de “casa” e o objeto divino explícito de “desprezou”, evitando estreitar ambiguidades legítimas do hebraico.
