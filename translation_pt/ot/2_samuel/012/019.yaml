base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: pt
  text: 'Quando Davi viu que seus servos cochichavam, entendeu que a criança estava morta. Então perguntou aos seus servos: “A criança está morta?” Eles responderam: “Está morta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, a resposta é simplesmente «morta»; o português explicita «está» para formar uma frase natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O sentido comum de ראה é percepção visual; no contexto, essa observação leva Davi a uma conclusão.
- source_word: מִתְלַחֲשִׁים
  choice: cochichavam
  rationale: O particípio hitpael de לחש indica fala em voz baixa entre pessoas; “cochichavam” expressa isso de modo natural e claro em português.
- source_word: וַיָּבֶן
  choice: entendeu
  rationale: בין descreve discernimento mental a partir dos sinais observados; “entendeu” preserva o sentido e o tom narrativo.
- source_word: מֵת
  choice: estava morta / morreu
  rationale: A forma hebraica pode expressar o estado de estar morto e, idiomaticamente, o fato de ter morrido. O português usa “estava morta” na conclusão narrativa e “morreu” na pergunta e na resposta para maior naturalidade, sem alterar o referente.
- source_word: הַיָּלֶד
  choice: a criança
  rationale: יֶלֶד pode significar criança ou menino; neste contexto, trata-se do filho ainda pequeno de Davi, e “a criança” é a opção mais adequada.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד tem uma faixa semântica que inclui servo, escravo e auxiliar. Aqui designa membros da casa real que assistem Davi; “servos” mantém a terminologia narrativa sem especificar indevidamente a condição jurídica.
- source_word: הֲמֵת הַיֶּלֶד
  choice: A criança morreu?
  rationale: Embora a construção possa ser vertida formalmente por “A criança está morta?”, em português “A criança morreu?” é a pergunta mais natural no contexto e comunica o mesmo diagnóstico de morte.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: perguntou ... responderam
  rationale: אמר significa literalmente “dizer”, mas a forma da fala torna explícitos uma pergunta e seu retorno. “Perguntou” e “responderam” reproduzem naturalmente a função discursiva em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva a repetição de “a criança” e a progressão observar–entender–perguntar–confirmar, usando verbos de fala naturais ao diálogo.
