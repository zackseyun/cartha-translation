base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: pt
  text: 'Então Davi disse a Natã: “Pequei contra Yahweh.” E Natã disse a Davi: “Yahweh também retirou o seu pecado[a]; você não morrerá[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afastou o seu pecado”. O verbo hebraico significa literalmente “fez passar” e, aqui, tem o sentido de retirar o pecado ou sua culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “você não será morto”. O hebraico diz simplesmente “você não morrerá”, embora o contexto jurídico possa indicar que Davi foi poupado de uma sentença de morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O qal perfeito na primeira pessoa do singular expressa uma confissão direta. Em português, o pretérito perfeito comunica naturalmente o ato cometido e reconhecido no presente.
- source_word: לַיהוָה
  choice: contra Yahweh
  rationale: Com o verbo חטא, a preposição ל indica aqui a pessoa contra quem se pecou; “contra” é a formulação idiomática e clara em português.
- source_word: גַּם
  choice: também
  rationale: Preserva a força conectiva do advérbio sem determinar de modo excessivo se a nuance é enfática (“de fato”) ou simplesmente aditiva.
- source_word: הֶעֱבִיר
  choice: retirou
  rationale: O hifil de עבר significa literalmente “fez passar”; com “seu pecado”, comunica idiomaticamente a remoção do pecado ou de sua culpa, sem explicar o mecanismo.
- source_word: חַטָּאתְךָ
  choice: o seu pecado
  rationale: Retoma diretamente o pecado que Davi acaba de confessar. “Culpa” é uma nuance possível, mas seria mais interpretativa.
- source_word: לֹא תָמוּת
  choice: você não morrerá
  rationale: Reproduz diretamente o imperfeito negado de מות. Não acrescenta a ideia interpretativa de execução, embora o contexto jurídico possa sugeri-la.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Então Davi disse... E Natã disse
  rationale: Expressa com naturalidade a sequência narrativa dos verbos com waw consecutivo, mantendo a ligação entre as duas falas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, que é preservado como nome próprio, sem substituí-lo por um título.
- issue: Sentido de הֶעֱבִיר חַטָּאתְךָ
  choice: retirou o seu pecado
  alternative: afastou o seu pecado; fez passar o seu pecado; removeu a sua culpa
  rationale: A formulação afirma que Yahweh removeu o pecado e que Davi não morrerá, mas não introduz uma explicação sobre o mecanismo de expiação nem elimina a tensão com as consequências posteriores do pecado.
- issue: Natureza da declaração לֹא תָמוּת
  choice: você não morrerá
  alternative: você não será morto
  rationale: A tradução mantém a afirmação simples do hebraico; a leitura como livramento de uma pena capital permanece uma inferência contextual, não uma explicitação do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Natã” segue a forma portuguesa tradicional; “você” torna a fala direta natural sem perder a solenidade. Os marcadores [a] e [b] aparecem no texto junto às expressões anotadas.
