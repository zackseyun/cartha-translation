source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: pt
  text: Mas o pobre não tinha nada, a não ser uma única cordeirinha[a], que havia comprado. Ele a criou, e ela cresceu junto com ele e seus filhos. Comia do bocado dele, bebia do seu copo e se deitava em seu colo[b]; era para ele como uma filha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pequena cordeira”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode indicar o regaço ou a região junto ao peito, expressando estreita afeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: o pobre
  rationale: O substantivo designa uma pessoa pobre ou necessitada; no contexto, o masculino singular contrasta diretamente com o homem rico do versículo anterior.
- source_word: אֵין כֹּל כִּי אִם
  choice: não tinha nada, a não ser
  rationale: Reproduz com naturalidade a ideia de privação total com uma única exceção.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: uma única cordeirinha
  rationale: O feminino preserva o sexo do animal, enquanto o diminutivo comunica seu pequeno tamanho e reforça, sem exagero, o tom afetuoso da narrativa.
- source_word: אֲשֶׁר קָנָה
  choice: que havia comprado
  rationale: קנה significa aqui comprar ou adquirir; o mais-que-perfeito composto situa naturalmente a compra antes dos cuidados narrados em seguida.
- source_word: וַיְחַיֶּהָ
  choice: Ele a criou
  rationale: A forma causativa pode significar manter viva ou sustentar. Em português, “criou” expressa de modo natural o cuidado contínuo dispensado ao animal, sem sugerir que o homem lhe deu vida.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: com ele e com seus filhos, todos juntos
  rationale: Mantém o cenário familiar e preserva a ênfase de יַחְדָּו na convivência conjunta.
- source_word: מִפִּתּוֹ
  choice: do bocado dele
  rationale: פַּת pode indicar um pedaço ou bocado de pão/comida; “bocado” conserva a imagem íntima de partilhar sua própria porção.
- source_word: בְחֵיקוֹ
  choice: em seu colo
  rationale: חֵיק pode designar colo, regaço ou a região junto ao peito. “Em seu colo” é natural em português e comunica proximidade e afeto; a amplitude da imagem é registrada em nota.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: era para ele como uma filha
  rationale: Preserva explicitamente a comparação familiar e sua força afetiva, sem transformar a figura em parentesco literal.
theological_decisions:
- issue: Imagem doméstica e familiar aplicada à cordeira
  choice: Manter diretamente a linguagem íntima, inclusive “como uma filha”
  alternative: Atenuar a linguagem para simples cuidado com um animal doméstico
  rationale: A descrição hebraica intensifica deliberadamente o impacto emocional da parábola. Atenuá-la reduziria a força retórica do texto.
- issue: Sentido causativo de וַיְחַיֶּהָ
  choice: Traduzir contextualmente por “criou”
  alternative: “manteve viva” ou “sustentou”
  rationale: “Criou” é a formulação portuguesa mais natural para o cuidado prolongado com uma cordeira até que crescesse. Não se acrescenta uma noção teológica de dar vida; trata-se de preservação e cuidado no contexto narrativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cordeirinha” e “colo” preservam a ternura intencional sem tornar o texto infantil; “bocado” mantém a imagem concreta do hebraico.
