base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: pt
  text: Um viajante[a] chegou a um homem rico, e ele não quis tirar nada do seu próprio rebanho nem do seu próprio gado para preparar algo para o hóspede que havia chegado até ele. Então pegou a cordeirinha do homem pobre e a preparou para o homem que tinha chegado até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega aqui termos relacionados, mas distintos: o primeiro ressalta alguém em viagem; o segundo, traduzido por “hóspede”, ressalta alguém recebido com hospitalidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: viajante
  rationale: O substantivo designa alguém em viagem. “Viajante” é claro e atual, além de permitir que a nota preserve sua relação e distinção em relação a אֹרֵחַ.
- source_word: וַיַּחְמֹל לָקַחַת
  choice: não quis tirar
  rationale: Embora חמל costume significar “poupar” ou “ter compaixão”, aqui a construção com o infinitivo indica que o rico se absteve de tomar um animal dos próprios rebanhos. A formulação portuguesa comunica esse valor idiomático sem introduzir um objeto para a compaixão que o hebraico não explicita.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: do seu próprio rebanho nem do seu gado
  rationale: Os termos coletivos distinguem o rebanho de ovelhas e cabras do gado maior. “Próprio” explicita os sufixos possessivos e reforça o contraste moral com o animal do pobre.
- source_word: לַעֲשׂוֹת
  choice: preparar
  rationale: No contexto de hospitalidade e alimento, “preparar” expressa naturalmente o sentido de עשה sem especificar um processo culinário não declarado.
- source_word: לָאֹרֵחַ
  choice: para o hóspede
  rationale: אֹרֵחַ pode designar viajante ou hóspede. Aqui “hóspede” destaca a pessoa recebida pelo rico, ao passo que a nota registra a relação lexical com o viajante da primeira oração.
- source_word: כִּבְשַׂת
  choice: a cordeirinha
  rationale: O hebraico especifica uma cria fêmea. “Cordeirinha” é natural em português, mantém o gênero feminino e condiz com a descrição afetiva da parábola.
- source_word: הָאִישׁ הָרָאשׁ
  choice: o pobre
  rationale: רָאשׁ indica alguém pobre ou necessitado. A forma substantivada “o pobre” é clara e mantém o contraste direto com “o rico”.
- source_word: וַיַּעֲשֶׂהָ
  choice: a preparou
  rationale: A repetição de “preparar” conserva a ligação verbal com לַעֲשׂוֹת e evita acrescentar detalhes sobre como o animal foi cozido.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: que havia chegado / que tinha chegado à sua casa
  rationale: Os particípios descrevem o visitante que chegou até o rico. O mais-que-perfeito composto situa naturalmente essa chegada antes da preparação, e “à sua casa” comunica em português corrente a relação expressa pelas preposições hebraicas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva o contraste entre o rico e o pobre e entre os animais do rico e a única cordeirinha do pobre. Evitou-se um “agora” inicial, pois não há no hebraico uma palavra temporal explícita correspondente.
