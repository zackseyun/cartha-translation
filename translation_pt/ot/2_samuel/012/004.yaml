  to: Um viajante[a] chegou a um homem rico, e ele não quis tirar nada do seu próprio rebanho nem do seu próprio gado para preparar algo para o hóspede que havia chegado até ele. Então pegou a cordeirinha do homem pobre e a preparou para o homem que tinha chegado até ele.
