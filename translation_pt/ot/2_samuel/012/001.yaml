  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: pt
  text: 'Então Yahweh enviou Natã a Davi. Ele foi até Davi e lhe disse: “Havia dois homens numa cidade[a]: um era rico, e o outro, pobre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Numa cidade moravam dois homens”. Mais literalmente, o hebraico diz: “Havia dois homens numa cidade”.'
    reason: Registra a alternativa idiomática “moravam” sem apagar o sentido existencial mais literal de הָיוּ.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo שׁלח, nesta forma narrativa, indica de maneira direta que Yahweh incumbiu Natã de ir a Davi; “enviou” é natural e fiel ao contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת נָתָן
  choice: Natã
  rationale: O marcador de objeto direto אֶת não é traduzido; o nome נָתָן recebe sua forma portuguesa consagrada, “Natã”.
- source_word: אֶל דָּוִד
  choice: a Davi
  rationale: A preposição אֶל indica o destino da missão de Natã. “A Davi” evita antecipar a ideia interpretativa de que ele foi enviado “contra” Davi.
- source_word: וַיָּבֹא אֵלָיו
  choice: Ele foi até Davi
  rationale: בוא com אֶל pode ser expresso como “ir até” ou “vir a”. A repetição de “Davi” torna o referente do pronome hebraico inequívoco em português.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: O pronome indireto explícito no hebraico é preservado pelo pronome “lhe”, de forma idiomática em português.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dois homens
  rationale: A expressão se refere diretamente a dois indivíduos do sexo masculino na parábola de Natã.
- source_word: הָיוּ
  choice: Havia
  rationale: Aqui היה tem sentido existencial. “Havia” preserva esse valor sem acrescentar a noção contextual de residência presente em “moravam”.
- source_word: בְּעִיר אֶחָת
  choice: numa cidade
  rationale: Traduz literalmente a ideia de “em uma cidade” e soa natural em português. Não acrescenta “certa” nem explicita “na mesma cidade”.
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  choice: um era rico, e o outro, pobre
  rationale: A formulação portuguesa explicita a cópula necessária e expressa com naturalidade o contraste conciso do hebraico entre os dois homens.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Javé; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título; também segue a orientação terminológica fornecida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega “Natã”, forma portuguesa tradicional do nome, e mantém “Yahweh” como transliteração do nome divino. A pontuação com dois-pontos apresenta de modo fluido o contraste que se segue.
