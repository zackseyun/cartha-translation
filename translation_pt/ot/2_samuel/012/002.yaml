lexical_decisions:
- source_word: לְעָשִׁיר
  choice: O rico
  rationale: A construção com לְ e הָיָה expressa posse; no contraste narrativo com o pobre, a forma definida «o rico» é natural e contextual.
- source_word: הָיָה
  choice: tinha
  rationale: Embora signifique literalmente «era/estava», com לְ forma uma construção possessiva, vertida naturalmente em português por «tinha».
- source_word: צֹאן
  choice: ovelhas
  rationale: O termo coletivo designa animais de pequeno porte, sobretudo ovelhas e cabras; «ovelhas» é uma representação natural neste par de categorias pecuárias.
- source_word: וּבָקָר
  choice: e bois
  rationale: בָּקָר designa gado bovino; «bois» é uma forma corrente e concreta de expressar a categoria no contexto.
- source_word: הַרְבֵּה מְאֹד
  choice: muitíssimas
  rationale: A forma superlativa comunica de maneira concisa e enfática a quantidade extremamente grande indicada pela combinação hebraica.
