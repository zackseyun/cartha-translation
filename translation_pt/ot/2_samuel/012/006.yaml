  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: pt
  text: E terá de pagar quatro vezes pela cordeira, porque fez isso e porque não teve compaixão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não poupou”. O verbo hebraico pode enfatizar tanto o ato de se abster de causar dano quanto a compaixão que leva alguém a poupar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: a cordeirinha
  rationale: O substantivo designa uma cordeira, isto é, um animal jovem do sexo feminino. O diminutivo é natural em português e preserva a dimensão afetiva destacada na narrativa.
- source_word: יְשַׁלֵּם אַרְבַּעְתָּיִם
  choice: terá de pagar quatro vezes
  rationale: O Piel de שׁלם expressa compensação ou restituição, e o numeral indica pagamento quádruplo. A formulação comunica em português corrente o caráter obrigatório da sentença judicial sem sugerir que o mesmo animal seria devolvido repetidamente.
- source_word: עֵקֶב אֲשֶׁר
  choice: porque
  rationale: A locução introduz a razão da sentença; “porque” é seu equivalente mais direto e natural neste contexto.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: fez isso
  rationale: דָּבָר pode significar coisa, ato ou questão. “Fez isso” reproduz com naturalidade a referência ao ato narrado sem acrescentar uma avaliação não expressa no sintagma.
- source_word: לֹא חָמָל
  choice: não teve compaixão
  rationale: חמל pode descrever o ato de poupar motivado por piedade ou compaixão. No contexto, “não teve compaixão” expressa claramente a ausência de misericórdia, mantendo em nota a alternativa mais concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “porque” preserva a estrutura causal enfática do hebraico.
