  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: pt
  text: 'Então Natã disse a Davi: “Você é o homem![a] Assim diz Yahweh, o Deus de Israel: Eu ungi você como rei sobre Israel e eu livrei você da mão de Saul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você é aquele homem!” O hebraico diz literalmente: “Você é o homem”.'
    reason: Registra a alternativa contextual com demonstrativo, ao mesmo tempo que esclarece a forma literal do hebraico.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אַתָּה הָאִישׁ
  choice: Você é o homem!
  rationale: A oração nominal é enfática e constitui o clímax da parábola. A formulação preserva o artigo hebraico sem acrescentar o demonstrativo “aquele”.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em registro solene, claro e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica e seu título pactual.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Eu ... e eu
  rationale: A repetição explícita do pronome conserva a ênfase do hebraico nas duas ações divinas.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: ungi você rei
  rationale: “Ungir” preserva o ato histórico e teológico de designação ao ofício real; a construção predicativa é natural em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Expressa a autoridade régia indicada por עַל.
- source_word: הִצַּלְתִּיךָ
  choice: livrei você
  rationale: Comunica o resgate de perigo e poder hostil sem sugerir necessariamente a salvação em sentido técnico.
- source_word: מִיַּד שָׁאוּל
  choice: das mãos de Saul
  rationale: Mantém a imagem idiomática hebraica de mão como poder ou domínio; o plural é a forma idiomática mais natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e não o substitui por um título.
- issue: Ênfase da autodeclaração divina אָנֹכִי ... וְאָנֹכִי
  choice: Eu ... e eu
  alternative: Eu ... e também
  rationale: A repetição conserva a ênfase retórica de que foi o próprio Yahweh quem ungiu e livrou Davi, sem ampliar a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala profética mantém solenidade em “Assim diz”, enquanto “você” oferece clareza contemporânea. A exclamação preserva a força acusatória do clímax.
