  text: וַ/יֶּאֱסֹ֥ף דָּוִ֛ד אֶת כָּל הָ/עָ֖ם וַ/יֵּ֣לֶךְ רַבָּ֑תָ/ה וַ/יִּלָּ֥חֶם בָּ֖/הּ וַֽ/יִּלְכְּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: pt
  text: Então Davi reuniu todo o povo e foi a Rabá, lutou contra a cidade e a conquistou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o exército” ou “todas as tropas”; literalmente, “todo o povo” em hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: O verbo אסף indica juntar pessoas. “Reuniu” é natural em português e não especifica além do hebraico uma convocação militar formal.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Traduz literalmente a expressão hebraica. No contexto, provavelmente designa as forças de combate sob Davi, mas o texto usa עָם, e não um termo militar mais específico.
- source_word: רַבָּתָה
  choice: a Rabá
  rationale: O nome do lugar aparece com o hê direcional, indicando movimento em direção à cidade; em português, a preposição “a” expressa esse sentido.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: lutou contra a cidade
  rationale: לחם com בְּ indica entrar em combate contra alguém ou algo. Retomar Rabá como “a cidade” evita uma sequência pouco natural de pronomes e preserva claramente o referente do sufixo feminino hebraico.
- source_word: וַיִּלְכְּדָהּ
  choice: a conquistou
  rationale: לכד, em contexto de guerra contra uma cidade, significa capturar ou tomar. “Conquistou” é idiomático e deixa claro que Davi tomou a cidade militarmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição coordenada da narrativa hebraica foi mantida em estrutura fluente, e a nota preserva a possível referência militar de “todo o povo” sem inseri-la no texto principal.
