  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: pt
  text: Agora, reúna o restante das tropas, acampe contra a cidade e conquiste-a; caso contrário, eu mesmo conquistarei a cidade, e ela ficará conhecida pelo meu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e o meu nome será chamado sobre ela”, expressão que indica que a conquista da cidade seria atribuída a Joabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz com naturalidade a providência urgente que Joabe pede a Davi.
- source_word: אֱסֹף אֶת יֶתֶר הָעָם
  choice: reúna o restante das tropas
  rationale: Embora עָם possa significar “povo”, o contexto do cerco indica a força militar ainda disponível.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: acampe contra a cidade
  rationale: Mantém o sentido básico de חנה e a postura militar indicada por עַל, sem explicitar além do texto a ideia de sitiar.
- source_word: וְלָכְדָהּ
  choice: e conquiste-a
  rationale: לכד, no contexto de guerra contra uma cidade, denota tomá-la ou capturá-la; “conquistar” é claro e idiomático em português.
- source_word: פֶּן
  choice: caso contrário
  rationale: Expressa de modo corrente a advertência e o resultado indesejado introduzidos pela partícula.
- source_word: אֶלְכֹּד אֲנִי
  choice: eu mesmo conquistarei
  rationale: O pronome explícito אֲנִי dá ênfase ao sujeito; “eu mesmo” a reproduz e mantém a correspondência lexical com וְלָכְדָהּ.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: e ela ficará conhecida pelo meu nome
  rationale: Verte naturalmente o idiomatismo hebraico segundo o qual a conquista seria atribuída a Joabe, sem restringi-lo à ideia literal de renomear a cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos dirigidos a uma única pessoa. “Caso contrário” evita o arcaísmo de “para que não”, e a nota preserva a forma e a amplitude do idiomatismo hebraico.
