base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: pt
  text: E ele mandou uma mensagem por meio do profeta Natã[b] e deu ao menino o nome de Jedidias[a], por causa de Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jedidias provavelmente significa “amado de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão do profeta Natã”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico não identifica expressamente o sujeito de “deu ao menino o nome”. O contexto favorece Yahweh; também se pode entender que Natã deu o nome como seu mensageiro.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou uma mensagem
  rationale: O verbo significa literalmente “enviou”. Como não há objeto expresso e a ação ocorre por meio do profeta Natã, o contexto indica o envio de uma mensagem; esta formulação torna explícita a ideia implícita sem alterar o sentido.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: por meio do profeta Natã
  rationale: A expressão idiomática significa literalmente “pela mão do profeta Natã” e aqui indica mediação ou agência. “Por meio de” é natural em português moderno.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: deu ao menino o nome de
  rationale: O hebraísmo literal “chamou o nome dele” significa que alguém lhe deu um nome. A referência explícita ao menino evita que o pronome português pareça apontar para Natã.
- source_word: יְדִידְיָהּ
  choice: Jedidias
  rationale: Emprega-se a forma portuguesa tradicional e reconhecível do nome hebraico; seu provável significado é explicado em nota.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: A expressão apresenta Yahweh como razão ou fundamento do nome. “Por causa de” preserva essa relação sem especificá-la além do que o hebraico permite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sujeito dos verbos “mandou” e “deu”
  choice: Manter o sujeito implícito por meio de “ele”, como no hebraico
  alternative: Identificar Yahweh, Davi ou Natã explicitamente como sujeito
  rationale: O contexto favorece Yahweh como sujeito de “mandou”, mas a mudança ou continuidade do sujeito em “deu ao menino o nome” não é explicitada pela forma hebraica. O pronome e a nota preservam essa ambiguidade sintática sem impor uma interpretação.
- issue: Relação expressa por בַּעֲבוּר יְהוָה
  choice: por causa de Yahweh
  alternative: por amor a Yahweh; por ordem de Yahweh; por causa do amor de Yahweh
  rationale: A frase hebraica é breve e não especifica se Yahweh é a causa, o motivo ou aquele em consideração a quem o nome foi dado. A tradução conserva essa abertura.
translation_notes:
  register: Português atual, digno e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A construção “deu ao menino o nome de” evita um hebraísmo pouco natural, enquanto “por causa de Yahweh” conserva a concisão e a tensão interpretativa do original.
