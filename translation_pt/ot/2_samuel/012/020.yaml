source:
  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: pt
  text: Então Davi se levantou do chão, lavou-se, ungiu-se e trocou de roupa. Entrou na casa de Yahweh e prostrou-se[a]. Depois voltou para sua casa e pediu; puseram pão diante dele, e ele comeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorou”; o verbo hebraico pode indicar o ato físico de prostrar-se em reverência ou adoração.
    reason: Alternativa lexical que preserva a amplitude semântica do verbo hebraico.
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: se levantou do chão
  rationale: Expressa naturalmente a ação física de Davi após ter permanecido deitado no chão em luto.
- source_word: וַיִּרְחַץ
  choice: lavou-se
  rationale: O verbo pode indicar lavar-se ou banhar-se; a forma reflexiva é natural no contexto.
- source_word: וַיָּסֶךְ
  choice: ungiu-se
  rationale: Reflete a aplicação de óleo ao próprio corpo como parte do término do luto, sem ampliar a expressão.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: trocou de roupa
  rationale: Forma idiomática em português para a troca da veste ou das roupas.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica para o santuário e preserva o nome divino pessoal.
- source_word: וַיִּשְׁתָּחוּ
  choice: prostrou-se
  rationale: Preserva o gesto corporal de reverência sem substituir o verbo diretamente por uma interpretação litúrgica.
- source_word: וַיִּשְׁאַל
  choice: pediu
  rationale: O hebraico não explicita o objeto; a tradução mantém essa concisão e deixa que a oração seguinte esclareça o pedido.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o sentido lexical concreto, embora o termo também possa representar alimento em geral.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: puseram pão diante dele
  rationale: Reproduz a construção hebraica e conserva o sujeito plural não identificado.
- source_word: וַיֹּאכַל
  choice: ele comeu
  rationale: Conclusão narrativa simples e direta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de וַיִּשְׁתָּחוּ na casa de Yahweh
  choice: prostrou-se
  alternative: adorou
  rationale: O verbo descreve literalmente o ato de curvar-se ou prostrar-se em reverência; o contexto admite o sentido de adoração, mas a tradução principal preserva a ação concreta e a nota registra a alternativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência narrativa foi mantida concisa; “pediu” conserva deliberadamente o objeto implícito do hebraico.
