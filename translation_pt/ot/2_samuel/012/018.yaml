base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: pt
  text: 'No sétimo dia, a criança morreu. Os servos de Davi tiveram medo de lhe dizer que a criança estava morta, pois disseram: “Vejam, enquanto a criança ainda estava viva, falamos com ele, e ele não nos deu ouvidos. Como, então, lhe diremos: ‘A criança morreu’? Ele poderá fazer algum mal[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele poderá causar algum dano”, “Ele poderá reagir mal” ou, possivelmente, “Ele poderá fazer mal a si mesmo”. A expressão hebraica é breve e não especifica exatamente o que os servos temiam que ele fizesse.'
    reason: Preserva a ambiguidade lexical e referencial de וְעָשָׂה רָעָה, sem definir a natureza nem o alvo da ação temida.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Expressa naturalmente a transição temporal da narrativa sem o pouco idiomático «E aconteceu no sétimo dia».
- source_word: וַיָּמָת הַיָּלֶד
  choice: a criança morreu
  rationale: יֶלֶד pode designar menino ou criança; «criança» se ajusta melhor ao contexto do filho ainda muito pequeno.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: Os servos de Davi tiveram medo
  rationale: ירא indica aqui temor ou apreensão, não reverência.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: de lhe dizer que a criança estava morta
  rationale: «Dizer» é natural no contexto interpessoal, e «estava morta» apresenta o conteúdo da notícia temida.
- source_word: כִּי אָמְרוּ
  choice: pois diziam
  rationale: Introduz a explicação do medo dos servos; o imperfeito em português apresenta adequadamente a deliberação entre eles.
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Enquanto a criança ainda estava viva
  rationale: A construção temporal é comunicada com clareza; «ainda» realça o contraste com a morte. הִנֵּה funciona discursivamente para chamar atenção, mas não exige uma palavra separada em português.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: falamos com ele, e ele não nos deu ouvidos
  rationale: «Dar ouvidos» é uma expressão portuguesa corrente que preserva o sentido idiomático de ouvir a voz de alguém, isto é, atender ao que foi dito.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Como, então, lhe diremos
  rationale: Mantém a pergunta retórica e torna explícita a relação inferencial com a recusa anterior de Davi.
- source_word: מֵת הַיֶּלֶד
  choice: A criança morreu
  rationale: Na fala direta, a formulação verbal é natural em português e comunica claramente o acontecimento.
- source_word: וְעָשָׂה רָעָה
  choice: Ele poderá fazer algum mal
  rationale: Mantém indeterminados tanto o tipo de mal quanto seu possível objeto, como no hebraico conciso.
theological_decisions:
- issue: Sentido da ação temida em וְעָשָׂה רָעָה
  choice: Uma ação má ou danosa de natureza não especificada
  alternative: Ele poderá fazer mal a si mesmo; poderá cometer um mal; poderá reagir mal
  rationale: O hebraico não declara contra quem nem de que modo Davi poderia agir. A tradução evita impor uma leitura psicológica, moral ou autodestrutiva específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Servos» conserva o contexto da corte sem recorrer ao mais coloquial «empregados». A colocação pronominal é formal, mas corrente. O marcador [a] aparece no texto principal e esclarece a ambiguidade da oração final.
