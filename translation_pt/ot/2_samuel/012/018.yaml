  naturalness: O português é claro, moderno e apropriado ao registro narrativo. «Vejam» preserva naturalmente a chamada de atenção de הִנֵּה sem recorrer a um arcaísmo. A posição da chamada de nota deve acompanhar a expressão ambígua que ela esclarece.
  terminology: «Criança», «servos de Davi», «dar ouvidos» e «fazer algum mal» são escolhas adequadas. «Fazer algum mal» conserva, sem especificá-lo, tanto o ato temido como o seu possível alvo.
