  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: pt
  text: Os anciãos da casa dele[a] ficaram de pé junto dele para fazê-lo levantar-se do chão, mas ele não quis e não quis comer pão com eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os anciãos da casa real dele” ou “os anciãos do seu grupo doméstico”. O hebraico diz literalmente “os anciãos da casa dele”.
    reason: lexical_alternative
  - marker: b
    text: “Comer pão” é uma expressão hebraica que também pode significar simplesmente tomar alimento ou fazer uma refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ ... עָלָיו
  choice: ficaram de pé junto dele
  rationale: A combinação de קום com עַל descreve os anciãos em pé junto a Davi, agindo para levantá-lo. A formulação conserva a cena concreta sem sugerir que estivessem literalmente em cima dele.
- source_word: זִקְנֵי בֵיתוֹ
  choice: os anciãos da casa dele
  rationale: Reproduz de perto a construção hebraica e permite que “casa” denote o círculo doméstico ou a casa real; “os anciãos de sua família” seria restritivo demais.
- source_word: לַהֲקִימוֹ
  choice: para fazê-lo levantar-se
  rationale: O infinitivo causativo de קום indica fazer com que ele se levante; esta forma expressa claramente a causatividade em português.
- source_word: מִן הָאָרֶץ
  choice: do chão
  rationale: No contexto de Davi prostrado em jejum e luto, אֶרֶץ designa a superfície em que ele estava, expressa naturalmente por “chão”.
- source_word: וְלֹא אָבָה
  choice: mas ele não quis
  rationale: אָבָה exprime falta de vontade ou consentimento. “Não quis” é corrente e evita a intensidade adicional que “recusou-se” poderia sugerir.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: e não comeu pão com eles
  rationale: Mantém o elemento concreto לֶחֶם e a companhia indicada por אִתָּם. A nota esclarece que a expressão pode referir-se mais amplamente a tomar alimento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva a sequência narrativa hebraica, enquanto “ficaram de pé junto dele” e “fazê-lo levantar-se” tornam clara a ação física sem eliminar a possível amplitude de “casa” e “comer pão”.
