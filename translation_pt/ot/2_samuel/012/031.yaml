  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: pt
  text: Ele tirou o povo que estava nela e o pôs para trabalhar com serras[a], picaretas de ferro e machados de ferro, e o fez trabalhar na moldagem de tijolos[b]. Assim fez a todas as cidades dos amonitas[c]. Depois, Davi e todo o povo voltaram para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os pôs à serra e a instrumentos afiados de ferro e a instrumentos cortantes de ferro”. A identificação exata das ferramentas é incerta.'
    reason: Alternativa lexical e sintática.
  - marker: b
    text: 'O hebraico é difícil. Tradicionalmente: “os fez passar pela forma de tijolos”; alguns entendem isso como execução, e não como trabalho forçado.'
    reason: Preserva a leitura alternativa da construção hebraica e evita identificar indevidamente o termo com um forno.
  - marker: c
    text: Compare 1 Crônicas 20:3, relato paralelo cuja redação também é difícil.
    reason: Referência cruzada relevante para a interpretação.
lexical_decisions:
- source_word: הוֹצִיא
  choice: tirou de lá
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, tirar”. A expressão é natural em português e retoma a cidade mencionada no contexto.
- source_word: וַיָּשֶׂם
  choice: o pôs para trabalhar com
  rationale: Literalmente, “pôs/colocou”. Diante da lista de ferramentas, a formulação explicita a leitura contextual de trabalho imposto sem esconder, nas notas, a construção literal e sua possível interpretação mais severa.
- source_word: בַּמְּגֵרָה
  choice: com serras
  rationale: מְגֵרָה designa uma serra. O plural em português funciona naturalmente como coletivo instrumental.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: picaretas de ferro
  rationale: O termo é raro e pode indicar instrumentos afiados ou dispositivos de debulha. “Picaretas de ferro” é uma possibilidade concreta adequada ao contexto de trabalho, enquanto a incerteza lexical é registrada em nota.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: machados de ferro
  rationale: O substantivo indica instrumentos de corte, mas sua identificação exata é incerta. “Machados” oferece uma tradução clara e plausível; a nota mantém a alternativa genérica.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: os fez trabalhar
  rationale: A expressão significa literalmente “fez que passassem”. Em combinação com a expressão textual difícil seguinte, a tradução principal adota a leitura de serviço compulsório, sem excluir em nota a interpretação tradicional de execução.
- source_word: במלכן
  choice: no forno de tijolos
  rationale: A forma consonantal é difícil. A vocalização massorética sugere uma expressão relacionada à fabricação de tijolos, e o paralelo de 1Crônicas 20:3 favorece um contexto de trabalho. A ambiguidade é preservada em nota.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Fez o mesmo
  rationale: O imperfeito narrativamente resumitivo descreve o tratamento dado às demais cidades; esta é uma formulação corrente e clara em português.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: com todas as cidades dos amonitas
  rationale: “Amonitas” é o gentílico português natural para בְנֵי עַמּוֹן; “com” comunica de modo idiomático o objeto de “fez o mesmo”.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: voltaram para Jerusalém
  rationale: שוב com destino significa “voltar”. O verbo no plural acompanha naturalmente o sujeito composto “Davi e todo o povo” em português.
theological_decisions:
- issue: Se Davi executou os cativos amonitas com ferramentas e forno, ou se os submeteu a trabalho forçado
  choice: O texto principal apresenta os habitantes como submetidos a trabalho compulsório com ferramentas e no forno de tijolos.
  alternative: Outra leitura entende que ele os colocou sob serras e instrumentos de ferro e os fez passar pelo forno de tijolos, descrevendo execução.
  rationale: As construções com וַיָּשֶׂם e וְהֶעֱבִיר, além da forma difícil במלכן, permitem mais de uma interpretação. O contexto de subjugação e o paralelo de 1Crônicas 20:3 dão apoio à leitura laboral, mas não eliminam a leitura tradicional mais violenta; por isso, a alternativa é explicitamente mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Pôs para trabalhar” e “forno de tijolos” dão clareza à leitura principal de trabalho forçado; as notas preservam tanto a incerteza dos nomes das ferramentas quanto a interpretação tradicional de execução. Os marcadores aparecem em ordem textual [a], [b], [c].
