  terminology: «Amonitas», «serras», «picaretas de ferro» e «machados de ferro» são compreensíveis. A identificação das duas últimas categorias permanece incerta, como a nota adequadamente indica. «Moldagem de tijolos» é mais fiel que «forno de tijolos» para o último elemento difícil.
