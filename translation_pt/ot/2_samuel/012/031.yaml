revisions:
- from: Ele tirou de lá o povo que estava na cidade e o pôs para trabalhar com serras[a], picaretas de ferro e machados de ferro, e os fez trabalhar no forno de tijolos[b]. Fez o mesmo com todas as cidades dos amonitas[c]. Depois, Davi e todo o povo voltaram para Jerusalém.
  to: Ele tirou o povo que estava nela e o pôs para trabalhar com serras[a], picaretas de ferro e machados de ferro, e o fez trabalhar na moldagem de tijolos[b]. Assim fez a todas as cidades dos amonitas[c]. Depois, Davi e todo o povo voltaram para Jerusalém.
  rationale: A revisão substitui «forno de tijolos» por «moldagem de tijolos», que representa com maior precisão o termo hebraico difícil associado a molde/forma de tijolos, sem abandonar a leitura laboral adotada pelo texto-base. A nota correspondente mantém a leitura tradicional de execução. Também foram feitas pequenas melhorias de coesão pronominal e normalização editorial.
