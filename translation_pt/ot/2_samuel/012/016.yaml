  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: pt
  text: Davi buscou a Deus em favor do menino[a]. Davi fez um jejum[b], entrou, passou a noite e deitou-se no chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da criança”. Aqui, “o menino” se refere ao filho de Davi que havia sido atingido por uma enfermidade (versículos 15 e 18).
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “jejuou um jejum”. O hebraico emprega um verbo e um substantivo da mesma raiz para dar ênfase à ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: buscou
  rationale: O verbo בקש indica aqui uma busca insistente dirigida a Deus, com sentido de súplica inferido pelo contexto. “Buscou” preserva a formulação hebraica sem explicitar mais do que o verbo exige.
- source_word: אֶת־הָאֱלֹהִים
  choice: a Deus
  rationale: הָאֱלֹהִים é o objeto direto de “buscou”; em português, a regência natural pede “buscar a Deus”.
- source_word: בְּעַד
  choice: em favor de
  rationale: A preposição expressa ação em benefício de outra pessoa e, neste contexto, tem força intercessória. “Em favor de” comunica isso sem transformar o verbo explicitamente em “suplicar”.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר pode designar menino, jovem, servo ou criança. Aqui se refere ao filho pequeno de Davi; “menino” conserva mais diretamente o termo hebraico, enquanto “criança” também é possível pelo contexto.
- source_word: וַיָּצָם ... צוֹם
  choice: fez um jejum
  rationale: O hebraico combina o verbo e o substantivo cognatos, literalmente “jejuou um jejum”, dando destaque à ação. “Fez um jejum” mantém verbo e substantivo na tradução sem produzir uma expressão artificial em português; a nota registra a forma literal.
- source_word: וּבָא
  choice: entrou
  rationale: בוא pode significar vir, ir ou entrar. Sem destino expresso, “entrou” preserva o movimento para um espaço interior sugerido pela sequência narrativa.
- source_word: וְלָן
  choice: passou a noite
  rationale: לון significa pernoitar ou permanecer durante a noite. “Passou a noite” é claro e corrente.
- source_word: וְשָׁכַב אָרְצָה
  choice: deitou-se no chão
  rationale: שכב descreve deitar-se ou ficar deitado, e אָרְצָה indica direção ao chão ou à terra. “Deitou-se no chão” preserva naturalmente a postura descrita sem especificar um piso interno.
