base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: pt
  text: 'Então a ira de Davi se acendeu intensamente contra aquele homem, e ele disse a Natã: “Tão certo como Yahweh vive, o homem que fez isso merece morrer![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “é filho da morte”, isto é, está sujeito à morte ou merece morrer.'
    reason: Explica a expressão idiomática hebraica preservando sua forma literal como alternativa lexical.
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד
  choice: a ira de Davi se acendeu
  rationale: Preserva a imagem hebraica da ira que arde ou se acende, em uma formulação natural e digna em português.
- source_word: בָּאִישׁ
  choice: contra aquele homem
  rationale: A preposição indica o alvo da ira; o demonstrativo retoma com clareza o homem da parábola de Natã.
- source_word: מְאֹד
  choice: intensamente
  rationale: Representa explicitamente o advérbio hebraico de intensidade, sem depender apenas da metáfora da ira acesa.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Equivalente português natural da fórmula solene de juramento, preservando o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: introdução implícita da declaração
  rationale: Neste contexto, a partícula introduz o conteúdo da declaração confirmada pelo juramento; o português comunica isso naturalmente sem uma conjunção adicional.
- source_word: בֶן מָוֶת
  choice: merece morrer
  rationale: Comunica com clareza o sentido judicial da expressão idiomática hebraica; a forma literal é preservada em nota.
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: o homem que fez isso
  rationale: A oração relativa traduz com clareza a construção participial que identifica o culpado por sua ação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Tradução da expressão בֶן מָוֶת
  choice: merece morrer
  alternative: é filho da morte
  rationale: A expressão hebraica indica alguém passível da pena de morte. A tradução idiomática evita que o leitor moderno interprete a frase literalmente, enquanto a nota conserva sua forma original e transparência textual.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A imagem da ira que se acende foi mantida; o juramento recebeu uma formulação corrente, e o idioma jurídico hebraico foi traduzido pelo sentido, com a forma literal em nota.
