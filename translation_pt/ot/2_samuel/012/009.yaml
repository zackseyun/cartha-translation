  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: pt
  text: Por que você desprezou a palavra de Yahweh[a], fazendo o que é mau aos olhos dele? Você feriu Urias, o hitita, com a espada, tomou para si a mulher dele como esposa[b] e o matou pela espada dos amonitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tratou com desprezo a palavra de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tomou para si a mulher dele como esposa”; a formulação ressalta que Davi se apropriou pessoalmente da mulher de Urias.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “pela espada dos filhos de Amom”, isto é, Davi causou a morte de Urias por meio dos amonitas.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Reproduz diretamente a pergunta acusatória de Natã em português natural.
- source_word: בָּזִיתָ
  choice: desprezou
  rationale: Preserva a ideia forte de tratar com desdém ou desprezo, e não apenas de desobedecer.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a expressão hebraica ampla, que neste contexto abrange a ordem e a vontade revelada de Yahweh.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: fazendo o que é mau aos olhos dele
  rationale: Expressa naturalmente em português a ligação entre desprezar a palavra divina e praticar o mal, preservando a fórmula hebraica de avaliação.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: feriu ... com a espada
  rationale: Mantém o sentido básico de נכה e a referência instrumental à espada, sem antecipar o verbo explícito 'matou' que aparece depois.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: tomou para si a mulher dele como esposa
  rationale: Conserva tanto a apropriação pessoal marcada por לְךָ quanto a finalidade matrimonial de לְאִשָּׁה.
- source_word: הָרַגְתָּ
  choice: matou
  rationale: Equivalente direto do verbo comum הרג; o contexto já deixa clara a culpa de Davi.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: pela espada dos amonitas
  rationale: Preserva a repetição de 'espada' e indica que Davi causou a morte de Urias por meio das forças amonitas.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Urias, o hitita
  rationale: Emprega as formas tradicionais e amplamente reconhecidas em português para o nome e a designação étnica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz explicitamente o Tetragrama. 'Yahweh' preserva o nome da aliança sem substituí-lo por um título; 'Javé' seria uma forma aportuguesada possível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de “espada” e a sequência acusatória foram mantidas; a redundância hebraica sobre tomar a mulher como esposa foi preservada em grau legível e explicada em nota.
