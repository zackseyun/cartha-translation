base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: pt
  text: Então Natã foi para sua casa, e Yahweh feriu[a] o menino que a mulher de Urias[b] dera à luz a Davi, e ele adoeceu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afligiu” ou “atingiu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a mulher de Urias”, preservando a recusa deliberada da narrativa, neste ponto, de chamar Bate-Seba pelo nome.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “ficou enfermo”. O hebraico se refere ao menino adoecendo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foi
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: Reproduz de modo direto e corrente o sentido concreto de “casa dele”.
- source_word: וַיִּגֹּף
  choice: feriu
  rationale: O verbo נָגַף indica golpear ou atingir de modo nocivo. “Feriu” mantém a ação direta sem especificar além do texto a natureza do mal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: No contexto, refere-se ao filho pequeno de Davi; “menino” é natural e preserva o gênero gramatical do referente.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: que a mulher de Urias havia dado a Davi
  rationale: Preserva a oração relativa e, sobretudo, a designação deliberada “a mulher de Urias”, sem introduzir o nome Bate-Seba.
- source_word: וַיֵּאָנַשׁ
  choice: e ele adoeceu
  rationale: O verbo descreve o menino ficando enfermo. “Adoeceu” expressa o início do estado sem acrescentar aqui um grau explícito de gravidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Mantém no texto o nome pessoal divino apresentado pelo hebraico, em vez de substituí-lo por um título.
- issue: Agência na enfermidade do menino
  choice: Yahweh feriu o menino
  alternative: o menino foi afligido
  rationale: O hebraico atribui diretamente a ação a Yahweh. A tradução conserva essa agência explícita sem suavizá-la nem explicar sua causa ou mecanismo.
- issue: Designação da mãe da criança
  choice: a mulher de Urias
  alternative: Bate-Seba
  rationale: Preserva a formulação moralmente carregada da narrativa, que neste ponto evita nomeá-la diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão narrativa hebraica sem soar artificial. Os marcadores de nota foram colocados junto às palavras ou expressões que explicam.
