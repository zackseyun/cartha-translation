source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: pt
  text: Então Davi consolou Bate-Seba, sua esposa[a]. Depois, foi até ela e se deitou com ela[b]. Ela deu à luz um filho, e Davi lhe deu o nome de Salomão. E Yahweh o amou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confortou Bate-Seba, sua esposa”.'
    reason: lexical_alternative
  - marker: b
    text: As expressões hebraicas “foi até ela” e “se deitou com ela” referem-se a relações sexuais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: consolou
  rationale: O piel de נחם indica proporcionar consolo após uma perda. “Consolou” é natural em português e se ajusta diretamente ao luto pelo filho morto.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אִשְׁתּוֹ
  choice: sua esposa
  rationale: Mantém a designação explícita do hebraico, relevante para a situação de Bate-Seba neste ponto da narrativa.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: foi até ela e se deitou com ela
  rationale: Preserva, em linguagem digna e compreensível, a sequência e o eufemismo sexual do hebraico, sem tornar o texto mais explícito do que o original.
- source_word: וַתֵּלֶד בֵּן
  choice: Ela deu à luz um filho
  rationale: Equivalente português claro e corrente para a expressão hebraica.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: Davi lhe deu o nome de Salomão
  rationale: Expressa naturalmente o idioma hebraico de chamar ou dar um nome. O sujeito masculino singular é explicitado como Davi para evitar ambiguidade desnecessária em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֲהֵבוֹ
  choice: o amou
  rationale: Traduz diretamente אהב; o pronome se refere ao filho recém-nascido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação mantém a repetição discreta do hebraico e explicita Davi como sujeito da nomeação apenas para assegurar clareza natural.
