base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: pt
  text: 'Então Davi subiu para lá, e suas duas esposas também: Ainoã, a jezreelita, e Abigail, mulher de Nabal, o carmelita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico identifica Abigail como esposa de Nabal e Nabal como homem de Carmel; essa descrição remete ao casamento anterior de Abigail.
    reason: literary_clarification
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: subiu para lá
  rationale: O verbo עלה expressa movimento para cima ou em direção a um lugar elevado; “subiu para lá” preserva essa nuance direcional e retoma o destino indicado no contexto.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: e suas duas mulheres também
  rationale: A formulação natural em português conserva tanto a ideia aditiva de וְגַם quanto o número e a relação conjugal expressos no hebraico.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: Ainoã, a jezreelita
  rationale: O nome segue a forma tradicional em português, e o gentílico feminino identifica sua origem em Jezreel.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל
  choice: e Abigail, mulher de Nabal
  rationale: A expressão construta significa literalmente “mulher de Nabal”. Embora Abigail seja aqui contada entre as mulheres de Davi, o texto a identifica por seu casamento anterior, mantendo o vínculo com a narrativa precedente.
- source_word: הַכַּרְמְלִי
  choice: o carmelita
  rationale: O adjetivo gentílico masculino se refere a Nabal e o identifica como homem de Carmel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Mulheres” preserva o sentido de esposas no contexto sem tornar a frase excessivamente formal; os gentílicos mantêm de perto as identificações do hebraico.
