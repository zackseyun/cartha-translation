revisions:
- from: 'Então Abner gritou para Joabe: “A espada continuará devorando para sempre? Você não sabe que o fim será amargo? Até quando você deixará de dizer ao povo que pare de perseguir seus irmãos[a]?”'
  to: 'Então Abner chamou Joabe e disse: “A espada devorará para sempre? Você não sabe que, no fim, será amargo? Até quando você demorará a dizer ao povo que deixe de perseguir seus irmãos[a]?”'
  rationale: Substituí «gritou» por «chamou», pois o verbo hebraico não especifica grito. Reformulei a segunda pergunta para não impor «o fim» como sujeito explícito de «será amargo», e ajustei a última pergunta para exprimir claramente a demora de Joabe sem transformar אמר em uma ordem mais forte. A nota e sua âncora permanecem adequadas.
