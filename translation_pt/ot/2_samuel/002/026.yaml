base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: pt
  text: 'Então Abner chamou Joabe e disse: “A espada devorará para sempre? Você não sabe que, no fim, será amargo? Até quando você demorará a dizer ao povo que deixe de perseguir seus irmãos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que deixe de seguir seus irmãos”.'
    reason: A expressão hebraica מֵאַחֲרֵי significa literalmente afastar-se de detrás de alguém; no contexto, pode ser vertida de forma mais literal como “deixar de seguir” ou, militarmente, como “parar de perseguir”.
lexical_decisions:
- source_word: וַיִּקְרָא אַבְנֵר אֶל יוֹאָב
  choice: Abner gritou para Joabe
  rationale: קרא אל indica chamar alguém, e a distância entre os combatentes favorece “gritou para”, expressão natural no contexto.
- source_word: הֲלָנֶצַח
  choice: para sempre
  rationale: A expressão introduz uma pergunta retórica sobre a continuação indefinida do combate; “para sempre” é conciso e idiomático.
- source_word: תֹּאכַל חֶרֶב
  choice: a espada continuará devorando
  rationale: Preserva a personificação hebraica da espada que “come” ou “devora”; “continuará” explicita naturalmente em português a duração questionada por הֲלָנֶצַח.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: o fim será amargo
  rationale: Mantém a imagem de amargura e expressa de modo natural o resultado final da luta, sem definir além do texto o que exatamente será amargo.
- source_word: וְעַד מָתַי לֹא תֹאמַר לָעָם
  choice: Até quando você deixará de dizer ao povo
  rationale: Reproduz a pergunta sobre a demora de Joabe em agir. “Dizer” evita transformar o verbo אמר numa ordem formal mais forte do que o hebraico exige.
- source_word: לָשׁוּב מֵאַחֲרֵי אֲחֵיהֶם
  choice: que pare de perseguir seus irmãos
  rationale: No cenário militar, “voltar de detrás de” significa interromper a perseguição. “Pare de perseguir” comunica claramente essa ação, enquanto “irmãos” conserva a força familiar do conflito entre israelitas.
theological_decisions:
- issue: A designação dos perseguidos como אֲחֵיהֶם
  choice: seus irmãos
  alternative: seus parentes ou compatriotas
  rationale: 'A tradução literal conserva a tensão do relato: os combatentes estão matando membros do próprio povo. Não se acrescenta uma explicação identitária ou teológica ausente do verso.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora vívida da espada que devora e a referência aos adversários como irmãos foram preservadas; a sintaxe foi ajustada apenas onde necessário para soar natural.
