  source_fidelity: A personificação da espada que devora, a pergunta sobre a demora e «seus irmãos» são bem preservadas. Contudo, קרא אל significa primariamente «chamar», não exige «gritar»; e «o fim será amargo» torna «o fim» o sujeito explícito, enquanto o hebraico deixa o referente de «será amargo no final» menos definido.
  naturalness: A redação revisada mantém um português atual, claro e digno. «Até quando você demorará a dizer ao povo...» exprime com naturalidade a demora implícita na pergunta hebraica.
  terminology: «Espada», «devorar», «amargo» e «irmãos» conservam as imagens e os termos relevantes do original. A alternativa em nota preserva a leitura mais literal de מֵאַחֲרֵי.
