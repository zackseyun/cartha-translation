  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: pt
  text: Então Abner, filho de Ner, e os servos de Is-Bosete[a], filho de Saul, saíram de Maanaim para Gibeão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “Is-Bosete”; o mesmo homem é chamado “Esbaal” em 1 Crônicas 8:33; 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Então ... saíram
  rationale: O wayyiqtol faz a narrativa avançar, e “Então” expressa com naturalidade essa progressão. Embora o verbo hebraico esteja no singular, ele precede um sujeito composto — Abner e os servos —, por isso o plural é natural e gramatical em português.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, filho de Ner
  rationale: Os nomes próprios seguem formas portuguesas convencionais, e o patronímico é traduzido diretamente.
- source_word: וְעַבְדֵי
  choice: e os servos de
  rationale: עֶבֶד pode designar servo, oficial ou subordinado. “Servos” preserva a amplitude lexical sem definir mais precisamente do que o contexto permite a função militar ou política desses homens.
- source_word: אִישׁ בֹּשֶׁת
  choice: Is-Bosete
  rationale: Esta forma translitera de modo convencional em português o nome presente no texto massorético de Samuel. A forma paralela Esbaal, preservada em Crônicas, é registrada em nota.
- source_word: בֶּן שָׁאוּל
  choice: filho de Saul
  rationale: Tradução direta do patronímico que identifica Is-Bosete.
- source_word: מִמַּחֲנַיִם
  choice: de Maanaim
  rationale: A preposição מִן indica o ponto de partida, e Maanaim é a forma portuguesa convencional do topônimo.
- source_word: גִּבְעֹנָה
  choice: para Gibeão
  rationale: O ה direcional anexado ao topônimo indica movimento em direção a Gibeão; “para” é a expressão mais natural em português neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem frasal natural. O marcador da nota foi colocado junto a “Is-Bosete”, pois a nota explica a forma desse nome.
