source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: pt
  text: 'Então os homens de Judá vieram e ali ungiram Davi rei sobre a casa de Judá. E disseram a Davi: “Os homens de Jabes-Gileade foram os que sepultaram Saul”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, simplesmente: “Os homens de Jabes-Gileade sepultaram Saul.”'
    reason: A oração relativa hebraica pode ser traduzida sem explicitar a força identificadora representada por “foram os que”.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O verbo בוא descreve aqui a chegada dos homens de Judá; “vieram” é a forma narrativa direta e natural em português.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: os homens de Judá
  rationale: אַנְשֵׁי significa especificamente “homens de”; a formulação preserva a referência masculina do hebraico e se ajusta ao contexto de representantes da tribo.
- source_word: וַיִּמְשְׁחוּ
  choice: ungiram
  rationale: Em contexto régio, משׁח é o verbo tradicional e preciso para a unção de um rei, preservando tanto a dimensão política quanto a religiosa do ato.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio indica o lugar já estabelecido no contexto; “ali” é idiomático e mantém essa referência narrativa.
- source_word: לְמֶלֶךְ
  choice: rei
  rationale: Depois de “ungiram”, “rei” funciona naturalmente como complemento predicativo em português, sem necessidade de acrescentar “como”.
- source_word: עַל בֵּית יְהוּדָה
  choice: sobre a casa de Judá
  rationale: Mantém a imagem corporativa e tribal de בֵּית, evitando reduzi-la apenas ao território ou substituí-la explicitamente por “tribo”.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: E disseram a Davi
  rationale: נגד no hiphil significa contar, comunicar ou informar, e לֵאמֹר introduz o conteúdo citado. Em português, “disseram a Davi” comunica a estrutura com naturalidade, sem o pouco idiomático “dizendo”.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: Os homens de Jabes-Gileade
  rationale: Preserva o sentido masculino de אַנְשֵׁי e usa uma forma portuguesa clara do topônimo composto.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: foram os que sepultaram Saul
  rationale: A formulação expressa a identificação feita no relato, ao mesmo tempo que a nota registra a possibilidade de entender a oração relativa de maneira mais simples.
theological_decisions:
- issue: Linguagem coletiva marcada por gênero em אַנְשֵׁי
  choice: homens nas duas ocorrências
  alternative: povo; habitantes; líderes
  rationale: O substantivo hebraico é lexicalmente masculino. Neste contexto, provavelmente se refere aos representantes masculinos envolvidos nos atos públicos narrados; não há razão textual suficiente para neutralizar ou especificar ainda mais o grupo.
- issue: Imagem corporativa em בֵּית יְהוּדָה
  choice: casa de Judá
  alternative: Judá; tribo de Judá
  rationale: “Casa” preserva a metáfora hebraica para a coletividade tribal e política sem impor uma delimitação mais estreita que a do texto.
- issue: Força identificadora da oração אֲשֶׁר קָבְרוּ
  choice: foram os que sepultaram Saul
  alternative: sepultaram Saul
  rationale: O texto permite ouvir o informe como identificação dos responsáveis pelo sepultamento. Como a oração relativa também pode ser entendida de modo mais simples, essa alternativa é preservada em nota, sem transformar a diferença em afirmação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ali”, “ungiram” e “sepultaram” mantêm um registro narrativo bíblico natural sem arcaísmo excessivo. O marcador [a] foi colocado junto à oração a que a nota efetivamente se refere.
