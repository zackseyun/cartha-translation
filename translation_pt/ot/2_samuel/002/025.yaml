  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: pt
  text: Então os filhos de Benjamim se reuniram atrás de Abner[a], formaram um só grupo[b] e tomaram posição no alto de uma colina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seguindo Abner”. A expressão hebraica pode indicar tanto uma posição espacial (“atrás”) quanto seguimento ou lealdade (“seguindo”).
    reason: lexical_alternative
  - marker: b
    text: Ou “um só bando” ou “uma só companhia”. O termo hebraico se refere a um conjunto unido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: se reuniram
  rationale: O hitpael de קבץ expressa uma reunião coletiva. “Se reuniram” é natural em português e comunica o reagrupamento dos combatentes.
- source_word: בְנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a expressão hebraica de parentesco, que é compreensível em português e preserva a forma do texto-fonte.
- source_word: אַחֲרֵי אַבְנֵר
  choice: atrás de Abner
  rationale: אַחֲרֵי pode indicar posição espacial ou seguimento e lealdade. “Atrás de Abner” conserva a imagem espacial no contexto militar sem eliminar a possível ideia de segui-lo.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: um só grupo
  rationale: אֲגֻדָּה designa um conjunto unido. “Um só grupo” ressalta tanto a unidade quanto o reagrupamento, em linguagem portuguesa atual.
- source_word: וַיַּעַמְדוּ
  choice: tomaram posição
  rationale: No contexto de combate, עמד indica mais do que simplesmente ficar em pé; sugere assumir e manter uma posição defensiva.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: no alto de uma colina
  rationale: רֹאשׁ tem sentido topográfico de “alto” ou “cume”. O artigo indefinido representa naturalmente אֶחָת neste contexto, sem sugerir contraste numérico desnecessário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução preserva a repetição conceitual de reunião e unidade, mantém a ambiguidade de אַחֲרֵי por meio de nota e usa linguagem militar natural em “tomaram posição”.
