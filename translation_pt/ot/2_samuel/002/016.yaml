revisions:
- from: Cada um agarrou seu adversário pela cabeça, e sua espada ficou cravada no lado do adversário; assim, todos caíram juntos. Por isso, aquele lugar em Gibeom recebeu o nome de Helcate-Hazurim.[a]
  to: Cada um agarrou seu adversário pela cabeça, e a espada de cada um estava no lado do seu adversário; assim, eles caíram juntos. Por isso, aquele lugar em Gibeom recebeu o nome de Helcate-Hazurim.[a]
  rationale: A revisão remove a implicação adicional de que as espadas permaneceram cravadas e substitui “todos” por “eles”, preservando com maior precisão o referente dos combatentes. A formulação “a espada de cada um ... do seu adversário” explicita em português a distribuição já presente no singular distributivo hebraico. A nota foi ajustada para identificar corretamente o termo como topônimo e conservar a incerteza de sua etimologia.
