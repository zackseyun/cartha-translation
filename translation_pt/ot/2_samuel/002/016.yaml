base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: pt
  text: Cada um agarrou seu adversário pela cabeça, e a espada de cada um estava no lado do seu adversário; assim, eles caíram juntos. Por isso, aquele lugar em Gibeom recebeu o nome de Helcate-Hazurim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Helcate-Hazurim é a transliteração de um topônimo hebraico cujo sentido exato é incerto. Entre os sentidos propostos estão “Campo dos Lados” e “Campo das Espadas Afiadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
  choice: agarraram
  rationale: Neste combate, חזק descreve um ato enérgico de segurar. “Agarraram” comunica força e violência de modo natural em português.
- source_word: אִישׁ
  choice: Cada um
  rationale: O singular distributivo indica que cada combatente agiu contra o homem à sua frente. “Cada um” preserva essa ação recíproca sem repetição pesada.
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: seu adversário pela cabeça
  rationale: רֹאשׁ significa literalmente “cabeça”. Aqui, רֵעַ designa o outro integrante de cada dupla de combatentes; “adversário” evita a conotação amistosa que “companheiro” teria neste contexto.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: e sua espada ficou cravada no lado do adversário
  rationale: A frase hebraica é nominal e muito condensada, literalmente com a espada “no lado” do outro. “Ficou cravada” torna a cena inteligível em português sem acrescentar um golpe explicitamente narrado, e “lado” preserva צַד.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: assim, todos caíram juntos
  rationale: יַחְדָּו ressalta que caíram conjuntamente. “Assim” expressa o resultado natural da ação anterior; “todos” deixa claro que o plural abrange os combatentes dos dois grupos.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Por isso, aquele lugar ... recebeu o nome
  rationale: O sujeito singular da nomeação não é especificado no hebraico. A construção impessoal “recebeu o nome” preserva essa indefinição, e “Por isso” comunica a relação entre o acontecimento e o topônimo.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helcate-Hazurim
  rationale: O topônimo foi transliterado em forma legível em português. Como sua etimologia é incerta, traduzi-lo no corpo do texto resolveria indevidamente uma ambiguidade real.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: em Gibeom
  rationale: A expressão localiza o lugar nomeado. A formulação concisa “aquele lugar em Gibeom” transmite naturalmente a função da oração relativa hebraica.
