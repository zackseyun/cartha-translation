  text: וְ/עַבְדֵ֣י דָוִ֗ד הִכּוּ֙ מִ/בִּנְיָמִ֔ן וּ/בְ/אַנְשֵׁ֖י אַבְנֵ֑ר שְׁלֹשׁ מֵא֧וֹת וְ/שִׁשִּׁ֛ים אִ֖ישׁ מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/031.yaml
  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: pt
  text: Mas[a] os servos de Davi feriram trezentos e sessenta homens de Benjamim e dos homens de Abner, e eles morreram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “E”. A conjunção hebraica pode ser traduzida simplesmente por “e”; o texto principal usa “mas” para expressar o contraste com o número de baixas mencionado no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Mas os servos de Davi
  rationale: A conjunção וְ pode ser simplesmente aditiva, mas aqui introduz contraste com as baixas do lado de Davi no versículo anterior. “Servos” preserva עֲבָדִים no sentido contextual de homens a serviço de Davi, inclusive como combatentes.
- source_word: הִכּוּ
  choice: feriram
  rationale: נכה designa golpear ou ferir e, em contexto de batalha, pode ter resultado mortal. “Feriram” mantém o verbo distinto de מֵתוּ, que declara explicitamente a morte.
- source_word: מִ/בִּנְיָמִן
  choice: de Benjamim
  rationale: A preposição מִן indica o grupo do qual vieram as baixas; a forma mantém a referência tribal sem substituir o nome pela designação interpretativa “benjamitas”.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: e dos homens de Abner
  rationale: A expressão identifica os homens ligados a Abner entre os atingidos. A formulação portuguesa é natural e mantém a coordenação do hebraico.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: trezentos e sessenta homens
  rationale: Reprodução direta do número e do substantivo coletivo singular hebraico em plural idiomático português.
- source_word: מֵתוּ
  choice: e eles morreram
  rationale: Mantém explícita a afirmação hebraica de que os atingidos morreram, sem fundir הִכּוּ e מֵתוּ num único verbo como “mataram”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção conserva separados o ato de ferir e o resultado da morte, como no hebraico, e mantém “servos” no sentido de homens a serviço de Davi.
