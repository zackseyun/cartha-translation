  text: וַֽ/יִּרְדְּפ֛וּ יוֹאָ֥ב וַ/אֲבִישַׁ֖י אַחֲרֵ֣י אַבְנֵ֑ר וְ/הַ/שֶּׁ֣מֶשׁ בָּ֔אָה וְ/הֵ֗מָּה בָּ֚אוּ עַד גִּבְעַ֣ת אַמָּ֔ה אֲשֶׁר֙ עַל פְּנֵי גִ֔יחַ דֶּ֖רֶךְ מִדְבַּ֥ר גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: pt
  text: Joabe e Abisai perseguiram Abner. O sol se pôs, e eles chegaram até a colina de Amá, que fica diante de Giá[a], no caminho para o deserto de Gibeão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente a Giá”; a expressão hebraica pode indicar uma posição diante de ou defronte de um lugar.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela estrada do deserto de Gibeão”; o hebraico pode destacar a rota, e não apenas a direção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: perseguiram Abner
  rationale: O verbo רדף, seguido de אַחֲרֵי, descreve perseguição em contexto hostil ou militar. A construção portuguesa é natural e conserva a força da ação.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: O sol se pôs
  rationale: A expressão hebraica, literalmente semelhante a “o sol veio”, é um idiomatismo que indica o pôr do sol. A formulação escolhida comunica isso de modo claro e corrente.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: e eles chegaram até
  rationale: O pronome explícito dá leve continuidade ou ênfase narrativa, enquanto עַד marca o limite alcançado. A tradução preserva ambos sem tornar a frase pesada.
- source_word: גִּבְעַת אַמָּה
  choice: a colina de Amá
  rationale: A cadeia construta designa uma elevação associada ao topônimo Amá. “Colina” corresponde ao sentido de גִּבְעָה e é claro em português moderno.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: que fica diante de Giá
  rationale: A expressão עַל־פְּנֵי pode indicar uma posição diante de, em frente a ou defronte de um lugar. “Diante de” mantém essa flexibilidade espacial.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: no caminho para o deserto de Gibeão
  rationale: דֶּרֶךְ pode significar “caminho” ou “estrada” e aqui indica a rota relacionada ao deserto de Gibeão. A tradução é natural sem especificar além do hebraico.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Joabe / Abisai / Abner / Amá / Giá / Gibeão
  rationale: Os nomes seguem formas portuguesas tradicionais e reconhecíveis, com transliteração direta nos topônimos menos conhecidos.
