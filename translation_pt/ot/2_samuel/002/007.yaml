  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: pt
  text: Agora, que as mãos de vocês sejam fortes e sejam homens valentes[a], pois Saul, seu senhor, morreu, e a casa de Judá também me ungiu como rei sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens de valor”. A expressão hebraica indica coragem e capacidade, muitas vezes em contexto militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: A expressão contém explicitamente o advérbio temporal עַתָּה, precedido pela conjunção וְ; “Agora” preserva a transição e o avanço do discurso sem exigir um “e” pouco natural no início do versículo em português.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: que as mãos de vocês sejam fortes
  rationale: Mantém a imagem concreta do idioma hebraico e expressa naturalmente em português o valor exortativo da forma verbal. A locução comunica firmeza, disposição e capacidade para agir.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: e sejam homens valentes
  rationale: היה tem aqui força exortativa, enquanto בְּנֵי חַיִל designa homens de coragem e capacidade, frequentemente em contexto militar ou de liderança.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: pois Saul, seu senhor, morreu
  rationale: “Pois” expressa a função explicativa de כִּי. “Seu senhor” representa o título político e honorífico dado a Saul, e “morreu” traduz de modo direto o perfeito hebraico.
- source_word: וְגַם אֹתִי
  choice: e ... também ... a mim
  rationale: A formulação preserva o pronome objeto enfático אֹתִי e a partícula aditiva גַּם. A ordem portuguesa é ajustada para legibilidade, sem apagar o destaque dado a Davi.
- source_word: מָשְׁחוּ בֵית יְהוּדָה
  choice: a casa de Judá ... ungiu
  rationale: “Casa de Judá” conserva a designação coletiva hebraica do grupo tribal, e “ungiu” mantém a linguagem cerimonial de nomeação régia.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: como rei sobre eles
  rationale: “Como rei” explicita naturalmente em português a função para a qual Davi foi ungido, enquanto “sobre eles” conserva a relação de governo expressa no hebraico.
theological_decisions:
- issue: Expressão masculina em לִבְנֵי חַיִל
  choice: homens valentes
  alternative: pessoas valentes; sejam corajosos
  rationale: O masculino plural é preservado porque Davi se dirige, no contexto, aos homens ligados à defesa e à liderança de Jabes-Gileade. A tradução não neutraliza nem amplia silenciosamente o referente.
- issue: Sentido de אֲדֹנֵיכֶם aplicado a Saul
  choice: seu senhor
  alternative: seu mestre; seu governante
  rationale: O termo é um título humano de autoridade e lealdade política neste contexto, não o nome divino nem uma afirmação cristológica.
- issue: Ênfase de וְגַם אֹתִי
  choice: também ungiu a mim
  alternative: além disso, ungiu-me; também a casa de Judá me ungiu
  rationale: A redação mantém a ênfase do hebraico em Davi como objeto da unção, evitando deslocar inequivocamente o sentido de “também” para a casa de Judá.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. Preserva-se a imagem hebraica das mãos fortes, embora ela seja menos idiomática em português, e mantém-se a designação coletiva “casa de Judá”. A pontuação separa as duas razões apresentadas por Davi. O “Agora” traduz o עַתָּה explicitamente presente no texto hebraico.
