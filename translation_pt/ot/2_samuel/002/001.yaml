  source_fidelity: A tradução representa com precisão a sequência narrativa hebraica, a consulta de Davi a Yahweh, a pergunta deliberativa sobre subir a uma cidade de Judá, a resposta imperativa e o destino Hebrom. «Consultou Yahweh» comunica adequadamente o sentido de buscar orientação presente em וַיִּשְׁאַל ... בַּיהוָה. «Para onde» e «Para Hebrom» exprimem de modo claro o valor direcional do hebraico.
