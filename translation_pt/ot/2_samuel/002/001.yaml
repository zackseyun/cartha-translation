language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: pt
  text: 'Depois disso, Davi consultou Yahweh[a]: “Devo subir a uma das cidades de Judá?” Yahweh lhe respondeu: “Suba.” Então Davi perguntou: “Para onde devo subir?” Ele respondeu: “Para Hebrom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal da fórmula narrativa hebraica, sem a rigidez de uma reprodução literal como “E aconteceu depois disso”.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consultou Yahweh
  rationale: A construção com שׁאל e a preposição ב, seguida do nome divino, indica a busca de orientação divina, sentido mais específico do que simplesmente “perguntou a”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: O infinitivo introduz o conteúdo da consulta; em português atual, os dois-pontos antes do discurso direto cumprem essa função com maior naturalidade do que “dizendo”.
- source_word: הַאֶעֱלֶה
  choice: Devo subir
  rationale: Preserva tanto a pergunta deliberativa quanto o verbo direcional עלה, adequado ao movimento para as cidades da região montanhosa de Judá.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: a uma das cidades de Judá
  rationale: Representa claramente o destino entre as cidades pertencentes a Judá; a preposição “a” é natural com o verbo de movimento neste registro.
- source_word: עֲלֵה
  choice: Suba
  rationale: Mantém a repetição lexical do verbo empregado na pergunta de Davi e traduz diretamente o imperativo.
- source_word: אָנָה
  choice: Para onde
  rationale: Explicita que a pergunta trata do destino e soa natural no português contemporâneo.
- source_word: חֶבְרֹנָה
  choice: Para Hebrom
  rationale: A terminação direcional hebraica indica movimento rumo à cidade; “para” torna esse valor explícito em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva esse caráter e evita substituí-lo silenciosamente pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “subir” foi preservada por refletir a estrutura e o sentido geográfico do hebraico; “dizendo” foi convertido em pontuação natural no discurso direto.
