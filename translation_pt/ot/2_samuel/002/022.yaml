base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: pt
  text: 'Abner tornou a dizer a Asael: “Deixe de me seguir. Por que eu haveria de derrubá-lo por terra? Depois, como eu poderia levantar o rosto diante de Joabe, seu irmão?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: Abner tornou a dizer
  rationale: A construção idiomática indica que Abner falou mais uma vez; “tornou a dizer” preserva de modo natural a força reiterativa.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: Pare de me perseguir
  rationale: Literalmente, a expressão descreve afastar-se de trás de alguém. No contexto de perseguição, esta formulação comunica com clareza a ordem de deixar de segui-lo.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Por que eu haveria de ferir você e derrubá-lo por terra?
  rationale: נכה no hifil expressa golpear ou ferir, enquanto אַרְצָה acrescenta o movimento para o chão. A tradução conserva a imagem vívida sem explicitar “matar”, embora o perigo fatal esteja implícito.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: Depois, como eu poderia levantar o rosto
  rationale: Mantém a imagem hebraica de levantar o rosto, expressão que sugere poder comparecer diante de alguém sem vergonha ou culpa.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: diante de Joabe, seu irmão
  rationale: Com a expressão “levantar o rosto”, אֶל identifica a pessoa que Abner teria de encarar; “diante de” torna essa relação natural em português.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asael / Abner / Joabe
  rationale: Os nomes seguem formas portuguesas tradicionais e amplamente reconhecíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução combina naturalidade com a preservação da imagem hebraica em “levantar o rosto diante de”. Não foi necessária nota de rodapé, pois o idioma pode ser mantido no texto com sentido compreensível pelo contexto.
