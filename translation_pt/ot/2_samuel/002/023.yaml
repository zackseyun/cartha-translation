base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: pt
  text: Mas ele se recusou a desviar-se. Então Abner o atingiu no ventre[a] com a parte de trás da lança, e a lança saiu pelas costas. Asael caiu ali e morreu naquele mesmo lugar. Todos os que chegavam ao lugar onde Asael havia caído e morrido paravam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico חֹמֶשׁ é tradicionalmente traduzido em algumas versões como “quinta costela”, mas provavelmente se refere de modo mais geral ao abdômen ou ventre neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: ele se recusou a desviar-se
  rationale: Mantém o sentido explícito de recusa em מאן e o movimento concreto de afastar-se ou sair do caminho em סור, sem acrescentar diretamente “parar de perseguir”.
- source_word: וַיַּכֵּהוּ
  choice: o atingiu
  rationale: נכה descreve o golpe desferido por Abner; “atingiu” é corrente, digno e adequado ao fato de a lança atravessar o corpo.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: com a extremidade traseira da lança
  rationale: Expressa de forma clara a parte posterior da lança, evitando que “cabo” seja entendido como toda a haste e sem pressupor mais detalhes sobre sua forma.
- source_word: אֶל הַחֹמֶשׁ
  choice: no ventre
  rationale: חֹמֶשׁ é um termo anatômico difícil. Neste contexto bélico, “ventre” comunica naturalmente a região abdominal sem adotar como certa a interpretação tradicional “quinta costela”.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: a lança saiu pelas costas
  rationale: 'Torna explícita em português a trajetória indicada pelo hebraico: a lança atravessou Asael e emergiu por trás.'
- source_word: וַיִּפָּל שָׁם וַיָּמָת תַּחְתָּו
  choice: Asael caiu ali e morreu naquele mesmo lugar
  rationale: Preserva a sequência narrativa e traduz תחתיו como referência enfática ao próprio lugar onde ele caiu, sem recorrer a uma expressão excessivamente coloquial.
- source_word: כָּל הַבָּא ... וַיַּעֲמֹדוּ
  choice: Todos os que chegavam ... paravam
  rationale: O particípio sugere as pessoas que iam chegando sucessivamente; עמד, no contexto, indica que interrompiam o avanço ao chegar ao local.
