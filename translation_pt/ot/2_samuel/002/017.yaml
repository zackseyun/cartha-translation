  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: pt
  text: A batalha foi extremamente intensa[a] naquele dia, e Abner e os homens de Israel foram derrotados diante dos servos de Davi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi extremamente dura”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “servos de Davi” se refere aos homens ou combatentes a serviço de Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: a batalha
  rationale: No contexto imediato, refere-se ao confronto específico daquele dia, não a uma guerra prolongada.
- source_word: קָשָׁה עַד מְאֹד
  choice: extremamente intensa
  rationale: קָשָׁה expressa dureza ou severidade, e עַד מְאֹד reforça o grau. Em português atual, “extremamente intensa” comunica com naturalidade a violência do combate sem exagerar o sentido.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Reproduz de modo natural e direto a expressão temporal hebraica.
- source_word: וַיִּנָּגֶף
  choice: foram derrotados
  rationale: O nifal de נָגַף, neste contexto militar, indica derrota diante do inimigo, e não necessariamente que cada indivíduo tenha sido ferido ou morto.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: e os homens de Israel
  rationale: Preserva a formulação concreta do hebraico e, no contexto, designa os homens que combatiam sob Abner.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém o idioma hebraico comum para uma derrota sofrida perante uma força adversária.
- source_word: עַבְדֵי דָוִד
  choice: os servos de Davi
  rationale: Conserva o termo עֶבֶד e sua dimensão de serviço e lealdade, embora aqui ele se refira aos homens ou combatentes de Davi.
