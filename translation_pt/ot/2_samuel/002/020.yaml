lexical_decisions:
- source_word: וַיִּפֶן
  choice: se virou
  rationale: O verbo פנה indica virar-se; a forma pronominal é natural em português neste contexto de perseguição.
- source_word: אַחֲרָיו
  choice: para trás
  rationale: Preserva a orientação espacial do hebraico sem restringir o ato a apenas olhar.
- source_word: וַיֹּאמֶר
  choice: perguntou / respondeu
  rationale: O verbo geral 'disse' é vertido conforme a função explícita de cada fala no diálogo, produzindo português natural sem alterar o sentido.
- source_word: הַאַתָּה זֶה
  choice: É você
  rationale: A construção hebraica com pronome e demonstrativo é uma fórmula de identificação; 'É você?' comunica naturalmente essa força em português.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Adota a forma tradicional e corrente do nome bíblico em português.
- source_word: אָנֹכִי
  choice: Sou eu
  rationale: O pronome independente constitui uma resposta completa de autoidentificação; 'Sou eu' é a expressão idiomática equivalente em português.
