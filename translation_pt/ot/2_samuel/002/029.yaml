base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: pt
  text: Abner e seus homens seguiram pela Arabá durante toda aquela noite, atravessaram o Jordão, percorreram todo o Bitrom[a] e chegaram a Maanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “percorreram toda a região das ravinas” ou “dos desfiladeiros”. O termo hebraico Bitrom pode ser um nome de lugar ou uma designação geográfica descritiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: pela Arabá
  rationale: O termo pode designar especificamente a região geográfica da Arabá, no vale do Jordão, e não apenas uma planície genérica. A transliteração preserva esse provável valor toponímico.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: durante toda aquela noite
  rationale: Expressa de modo natural em português a duração por toda a noite, mantendo o demonstrativo do hebraico.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: atravessaram o Jordão
  rationale: O verbo עבר com o rio como objeto indica claramente a travessia do Jordão.
- source_word: כָּל הַבִּתְרוֹן
  choice: percorreram todo o Bitrom
  rationale: הַבִּתְרוֹן pode ser um topônimo ou uma designação geográfica descritiva. Manter “Bitrom” evita definir indevidamente o referente, enquanto “percorreram todo” representa a extensão do trajeto.
- source_word: מַחֲנָיִם
  choice: Maanaim
  rationale: É um nome próprio de lugar, transliterado segundo uma forma bíblica portuguesa reconhecível.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: seguiram ... percorreram ... chegaram
  rationale: 'A sequência conserva a progressão narrativa: deslocamento prolongado, percurso por uma região e chegada ao destino, em português natural.'
- source_word: וַאֲנָשָׁיו
  choice: seus homens
  rationale: É a tradução direta e concisa; o contexto é militar, mas “soldados” explicitaria mais do que o hebraico.
