base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: pt
  text: 'Então Abner lhe disse: “Desvie-se para a sua direita ou para a sua esquerda, agarre um dos jovens e pegue para si o equipamento dele[a].” Mas Asael não quis desviar-se de segui-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a armadura dele”. O termo hebraico provavelmente se refere ao equipamento retirado de um combatente abatido; não se sabe ao certo qual item está em vista.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה לְךָ
  choice: Desvie-se
  rationale: O imperativo de נטה, neste contexto de perseguição, pede que Asael saia do curso que segue; “desvie-se” comunica isso de modo natural.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: para a direita ou para a esquerda
  rationale: Preserva as duas alternativas direcionais do hebraico; em português, os possessivos podem ser omitidos sem perda na fala direta.
- source_word: וֶאֱחֹז לְךָ אֶחָד מֵהַנְּעָרִים
  choice: agarre um dos jovens
  rationale: “Agarre” expressa a ação enérgica de אחז no cenário militar, e “jovens” mantém a designação ampla de נְעָרִים sem impor a categoria específica de soldados ou servos.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: e fique com o equipamento dele
  rationale: חֲלִצָה parece indicar aquilo que se retira de um combatente vencido, provavelmente seu equipamento ou armadura. “Equipamento” evita uma precisão indevida; “fique com” transmite com naturalidade o valor benefactivo de לְךָ.
- source_word: וְלֹא אָבָה
  choice: não quis
  rationale: אבה exprime disposição ou consentimento; “não quis” é corrente, direto e não acrescenta intensidade.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: deixar de persegui-lo
  rationale: No contexto, a expressão significa desviar-se de ir atrás de Abner. “Deixar de persegui-lo” reproduz idiomaticamente a ação concreta, embora a repetição lexical de סור não seja mantida.
