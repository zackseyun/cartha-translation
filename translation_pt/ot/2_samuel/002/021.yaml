  source_fidelity: A tradução comunica corretamente a ordem de Abner e a recusa de Asael. Contudo, «deixar de persegui-lo» explicita a ideia de perseguição e não preserva tão bem a construção hebraica «desviar-se de detrás/de seguir». A revisão retém a imagem de seguir Abner e o paralelismo com a primeira ordem de desviar-se.
  naturalness: O texto é claro e moderno. «Pegue para si» reproduz de modo mais direto o imperativo «tome» e o valor benefactivo de לְךָ do que «fique com», sem perder fluência. «Desviar-se de segui-lo» é natural em registro bíblico contemporâneo.
  terminology: «Equipamento» é uma opção prudentemente ampla para חֲלִיצָתוֹ, cuja referência exata é incerta; a nota mantém «armadura» como alternativa. «Jovens» preserva a amplitude de נְעָרִים, sem definir indevidamente sua função militar.
