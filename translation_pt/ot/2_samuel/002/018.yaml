base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: pt
  text: 'Os três filhos de Zeruia estavam ali: Joabe, Abisai e Asael. Asael era ligeiro de pés, como uma das gazelas[a] do campo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um dos cervos do campo”. O termo hebraico também pode designar, de modo mais amplo, um animal selvagem semelhante ao cervo, embora “gazela” seja a opção mais precisa aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: estavam ali
  rationale: Expressa diretamente a presença deles no local, sem acrescentar um marcador temporal ausente no hebraico.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: os três filhos de Zeruia
  rationale: O artigo definido identifica naturalmente o trio conhecido no contexto.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: Joabe, Abisai e Asael
  rationale: Emprega formas portuguesas tradicionais e amplamente reconhecíveis dos nomes próprios.
- source_word: קַל בְּרַגְלָיו
  choice: ligeiro de pés
  rationale: Preserva a imagem corporal do idioma hebraico e comunica com clareza a rapidez de Asael ao correr.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: como uma das gazelas
  rationale: צְבִי designa normalmente a gazela, animal proverbialmente veloz; a alternativa mais ampla é registrada em nota.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: do campo
  rationale: Forma portuguesa natural e concisa que conserva a referência ao habitat aberto dos animais sem ampliar indevidamente o texto.
