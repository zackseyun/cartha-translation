  text: וַ/יֹּ֤אמֶר אַבְנֵר֙ אֶל יוֹאָ֔ב יָק֤וּמוּ נָא֙ הַ/נְּעָרִ֔ים וִֽ/ישַׂחֲק֖וּ לְ/פָנֵ֑י/נוּ וַ/יֹּ֥אמֶר יוֹאָ֖ב יָקֻֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: pt
  text: 'Então Abner disse a Joabe: “Por favor, que os jovens se levantem e disputem diante de nós[a]”. Joabe respondeu: “Que se levantem”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode significar “brinquem”, “divirtam-se” ou “façam uma exibição”; neste contexto, a disputa toma a forma de combate.
    reason: Preserva a amplitude semântica de שׂחק e esclarece por que o texto principal usa “disputem”.
lexical_decisions:
- source_word: הַנְּעָרִים (hannəʿārîm)
  choice: os jovens
  rationale: O termo designa jovens do sexo masculino e, neste contexto militar, pode referir-se a jovens combatentes. “Os jovens” preserva a forma do hebraico sem explicitar além do necessário.
- source_word: וִישַׂחֲקוּ (wîśaḥăqû)
  choice: disputem
  rationale: O verbo pode significar brincar, divertir-se ou participar de uma exibição ou disputa. No contexto imediato, trata-se de um confronto entre representantes dos dois lados; “disputem” comunica esse sentido sem ocultar a amplitude lexical do hebraico.
- source_word: לְפָנֵינוּ (ləp̄ānênû)
  choice: diante de nós
  rationale: Reproduz de modo natural a expressão hebraica que indica uma ação realizada na presença e à vista de Abner e Joabe.
- source_word: נָא (nāʾ)
  choice: por favor
  rationale: Expressa a partícula de solicitação presente na fala de Abner.
theological_decisions:
- issue: Natureza do encontro proposto por Abner
  choice: disputem
  alternative: brinquem; lutem
  rationale: “Brinquem” poderia soar leviano em português e obscurecer o desfecho violento, enquanto “lutem” resolveria de antemão a ambiguidade do verbo. “Disputem” preserva tanto a ideia de exibição competitiva quanto a tensão revelada pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e sem arcaísmos. A repetição “Que se levantem” acompanha deliberadamente a concisão e o paralelismo do hebraico.
