base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/011.yaml
  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: pt
  text: O tempo durante o qual Davi reinou em Hebrom sobre a casa de Judá foi de sete anos e seis meses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o número dos dias”. A expressão hebraica se refere à duração do reinado de Davi em Hebrom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: foi
  rationale: A forma narrativa de היה introduz aqui uma declaração resumida; em português, a construção com “foi” comunica isso naturalmente, sem o literalismo inadequado de “e aconteceu”.
- source_word: מִסְפַּר הַיָּמִים
  choice: O tempo
  rationale: A expressão significa literalmente “o número dos dias”, mas funciona neste contexto como indicação da duração do reinado. “O tempo” é claro e natural, enquanto a nota preserva a forma hebraica.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: durante o qual Davi reinou
  rationale: A oração relativa vincula a duração ao período em que Davi exerceu a realeza. O verbo “reinou” expressa idiomaticamente em português o sentido de “foi rei” neste contexto.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: A preposição marca o local do reinado; “em Hebrom” é a formulação portuguesa natural.
- source_word: עַל בֵּית יְהוּדָה
  choice: sobre a casa de Judá
  rationale: Mantém “casa”, presente no hebraico, e preserva o sentido coletivo da tribo ou comunidade política de Judá.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sete anos e seis meses
  rationale: Tradução direta e idiomática da duração declarada.
