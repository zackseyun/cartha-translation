  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: pt
  text: Mas Abner, filho de Ner, comandante do exército de Saul, tomou Is-Bosete[a], filho de Saul, e o levou para Maanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Is-Bosete é chamado Esbaal em 1 Crônicas 8:33 e 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Mas Abner
  rationale: A conjunção וְ pode significar “e”, mas aqui “mas” expressa naturalmente o contraste narrativo com a unção de Davi por Judá no versículo anterior.
- source_word: בֶּן נֵר
  choice: filho de Ner
  rationale: Tradução direta e natural da construção filial hebraica.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: comandante do exército de Saul
  rationale: שַׂר צָבָא designa o chefe militar; a formulação preserva com clareza a relação do exército com Saul.
- source_word: לָקַח
  choice: tomou
  rationale: Mantém o sentido básico do verbo sem acrescentar a ideia mais forte de captura ou coerção, que não é exigida neste versículo.
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: Is-Bosete
  rationale: Translitera a forma do nome presente no texto massorético de Samuel. A forma paralela Esbaal é registrada em nota.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: e o levou para
  rationale: O hifil de עבר indica fazer passar ou levar para o outro lado. Em português, “levou para” é natural e não especifica uma rota que o versículo não explicita.
- source_word: מַחֲנָיִם
  choice: Maanaim
  rationale: Transliteração convencional do topônimo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Os nomes próprios seguem formas correntes em português. A nota foi posicionada imediatamente após a identificação completa de Is-Bosete para deixar claro a quem se refere.
