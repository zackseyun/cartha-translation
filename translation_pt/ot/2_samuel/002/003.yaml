- from: Davi também levou para lá os homens que estavam com ele, cada um com sua família; e eles se estabeleceram nas cidades de Hebrom[a].
  to: Davi levou os homens que estavam com ele, cada um com sua casa; e eles se estabeleceram nas cidades de Hebrom[a].
