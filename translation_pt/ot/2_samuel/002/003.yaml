base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: pt
  text: Davi levou os homens que estavam com ele, cada um com sua casa; e eles se estabeleceram nas cidades de Hebrom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas localidades da região de Hebrom”. A expressão hebraica pode se referir aos povoados pertencentes à área de Hebrom, e não apenas ao centro urbano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: os homens que estavam com ele
  rationale: A formulação identifica os integrantes masculinos do grupo de Davi sem a redundância pouco natural de “seus homens que estavam com ele”.
- source_word: הֶעֱלָה
  choice: levou para lá
  rationale: O hifil de עלה indica fazer subir ou levar para um lugar mais alto. No contexto, “levou para lá” expressa naturalmente o deslocamento para Hebrom; a ideia de subida geográfica fica implícita no contexto.
- source_word: אִישׁ וּבֵיתוֹ
  choice: cada um com sua família
  rationale: אִישׁ tem força distributiva, e בַּיִת designa aqui a unidade familiar ou doméstica, não apenas o edifício.
- source_word: וַיֵּשְׁבוּ
  choice: eles se estabeleceram
  rationale: No contexto de mudança de residência, ישב indica fixar moradia, sentido comunicado com clareza por “se estabeleceram”.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: nas cidades de Hebrom
  rationale: עָרֵי é o plural construto de עִיר, “cidade” ou “localidade”. A tradução formal “cidades de Hebrom” preserva o plural e a relação territorial, enquanto a nota esclarece que podem estar em vista os povoados da região.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
