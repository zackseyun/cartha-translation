  text: וַ/יִּרְדֹּ֥ף עֲשָׂהאֵ֖ל אַחֲרֵ֣י אַבְנֵ֑ר וְ/לֹֽא נָטָ֣ה לָ/לֶ֗כֶת עַל הַ/יָּמִין֙ וְ/עַֽל הַ/שְּׂמֹ֔אול מֵ/אַחֲרֵ֖י אַבְנֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: pt
  text: Asael perseguiu Abner e não se desviou nem para a direita nem para a esquerda, continuando a segui-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: perseguiu
  rationale: O verbo רדף indica perseguir ou correr atrás de alguém; “perseguiu” expressa de modo natural a ação contínua neste contexto narrativo.
- source_word: אַחֲרֵי אַבְנֵר
  choice: Abner
  rationale: Com o verbo português “perseguir”, o objeto é direto, por isso não é necessário reproduzir separadamente a preposição hebraica אַחֲרֵי.
- source_word: וְלֹא נָטָה לָלֶכֶת
  choice: sem se desviar
  rationale: נטה, com o infinitivo לָלֶכֶת neste contexto, descreve o ato de sair do rumo durante o deslocamento; “sem se desviar” preserva o sentido de movimento de modo idiomático.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: Mantém a imagem e a expressão direcional hebraica em português claro e corrente.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: implícito em “perseguiu Abner sem se desviar”
  rationale: A expressão significa literalmente “de seguir atrás de Abner”; em português, sua função é comunicada sem repetição artificial pela combinação de “perseguiu Abner” e “sem se desviar”.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Asael / Abner
  rationale: Formas tradicionais e amplamente reconhecíveis dos nomes em português.
