base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: pt
  text: Levaram Asael e o sepultaram no túmulo de seu pai[a], que ficava em Belém. Depois, Joabe e seus homens caminharam a noite toda, e amanheceu para eles em Hebrom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sepultura de seu pai”. O termo hebraico קֶבֶר pode se referir tanto a uma sepultura como a um túmulo ou local funerário familiar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “a madrugada raiou para eles em Hebrom”. O hebraico diz literalmente: “tornou-se claro para eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Levaram
  rationale: Neste contexto funerário, נשׂא indica que transportaram o corpo de Asael. “Levaram” é natural em português e evita a possível sugestão de que apenas o ergueram.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: קבר é o verbo comum para enterrar ou sepultar. “Sepultaram” mantém um registro digno e natural no contexto funerário.
- source_word: בְּקֶבֶר אָבִיו
  choice: no túmulo de seu pai
  rationale: קֶבֶר pode designar uma sepultura ou um túmulo, possivelmente um local funerário familiar. “Túmulo” se ajusta bem ao contexto, sem excluir a alternativa lexical indicada em nota.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: que ficava em Belém
  rationale: A oração relativa localiza o túmulo. O verbo “ficava”, suprido naturalmente em português, expressa localização estável.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: caminharam a noite toda
  rationale: הלך significa ir, andar ou caminhar. “Caminharam” preserva a ideia concreta do deslocamento sem especificar indevidamente uma marcha formal.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Joabe e seus homens
  rationale: Tradução direta de אֲנָשָׁיו, adequada ao grupo armado de Joabe sem explicitar além do hebraico que eram soldados.
- source_word: וַיֵּאֹר לָהֶם
  choice: o dia amanheceu para eles
  rationale: A expressão hebraica significa literalmente que se tornou claro para eles. A formulação portuguesa preserva algo da estrutura idiomática e comunica com clareza a chegada do amanhecer.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: Forma tradicional portuguesa do topônimo; a preposição “em” expressa naturalmente o local em que os alcançou o amanhecer.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas de nomes amplamente reconhecidas no Brasil e em outros contextos lusófonos. A tradução segue de perto o hebraico, mas emprega sintaxe natural. As notas preservam a amplitude de קֶבֶר e o caráter idiomático de וַיֵּאֹר לָהֶם.
