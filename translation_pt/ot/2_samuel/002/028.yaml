  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: pt
  text: Então Joabe tocou a trombeta[a], e todo o povo parou. Eles não perseguiram mais Israel nem continuaram a lutar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chifre”; o termo hebraico שׁוֹפָר se refere a um chifre usado como instrumento de sinalização.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: tocou
  rationale: Com בַּשּׁוֹפָר, o verbo תקע descreve o ato de soprar ou fazer soar um instrumento de sinalização. Em português, “tocou a trombeta” é a expressão mais natural.
- source_word: בַּשּׁוֹפָר
  choice: a trombeta
  rationale: שׁוֹפָר designa um chifre usado como instrumento de sinalização. “Trombeta” é claro e tradicional em português; a nota preserva a alternativa materialmente mais literal.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: todo o povo parou
  rationale: עמד significa literalmente “ficar de pé”, mas neste contexto militar indica que o grupo interrompeu seu avanço. “Parou” comunica esse sentido com naturalidade.
- source_word: הָעָם
  choice: o povo
  rationale: O hebraico diz literalmente “o povo”. Embora o contexto se refira às forças de Joabe, a formulação mais ampla foi preservada.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: não perseguiram mais Israel
  rationale: רדף אחרי significa “perseguir”, e עוֹד sob negação expressa “não mais”. A tradução é concisa e mantém “Israel” como no hebraico.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: nem continuaram a lutar
  rationale: יסף com infinitivo pode significar acrescentar, prosseguir ou tornar a fazer algo. Sob dupla negação contextual, a frase indica que não prosseguiram no combate; “nem continuaram a lutar” preserva essa nuance.
