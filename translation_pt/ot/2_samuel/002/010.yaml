  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: pt
  text: Isbosete[a], filho de Saul, tinha quarenta anos quando começou a reinar sobre Israel, e reinou durante dois anos. Mas a casa de Judá[b] seguia Davi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome aparece aqui no Texto Massorético como Isbosete; compare a forma alternativa Esbaal em tradições relacionadas.
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “casa de Judá”, expressão coletiva que designa a tribo ou o reino de Judá.
    reason: lexical_alternative
  - marker: c
    text: Ou “era leal a Davi” ou “estava do lado de Davi”. Em hebraico, “estava após Davi” é uma expressão de lealdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: tinha quarenta anos
  rationale: A expressão hebraica é a fórmula idiomática comum para indicar a idade; a tradução natural em português comunica diretamente seu sentido.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isbosete
  rationale: O Texto Massorético traz aqui o nome tradicionalmente vertido em português como Isbosete. A forma relacionada Esbaal é registrada em nota sem substituir a leitura do texto-base.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção indica a ocasião em que ele assumiu o reinado; esta formulação reproduz com clareza a fórmula régia hebraica.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Em contexto régio, עַל expressa autoridade exercida sobre um povo; 'sobre Israel' é o equivalente português natural.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: e reinou durante dois anos
  rationale: Mantém a forma verbal e comunica de modo idiomático a duração do reinado.
- source_word: אַךְ
  choice: Mas
  rationale: A partícula introduz o contraste entre o domínio de Isbosete sobre Israel e a adesão de Judá a Davi.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a expressão coletiva hebraica e sua nuance de grupo tribal e político, permanecendo inteligível em português.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: seguia Davi
  rationale: A expressão idiomática hebraica denota adesão ou lealdade. 'Seguia Davi' preserva a imagem do original sem restringir indevidamente seu sentido político.
