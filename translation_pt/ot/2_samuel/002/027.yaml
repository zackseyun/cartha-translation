base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: pt
  text: 'Joabe disse: “Tão certo como Deus vive, se você não tivesse falado, então, desde a manhã, o povo já teria subido[a], cada um deixando de seguir seu irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, isto é, cada um teria deixado de perseguir seu irmão.
    reason: contextual_interpretation
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Tão certo como Deus vive
  rationale: Fórmula hebraica de juramento. A expressão conserva a referência à vida de Deus e soa natural e solene em português moderno.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: se você não tivesse falado
  rationale: A construção introduz uma condição contrária ao fato; o mais-que-perfeito composto expressa isso com clareza, mantendo implícito o objeto de 'falar', como no hebraico.
- source_word: כִּי אָז
  choice: já teria
  rationale: No conjunto da oração, as partículas introduzem a consequência da condição irreal. 'Já teria' produz em português uma relação temporal e contrafactual natural.
- source_word: מֵהַבֹּקֶר
  choice: desde a manhã
  rationale: A preposição מן indica o ponto inicial no tempo. 'Desde a manhã' traduz diretamente essa ideia e é idiomático em português.
- source_word: נַעֲלָה
  choice: teria se retirado
  rationale: Embora עלה tenha como sentido básico 'subir', neste contexto militar descreve o povo interrompendo a perseguição e afastando-se. 'Retirar-se' comunica essa força contextual sem acrescentar uma direção geográfica incerta.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: cada um deixando de perseguir seu irmão
  rationale: A expressão é literalmente 'cada homem de após seu irmão'; no contexto, indica que cada combatente cessaria de seguir ou perseguir o outro israelita. A formulação escolhida torna explícito esse sentido idiomático.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome ''você'' representa naturalmente a segunda pessoa singular dirigida a Abner. A tradução privilegia equivalência ótima: preserva a fórmula de juramento, mas verte as expressões militares hebraicas segundo seu sentido contextual.'
