  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: pt
  text: E agora, que Yahweh trate vocês com amor leal e fidelidade[a]. Eu também lhes farei este bem[b], porque vocês fizeram isso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh tratará vocês com amor leal e fidelidade”. O verbo hebraico pode ser entendido como um desejo de bênção ou como uma declaração sobre o futuro.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “lhes farei esta bondade”. O hebraico diz literalmente “este bem”.'
    reason: lexical_alternative
  - marker: c
    text: '“Isso” se refere ao ato mencionado no versículo anterior: o sepultamento de Saul.'
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַעַשׂ ... עִמָּכֶם
  choice: que ... trate vocês com
  rationale: Expressa com naturalidade em português a provável força de desejo ou bênção do imperfeito e preserva a ideia relacional da construção hebraica com עִם.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Comunica tanto o afeto quanto a lealdade duradoura de חֶסֶד, sem explicitar indevidamente uma formulação teológica específica.
- source_word: וֶאֱמֶת
  choice: fidelidade
  rationale: No par חֶסֶד וֶאֱמֶת, indica confiabilidade e constância relacional, mais do que a noção abstrata de verdade.
- source_word: וְגַם אָנֹכִי
  choice: Eu também
  rationale: Mantém o valor aditivo e a ênfase do pronome pessoal hebraico.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: farei este bem a vocês
  rationale: Conserva a repetição do verbo עשה e traduz literalmente הַטּוֹבָה como 'bem', distinguindo-o de חֶסֶד, enquanto a construção com 'a vocês' soa natural em português.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: porque vocês fizeram isso
  rationale: Torna explícito o valor causal da oração e usa uma forma portuguesa natural para a expressão demonstrativa hebraica.
theological_decisions:
- issue: Força do imperfeito יַעַשׂ
  choice: 'Desejo ou bênção: “que Yahweh trate...”'
  alternative: 'Declaração futura: “Yahweh tratará...”'
  rationale: O contexto favorece uma bênção pronunciada por Davi, mas a forma hebraica também admite leitura futura; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível tanto no Brasil quanto internacionalmente. “Vocês” evita formas regionais marcadas; “amor leal” preserva o teor relacional de חֶסֶד; a ordem e a repetição do hebraico são mantidas sempre que permanecem naturais.
