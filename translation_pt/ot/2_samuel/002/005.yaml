source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: pt
  text: 'Então Davi enviou mensageiros aos homens de Jabes-Gileade e lhes disse: “Que vocês sejam abençoados por Yahweh, porque demonstraram esta bondade[a] para com o senhor de vocês, Saul, e o sepultaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico hesed pode indicar bondade, lealdade ou amor fiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto narrativo, refere-se a agentes humanos enviados por Davi, não a seres celestiais.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: os homens de Jabes-Gileade
  rationale: Mantém o substantivo masculino plural explícito do hebraico e usa uma forma corrente do topônimo em português.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Vocês são abençoados por Yahweh
  rationale: Reproduz diretamente o particípio passivo hebraico como declaração, sem eliminar a possível força de fórmula de bênção, indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֶסֶד
  choice: bondade
  rationale: Neste contexto, designa o ato concreto de bondade leal demonstrado a Saul mediante seu sepultamento; a nota preserva a amplitude semântica do termo.
- source_word: אֲדֹנֵיכֶם
  choice: o senhor de vocês
  rationale: Expressa Saul como governante a quem os habitantes de Jabes-Gileade deviam lealdade, evitando a ambiguidade de 'seu senhor' em português.
- source_word: עִם שָׁאוּל
  choice: para com ... Saul
  rationale: Embora עִם signifique literalmente 'com', 'demonstrar bondade para com' é a construção natural em português e preserva a relação expressa.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: e o sepultaram
  rationale: Apresenta de modo natural a ação concluída que concretizou a bondade elogiada por Davi.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Força da expressão בְּרֻכִים אַתֶּם לַיהוָה
  choice: 'declaração: “Vocês são abençoados por Yahweh”'
  alternative: 'fórmula optativa: “Que vocês sejam abençoados por Yahweh”'
  rationale: A forma hebraica é um particípio passivo e favorece a declaração, mas a expressão também pode funcionar pragmaticamente como fórmula de bênção; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” para o plural e “senhor de vocês” para clareza referencial. Mantém o paralelismo simples e o tom solene da fala de Davi.
