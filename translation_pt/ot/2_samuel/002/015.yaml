  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: pt
  text: Então eles se levantaram e atravessaram, em número de doze por Benjamim e por Is-Bosete, filho de Saul[a][b], e doze dentre os servos de Davi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “doze de Benjamim e de Is-Bosete”. A preposição hebraica pode indicar pertencimento, representação ou procedência; aqui, provavelmente identifica o lado pelo qual eles lutavam.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “Is-Bosete”; em outros textos do Antigo Testamento aparece a forma relacionada “Esbaal”.
    reason: alternative_reading
  - marker: c
    text: Ou “homens de Davi”. Neste contexto militar, “servos” pode designar os homens que estavam a serviço dele.
    reason: lexical_alternative
