- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: por Benjamim e por Is-Bosete
  rationale: A preposição ל marca aqui o lado ou a representação dos combatentes, sem precisar transformá-la em simples origem.
- source_word: בֶּן שָׁאוּל
  choice: filho de Saul
  rationale: Mantém a identificação filial direta do texto hebraico.
- source_word: מֵעַבְדֵי דָוִד
  choice: dentre os servos de Davi
  rationale: מן indica procedência ou seleção dentre o grupo; 'servos' preserva עבדים, que neste contexto também pode designar homens a serviço militar.
