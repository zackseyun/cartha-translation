source:
  edition: WLC
  text: וְ/יוֹאָ֨ב בֶּן צְרוּיָ֜ה וְ/עַבְדֵ֤י דָוִד֙ יָֽצְא֔וּ וַֽ/יִּפְגְּשׁ֛וּ/ם עַל בְּרֵכַ֥ת גִּבְע֖וֹן יַחְדָּ֑ו וַ/יֵּ֨שְׁב֜וּ אֵ֤לֶּה עַל הַ/בְּרֵכָה֙ מִ/זֶּ֔ה וְ/אֵ֥לֶּה עַל הַ/בְּרֵכָ֖ה מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: pt
  text: Joabe, filho de Zeruia, e os servos de Davi saíram e se encontraram com eles junto ao tanque de Gibeão.[a] Sentaram-se uns de um lado do tanque, e os outros do outro lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reservatório de Gibeão”; a palavra hebraica pode designar um tanque construído ou um reservatório de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Joabe
  rationale: O nome é apresentado na forma portuguesa tradicional e amplamente reconhecida; a conjunção narrativa não precisa ser reproduzida por “E” no início, pois a continuidade é natural em português.
- source_word: בֶּן צְרוּיָה
  choice: filho de Zeruia
  rationale: Preserva diretamente a identificação familiar, em formulação natural em português.
- source_word: וְ/עַבְדֵי דָוִד
  choice: e os servos de Davi
  rationale: Mantém o vínculo lexical com עבד sem restringir o referente a “soldados”, embora o contexto seja militar.
- source_word: יָצְאוּ
  choice: saíram
  rationale: Tradução simples do verbo יצא, sem acrescentar a ideia mais específica de marchar.
- source_word: וַ/יִּפְגְּשׁוּ/ם
  choice: e se encontraram com eles
  rationale: Expressa o encontro entre os grupos e preserva o objeto pronominal, cujo referente vem do versículo anterior.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: junto ao tanque de Gibeão
  rationale: בְּרֵכָה pode designar um tanque ou reservatório construído; “junto ao” comunica com naturalidade a posição espacial.
- source_word: יַחְדָּו
  choice: se encontraram
  rationale: A reciprocidade de “se encontraram” comunica idiomaticamente que os dois grupos chegaram ao mesmo lugar; acrescentar “juntos” seria pouco natural e potencialmente ambíguo em português.
- source_word: וַ/יֵּשְׁבוּ
  choice: Sentaram-se
  rationale: Preserva o sentido comum de ישב e descreve naturalmente os grupos tomando posição.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: uns ... e os outros
  rationale: Reproduz o contraste demonstrativo entre os dois grupos em português corrente, sem acrescentar uma identificação ausente do hebraico.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: de um lado do tanque ... do outro lado
  rationale: Traduz claramente a expressão espacial idiomática que situa os grupos em lados opostos do mesmo tanque.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe evita um “E” inicial desnecessário e torna natural a disposição dos dois grupos em lados opostos.
