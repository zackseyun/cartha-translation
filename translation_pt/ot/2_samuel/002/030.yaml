base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: pt
  text: Joabe voltou da perseguição a Abner e reuniu todo o povo. Quando foram contados, faltavam dezenove homens dentre os servos de Davi, além de Asael.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dezenove homens e Asael”. A construção indica que Asael é contado além dos dezenove.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: voltou
  rationale: O qal de שוב significa normalmente “voltar”; “voltou” é natural e fiel no fluxo narrativo.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: da perseguição a Abner
  rationale: Literalmente, “de detrás de Abner”; no contexto militar, indica que Joabe retornou de perseguir Abner.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: e reuniu todo o povo
  rationale: Mantém o valor lexical de עָם (“povo”), embora neste contexto o referente seja o contingente de combatentes de Joabe.
- source_word: וַיִּפָּקְדוּ
  choice: Quando foram contados
  rationale: O nifal de פקד aqui expressa contagem ou revista; a construção temporal comunica naturalmente como se verificaram as baixas.
- source_word: מֵעַבְדֵי דָוִד
  choice: dentre os servos de Davi
  rationale: Preserva o sentido básico de עֲבָדִים, que no contexto régio-militar designa homens a serviço de Davi.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: dezenove homens
  rationale: Tradução direta do numeral acompanhado de אִישׁ, apropriada ao contexto militar.
- source_word: וַעֲשָׂה אֵל
  choice: além de Asael
  rationale: A sequência representa o nome Asael na forma apresentada pelo texto; “além de” torna explícito em português que ele se soma aos dezenove, conforme a sintaxe contextual.
theological_decisions: []
