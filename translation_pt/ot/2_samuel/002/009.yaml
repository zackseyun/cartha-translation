base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: pt
  text: e o constituiu rei sobre Gileade, sobre os assuritas[a], sobre Jezreel, sobre Efraim, sobre Benjamim e sobre todo o Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os assuritas”. Alguns entendem que o texto se refere a “Aser”, isto é, à tribo ou à região de Aser.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: e o constituiu rei
  rationale: O hifil de מלך com sufixo de terceira pessoa masculina singular significa fazer alguém rei ou instalá-lo como rei. “O constituiu rei” preserva o sentido causativo em português digno e natural.
- source_word: אֶל / עַל
  choice: sobre
  rationale: Com o verbo de instituição real e nomes de territórios ou povos, ambas as preposições indicam o domínio sobre o qual ele foi estabelecido; “sobre” expressa isso naturalmente em português.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida em português para o nome regional.
- source_word: הָאֲשׁוּרִי
  choice: os assuritas
  rationale: A forma massorética aponta para um gentílico singular com artigo, empregado coletivamente. Como a identificação é difícil, mantém-se “os assuritas” no texto e registra-se “Aser” em nota.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Forma tradicional e reconhecível em português para o topônimo.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional do nome tribal em português.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma tradicional do nome tribal em português.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: todo o Israel
  rationale: A expressão enfatiza a totalidade de Israel; “todo o Israel” é conciso, natural e preserva essa abrangência.
