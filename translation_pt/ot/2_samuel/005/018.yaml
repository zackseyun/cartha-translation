  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: pt
  text: Os filisteus vieram e se espalharam pelo vale de Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomaram posição no vale de Refaim”.'
