lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Os filisteus
  rationale: O etnônimo é traduzido pela forma portuguesa consagrada. A conjunção וּ dá continuidade à narrativa, mas pode ficar implícita em português natural neste versículo.
- source_word: בָּאוּ
  choice: vieram
  rationale: O qal perfeito de בוא indica a chegada dos filisteus e é expresso naturalmente por “vieram” no fluxo narrativo.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: se espalharam
  rationale: Neste contexto militar, o verbo נטשׁ descreve as tropas ocupando uma área de modo disseminado; “se espalharam” preserva a imagem sem tornar a tradução excessivamente técnica.
- source_word: בְּ/עֵמֶק
  choice: pelo vale de
  rationale: A preposição בְּ é locativa; com “espalharam-se”, o português idiomático favorece “pelo”, indicando distribuição dentro da extensão do vale.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Integra o topônimo “vale de Refaim” e, por isso, é transliterado segundo a forma tradicional em português, sem interpretar a identidade dos refains.
