lexical_decisions:
- source_word: יִבְחָר
  choice: Ibhar
  rationale: Nome próprio em uma lista dos filhos de Davi; transliterado segundo a forma tradicional em português, preservando o h medial.
- source_word: אֱלִישׁוּעַ
  choice: Elisua
  rationale: Nome próprio transliterado em forma natural e tradicionalmente reconhecível em português; o áyin final não é representado na ortografia comum.
- source_word: נֶפֶג
  choice: Nefegue
  rationale: Nome próprio transliterado com terminação adaptada à leitura portuguesa, evitando que o g final seja pronunciado de modo inadequado.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Nome próprio transliterado segundo a convenção portuguesa que representa o yod inicial por J neste nome; o áyin final não é marcado.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada liga os nomes. No texto corrente em português, a repetição hebraica é representada de modo idiomático por vírgulas e um único «e» antes do último nome; a forma literal é registrada em nota.
