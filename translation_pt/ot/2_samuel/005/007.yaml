source:
  edition: WLC
  text: וַ/יִּלְכֹּ֣ד דָּוִ֔ד אֵ֖ת מְצֻדַ֣ת צִיּ֑וֹן הִ֖יא עִ֥יר דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: pt
  text: Mas Davi conquistou a fortaleza de Sião[a], isto é, a Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reduto fortificado de Sião”. O termo hebraico designa um lugar forte e fortificado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: O verbo לכד indica tomar ou capturar um lugar. “Conquistou” é natural em português no contexto militar e deixa claro que Davi tomou a posição fortificada.
- source_word: וַ
  choice: Mas
  rationale: O waw faz a narrativa avançar e, neste contexto, também cria contraste com a confiança e a provocação dos jebuseus no versículo anterior. “Mas” expressa naturalmente essa relação discursiva.
- source_word: מְצֻדַת
  choice: fortaleza
  rationale: O substantivo מצודה designa um lugar forte e fortificado. “Fortaleza” é claro, corrente e adequado ao contexto militar; “reduto fortificado” seria uma alternativa possível.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: הִיא
  choice: isto é
  rationale: O pronome independente tem função explicativa ou apositiva, identificando a fortaleza de Sião com a expressão seguinte. “Isto é” comunica essa função com naturalidade.
- source_word: עִיר דָּוִד
  choice: a Cidade de Davi
  rationale: A expressão funciona como designação de lugar. A forma “Cidade de Davi” preserva a relação genitiva e é tradicional, transparente e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A tradução mantém o contraste narrativo por meio de “Mas” e conserva a identificação explicativa entre Sião e a Cidade de Davi.
