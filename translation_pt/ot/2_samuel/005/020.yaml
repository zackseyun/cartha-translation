base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: pt
  text: 'Assim, Davi foi a Baal-Perazim[a], e ali os derrotou. Davi disse: “Yahweh irrompeu contra os meus inimigos diante de mim, como o rompimento das águas.”[b] Por isso, deu àquele lugar o nome de Baal-Perazim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Perazim pode significar algo como “senhor das rupturas” ou “mestre das irrupções”. Como nome de lugar, é transliterado; ele retoma o jogo de palavras com a fala de Davi.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como a irrupção das águas” ou “como o irromper de águas”. Em hebraico, “irrompeu”, “rompimento” e “Perazim” formam um jogo de palavras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Por ser nome de lugar, foi transliterado. A forma também permite explicar em nota o jogo de palavras com פָּרַץ e פֶּרֶץ.
- source_word: וַיַּכֵּם
  choice: os derrotou
  rationale: No contexto militar, expressa com naturalidade que Davi os venceu; evita sugerir, além do que o verso explicita, que matou pessoalmente todos eles.
- source_word: פָּרַץ
  choice: irrompeu contra
  rationale: Comunica o movimento impetuoso de romper ou abrir passagem e se liga naturalmente à imagem subsequente das águas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: Equivalente direto e corrente do substantivo com sufixo de primeira pessoa.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Preserva a expressão espacial hebraica e funciona naturalmente no contexto da vitória conduzida por Deus à frente de Davi.
- source_word: כְּפֶרֶץ מָיִם
  choice: como águas que rompem uma barreira
  rationale: Torna clara em português a imagem de águas que abrem uma brecha, ao mesmo tempo que repete a ideia de romper e preserva o jogo verbal.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: deu àquele lugar o nome de
  rationale: É a forma idiomática moderna de traduzir o ato hebraico de chamar o nome de um lugar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Agência divina e humana na vitória
  choice: Davi derrota os inimigos, mas atribui a ruptura decisiva a Yahweh
  alternative: Explicitar que Yahweh derrotou os inimigos por meio de Davi
  rationale: 'A tradução conserva a tensão do texto: a narrativa diz que Davi os derrotou, enquanto a fala de Davi credita a ação decisiva a Yahweh, sem acrescentar uma harmonização explicativa.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Assim” preserva a ligação discursiva; “deu àquele lugar o nome de” evita um hebraísmo rígido. O jogo de palavras foi parcialmente reproduzido por “irrompeu/rompem” e esclarecido em notas.
