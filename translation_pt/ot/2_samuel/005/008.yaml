base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: pt
  text: 'Naquele dia, Davi disse: “Quem ferir os jebuseus e alcançar o canal de água[a], e os mancos e os cegos, que Davi detesta...”[b] Por isso se diz: “Os cegos e os mancos não entrarão na casa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conduto”, “calha” ou “túnel”. O termo hebraico provavelmente se refere a alguma parte do sistema de água, mas seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: A sintaxe hebraica desta declaração é difícil e parece incompleta. Alguns entendem “os mancos e os cegos” como parte da provocação dos jebuseus mencionada no versículo anterior, e não como objeto direto do desafio de Davi.
    reason: alternative_reading
  - marker: c
    text: Ou “no palácio”. Neste contexto, “casa” pode referir-se à residência real.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Quem ferir os jebuseus
  rationale: כָּל com o particípio מַכֵּה funciona como fórmula indefinida de desafio. יְבֻסִי, embora singular na forma, tem sentido coletivo gentílico.
- source_word: וְיִגַּע
  choice: e alcançar
  rationale: נגע pode significar “tocar” ou “alcançar”. Neste contexto militar e topográfico, “alcançar” é natural e não acrescenta ao verbo um sentido violento que ele não explicita.
- source_word: בַּצִּנּוֹר
  choice: o canal de água
  rationale: צִנּוֹר é um termo raro e incerto, provavelmente relacionado ao sistema de água da cidade. “Canal de água” é compreensível sem definir indevidamente sua estrutura exata.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: e os aleijados e os cegos
  rationale: Os adjetivos substantivados plurais são mantidos diretamente, inclusive a conjunção, apesar da sintaxe comprimida e difícil.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: a quem a alma de Davi odeia
  rationale: A formulação conserva o hebraísmo intenso com נֶפֶשׁ, “alma”, e não ameniza a afirmação difícil do texto massorético. O relativo é suprido para tornar a relação sintática legível.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Por isso se diz
  rationale: A construção introduz um dito proverbial de autoria indefinida. A forma impessoal portuguesa preserva essa indefinição de modo natural.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Os cegos e os aleijados
  rationale: As formas singulares têm valor genérico proverbial; o plural em português expressa naturalmente as classes referidas.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: não entrarão na casa
  rationale: בַּיִת pode designar uma casa ou, no contexto, uma residência real. “Casa” mantém a amplitude lexical do hebraico sem especificar “palácio”.
theological_decisions:
- issue: Atribuição do ódio de Davi aos aleijados e cegos
  choice: Manter a formulação difícil segundo a leitura massorética, sem suavizá-la nem ampliar suas implicações.
  alternative: Entender “os aleijados e os cegos” como continuação da provocação dos jebuseus no versículo anterior, ou parafrasear de modo a não atribuir esse ódio a Davi.
  rationale: A sintaxe hebraica é notoriamente difícil. A tradução conserva a tensão textual, mas não transforma este dito narrativo em uma afirmação doutrinária geral sobre pessoas com deficiência ou sobre acesso ao santuário.
- issue: Caráter incompleto do desafio de Davi
  choice: Preservar a frase interrompida por meio de reticências.
  alternative: Acrescentar uma consequência, ordem ou recompensa com base em 1 Crônicas 11:6 ou em reconstruções interpretativas.
  rationale: O texto de Samuel não apresenta explicitamente a oração principal ou a recompensa. Supri-la resolveria uma dificuldade genuína mediante material não expresso neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem incomum da fala foi conservada para não ocultar a dificuldade do hebraico; as reticências sinalizam sua aparente incompletude. “Aleijados” foi usado por corresponder de modo direto ao termo físico do texto antigo, sem intenção pejorativa moderna.
