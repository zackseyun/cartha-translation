  naturalness: A formulação atual é inteligível, mas “a quem a alma de Davi odeia” soa artificial em português moderno. “Que Davi detesta” comunica naturalmente o hebraísmo idiomático sem suavizar a força da expressão. “Mancos” é mais adequado ao registro contemporâneo amplo que “aleijados”.
  terminology: “Jebuseus”, “cegos”, “casa” e “canal de água” são apropriados. “Mancos” traduz diretamente o adjetivo substantivado hebraico e evita ampliar o termo para uma categoria moderna mais abrangente. A nota mantém a ressalva de que o versículo não deve ser convertido em afirmação geral sobre deficiência.
