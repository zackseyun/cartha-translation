base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: pt
  text: Hirão, rei de Tiro, enviou a Davi mensageiros, troncos de cedro, artesãos de madeira e artesãos de pedra para a construção de muros[a]; e eles construíram uma casa[b] para Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedreiros”. A expressão hebraica inclui literalmente tanto “pedra” quanto “muro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um palácio”. O hebraico diz literalmente “uma casa”, termo que, em um contexto régio, pode se referir a um palácio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente corrente de שׁלח na prosa narrativa; expressa de modo natural o envio tanto dos mensageiros quanto dos materiais e trabalhadores enumerados.
- source_word: חִירָם
  choice: Hirão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ צֹר
  choice: rei de Tiro
  rationale: Reproduz diretamente a cadeia construta que identifica o cargo e o reino de Hirão.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Preserva o sentido amplo do termo hebraico, que no contexto pode incluir enviados diplomáticos, sem tornar essa nuance obrigatória.
- source_word: וַעֲצֵי אֲרָזִים
  choice: troncos de cedro
  rationale: A expressão hebraica, literalmente relacionada a árvores ou madeira de cedro, designa material de construção; 'troncos de cedro' é concreto, claro e apropriado ao contexto.
- source_word: חָרָשֵׁי עֵץ
  choice: artesãos de madeira
  rationale: Mantém a amplitude de חָרָשֵׁי, evitando restringir os trabalhadores especificamente a carpinteiros.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: artesãos de pedra para muros
  rationale: A formulação conserva explicitamente os elementos hebraicos 'pedra' e 'muro', embora a expressão provavelmente designe pedreiros especializados na construção de muros.
- source_word: וַיִּבְנוּ
  choice: e eles construíram
  rationale: Reproduz a sequência narrativa e explicita naturalmente em português o sujeito plural, referente aos trabalhadores enviados.
- source_word: בַיִת
  choice: uma casa
  rationale: Mantém o sentido básico do substantivo hebraico; no contexto régio, a construção pode ser entendida como palácio, alternativa registrada em nota.
- source_word: לְדָוִד
  choice: para Davi
  rationale: Expressa de forma direta o dativo de benefício ou destinação.
