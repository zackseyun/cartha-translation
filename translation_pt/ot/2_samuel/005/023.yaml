base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: pt
  text: 'Então Davi consultou Yahweh, e ele respondeu: “Não suba. Vá pela retaguarda deles e avance contra eles em frente das árvores de bálsamo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “árvores de baca”; tradicionalmente, “amoreiras”. Não se sabe ao certo qual espécie de árvore o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: consultou Yahweh
  rationale: O verbo שׁאל com ב e o nome divino indica buscar orientação de Deus; “consultou” comunica esse sentido de modo natural e conciso.
- source_word: לֹא תַעֲלֶה
  choice: Não suba
  rationale: Preserva o sentido básico de עלה e sua força de ordem negativa no contexto de movimentação militar.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Dê a volta por trás deles
  rationale: Expressa claramente a manobra tática de contornar o inimigo e chegar à sua retaguarda.
- source_word: וּבָאתָ לָהֶם
  choice: avance contra eles
  rationale: No contexto militar, בוא com ל tem sentido adversativo; “avance contra eles” torna clara a ação ordenada sem ampliar indevidamente o texto.
- source_word: מִמּוּל
  choice: diante de
  rationale: Indica uma posição em frente ou defronte de algo; “diante de” é espacialmente claro e natural em português.
- source_word: בְּכָאִים
  choice: árvores de bálsamo
  rationale: É uma identificação lexical comum, embora a espécie exata permaneça incerta; essa incerteza é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” preserva o nome divino expresso diretamente no texto hebraico, sem substituí-lo por um título.
- issue: Sujeito de וַיֹּאמֶר
  choice: ele respondeu
  alternative: Yahweh respondeu
  rationale: Mantém a forma pronominal do hebraico, enquanto “respondeu” comunica naturalmente que a fala seguinte constitui a resposta à consulta de Davi.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação conserva o caráter direto da ordem militar e assinala a incerteza botânica sem resolvê-la no texto principal.
