  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: pt
  text: 'Estes são os nomes dos que lhe nasceram em Jerusalém: Samua[a], Sobabe, Natã e Salomão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos filhos que lhe nasceram em Jerusalém”. O particípio hebraico significa literalmente “os nascidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A conjunção com o demonstrativo introduz a lista; em português atual, a omissão do “e” inicial é natural e preserva a força apresentativa.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: Plural em estado construto que apresenta a lista seguinte; tradução direta e idiomática.
- source_word: הַיִּלֹּדִים
  choice: os que ... nasceram
  rationale: O particípio passivo significa literalmente “os nascidos”. Esta formulação mantém o valor substantivado sem especificar “filhos” além da forma hebraica.
- source_word: לוֹ
  choice: lhe
  rationale: O dativo marca a relação de descendência; “lhe nasceram” é conciso, digno e tradicionalmente inteligível em português.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Expressão locativa direta, indicando o lugar do nascimento.
- source_word: שַׁמּוּעַ
  choice: Samua
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: שׁוֹבָב
  choice: Sobabe
  rationale: Forma portuguesa bíblica estabelecida, adaptada à fonologia e ortografia do português.
- source_word: נָתָן
  choice: Natã
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
