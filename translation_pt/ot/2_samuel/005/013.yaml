base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: pt
  text: Davi tomou outras concubinas e esposas de Jerusalém, depois de vir de Hebrom[a], e ainda lhe nasceram mais filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Jerusalém”. O hebraico diz literalmente “de Jerusalém”, expressão que pode indicar o lugar de onde Davi tomou essas mulheres depois de se mudar para lá.'
    reason: Preserva no texto principal a preposição hebraica e registra a leitura localizadora contextual como alternativa, sem eliminar a ambiguidade.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém a forma direta do hebraico e, neste contexto, expressa que Davi tomou essas mulheres como concubinas e esposas, sem acrescentar avaliação moral.
- source_word: עוֹד
  choice: outras / ainda mais
  rationale: 'Nas duas ocorrências, o advérbio indica acréscimo: outras concubinas e esposas, e mais filhos e filhas.'
- source_word: פִּלַגְשִׁים וְנָשִׁים
  choice: concubinas e esposas
  rationale: Preserva a distinção explícita entre as duas categorias; neste contexto doméstico e régio, נָשִׁים tem o sentido de esposas.
- source_word: מִירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Embora a preposição hebraica normalmente signifique “de”, aqui a construção provavelmente localiza onde Davi tomou as mulheres após sua mudança. A forma literal é preservada em nota devido à ambiguidade real.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: depois de vir de Hebrom
  rationale: Expressa com clareza a sequência temporal e conserva Hebrom como o lugar de onde Davi veio.
- source_word: וַיִּוָּלְדוּ עוֹד לְדָוִד
  choice: nasceram-lhe ainda mais
  rationale: Reproduz o passivo “nasceram” e a relação indicada por לְדָוִד de modo natural e conciso em português.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a referência explícita aos dois sexos em vez de generalizá-la como “filhos” ou “crianças”.
theological_decisions:
- issue: Descrição narrativa da poligamia de Davi
  choice: Relatar a ação sem qualificação moral explícita.
  alternative: Acrescentar palavras que indiquem aprovação ou reprovação.
  rationale: O versículo descreve a ação de Davi e os nascimentos resultantes, mas não apresenta aqui um juízo moral explícito; a tradução não deve importar um.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nasceram-lhe” conserva a construção relacional do hebraico sem soar excessivamente arcaica; a ordem da primeira oração foi ajustada para evitar a sequência pouco natural “em Jerusalém depois de vir de Hebrom”.
