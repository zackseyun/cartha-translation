base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: pt
  text: 'Davi consultou Yahweh, perguntando: “Devo subir contra os filisteus? Tu os entregarás em minha mão[a]?” Yahweh disse a Davi: “Sobe, pois certamente entregarei os filisteus em tua mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu os entregarás em meu poder?” A expressão hebraica “entregar na mão de alguém” frequentemente se refere a conceder vitória sobre um inimigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: consultou
  rationale: Neste contexto, שׁאל descreve a busca de orientação divina; “consultou” comunica isso naturalmente sem especificar um procedimento ritual.
- source_word: בַּיהוָה / יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה e o distingue de títulos como “Senhor”.
- source_word: לֵאמֹר
  choice: perguntando
  rationale: Introduz naturalmente, em português, o conteúdo interrogativo da consulta de Davi, sem necessidade de reproduzir mecanicamente “dizendo”.
- source_word: הַאֶעֱלֶה
  choice: Devo subir
  rationale: Preserva o sentido básico de עלה e expressa a força deliberativa da pergunta.
- source_word: אֶל פְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Em contexto militar, אֶל indica movimento hostil em direção ao inimigo; “contra” torna esse sentido claro.
- source_word: הֲתִתְּנֵם ... בְּיָדִי
  choice: Tu os entregarás em minhas mãos?
  rationale: Reproduz a metáfora hebraica de colocar o inimigo sob o poder de alguém, numa formulação compreensível em português.
- source_word: עֲלֵה
  choice: Suba
  rationale: Mantém a repetição lexical de עלה entre a pergunta de Davi e a resposta divina.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: pois certamente entregarei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” expressa essa ênfase.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Mantém a mesma imagem idiomática da pergunta e preserva o paralelismo do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio do Deus de Israel; “Yahweh” preserva sua função como nome, em vez de substituí-lo por um título.
- issue: Modo da consulta divina
  choice: Não especificado
  alternative: Consulta por meio sacerdotal ou oracular
  rationale: O versículo afirma que Davi consultou Yahweh, mas não identifica o meio empregado; a tradução evita acrescentar um procedimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “tu” na pergunta dirigida diretamente a Deus e “suas” na fala dirigida a Davi, evitando a ambiguidade regional de “tu ... suas” dentro da mesma oração. Conserva a imagem militar “em minhas/suas mãos” e a repetição “subir/Suba”.
