base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: pt
  text: 'Já antes, quando Saul era rei sobre nós, era você quem conduzia Israel em suas saídas e entradas.[a] E Yahweh lhe disse: “Você pastoreará o meu povo, Israel, e será governante[b] sobre Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tanto ontem como anteontem”. A expressão hebraica “conduzir Israel em suas saídas e entradas” descreve a liderança do povo em seus assuntos, especialmente em tempos de guerra.
    reason: lexical_alternative
  - marker: b
    text: Ou “líder”. O termo hebraico não é a palavra usual para “rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Já anteriormente
  rationale: A expressão significa literalmente “tanto ontem como anteontem”, mas funciona como um idiomatismo temporal que aponta para o período anterior. “Já anteriormente” comunica que Davi exercia essa função antes da ocasião presente.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: quando Saul era rei sobre nós
  rationale: A construção com infinitivo estabelece uma oração temporal; esta formulação é direta, natural e conserva a ideia de Saul reinar sobre os interlocutores.
- source_word: אַתָּה
  choice: era você quem
  rationale: O pronome independente é enfático. A construção portuguesa destaca Davi como a pessoa que de fato conduzia Israel.
- source_word: מוֹצִיא וְהַמֵּבִיא אֶת־יִשְׂרָאֵל
  choice: fazia Israel sair e entrar
  rationale: Preserva as imagens complementares do hebraico e sua função idiomática de descrever a condução do povo, especialmente em campanhas militares e nos assuntos públicos.
- source_word: וַיֹּאמֶר יְהוָה לְךָ
  choice: E Yahweh lhe disse
  rationale: Reproduz a sequência narrativa, o destinatário e o nome divino expresso no texto hebraico.
- source_word: תִרְעֶה
  choice: Você pastoreará
  rationale: Mantém a metáfora régia e pastoral do verbo רעה, em vez de reduzi-la ao sentido genérico de governar.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: Conserva de modo simples a linguagem de pertencimento e a aposição identificadora do hebraico.
- source_word: נָגִיד
  choice: governante
  rationale: Expressa liderança e autoridade sem confundir o termo com מֶלֶךְ, a palavra hebraica usual para “rei”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. “Yahweh” o representa como nome próprio e evita substituí-lo por um título.
- issue: Metáfora régia em תִרְעֶה
  choice: Você pastoreará o meu povo Israel
  alternative: Você governará o meu povo Israel; você cuidará do meu povo Israel
  rationale: A tradução conserva a figura do rei como pastor do povo de Deus e não elimina sua força teológica.
- issue: Distinção entre נָגִיד e מֶלֶךְ
  choice: governante
  alternative: líder; príncipe; rei
  rationale: “Governante” comunica autoridade sem identificar נָגִיד com a palavra comum para “rei”, usada na mesma frase a respeito de Saul.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva os paralelos e as metáforas do hebraico, recorrendo a notas apenas onde o idiomatismo ou a distinção lexical poderiam não ser transparentes.
