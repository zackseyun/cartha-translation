revisions:
- from: Assim, todos os anciãos de Israel foram até o rei, em Hebrom. Ali, o rei Davi fez uma aliança[a] com eles diante de Yahweh[b], e eles ungiram Davi rei sobre Israel.
  to: Assim, todos os anciãos de Israel vieram ao rei em Hebrom, e o rei Davi fez uma aliança[a] com eles em Hebrom, diante de Yahweh[b]; e eles ungiram Davi como rei sobre Israel.
  rationale: A revisão restaura a segunda referência explícita a Hebrom, presente no texto hebraico, e emprega “vieram ao rei em Hebrom” para uma correspondência narrativa mais direta. Mantêm-se as escolhas terminológicas adequadas e as notas, incluindo a explicação do idiomatismo hebraico e a alternativa para “diante de Yahweh”.
