base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: pt
  text: Assim, todos os anciãos de Israel vieram ao rei em Hebrom, e o rei Davi fez uma aliança[a] com eles em Hebrom, diante de Yahweh[b]; e eles ungiram Davi como rei sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “cortou uma aliança”, expressão idiomática que significa “fez uma aliança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na presença de Yahweh”. O nome divino também é tradicionalmente traduzido por “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram até
  rationale: O verbo בוא descreve a chegada ao destino; em português, “foram até” expressa naturalmente o deslocamento dos anciãos até o rei em Hebrom.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: todos os anciãos de Israel
  rationale: Preserva tanto a abrangência de כָּל quanto o sentido coletivo de זִקְנֵי como líderes de Israel.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: até o rei, em Hebrom
  rationale: A terminação direcional de חֶבְרוֹנָה indica movimento rumo a Hebrom; a formulação deixa claro que o rei se encontrava ali.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: fez uma aliança
  rationale: A expressão hebraica significa literalmente “cortou uma aliança”, mas “fez uma aliança” comunica de modo natural e fiel o idioma pactuai.
- source_word: לָהֶם
  choice: com eles
  rationale: No contexto da expressão כרת ברית, a preposição indica as partes envolvidas na aliança.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém o caráter solene do ato realizado perante Deus e representa explicitamente o nome divino יהוה.
- source_word: וַיִּמְשְׁחוּ
  choice: ungiram
  rationale: Em contexto régio, משׁח designa o ato ritual e político de ungir alguém como rei.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: Expressa de forma concisa a investidura de Davi e sua autoridade régia sobre Israel.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: É a forma titular natural em português para a construção apositiva hebraica.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: “Yahweh” representa o nome próprio no texto hebraico sem substituí-lo silenciosamente por um título; a forma tradicional é registrada em nota.
- issue: Força de בְּרִית no contexto régio
  choice: aliança
  alternative: acordo ou tratado
  rationale: “Aliança” preserva o peso solene, político e teológico do compromisso firmado diante de Yahweh, enquanto “acordo” seria fraco e “tratado” estreitaria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ali” evita a repetição pesada de “em Hebrom” sem perder a localização explícita do segundo ato. A sequência narrativa e a solenidade régia foram preservadas.
