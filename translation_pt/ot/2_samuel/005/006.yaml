  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ וַֽ/אֲנָשָׁי/ו֙ יְר֣וּשָׁלִַ֔ם אֶל הַ/יְבֻסִ֖י יוֹשֵׁ֣ב הָ/אָ֑רֶץ וַ/יֹּ֨אמֶר לְ/דָוִ֤ד לֵ/אמֹר֙ לֹא תָב֣וֹא הֵ֔נָּה כִּ֣י אִם הֱסִֽירְ/ךָ֗ הַ/עִוְרִ֤ים וְ/הַ/פִּסְחִים֙ לֵ/אמֹ֔ר לֹֽא יָב֥וֹא דָוִ֖ד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: pt
  text: 'O rei e seus homens foram a Jerusalém, contra os jebuseus que habitavam a terra. Os jebuseus disseram[a] a Davi: “Você não entrará aqui, pois até os cegos e os coxos o repelirão”[b]. Com isso, queriam dizer: “Davi não entrará aqui”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “disse a Davi”. O singular provavelmente representa coletivamente os habitantes jebuseus.'
    reason: lexical_alternative
  - marker: b
    text: 'A formulação hebraica, literalmente “a menos que você remova os cegos e os coxos”, é difícil. A frase parece ser uma provocação: os jebuseus consideravam a cidade tão segura que até “os cegos e os coxos” poderiam impedir a entrada de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foram
  rationale: O verbo הלך, na sequência narrativa, indica simplesmente o avanço da ação. “Foram” é natural em português e não acrescenta uma nuance militar que o verbo, por si só, não exige.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: o rei e seus homens
  rationale: Mantém a expressão hebraica sem restringir אֲנָשָׁיו a soldados, embora o contexto seja militar.
- source_word: אֶל הַיְבֻסִי
  choice: contra os jebuseus
  rationale: O singular gentílico hebraico tem sentido coletivo. Embora אֶל signifique basicamente “a/para”, o contexto de ataque permite “contra”, que evita uma construção pouco natural em português e torna clara a relação hostil sem especificar o verbo como “atacar”.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: que habitavam aquela terra
  rationale: O particípio singular concorda com o gentílico coletivo. O plural em português comunica naturalmente o sentido coletivo; “aquela terra” aponta para o território mencionado no contexto imediato.
- source_word: וַיֹּאמֶר
  choice: disseram
  rationale: A forma hebraica é singular, “disse”, mas seu sujeito coletivo é “o jebuseu”, isto é, os jebuseus. O plural deixa explícito o sentido contextual, enquanto a nota registra a forma hebraica.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Você não entrará aqui
  rationale: O imperfeito expressa uma afirmação desafiadora acerca da impossibilidade de Davi penetrar na fortaleza. “Entrará” se ajusta ao contexto urbano fortificado.
- source_word: הַעִוְרִים וְהַפִּסְחִים
  choice: os cegos e os coxos
  rationale: Tradução direta dos substantivos adjetivais, preservando os termos concretos empregados na zombaria jebuseia sem transformá-los em metáfora.
- source_word: הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: até os cegos e os coxos o repelirão
  rationale: 'A sintaxe hebraica é difícil e, tomada rigidamente, fala em Davi “remover” os cegos e os coxos. No contexto, a frase é uma provocação: a cidade seria tão segura que até essas pessoas poderiam impedir sua entrada. A nota preserva a formulação mais literal e sua dificuldade.'
- source_word: לֵאמֹר ... לֹא יָבוֹא דָוִד הֵנָּה
  choice: 'Com isso, queriam dizer: “Davi não entrará aqui”'
  rationale: O segundo לֵאמֹר introduz a explicação ou reformulação da provocação. A redação portuguesa preserva a repetição retórica e deixa clara sua função.
theological_decisions:
- issue: Referência potencialmente ofensiva a pessoas com deficiência na provocação
  choice: Manter “os cegos e os coxos” como conteúdo concreto da fala hostil relatada
  alternative: Parafrasear como “até os mais fracos entre nós”
  rationale: O texto relata a zombaria dos jebuseus; não afirma que a deficiência torne alguém inferior. A substituição por uma metáfora apagaria a linguagem efetiva do hebraico e resolveria indevidamente a tensão do relato.
- issue: Sentido da cláusula hebraica difícil sobre remover os cegos e os coxos
  choice: 'Expressar no texto principal o sentido contextual da provocação: eles repeliriam Davi'
  alternative: 'Traduzir literalmente: “a menos que você remova os cegos e os coxos”'
  rationale: A tradução contextual comunica a força provável da provocação, mas a nota conserva a formulação literal e reconhece a dificuldade, evitando apresentar a interpretação como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, sem coloquialismo excessivo. Mantém a repetição enfática do original e explica em nota tanto o singular coletivo quanto a cláusula hebraica difícil.
