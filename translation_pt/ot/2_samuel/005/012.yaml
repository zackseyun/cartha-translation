  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: pt
  text: E Davi soube que Yahweh o havia estabelecido como rei sobre Israel e que havia exaltado o reino dele em favor de seu povo, Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em favor do povo de Davi, Israel”, caso o pronome “seu” seja entendido como referência a Davi, e não a Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: soube
  rationale: Traduz diretamente ידע no fluxo narrativo; “percebeu” seria possível, mas acrescentaria uma nuance interpretativa.
- source_word: הֱכִינוֹ
  choice: o havia estabelecido
  rationale: O hifil de כון expressa tornar firme, estabelecer ou confirmar; no contexto régio, indica a consolidação divina de Davi como rei.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמֶלֶךְ
  choice: como rei
  rationale: A preposição לְ marca aqui função ou cargo; “como rei” é natural e preciso em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: No contexto de realeza, עַל indica o âmbito sobre o qual se exerce governo.
- source_word: נִשֵּׂא
  choice: havia exaltado
  rationale: A forma de נשׂא comunica elevação; “exaltado” preserva o caráter régio da afirmação.
- source_word: מַמְלַכְתּוֹ
  choice: o reino dele
  rationale: ממלכה pode significar reino, reinado ou domínio real. “O reino dele” é amplo e mantém o referente pronominal sem confundi-lo com o sujeito divino.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: A expressão indica aqui motivo com orientação ao benefício de Israel; em português corrente, “por causa de” transmite esse sentido sem excessiva paráfrase.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: seu povo Israel
  rationale: Mantém a sequência hebraica e a leitura mais provável de que Israel é o povo de Yahweh, preservando em nota a possível referência a Davi.
theological_decisions:
- issue: Antecedente do sufixo em עַמּוֹ (“seu povo”)
  choice: 'O pronome é entendido como referência a Yahweh: “seu povo Israel”.'
  alternative: 'O pronome pode referir-se a Davi: “o povo de Davi, Israel”.'
  rationale: Yahweh é o agente que estabelece Davi e exalta seu reino, e “seu povo Israel” é uma designação bíblica comum para o povo de Yahweh. Como a forma hebraica também permite tomar Davi como antecedente, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. Emprega “Yahweh” para o nome divino e “o reino dele” para evitar a ambiguidade estilística de dois possessivos próximos, sem eliminar a ambiguidade real de עַמּוֹ, explicitada em nota.
