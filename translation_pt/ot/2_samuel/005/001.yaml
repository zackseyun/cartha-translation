  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: pt
  text: 'Então todas as tribos de Israel vieram até Davi, em Hebrom[a], e disseram: “Veja: somos seu osso e sua carne[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Hebrom”. No hebraico, o nome “Hebrom” tem uma terminação que indica direção.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu osso e sua carne”, expressão de parentesco que indica laços de sangue ou identidade familiar compartilhada.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então ... vieram
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa a sequência com naturalidade, e “vieram” traduz o sentido comum de בוא.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: todas as tribos de Israel
  rationale: Preserva o sentido coletivo e nacional da expressão hebraica.
- source_word: אֶל דָּוִד
  choice: até Davi
  rationale: אֶל indica movimento em direção a uma pessoa ou lugar; “até Davi” comunica claramente esse movimento.
- source_word: חֶבְרֹנָה
  choice: em Hebrom
  rationale: A terminação direcional do topônimo pode indicar “para Hebrom”, mas, como o movimento até Davi já foi expresso, “em Hebrom” identifica com naturalidade o local em que Davi se encontrava.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: e disseram
  rationale: A fórmula hebraica de introdução à fala é traduzida de modo idiomático, sem reproduzir redundantemente “disseram, dizendo”.
- source_word: הִנּוּ
  choice: Veja
  rationale: A partícula chama enfaticamente a atenção para a declaração seguinte. “Veja” conserva essa função em linguagem moderna.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: seus ossos e sua carne
  rationale: Mantém a metáfora hebraica de parentesco e a ordem dos termos. O plural “ossos” é mais idiomático em português, embora o hebraico empregue literalmente o singular “osso”.
- source_word: אֲנָחְנוּ
  choice: somos
  rationale: 'O português requer a forma verbal para representar naturalmente a oração nominal hebraica: “somos seus ossos e sua carne”.'
theological_decisions:
- issue: Fórmula de parentesco e sua força político-teológica
  choice: Conservar a imagem como “somos seus ossos e sua carne”.
  alternative: “somos seu próprio povo” ou “somos seus parentes”
  rationale: As tribos apelam ao parentesco e à identidade compartilhada com Davi como fundamento de solidariedade nacional e de seu reinado. A metáfora preserva essa força sem reduzir a declaração a uma simples aliança política.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega-se “seus/sua” para tratamento direto natural, preservando a referência singular a Davi. A metáfora de parentesco é mantida, com explicação em nota.
