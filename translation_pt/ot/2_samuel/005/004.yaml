  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: pt
  text: Davi tinha trinta anos quando começou a reinar[a] e reinou durante quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando se tornou rei».'
