lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: tinha trinta anos
  rationale: A expressão hebraica, literalmente «filho de trinta anos», é uma forma idiomática de indicar idade; em português natural, «tinha trinta anos» comunica exatamente o sentido.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A preposição בְּ com o infinitivo construto de מלך e o sufixo de terceira pessoa masculina singular tem valor temporal no contexto da fórmula régia e indica o início do reinado.
- source_word: מָלָךְ
  choice: reinou
  rationale: O verbo מלך expressa o exercício da realeza; «reinou» é a correspondência portuguesa direta e corrente.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: O numeral com «anos» indica a duração do reinado; «durante» torna essa relação clara e natural em português.
- source_word: דָּוִד
  choice: Davi
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
