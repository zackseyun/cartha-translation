base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: pt
  text: Davi fez assim, exatamente como Yahweh lhe havia ordenado, e derrotou os filisteus desde Geba[a] até Gezer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “Geba”. Algumas traduções trazem outro nome de lugar por razões textuais ou por comparação com a passagem paralela.
    reason: textual_variant
  - marker: b
    text: Literalmente, “até a sua chegada a Gezer”; a expressão pode indicar a chegada à cidade ou às suas proximidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: fez assim
  rationale: A expressão retoma de forma concisa as instruções dadas anteriormente a Davi e reproduz com naturalidade o idioma hebraico.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: exatamente como ... lhe havia ordenado
  rationale: “Exatamente como” ressalta a correspondência entre a ordem e a ação de Davi; “havia ordenado” deixa clara a anterioridade da ordem no fluxo narrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיַּךְ
  choice: derrotou
  rationale: No contexto militar, נכה pode indicar infligir uma derrota. “Derrotou” comunica naturalmente o resultado sem recorrer a uma formulação arcaica.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica consagrada e clara em português.
- source_word: מִגֶּבַע
  choice: desde Geba
  rationale: Segue diretamente o Texto Massorético, que traz Geba, apesar das diferenças encontradas em algumas traduções e na passagem paralela.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: até a entrada de Gezer
  rationale: A expressão indica o limite do avanço militar, chegando à entrada ou às proximidades de Gezer, ao mesmo tempo que conserva a imagem espacial do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Mantém o nome pessoal presente no texto hebraico e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a concisão narrativa e mantém os topônimos do texto hebraico.
