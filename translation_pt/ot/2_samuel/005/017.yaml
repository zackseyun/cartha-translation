  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: pt
  text: Quando os filisteus souberam que Davi havia sido ungido rei sobre Israel, todos os filisteus subiram para procurar Davi. Ao saber disso, Davi desceu para a fortaleza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o reduto fortificado”. O termo hebraico designa um lugar fortificado usado como defesa ou refúgio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse povo.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que os filisteus souberam.
- source_word: מָשְׁחוּ אֶת דָּוִד
  choice: Davi havia sido ungido
  rationale: A voz passiva evita que o sujeito indeterminado da forma hebraica seja confundido, em português, com os filisteus; o mais-que-perfeito situa a unção antes da reação deles.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: Preserva tanto a nomeação régia quanto a ideia de autoridade sobre Israel.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Mantém o sentido geográfico básico de עלה sem acrescentar a ideia não expressa de uma marcha militar.
- source_word: כָל פְּלִשְׁתִּים
  choice: todos os filisteus
  rationale: Conserva a abrangência enfática de כָל.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: para procurar Davi
  rationale: Expressa o sentido amplo de בקש e deixa que o contexto indique a intenção hostil, sem especificar capturar ou matar.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Ao saber disso, Davi
  rationale: Formulação natural em português que explicita apenas o referente contextual implícito do verbo 'ouvir'.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Reproduz diretamente o movimento descendente indicado por ירד.
- source_word: הַמְּצוּדָה
  choice: a fortaleza
  rationale: O substantivo designa um local defensivo fortificado; 'fortaleza' é claro, digno e corrente em português.
