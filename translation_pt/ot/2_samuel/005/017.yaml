translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “filisteus” foi preservada para refletir a ênfase do hebraico. O marcador da nota foi colocado junto a “fortaleza”, termo ao qual a nota lexical se refere.
