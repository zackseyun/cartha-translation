    reason: lexical_alternative
  revision_rationale: 'A revisão é estilística e de precisão idiomática: substitui uma construção menos natural por «passos em marcha» e emprega «copas» para os topos das árvores. A inclusão de «já» explicita a relação de anterioridade que o futuro perfeito português já sugere no contexto, em consonância com o perfeito hebraico e com a ação de Yahweh que precede a de Davi.'
