source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: pt
  text: Quando você ouvir o som de passos em marcha nas copas das árvores de bálsamo[a], então aja com decisão, pois nesse momento Yahweh já terá saído à sua frente para atacar o acampamento dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “árvores de baca”; não se sabe ao certo qual espécie de árvore é indicada pelo termo hebraico. Traduções antigas também trazem “amoreiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Quando você ouvir
  rationale: A construção com היה e o infinitivo regido por ב introduz a circunstância temporal futura; esta formulação é natural e fiel em português.
- source_word: קוֹל צְעָדָה
  choice: o som de passos marchando
  rationale: Preserva tanto a ideia concreta de passos quanto o sentido militar de marcha sugerido pelo contexto.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: no alto das árvores de bálsamo
  rationale: רָאשֵׁי indica a parte superior ou copa; a identificação botânica de בְּכָאִים é incerta, por isso a alternativa é registrada em nota.
- source_word: אָז תֶּחֱרָץ
  choice: então aja com decisão
  rationale: חרץ, neste contexto, pede ação resoluta e vigorosa, não apenas rapidez.
- source_word: כִּי אָז
  choice: pois nesse momento
  rationale: כִּי apresenta a razão para a ordem, enquanto אָז aponta para o momento indicado pelo sinal.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: Yahweh terá saído à sua frente
  rationale: O futuro composto expressa que, ao ser percebido o sinal, a ação divina já terá começado; 'à sua frente' comunica que Yahweh precede Davi na batalha.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: para atacar o acampamento dos filisteus
  rationale: נכה com ב pode indicar desferir um ataque contra um alvo; 'atacar' é claro e natural, enquanto מַחֲנֶה é mantido como 'acampamento'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal da aliança; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Aspecto temporal de יָצָא
  choice: terá saído
  alternative: saiu; sairá
  rationale: No quadro temporal futuro introduzido pela ordem, o perfeito pode indicar que a saída de Yahweh já estará em curso quando Davi ouvir o sinal. A formulação evita sugerir que Deus só agirá depois de Davi.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A expressão 'você' segue o discurso direto no singular e favorece ampla legibilidade; a nota conserva a incerteza botânica.
