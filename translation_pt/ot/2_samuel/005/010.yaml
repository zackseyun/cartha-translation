  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: pt
  text: E Davi se tornava cada vez maior[a], e Yahweh, o Deus dos Exércitos, estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Davi continuava a crescer em grandeza”. A construção hebraica enfatiza um aumento contínuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: se tornava cada vez mais poderoso
  rationale: A combinação de uma forma finita de הלך com o infinitivo absoluto הָלוֹךְ e וְגָדוֹל expressa progressão contínua. A formulação comunica de modo natural que o poder e a grandeza de Davi aumentavam constantemente.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma consagrada do nome pessoal em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Preserva o título divino e a amplitude de צְבָאוֹת, que pode designar hostes ou exércitos, sem acrescentar que sejam exclusivamente terrenos ou celestiais.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: Reproduz diretamente a afirmação da presença divina junto de Davi e mantém o pronome hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: Exércitos
  alternative: hostes; exércitos celestiais
  rationale: “Exércitos” é compreensível no português atual e conserva o sentido abrangente do termo, sem restringir sua referência ao âmbito celestial.
- issue: Relação entre a ascensão de Davi e a presença de Yahweh
  choice: duas afirmações coordenadas por “e”
  alternative: relação causal explícita com “porque” ou “pois”
  rationale: Embora o contexto permita inferir que a presença divina explica a ascensão de Davi, o hebraico apenas coordena as afirmações; a tradução não explicita uma causalidade que o versículo deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Cada vez mais poderoso” transmite naturalmente a progressão enfática do hebraico; a coordenação com “e” preserva a relação sintática sem transformar a segunda oração em explicação causal explícita.
