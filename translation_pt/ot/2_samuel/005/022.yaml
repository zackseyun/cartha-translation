  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: pt
  text: Os filisteus tornaram a subir e se espalharam[a] pelo vale de Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomaram posição” ou, possivelmente, “fizeram uma incursão”. O verbo hebraico provavelmente descreve os filisteus ocupando posições pelo vale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: tornaram a subir
  rationale: A construção com יסף, עוֹד e o infinitivo expressa a repetição da ação anterior. “Tornaram a subir” preserva o sentido de movimento ascendente ou avanço sem a rigidez de uma tradução palavra por palavra.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica tradicional e imediatamente compreensível em português.
- source_word: וַיִּנָּטְשׁוּ
  choice: se espalharam
  rationale: No contexto militar, o verbo provavelmente descreve as tropas ocupando uma área ampla ou tomando posição pelo vale. A expressão mantém a imagem espacial e deixa a possível nuance militar para a nota.
- source_word: בְּעֵמֶק רְפָאִים
  choice: pelo vale de Refaim
  rationale: A preposição ב pode indicar localização ou extensão dentro da área. “Pelo vale” combina naturalmente com “se espalharam” e comunica que as tropas ocuparam o vale. O nome próprio é transliterado segundo a forma portuguesa tradicional.
