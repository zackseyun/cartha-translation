  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: pt
  text: Assim, Davi morou na fortaleza e deu-lhe o nome de Cidade de Davi. Davi construiu ao redor, a partir do Milo e para dentro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «a partir do Milo para dentro» ou «a partir do Milo em direção ao interior». O Milo pode referir-se a uma estrutura conhecida ou a um aterro em terraços de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: passou a morar
  rationale: ישׁב indica que Davi fixou residência na fortaleza; «passou a morar» é natural em português e expressa adequadamente o início dessa situação no fluxo narrativo.
- source_word: בַּמְּצֻדָה
  choice: na fortaleza
  rationale: מְצֻדָה designa um lugar fortificado. «Fortaleza» é claro, corrente e preserva o sentido militar e defensivo.
- source_word: וַיִּקְרָא לָהּ
  choice: lhe deu o nome de
  rationale: קרא com ל־ expressa nomeação. Esta formulação é idiomática em português e deixa claro que Davi nomeou o lugar.
- source_word: עִיר דָּוִד
  choice: Cidade de Davi
  rationale: Trata-se da designação própria do local, tradicional e imediatamente reconhecível em português.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: בנה significa basicamente «construir». Evita acrescentar as ideias não explícitas de reconstrução ou fortificação.
- source_word: סָבִיב
  choice: ao redor
  rationale: סָבִיב indica extensão circundante; «ao redor» preserva o sentido sem especificar uma configuração urbana incerta.
- source_word: מִן הַמִּלּוֹא
  choice: desde o Milo
  rationale: מִלּוֹא parece ser um termo topográfico ou técnico cujo referente exato é incerto. A transliteração «Milo» evita uma identificação conjectural.
- source_word: וָבָיְתָה
  choice: para o interior
  rationale: A forma direcional provavelmente indica movimento ou extensão rumo à parte interna. A tradução mantém esse sentido espacial sem identificar בית com um edifício específico.
