base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: pt
  text: Em Hebrom, ele reinou sobre Judá durante sete anos e seis meses; em Jerusalém, reinou durante trinta e três anos sobre todo o Israel e Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: Em Hebrom
  rationale: A preposição בְּ indica localização; “em Hebrom” é a forma natural em português.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo no contexto resume a duração do governo de Davi, e não apenas o momento de sua ascensão ao trono.
- source_word: עַל יְהוּדָה
  choice: sobre Judá
  rationale: עַל com מָלַךְ indica o povo ou território sobre o qual alguém governa.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: durante sete anos e seis meses
  rationale: A expressão comunica diretamente a duração; “durante” torna essa relação clara e natural em português.
- source_word: וּבִירוּשָׁלַם
  choice: em Jerusalém
  rationale: A conjunção e a preposição introduzem o segundo local do reinado; o ponto e vírgula em português já expressa adequadamente a coordenação.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: durante trinta e três anos
  rationale: A cardinalidade hebraica é vertida segundo o uso contemporâneo do português, com “durante” explicitando a duração.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: sobre todo o Israel e Judá
  rationale: A tradução conserva os dois nomes e a abrangência expressa por כָּל, sem apagar a distinção política presente no hebraico.
