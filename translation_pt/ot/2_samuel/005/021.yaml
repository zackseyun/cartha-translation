  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּשָּׂאֵ֥/ם דָּוִ֖ד וַ/אֲנָשָֽׁי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: pt
  text: E eles deixaram ali os seus ídolos[b], e Davi e os seus homens os levaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Crônicas 14:12 acrescenta que Davi deu ordem para que os ídolos fossem queimados. Aqui, o hebraico de Samuel diz apenas que Davi e os seus homens os levaram.
    reason: cross_reference
  - marker: b
    text: 'Ou: “as suas imagens”. O termo hebraico se refere a imagens de culto; “ídolos” explicita esse sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: deixaram
  rationale: O verbo עזב pode significar deixar ou abandonar. Neste contexto de retirada militar, “deixaram” expressa naturalmente que os filisteus deixaram os objetos para trás.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio locativo שׁם remete ao lugar mencionado no contexto; “ali” é natural na narrativa em português.
- source_word: עֲצַבֵּיהֶם
  choice: os seus ídolos
  rationale: O substantivo designa imagens de culto. “Ídolos” explicita sua função religiosa, enquanto a alternativa “imagens” é preservada em nota.
- source_word: וַיִּשָּׂאֵם
  choice: os levaram
  rationale: נשא pode significar erguer, carregar ou levar. “Os levaram” comunica a remoção física sem especificar indevidamente sua finalidade.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: Davi e os seus homens
  rationale: Tradução direta da expressão hebraica, que neste contexto se refere aos homens que acompanhavam Davi, sem restringi-los explicitamente a soldados.
theological_decisions:
- issue: Relação com o relato paralelo de 1 Crônicas 14:12, que afirma que os ídolos foram queimados
  choice: Traduzir o texto massorético de 2 Samuel como “os levaram”, sem harmonizá-lo com Crônicas
  alternative: Traduzir de modo harmonizado, dando a entender que foram queimados imediatamente
  rationale: O hebraico de Samuel declara apenas que Davi e seus homens removeram os ídolos. O detalhe de que Davi ordenou que fossem queimados pertence ao relato paralelo e deve ser indicado em nota, não inserido no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação inicial com “E” preserva o fluxo narrativo hebraico; “ali” e “os levaram” mantêm uma expressão corrente sem resolver além do texto o destino imediato dos ídolos.
