  text: e que me tira de meus inimigos; tu me elevas acima dos que se levantam contra mim; tu me livras de um homem violento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: e me tira
  rationale: O particípio causativo de יצא conserva a imagem concreta de fazer alguém sair. Em português, “me tira” expressa essa ação com naturalidade; a conjunção וּ é traduzida explicitamente como “e”.
- source_word: מֵאֹיְבָי
  choice: do meio dos meus inimigos
  rationale: A preposição מִן indica afastamento ou saída. “Do meio dos meus inimigos” combina naturalmente com “me tira” e explicita, sem alterar o sentido, a situação da qual o salmista é retirado.
- source_word: וּמִקָּמַי
  choice: acima dos que se levantam contra mim
  rationale: A expressão deriva de קום e descreve adversários por sua ação hostil. “Os que se levantam contra mim” preserva a imagem verbal do hebraico.
- source_word: תְּרוֹמְמֵנִי
  choice: tu me elevas acima
  rationale: A forma verbal de רום comunica elevação e triunfo sobre os adversários. “Elevas acima” mantém tanto a metáfora vertical quanto a relação marcada por מִן.
- source_word: מֵאִישׁ חֲמָסִים
  choice: do homem violento
  rationale: אִישׁ está no singular, enquanto חֲמָסִים caracteriza o homem pela violência. “Homem violento” é idiomático no português atual e mantém o referente singular.
- source_word: תַּצִּילֵנִי
  choice: tu me livras
  rationale: נצל designa resgate ou livramento de perigo. “Livras” é claro, digno e adequado ao paralelismo poético.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com paralelismo preservado. A repetição de “tu me” mantém a mudança formal do particípio inicial para os verbos finitos dirigidos diretamente a Deus. Não foram acrescentadas notas, pois as alternativas lexicais não alteram de modo relevante o sentido do verso.
