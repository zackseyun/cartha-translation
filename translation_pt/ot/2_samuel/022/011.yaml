  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: pt
  text: Ele cavalgou sobre um querubim e voou; apareceu[a] sobre as asas do vento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi visto”.'
    reason: O nifal de ראה pode ser entendido como “apareceu” ou, mais literalmente, “foi visto”.
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: cavalgou
  rationale: O qal consecutivo de רכב significa montar ou cavalgar. “Cavalgou” preserva a imagem vívida de deslocamento sobre o querubim, sem reduzi-la ao simples ato de subir.
- source_word: עַל כְּרוּב
  choice: sobre um querubim
  rationale: A preposição indica posição ou apoio, e כְּרוּב está no singular. “Querubim” é o termo consagrado e mantém o referente celestial sem paráfrase.
- source_word: וַיָּעֹף
  choice: e voou
  rationale: O verbo עוף tem o sentido direto de voar. A tradução evita acrescentar a ideia mais específica de planar ou pairar.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: A forma nifal de ראה pode significar “foi visto” ou “apareceu”. “Apareceu” é natural em português e se ajusta à manifestação poética descrita no contexto, enquanto a alternativa mais formalmente passiva é registrada em nota.
- source_word: כַּנְפֵי
  choice: as asas de
  rationale: Plural construto de כָּנָף, literalmente “asas”. A escolha conserva a imagem concreta e é plenamente acessível em português moderno.
- source_word: רוּחַ
  choice: o vento
  rationale: Neste contexto poético de manifestação divina, רוּחַ designa mais naturalmente o vento. “Espírito” seria menos provável, e “vendaval” acrescentaria uma intensidade não expressa pelo substantivo isolado.
theological_decisions:
- issue: Preservação da imagem poética do guerreiro divino e da linguagem de manifestação
  choice: 'Manter a descrição concreta: Deus cavalga sobre um querubim, voa e aparece sobre as asas do vento.'
  alternative: Parafrasear a cena como uma manifestação divina por meio de uma tempestade.
  rationale: O texto emprega imagens teofânicas vívidas. A tradução as preserva sem transformá-las em explicação meteorológica nem impor uma sistematização teológica.
- issue: Ambiguidade do nifal וַיֵּרָא
  choice: apareceu
  alternative: foi visto
  rationale: As duas formulações são possíveis. “Apareceu” é mais fluente no contexto, mas a nota mantém visível a leitura passiva e evita eliminar a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Cavalgou” preserva a força da metáfora hebraica; “querubim” e “asas do vento” mantêm as imagens tradicionais sem linguagem arcaizante.
