  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: pt
  text: 'Fez das trevas ao redor de si um abrigo[a]: um acúmulo de águas, nuvens espessas do céu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pôs trevas ao redor de si como abrigos: um ajuntamento de águas, nuvens espessas dos céus”. O hebraico é altamente poético, e a expressão rara traduzida por “um acúmulo de águas” também pode ser entendida como “um ajuntamento de águas” ou, de modo mais interpretativo, “nuvens escuras de chuva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: Fez
  rationale: O verbo שׁית significa pôr, colocar ou fazer. Com a construção predicativa seguinte, “fez... um abrigo” é natural em português e preserva o sentido de constituir algo para determinada função.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Equivalente corrente e poeticamente apropriado para חֹשֶׁךְ neste contexto de manifestação divina em meio à tempestade.
- source_word: סְבִיבֹתָיו
  choice: ao redor de si
  rationale: Expressa o cerco espacial em torno do sujeito; “de si” deixa claro que as trevas cercam o próprio Deus sem introduzir referente novo.
- source_word: סֻכּוֹת
  choice: um abrigo
  rationale: 'Embora a forma hebraica seja plural (“abrigos”, “tendas”), o singular coletivo produz uma imagem natural em português: as trevas circundantes funcionam como abrigo. O plural literal é preservado na nota como alternativa legítima.'
- source_word: חַשְׁרַת מַיִם
  choice: um acúmulo de águas
  rationale: A expressão rara provavelmente indica concentração, ajuntamento ou massa de águas. “Acúmulo” mantém a imagem concreta da tempestade sem especificar indevidamente “nuvens de chuva”.
- source_word: עָבֵי שְׁחָקִים
  choice: nuvens espessas do céu
  rationale: עָבִים designa nuvens densas ou espessas, e שְׁחָקִים, o céu ou as alturas celestes. A formulação é clara e conserva o registro poético.
