  text: וַ/יֵּ֥ט שָׁמַ֖יִם וַ/יֵּרַ֑ד וַ/עֲרָפֶ֖ל תַּ֥חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: pt
  text: Ele curvou os céus e desceu; havia escuridão densa[a] debaixo dos seus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nuvem escura»; o hebraico עֲרָפֶל pode indicar uma escuridão espessa associada à manifestação do SENHOR.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: curvou
  rationale: O verbo נטה, tendo «os céus» como objeto, retrata Deus fazendo os céus se dobrarem para baixo. «Curvou» mantém essa imagem cósmica de modo vívido e natural.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: A forma plural pode designar os céus ou o firmamento. «Os céus» preserva o registro elevado e cósmico da teofania poética.
- source_word: וַיֵּרַד
  choice: desceu
  rationale: Tradução direta de ירד, clara em português atual e adequada ao movimento narrativo da poesia.
- source_word: וַעֲרָפֶל
  choice: escuridão densa
  rationale: עֲרָפֶל designa trevas espessas ou uma nuvem sombria, muitas vezes associada à manifestação do SENHOR. «Escuridão densa» conserva tanto a densidade física quanto a atmosfera teofânica sem restringir o termo a uma nuvem.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa diretamente a relação espacial indicada pela preposição hebraica e soa natural em português.
- source_word: רַגְלָיו
  choice: seus pés
  rationale: Mantém a referência concreta aos pés, com o sufixo masculino singular, sem parafrasear a imagem corporal.
theological_decisions:
- issue: Linguagem antropomórfica e espacial na teofania divina
  choice: Manter literalmente «desceu» e «debaixo dos seus pés».
  alternative: Atenuar a imagem com uma paráfrase não corporal, como «manifestou-se desde os céus».
  rationale: O hebraico descreve poeticamente a manifestação de Deus por meio de linguagem corporal e espacial. Preservar essa imagem mantém a tensão do texto entre a transcendência divina e sua representação poética concreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. «Curvou os céus» preserva a imagem cósmica; «havia» explicita naturalmente em português a oração nominal hebraica sem alterar seu sentido.
