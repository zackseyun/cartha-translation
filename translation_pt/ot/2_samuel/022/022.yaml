  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: pt
  text: Pois guardei os caminhos de Yahweh e não me afastei perversamente do meu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não agi perversamente contra o meu Deus”.'
    reason: A construção hebraica רשע מן admite uma tradução que salienta tanto o afastamento de Deus quanto a ação perversa contra ele.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e mantém a ligação explicativa própria do cântico.
- source_word: שָׁמַרְתִּי
  choice: guardei
  rationale: O verbo שׁמר significa guardar ou observar; o pretérito perfeito é natural em português para a declaração retrospectiva do salmista.
- source_word: דַּרְכֵי
  choice: os caminhos
  rationale: O plural de דֶּרֶךְ designa figuradamente a conduta ou as orientações prescritas por Deus; “caminhos” preserva a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: e não me afastei perversamente do meu Deus
  rationale: A tradução conserva tanto o sentido moral de רשע, agir perversamente, quanto a ideia de separação normalmente expressa por מִן, em formulação portuguesa clara e poética.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido de רָשַׁעְתִּי מֵאֱלֹהָי
  choice: não me afastei perversamente do meu Deus
  alternative: não agi perversamente contra o meu Deus
  rationale: A construção combina um verbo que denota perversidade com מִן, normalmente “de, para longe de”. A leitura escolhida preserva as dimensões moral e relacional, enquanto a nota registra a possível compreensão de conduta perversa contra Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética moderada. O paralelismo entre guardar os caminhos de Yahweh e não se afastar do próprio Deus foi preservado.
