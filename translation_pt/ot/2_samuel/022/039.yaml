  text: וָ/אֲכַלֵּ֥/ם וָ/אֶמְחָצֵ֖/ם וְ/לֹ֣א יְקוּמ֑וּ/ן וַֽ/יִּפְּל֖וּ תַּ֥חַת רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: pt
  text: Eu os consumi e os esmaguei[a], e eles não se levantaram; caíram debaixo dos meus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os despedacei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Eu os consumi
  rationale: O verbo אכל significa literalmente “comer” e, em contexto de guerra, pode expressar “consumir” ou “destruir”. “Consumi” preserva a metáfora vigorosa do hebraico e o registro poético.
- source_word: וָאֶמְחָצֵם
  choice: e os esmaguei
  rationale: מחץ denota golpear violentamente, esmagar ou despedaçar. “Esmaguei” comunica uma derrota violenta e decisiva de modo natural em português.
- source_word: וְלֹא יְקוּמוּן
  choice: e eles não se levantaram
  rationale: A formulação declara diretamente o resultado, sem acrescentar a noção modal de incapacidade que apareceria em “não puderam se levantar”.
- source_word: וַיִּפְּלוּ
  choice: caíram
  rationale: Tradução direta de נפל, preservando a progressão compacta e poética do versículo.
- source_word: תַּחַת רַגְלָי
  choice: debaixo dos meus pés
  rationale: Mantém a imagem hebraica convencional de sujeição e derrota, com formulação clara e corrente em português.
theological_decisions:
- issue: A violência da linguagem de guerra no cântico de vitória de Davi
  choice: Manter em primeira pessoa a descrição de destruição e sujeição total
  alternative: Atenuar por meio de paráfrase, como “eu os derrotei completamente”
  rationale: O hebraico emprega verbos poéticos fortes e uma imagem explícita de inimigos caídos sob os pés do vencedor. A tradução conserva essa severidade sem amenizá-la nem ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A metáfora “consumi” foi preservada por ser inteligível e refletir de perto o hebraico; “esmaguei” diferencia o segundo verbo e evita reduzir ambos a um genérico “destruí”.
