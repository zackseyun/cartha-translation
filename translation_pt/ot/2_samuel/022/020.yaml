base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: pt
  text: Ele me trouxe para um lugar espaçoso[a]; resgatou-me, porque se agradou de mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um lugar amplo” ou “para um espaço aberto”. A imagem hebraica contrasta liberdade e alívio com confinamento ou aflição.
    reason: lexical_alternative
  - marker: b
    text: Ou “teve prazer em mim” ou “se deleitou em mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Ele me levou
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, levar para fora”. “Levou” é natural em português e mantém a imagem de retirada do perigo.
- source_word: לַמֶּרְחָב
  choice: para um lugar espaçoso
  rationale: מֶרְחָב designa um espaço amplo e aberto, em contraste figurado com aperto ou aflição. A formulação conserva essa imagem com clareza.
- source_word: יְחַלְּצֵנִי
  choice: resgatou-me
  rationale: חלץ no piel pode significar retirar, livrar ou resgatar. “Resgatou-me” expressa de modo corrente a ação libertadora e forma bom paralelismo com a oração anterior.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do resgate de modo direto e natural em português.
- source_word: חָפֵץ בִּי
  choice: se agradou de mim
  rationale: חפץ com ב indica ter prazer ou agrado em alguém. “Se agradou de mim” preserva a dimensão pessoal sem tornar a expressão excessivamente interpretativa.
theological_decisions:
- issue: Causa do livramento divino
  choice: porque se agradou de mim
  alternative: porque teve prazer em mim
  rationale: O texto atribui o resgate ao agrado favorável de Deus por Davi. A tradução mantém essa afirmação relacional sem acrescentar uma explicação doutrinária sobre mérito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados; os marcadores [a] e [b] aparecem no texto principal.
