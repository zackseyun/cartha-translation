  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: pt
  text: 'E disse: “O SENHOR é a minha rocha, a minha fortaleza e aquele que me livra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino YHWH segundo a convenção portuguesa amplamente reconhecida, sem introduzir uma vocalização discutida no texto principal.
- source_word: סַלְעִי
  choice: a minha rocha
  rationale: Preserva diretamente a metáfora hebraica de estabilidade, proteção e refúgio.
- source_word: מְצוּדָתִי
  choice: a minha fortaleza
  rationale: Expressa naturalmente em português um lugar fortificado de proteção, mantendo o paralelismo poético.
- source_word: מְפַלְטִי
  choice: aquele que me livra
  rationale: O particípio com sufixo de primeira pessoa designa quem põe o salmista a salvo; a formulação verbal é clara e natural em português.
- source_word: לִי
  choice: não expresso separadamente
  rationale: O dativo reforça a relação pessoal, já comunicada por “me” em “me livra”; traduzi-lo também como “para mim” produziria uma redundância pouco natural em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versalete segue uma convenção bíblica portuguesa consolidada e deixa reconhecível que o hebraico traz o nome divino, sem impor no corpo do texto uma reconstrução específica de sua pronúncia.
- issue: Força do dativo final לִי
  choice: incorporada em “me livra”
  alternative: “aquele que me livra para mim”
  rationale: Mantém o sentido pessoal e enfático sem criar uma construção artificial; nenhuma distinção doutrinária depende da reprodução isolada da preposição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado e sintaxe natural. A repetição de “minha” sustenta o ritmo e a ênfase pessoal do hebraico.
