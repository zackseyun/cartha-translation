lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Do brilho
  rationale: נֹגַהּ designa brilho, claridade ou resplendor. “Brilho” é natural e claro em português; a preposição מִן é traduzida por “de”, indicando procedência.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: נֶגֶד com sufixo masculino singular expressa o que está diante ou em frente dele. “Diante dele” preserva o sentido espacial e se ajusta ao registro poético.
- source_word: בָּעֲרוּ
  choice: arderam
  rationale: O qal de בער significa queimar ou arder. “Arderam” conserva a forma verbal intransitiva e evita acrescentar uma ideia causal ou um movimento não explicitado no hebraico.
- source_word: גַּחֲלֵי אֵשׁ
  choice: brasas de fogo
  rationale: A expressão construta significa literalmente “brasas de fogo”. A formulação preserva a imagem hebraica e é compreensível em português.
theological_decisions:
- issue: Imagem teofânica e sujeito implícito
  choice: A oração descreve as brasas ardendo a partir do brilho diante de Deus, sem acrescentar uma ação divina causativa.
  alternative: “Seu brilho incendiou brasas de fogo.”
  rationale: O hebraico é compacto e poético. A tradução mantém a sequência e a imagem teofânica sem introduzir causalidade que o texto não declara explicitamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética. A formulação mantém a compactação e a ambiguidade causal do hebraico.
