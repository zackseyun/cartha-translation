  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: pt
  text: Tu salvas um povo aflito[a], mas teus olhos estão sobre os altivos[b], e tu os rebaixas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “povo pobre”. O adjetivo hebraico pode descrever quem é pobre, aflito ou oprimido.
    reason: lexical_alternative
  - marker: b
    text: Ou “orgulhosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: povo
  rationale: O substantivo coletivo singular designa um grupo de pessoas; “povo” é natural em português e preserva o paralelismo poético.
- source_word: עָנִי
  choice: aflito
  rationale: O adjetivo pode indicar alguém pobre, necessitado, oprimido ou humilhado. “Aflito” mantém a dimensão de sofrimento e condição humilde sem limitar o sentido à pobreza econômica.
- source_word: תּוֹשִׁיעַ
  choice: tu salvas
  rationale: O hifil de ישׁע expressa salvar ou livrar. “Salvas” é conciso e conserva a amplitude do verbo.
- source_word: עֵינֶיךָ
  choice: teus olhos
  rationale: Mantém a imagem concreta do hebraico, clara e expressiva também em português.
- source_word: רָמִים
  choice: os altivos
  rationale: No contraste poético, o termo descreve os que se elevam com arrogância. “Altivos” preserva tanto a imagem de elevação quanto sua conotação moral.
- source_word: תַּשְׁפִּיל
  choice: para rebaixá-los
  rationale: O hifil de שׁפל significa fazer descer, rebaixar ou humilhar. A construção final em português apresenta de modo natural a relação entre o olhar de Deus sobre os altivos e o ato de fazê-los descer.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção básica seja “e”, o paralelismo estabelece contraste entre salvar os aflitos e rebaixar os altivos; “mas” torna essa relação explícita em português.
theological_decisions:
- issue: Contraste moral ou meramente social
  choice: O versículo contrasta o povo aflito com os altivos, sem restringir a aflição à pobreza econômica.
  alternative: Entender o contraste apenas como oposição entre os economicamente pobres e os socialmente elevados.
  rationale: Os termos hebraicos admitem implicações sociais, mas o paralelismo também apresenta uma dimensão moral entre os rebaixados ou oprimidos e os que se exaltam. A redação conserva ambas as possibilidades sem reduzir o texto a uma única esfera.
translation_notes:
  register: Português moderno, claro e digno, com uso de “tu” para corresponder à segunda pessoa singular do hebraico. A imagem concreta de “teus olhos” foi preservada, e “altivos” mantém a metáfora vertical que culmina em “rebaixá-los”.
