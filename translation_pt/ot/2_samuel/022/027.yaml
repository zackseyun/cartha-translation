base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: pt
  text: Com quem é puro, tu te mostras puro; mas, com quem é tortuoso, tu te mostras tortuoso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tu te mostras contrário” ou “tu te mostras sagaz”. O verbo hebraico é raro e de sentido incerto; descreve a maneira correspondente como Deus lida com quem é tortuoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: puro
  rationale: O adjetivo denota pureza ou limpeza. “Puro” é natural em português e permite conservar a repetição da raiz no verbo seguinte.
- source_word: תִּתָּבָר
  choice: tu te mostras puro
  rationale: A forma verbal reflexiva da mesma raiz de נָבָר indica que Deus se revela ou se apresenta como puro em relação ao puro; a tradução também preserva o paralelismo poético.
- source_word: עִקֵּשׁ
  choice: tortuoso
  rationale: O adjetivo descreve alguém moralmente retorcido ou perverso. “Tortuoso” mantém a imagem concreta e a correspondência verbal com a oração seguinte.
- source_word: תִּתַּפָּל
  choice: tu te mostras tortuoso
  rationale: O verbo é raro e de sentido discutido. A escolha retém sua força negativa e a correspondência poética com “tortuoso”, sem substituir a tensão do hebraico por uma interpretação mais explícita.
- source_word: עִם
  choice: com
  rationale: A preposição expressa a relação em que Deus se manifesta diante de cada tipo de pessoa; “com” reproduz essa correspondência de maneira direta.
theological_decisions:
- issue: Como expressar a resposta de Deus ao tortuoso sem eliminar a tensão do texto
  choice: tu te mostras tortuoso
  alternative: tu te mostras contrário / tu te mostras sagaz
  rationale: A formulação conserva o paralelismo incisivo e a ambiguidade do verbo hebraico raro. A nota registra outras possibilidades, sem decidir silenciosamente que a expressão atribui perversidade moral a Deus nem atenuar a linguagem da fonte.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela e repetição deliberada. A construção “com quem é” soa natural tanto no Brasil como em outros contextos lusófonos; o pronome explícito “tu” torna clara a forma reflexiva.
