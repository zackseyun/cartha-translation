  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: pt
  text: Fui íntegro diante dele[a] e me guardei da minha iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui irrepreensível para com ele” ou “fui inteiro com ele”. O termo hebraico pode enfatizar integridade ou inteireza, não necessariamente ausência absoluta de pecado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do meu pecado” ou “da minha culpa”. O termo hebraico pode significar iniquidade, culpa ou pecado, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Fui
  rationale: O wayyiqtol de היה tem aqui valor passado. Em português, “fui” expressa naturalmente o estado descrito, sem reproduzir mecanicamente a conjunção inicial.
- source_word: תָמִים
  choice: íntegro
  rationale: תָמִים pode indicar inteireza, integridade ou irrepreensibilidade. “Íntegro” preserva a dimensão moral e relacional sem afirmar necessariamente ausência absoluta de pecado.
- source_word: לוֹ
  choice: diante dele
  rationale: 'Embora a preposição signifique literalmente “para ele”, a expressão tem sentido relacional e avaliativo: integridade perante Deus. “Diante dele” é natural e mantém esse valor.'
- source_word: וָאֶשְׁתַּמְּרָה
  choice: me guardei
  rationale: A forma reflexiva de שׁמר descreve o ato de vigiar ou preservar a si mesmo. “Me guardei” conserva de modo conciso essa força reflexiva.
- source_word: מֵעֲוֺנִי
  choice: da minha iniquidade
  rationale: עָוֹן pode designar iniquidade, culpa ou pecado. “Iniquidade” mantém o peso moral e o sufixo de primeira pessoa, sem eliminar a ambiguidade lexical, registrada em nota.
theological_decisions:
- issue: Se a afirmação de Davi implica perfeição sem pecado
  choice: Uma afirmação forte de integridade diante de Deus, sem explicitar perfeição moral absoluta
  alternative: Uma afirmação de absoluta ausência de pecado
  rationale: “Íntegro” conserva a força de תָמִים e, ao mesmo tempo, sua noção de inteireza moral. A tradução não enfraquece a declaração nem resolve além do texto a tensão com o reconhecimento da “minha iniquidade” na segunda oração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A ordem das notas acompanha os respectivos termos no texto, e a formulação preserva tanto a força da reivindicação de integridade quanto a ambiguidade de עָוֹן.
