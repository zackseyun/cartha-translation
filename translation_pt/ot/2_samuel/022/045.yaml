base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/045.yaml
  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: pt
  text: Os estrangeiros se submetem a mim[a]; assim que ouvem[b], me obedecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fingem obedecer-me” ou “vêm encolhidos diante de mim”. O verbo hebraico pode indicar submissão relutante ou insincera.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao ouvir do ouvido”; isto é, assim que ouvem.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: os estrangeiros
  rationale: O idioma hebraico significa literalmente “filhos do estrangeiro”, mas designa pessoas estrangeiras. A forma direta é natural em português e preserva o referente sem um hebraísmo potencialmente enganoso.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: se submetem a mim
  rationale: Neste cântico de vitória, o hitpael de כחש expressa submissão imposta, possivelmente relutante ou fingida. A tradução comunica o sentido contextual principal, enquanto a nota preserva a ambiguidade lexical.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: assim que ouvem
  rationale: A expressão literalmente ligada ao “ouvir do ouvido” é um idioma que indica reação imediata ao que se ouve. A formulação portuguesa transmite esse valor com clareza.
- source_word: יִשָּׁמְעוּ לִי
  choice: me obedecem
  rationale: שמע com ל pode significar escutar no sentido de atender ou obedecer; o contexto de povos subjugados favorece “obedecem”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O hebraísmo “filhos de estrangeiros” foi vertido pelo sentido; a tensão entre submissão efetiva, relutante e fingida foi preservada em nota.
