  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: pt
  text: Persegui os meus inimigos e os destruí; não voltei atrás até que fossem consumidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até acabar com eles” ou “até que chegassem ao fim”. O verbo hebraico pode significar completar, consumir ou levar ao fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Persegui
  rationale: O qal de רדף expressa perseguir ou ir no encalço de alguém; “persegui” é natural, preciso e adequado ao contexto militar.
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: O substantivo אויב com sufixo de primeira pessoa significa diretamente “meus inimigos”, preservando o caráter pessoal do conflito.
- source_word: וָאַשְׁמִידֵם
  choice: e os destruí
  rationale: No hifil, שׁמד significa destruir ou exterminar. “Destruí” mantém a força do verbo sem recorrer a uma formulação excessivamente enfática.
- source_word: וְלֹא אָשׁוּב
  choice: não voltei atrás
  rationale: Neste contexto de perseguição, שׁוב indica interromper o avanço e voltar atrás, não simplesmente regressar a um lugar.
- source_word: עַד כַּלּוֹתָם
  choice: até acabar com eles
  rationale: כלה pode indicar completar, consumir ou levar ao fim. A formulação comunica naturalmente a derrota total, ao mesmo tempo que a nota registra a possível leitura passiva.
