base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/041.yaml
  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: pt
  text: Fizeste meus inimigos dar-me as costas[a]; destruí os que me odiavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “deste-me a nuca/as costas dos meus inimigos”, expressão que indica que eles foram obrigados a voltar-se e fugir diante do vencedor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: אֹיֵב com o sufixo de primeira pessoa do singular significa de modo direto “meus inimigos”; esta é a formulação mais clara e corrente em português.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: Fizeste os meus inimigos virar as costas para mim
  rationale: A expressão significa literalmente dar a alguém a nuca ou as costas e, no contexto de combate, descreve inimigos obrigados a voltar-se e fugir. A tradução explicita o sentido idiomático sem perder a imagem corporal.
- source_word: מְשַׂנְאַי
  choice: os que me odiavam
  rationale: O particípio substantivado de שׂנא com sufixo de primeira pessoa designa aqueles que odiavam o falante. O imperfeito em português harmoniza com a narração passada e conserva a ideia de atitude contínua.
- source_word: וָאַצְמִיתֵם
  choice: destruí
  rationale: O hifil de צמת comunica destruir, exterminar ou dar fim. “Destruí” mantém a força do verbo com linguagem digna e amplamente compreensível.
