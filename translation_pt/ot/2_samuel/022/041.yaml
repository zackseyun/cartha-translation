  verdict: revise
  source_fidelity: 'O sentido central está corretamente representado: Deus põe os inimigos em retirada e o salmista os destrói. Contudo, «virar as costas para mim» pode soar como afastamento pessoal e explicita menos diretamente a construção hebraica em que os inimigos dão a nuca/as costas ao vencedor. «Dar-me as costas» preserva melhor a relação expressa por לִי e é uma formulação portuguesa mais concisa.'
  naturalness: «Fizeste meus inimigos dar-me as costas» é natural em português moderno e mantém o tom poético-militar. «Destruí os que me odiavam» é claro, digno e adequado ao paralelismo.
  terminology: «Inimigos», «os que me odiavam» e «destruí» correspondem adequadamente a אֹיְבַי, מְשַׂנְאַי e ao hifil de צמת. A nota preserva a imagem corporal de עֹרֶף e explica seu valor contextual sem transformar a imagem em uma afirmação excessivamente técnica.
  issues:
  - severity: low
    issue: A expressão principal «virar as costas para mim» é menos precisa e ligeiramente menos idiomática neste contexto do que «dar-me as costas».
    rationale: O hebraico diz literalmente que Deus deu ao falante a nuca/as costas dos inimigos, imagem de adversários que se voltam em retirada. «Dar-me as costas» mantém tanto o destinatário («a mim») quanto a imagem, sem depender da construção mais ambígua «virar as costas para».
  revised_text: Fizeste meus inimigos dar-me as costas[a]; destruí os que me odiavam.
