  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: pt
  text: Quanto a Deus, seu caminho é irrepreensível; a palavra de Yahweh é comprovada[a]; ele é escudo para todos os que nele se refugiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “refinada” ou “testada”; o hebraico evoca metal purificado numa fornalha.
    reason: Alternativas lexicais que preservam mais diretamente a metáfora metalúrgica de צְרוּפָה.
lexical_decisions:
- source_word: הָאֵל
  choice: Quanto a Deus
  rationale: A expressão apresenta Deus como tópico da afirmação. “Quanto a Deus” reproduz essa abertura discursiva de modo natural em português.
- source_word: תָּמִים
  choice: irrepreensível
  rationale: No contexto, descreve o caminho ou modo de agir de Deus como íntegro e sem defeito. “Irrepreensível” evita que “perfeito” seja entendido apenas como excelência abstrata.
- source_word: דַּרְכּוֹ
  choice: seu caminho
  rationale: Preserva a imagem hebraica de דֶּרֶךְ e, neste contexto, refere-se ao modo de Deus agir.
- source_word: אִמְרַת יְהוָה
  choice: a palavra de Yahweh
  rationale: אִמְרָה pode indicar palavra, declaração ou promessa. “Palavra” conserva a amplitude do termo e o paralelismo poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְרוּפָה
  choice: comprovada
  rationale: O termo evoca metal refinado pelo fogo e, por extensão, algo testado e reconhecido como genuíno. “Comprovada” comunica claramente o resultado da imagem, enquanto a nota preserva sua base concreta.
- source_word: מָגֵן הוּא
  choice: ele é escudo
  rationale: Mantém a metáfora protetora e a ênfase do pronome explícito no hebraico, com concisão poética.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: para todos os que nele se refugiam
  rationale: חסה descreve buscar abrigo ou proteção. “Refugiam” preserva a imagem concreta e é mais específico que o simples “confiam”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o representa diretamente sem substituir o nome por um título.
- issue: Força metafórica de צְרוּפָה aplicada à palavra de Yahweh
  choice: comprovada
  alternative: refinada; testada; purificada
  rationale: “Comprovada” exprime que a palavra foi posta à prova e demonstrou ser genuína, sem transformar a metáfora em uma afirmação teológica mais específica. A nota registra a imagem metalúrgica do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. “Nele” e “refugiam” mantêm a imagem tradicional sem soar arcaicos; o nome Yahweh permanece explícito.
