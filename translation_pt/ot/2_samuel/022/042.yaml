  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: pt
  text: Olharam em busca de socorro[a], mas não havia quem os salvasse; olharam para Yahweh, mas ele não lhes respondeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma interpretação contextual: «Clamaram por ajuda». O verbo hebraico significa literalmente «olhar» ou «voltar-se em busca de auxílio».'
    reason: ambiguidade_lexical
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Clamaram por ajuda
  rationale: No contexto de derrota e em paralelo com מֹשִׁיעַ, o verbo exprime um apelo desesperado por socorro. A formulação também preserva, em nota, a possibilidade lexical de procurar ajuda com o olhar.
- source_word: וְאֵין מֹשִׁיעַ
  choice: mas não houve quem os salvasse
  rationale: O valor adversativo da conjunção fica natural com «mas». O particípio מֹשִׁיעַ designa alguém que salva ou livra, sem exigir o título teológico «Salvador».
- source_word: אֶל יְהוָה
  choice: clamaram a Yahweh
  rationale: A preposição indica a direção do apelo. O verbo é retomado de modo explícito em português para reproduzir com clareza o paralelismo elíptico do hebraico.
- source_word: וְלֹא עָנָם
  choice: mas ele não lhes respondeu
  rationale: O sujeito masculino singular é Yahweh, mencionado imediatamente antes; o sufixo plural refere-se aos inimigos que clamaram.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome divino. A transliteração «Yahweh» preserva essa referência pessoal sem substituí-la por um título.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição de «clamaram» explicita a elipse hebraica e conserva o paralelismo.
