source:
  edition: WLC
  text: יְקַדְּמֻ֖/נִי בְּ/י֣וֹם אֵידִ֑/י וַ/יְהִ֧י יְהוָ֛ה מִשְׁעָ֖ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: pt
  text: Eles me enfrentaram no dia da minha calamidade[a], mas Yahweh[b] foi o meu apoio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vieram sobre mim” ou “foram ao meu encontro no dia da minha calamidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome divino; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Eles me enfrentaram
  rationale: O piel de קדם com objeto de primeira pessoa, neste contexto hostil, indica ir ao encontro de alguém ou abordá-lo de modo adversário. “Enfrentaram” expressa essa força sem eliminar as possibilidades mais neutras registradas na nota.
- source_word: בְּיוֹם אֵידִי
  choice: no dia da minha calamidade
  rationale: Mantém a expressão temporal e traduz אֵיד como uma desgraça grave ou desastre, sem reduzi-la apenas a sofrimento interior.
- source_word: וַיְהִי
  choice: mas ... foi
  rationale: Embora o ו possa ser vertido formalmente por “e”, o contexto estabelece contraste entre a ação dos inimigos e o amparo divino; “mas” comunica essa relação naturalmente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: מִשְׁעָן לִי
  choice: foi o meu apoio
  rationale: מִשְׁעָן designa aquilo em que alguém se apoia, literal ou figuradamente. “Meu apoio” preserva a metáfora e soa natural em português atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. A tradução o representa como “Yahweh”, enquanto a nota informa a convenção tradicional de substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e o contraste do hebraico foram preservados, e as alternativas lexicais genuínas foram mantidas em nota.
