  text: כִּ֥י כָל משפט/ו לְ/נֶגְדִּ֑/י וְ/חֻקֹּתָ֖י/ו לֹא אָס֥וּר מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: pt
  text: Pois todos os seus juízos estavam diante de mim, e não me afastei dos seus estatutos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não me afastei dela”. A forma feminina singular tem referente incerto; provavelmente retoma coletivamente “os seus estatutos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e preserva com naturalidade o nexo causal no fluxo poético.
- source_word: כָל
  choice: todas
  rationale: Mantém a força abrangente do quantificador hebraico.
- source_word: מִשְׁפָּטָיו
  choice: suas decisões
  rationale: O termo pode designar decisões judiciais, normas ou juízos; “decisões” conserva aqui o sentido jurídico e permanece distinto de “decretos”.
- source_word: לְנֶגְדִּי
  choice: estavam diante de mim
  rationale: Preserva a metáfora hebraica de algo mantido à vista e presente à consciência.
- source_word: וְחֻקֹּתָיו
  choice: e seus decretos
  rationale: Expressa prescrições estabelecidas e mantém a distinção lexical em relação a מִשְׁפָּטָיו.
- source_word: לֹא אָסוּר
  choice: não me afastei
  rationale: Traduz de modo natural o verbo סוּר, que indica desviar-se ou apartar-se.
- source_word: מִמֶּנָּה
  choice: dos seus decretos
  rationale: Explicita em português o referente provável da forma pronominal feminina singular, cujo uso poético é incomum após o plural חֻקֹּתָיו.
theological_decisions:
- issue: Distinção entre os termos da lei da aliança
  choice: 'Manter termos distintos: “decisões” e “decretos”.'
  alternative: Generalizar ambos como “leis”, “mandamentos” ou “normas”.
  rationale: O hebraico emprega dois substantivos jurídicos diferentes em paralelismo; preservar a diferença evita achatar a linguagem da fonte.
- issue: Referente do pronome em מִמֶּנָּה
  choice: Entender a expressão como afastar-se dos decretos de Deus.
  alternative: Traduzir literalmente “não me afastei dela” ou entender de modo coletivo “não me afastei deles”.
  rationale: O contexto favorece os decretos como referente, mas a discordância formal entre o pronome feminino singular e o substantivo plural constitui uma dificuldade textual legítima, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. “Diante de mim” conserva a imagem da fonte; “decisões” e “decretos” mantêm o paralelismo jurídico sem recorrer a linguagem excessivamente técnica.
