  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: pt
  text: Javé me tratou conforme a minha justiça[a]; conforme a pureza das minhas mãos, ele me recompensou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com a minha retidão”. Neste contexto, “justiça” se refere à conduta correta do falante, sem necessariamente afirmar perfeição absoluta.'
    reason: semantic_and_theological_clarification
  - marker: b
    text: 'Ou: “me retribuiu”. “Pureza das minhas mãos” é uma imagem hebraica de inocência ou integridade nas ações.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: me tratou
  rationale: O verbo גמל pode descrever o modo como alguém trata ou retribui outra pessoa de acordo com sua conduta. “Me tratou” preserva essa amplitude, enquanto o paralelo poético indica aqui uma retribuição favorável.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma corrente em português o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּצִדְקָתִי
  choice: conforme a minha justiça
  rationale: Mantém a referência explícita à retidão ou conduta justa do falante e reproduz o sentido de medida ou correspondência da preposição כְּ.
- source_word: כְּבֹר יָדַי
  choice: conforme a pureza das minhas mãos
  rationale: בֹּר exprime pureza ou limpeza. A formulação conserva a imagem concreta hebraica das mãos puras, associada à inocência ou integridade das ações.
- source_word: יָשִׁיב לִי
  choice: ele me recompensou
  rationale: O hifil de שוב, com לִי, expressa devolver ou retribuir. “Recompensou” comunica com naturalidade a retribuição favorável sugerida pelo paralelismo.
theological_decisions:
- issue: Se a declaração de justiça pessoal deve ser suavizada ou entendida como perfeição sem pecado e mérito absoluto diante de Deus
  choice: Preservar a afirmação direta de que Javé agiu conforme a justiça e a pureza das ações do falante.
  alternative: Suavizar a linguagem de justiça pessoal ou ampliá-la para afirmar impecabilidade absoluta ou salvação meritória.
  rationale: O hebraico atribui explicitamente ao falante “minha justiça” e “pureza das minhas mãos”. A tradução mantém essa tensão sem acrescentar uma conclusão doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O paralelismo poético foi preservado por meio da repetição de “conforme”. “Javé” identifica o nome divino, e as notas mantêm tanto a alternativa lexical quanto a força idiomática da imagem das mãos.
