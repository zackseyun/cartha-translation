  terminology: '"Deus" é apropriado para הָאֵל. "Refúgio" conserva o valor protetivo de מָעוּז, e "perfeito", aplicado ao caminho, preserva de modo mais direto o sentido de completo, íntegro, sem obstáculo ou defeito, sem exigir uma interpretação moralizante.'
