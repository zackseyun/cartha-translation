  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: pt
  text: Deus é o meu refúgio forte e torna perfeito o meu caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais literalmente a forma consonantal: “e torna perfeito o seu caminho”. O paralelo em Salmo 18:32 apoia “o meu caminho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Deus
  rationale: O artigo definido com אֵל funciona aqui naturalmente como referência titular ao Deus de Israel. Em português corrente, “Deus” é mais idiomático do que “o Deus” isoladamente.
- source_word: מָעוּזִּי
  choice: o meu refúgio
  rationale: מָעוֹז designa um lugar ou fonte de proteção e segurança. “Refúgio” preserva esse sentido sem impor uma imagem militar específica como “fortaleza”.
- source_word: חָיִל
  choice: forte
  rationale: Neste contexto, חָיִל comunica força ou poder e qualifica מָעוּזִּי. A formulação adjetival “forte refúgio” é natural em português e conserva a ideia de vigor protetor.
- source_word: וַיַּתֵּר
  choice: torna
  rationale: O verbo é difícil neste emprego, mas, em paralelo com Salmo 18:32, expressa a ação divina de estabelecer ou fazer que o caminho tenha determinada qualidade. “Torna” liga-se de modo claro ao predicativo seguinte sem especificar além do que o contexto permite.
- source_word: תָּמִים
  choice: irrepreensível
  rationale: תָּמִים pode indicar inteireza, integridade ou ausência de defeito. “Irrepreensível” preserva a dimensão moral do termo e evita que “perfeito” seja entendido como perfeição absoluta ou impecabilidade.
- source_word: דרכו
  choice: o meu caminho
  rationale: A forma consonantal e a vocalização preservada em Samuel apontam literalmente para “o seu caminho”, mas o paralelo poético de Salmo 18:32 traz “o meu caminho” e sustenta essa leitura no contexto. A alternativa textual genuína é mantida em nota.
theological_decisions:
- issue: Referente pronominal na palavra final
  choice: Deus torna irrepreensível o caminho do próprio salmista.
  alternative: Deus torna irrepreensível o seu próprio caminho.
  rationale: O texto de Samuel, tal como vocalizado, pode ser lido como “o seu caminho”, enquanto o paralelo em Salmo 18:32 apoia “o meu caminho”. A tradução adota a leitura contextual e paralela, mas não elimina a ambiguidade textual, registrando a alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Forte refúgio” conserva tanto a proteção quanto a força; “torna irrepreensível” mantém a construção predicativa e evita linguagem excessivamente técnica.
