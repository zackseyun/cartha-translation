  text: Então a terra se abalou e tremeu; os fundamentos dos céus estremeceram e foram sacudidos, porque ele se irou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: oscilou
  rationale: Representa o movimento convulsivo da terra sem duplicar o verbo seguinte; preserva a sequência poética de movimentos.
- source_word: וַתִּתְגָּעַשׁ
  choice: tremeu
  rationale: Expressa de modo natural o forte abalo da terra e mantém o paralelismo verbal.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: os fundamentos dos céus
  rationale: Tradução formal da imagem cosmológica hebraica, sem substituir 'céus' por outra expressão.
- source_word: יִרְגָּזוּ
  choice: estremeceram
  rationale: Comunica agitação e tremor intensos no primeiro verbo do paralelo.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: foram sacudidos
  rationale: Distingue o segundo verbo do paralelo em português natural e mantém a ideia de violento abalo.
- source_word: כִּי חָרָה לוֹ
  choice: porque ele se irou
  rationale: A expressão idiomática descreve a ira divina; a formulação é digna, clara e evita acrescentar um objeto não expresso.
theological_decisions:
- issue: Antropopatia da ira divina
  choice: porque ele se irou
  alternative: porque estava irado
  rationale: Mantém a linguagem pessoal e dinâmica do hebraico sem explicar ou atenuar teologicamente a ira de Deus.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. A imagem antiga dos 'fundamentos dos céus' foi mantida literalmente. Não há necessidade de nota textual neste versículo.
