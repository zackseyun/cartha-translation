  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: pt
  text: Alargas os meus passos debaixo de mim[a], e os meus tornozelos não vacilaram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Alargas os meus passos debaixo de mim”. A expressão hebraica comunica a ideia de dar espaço amplo e apoio seguro para caminhar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não escorregaram” ou “não cederam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Alargas
  rationale: O hifil de רחב expressa a ação de tornar largo ou espaçoso. “Alargas” preserva o valor causativo e o paralelismo poético.
- source_word: צַעֲדַי
  choice: os meus passos
  rationale: O substantivo צעד significa “passo” ou “passada”. A tradução formal mantém a imagem hebraica, enquanto a nota esclarece o sentido idiomático de espaço e apoio seguros.
- source_word: תַּחְתֵּנִי
  choice: debaixo de mim
  rationale: Reproduz diretamente a relação espacial de תחת sem acrescentar uma interpretação causal ou final.
- source_word: וְלֹא
  choice: e ... não
  rationale: Mantém a coordenação simples do hebraico, sem convertê-la em propósito ou resultado explícito.
- source_word: מָעֲדוּ
  choice: não vacilaram
  rationale: מעד pode indicar escorregar, cambalear ou perder a firmeza. “Vacilaram” comunica instabilidade física e combina naturalmente com “tornozelos”.
- source_word: קַרְסֻלַּי
  choice: os meus tornozelos
  rationale: O termo designa especificamente os tornozelos ou a região das articulações, preservando a imagem corporal mais precisa.
