  register: Português moderno, poético e digno, com sintaxe clara. Conserva-se a imagem hebraica incomum de alargar os passos, explicada em nota, em vez de substituí-la silenciosamente por “o chão”. Os marcadores aparecem junto às respectivas expressões.
