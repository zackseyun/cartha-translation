source:
  edition: WLC
  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: pt
  text: Yahweh vive! Bendita seja a minha rocha! Exaltado seja Deus, a rocha da minha salvação![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Deus, minha rocha salvadora” ou “Deus, a rocha do meu livramento”. O hebraico também pode ser entendido mais literalmente como “o Deus da rocha da minha salvação”.
    reason: A cadeia construta hebraica é incomum e admite mais de uma análise; além disso, יֶשַׁע pode indicar salvação ou livramento.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh vive!
  rationale: A oração nominal hebraica funciona aqui como aclamação do Deus vivo. A formulação portuguesa é direta, natural e preserva a força doxológica.
- source_word: וּבָרוּךְ צוּרִי
  choice: Bendita seja a minha rocha!
  rationale: O particípio passivo em contexto de louvor tem força de aclamação. “Rocha” conserva a metáfora concreta e teologicamente significativa de צוּר.
- source_word: וְיָרֻם
  choice: Exaltado seja
  rationale: A forma verbal expressa desejo ou aclamação e fica em paralelo com “Bendita seja”.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Deus, a rocha da minha salvação
  rationale: A tradução adota a leitura poética e apositiva refletida pelo paralelismo e pela repetição de צוּר, sem ocultar em nota a dificuldade da cadeia construta hebraica.
- source_word: יִשְׁעִי
  choice: minha salvação
  rationale: “Salvação” preserva a amplitude de יֶשַׁע, embora “livramento” seja possível no contexto de vitória e resgate.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, que é transliterado como “Yahweh” para preservar sua identidade como nome próprio.
- issue: Metáfora divina de צוּר
  choice: rocha
  alternative: refúgio; rochedo
  rationale: A imagem hebraica de firmeza e proteção é mantida, em vez de ser substituída por sua interpretação.
- issue: Construção אֱלֹהֵי צוּר יִשְׁעִי
  choice: Deus, a rocha da minha salvação
  alternative: o Deus da rocha da minha salvação; Deus, minha rocha salvadora; Deus, a rocha do meu livramento
  rationale: A leitura apositiva produz uma aclamação coerente com o paralelismo, mas a forma hebraica אֱלֹהֵי é construta e permite uma análise mais literal e difícil; a nota conserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com exclamações que reproduzem o caráter de louvor. Mantêm-se o nome Yahweh e a metáfora da rocha. O marcador foi colocado junto à expressão ambígua a que a nota se refere.
