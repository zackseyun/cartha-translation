  source_fidelity: 'A tradução reproduz adequadamente a sequência aclamatória hebraica: a declaração de que Yahweh vive, a bênção dirigida à “minha rocha” e o desejo de que Deus, a rocha da salvação do salmista, seja exaltado. Mantém a metáfora de צוּר e registra em nota, sem resolver indevidamente, a dificuldade sintática de אֱלֹהֵי צוּר יִשְׁעִי.'
