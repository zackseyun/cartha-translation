  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: pt
  text: Enviou flechas e os dispersou; enviou relâmpagos[a] e os lançou em confusão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os pôs em fuga”; os dois verbos podem descrever o efeito das flechas e dos relâmpagos sobre os inimigos.'
    reason: Alternativa lexical para os verbos que expressam a desorientação e a dispersão dos adversários; a repetição de “enviou” na tradução torna natural em português a elipse poética do hebraico.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lançou
  rationale: שלח significa basicamente “enviar”. Com “flechas” como objeto, “lançou” é natural em português e mantém a imagem poética sem tornar a frase excessivamente técnica.
- source_word: חִצִּים
  choice: flechas
  rationale: Equivalente direto e corrente de חִצִּים, preservando a imagem bélica concreta.
- source_word: וַיְפִיצֵם
  choice: e os dispersou
  rationale: O verbo causativo expressa espalhar ou dispersar. O pronome masculino plural remete naturalmente aos inimigos implícitos no contexto.
- source_word: בָּרָק
  choice: relâmpagos
  rationale: בָּרָק denota relâmpago ou clarão. O plural genérico soa natural em português e representa a manifestação repetida ou coletiva sem alterar a imagem.
- source_word: וַיְהֻמֵּם
  choice: e os pôs em confusão
  rationale: המם pode significar lançar em confusão, causar tumulto ou pôr em fuga. A formulação escolhida preserva a força causativa e não reduz o sentido apenas ao resultado militar.
theological_decisions:
- issue: Referente dos sufixos pronominais em וַיְפִיצֵם e וַיְהֻמֵּם
  choice: Os pronomes “os” se referem aos inimigos ou adversários de Davi, implícitos no contexto.
  alternative: Manter o objeto apenas subentendido não é gramaticalmente natural em português.
  rationale: Os sufixos hebraicos exigem um referente, e o contexto de combate divino identifica mais naturalmente os adversários, sem necessidade de inseri-los explicitamente no versículo.
- issue: Elipse verbal antes de בָּרָק
  choice: 'Preservar na linha principal a construção poética elíptica: “relâmpagos”.'
  alternative: 'Repetir o verbo: “lançou relâmpagos”.'
  rationale: O hebraico apresenta בָּרָק de forma compacta, sem repetir explicitamente וַיִּשְׁלַח. A elipse continua compreensível em português e preserva o ritmo e a tensão poética do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética concisa. A pontuação preserva o paralelismo e sinaliza a elipse verbal sem acrescentar conteúdo ao texto hebraico.
