  naturalness: “Lançou flechas e os dispersou” é natural, mas “relâmpagos[a], e os pôs em confusão” não forma uma oração portuguesa fluente. “Enviou flechas ...; enviou relâmpagos ...” mantém concisão, paralelismo e legibilidade moderna.
  terminology: “Dispersou” corresponde bem a וַיְפִיצֵם, e “lançou em confusão” exprime adequadamente o causativo de וַיְהֻמֵּם. “Enviou” reflete mais diretamente וַיִּשְׁלַח do que “lançou”, sem perder a imagem bélica.
