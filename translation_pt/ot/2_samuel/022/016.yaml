  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: pt
  text: 'Então os canais do mar ficaram visíveis,

    e os alicerces do mundo[a] foram expostos,

    à repreensão de Yahweh[b],

    pelo sopro do fôlego de suas narinas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do mundo habitado”.'
    reason: תֵּבֵל pode designar o mundo em geral ou, mais especificamente, o mundo habitado.
  - marker: b
    text: 'Tradicionalmente: “do SENHOR”.'
    reason: Muitas traduções substituem o nome divino יהוה pelo título “SENHOR”.
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: ficaram visíveis
  rationale: Preserva a voz passiva do nifal de ראה e expressa de modo natural o surgimento súbito dos canais à vista.
- source_word: אֲפִקֵי יָם
  choice: os canais do mar
  rationale: אֲפִיקִים designa canais, leitos ou cursos de água; “canais do mar” conserva a imagem poética sem especificar indevidamente fontes ou o leito inteiro.
- source_word: יִגָּלוּ
  choice: foram expostos
  rationale: O nifal de גלה indica que algo foi descoberto ou deixado a nu; “foram expostos” mantém o paralelismo passivo com “ficaram visíveis”.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: os alicerces do mundo
  rationale: מוֹסְדוֹת são fundamentos ou alicerces, e תֵּבֵל designa poeticamente o mundo, por vezes com ênfase no mundo habitado.
- source_word: בְּגַעֲרַת יְהוָה
  choice: à repreensão de Yahweh
  rationale: גְּעָרָה é uma repreensão poderosa, especialmente em cenas de manifestação divina; a preposição marca a causa ou ocasião do abalo cósmico.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: ao sopro do vento de suas narinas
  rationale: A formulação mantém os elementos concretos נְשָׁמָה, רוּחַ e אַף e preserva a imagem antropomórfica de uma exalação divina impetuosa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome pessoal יהוה. “Yahweh” o representa diretamente, enquanto “SENHOR” registra a tradição de substituí-lo por um título; a nota informa essa alternativa sem apagar o nome do texto principal.
translation_notes:
  register: Português atual, digno e poético, com sintaxe clara e paralelismo preservado. “Alicerces” tem ampla compreensão no português brasileiro e mantém a imagem arquitetônica; “narinas” conserva deliberadamente a linguagem concreta do hebraico.
