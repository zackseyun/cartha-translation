  text: מְשַׁוֶּ֥ה רגלי/ו כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּמוֹתַ֖/י יַעֲמִדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: pt
  text: Ele torna os meus pés como os das corças[a] e me firma nas minhas alturas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como os das cervas”; o hebraico usa uma forma feminina para esses animais, imagem de agilidade e passo seguro.
    reason: lexical_alternative
  - marker: b
    text: Ou “me faz ficar de pé nos meus lugares altos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: torna
  rationale: O particípio piel de שׁוה expressa aqui a ideia causativa de fazer algo semelhante a outra coisa; “torna” preserva esse sentido com naturalidade.
- source_word: רגלי/ו
  choice: os meus pés
  rationale: 'Embora a forma consonantal registrada possa ser lida com sufixo de terceira pessoa, a vocalização massorética e o paralelismo com “me” e “minhas” sustentam a leitura em primeira pessoa: “meus pés”.'
- source_word: כָּאַיָּלוֹת
  choice: como os das corças
  rationale: O feminino plural designa corças. A elipse “como os das corças” retoma naturalmente “pés” e conserva a imagem de agilidade e firmeza.
- source_word: בָּמוֹתַי
  choice: nas minhas alturas
  rationale: A expressão significa literalmente “minhas alturas” ou “meus lugares altos”. Neste contexto poético, não precisa ter sentido cultual e evoca terreno elevado, domínio ou segurança.
- source_word: יַעֲמִדֵנִי
  choice: me firma
  rationale: O hifil de עמד significa fazer ficar de pé, estabelecer ou colocar. “Me firma” comunica de modo conciso tanto a ação causativa quanto a estabilidade sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com leitura natural no Brasil e compreensão internacional. Mantém a primeira pessoa indicada pela tradição massorética e pelo contexto imediato, bem como a metáfora das alturas sem lhe impor sentido cultual.
