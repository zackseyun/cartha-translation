  source_fidelity: A tradução preserva com precisão o paralelismo corporal do hebraico («minhas mãos» / «meus braços»), o propósito militar («para a batalha») e o sentido contextual de força para vergar um arco de bronze. «Conseguem vergar» é uma explicitação idiomática aceitável do efeito/da capacidade implicada pela construção hebraica difícil וְנִחַת, sem introduzir conteúdo doutrinário נוסף.
