  text: מְלַמֵּ֥ד יָדַ֖/י לַ/מִּלְחָמָ֑ה וְ/נִחַ֥ת קֶֽשֶׁת נְחוּשָׁ֖ה זְרֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: pt
  text: Ele treina as minhas mãos para a batalha[a], e os meus braços conseguem vergar um arco de bronze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a guerra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e um arco de bronze é vergado pelos meus braços”; a construção hebraica expressa o arco sendo vergado pela força que Deus concede.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: treina
  rationale: O particípio de למד indica ensino ou treinamento; no contexto militar, “treina” comunica preparação prática sem perder o sentido básico.
- source_word: יָדַי
  choice: as minhas mãos
  rationale: Mantém o plural concreto e a imagem corporal do hebraico, em paralelo com “os meus braços”.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מלחמה pode designar guerra ou batalha; aqui, “batalha” é natural após “treina as minhas mãos” e se ajusta ao combate em vista.
- source_word: וְנִחַת
  choice: conseguem vergar
  rationale: A forma hebraica é difícil, mas no contexto expressa o arco sendo vergado pela força concedida ao salmista. A formulação com capacidade é clara e idiomática em português, sem ocultar na nota a alternativa mais formal.
- source_word: קֶשֶׁת
  choice: um arco
  rationale: É o termo comum para a arma; o artigo indefinido é natural em português.
- source_word: נְחוּשָׁה
  choice: de bronze
  rationale: O termo pode referir-se a bronze ou cobre; “de bronze” é a expressão tradicional e idiomática para ressaltar a resistência do arco.
- source_word: זְרֹעֹתַי
  choice: os meus braços
  rationale: Preserva o plural literal, o paralelismo com “mãos” e a imagem da força física.
theological_decisions:
- issue: Ação divina na capacidade militar
  choice: O versículo atribui a Deus o treinamento e a força de Davi para o combate real.
  alternative: Interpretar a linguagem como referência geral ao conflito espiritual dos fiéis.
  rationale: O contexto imediato é um cântico régio de gratidão pela libertação e capacitação em conflitos concretos; a tradução não alegoriza a afirmação nem a transforma em doutrina geral sobre toda guerra.
- issue: Agente e construção de וְנִחַת
  choice: Expressar idiomaticamente a capacidade dos braços de vergar o arco, mantendo a dificuldade sintática em nota.
  alternative: “Um arco de bronze é vergado pelos meus braços.”
  rationale: A construção hebraica é incomum e admite uma representação mais formal, mas o sentido contextual envolve o arco cedendo sob a força dada por Deus. A tradução principal favorece clareza sem apagar a alternativa.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. “Vergar” preserva a imagem física de dobrar um arco resistente; “as minhas mãos” e “os meus braços” mantêm o paralelismo corporal do original.
