  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: pt
  text: Com quem é fiel, tu te mostras fiel; com o guerreiro íntegro, tu te mostras íntegro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: fiel
  rationale: O termo descreve alguém leal e dedicado no âmbito da aliança; “fiel” comunica essa qualidade de modo natural e preserva a correspondência verbal com תִּתְחַסָּד.
- source_word: תִּתְחַסָּד
  choice: tu te mostras fiel
  rationale: A forma reflexiva expressa como Deus se apresenta ou age em correspondência com a pessoa fiel; a formulação evita sugerir que Deus venha a adquirir fidelidade.
- source_word: גִּבּוֹר תָּמִים
  choice: guerreiro íntegro
  rationale: גִּבּוֹר pode designar um homem forte ou valente, especialmente um guerreiro; תָּמִים indica integridade, inteireza ou irrepreensibilidade. A combinação mantém ambos os elementos.
- source_word: תִּתַּמָּם
  choice: tu te mostras íntegro
  rationale: Mantém o paralelismo e o jogo lexical com תָּמִים, descrevendo a integridade demonstrada por Deus sem acrescentar uma interpretação causal.
theological_decisions:
- issue: A correspondência entre a conduta humana e a manifestação divina
  choice: Preservar a construção paralela “com... tu te mostras...”
  alternative: Explicitar que Deus recompensa cada pessoa conforme sua conduta
  rationale: O hebraico afirma a correspondência de modo poético, sem explicar aqui seu mecanismo; uma formulação explicativa resolveria uma tensão que o texto deixa aberta.
- issue: Sentido moral de תָּמִים aplicado ao guerreiro e a Deus
  choice: íntegro
  alternative: irrepreensível ou perfeito
  rationale: “Íntegro” preserva a ideia de inteireza moral sem impor a noção filosófica de perfeição absoluta e funciona naturalmente nos dois membros relacionados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural e paralelismo poético preservado. O pronome “tu” mantém a fala direta a Deus e permite reproduzir com clareza as formas verbais da segunda pessoa.
