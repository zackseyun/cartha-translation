source:
  edition: WLC
  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: pt
  text: 'Yahweh trovejou dos céus,

    e o Altíssimo fez ouvir a sua voz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu a sua voz”; expressão poética paralela a “trovejou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: trovejou
  rationale: O hifil de רעם descreve aqui a produção do trovão. “Trovejou” é natural em português e preserva a imagem meteorológica da manifestação divina.
- source_word: מִן שָׁמַיִם
  choice: dos céus
  rationale: שָׁמַיִם pode designar o céu ou os céus. “Dos céus” conserva a forma plural hebraica e soa natural no contexto poético e teofânico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעֶלְיוֹן
  choice: e o Altíssimo
  rationale: עֶלְיוֹן funciona como título divino e forma um paralelo poético com Yahweh. “O Altíssimo” preserva sua força superlativa e é claro em português.
- source_word: יִתֵּן קוֹלוֹ
  choice: fez ouvir a sua voz
  rationale: A expressão hebraica significa literalmente “deu a sua voz”. A formulação escolhida comunica o sentido idiomático em português sem eliminar a imagem original, registrada na nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o nome próprio divino. “Yahweh” preserva o nome em transliteração, sem substituí-lo por um título.
- issue: Relação entre יְהוָה e עֶלְיוֹן
  choice: Apresentá-los como designações paralelas do mesmo Deus no paralelismo poético
  alternative: Tratar “o Altíssimo” apenas como uma designação aposta, sem salientar a equivalência poética
  rationale: Os dois membros do verso descrevem a mesma ação sonora divina em paralelismo, mas a tradução mantém tanto o nome Yahweh quanto o título “o Altíssimo”, sem fundi-los.
translation_notes:
  register: Português moderno, claro e solene, com disposição poética em dois versos. “Fez ouvir a sua voz” evita um decalque pouco natural, enquanto a nota preserva a formulação literal e o paralelismo hebraico.
