  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: pt
  text: Pois as ondas da morte me cercaram; torrentes de perversidade[a] me aterrorizaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “torrentes de Belial”, se בְלִיַּעַל for entendido como nome próprio; também pode significar “ruína” ou “destruição”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação do que foi afirmado anteriormente, preservando a força causal do hebraico.
- source_word: אֲפָפֻנִי
  choice: me cercaram
  rationale: Expressa de modo natural a ideia de ser rodeado ou envolvido por todos os lados.
- source_word: מִשְׁבְּרֵי
  choice: ondas
  rationale: No contexto poético, designa ondas fortes ou rebentações; “ondas” mantém a imagem aquática com clareza para leitores modernos.
- source_word: מָוֶת
  choice: da morte
  rationale: Tradução direta que preserva a personificação poética da morte como águas ameaçadoras.
- source_word: נַחֲלֵי
  choice: torrentes
  rationale: Comunica cursos de água impetuosos e ameaçadores, em paralelo com as ondas do primeiro segmento.
- source_word: בְלִיַּעַל
  choice: perversidade
  rationale: Aqui é mais provável que seja um substantivo comum referente ao que é vil, perverso ou destrutivo, e não um nome próprio. “Perversidade” soa natural em português e preserva a dimensão moral do termo.
- source_word: יְבַעֲתֻנִי
  choice: me aterrorizaram
  rationale: Reflete a intensidade do verbo hebraico, que indica ser tomado de súbito terror ou pavor.
theological_decisions:
- issue: Se בְלִיַּעַל deve ser entendido como nome próprio (“Belial”) ou substantivo comum
  choice: Traduzido no texto principal como o substantivo comum “perversidade”
  alternative: “Belial” ou “destruição”
  rationale: O paralelismo poético descreve forças ameaçadoras como águas impetuosas, e o termo hebraico pode indicar vileza, perversidade ou ruína. Usar “Belial” como nome próprio poderia introduzir uma personificação demonológica posterior não exigida pelo contexto; a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo e a imagem de águas violentas foram preservados sem recorrer a vocabulário excessivamente técnico ou arcaico.
