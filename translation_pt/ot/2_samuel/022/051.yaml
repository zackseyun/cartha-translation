  text: מגדיל יְשׁוּע֣וֹת מַלְכּ֑/וֹ וְ/עֹֽשֶׂה חֶ֧סֶד לִ/מְשִׁיח֛/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֖/וֹ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: pt
  text: Ele concede grandes livramentos[a] ao seu rei e demonstra amor leal[b] ao seu ungido[c], a Davi e à sua descendência para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “concede grandes vitórias” ou “torna grandes os livramentos” do seu rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “demonstra fidelidade à aliança”. O termo hebraico expressa amor constante, lealdade e fidelidade aos compromissos assumidos.
    reason: lexical_alternative
  - marker: c
    text: “Seu ungido” também pode ser traduzido por “seu Messias”. Aqui se refere primeiramente a Davi e ao rei da linhagem de Davi, podendo também evocar a promessa messiânica mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: concede grandes livramentos
  rationale: O particípio hifil de גדל tem sentido causativo, “torna grandes” ou “multiplica”, e o plural יְשׁוּעוֹת designa atos de livramento ou vitórias. “Concede grandes livramentos” preserva o plural e expressa o auxílio salvador de Deus em português natural.
- source_word: מַלְכּוֹ
  choice: ao seu rei
  rationale: Reproduz diretamente o substantivo com sufixo de terceira pessoa masculina singular e mantém a relação entre o SENHOR e o rei davídico.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: e demonstra amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso relacional. “Amor leal” é claro, digno e não explicita além do texto a noção de aliança, embora ela esteja presente no contexto.
- source_word: לִמְשִׁיחוֹ
  choice: ao seu ungido
  rationale: מָשִׁיחַ significa literalmente alguém ungido. Aqui se refere de modo imediato a Davi e ao rei davídico, preservando ao mesmo tempo a ressonância messiânica sem transformá-la explicitamente em título no texto principal.
- source_word: לְדָוִד
  choice: a Davi
  rationale: Mantém o nome próprio em sua forma portuguesa consagrada.
- source_word: וּלְזַרְעוֹ
  choice: e à sua descendência
  rationale: זֶרַע é um singular coletivo que pode indicar a linhagem ou os descendentes. “Descendência” conserva essa coletividade e a ressonância dinástica em português corrente.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa natural para a duração indefinida e permanente indicada pela locução hebraica.
theological_decisions:
- issue: Tradução de חֶסֶד no contexto da aliança davídica
  choice: amor leal
  alternative: fidelidade à aliança
  rationale: “Amor leal” preserva a amplitude relacional de חֶסֶד e evita inserir a palavra “aliança”, ausente no verso, embora a nota registre legitimamente essa dimensão contextual.
- issue: Tradução de מְשִׁיחוֹ
  choice: seu ungido
  alternative: seu Messias
  rationale: O referente histórico imediato é Davi, o rei ungido. “Ungido” mantém o sentido lexical e a tensão entre o contexto davídico original e a trajetória messiânica mais ampla.
- issue: Alcance de זַרְעוֹ
  choice: sua descendência
  alternative: sua semente
  rationale: “Descendência” comunica naturalmente o coletivo dinástico sem decidir se a promessa deve ser entendida apenas de forma coletiva ou se também possui uma culminação individual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível. O paralelismo hebraico é mantido, e as notas preservam as alternativas lexicais e a tensão davídico-messiânica.
