lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Ele me livrou
  rationale: O hifil de נצל expressa resgate ou libertação. O pretérito perfeito acompanha naturalmente o contexto poético retrospectivo do cântico.
- source_word: אֹיְבִי עָז
  choice: meu inimigo poderoso
  rationale: Preserva o singular do hebraico e traduz עָז como força ou poder, sem identificar especificamente o inimigo.
- source_word: מִשֹּׂנְאַי
  choice: dos que me odiavam
  rationale: Reproduz o particípio plural substantivado, mantendo a mudança do inimigo singular para os adversários no plural.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: pois eram fortes demais para mim
  rationale: Expressa em português corrente a comparação hebraica segundo a qual os adversários prevaleciam em força sobre o salmista.
theological_decisions:
- issue: Identidade do inimigo singular
  choice: Manter a referência genérica como “meu inimigo”
  alternative: Interpretá-lo como Saul, um adversário coletivo ou uma figura espiritual
  rationale: O versículo não identifica o inimigo; a tradução preserva essa abertura interpretativa.
