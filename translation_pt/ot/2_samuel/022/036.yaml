  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: pt
  text: Tu me deste o escudo da tua salvação, e a tua mansidão[a] me engrandeceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua humildade” ou “tua condescendência”. A expressão hebraica é difícil e pode referir-se ao fato de Deus se abaixar graciosamente para exaltar aquele que fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Tu me deste
  rationale: O qal wayyiqtol de נתן expressa uma ação passada simples dirigida a Deus. “Tu me deste” é natural e mantém explícito o sujeito da segunda pessoa.
- source_word: לִי
  choice: me
  rationale: O objeto indireto é expresso naturalmente em português pelo pronome átono em “me deste”.
- source_word: מָגֵן
  choice: escudo
  rationale: Preserva a imagem militar concreta, sem reduzi-la à ideia abstrata de proteção.
- source_word: יִשְׁעֶךָ
  choice: tua salvação
  rationale: Mantém a construção possessiva e o alcance de ישׁע como resgate ou livramento concedido por Deus.
- source_word: וַעֲנֹתְךָ
  choice: tua humildade
  rationale: A forma hebraica é difícil. “Humildade” preserva a imagem teologicamente surpreendente de Deus se abaixando graciosamente em favor do servo, sem eliminar a ambiguidade lexical.
- source_word: תַּרְבֵּנִי
  choice: me engrandeceu
  rationale: 'O hifil de רבה tem sentido causativo: tornar grande, aumentar ou exaltar. “Me engrandeceu” comunica de modo conciso a elevação do orador.'
theological_decisions:
- issue: O sentido de וַעֲנֹתְךָ quando aplicado a Deus
  choice: tua humildade
  alternative: tua mansidão; tua condescendência; tua ajuda
  rationale: A leitura escolhida conserva a tensão do texto, que atribui a Deus uma disposição de se abaixar para elevar o orador. Como o hebraico admite outras compreensões, elas são registradas em nota, sem impor uma resolução denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O uso de “Tu me deste” evita tanto a rigidez de “Deste-me” quanto uma paráfrase excessiva. A nota foi colocada junto de “humildade”, a expressão hebraica a que efetivamente se refere.
