base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: pt
  text: Pois tu és a minha lâmpada[a], Yahweh, e Yahweh ilumina as minhas trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha luz”. O hebraico diz literalmente “minha lâmpada”, preservando uma imagem concreta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a força explicativa ou causal do conector hebraico sem definir em excesso sua relação com o contexto anterior.
- source_word: אַתָּה
  choice: tu
  rationale: Preserva a segunda pessoa singular da oração dirigida diretamente a Deus; é uma forma corrente e digna em amplo uso no português bíblico.
- source_word: נֵירִי
  choice: a minha lâmpada
  rationale: Conserva a imagem concreta de נֵיר, uma lâmpada, em vez de substituí-la pela ideia abstrata de luz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַגִּיהַּ
  choice: ilumina
  rationale: 'Expressa naturalmente o sentido causativo do hifil de נגה: fazer brilhar ou dar luz.'
- source_word: חָשְׁכִּי
  choice: as minhas trevas
  rationale: Mantém a imagem poética e pessoal do hebraico, sem especificar se as trevas representam perigo, sofrimento ou aflição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega duas vezes o nome divino; sua transliteração preserva o caráter de nome próprio e a repetição poética do hebraico.
- issue: Sentido metafórico de “minhas trevas”
  choice: Preservar a metáfora sem explicação no corpo do versículo
  alternative: Explicitar como aflição, perigo ou sofrimento
  rationale: O hebraico não identifica uma única realidade figurada, e a tradução deve conservar essa abertura sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural para brasileiros e compreensão ampla no espaço lusófono. A repetição de “Yahweh” e as imagens concretas do hebraico foram preservadas.
