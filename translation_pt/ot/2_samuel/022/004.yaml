  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: pt
  text: Invoco Yahweh, que é digno de louvor,[a] e sou salvo dos meus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que é louvado” ou “que deve ser louvado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: que é digno de louvor
  rationale: O particípio passivo de הלל caracteriza Yahweh como aquele que deve ser louvado. A formulação é natural em português e preserva a força predicativa do hebraico.
- source_word: אֶקְרָא
  choice: Invoco
  rationale: קרא com o nome divino significa chamar por Deus ou invocá-lo. “Invoco” expressa de modo conciso e digno o sentido de oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמֵאֹיְבַי
  choice: e ... dos meus inimigos
  rationale: Reproduz a coordenação com a oração anterior e a origem da qual vem o livramento, sem acrescentar a expressão “das mãos”, ausente do hebraico.
- source_word: אִוָּשֵׁעַ
  choice: sou salvo
  rationale: O nifal imperfeito de ישׁע admite o sentido de ser salvo ou liberto. O presente comunica naturalmente o valor habitual ou proverbial do enunciado poético, sem eliminar a possível nuance temporal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o nome pessoal divino. “Yahweh” preserva esse nome em transliteração, sem substituí-lo por um título.
- issue: Valor temporal de אִוָּשֵׁעַ
  choice: sou salvo
  alternative: serei salvo
  rationale: No paralelismo poético, o imperfeito pode descrever uma experiência habitual ou recorrente. O presente é natural nesse contexto, embora o futuro também seja gramaticalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Invoco” evita a construção menos precisa “chamo Yahweh”, e “digno de louvor” transmite de forma idiomática o particípio hebraico.
