  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: pt
  text: Por isso, eu te louvarei entre as nações, ó Yahweh, e cantarei louvores ao teu nome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão decorrente dos livramentos narrados anteriormente.
- source_word: אוֹדְךָ
  choice: eu te louvarei
  rationale: O hifil de ידה pode significar agradecer ou louvar; no paralelismo com אֲזַמֵּר, “louvar” comunica bem o contexto de exaltação, sem excluir a nuance de gratidão.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém no texto o nome divino representado pelo Tetragrama e reproduz o vocativo do verso.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Traduz o sentido amplo de povos ou nações, especialmente os não israelitas, sem introduzir associações posteriores ligadas a “gentios”.
- source_word: וּלְשִׁמְךָ
  choice: ao teu nome
  rationale: Preserva a referência ao nome como expressão da identidade e reputação reveladas de Deus.
- source_word: אֲזַמֵּר
  choice: cantarei louvores
  rationale: O piel de זמר indica cantar ou fazer música em louvor; a formulação é natural em português e mantém o paralelismo poético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. A transliteração preserva o nome pessoal, em vez de substituí-lo por um título.
- issue: Nuance de ידה
  choice: louvarei
  alternative: darei graças
  rationale: As duas nuances são lexicalmente possíveis. “Louvarei” harmoniza com o segundo membro do paralelismo, enquanto o contexto de livramento ainda permite perceber a dimensão de gratidão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva o paralelismo hebraico e o vocativo poético sem arcaísmos desnecessários.
