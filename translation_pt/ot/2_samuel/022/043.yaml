base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: pt
  text: Eu os reduzi a pó, como o pó da terra; como a lama das ruas, eu os esmaguei e os calquei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os achatei” ou “os estendi”. O verbo hebraico pode descrever o ato de bater ou comprimir algo até deixá-lo plano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Eu os reduzi a pó
  rationale: O Qal de שׁחק com sufixo de terceira pessoa plural expressa triturar ou pulverizar. “Reduzi a pó” soa natural em português, preserva a força violenta e se liga claramente à comparação seguinte.
- source_word: כַּעֲפַר אָרֶץ
  choice: como o pó da terra
  rationale: עָפָר designa pó ou terra solta, e אֶרֶץ pode significar terra ou chão. A formulação conserva a construção hebraica e é clara e digna em português.
- source_word: כְּטִיט חוּצוֹת
  choice: como a lama das ruas
  rationale: טִיט significa lama ou lodo, enquanto חוּצוֹת, neste contexto, se refere às ruas ou espaços públicos. “Lama das ruas” comunica a imagem de modo direto.
- source_word: אֲדִקֵּם
  choice: eu os esmaguei
  rationale: O Hifil de דקק indica tornar fino, esmagar ou triturar. “Esmaguei” mantém a intensidade e evita repetir literalmente “reduzi a pó”.
- source_word: אֶרְקָעֵם
  choice: os calquei
  rationale: רקע pode denotar bater, achatar ou estender. No contexto bélico e em paralelo com a lama das ruas, “calquei” expressa pisar e comprimir sem excluir totalmente a ideia de achatar; a alternativa lexical é indicada em nota.
