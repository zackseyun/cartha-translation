  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: pt
  text: E Yahweh me retribuiu conforme a minha justiça, conforme a minha pureza diante dos seus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a minha limpeza, à sua vista”. O termo hebraico denota limpeza ou pureza; “diante dos seus olhos” significa “à sua vista”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: retribuiu
  rationale: O verbo שוב nesta construção com Yahweh como sujeito e לִי como objeto indireto expressa retribuição. “Retribuiu” preserva a possibilidade de recompensa ou paga segundo a conduta, sem limitar o sentido ao aspecto positivo de “recompensou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי
  choice: me
  rationale: Em português, o pronome átono expressa naturalmente o objeto indireto com “retribuir”.
- source_word: כְּצִדְקָתִי
  choice: conforme a minha justiça
  rationale: צדקה denota justiça, retidão ou conformidade com o que é correto. “Justiça” conserva a formulação tradicional e a amplitude moral e judicial do termo; “conforme” representa o כְּ comparativo.
- source_word: כְּבֹרִי
  choice: conforme a minha pureza
  rationale: בֹּר denota limpeza ou pureza. “Pureza” é mais natural em português neste contexto moral e não acrescenta “das mãos”, expressão ausente deste versículo.
- source_word: לְנֶגֶד עֵינָיו
  choice: diante dos seus olhos
  rationale: Preserva a imagem concreta do hebraico, cujo sentido idiomático é “à sua vista” ou “aos seus olhos”.
theological_decisions:
- issue: A declaração de justiça e pureza feita por Davi
  choice: Manter a afirmação direta em primeira pessoa, sem atenuação nem qualificação doutrinária.
  alternative: Explicá-la como fidelidade relativa à aliança, ou reformulá-la para evitar tensão com os pecados conhecidos de Davi.
  rationale: O hebraico declara de modo direto que Yahweh retribuiu Davi conforme sua justiça e pureza. A tradução conserva essa tensão, sem decidir no texto se a afirmação se refere à integridade pactual, à vindicação numa questão específica ou à ausência absoluta de pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima do hebraico sem rigidez excessiva. A conjunção inicial foi mantida como “E”; o paralelismo de “conforme” foi preservado.
