source:
  edition: WLC
  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: pt
  text: 'meu Deus, minha rocha[a], em quem me refugio,

    meu escudo e o chifre da minha salvação[b],

    minha fortaleza e meu refúgio,

    meu salvador[c] — tu me salvas da violência.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Deus da minha rocha»; a construção hebraica pode ser traduzida mais literalmente assim, mas «meu Deus, minha rocha» se ajusta melhor à sequência poética de títulos.
    reason: lexical_alternative
  - marker: b
    text: O «chifre» é uma imagem hebraica de força e poder vitorioso.
    reason: cultural_note
  - marker: c
    text: Ou «meu libertador».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: meu Deus, minha rocha
  rationale: A forma construta permite a tradução mais literal «Deus da minha rocha», mas, nesta sequência poética de títulos divinos, a aposição comunica com naturalidade o sentido provável sem ocultar a alternativa.
- source_word: אֶחֱסֶה בוֹ
  choice: em quem me refugio
  rationale: Preserva o sentido de buscar proteção e integra naturalmente a oração relativa à cadeia de imagens poéticas.
- source_word: מָגִנִּי
  choice: meu escudo
  rationale: Mantém a metáfora concreta e direta de proteção.
- source_word: קֶרֶן יִשְׁעִי
  choice: o chifre da minha salvação
  rationale: Reproduz a expressão hebraica e conserva a imagem do chifre como símbolo de força e poder vitorioso, explicada em nota por não ser transparente em português moderno.
- source_word: מִשְׂגַּבִּי
  choice: minha fortaleza
  rationale: Expressa um lugar elevado, seguro e defensável em linguagem portuguesa corrente.
- source_word: וּמְנוּסִי
  choice: meu refúgio
  rationale: Comunica de modo conciso o lugar para onde alguém foge em busca de segurança.
- source_word: מֹשִׁעִי
  choice: meu salvador
  rationale: Traduz diretamente o particípio que designa aquele que salva, mantendo sua ligação verbal com «tu me salvas».
- source_word: מֵחָמָס
  choice: da violência
  rationale: Preserva o substantivo abstrato hebraico sem introduzir agentes violentos não expressos no texto.
- source_word: תֹּשִׁיעֵנִי
  choice: tu me salvas
  rationale: Mantém o discurso direto a Deus e apresenta sua ação salvadora com valor atual e habitual, sem especificar além do necessário o aspecto do imperfeito hebraico.
theological_decisions:
- issue: Sequência de títulos e metáforas aplicados a Deus
  choice: Conservar as imagens concretas «rocha», «escudo», «chifre», «fortaleza» e «refúgio».
  alternative: Substituí-las por explicações abstratas, como «protetor» ou «fonte de força».
  rationale: As metáforas formam a textura poética e teológica do versículo; explicá-las no corpo do texto reduziria sua força e acrescentaria interpretação.
- issue: Sentido de מֹשִׁעִי
  choice: meu salvador
  alternative: meu libertador
  rationale: «Salvador» é lexicalmente fiel e corresponde ao verbo seguinte, sem exigir que o texto seja lido à luz de formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em versos destaca o paralelismo e a acumulação poética. Mantiveram-se as metáforas hebraicas, com nota apenas onde a imagem pode não ser imediatamente clara ao leitor atual.
