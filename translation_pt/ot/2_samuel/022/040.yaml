base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: pt
  text: Tu me equipaste com força para a batalha[a]; fizeste os que se levantavam contra mim se curvarem debaixo de mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu me cingiste de força para a batalha”. O verbo hebraico traz a imagem de cingir ou preparar alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “subjugaste debaixo de mim os meus adversários”. O verbo hebraico pode descrever o ato de obrigar alguém a dobrar os joelhos ou a se curvar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: tu me equipaste
  rationale: O verbo אזר evoca cingir alguém e, por extensão, prepará-lo ou equipá-lo. “Equipaste” comunica naturalmente a preparação recebida para o combate, enquanto a imagem mais formal é preservada em nota.
- source_word: חַיִל
  choice: com força
  rationale: חַיִל pode indicar força, poder, valentia ou capacidade militar. Neste contexto, designa a força com que o salmista é capacitado para lutar.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מִלְחָמָה pode significar guerra ou batalha. “Para a batalha” é idiomático e se ajusta ao contexto imediato de combate.
- source_word: תַּכְרִיעַ
  choice: fizeste ... se curvarem
  rationale: O hifil de כרע expressa fazer alguém dobrar-se, ajoelhar-se ou curvar-se. A formulação conserva tanto a causatividade quanto a imagem corporal do hebraico.
- source_word: קָמַי
  choice: os que se levantavam contra mim
  rationale: A expressão deriva de קום e designa os que se erguem hostilmente contra o falante. A tradução preserva essa imagem em vez de reduzi-la simplesmente a “adversários”.
- source_word: תַּחְתֵּנִי
  choice: debaixo de mim
  rationale: A expressão significa literalmente “sob/debaixo de mim” e retrata os inimigos subjugados sob o salmista.
