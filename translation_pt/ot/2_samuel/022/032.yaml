  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: pt
  text: Pois quem é Deus além de Yahweh? E quem é uma rocha além do nosso Deus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem é a Rocha além do nosso Deus?” No hebraico, “rocha” é uma metáfora frequente e às vezes funciona quase como um título para Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração anterior e preserva com naturalidade a ligação argumentativa.
- source_word: מִי
  choice: quem
  rationale: Pronome interrogativo empregado em perguntas retóricas; a tradução direta conserva a força poética.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto de exclusividade, refere-se ao verdadeiro Deus, e não apenas a uma divindade genérica.
- source_word: מִבַּלְעֲדֵי
  choice: além de
  rationale: 'Expressa exclusão: não há Deus nem rocha fora de Yahweh, o Deus de Israel.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- source_word: וּמִי
  choice: E quem
  rationale: Mantém a conjunção e o paralelismo entre as duas perguntas retóricas.
- source_word: צוּר
  choice: rocha
  rationale: Preserva a metáfora hebraica de estabilidade, força e proteção; a ausência de artigo em português produz uma formulação predicativa natural e próxima do hebraico.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Conserva tanto o sufixo da primeira pessoa do plural quanto a dimensão comunitária da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o nome divino; “Yahweh” procura preservá-lo como nome pessoal em vez de substituí-lo por um título.
- issue: Se צוּר deve ser entendido como título ou metáfora comum
  choice: rocha
  alternative: Rocha
  rationale: A construção predicativa favorece o substantivo comum metafórico, sem eliminar a possibilidade de que seu uso frequente para Deus lhe confira valor quase titular.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Pois” mantém a conexão com o contexto; “além de” expressa a exclusividade das duas perguntas. A repetição de “Deus” e a metáfora “rocha” foram mantidas por fidelidade ao hebraico.
