base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: pt
  text: Das suas narinas subiu fumaça[a], e da sua boca saiu fogo devorador; brasas arderam, vindas dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do seu nariz”; a palavra hebraica para “nariz/narina” também pode ter o sentido idiomático de “ira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: subiu fumaça
  rationale: Preserva o movimento ascendente expresso pelo verbo e a imagem concreta da fumaça, em formulação poética natural em português.
- source_word: בְּאַפּוֹ
  choice: das suas narinas
  rationale: Embora אַף também possa significar idiomaticamente “ira”, o paralelismo com “da sua boca” favorece aqui a imagem corporal concreta; a preposição é vertida segundo a ideia de procedência.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: e da sua boca saiu fogo devorador
  rationale: “Fogo devorador” conserva a ação verbal de consumir; “saiu” explicita de modo natural em português o movimento de procedência já indicado por מִן, sem alterar a imagem.
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: brasas arderam
  rationale: Tradução direta que mantém a imagem vívida das brasas em combustão, sem acrescentar “acesas” ao substantivo.
- source_word: מִמֶּנּוּ
  choice: vindas dele
  rationale: Mantém o sentido mais provável de origem ou procedência e evita que “dele” pareça modificar apenas o verbo de forma pouco natural.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus na teofania
  choice: Manter literalmente as imagens de “narinas”, “boca”, fumaça e fogo procedentes dele.
  alternative: Interpretar אַף de maneira abstrata como “ira” e suavizar a imagem corporal.
  rationale: A poesia retrata a ira e o poder divinos por imagens antropomórficas. Preservá-las conserva o paralelismo hebraico e sua força teológica, sem resolver a tensão por meio de paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A ordem “Das suas narinas subiu fumaça” preserva a ênfase inicial na origem da fumaça. “Fogo devorador” reproduz de forma natural o valor ativo do verbo hebraico.
