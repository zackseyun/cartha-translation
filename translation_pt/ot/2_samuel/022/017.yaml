  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: pt
  text: Do alto, ele estendeu a mão[a] e me tomou; tirou-me de muitas águas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “enviou do alto”; também pode ser entendido como “estendeu do alto”. A palavra “mão” está subentendida na tradução.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de águas caudalosas” ou “de águas poderosas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: estendeu a mão
  rationale: O verbo significa literalmente “enviar” e também pode descrever o ato de estender algo. Como o hebraico não expressa o objeto e a ação seguinte é “tomou-me”, a formulação explicita com naturalidade a mão subentendida na imagem de resgate, sem substituir a metáfora por uma explicação.
- source_word: מִמָּרוֹם
  choice: Do alto
  rationale: Preserva a linguagem espacial e poética de מָרוֹם sem especificar “céu”, termo mais definido do que o hebraico.
- source_word: יִקָּחֵנִי
  choice: me tomou
  rationale: Mantém o sentido básico de לקח, “tomar”, e deixa que o verbo seguinte complete a imagem do resgate.
- source_word: יַמְשֵׁנִי
  choice: tirou-me
  rationale: No hifil, משה indica tirar ou puxar para fora, especialmente da água. “Tirou-me” é claro, natural e fiel à imagem.
- source_word: מִמַּיִם רַבִּים
  choice: de muitas águas
  rationale: Tradução direta que conserva a imagem poética e a noção primária de abundância expressa por רַבִּים.
theological_decisions:
- issue: Imagem do resgate divino vindo do alto
  choice: Do alto
  alternative: Do céu
  rationale: A tradução mantém a transcendência e a intervenção divina sugeridas pelo texto sem tornar a referência cosmológica mais explícita do que o hebraico.
- issue: Agente ou meio subentendido no primeiro verbo
  choice: estendeu a mão
  alternative: enviou do alto
  rationale: O hebraico permite conservar a elipse com “enviou”, mas isso soa incompleto em português. A mão é apresentada como elemento subentendido, não como afirmação independente, e a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, poético e acessível. A ordem “Do alto” preserva a ênfase espacial do hebraico; os verbos no passado são naturais para a narrativa poética em português, embora a forma hebraica seja prefixal. A colocação pronominal mantém dignidade literária sem comprometer a compreensão brasileira.
