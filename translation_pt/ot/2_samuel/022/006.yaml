  text: חֶבְלֵ֥י שְׁא֖וֹל סַבֻּ֑/נִי קִדְּמֻ֖/נִי מֹֽקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: pt
  text: As cordas do Sheol me cercaram; as armadilhas da morte vieram ao meu encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me confrontaram” ou “vieram contra mim”.
    reason: alternativa lexical
lexical_decisions:
- source_word: חֶבְלֵי
  choice: cordas de
  rationale: Preserva a imagem poética de cordas que prendem ou enredam e mantém o paralelismo com as armadilhas do segundo verso.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo apenas à sepultura nem defini-lo de modo excessivamente interpretativo.
- source_word: סַבֻּנִי
  choice: me cercaram
  rationale: Tradução direta e natural de סבב, com o sentido de rodear ou circundar.
- source_word: קִדְּמֻנִי
  choice: vieram ao meu encontro
  rationale: Expressa o sentido de קדם neste contexto — encontrar, vir ao encontro ou apresentar-se diante de alguém — sem impor necessariamente a nuance mais interpretativa de confronto.
- source_word: מֹקְשֵׁי
  choice: as armadilhas de
  rationale: Equivalente corrente e vívido para laços ou dispositivos que capturam; evita a possível ambiguidade de 'laços' em português moderno.
- source_word: מָוֶת
  choice: morte
  rationale: Correspondência direta ao substantivo hebraico, adequada ao paralelismo poético.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o domínio dos mortos
  rationale: A transliteração preserva o referente hebraico e a tensão entre sepultura, morte e domínio dos mortos, sem escolher prematuramente uma interpretação.
- issue: Nuance de קִדְּמֻנִי
  choice: vieram ao meu encontro
  alternative: me confrontaram; vieram contra mim
  rationale: A escolha mantém a ambiguidade lexical do verbo entre encontrar e vir diante de alguém; o caráter ameaçador já é comunicado por 'armadilhas da morte'.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética concisa. 'Sheol' é mantido como termo transliterado. A nota lexical é marcada no texto imediatamente após a expressão relevante.
