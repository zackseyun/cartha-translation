base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: pt
  text: Na minha angústia, clamo a Yahweh; clamo ao meu Deus. Do seu templo[a], ele ouviu a minha voz, e o meu grito de socorro chegou aos seus ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Templo” também pode ser traduzido como “palácio” ou “santuário”; no contexto, pode referir-se à morada celestial de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Na minha angústia
  rationale: A expressão descreve uma situação pessoal de aflição ou adversidade. “Na minha angústia” é natural em português e mantém a intensidade sem ampliá-la indevidamente.
- source_word: אֶקְרָא ... אֶקְרָא
  choice: clamei ... clamei
  rationale: קרא significa chamar ou clamar. A repetição foi preservada, e o pretérito enquadra os verbos no testemunho retrospectivo do cântico, em harmonia com o verbo narrativo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Tradução direta da forma singular com sufixo possessivo de primeira pessoa.
- source_word: וַיִּשְׁמַע
  choice: ele ouviu
  rationale: O wayyiqtol tem valor narrativo passado; “ele ouviu” representa diretamente essa forma e se integra ao relato retrospectivo.
- source_word: מֵהֵיכָלוֹ
  choice: Do seu templo
  rationale: הֵיכָל pode designar templo, palácio ou santuário. “Templo” preserva a associação habitual com a morada divina, enquanto a nota registra a amplitude lexical.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Tradução direta e idiomática de קוֹל com o sufixo de primeira pessoa.
- source_word: שַׁוְעָתִי
  choice: o meu grito de socorro
  rationale: שַׁוְעָה é um clamor que pede auxílio; “grito de socorro” explicita naturalmente essa força em português.
- source_word: בְּאָזְנָיו
  choice: chegou aos seus ouvidos
  rationale: A expressão literal “em seus ouvidos” comunica que o clamor foi ouvido. A formulação portuguesa conserva a imagem corporal de modo idiomático.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o translitera sem substituí-lo por um título.
- issue: Sentido de הֵיכָל como morada divina
  choice: templo
  alternative: palácio ou santuário
  rationale: “Templo” preserva a ressonância cultual comum, mas o termo também pode apresentar Deus como rei em seu palácio celestial; a nota mantém essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição poética de “clamei” e a imagem de o grito chegar aos ouvidos de Deus foram preservadas.
