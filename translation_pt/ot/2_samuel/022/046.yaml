  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: pt
  text: Os estrangeiros perdem a coragem e saem tremendo de suas fortalezas[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Os estrangeiros definham». O verbo hebraico pode denotar mais literalmente murchar ou desvanecer.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é difícil neste trecho; outras possibilidades são «saem encolhidos», «saem mancando» ou, mais literalmente, «cingem-se».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «de suas fortificações»; menos provavelmente, «de suas prisões» ou «de seus recintos fechados».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: os estrangeiros
  rationale: A expressão construta, literalmente «filhos do estrangeiro/da estrangeiridade», funciona como um modo idiomático de designar povos estrangeiros. «Os estrangeiros» é natural e preserva o sentido coletivo.
- source_word: יִבֹּלוּ
  choice: perdem a coragem
  rationale: O verbo נבל normalmente significa «murchar» ou «desvanecer». Neste contexto poético e militar, retrata a perda de vigor e ânimo; «perdem a coragem» comunica esse efeito sem excluir em nota a imagem mais literal.
- source_word: וְיַחְגְּרוּ
  choice: saem tremendo
  rationale: A forma é difícil. Embora חגר costume significar «cingir-se», neste contexto tem sido entendida como a saída amedrontada ou vacilante dos inimigos subjugados. «Saem tremendo» se ajusta ao paralelismo e ao cenário, enquanto as possibilidades concorrentes ficam registradas em nota.
- source_word: מִמִּסְגְּרוֹתָם
  choice: de suas fortalezas
  rationale: מִסְגְּרוֹת designa lugares fechados ou cercados. No contexto de uma canção de vitória militar, «fortalezas» exprime naturalmente os locais defensivos dos quais os inimigos saem, sem ocultar em nota os demais sentidos possíveis.
