base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: pt
  text: o Deus que me concede vingança e faz povos descerem para debaixo de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: o Deus
  rationale: Mantém o artigo e o título divino do hebraico.
- source_word: הַנֹּתֵן נְקָמוֹת לִי
  choice: que me concede vingança
  rationale: O verbo indica dar/conceder, e לִי apresenta Davi como destinatário. “Vingança”, no singular em português, expressa naturalmente o plural hebraico abstrato נְקָמוֹת sem transformar a frase em “vinga-me” ou “vinga por mim”.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: e faz povos descerem para debaixo de mim
  rationale: Preserva tanto o movimento descendente de מוֹרִיד como a imagem de sujeição em תַּחְתֵּנִי, evitando substituir a metáfora por uma interpretação apenas abstrata.
theological_decisions:
- issue: Agente e destinatário da vingança
  choice: Deus concede vingança a Davi
  alternative: Deus executa vingança em favor de Davi
  rationale: A construção נְקָמוֹת לִי diz literalmente que as vinganças são dadas “a mim”; a tradução conserva essa relação sem definir além do texto como Davi participa de sua execução.
- issue: Domínio sobre os povos
  choice: Manter a imagem de povos levados para baixo de Davi
  alternative: “submete povos a mim”
  rationale: A alternativa comunica corretamente a sujeição, mas omite o movimento expresso pelo particípio מוֹרִיד; a formulação escolhida preserva a força poética e a tensão régia do original.
translation_notes:
  register: Português moderno, claro e solene. “Concede vingança” é idiomático e mantém o valor de dádiva; “faz povos descerem para debaixo de mim” é deliberadamente mais imagético para refletir de perto a poesia hebraica.
