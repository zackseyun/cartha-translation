  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: pt
  text: Davi falou a Yahweh as palavras deste cântico, no dia em que Yahweh o livrou da mão de todos os seus inimigos e da mão de Saul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: dirigiu
  rationale: O verbo significa literalmente “falou”. Em português, “dirigiu a Yahweh as palavras” preserva o ato de fala e soa mais natural do que “falou a Yahweh as palavras”, sem substituí-lo por “cantou”.
- source_word: לַיהוָה / יְהוָה
  choice: a Yahweh / Yahweh
  rationale: Reproduz o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: as palavras deste cântico
  rationale: Preserva tanto דִּבְרֵי, “palavras”, quanto שִׁירָה, “cântico”, sem reduzir a expressão apenas a “este cântico”.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Mantém a formulação temporal hebraica com linguagem portuguesa clara e natural.
- source_word: הִצִּיל
  choice: livrou
  rationale: Expressa o resgate de uma situação de domínio ou perigo hostil e se ajusta naturalmente à construção “livrar das mãos”.
- source_word: מִכַּף
  choice: das mãos de
  rationale: Conserva a metáfora hebraica da mão como poder ou domínio. O plural idiomático em português evita uma formulação excessivamente rígida, embora o hebraico use o singular coletivo.
- source_word: כָּל אֹיְבָיו
  choice: todos os seus inimigos
  rationale: Tradução direta e natural da expressão coletiva.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o caráter de nome próprio sem convertê-lo em título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A formulação conserva a introdução explícita da composição como cântico e mantém a metáfora bíblica das mãos como poder hostil.
