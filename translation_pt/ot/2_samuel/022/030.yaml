  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: pt
  text: Pois contigo[a] corro contra uma tropa[b]; com o meu Deus salto por cima de uma muralha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por ti” ou “por meio de ti”; a preposição hebraica pode indicar companhia ou meio.
    reason: lexical_alternative
  - marker: b
    text: Ou “um bando de saqueadores”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um muro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do louvor anterior e preserva de modo natural a ligação poética.
- source_word: בְכָה
  choice: contigo
  rationale: A preposição בְּ pode indicar companhia ou meio. “Contigo” é natural em português e mantém aberta essa amplitude, sem deixar de sugerir que Deus torna a ação possível.
- source_word: אָרוּץ
  choice: avanço
  rationale: O Qal imperfeito de רוץ significa literalmente correr; diante de uma tropa, “avanço contra” comunica com naturalidade a investida militar, sem explicitar além do necessário uma modalidade de capacidade.
- source_word: גְּדוּד
  choice: uma tropa
  rationale: גְּדוּד designa tropa, bando armado ou grupo de incursão. “Tropa” é claro, atual e adequado ao contexto militar.
- source_word: בֵּאלֹהַי
  choice: com o meu Deus
  rationale: Preserva o paralelismo com “contigo”, a relação pessoal expressa por “meu Deus” e a possível nuance tanto de companhia quanto de meio.
- source_word: אֲדַלֶּג
  choice: salto por cima de
  rationale: O Piel imperfeito de דלג descreve saltar ou transpor com um salto. A formulação é corrente e conserva a imagem vigorosa.
- source_word: שׁוּר
  choice: uma muralha
  rationale: שׁוּר indica um muro, especialmente uma estrutura defensiva. “Muralha” torna claro o cenário fortificado e a escala do feito.
theological_decisions:
- issue: A atuação divina nas imagens militares
  choice: Manter “contigo” e “com o meu Deus”, apresentando a ação como realizada na presença e pelo auxílio de Deus.
  alternative: 'Explicitar a capacidade concedida por Deus: “por ti posso avançar... por meu Deus posso saltar”.'
  rationale: A preposição hebraica permite companhia ou meio, e os imperfeitos podem retratar ação ou capacidade. A tradução conserva essa tensão sem transformar a imagem poética numa formulação doutrinária mais explícita do que o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético. “Avanço contra” evita a possível impressão de simplesmente correr ao lado da tropa; “muralha” comunica naturalmente uma fortificação. As notas preservam as alternativas relevantes do hebraico.
