  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: pt
  text: Tu me livraste das contendas do meu povo[a]; tu me preservaste como cabeça de nações[b]; um povo que eu não conhecia me serviu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos conflitos do meu povo”. O hebraico pode se referir a contendas internas entre o próprio povo de Davi ou a conflitos que envolviam esse povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “tu me guardaste como chefe sobre nações”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um povo que eu não conhecia me servirá”. O imperfeito hebraico pode ter nuance futura neste contexto poético.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Tu me livraste
  rationale: O hifil de פלט expressa fazer escapar ou livrar. “Livraste” é natural no registro poético e atribui claramente a ação salvadora a Deus.
- source_word: מֵרִיבֵי עַמִּי
  choice: das contendas do meu povo
  rationale: רִיב pode indicar contenda, disputa ou conflito. A formulação preserva a amplitude do genitivo, que pode apontar para conflitos internos do povo de Davi ou conflitos que o envolviam.
- source_word: תִּשְׁמְרֵנִי
  choice: tu me preservaste
  rationale: שׁמר pode significar guardar, conservar ou preservar. Aqui, “preservaste” comunica a sustentação divina de Davi em sua posição régia.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: como cabeça de nações
  rationale: רֹאשׁ funciona metaforicamente como chefe ou governante, e לְ indica função ou condição resultante. A tradução mantém a metáfora hebraica.
- source_word: עַם לֹא יָדַעְתִּי
  choice: um povo que eu não conhecia
  rationale: O substantivo coletivo singular é mantido, e ידע denota aqui conhecimento ou contato prévio, sem exigir uma paráfrase política.
- source_word: יַעַבְדֻנִי
  choice: me serviu
  rationale: עבד neste contexto régio pode denotar serviço e sujeição política. O passado se harmoniza com o caráter retrospectivo do cântico, sem apagar a possível nuance futura do imperfeito poético, indicada em nota.
theological_decisions:
- issue: Linguagem régia sobre o domínio de nações estrangeiras
  choice: Manter no texto principal o sentido histórico e régio referente a Davi.
  alternative: Explicitar no texto uma leitura diretamente messiânica.
  rationale: O contexto imediato é o cântico de livramento e realeza de Davi. Eventual alcance tipológico ou messiânico pertence à leitura canônica, não deve ser inserido na tradução do verso.
- issue: Valor temporal do imperfeito יַעַבְדֻנִי
  choice: Traduzir no passado, em coerência com a retrospectiva do cântico.
  alternative: “me servirá” ou “me servirão”, com nuance futura.
  rationale: O imperfeito hebraico poético admite leitura resultativa, habitual ou futura. O texto principal segue o fluxo retrospectivo, enquanto a nota preserva a alternativa futura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “tu” coerente com a fala direta a Deus. A ordem poética do hebraico foi preservada sem produzir sintaxe artificial; “cabeça de nações” mantém deliberadamente a metáfora régia da fonte.
