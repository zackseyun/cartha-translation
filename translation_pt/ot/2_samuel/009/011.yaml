base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: pt
  text: 'Ziba disse ao rei: “Tudo o que meu senhor, o rei, ordenar a seu servo[a], assim fará teu servo.” E Mefibosete comia à minha mesa[b], como um dos filhos do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, a primeira ocorrência diz “seu servo”, isto é, o servo do rei; na segunda, Ziba refere-se a si mesmo como “teu servo” ao dirigir-se ao rei.
    reason: clareza_pronominal
  - marker: b
    text: 'Hebraico: “à minha mesa”. Algumas traduções trazem “à mesa do rei” para suavizar a mudança repentina de perspectiva e entender esta frase como um comentário do narrador.'
    reason: ambiguidade_textual
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa usual de אמר, introduzindo fala direta.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: Tudo o que ... ordenar
  rationale: Expressa de modo natural a totalidade e a força prescritiva da construção hebraica.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Preserva a forma respeitosa de tratamento na corte sem tornar a frase artificial em português.
- source_word: עַבְּדוֹ / עַבְדֶּךָ
  choice: seu servo / este seu servo
  rationale: Neste contexto, עבד funciona como autodesignação respeitosa de alguém a serviço do rei; a repetição mantém a fórmula de submissão e “este” ajuda a indicar que Ziba fala de si mesmo.
- source_word: כֵּן יַעֲשֶׂה
  choice: fará
  rationale: O futuro comunica naturalmente a promessa de cumprir as ordens recebidas.
- source_word: אֹכֵל
  choice: comia
  rationale: O particípio hebraico pode descrever uma situação contínua ou habitual; o imperfeito português transmite esse estado sem exigir uma ação pontual.
- source_word: עַל שֻׁלְחָנִי
  choice: à minha mesa
  rationale: Mantém a primeira pessoa singular do Texto Massorético e usa a expressão idiomática portuguesa para compartilhar refeições.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: como um dos filhos do rei
  rationale: Preserva diretamente a comparação e a posição familiar e régia concedida a Mefibosete.
theological_decisions:
- issue: Identidade do falante em “minha mesa”
  choice: 'Manter a primeira pessoa do Texto Massorético: “à minha mesa”.'
  alternative: Traduzir “à mesa do rei” e entender a frase como resumo do narrador.
  rationale: O hebraico traz explicitamente שֻׁלְחָנִי, “minha mesa”. Embora isso produza uma mudança abrupta de perspectiva depois da fala de Ziba, a tradução preserva a tensão textual em vez de harmonizá-la silenciosamente; a nota apresenta a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento próprias do ambiente cortesão. “Comia” comunica uma prática contínua ou habitual. A primeira pessoa em “minha mesa” foi mantida no texto principal por fidelidade ao WLC, e a dificuldade de perspectiva foi explicitada em nota.
