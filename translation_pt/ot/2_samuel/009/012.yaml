base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: pt
  text: Mefibosete tinha um filho pequeno, cujo nome era Mica. E todos os que moravam na casa de Ziba[a] eram servos[b] de Mefibosete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a casa de Ziba”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “servos” também pode significar “escravos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: Mefibosete tinha
  rationale: A construção hebraica com לְ expressa posse ou existência, literalmente algo como “a Mefibosete havia”. Em português corrente, “Mefibosete tinha” comunica naturalmente o mesmo sentido.
- source_word: בֵּן קָטָן
  choice: um filho ainda pequeno
  rationale: קָטָן indica que o filho era pequeno ou jovem. “Ainda pequeno” é idiomático em português e deixa claro que se trata da pouca idade do menino.
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: cujo nome era Mica
  rationale: A formulação identifica diretamente o nome do filho. “Cujo nome era” reproduz o conteúdo com fluidez, e “Mica” translitera מִיכָא.
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: E todos os que moravam na casa de Ziba
  rationale: מוֹשַׁב está relacionado a habitação ou lugar de moradia e, neste contexto, designa coletivamente os moradores da casa. A tradução explicita essa referência pessoal sem excluir a possibilidade de entender a expressão como “toda a casa de Ziba”.
- source_word: עֲבָדִים
  choice: servos
  rationale: עֲבָדִים pode designar servos ou escravos conforme o contexto. Aqui o foco está no serviço prestado pela casa de Ziba a Mefibosete; “servos” é adequado, enquanto a nota preserva a alternativa lexical.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: de Mefibosete
  rationale: Depois de “servos”, o português idiomático emprega “de” para indicar a pessoa a quem eles serviam. A formulação evita impor uma descrição mais específica de posse ou hierarquia.
