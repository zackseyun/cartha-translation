translation:
  language: pt
  text: Então o rei Davi mandou buscá-lo na casa de Maquir, filho de Amiel, em Lo-Debar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Então o rei Davi enviou e o tomou da casa de Maquir, filho de Amiel, de Lo-Debar”. A sequência “enviou e o tomou” também pode ser traduzida idiomaticamente como “mandou buscá-lo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: mandou buscar
  rationale: A sequência hebraica literal, “enviou e o tomou”, expressa idiomaticamente que Davi enviou alguém para buscar Mefibosete e trazê-lo. “Mandou buscar” é natural em português e preserva a ação causativa sem sugerir que Davi foi pessoalmente.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma corrente e natural em português para o título definido seguido do nome próprio.
- source_word: מִבֵּית
  choice: na casa de
  rationale: Embora a preposição hebraica indique origem (“da casa de”), com “mandou buscar” o português pede naturalmente “buscar alguém na casa de”. “Casa” pode referir-se à residência, sem excluir totalmente a ideia de domicílio ou núcleo doméstico.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Maquir, filho de Amiel
  rationale: Os nomes seguem formas bíblicas portuguesas reconhecíveis; “filho de” reproduz explicitamente a relação patronímica hebraica.
- source_word: מִלּוֹ דְבָר
  choice: em Lo-Debar
  rationale: O topônimo é transliterado e hifenizado. Em razão da construção portuguesa “na casa ... em Lo-Debar”, a origem indicada pelo segundo מִן é expressa de modo idiomático pela localização “em”.
- source_word: וַיִּקָּחֵהוּ
  choice: buscar Mefibosete
  rationale: O pronome hebraico “o” retoma Mefibosete, mencionado no contexto anterior. Repor o nome torna o versículo autônomo e claro em português, sem mudar o referente.
