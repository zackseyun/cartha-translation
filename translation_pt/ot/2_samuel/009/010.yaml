    issue: A cláusula «e ele a comerá» não está explicitamente representada.
    rationale: 'וַאֲכָלוֹ é uma cláusula independente: a provisão/produção será pão para o filho do senhor de Ziba, e ele a comerá. «Para que ... tenha pão para comer» comunica parte do sentido, mas altera a relação sintática para finalidade e suprime a segunda afirmação.'
