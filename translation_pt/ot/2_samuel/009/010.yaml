base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your slaves shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty slaves.
translation:
  language: pt
  text: Você, seus filhos e seus escravos cultivarão a terra para ele e recolherão a produção, que servirá de pão[a] para o filho de seu senhor, e ele a comerá. Mas Mefibosete, filho de seu senhor, comerá sempre à minha mesa. Ziba tinha quinze filhos e vinte escravos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida como “pão” também pode significar “alimento” ou “provisões” neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: cultivarão a terra para ele
  rationale: O verbo עבד com אֲדָמָה designa aqui trabalho agrícola em benefício de Mefibosete. “Cultivar a terra” é natural em português e preserva tanto a atividade concreta quanto o beneficiário.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: você, seus filhos e seus escravos
  rationale: A expressão inclui Ziba, seus filhos e sua força de trabalho doméstica. “Escravos” explicita a condição social vinculada indicada por עֲבָדִים neste contexto, sem reduzi-la a emprego voluntário.
- source_word: וְהֵבֵאתָ
  choice: recolherão a produção
  rationale: O objeto do verbo, literalmente “trazer”, está implícito no contexto agrícola. “Recolher a produção” comunica naturalmente a entrada da colheita, sem acrescentar uma ideia estranha ao texto.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: para que o filho de seu senhor tenha pão para comer
  rationale: A formulação portuguesa integra com clareza a finalidade da produção. Mantém “pão” para לֶחֶם, preservando sua repetição conceitual com a refeição à mesa, enquanto a nota registra o sentido mais amplo possível.
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: Mas Mefibosete, filho de seu senhor, comerá sempre à minha mesa
  rationale: A conjunção é entendida como adversativa, contrastando o sustento proveniente da terra com a participação pessoal de Mefibosete à mesa real. Em português, “comer à minha mesa” expressa naturalmente o idioma, sem exigir a repetição literal de “pão”.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Ziba tinha quinze filhos e vinte escravos
  rationale: A oração hebraica não tem verbo expresso; “tinha” é a complementação idiomática necessária em português. “Escravos” preserva a condição de dependência social de עֲבָדִים.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no discurso direto singular, “Mefibosete” e “Ziba” nas formas portuguesas correntes. A sintaxe foi levemente reorganizada para fluência, sem eliminar o contraste entre a produção da terra e a presença contínua de Mefibosete à mesa de Davi.
