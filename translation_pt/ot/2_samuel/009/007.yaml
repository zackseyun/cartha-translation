  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: pt
  text: 'Davi lhe disse: “Não tenha medo, pois certamente demonstrarei bondade[a] a você por causa de Jônatas, seu pai. Devolverei a você todas as terras de Saul, seu pai[b], e você sempre comerá pão à minha mesa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode ser traduzido como “amor leal”, “amor constante” ou “lealdade à aliança”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Saul, seu pai”. Nesse uso, “pai” pode significar antepassado; Saul era avô de Mefibosete.'
    reason: lexical_alternative
  - marker: c
    text: “Comer pão à minha mesa” indica receber provisão contínua e participar regularmente da mesa do rei.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressa de modo natural em português moderno a proibição acompanhada de consolo direto.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: pois certamente demonstrarei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “certamente” preserva essa ênfase sem reproduzir a construção hebraica de modo artificial.
- source_word: חֶסֶד
  choice: bondade
  rationale: No contexto, indica benevolência leal concretamente demonstrada por Davi em razão de sua relação com Jônatas. “Bondade” é clara no texto principal, enquanto a nota preserva as nuances de amor leal e fidelidade à aliança.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: por causa de Jônatas, seu pai
  rationale: Comunica tanto o motivo quanto a base relacional da ação de Davi.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Devolverei a você
  rationale: O hifil de שוב indica fazer voltar ou restituir; “devolverei” expressa com clareza a restituição da propriedade.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: todas as terras de Saul
  rationale: Embora שָׂדֶה esteja no singular, pode ter sentido coletivo e referir-se à propriedade rural ou ao patrimônio de Saul; o plural “terras” soa natural em português.
- source_word: שָׁאוּל אָבִיךָ
  choice: Saul, seu pai
  rationale: Mantém a forma do hebraico e sua amplitude semântica. A nota esclarece que “pai” pode designar um antepassado e que Saul era, especificamente, o avô de Mefibosete.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: você sempre comerá pão à minha mesa
  rationale: Preserva a imagem hebraica de comer pão à mesa do rei e a ideia de provisão e comunhão contínuas; “sempre” transmite a permanência indicada por תָּמִיד.
theological_decisions:
- issue: Nuance relacional e pactual de חֶסֶד
  choice: “bondade” no texto principal, com as nuances de “amor leal”, “amor constante” e “lealdade à aliança” registradas em nota
  alternative: Traduzir diretamente por “amor leal” ou “lealdade à aliança”
  rationale: A ação de Davi é benevolência fiel motivada por seu vínculo com Jônatas. “Bondade” é acessível e adequada à narrativa, enquanto a nota evita perder a riqueza relacional do termo sem impor ao texto principal uma formulação teológica mais específica.
- issue: Sentido de אָב em “Saul, seu pai”
  choice: Conservar “pai” no texto e esclarecer em nota o sentido de antepassado
  alternative: Explicitar “Saul, seu avô” no texto principal
  rationale: 'A tradução mantém a expressão hebraica e sua ambiguidade lexical legítima, ao mesmo tempo que a nota impede confusão genealógica: Saul era avô de Mefibosete.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta usa construções naturais, preservando a ênfase da promessa, a expressão hebraica “Saul, seu pai” e a imagem cultural de comer pão à mesa do rei.
