base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: pt
  text: 'Ele se prostrou e disse: “O que é o teu servo, para que tenhas dado atenção a[a] um cão morto como eu[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “te tenhas voltado para”. O hebraico diz literalmente “te tenhas voltado para”, uma imagem que expressa atenção.
    reason: lexical_alternative
  - marker: b
    text: “Um cão morto” é uma expressão de extrema autodepreciação e falta de valor.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: se prostrou
  rationale: O hitpael de שׁחה descreve o ato físico de curvar-se profundamente em reverência ou submissão. “Se prostrou” preserva o gesto sem defini-lo especificamente como adoração.
- source_word: מֶה עַבְדֶּךָ
  choice: O que é o teu servo
  rationale: Mantém a pergunta hebraica de autodepreciação, em vez de suavizá-la para “Quem sou eu?”. “Servo” é adequado à linguagem de submissão perante o rei sem destacar uma condição jurídica de escravidão.
- source_word: כִּי
  choice: para que
  rationale: 'Neste contexto, כִּי liga a pergunta retórica à atenção recebida: “O que é o teu servo, para que...?”. A formulação é natural em português e preserva a lógica da frase.'
- source_word: פָנִיתָ אֶל
  choice: te tenhas voltado para
  rationale: Preserva a imagem concreta de voltar-se para alguém, que no contexto comunica atenção favorável e graciosa. A nota registra traduções mais explícitas.
- source_word: הַכֶּלֶב הַמֵּת
  choice: um cão morto
  rationale: A expressão comunica autodepreciação extrema e completa insignificância. O artigo hebraico é vertido de modo idiomático pelo indefinido em português.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: como eu
  rationale: A forma breve e natural preserva a comparação pela qual Mefibosete se identifica com o “cão morto”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal aceitável tanto na leitura brasileira quanto internacional. A formulação conserva a linguagem cortesã e a forte autodepreciação do hebraico, sem interpretar o gesto de prostração como necessariamente religioso.
