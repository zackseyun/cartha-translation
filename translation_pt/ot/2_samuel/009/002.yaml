base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: pt
  text: 'A casa de Saul tinha um servo chamado Ziba. Mandaram chamá-lo à presença de Davi. O rei lhe perguntou:


    — Você é Ziba?


    Ele respondeu:


    — Seu servo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Sou seu servo”. A resposta hebraica é elíptica: “Seu servo”.'
    reason: alternativa lexical e esclarecimento da elipse
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: A casa de Saul tinha
  rationale: A construção preposicional hebraica expressa posse ou pertencimento. Esta formulação é natural em português e não acrescenta um marcador temporal inexistente no texto-fonte.
- source_word: עֶבֶד
  choice: um servo
  rationale: Embora o termo possa designar escravo ou servo, neste contexto refere-se a um subordinado ligado à casa de Saul; “servo” preserva a posição social sem especificar além do que o contexto permite.
- source_word: וּשְׁמוֹ צִיבָא
  choice: chamado Ziba
  rationale: Expressa de modo corrente em português a função identificadora da construção hebraica “e o nome dele era Ziba”.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: Mandaram chamá-lo à presença de Davi
  rationale: O verbo com a indicação de destino descreve uma convocação para comparecer diante de Davi. A formulação portuguesa evita o pouco natural “chamaram-no para Davi” e conserva o sujeito plural não identificado.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Título definido que se refere a Davi no contexto narrativo.
- source_word: הַאַתָּה צִיבָא
  choice: Você é Ziba?
  rationale: Reproduz naturalmente a pergunta direta em português moderno, com dignidade narrativa e ampla legibilidade.
- source_word: עַבְדֶּךָ
  choice: Seu servo
  rationale: Preserva a resposta nominal e elíptica do hebraico, bem como seu tom de deferência, sem completá-la silenciosamente como “Sou seu servo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento “você” torna a pergunta direta natural; a resposta “Seu servo” mantém a concisão e a deferência da linguagem de corte. O marcador da nota foi colocado junto à expressão que ela explica.
