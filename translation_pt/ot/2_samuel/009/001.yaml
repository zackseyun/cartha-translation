  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: pt
  text: 'Davi disse: “Ainda resta alguém da casa de Saul, para que eu lhe demonstre bondade[a] por causa de Jônatas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor leal” ou “fidelidade à aliança”. A palavra hebraica muitas vezes indica bondade fiel e comprometida, e não mero sentimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: אמר é o verbo narrativo comum para “dizer”. Embora a fala seguinte seja uma pergunta, “disse” preserva a forma do hebraico e soa natural em português.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: Ainda resta alguém
  rationale: A combinação introduz uma pergunta sobre a existência continuada de alguma pessoa; “ainda resta alguém” expressa isso de modo claro e idiomático.
- source_word: אֲשֶׁר נוֹתַר לְבֵית שָׁאוּל
  choice: da casa de Saul
  rationale: בית designa aqui a família ou dinastia de Saul, não uma construção física; em conjunto com נותר, a frase se refere a um sobrevivente dessa casa.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: para que eu lhe demonstre bondade
  rationale: עשה com חסד forma uma expressão para agir com bondade. “Para que” comunica adequadamente a finalidade ou intenção presente no contexto.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: por causa de Jônatas
  rationale: בעבור indica motivo ou consideração. “Por causa de Jônatas” é natural em português e mantém a ação de Davi fundamentada em sua relação com Jônatas.
theological_decisions:
- issue: A amplitude semântica de חֶסֶד na ação de Davi para com a casa de Saul
  choice: bondade no texto principal, com nota explicativa
  alternative: amor leal; fidelidade à aliança
  rationale: “Bondade” é clara e natural neste contexto de benevolência pessoal, enquanto a nota preserva as possíveis dimensões de lealdade e compromisso ligadas a חֶסֶד, sem impor ao texto principal uma interpretação teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Saul” conserva o sentido familiar e dinástico tradicional; “demonstre bondade” torna natural a expressão idiomática hebraica.
