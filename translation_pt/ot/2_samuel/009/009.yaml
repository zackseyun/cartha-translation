  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: pt
  text: 'Então o rei chamou Ziba, servo[a] de Saul, e lhe disse: “Tudo o que pertencia a Saul e a toda a sua casa[b], eu dei ao filho do seu senhor[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovem de Saul” ou “assistente de Saul”; neste contexto, o termo provavelmente designa um servidor ou membro subordinado da casa de Saul.
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode incluir aqui a família, os servos e o patrimônio pertencente à casa de Saul.
    reason: lexical_alternative
  - marker: c
    text: O “filho do seu senhor” é Mefibosete, descendente de Saul e superior de Ziba na estrutura da casa.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: servo
  rationale: Embora o termo possa significar “jovem” ou “assistente”, neste contexto da casa real indica a função de Ziba como servidor ou subordinado de Saul.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: Tudo o que pertencia a Saul
  rationale: A construção hebraica com לְ expressa posse; esta formulação é clara e natural em português.
- source_word: וּלְכָל בֵּיתוֹ
  choice: e a toda a sua casa
  rationale: “Casa” preserva a amplitude de בַּיִת, que pode abranger família, patrimônio e domínio doméstico; a nota esclarece o sentido contextual.
- source_word: נָתַתִּי
  choice: eu dei
  rationale: O perfeito hebraico apresenta a concessão como ação concluída. O pretérito perfeito é a forma mais natural em português, e o pronome explícito dá ênfase adequada à declaração do rei.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: ao filho do seu senhor
  rationale: “Senhor” representa aqui um superior humano, sem conotação divina. A expressão mantém a relação social indicada pelo hebraico e a formulação filial do texto.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Então o rei chamou ... e lhe disse
  rationale: “Então” comunica a progressão narrativa da sequência hebraica; “lhe disse” expressa naturalmente o complemento אֵלָיו.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A tradução preserva “casa” e “filho do seu senhor” para manter a amplitude e a estrutura relacional do hebraico, esclarecendo-as em notas.
