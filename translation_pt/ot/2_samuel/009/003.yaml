base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: pt
  text: 'Então o rei perguntou: “Ainda resta alguém da casa de Saul, para que eu lhe demonstre a bondade de Deus[a]?” Ziba respondeu ao rei: “Ainda há um filho de Jônatas, com deficiência nos pés[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bondade leal de Deus” ou “uma bondade digna de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “manco dos pés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Ainda resta alguém
  rationale: Expressa de modo natural a pergunta hebraica sobre a existência de algum sobrevivente, sem introduzir a ambiguidade de uma pergunta negativa em português.
- source_word: לְבֵית שָׁאוּל
  choice: da casa de Saul
  rationale: Mantém a imagem bíblica de “casa” no sentido de família, linhagem ou dinastia.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: para que eu lhe demonstre
  rationale: Com חֶסֶד, “demonstrar” é idiomático em português e preserva a finalidade ou intenção expressa pela forma verbal.
- source_word: חֶסֶד אֱלֹהִים
  choice: a bondade de Deus
  rationale: Preserva a construção genitiva e a amplitude de חֶסֶד, que pode envolver bondade, amor leal e fidelidade à aliança, sem restringir o sentido no texto principal.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Ainda há um filho de Jônatas
  rationale: Comunica claramente que sobrevive um descendente de Jônatas e conserva a ênfase de עוֹד.
- source_word: נְכֵה רַגְלָיִם
  choice: com deficiência nos pés
  rationale: Descrição atual, respeitosa e semanticamente adequada de uma limitação física que afetava sua mobilidade; a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Nuance de חֶסֶד אֱלֹהִים
  choice: a bondade de Deus
  alternative: o amor leal de Deus; a fidelidade de Deus à aliança; uma bondade digna de Deus
  rationale: A expressão pode indicar bondade que pertence a Deus, reflete seu caráter ou se relaciona à lealdade da aliança. A tradução principal conserva essa amplitude, e a nota registra as nuances possíveis sem impor uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Casa de Saul” preserva a linguagem bíblica de linhagem; “com deficiência nos pés” evita um termo hoje potencialmente pejorativo sem ocultar a condição física descrita no hebraico.
