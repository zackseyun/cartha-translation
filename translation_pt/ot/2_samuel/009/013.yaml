base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: pt
  text: Mefibosete morava em Jerusalém, porque comia sempre à mesa do rei. Era coxo dos dois pés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: morava
  rationale: Com o nome de uma cidade, o particípio de ישׁב indica residência habitual; “morava” é natural em português e adequado ao contexto narrativo.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão de Mefibosete morar em Jerusalém, preservando de modo direto o valor causal mais provável.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: à mesa do rei
  rationale: Reproduz naturalmente o sintagma construto e conserva a imagem de provisão e comunhão à mesa real.
- source_word: תָּמִיד הוּא אֹכֵל
  choice: comia sempre
  rationale: O particípio com תָּמִיד expressa ação habitual; o pretérito imperfeito comunica essa continuidade com naturalidade em português.
- source_word: פִסֵּחַ
  choice: aleijado
  rationale: Expressa diretamente a limitação de locomoção indicada pelo adjetivo hebraico, sem ampliar o sentido para uma deficiência genérica.
- source_word: שְׁתֵּי רַגְלָיו
  choice: dos dois pés
  rationale: Mantém a referência anatômica específica do hebraico, literalmente “seus dois pés”.
- source_word: וְהוּא
  choice: Ele era
  rationale: Introduz de maneira fluente a observação descritiva final; a separação em nova frase conserva sua função conclusiva sem um “e” pouco natural.
