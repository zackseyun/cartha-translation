translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O nome próprio segue a forma portuguesa tradicional “Mefibosete”. A construção causal foi mantida sem nota, pois é clara no contexto e não há uma alternativa textual distinta no hebraico; as notas da camada inglesa parecem estar deslocadas em relação aos respectivos marcadores.
