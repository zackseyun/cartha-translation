base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: pt
  text: 'Mefibosete, filho de Jônatas e neto de Saul, foi até Davi, prostrou-se com o rosto em terra e prestou-lhe homenagem. Davi disse: “Mefibosete!” Ele respondeu: “Aqui está o seu servo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: filho de Jônatas e neto de Saul
  rationale: O segundo uso de בֶּן expressa a linhagem de Mefibosete por meio de Jônatas; “neto” comunica essa relação naturalmente em português sem alterar a genealogia.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: prostrou-se com o rosto em terra
  rationale: Expressa de modo claro o gesto corporal literal de submissão e reverência.
- source_word: וַיִּשְׁתָּחוּ
  choice: prestou-lhe homenagem
  rationale: No contexto de comparecimento diante do rei, o verbo indica reverência ou homenagem; esta tradução evita atribuir necessariamente culto religioso ao gesto.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Aqui está o seu servo
  rationale: Reproduz a fórmula de presença e disponibilidade respeitosa em português natural, mantendo a autoidentificação como servo.
theological_decisions:
- issue: Natureza do gesto expresso por וַיִּשְׁתָּחוּ
  choice: prestou-lhe homenagem
  alternative: adorou
  rationale: O destinatário é o rei Davi e o contexto é de deferência cortesã; “adorou” poderia impor indevidamente um sentido de culto religioso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala mantém a relação formal entre súdito e rei sem recorrer a construções arcaicas.
