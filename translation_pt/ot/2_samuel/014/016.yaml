base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: pt
  text: Pois o rei ouvirá e livrará sua serva[a] da mão do homem que pretende destruir a mim e a meu filho, juntamente, da herança de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo hebraico é feminino: “sua serva”. É a forma respeitosa pela qual a mulher se refere a si mesma diante do rei.'
    reason: lexical_alternative
  - marker: b
    text: “Herança de Deus” pode indicar a herança concedida por Deus dentro de Israel ou, alternativamente, a herança que pertence a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou a confiança da mulher com valor explicativo, em continuidade com o versículo anterior.
- source_word: יִשְׁמַע
  choice: ouvirá
  rationale: Preserva o sentido básico de שמע e, no contexto, implica que o rei atenderá ao pedido.
- source_word: לְהַצִּיל
  choice: livrará
  rationale: O hifil de נצל indica resgatar ou livrar alguém do poder de outro; a coordenação torna a frase natural em português.
- source_word: אֲמָתוֹ
  choice: sua serva
  rationale: O substantivo hebraico é feminino e funciona como autodesignação respeitosa da mulher diante do rei.
- source_word: מִכַּף הָאִישׁ
  choice: das mãos do homem
  rationale: Conserva a imagem hebraica da mão como poder ou domínio; o plural é a formulação idiomática mais natural em português.
- source_word: לְהַשְׁמִיד
  choice: que quer eliminar
  rationale: Expressa a finalidade hostil do homem e, neste contexto, a supressão tanto das pessoas quanto da linhagem e de seu lugar na herança.
- source_word: יַחַד
  choice: juntos
  rationale: Salienta que mãe e filho seriam atingidos conjuntamente.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: da herança de Deus
  rationale: 'Segue de perto a construção hebraica e mantém aberta a relação genitiva: herança concedida por Deus ou pertencente a Deus.'
theological_decisions:
- issue: Sentido de “herança de Deus”
  choice: Manter a expressão formalmente ambígua, com provável referência à herança concedida por Deus dentro de Israel.
  alternative: Entender a frase como a herança que pertence ao próprio Deus, isto é, seu povo ou sua terra.
  rationale: O contexto envolve a extinção de uma linhagem e sua exclusão do lugar que lhe cabe em Israel, mas a construção hebraica não exige que uma única relação genitiva seja explicitada no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sua serva” preserva o gênero explícito do hebraico e o registro de deferência cortesã. A ordem verbal foi ajustada para fluência, sem eliminar a ambiguidade teológica da expressão final.
