  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: pt
  text: 'Então a mulher disse[a]: “Por favor, permita que sua serva diga uma palavra ao meu senhor, o rei.” E ele disse: “Fale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tua serva” ou “tua criada”; é uma forma feminina e humilde pela qual a mulher se refere a si mesma diante do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: No contexto, designa de modo simples a mulher que fala com o rei.
- source_word: תְּדַבֶּר נָא
  choice: Por favor, permita que ... diga
  rationale: O imperfeito de sentido jussivo com נָא formula um pedido cortês e deferente dirigido ao rei.
- source_word: שִׁפְחָתְךָ
  choice: esta sua serva
  rationale: O substantivo é feminino e integra uma fórmula humilde de autodesignação. “Esta sua serva” soa natural no português de registro cortês e preserva o gênero e a deferência.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: ao meu senhor, o rei
  rationale: אדון é aqui um tratamento honorífico humano. A aposição com vírgula torna clara e natural a identificação do senhor como o rei.
- source_word: דָּבָר
  choice: uma palavra
  rationale: Preserva o sentido literal e a concisão da expressão hebraica, embora também possa significar “um assunto” ou “algo”.
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: No diálogo, “respondeu” exprime com naturalidade a função do verbo de dizer, sem acrescentar conteúdo à fala.
- source_word: דַּבֵּרִי
  choice: Fale
  rationale: Imperativo feminino singular direto e conciso, adequadamente representado pela forma portuguesa “Fale”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento cortesão inteligível. A formulação “esta sua serva” conserva o gênero feminino e a humildade do hebraico; “meu senhor, o rei” mantém o título humano sem conotação divina.
