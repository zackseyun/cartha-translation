base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: pt
  text: 'Então o rei disse à mulher: “Vá para sua casa, e eu darei ordens a seu respeito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “darei ordens em seu favor”. A preposição hebraica admite mais de uma compreensão, mas o sentido é que o rei dará instruções a respeito do caso dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência de modo natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: הָאִשָּׁה
  choice: à mulher
  rationale: No contexto, refere-se à mulher de Tecoa que fala com Davi; “mulher” é o sentido apropriado aqui.
- source_word: לְכִי
  choice: Vá
  rationale: Imperativo feminino singular de הלך, dirigido à mulher; “Vá” é claro e idiomático.
- source_word: לְבֵיתֵךְ
  choice: para sua casa
  rationale: Preserva o sentido concreto de בַּיִת e soa natural em português.
- source_word: וַאֲנִי
  choice: e eu
  rationale: Mantém o pronome explícito e sua leve ênfase sem tornar a frase artificial.
- source_word: אֲצַוֶּה
  choice: darei ordens
  rationale: O piel de צוה significa mandar ou dar ordens; esta formulação combina naturalmente com a fala de um rei.
- source_word: עָלָיִךְ
  choice: a seu respeito
  rationale: Com צוה, a preposição עַל pode indicar a pessoa ou questão acerca da qual se dão ordens; a formulação preserva essa referência sem pressupor que sejam necessariamente ordens em benefício dela.
