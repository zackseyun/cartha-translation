  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: pt
  text: Joabe, filho de Zeruia, soube que o coração do rei estava voltado para Absalão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “o rei sentia saudade de Absalão”. A expressão hebraica é concisa e também pode ser entendida, de modo mais geral, como “o coração do rei estava inclinado para Absalão”. Alguns a interpretam negativamente: “estava contra Absalão”; porém, o contexto seguinte favorece uma inclinação positiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: soube
  rationale: O wayyiqtol de ידע faz a narrativa avançar. “Soube” expressa naturalmente o conhecimento de Joabe sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joabe, filho de Zeruia
  rationale: Os nomes seguem formas portuguesas consagradas; a relação de filiação é expressa de modo natural.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo daquilo que Joabe soube.
- source_word: לֵב הַמֶּלֶךְ
  choice: o coração do rei
  rationale: “Coração” preserva a expressão antropológica hebraica, que pode abranger disposição interior, vontade e afeto.
- source_word: עַל
  choice: estava voltado para
  rationale: A construção elíptica com “coração” é ambígua. Esta formulação conserva a orientação para Absalão sem decidir de modo excessivo se se trata de saudade, favor, preocupação ou oposição.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Emprega-se a forma portuguesa tradicional do nome.
theological_decisions:
- issue: Ambiguidade da disposição do rei para com Absalão
  choice: o coração do rei estava voltado para Absalão
  alternative: o rei sentia saudade de Absalão; o coração do rei estava contra Absalão
  rationale: O hebraico é conciso e não explicita a natureza da disposição de Davi. A tradução principal mantém essa tensão, enquanto a nota registra interpretações mais específicas; o contexto seguinte favorece uma inclinação positiva.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas bíblicas correntes no Brasil e compreensão ampla no mundo lusófono. A formulação conserva a imagem hebraica do coração e sua ambiguidade contextual.
