  text: 'Então Joabe se levantou, foi à casa de Absalão e lhe disse: “Por que os seus servos puseram fogo no meu campo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então Joabe se levantou
  rationale: O wayyiqtol dá sequência à narrativa. “Então” expressa essa progressão, e “se levantou” preserva de modo natural a ação do hebraico.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: foi à casa de Absalão
  rationale: O ה direcional em הַבָּיְתָה indica movimento para a casa; no contexto, trata-se da residência de Absalão. A formulação é clara e idiomática em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e lhe perguntou
  rationale: Embora אמן signifique literalmente “disse”, a fala introduzida é uma pergunta. “Perguntou” comunica naturalmente a função da expressão sem alterar seu conteúdo.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente direto, corrente e claro do interrogativo causal.
- source_word: הִצִּיתוּ
  choice: puseram fogo
  rationale: O hifil de יצת significa acender ou incendiar. “Pôr fogo em” preserva o sentido causativo e é natural no português moderno.
- source_word: עֲבָדֶךָ
  choice: os seus servos
  rationale: Apesar da forma consonantal singular, o verbo plural הִצִּיתוּ mostra que o referente tem sentido plural. “Servos” preserva a relação social indicada no relato sem intensificá-la desnecessariamente como “escravos”.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: no meu campo
  rationale: חֶלְקָה designa uma parcela ou área de terra, e אֲשֶׁר לִי explicita que ela pertence a Joabe. “Meu campo” transmite ambas as ideias de forma concisa e natural.
- source_word: בָּאֵשׁ
  choice: fogo
  rationale: O בּ marca aqui o meio ou instrumento, literalmente “com fogo”. Na locução portuguesa “pôr fogo em”, o sentido instrumental está plenamente expresso.
