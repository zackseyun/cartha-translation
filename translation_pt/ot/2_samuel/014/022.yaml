base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: pt
  text: 'Então Joabe se lançou com o rosto em terra, prostrou-se e abençoou o rei. Joabe disse: “Hoje o teu servo sabe que achei favor aos teus olhos, ó rei, meu senhor, pois o rei atendeu ao pedido do seu servo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “fez a palavra do seu servo”.'
    reason: A nota preserva a forma concreta do idioma hebraico por trás da tradução contextual “atendeu ao pedido”.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: se lançou com o rosto em terra
  rationale: Reproduz a ação física e a direção expressas pelo hebraico sem sugerir uma queda acidental.
- source_word: וַיִּשְׁתַּחוּ
  choice: prostrou-se
  rationale: No contexto da corte, indica homenagem corporal diante do rei; evita a conotação especificamente religiosa que “adorou” poderia introduzir.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: abençoou o rei
  rationale: Mantém o sentido usual de ברך no piel com uma pessoa como objeto, embora o contexto também envolva gratidão e louvor.
- source_word: יָדַע עַבְדְּךָ
  choice: o teu servo sabe
  rationale: O perfeito hebraico expressa aqui a certeza ou percepção presente de Joabe, resultante da decisão do rei.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: achei favor aos teus olhos
  rationale: Preserva a imagem do idioma hebraico em formulação bíblica clara e ainda compreensível em português moderno.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ó rei, meu senhor
  rationale: Comunica de modo natural a respeitosa forma de tratamento da corte, preservando tanto o título quanto a deferência pessoal.
- source_word: אֲשֶׁר
  choice: pois
  rationale: Neste contexto, a partícula introduz o fato que fundamenta a certeza expressa por Joabe.
- source_word: עָשָׂה הַמֶּלֶךְ אֶת דְּבַר עַבְדּוֹ
  choice: o rei atendeu ao pedido do seu servo
  rationale: Expressa em português natural o sentido contextual de “fazer a palavra” de alguém; a forma literal é preservada em nota.
theological_decisions:
- issue: Natureza da homenagem prestada ao rei
  choice: “prostrou-se” como gesto de deferência cortesã
  alternative: “adorou” o rei
  rationale: O contexto descreve homenagem a um governante humano, sem afirmar que Joabe lhe prestou culto divino.
- issue: Sentido da declaração final
  choice: “atendeu ao pedido do seu servo”
  alternative: “fez a palavra do seu servo”
  rationale: A tradução principal comunica o cumprimento da solicitação de Joabe sem acrescentar uma interpretação doutrinária; a expressão formalmente literal aparece na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de tratamento cortesãs preservadas. Emprega “tu” por coerência com o discurso dirigido ao rei. O marcador da nota foi colocado na oração final a que a nota efetivamente se refere.
