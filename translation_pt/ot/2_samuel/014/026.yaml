  naturalness: O português é claro e de registro adequado. A repetição de «ele pesava» torna mais explícita a sequência temporal hebraica e evita que «cabelo cortado» pareça uma reformulação interpretativa desnecessária.
  terminology: «Siclos» é apropriado como unidade antiga de peso. «Peso-padrão do rei» comunica bem a função de אֶבֶן, desde que a nota informe o sentido literal «pedra» e sua provável função como peso de referência.
