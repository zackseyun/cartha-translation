base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: pt
  text: 'Sempre que cortava o cabelo — ao fim de cada ano[a], porque lhe pesava —, ele pesava o cabelo de sua cabeça: duzentos siclos, segundo o peso-padrão do rei[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico também pode ser entendido de modo menos específico: «de tempos em tempos».'
    reason: textual_ambiguity
  - marker: b
    text: Literalmente, «segundo a pedra do rei», provavelmente uma pedra usada como padrão oficial de peso.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת רֹאשׁוֹ
  choice: Sempre que cortava o cabelo
  rationale: A construção temporal, no contexto habitual, indica uma ação repetida. Embora o hebraico diga literalmente “ao cortar a sua cabeça”, o objeto implícito é o cabelo, explicitado mais adiante no versículo.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: fazia isso ao fim de cada ano
  rationale: A expressão idiomática indica um intervalo recorrente, provavelmente anual. A formulação portuguesa comunica a periodicidade sem reproduzir de modo obscuro o literal “ao fim de dias para dias”.
- source_word: כִּי כָבֵד עָלָיו
  choice: porque lhe pesava
  rationale: Preserva de modo natural a imagem hebraica de o cabelo ser pesado sobre ele, sem acrescentar que fosse necessariamente pesado demais.
- source_word: וְגִלְּחוֹ וְשָׁקַל אֶת שְׂעַר רֹאשׁוֹ
  choice: ele pesava o cabelo cortado
  rationale: A formulação evita repetição excessiva em português e deixa claro que era o cabelo resultante do corte que ele pesava, mantendo o caráter habitual da ação.
- source_word: מָאתַיִם שְׁקָלִים
  choice: duzentos siclos
  rationale: “Siclo” é a designação tradicional e precisa da unidade antiga de peso; aqui não se trata de moeda.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: segundo o peso-padrão do rei
  rationale: אֶבֶן significa literalmente “pedra”, mas aqui designa uma pedra usada como peso de referência. A tradução comunica a função cultural do objeto; o sentido literal é registrado na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A pontuação por travessões preserva o comentário explicativo inserido no fluxo da frase. “Peso-padrão do rei” evita que “pedra do rei” soe como uma pedra comum, sem ocultar o sentido literal, explicado na decisão lexical.
