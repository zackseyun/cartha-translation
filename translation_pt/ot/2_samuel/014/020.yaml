source:
  edition: WLC
  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: pt
  text: Para mudar o aspecto da questão[a], seu servo Joabe fez isso. Mas meu senhor é sábio, com a sabedoria de um anjo de Deus, para saber tudo o que há na terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dar outro aspecto à questão” ou “fazer a questão tomar outro rumo”. A expressão hebraica diz literalmente “virar a face da questão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tudo o que há na terra”. Neste contexto, “terra” provavelmente se refere ao território ou ao reino, não ao mundo inteiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: Para
  rationale: Introduz a finalidade da ação de Joabe de modo conciso e natural em português.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: mudar a feição da questão
  rationale: Preserva a metáfora hebraica da 'face' da questão sem sugerir apenas uma mudança de rumo; 'feição' comunica a forma ou aparência dada ao caso.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: fez isso
  rationale: Evita a repetição pouco natural de 'questão' e traduz diretamente a ação referida.
- source_word: עַבְדְּךָ
  choice: seu servo
  rationale: Expressa a autodesignação deferente própria da linguagem dirigida ao rei.
- source_word: וַאדֹנִי
  choice: Mas meu senhor
  rationale: O conectivo marca aqui uma transição levemente contrastiva entre a explicação do plano e o elogio à perspicácia do rei.
- source_word: חָכָם
  choice: é sábio
  rationale: É a equivalência corrente e adequada ao elogio da capacidade de discernimento do rei.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: com sabedoria como a de um anjo de Deus
  rationale: Mantém explícita a comparação introduzida por כְּ, evita identificar necessariamente um anjo específico e soa natural em português.
- source_word: לָדַעַת
  choice: para saber
  rationale: Conserva a finalidade ou capacidade expressa pelo infinitivo hebraico.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: tudo o que acontece nesta terra
  rationale: No contexto régio, a expressão provavelmente se refere aos acontecimentos no território governado por Davi; 'acontece' explicita idiomaticamente o sentido de assuntos existentes ou ocorrentes, e 'nesta terra' mantém a referência contextual sem universalizá-la.
theological_decisions:
- issue: Referência a 'um anjo de Deus'
  choice: Comparação que elogia o discernimento extraordinário do rei
  alternative: Referência a 'o anjo de Deus' como figura específica ou afirmação de conhecimento quase divino
  rationale: A construção funciona como linguagem cortesã elevada. A tradução mantém a comparação sem atribuir a Davi natureza sobre-humana ou onisciência e sem determinar que se trate de um anjo específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a metáfora incomum do hebraico por meio de 'feição', esclarecida em nota, e mantém o tom deferente da fala dirigida ao rei.
