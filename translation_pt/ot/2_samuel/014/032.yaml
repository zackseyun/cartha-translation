  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: pt
  text: 'Absalão disse a Joabe: “Veja, mandei dizer a você: ‘Venha aqui, para que eu o envie ao rei, para dizer: “Por que vim de Gesur? Seria melhor para mim se ainda estivesse lá.”’[a] Agora, deixe-me ver o rosto do rei;[b] e, se há culpa em mim, que ele me mate.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Teria sido melhor para mim continuar lá”. A frase hebraica é elíptica.'
    reason: lexical_alternative
  - marker: b
    text: “Ver o rosto do rei” é uma expressão que significa comparecer diante dele.
    reason: idiom_explanation
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Emprega um marcador discursivo atual que chama a atenção de Joabe para a queixa de Absalão, sem o arcaísmo de “eis”.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: mandei dizer a você
  rationale: No contexto, a expressão indica o envio de uma mensagem ou convocação a Joabe, não o envio de um objeto.
- source_word: בֹּא הֵנָּה
  choice: Venha aqui
  rationale: Reproduz de modo direto e natural o imperativo com o advérbio de lugar.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: para que eu o envie ao rei
  rationale: O coortativo, depois da convocação, expressa a finalidade de chamar Joabe.
- source_word: לֵאמֹר ... לֵאמֹר
  choice: dizer ... perguntar
  rationale: A primeira ocorrência introduz a mensagem enviada a Joabe; a segunda introduz a pergunta que Joabe deveria transmitir ao rei. “Perguntar” evita uma repetição rígida e corresponde à função da fala seguinte.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Por que vim de Gesur?
  rationale: Mantém a forma ativa da primeira pessoa no hebraico e expressa naturalmente a pergunta retrospectiva de Absalão.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Seria melhor para mim se ainda estivesse lá
  rationale: Explicita em português a comparação elíptica do hebraico, preservando “ainda” e a preferência de Absalão por permanecer em Gesur.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a passagem da queixa à exigência sem acrescentar uma relação causal que o hebraico não exige.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: deixe-me ver o rosto do rei
  rationale: Preserva a imagem hebraica de ver o rosto do rei e comunica o valor volitivo adequado ao contexto.
- source_word: עָוֺן
  choice: culpa
  rationale: O termo pode designar iniquidade e também a culpabilidade decorrente dela; “culpa” se ajusta ao desafio de caráter judicial feito por Absalão.
- source_word: וֶהֱמִתָנִי
  choice: que ele me mate
  rationale: Traduz com clareza a forma causativa de מות, sem acrescentar a ideia mais específica de uma execução formal.
