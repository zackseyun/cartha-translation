  text: וַ/יִּשְׁלַ֤ח יוֹאָב֙ תְּק֔וֹעָ/ה וַ/יִּקַּ֥ח מִ/שָּׁ֖ם אִשָּׁ֣ה חֲכָמָ֑ה וַ/יֹּ֣אמֶר אֵ֠לֶי/הָ הִֽתְאַבְּלִי נָ֞א וְ/לִבְשִׁי נָ֣א בִגְדֵי אֵ֗בֶל וְ/אַל תָּס֨וּכִי֙ שֶׁ֔מֶן וְ/הָיִ֕ית כְּ/אִשָּׁ֗ה זֶ֚ה יָמִ֣ים רַבִּ֔ים מִתְאַבֶּ֖לֶת עַל מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: pt
  text: 'Então Joabe mandou buscar em Tecoa uma mulher sábia e lhe disse: “Por favor, finja que está de luto[a], vista roupas de luto[b] e não passe óleo no corpo[c]. Comporte-se como uma mulher que há muitos dias está de luto por alguém que morreu[d]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ponha-se de luto” ou “aja como alguém de luto”. O verbo hebraico significa “estar de luto”, mas o contexto mostra que Joabe lhe ordena assumir esse papel como parte de uma encenação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vestes de luto”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não se unja com óleo”. Passar óleo no corpo fazia parte dos cuidados pessoais e podia estar associado ao bem-estar e à celebração; deixar de usá-lo era sinal de luto.
    reason: cultural_note
  - marker: d
    text: Mais literalmente, “como uma mulher que há muitos dias está de luto por um morto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Tecoa
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: אִשָּׁה חֲכָמָה
  choice: uma mulher sábia
  rationale: Preserva o sentido amplo de חֲכָמָה, que pode envolver sabedoria, habilidade e perspicácia; o contexto revela sua capacidade para executar o plano de Joabe.
- source_word: וַיִּשְׁלַח ... וַיִּקַּח מִשָּׁם
  choice: mandou buscar ... e [a trouxe] de lá, condensado em “mandou buscar em Tecoa”
  rationale: A formulação portuguesa expressa naturalmente que Joabe enviou alguém para fazer vir a mulher, sem identificar mensageiros que o hebraico não nomeia.
- source_word: הִתְאַבְּלִי נָא
  choice: Por favor, finja que está de luto
  rationale: O verbo significa estar ou pôr-se de luto; “finja” explicita a força pragmática indicada pelo plano encenado, enquanto a nota preserva a tradução lexical mais direta.
- source_word: בִגְדֵי אֵבֶל
  choice: roupas de luto
  rationale: Expressão natural em português para as vestes associadas ao luto, sem perder a imagem cultural do hebraico.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: não passe óleo no corpo
  rationale: סוך descreve a aplicação de óleo ao corpo para cuidado pessoal ou refrigério; esta formulação comunica o ato com clareza ao leitor moderno.
- source_word: וְהָיִית כְּאִשָּׁה
  choice: Comporte-se como uma mulher
  rationale: No contexto de uma representação planejada, expressa naturalmente a instrução para assumir a aparência e a conduta de uma enlutada.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: que há muitos dias está de luto por alguém que morreu
  rationale: Conserva a duração prolongada e verte o singular indefinido מֵת de modo idiomático, sem sugerir necessariamente uma pessoa específica já identificada.
