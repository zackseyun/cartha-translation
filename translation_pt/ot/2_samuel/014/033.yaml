  naturalness: O registro é moderno, claro e apropriado. “Se prostrou diante do rei, com o rosto em terra” é natural em português e conserva a solenidade da cena.
  terminology: “Joabe”, “Absalão”, “rei”, “prostrou” e “beijou” são escolhas estabelecidas e adequadas. A nota sobre o beijo mantém corretamente a distinção entre a ação expressa e sua provável função social.
