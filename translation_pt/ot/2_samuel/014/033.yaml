revisions:
- from: Então Joabe foi ao rei e lhe relatou isso. O rei chamou Absalão[a], e ele foi até o rei e se prostrou diante dele, com o rosto em terra. Então o rei beijou Absalão.[b]
  to: Então Joabe foi ao rei e lhe contou. O rei chamou Absalão, e ele foi até o rei e se prostrou diante do rei, com o rosto em terra. Então o rei beijou Absalão.[b]
  rationale: A revisão remove a expansão desnecessária “isso” e restaura a referência explícita ao rei na cena de prostração. A nota a foi retirada porque o texto revisado diz “chamou Absalão”, formulação já coberta diretamente pelo texto principal; a nota b foi mantida, pois oferece contexto cultural sem impor essa interpretação ao enunciado.
