base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: pt
  text: Então Joabe foi ao rei e lhe contou. O rei chamou Absalão, e ele foi até o rei e se prostrou diante do rei, com o rosto em terra. Então o rei beijou Absalão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O beijo do rei provavelmente sinaliza reconciliação ou favor restaurado, embora o texto diga apenas que ele beijou Absalão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Joabe foi ao rei
  rationale: בוא descreve o movimento de Joabe em direção ao rei. Em português narrativo, “foi ao rei” expressa esse movimento com naturalidade.
- source_word: וַיַּגֶּד לוֹ
  choice: lhe relatou isso
  rationale: O hifil de נגד significa contar, informar ou relatar. O objeto não é expresso no hebraico; “isso” retoma naturalmente o assunto do contexto sem acrescentar conteúdo específico.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: O rei chamou Absalão
  rationale: קרא אל pode significar chamar alguém ou mandar que venha. O rei é o antecedente mais natural no contexto; “chamou” conserva a formulação simples do hebraico, enquanto a nota registra a possibilidade idiomática de “mandou chamar”.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: se prostrou diante dele
  rationale: A forma de שׁחה indica inclinar-se profundamente ou prostrar-se em reverência. A expressão seguinte, “com o rosto em terra”, deixa clara a postura corporal completa.
- source_word: עַל־אַפָּיו אַרְצָה
  choice: com o rosto em terra
  rationale: Tradução idiomática e precisa da expressão literalmente orientada “sobre o rosto, em direção à terra”.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante dele
  rationale: O pronome retoma explicitamente o rei já mencionado e evita repetição excessiva em português, preservando o sentido de estar em sua presença.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: o rei beijou Absalão
  rationale: נשׁק designa aqui o ato literal de beijar. A tradução não explicita no corpo do texto o significado social ou político do gesto.
theological_decisions:
- issue: Significado do beijo do rei
  choice: 'Manter apenas a ação literal: “o rei beijou Absalão”.'
  alternative: Explicitar que o beijo foi um sinal formal de reconciliação ou de favor restaurado.
  rationale: O gesto provavelmente comunica reconciliação ou acolhimento renovado, mas o hebraico não interpreta expressamente o beijo. A tradução preserva essa abertura narrativa, e a nota oferece o contexto provável sem transformá-lo em afirmação textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa hebraica foi mantida sem rigidez excessiva; “se prostrou” preserva a solenidade da cena, e a interpretação do beijo permanece na nota, não no texto principal.
