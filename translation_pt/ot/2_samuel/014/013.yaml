base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: pt
  text: 'Então a mulher disse: “Por que, então, o senhor planejou[a] algo assim contra o povo de Deus? Ao dizer isso, o rei fica como alguém culpado,[b] pois não trouxe de volta aquele que foi banido por ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “concebeu” ou “pensou em fazer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, ao proferir essa decisão, o rei implica a própria culpa por não trazer de volta aquele que foi banido por ele. Ou: “é como alguém culpado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: planejou
  rationale: O verbo pode indicar pensar, planejar ou conceber. Aqui, “planejou” comunica uma conduta deliberada do rei sem tornar a acusação mais forte do que o hebraico.
- source_word: כָּזֹאת
  choice: algo assim
  rationale: Expressão corrente em português que retém a referência demonstrativa ao tipo de ação exposto pela parábola.
- source_word: עַל עַם אֱלֹהִים
  choice: contra o povo de Deus
  rationale: Com o verbo חשב, a preposição על assume no contexto sentido adversativo; a formulação preserva a referência ampla ao povo de Deus.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Ao dizer isso, o rei
  rationale: A construção com infinitivo pode ser circunstancial ou causal. “Ao dizer isso” expressa que as próprias palavras do rei o implicam, sem impor uma relação lógica excessivamente específica.
- source_word: כְּאָשֵׁם
  choice: se coloca como culpado
  rationale: A preposição כְּ marca comparação. A tradução conserva essa nuance e comunica que a sentença pronunciada pelo rei o põe na posição de quem é culpado.
- source_word: לְבִלְתִּי הָשִׁיב
  choice: pois não trouxe de volta
  rationale: A formulação causal torna clara em português a base da acusação, enquanto “trouxe de volta” preserva o sentido concreto do hifil de שוב.
- source_word: נִדְּחוֹ
  choice: aquele que foi banido por ele
  rationale: O particípio passivo designa alguém banido ou afastado, e o sufixo pronominal o relaciona ao rei. A redação é natural em português e mantém a referência singular a Absalão.
theological_decisions:
- issue: Alcance da expressão “o povo de Deus”
  choice: Manter literalmente “o povo de Deus”
  alternative: Israel; Absalão e a casa real
  rationale: A expressão hebraica é ampla. Embora o contexto envolva Absalão e a família real, a tradução não restringe a acusação da mulher nem a transforma em uma afirmação teológica abstrata.
- issue: Natureza da culpa atribuída ao rei
  choice: “se coloca como culpado”
  alternative: “é culpado”
  rationale: O כְּ comparativo e a estratégia retórica da mulher indicam que a própria sentença do rei o coloca na posição de culpado. A tradução evita eliminar essa tensão mediante uma declaração direta e absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento respeitoso ao rei por “o senhor”. A sintaxe conserva a força confrontadora da fala sem soar arcaica. A comparação em כְּאָשֵׁם e o alcance de “povo de Deus” foram preservados sem harmonização doutrinária.
