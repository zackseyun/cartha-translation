revisions:
- from: 'Então a mulher disse: “Por que, então, o senhor planejou[a] algo assim contra o povo de Deus? Ao dizer isso, o rei se coloca como culpado,[b] pois não trouxe de volta aquele que foi banido por ele.”'
  to: 'Então a mulher disse: “Por que, então, o senhor planejou[a] algo assim contra o povo de Deus? Ao dizer isso, o rei fica como alguém culpado,[b] pois não trouxe de volta aquele que foi banido por ele.”'
  rationale: A revisão substitui «se coloca como culpado» por «fica como alguém culpado», preservando em português moderno a comparação marcada por כְּ, sem converter a estratégia retórica da mulher numa afirmação direta ou reflexiva sobre a culpa do rei. As demais escolhas são mantidas.
