base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: pt
  text: 'E o rei disse: “Quem falar com você, traga-o a mim, e ele não voltará a tocar em você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não voltará a fazer mal a você”. Neste contexto, o verbo hebraico traduzido como “tocar” pode indicar contato hostil ou dano, não apenas toque físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta de מֶלֶךְ, preservando o artigo definido.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: quem falar contra você
  rationale: O particípio substantivado significa literalmente ‘aquele que fala a você’; no contexto, trata-se de alguém que a confronta ou ameaça, por isso ‘falar contra você’ comunica naturalmente a força contextual sem identificar uma pessoa específica.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: traga-o até mim
  rationale: O hifil de בוא tem sentido causativo, ‘fazer vir’, expresso naturalmente em português por ‘trazer’. ‘Até mim’ indica o movimento em direção ao rei.
- source_word: וְלֹא יֹסִיף עוֹד
  choice: nunca mais
  rationale: A combinação יסף + עוד nega a continuação ou repetição futura; ‘nunca mais’ é uma formulação portuguesa natural e enfática neste contexto.
- source_word: לָגַעַת בָּךְ
  choice: tocará em você
  rationale: Preserva o sentido lexical básico de נגע, ‘tocar’, deixando a nota esclarecer que, neste contexto de proteção, o verbo pode implicar agressão ou dano.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala régia mantém concisão e autoridade. O marcador [a] aparece no texto principal e esclarece a amplitude contextual do verbo sem substituir seu sentido lexical básico.
