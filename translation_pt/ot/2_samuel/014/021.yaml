base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: pt
  text: 'Então o rei disse a Joabe: “Veja, fiz esta coisa. Vá e traga de volta o jovem Absalão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então [...] disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido empregado no hebraico, sem substituí-lo pelo nome próprio.
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: הִנֵּה chama a atenção, enquanto נָא suaviza ou dá imediatismo à fala. “Veja” preserva essa força discursiva sem recorrer ao arcaizante “eis”.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: fiz isso que você pediu
  rationale: No contexto, “esta coisa” é o pedido apresentado em favor de Absalão. A formulação torna a referência clara em português, enquanto a nota conserva a expressão hebraica mais literal.
- source_word: וְלֵךְ
  choice: Agora vá
  rationale: A conjunção liga a decisão do rei à ordem seguinte. “Agora” comunica naturalmente a progressão imediata, sem exigir um valor causal forte.
- source_word: הָשֵׁב
  choice: traga de volta
  rationale: 'O hifil de שוב é causativo: Joabe deve fazer Absalão retornar. “Traga de volta” expressa essa força com naturalidade.'
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar menino, jovem ou servo. Como Absalão é adulto, “o jovem” evita infantilizá-lo e preserva a perspectiva relacional do rei.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalão
  rationale: Usa a forma tradicional e amplamente reconhecida do nome em português, mantendo sua aposição a “o jovem”.
