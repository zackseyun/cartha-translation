base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: pt
  text: 'Mas o rei disse: “Que ele se retire para sua própria casa e não veja o meu rosto.” Assim, Absalão se retirou para sua própria casa e não viu o rosto do rei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “ver o meu rosto” e “ver o rosto do rei” são expressões que podem significar estar na presença de alguém ou ser recebido por essa pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: vá / foi
  rationale: No contexto, o verbo indica que Absalão deve dirigir-se para sua casa, afastando-se da presença do rei. Em português corrente, “ir” comunica esse movimento com naturalidade; a repetição verbal entre ordem e cumprimento é preservada.
- source_word: בֵּיתוֹ
  choice: sua própria casa
  rationale: “Casa” mantém o sentido básico de בַּיִת, e “própria” torna natural o possessivo e ressalta o contraste com a presença do rei.
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: e não veja o meu rosto
  rationale: Mantém literalmente o idioma hebraico e a força volitiva da ordem, sem reduzir seu sentido apenas a uma audiência formal.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: e não viu o rosto do rei
  rationale: Preserva a repetição deliberada de “rosto” no relato do cumprimento da ordem e o destaque narrativo à negação de acesso pessoal.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Equivalente português direto e convencional de מֶלֶךְ.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמֶר
  choice: Mas o rei disse
  rationale: 'O waw narrativo admite sequência ou contraste. “Mas” expressa a mudança contextual: apesar de permitir o retorno de Absalão, o rei ainda lhe nega a presença.'
theological_decisions:
- issue: Idiotismo literal “ver o meu rosto / o rosto do rei” ou explicitação como acesso à presença ou audiência
  choice: Preservar o idiotismo literalmente no texto principal
  alternative: “não compareça à minha presença” / “não foi admitido à presença do rei”
  rationale: A formulação literal conserva a repetição e a força retórica do hebraico, sem especificar além do texto a natureza social ou formal do acesso negado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe da ordem foi naturalizada, enquanto o idioma concreto de “ver o rosto” foi preservado e explicado em nota.
