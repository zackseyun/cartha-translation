  yaml_path: translation/ot/2_samuel/014/028.yaml
  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: pt
  text: Assim, Absalão morou em Jerusalém durante dois anos completos e não viu o rosto do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «não viu o rosto do rei». A expressão hebraica indica que Absalão não teve audiência nem acesso pessoal ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: morou
  rationale: No contexto, ישׁב descreve residência continuada; “morou” é natural em português e preserva esse sentido.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução direta da expressão locativa, com a forma portuguesa consagrada do topônimo.
- source_word: שְׁנָתַיִם יָמִים
  choice: durante dois anos completos
  rationale: A expressão hebraica, literalmente “dois anos, dias”, indica a extensão integral do período; “dois anos completos” comunica essa força idiomática.
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: o rosto do rei
  rationale: Mantém a imagem concreta do hebraico, que neste contexto se refere ao acesso pessoal ou a uma audiência com o rei.
- source_word: לֹא רָאָה
  choice: não viu
  rationale: Reprodução direta e natural da negação verbal hebraica.
