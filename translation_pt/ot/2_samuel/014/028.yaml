  register: Português moderno, digno e acessível, com ordem natural. A conjunção foi vertida como “mas” para explicitar o contraste contextual entre morar em Jerusalém e continuar sem acesso ao rei; a expressão concreta “rosto do rei” foi preservada e explicada em nota.
