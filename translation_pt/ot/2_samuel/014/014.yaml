source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: pt
  text: Pois certamente morreremos; somos como água derramada no chão, que não pode mais ser recolhida. No entanto, Deus não tira a vida[a], mas faz planos para que o banido não continue afastado dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus não trata uma pessoa com parcialidade”. A frase hebraica é difícil e pode ser entendida de outras maneiras.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “para que o banido não seja expulso para longe dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a ligação argumentativa com o contexto anterior, introduzindo a razão apresentada pela mulher.
- source_word: מוֹת נָמוּת
  choice: certamente morreremos
  rationale: A construção com infinitivo absoluto intensifica a certeza da morte; esta formulação é natural em português e preserva a ênfase.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: somos como água derramada no chão
  rationale: Expressa de modo claro e natural a imagem da água que, uma vez derramada, não pode ser recuperada.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: que não pode mais ser recolhida
  rationale: O singular concorda naturalmente com “água”; “mais” comunica a irreversibilidade indicada pelo contexto.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: No entanto, Deus não tira a vida
  rationale: A frase hebraica é difícil. No fluxo do versículo, esta leitura cria um contraste entre a mortalidade humana e a ação divina em favor do banido. “Vida” representa נֶפֶשׁ como a pessoa viva, sem impor a ideia de uma alma separável.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: mas faz planos
  rationale: Traduz de modo idiomático a construção cognata hebraica, preservando a ideia de ação deliberada.
- source_word: לְבִלְתִּי יִדַּח
  choice: para que ... não continue afastado
  rationale: Comunica tanto a condição de afastamento quanto a intenção de revertê-la, sem tornar a frase artificial em português.
- source_word: מִמֶּנּוּ נִדָּח
  choice: o banido ... dele
  rationale: Preserva o singular substantivado e a relação pessoal expressa pelo pronome, mantendo a concisão do hebraico.
theological_decisions:
- issue: Sentido de וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Deus não tira a vida
  alternative: Deus não trata uma pessoa com parcialidade
  rationale: A leitura escolhida se ajusta melhor ao contraste imediato entre a morte irreversível e os planos divinos de restauração. Como a expressão é incomum e admite outra análise, a alternativa foi preservada em nota.
- issue: Nuance de לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: para que o banido não continue afastado dele
  alternative: para que o banido não seja expulso para longe dele
  rationale: A escolha destaca a restauração de quem já está banido, coerente com o contexto narrativo, enquanto a nota conserva a possibilidade de entender o verbo como uma nova expulsão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. “Banido” preserva o tema jurídico e relacional do contexto; “afastado dele” evita uma formulação excessivamente técnica. As notas mantêm as ambiguidades reais do hebraico sem sobrecarregar o texto principal.
