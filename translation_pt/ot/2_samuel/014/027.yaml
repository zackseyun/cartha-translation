base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: pt
  text: Absalão teve três filhos e uma filha, chamada Tamar. Ela era uma mulher de bela aparência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: «Ela era muito bonita». O hebraico diz literalmente: «uma mulher bela de aparência».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: Absalão teve
  rationale: A construção nifal com ל marca que os filhos nasceram a Absalão; em português corrente, «Absalão teve» expressa naturalmente a relação de paternidade sem sugerir que ele deu à luz.
- source_word: שְׁלוֹשָׁה בָנִים
  choice: três filhos
  rationale: בָנִים designa especificamente filhos do sexo masculino, distinção preservada no português.
- source_word: וּבַת אַחַת
  choice: e uma filha
  rationale: Tradução direta e idiomática da expressão numérica hebraica.
- source_word: וּשְׁמָהּ תָּמָר
  choice: chamada Tamar
  rationale: O sufixo feminino remete à filha recém-mencionada; «chamada Tamar» transmite de modo conciso e natural que esse era o nome dela.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: Ela era uma mulher
  rationale: Preserva o pronome feminino explícito e o substantivo אִשָּׁה sem introduzir ênfase indevida.
- source_word: יְפַת מַרְאֶה
  choice: de bela aparência
  rationale: Mantém a referência explícita à aparência física e reproduz de perto a forma da expressão hebraica, em linguagem portuguesa natural.
