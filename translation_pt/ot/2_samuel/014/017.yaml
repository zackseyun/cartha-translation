source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: pt
  text: 'Então a tua serva disse: “Que a palavra do meu senhor, o rei, traga descanso, pois meu senhor, o rei, é como o anjo de Deus[a] para discernir o bem e o mal[b]. E que Yahweh, teu Deus, esteja contigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “um anjo de Deus”; o termo hebraico também pode significar, de modo mais geral, “um mensageiro de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ouvir o bem e o mal”, expressão que, neste contexto, se refere a discernir ou julgar entre o bem e o mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: a tua serva
  rationale: O substantivo é feminino e designa uma serva ou escrava. Em português, “a tua serva” preserva naturalmente tanto o gênero da falante quanto sua postura deferente diante do rei.
- source_word: יִהְיֶה נָּא
  choice: Que ... traga
  rationale: A forma volitiva acompanhada de נָא expressa um pedido cortês. A construção portuguesa com “Que” comunica o desejo respeitoso sem soar artificial.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: a palavra do meu senhor, o rei
  rationale: דָּבָר pode significar palavra, assunto ou decisão. “Palavra” mantém a imagem hebraica e, no contexto, inclui o pronunciamento real que resolverá a questão.
- source_word: לִמְנוּחָה
  choice: traga descanso
  rationale: O substantivo מְנוּחָה denota descanso, repouso ou alívio. “Traga descanso” conserva a metáfora e comunica que a palavra do rei dará tranquilidade.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: como o anjo de Deus
  rationale: מַלְאָךְ pode designar mensageiro ou anjo. Neste elogio à percepção extraordinária do rei, “anjo de Deus” é a leitura contextual mais provável, sem ocultar a alternativa lexical na nota.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: para discernir o bem e o mal
  rationale: A expressão significa literalmente “ouvir o bem e o mal”, mas שׁמע pode ter sentido judicial de ouvir, compreender e julgar uma causa. “Discernir” comunica esse sentido no português atual, enquanto a nota preserva a forma literal.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: E que Yahweh, teu Deus
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no texto. O possessivo de segunda pessoa é mantido.
- source_word: יְהִי עִמָּךְ
  choice: esteja contigo
  rationale: A forma jussiva constitui uma bênção ou desejo. “Que ... esteja contigo” é seu equivalente natural e solene em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de מַלְאָךְ na comparação com o rei
  choice: anjo
  alternative: mensageiro
  rationale: A comparação exalta a capacidade de discernimento do rei e provavelmente alude a um ser celestial. Como o termo hebraico também pode significar “mensageiro”, essa possibilidade é registrada em nota.
- issue: Sentido judicial de שׁמע em “ouvir o bem e o mal”
  choice: discernir
  alternative: ouvir
  rationale: No contexto de uma petição ao rei, a expressão se refere à capacidade de avaliar e julgar. “Discernir” explicita esse uso contextual, e a nota conserva a formulação literal e sua tensão interpretativa.
translation_notes:
  register: Português contemporâneo, digno e de ampla compreensão, com formas de tratamento coerentes no singular (“tua”, “teu”, “contigo”). A tradução preserva a linguagem cortesã por meio de “a tua serva” e “meu senhor, o rei”, evitando tanto arcaísmo excessivo quanto coloquialismo.
