  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: pt
  text: Em todo o Israel, não havia homem tão belo e tão elogiado quanto Absalão.[a] Da planta dos pés ao alto da cabeça, não havia nele defeito algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muito elogiado” ou “elogiado sobremaneira”. A expressão hebraica indica o grau extraordinário dos elogios ligados à aparência de Absalão.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: como Absalão
  rationale: A construção introduz Absalão como termo de comparação; em português, a comparação superlativa fica natural em “não havia homem tão belo como Absalão”, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: Em todo o Israel, não havia homem tão belo
  rationale: 'A formulação comunica a comparação superlativa implícita: nenhum homem em Israel se igualava a Absalão em beleza.'
- source_word: יָפֶה
  choice: belo
  rationale: “Belo” é natural para descrever a aparência masculina em português e mantém o registro digno do texto.
- source_word: לְהַלֵּל מְאֹד
  choice: ele era extremamente elogiado
  rationale: A expressão indica intensidade excepcional de elogio. A oração independente torna a construção compacta do hebraico clara em português sem perder sua força.
- source_word: מִכַּף רַגְלוֹ
  choice: da planta dos pés
  rationale: כַּף, quando usado com “pé”, designa a planta. O plural é idiomático em português na expressão corporal completa.
- source_word: וְעַד קָדְקֳדוֹ
  choice: ao alto da cabeça
  rationale: קָדְקֹד designa o topo ou a parte mais alta da cabeça; a expressão completa forma um merismo que abrange o corpo inteiro.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: não havia nele defeito algum
  rationale: מוּם denota defeito ou imperfeição física. “Defeito algum” é claro, enfático e adequado à descrição corporal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação divide a construção hebraica compacta em duas afirmações naturais, preservando tanto a beleza incomparável de Absalão quanto a intensidade dos elogios recebidos.
