base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: pt
  text: 'E agora vim falar deste assunto ao rei, meu senhor, porque o povo me amedrontou.[a] E a sua serva disse: “Por favor, deixe-me falar com o rei; talvez o rei atenda ao pedido de sua serva”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque o povo me deixou com medo”. O verbo hebraico tem aqui sentido causativo, e não o sentido de que o povo tinha medo dela.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “faça a palavra de sua serva”. Nesse contexto, “palavra” se refere ao pedido ou apelo dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação narrativa expressa por וְ quanto o valor temporal de עַתָּה.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: vim falar
  rationale: Expressa com naturalidade em português a ação de vir com a finalidade de falar, mantendo sua relação com a situação presente.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: ao rei, meu senhor
  rationale: Conserva o título real e a forma respeitosa de tratamento em ordem natural no português.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: deste assunto
  rationale: דָּבָר designa aqui o caso ou a questão apresentada ao rei, não apenas uma palavra isolada.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: porque o povo me amedrontou
  rationale: O piel de ירא tem sentido causativo, isto é, fazer alguém ter medo; a tradução evita a leitura menos provável de que o povo tivesse medo dela.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Então esta sua serva disse
  rationale: Mantém a autodesignação feminina e humilde própria da linguagem da corte, com um demonstrativo que torna a expressão idiomática em português.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Por favor, deixe-me falar com o rei
  rationale: O coortativo com נָא comunica uma resolução formulada com deferência; “deixe-me falar” reproduz bem esse valor volitivo.
- source_word: אוּלַי
  choice: talvez
  rationale: Preserva sem reforçar nem eliminar a incerteza expressa no hebraico.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: o rei atenda ao pedido de sua serva
  rationale: A expressão idiomática significa fazer ou cumprir a palavra apresentada pela serva; “atenda ao pedido” comunica esse sentido em português natural, enquanto a nota registra a forma literal.
