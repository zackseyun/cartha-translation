base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: pt
  text: 'Então ele disse aos seus servos: “Vejam! O campo de Joabe fica ao lado do meu[a], e ele tem cevada ali. Vão e ponham fogo nele”. E os servos de Absalão puseram fogo no campo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “junto à minha mão”, expressão que aqui significa que o campo ficava ao lado da propriedade de Absalão.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: campo
  rationale: No contexto, o substantivo designa uma área de terra cultivada pertencente a Joabe; “campo” é a forma mais natural e clara em português.
- source_word: אֶל יָדִי
  choice: ao lado do meu
  rationale: A expressão, literalmente relacionada à “mão”, funciona aqui como um idiomatismo espacial que indica que os terrenos eram contíguos.
- source_word: שְׂעֹרִים
  choice: cevada
  rationale: O plural hebraico designa a cevada como cultura agrícola; em português, o singular coletivo é o uso normal.
- source_word: וְהוּצִיתִהָ
  choice: ponham fogo nele
  rationale: O verbo causativo expressa a ação de incendiar. O pronome retoma “campo”, que é masculino em português.
- source_word: וַיַּצִּתוּ
  choice: puseram fogo
  rationale: A repetição da mesma expressão preserva a correspondência lexical entre a ordem dada e seu cumprimento.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: seus servos / os servos de Absalão
  rationale: “Servos” se ajusta ao contexto de uma casa aristocrática sem especificar além do texto se eram escravizados ou apenas subordinados.
- source_word: רְאוּ
  choice: Vejam!
  rationale: O imperativo chama a atenção dos servos para o campo próximo e soa natural no discurso direto.
- source_word: לְכוּ
  choice: Vão
  rationale: Reproduz de modo direto o imperativo de movimento que introduz a ordem.
