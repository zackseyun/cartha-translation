base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: pt
  text: Então Absalão mandou chamar Joabe, para que Joabe o enviasse ao rei, mas Joabe não quis ir até ele.[a] Absalão mandou chamá-lo de novo, pela segunda vez, mas ele não quis ir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas Joabe se recusou a ir até ele”. Literalmente, “não quis ir até ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Absalão mandou chamar Joabe
  rationale: Embora שׁלח signifique literalmente “enviar”, a construção com אֶל־יוֹאָב e a oração de propósito indica que Absalão enviou alguém ou uma mensagem para chamar Joabe. “Mandou chamar” expressa esse sentido idiomático em português natural.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: para que este o enviasse ao rei
  rationale: 'A oração infinitiva exprime o propósito de Absalão: queria que Joabe providenciasse seu acesso ao rei. “Este” identifica Joabe como sujeito, enquanto “o” representa Absalão, evitando uma ambiguidade pronominal excessiva sem explicitar mais do que o hebraico.'
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: mas Joabe não quis ir até ele
  rationale: אָבָה significa “querer, estar disposto, consentir”; “não quis” preserva essa nuance sem intensificá-la para “recusou-se”. Em português, “ir até ele” é mais natural do ponto de vista narrativo do que o hebraísmo “vir a ele”.
- source_word: וַיִּשְׁלַח עוֹד שֵׁנִית
  choice: Absalão mandou chamá-lo de novo, pela segunda vez
  rationale: A tradução conserva tanto עוֹד (“de novo”) quanto שֵׁנִית (“pela segunda vez”), mantendo a repetição enfática do texto hebraico.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: Então ... mas ... de novo ... mas
  rationale: A coordenação e a repetição reproduzem o avanço narrativo e o contraste insistente do original, em linguagem portuguesa corrente.
