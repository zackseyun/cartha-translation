  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: pt
  text: 'O rei lhe perguntou[a]: “O que a aflige?” Ela respondeu: “De fato, sou viúva[b], e meu marido morreu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que há com você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ai de mim! Sou viúva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: O que aconteceu?
  rationale: A expressão idiomática hebraica, literalmente “o que há para você?”, pergunta qual é o problema ou a aflição da pessoa. “O que aconteceu?” é natural em português neste contexto, enquanto a nota preserva a alternativa mais próxima da forma idiomática.
- source_word: אֲבָל
  choice: De fato
  rationale: Aqui אֲבָל funciona melhor como partícula asseverativa, enfatizando a declaração da mulher, e não como a conjunção adversativa “mas”. “De fato” conserva essa ênfase sem impor uma exclamação de lamento.
- source_word: אִשָּׁה אַלְמָנָה
  choice: sou viúva
  rationale: Embora o hebraico use “mulher” com o qualificativo “viúva”, o português expressa naturalmente a mesma ideia por “sou viúva”.
- source_word: וַיָּמָת אִישִׁי
  choice: meu marido morreu
  rationale: Neste contexto, אִישִׁי significa “meu marido”, e o verbo narrativo indica que ele morreu. O pretérito perfeito é a forma portuguesa direta e natural.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Tradução direta do substantivo definido.
- source_word: וַתֹּאמֶר
  choice: Ela respondeu
  rationale: Embora o verbo seja literalmente “ela disse”, “respondeu” explicita naturalmente a função da fala no diálogo sem alterar seu conteúdo.
