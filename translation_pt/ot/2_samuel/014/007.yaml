source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: pt
  text: 'E eis que toda a família se levantou contra sua serva e disse: “Entregue aquele que feriu o próprio irmão, para que o matemos pela vida do irmão que ele matou; assim, destruiremos também o herdeiro”. Desse modo, eles apagarão a brasa que me restou[a], não deixando ao meu marido nem nome nem descendência sobre a face da terra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha última brasa”. O hebraico emprega a imagem de uma brasa ainda acesa; no contexto, ela evoca o descendente sobrevivente e a esperança de continuidade da família.'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que não restariam ao marido nem a preservação de seu nome nem a continuidade de sua linhagem na terra.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Marca a introdução enfática da situação e preserva o tom narrativo digno sem reduzir a expressão a uma simples conjunção.
- source_word: שִׁפְחָתֶךָ
  choice: esta sua serva
  rationale: É uma autodesignação feminina e deferente diante do rei; a formulação é natural em português e conserva tanto o gênero quanto a humildade do hebraico.
- source_word: קָמָה ... עַל
  choice: se levantou contra
  rationale: Expressa oposição hostil, não apenas o ato físico de ficar em pé.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: toda a família
  rationale: Refere-se ao grupo familiar ampliado; 'família' é acessível e 'toda' preserva a força coletiva.
- source_word: תְּנִי
  choice: Entregue
  rationale: No contexto judicial, trata-se da exigência de entregar o filho aos parentes que desejam matá-lo.
- source_word: מַכֵּה אָחִיו
  choice: aquele que feriu o próprio irmão
  rationale: Mantém o valor amplo do particípio de נכה e evita antecipar 'matou', que aparece explicitamente depois.
- source_word: וּנְמִתֵהוּ
  choice: para que o matemos
  rationale: Reproduz de modo direto e natural a intenção expressa pela forma volitiva hebraica.
- source_word: בְּנֶפֶשׁ אָחִיו
  choice: pela vida do irmão
  rationale: Conserva o idioma jurídico de retribuição, vida por vida, sem explicá-lo além do texto.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: assim, destruiremos também o herdeiro
  rationale: Preserva a gravidade da intenção de eliminar o filho sobrevivente em sua condição de herdeiro.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: eles apagarão a brasa que me restou
  rationale: Mantém a metáfora hebraica da última brasa viva como imagem do descendente sobrevivente e da continuidade da casa.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: nome nem descendência
  rationale: '''Nome'' preserva a memória e identidade familiar; ''descendência'' comunica no contexto a linhagem sobrevivente implicada por שְׁאֵרִית.'
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Preserva a expressão espacial solene do hebraico em português claro.
