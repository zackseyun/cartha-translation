  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: pt
  text: 'Então o rei perguntou: “Joabe tem participação com você em tudo isso?”[a] A mulher respondeu: “Tão certo como o senhor vive, meu senhor, o rei,[b] ninguém pode se desviar para a direita nem para a esquerda de nada do que meu senhor, o rei, disse.[c] Pois Joabe, seu servo, me ordenou, e foi ele quem pôs na boca de sua serva todas estas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a mão de Joabe está com você”. A “mão” representa sua participação, agência ou influência; o rei pergunta se Joabe estava envolvido em tudo aquilo.
    reason: cultural_note
  - marker: b
    text: Literalmente, “Tão certo como vive a sua alma, meu senhor, o rei”. Trata-se de uma fórmula hebraica de juramento equivalente a “Tão certo como o senhor vive”.
    reason: lexical_alternative
  - marker: c
    text: “Desviar-se para a direita nem para a esquerda” é uma expressão hebraica que, aqui, significa afastar-se, contradizer ou tentar contornar o que o rei disse.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: A mão de Joabe está com você
  rationale: Conserva a imagem hebraica da “mão” como agência, participação ou influência, sem eliminar a pergunta do rei sobre o envolvimento de Joabe.
- source_word: בְּכָל זֹאת
  choice: em tudo isso
  rationale: Retoma de modo natural toda a trama ou situação exposta pela mulher.
- source_word: חֵי נַפְשְׁךָ
  choice: Tão certo como o senhor vive
  rationale: Expressa em português corrente e solene a fórmula hebraica de juramento; a forma literal com “alma” é registrada em nota.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: ninguém pode desviar-se para a direita nem para a esquerda
  rationale: Preserva a metáfora direcional e comunica a impossibilidade de contradizer, contornar ou afastar-se do que o rei discerniu e disse.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: de nada do que ... disse
  rationale: A preposição integra a ideia de desviar-se das palavras do rei; “disse” é natural e fiel ao contexto.
- source_word: עַבְדְּךָ יוֹאָב
  choice: o seu servo Joabe
  rationale: “Servo” é a forma adequada de referência cortesã e preserva o substantivo masculino.
- source_word: צִוָּנִי
  choice: me deu a ordem
  rationale: Comunica claramente que Joabe lhe deu uma ordem, mantendo a força de autoridade do verbo hebraico.
- source_word: שָׂם בְּפִי
  choice: pôs na boca
  rationale: Mantém a expressão concreta hebraica para fornecer a alguém as palavras que deveria dizer.
- source_word: שִׁפְחָתְךָ
  choice: desta sua serva
  rationale: Preserva o feminino e a humilde autodesignação cortesã da mulher; “desta” torna a expressão natural em português.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: O contexto indica as falas específicas que Joabe colocou na boca da mulher, favorecendo “palavras” em vez de “coisas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fala cortesã conserva “meu senhor, o rei” e as autodesignações “servo” e “serva”. As imagens hebraicas da mão, das direções e da boca foram mantidas quando permanecem compreensíveis, com notas para esclarecer os dois primeiros idiomas e a fórmula de juramento.
