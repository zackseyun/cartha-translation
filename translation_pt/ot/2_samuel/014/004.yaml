base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: pt
  text: 'Então a mulher de Tecoa disse ao rei[a]. Ela caiu com o rosto em terra, prostrou-se e disse: “Salva-me[b], ó rei!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a mulher tecoíta”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Salva, ó rei”; em português, o objeto implícito é explicitado: “Salva-me, ó rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: a mulher de Tecoa
  rationale: O adjetivo gentílico identifica a mulher por sua procedência. “A mulher de Tecoa” é natural em português e conserva claramente a referência geográfica.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: disse ao rei
  rationale: אָמַר significa normalmente “dizer”. A formulação direta é natural em português e preserva a repetição do verbo antes da fala citada.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: Ela caiu com o rosto em terra
  rationale: A expressão hebraica descreve literalmente uma queda sobre o rosto em direção ao chão; esta forma portuguesa transmite com clareza a postura de profunda súplica.
- source_word: וַתִּשְׁתָּחוּ
  choice: prostrou-se
  rationale: O verbo denota inclinar-se ou prostrar-se em reverência ou súplica. “Prostrou-se” distingue o gesto da queda já mencionada sem lhe atribuir necessariamente sentido de adoração.
- source_word: הוֹשִׁיעָה
  choice: Salva-me
  rationale: O imperativo de יָשַׁע expressa um pedido urgente de livramento. O objeto “me”, implícito no contexto, é necessário para uma formulação portuguesa natural.
- source_word: הַמֶּלֶךְ
  choice: ó rei
  rationale: O substantivo funciona como vocativo. “Ó rei” preserva o tom formal e urgente da petição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se o vocativo solene “ó rei” e emprega-se “prostrou-se” para representar com precisão o gesto de submissão.
