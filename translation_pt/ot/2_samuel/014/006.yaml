  text: וּ/לְ/שִׁפְחָֽתְ/ךָ֙ שְׁנֵ֣י בָנִ֔ים וַ/יִּנָּצ֤וּ שְׁנֵי/הֶם֙ בַּ/שָּׂדֶ֔ה וְ/אֵ֥ין מַצִּ֖יל בֵּֽינֵי/הֶ֑ם וַ/יַּכּ֧/וֹ הָ/אֶחָ֛ד אֶת הָ/אֶחָ֖ד וַ/יָּ֥מֶת אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: pt
  text: E esta sua serva tinha dois filhos[a]. Os dois brigaram no campo, e não havia ninguém para intervir e separá-los[b]. Então um feriu o outro e o matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta sua criada”. O termo hebraico é a maneira humilde e respeitosa como uma mulher se refere a si mesma ao falar com o rei.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não havia quem livrasse entre eles”, isto é, ninguém que interviesse para separá-los.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: esta sua serva
  rationale: שִׁפְחָה designa uma serva ou escrava, mas aqui funciona como autodesignação feminina respeitosa diante do rei. “Esta sua serva” preserva o gênero, a humildade e o caráter cortesão em português natural.
- source_word: שְׁנֵי בָנִים
  choice: dois filhos
  rationale: בָנִים refere-se especificamente a descendentes do sexo masculino neste contexto.
- source_word: וַיִּנָּצוּ
  choice: brigaram
  rationale: O verbo descreve uma contenda que aqui é física, como mostra seu desfecho fatal. “Brigaram” é corrente e abrange naturalmente o confronto físico.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução locativa direta e natural.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: não havia ninguém para intervir e separá-los
  rationale: מַצִּיל significa literalmente alguém que livra ou resgata. No contexto da briga, denota quem intervém entre os dois para impedir o dano; a tradução explicita essa função contextual sem esconder o sentido literal, registrado em nota.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: um feriu o outro
  rationale: נכה significa golpear ou ferir. “Feriu” mantém a ação distinta de seu resultado fatal, expresso na oração seguinte.
- source_word: וַיָּמֶת אֹתוֹ
  choice: e o matou
  rationale: 'Embora derivada de מות, “morrer”, a construção com objeto direto tem sentido causativo: ele fez o outro morrer.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Esta sua serva” soa natural como autodesignação respeitosa; “brigaram” comunica a contenda física sem arcaísmo. A sequência foi dividida em três frases para clareza, preservando a progressão narrativa do hebraico.
