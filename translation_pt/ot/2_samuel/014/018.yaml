base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: pt
  text: 'Então o rei respondeu à mulher: “Por favor, não esconda de mim nada do que eu lhe perguntar.” A mulher disse: “Fale[a], por favor, meu senhor, o rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Que fale, por favor, meu senhor, o rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A combinação hebraica introduz uma resposta verbal; em português, “respondeu” comunica naturalmente a sequência do diálogo sem a redundância pouco idiomática “respondeu e disse”.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: Por favor, não esconda de mim
  rationale: Preserva tanto a proibição quanto o tom cortês de נָא; “esconder de mim” expressa com clareza a ideia de não reter informação.
- source_word: דָּבָר
  choice: nada
  rationale: Embora o substantivo possa significar “coisa” ou “palavra”, depois de uma proibição a formulação negativa “não... nada” é natural em português e conserva o sentido indefinido.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: do que eu lhe perguntar
  rationale: O futuro do subjuntivo é idiomático no português para aquilo que o rei está prestes a perguntar e evita sugerir várias perguntas já em andamento.
- source_word: יְדַבֶּר נָא
  choice: Fale, por favor
  rationale: O jussivo de terceira pessoa é uma forma deferente de dirigir-se ao rei; o imperativo cortês transmite essa função com naturalidade em português.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém o tratamento respeitoso e o título real; a vírgula explicita a aposição e evita a leitura de “senhor-rei” como título composto.
theological_decisions: []
