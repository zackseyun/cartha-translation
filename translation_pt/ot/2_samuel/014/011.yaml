    issue: 'A nota a diz: "Literalmente, ‘o resgatador do sangue’".'
    rationale: גֹּאֵל tem campo semântico de parente com dever de resgate/vingança, mas "resgatador" não é uma tradução literal nem um equivalente técnico seguro aqui. A nota pode explicar a função legal do vingador sem introduzir uma falsa literalidade.
  - severity: low
    issue: '"Nem um só cabelo" soa menos idiomático do que "nem um só fio de cabelo".'
    rationale: A imagem hebraica é preservada de modo mais natural em português por "fio de cabelo", sem alteração de sentido.
