base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: pt
  text: 'Então ela disse: “Que o rei se lembre, por favor, de Yahweh, seu Deus, para que o vingador do sangue[a] não continue a destruir e eles não exterminem meu filho.” Ele respondeu: “Tão certo como Yahweh vive, nem um só fio de cabelo de seu filho cairá no chão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vingador de sangue”. Trata-se do parente responsável por vingar a morte de um membro da família.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que afirma proteção completa.
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא הַמֶּלֶךְ
  choice: Que o rei se lembre, por favor
  rationale: O jussivo com נָא expressa um pedido respeitoso. A terceira pessoa preserva a deferência da mulher ao dirigir-se ao rei.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino e o possessivo, pelo qual a mulher apela à responsabilidade do rei diante de seu Deus.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: para que o vingador do sangue não continue destruindo
  rationale: A formulação comunica o aspecto continuativo ou multiplicador de רבה sem tornar a frase artificial em português, preservando o título jurídico גֹּאֵל הַדָּם.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: e eles não exterminem meu filho
  rationale: O pronome indefinido mantém o plural inesperado do verbo hebraico sem especificar além do texto os agentes envolvidos; “exterminem” distingue שׁמד do verbo paralelo שׁחת.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Equivalente português natural e solene da fórmula hebraica de juramento.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: nem um só cabelo de seu filho cairá no chão
  rationale: Depois da fórmula de juramento, אִם tem força de negação enfática. A expressão portuguesa conserva a imagem hebraica e comunica proteção completa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade dos agentes no verbo plural יַשְׁמִידוּ
  choice: eles
  alternative: os vingadores do sangue; os parentes
  rationale: O hebraico passa do singular “o vingador do sangue” a um verbo plural. A tradução conserva essa tensão gramatical e evita identificar explicitamente os agentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pedido mantém a deferência ao rei, e o juramento conserva sua solenidade. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
