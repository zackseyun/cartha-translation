base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: pt
  text: Então Joabe se levantou, foi a Gesur e trouxe Absalão para Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trouxe Absalão de volta para Jerusalém”. O contexto indica o retorno do exílio, embora “de volta” não esteja explícito no verbo hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום faz a narrativa avançar e indica que Joabe se levantou para agir; “se levantou” preserva esse valor sem o reduzir a uma simples partida.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: הלך, nesta sequência narrativa, tem o sentido comum e direto de “ir”; “foi” é natural e não acrescenta detalhes sobre a viagem.
- source_word: גְּשׁוּרָה
  choice: a Gesur
  rationale: O hê direcional indica movimento em direção a Gesur; em português, isso se expressa naturalmente com “a Gesur”.
- source_word: וַיָּבֵא
  choice: trouxe
  rationale: O hifil de בוא significa “fazer vir”, isto é, “trazer”. O contexto permite “trouxe de volta”, mas a ideia de retorno não está expressa no próprio verbo e fica registrada em nota.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalão
  rationale: O marcador de objeto direto introduz o nome próprio, vertido na forma portuguesa tradicional e amplamente reconhecida.
- source_word: יְרוּשָׁלִַם
  choice: para Jerusalém
  rationale: Embora não haja preposição separada no hebraico, a sintaxe apresenta Jerusalém como destino; “para” torna essa relação natural e explícita em português.
- source_word: וַ
  choice: Então / e
  rationale: A cadeia de formas com waw apresenta ações narrativas sucessivas. “Então” introduz naturalmente a consequência prática do versículo anterior, e “e” liga as ações seguintes sem alterar sua relação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A formulação mantém a sequência compacta do hebraico e preserva na nota a diferença entre o sentido lexical de “trazer” e a inferência contextual de retorno.
