base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: pt
  text: 'Então a mulher de Tecoa disse ao rei: “Que a culpa[a] recaia sobre mim, ó rei, meu senhor, e sobre a casa de meu pai; mas o rei e seu trono sejam inocentes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a iniquidade” ou “a responsabilidade”; o termo hebraico pode indicar culpa, transgressão ou a responsabilidade e as consequências decorrentes dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: a mulher de Tecoa
  rationale: O gentílico identifica a mulher por sua origem; esta formulação é natural em português e preserva a referência geográfica.
- source_word: עָלַי
  choice: sobre mim
  rationale: Preserva a posição enfática da expressão e a assunção pessoal da responsabilidade.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ó rei, meu senhor
  rationale: Mantém a deferência da fórmula de tratamento e soa natural no contexto de uma fala dirigida diretamente ao rei.
- source_word: הֶעָוֺן
  choice: a culpa
  rationale: No contexto jurídico, comunica responsabilidade ou imputação sem restringir o termo hebraico a castigo ou perversidade moral.
- source_word: וְעַל בֵּית אָבִי
  choice: e sobre a casa de meu pai
  rationale: Conserva o idioma hebraico e sua dimensão familiar e jurídica.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: mas que o rei e seu trono
  rationale: A conjunção introduz um contraste de sentido; “trono” permanece como metonímia da autoridade régia e possivelmente da dinastia.
- source_word: נָקִי
  choice: fiquem inocentes
  rationale: Expressa a isenção de responsabilidade pretendida pela mulher. O plural ajusta naturalmente o adjetivo ao sujeito composto em português.
theological_decisions:
- issue: Fórmula de isenção do rei
  choice: que o rei e seu trono fiquem inocentes
  alternative: que o rei e seu trono fiquem livres de culpa
  rationale: A frase trata da responsabilidade jurídica e moral ligada à decisão em questão, não de uma afirmação geral sobre a perfeição moral do rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para uma fala régia natural, sem eliminar a ênfase de “sobre mim”. O marcador da nota aparece após a frase à qual se aplica.
