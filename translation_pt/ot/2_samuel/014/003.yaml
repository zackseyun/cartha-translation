base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: pt
  text: Então vá até o rei e fale com ele desta maneira. E Joabe pôs as palavras na boca dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pôr as palavras na boca” é uma expressão idiomática hebraica que significa fornecer a alguém o que deve dizer.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Então vá
  rationale: O perfeito qal na 2ª pessoa feminina singular, ligado por וּ em uma sequência de instruções, tem força diretiva. “Então vá” expressa com naturalidade a ação seguinte ordenada à mulher.
- source_word: אֶל־הַמֶּלֶךְ
  choice: até o rei
  rationale: אֶל indica movimento em direção a alguém. “Até o rei” é natural em português e preserva essa ideia de aproximação.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: e fale com ele
  rationale: דבר com אֶל significa normalmente “falar com”. A forma verbal continua a sequência de instruções dirigida à mulher.
- source_word: כַּדָּבָר הַזֶּה
  choice: desta maneira
  rationale: A expressão indica a maneira ou o conteúdo da fala que Joabe lhe fornece. “Desta maneira” evita a tradução rígida de דָבָר como “palavra” e mantém o demonstrativo.
- source_word: וַיָּשֶׂם
  choice: pôs
  rationale: שׂים significa “pôr, colocar”. A escolha conserva a imagem concreta da expressão idiomática hebraica.
- source_word: אֶת־הַדְּבָרִים
  choice: as palavras
  rationale: O plural se refere às palavras específicas do discurso preparado por Joabe; a tradução concreta preserva o vínculo com a expressão “na boca dela”.
- source_word: בְּפִיהָ
  choice: na boca dela
  rationale: A tradução literal preserva a vívida expressão idiomática hebraica, esclarecida em nota para leitores modernos.
