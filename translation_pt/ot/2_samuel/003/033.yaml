  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: pt
  text: 'O rei entoou uma lamentação por Abner e disse: “Deveria Abner morrer como morre um insensato?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Morreria Abner como morre um insensato?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: entoou uma lamentação
  rationale: O verbo קונן se refere a proferir ou entoar um lamento fúnebre. A expressão deixa claro que as palavras seguintes formam uma lamentação, e não apenas uma declaração de tristeza.
- source_word: אֶל אַבְנֵר
  choice: por Abner
  rationale: Com um verbo de lamentação, אֶל indica a pessoa que é objeto do lamento. Em português, “por Abner” expressa isso com naturalidade.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido do hebraico, que se refere a Davi no contexto, sem substituir o título pelo nome próprio.
- source_word: וַיֹּאמַר
  choice: disse
  rationale: Reproduz o verbo narrativo comum אמר sem especificar além do texto se as palavras foram cantadas, recitadas ou simplesmente pronunciadas.
- source_word: הַכְּמוֹת ... יָמוּת
  choice: Deveria ... morrer como morre
  rationale: A construção comparativa introduz uma pergunta retórica de protesto. Esta formulação comunica em português corrente tanto a comparação quanto a força da lamentação.
- source_word: נָבָל
  choice: um insensato
  rationale: נבל pode indicar alguém tolo e moralmente desprezível. “Insensato” preserva a linguagem elevada e a conotação moral sem restringir o sentido a “canalha” ou “ímpio”.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions: []
