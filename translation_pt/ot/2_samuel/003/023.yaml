base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: pt
  text: 'Quando Joabe e todo o exército que estava com ele chegaram, informaram Joabe: “Abner, filho de Ner, veio ao rei, e o rei o deixou partir, e ele partiu em paz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצָּבָא
  choice: o exército
  rationale: Neste contexto, refere-se à força militar que acompanhava Joabe; mantém o sentido coletivo do hebraico.
- source_word: בָּאוּ
  choice: chegaram
  rationale: O verbo בוא, aqui no contexto do retorno de Joabe e suas tropas, é expresso naturalmente como “chegaram”.
- source_word: וַיַּגִּדוּ ... לֵאמֹר
  choice: 'contaram ...:'
  rationale: A fórmula hebraica introduz discurso direto; em português atual, dois-pontos comunicam a mesma função sem o redundante “dizendo”.
- source_word: אֶל הַמֶּלֶךְ
  choice: veio falar com o rei
  rationale: Embora אֶל indique literalmente movimento “até/ao” rei, “veio falar com” torna explícita em português a aproximação pessoal implícita no contexto, sem especificar o conteúdo da audiência.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: o rei o deixou partir
  rationale: O sujeito implícito é o rei. “Deixou partir” preserva o sentido de despedir/liberar sem sugerir expulsão.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Mantém a expressão hebraica, indicando partida segura e sem hostilidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. O sujeito “o rei” foi repetido para evitar a ambiguidade pronominal artificial em português; a sequência narrativa e a expressão “em paz” foram preservadas.
