base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: pt
  text: Sepultaram Abner em Hebrom, e o rei levantou a voz e chorou junto ao túmulo de Abner[a], e todo o povo chorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltado para o túmulo de Abner”. A preposição hebraica costuma indicar direção, mas, neste contexto, pode expressar a posição do rei junto ao túmulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Sepultaram
  rationale: O qal wayyiqtol de קבר expressa a ação narrativa de sepultar. A conjunção inicial não precisa ser reproduzida, pois a sequência fica clara em português.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: A preposição בְּ indica aqui o local do sepultamento; “em Hebrom” é a formulação portuguesa natural.
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ
  choice: Então o rei levantou a voz
  rationale: A expressão idiomática hebraica descreve uma lamentação audível e intensa. “Levantou a voz” conserva sua forma literária e é compreensível em português; “Então” explicita com naturalidade a progressão narrativa do wayyiqtol.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: בכה significa chorar ou prantear. “Chorou” é atual, digno e natural no contexto fúnebre.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: junto ao túmulo de Abner
  rationale: אֶל normalmente indica direção (“para”, “em direção a”), mas neste contexto pode descrever a orientação ou posição do rei em relação ao túmulo. “Junto ao” comunica naturalmente a cena sem excluir por completo a nuance direcional.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: e todo o povo também chorou
  rationale: Mantém a repetição de בכה e traduz כָּל־הָעָם naturalmente. “Também” torna explícita a participação do povo no choro iniciado pelo rei, já implícita na coordenação hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. “Sepultaram” preserva o tom funerário; “chorou” evita um arcaísmo desnecessário. A nota conserva a ambiguidade da preposição אֶל.
