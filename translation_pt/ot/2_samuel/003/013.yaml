base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: pt
  text: 'Ele disse: “Está bem. Farei uma aliança com você. Só lhe peço uma coisa: você não verá o meu rosto[a] sem antes trazer Mical, filha de Saul, quando vier ver o meu rosto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você não comparecerá diante de mim sem antes trazer Mical, filha de Saul, quando vier comparecer diante de mim”. O hebraico diz literalmente “ver o meu rosto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Está bem
  rationale: Expressa de modo natural a breve aceitação da proposta por Davi, sem ampliar o hebraico.
- source_word: אֶכְרֹת ... בְּרִית
  choice: Farei uma aliança
  rationale: Traduz naturalmente o idiomatismo hebraico, literalmente “cortar uma aliança”, preservando seu caráter formal.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Só lhe peço uma coisa
  rationale: Comunica a restrição e o único pedido de Davi em português corrente, sem intensificá-lo como exigência.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: você não verá o meu rosto
  rationale: Mantém a expressão hebraica e sua possível nuance de ser recebido em audiência, deixando a alternativa idiomática na nota.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: sem antes trazer
  rationale: Reproduz de maneira concisa a condição exceptiva e a prioridade temporal da ação.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mical, filha de Saul
  rationale: Forma appositiva natural que preserva a identificação hebraica.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: quando vier ver o meu rosto
  rationale: Preserva a repetição deliberada da expressão “ver o meu rosto” e mantém boa fluidez em português.
