  source_fidelity: 'O texto verte com fidelidade a afirmação de Joabe: o perfeito יָדַעְתָּ é adequadamente expresso como estado presente em «Você conhece», e os infinitivos de propósito são preservados em «veio para enganar... descobrir... e saber». «Entradas e saídas» mantém o merismo hebraico de movimentos/atividades, ainda que em ordem idiomática portuguesa. «Tudo o que você está fazendo» comunica legitimamente o aspecto em curso do particípio עֹשֶׂה.'
