source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: pt
  text: 'Você conhece Abner, filho de Ner: ele veio para enganar você[a], descobrir suas entradas e saídas[b] e saber tudo o que você está fazendo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seduzir você», «atrair você» ou «persuadir você». O verbo hebraico pode indicar sedução, persuasão ou engano; neste contexto hostil, «enganar» parece mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «sua saída e sua entrada», expressão que abrange todos os deslocamentos ou atividades de uma pessoa.'
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Você conhece
  rationale: O perfeito qal pode expressar um estado presente. Aqui Joabe afirma, de modo acusatório, que Davi conhece o caráter ou as intenções de Abner.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, filho de Ner
  rationale: Mantém os nomes transliterados e verte naturalmente a expressão hebraica de filiação.
- source_word: כִּי
  choice: ':'
  rationale: O sinal de dois-pontos introduz em português o conteúdo daquilo que Davi supostamente sabe, evitando uma construção pesada com «que» depois de «conhece Abner».
- source_word: לְפַתֹּתְךָ
  choice: para enganar você
  rationale: O verbo פתה pode indicar seduzir, atrair, persuadir ou enganar; o contexto político hostil favorece «enganar».
- source_word: בָּא
  choice: ele veio
  rationale: O passado simples corresponde ao perfeito no contexto narrativo e indica a visita já realizada.
- source_word: לָדַעַת
  choice: descobrir / saber
  rationale: Os dois infinitivos expressam propósito e aquisição de informação. A variação em português evita repetição artificial sem apagar o paralelismo de sentido.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: suas entradas e saídas
  rationale: Preserva o merismo hebraico em uma ordem idiomática natural em português, indicando o conjunto dos deslocamentos ou atividades de Davi.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: tudo o que você está fazendo
  rationale: A construção com gerúndio comunica o aspecto contínuo sugerido pelo particípio עֹשֶׂה.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Você» mantém a acusação direta sem arcaísmo. A formulação preserva a ambiguidade lexical relevante em nota e mantém, no texto, o idioma de movimento em forma natural portuguesa.
