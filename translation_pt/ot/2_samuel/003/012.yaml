base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: pt
  text: 'Então Abner enviou mensageiros a Davi em nome de Abner[a], dizendo: “A quem pertence a terra?”[b] E dizendo: “Faça uma aliança comigo; e eis que minha mão está com você[c], para fazer todo o Israel passar para o seu lado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seu lugar”. O hebraico indica que os mensageiros agiam como representantes de Abner.'
    reason: alternative_reading
  - marker: b
    text: A pergunta hebraica é breve e pode envolver tanto a posse da terra quanto o direito de governá-la.
    reason: ambiguity
  - marker: c
    text: 'Hebraico: “minha mão está com você”, expressão que comunica apoio, influência ou poder colocado a favor de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: em seu nome
  rationale: Neste contexto, a expressão indica que os mensageiros agiam como representantes de Abner. “Em seu nome” é natural em português e preserva a ideia de representação.
- source_word: לְמִי אָרֶץ
  choice: A quem pertence a terra?
  rationale: Mantém a forma breve de pergunta retórica e sua ambiguidade quanto à posse, autoridade e direito de governar.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto político indica emissários humanos; “mensageiros” é claro e não acrescenta uma função diplomática mais específica do que o hebraico exige.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Faça uma aliança comigo
  rationale: כרת ברית é a expressão idiomática comum para estabelecer uma aliança. A formulação portuguesa é atual e natural, sem reproduzir literalmente o verbo “cortar”.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: Minha mão estará com você
  rationale: Conserva a metáfora hebraica da mão como apoio, influência ou poder, enquanto o futuro se ajusta naturalmente ao compromisso que Abner está oferecendo.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: para fazer ... passar para o seu lado
  rationale: Expressa a ação causativa de mudar a lealdade política em favor de Davi sem reduzir o sentido a mero deslocamento físico.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Forma portuguesa consagrada e adequada para o povo ou conjunto das tribos de Israel.
theological_decisions:
- issue: Sentido da pergunta retórica לְמִי אָרֶץ
  choice: 'Mantê-la como pergunta direta: “A quem pertence a terra?”'
  alternative: Explicá-la como “Quem deve governar a terra?” ou como a afirmação “A terra está em minhas mãos”.
  rationale: O hebraico é conciso e admite mais de uma nuance política. A pergunta direta preserva a tensão sobre posse e autoridade sem definir além do texto a pretensão de Abner.
- issue: Força da expressão “minha mão com você”
  choice: Preservar a imagem da mão como apoio ou poder ao lado de Davi.
  alternative: Substituí-la por “eu apoiarei você”.
  rationale: A metáfora é inteligível com nota e mantém a força política da declaração sem limitar o sentido a apoio verbal ou pessoal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “dizendo” foi mantida de modo perceptível (“dizendo ... E dizendo ainda”) por refletir a estrutura incomum do hebraico. As metáforas e a ambiguidade política centrais foram preservadas, com notas breves para esclarecimento.
