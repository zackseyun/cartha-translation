base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: pt
  text: 'Abner disse a Davi: “Vou me levantar, ir e reunir todo o Israel ao meu senhor, o rei, para que façam uma aliança[a] com você; e você reinará sobre tudo o que a sua alma desejar[b].” Davi despediu Abner, e ele partiu em paz[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cortem uma aliança com você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobre tudo o que você desejar”. O hebraico diz literalmente: “sobre tudo o que a sua alma desejar”.'
    reason: lexical_alternative
  - marker: c
    text: “Partiu em paz” é uma expressão hebraica que indica que ele saiu em segurança e em termos pacíficos.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Vou partir
  rationale: Os cohortativos expressam a intenção decidida de Abner. Em português, “vou partir” comunica naturalmente o movimento e a resolução, sem a rigidez de “vou me levantar e ir”.
- source_word: וְאֶקְבְּצָה
  choice: e reunir
  rationale: קבץ descreve a reunião política das tribos em torno de Davi; “reunir” é direto e corrente.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: ao meu senhor, o rei
  rationale: Preserva a direção da reunião e o tratamento cortesão dirigido a Davi. A aposição com vírgula soa natural em português.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Forma consagrada e clara para a entidade coletiva composta pelas tribos.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: para que façam uma aliança com você
  rationale: O propósito da reunião é explicitado naturalmente. כרת ברית é um idioma hebraico cujo sentido é estabelecer ou fazer uma aliança.
- source_word: וּמָלַכְתָּ
  choice: então você reinará
  rationale: O verbo indica o exercício da realeza; “então” torna clara a consequência contextual sem alterar o sentido.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: sobre tudo o que a sua alma desejar
  rationale: Mantém a preposição de domínio e preserva נֶפֶשׁ como “alma”, deixando visível a expressão antropológica hebraica.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: Davi despediu Abner
  rationale: Neste contexto, שׁלח significa deixar partir ou dispensar após o encontro; “despediu” expressa isso com concisão.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: e ele partiu em paz
  rationale: Preserva o idioma hebraico, que sugere uma partida segura e em termos pacíficos.
theological_decisions:
- issue: Linguagem de aliança
  choice: façam uma aliança com você
  alternative: cortem uma aliança com você; estabeleçam uma aliança com você
  rationale: “Fazer uma aliança” transmite em português atual o sentido do idioma כרת ברית, sem transformar sua imagem literal em uma formulação obscura.
- issue: Sentido antropológico de נֶפֶשׁ
  choice: a sua alma desejar
  alternative: você desejar; o seu coração desejar
  rationale: A opção mantém a referência explícita à נֶפֶשׁ e a tensão da expressão hebraica, enquanto a nota esclarece a alternativa idiomática.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O discurso mantém o respeito cortesão de Abner e preserva, com notas, os principais idiomas hebraicos.
