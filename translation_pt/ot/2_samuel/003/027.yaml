  to: Quando Abner voltou a Hebrom, Joabe o levou à parte, para o interior do portão, a fim de falar com ele em particular.[a] Ali, Joabe o feriu no abdômen,[b] e ele morreu, por causa do sangue de seu irmão Asael.
  rationale: A revisão elimina a ambiguidade possessiva para deixar claro que Asael é irmão de Joabe, conforme o sufixo hebraico. “No abdômen” dá uma formulação portuguesa moderna para a provável região atingida; a nota conserva a tradução tradicional e a incerteza lexical. A nota da expressão rara foi ampliada para registrar possibilidades sem fixar uma interpretação única.
