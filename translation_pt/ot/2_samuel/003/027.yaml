base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: pt
  text: Quando Abner voltou a Hebrom, Joabe o levou à parte, para o interior do portão, a fim de falar com ele em particular.[a] Ali, Joabe o feriu no abdômen,[b] e ele morreu, por causa do sangue de seu irmão Asael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é rara e também pode ser entendida como “tranquilamente”, “em paz” ou “em segredo”.
    reason: lexical_ambiguity
  - marker: b
    text: 'Tradução tradicional: “na quinta costela”; neste contexto, a expressão hebraica pode referir-se à região do abdômen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שׁוב indica voltar ou retornar; Abner regressa a Hebrom depois de ter sido mandado embora.
- source_word: וַיַּטֵּהוּ
  choice: o levou à parte
  rationale: No hiphil, נטה pode indicar desviar ou fazer alguém sair de seu caminho. A expressão portuguesa comunica o movimento de Abner para um lugar separado sem perder a ação intencional de Joabe.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: para o interior do portão
  rationale: תּוֹךְ designa o interior ou meio, e שַׁעַר pode referir-se ao portão ou à passagem de entrada. A formulação mantém a imagem espacial de maneira natural em português.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: a fim de falar com ele em particular
  rationale: בַּשֶּׁלִי é uma expressão rara e difícil, associada a quietude, tranquilidade ou reserva. “Em particular” se ajusta ao contexto sem tornar explícita uma intenção que o hebraico não declara.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: Ali, Joabe o feriu no ventre
  rationale: חֹמֶשׁ, nestes relatos de golpes fatais, aponta para a região abdominal. “Ventre” comunica o sentido provável, enquanto a tradução tradicional “quinta costela” é registrada em nota.
- source_word: וַיָּמָת
  choice: e ele morreu
  rationale: A construção narrativa hebraica prossegue diretamente do golpe para a morte; a coordenação simples preserva essa sequência.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: por causa do sangue de Asael, seu irmão
  rationale: A preposição בְּ expressa aqui causa ou motivo. A tradução preserva a linguagem de responsabilidade pelo sangue sem acrescentar explicitamente “vingança”.
theological_decisions:
- issue: Motivo de Joabe e linguagem de vingança de sangue
  choice: por causa do sangue de Asael, seu irmão
  alternative: em vingança pelo sangue de seu irmão Asael
  rationale: O texto relaciona a morte de Abner ao sangue de Asael, mas não emprega neste ponto um substantivo explícito para “vingança”. A redação escolhida conserva a força jurídica e narrativa sem ampliar a afirmação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Hebrom”, “Joabe” e “Asael” seguem formas bíblicas portuguesas consolidadas. As notas preservam as duas principais dificuldades lexicais sem sobrecarregar o corpo do versículo.
