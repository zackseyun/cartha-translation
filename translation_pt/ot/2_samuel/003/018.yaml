source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: pt
  text: 'Agora, portanto, façam isso, pois Yahweh falou a respeito de Davi, dizendo: “Por meio do meu servo Davi, salvarei[a] o meu povo Israel das mãos dos filisteus e das mãos de todos os seus inimigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu servo Davi salvará o meu povo Israel das mãos dos filisteus e das mãos de todos os seus inimigos”. A forma hebraica pode ser entendida com Davi como sujeito gramatical, em vez de Yahweh como o sujeito implícito que age por meio dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Marca a transição para uma exortação imediata; a formulação conserva tanto o valor temporal quanto o conclusivo.
- source_word: עֲשׂוּ
  choice: façam isso
  rationale: O imperativo masculino plural exige que os ouvintes ponham em prática o plano já discutido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a ordem anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: falou a respeito de Davi, dizendo
  rationale: Embora אֶל normalmente signifique “a”, a fala citada se refere a Davi na terceira pessoa; neste contexto, “a respeito de” expressa melhor o sentido provável sem sugerir que a declaração tenha sido dirigida diretamente a ele.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Por meio do meu servo Davi
  rationale: Expressa de modo natural em português o idioma hebraico de agência, preservando Davi como instrumento comissionado.
- source_word: הוֹשִׁיעַ
  choice: salvarei
  rationale: No fluxo da fala divina, entende-se Yahweh como aquele que salva por meio de Davi. A forma consonantal e a vocalização massorética também permitem relacionar o verbo a Davi, ambiguidade registrada em nota.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: Mantém o possessivo de aliança e o nome nacional em aposição natural.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: das mãos dos filisteus e das mãos de todos os seus inimigos
  rationale: Conserva a imagem hebraica da “mão” como poder ou domínio hostil, bem como sua repetição enfática.
theological_decisions:
- issue: Sujeito de הוֹשִׁיעַ na fala citada
  choice: 'Yahweh é o sujeito implícito: “salvarei ... por meio do meu servo Davi”'
  alternative: 'Davi é o sujeito: “meu servo Davi salvará o meu povo Israel”'
  rationale: A moldura de fala divina e a expressão instrumental “por meio do meu servo Davi” favorecem a ação de Yahweh realizada mediante Davi. Contudo, a forma hebraica recebida pode ser entendida com Davi como sujeito; por isso, a alternativa é explicitada em nota, sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A expressão instrumental “por meio de” evita uma tradução rígida de בְּיַד, enquanto “das mãos” preserva a imagem hebraica onde ela descreve domínio hostil.
