  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִלְאָב
  choice: Quileabe
  rationale: Transliteração portuguesa do nome hebraico Kilʾav, com grafia natural e reconhecível em português.
- source_word: ל/אביגל
  choice: de Abigail
  rationale: Neste contexto genealógico, a preposição לְ indica a mãe de quem nasceu o filho; 'de Abigail' comunica isso de modo conciso e natural.
- source_word: הַכַּרְמְלִי
  choice: o carmelita
  rationale: Gentílico que identifica Nabal como natural ou habitante do Carmelo; preserva a forma tradicional e clara em português.
- source_word: גְּשׁוּר
  choice: Gesur
  rationale: Forma portuguesa corrente do topônimo hebraico Geshur.
