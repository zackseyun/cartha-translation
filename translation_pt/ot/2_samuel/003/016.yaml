base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: pt
  text: 'O marido dela foi com ela, caminhando e chorando atrás dela[a] até Baurim. Então Abner lhe disse: “Vá, volte.”[b] E ele voltou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seguindo-a”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Vá, volte”, uma ordem dupla enfática; também pode ser traduzido por “Volte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: o marido dela
  rationale: Neste contexto, אִישׁ com o sufixo de terceira pessoa feminina singular designa especificamente o marido da mulher; a expressão é natural e precisa em português.
- source_word: הָלוֹךְ וּבָכֹה
  choice: caminhando e chorando
  rationale: A construção retrata uma ação contínua durante o percurso. “Caminhando e chorando” conserva esse aspecto durativo com linguagem clara e atual.
- source_word: אַחֲרֶיהָ
  choice: atrás dela
  rationale: A expressão indica que ele a seguia; “atrás dela” preserva diretamente o sentido espacial, embora “depois dela” também seja possível.
- source_word: עַד בַּחֻרִים
  choice: até Baurim
  rationale: עַד com nome de lugar marca o limite do deslocamento; “até Baurim” expressa isso naturalmente.
- source_word: בַּחֻרִים
  choice: Baurim
  rationale: Nome geográfico transliterado segundo a forma tradicional e amplamente reconhecível em português bíblico.
- source_word: לֵךְ שׁוּב
  choice: Vá, volte
  rationale: Mantém os dois imperativos do hebraico e sua força enfática, sem reduzi-los silenciosamente a uma única ordem.
- source_word: וַיָּשֹׁב
  choice: E ele voltou
  rationale: O waw consecutivo faz a narrativa avançar; a coordenação simples reproduz com naturalidade a resposta imediata à ordem de Abner.
