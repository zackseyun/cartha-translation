  text: E ele já não conseguia responder a Abner[a] palavra alguma, pois tinha medo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «replicar a Abner coisa alguma». Literalmente, «responder a Abner uma palavra».'
