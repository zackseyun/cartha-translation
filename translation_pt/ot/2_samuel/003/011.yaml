lexical_decisions:
- source_word: יָכֹל
  choice: conseguiu
  rationale: O verbo expressa capacidade; no contexto narrativo e sob negação, «não conseguiu» soa natural em português.
- source_word: עוֹד
  choice: já não
  rationale: 'Com a negação, indica que a ação deixou de ser possível: «já não».'
- source_word: לְהָשִׁיב
  choice: responder
  rationale: O hifil de שוב tem aqui o sentido idiomático de responder ou replicar.
- source_word: אֶת־אַבְנֵר
  choice: a Abner
  rationale: A partícula marca Abner como objeto de «responder»; a regência portuguesa pede a preposição «a».
- source_word: דָּבָר
  choice: nada
  rationale: Na construção negativa, «responder nada» comunica naturalmente o sentido do hebraico «responder uma palavra», cuja forma literal é preservada em nota.
- source_word: מִיִּרְאָתוֹ
  choice: porque tinha medo
  rationale: A preposição מן com o substantivo «temor» exprime causa; a oração causal é clara e idiomática.
- source_word: אֹתוֹ
  choice: dele
  rationale: O sufixo pronominal refere-se a Abner e completa naturalmente a expressão portuguesa «ter medo de alguém».
