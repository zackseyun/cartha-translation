  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: pt
  text: A guerra entre a casa de Saul e a casa de Davi se prolongou[a]. Davi ficava cada vez mais forte, enquanto a casa de Saul ficava cada vez mais fraca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi longa”. O adjetivo hebraico significa literalmente “longa” e aqui se refere à duração da guerra.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode significar família, linhagem ou dinastia governante; aqui, o hebraico provavelmente reúne o sentido familiar e o político.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: se prolongou
  rationale: A forma narrativa introduz a continuação dos acontecimentos; não se acrescenta um marcador temporal explícito como “então” ou “naquele tempo”.
- source_word: הַמִּלְחָמָה אֲרֻכָּה
  choice: A guerra ... se prolongou
  rationale: O adjetivo אֲרֻכָּה significa literalmente “longa”; com “guerra”, “se prolongou” expressa naturalmente sua duração.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: entre a casa de Saul e a casa de Davi
  rationale: “Casa” preserva a amplitude do hebraico, que pode abranger família, linhagem e dinastia governante.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: Davi ficava cada vez mais forte
  rationale: A construção com הֹלֵךְ exprime progressão contínua; a formulação portuguesa é natural e mantém esse desenvolvimento gradual.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: a casa de Saul ficava cada vez mais fraca
  rationale: A construção indica enfraquecimento progressivo e forma um contraste direto com o fortalecimento de Davi.
theological_decisions: []
