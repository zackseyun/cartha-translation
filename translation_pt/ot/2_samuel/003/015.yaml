base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: pt
  text: Então Isbosete enviou agentes e a tomou de seu marido[a], de Paltiel, filho de Laís.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do homem, de Paltiel, filho de Laís”. Aqui, “homem” se refere ao marido dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou buscá-la
  rationale: O verbo significa literalmente “mandou/enviou”; como não se declara quem foi enviado, a formulação portuguesa expressa de modo natural a ação ordenada no contexto sem especificar agentes.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isbosete
  rationale: Forma tradicional e inteligível em português para o nome próprio hebraico.
- source_word: וַיִּקָּחֶהָ
  choice: a tirou
  rationale: לקח com o sufixo feminino significa “tomou-a”; em português, “tirou” comunica naturalmente a remoção indicada pelas expressões מֵעִם seguintes, sem acrescentar a força de “arrancou” ou “sequestrou”.
- source_word: מֵעִם אִישׁ
  choice: de seu marido
  rationale: Embora אִישׁ signifique literalmente “homem”, o contexto identifica Paltiel como marido de Mical. A explicitação evita uma ambiguidade pouco natural em português.
- source_word: מֵעִם פַּלְטִיאֵל
  choice: Paltiel
  rationale: O segundo מֵעִם retoma e identifica o marido. Em português, a aposição preserva o sentido sem a repetição pesada “de seu marido, de Paltiel”.
- source_word: בֶּן לוש
  choice: filho de Laís
  rationale: בֶּן é a expressão filial comum, e “Laís” é a transliteração portuguesa tradicional do nome neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “mandou buscá-la e a tirou” evita sugerir que Isbosete agiu pessoalmente, embora o hebraico deixe os agentes implícitos. A ordem da frase foi ajustada para soar natural em português, preservando a identificação de Paltiel como marido.
