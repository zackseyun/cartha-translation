reference: 2 Samuel 3:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: pt
  text: Eu, porém, ainda hoje sou fraco, embora tenha sido ungido rei; e estes homens, os filhos de Zeruia, são duros demais para mim. Que Yahweh retribua a quem pratica o mal conforme a sua maldade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh retribuirá a quem pratica o mal conforme a sua maldade”. O verbo hebraico também pode ser entendido como futuro simples.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: fraco
  rationale: Embora o adjetivo possa significar literalmente «tenro» ou «delicado», no contexto exprime a vulnerabilidade e a insuficiência de poder de Davi diante dos filhos de Zeruia.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: embora tenha sido ungido rei
  rationale: A relação concessiva torna explícito o contraste contextual entre a fragilidade atual de Davi e sua condição de rei ungido, sem alterar o sentido da oração nominal hebraica.
- source_word: בְּנֵי צְרוּיָה
  choice: os filhos de Zeruia
  rationale: Preserva a designação familiar hebraica e sua força retórica.
- source_word: קָשִׁים מִמֶּנִּי
  choice: são duros demais para mim
  rationale: «Duros» conserva o campo semântico de severidade e inflexibilidade, enquanto «demais para mim» comunica que Davi não consegue dominá-los ou refreá-los.
- source_word: יְשַׁלֵּם
  choice: Que ... retribua
  rationale: O imperfeito pode ter força volitiva neste contexto, apresentando a fala como apelo por justiça divina; a possibilidade de futuro simples é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: a quem pratica o mal
  rationale: Formulação natural e fiel à construção participial, sem transformar necessariamente a expressão numa característica permanente da pessoa.
- source_word: כְּרָעָתוֹ
  choice: conforme a sua maldade
  rationale: Expressa a correspondência entre a retribuição e o mal praticado, preservando o substantivo hebraico.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; a transliteração o preserva de modo direto.
- issue: Força de יְשַׁלֵּם na declaração final
  choice: 'optativa: «Que Yahweh retribua...»'
  alternative: 'preditiva: «Yahweh retribuirá...»'
  rationale: O contexto favorece um apelo de Davi à justiça divina, mas a forma verbal também admite leitura como futuro simples; essa ambiguidade é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ainda hoje» mantém a referência temporal do hebraico; «duros demais para mim» preserva tanto a severidade dos homens quanto a incapacidade prática de Davi para contê-los.
