translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural brasileiro (“vocês”). A aposição “um líder, um grande homem” reproduz a coordenação hebraica sem transformar “grande” em título técnico. Não foi acrescentada nota, pois “líder” comunica adequadamente a amplitude contextual de שַׂר.
