  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: pt
  text: 'Então o rei disse aos seus servos: “Vocês não sabem que hoje caiu em Israel um líder, um grande homem?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido; o contexto identifica Davi, sem necessidade de explicitar seu nome.
- source_word: עֲבָדָיו
  choice: aos seus servos
  rationale: עֶבֶד significa com frequência “servo”, inclusive no ambiente da corte; a opção preserva o valor lexical sem pressupor que todos fossem oficiais.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Vocês não sabem
  rationale: A construção introduz uma pergunta retórica que espera concordância; esta formulação é clara e natural em português.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo do que os ouvintes deveriam saber.
- source_word: שַׂר
  choice: um líder
  rationale: שַׂר pode designar príncipe, comandante, governante ou alto oficial. Em referência a Abner, “líder” comunica sua posição militar e política sem sugerir necessariamente linhagem real.
- source_word: וְגָדוֹל
  choice: um grande homem
  rationale: O adjetivo tem valor substantivado e destaca a grandeza ou importância da pessoa; “um grande homem” conserva o tom elevado e é idiomático.
- source_word: נָפַל
  choice: caiu
  rationale: “Cair” é uma imagem elevada e reconhecível para morrer, preservando a metáfora hebraica e o aspecto perfectivo.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente natural da expressão hebraica “este dia” no português moderno.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Expressa naturalmente a esfera nacional em que ocorreu a morte.
