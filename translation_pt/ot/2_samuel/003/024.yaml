base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: pt
  text: 'Então Joabe foi até o rei e disse: “O que você fez? Veja, Abner veio até você! Por que, então, você o mandou embora — e ele se foi de vez[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ele foi, indo”, construção enfática que indica que Abner certamente partiu ou já se afastou por completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foi até
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa a sequência, e “foi até” é natural em português para a aproximação indicada por בוא seguido de אֶל.
- source_word: מֶה עָשִׂיתָה
  choice: O que você fez?
  rationale: A pergunta funciona como repreensão direta por uma ação concluída; a formulação é clara, atual e mantém sua força exclamativa.
- source_word: הִנֵּה
  choice: Veja,
  rationale: A partícula chama enfaticamente a atenção do rei para o fato que fundamenta a censura de Joabe, sem recorrer ao arcaizante “eis”.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: Abner veio até você
  rationale: Preserva de modo simples a chegada de Abner à presença de Davi e a ênfase pessoal de אֵלֶיךָ.
- source_word: לָמָּה זֶּה
  choice: Por que, então,
  rationale: “Então” transmite em português a força apontadora e indignada da combinação, que é mais enfática que um simples “por quê?”, sem produzir uma construção artificial.
- source_word: שִׁלַּחְתּוֹ
  choice: você o mandou embora
  rationale: O piel de שלח indica aqui enviar ou despedir alguém; a expressão mantém explícita a responsabilidade de Davi.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: Agora ele se foi de vez
  rationale: A construção com verbo finito e infinitivo absoluto intensifica a partida. “De vez” comunica de maneira natural que Abner já partiu completamente; “agora” explicita a consequência imediata no discurso de Joabe.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento “você” reproduz a fala direta sem arcaísmo; a pontuação conserva o tom abrupto e indignado de Joabe.
