base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/017.yaml
  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: pt
  text: 'Abner havia falado com os anciãos de Israel, dizendo: “Já há algum tempo vocês vêm desejando Davi como rei sobre vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Abner tinha falado com
  rationale: A expressão hebraica, literalmente relacionada à palavra ou negociação de Abner com os anciãos, indica que ele havia tratado do assunto com eles; o mais-que-perfeito preserva a relação narrativa com os acontecimentos seguintes.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: já há algum tempo
  rationale: O par idiomático significa literalmente algo como 'tanto ontem como anteontem', mas convencionalmente aponta para um período anterior não limitado a dois dias; esta formulação comunica o sentido sem impor precisão indevida.
- source_word: הֱיִיתֶם מְבַקְשִׁים
  choice: vocês queriam
  rationale: A construção expressa uma disposição ou desejo continuado no passado. 'Queriam' é natural em português e, no contexto, evita sugerir que os anciãos estavam literalmente procurando Davi.
- source_word: אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: que Davi fosse rei sobre vocês
  rationale: Expressa de maneira natural a intenção de ter Davi como rei, preservando 'sobre vocês', correspondente ao hebraico עֲלֵיכֶם.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'vocês', amplamente compreensível no Brasil e no português internacional. A formulação conserva o aspecto retrospectivo do discurso sem acrescentar marcador equivalente a 'agora', ausente no hebraico.
