base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: pt
  text: Nasceram filhos a Davi em Hebrom, e seu primogênito foi Amnom, filho de Ainoã, a jezreelita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mulher de Jezreel”.
    reason: Alternativa lexical que explicita o sentido do gentílico feminino hebraico.
lexical_decisions:
- source_word: ו/ילדו
  choice: Nasceram
  rationale: O verbo, no plural, apresenta o nascimento dos filhos sem explicitar as mães como sujeito; “nasceram” reproduz de modo natural esse foco eventivo.
- source_word: לְ/דָוִד
  choice: a Davi
  rationale: A preposição ל marca aqui a relação paterna; “filhos a Davi” mantém a formulação genealógica do hebraico em português digno e inteligível.
- source_word: בָּנִים
  choice: filhos
  rationale: O substantivo designa especificamente descendentes do sexo masculino, e não filhos ou crianças de modo genérico.
- source_word: בְּ/חֶבְרוֹן
  choice: em Hebrom
  rationale: A preposição ב tem sentido locativo simples; “Hebrom” é a forma portuguesa consagrada do topônimo.
- source_word: וַ/יְהִי
  choice: e ... foi
  rationale: A construção introduz a identificação do primogênito; a coordenação com o verbo copulativo expressa isso naturalmente sem sobrecarregar o waw narrativo.
- source_word: בְכוֹר/וֹ
  choice: seu primogênito
  rationale: בכור indica o primeiro filho na ordem de nascimento e pode envolver relevância familiar e jurídica; “primogênito” preserva essa nuance melhor que “mais velho”.
- source_word: אַמְנוֹן
  choice: Amnom
  rationale: Transliteração convencional do nome pessoal em português.
- source_word: לַ/אֲחִינֹעַם
  choice: filho de Ainoã
  rationale: Neste catálogo de nascimentos, a preposição identifica a mãe. A explicitação “filho de” é idiomática em português e evita a construção pouco natural “por Ainoã”.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: a jezreelita
  rationale: O gentílico feminino identifica Ainoã por sua procedência. “Jezreelita” é compacto, preciso e compreensível, enquanto a nota registra uma formulação explicativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas onomásticas bíblicas correntes. O marcador da nota foi colocado junto a “jezreelita”, expressão à qual a alternativa lexical se refere.
