    issue: “voltaram” é mais específico que o verbo hebraico.
    rationale: בָּא significa “veio/chegou”; embora o contexto possa implicar retorno de uma ação militar, “voltaram” explicita essa implicação. “Chegaram de uma incursão” mantém a referência ao movimento sem acrescentar a ideia de retorno.
  - severity: low
    issue: “já não estava” acrescenta uma ênfase temporal.
    rationale: אֵינֶנּוּ significa simplesmente que Abner não estava presente. A partida anterior é explicada na oração seguinte, mas o advérbio “já” não precisa ser antecipado na tradução.
