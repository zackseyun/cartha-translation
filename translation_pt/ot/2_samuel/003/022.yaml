revisions:
- from: E eis que os servos de Davi e Joabe voltaram de uma incursão, trazendo consigo muitos despojos.[a] Abner, porém, já não estava com Davi em Hebrom, pois Davi o havia deixado partir, e ele tinha ido em paz.[b]
  to: E eis que os servos de Davi e Joabe chegaram de uma incursão, trazendo consigo muitos despojos.[a] Abner, porém, não estava com Davi em Hebrom, pois Davi o havia deixado partir, e ele tinha ido em paz.[b]
  rationale: 'A revisão remove duas explicitações não exigidas pelo hebraico: a ideia de retorno em “voltaram” e a ênfase temporal de “já não estava”. O restante preserva de modo fiel e natural o sentido, o registro e as ambiguidades relevantes do texto-fonte.'
