base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: pt
  text: E eis que os servos de Davi e Joabe chegaram de uma incursão, trazendo consigo muitos despojos.[a] Abner, porém, não estava com Davi em Hebrom, pois Davi o havia deixado partir, e ele tinha ido em paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica também pode se referir ao destacamento ou bando que fazia a incursão.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “ir em paz” indica que Abner partiu em segurança e em bons termos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função de introduzir vividamente uma nova cena narrativa, em registro digno e reconhecível em português.
- source_word: עַבְדֵי דָוִד
  choice: os servos de Davi
  rationale: Designa homens a serviço de Davi, sem impor a ideia específica de escravidão; mantém maior proximidade lexical com o hebraico do que 'os homens de Davi'.
- source_word: וְיוֹאָב בָּא מֵהַגְּדוּד
  choice: e Joabe voltaram de uma incursão
  rationale: O verbo hebraico está no singular com sujeito composto, construção possível no hebraico bíblico; o plural é natural em português. 'Incursão' comunica a atividade militar sugerida pela menção posterior aos despojos.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: trazendo consigo muitos despojos
  rationale: '''Despojos'' é o termo militar corrente para bens tomados em combate, e a construção participial expressa com naturalidade a ação concomitante.'
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: Abner, porém, já não estava com Davi em Hebrom
  rationale: '''Porém'' explicita o contraste narrativo, enquanto ''já não estava'' indica de modo natural que Abner partira antes da chegada do grupo.'
- source_word: כִּי שִׁלְּחוֹ
  choice: pois Davi o havia deixado partir
  rationale: O contexto identifica Davi como sujeito. 'Deixado partir' evita sugerir demissão e comunica que Abner foi mandado embora com permissão.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: e ele tinha ido em paz
  rationale: Mantém a forma concreta do idioma hebraico e sua possível nuance de partida segura e em bons termos, sem reduzi-la a apenas uma dessas ideias.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a vivacidade narrativa de וְהִנֵּה e o idioma teologicamente e narrativamente relevante 'em paz'.
