base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: pt
  text: Assim, Joabe e seu irmão Abisai mataram Abner porque ele havia matado Asael, irmão deles, em Gibeão, na batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Joabe e seu irmão Abisai mataram Abner.” A conjunção hebraica também pode ser traduzida simplesmente por “e”; “assim” explicita a ligação resumitiva e explicativa com o contexto anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: mataram
  rationale: Traduz diretamente o sentido básico de הרג, sem acrescentar uma avaliação jurídica explícita como “assassinaram”.
- source_word: לְאַבְנֵר
  choice: Abner
  rationale: 'A preposição ל marca aqui o objeto do verbo; em português natural, usa-se o objeto direto: “mataram Abner”.'
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: A expressão introduz a razão do ato, e “porque” é seu equivalente claro e idiomático em português.
- source_word: הֵמִית
  choice: havia matado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da morte de Asael em relação à morte de Abner.
- source_word: אָחִיו / אֲחִיהֶם
  choice: seu irmão / irmão deles
  rationale: A primeira forma identifica Abisai como irmão de Joabe; a segunda identifica Asael como irmão de ambos. A tradução preserva essas relações sem ambiguidade desnecessária.
- source_word: בְּגִבְעוֹן
  choice: em Gibeão
  rationale: “Em Gibeão” é a forma corrente em português para indicar o local onde ocorreu o combate.
- source_word: בַּמִּלְחָמָה
  choice: naquela batalha
  rationale: O artigo hebraico aponta para a batalha específica já conhecida pelo contexto; “naquela batalha” expressa naturalmente essa referência em português.
- source_word: וְ / וַ
  choice: Assim
  rationale: A conjunção liga o versículo ao contexto precedente com valor resumitivo e explicativo. “Assim” comunica essa relação, enquanto “E” continua sendo uma alternativa formal possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução evita “assassinaram”, pois o hebraico declara o ato e seu motivo sem empregar aqui um termo distinto que determine por si só sua classificação jurídica. A vírgula em “Asael, irmão deles,” esclarece que Asael era irmão tanto de Joabe quanto de Abisai.
