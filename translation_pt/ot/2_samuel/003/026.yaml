base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: pt
  text: Então Joabe saiu de junto de Davi e enviou mensageiros atrás de Abner. Eles o trouxeram de volta do poço de Sirá.[a] Davi, porém, não sabia disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “de Bor-Sirá”, entendendo o hebraico como nome de lugar, em vez de “do poço de Sirá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא na sequência narrativa indica movimento para fora; “saiu” preserva essa imagem de modo natural em português.
- source_word: מֵעִם דָּוִד
  choice: da presença de Davi
  rationale: A expressão indica afastamento de junto de alguém. “Da presença de Davi” é clara e idiomática, sem sugerir necessariamente um rompimento permanente.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto, o termo designa agentes humanos enviados por Joabe, não seres celestiais.
- source_word: אַחֲרֵי אַבְנֵר
  choice: atrás de Abner
  rationale: A preposição expressa seguimento ou perseguição. “Atrás de Abner” mantém a concisão e deixa o contexto indicar a finalidade.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: Eles o trouxeram de volta
  rationale: A forma causativa de שוב significa que os mensageiros fizeram Abner retornar; esta formulação é natural em português.
- source_word: מִבּוֹר הַסִּרָה
  choice: do poço de Sirá
  rationale: בּוֹר pode designar poço, cisterna ou cova. “Poço de Sirá” oferece uma leitura clara, enquanto a possível interpretação da expressão como topônimo é preservada em nota.
- source_word: וְדָוִד לֹא יָדָע
  choice: Davi, porém, não sabia disso
  rationale: “Porém” comunica o contraste contextual, e “disso” explicita naturalmente em português que Davi desconhecia a ação de Joabe.
