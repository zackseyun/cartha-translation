  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: pt
  text: Que isso recaia sobre a cabeça de Joabe e sobre toda a casa de seu pai; e que nunca deixe de haver na casa de Joabe quem tenha uma secreção, quem sofra de lepra[a], quem segure um fuso[b], quem caia pela espada ou quem passe fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais amplo, “quem tenha uma doença de pele”. O termo hebraico tradicionalmente traduzido por “lepra” pode designar várias afecções cutâneas e não se limita à hanseníase moderna.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem se apoie num bastão”. O sentido da expressão hebraica neste contexto é incerto; a palavra geralmente significa “fuso”, mas antigas traduções e parte da tradição a entendem como “bastão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל־רֹאשׁ
  choice: Que isso recaia sobre a cabeça
  rationale: Reproduz a fórmula hebraica de culpa ou retribuição que recai sobre alguém. “Isso” retoma contextualmente a culpa pelo sangue derramado, sem inseri-la de modo explícito no texto.
- source_word: כָּל־בֵּית אָבִיו
  choice: toda a casa de seu pai
  rationale: Mantém a imagem hebraica da casa paterna, aqui abrangendo a família ou linhagem de Joabe.
- source_word: וְאַל־יִכָּרֵת מִבֵּית יוֹאָב
  choice: que nunca deixe de haver na casa de Joabe
  rationale: 'Expressa em português natural o sentido da fórmula negativa: as calamidades enumeradas jamais cessariam na família de Joabe.'
- source_word: זָב
  choice: quem tenha uma secreção
  rationale: Designa alguém com fluxo ou secreção corporal, condição associada à impureza ritual; evita termos portugueses arcaicos ou excessivamente específicos.
- source_word: מְצֹרָע
  choice: quem sofra de lepra
  rationale: Conserva a designação tradicional e reconhecível, enquanto a nota esclarece que o termo hebraico possui alcance mais amplo do que a hanseníase moderna.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: quem segure um fuso
  rationale: Traduz concretamente פֶּלֶךְ por seu sentido lexical usual, “fuso”, sem explicar no corpo do texto a possível condição social ou física sugerida pela expressão. A leitura tradicional alternativa é registrada em nota.
- source_word: נֹפֵל בַּחֶרֶב
  choice: quem caia pela espada
  rationale: Preserva a expressão idiomática hebraica e a cadência solene da maldição.
- source_word: חֲסַר־לָחֶם
  choice: quem passe fome
  rationale: Comunica naturalmente a falta de pão ou sustento indicada pelo hebraico, evitando a formulação pouco idiomática “careça de pão”.
theological_decisions:
- issue: Natureza da declaração de Davi
  choice: Desejo imprecatório ou maldição contra a casa de Joabe
  alternative: Predição simples do que acontecerá
  rationale: As formas volitivas do hebraico são melhor representadas por “Que...”, apresentando as palavras como invocação de juízo, e não como mera previsão.
- issue: Referente implícito de יָחֻלוּ
  choice: “Isso”, retomando contextualmente a culpa pelo sangue derramado
  alternative: Explicitar “a culpa pelo sangue de Abner”
  rationale: O contexto fornece o referente, mas o versículo não o repete expressamente; a tradução evita acrescentar uma especificação além do hebraico e preserva a dependência do versículo anterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência de maldição formal. A repetição de “quem” preserva a estrutura acumulativa da lista hebraica. Os marcadores foram colocados junto aos termos aos quais as notas efetivamente se referem.
