  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação hebraica foi convertida em duas frases para maior fluidez, sem perda de conteúdo. O marcador da nota foi colocado junto de “banquete”, termo ao qual a alternativa lexical se refere.
