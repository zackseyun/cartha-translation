base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: pt
  text: Abner foi até Davi, em Hebrom, acompanhado de vinte homens. Davi ofereceu um banquete[a] a Abner e aos homens que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparou uma festa” ou “deu um banquete”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi até
  rationale: O verbo בוא pode significar “ir”, “vir” ou “chegar”, conforme o ponto de vista. “Foi até” expressa naturalmente o deslocamento de Abner rumo a Davi no fluxo narrativo.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: até Davi, em Hebrom
  rationale: Embora não haja preposição explícita antes de חֶבְרוֹן, o contexto indica que Hebrom era o lugar onde Davi se encontrava. A vírgula torna essa relação clara em português.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: acompanhado de vinte homens
  rationale: A expressão hebraica é uma oração sem verbo, literalmente “e com ele vinte homens”. Esta formulação comunica com naturalidade que os vinte homens acompanhavam Abner e mantém a referência masculina de אֲנָשִׁים neste contexto.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: ofereceu um banquete
  rationale: A combinação עשה + משתה significa realizar, preparar ou oferecer uma refeição festiva. “Ofereceu um banquete” é idiomático em português e preserva a ideia de hospitalidade sem especificar indevidamente os preparativos.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: מִשְׁתֶּה designa uma refeição festiva, muitas vezes com bebida. “Banquete” transmite adequadamente o evento social sem tornar explícito o consumo de bebida, que permanece apenas implícito.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: a Abner e aos homens que estavam com ele
  rationale: A tradução preserva os dois complementos introduzidos por לְ e reproduz explicitamente a expressão “os homens que estavam com ele”, em vez de reduzi-la a “seus homens”.
theological_decisions: []
