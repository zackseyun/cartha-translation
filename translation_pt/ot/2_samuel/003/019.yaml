base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: pt
  text: Abner também falou aos benjamitas[a], e também foi a Hebrom falar com Davi sobre tudo o que parecia bom aos olhos de Israel e aos olhos de toda a casa de Benjamim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos ouvidos de Benjamim”, uma expressão que significa “aos benjamitas” ou “a Benjamim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobre tudo o que agradava a Israel e a toda a casa de Benjamim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: aos / pessoalmente com
  rationale: A expressão idiomática significa literalmente “aos ouvidos de”. No primeiro caso, o português natural pede “falou aos benjamitas”; no segundo, “falar pessoalmente com Davi” comunica que Abner lhe expôs diretamente a questão, sem sugerir necessariamente uma conversa secreta.
- source_word: בִנְיָמִין
  choice: os benjamitas
  rationale: O nome tribal funciona coletivamente; “os benjamitas” deixa claro ao leitor moderno que se trata do povo da tribo, e não do patriarca.
- source_word: לְדַבֵּר
  choice: falar
  rationale: Mantém o sentido amplo e direto do verbo דבר, sem interpretar a ação especificamente como negociação ou persuasão.
- source_word: בְּחֶבְרוֹן
  choice: a Hebrom
  rationale: Com o verbo de movimento וַיֵּלֶךְ, “foi a Hebrom” expressa de modo natural o destino no contexto.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: sobre tudo o que parecia bom a
  rationale: Reproduz o valor avaliativo da expressão hebraica “bom aos olhos de” em português corrente, preservando a perspectiva dos grupos mencionados.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome nacional coletivo, em paralelo com a casa de Benjamim.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: toda a casa de Benjamim
  rationale: Conserva a imagem hebraica de parentesco e identidade político-tribal, sem reduzi-la apenas a “tribo”.
- source_word: גַּם ... גַּם
  choice: também ... depois
  rationale: O primeiro גַּם é vertido explicitamente por “também”. No segundo, a progressão narrativa fica mais clara em português com “depois”; a ideia aditiva permanece no encadeamento das duas ações.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada para tornar explícito que Abner foi a Hebrom e ali falou diretamente com Davi. Preservou-se “casa de Benjamim” como expressão familiar e tribal.
