translation:
  language: pt
  text: o quarto[a], Adonias, filho de Hagite; e o quinto, Sefatias, filho de Abital.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o versículo começa com “e o quarto”, dando continuidade à lista do versículo anterior.
