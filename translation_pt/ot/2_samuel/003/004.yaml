lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: o quarto
  rationale: O numeral ordinal dá continuidade à lista do versículo anterior. Em português, omitir a conjunção inicial torna a leitura mais natural, enquanto a nota registra o וְ hebraico.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶן
  choice: filho de
  rationale: O estado construto indica filiação direta; esta é a formulação genealógica corrente em português.
- source_word: חַגִּית
  choice: Hagite
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: וְהַחֲמִישִׁי
  choice: e o quinto
  rationale: A conjunção é preservada por ligar o segundo item ao primeiro dentro do versículo.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Forma portuguesa tradicional do nome hebraico, adequada à leitura bíblica corrente.
- source_word: אֲבִיטָל
  choice: Abital
  rationale: Transliteração consolidada e próxima da forma hebraica.
