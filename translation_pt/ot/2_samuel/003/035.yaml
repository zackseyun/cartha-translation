base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: pt
  text: 'Então todo o povo veio insistir com Davi para que comesse pão[a] enquanto ainda era dia. Mas Davi jurou: “Que Deus me faça isso e ainda mais[b], se eu provar pão ou qualquer coisa antes do pôr do sol.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “pão”; aqui, o termo também pode referir-se mais amplamente a alimento, mas a tradução mantém a palavra concreta.
    reason: lexical_alternative
  - marker: b
    text: Esta é uma fórmula convencional de automaldição usada em juramentos. O castigo específico fica sem ser declarado no hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: insistir com Davi para que comesse
  rationale: O hifil de ברה, neste contexto de luto, indica levar alguém a alimentar-se ou oferecer-lhe alimento. A formulação expressa naturalmente a tentativa do povo de fazer Davi comer.
- source_word: לֶחֶם
  choice: pão
  rationale: Embora לֶחֶם possa designar alimento em geral, “pão” conserva a imagem concreta do hebraico e combina com o contexto de jejum e luto.
- source_word: בְּעוֹד הַיּוֹם
  choice: enquanto ainda era dia
  rationale: A expressão indica que o dia ainda não havia terminado e prepara a referência posterior ao pôr do sol.
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: Tradução direta e natural do verbo de juramento, adequada à fórmula solene seguinte.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Que Deus me castigue, e ainda mais
  rationale: A fórmula hebraica é uma automaldição convencional cujo castigo específico fica implícito. “Castigue” comunica sua força em português sem determinar qual seria a pena.
- source_word: כִּי אִם
  choice: se
  rationale: Em fórmulas de juramento, introduz a condição sob a qual recairia a automaldição.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: antes do pôr do sol
  rationale: Expressa em português corrente o sentido idiomático da construção hebraica referente ao ocaso.
- source_word: אֶטְעַם
  choice: eu provar
  rationale: Preserva o sentido literal de טעם e enfatiza que Davi não tomaria nem sequer uma pequena quantidade.
- source_word: אוֹ כָל מְאוּמָה
  choice: ou qualquer outra coisa
  rationale: Amplia a proibição para além do pão e comunica a totalidade enfática da expressão hebraica.
