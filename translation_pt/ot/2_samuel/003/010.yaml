  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: pt
  text: para transferir o reino da casa de Saul e estabelecer o trono de Davi sobre Israel e sobre Judá, desde Dã até Berseba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “desde Dã até Berseba” indica toda a terra, do norte ao sul.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: para transferir
  rationale: O hifil de עבר indica fazer o reino passar de um detentor para outro; “transferir” expressa com clareza essa mudança política.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: O substantivo abrange tanto o reino quanto o domínio real; “reino” é natural e preserva a amplitude do termo.
- source_word: מִבֵּית שָׁאוּל
  choice: da casa de Saul
  rationale: “Casa” conserva a imagem bíblica de família governante ou dinastia, sem substituí-la por uma abstração.
- source_word: וּלְהָקִים
  choice: e estabelecer
  rationale: Neste contexto político, o hifil de קום significa firmar ou colocar em vigor; “estabelecer” combina naturalmente com “trono”.
- source_word: אֶת כִּסֵּא דָוִד
  choice: o trono de Davi
  rationale: Mantém a imagem concreta do hebraico para a autoridade e a sucessão reais.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: sobre Israel e sobre Judá
  rationale: A repetição de עַל é preservada para destacar os dois âmbitos políticos, Israel e Judá.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: desde Dã até Berseba
  rationale: Reproduz os dois extremos geográficos do idioma hebraico em formulação natural em português.
- source_word: בְּאֵר שָׁבַע
  choice: Berseba
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português bíblico.
theological_decisions:
- issue: Linguagem dinástica em “casa de Saul” e imagem real em “trono de Davi”
  choice: Conservar os termos concretos “casa” e “trono”.
  alternative: Traduzir de modo abstrato como “dinastia de Saul” e “governo de Davi”.
  rationale: O texto descreve uma transferência política por meio de imagens bíblicas dinásticas e reais. Preservá-las mantém a textura e a possível ressonância teológica do hebraico sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção infinitiva foi mantida porque o versículo continua a declaração iniciada no contexto anterior. Os nomes próprios seguem formas tradicionais em português.
