  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: pt
  text: 'Saul tinha uma concubina chamada Rispa, filha de Aiá. E Isbosete disse a Abner: “Por que você teve relações com a concubina de meu pai?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Por que você foi à concubina de meu pai?” A expressão “foi a” é um eufemismo comum para ter relações sexuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: Saul tinha
  rationale: A construção com ל expressa posse ou associação; em português corrente, “Saul tinha” comunica naturalmente essa relação. O waw liga a informação ao contexto, sem exigir um marcador como “Ora”.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: concubina
  rationale: Preserva a categoria social indicada pelo hebraico, sem substituí-la por uma explicação interpretativa.
- source_word: וּשְׁמָהּ רִצְפָּה
  choice: chamada Rispa
  rationale: Forma natural e concisa em português para “e o nome dela era Rispa”, preservando a função identificadora.
- source_word: בַת אַיָּה
  choice: filha de Aiá
  rationale: Tradução direta do patronímico hebraico, com transliteração portuguesa dos nomes.
- source_word: וַיֹּאמֶר
  choice: E Isbosete disse
  rationale: O sujeito está implícito no hebraico, mas o contexto anterior identifica Isbosete; explicitá-lo evita ambiguidade em português.
- source_word: אֶל אַבְנֵר
  choice: a Abner
  rationale: Equivalente natural da preposição אֶל com verbo de fala.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo direto e corrente.
- source_word: בָּאתָה אֶל
  choice: teve relações com
  rationale: Neste contexto, “entrar/ir a” é um eufemismo sexual convencional. A tradução comunica claramente o sentido ao leitor moderno, enquanto a nota registra a forma literal e sua natureza eufemística.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: a concubina de meu pai
  rationale: Reproduz naturalmente em português a relação possessiva da cadeia hebraica.
