base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: pt
  text: Enquanto continuava a guerra entre a casa de Saul e a casa de Davi, Abner ia se fortalecendo[a] na casa de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ia ficando mais forte”. O verbo hebraico pode indicar tanto tornar-se forte como fortalecer-se; a forma reflexiva pode sugerir que Abner consolidava sua própria posição na casa de Saul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Enquanto continuava a guerra
  rationale: A construção com infinitivo de היה introduz uma circunstância temporal durativa. A formulação expressa a continuidade da guerra sem acrescentar um marcador como “então”, inexistente como advérbio explícito no hebraico.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: entre a casa de Saul e a casa de Davi
  rationale: “Casa” conserva a amplitude do hebraico, que pode abranger família, grupo político e dinastia; “dinastia” seria mais restritivo.
- source_word: וְאַבְנֵר
  choice: Abner
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הָיָה מִתְחַזֵּק
  choice: ia se fortalecendo
  rationale: A perífrase expressa desenvolvimento progressivo, e o pronome reflexivo preserva a possível ideia de Abner consolidar a própria força ou posição.
- source_word: בְּבֵית שָׁאוּל
  choice: na casa de Saul
  rationale: Mantém a imagem hebraica e deixa em aberto se a referência principal é à família, à corte ou ao grupo político de Saul.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a expressão bíblica “casa de Saul/Davi” por sua ambiguidade familiar e dinástica. A locução “ia se fortalecendo” soa natural em português e preserva tanto o aspecto progressivo quanto a possível nuance reflexiva.
