base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: pt
  text: 'Então Abner ficou muito irado por causa das palavras de Is-Bosete e disse: “Por acaso sou eu uma cabeça de cachorro que pertence a Judá?[a] Até hoje tenho demonstrado lealdade à casa de Saul, seu pai, aos irmãos dele e aos amigos dele, e não entreguei você nas mãos de Davi. Mesmo assim, hoje você me acusa de culpa relacionada a esta mulher.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “uma cabeça de cachorro que pertence a Judá”, expressão insultuosa de sentido difícil. Pode significar algo como “um cachorro desprezível aliado a Judá”, mas a tradução mantém a metáfora e sua ambiguidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Abner ficou muito irado
  rationale: A expressão idiomática hebraica descreve a ira que se acende; “ficou muito irado” comunica com naturalidade tanto o início quanto a intensidade da reação.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: por causa das palavras de Is-Bosete
  rationale: עַל indica aqui a causa da ira, e דִּבְרֵי mantém a referência concreta às palavras proferidas.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Sou eu uma cabeça de cachorro que pertence a Judá?
  rationale: A formulação preserva a metáfora insultuosa e difícil do hebraico, sem a reduzir a uma paráfrase interpretativa como “partidário desprezível de Judá”.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Até hoje tenho demonstrado lealdade
  rationale: No argumento retrospectivo de Abner, הַיּוֹם abrange sua conduta até o presente, enquanto חֶסֶד expressa lealdade relacional firme, e não apenas bondade ou afeto.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: à casa de Saul, seu pai, aos irmãos dele e aos seus amigos
  rationale: “Casa” conserva o sentido dinástico. A repetição e o emprego de “dele” tornam claro que os irmãos são os de Saul, sem substituir o termo hebraico por uma categoria mais ampla.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: e não entreguei você nas mãos de Davi
  rationale: A tradução reproduz de modo idiomático em português a imagem semítica de entregar alguém ao poder de outra pessoa.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: Mesmo assim, hoje você me acusa de uma falta por causa desta mulher
  rationale: פקד על com עָוֺן tem sentido de responsabilizar ou acusar por culpa. “Uma falta” preserva a dimensão moral da acusação sem especificar além do texto a natureza exata da transgressão.
