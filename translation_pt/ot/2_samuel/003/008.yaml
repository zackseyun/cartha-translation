  to: 'Então Abner ficou muito irado por causa das palavras de Is-Bosete e disse: “Por acaso sou eu uma cabeça de cachorro que pertence a Judá?[a] Até hoje tenho demonstrado lealdade à casa de Saul, seu pai, aos irmãos dele e aos amigos dele, e não entreguei você nas mãos de Davi. Mesmo assim, hoje você me acusa de culpa relacionada a esta mulher.”'
