base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: pt
  text: Assim, naquele dia, todo o povo e todo o Israel souberam que a morte de Abner, filho de Ner, não partira do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que a morte de Abner, filho de Ner, não vinha do rei». Também pode ser entendido como: «que o rei não havia ordenado a morte de Abner, filho de Ner». O hebraico expressa a fonte ou origem do acontecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: souberam
  rationale: O qal narrativo de ידע indica que chegaram a saber ou reconheceram o fato; «souberam» é natural e preserva o resumo narrativo.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: todo o povo e todo o Israel
  rationale: Mantém os dois grupos e preserva a expressão coletiva nacional «todo o Israel».
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto e idiomático em português.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: não partira do rei a decisão
  rationale: A construção hebraica exprime fonte ou origem. A explicitação mínima de «a decisão» torna a frase natural em português sem afirmar categoricamente uma ordem formal.
- source_word: לְהָמִית
  choice: de matar
  rationale: O infinitivo hifil de מות significa causar a morte; «matar» comunica isso de modo claro, enquanto «executar» sugeriria um procedimento judicial não declarado.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: Abner, filho de Ner
  rationale: Preserva os nomes próprios e a designação patronímica, com pontuação portuguesa natural.
theological_decisions:
- issue: Grau de implicação quanto à responsabilidade de Davi pela morte de Abner
  choice: A morte não teve no rei sua fonte ou iniciativa.
  alternative: O rei era inocente da morte de Abner; ou o rei não havia ordenado a morte.
  rationale: O hebraico enfatiza origem ou procedência, sem empregar explicitamente categorias jurídicas de inocência nem mencionar de modo inequívoco uma ordem real.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva a distinção entre «todo o povo» e «todo o Israel» e sinaliza em nota a ambiguidade da expressão hebraica de origem.
