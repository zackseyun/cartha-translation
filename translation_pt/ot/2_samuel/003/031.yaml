base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: pt
  text: 'Então Davi disse a Joabe e a todo o povo que estava com ele: “Rasguem as suas roupas, vistam-se de pano de saco e lamentem diante de Abner”. E o rei Davi seguia atrás da padiola[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leito funerário” ou “maca”. A palavra hebraica geralmente significa “cama” ou “leito”, mas aqui se refere ao suporte em que o corpo de Abner era transportado.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Rasguem as suas roupas
  rationale: Expressa com clareza o imperativo plural e o gesto público de luto, sem recorrer ao mais literário “vestes”.
- source_word: וְחִגְרוּ שַׂקִּים
  choice: vistam-se de pano de saco
  rationale: O hebraico descreve o ato de prender ou envolver o corpo com pano de saco. A formulação escolhida comunica naturalmente em português a prática de luto, sem o arcaísmo de “cingir”.
- source_word: וְסִפְדוּ
  choice: e lamentem
  rationale: ספד designa a lamentação formal pelos mortos; “lamentem” preserva esse sentido melhor que o mais amplo “chorem”.
- source_word: לִפְנֵי אַבְנֵר
  choice: diante de Abner
  rationale: Mantém a expressão espacial do hebraico e sua concisão; no contexto, refere-se a seguir diante do corpo de Abner durante o cortejo.
- source_word: הֹלֵךְ
  choice: ia andando
  rationale: Reproduz o valor contínuo do particípio hebraico no cenário narrativo.
- source_word: אַחֲרֵי
  choice: atrás de
  rationale: Traduz o sentido espacial apropriado ao cortejo fúnebre.
- source_word: הַמִּטָּה
  choice: a padiola
  rationale: Embora o termo geralmente signifique “cama” ou “leito”, aqui designa o suporte em que o corpo era transportado. “Padiola” evita sugerir um caixão fechado.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: E o rei Davi
  rationale: Conserva o título real e a identificação nominal em ordem natural no português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construções de ampla compreensão. “Pano de saco” mantém a expressão bíblica tradicional ainda inteligível; “ia andando” preserva o aspecto contínuo da ação. A pontuação coloca o ponto final fora das aspas, conforme uso editorial comum em português quando não pertence exclusivamente à fala citada.
