reference: 2 Samuel 3:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: pt
  text: 'Depois disso[a], quando Davi soube do ocorrido, disse: “Eu e o meu reino somos para sempre inocentes diante de Yahweh quanto ao sangue derramado de Abner, filho de Ner[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Depois” ou “Mais tarde”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dos sangues de Abner”, expressão idiomática que se refere ao derramamento do sangue de Abner e à responsabilidade por sua morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: Depois disso
  rationale: A expressão temporal indica sequência narrativa e pode significar “depois disso”, “depois” ou “mais tarde”. “Depois disso” é claro e natural.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: quando Davi soube do ocorrido
  rationale: O verbo significa literalmente “ouviu”. No contexto, refere-se a tomar conhecimento do assassinato narrado anteriormente; “soube do ocorrido” comunica essa implicação naturalmente sem especificar além do texto.
- source_word: נָקִי
  choice: inocentes
  rationale: O adjetivo denota ausência de culpa. O plural é exigido em português pelo sujeito composto “Eu e o meu reino”.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Eu e o meu reino
  rationale: Preserva a união entre Davi pessoalmente e o reino sob seu governo na declaração de inocência.
- source_word: מֵעִם יְהוָה
  choice: diante de Yahweh
  rationale: O idiomatismo descreve a posição de Davi perante Yahweh como testemunha e juiz; “diante de” preserva esse sentido forense.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa duração indefinida ou permanente e mantém a força enfática da declaração.
- source_word: מִדְּמֵי
  choice: quanto ao sangue derramado de
  rationale: O hebraico traz literalmente “dos sangues de”, idiomatismo ligado à morte violenta e à responsabilidade por ela. “Quanto ao sangue derramado de” conserva a imagem concreta e torna clara a referência ao homicídio.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, filho de Ner
  rationale: Forma portuguesa natural do patronímico hebraico, preservando os nomes próprios.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome divino pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Alcance da declaração de inocência
  choice: Eu e o meu reino somos para sempre inocentes
  alternative: Eu e a minha dinastia estamos livres de culpa
  rationale: A tradução mantém tanto o elemento pessoal quanto o político de מַמְלָכָה e não decide se “reino” inclui mais especificamente a dinastia, o governo ou o povo sob Davi.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a linguagem forense da declaração e explicita apenas o necessário para que o idiomatismo hebraico seja natural em português.
