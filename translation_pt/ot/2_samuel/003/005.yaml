base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: pt
  text: e o sexto, Itreão, filho de Eglá, esposa de Davi. Esses filhos nasceram a Davi em Hebrom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: e o sexto
  rationale: O ordinal com a conjunção dá continuidade à lista dos filhos de Davi. “Filho” fica implícito aqui e é esclarecido naturalmente pela sequência da frase.
- source_word: יִתְרְעָם
  choice: Itreão
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: לְעֶגְלָה
  choice: filho de Eglá
  rationale: Nesta fórmula genealógica, לְ identifica a mãe. A explicitação de “filho de” comunica com naturalidade essa relação em português.
- source_word: אֵשֶׁת דָּוִד
  choice: mulher de Davi
  rationale: Reproduz de perto a construção hebraica e, no contexto, “mulher” tem o sentido de esposa, sem sugerir que Eglá fosse necessariamente a única esposa de Davi.
- source_word: אֵלֶּה
  choice: Esses filhos
  rationale: O demonstrativo resume os homens enumerados nos versículos anteriores; “filhos” é acrescentado para clareza e fluência em português.
- source_word: יֻלְּדוּ
  choice: nasceram
  rationale: O passivo de ילד nesta fórmula genealógica expressa nascimento, sem necessidade de explicitar outro agente.
- source_word: לְדָוִד
  choice: a Davi
  rationale: A construção ילד + לְ indica filiação; “nasceram a Davi” preserva a formulação genealógica concisa e digna do hebraico.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: A preposição tem sentido locativo e indica onde ocorreram os nascimentos.
theological_decisions:
- issue: Possível impressão de que Eglá era a única esposa de Davi
  choice: mulher de Davi
  alternative: uma das mulheres de Davi
  rationale: A tradução principal mantém a forma relacional concisa do hebraico. A nota esclarece o contexto poligâmico sem inserir no texto uma quantificação que não está expressa na frase.
translation_notes:
  register: Português atual, claro e digno, com leve cadência genealógica. “Itreão”, “Eglá” e “Hebrom” seguem formas portuguesas reconhecíveis. A formulação preserva a concisão do hebraico e esclarece apenas o que o contexto exige.
