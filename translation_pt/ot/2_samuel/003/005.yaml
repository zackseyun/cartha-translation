    rationale: No hebraico, אֵשֶׁת é «esposa de». Em português contemporâneo, «mulher de» pode ser entendido tanto como esposa quanto simplesmente como uma mulher associada a Davi. «Esposa» comunica a relação pretendida sem introduzir exclusividade.
  - severity: low
