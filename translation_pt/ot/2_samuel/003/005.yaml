    rationale: Após empregar «esposa» no texto, a nota deixa de ser necessária; a possível questão de exclusividade já é resolvida pelo contexto e não exige nota.
  revised_text: e o sexto, Itreão, filho de Eglá, esposa de Davi. Esses filhos nasceram a Davi em Hebrom.
