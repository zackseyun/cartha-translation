base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: pt
  text: 'Então Davi enviou mensageiros a Is-Bosete, filho de Saul, dizendo: “Entregue-me minha esposa Mical, que tomei por noiva para mim[a] pelo preço de cem prepúcios de filisteus[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “que conquistei como esposa pelo preço de cem prepúcios de filisteus”. O hebraico diz mais literalmente: “que tomei por noiva para mim”.'
    reason: lexical_alternative
  - marker: b
    text: Veja 1 Samuel 18:25–27, onde Davi obtém Mical apresentando prepúcios de filisteus como o preço nupcial exigido por Saul.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então Davi enviou
  rationale: O consecutivo narrativo dá continuidade à sequência dos acontecimentos; “Então” produz fluidez natural sem afirmar uma relação causal além do texto.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Em contexto humano, o substantivo designa pessoas encarregadas de levar uma mensagem; “mensageiros” é claro e menos interpretativo que “emissários”.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: a Is-Bosete, filho de Saul
  rationale: Mantém o nome próprio em forma portuguesa reconhecível e reproduz a identificação genealógica do hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Conserva de maneira concisa a fórmula hebraica que introduz o discurso direto.
- source_word: תְּנָה
  choice: Entregue-me
  rationale: O imperativo de נתן significa literalmente “dê”; neste contexto, “entregue-me” comunica com naturalidade a exigência de que Mical seja devolvida a Davi.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: minha esposa Mical
  rationale: A segunda expressão está em aposição à primeira e identifica a esposa. “Esposa” é corrente e digna, evitando possível ambiguidade de “mulher”.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: que tomei por noiva para mim
  rationale: Preserva o sentido específico de compromisso matrimonial de ארשׂ e também o dativo לִי, embora a formulação seja deliberadamente marcada, como no hebraico.
- source_word: בְּמֵאָה
  choice: pelo preço de cem
  rationale: A preposição indica aqui a base ou preço nupcial mediante o qual Davi reivindica ter obtido Mical.
- source_word: עָרְלוֹת פְּלִשְׁתִּים
  choice: prepúcios de filisteus
  rationale: A tradução direta preserva o caráter concreto e chocante do preço nupcial mencionado no relato.
theological_decisions:
- issue: Terminologia do estado matrimonial de Mical
  choice: Manter “minha esposa” juntamente com “tomei por noiva para mim”.
  alternative: Uniformizar a relação como “com quem me casei” ou traduzir toda a frase apenas como aquisição de esposa.
  rationale: O hebraico chama Mical de esposa de Davi, mas fundamenta a reivindicação na linguagem de noivado e preço nupcial. A tradução conserva essa tensão jurídico-relacional em vez de harmonizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Is-Bosete” e “Mical” seguem formas portuguesas tradicionais; a ordem narrativa é natural, enquanto a formulação marcada “tomei por noiva para mim” preserva uma particularidade relevante do hebraico.
