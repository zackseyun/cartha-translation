base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: pt
  text: 'Suas mãos não estavam amarradas,

    e seus pés não foram postos em grilhões de bronze.

    Como se cai diante de filhos da injustiça[a],

    assim você caiu.


    E todo o povo chorou ainda mais por ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “homens perversos” ou “malfeitores”. O hebraico diz literalmente “filhos da injustiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Suas mãos não estavam amarradas
  rationale: O particípio passivo de אָסַר indica o estado de estar amarrado ou preso. “Amarradas” é claro e natural em português e mantém o contraste implícito com um prisioneiro.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: e seus pés não foram presos em grilhões de bronze
  rationale: נְחֻשְׁתַּיִם designa restrições de bronze ou cobre para os pés. “Grilhões de bronze” preserva tanto o material quanto a função; a forma passiva de נגשׁ é vertida idiomaticamente como “foram presos em”.
- source_word: כִּנְפוֹל
  choice: Como alguém cai
  rationale: O infinitivo construto com כְּ introduz uma comparação. “Como alguém cai” expressa em português corrente o sentido genérico sem identificar uma pessoa específica.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: diante de filhos da injustiça
  rationale: A tradução mantém no texto a imagem hebraica בְנֵי עַוְלָה, sem reduzir sua força a uma única interpretação; a nota oferece equivalentes idiomáticos.
- source_word: נָפָלְתָּ
  choice: assim você caiu
  rationale: O perfeito descreve o desfecho trágico já consumado. O pretérito perfeito é a forma natural em português dentro deste lamento.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: E todo o povo chorou ainda mais por ele
  rationale: יסף seguido de infinitivo pode indicar continuação ou aumento da ação. No contexto, “chorou ainda mais” comunica naturalmente a intensificação do pranto após o lamento.
