    issue: «Como alguém cai» seguido de «assim você caiu»
    rationale: A alternância entre presente genérico e passado pontual é possível, mas menos natural no lamento português. A fórmula «Como se cai ... assim você caiu» conserva a comparação genérica e harmoniza melhor com o desfecho passado.
