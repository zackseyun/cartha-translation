  verdict: revise
  source_fidelity: A tradução preserva adequadamente o paralelismo do lamento, a referência às mãos livres, aos grilhões de bronze, à queda diante de «filhos da injustiça» e ao pranto intensificado do povo. Contudo, «seus pés não foram presos em grilhões» é menos preciso para a construção hebraica, que descreve os pés como postos/levados a grilhões.
