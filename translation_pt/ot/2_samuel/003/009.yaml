base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: pt
  text: Que Deus faça isto a Abner, e ainda mais, se eu não fizer em favor de Davi[a] o que Yahweh lhe jurou —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “pois/que, assim como Yahweh jurou a Davi, assim farei por ele”. A fórmula hebraica de juramento é elíptica e pressupõe a condição: “se eu não fizer”.'
    reason: Esclarece a forma condensada da fórmula de autoimprecação e a explicitação idiomática da condição negativa na tradução.
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Que Deus faça isso a Abner e lhe acrescente ainda mais!
  rationale: Reproduz a fórmula hebraica de autoimprecação, mantendo Abner na terceira pessoa e expressando de modo natural em português a intensificação וְכֹה יֹסִיף לוֹ.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O substantivo designa o Deus único neste juramento; o singular é exigido pelo contexto e pela concordância verbal.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca com clareza a correspondência entre o juramento de Yahweh e a ação que Abner se compromete a realizar.
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O perfeito hebraico aponta para um juramento já feito, cujo conteúdo continua vigente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: assim farei por ele
  rationale: O futuro português comunica naturalmente a resolução de Abner. O pronome remete a Davi, e a formulação mantém o paralelismo do hebraico.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem o substituir por um título.
- issue: Relação entre a autoimprecação e a promessa de Abner
  choice: Apresentar a segunda oração como declaração enfática daquilo que Abner fará
  alternative: 'Explicitar uma condição negativa: “se eu não fizer por ele...”'
  rationale: O hebraico massorético não contém uma partícula negativa explícita. A tradução principal preserva sua forma, enquanto a nota registra a leitura idiomática condicional comum da fórmula de juramento.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação torna perceptível a força do juramento, e o travessão final indica que a declaração prossegue no versículo seguinte.
