base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: pt
  text: Todo o povo percebeu isso, e isso lhes pareceu bom[a], assim como tudo o que o rei fazia era bom aos olhos de todo o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foi bom aos olhos deles”; isto é, eles aprovaram o que viram.
    reason: A nota registra o idioma hebraico e seu sentido avaliativo sem tornar a formulação principal artificial.
lexical_decisions:
- source_word: הִכִּירוּ
  choice: percebeu isso
  rationale: O hifil de נכר pode significar reconhecer, discernir ou perceber. O objeto está implícito no hebraico e é retomado em português por “isso”, referindo-se à sinceridade demonstrada pelo rei no contexto.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: achou bom
  rationale: A expressão idiomática hebraica significa considerar algo bom, aprová-lo ou agradar-se dele. “Achou bom” comunica de modo natural a avaliação favorável, enquanto a nota preserva a imagem literal.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: assim como tudo o que o rei fazia
  rationale: 'A preposição כְּ mantém uma relação comparativa: essa reação favorável correspondia à aprovação geral dos atos do rei. O imperfeito contextual “fazia” expressa adequadamente a referência habitual ou geral.'
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título usado no texto hebraico sem inserir explicitamente o nome de Davi.
- source_word: בְּעֵינֵי כָל הָעָם טוֹב
  choice: era bom aos olhos de todo o povo
  rationale: Preserva a repetição de “bom” e, na segunda ocorrência, a imagem hebraica “aos olhos de”, que permanece compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A primeira expressão idiomática foi vertida de forma corrente, enquanto a repetição e a imagem hebraica foram parcialmente preservadas na segunda metade do versículo.
