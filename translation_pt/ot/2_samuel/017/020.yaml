base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: pt
  text: 'Os servos de Absalão foram à casa onde estava a mulher e perguntaram: “Onde estão Aimaás e Jônatas?” A mulher respondeu: “Eles atravessaram o curso de água[a].” Eles os procuraram, mas não os encontraram; então voltaram para Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o riacho” ou “o canal de água”. A expressão hebraica é incomum, e não se sabe ao certo que tipo de curso de água ela indica.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: os servos de Absalão
  rationale: עֶבֶד pode designar servo, escravo ou agente oficial. Neste contexto, refere-se aos homens a serviço de Absalão, sem destacar condição jurídica de escravidão.
- source_word: הָאִשָּׁה הַבַּיְתָה
  choice: à casa da mulher
  rationale: O ה direcional em הַבַּיְתָה indica movimento em direção à casa. A formulação portuguesa é natural e identifica a casa pela mulher já mencionada no contexto, sem afirmar além do texto que os homens entraram nela.
- source_word: עָבְרוּ
  choice: atravessaram
  rationale: עבר expressa aqui a ideia de passar para o outro lado ou além de um curso de água.
- source_word: מִיכַל הַמָּיִם
  choice: o curso de água
  rationale: A expressão hebraica é incomum e sua referência topográfica exata é incerta. “Curso de água” preserva essa generalidade melhor que opções mais específicas como “riacho” ou “canal”.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Eles os procuraram, mas não os encontraram
  rationale: בקשׁ significa procurar neste contexto. Os pronomes são explicitados em português a partir do referente contextual, e “mas” expressa naturalmente o contraste entre a busca e seu resultado.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: então voltaram para Jerusalém
  rationale: שׁוב significa voltar; “então” comunica com naturalidade a sequência narrativa sem impor uma relação causal forte.
