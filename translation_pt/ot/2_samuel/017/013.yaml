  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: pt
  text: E, se ele se retirar para uma cidade, todo o Israel levará cordas até aquela cidade, e nós a arrastaremos até o leito do ribeiro[a], até que não se encontre ali nem sequer uma pequena pedra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o vale” ou “até o ribeiro”. O termo hebraico pode indicar um curso de água, muitas vezes sazonal, bem como seu leito ou vale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem sequer uma pedrinha”. A expressão hebraica é uma imagem hiperbólica de destruição total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: se retirar
  rationale: O nifal de אסף pode exprimir aqui o movimento de David para dentro de uma cidade como retirada militar. “Se retirar para” é natural em português e evita transformar a possível ideia de reunião em uma afirmação explícita de refúgio.
- source_word: וְהִשִּׂיאוּ
  choice: levará
  rationale: No contexto, o verbo descreve todo o Israel transportando cordas até a cidade. “Levará” comunica com clareza esse movimento e concorda com o sujeito coletivo singular em português.
- source_word: חֲבָלִים
  choice: cordas
  rationale: O substantivo designa cordas ou cabos empregados na imagem hiperbólica de arrastar a cidade inteira.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: nós a arrastaremos
  rationale: סחב indica arrastar ou puxar com força. O pronome português feminino retoma naturalmente “cidade”, embora o sufixo hebraico seja masculino.
- source_word: הַנַּחַל
  choice: o leito do ribeiro
  rationale: נחל pode designar tanto um curso de água quanto o seu vale ou leito, muitas vezes sazonal. “Leito do ribeiro” preserva a característica geográfica e soa mais compreensível que o empréstimo “wadi” para leitores gerais.
- source_word: גַּם צְרוֹר
  choice: nem sequer uma pequena pedra
  rationale: צרור pode indicar uma pedra pequena. A formulação conserva tanto a dimensão do objeto quanto a força intensificadora e hiperbólica de גם.
