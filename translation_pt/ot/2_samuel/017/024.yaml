  yaml_path: translation/ot/2_samuel/017/024.yaml
  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: pt
  text: Então, Davi chegou a Maanaim, e Absalão atravessou o Jordão, ele e todos os homens de Israel com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: chegou
  rationale: O qal perfeito de בוא indica aqui a chegada de Davi ao destino; “chegou” é natural em português narrativo.
- source_word: מַחֲנָיְמָה
  choice: a Maanaim
  rationale: O hê direcional no topônimo expressa movimento em direção ao lugar; com “chegou”, o português o representa naturalmente por “a Maanaim”.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: atravessou o Jordão
  rationale: עבר com o marcador de objeto direto e “o Jordão” designa a travessia do rio; esta é a formulação clara e corrente em português.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente explicita novamente o sujeito na construção apositiva “ele e todos os homens de Israel”, sem acrescentar ênfase reflexiva indevida.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: A construção singular coletiva significa literalmente “todo homem de Israel” e, no contexto, refere-se aos homens que acompanhavam Absalão; o plural coletivo é idiomático e preserva a referência masculina do hebraico.
- source_word: עִמּוֹ
  choice: que estavam com ele
  rationale: A expressão indica acompanhamento. A oração relativa produz uma frase natural em português e deixa claro que os homens mencionados acompanhavam Absalão.
- source_word: וְ
  choice: Então / e
  rationale: O primeiro waw faz avançar a narrativa e é bem representado por “Então”; o segundo liga as duas ações e é traduzido por “e”.
