  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: pt
  text: 'Então Aitofel disse a Absalão: “Por favor, deixe-me escolher doze mil homens, levantar-me e perseguir Davi esta noite.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Por favor, escolherei doze mil homens, me levantarei e perseguirei Davi esta noite.”'
    reason: Alternativa que reproduz mais diretamente a sequência de formas coortativas hebraicas, embora possa soar como simples afirmação futura em português.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica naturalmente a sequência em português moderno.
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֶל־אַבְשָׁלֹם
  choice: a Absalão
  rationale: A preposição direcional é vertida de modo natural, e o nome segue a forma tradicional portuguesa.
- source_word: אֶבְחֲרָה נָּא
  choice: Por favor, deixe-me escolher
  rationale: O coortativo com נָא apresenta uma proposta ou pedido cortês; esta formulação conserva essa força em português corrente.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: doze mil homens
  rationale: Mantém o sentido lexical de אִישׁ sem especificar “soldados” ou “guerreiros” além do que o hebraico declara.
- source_word: וְאָקוּמָה
  choice: levantar-me
  rationale: Preserva a imagem de קום e, coordenado com “deixe-me escolher”, comunica a ação proposta sem recorrer a uma construção rígida.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: e perseguir Davi
  rationale: “Perseguir Davi” expressa de forma idiomática o verbo רדף com אַחֲרֵי, evitando a redundância de “perseguir atrás de Davi”.
- source_word: הַלָּיְלָה
  choice: esta noite
  rationale: O substantivo com artigo aponta para a noite presente; “esta noite” é natural e preserva essa referência temporal.
