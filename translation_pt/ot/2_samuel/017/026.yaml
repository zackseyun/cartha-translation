  rationale: O nome designa coletivamente os israelitas, especialmente as forças que acompanhavam Absalão; mantê-lo preserva a formulação e o sentido político do hebraico.
- source_word: וְאַבְשָׁלֹם
  choice: e Absalão
  rationale: A conjunção liga Absalão a Israel como sujeito conjunto. Emprega-se a forma tradicional e corrente do nome em português.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: na terra de Gileade
  rationale: A expressão significa a terra ou região de Gileade. A tradução literal é clara e natural em português.
