base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: pt
  text: 'Agora, mandem depressa avisar Davi: “Não passe esta noite nas planícies do deserto[a]; atravesse sem falta, para que o rei e todo o povo que está com ele não sejam engolidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos vaus do deserto”. O hebraico normalmente designa planícies ou baixadas áridas, mas alguns entendem aqui uma referência ao lugar de travessia, pois a ordem seguinte é atravessar imediatamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz com naturalidade a providência urgente que deve ser tomada em seguida.
- source_word: שִׁלְחוּ מְהֵרָה וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: mandem depressa avisar Davi
  rationale: Expressa a ordem dirigida a mais de uma pessoa e a urgência do envio da mensagem, sem conservar de modo artificial a fórmula hebraica equivalente a “dizendo”.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Não passe esta noite
  rationale: לון significa pernoitar ou passar a noite; esta formulação é clara e corrente em português.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: nas planícies do deserto
  rationale: עֲרָבוֹת designa planícies ou baixadas áridas. Embora o contexto envolva uma travessia, o termo não significa propriamente “vaus”; a alternativa contextual é registrada em nota.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: atravesse sem falta
  rationale: O infinitivo absoluto seguido do verbo conjugado intensifica a ordem. “Sem falta” comunica essa ênfase em português natural.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz o resultado temido que a ação urgente deve evitar; esta construção é mais corrente em português moderno do que “para que não aconteça que”.
- source_word: יְבֻלַּע
  choice: sejam engolidos
  rationale: Preserva a imagem vívida do passivo de בלע, que no contexto comunica serem aniquilados ou arrastados pela calamidade.
- source_word: לַמֶּלֶךְ וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: o rei e todo o povo que está com ele
  rationale: Mantém o título político dado a Davi e o sentido abrangente de עָם, sem restringi-lo a tropas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais no plural e discurso direto conciso. A imagem hebraica de serem “engolidos” foi preservada. A ambiguidade geográfica foi mantida por meio de nota, sem transformar uma inferência contextual em certeza lexical.
