base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: pt
  text: Jônatas e Aimaás permaneciam[a] em En-Rogel. A serva[b] ia até eles e lhes transmitia a informação; eles, por sua vez, iam comunicá-la ao rei Davi, pois não podiam ser vistos entrando na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estavam de pé”; no contexto, o sentido provável é que permaneciam ou estavam posicionados ali.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico refere-se especificamente a uma serva.
    reason: lexical_clarification
lexical_decisions:
- source_word: עֹמְדִים
  choice: permaneciam
  rationale: O particípio significa literalmente “estavam de pé”, mas, com uma indicação de lugar neste contexto narrativo, comunica que Jônatas e Aimaás permaneciam ou estavam posicionados ali.
- source_word: בְּעֵין רֹגֵל
  choice: junto a En-Rogel
  rationale: Mantém o topônimo transliterado e expressa naturalmente a localização indicada pela preposição hebraica.
- source_word: הַשִּׁפְחָה
  choice: a serva
  rationale: O substantivo designa especificamente uma serva, e o artigo definido hebraico indica uma participante conhecida no contexto.
- source_word: וְהָלְכָה ... וְהֵם יֵלְכוּ
  choice: ia ... então eles iam
  rationale: A sequência descreve o procedimento habitual ou planejado para transmitir a mensagem, não apenas um único deslocamento pontual.
- source_word: וְהִגִּידָה לָהֶם ... וְהִגִּידוּ
  choice: lhes transmitia a informação ... comunicá-la
  rationale: O Hifil de נגד significa contar, informar ou comunicar; a formulação portuguesa torna clara a cadeia de transmissão sem acrescentar o conteúdo da mensagem.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: ao rei Davi
  rationale: É a forma natural em português para a combinação hebraica de título e nome.
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת
  choice: pois não podiam ser vistos
  rationale: כִּי introduz a razão do arranjo, e o infinitivo Nifal de ראה expressa aqui o risco de serem vistos ou detectados.
- source_word: לָבוֹא הָעִירָה
  choice: entrando na cidade
  rationale: A terminação direcional de עִירָה indica movimento para dentro da cidade; “entrando” é claro e idiomático em português.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com formas nominais correntes no uso brasileiro. A redação preserva o caráter habitual ou operacional da cadeia de comunicação e não introduz um marcador temporal equivalente a “agora”, ausente do hebraico.
