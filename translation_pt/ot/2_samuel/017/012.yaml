base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: pt
  text: Então iremos contra ele, em um dos lugares onde ele for encontrado, e pousaremos sobre ele, como o orvalho cai sobre o solo; não restará dele nem de todos os homens que estiverem com ele sequer um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Então iremos contra ele
  rationale: בוא com אֶל indica aproximação; neste contexto militar, “ir contra” comunica naturalmente a intenção hostil sem confundir o verbo com o posterior נוח.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: em um dos lugares onde for encontrado
  rationale: Preserva o sentido passivo de נִמְצָא e expressa em português natural a localização ainda indeterminada de Davi.
- source_word: וְנַחְנוּ עָלָיו
  choice: e pousaremos sobre ele
  rationale: נוח significa repousar, assentar-se ou pousar. “Pousaremos sobre” conserva a imagem de cobertura pelo orvalho e mantém a distinção lexical em relação a נפל, “cair”, na comparação seguinte.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: como o orvalho cai sobre o solo
  rationale: Tradução direta da comparação, mantendo נפל como “cair” e אֲדָמָה como “solo”.
- source_word: וְלֹא נוֹתַר בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ גַּם אֶחָד
  choice: Não restará nem ele nem nenhum de todos os homens que estiverem com ele — nem sequer um
  rationale: 'Expressa a negação enfática e total: ninguém do grupo, incluindo Davi, sobreviverá. “Nem sequer um” preserva a força de גַּם אֶחָד.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil. A tradução conserva o contraste entre “pousaremos” (נוח) e “cai” (נפל), bem como a imagem militar de cobertura irresistível.
