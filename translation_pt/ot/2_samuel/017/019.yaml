base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: pt
  text: Então a mulher pegou uma cobertura, estendeu-a sobre a boca do poço e espalhou sobre ela grãos triturados[a]; e não se soube de nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grãos pilados”; o termo hebraico se refere a um produto feito de grãos esmagados ou pilados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; no contexto, “a mulher” identifica naturalmente a personagem sem acrescentar uma relação conjugal não explicitada neste versículo.
- source_word: הַמָּסָךְ
  choice: uma cobertura
  rationale: מָסָךְ designa algo que cobre, como uma cortina, pano ou anteparo. “Cobertura” preserva a amplitude do termo sem especificar o material.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: sobre a boca do poço
  rationale: A expressão significa literalmente “sobre a face do poço”; em português, “boca do poço” comunica com clareza sua abertura.
- source_word: וַתִּשְׁטַח
  choice: espalhou
  rationale: O verbo שׁטח significa estender ou espalhar algo sobre uma superfície; “espalhou” é natural com o produto de grãos usado para disfarçar a cobertura.
- source_word: הָרִפוֹת
  choice: grãos triturados
  rationale: O termo raro רִפוֹת se refere provavelmente a grãos esmagados ou pilados. “Grãos triturados” é claro e mantém a incerteza quanto ao produto exato.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: e não se soube de nada
  rationale: A construção diz literalmente que “nenhuma coisa foi conhecida”. A formulação escolhida conserva a voz impessoal e evita transformar explicitamente o enunciado em finalidade ou resultado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência narrativa foi mantida, e a oração final não foi reformulada como finalidade (“para que”), pois o hebraico apenas declara que nada se soube.
