  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: pt
  text: Um rapaz, porém, os viu e contou a Absalão. Então os dois foram depressa e chegaram à casa de um homem em Baurim. Ele tinha um poço no pátio, e eles desceram ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desceram para dentro dele”, isto é, do poço.'
    reason: Alternativa que explicita o referente implícito de “ali” no contexto.
lexical_decisions:
- source_word: נַעַר
  choice: rapaz
  rationale: O termo pode designar menino, jovem ou servo. “Rapaz” é natural em português e não define além do necessário nem a idade exata nem a condição social.
- source_word: וַיַּגֵּד
  choice: contou
  rationale: No hifil, נגד significa comunicar, contar ou informar. “Contou a Absalão” expressa com clareza e naturalidade o ato de transmitir a informação.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Preserva a referência explícita do hebraico a duas pessoas, em formulação corrente.
- source_word: מְהֵרָה
  choice: depressa
  rationale: O termo, empregado adverbialmente, comunica urgência; “depressa” é claro e idiomático.
- source_word: בֵּית אִישׁ
  choice: a casa de um homem
  rationale: Reproduz diretamente a construção hebraica sem acrescentar identificação ao homem.
- source_word: בְּבַחוּרִים
  choice: em Baurim
  rationale: Baurim é nome de lugar; a preposição “em” expressa naturalmente a localização.
- source_word: בְאֵר
  choice: poço
  rationale: בְּאֵר normalmente designa um poço. Embora “cisterna” seja possível em alguns contextos, o sentido lexical usual foi mantido.
- source_word: בַּחֲצֵרוֹ
  choice: no pátio
  rationale: חָצֵר indica o pátio ou recinto ligado à casa. “Pátio” é a equivalência moderna mais simples e clara.
- source_word: וַיֵּרְדוּ שָׁם
  choice: eles desceram ali
  rationale: Mantém a formulação espacial do hebraico, que diz literalmente “desceram ali”, sem explicitar no texto mais do que a fonte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A divisão em três frases reduz a sobrecarga sintática sem alterar a sequência narrativa. “Porém” preserva a transição adversativa sugerida pelo contexto, e o pronome “ele” retoma sem ambiguidade o homem dono da casa.
