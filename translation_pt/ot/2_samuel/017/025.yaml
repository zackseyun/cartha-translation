base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: pt
  text: Absalão colocou Amasa no comando do exército em lugar de Joabe. Amasa era filho de um homem chamado Itra, o israelita[a], que havia se unido a Abigail, filha de Naás e irmã de Zeruia, mãe de Joabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Itra, o israelita”. Em 1 Crônicas 2:17, lê-se “Jéter, o ismaelita”.'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: colocou ... no comando do exército
  rationale: Expressa naturalmente em português a nomeação de Amasa para exercer autoridade sobre o exército.
- source_word: תַּחַת יוֹאָב
  choice: em lugar de Joabe
  rationale: Neste contexto, תַּחַת indica substituição, não posição espacial.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: filho de um homem chamado Itra
  rationale: Preserva a indefinição de אִישׁ e integra de modo natural a identificação pelo nome.
- source_word: הַיִּשְׂרְאֵלִי
  choice: o israelita
  rationale: Segue o texto massorético fornecido; a leitura divergente de 1 Crônicas 2:17 é registrada em nota.
- source_word: אֲשֶׁר בָּא אֶל
  choice: que havia se unido a
  rationale: Comunica com dignidade o sentido sexual do eufemismo hebraico, sem o tornar desnecessariamente explícito.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Abigail, filha de Naás
  rationale: Reproduz com clareza a relação filial expressa no hebraico.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: irmã de Zeruia, mãe de Joabe
  rationale: Mantém a sequência e a relação apositiva do texto hebraico, no qual 'mãe de Joabe' identifica Zeruia.
