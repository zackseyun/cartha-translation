  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: pt
  text: 'Então Husai disse a Absalão: “O conselho que Aitofel deu desta vez[a] não é bom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nesta ocasião”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então ... disse” expressa essa progressão de modo natural em português.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Forma portuguesa corrente do nome pessoal hebraico.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: a Absalão
  rationale: A preposição indica o destinatário da fala; “a” é a construção portuguesa natural com o verbo “dizer”.
- source_word: לֹא טוֹבָה
  choice: não é bom
  rationale: Mantém a avaliação ampla do hebraico טוֹב, sem restringi-la a “sensato”, “eficaz” ou “favorável”.
- source_word: הָעֵצָה
  choice: o conselho
  rationale: עֵצָה pode designar conselho, parecer ou plano; “conselho” preserva tanto o conteúdo estratégico quanto o papel consultivo de Aitofel.
- source_word: אֲשֶׁר יָעַץ
  choice: que ... deu
  rationale: Em português, “dar um conselho” evita a repetição pouco natural de “o conselho que aconselhou” e comunica a ação concluída.
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Forma portuguesa corrente do nome pessoal hebraico.
- source_word: בַּפַּעַם הַזֹּאת
  choice: desta vez
  rationale: Equivalente idiomático, conciso e natural da expressão hebraica, que também pode significar “nesta ocasião”.
