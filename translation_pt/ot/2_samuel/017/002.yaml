base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: pt
  text: Irei contra ele enquanto estiver cansado e sem forças[a]. Eu o aterrorizarei, e todo o povo que está com ele fugirá. Então abaterei somente o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “fraco de mãos”, expressão que indica falta de força ou coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Atacarei Davi
  rationale: בוא com עַל tem sentido hostil neste contexto. Em português, “atacarei” expressa naturalmente a ação militar; o pronome foi explicitado como “Davi” para evitar uma referência pouco clara no versículo isolado.
- source_word: יָגֵעַ
  choice: cansado
  rationale: O adjetivo indica cansaço resultante de esforço; “cansado” é corrente e adequado ao contexto.
- source_word: וּרְפֵה יָדַיִם
  choice: sem forças[a]
  rationale: A expressão significa literalmente “fraco de mãos” e comunica perda de vigor ou coragem. “Sem forças” preserva o sentido de modo claro, enquanto a nota registra a imagem hebraica.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Eu o deixarei apavorado
  rationale: 'O hifil de חרד é causativo: fazer tremer ou aterrorizar. A formulação portuguesa comunica essa força causativa naturalmente.'
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: e todo o povo que estiver com ele fugirá
  rationale: Mantém a coordenação hebraica e preserva a expressão relacional “que estiver com ele”.
- source_word: וְהִכֵּיתִי
  choice: matarei
  rationale: נכה pode significar ferir ou abater; neste plano militar, tendo o rei como alvo único, a ação é claramente letal. “Matarei” comunica esse sentido contextual em português corrente.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Preserva o substantivo definido e o título do texto hebraico.
- source_word: לְבַדּוֹ
  choice: somente
  rationale: A expressão destaca o rei como alvo exclusivo, sem sugerir necessariamente que ele esteja fisicamente sozinho.
