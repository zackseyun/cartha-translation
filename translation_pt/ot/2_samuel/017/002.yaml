    rationale: O hebraico diz «contra ele» e retoma depois «o rei». Embora a identificação contextual seja Davi, manter o pronome preserva a forma discursiva e a progressão do original.
  - severity: medium
    issue: «Matarei» para וְהִכֵּיתִי
    rationale: No contexto, o ataque provavelmente visa matar, mas o verbo hebraico é literalmente ferir/golpear. «Abaterei» comunica um ataque potencialmente mortal sem tornar a formulação mais específica do que o verbo-fonte.
  revised_text: Irei contra ele enquanto estiver cansado e sem forças[a]. Eu o aterrorizarei, e todo o povo que está com ele fugirá. Então abaterei somente o rei.
