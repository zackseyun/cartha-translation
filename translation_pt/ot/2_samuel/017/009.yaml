  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: pt
  text: 'Veja, neste exato momento ele está escondido numa das covas[a] ou em algum outro lugar. E, quando alguns deles caírem no primeiro ataque, quem ouvir a notícia dirá: “Houve uma matança[b] entre o povo que segue Absalão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa das depressões do terreno”; o termo hebraico pode indicar covas, depressões ou esconderijos semelhantes no terreno.
    reason: lexical_alternative
  - marker: b
    text: “Houve uma matança” também pode ser traduzido por “houve uma derrota” ou “houve um duro golpe”. Aqui, o termo hebraico se refere a um severo revés militar, não a uma epidemia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Veja, neste exato momento
  rationale: “Veja” funciona como chamada vívida de atenção, e “neste exato momento” conserva a urgência enfática de עַתָּה em português natural.
- source_word: נֶחְבָּא
  choice: está escondido
  rationale: Preserva o valor passivo/estativo do particípio nifal sem especificar se Davi se escondeu ou foi ocultado.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: numa das covas
  rationale: פְּחָתִים pode designar covas, depressões ou concavidades do terreno; “covas” é claro e direto, com a amplitude indicada em nota.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: em algum outro lugar
  rationale: Expressa de modo idiomático a alternativa indefinida introduzida por אוֹ.
- source_word: כִּנְפֹל בָּהֶם
  choice: quando alguns deles caírem
  rationale: No contexto militar, a construção pode indicar baixas entre os homens de Absalão. A formulação mantém a referência sem explicar além do necessário.
- source_word: בַּתְּחִלָּה
  choice: no primeiro ataque
  rationale: O sentido literal é “no começo”; no cenário militar, refere-se naturalmente ao embate inicial.
- source_word: הַשֹּׁמֵעַ
  choice: quem ouvir a notícia
  rationale: O particípio com artigo tem sentido genérico. “A notícia” explicita em português o objeto implícito da audição sem alterar o conteúdo.
- source_word: מַגֵּפָה
  choice: uma matança
  rationale: Neste contexto bélico, o termo denota um golpe severo, mortandade ou derrota, e não uma epidemia. “Matança” comunica a gravidade das baixas.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: o povo que segue Absalão
  rationale: אַחֲרֵי indica aqui adesão política e militar, não mera posição espacial.
