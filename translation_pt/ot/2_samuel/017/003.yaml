base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: pt
  text: e farei todo o povo voltar para você[a]. Quando o homem que você procura for resolvido, todos voltarão; todo o povo ficará em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil; literalmente, algo como: “como o retorno de todos, o homem que você procura”. O sentido provável é que o retorno de todos dependia de se resolver a questão do único homem procurado; no contexto, Aitofel propõe atacar esse homem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: e farei ... voltar
  rationale: O hifil de שוב é causativo; a formulação expressa que Aitofel fará o povo retornar, em vez de apenas dizer que ele próprio voltará.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Preserva o sentido comum de עָם e evita restringir indevidamente a referência a um exército.
- source_word: אֵלֶיךָ
  choice: para você
  rationale: Expressa de modo natural a direção do retorno no português moderno.
- source_word: כְּשׁוּב הַכֹּל
  choice: Quando todos voltarem
  rationale: A construção hebraica é difícil e elíptica. Esta tradução mantém a ideia do retorno de todos sem reproduzir uma sintaxe obscura em português.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: o homem que você procura
  rationale: Conserva o singular definido e a oração relativa, apontando para o alvo específico sem inserir o nome de Davi no texto.
- source_word: יִהְיֶה שָׁלוֹם
  choice: ficará em paz
  rationale: שָׁלוֹם indica aqui paz e bem-estar após o fim do conflito; a expressão é idiomática e mantém o sentido político-social.
theological_decisions: []
