  source_fidelity: 'A primeira e a última oração traduzem bem o hebraico: o hifil de שוב requer uma expressão causativa, e «todo o povo ficará em paz» comunica adequadamente יִהְיֶה שָׁלוֹם. A oração central é reconhecidamente elíptica e difícil. «já não estará ali» introduz uma noção explícita de ausência/localização que não está expressa no texto hebraico; a nota pode registrar a inferência contextual sem apresentá-la como parte da redação do versículo.'
