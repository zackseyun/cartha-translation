base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: pt
  text: 'Depois que eles foram embora, os dois saíram do poço, foram e informaram o rei Davi. Disseram a Davi: “Levantem-se e atravessem depressa as águas, pois foi assim que Aitofel aconselhou contra vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: Depois que eles foram embora
  rationale: Expressa naturalmente a partida dos servos de Absalão, referente ao antecedente contextual, sem acrescentar uma identificação ausente no versículo.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: os dois saíram do poço
  rationale: O verbo indica subir para fora; 'os dois' torna explícito em português o sujeito plural, Jônatas e Aimaás, identificado pelo contexto imediato.
- source_word: אֶת הַמַּיִם
  choice: as águas
  rationale: Preserva a expressão hebraica relativamente genérica, que no contexto designa a travessia do Jordão, sem inserir o nome que não aparece no versículo.
- source_word: כָּכָה יָעַץ עֲלֵיכֶם
  choice: este foi o conselho que Aitofel deu contra vocês
  rationale: Reproduz a referência ao plano já comunicado e mantém a orientação hostil indicada por עֲלֵיכֶם.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas correntes como 'levantem-se' e 'depressa'. A alternância entre 'eles' e 'os dois' evita confusão entre os homens que partiram e os mensageiros que saíram do poço.
