  naturalness: A redação é clara e natural em português moderno. «Levantem-se» e «atravessem depressa as águas» mantêm um registro apropriado. A revisão elimina uma pequena amplificação sem prejudicar a fluência.
  terminology: «Poço», «rei Davi», «águas» e «Aitofel» são adequados. O plural imperativo é necessário, pois a fala se dirige a Davi e aos que estão com ele, embora Davi seja nomeado no singular.
