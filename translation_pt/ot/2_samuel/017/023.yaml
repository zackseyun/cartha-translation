base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: pt
  text: Quando Aitofel viu que seu conselho não tinha sido seguido[a], selou o jumento, levantou-se e foi para sua casa, em sua cidade. Deu ordens aos de sua casa[b]; depois, enforcou-se[c] e morreu. E foi sepultado no túmulo de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinha sido posto em prática”. O hebraico diz literalmente: “não tinha sido feito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pôs sua casa em ordem”. Mais literalmente, o hebraico diz: “deu ordens à sua casa”, em que “casa” pode se referir à família ou aos domésticos.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estrangulou-se”. O verbo pode indicar morte por enforcamento ou estrangulamento; neste contexto, descreve o suicídio de Aitofel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: seu conselho
  rationale: עֵצָה pode designar conselho, orientação ou plano; aqui, “conselho” preserva tanto o sentido de recomendação quanto o caráter estratégico e político.
- source_word: לֹא נֶעֶשְׂתָה
  choice: não tinha sido seguido
  rationale: Literalmente, “não tinha sido feito”. No contexto, refere-se ao conselho que não foi posto em prática; “não tinha sido seguido” expressa isso de modo natural, com a alternativa mais literal registrada em nota.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: selou o jumento
  rationale: חבש, com um animal de montaria, significa selá-lo ou prepará-lo para a viagem. O artigo definido hebraico é preservado sem acrescentar um possessivo inexistente.
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: Mantém a sequência narrativa do hebraico em português atual e natural.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: para sua casa, em sua cidade
  rationale: Preserva os dois elementos da expressão hebraica, entendendo o segundo como localização mais específica do primeiro.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: deu ordens à sua casa
  rationale: A formulação permanece próxima do hebraico, no qual “casa” pode designar a família ou os domésticos. A interpretação idiomática “pôs sua casa em ordem” é possível, mas explicita mais do que o texto diz.
- source_word: וַיֵּחָנַק
  choice: enforcou-se
  rationale: O contexto indica suicídio, e a forma verbal pode ser entendida reflexivamente. “Enforcou-se” é natural em português; a possibilidade lexical de estrangulamento é preservada em nota.
- source_word: בְּקֶבֶר אָבִיו
  choice: no túmulo de seu pai
  rationale: קֶבֶר pode significar sepultura ou túmulo; “túmulo” se ajusta ao contexto de sepultamento familiar sem transformar a referência singular em “ancestral”.
