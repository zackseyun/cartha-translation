  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: pt
  text: 'Husai disse: “Você conhece seu pai e os homens dele: eles são guerreiros valentes e estão com a alma amargurada[a], como uma ursa privada de seus filhotes no campo. Além disso, seu pai é homem de guerra e não passará a noite com as tropas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferozes” ou “enfurecidos”; literalmente, “amargurados de alma”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se alojará com o povo”; neste contexto, “povo” provavelmente se refere à força militar de Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: guerreiros valentes
  rationale: Expressa força e valor em contexto militar, de modo natural em português, sem reduzir o termo apenas à força física.
- source_word: מָרֵי נֶפֶשׁ
  choice: com a alma amargurada
  rationale: Preserva a imagem hebraica e sua intensidade emocional; a nota registra sentidos contextuais como ferocidade e fúria.
- source_word: כְּדֹב שַׁכּוּל
  choice: como uma ursa privada de seus filhotes
  rationale: Comunica claramente a imagem de uma ursa que perdeu os filhotes e, por isso, se tornou especialmente perigosa.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta e natural da expressão locativa.
- source_word: אִישׁ מִלְחָמָה
  choice: homem de guerra
  rationale: Mantém a forma idiomática hebraica e caracteriza Davi como guerreiro experiente.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: não passará a noite com as tropas
  rationale: O verbo indica passar a noite ou alojar-se; no contexto, o povo mencionado é a força militar que acompanha Davi.
- source_word: יָדַעְתָּ
  choice: Você conhece
  rationale: Forma direta e natural de expressar o conhecimento que Absalão já tem do pai e dos homens dele.
- source_word: אֲנָשָׁיו
  choice: os homens dele
  rationale: Preserva a expressão abrangente do hebraico, embora o contexto identifique esses homens como combatentes de Davi.
