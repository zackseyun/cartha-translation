base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: pt
  text: 'Então Husai disse aos sacerdotes Zadoque e Abiatar: “Foi isto e aquilo que Aitofel aconselhou a Absalão e aos anciãos de Israel; e foi isto e aquilo que eu aconselhei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: aos sacerdotes Zadoque e Abiatar
  rationale: A construção portuguesa deixa claro que ambos são sacerdotes e reproduz de modo natural a aposição hebraica.
- source_word: כָּזֹאת וְכָזֹאת
  choice: isto e aquilo
  rationale: Mantém a expressão indefinida hebraica, que resume o teor do conselho sem repeti-lo palavra por palavra.
- source_word: יָעַץ
  choice: aconselhou
  rationale: No contexto político e estratégico, “aconselhar” comunica adequadamente o ato de dar conselho.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: a Absalão e aos anciãos de Israel
  rationale: A regência com “a” é natural em português e identifica claramente os destinatários do conselho.
- source_word: יָעַצְתִּי אָנִי
  choice: eu aconselhei
  rationale: O pronome expresso preserva a ênfase do pronome hebraico independente e reforça o contraste com Aitofel.
