base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: pt
  text: Até o homem valente[a], cujo coração é como o de um leão, se derreterá por completo[b], pois todo Israel sabe que seu pai é um guerreiro poderoso e que os homens que estão com ele são valentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “homem de valor”. A mesma expressão hebraica aparece no plural no fim do versículo: “homens de valor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “derreter, se derreterá”, construção enfática que também pode ser traduzida por “certamente perderá a coragem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל / בְנֵי חַיִל
  choice: homem valente / homens valentes
  rationale: A expressão idiomática, literalmente “filho(s) de força/valor”, descreve homens marcados por coragem e capacidade militar. “Valente(s)” é natural em português e mantém a ligação lexical entre as duas ocorrências.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: cujo coração é como o coração do leão
  rationale: Preserva explicitamente a comparação e a imagem do hebraico, sem reduzi-la a um adjetivo como “destemido”.
- source_word: הִמֵּס יִמָּס
  choice: se derreterá por completo
  rationale: Mantém a metáfora hebraica de a coragem se dissolver e expressa a ênfase da construção com infinitivo absoluto e verbo finito.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a afirmação anterior e se encaixa naturalmente no fluxo explicativo.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: todo o Israel sabe
  rationale: Reproduz de modo direto o conhecimento geral e estabelecido expresso pela construção hebraica.
- source_word: גִבּוֹר
  choice: guerreiro poderoso
  rationale: No contexto militar, caracteriza Davi como homem de grande força e capacidade guerreira; esta formulação torna o sentido claro sem confundi-la com as expressões baseadas em חַיִל.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estão com ele
  rationale: Traduz explicitamente a oração relativa que identifica os homens que acompanham Davi.
