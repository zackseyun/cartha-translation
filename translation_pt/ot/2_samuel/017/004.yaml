translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A expressão hebraica “aos olhos de” e sua repetição foram preservadas; “proposta” esclarece o referente narrativo sem resolver indevidamente qualquer tensão teológica.
