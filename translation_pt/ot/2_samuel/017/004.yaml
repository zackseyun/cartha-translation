  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: pt
  text: A proposta pareceu boa aos olhos de Absalão e aos olhos de todos os anciãos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O assunto foi considerado certo por Absalão e por todos os anciãos de Israel.”'
    reason: Alternativa lexical que preserva de modo mais literal הַדָּבָר, וַיִּישַׁר e o sentido avaliativo do idioma בְּעֵינֵי.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: pareceu boa
  rationale: No contexto, o verbo ישר com a expressão בְּעֵינֵי indica que algo foi considerado bom, aceitável ou agradável, não necessariamente moralmente justo em sentido abstrato.
- source_word: הַדָּבָר
  choice: a proposta
  rationale: Embora o termo possa significar literalmente “a palavra”, “a coisa” ou “o assunto”, aqui se refere ao conselho que acabara de ser apresentado; “a proposta” explicita naturalmente esse referente.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: aos olhos de ... e aos olhos de
  rationale: Preserva a imagem do idioma hebraico e sua repetição enfática, mantendo-se claro em português moderno.
- source_word: אַבְשָׁלֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: todos os anciãos de Israel
  rationale: זִקְנֵי designa os anciãos reconhecidos como líderes, e כָּל é mantido pelo quantificador direto “todos”.
