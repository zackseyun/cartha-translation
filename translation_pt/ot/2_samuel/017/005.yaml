base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: pt
  text: 'Então Absalão disse: “Chame também, por favor, Husai, o arquita, e ouçamos o que ele também tem a dizer.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “ouçamos o que está em sua boca, ele também”. A expressão significa “o que ele tem a dizer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: קְרָא נָא
  choice: Chamem ... por favor
  rationale: O imperativo קְרָא, dirigido no contexto aos presentes, combinado com נָא, comunica um pedido cortês. O plural idiomático em português evita sugerir que Absalão chamou Husai pessoalmente.
- source_word: גַּם
  choice: também
  rationale: A primeira ocorrência acrescenta Husai a Aitofel, cuja proposta acabara de ser ouvida.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, o arquita
  rationale: “Husai” segue a forma tradicional e reconhecível em português; “arquita” translitera o gentílico hebraico e é a forma bíblica portuguesa corrente.
- source_word: וְנִשְׁמְעָה
  choice: e ouçamos
  rationale: O coortativo na primeira pessoa do plural exprime proposta ou exortação; “ouçamos” preserva de modo conciso essa força volitiva.
- source_word: מַה בְּפִיו
  choice: o que ... tem a dizer
  rationale: A expressão hebraica literal “o que está em sua boca” refere-se à opinião ou proposta que alguém apresentará. A formulação escolhida comunica naturalmente o sentido em português.
- source_word: גַּם הוּא
  choice: ele também
  rationale: A segunda ocorrência de גַּם enfatiza que Husai, além de Aitofel, deve ser ouvido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada para soar natural, sem apagar a repetição enfática de גַּם (“também”). O marcador da nota foi colocado após a fala a que se refere.
