lexical_decisions:
- source_word: מִשְׁכָּב
  choice: camas
  rationale: O substantivo designa aquilo ou o lugar em que alguém se deita. Embora esteja no singular hebraico, tem valor coletivo nesta lista de provisões; o plural é natural em português.
- source_word: סַפּוֹת
  choice: bacias
  rationale: O termo se refere provavelmente a recipientes domésticos, como bacias ou tigelas. “Bacias” comunica bem o provável uso prático no contexto.
- source_word: כְלִי יוֹצֵר
  choice: vasilhas de barro
  rationale: A expressão significa literalmente “vasilha(s) de oleiro” e designa utensílios de cerâmica. “Vasilhas de barro” é claro e idiomático.
- source_word: חִטִּים
  choice: trigo
  rationale: Equivalente comum e preciso do cereal mencionado.
- source_word: שְׂעֹרִים
  choice: cevada
  rationale: Equivalente comum e preciso do cereal mencionado.
- source_word: קֶמַח
  choice: farinha
  rationale: Designa cereal moído; “farinha” é o equivalente corrente e claro.
- source_word: קָלִי
  choice: grãos torrados
  rationale: O termo designa grãos preparados pelo calor, torrados ou tostados. A mesma tradução é mantida nas duas ocorrências para preservar a repetição do hebraico.
- source_word: פּוֹל
  choice: favas
  rationale: O substantivo provavelmente designa especificamente favas, em vez de feijões em sentido genérico.
- source_word: עֲדָשִׁים
  choice: lentilhas
  rationale: Equivalente padrão e inequívoco do legume mencionado.
