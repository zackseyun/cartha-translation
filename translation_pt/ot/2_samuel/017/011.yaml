  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: pt
  text: Mas aconselho que todo o Israel se reúna sem falta junto a você, desde Dã até Berseba, tão numeroso como a areia à beira-mar, e que você mesmo vá à batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e o seu rosto indo para a batalha”, expressão que indica que ele deveria ir pessoalmente à batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: No contexto, a partícula introduz o conselho alternativo de Husai, em contraste com o plano de Aitofel.
- source_word: יָעַצְתִּי
  choice: aconselho
  rationale: O presente comunica naturalmente a força do ato de aconselhar no discurso direto.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: se reúna sem falta
  rationale: A construção com infinitivo absoluto intensifica o verbo; esta formulação preserva a ênfase em português corrente.
- source_word: עָלֶיךָ
  choice: ao seu redor
  rationale: Com אסף, a preposição pode indicar reunião junto de alguém ou sob sua liderança; 'ao seu redor' mantém essa imagem.
- source_word: כָל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Expressão coletiva e totalizante para o povo ou exército de Israel.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: desde Dã até Berseba
  rationale: Preserva o merismo geográfico convencional que abrange toda a extensão de Israel.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: tão numeroso como a areia à beira-mar
  rationale: Explicita de modo natural que a comparação diz respeito à grande quantidade, preservando a imagem hebraica.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: que você mesmo vá
  rationale: Literalmente, 'e o seu rosto indo'; o idiomatismo indica a presença pessoal de Absalão, com valor enfático.
- source_word: בַּקְרָב
  choice: à batalha
  rationale: קרב designa combate ou batalha; com 'ir', a expressão portuguesa comunica participação pessoal na ação militar.
