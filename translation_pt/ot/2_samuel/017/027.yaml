  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: pt
  text: Quando Davi chegou a Maanaim, Sobi, filho de Naás, de Rabá dos amonitas, Maquir, filho de Amiel, de Lo-Debar, e Barzilai, o gileadita, de Rogelim,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Quando ... chegou
  rationale: A construção narrativa com וַיְהִי seguida de כ e infinitivo introduz a circunstância temporal. Em português, “Quando ... chegou” expressa isso naturalmente, sem acrescentar um marcador temporal inexistente.
- source_word: מַחֲנָיְמָה
  choice: a Maanaim
  rationale: O ה direcional indica movimento em direção ao lugar; em português, isso se expressa naturalmente com “a”.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Sobi, filho de Naás
  rationale: Mantém o nome próprio em transliteração portuguesa corrente e reproduz a relação patronímica.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: de Rabá dos amonitas
  rationale: Rabá é o nome da cidade, e “dos amonitas” traduz de modo natural a designação étnico-geopolítica בְּנֵי עַמּוֹן.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Maquir, filho de Amiel
  rationale: Translitera os nomes segundo formas portuguesas reconhecíveis e preserva formalmente o patronímico.
- source_word: מִלֹּא דְבָר
  choice: de Lo-Debar
  rationale: O topônimo é transliterado e hifenizado para deixar clara sua unidade.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, o gileadita
  rationale: O gentílico indica a identidade regional de Barzilai e é expresso de forma concisa.
- source_word: מֵרֹגְלִים
  choice: de Rogelim
  rationale: O topônimo é transliterado em forma adequada ao português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas de transliteração legíveis para o público brasileiro. A oração permanece sintaticamente aberta, como no versículo hebraico, pois a ação principal e a lista de provisões continuam no versículo seguinte.
