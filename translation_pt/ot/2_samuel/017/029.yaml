base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: pt
  text: 'Levaram também mel, coalhada[a], ovelhas[b] e queijo de leite de vaca[c] para Davi e para o povo que estava com ele comer, pois disseram: “No deserto, o povo está com fome, cansado e com sede.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manteiga” ou “nata”. O termo hebraico pode designar diferentes produtos derivados do leite; aqui provavelmente se refere a leite coalhado.
    reason: lexical_alternative
  - marker: b
    text: Ou “animais do rebanho”. O termo hebraico pode incluir tanto ovelhas como cabras.
    reason: lexical_alternative
  - marker: c
    text: A rara expressão hebraica indica um produto lácteo feito com leite de gado; tradicionalmente é entendida como “queijo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: mel
  rationale: É o sentido usual do termo. Embora em certos contextos possa designar um xarope doce, “mel” é a tradução mais natural nesta lista de mantimentos.
- source_word: חֶמְאָה
  choice: coalhada
  rationale: O termo bíblico designa um produto lácteo espesso ou coagulado, não necessariamente a manteiga batida moderna. “Coalhada” comunica de modo claro o provável alimento antigo.
- source_word: צֹאן
  choice: ovelhas
  rationale: O substantivo coletivo pode abranger ovelhas e cabras. “Ovelhas” mantém a formulação concreta e concisa, enquanto a amplitude lexical é registrada em nota.
- source_word: שְׁפוֹת בָּקָר
  choice: queijo de leite de vaca
  rationale: A expressão rara indica um produto lácteo proveniente do gado. Esta tradução é natural em português e preserva a identificação do alimento como queijo sem especificar seu processo de fabricação.
- source_word: הִגִּישׁוּ
  choice: levaram
  rationale: O verbo significa fazer chegar, aproximar ou apresentar. Neste contexto de abastecimento, “levaram” exprime com naturalidade a entrega dos mantimentos.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ לֶאֱכֹל
  choice: para Davi e para o povo que estava com ele comer
  rationale: 'A formulação conserva os dois destinatários e apresenta o infinitivo como finalidade: os mantimentos foram levados para que fossem consumidos por Davi e seus acompanhantes.'
- source_word: כִּי אָמְרוּ
  choice: pois disseram
  rationale: כִּי introduz a razão da entrega. “Pois” mantém o valor explicativo e o fluxo narrativo.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: com fome, cansado e com sede
  rationale: A tradução preserva os três predicados e seu ritmo sem intensificar indevidamente os termos hebraicos.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: No contexto, מִדְבָּר designa uma região erma e pouco habitada. “Deserto” é claro e corrente em português, sem exigir a ideia específica de dunas de areia.
