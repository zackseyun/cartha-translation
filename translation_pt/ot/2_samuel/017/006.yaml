base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: pt
  text: 'Quando Husai chegou a Absalão, Absalão lhe disse: “Aitofel falou desta maneira. Devemos agir conforme a sua proposta? Se não, fale você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo בוא, seguido de אֶל e em sequência narrativa, indica a chegada de Husai à presença de Absalão.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: perguntou
  rationale: Embora a construção seja literalmente 'disse ... dizendo', o conteúdo inclui uma pergunta deliberativa; 'perguntou' comunica naturalmente a função da fala sem acrescentar conteúdo.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: deu este conselho
  rationale: No contexto, דָבָר designa o teor da proposta apresentada por Aitofel. A formulação portuguesa é natural e mantém a referência demonstrativa a esse conselho.
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Transliteração portuguesa clara e próxima da forma hebraica.
- source_word: הֲנַעֲשֶׂה אֶת דְּבָרוֹ
  choice: Devemos fazer o que ele disse?
  rationale: A pergunta com o imperfeito na primeira pessoa do plural expressa deliberação; 'fazer o que ele disse' representa idiomaticamente o hebraico literal 'fazer sua palavra'.
- source_word: אִם אַיִן
  choice: Se não
  rationale: Expressão condicional contrastiva concisa, equivalente a 'caso não façamos isso'.
- source_word: אַתָּה דַבֵּר
  choice: fale você
  rationale: A posposição do pronome em português preserva a ênfase explícita do hebraico em אַתָּה antes do imperativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O segundo 'Absalão' foi vertido por 'este' para evitar repetição pesada sem obscurecer o referente. Não há necessidade de nota textual ou teológica neste versículo.
