base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: pt
  text: Então Davi se levantou; ele e todo o povo que estava com ele atravessaram o Jordão. Ao raiar da manhã,[a] não havia sequer uma pessoa que não tivesse atravessado o Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a luz da manhã”. A expressão hebraica conserva a imagem da luz matinal e indica o momento até o qual a travessia foi concluída.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: Davi e todo o povo que estava com ele se levantaram
  rationale: A concordância plural torna natural em português a ação conjunta de Davi e seus acompanhantes, sem restringir הָעָם a homens adultos.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: atravessaram o Jordão
  rationale: עבר com o marcador de objeto direto e יַרְדֵּן indica de modo direto a travessia do rio.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Ao raiar da manhã
  rationale: A expressão comunica o limite temporal da ação e preserva a imagem do surgimento da luz matinal em português natural.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: não havia sequer uma pessoa que não tivesse atravessado o Jordão
  rationale: A formulação preserva a estrutura enfática e negativa do hebraico, deixando claro que todos completaram a travessia.
