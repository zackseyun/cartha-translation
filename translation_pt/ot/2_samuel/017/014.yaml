source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: pt
  text: 'Então Absalão e todos os homens de Israel disseram: “O conselho de Husai, o arquita, é melhor do que o conselho de Aitofel”. Pois Yahweh havia determinado[a] frustrar o bom conselho de Aitofel, para que Yahweh trouxesse a calamidade[b] sobre Absalão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “havia ordenado”. O verbo hebraico geralmente significa “ordenar”, mas aqui descreve a decisão eficaz de Yahweh de fazer fracassar o conselho de Aitofel.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “mal”, “desgraça” ou “dano”; aqui se refere à ruína que sobreviria a Absalão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וְכָל אִישׁ יִשְׂרָאֵל
  choice: Então Absalão e todos os homens de Israel disseram
  rationale: O singular hebraico é seguido por um sujeito composto e tem sentido coletivo; o plural em português é exigido pela concordância. “Então” comunica o avanço da narrativa marcado pelo waw consecutivo.
- source_word: טוֹבָה עֲצַת ... מֵעֲצַת
  choice: O conselho ... é melhor do que o conselho
  rationale: טוֹבָה assume valor comparativo diante de מִן. “Conselho” preserva tanto a dimensão de orientação quanto a de estratégia no contexto político.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, o arquita
  rationale: Emprega formas portuguesas correntes para o nome próprio e o gentílico, mantendo a identificação presente no hebraico.
- source_word: צִוָּה
  choice: havia determinado
  rationale: Embora o verbo normalmente signifique “ordenar”, aqui descreve a decisão eficaz de Yahweh quanto ao fracasso do conselho; a nota preserva a alternativa lexical mais direta.
- source_word: לְהָפֵר
  choice: frustrar
  rationale: O hifil de פרר indica tornar o conselho ineficaz, anulá-lo ou fazê-lo fracassar; “frustrar” conserva bem o sentido estratégico.
- source_word: עֲצַת אֲחִיתֹפֶל הַטּוֹבָה
  choice: o bom conselho de Aitofel
  rationale: 'Mantém a avaliação explícita do narrador: o conselho era bom ou eficaz, apesar de Yahweh decidir frustrá-lo.'
- source_word: לְבַעֲבוּר הָבִיא
  choice: para que ... trouxesse
  rationale: Expressa de maneira natural em português a finalidade ou o resultado pretendido indicado pela construção hebraica.
- source_word: הָרָעָה
  choice: a calamidade
  rationale: Neste contexto, רָעָה designa ruína, dano ou desgraça que sobrevém a Absalão, e não necessariamente maldade moral; a nota registra a amplitude do termo.
theological_decisions:
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, que é transliterado de modo reconhecível e repetido nas duas ocorrências, sem substituir uma delas por pronome.
- issue: Ação divina em צִוָּה לְהָפֵר
  choice: Yahweh havia determinado frustrar
  alternative: Yahweh havia ordenado frustrar
  rationale: A formulação comunica a decisão divina eficaz no curso dos acontecimentos sem especificar um mecanismo não expresso pelo texto; a alternativa literal permanece em nota.
- issue: Sentido de הָרָעָה como resultado da ação de Yahweh
  choice: calamidade
  alternative: mal; desgraça; dano
  rationale: O contexto aponta para a ruína judicial de Absalão. “Calamidade” preserva o caráter adverso do termo sem decidir que ele denote mal moral.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade no Brasil e em outros contextos lusófonos. A ordem e a repetição do nome divino acompanham de perto o hebraico, enquanto a sintaxe foi ajustada à concordância e à fluência do português.
