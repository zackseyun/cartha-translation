base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: pt
  text: 'Um homem viu e contou a Joabe, dizendo: “Olhe! Vi Absalão pendurado no terebinto[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no carvalho”. O termo hebraico אֵלָה pode designar um terebinto e às vezes é traduzido de modo mais geral como “carvalho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Um homem
  rationale: Expressa naturalmente em português a referência masculina singular; aqui אֶחָד pode funcionar de modo indefinido, sem exigir o sentido enfático de “um só homem”.
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o verbo sem acrescentar objeto explícito, pois o português permite recuperar pelo contexto aquilo que foi visto.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: foi contar a Joabe
  rationale: Reproduz de modo natural a sequência narrativa e o sentido de comunicar ou relatar algo a Joabe.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: Preserva a função de chamar a atenção em linguagem atual, evitando o arcaísmo “Eis”.
- source_word: רָאִיתִי
  choice: Eu vi
  rationale: O perfeito relata uma observação concluída; o pretérito perfeito é a forma natural em português.
- source_word: תָּלוּי
  choice: pendurado
  rationale: O particípio passivo descreve Absalão em estado de suspensão, sem especificar aqui a causa ou a maneira exata.
- source_word: בָּאֵלָה
  choice: no terebinto
  rationale: אֵלָה designa mais especificamente o terebinto; a preposição ב pode ser expressa naturalmente como “em/no” no contexto de alguém preso entre os ramos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e legibilidade brasileira. “Terebinto” conserva a identificação botânica mais específica, enquanto a nota registra a alternativa tradicional.
