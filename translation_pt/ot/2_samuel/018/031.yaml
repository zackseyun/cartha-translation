base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: pt
  text: 'E eis que o cuxita[a] chegou, e o cuxita disse: “Meu senhor, o rei, receba a boa notícia, pois hoje Yahweh lhe fez justiça[b], livrando-o das mãos de todos os que se levantaram contra o senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o etíope”. Hebraico: “o cuxita”, isto é, um homem de Cuxe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “julgou a seu favor” ou “o vindicou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função discursiva e a vivacidade da chegada repentina, em registro narrativo digno e compreensível.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Mantém o gentílico de Cuxe sem identificá-lo anacronicamente com a Etiópia moderna.
- source_word: יִתְבַּשֵּׂר
  choice: Receba ... a boa notícia
  rationale: Expressa de modo natural o valor jussivo da forma verbal e a proclamação favorável do mensageiro.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Reproduz a fórmula respeitosa de tratamento da corte; a vírgula favorece a leitura natural em português.
- source_word: שְׁפָטְךָ
  choice: lhe fez justiça
  rationale: Conserva o sentido judicial de שׁפט e, ao mesmo tempo, sua força de decisão favorável em benefício de Davi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִיַּד
  choice: livrando-o das mãos de
  rationale: Torna explícita em português a relação entre a decisão judicial e o livramento, preservando a imagem hebraica das mãos como poder hostil.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: todos os que se levantaram contra o senhor
  rationale: Preserva a imagem verbal de oposição e rebelião sem restringir indevidamente o referente.
theological_decisions:
- issue: Sentido judicial e libertador de שְׁפָטְךָ
  choice: lhe fez justiça, livrando-o
  alternative: julgou a seu favor / o vindicou
  rationale: A formulação mantém tanto a dimensão forense quanto o resultado libertador, sem reduzir o verbo apenas à punição dos adversários.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O hebraico traz o nome pessoal divino; a transliteração o preserva diretamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém-se “eis que” pela vivacidade narrativa e “cuxita” pela precisão histórica. Na fala dirigida ao rei, “o senhor” evita a ambiguidade gráfica que surgiria com “você” e conserva o respeito cortesão.
