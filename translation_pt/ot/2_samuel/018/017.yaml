base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: pt
  text: Pegaram Absalão, lançaram-no numa grande cova na floresta e ergueram sobre ele um enorme monte de pedras. E todo o Israel fugiu, cada homem para a sua tenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “cada homem para a sua tenda” significa que cada um voltou para a sua própria moradia, isto é, para casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Pegaram
  rationale: Reproduz o uso narrativo comum de לקח sem acrescentar a ideia de violência explícita de “agarraram” ou “capturaram”.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: lançaram-no
  rationale: שלך indica que o corpo foi jogado ou lançado; a escolha preserva a ação enérgica e indigna em registro narrativo digno.
- source_word: בַיַּעַר
  choice: na floresta
  rationale: Equivalente direto e corrente de יער, mantendo o artigo definido do hebraico.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: numa grande cova
  rationale: פחת designa uma cova, fosso ou depressão. “Cova” é clara em português e adequada ao contexto do corpo de Absalão.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: ergueram sobre ele
  rationale: Com “monte de pedras” como complemento, o verbo expressa levantar ou estabelecer o amontoado por cima do corpo.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: um enorme monte de pedras
  rationale: “Monte de pedras” traduz de modo transparente גַּל אֲבָנִים, e “enorme” comunica naturalmente a intensificação de גָּדוֹל מְאֹד.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: E todo o Israel fugiu
  rationale: Mantém o nome coletivo “Israel” e traduz diretamente o verbo נוּס, usado para fugir.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: cada homem para a sua tenda
  rationale: Preserva tanto a forma distributiva masculina אִישׁ quanto a imagem literal de אֹהֶל; uma nota esclarece o sentido idiomático.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ לְאֹהָלוֹ
  choice: cada homem para a sua tenda
  alternative: cada um para casa
  rationale: A tradução conserva a forma masculina singular do texto e não apaga sua expressão distributiva, embora a alternativa seja mais idiomática.
- issue: Sentido literal ou idiomático de לְאֹהָלוֹ
  choice: para a sua tenda
  alternative: para a sua casa
  rationale: A imagem literal é compreensível e preserva a textura hebraica; a nota registra que a fórmula se refere à volta de cada pessoa à própria moradia.
translation_notes:
  register: Narrativa moderna, clara e digna, com sintaxe natural tanto para leitores brasileiros quanto para um público lusófono amplo. Emprega “lançaram-no” e “ergueram” para manter solenidade sem arcaísmo excessivo; conserva na frase final a expressão concreta e distributiva do hebraico.
