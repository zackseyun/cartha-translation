  text: אֽוֹ עָשִׂ֤יתִי ב/נפש/ו שֶׁ֔קֶר וְ/כָל דָּבָ֖ר לֹא יִכָּחֵ֣ד מִן הַ/מֶּ֑לֶךְ וְ/אַתָּ֖ה תִּתְיַצֵּ֥ב מִ/נֶּֽגֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: pt
  text: Ou, se eu tivesse agido traiçoeiramente contra a vida dele — e nada fica oculto ao rei —, você mesmo teria ficado de lado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁקֶר
  choice: agido traiçoeiramente
  rationale: No contexto, o termo indica falsidade ou deslealdade com consequências contra a vida de Absalão; “traiçoeiramente” comunica melhor essa gravidade do que o mais genérico “com falsidade”.
- source_word: בְנַפְשׁוֹ
  choice: contra a vida dele
  rationale: Segue a forma consonantal apresentada no WLC, com sufixo de terceira pessoa masculina, e preserva a referência à vida de Absalão.
- source_word: לֹא יִכָּחֵד
  choice: nada fica oculto
  rationale: Expressa naturalmente a ideia de que nenhum assunto pode ser escondido do rei, sem acrescentar um agente não indicado no hebraico.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: teria ficado de lado
  rationale: A expressão descreve alguém que se mantém à distância ou não oferece apoio; “ficado de lado” é idiomático em português e conserva a acusação de abandono.
theological_decisions:
- issue: Referente de בְנַפְשׁוֹ
  choice: a vida dele
  alternative: a minha vida
  rationale: A tradução segue diretamente o texto hebraico fornecido, cuja forma contém o sufixo “dele”, sem harmonizá-lo com variantes textuais ou traduções tradicionais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os travessões mantêm a observação sobre o conhecimento do rei como inciso, enquanto a construção condicional permanece fluente.
