base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: pt
  text: Então Joabe tocou a trombeta[a], e as tropas voltaram, deixando de perseguir Israel[b], pois Joabe conteve as tropas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o chifre”. O hebraico shofar designa um chifre usado para dar sinais, muitas vezes um chifre de carneiro.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as forças israelitas que apoiavam Absalão.
    reason: cultural_note
  - marker: c
    text: Ou “reteve as tropas” ou “poupou as tropas”. O verbo hebraico pode expressar a ideia de reter, conter ou poupar; neste contexto, provavelmente indica que Joabe impediu seus homens de continuar a perseguição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: tocou
  rationale: Com שׁוֹפָר como instrumento, תקע significa fazê-lo soar. Em português, “tocou a trombeta” é a expressão idiomática natural.
- source_word: בַּשֹּׁפָר
  choice: a trombeta
  rationale: שׁוֹפָר designa um chifre usado para sinalização. “Trombeta” comunica com naturalidade sua função militar; a nota preserva a forma concreta do instrumento.
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: as tropas deixaram de perseguir
  rationale: שׁוב seguido de מן e infinitivo indica interrupção da ação. No contexto militar, הָעָם se refere aos combatentes de Joabe, de modo que “as tropas” é mais claro que o literal “o povo”.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome coletivo do hebraico sem inserir no texto principal uma explicação contextual.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual a perseguição cessou, com fluidez narrativa em português.
- source_word: חָשַׂךְ
  choice: conteve
  rationale: O verbo pode significar reter, impedir ou poupar. Aqui, “conteve” expressa que Joabe impediu suas tropas de continuar a perseguição, sem atribuir explicitamente um motivo de misericórdia.
- source_word: אֶת הָעָם
  choice: as tropas
  rationale: No cenário de batalha, o referente são os homens sob o comando de Joabe. A escolha mantém a clareza e a coerência com a primeira ocorrência de הָעָם.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Tropas” explicita o sentido militar contextual de הָעָם; “conteve” preserva a amplitude semântica de חָשַׂךְ, enquanto a nota registra alternativas genuínas.
