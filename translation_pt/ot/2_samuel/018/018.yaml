base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: pt
  text: 'Absalão havia tomado e erguido para si, ainda em vida, a coluna que fica no Vale do Rei, pois disse: “Não tenho nenhum filho que mantenha a lembrança do meu nome”. Por isso, deu à coluna o seu próprio nome, e até hoje ela é chamada Monumento de Absalão[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Mão de Absalão”. Aqui, “mão” é uma expressão usada para um marco memorial ou monumento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב
  choice: havia tomado e erguido
  rationale: O mais-que-perfeito composto situa a iniciativa antes dos acontecimentos narrados ao redor; “erguido” expressa naturalmente a colocação de uma coluna memorial.
- source_word: בְחַיּו
  choice: ainda em vida
  rationale: Forma portuguesa concisa e idiomática para indicar que Absalão fez isso durante sua própria vida.
- source_word: מַצֶּבֶת
  choice: coluna
  rationale: Preserva a imagem concreta de uma pedra ou coluna erguida, sem antecipar a interpretação de monumento memorial.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: no Vale do Rei
  rationale: Tradução direta e natural do topônimo hebraico.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: que mantenha a lembrança do meu nome
  rationale: Expressa a finalidade de perpetuar a memória do nome, sem reduzir a frase apenas à continuidade genealógica.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: deu à coluna o seu próprio nome
  rationale: Comunica com clareza o sentido idiomático de nomear a coluna segundo o próprio nome.
- source_word: יַד אַבְשָׁלוֹם
  choice: Monumento de Absalão
  rationale: Neste contexto, “mão” funciona como designação idiomática de um marco ou monumento memorial; a forma literal é preservada em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português corrente da fórmula temporal hebraica.
