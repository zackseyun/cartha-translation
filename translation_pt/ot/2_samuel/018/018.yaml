  terminology: «Coluna» preserva bem o caráter concreto de מַצֶּבֶת; «Monumento de Absalão» comunica de modo idiomático o nome יַד אַבְשָׁלוֹם, com a leitura literal devidamente indicada em nota. «Vale do Rei» é uma tradução adequada do sintagma locativo.
