revisions:
- from: 'Então Aimaás, filho de Zadoque, insistiu com Joabe: “Aconteça o que acontecer, deixe-me, por favor, correr também atrás do cuxita.” Joabe, porém, respondeu: “Por que você quer correr, meu filho, se não há recompensa para você por essa notícia?”[a]'
  to: 'Então Aimaás, filho de Zadoque, voltou a dizer a Joabe: “Aconteça o que acontecer, deixe-me, por favor, correr também atrás do cuxita.” Joabe, porém, respondeu: “Por que você corre, meu filho, se você não tem notícia que traga recompensa?”[a]'
  rationale: A revisão restitui explicitamente «notícia» na cláusula final, mantendo «recompensa» como uma interpretação contextual possível de מֹצֵאת e registrando na nota a alternativa de uma notícia favoravelmente recebida. Também troca «insistiu» por uma expressão menos interpretativa para a fala retomada e preserva a pergunta de Joabe mais perto do hebraico.
