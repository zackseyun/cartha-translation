base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: pt
  text: 'Então Aimaás, filho de Zadoque, voltou a dizer a Joabe: “Aconteça o que acontecer, deixe-me, por favor, correr também atrás do cuxita.” Joabe, porém, respondeu: “Por que você corre, meu filho, se você não tem notícia que traga recompensa?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da última frase é difícil. Também pode significar: “se você não tem uma notícia que será bem recebida?”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... וַיֹּאמֶר
  choice: insistiu
  rationale: A construção literal ‘acrescentou ainda e disse’ introduz uma nova tentativa de Aimaás. ‘Insistiu’ exprime naturalmente em português a repetição persistente do pedido no contexto.
- source_word: וִיהִי מָה
  choice: Aconteça o que acontecer
  rationale: Expressão idiomática de indiferença quanto às consequências; esta formulação é corrente e preserva a determinação de Aimaás.
- source_word: אָרֻצָה נָּא
  choice: deixe-me, por favor, correr
  rationale: O coortativo com נָא comunica um pedido voluntarioso, mas cortês; ‘deixe-me, por favor’ reproduz essa nuance com naturalidade.
- source_word: גַם אֲנִי
  choice: também
  rationale: Marca Aimaás como um corredor adicional, depois do cuxita já enviado.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Transliteração histórica do gentílico ligado a Cuxe, sem identificá-lo de modo anacrônico com fronteiras da Etiópia moderna.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Por que você quer correr
  rationale: A pergunta expressa a objeção perplexa de Joabe. Em português, ‘quer correr’ transmite de modo natural a intenção de Aimaás, embora o hebraico diga mais literalmente ‘por que é que você corre?’.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém a forma de tratamento afetuosa ou condescendente, sem pressupor filiação literal.
- source_word: וּלְכָה אֵין בְּשׂוֹרָה מֹצֵאת
  choice: se não há recompensa para você por essa notícia
  rationale: A cláusula hebraica é elíptica e difícil. A tradução conserva a leitura contextual de que a notícia não proporcionará ganho ou recompensa ao mensageiro, enquanto a nota registra outra interpretação plausível.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. ‘Cuxita’ preserva o referente histórico; a principal ambiguidade da cláusula final é explicitada em nota.
