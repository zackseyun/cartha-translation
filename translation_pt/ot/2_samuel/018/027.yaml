  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: pt
  text: 'Então o vigia disse: “Vejo que a maneira de correr do primeiro é como a de Aimaás, filho de Zadoque.” E o rei disse: “Ele é um homem bom e vem[a] com boas notícias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “virá com boas notícias”; a forma verbal hebraica também pode ser entendida como futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: o vigia
  rationale: O particípio substantivado designa quem observa de um posto de vigilância; “vigia” é natural, claro e adequado ao cenário narrativo.
- source_word: מְרוּצַת הָרִאשׁוֹן כִּמְרֻצַת
  choice: Pelo jeito de correr, vejo que o primeiro é
  rationale: A formulação idiomática comunica que o vigia reconhece o primeiro homem pela maneira como corre, preservando o valor comparativo do hebraico sem produzir uma repetição pouco natural em português.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Aimaás, filho de Zadoque
  rationale: Emprega formas portuguesas tradicionais e explicita a relação indicada por בֶּן.
- source_word: אִישׁ טוֹב זֶה
  choice: Ele é um homem bom
  rationale: Reproduz de maneira natural a avaliação positiva expressa pelo rei, sem restringir “bom” a uma qualidade específica não declarada no texto.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: e vem trazer boas notícias
  rationale: Expressa naturalmente a ideia de que o mensageiro se aproxima com uma mensagem favorável; “boas notícias” mantém o sentido de בְּשׂוֹרָה טוֹבָה.
