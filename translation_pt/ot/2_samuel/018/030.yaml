  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: pt
  text: 'O rei disse[a]: “Vá para o lado e fique aqui.” Então ele foi para o lado e ficou de pé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vire-se e fique aqui.” O verbo hebraico pode indicar, de modo geral, o ato de virar-se, mas, neste contexto, provavelmente significa ir para o lado a fim de dar passagem ao mensageiro seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa de אמר que introduz discurso direto; “disse” é a equivalência natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido refere-se ao rei já conhecido no contexto.
- source_word: סֹב
  choice: Vá para o lado
  rationale: Imperativo de סבב. Embora o verbo denote de modo geral virar-se, neste contexto a ordem provavelmente manda o mensageiro sair do caminho; a formulação é clara e natural sem especificar além do necessário.
- source_word: הִתְיַצֵּב
  choice: fique
  rationale: O hitpael de יצב significa posicionar-se ou permanecer em determinada posição. Depois de “vá para o lado”, “fique” expressa naturalmente a ordem.
- source_word: כֹּה
  choice: aqui
  rationale: Neste contexto imperativo, o advérbio indica o lugar em que o mensageiro deve ficar.
- source_word: וַיִּסֹּב
  choice: foi para o lado
  rationale: Retoma o verbo da ordem anterior e descreve seu cumprimento, preservando a ligação lexical em português.
- source_word: וַיַּעֲמֹד
  choice: ficou ali
  rationale: עמד pode significar ficar de pé ou permanecer. “Ficou ali” é idiomático no contexto e indica que ele assumiu a posição indicada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez amplamente compreensível e boa legibilidade brasileira. A repetição da ação ordenada e cumprida foi preservada, enquanto “ali” no fechamento evita a combinação pouco natural “foi para o lado e ficou” sem complemento.
