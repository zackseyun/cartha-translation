    issue: “Insistiu” substitui “disse” na narração introdutória.
    rationale: Embora o contexto mostre a persistência de Aimaás, וַיֹּאמֶר significa “e disse”. Manter “disse” evita acrescentar interpretação à narração e deixa a insistência ser expressa pela própria fala.
  - severity: low
    issue: A nota b oferece “passou pelo cuxita” como alternativa.
    rationale: Essa formulação pode sugerir apenas passar ao lado dele, enquanto o contexto e o uso de עבר com objeto direto apontam para alcançá-lo e passar à frente. “Deixou o cuxita para trás” expressa melhor a alternativa contextual.
