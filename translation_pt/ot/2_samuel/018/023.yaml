  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: pt
  text: 'Mas ele disse: “Aconteça o que acontecer, deixe-me correr.” Então Joabe lhe disse: “Corra.” E Aimaás correu pelo caminho da planície[a] e ultrapassou o cuxita[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A planície provavelmente é a planície do Jordão; o hebraico não exige essa especificação no texto principal.
    reason: cultural_note
  - marker: b
    text: 'Ou: “deixou o cuxita para trás”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: 'Mas ele insistiu: “Aconteça o que acontecer, deixe-me correr.”'
  rationale: A expressão idiomática transmite a insistência de Aimaás em obter permissão para correr, qualquer que fosse o desfecho. “Insistiu” torna explícita a força pragmática do diálogo, enquanto a fala preserva seu caráter concessivo e volitivo.
- source_word: רוּץ
  choice: Corra
  rationale: Imperativo direto de רוץ, reproduzido de modo natural e conciso.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: pelo caminho da planície
  rationale: Preserva tanto a ideia de rota ou caminho quanto a designação geográfica geral הַכִּכָּר, sem especificar no texto principal que se trata da planície do Jordão.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: e ultrapassou o cuxita
  rationale: No contexto de uma corrida, עבר com objeto direto indica que Aimaás alcançou e passou à frente do mensageiro cuxita. “Ultrapassou” exprime isso naturalmente sem sugerir necessariamente superioridade geral de velocidade.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Mantém a designação étnico-geográfica referente a Cuxe, evitando a identificação tradicional, mas menos precisa, com “etíope”.
- source_word: אֲחִימַעַץ
  choice: Aimaás
  rationale: Forma portuguesa corrente e reconhecível do nome hebraico.
