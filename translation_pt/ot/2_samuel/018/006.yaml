  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: pt
  text: Assim, as tropas saíram ao campo para enfrentar Israel[a], e a batalha aconteceu na floresta de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o povo”; aqui, a expressão se refere à força de combate de Davi, daí “as tropas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: as tropas
  rationale: Embora o substantivo normalmente signifique “o povo”, neste contexto militar refere-se à força de combate de Davi. “As tropas” expressa esse sentido contextual em português natural.
- source_word: הַשָּׂדֶה
  choice: ao campo
  rationale: O substantivo designa campo ou terreno aberto; com o verbo “sair”, “saíram ao campo” comunica o deslocamento para a área de batalha.
- source_word: לִקְרַאת
  choice: para enfrentar
  rationale: A expressão significa ir ao encontro de alguém e, em contexto bélico, implica confronto hostil. “Para enfrentar” torna essa força contextual clara sem identificar Israel de modo mais específico que o hebraico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio do texto hebraico, que no contexto designa as forças adversárias alinhadas com Absalão.
- source_word: הַמִּלְחָמָה
  choice: a batalha
  rationale: Embora o termo também possa significar “guerra”, aqui se refere ao combate específico narrado.
- source_word: וַתְּהִי
  choice: aconteceu
  rationale: O verbo significa literalmente “foi/veio a ser”; com “batalha”, “aconteceu” é uma formulação portuguesa natural.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: na floresta de Efraim
  rationale: Reproduz naturalmente a construção hebraica e preserva o topônimo sem tentar resolver questões geográficas não esclarecidas pelo texto.
