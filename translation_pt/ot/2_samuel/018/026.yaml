base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: pt
  text: 'Então o vigia viu outro homem correndo e chamou o guardião do portão, dizendo: “Veja! Um homem está correndo sozinho.” E o rei disse: “Esse também traz notícias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é mensageiro”; o particípio hebraico pode designar alguém que leva uma notícia, muitas vezes uma boa notícia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: o vigia
  rationale: O particípio de צפה designa quem fica de vigia; “vigia” é claro, atual e adequado ao cenário do portão da cidade.
- source_word: אִישׁ אַחֵר
  choice: outro homem
  rationale: Indica um homem adicional, distinto do primeiro corredor.
- source_word: רָץ
  choice: correndo / vem correndo
  rationale: O particípio retrata a ação em andamento. A primeira ocorrência liga-se naturalmente a “viu”; na fala direta, “vem correndo” explicita o movimento observado em direção à cidade sem alterar o sentido.
- source_word: הַשֹּׁעֵר
  choice: o porteiro
  rationale: No contexto do portão da cidade, designa seu encarregado. “Porteiro” é corrente e natural em português.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: A partícula chama a atenção do interlocutor para o que está sendo visto; “Olhe!” conserva essa força em linguagem moderna.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: Expressa que o corredor não integra um grupo.
- source_word: גַּם זֶה
  choice: Esse também
  rationale: Preserva tanto a força demonstrativa de זֶה quanto a ideia aditiva de גַּם, com formulação natural em português.
- source_word: מְבַשֵּׂר
  choice: traz notícias
  rationale: O particípio piel de בשׂר pode indicar quem traz uma notícia, frequentemente boa, mas o contexto imediato não exige explicitar que seja favorável.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição hebraica de “o vigia” foi reduzida na segunda oração, pois o sujeito permanece inequívoco em português. O discurso direto foi pontuado de modo natural.
