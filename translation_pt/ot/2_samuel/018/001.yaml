  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: pt
  text: Então Davi passou em revista o povo que estava com ele e colocou à frente deles comandantes de milhares e comandantes de centenas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contou” ou “inspecionou”; o verbo hebraico pode indicar uma revista militar, não apenas uma contagem.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o povo”; neste contexto, refere-se à força que estava com Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: passou em revista
  rationale: No contexto militar, פקד indica inspecionar, reunir ou organizar as forças, e não apenas contá-las. “Passou em revista” comunica esse sentido administrativo-militar em português natural.
- source_word: הָעָם
  choice: o povo
  rationale: עם significa literalmente “povo”. Aqui designa a força que acompanhava Davi; manter “o povo” preserva a formulação hebraica, enquanto a nota esclarece o referente militar.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estava com ele
  rationale: Reproduz de modo direto a relação expressa no hebraico, sem ampliá-la para uma cadeia formal de comando.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: nomeou sobre eles
  rationale: שׂים com עַל pode expressar a colocação ou nomeação de alguém em posição de autoridade. A formulação mantém tanto o ato administrativo quanto a relação hierárquica.
- source_word: שָׂרֵי
  choice: comandantes
  rationale: שׂר designa um líder ou oficial; neste contexto militar, “comandantes” é claro, atual e adequado.
- source_word: אֲלָפִים
  choice: milhares
  rationale: Embora אֶלֶף possa designar também uma unidade social ou militar, a expressão convencional em paralelo com “centenas” favorece a tradução numérica, sem excluir completamente a ideia de unidades organizadas.
- source_word: מֵאוֹת
  choice: centenas
  rationale: Integra a fórmula militar-administrativa paralela a “milhares” e preserva a estrutura do hebraico.
