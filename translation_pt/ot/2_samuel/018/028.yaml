base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: pt
  text: 'Aimaás chamou em voz alta e disse ao rei: “Paz!”[a] Então se prostrou diante do rei, com o rosto por terra, e disse: “Bendito seja Yahweh, seu Deus, que entregou[b] os homens que levantaram a mão contra meu senhor, o rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo está bem!” Nesse contexto, o hebraico shalom pode anunciar bem-estar ou notícias favoráveis, e não apenas servir de saudação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pôs em suas mãos”. O verbo hebraico descreve entregar alguém ao poder de outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gritou
  rationale: No contexto de um mensageiro que se aproxima e anuncia sua notícia ao rei, o verbo indica chamar em voz alta; “gritou” é natural e conciso.
- source_word: שָׁלוֹם
  choice: Paz!
  rationale: Preserva a forma compacta e a amplitude do hebraico, que pode funcionar como saudação ou anúncio de que tudo correu bem; a nota registra essa ambiguidade.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: prostrou-se diante do rei, com o rosto em terra
  rationale: Expressa concretamente a reverência corporal completa indicada pelo verbo e pela locução hebraica.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Bendito seja Yahweh, seu Deus
  rationale: Mantém a fórmula doxológica e verte o nome divino como Yahweh, conforme a convenção do projeto.
- source_word: סִגַּר
  choice: entregou
  rationale: Neste contexto militar, significa entregar alguém ao poder de outro. “Entregou” é corrente em português e evita sugerir apenas confinamento.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Refere-se aos opositores masculinos específicos envolvidos na revolta.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: levantaram a mão contra
  rationale: Conserva a imagem hebraica de ação hostil ou rebelião sem substituí-la por uma interpretação abstrata.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: contra o rei, meu senhor
  rationale: Mantém a deferência cortesã de Aimaás e produz uma ordem natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e segue a convenção declarada do projeto, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala preserva o tom formal da corte sem arcaísmos desnecessários; a ambiguidade de shalom é mantida no texto e esclarecida em nota.
