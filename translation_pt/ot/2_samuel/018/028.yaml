  naturalness: A redação é clara e de registro apropriado. “Chamou em voz alta e disse ao rei” é mais preciso e natural no contexto narrativo do que “gritou ao rei”. “Com o rosto em terra” é compreensível; “com o rosto por terra” é uma formulação mais idiomaticamente corrente.
