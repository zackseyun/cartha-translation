base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: pt
  text: 'Então Aimaás, filho de Zadoque, disse: “Por favor, deixe-me correr e levar a notícia ao rei: Yahweh lhe fez justiça, livrando-o do poder de seus inimigos”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק
  choice: Então Aimaás, filho de Zadoque
  rationale: O waw faz a narrativa avançar, expresso naturalmente por “Então”. Os nomes seguem as formas portuguesas bíblicas correntes, e a relação filial é preservada.
- source_word: אָמַר
  choice: disse
  rationale: Equivalente corrente e direto para a introdução de discurso.
- source_word: אָרוּצָה נָּא
  choice: Por favor, deixe-me correr
  rationale: O coortativo expressa desejo ou pedido, enquanto נָא lhe confere tom de súplica cortês.
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: e levar a notícia ao rei
  rationale: O piel de בשׂר indica anunciar ou levar notícias, frequentemente favoráveis. “Levar a notícia” é natural em português e não acrescenta uma conotação técnica posterior.
- source_word: כִּי
  choice: ':'
  rationale: Aqui a partícula pode introduzir o conteúdo ou fundamento da notícia. Os dois-pontos apresentam esse conteúdo com clareza sem forçar exclusivamente “porque” ou “pois”.
- source_word: שְׁפָט/וֹ יְהוָה
  choice: Yahweh lhe fez justiça
  rationale: שׁפט com sufixo dativo expressa que Yahweh julgou em favor do rei ou lhe concedeu justiça. A formulação mantém o aspecto judicial, em vez de reduzi-lo apenas a resgate.
- source_word: מִ/יַּד אֹיְבָי/ו
  choice: livrando-o do poder de seus inimigos
  rationale: “Mão” é uma metáfora hebraica de poder ou domínio. A explicitação idiomática comunica seu sentido com naturalidade em português, e o gerúndio relaciona o livramento à justiça concedida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de שְׁפָטוֹ no contexto da vitória
  choice: lhe fez justiça, livrando-o
  alternative: o livrou / julgou em seu favor
  rationale: A tradução conserva tanto a dimensão judicial do verbo שׁפט quanto o resultado concreto indicado por “do poder de seus inimigos”, sem identificar o verbo somente com resgate.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a cortesia do pedido, a nuance favorável da notícia e a tensão entre justiça judicial e livramento concreto.
