base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: pt
  text: Davi estava sentado entre os dois portões[a], e o sentinela subiu ao terraço do portão, junto à muralha. Ergueu os olhos e viu um homem correndo sozinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre as duas estruturas dos portões”. O hebraico diz literalmente “entre os dois portões” e provavelmente se refere ao espaço dentro de uma entrada fortificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: estava sentado
  rationale: O particípio descreve a postura contínua de Davi naquele momento da narrativa; a construção progressiva é natural em português.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: entre os dois portões
  rationale: Mantém o sentido literal do hebraico sem especificar indevidamente a configuração arquitetônica.
- source_word: הַצֹּפֶה
  choice: o sentinela
  rationale: Designa naturalmente quem vigiava a partir da fortificação; é atual, claro e adequado ao contexto.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: ao terraço do portão, junto à muralha
  rationale: גַּג é o teto ou terraço superior da estrutura; a formulação preserva a relação espacial com a muralha sem impor detalhes arquitetônicos.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Ergueu os olhos
  rationale: Preserva de modo natural a expressão idiomática hebraica.
- source_word: וַיַּרְא וְהִנֵּה
  choice: e viu que vinha
  rationale: Expressa em português narrativo corrente tanto a percepção quanto a apresentação imediata da cena, sem o arcaísmo de 'eis'.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a referência masculina singular explícita do texto.
- source_word: רָץ
  choice: correndo
  rationale: O particípio apresenta o homem em pleno ato de correr quando é avistado.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: Comunica com clareza que o homem corria sem companhia.
