  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: pt
  text: 'Ali, o povo de Israel foi derrotado diante dos servos de Davi, e naquele dia houve ali uma grande matança[a]: vinte mil homens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o golpe”, “a derrota” ou “a praga”. A palavra hebraica pode designar uma praga em outros contextos, mas aqui se refere ao golpe mortífero sofrido em batalha.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “vinte mil”. A palavra “homens” foi acrescentada para maior clareza no contexto da batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: foi derrotado
  rationale: O nifal de נָגַף indica aqui sofrer derrota ou ser golpeado em batalha. “Foi derrotado” comunica com clareza o sentido militar sem afirmar que cada indivíduo foi morto.
- source_word: עַם יִשְׂרָאֵל
  choice: o povo de Israel
  rationale: Mantém a expressão hebraica, que neste contexto se refere às forças israelitas, sem substituí-la interpretativamente por “exército” ou “tropas”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Em contexto militar, a expressão indica derrota diante de um adversário. “Diante de” preserva a formulação hebraica e é clara em português.
- source_word: עַבְדֵי דָוִד
  choice: os servos de Davi
  rationale: עֶבֶד pode designar servo, oficial ou homem a serviço de alguém. Aqui se refere aos seguidores ou soldados de Davi; “servos de Davi” conserva a amplitude do termo.
- source_word: הַמַּגֵּפָה
  choice: matança
  rationale: Embora מַגֵּפָה possa significar “praga” em outros contextos, neste relato de batalha designa o golpe mortífero ou as mortes causadas no combate. “Matança” expressa naturalmente esse sentido contextual.
- source_word: גְדוֹלָה
  choice: grande
  rationale: Reproduz diretamente o adjetivo hebraico e comunica a magnitude da matança.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a correspondência temporal direta e natural da expressão hebraica.
- source_word: עֶשְׂרִים אָלֶף
  choice: vinte mil homens
  rationale: O hebraico apresenta apenas o número. “Homens” é acrescentado para deixar explícito, no contexto da batalha, que se trata da contagem de combatentes mortos ou atingidos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “houve ali uma grande matança” evita rigidez excessiva e conserva a repetição espacial do hebraico. A tradução mantém “povo de Israel” e “servos de Davi” para preservar a formulação e a amplitude semântica do original.
