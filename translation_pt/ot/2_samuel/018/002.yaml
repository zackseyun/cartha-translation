  to: 'Davi enviou as tropas: um terço sob o comando de Joabe[a], um terço sob o comando de Abisai, filho de Zeruia e irmão de Joabe, e um terço sob o comando de Itai, o geteu. Então o rei disse às tropas: “Eu também certamente sairei com vocês.”'
