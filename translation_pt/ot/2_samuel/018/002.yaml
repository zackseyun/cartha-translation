  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: pt
  text: 'Davi enviou as tropas: um terço sob o comando de Joabe[a], um terço sob o comando de Abisai, filho de Zeruia e irmão de Joabe, e um terço sob o comando de Itai, o geteu. Então o rei disse às tropas: “Eu também certamente sairei com vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “na mão de”, expressão que aqui significa “sob a autoridade ou o comando de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: enviou
  rationale: No contexto militar, indica que Davi despachou suas forças para a ação; “enviou” é natural e suficientemente preciso em português.
- source_word: הָעָם
  choice: as tropas
  rationale: Embora o sentido básico seja “o povo”, o contexto imediato identifica o grupo como a força combatente de Davi.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: um terço
  rationale: A forma repetida designa cada uma das três divisões do contingente.
- source_word: בְּיַד
  choice: sob o comando de
  rationale: A expressão significa literalmente “na mão de” e, neste contexto militar, denota autoridade ou comando.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai, filho de Zeruia e irmão de Joabe
  rationale: Preserva as duas identificações familiares em construção portuguesa clara e natural.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, o geteu
  rationale: Usa formas tradicionais e inteligíveis dos nomes e identifica Itai como natural de Gate.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: O conectivo narrativo hebraico é vertido de modo fluente, mantendo a designação “o rei”.
- source_word: יָצֹא אֵצֵא
  choice: irei pessoalmente
  rationale: O infinitivo absoluto com o verbo finito intensifica a afirmação da participação do rei; em conjunto com גַּם אֲנִי, “irei pessoalmente” comunica essa ênfase com naturalidade.
- source_word: גַּם אֲנִי
  choice: Eu também ... pessoalmente
  rationale: Preserva tanto a ideia aditiva de גַּם (“também”) quanto a ênfase no próprio rei expressa pelo pronome explícito.
- source_word: עִמָּכֶם
  choice: com vocês
  rationale: Expressa diretamente o acompanhamento dos soldados na batalha, com ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Vocês” evita uma forma regionalmente marcada; “sob o comando de” explicita de modo natural o idioma militar hebraico. O paralelismo triplo foi preservado.
