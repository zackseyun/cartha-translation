  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: pt
  text: 'O rei lhes disse: “Farei o que parecer melhor a vocês.” Então o rei ficou ao lado do portão[a], e todo o povo saiu em grupos de cem e de mil[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao portão”. O hebraico diz literalmente “à mão do portão”, expressão que indica uma posição ao lado dele.
    reason: lexical_alternative
  - marker: b
    text: Isto é, em unidades militares organizadas.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: o que parecer melhor a vocês
  rationale: Expressa naturalmente em português o idiomatismo hebraico de avaliação, literalmente “o que for bom aos olhos de vocês”, sem exigir que se preserve uma imagem pouco corrente.
- source_word: אֶעֱשֶׂה
  choice: farei
  rationale: Tradução direta do verbo עשה no contexto da aceitação, pelo rei, da decisão dos seus homens.
- source_word: אֶל יַד הַשַּׁעַר
  choice: ao lado do portão
  rationale: O hebraísmo literalmente relacionado à “mão do portão” indica uma posição junto ou ao lado dele; esta forma é clara e natural em português.
- source_word: וְכָל הָעָם
  choice: todo o povo
  rationale: Mantém o substantivo abrangente do hebraico, embora o contexto mostre que se trata do contingente militar.
- source_word: יָצְאוּ
  choice: saiu
  rationale: Preserva o sentido amplo de יצא, sem acrescentar a ideia mais específica de marchar.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: em grupos de cem e de mil
  rationale: Torna explícito, de modo econômico, que os números descrevem unidades organizadas, como pede o contexto militar, e preserva a estrutura numérica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala do rei foi vertida idiomaticamente; “povo” conserva a formulação hebraica, e a organização militar é esclarecida pela expressão “em grupos” e pela nota.
