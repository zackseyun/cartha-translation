base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: pt
  text: 'Mas o homem disse a Joabe: “Ainda que eu estivesse pesando mil peças de prata nas palmas das minhas mãos[a], eu não estenderia a mão contra o filho do rei, pois, aos nossos ouvidos, o rei ordenou a você, a Abisai e a Itai: ‘Protejam, por minha causa, o jovem Absalão’[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “eu pesando mil [peças] de prata sobre as palmas das minhas mãos”. A expressão se refere ao recebimento de uma grande quantia de prata por peso.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto hebraico no fim do versículo é difícil; literalmente: “Protejam מי o jovem, em/contra Absalão”. Muitos entendem o sentido à luz de 18:5 como: “Protejam, por minha causa, o jovem Absalão”.'
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: Ainda que pesassem mil peças de prata sobre as palmas das minhas mãos
  rationale: Mantém a imagem hebraica da prata pesada sobre as palmas como grande pagamento, sem acrescentar a unidade “siclos”, ausente no texto.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: eu não estenderia a mão contra
  rationale: Preserva a imagem do idioma hebraico e comunica uma ação violenta contra alguém.
- source_word: בֶּן הַמֶּלֶךְ
  choice: o filho do rei
  rationale: Reprodução direta e natural da relação real enfatizada pelo homem.
- source_word: בְאָזְנֵינוּ
  choice: diante de nossos ouvidos
  rationale: Conserva deliberadamente a imagem hebraica e indica que os presentes ouviram pessoalmente a ordem.
- source_word: צִוָּה
  choice: ordenou
  rationale: Expressa adequadamente a instrução dada com autoridade pelo rei.
- source_word: שִׁמְרוּ
  choice: Protejam
  rationale: No contexto, o imperativo requer manter Absalão a salvo; “protejam” comunica isso de modo corrente e claro.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: por amor a mim, o jovem Absalão
  rationale: Segue o sentido contextual da ordem paralela em 2 Samuel 18:5, enquanto a dificuldade do texto massorético é preservada em nota.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O artigo definido identifica o homem específico já presente na narrativa.
- source_word: וְלֹא אָנֹכִי
  choice: Ainda que... eu não
  rationale: A construção concessiva e o pronome explícito são representados por uma recusa enfática e idiomática em português.
