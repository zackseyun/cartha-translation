base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: pt
  text: 'O rei ordenou a Joabe, a Abisai e a Itai: “Por minha causa, tratem com brandura o jovem Absalão”[a]. E todo o povo ouviu quando o rei deu a todos os comandantes essa ordem a respeito de Absalão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tratem com brandura, por mim, o jovem — Absalão”. O hebraico reúne de forma concisa o apelo pessoal do rei e a identificação do jovem como Absalão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: O rei ordenou
  rationale: Preserva a força autoritativa de צוה e mantém o título usado pelo hebraico, sem substituí-lo pelo nome de Davi.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: a Joabe, a Abisai e a Itai
  rationale: Emprega as formas portuguesas correntes dos nomes próprios e representa naturalmente os objetos indiretos de “ordenou”.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: O infinitivo quotativo hebraico é expresso de modo natural em português pelos dois-pontos, evitando o menos idiomático “dizendo” sem perder sua função.
- source_word: לְאַט לִי
  choice: Por amor a mim, tratem com brandura
  rationale: לְאַט indica brandura ou contenção no modo de agir, enquanto לִי comunica o apelo pessoal de Davi. “Por amor a mim” preserva essa força relacional.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: o jovem Absalão
  rationale: 'נַעַר pode designar um jovem ou rapaz; “jovem” evita infantilizar Absalão. O segundo ל é entendido como especificação ou aposição: o jovem, isto é, Absalão.'
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: E todo o povo ouviu
  rationale: Mantém o sentido literal de הָעָם e ressalta que a ordem real foi ouvida publicamente, embora o contexto seja militar.
- source_word: בְּצַוֺּת הַמֶּלֶךְ אֶת כָּל הַשָּׂרִים
  choice: quando o rei deu a todos os comandantes essa ordem
  rationale: A construção temporal com בְּ e o infinitivo é vertida por “quando”. “Comandantes” explicita o sentido militar de שָּׂרִים, e “deu ... essa ordem” evita repetição pesada sem enfraquecer צוה.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: a respeito de Absalão
  rationale: Equivalente português claro e digno para a locução que significa “acerca de” ou “com respeito a”.
