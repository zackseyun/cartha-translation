base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: pt
  text: 'Joabe lhe disse: “Hoje você não é portador de notícias[a]. Poderá levar notícias em outro dia, mas hoje não levará notícias, porque o filho do rei está morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portador de boas notícias”. O termo hebraico pode designar notícias ou novas, muitas vezes favoráveis; aqui, porém, o contexto é a morte do filho do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: portador da notícia
  rationale: A expressão significa literalmente “homem de notícia/novas”. “Portador da notícia” comunica naturalmente a função do mensageiro, sem caracterizar como boa a notícia da morte de Absalão.
- source_word: וּבִשַּׂרְתָּ
  choice: Poderá levar notícias
  rationale: Neste contexto, a forma verbal aponta para a permissão ou oportunidade futura concedida por Joabe, em contraste com a proibição válida naquele dia.
- source_word: לֹא תְבַשֵּׂר
  choice: não levará notícia alguma
  rationale: A construção negativa na fala de Joabe tem força proibitiva. A formulação portuguesa é firme e natural, e “alguma” reforça a negação sem alterar o sentido.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente o motivo da proibição.
- source_word: בֶּן הַמֶּלֶךְ
  choice: o filho do rei
  rationale: Reproduz com naturalidade a relação expressa pela cadeia construta hebraica.
- source_word: מֵת
  choice: está morto
  rationale: Expressa o estado resultante que fundamenta a decisão de Joabe.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente idiomático moderno da expressão temporal hebraica, repetida para manter o contraste com “outro dia”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição de “hoje” e “notícia/notícias” preserva a ênfase e o jogo lexical do hebraico, enquanto a nota mantém a possível nuance de boas notícias.
