base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: pt
  text: 'Joabe disse: “Não vou ficar esperando assim diante de você.” Então pegou três dardos[a] na mão e os cravou no coração de Absalão, enquanto ele ainda estava vivo no coração do terebinto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “três varas”, “hastes” ou “cajados”. O termo hebraico tem esses sentidos, mas aqui parece designar armas usadas para perfurar.
    reason: lexical_alternative
  - marker: b
    text: Ou “carvalho”. O hebraico geralmente designa o terebinto; “no coração” significa aqui “no meio” ou “no interior” da árvore.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: ficarei esperando diante de você
  rationale: O hifil de יחל expressa aqui espera ou demora, e לְפָנֶיךָ significa literalmente “diante de você”. A formulação mantém o sentido e soa natural em português atual.
- source_word: לֹא כֵן
  choice: Não ficarei assim
  rationale: כֵן pode apontar para a maneira ou situação presente. Integrar “assim” à recusa de Joabe evita a construção pouco natural “Não assim” e preserva a nuance do hebraico.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: três dardos
  rationale: שֵׁבֶט normalmente designa uma vara, haste ou cajado, mas o contexto militar e o verbo de cravar indicam armas pontiagudas. “Dardos” comunica esse uso sem pressupor lanças longas; a amplitude lexical é preservada em nota.
- source_word: וַיִּתְקָעֵם
  choice: os cravou
  rationale: תקע descreve uma ação enérgica de introduzir ou fincar algo. “Cravou” transmite de modo conciso a violência do ato.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: no coração de Absalão
  rationale: A tradução conserva a referência anatômica explícita do hebraico, sem generalizá-la para “peito”.
- source_word: עוֹדֶנּוּ חַי
  choice: enquanto ele ainda estava vivo
  rationale: A expressão enfatiza que Absalão ainda não havia morrido quando Joabe o atingiu.
- source_word: בְּלֵב הָאֵלָה
  choice: no coração do terebinto
  rationale: אֵלָה designa normalmente o terebinto, e לֵב pode indicar o interior ou meio. A tradução literal “coração” preserva a repetição intencional com o coração de Absalão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla legibilidade brasileira. Conservou-se a repetição de “coração” para reproduzir o efeito lexical do hebraico, embora “no coração do terebinto” seja menos idiomático do que “no meio do terebinto”.
