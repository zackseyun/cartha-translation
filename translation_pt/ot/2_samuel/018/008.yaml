  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: pt
  text: A batalha se espalhou ali por toda a região[a], e naquele dia a floresta devorou mais gente do que a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A batalha ficou dispersa por toda a região”. O particípio hebraico pode ressaltar a dispersão da batalha pela área.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: se espalhou
  rationale: O particípio nifal de פוץ descreve a batalha como dispersa ou espalhada. A forma verbal natural em português comunica sua extensão geográfica sem perder a ideia de dispersão.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: por toda a região
  rationale: A expressão hebraica indica ampla extensão geográfica. Neste contexto, הָאָרֶץ se refere à área local da batalha, e não ao planeta; “região” evita essa possível leitura equivocada e soa natural em português.
- source_word: וירב ... לֶאֱכֹל
  choice: devorou mais
  rationale: Com o infinitivo “devorar” e a construção comparativa, a frase afirma que a floresta causou mais mortes. A formulação conserva tanto a comparação quanto a personificação hebraica.
- source_word: היער
  choice: a floresta
  rationale: יַעַר designa uma área arborizada; “floresta” é claro, corrente e mantém a força da imagem narrativa.
- source_word: בעם
  choice: gente
  rationale: No contexto de baixas militares, “mais gente” expressa naturalmente o sentido partitivo do hebraico, sem sugerir necessariamente a totalidade do povo como entidade nacional.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: do que a espada
  rationale: A comparação explícita foi mantida. O verbo “devorou”, já expresso na oração principal, fica naturalmente subentendido em português, enquanto a personificação da espada permanece perceptível.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Tradução direta e idiomática da expressão temporal, adequada ao estilo narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por toda a região” transmite o alcance local da expressão hebraica de modo mais natural que o decalque “sobre a face de toda a terra”. A metáfora da floresta que devora foi preservada.
