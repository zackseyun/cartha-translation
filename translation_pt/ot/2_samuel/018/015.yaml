lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: cercaram
  rationale: O verbo סבב descreve aqui o movimento dos homens ao redor de Absalão, formando um cerco. “Cercaram” comunica esse sentido tático de modo natural e conciso.
- source_word: עֲשָׂרָה נְעָרִים
  choice: dez jovens
  rationale: נְעָרִים pode designar jovens em serviço militar ou doméstico; neste contexto, são subordinados combatentes de Joabe, não crianças. “Jovens” preserva a amplitude lexical sem especificar além do texto.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: escudeiros de Joabe
  rationale: A expressão significa literalmente os que carregavam as armas ou o equipamento de Joabe. “Escudeiros” é a designação militar tradicional e clara em português para esses auxiliares armados.
- source_word: וַיַּכּוּ
  choice: golpearam-no
  rationale: נכה é um verbo amplo com o sentido de bater ou ferir. “Golpearam-no” expressa a ação física e distingue esse ato do verbo seguinte, que declara explicitamente a morte.
- source_word: וַיְמִיתֻהוּ
  choice: o mataram
  rationale: A forma causativa de מות significa fazer morrer ou matar. “O mataram” é direta, natural e preserva a sequência narrativa.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
