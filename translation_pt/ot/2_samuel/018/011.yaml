base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: pt
  text: 'Então Joabe disse ao homem que lhe havia trazido a notícia: “Veja só, você o viu! Por que não o golpeou ali mesmo, lançando-o por terra? Eu teria de lhe dar[a] dez peças de prata[b] e um cinturão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “caberia a mim dar a você”. A expressão hebraica indica responsabilidade ou obrigação.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz apenas “dez de prata”; a unidade de peso ou valor não é especificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: que lhe havia trazido a notícia
  rationale: O particípio substantivado descreve o homem que informou Joabe. A formulação portuguesa expressa com naturalidade que a informação acabara de ser transmitida.
- source_word: וְהִנֵּה רָאִיתָ
  choice: Então você o viu!
  rationale: A interjeição introduz a reação incisiva de Joabe. O objeto, Absalão, está implícito no hebraico e é recuperado naturalmente pelo pronome em português.
- source_word: לֹא הִכִּיתוֹ שָׁם אָרְצָה
  choice: não o golpeou ali mesmo, lançando-o por terra
  rationale: Mantém a imagem de golpear e a direção para o chão sem substituir o verbo diretamente por “matar”, embora o contexto sugira intenção letal.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: Eu teria de lhe dar
  rationale: A construção com עָלַי e infinitivo expressa encargo ou obrigação. “Teria de” preserva essa força idiomática em português corrente.
- source_word: עֲשָׂרָה כֶסֶף
  choice: dez peças de prata
  rationale: O hebraico diz literalmente “dez de prata” e não especifica a unidade; “peças” completa a expressão sem pressupor siclos ou moedas cunhadas.
- source_word: חֲגֹרָה אֶחָת
  choice: um cinturão
  rationale: חֲגֹרָה designa algo usado para cingir a cintura. “Cinturão” é claro e preserva o numeral hebraico na forma do artigo indefinido.
theological_decisions:
- issue: Força da expressão וְעָלַי לָתֶת לְךָ
  choice: Eu teria de lhe dar
  alternative: Eu teria lhe dado
  rationale: A tradução escolhida conserva a ideia de obrigação ou responsabilidade expressa por “sobre mim” mais infinitivo, em vez de reduzi-la a uma simples ação hipotética.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” na fala direta. Evitaram-se tanto o arcaísmo “eis que viste” quanto a explicitação interpretativa “matar”. Os marcadores aparecem junto às expressões que explicam.
