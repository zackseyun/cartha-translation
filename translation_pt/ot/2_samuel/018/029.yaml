base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: pt
  text: 'O rei perguntou: “Está tudo bem com o jovem Absalão?” Aimaás respondeu: “Vi uma grande agitação[a] quando Joabe enviou o servo do rei e este seu servo, mas não soube o que era.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande multidão” ou “um grande tumulto”; o termo hebraico pode indicar uma multidão, barulho ou tumulto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Está tudo bem com
  rationale: Neste contexto interrogativo, שָׁלוֹם pergunta pelo bem-estar de Absalão. A formulação é natural em português e evita restringir o sentido apenas à sua segurança física.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: o jovem Absalão
  rationale: נַעַר pode designar menino, jovem ou servo. Aqui, “o jovem Absalão” conserva a referência indireta e carregada de afeto de Davi ao filho.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: uma grande agitação
  rationale: הָמוֹן pode indicar multidão, ruído, alvoroço ou tumulto. “Grande agitação” expressa o movimento e a perturbação percebidos por Aimaás sem definir além do que o hebraico permite.
- source_word: לִשְׁלֹחַ
  choice: quando ... enviou
  rationale: O infinitivo construto com ל é vertido naturalmente como oração temporal em português.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: o servo do rei
  rationale: עֶבֶד pode significar servo ou escravo; neste contexto, trata-se de um subordinado oficial do rei, e “servo” é a opção contextual mais adequada.
- source_word: וְאֶת עַבְדֶּךָ
  choice: e este seu servo
  rationale: A expressão é uma fórmula cortês de autorreferência. O demonstrativo “este” esclarece em português que Aimaás fala de si mesmo, preservando o tom deferente.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: mas não soube o que era
  rationale: O hebraico termina elipticamente com “não soube o quê”. O complemento “era” torna a frase idiomática em português sem acrescentar conteúdo substancial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Está tudo bem com” comunica de modo corrente a pergunta pelo bem-estar; “este seu servo” mantém a deferência da linguagem de corte sem soar excessivamente arcaica.
