  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: pt
  text: 'Mas o povo disse: “Você não deve sair, pois, se fugirmos, eles não nos darão atenção[a]; e, se metade de nós morrer, também não nos darão atenção. Pois agora você vale por dez mil de nós[b]. Portanto, é melhor que fique na cidade, pronto para nos ajudar[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não porão o coração em nós”, expressão que significa que não farão de nós sua principal preocupação.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “você é como dez mil de nós”.'
    reason: lexical_alternative
  - marker: c
    text: A frase final provavelmente indica que Davi deveria permanecer na cidade para prestar apoio ou enviar reforços, se necessário.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Você não deve sair
  rationale: A forma verbal negada funciona aqui como uma proibição ou advertência enfática. A tradução conserva essa força em português atual.
- source_word: כִּי אִם נֹס נָנוּס
  choice: pois, se fugirmos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ideia de fugir; no contexto condicional, a formulação simples é mais natural em português e mantém o sentido essencial.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: eles não nos darão atenção
  rationale: A expressão hebraica, literalmente ligada a ‘pôr o coração em direção a’, indica dirigir atenção ou interesse a alguém; no contexto militar, refere-se ao foco do inimigo.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: e, se metade de nós morrer
  rationale: Mantém o sentido básico de מות, ‘morrer’, sem explicitar ‘ser morto’, embora esse seja o contexto de batalha.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Pois agora você vale por dez mil de nós
  rationale: Expressa de modo idiomático a comparação entre o valor estratégico de Davi e o de dez mil homens, enquanto a nota preserva a forma mais literal.
- source_word: וְעַתָּה טוֹב
  choice: Portanto, é melhor
  rationale: טוֹב apresenta aqui a alternativa preferível; ‘é melhor’ comunica naturalmente essa função no raciocínio.
- source_word: מֵעִיר
  choice: da cidade
  rationale: A preposição מן indica o ponto de origem ou a localização a partir da qual viria a ajuda.
- source_word: לְעָזִיר
  choice: pronto para nos ajudar
  rationale: A forma é entendida em relação à raiz עזר, ‘ajudar’. A redação comunica que Davi permaneceria na cidade disponível para prestar auxílio, sem definir a forma exata desse apoio.
theological_decisions: []
