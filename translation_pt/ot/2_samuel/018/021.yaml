base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: pt
  text: 'Então Joabe disse ao cuxita[a]: “Vá e conte ao rei o que você viu.” O cuxita inclinou-se diante de Joabe e correu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cuxi”, se a expressão for entendida como nome próprio; tradicionalmente, “o etíope”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: o cuxita
  rationale: Mantém o gentílico hebraico, que identifica o mensageiro por sua origem ou etnia, sem tratá-lo necessariamente como nome próprio nem recorrer ao equivalente geográfico tradicional, menos preciso, “etíope”.
- source_word: לֵךְ
  choice: Vá
  rationale: Equivalente natural em português para o imperativo de הלך neste comando direto.
- source_word: הַגֵּד
  choice: conte
  rationale: O hifil imperativo de נגד significa dar a conhecer ou relatar; “conte ao rei” é corrente e claro em português.
- source_word: אֲשֶׁר רָאִיתָה
  choice: o que você viu
  rationale: Representa de modo natural a oração relativa e o perfeito hebraico, referindo-se ao que o mensageiro acabara de presenciar.
- source_word: וַיִּשְׁתַּחוּ
  choice: inclinou-se diante de
  rationale: Preserva o gesto corporal de reverência e deferência a Joabe sem sugerir necessariamente adoração nem especificar uma prostração completa.
- source_word: וַיָּרֹץ
  choice: saiu correndo
  rationale: Expressa tanto o sentido simples de correr quanto a partida imediata do mensageiro, implícita no encadeamento narrativo.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: “Então” marca naturalmente em português o avanço sequencial da narrativa indicado pelo waw consecutivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O tratamento “você” torna a fala direta natural sem perder respeito; “cuxita” preserva a designação histórica e a ambiguidade entre gentílico e possível nome próprio é registrada em nota.
