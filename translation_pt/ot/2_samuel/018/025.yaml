base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: pt
  text: 'Então a sentinela gritou e informou o rei. O rei disse: “Se ele vem sozinho, traz uma notícia”. E o homem continuava se aproximando cada vez mais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: a sentinela
  rationale: Designa a pessoa postada para vigiar; “sentinela” é natural em português e se ajusta ao contexto militar.
- source_word: וַיִּקְרָא
  choice: gritou
  rationale: Neste contexto, o verbo indica que a sentinela levantou a voz para anunciar o que via.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: informou o rei
  rationale: O hifil de נגד expressa comunicar ou relatar; “informou” preserva de modo conciso o caráter do anúncio.
- source_word: אִם לְבַדּוֹ
  choice: Se ele vem sozinho
  rationale: Embora o hebraico diga mais literalmente “se ele está sozinho”, o contexto é o de um corredor que vem ao encontro do rei; a formulação portuguesa explicita naturalmente esse movimento sem alterar o sentido.
- source_word: בְּשׂוֹרָה
  choice: uma notícia
  rationale: O substantivo pode designar notícia ou boa notícia. Aqui, a inferência do rei pode sugerir uma mensagem favorável, mas o termo não precisa ser explicitamente qualificado; “notícia” preserva a amplitude lexical.
- source_word: בְּפִיו
  choice: traz
  rationale: A expressão hebraica é literalmente “há notícia em sua boca”. “Traz uma notícia” comunica o mesmo idioma mensageiro de forma clara e natural em português.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: continuava se aproximando cada vez mais
  rationale: A construção expressa ação progressiva e proximidade crescente; esta redação reproduz naturalmente esse aspecto em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A tradução mantém a indefinição de בְּשׂוֹרָה como “notícia”, sem impor que seja favorável, e verte o idioma “em sua boca” por uma expressão corrente em português.
