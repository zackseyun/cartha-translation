base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: pt
  text: 'Então o rei perguntou ao cuxita: “Está tudo bem[a] com o jovem Absalão?” O cuxita respondeu: “Que os inimigos do meu senhor, o rei, e todos os que se levantam contra ti para o mal sejam como aquele jovem”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O jovem Absalão está a salvo?” O hebraico pergunta literalmente por seu “shalom”, termo abrangente que inclui paz, bem-estar e segurança, não apenas sobrevivência.'
    reason: lexical_alternative
  - marker: b
    text: 'O cuxita responde de modo indireto: suas palavras dão a entender que Absalão teve o destino dos inimigos do rei, sem declarar abertamente que ele morreu.'
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Preserva o gentílico hebraico referente a uma pessoa de Cuxe, sem substituí-lo pelo rótulo moderno e menos exato “etíope”.
- source_word: הֲשָׁלוֹם
  choice: Está tudo bem
  rationale: Expressa de modo natural a pergunta pelo shalom — bem-estar, segurança e condição geral — sem restringi-la apenas à sobrevivência.
- source_word: לַנַּעַר
  choice: com o jovem
  rationale: נַעַר pode designar menino, moço ou jovem; aqui se refere a Absalão, um filho adulto, por isso “jovem” evita uma conotação infantil.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יִהְיוּ
  choice: Que ... sejam
  rationale: Reproduz a força volitiva ou imprecatória do jussivo hebraico.
- source_word: כַנַּעַר
  choice: como aquele jovem
  rationale: Mantém a comparação e a referência indireta a Absalão, sem explicitar sua morte além do que diz o mensageiro.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: os inimigos do meu senhor, o rei
  rationale: Conserva a forma respeitosa de tratamento e a estrutura da expressão cortesã hebraica.
- source_word: קָמוּ עָלֶיךָ
  choice: se levantam contra ti
  rationale: Traduz o idioma hebraico de oposição hostil ou rebelião e preserva o pronome de segunda pessoa.
- source_word: לְרָעָה
  choice: para o mal
  rationale: Mantém tanto a ideia de intenção nociva quanto a dimensão moral de רָעָה.
- source_word: וַיֹּאמֶר
  choice: perguntou / respondeu
  rationale: No contexto do diálogo, verbos discursivos específicos produzem português natural, enquanto o conteúdo interrogativo e responsivo permanece explícito.
