base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: pt
  text: Absalão veio a encontrar-se, por acaso, com os homens de Davi. Ele montava a mula, e a mula passou por baixo da ramagem cerrada de um grande terebinto[a]. A cabeça de Absalão ficou presa no terebinto, e ele ficou suspenso entre o céu e a terra, enquanto a mula que estava debaixo dele seguiu adiante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por baixo da ramagem cerrada de um grande carvalho”. O termo hebraico אֵלָה também pode ser entendido de modo mais geral como uma árvore de grande porte, mas “terebinto” é a identificação lexical mais precisa aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: encontrou-se por acaso diante de
  rationale: O nifal de קרא neste contexto indica um encontro incidental, não procurado; a formulação preserva esse caráter fortuito e a relação espacial expressa por לִפְנֵי.
- source_word: עַבְדֵי דָוִד
  choice: os homens de Davi
  rationale: Embora עֲבָדִים possa significar 'servos', no contexto militar designa os homens ou combatentes ligados ao rei; 'homens de Davi' é natural e contextual sem acrescentar uma condição servil.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: montava a mula
  rationale: Reproduz naturalmente em português a construção participial que descreve a situação de Absalão naquele momento e mantém definido o animal.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: por baixo da ramagem cerrada de um grande terebinto
  rationale: שׂוֹבֶךְ denota uma massa densa ou entrelaçada de ramos; אֵלָה é vertido com maior precisão botânica por 'terebinto', e גְּדוֹלָה por 'grande'.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: A cabeça de Absalão ficou presa no terebinto
  rationale: A expressão hebraica comunica que a cabeça ficou firmemente retida. Repetir o nome elimina em português uma possível ambiguidade de referente sem especificar, como o texto hebraico também não especifica, que fossem os cabelos.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: ele ficou suspenso entre o céu e a terra
  rationale: O passivo de נתן descreve aqui o estado resultante. 'Ficou suspenso' comunica esse resultado com clareza e preserva a expressão convencional 'entre o céu e a terra'.
- source_word: עָבָר
  choice: seguiu adiante
  rationale: Indica que a mula continuou seu movimento depois que Absalão ficou preso.
theological_decisions:
- issue: O elemento pelo qual Absalão ficou preso
  choice: a cabeça ficou presa
  alternative: os cabelos ficaram presos
  rationale: O hebraico diz explicitamente רֹאשׁוֹ, 'sua cabeça', e não menciona cabelos. A tradução não introduz o detalhe tradicional oriundo de inferência ou harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A narrativa mantém o caráter fortuito do encontro, evita a tradição não expressa no hebraico de que Absalão teria ficado preso pelos cabelos e conserva a imagem elevada de estar 'entre o céu e a terra'.
