base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: pt
  text: 'Os gibeonitas lhe disseram: “Não temos nenhuma reivindicação de prata ou ouro contra Saul ou contra a sua casa[a], e não nos cabe matar homem algum em Israel[b].” Então ele disse: “O que vocês dizem que eu devo fazer por vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não é uma questão de prata ou ouro entre nós e Saul e a sua casa.” A expressão hebraica é idiomática e provavelmente se refere a uma compensação monetária.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não temos o direito de matar nenhum homem em Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Não temos nenhuma reivindicação de prata ou ouro contra Saul ou contra a casa dele
  rationale: A expressão hebraica é idiomática e, no contexto, recusa uma compensação monetária da parte de Saul e de sua casa. O plural em português representa naturalmente o singular corporativo לִי na resposta dos gibeonitas.
- source_word: עִם
  choice: contra
  rationale: Embora normalmente signifique “com”, aqui introduz as partes contra as quais poderia haver uma reivindicação; “contra” comunica com clareza esse sentido jurídico ou compensatório.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: e não cabe a nós matar homem algum em Israel
  rationale: A construção elíptica indica falta de prerrogativa ou autoridade, não falta de alguém que pudesse ser morto. “Não cabe a nós” conserva essa nuance sem explicitação excessiva.
- source_word: אִישׁ
  choice: homem algum
  rationale: Mantém o substantivo masculino singular do hebraico com valor genérico e soa natural nesta construção negativa.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: O que vocês querem que eu faça por vocês?
  rationale: A pergunta hebraica é comprimida e solicita que os gibeonitas declarem seus termos. Esta formulação transmite naturalmente a força volitiva de אֶעֱשֶׂה em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Casa dele” preserva o sentido dinástico ou familiar de בֵּיתוֹ sem recorrer ao mais ambíguo “sua casa”. A fala direta permanece clara e natural.
