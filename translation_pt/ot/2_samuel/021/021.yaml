  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: pt
  text: Ele desafiou Israel, e Jônatas, filho de Simei[a], irmão de Davi, o derrubou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e o texto paralelo de 1Crônicas 20:7 trazem “Simeia” em vez de “Simei”.
