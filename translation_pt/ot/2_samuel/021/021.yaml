translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A conjunção foi vertida por “mas” para explicitar o contraste narrativo natural entre o desafio e a derrota, sem alterar o conteúdo. O marcador da nota foi colocado junto ao nome ao qual a variante textual se refere.
