lexical_decisions:
- source_word: וַיְחָרֵף
  choice: desafiou
  rationale: No contexto militar, o verbo חרף expressa afronta pública e provocação hostil; “desafiou” comunica naturalmente essa força em português.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o referente coletivo e nacional do texto hebraico sem explicitação desnecessária.
- source_word: וַיַּכֵּהוּ
  choice: o abateu
  rationale: נכה significa golpear e, neste combate, indica um golpe fatal. “Abateu” preserva a imagem de combate e comunica o resultado sem recorrer ao arcaísmo “feriu de morte”.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן שמעי
  choice: filho de Simei
  rationale: Segue a forma שמעי do texto massorético apresentado. A variante do nome no paralelo é registrada em nota.
- source_word: אֲחִי דָוִד
  choice: irmão de Davi
  rationale: Reproduz a identificação familiar em aposição a Simei, como indica a construção hebraica.
