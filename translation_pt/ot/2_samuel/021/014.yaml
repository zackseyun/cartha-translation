base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: pt
  text: Sepultaram os ossos de Saul e de Jônatas, filho de Saul, na terra de Benjamim, em Zela, no túmulo de Quis, pai de Saul. Fizeram tudo o que o rei havia ordenado. Depois disso, Deus atendeu à súplica pela terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus se deixou suplicar pela terra” ou “Deus respondeu à oração pela terra”. O verbo hebraico indica uma resposta favorável a uma súplica.'
    reason: Alternativas lexicais que preservam a forma e a nuance do verbo hebraico.
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Sepultaram
  rationale: O verbo קבר descreve o ato de enterrar ou sepultar. “Sepultaram” é natural e digno em contexto funerário; a conjunção narrativa não precisa ser reproduzida no início do versículo.
- source_word: עַצְמוֹת
  choice: os ossos
  rationale: Mantém a imagem concreta do hebraico, em vez de generalizá-la como “restos mortais”.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: de Saul e de Jônatas, seu filho
  rationale: 'Conserva a relação explicitada no hebraico: Jônatas era filho de Saul.'
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: na terra de Benjamim
  rationale: Reproduz o sentido territorial expresso por אֶרֶץ sem reduzi-lo simplesmente a “em Benjamim”.
- source_word: בְּצֵלָע
  choice: em Zela
  rationale: Transliteração corrente e clara do topônimo hebraico.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: no túmulo de Quis, pai de Saul
  rationale: קֶבֶר pode significar sepultura ou túmulo; “túmulo” se ajusta ao local de sepultamento familiar. O referente contextual de “seu pai” é Saul, esclarecido em português para evitar que o leitor o associe por engano a Jônatas.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Fizeram tudo o que o rei havia ordenado
  rationale: Expressa naturalmente a ação concluída e a anterioridade da ordem real.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: Deus atendeu à súplica
  rationale: O nifal de עתר comunica que Deus se deixou suplicar ou respondeu favoravelmente a uma súplica. “Atendeu à súplica” torna visível esse valor sem identificar quem orou.
- source_word: לָאָרֶץ
  choice: em favor da terra
  rationale: 'A preposição ל indica aqui referência ou benefício: a resposta favorável dizia respeito à terra afetada.'
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressão temporal portuguesa natural que preserva a sequência indicada pelo hebraico.
theological_decisions:
- issue: Sentido de וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Deus atendeu à súplica em favor da terra
  alternative: Deus se deixou suplicar pela terra; Deus respondeu à oração pela terra
  rationale: Embora o substantivo “súplica” não apareça separadamente, a ideia de responder favoravelmente à petição está contida no verbo hebraico neste tronco. A tradução evita a expansão mais interpretativa “Deus curou a terra” e não especifica o autor da súplica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantiveram-se os termos concretos “ossos” e “terra”; a última oração conserva a nuance de súplica implícita no verbo hebraico sem acrescentar o resultado específico da resposta divina.
