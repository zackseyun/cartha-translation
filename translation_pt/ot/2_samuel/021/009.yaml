base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: pt
  text: Ele os entregou nas mãos dos gibeonitas, e eles os suspenderam[a] no monte diante de Yahweh, e os sete caíram juntos. Foram mortos nos primeiros dias da colheita, no início da colheita da cevada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «enforcaram», «empalaram» ou «expuseram publicamente». O verbo hebraico pode indicar a suspensão pública de pessoas ou corpos, sem especificar com certeza o método exato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: os entregou nas mãos
  rationale: A construção נתן + בְּיַד é idiomática e indica entregar alguém ao poder ou controle de outrem; «entregou nas mãos» preserva tanto o sentido quanto a imagem hebraica em português natural.
- source_word: הַגִּבְעֹנִים
  choice: os gibeonitas
  rationale: Forma portuguesa corrente do nome desse povo.
- source_word: וַיֹּקִיעֻם
  choice: os suspenderam
  rationale: O verbo יקע descreve uma execução ou exposição pública mediante suspensão, mas não determina inequivocamente o método exato. «Suspenderam» mantém essa amplitude melhor que «enforcaram»; a nota registra outras possibilidades.
- source_word: בָּהָר
  choice: no monte
  rationale: הַר, com artigo definido, designa aqui um monte ou elevação determinada; «no monte» é natural e formalmente próximo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a formulação de presença e relevância judicial ou cultual sem explicar além do texto.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: Assim, os sete caíram juntos
  rationale: «Os sete» explicita o valor numérico de שבעתים, enquanto «caíram juntos» conserva a imagem hebraica da queda na morte. «Assim» liga naturalmente o resultado à execução sem impor finalidade.
- source_word: הֻמְתוּ
  choice: Foram mortos
  rationale: O Hofal de מות é causativo passivo, isto é, foram levados à morte. «Foram mortos» é claro, digno e idiomático em português.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: nos primeiros dias da colheita
  rationale: Reproduz diretamente a indicação temporal do começo da estação da colheita.
- source_word: תְּחִלַּת קְצִיר שְׂעֹרִים
  choice: no início da colheita da cevada
  rationale: A frase especifica a colheita mencionada anteriormente e corresponde de modo natural ao hebraico.
theological_decisions:
- issue: Método indicado pelo verbo יקע
  choice: suspenderam
  alternative: enforcaram; empalaram; expuseram publicamente
  rationale: O contexto descreve uma execução pública diante de Yahweh, mas o verbo não permite definir com segurança se houve enforcamento no sentido estrito, empalamento ou exposição dos corpos. A tradução principal preserva a indeterminação e a nota apresenta as possibilidades relevantes.
- issue: Sentido de לִפְנֵי יְהוָה
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: A formulação literal preserva a tensão judicial e religiosa do episódio sem acrescentar uma avaliação teológica não expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome divino como «Yahweh», conserva a imagem de cair na morte e evita especificar indevidamente o método de execução.
