base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: pt
  text: Ele trouxe de lá os ossos de Saul e os ossos de Jônatas, seu filho, e eles recolheram os ossos dos que haviam sido expostos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “empalados” ou “pendurados”. O hebraico se refere aos homens executados cujos corpos foram expostos publicamente; o modo exato de exposição não é claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: trouxe
  rationale: O hifil de עלה tem o sentido concreto de fazer subir ou retirar. No contexto da recuperação dos ossos, “trouxe de lá” comunica naturalmente o movimento sem impor a ideia de desenterramento.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Equivalente deítico direto, claro e natural em português moderno.
- source_word: עַצְמוֹת
  choice: ossos
  rationale: Mantém o sentido literal e concreto do hebraico, apropriado ao contexto de sepultamento.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Jônatas, seu filho
  rationale: Preserva a aposição hebraica e deixa claro que Jônatas era filho de Saul.
- source_word: וַיַּאַסְפוּ
  choice: eles recolheram
  rationale: Mantém corretamente a terceira pessoa do plural, sem harmonizá-la com o verbo singular anterior. “Recolheram” é idiomático para a reunião de ossos destinados ao sepultamento.
- source_word: הַמּוּקָעִים
  choice: os que haviam sido expostos
  rationale: O termo pode descrever executados suspensos, empalados ou deixados em exposição pública. “Expostos” evita determinar um método de execução que o hebraico não identifica com plena certeza; a nota registra as alternativas mais específicas.
