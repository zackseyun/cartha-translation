  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: pt
  text: Depois disso, houve novamente guerra contra os filisteus em Gobe. Então Sibecai, o husatita, abateu Safe[a], que era um dos descendentes de Rafa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No texto paralelo de 1 Crônicas 20:4, o nome aparece como «Sipai».
    reason: textual_variant
  - marker: b
    text: Ou «que era um dos descendentes do gigante». O hebraico pode referir-se tanto a uma pessoa chamada Rafa como a uma linhagem associada a gigantes/refains.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal e preserva a sequência narrativa do hebraico.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: houve novamente guerra
  rationale: Mantém o sentido de repetição indicado por עוֹד em português corrente, sem ampliar a formulação.
- source_word: בְּגֹב
  choice: em Gobe
  rationale: A preposição ב indica aqui o local do confronto; “em” é natural em português. O topônimo é transliterado segundo a forma portuguesa usual.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica consagrada e amplamente compreensível em português.
- source_word: אָז
  choice: Então
  rationale: Marca a progressão para o acontecimento seguinte de forma clara e natural.
- source_word: הִכָּה
  choice: abateu
  rationale: No contexto de combate, נכה indica ferir e derrubar, normalmente com resultado mortal. “Abateu” conserva a força marcial sem recorrer a linguagem arcaica.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibecai, o husatita
  rationale: Emprega transliterações correntes em português e mantém o gentílico do texto hebraico.
- source_word: סַף
  choice: Safe
  rationale: Representa no texto principal a forma do nome encontrada no Texto Massorético de 2Samuel, deixando a forma paralela “Sipai” para nota.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: que pertencia aos descendentes de Rafa
  rationale: Expressa a inclusão de Safe nessa linhagem e preserva Rafa como nome próprio, sem inserir no texto principal a interpretação “gigante”.
theological_decisions:
- issue: Se הָרָפָה deve ser entendido como nome próprio (“Rafa”) ou como designação (“o gigante”)
  choice: Rafa, como nome próprio ou ancestral de uma linhagem
  alternative: o gigante; a linhagem dos refains
  rationale: A construção genealógica favorece uma referência de linhagem, mas o hebraico admite a interpretação tradicional ligada a gigante ou aos refains. A tradução principal mantém “Rafa” e registra a alternativa em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão narrativa hebraica, mas evita construções artificiais e vocabulário arcaico.
