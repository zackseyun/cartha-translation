  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מדין וְ/אֶצְבְּעֹ֣ת יָדָי/ו֩ וְ/אֶצְבְּעֹ֨ת רַגְלָ֜י/ו שֵׁ֣שׁ וָ/שֵׁ֗שׁ עֶשְׂרִ֤ים וְ/אַרְבַּע֙ מִסְפָּ֔ר וְ/גַם ה֖וּא יֻלַּ֥ד לְ/הָ/רָפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: pt
  text: Houve outra guerra em Gate. Havia ali um homem de grande estatura[a], que tinha seis dedos em cada mão e seis em cada pé[b], vinte e quatro ao todo. Ele também era descendente de Rafa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem enorme”; mais literalmente, “um homem de medida”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os dedos de suas mãos e os dedos de seus pés, seis e seis”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “também ele nasceu para Rafa”. Ou “era descendente de Rafa”; a designação talvez esteja relacionada aos refains, povo associado a homens de grande estatura.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: guerra
  rationale: O substantivo designa conflito ou guerra; “guerra” preserva a formulação ampla e sua repetição no contexto.
- source_word: בְּגַת
  choice: em Gate
  rationale: A preposição בְּ marca aqui o local do conflito; “em Gate” é natural e fiel em português.
- source_word: אִישׁ מדין
  choice: um homem de grande estatura
  rationale: A expressão difícil parece caracterizar dimensões físicas extraordinárias. “De grande estatura” comunica esse sentido sem a formulação pouco natural “homem de medida”.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: seis dedos em cada mão e seis em cada pé
  rationale: O hebraico fala literalmente dos dedos das mãos e dos pés. A formulação portuguesa explicita de modo natural a distribuição confirmada pelo total de vinte e quatro.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: seis ... e seis
  rationale: Mantém a repetição numérica do hebraico, referente respectivamente às mãos e aos pés.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: vinte e quatro ao todo
  rationale: Expressa com clareza o total indicado pelo texto hebraico.
- source_word: יֻלַּד לְהָרָפָה
  choice: era descendente de Rafa
  rationale: O passivo de ילד com לְ pode indicar nascimento, pertencimento genealógico ou descendência. Esta tradução comunica a linhagem de modo natural, preservando Rafa como designação própria.
theological_decisions:
- issue: Identidade de הָרָפָה
  choice: Rafa, como designação ancestral própria
  alternative: o gigante; os refains
  rationale: O contexto aponta para linhagem, mas não define plenamente se Rafa é um ancestral individual ou uma designação ligada aos refains. O texto principal mantém o nome próprio e a nota preserva a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Gate” segue a forma portuguesa tradicional do topônimo; a sintaxe foi levemente desdobrada para evitar uma frase excessivamente longa e tornar inequívoca a contagem dos vinte e quatro dedos.
