revisions:
- from: Então Rispa, filha de Aiá, pegou um pano de saco e o estendeu para si sobre a rocha. Ficou ali desde o início da colheita até que água caiu do céu sobre eles.[a] Ela não permitia que as aves do céu pousassem sobre eles durante o dia, nem que os animais selvagens do campo se aproximassem à noite.
  to: Então Rispa, filha de Aiá, pegou um pano de saco e o estendeu para si sobre a rocha, desde o início da colheita até que água fosse derramada dos céus sobre eles.[a] Ela não permitiu que as aves do céu pousassem sobre eles de dia, nem que os animais selvagens do campo se aproximassem deles de noite.
  rationale: Foi removida a frase «Ficou ali», que explicitava uma permanência não enunciada no versículo. A expressão referente à água foi ajustada para refletir a imagem de derramamento do hebraico; a nota mantém a alternativa idiomática que a entende como chuva. A formulação sobre os animais terrestres explicita em português a ação elíptica de impedir que alcançassem os corpos, sem acrescentar uma interpretação doutrinária.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:22:19Z'
