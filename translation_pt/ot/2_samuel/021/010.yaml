    rationale: O hebraico diz que Rispa tomou o pano de saco e o estendeu para si junto/sobre a rocha, «desde o início da colheita até...». Embora uma vigília prolongada seja inferível do contexto, o texto não diz explicitamente «ficou ali»; a frase introduz uma ação adicional.
