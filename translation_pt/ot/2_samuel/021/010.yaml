base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: pt
  text: Então Rispa, filha de Aiá, pegou um pano de saco e o estendeu para si sobre a rocha, desde o início da colheita até que água fosse derramada dos céus sobre eles.[a] Ela não permitiu que as aves do céu pousassem sobre eles de dia, nem que os animais selvagens do campo se aproximassem deles de noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até que choveu dos céus sobre eles». Mais literalmente: «até que água fosse derramada dos céus sobre eles».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: um pano de saco
  rationale: שַׂק designa o tecido grosseiro associado ao luto. «Pano de saco» é claro em português moderno e comunica melhor o material do que apenas «saco».
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: o estendeu para si sobre a rocha
  rationale: נטה, tendo o pano como objeto, indica estender ou armar; לָהּ é mantido como «para si», e אֶל é entendido contextualmente como localização sobre a rocha.
- source_word: מִתְּחִלַּת קָצִיר
  choice: desde o início da colheita
  rationale: Mantém a referência genérica do hebraico, sem acrescentar uma cultura agrícola não especificada neste versículo.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: até que água caiu do céu sobre eles
  rationale: A formulação conserva «água» e a origem celeste, mas traduz נתך naturalmente como «caiu»; a nota registra a imagem mais literal de água derramada e a interpretação provável como chuva.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: Expressão natural e dignificada que preserva a imagem hebraica.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: pousassem sobre eles
  rationale: Neste contexto, נוח descreve aves que pousam ou se assentam sobre os corpos; «pousar» é mais preciso e natural em português.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens do campo
  rationale: Explicita corretamente que se trata de fauna selvagem e mantém a expressão espacial do hebraico.
- source_word: יוֹמָם ... לָיְלָה
  choice: durante o dia ... à noite
  rationale: Reproduz de modo idiomático o contraste temporal hebraico.
- source_word: וְלֹא נָתְנָה ... וְאֶת חַיַּת הַשָּׂדֶה
  choice: não permitia ... nem que ... se aproximassem
  rationale: נתן com infinitivo tem o sentido de permitir. No segundo membro, o verbo elíptico é expresso de maneira natural; «se aproximassem» evita sugerir que animais terrestres literalmente pousariam, embora a ideia seja impedir que alcançassem os corpos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A sequência foi levemente segmentada para evitar um período excessivamente longo. «Ficou ali» explicita apenas a continuidade da vigília indicada pelo contexto, sem definir se o pano servia de abrigo ou leito.
