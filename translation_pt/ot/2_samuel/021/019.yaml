    rationale: O hebraico diz literalmente que a guerra ocorreu novamente «em Gobe, com os filisteus». Embora «contra os filisteus» seja semanticamente defensável em português, «em Gobe com os filisteus» reproduz mais de perto a construção da fonte e permanece natural.
  - severity: low
    issue: Formulação da comparação final
    rationale: «Viga de um tear» é compreensível, mas «trave de tecelão» exprime mais idiomaticamente a imagem hebraica convencional de uma peça robusta associada ao trabalho do tecelão, sem alterar seu referente ou sua força.
