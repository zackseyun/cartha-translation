base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: pt
  text: Houve novamente guerra em Gobe com os filisteus. Elanã, filho de Jaaré-Oregim[b], o belemita, abateu Golias, o geteu[a]; a haste da lança de Golias era como uma trave de tecelão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Crônicas 20:5 apresenta uma leitura diferente, segundo a qual Elanã matou Lami, irmão de Golias. Muitos entendem que o texto de Samuel preserva aqui uma leitura difícil ou corrompida e, por isso, o harmonizam com Crônicas.
    reason: textual_variant
  - marker: b
    text: O patronímico hebraico “Jaaré-Oregim” é difícil. Alguns entendem que “Oregim” (“tecelões”) foi repetido por engano a partir do fim do versículo.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: em Gobe
  rationale: A preposição בְּ indica o local da batalha; “em Gobe” é a forma natural em português, com transliteração do topônimo.
- source_word: וַיַּךְ
  choice: abateu
  rationale: O verbo נכה pode significar ferir ou matar. No contexto de combate, “abateu” preserva a força marcial e comunica a derrota mortal sem reduzir o verbo a um simples golpe.
- source_word: יַעְרֵי אֹרְגִים
  choice: Jaaré-Oregim
  rationale: Mantém a forma difícil do Texto Massorético, sem corrigi-la silenciosamente segundo 1 Crônicas 20:5.
- source_word: בֵּית הַלַּחְמִי
  choice: o belemita
  rationale: Traduz naturalmente o gentílico hebraico, isto é, alguém de Belém.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: Golias, o geteu
  rationale: 'Reproduz a leitura explícita do Texto Massorético: Golias, natural de Gate, é o objeto direto do verbo.'
- source_word: וְעֵץ חֲנִיתוֹ
  choice: a haste da lança de Golias
  rationale: עֵץ significa literalmente “madeira”, mas, nesta expressão, refere-se à haste de madeira da lança. O referente pronominal foi expresso pelo nome para evitar ambiguidade em português.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: como a viga de um tear
  rationale: A comparação descreve a grande espessura da haste. “Viga de um tear” comunica com clareza a peça estrutural indicada pelo hebraico.
theological_decisions:
- issue: Aparente tensão com o relato de Davi matando Golias em 1 Samuel 17 e com o paralelo de 1 Crônicas 20:5
  choice: Manter no texto principal a leitura massorética segundo a qual Elanã abateu Golias, o geteu.
  alternative: 'Adotar a leitura harmonizada: “Elanã matou Lami, irmão de Golias, o geteu”.'
  rationale: O hebraico fornecido nomeia Golias diretamente. A tradução preserva essa leitura difícil e registra a variante do paralelo em nota, em vez de resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe foi dividida em duas frases para maior clareza, sem eliminar a sequência narrativa do hebraico. As dificuldades textuais foram preservadas no texto principal e explicadas em notas.
