  naturalness: O texto é claro e de registro bíblico moderno. «Houve novamente guerra em Gobe com os filisteus» é mais direto e mais próximo da ordem e das relações expressas no hebraico do que «guerra contra os filisteus em Gobe». «Trave de tecelão» é uma formulação portuguesa mais idiomática para a comparação tradicional do que «viga de um tear».
  terminology: «Elanã», «Jaaré-Oregim», «belemita», «Golias» e «geteu» são formas adequadas. «Haste da lança» traduz bem a expressão referente à parte de madeira da lança. A explicitação «de Golias» é justificada pelo antecedente imediato e pela sintaxe do enunciado.
