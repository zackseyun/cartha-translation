base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: pt
  text: 'Mas Abisai, filho de Zeruia, veio em seu auxílio, feriu o filisteu e o matou. Então os homens de Davi lhe juraram: “Você não sairá mais conosco para a batalha, para que não apague a lâmpada de Israel[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a luz de Israel”. O hebraico diz literalmente “lâmpada”, metáfora do papel vital de Davi na vida e na estabilidade da nação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: veio em seu auxílio
  rationale: O verbo עזר significa ajudar ou prestar auxílio. A formulação expressa de modo natural a intervenção de Abisai no combate.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abisai, filho de Zeruia
  rationale: Os nomes seguem formas portuguesas convencionais, e בֶּן é traduzido pela relação explícita “filho de”.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: feriu o filisteu
  rationale: נכה significa aqui golpear ou ferir. Como o verbo seguinte declara a morte, esta escolha evita antecipação e redundância.
- source_word: וַיְמִיתֵהוּ
  choice: e o matou
  rationale: A forma causativa de מות indica claramente causar a morte; “matou” é direta e natural.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Então os homens de Davi lhe juraram
  rationale: נשבע descreve a prestação de juramento. A construção escolhida é concisa, solene e clara em português.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Você não sairá mais conosco para a batalha
  rationale: No contexto do juramento, o imperfeito comunica uma proibição solene, preservada naturalmente pelo futuro categórico em português.
- source_word: וְלֹא תְכַבֶּה
  choice: para que não apague
  rationale: Embora formalmente coordenada por וְלֹא, a oração exprime o resultado que os homens desejam evitar. “Para que não” comunica essa relação sem rigidez.
- source_word: נֵר יִשְׂרָאֵל
  choice: a lâmpada de Israel
  rationale: נֵר designa literalmente uma lâmpada. A tradução conserva a metáfora concreta aplicada ao papel vital de Davi na nação.
theological_decisions:
- issue: Designação metafórica de Davi como luz sustentadora de Israel
  choice: Manter “a lâmpada de Israel” no texto principal
  alternative: a luz de Israel
  rationale: O hebraico emprega uma imagem concreta, não uma explicação abstrata. Preservar “lâmpada” mantém a força literária e a dimensão régia da metáfora sem interpretá-la em excesso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a metáfora hebraica foram preservadas, enquanto as relações sintáticas foram expressas de modo natural. O marcador da nota foi colocado junto a “lâmpada de Israel”, termo ao qual a nota efetivamente se refere.
