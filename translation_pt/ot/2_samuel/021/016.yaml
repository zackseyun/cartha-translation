base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: pt
  text: E Isbi-Benobe[a], um dos descendentes de Rafa[b], tinha uma lança que pesava trezentos siclos de bronze. Ele cingia uma espada nova[c] e disse que mataria Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma do nome hebraico é incerta; “Isbi-Benobe” segue a interpretação tradicional. Também são possíveis outras transliterações ou outra divisão das consoantes.
    reason: textual_variant
  - marker: b
    text: Ou “um dos nascidos de Rafa”; a expressão provavelmente se refere ao clã de gigantes associado aos refains.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz apenas “nova”; o substantivo está implícito e é tradicionalmente entendido como “espada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Isbi-Benobe
  rationale: A forma consonantal e sua divisão são difíceis, mas a leitura tradicional como nome próprio se ajusta à sequência narrativa e aos nomes dos guerreiros descendentes de Rafa nos versículos próximos. A incerteza textual é mantida em nota.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: um dos descendentes de Rafa
  rationale: A expressão indica pertencimento à linhagem ou ao clã de Rafa. Esta formulação é natural em português e não reduz o nome próprio ao sentido interpretativo de “gigante”.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: tinha uma lança de bronze que pesava
  rationale: No contexto militar, קֵין é tradicionalmente entendido como lança ou haste de lança. A frase foi reestruturada para produzir português claro, sem alterar a informação sobre o peso.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: trezentos siclos
  rationale: Mantém-se a antiga unidade de peso para transparência histórica; נְחֹשֶׁת é traduzido como “bronze”, o sentido mais provável neste contexto bélico.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: estava cingido com uma espada nova
  rationale: O hebraico traz apenas o adjetivo feminino “nova”, com o substantivo elíptico. “Espada” é a complementação tradicional e contextualmente provável, mas permanece identificada como inferência em nota.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: disse que mataria Davi
  rationale: A construção expressa declaração ou resolução de atacar Davi. “Mataria” comunica naturalmente em português o resultado pretendido de הַכּוֹת neste contexto de combate, preservando o elemento verbal “disse”.
