  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: pt
  text: Então o rei tomou os dois filhos que Rispa, filha de Aiá, tivera de Saul — Armoni e Mefibosete —, e os cinco filhos que Mical,[a] filha de Saul, tivera de Adriel, filho de Barzilai, o meolatita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e intérpretes antigos trazem “Merabe” em vez de “Mical”. Compare 1 Samuel 18:19, onde se diz que Adriel se casou com Merabe, filha de Saul.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ... tomou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “tomou” traduz diretamente לקח.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico, sem substituí-lo pelo nome de Davi.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: os dois filhos de Rispa, filha de Aiá
  rationale: Reproduz a cadeia de construto e apresenta a identificação familiar em português claro.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: que ela havia dado à luz para Saul
  rationale: Preserva o verbo de nascimento ילד e entende לְ como indicação do pai; o mais-que-perfeito situa o nascimento antes da ação do rei.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: Armoni e Mefibosete
  rationale: Transliteração convencional dos nomes em português; a genealogia distingue este Mefibosete do filho de Jônatas.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: os cinco filhos de Mical, filha de Saul
  rationale: Mantém “Mical”, leitura do texto hebraico apresentado, e traduz diretamente o segundo grupo e sua identificação.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: que ela havia dado à luz para Adriel
  rationale: Traduz de modo consistente a mesma construção usada anteriormente no versículo.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: filho de Barzilai, o meolatita
  rationale: Preserva tanto o patronímico quanto a designação geográfica ou gentílica.
theological_decisions:
- issue: A tensão histórica e textual quanto a Mical ser a mãe dos filhos de Adriel
  choice: Manter “Mical” no texto principal e registrar “Merabe” em nota.
  alternative: Ler “Merabe, filha de Saul” no texto principal.
  rationale: O texto hebraico fornecido traz “Mical”, enquanto 1 Samuel 18:19 identifica Merabe como esposa de Adriel. A tradução não harmoniza silenciosamente a dificuldade, mas informa a variante ao leitor.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com grafias bíblicas correntes no Brasil. Os travessões delimitam os nomes dos dois filhos sem obscurecer a estrutura da frase. A nota foi colocada imediatamente após “Mical”, ponto exato ao qual a variante se refere.
