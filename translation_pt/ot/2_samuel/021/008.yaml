revisions:
- from: Então o rei tomou os dois filhos de Rispa, filha de Aiá, que ela havia dado à luz para Saul — Armoni e Mefibosete —, e os cinco filhos de Mical,[a] filha de Saul, que ela havia dado à luz para Adriel, filho de Barzilai, o meolatita.
  to: Então o rei tomou os dois filhos que Rispa, filha de Aiá, tivera de Saul — Armoni e Mefibosete —, e os cinco filhos que Mical,[a] filha de Saul, tivera de Adriel, filho de Barzilai, o meolatita.
  rationale: A revisão substitui duas expressões pouco idiomáticas por «tivera de», construção portuguesa que comunica com clareza que Rispa é mãe dos dois filhos de Saul e que Mical, conforme a leitura do texto hebraico, é apresentada como mãe dos cinco filhos de Adriel. Mantêm-se a leitura «Mical» no texto, a nota de variante ancorada nesse nome e a designação gentílica.
