source:
  edition: WLC
  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: pt
  text: Então o rei chamou os gibeonitas e falou com eles. Os gibeonitas não eram israelitas[a], mas eram do restante dos amorreus[b]; e os israelitas lhes haviam feito um juramento. Saul, porém, procurou matá-los em seu zelo[c] por Israel e Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não eram dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eram do que havia restado dos amorreus”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em seu ciúme”. O termo hebraico pode expressar tanto zelo quanto ciúme, conforme o contexto.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: o rei chamou os gibeonitas
  rationale: “Chamou” comunica naturalmente o ato de convocá-los à presença do rei, sem acrescentar ao hebraico; mantém-se “o rei”, como no texto-fonte.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: falou com eles
  rationale: Embora a forma seja literalmente “disse a eles”, “falou com eles” é natural depois de “chamou” e preserva o sentido contextual.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: não eram israelitas
  rationale: A expressão hebraica significa literalmente “não eram dos filhos de Israel”; “não eram israelitas” transmite com clareza seu uso como designação nacional, enquanto a forma literal é registrada em nota.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: pertenciam ao remanescente dos amorreus
  rationale: יֶתֶר designa aquilo que restou. “Remanescente” preserva a ideia de um grupo sobrevivente; “pertenciam” explicita naturalmente em português a relação indicada pela preposição hebraica.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: lhes haviam feito um juramento
  rationale: O mais-que-perfeito situa corretamente o juramento antes da ação de Saul. A formulação portuguesa expressa de modo idiomático o ato de jurar compromisso a alguém.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: Saul, porém, procurou matá-los
  rationale: Neste contexto, נכה indica golpe letal, e “matá-los” comunica diretamente a intenção. “Porém” evidencia o contraste narrativo entre o juramento de Israel e a conduta de Saul.
- source_word: בְּקַנֹּאתוֹ
  choice: em seu zelo
  rationale: קנא pode expressar zelo intenso ou ciúme. “Zelo” se ajusta à fervorosa motivação nacional aqui, sem aprová-la moralmente; a ambiguidade lexical é preservada em nota.
- source_word: לִבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: por Israel e Judá
  rationale: Na referência à motivação nacional de Saul, “Israel e Judá” é claro e idiomático, preservando a distinção entre as duas entidades nomeadas.
theological_decisions:
- issue: Forma de traduzir בְּנֵי יִשְׂרָאֵל
  choice: israelitas / Israel, conforme a função no contexto
  alternative: filhos de Israel
  rationale: A expressão funciona aqui como designação coletiva nacional. A tradução idiomática evita uma leitura que restrinja indevidamente o grupo a homens, enquanto a nota conserva a forma literal e sua relação lexical com o hebraico.
- issue: Sentido de קנא na motivação de Saul
  choice: zelo
  alternative: ciúme
  rationale: O contexto sugere fervor partidário em favor de Israel e Judá. “Zelo” não transforma esse motivo em virtude, pois a tentativa de matar os gibeonitas permanece explicitamente condenável no enredo; a nota preserva a possível nuance de “ciúme”.
- issue: Força de נכה
  choice: matar
  alternative: ferir / abater
  rationale: A ação pretendida contra o grupo é letal no contexto. “Matar” torna explícita a força contextual do verbo sem introduzir uma especificação denominacional ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe distingue a ação principal da explicação histórica, e as notas preservam os principais dados formais e ambiguidades do hebraico sem tornar o texto principal artificial.
