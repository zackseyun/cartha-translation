base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: pt
  text: 'Disseram ao rei: “O homem que nos consumiu e tramou contra nós[a], para que fôssemos exterminados e não tivéssemos lugar em nenhuma parte do território de Israel[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “planejou contra nós”. O verbo hebraico pode expressar a ideia de planejar ou tramar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de nos estabelecermos em todo o território de Israel”, isto é, de continuarmos a ter lugar em qualquer parte de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: nos consumiu
  rationale: Preserva a imagem forte de כלה, ‘consumir, levar ao fim’, sem antecipar o verbo seguinte que expressa extermínio.
- source_word: דִּמָּה לָנוּ
  choice: tramou contra nós
  rationale: Neste contexto, דמה indica conceber ou planejar algo hostil; ‘tramou’ comunica com naturalidade a intenção adversa sugerida por לָנוּ.
- source_word: נִשְׁמַדְנוּ
  choice: para que fôssemos exterminados
  rationale: O nifal de שׁמד expressa sofrer destruição ou extermínio. A construção portuguesa explicita a relação de propósito ou resultado sem decidir além do que o contexto permite.
- source_word: מֵהִתְיַצֵּב
  choice: não tivéssemos lugar
  rationale: O hitpael de יצב significa literalmente pôr-se ou estabelecer-se. Aqui se refere à impossibilidade de manter presença estabelecida em Israel; a formulação escolhida é idiomática e conserva essa ideia.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: em nenhum território de Israel
  rationale: גְּבוּל designa aqui território ou domínio, não apenas uma linha de fronteira. Com a negação anterior, ‘em nenhum território’ transmite o alcance total da expressão hebraica.
- source_word: הָאִישׁ
  choice: O homem
  rationale: Mantém a referência definida a Saul e a forma acusatória direta do discurso.
