reference: 2 Samuel 21:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: pt
  text: Mas o rei poupou Mefibosete, filho de Jônatas, filho de Saul, por causa do juramento de Yahweh[a] que havia entre eles, entre Davi e Jônatas, filho de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juramento feito em nome de Yahweh”; isto é, o juramento entre Davi e Jônatas, tendo Yahweh como testemunha.
    reason: Esclarece o sentido contextual provável sem eliminar da tradução principal a ambiguidade da expressão hebraica.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: poupou
  rationale: Neste contexto, o verbo חמל indica que o rei se absteve de entregar Mefibosete à morte. “Poupou” expressa com precisão essa ação concreta e ainda sugere misericórdia.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico; o contexto identifica o rei como Davi.
- source_word: מְפִיבֹשֶׁת
  choice: Mefibosete
  rationale: Transliteração tradicional e amplamente reconhecível do nome em português.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: filho de Jônatas, filho de Saul
  rationale: Preserva a estrutura genealógica repetida do hebraico, em vez de explicitar “neto de Saul”.
- source_word: עַל
  choice: por causa de
  rationale: A preposição introduz aqui o motivo pelo qual o rei poupou Mefibosete.
- source_word: שְׁבֻעַת יְהוָה
  choice: o juramento de Yahweh
  rationale: A tradução formal preserva a ambiguidade do construto hebraico quanto à relação de Yahweh com o juramento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: que havia entre eles
  rationale: Expressa naturalmente em português a existência do juramento entre as duas partes.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: entre Davi e Jônatas
  rationale: Reproduz a relação bilateral em português natural, sem repetir desnecessariamente a preposição.
theological_decisions:
- issue: Sentido de “juramento de Yahweh”
  choice: Manter no texto a expressão formal “juramento de Yahweh” e explicar em nota seu sentido contextual provável.
  alternative: Traduzir diretamente como “juramento feito em nome de Yahweh” ou entender que o próprio Yahweh fez o juramento.
  rationale: No contexto da aliança entre Davi e Jônatas, a expressão provavelmente designa um juramento feito em nome de Yahweh ou tendo Yahweh como testemunha. A formulação principal, porém, não elimina a ambiguidade gramatical.
- issue: Referente de “o rei”
  choice: Conservar “o rei”.
  alternative: Substituir o título por “Davi”.
  rationale: Embora o contexto identifique o rei como Davi, o hebraico emprega o título, que deve ser preservado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção genealógica deliberadamente formal acompanha o hebraico, enquanto “que havia entre eles” evita rigidez excessiva.
