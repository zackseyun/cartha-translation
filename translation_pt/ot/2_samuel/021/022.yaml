base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: pt
  text: Esses quatro nasceram de Rafa, em Gate[a], e caíram pela mão de Davi e pela mão de seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Rafa”, “do gigante” ou “dos refains”. O hebraico provavelmente indica descendência da linhagem de gigantes associada a Gate.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: Esses quatro
  rationale: Reproduz de modo natural a construção demonstrativa com numeral, sem acrescentar “homens”, que não está explícito no hebraico.
- source_word: יֻלְּדוּ
  choice: nasceram
  rationale: O passivo de ילד indica nascimento ou descendência; “nasceram” é claro e corrente em português.
- source_word: לְהָרָפָה
  choice: de Rafa
  rationale: A preposição marca aqui filiação ou descendência. “Rafa” conserva o termo hebraico como nome ou designação ancestral sem decidir que significa necessariamente “gigante” ou “refains”.
- source_word: בְּגַת
  choice: em Gate
  rationale: Uso locativo comum; “Gate” é a forma portuguesa tradicional do topônimo.
- source_word: וַיִּפְּלוּ
  choice: e caíram
  rationale: Preserva a imagem literal de נפל, que no contexto de combate implica que foram mortos.
- source_word: בְיַד
  choice: pela mão de
  rationale: Mantém o idioma hebraico de agência, ainda compreensível e digno em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Tradução direta de עבדיו; no contexto, refere-se aos homens que serviam a Davi, sem precisar restringi-los a soldados.
theological_decisions:
- issue: Identidade de הָרָפָה
  choice: Rafa, entendido de modo conservador como nome ou designação de um ancestral ou linhagem
  alternative: “o gigante” como substantivo comum, ou “os refains” como designação de um povo ou clã
  rationale: O contexto associa os quatro à tradição dos gigantes de Gate, mas a forma hebraica admite mais de uma análise. O texto principal translitera o termo e a nota registra as alternativas, preservando a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservam-se as expressões hebraicas “caíram” e “pela mão de”, pois são compreensíveis no contexto narrativo e preservam a imagem do original.
