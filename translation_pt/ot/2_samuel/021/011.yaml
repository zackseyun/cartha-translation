  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: pt
  text: E foi relatado a Davi o que Rispa, filha de Aiá, concubina de Saul, havia feito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Então contaram
  rationale: O hofal de נגד exprime comunicação passiva, mas o português natural frequentemente emprega a forma impessoal na terceira pessoa do plural. “Então” representa a progressão narrativa de וַ.
- source_word: לְדָוִד
  choice: a Davi
  rationale: O לְ marca o destinatário da informação e é expresso naturalmente com a preposição “a”.
- source_word: אֵת אֲשֶׁר
  choice: o que
  rationale: O marcador de objeto seguido do relativo introduz o conteúdo comunicado; “o que” é claro e idiomático.
- source_word: עָשְׂתָה
  choice: havia feito
  rationale: O mais-que-perfeito composto deixa claro que a ação de Rispa precedeu o relato feito a Davi.
- source_word: רִצְפָּה
  choice: Rispa
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בַת אַיָּה
  choice: filha de Aiá
  rationale: Reproduz diretamente a identificação patronímica hebraica.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: concubina de Saul
  rationale: Preserva sem eufemismo a designação social e a relação expressa pela construção hebraica.
