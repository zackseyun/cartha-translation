source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: pt
  text: 'Houve fome nos dias de Davi durante três anos, ano após ano. Então Davi buscou a face de Yahweh[a], e Yahweh disse: “É por causa de Saul e de sua casa culpada de derramamento de sangue[b], porque ele matou os gibeonitas”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “buscou Yahweh” ou “consultou Yahweh”; literalmente, “buscou a face de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “casa de sangues”, expressão que indica uma família culpada de derramamento de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: fome
  rationale: No contexto narrativo, indica grave escassez de alimentos que atingiu a terra; em português bíblico e corrente, “fome” expressa naturalmente esse sentido.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: durante três anos, ano após ano
  rationale: Preserva tanto a duração de três anos quanto a ênfase hebraica na continuidade sucessiva.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: buscou a face de Yahweh
  rationale: Mantém a imagem literal hebraica e sua nuance pessoal, deixando em nota as equivalências idiomáticas mais naturais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: por causa de Saul e de sua casa culpada de derramamento de sangue
  rationale: A resposta explica a causa da fome; “casa” designa a família ou dinastia, e a formulação comunica a culpa moral e jurídica associada ao sangue derramado.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: porque ele matou os gibeonitas
  rationale: O verbo singular aponta para Saul como agente principal. “Matou” é direto, natural e semanticamente fiel, sem acrescentar uma nuance judicial não exigida pelo verbo.
- source_word: הַגִּבְעֹנִים
  choice: os gibeonitas
  rationale: Forma portuguesa consagrada para o nome desse povo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome próprio representado pelo Tetragrama e segue a orientação fornecida, sem o substituir por um título.
- issue: Sentido da expressão referente a Saul e à sua casa
  choice: A fome ocorre por causa da culpa de Saul e de sua casa pelo derramamento de sangue.
  alternative: 'Formulação mais literal: “contra Saul e contra a casa de sangues”.'
  rationale: No contexto, a fala divina apresenta a razão da fome. A tradução torna explícita essa relação causal, sem eliminar a referência corporativa à casa de Saul.
- issue: Referente do verbo singular הֵמִית
  choice: 'Saul é apresentado como o agente principal: “ele matou”.'
  alternative: Entender a casa de Saul coletivamente como envolvida na matança.
  rationale: A forma verbal singular favorece Saul como antecedente imediato, embora a menção da casa culpada preserve a dimensão familiar ou dinástica da responsabilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi vertida naturalmente; “então” representa a progressão da forma narrativa hebraica, não um advérbio temporal independente. A expressão concreta “buscou a face” foi mantida no texto por fidelidade à imagem hebraica e esclarecida em nota.
