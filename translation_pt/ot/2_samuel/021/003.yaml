source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: pt
  text: 'Davi disse aos gibeonitas: “O que farei por vocês? Com que farei expiação, para que[a] abençoem a herança de Yahweh[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e abençoem a herança de Yahweh”. A forma hebraica pode ser entendida mais literalmente como uma oração coordenada; o texto principal expressa o provável sentido de propósito ou resultado no contexto.'
    reason: lexical_alternative
  - marker: b
    text: “A herança de Yahweh” refere-se a Israel, o povo que pertence a Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר; introduz a fala de Davi sem interpretar além do necessário o ato de fala.
- source_word: הַגִּבְעֹנִים
  choice: os gibeonitas
  rationale: Gentílico plural referente ao povo de Gibeão; a forma consagrada em português preserva a designação étnica.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: O que farei por vocês?
  rationale: O interrogativo com o imperfeito tem sentido deliberativo. A formulação é natural no português moderno e mantém a pergunta em aberto.
- source_word: וּבַמָּה
  choice: Com que
  rationale: Preserva o valor instrumental de בְּ, mais precisamente do que a opção mais ampla “como”.
- source_word: אֲכַפֵּר
  choice: farei expiação
  rationale: O piel de כפר expressa expiação ou reparação de culpa grave. “Fazer expiação” conserva o peso cultual e teológico melhor do que “reparar o mal” ou “fazer as pazes”.
- source_word: וּבָרְכוּ
  choice: para que abençoem
  rationale: A conjunção seguida da forma volitiva pode indicar o resultado ou propósito desejado. A tradução explicita essa relação de modo idiomático, sem ocultar na nota a leitura coordenada possível.
- source_word: נַחֲלַת יְהוָה
  choice: a herança de Yahweh
  rationale: נחלה designa herança ou propriedade recebida; aqui, refere-se a Israel como povo pertencente a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de כפר no contexto de culpa de sangue e violação da aliança
  choice: farei expiação
  alternative: farei reparação
  rationale: “Expiação” mantém a dimensão de remoção da culpa diante de Deus e de reparação para com os gibeonitas, sem reduzir o ato a simples compensação social.
- issue: Relação sintática da oração final וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'propósito/resultado: “para que abençoem a herança de Yahweh”'
  alternative: 'coordenação: “e abençoem a herança de Yahweh”'
  rationale: No contexto, Davi pergunta que ação levaria os gibeonitas a abençoar Israel. O português comunica essa provável relação por meio de uma oração final, enquanto a nota preserva a ambiguidade formal do hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” traduz o plural לָכֶם de forma clara; “expiação” conserva a densidade teológica do original. Os marcadores foram colocados ao fim da citação porque a nota [a] se refere à oração final e a nota [b], à expressão que encerra essa mesma oração.
