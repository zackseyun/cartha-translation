  text: וַ/תְּהִי ע֧וֹד מִלְחָמָ֛ה לַ/פְּלִשְׁתִּ֖ים אֶת יִשְׂרָאֵ֑ל וַ/יֵּ֨רֶד דָּוִ֜ד וַ/עֲבָדָ֥י/ו עִמּ֛/וֹ וַ/יִּלָּחֲמ֥וּ אֶת פְּלִשְׁתִּ֖ים וַ/יָּ֥עַף דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: pt
  text: Houve novamente guerra entre os filisteus e Israel. Davi desceu com os seus servos[a], e eles lutaram contra os filisteus. Davi ficou exausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus homens”. O hebraico diz “seus servos”, expressão comum para os que estavam a serviço de um rei, inclusive seus combatentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Houve novamente guerra
  rationale: Expressa de modo natural a introdução narrativa existencial e a recorrência das hostilidades, sem recorrer à fórmula arcaizante “e aconteceu que”.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: entre os filisteus e Israel
  rationale: A construção hebraica indica oposição entre as duas partes; “entre... e...” é clara e idiomática em português.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido espacial de ירד, que pode refletir o deslocamento de Davi até o campo de batalha.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: com os seus servos
  rationale: “Servos” mantém o valor lexical de עֲבָדִים; neste contexto régio-militar, o termo abrange homens a serviço do rei. A ideia de עִמּוֹ já é comunicada naturalmente por “com”.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: eles lutaram contra os filisteus
  rationale: Traduz diretamente o verbo de combate e explicita em português idiomático a oposição marcada pela construção hebraica.
- source_word: וַיָּעַף
  choice: ficou exausto
  rationale: Comunica o ingresso num estado de extremo cansaço durante a batalha, preservando o valor resultativo do verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência de frases evita uma longa coordenação pouco natural, sem alterar a progressão narrativa do hebraico. O marcador da nota foi colocado junto a “servos”, termo ao qual a nota se refere.
