source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: pt
  text: Então Davi foi buscar os ossos de Saul e os ossos de seu filho Jônatas junto aos habitantes de Jabes-Gileade. Eles os haviam roubado da praça pública de Bete-Seã, onde os filisteus os tinham pendurado[a] no dia em que derrotaram Saul em Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pendurado” também pode ser entendido como “exposto”; uma tradução mais específica seria “empalado”, mas o verbo hebraico significa mais diretamente “pendurar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ossos
  rationale: É o sentido concreto e direto do substantivo hebraico; evita substituir a imagem do texto pelo termo mais amplo «restos mortais».
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: habitantes de Jabes-Gileade
  rationale: Neste contexto, בַּעֲלֵי designa as pessoas ligadas à cidade; «habitantes» é natural em português e não restringe indevidamente o grupo a cidadãos em sentido jurídico.
- source_word: גָּנְבוּ
  choice: haviam roubado
  rationale: Preserva o sentido básico de «roubar» e explicita que a ação ocorreu antes de Davi recuperar os ossos.
- source_word: מֵרְחֹב
  choice: da praça pública
  rationale: O termo indica uma área aberta ou praça urbana; «praça pública» comunica claramente esse cenário.
- source_word: תלו/ם שם
  choice: os tinham pendurado
  rationale: «Pendurar» é o sentido mais direto do verbo; leituras mais específicas, como «empalar», excedem o que o hebraico determina.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: derrotaram Saul
  rationale: No contexto de Gilboa, a expressão descreve o golpe militar fatal contra Saul. «Derrotaram» mantém a responsabilidade filisteia sem afirmar que eles próprios lhe deram o golpe final, pois 1 Samuel 31 relata o suicídio de Saul.
- source_word: בַּגִּלְבֹּעַ
  choice: em Gilboa
  rationale: Mantém o topônimo sem acrescentar «monte», que não aparece explicitamente nesta frase.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: Então Davi foi buscar
  rationale: Em português narrativo, «foi buscar» expressa naturalmente a sequência e a finalidade implícita de ir e tomar/recuperar os ossos.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: seu filho Jônatas
  rationale: Identifica com clareza Jônatas como filho de Saul e soa natural em português.
theological_decisions:
- issue: A relação entre a ação dos filisteus e a morte de Saul
  choice: derrotaram Saul
  alternative: mataram Saul / abateram Saul
  rationale: A formulação preserva a atribuição hebraica da derrota aos filisteus e, ao mesmo tempo, não elimina a tensão com 1 Samuel 31:4, onde Saul cai sobre a própria espada.
translation_notes:
  register: Português moderno, digno e acessível, com formas toponímicas correntes no uso bíblico brasileiro. A divisão em duas frases reduz a sobrecarga sintática sem alterar as relações do hebraico. O marcador [a] aparece imediatamente após a expressão comentada.
