base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: pt
  text: Eles chegaram e o cercaram em Abel-Bete-Maaca[a]. Levantaram uma rampa de cerco contra a cidade, que ficou junto à fortificação[b]; e todo o povo que estava com Joabe destruía a cidade para derrubar a muralha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o cercaram”, provavelmente mantendo Seba como alvo do cerco, embora a cidade estivesse sendo cercada.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico pode designar uma fortificação externa, um baluarte ou uma obra defensiva semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Eles chegaram
  rationale: O wayyiqtol de בוא introduz a chegada das forças; “chegaram” é natural na narrativa em português.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: e o cercaram
  rationale: צור com עַל indica cerco militar. O pronome masculino singular foi preservado como “o”, mantendo Seba como alvo, embora o cerco recaia sobre a cidade.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: em Abel-Bete-Maaca
  rationale: Transliteração portuguesa clara do topônimo composto, conforme as formas bíblicas usuais de Bete e Maaca.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Levantaram uma rampa de cerco
  rationale: שׁפך é literalmente “derramar”, mas, neste contexto militar, descreve o amontoamento de terra; סֹלְלָה designa uma rampa ou aterro de cerco.
- source_word: אֶל הָעִיר
  choice: contra a cidade
  rationale: Embora אֶל possa significar “para”, o contexto hostil favorece “contra”, indicando a direção e a função da rampa.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: a qual ficou encostada à fortificação
  rationale: O verbo feminino retoma naturalmente סֹלְלָה, “rampa”. חֵל pode designar uma obra defensiva externa; “fortificação” preserva essa amplitude lexical.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: e todo o povo que estava com Joabe
  rationale: A construção elíptica com אֶת expressa associação; a tradução mantém “povo”, embora no contexto se trate das tropas de Joabe.
- source_word: מַשְׁחִיתִם לְהַפִּיל הַחוֹמָה
  choice: procurava destruir a muralha para derrubá-la
  rationale: O particípio descreve ação contínua, e o sufixo plural concorda semanticamente com o coletivo “povo”. O objeto implícito é explicitado como “a muralha”, à luz da oração final; “procurava” comunica a ação dirigida ao resultado sem afirmar que a muralha já estava destruída.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para clareza narrativa. Preservou-se o pronome masculino referente a Seba e a relativa ambiguidade de חֵל sem recorrer a terminologia excessivamente técnica.
