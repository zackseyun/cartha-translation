  to: Eles chegaram e o cercaram em Abel-Bete-Maaca[a]. Levantaram uma rampa de cerco contra a cidade, que ficou junto à fortificação[b]; e todo o povo que estava com Joabe destruía a cidade para derrubar a muralha.
  rationale: Substituiu-se “procurava destruir a muralha para derrubá-la” por “destruía a cidade para derrubar a muralha”. A nova redação representa a ação contínua do particípio sem acrescentar tentativa e conserva melhor a referência implícita e ampla do objeto, ao mesmo tempo que mantém a muralha como o objetivo declarado da operação. “Ficou junto à fortificação” comunica a posição da rampa sem especificar indevidamente a natureza de חֵל.
