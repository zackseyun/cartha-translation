base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: pt
  text: Os homens de Joabe, os queretitas[a], os peletitas e todos os guerreiros valentes saíram atrás dele. Saíram de Jerusalém para perseguir Seba, filho de Bicri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, também se encontra a forma “quereteus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: saíram atrás dele
  rationale: Preserva de modo natural a construção hebraica de movimento após alguém e mantém o referente de “dele” dependente do contexto.
- source_word: אַנְשֵׁי יוֹאָב
  choice: os homens de Joabe
  rationale: Reproduz com clareza a relação expressa pelo estado construto, isto é, os homens pertencentes ao grupo ou comando de Joabe.
- source_word: הַכְּרֵתִי
  choice: os queretitas
  rationale: Translitera a designação do grupo sem lhe atribuir uma origem étnica ou função específica não explicitada no texto.
- source_word: הַפְּלֵתִי
  choice: os peletitas
  rationale: Mantém como nome próprio coletivo a designação tradicionalmente associada aos queretitas.
- source_word: כָל הַגִּבֹּרִים
  choice: todos os guerreiros valentes
  rationale: Expressa o sentido militar de גִּבּוֹרִים em português atual; “valentes” conserva a ideia de força e bravura.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: Indica diretamente o ponto de partida.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: para perseguir
  rationale: Verte de forma idiomática a finalidade e o sentido de perseguição da construção hebraica.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Emprega a forma portuguesa corrente do patronímico hebraico e a pontuação natural para aposto.
