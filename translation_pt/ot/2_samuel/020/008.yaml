base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: pt
  text: Quando eles estavam junto à grande pedra que fica em Gibeom, Amasa veio diante deles[a]. Joabe estava vestido com seu traje militar[b] e, por cima dele, trazia um cinturão com uma espada presa à cintura, dentro da bainha. Ao sair, ela caiu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Amasa veio ao encontro deles”. O hebraico diz literalmente “veio diante deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua veste” ou “a roupa que vestia”. O termo hebraico pode indicar uma vestimenta distintiva e, neste contexto, provavelmente se refere ao traje militar de Joabe.'
    reason: lexical_alternative
  - marker: c
    text: O sujeito de “caiu” é provavelmente a espada, sugerida pela forma feminina do verbo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Quando eles estavam junto à grande pedra
  rationale: Nesse contexto locativo, עִם indica proximidade. “Junto à” é natural em português e preserva a relação espacial.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: que fica em Gibeom
  rationale: A oração relativa identifica a localização da pedra; “fica” é idiomático em português para um marco geográfico dentro de uma narrativa.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: Amasa veio à presença deles
  rationale: לִפְנֵי significa literalmente “diante de/perante”. A formulação preserva essa noção sem decidir se Amasa veio especificamente encontrá-los ou apenas se apresentou diante deles.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: estava vestido com seu traje militar
  rationale: מַד pode designar vestimenta distintiva ou militar. O contexto de Joabe armado favorece “traje militar”, sem acrescentar detalhes sobre sua forma.
- source_word: וְעָלָיו חֲגוֹר
  choice: e, por cima dele, trazia um cinturão
  rationale: A expressão descreve o cinturão usado sobre o traje. “Trazia” produz uma descrição natural do equipamento que Joabe vestia.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו
  choice: com uma espada presa à cintura
  rationale: מְצֻמֶּדֶת indica que a espada estava fixada ou presa; מָתְנַיִם refere-se à região dos quadris/lombos, representada naturalmente por “cintura”.
- source_word: בְּתַעְרָהּ
  choice: dentro da bainha
  rationale: תַּעַר designa aqui a bainha da espada. A construção evita a repetição pesada de “em sua bainha” em português.
- source_word: וְהוּא יָצָא
  choice: Quando ele saiu
  rationale: Preserva o sentido básico de יָצָא e liga naturalmente a ação de Joabe à queda subsequente, sem especificar uma direção não expressa.
- source_word: וַתִּפֹּל
  choice: ela caiu
  rationale: O verbo hebraico está no feminino singular. O pronome mantém implícito o referente, como no hebraico, enquanto a nota informa que provavelmente se trata da espada.
