base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: pt
  text: 'Joabe disse a Amasa[a]: “Tudo vai bem com você, meu irmão?” Então Joabe segurou a barba de Amasa com a mão direita para beijá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Segurar a barba e beijar eram gestos associados a uma saudação entre pessoas próximas; neste contexto, porém, o gesto é enganoso.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: Tudo vai bem com você?
  rationale: A expressão idiomática pergunta pelo bem-estar ou pela paz da pessoa. A formulação é natural em português e conserva a ideia de saber se tudo está bem, sem reduzi-la a uma saudação genérica.
- source_word: אָחִי
  choice: meu irmão
  rationale: Preserva o sufixo possessivo explícito e o tom familiar ou conciliador empregado por Joabe.
- source_word: וַתֹּחֶז
  choice: segurou
  rationale: Expressa o ato de pegar ou segurar sem antecipar a violência do versículo seguinte.
- source_word: יַד יְמִין יוֹאָב
  choice: com a mão direita
  rationale: Mantém o detalhe explícito de que Joabe realizou a ação com a mão direita, em ordem natural no português.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: a barba de Amasa
  rationale: É a forma possessiva mais natural em português e preserva o detalhe culturalmente significativo.
- source_word: לִנְשָׁק לוֹ
  choice: para beijá-lo
  rationale: 'O infinitivo com ל indica finalidade: Joabe segurou a barba a fim de beijar Amasa.'
theological_decisions: []
