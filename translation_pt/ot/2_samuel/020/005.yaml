base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/005.yaml
  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: pt
  text: Então Amasa foi convocar Judá[a], mas demorou além do tempo que lhe havia sido determinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reunir Judá”. O verbo hebraico indica um chamado urgente para reunir pessoas e, neste contexto, provavelmente inclui mobilização militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Equivalente narrativo natural do wayyiqtol de הלך, indicando a saída de Amasa para cumprir a ordem.
- source_word: לְהַזְעִיק
  choice: convocar
  rationale: O hifil de זעק indica chamar pessoas para que se reúnam com urgência; “convocar” preserva o caráter oficial sem explicitar em excesso a mobilização militar.
- source_word: אֶת יְהוּדָה
  choice: Judá
  rationale: O nome designa coletivamente o povo ou os homens de Judá; a forma simples conserva a expressão hebraica e soa natural em português.
- source_word: וייחר
  choice: demorou
  rationale: Neste contexto, אחר exprime atraso em relação ao tempo estipulado; “demorou além” comunica isso de modo claro e corrente.
- source_word: מִן הַמּוֹעֵד
  choice: além do prazo
  rationale: מוֹעֵד é o tempo fixado; com מן após אחר, indica que Amasa ultrapassou o limite estabelecido. “Prazo” é natural no contexto de uma ordem com tempo determinado.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: que o rei lhe havia determinado
  rationale: יעד significa fixar ou determinar, e o sufixo refere-se naturalmente a Amasa. O sujeito implícito é esclarecido pelo contexto imediato como o rei Davi, sem introduzir uma interpretação controversa.
