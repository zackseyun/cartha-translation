  text: ו/שיא סֹפֵ֑ר וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/025.yaml
  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: pt
  text: e Seva era secretário[a]; e Zadoque e Abiatar eram sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escriba”. O termo hebraico pode designar um escriba real ou secretário; aqui, “secretário” esclarece que se trata de um cargo administrativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: Seva
  rationale: Transliteração direta do nome próprio conforme a forma consonantal deste versículo. As formas diferentes encontradas em listas paralelas não devem substituir silenciosamente a leitura preservada aqui.
- source_word: סֹפֵר
  choice: secretário
  rationale: Neste contexto administrativo, o termo designa um escriba oficial da corte. “Secretário” comunica com clareza atual a função governamental, enquanto “escriba” permanece uma alternativa lexical legítima.
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Equivalente português comum para o plural hebraico, identificando a função cultual de Zadoque e Abiatar.
- source_word: וְ
  choice: e
  rationale: A conjunção repetida foi preservada para refletir a estrutura coordenada da lista administrativa hebraica.
