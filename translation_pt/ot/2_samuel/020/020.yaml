  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: pt
  text: 'Joabe respondeu: “Longe de mim, longe de mim, que eu devore ou destrua!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “engolir ou levar à ruína”. O hebraico emprega verbos vívidos para “engolir” e “destruir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Joabe respondeu
  rationale: A fórmula hebraica combina os verbos “responder” e “dizer”. Em português atual, “respondeu” comunica naturalmente a introdução da fala sem a redundância pouco idiomática de “respondeu e disse”.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Longe de mim! Longe de mim
  rationale: A repetição preserva a enfática repulsa expressa pelo hebraico. A formulação é digna, clara e corrente em português.
- source_word: אִם ... וְאִם
  choice: devorar ou destruir
  rationale: Depois da fórmula de repúdio, as partículas introduzem duas ações rejeitadas. Em português, a coordenação com “ou” expressa o sentido com naturalidade, sem impor uma condição real.
- source_word: אֲבַלַּע
  choice: devorar
  rationale: O verbo בלע significa literalmente “engolir”. No contexto do cerco, “devorar” conserva a imagem vívida de consumir por completo e funciona naturalmente como metáfora de arrasar a cidade.
- source_word: אַשְׁחִית
  choice: destruir
  rationale: O hifil de שׁחת denota causar destruição ou ruína. “Destruir” é direto e adequado ao contexto militar.
