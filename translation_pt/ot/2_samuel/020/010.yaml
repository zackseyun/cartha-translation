base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: pt
  text: Amasa, porém, não estava em guarda contra a espada que Joabe tinha na mão, e Joabe o golpeou com ela no ventre[a]. Suas entranhas se derramaram no chão. Joabe não o golpeou outra vez, e Amasa morreu. Então Joabe e seu irmão Abisai perseguiram Seba, filho de Bicri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na quinta costela”. A expressão hebraica tem sido traduzida tradicionalmente dessa forma, mas, neste contexto, o termo provavelmente se refere de modo geral ao ventre ou à região abdominal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: não se protegeu
  rationale: O nifal de שׁמר indica aqui que Amasa não tomou cuidado nem se pôs em guarda diante da arma de Joabe. “Não se protegeu” é natural em português e preserva a ideia reflexiva.
- source_word: חֶרֶב
  choice: espada
  rationale: É o equivalente português comum e direto de חֶרֶב neste contexto narrativo.
- source_word: בְּיַד יוֹאָב
  choice: na mão de Joabe
  rationale: 'A expressão é concreta e espacial: refere-se à espada que Joabe segurava.'
- source_word: וַיַּכֵּהוּ בָהּ
  choice: este o golpeou com ela
  rationale: נכה tem o sentido amplo de golpear. A formulação evita especificar “apunhalou”, embora o contexto indique um golpe penetrante, e o pronome “este” esclarece naturalmente que Joabe é o agente.
- source_word: אֶל הַחֹמֶשׁ
  choice: no ventre
  rationale: חֹמֶשׁ provavelmente designa a região abdominal nestas narrativas de Samuel. “Ventre” é claro, digno e menos coloquial que “barriga”, sem adotar como sentido principal a tradução tradicional “quinta costela”.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: Suas entranhas se derramaram no chão
  rationale: A tradução conserva a descrição gráfica do hebraico em registro grave e natural; אַרְצָה indica movimento em direção ao chão.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Joabe não precisou golpeá-lo de novo
  rationale: A expressão elíptica significa que Joabe não repetiu o golpe. “Não precisou” comunica a eficácia fatal do primeiro golpe, explicitada em seguida pela morte de Amasa.
- source_word: וַיָּמֹת
  choice: pois ele morreu
  rationale: A conjunção “pois” expressa em português natural a relação contextual entre não haver segundo golpe e a morte, sem alterar o fato narrado.
- source_word: רָדַף אַחֲרֵי
  choice: perseguiram
  rationale: É a forma habitual para uma perseguição de caráter militar. O verbo hebraico está no singular, mas o sujeito composto Joabe e Abisai pede plural na gramática portuguesa.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Os nomes são transliterados em formas portuguesas reconhecíveis, e a vírgula favorece a leitura do patronímico.
