base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: pt
  text: Joabe comandava todo o exército de Israel, e Benaia, filho de Joiada, comandava os quereteus[a] e os peleteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “queretitas”. A forma exata do nome desse grupo no texto hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Joabe
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada. A conjunção introduz mais um item da lista administrativa e não precisa ser traduzida por uma palavra inicial isolada.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: comandava todo o exército de Israel
  rationale: Na fórmula administrativa sem verbo expresso, אֶל indica a esfera de autoridade de Joabe. “Comandava” explicita naturalmente a função militar, enquanto “todo o exército de Israel” preserva כָּל e o sentido militar de צָבָא.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: e Benaia, filho de Joiada
  rationale: Mantém os nomes próprios em suas formas portuguesas usuais e conserva a relação patronímica de maneira clara.
- source_word: עַל
  choice: comandava
  rationale: A preposição expressa autoridade sobre os grupos mencionados. A repetição de “comandava” deixa clara a estrutura paralela da lista em português.
- source_word: ה/כרי
  choice: os quereteus[a]
  rationale: Adota a identificação tradicional com os quereteus, conhecida em português, mas sinaliza em nota a incerteza da forma hebraica transmitida.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: e os peleteus
  rationale: O segundo grupo compartilha a mesma relação de comando. O nome coletivo é transliterado segundo o uso bíblico corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de ampla circulação no uso bíblico brasileiro. “Comandava” comunica de modo natural a autoridade militar implícita nas construções hebraicas sem verbo.
