  text: וְ/אִישׁ֙ עָמַ֣ד עָלָ֔י/ו מִֽ/נַּעֲרֵ֖י יוֹאָ֑ב וַ/יֹּ֗אמֶר מִי֩ אֲשֶׁ֨ר חָפֵ֧ץ בְּ/יוֹאָ֛ב וּ/מִ֥י אֲשֶׁר לְ/דָוִ֖ד אַחֲרֵ֥י יוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: pt
  text: 'Um dos jovens de Joabe ficou de pé junto a ele e disse: “Quem é a favor de Joabe e quem está do lado de Davi, siga Joabe!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ
  choice: Um
  rationale: Introduz de modo natural um indivíduo não identificado entre os homens de Joabe, sem acrescentar especificidade.
- source_word: עָמַד עָלָיו
  choice: ficou de pé junto a ele
  rationale: A construção pode indicar estar sobre ou junto de alguém. No contexto, descreve o homem tomando posição junto ao corpo de Amasa; esta formulação evita sugerir sem necessidade que estivesse fisicamente em cima dele.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: dos jovens de Joabe
  rationale: נַעַר pode designar jovem, servo ou assistente. “Jovens” preserva o sentido mais transparente, enquanto o contexto militar deixa clara sua subordinação a Joabe.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Quem é a favor de Joabe
  rationale: חָפֵץ expressa prazer, desejo ou aprovação; neste grito de convocação, a expressão indica apoio ou lealdade a Joabe.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: e quem está do lado de Davi
  rationale: A preposição לְ indica aqui pertencimento ou lealdade política. A formulação comunica naturalmente estar aliado a Davi.
- source_word: אַחֲרֵי יוֹאָב
  choice: siga Joabe
  rationale: Literalmente “atrás de Joabe”; no contexto de convocação militar, é uma ordem para acompanhar ou seguir Joabe.
