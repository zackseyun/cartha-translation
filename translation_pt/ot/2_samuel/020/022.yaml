base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: pt
  text: Então a mulher foi até todo o povo com sua sabedoria, e eles cortaram a cabeça de Seba, filho de Bicri, e a lançaram a Joabe. Então Joabe tocou a trombeta, e eles se dispersaram de junto da cidade, cada um para a sua tenda[a]. E Joabe voltou a Jerusalém, ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada um para as suas tendas”; fórmula idiomática para dispersar-se, voltando cada um ao seu próprio lugar.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: foi até
  rationale: O verbo בוא pode significar “vir” ou “ir”, conforme o ponto de vista. Aqui, “foi até” expressa naturalmente o movimento da mulher em direção ao povo.
- source_word: אֶל כָּל הָעָם
  choice: até todo o povo
  rationale: Mantém o sentido amplo de עָם sem restringi-lo a soldados ou moradores da cidade.
- source_word: בְּחָכְמָתָהּ
  choice: com sua sabedoria
  rationale: Preserva tanto o substantivo “sabedoria” quanto o sufixo possessivo, além da possível nuance de modo ou meio expressa pela preposição בְּ.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: cortaram a cabeça
  rationale: Tradução direta e natural da ação de separar a cabeça.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Emprega as formas portuguesas correntes dos nomes e explicita naturalmente o patronímico hebraico.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: a lançaram a Joabe
  rationale: O pronome retoma “a cabeça”; “lançaram” conserva a força do verbo sem recorrer a linguagem arcaica.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Joabe tocou a trombeta
  rationale: O sujeito singular é retomado contextualmente como Joabe. “Tocar a trombeta” é a expressão portuguesa natural para o idioma hebraico, embora שׁוֹפָר designe especificamente uma trombeta feita de chifre.
- source_word: וַיָּפֻצוּ
  choice: se dispersaram
  rationale: Expressa o desmantelamento e a retirada do grupo sem sugerir necessariamente pânico.
- source_word: מֵעַל הָעִיר
  choice: de junto da cidade
  rationale: Conserva melhor que o simples “da cidade” a ideia de retirada da posição ocupada contra ou ao redor da cidade.
- source_word: אִישׁ לְאֹהָלָיו
  choice: cada um para a sua tenda
  rationale: Reproduz a formulação hebraica e deixa a nota explicar seu uso idiomático.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: E Joabe voltou para Jerusalém, para junto do rei
  rationale: Mantém os dois complementos direcionais do hebraico e indica que Joabe retornou à presença do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais de boa legibilidade brasileira. A sintaxe acompanha de perto a sequência narrativa hebraica, mas evita rigidez desnecessária. O marcador da nota foi colocado junto à expressão que ela efetivamente explica.
