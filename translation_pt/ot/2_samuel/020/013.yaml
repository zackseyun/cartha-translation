base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: pt
  text: Assim que ele foi retirado da estrada principal[a], todos os homens passaram adiante, seguindo Joabe, para perseguir Seba, filho de Bicri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da estrada”. O termo hebraico מְסִלָּה pode designar uma estrada elevada ou uma via principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim que
  rationale: Introduz a oração temporal e comunica a sequência imediata dos acontecimentos no contexto narrativo.
- source_word: הֹגָה
  choice: ele foi retirado
  rationale: 'O hofal expressa ação passiva: o referente, retomado do contexto anterior, foi removido por outros. O pronome refere-se a Amasa, cujo corpo obstruía a passagem.'
- source_word: מִן הַמְסִלָּה
  choice: da estrada principal
  rationale: מְסִלָּה pode designar uma estrada elevada ou importante; aqui, 'estrada principal' é natural em português e mantém o sentido marcado sem sugerir necessariamente uma rodovia moderna.
- source_word: עָבַר כָּל אִישׁ אַחֲרֵי יוֹאָב
  choice: todos os homens seguiram Joabe
  rationale: O singular distributivo כָּל אִישׁ refere-se aos combatentes, e עָבַר com אַחֲרֵי descreve o avanço deles seguindo Joabe depois que o caminho foi desobstruído.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: para perseguir
  rationale: O infinitivo expressa a finalidade do avanço e o verbo tem sentido claro de perseguição militar.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Reproduz de modo natural em português a identificação patronímica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. 'Estrada principal' evita a associação excessivamente moderna de 'rodovia', enquanto a nota preserva a amplitude lexical do hebraico.
