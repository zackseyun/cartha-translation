base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: pt
  text: 'Ele se aproximou dela, e a mulher perguntou: “Você é Joabe?” Ele respondeu: “Sou.” Então ela lhe disse: “Escute as palavras de sua serva[a].” Ele respondeu: “Estou escutando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua escrava”. O termo hebraico é uma designação feminina de serviço ou sujeição, empregada aqui como expressão humilde e respeitosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Ele se aproximou dela
  rationale: O qal de קרב com אֶל indica movimento em direção à mulher. “Aproximou-se dela” é natural e preserva o sentido físico sem acrescentar intenção.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: No contexto narrativo, אִשָּׁה designa a mulher que fala, sem indicar especificamente uma esposa.
- source_word: הַאַתָּה יוֹאָב
  choice: Você é Joabe?
  rationale: A partícula interrogativa com o pronome independente pede confirmação da identidade. A formulação é direta e corrente em português.
- source_word: אָנִי
  choice: Sou
  rationale: O pronome isolado funciona como resposta concisa de identificação. “Sou” é idiomático em português e não acrescenta um “sim” ausente do hebraico.
- source_word: שְׁמַע
  choice: Escute
  rationale: O imperativo de שמע solicita atenção ao que será dito; “escute” expressa isso com naturalidade no português moderno.
- source_word: דִּבְרֵי
  choice: as palavras de
  rationale: O plural construto de דָּבָר é mantido de forma próxima, preservando a expressão e o tom do original.
- source_word: אֲמָתֶךָ
  choice: sua serva
  rationale: אָמָה é uma designação feminina de serviço ou sujeição, usada aqui como autorreferência humilde. “Sua serva” preserva o gênero e a deferência de modo natural.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Estou escutando
  rationale: O particípio com o pronome enfático apresenta a escuta como atitude em curso. A construção progressiva é clara e idiomática.
