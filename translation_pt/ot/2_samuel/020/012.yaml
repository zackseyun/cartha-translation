  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: pt
  text: Amasa se contorcia no sangue no meio da estrada. Quando o homem viu que todo o povo parava, removeu Amasa da estrada para o campo e lançou sobre ele uma peça de roupa, pois viu que todos os que chegavam até ele paravam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: se contorcia
  rationale: O particípio Hitpolel de גלל descreve o movimento de Amasa, mortalmente ferido. Embora o sentido mais literal envolva rolar-se, “se contorcia” comunica em português atual o movimento agonizante sem a possível conotação moral de “chafurdava”.
- source_word: בַּדָּם
  choice: no próprio sangue
  rationale: O hebraico diz literalmente “no sangue”, com artigo. Em português, “no próprio sangue” expressa naturalmente a cena e deixa claro que se trata do sangue de Amasa, inferência imediata do contexto.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: no meio da estrada
  rationale: מְסִלָּה designa aqui uma via pública ou estrada. “No meio da estrada” é claro, natural e não sugere necessariamente uma rodovia moderna.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O artigo definido aponta para o homem mencionado no contexto anterior.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: que todo o povo parava
  rationale: עמד indica que as pessoas interrompiam o avanço ao encontrar Amasa. O imperfeito narrativo em português preserva a ideia de uma reação repetida ou em curso.
- source_word: וַיַּסֵּב
  choice: tirou
  rationale: O Hifil de סבב indica que o homem fez Amasa sair da estrada. “Tirou” é natural e não acrescenta o modo específico, como faria “arrastou”.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: da estrada, levando-o para o campo
  rationale: A construção marca a remoção da via e o destino no campo adjacente; a formulação explicita a relação espacial sem atribuir um método de transporte.
- source_word: בֶּגֶד
  choice: uma peça de roupa
  rationale: בֶּגֶד é um termo geral para roupa ou veste. “Peça de roupa” mantém essa generalidade e é mais corrente que “vestimenta”.
- source_word: כָּל הַבָּא עָלָיו
  choice: todos os que chegavam até ele
  rationale: A expressão descreve quem chegava ao local e encontrava Amasa; “chegavam até ele” preserva o movimento sem sugerir intenção de ajudá-lo.
- source_word: וְעָמָד
  choice: paravam
  rationale: Repete a ideia anterior de que os que encontravam Amasa interrompiam o avanço.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa é direta; evita-se “rodovia”, que seria excessivamente moderna, e também termos gráficos ou moralmente carregados não exigidos pelo hebraico.
