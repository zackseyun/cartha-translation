  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: pt
  text: '“Não é esse o caso. Na verdade, há um homem da região montanhosa de Efraim[a], chamado Seba, filho de Bicri, que levantou a mão[b] contra o rei, contra Davi. Entreguem esse homem, e somente ele, e eu me retirarei da cidade”. Então a mulher disse a Joabe: “Veja, a cabeça dele será lançada para você por cima da muralha”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “dos montes de Efraim”; tradicionalmente, “do monte Efraim”.
    reason: lexical_alternative
  - marker: b
    text: Ou, de modo mais interpretativo, “que se rebelou”. O idioma hebraico diz literalmente “que levantou a mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Não é esse o caso
  rationale: Expressa de modo natural a negação da suposição anterior da mulher, sem reproduzir de forma rígida a ordem das palavras hebraicas.
- source_word: כִּי
  choice: Na verdade
  rationale: Introduz a explicação corretiva depois da negação; em português, “Na verdade” transmite com naturalidade essa função adversativa e explicativa.
- source_word: מֵהַר אֶפְרַיִם
  choice: da região montanhosa de Efraim
  rationale: A expressão designa normalmente a região de colinas ou montanhas de Efraim, e não necessariamente um monte específico.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: chamado Seba, filho de Bicri
  rationale: Reproduz com clareza a fórmula hebraica de identificação, evitando em português a construção pouco natural “Seba, filho de Bicri, é o seu nome”.
- source_word: נָשָׂא יָדוֹ
  choice: levantou a mão
  rationale: Mantém a imagem concreta do idioma hebraico, cujo sentido contextual é o de insurgir-se ou rebelar-se.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: contra o rei, contra Davi
  rationale: Preserva a repetição da preposição e a aposição enfática do hebraico, em vez de condensá-las em “contra o rei Davi”.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Entreguem esse homem, e somente ele
  rationale: Comunica claramente a exigência de entregar apenas o culpado, preservando a ênfase de לְבַדּוֹ e evitando uma construção pronominal ambígua em português.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: e eu me retirarei da cidade
  rationale: No contexto do cerco, indica que Joabe se afastará da cidade e encerrará a ação contra ela; “me retirarei” conserva esse sentido militar sem acrescentar tropas ao texto.
- source_word: הִנֵּה
  choice: Veja
  rationale: Transmite a partícula de chamada de atenção e de garantia enfática em linguagem moderna e digna.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: a cabeça dele será lançada para você por cima da muralha
  rationale: O particípio passivo com הִנֵּה aponta aqui para um acontecimento iminente; o futuro é natural em português, e “por cima da muralha” corresponde à ação descrita no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “contra o rei, contra Davi” e a imagem “levantou a mão” foram mantidas para preservar a ênfase e a linguagem do hebraico; as notas registram alternativas geográfica e idiomática sem resolver indevidamente a nuance do original.
