base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: pt
  text: Então todos os homens de Israel subiram, afastando-se de Davi para seguir Seba, filho de Bicri.[a] Os homens de Judá, porém, apegaram-se ao seu rei,[b] desde o Jordão até Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todo homem de Israel”, uma expressão masculina coletiva.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser traduzido por “mantiveram-se unidos ao seu rei” ou “permaneceram firmemente ao lado de seu rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... מֵאַחֲרֵי דָוִד
  choice: deixaram de seguir Davi
  rationale: Embora עָלָה signifique literalmente “subir”, nesta construção narrativa indica o afastamento dos israelitas da comitiva e da lealdade a Davi. “Deixaram de seguir” comunica naturalmente a mudança sem impor uma direção geográfica incerta.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: A expressão hebraica, literalmente “todo homem de Israel”, funciona coletivamente. O plural é natural em português e preserva a referência masculina do texto.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: passaram a seguir Seba, filho de Bicri
  rationale: A repetição de אַחֲרֵי assinala a transferência de lealdade de Davi para Seba. “Passaram a seguir” explicita essa relação com clareza, sem acrescentar uma avaliação moral.
- source_word: וְאִישׁ יְהוּדָה
  choice: Os homens de Judá, porém
  rationale: O singular hebraico é coletivo. “Porém” torna explícito o contraste contextual entre a deserção de Israel e a constância de Judá.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: permaneceram firmemente ao lado de seu rei
  rationale: דבק traz a imagem de apegar-se ou manter-se unido. A formulação portuguesa preserva a ideia de firme adesão e lealdade, evitando a expressão menos natural “apegaram-se ao seu rei” neste contexto militar e político.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  choice: desde o Jordão até Jerusalém
  rationale: Reproduz de maneira direta a extensão geográfica indicada no hebraico, sem ampliar a ênfase.
