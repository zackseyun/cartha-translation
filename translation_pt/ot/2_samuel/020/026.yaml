  text: וְ/גַ֗ם עִירָא֙ הַ/יָּ֣אִרִ֔י הָיָ֥ה כֹהֵ֖ן לְ/דָוִֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: pt
  text: E também Ira, o jairita, era sacerdote de Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ministro principal» ou «conselheiro real»; a palavra hebraica significa literalmente «sacerdote», mas, em alguns contextos da corte real, pode designar um alto oficial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também
  rationale: Preserva tanto a ligação com a lista anterior quanto a nuance aditiva, de modo natural em português.
- source_word: עִירָא
  choice: Ira
  rationale: Transliteração tradicional e clara do nome próprio hebraico.
- source_word: הַיָּאִרִי
  choice: o jairita
  rationale: Reproduz de forma concisa o gentílico ou designação de clã; a expansão «descendente de Jair» seria mais interpretativa.
- source_word: הָיָה
  choice: era
  rationale: Neste registro de oficiais, o perfeito de היה funciona como cópula no passado, não como «tornou-se».
- source_word: כֹהֵן
  choice: sacerdote
  rationale: Mantém no texto a acepção lexical básica do hebraico, sem eliminar a possibilidade de um cargo cortesão, indicada em nota.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Em português, «sacerdote de Davi» expressa naturalmente a relação ou serviço indicado por לְ, preservando melhor a concisão do hebraico do que «sacerdote para Davi».
theological_decisions:
- issue: Sentido de כֹּהֵן no contexto da corte real
  choice: Manter «sacerdote» no texto principal
  alternative: «ministro principal» ou «conselheiro real»
  rationale: Embora o contexto administrativo permita entender o termo como designação de um alto oficial da corte, seu sentido lexical normal é «sacerdote». A tradução conserva essa tensão e registra a leitura funcional em nota, sem decidir além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «sacerdote de Davi» é idiomática e mantém aberta a natureza exata da função.
