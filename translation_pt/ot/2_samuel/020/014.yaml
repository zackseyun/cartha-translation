  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: pt
  text: Ele passou por todas as tribos de Israel até Abel e Bete-Maaca. Todos os beritas[a] se reuniram e também o seguiram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todos os beritas”. Algumas traduções trazem “todos os bicritas”, relacionando a expressão a Seba, filho de Bicri, mencionado no contexto; aqui, o Texto Massorético apoia mais diretamente “beritas”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e eles também vieram atrás dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: passou
  rationale: O verbo עבר, nesta forma narrativa, descreve o deslocamento por um território; “passou” é natural e mantém o sentido de percurso.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: por todas as tribos de Israel
  rationale: A preposição ב tem aqui valor locativo e distributivo, indicando a passagem pelos territórios das tribos.
- source_word: אָבֵלָה
  choice: até Abel
  rationale: O he direcional indica movimento em direção a Abel; “até” expressa claramente o destino.
- source_word: וּבֵית מַעֲכָה
  choice: e Bete-Maaca
  rationale: O contexto indica um topônimo, não a expressão comum “casa de Maaca”; emprega-se uma transliteração corrente e legível em português.
- source_word: וְכָל הַבֵּרִים
  choice: Todos os beritas
  rationale: O texto massorético aponta mais diretamente para uma designação gentílica transliterada como “beritas”; a identificação exata permanece incerta.
- source_word: וַיִּקָּהֲלוּ
  choice: se reuniram
  rationale: A forma verbal de קהל expressa que o grupo se ajuntou; “se reuniram” é claro e idiomático.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: e também o seguiram
  rationale: A construção “vieram também atrás dele” comunica, no contexto, que eles se juntaram ao seu movimento; “também o seguiram” transmite esse sentido naturalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A divisão em duas frases evita ambiguidade sintática sem alterar a sequência narrativa. Os topônimos seguem formas portuguesas transparentes, e a incerteza textual em “beritas” é preservada em nota.
