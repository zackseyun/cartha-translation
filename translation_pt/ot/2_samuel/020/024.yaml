  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: pt
  text: Adorão era responsável pelo trabalho obrigatório[a], e Josafá, filho de Ailude, era o secretário real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a leva de trabalhadores” ou “a corveia”; o termo hebraico se refere ao serviço compulsório prestado ao Estado, não à tributação comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adorão
  rationale: Transliteração portuguesa tradicional do nome hebraico, adequada ao uso bíblico corrente.
- source_word: עַל
  choice: era responsável por
  rationale: No contexto administrativo, a preposição indica autoridade ou supervisão; a formulação explicita naturalmente a cópula subentendida na oração nominal hebraica.
- source_word: הַמַּס
  choice: o trabalho obrigatório
  rationale: Neste contexto da administração real, מַס designa uma prestação compulsória de trabalho ao Estado, e não simplesmente imposto monetário. A expressão é clara e acessível em português moderno.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בֶּן אֲחִילוּד
  choice: filho de Ailude
  rationale: Tradução direta da construção patronímica hebraica, com transliteração portuguesa do nome próprio.
- source_word: הַמַּזְכִּיר
  choice: o secretário real
  rationale: O particípio substantivado designa um oficial da corte encarregado de registros e comunicações administrativas. 'Secretário real' comunica melhor a função ao leitor moderno do que o pouco natural 'registrador', sem reduzi-la à atividade de historiador.
