  verdict: revise
  source_fidelity: 'A tradução segue de perto a progressão do hebraico: a chegada de Davi à sua residência em Jerusalém, a transferência das dez concubinas para reclusão vigiada, seu sustento, a cessação das relações sexuais e a condição duradoura comparável à viuvez. “Casa de custódia”, “providenciou o sustento”, “não teve relações” e “permaneceram confinadas” comunicam adequadamente os termos e a força narrativa do texto.'
  naturalness: 'O português é moderno, claro e de registro apropriado. “Numa viuvez em vida” preserva de modo deliberado a formulação paradoxal hebraica e é suficientemente compreensível com a nota. Há, porém, uma ambiguidade evitável em “até o dia de sua morte”: o possessivo singular pode ser associado a Davi, quando o hebraico se refere à morte das mulheres.'
  terminology: “Concubinas” é o equivalente estabelecido e historicamente adequado. “Casa de custódia” conserva a imagem concreta de בֵּית מִשְׁמֶרֶת sem suavizar a reclusão. A nota sobre o eufemismo sexual e a nota sobre “viuvez em vida” são adequadas e corretamente ancoradas.
