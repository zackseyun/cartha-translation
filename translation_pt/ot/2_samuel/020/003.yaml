  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: pt
  text: Quando Davi chegou à sua casa, em Jerusalém, o rei tomou as dez mulheres — as concubinas que havia deixado para guardar a casa — e as colocou numa casa de custódia[a]. Ele providenciou o sustento delas, mas não teve relações com elas[b]. Assim, elas permaneceram confinadas até o dia da morte delas, numa viuvez em vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “casa de guarda” ou “casa de custódia”; a expressão indica reclusão sob vigilância.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não entrou a elas”, eufemismo hebraico para relações sexuais.
    reason: cultural_note
  - marker: c
    text: A expressão hebraica é incomum e significa literalmente “viuvez de vida” ou “viuvez em vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: Preserva o sentido básico de בַּיִת e permanece natural; no contexto, trata-se da residência real de Davi, mas “palácio” seria mais interpretativo.
- source_word: פִּלַגְשִׁים
  choice: concubinas
  rationale: Termo corrente para mulheres de condição conjugal reconhecida, porém inferior à de esposas principais, no ambiente régio do antigo Oriente Próximo.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: havia deixado para guardar a casa
  rationale: Mantém o valor de שׁמר, que pode envolver guardar, vigiar ou cuidar da residência.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: casa de custódia
  rationale: Reproduz de perto a expressão concreta “casa de guarda/custódia” e indica reclusão sob vigilância sem sugerir que se tratava meramente de proteção.
- source_word: וַיְכַלְכְּלֵם
  choice: providenciou o sustento delas
  rationale: Expressa o fornecimento contínuo do necessário para a manutenção das mulheres.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: não teve relações com elas
  rationale: Comunica em português atual o sentido do eufemismo hebraico para relações sexuais; a forma literal é preservada em nota.
- source_word: צְרֻרוֹת
  choice: permaneceram confinadas
  rationale: O particípio passivo descreve um estado continuado de reclusão; “permaneceram” explicita essa força durativa.
- source_word: עַד יוֹם מֻתָן
  choice: até o dia de sua morte
  rationale: Tradução direta da construção nominal hebraica, mantendo a referência coletiva às mulheres.
- source_word: אַלְמְנוּת חַיּוּת
  choice: numa viuvez em vida
  rationale: Preserva a formulação incomum e paradoxal do hebraico sem determinar além do texto todas as suas implicações sociais.
theological_decisions:
- issue: Avaliação moral e social do tratamento dado por Davi às concubinas
  choice: Narrar de modo descritivo e incisivo, mantendo custódia, sustento, ausência de relações e confinamento vitalício.
  alternative: Apresentar a medida apenas como proteção ou acrescentar uma condenação moral explícita.
  rationale: O texto relata as ações de Davi e a condição resultante das mulheres sem formular neste versículo uma avaliação moral direta. A tradução não deve justificar nem condenar com palavras ausentes do hebraico.
- issue: Sentido da expressão final אַלְמְנוּת חַיּוּת
  choice: Manter o paradoxo como “viuvez em vida”.
  alternative: Explicitar no texto principal “como viúvas embora Davi ainda estivesse vivo” ou reduzir a “vivendo como viúvas”.
  rationale: A expressão hebraica é rara e condensada. A formulação escolhida conserva sua tensão e evita transformar uma interpretação explicativa na única leitura possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi dividida em três frases para clareza, sem alterar a progressão narrativa. Os travessões identificam naturalmente as dez mulheres como as concubinas mencionadas. Evitaram-se tanto a suavização protetiva de “custódia” quanto linguagem condenatória não expressa no versículo.
