- from: 'Então Davi disse a Abisai: “Agora Seba, filho de Bicri, nos fará mais mal do que Absalão. Você mesmo, reúna os servos do seu senhor e persiga-o, para que ele não encontre para si cidades fortificadas e escape das nossas vistas.”[a]'
  to: 'Então Davi disse a Abisai: “Agora Seba, filho de Bicri, nos fará mais mal do que Absalão. Você, leve consigo os servos do seu senhor e persiga-o, para que ele não encontre cidades fortificadas para si e escape de nossa vista.”[a]'
