base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: pt
  text: 'Então Davi disse a Abisai: “Agora Seba, filho de Bicri, nos fará mais mal do que Absalão. Você, leve consigo os servos do seu senhor e persiga-o, para que ele não encontre cidades fortificadas para si e escape de nossa vista.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e livre os nossos olhos”, expressão que significa escapar de nossa vista ou esquivar-se de nós.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: nos fará mais mal
  rationale: Expressa dano ou transtorno causado, e não maldade moral abstrata; mantém naturalmente em português a comparação com Absalão.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Transliteração corrente dos nomes próprios, com a relação filial explicitada de modo natural.
- source_word: מִן אַבְשָׁלוֹם
  choice: do que Absalão
  rationale: מִן introduz a comparação; a formulação portuguesa preserva a concisão e não acrescenta um verbo ausente.
- source_word: אַתָּה קַח
  choice: Você mesmo, reúna
  rationale: O pronome independente é enfático. “Você mesmo” conserva a incumbência pessoal dada a Abisai; “reúna” traduz contextualmente o ato de tomar consigo os homens para a perseguição.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: os servos do seu senhor
  rationale: Preserva a linguagem hierárquica e o referente singular — Davi, senhor de Abisai — sem sugerir necessariamente escravidão.
- source_word: וּרְדֹף אַחֲרָיו
  choice: e persiga-o
  rationale: Formulação portuguesa concisa e natural para uma perseguição militar; a preposição hebraica não precisa ser reproduzida como pleonasmo.
- source_word: פֶּן
  choice: para que ... não
  rationale: Expressa de modo corrente a finalidade negativa ou o temor introduzido por פֶּן, evitando o português excessivamente elevado de “para que não suceda que”.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: encontre para si cidades fortificadas
  rationale: Mantém o sentido básico de מצא e o dativo de vantagem לוֹ, indicando que Seba poderia obter refúgio em centros defensáveis.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: escape das nossas vistas
  rationale: Reproduz de forma idiomática a imagem ligada aos “olhos” e comunica que Seba poderia escapar ao alcance ou à observação deles.
