  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: pt
  text: 'Então o rei disse a Amasa: “Convoque para mim os homens de Judá[a] dentro de três dias; e você, permaneça aqui.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “os homens de Judá” é uma expressão coletiva masculina. O contexto provavelmente se refere aos homens aptos para a mobilização militar, mas o texto não diz explicitamente “guerreiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido, que no contexto se refere a Davi sem necessidade de explicitar seu nome.
- source_word: הַזְעֶק
  choice: Convoque
  rationale: O imperativo hifil de זעק indica fazer uma convocação ou mobilização pública. “Convoque” é natural e preserva o caráter oficial da ordem.
- source_word: לִי
  choice: para mim
  rationale: O dativo indica que a convocação deve ser feita em favor do rei ou a seu serviço.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: os homens de Judá
  rationale: אִישׁ está no singular formal, mas tem sentido coletivo. A formulação conserva a expressão masculina sem acrescentar “guerreiros”, que o contexto sugere, mas o texto não explicita.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: dentro de três dias
  rationale: No contexto da ordem, a expressão estabelece o prazo para realizar a convocação, e não a duração da ação.
- source_word: וְאַתָּה
  choice: e você
  rationale: O pronome expresso é enfático; a tradução mantém tanto a coordenação quanto a ênfase sem introduzir contraste mais forte que o hebraico.
- source_word: פֹּה עֲמֹד
  choice: apresente-se aqui
  rationale: Embora עמד signifique literalmente “ficar de pé”, nesta construção a ordem provavelmente exige que Amasa esteja presente diante do rei ao fim do prazo. “Apresente-se aqui” comunica esse sentido de modo natural, preservando a referência ao lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Convoque” preserva o tom de ordem régia; “apresente-se aqui” evita o literalismo pouco natural de “fique de pé aqui” e entende a última instrução à luz do prazo estabelecido.
