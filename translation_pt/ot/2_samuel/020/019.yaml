base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: pt
  text: Eu sou uma das pessoas pacíficas e fiéis de Israel. Você procura destruir uma cidade e uma mãe em Israel[a]. Por que haveria de engolir a herança de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma cidade que é mãe em Israel”, provavelmente no sentido de uma cidade importante ou acolhedora em Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי
  choice: uma das pessoas pacíficas e fiéis
  rationale: Os dois plurais qualificam um grupo com o qual a mulher se identifica. A formulação preserva o valor coletivo e soa natural em português, sem reduzir a declaração a um estado interior individual.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: procura destruir
  rationale: Embora o infinitivo de מות signifique literalmente causar a morte, seu objeto é uma cidade; no contexto de cerco, “destruir” comunica naturalmente a intenção de causar sua ruína e a morte de seus habitantes.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: uma cidade, uma mãe em Israel
  rationale: Mantém a justaposição e a metáfora hebraicas sem decidir no texto principal se os termos são coordenados ou se “mãe” funciona como aposto de “cidade”.
- source_word: תְבַלַּע
  choice: engolir
  rationale: Conserva a imagem vívida do hebraico, que no contexto representa consumir ou destruir.
- source_word: נַחֲלַת יְהוָה
  choice: a herança de Yahweh
  rationale: “Herança” preserva a linguagem de pertencimento pactual, enquanto “Yahweh” representa diretamente o nome divino.
theological_decisions:
- issue: Sentido metafórico de “mãe em Israel”
  choice: Preservar “uma mãe em Israel” no texto principal.
  alternative: “uma cidade que é mãe em Israel” ou “uma cidade-mãe em Israel”
  rationale: A sintaxe admite uma leitura apositiva, mas a forma mais aberta conserva a metáfora e a tensão do hebraico; a provável relação entre “cidade” e “mãe” é esclarecida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” por naturalidade discursiva e mantém as imagens concretas de “mãe”, “engolir” e “herança”.
