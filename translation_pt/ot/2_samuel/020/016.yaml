base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: pt
  text: 'Então uma mulher sábia gritou da cidade: “Escutem! Escutem! Por favor, digam a Joabe: ‘Aproxime-se até aqui, para que eu possa falar com você.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: uma mulher sábia
  rationale: Tradução direta e natural, preservando a caracterização explícita da mulher.
- source_word: וַתִּקְרָא
  choice: gritou
  rationale: No contexto de alguém falando da cidade a quem está fora dela, o verbo קרא indica chamar em voz alta; “gritou” comunica isso com clareza.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Escutem! Escutem!
  rationale: Preserva a repetição enfática e o imperativo plural do hebraico.
- source_word: אִמְרוּ נָא אֶל יוֹאָב
  choice: Por favor, digam a Joabe
  rationale: נָא expressa aqui um pedido cortês, e o plural “digam” mantém o número do imperativo.
- source_word: קְרַב עַד הֵנָּה
  choice: Aproxime-se daqui
  rationale: Expressa de modo idiomático o pedido para que Joabe chegue até o lugar onde a mulher estava.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: para que eu possa falar com você
  rationale: Reproduz a forma volitiva e a finalidade contextual da oração hebraica.
