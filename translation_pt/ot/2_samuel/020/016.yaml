  source_fidelity: 'A tradução preserva bem a mulher sábia, o clamor vindo da cidade, a repetição enfática de «Escutem», o pedido cortês e os imperativos plurais dirigidos aos ouvintes. Contudo, «Aproxime-se daqui» é direcionalmente inadequado em português: normalmente sugere afastamento a partir deste lugar, enquanto o hebraico pede que Joabe venha para onde a mulher está («até aqui»).'
