    issue: «Aproxime-se daqui»
    rationale: A construção portuguesa pode significar «afaste-se deste lugar» ou, no mínimo, não comunica claramente o movimento em direção ao local da mulher. קְרַב עַד הֵנָּה significa «venha/aproxime-se até aqui».
