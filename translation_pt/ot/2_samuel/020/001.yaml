source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: pt
  text: 'Por acaso, havia ali um homem sem valor[a], chamado Seba, filho de Bicri, benjaminita. Ele tocou a trombeta[b] e disse: “Não temos parte[c] em Davi, nem herança no filho de Jessé. Cada um para as suas tendas[d], ó Israel!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem perverso”, “um canalha” ou, mais literalmente, “um homem de Belial”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico shofar, um instrumento de chifre usado para emitir sinais públicos; tradicionalmente, era feito de chifre de carneiro.
    reason: cultural_note
  - marker: c
    text: Ou “Não temos quinhão em Davi”.
    reason: lexical_alternative
  - marker: d
    text: O hebraico diz literalmente “Cada homem para as suas tendas”, expressão distributiva que manda cada pessoa voltar à sua casa ou ao seu acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: se encontrava
  rationale: 'Neste uso narrativo, com שָׁם, a forma funciona como expressão existencial: apresenta alguém que estava ou veio a estar ali, sem indicar que ele recebeu um nome.'
- source_word: אִישׁ בְּלִיַּעַל
  choice: um homem perverso
  rationale: A expressão caracteriza Seba como moralmente mau ou sem valor; aqui בְּלִיַּעַל funciona como termo descritivo, não necessariamente como nome próprio.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba, filho de Bicri
  rationale: Os nomes seguem as formas portuguesas bíblicas correntes, e a filiação é mantida explicitamente.
- source_word: אִישׁ יְמִינִי
  choice: benjaminita
  rationale: A expressão identifica a filiação tribal de Seba; “benjaminita” é a forma natural e precisa em português.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: tocou a trombeta
  rationale: A formulação comunica naturalmente o ato de fazer soar o instrumento como sinal público; a natureza específica do shofar é esclarecida em nota.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Não temos parte em Davi
  rationale: “Parte” preserva o sentido de participação, quinhão ou interesse na autoridade de Davi e mantém a formulação enfática do grito político.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: nem herança no filho de Jessé
  rationale: “Herança” conserva a ressonância de posse ou quinhão recebido, aqui aplicada metaforicamente à relação política com a casa de Davi.
- source_word: בְּבֶן יִשַׁי
  choice: no filho de Jessé
  rationale: A referência a Davi pela ascendência, em vez de por seu título real, preserva o tom depreciativo do discurso.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Cada um para as suas tendas
  rationale: A tradução mantém a imagem literal e o caráter de palavra de ordem, enquanto “cada um” expressa naturalmente o valor distributivo do singular hebraico.
- source_word: יִשְׂרָאֵל
  choice: ó Israel
  rationale: A partícula vocativa torna explícito em português que Israel é o destinatário do grito de convocação.
theological_decisions:
- issue: Se בְּלִיַּעַל deve ser entendido como nome próprio (“Belial”) ou como descrição moral
  choice: 'termo descritivo: “homem perverso”'
  alternative: “homem de Belial” ou “homem sem valor”
  rationale: No contexto, a expressão hebraica caracteriza a conduta e o caráter de Seba. Tratá-la como título demoníaco importaria uma associação teológica posterior que o texto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase conserva a cadência de um grito de rebelião e a imagem concreta das tendas, sem transformar “Belial” em nome próprio nem suavizar a referência depreciativa a Davi como “filho de Jessé”.
