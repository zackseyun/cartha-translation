  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: pt
  text: 'Então ela disse[a]: “Antigamente se costumava dizer: ‘Que se consulte em Abel[b]’, e assim davam o assunto por encerrado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: “Então ela disse: ‘Antigamente, certamente diziam: “Consultem sem falta em Abel”; e assim punham fim à questão’”. O hebraico usa construções enfáticas nas duas orações, e o verbo final também pode ser traduzido mais literalmente por “punham fim” ou “concluíam”.'
    reason: lexical_alternative
  - marker: b
    text: “Abel” é a forma abreviada de Abel-Bete-Maaca, a cidade sitiada neste contexto.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Então ela disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; o infinitivo לֵאמֹר introduz a fala e é representado naturalmente pelos dois-pontos e pelas aspas.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: se costumava dizer
  rationale: A combinação do infinitivo absoluto com o imperfeito expressa fala enfática ou habitual. Neste dito tradicional, a construção impessoal comunica com naturalidade o costume antigo sem atribuir a fala a um grupo específico.
- source_word: בָרִאשֹׁנָה
  choice: Antigamente
  rationale: Indica um costume de tempos anteriores, e não necessariamente a primeira etapa de uma sequência.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Que se consulte
  rationale: O infinitivo absoluto com o imperfeito intensifica שאל. No provérbio, a formulação exortativa preserva a ideia de recorrer decididamente à cidade para obter orientação; a nota registra uma tradução mais explícita da ênfase.
- source_word: בְּאָבֵל
  choice: em Abel
  rationale: Abel é aqui a forma abreviada do nome da cidade Abel-Bete-Maaca. A preposição בְּ é naturalmente vertida por “em” neste contexto.
- source_word: וְכֵן הֵתַמּוּ
  choice: e assim davam o assunto por encerrado
  rationale: וכן introduz o resultado, e o hifil de תמם indica levar algo à conclusão. A expressão portuguesa comunica que, depois da consulta, a questão era concluída, preservando o caráter habitual sugerido pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o tom proverbial da fala e evita-se tornar a formulação mais específica do que o hebraico. O marcador cultural [b] foi colocado junto ao topônimo a que se refere.
