  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: pt
  text: 'Então Davi disse a Gade: “Estou muito angustiado. Caiamos, por favor, nas mãos de Yahweh, pois muitas são as suas misericórdias; mas que eu não caia nas mãos dos homens.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Estou muito angustiado
  rationale: A construção predicativa com לִי expressa a profunda aflição pessoal de Davi; a formulação é natural e preserva a intensidade de מְאֹד.
- source_word: נִפְּלָה נָּא
  choice: Caiamos, por favor
  rationale: O coortativo na primeira pessoa do plural inclui Davi com o povo, e נָא acrescenta o tom de súplica.
- source_word: בְיַד יְהוָה
  choice: nas mãos de Yahweh
  rationale: A expressão idiomática indica ficar sob o poder ou controle de alguém. O plural 'nas mãos' é a forma idiomática corrente em português, enquanto Yahweh preserva o nome divino.
- source_word: כִּי רַבִּים רחמיו
  choice: pois grande é a sua misericórdia
  rationale: O plural hebraico רַחֲמָיו pode designar a compaixão misericordiosa em sentido abundante; o singular coletivo é mais natural em português e mantém a ideia de grande misericórdia.
- source_word: וּבְיַד אָדָם
  choice: mas que eu não caia nas mãos dos homens
  rationale: אָדָם é genérico neste contraste entre o poder divino e o poder humano. 'Dos homens' comunica naturalmente seres humanos e preserva o contraste.
- source_word: אַל אֶפֹּלָה
  choice: que eu não caia
  rationale: A partícula negativa com a forma verbal volitiva expressa o desejo enfático de Davi, sem transformar a frase numa ordem dirigida explicitamente a Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Número do sujeito em נִפְּלָה
  choice: Caiamos
  alternative: Que eu caia
  rationale: A forma hebraica é primeira pessoa do plural, mostrando que Davi se identifica com o povo submetido ao juízo; o singular posterior permanece singular.
- issue: Sentido de אָדָם no contraste com Yahweh
  choice: homens
  alternative: homem
  rationale: Aqui o substantivo singular tem referência humana genérica. O plural idiomático em português evita sugerir um indivíduo específico, sem resolver além do texto o agente humano envolvido.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. Mantém o paralelismo entre cair nas mãos de Yahweh e nas mãos dos homens, bem como a mudança deliberada do plural 'caiamos' para o singular 'eu não caia'.
