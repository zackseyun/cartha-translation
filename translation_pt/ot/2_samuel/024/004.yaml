base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: pt
  text: Mas a ordem do rei prevaleceu contra Joabe e contra os comandantes do exército. Assim, Joabe e os comandantes do exército saíram da presença do rei para contar o povo de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ
  choice: a ordem do rei
  rationale: No contexto, דָּבָר não é apenas uma palavra falada, mas a determinação régia de realizar o recenseamento; “ordem” comunica isso com naturalidade.
- source_word: וַיֶּחֱזַק ... אֶל ... וְעַל
  choice: prevaleceu contra ... e contra
  rationale: Preserva a ideia de que a determinação do rei venceu a resistência de Joabe e dos comandantes, sem suavizar a oposição presente na construção hebraica.
- source_word: שָׂרֵי הֶחָיִל
  choice: comandantes do exército
  rationale: שָׂרֵי designa chefes ou oficiais, e חַיִל, neste contexto militar, refere-se ao exército.
- source_word: לִפְקֹד
  choice: contar
  rationale: O verbo פקד pode significar registrar, recensear ou passar em revista; “contar” preserva a formulação simples e o propósito imediato da missão neste contexto.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: da presença do rei
  rationale: Reproduz de modo natural a expressão espacial hebraica e indica que eles partiram de onde estavam diante do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A repetição de “contra” e de “comandantes do exército” foi mantida para refletir a ênfase e a estrutura do hebraico.
