base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: pt
  text: Então Davi subiu conforme a palavra de Gade, assim como Yahweh havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O verbo עלה expressa movimento para cima. “Subiu” preserva essa nuance direcional de modo natural e conciso em português.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כִּדְבַר
  choice: conforme a palavra de
  rationale: A construção כ + דבר significa “conforme/segundo a palavra de”. A explicitação de “palavra” preserva o texto hebraico e ressalta que Davi agiu segundo a mensagem profética de Gade.
- source_word: גָּד
  choice: Gade
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa naturalmente a correspondência entre a palavra transmitida por Gade e a ordem de Yahweh.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo significa “ordenar”. O mais-que-perfeito composto torna clara a anterioridade da ordem de Yahweh em relação à ação de Davi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e representa uma transliteração acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação mantém a repetição semântica do hebraico entre a palavra de Gade e a ordem de Yahweh, sem tornar a frase excessivamente formal.
