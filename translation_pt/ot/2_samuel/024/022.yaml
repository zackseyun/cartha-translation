  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: pt
  text: 'Então Araúna disse a Davi: “Que o rei, meu senhor, pegue e ofereça o que lhe parecer bom.[a] Aqui estão os bois para o holocausto, e os trenós de debulhar e os apetrechos dos bois servirão de lenha.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o que for bom aos seus olhos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é ampla e pode se referir, de modo geral, ao equipamento de madeira usado com os bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: pegue e ofereça
  rationale: Os imperfeitos com valor volitivo expressam uma oferta ou permissão respeitosa. A formulação preserva tanto a ação de tomar quanto o sentido sacrificial de עלה.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Forma natural e digna de reproduzir o tratamento cortês dirigido ao rei, sem arcaísmo excessivo.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: o que lhe parecer bom
  rationale: Expressa com naturalidade a expressão idiomática hebraica, cujo sentido é aquilo que o rei considerar apropriado, deixando a forma mais literal em nota.
- source_word: רְאֵה
  choice: Aqui estão
  rationale: No contexto, o imperativo chama a atenção para os bens que Araúna põe à disposição; esta formulação é idiomática em português e mantém sua função discursiva.
- source_word: הַבָּקָר
  choice: os bois
  rationale: O contexto de trabalho com instrumentos de debulha favorece bois, e não o termo mais amplo gado.
- source_word: לָעֹלָה
  choice: para o holocausto
  rationale: Holocausto é o termo bíblico português corrente para a oferta inteiramente queimada e mantém a especificidade de עֹלָה.
- source_word: הַמֹּרִגִּים
  choice: os trenós de debulhar
  rationale: Designa instrumentos pesados, semelhantes a trenós ou pranchas, usados para debulhar; a escolha é concreta e compreensível.
- source_word: כְלֵי הַבָּקָר
  choice: os apetrechos dos bois
  rationale: כְּלִי é amplo e não identifica especificamente jugos. Apetrechos preserva essa amplitude e se refere ao equipamento associado aos bois.
- source_word: לָעֵצִים
  choice: servirão de lenha
  rationale: Torna explícito, sem acrescentar conteúdo alheio, que os objetos de madeira seriam usados como combustível para o sacrifício.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com tratamento régio respeitoso. A expressão idiomática hebraica é comunicada no texto e preservada literalmente em nota; evita-se especificar “jugos” onde o hebraico diz genericamente “apetrechos/equipamento”.
