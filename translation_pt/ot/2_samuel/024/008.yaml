  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: pt
  text: Eles percorreram toda a terra e, ao fim de nove meses e vinte dias, chegaram a Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: percorreram
  rationale: O verbo שׁוּט descreve deslocamento por uma região. “Percorreram” comunica naturalmente uma viagem abrangente e deliberada no contexto do recenseamento, sem sugerir a falta de rumo que “vagaram” poderia transmitir.
- source_word: בְּכָל הָאָרֶץ
  choice: toda a terra
  rationale: A construção indica movimento pela totalidade do território. Com “percorreram”, a expressão “toda a terra” é clara, idiomática e mantém a abrangência do hebraico.
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: Embora בוא possa significar “vir”, diante de um destino explícito “chegaram a Jerusalém” é a formulação narrativa mais natural em português.
- source_word: מִקְצֵה
  choice: ao fim de
  rationale: Neste uso temporal, a expressão marca o ponto em que o período se completou. “Ao fim de” preserva essa relação de modo conciso e natural.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: nove meses e vinte dias
  rationale: Tradução direta e idiomática da duração indicada no texto hebraico.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma consagrada do nome geográfico em português.
