base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: pt
  text: 'Então Gade foi até Davi, informou-o e disse: “Virão sete anos de fome[a] em sua terra? Ou você fugirá por três meses diante de seus adversários[b], enquanto eles o perseguem? Ou haverá três dias de peste[c] em sua terra? Agora, considere e veja que resposta devo levar àquele que me enviou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O relato paralelo em 1 Crônicas 21:12 diz “três anos de fome”, em vez de “sete anos”.
    reason: textual_variant
  - marker: b
    text: Ou “inimigos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “epidemia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: Gade foi até Davi
  rationale: בוא indica a aproximação de Gade a Davi. Em português, “foi até” expressa esse movimento com naturalidade, sem alterar a perspectiva narrativa.
- source_word: וַיַּגֶּד לוֹ
  choice: comunicou-lhe a mensagem
  rationale: O Hifil de נגד significa comunicar, contar ou relatar. O complemento “a mensagem” explicita de modo natural em português o conteúdo implícito no verbo hebraico e evita a sequência pouco fluida “contou-lhe e disse-lhe”.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: sete anos de fome
  rationale: רָעָב designa aqui fome generalizada, e não apenas fome individual. Mantém-se no texto principal o número “sete” do texto massorético de 2 Samuel.
- source_word: נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: você fugirá durante três meses diante dos seus adversários
  rationale: A construção hebraica é elíptica e descreve Davi ou seu povo fugindo perante forças hostis. A formulação torna a duração e a ação claras sem harmonizar ou ampliar o sentido.
- source_word: וְהוּא רֹדְפֶךָ
  choice: enquanto eles o perseguem
  rationale: Embora הוּא esteja no singular, seu referente é entendido coletivamente a partir de צָרֶיךָ, no plural. O plural em português garante concordância natural com “adversários”.
- source_word: דֶּבֶר
  choice: peste
  rationale: דֶּבֶר denota uma epidemia mortal ou pestilência. “Peste” é corrente, grave e compreensível em português moderno; “epidemia” também é possível.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Agora, considere e veja
  rationale: Os dois imperativos convocam Davi a avaliar a escolha e decidir. “Considere” comunica melhor a função contextual de דַּע do que o literal e pouco idiomático “saiba”.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: que resposta devo levar àquele que me enviou
  rationale: השיב דבר é uma expressão idiomática para levar ou dar uma resposta. A redação portuguesa preserva o remetente sem o rígido “devolver uma palavra”.
theological_decisions:
- issue: Diferença numérica em relação ao relato paralelo de 1 Crônicas 21:12
  choice: Manter “sete anos de fome” no texto principal
  alternative: “três anos de fome”, conforme 1 Crônicas 21:12
  rationale: O texto massorético de 2 Samuel 24:13 traz “sete anos”, enquanto o paralelo em 1 Crônicas traz “três anos”. Traduzir a leitura fornecida e registrar o paralelo em nota preserva a evidência textual e a tensão canônica sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O discurso direto conserva a solenidade da apresentação das três alternativas, mas evita construções excessivamente literais ou arcaicas.
