review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente a ordem, a fórmula profética, o nome divino e a escolha entre três alternativas. Contudo, “três opções” explicita mais do que o hebraico, que traz apenas o numeral, e “eu a farei acontecer contra você” transforma de modo excessivamente explicativo a expressão elíptica “eu o farei a você”.
  naturalness: O texto é claro e moderno. “Vá e diga” é possível, mas “Vá e fale a Davi” corresponde mais diretamente a “fale a Davi”. A formulação final proposta preserva melhor a concisão solene e adversativa do original sem a construção pouco natural “fazer acontecer contra você”.
  terminology: “Yahweh” representa de modo consistente o tetragrama. “Assim diz” mantém apropriadamente o registro da fórmula profética. “Coisas”, com nota sobre a elipse hebraica, é menos interpretativo do que “opções”.
  issues:
  - severity: medium
    issue: “três opções” especifica o substantivo implícito como alternativas de escolha.
    rationale: O hebraico traz somente “três”. Embora o contexto envolva uma escolha, “opções” é uma explicitação interpretativa; “três coisas”, acompanhada de nota, conserva melhor a abertura do original.
  - severity: medium
    issue: “eu a farei acontecer contra você” reformula excessivamente a cláusula final.
    rationale: A expressão hebraica é elíptica e literalmente mantém “farei ... a você”; a versão proposta introduz a noção de ‘acontecer’ e uma retomada feminina determinada. “Eu farei isso a você” preserva a elipse e o sentido adverso contextual.
  - severity: low
    issue: “diga a Davi” é menos direto do que “fale a Davi”.
    rationale: O verbo hebraico é ‘falar’, não especificamente ‘dizer’; “fale a Davi” reproduz melhor a construção sem perder naturalidade.
  revised_text: 'Vá e fale a Davi: “Assim diz Yahweh: ‘Eu ponho diante de você três coisas.[a] Escolha uma delas para si, e eu farei isso a você.’”'
  revised_footnotes:
