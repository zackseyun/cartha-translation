base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: pt
  text: 'Vá e fale a Davi: “Assim diz Yahweh: ‘Eu ponho diante de você três coisas.[a] Escolha uma delas para si, e eu farei isso a você.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “três”; o substantivo fica subentendido. Também se pode traduzir por “três opções”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Vá e diga
  rationale: A construção reforça a ordem de ir e falar. Em português, “Vá e diga” expressa naturalmente a sequência e introduz bem a mensagem direta.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula formal do mensageiro profético e translitera o nome divino presente no hebraico.
- source_word: שָׁלֹשׁ
  choice: três opções
  rationale: O hebraico traz somente o numeral feminino “três”, com o substantivo subentendido. O contexto de escolha favorece “opções”, sem ocultar em nota a forma elíptica do original.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: Eu ponho diante de você
  rationale: No contexto, a expressão apresenta três possibilidades a Davi para que escolha uma. Esta formulação é natural e mantém a imagem de algo colocado à sua consideração.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Escolha para si uma delas
  rationale: “Escolha” traduz diretamente o verbo, “para si” representa o dativo לְךָ, e “uma delas” reproduz a relação partitiva.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: e eu a farei acontecer contra você
  rationale: O pronome retoma a opção escolhida; “contra você” comunica o sentido adverso da ação no contexto de juízo, evitando o enganoso “por você”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Sentido adverso de וְאֶעֱשֶׂה לָּךְ
  choice: eu a farei acontecer contra você
  alternative: eu farei isso a você; eu a trarei sobre você
  rationale: O contexto é de punição, mas a tradução evita especificar antecipadamente qual juízo será escolhido. “Contra você” deixa claro o valor adverso sem acrescentar uma imagem ausente da oração.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética em “Assim diz Yahweh”. Usa “você” para ampla legibilidade brasileira; mantém “para si” a fim de representar a responsabilidade pessoal expressa no hebraico.
