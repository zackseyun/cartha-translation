base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: pt
  text: 'Quando Davi se levantou de manhã, a palavra de Yahweh havia vindo a Gade[a], o profeta, vidente de Davi, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “a palavra de Yahweh era para Gade”.'
    reason: Alternativa lexical para a construção hebraica הָיָה אֶל, literalmente “era/estava para”. O texto principal expressa seu sentido idiomático na fórmula profética.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום dá sequência à narrativa; “se levantou” é natural em português e adequado ao ato de levantar-se pela manhã.
- source_word: בַּבֹּקֶר
  choice: de manhã
  rationale: Expressão temporal corrente e clara, equivalente ao hebraico sem acrescentar uma referência demonstrativa como “naquela manhã”.
- source_word: וּדְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e traduz diretamente o nome divino יְהוָה como “Yahweh”.
- source_word: הָיָה אֶל
  choice: havia vindo a
  rationale: 'A construção idiomática indica que a palavra divina chegou ao profeta. O mais-que-perfeito representa a provável relação temporal: quando Davi se levantou, a palavra já havia vindo a Gade, sem inserir “já” no texto.'
- source_word: גָּד
  choice: Gade
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Tradução direta do título נָבִיא.
- source_word: חֹזֵה דָוִד
  choice: vidente de Davi
  rationale: Mantém a designação חֹזֶה distinta de “profeta” e conserva a relação de Gade com Davi sem tornar a expressão mais possessiva do que o construto hebraico exige.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Fórmula narrativa que introduz a fala direta do versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Relação temporal de הָיָה אֶל
  choice: havia vindo a
  alternative: veio a; estava dirigida a
  rationale: O mais-que-perfeito apresenta a comunicação a Gade como anterior ao momento em que Davi se levantou, conforme a leitura contextual provável, enquanto a nota registra a formulação hebraica mais literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vidente” preserva a distinção lexical em relação a “profeta”; “dizendo:” mantém a continuidade com a fala do versículo seguinte.
