base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: pt
  text: 'Joabe entregou ao rei o total do recenseamento do povo: em Israel havia oitocentos mil homens valentes que desembainhavam a espada[a], e os homens de Judá eram quinhentos mil homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O relato paralelo em 1 Crônicas 21:5 apresenta totais diferentes: 1.100.000 para Israel e 470.000 para Judá. Aqui se segue o texto hebraico de 2 Samuel, sem harmonizar os números.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: o total do recenseamento do povo
  rationale: A expressão combina “número” com “recenseamento/contagem”. “O total do recenseamento” comunica com naturalidade o resultado numérico apresentado a seguir.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: em Israel havia
  rationale: Expressa de modo natural em português o sentido resultativo da construção hebraica que introduz o total de Israel.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: oitocentos mil
  rationale: Tradução direta do numeral cardinal.
- source_word: אִישׁ חַיִל
  choice: homens valentes
  rationale: Preserva a ideia de força e valor militar; no contexto do recenseamento, designa homens aptos para o combate.
- source_word: שֹׁלֵף חֶרֶב
  choice: que manejavam a espada
  rationale: Mantém a imagem militar concreta do hebraico, literalmente relacionada a desembainhar a espada, em formulação portuguesa natural que indica aptidão para a guerra.
- source_word: וְאִישׁ יְהוּדָה
  choice: e os homens de Judá
  rationale: O singular hebraico tem sentido coletivo; o plural em português torna esse valor claro.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: quinhentos mil
  rationale: O referente “homens” já aparece imediatamente antes em português, e sua elipse evita repetição pesada sem perder conteúdo.
theological_decisions:
- issue: Divergência numérica em relação ao paralelo de 1 Crônicas 21:5
  choice: 'Manter os números do texto massorético de 2 Samuel: oitocentos mil para Israel e quinhentos mil para Judá.'
  alternative: Harmonizar os números com 1 Crônicas ou explicar a diferença como categorias militares distintas.
  rationale: A tradução deve representar o texto hebraico deste versículo sem inserir uma proposta de harmonização. A divergência é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Recenseamento” preserva a natureza oficial da contagem, e “manejavam a espada” mantém a imagem militar sem recorrer a linguagem excessivamente arcaica.
