  source_fidelity: 'O texto preserva os elementos do hebraico: “Tudo isso” para הַכֹּל, o pretérito narrativo “deu”, a aposição incomum “Araúna, o rei”, o destinatário “ao rei” e a bênção “Que Yahweh, seu Deus, o aceite”. A referência pronominal permanece dirigida ao rei Davi, e o título aplicado a Araúna não é suprimido nem reinterpretado.'
