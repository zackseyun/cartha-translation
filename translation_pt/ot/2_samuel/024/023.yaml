  terminology: “Araúna” é uma forma portuguesa adequada para o nome em Samuel; “Yahweh” reproduz de modo consistente o Tetragrama conforme a política indicada. “O aceite” traduz adequadamente o sentido de aceitação favorável de רצה, sem impor uma interpretação sacrificial mais estreita do que o texto exige. As notas registram tanto a dificuldade do título quanto alternativas semânticas legítimas.
