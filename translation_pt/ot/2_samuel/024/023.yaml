id: 2SA.24.23
reference: 2 Samuel 24:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: pt
  text: 'Tudo isso Araúna, o rei, deu ao rei[a]. E Araúna disse ao rei: “Que Yahweh, seu Deus, o aceite[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Araúna, o rei”. Algumas traduções omitem ou suavizam esse título para não dar a entender que Araúna tinha condição real, mas ele consta no texto hebraico.'
    reason: alternative_reading
  - marker: b
    text: Ou “se agrade de você” ou “lhe seja favorável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Tudo isso
  rationale: Retoma de modo natural, em português, o conjunto dos bens oferecidos no contexto anterior, preservando a ideia de totalidade.
- source_word: נָתַן
  choice: deu
  rationale: O qatal, neste contexto narrativo, é adequadamente expresso pelo pretérito perfeito.
- source_word: אֲרַוְנָה
  choice: Araúna
  rationale: Transliteração portuguesa do nome próprio conforme aparece em Samuel; não se importa a forma alternativa de Crônicas.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título em aposição a Araúna, embora seja inesperado no contexto, em respeito à forma explícita do texto hebraico.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: A preposição ל marca o destinatário da dádiva, isto é, o rei Davi.
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Reproduz com naturalidade a progressão narrativa introduzida pelo waw consecutivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Expressa diretamente a construção com sufixo de segunda pessoa masculina singular, dirigida a Davi.
- source_word: יִרְצֶךָ
  choice: o aceite
  rationale: O verbo רצה comunica aceitação favorável. A construção portuguesa é concisa e preserva tanto o objeto pessoal quanto a ressonância cultual do contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Título “o rei” aplicado a Araúna
  choice: Manter “Araúna, o rei” no texto principal
  alternative: Suprimir o título e traduzir apenas “Araúna deu tudo isso ao rei”
  rationale: Apesar da dificuldade histórica e contextual, o texto massorético contém explicitamente o título em aposição. A tradução preserva essa tensão textual, sem corrigi-la silenciosamente.
- issue: Sentido de יִרְצֶךָ
  choice: “o aceite”
  alternative: “se agrade de você” ou “lhe seja favorável”
  rationale: “Aceitar” se ajusta ao contexto sacrificial, mas a nota conserva os outros matizes legítimos do verbo, sem restringir indevidamente seu alcance.
translation_notes:
  register: Português atual, digno e claro, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mas a expressão incomum “Araúna, o rei” foi preservada e explicada em nota. O pronome objeto “o” mantém o tratamento respeitoso e evita regionalismos excessivos.
