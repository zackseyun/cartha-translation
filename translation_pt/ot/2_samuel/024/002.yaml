base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: pt
  text: 'Então o rei disse a Joabe, comandante do exército que estava com ele: “Vá agora por todas as tribos de Israel, desde Dã até Berseba, e recenseiem o povo[a], para que eu saiba quantos são.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “registrem o povo”. O verbo hebraico pode indicar contar ou registrar pessoas, às vezes em contexto militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido empregado no hebraico, sem substituí-lo pelo nome de Davi.
- source_word: שַׂר הַחַיִל
  choice: comandante do exército
  rationale: Expressa com clareza moderna a função militar de Joabe; חַיִל, neste contexto, designa a força armada.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estava com ele
  rationale: Reproduz a oração relativa que identifica Joabe como presente junto ao rei.
- source_word: שׁוּט נָא
  choice: Vá agora por
  rationale: שׁוּט indica deslocar-se por uma região, e נָא atenua a ordem. A formulação mantém o caráter diretivo sem recorrer a um “por favor” pouco natural numa ordem régia.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: todas as tribos de Israel
  rationale: Com a preposição “por” ligada ao verbo de movimento, comunica a passagem por toda a extensão das tribos.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: desde Dã até Berseba
  rationale: Preserva o merismo geográfico tradicional que abrange o território de Israel de norte a sul.
- source_word: וּפִקְדוּ
  choice: e recenseie
  rationale: פקד refere-se aqui à contagem ou ao registro da população. “Recenseie” reúne essas ideias com concisão. O hebraico muda de um imperativo singular para uma forma plural; a tradução usa o singular para tornar explícita em português a ordem dirigida a Joabe, sem excluir a execução por seus subordinados.
- source_word: אֶת הָעָם
  choice: o povo
  rationale: עָם é o termo amplo para “povo”; o contexto militar não justifica restringi-lo a soldados ou combatentes.
- source_word: וְיָדַעְתִּי
  choice: para que eu saiba
  rationale: Expressa naturalmente a finalidade da ordem no contexto.
- source_word: מִסְפַּר הָעָם
  choice: quantos são
  rationale: Transmite idiomaticamente a ideia de conhecer o número do povo, evitando uma repetição pesada em português sem alterar o sentido.
theological_decisions:
- issue: Alcance de הָעָם num contexto militar e administrativo
  choice: o povo
  alternative: os combatentes / as tropas
  rationale: Embora Joabe seja comandante do exército e o recenseamento possa ter implicações militares, o hebraico emprega עָם, “povo”, e não um termo específico para guerreiros. A tradução conserva essa abrangência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “Dã” e “Berseba” seguem formas portuguesas tradicionais. A ordem régia permanece direta, e a formulação evita arcaísmos militares.
