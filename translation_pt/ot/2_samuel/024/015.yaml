reference: 2 Samuel 24:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: pt
  text: Assim, Yahweh enviou uma praga sobre Israel, desde aquela manhã até o tempo determinado[a]. E morreram setenta mil homens do povo, desde Dã até Berseba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até a hora marcada”. A expressão hebraica pode indicar um tempo determinado ou fixado; menos provavelmente aqui, “até o tempo da assembleia”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: enviou
  rationale: Embora o verbo signifique literalmente “deu”, a combinação com דֶּבֶר expressa de modo natural o envio de uma praga e mantém explícita a ação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: דֶּבֶר
  choice: praga
  rationale: Termo atual e claro para uma epidemia mortal; “pestilência” seria mais tradicional, porém menos corrente.
- source_word: בְּיִשְׂרָאֵל
  choice: sobre Israel
  rationale: Expressa naturalmente a calamidade que recai sobre o povo.
- source_word: מֵהַבֹּקֶר
  choice: desde aquela manhã
  rationale: O artigo hebraico aponta naturalmente para a manhã em questão no contexto narrativo.
- source_word: וְעַד עֵת מוֹעֵד
  choice: até o tempo determinado
  rationale: מוֹעֵד pode indicar um tempo marcado ou fixado; a formulação mantém essa referência temporal sem especificar quem o determinou.
- source_word: וַיָּמָת מִן הָעָם
  choice: morreram ... homens do povo
  rationale: O singular hebraico ocorre com sentido coletivo; o plural é a construção natural em português, e “do povo” identifica a quem pertenciam os mortos.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: desde Dã até Berseba
  rationale: Preserva a expressão geográfica que abrange Israel de norte a sul.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: setenta mil homens
  rationale: אִישׁ é masculino e distributivo depois do numeral; “homens” conserva essa forma em vez de generalizá-la como “pessoas”.
theological_decisions:
- issue: Ação divina no juízo
  choice: Yahweh enviou uma praga
  alternative: Yahweh permitiu que uma praga atingisse Israel
  rationale: O hebraico atribui diretamente a ação a Yahweh; não há verbo que indique mera permissão.
- issue: Sentido de עֵת מוֹעֵד
  choice: até o tempo determinado
  alternative: até a hora marcada; até o tempo da assembleia
  rationale: No contexto, a leitura como limite temporal é a mais provável, mas a nota preserva a amplitude lexical e a alternativa menos provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “praga” evita o arcaísmo de “pestilência”. A divisão em duas frases melhora a leitura sem alterar a progressão do hebraico.
