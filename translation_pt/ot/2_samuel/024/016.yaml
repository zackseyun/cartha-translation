source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: pt
  text: 'Quando o anjo estendeu a mão contra Jerusalém para destruí-la, Yahweh voltou atrás quanto à calamidade[a] e disse ao anjo que estava destruindo o povo: “Basta! Agora recolha a sua mão”. O anjo de Yahweh estava junto à eira de Araúna, o jebuseu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desistiu da calamidade”. O hebraico diz literalmente que Yahweh “voltou atrás quanto à calamidade”; aqui, “calamidade” significa desastre, não maldade moral.'
    reason: lexical_alternative
  - marker: b
    text: Araúna é chamado Ornã no relato paralelo de 1 Crônicas 21:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: estendeu a mão
  rationale: Expressa naturalmente o idioma hebraico de estender a mão para agir e mantém a imagem concreta do juízo prestes a atingir Jerusalém.
- source_word: הַמַּלְאָךְ
  choice: o anjo
  rationale: Neste contexto, trata-se do agente celestial que executa o juízo; “anjo” é mais adequado que o termo genérico “mensageiro”.
- source_word: לְשַׁחֲתָהּ
  choice: para destruí-la
  rationale: O infinitivo indica a finalidade destrutiva da ação contra Jerusalém; a forma pronominal identifica claramente a cidade como objeto.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Yahweh voltou atrás quanto à calamidade
  rationale: “Voltou atrás” comunica a interrupção do juízo sem eliminar a linguagem antropopática do hebraico. “Calamidade” indica desastre ou desgraça, não maldade moral, e “quanto a” preserva a relação ampla expressa por אֶל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: que estava destruindo o povo
  rationale: A oração relativa reproduz de modo natural o particípio hebraico e seu sentido de ação em curso.
- source_word: רַב
  choice: Basta!
  rationale: O termo funciona aqui como uma exclamação breve que ordena o fim da destruição.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Agora recolha a sua mão
  rationale: A formulação comunica a ordem de cessar a ação e conserva a imagem da mão estendida.
- source_word: וּמַלְאַךְ יְהוָה
  choice: O anjo de Yahweh
  rationale: Mantém a designação textual sem determinar teologicamente a natureza exata da figura.
- source_word: הָיָה עִם
  choice: estava junto a
  rationale: Neste contexto locativo, indica proximidade de maneira natural em português.
- source_word: גֹּרֶן
  choice: eira
  rationale: É o termo português tradicional e preciso para o espaço onde se debulhavam e joeiravam cereais.
- source_word: הָאֹרְנָה
  choice: Araúna
  rationale: Representa a forma do nome encontrada em Samuel; a forma paralela de Crônicas é indicada em nota.
- source_word: הַיְבֻסִי
  choice: o jebuseu
  rationale: Mantém a identificação étnica dada pelo texto hebraico.
theological_decisions:
- issue: Linguagem antropopática em וַיִּנָּחֶם יְהוָה
  choice: Yahweh voltou atrás quanto à calamidade
  alternative: Yahweh se arrependeu da calamidade; Yahweh desistiu de enviar a calamidade
  rationale: A tradução conserva a afirmação narrativa de que Yahweh interrompeu o juízo, sem sugerir que ele tivesse cometido mal moral nem explicar em excesso como essa mudança se relaciona com a natureza divina.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: uma manifestação teofânica; um anjo criado
  rationale: O versículo fornece essa designação, mas não resolve a identidade ontológica da figura. A tradução deixa abertas as interpretações teológicas possíveis.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Eira” preserva o termo agrícola bíblico preciso; “recolha a sua mão” mantém a imagem hebraica sem recorrer ao mais arcaico “detenha a mão”.
