base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: pt
  text: 'Então Davi disse ao SENHOR, ao ver o anjo ferindo o povo: “Fui eu que pequei e agi mal. Mas estas ovelhas, o que fizeram? Por favor, que a tua mão seja contra mim e contra a casa de meu pai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, em versalete, sem introduzir no corpo do texto uma vocalização discutida.
- source_word: הִנֵּה אָנֹכִי
  choice: Fui eu que
  rationale: No contexto, הִנֵּה reforça a identificação enfática de Davi como culpado; esta formulação comunica naturalmente esse contraste em português.
- source_word: הֶעֱוֵיתִי
  choice: agi mal
  rationale: Expressa a admissão de conduta perversa ou errada sem tornar a frase desnecessariamente técnica.
- source_word: הַצֹּאן
  choice: estas ovelhas
  rationale: Preserva a metáfora pastoral com que Davi se refere ao povo.
- source_word: תְּהִי נָא יָדְךָ בִּי
  choice: Por favor, que a tua mão pese contra mim
  rationale: Mantém a imagem hebraica da mão divina como instrumento de juízo, acrescentando 'pese' para produzir uma expressão portuguesa natural sem explicitar além do original.
- source_word: בְבֵית אָבִי
  choice: contra a casa de meu pai
  rationale: Conserva a expressão hebraica que pode abranger a família ou linhagem paterna, sem restringi-la interpretativamente.
theological_decisions:
- issue: Responsabilidade de Davi e sofrimento do povo
  choice: Preservar tanto a confissão enfática de Davi quanto sua pergunta sobre a culpa das 'ovelhas'.
  alternative: Explicar que o povo era inocente ou resolver a tensão com base no contexto mais amplo.
  rationale: O versículo apresenta a tensão sem oferecer aqui uma solução sistemática; a tradução não deve acrescentá-la.
- issue: A 'mão' do SENHOR
  choice: Manter a metáfora como agente do juízo divino.
  alternative: Traduzir diretamente por 'castigo' ou 'punição'.
  rationale: A imagem é teologicamente expressiva e inteligível em português, além de corresponder de perto ao hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe oral adequada à súplica de Davi. 'SENHOR' representa o tetragrama; 'Fui eu que' reproduz a ênfase contrastiva de הִנֵּה אָנֹכִי. Não há marcadores de nota porque nenhuma nota é necessária neste versículo.
