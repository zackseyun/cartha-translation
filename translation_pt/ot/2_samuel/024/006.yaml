  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: pt
  text: Chegaram a Gileade e à terra de Tahtim-Hodshi[a]. Depois chegaram a Dã-Jaã[b] e deram a volta até Sidom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica Tahtim-Hodshi é obscura. Alguns corrigem ou interpretam o texto como “a terra dos hititas em Cades”, ou de modo semelhante, mas a identificação do lugar é incerta.
    reason: alternative_reading
  - marker: b
    text: Dã-Jaã é provavelmente o nome de um lugar, cuja identificação exata é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: O wayyiqtol de בוא dá sequência ao itinerário. “Chegaram” expressa naturalmente o movimento e preserva a repetição do verbo hebraico.
- source_word: הַגִּלְעָדָה
  choice: a Gileade
  rationale: O hê direcional indica movimento em direção à região de Gileade; em português, a preposição simples comunica isso com naturalidade.
- source_word: אֶרֶץ
  choice: a terra de
  rationale: Aqui אֶרֶץ designa uma região ou território, não a terra em sentido geral.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodshi
  rationale: A expressão é textual e geograficamente obscura. A transliteração evita inserir no texto principal uma emenda conjectural.
- source_word: דָּנָה יַּעַן
  choice: Dã-Jaã
  rationale: A expressão é provavelmente um topônimo. A forma portuguesa translitera os sons consonantais e o hê direcional é expresso pelo contexto verbal de movimento.
- source_word: וְסָבִיב
  choice: e deram a volta
  rationale: סָבִיב indica movimento ao redor ou em circuito. A formulação verbal é mais natural em português do que o literal “e ao redor”.
- source_word: אֶל צִידוֹן
  choice: até Sidom
  rationale: A preposição אֶל indica direção ou destino. Depois da ideia de circuito, “até Sidom” produz uma expressão geográfica natural sem eliminar o sentido direcional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os topônimos obscuros foram transliterados, e a sintaxe concisa do itinerário foi mantida sem reproduzir construções pouco naturais em português.
