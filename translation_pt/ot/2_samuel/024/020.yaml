base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: pt
  text: Araúna olhou para fora e viu o rei e seus servos passando por ele[a]. Então Araúna saiu e se prostrou diante do rei, com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aproximando-se dele”. A expressão hebraica descreve literalmente o rei e seus servos em movimento com relação a Araúna, sem tornar inteiramente explícita a direção.
    reason: alternativa lexical decorrente da ambiguidade espacial de עֹבְרִים עָלָיו
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: olhou para fora
  rationale: O verbo sugere olhar a partir de um ponto de observação ou de uma abertura; a expressão preserva essa nuance sem acrescentar um local não indicado no texto.
- source_word: וַיַּרְא
  choice: viu
  rationale: 'Tradução direta de ראה, mantendo a progressão narrativa hebraica: Araúna primeiro olha e então vê.'
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: É a correspondência mais direta e pode incluir servidores ou acompanhantes do rei sem restringi-los a autoridades oficiais.
- source_word: עֹבְרִים עָלָיו
  choice: passando por ele
  rationale: Reproduz de modo natural o movimento expresso pelo particípio de עבר com על, sem resolver de maneira excessiva a relação espacial ambígua; a possibilidade contextual de aproximação é registrada em nota.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Tradução corrente e concisa de יצא, adequada ao ponto de vista narrativo estabelecido.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prostrou
  rationale: Expressa o gesto físico de profunda reverência sem apresentá-lo como adoração religiosa.
- source_word: אַפָּיו אָרְצָה
  choice: com o rosto em terra
  rationale: Forma portuguesa natural e digna para o idioma hebraico que descreve uma prostração completa.
- source_word: אֲרַוְנָה
  choice: Araúna
  rationale: Transliteração portuguesa corrente da forma do nome encontrada em Samuel; não se substitui pela forma Ornã da passagem paralela em Crônicas.
theological_decisions:
- issue: Natureza do gesto de Araúna diante do rei
  choice: prostração como reverência civil diante de um rei humano
  alternative: adorou o rei
  rationale: Embora o verbo hebraico também possa ser usado para adoração, o contexto descreve reverência cortesã prestada a Davi. “Se prostrou diante do rei” conserva o ato físico sem lhe atribuir caráter de culto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha a sequência narrativa do hebraico, e a nota preserva a ambiguidade espacial genuína da expressão original.
