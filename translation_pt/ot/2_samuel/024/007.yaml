base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: pt
  text: Chegaram à cidade fortificada de Tiro e a todas as cidades dos heveus e dos cananeus. Depois, saíram para o Neguebe de Judá[a], até Berseba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o sul de Judá”. A palavra hebraica pode designar tanto a região chamada Neguebe quanto, de modo mais geral, a região sul.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: a cidade fortificada de Tiro
  rationale: מִבְצַר designa um lugar fortificado. Em ligação com צֹר, “cidade fortificada de Tiro” comunica naturalmente que Tiro é a localidade fortificada, sem restringir o sentido a uma única cidadela.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: e a todas as cidades dos heveus e dos cananeus
  rationale: Os gentílicos hebraicos estão no singular coletivo, mas o plural “heveus” e “cananeus” é a forma portuguesa usual para esses povos. A preposição “a” retoma o movimento expresso por “chegaram”.
- source_word: וַיֵּצְאוּ
  choice: Depois, seguiram
  rationale: O sentido básico é “saíram”, mas, neste itinerário, o verbo introduz a etapa seguinte do percurso. “Depois, seguiram” preserva a progressão narrativa de modo natural em português.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: para o Neguebe de Judá
  rationale: נֶגֶב pode indicar tanto a região geográfica do Neguebe quanto, de modo geral, o sul. No contexto de um itinerário, o nome regional é provável; a alternativa lexical legítima é mantida em nota.
- source_word: בְּאֵר שָׁבַע
  choice: Berseba
  rationale: Forma tradicional e amplamente reconhecível em português para o topônimo hebraico.
