base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: pt
  text: 'Mas Joabe disse ao rei[a]: “Que Yahweh, seu Deus, faça o povo ser cem vezes mais numeroso do que é agora, e que os olhos de meu senhor, o rei, vejam isso. Mas por que meu senhor, o rei, deseja tal coisa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que os olhos de meu senhor, o rei, o vejam”. O hebraico não expressa o objeto de “vejam”; o sentido é que Joabe deseja que o rei viva para testemunhar esse aumento.'
    reason: O objeto de רֹאוֹת (“vejam”) é implícito no texto hebraico. A nota registra a ambiguidade formal e explica o sentido contextual sem a eliminar.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: A forma narrativa faz a cena avançar, enquanto “Mas” explicita naturalmente o contraste entre a ordem do rei e a objeção de Joabe.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְיוֹסֵף
  choice: Que ... multiplique
  rationale: O contexto confere valor volitivo à forma verbal. “Multiplique” comunica com naturalidade o desejo de aumento numérico expresso por “acrescentar” ao povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa o substantivo com sufixo masculino singular; no tratamento cortês ao rei, “seu” é natural em português.
- source_word: אֶל הָעָם
  choice: o povo
  rationale: Preserva o sentido amplo de עָם sem restringi-lo ao exército, embora o contexto seja o de um recenseamento militar.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: até que seja cem vezes mais numeroso
  rationale: Expressa em português corrente o idiomatismo hebraico de multiplicação em relação à quantidade presente.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: e que os olhos do rei, meu senhor, vejam isso
  rationale: Mantém a imagem concreta dos olhos e o valor de desejo, acrescentando “isso” como objeto exigido pelo português, embora implícito no hebraico.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Conserva a fórmula respeitosa da linguagem da corte em ordem natural para o português.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: deseja fazer tal coisa
  rationale: “Deseja” preserva a ideia de inclinação ou vontade; “fazer” explicita de modo natural que se trata da ação ordenada, sem especificá-la além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; a transliteração o preserva em vez de substituí-lo pelo título tradicional.
- issue: Natureza do aumento desejado por Joabe
  choice: Que Yahweh multiplique o povo
  alternative: Yahweh multiplicará o povo
  rationale: A construção é entendida como desejo ou bênção de Joabe, não como predição categórica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento respeitoso dirigido ao rei. A formulação conserva a repetição enfática de “o rei, meu senhor” e a imagem semítica dos olhos que veem o aumento.
