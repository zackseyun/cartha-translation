base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: pt
  text: Atravessaram o Jordão e acamparam em Aroer, à direita da cidade[c] que fica no meio do vale de Gade[b], em direção a Jazer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até Jazer». A preposição hebraica pode indicar tanto a direção para um lugar quanto o movimento até ele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «no meio da ravina de Gade» ou «no meio do leito do riacho de Gade». A palavra hebraica pode designar um vale, uma ravina ou o leito de um curso d’água sazonal.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «à direita da cidade». Alguns entendem essa indicação geograficamente como «ao sul da cidade», mas o texto mantém a expressão hebraica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: Atravessaram o Jordão
  rationale: O verbo עבר, nesta narrativa de viagem e com «o Jordão» como objeto direto, indica a travessia do rio. Em português, «atravessaram o Jordão» é claro e natural.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: e acamparam em Aroer
  rationale: חנה significa estabelecer acampamento; «acamparam» é corrente e fiel. Com nome de cidade, «em Aroer» é a formulação portuguesa natural.
- source_word: יְמִין הָעִיר
  choice: à direita da cidade
  rationale: Preserva o sentido espacial direto de ימין sem convertê-lo interpretativamente em «ao sul da cidade».
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: que fica no meio do vale de Gade
  rationale: A oração relativa descreve a cidade. נחל pode designar vale, ravina ou leito de curso d’água; «vale» oferece boa legibilidade sem eliminar as alternativas, registradas em nota.
- source_word: וְאֶל יַעְזֵר
  choice: em direção a Jazer
  rationale: אל pode indicar tanto destino quanto direção. «Em direção a» preserva a noção direcional sem afirmar que chegaram a Jazer neste versículo.
