  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: pt
  text: 'Depois de contar o povo[a], o coração de Davi o acusou[b]. Então Davi disse a Yahweh: “Pequei gravemente no que fiz. Agora, Yahweh, por favor, tira a culpa[c] do teu servo, pois agi com muita insensatez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de enumerar o povo” ou “depois de fazer o recenseamento do povo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o coração de Davi o golpeou”, expressão que indica forte convicção interior ou uma consciência ferida.'
    reason: cultural_note
  - marker: c
    text: Ou “a iniquidade”. A palavra hebraica pode indicar a iniquidade, a culpa ou, em alguns contextos, o castigo decorrente do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: o coração de Davi o acusou
  rationale: Preserva a imagem hebraica do coração agindo contra Davi, mas usa um verbo natural em português para expressar a convicção interior, evitando tanto uma formulação obscura como uma paráfrase que elimine a imagem.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: Depois de contar o povo
  rationale: Expressa com clareza a sequência temporal indicada pelo hebraico e mantém o sentido básico de סָפַר, “contar”; “fazer o recenseamento” permanece como alternativa explicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: חָטָאתִי מְאֹד
  choice: Pequei gravemente
  rationale: Mantém a confissão direta e a força do intensificador מְאֹד em português atual e solene.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: no que fiz
  rationale: Reproduz de modo conciso e natural a oração relativa que identifica a ação pecaminosa.
- source_word: הַעֲבֶר נָא
  choice: por favor, tira
  rationale: Comunica o pedido cortês e o sentido idiomático de fazer passar ou remover, sem conservar uma literalidade obscura.
- source_word: עֲוֺן עַבְדְּךָ
  choice: a culpa do teu servo
  rationale: Neste pedido após a confissão, “culpa” expressa bem o peso moral que Davi pede que seja removido, embora o termo também possa designar iniquidade ou sua consequência punitiva.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: pois agi com muita insensatez
  rationale: Representa o valor verbal de comportar-se de modo insensato e conserva a intensidade de מְאֹד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de עָוֹן no pedido de Davi
  choice: culpa
  alternative: iniquidade; castigo
  rationale: O termo hebraico abrange a perversidade, a culpa decorrente dela e, em certos contextos, o castigo. Aqui, após a confissão, “culpa” se ajusta ao pedido de remoção sem excluir em nota a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Usa “tu” na oração a Yahweh para manter uma forma reverente e coerente com “teu servo”. A imagem do coração foi preservada em formulação idiomática, e as ambiguidades de עָוֹן e סָפַר foram registradas em notas.
