  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: pt
  text: 'Nesse dia[a], Gade veio até Davi e lhe disse: “Suba e erga um altar a Yahweh[b] na eira de Araúna[c], o jebuseu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “naquele dia”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “para Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: Em Crônicas, o nome aparece como Ornã (1Crônicas 21:18).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio até
  rationale: O qal narrativo de בוא indica a chegada de Gade junto a Davi. “Veio até” é natural em português e mantém o movimento em direção a Davi sem acrescentar a ideia específica de entrar.
- source_word: בַּיּוֹם הַהוּא
  choice: Nesse dia
  rationale: Expressa com naturalidade a referência temporal definida do hebraico; a forma mais literal, “naquele dia”, é registrada em nota.
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo de עלה conserva a noção direcional de subir, adequada ao deslocamento até a eira.
- source_word: הָקֵם
  choice: erga
  rationale: O hifil imperativo de קום significa fazer ficar de pé ou estabelecer. “Erga” preserva essa imagem e é idiomático com “altar”.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente português padrão para מזבח.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica direção ou dedicação. “A Yahweh” preserva essa relação; “para Yahweh” também é possível e consta em nota.
- source_word: בְּגֹרֶן
  choice: na eira
  rationale: “Eira” é o termo português preciso para o espaço onde se debulhavam cereais; a preposição ב localiza ali o altar.
- source_word: ארניה
  choice: Araúna
  rationale: Representa em português a forma do nome preservada no relato de Samuel, distinguindo-a da forma “Ornã” usada em Crônicas.
- source_word: הַיְבֻסִי
  choice: o jebuseu
  rationale: Gentílico padrão que identifica a origem étnica de Araúna.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Eira” mantém a precisão histórica; “erga” evita a formulação mais pesada “faça levantar”. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
