base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: pt
  text: 'E Araúna disse: “Por que o rei, meu senhor, veio ao seu servo[a]?” Davi respondeu: “Para comprar de você a eira e construir um altar a Yahweh, para que cesse a praga que está sobre o povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao teu servo”. O hebraico diz literalmente “ao seu servo”, uma forma cortês de Araúna referir-se a si mesmo diante do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Interrogativo direto e natural em português, perguntando a razão da visita do rei.
- source_word: בָּא
  choice: veio
  rationale: O perfeito hebraico refere-se à chegada já ocorrida; o pretérito perfeito é idiomático no diálogo em português.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Preserva tanto o título real quanto a deferência pessoal, com ordem e pontuação naturais em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: Reproduz a forma hebraica de terceira pessoa usada por Araúna como autorreferência cortês; a nota esclarece o valor pragmático.
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: comprar de você a eira
  rationale: Expressa claramente a transação; “eira” é o termo português tradicional e preciso para o local onde se debulhavam cereais.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: construir um altar
  rationale: Mantém o infinitivo de finalidade em linguagem atual e digna.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa diretamente o nome divino יהוה e preserva a preposição ligada à dedicação do altar.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: para que a praga cesse sobre o povo
  rationale: “Para que” comunica a finalidade ou o resultado pretendido, sem garantir antecipadamente o desfecho; “cesse sobre o povo” conserva de modo natural a imagem da praga que pesa sobre ele.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” procura representar o nome próprio diretamente, sem substituí-lo por um título.
- issue: Valor de וְתֵעָצַר na explicação de Davi
  choice: para que a praga cesse
  alternative: e a praga cessará
  rationale: A construção pode apontar para o resultado esperado ou pretendido. A formulação final preserva essa orientação de finalidade sem transformar a fala em garantia categórica.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. Mantém o tom respeitoso da linguagem cortesã sem arcaísmos excessivos; emprega “eira” por sua precisão histórica e concisão.
