base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: pt
  text: 'Mas o rei disse a Araúna: “Não; eu certamente o comprarei de você por um preço. Não oferecerei a Yahweh, meu Deus, holocaustos que não me custem nada[a]”. Então Davi comprou a eira e o gado[c] por cinquenta siclos de prata[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “holocaustos de graça” ou “sem pagar”.
    reason: lexical_alternative
  - marker: b
    text: Em 1 Crônicas 21:25, Davi paga seiscentos siclos de ouro pelo local; este versículo especifica cinquenta siclos de prata pela eira e pelo gado.
    reason: cross_reference
  - marker: c
    text: Ou “os bois”. O termo hebraico pode designar coletivamente o gado ou, mais especificamente, bovinos usados no trabalho e no sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Araúna
  rationale: Translitera a forma do nome presente em Samuel, com acento gráfico para orientar a pronúncia em português; a forma Ornã pertence ao relato paralelo em Crônicas.
- source_word: קָנוֹ אֶקְנֶה
  choice: eu certamente comprarei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” transmite essa ênfase de modo natural.
- source_word: בִּמְחִיר
  choice: pelo preço
  rationale: Preserva o sentido comercial de pagamento ou preço de compra, em contraste direto com receber gratuitamente.
- source_word: אַעֲלֶה ... עֹלוֹת
  choice: oferecerei ... holocaustos
  rationale: No contexto sacrificial, o hifil de עלה significa apresentar uma oferta, e עֹלוֹת designa ofertas totalmente queimadas.
- source_word: לַיהוָה אֱלֹהַי
  choice: a Yahweh, meu Deus
  rationale: Mantém o nome divino expresso no hebraico e preserva a confissão pessoal indicada pelo sufixo de primeira pessoa.
- source_word: חִנָּם
  choice: que não me custem nada
  rationale: Expressa naturalmente a implicação contextual de algo recebido sem custo, sem perder a alternativa mais literal registrada em nota.
- source_word: הַגֹּרֶן
  choice: a eira
  rationale: “Eira” é o termo português preciso e estabelecido para o espaço onde os cereais eram debulhados.
- source_word: הַבָּקָר
  choice: o gado
  rationale: O substantivo coletivo pode indicar gado bovino em geral; evita restringir indevidamente o referente a bois de trabalho.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: por cinquenta siclos de prata
  rationale: Forma portuguesa corrente que preserva tanto o peso monetário quanto o metal usado no pagamento.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Relação entre o preço deste versículo e 1 Crônicas 21:25
  choice: Manter os cinquenta siclos de prata no texto e informar em nota a formulação distinta do paralelo
  alternative: Harmonizar os valores ou entender que ambos descrevem exatamente a mesma compra
  rationale: Samuel especifica a eira e o gado por cinquenta siclos de prata, enquanto Crônicas menciona o local por seiscentos siclos de ouro. A tradução não deve eliminar nem solucionar silenciosamente essa tensão textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Eira”, “holocaustos” e “siclos” são termos bíblicos consagrados necessários à precisão histórica; a sintaxe permanece clara e direta.
