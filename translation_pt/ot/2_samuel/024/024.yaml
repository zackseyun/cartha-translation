  source_fidelity: A tradução transmite adequadamente a ênfase de compra em קָנוֹ אֶקְנֶה, o destinatário da oferta («a Yahweh, meu Deus»), a ideia contextual de custo pessoal em חִנָּם, e o preço de cinquenta siclos de prata. «Araúna», «eira», «gado» e «holocaustos» são escolhas defensáveis e fiéis ao hebraico.
  naturalness: «Pelo preço» soa pouco natural e excessivamente definido em português, como se se referisse a um preço já estipulado. O hebraico בִּמְחִיר indica que a compra será feita mediante pagamento; «por um preço» expressa isso de forma clara e idiomática. Também se ajusta a pontuação de «Não» para refletir melhor a construção adversativa hebraica.
  terminology: «Yahweh» preserva o nome divino, conforme a decisão editorial apresentada. «Holocaustos» é o termo bíblico estabelecido para עֹלוֹת; «eira», «gado» e «siclos de prata» mantêm precisão histórica e são compreensíveis no registro proposto. As notas preservam alternativas lexicais e a diferença numérica com 1 Crônicas sem a harmonizar.
