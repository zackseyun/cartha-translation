  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: pt
  text: Ali Davi construiu um altar a Yahweh[a] e ofereceu holocaustos e ofertas de comunhão[b]. Então Yahweh acolheu a súplica em favor da terra[c], e a praga que pesava sobre Israel foi detida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” representa o nome divino YHWH.
    reason: lexical_alternative
  - marker: b
    text: Também chamadas de “ofertas pacíficas” ou “ofertas de paz”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico também pode ser traduzido: “Yahweh se deixou atender em favor da terra” ou “Yahweh respondeu favoravelmente à terra”. O verbo pressupõe uma súplica, embora ela não seja mencionada como substantivo nesta frase.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Ali ... construiu
  rationale: Expressa de modo natural o verbo narrativo e o advérbio locativo, que retoma a eira de Araúna.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: um altar a Yahweh
  rationale: “Altar” é o equivalente estabelecido, e a preposição indica que o altar é dedicado a Yahweh.
- source_word: וַיַּעַל עֹלוֹת
  choice: ofereceu holocaustos
  rationale: O verbo עלה, neste contexto sacrificial, significa oferecer; “holocaustos” é o termo português tradicional e preciso para ofertas inteiramente queimadas.
- source_word: וּשְׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica a categoria sacrificial ligada a paz, bem-estar e participação numa refeição, evitando que “ofertas pacíficas” seja entendido como ofertas feitas sem violência.
- source_word: וַיֵּעָתֵר
  choice: acolheu a súplica
  rationale: O nifal de עתר indica resposta favorável a uma súplica, embora o substantivo “súplica” esteja implícito no verbo.
- source_word: לָאָרֶץ
  choice: em favor da terra
  rationale: Preserva a relação da resposta divina com a terra sem tratar a terra literalmente como interlocutora.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: a praga que pesava sobre Israel foi detida
  rationale: Mantém a voz passiva de עצר e representa מֵעַל, literalmente “de sobre”, em português natural.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Yahweh acolheu a súplica em favor da terra
  alternative: Yahweh se deixou atender em favor da terra; Yahweh respondeu favoravelmente à terra
  rationale: Torna perceptível a ideia de súplica codificada pelo verbo, mas não identifica quem suplicou nem desenvolve além do texto a natureza da resposta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ali” retoma naturalmente o local mencionado no contexto; “acolheu a súplica” preserva o conteúdo semântico do verbo hebraico sem explicação teológica excessiva.
