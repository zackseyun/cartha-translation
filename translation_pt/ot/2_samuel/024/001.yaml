  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: pt
  text: 'Mais uma vez, a ira de Yahweh se acendeu contra Israel[a], e ele incitou Davi contra eles, dizendo: “Vá[b], conte Israel e Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Crônicas 21:1 diz que Satanás se levantou contra Israel e incitou Davi. O texto principal aqui segue o sujeito mais natural do hebraico de 2 Samuel e preserva a tensão entre os relatos, em vez de harmonizá-los.
    reason: cross_reference
  - marker: b
    text: Ou “enumere” ou “faça um recenseamento de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: Mais uma vez
  rationale: No contexto, o verbo indica a repetição da ação. “Mais uma vez” transmite de modo natural a força retomadora da expressão hebraica.
- source_word: אַף יְהוָה לַחֲרוֹת
  choice: a ira de Yahweh se acendeu
  rationale: A expressão idiomática hebraica descreve a ira como algo que se acende ou arde. Esta formulação preserva a metáfora e soa digna e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Nesta construção, a preposição indica que a ira se dirige contra Israel.
- source_word: וַיָּסֶת
  choice: ele incitou
  rationale: O verbo no hifil expressa estímulo ou provocação causativa. O pronome retoma naturalmente Yahweh, o sujeito precedente.
- source_word: בָּהֶם
  choice: contra eles
  rationale: A expressão é difícil, mas no contexto indica que Davi foi incitado contra o povo, mediante o recenseamento que resultaria em juízo. A tradução preserva essa relação sem ampliá-la.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente de introduzir o discurso direto e correspondente natural do infinitivo hebraico.
- source_word: לֵךְ
  choice: Vá
  rationale: Traduz diretamente o imperativo singular e é natural no português moderno.
- source_word: מְנֵה
  choice: conte
  rationale: O verbo significa contar ou enumerar. “Conte” é conciso e preserva a formulação do original; a ideia de realizar um recenseamento é registrada em nota.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Israel e Judá
  rationale: Mantém sem expansão os nomes das duas entidades distinguidas no texto hebraico.
theological_decisions:
- issue: Agência divina na incitação de Davi em comparação com 1 Crônicas 21:1
  choice: e ele incitou Davi
  alternative: e alguém incitou Davi; ou “Satanás incitou Davi”, por harmonização com 1 Crônicas
  rationale: O sujeito mais natural de וַיָּסֶת é Yahweh, o sujeito imediatamente anterior. A tradução mantém a tensão entre Samuel e Crônicas, sem importar para o texto uma harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do hebraico foram preservadas quando naturais; as notas registram a tensão intertextual e a alternativa lexical sem sobrecarregar o texto principal.
