base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: pt
  text: Absalão mandou chamar Aitofel, o gilonita[a], conselheiro de Davi, de sua cidade, de Gilo, enquanto Absalão oferecia os sacrifícios. A conspiração ficou forte[b], e o povo que estava com Absalão aumentava cada vez mais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “enviou Aitofel”; neste contexto, o verbo provavelmente indica que Absalão o convocou para se juntar à revolta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a trama ficou forte”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “o povo ia e se tornava numeroso com Absalão”, expressão que indica apoio em crescimento contínuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou chamar
  rationale: Com uma pessoa como objeto e no contexto do recrutamento para a revolta, a expressão comunica naturalmente que Absalão enviou alguém para convocar Aitofel.
- source_word: הַגִּילֹנִי
  choice: o gilonita
  rationale: Preserva o gentílico derivado de Gilo e sua função de identificar Aitofel.
- source_word: יוֹעֵץ דָּוִד
  choice: conselheiro de Davi
  rationale: Expressa de modo direto a relação de Aitofel com Davi e mantém o sentido político de sua função.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: de sua cidade, de Gilo
  rationale: Mantém os dois elementos do hebraico — o substantivo geral e o nome do lugar — sem eliminar a repetição explicativa.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: enquanto oferecia os sacrifícios
  rationale: A preposição com o infinitivo indica simultaneidade; a formulação é natural em português e conserva o sentido cultual.
- source_word: הַקֶּשֶׁר
  choice: a conspiração
  rationale: No contexto da revolta organizada de Absalão, designa adequadamente uma ação política coordenada contra o rei.
- source_word: אַמִּץ
  choice: se fortalecia
  rationale: Em combinação com וַיְהִי, comunica o desenvolvimento progressivo da conspiração, em vez de apenas um estado estático.
- source_word: הוֹלֵךְ וָרָב
  choice: aumentava cada vez mais
  rationale: Reproduz de maneira idiomática a força durativa e progressiva da construção hebraica.
- source_word: הָעָם
  choice: o número dos que
  rationale: No contexto, הָעָם refere-se coletivamente às pessoas que aderiam a Absalão; a formulação deixa explícito que o crescimento era do grupo de apoiadores sem acrescentar uma identificação partidária mais forte que o texto.
- source_word: אֶת אַבְשָׁלוֹם
  choice: estavam com Absalão
  rationale: Aqui אֶת exprime associação; 'com Absalão' preserva a formulação e sugere alinhamento sem tornar explícito além do necessário.
