  text: וַ/יָּבֹא֙ הַ/מַּגִּ֔יד אֶל דָּוִ֖ד לֵ/אמֹ֑ר הָיָ֛ה לֶב אִ֥ישׁ יִשְׂרָאֵ֖ל אַחֲרֵ֥י אַבְשָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: pt
  text: 'Então um mensageiro veio a Davi e disse: “O coração dos homens de Israel está com Absalão”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “o coração dos homens de Israel está atrás de Absalão”; expressão que indica que sua lealdade ou seu apoio passou para ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O wayyiqtol de בוא dá continuidade à narrativa com uma ação passada simples; “veio” é a forma natural no contexto.
- source_word: הַמַּגִּיד
  choice: um mensageiro
  rationale: O particípio hifil de נגד designa aquele que traz uma notícia ou relato. Embora tenha artigo em hebraico, o português introduz naturalmente esse participante como “um mensageiro”.
- source_word: לֵאמֹר
  choice: e disse
  rationale: O infinitivo construto introduz o discurso direto. “E disse” reproduz sua função em português corrente com mais naturalidade do que “dizendo”.
- source_word: הָיָה לֶב
  choice: O coração ... está com
  rationale: “Coração” representa a disposição interior, vontade ou lealdade. Mantém-se o singular coletivo do hebraico, enquanto “está com” comunica de modo claro a ideia de apoio político.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: אִישׁ, embora singular na forma, tem sentido coletivo. “Os homens de Israel” preserva a expressão masculina e seu provável contexto político e militar.
- source_word: אַחֲרֵי
  choice: com
  rationale: Literalmente “atrás de” ou “depois de”, mas neste contexto indica seguir alguém e lhe dar lealdade; “com” expressa essa filiação política em português natural.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
