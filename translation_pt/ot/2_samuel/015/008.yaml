source:
  edition: WLC
  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: pt
  text: 'Pois o teu servo fez um voto enquanto morava em Gesur, em Arã, dizendo: “Se Yahweh de fato me trouxer de volta a Jerusalém,[a] então servirei a Yahweh”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico reforça a ideia de retorno por meio da repetição enfática do verbo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “então adorarei a Yahweh”. O verbo hebraico também pode se referir ao serviço prestado a Deus em adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: fez um voto
  rationale: A construção cognata hebraica, literalmente «votou um voto», é idiomática e enfática; «fez um voto» comunica seu sentido em português natural.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: É uma forma convencional de autodesignação respeitosa perante o rei; «servo» preserva o registro cortesão sem acentuar indevidamente a ideia de escravidão.
- source_word: בְּשִׁבְתִּי
  choice: enquanto morava
  rationale: O infinitivo com preposição situa o voto durante a permanência de Absalão em Gesur; «enquanto morava» é claro e mantém o aspecto durativo.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: em Gesur, em Arã
  rationale: Mantém de modo direto a localização dupla expressa no hebraico, sem definir além do texto a relação política ou geográfica entre Gesur e Arã.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: Se Yahweh de fato me trouxer de volta
  rationale: A repetição enfática do verbo שוב é representada por «de fato», e o causativo é expresso naturalmente por «me trouxer de volta».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: então servirei a Yahweh
  rationale: «Servirei» preserva a amplitude de עבד, que neste contexto pode incluir serviço cultual; «então» torna natural em português a consequência da condição.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de עבד em relação a Deus
  choice: servirei
  alternative: adorarei
  rationale: «Servir» mantém a amplitude semântica do verbo e não restringe o voto exclusivamente a atos de culto, embora estes possam estar incluídos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala mantém a deferência cortesã de «o teu servo». A tradução evita o literalismo pouco natural «votou um voto», preserva a ênfase verbal em nota e conserva a possível dimensão cultual de «servir» sem torná-la exclusiva.
