  text: וְ/כָל עֲבָדָי/ו֙ עֹבְרִ֣ים עַל יָד֔/וֹ וְ/כָל הַ/כְּרֵתִ֖י וְ/כָל הַ/פְּלֵתִ֑י וְ/כָֽל הַ/גִּתִּ֞ים שֵׁשׁ מֵא֣וֹת אִ֗ישׁ אֲשֶׁר בָּ֤אוּ בְ/רַגְל/וֹ֙ מִ/גַּ֔ת עֹבְרִ֖ים עַל פְּנֵ֥י הַ/מֶּֽלֶךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: pt
  text: Todos os seus servos passavam ao lado dele. Todos os queretitas, todos os peletitas e todos os geteus — seiscentos homens que tinham vindo a pé com ele desde Gate[a] — passavam diante do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que o tinham acompanhado desde Gate”. O hebraico diz literalmente “que tinham vindo com o pé dele desde Gate”, expressão que pode indicar acompanhar alguém em seu séquito ou a pé.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד pode designar servos, subordinados ou oficiais reais. “Servos” preserva o sentido básico sem especificar uma função que o contexto não explicita.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: passavam ao lado dele
  rationale: A expressão עַל יָד indica posição junto de alguém, “ao lado de”. A formulação é natural em português e conserva a dimensão espacial.
- source_word: הַכְּרֵתִי
  choice: os queretitas
  rationale: Trata-se da designação de um grupo a serviço de Davi; a transliteração tradicional evita uma tradução interpretativa.
- source_word: הַפְּלֵתִי
  choice: os peletitas
  rationale: Como designação própria de um grupo, o termo é transliterado de forma corrente em português.
- source_word: הַגִּתִּים
  choice: os geteus
  rationale: O gentílico designa pessoas de Gate. “Geteus” é a forma portuguesa tradicional e compacta.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: seiscentos homens
  rationale: אִישׁ funciona aqui como termo de contagem para homens adultos. “Soldados” tornaria explícita uma função militar apenas sugerida pelo contexto.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: que tinham vindo a pé com ele desde Gate[a]
  rationale: A expressão literalmente relacionada a “seu pé” pode indicar acompanhamento a pé ou no séquito de alguém. A tradução mantém a imagem concreta, enquanto a nota registra a alternativa idiomática.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: passavam diante do rei
  rationale: עַל פְּנֵי significa aqui “diante de” ou “na frente de”, adequado à cena de uma comitiva em movimento.
