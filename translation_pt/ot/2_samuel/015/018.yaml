  source_fidelity: 'O texto traduz adequadamente a estrutura e os principais termos do hebraico: os servos passam ao lado de Davi, seguem-se queretitas, peletitas e geteus, e a comitiva passa diante do rei. “Seiscentos homens” preserva o termo de contagem sem acrescentar indevidamente “soldados”. A formulação “a pé com ele desde Gate” representa de modo aceitável a expressão idiomática בְּרַגְלוֹ, cuja alternativa está devidamente registrada na nota.'
