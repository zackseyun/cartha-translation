base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: pt
  text: 'Então Absalão lhe dizia: “Veja, a sua causa é boa e justa, mas não há ninguém da parte do rei para ouvir você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Então Absalão lhe dizia
  rationale: O waw consecutivo dá continuidade à narrativa. Pelo contexto iterativo dos versículos 2–6, o imperfeito português “dizia” expressa naturalmente a ação habitual de Absalão com cada pessoa que se aproximava.
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo funciona como chamamento à atenção. “Veja” é atual, natural e preserva o apelo direto.
- source_word: דְבָרֶךָ
  choice: a sua causa
  rationale: Embora דָּבָר possa significar “palavra” ou “assunto”, o contexto judicial favorece “causa”, isto é, o caso levado ao rei para julgamento.
- source_word: טוֹבִים וּנְכֹחִים
  choice: boa e justa
  rationale: Os adjetivos plurais concordam em hebraico com דְבָרֶךָ, mas em português “causa” pede o singular. “Boa e justa” mantém a avaliação ampla de טוֹב e a ideia de retidão ou correção de נָכוֹחַ.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: mas não há ninguém da parte do rei para ouvir você
  rationale: A construção significa literalmente que não existe para o requerente um “ouvinte” vindo da parte do rei. “Da parte do rei” conserva a ideia de origem ou comissão régia sem acrescentar explicitamente que se trata de um oficial nomeado; “ouvir” mantém a nuance judicial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva a fala persuasiva de Absalão e a ambiguidade moderada de “ouvir”, que no contexto significa apreciar judicialmente a causa. Não se julgou necessária nota de rodapé, pois “causa” comunica diretamente o sentido forense e “da parte do rei” preserva a estrutura semântica do hebraico.
