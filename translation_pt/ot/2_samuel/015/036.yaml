  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: pt
  text: 'Vejam: os dois filhos deles estão ali com eles: Aimaás, filho de Zadoque, e Jônatas, filho de Abiatar. Por meio deles[a], vocês me enviarão tudo o que ouvirem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pela mão deles”, expressão que indica agência ou transmissão.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “cada assunto que ouvirem” ou “cada notícia que receberem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: A forma chama enfaticamente a atenção dos dois sacerdotes; “Vejam” é natural em português atual e preserva a força dêitica.
- source_word: שָׁם עִמָּם
  choice: estão ali com eles
  rationale: Expressa tanto a localização indicada por שָׁם quanto a companhia indicada por עִמָּם.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: os dois filhos deles
  rationale: Traduz diretamente a construção, retomando Zadoque e Abiatar como os pais.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Aimaás, filho de Zadoque, e Jônatas, filho de Abiatar
  rationale: O לְ indica aqui a relação de pertencimento ou filiação; explicitar “filho de” evita uma formulação obscura em português e é confirmado pelo contexto imediato.
- source_word: וּשְׁלַחְתֶּם
  choice: vocês me enviarão
  rationale: No contexto instrutivo, a forma verbal tem força diretiva; o futuro português conserva a instrução firme sem soar excessivamente jurídico.
- source_word: בְּיָדָם
  choice: por meio deles
  rationale: O hebraico diz literalmente “pela mão deles”, expressão idiomática de agência ou transmissão; a tradução comunica naturalmente a função de mensageiros.
- source_word: כָּל דָּבָר
  choice: tudo
  rationale: דָּבָר abrange palavra, assunto ou informação. “Tudo” mantém essa amplitude no contexto de transmissão de notícias.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: o que ouvirem
  rationale: Preserva o sentido lexical de שׁמע e, com o futuro do subjuntivo, soa natural para informações que ainda serão recebidas.
