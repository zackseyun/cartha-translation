  terminology: «Zadoque», «Abiatar», «levitas», «arca da aliança de Deus» e «povo» são adequados e consistentes. A nota c, porém, contém a formulação pouco natural e semanticamente imprecisa «veio para cima»; a alternativa portuguesa adequada para a possibilidade narrativa é «veio subindo» ou, mais simplesmente, «veio».
