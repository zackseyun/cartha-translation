base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: pt
  text: E eis que também veio Zadoque, acompanhado de todos os levitas que carregavam a arca da aliança de Deus. Eles colocaram a arca de Deus[b], e Abiatar subiu[c], até que todo o povo terminou de sair da cidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Jerusalém.
    reason: cross_reference
  - marker: b
    text: 'Ou: «pousaram a arca de Deus». O verbo hebraico pode indicar que a colocaram ou que a posicionaram ali.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «Abiatar veio subindo». O hebraico diz literalmente «subiu», e a nuance narrativa exata é incerta.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Introduz vividamente uma nova cena e chama a atenção do leitor; a expressão é digna e ainda reconhecível no português bíblico atual.
- source_word: גַם צָדוֹק
  choice: também veio Zadoque
  rationale: גַם tem valor aditivo. O verbo «veio» é suprido pelo contexto narrativo, como exige a fluência em português.
- source_word: וְכָל הַלְוִיִּם אִתּוֹ
  choice: acompanhado de todos os levitas
  rationale: Expressa naturalmente que os levitas estavam com Zadoque, sem alterar o referente mais provável de אִתּוֹ.
- source_word: נֹשְׂאִים
  choice: que carregavam
  rationale: O particípio descreve a ação em curso dos levitas; «carregavam» é claro e corrente.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: a arca da aliança de Deus
  rationale: Preserva a cadeia de construto e a terminologia bíblica convencional sem paráfrase doutrinária.
- source_word: וַיַּצִּקוּ
  choice: Eles pousaram
  rationale: No contexto, indica colocar a arca no chão ou em determinada posição. «Pousaram» comunica essa ação com naturalidade; a amplitude lexical é indicada em nota.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: e Abiatar subiu
  rationale: Mantém o sentido básico de movimento ascendente de עלה e não adota a interpretação não explícita de que Abiatar ofereceu sacrifícios.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: até que todo o povo terminou de sair
  rationale: Converte a expressão temporal em oração portuguesa idiomática. Diante de «da cidade», «sair» expressa claramente a passagem para fora sem acrescentar um objeto geográfico não mencionado.
- source_word: מִן הָעִיר
  choice: da cidade
  rationale: Mantém a formulação genérica do hebraico; Jerusalém é identificada apenas em nota contextual.
theological_decisions:
- issue: Referente de «a cidade»
  choice: Manter «da cidade» no texto principal
  alternative: Explicitar «de Jerusalém»
  rationale: O contexto aponta para Jerusalém, mas o hebraico traz apenas «a cidade». A tradução conserva o texto e deixa a identificação contextual para a nota.
- issue: Sentido de וַיַּעַל אֶבְיָתָר
  choice: «Abiatar subiu»
  alternative: «Abiatar veio para cima» ou «Abiatar ofereceu sacrifícios»
  rationale: A forma de עלה denota primariamente subida. Como a nuance narrativa exata é incerta, não se deve resolver a tensão por interpretação sacerdotal.
- issue: Ação expressa por וַיַּצִּקוּ
  choice: «pousaram»
  alternative: «colocaram» ou «posicionaram»
  rationale: O contexto favorece a colocação da arca, mas a formulação não especifica com precisão se foi posta no chão ou posicionada em algum lugar; a nota preserva essa margem.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem das notas foi normalizada para acompanhar sua ocorrência no texto. «E eis que» preserva o marcador discursivo sem recorrer a uma paráfrase coloquial; «pousaram» e «subiu» mantêm as ambiguidades relevantes.
