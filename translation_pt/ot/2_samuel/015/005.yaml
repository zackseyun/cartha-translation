id: 2SA.15.5
reference: 2 Samuel 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: pt
  text: E, sempre que um homem se aproximava para se curvar diante dele[a], Absalão estendia a mão, segurava-o e o beijava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para lhe prestar homenagem”. O verbo hebraico pode indicar um gesto de reverência respeitosa, não necessariamente adoração em sentido estritamente religioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sempre que... Absalão...
  rationale: A construção introduz uma ação habitual e repetida; “sempre que” expressa isso naturalmente em português.
- source_word: בִּקְרָב אִישׁ
  choice: um homem se aproximava
  rationale: Preserva o substantivo masculino singular e o movimento de aproximação.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: para se curvar diante dele
  rationale: Comunica o gesto corporal de reverência sem necessariamente lhe atribuir sentido de culto religioso.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: Absalão estendia a mão
  rationale: A expressão hebraica significa estender a mão. O nome “Absalão”, recuperado do contexto, esclarece naturalmente o sujeito dos verbos em português.
- source_word: וְהֶחֱזִיק לוֹ
  choice: segurava-o
  rationale: Expressa tomar alguém pela mão ou corpo, sem a força excessiva que “agarrava-o” ou “apoderava-se dele” poderia sugerir.
- source_word: וְנָשַׁק לוֹ
  choice: e o beijava
  rationale: Tradução direta do verbo hebraico, mantendo o gesto social e político sem explicá-lo dentro do texto.
theological_decisions:
- issue: Natureza do gesto expresso por השתחוה
  choice: se curvar diante dele
  alternative: prestar-lhe homenagem
  rationale: O contexto indica reverência social ou política, mas o verbo descreve um gesto que também pode ocorrer em contextos religiosos. A tradução mantém o gesto concreto, e a nota esclarece sua amplitude sem transformar o ato em adoração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção habitual foi preservada. O nome “Absalão” foi explicitado para evitar ambiguidade pronominal e produzir uma sequência natural em português.
