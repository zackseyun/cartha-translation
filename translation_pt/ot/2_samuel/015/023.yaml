base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: pt
  text: Toda a terra chorava em voz alta[a], enquanto todo o povo atravessava. O rei também atravessou o vale do Cedrom[b], e todo o povo atravessava em direção ao caminho do deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «chorava com grande voz».
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, «ribeiro de Cedrom». A palavra hebraica נַחַל pode designar um vale, uma ravina, um uádi ou um curso de água sazonal.
    reason: cultural_note
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: toda a terra
  rationale: Preserva a expressão coletiva hebraica, que aqui abrange a região e seus habitantes, sem ampliar o sentido para o mundo inteiro.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: chorava em alta voz
  rationale: Reproduz a imagem hebraica de um lamento audível e intenso; o singular concorda naturalmente com o sujeito coletivo «toda a terra».
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: עָם designa aqui, de modo abrangente, o grupo que acompanhava Davi, não apenas os soldados.
- source_word: עֹבְרִים / עֹבֵר
  choice: atravessava / atravessou
  rationale: O verbo עבר indica a travessia de um limite ou curso de vale. O imperfeito descritivo em português expressa a ação contínua do povo, enquanto o pretérito perfeito destaca a travessia do rei.
- source_word: בְּנַחַל קִדְרוֹן
  choice: o vale do Cedrom
  rationale: נַחַל pode indicar um vale, ravina, uádi ou curso de água sazonal. «Vale do Cedrom» é claro e topograficamente apropriado em português moderno.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: seguia pela estrada em direção ao deserto
  rationale: A construção hebraica é condensada e pode indicar movimento ao longo de uma rota voltada para o deserto. Esta formulação comunica o sentido provável sem especificar mais do que o texto permite.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com fluidez narrativa e preservação das imagens centrais do hebraico. A repetição de «todo o povo» acompanha a ênfase do original; «seguia» evita uma repetição pouco natural de «atravessava» quando o último segmento descreve a continuação pela rota do deserto.
