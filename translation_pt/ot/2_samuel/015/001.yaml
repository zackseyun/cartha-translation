  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: pt
  text: Depois disso, Absalão providenciou[a] para si um carro e cavalos, e cinquenta homens que corriam à sua frente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fez para si» ou «adquiriu para si». O verbo hebraico pode significar fazer, obter ou providenciar.'
    reason: lexical_alternative
  - marker: b
    text: Os cinquenta homens que corriam à frente dele formavam um séquito ao estilo real, sinalizando a exaltação pública de Absalão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa de modo natural a fórmula narrativa hebraica e mantém a ligação temporal com os acontecimentos anteriores.
- source_word: וַיַּעַשׂ לוֹ
  choice: providenciou para si
  rationale: O verbo עשה com לו pode indicar fazer, obter ou providenciar algo para si. No contexto de carro, cavalos e séquito, «providenciou para si» comunica a aquisição ou preparação sem sugerir que Absalão os fabricou pessoalmente.
- source_word: אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶרְכָּבָה
  choice: um carro
  rationale: O substantivo designa um carro puxado por cavalos. «Carro» conserva a formulação histórica tradicional sem inserir no texto principal a interpretação de que fosse explicitamente régio ou militar.
- source_word: וְסֻסִים
  choice: e cavalos
  rationale: Reproduz de forma direta a coordenação hebraica.
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: além de cinquenta homens
  rationale: A expressão hebraica conta cinquenta homens. «Além de» torna natural em português a continuação da lista sem alterar seu conteúdo.
- source_word: רָצִים
  choice: que corriam
  rationale: A forma participial descreve a ação ou função contínua desses homens; a oração relativa soa clara e natural em português.
- source_word: לְפָנָיו
  choice: à sua frente
  rationale: Indica que os homens avançavam diante de Absalão como parte de seu cortejo público.
theological_decisions:
- issue: Simbolismo político do séquito de Absalão
  choice: Descrever literalmente o carro, os cavalos e os cinquenta homens, deixando implícita no texto principal a pretensão régia.
  alternative: Explicitar que Absalão organizou para si um cortejo de aparência real.
  rationale: O conjunto sugere exaltação pública e ambição régia, mas o hebraico relata os elementos do cortejo sem declarar expressamente essa intenção. A nota oferece o contexto cultural sem transformar a inferência em afirmação textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva a sequência narrativa e o caráter descritivo do hebraico, sem explicitar no corpo do versículo a interpretação política sugerida pelo cortejo.
