  to: Você chegou apenas ontem; será que hoje devo fazer você vagar conosco, enquanto vou para onde quer que eu vá? Volte e leve seus irmãos de volta com você.[a] Que o amor leal e a fidelidade estejam com você.[b]
  rationale: A revisão melhora a naturalidade e o registro sem alterar o sentido. Ela conserva a incerteza deliberada da expressão hebraica relativa ao destino de Davi, o caráter causativo do verbo dirigido a Itai e a abertura da fórmula final de bênção.
