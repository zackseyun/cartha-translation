  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: pt
  text: Você chegou apenas ontem; será que hoje devo fazer você vagar conosco, enquanto vou para onde quer que eu vá? Volte e leve seus irmãos de volta com você.[a] Que o amor leal e a fidelidade estejam com você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seus irmãos” provavelmente se refere aos companheiros ou parentes de Itai que vieram com ele.
    reason: cultural_note
  - marker: b
    text: O hebraico traz literalmente “amor leal e fidelidade”, sem verbo explícito; a frase é entendida aqui como uma bênção de despedida.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Você chegou apenas ontem
  rationale: O infinitivo com sufixo é expresso naturalmente como oração finita; “apenas” explicita a ênfase contextual na chegada muito recente de Itai.
- source_word: אֲנוּעֲךָ
  choice: deveria fazer você andar errante
  rationale: Preserva tanto a nuance causativa quanto a ideia de deslocamento instável e sem rumo durante a fuga.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: enquanto eu vou sabe-se lá para onde
  rationale: A expressão hebraica é elíptica e repete o verbo “ir”; esta formulação portuguesa comunica de modo natural a incerteza do destino de Davi sem transformá-la em necessidade ou permissão.
- source_word: שׁוּב וְהָשֵׁב
  choice: Volte e leve consigo
  rationale: Distingue o imperativo simples “volte” da forma causativa, entendida contextualmente como levar os demais de volta.
- source_word: אַחֶיךָ
  choice: os seus irmãos
  rationale: Mantém o termo de parentesco literal, embora no contexto possa designar companheiros ou membros do grupo de Itai.
- source_word: חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  rationale: Reproduz a combinação tradicional de lealdade amorosa e confiabilidade, evitando restringi-la explicitamente a uma formulação confessional de aliança.
theological_decisions:
- issue: Força da expressão nominal final חֶסֶד וֶאֱמֶת
  choice: Que o amor leal e a fidelidade estejam com você
  alternative: amor leal e fidelidade
  rationale: O hebraico não traz verbo explícito. O contexto favorece uma bênção ou despedida, mas a tradução não identifica expressamente Deus como sujeito, preservando a concisão e a abertura do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Sabe-se lá para onde” comunica a incerteza da fuga em linguagem corrente sem perder a gravidade do discurso; “andar errante” conserva a instabilidade expressa pelo verbo hebraico.
