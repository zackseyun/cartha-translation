    issue: “andar errante”
    rationale: A expressão soa pouco natural em português moderno; “vagar” expressa com maior clareza e fluência o deslocamento instável de נוע.
  - severity: low
    issue: “sabe-se lá para onde”
    rationale: É uma formulação coloquial que destoa do tom do discurso. Uma formulação mais sóbria pode preservar a elipse e a incerteza sem acrescentar essa coloração idiomática.
  - severity: low
    issue: “leve consigo os seus irmãos”
    rationale: Embora compreensível, a construção é mais pesada e não torna explícito “de volta”, aspecto contextual do causativo de שוב. “Leve seus irmãos de volta com você” é mais idiomático e completo.
