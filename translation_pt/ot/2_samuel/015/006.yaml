base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: pt
  text: Absalão fazia isso a todos os israelitas que vinham ao rei para obter julgamento, e Absalão roubava o coração dos homens de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conquistava a lealdade dos homens de Israel”. O hebraico diz literalmente “roubava o coração”, imagem que sugere ganhar apoio de modo furtivo ou manipulador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  choice: fazia isso
  rationale: O imperfeito consecutivo dentro do relato resume uma conduta habitual descrita anteriormente. “Fazia isso” retoma essa prática com naturalidade e preserva a referência anafórica do hebraico.
- source_word: לְכָל יִשְׂרָאֵל
  choice: com todos os israelitas
  rationale: Neste contexto, לְ marca as pessoas com quem Absalão agia. “Todos os israelitas” é mais natural em português que “todo Israel” quando seguido de oração relativa referente a indivíduos.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: que vinham
  rationale: O imperfeito descreve ação costumeira no passado; “vinham” comunica adequadamente a repetição.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: ao rei em busca de uma decisão judicial
  rationale: מִשְׁפָּט designa aqui julgamento, causa ou decisão no âmbito jurídico. A formulação explicita o propósito sem confundi-lo com condenação moral.
- source_word: וַיְגַנֵּב
  choice: roubava
  rationale: Preserva a metáfora forte de גנב e, pelo aspecto habitual do contexto, apresenta a conquista furtiva e manipuladora da lealdade como processo repetido.
- source_word: אֶת לֵב
  choice: o coração
  rationale: Mantém o singular coletivo do hebraico e a expressão metafórica, ainda compreensível em português.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Reproduz a forma masculina explícita אַנְשֵׁי, sem decidir silenciosamente se ela representa toda a população.
theological_decisions:
- issue: Alcance da expressão masculina אַנְשֵׁי יִשְׂרָאֵל
  choice: os homens de Israel
  alternative: o povo de Israel / os israelitas
  rationale: Embora a expressão possa funcionar de modo representativo para a população, o texto emprega literalmente “homens de Israel”. A tradução conserva essa forma e não resolve além da evidência textual.
- issue: Sentido de “roubar o coração”
  choice: preservar a metáfora no texto principal
  alternative: conquistar a lealdade / ganhar o apoio
  rationale: A metáfora hebraica sugere obtenção furtiva ou manipuladora de lealdade. Mantê-la conserva a avaliação implícita do narrador, enquanto a nota esclarece o sentido idiomático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula liga a prática judicial de Absalão ao seu efeito político. A metáfora hebraica é mantida, e o esclarecimento aparece em nota.
