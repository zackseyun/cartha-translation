source:
  edition: WLC
  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: pt
  text: Quando Davi chegou ao topo[a], onde adorava a Deus, eis que Husai, o arquita, veio ao seu encontro, com a túnica rasgada e terra sobre a cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde costumava adorar a Deus”; o verbo hebraico pode indicar uma ação habitual ou uma ação passada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: o topo
  rationale: Literalmente “a cabeça”; neste contexto topográfico, designa o ponto mais alto. “O topo” é claro e natural em português.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: onde adorava a Deus
  rationale: O verbo no imperfeito pode indicar ação habitual ou ação passada em curso/contextual. A forma portuguesa “adorava” conserva essa abertura melhor que uma formulação explicitamente habitual; “adorar” comunica naturalmente o ato de prostrar-se diante de Deus.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a vivacidade do marcador narrativo hebraico e destaca o aparecimento inesperado de Husai, em registro digno e compreensível.
- source_word: לִקְרָאתוֹ
  choice: veio ao seu encontro
  rationale: Expressa de modo natural o movimento em direção a Davi para encontrá-lo, suprindo o verbo exigido pelo português a partir do contexto.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, o arquita
  rationale: Translitera o nome pessoal segundo uso português e verte o gentílico com a forma tradicional e inteligível “arquita”.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: com a túnica rasgada
  rationale: כֻּתֹּנֶת designa uma peça de roupa semelhante a uma túnica; a formulação mantém o estado resultante indicado pelo particípio/adjetivo.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: e terra sobre a cabeça
  rationale: אֲדָמָה significa terra ou solo. A tradução preserva o termo concreto e o gesto de luto sem substituí-lo pelo mais específico “pó”.
theological_decisions:
- issue: Aspecto de יִשְׁתַּחֲוֶה
  choice: onde adorava a Deus
  alternative: onde costumava adorar a Deus; onde adorou a Deus
  rationale: O imperfeito hebraico admite leitura habitual, mas não obriga a explicitá-la. “Adorava” preserva a ambiguidade entre ação costumeira e ação passada contextual.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. “Eis que” foi mantido por sua função narrativa enfática; “terra sobre a cabeça” conserva a imagem cultural concreta do luto.
