base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: pt
  text: Então o rei saiu, seguido a pé por toda a sua casa[a]; e o rei deixou dez mulheres, concubinas, para guardarem a casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «com toda a sua casa a seus pés». A expressão hebraica indica que a casa do rei o acompanhava a pé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא no consecutivo narrativo indica a partida concreta do rei; “saiu” conserva o movimento sem acrescentar uma ideia de abandono.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do título definido; preserva a forma do hebraico, que não menciona Davi pelo nome neste versículo.
- source_word: וְכָל בֵּיתוֹ
  choice: e toda a sua casa
  rationale: Aqui בַּיִת designa as pessoas ligadas à casa real. “Toda a sua casa” é uma expressão bíblica clara em português e mantém a repetição lexical com “casa” no fim do versículo, embora ali o referente seja a residência.
- source_word: בְּרַגְלָיו
  choice: o seguiu a pé
  rationale: A expressão significa literalmente “aos seus pés”, mas no contexto comunica que os membros da casa real foram atrás do rei caminhando. A formulação explicita naturalmente tanto o seguimento quanto o deslocamento a pé.
- source_word: וַיַּעֲזֹב
  choice: deixou
  rationale: עזב indica que as mulheres ficaram para trás. “Deixou” evita a força emocional indevida de “abandonou”.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: dez mulheres, concubinas
  rationale: Mantém os dois substantivos hebraicos em aposição, sem reduzir a expressão simplesmente a “dez concubinas”.
- source_word: לִשְׁמֹר
  choice: para cuidarem
  rationale: שׁמר abrange guardar, vigiar e conservar. Neste contexto doméstico, “cuidarem” comunica de modo natural a responsabilidade de zelar pela residência, sem limitar a tarefa à vigilância militar.
- source_word: הַבָּיִת
  choice: da casa
  rationale: No final do versículo, בַּיִת se refere à residência real. “Casa” preserva o termo hebraico e evita tornar explícito “palácio”, que é contextualmente possível, mas mais interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação foi ajustada para soar natural, e “porém” sinaliza a mudança entre a saída da casa real e a permanência das concubinas. Não foi necessária nota de rodapé, pois o sentido idiomático de בְּרַגְלָיו foi incorporado com clareza ao texto.
