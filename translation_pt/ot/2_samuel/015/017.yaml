base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: pt
  text: O rei saiu, e todo o povo o seguiu. Eles pararam na casa mais distante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, talvez, num lugar chamado “Bete-Merhaque”. A expressão hebraica pode significar “casa da distância” ou “casa do afastamento”, mas muitos a entendem descritivamente como “a última casa”.
    reason: Preserva a possibilidade de a expressão hebraica ser um nome de lugar e registra a alternativa descritiva tradicional.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal narrativo de יצא indica sair ou partir; “saiu” é direto e natural no contexto.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Substantivo definido que, no contexto, se refere a Davi.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם designa o grupo que acompanhava o rei; “povo” preserva a abrangência do termo sem restringi-lo às tropas.
- source_word: בְּרַגְלָיו
  choice: o acompanhou a pé
  rationale: A expressão, literalmente relacionada aos “pés” do rei, indica acompanhamento em seu séquito e provavelmente deslocamento a pé. A formulação portuguesa comunica ambos os aspectos com naturalidade.
- source_word: וַיַּעַמְדוּ
  choice: eles pararam
  rationale: Embora עמד tenha o sentido básico de “ficar de pé”, numa narrativa de deslocamento pode indicar parar ou tomar posição.
- source_word: בֵּית הַמֶּרְחָק
  choice: a casa distante
  rationale: Mantém de modo relativamente formal o sentido lexical de “casa da distância/do afastamento”, sem decidir silenciosamente entre a descrição de uma casa afastada e um possível nome de lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção foi dividida em duas frases para evitar coordenação pesada, sem alterar a sequência narrativa. “Casa distante” conserva a ambiguidade do hebraico, esclarecida na nota.
