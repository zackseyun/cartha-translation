base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: pt
  text: 'Vejam: ficarei esperando[b] nos vaus do deserto[a], até que chegue uma mensagem de vocês para me informar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas passagens do deserto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “vou me demorar” ou “permanecerei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Vejam
  rationale: Imperativo plural usado para chamar a atenção; “Vejam” mantém a força direta e se dirige naturalmente a mais de uma pessoa.
- source_word: אָנֹכִי
  choice: eu (implícito na forma verbal)
  rationale: O pronome independente dá ênfase ao sujeito. Em português, essa ênfase é suficientemente perceptível pelo contexto e pela declaração pessoal, sem exigir uma formulação pesada como “eu mesmo”.
- source_word: מִתְמַהְמֵהַּ
  choice: ficarei esperando
  rationale: O particípio hitpael expressa demora ou permanência intencional. No contexto, Davi permanecerá no lugar à espera de notícias; “ficarei esperando” comunica essa função em português natural, sem eliminar a alternativa lexical indicada em nota.
- source_word: בְּעַבְרוֹת
  choice: nos vaus
  rationale: O plural designa lugares de travessia, especialmente pontos rasos para atravessar um rio. “Vaus” é preciso e conciso; “passagens” é mantido como alternativa em nota.
- source_word: הַמִּדְבָּר
  choice: do deserto
  rationale: מִדְבָּר indica região erma ou território não cultivado. “Deserto” é claro e corrente em português bíblico moderno, sem necessariamente implicar apenas dunas de areia.
- source_word: עַד בּוֹא דָבָר
  choice: até que chegue uma mensagem
  rationale: דָבָר, neste contexto, é uma comunicação ou notícia. “Mensagem” torna explícito o sentido contextual e preserva a construção concisa de algo que chega.
- source_word: מֵעִמָּכֶם
  choice: de vocês
  rationale: A expressão preposicional indica que a mensagem se origina nos interlocutores; “de vocês” é a equivalência natural e amplamente compreensível.
- source_word: לְהַגִּיד לִי
  choice: para me informar
  rationale: O infinitivo hifil de נגד significa fazer saber ou comunicar. “Para me informar” preserva a finalidade expressa no hebraico e se ajusta ao contexto de mensageiros.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais como “vocês”. A tradução mantém a ordem lógica do hebraico, mas posiciona os marcadores junto às expressões a que se referem.
