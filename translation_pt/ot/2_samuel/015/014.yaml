revisions:
- from: 'Então Davi disse a todos os seus servos que estavam com ele em Jerusalém: “Levantem-se! Vamos fugir, pois não teremos como escapar de Absalão. Apressem-se em partir, para que ele não nos alcance depressa, traga desgraça sobre nós[a] e mate os habitantes da cidade à espada[b]”.'
  to: 'Então Davi disse a todos os seus servos que estavam com ele em Jerusalém: “Levantem-se! Vamos fugir, pois não teremos como escapar de Absalão. Apressem-se a partir, para que ele não se apresse e nos alcance, traga calamidade sobre nós[a] e fira a cidade com o fio da espada[b].”'
  rationale: A revisão preserva a imagem e a sintaxe semântica do hebraico ao manter «a cidade» como objeto de «fira», em vez de explicitar «os habitantes». Também torna explícita, em português natural, a repetição verbal de «apressar-se» presente no original. As notas foram ajustadas para explicar o idioma sem estreitar seu alcance.
