  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: pt
  text: 'Então Davi disse a todos os seus servos que estavam com ele em Jerusalém: “Levantem-se! Vamos fugir, pois não teremos como escapar de Absalão. Apressem-se a partir, para que ele não se apresse e nos alcance, traga calamidade sobre nós[a] e fira a cidade com o fio da espada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “traga desgraça sobre nós”. O termo hebraico se refere aqui a calamidade ou desastre, não ao mal moral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fira a cidade pela boca da espada”. “Boca da espada” é uma expressão hebraica para o fio da espada e descreve ataque ou destruição pela espada.
    reason: idiom_clarification
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte real, refere-se aos oficiais e homens a serviço de Davi; “servos” preserva a amplitude do termo sem especificar indevidamente condição de escravidão.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: Levantem-se! Vamos fugir
  rationale: O imperativo seguido do coortativo expressa uma ordem urgente e uma exortação que inclui o próprio Davi. A divisão em duas frases soa natural em português e mantém a urgência.
- source_word: פְלֵיטָה
  choice: como escapar
  rationale: O substantivo indica escape ou sobrevivência por meio da fuga. A construção portuguesa comunica naturalmente que nenhuma possibilidade de fuga restará.
- source_word: מִפְּנֵי אַבְשָׁלוֹם
  choice: de Absalão
  rationale: A preposição apresenta Absalão como a ameaça da qual não haverá escape; a forma concisa é clara em português.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Apressem-se em partir
  rationale: A combinação de imperativo e infinitivo exige saída imediata. “Partir” explicita o sentido contextual de ir embora sem perder a força da ordem.
- source_word: פֶּן יְמַהֵר וְהִשִּׂגָנוּ
  choice: para que ele não nos alcance depressa
  rationale: פֶּן introduz o resultado temido. Esta formulação moderna preserva tanto a prevenção negativa quanto a repetição do motivo da rapidez.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת הָרָעָה
  choice: traga desgraça sobre nós
  rationale: רָעָה designa aqui calamidade sofrida, não maldade moral. “Desgraça” mantém a gravidade e a construção figurada com “sobre nós”.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: mate os habitantes da cidade à espada
  rationale: Literalmente, o hebraico fala em ferir a cidade “à boca da espada”. Como uma cidade física não é morta pela espada, a formulação torna explícito o objeto humano implícito e comunica o sentido militar do idioma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta preserva a urgência por meio de imperativos naturais. Evitou-se o mais arcaico “levantai-vos” e também uma reprodução opaca do idioma “boca da espada” no corpo do texto.
