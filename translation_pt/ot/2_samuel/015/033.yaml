base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: pt
  text: 'Davi lhe disse: “Se você prosseguir comigo[a], será um peso para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Se você atravessar comigo”. O verbo hebraico pode significar mais literalmente “atravessar” ou “passar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: Davi disse
  rationale: O waw consecutivo faz a narrativa avançar; em português corrente, não é necessário explicitar “e” ou “então”.
- source_word: לוֹ
  choice: lhe
  rationale: Preserva o pronome explícito no hebraico sem inserir o nome de Husai, fornecido apenas pelo contexto.
- source_word: אִם
  choice: Se
  rationale: Introduz de modo direto e natural a condição expressa no hebraico.
- source_word: עָבַרְתָּ אִתִּי
  choice: você seguir comigo
  rationale: Embora עבר possa significar literalmente “atravessar” ou “passar”, neste contexto indica acompanhar Davi em sua marcha; “seguir comigo” é natural e mantém a ideia de prosseguir em sua companhia.
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  choice: será um peso para mim
  rationale: A construção descreve o impacto da presença dele sobre Davi. “Um peso” traduz naturalmente מַשָּׂא e conserva a imagem concreta de algo carregado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O tratamento “você” torna explícita a segunda pessoa já marcada no verbo hebraico; “lhe” evita repetir o referente pelo nome.
