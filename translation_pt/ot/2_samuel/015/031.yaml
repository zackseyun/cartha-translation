  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: pt
  text: 'Davi foi informado: “Aitofel está entre os conspiradores com Absalão.” Então Davi disse: “Ó Yahweh, por favor, torna insensato o conselho de Aitofel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִגִּיד לֵאמֹר
  choice: Informaram Davi
  rationale: O hifil de נגד significa comunicar ou informar. A terceira pessoa sem sujeito expresso permite uma formulação portuguesa natural com sujeito indeterminado; o infinitivo לֵאמֹר introduz diretamente a fala e não precisa ser reproduzido pelo pouco natural “dizendo”.
- source_word: בַּקֹּשְׁרִים
  choice: entre os conspiradores
  rationale: O particípio plural substantivado de קשר designa concretamente os participantes da conspiração, não apenas a conspiração como ideia abstrata.
- source_word: עִם אַבְשָׁלוֹם
  choice: que estão com Absalão
  rationale: Explicita em português a associação indicada pela preposição עִם sem acrescentar uma interpretação sobre o tipo exato de apoio prestado.
- source_word: סַכֶּל נָא
  choice: por favor, torna insensato
  rationale: O imperativo piel pede que Deus faça o conselho parecer ou se tornar insensato; נָא confere à oração o tom de súplica expresso por “por favor”.
- source_word: עֲצַת
  choice: o conselho
  rationale: עֵצָה refere-se aqui ao conselho estratégico de Aitofel; “conselho” conserva o peso político e a ligação com sua função de conselheiro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino em vocativo
  choice: Ó Yahweh
  alternative: Ó SENHOR
  rationale: O texto traz o tetragrama como nome próprio na invocação direta; a transliteração preserva essa característica.
- issue: Efeito pedido para o conselho de Aitofel
  choice: torna insensato o conselho
  alternative: frustra o conselho
  rationale: A tradução principal conserva a imagem lexical hebraica de fazer o conselho ser insensato, sem decidir se isso significa torná-lo intrinsecamente ruim, fazê-lo parecer tolo ou levá-lo ao fracasso; a alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “Informaram Davi” usa sujeito indeterminado de modo natural e evita o calque “foi dito a Davi, dizendo”. O vocativo “Ó” mantém o tom solene da breve oração sem recorrer a linguagem arcaica.
