base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: pt
  text: 'Então Absalão enviou espiões por todas as tribos de Israel, dizendo: “Assim que vocês ouvirem o som da trombeta, digam: ‘Absalão tornou-se rei em Hebrom!’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: mensageiros secretos
  rationale: No contexto, refere-se a agentes enviados discretamente para transmitir uma instrução combinada. A escolha preserva o caráter clandestino sem sugerir que sua tarefa principal era obter informações, como poderia indicar ‘espiões’ no português corrente.
- source_word: כְּשָׁמְעֲכֶם
  choice: assim que vocês ouvirem
  rationale: Expressa naturalmente a relação temporal e a ideia de ação imediata indicada pela construção hebraica.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: O perfeito hebraico, no anúncio combinado, declara a ascensão de Absalão à realeza; esta formulação é mais clara em português do que ‘reina’, sem acrescentar legitimidade ao ato.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: Mantém diretamente a indicação geográfica do texto hebraico.
theological_decisions:
- issue: Natureza da proclamação da realeza de Absalão
  choice: ‘Absalão tornou-se rei’
  alternative: ‘Absalão reina’
  rationale: A tradução apresenta o conteúdo da proclamação planejada sem afirmar sua legitimidade teológica ou política; apenas reproduz a alegação dos conspiradores.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural ‘vocês’, amplamente compreensível no Brasil e no português internacional. A fala mantém tom direto de ordem e proclamação.
