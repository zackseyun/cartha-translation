  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: pt
  text: 'Mas, se ele disser: “Não tenho prazer em você”[a], aqui estou; que ele faça comigo o que parecer bom aos seus olhos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me agrado de você”.'
    reason: lexical_alternative
  - marker: b
    text: “Bom aos seus olhos” é uma expressão hebraica que significa “bom segundo o seu parecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma possibilidade condicional em contraste com o versículo anterior; “Mas, se” preserva tanto o contraste quanto a condição.
- source_word: כֹּה יֹאמַר
  choice: ele disser
  rationale: כֹּה funciona idiomaticamente com “dizer” para introduzir o discurso direto, sem exigir equivalente separado; o futuro do subjuntivo é natural em português após “se”.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Não tenho prazer em você
  rationale: Preserva o sentido relacional e avaliativo de חפץ, que pode indicar ter prazer ou deleite em alguém, sem sugerir desejo físico.
- source_word: הִנְנִי
  choice: aqui estou
  rationale: Fórmula convencional de apresentação pessoal que, neste contexto, expressa disponibilidade e submissão.
- source_word: יַעֲשֶׂה לִּי
  choice: que ele faça comigo
  rationale: O valor volitivo do imperfeito expressa submissão consentida à ação divina; a construção portuguesa com “que” comunica esse sentido com naturalidade.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: o que parecer bom aos seus olhos
  rationale: Conserva a imagem hebraica de algo ser bom aos olhos de alguém, ao mesmo tempo que comunica o sentido idiomático de parecer bom ou correto.
theological_decisions:
- issue: Referente dos pronomes masculinos na terceira pessoa
  choice: Manter “ele” e “seus” em minúsculas, com referência ao SENHOR determinada pelo contexto
  alternative: Empregar maiúsculas reverenciais ou repetir explicitamente “o SENHOR”
  rationale: O hebraico usa formas pronominais sem repetir o nome divino. Mantê-las preserva a forma do texto e evita introduzir uma convenção tipográfica ausente na fonte.
- issue: Força de הִנְנִי e יַעֲשֶׂה לִּי
  choice: 'Expressar disponibilidade e submissão: “aqui estou; que ele faça comigo”'
  alternative: 'Ler apenas como localização seguida de simples previsão: “estou aqui; ele fará comigo”'
  rationale: No contexto, a fórmula e a construção volitiva comunicam a entrega de Davi à decisão de Deus, sem determinar antecipadamente qual será essa decisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora hebraica “aos seus olhos”, explicada em nota, e evita capitalização reverencial não marcada no original.
