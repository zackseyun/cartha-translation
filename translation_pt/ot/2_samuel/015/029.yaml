base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: pt
  text: Assim, Zadoque e Abiatar levaram de volta a arca de Deus para Jerusalém e permaneceram ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: levaram de volta
  rationale: 'O singular hebraico é seguido por dois sujeitos coordenados, Zadoque e Abiatar, e שׁוב no hifil tem aqui sentido causativo e transitivo: fazer a arca voltar. “Levaram de volta” expressa isso com clareza e naturalidade em português.'
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְאֶבְיָתָר
  choice: e Abiatar
  rationale: Forma tradicional do nome em português, com a conjunção hebraica preservada.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz a expressão hebraica sem acrescentar “da aliança”, que não aparece neste versículo.
- source_word: יְרוּשָׁלָם
  choice: para Jerusalém
  rationale: A preposição “para” torna explícito em português o destino indicado pelo verbo e pelo contexto.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: e permaneceram ali
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. Neste contexto narrativo, “permaneceram ali” comunica que continuaram em Jerusalém, em registro atual e digno.
