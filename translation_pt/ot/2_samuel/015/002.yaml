  to: 'Absalão se levantava cedo e se colocava junto ao caminho que levava ao portão. Sempre que alguém tinha uma disputa e vinha ao rei para julgamento[a], Absalão o chamava e perguntava: “De que cidade você é?” Ele respondia: “Seu servo é de uma das tribos de Israel.”'
  rationale: A revisão remove a especificação não expressa «da cidade», traduz עָמַד com uma formulação que indica melhor a tomada de posição e simplifica a retomada do interlocutor. Mantêm-se o aspecto habitual, o registro moderno e a nota que preserva a alternativa jurídica de רִיב.
