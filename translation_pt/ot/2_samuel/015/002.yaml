  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: pt
  text: 'Absalão se levantava cedo e se colocava junto ao caminho que levava ao portão. Sempre que alguém tinha uma disputa e vinha ao rei para julgamento[a], Absalão o chamava e perguntava: “De que cidade você é?” Ele respondia: “Seu servo é de uma das tribos de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinha uma causa judicial” em vez de “tinha uma disputa”; o hebraico רִיב pode indicar uma disputa, uma queixa ou uma causa em contexto judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: se levantava cedo
  rationale: O verbo indica levantar-se cedo; o imperfeito em contexto iterativo descreve uma prática habitual de Absalão.
- source_word: וְעָמַד
  choice: ficava
  rationale: Neste contexto habitual, 'ficava' expressa naturalmente que Absalão tomava posição e permanecia naquele lugar, sem exigir um pretérito pontual.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: ao lado do caminho que levava ao portão da cidade
  rationale: עַל יַד significa 'ao lado de'; a construção דֶּרֶךְ הַשַּׁעַר designa o caminho de acesso ao portão. 'Da cidade' é uma explicitação contextual mínima para que 'portão' tenha sentido urbano claro em português.
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה לּוֹ רִיב
  choice: Sempre que alguém tinha uma disputa
  rationale: A formulação capta a circunstância recorrente. רִיב pode indicar disputa, queixa ou causa judicial; 'disputa' preserva essa amplitude básica.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: vinha ao rei em busca de julgamento
  rationale: מִשְׁפָּט tem aqui sentido de decisão ou julgamento judicial. A expressão portuguesa comunica a finalidade sem transformar o termo em conceito abstrato de justiça.
- source_word: וַיִּקְרָא אַבְשָׁלוֹם אֵלָיו
  choice: Absalão o chamava
  rationale: O verbo significa chamar ou chamar alguém para perto; o imperfeito português mantém a ação habitual e evita a força oficial de 'convocava'.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: De que cidade você é?
  rationale: Tradução direta e natural da pergunta sobre a cidade de origem.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: de uma das tribos de Israel
  rationale: A expressão identifica a origem tribal do interlocutor e é idiomática em português.
- source_word: עַבְדֶּךָ
  choice: Seu servo
  rationale: Embora עֶבֶד também possa significar 'escravo', aqui funciona como autodesignação respeitosa diante do filho do rei; 'servo' preserva o registro social adequado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O uso reiterado do pretérito imperfeito comunica a prática habitual. 'Você' torna o diálogo natural sem eliminar o respeito expresso por 'seu servo'.
