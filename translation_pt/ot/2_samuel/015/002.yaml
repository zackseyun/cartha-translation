    issue: «portão da cidade» explicita «cidade» sem apoio lexical direto
    rationale: O texto hebraico diz apenas «o portão». Embora um portão urbano seja contextual e historicamente provável, a tradução deve evitar essa adição.
  - severity: low
    issue: «ficava ao lado» traduz עָמַד de modo impreciso
    rationale: O verbo significa «ficar de pé», «pôr-se» ou «colocar-se», não necessariamente permanecer. «Colocava-se» reproduz melhor a ação.
  - severity: low
    issue: «A pessoa respondia» é uma expansão desnecessária
    rationale: O hebraico simplesmente retoma o homem com «ele dizia»; «ele respondia» é mais econômico e fiel.
