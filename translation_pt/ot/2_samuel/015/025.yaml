  source_fidelity: A tradução preserva adequadamente o imperativo dirigido a Zadoque, a distinção entre “arca de Deus” e Yahweh, a condição “se eu encontrar favor” e o sentido causativo do retorno de Davi. Contudo, “o lugar onde ela habita” explicita e reformula desnecessariamente נָוֵהוּ, além de atribuir à arca, de modo mais concreto que o hebraico exige, o ato de habitar.
  naturalness: O texto é moderno e claro. A sequência “me deixará vê-la e ver o lugar onde ela habita” é compreensível, mas é menos fluida e menos próxima da coordenação hebraica do que “me fará ver a arca e sua morada”.
  terminology: “Zadoque”, “arca de Deus”, “favor aos olhos de Yahweh” e “Yahweh” são escolhas adequadas ao texto-fonte e ao registro solicitado. “Morada” é uma equivalência mais direta e natural para נָוֵהוּ do que a paráfrase “o lugar onde ela habita”.
