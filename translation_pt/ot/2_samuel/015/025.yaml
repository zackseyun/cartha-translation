source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: pt
  text: 'Então o rei disse a Zadoque: “Leve a arca de Deus de volta para a cidade. Se eu encontrar favor aos olhos de Yahweh, ele me fará voltar e me fará ver a arca e sua morada.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e me fará vê-lo e sua morada”. O hebraico também pode ser entendido como uma referência mais direta a Deus, embora o antecedente imediato seja “a arca de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Leve ... de volta
  rationale: O imperativo hifil de שוב, dirigido a Zadoque, pede que ele faça a arca retornar. Esta formulação é natural em português e explicita corretamente o agente humano.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Segue diretamente אֱלֹהִים, sem harmonizar a expressão com fórmulas que usam o nome divino.
- source_word: הָעִיר
  choice: para a cidade
  rationale: O destino é indicado pelo contexto verbal; a preposição torna a direção idiomática e clara em português.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Se eu encontrar favor aos olhos de Yahweh
  rationale: Preserva de modo inteligível a conhecida expressão hebraica de aceitação ou benevolência, sem reduzi-la a mera aprovação moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וֶהֱשִׁבַנִי
  choice: ele me fará voltar
  rationale: Expressa o valor causativo do hifil de שוב e mantém aberta, pelo contexto, a ideia do retorno de Davi a Jerusalém.
- source_word: וְהִרְאַנִי
  choice: e me deixará ver
  rationale: Comunica naturalmente o causativo de ראה como ação providencial de Yahweh, sem a rigidez de “me fará ver”.
- source_word: אֹתוֹ
  choice: vê-la
  rationale: O antecedente imediato mais natural é “a arca”, substantivo feminino em português; o pronome é ajustado ao gênero da língua de chegada.
- source_word: נָוֵהוּ
  choice: o lugar onde ela habita
  rationale: נָוֶה designa morada ou lugar de habitação. A formulação é clara e evita especificar um templo, que ainda não existia.
theological_decisions:
- issue: Referência de אֹתוֹ וְאֶת־נָוֵהוּ (“ele/ela e sua morada”)
  choice: A arca e o lugar onde ela habita
  alternative: O próprio Deus e sua habitação
  rationale: “A arca de Deus” é o antecedente nominal imediato, favorecendo a referência concreta à arca. Contudo, a associação da arca com a presença de Deus permite uma leitura mais centrada em Deus; essa ambiguidade é preservada em nota, sem ser resolvida dogmaticamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Zadoque” segue a forma portuguesa corrente. A repetição de “ver” favorece clareza referencial e reproduz sem excesso de rigidez a coordenação hebraica.
