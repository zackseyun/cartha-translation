  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: pt
  text: 'Absalão costumava dizer[a]: “Quem dera me nomeassem juiz nesta terra! Então, qualquer pessoa que tivesse uma disputa ou questão judicial viria a mim, e eu lhe faria justiça[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Quem me nomeará juiz nesta terra?” A pergunta hebraica expressa aqui um desejo retórico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu lhe daria razão” ou “eu o declararia justo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: costumava dizer
  rationale: O contexto apresenta a fala como parte da conduta repetida de Absalão; o imperfeito narrativo pode ser expresso naturalmente em português pelo valor habitual.
- source_word: מִי יְשִׂמֵנִי
  choice: Quem dera me nomeassem
  rationale: Embora literalmente formule a pergunta “Quem me nomeará?”, a construção tem força retórica e optativa. “Quem dera” preserva claramente esse desejo sem acrescentar um agente específico.
- source_word: שֹׁפֵט
  choice: juiz
  rationale: Designa quem julga questões legais; “juiz” é direto, corrente e adequado ao contexto.
- source_word: בָּאָרֶץ
  choice: nesta terra
  rationale: “Terra” preserva o sentido territorial amplo; o demonstrativo torna natural em português a referência à terra em que Absalão se encontrava, sem reduzi-la ao sentido moderno de Estado-nação.
- source_word: כָּל אִישׁ
  choice: qualquer pessoa
  rationale: A expressão masculina singular tem valor genérico. “Qualquer pessoa” comunica esse alcance inclusivo com naturalidade em português moderno.
- source_word: רִיב וּמִשְׁפָּט
  choice: uma disputa ou questão judicial
  rationale: רִיב indica contenda ou disputa, enquanto מִשְׁפָּט, neste par, indica matéria submetida a julgamento. A tradução mantém a distinção sem sugerir dois processos necessariamente separados.
- source_word: וְעָלַי יָבוֹא
  choice: viria a mim
  rationale: O condicional expressa naturalmente o resultado imaginado por Absalão caso fosse nomeado juiz.
- source_word: וְהִצְדַּקְתִּיו
  choice: eu lhe faria justiça
  rationale: O hifil de צדק pode significar declarar justo, dar razão ou vindicar. No contexto judicial, “fazer justiça” é claro e preserva a ideia de decisão favorável sem usar jargão teológico.
theological_decisions:
- issue: Sentido judicial de וְהִצְדַּקְתִּיו
  choice: eu lhe faria justiça
  alternative: eu lhe daria razão / eu o declararia justo
  rationale: A formulação conserva a dimensão forense e a promessa interessada de Absalão, sem importar o sentido técnico posterior de “justificação” nem determinar além do necessário a forma da sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Costumava dizer” explicita a repetição contextual; “Quem dera” reproduz a força optativa da pergunta retórica. Os marcadores aparecem no texto na ordem [a], [b].
