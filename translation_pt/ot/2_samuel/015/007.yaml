base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: pt
  text: 'Ao fim de quarenta[a] anos, Absalão disse ao rei: “Por favor, deixe-me ir cumprir o voto que fiz ao SENHOR em Hebrom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos da Septuaginta, a versão siríaca e Josefo trazem “quatro”; o texto hebraico massorético traz “quarenta”.
    reason: A variante é antiga e significativa, pois “quarenta” cria uma dificuldade cronológica no contexto narrativo.
lexical_decisions:
- source_word: מִקֵּץ
  choice: Ao fim de
  rationale: Reproduz de modo natural a ideia temporal de que o período mencionado havia transcorrido.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: cumprir o voto que fiz
  rationale: O verbo שׁלם, aplicado a um voto, significa satisfazê-lo ou cumpri-lo; esta formulação é clara e idiomática em português atual.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o tetragrama divino por SENHOR em versaletes.
- source_word: בְּחֶבְרוֹן
  choice: a Hebrom
  rationale: No contexto, Hebrom é o destino onde Absalão pretende cumprir o voto; a formulação evita sugerir erroneamente que o voto foi feito ali.
theological_decisions:
- issue: Número de anos
  choice: quarenta, conforme o texto massorético
  alternative: quatro, conforme alguns testemunhos antigos
  rationale: A tradução segue diretamente o WLC fornecido, mas registra em nota a variante antiga relevante, sem resolver silenciosamente a dificuldade cronológica.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: SENHOR é amplamente reconhecido na tradição bíblica portuguesa e não impõe uma reconstrução específica da pronúncia do tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Por favor, deixe-me ir” preserva o tom respeitoso do pedido dirigido ao rei.
