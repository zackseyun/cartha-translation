base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: pt
  text: Davi subia pela encosta do Monte das Oliveiras[a], subindo e chorando, com a cabeça coberta e descalço. Todo o povo que estava com ele, cada um, cobriu a própria cabeça; e subiram, subindo e chorando[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete a ideia de subir para dar ênfase: “subia... subindo e chorando”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, o hebraico diz: “subiram, subindo e chorando”, repetição que dá ênfase e vivacidade à cena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: a subida do monte das Oliveiras
  rationale: מַעֲלֵה designa uma subida, encosta ou caminho ascendente; הַזֵּיתִים funciona aqui como nome topográfico, tradicionalmente expresso em português como “monte das Oliveiras”.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: subia ... subindo e chorando
  rationale: O imperfeito progressivo seguido de particípios preserva a ação contínua e a repetição enfática e vívida do hebraico.
- source_word: בֹּכֶה
  choice: chorando
  rationale: “Chorando” comunica de modo simples e natural o sentido físico e emocional do termo, sem acrescentar a ideia específica de lamentação ritual.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: com a cabeça coberta
  rationale: Mantém o estado descrito no hebraico sem especificar indevidamente como a cabeça estava coberta.
- source_word: יָחֵף
  choice: com os pés descalços
  rationale: Expressão corrente e clara em português para a condição indicada pelo adjetivo hebraico.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: todo o povo que estava com ele
  rationale: Preserva o caráter amplo de הָעָם, sem restringir o grupo a tropas militares.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: também cobriu a cabeça, cada um a sua
  rationale: A formulação explicita naturalmente em português a força distributiva do singular אִישׁ e evita a impressão de que o grupo cobriu uma única cabeça.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: e subia chorando pelo caminho
  rationale: O singular coletivo concorda naturalmente com “todo o povo”; a expressão comunica a subida continuada e o choro concomitante, enquanto a nota registra a construção hebraica enfática.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição inicial foi mantida no corpo do texto; a construção enfática final foi vertida com maior naturalidade e documentada em nota. “Também” torna explícita a correspondência entre o gesto de Davi e o do povo, implícita na sequência narrativa.
