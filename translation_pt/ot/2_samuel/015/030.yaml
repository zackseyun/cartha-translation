revisions:
- from: Davi subia pela subida do monte das Oliveiras[a], subindo e chorando, com a cabeça coberta e os pés descalços. Todo o povo que estava com ele também cobriu a cabeça, cada um a sua[b], e subia chorando pelo caminho[c].
  to: Davi subia pela encosta do Monte das Oliveiras[a], subindo e chorando, com a cabeça coberta e descalço. Todo o povo que estava com ele, cada um, cobriu a própria cabeça; e subiram, subindo e chorando[c].
  rationale: A revisão restitui o plural e a repetição enfática da oração final, remove o acréscimo interpretativo "pelo caminho" e torna explícita, de modo idiomático, a ação distributiva de cobrir a cabeça. A nota b é mantida como informação lexical útil, embora a redação principal já expresse o sentido distributivo.
