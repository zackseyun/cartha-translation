    issue: A cláusula final está em singular e introduz "pelo caminho".
    rationale: וְעָלוּ está no plural, e a construção עָלֹה וּבָכֹה retoma enfaticamente a subida e o choro. O singular coletivo pode ocorrer em português, mas aqui enfraquece a forma verbal explícita; "pelo caminho" não possui correspondente no hebraico.
  - severity: low
    issue: '"cada um a sua" é formulação elíptica.'
    rationale: Embora compreensível, pode soar truncada e depende de recuperação implícita de "cabeça". Uma formulação verbal explícita preserva melhor a distribuição individual.
