  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: pt
  text: 'Os servos do rei disseram ao rei: “Tudo o que meu senhor, o rei, escolher, aqui estão os seus servos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Conforme tudo o que meu senhor, o rei, escolher, aqui estão os seus servos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: disseram
  rationale: O wayyiqtol de אמר introduz fala direta; “disseram” é a forma narrativa natural em português.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: os servos do rei
  rationale: No contexto da corte, עבד designa servidores ou dependentes leais do rei; “servos” preserva também a repetição lexical no fim do versículo.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: Faremos tudo o que ... escolher
  rationale: A expressão hebraica significa literalmente “conforme tudo o que ... escolher”. A forma portuguesa explicita a prontidão para cumprir a escolha do rei sem alterar o sentido contextual.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém o tratamento cortês e deferente da linguagem da corte em português moderno.
- source_word: יִבְחַר
  choice: escolher
  rationale: Preserva o sentido lexical comum de בחר, sem substituí-lo pelo mais interpretativo “decidir”.
- source_word: הִנֵּה עֲבָדֶיךָ
  choice: Aqui estão os seus servos
  rationale: הִנֵּה apresenta os servos como imediatamente disponíveis; “aqui estão” é atual e preserva essa força melhor que o solene “eis”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento cortesão preservado. A repetição de “servos” reflete o hebraico. A expansão verbal “Faremos” torna idiomática a disposição implícita na construção hebraica, enquanto a nota registra sua forma mais literal.
