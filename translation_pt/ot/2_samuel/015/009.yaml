lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” introduz a fala direta de modo natural e fiel.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Mantém o substantivo definido do hebraico, que no contexto se refere a Davi, sem substituir o título pelo nome.
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo de הלך; “Vá” é o equivalente direto e natural em português.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Preserva a expressão idiomática hebraica de despedida ou bênção, também corrente em português.
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Expressa naturalmente o verbo קום na sequência narrativa, sem o tom arcaico de “levantou-se” como escolha obrigatória.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Equivalente simples e idiomático do verbo de movimento na sequência da ação.
- source_word: חֶבְרוֹנָה
  choice: para Hebrom
  rationale: O ה direcional ligado ao nome do lugar indica movimento em direção a Hebrom; “para Hebrom” reproduz essa função naturalmente.
