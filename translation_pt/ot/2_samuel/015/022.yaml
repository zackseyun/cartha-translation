lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Vá em frente e atravesse
  rationale: Reproduz os dois imperativos hebraicos de modo natural em português; “em frente” comunica que Davi permite e incentiva Itai a prosseguir.
- source_word: הַגִּתִּי
  choice: o geteu
  rationale: Gentílico tradicional e inteligível para alguém de Gate.
- source_word: כָל־הַטַּף
  choice: todas as crianças
  rationale: O substantivo coletivo designa os pequenos ou dependentes; neste contexto, “crianças” é claro e natural, sem acrescentar outros grupos não explicitados.
