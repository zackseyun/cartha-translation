  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: pt
  text: 'Então Davi disse a Itai: “Vá em frente e atravesse”. Assim, Itai, o geteu, atravessou com todos os seus homens e todas as crianças que estavam com ele.'
