base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: pt
  text: 'Mas, se você voltar à cidade e disser a Absalão: ‘Serei seu servo, ó rei. Fui servo de seu pai no passado, e agora sou seu servo’, então você frustrará em meu favor o conselho de Aitofel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם הָעִיר תָּשׁוּב
  choice: Mas, se você voltar à cidade
  rationale: Reproduz a condição e o contraste contextual; em português, a ordem natural dispensa repetir a preposição diante de “cidade”.
- source_word: עַבְדְּךָ אֲנִי הַמֶּלֶךְ אֶהְיֶה
  choice: Serei seu servo, ó rei
  rationale: A sequência massorética é sintaticamente difícil; a tradução segue a leitura contextual mais provável, tomando “ó rei” como vocativo e preservando a promessa de serviço a Absalão.
- source_word: עֶבֶד אָבִיךָ וַאֲנִי מֵאָז וְעַתָּה וַאֲנִי עַבְדֶּךָ
  choice: Assim como no passado fui servo de seu pai, agora serei seu servo
  rationale: Expressa em português corrente o contraste temporal entre o serviço anterior ao pai e o serviço agora oferecido ao filho.
- source_word: וְהֵפַרְתָּה לִי אֵת עֲצַת אֲחִיתֹפֶל
  choice: então você frustrará em meu favor o conselho de Aitofel
  rationale: “Frustrar” comunica o ato de invalidar ou neutralizar o plano; “em meu favor” conserva a força do dativo לִי sem sugerir que o conselho pertencia a Davi.
theological_decisions:
- issue: A fala de Husai envolve uma declaração enganosa a Absalão.
  choice: Traduzir diretamente a estratégia atribuída a Davi, sem justificá-la nem condená-la no próprio versículo.
  alternative: Acrescentar linguagem moral avaliativa ou suavizar a intenção de enganar.
  rationale: O hebraico narra a instrução sem comentário teológico explícito neste ponto; a tradução deve preservar essa tensão moral.
- issue: Identidade do rei no vocativo da fala citada.
  choice: 'Entender הַמֶּלֶךְ como referência vocativa a Absalão: “ó rei”.'
  alternative: Ler a expressão de modo rígido como “eu serei servo do rei”, apesar da construção difícil.
  rationale: O contexto imediato é a fala dirigida a Absalão, que reivindica o trono; a leitura vocativa oferece sentido coerente sem importar uma posição doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” adequado à legibilidade brasileira ampla. Mantém os nomes tradicionais Absalão e Aitofel e usa discurso direto natural.
