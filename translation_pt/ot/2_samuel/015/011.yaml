  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: pt
  text: Duzentos homens de Jerusalém foram com Absalão. Eram convidados e o acompanhavam sem suspeitar de nada[a]; não sabiam de nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua inocência” ou “com integridade”. A expressão hebraica pode referir-se à inocência ou à integridade deles; neste contexto, indica que acompanhavam Absalão sem suspeitar de seus planos.
    reason: alternativa lexical
lexical_decisions:
- source_word: הָלְכוּ ... אֶת־אַבְשָׁלוֹם
  choice: Com Absalão foram
  rationale: O verbo הלך significa “ir”, e אֶת com Absalão indica companhia. A formulação preserva o sentido de que os homens acompanharam Absalão.
- source_word: מָאתַיִם אִישׁ
  choice: duzentos homens
  rationale: A expressão hebraica conta explicitamente homens e é vertida de modo direto e natural.
- source_word: מִירוּשָׁלַםִ
  choice: de Jerusalém
  rationale: A preposição מִן indica procedência ou origem.
- source_word: קְרֻאִים
  choice: convidados
  rationale: O particípio passivo de קרא pode significar “chamados” ou “convidados”; neste contexto, refere-se aos que haviam recebido convite, sem ser necessário acrescentar “hóspedes”.
- source_word: וְהֹלְכִים לְתֻמָּם
  choice: Eles iam de boa-fé
  rationale: A locução לְתֻמָּם expressa inocência, inteireza ou ausência de suspeita. “De boa-fé” comunica naturalmente que agiam sem conhecer a conspiração, preservando também a ideia de sinceridade.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: e não sabiam de nada
  rationale: A expressão idiomática hebraica indica desconhecimento completo do que estava sendo tramado.
