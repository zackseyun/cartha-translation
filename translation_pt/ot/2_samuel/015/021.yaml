  source_fidelity: O texto transmite fielmente a fórmula solene de juramento, a referência explícita a Yahweh, a dupla designação respeitosa «meu senhor, o rei», a localização aberta («onde quer que esteja») e o compromisso de permanecer com o rei, quer para morte, quer para vida. A omissão de «e disse» após «respondeu» é uma simplificação narrativa natural em português e não altera o sentido.
