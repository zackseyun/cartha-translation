  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: pt
  text: 'Então Itai respondeu ao rei: “Tão certo como vive Yahweh e como vive o meu senhor, o rei[a], onde quer que esteja o meu senhor, o rei, seja para a morte, seja para a vida, ali estará também o seu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento: “Tão certo como vive Yahweh e como vive o meu senhor, o rei”.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: Então Itai respondeu ao rei
  rationale: Reproduz a resposta narrativa com naturalidade em português, sem a redundância hebraica de ‘respondeu... e disse’.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Mantém o nome divino e comunica claramente a força solene da fórmula hebraica de juramento.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: e como vive o meu senhor, o rei
  rationale: Preserva o paralelismo da fórmula de juramento e entende ‘o rei’ como título em aposição a ‘meu senhor’.
- source_word: כִּי אִם
  choice: (expresso pela construção enfática do juramento)
  rationale: No contexto do juramento, introduz uma asseveração enfática; em português, essa força já é transmitida por ‘Tão certo como...’ e pela declaração que se segue.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: onde quer que esteja
  rationale: Expressa de modo natural a localização aberta e indeterminada do hebraico.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: seja para a morte, seja para a vida
  rationale: Conserva a estrutura paralela e a ordem do hebraico, incluindo a abrangência da lealdade prometida.
- source_word: עַבְדֶּךָ
  choice: o seu servo
  rationale: Neste discurso dirigido ao rei, é uma autodesignação deferente; ‘servo’ se ajusta melhor ao contexto do que ‘escravo’.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; ‘Yahweh’ o representa diretamente, sem substituí-lo por um título.
- issue: Natureza da declaração de Itai
  choice: Manter a forma de juramento sem explicar sua implicação teológica no corpo do texto
  alternative: Parafrasear como uma promessa ou voto explícito
  rationale: A fórmula invoca a vida de Yahweh e a do rei como garantia. Preservar sua forma evita acrescentar uma interpretação não expressa diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Itai’ segue uma transliteração corrente em português. A repetição de ‘meu senhor, o rei’ preserva a solenidade e a deferência do discurso; ‘também’ torna explícita em português a associação do servo ao lugar e ao destino do rei, implícita no contexto hebraico.
