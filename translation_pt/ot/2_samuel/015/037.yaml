  text: וַ/יָּבֹ֥א חוּשַׁ֛י רֵעֶ֥ה דָוִ֖ד הָ/עִ֑יר וְ/אַבְשָׁלֹ֔ם יָבֹ֖א יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: pt
  text: Assim, Husai, amigo de Davi, chegou à cidade quando Absalão entrava em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Absalão entrou em Jerusalém”. A conjunção hebraica também pode ser entendida como um simples “e”, e o verbo pode ser traduzido no passado simples.'
    reason: Leitura alternativa da relação sintática e temporal entre as duas orações.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo בוא pode significar “vir”, “chegar” ou “entrar”. Com “à cidade”, “chegou” expressa naturalmente o movimento até o local sem tornar a frase pesada.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Forma tradicional e inteligível em português para o nome hebraico.
- source_word: רֵעֶה דָוִד
  choice: amigo de Davi
  rationale: רֵעֶה designa amigo, companheiro ou associado. “Amigo” é a opção direta e não acrescenta a função mais específica de conselheiro.
- source_word: הָעִיר
  choice: a cidade
  rationale: Preserva o substantivo comum definido do hebraico; o contexto identifica a cidade como Jerusalém.
- source_word: וְאַבְשָׁלֹם יָבֹא
  choice: quando Absalão entrava
  rationale: O yiqtol após o wayyiqtol anterior pode apresentar uma ação concomitante ou de fundo. “Quando... entrava” comunica essa sobreposição de modo natural, sem ocultar em nota a possibilidade de coordenação sequencial.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A tradução mantém “a cidade” em vez de substituir o termo por “Jerusalém” e sinaliza a ambiguidade temporal do hebraico.
