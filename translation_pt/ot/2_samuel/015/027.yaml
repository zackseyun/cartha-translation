base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: pt
  text: 'Então o rei disse ao sacerdote Zadoque: “Você é vidente?[a] Volte em paz para a cidade, e que os dois filhos de vocês voltem com vocês: Aimaás, seu filho, e Jônatas, filho de Abiatar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Você está vendo?” O hebraico pode designar Zadoque como “vidente” ou formular uma pergunta sobre ver ou perceber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  choice: Você é vidente?
  rationale: Mantém a leitura interrogativa do particípio/substantivo hebraico e preserva a possível função de Zadoque como observador, sem reduzir a expressão à visão física.
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: Volte ... para a cidade
  rationale: O imperativo de שוב com ה direcional indica retorno à cidade; a formulação é clara e natural em português.
- source_word: בְּ/שָׁלוֹם
  choice: em paz
  rationale: Preserva o valor lexical de שָׁלוֹם, que neste contexto também pode sugerir segurança.
- source_word: שְׁנֵי בְנֵיכֶם אִתְּכֶם
  choice: que os dois filhos de vocês voltem com vocês
  rationale: Os sufixos plurais se referem coletivamente a Zadoque e Abiatar; explicitar o verbo elíptico produz português natural e deixa claro que os filhos devem acompanhá-los.
- source_word: וַאֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן אֶבְיָתָר
  choice: Aimaás, seu filho, e Jônatas, filho de Abiatar
  rationale: Mantém a identificação paralela dos dois filhos e formas correntes dos nomes bíblicos em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi ligeiramente explicitada no segundo imperativo para evitar que, em português, os filhos pareçam mero objeto de “volte”, preservando os plurais hebraicos “de vocês/com vocês”.
