base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: pt
  text: 'Então o rei disse a Itai, o geteu: “Por que você também iria conosco?[a] Volte e fique com o rei,[b] pois você é estrangeiro e também é um exilado do seu lugar.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que você também irá conosco?”'
    reason: lexical_alternative
  - marker: b
    text: A expressão “fique com o rei” pode significar permanecer sob a autoridade real vigente em Jerusalém; o hebraico não identifica explicitamente a quem “o rei” se refere.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “e também você é um exilado para o seu lugar”. O hebraico é condensado; a função de “para” nesta expressão é discutida e pode destacar tanto a condição de deslocado de Itai quanto sua ligação com seu próprio lugar ou terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa a sequência com naturalidade. Mantém-se o título “o rei”, sem substituí-lo por “Davi”.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, o geteu
  rationale: O nome é transliterado, e o gentílico tradicional “geteu” identifica alguém de Gate.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Por que você também iria conosco?
  rationale: O condicional “iria” comunica, em português corrente, a pergunta deliberativa ou dissuasiva no contexto, enquanto “também” preserva גַּם. A possibilidade futura mais formal é registrada em nota.
- source_word: שׁוּב וְשֵׁב
  choice: Volte e fique
  rationale: Os dois imperativos são preservados. Aqui ישׁב significa permanecer, não literalmente sentar-se.
- source_word: עִם הַמֶּלֶךְ
  choice: com o rei
  rationale: A formulação literal conserva o referente implícito e potencialmente ambíguo do hebraico, que repete o título sem citar um nome.
- source_word: כִּי נָכְרִי אַתָּה
  choice: pois você é estrangeiro
  rationale: “Pois” introduz a razão das ordens; “estrangeiro” expressa a condição de não natural do lugar sem sugerir apenas desconhecimento pessoal.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: e também está exilado, longe do seu lugar
  rationale: A tradução comunica a condição de deslocamento indicada por גֹּלֶה e a relação com o lugar próprio, mas evita fazer da preposição לְ uma indicação inequívoca de origem. A formulação hebraica comprimida e sua alternativa mais literal são registradas em nota.
theological_decisions:
- issue: Referente de “o rei” em “fique com o rei”
  choice: Manter “com o rei” sem identificar o referente no texto principal.
  alternative: “com o rei Absalão”, “com o rei em Jerusalém” ou “comigo, o rei”
  rationale: O hebraico emprega o título e não explicita a pessoa referida. Identificá-la eliminaria uma ambiguidade genuína.
- issue: Relação do exílio de Itai com “seu lugar”
  choice: Expressar seu deslocamento como “exilado, longe do seu lugar”, acompanhando-o de nota.
  alternative: “um exilado para o seu lugar” ou “exilado de sua terra”
  rationale: A construção hebraica com לְ é concisa e difícil. A opção principal oferece português inteligível sem transformar silenciosamente a preposição em uma indicação inequívoca de origem; a nota conserva a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A pontuação favorece a leitura oral; as notas preservam as ambiguidades do hebraico sem sobrecarregar o versículo.
