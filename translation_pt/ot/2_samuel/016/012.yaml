  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: pt
  text: Talvez Yahweh veja a minha aflição[a], e Yahweh me retribua com o bem em lugar da maldição dele neste dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo a forma escrita: “a minha iniquidade”.'
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez
  rationale: Expressa a esperança incerta de Davi sem transformá-la em confiança categórica.
- source_word: יִרְאֶה
  choice: olhe para
  rationale: Preserva a imagem concreta de ver e, no contexto, comunica que Yahweh nota e considera a situação de Davi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: ב/עונ/י
  choice: a minha aflição
  rationale: Segue a leitura tradicional e se ajusta ao sofrimento e à humilhação que Davi enfrenta no contexto; a forma escrita alternativa é preservada em nota.
- source_word: וְהֵשִׁיב ... לִי טוֹבָה
  choice: me retribua com o bem
  rationale: O hifil de שוב, com 'bem' como objeto, comunica aqui uma retribuição favorável concedida a Davi.
- source_word: תַּחַת
  choice: em troca de
  rationale: 'Expressa substituição ou compensação: o bem concedido em resposta à maldição sofrida.'
- source_word: קִלְלָתוֹ
  choice: a maldição que ele proferiu
  rationale: Torna natural em português a ação verbal implícita no substantivo hebraico e mantém a referência ao ato de amaldiçoar de Simei.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente português corrente e claro para a expressão temporal enfática no contexto narrativo.
theological_decisions:
- issue: Leitura de ב/עונ/י segundo o ketiv/qere
  choice: a minha aflição
  alternative: a minha iniquidade
  rationale: A leitura tradicional e o contexto imediato favorecem a aflição de Davi sob as injúrias de Simei. Contudo, a forma consonantal escrita pode indicar 'minha iniquidade'; por isso, a tensão textual e interpretativa é mantida em nota, sem ser eliminada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Yahweh” foi mantida por corresponder à repetição enfática do hebraico; “hoje” evita a artificialidade de “neste dia” sem perder o sentido temporal.
