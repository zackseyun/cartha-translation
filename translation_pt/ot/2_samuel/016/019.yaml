base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: pt
  text: E, em segundo lugar, a quem devo servir? Não deveria eu servir diante do filho dele?[a] Assim como servi diante de seu pai, assim estarei diante de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “diante do filho dele... diante de seu pai... diante de você”; é uma expressão da corte para servir na presença de um rei ou sob sua autoridade.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: E, em segundo lugar
  rationale: Funciona como marcador discursivo que introduz o segundo argumento de Husai; a expressão é natural em português e evita o sentido temporal de “pela segunda vez”.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: a quem devo servir?
  rationale: Neste contexto de corte, עבד indica serviço e lealdade a um governante. “Devo servir” expressa naturalmente a força deliberativa da pergunta retórica.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Não deve ser diante do filho dele?
  rationale: הֲלוֹא espera resposta afirmativa, e “diante do” conserva o idioma cortesão לִפְנֵי e sua repetição no versículo. “Dele” mantém distinta a referência a Davi, enquanto o interlocutor é tratado por “você”.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Assim como servi diante de seu pai
  rationale: Preserva o verbo “servir” e o idioma régio “diante de”, com linguagem clara e digna.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: assim estarei diante de você
  rationale: Mantém a mudança do hebraico de עבד, “servir”, para היה, “estar/ser”, sem acrescentar uma segunda ocorrência de “servir”, e conserva o paralelismo cortesão.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva a repetição intencional de “diante de” e a mudança final de “servi” para “estarei”, embora explique em nota o valor cortesão da expressão.
