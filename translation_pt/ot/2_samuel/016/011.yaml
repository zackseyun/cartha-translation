base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: pt
  text: 'Então Davi disse a Abisai e a todos os seus servos: “Vejam! Meu filho, que saiu do meu próprio corpo, procura tirar-me a vida; quanto mais agora este benjamita! Deixem-no em paz e deixem que amaldiçoe, pois Yahweh lhe disse.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pois Yahweh lhe disse”. O hebraico não declara o conteúdo do que foi dito, mas o contexto indica que se trata de amaldiçoar.'
    reason: Registra a formulação elíptica do hebraico e evita explicitar no texto principal um conteúdo apenas inferido do contexto.
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Mantém a força enfática e de chamada de atenção do hebraico, em linguagem portuguesa atual e natural diante de vários ouvintes.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: meu filho, que saiu do meu próprio corpo
  rationale: Preserva a imagem corporal e a ideia de descendência natural sem empregar literalmente “ventre”, que seria inadequado na fala de Davi, nem a expressão menos acessível “minhas entranhas”.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: procura tirar-me a vida
  rationale: Expressa com clareza o sentido idiomático de buscar a vida de alguém, isto é, tentar matá-lo, sem perder a referência explícita à vida.
- source_word: וְאַף כִּי עַתָּה
  choice: quanto mais agora
  rationale: 'Reproduz o argumento intensificado de Davi: se até seu próprio filho busca matá-lo, tanto mais seria esperável a hostilidade desse benjamita.'
- source_word: בֶּן הַיְמִינִי
  choice: este benjamita
  rationale: Identifica de modo conciso e convencional alguém pertencente à tribo de Benjamim.
- source_word: הַנִּחוּ לוֹ
  choice: Deixem-no em paz
  rationale: O imperativo plural dirige-se aos homens de Davi e ordena que não interfiram.
- source_word: וִיקַלֵּל
  choice: e deixem que amaldiçoe
  rationale: Traduz a continuação de valor permissivo após o imperativo, conservando a ordem de Davi para permitir que Simei continue sua ação.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: pois Yahweh lhe disse que o fizesse
  rationale: Torna explícito no texto principal o complemento implícito pelo contexto — amaldiçoar — enquanto a nota registra a forma mais literal e sua ambiguidade sintática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Se a fala de Davi atribui a maldição de Simei a uma ordem divina direta ou apenas à permissão/providência divina
  choice: pois Yahweh lhe disse que o fizesse
  alternative: 'pois Yahweh o permitiu; pois Yahweh lhe disse: “Amaldiçoe Davi”'
  rationale: A fala de Davi atribui diretamente a ação a Yahweh. A tradução conserva essa tensão teológica, sem atenuá-la para mera permissão e sem inserir uma citação explícita que não aparece neste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O discurso mantém a intensidade retórica de Davi, e o plural dos imperativos deixa claro que ele se dirige a Abisai e aos demais servos.
