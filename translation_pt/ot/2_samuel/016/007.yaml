  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: pt
  text: 'E Simei dizia, enquanto o amaldiçoava: “Fora! Fora, homem de sangue[a] e homem perverso[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem culpado de derramamento de sangue”. A expressão hebraica diz literalmente “homem de sangues” e pode indicar culpa de sangue ou derramamento de sangue.
    reason: lexical_alternative
  - marker: b
    text: Ou “homem imprestável”. O termo hebraico é uma designação de vileza ou perversidade, não necessariamente o nome próprio “Belial”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹה אָמַר
  choice: E Simei dizia assim
  rationale: A fórmula introduz o conteúdo ou modo da fala. O imperfeito narrativo, junto da ação simultânea, admite naturalmente “dizia assim” em português.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בְּקַלְלוֹ
  choice: enquanto o amaldiçoava
  rationale: A preposição com o infinitivo construto e o sufixo expressa ação simultânea; o pronome retoma Davi no contexto.
- source_word: צֵא צֵא
  choice: Fora! Fora
  rationale: A repetição intensifica a ordem de afastamento e o repúdio. “Fora!” reproduz com naturalidade a força do imperativo no insulto português.
- source_word: אִישׁ הַדָּמִים
  choice: homem de sangue
  rationale: Mantém a forma idiomática hebraica e sua ambiguidade entre culpa de sangue e envolvimento em derramamento de sangue; a nota esclarece o sentido.
- source_word: וְאִישׁ הַבְּלִיָּעַל
  choice: homem perverso
  rationale: Aqui בְּלִיַּעַל funciona como designação depreciativa de uma pessoa moralmente vil ou perversa, não necessariamente como nome próprio. A repetição de “homem” preserva o paralelismo.
theological_decisions:
- issue: Sentido de אִישׁ הַדָּמִים
  choice: homem de sangue
  alternative: homem sanguinário; homem culpado de derramamento de sangue
  rationale: A expressão hebraica usa literalmente o plural “sangues” e pode apontar para culpa de sangue ou derramamento de sangue. A tradução mantém a tensão sem atribuir necessariamente a Davi uma motivação sanguinária.
- issue: Interpretação de בְּלִיַּעַל
  choice: 'termo comum de censura moral: “homem perverso”'
  alternative: homem imprestável; homem de Belial
  rationale: No uso veterotestamentário deste contexto, a palavra caracteriza vileza ou perversidade. “Belial” poderia importar uma personificação demoníaca posterior não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Fora! Fora” conserva a veemência da repetição hebraica; “homem de sangue” preserva a expressão fonte e sua tensão sem a transformar em linguagem excessivamente coloquial.
