  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: pt
  text: Absalão e todo o povo[a], os homens de Israel, chegaram a Jerusalém; e Aitofel estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “todo o povo, cada homem de Israel” ou “todo o povo, os homens de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: Absalão
  rationale: Usa a forma portuguesa tradicional do nome; a conjunção hebraica é expressa na coordenação seguinte, sem acrescentar um marcador temporal inexistente no texto.
- source_word: וְ/כָל הָ/עָם֙
  choice: e todo o povo
  rationale: עָם designa naturalmente o povo ou grupo que acompanhava Absalão; “exército” seria específico demais.
- source_word: אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: os homens de Israel
  rationale: Conserva a forma masculina e coletiva da expressão hebraica, em aposição a “todo o povo”, sem eliminar sua possível nuance distributiva.
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: chegaram a Jerusalém
  rationale: בוא pode significar vir, entrar ou chegar; em português, “chegaram a Jerusalém” exprime com naturalidade o movimento até o destino.
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: e Aitofel estava com ele
  rationale: A oração hebraica requer em português a explicitação natural de “estava”; no contexto, “ele” se refere mais naturalmente a Absalão.
