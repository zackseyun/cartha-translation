revisions:
- from: 'Então o rei perguntou a Ziba: “Para que são estas coisas?”[a] Ziba respondeu: “Os jumentos são para a família do rei montar; o pão e as frutas de verão[b] são para os jovens[c] comerem; e o vinho é para quem estiver cansado no deserto beber.”'
  to: 'Então o rei perguntou a Ziba: “Para que servem estas coisas?”[a] Ziba respondeu: “Os jumentos são para os da casa do rei montarem; o pão e as frutas de verão[b] são para os jovens[c] comerem; e o vinho é para quem estiver cansado no deserto beber.”'
  rationale: A revisão substitui “família do rei” por “os da casa do rei”, preservando o alcance coletivo de בֵּית sem reduzir o grupo a parentes consanguíneos. Também ajusta a pergunta inicial para uma construção mais idiomática em português, sem alterar a ambiguidade registrada na nota. As âncoras e suas notas correspondentes foram mantidas.
