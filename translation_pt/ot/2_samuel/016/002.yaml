base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: pt
  text: 'Então o rei perguntou a Ziba: “Para que servem estas coisas?”[a] Ziba respondeu: “Os jumentos são para os da casa do rei montarem; o pão e as frutas de verão[b] são para os jovens[c] comerem; e o vinho é para quem estiver cansado no deserto beber.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que você pretende com estas coisas?” O idioma hebraico pergunta literalmente: “O que são estas coisas para você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os produtos do verão”. O termo hebraico pode designar de modo amplo os frutos ou produtos colhidos no verão.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os ajudantes” ou “os servos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Para que são estas coisas?
  rationale: Expressa em português natural a pergunta idiomática hebraica sobre a finalidade dos itens, sem eliminar a alternativa de sentido registrada em nota.
- source_word: הַחֲמוֹרִים
  choice: os jumentos
  rationale: Termo corrente e claro em português para os animais mencionados.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: para a família do rei
  rationale: בֵּית designa aqui o grupo pertencente à casa real, e não um edifício; “família” é natural e suficientemente abrangente no contexto.
- source_word: לִרְכֹּב
  choice: montar
  rationale: Verbo idiomático em português quando o animal montado já foi mencionado.
- source_word: הַלֶּחֶם
  choice: o pão
  rationale: Mantém o sentido lexical direto e a distinção em relação às frutas mencionadas em seguida.
- source_word: הַקַּיִץ
  choice: as frutas de verão
  rationale: Preserva a referência ampla à produção frutífera colhida no verão, sem especificar indevidamente figos.
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: Reproduz o sentido lexical básico, deixando em nota as possibilidades contextuais de ajudantes ou servos.
- source_word: הַיָּעֵף
  choice: quem estiver cansado
  rationale: Transmite de modo natural o adjetivo singular substantivado com valor genérico, aplicável à pessoa cansada.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Equivalente corrente em português para a região erma do cenário, sem exigir a ideia de terreno exclusivamente arenoso.
