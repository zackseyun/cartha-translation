  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: pt
  text: O rei e todo o povo que estava com ele chegaram cansados, e ele recuperou as forças ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico está no singular: “ele recuperou as forças”. Alguns o entendem em sentido coletivo: “eles recuperaram as forças”; também pode ser traduzido por “ele descansou”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegaram
  rationale: בוא pode significar “vir” ou “chegar”. O plural em português faz concordância natural com o sujeito composto (“o rei e todo o povo”), embora o hebraico empregue o singular, como é possível quando o verbo antecede esse tipo de sujeito.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico, sem substituir explicitamente pelo nome de Davi.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: e todo o povo que estava com ele
  rationale: Reproduz claramente a oração relativa do hebraico em português natural.
- source_word: עֲיֵפִים
  choice: exaustos
  rationale: O adjetivo plural indica cansaço físico intenso; “exaustos” é atual, claro e concorda com o grupo inteiro.
- source_word: וַיִּנָּפֵשׁ
  choice: ele recuperou as forças
  rationale: Preserva o verbo singular hebraico e expressa a ideia de recobrar o fôlego ou revigorar-se, sem reduzi-la simplesmente a dormir ou parar.
- source_word: שָׁם
  choice: ali
  rationale: Equivalente adverbial natural para indicar o lugar já referido no contexto.
theological_decisions:
- issue: Referente do singular וַיִּנָּפֵשׁ após a chegada do rei e do povo
  choice: ele recuperou as forças
  alternative: eles recuperaram as forças
  rationale: O texto massorético traz inequivocamente um verbo masculino singular. A tradução o conserva, tomando o rei como referente mais imediato, e registra em nota a possibilidade de sentido coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e conserva no texto principal o singular do hebraico, deixando explícitas na nota tanto a leitura coletiva quanto a alternativa lexical “descansou”.
