base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: pt
  text: Assim, Davi e seus homens seguiram pelo caminho, enquanto Simei avançava pela encosta do monte, do lado oposto a ele, seguindo e amaldiçoando, atirando pedras na direção dele e lançando poeira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: pelo caminho
  rationale: דֶּרֶךְ designa caminho, estrada ou rota; a expressão portuguesa é natural e mantém o cenário concreto do deslocamento de Davi.
- source_word: בְּצֵלַע הָהָר
  choice: pela encosta do monte
  rationale: צֵלַע indica o lado ou flanco; com הָהָר, descreve a encosta pela qual Simei avançava.
- source_word: לְעֻמָּתוֹ
  choice: do lado oposto a ele / na direção dele
  rationale: A primeira ocorrência estabelece a posição de Simei em relação a Davi. Na segunda, junto ao lançamento de pedras, 'na direção dele' conserva a orientação espacial sem afirmar de modo indevido que as pedras o atingiram.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: avançava ... seguindo
  rationale: A repetição do verbo de movimento comunica ação contínua; a formulação preserva essa duração de maneira compreensível em português.
- source_word: וַיְקַלֵּל
  choice: amaldiçoando
  rationale: No piel, קלל significa amaldiçoar; o gerúndio integra a ação ao movimento contínuo de Simei.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: atirando pedras
  rationale: No contexto, trata-se de agressão e hostilidade à distância, não de uma execução formal por apedrejamento.
- source_word: וְעִפַּר בֶּעָפָר
  choice: lançando poeira
  rationale: A expressão descreve o ato hostil de arremessar poeira ou terra solta; 'lançando poeira' é claro e digno.
- source_word: וַאֲנָשָׁיו
  choice: seus homens
  rationale: No contexto narrativo, refere-se aos companheiros ou seguidores masculinos de Davi.
- source_word: וַיֵּלֶךְ
  choice: seguiram
  rationale: O verbo expressa a continuação do percurso; o plural em português acomoda naturalmente o sujeito composto 'Davi e seus homens'.
