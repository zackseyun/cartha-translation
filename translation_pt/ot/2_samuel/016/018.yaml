  naturalness: O português é claro, moderno e de registro apropriado. «Não! Pois pertencerei...» mantém a fala direta e dá à transição uma ligação mais natural e mais próxima do hebraico do que a simples justaposição após «Não!».
  terminology: «Yahweh» é consistente com a decisão terminológica fornecida. «Todos os homens de Israel» é natural e conserva a referência masculina; a nota literal explica adequadamente o singular distributivo hebraico. «Permanecerei» expressa bem o sentido contextual de יָשַׁב.
