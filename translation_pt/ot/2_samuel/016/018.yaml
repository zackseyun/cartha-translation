source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: pt
  text: 'Husai disse a Absalão: “Não! Pois pertencerei[d] àquele que Yahweh, este povo e todos os homens de Israel escolheram[a][b], e com ele permanecerei[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “àquele que Yahweh, este povo e todos os homens de Israel escolherem”.'
    reason: O valor temporal da forma hebraica pode ser entendido como escolha já feita ou, no contexto retórico de Husai, formulado de maneira mais aberta.
  - marker: b
    text: 'Hebraico, literalmente: “e todo homem de Israel”.'
    reason: Registra a forma distributiva singular da expressão hebraica, vertida coletivamente no texto principal.
  - marker: c
    text: 'Ou: “ficarei”.'
    reason: O verbo hebraico pode indicar permanecer, ficar ou residir com alguém; “permanecerei” destaca a continuidade da lealdade.
  - marker: d
    text: O texto consonantal hebraico traz “não”; a leitura tradicional entende “a ele/dele”, sentido seguido aqui.
    reason: Assinala a diferença entre a forma consonantal e a leitura tradicional que sustenta a declaração positiva de lealdade.
lexical_decisions:
- source_word: לֹא כִּי
  choice: Não!
  rationale: A expressão introduz uma rejeição enfática da suspeita de Absalão e, em seguida, uma correção. Em português, “Não!” transmite naturalmente essa força; a explicação vem na frase seguinte sem necessidade de tornar כִּי explicitamente causal.
- source_word: אֲשֶׁר בָּחַר
  choice: àquele que ... escolheram
  rationale: A oração relativa aponta para uma pessoa específica já em vista. O perfeito בָּחַר é vertido pelo pretérito perfeito, enquanto a nota registra a possibilidade de entender a formulação em sentido aberto ou prospectivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular e o demonstrativo do hebraico em linguagem portuguesa natural.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: e todos os homens de Israel
  rationale: Expressa de modo natural em português o sentido coletivo-distributivo de “todo homem de Israel”, sem neutralizar a forma masculina do texto.
- source_word: לא אֶהְיֶה
  choice: Pertencerei
  rationale: Segue a leitura tradicional לו אֶהְיֶה, “serei para ele/dele”, entendida no contexto como declaração de lealdade. “Pertencerei” torna explícito o sentido idiomático sem acrescentar uma relação não sugerida pelo contexto.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: e com ele permanecerei
  rationale: Embora יָשַׁב possa significar literalmente “sentar-se”, aqui denota permanência e associação continuada; “permanecerei” se ajusta à promessa de lealdade de Husai.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o nome divino. A transliteração “Yahweh” conserva seu caráter de nome próprio e evita substituí-lo por um título.
- issue: Expressão masculina אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  alternative: todos os israelitas; todo o Israel
  rationale: A escolha mantém a referência masculina explícita do hebraico e comunica com naturalidade seu valor coletivo-distributivo.
- issue: Leitura de לא antes de אֶהְיֶה
  choice: Seguir a leitura tradicional לו, “a ele/dele”
  alternative: Ler o texto consonantal לא, “não”
  rationale: A leitura massorética tradicional e o contexto produzem a declaração coerente “pertencerei a ele”. A forma consonantal לא criaria uma negação difícil e provavelmente representa uma variante ortográfica preservada pela tradição textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala é direta e enfática, sem arcaísmos. A ordem dos constituintes foi levemente ajustada para fluência, mantendo a ambiguidade temporal relevante em nota.
