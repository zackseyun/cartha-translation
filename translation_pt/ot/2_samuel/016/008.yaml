base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: pt
  text: 'Yahweh fez recair sobre você todo o sangue da casa de Saul[a], em cujo lugar você reinou, e Yahweh entregou o reino nas mãos de Absalão, seu filho. E veja: você está em sua desgraça[b], porque é um homem de sangue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o derramamento de sangue da casa de Saul” ou “toda a culpa de sangue da casa de Saul”. O hebraico diz literalmente “todos os sangues da casa de Saul”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em seu mal”. O termo hebraico pode indicar tanto mal moral quanto desgraça ou calamidade; aqui provavelmente se refere à desgraça que sobreveio a Davi.'
    reason: lexical_alternative
  - marker: c
    text: “Homem de sangue” é uma expressão que pode designar alguém marcado por violência ou culpa de sangue; também se poderia traduzir “homem sanguinário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: fez recair sobre você
  rationale: O hifil de שוב indica fazer voltar ou recair. A formulação conserva a ideia de retribuição que retorna sobre Davi e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: todo o sangue da casa de Saul
  rationale: Mantém a imagem hebraica, cujo plural דמים pode denotar sangue derramado ou culpa de sangue; a nota registra essas possibilidades.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: em cujo lugar você reinou
  rationale: 'תחתיו indica sucessão: Davi reinou no lugar de Saul.'
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: entregou o reino nas mãos de
  rationale: Expressa de modo idiomático em português a transferência de domínio indicada pela imagem hebraica de dar na mão.
- source_word: וְהִנְּךָ
  choice: E veja
  rationale: Reproduz a partícula de chamada de atenção em linguagem moderna, sem recorrer ao arcaísmo 'eis'.
- source_word: בְּרָעָתֶךָ
  choice: em sua própria desgraça
  rationale: רעה pode indicar mal moral ou calamidade. No contexto, aponta provavelmente para a desgraça que atingiu Davi; 'própria' preserva o sufixo e o tom acusatório.
- source_word: אִישׁ דָּמִים
  choice: um homem de sangue
  rationale: Conserva o forte idioma hebraico, que caracteriza alguém pela violência ou culpa de sangue; a nota esclarece o sentido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de בְּרָעָתֶךָ
  choice: em sua própria desgraça
  alternative: em seu próprio mal
  rationale: A situação imediata é a calamidade causada pela revolta de Absalão. A tradução não transforma a acusação de Simei em juízo explícito do narrador, e a nota preserva a ambiguidade lexical.
- issue: Força de אִישׁ דָּמִים
  choice: um homem de sangue
  alternative: um homem sanguinário
  rationale: A forma mais literal preserva a abertura semântica entre violência e culpa de sangue, em vez de limitar a expressão a uma disposição sanguinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' na acusação direta, evita arcaísmos e mantém as imagens hebraicas quando elas continuam inteligíveis, esclarecendo ambiguidades reais em notas.
