  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: pt
  text: 'Quando Husai, o arquita, amigo de Davi, chegou até Absalão, Husai lhe disse: “Viva o rei! Viva o rei!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que viva o rei!” No hebraico, esta é uma aclamação régia.'
    reason: Alternativa lexical que explicita a força jussiva da expressão hebraica.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento seguinte; “Quando” expressa com naturalidade a relação temporal sem reproduzir de modo rígido “e aconteceu quando”.
- source_word: בָּא
  choice: chegou
  rationale: O verbo comum de movimento indica aqui a chegada de Husai à presença de Absalão.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, o arquita
  rationale: O nome próprio é transliterado na forma corrente em português, e o gentílico הָאַרְכִּי é vertido como “arquita”.
- source_word: רֵעֶה דָוִד
  choice: amigo de Davi
  rationale: A construção indica a relação pessoal e política de Husai com Davi; “amigo de Davi” é clara e natural.
- source_word: אֶל אַבְשָׁלוֹם
  choice: até Absalão / a Absalão
  rationale: A preposição אֶל indica direção tanto na chegada quanto na fala; as duas ocorrências foram expressas de maneira idiomática conforme seus contextos.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É a tradução comum e direta de אמר ao introduzir discurso direto.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Viva o rei!
  rationale: A forma jussiva funciona como aclamação régia. “Viva o rei!” é a fórmula idiomática correspondente em português.
- source_word: יְחִי הַמֶּלֶךְ (repetido)
  choice: Viva o rei! Viva o rei!
  rationale: A repetição do hebraico é mantida por sua ênfase pública e por contribuir para a ambiguidade narrativa da lealdade de Husai.
theological_decisions:
- issue: Ambiguidade da aclamação de Husai a Absalão
  choice: Manter a aclamação régia sem explicitar ironia ou engano
  alternative: Acrescentar linguagem que indique intenção enganosa ou tom irônico
  rationale: O versículo apresenta as palavras de Husai como uma aclamação régia convencional. O contexto mais amplo revela sua lealdade ambígua, mas a tradução preserva essa tensão em vez de resolvê-la interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de ampla legibilidade brasileira. A repetição enfática do original foi preservada; o pronome “lhe” evita uma repetição pesada da preposição sem eliminar a repetição enfática do nome Husai presente na narrativa.
