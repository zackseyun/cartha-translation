base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: pt
  text: 'Absalão disse a Husai: “É essa a sua lealdade[a] para com o seu amigo? Por que você não foi com o seu amigo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondade” ou “amor fiel”, em lugar de “lealdade” (hebraico חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: a sua lealdade
  rationale: Neste contexto, חֶסֶד se refere à fidelidade relacional e política que Absalão esperava que Husai demonstrasse a Davi. “Lealdade” comunica melhor essa acusação, sem introduzir necessariamente uma conotação teológica de aliança.
- source_word: רֵעֶךָ
  choice: o seu amigo
  rationale: רֵעַ pode significar amigo, companheiro ou associado. Aqui designa Davi segundo a perspectiva de Absalão; “amigo” é natural em português e preserva a repetição enfática do hebraico.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Por que você não foi com o seu amigo?
  rationale: הלך com אֶת expressa aqui a ideia de acompanhar alguém. “Foi com” preserva a simplicidade verbal do hebraico e soa natural em português.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: É essa a sua lealdade para com o seu amigo?
  rationale: A frase hebraica é nominal e funciona como pergunta retórica. O verbo “é”, necessário em português, transmite o desafio incrédulo de Absalão; “para com” expressa a conduta relacional dirigida ao amigo.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Embora a fala contenha perguntas, וַיֹּאמֶר é o verbo narrativo comum “disse”; a pontuação da citação deixa claro o caráter interrogativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “você” torna a fala direta e natural; a repetição de “seu amigo” foi mantida por corresponder à ênfase retórica do hebraico.
