  text: Then Absalom said to Ahithophel, “Give your advice. What should we do?”
translation:
  language: pt
  text: 'Então Absalão disse a Aitofel: “Deem o seu conselho. O que devemos fazer?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ לָכֶם עֵצָה
  choice: Deem o seu conselho
  rationale: A expressão hebraica usa formas no plural, dirigidas a Aitofel e possivelmente aos conselheiros presentes. A tradução preserva esse plural e verte עֵצָה naturalmente como “conselho”.
- source_word: מַה נַּעֲשֶׂה
  choice: O que devemos fazer?
  rationale: A forma verbal na primeira pessoa do plural expressa deliberação sobre o curso de ação do grupo; “devemos fazer” comunica isso em português corrente.
theological_decisions:
- issue: Número dos destinatários na ordem dirigida nominalmente a Aitofel
  choice: 'Manter o plural: “Deem o seu conselho”'
  alternative: “Dê o seu conselho”
  rationale: Embora Aitofel seja nomeado no singular, o texto massorético traz imperativo e pronome no plural. A tradução conserva essa tensão gramatical sem restringir silenciosamente o enunciado a um único destinatário.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O nome אַבְשָׁלוֹם é apresentado na forma portuguesa tradicional “Absalão”, e אֲחִיתֹפֶל como “Aitofel”.
