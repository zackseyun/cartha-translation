base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: pt
  text: 'Então o rei disse: “E onde está o filho do seu senhor?” Ziba respondeu ao rei: “Veja, ele permanece[a] em Jerusalém, pois disse: ‘Hoje a casa de Israel me devolverá o reino de meu pai.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está morando”. O particípio hebraico pode indicar residência contínua ou permanência em um lugar, não apenas o ato literal de estar sentado.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “disse” corresponde ao verbo hebraico sem transformar explicitamente a fala em outro verbo.
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: E onde está o filho do seu senhor?
  rationale: Mantém o conectivo hebraico e traduz אֲדֹנֶיךָ como referência ao senhor humano de Ziba, sem conotação divina.
- source_word: צִיבָא
  choice: Ziba
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: הִנֵּה
  choice: Veja
  rationale: Reproduz de modo atual a força dêitica e discursiva da partícula, evitando o arcaísmo “eis”.
- source_word: יוֹשֵׁב
  choice: permanece
  rationale: Neste contexto, o particípio de ישׁב indica ficar ou residir em determinado lugar, e não necessariamente estar literalmente sentado.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Forma portuguesa convencional do topônimo com a preposição exigida pelo contexto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que Ziba atribui à permanência do filho de seu senhor em Jerusalém.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Equivalente temporal direto e idiomático em português.
- source_word: יָשִׁיבוּ לִי
  choice: me devolverá
  rationale: O hifil de שוב comunica fazer voltar ou restituir; “me devolverá” é claro e natural com o objeto “o reino de meu pai”. O singular concorda em português com o sujeito coletivo “a casa de Israel”.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão corporativa e nacional do hebraico em vez de reduzi-la simplesmente a “Israel”.
- source_word: אֵת מַמְלְכוּת אָבִי
  choice: o reino de meu pai
  rationale: Mantém de perto a construção nominal do texto hebraico com linguagem natural em português.
theological_decisions:
- issue: Relato de Ziba sobre a intenção do filho de seu senhor
  choice: Apresentar diretamente a acusação como fala relatada por Ziba, sem confirmar sua veracidade.
  alternative: Acrescentar distanciamento interpretativo, como “alegou” ou “teria dito”.
  rationale: O hebraico apenas registra o que Ziba disse ao rei. Inserir dúvida explícita ou endosso resolveria antecipadamente uma tensão que deve ser avaliada pelo contexto narrativo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a sequência narrativa, a expressão coletiva “casa de Israel” e o caráter de fala relatada da acusação de Ziba.
