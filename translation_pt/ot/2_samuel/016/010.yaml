base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: pt
  text: 'Mas o rei disse: “O que eu tenho a ver com vocês, filhos de Zeruia? Se ele está amaldiçoando porque Yahweh lhe disse: ‘Amaldiçoe Davi’, quem poderá dizer: ‘Por que você fez isso?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ele está amaldiçoando porque Yahweh lhe disse: ‘Amaldiçoe Davi’. Quem, então, poderá dizer: ‘Por que você fez isso?’” As partículas hebraicas também podem ser entendidas em sentido explicativo, e não condicional.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: O que eu tenho a ver com vocês
  rationale: Reproduz de modo natural o idiomatismo hebraico de distanciamento e repreensão, sem convertê-lo em pergunta literal sobre posse.
- source_word: בְּנֵי צְרֻיָה
  choice: filhos de Zeruia
  rationale: Mantém a identificação de Joabe e Abisai pelo nome de sua mãe, com a forma portuguesa tradicional do nome.
- source_word: יְקַלֵּל / קַלֵּל
  choice: está amaldiçoando / Amaldiçoe
  rationale: Preserva a ligação lexical entre a ação presente e a ordem citada, além do sentido de proferir maldição ou insultos contra Davi.
- source_word: כִּי ... וְכִי
  choice: Se ... porque
  rationale: Entende as partículas como introduzindo uma hipótese e sua causa, leitura coerente com a argumentação de Davi, sem ocultar a possibilidade explicativa registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּמִי יֹאמַר
  choice: quem poderá perguntar
  rationale: 'Expressa a força retórica da frase: ninguém estaria em posição de questionar a ação caso ela decorresse de uma ordem de Yahweh.'
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Por que você fez isso?
  rationale: Formulação portuguesa direta e natural para o desafio retórico.
theological_decisions:
- issue: Envolvimento divino na maldição pronunciada por Simei
  choice: Apresentar como possibilidade que Yahweh tenha ordenado a Simei que amaldiçoasse Davi
  alternative: 'Entender a construção de forma explicativa e mais categórica: “Pois ele está amaldiçoando porque Yahweh lhe disse...”'
  rationale: O hebraico atribui a Yahweh a fala “Amaldiçoe Davi”, mas a sintaxe das partículas admite leitura condicional ou explicativa. A tradução principal conserva a tensão sem reduzir a ordem a mera permissão nem afirmar além da ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O tratamento por “vocês” marca naturalmente o plural dirigido aos filhos de Zeruia; “você” na pergunta citada é singular. O marcador de nota foi colocado após o versículo e corresponde à alternativa sintática.
