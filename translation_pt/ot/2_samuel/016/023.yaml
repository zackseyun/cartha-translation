  - severity: medium
    issue: Alternativa da nota de rodapé pouco natural e lexicalmente imprecisa
    rationale: “Consultar uma palavra de Deus” não é construção idiomática em português. A expressão hebraica admite o sentido de consultar a Deus acerca de uma questão; a nota deve apresentar essa possibilidade sem converter דבר em um objeto direto artificial.
