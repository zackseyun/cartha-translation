base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: pt
  text: O conselho que Aitofel dava naqueles dias era como se alguém consultasse a Deus[a]; assim era todo o conselho de Aitofel, tanto para Davi como para Absalão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como quando se consulta a Deus sobre uma questão”. A expressão hebraica descreve a busca de orientação divina; a comparação ressalta o quanto o conselho de Aitofel era estimado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת אֲחִיתֹפֶל אֲשֶׁר יָעַץ
  choice: o conselho que Aitofel dava
  rationale: Expressa naturalmente em português a relação entre o substantivo עֵצָה e o verbo יָעַץ, preservando o sentido de orientação oferecida por um conselheiro.
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Equivalente temporal direto, corrente e digno; não acrescenta um marcador discursivo sem base explícita.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: como se alguém consultasse a Deus
  rationale: Comunica o sentido idiomático de buscar orientação divina sem transformar דָּבָר obrigatoriamente em uma referência técnica à Palavra de Deus. A alternativa mais literal é registrada em nota.
- source_word: כֵּן כָּל עֲצַת אֲחִיתֹפֶל
  choice: Assim era estimado todo conselho de Aitofel
  rationale: Torna explícita a ideia contextual de reputação implícita na comparação, evitando a construção pouco natural 'assim era todo conselho' em português.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: tanto por Davi como por Absalão
  rationale: O par 'tanto... como...' reproduz גַּם...גַּם. 'Por' se ajusta a 'era estimado' e deixa claro que ambos tinham o conselho em alta conta.
theological_decisions:
- issue: Força da comparação com a consulta a Deus
  choice: O conselho de Aitofel era considerado como se alguém consultasse a Deus.
  alternative: Seu conselho era propriamente uma revelação ou um oráculo divino.
  rationale: O hebraico estabelece uma comparação, não uma identificação. A redação preserva o peso extraordinário atribuído ao conselho sem afirmar que ele fosse inspirado.
- issue: Sentido de בִּדְבַר הָאֱלֹהִים
  choice: consultasse a Deus
  alternative: consultasse uma palavra de Deus
  rationale: A expressão pode funcionar idiomaticamente para buscar orientação de Deus. Como a formulação lexical mais explícita continua possível, ela é preservada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência. 'Aitofel' e 'Absalão' seguem formas portuguesas tradicionais. A explicitação 'era considerado/estimado' comunica a força pragmática da comparação sem atribuir inspiração divina a Aitofel.
