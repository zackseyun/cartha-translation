base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: pt
  text: 'Então o rei disse a Ziba: “Veja, tudo o que pertence a Mefibosete é seu.” Ziba respondeu: “Eu me curvo diante do senhor. Que eu encontre favor aos seus olhos, meu senhor, o rei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Pois bem
  rationale: No contexto, introduz solenemente a decisão do rei; “pois bem” soa natural em português e mantém a força discursiva sem o arcaísmo de “eis”.
- source_word: לְךָ כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: tudo o que pertencia a Mefibosete agora é seu
  rationale: Expressa com clareza a transferência decretada pelo rei. “Pertencia” reflete a relação possessiva indicada pela construção hebraica, e “agora” torna explícita apenas a mudança contextual, sem alterar seu sentido.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: Eu me curvo diante do senhor
  rationale: O verbo denota prostração ou reverência. Esta formulação preserva o gesto de submissão cortesã sem sugerir necessariamente adoração religiosa.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: Que eu encontre favor aos seus olhos
  rationale: Mantém a conhecida expressão idiomática hebraica e seu tom respeitoso.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor e rei
  rationale: Reproduz os dois elementos do tratamento honorífico em português natural, entendendo-os em aposição coordenada.
theological_decisions:
- issue: Natureza da reverência de Ziba
  choice: Eu me curvo diante do senhor
  alternative: Eu o adoro
  rationale: O contexto é de submissão a um rei humano, não de culto; “curvar-se” conserva o sentido físico e cortesão do hebraico sem importar uma conclusão teológica indevida.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento respeitoso adequado à corte. A fala do rei é direta; a resposta de Ziba conserva o caráter formal e submisso do original.
