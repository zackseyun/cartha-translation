base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: pt
  text: Então armaram aquela tenda para Absalão no terraço, e Absalão teve relações com as concubinas de seu pai à vista de todo o Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de todo o Israel”; literalmente, “aos olhos de todo o Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: armaram
  rationale: O verbo נטה descreve aqui o ato de estender e montar uma tenda; “armaram” é a expressão portuguesa natural e precisa.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: O substantivo é definido no hebraico e se refere à tenda preparada para o ato público aconselhado no contexto.
- source_word: עַל הַגָּג
  choice: no terraço
  rationale: גָּג designa o teto plano utilizável das casas antigas. “Terraço” comunica essa realidade arquitetônica com naturalidade ao leitor moderno.
- source_word: וַיָּבֹא ... אֶל
  choice: teve relações com
  rationale: A construção é um eufemismo hebraico convencional para relações sexuais. Uma tradução apenas espacial, como “foi até”, ocultaria seu sentido em português moderno; a formulação escolhida é clara e digna.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: as concubinas de seu pai
  rationale: Reproduz diretamente a relação de posse expressa pela cadeia construta e mantém o contexto familiar e régio.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: à vista de todo o Israel
  rationale: Conserva a imagem de algo feito perante os olhos de Israel e destaca o caráter público e testemunhado do ato.
theological_decisions:
- issue: Tradução do eufemismo sexual no contexto da usurpação real
  choice: teve relações com
  alternative: entrou para junto das concubinas de seu pai
  rationale: O hebraico usa um eufemismo sexual conhecido, mas uma reprodução formal dessa construção seria ambígua ou pouco natural em português atual. A tradução explicita o sentido convencional sem empregar linguagem vulgar nem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Terraço” representa o teto plano e utilizável do cenário antigo; “teve relações com” comunica sem vulgaridade o eufemismo sexual hebraico.
