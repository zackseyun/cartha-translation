  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: pt
  text: 'Aitofel disse a Absalão: “Tenha relações com as concubinas de seu pai[a], que ele deixou para cuidar da casa, e todo Israel ouvirá que você se tornou odioso para seu pai[b], e todos os que estão com você ganharão coragem[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “entra a [elas]”; eufemismo comum para relações sexuais.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico evoca literalmente tornar-se malcheiroso e, em sentido figurado, repugnante ou odioso.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “as mãos de todos os que estão com você serão fortalecidas”, expressão que significa ganhar coragem ou determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Tenha relações com
  rationale: O hebraico emprega um eufemismo sexual. Em português atual, uma reprodução literal como “entre a” seria obscura; esta formulação comunica o sentido com sobriedade, e a nota registra o eufemismo original.
- source_word: פִּלַגְשֵׁי
  choice: concubinas
  rationale: É o equivalente português tradicional e preciso para mulheres reconhecidas no grupo familiar, mas de condição conjugal secundária.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: deixou para tomar conta do palácio
  rationale: “Tomar conta” expressa naturalmente a função de guardar/cuidar; neste contexto régio, הַבָּיִת designa o palácio ou a casa real.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Então todo o Israel ouvirá
  rationale: A sequência apresenta o resultado esperado do conselho; “todo o Israel” conserva a referência coletiva ao povo.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: você se tornou repugnante para seu pai
  rationale: Preserva a força figurada do verbo, que evoca tornar-se malcheiroso e, por extensão, odioso ou ofensivo, sem transformar a expressão em mero desacordo.
- source_word: וְחָזְקוּ יְדֵי
  choice: ganharão coragem
  rationale: Traduz de modo natural o idioma hebraico literalmente relacionado ao fortalecimento das mãos; a nota preserva sua imagem.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: todos os que estão com você
  rationale: Mantém a formulação relacional ampla do hebraico, sem restringi-la explicitamente a partidários políticos.
theological_decisions:
- issue: Eufemismo sexual no conselho político de Aitofel
  choice: Expressar sobriamente o sentido como “Tenha relações com”, registrando em nota a formulação hebraica.
  alternative: “Entre às concubinas de seu pai” ou “Durma com as concubinas de seu pai”.
  rationale: A formulação deve deixar claro o ato que assinalaria a ruptura pública e irreversível com Davi, sem crueza nem obscuridade artificial.
- issue: Força da ruptura entre Absalão e Davi
  choice: “se tornou repugnante para seu pai”
  alternative: “se tornou odioso para seu pai” ou “se fez detestável a seu pai”.
  rationale: A escolha conserva a forte imagem de repulsa no hebraico e não suaviza a dimensão social e política do ato.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. “Palácio” esclarece o referente régio de “casa”; “tenha relações” evita tanto a obscuridade de um decalque hebraico quanto uma formulação vulgar. As notas preservam as imagens e o eufemismo do texto-fonte.
