base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: pt
  text: Quando o rei Davi chegou a Baurim, eis que vinha saindo dali um homem do clã da casa de Saul, chamado Simei, filho de Gera. Ele continuava saindo e amaldiçoando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele saía repetidamente, amaldiçoando”. O hebraico intensifica o verbo “sair” por meio de um particípio seguido de um infinitivo absoluto, provavelmente indicando uma ação contínua ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Quando o rei Davi chegou a Baurim
  rationale: O waw com qatal faz a narrativa avançar, e עַד indica que Davi alcançou o lugar. A oração com “Quando” introduz naturalmente, em português, a cena que se segue.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a força vívida e apresentativa da expressão hebraica, que chama a atenção para um acontecimento repentino.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: vinha saindo dali um homem
  rationale: O particípio retrata a ação em andamento quando a cena se abre; “vinha saindo” preserva esse aspecto de modo natural.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: do clã da casa de Saul
  rationale: מִשְׁפָּחָה designa um grupo de parentesco, enquanto “casa de Saul” mantém o sentido familiar e dinástico de בֵּית.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: chamado Simei, filho de Gera
  rationale: Forma corrente e clara em português para a fórmula hebraica de identificação, sem perda de conteúdo.
- source_word: יֹצֵא יָצוֹא
  choice: continuava saindo
  rationale: A combinação de particípio com infinitivo absoluto intensifica a ação e provavelmente comunica continuidade ou repetição. A formulação mantém essa força sem imitar de modo artificial a sintaxe hebraica.
- source_word: וּמְקַלֵּל
  choice: e amaldiçoando
  rationale: O particípio apresenta o ato de amaldiçoar como simultâneo à saída contínua de Simei.
