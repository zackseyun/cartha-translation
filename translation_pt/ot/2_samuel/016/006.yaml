base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: pt
  text: E ele atirou pedras contra Davi e contra todos os servos do rei Davi[a], enquanto todo o povo e todos os guerreiros estavam à direita e à esquerda de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apedrejou Davi e todos os servos do rei Davi”. O verbo hebraico pode ser traduzido assim mais literalmente, mas aqui descreve o lançamento hostil de pedras, não necessariamente uma execução por apedrejamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: atirou pedras em
  rationale: O piel de סקל, com בָּאֲבָנִים, descreve o ato de lançar pedras contra alguém. “Atirou pedras em” comunica claramente a agressão contínua sem sugerir necessariamente uma execução formal por apedrejamento.
- source_word: עַבְדֵי
  choice: servos
  rationale: Neste contexto régio, עבד designa de modo amplo aqueles que estavam a serviço do rei. “Servos” preserva essa amplitude sem restringi-los a escravos ou autoridades.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: A expressão identifica Davi por seu título real; “o rei Davi” é natural e digna em português.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: עם tem o sentido amplo de “povo” ou grupo que acompanhava Davi, não necessariamente apenas tropas.
- source_word: הַגִּבֹּרִים
  choice: os guerreiros
  rationale: גִּבֹּרִים indica homens valentes e capazes em combate, possivelmente a tropa de elite de Davi. “Guerreiros” transmite a nuance militar em português corrente.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: à direita e à esquerda de Davi
  rationale: Os sufixos hebraicos significam literalmente “à direita dele e à esquerda dele”. Repetir “de Davi” evita em português a possível atribuição dessas posições a Simei, embora o referente contextual mais natural seja Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura mantém a progressão do hebraico, mas explicita Davi como referente final para evitar ambiguidade pronominal acidental em português. “Guerreiros” é preferido a “valentes” por tornar clara a função militar no contexto.
