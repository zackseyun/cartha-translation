base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: pt
  text: Quando Davi passou um pouco além do cume[a], eis que Ziba, servo[b] de Mefibosete, vinha ao seu encontro, com um par de jumentos selados. Sobre eles havia duzentos pães, cem cachos de passas, cem frutas de verão[c] e um odre de vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pouco depois do topo”. O hebraico diz literalmente “um pouco desde a cabeça”, usando “cabeça” para o cume de uma elevação.
    reason: lexical_alternative
  - marker: b
    text: “Servo” também pode ser traduzido como “jovem” ou “ajudante”; neste contexto, a função de Ziba junto a Mefibosete favorece “servo”.
    reason: lexical_alternative
  - marker: c
    text: “Frutas de verão” podem referir-se mais especificamente a figos, mas o termo hebraico é mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: um pouco além do cume
  rationale: רֹאשׁ significa literalmente “cabeça”, mas neste contexto topográfico designa o cume. A formulação comunica com naturalidade que Davi já havia ultrapassado o topo, sem ocultar a expressão hebraica em nota.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a vivacidade do marcador narrativo, que chama a atenção para o aparecimento inesperado de Ziba.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: servo de Mefibosete
  rationale: נַעַר pode significar “jovem”, “ajudante” ou “servo”. Aqui identifica a função de Ziba em relação a Mefibosete; a ambiguidade lexical é registrada em nota.
- source_word: צֶמֶד חֲמֹרִים
  choice: um par de jumentos
  rationale: צֶמֶד indica um par, frequentemente associado para uma tarefa. “Um par de jumentos” é claro sem afirmar que estivessem presos por uma canga.
- source_word: חֲבֻשִׁים
  choice: selados
  rationale: No contexto, os animais haviam sido preparados para transporte ou montaria; “selados” expressa o sentido contextual melhor que o literal “amarrados”.
- source_word: מָאתַיִם לֶחֶם
  choice: duzentos pães
  rationale: O substantivo hebraico é usado de modo contável; “pães” é idiomático e não exige acrescentar uma unidade ausente.
- source_word: צִמּוּקִים
  choice: cachos de passas
  rationale: O termo designa passas agrupadas ou prensadas. A tradução tradicional e compreensível evita especificar “bolos”, possibilidade menos segura.
- source_word: קַיִץ
  choice: frutas de verão
  rationale: O termo pode designar frutas de verão em geral e, em certos contextos, figos em particular. A opção mais ampla preserva a extensão lexical do hebraico.
- source_word: נֵבֶל יָיִן
  choice: um odre de vinho
  rationale: נֵבֶל designa aqui um recipiente de pele. “Odre” é exato, conciso e inteligível no registro bíblico moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “Eis que” conserva a vivacidade narrativa sem tornar o restante do versículo excessivamente arcaico. Os marcadores de nota aparecem no texto em ordem alfabética e imediatamente após os termos pertinentes.
