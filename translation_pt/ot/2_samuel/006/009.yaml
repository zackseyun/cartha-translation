  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: pt
  text: 'Naquele dia, Davi teve medo de Yahweh e disse: “Como a arca de Yahweh virá a mim?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pergunta também pode transmitir incerteza prática ou um sentimento de temor ou indignidade depois da morte de Uzá.
    reason: preservação de ambiguidade
lexical_decisions:
- source_word: וַיִּרָא
  choice: teve medo de
  rationale: No qal, com Yahweh como objeto direto, o verbo descreve aqui a reação de medo de Davi após a morte de Uzá. “Teve medo de” comunica naturalmente essa força emocional sem reduzi-la à mera reverência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal direto, natural e específico em português.
- source_word: אֵיךְ
  choice: Como
  rationale: Mantém aberta a nuance da pergunta, que pode expressar incerteza prática, temor ou uma percepção de incapacidade diante do ocorrido.
- source_word: יָבֹא
  choice: virá
  rationale: Reproduz o verbo ativo e sua forma imperfeita/futura sem introduzir a ideia passiva de que a arca seria trazida.
- source_word: אֵלַי
  choice: a mim
  rationale: Traduz diretamente a preposição com o sufixo de primeira pessoa, sem acrescentar “à minha casa” ou “ao meu lugar”.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Reproduz de modo transparente a construção hebraica e mantém o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido da pergunta de Davi
  choice: Preservar a formulação aberta “Como ... virá a mim?”
  alternative: “Como posso levar...?” ou “Como poderei receber...?”
  rationale: O hebraico não explicita se Davi questiona o procedimento, sua segurança ou sua dignidade. A tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem temporal foi antecipada por naturalidade, e a pergunta conserva a forma ativa e a ambiguidade do hebraico.
