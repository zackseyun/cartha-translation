reference: 2 Samuel 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: pt
  text: Enquanto a arca de Yahweh entrava na Cidade de Davi, Mical, filha de Saul, olhou pela janela e viu o rei Davi saltando e girando[a] diante de Yahweh; e, em seu coração, ela o desprezou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os verbos hebraicos descrevem movimentos exuberantes de celebração: saltar e girar diante de Yahweh.'
    reason: Esclarece a força de dois verbos de movimento pouco comuns sem reduzir ambos simplesmente a “dançar”.
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Enquanto ... entrava
  rationale: A construção estabelece uma ação em andamento que serve de cenário para o olhar de Mical. “Enquanto ... entrava” preserva essa simultaneidade de modo natural em português.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Mantém a relação de posse do construto hebraico e representa o Tetragrama como nome próprio.
- source_word: עִיר דָּוִד
  choice: Cidade de Davi
  rationale: Trata a expressão como a designação estabelecida do lugar, com uso natural de maiúscula em português.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mical, filha de Saul
  rationale: Preserva a identificação relacional, narrativamente significativa, em forma idiomática.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: olhou pela janela
  rationale: Expressa o ato de olhar para fora através da janela sem acrescentar que ela olhou necessariamente para baixo.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: É a ordem normal do título seguido do nome em português.
- source_word: מְפַזֵּז
  choice: saltando
  rationale: O verbo raro descreve movimento vivo e exuberante; “saltando” conserva sua concretude física.
- source_word: מְכַרְכֵּר
  choice: girando
  rationale: Mantém a ideia de movimento circular e evita reduzir os dois verbos a um genérico “dançando”.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: em seu coração, ela o desprezou
  rationale: Preserva tanto o desprezo dirigido a Davi quanto sua localização interior, sem explicar além do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de “Yahweh” e a expressão “em seu coração” foram mantidas por sua importância textual. O marcador da nota foi colocado junto aos verbos que ela explica.
