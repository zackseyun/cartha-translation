base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: pt
  text: Davi ficou irado porque Yahweh abriu uma brecha contra Uzá, e deu àquele lugar o nome de Perez-Uzá, até o dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: Davi ficou irado
  rationale: A construção idiomática expressa a ira de Davi. “Ficou irado” é natural, digna e mantém o início dessa reação emocional.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: Yahweh irrompeu contra Uzá
  rationale: “Irrompeu” comunica a ação súbita e destrutiva do verbo פרץ. A repetição etimológica do verbo e do substantivo não pode ser reproduzida naturalmente em português sem tornar a frase artificial; seu eco no topônimo é explicado em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: e chamou aquele lugar de
  rationale: Forma corrente em português para a fórmula hebraica de nomeação.
- source_word: פֶּרֶץ עֻזָּה
  choice: Perez-Uzá
  rationale: Preserva o topônimo por transliteração e retém sua ligação sonora com a raiz hebraica פרץ; o sentido é esclarecido em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: nome que permanece até hoje
  rationale: Explicita de modo natural em português que a fórmula temporal se refere ao nome dado ao lugar, sem alterar o sentido.
theological_decisions:
- issue: Ação direta de Yahweh em juízo
  choice: Yahweh irrompeu contra Uzá
  alternative: houve uma calamidade contra Uzá
  rationale: O hebraico atribui diretamente a Yahweh a ação súbita contra Uzá. A tradução não a reduz a acidente nem a consequência impessoal.
- issue: Possível alvo da ira de Davi
  choice: Davi ficou irado porque Yahweh irrompeu contra Uzá
  alternative: Davi ficou indignado com a morte de Uzá
  rationale: A sintaxe hebraica declara a ira e sua causa, mas não explicita de modo independente se ela se dirige a Yahweh, à ocorrência ou à situação. A formulação conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Irado” preserva a força do hebraico; “irrompeu” mantém a imagem do ataque súbito. O ponto e vírgula evita uma sequência excessiva de coordenações.
