  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: pt
  text: 'Davi disse a Mical: “Foi diante de Yahweh, que me escolheu em vez de teu pai e de toda a casa dele para me designar governante sobre o povo de Yahweh, sobre Israel — foi diante de Yahweh que eu celebrei[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dancei”. O verbo hebraico tem sentido mais amplo e pode indicar uma ação alegre, festiva ou lúdica; neste contexto, pode incluir a dança.'
    reason: Registra a alternativa contextual sem reduzir a amplitude lexical do verbo hebraico.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa de modo natural a ideia espacial e relacional de agir na presença de Yahweh e conserva a repetição enfática do hebraico.
- source_word: אֲשֶׁר בָּחַר בִּי
  choice: que me escolheu
  rationale: בחר significa normalmente escolher; a formulação preserva o sentido simples da escolha de Davi para a função real.
- source_word: מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: em vez de seu pai e de toda a casa dele
  rationale: 'Depois de בחר, מן expressa aqui contraste ou preferência: Yahweh escolheu Davi, e não Saul nem sua dinastia. ''Casa'' mantém o alcance familiar e dinástico.'
- source_word: לְצַוֹּת אֹתִי
  choice: para me designar
  rationale: Embora צוה frequentemente signifique ordenar, nesta construção indica incumbir ou nomear alguém para uma função.
- source_word: נָגִיד
  choice: governante
  rationale: Comunica claramente a autoridade política de quem foi colocado à frente do povo, sem sugerir necessariamente o título hereditário de príncipe.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: sobre o povo de Yahweh, sobre Israel
  rationale: Mantém a repetição de עַל e a identificação enfática do povo de Yahweh com Israel.
- source_word: וְשִׂחַקְתִּי
  choice: eu celebrei
  rationale: שׂחק pode descrever ação alegre, festiva ou lúdica. 'Celebrei' preserva essa amplitude sem identificar o verbo exclusivamente com dançar, ação expressa antes no capítulo por outros verbos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal no texto hebraico, em vez de substituí-lo por um título.
- issue: Se a ação de Davi deve ser especificada como dança
  choice: celebrei
  alternative: dancei
  rationale: O verbo שׂחק é mais amplo do que os verbos empregados anteriormente no relato para a dança de Davi. A tradução evita harmonizá-los indevidamente, enquanto a nota registra a leitura específica favorecida pelo contexto.
- issue: Valor temporal de וְשִׂחַקְתִּי
  choice: passado, referido à celebração que Mical acabara de censurar
  alternative: 'futuro ou volitivo: “celebrarei”'
  rationale: O contexto imediato favorece a referência à conduta já observada por Mical, embora a forma verbal possa ser entendida em sequência discursiva como declaração de ação futura. A tradução mantém o passado adotado pelo texto de consulta sem transformar essa escolha em afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “diante de Yahweh” reproduz a ênfase retórica do hebraico. “Casa” foi mantido por seu sentido familiar e dinástico; “casa dele” evita a possível leitura portuguesa de que “sua casa” se refira a Mical.
