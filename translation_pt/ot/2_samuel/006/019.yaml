  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: pt
  text: Ele distribuiu a todo o povo, a toda a multidão de Israel, tanto aos homens como às mulheres[a], dando a cada pessoa um pão, uma porção de carne[b] e um bolo de passas. Depois, todo o povo foi embora, cada um para sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “desde homem até mulher”, expressão que abrange todo o povo reunido, homens e mulheres.'
    reason: cultural_note
  - marker: b
    text: Ou “uma medida” ou “uma porção”. A palavra hebraica אֶשְׁפָּר é rara; muitos a entendem aqui como uma porção de carne, especialmente à luz do relato paralelo em 1 Crônicas 16:3.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: distribuiu
  rationale: O piel de חלק descreve aqui a distribuição de porções à multidão; “distribuiu” é claro, concreto e natural em português.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: a todo o povo, a toda a multidão de Israel
  rationale: Mantém as duas expressões hebraicas, de caráter enfático e parcialmente apositivo, sem reduzir sua plenitude.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: tanto aos homens como às mulheres
  rationale: Transmite com naturalidade a expressão hebraica inclusiva “desde homem até mulher”, indicando que toda a população reunida recebeu a dádiva.
- source_word: לְאִישׁ
  choice: a cada pessoa
  rationale: Embora אִישׁ seja formalmente masculino singular, o contexto acaba de incluir homens e mulheres; “cada pessoa” preserva o sentido distributivo sem restringi-lo aos homens.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: um pão
  rationale: חַלָּה designa um pão ou bolo de pão; “um pão” é concreto, conciso e compreensível no português atual.
- source_word: אֶשְׁפָּר אֶחָד
  choice: uma porção de carne
  rationale: אֶשְׁפָּר é raro e seu significado exato é incerto. Uma porção de alimento, provavelmente carne, é uma interpretação plausível à luz do contexto e do paralelo em 1 Crônicas 16:3; a incerteza é registrada em nota.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: um bolo de passas
  rationale: אֲשִׁישָׁה designa um bolo prensado, geralmente entendido no uso bíblico como feito de passas; esta formulação é clara e tradicional sem soar arcaica.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Depois, todo o povo foi embora, cada um para sua casa
  rationale: Expressa naturalmente a dispersão do povo e conserva o valor distributivo de אִישׁ לְבֵיתוֹ.
