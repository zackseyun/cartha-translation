  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: pt
  text: Levaram-no da casa de Abinadabe[a], que ficava na colina, junto com a arca de Deus; e Aiô caminhava à frente da arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ficava em Gibeá”. O hebraico גִּבְעָה pode ser entendido como o substantivo comum “colina” ou como o nome do lugar “Gibeá”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Levaram-no
  rationale: O verbo נשׂא indica aqui o transporte de algo, e a forma verbal está no plural, com sufixo pronominal masculino singular. “Levaram-no” conserva de modo conciso tanto a ação quanto o pronome do hebraico, sem especificar além do texto a maneira de transporte.
- source_word: מִבֵּית אֲבִינָדָב
  choice: da casa de Abinadabe
  rationale: 'A construção com מִן indica o ponto de origem: aquilo foi levado da casa de Abinadabe.'
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: que ficava na colina
  rationale: גִּבְעָה pode ser o substantivo comum “colina” ou o topônimo “Gibeá”. No texto principal, “colina” é preferido por causa do artigo e da relação imediata com a casa; a leitura como nome de lugar é preservada em nota.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: junto com a arca de Deus
  rationale: עִם expressa acompanhamento. “Junto com” torna clara essa relação em português, enquanto “arca de Deus” traduz diretamente a designação hebraica.
- source_word: וְאַחְיוֹ
  choice: e Aiô
  rationale: O nome próprio é transliterado de forma natural em português.
- source_word: הֹלֵךְ
  choice: caminhava
  rationale: O particípio apresenta uma ação em andamento simultânea ao transporte. O imperfeito “caminhava” comunica esse aspecto durativo com naturalidade.
- source_word: לִפְנֵי הָאָרוֹן
  choice: à frente da arca
  rationale: A expressão espacial לִפְנֵי significa “diante de” ou “à frente de”; neste contexto processional, “à frente da arca” é claro e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e vocabulário amplamente compreensível. O pronome em “Levaram-no” preserva a forma masculina singular do hebraico sem resolver explicitamente seu referente; o ponto e vírgula ajuda a distinguir a ação simultânea de Aiô.
