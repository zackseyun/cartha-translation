  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: pt
  text: Puseram a arca de Deus sobre um carro novo e a levaram da casa de Abinadabe, que ficava na colina[a]; Uzá e Aiô, filhos de Abinadabe, conduziam o carro novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Gibeá”, entendendo a expressão como nome de lugar, e não como descrição topográfica.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: Puseram ... sobre
  rationale: O hifil de רכב indica fazer subir ou colocar sobre algo; com a arca e o carro, esta é uma formulação natural e concreta em português.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: “Arca” é o termo consagrado e adequado para o objeto sagrado neste contexto.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: sobre um carro novo
  rationale: Embora אֶל indique movimento em direção a ou para cima de, “sobre” expressa naturalmente a colocação da arca no veículo; “carro” é claro no contexto antigo.
- source_word: וַיִּשָּׂאֻהוּ
  choice: a levaram
  rationale: נשא pode significar erguer, carregar ou levar. Aqui, “levaram” evita sugerir que a arca foi transportada manualmente, pois estava sobre o carro.
- source_word: מִבֵּית אֲבִינָדָב
  choice: da casa de Abinadabe
  rationale: Reproduz de modo claro e próximo a construção hebraica.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: que ficava na colina
  rationale: A expressão admite uma descrição topográfica ou, possivelmente, o topônimo Gibeá. O texto principal mantém o sentido topográfico, e a alternativa aparece em nota.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Uzá e Aiô
  rationale: Transliterações portuguesas claras dos nomes pessoais hebraicos.
- source_word: בְּנֵי אֲבִינָדָב
  choice: filhos de Abinadabe
  rationale: בְּנֵי tem aqui seu sentido narrativo mais natural de filhos literais.
- source_word: נֹהֲגִים
  choice: conduziam
  rationale: O particípio de נהג indica conduzir ou guiar; “conduziam” funciona naturalmente com o carro sem impor detalhes não declarados sobre os animais.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: o carro novo
  rationale: A repetição do hebraico é preservada por sua função narrativa e por consistência lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a repetição de “carro novo” e preserva-se em nota a ambiguidade entre “na colina” e o topônimo “Gibeá”.
