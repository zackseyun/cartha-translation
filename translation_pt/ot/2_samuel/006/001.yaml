  text: David again gathered all the chosen men of Israel[a], thirty thousand.
translation:
  language: pt
  text: Davi reuniu novamente todos os homens escolhidos de Israel[a], trinta mil ao todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovens” ou “homens seletos”. O hebraico בָּחוּר pode indicar juventude ou alguém escolhido, de qualidade; neste contexto, parece referir-se a um contingente selecionado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: reuniu novamente
  rationale: A construção idiomática com יסף e עוד indica repetição da ação. Em português, o valor adverbial é expresso naturalmente por “novamente” junto ao verbo exigido pelo objeto e pelo contexto.
- source_word: אֶת כָּל
  choice: todos
  rationale: אֶת marca o objeto direto definido, enquanto כָּל expressa totalidade; “todos” comunica essa abrangência de modo natural.
- source_word: בָּחוּר
  choice: homens escolhidos
  rationale: בָּחוּר pode designar homens jovens ou selecionados. No contexto de uma convocação numerosa, “homens escolhidos” expressa bem a ideia de um contingente seleto sem eliminar a alternativa lexical, registrada em nota.
- source_word: בְּיִשְׂרָאֵל
  choice: de Israel
  rationale: Embora a preposição hebraica seja ב, a construção identifica o grupo pertencente a Israel ou selecionado dentre Israel; “de Israel” é idiomático e preserva essa relação.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: trinta mil ao todo
  rationale: O numeral é traduzido diretamente. “Ao todo” esclarece em português que a cifra está em aposição e indica o total dos homens reunidos.
