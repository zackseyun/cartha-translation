source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: pt
  text: Quando os que carregavam a arca de Yahweh deram seis passos[a], ele sacrificou um boi e um animal engordado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seis passadas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um animal engordado”; tradicionalmente entendido aqui como um bezerro engordado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Mantém o sentido cultual estabelecido de אֲרוֹן e representa diretamente o nome divino יהוה como Yahweh.
- source_word: וַיְהִי כִּי
  choice: E aconteceu que, quando
  rationale: Reproduz a moldura narrativa hebraica e entende כִּי temporalmente, sem tornar a relação mais específica do que o texto.
- source_word: צָעֲדוּ נֹשְׂאֵי
  choice: os que carregavam ... tinham dado
  rationale: O particípio identifica os transportadores, e o mais-que-perfeito português expressa a ação concluída antes do sacrifício.
- source_word: שִׁשָּׁה צְעָדִים
  choice: seis passos
  rationale: É a correspondência direta e natural da medida de deslocamento; 'seis passadas' também é possível.
- source_word: וַיִּזְבַּח
  choice: ele sacrificou
  rationale: Preserva o sujeito singular implícito, naturalmente entendido no contexto como Davi, sem inseri-lo no texto.
- source_word: שׁוֹר
  choice: um boi
  rationale: Representa naturalmente o bovino designado pelo termo, que também pode ter sentido mais amplo ou ser vertido como touro.
- source_word: מְרִיא
  choice: um animal cevado
  rationale: Evita restringir indevidamente o substantivo hebraico, que indica um animal engordado, mas não especifica aqui sua espécie.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sujeito singular de וַיִּזְבַּח
  choice: ele
  alternative: Davi
  rationale: O contexto aponta para Davi, mas o hebraico deixa o sujeito apenas na flexão verbal; manter o pronome evita explicitação desnecessária.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A abertura conserva discretamente o ritmo narrativo hebraico. A tradução evita identificar מְרִיא como bezerro no texto principal, preservando a amplitude lexical do original.
