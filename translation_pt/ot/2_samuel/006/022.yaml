base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the slave girls of whom you have spoken, with them I will be honored.
translation:
  language: pt
  text: E eu me farei ainda mais desprezível do que isso e serei humilde aos meus próprios olhos; mas, com as escravas[a] de quem você falou, com elas serei honrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servas” ou “criadas”. O hebraico se refere a mulheres de baixa condição no ambiente doméstico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי עוֹד מִזֹּאת
  choice: E eu me farei ainda mais desprezível do que isso
  rationale: O nifal de קלל comunica tornar-se ou ser considerado insignificante/desprezível; a formulação reflexiva expressa a disposição de Davi de se rebaixar ainda mais e preserva o contraste com “serei honrado”.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינַי
  choice: e serei humilde aos meus próprios olhos
  rationale: שָׁפָל indica condição baixa ou humilde. A expressão mantém o idioma hebraico “aos meus olhos”, isto é, na própria avaliação de Davi, sem transformá-lo explicitamente numa virtude moral.
- source_word: הָאֲמָהוֹת
  choice: as escravas
  rationale: אָמָה designa mulheres escravizadas ou servas de baixa condição doméstica. “Escravas” preserva com clareza a dimensão de posição social relevante ao contraste entre humilhação e honra.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: de quem você falou
  rationale: Tradução direta e natural da oração relativa, remetendo às mulheres mencionadas por Mical no versículo anterior.
- source_word: עִמָּם
  choice: entre elas
  rationale: Embora עם signifique literalmente “com”, neste contexto aponta para o círculo social no qual Davi será honrado; “entre elas” é natural em português e preserva essa relação.
- source_word: אִכָּבֵדָה
  choice: serei honrado
  rationale: O nifal de כבד expressa receber ou ter honra. A escolha conserva o contraste de honra e desonra do versículo e evita a conotação teológica mais forte de “serei glorificado”.
theological_decisions:
- issue: Terminologia de condição social para אָמָהוֹת
  choice: “escravas” no texto principal
  alternative: “servas” ou “criadas”
  rationale: O contexto enfatiza a baixa condição social dessas mulheres. “Escravas” torna essa realidade mais explícita, enquanto a nota registra alternativas menos fortes sem apagar o sentido provável.
- issue: Sentido de שָׁפָל בְּעֵינַי
  choice: “humilde aos meus próprios olhos”
  alternative: “baixo aos meus próprios olhos” ou “rebaixado aos meus próprios olhos”
  rationale: “Humilde” oferece português corrente e digno, mas permanece ligado à autoavaliação de Davi. Não se acrescenta que essa humildade seja necessariamente uma virtude espiritual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a estrutura de contraste entre desprezo, humildade e honra; a repetição “entre... entre elas” reflete a ênfase do hebraico.
