base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: pt
  text: A ira de Yahweh se acendeu contra Uzá, e Deus o feriu ali por causa do erro[a], e ele morreu ali, junto à arca de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da falta”, “por causa do ato impensado” ou, possivelmente, “porque estendeu a mão”. A expressão hebraica é difícil e tem sido entendida de várias maneiras.
    reason: Leitura alternativa de uma expressão hebraica rara e obscura.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: A ira ... se acendeu
  rationale: Preserva a imagem hebraica da ira que se inflama, usando uma expressão natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּעֻזָּה
  choice: contra Uzá
  rationale: A preposição marca aqui o alvo da ira; “contra” comunica isso naturalmente em português.
- source_word: וַיַּכֵּהוּ
  choice: o feriu
  rationale: Traduz de modo direto o verbo נכה sem antecipar a morte, que é declarada na oração seguinte.
- source_word: שָׁם
  choice: ali
  rationale: Mantém as duas ocorrências do advérbio e a ênfase narrativa no lugar do juízo e da morte.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Conserva a variação do original, que emprega aqui אֱלֹהִים após usar o nome Yahweh.
- source_word: עַל הַשַּׁל
  choice: por causa do erro
  rationale: O substantivo raro שַׁל é obscuro. “Erro” comunica uma falta sem definir além do que o hebraico permite a natureza exata do ato; a nota registra outras possibilidades.
- source_word: וַיָּמָת
  choice: e ele morreu
  rationale: Reproduz de maneira simples a sequência narrativa hebraica.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: junto à arca de Deus
  rationale: Neste contexto espacial, “junto à” expressa com naturalidade que Uzá morreu ao lado da arca, evitando a possível ideia de acompanhamento sugerida por uma tradução estritamente literal de עִם.
theological_decisions:
- issue: Sentido da expressão obscura עַל הַשַּׁל como causa do juízo sobre Uzá
  choice: por causa do erro
  alternative: por causa da falta; por causa do ato impensado; possivelmente, porque estendeu a mão
  rationale: O termo hebraico é raro e admite interpretações diferentes. O texto principal indica uma ação errada sem impor uma explicação específica, enquanto a nota preserva a incerteza lexical e a tensão do relato.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O nome próprio é grafado “Uzá”; a repetição de “ali” e a alternância entre “Yahweh” e “Deus” seguem deliberadamente o hebraico.
