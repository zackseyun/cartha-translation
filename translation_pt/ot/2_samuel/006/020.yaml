  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the slave girls of his slaves[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: pt
  text: 'Então Davi voltou para abençoar os de sua casa. Mical, filha de Saul, saiu ao encontro de Davi e disse: “Como foi honrado hoje o rei de Israel[a], expondo-se hoje diante das escravas de seus escravos[b], como um desses sujeitos desprezíveis se expõe sem pudor[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida por “Como o rei de Israel foi glorioso hoje”. No contexto, as palavras de Mical são claramente sarcásticas.
    reason: lexical_alternative
  - marker: b
    text: Ou “das servas de seus servos”. Os dois termos hebraicos podem designar pessoas escravizadas ou dependentes domésticos, e a fala ressalta sua posição social inferior.
    reason: lexical_alternative
  - marker: c
    text: Ou “um dos imprestáveis”. O termo hebraico descreve pessoas consideradas vazias, indignas ou sem valor.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ אֶת בֵּיתוֹ
  choice: abençoar os de sua casa
  rationale: ברך significa “abençoar”, e ביתו pode designar tanto a casa quanto as pessoas que a compõem. “Os de sua casa” comunica naturalmente o provável referente humano sem eliminar a imagem hebraica da casa.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mical, filha de Saul
  rationale: Preserva a identificação patronímica e a ênfase narrativa na ligação de Mical com Saul.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Como ... se cobriu de honra hoje
  rationale: כבד expressa honra ou glória. A formulação mantém o valor lexical positivo, enquanto o contexto e o restante da fala deixam evidente a ironia de Mical.
- source_word: נִגְלָה
  choice: expondo-se
  rationale: O nifal de גלה indica que Davi se descobriu ou se deixou visível. “Expondo-se” é natural em português e conserva a conotação corporal sem especificar além do hebraico o grau de nudez.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: Equivalente idiomático atual para a expressão hebraica literalmente relacionada aos olhos, preservando o caráter público da ação.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: as escravas de seus escravos
  rationale: אמה e עבד são termos de condição servil. A tradução conserva tanto o gênero do primeiro termo quanto a relação genitiva e a hierarquia social enfatizada no insulto de Mical.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: como se expõe sem pudor
  rationale: A construção intensiva com formas de גלה reforça o ato de se descobrir. “Sem pudor” transmite a força enfática e desonrosa atribuída por Mical, sem transformar essa avaliação sarcástica em descrição neutra do narrador.
- source_word: אַחַד הָרֵקִים
  choice: um desses sujeitos desprezíveis
  rationale: ריקים caracteriza pessoas tidas como vazias, imprestáveis ou socialmente desprezíveis. “Sujeitos desprezíveis” soa atual, mantém o insulto e evita uma expressão excessivamente coloquial.
theological_decisions:
- issue: Terminologia de condição social em אַמְהוֹת עֲבָדָיו
  choice: escravas de seus escravos
  alternative: servas de seus servos
  rationale: A opção preserva a condição de escravização expressa pelos dois substantivos hebraicos e torna visível o contraste de posição social explorado por Mical, sem suavizá-lo por motivos confessionais ou culturais.
- issue: Natureza da exposição de Davi
  choice: expondo-se
  alternative: desnudando-se
  rationale: O hebraico indica descoberta ou exposição, mas não define com precisão quanto do corpo ficou descoberto. “Expondo-se” preserva essa indeterminação e evita afirmar nudez total.
- issue: Ironia na fala de Mical
  choice: manter a linguagem de honra em sentido sarcástico
  alternative: traduzir diretamente como “Como o rei se desonrou”
  rationale: A forma hebraica emprega vocabulário positivo de honra para produzir ironia. Mantê-lo conserva a tensão retórica em vez de substituí-la por uma interpretação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluida para leitores brasileiros e internacionais. A fala de Mical conserva tom cortante e sarcástico. Evitou-se especificar nudez total, que o hebraico não exige, e preservou-se a terminologia social forte do texto.
