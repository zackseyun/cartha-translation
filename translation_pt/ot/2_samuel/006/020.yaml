  terminology: “Escravas de seus escravos” reproduz de maneira fiel a relação genitiva e a condição social indicada por אמה e עבד. “Sujeitos desprezíveis” é um equivalente moderno e adequadamente depreciativo para הרקים, sem recorrer a gíria.
