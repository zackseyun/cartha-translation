  to: 'Então Davi voltou para abençoar os de sua casa. Mical, filha de Saul, saiu ao encontro de Davi e disse: “Como foi honrado hoje o rei de Israel[a], expondo-se hoje diante das escravas de seus escravos[b], como um desses sujeitos desprezíveis se expõe sem pudor[c]!”'
  rationale: A revisão substitui uma expressão reflexiva pouco idiomática por “foi honrado”, que corresponde diretamente ao predicado hebraico e conserva a ironia contextual. Também ajusta a ordem da comparação final para o português moderno, mantendo a ênfase do infinitivo absoluto e o caráter insultuoso da fala de Mical.
