  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: pt
  text: A arca de Yahweh permaneceu na casa de Obede-Edom, o geteu[a], durante três meses; e Yahweh abençoou Obede-Edom e toda a sua casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um homem associado a Gate.
    reason: cultural_note
  - marker: b
    text: 'Ou: “todos os de sua casa”. O hebraico pode se referir amplamente à família e a todo o seu estabelecimento doméstico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: O verbo יׁשב pode significar sentar-se, habitar, ficar ou permanecer. Como a arca é o sujeito e vem acompanhada de uma expressão de duração, “permaneceu” comunica naturalmente a continuidade de sua presença.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: A cadeia construta é vertida diretamente. “Arca” é o termo consagrado e exato para אֲרוֹן neste contexto, e o nome divino é transliterado como “Yahweh”.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: na casa de Obede-Edom
  rationale: Aqui בֵּית indica primariamente o local físico onde a arca permaneceu. O nome próprio é transliterado segundo a forma portuguesa corrente.
- source_word: הַגִּתִּי
  choice: o geteu
  rationale: O gentílico hebraico é preservado pela forma portuguesa tradicional “geteu”, identificando sua associação com Gate sem substituir o termo por uma paráfrase.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: durante três meses
  rationale: “Durante” expressa de modo idiomático em português a duração indicada pela frase hebraica.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: ברך é o verbo comum para “abençoar”; o contexto não exige uma formulação mais interpretativa.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: Obede-Edom e toda a sua casa
  rationale: A tradução mantém a polissemia de בֵּית, que aqui pode abranger a família, os servos, os bens e todo o estabelecimento doméstico de Obede-Edom. A nota esclarece essa amplitude.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não um título. “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo silenciosamente por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha de perto o hebraico, enquanto “durante” e a pontuação tornam a frase natural em português. Os marcadores foram posicionados junto aos termos que explicam.
