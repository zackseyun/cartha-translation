  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: pt
  text: E Mical, filha de Saul, não teve filhos[a] até o dia de sua morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendência”; o substantivo hebraico pode designar genericamente uma criança ou descendente, não necessariamente um filho homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: E Mical
  rationale: A conjunção e a construção com לְ introduzem Mical como tópico/sujeito; “E Mical” mantém a ligação narrativa de modo natural em português.
- source_word: בַּת שָׁאוּל
  choice: filha de Saul
  rationale: Reproduz diretamente a identificação de Mical por sua linhagem, em linguagem clara e digna.
- source_word: לֹא הָיָה לָהּ
  choice: não teve
  rationale: A construção hebraica de posse, literalmente “não havia para ela”, corresponde idiomaticamente a “não teve” em português.
- source_word: יָלֶד
  choice: filhos
  rationale: O substantivo pode designar criança ou descendência sem restringir o sexo. Neste enunciado sobre ausência de descendência ao longo da vida, o plural genérico “filhos” é a formulação portuguesa mais natural, sem especificar filhos homens.
- source_word: עַד יוֹם מוֹתָהּ
  choice: até o dia de sua morte
  rationale: Tradução próxima e natural da expressão temporal hebraica, preservando sua força enfática.
theological_decisions:
- issue: Implicação da ausência de filhos “até o dia de sua morte”
  choice: Manter literalmente a expressão temporal, comunicando que Mical permaneceu sem filhos durante toda a vida.
  alternative: Explicitar no corpo do texto “nunca teve filhos” ou tratar a frase como argumento teológico adicional.
  rationale: O hebraico afirma a ausência de descendência até a morte. A tradução conserva a formulação sem sugerir possibilidade posterior à morte nem acrescentar uma interpretação teológica que o versículo não declara.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Mical” segue a forma tradicional portuguesa do nome. O plural genérico “filhos” soa mais natural neste contexto do que o singular “um filho” e evita restringir o termo hebraico a descendente masculino.
