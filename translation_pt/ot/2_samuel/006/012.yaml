  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: pt
  text: 'Foi informado ao rei Davi: “Javé[a] abençoou a casa de Obede-Edom e tudo o que lhe pertence por causa da arca de Deus”. Então Davi foi e levou com alegria a arca de Deus da casa de Obede-Edom para a Cidade de Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino; também vertido como “Yahweh” ou, tradicionalmente, “SENHOR”.'
    reason: Esclarece a representação portuguesa do tetragrama e registra alternativas de tradução.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Foi informado
  rationale: O hofal passivo introduz a notícia sem identificar quem a transmitiu; a formulação conserva essa impessoalidade em português natural.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: ao rei Davi
  rationale: Reproduz com naturalidade o título seguido do nome próprio.
- source_word: בֵּרַךְ יְהוָה
  choice: Javé abençoou
  rationale: O perfeito hebraico apresenta a bênção como fato realizado e relevante para a notícia; o pretérito perfeito é a forma portuguesa mais natural.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: a casa de Obede-Edom
  rationale: Mantém a imagem concreta de 'casa', que no contexto pode abranger família, dependentes e bens.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: e tudo o que lhe pertence
  rationale: Expressa de modo idiomático a totalidade dos bens e do que estava ligado à sua casa.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: Comunica diretamente a relação causal entre a presença da arca e a bênção.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: É a correspondência direta, clara e tradicional para o objeto sagrado mencionado.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Então Davi foi
  rationale: Faz avançar a narrativa e mostra a reação de Davi à notícia sem tornar a relação causal mais explícita do que o hebraico.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: levou ... a arca de Deus ... para a Cidade de Davi
  rationale: O verbo עלה contém a ideia de fazer subir; em português corrente, o destino expresso torna 'levou ... para' mais natural, preservando o movimento em direção à cidade elevada de Davi.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Mantém o modo festivo em que a arca foi transportada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: SENHOR; Yahweh
  rationale: O texto hebraico traz o nome próprio YHWH. 'Javé' é uma forma portuguesa reconhecível e preserva o caráter pessoal do nome; a nota registra a grafia consonantal hebraica e as alternativas correntes sem impor uma pronúncia como absolutamente certa.
- issue: Alcance da bênção sobre a 'casa' de Obede-Edom
  choice: casa de Obede-Edom e tudo o que lhe pertence
  alternative: família de Obede-Edom e todos os seus bens
  rationale: A tradução mantém a amplitude de בַּיִת, que pode envolver residência, família e casa doméstica, sem reduzir o sentido exclusivamente a pessoas ou posses.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Os nomes próprios seguem formas portuguesas correntes. A ordem de “com alegria” foi ajustada para evitar ambiguidade e associar a expressão ao transporte da arca.
