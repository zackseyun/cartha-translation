  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: pt
  text: Davi dançava com todas as suas forças diante de Yahweh[a] e vestia um éfode de linho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rodopiava” ou “saltava de um lado para outro”; o hebraico retrata um movimento festivo e vigoroso.
    reason: lexical_alternative
  - marker: b
    text: O éfode era uma peça característica do vestuário sacerdotal ou cultual; aqui Davi é descrito usando um éfode feito de linho.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: dançava
  rationale: O particípio descreve movimento corporal vigoroso em celebração. “Dançava” é natural e claro em português, enquanto possibilidades mais específicas são registradas em nota.
- source_word: בְּכָל עֹז
  choice: com todas as suas forças
  rationale: A expressão indica empenho físico total ou grande intensidade e soa natural em português contemporâneo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” preserva de modo conciso o sentido de estar perante ou na presença de alguém; o nome divino é transliterado como Yahweh.
- source_word: חָגוּר
  choice: vestia
  rationale: A forma indica que Davi estava trajando a peça; “vestia” é mais corrente do que uma tradução literal como “estava cingido”.
- source_word: אֵפוֹד
  choice: éfode
  rationale: É um termo técnico para uma peça característica do contexto sacerdotal ou cultual israelita, sem equivalente português exato.
- source_word: בָּד
  choice: linho
  rationale: Neste contexto, o termo designa o material de que o éfode era feito, sem exigir a especificação adicional “linho fino”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e terminologia técnica preservada quando não há equivalente exato. Os marcadores foram posicionados imediatamente após os termos que explicam.
