base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: pt
  text: Davi não quis levar para junto de si a arca de Yahweh, para a Cidade de Davi[a]; mas a desviou para a casa de Obede-Edom, o geteu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para cima, até a Cidade de Davi”. A preposição hebraica pode sugerir movimento ascendente em direção ao lugar, além de simplesmente indicar o destino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o homem de Gate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: não quis
  rationale: Expressa de modo natural a falta de disposição ou consentimento de Davi, sem intensificar o sentido para uma recusa hostil.
- source_word: לְהָסִיר אֵלָיו
  choice: levar para junto de si
  rationale: Embora הֵסִיר possa significar literalmente retirar ou desviar, neste contexto indica transferir a arca para onde Davi estava; a formulação preserva também אֵלָיו, “para junto dele”.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Mantém a relação de construção hebraica e representa diretamente o nome divino יהוה.
- source_word: עַל עִיר דָוִד
  choice: até a Cidade de Davi
  rationale: עַל indica aqui movimento em direção ao destino e pode também sugerir subida; “até” é natural em português, enquanto a nuance alternativa é registrada em nota.
- source_word: וַיַּטֵּהוּ
  choice: desviou-a
  rationale: Comunica que Davi mudou a arca do destino planejado e a encaminhou para outro lugar.
- source_word: בֵּית עֹבֵד אֱדום
  choice: a casa de Obede-Edom
  rationale: בֵּית designa naturalmente a residência onde a arca foi alojada, embora também possa abranger a família ou casa doméstica.
- source_word: הַגִּתִּי
  choice: o geteu
  rationale: Preserva em português a forma gentílica convencional, com a explicitação geográfica oferecida em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com formas bíblicas amplamente reconhecíveis. “Obede-Edom” e “geteu” seguem o uso português tradicional; a sintaxe foi mantida natural sem apagar as nuances de direção presentes no hebraico.
