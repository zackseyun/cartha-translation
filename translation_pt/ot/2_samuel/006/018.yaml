  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: pt
  text: Quando Davi terminou de oferecer o holocausto e as ofertas de comunhão, abençoou o povo em nome de Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “o SENHOR dos Exércitos”; ou: “Yahweh das hostes”.'
    reason: Registra formas tradicionais e uma alternativa lexical para o título divino יהוה צבאות, sem repetir a redação do texto.
lexical_decisions:
- source_word: וַיְכַל
  choice: terminou
  rationale: Expressa a conclusão da ação anterior e se encaixa naturalmente na sequência narrativa.
- source_word: מֵהַעֲלוֹת
  choice: de oferecer
  rationale: Após o verbo 'terminar', o infinitivo causativo de עלה tem, neste contexto sacrificial, o sentido de oferecer ou fazer subir uma oferta.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: É o termo sacrificial consagrado em português para a oferta totalmente queimada; o singular do hebraico foi mantido.
- source_word: וְהַשְּׁלָמִים
  choice: e as ofertas de comunhão
  rationale: שְׁלָמִים designa sacrifícios associados à paz, ao bem-estar e à comunhão. 'Ofertas de comunhão' comunica com clareza a natureza compartilhada dessa classe de sacrifícios sem restringir o termo à ideia moderna de ausência de conflito.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: Reproduz diretamente o sentido de ברך, sem expansão interpretativa.
- source_word: אֶת־הָעָם
  choice: o povo
  rationale: Refere-se ao conjunto do povo reunido e corresponde de modo simples e abrangente ao hebraico.
- source_word: בְּשֵׁם
  choice: em nome de
  rationale: Expressa naturalmente em português a autoridade ou o nome invocado na bênção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, comunica a ideia de forças ou exércitos sob o governo de Yahweh e soa mais transparente no português atual do que o tradicional 'dos Exércitos celestiais' ou 'dos Senhores dos Exércitos', que acrescentariam elementos ausentes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o caráter de nome pessoal, enquanto 'SENHOR' representa a tradicional substituição litúrgica.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos celestiais
  rationale: O hebraico permite uma referência ampla às hostes ou forças sob o comando divino. A tradução não limita explicitamente essas hostes ao âmbito celestial.
- issue: Designação dos sacrifícios שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas
  rationale: O termo inclui noções de paz, bem-estar e comunhão sacrificial. 'Comunhão' torna inteligível sua função sem eliminar completamente a amplitude lexical, registrada na nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa inteligibilidade no Brasil e em âmbito internacional. A construção evita repetir o sujeito antes de 'abençoou', pois a referência a Davi permanece clara. 'Holocausto' conserva o vocabulário bíblico reconhecível; 'ofertas de comunhão' favorece clareza contemporânea.
source_grounding:
  english_pob_role: consult_only
