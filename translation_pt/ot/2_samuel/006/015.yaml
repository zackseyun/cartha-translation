  text: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל מַעֲלִ֖ים אֶת אֲר֣וֹן יְהוָ֑ה בִּ/תְרוּעָ֖ה וּ/בְ/ק֥וֹל שׁוֹפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: pt
  text: Assim, Davi e toda a casa de Israel faziam subir a arca de Yahweh, em meio a aclamações[a] e ao som do shofar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com gritos de alegria”; o termo hebraico pode indicar uma aclamação jubilosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao som da trombeta”. O shofar é um instrumento de chifre, geralmente de carneiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: iam levando para o alto
  rationale: O particípio hifil expressa uma ação em andamento. A formulação também conserva o sentido de subida associado ao transporte da arca rumo a Jerusalém.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a imagem corporativa e familiar da expressão hebraica, sem reduzi-la simplesmente a “Israel”.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: “Arca” corresponde diretamente a אֲרוֹן, e “Yahweh” representa o nome divino expresso pelo Tetragrama.
- source_word: תְרוּעָה
  choice: aclamações
  rationale: O termo indica clamor forte, frequentemente jubiloso. “Aclamações” comunica o caráter festivo sem confundi-lo com o toque do instrumento mencionado em seguida.
- source_word: קוֹל שׁוֹפָר
  choice: ao som do shofar
  rationale: קוֹל significa “som”, e שׁוֹפָר designa o instrumento de chifre. Manter “shofar” evita sugerir uma trombeta metálica moderna e preserva a especificidade cultural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura narrativa natural. “Iam levando” conserva o aspecto progressivo; “casa de Israel” mantém a imagem hebraica; “shofar” é explicado em nota para assegurar compreensão ampla.
