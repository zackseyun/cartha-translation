  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: pt
  text: Quando chegaram à eira de Nacom[a], Uzá estendeu a mão para a arca de Deus e a segurou, porque os bois tropeçaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «à eira de Naquom»; menos provavelmente, «à eira firme» ou «à eira estabelecida».
    reason: lexical_alternative
  - marker: b
    text: Ou «porque os bois escorregaram»; o verbo também pode dar a entender que os bois quase fizeram a arca cair.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: eira
  rationale: Designa o local onde se debulhavam e joeiravam cereais; «eira» é o equivalente português preciso e tradicional, ainda compreensível no contexto.
- source_word: נָכוֹן
  choice: de Nacom
  rationale: A forma é entendida mais naturalmente aqui como nome próprio associado à eira. A possibilidade de valor adjetival é preservada em nota.
- source_word: וַיִּשְׁלַח
  choice: estendeu a mão
  rationale: Embora «mão» esteja implícita, esta é a expressão portuguesa natural para o gesto de estender o braço em direção a um objeto.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Mantém integralmente a identificação sagrada explícita na construção hebraica.
- source_word: וַיֹּאחֶז בּוֹ
  choice: a segurou
  rationale: Expressa com clareza o ato de agarrar ou tomar posse física da arca, sem sugerir violência além do texto.
- source_word: כִּי
  choice: porque
  rationale: Introduz naturalmente em português a causa da ação de Uzá.
- source_word: שָׁמְטוּ
  choice: tropeçaram
  rationale: No contexto, descreve de modo conciso a perda de firmeza dos bois. Como o verbo também pode indicar escorregar ou deixar algo cair, a ambiguidade é registrada em nota.
- source_word: הַבָּקָר
  choice: os bois
  rationale: No contexto do transporte da arca em carro, refere-se aos animais de tração; «bois» é mais específico que «gado».
theological_decisions:
- issue: Causa da ação de Uzá
  choice: Uzá segurou a arca porque os bois tropeçaram.
  alternative: Os bois escorregaram ou quase fizeram a arca cair.
  rationale: O hebraico apresenta os bois como sujeito de um verbo semanticamente amplo, ligado a escorregar, soltar ou deixar cair. A redação principal não acrescenta detalhes mecânicos nem afirma que a arca efetivamente caiu; a nota conserva as possibilidades relevantes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Eira» preserva a precisão histórico-agrícola; «estendeu a mão» torna explícito em português o gesto idiomático implícito no hebraico. A grafia «Nacom» oferece pronúncia natural em português, enquanto a variante de transliteração é indicada em nota.
