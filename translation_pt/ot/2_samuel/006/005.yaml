base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: pt
  text: Davi e toda a casa de Israel celebravam diante de Yahweh com toda espécie de instrumentos de madeira de cipreste[a], com liras, harpas, pandeiros, chocalhos[b] e címbalos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “com todas as madeiras de ciprestes”. A expressão provavelmente se refere a diversos instrumentos musicais feitos de madeira de cipreste; tanto a construção quanto a espécie de árvore são incertas.
    reason: lexical_alternative
  - marker: b
    text: A identificação exata é incerta; talvez fossem sistros ou outro tipo de instrumento de percussão sacudido.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: celebravam
  rationale: No piel, o verbo pode descrever atividade festiva, alegre e lúdica. “Celebravam” comunica naturalmente a ação coletiva da procissão sem reduzi-la a mero brincar.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o idioma hebraico de uma ação realizada na presença de Deus e mantém o nome divino expresso no texto-fonte.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: com toda espécie de instrumentos de madeira de cipreste
  rationale: A expressão hebraica é elíptica, literalmente algo como “com todas as madeiras de ciprestes”. O contexto musical favorece instrumentos feitos dessa madeira; a explicitação produz português inteligível, enquanto a nota registra a forma literal e a incerteza.
- source_word: בְרוֹשִׁים
  choice: cipreste
  rationale: É um equivalente moderno amplamente reconhecido, embora a identificação botânica exata da madeira permaneça incerta.
- source_word: כִנֹּרוֹת
  choice: liras
  rationale: Designa mais especificamente instrumentos de cordas do tipo lira, distintos dos נְבָלִים mencionados em seguida.
- source_word: נְבָלִים
  choice: harpas
  rationale: Termo acessível e convencional para o segundo tipo de instrumento de cordas, cuja forma exata não pode ser determinada com segurança.
- source_word: תֻפִּים
  choice: tamborins
  rationale: Refere-se a tambores de aro usados em celebrações; “tamborins” é corrente e compreensível em português.
- source_word: מְנַעַנְעִים
  choice: chocalhos
  rationale: O termo raro parece indicar instrumentos sacudidos para produzir som. “Chocalhos” expressa essa função sem impor a identificação técnica incerta como sistros.
- source_word: צֶלְצֶלִים
  choice: címbalos
  rationale: Equivalente consagrado para instrumentos metálicos de percussão chocados entre si.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Conserva a expressão corporativa hebraica e sua referência à comunidade nacional, em vez de simplificá-la para “todo o Israel”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém “casa de Israel” e “diante de Yahweh” por fidelidade ao perfil do hebraico, ao mesmo tempo que explicita “instrumentos” na expressão elíptica sobre a madeira. A pontuação com dois-pontos apresenta a lista como especificação dos instrumentos, sem alegar certeza além do contexto.
