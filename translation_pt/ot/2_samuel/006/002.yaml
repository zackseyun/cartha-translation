review_pass:
  verdict: revise
  source_fidelity: A cláusula final עלָיו (“sobre ela”) está ligada à fórmula de nomeação da arca, não à localização de Yahweh. A redação proposta desloca esse referente ao dizer “entronizado acima dos querubins”, deixando sem tradução explícita “sobre ela”. Uma formulação que associa “sobre a qual” à arca preserva melhor a sintaxe densa do hebraico.
  naturalness: O português é em geral claro e digno, mas “a qual é chamada pelo Nome, o nome de...” soa artificial e torna ambígua a relação entre o Nome e a arca. “Sobre a qual é invocado o Nome — o nome de...” é natural em registro bíblico moderno e esclarece a estrutura sem eliminá-la.
  terminology: “Davi”, “arca de Deus”, “Yahweh dos Exércitos” e “querubins” são adequados. A nota c deve apresentar apenas a alternativa tradicional relevante; chamar “Yahweh dos Exércitos” de tradução tradicional é impreciso, pois a forma tradicional portuguesa normalmente emprega “SENHOR dos Exércitos”.
  issues:
  - severity: high
    issue: O pronome final עלָיו não foi representado na cláusula de nomeação.
    rationale: No hebraico, a fórmula pode ser entendida como “sobre a qual é chamado/invocado o nome”; a versão atual prende a expressão locativa aos querubins e assim não dá conta do referente à arca.
  - severity: medium
    issue: A nota c caracteriza de modo impreciso a tradição de tradução.
    rationale: A alternativa tradicional pertinente é “SENHOR dos Exércitos”; “Yahweh dos Exércitos” corresponde à opção editorial adotada, não à substituição tradicional do Tetragrama por um título.
  - severity: low
    issue: A nota d apresenta “entre os querubins” como alternativa, mas a redação principal precisa manter a relação de Yahweh com os querubins distinta de “sobre a qual”, referente à arca.
    rationale: A revisão da sintaxe torna a nota locativa útil sem deslocar o pronome final do texto hebraico.
  revised_text: Davi se levantou e partiu, com todo o povo que estava com ele, de Baale-Judá[a], para fazer subir dali a arca de Deus, sobre a qual é invocado o Nome — o nome de Yahweh dos Exércitos[b][c], que está entronizado sobre os querubins[d].
