base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: pt
  text: Davi se levantou e partiu, com todo o povo que estava com ele, de Baale-Judá[a], para fazer subir dali a arca de Deus, sobre a qual é invocado o Nome — o nome de Yahweh dos Exércitos[b][c], que está entronizado sobre os querubins[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Baalá de Judá”. A forma hebraica aqui é incomum e pode se referir a um lugar associado a Quiriate-Jearim.
    reason: alternative_reading
  - marker: b
    text: Ou “a qual é chamada pelo Nome”. A fórmula hebraica é condensada e também pode ser traduzida mais literalmente como “sobre a qual é chamado o nome de Yahweh dos Exércitos”.
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: d
    text: Ou “que habita entre os querubins”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: se levantou e partiu
  rationale: Mantém os dois verbos da sequência narrativa hebraica. “Partiu” expressa com naturalidade o início do deslocamento sem fundir os verbos.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: com todo o povo que estava com ele
  rationale: Explicita de modo natural que o povo acompanhava Davi, preservando a abrangência de כָל.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: de Baale-Judá
  rationale: O contexto favorece a leitura como topônimo, embora a forma hebraica seja incomum; a alternativa “Baalá de Judá” é registrada em nota.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: para fazer subir dali
  rationale: Reproduz o sentido causativo do hifil de עלה e conserva a linguagem tradicional do transporte da arca em direção a Jerusalém.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: É a designação direta e corrente da arca neste contexto narrativo.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: a qual é chamada pelo Nome
  rationale: Preserva a fórmula solene e comprimida do hebraico sem reduzi-la simplesmente a posse; a inicial maiúscula comunica a força reverencial de “Nome” neste contexto.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: o nome de Yahweh dos Exércitos
  rationale: Verte o nome divino como “Yahweh” e traduz צְבָאוֹת de modo transparente para leitores atuais, mantendo a dimensão militar e celestial do título.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: que está entronizado acima dos querubins
  rationale: No contexto da arca, יֹשֵׁב evoca realeza e entronização, não mera residência. “Acima dos querubins” comunica a imagem com clareza, sem ocultar em nota as alternativas possíveis.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos; dos Exércitos celestiais; dos Poderes
  rationale: “Exércitos” é compreensível em português moderno e conserva a amplitude marcial e celestial do título, sem impor uma especificação ausente no hebraico.
- issue: Fórmula comprimida que associa o Nome à arca
  choice: a qual é chamada pelo Nome, o nome de Yahweh dos Exércitos
  alternative: sobre a qual é invocado o nome de Yahweh dos Exércitos
  rationale: A redação principal mantém a repetição enfática de שֵׁם e a associação solene entre a arca e o Nome, enquanto a nota preserva a possibilidade sintática de que o Nome seja invocado sobre ela.
- issue: Sentido de יֹשֵׁב em relação aos querubins
  choice: que está entronizado acima dos querubins
  alternative: que habita entre os querubins
  rationale: A imagem cultual da arca favorece a ideia de entronização divina, mas a nota mantém a tradução locativa tradicional sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a sequência narrativa hebraica, o topônimo incomum e a densidade da fórmula do Nome. Emprega “arca”, “querubins” e “entronizado” por serem termos bíblicos correntes, mas ainda acessíveis.
