revisions:
- from: Davi se levantou e partiu, com todo o povo que estava com ele, de Baale-Judá[a], para fazer subir dali a arca de Deus, a qual é chamada pelo Nome, o nome de Yahweh dos Exércitos[b][c], que está entronizado acima dos querubins[d].
  to: Davi se levantou e partiu, com todo o povo que estava com ele, de Baale-Judá[a], para fazer subir dali a arca de Deus, sobre a qual é invocado o Nome — o nome de Yahweh dos Exércitos[b][c], que está entronizado sobre os querubins[d].
  rationale: A revisão restaura a ligação sintática entre a arca e o pronome final da fórmula de nomeação (“sobre a qual”), preservando a repetição enfática de “Nome” e a ambiguidade própria da construção hebraica. “Entronizado sobre os querubins” continua uma interpretação contextual plausível de יֹשֵׁב הַכְּרֻבִים, com a alternativa locativa mantida em nota. A nota sobre a tradução tradicional do nome divino foi corrigida.
