  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: pt
  text: Trouxeram a arca de Yahweh e a colocaram em seu lugar, dentro da tenda que Davi havia armado para ela. Então Davi ofereceu diante de Yahweh ofertas totalmente queimadas e ofertas de comunhão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas de paz” ou “ofertas de bem-estar”.
    reason: O hebraico שְׁלָמִים possui uma amplitude semântica que nenhuma dessas expressões portuguesas representa por completo.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: אֲרוֹן designa a arca sagrada, e יְהוָה é preservado como nome pessoal divino, em vez de ser substituído por um título.
- source_word: וַיָּבִאוּ
  choice: Trouxeram
  rationale: O hifil de בוא expressa fazer chegar ou trazer; o contexto da entrada e instalação na tenda torna “Trouxeram” natural e suficiente em português.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: e a colocaram em seu lugar
  rationale: יצג indica colocar ou posicionar deliberadamente. O pronome feminino retoma naturalmente “arca” em português.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: dentro da tenda
  rationale: בְּתוֹךְ indica localização no interior; “dentro da tenda” é claro e corrente.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: que Davi havia armado para ela
  rationale: נטה, usado com uma tenda, significa estender ou armar. O mais-que-perfeito composto deixa claro que a tenda já estava preparada, e “para ela” retoma a arca.
- source_word: וַיַּעַל דָּוִד
  choice: Então Davi ofereceu
  rationale: עלה, em contexto sacrificial, significa fazer subir ou oferecer um sacrifício. “Então” representa naturalmente a progressão narrativa do waw consecutivo.
- source_word: עֹלוֹת
  choice: ofertas totalmente queimadas
  rationale: עֹלָה é o sacrifício consumido integralmente no altar. A formulação evita a ambiguidade moderna de “holocaustos” e explicita a natureza da oferta.
- source_word: וּשְׁלָמִים
  choice: e ofertas de comunhão
  rationale: שְׁלָמִים designa sacrifícios associados à integridade, ao bem-estar, à paz e à refeição compartilhada. “Ofertas de comunhão” é compreensível, enquanto a nota preserva alternativas legítimas.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa literalmente “diante de” ou “na presença de”; a opção conserva a formulação cultual concisa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo pelo título “SENHOR”; “Javé” é uma adaptação portuguesa possível, mas menos diretamente transliterada.
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo abrange paz, integridade, bem-estar e comunhão sacrificial. A tradução principal destaca o aspecto relacional sem eliminar as demais nuances, que são registradas em nota.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa fluente. Evitou-se “holocaustos” por suas fortes associações modernas, preferindo-se uma expressão descritiva. O marcador da nota foi colocado junto de “ofertas de comunhão”, termo ao qual a nota efetivamente se refere.
