id: JON.3.6
reference: Jonah 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: pt
  text: Quando a mensagem chegou ao rei de Nínive[a], ele se levantou do trono, tirou seu manto[b], cobriu-se com pano de saco e sentou-se sobre as cinzas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a notícia”, “o assunto” ou “a palavra chegou ao rei de Nínive”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua veste exterior”. O termo hebraico pode designar um manto distinto ou majestoso.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre a cinza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: a mensagem chegou
  rationale: No contexto, נגע com אֶל indica que algo chegou ao conhecimento de alguém; דָּבָר pode significar palavra, assunto, notícia ou mensagem. “A mensagem chegou” é natural e mantém a referência à proclamação de Jonas.
- source_word: מֶלֶךְ נִינְוֵה
  choice: rei de Nínive
  rationale: Reproduz com clareza a relação construta hebraica, sem acrescentar uma identificação histórica não expressa no texto.
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: ele se levantou do trono
  rationale: כִּסֵּא pode ser assento ou trono; o sujeito real favorece “trono”, que também preserva o contraste simbólico do rebaixamento do rei.
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: tirou seu manto
  rationale: O hifil de עבר expressa remoção, e אַדֶּרֶת designa uma veste exterior, possivelmente distinta ou majestosa. “Tirou seu manto” comunica a ação reflexiva de modo natural em português.
- source_word: וַיְכַס שַׂק
  choice: cobriu-se com pano de saco
  rationale: A construção indica que o rei cobriu o próprio corpo com שַׂק, tecido áspero associado ao luto e à humilhação. A forma reflexiva explicita naturalmente o sentido implícito.
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: sentou-se sobre as cinzas
  rationale: Mantém o valor básico de עַל, “sobre”, e verte o substantivo coletivo/singular hebraico pela expressão portuguesa idiomática “as cinzas”.
theological_decisions:
- issue: Atos reais de humilhação e possível arrependimento
  choice: Narrar somente os gestos do rei, sem chamá-los explicitamente de arrependimento.
  alternative: Acrescentar que o rei se arrependeu ou realizou atos de penitência.
  rationale: As ações evocam luto, humilhação e arrependimento no contexto, mas este versículo descreve os atos sem formular diretamente essa conclusão teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência rápida de ações do hebraico foi preservada. “Pano de saco” mantém a imagem bíblica tradicional sem inserir no corpo do texto uma explicação interpretativa.
