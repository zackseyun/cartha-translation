  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: pt
  text: Então Jonas se levantou e foi a Nínive, conforme a palavra de Yahweh. Nínive era uma cidade muito grande diante de Deus[a], uma jornada de três dias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma grande cidade para/diante de Deus”. A expressão também pode funcionar como superlativo: “uma cidade imensamente grande”.'
    reason: alternative_reading
  - marker: b
    text: A expressão pode indicar o tempo necessário para atravessar a cidade ou para completar uma visita por ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Traduz diretamente קום e preserva a cadência narrativa e o contraste com a reação de Jonas em 1:3.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Equivalente corrente e direto de הלך neste contexto de deslocamento.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Mantém o idiomatismo hebraico e destaca que Jonas agiu em obediência à ordem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: uma cidade muito grande diante de Deus
  rationale: Conserva a referência explícita a Deus e comunica de modo natural a provável força intensificadora da expressão, sem ocultar sua ambiguidade.
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: uma jornada de três dias
  rationale: Preserva a medida temporal ou espacial sem decidir se ela indica a travessia da cidade ou o tempo necessário para percorrê-la em visita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e a transliteração preserva sua condição de nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de לֵאלֹהִים em עִיר גְּדוֹלָה לֵאלֹהִים
  choice: muito grande diante de Deus
  alternative: imensamente grande; uma grande cidade para Deus
  rationale: A formulação principal mantém a referência explícita a Deus e também sinaliza a força superlativa provável; a nota registra a leitura idiomática alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa permanece simples; “conforme a palavra” conserva o tom bíblico sem soar arcaico. Os marcadores [a] e [b] aparecem no texto junto às expressões que explicam.
