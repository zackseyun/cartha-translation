base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: pt
  text: 'E ele mandou proclamar em Nínive, por decreto do rei e de seus nobres[a]: “Nem ser humano[b] nem animal, nem gado nem rebanho provem coisa alguma. Não pastem nem bebam água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rei e seus grandes”; também pode ser traduzido por “o rei e suas autoridades”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa aqui adam como termo coletivo para os seres humanos, em contraste com os animais; também se pode traduzir por “humanidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: mandou proclamar e dizer
  rationale: A forma causativa de זעק indica que ele fez anunciar publicamente a ordem; a coordenação com ויאמר é preservada sem tornar a frase artificial em português.
- source_word: בְּנִינְוֵה
  choice: em Nínive
  rationale: Reproduz diretamente o valor locativo da preposição hebraica.
- source_word: מִטַּעַם
  choice: por decreto de
  rationale: Neste contexto administrativo, טַעַם designa uma decisão ou ordem oficial, não o sentido comum de “sabor”.
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: o rei e seus nobres
  rationale: “Nobres” comunica naturalmente os homens de alta posição associados ao rei; a nota preserva o sentido mais literal de “seus grandes” e a alternativa funcional “autoridades”.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: ser humano nem animal
  rationale: אָדָם é coletivo e contrasta toda a população humana com os animais. “Ser humano” expressa essa extensão sem sugerir apenas adultos do sexo masculino.
- source_word: הַבָּקָר וְהַצֹּאן
  choice: gado nem rebanho
  rationale: Os substantivos coletivos designam, respectivamente, animais de manada e animais de rebanho; a formulação portuguesa mantém as categorias sem restringi-las indevidamente a uma única espécie.
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: não provem coisa alguma
  rationale: Conserva o sentido literal de טעם, “provar”, e expressa a proibição total de alimento.
- source_word: אַל יִרְעוּ
  choice: não pastem
  rationale: רעה, neste contexto pecuário, significa alimentar-se no pasto ou pastar.
- source_word: וּמַיִם אַל יִשְׁתּוּ
  choice: nem bebam água
  rationale: Mantém o objeto explícito “água” e coordena de modo natural a segunda proibição.
theological_decisions:
- issue: Sentido coletivo de הָאָדָם no contraste entre humanos e animais
  choice: ser humano
  alternative: homem; humanidade; pessoas
  rationale: O singular hebraico é coletivo e abrange os habitantes em geral. “Ser humano” preserva o contraste com “animal” e evita restringir o decreto aos homens, sem apagar a forma singular coletiva.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com cadência de decreto público. A repetição das proibições e as categorias coletivas do hebraico foram mantidas, evitando arcaísmos como “bestas” e a leitura restritiva de “homem”.
