  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
translation:
  language: pt
  text: Quem sabe? Deus se volte e recue[a], afastando-se do ardor de sua ira[b], para que não pereçamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “mude de ideia” ou “se arrependa”. Aqui, o verbo se refere a Deus deixar de executar o juízo anunciado.
    reason: alternative_reading
  - marker: b
    text: O hebraico diz literalmente “do ardor de sua ira”, uma imagem de ira intensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Quem sabe?
  rationale: Mantém a força retórica da expressão hebraica, que comunica incerteza acompanhada de esperança.
- source_word: יָשׁוּב
  choice: talvez Deus volte atrás
  rationale: Depois de “Quem sabe?”, a forma verbal expressa possibilidade, não certeza. “Volte atrás” preserva o sentido básico de mudança de direção.
- source_word: וְנִחַם
  choice: e desista
  rationale: No contexto, o verbo indica que Deus pode deixar de executar o juízo anunciado. A nota registra alternativas mais literais e preserva a tensão teológica do texto.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Tradução portuguesa normal do substantivo hebraico definido neste contexto.
- source_word: וְשָׁב
  choice: e se afaste
  rationale: 'Expressa de modo natural o segundo uso de שוב com a preposição “de”: Deus se afastaria do ardor da sua ira. A repetição conceitual do movimento de retorno permanece, embora não se repita o mesmo verbo em português.'
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: do ardor da sua ira
  rationale: Preserva a imagem hebraica de calor ou queima associada à ira intensa, em linguagem digna e compreensível.
- source_word: וְלֹא נֹאבֵד
  choice: para que não pereçamos
  rationale: Torna explícita a consequência esperada sem alterar a primeira pessoa do plural nem o sentido do verbo “perecer”.
theological_decisions:
- issue: A mudança atribuída a Deus pelo verbo נחם
  choice: Deus talvez “desista” do juízo anunciado
  alternative: Deus talvez “mude de ideia” ou “se arrependa”
  rationale: “Desista” comunica que Deus pode não executar a destruição anunciada, sem apagar a apresentação bíblica de sua resposta ao arrependimento humano. A nota mantém visíveis alternativas lexicais que exprimem ainda mais diretamente a mudança atribuída a Deus, sem resolver filosoficamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Quem sabe?” conserva a concisão retórica; “ardor da sua ira” mantém a imagem hebraica sem soar excessivamente coloquial.
