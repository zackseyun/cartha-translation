revisions:
- from: Quem sabe? Talvez Deus volte atrás e desista[a], e se afaste do ardor da sua ira[b], para que não pereçamos.
  to: Quem sabe? Deus se volte e recue[a], afastando-se do ardor de sua ira[b], para que não pereçamos.
  rationale: A revisão substitui “desista” por “recue”, opção mais precisa para o verbo נחם no contexto de juízo anunciado, e elimina a duplicação modal de “Quem sabe? Talvez”. A construção “se volte ... afastando-se” reproduz de maneira natural os dois usos de שוב e mantém a imagem do ardor da ira. As notas permanecem corretamente ancoradas e preservam as alternativas interpretativas relevantes.
