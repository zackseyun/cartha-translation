  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: pt
  text: Que tanto os seres humanos como os animais se cubram de pano de saco, clamem com força a Deus e cada um se afaste do seu mau caminho e da violência que está nas mãos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular — “cada um... seu mau caminho” — ao plural — “nas mãos deles”.
    reason: Preservação da mudança de número e da tensão entre responsabilidade individual e coletiva.
lexical_decisions:
- source_word: וְיִתְכַּסּוּ
  choice: se cubram
  rationale: O hitpael pode ter sentido reflexivo ou médio-passivo; “se cubram” é natural em português e conserva a força exortativa do decreto.
- source_word: שַׂקִּים
  choice: pano de saco
  rationale: Refere-se ao tecido ou à veste áspera usada como sinal de luto, humilhação e arrependimento; “pano de saco” é a expressão bíblica corrente e inteligível em português.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: os seres humanos e os animais
  rationale: Os substantivos hebraicos são coletivos e estabelecem o contraste entre a população humana e os animais domésticos. O plural português soa natural sem perder esse contraste.
- source_word: וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחָזְקָה
  choice: clamem com força a Deus
  rationale: קרא אל indica aqui uma invocação urgente, e בְּחָזְקָה intensifica o clamor. “Com força” preserva essa intensidade sem reduzir a expressão apenas à sinceridade interior.
- source_word: וְיָשֻׁבוּ
  choice: se afaste
  rationale: שׁוב expressa voltar-se ou abandonar uma direção. “Afastar-se de” funciona naturalmente com os complementos introduzidos por מִן e conserva a imagem de mudança de conduta sem substituir o verbo por um termo teológico mais específico.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular distributivo significa cada indivíduo entre o povo. “Cada um” preserva tanto a distribuição individual quanto a forma masculina representativa do hebraico.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: do seu mau caminho
  rationale: “Caminho” mantém a metáfora hebraica para conduta ou modo de vida, e “mau” traduz diretamente רָעָה.
- source_word: וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם
  choice: e da violência que está nas mãos deles
  rationale: “Violência” é a correspondência direta de חָמָס. A tradução conserva a imagem das mãos e o pronome plural hebraico, apesar do distributivo singular anterior.
theological_decisions:
- issue: Linguagem de arrependimento em שׁוב
  choice: “se afaste”
  alternative: “se arrependa” ou “volte”
  rationale: O contexto envolve arrependimento moral, mas o verbo hebraico apresenta concretamente uma mudança de direção. A opção escolhida comunica o abandono da má conduta sem impor no texto principal um termo teológico mais estreito.
- issue: Linguagem humana representativa em הָאָדָם e אִישׁ
  choice: “os seres humanos” e “cada um”
  alternative: “o homem” e “cada homem”
  rationale: הָאָדָם é coletivo no contraste com os animais, e אִישׁ é distributivo. As formas escolhidas são naturais no português atual, abrangem corretamente a população de Nínive e não eliminam a forma masculina distributiva de “cada um”.
- issue: Mudança de número entre אִישׁ/דַּרְכּוֹ e כַּפֵּיהֶם
  choice: preservar “cada um... seu” e depois “deles”
  alternative: uniformizar tudo no singular ou no plural
  rationale: O hebraico passa deliberadamente do indivíduo distributivo ao grupo plural. Preservar a mudança evita harmonizar silenciosamente a responsabilidade individual e a culpa coletiva.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Pano de saco” mantém o referente cultural tradicional; “clamem com força” reproduz a intensidade da proclamação sem arcaísmo excessivo.
