source:
  edition: WLC
  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: pt
  text: Levante-se, vá a Nínive, a grande cidade, e proclame-lhe[a] a proclamação que eu lhe disser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clame a ela”. Em Jonas 1:2, a ordem é clamar “contra” Nínive; aqui, porém, o hebraico diz literalmente “a ela”.'
    reason: Registra a amplitude semântica de קרא e a diferença entre a preposição deste versículo e a de Jonas 1:2.
lexical_decisions:
- source_word: ק֛וּם
  choice: Levante-se
  rationale: O imperativo de קום pede que Jonas se erga e aja. “Levante-se” é atual, claro e mantém a urgência solene da ordem.
- source_word: לֵ֥ךְ
  choice: vá
  rationale: Neste encadeamento de imperativos, הלך é o verbo comum de movimento; “vá” é seu equivalente natural em português.
- source_word: נִֽינְוֵ֖ה
  choice: Nínive
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הָ/עִ֣יר הַ/גְּדוֹלָ֑ה
  choice: a grande cidade
  rationale: גדול pode indicar tamanho e importância. “A grande cidade” preserva essa amplitude e a repetição literária do livro.
- source_word: וִּ/קְרָ֤א אֵלֶ֨י/הָ֙
  choice: e proclame-lhe
  rationale: קרא pode significar chamar, clamar ou proclamar. A preposição אֶל significa aqui “a/para”, não “contra”; “proclame-lhe” preserva essa direção sem antecipar o teor da mensagem.
- source_word: אֶת הַ/קְּרִיאָ֔ה
  choice: a proclamação
  rationale: O substantivo קְרִיאָה é cognato do verbo קרא. “Proclamação” conserva tanto o sentido formal do anúncio comissionado quanto a repetição lexical do hebraico.
- source_word: אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ
  choice: que eu lhe disser
  rationale: דבר אֶל significa “falar a”. No contexto da mensagem que Jonas deverá anunciar, “que eu lhe disser” é idiomático em português e permite que a instrução divina seja dada ou completada no momento determinado, sem tornar a frase artificial.
theological_decisions:
- issue: Relação da proclamação de Jonas com Nínive
  choice: proclame-lhe
  alternative: clame contra ela
  rationale: Neste versículo, o hebraico usa אֶל (“a/para”), ao passo que Jonas 1:2 usa עַל (“contra”). A tradução mantém essa mudança e não intensifica a hostilidade da comissão além do que esta formulação declara. A mensagem pode ser de juízo, mas a preposição deste versículo não o explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “proclame-lhe a proclamação” é deliberadamente mais formal para preservar a repetição cognata קרא/קְרִיאָה do hebraico. O pronome “lhe” evita repetição pesada e corresponde ao objeto indireto marcado por אֶל.
