  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶל יוֹנָ֖ה שֵׁנִ֥ית לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/001.yaml
  text: Then the word of Yahweh came to Jonah a second time[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jonas pela segunda vez[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “novamente”. O hebraico assinala explicitamente a repetição após o encargo anterior dado a Jonas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa de היה com waw faz a narrativa avançar. “Então” expressa a sequência com naturalidade, enquanto “veio” se combina idiomaticamente com “a palavra de Yahweh”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e sua ressonância bíblica; “mensagem” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל יוֹנָה
  choice: a Jonas
  rationale: אֶל assinala o destinatário da palavra divina; em português, a construção natural é “veio a Jonas”.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Expressa com precisão a repetição explícita e ressalta a nova comissão dada a Jonas.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o conteúdo do discurso divino que vem no versículo seguinte; os dois-pontos tornam essa função clara em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formulação amplamente compreensível. A ordem foi ajustada à sintaxe natural do português sem perder a fórmula profética nem a ênfase na repetição.
