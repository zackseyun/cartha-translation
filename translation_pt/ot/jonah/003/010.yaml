  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: pt
  text: Quando Deus viu o que eles fizeram — que tinham se afastado do seu mau caminho —, voltou atrás quanto à calamidade que havia dito que traria sobre eles[a] e não a trouxe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mesma palavra hebraica está por trás de “mau” e “calamidade”. No primeiro caso, refere-se à maldade dos ninivitas; no segundo, à calamidade ou ao juízo anunciado. “Voltou atrás” também pode ser traduzido por “desistiu” ou “mudou de ideia”. A expressão descreve a resposta de Deus à mudança dos ninivitas, sem indicar culpa moral da parte dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o verbo narrativo simples ראה sem acrescentar a ideia mais interpretativa de apenas perceber ou levar em conta.
- source_word: מַעֲשֵׂיהֶם
  choice: o que eles fizeram
  rationale: Expressa de modo natural e claro as ações dos habitantes de Nínive, sem as possíveis conotações teológicas de “obras”.
- source_word: כִּי שָׁבוּ
  choice: que tinham abandonado
  rationale: כִּי explicita o conteúdo evidenciado pelas ações, e שׁוב descreve o afastamento do caminho anterior. “Tinham abandonado” comunica naturalmente em português a mudança já realizada.
- source_word: מִדַּרְכָּם הָרָעָה
  choice: o seu mau caminho
  rationale: Mantém o singular coletivo e a metáfora moral de דֶּרֶךְ. “Mau” traduz aqui רָעָה como mal moral.
- source_word: וַיִּנָּחֶם
  choice: desistiu
  rationale: Neste contexto, נחם indica que Deus não levou adiante o juízo anunciado. “Desistiu” preserva a mudança real no curso da ação sem sugerir arrependimento por culpa moral.
- source_word: עַל הָרָעָה
  choice: do mal
  rationale: Mantém deliberadamente a repetição de רָעָה presente no hebraico, deixando o contexto mostrar que aqui se trata do mal aflitivo ou calamidade anunciada, e não de maldade moral.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: que havia dito que lhes faria
  rationale: Reproduz com clareza a construção hebraica e preserva o verbo “fazer”, retomado na oração final.
- source_word: וְלֹא עָשָׂה
  choice: e não o fez
  rationale: Mantém a concisão e a repetição verbal do original, com o objeto implícito recuperado pelo pronome.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: É a tradução portuguesa padrão para אֱלֹהִים quando designa o Deus que age na narrativa.
theological_decisions:
- issue: Linguagem antropopática em וַיִּנָּחֶם
  choice: “Deus desistiu”
  alternative: “Deus mudou de ideia”; “Deus se arrependeu”; “Deus lamentou”
  rationale: O texto apresenta uma mudança real na execução do juízo anunciado em resposta à conversão de Nínive. “Desistiu” conserva essa tensão sem atribuir a Deus pecado, erro ou ignorância.
- issue: Os dois usos de רָעָה
  choice: “mau caminho” e “mal”
  alternative: “mau caminho” e “calamidade”
  rationale: 'A mesma palavra hebraica aparece nas duas expressões, embora tenha sentidos contextuais distintos: maldade moral no primeiro caso e calamidade ou juízo no segundo. Manter “mau/mal” preserva o vínculo retórico, enquanto a nota esclarece a diferença sem imputar maldade moral a Deus.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição retórica do hebraico entre “mau” e “mal” e a tensão da resposta divina, explicando ambas na nota.
