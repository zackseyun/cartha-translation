  naturalness: A revisão torna a relação entre a entrada e o percurso mais clara e idiomática. «Será transtornada» mantém um registro profético sóbrio e é mais natural neste contexto do que «será subvertida».
  terminology: «Transtornada» pode comunicar tanto a ruína/derrubamento anunciada pelo verbo hebraico quanto a noção mais ampla de reversão, sem antecipar uma explicação doutrinária do desfecho. A nota explicita alternativas sem reduzir a ambiguidade lexical.
