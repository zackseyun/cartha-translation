base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: pt
  text: 'Jonas começou a entrar na cidade, num percurso de um dia[a], e clamou, dizendo: “Mais quarenta dias, e Nínive será transtornada[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa caminhada de um dia”. Literalmente, “percurso de um dia”; a expressão indica a distância ou o percurso de um dia.
    reason: lexical_alternative
  - marker: b
    text: Ou “será derrubada” ou “será virada”. O verbo hebraico pode referir-se ao derrubamento em juízo e também a uma reversão profunda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: começou
  rationale: O hifil de חלל, seguido do infinitivo לָבוֹא, indica aqui o início da ação. “Começou” é direto e natural em português.
- source_word: לָבוֹא בָעִיר
  choice: a entrar na cidade
  rationale: בוא com ב expressa movimento para dentro. “Entrar na cidade” comunica isso com clareza e concisão.
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: avançou a distância de um dia
  rationale: A expressão indica o percurso ou a distância coberta em um dia. Esta formulação mantém o sentido espacial e evita sugerir necessariamente um período completo de permanência na cidade.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: clamou e disse
  rationale: A manutenção dos dois verbos reproduz a sequência enfática do hebraico e apresenta a mensagem como proclamação pública e audível.
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: Mais quarenta dias
  rationale: עוֹד marca o tempo ainda restante antes do acontecimento anunciado. “Mais quarenta dias” soa natural em português e preserva a ideia de contagem regressiva.
- source_word: נֶהְפָּכֶת
  choice: será subvertida
  rationale: O nifal de הפך pode indicar que algo é virado, derrubado ou radicalmente alterado. “Subvertida” conserva melhor que “destruída” a amplitude semântica e a tensão entre juízo e reversão.
theological_decisions:
- issue: Força semântica de נֶהְפָּכֶת na advertência de Jonas
  choice: será subvertida
  alternative: será derrubada; será destruída; será virada do avesso
  rationale: O verbo pode anunciar uma queda catastrófica, mas também comporta a noção mais ampla de reversão. A escolha evita limitar antecipadamente o anúncio à destruição física e preserva a tensão literária e teológica do relato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa e a repetição enfática do hebraico foram preservadas sem produzir uma construção excessivamente rígida.
