base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: pt
  text: Os habitantes de Nínive creram em Deus[a], proclamaram um jejum e vestiram-se de pano de saco, desde o maior até o menor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiaram em Deus”. A construção hebraica pode expressar tanto crer em Deus como confiar nele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ ... בֵּאלֹהִים
  choice: creram em Deus
  rationale: A construção אמן no hiphil com ב pode indicar crer em alguém ou confiar nessa pessoa. Em português, “creram em Deus” é natural e mantém a referência pessoal sem ampliar a afirmação para conversão ou fé salvífica.
- source_word: אַנְשֵׁי נִינְוֵה
  choice: os habitantes de Nínive
  rationale: Embora אַנְשֵׁי seja formalmente masculino e possa ser traduzido por “homens de”, aqui designa coletivamente a população da cidade, como confirma a abrangência “desde o maior até o menor”. “Habitantes” comunica esse sentido sem restringi-lo indevidamente a adultos do sexo masculino.
- source_word: וַיִּקְרְאוּ צוֹם
  choice: proclamaram um jejum
  rationale: קרא com צום descreve a declaração pública de um jejum coletivo. “Proclamaram um jejum” é claro, digno e próximo da forma hebraica.
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: vestiram pano de saco
  rationale: A expressão descreve o ato de usar tecido grosseiro como sinal de humilhação e lamento. “Vestiram pano de saco” conserva a imagem bíblica e é compreensível em português.
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: desde o maior até o menor
  rationale: O merismo abrange todos os níveis de condição, importância ou idade. A formulação mantém a concisão e a ambiguidade do hebraico quanto ao critério exato.
theological_decisions:
- issue: Natureza da resposta dos ninivitas a Deus
  choice: creram em Deus
  alternative: arrependeram-se diante de Deus; depositaram fé salvífica em Deus
  rationale: O versículo afirma crença, jejum e uso de pano de saco. Não se acrescenta uma definição teológica de conversão, arrependimento completo ou fé salvífica além do que o texto declara.
- issue: Sentido de אמן com ב
  choice: manter no texto “creram em Deus” e registrar a nuance de confiança em nota
  alternative: acreditaram em Deus; confiaram em Deus
  rationale: A construção hebraica admite tanto aceitação da palavra divina quanto confiança em Deus. O texto principal usa uma expressão portuguesa natural, enquanto a nota preserva explicitamente a amplitude semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Habitantes” exprime o valor coletivo de אַנְשֵׁי no contexto; “pano de saco” preserva a imagem cultural bíblica. A coordenação foi tornada fluente em português sem perder a sequência narrativa.
