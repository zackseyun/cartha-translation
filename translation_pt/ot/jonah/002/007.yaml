  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: pt
  text: Desci até as bases dos montes[a]; a terra, com seus ferrolhos, cercou-me para sempre[b]. Mas tu fizeste a minha vida subir da cova[c], ó Yahweh, meu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até as extremidades” ou “até os confins inferiores dos montes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terra — seus ferrolhos se fecharam atrás de mim para sempre”. A imagem hebraica é a de alguém aprisionado pelos ferrolhos ou pelas trancas da terra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “da sepultura” ou “da destruição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: até as bases dos montes
  rationale: קֶצֶב indica extremidade, limite ou ponto mais remoto. No contexto da descida às profundezas, “bases dos montes” comunica naturalmente seus confins inferiores sem substituir a imagem poética.
- source_word: יָרַדְתִּי
  choice: Desci
  rationale: O qal perfeito na primeira pessoa descreve diretamente o movimento para baixo; “desci” é conciso e natural em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “país” ou “solo”, a associação com montes, ferrolhos e cova favorece “terra” como o domínio que encerra o suplicante nas profundezas.
- source_word: בְּרִחֶיהָ
  choice: com seus ferrolhos
  rationale: בְּרִיחַ designa uma barra ou tranca usada para fechar. “Ferrolhos” preserva a imagem concreta de aprisionamento sem transformá-los interpretativamente em portões.
- source_word: בַעֲדִי
  choice: cercou-me
  rationale: A preposição pode sugerir algo ao redor, sobre ou atrás de alguém. Com os ferrolhos da terra, “cercou-me” expressa o encerramento, enquanto a nota conserva a leitura alternativa de fechamento atrás do suplicante.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão comunica duração indefinida e, aqui, a aparente finalidade da morte na experiência do orante. “Para sempre” mantém essa força poética sem explicar além do texto.
- source_word: וַתַּעַל
  choice: fizeste subir
  rationale: O hifil de עלה indica que Deus causou a subida. A formulação mantém o contraste vertical entre descer às profundezas e ser elevado delas.
- source_word: מִשַּׁחַת
  choice: da cova
  rationale: שַׁחַת pode significar cova, sepultura ou destruição. “Cova” preserva a imagem concreta e deixa implícita, sem eliminá-la, sua associação com a morte.
- source_word: חַיַּי
  choice: a minha vida
  rationale: A forma significa literalmente “minha vida” e pode representar a própria pessoa. A tradução literal conserva a ênfase poética no resgate da vida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de substituído por um título, preservando sua ocorrência explícita no hebraico.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: A forma possessiva é vertida diretamente e conserva o caráter pessoal da invocação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Força temporal de לְעוֹלָם no contexto da oração diante da morte
  choice: para sempre
  alternative: por muito tempo; perpetuamente
  rationale: A expressão retrata a finalidade aparentemente absoluta da situação vivida pelo suplicante. A tradução mantém essa tensão poética, sem afirmar que ele permaneceu literalmente ali por uma duração infinita.
- issue: Imagem de resgate em מִשַּׁחַת
  choice: da cova
  alternative: da sepultura; da destruição
  rationale: “Cova” mantém simultaneamente a topografia da descida e a sugestão de morte, sem decidir se o termo deve ser entendido exclusivamente como sepultura ou destruição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe poética clara. “Montes” e “ferrolhos” preservam o relevo bíblico sem arcaísmo excessivo; “fizeste subir” retém deliberadamente o contraste vertical do hebraico.
