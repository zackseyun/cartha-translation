  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: pt
  text: Mas eu, com voz de gratidão, oferecerei sacrifício a ti; o que prometi, cumprirei. A salvação pertence a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O livramento vem de Yahweh” ou “A salvação vem de Yahweh”. A palavra hebraica pode indicar o resgate ou livramento nesta situação e também ter o sentido mais amplo de salvação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção e o pronome independente marcam contraste enfático com os que se apegam a ídolos no versículo anterior; “Mas eu” expressa isso com naturalidade em português.
- source_word: בְּקוֹל תּוֹדָה
  choice: com voz de gratidão
  rationale: Preserva a imagem concreta de קוֹל, “voz/som”, e entende תּוֹדָה como gratidão ou ação de graças expressa audivelmente, sem acrescentar a ideia específica de canto.
- source_word: אֶזְבְּחָה לָּךְ
  choice: oferecerei sacrifício a ti
  rationale: O verbo זבח se refere à oferta sacrificial; a formulação explicita naturalmente em português o sentido do verbo e mantém Deus como destinatário.
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: o que prometi, cumprirei
  rationale: נדר designa fazer um voto ou promessa solene, e o piel de שלם, nesse contexto, significa pagar ou cumprir o voto. “Cumprirei” soa natural e conserva a obrigação assumida.
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: A salvação pertence a Yahweh
  rationale: יְשׁוּעָה abrange livramento concreto e salvação em sentido mais amplo. A construção com ל pode indicar pertença ou origem; a tradução principal mantém a formulação enfática de que a salvação é prerrogativa de Yahweh, enquanto a nota registra alternativas legítimas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de יְשׁוּעָה e da construção com לַיהוָה
  choice: A salvação pertence a Yahweh
  alternative: O livramento vem de Yahweh; A salvação vem de Yahweh
  rationale: A frase pode salientar tanto que a salvação é prerrogativa de Yahweh quanto que procede dele. A tradução principal conserva o sentido mais amplo de יְשׁוּעָה, e a nota preserva a ambiguidade relevante ao resgate imediato de Jonas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com voz de gratidão” conserva a imagem hebraica sem recorrer a uma expressão excessivamente arcaica; “o que prometi, cumprirei” comunica de modo natural a linguagem bíblica dos votos.
