id: JON.2.3
reference: Jonah 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: pt
  text: 'E ele disse: “Na minha angústia, clamei a Yahweh, e ele me respondeu. Do ventre[a] do Sheol[b], gritei por socorro; tu ouviste a minha voz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seio do Sheol”; a palavra hebraica pode significar “ventre” ou “seio materno”.
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o domínio dos mortos; numa tradução mais interpretativa, “a sepultura”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a introdução narrativa do hebraico sem tornar mais específica a relação temporal.
- source_word: קָרָאתִי מִצָּרָה לִי
  choice: Na minha angústia, clamei
  rationale: Expressa de modo natural em português o chamado feito a partir de uma situação de aflição, mantendo o tom de oração.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino e preserva a direção do clamor indicada por אֶל.
- source_word: וַיַּעֲנֵנִי
  choice: e ele me respondeu
  rationale: Reflete o verbo de resposta e o sufixo de primeira pessoa.
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: Do ventre do Sheol
  rationale: Mantém a imagem corporal e poética de בֶּטֶן e translitera שְׁאוֹל para não o reduzir a 'sepultura' nem identificá-lo com concepções posteriores de 'inferno'.
- source_word: שִׁוַּעְתִּי
  choice: gritei por socorro
  rationale: O verbo denota especificamente um clamor por ajuda; a formulação também o distingue de קָרָאתִי no primeiro verso poético.
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: tu ouviste a minha voz
  rationale: Preserva tanto a mudança para a segunda pessoa quanto a referência explícita à voz.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos; inferno
  rationale: A transliteração conserva a amplitude e a tensão conceitual do termo hebraico sem importar uma identificação teológica posterior ou reduzi-lo à sepultura física.
- issue: Imagem de בֶּטֶן
  choice: ventre
  alternative: seio; profundezas
  rationale: “Ventre” preserva a metáfora concreta e sua possível ressonância com a situação de Jonas, sem explicá-la além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada em “Na minha angústia” para fluência natural. A alternância entre “ele” e “tu” foi mantida porque reproduz a mudança poética do relato para a interpelação direta a Deus. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
