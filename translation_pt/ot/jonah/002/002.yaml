base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/002.yaml
  text: Then Jonah prayed to Yahweh his God from the belly of the fish[a].
translation:
  language: pt
  text: Então Jonas orou a Yahweh, seu Deus, do ventre do peixe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “das partes internas do peixe”; “ventre” é uma tradução natural neste contexto.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Então ... orou
  rationale: O wayyiqtol dá continuidade à narrativa. “Então” expressa naturalmente a sequência, e o hitpael de פלל significa aqui “orar”.
- source_word: יוֹנָה
  choice: Jonas
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל
  choice: a
  rationale: 'Preposição direcional natural em português com o verbo “orar”: “orar a alguém”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: O substantivo com sufixo masculino singular de terceira pessoa indica posse e preserva a relação expressa no hebraico.
- source_word: מִמְּעֵי
  choice: do ventre
  rationale: מֵעֶה pode designar as partes internas, o ventre ou o útero. No contexto de Jonas engolido pelo peixe, “ventre” é uma tradução clara, natural e digna.
- source_word: הַדָּגָה
  choice: do peixe
  rationale: O hebraico diz simplesmente “o peixe”, com artigo definido; não se deve importar “grande” do contexto anterior. O gênero gramatical feminino não precisa ser reproduzido em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O versículo emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto em vez de substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português. Os dois-pontos refletem que o versículo seguinte apresenta o conteúdo da oração.
