  text: אֲפָפ֤וּ/נִי מַ֨יִם֙ עַד נֶ֔פֶשׁ תְּה֖וֹם יְסֹבְבֵ֑/נִי ס֖וּף חָב֥וּשׁ לְ/רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: pt
  text: As águas me cercaram até a minha própria vida[a]; as profundezas me rodearam; algas estavam enroladas em minha cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “até a vida” ou “até o ser”; isto é, até ameaçarem a minha própria vida. Também se pode traduzir “até a alma”.
    reason: lexical_alternative
  - marker: b
    text: “Algas” também pode ser traduzido por “juncos” ou “caniços”; o contexto de Jonas submerso no mar favorece “algas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: me cercaram
  rationale: Expressa o movimento ameaçador de envolver ou fechar-se ao redor, em português natural e poético.
- source_word: מַיִם
  choice: as águas
  rationale: Conserva o plural poético hebraico e a imagem das águas ameaçadoras.
- source_word: עַד נֶפֶשׁ
  choice: ameaçando minha própria vida
  rationale: נֶפֶשׁ designa aqui a vida ou o próprio ser, não necessariamente uma alma imaterial; a formulação comunica que as águas punham a vida em risco sem introduzir a interpretação específica de 'até o pescoço'.
- source_word: תְּהוֹם
  choice: o abismo
  rationale: Representa as águas profundas e insondáveis; 'abismo' é corrente no registro bíblico português, embora não implique aqui o sentido teológico posterior.
- source_word: יְסֹבְבֵנִי
  choice: me rodeou
  rationale: Traduz diretamente a ideia de circundar e mantém uma variação natural em relação a 'me cercaram'.
- source_word: סוּף
  choice: algas
  rationale: Embora o termo também possa indicar juncos ou caniços, o cenário de submersão no mar favorece algas.
- source_word: חָבוּשׁ
  choice: se enrolaram em torno
  rationale: Comunica de modo vívido e idiomático o estado de algo preso ou envolto ao redor da cabeça.
- source_word: לְרֹאשִׁי
  choice: da minha cabeça
  rationale: Tradução possessiva direta da imagem concreta.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: minha própria vida
  alternative: minha alma
  rationale: No contexto, o termo aponta para a vida ou o próprio ser ameaçado pelas águas, sem exigir uma distinção antropológica entre corpo e alma.
- issue: Sentido de תְּהוֹם
  choice: o abismo
  alternative: as profundezas
  rationale: A escolha preserva a imagem bíblica das águas profundas, sem atribuir ao termo uma referência necessária ao lugar de punição ou a seres espirituais.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. A formulação evita o idiomatismo interpretativo 'até o pescoço' e conserva a tensão lexical de נֶפֶשׁ em nota. O marcador [b] foi colocado após a oração sobre as algas, à qual a nota se refere.
