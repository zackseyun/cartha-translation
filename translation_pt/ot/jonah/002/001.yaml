base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: pt
  text: E Yahweh designou um grande peixe[a] para engolir Jonas, e Jonas esteve no ventre do peixe[b] durante três dias e três noites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparou” ou “providenciou um grande peixe”. O hebraico diz “peixe”, não especificamente “baleia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nas partes internas do peixe”; também se pode traduzir “nas entranhas do peixe”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “três dias e três noites” foi mantida como está no hebraico, sem decidir questões de contagem inclusiva.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְמַן
  choice: designou
  rationale: O verbo expressa uma ação deliberada e soberana de Yahweh. “Designou” preserva a ideia de que Deus incumbiu ou destinou o peixe para essa finalidade; “preparou” e “providenciou” também são possíveis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דָּג גָּדוֹל
  choice: um grande peixe
  rationale: Traduz diretamente o substantivo e o adjetivo hebraicos, sem especificar que fosse uma baleia.
- source_word: לִבְלֹעַ
  choice: para engolir
  rationale: Representa de modo direto e natural a finalidade indicada pelo infinitivo hebraico.
- source_word: בִּמְעֵי הַדָּג
  choice: nas entranhas do peixe
  rationale: מֵעֶה designa as partes internas ou entranhas. A escolha mantém a imagem concreta do hebraico e é compreensível em português; “no ventre” seria uma formulação mais idiomática.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: três dias e três noites
  rationale: Mantém integralmente a expressão temporal hebraica, sem interpretá-la ou harmonizá-la.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Identidade da criatura marinha
  choice: grande peixe
  alternative: baleia
  rationale: O hebraico diz apenas “peixe”; especificar “baleia” importaria uma identificação que o texto não faz.
- issue: Sentido da expressão temporal
  choice: três dias e três noites
  alternative: parte de três dias
  rationale: A formulação do hebraico é preservada sem resolver no corpo da tradução questões posteriores sobre contagem inclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita um período excessivamente encadeado. “Entranhas” conserva mais de perto a imagem anatômica do hebraico, enquanto a nota registra a alternativa idiomática “ventre”.
