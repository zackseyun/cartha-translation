source:
  edition: WLC
  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: pt
  text: Os que se apegam a ídolos inúteis abandonam seu próprio amor leal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abandonam sua própria misericórdia”; possivelmente, renunciam à misericórdia que Deus lhes oferece.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: se apegam
  rationale: Embora שמר normalmente signifique guardar, observar ou vigiar, neste contexto expressa dedicação persistente a falsos deuses. “Apegam-se” comunica essa lealdade prática em português natural.
- source_word: הַבְלֵי שָׁוְא
  choice: ídolos inúteis
  rationale: הבל evoca vapor, vazio ou vaidade, e שוא acrescenta falsidade ou inutilidade. No uso profético, a expressão aponta para ídolos vazios e enganosos; “ídolos inúteis” explicita o referente sem introduzir uma ideia estranha ao idioma hebraico.
- source_word: חַסְדָּם
  choice: a misericórdia que lhes pertence
  rationale: חסד pode designar misericórdia, amor leal ou fidelidade relacional. O sufixo de terceira pessoa masculina plural é preservado por “lhes pertence”, enquanto a formulação evita decidir se se trata da misericórdia disponível da parte de Deus ou da lealdade que deveria caracterizá-los.
- source_word: יַעֲזֹבוּ
  choice: abandonam
  rationale: עזב significa deixar ou abandonar. “Abandonam” mantém o tom solene e é claro no português atual.
theological_decisions:
- issue: Sentido de חַסְדָּם na relação entre os idólatras e Deus
  choice: A formulação “a misericórdia que lhes pertence” preserva o possessivo e deixa em aberto a direção relacional do חסד.
  alternative: “Seu próprio amor leal” ou “a misericórdia que Deus lhes oferece”.
  rationale: O hebraico permite entender חסד como misericórdia ou amor leal, seja recebido de Deus, seja devido no vínculo relacional. A tradução principal conserva a concisão e a ambiguidade, e a nota apresenta as principais possibilidades sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A ordem foi ajustada à sintaxe natural do português, preservando o paralelismo conceitual e a ambiguidade do hebraico.
