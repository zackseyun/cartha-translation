review_pass:
  verdict: revise
  source_fidelity: A tradução de מְשַׁמְּרִים por “se apegam”, de הַבְלֵי שָׁוְא por “ídolos inúteis” e de יַעֲזֹבוּ por “abandonam” é fiel ao sentido do hebraico. Para חַסְדָּם, “a misericórdia que lhes pertence” explicita de modo pouco natural uma relação que o hebraico deixa concisa e ambígua. “Seu próprio amor leal” preserva melhor o possessivo, o campo semântico de חסד e a abertura interpretativa.
  naturalness: “Os que se apegam a ídolos inúteis” é claro e natural. “A misericórdia que lhes pertence” é uma construção mais pesada e abstrata do que o necessário; “seu próprio amor leal” é mais direto e mantém registro bíblico moderno.
  terminology: “Amor leal” é uma opção portuguesa estabelecida para חסד e evita reduzir o termo exclusivamente a “misericórdia”. A nota deve apresentar “misericórdia” como alternativa possível, incluindo a leitura de misericórdia recebida de Deus, sem fixá-la no texto principal.
  issues:
  - severity: medium
    issue: A expressão “a misericórdia que lhes pertence” reformula excessivamente חַסְדָּם.
    rationale: Embora retenha o possessivo de alguma forma, ela transforma a construção breve “seu חסד” numa explicação de pertença e tende a orientar o leitor para uma misericórdia recebida. O hebraico permite também, e de modo importante, a noção de amor leal/fidelidade deles.
