  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: pt
  text: 'E eu disse: “Fui expulso de diante dos teus olhos;[a] contudo, voltarei a olhar para o teu santo templo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da tua vista” ou “da tua presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: E eu disse
  rationale: Preserva a ligação simples e a ênfase no pronome. Embora אָמַרְתִּי possa, em poesia de oração, referir-se à fala interior, “disse” mantém o sentido normal do verbo sem interpretar além do necessário.
- source_word: נִגְרַשְׁתִּי
  choice: Fui expulso
  rationale: O nifal de גרש expressa ser afastado ou expulso. A formulação conserva a voz passiva e a força da ação sem acrescentar uma nuance jurídica ou específica de exílio.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: de diante dos teus olhos
  rationale: Mantém a imagem concreta do hebraico. A expressão pode também comunicar afastamento da vista ou da presença divina, possibilidades registradas na nota.
- source_word: אַךְ
  choice: contudo
  rationale: Marca com clareza a forte virada adversativa do sentimento de rejeição para a esperança.
- source_word: אוֹסִיף לְהַבִּיט
  choice: voltarei a olhar
  rationale: O hifil de יסף seguido de infinitivo pode indicar repetição ou continuação. Neste contexto, “voltarei a” comunica naturalmente a esperança de olhar outra vez, sem excluir por completo a nuance de continuidade.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  choice: para o teu santo templo
  rationale: הֵיכָל, em referência a Deus, é adequadamente traduzido por “templo”; a construção “templo da tua santidade” é expressa de modo idiomático como “teu santo templo”.
theological_decisions:
- issue: Se a exclusão deve ser expressa espacialmente, como afastamento da vista, ou interpretada teologicamente como afastamento da presença divina
  choice: de diante dos teus olhos
  alternative: da tua vista; da tua presença
  rationale: A tradução principal preserva a imagem concreta e a ambiguidade do hebraico. A nota apresenta equivalentes possíveis sem transformar a imagem em uma afirmação doutrinária mais definida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa coerentes (“teus”, “tua”). A redação mantém o paralelismo poético e a tensão entre expulsão e esperança.
