  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: pt
  text: Quando minha vida desfalecia dentro de mim[a], lembrei-me de Yahweh, e minha oração chegou a ti, ao teu santo templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando minha alma desfalecia dentro de mim”. O hebraico néfesh pode significar “vida”, “alma” ou “ser”, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao teu santo palácio/santuário”. O termo hebraico pode designar um palácio real ou um templo; neste contexto de oração, “templo” é a tradução mais adequada. A expressão também retrata a oração dirigindo-se para o interior do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: Quando... desfalecia
  rationale: A preposição בְּ introduz uma oração temporal, e o hitpael de עטף descreve o enfraquecimento progressivo em situação de extrema aflição. “Quando... desfalecia” é natural em português e preserva esse aspecto.
- source_word: עָלַי נַפְשִׁי
  choice: minha vida... dentro de mim
  rationale: Embora עָלַי signifique literalmente “sobre mim”, a combinação idiomática descreve o ser interior perdendo as forças. No contexto de perigo mortal, נֶפֶשׁ é bem expresso por “vida”, sem impor uma antropologia técnica.
- source_word: אֶת־יְהוָה
  choice: Yahweh
  rationale: O texto traz diretamente o nome divino YHWH; a transliteração “Yahweh” preserva seu caráter de nome próprio.
- source_word: זָכָרְתִּי
  choice: lembrei-me
  rationale: O qal perfeito significa diretamente “lembrei-me” ou “recordei-me”, sem exigir que se acrescente a ideia de invocação.
- source_word: וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי
  choice: minha oração chegou a ti
  rationale: A formulação reproduz de modo natural o movimento expresso por בוא e a direção marcada por אֶל.
- source_word: אֶל־הֵיכַל קָדְשֶׁךָ
  choice: ao teu santo templo
  rationale: הֵיכָל pode designar palácio ou templo. Neste contexto de oração dirigida ao Deus de Israel, “templo” é a opção contextual mais clara; “ao” mantém a direção da oração sem decidir se a referência é ao templo terreno ou à morada celestial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente no hebraico, em vez de substituí-lo por um título.
- issue: Nuance antropológica de נַפְשִׁי
  choice: minha vida
  alternative: minha alma; meu ser
  rationale: O contexto retrata Jonas próximo da morte. “Minha vida” comunica esse sentido concreto, enquanto a nota conserva a alternativa “minha alma” e a amplitude semântica do hebraico.
- issue: Referência de הֵיכַל קָדְשֶׁךָ
  choice: teu santo templo
  alternative: teu santo palácio; teu santo santuário
  rationale: “Templo” se ajusta ao contexto, mas não determina se se trata especificamente do templo terreno ou da morada celestial de Deus, preservando a possível amplitude da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético e o movimento da oração, evitando arcaísmos desnecessários e sem resolver se o templo é terreno ou celestial.
