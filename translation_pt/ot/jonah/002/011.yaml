  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: pt
  text: Então Yahweh falou ao peixe[a], e ele vomitou Jonas em terra seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disse ao peixe”.'
    reason: Alternativa lexical que reproduz mais literalmente אמר, sem alterar o sentido contextual.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: falou
  rationale: O verbo אמר significa literalmente “disse”. Com o complemento introduzido por ל, “falou ao peixe” é natural em português e evita explicitar “ordenou”, ideia sugerida pelo contexto, mas não pelo verbo em si.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: לַדָּג
  choice: ao peixe
  rationale: דג significa simplesmente “peixe” neste versículo; “grande” não aparece aqui e não deve ser importado do contexto anterior.
- source_word: וַיָּקֵא
  choice: vomitou
  rationale: קיא designa diretamente o ato de vomitar. A escolha mantém a força concreta do hebraico, sem suavizá-la como “cuspiu”.
- source_word: אֶת יוֹנָה
  choice: Jonas
  rationale: אֶת marca Jonas como objeto direto definido; em português, isso é expresso pela sintaxe normal, sem tradução separada da partícula.
- source_word: אֶל הַיַּבָּשָׁה
  choice: em terra seca
  rationale: יַבָּשָׁה indica terra ou chão seco, em contraste com o mar. Após “vomitou”, a preposição portuguesa “em” expressa naturalmente o destino do movimento.
- source_word: וַ
  choice: Então
  rationale: O waw inicial faz a narrativa avançar; “Então” comunica de modo claro e atual essa sequência.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: “Yahweh” preserva o Tetragrama como nome pessoal e segue a convenção do projeto, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Falou ao peixe” mantém a formulação direta do hebraico; “vomitou” preserva sua imagem forte e concreta.
