source:
  edition: WLC
  text: וַ/תַּשְׁלִיכֵ֤/נִי מְצוּלָה֙ בִּ/לְבַ֣ב יַמִּ֔ים וְ/נָהָ֖ר יְסֹבְבֵ֑/נִי כָּל מִשְׁבָּרֶ֥י/ךָ וְ/גַלֶּ֖י/ךָ עָלַ֥/י עָבָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: pt
  text: Tu me lançaste nas profundezas, no coração dos mares, e a corrente[a] me cercou; todas as tuas arrebentações e as tuas vagas passaram sobre mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e o rio me cercou”, tomando נָהָר em seu sentido mais comum, “rio”; neste contexto poético marítimo, provavelmente se refere à corrente ou ao fluxo das águas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: Tu me lançaste
  rationale: O verbo שלך expressa lançar ou atirar. “Lançaste” mantém o tom poético e a segunda pessoa do singular, pela qual Jonas se dirige diretamente a Deus.
- source_word: מְצוּלָה
  choice: nas profundezas
  rationale: Designa a região profunda das águas. O plural idiomático em português comunica com naturalidade a ideia do abismo marinho.
- source_word: בִּלְבַב יַמִּים
  choice: no coração dos mares
  rationale: Preserva a metáfora vívida de לְבַב, “coração”, e o plural יַמִּים, “mares”, sem reduzi-los simplesmente a “meio do mar”.
- source_word: וְנָהָר
  choice: e a corrente
  rationale: Embora נָהָר normalmente signifique “rio”, no contexto marítimo pode indicar uma corrente ou fluxo de água. “Corrente” se harmoniza naturalmente com as ondas e vagas do verso; a alternativa mais comum é registrada em nota.
- source_word: יְסֹבְבֵנִי
  choice: me cercou
  rationale: Traduz de modo claro e direto o sentido de סבב, “cercar, rodear”.
- source_word: מִשְׁבָּרֶיךָ
  choice: tuas ondas impetuosas
  rationale: O termo descreve ondas que rebentam com força. “Ondas impetuosas” comunica sua violência em português corrente, sem recorrer a uma expressão técnica pouco natural.
- source_word: וְגַלֶּיךָ
  choice: e as tuas vagas
  rationale: גַּלִּים são ondas ou vagas. “Vagas” evita repetição e mantém o registro poético, enquanto o possessivo conserva a atribuição das águas a Deus.
- source_word: עָלַי עָבָרוּ
  choice: passaram sobre mim
  rationale: Segue de perto a construção hebraica e retrata as águas cobrindo e vencendo Jonas, sem acrescentar um verbo mais interpretativo como “arrastaram”.
theological_decisions:
- issue: A ação divina na descida de Jonas ao mar
  choice: 'Manter a interpelação direta a Deus: “Tu me lançaste... tuas ondas... tuas vagas”'
  alternative: Atenuar a ação divina, tomando os marinheiros como sujeito implícito do lançamento
  rationale: O hebraico emprega explicitamente a segunda pessoa masculina singular e sufixos possessivos dirigidos a Deus. A tradução conserva a tensão entre a atuação humana narrada e a soberania divina reconhecida por Jonas.
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. O tratamento por “tu” conserva a interpelação singular do hebraico e combina com o tom de oração. A metáfora “coração dos mares” e o plural “mares” foram preservados.
