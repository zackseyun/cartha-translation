  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הַ/הֵיטֵ֖ב חָ֥רָה לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/004.yaml
  text: And Yahweh said[a], “Is it right for you to be angry?”
translation:
  language: pt
  text: 'E Yahweh disse[a]: “É certo você ficar com raiva?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Você faz bem em ficar com raiva?”'
    reason: Registra uma formulação mais próxima da construção hebraica, sem alterar a força avaliativa da pergunta.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... perguntou
  rationale: O waw consecutivo faz a narrativa avançar. Como a fala direta é uma pergunta, “perguntou” é mais natural em português do que o formal “disse”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: הֲהֵיטֵב
  choice: É certo
  rationale: A construção interrogativa com o infinitivo absoluto hifil de יטב avalia se a atitude é correta ou apropriada; “É certo” expressa essa força de modo claro e atual.
- source_word: חָרָה
  choice: ficar com raiva
  rationale: Embora o verbo tenha a imagem de arder ou inflamar-se, aqui designa idiomaticamente a ira.
- source_word: לָךְ
  choice: você
  rationale: A preposição com o sufixo de segunda pessoa indica a pessoa cuja ira está sendo avaliada. Em português natural, essa relação é bem expressa pela construção “É certo você...”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Mantém o nome pessoal mediante transliteração e evita substituí-lo por um título.
- issue: Força de הֲהֵיטֵב חָרָה לָךְ
  choice: Pergunta sobre a correção ou propriedade da ira de Jonas
  alternative: “Você faz bem em ficar com raiva?”
  rationale: O hebraico não pergunta apenas se Jonas está irado, mas se sua ira é correta ou justificável. A tradução conserva a força avaliativa sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficar com raiva” é corrente sem ser vulgar; a nota preserva uma forma mais próxima da estrutura hebraica.
