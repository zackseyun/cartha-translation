  text: וַ/יֵּ֥רַע אֶל יוֹנָ֖ה רָעָ֣ה גְדוֹלָ֑ה וַ/יִּ֖חַר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
translation:
  language: pt
  text: Mas isso desagradou profundamente a Jonas[a], e ele ficou irado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “isso foi mau para Jonas, um grande mal”. O hebraico repete termos da família de “mau/mal” para enfatizar a reação de Jonas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה
  choice: isso desagradou profundamente a Jonas
  rationale: A construção combina o verbo רעע com o substantivo cognato רָעָה e o adjetivo גְדוֹלָה para forte intensificação. A formulação portuguesa comunica de modo natural a profunda desaprovação subjetiva de Jonas, sem apresentar a ação de Deus como objetivamente má; a nota preserva o jogo lexical hebraico.
- source_word: יוֹנָה
  choice: Jonas
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּחַר לוֹ
  choice: ele ficou irado
  rationale: O idioma hebraico, literalmente ligado a 'arder', expressa o surgimento ou a intensidade da ira. 'Ficou irado' é claro, digno e mantém a força do contexto.
- source_word: וַ
  choice: Mas ... e
  rationale: O primeiro waw é traduzido adversativamente para marcar o forte contraste com o arrependimento de Nínive e a misericórdia de Deus no contexto anterior; o segundo dá continuidade à reação de Jonas.
theological_decisions:
- issue: Se רָעָה descreve objetivamente a ação de Deus como má ou subjetivamente a reação de Jonas
  choice: 'Reação subjetiva: “isso desagradou profundamente a Jonas”'
  alternative: “isso foi um grande mal para Jonas”
  rationale: O contexto descreve a avaliação e a reação de Jonas, sem endossá-las como juízo moral do narrador. A tradução evita chamar a misericórdia divina de mal, enquanto a nota conserva a tensão e o jogo de palavras do original.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Desagradou profundamente” reproduz a intensificação hebraica sem uma construção artificial; “irado” mantém a força do original e um registro bíblico acessível.
