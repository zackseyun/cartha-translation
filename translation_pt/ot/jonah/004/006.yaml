source:
  edition: WLC
  text: וַ/יְמַ֣ן יְהוָֽה אֱ֠לֹהִים קִיקָי֞וֹן וַ/יַּ֣עַל מֵ/עַ֣ל לְ/יוֹנָ֗ה לִֽ/הְי֥וֹת צֵל֙ עַל רֹאשׁ֔/וֹ לְ/הַצִּ֥יל ל֖/וֹ מֵ/רָֽעָת֑/וֹ וַ/יִּשְׂמַ֥ח יוֹנָ֛ה עַל הַ/קִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: pt
  text: Então Yahweh Deus designou uma planta chamada qiqayon[a], que cresceu por cima de Jonas para fazer sombra sobre a cabeça dele e livrá-lo do seu mal-estar. E Jonas se alegrou com grande alegria por causa do qiqayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico qiqayon, planta de identificação incerta; tradicionalmente chamada de “aboboreira” ou “vinha” e, às vezes, identificada como mamona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: designou
  rationale: O verbo מנה, recorrente em Jonas para o peixe, a planta, o verme e o vento, expressa a ação deliberada e soberana de destinar ou designar algo.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva o nome divino pessoal expresso pelo Tetragrama e traduz naturalmente o título אֱלֹהִים.
- source_word: קִיקָיוֹן
  choice: planta chamada qiqayon
  rationale: A identificação botânica é incerta; a transliteração mantém a particularidade do termo hebraico, e a palavra 'planta' torna a expressão clara em português.
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: cresceu por cima de Jonas
  rationale: No contexto vegetal, עלה descreve o crescimento ou a subida da planta; 'por cima de Jonas' explicita sua posição sem acrescentar uma identificação botânica.
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: para fazer sombra sobre a cabeça dele
  rationale: Expressa em português natural a finalidade da planta, preservando tanto a ideia de sombra quanto sua localização sobre a cabeça de Jonas.
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: e livrá-lo do seu mal-estar
  rationale: הציל mantém a força de livrar ou resgatar. רָעָה é semanticamente ampla; neste contexto, 'mal-estar' aponta para a aflição física e circunstancial sem transformar o termo em mal moral.
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: se alegrou com grande alegria
  rationale: Reproduz a construção enfática com verbo e substantivo cognatos, ainda compreensível e digna em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome divino pessoal; 'Yahweh' preserva essa distinção em vez de substituí-lo por um título.
- issue: Sentido de רָעָתוֹ neste contexto
  choice: seu mal-estar
  alternative: seu mal / sua desgraça
  rationale: A palavra pode designar mal, calamidade, aflição ou desconforto. A sombra da planta indica alívio da condição penosa de Jonas, mas 'seu' preserva a referência pessoal sem resolver além do necessário toda a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva a repetição enfática do hebraico e translitera o nome incerto da planta.
