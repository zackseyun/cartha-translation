source:
  edition: WLC
  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: pt
  text: E eu não deveria ter compaixão de Nínive[a], a grande cidade, onde há mais de cento e vinte mil pessoas que não sabem distinguir a mão direita da esquerda[b], além de muitos animais?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não deveria poupar Nínive».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «não sabem distinguir a mão direita da esquerda» pode referir-se especificamente a crianças pequenas ou, de modo mais geral, a pessoas sem discernimento.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: ter compaixão
  rationale: O verbo חוּס pode significar poupar, ter pena ou ter compaixão. No contraste entre a preocupação de Jonas com a planta e a preocupação de Deus com Nínive, «ter compaixão» expressa naturalmente tanto o cuidado misericordioso quanto a ideia implícita de não destruir.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: a grande cidade
  rationale: Preserva o adjetivo hebraico e a descrição recorrente de Nínive no livro, sem reduzir o sentido apenas à extensão física.
- source_word: יֶשׁ בָּהּ
  choice: onde há
  rationale: Reproduz de modo natural em português a construção existencial hebraica e mantém o foco na população existente dentro da cidade.
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: mais de cento e vinte mil
  rationale: O hebraico diz literalmente «mais de doze miríades». A formulação escolhida é o equivalente numérico claro e idiomático em português.
- source_word: אָדָם
  choice: pessoas
  rationale: Neste contexto, אָדָם designa a população humana contada em Nínive. «Pessoas» é inclusivo, atual e natural.
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: que não sabem distinguir a mão direita da esquerda
  rationale: Mantém a imagem hebraica em português inteligível, sem decidir se ela indica crianças pequenas ou, de modo mais amplo, habitantes sem discernimento.
- source_word: וּבְהֵמָה רַבָּה
  choice: além de muitos animais
  rationale: בְּהֵמָה pode indicar animais, especialmente animais domésticos. «Animais» evita restringir indevidamente o referente a gado; «além de» liga naturalmente este último elemento à população já mencionada.
theological_decisions:
- issue: Referente dos que não sabem distinguir a mão direita da esquerda
  choice: Manter a expressão sem identificar mais precisamente o grupo.
  alternative: Entender a frase especificamente como referência a crianças pequenas; ou, de modo geral, a habitantes sem discernimento moral.
  rationale: A expressão hebraica admite essas leituras. A tradução conserva a ambiguidade e a nota informa as principais possibilidades sem resolver a tensão.
- issue: Atitude divina expressa por אָחוּס
  choice: ter compaixão
  alternative: poupar
  rationale: O contexto enfatiza o cuidado de Deus em contraste com o apego de Jonas à planta. «Ter compaixão» comunica a dimensão afetiva e misericordiosa, enquanto «poupar» permanece uma alternativa lexical legítima indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem retórica da pergunta divina e a descrição recorrente «a grande cidade» foram preservadas. As notas mantêm as alternativas lexicais e interpretativas genuínas.
