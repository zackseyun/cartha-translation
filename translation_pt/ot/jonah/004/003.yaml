id: JON.4.3
reference: Jonah 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: pt
  text: E agora, Yahweh, por favor, tira de mim a minha vida, pois a minha morte é melhor do que a minha vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: «pois é melhor para mim morrer do que viver».'
    reason: Alternativa idiomática para o paralelismo nominal hebraico «minha morte / minha vida».
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com a fala anterior quanto a urgência temporal do pedido de Jonas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קַח נָא
  choice: por favor, tira
  rationale: O imperativo קַח pede que Deus tome a vida de Jonas, e נָא confere ao pedido um tom de súplica. Em português, «por favor, tira» comunica ambos com naturalidade.
- source_word: אֶת נַפְשִׁי מִמֶּנִּי
  choice: tira de mim a minha vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida de Jonas, não uma alma imaterial; מִמֶּנִּי expressa separação, «de mim».
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada por Jonas para seu pedido.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: a minha morte é melhor do que a minha vida
  rationale: A construção com מִן é comparativa. Os substantivos com sufixo de primeira pessoa formam o paralelo «minha morte / minha vida», que é claro e natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração conserva o caráter de nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «tira de mim a minha vida» evita uma colocação pronominal excessivamente literária e mantém explícita a ideia hebraica de separação.
