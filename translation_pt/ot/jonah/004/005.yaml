base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: pt
  text: Então Jonas saiu da cidade e sentou-se a leste dela. Ali fez para si um abrigo[a] e sentou-se à sombra, debaixo dele, até ver o que aconteceria na cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cabana”. O termo hebraico se refere a um abrigo temporário, muitas vezes feito de ramos.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que seria da cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Traduz diretamente a ideia de partir ou sair, com fluidez narrativa em português.
- source_word: מִן הָעִיר
  choice: da cidade
  rationale: Expressa de modo conciso e idiomático a separação indicada pela preposição מן.
- source_word: וַיֵּשֶׁב
  choice: sentou-se
  rationale: Preserva o sentido físico imediato do verbo ישב e a sequência narrativa.
- source_word: מִקֶּדֶם לָעִיר
  choice: a leste dela
  rationale: A expressão espacial indica uma posição no lado oriental da cidade; o pronome evita repetição sem perder clareza.
- source_word: וַיַּעַשׂ לוֹ
  choice: fez para si
  rationale: Mantém explicitamente o dativo de benefício expresso por לוֹ.
- source_word: סֻכָּה
  choice: um abrigo
  rationale: Comunica em linguagem atual a função da estrutura temporária; a natureza específica do abrigo é esclarecida em nota.
- source_word: תַּחְתֶּיהָ
  choice: debaixo dele
  rationale: Retoma naturalmente em português o substantivo masculino 'abrigo' e preserva a relação espacial.
- source_word: בַּצֵּל
  choice: à sombra
  rationale: No contexto de proteção contra o sol, 'sombra' é a opção portuguesa mais natural.
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: até ver
  rationale: O infinitivo após 'até' expressa de modo natural em português a espera de Jonas com vistas a observar o desfecho.
- source_word: מַה יִּהְיֶה בָּעִיר
  choice: o que aconteceria na cidade
  rationale: Reproduz claramente o sentido prospectivo da pergunta sobre o resultado dos acontecimentos, sem definir além do hebraico se o foco é nos eventos ou no destino da cidade.
