  text: וַ/יְהִ֣י כִּ/זְרֹ֣חַ הַ/שֶּׁ֗מֶשׁ וַ/יְמַ֨ן אֱלֹהִ֜ים ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית וַ/תַּ֥ךְ הַ/שֶּׁ֛מֶשׁ עַל רֹ֥אשׁ יוֹנָ֖ה וַ/יִּתְעַלָּ֑ף וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֕אמֶר ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: pt
  text: 'Quando o sol nasceu, Deus designou um vento abrasador vindo do leste[a]. O sol castigou a cabeça de Jonas, e ele começou a desfalecer. Então pediu para morrer e disse: “É melhor para mim morrer do que viver.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um vento sufocante vindo do leste” ou “um vento impetuoso vindo do leste”. O adjetivo hebraico é raro e de sentido incerto; “abrasador” foi escolhido porque o contexto destaca o calor opressivo.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Minha morte é melhor do que minha vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: Quando o sol nasceu
  rationale: A fórmula narrativa seguida da construção temporal indica a ocasião em que a ação seguinte ocorreu. A tradução é natural em português e preserva a sequência temporal.
- source_word: וַיְמַן
  choice: designou
  rationale: O verbo aparece repetidamente em Jonas para a ação deliberada de Deus ao comissionar elementos da criação. “Designou” mantém essa intencionalidade e a ligação verbal com os demais episódios.
- source_word: רוּחַ קָדִים
  choice: vento ... vindo do leste
  rationale: A expressão denota um vento procedente do leste. Esta formulação é clara para leitores de diferentes regiões lusófonas.
- source_word: חֲרִישִׁית
  choice: abrasador
  rationale: O adjetivo é raro e de sentido incerto. No contexto da insolação e do desfalecimento de Jonas, “abrasador” expressa de modo plausível o calor opressivo, sem ocultar outras possibilidades na nota.
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: O sol castigou a cabeça de Jonas
  rationale: O verbo contém a imagem de golpear. “Castigou” conserva a força da imagem e funciona naturalmente para a exposição intensa ao sol.
- source_word: וַיִּתְעַלָּף
  choice: começou a desfalecer
  rationale: A forma verbal pode indicar que Jonas foi ficando fraco ou desfalecido. A tradução evita afirmar necessariamente que perdeu por completo a consciência.
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: pediu para morrer
  rationale: A expressão idiomática hebraica apresenta um pedido de morte. A formulação portuguesa transmite o sentido sem reproduzir de modo artificial a referência literal à vida ou alma.
- source_word: טוֹב מוֹתִי מֵחַיַּי
  choice: É melhor para mim morrer do que viver
  rationale: A tradução comunica naturalmente em português a comparação concisa entre a morte e a vida de Jonas; a forma mais literal é preservada em nota.
theological_decisions:
- issue: Agência divina em וַיְמַן אֱלֹהִים
  choice: Deus designou
  alternative: Deus preparou / Deus providenciou / Deus enviou
  rationale: O texto retrata Deus dirigindo intencionalmente um elemento natural. “Designou” preserva essa agência e o padrão narrativo do livro sem acrescentar uma afirmação doutrinária além do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe narrativa é fluida, enquanto as notas preservam a incerteza lexical de חֲרִישִׁית e a forma tersa da declaração final.
