  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: pt
  text: 'E ele orou a Yahweh e disse: “Ah, Yahweh! Não era isso que eu dizia quando ainda estava na minha terra? Foi por isso que me antecipei, fugindo para Társis[a], pois eu sabia que tu és Deus bondoso e compassivo[b], paciente e rico em amor leal, e que voltas atrás quanto ao desastre[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apressei-me a fugir para Társis” ou “antecipei-me a fugir para Társis”. O verbo hebraico comunica a ideia de agir de antemão ou antecipar-se.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “misericordioso”. A descrição ecoa Êxodo 34:6.'
    reason: cross_reference
  - marker: c
    text: 'Ou: “desistes de causar a calamidade”. O hebraico diz “o mal/desastre”; aqui, a palavra se refere ao juízo ameaçado, não a maldade moral em Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל normalmente significa orar; embora a fala de Jonas tenha tom de queixa, ela é dirigida a Deus como oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אָנָּה
  choice: Ah
  rationale: Interjeição de apelo ou exclamação que, neste contexto de queixa, soa natural e preserva a intensidade emocional.
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: Não era isso que eu dizia
  rationale: Reproduz a pergunta retórica que espera concordância e verte idiomaticamente o hebraico literal 'não era esta a minha palavra'.
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: quando ainda estava na minha terra
  rationale: Expressa naturalmente a referência ao período anterior à partida de Jonas de sua terra natal.
- source_word: עַל כֵּן קִדַּמְתִּי לִבְרֹחַ
  choice: Foi por isso que me antecipei, fugindo
  rationale: Mantém tanto a relação causal quanto a ideia de agir de antemão presente em קדם, sem impor que o verbo signifique apenas pressa.
- source_word: חַנּוּן וְרַחוּם
  choice: bondoso e compassivo
  rationale: Comunica em português corrente a disposição de conceder favor e de demonstrar profunda compaixão, ecoando Êxodo 34:6.
- source_word: אֶרֶךְ אַפַּיִם
  choice: paciente
  rationale: Equivalente idiomático e atual da expressão hebraica literalmente associada à demora em irar-se.
- source_word: רַב חֶסֶד
  choice: rico em amor leal
  rationale: Preserva o componente de fidelidade e compromisso de חֶסֶד sem restringi-lo a uma única formulação teológica.
- source_word: וְנִחָם עַל הָרָעָה
  choice: e que desistis do desastre
  rationale: Expressa a mudança quanto à execução do juízo anunciado, enquanto רָעָה é entendido contextualmente como desastre, não maldade moral em Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força de וְנִחָם aplicado a Deus
  choice: desistis do desastre
  alternative: mudais de ideia quanto ao mal; voltais atrás quanto à calamidade
  rationale: A formulação mantém a tensão antropopática do hebraico e indica que Deus deixa de executar o desastre anunciado, sem sugerir culpa moral.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; fidelidade
  rationale: A expressão abrange amor, lealdade e compromisso; 'amor leal' preserva essa amplitude de modo conciso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa do singular foi mantida na oração por naturalidade bíblica e para refletir a interpelação direta. A sintaxe foi levemente ajustada para fluidez, preservando a pergunta retórica, o caráter antecipatório da fuga e a tensão da linguagem sobre Deus desistir do juízo anunciado.
