reference: Jonah 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: pt
  text: 'Então Yahweh disse: “Você teve compaixão da planta[a], pela qual não trabalhou e que não fez crescer, que surgiu numa noite e numa noite pereceu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: qiqayon; não se sabe ao certo de que espécie de planta se tratava. Algumas traduções tradicionais trazem “mamoneira” ou “aboboreira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva, por transliteração, o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: חַסְתָּ עַל
  choice: teve compaixão de
  rationale: חוס com עַל expressa compaixão, pena ou preocupação protetora pelo objeto; esta formulação é natural em português e mantém o paralelo com a compaixão de Yahweh no versículo seguinte.
- source_word: הַקִּיקָיוֹן
  choice: a planta
  rationale: A espécie indicada por קִיקָיוֹן é incerta; o termo genérico evita uma identificação botânica especulativa.
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: pela qual não trabalhou
  rationale: Comunica que Jonas não empregou esforço ou trabalho na planta, preservando a relação indicada por בּוֹ sem rigidez excessiva.
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: e que não fez crescer
  rationale: 'O piel de גדל tem sentido causativo: Jonas não produziu nem promoveu o crescimento da planta.'
- source_word: שֶׁבִּן לַיְלָה הָיָה
  choice: que surgiu numa noite
  rationale: Traduz de modo inteligível o idiomatismo literalmente associado a 'filho de uma noite', indicando aparecimento súbito e existência breve, sem afirmar uma espécie ou mecanismo específico.
- source_word: וּבִן לַיְלָה אָבָד
  choice: e numa noite pereceu
  rationale: Mantém a repetição enfática de בִּן לַיְלָה e traduz אָבַד com um verbo que abrange perecer, desaparecer ou ser destruído.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: Representa naturalmente em narrativa portuguesa a progressão marcada pelo waw consecutivo.
theological_decisions:
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: A transliteração preserva o nome pessoal presente no hebraico e evita substituí-lo silenciosamente por um título.
- issue: Paralelo entre a reação de Jonas e a de Yahweh
  choice: teve compaixão
  alternative: teve pena; quis poupar
  rationale: A escolha conserva a amplitude de חוס e o paralelo retórico com o versículo seguinte, sem decidir se o sentimento de Jonas era plenamente virtuoso ou apenas interesse pela planta.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com construção natural para leitores brasileiros. A repetição “numa noite ... numa noite” foi mantida por sua força retórica no hebraico.
