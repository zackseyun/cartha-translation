  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: pt
  text: Mas Deus designou um verme quando a aurora despontou no dia seguinte, e o verme feriu a planta, e ela secou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַן
  choice: designou
  rationale: Preserva a ação intencional e soberana de Deus ao determinar o verme como agente, em harmonia com o uso repetido do verbo em Jonas.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Traduz diretamente אֱלֹהִים, sem substituí-lo pelo nome divino.
- source_word: תּוֹלַעַת
  choice: um verme
  rationale: É uma designação ampla e natural, sem especificar indevidamente a espécie ou fase do animal.
- source_word: בַּעֲלוֹת הַשַּׁחַר
  choice: quando a aurora despontou
  rationale: Reproduz de modo natural a imagem hebraica da aurora subindo ou surgindo.
- source_word: לַמָּחֳרָת
  choice: no dia seguinte
  rationale: Expressa claramente a sequência temporal indicada pelo hebraico.
- source_word: וַתַּךְ
  choice: feriu
  rationale: Mantém o sentido concreto de נכה, 'golpear, ferir', sem a intensificação interpretativa de 'atacou'.
- source_word: הַקִּיקָיוֹן
  choice: a planta
  rationale: Evita uma identificação botânica incerta; o referente já foi estabelecido no contexto imediato.
- source_word: וַיִּיבָשׁ
  choice: que secou
  rationale: Traduz o resultado como evento coordenado/consecutivo, preservando a progressão narrativa sem explicitar além do texto uma relação final.
theological_decisions:
- issue: Agência divina nas circunstâncias de Jonas
  choice: Deus designou intencionalmente o verme.
  alternative: Deus apenas permitiu que um verme aparecesse.
  rationale: וַיְמַן apresenta ação divina ativa e deliberada, conforme o padrão de agentes designados por Deus no livro.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem segue de perto a progressão hebraica. Não se acrescentou nota botânica neste versículo porque הַקִּיקָיוֹן foi traduzido genericamente como “a planta”; a nota inglesa fornecida parece estar deslocada, pois seu marcador está ligado à expressão temporal, embora seu conteúdo trate da planta.
