- from: Mas Deus designou um verme quando a aurora despontou no dia seguinte, e ele feriu a planta, que secou.
  to: Mas Deus designou um verme quando a aurora despontou no dia seguinte, e o verme feriu a planta, e ela secou.
  rationale: A única alteração é a substituição do pronome ambíguo pela repetição de “o verme” e a coordenação explícita de “ela secou”. Isso torna claro que o verme feriu a planta e que a planta secou, mantendo a sequência e o sentido do hebraico. Não se acrescenta nota botânica, pois “a planta” não afirma uma identificação específica.
