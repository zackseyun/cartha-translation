  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל יוֹנָ֔ה הַ/הֵיטֵ֥ב חָרָֽה לְ/ךָ֖ עַל הַ/קִּֽיקָי֑וֹן וַ/יֹּ֕אמֶר הֵיטֵ֥ב חָֽרָה לִ֖/י עַד מָֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/009.yaml
  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: pt
  text: 'Então Deus perguntou a Jonas: “É certo você ficar irado por causa da planta[a]?” Ele respondeu: “É certo eu ficar irado, até a morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico קִיקָיוֹן (qiqayon), planta de espécie incerta; traduções tradicionais incluem “aboboreira” ou “trepadeira”, e alguns a identificam como mamoneira.
    reason: 'Alternativa lexical: a espécie botânica não pode ser identificada com segurança.'
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: É certo você ficar irado
  rationale: A construção idiomática questiona se a ira de Jonas é apropriada ou justificável. A formulação escolhida comunica essa avaliação moral em português natural e mantém, na resposta, o paralelismo verbal.
- source_word: עַל
  choice: por causa de
  rationale: A preposição indica aqui o motivo ou objeto da ira de Jonas; “por causa de” expressa claramente essa relação em português.
- source_word: הַקִּיקָיוֹן
  choice: a planta
  rationale: A espécie botânica designada por קִיקָיוֹן é incerta. O termo genérico evita uma identificação indevidamente precisa, enquanto a nota registra alternativas tradicionais.
- source_word: הֵיטֵב חָרָה לִי
  choice: É certo eu ficar irado
  rationale: A resposta retoma deliberadamente os termos da pergunta divina e afirma que a ira é justificável. A repetição preserva esse paralelismo.
- source_word: עַד מָוֶת
  choice: até a morte
  rationale: A expressão intensifica a declaração de Jonas sem decidir se ele quer dizer que está irado a ponto de morrer ou que sua ira persiste até a morte; a tradução mantém essa tensão.
- source_word: וַיֹּאמֶר
  choice: Então Deus perguntou / Ele respondeu
  rationale: O primeiro verbo faz avançar a narrativa e introduz uma pergunta; o segundo introduz a réplica de Jonas. “Perguntou” e “respondeu” tornam explícita a função discursiva já evidente nas falas, sem alterar seu conteúdo.
theological_decisions:
- issue: Avaliação moral da ira de Jonas
  choice: Traduzir o idioma como uma pergunta sobre ser certo ficar irado.
  alternative: “Você faz bem em ficar irado?”
  rationale: A pergunta divina confronta a legitimidade da ira de Jonas, e não apenas sua existência. “É certo” preserva essa dimensão ética em linguagem corrente.
- issue: Identificação de קִיקָיוֹן
  choice: Usar “planta” no texto principal.
  alternative: “Mamoneira”, “aboboreira”, “trepadeira” ou “quiquaiom”.
  rationale: A identificação botânica permanece incerta, e especificar uma espécie criaria falsa precisão. A nota conserva as principais possibilidades.
- issue: Sentido de עַד מָוֶת
  choice: Manter a formulação ambígua “até a morte”.
  alternative: “A ponto de morrer” ou “irado o bastante para desejar a morte”.
  rationale: O hebraico expressa intensidade extrema, mas não resolve exatamente a relação entre a ira e a morte. A tradução evita impor uma interpretação psicológica única.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficar irado” preserva a força de חרה sem recorrer à metáfora literal de queimar. O paralelismo entre a pergunta de Deus e a resposta de Jonas foi mantido, bem como a ambiguidade da expressão final.
