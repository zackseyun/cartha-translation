  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: pt
  text: 'Então os homens ficaram com muito medo[a] e lhe disseram: “O que é isso que você fez?” Pois os homens sabiam que ele estava fugindo da presença de Yahweh, porque ele lhes havia contado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os homens temeram um grande temor”.'
    reason: O hebraico usa a repetição de termos da mesma raiz para dar intensidade ao medo.
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: ficaram com muito medo
  rationale: O hebraico usa um acusativo cognato, literalmente “temeram um grande temor”, para intensificar a ideia. A tradução escolhida conserva a ênfase em português natural.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Embora o contexto os identifique como marinheiros, o hebraico emprega aqui o termo comum para “homens”; a tradução direta preserva essa escolha lexical.
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: O que é isso que você fez?
  rationale: Mantém a força demonstrativa de זֹּאת e reproduz o tom enfático da pergunta, sem transformá-la numa pergunta causal como “Por que você fez isso?”.
- source_word: מִלִּפְנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: A expressão significa estar diante de alguém ou em sua presença. Esta forma preserva tanto o sentido quanto a ironia teológica da tentativa de fugir da presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֹרֵחַ
  choice: estava fugindo
  rationale: O particípio hebraico apresenta a fuga como ação em curso; a locução verbal portuguesa conserva esse aspecto.
- source_word: כִּי ... כִּי
  choice: Pois ... porque
  rationale: A primeira ocorrência introduz a explicação do narrador; a segunda indica a razão pela qual os homens sabiam. A distinção torna a relação sintática clara em português.
- source_word: הִגִּיד לָהֶם
  choice: ele lhes havia contado
  rationale: O mais-que-perfeito composto expressa naturalmente que Jonas já lhes dera essa informação antes da reação descrita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo para o público brasileiro. Conserva “os homens”, a pergunta enfática e a referência à “presença de Yahweh”, sem explicitar além do hebraico.
