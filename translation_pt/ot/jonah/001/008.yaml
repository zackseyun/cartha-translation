base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: pt
  text: 'Então eles lhe disseram: “Por favor, diga-nos por causa de quem esta desgraça veio sobre nós.[a] Qual é a sua ocupação? De onde você vem? Qual é a sua terra,[b] e de que povo você é?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por culpa de quem esta calamidade nos atingiu”. O termo hebraico traduzido como “desgraça” se refere aqui ao desastre que ameaçava os marinheiros, não necessariamente ao mal moral.'
    reason: lexical_alternative
  - marker: b
    text: “Qual é a sua terra?” também pode ser traduzido como “Qual é o seu país?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Então eles lhe disseram
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade, e “lhe disseram” representa de modo idiomático o objeto indireto.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Por favor, diga-nos
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer, enquanto נָא acrescenta polidez e urgência. A formulação escolhida é atual e preserva a força do pedido.
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: por causa de quem esta desgraça veio sobre nós
  rationale: A construção pergunta quem está ligado causalmente ao desastre. רָעָה, neste contexto, designa a calamidade ameaçadora da tempestade, e não necessariamente mal moral. “Desgraça” é clara e mantém o peso da situação.
- source_word: מַה מְּלַאכְתְּךָ
  choice: Qual é a sua ocupação?
  rationale: מְלָאכָה pode designar trabalho, ofício ou ocupação. “Ocupação” comunica de modo conciso que se pergunta pela atividade habitual de Jonas.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: De onde você vem?
  rationale: מֵאַיִן pergunta pela procedência. Esta é a ordem mais natural em português contemporâneo.
- source_word: מָה אַרְצֶךָ
  choice: Qual é a sua terra
  rationale: אֶרֶץ pode significar terra ou país. “Terra” fica mais próxima do hebraico e evita impor a ideia moderna de Estado-nação.
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: e de que povo você é?
  rationale: עַם indica um povo ou grupo nacional/étnico. A expressão escolhida é natural em português e conserva a distinção entre terra de origem e pertencimento a um povo.
theological_decisions:
- issue: Sentido de רָעָה no contexto da tempestade
  choice: desgraça
  alternative: mal
  rationale: O contexto imediato aponta para a calamidade que ameaça os marinheiros. A tradução evita moralizar o substantivo, sem excluir a questão da responsabilidade levantada pela pergunta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna as perguntas naturais sem vulgaridade. A sequência curta de perguntas preserva o caráter urgente do interrogatório. Todos os marcadores de nota aparecem no texto.
