  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: pt
  text: Mas Yahweh lançou um grande vento sobre o mar[a], e houve uma grande tempestade no mar; o navio parecia prestes a se partir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh lançou um grande vento sobre o mar”. O hebraico também pode ser traduzido simplesmente por “e”; “mas” destaca o contraste narrativo com a fuga de Jonas.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o navio pensou em ser quebrado”. Trata-se de uma personificação hebraica, indicando que o navio parecia prestes a se partir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mas Yahweh
  rationale: O waw admite valor continuativo, mas o contexto marca um contraste com a fuga de Jonas; “Mas” comunica essa virada narrativa. O nome divino é transliterado como “Yahweh”.
- source_word: הֵטִיל
  choice: lançou
  rationale: O verbo descreve um arremesso vigoroso e conserva a ação direta de Yahweh; “lançou” é natural e digno em português.
- source_word: רוּחַ גְּדוֹלָה
  choice: um vento forte
  rationale: No contexto marítimo, רוּחַ significa “vento”. “Forte” expressa a intensidade de גְּדוֹלָה de modo idiomático, enquanto “grande” é mantido na tempestade para evitar a expressão menos natural “grande vento”.
- source_word: אֶל הַיָּם
  choice: sobre o mar
  rationale: A preposição com o verbo de lançar indica movimento dirigido ao mar; “sobre o mar” preserva essa relação em português natural.
- source_word: וַיְהִי סַעַר גָּדוֹל
  choice: e levantou-se uma grande tempestade
  rationale: A formulação apresenta o surgimento da tempestade como consequência. “Levantou-se” é corrente em português para uma tempestade que se forma, e “grande” preserva o grau do hebraico.
- source_word: בַּיָּם
  choice: no mar
  rationale: A expressão situa a tempestade na esfera do mar, de maneira direta e natural.
- source_word: וְהָאֳנִיָּה חִשְּׁבָה
  choice: o navio parecia
  rationale: Literalmente, o navio “pensou”, uma personificação hebraica. “Parecia” comunica o sentido contextual sem atribuir pensamento real ao navio; a nota conserva a imagem literal.
- source_word: לְהִשָּׁבֵר
  choice: prestes a se despedaçar
  rationale: O infinitivo nifal indica que o navio estava na iminência de se partir. “Se despedaçar” é vívido e idiomático para uma embarcação sob uma tempestade violenta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a ação vigorosa de Yahweh, conserva a intensidade da tempestade e esclarece no texto a personificação incomum, registrando sua forma literal em nota.
