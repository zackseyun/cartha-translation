- from: Mas Yahweh lançou um vento forte sobre o mar[a], e levantou-se uma grande tempestade no mar; o navio parecia prestes a se despedaçar[b].
  to: Mas Yahweh lançou um grande vento sobre o mar[a], e houve uma grande tempestade no mar; o navio parecia prestes a se partir[b].
  rationale: A revisão conserva a repetição de «grande» aplicada ao vento e à tempestade, torna a segunda oração mais próxima de וַיְהִי («houve») e ajusta a nota para refletir o sentido passivo/medio de לְהִשָּׁבֵר. Não altera o sentido do versículo nem introduz interpretação doutrinária.
