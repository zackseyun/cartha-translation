base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: pt
  text: Mas os homens remaram com todas as forças para voltar à terra firme[a]; porém não conseguiram, porque o mar ficava cada vez mais revolto contra eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esforçaram-se nos remos para chegar de novo à terra”. O verbo hebraico significa literalmente “cavar”, mas, neste contexto náutico, refere-se a remar com grande esforço.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica que o mar se tornava progressivamente mais revolto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: remaram com todas as forças
  rationale: O verbo חתר significa literalmente “cavar”, mas, neste contexto náutico, descreve o ato de remar com esforço intenso. A formulação mantém tanto a ação concreta quanto sua intensidade.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O hebraico emprega o termo geral אֲנָשִׁים, não uma designação técnica para marinheiros; por isso, “os homens” preserva a redação da fonte.
- source_word: לְהָשִׁיב אֶל הַיַּבָּשָׁה
  choice: para voltar à terra firme
  rationale: A expressão aponta para o retorno à porção seca. “Terra firme” conserva o contraste bíblico entre o mar e a terra seca e soa natural em português.
- source_word: וְלֹא יָכֹלוּ
  choice: porém não conseguiram
  rationale: Expressa diretamente a incapacidade dos homens e mantém o contraste narrativo.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa de eles não conseguirem alcançar a terra.
- source_word: הַיָּם
  choice: o mar
  rationale: É o sentido comum e direto do substantivo no contexto náutico.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: ficava cada vez mais revolto
  rationale: A construção com הוֹלֵךְ e particípio indica progressão ou intensificação; a tradução comunica que a violência do mar continuava aumentando.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: No contexto, a preposição apresenta o mar como uma força hostil dirigida contra os homens.
