base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: pt
  text: 'Então o capitão se aproximou dele e lhe disse[a]: “Como você pode estar dormindo?[b] Levante-se e clame ao seu deus. Talvez o deus nos leve em consideração[c], para que não pereçamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o chefe dos marinheiros” ou “o mestre do navio”.'
    reason: lexical_alternative
  - marker: b
    text: 'A repreensão hebraica é literalmente muito breve: “Que há com você, adormecido?”, isto é, algo como “Como você pode estar dormindo?”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é raro e também pode significar “pense em nós”, “preste atenção em nós” ou “se preocupe conosco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  choice: o capitão
  rationale: A expressão designa literalmente o chefe dos marinheiros. “Capitão” é o equivalente moderno mais natural e claro para o responsável pelo navio.
- source_word: וַיִּקְרַב אֵלָיו
  choice: se aproximou dele
  rationale: Reproduz de modo natural o movimento expresso por קָרַב, “aproximar-se”.
- source_word: מַה לְּךָ נִרְדָּם
  choice: Como você pode estar dormindo?
  rationale: A formulação hebraica é uma repreensão breve e idiomática, literalmente próxima de “Que há com você, adormecido?”. A tradução preserva a censura e a surpresa em português corrente.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo claro, atual e apropriado à urgência da cena.
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: clame ao seu deus
  rationale: קרא אל indica invocar ou clamar a uma divindade. “Clame ao” comunica tanto a oração quanto a urgência.
- source_word: אוּלַי
  choice: Talvez
  rationale: Mantém a incerteza e a esperança expressas pelo advérbio.
- source_word: יִתְעַשֵּׁת
  choice: se lembre de
  rationale: O verbo raro pode indicar dar atenção, tomar conhecimento ou mostrar consideração. “Se lembre de nós” é natural em português e mantém a ideia de voltar a atenção para os ameaçados, sem explicitar uma intervenção ainda não declarada.
- source_word: הָאֱלֹהִים
  choice: o deus
  rationale: Na fala do capitão pagão, a referência é à divindade de Jonas, sem identificação explícita com o nome pactual do SENHOR.
- source_word: לָנוּ
  choice: de nós
  rationale: Com “se lembre”, a preposição portuguesa idiomática é “de”, expressando o objeto da atenção ou consideração.
- source_word: וְלֹא נֹאבֵד
  choice: para que não pereçamos
  rationale: Expressa naturalmente o resultado esperado, preservando o sentido de perigo mortal.
theological_decisions:
- issue: Referência de אֱלֹהֶיךָ / הָאֱלֹהִים na fala pagã
  choice: “seu deus” e depois “o deus”, em minúscula
  alternative: “seu Deus” e “Deus”
  rationale: O capitão manda Jonas invocar a divindade que ele cultua, mas ainda não a identifica pelo nome como o Deus de Israel. A minúscula preserva a perspectiva do personagem e não elimina a ironia narrativa.
- issue: Nuance do verbo raro יִתְעַשֵּׁת
  choice: “se lembre de nós”, com nota sobre outras possibilidades
  alternative: “pense em nós”, “preste atenção em nós” ou “se preocupe conosco”
  rationale: O contexto pede atenção favorável da divindade, mas o verbo raro não deve ser traduzido de modo a garantir uma ação salvadora. A nota conserva sua amplitude sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala direta mantém a urgência do capitão. Empregou-se “você” por naturalidade contemporânea, sem coloquialismo excessivo; “pereçamos” preserva o tom solene da narrativa.
