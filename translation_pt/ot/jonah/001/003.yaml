source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: pt
  text: Mas Jonas se levantou para fugir para Társis, para longe da presença de Yahweh.[a] Desceu a Jope e encontrou um navio que ia para Társis.[b] Pagou a passagem e desceu para dentro dele,[c] a fim de ir com eles para Társis, para longe da presença de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para longe de Yahweh”; literalmente, “da presença de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um navio com destino a Társis”. A expressão hebraica é literalmente “um navio vindo/indo para Társis”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico repete aqui o verbo “descer”; essa repetição contribui para o movimento descendente da narrativa neste capítulo.
    reason: literary_feature
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Preserva o sentido básico de קום e a sequência narrativa, sem reduzir a expressão a um simples início de viagem.
- source_word: לִבְרֹחַ
  choice: para fugir
  rationale: ברח indica fuga deliberada; “fugir” é direto, natural e mantém a gravidade da ação de Jonas.
- source_word: תַּרְשִׁישָׁה
  choice: para Társis
  rationale: O ה direcional indica movimento em direção a Társis.
- source_word: מִלִּפְנֵי יְהוָה
  choice: para longe da presença de Yahweh
  rationale: Mantém a imagem hebraica de face/presença e explicita naturalmente em português a ideia de afastamento, preservando a ironia teológica da tentativa de fuga.
- source_word: יָפוֹ
  choice: Jope
  rationale: “Jope” é a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: אָנִיָּה
  choice: navio
  rationale: Designa adequadamente uma embarcação marítima e é a opção mais natural no contexto.
- source_word: בָּאָה תַרְשִׁישׁ
  choice: que ia para Társis
  rationale: Embora בוא costume significar “vir”, neste contexto de destino exprime movimento rumo a Társis; a formulação escolhida é idiomática em português.
- source_word: שְׂכָרָהּ
  choice: a passagem
  rationale: O substantivo pode indicar preço, aluguel ou frete; no contexto de um passageiro, “a passagem” comunica com naturalidade o valor pago para viajar.
- source_word: וַיֵּרֶד בָּהּ
  choice: desceu para dentro dele
  rationale: Preserva a repetição narrativa de ירד (“descer”), importante no movimento descendente do capítulo, em vez de nivelá-la como “embarcou”.
- source_word: לָבוֹא עִמָּהֶם
  choice: a fim de ir com os tripulantes
  rationale: “Ir” corresponde ao ponto de vista narrativo em português; “os tripulantes” torna explícito o referente humano do pronome plural sem identificar mais especificamente sua função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título, e evita introduzir uma forma denominacional.
- issue: Sentido de מִלִּפְנֵי יְהוָה
  choice: para longe da presença de Yahweh
  alternative: para longe de Yahweh
  rationale: A tradução conserva o elemento concreto de “presença/face” e a tensão teológica da tentativa de Jonas, sem sugerir que ele pudesse realmente escapar da presença divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. Conservam-se a repetição de “Társis”, as duas ocorrências da expressão relativa à presença de Yahweh e o motivo narrativo de “descer”.
