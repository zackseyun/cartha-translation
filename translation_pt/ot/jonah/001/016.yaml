  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: pt
  text: Então os homens temeram Yahweh com grande temor[a], ofereceram um sacrifício a Yahweh e fizeram votos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram com muito medo de Yahweh” ou “reverenciaram profundamente Yahweh”. O hebraico diz literalmente: “os homens temeram um grande temor de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: temeram
  rationale: O Qal de ירא expressa temor e, neste contexto, após o mar se acalmar, pode abranger tanto medo quanto reverência. “Temeram” preserva essa amplitude e a ligação lexical com יִרְאָה.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Embora o contexto os identifique como marinheiros, o hebraico emprega o termo comum אֲנָשִׁים; a tradução mantém sua forma direta.
- source_word: יִרְאָה גְדוֹלָה
  choice: com grande temor
  rationale: O substantivo cognato intensifica o verbo, literalmente “temeram um grande temor”. A formulação conserva a ênfase hebraica em português digno e compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּזְבְּחוּ זֶבַח
  choice: ofereceram um sacrifício
  rationale: A combinação de verbo e substantivo é uma expressão sacrificial idiomática. Esta tradução comunica naturalmente o ato cultual sem reproduzir a redundância de modo artificial.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica aqui o destinatário ou aquele a quem o sacrifício é dedicado.
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: fizeram votos
  rationale: A combinação idiomática indica compromissos solenes assumidos; “fizeram votos” é natural e preserva o sentido formal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance do temor diante de Yahweh
  choice: temeram Yahweh com grande temor
  alternative: ficaram com muito medo de Yahweh; reverenciaram profundamente Yahweh
  rationale: A linguagem hebraica de temor é forte e pode envolver medo, assombro e reverência, especialmente diante do milagre e da resposta cultual subsequente. A redação escolhida não reduz essa tensão a apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “com grande temor” mantém deliberadamente a ênfase do cognato hebraico sem tornar o versículo excessivamente literal.
