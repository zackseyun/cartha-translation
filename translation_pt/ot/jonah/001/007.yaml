  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: pt
  text: 'E disseram uns aos outros: “Vamos, lancemos sortes para sabermos por causa de quem este mal[a] nos sobreveio.” Então lançaram sortes, e a sorte caiu sobre Jonas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta calamidade” ou “este desastre”. A palavra hebraica pode significar mal, dano ou desastre, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: uns aos outros
  rationale: A expressão distributiva descreve os homens falando entre si; esta é a forma mais natural e clara em português, sem alterar o sentido coletivo do hebraico.
- source_word: לְכוּ
  choice: Vamos
  rationale: Embora o verbo tenha o sentido básico de ir ou andar, aqui funciona como uma exortação que introduz uma ação conjunta.
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: lancemos sortes
  rationale: O coortativo expressa uma proposta de ação conjunta, e “lançar sortes” é a expressão portuguesa tradicional e inteligível para essa prática.
- source_word: וְנֵדְעָה
  choice: para sabermos
  rationale: Neste contexto, a conjunção com o coortativo indica a finalidade de lançar sortes.
- source_word: בְּשֶׁלְּמִי
  choice: por causa de quem
  rationale: Preserva a relação causal e busca identificar a pessoa associada à calamidade, sem acrescentar uma formulação explícita de culpa moral.
- source_word: הָרָעָה הַזֹּאת
  choice: este mal
  rationale: רָעָה pode designar mal, dano, calamidade ou desastre. “Mal” mantém a amplitude lexical do hebraico, enquanto o contexto da tempestade indica uma adversidade concreta.
- source_word: לָנוּ
  choice: nos sobreveio
  rationale: O hebraico não traz aqui um verbo explícito equivalente a “sobrevir”, mas o dativo exige em português uma formulação verbal natural para expressar o mal que atingiu os marinheiros.
- source_word: וַיַּפִּלוּ גוֹרָלוֹת
  choice: Então lançaram sortes
  rationale: O verbo narrativo faz a ação avançar como cumprimento da proposta anterior.
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  choice: a sorte caiu sobre Jonas
  rationale: Reproduz com clareza a imagem e o resultado expressos pelo idioma hebraico.
theological_decisions:
- issue: Sentido de רָעָה no contexto de uma calamidade providencial
  choice: este mal
  alternative: esta calamidade; este desastre
  rationale: O termo hebraico abrange tanto mal quanto dano ou desastre. Neste contexto, refere-se à adversidade que atingiu os marinheiros, mas a tradução “mal” preserva a ambiguidade lexical sem atribuir indevidamente maldade moral a Deus ou aos próprios marinheiros.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vamos, lancemos” conserva a força exortativa do original; “uns aos outros” evita uma formulação excessivamente literal e pouco natural.
