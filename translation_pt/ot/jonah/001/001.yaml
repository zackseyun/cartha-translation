id: JON.1.1
reference: Jonah 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יוֹנָ֥ה בֶן אֲמִתַּ֖י לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/001.yaml
  text: The word of Yahweh came to Jonah son of Amittai[a], saying[b],
translation:
  language: pt
  text: 'A palavra de Yahweh[b] veio[a] a Jonas, filho de Amitai, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E aconteceu: a palavra de Yahweh veio...”. A expressão inicial é uma fórmula narrativa comum.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino יהוה (YHWH), aqui transliterado “Yahweh”. Também tradicionalmente traduzido “SENHOR” ou transliterado “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz o relato e se integra naturalmente ao predicado «a palavra ... veio». Evita-se acrescentar um advérbio temporal que não está explícito no hebraico.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, «a palavra» conserva o sentido concreto e as ressonâncias proféticas e intertextuais; «a mensagem» seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Indica o destinatário da revelação e é a formulação portuguesa natural com o verbo «vir».
- source_word: יוֹנָה
  choice: Jonas
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶן אֲמִתַּי
  choice: filho de Amitai
  rationale: Reproduz diretamente o patronímico hebraico em português corrente.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a ligação explícita com a fala divina que começa no versículo seguinte; os dois-pontos sinalizam naturalmente a introdução da citação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o caráter de nome pessoal e evita substituí-lo pelo título «SENHOR»; «Jeová» representa uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva a fórmula profética e o vínculo com a fala seguinte sem reproduzir de modo rígido o hebraísmo inicial. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
