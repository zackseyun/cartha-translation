  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: pt
  text: 'Então eles clamaram a Yahweh e disseram: “Por favor, Yahweh, não nos deixes perecer por causa da vida deste homem[b] e não ponhas sobre nós sangue inocente[a], pois tu, Yahweh, fizeste como quiseste.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não nos consideres culpados por sangue inocente” ou “não nos tornes culpados pela morte de um inocente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “por causa da vida deste homem”; a expressão também pode ser entendida como “por tirarmos a vida deste homem” ou “por causa deste homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־יְהוָה
  choice: clamaram a Yahweh
  rationale: A construção קרא אל indica aqui um apelo urgente dirigido a Deus; “clamaram” transmite a aflição e a intensidade do pedido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָנָּה ... אַל נָא נֹאבְדָה
  choice: Por favor ... não nos deixes perecer
  rationale: אָנָּה e נָא reforçam a súplica urgente. A formulação portuguesa é natural e conserva o pedido para que eles não pereçam, sem afirmar de modo excessivamente específico a causalidade divina.
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: por causa da vida deste homem
  rationale: נֶפֶשׁ designa aqui sobretudo a vida do homem. A expressão mantém a formulação do hebraico e sua possível amplitude interpretativa.
- source_word: וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: e não ponhas sobre nós sangue inocente
  rationale: Conserva a imagem jurídica e moral do idioma hebraico, segundo o qual o sangue derramado pode recair sobre alguém como culpa.
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: fizeste como quiseste
  rationale: Expressa de maneira concisa a ação realizada segundo o querer de Yahweh, sem introduzir terminologia teológica posterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio.
- issue: Explicitação da culpa de sangue
  choice: manter no texto a imagem “não ponhas sobre nós sangue inocente”
  alternative: não nos consideres culpados pela morte de um inocente
  rationale: A imagem hebraica é compreensível em português e preserva a textura jurídico-moral do original; a alternativa explicita uma interpretação legítima, mas mais desenvolvida.
- issue: Sentido de בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: por causa da vida deste homem
  alternative: por tirarmos a vida deste homem; por causa deste homem
  rationale: A formulação escolhida mantém נֶפֶשׁ como “vida” e preserva a ambiguidade sobre se a preocupação é perecer por causa dele ou por lhe tirar a vida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome divino “Yahweh”, o verbo solene mas corrente “perecer” e a imagem hebraica do sangue posto sobre alguém. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
