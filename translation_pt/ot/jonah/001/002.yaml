  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: pt
  text: Levante-se, vá a Nínive, a grande cidade, e clame contra ela[a], porque a maldade deles[b] subiu diante de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proclame a respeito dela”. A expressão hebraica pode ter sentido mais geral, mas, neste contexto, provavelmente indica uma denúncia contra Nínive.
    reason: lexical_alternative
  - marker: b
    text: Ou “o mal que praticam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  choice: Levante-se
  rationale: O imperativo de קום introduz uma convocação profética abrupta. “Levante-se” é corrente, digno e combina naturalmente com o imperativo seguinte.
- source_word: לֵ֧ךְ
  choice: vá
  rationale: Equivalente direto e natural do imperativo de הלך neste contexto de deslocamento.
- source_word: אֶל נִֽינְוֵ֛ה
  choice: a Nínive
  rationale: A preposição indica movimento em direção à cidade; “Nínive” segue a forma tradicional do nome em português.
- source_word: הָעִ֥יר הַגְּדוֹלָ֖ה
  choice: a grande cidade
  rationale: Preserva a descrição apositiva e a amplitude semântica de גָּדוֹל, que pode envolver tamanho e importância.
- source_word: וּקְרָ֣א עָלֶ֑יהָ
  choice: e clame contra ela
  rationale: קרא expressa anúncio público e enfático; com על e diante da cláusula sobre a maldade de Nínive, o sentido adversativo é o mais provável. A nota preserva a leitura mais geral possível.
- source_word: כִּֽי
  choice: porque
  rationale: Introduz claramente a razão da missão dada a Jonas.
- source_word: עָלְתָ֥ה
  choice: subiu
  rationale: Mantém a imagem vertical do hebraico, segundo a qual a maldade chega à atenção ou presença de Deus.
- source_word: רָעָתָ֖ם
  choice: a maldade deles
  rationale: Neste contexto, רָעָה designa a conduta moralmente má que motiva a denúncia divina. “Deles” preserva o sufixo masculino plural, referindo-se aos habitantes de Nínive.
- source_word: לְפָנָֽי
  choice: até mim
  rationale: Com o verbo “subiu”, esta formulação comunica de modo natural em português que a maldade chegou à presença e atenção de Deus, sem abandonar a imagem ascendente.
theological_decisions:
- issue: Sentido da comissão profética em וּקְרָא עָלֶיהָ
  choice: Uma denúncia proclamada contra Nínive
  alternative: Uma proclamação a respeito de Nínive, sem força adversativa explícita
  rationale: A construção קרא על, somada à afirmação de que a maldade dos habitantes subiu até Deus, favorece uma proclamação de juízo. A nota registra a possibilidade lexical mais geral sem neutralizar o sentido mais provável no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência breve de imperativos conserva a urgência do chamado. “Clame” mantém a força pública e audível de קרא, enquanto as notas preservam alternativas lexicais genuínas. Todos os marcadores aparecem no texto principal junto aos termos pertinentes.
