  text: וַ/יִּשְׂאוּ֙ אֶת יוֹנָ֔ה וַ/יְטִלֻ֖/הוּ אֶל הַ/יָּ֑ם וַ/יַּעֲמֹ֥ד הַ/יָּ֖ם מִ/זַּעְפּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/015.yaml
  text: So they picked up Jonah and threw him into the sea[a], and the sea ceased from its raging.
translation:
  language: pt
  text: Então eles pegaram Jonas e o lançaram ao mar, e o mar cessou de se enfurecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: pegaram
  rationale: O verbo נשׂא descreve aqui o ato concreto de levantar ou tomar Jonas para lançá-lo ao mar. “Pegaram” é natural e claro em português moderno, sem acrescentar solenidade ao gesto.
- source_word: וַיְטִלֻהוּ
  choice: o lançaram
  rationale: טול significa lançar ou atirar. “Lançaram” preserva a ação deliberada e mantém um registro narrativo digno; “atiraram” também seria possível, mas é mais coloquial.
- source_word: אֶל הַיָּם
  choice: ao mar
  rationale: Depois de “lançar”, a contração “ao mar” expressa em português o movimento para dentro do mar de modo idiomático, embora אֶל tenha como sentido básico “para”.
- source_word: וַיַּעֲמֹד הַיָּם
  choice: o mar cessou
  rationale: עמד significa literalmente “ficar de pé” ou “parar”; neste contexto, indica que a agitação do mar terminou. “Cessou” conserva a força verbal sem explicitar além do texto que o mar ficou completamente calmo.
- source_word: מִזַּעְפּוֹ
  choice: de se enfurecer
  rationale: זעף pode indicar furor, ira ou agitação violenta. Aplicado ao mar, “se enfurecer” preserva a personificação e soa natural em português.
theological_decisions:
- issue: Personificação da agitação violenta do mar
  choice: “o mar cessou de se enfurecer”
  alternative: “o mar se acalmou” ou “o mar cessou do seu furor”
  rationale: A formulação preserva a personificação presente em זעף e a ideia de cessação expressa por עמד, sem reduzir a frase a uma simples observação meteorológica nem atribuir ao mar uma ira teológica literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa hebraica foi mantida, e não se julgou necessária nota de rodapé, pois as alternativas lexicais não alteram substancialmente o sentido.
