base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: pt
  text: 'Ele lhes disse: “Levantem-me e lancem-me ao mar; então o mar se acalmará para vocês[a], pois eu sei que esta grande tempestade está sobre vocês por minha causa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o mar ficará quieto de sobre vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Levantem-me
  rationale: נשא descreve aqui o ato concreto de erguer Jonas para lançá-lo ao mar. “Levantem-me” é claro, natural e mantém a sequência física das ações.
- source_word: וַהֲטִילֻנִי
  choice: lancem-me
  rationale: O hifil de טול significa lançar ou arremessar. “Lancem-me” conserva a força do verbo sem soar excessivamente coloquial ou intensificar indevidamente a ação.
- source_word: הַיָּם
  choice: o mar
  rationale: ים significa normalmente “mar”; “oceano” especificaria além do que o hebraico afirma.
- source_word: וְיִשְׁתֹּק
  choice: se acalmará
  rationale: Embora שתק expresse literalmente ficar quieto ou silencioso, tendo o mar como sujeito no contexto de uma tempestade indica a cessação da agitação. “Se acalmará” comunica isso naturalmente.
- source_word: מֵעֲלֵיכֶם
  choice: ao redor de vocês
  rationale: A expressão é literalmente “de sobre vocês”. No contexto, indica que o mar deixará de ameaçá-los; “ao redor de vocês” preserva a relação espacial sem produzir uma construção artificial em português.
- source_word: יוֹדֵעַ אָנִי
  choice: eu sei
  rationale: O particípio seguido do pronome dá certa ênfase à afirmação. “Eu sei” preserva essa ênfase de modo natural em português.
- source_word: בְשֶׁלִּי
  choice: por minha causa
  rationale: A expressão assinala causa e responsabilidade. “Por minha causa” transmite claramente a admissão de Jonas.
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: esta grande tempestade
  rationale: A tradução mantém o substantivo, o adjetivo e o demonstrativo do hebraico em linguagem corrente e digna.
- source_word: עֲלֵיכֶם
  choice: veio sobre vocês
  rationale: A preposição על apresenta a tempestade como sobrevindo aos marinheiros. O verbo “veio”, implícito em português para formar uma oração natural, preserva essa imagem.
theological_decisions:
- issue: O reconhecimento de Jonas de sua responsabilidade pela tempestade
  choice: Jonas declara explicitamente que a tempestade veio sobre os marinheiros por causa dele.
  alternative: Jonas estaria indicando apenas associação com a tempestade, sem admitir responsabilidade direta.
  rationale: A expressão causal בְשֶׁלִּי indica que Jonas se reconhece como causa da situação. A tradução mantém essa confissão sem atenuá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Lancem-me” mantém dignidade narrativa; “se acalmará ao redor de vocês” comunica o idioma hebraico sem perder sua imagem espacial. O único marcador de nota, [a], aparece no texto principal.
