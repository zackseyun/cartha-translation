revisions:
- from: 'Ele lhes disse: “Levantem-me e lancem-me ao mar; então o mar se acalmará ao redor de vocês[a], pois eu sei que esta grande tempestade veio sobre vocês por minha causa.”'
  to: 'Ele lhes disse: “Levantem-me e lancem-me ao mar; então o mar se acalmará para vocês[a], pois eu sei que esta grande tempestade está sobre vocês por minha causa.”'
  rationale: 'A revisão substitui a relação espacial inadequada de «ao redor de vocês» por uma formulação portuguesa natural que conserva o efeito pretendido: o mar se acalmará em benefício deles. Também restaura o presente do hebraico em «está sobre vocês». As demais escolhas permanecem fiéis ao texto e apropriadas ao português moderno.'
