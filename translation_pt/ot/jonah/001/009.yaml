id: JON.1.9
reference: Jonah 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: pt
  text: 'Ele lhes respondeu: “Sou hebreu e temo[a] a Javé[b], o Deus dos céus, que fez o mar e a terra seca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reverencio” ou “adoro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome pessoal de Deus; tradicionalmente traduzido por “SENHOR”.'
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Ele lhes respondeu
  rationale: No contexto da pergunta anterior, “respondeu” expressa naturalmente em português a função narrativa de וַיֹּאמֶר, enquanto “lhes” preserva o complemento plural.
- source_word: עִבְרִי
  choice: hebreu
  rationale: É a designação étnica corrente e natural em português para a autodeclaração de Jonas.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: o Deus dos céus
  rationale: Preserva o plural morfológico de שָׁמַיִם e corresponde a uma expressão natural e reconhecível em português.
- source_word: יָרֵא
  choice: temo
  rationale: Mantém o sentido lexical direto de temor, incluindo sua dimensão reverencial, e preserva a tensão irônica entre a profissão de Jonas e sua conduta.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente direto e não interpretativamente ampliado do verbo comum עשה; “criou” seria mais específico do que o hebraico exige.
- source_word: הַיָּם
  choice: o mar
  rationale: É o equivalente usual e adequado ao contexto marítimo.
- source_word: הַיַּבָּשָׁה
  choice: a terra seca
  rationale: Conserva o contraste explícito com o mar e o sentido de solo ou terra não coberta pelas águas.
- source_word: אָנֹכִי ... אֲנִי
  choice: Sou ... e temo
  rationale: As formas verbais portuguesas marcam claramente a primeira pessoa nas duas orações, produzindo uma declaração natural sem perder a repetição da referência ao próprio falante.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Iavé; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Javé” preserva o nome pessoal numa forma portuguesa amplamente compreensível, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Força semântica de יָרֵא na autodescrição de Jonas
  choice: temo
  alternative: reverencio; adoro
  rationale: “Temo” mantém tanto o sentido básico quanto a possibilidade de temor reverente, sem suavizar a tensão entre o que Jonas declara e o modo como está agindo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A formulação é concisa e oralmente natural; “terra seca” mantém o contraste concreto com “mar”, e “Deus dos céus” conserva a forma plural do hebraico.
