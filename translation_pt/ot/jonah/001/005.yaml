source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: pt
  text: Então os marinheiros ficaram com medo, e cada um clamou ao seu deus. Lançaram ao mar a carga[a] que estava no navio, para tornar o navio mais leve. Jonas, porém, tinha descido à parte mais interior da embarcação[b]; ali se deitou e adormeceu profundamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os equipamentos do navio” ou “os objetos que estavam no navio”. O termo hebraico é amplo; neste contexto, provavelmente se refere à carga ou aos equipamentos lançados ao mar para tornar o navio mais leve.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos recantos mais profundos da embarcação” ou “ao porão da embarcação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: os marinheiros ficaram com medo
  rationale: Expressa de modo natural o medo provocado pelo perigo, sem sugerir temor reverente.
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו
  choice: cada um clamou ao seu deus
  rationale: זעק indica um clamor intenso em situação de aflição; אִישׁ tem valor distributivo, e o sufixo singular indica o deus particular de cada marinheiro.
- source_word: וַיָּטִלוּ אֶת הַכֵּלִים
  choice: lançaram ... a carga
  rationale: כֵּלִים é amplo e pode designar objetos, utensílios ou equipamento; no contexto de aliviar o navio, “carga” comunica com clareza o referente mais provável, enquanto a nota preserva a amplitude lexical.
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: a fim de torná-lo mais leve
  rationale: Representa o propósito de reduzir o peso do navio de maneira idiomática em português. O pronome retoma “navio”, inferido naturalmente pelo contexto.
- source_word: יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה
  choice: tinha descido à parte mais interior da embarcação
  rationale: O mais-que-perfeito composto apresenta a descida de Jonas como circunstância anterior, e “parte mais interior” conserva a imagem espacial sem impor o termo técnico “porão”.
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: ali se deitou e adormeceu profundamente
  rationale: Mantém as duas ações sucessivas e transmite a intensidade contextual do sono; “ali” torna natural a ligação espacial em português.
theological_decisions:
- issue: Referência à divindade pagã em אֱלֹהָיו
  choice: seu deus
  alternative: seus deuses
  rationale: O sufixo singular, combinado com o distributivo “cada um”, favorece a ideia de que cada marinheiro clamou à sua própria divindade. A inicial minúscula evita identificar essas divindades com o Deus de Israel.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “Jonas”, a forma portuguesa tradicional e corrente do nome hebraico יוֹנָה. A alternância entre “navio” e “embarcação” acompanha, sem exagerar, a presença de dois termos náuticos no hebraico.
