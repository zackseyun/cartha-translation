base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: pt
  text: 'Então eles lhe disseram: “O que devemos fazer com você para que o mar se acalme e pare de nos ameaçar[a]?” Pois o mar ia ficando cada vez mais revolto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de sobre nós”, expressão vívida que retrata o mar como uma ameaça que pesava sobre eles.'
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “ia e se enfurecia”, isto é, tornava-se cada vez mais revolto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: O que devemos fazer com você
  rationale: A forma deliberativa pede que ação os marinheiros devem tomar em relação a Jonas. Em português atual, “fazer com você” é mais natural que o literal “fazer a você”, sem antecipar qual será a ação.
- source_word: וְיִשְׁתֹּק
  choice: para que o mar se acalme
  rationale: O verbo שתק significa ficar quieto ou imóvel. Aplicado ao mar revolto, “se acalme” expressa com clareza a cessação da agitação; “para que” torna explícita a relação de finalidade sugerida pelo contexto.
- source_word: הַיָּם
  choice: o mar
  rationale: Equivalente comum e direto de יָם neste contexto narrativo.
- source_word: מֵעָלֵינוּ
  choice: e nos deixe em paz
  rationale: A expressão hebraica significa literalmente “de sobre nós” e retrata o mar como uma ameaça que pesa sobre os marinheiros. A formulação escolhida comunica esse afastamento da ameaça em português natural, enquanto a nota preserva a imagem literal.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da urgência da pergunta dos marinheiros e mantém a ligação causal com a frase anterior.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: ia ficando cada vez mais revolto
  rationale: A construção com הוֹלֵךְ e particípio indica progressão ou intensificação contínua. “Ia ficando cada vez mais revolto” preserva esse desenvolvimento em linguagem narrativa natural.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução usa equivalência ótima: mantém a progressão da tempestade e a imagem ameaçadora do hebraico, recorrendo a notas onde uma reprodução literal seria pouco natural.'
