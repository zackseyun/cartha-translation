  register: 'Português moderno, digno e de leitura corrente, com formas portuguesas tradicionais dos nomes próprios. Os marcadores foram posicionados junto às expressões que efetivamente esclarecem: [a] após “dirigente” e [b] após “casa de Deus”.'
