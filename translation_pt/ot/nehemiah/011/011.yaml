  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: pt
  text: Seraías, filho de Hilquias, filho de Mesulão, filho de Zadoque, filho de Meraiote, filho de Aitube, dirigente[a] da casa de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe” ou “encarregado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecível em português.
- source_word: בֶן
  choice: filho de
  rationale: A fórmula genealógica repetida é expressa naturalmente por “filho de”. Embora genealogias hebraicas possam omitir gerações, o contexto não exige a forma mais ampla “descendente de”.
- source_word: נְגִיד
  choice: dirigente
  rationale: O termo designa alguém posto à frente ou encarregado. “Dirigente” comunica a função administrativa sem introduzir a conotação régia de “governante”.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Preserva a expressão hebraica literal e natural em português; no contexto, ela se refere ao templo.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Na expressão construta, o termo se refere ao Deus de Israel e deve ser vertido no singular.
theological_decisions: []
