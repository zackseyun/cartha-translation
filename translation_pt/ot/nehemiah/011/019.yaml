  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: pt
  text: 'E os porteiros: Acube, Talmom e seus irmãos, que estavam de guarda nos portões, eram cento e setenta e dois.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: os porteiros
  rationale: Designa os encarregados de guardar e atender os portões. “Porteiros” é uma forma tradicional, clara e concisa em português para essa função institucional.
- source_word: עַקּוּב
  choice: Acube
  rationale: Nome próprio transliterado segundo a forma portuguesa corrente.
- source_word: טַלְמוֹן
  choice: Talmom
  rationale: Nome próprio transliterado em forma natural para leitores de português.
- source_word: וַאֲחֵיהֶם
  choice: e seus irmãos
  rationale: Preserva o sentido básico de אָח e a referência masculina do hebraico, sem excluir sua possível extensão a parentes ou companheiros do mesmo grupo.
- source_word: הַשֹּׁמְרִים
  choice: que vigiavam
  rationale: O particípio descreve o exercício contínuo da função de guarda; “vigiavam” comunica isso de modo natural e direto.
- source_word: בַּשְּׁעָרִים
  choice: os portões
  rationale: Com “vigiavam”, o objeto direto “os portões” é idiomático em português e expressa adequadamente o local e o âmbito da guarda.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: cento e setenta e dois
  rationale: Forma cardinal padrão em português para o total indicado.
