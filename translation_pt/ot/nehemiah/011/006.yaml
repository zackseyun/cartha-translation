lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Expressa de modo direto o sentido totalizante, abrangendo o grupo inteiro contado.
- source_word: בְּנֵי פֶרֶץ
  choice: os filhos de Perez
  rationale: Preserva a expressão hebraica de parentesco; no contexto genealógico, ela pode abranger os descendentes de Perez.
- source_word: הַיֹּשְׁבִים
  choice: que moravam
  rationale: O particípio de ישׁב indica residência; «moravam» é natural no português atual e adequado a este registro populacional.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome do lugar com a preposição.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: quatrocentos e sessenta e oito
  rationale: Reproduz por extenso a contagem cardinal hebraica em forma portuguesa corrente.
- source_word: אַנְשֵׁי חָיִל
  choice: homens valentes
  rationale: Mantém a forma masculina e a ideia elogiosa de força, capacidade ou valor, sem restringir indevidamente a amplitude da expressão hebraica.
