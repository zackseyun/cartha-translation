  text: Todos os filhos de Perez que moravam em Jerusalém eram quatrocentos e sessenta e oito homens valentes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «homens de valor». A expressão hebraica pode designar homens que se distinguem pela força, capacidade ou valentia.
