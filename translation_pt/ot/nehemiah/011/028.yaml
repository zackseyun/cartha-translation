lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַ֥ג
  choice: e em Ziclague
  rationale: A conjunção וּ e a preposição בְּ são traduzidas diretamente por “e em”. צִקְלַג é um topônimo; emprega-se a forma portuguesa tradicional “Ziclague”.
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: e em Mecona
  rationale: A conjunção e a preposição são mantidas, e o topônimo מְכֹנָה é transliterado em forma natural para leitores de português como “Mecona”.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: e nas aldeias que dependiam dela
  rationale: Literalmente, a expressão diz “e em suas filhas”, idiomatismo hebraico para povoações menores vinculadas a uma localidade principal. A formulação esclarece a relação de dependência sem introduzir uma ideia ausente do texto; o pronome feminino retoma Mecona.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas legíveis em contexto brasileiro. A repetição de “e em” acompanha a estrutura enumerativa do hebraico; o idiomatismo “filhas” é explicado em nota.
