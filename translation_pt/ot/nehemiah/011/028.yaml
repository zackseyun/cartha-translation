  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: pt
  text: e em Ziclague, e em Mecona, e nas povoações dependentes dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e em suas filhas”, expressão hebraica para aldeias ou povoações menores vinculadas a Mecona.
