base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: pt
  text: O supervisor dos levitas em Jerusalém era Uzi, filho de Bani, filho de Hasabias, filho de Matanias, filho de Mica, dos descendentes de Asafe, os cantores, responsável pelo trabalho da casa de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em relação ao trabalho da casa de Deus”. A expressão hebraica com לְנֶגֶד pode indicar supervisão ou responsabilidade, mas também admite um sentido mais geral de relação com o trabalho da casa de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: O supervisor dos levitas
  rationale: פְקִיד designa alguém nomeado para uma função de supervisão ou administração. “Supervisor” comunica com clareza esse papel oficial sem lhe atribuir caráter militar.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução direta do uso locativo da preposição בְּ.
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: Uzi, filho de Bani, filho de Hasabias, filho de Matanias, filho de Mica
  rationale: Os nomes seguem formas portuguesas reconhecíveis, e a repetição de בֶן é preservada para manter transparente a sequência genealógica.
- source_word: מִבְּנֵי אָסָף
  choice: um dos filhos de Asafe
  rationale: A expressão significa literalmente “dos filhos de Asafe” e, neste contexto genealógico, identifica Uzi como membro dessa linhagem.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio identifica os asafitas por sua função musical no templo. “Cantores” é mais preciso que o termo mais amplo “músicos”.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: estava encarregado do trabalho
  rationale: Neste contexto administrativo, לְנֶגֶד pode indicar responsabilidade ou supervisão em relação ao trabalho. A formulação explicita esse sentido provável em português natural, enquanto a nota registra a amplitude da expressão.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a expressão hebraica transparente e tradicional, sem substituir de modo interpretativo por “templo de Deus”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A longa identificação genealógica foi mantida, mas o enunciado foi dividido em duas frases para evitar ambiguidade sintática excessiva. “Casa de Deus” conserva a imagem do hebraico; “supervisor” e “encarregado” comunicam o contexto administrativo sem acrescentar uma estrutura eclesiástica posterior.
