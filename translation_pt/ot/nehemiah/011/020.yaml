  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: pt
  text: O restante de Israel, os sacerdotes e os levitas estavam em todas as cidades de Judá, cada um[a] na sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “cada homem na sua herança”; o singular tem sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר
  choice: O restante de
  rationale: שְׁאָר designa aquilo que resta. “O restante de” expressa com naturalidade o contraste com os grupos anteriormente enumerados em Jerusalém.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se a forma tradicional do nome próprio; no contexto, refere-se ao restante do povo israelita, além dos sacerdotes e levitas mencionados separadamente.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português corrente para o substantivo que designa a classe sacerdotal.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma tradicional e clara para os membros do grupo levítico.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: em todas as cidades de Judá
  rationale: A preposição בְּ tem sentido locativo, e esta formulação reproduz de modo direto o alcance de כָּל.
- source_word: אִישׁ
  choice: cada um
  rationale: Embora אִישׁ possa significar literalmente “homem”, aqui exerce função distributiva. “Cada um” comunica essa função com naturalidade em português.
- source_word: בְּנַחֲלָתוֹ
  choice: na sua herança
  rationale: נַחֲלָה designa uma posse herdada ou porção atribuída. “Herança” preserva a associação com a terra recebida como patrimônio, e o possessivo singular acompanha a construção distributiva.
theological_decisions:
- issue: Tradução da linguagem masculina singular com função distributiva
  choice: cada um na sua herança
  alternative: cada homem na sua herança
  rationale: O hebraico emprega אִישׁ e um sufixo masculino singular de maneira distributiva. “Cada um” conserva o singular e a distribuição individual sem tornar a frase desnecessariamente rígida; “cada homem” seria mais literal na forma, mas menos natural e poderia enfatizar o sexo masculino além da função contextual.
- issue: Verbo implícito na oração nominal hebraica
  choice: estavam
  alternative: omitir o verbo mediante uma construção nominal
  rationale: O hebraico não apresenta verbo expresso, mas o português requer normalmente uma forma verbal para produzir uma frase completa e clara. “Estavam” explicita apenas a relação locativa indicada pelo contexto, sem acrescentar uma ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos grupos e a formulação locativa foram preservadas; o verbo “estavam”, implícito no hebraico, foi suprido por exigência idiomática do português.
