source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: pt
  text: 'E, dentre os levitas: Semaías, filho de Hassube[a], filho de Azricão, filho de Hasabias, filho de Buni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em listas genealógicas, o hebraico traduzido como “filho de” pode, às vezes, indicar um descendente mais distante, e não necessariamente um filho direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E, dentre
  rationale: A conjunção liga o versículo à lista anterior, enquanto מִן indica que Semaías é apresentado como alguém do grupo dos levitas.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designa os integrantes da tribo de Levi como grupo reconhecido; esta é a forma corrente e natural em português.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶן
  choice: filho de
  rationale: Preserva a estrutura genealógica hebraica; nesse tipo de lista, o termo também pode indicar descendência não imediata.
- source_word: חַשּׁוּב
  choice: Hassube
  rationale: Transliteração portuguesa que representa a consoante hebraica intensificada e evita confusão com o nome distinto חָשׁוּב.
- source_word: עַזְרִיקָם
  choice: Azricão
  rationale: Forma aportuguesada tradicional do nome, natural para leitores de língua portuguesa.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma aportuguesada tradicional e reconhecível do nome hebraico.
- source_word: בּוּנִּי
  choice: Buni
  rationale: Transliteração clara e corrente em português, sem duplicação gráfica desnecessária da consoante.
