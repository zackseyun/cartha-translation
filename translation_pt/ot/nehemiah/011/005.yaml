base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: pt
  text: E Maaseias, filho de Baruque, filho de Col-Hozé, filho de Hazaías, filho de Adaías, filho de Joiaribe, filho de Zacarias, filho do silonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o selonita”. O gentílico hebraico pode indicar uma ligação com Siló ou com o clã de Selá, também chamado Silom, na tradição genealógica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: e Maaseias
  rationale: Mantém a conjunção que dá continuidade à lista do versículo anterior e translitera o nome segundo a forma bíblica portuguesa corrente.
- source_word: בֶן
  choice: filho de
  rationale: Reproduz de modo consistente a cadeia genealógica; embora בֶן possa ocasionalmente indicar descendência mais ampla, aqui a forma imediata é patronímica.
- source_word: בָּרוּךְ
  choice: Baruque
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: כָּל חֹזֶה
  choice: Col-Hozé
  rationale: Trata a expressão como nome próprio composto, sem traduzi-la literalmente.
- source_word: חֲזָיָה
  choice: Hazaías
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: עֲדָיָה
  choice: Adaías
  rationale: Forma portuguesa clara e próxima do nome hebraico.
- source_word: יוֹיָרִיב
  choice: Joiaribe
  rationale: Representa a forma hebraica breve presente no texto, sem expandi-la para uma forma teofórica mais longa.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: הַ/שִּׁלֹנִי
  choice: o silonita
  rationale: Preserva o gentílico hebraico com artigo e sua possível referência geográfica ou clânica, sem decidir entre essas relações.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas portuguesas tradicionais para os nomes bíblicos. A repetição de “filho de” foi mantida para preservar a estrutura genealógica hebraica. O marcador da nota foi colocado junto de “silonita”, termo ao qual a alternativa lexical se refere.
