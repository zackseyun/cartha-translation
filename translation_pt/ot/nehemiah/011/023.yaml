  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי מִצְוַ֥ת הַ/מֶּ֖לֶךְ עֲלֵי/הֶ֑ם וַ/אֲמָנָ֥ה עַל הַ/מְשֹׁרְרִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: pt
  text: Pois havia uma ordem do rei a respeito deles e uma provisão fixa[a] para os cantores, conforme a necessidade de cada dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode indicar um acordo firme, uma disposição estabelecida ou uma obrigação permanente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a questão de cada dia no seu dia”; também pode ser entendido como “a porção diária”.
    reason: idiom_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém de modo natural a conexão discursiva.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: uma ordem do rei
  rationale: מִצְוָה designa aqui uma determinação oficial e autoritativa, não necessariamente um mandamento religioso.
- source_word: עֲלֵיהֶם
  choice: a respeito deles
  rationale: Neste contexto administrativo, עַל indica que a ordem dizia respeito a eles; a tradução evita o pouco natural 'estava sobre eles' sem eliminar a ideia de autoridade.
- source_word: וַאֲמָנָה
  choice: e uma provisão fixa
  rationale: אֲמָנָה pode indicar uma disposição firmemente estabelecida; no contexto dos cantores, 'provisão fixa' expressa adequadamente uma alocação oficial e regular, enquanto a nota preserva alternativas possíveis.
- source_word: עַל הַמְשֹׁרְרִים
  choice: para os cantores
  rationale: O segundo עַל indica a quem se destinava ou a quem dizia respeito a provisão.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: conforme a necessidade de cada dia
  rationale: A expressão idiomática significa aquilo que cabia ou era requerido diariamente; esta formulação é clara em português e conserva o caráter administrativo da frase.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe administrativa natural. A formulação preserva a distinção entre a ordem real e a provisão estabelecida, sem definir além do hebraico a natureza exata dessa provisão.
