lexical_decisions:
- source_word: לֹד
  choice: Lode
  rationale: Nome próprio de lugar, transliterado na forma tradicional e natural em português.
- source_word: וְ/אוֹנוֹ
  choice: e Ono
  rationale: A conjunção é traduzida diretamente por “e”, e o topônimo é transliterado.
- source_word: גֵּי
  choice: o vale dos
  rationale: A forma construta expressa a relação entre “vale” e o substantivo seguinte; “o vale dos” é natural em português e preserva essa relação.
- source_word: הַחֲרָשִׁים
  choice: Artesãos
  rationale: O termo pode designar artesãos em geral e, em certos contextos, especificamente ferreiros. A opção mais ampla preserva a ambiguidade lexical e funciona como parte do topônimo.
