base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: pt
  text: E Matanias, filho de Micaías, filho de Zabdi, filho de Asafe, era o líder que iniciava a ação de graças na oração[a]; e Bacbuquias ocupava o segundo lugar entre seus irmãos; e Abda, filho de Samua, filho de Galal, filho de Jedutum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dava graças na oração”. Mais literalmente, o hebraico diz: “líder do início, dando graças na oração”, indicando que Matanias liderava ou iniciava a ação de graças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: líder
  rationale: No contexto da lista de responsáveis levíticos, indica posição de liderança; “líder” comunica naturalmente a função em português.
- source_word: הַתְּחִלָּה
  choice: que iniciava
  rationale: O substantivo “começo” funciona junto de רֹאשׁ e do verbo seguinte; a formulação verbal preserva o papel de dar início à ação litúrgica sem reproduzir uma construção obscura em português.
- source_word: יְהוֹדֶה
  choice: a ação de graças
  rationale: No contexto litúrgico ligado a Asafe, o hifil de ידה favorece o sentido de agradecer ou louvar, em vez de confessar.
- source_word: לַתְּפִלָּה
  choice: na oração
  rationale: Representa de maneira idiomática a esfera ou ocasião litúrgica em que ocorria a ação de graças.
- source_word: מִשְׁנֶה
  choice: ocupava o segundo lugar
  rationale: Expressa posição secundária ou subsequente e evita sugerir, sem necessidade, um cargo técnico específico.
- source_word: מֵאֶחָיו
  choice: entre seus irmãos
  rationale: Preserva a linguagem do hebraico sem especificar interpretativamente “parentes” ou “companheiros levitas”.
- source_word: יְדִיתוּן
  choice: Jedutum
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
theological_decisions:
- issue: Sentido de ידה no contexto de culto
  choice: ação de graças
  alternative: confissão ou louvor
  rationale: O cenário do serviço levítico e a associação com Asafe favorecem agradecimento/louvor. A nota mantém visível a possível tradução verbal do hebraico e a dificuldade sintática da expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes em formas bíblicas portuguesas correntes. A sintaxe foi suavizada para clareza, enquanto a ambiguidade da expressão hebraica sobre liderança, início e ação de graças foi preservada em nota.
