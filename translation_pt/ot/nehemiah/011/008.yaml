lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Depois dele
  rationale: A expressão significa literalmente “e depois dele”. Neste contexto de lista, indica a sequência dos moradores ou grupos registrados. Em português, a continuidade com o versículo anterior torna desnecessário explicitar o “e” inicial.
- source_word: גַּבַּי
  choice: Gabai
  rationale: Nome próprio transliterado de forma natural e legível em português.
- source_word: סַלָּי
  choice: Salai
  rationale: Nome próprio transliterado de forma natural e legível em português.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: novecentos e vinte e oito
  rationale: O numeral hebraico corresponde diretamente a 928; escrevê-lo por extenso mantém o estilo corrido e natural do texto bíblico em português.
