  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: pt
  text: 'Em Jerusalém moravam alguns dos filhos de Judá e alguns dos filhos de Benjamim.[a] Dos filhos de Judá: Ataías, filho de Uzias, filho de Zacarias, filho de Amarias, filho de Sefatias, filho de Maalalel, dos filhos de Perez.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos de Judá” e “filhos de Benjamim” designam membros ou descendentes dessas linhagens tribais.
    reason: cultural_note
  - marker: b
    text: A expressão “dos filhos de Perez” identifica a linhagem à qual pertencia Ataías.
    reason: clarity_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: Em Jerusalém
  rationale: A conjunção hebraica dá continuidade ao contexto, mas em português a ligação já é natural sem um “e” inicial; a localização é mantida em destaque.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: O verbo ישב pode significar sentar-se, habitar ou residir; “moravam” expressa de modo corrente o sentido residencial neste contexto de lista populacional.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: alguns dos filhos de Judá e alguns dos filhos de Benjamim
  rationale: A preposição מן tem valor partitivo, indicando integrantes desses grupos; “filhos” conserva a linguagem genealógica e tribal do hebraico.
- source_word: מִבְּנֵי יְהוּדָה
  choice: 'Dos filhos de Judá:'
  rationale: A segunda ocorrência introduz os nomes da linhagem de Judá e funciona naturalmente como cabeçalho de lista.
- source_word: עֲתָיָה
  choice: Ataías
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Preserva a formulação genealógica direta do hebraico, sem decidir se a genealogia omite gerações.
- source_word: עֻזִּיָּה
  choice: Uzias
  rationale: Forma portuguesa tradicional do nome.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma portuguesa tradicional e amplamente reconhecida.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Transliteração adaptada à forma usual em português.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Forma portuguesa legível e próxima do nome hebraico.
- source_word: פָרֶץ
  choice: Perez
  rationale: Forma portuguesa bíblica corrente, próxima do hebraico.
