base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: pt
  text: Os líderes do povo moravam em Jerusalém, e o restante do povo lançou sortes para trazer uma pessoa em cada dez para morar em Jerusalém, a cidade santa, enquanto as outras nove partes[a] ficaram nas demais cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e nove mãos nas cidades”; trata-se de uma expressão que indica as nove partes restantes de um total de dez.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: os líderes do povo
  rationale: שָׂרִים designa chefes, governantes ou autoridades. “Líderes” é claro, atual e adequado ao contexto, sem o sentido monárquico que “príncipes” poderia sugerir.
- source_word: וַיֵּשְׁבוּ
  choice: moravam
  rationale: O verbo ישׁב indica aqui residência habitual, não o ato de sentar-se. “Moravam” expressa naturalmente esse sentido.
- source_word: וּשְׁאָר הָעָם
  choice: e o restante do povo
  rationale: שְׁאָר significa o restante ou remanescente; a formulação preserva de modo natural a referência à população não residente em Jerusalém.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: lançou sortes
  rationale: A expressão idiomática hebraica descreve a seleção por sorteio. A concordância no singular segue o núcleo coletivo “o restante do povo” em português.
- source_word: לְהָבִיא
  choice: para trazer
  rationale: O infinitivo hifil de בוא significa fazer vir ou trazer. “Trazer” mantém a direção do movimento para Jerusalém.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: uma pessoa em cada dez
  rationale: A expressão estabelece uma proporção distributiva. A inclusão de “pessoa” torna explícito em português o referente humano implícito no numeral hebraico.
- source_word: לָשֶׁבֶת
  choice: para morar
  rationale: ישׁב tem novamente o sentido de residir; “morar” é corrente e não acrescenta a ideia de fundar um novo assentamento.
- source_word: עִיר הַקֹּדֶשׁ
  choice: a cidade santa
  rationale: Tradução direta e consagrada da construção hebraica, em aposição a Jerusalém.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: enquanto as outras nove partes ficaram
  rationale: Literalmente, “e nove mãos/partes”. “As outras nove partes” preserva a imagem proporcional do hebraico; “enquanto” explicita a relação contrastiva natural no contexto.
- source_word: בֶּעָרִים
  choice: nas demais cidades
  rationale: עָרִים pode designar cidades ou povoações. “Demais cidades” cria o contraste correto com Jerusalém sem pressupor o tamanho exato desses núcleos.
theological_decisions: []
