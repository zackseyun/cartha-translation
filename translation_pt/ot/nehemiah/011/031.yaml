    reason: alternative_reading
  revision_rationale: A revisão elimina o «até» sem apoio no texto-fonte, conserva a noção de ponto inicial ligada a Geba e ajusta a forma do nome Aia. A nota mantém de maneira não dogmática a alternativa «Ai» e a incerteza de identificação.
