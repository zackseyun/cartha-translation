  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: pt
  text: E os filhos de Benjamim moravam, a partir de Geba, em Micmás, Aia[a], Betel e os povoados que lhe pertenciam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ai”. A forma hebraica aqui é עַיָּה (Aia), que pode designar o mesmo lugar ou refletir um topônimo estreitamente relacionado na tradição de tradução.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: E os filhos de Benjamim
  rationale: Preserva a forma hebraica e a identidade tribal; no contexto, refere-se aos membros ou descendentes da tribo de Benjamim.
- source_word: מִגָּבַע
  choice: moravam desde Geba
  rationale: A preposição מִן indica aqui o ponto inicial da distribuição geográfica. O verbo “moravam” é suprido a partir do contexto da lista de assentamentos, e “desde” conserva a relação com a continuação da lista.
- source_word: מִכְמָשׂ
  choice: Micmás
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: וְעַיָּה
  choice: Aías
  rationale: Representa em forma portuguesa o topônimo hebraico עַיָּה; a possível identificação ou tradução como Ai é mantida em nota.
- source_word: וּבֵית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: וּבְנֹתֶיהָ
  choice: e os povoados que lhe pertenciam
  rationale: Literalmente “e suas filhas”, expressão idiomática para assentamentos menores dependentes de uma cidade principal. A formulação explicita essa relação em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém a imagem tribal “filhos de Benjamim”, mas traduz idiomaticamente “filhas” como povoados dependentes. O verbo elíptico foi suprido conforme o contexto de assentamento do capítulo.
