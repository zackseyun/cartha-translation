base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: pt
  text: Zanoa, Adulão e seus povoados, Laquis e seus campos, Azeca e suas cidades dependentes[a]. E acamparam[b] desde Berseba até o vale de Hinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas cidades-filhas”; isto é, seus povoados ou suas cidades dependentes.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “montaram acampamento” ou, neste contexto, “estabeleceram-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoa
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico hebraico.
- source_word: עֲדֻלָּם
  choice: Adulão
  rationale: Forma portuguesa corrente do topônimo bíblico.
- source_word: חַצְרֵיהֶם
  choice: seus povoados
  rationale: Neste catálogo geográfico, חָצֵר designa assentamentos rurais vinculados às localidades principais; “povoados” é natural e evita o sentido inadequado de “pátios”.
- source_word: לָכִישׁ
  choice: Laquis
  rationale: Forma portuguesa tradicional do topônimo.
- source_word: שְׂדֹתֶיהָ
  choice: seus campos
  rationale: Preserva o sentido concreto de שָׂדֶה e indica as terras agrícolas pertencentes a Laquis.
- source_word: עֲזֵקָה
  choice: Azeca
  rationale: Forma portuguesa tradicional do topônimo.
- source_word: בְנֹתֶיהָ
  choice: suas cidades dependentes
  rationale: Comunica em português atual o idioma hebraico literal “suas filhas”, isto é, localidades subordinadas a uma cidade principal, sem tornar obscura a relação geográfica.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Mantém o sentido lexical básico de חנה; no contexto do repovoamento, o verbo também pode indicar que passaram a residir na região.
- source_word: מִבְּאֵר שֶׁבַע
  choice: desde Berseba
  rationale: “Desde” introduz naturalmente o ponto inicial da extensão geográfica; “Berseba” é a forma portuguesa tradicional do nome.
- source_word: עַד
  choice: até
  rationale: Expressa com clareza o limite final da extensão geográfica.
- source_word: גֵּיא הִנֹּם
  choice: o vale de Hinom
  rationale: Tradução transparente da construção hebraica e forma reconhecível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de topônimos bíblicos correntes no uso lusófono e boa legibilidade brasileira. A metáfora hebraica “cidades-filhas” foi explicitada no texto e preservada em nota; a possível extensão contextual de חנה, de “acampar” a “estabelecer-se”, permanece aberta na nota.
