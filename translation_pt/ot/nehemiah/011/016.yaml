base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: pt
  text: E Sabetai e Jozabade, dentre os chefes dos levitas, estavam encarregados do trabalho externo da casa de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o trabalho de fora para a casa de Deus”. A expressão hebraica pode indicar o trabalho realizado fora do templo propriamente dito, em contraste com as tarefas internas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: E Sabetai e Jozabade
  rationale: Os nomes próprios são transliterados em formas correntes e legíveis em português; a conjunção inicial preserva a continuidade da lista.
- source_word: עַל
  choice: estavam encarregados de
  rationale: Neste contexto administrativo, a preposição indica responsabilidade ou supervisão; esta formulação é natural em português.
- source_word: הַמְּלָאכָה
  choice: o trabalho
  rationale: Mantém o sentido amplo de tarefa ou atividade sem especificar além do hebraico.
- source_word: הַחִיצֹנָה
  choice: externo
  rationale: Reproduz o sentido de algo exterior ou de fora e preserva a possível contraposição às tarefas realizadas no interior do templo.
- source_word: לְבֵית הָאֱלֹהִים
  choice: da casa de Deus
  rationale: Expressa a relação do trabalho com o templo, sem decidir rigidamente entre trabalho pertencente à casa e trabalho feito em benefício dela.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: dentre os chefes dos levitas
  rationale: Preserva a ideia de que os dois pertenciam ao grupo dirigente dos levitas e verte naturalmente a preposição מִן.
