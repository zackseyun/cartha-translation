  text: Os servidores do templo[a] moravam no Ofel, e Ziá e Gispa eram responsáveis por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico נְתִינִים (netinim), termo técnico para um grupo incumbido do serviço do templo.
