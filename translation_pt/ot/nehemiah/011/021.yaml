lexical_decisions:
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: O termo técnico pós-exílico נְתִינִים designa um grupo incumbido do serviço ligado ao templo. A tradução funcional é clara em português e preserva seu caráter institucional.
- source_word: יֹשְׁבִים
  choice: moravam
  rationale: O particípio de ישב expressa residência contínua; “moravam” é natural em português moderno e adequado ao contexto narrativo.
- source_word: בָּעֹפֶל
  choice: no Ofel
  rationale: עֹפֶל funciona aqui como topônimo ou designação topográfica. “No Ofel” mantém o nome tradicional e verte de modo idiomático a preposição com artigo.
- source_word: צִיחָא
  choice: Ziá
  rationale: Transliteração do nome próprio segundo convenções naturais em português.
- source_word: גִשְׁפָּא
  choice: Gispa
  rationale: Transliteração do nome próprio segundo convenções naturais em português.
- source_word: עַל הַנְּתִינִים
  choice: eram responsáveis por eles
  rationale: Neste contexto administrativo, עַל indica autoridade ou supervisão. A formulação comunica essa função com naturalidade, e o pronome evita uma repetição pesada.
