  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: pt
  text: em Hazar-Sual, em Berseba e nos seus povoados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e nas suas filhas”, expressão usada para os povoados ou assentamentos que dependiam de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: em Hazar-Sual
  rationale: A preposição בְּ é vertida por “em”; o וּ conjuntivo não precisa ser repetido em português no início deste fragmento de uma lista. O topônimo é transliterado, em vez de receber a tradução etimológica “Aldeia da Raposa”.
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: em Berseba
  rationale: O topônimo tradicional e amplamente reconhecível em português é “Berseba”. A coordenação da lista é expressa naturalmente por vírgula, sem repetir “e” antes de cada item.
- source_word: וּ/בְנֹתֶיהָ
  choice: e nos povoados que dependiam dela
  rationale: Embora בָּנוֹת signifique literalmente “filhas”, aqui designa assentamentos subordinados a uma cidade. “Povoados que dependiam dela” comunica tanto o caráter geográfico quanto a relação de dependência; “dela” retoma Berseba.
