lexical_decisions:
- source_word: וּ/בְ
  choice: e em / em
  rationale: A combinação da conjunção ו com a preposição ב indica continuação da lista e localização. O primeiro caso foi traduzido por “e em” para ligar o versículo ao anterior; nos seguintes, a coordenação natural do português evita repetição pesada sem perder o sentido locativo.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Nome próprio de lugar, transliterado em forma corrente e inteligível em português.
- source_word: מוֹלָדָה
  choice: Moladá
  rationale: Topônimo transliterado, com acento gráfico para indicar a tonicidade natural em português.
- source_word: בֵית פָּלֶט
  choice: Bete-Pelete
  rationale: Topônimo composto transliterado segundo formas usuais em português. O hífen sinaliza que se trata de um único nome de lugar, sem traduzir indevidamente seus componentes.
