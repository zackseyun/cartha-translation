base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: pt
  text: 'E estes eram os filhos de Benjamim[a]: Salu, filho de Mesulão, filho de Joede[b], filho de Pedaías, filho de Colaías, filho de Maaseias, filho de Itiel, filho de Jesaías.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida de modo mais amplo como «descendentes de Benjamim» ou «benjamitas».
    reason: lexical_alternative
  - marker: b
    text: Aqui, o Texto Massorético traz «Joede». Na genealogia paralela de 1 Crônicas 9:7, consta «Hodavias».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A fórmula introduz uma nova parte da lista. O presente é natural em português para a apresentação de uma relação genealógica; a conjunção hebraica não precisa ser reproduzida mecanicamente.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Preserva a forma literal e a ênfase genealógica do hebraico, embora a expressão possa designar de modo mais amplo os descendentes ou membros da tribo de Benjamim.
- source_word: בֶּן
  choice: filho de
  rationale: É a expressão genealógica normal e transparente neste encadeamento; não há necessidade de generalizá-la como «descendente de» no texto principal.
- source_word: סַלֻּא
  choice: Salu
  rationale: Transliteração portuguesa clara do nome hebraico.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: יוֹעֵד
  choice: Joede
  rationale: Representa a leitura do Texto Massorético neste versículo sem harmonizá-la com a genealogia paralela.
- source_word: פְּדָיָה
  choice: Pedaías
  rationale: Forma portuguesa consagrada, próxima da vocalização hebraica.
- source_word: קוֹלָיָה
  choice: Colaías
  rationale: Transliteração portuguesa que representa adequadamente a forma hebraica.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Forma portuguesa reconhecível e próxima da vocalização do nome hebraico.
- source_word: אִיתִיאֵל
  choice: Itiel
  rationale: Transliteração direta e natural em português.
- source_word: יְשַׁעְיָה
  choice: Jesaías
  rationale: Transliteração portuguesa que mantém o nome distinguível de Isaías, embora sejam formas relacionadas.
