base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: pt
  text: Quanto aos povoados em seus campos, alguns dos filhos de Judá moravam em Quiriate-Arba e seus povoados dependentes[a][b], em Dibom e seus povoados dependentes[b], e em Jecabzeel[c] e seus assentamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quiriate-Arba é o nome antigo de Hebrom; veja Josué 14:15.
    reason: cross_reference
  - marker: b
    text: 'Hebraico: “suas filhas”, expressão que designa os povoados dependentes ou circunvizinhos de uma cidade.'
    reason: lexical_alternative
  - marker: c
    text: Em algumas tradições e passagens relacionadas, Jecabzeel também aparece como “Cabzeel”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Quanto aos povoados em seus campos
  rationale: A construção introduz uma nova categoria na lista; «quanto aos» expressa essa mudança de tópico. Neste contexto geográfico, חֲצֵרִים designa pequenas povoações rurais, e בִּשְׂדֹתָם conserva a referência às terras agrícolas.
- source_word: מִבְּנֵי יְהוּדָה
  choice: alguns dos filhos de Judá
  rationale: O מִן tem sentido partitivo, explicitado por «alguns dos». «Filhos de Judá» preserva a designação tribal hebraica.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: Forma natural em português moderno para indicar residência, sem sugerir necessariamente o ato inicial de colonização.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: em Quiriate-Arba
  rationale: O topônimo é transliterado; sua identificação com Hebrom fica em nota, pois não aparece explicitamente no versículo.
- source_word: וּבְנֹתֶיהָ
  choice: nos povoados ao redor dela
  rationale: Literalmente «suas filhas», idioma geográfico que indica povoações dependentes ou circunvizinhas de uma cidade. A tradução comunica o sentido com naturalidade, enquanto a metáfora é registrada em nota.
- source_word: וּבְדִיבוֹן
  choice: em Dibom
  rationale: Transliteração portuguesa do topônimo.
- source_word: וּבִיקַּבְצְאֵל
  choice: em Jecabzeel
  rationale: A forma do texto massorético sustenta Jecabzeel; a variante abreviada Cabzeel é preservada em nota.
- source_word: וַחֲצֵרֶיהָ
  choice: e seus assentamentos
  rationale: Neste contexto, חֲצֵרִים indica pequenas localidades dependentes. «Assentamentos» distingue o termo da expressão idiomática anterior, בנותיה.
theological_decisions:
- issue: Designação tribal marcada por gênero em מִבְּנֵי יְהוּדָה
  choice: alguns dos filhos de Judá
  alternative: algumas pessoas de Judá
  rationale: A formulação preserva a expressão tribal do hebraico sem inferir que somente homens residiam nesses lugares.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com grafia de topônimos adequada à leitura brasileira. A estrutura de lista e a designação tribal do hebraico foram preservadas sem sacrificar a naturalidade.
