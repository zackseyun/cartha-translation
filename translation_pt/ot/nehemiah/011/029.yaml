lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: e em En-Rimom
  rationale: Os prefixos וּבְ são traduzidos por “e em”. O topônimo é transliterado segundo formas reconhecíveis em português, preservando seus dois elementos com hífen.
- source_word: וּ/בְ/צָרְעָה
  choice: em Zorá
  rationale: O nome geográfico é transliterado na forma tradicional portuguesa “Zorá”. Para uma enumeração natural em português, a conjunção hebraica repetida não é reproduzida neste ponto, mas a preposição “em” é mantida.
- source_word: וּ/בְ/יַרְמוּת
  choice: e em Jarmute
  rationale: O topônimo é transliterado como “Jarmute”, forma adequada à fonologia e à tradição gráfica portuguesa; a conjunção e a preposição hebraicas são expressas por “e em”.
theological_decisions: []
translation_notes:
  register: Tradução concisa e digna de uma lista de localidades. A repetição hebraica de “e em” foi suavizada para produzir uma enumeração natural em português, sem alterar o sentido.
