base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: pt
  text: e seus irmãos, chefes de casas paternas[a], 242; e Amassai[b], filho de Azarel, filho de Azai, filho de Mesilemote, filho de Imer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de clãs familiares”. A expressão hebraica refere-se aos chefes de casas paternas, isto é, grupos de descendência.
    reason: lexical_alternative
  - marker: b
    text: O nome também pode ser transliterado como “Amasai”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o sentido direto de אָח no plural; no contexto sacerdotal e genealógico, pode abranger parentes ou membros do mesmo grupo, sem exigir essa ampliação no texto principal.
- source_word: רָאשִׁים לְאָבוֹת
  choice: chefes de famílias ancestrais
  rationale: Expressa de modo natural a função de liderança dentro das casas paternas ou clãs, preservando a estrutura familiar indicada pelo hebraico.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: '242'
  rationale: Representa exatamente o numeral hebraico e favorece a leitura de uma lista administrativa.
- source_word: וַעֲמַשְׁסַי
  choice: e Amassai
  rationale: Translitera a forma massorética específica עֲמַשְׁסַי, conservando o som de שׁ por “ss” em português.
- source_word: בֶּן
  choice: filho de
  rationale: É a tradução normal da fórmula genealógica repetida; embora possa ocasionalmente indicar descendência mais remota, o texto não exige explicitação nesse sentido.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Transliteração portuguesa clara do nome hebraico.
- source_word: אַחְזַי
  choice: Azai
  rationale: Transliteração adaptada à leitura portuguesa, representando o som consonantal hebraico sem inserir uma sílaba adicional.
- source_word: מְשִׁלֵּמוֹת
  choice: Mesilemote
  rationale: Transliteração legível em português da forma hebraica vocalizada neste versículo.
- source_word: אִמֵּר
  choice: Imer
  rationale: Transliteração direta e natural em português do nome hebraico e da família sacerdotal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com formas de nomes adaptadas à leitura lusófona. A estrutura concisa e enumerativa do registro genealógico foi preservada; “famílias ancestrais” comunica a realidade social das casas paternas sem recorrer a uma formulação excessivamente literal.
