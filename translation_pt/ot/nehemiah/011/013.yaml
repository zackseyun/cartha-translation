  terminology: “Irmãos”, “filho de” e as formas portuguesas dos nomes são adequados. “Amassai” representa legitimamente a forma massorética; “Amasai” pode ser mantido como variante em nota. “Azai” e “Mesilemote” são formas portuguesas legíveis e estabelecidas.
