- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: duzentos e oitenta e quatro
  rationale: A sequência cardinal fornece o total de 284; o verbo “eram” é acrescentado para formar uma oração natural em português, pois o hebraico não apresenta verbo expresso.
