base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: pt
  text: E seus irmãos, homens valentes, eram cento e vinte e oito; e o encarregado deles era Zabdiel, filho de Hagedolim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filho dos grandes” ou “filho dos nobres”. O hebraico pode ser uma expressão descritiva, e não um nome próprio.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: E seus irmãos
  rationale: Traduz literalmente אֲחֵיהֶם e mantém a referência masculina; neste contexto de lista, designa os demais homens ligados ao mesmo grupo.
- source_word: גִּבּוֹרֵי חַיִל
  choice: homens valentes
  rationale: Expressa força, coragem e capacidade, inclusive com possível nuance militar, em linguagem portuguesa natural e digna.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: cento e vinte e oito
  rationale: Representação direta e idiomática do número 128 em português.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: e o encarregado deles era
  rationale: פָקִיד indica alguém designado para exercer supervisão ou autoridade; “encarregado” preserva o caráter administrativo sem impor um cargo militar específico.
- source_word: זַבְדִּיאֵל
  choice: Zabdiel
  rationale: Transliteração tradicional e reconhecível do nome pessoal hebraico.
- source_word: בֶּן הַגְּדוֹלִים
  choice: filho de Hagedolim
  rationale: Mantém הַגְּדוֹלִים como possível nome de família ou clã, sem eliminar a possibilidade de que seja uma expressão descritiva, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva o caráter conciso de uma lista administrativa e mantém em nota a ambiguidade de הַגְּדוֹלִים.
