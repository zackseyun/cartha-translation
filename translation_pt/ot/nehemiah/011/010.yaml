lexical_decisions:
- source_word: מִן הַכֹּהֲנִים
  choice: 'Dos sacerdotes:'
  rationale: Reproduz a expressão introdutória da lista e usa dois-pontos em português para apresentar os nomes que seguem.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶן יוֹיָרִיב
  choice: filho de Joiaribe
  rationale: Traduz literalmente a relação filial expressa por בֶן e adapta o nome à forma portuguesa.
- source_word: יָכִין
  choice: Jaquim
  rationale: Forma portuguesa tradicional e foneticamente adequada do nome hebraico Yakhin.
theological_decisions:
- issue: Relação sintática de Jaquim com Jedaías e Joiaribe
  choice: Tratar Jaquim como outro sacerdote da lista, coordenado com Jedaías.
  alternative: Entender “Jedaías, filho de Joiaribe, filho de Jaquim” ou ligar Jaquim genealogicamente ao nome anterior.
  rationale: O texto massorético não apresenta בֶן antes de יָכִין, e a leitura mais direta é a enumeração de outro nome; a conjunção “e” torna essa estrutura natural em português sem acrescentar relação genealógica.
translation_notes:
  register: Português moderno, claro e digno, com grafia de nomes reconhecível para leitores brasileiros. A pontuação explicita a estrutura de lista sem alterar o conteúdo.
