base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: pt
  text: E o povo abençoou todos os homens que se ofereceram voluntariamente para morar em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se voluntariaram para morar em Jerusalém”.'
    reason: Alternativa lexical para הַמִּתְנַדְּבִים, exprimindo de modo mais conciso a mesma disposição voluntária.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: abençoou
  rationale: O piel de ברך significa normalmente “abençoar”. O singular concorda em português com o coletivo “o povo” e preserva a ideia de que o povo invocou bênção ou expressou aprovação, sem reduzi-la simplesmente a elogio.
- source_word: הָעָם
  choice: o povo
  rationale: עם é o termo coletivo comum para “povo”; esta tradução é natural e próxima da forma hebraica.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: todos os homens
  rationale: אֲנָשִׁים é uma forma masculina e, neste contexto, refere-se aos homens que aceitaram residir em Jerusalém; a tradução mantém essa especificidade.
- source_word: הַמִּתְנַדְּבִים
  choice: que se ofereceram voluntariamente
  rationale: O hitpael de נדב comunica disposição voluntária e conserva uma nuance reflexiva; a formulação é clara, digna e mais expressiva que apenas “se voluntariaram”.
- source_word: לָשֶׁבֶת
  choice: para morar
  rationale: ישב pode significar sentar-se, habitar ou permanecer. No contexto de fixar residência em Jerusalém, “morar” é português moderno e natural.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa padrão do nome da cidade.
theological_decisions:
- issue: Representação de gênero em הָאֲנָשִׁים
  choice: todos os homens
  alternative: todos / todas as pessoas
  rationale: O texto hebraico emprega o substantivo masculino אֲנָשִׁים, não o coletivo genérico הָעָם usado anteriormente. A tradução preserva essa distinção sem ampliar silenciosamente a referência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Morar” evita o tom arcaizante de “habitar”, enquanto “se ofereceram voluntariamente” preserva a nuance reflexiva e voluntária do hebraico. O marcador [a] aparece no texto principal.
