source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: pt
  text: 'Estes são os chefes da província que moravam em Jerusalém. Nas cidades de Judá, porém, cada um morava em sua propriedade, nas respectivas cidades: Israel[a], os sacerdotes, os levitas, os servidores do templo[b] e os descendentes dos servos de Salomão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico traz simplesmente “Israel”, provavelmente como designação coletiva nesta lista.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os netinins”, uma classe designada para o serviço do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: os chefes da província
  rationale: Preserva a expressão hebraica para as principais autoridades e o sentido administrativo persa de מְדִינָה, sem sugerir um Estado moderno.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: que moravam em Jerusalém
  rationale: יָשַׁב, neste contexto de distribuição populacional, indica residência estabelecida; “moravam” é natural e claro.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: Nas cidades de Judá, porém, ... morava
  rationale: “Porém” explicita a mudança contrastiva de Jerusalém para as demais cidades de Judá sem acrescentar conteúdo temporal.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o valor distributivo do singular hebraico e soa mais natural em português neste enunciado coletivo.
- source_word: בַּאֲחֻזָּתוֹ
  choice: em sua propriedade
  rationale: אֲחֻזָּה designa uma posse territorial ou propriedade hereditária; a formulação conserva o sentido concreto sem impor “herança”.
- source_word: בְּעָרֵיהֶם
  choice: nas cidades deles
  rationale: Mantém o pronome plural do hebraico e a referência às respectivas cidades dos grupos enumerados, apesar da leve redundância presente no original.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Conserva o substantivo hebraico sem artigo, provavelmente empregado coletivamente na lista, deixando a alternativa interpretativa para a nota.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português convencional e preciso.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente português convencional e preciso.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: Traduz a função dessa classe vinculada ao serviço do templo, sendo mais compreensível que uma simples transliteração.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: os descendentes dos servos de Salomão
  rationale: בְּנֵי designa aqui um grupo de linhagem; “descendentes” comunica melhor esse valor coletivo que “filhos”.
