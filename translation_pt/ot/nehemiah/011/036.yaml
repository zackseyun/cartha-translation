base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: pt
  text: E, dentre os levitas, algumas divisões de Judá estavam ligadas a Benjamim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, dentre os levitas, divisões de Judá eram para Benjamim”. O hebraico é muito condensado, e a relação exata entre “Judá” e “Benjamim” fica subentendida.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: E dos
  rationale: Preserva a conjunção e a preposição, ligando esta nota final ao contexto anterior e indicando procedência ou pertencimento sem definir excessivamente a relação.
- source_word: הַלְוִיִּם
  choice: levitas
  rationale: 'Tradução direta do substantivo; o artigo é naturalmente contraído com a preposição em português: “dos levitas”.'
- source_word: מַחְלְקוֹת
  choice: algumas divisões
  rationale: “Divisões” conserva o sentido de grupos organizados. “Algumas” explicita com naturalidade o valor partitivo sugerido por “dos levitas”, sem pretender identificar todos os levitas.
- source_word: יְהוּדָה
  choice: de Judá
  rationale: Mantém a relação nominal comprimida do hebraico e evita decidir no texto principal se Judá indica origem, território ou vínculo administrativo.
- source_word: לְבִנְיָמִין
  choice: ficaram ligadas a Benjamim
  rationale: Expressa uma relação ou vinculação indicada por לְ, mas evita a força excessivamente específica de “foram designadas” ou a ideia de posse estrita em “pertenciam”.
