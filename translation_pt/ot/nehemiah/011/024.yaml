reference: Nehemiah 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/פְתַֽחְיָ֨ה בֶּן מְשֵֽׁיזַבְאֵ֜ל מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙ לְ/יַ֣ד הַ/מֶּ֔לֶךְ לְ/כָל דָּבָ֖ר לָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: pt
  text: E Petaías, filho de Mesezabel, dos descendentes de Zerá, filho de Judá, estava ao lado do rei[a] em todos os assuntos relativos ao povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era o representante do rei”. O hebraico diz literalmente “estava à mão do rei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em favor do povo”. O hebraico pode indicar assuntos relativos ao povo ou tratados em nome dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: E Petaías
  rationale: A conjunção mantém a ligação com a lista administrativa do contexto; o nome segue forma portuguesa corrente.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: filho de Mesezabel
  rationale: Preserva diretamente a construção genealógica hebraica.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: dos descendentes de Zerá, filho de Judá
  rationale: “Descendentes” comunica naturalmente o sentido de linhagem de בְּנֵי neste contexto, enquanto a vírgula deixa clara a cadeia genealógica.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: estava ao lado do rei
  rationale: Expressão portuguesa natural que preserva a imagem concreta do hebraico, literalmente “à mão do rei”, sem definir indevidamente se o papel era de assessor, representante ou agente real.
- source_word: לְ/כָל דָּבָר
  choice: em todos os assuntos
  rationale: דָּבָר designa aqui assuntos ou questões administrativas; o plural idiomático em português transmite a abrangência de כָּל.
- source_word: לָ/עָם
  choice: relativos ao povo
  rationale: Mantém a relação ampla entre os assuntos e o povo, sem restringir o sentido a ações necessariamente realizadas em benefício dele.
