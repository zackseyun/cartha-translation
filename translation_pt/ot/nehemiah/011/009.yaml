base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: pt
  text: Joel, filho de Zicri, era o encarregado deles, e Judá, filho de Hassenuá, era o segundo em autoridade sobre a cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era o adjunto responsável pela cidade” ou “era o segundo no comando da cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  choice: encarregado
  rationale: O substantivo designa alguém nomeado para exercer supervisão ou administração. “Encarregado” é natural em português moderno e evita especificar indevidamente um cargo militar ou régio.
- source_word: עֲלֵיהֶם
  choice: deles
  rationale: A preposição עַל com o sufixo indica autoridade ou supervisão. Ligada a “encarregado”, a forma “deles” expressa com naturalidade que Joel estava à frente do grupo mencionado anteriormente.
- source_word: מִשְׁנֶה
  choice: segundo responsável
  rationale: O termo pode designar alguém de segundo escalão ou um adjunto. “Segundo responsável” preserva a ideia de posição subordinada sem definir com excessiva precisão a estrutura administrativa.
- source_word: עַל הָעִיר
  choice: pela cidade
  rationale: Neste contexto administrativo, עַל indica jurisdição ou responsabilidade. Em português, “responsável pela cidade” comunica essa relação de modo claro e idiomático.
- source_word: הַסְּנוּאָה
  choice: Hassenuá
  rationale: O nome próprio é transliterado. “Hassenuá” representa a forma hebraica com o artigo incorporado e acentuação adequada à leitura em português.
- source_word: וְ
  choice: e
  rationale: A conjunção coordena as duas declarações do versículo e mantém sua ligação com a lista precedente.
