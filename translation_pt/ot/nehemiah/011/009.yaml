  terminology: “Encarregado” representa adequadamente פָּקִיד sem impor um título técnico. “Hassenuá” é uma transliteração aceitável do nome. A revisão de “segundo responsável” para “segundo em autoridade” representa melhor מִשְׁנֶה, sem decidir entre “adjunto” e “segundo no comando”.
