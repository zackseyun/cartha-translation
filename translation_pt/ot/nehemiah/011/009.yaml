  source_fidelity: A tradução transmite corretamente Joel como oficial nomeado com autoridade sobre o grupo mencionado e Judá como ocupante de posição subordinada de segundo escalão em relação à cidade. A formulação proposta para a segunda função torna mais explícita, em português, a noção de hierarquia presente em מִשְׁנֶה.
