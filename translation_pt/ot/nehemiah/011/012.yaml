base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: pt
  text: E seus irmãos, que realizavam o trabalho para a casa[a], eram oitocentos e vinte e dois; e Adaías, filho de Jeroão, filho de Pelalias, filho de Anzi, filho de Zacarias, filho de Pasur, filho de Malquias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que trabalhavam para o templo”. O hebraico diz literalmente “os que realizavam o trabalho para a casa”; neste contexto, “a casa” se refere ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: E seus irmãos
  rationale: Preserva o termo hebraico de parentesco; no contexto, refere-se aos demais integrantes do grupo sacerdotal, mas o versículo não diz explicitamente “sacerdotes”.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: que realizavam o trabalho
  rationale: Reproduz naturalmente em português a construção participial hebraica sem reduzir seu sentido ao substantivo genérico “trabalhadores”.
- source_word: לַבַּיִת
  choice: para a Casa
  rationale: Mantém o sentido básico de בַּיִת, ao passo que a inicial maiúscula sinaliza com discrição a referência contextual ao templo; a nota registra a formulação interpretativa possível.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: oitocentos e vinte e dois
  rationale: Representação cardinal direta e idiomática em português.
- source_word: וַעֲדָיָה
  choice: Havia também Adaías
  rationale: Expressa com naturalidade a continuação da lista marcada pela conjunção hebraica, evitando uma sequência portuguesa abrupta depois da declaração numérica.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém a fórmula genealógica convencional, sem convertê-la em “descendente de”, embora genealogias hebraicas possam omitir gerações.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Jeroão / Pelalias / Anzi / Zacarias / Pasur / Malquias
  rationale: Emprega formas portuguesas reconhecíveis dos nomes próprios, com acentuação e grafia adequadas à leitura moderna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e reconhecíveis dos nomes bíblicos. “Casa” conserva a metáfora hebraica para o templo, enquanto a nota esclarece a referência contextual. A pontuação divide o censo e o início da genealogia para facilitar a leitura.
