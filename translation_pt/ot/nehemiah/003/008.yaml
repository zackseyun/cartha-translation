  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: pt
  text: Ao lado dele, Uziel, filho de Haraías, um dos ourives, fez reparos. Ao lado dele, Hananias, um dos fabricantes de perfumes, fez reparos. Eles restauraram Jerusalém até a Muralha Larga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles deixaram Jerusalém até a Muralha Larga”. O verbo hebraico geralmente significa “deixar” ou “abandonar”, mas, neste contexto de reconstrução, é frequentemente entendido como “restaurar” ou “reparar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: Ao lado dele
  rationale: No contexto sequencial de Neemias 3, a expressão idiomática indica que a pessoa trabalhou junto ao trecho ou trabalhador anteriormente mencionado.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Embora o verbo tenha o sentido básico de fortalecer ou segurar firmemente, neste capítulo ele descreve de modo idiomático a participação no conserto da muralha.
- source_word: צֹרְפִים
  choice: um dos ourives
  rationale: O plural designa o grupo profissional ao qual Uziel pertencia; “ourives” é claro e natural em português.
- source_word: הָרַקָּחִים
  choice: um dos perfumistas
  rationale: O termo designa fabricantes de perfumes e preparados aromáticos; “perfumistas” comunica a profissão sem o tom arcaico ou potencialmente enganoso de “boticários”.
- source_word: וַיַּעַזְבוּ
  choice: Eles restauraram
  rationale: O verbo normalmente significa “deixar” ou “abandonar”, mas vários intérpretes e versões entendem aqui um uso contextual ligado à restauração das defesas de Jerusalém. A incerteza lexical é preservada em nota.
- source_word: יְרוּשָׁלַםִ
  choice: Jerusalém
  rationale: Mantém-se o objeto expresso no hebraico, provavelmente uma metonímia para as fortificações da cidade, sem acrescentar “muralha” ao texto principal.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: até a Muralha Larga
  rationale: A expressão parece nomear uma estrutura conhecida das fortificações de Jerusalém; as maiúsculas sinalizam essa função de designação.
