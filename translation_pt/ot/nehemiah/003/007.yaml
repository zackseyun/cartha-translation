translation_notes:
  register: Português moderno, digno e amplamente compreensível, com nomes e gentílicos em formas usuais. A formulação mantém a ambiguidade administrativa e espacial de לְכִסֵּא na nota, sem introduzir uma extensão espacial que o texto não declara claramente.
