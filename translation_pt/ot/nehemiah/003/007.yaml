base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: pt
  text: Ao lado deles, Melatias, o gibeonita, e Jadon, o meronotita, fizeram reparos, juntamente com os homens de Gibeom e de Mispá, para a sede do governador da província Além do Rio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para o assento do governador de Além do Rio”. A expressão pode referir-se à sede ou residência oficial do governador ou, menos provavelmente, à sua autoridade jurisdicional naquele distrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Ao lado deles
  rationale: A expressão idiomática indica adjacência na sequência das equipes de construção em Neemias 3.
- source_word: הֶחֱזִיק
  choice: fizeram reparos
  rationale: Neste capítulo, o verbo descreve a participação no conserto ou reconstrução da muralha.
- source_word: מְלַטְיָה
  choice: Melatias
  rationale: Transliteração tradicional e inteligível do nome hebraico em português.
- source_word: הַגִּבְעֹנִי
  choice: o gibeonita
  rationale: Reproduz o gentílico que identifica Melatias com Gibeom.
- source_word: וְיָדוֹן
  choice: e Jadon
  rationale: Translitera o nome pessoal e conserva a conjunção.
- source_word: הַמֵּרֹנֹתִי
  choice: o meronotita
  rationale: Reproduz em português o gentílico hebraico.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: juntamente com os homens de Gibeom e de Mispá
  rationale: Identifica os grupos vinculados às duas localidades e deixa natural sua participação conjunta na obra.
- source_word: לְכִסֵּא
  choice: para a sede
  rationale: כִּסֵּא significa literalmente assento ou trono; no contexto administrativo, 'sede' comunica bem a provável referência oficial, enquanto a nota preserva a ambiguidade da preposição e do substantivo.
- source_word: פַּחַת
  choice: do governador
  rationale: Equivalente moderno e claro do título administrativo do período persa.
- source_word: עֵבֶר הַנָּהָר
  choice: da província Além do Rio
  rationale: Trata-se da designação administrativa persa para a região a oeste do Eufrates; 'província' explicita o referente geopolítico.
