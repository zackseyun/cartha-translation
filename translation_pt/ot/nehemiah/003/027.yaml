base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: pt
  text: Depois dele, os tecoítas repararam outro trecho[a], diante da grande torre saliente, até o muro do Ofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um segundo trecho”. A expressão hebraica pode enfatizar que os tecoítas repararam uma porção adicional, além da tarefa anterior deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: No catálogo de obras de Neemias 3, a expressão assinala a sequência das frentes de trabalho e retoma o trabalhador ou grupo anterior.
- source_word: הֶחֱזִיקוּ
  choice: repararam
  rationale: Embora o verbo tenha o sentido básico de fortalecer, neste capítulo funciona como termo de reconstrução ou reparo da muralha.
- source_word: הַתְּקֹעִים
  choice: os tecoítas
  rationale: Gentílico que designa os habitantes de Tecoa; a forma portuguesa é concisa e preserva a identidade do grupo.
- source_word: מִדָּה שֵׁנִית
  choice: outro trecho
  rationale: A expressão indica uma porção adicional da obra, que era o segundo trecho assumido pelos tecoítas; a alternativa mais literal é registrada em nota.
- source_word: מִנֶּגֶד
  choice: diante de
  rationale: Indica uma posição em frente ou defronte do marco arquitetônico, sem exigir a ideia moderna de lados diametralmente opostos.
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: a grande torre saliente
  rationale: O particípio descreve arquitetonicamente uma torre que se projeta para fora; “saliente” é claro e conciso em português.
- source_word: וְעַד
  choice: até
  rationale: Marca o limite final do trecho reparado; a conjunção hebraica é naturalmente absorvida na sintaxe portuguesa.
- source_word: חוֹמַת הָעֹפֶל
  choice: o muro do Ofel
  rationale: Mantém a relação construta entre o muro e o topônimo, transliterado na forma portuguesa corrente.
