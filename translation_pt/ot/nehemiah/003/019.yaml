base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: pt
  text: Ao lado dele, Ezer, filho de Jesua, oficial de Mispá, reparou outro trecho[a], em frente à subida para o arsenal[b], na esquina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um segundo trecho”. A expressão hebraica pode destacar que Ezer reparou uma porção adicional da muralha.
    reason: lexical_alternative
  - marker: b
    text: Ou “as armas”. O hebraico pode designar o armamento ou, neste contexto, o lugar onde ele era guardado.
    reason: lexical_alternative
  - marker: c
    text: Ou “no ângulo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: reparou
  rationale: No contexto da reconstrução da muralha em Neemias 3, o verbo tem o sentido contextual de restaurar ou reparar, e não apenas de fortalecer.
- source_word: עַל יָדוֹ
  choice: Ao lado dele
  rationale: A expressão recorrente organiza a sequência dos trabalhadores segundo a posição adjacente de cada trecho da muralha.
- source_word: שַׂר הַמִּצְפָּה
  choice: oficial de Mispá
  rationale: שַׂר indica uma autoridade ou dirigente; “oficial” comunica uma função administrativa sem sugerir realeza.
- source_word: מִדָּה שֵׁנִית
  choice: outro trecho
  rationale: A expressão provavelmente designa uma porção adicional da muralha; a nota preserva a tradução mais literal “um segundo trecho”.
- source_word: מִנֶּגֶד
  choice: em frente a
  rationale: A preposição descreve uma posição diante de, defronte ou em face de um ponto de referência.
- source_word: עֲלֹת
  choice: a subida para
  rationale: O infinitivo substantivado descreve um acesso ascendente ou uma subida que conduz ao local mencionado.
- source_word: הַנֶּשֶׁק
  choice: o arsenal
  rationale: Embora o substantivo possa significar “armas”, neste contexto topográfico provavelmente se refere ao lugar associado ao armazenamento delas.
- source_word: הַמִּקְצֹעַ
  choice: a esquina
  rationale: O termo designa uma quina, esquina ou mudança angular na linha da muralha.
