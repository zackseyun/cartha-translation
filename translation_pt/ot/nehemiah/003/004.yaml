  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: pt
  text: Ao lado deles, Meremote, filho de Urias, filho de Hacoz, fez reparos; ao lado deles, Mesulão, filho de Berequias, filho de Mesezabel, fez reparos; e, ao lado deles, Zadoque, filho de Baaná, fez reparos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “reparou” ou, mais literalmente, “fortaleceu”. Neste capítulo, ele é usado repetidamente para o trabalho de restauração de uma parte da muralha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: ao lado deles / ao lado dele
  rationale: A expressão idiomática hebraica, literalmente ligada à 'mão', indica proximidade espacial na sequência das obras. O pronome é ajustado em português ao antecedente imediato para comunicar naturalmente que cada trabalhador atuava junto ao anterior.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Neste capítulo, o verbo funciona como termo recorrente para fortalecer ou reparar uma parte da muralha. 'Fez reparos' preserva o sentido da atividade de restauração e soa natural em português.
- source_word: מְרֵמוֹת
  choice: Meremote
  rationale: Transliteração do nome pessoal em forma naturalizada segundo convenções correntes em português bíblico.
- source_word: בֶּן
  choice: filho de
  rationale: Nestes registros genealógicos imediatos, a relação indicada é naturalmente expressa como 'filho de', sem necessidade contextual de ampliá-la para 'descendente de'.
- source_word: אוּרִיָּה
  choice: Urias
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: הַקּוֹץ
  choice: Hacoz
  rationale: Transliteração que incorpora o artigo hebraico à forma do nome, de acordo com o texto escrito.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa tradicional e legível do nome pessoal hebraico.
- source_word: בֶּרֶכְיָה
  choice: Berequias
  rationale: Forma portuguesa tradicional e legível do nome pessoal hebraico.
- source_word: מְשֵׁיזַבְאֵל
  choice: Mesezabel
  rationale: Transliteração portuguesa próxima dos sons e consoantes do hebraico.
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal.
- source_word: בַּעֲנָא
  choice: Baaná
  rationale: Transliteração próxima da forma hebraica, com acento gráfico para orientar a pronúncia em português.
