base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: pt
  text: Depois dele, Benjamim e Hassube fizeram reparos diante da casa deles. Depois dele, Azarias, filho de Maaseias, filho de Ananias, fez reparos ao lado de sua casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: No contexto da lista de obras em Neemias 3, a expressão assinala a sequência dos trechos ao longo da muralha; a tradução preserva essa progressão.
- source_word: הֶחֱזִיק
  choice: fizeram reparos / fez reparos
  rationale: O hifil de חזק funciona neste capítulo como expressão idiomática para executar obras de reparação, não meramente para fortalecer.
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: Benjamim e Hassube
  rationale: Nomes pessoais transliterados segundo formas portuguesas reconhecíveis; Hassube representa a pronúncia massorética com consoante medial intensificada.
- source_word: נֶגֶד בֵּיתָם
  choice: diante da casa deles
  rationale: נֶגֶד indica uma posição em frente ou defronte; mantém-se o singular 'casa' com o sufixo plural do hebraico.
- source_word: עֲזַרְיָה בֶן מַעֲשֵׂיָה בֶן עֲנָנְיָה
  choice: Azarias, filho de Maaseias, filho de Ananias
  rationale: Preserva-se diretamente a estrutura genealógica hebraica, usando as formas portuguesas tradicionais dos nomes.
- source_word: אֵצֶל בֵּיתוֹ
  choice: ao lado de sua casa
  rationale: אֵצֶל expressa proximidade espacial; 'ao lado de' é natural e distingue esta relação do marcador sequencial 'depois dele'.
