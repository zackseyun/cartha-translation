  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: pt
  text: E entre a câmara superior do canto[a] e a Porta das Ovelhas, os ourives e os comerciantes fizeram reparos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a subida do canto” ou “a câmara superior do canto”. O termo hebraico pode indicar uma câmara ou estrutura superior, ou ainda uma subida; não se sabe ao certo qual era esse elemento arquitetônico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: E entre
  rationale: Preserva tanto a ligação com a seção anterior quanto o sentido espacial do hebraico.
- source_word: עֲלִיַּת
  choice: a câmara superior
  rationale: O substantivo pode indicar uma câmara ou estrutura elevada; esta formulação é natural em português e evita especificar em excesso o elemento arquitetônico incerto.
- source_word: הַפִּנָּה
  choice: da esquina
  rationale: Traduz o substantivo comum definido de modo direto, sem transformá-lo necessariamente em nome próprio.
- source_word: לְשַׁעַר הַצֹּאן
  choice: e a Porta das Ovelhas
  rationale: Com בֵין, a preposição לְ marca o segundo limite do trecho; em português, a construção idiomática é “entre... e...”. “Porta das Ovelhas” comunica claramente o nome reconhecido do portão.
- source_word: הֶחֱזִיקוּ
  choice: fizeram reparos
  rationale: Neste capítulo, o verbo descreve repetidamente o trabalho de restauração das muralhas e portas.
- source_word: הַצֹּרְפִים
  choice: os ourives
  rationale: Designa os que refinam ou trabalham metais preciosos; “ourives” é a designação ocupacional tradicional e precisa em português.
- source_word: וְהָרֹכְלִים
  choice: e os comerciantes
  rationale: Representa de modo amplo e natural o grupo de negociantes mencionado no hebraico.
