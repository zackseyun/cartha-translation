  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: pt
  text: Depois dele, Zadoque, filho de Imer, fez reparos diante de sua casa[a]. Depois dele, Semaías, filho de Secanias, responsável pela guarda do Portão Oriental[b], fez reparos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente à sua casa” ou “defronte de sua casa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “guardião do Portão Oriental”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: A fórmula recorrente em Neemias 3 indica a sequência dos trabalhadores e das seções reparadas; a expressão é natural e próxima do hebraico.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Neste capítulo, o hifil de חזק é empregado idiomaticamente para o trabalho de reparar ou restaurar a muralha e os portões, não apenas para 'fortalecer' em sentido abstrato.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Zadoque, filho de Imer
  rationale: Os nomes são transliterados em formas portuguesas reconhecíveis, mantendo-se literalmente a relação genealógica.
- source_word: נֶגֶד בֵּיתוֹ
  choice: diante de sua casa
  rationale: נֶגֶד pode significar 'diante de', 'em frente a' ou 'defronte de'; a escolha preserva a referência topográfica sem pressupor que a obra estivesse do outro lado de uma via.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Semaías, filho de Secanias
  rationale: Transliteração em formas tradicionais e legíveis em português, com a expressão genealógica preservada.
- source_word: שֹׁמֵר
  choice: responsável pela guarda
  rationale: O particípio descreve a função de Semaías em relação ao portão. A formulação portuguesa comunica tanto a ideia de guardião quanto a de responsável oficial, sem determinar mais precisamente o cargo.
- source_word: שַׁעַר הַמִּזְרָח
  choice: Portão Oriental
  rationale: A expressão designa um portão específico voltado para o leste; a inicial maiúscula sinaliza seu uso como nome topográfico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos em formas correntes. A repetição de “Depois dele” foi mantida por refletir a estrutura enumerativa do hebraico. “Fez reparos” explicita o sentido contextual de הֶחֱזִיק, enquanto as notas preservam as alternativas genuínas de נֶגֶד e שֹׁמֵר.
