  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: pt
  text: Quando Sambalate ouviu que estávamos reconstruindo a muralha, ficou irado, enfureceu-se muito e zombou dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos habitantes de Judá». O termo hebraico pode designar regionalmente o povo de Judá e também, em sentido mais amplo, os judeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz o novo acontecimento; «Quando» expressa naturalmente a relação temporal sem acrescentar um advérbio inexistente no hebraico.
- source_word: שָׁמַע
  choice: ouviu
  rationale: Mantém o sentido comum do verbo e, no contexto, comunica de modo natural que Sambalate recebeu a notícia.
- source_word: סַנְבַלַּט
  choice: Sambalate
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: que estávamos reconstruindo
  rationale: O particípio indica ação em andamento, e «reconstruindo» explicita adequadamente o contexto de restauração da muralha danificada de Jerusalém.
- source_word: הַחוֹמָה
  choice: a muralha
  rationale: «Muralha» identifica com clareza, em português, a fortificação urbana em questão.
- source_word: וַיִּחַר לוֹ
  choice: ficou irado
  rationale: Traduz de maneira natural o idioma hebraico da ira que se acende, preservando seu tom forte.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: enfureceu-se muito
  rationale: Mantém o segundo verbo de ira e sua intensificação por הַרְבֵּה, sem fundi-lo silenciosamente com a expressão anterior.
- source_word: וַיַּלְעֵג
  choice: zombou
  rationale: Expressa de forma concisa e atual a fala ou atitude de escárnio indicada pelo verbo.
- source_word: עַל הַיְּהוּדִים
  choice: dos judeus
  rationale: É a designação mais reconhecível em português; a possível nuance regional é preservada em nota.
