lexical_decisions:
- source_word: מֵעַל
  choice: Acima de
  rationale: Indica a localização deste trecho da obra em relação à seção anterior; “acima de” é natural no contexto topográfico da lista.
- source_word: שַׁעַר הַסּוּסִים
  choice: Porta dos Cavalos
  rationale: Reproduz naturalmente a cadeia construta hebraica e funciona como nome do local em português.
- source_word: הֶחֱזִיקוּ
  choice: fizeram reparos
  rationale: Neste capítulo, o verbo descreve repetidamente o trabalho de restauração da muralha e de suas portas, não apenas o ato genérico de fortalecer.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Correspondência direta e corrente do substantivo definido.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular tem valor distributivo entre os sacerdotes e é expresso de modo natural por “cada um”.
- source_word: לְנֶגֶד
  choice: diante de
  rationale: Expressa a posição em frente à respectiva residência; “diante de” preserva a relação espacial sem exigir uma oposição estrita.
- source_word: בֵּיתוֹ
  choice: sua própria casa
  rationale: O sufixo masculino singular acompanha distributivamente “cada um”; “própria” deixa clara a correspondência entre cada sacerdote e sua casa.
