  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: pt
  text: Assim, reconstruímos o muro, e o muro inteiro ficou unido até a metade de sua altura, pois o povo tinha disposição para trabalhar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “o povo tinha coração para fazer”. A expressão indica que o povo estava interiormente disposto e decidido a realizar o trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Assim, reconstruímos
  rationale: O wayyiqtol qal na primeira pessoa do plural dá continuidade à narrativa. “Reconstruímos” se ajusta ao contexto de restauração do muro já existente, e “Assim” expressa a progressão e a relação com o contexto anterior sem reproduzir mecanicamente o waw.
- source_word: הַחוֹמָה
  choice: o muro
  rationale: חוֹמָה designa o muro defensivo de uma cidade; “o muro” é a forma direta e natural em português.
- source_word: וַתִּקָּשֵׁר
  choice: ficou unido
  rationale: A forma nifal de קשר apresenta as partes do muro como ligadas num conjunto contínuo. “Ficou unido” preserva o valor passivo-resultativo de maneira idiomática.
- source_word: כָּל הַחוֹמָה
  choice: o muro inteiro
  rationale: כָּל com substantivo definido indica totalidade. “O muro inteiro” é claro e natural.
- source_word: עַד חֶצְיָהּ
  choice: até a metade de sua altura
  rationale: A expressão diz literalmente “até a sua metade”. No contexto da reconstrução, a metade se refere à altura alcançada pelo muro; explicitar “altura” evita uma leitura espacial equivocada.
- source_word: וַיְהִי לֵב לָעָם
  choice: pois o povo tinha disposição
  rationale: O idiomatismo hebraico, literalmente “havia coração para o povo”, expressa ânimo, vontade e determinação interior. “Tinha disposição” comunica esse sentido em português corrente; “pois” explicita a relação causal indicada pelo contexto.
- source_word: לַעֲשׂוֹת
  choice: para trabalhar
  rationale: Embora עשה seja amplo (“fazer”), aqui se refere à execução da obra de reconstrução. “Trabalhar” é a equivalência contextual mais natural.
