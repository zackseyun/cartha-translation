base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: pt
  text: Depois dele, Malquias, filho do ourives, fez reparos até a casa dos servidores do templo e dos comerciantes, diante da Porta da Inspeção, e até o aposento superior da esquina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: do ourives
  rationale: O termo designa quem trabalha ou refina metais preciosos; no contexto, a tradução tradicional e natural «ourives» comunica bem a profissão.
- source_word: הַנְּתִינִים
  choice: dos servidores do templo
  rationale: Os netinins constituíam um grupo designado para serviços ligados ao templo; a forma funcional evita uma transliteração obscura.
- source_word: הָרֹכְלִים
  choice: dos comerciantes
  rationale: O plural refere-se a mercadores ou vendedores ambulantes; «comerciantes» é claro e adequado ao contexto urbano.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Porta da Inspeção
  rationale: מִפְקָד pode indicar inspeção, revista, recenseamento ou convocação. «Inspeção» preserva um sentido plausível sem especificar além do texto.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: o aposento superior da esquina
  rationale: עֲלִיָּה designa uma dependência elevada ou aposento superior; a formulação mantém a relação genitiva e a referência topográfica pouco especificada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem rigidez excessiva. «Fez reparos» expressa naturalmente o verbo de fortalecimento/reparo recorrente no capítulo. A coordenação foi vertida como «a casa dos servidores do templo e dos comerciantes», entendendo que ambos os grupos se relacionam com a casa, sem acrescentar explicação ausente do original.
