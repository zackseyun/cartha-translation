  text: פָּלָ֣ל בֶּן אוּזַי֮ מִ/נֶּ֣גֶד הַ/מִּקְצוֹעַ֒ וְ/הַ/מִּגְדָּ֗ל הַ/יּוֹצֵא֙ מִ/בֵּ֤ית הַ/מֶּ֨לֶךְ֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר לַ/חֲצַ֣ר הַ/מַּטָּרָ֑ה אַחֲרָ֖י/ו פְּדָיָ֥ה בֶן פַּרְעֹֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: pt
  text: Palal, filho de Uzai, fez reparos diante do ângulo[a] e da torre que se projeta da casa superior do rei[b], junto ao pátio da guarda[c]. Depois dele, Pedaías, filho de Parós, fez reparos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da esquina”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do palácio superior”. O hebraico diz literalmente “da casa superior do rei”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pátio da prisão”. O termo provavelmente se refere a um pátio vigiado usado para detenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: diante de
  rationale: Expressa a relação espacial de estar em frente a um ponto de referência, sem determinar uma distância exata.
- source_word: הַמִּקְצוֹעַ
  choice: o ângulo
  rationale: O substantivo designa um ângulo ou canto arquitetônico; “ângulo” preserva a referência estrutural, enquanto “esquina” permanece como alternativa em nota.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: a torre que se projeta
  rationale: O particípio de יצא descreve a torre como saliente, estendendo-se para fora da muralha ou do complexo real.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: da casa superior do rei
  rationale: Mantém de perto a formulação hebraica e a amplitude semântica de בית; “palácio superior” é possível, mas mais interpretativo.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: junto ao pátio da guarda
  rationale: מטרה indica aqui um local vigiado, possivelmente usado para detenção. “Pátio da guarda” preserva o sentido contextual sem afirmar mais do que o texto.
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Na lista de reparos, a fórmula introduz o trabalhador ou trecho seguinte.
- source_word: פָּלָל
  choice: Palal
  rationale: Transliteração clara do nome pessoal hebraico.
- source_word: אוּזַי
  choice: Uzai
  rationale: Transliteração clara do nome pessoal hebraico.
- source_word: פְּדָיָה
  choice: Pedaías
  rationale: Forma portuguesa legível do nome pessoal hebraico.
- source_word: פַּרְעֹשׁ
  choice: Parós
  rationale: Forma portuguesa legível do nome pessoal hebraico.
- source_word: '[elipse verbal nas duas unidades do versículo]'
  choice: fez reparos
  rationale: O verbo não está expresso neste versículo, mas é exigido pelo padrão sintático e pelo contexto da lista de reconstrução em Neemias 3.
