lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Conserva o marcador espacial e sequencial da lista de reparos de modo natural em português.
- source_word: הֶחֱזִיקוּ
  choice: fizeram reparos
  rationale: Neste capítulo, o verbo é usado no contexto da restauração da muralha; a expressão comunica esse sentido sem recorrer ao significado literal menos contextual de 'fortaleceram'.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Mantém a formulação literal do hebraico, embora no contexto possa designar parentes, companheiros ou membros do mesmo grupo.
- source_word: בַּוַּי
  choice: Bavai
  rationale: Translitera a forma vocalizada do WLC; a variante 'Binui' é registrada em nota.
- source_word: בֶּן חֵנָדָד
  choice: filho de Henadade
  rationale: Tradução direta e natural da construção patronímica.
- source_word: שַׂר
  choice: chefe
  rationale: No contexto administrativo, indica a autoridade responsável por uma subdivisão territorial; 'chefe' é claro e não sugere necessariamente função militar.
- source_word: חֲצִי פֶּלֶךְ
  choice: metade do distrito
  rationale: Expressa uma subdivisão administrativa em linguagem portuguesa atual e compreensível.
- source_word: קְעִילָה
  choice: Queila
  rationale: Usa a forma portuguesa tradicional e reconhecível do topônimo bíblico.
