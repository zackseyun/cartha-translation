base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: pt
  text: Ouve, nosso Deus, pois nos tornamos objeto de desprezo.[a] Faz a afronta deles recair sobre a própria cabeça deles e entrega-os como despojo numa terra de cativeiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois nos tornamos desprezo”. Também pode ser traduzido por “pois somos desprezados”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na terra do cativeiro”. A ausência do artigo em hebraico favorece “numa terra”, mas o contexto também permite uma referência mais específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouve
  rationale: Imperativo singular dirigido a Deus. “Ouve” preserva a fórmula tradicional de oração sem acrescentar o objeto implícito “nos”.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz o substantivo com sufixo da primeira pessoa do plural e funciona naturalmente como vocativo.
- source_word: כִּי הָיִינוּ בוּזָה
  choice: pois nos tornamos objeto de desprezo
  rationale: “Pois” introduz a razão do apelo; a formulação preserva o perfeito de היה e o substantivo בוּזָה, literalmente a ideia de terem se tornado desprezo, em português natural.
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: Faz recair sobre a cabeça deles a afronta que nos lançaram
  rationale: Expressa o hifil imperativo de שוב e a imagem retributiva de a afronta voltar à cabeça dos próprios ofensores. “Que nos lançaram” explicita em português a relação contextual contida em “a afronta deles”, sem atenuar o pedido.
- source_word: וּתְנֵם לְבִזָּה
  choice: e entrega-os como despojo
  rationale: נתן com o sufixo pronominal e o complemento לְבִזָּה indica entregá-los ou fazê-los despojo; “entrega-os como despojo” conserva a força do pedido.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: numa terra de cativeiro
  rationale: Preserva a construção sem artigo definido e o sentido concreto de שִׁבְיָה como cativeiro.
theological_decisions:
- issue: Petição imprecatória contra os inimigos
  choice: Manter diretamente o pedido de justiça retributiva
  alternative: Suavizar como um pedido geral de justiça ou tratá-lo apenas como metáfora
  rationale: O hebraico pede explicitamente que Deus faça a afronta retornar aos adversários e os entregue como despojo; a tradução não deve atenuar essa tensão teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A oração mantém forma direta e solene. “Objeto de desprezo” preserva melhor a construção nominal hebraica do que uma simples forma passiva; “numa terra de cativeiro” mantém a indefinição genuína do original.
