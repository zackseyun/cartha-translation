base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: pt
  text: Hanum e os habitantes de Zanoa repararam o Portão do Vale.[a] Eles o construíram, colocaram no lugar suas portas, seus ferrolhos e suas trancas, e repararam mil côvados da muralha,[b] até o Portão do Esterco.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortaleceram” o Portão do Vale; neste capítulo, o verbo hebraico pode ter o sentido de tornar firme ou reparar.
    reason: lexical_alternative
  - marker: b
    text: Mil côvados correspondem a cerca de 457 metros.
    reason: cultural_note
  - marker: c
    text: Ou “Portão do Lixo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: repararam
  rationale: No contexto da reconstrução narrada em Neemias 3, o verbo indica assumir e executar o reparo ou fortalecimento de uma parte da cidade. “Repararam” comunica esse sentido naturalmente, sem excluir a ideia literal de tornar firme.
- source_word: שַׁעַר הַגַּיְא
  choice: Portão do Vale
  rationale: A construção hebraica dá nome ao portão. “Portão do Vale” é clara, concisa e preserva o valor toponímico.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: os habitantes de Zanoa
  rationale: O particípio substantivado designa os que moravam na localidade; “habitantes” é corrente e preciso.
- source_word: הֵמָּה בָנוּהוּ
  choice: Eles o construíram
  rationale: Mantém o verbo explícito “construir” e o objeto pronominal do hebraico. O contexto deixa claro que se tratava da restauração do portão.
- source_word: וַיַּעֲמִידוּ
  choice: colocaram no lugar
  rationale: O verbo causativo significa fazer ficar de pé ou pôr em posição. A expressão escolhida é natural para a instalação das portas e de seus dispositivos de fechamento.
- source_word: דַּלְתֹתָיו
  choice: suas portas
  rationale: O plural se refere às folhas do portão; “portas” é compreensível e preserva o número do hebraico.
- source_word: מַנְעֻלָיו
  choice: seus ferrolhos
  rationale: No contexto arquitetônico, o termo indica dispositivos que prendem ou fecham as portas. “Ferrolhos” expressa concretamente essa função.
- source_word: בְרִיחָיו
  choice: suas trancas
  rationale: O termo designa barras usadas para firmar e fechar o portão. “Trancas” diferencia esses elementos dos ferrolhos e é facilmente compreendido.
- source_word: אֶלֶף אַמָּה
  choice: mil côvados
  rationale: Conserva a unidade antiga e a quantidade exata apresentadas no texto, com equivalência moderna indicada em nota.
- source_word: בַּחוֹמָה
  choice: da muralha
  rationale: A preposição, dentro da expressão de extensão, identifica o trecho da muralha reparado. “Da muralha” é idiomático em português.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Portão do Esterco
  rationale: O nome provavelmente se relaciona à retirada de esterco ou resíduos. A tradução direta preserva a denominação tradicional, enquanto uma alternativa mais ampla é registrada em nota.
