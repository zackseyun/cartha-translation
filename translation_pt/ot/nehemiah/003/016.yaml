  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Bete-Zur” segue forma aportuguesada; “tanque” é mais corrente no contexto de armazenamento de água do que “piscina”; as ambiguidades espacial e arquitetônica são preservadas em notas.
