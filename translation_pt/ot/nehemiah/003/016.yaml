  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: pt
  text: Depois dele[a], Neemias, filho de Azbuque, governante de metade do distrito de Bete-Zur, fez reparos até o ponto em frente aos túmulos de Davi, até o tanque que havia sido construído e até a casa dos guerreiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao lado dele”, se a expressão for entendida espacialmente, e não como indicação de sequência na lista de reparos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a casa dos valentes”. A expressão hebraica talvez designe um edifício militar, mas sua identificação exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Na lista de reparos, a expressão normalmente indica sequência em relação ao trabalhador ou trecho anterior. A alternativa espacial permanece registrada em nota.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: O hifil de חזק funciona em Neemias 3 como termo idiomático para reparar ou restaurar partes da muralha.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: governante de metade do distrito
  rationale: שַׂר designa uma autoridade administrativa, e פֶּלֶךְ, neste contexto persa, refere-se a um distrito, não a uma província inteira.
- source_word: בֵּית צוּר
  choice: Bete-Zur
  rationale: Transliteração portuguesa convencional do topônimo hebraico.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: até o ponto em frente aos túmulos de Davi
  rationale: Expressa a correspondência espacial indicada por נֶגֶד sem sugerir que o reparo alcançava o interior da área funerária.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: o tanque que havia sido construído
  rationale: Preserva o sentido passivo e resultativo da expressão, literalmente o tanque 'feito', sem especificar um método de engenharia.
- source_word: בֵּית הַגִּבֹּרִים
  choice: a casa dos guerreiros
  rationale: גִּבֹּרִים pode designar homens valentes ou guerreiros. A tradução mantém a referência a pessoas e evita identificar conjecturalmente o edifício como quartel.
theological_decisions: []
