  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: pt
  text: Ao lado deles, os habitantes de Tecoa fizeram reparos, mas os seus nobres[a] não quiseram sujeitar-se ao trabalho de seus senhores.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus líderes”.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não trouxeram o pescoço ao trabalho de seus senhores”, expressão que indica recusa em submeter-se ou assumir o trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Ao lado deles
  rationale: A expressão idiomática indica a posição adjacente na sequência das obras; esta formulação é clara e natural em português.
- source_word: הֶחֱזִיקוּ
  choice: fizeram reparos
  rationale: No contexto de Neemias 3, o verbo descreve o trabalho de restaurar ou reforçar a muralha.
- source_word: הַתְּקוֹעִים
  choice: os habitantes de Tecoa
  rationale: O gentílico hebraico designa as pessoas provenientes de Tecoa; a forma analítica é imediatamente compreensível em português internacional.
- source_word: וְאַדִּירֵיהֶם
  choice: os seus nobres
  rationale: O termo designa pessoas poderosas, proeminentes ou pertencentes à elite local; “nobres” preserva essa dimensão social sem especificar um cargo.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: não quiseram sujeitar-se
  rationale: A expressão literal sobre trazer o pescoço evoca submissão ao jugo e disposição para o labor. A tradução comunica a recusa, enquanto a nota preserva a imagem hebraica.
- source_word: בַּעֲבֹדַת
  choice: ao trabalho
  rationale: Neste contexto, o substantivo se refere ao labor da reconstrução, embora também possa ter o sentido mais amplo de serviço.
- source_word: אֲדֹנֵיהֶם
  choice: de seus senhores
  rationale: Mantém o plural e a relação hierárquica do hebraico, sem transformar a expressão em referência singular a Deus.
theological_decisions:
- issue: Referente de אֲדֹנֵיהֶם (“seus senhores”)
  choice: Manter o plural “seus senhores”, sugerindo superiores humanos ligados à obra
  alternative: Interpretar e suavizar como “a obra do Senhor”
  rationale: O hebraico apresenta substantivo e sufixo no plural. A tradução preserva essa forma e evita introduzir uma referência divina singular ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação principal traduz o sentido do idioma hebraico de modo natural, e a nota registra sua imagem concreta. O plural “senhores” foi preservado para não eliminar a ambiguidade social do original.
