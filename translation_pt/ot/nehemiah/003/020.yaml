base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: pt
  text: Depois dele, Baruque, filho de Zabai,[a] reparou com grande zelo[b] um segundo trecho, desde o ângulo até a entrada da casa de Eliasibe, o sumo sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Baruque, filho de Zacai», conforme uma tradição alternativa do nome refletida em algumas versões.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por «reparou com grande zelo» é incomum e provavelmente ressalta o fervor ou a dedicação excepcional de Baruque no trabalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: No contexto da lista de trabalhadores, a expressão indica tanto a sequência do relato quanto a posição contígua do trecho reparado.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: reparou com grande zelo
  rationale: הֶחֱזִיק designa aqui o ato de reparar ou reforçar, enquanto הֶחֱרָה, de uso incomum nesta construção, intensifica a ação e sugere ardor ou dedicação excepcional.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Baruque, filho de Zabai
  rationale: Os nomes são transliterados de forma corrente em português; a forma consonantal זבי sustenta Zabai, enquanto a tradição alternativa é registrada em nota.
- source_word: מִדָּה שֵׁנִית
  choice: um segundo trecho
  rationale: Neste capítulo, a expressão se refere a mais uma porção designada da muralha, não a uma medida literal.
- source_word: מִן הַמִּקְצוֹעַ
  choice: desde o ângulo da muralha
  rationale: O substantivo indica um canto, ângulo ou ponto de mudança de direção. A explicitação de 'da muralha' torna o referente claro sem alterar o sentido.
- source_word: עַד פֶּתַח בֵּית
  choice: até a entrada da casa de
  rationale: A expressão provavelmente indica a entrada física da residência ou do complexo ligado a Eliasibe.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: Eliasibe, o sumo sacerdote
  rationale: Esta é a designação consagrada e exata do ofício em português.
