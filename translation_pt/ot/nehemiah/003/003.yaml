  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: pt
  text: Os descendentes de Hassenaá construíram a Porta dos Peixes; eles a cobriram[a] e instalaram suas portas, seus ferrolhos e suas barras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “puseram suas vigas” ou “puseram-lhe um teto”. O verbo hebraico se refere a cobrir uma estrutura em contexto de construção.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: a Porta dos Peixes
  rationale: A construção hebraica designa uma porta específica de Jerusalém; a forma consagrada e natural em português é “Porta dos Peixes”.
- source_word: בָּנוּ
  choice: construíram
  rationale: O verbo significa normalmente “construir”. Embora o contexto geral seja de restauração, o texto não emprega aqui o verbo mais específico para “reparar”.
- source_word: בְּנֵי הַסְּנָאָה
  choice: Os descendentes de Hassenaá
  rationale: בני pode indicar filhos literais ou membros de uma família ou clã. “Descendentes” comunica naturalmente neste contexto o grupo familiar, sem restringi-lo a filhos imediatos.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente retoma e destaca o grupo responsável, mas uma construção enfática como “eles mesmos” poderia sugerir contraste não explicitado; “eles” preserva a retomada com naturalidade.
- source_word: קֵרֻהוּ
  choice: a cobriram
  rationale: Em contexto de construção, o verbo קרה significa cobrir uma estrutura, possivelmente colocando vigas ou um teto. “Cobriram” mantém a extensão semântica e evita especificação arquitetônica excessiva.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: instalaram suas portas
  rationale: A expressão significa literalmente fazer as portas ficar em pé; “instalaram” expressa com clareza a ação no contexto de construção.
- source_word: מַנְעוּלָיו
  choice: seus ferrolhos
  rationale: O termo designa mecanismos de fechamento da porta; “ferrolhos” é preciso e combina com a menção seguinte às barras ou trancas.
- source_word: וּבְרִיחָיו
  choice: e suas trancas
  rationale: בריח designa uma barra transversal usada para fechar ou reforçar portas. “Trancas” é claro e idiomático em português, distinguindo o item dos ferrolhos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Descendentes” explicita o sentido familiar ou clânico provável de בני. O nome Hassenaá segue transliteração próxima da forma hebraica. O marcador [a] aparece imediatamente após a expressão lexicalmente ambígua.
