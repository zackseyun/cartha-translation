base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: pt
  text: Depois dele, Hananias, filho de Selemias, e Hanum, o sexto filho de Zalafe, repararam outro trecho[a]. Depois dele, Mesulão, filho de Berequias, fez reparos em frente ao seu aposento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente «uma segunda medida», expressão que, neste capítulo, se refere a outro trecho destinado ao reparo. Na primeira frase, o texto consonantal pode ser lido literalmente como «depois de mim», mas a tradição de leitura e a fórmula repetida ao longo do capítulo apoiam «depois dele».
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: Depois dele
  rationale: No contexto da lista de construtores, a expressão indica a sequência ou a posição em relação ao trabalhador anterior. A primeira ocorrência apresenta uma dificuldade textual/morfológica, registrada em nota, mas a fórmula recorrente do capítulo favorece «Depois dele».
- source_word: הֶחֱזִיק
  choice: repararam / fez reparos
  rationale: Neste capítulo, o verbo descreve o trabalho de restauração da muralha. As duas formas portuguesas são naturais e evitam uma repetição rígida sem mudar o sentido.
- source_word: הַשִּׁשִּׁי
  choice: o sexto filho
  rationale: O hebraico diz literalmente «o sexto»; no contexto genealógico, «filho» é uma elipse plausível e necessária para uma leitura portuguesa clara.
- source_word: מִדָּה שֵׁנִי
  choice: outro trecho
  rationale: Literalmente, «uma segunda medida». Em Neemias 3, a expressão designa um trecho adicional da muralha entregue para reparo.
- source_word: נֶגֶד
  choice: diante de
  rationale: A preposição indica uma posição em frente ou defronte do aposento; «diante de» mantém essa relação espacial sem sugerir necessariamente que ficava do outro lado.
- source_word: נִשְׁכָּתוֹ
  choice: seu aposento
  rationale: O substantivo designa um cômodo ou dependência, possivelmente residencial ou oficial. «Aposento» conserva o tom arquitetônico sem definir uma função não indicada.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hananias / Selemias / Hanum / Zalafe / Mesulão / Berequias
  rationale: Adotam-se formas portuguesas tradicionais e reconhecíveis dos nomes próprios, adequadas à legibilidade brasileira.
