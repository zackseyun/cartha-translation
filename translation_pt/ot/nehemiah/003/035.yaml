base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: pt
  text: 'Tobias, o amonita, estava ao lado dele e disse: “Até o que eles estão construindo — se uma raposa[a] subir ali, abrirá uma brecha na muralha de pedras deles!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar, em certos contextos, outro canídeo semelhante à raposa, como o chacal; “raposa” é a tradução usual aqui.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “derrubará a muralha de pedras deles”. O verbo hebraico pode indicar abrir uma brecha, romper ou derrubar; a expressão faz parte da zombaria de Tobias sobre a suposta fragilidade da muralha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: estava ao lado dele
  rationale: A preposição אֵצֶל com sufixo pronominal indica proximidade; a expressão é natural em português e mostra que Tobias estava junto de Sambalate.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Até o que eles estão construindo
  rationale: גַּם tem aqui força enfática, intensificando o tom de zombaria de Tobias.
- source_word: אִם יַעֲלֶה שׁוּעָל
  choice: se uma raposa subir ali
  rationale: אִם introduz a condição, שׁוּעָל é normalmente traduzido por “raposa”, e “ali” explicita de modo natural que o animal subiria sobre a construção mencionada.
- source_word: וּפָרַץ
  choice: abrirá uma brecha
  rationale: O verbo פרץ pode indicar romper, derrubar ou abrir uma brecha. A formulação preserva a imagem vívida da zombaria e concorda com o sujeito singular “raposa”.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: a muralha de pedras deles
  rationale: A expressão construta significa literalmente “a muralha das pedras deles”; esta forma mantém a referência enfática às pedras usadas pelos construtores.
