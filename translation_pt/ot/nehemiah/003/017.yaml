base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: pt
  text: Depois dele, os levitas — Reum, filho de Bani — fizeram reparos[a]. Ao lado dele,[b] Hasabias, chefe de metade do distrito de Queila, fez reparos em favor do seu distrito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reforçaram”. O verbo hebraico significa literalmente “tornar forte”, mas, em Neemias 3, refere-se ao trabalho de reparação da muralha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “junto à sua mão”, expressão que aqui significa “ao lado dele”.
    reason: lexical_alternative
  - marker: c
    text: Ou “na sua seção”. O hebraico pode referir-se tanto ao distrito sob a autoridade de Hasabias quanto à parte da obra que lhe foi atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: Na lista de construtores, a expressão indica a sequência e possivelmente a posição em relação ao trabalhador anterior; a formulação portuguesa preserva essa dupla possibilidade.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: fizeram reparos / fez reparos
  rationale: O hifil de חזק significa literalmente fortalecer, mas em Neemias 3 funciona como expressão recorrente para executar reparos na muralha.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Preserva a designação étnico-religiosa convencional e inteligível em português.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: Reum, filho de Bani
  rationale: Emprega formas portuguesas correntes dos nomes e mantém explicitamente a relação genealógica.
- source_word: עַל יָדוֹ
  choice: Ao lado dele
  rationale: O sentido literal é 'junto à sua mão', mas, no contexto da distribuição dos trabalhos, o idioma indica uma posição adjacente.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Usa a forma tradicional portuguesa do nome hebraico.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: chefe de metade do distrito de Queila
  rationale: שַׂר designa aqui uma autoridade administrativa, e פֶלֶךְ, uma circunscrição ou distrito; a tradução acompanha diretamente a cadeia nominal hebraica.
- source_word: לְפִלְכּוֹ
  choice: em favor do seu distrito
  rationale: A preposição ל pode indicar responsabilidade ou benefício; esta formulação mantém a relação administrativa sem decidir se a referência é à circunscrição governada ou à seção de trabalho atribuída.
