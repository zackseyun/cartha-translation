translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário administrativo não excessivamente técnico. A repetição de “fez/fizeram reparos” preserva a fórmula estrutural do capítulo. Os marcadores foram posicionados junto às expressões que explicam.
