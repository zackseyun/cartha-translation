base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: pt
  text: Depois dele, Meremote, filho de Urias, filho de Hacoz, reparou outro trecho[a], desde a entrada da casa de Eliasibe até a extremidade da casa de Eliasibe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um segundo trecho”. A expressão hebraica pode indicar outro trecho atribuído a Meremote ou, mais formalmente, “uma segunda medida ou extensão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: No contexto da lista de obras de Neemias 3, a expressão indica a sequência dos responsáveis e de seus trechos de trabalho.
- source_word: הֶחֱזִיק
  choice: reparou
  rationale: Embora o verbo tenha o sentido básico de fortalecer, neste capítulo é usado de modo idiomático para o trabalho de reparação da muralha e de estruturas associadas.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Meremote, filho de Urias e neto de Hacoz
  rationale: Os nomes seguem formas portuguesas reconhecíveis; a relação de parentesco em duas gerações é explicitada naturalmente sem perder a informação do hebraico.
- source_word: מִדָּה שֵׁנִית
  choice: outro trecho
  rationale: A expressão provavelmente indica um trecho adicional confiado a Meremote, que já aparece no versículo 4. A nota preserva a tradução formal alternativa, “um segundo trecho”.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: desde a entrada da casa de Eliasibe
  rationale: פֶּתַח designa uma abertura, porta ou entrada; “entrada” é claro e natural na descrição do edifício.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: até a extremidade da casa de Eliasibe
  rationale: תַּכְלִית tem aqui sentido espacial de limite ou ponto extremo, não o sentido abstrato de conclusão.
