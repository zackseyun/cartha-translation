  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק בִּנּ֛וּי בֶּן חֵנָדָ֖ד מִדָּ֣ה שֵׁנִ֑ית מִ/בֵּ֣ית עֲזַרְיָ֔ה עַד הַ/מִּקְצ֖וֹעַ וְ/עַד הַ/פִּנָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: pt
  text: Depois dele, Binui, filho de Henadade, reparou um segundo trecho[a], desde a casa de Azarias até o ângulo e até a esquina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outro trecho”. A expressão hebraica pode indicar um trecho adicional reparado por Binui ou, mais literalmente, uma segunda porção medida.
    reason: lexical_alternative
  - marker: b
    text: Os dois termos traduzidos por “ângulo” e “esquina” são relacionados, mas não idênticos em hebraico; provavelmente indicam dois elementos arquitetônicos próximos.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Depois dele
  rationale: No relatório das obras de Neemias 3, a expressão indica a sequência dos trabalhadores; “Depois dele” é natural e não exige que os trechos fossem imediatamente contíguos.
- source_word: הֶחֱזִיק
  choice: reparou
  rationale: Embora o verbo tenha o sentido básico de fortalecer ou tornar firme, neste contexto designa o trabalho de restauração da muralha.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binui, filho de Henadade
  rationale: Os nomes são transliterados de forma corrente em português, e o patronímico hebraico é expresso diretamente por “filho de”.
- source_word: מִדָּה שֵׁנִית
  choice: um segundo trecho
  rationale: A tradução preserva o ordinal שֵׁנִית e emprega “trecho” para o segmento medido da muralha; a nota registra a possível ideia de um trecho adicional.
- source_word: מִבֵּית עֲזַרְיָה
  choice: desde a casa de Azarias
  rationale: “Desde” combina naturalmente com os limites introduzidos depois por “até” e mantém a casa como ponto inicial do trecho.
- source_word: עַד הַמִּקְצוֹעַ
  choice: até o ângulo
  rationale: O substantivo indica um ângulo ou ponto de mudança de direção. “Ângulo” evita igualá-lo ao termo seguinte.
- source_word: וְעַד הַפִּנָּה
  choice: e até a esquina
  rationale: פִּנָּה designa uma esquina ou canto. A repetição de “até” conserva a formulação e a progressão topográfica do hebraico.
