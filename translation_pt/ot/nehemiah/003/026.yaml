  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: pt
  text: Os servidores do templo moravam no Ofel[a], até em frente ao Portão das Águas, a leste, e à torre saliente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico נְתִינִים (netinins), uma classe reconhecida de servidores do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: O termo designa uma classe reconhecida de auxiliares encarregados de serviços ligados ao templo. A tradução funcional é clara em português atual; a nota preserva o nome hebraico tradicional.
- source_word: הָיוּ יֹשְׁבִים
  choice: moravam
  rationale: A construção perifrástica com היה e particípio indica residência contínua; «moravam» expressa isso de modo natural e conciso.
- source_word: בָּעֹפֶל
  choice: no Ofel
  rationale: עֹפֶל é aqui uma designação topográfica ou nome de lugar em Jerusalém. «Ofel» preserva o topônimo, e «no» é a preposição idiomática em português.
- source_word: עַד נֶגֶד
  choice: até diante de
  rationale: A expressão assinala a extensão até um ponto situado defronte de determinados marcos. «Até diante de» conserva tanto o limite quanto a relação espacial, sem impor precisão topográfica indevida.
- source_word: שַׁעַר הַמַּיִם
  choice: Portão das Águas
  rationale: Tradução natural do nome do portão, com maiúsculas por se tratar de uma designação própria.
- source_word: לַמִּזְרָח
  choice: a leste
  rationale: Indica a posição ou direção oriental em relação ao portão; «a leste» é claro e natural.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: a torre saliente
  rationale: No contexto arquitetônico, o particípio יֹצֵא descreve uma torre que se projeta para fora. «Saliente» conserva essa imagem de forma concisa.
