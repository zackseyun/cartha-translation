  text: וְ/עַל יָד֥/וֹ בָנ֖וּ אַנְשֵׁ֣י יְרֵח֑וֹ וְ/עַל יָד֣/וֹ בָנָ֔ה זַכּ֖וּר בֶּן אִמְרִֽי־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/002.yaml
  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: pt
  text: Ao lado dele, construíram os homens de Jericó; e ao lado deles[a], construiu Zacur, filho de Imri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao lado dele”, também nesta segunda oração. O plural “deles” explicita a relação com o grupo mencionado imediatamente antes, os homens de Jericó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Ao lado dele
  rationale: A expressão idiomática עַל יָד com sufixo indica proximidade na sequência dos construtores; “ao lado dele” é natural e preserva o sentido espacial.
- source_word: בָנוּ
  choice: construíram
  rationale: O qal de בנה significa “construir”. Embora o contexto envolva a restauração da muralha, o versículo não explicita “reconstruir”.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: os homens de Jericó
  rationale: Mantém a referência masculina explícita de אַנְשֵׁי e identifica naturalmente o grupo por sua cidade.
- source_word: וְעַל יָדוֹ
  choice: e ao lado deles
  rationale: O hebraico traz novamente o sufixo singular, literalmente “dele”; no encadeamento em português, o plural explicita que Zacur vem depois do grupo imediatamente mencionado. A nota preserva a forma hebraica.
- source_word: בָנָה
  choice: construiu
  rationale: Traduz de modo direto o qal singular de בנה, em paralelo com “construíram” na primeira oração.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Zacur, filho de Inri
  rationale: Emprega formas portuguesas legíveis para os nomes e traduz diretamente a relação patronímica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada a uma lista narrativa. A repetição de “construíram/construiu” preserva o paralelismo do hebraico; o ponto e vírgula separa as duas equipes sem romper a sequência.
