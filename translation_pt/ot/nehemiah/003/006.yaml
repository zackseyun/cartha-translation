  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: pt
  text: Joiada, filho de Paseá, e Mesulão, filho de Besodias, repararam a Porta Velha.[a] Eles assentaram as vigas e colocaram no lugar as portas, os ferrolhos e as trancas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a Porta de Jesana”, entendendo o segundo termo como nome de lugar, e não como o adjetivo “velha”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: repararam
  rationale: No contexto dos relatórios de obras em Neemias 3, o verbo designa restaurar ou consertar uma parte da muralha ou de seus portões; “repararam” é natural e preciso.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: a Porta Velha
  rationale: A expressão é entendida naturalmente como o nome do portão, com הַיְשָׁנָה em sentido adjetival. A possibilidade de ser um topônimo é preservada em nota.
- source_word: קֵרֻהוּ
  choice: assentaram as vigas
  rationale: O verbo se refere a cobrir ou estruturar com vigas; esta formulação comunica a ação de carpintaria sem sugerir necessariamente um telhado completo.
- source_word: וַיַּעֲמִידוּ
  choice: colocaram no lugar
  rationale: Expressa fazer ficar de pé ou pôr em posição, aqui aplicado à instalação dos componentes do portão.
- source_word: דַּלְתֹתָיו
  choice: as portas
  rationale: O plural pode indicar as duas folhas do portão; “portas” mantém essa forma e evita confundir as folhas com toda a estrutura.
- source_word: מַנְעֻלָיו
  choice: os ferrolhos
  rationale: No contexto de um portão, o termo designa mecanismos de fechamento; “ferrolhos” é concreto, historicamente adequado e distinto das trancas.
- source_word: בְרִיחָיו
  choice: as trancas
  rationale: O termo indica barras usadas para firmar e fechar portas ou portões; “trancas” é claro em português e diferencia este elemento dos ferrolhos.
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome retoma enfaticamente os dois construtores; em português, “Eles” marca de modo natural a continuidade das ações.
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: Joiada ... e Mesulão
  rationale: Os nomes pessoais são transliterados em formas reconhecíveis e correntes em português.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: Paseá / Besodias
  rationale: Os patronímicos são transliterados em formas portuguesas reconhecíveis, sem traduzir os nomes.
theological_decisions: []
