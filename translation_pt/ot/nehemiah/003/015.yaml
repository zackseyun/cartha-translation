  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: pt
  text: Salum, filho de Col-Hozé, chefe do distrito de Mispá, fez reparos na Porta da Fonte. Ele mesmo a reconstruiu e colocou-lhe a cobertura; foram instaladas suas portas, seus ferrolhos e suas trancas. Também reparou o muro do tanque de Selá[a], junto ao jardim do rei, até as escadas que descem da Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tanque de Siloé” (tradicionalmente associado a Siloam). O topônimo hebraico aqui é Selá.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Porta da Fonte
  rationale: עַיִן pode designar uma nascente ou fonte. “Porta da Fonte” é uma designação topográfica clara e consagrada em português.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Em Neemias 3, o verbo descreve regularmente o trabalho de restaurar ou reforçar partes da muralha e seus portões; “fez reparos” expressa essa função contextual.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: chefe do distrito de Mispá
  rationale: שַׂר indica um dirigente ou oficial, e פֶּלֶךְ, uma divisão administrativa. “Chefe do distrito” comunica a função sem especificar em excesso o cargo.
- source_word: הוּא יִבְנֶנּוּ
  choice: Ele mesmo a reconstruiu
  rationale: O pronome הוּא é enfático, e, no contexto de restauração, “reconstruiu” é mais preciso do que simplesmente “construiu”.
- source_word: וִיטַלְלֶנּוּ
  choice: colocou-lhe a cobertura
  rationale: O verbo indica cobrir a estrutura do portão, provavelmente instalando sua cobertura ou teto. A formulação evita sugerir detalhes arquitetônicos não explicitados.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: instalou suas portas, seus ferrolhos e suas trancas
  rationale: A sequência trata da instalação dos componentes funcionais do portão. O singular segue o sujeito contextual e a leitura tradicional; מַנְעֻלִים e בְּרִיחִים designam dois tipos de dispositivos de fechamento, aqui distinguidos como “ferrolhos” e “trancas”.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: o muro do tanque de Selá
  rationale: בְּרֵכָה é um reservatório ou tanque, e “Selá” preserva de perto a forma do topônimo hebraico neste versículo.
- source_word: לְגַן הַמֶּלֶךְ
  choice: junto ao jardim do rei
  rationale: Na descrição topográfica, לְ pode indicar relação espacial ou proximidade; “junto a” é natural no contexto.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹות
  choice: até as escadas que descem
  rationale: מַעֲלוֹת pode referir-se a degraus ou escadas, enquanto o particípio הַיּוֹרְדֹות explicita que descem.
- source_word: מֵעִיר דָּוִיד
  choice: da Cidade de Davi
  rationale: A preposição מִן indica a origem do percurso das escadas; “da Cidade de Davi” conserva essa relação geográfica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas familiares ao leitor lusófono. A repetição de possessivos foi mantida onde ajuda a reproduzir a enumeração arquitetônica do hebraico; o pronome enfático foi vertido por “Ele mesmo”.
