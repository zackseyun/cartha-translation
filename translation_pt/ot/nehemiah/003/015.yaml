- from: Salum, filho de Col-Hozé, chefe do distrito de Mispá, fez reparos na Porta da Fonte. Ele mesmo a reconstruiu, colocou-lhe a cobertura e instalou suas portas, seus ferrolhos e suas trancas. Também reparou o muro do tanque de Selá[a], junto ao jardim do rei, até as escadas que descem da Cidade de Davi.
  to: Salum, filho de Col-Hozé, chefe do distrito de Mispá, fez reparos na Porta da Fonte. Ele mesmo a reconstruiu e colocou-lhe a cobertura; foram instaladas suas portas, seus ferrolhos e suas trancas. Também reparou o muro do tanque de Selá[a], junto ao jardim do rei, até as escadas que descem da Cidade de Davi.
  rationale: A única revisão necessária é a representação da forma verbal plural no trecho relativo à instalação das portas e dos mecanismos de fechamento. «Foram instaladas» mantém o sentido e a pluralidade do hebraico sem especular quem são os executores. A nota e os demais elementos da tradução podem permanecer.
