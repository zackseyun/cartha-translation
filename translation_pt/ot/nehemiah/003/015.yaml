    text: Ou “tanque de Siloé” (tradicionalmente associado a Siloam). O topônimo hebraico aqui é Selá.
    reason: alternative_reading
  revision_rationale: A única revisão necessária é a representação da forma verbal plural no trecho relativo à instalação das portas e dos mecanismos de fechamento. «Foram instaladas» mantém o sentido e a pluralidade do hebraico sem especular quem são os executores. A nota e os demais elementos da tradução podem permanecer.
