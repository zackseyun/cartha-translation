base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: pt
  text: Ao lado deles, Jedaías, filho de Harumafe, fez reparos diante de sua casa[a]; e, ao lado dele, Hatus, filho de Hasabneias, fez reparos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente de sua casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Ao lado deles
  rationale: A expressão idiomática עַל יָד com sufixo indica adjacência na sequência de trabalhadores de Neemias 3. “Ao lado deles” é natural em português e mantém o sentido topográfico.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Neste capítulo, o hifil de חזק funciona como expressão técnica para o trabalho de restauração da muralha. “Fez reparos” comunica claramente essa atividade e preserva a fórmula repetida.
- source_word: יְדָיָה
  choice: Jedaías
  rationale: Transliteração do nome hebraico segundo forma corrente em português bíblico.
- source_word: בֶן חֲרוּמַף
  choice: filho de Harumafe
  rationale: A construção genealógica foi traduzida diretamente, com transliteração do nome próprio.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: diante de sua casa
  rationale: נֶגֶד indica uma posição em frente ou defronte de algo. “Diante de sua casa” é natural e mantém a relação espacial sem definir indevidamente se o trecho ficava exatamente oposto ou apenas na frente da casa.
- source_word: וְעַל יָדוֹ
  choice: e, ao lado dele
  rationale: A mesma expressão de adjacência aparece com sufixo singular, referindo-se a Jedaías. A tradução conserva a repetição estrutural do hebraico.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Transliteração do nome próprio hebraico em forma legível e corrente em português.
- source_word: בֶן חֲשַׁבְנְיָה
  choice: filho de Hasabneias
  rationale: Tradução direta da relação filial, com transliteração do nome próprio.
