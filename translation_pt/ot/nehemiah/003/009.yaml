  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: pt
  text: Ao lado deles, Refaías, filho de Hur, chefe de metade do distrito de Jerusalém, fez reparos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortaleceu”. O verbo hebraico significa literalmente “tornou forte”, mas neste capítulo é usado para o trabalho de reparação da muralha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Ao lado deles
  rationale: A expressão idiomática indica a posição da equipe seguinte ao longo da muralha e mantém a progressão da lista de trabalhadores.
- source_word: הֶחֱזִיק
  choice: fez reparos
  rationale: Embora o hifil de חזק signifique literalmente “tornou forte” ou “fortaleceu”, em Neemias 3 o verbo é usado no contexto do trabalho de restauração da muralha. “Fez reparos” comunica naturalmente esse sentido sem apagar a alternativa lexical, registrada em nota.
- source_word: רְפָיָה
  choice: Refaías
  rationale: Transliteração do nome hebraico em forma natural para leitores de língua portuguesa.
- source_word: בֶן חוּר
  choice: filho de Hur
  rationale: Reproduz a expressão patronímica hebraica de maneira direta.
- source_word: שַׂר
  choice: chefe
  rationale: O termo designa alguém em posição de autoridade administrativa. “Chefe” é claro e não acrescenta uma estrutura governamental mais específica do que o hebraico exige.
- source_word: חֲצִי פֶּלֶךְ
  choice: metade do distrito
  rationale: פֶלֶךְ designa aqui uma divisão administrativa; “distrito” é adequado para essa subdivisão, e “metade” preserva a organização territorial indicada pelo texto.
- source_word: יְרוּשָׁלִָם
  choice: de Jerusalém
  rationale: Emprega a forma portuguesa tradicional do topônimo e expressa sua relação com o distrito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Chefe” evita a possível especificidade excessiva de “governador”, enquanto “fez reparos” expressa o uso contextual do verbo. O marcador da nota foi colocado após a expressão verbal à qual a alternativa lexical se refere.
