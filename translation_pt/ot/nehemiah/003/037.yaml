reference: Nehemiah 3:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: pt
  text: Não encubras a culpa deles[a], nem permitas que o pecado deles seja apagado de diante de ti, pois provocaram ira diante dos construtores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não perdoes a iniquidade deles”. A imagem hebraica é a de não encobrir a culpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “provocaram-te à ira diante dos construtores”. O hebraico não declara expressamente quem foi provocado à ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכַס עַל עֲוֺנָם
  choice: encubras a culpa deles
  rationale: “Encobrir” preserva a imagem hebraica de cobrir a culpa e, neste contexto, também pode comunicar a ideia de não a relevar nem perdoar.
- source_word: עֲוֺנָם
  choice: a culpa deles
  rationale: עָוֹן pode indicar iniquidade, culpa ou a consequência da culpa. “Culpa” mantém o peso moral e distingue o termo de “pecado” no membro paralelo.
- source_word: חַטָּאתָם
  choice: o pecado deles
  rationale: É a equivalência direta e natural para חַטָּאת neste paralelismo.
- source_word: מִלְּפָנֶיךָ
  choice: de diante de ti
  rationale: Mantém a imagem espacial e relacional de algo presente diante de Deus, sem reduzi-la apenas a memória ou conhecimento.
- source_word: תִּמָּחֶה
  choice: seja apagado
  rationale: O verbo passivo comunica a remoção ou eliminação do pecado de diante de Deus e preserva a imagem hebraica.
- source_word: הִכְעִיסוּ
  choice: provocaram ira
  rationale: O hifil expressa causar ou provocar ira. Como o objeto não é declarado no hebraico, a tradução também não o especifica no texto principal.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: diante dos construtores
  rationale: לְנֶגֶד indica mais diretamente posição ou presença diante de alguém; “construtores” identifica com clareza os que reconstruíam o muro.
theological_decisions:
- issue: Linguagem imprecatória a respeito do pecado dos inimigos
  choice: Manter o pedido direto para que Deus não encubra a culpa nem apague o pecado deles.
  alternative: Abrandar para algo como “não ignores o mal que fizeram”.
  rationale: O hebraico contém uma petição imprecatória explícita. A severidade e a tensão teológica do pedido devem ser preservadas, sem suavização doutrinária.
- issue: Objeto implícito de הִכְעִיסוּ
  choice: Não explicitar no texto principal quem foi provocado à ira.
  alternative: “Provocaram-te à ira diante dos construtores.”
  rationale: Embora Deus seja um objeto implícito plausível no contexto, o hebraico não o declara. A formulação escolhida preserva essa concisão e a ambiguidade genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Encobrir a culpa” conserva a imagem do original; “diante dos construtores” é conciso e próximo da expressão hebraica.
