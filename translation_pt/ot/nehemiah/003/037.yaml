  source_fidelity: O texto preserva com precisão os dois pedidos negativos, o paralelismo entre culpa e pecado, a imagem de apagar o pecado de diante de Deus e a formulação concisa de que eles «provocaram ira». «Diante dos construtores» reproduz adequadamente o valor locativo/público de לְנֶגֶד הַבּוֹנִים, sem transformar a expressão em hostilidade direta contra eles.
  naturalness: A redação é clara, solene e compreensível em português atual. «Não encubras» é uma forma literária adequada à oração dirigida a Deus; «seja apagado de diante de ti» conserva uma imagem bíblica inteligível.
  terminology: «Culpa» para עָוֹן e «pecado» para חַטָּאת mantêm de modo útil a distinção do paralelismo. «Encubras» conserva a metáfora hebraica sem eliminar a implicação de perdão, explicada corretamente na nota. A nota b assinala apropriadamente que o objeto de «provocaram ira» não está expresso no hebraico.
