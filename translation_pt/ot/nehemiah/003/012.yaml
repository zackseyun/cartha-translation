  text: וְ/עַל יָד֣/וֹ הֶחֱזִ֗יק שַׁלּוּם֙ בֶּן הַלּוֹחֵ֔שׁ שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ יְרוּשָׁלִָ֑ם ה֖וּא וּ/בְנוֹתָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: pt
  text: Ao lado dele, Salum, filho de Haloés[a], responsável por metade do distrito de Jerusalém, fez os reparos, ele e suas filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E junto dele, Salum, filho de Haloés, fez os reparos”. A expressão hebraica literalmente se refere ao trabalho feito “junto à sua mão”, isto é, ao lado do trecho do trabalhador anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Ao lado dele
  rationale: A expressão idiomática indica que o trabalho foi realizado junto ao trecho do trabalhador mencionado anteriormente; esta formulação preserva o sentido topográfico em português natural.
- source_word: הֶחֱזִיק
  choice: fez os reparos
  rationale: Neste capítulo, o hifil de חזק descreve a participação na restauração da muralha; a expressão comunica o sentido contextual sem a possível ambiguidade de 'fortaleceu'.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: filho de Haloés
  rationale: O patronímico e o nome próprio são preservados por transliteração adaptada ao português.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: responsável por metade do distrito de Jerusalém
  rationale: שַׂר designa uma autoridade ou dirigente, enquanto פֶּלֶךְ se refere aqui a uma divisão administrativa. 'Responsável' é claro e evita sugerir soberania régia.
- source_word: הוּא וּבְנֹתָיו
  choice: ele e suas filhas
  rationale: Mantém a construção enfática e a menção explícita da participação das filhas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe conserva a sequência topográfica do capítulo e a participação explícita das filhas.
