base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: pt
  text: 'Ele falou diante de seus irmãos e do exército de Samaria e disse: “O que esses judeus fracos estão fazendo? Será que vão reconstruí-la para si mesmos?[a] Será que vão oferecer sacrifícios? Será que vão terminar em um só dia? Será que vão fazer reviver as pedras tiradas dos montes de pó, embora estejam queimadas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é difícil. Outras traduções possíveis são: “Será que vão reconstruí-la sozinhos?” ou, mais literalmente, “Será que a deixarão para si mesmos?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: diante de seus irmãos
  rationale: לִפְנֵי indica que ele falou na presença deles; אֶחָיו significa literalmente “seus irmãos” e pode designar aqui seus associados, mas a formulação literal continua natural em português.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: e do exército de Samaria
  rationale: חֵיל pode designar força, tropas ou exército; “exército” se ajusta ao contexto militar e é claro em português corrente.
- source_word: הָאֲמֵלָלִים
  choice: fracos
  rationale: O adjetivo é depreciativo e retrata os judeus como débeis ou dignos de pena. “Fracos” preserva claramente o insulto no contexto da zombaria.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Será que vão reconstruí-la para si mesmos?
  rationale: A expressão é lexicalmente difícil, pois עזב normalmente significa “deixar” ou “abandonar”. O contexto favorece uma pergunta sarcástica sobre restaurar a muralha por conta própria ou em benefício próprio; a nota registra alternativas mais literais.
- source_word: הֲיִזְבָּחוּ
  choice: Será que vão oferecer sacrifícios?
  rationale: זבח se refere ao ato de sacrificar. “Oferecer sacrifícios” evita uma leitura ambígua do verbo português e mantém o sentido cultual.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Será que vão terminar em um só dia?
  rationale: כלה no piel significa concluir ou terminar; “em um só dia” expressa naturalmente a incredulidade sarcástica da pergunta.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Será que vão fazer reviver as pedras
  rationale: A forma causativa de חיה significa “fazer viver” ou “reviver”. A escolha conserva a personificação vívida das pedras arruinadas.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: tiradas dos montes de pó
  rationale: עֲרֵמוֹת são montes ou pilhas, e עָפָר é pó ou terra solta. A inclusão natural de “tiradas” esclarece a relação com as pedras sem substituir a imagem por “entulho”.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: embora estejam queimadas
  rationale: A oração descreve o estado das pedras. “Embora” explicita o valor adversativo sugerido pela zombaria, e o feminino plural concorda com “pedras”.
