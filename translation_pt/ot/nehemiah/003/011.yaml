  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: pt
  text: Malquias, filho de Harim, e Hassube, filho de Paate-Moabe, repararam outro trecho[a], bem como a Torre dos Fornos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um segundo trecho”. A expressão hebraica pode ser traduzida mais formalmente assim; neste contexto, refere-se a uma porção adicional destinada ao reparo.
    reason: lexical_alternative
  - marker: b
    text: Ou “Torre das Fornalhas”. O termo hebraico pode se referir a fornos ou fornalhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: outro trecho
  rationale: No contexto da distribuição dos reparos em Neemias 3, a expressão designa mais uma extensão da muralha. “Outro trecho” é natural em português e mantém a ideia de uma porção distinta; a tradução mais formal é registrada em nota.
- source_word: הֶחֱזִיק
  choice: repararam
  rationale: Neste contexto de reconstrução da muralha, o verbo indica reparar ou reforçar. “Repararam” comunica com clareza a ação contextual e concorda com os dois sujeitos.
- source_word: מַלְכִּיָה
  choice: Malquias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶן חָרִם
  choice: filho de Harim
  rationale: Reprodução direta e clara da construção filial hebraica.
- source_word: וְחַשּׁוּב
  choice: e Hassube
  rationale: A conjunção é preservada, e o nome recebe transliteração legível em português.
- source_word: בֶּן פַּחַת מוֹאָב
  choice: filho de Paate-Moabe
  rationale: O nome composto de família ou clã é preservado em forma aportuguesada e hifenizada.
- source_word: וְאֵת
  choice: bem como
  rationale: A expressão introduz um segundo objeto reparado. “Bem como” torna natural e explícita a força aditiva sem alterar o sentido.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: a Torre dos Fornos
  rationale: A tradução conserva a imagem concreta e o caráter de topônimo; תַּנּוּרִים pode designar fornos ou fornalhas, possibilidade assinalada em nota.
