base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: pt
  text: Malquias, filho de Recabe, chefe do distrito de Bete-Haquerém, reparou a Porta do Esterco.[a] Ele a construiu e colocou no lugar suas portas, seus ferrolhos e suas barras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Porta do Lixo”. O nome hebraico se refere a esterco ou resíduos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: reparou
  rationale: Em Neemias 3, o verbo funciona como termo recorrente para assumir e executar o conserto de uma parte da muralha; “reparou” é natural e adequado ao contexto.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Porta do Esterco
  rationale: אַשְׁפּוֹת designa esterco ou resíduos. “Porta do Esterco” preserva o sentido concreto e corresponde ao nome tradicionalmente reconhecível do portão.
- source_word: שַׂר פֶּלֶךְ
  choice: chefe do distrito
  rationale: שַׂר indica uma autoridade ou dirigente, e פֶּלֶךְ, uma circunscrição administrativa; “chefe do distrito” comunica a função em português atual sem especificidade indevida.
- source_word: בֵּית הַכָּרֶם
  choice: Bete-Haquerém
  rationale: O topônimo é transliterado, e não traduzido; a forma escolhida segue padrões familiares de transliteração bíblica em português.
- source_word: הוּא יִבְנֶנּוּ
  choice: Ele a construiu
  rationale: בנה significa diretamente “construir”. Embora o contexto seja de restauração, “construiu” evita acrescentar explicitamente a ideia de repetição; o pronome expresso הוּא é preservado por “Ele”.
- source_word: וְיַעֲמִיד
  choice: colocou no lugar
  rationale: O hifil de עמד indica aqui pôr ou instalar os componentes do portão; “colocou no lugar” é claro e natural.
- source_word: דַּלְתֹתָיו
  choice: suas portas
  rationale: O plural refere-se às folhas ou portas que fechavam o portão; “suas portas” é a formulação mais direta.
- source_word: מַנְעֻלָיו
  choice: seus ferrolhos
  rationale: O termo designa peças usadas para fechar ou prender as portas; “ferrolhos” distingue adequadamente esse elemento das barras de segurança.
- source_word: וּבְרִיחָיו
  choice: suas trancas
  rationale: בְּרִיחַ designa uma barra usada para assegurar uma porta ou portão; “trancas” é uma expressão corrente e compreensível em português.
