  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: pt
  text: Depois dele, os sacerdotes, homens da planície[a], fizeram reparos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “distrito” ou “região ao redor”. O hebraico כִּכָּר pode designar uma planície ou um distrito circular; aqui, a referência geográfica exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Depois dele
  rationale: Expressa naturalmente a sequência da lista de construtores; o וְ inicial não precisa ser reproduzido separadamente em português.
- source_word: הֶחֱזִיקוּ
  choice: fizeram reparos
  rationale: Neste capítulo, o verbo funciona como expressão contextual para participar do trabalho de restauração da muralha, e não no sentido literal de 'agarrar'.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido no plural.
- source_word: אַנְשֵׁי
  choice: homens da
  rationale: Preserva o sentido masculino plural da forma construta hebraica e indica a procedência geográfica do grupo.
- source_word: הַכִּכָּר
  choice: planície
  rationale: כִּכָּר pode designar uma planície ou região circular; 'planície' mantém a imagem geográfica concreta sem determinar uma localização que o contexto não identifica com certeza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. A aposição 'homens da planície' preserva a estrutura do hebraico e a incerteza quanto à origem geográfica dos sacerdotes.
