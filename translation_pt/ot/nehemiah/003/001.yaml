language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: pt
  text: Então Eliasibe, o sumo sacerdote, levantou-se com seus irmãos, os sacerdotes, e eles construíram a Porta das Ovelhas. Eles a consagraram[a] e colocaram suas portas no lugar; consagraram-na até a Torre dos Cem, até a Torre de Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dedicaram». O verbo hebraico pode indicar que algo foi separado como santo ou destinado de modo especial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: Preserva o idioma hebraico que assinala o início da ação, sem recorrer à interpretação mais específica «pôs-se a trabalhar».
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É o título consagrado em português para o principal sacerdote de Israel.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: com seus irmãos, os sacerdotes
  rationale: Mantém o termo de parentesco ou solidariedade do hebraico e a aposição que identifica esses irmãos como sacerdotes.
- source_word: וַיִּבְנוּ
  choice: reconstruíram
  rationale: No contexto da restauração da muralha e de seus portões, «reconstruíram» comunica naturalmente que se reparava uma estrutura anterior, sem alterar o sentido básico de construir.
- source_word: שַׁעַר הַצֹּאן
  choice: a Porta das Ovelhas
  rationale: Forma portuguesa clara e tradicional para o nome próprio do portão, preservando a imagem concreta do hebraico.
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome independente é expresso de modo explícito em português; o contexto já destaca os sacerdotes como agentes, sem exigir a formulação mais pesada «eles mesmos».
- source_word: קִדְּשׁוּהוּ
  choice: a consagraram / consagraram-na
  rationale: Preserva a ideia religiosa de separar como santo ou destinar especialmente, mantendo o pronome singular que retoma a porta.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: colocaram suas portas no lugar
  rationale: Expressa de modo natural a instalação das folhas do portão sem especificar um mecanismo que o hebraico não explicita.
- source_word: מִגְדַּל הַמֵּאָה
  choice: a Torre dos Cem
  rationale: Reproduz de maneira transparente o nome hebraico, cuja referência exata não é explicitada no texto.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: a Torre de Hananel
  rationale: Traduz o título e translitera o nome próprio de forma natural em português.
- source_word: וְעַד ... עַד
  choice: até ... até
  rationale: Mantém a repetição hebraica que delimita a extensão da obra consagrada.
theological_decisions:
- issue: Sentido cultual de קדשׁ aplicado ao portão
  choice: consagraram
  alternative: dedicaram
  rationale: «Consagraram» conserva a nuance de separar como santo, apropriada à atuação dos sacerdotes, sem afirmar além do que o verbo hebraico permite.
- issue: Referente do sufixo singular em קִדְּשׁוּהוּ
  choice: A tradução retoma «a Porta das Ovelhas» com o pronome feminino singular.
  alternative: Entender a segunda ocorrência como referência implícita ao trecho da muralha.
  rationale: A forma hebraica traz objeto singular masculino e o antecedente gramatical explícito mais próximo é שַׁעַר, «portão»; em português, o gênero passa a ser feminino por causa de «porta». A formulação preserva a construção do texto, embora a extensão até as torres possa abranger o setor adjacente da muralha.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Empregam-se «sumo sacerdote» e os nomes tradicionais dos lugares. A repetição de «consagraram» e «até» foi mantida por refletir a estrutura e a ênfase do hebraico.
