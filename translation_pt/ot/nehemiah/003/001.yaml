  source_fidelity: A tradução acompanha adequadamente o hebraico quanto aos agentes, ao título «sumo sacerdote», à Porta das Ovelhas, à consagração, à instalação das portas e à extensão indicada pelas duas torres. Contudo, «reconstruíram» para וַיִּבְנוּ acrescenta a noção de reconstrução, que o verbo hebraico אומר simplesmente «construíram». O contexto mais amplo pode envolver restauração, mas este versículo não especifica isso.
  naturalness: O português é claro, atual e de registro apropriado. «Colocaram suas portas no lugar» é natural e não especifica indevidamente o modo de instalação. A repetição de «consagraram» e «até» preserva bem a forma enfática do texto.
  terminology: «Eliasibe», «sumo sacerdote», «Porta das Ovelhas», «Torre dos Cem» e «Torre de Hananel» são escolhas claras e adequadas. «Consagraram» preserva a nuance cultual de קדשׁ; a alternativa «dedicaram» cabe em nota.
