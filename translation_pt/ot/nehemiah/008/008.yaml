base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/008.yaml
  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: pt
  text: Eles leram no livro, na Lei de Deus, com clareza[a], explicando o sentido, para que o povo entendesse o que era lido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de modo distinto”. O termo hebraico pode indicar uma leitura clara, a explicação que torna o texto compreensível ou, possivelmente, sua tradução para os ouvintes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Eles leram
  rationale: Com um texto escrito como objeto, קרא tem aqui o sentido normal de ler, no contexto de leitura pública.
- source_word: בַּסֵּפֶר
  choice: no livro
  rationale: A preposição ב pode indicar o texto no qual se lê; “leram no livro” é uma formulação natural em português e preserva a construção hebraica.
- source_word: בְּתוֹרַת הָאֱלֹהִים
  choice: na Lei de Deus
  rationale: תּוֹרָה pode significar instrução, mas aqui designa concretamente o texto da Lei divina lido à comunidade; a repetição de “na” conserva a aposição do hebraico.
- source_word: מְפֹרָשׁ
  choice: com clareza
  rationale: O termo sugere tornar distinto ou claro, sem determinar se isso ocorreu por dicção, explicação ou tradução; a nota preserva essas possibilidades.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: explicando o sentido
  rationale: O idioma, literalmente relacionado a “pôr entendimento”, descreve a ação de comunicar o sentido do texto. A forma participial portuguesa integra naturalmente a sequência.
- source_word: וַיָּבִינוּ
  choice: para que o povo entendesse
  rationale: O contexto identifica o povo como beneficiário da leitura e explicação. A formulação resultativa/final reproduz o fluxo, embora o hebraico também possa ser entendido coordenadamente.
- source_word: בַּמִּקְרָא
  choice: o que era lido
  rationale: מִקְרָא pode designar a leitura pública ou seu conteúdo; “o que era lido” comunica ambos de modo claro em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui o corpo textual específico, não como imposição denominacional. A ambiguidade de מְפֹרָשׁ é mantida no texto e explicitada em nota.
