source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: pt
  text: E leu do livro, diante da praça que ficava em frente ao Portão das Águas, desde o amanhecer[a] até o meio-dia, na presença dos homens, das mulheres e dos que podiam entender[b]. Os ouvidos de todo o povo estavam atentos ao Livro[c] da Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “desde a luz”; também pode ser traduzido por “desde a alvorada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que tinham entendimento”, provavelmente todos os que já tinham idade suficiente para compreender a leitura.
    reason: lexical_alternative
  - marker: c
    text: “Livro” também pode ser traduzido por “rolo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: ele leu nele
  rationale: No contexto, קרא designa a leitura pública do texto, e בּוֹ retoma o livro mencionado anteriormente. “Leu nele” conserva de modo natural a construção hebraica e sua referência.
- source_word: לִפְנֵי הָרְחוֹב
  choice: diante da praça
  rationale: רְחוֹב indica um espaço público aberto, adequadamente expresso por “praça”; לִפְנֵי é mantido como “diante de” sem redefinir a relação espacial.
- source_word: שַׁעַר הַמַּיִם
  choice: Portão das Águas
  rationale: Tradução transparente do nome do local, com iniciais maiúsculas por se tratar de uma designação própria.
- source_word: מִן הָאוֹר
  choice: desde o amanhecer
  rationale: A expressão significa literalmente “desde a luz”, mas aqui funciona como indicação temporal da primeira luz do dia. “Desde o amanhecer” é claro e idiomático.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: até o meio-dia
  rationale: A expressão hebraica, literalmente “até a metade do dia”, refere-se ao meio do dia.
- source_word: נֶגֶד
  choice: na presença de
  rationale: Neste contexto, a preposição apresenta a assembleia diante da qual a leitura ocorreu. “Na presença de” comunica essa relação com clareza.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים
  choice: dos homens, das mulheres
  rationale: Mantém os dois grupos explicitamente nomeados pelo hebraico, sem reduzi-los a uma referência genérica.
- source_word: וְהַמְּבִינִים
  choice: e dos que podiam entender
  rationale: O particípio de בין descreve pessoas capazes de compreender a leitura, possivelmente incluindo crianças com idade suficiente para acompanhá-la.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Os ouvidos de todo o povo estavam atentos a
  rationale: Preserva a imagem concreta dos “ouvidos” voltados para o texto, tornando o idioma hebraico compreensível em português.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Livro da Lei
  rationale: סֵפֶר pode designar livro, rolo ou documento; “Livro” é claro e tradicional. Neste contexto, תּוֹרָה se refere ao corpo escrito e autorizado da instrução pactual, para o qual “Lei” é a designação mais transparente.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto da leitura pública da aliança
  choice: Lei
  alternative: instrução; Torá
  rationale: Embora תּוֹרָה possa significar “instrução”, em Neemias 8 designa o corpo escrito e autorizado lido à comunidade. “Lei” comunica melhor essa referência ao leitor geral, sem negar a amplitude semântica do termo.
- issue: Representação dos grupos presentes na assembleia
  choice: os homens, as mulheres e os que podiam entender
  alternative: todos os que eram capazes de entender
  rationale: O hebraico menciona homens e mulheres separadamente e acrescenta um grupo definido pela capacidade de compreensão. A tradução mantém essas distinções sem presumir com certeza a idade ou a identidade do terceiro grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem hebraica dos ouvidos atentos e mantém a ambiguidade de וְהַמְּבִינִים, sem identificar categoricamente o grupo como crianças. Os marcadores de nota foram colocados junto aos termos que efetivamente explicam.
