  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: pt
  text: Todo o povo se reuniu como um só homem[a] na praça diante da Porta das Águas e disse a Esdras, o escriba, que trouxesse o Livro da Lei de Moisés, que Yahweh havia ordenado a Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um só homem”, expressão que significa “como um só” ou “em plena unidade”.'
    reason: Explica o sentido idiomático sem retirar do texto principal sua imagem literal.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל־הָעָם
  choice: Todo o povo se reuniu
  rationale: O nifal de אסף descreve a comunidade vindo e reunindo-se; o singular coletivo em português concorda naturalmente com “todo o povo”.
- source_word: כְּאִישׁ אֶחָד
  choice: como um só homem
  rationale: Preserva de perto a imagem masculina singular do idioma hebraico e sua ênfase na ação unida; a nota esclarece o sentido idiomático.
- source_word: אֶל־הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמָּיִם
  choice: na praça diante da Porta das Águas
  rationale: רְחוֹב designa um espaço público aberto; “na praça” é locativamente natural em português, e “diante de” traduz claramente לִפְנֵי.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא הַסֹּפֵר לְהָבִיא
  choice: disse ao escriba Esdras que trouxesse
  rationale: A construção portuguesa com “disse... que trouxesse” reproduz a ordem ou solicitação expressa por אמר seguido do infinitivo, sem acrescentar uma nuance explícita de cortesia.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: o Livro da Lei de Moisés
  rationale: סֵפֶר pode indicar livro ou rolo; a formulação tradicional e clara mantém a relação construta sem decidir questões de autoria além do texto.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: que Yahweh havia ordenado a Israel
  rationale: Mantém Israel como complemento de צוה, conforme a sintaxe hebraica comprimida, e preserva a possível referência relativa à Lei, sem explicitar mais do que o original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de כְּאִישׁ אֶחָד
  choice: como um só homem
  alternative: como se fossem um só; em plena unidade
  rationale: A tradução principal preserva a imagem concreta do hebraico, enquanto a nota comunica seu sentido de unidade sem apagar a forma original.
- issue: Referente de אֲשֶׁר em “que Yahweh havia ordenado a Israel”
  choice: manter a construção relativa com “Lei de Moisés” como antecedente textual
  alternative: a respeito da qual Yahweh havia dado ordens a Israel; que Yahweh havia prescrito para Israel
  rationale: O hebraico é sintaticamente conciso. A formulação escolhida conserva essa tensão e evita transformar a frase em uma afirmação mais específica sobre autoria ou destinatário.
- issue: Representação do Tetragrama
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome יהוה; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Escriba” e “Porta das Águas” preservam termos bíblicos reconhecíveis; a ordem da frase foi naturalizada sem eliminar a estrutura e as ambiguidades relevantes do hebraico.
