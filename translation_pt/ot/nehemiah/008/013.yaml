base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: pt
  text: No segundo dia, os chefes das famílias[a] de todo o povo, os sacerdotes e os levitas se reuniram com Esdras, o escriba, para compreender as palavras da Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os chefes das casas paternas”; expressão hebraica que se refere aos líderes dos clãs ou das famílias extensas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: O waw mantém a ligação narrativa, mas em português a continuidade é expressa naturalmente sem acrescentar “e” no início.
- source_word: נֶאֶסְפוּ
  choice: se reuniram
  rationale: O nifal plural de אסף tem aqui sentido intransitivo; “se reuniram” é claro e natural.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias
  rationale: A expressão hebraica designa líderes de clãs ou famílias extensas. A formulação escolhida comunica essa função social em português atual sem reproduzir literalmente um idiomatismo obscuro.
- source_word: לְכָל הָעָם
  choice: de todo o povo
  rationale: A expressão caracteriza os chefes como representantes provenientes do conjunto do povo.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: Mantém os dois grupos distintos na enumeração dos que se reuniram.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: com Esdras, o escriba
  rationale: Embora אֶל indique direção para Esdras, “reuniram-se com Esdras” é a construção portuguesa mais natural neste contexto; “escriba” preserva seu título e função reconhecida.
- source_word: וּלְהַשְׂכִּיל
  choice: para compreender melhor
  rationale: O infinitivo hifil de שׂכל expressa a finalidade de alcançar entendimento ou discernimento, não apenas receber informação.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: as palavras da Lei
  rationale: “Palavras” preserva דִּבְרֵי, e “Lei” comunica o sentido contextual de תּוֹרָה como instrução pactual formalmente reconhecida.
