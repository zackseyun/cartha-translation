  source_fidelity: A tradução reproduz adequadamente a estrutura e os participantes da reunião, bem como a finalidade de compreender a Torá. Contudo, “compreender melhor” introduz o comparativo “melhor”, ausente do hebraico; “compreender” expressa a finalidade sem esse acréscimo.
  naturalness: O texto é claro, moderno e natural em português. “Reuniram-se com Esdras” é uma solução idiomática aceitável para a aproximação indicada por אֶל neste contexto.
  terminology: “Chefes das famílias”, “sacerdotes”, “levitas”, “escriba” e “Lei” são escolhas adequadas. A nota, porém, deve corrigir “chefes dos pais”, que não representa de modo inteligível nem preciso a expressão técnica hebraica; ela se refere a chefes de casas paternas, isto é, clãs ou famílias extensas.
