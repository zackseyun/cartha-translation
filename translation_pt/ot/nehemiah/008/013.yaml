    rationale: רָאשֵׁי הָאָבוֹת é uma expressão social e genealógica que designa os chefes das casas paternas/ancestrais. A formulação atual em português soa como se os pais individuais fossem chefiados e não esclarece a construção hebraica.
  - severity: low
