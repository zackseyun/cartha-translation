  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: pt
  text: Ele leu no Livro da Lei de Deus, dia após dia[a], desde o primeiro dia até o último. Eles celebraram a festa durante sete dias[b], e no oitavo dia houve uma assembleia solene, conforme prescrito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todos os dias».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «observaram a festa por sete dias».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «de acordo com a ordenança».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Ele leu
  rationale: O singular hebraico é preservado, distinguindo o leitor da comunidade que celebra; com referência a um texto escrito, קרא indica naturalmente a leitura, provavelmente em voz alta.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: no Livro da Lei de Deus
  rationale: A preposição בְּ com קרא admite em português a construção natural «ler no livro». «Livro» preserva o sentido amplo de סֵפֶר sem especificar indevidamente o formato material.
- source_word: יוֹם בְּיוֹם
  choice: dia após dia
  rationale: Expressa com naturalidade a ação reiterada diariamente e conserva o caráter enfático do idioma hebraico.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: desde o primeiro dia até o último
  rationale: Reproduz claramente todo o intervalo temporal inclusivo indicado pelo hebraico.
- source_word: וַיַּעֲשׂוּ חָג
  choice: Eles celebraram a festa
  rationale: עשה + חג significa realizar, observar ou celebrar uma festa. «Celebraram a festa» é corrente, claro e mantém o sentido cultual.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A inserção idiomática de «durante» esclarece em português a duração da celebração sem acrescentar conteúdo.
- source_word: עֲצֶרֶת
  choice: uma assembleia solene
  rationale: Designa uma reunião sagrada prescrita, ligada ao encerramento da festa; «assembleia solene» preserva seu peso cultual sem impor uma explicação além do texto.
- source_word: כַּמִּשְׁפָּט
  choice: conforme prescrito
  rationale: No contexto, מִשְׁפָּט aponta para a norma estabelecida que regia a celebração; a formulação portuguesa é clara e mantém seu caráter normativo.
theological_decisions:
- issue: Sujeito singular da leitura e sujeito plural da celebração
  choice: Manter «Ele leu» e «Eles celebraram»
  alternative: Uniformizar ambos no plural ou tornar a leitura impessoal
  rationale: As formas verbais hebraicas distinguem intencionalmente o leitor singular da comunidade que observa a festa. A tradução mantém essa diferença sem identificar explicitamente o leitor além do que o versículo diz.
- issue: Caráter cultual de עֲצֶרֶת
  choice: Traduzir por «assembleia solene»
  alternative: «assembleia» ou «assembleia de encerramento»
  rationale: A escolha preserva a natureza sagrada e prescrita da reunião, sem importar desenvolvimentos doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem narrativa e a alternância singular/plural do hebraico foram preservadas. As notas registram alternativas lexicais genuínas sem sobrecarregar o texto principal.
