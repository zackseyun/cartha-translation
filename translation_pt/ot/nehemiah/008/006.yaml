  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: pt
  text: 'Esdras bendisse Yahweh, o grande Deus, e todo o povo respondeu: “Amém! Amém!”[a], levantando as mãos. Então eles se curvaram e adoraram Yahweh com o rosto em terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amém! Amém!” é, em hebraico, uma resposta litúrgica repetida que expressa concordância e confirmação enfáticas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bendisse
  rationale: O piel de ברך, tendo Deus como objeto, indica bendizer a Deus, isto é, dirigir-lhe louvor. “Bendisse” preserva o valor lexical e o idioma bíblico tradicional sem reduzi-lo apenas a “louvou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: o grande Deus
  rationale: A expressão identifica Yahweh, em aposição, como “o grande Deus”; esta formulação é natural em português e mantém a ênfase de גָּדוֹל.
- source_word: וַיַּעֲנוּ
  choice: respondeu
  rationale: ענה introduz aqui a resposta oral coletiva do povo. O singular concorda naturalmente em português com o núcleo coletivo “todo o povo”.
- source_word: אָמֵן אָמֵן
  choice: Amém! Amém!
  rationale: A transliteração conserva a resposta litúrgica de assentimento, e a repetição enfática do hebraico é mantida.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: levantando as mãos
  rationale: A construção indica uma ação concomitante. O gerúndio comunica naturalmente em português que o povo erguia as mãos ao responder.
- source_word: וַיִּקְּדוּ
  choice: se curvaram
  rationale: קדד descreve o ato de abaixar ou inclinar o corpo. “Se curvaram” mantém esta ação distinta do culto indicado pelo verbo seguinte.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: adoraram
  rationale: O verbo denota prostração em adoração. Como o verbo anterior já descreve o movimento corporal, “adoraram” preserva a força cultual sem redundância excessiva.
- source_word: אַפַּיִם אָרְצָה
  choice: com o rosto em terra
  rationale: A expressão idiomática, literalmente com as faces voltadas para a terra, descreve prostração completa. Esta é uma formulação portuguesa clara, digna e concisa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto a sequência hebraica, mas evita rigidez. O marcador [a] foi colocado após “Amém! Amém!”, pois a nota explica essa expressão.
