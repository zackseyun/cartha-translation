base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: pt
  text: 'Então Neemias, o governador[a], Esdras, o sacerdote e escriba, e os levitas que instruíam o povo disseram a todo o povo: “Este dia é santo para Yahweh, o Deus de vocês. Não se lamentem nem chorem”. Pois todo o povo chorava ao ouvir as palavras da Lei[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Tirsata”, título administrativo persa.
    reason: lexical_alternative
  - marker: b
    text: Ou “as palavras da Torá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: o governador
  rationale: O termo é um título administrativo do período persa. A tradução funcional comunica com clareza o cargo de Neemias; a transliteração é preservada em nota.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: o sacerdote e escriba
  rationale: Os dois substantivos designam os papéis de Esdras. A formulação preserva ambos sem sugerir que se trata de duas pessoas.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: os levitas que instruíam o povo
  rationale: O particípio no Hifil de בין indica fazer compreender ou dar entendimento; “instruíam” expressa naturalmente essa função educativa.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: Este dia é santo
  rationale: Mantém a predicação enfática e o sentido religioso de algo separado para Deus.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica que o dia é consagrado a Yahweh; “para” é idiomático em português e preserva essa relação.
- source_word: תִּתְאַבְּלוּ
  choice: se lamentem
  rationale: Expressa o luto e a manifestação de pesar, distinguindo-os do ato específico de chorar mencionado em seguida.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: chorem / chorava
  rationale: “Chorar” é natural, digno e direto em português; o imperfeito “chorava” apresenta a reação coletiva em curso.
- source_word: כְּשָׁמְעָם
  choice: ao ouvir
  rationale: A construção portuguesa expressa de modo natural a concomitância ou ocasião da reação do povo.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: as palavras da Lei
  rationale: No contexto da leitura pública da aliança, “Lei” é claro para leitores gerais; “Torá” permanece como alternativa lexical em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Sentido de קָדוֹשׁ aplicado ao dia
  choice: santo
  alternative: sagrado
  rationale: “Santo” conserva tanto a dedicação cultual do dia quanto sua relação particular com Yahweh, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos participantes e a progressão entre lamento, choro e escuta foram preservadas; o discurso direto usa formas naturais no plural.
