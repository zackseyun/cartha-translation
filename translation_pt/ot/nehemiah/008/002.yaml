reference: Nehemiah 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבִ֣יא עֶזְרָ֣א הַ֠/כֹּהֵן אֶֽת הַ/תּוֹרָ֞ה לִ/פְנֵ֤י הַ/קָּהָל֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה וְ/כֹ֖ל מֵבִ֣ין לִ/שְׁמֹ֑עַ בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: pt
  text: Então o sacerdote Esdras trouxe a Lei diante da assembleia — homens, mulheres e todos os que eram capazes de compreender o que ouviam[a] —, no primeiro dia do sétimo mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que podiam compreender ao ouvir”, isto é, todos os que tinham capacidade de entender a leitura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Então ... trouxe
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém explicitamente o título de Esdras presente no hebraico.
- source_word: הַתּוֹרָה
  choice: a Lei
  rationale: No contexto, refere-se à Lei mosaica lida publicamente. A inicial maiúscula ajuda a indicar esse referente específico sem recorrer ao termo menos transparente “Torá”.
- source_word: לִפְנֵי הַקָּהָל
  choice: diante da assembleia
  rationale: Preserva o caráter público e formal da ocasião sem sugerir necessariamente uma congregação eclesiástica.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: homens, mulheres
  rationale: A formulação portuguesa natural comunica a abrangência da expressão hebraica literalmente construída como “desde homem até mulher”.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: e todos os que eram capazes de compreender o que ouviam
  rationale: Expressa capacidade de compreensão auditiva, e não apenas a faculdade física de ouvir; mantém aberta a inclusão de todos os que já tinham entendimento suficiente.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: no primeiro dia do sétimo mês
  rationale: É a forma idiomática portuguesa da fórmula hebraica de data.
theological_decisions:
- issue: Descrição de gênero do público
  choice: homens, mulheres
  alternative: desde homem até mulher
  rationale: O hebraico nomeia explicitamente ambos os sexos para indicar a extensão da assembleia. A tradução conserva essa abrangência em português natural, sem neutralizá-la.
- issue: Tradução de תּוֹרָה
  choice: a Lei
  alternative: a Torá; a instrução
  rationale: Neste contexto, o termo designa o corpo da Lei mosaica levado para leitura pública. “A Lei” é claro para leitores comuns e preserva o peso pactual do termo.
- issue: Capacidade de compreender
  choice: todos os que eram capazes de compreender o que ouviam
  alternative: todos os que podiam compreender ao ouvir
  rationale: A construção hebraica pode ser vertida de mais de uma forma, mas seu foco é a capacidade de compreender a leitura ouvida. A redação escolhida não fixa uma idade específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A aposição entre travessões esclarece naturalmente a composição da assembleia. “Lei” recebe inicial maiúscula por designar aqui a Lei mosaica específica.
