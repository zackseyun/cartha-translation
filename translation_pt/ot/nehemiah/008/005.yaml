source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: pt
  text: Esdras abriu o livro[a] à vista de todo o povo, pois estava num lugar mais alto do que todo o povo. Quando ele o abriu, todo o povo ficou de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rolo”. A palavra hebraica סֵפֶר pode se referir a um documento escrito em forma de rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: abriu
  rationale: Traduz diretamente o verbo פתח, sem explicitar o ato de desenrolar, que não aparece no hebraico.
- source_word: הַסֵּפֶר
  choice: o livro
  rationale: סֵפֶר pode designar livro, documento escrito ou rolo. “Livro” é natural e tradicional em português; a provável forma física é indicada em nota.
- source_word: לְעֵינֵי
  choice: à vista de
  rationale: Conserva o sentido visual e público da expressão hebraica, literalmente relacionada aos olhos do povo.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: É a tradução direta de כָל הָעָם e preserva a repetição enfática do versículo.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: pois estava num lugar mais alto do que todo o povo
  rationale: Explicita de modo natural que מֵעַל indica elevação física, evitando que “acima do povo” seja entendido como superioridade social.
- source_word: וּכְפִתְחוֹ
  choice: Quando ele o abriu
  rationale: O prefixo כְּ tem valor temporal, “quando/ao”; o pronome retoma naturalmente o livro.
- source_word: עָמְדוּ
  choice: ficou de pé
  rationale: עמד significa estar ou pôr-se de pé. No contexto, “ficou de pé” é português natural e preserva a possível ambiguidade entre permanecer em pé e levantar-se, sem ampliar para “levantou-se”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “todo o povo” foi mantida por corresponder à ênfase do hebraico. “Num lugar mais alto” comunica a elevação física sem sugerir posição hierárquica.
