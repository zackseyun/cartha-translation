source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הָ/עָם֮ וַ/יָּבִיאוּ֒ וַ/יַּעֲשׂוּ֩ לָ/הֶ֨ם סֻכּ֜וֹת אִ֤ישׁ עַל גַּגּ/וֹ֙ וּ/בְ/חַצְרֹ֣תֵי/הֶ֔ם וּ/בְ/חַצְר֖וֹת בֵּ֣ית הָ/אֱלֹהִ֑ים וּ/בִ/רְחוֹב֙ שַׁ֣עַר הַ/מַּ֔יִם וּ/בִ/רְח֖וֹב שַׁ֥עַר אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: pt
  text: Então o povo saiu, trouxe os ramos e fez cabanas[a] para si, cada um no terraço de sua casa, nos seus pátios, nos pátios da casa de Deus, na praça da Porta das Águas[b] e na praça da Porta de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abrigos”. “Cabanas” preserva a ligação com a Festa das Cabanas.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico se refere a uma área pública aberta, ou praça, junto a uma porta da cidade; tradicionalmente, “lugar amplo”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: o povo saiu
  rationale: Reproduz de modo direto e natural a ação narrativa de יצא e o sentido coletivo de הָעָם.
- source_word: וַיָּבִיאוּ
  choice: trouxe os ramos
  rationale: O hifil de בוא significa “trazer”. O objeto está implícito no hebraico e é recuperado do versículo anterior; “os ramos” torna a referência clara sem acrescentar uma nova ideia.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: fez cabanas para si
  rationale: “Cabanas” é uma designação portuguesa reconhecível para as estruturas temporárias da festa e preserva sua ligação com a Festa das Cabanas; “para si” representa לָהֶם.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: cada um no terraço de sua casa
  rationale: אִישׁ tem aqui força distributiva. גָּג designa o teto plano utilizável de uma casa; “terraço de sua casa” comunica essa realidade melhor que o possível sentido moderno de um telhado inclinado.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: nos seus pátios
  rationale: חָצֵר denota um pátio ou área cercada; “pátios” é claro e corrente em português.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: nos pátios da casa de Deus
  rationale: Mantém a forma transparente de בֵּית הָאֱלֹהִים e se refere aos recintos do templo sem substituir a expressão pela interpretação “templo”.
- source_word: וּבִרְחוֹב
  choice: na praça
  rationale: רְחוֹב indica um espaço público aberto, frequentemente situado junto a uma porta da cidade; “praça” é natural e preciso.
- source_word: שַׁעַר הַמַּיִם
  choice: Porta das Águas
  rationale: Trata-se do nome próprio de uma porta da cidade; a forma tradicional é clara e corresponde à construção hebraica.
- source_word: שַׁעַר אֶפְרָיִם
  choice: Porta de Efraim
  rationale: Preserva naturalmente o nome próprio e a relação genitiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluente. O singular coletivo em “o povo saiu, trouxe... e fez” é natural em português, enquanto “cada um” conserva a força distributiva do hebraico. “Terraço de sua casa” explicita a natureza habitável do teto plano antigo sem recorrer a linguagem técnica.
