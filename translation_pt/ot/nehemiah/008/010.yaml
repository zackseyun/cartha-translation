  naturalness: O português é moderno, claro e adequado ao registro solene-festivo. “Alimentos ricos” e “para quem nada foi preparado” são naturais e tornam o sentido mais preciso sem perder fluência.
  terminology: “Santo”, “nosso Senhor”, “Yahweh” e “fortaleza” são escolhas adequadas. “A alegria de Yahweh” preserva corretamente a ambiguidade do construto hebraico; a nota deve apresentar alternativas sem fazer da leitura causal uma explicação necessária.
