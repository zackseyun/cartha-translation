base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: pt
  text: 'Então ele lhes disse: “Vão, comam alimentos ricos, bebam bebidas doces e mandem porções para quem nada foi preparado, pois este dia é santo para o nosso Senhor. Não fiquem tristes, porque a alegria de Yahweh[a] é a fortaleza de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “a alegria de Yahweh” também pode ser entendida como “a alegria em Yahweh” ou “a própria alegria de Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: comidas saborosas
  rationale: O termo designa literalmente coisas gordurosas e, neste contexto festivo, alimentos ricos e especiais. “Comidas saborosas” transmite com naturalidade a ideia de uma refeição abundante, sem sugerir apenas gordura.
- source_word: מַמְתַקִּים
  choice: bebidas doces
  rationale: O substantivo significa coisas doces; com o verbo “beber”, refere-se naturalmente a bebidas doces, sem exigir a especificação mais estreita de vinho.
- source_word: מָנוֹת
  choice: porções
  rationale: No contexto de uma celebração, indica porções de alimento separadas para serem distribuídas.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: a quem não tem nada preparado
  rationale: A expressão se refere à pessoa para quem nenhuma provisão festiva foi preparada. A formulação portuguesa é natural e conserva o sentido do hebraico.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: É a tradução usual e teologicamente significativa para um dia consagrado a Deus.
- source_word: לַאֲדֹנֵינוּ
  choice: para o nosso Senhor
  rationale: אדון funciona aqui como título reverente de Deus; “Senhor” é a equivalência portuguesa normal.
- source_word: תֵּעָצֵבוּ
  choice: não fiquem tristes
  rationale: O verbo expressa tristeza, pesar ou aflição. Esta formulação é clara, atual e adequada ao contraste com a alegria na oração seguinte.
- source_word: חֶדְוַת יְהוָה
  choice: a alegria de Yahweh
  rationale: Preserva a forma do construto hebraico e sua ambiguidade quanto a ser a alegria proveniente de Yahweh, pertencente a ele ou experimentada nele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo pelo título “SENHOR”, distinguindo-o de אֲדֹנֵינוּ no mesmo versículo.
- source_word: מָעֻזְּכֶם
  choice: a fortaleza de vocês
  rationale: O substantivo denota fortaleza, refúgio ou fonte de força. “Fortaleza” conserva a metáfora concreta e é compreensível em português.
theological_decisions:
- issue: Sentido de חֶדְוַת יְהוָה
  choice: a alegria de Yahweh
  alternative: a alegria em Yahweh; a alegria que vem de Yahweh; a alegria de Yahweh no sentido de sua própria alegria
  rationale: O construto hebraico não explicita a relação semântica. A tradução principal mantém essa tensão em vez de escolher silenciosamente uma interpretação.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita confundi-lo com o título אֲדֹנֵינוּ, traduzido como “nosso Senhor”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos plurais foram vertidos com “vocês”, evitando formas regionais ou excessivamente formais. A cadência festiva do hebraico foi preservada por uma sequência direta de verbos.
