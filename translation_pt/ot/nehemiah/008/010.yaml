    issue: “Comidas saborosas” para מַשְׁמַנִּים
    rationale: O termo não indica meramente alimentos gostosos, mas coisas gordurosas no sentido de ricas, escolhidas ou abundantes, próprias de uma refeição festiva. “Alimentos ricos” conserva melhor essa nuance.
  - severity: medium
    issue: “a quem não tem nada preparado” para לְאֵין נָכוֹן לוֹ
    rationale: A formulação pode atribuir à pessoa a falta de preparo. O hebraico descreve alguém para quem nenhuma provisão está pronta. “Para quem nada foi preparado” exprime essa relação de modo mais direto.
  - severity: low
