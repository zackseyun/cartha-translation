base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: pt
  text: Jesuá, Bani, Serebias, Jamim, Acube, Sabetai, Hodias, Maaseias, Quelita, Azarias, Jozabade, Hanã, Pelaías e os levitas ajudavam o povo a entender a Lei[a], enquanto o povo permanecia em seu lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “explicavam a Lei ao povo”. O verbo hebraico está na forma causativa: eles faziam o povo entender a Lei.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto o povo estava de pé em seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: Jesua, Bani, Serebias, Jamim, Acube, Sabetai, Hodias, Maaseias, Quelita, Azarias, Jozabade, Hanã, Pelaías
  rationale: Os nomes pessoais são transliterados em formas correntes e legíveis em português, sem traduzir seus significados.
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: Mantém diretamente a conjunção e o substantivo do hebraico, sem decidir se os homens nomeados constituem todo o grupo ou parte dele.
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: ajudavam o povo a entender a Lei
  rationale: O particípio Hifil de בין expressa ação causativa, isto é, fazer entender. A formulação comunica esse valor com naturalidade e preserva a ligação com a Lei.
- source_word: לַתּוֹרָה
  choice: a Lei
  rationale: Neste contexto de leitura pública da instrução da aliança, 'a Lei' é claro e reconhecível, embora o termo hebraico também possa significar 'instrução' ou designar a Torá.
- source_word: וְהָעָם עַל עָמְדָם
  choice: enquanto o povo permanecia em seu lugar
  rationale: Expressa de modo natural o sentido idiomático de o povo continuar em sua posição ou lugar durante a explicação.
theological_decisions: []
