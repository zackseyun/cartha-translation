base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: pt
  text: Então todo o povo saiu para comer e beber, enviar porções de alimento[a] e celebrar com grande alegria, porque havia entendido as palavras que lhes tinham sido dadas a conhecer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, enviar porções de alimento a outras pessoas como parte da celebração da festa.
    reason: Esclarece o sentido contextual de מָנוֹת e a finalidade social do envio, indicada pelo versículo anterior.
  - marker: b
    text: 'Ou: «que lhes tinham sido explicadas». «Palavras» também pode ser entendido como «coisas» ou «assuntos».'
    reason: Preserva a amplitude de דְּבָרִים («palavras» ou «coisas/assuntos») e indica a alternativa contextual para הוֹדִיעוּ («fizeram saber», «deram a conhecer»).
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: Então todo o povo foi
  rationale: A forma narrativa indica a saída do povo para realizar as ações seguintes. Em português, “foi” expressa isso naturalmente; “então” mantém a progressão narrativa sem tornar explícito demais o afastamento da assembleia.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: comer e beber
  rationale: Tradução direta e idiomática dos infinitivos de propósito.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: enviar porções de comida
  rationale: מָנוֹת são porções designadas e, neste contexto festivo, porções de alimento enviadas a outras pessoas. A explicitação “de comida” evita que “porções” soe vaga em português.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: celebrar com grande alegria
  rationale: A expressão literalmente fala em “fazer grande alegria”; esta formulação conserva a intensidade e soa natural em português atual.
- source_word: כִּי הֵבִינוּ
  choice: porque havia entendido
  rationale: 'Mantém a relação causal explícita: a celebração decorreu da compreensão. O singular concorda naturalmente com o coletivo “todo o povo” em português.'
- source_word: בַּדְּבָרִים
  choice: as palavras
  rationale: דְּבָרִים pode significar “palavras” ou “assuntos”. O contexto da leitura e instrução favorece “palavras”, sem eliminar a alternativa na nota.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: que lhes tinham sido explicadas
  rationale: O hiphil de ידע significa fazer saber ou dar conhecimento. “Explicadas” é natural no contexto de instrução e preserva o fato de que o conteúdo foi tornado compreensível, embora “dadas a conhecer” seja uma alternativa mais formal.
theological_decisions:
- issue: Natureza da resposta do povo à Lei
  choice: A grande alegria é apresentada como resultado da compreensão das palavras comunicadas.
  alternative: Interpretar a alegria especificamente como arrependimento transformado em celebração ou como renovação formal da aliança.
  rationale: O versículo afirma apenas o vínculo causal entre compreender e celebrar. A tradução não acrescenta uma construção doutrinária que o texto não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. A sintaxe evita literalismos pouco idiomáticos, mas conserva a sequência das ações e a relação causal do hebraico.
