  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: pt
  text: 'e que proclamassem e fizessem circular a mensagem por todas as suas cidades e em Jerusalém, dizendo: “Saiam para a região montanhosa e tragam ramos de oliveira, de árvore de azeite[a], de murta, de palmeira e de outras árvores frondosas, para fazer cabanas[b], conforme está escrito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oliveira-brava” ou “eleagno”. O hebraico diz literalmente “árvore de azeite”, mas a identificação exata da espécie é incerta.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “folhas de oliveira [...] folhas de murta [...]”. Emprega-se “ramos” no texto porque, em português, essa palavra expressa com mais naturalidade o material recolhido para construir as cabanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: e que
  rationale: Dá continuidade ao conteúdo encontrado escrito na Lei no versículo anterior, preservando tanto a conjunção quanto a relação sintática.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: proclamassem e fizessem circular a mensagem
  rationale: Expressa de modo natural a proclamação pública e o idioma hebraico de fazer uma voz ou anúncio percorrer determinado território.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: por todas as suas cidades e em Jerusalém
  rationale: A preposição 'por' combina naturalmente com a ideia de circulação da mensagem, enquanto 'em' indica sua proclamação em Jerusalém.
- source_word: צְאוּ הָהָר
  choice: Saiam para a região montanhosa
  rationale: הָהָר pode designar o monte ou a região serrana; neste contexto de coleta de folhagem, a referência geográfica mais ampla é natural.
- source_word: עֲלֵי זַיִת
  choice: ramos de oliveira
  rationale: Embora עֲלֵי signifique literalmente 'folhas de', o contexto trata do material vegetal recolhido para construir cabanas; 'ramos' comunica isso com naturalidade em português.
- source_word: עֵץ שֶׁמֶן
  choice: árvore-do-azeite
  rationale: Mantém de perto a expressão hebraica sem afirmar uma identificação botânica incerta; as alternativas são registradas em nota.
- source_word: הֲדַס
  choice: murta
  rationale: Equivalente português corrente para essa planta.
- source_word: תְמָרִים
  choice: palmeira
  rationale: No contexto regido por 'ramos de', designa naturalmente ramos de palmeira.
- source_word: עֵץ עָבֹת
  choice: outras árvores frondosas
  rationale: עָבֹת indica folhagem espessa ou densa; 'frondosas' preserva essa característica, e 'outras' deixa claro o caráter geral da categoria após as espécies nomeadas.
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: para fazer cabanas
  rationale: סֻכּוֹת são abrigos temporários feitos para a festa; 'cabanas' é claro, concreto e preserva a ligação com a Festa das Cabanas.
- source_word: כַּכָּתוּב
  choice: conforme está escrito
  rationale: Fórmula portuguesa natural que preserva a referência ao mandamento escrito.
