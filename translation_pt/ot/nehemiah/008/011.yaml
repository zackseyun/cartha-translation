  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: pt
  text: 'Os levitas pediam silêncio a todo o povo[a], dizendo: “Fiquem em silêncio, pois este dia é santo. Não fiquem tristes[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faziam todo o povo se calar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se entristeçam” ou “não lamentem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Os levitas
  rationale: Emprega a designação tradicional e amplamente compreendida para o grupo que exercia funções ligadas ao culto.
- source_word: מַחְשִׁים לְכָל הָעָם
  choice: pediam silêncio a todo o povo
  rationale: Expressa de modo natural em português a ação contínua dos levitas de fazer o povo se aquietar, sem sugerir necessariamente que o silêncio já tivesse sido plenamente alcançado.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz de forma direta e convencional as palavras citadas.
- source_word: הַסּוּ
  choice: Fiquem em silêncio
  rationale: Reproduz a ordem dirigida à multidão para que se aquietasse; é clara, solene e natural em português atual.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: pois este dia é santo
  rationale: Mantém a relação causal introduzida por כִּי e o caráter consagrado do dia; o demonstrativo torna natural a referência ao dia da ocasião em português.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: Não fiquem tristes
  rationale: Comunica o sentido emocional do verbo no contexto do povo que chorava, sem restringi-lo ao luto ritual.
theological_decisions:
- issue: Sentido de קָדֹשׁ aplicado ao dia da assembleia
  choice: santo
  alternative: sagrado
  rationale: “Santo” preserva o peso teológico da consagração do dia e a formulação bíblica reconhecível, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A repetição entre “pediam silêncio” e “Fiquem em silêncio” acompanha a ação seguida da fala no hebraico.
