  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: pt
  text: E acharam escrito na Lei que Yahweh havia ordenado por meio de Moisés que os filhos de Israel[a] morassem em cabanas durante a festa, no sétimo mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; em hebraico, “os filhos de Israel”.
    reason: Registra a alternativa portuguesa idiomática enquanto esclarece a forma literal e corporativa do hebraico.
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: E acharam escrito
  rationale: Preserva de modo natural em português a sequência narrativa e a construção hebraica com o particípio passivo predicativo.
- source_word: בַּתּוֹרָה
  choice: na Lei
  rationale: No contexto, refere-se ao corpo escrito da instrução mosaica; “Lei” é claro e consagrado em português.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: que Yahweh havia ordenado
  rationale: O mais-que-perfeito composto expressa naturalmente uma ordem anterior que agora foi encontrada por escrito; o nome divino é transliterado como Yahweh.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Expressa em português atual o idioma hebraico de agência ou mediação, literalmente “pela mão de Moisés”.
- source_word: יֵשְׁבוּ
  choice: morassem
  rationale: Neste contexto festivo, o verbo indica residir temporariamente nas cabanas, não apenas sentar-se.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma explícita do hebraico e seu sentido corporativo, com alternativa idiomática indicada em nota.
- source_word: בַּסֻּכּוֹת
  choice: em cabanas
  rationale: סֻכּוֹת designa abrigos temporários feitos para a festa; “cabanas” é concreto, corrente e compreensível em português.
- source_word: בֶּחָג
  choice: durante a festa
  rationale: A expressão definida aponta para a festa conhecida no contexto e indica o período em que deveriam morar nas cabanas.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução temporal direta e natural da expressão hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a estrutura narrativa do hebraico sem soar arcaica; “cabanas” comunica melhor ao leitor comum o caráter temporário dos abrigos.
