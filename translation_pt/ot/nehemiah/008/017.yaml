  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: pt
  text: Toda a assembleia dos que tinham voltado do cativeiro fez cabanas e habitou nas cabanas. Pois desde os dias de Jesua[a], filho de Num, até aquele dia, os filhos de Israel não tinham feito assim. E houve uma alegria muito grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesua, filho de Num, isto é, Josué, filho de Num.
    reason: A nota identifica a forma יֵשׁוּעַ usada neste versículo com o nome português tradicionalmente conhecido, Josué.
lexical_decisions:
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קָהָל designa a comunidade reunida; “assembleia” conserva esse sentido coletivo sem acrescentar conotação eclesiástica.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: os que tinham voltado do cativeiro
  rationale: Reproduz o particípio e a expressão preposicional, identificando a comunidade que retornou, sem substituir “cativeiro” pela interpretação mais ampla “exílio”.
- source_word: סֻכּוֹת
  choice: cabanas
  rationale: Refere-se aos abrigos temporários usados na festa. “Cabanas” é natural e inteligível em português, enquanto “tabernáculos” poderia sugerir principalmente o santuário.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: habitou nelas
  rationale: Neste contexto, יָשַׁב indica permanecer ou morar nas cabanas, não apenas sentar-se. O pronome evita repetição pesada sem perder o referente.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: Pois ... não tinham feito assim
  rationale: Mantém a formulação concisa e anafórica do hebraico, referindo-se ao modo de construir e habitar nas cabanas sem afirmar de forma mais ampla que a festa jamais fora observada.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: desde os dias de Jesua, filho de Num
  rationale: “Jesua” representa a forma יֵשׁוּעַ atestada neste versículo; a identificação pelo nome mais conhecido, “Josué”, é indicada em nota.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão hebraica masculina e sua função como designação convencional do povo da aliança.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: E houve uma alegria muito grande
  rationale: Expressa diretamente a intensidade de גְּדוֹלָה מְאֹד em português natural; “alegria” preserva o substantivo שִׂמְחָה sem tornar explícita uma ação que o hebraico não exige.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão é gramaticalmente masculina e funciona como designação pactual. A tradução conserva sua forma, em vez de neutralizá-la.
- issue: Identidade de יֵשׁוּעַ בִּן נוּן
  choice: Jesua, filho de Num
  alternative: Josué, filho de Num
  rationale: O texto hebraico deste versículo traz a forma יֵשׁוּעַ. O texto principal a representa como “Jesua”, enquanto a nota registra o nome pelo qual a mesma pessoa é mais conhecida em português.
- issue: Alcance de “não tinham feito assim”
  choice: preservar a referência ao modo de proceder descrito
  alternative: não celebravam a festa desde os dias de Josué
  rationale: כֵּן (“assim”) retoma o que acaba de ser narrado. A tradução evita concluir que não houve qualquer observância da festa durante todo o período.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Cabanas” favorece compreensão imediata; “assembleia”, “cativeiro” e “filhos de Israel” mantêm proximidade formal com o hebraico. O marcador [a] foi colocado junto ao nome a que a nota se refere.
