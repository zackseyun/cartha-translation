  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: pt
  text: Esdras, o escriba, ficou em pé sobre um estrado de madeira[a] que haviam feito para esse fim[b]. Ao lado dele, à sua direita, ficaram em pé Matitias, Sema, Anaías, Urias, Hilquias e Maaseias; e, à sua esquerda, Pedaías, Misael, Malquias, Hasum, Hasbadana, Zacarias e Mesulão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma torre de madeira”; isto é, uma estrutura elevada ou um estrado de madeira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o assunto”, “para a ocasião” ou “para esse propósito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: estrado de madeira
  rationale: A expressão significa literalmente “torre de madeira”, mas, neste contexto de leitura pública, designa uma estrutura elevada sobre a qual Esdras podia ficar em pé. “Estrado de madeira” comunica naturalmente essa função sem ocultar o sentido literal, registrado em nota.
- source_word: לַדָּבָר
  choice: para esse fim
  rationale: דָּבָר pode significar “palavra”, “assunto”, “coisa” ou “ocasião”. Aqui, a expressão indica o fim específico para o qual a estrutura havia sido construída, embora a amplitude lexical seja preservada em nota.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: “Escriba” é o equivalente tradicional e preciso para o profissional versado na escrita e nos textos, especialmente na Lei.
- source_word: אֶצְלוֹ
  choice: ao lado dele
  rationale: Expressa claramente a proximidade física dos homens que acompanhavam Esdras.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: à sua direita / à sua esquerda
  rationale: Mantém o contraste espacial do hebraico em português natural e atual.
- source_word: וַיַּעֲמֹד
  choice: ficou em pé / ficaram em pé
  rationale: Preserva a repetição do verbo hebraico aplicado tanto a Esdras quanto aos homens ao seu lado, com a concordância exigida em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas dos nomes próprias consolidadas na tradição bíblica lusófona. A enumeração foi organizada por posição — direita e esquerda — para manter clareza sem alterar o conteúdo do hebraico.
