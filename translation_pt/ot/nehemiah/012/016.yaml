  text: ל/עדיא זְכַרְיָ֖ה לְ/גִנְּת֥וֹן מְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/016.yaml
  text: for Iddo[a], Zechariah; for Ginnethon, Meshullam.
translation:
  language: pt
  text: da família de Adaías[a], Zacarias; da família de Ginetom, Mesulão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz aqui a forma “Adaías”. Muitas traduções usam “Ido”, entendendo-a como uma variante do nome que aparece em Neemias 12:4.
    reason: textual_name_variant
lexical_decisions:
- source_word: ל/עדיא
  choice: da família de Adaías
  rationale: O ל prefixado marca aqui a casa sacerdotal à qual pertence o representante nomeado em seguida. A formulação explícita “da família de” comunica essa relação naturalmente em português. A vocalização massorética עֲדָיָא favorece “Adaías”, embora o nome seja muitas vezes harmonizado com Ido, de Neemias 12:4.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o nome hebraico Zekharyah.
- source_word: לְ/גִנְּתוֹן
  choice: da família de Ginetom
  rationale: O mesmo ל da estrutura paralela indica a família ou casa sacerdotal representada pelo nome seguinte; “da família de” torna clara a função da lista.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa bíblica corrente do nome hebraico Meshullam.
theological_decisions: []
translation_notes:
  register: Entrada concisa de uma lista sacerdotal. A repetição de “da família de” explicita em português a relação indicada pelo ל hebraico sem sugerir que os primeiros nomes sejam os representantes. Registro atual, claro e digno; nomes próprios seguem formas bíblicas portuguesas reconhecíveis.
