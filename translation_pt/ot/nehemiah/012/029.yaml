  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: pt
  text: e de Bete-Gilgal, e dos campos de Geba e Azmavete, pois os cantores haviam construído povoados[a] para si ao redor de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aldeias”; o termo hebraico pode designar áreas habitadas cercadas e, neste contexto, refere-se aos lugares onde os cantores viviam ao redor de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: e de Bete-Gilgal
  rationale: A conjunção e a preposição significam “e de”. בֵּית integra aqui um topônimo, não a referência literal a uma casa; “Bete-Gilgal” preserva o nome do lugar com forma natural em português.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: e dos campos de Geba e Azmavete
  rationale: שְּׂדוֹת é o plural de “campo” e designa as terras rurais associadas às localidades mencionadas. “Campos” mantém o sentido direto e funciona naturalmente no contexto.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a explicação para a localização dos cantores. “Pois” expressa essa relação causal de maneira concisa e digna.
- source_word: חֲצֵרִים
  choice: povoados
  rationale: Embora o termo possa designar áreas cercadas ou pátios, neste contexto geográfico refere-se a pequenos núcleos habitados. “Povoados” evita a leitura de simples recintos e preserva a amplitude lexical.
- source_word: בָּנוּ לָהֶם
  choice: haviam construído para si
  rationale: O verbo significa literalmente “construíram”. O mais-que-perfeito composto apresenta naturalmente a situação anterior que explica de onde vieram os cantores.
- source_word: הַמְשֹׁרֲרִים
  choice: os cantores
  rationale: A forma participial derivada de שׁיר designa os que cantam; “cantores” é mais preciso que o termo mais amplo “músicos”.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: ao redor de Jerusalém
  rationale: A expressão indica a região circundante da cidade. “Ao redor de Jerusalém” preserva claramente seu sentido espacial.
