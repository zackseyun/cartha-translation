lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: por Abias
  rationale: O לְ prefixado indica associação com a casa ou divisão sacerdotal nesta lista elíptica; “por” conserva de modo natural a ideia de representante correspondente.
- source_word: זִכְרִי
  choice: Zicri
  rationale: Nome próprio transliterado segundo formas correntes em português.
- source_word: לְ/מִנְיָמִין
  choice: por Miniamim
  rationale: O לְ marca associação na lista. A ausência de um nome de representante depois de Miniamim é preservada, sem completar a lacuna aparente.
- source_word: לְ/מוֹעַדְיָה
  choice: por Moadias
  rationale: O texto consonantal sustenta Moadias; o nome é transliterado, e a variante Maadias é registrada em nota.
- source_word: פִּלְטָי
  choice: Piltai
  rationale: Nome próprio transliterado; na estrutura da lista, é o representante associado a Moadias.
