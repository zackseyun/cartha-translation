base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: pt
  text: 'Os chefes dos levitas eram Hasabias, Serebias e Jesua, filho de Cadmiel, junto com seus irmãos, que estavam diante deles[a], para louvar e dar graças conforme a ordem de Davi, homem de Deus: turno correspondente a turno.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente deles” ou “correspondendo a eles”. A expressão provavelmente descreve grupos levíticos posicionados frente a frente ou organizados de modo correspondente no culto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “turno correspondente a turno”. A expressão provavelmente se refere a divisões de serviço correspondentes ou a postos litúrgicos alternados.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: os chefes dos levitas
  rationale: רָאשֵׁי é um plural construto usado para pessoas em posição de liderança. “Chefes” comunica esse sentido de modo natural em português, sem reproduzir literalmente a imagem pouco idiomática de “cabeças”.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Hasabias, Serebias e Jesua, filho de Cadmiel
  rationale: Os nomes são transliterados em formas correntes na tradição bíblica portuguesa, e a relação filial expressa por בֶּן é mantida.
- source_word: וַאֲחֵיהֶם
  choice: e os irmãos deles
  rationale: Mantém a coordenação hebraica e o substantivo masculino de parentesco, que neste contexto designa os levitas associados aos líderes mencionados.
- source_word: לְנֶגְדָּם
  choice: diante deles
  rationale: A expressão pode indicar posição em frente, oposição espacial ou correspondência entre grupos. “Diante deles” preserva a referência pronominal e evita especificar além do texto.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: para louvar e dar graças
  rationale: Os dois infinitivos litúrgicos são traduzidos separadamente, preservando as duas ações paralelas.
- source_word: בְּמִצְוַת
  choice: conforme a ordem de
  rationale: A preposição בְּ indica conformidade com uma determinação autorizada; “conforme a ordem de” é claro e corrente.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Davi, homem de Deus
  rationale: Conserva sem expansão o título bíblico que apresenta Davi como alguém comissionado por Deus.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: turno diante de turno
  rationale: מִשְׁמָר pode designar guarda, turno ou divisão de serviço. “Turno” se ajusta ao serviço levítico, enquanto a repetição e a formulação elíptica preservam a estrutura e a ambiguidade do hebraico.
theological_decisions:
- issue: Termo masculino de parentesco אֲחֵיהֶם
  choice: irmãos deles
  alternative: companheiros levitas
  rationale: O hebraico emprega um substantivo masculino plural. A tradução conserva a forma de parentesco e não a neutraliza nem acrescenta uma identificação que permanece apenas implícita no contexto.
- issue: Sentido da organização cultual em מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: turno diante de turno
  alternative: uma divisão de serviço correspondendo à outra
  rationale: A frase sugere grupos levíticos organizados em correspondência, possivelmente em disposição responsiva ou alternada, mas não explicita o modo exato. A redação mantém essa tensão em vez de impor uma reconstrução litúrgica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais bíblicas familiares ao público brasileiro. A sintaxe permanece deliberadamente compacta nos dois trechos espaciais e cultuais, pois o hebraico é elíptico. Os marcadores foram colocados junto às expressões que de fato explicam.
