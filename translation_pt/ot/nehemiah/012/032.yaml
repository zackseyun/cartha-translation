base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/032.yaml
  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: pt
  text: Hosaías e metade dos oficiais de Judá foram atrás deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois deles”. O hebraico pode indicar que os seguiam na sequência; “atrás deles” explicita a imagem da procissão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foram
  rationale: O verbo הלך, nesta forma narrativa, indica movimento passado simples. O plural em português faz a concordância natural com o sujeito composto, Oseias e metade dos oficiais.
- source_word: אַחֲרֵיהֶם
  choice: atrás deles
  rationale: A preposição אַחֲרֵי com sufixo pronominal indica que alguém segue outros em posição ou sequência. “Atrás deles” torna clara a disposição física da procissão, preservando “depois deles” como alternativa.
- source_word: הוֹשַׁעְיָה
  choice: Oseias
  rationale: Adota-se a forma portuguesa tradicional e reconhecível do nome hebraico, em vez de uma transliteração estrita.
- source_word: וַחֲצִי
  choice: e metade dos
  rationale: חֲצִי significa “metade”; a conjunção prefixada coordena Oseias com o segundo elemento do sujeito.
- source_word: שָׂרֵי
  choice: oficiais
  rationale: שַׂר pode designar príncipe, chefe, dirigente ou oficial. Neste contexto administrativo e cerimonial, “oficiais” expressa liderança pública sem sugerir descendência real.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional do nome geográfico e tribal.
