lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: por Esdras
  rationale: 'Na estrutura desta lista sacerdotal, o לְ prefixado indica associação ou representação: Mesulão é o representante correspondente à casa de Esdras. “Por” comunica essa relação de modo conciso; “de Esdras” também é possível.'
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico, adequada à legibilidade brasileira.
- source_word: לַ/אֲמַרְיָה
  choice: por Amarias
  rationale: Assim como na primeira expressão, o לְ relaciona o nome seguinte à casa sacerdotal de Amarias, provavelmente indicando seu representante.
- source_word: יְהוֹחָנָן
  choice: Jeoanã
  rationale: Transliteração portuguesa que representa a forma hebraica mais extensa יְהוֹחָנָן, distinguindo-a da forma abreviada Joanã usada em algumas tradições.
