  source_fidelity: A sequência hebraica é elíptica e repete לְ לפני cada nome de casa sacerdotal. «De Esdras ... de Amarias» preserva de modo idiomático em português a relação de pertencimento/associação da lista, sem explicitar além do texto que os nomes seguintes são representantes.
