base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: pt
  text: Por ocasião da dedicação da muralha de Jerusalém, procuraram[a] os levitas em todos os lugares onde moravam, a fim de trazê-los a Jerusalém para celebrar a dedicação[b] com alegria, ações de graças e cânticos, ao som de címbalos, harpas e liras.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram buscar”. Pelo contexto, também pode ter o sentido de “convocaram”. O verbo hebraico significa basicamente “procurar” ou “buscar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “fazer uma dedicação”.'
    reason: lexical_alternative
  - marker: c
    text: Não se conhece com certeza a distinção exata entre os instrumentos aqui traduzidos como “harpas” e “liras”; o hebraico menciona dois instrumentos de cordas diferentes.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: Por ocasião da dedicação da muralha de Jerusalém
  rationale: Expressa naturalmente o valor temporal de בְּ e preserva חֲנֻכָּה como o substantivo “dedicação”. “Muralha” é a designação portuguesa corrente para a fortificação da cidade.
- source_word: בִּקְשׁוּ
  choice: procuraram
  rationale: Mantém o sentido básico de בקשׁ, “procurar/buscar”, sem especificar de modo indevido que houve uma convocação oficial.
- source_word: אֶת הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente direto e consagrado do substantivo definido.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: em todos os lugares onde moravam
  rationale: Torna natural em português a referência aos diversos lugares de residência dos levitas, sem restringi-los a categorias específicas de povoado.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: a fim de trazê-los a Jerusalém
  rationale: Preserva o sentido causativo do hifil de בוא e explicita com clareza a finalidade.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: para celebrar a dedicação
  rationale: É a forma idiomática de expressar “fazer uma dedicação” em português, preservando a natureza cerimonial do evento.
- source_word: וְשִׂמְחָה
  choice: com alegria
  rationale: Comunica de modo claro e natural o sentido de júbilo ou regozijo.
- source_word: וּבְתוֹדוֹת
  choice: ações de graças
  rationale: Preserva o sentido de agradecimento do plural תּוֹדוֹת sem fundi-lo indevidamente com o termo seguinte para canto.
- source_word: וּבְשִׁיר
  choice: e cânticos
  rationale: O plural idiomático “cânticos” expressa naturalmente o substantivo coletivo referente ao canto cerimonial.
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: ao som de címbalos, harpas e liras
  rationale: “Ao som de” liga naturalmente os instrumentos à celebração; os três termos preservam a lista hebraica e distinguem os dois tipos de instrumentos de cordas.
