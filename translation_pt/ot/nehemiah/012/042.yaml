translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais dos nomes quando bem estabelecidas. A conjunção inicial foi mantida porque o versículo continua a lista do contexto anterior. “Fizeram-se ouvir” preserva a nuance causativa sem soar artificial; “com Izraías” mantém a relação sintática relativamente aberta, sem impor uma reconstrução mais específica como “sob a direção de”.
