    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Maaséias
  rationale: Nome próprio transliterado em forma corrente e legível em português bíblico.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliteração consagrada em português.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Transliteração direta e natural em português.
- source_word: יְהוֹחָנָן
  choice: Joanã
  rationale: Forma portuguesa tradicional correspondente ao nome hebraico; evita uma transliteração desnecessariamente técnica.
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma portuguesa consagrada; no contexto, designa uma pessoa, não a região.
- source_word: עָזֶר
  choice: Ezer
  rationale: Transliteração simples do nome próprio.
- source_word: וַיַּשְׁמִיעוּ
  choice: fizeram-se ouvir
  rationale: Expressão portuguesa natural que conserva o valor causativo do hifil de שמע e, no contexto, comunica que o canto foi ouvido de modo marcante.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: Equivalente direto e natural para o particípio substantivado, adequado ao contexto da procissão e do culto.
- source_word: יִזְרַחְיָה
  choice: Izraías
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: הַפָּקִיד
  choice: o encarregado
  rationale: Indica alguém nomeado para uma função de responsabilidade ou supervisão sem especificar além do que o hebraico afirma.
