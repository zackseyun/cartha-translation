  text: e Maaséias, Semaías, Eleazar, Uzi, Joanã, Malquias, Elão e Ézer. Os cantores fizeram-se ouvir[a], com Jezraías, o encarregado[b].
  philosophy: optimal-equivalence
  footnotes:
