  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: pt
  text: 'e seus irmãos: Semaías, Azarel, Milalai, Gilalai, Maai, Natanael, Judá e Hanani, com os instrumentos musicais[a] de Davi, homem de Deus; e Esdras, o escriba, à frente deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “instrumentos de canto”.'
    reason: Alternativa lexical mais literal para בִּכְלֵי שִׁיר.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Preserva o sentido básico e masculino plural de אֶחָיו. Embora o contexto possa indicar parentes ou companheiros levitas, o hebraico diz literalmente “seus irmãos”.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Semaías, Azarel, Milalai, Gilalai, Maai, Natanael, Judá e Hanani
  rationale: Os nomes pessoais são transliterados em formas naturais e reconhecíveis em português, sem traduzir seu significado etimológico.
- source_word: בִּכְלֵי שִׁיר
  choice: com os instrumentos musicais
  rationale: כְּלֵי designa utensílios ou instrumentos, e שִׁיר, canto ou música. “Instrumentos musicais” comunica a expressão com clareza em português atual; a formulação mais literal é preservada em nota.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: de Davi, homem de Deus
  rationale: A construção associa os instrumentos a Davi e, em seguida, o identifica pelo título bíblico “homem de Deus”.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: e Esdras, o escriba
  rationale: Mantém a coordenação simples do hebraico e traduz הַסּוֹפֵר pelo título tradicional e preciso “o escriba”.
- source_word: לִפְנֵיהֶם
  choice: à frente deles
  rationale: Expressa de modo natural a posição de Esdras diante do grupo na procissão, sem acrescentar um verbo ausente no hebraico.
theological_decisions:
- issue: Tradução do título אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  alternative: homem do verdadeiro Deus
  rationale: “Homem de Deus” é o título bíblico convencional e conserva sua ressonância intertextual sem inserir uma qualificação ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura nominal do final foi mantida (“Esdras, o escriba, à frente deles”), pois o versículo continua a descrição da procissão iniciada no contexto anterior. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
