base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: pt
  text: Nos dias de Eliasibe, Joiada, Joanã e Jadua, os levitas foram registrados como chefes de casas paternas[a], e os sacerdotes também foram registrados, durante o reinado de Dario, o Persa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chefes de casas paternas”, designação de clãs ou de casas familiares ancestrais.'
    reason: cultural_note
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação portuguesa corrente e precisa para os membros da tribo de Levi.
- source_word: בִּימֵי
  choice: Nos dias de
  rationale: Conserva o conhecido idioma temporal hebraico em português natural e digno.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Eliasibe, Joiada, Joanã e Jadua
  rationale: Emprega formas portuguesas reconhecíveis e segue o hebraico יוֹחָנָן, Joanã, não a variante Jonatã de algumas tradições.
- source_word: כְּתוּבִים
  choice: foram registrados
  rationale: O particípio passivo de כתב indica que os nomes constavam por escrito, provavelmente em registro genealógico ou administrativo.
- source_word: רָאשֵׁי אָבוֹת
  choice: chefes de famílias ancestrais
  rationale: Comunica a função de liderança dentro de clãs ou casas ancestrais sem o pouco natural calque 'chefes de pais'.
- source_word: וְהַכֹּהֲנִים
  choice: e também os sacerdotes
  rationale: Supre naturalmente a elipse hebraica, indicando que os sacerdotes igualmente foram registrados.
- source_word: עַל מַלְכוּת
  choice: até o reinado de
  rationale: Neste contexto de listas e limites cronológicos, עַל pode indicar a extensão do registro até determinado reinado; uma nota preserva a possibilidade de referência temporal menos delimitadora.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Dario, o persa
  rationale: Mantém a designação étnica hebraica em aposição ao nome do rei.
