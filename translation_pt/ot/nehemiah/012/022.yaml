revisions:
- from: Nos dias de Eliasibe, Joiada, Joanã e Jadua, os levitas foram registrados como chefes de famílias ancestrais[a], e também os sacerdotes, até o reinado de Dario, o persa.[b]
  to: Nos dias de Eliasibe, Joiada, Joanã e Jadua, os levitas foram registrados como chefes de casas paternas[a], e os sacerdotes também foram registrados, durante o reinado de Dario, o Persa.
  rationale: A revisão substitui “até o reinado” por “durante o reinado”, correspondendo à fórmula cronológica hebraica. Explicita-se para os sacerdotes o verbo elíptico, de modo natural em português, e emprega-se “casas paternas” para preservar o caráter técnico da designação genealógica. A nota b é retirada porque não há ambiguidade que justifique manter “até” como leitura principal.
