translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico amplamente reconhecível. A ordem foi ajustada apenas o necessário para a fluidez. O marcador referente ao nome foi colocado junto de “Joanã”, corrigindo a incompatibilidade entre a posição do marcador na camada inglesa e o conteúdo da respectiva nota.
