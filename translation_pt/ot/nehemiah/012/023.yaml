base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: pt
  text: Os filhos de Levi, chefes das casas paternas, foram registrados no livro das crônicas[b] até os dias de Joanã[a], filho de Eliasibe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico יוֹחָנָן também pode ser transliterado como “Yohanan”.
    reason: lexical_alternative
  - marker: b
    text: “O livro das crônicas” refere-se a um registro histórico oficial, ou a anais, e não necessariamente aos livros bíblicos de Crônicas.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: Os filhos de Levi
  rationale: Mantém a forma explícita do hebraico, em vez de reduzi-la a “os levitas”, e preserva a estrutura pela qual o texto identifica em seguida os chefes das casas paternas.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes das casas paternas
  rationale: O hebraísmo designa os responsáveis por grupos familiares ou linhagens. “Casas paternas” conserva esse conceito e é inteligível em português bíblico atual.
- source_word: כְּתוּבִים
  choice: foram registrados
  rationale: O particípio passivo de כתב indica que os nomes foram postos por escrito; “registrados” expressa naturalmente o contexto administrativo ou genealógico.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: no livro das crônicas
  rationale: Embora עַל tenha o sentido básico de “sobre”, em português a inclusão em um registro se expressa naturalmente com “no”. A expressão דִּבְרֵי הַיָּמִים refere-se aqui a anais ou registros históricos.
- source_word: וְעַד יְמֵי
  choice: até os dias de
  rationale: Marca o limite temporal alcançado pelo registro e reproduz de modo claro a formulação hebraica.
- source_word: יוֹחָנָן
  choice: Joanã
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome hebraico, mantendo em nota uma transliteração mais direta.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: filho de Eliasibe
  rationale: Tradução direta e natural da construção patronímica hebraica.
