base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: pt
  text: Matanias, Bacbuquias, Obadias, Mesulão, Talmom e Acube eram guardas, porteiros, de serviço de guarda nos depósitos dos portões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁעֲרִים
  choice: guardas, porteiros que mantinham vigilância
  rationale: 'Preserva os dois termos hebraicos e evita tratá-los como simples repetição: שֹׁמְרִים caracteriza a função de vigilância, enquanto שֹׁעֲרִים identifica os porteiros.'
- source_word: מִשְׁמָר
  choice: mantinham vigilância
  rationale: Expressa naturalmente a ideia de serviço ou turno de guarda sem impor uma precisão administrativa ausente no contexto imediato.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: junto aos depósitos dos portões
  rationale: אֲסֻפִּים designa locais de recolhimento ou armazenamento associados aos portões; 'depósitos' comunica essa função em português corrente, e 'junto aos' preserva a relação locativa da preposição.
