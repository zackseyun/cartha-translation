  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: pt
  text: E os filhos dos cantores se reuniram, vindos da região ao redor de Jerusalém e dos povoados dos netofatitas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da planície ao redor de Jerusalém». O termo hebraico pode indicar uma planície, um círculo ou uma região, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou «das aldeias dos netofatitas». O termo hebraico frequentemente se refere a pequenos assentamentos ou aldeias sem muralhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף pode ter sentido passivo ou reflexivo. Em português, «se reuniram» preserva com naturalidade essa abertura sem especificar se foram convocados.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: os filhos dos cantores
  rationale: Mantém a construção hebraica formal. No contexto, pode indicar os descendentes ou integrantes do grupo dos cantores, ambiguidade que a tradução não resolve silenciosamente.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: a região ao redor de Jerusalém
  rationale: כִּכָּר pode designar planície, círculo ou distrito. «Região» comunica de modo natural a área circundante sem afirmar indevidamente que se tratava de terreno plano.
- source_word: חַצְרֵי
  choice: os povoados
  rationale: Em contexto geográfico, חָצֵר frequentemente designa pequenos assentamentos ou aldeias sem muralhas; «povoados» é claro e atual.
- source_word: נְטֹפָתִי
  choice: dos netofatitas
  rationale: A forma gentílica aponta para pessoas ligadas a Netofa, e não simplesmente para o topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada com «vindos» para deixar claro que as expressões introduzidas por מִן indicam a procedência dos cantores. Mantém-se «filhos dos cantores» para preservar a formulação e a possível ambiguidade do hebraico.
