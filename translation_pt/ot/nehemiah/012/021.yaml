lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: por Hilquias
  rationale: 'Neste rol sacerdotal, o ל prefixado indica associação ou representação: Hasabias representa a casa ou família de Hilquias. “Por” conserva a forma elíptica da lista e soa natural em português.'
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: לִֽ/ידַֽעְיָה
  choice: por Jedaías
  rationale: Como na primeira expressão, o ל prefixado assinala a casa ou família representada. “Por” mantém o paralelismo e a concisão do hebraico.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Nome próprio vertido na forma tradicional amplamente reconhecida em português.
