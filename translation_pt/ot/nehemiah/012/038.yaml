base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: pt
  text: E o segundo grupo de ação de graças seguia para a esquerda[a], e eu ia atrás dele, com metade do povo sobre a muralha, desde acima da Torre dos Fornos até a Muralha Larga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o segundo coro de ação de graças” ou “a segunda procissão de ação de graças”. O termo hebraico pode indicar um grupo que participava de uma procissão cerimonial de ação de graças, e não apenas o canto considerado isoladamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: grupo de ação de graças
  rationale: No contexto da dedicação da muralha, o termo designa um grupo organizado que participava da procissão de ação de graças, não apenas o ato abstrato de agradecer nem necessariamente só um coro.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: Ordinal que modifica o grupo de ação de graças.
- source_word: הַהוֹלֶכֶת
  choice: seguia
  rationale: O particípio descreve movimento em andamento; “seguia” é natural na narrativa e combina com a direção indicada a seguir.
- source_word: לְמוֹאל
  choice: para a esquerda
  rationale: Mantém o sentido direcional mais direto, no contexto dos dois grupos que percorriam a muralha em direções opostas.
- source_word: אַחֲרֶיהָ
  choice: atrás dele
  rationale: Expressa claramente a posição de Neemias na procissão. O pronome português retoma “grupo”.
- source_word: חֲצִי הָעָם
  choice: metade do povo
  rationale: Tradução simples e natural da construção hebraica.
- source_word: מֵעַל לְהַחוֹמָה
  choice: sobre a muralha
  rationale: Indica que o grupo percorria a parte superior da muralha; “sobre” preserva a imagem espacial sem sugerir que flutuava acima dela.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Torre dos Fornos
  rationale: Tradução transparente do topônimo, com capitalização de nome geográfico.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Muralha Larga
  rationale: Provável designação conhecida de uma seção da muralha de Jerusalém; a capitalização assinala seu caráter toponímico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Grupo de ação de graças” preserva a amplitude do hebraico; os topônimos foram vertidos de modo transparente. A expressão “desde um ponto acima da Torre” conserva a relação espacial de מֵעַל sem confundi-la com a localização geral do povo sobre a muralha.
