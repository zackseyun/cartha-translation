  text: אֵ֕לֶּה בִּ/ימֵ֛י יוֹיָקִ֥ים בֶּן יֵשׁ֖וּעַ בֶּן יוֹצָדָ֑ק וּ/בִ/ימֵי֙ נְחֶמְיָ֣ה הַ/פֶּחָ֔ה וְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סּוֹפֵֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: pt
  text: Estes viveram nos dias de Joiakim, filho de Jesua, filho de Jozadaque, e nos dias de Neemias, o governador, e de Esdras, o sacerdote, o escriba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esdras, o sacerdote-escriba”. O hebraico atribui a Esdras dois títulos em aposição: “o sacerdote” e “o escriba”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes viveram
  rationale: O demonstrativo plural retoma as pessoas anteriormente enumeradas. Como a oração hebraica não tem verbo expresso, acrescenta-se “viveram” para produzir uma frase natural em português e ligar essas pessoas ao período indicado.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Preserva a expressão histórica hebraica e é clara e corrente em português bíblico moderno.
- source_word: יוֹיָקִים
  choice: Joiakim
  rationale: Transliteração que distingue este sumo sacerdote pós-exílico do rei Jeoaquim.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: filho de Jesua, filho de Jozadaque
  rationale: Mantém o sentido genealógico normal de בֶּן e a sequência explícita do hebraico.
- source_word: וּבִימֵי
  choice: e nos dias de
  rationale: Conserva a repetição estrutural do hebraico e sua segunda referência cronológica.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Neemias, o governador
  rationale: “Governador” comunica com clareza a função provincial de פֶּחָה no contexto administrativo imperial.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: e de Esdras, o sacerdote, o escriba
  rationale: Mantém os dois títulos definidos em aposição, sem sugerir duas pessoas diferentes.
