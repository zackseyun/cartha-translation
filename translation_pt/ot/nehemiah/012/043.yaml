  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: pt
  text: Naquele dia, ofereceram grandes sacrifícios e se alegraram, porque Deus os fez alegrar-se com grande alegria.[a] Também as mulheres[b] e as crianças se alegraram, e a alegria de Jerusalém foi ouvida de longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus lhes deu grande alegria”. O hebraico diz mais literalmente que Deus os fez alegrar-se com grande alegria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as esposas”, pois a palavra hebraica pode significar “mulheres” ou “esposas”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: ofereceram
  rationale: No contexto cultual, זבח indica oferecer sacrifícios. “Ofereceram” é natural em português e evita a repetição pouco fluente de “sacrificaram sacrifícios”, sem perder o sentido sacrificial.
- source_word: זְבָחִים גְּדוֹלִים
  choice: grandes sacrifícios
  rationale: Preserva a formulação hebraica e a possível ideia de magnitude ou importância, sem restringi-la necessariamente ao número ou ao tamanho físico.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: se alegraram
  rationale: Mantém a repetição lexical da raiz שׂמח e usa uma expressão clara, digna e corrente em português.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: os fez alegrar-se com grande alegria
  rationale: Conserva tanto a força causativa do piel quanto a repetição enfática entre o verbo e o substantivo cognato.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: as mulheres e as crianças
  rationale: נָשִׁים pode significar mulheres ou esposas; sem indicação possessiva explícita, “mulheres” preserva o sentido mais amplo. יְלָדִים é adequadamente vertido por “crianças” neste contexto.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: a alegria de Jerusalém foi ouvida de longe
  rationale: Reproduz diretamente a forma passiva, mantém o genitivo aberto de “alegria de Jerusalém” e expressa a distância em português natural.
theological_decisions:
- issue: Agência da alegria
  choice: Deus os fez alegrar-se com grande alegria
  alternative: Deus lhes deu grande alegria
  rationale: A forma piel שִׂמְּחָם apresenta Deus explicitamente como aquele que causa a alegria. A tradução mantém essa agência e a ênfase da construção cognata, sem suavizá-las.
- issue: Abrangência da comunidade em festa
  choice: as mulheres e as crianças são mencionadas explicitamente
  alternative: subsumir esses grupos em uma referência genérica ao povo
  rationale: O hebraico destaca diretamente esses grupos, mostrando a amplitude comunitária da celebração; a tradução conserva essa ênfase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a repetição do campo lexical da alegria foram preservadas quando naturais. Os marcadores aparecem imediatamente após os trechos a que se referem.
