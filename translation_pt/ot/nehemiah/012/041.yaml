base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: pt
  text: 'e os sacerdotes: Eliaquim, Maaseias, Miniamim, Micaías, Elioenai, Zacarias e Hananias, com as trombetas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com trombetas”. O hebraico pode simplesmente indicar que esses sacerdotes estavam associados às trombetas ou designados para elas.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: e os sacerdotes
  rationale: O וְ liga a lista ao cortejo mencionado anteriormente, e הַכֹּהֲנִים é o termo comum para “os sacerdotes”.
- source_word: אֶלְיָקִים
  choice: Eliaquim
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Transliteração portuguesa corrente do nome hebraico, preservando sua identificação bíblica.
- source_word: מִנְיָמִין
  choice: Miniamim
  rationale: Transliteração que acompanha de perto a forma consonantal presente no texto hebraico.
- source_word: מִיכָיָה
  choice: Micaías
  rationale: Forma bíblica portuguesa corrente do nome próprio hebraico.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração portuguesa clara e próxima da forma hebraica.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma tradicional, amplamente reconhecida em português, do nome hebraico.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: com as trombetas
  rationale: A preposição בְּ pode indicar acompanhamento ou instrumento; no contexto litúrgico, “com as trombetas” é natural e mantém aberta a relação exata dos sacerdotes com elas.
