  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: pt
  text: E Joiada gerou Jônatas[a], e Jônatas gerou Jadua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e traduções trazem “Joanã” em vez de “Jônatas”. O texto hebraico adotado aqui traz “Jônatas”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: E
  rationale: A conjunção liga diretamente esta nota genealógica ao versículo anterior; “E” preserva sua função simples e sequencial.
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Nome próprio transliterado segundo a forma consagrada e inteligível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém gerou um descendente. “Gerou” é conciso, natural no registro bíblico português e mantém o sentido genealógico masculino.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, representado em português pela ordem e estrutura da frase.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: A forma do texto hebraico é יוֹנָתָן, correspondente a “Jônatas”; a variante “Joanã” é registrada em nota.
- source_word: וְ
  choice: e
  rationale: A segunda conjunção dá continuidade simples à sequência genealógica.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: O nome repetido é traduzido de modo consistente com a primeira ocorrência.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O verbo genealógico repetido recebe a mesma tradução para clareza e paralelismo.
- source_word: יַדּוּעַ
  choice: Jadua
  rationale: Nome próprio transliterado em sua forma tradicional portuguesa, próxima da forma hebraica.
