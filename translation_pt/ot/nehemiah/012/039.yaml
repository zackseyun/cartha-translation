  register: Português contemporâneo, digno e de leitura ampla, com nomes geográficos transparentes. A repetição hebraica das preposições foi suavizada para evitar rigidez, enquanto a sequência e os limites do percurso foram preservados. As notas foram colocadas junto aos termos aos quais de fato se referem.
