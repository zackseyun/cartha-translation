  source_fidelity: A sequência de marcos e o limite do trajeto são preservados. Contudo, “passando pela” introduz uma relação de percurso mais explícita do que a construção hebraica, que simplesmente coordena as torres à série iniciada por preposições espaciais. “Pararam” é uma tradução contextual mais natural de וְעָמְדוּ em uma descrição de procissão, com a alternativa literal mantida em nota.
  naturalness: A revisão elimina a alternância algo desconexa entre “por cima de” os portões e “passando pela” uma torre. “Pararam” é mais conciso e idiomático que “ficaram parados”, sem perder o sentido de interrupção do deslocamento.
  terminology: Os nomes tradicionais e transparentes — Portão de Efraim, Portão Antigo, Portão dos Peixes, Torre de Hananel, Torre dos Cem, Portão das Ovelhas e Portão da Guarda — são adequados. As notas preservam a incerteza de מַּטָּרָה e a alternativa semântica de עמד.
