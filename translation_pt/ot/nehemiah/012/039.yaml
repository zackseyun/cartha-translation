base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: pt
  text: e por cima do Portão de Efraim, do Portão Antigo, do Portão dos Peixes, da Torre de Hananel e da Torre dos Cem, até o Portão das Ovelhas; e pararam[a] no Portão da Guarda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram de pé”. O verbo hebraico pode significar “ficaram de pé” ou, neste contexto, “pararam”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Portão da Prisão” ou “Portão da Vigilância”. O sentido exato do nome hebraico é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: e por cima do Portão de Efraim
  rationale: A expressão indica a posição ou o percurso sobre o portão; “por cima do” comunica de modo natural o valor espacial de מֵעַל no contexto da procissão sobre a muralha.
- source_word: וְעַל שַׁעַר הַיְשָׁנָה
  choice: do Portão Antigo
  rationale: A preposição fica coordenada com “por cima do” sem repetição desnecessária. “Portão Antigo” representa de modo direto a leitura adjetival tradicional de הַיְשָׁנָה.
- source_word: וְעַל שַׁעַר הַדָּגִים
  choice: e do Portão dos Peixes
  rationale: Mantém a coordenação espacial e traduz literalmente o nome do marco de Jerusalém.
- source_word: וּמִגְדַּל חֲנַנְאֵל
  choice: passando pela Torre de Hananel
  rationale: O hebraico coordena a torre à descrição do trajeto. “Passando pela” torna essa relação implícita clara e natural em português sem alterar o marco geográfico.
- source_word: וּמִגְדַּל הַמֵּאָה
  choice: e pela Torre dos Cem
  rationale: Preserva a expressão enigmática “dos Cem”, sem determinar se o número se refere a pessoas, medidas ou outra realidade.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: até o Portão das Ovelhas
  rationale: עַד assinala o limite do percurso; “até” expressa isso com clareza.
- source_word: וְעָמְדוּ
  choice: e eles ficaram parados
  rationale: עמד significa literalmente permanecer ou estar de pé e, num relato de deslocamento, também pode indicar que o grupo parou. “Ficaram parados” conserva melhor essa sobreposição de sentidos do que uma escolha exclusivamente dinâmica.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: no Portão da Guarda
  rationale: מַטָּרָה pertence ao campo semântico de guarda, vigilância ou custódia. “Portão da Guarda” mantém a referência cautelosa sem decidir que se tratava especificamente de uma prisão.
