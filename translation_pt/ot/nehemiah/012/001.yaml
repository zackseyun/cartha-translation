base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: pt
  text: 'Estes são os sacerdotes e os levitas que subiram com Zorobabel, filho de Sealtiel, e com Jesua[a]: Seraías, Jeremias e Esdras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Jesua”; também pode ser apresentado como “Josué”, se o nome for normalizado em vez de transliterado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A construção introduz uma nova lista. Em português, “Estes são” expressa naturalmente a oração nominal hebraica; o waw inicial funciona como ligação discursiva e não exige um “agora” temporal.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: Equivalentes correntes e diretos para os dois grupos cultuais mencionados.
- source_word: אֲשֶׁר עָלוּ
  choice: que subiram
  rationale: O verbo עלה é preservado como “subiram”, uso tradicional e adequado para a subida à terra de Judá e a Jerusalém no contexto do retorno do exílio.
- source_word: עִם זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: com Zorobabel, filho de Sealtiel
  rationale: Mantém a relação de acompanhamento e emprega as formas portuguesas consagradas dos nomes, com a filiação expressa diretamente.
- source_word: וְיֵשׁוּעַ
  choice: e com Jesua[a]
  rationale: Repete-se “com” para deixar claro em português que Jesua também acompanhava o grupo. “Jesua” preserva a forma pós-exílica יֵשׁוּעַ, sem normalizá-la como Josué.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraías, Jeremias e Esdras
  rationale: Usam-se as formas portuguesas reconhecíveis dos nomes, apresentadas como o início da lista após os dois-pontos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos amplamente reconhecidas no uso brasileiro e internacional. A sintaxe de lista foi mantida, e a repetição de “com” evita uma leitura equivocada da coordenação.
