base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: pt
  text: E os levitas eram Jesua, Binui, Cadmiel, Serebias, Judá e Matanias, que, com seus irmãos, era responsável pelos cânticos de ação de graças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente em sentido mais coletivo: “ele e seus irmãos eram responsáveis pelas ações de graças”. O hebraico diz literalmente “ações de graças” e provavelmente se refere a expressões litúrgicas de gratidão ou louvor.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: E os levitas eram
  rationale: A conjunção introduz o grupo seguinte da lista; o verbo “eram”, ausente na oração nominal hebraica, é suprido para dar naturalidade em português.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Jesua, Binui, Cadmiel, Serebias, Judá e Matanias
  rationale: Os nomes próprios são transliterados em formas correntes e legíveis em português.
- source_word: עַל
  choice: era responsável por
  rationale: Neste contexto, a preposição indica responsabilidade ou supervisão; a expressão é clara e natural em português contemporâneo.
- source_word: הֻיְּדוֹת
  choice: os cânticos de ação de graças
  rationale: O substantivo plural denota ações ou expressões litúrgicas de gratidão e louvor; no contexto das funções levíticas, “cânticos de ação de graças” explicita de modo natural o provável sentido musical.
- source_word: הוּא
  choice: que ... era
  rationale: O pronome singular aponta mais naturalmente para Matanias, o último nome da lista, e é vertido por uma oração relativa.
- source_word: וְאֶחָיו
  choice: com seus irmãos
  rationale: A expressão conserva o termo familiar masculino do hebraico e indica os levitas associados a Matanias no desempenho da função.
theological_decisions:
- issue: Referente do pronome singular הוּא após uma lista de levitas
  choice: O singular refere-se a Matanias, que exercia a responsabilidade juntamente com seus irmãos.
  alternative: O pronome pode ser entendido de modo mais amplo, retomando coletivamente os levitas mencionados.
  rationale: A concordância singular favorece Matanias como antecedente imediato, mas a construção admite uma compreensão mais coletiva; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação mantém a concordância singular do hebraico e registra em nota tanto a possível leitura coletiva quanto o sentido literal do termo litúrgico.
