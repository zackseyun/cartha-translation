base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: pt
  text: Então fiz os líderes de Judá subir à muralha e organizei dois grandes coros de ação de graças[a] em procissão. Um deles seguiu para a direita, sobre a muralha, em direção[b] à Porta do Esterco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “duas grandes ações de graças”. Neste contexto, a expressão provavelmente se refere a grupos ou coros organizados que davam graças durante a procissão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até”. A preposição hebraica pode indicar tanto direção quanto destino neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: fiz ... subir
  rationale: O hifil de עלה tem sentido causativo, “fazer subir, levar para cima”. A formulação preserva essa força e soa natural em português.
- source_word: שָׂרֵי יְהוּדָה
  choice: os líderes de Judá
  rationale: שָׂרִים pode designar príncipes, autoridades ou dirigentes. “Líderes” é claro no contexto cívico e não sugere necessariamente membros da família real.
- source_word: מֵעַל לַחוֹמָה
  choice: à muralha
  rationale: 'Neste primeiro uso, a expressão indica o destino do movimento ascendente: o topo da muralha, onde ocorreria a procissão.'
- source_word: וָאַעֲמִידָה
  choice: organizei
  rationale: O hifil de עמד significa fazer ficar de pé, colocar ou dispor. No contexto cerimonial, “organizei” comunica de modo natural que Neemias dispôs os grupos para a procissão.
- source_word: תֹודֹת גְּדֹלֹת
  choice: grandes coros de ação de graças
  rationale: Literalmente, “grandes ações de graças”; neste contexto, o substantivo designa por metonímia grupos organizados que davam graças, provavelmente coros.
- source_word: וְתַהֲלֻכֹת
  choice: em procissão
  rationale: O substantivo derivado de הלך indica deslocamento organizado ou cortejo. A construção adverbial evita sugerir que havia outros dois grupos além dos coros.
- source_word: לַיָּמִין
  choice: para a direita
  rationale: Mantém a indicação espacial explícita do hebraico sem substituí-la pela direção geográfica inferida, “para o sul”.
- source_word: מֵעַל לַחוֹמָה
  choice: por cima da muralha
  rationale: No segundo uso, a expressão descreve o percurso da procissão sobre o topo da muralha.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: em direção à Porta do Esterco
  rationale: “Porta do Esterco” traduz de modo transparente o nome do portão; “em direção a” expressa o movimento sem decidir se o portão era o destino final.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a primeira pessoa de Neemias, a força causativa de “fiz ... subir” e a indicação literal “para a direita”, enquanto explicita com moderação o sentido coletivo de “ações de graças”.
