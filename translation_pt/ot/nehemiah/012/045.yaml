  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: pt
  text: Eles cumpriram o encargo do Deus deles e o encargo da purificação[a]; os cantores e os porteiros também cumpriram esses encargos[b], conforme a ordem de Davi e de seu filho Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o encargo da limpeza ritual” ou “o dever de manter a pureza”.
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica sobre “os cantores e os porteiros” é elíptica; provavelmente indica que esses grupos também cumpriram os encargos que lhes haviam sido designados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ
  choice: cumpriram
  rationale: Com מִשְׁמֶרֶת, o verbo שׁמר forma uma expressão idiomática para desempenhar fielmente uma responsabilidade designada. “Cumpriram” comunica isso com naturalidade em português.
- source_word: מִשְׁמֶרֶת
  choice: o encargo
  rationale: Designa uma responsabilidade ou função confiada. “Encargo” preserva o caráter formal do serviço religioso e permite manter a repetição do hebraico.
- source_word: אֱלֹהֵיהֶם
  choice: do seu Deus
  rationale: Mantém o sufixo possessivo explícito no hebraico sem acrescentar ênfase indevida.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: e o encargo da purificação
  rationale: No contexto do templo, הַטָּהֳרָה se refere à pureza ou purificação ritual. “Purificação” expressa claramente essa dimensão cultual.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: os cantores e os porteiros também cumpriram os seus deveres
  rationale: 'A construção hebraica é elíptica. A explicitação do verbo e do objeto torna natural a leitura mais provável: esses grupos também desempenharam as funções que lhes cabiam.'
- source_word: שֹׁעֲרִים
  choice: porteiros
  rationale: No contexto do templo, refere-se aos responsáveis pelas portas ou portões; “porteiros” é a designação bíblica tradicional e ainda inteligível em português.
- source_word: כְּמִצְוַת
  choice: conforme a ordem
  rationale: מִצְוָה indica aqui uma determinação autorizada acerca do serviço do templo. “Ordem” é clara, atual e formal.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: de Davi e de seu filho Salomão
  rationale: Explicita de modo idiomático que “seu filho” qualifica Salomão, preservando a relação expressa no hebraico.
theological_decisions:
- issue: Sentido de הַטָּהֳרָה no contexto do serviço do templo
  choice: purificação
  alternative: pureza; limpeza
  rationale: O contexto é litúrgico e levítico, de modo que o termo aponta principalmente para a purificação ritual, não para uma noção genérica de pureza moral.
- issue: Relação sintática dos cantores e porteiros com o restante da oração
  choice: também cumpriram os seus deveres
  alternative: e os cantores e os porteiros; com os cantores e os porteiros
  rationale: O hebraico é elíptico e não repete verbo nem objeto. A tradução explicita a interpretação contextual mais provável, mas registra em nota a forma aberta da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “encargo” preserva a estrutura hebraica, enquanto a segunda oração é moderadamente explicitada para comunicar a elipse. Todos os marcadores de nota aparecem no texto.
