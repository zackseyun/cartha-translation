base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: pt
  text: Jesua gerou[a] Joiakim[b]; Joiakim gerou Eliasibe; e Eliasibe gerou Joiada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fórmula genealógica hebraica significa literalmente «fez nascer»; aqui, «gerou» expressa seu sentido idiomático.
    reason: lexical_alternative
  - marker: b
    text: Joiakim também pode ser transliterado como «Jeoaquim»; Joiada, como «Jeoiada», conforme a convenção de transliteração adotada.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico neste contexto pós-exílico, distinguindo esta pessoa de Josué, filho de Num.
- source_word: הוֹלִיד
  choice: gerou
  rationale: Na fórmula genealógica, o hifil de ילד significa literalmente causar o nascimento; «gerou» expressa de modo conciso e digno a paternidade genealógica.
- source_word: אֶת
  choice: não traduzido
  rationale: Partícula que marca o objeto direto definido, sem equivalente lexical independente necessário em português.
- source_word: יוֹיָקִים
  choice: Joiakim
  rationale: Transliteração próxima da forma hebraica deste versículo; evita confundi-lo com outras figuras convencionalmente chamadas Jeoaquim.
- source_word: אֶלְיָשִׁיב
  choice: Eliasibe
  rationale: Forma portuguesa bíblica corrente e reconhecível do nome hebraico.
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Transliteração próxima da forma hebraica presente no texto, em paralelo com Joiakim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula genealógica concisa «gerou a». Os nomes seguem formas portuguesas reconhecíveis quando bem estabelecidas e transliteração próxima do hebraico nos nomes iniciados por יוֹי־.
