  text: for Bilgah[a], Shammua; for Shemaiah[b], Jehonathan.
translation:
  language: pt
  text: por Bilga[a], Samua; por Semaías, Jeonatã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Bilga ... de Semaías”. Em listas genealógicas ou de representantes, a preposição hebraica também pode ser traduzida mais formalmente dessa maneira.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Jeonatã”; algumas traduções usam a forma “Jônatas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: por Bilga
  rationale: Neste rol sacerdotal, a preposição לְ marca a casa ou turno ao qual o representante seguinte corresponde; “por” expressa essa relação com naturalidade. Bilga translitera o nome hebraico segundo formas correntes em português.
- source_word: שַׁמּוּעַ
  choice: Samua
  rationale: Nome próprio do representante associado à casa de Bilga; a forma portuguesa simplifica a transliteração sem perder a identificação.
- source_word: לִֽ/שְׁמַעְיָה
  choice: por Semaías
  rationale: A preposição desempenha a mesma função associativa ou representativa da primeira expressão. Semaías é a forma portuguesa tradicional e reconhecível do nome.
- source_word: יְהוֹנָתָן
  choice: Jeonatã
  rationale: Reproduz a forma hebraica plena Yehonatan, distinguindo-a da forma abreviada Yonatan, geralmente vertida como Jônatas.
