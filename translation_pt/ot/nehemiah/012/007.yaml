id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: pt
  text: Salu, Amoque, Hilquias e Jedaías — esses eram os chefes[a] dos sacerdotes e de seus irmãos[b] nos dias de Jesua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cabeças dos sacerdotes”; isto é, seus líderes.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus parentes” ou “seus colegas sacerdotes”. O hebraico diz “seus irmãos”.
    reason: lexical_alternative
  - marker: c
    text: Jesua é uma forma pós-exílica do nome também relacionado a “Josué”.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Salu
  rationale: Nome próprio transliterado segundo uma forma natural e reconhecível em português.
- source_word: עָמוֹק
  choice: Amoque
  rationale: Nome próprio transliterado com terminação gráfica adequada à pronúncia em português.
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Forma tradicional e inteligível em português para o nome hebraico.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Transliteração portuguesa do nome próprio, preservando sua identificação na lista sacerdotal.
- source_word: אֵלֶּה
  choice: esses
  rationale: Pronome demonstrativo que retoma naturalmente os nomes já enumerados, sem acrescentar um substantivo ausente no hebraico.
- source_word: רָאשֵׁי
  choice: chefes
  rationale: Expressa o uso idiomático de 'cabeças' para pessoas em posição de liderança sem sugerir o cargo técnico posterior de 'sumos sacerdotes'.
- source_word: הַכֹּהֲנִים
  choice: dos sacerdotes
  rationale: Tradução direta do substantivo plural definido no estado dependente da expressão.
- source_word: וַאֲחֵיהֶם
  choice: e de seus irmãos
  rationale: Preserva o termo masculino concreto do hebraico e também a relação sintática com 'chefes'; no contexto, pode abranger parentes ou colegas sacerdotes.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém a expressão temporal hebraica em formulação corrente e digna em português.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Forma pós-exílica do nome, transliterada de modo a distingui-la em português da forma mais longa normalmente vertida como Josué.
theological_decisions:
- issue: Sentido de אֲחֵיהֶם no contexto dos grupos sacerdotais
  choice: seus irmãos
  alternative: seus parentes; seus colegas sacerdotes
  rationale: O hebraico diz literalmente 'irmãos'. Embora o contexto possa indicar membros aparentados ou companheiros do mesmo corpo sacerdotal, a tradução preserva a expressão familiar e registra a amplitude contextual em nota.
- issue: Valor de רָאשֵׁי como termo de liderança
  choice: chefes dos sacerdotes
  alternative: líderes dos sacerdotes; cabeças dos sacerdotes
  rationale: A expressão identifica dirigentes entre os sacerdotes, sem necessariamente designar o cargo técnico de 'sumo sacerdote' ou a expressão posterior 'chefes dos sacerdotes' em sentido institucional fixo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os nomes seguem formas portuguesas reconhecíveis; a construção mantém o caráter conciso de uma lista sacerdotal. Todos os marcadores de nota foram posicionados junto às palavras que explicam.
