  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: pt
  text: E Baquebuquias e Uno[a], seus irmãos, estavam diante deles, em turnos de serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “e seus irmãos lhes respondiam por turnos”, caso וענו seja entendido como verbo, e não como o nome próprio Uno.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: E Baquebuquias
  rationale: Nome próprio transliterado em forma corrente e legível em português; a conjunção prefixada é traduzida por “E”.
- source_word: ו/ענו
  choice: e Uno
  rationale: Entendido como nome próprio, de acordo com a estrutura de lista de levitas no contexto. A escrita consonantal também permite uma análise verbal, preservada em nota.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Mantém diretamente o termo hebraico de parentesco, que neste contexto pode também indicar companheiros do mesmo grupo levítico.
- source_word: לְנֶגְדָּם
  choice: ficavam diante deles
  rationale: A expressão indica posição diante de, em frente a ou em correspondência com alguém. O verbo “ficavam” é suprido pelo contexto para produzir português natural sem determinar uma postura específica.
- source_word: לְמִשְׁמָרוֹת
  choice: em seus turnos de serviço
  rationale: O plural מִשְׁמָרוֹת pode designar turnos, grupos ou responsabilidades organizadas de serviço; “turnos de serviço” comunica com clareza o contexto do ministério levítico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios adaptados à ortografia portuguesa. A formulação conserva a ambiguidade textual relevante em nota e evita tornar explícita uma organização de serviço mais específica do que o hebraico permite.
