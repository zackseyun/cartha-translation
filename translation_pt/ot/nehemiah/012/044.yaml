revisions:
- from: Naquele dia, alguns homens foram encarregados das salas que serviam de depósitos[a] para as contribuições, para as primícias e para os dízimos. Ali deveriam recolher, dos campos das cidades, as porções prescritas pela Lei[b] para os sacerdotes e para os levitas, pois Judá se alegrava com os sacerdotes e com os levitas que estavam a serviço[c].
  to: Naquele dia, alguns homens foram designados para supervisionar as salas de depósito[a] destinadas às contribuições, às primícias e aos dízimos, para nelas recolherem, dos campos das cidades, as porções prescritas pela Lei[b] para os sacerdotes e para os levitas, pois Judá se alegrava com os sacerdotes e com os levitas que estavam a serviço[c].
  rationale: 'A única alteração substantiva é sintático-semântica: a finalidade expressa pelo infinitivo hebraico é mantida em “para nelas recolherem”, em vez de ser vertida como “deveriam recolher”. Também se ajusta a nota a para refletir que o vocabulário se refere a câmaras e a armazenamento, sem sugerir indevidamente tesouros monetários. A formulação “salas de depósito destinadas às contribuições, às primícias e aos dízimos” conserva a função conjunta das instalações e das categorias de bens.'
