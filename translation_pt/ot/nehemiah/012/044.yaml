  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: pt
  text: Naquele dia, alguns homens foram designados para supervisionar as salas de depósito[a] destinadas às contribuições, às primícias e aos dízimos, para nelas recolherem, dos campos das cidades, as porções prescritas pela Lei[b] para os sacerdotes e para os levitas, pois Judá se alegrava com os sacerdotes e com os levitas que estavam a serviço[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmaras”. O hebraico também menciona depósitos ou armazéns; trata-se de salas destinadas a guardar as contribuições, as primícias e os dízimos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as porções da Lei”, isto é, as partes que a Torá determinava para os sacerdotes e os levitas.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “que estavam de pé”. No contexto do templo, a expressão indica estar no posto, servindo ou ministrando.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: foram encarregados
  rationale: Expressa a designação formal de homens para uma responsabilidade administrativa, incluindo naturalmente a ideia de serem postos a cargo das salas.
- source_word: אֲנָשִׁים
  choice: alguns homens
  rationale: Mantém o substantivo masculino explícito do hebraico e comunica de modo natural sua indefinição.
- source_word: הַנְּשָׁכוֹת לָאוֹצָרוֹת
  choice: as salas que serviam de depósitos
  rationale: 'Combina os dois elementos hebraicos: נְשָׁכוֹת designa salas ou câmaras, e אֹצָרוֹת indica sua função de armazenamento. Evita sugerir tesourarias separadas das salas.'
- source_word: לַתְּרוּמוֹת
  choice: para as contribuições
  rationale: Designa bens separados e entregues para uso sagrado; “contribuições” preserva o sentido administrativo sem recorrer a terminologia ritual excessivamente técnica.
- source_word: לָרֵאשִׁית
  choice: para as primícias
  rationale: “Primícias” é o equivalente português consagrado para a primeira parte da produção dedicada a Deus.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: e para os dízimos
  rationale: Equivalente direto e corrente do termo hebraico para as décimas partes devidas.
- source_word: לִכְנוֹס בָּהֶם
  choice: Ali deveriam recolher
  rationale: Transmite a finalidade da nomeação e o recolhimento para dentro dessas salas; “ali” retoma os depósitos sem rigidez sintática.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: dos campos das cidades
  rationale: Conserva a referência às terras agrícolas vinculadas às cidades ou povoações.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: as porções prescritas pela Lei
  rationale: Explicita em português natural que eram as partes determinadas pela Torá, sem alterar seu caráter normativo.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para os sacerdotes e para os levitas
  rationale: Mantém os dois grupos beneficiários e reproduz a leve ênfase da preposição hebraica repetida.
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: pois Judá se alegrava
  rationale: Converte a construção nominal hebraica em uma oração verbal idiomática, preservando a relação causal e a referência à comunidade de Judá.
- source_word: הָעֹמְדִים
  choice: que estavam a serviço
  rationale: No contexto do templo, “estar de pé” denota comparecer ao posto e exercer o ministério; a tradução comunica essa função sem acrescentar uma atividade específica.
theological_decisions:
- issue: Sentido cultual de הָעֹמְדִים
  choice: que estavam a serviço
  alternative: que estavam de pé / que ocupavam seus postos
  rationale: A expressão conserva a noção de presença oficial no templo e, neste contexto, indica serviço. A nota registra a forma literal para não ocultar a imagem hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Lei” recebe inicial maiúscula por se referir à Torá. A divisão em duas frases reduz a sobrecarga do longo período hebraico sem perder suas relações lógicas.
