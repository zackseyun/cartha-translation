base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: pt
  text: Os sacerdotes e os levitas se purificaram e purificaram o povo, os portões e a muralha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: se purificaram
  rationale: 'O hitpael expressa ação reflexiva: os sacerdotes e os levitas passaram pela purificação ritual. A formulação é natural em português e conserva o sentido cerimonial.'
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso no contexto do culto.
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: Designação convencional dos levitas ligados ao serviço do templo.
- source_word: וַיְטַהֲרוּ
  choice: purificaram
  rationale: O piel é transitivo/factitivo. Repetir o verbo 'purificar' preserva a ligação lexical com a primeira ação e distingue a construção reflexiva da transitiva.
- source_word: הָעָם
  choice: o povo
  rationale: Sentido comum do termo e referência mais provável aos participantes da dedicação.
- source_word: הַשְּׁעָרִים
  choice: os portões
  rationale: Em português, 'portões' comunica naturalmente as grandes entradas da muralha urbana; evita a possível leitura de 'portas' como portas domésticas.
- source_word: הַחוֹמָה
  choice: a muralha
  rationale: No contexto de Jerusalém, 'muralha' identifica com precisão a fortificação da cidade e é mais específico que 'muro'.
theological_decisions:
- issue: Natureza da linguagem de purificação
  choice: purificação ritual
  alternative: limpeza cerimonial geral
  rationale: Neste contexto de dedicação e culto, טהר indica purificação ritual, não simples limpeza física nem necessariamente purificação moral. A tradução preserva esse sentido sem especificar um rito que o texto não descreve.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. 'Depois' explicita apenas a progressão natural das duas formas verbais consecutivas, sem definir intervalo de tempo. Mantém-se a repetição de 'purificaram' para refletir a mesma raiz hebraica.
