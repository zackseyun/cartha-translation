- source_word: עֶזְרָא
  choice: Esdras
  rationale: Nome próprio vertido segundo sua forma portuguesa tradicional. Embora não haja conjunção antes deste nome no hebraico, a sequência permanece natural em português.
- source_word: וּ/מְשֻׁלָּם
  choice: e Mesulão
  rationale: O וּ conjuntivo introduz o último nome da lista e é traduzido por “e”. מְשֻׁלָּם é transliterado na forma portuguesa tradicional “Mesulão”.
