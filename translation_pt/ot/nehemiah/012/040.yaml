base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: pt
  text: Assim, os dois coros de ação de graças[a] tomaram seu lugar na casa de Deus; eu também, com metade dos oficiais que estavam comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «as duas ações de graças». Neste contexto, a expressão se refere aos dois grupos ou coros de ação de graças.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: tomaram seu lugar
  rationale: Expressa o ato de se posicionarem para a cerimônia, concordando com o sujeito feminino plural no hebraico, e soa mais natural no contexto do que o simples «ficaram de pé».
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: os dois coros de ação de graças
  rationale: Literalmente, «as duas ações de graças»; no contexto, a expressão designa metonimicamente os dois grupos organizados para louvar e agradecer. «Coros de ação de graças» torna claro o referente sem ocultar o sentido literal, preservado em nota.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: na casa de Deus
  rationale: Mantém a imagem hebraica tradicional para o templo e traduz naturalmente a preposição locativa.
- source_word: וַאֲנִי
  choice: eu também
  rationale: A formulação natural em português indica que Neemias igualmente tomou seu lugar, embora o hebraico coordene de modo mais literal com «e eu».
- source_word: וַחֲצִי הַסְּגָנִים
  choice: com metade dos oficiais
  rationale: «Oficiais» é uma designação moderna, clara e suficientemente ampla para os administradores ou autoridades indicados por סְגָנִים.
- source_word: עִמִּי
  choice: que estavam comigo
  rationale: Reproduz a ideia de acompanhamento expressa pelo hebraico e evita uma sequência pesada de complementos com «com».
