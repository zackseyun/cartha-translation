base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: pt
  text: Pois, antigamente[a], nos dias de Davi e de Asafe, havia chefes dos cantores[b] e cânticos de louvor e ações de graças a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, nos dias de Davi e de Asafe, antigamente”. A ligação exata do hebraico para “antigamente” é incerta.'
    reason: syntactical_ambiguity
  - marker: b
    text: 'Hebraico: “chefe dos cantores”; o singular pode ter sentido coletivo. Também pode ser traduzido por “líderes dos cantores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi afirmado anteriormente, de modo natural e digno em português.
- source_word: בִימֵי דָוִיד וְאָסָף מִקֶּדֶם
  choice: desde os tempos de Davi e de Asafe
  rationale: Expressa a referência temporal antiga de forma clara; מִקֶּדֶם reforça que essa prática vinha de tempos passados. A nota preserva uma possível ligação sintática alternativa.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: chefes dos cantores
  rationale: O singular רֹאשׁ tem valor coletivo no contexto; 'chefes' comunica naturalmente a função de liderança, enquanto 'cantores' mantém a precisão do termo derivado de 'cantar'.
- source_word: וְשִׁיר תְּהִלָּה
  choice: e cânticos de louvor
  rationale: Embora שִׁיר esteja no singular, pode ter sentido coletivo; o plural é idiomático em português e forma a expressão natural 'cânticos de louvor'.
- source_word: וְהֹדוֹת לֵאלֹהִים
  choice: e ações de graças a Deus
  rationale: הֹדוֹת designa expressões ou atos de agradecimento; 'ações de graças' é corrente no registro bíblico e mantém a direção indicada por לְ.
theological_decisions: []
