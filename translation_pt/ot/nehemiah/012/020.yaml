translation:
  language: pt
  text: De Salai[a], Calai; de Amoque, Éber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Salai, Calai; para Amoque, Éber”. Nesta lista, a preposição hebraica לְ indica associação com a casa sacerdotal mencionada e pode ser traduzida como “de”, “para” ou “pertencente a”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/סַלַּי
  choice: por Salai
  rationale: A preposição לְ marca aqui a associação com a casa sacerdotal mencionada; em uma lista, “por” expressa isso com concisão. O nome סַלַּי é vertido na forma portuguesa Salai.
- source_word: קַלָּי
  choice: Calai
  rationale: Transliteração adaptada à ortografia portuguesa, na qual C representa naturalmente o som /k/ antes de a.
- source_word: לְ/עָמוֹק
  choice: por Amoque
  rationale: Como na primeira expressão, לְ introduz a casa sacerdotal à qual o representante está associado. “Amoque” adapta o nome à ortografia e à pronúncia portuguesas.
- source_word: עֵבֶר
  choice: Éber
  rationale: Forma transliterada e acentuada para indicar a pronúncia em português, preservando diretamente as consoantes do nome hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e digno, apropriado ao formato de uma lista. Os nomes foram transliterados com adaptação à ortografia portuguesa. Não se incluiu nota sobre a forma inglesa tradicional “Heber”, pois ela não constitui uma alternativa relevante em português.
