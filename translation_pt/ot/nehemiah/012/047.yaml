base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: pt
  text: E todo o Israel, nos dias de Zorobabel e nos dias de Neemias, dava as porções[a] aos cantores e aos porteiros, conforme o que era devido a cada dia[b]; e consagrava porções para os levitas, e os levitas consagravam porções para os filhos de Arão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as porções designadas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a questão de cada dia no seu dia”, isto é, o que era devido a cada dia.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, os sacerdotes descendentes de Arão.
    reason: clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: E todo o Israel
  rationale: Preserva a expressão coletiva e pactual do hebraico. Em português, “todo o Israel” é natural e mantém a referência à comunidade nacional como um todo.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: nos dias de Zorobabel e nos dias de Neemias
  rationale: Mantém a repetição da locução temporal presente no hebraico e seu tom de resumo histórico solene.
- source_word: נֹתְנִים
  choice: dava
  rationale: O particípio descreve uma prática habitual no período referido. O imperfeito português expressa naturalmente essa continuidade histórica.
- source_word: מְנָיוֹת
  choice: as porções
  rationale: Designa as partes ou provisões destinadas ao sustento dos servidores do templo. “Porções” é conciso e adequado ao contexto distributivo.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: aos cantores e aos porteiros
  rationale: Traduz os títulos reconhecidos das funções exercidas no serviço do templo.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: conforme a necessidade de cada dia
  rationale: Expressa em português corrente o sentido idiomático da provisão correspondente a cada dia, sem reduzir a frase apenas à frequência “diariamente”.
- source_word: וּמַקְדִּשִׁים
  choice: também consagrava porções
  rationale: O verbo conserva a noção cultual de tornar santo ou separar para uso sagrado. “Porções” é um objeto elíptico recuperado do contexto imediato, necessário para uma formulação portuguesa clara.
- source_word: לַלְוִיִּם
  choice: para os levitas
  rationale: A preposição indica os beneficiários das porções consagradas.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: e os levitas consagravam porções para os filhos de Arão
  rationale: Mantém o paralelismo da ação e preserva a designação hebraica da linhagem sacerdotal, sem substituí-la no texto principal por uma interpretação funcional.
theological_decisions:
- issue: Sentido de מַקְדִּשִׁים no contexto do sustento do templo
  choice: “consagrava porções” e “consagravam porções”, conservando a ideia de separar algo como santo para levitas e descendentes de Arão
  alternative: “separava para” ou, em sentido mais geral, “contribuía para”
  rationale: A raiz קדשׁ possui aqui uma dimensão sagrada que “contribuir” apagaria. O objeto “porções” não está repetido no hebraico, mas é recuperável do contexto e permite transmitir com clareza tanto a ação administrativa quanto seu caráter cultual.
- issue: Identidade dos “filhos de Arão”
  choice: Manter “filhos de Arão” no texto principal
  alternative: “sacerdotes descendentes de Arão” ou “sacerdotes aarônicos”
  rationale: A formulação literal preserva a linguagem genealógica e cultual do texto sem apagar que, no contexto, ela designa a linhagem sacerdotal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito comunica a prática habitual descrita pelos particípios hebraicos. A repetição “nos dias de” conserva o ritmo histórico da fonte; “consagrava porções” mantém a nuance sagrada sem produzir uma construção obscura em português.
