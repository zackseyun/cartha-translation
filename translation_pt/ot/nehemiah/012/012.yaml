base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: pt
  text: 'Nos dias de Joiakim, havia sacerdotes que eram chefes de famílias: da família de Seraías, Meraías; da família de Jeremias, Hananias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes de famílias
  rationale: A expressão designa os líderes das casas ou linhagens paternas. Em português atual, “chefes de famílias” comunica a função com naturalidade, sem sugerir apenas pais individuais.
- source_word: לִשְׂרָיָה ... לְיִרְמְיָה
  choice: da família de Seraías ... da família de Jeremias
  rationale: O לְ relaciona cada sacerdote à casa sacerdotal ancestral nomeada. A explicitação de “família” torna clara essa estrutura elíptica em português e evita dar a impressão de destinatários.
- source_word: כֹהֲנִים
  choice: os sacerdotes
  rationale: Equivalente direto e tradicional para os oficiantes sacerdotais de Israel.
- source_word: מְרָיָה ... חֲנַנְיָה
  choice: Meraías ... Hananias
  rationale: Transliterações portuguesas reconhecíveis dos nomes hebraicos, preservando a distinção entre os representantes e as famílias anteriormente citadas.
