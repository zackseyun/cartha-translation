  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: pt
  text: E, junto ao Portão da Fonte[a], em frente deles, subiram pelos degraus da Cidade de Davi[b], na subida para a muralha, acima da casa de Davi, até o Portão das Águas, a leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Portão da Nascente”. O termo hebraico pode designar uma fonte ou nascente de água.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelas subidas da Cidade de Davi”. O termo hebraico pode indicar degraus ou, de modo mais amplo, subidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Portão da Fonte
  rationale: עַיִן pode designar uma fonte ou nascente de água; “Portão da Fonte” é um topônimo claro e natural em português.
- source_word: וְנֶגְדָּם
  choice: bem diante deles
  rationale: נֶגֶד indica posição diante de, em frente de ou defronte de alguém; “bem diante deles” expressa de modo idiomático a relação espacial.
- source_word: עָלוּ
  choice: subiram
  rationale: O qal de עלה indica subir; a forma simples preserva diretamente o movimento descrito.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: degraus da Cidade de Davi
  rationale: O plural מַעֲלוֹת pode indicar degraus, escadas ou subidas; no contexto urbano e topográfico, “degraus” comunica melhor uma estrutura física sem excluir totalmente a noção de ascensão.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: na subida para a muralha
  rationale: מַעֲלֶה é “subida” e a preposição לְ aponta em direção à muralha; “para a muralha” mantém essa orientação espacial.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: acima da casa de Davi
  rationale: מֵעַל marca uma posição superior; na descrição do percurso, indica que o trajeto passava em nível mais alto que a casa de Davi.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Portão das Águas, a leste
  rationale: מִזְרָח indica leste ou direção oriental; a formulação preserva a indicação geográfica sem forçar se ela qualifica estritamente o portão ou o percurso.
- source_word: וְעַל
  choice: E, junto ao
  rationale: עַל pode ter valor locativo junto a um ponto topográfico; “junto ao” é natural em português e evita a leitura de movimento sobre o portão.
theological_decisions: []
translation_notes:
