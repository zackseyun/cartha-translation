base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: pt
  text: 'e, dentre os filhos dos sacerdotes[a], com trombetas: Zacarias, filho de Jônatas, filho de Semaías, filho de Matanias, filho de Micaías, filho de Zacur, filho de Asafe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e, dos filhos dos sacerdotes, com trombetas”. A expressão hebraica é partitiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: e, dentre os sacerdotes
  rationale: A combinação de ו com מן e בנים em construção tem sentido partitivo. Em português, “dentre os sacerdotes” expressa naturalmente que pessoas desse grupo participaram, sem acrescentar explicitamente “alguns”. O termo “filhos” não é necessário aqui para identificar membros da classe sacerdotal.
- source_word: בַּ/חֲצֹצְר֑וֹת
  choice: com trombetas
  rationale: O בְּ é instrumental neste contexto processional; “com trombetas” é claro, natural e não pressupõe trombetas específicas.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בֶן
  choice: filho de
  rationale: Mantém de modo uniforme a estrutura genealógica repetida do hebraico.
- source_word: יֽוֹנָתָן
  choice: Jônatas
  rationale: Forma bíblica portuguesa corrente do nome.
- source_word: שְׁמַֽעְיָה
  choice: Semaías
  rationale: Transliteração bíblica portuguesa corrente, com acentuação natural.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Forma portuguesa reconhecível e próxima do hebraico.
- source_word: מִיכָיָה
  choice: Micaías
  rationale: Forma portuguesa que representa o nome hebraico e o distingue da forma mais curta Miqueias.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Transliteração portuguesa concisa e próxima do hebraico.
- source_word: אָסָף
  choice: Asafe
  rationale: Forma tradicional e amplamente reconhecida em português.
theological_decisions:
- issue: Relação genealógica com Asafe
  choice: Preservar a sequência literal “filho de” sem explicar a natureza exata de cada geração.
  alternative: Interpretar “filho de Asafe” em sentido amplo como descendente ou membro da linhagem de Asafe.
  rationale: O hebraico apresenta uma cadeia genealógica com בֶן repetido. A tradução mantém essa forma e evita introduzir conclusões sobre corporação, autoria ou distância geracional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes em formas bíblicas portuguesas correntes. A pontuação preserva o caráter de continuação da lista e apresenta Zacarias como o sacerdote nomeado que portava trombeta.
