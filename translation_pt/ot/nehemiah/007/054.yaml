lexical_decisions:
- source_word: בְּנֵי
  choice: os descendentes de
  rationale: Neste contexto de lista genealógica, o termo introduz famílias ou clãs, não necessariamente filhos imediatos. “Os descendentes de” comunica isso com clareza em português atual; a preposição é elidida nos itens seguintes para dar fluidez à enumeração.
- source_word: בַצְלִית
  choice: Baslite
  rationale: Nome próprio transliterado segundo convenções naturais do português, representando צ por “s” e a terminação ת por “te”.
- source_word: מְחִידָא
  choice: Meída
  rationale: Nome próprio transliterado para o português; “Meída” procura refletir a pronúncia indicada pelo texto massorético, com ח não marcada por um som inexistente no português comum.
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Nome próprio transliterado de modo legível em português, mantendo o h inicial convencional e representando שׁ por “s”.
