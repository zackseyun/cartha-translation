  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: pt
  text: Quando o muro foi construído e eu instalei as portas, foram designados[a] os porteiros, os cantores e os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram encarregados” ou “foram registrados”; o verbo hebraico pode ter um sentido administrativo mais amplo do que uma nomeação formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz a circunstância temporal da ação seguinte. “Quando” transmite isso naturalmente, sem reproduzir de modo rígido a fórmula narrativa “e aconteceu que”.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: o muro foi construído
  rationale: O nifal de בנה é passivo. “Construído” preserva o sentido lexical sem acrescentar “reconstruído”, embora o contexto histórico envolva a restauração do muro.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: eu instalei as portas
  rationale: O hifil de עמד indica aqui fazer ficar em posição. Com “portas”, “instalei” expressa de modo corrente a colocação delas no devido lugar.
- source_word: וַיִּפָּקְדוּ
  choice: foram designados
  rationale: O nifal de פקד tem sentido administrativo e pode indicar designação, atribuição de função ou registro. “Foram designados” se ajusta melhor à organização do pessoal neste contexto, sem excluir outras nuances.
- source_word: הַשּׁוֹעֲרִים
  choice: os porteiros
  rationale: Designa os responsáveis pelas portas ou portões; “porteiros” é a forma bíblica tradicional e ainda clara em português.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O termo derivado de שׁיר se refere diretamente aos cantores, especialmente aos ligados ao culto.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma portuguesa estabelecida para o grupo tribal e religioso mencionado no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva a sequência narrativa sem recorrer à fórmula pouco natural “e aconteceu que”. “Muro” e “portas” seguem o grau de explicitação do hebraico, sem acrescentar “da cidade” ou “dos portões”.
