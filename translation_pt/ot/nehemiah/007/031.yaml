lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Os homens de
  rationale: O plural construto de אִישׁ integra a fórmula de recenseamento e designa os homens ligados à localidade. “Os homens de” preserva diretamente a forma da lista e soa natural em português.
- source_word: מִכְמָס
  choice: Micmás
  rationale: Nome geográfico transliterado de acordo com a forma hebraica e com o uso tradicional em português; o acento gráfico indica naturalmente a tonicidade final.
- source_word: מֵאָה וְעֶשְׂרִים וּשְׁנָיִם
  choice: '122'
  rationale: A sequência cardinal hebraica significa literalmente “cem e vinte e dois”. Algarismos são claros e adequados ao estilo censitário do capítulo.
