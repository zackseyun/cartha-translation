lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: O plural construto de אִישׁ introduz aqui habitantes vinculados a localidades. “Os homens de” preserva a forma masculina do hebraico e o estilo da lista, enquanto a nota registra a alternativa coletiva natural em português.
- source_word: בֵית לֶחֶם
  choice: Belém
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo, sem traduzir literalmente seus componentes.
- source_word: וּנְטֹפָה
  choice: e Netofa
  rationale: Reproduz a conjunção e translitera o topônimo conforme a pronúncia hebraica aproximada. Belém e Netofa aparecem agrupadas sob um único total.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: cento e oitenta e oito
  rationale: Expressa com naturalidade em português o total cardinal hebraico de 188.
