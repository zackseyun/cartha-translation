  text: the men of Bethel and Ai[a], one hundred twenty-three.
translation:
  language: pt
  text: os homens de Betel e Ai[a], cento e vinte e três.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes de Betel e Ai”. O hebraico diz literalmente “os homens de Betel e Ai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: O plural construto de אִישׁ designa aqui um grupo identificado por suas localidades. “Os homens de” reproduz diretamente a forma masculina do hebraico; “os habitantes de” expressaria bem o sentido contextual, mas seria menos formalmente próximo.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Nome de lugar transliterado segundo a forma tradicional e corrente em português, em vez de traduzido literalmente como “casa de Deus”.
- source_word: וְהָעָי
  choice: e Ai
  rationale: O nome próprio é vertido pela forma tradicional “Ai”. Embora o hebraico traga artigo antes do topônimo, o português normalmente o omite nesse uso.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: cento e vinte e três
  rationale: Reproduz com exatidão o total do recenseamento em formulação numérica natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a estrutura concisa própria de uma lista censitária. Mantém-se “homens” para refletir o masculino explícito do hebraico, enquanto a nota registra a alternativa contextual mais abrangente.
