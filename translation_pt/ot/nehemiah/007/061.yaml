reference: Nehemiah 7:61
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: pt
  text: Estes foram os que vieram de Tel-Melá, Tel-Harsa, Querube, Adom[a] e Imer, mas não puderam declarar sua casa paterna[b] nem sua descendência, se eram de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esdras 2:59 traz “Adã” onde Neemias traz “Adom”.
    reason: textual_variant
  - marker: b
    text: Ou “sua família ancestral”; literalmente, “a casa de seus pais”.
    reason: lexical_alternative
  - marker: c
    text: Ou “se eram israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Estes foram os que vieram
  rationale: Introduz um novo grupo dentro da lista. O passado se ajusta ao contexto narrativo, e “vieram” comunica naturalmente o movimento de retorno sem acrescentar explicitamente a ideia de exílio.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: de Tel-Melá, Tel-Harsa, Querube, Adom e Imer
  rationale: Os topônimos ou nomes de clãs são transliterados em formas legíveis em português. “Adom” representa o nome do texto consonantal de Neemias, distinto da forma de Esdras 2:59.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: mas não puderam declarar
  rationale: “Mas” explicita o contraste contextual, enquanto “declarar” preserva o sentido do hifil de נגד, “dar a conhecer”, sem adotar no texto principal o mais interpretativo “comprovar”.
- source_word: בֵּית אֲבוֹתָם
  choice: sua casa paterna
  rationale: Mantém de modo compreensível o idioma genealógico hebraico, referente à família ou linhagem ancestral pelo lado paterno.
- source_word: וְזַרְעָם
  choice: nem sua descendência
  rationale: No contexto genealógico, זֶרַע designa descendência. “Nem” é natural após uma oração negativa e expressa a coordenação dos dois elementos.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: se eram de Israel
  rationale: Preserva a forma condicional e a incerteza quanto à origem israelita, evitando comprimir a expressão para “se eram israelitas” no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter genealógico e administrativo da lista sem transformar “declarar” em “comprovar”, e mantém a incerteza expressa pela oração final.
