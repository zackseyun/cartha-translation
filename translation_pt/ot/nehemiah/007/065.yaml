  to: E o governador[a] lhes disse que não comessem das coisas santíssimas[b] até que surgisse um sacerdote com Urim e Tumim.
  rationale: Substitui-se somente «se apresentasse» por «surgisse», para refletir mais de perto a cláusula hebraica «até que se levantasse/surgisse um sacerdote», sem introduzir a noção adicional de apresentação formal. As notas existentes permanecem corretas e mantêm os respectivos marcadores.
