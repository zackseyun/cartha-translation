base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: pt
  text: E o governador[a] lhes disse que não comessem das coisas santíssimas[b] até que surgisse um sacerdote com Urim e Tumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Tirsata”, título administrativo persa.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, as porções sacerdotais consideradas santíssimas; não o recinto chamado Santo dos Santos.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: o governador
  rationale: O termo persa designa um cargo administrativo. Traduzir o título comunica sua função com clareza; a transliteração tradicional é preservada em nota.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: que não comessem
  rationale: No contexto, a oração transmite a ordem ou determinação do governador. O imperfeito do subjuntivo é natural em português após o verbo no passado e expressa a proibição sem intensificá-la.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: das coisas santíssimas
  rationale: A construção superlativa refere-se aqui às porções sagradas destinadas aos sacerdotes, e não ao recinto chamado Santo dos Santos. A formulação mantém a amplitude lexical do hebraico, com esclarecimento em nota.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: até que se apresentasse um sacerdote
  rationale: A construção com עַד aponta para uma condição futura. Embora o hebraico traga artigo, o sacerdote não foi identificado antes e pode ser entendido genericamente; 'um sacerdote' é natural em português. 'Se apresentasse' comunica o surgimento do sacerdote apto a atuar sem sugerir apenas o gesto físico de ficar em pé.
- source_word: לְאוּרִים וְתוּמִּים
  choice: com Urim e Tumim
  rationale: Mantêm-se os nomes tradicionais dos meios sacerdotais de discernimento. 'Com' expressa de modo natural a posse ou o uso, sem especificar além do hebraico.
theological_decisions:
- issue: Referente de מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: porções ou alimentos sacerdotais classificados como santíssimos
  alternative: o recinto do Santo dos Santos
  rationale: O contexto trata da elegibilidade de pessoas com genealogia sacerdotal incerta para comer porções sagradas. Portanto, a expressão não indica entrada no santuário interior.
- issue: Sentido do título persa הַתִּרְשָׁתָא
  choice: governador
  alternative: Tirsata
  rationale: Trata-se de um título administrativo, não de um nome pessoal. A tradução funcional torna o sentido acessível, enquanto a forma transliterada permanece em nota.
- issue: Definição de הַכֹּהֵן
  choice: um sacerdote, em sentido genérico
  alternative: o sacerdote, como indivíduo definido
  rationale: O artigo hebraico admite valor genérico neste contexto, e nenhum sacerdote específico foi anteriormente identificado. A tradução evita criar uma referência pessoal inexistente, preservando em substância a expectativa de uma autoridade sacerdotal competente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe em discurso indireto usa 'não comessem' e 'até que se apresentasse', formas naturais depois de 'disse'. 'Coisas santíssimas' preserva a expressão abrangente do hebraico, enquanto a nota elimina a possível confusão com o santuário interior.
