  rationale: Forma portuguesa legível do topônimo hebraico, com vogal final de apoio natural na pronúncia portuguesa.
- source_word: וְ/אוֹנוֹ
  choice: e Ono
  rationale: Traduz a conjunção וְ por «e» e translitera diretamente o topônimo אוֹנוֹ.
- source_word: שְׁבַע מֵאוֹת וְ/עֶשְׂרִים וְ/אֶחָד
  choice: setecentos e vinte e um
  rationale: Reproduz por extenso o número cardinal hebraico em formulação portuguesa natural.
