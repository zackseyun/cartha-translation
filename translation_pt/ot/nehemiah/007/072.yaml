  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: pt
  text: Assim, os sacerdotes, os levitas, os guardas dos portões, os cantores, parte do povo, os servidores do templo[a] e todo o Israel moraram em suas cidades. E, quando chegou o sétimo mês, os filhos de Israel[b] estavam em suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os netineus”, transliteração tradicional do nome dado a essa classe de servidores do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: passaram a morar
  rationale: No contexto do repovoamento, ישׁב indica estabelecer residência. “Passaram a morar” comunica naturalmente esse aspecto ingressivo sem reduzir o verbo a um simples ato de sentar-se.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português padrão e direto para כהנים.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional, clara e amplamente reconhecida em português.
- source_word: הַשּׁוֹעֲרִים
  choice: os guardas dos portões
  rationale: Expressa a função de guardar ou vigiar os portões e evita termos menos claros, como “porteiros”, que no uso moderno podem sugerir outra função.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio designa os que cantavam, especialmente no serviço do templo; “cantores” é a tradução mais direta.
- source_word: וּמִן הָעָם
  choice: parte do povo
  rationale: 'A preposição מן tem sentido partitivo: trata-se de uma parcela do povo em contraste com os grupos de serviço já enumerados.'
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: Traduz a função dessa classe vinculada ao serviço do templo, de forma compreensível ao leitor moderno; a transliteração tradicional fica registrada em nota.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Mantém a expressão coletiva convencional do hebraico.
- source_word: בְּעָרֵיהֶם
  choice: em suas cidades
  rationale: עיר pode significar cidade ou povoação; “cidades” é natural e adequado ao contexto da lista de assentamentos.
- source_word: וַיִּגַּע
  choice: quando chegou
  rationale: Com uma expressão temporal, נגע significa idiomaticamente que determinado período chegou. A construção com “quando” também preserva a ligação com a oração seguinte.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: o sétimo mês
  rationale: Tradução direta da expressão calendárica hebraica.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma masculina e a imagem genealógica de בני ישראל; em contexto, a expressão funciona coletivamente como designação dos israelitas.
theological_decisions:
- issue: Expressão coletiva de gênero בני ישראל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a formulação masculina e genealógica explícita do hebraico, enquanto a nota esclarece seu sentido coletivo como etnônimo.
- issue: Designação institucional נתינים
  choice: servidores do templo
  alternative: netinins
  rationale: A função é apresentada no texto para favorecer a compreensão, sem transformar essa classe histórica numa categoria denominacional moderna; a transliteração tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil e inteligível internacionalmente. A coordenação inicial e o “E” da segunda frase refletem os elos narrativos hebraicos. Os marcadores foram colocados junto aos termos que efetivamente explicam.
