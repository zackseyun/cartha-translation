  yaml_path: translation/ot/nehemiah/007/047.yaml
  text: the sons of Keros[a], the sons of Sia, the sons of Padon.
translation:
  language: pt
  text: os filhos de Queros[a], os filhos de Sia e os filhos de Padom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de”, em cada ocorrência de “os filhos de”; a fórmula genealógica hebraica pode indicar uma linhagem familiar mais ampla, e não apenas filhos homens imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, nesta lista genealógica, pode indicar descendentes ou membros de uma linhagem. “Os filhos de” preserva a fórmula hebraica tradicional, com a alternativa mais ampla explicitada em nota.
- source_word: קֵירֹס
  choice: Queros
  rationale: Transliteração do nome hebraico em forma natural para leitores de português; “Qu” representa adequadamente o som inicial /k/ antes de “e”.
- source_word: סִיעָא
  choice: Sia
  rationale: Transliteração simples e legível do nome próprio hebraico, sem lhe atribuir significado interpretativo.
- source_word: פָדוֹן
  choice: Padom
  rationale: Transliteração adaptada à ortografia portuguesa, na qual “m” final representa naturalmente a nasalização correspondente ao término consonantal do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a repetição da fórmula genealógica hebraica. Emprega-se “e” antes do último grupo para dar fluidez natural à enumeração sem alterar seu conteúdo.
