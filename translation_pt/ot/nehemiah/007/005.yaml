base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: pt
  text: 'Então o meu Deus pôs no meu coração que eu reunisse os nobres, os oficiais e o povo, para serem registrados segundo suas genealogias.[a] Encontrei o livro do registro genealógico dos que tinham subido inicialmente[b] e achei escrito nele:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para se registrarem segundo suas genealogias”. O hebraico se refere ao registro oficial de acordo com a linhagem familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “o registro genealógico dos que tinham subido no início”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: Então o meu Deus pôs no meu coração
  rationale: Reproduz de modo natural a expressão hebraica, preservando a iniciativa divina e o impulso interior sem definir o modo dessa orientação.
- source_word: וָאֶקְבְּצָה
  choice: que eu reunisse
  rationale: Entende a forma verbal como o conteúdo daquilo que Deus pôs no coração de Neemias; a construção portuguesa expressa propósito e intenção com naturalidade.
- source_word: הַחֹרִים
  choice: os nobres
  rationale: No contexto cívico de Neemias, o termo designa membros destacados da sociedade, não apenas homens livres.
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: Termo atual e abrangente para autoridades administrativas subordinadas, adequado ao contexto.
- source_word: לְהִתְיַחֵשׂ
  choice: para serem registrados segundo suas genealogias
  rationale: Expressa o registro oficial com base na linhagem familiar e mantém a forma passiva/reflexiva do hebraico.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: o livro do registro genealógico
  rationale: Indica claramente um documento escrito de inscrição por linhagem, sem tornar a formulação excessivamente técnica.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: dos que tinham subido primeiro
  rationale: Preserva a imagem bíblica da subida à terra e a referência ao primeiro grupo de retornados.
- source_word: וָאֶמְצָא כָּתוּב בּוֹ
  choice: 'e achei escrito nele:'
  rationale: Mantém a introdução hebraica ao conteúdo do documento que aparece nos versículos seguintes.
theological_decisions:
- issue: A orientação divina na liderança de Neemias
  choice: o meu Deus pôs no meu coração
  alternative: Deus me inspirou
  rationale: O hebraico apresenta uma iniciativa divina interior sem especificar revelação formal; a tradução preserva essa abertura e evita definir em excesso a natureza da experiência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Genealogias” preserva a precisão administrativa do contexto, enquanto “tinham subido” mantém a imagem hebraica tradicional sem substituir o termo por uma interpretação como “retornados”.
