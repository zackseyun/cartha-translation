- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן, em listas genealógicas e censitárias, pode designar os descendentes ou membros de uma família. “Os filhos de” preserva a forma hebraica e é claro neste contexto.
- source_word: אִמֵּר
