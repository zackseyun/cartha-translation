  rationale: Nome próprio transliterado segundo uma forma natural em português, sem traduzir seu possível significado.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: '1.052'
  rationale: A sequência cardinal hebraica significa literalmente “mil, cinquenta e dois”. O numeral com ponto como separador de milhar é claro e natural para leitores brasileiros e preserva a quantidade exata.
