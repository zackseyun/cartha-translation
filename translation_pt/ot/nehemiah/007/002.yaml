  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: pt
  text: Então encarreguei meu irmão Hanani e Hananias, comandante da fortaleza, de Jerusalém, pois ele[b] era um homem fiel[a] e temia a Deus mais do que muitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem de verdade” ou “um homem digno de confiança”.'
    reason: lexical_alternative
  - marker: b
    text: O pronome singular “ele” se refere mais naturalmente a Hananias, embora alguns entendam que esse elogio fundamenta a nomeação de modo mais geral.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: encarreguei
  rationale: Embora צוה costume significar “ordenar”, aqui a construção administrativa com pessoas nomeadas e עַל expressa atribuição de responsabilidade; “encarreguei” comunica isso de modo natural e conciso.
- source_word: חֲנָנִי אָחִי
  choice: meu irmão Hanani
  rationale: Preserva a identificação familiar e segue a ordem mais natural em português.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: שַׂר הַבִּירָה
  choice: comandante da fortaleza
  rationale: שַׂר designa um dirigente ou comandante, e בִּירָה, um complexo fortificado; a expressão mantém o provável caráter administrativo-militar.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: de Jerusalém
  rationale: Com o verbo “encarregar”, a preposição “de” expressa responsabilidade administrativa sobre a cidade sem produzir a formulação pouco idiomática “sobre Jerusalém”.
- source_word: כִּי הוּא
  choice: pois ele era
  rationale: כִּי introduz a razão da nomeação. O pronome singular foi preservado e aponta mais naturalmente para Hananias, o antecedente mais próximo.
- source_word: כְּאִישׁ אֱמֶת
  choice: um homem fiel
  rationale: אֱמֶת pode indicar verdade, confiabilidade ou fidelidade. No contexto da aptidão para o cargo, “fiel” comunica bem o sentido ético sem eliminar alternativas lexicais genuínas.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: e temia a Deus
  rationale: Mantém de forma direta o idioma bíblico do temor reverente a Deus.
- source_word: מֵרַבִּים
  choice: mais do que muitos
  rationale: Reproduz a comparação explícita do hebraico sem restringi-la interpretativamente a “mais do que a maioria”.
theological_decisions:
- issue: Referente do pronome singular na oração de elogio
  choice: Manter “ele”, com referência primária a Hananias, o antecedente singular mais próximo.
  alternative: Entender o elogio como apoio à nomeação dos dois homens em conjunto, apesar da sintaxe singular.
  rationale: O pronome e os predicados singulares em hebraico apontam mais naturalmente para Hananias. Preservar o singular mantém a tensão do texto sem transformá-lo em “eles”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “encarreguei ... de Jerusalém” evita rigidez sintática, enquanto os marcadores preservam a ambiguidade lexical e referencial do hebraico.
