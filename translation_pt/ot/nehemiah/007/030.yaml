  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Geba”; algumas traduções trazem “Gibeá”, por influência da lista paralela em Esdras 2:26 ou devido à confusão entre os nomes semelhantes dessas localidades.'
