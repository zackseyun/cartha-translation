lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: O plural construto de אִישׁ, nesta fórmula de recenseamento, designa os homens vinculados às localidades; a tradução preserva a forma masculina explícita do hebraico.
- source_word: הָרָמָה
  choice: Ramá
  rationale: Nome próprio de lugar, transliterado segundo a forma convencional e natural em português.
- source_word: וָגָבַע
  choice: e Geba
  rationale: A forma consonantal atestada é גבע, correspondente a Geba, e não גבעה, correspondente a Gibeá.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: seiscentos e vinte e um
  rationale: O numeral cardinal foi escrito por extenso, de acordo com o estilo corrente de traduções bíblicas em português.
