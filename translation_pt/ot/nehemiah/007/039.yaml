  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: pt
  text: 'Os sacerdotes: os filhos de Jedaías[a], da casa de Jesua[b]: novecentos e setenta e três.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de” também pode significar descendentes ou membros de uma linhagem familiar, e não apenas filhos imediatos.
    reason: lexical_alternative
  - marker: b
    text: “Jesua” também pode ser traduzido como “Josué”, mas “Jesua” reflete melhor a forma hebraica usada neste contexto pós-exílico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Os sacerdotes
  rationale: O substantivo definido no plural introduz o grupo sacerdotal na lista do recenseamento; a formulação direta preserva o formato nominal do hebraico sem acrescentar verbo.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em contextos genealógicos e censitários, o termo pode indicar descendentes ou integrantes de uma linhagem. A tradução formal preserva a estrutura hebraica, e a nota esclarece sua extensão semântica.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Transliteração portuguesa corrente do nome hebraico, com acento gráfico para indicar a pronúncia natural.
- source_word: לְבֵית יֵשׁוּעַ
  choice: da casa de Jesua
  rationale: Aqui, 'casa' designa uma família ou linhagem, e a preposição לְ indica afiliação no contexto da lista.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: A forma portuguesa 'Jesua' reflete o nome hebraico pós-exílico יֵשׁוּעַ e o distingue convencionalmente de 'Josué'.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: novecentos e setenta e três
  rationale: Expressa com clareza e em português natural o total cardinal de 973.
