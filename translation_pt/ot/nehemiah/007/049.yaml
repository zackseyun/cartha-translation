lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן preserva a fórmula repetida da lista hebraica. Neste contexto genealógico, pode designar filhos, descendentes ou membros de uma linhagem familiar; a nota explicita essa amplitude.
- source_word: חָנָן
  choice: Hanã
  rationale: Nome próprio ou de clã, transliterado conforme a forma hebraica e adaptado à ortografia portuguesa.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Nome próprio presente na lista dos servidores do templo, transliterado de modo natural em português.
- source_word: גָחַר
  choice: Gaar
  rationale: Nome próprio transliterado do hebraico; a forma portuguesa evita introduzir uma consoante que não está representada no nome hebraico.
