  text: os filhos de Paate-Moabe[a], dos filhos de Jesua e Joabe, 2.818.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Paate-Moabe [...], dos descendentes de Jesua e Joabe”. Em hebraico, “filhos de” muitas vezes designa uma linhagem familiar mais ampla, não apenas filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: No contexto desta lista censitária e genealógica, a expressão identifica um grupo familiar ou uma linhagem. A tradução formal preserva o idioma hebraico, enquanto a nota esclarece seu sentido mais amplo.
- source_word: פַחַת מוֹאָב
  choice: Paate-Moabe
  rationale: Nome próprio transliterado segundo formas correntes em português bíblico, sem traduzir seus componentes.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: O לְ prefixado parece marcar uma subdivisão ou vinculação dentro do grupo de Paate-Moabe; “dos filhos de” preserva a estrutura genealógica sem especificar além do hebraico.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa da forma pós-exílica יֵשׁוּעַ, distinguindo-a da forma hebraica mais longa normalmente vertida como Josué.
- source_word: וְיוֹאָב
  choice: e Joabe
  rationale: Conjunção simples seguida da forma portuguesa tradicional do nome próprio.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: '2.818'
  rationale: O número hebraico corresponde exatamente a 2.818; algarismos favorecem a leitura de uma lista censitária, com separador de mil corrente em português.
