revisions:
- from: 'E eu lhes disse: “As portas de Jerusalém não devem ser abertas antes que o sol esquente.[a] Enquanto os guardas ainda estiverem em seus postos, fechem as portas e mantenham-nas bem fechadas.[b] E designem guardas dentre os habitantes de Jerusalém,[c] cada um no seu posto e cada um diante da sua própria casa.”'
  to: 'E eu lhes disse: “As portas de Jerusalém não devem ser abertas até que o sol esquente.[a] Enquanto eles ainda estiverem em seus postos, fechem as portas e mantenham-nas firmes.[b] E designem guardas dentre os habitantes de Jerusalém,[c] cada um no seu posto e cada um diante da sua própria casa.”'
  rationale: A revisão substitui «antes que» por «até que», refletindo diretamente עַד, e ajusta a tradução de אחז para uma formulação que conserva a ideia de prender ou firmar as portas sem pressupor um dispositivo concreto. Também evita explicitar «os guardas» no antecedente de «enquanto eles», pois o hebraico usa apenas o pronome; o contexto de postos de guarda continua acessível ao leitor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:46Z'
