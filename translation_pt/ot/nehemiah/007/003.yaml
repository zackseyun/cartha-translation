  naturalness: A revisão mantém um português atual e fluente. «Enquanto eles ainda estiverem em seus postos» conserva a referência pronominal não explicitada no hebraico, ao mesmo tempo que o contexto de vigilância torna a expressão clara.
  terminology: «Portas», «guardas», «habitantes», «posto» e «diante da sua própria casa» são adequados ao contexto urbano e militar-administrativo. «Firmes» reproduz de modo idiomático o efeito contextual de אחז, sem acrescentar «trancar» ou outro meio específico.
