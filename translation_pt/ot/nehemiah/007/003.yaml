  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: pt
  text: 'E eu lhes disse: “As portas de Jerusalém não devem ser abertas até que o sol esquente.[a] Enquanto eles ainda estiverem em seus postos, fechem as portas e mantenham-nas firmes.[b] E designem guardas dentre os habitantes de Jerusalém,[c] cada um no seu posto e cada um diante da sua própria casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o sol ficar quente”, isto é, não apenas ao nascer do sol, mas mais tarde pela manhã.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “segurem-nas”; neste contexto, a expressão significa tornar as portas firmes ou seguras depois de fechá-las.'
    reason: lexical_alternative
  - marker: c
    text: Ou “estabeleçam turnos de guarda entre os habitantes de Jerusalém”. O termo hebraico pode referir-se tanto aos guardas como aos turnos ou serviços de vigilância.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: não devem ser abertas
  rationale: O nifal expressa sentido passivo, e לא com o imperfeito tem aqui força de proibição ou instrução, não de simples previsão.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: antes que o sol esquente
  rationale: Preserva a imagem concreta do hebraico e indica um momento posterior ao nascer do sol, sem substituí-la pela interpretação 'plena luz do dia'.
- source_word: וְעַד הֵם עֹמְדִים
  choice: enquanto os guardas ainda estiverem em seus postos
  rationale: עמד significa literalmente 'estar de pé', mas, neste contexto de vigilância, refere-se naturalmente a permanecer de serviço ou no posto.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: fechem as portas
  rationale: הגיף denota fechar; 'portas' comunica naturalmente as folhas dos portões já mencionados.
- source_word: וֶאֱחֹזוּ
  choice: mantenham-nas bem fechadas
  rationale: אחז significa literalmente 'segurar' ou 'reter'; após fechar as portas, o sentido contextual é mantê-las firmes ou seguras, sem especificar um mecanismo não declarado.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: designem guardas
  rationale: O hifil de עמד significa pôr ou estabelecer, e מִשְׁמְרוֹת pode designar tanto os guardas como os turnos ou serviços de vigilância.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: dentre os habitantes de Jerusalém
  rationale: 'Expressa o sentido partitivo: os responsáveis pela guarda devem ser escolhidos entre os moradores da cidade.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: cada um no seu posto
  rationale: איש tem força distributiva, e משמר pode indicar posto, turno ou dever de guarda; 'posto' é claro e natural em português.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: e cada um diante da sua própria casa
  rationale: נגד pode significar 'diante de' ou 'em frente a'; a formulação preserva a relação espacial sem reduzi-la a uma vaga proximidade.
