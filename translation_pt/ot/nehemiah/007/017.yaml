lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: É o plural construto de “filhos” e, neste contexto de recenseamento genealógico, designa os membros da linhagem ou família de Azgade. A formulação preserva a expressão hebraica e é clara em português.
- source_word: עַזְגָּד
  choice: Azgade
  rationale: Nome próprio transliterado em forma corrente e natural em português, com vogal final de apoio para facilitar a pronúncia.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: '2.322'
  rationale: A sequência numérica hebraica significa “dois mil, trezentos e vinte e dois”. O uso de algarismos com ponto como separador de milhares comunica claramente o total em português.
