lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: Plural em estado construto de אִישׁ; no contexto de uma lista censitária, refere-se aos homens ou representantes de famílias ligados a uma localidade. A tradução direta preserva a forma do hebraico.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nome próprio de lugar, mantido por transliteração.
- source_word: אַחֵר
  choice: outro
  rationale: O adjetivo pode significar “outro” ou “um outro”. Aqui, provavelmente distingue esta localidade de outra chamada Nebo mencionada na lista; “o outro Nebo” expressa isso naturalmente sem eliminar a alternativa lexical.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: cinquenta e dois
  rationale: Forma portuguesa padrão para o numeral cardinal hebraico, literalmente “cinquenta e dois”.
