base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: pt
  text: Estes procuraram seu registro genealógico[a], mas ele não foi encontrado; por isso, foram excluídos do sacerdócio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o documento que comprovava sua linhagem”. O hebraico se refere a um registro escrito de ascendência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foram considerados impuros quanto ao sacerdócio”. Isto é, ficaram desqualificados para o serviço sacerdotal porque sua ascendência não pôde ser comprovada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes
  rationale: Mantém o demonstrativo plural sem acrescentar um substantivo ausente no hebraico; o referente é recuperado pelo contexto anterior.
- source_word: בִּקְשׁוּ
  choice: procuraram
  rationale: Expressa de modo natural o sentido de buscar ou tentar localizar um documento.
- source_word: כְתָבָם הַמִּתְיַחְשִׂים
  choice: seu registro genealógico
  rationale: Condensa em português corrente a referência a um documento escrito usado para comprovar ou registrar a linhagem, sem especificar indevidamente seu formato.
- source_word: וְלֹא נִמְצָא
  choice: mas ele não foi encontrado
  rationale: O verbo hebraico está no singular, e seu sujeito implícito mais natural é o registro procurado, não as pessoas.
- source_word: וַיְגֹאֲלוּ
  choice: foram excluídos
  rationale: No contexto administrativo e sacerdotal, comunica o resultado prático de serem considerados inaptos, evitando que uma tradução estritamente literal como “foram contaminados” sugira contaminação ritual ocorrida de fato.
- source_word: מִן הַכְּהֻנָּה
  choice: do sacerdócio
  rationale: Reproduz diretamente a referência à condição ou função sacerdotal.
theological_decisions:
- issue: Natureza da exclusão sacerdotal
  choice: foram excluídos do sacerdócio
  alternative: foram considerados impuros para o sacerdócio
  rationale: A tradução principal apresenta a consequência institucional da falta de comprovação genealógica, enquanto a nota conserva a imagem mais literal e a ambiguidade do verbo hebraico sem afirmar que houve impureza ritual efetiva.
translation_notes:
  register: Português moderno, claro e digno, com construção administrativa compreensível ao leitor comum. O ponto e vírgula torna explícita apenas a relação consequencial já indicada pela sequência narrativa, sem ampliar o conteúdo.
