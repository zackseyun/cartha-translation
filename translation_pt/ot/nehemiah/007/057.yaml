  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: pt
  text: 'Os descendentes dos servos de Salomão: os descendentes de Sotai, os descendentes de Soferete e os descendentes de Perida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: descendentes de
  rationale: Nesta lista genealógica de repatriados, בְּנֵי indica membros de uma linhagem ou família, não necessariamente filhos imediatos. “Descendentes de” comunica naturalmente esse sentido em português.
- source_word: עַבְדֵי
  choice: servos de
  rationale: Na expressão construta עַבְדֵי שְׁלֹמֹה, o termo funciona como designação tradicional de um grupo hereditário ligado a Salomão. “Servos” preserva essa designação sem impor, além do que o contexto permite, o sentido mais específico de “escravos”.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: סוֹטַי
  choice: Sotai
  rationale: Transliteração simples do nome próprio segundo a vocalização massorética, adequada à ortografia portuguesa.
- source_word: סוֹפֶרֶת
  choice: Soferete
  rationale: O termo é tratado como nome de família, não traduzido como substantivo ligado à escrita ou contagem. “Soferete” representa de modo legível a vocalização hebraica em português.
- source_word: פְרִידָא
  choice: Perida
  rationale: Transliteração direta e natural do nome próprio segundo a forma vocalizada do texto massorético.
