  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: pt
  text: 'Os porteiros: os filhos de Salum[a], os filhos de Ater, os filhos de Talmon, os filhos de Acube, os filhos de Hatita, os filhos de Sobai, 138.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de” também pode indicar uma linhagem familiar ou um clã, e não apenas filhos homens imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: Os porteiros
  rationale: O termo designa os responsáveis por guardar ou cuidar dos portões, especialmente no serviço do templo. “Porteiros” é claro, tradicional e adequado ao contexto da lista.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a forma genealógica repetida do hebraico. Neste tipo de lista, a expressão também pode indicar descendentes, família ou clã, nuance esclarecida em nota.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: אָטֵר
  choice: Ater
  rationale: Transliteração direta e corrente do nome próprio.
- source_word: טַלְמֹן
  choice: Talmon
  rationale: Transliteração direta e corrente do nome próprio.
- source_word: עַקּוּב
  choice: Acube
  rationale: Forma portuguesa bíblica legível do nome hebraico, representando a consoante duplicada sem impor grafia estrangeira.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Transliteração clara do nome próprio, mantendo o h inicial e a terminação vocálica.
- source_word: שֹׁבָי
  choice: Sobai
  rationale: Transliteração portuguesa que representa o som consonantal inicial e a terminação do hebraico.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: A sequência numérica hebraica totaliza 138; algarismos são naturais e fáceis de consultar em uma lista censitária.
