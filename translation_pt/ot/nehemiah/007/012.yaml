lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural em estado construto de בֵּן. Em uma lista genealógica, identifica os integrantes de uma linhagem ou família; “os filhos de” preserva a forma e o idioma genealógico do hebraico e é corrente em português bíblico.
- source_word: עֵילָם
  choice: Elão
  rationale: Nome próprio vertido segundo sua forma tradicional e amplamente reconhecida em português. Neste contexto, designa a família ou linhagem de Elão, não a região geopolítica.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: A sequência cardinal hebraica totaliza 1.254. Algarismos e o separador de milhar usual em português favorecem a leitura de uma lista censitária; não se acrescenta “pessoas”, pois o termo não está explícito no hebraico.
