lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em listas censitárias e genealógicas do período pós-exílico, בְּנֵי introduz frequentemente um grupo familiar ou clã. “Os filhos de” preserva a forma genealógica hebraica e é compreensível em português, sem ampliar explicitamente o sentido para “descendentes”.
- source_word: זַתּוּא
  choice: Zatu
  rationale: O nome próprio é transliterado, não traduzido. “Zatu” representa de modo natural em português a forma hebraica e evita a grafia inglesa “Zattu”.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: oitocentos e quarenta e cinco
  rationale: A sequência cardinal hebraica expressa exatamente 845; a formulação segue a sintaxe numérica corrente do português.
