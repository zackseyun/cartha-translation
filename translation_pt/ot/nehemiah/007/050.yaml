lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן pode indicar descendência ou pertencimento a uma família neste contexto genealógico. “Os filhos de” preserva a estrutura repetitiva e formal do hebraico, enquanto a nota registra os sentidos contextuais possíveis.
- source_word: רְאָיָה
  choice: Reaías
  rationale: Nome próprio transliterado segundo uma forma portuguesa reconhecível e coerente com o hebraico vocalizado.
- source_word: רְצִין
  choice: Rezim
  rationale: Forma tradicional em português para o nome hebraico, com adaptação fonológica e ortográfica natural.
- source_word: נְקוֹדָא
  choice: Necoda
  rationale: Transliteração adaptada à ortografia portuguesa, preservando de perto a forma consonantal e vocalizada hebraica.
