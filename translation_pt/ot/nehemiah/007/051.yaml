    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, nesta lista genealógica, pode indicar filhos, descendentes ou membros de uma linhagem. “Os filhos de” preserva de modo transparente a fórmula hebraica, e a nota registra seu alcance mais amplo.
- source_word: גַזָּם
  choice: Gazão
  rationale: Nome próprio transliterado segundo uma forma portuguesa tradicional e legível, sem traduzir seu possível sentido etimológico.
- source_word: עֻזָּא
  choice: Uza
  rationale: Nome próprio transliterado em forma natural para leitores de português.
- source_word: פָסֵחַ
  choice: Paseá
  rationale: Nome próprio transliterado de modo a refletir a pronúncia hebraica e a facilitar a leitura em português.
