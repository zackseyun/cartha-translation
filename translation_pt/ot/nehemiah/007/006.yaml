  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: pt
  text: 'Estes são os filhos da província[a] que subiram do cativeiro dos exilados[b], os quais Nabucodonosor, rei da Babilônia, havia exilado, e que voltaram para Jerusalém e para Judá, cada homem para a sua cidade[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os habitantes ou membros da província.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de forma mais fluente, “do exílio”. O hebraico emprega literalmente dois substantivos relacionados: “do cativeiro dos exilados”.'
    reason: lexical_alternative
  - marker: c
    text: Expressão distributiva que se refere aos repatriados em seus grupos familiares ou domésticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: filhos da província
  rationale: Preserva o idiomatismo hebraico de pertencimento, adequado ao caráter genealógico e administrativo da lista; a nota esclarece o sentido sem apagar a forma da fonte.
- source_word: הָעֹלִים
  choice: que subiram
  rationale: Mantém o verbo tradicional de subida em direção à terra e a Jerusalém.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: do cativeiro dos exilados
  rationale: Representa os dois substantivos relacionados do hebraico, embora em português corrente a ideia possa ser expressa mais simplesmente como 'do exílio'.
- source_word: אֲשֶׁר הֶגְלָה
  choice: os quais ... havia exilado
  rationale: Torna explícitos os exilados como objeto da ação de Nabucodonosor e conserva o sentido de remoção forçada.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa bíblica tradicional e amplamente reconhecida.
- source_word: וַיָּשׁוּבוּ
  choice: e que voltaram
  rationale: Expressa o retorno e integra a oração à descrição dos repatriados, evitando uma coordenação pouco natural em português.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: para Jerusalém e para Judá
  rationale: Reproduz a preposição repetida e distingue a cidade da região mais ampla de Judá.
- source_word: אִישׁ לְעִירוֹ
  choice: cada homem para a sua cidade
  rationale: Preserva a forma masculina singular e distributiva do hebraico; no contexto, abrange os repatriados organizados por famílias ou casas.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: cada homem para a sua cidade
  alternative: cada um para a sua cidade
  rationale: A tradução mantém a forma masculina singular da fonte, sem supor que as famílias dos repatriados estejam excluídas.
- issue: Relação sintática de וַיָּשׁוּבוּ com a descrição dos repatriados
  choice: e que voltaram
  alternative: e eles voltaram
  rationale: A forma relativa é natural em português e relaciona claramente o retorno aos mesmos integrantes da lista, sem alterar o conteúdo da oração hebraica.
translation_notes:
  register: Português moderno, digno e legível, com estrutura própria de uma introdução a lista histórica. Mantêm-se os idiomatismos marcantes do hebraico no texto, acompanhados de notas esclarecedoras.
