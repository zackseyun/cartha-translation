  text: the sons of Jaala[a], the sons of Darkon, the sons of Giddel.
translation:
  language: pt
  text: os filhos de Jaala[a], os filhos de Darcom e os filhos de Gidel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas versões escrevem este nome como «Jaalá», seguindo outra tradição de grafia e a comparação com a lista paralela de Esdras 2:56.
