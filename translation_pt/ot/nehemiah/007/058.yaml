lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em listas genealógicas pós-exílicas, בְּנֵי introduz uma família ou linhagem. A tradução formal «os filhos de» preserva a expressão hebraica e é natural nesse gênero em português, embora possa abranger descendentes.
- source_word: יַעְלָא
  choice: Jaala
  rationale: Nome próprio transliterado segundo a forma do texto hebraico de Neemias; não deve ser traduzido.
- source_word: דַרְקוֹן
  choice: Darcom
  rationale: Transliteração aportuguesada do nome próprio hebraico, com «m» final para representar naturalmente em português a nasal final.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Transliteração do nome próprio hebraico, com grafia simples e legível em português.
