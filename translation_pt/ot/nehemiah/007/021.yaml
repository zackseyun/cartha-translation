lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, em listas genealógicas e censitárias, pode indicar filhos, descendentes ou membros de uma linhagem. “Os filhos de” preserva a forma hebraica e o estilo tradicional da lista, enquanto a nota esclarece o sentido coletivo possível.
- source_word: אָטֵר
  choice: Ater
  rationale: Nome próprio de pessoa ou família, transliterado de modo corrente em português.
- source_word: לְחִזְקִיָּה
  choice: de Ezequias
  rationale: Neste contexto, o לְ provavelmente indica vinculação ou subdivisão dentro da família de Ater. “De Ezequias” mantém a concisão e a ambiguidade estrutural do hebraico.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: noventa e oito
  rationale: Número cardinal expresso na forma padrão do português contemporâneo.
