base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: pt
  text: 'Os levitas: os filhos de Jesua, de Cadmiel, dos filhos[a] de Hodeva, setenta e quatro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Hodeva”. A expressão hebraica “filhos de” pode designar uma linhagem familiar mais ampla, e não somente filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Os levitas
  rationale: Substantivo plural definido que introduz este grupo na lista do recenseamento; mantém-se a forma nominal, sem acrescentar um verbo ausente no hebraico.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a expressão genealógica do hebraico, que neste contexto pode abranger uma linhagem ou família, e não apenas filhos imediatos.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Forma portuguesa tradicional do nome pós-exílico, distinguindo-o da forma mais longa normalmente vertida como Josué.
- source_word: לְקַדְמִיאֵל
  choice: de Cadmiel
  rationale: O prefixo לְ expressa aqui relação ou pertencimento dentro da linhagem; “de” é natural em português.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: dos filhos de Hodeva
  rationale: Conserva a estrutura genealógica em camadas e as relações marcadas pelos prefixos לְ, sem simplificar indevidamente a identificação familiar.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: setenta e quatro
  rationale: Forma corrente em português para o total do recenseamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa de lista. Os nomes seguem formas bíblicas reconhecíveis em português. O marcador da nota foi colocado junto à expressão “filhos”, à qual a alternativa lexical se refere.
