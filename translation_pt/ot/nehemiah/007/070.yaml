base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: pt
  text: E alguns dos chefes das casas paternas deram ao tesouro para a obra vinte mil dáricos de ouro[a] e duas mil e duzentas minas de prata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O dárico era uma moeda persa de ouro.
    reason: cultural_note
  - marker: b
    text: A mina era uma antiga unidade de peso e, por extensão, de valor monetário.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: E alguns dos chefes das casas paternas
  rationale: O מִן prefixado indica procedência dentre o grupo, daí o sentido idiomático de “alguns dos”. “Chefes das casas paternas” preserva a estrutura social e genealógica expressa pelo hebraico.
- source_word: נָתְנוּ
  choice: deram
  rationale: Traduz diretamente o qal perfeito, sem acrescentar nuances como “doaram” ou “contribuíram”.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: ao tesouro para a obra
  rationale: אוֹצָר designa o tesouro ou depósito de valores, e הַמְּלָאכָה refere-se à obra financiada; a formulação comunica naturalmente a finalidade.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת
  choice: vinte mil dáricos de ouro
  rationale: Mantém a moeda persa historicamente específica e expressa שְׁתֵּי רִבּוֹת no formato numérico corrente em português.
- source_word: וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם
  choice: e dois mil e duzentas minas de prata
  rationale: “Mina” preserva a antiga unidade de peso e valor; a ordem foi ajustada à sintaxe natural do português, sem alterar a quantidade nem o material.
