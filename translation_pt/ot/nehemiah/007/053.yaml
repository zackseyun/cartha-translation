  text: os filhos de Bacbuque[a], os filhos de Hacufa, os filhos de Harhur—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nesta lista genealógica, a expressão hebraica traduzida como «filhos de» também pode indicar descendentes ou integrantes de uma família ou clã, e não apenas filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista genealógica e comunitária, a construção hebraica pode indicar filhos, descendentes ou integrantes de um grupo familiar. A forma «os filhos de» preserva a estrutura repetitiva do original, enquanto a nota esclarece sua extensão possível.
- source_word: בַקְבּוּק
  choice: Bacbuque
  rationale: Nome próprio transliterado segundo convenções naturais do português, representando as consoantes hebraicas e evitando uma aparência excessivamente estrangeira.
- source_word: חֲקוּפָא
  choice: Hacufa
  rationale: Nome próprio transliterado de modo legível em português; «H» representa a consoante inicial hebraica, e «f» reflete a pronúncia de פ sem daguesh.
- source_word: חַרְחוּר
  choice: Harur
  rationale: Nome próprio transliterado; a forma conserva os principais sons consonantais sem tentar traduzir uma etimologia incerta e irrelevante no contexto.
