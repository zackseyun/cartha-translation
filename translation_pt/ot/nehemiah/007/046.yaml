lexical_decisions:
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: O termo técnico נְתִינִים designa um grupo ligado ao serviço do templo no período pós-exílico. A tradução funcional é clara em português e evita uma transliteração pouco compreensível, enquanto a nota preserva o termo tradicional.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Mantém a forma recorrente e solene das listas genealógicas, embora aqui possa abranger descendentes ou integrantes de uma família.
- source_word: צִחָא
  choice: Zia
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas do nome hebraico.
- source_word: חֲשֻׂפָא
  choice: Hasufa
  rationale: Transliteração portuguesa direta do nome; a variante Hassufa é registrada em nota.
- source_word: טַבָּעוֹת
  choice: Tabaote
  rationale: Transliteração legível em português, representando o nome hebraico sem reproduzir artificialmente a duplicação consonantal usada em algumas convenções inglesas.
