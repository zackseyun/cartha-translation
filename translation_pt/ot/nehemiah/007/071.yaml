base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: pt
  text: E o que o restante do povo deu foi vinte mil dáricos de ouro[a], duas mil minas de prata[b] e sessenta e sete túnicas dos sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O dárico era uma moeda persa de ouro.
    reason: cultural_note
  - marker: b
    text: A mina era uma antiga unidade de peso e, por extensão, de valor monetário.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ שְׁאֵרִית הָעָם
  choice: O restante do povo deu
  rationale: A construção relativa resumptiva é vertida como uma oração natural em português. Neste contexto administrativo, שְׁאֵרִית indica a parte restante do povo, sem necessariamente carregar o sentido teológico de “remanescente”.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹא
  choice: vinte mil dáricos de ouro
  rationale: Mantém o nome historicamente específico da moeda persa e expressa שְׁתֵּי רִבּוֹא no formato numérico corrente em português.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: duas mil minas de prata
  rationale: Preserva a antiga unidade de peso e valor מָנִים, com ordem natural dos elementos em português.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: túnicas sacerdotais
  rationale: Traduz כָּתְנֹת por “túnicas” e expressa de modo conciso sua relação com os sacerdotes, sem acrescentar uma função ritual não declarada.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: sessenta e sete
  rationale: Forma numérica padrão no português moderno.
theological_decisions:
- issue: Sentido de שְׁאֵרִית הָעָם
  choice: o restante do povo
  alternative: o remanescente do povo
  rationale: A lista distingue os demais doadores dos grupos já mencionados; por isso, a expressão administrativa “o restante” é preferível, sem negar que שְׁאֵרִית possa significar “remanescente” em outros contextos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantêm-se os termos históricos “dáricos” e “minas”, explicados em notas. A coordenação e a ordem dos termos foram ajustadas para fluência natural sem alterar o conteúdo do hebraico.
