translation:
  language: pt
  text: Além dos seus escravos e escravas[a], num total de 7.337; e eles tinham 245 cantores e cantoras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos e servas”. Os termos hebraicos podem ter sentido mais geral, mas, neste contexto censitário, provavelmente se referem a escravos e escravas ligados às casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: além de
  rationale: Introduz um grupo adicional, não incluído no total anterior, de modo conciso e natural em um registro censitário.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: seus escravos e escravas
  rationale: Os dois termos distinguem explicitamente pessoas de sexo masculino e feminino em condição servil. Neste contexto de contagem de pessoas ligadas às casas, “escravos e escravas” expressa com clareza a provável realidade social, sem apagar a alternativa lexical indicada em nota.
- source_word: אֵלֶּה
  choice: que eram
  rationale: O demonstrativo hebraico aponta para o número seguinte; “que eram” produz sintaxe portuguesa natural sem alterar o sentido.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: '7.337'
  rationale: A notação numérica moderna é apropriada à lista censitária e preserva exatamente o total hebraico.
- source_word: וְלָהֶם
  choice: e eles tinham
  rationale: Traduz de modo idiomático a construção hebraica de posse, literalmente “e para eles”.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: cantores e cantoras
  rationale: Preserva a distinção explícita entre as formas masculina e feminina e soa natural em português atual.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: A notação numérica moderna mantém com exatidão o total e combina com o caráter censitário da passagem.
