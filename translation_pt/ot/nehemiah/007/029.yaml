lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: O plural construto de אִישׁ introduz os homens vinculados às cidades enumeradas; a tradução direta preserva a forma masculina do hebraico e o estilo de lista censitária.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Transliteração portuguesa corrente do topônimo hebraico, preservando seus dois componentes sem traduzir o nome.
- source_word: כְּפִירָה
  choice: Quefira
  rationale: Transliteração adaptada à ortografia portuguesa, na qual “qu” antes de “e” representa adequadamente o som consonantal inicial.
- source_word: וּבְאֵרוֹת
  choice: e Beerote
  rationale: Reproduz a conjunção hebraica e translitera o topônimo em forma legível para falantes de português.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: O numeral hebraico totaliza 743; algarismos favorecem a leitura da lista censitária sem alterar a quantidade.
