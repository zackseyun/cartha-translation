base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: pt
  text: Todos os servidores do templo e os filhos dos servos de Salomão eram trezentos e noventa e dois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os netineus”, transliteração tradicional do nome de uma classe de servidores do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Introduz o total conjunto dos dois grupos e produz uma formulação natural em português.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: Designa uma classe reconhecida ligada ao serviço do templo; a tradução funcional é mais clara que uma transliteração para o leitor moderno.
- source_word: וּבְנֵי
  choice: e os descendentes de
  rationale: Embora o sentido formal seja “filhos de”, em uma lista comunitária ou genealógica o termo pode abranger descendentes e membros do grupo.
- source_word: עַבְדֵי
  choice: servos
  rationale: עֶבֶד pode significar servo ou escravo; nesta designação coletiva, “servos” preserva a amplitude lexical sem enfatizar uma condição específica não explicitada no contexto.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: trezentos e noventa e dois
  rationale: Reproduz por extenso o número cardinal hebraico em português corrente.
