lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: É a correspondência formal mais direta para o plural construto de בֵּן e preserva a estrutura repetitiva da lista hebraica; neste contexto genealógico, pode abranger descendentes ou integrantes de uma linhagem.
- source_word: לְבָנָה
  choice: Lebaná
  rationale: Transliteração do nome próprio conforme a forma massorética, adaptada à acentuação e à ortografia naturais do português.
- source_word: חֲגָבָה
  choice: Hagabá
  rationale: Transliteração do nome próprio hebraico, com acento gráfico para indicar naturalmente em português a tonicidade final.
- source_word: שַׁלְמָי
  choice: Salmai
  rationale: Transliteração portuguesa da forma massorética; em português, o s inicial representa adequadamente o som de שׁ, sem necessidade do dígrafo inglês sh.
