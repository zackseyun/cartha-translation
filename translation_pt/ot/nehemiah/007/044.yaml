  text: 'Os cantores: os filhos de Asafe[a], cento e quarenta e oito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Asafe”. Em hebraico, “filhos de” pode indicar uma linhagem familiar ou a pertença a um grupo, não apenas filhos imediatos.
