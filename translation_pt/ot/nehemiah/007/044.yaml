lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio substantivado da raiz שׁיר designa aqueles que cantam. “Os cantores” é natural em português e mais preciso que o termo mais amplo “os músicos”.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: A expressão preserva a forma genealógica hebraica usada no registro, embora neste contexto possa abranger descendentes ou integrantes de uma linhagem ou corporação.
- source_word: אָסָף
  choice: Asafe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: cento e quarenta e oito
  rationale: Representação direta e idiomática do número cardinal hebraico em português.
