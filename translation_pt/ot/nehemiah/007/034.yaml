lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן que introduz um grupo familiar. “Filhos de” preserva a forma genealógica tradicional e permanece claro em português.
- source_word: עֵילָם
  choice: Elão
  rationale: Nome próprio vertido segundo sua forma portuguesa consagrada no contexto bíblico.
- source_word: אַחֵר
  choice: o outro
  rationale: O adjetivo significa “outro” ou “um outro” e aqui distingue este Elão do grupo de Elão já mencionado em Neemias 7:12. “O outro” expressa essa distinção com naturalidade.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: A sequência cardinal corresponde exatamente a mil duzentos e cinquenta e quatro; algarismos favorecem a leitura da lista censitária.
