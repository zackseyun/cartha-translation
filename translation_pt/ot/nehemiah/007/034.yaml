  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um outro Elão”. O hebraico permite ambas as traduções; “o outro Elão” salienta a distinção em relação ao Elão mencionado anteriormente neste capítulo.'
