  rationale: Construção cardinal hebraica padrão, vertida diretamente em português idiomático.
- source_word: חֲמִשִּׁים וַחֲמִשָּׁה
  choice: cinquenta e cinco
  rationale: O hebraico diz literalmente “cinquenta e cinco”; a forma portuguesa mantém com exatidão o total e soa natural.
