base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: pt
  text: os filhos de Sefatias[a], os filhos de Hatil, os filhos de Poquerete-Hazebaim[b] e os filhos de Amom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os descendentes de” em todo o versículo; em listas genealógicas, a expressão hebraica “filhos de” muitas vezes indica uma linhagem familiar.
    reason: lexical_alternative
  - marker: b
    text: Poquerete-Hazebaim também pode ser representado como “Poquerete de Zebaím”; aqui, a expressão hebraica foi preservada como nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Mantém a estrutura repetitiva e formal do hebraico na lista genealógica. Nesse contexto, a expressão também pode designar os descendentes ou o grupo familiar, não apenas filhos imediatos.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Transliteração direta do nome próprio ou familiar, sem tentar traduzir seu possível significado.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Poquerete-Hazebaim
  rationale: Preserva a expressão hebraica composta como nome familiar e usa grafia legível em português. O hífen indica que os dois elementos formam uma única designação.
- source_word: אָמֽוֹן
  choice: Amom
  rationale: Forma aportuguesada do nome próprio nesta lista familiar; não é interpretado como substantivo comum nem como termo teológico.
