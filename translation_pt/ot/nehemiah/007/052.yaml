  text: the sons of Besai[a], the sons of Meunim[c][b], the sons of Nephushesim.
translation:
  language: pt
  text: os filhos de Besai[a], os filhos de Meunim[b] e os filhos de Nefusesim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Bessai”. A grafia dos nomes varia conforme as convenções de transliteração e a comparação com tradições textuais paralelas.
    reason: lexical_alternative
  - marker: b
    text: Ou “meunitas”, caso o termo seja entendido como designação étnica ou de grupo, e não simplesmente como nome de família.
    reason: lexical_alternative
  - marker: c
    text: Ou “Nefusim”, conforme a forma encontrada na lista paralela e adotada por algumas tradições; “Nefusesim” representa mais diretamente a grafia hebraica deste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista genealógica e comunitária, a expressão construta introduz cada família ou grupo. “Os filhos de” preserva a fórmula repetida do hebraico sem excluir o sentido mais amplo de descendentes ou membros do clã.
- source_word: בֵסַי
  choice: Besai
  rationale: Nome próprio transliterado de acordo com o hebraico; a forma é clara e adequada às convenções do português.
- source_word: מְעוּנִים
  choice: Meunim
  rationale: A transliteração conserva a ambiguidade entre nome de família e designação de um povo, sem decidir que se trata necessariamente de um etnônimo.
- source_word: נפושסים
  choice: Nefusesim
  rationale: Transliteração adaptada à ortografia portuguesa, representando de modo relativamente direto a forma consonantal preservada neste versículo.
