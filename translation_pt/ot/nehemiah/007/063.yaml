  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: pt
  text: 'E, dentre os sacerdotes: os filhos de Hobaías, os filhos de Hacoz e os filhos de Barzilai, que havia tomado por esposa uma das filhas de Barzilai, o gileadita, e passou a ser chamado pelo nome deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: E, dentre os sacerdotes
  rationale: Preserva o sentido partitivo de מִן e introduz naturalmente, em português, o subgrupo das famílias sacerdotais.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Mantém a estrutura genealógica repetida do hebraico; no contexto, pode abranger descendentes ou membros da linhagem familiar.
- source_word: חֳבַיָּה
  choice: Hobaías
  rationale: Transliteração portuguesa reconhecível do nome hebraico.
- source_word: הַקּוֹץ
  choice: Hacoz
  rationale: Forma transliterada adequada ao português, incorporando o artigo hebraico como parte do nome tradicional da família sacerdotal.
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Transliteração consistente do mesmo nome tanto na designação da família quanto na referência ao ancestral gileadita.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: que havia tomado por esposa uma das filhas de
  rationale: Expressa com clareza o casamento com uma integrante daquela família e conserva a anterioridade da ação em relação à adoção do nome.
- source_word: הַגִּלְעָדִי
  choice: o gileadita
  rationale: Reproduz de modo conciso o gentílico que identifica a origem regional de Barzilai.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: e passou a ser chamado pelo nome deles
  rationale: Preserva a construção passiva e o sufixo plural do hebraico. 'Passou a ser chamado' comunica naturalmente o resultado da adoção do nome familiar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com cadência de registro genealógico. A repetição de 'os filhos de' foi mantida por refletir a forma da lista hebraica. O referente singular de 'que havia tomado' é o ancestral da linhagem chamada Barzilai; 'deles' conserva o plural hebraico e aponta para a família das filhas de Barzilai.
