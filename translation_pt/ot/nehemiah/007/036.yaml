translation_notes:
  register: Formulação concisa, digna e adequada ao estilo enumerativo da lista. Mantém o paralelismo do hebraico sem acrescentar “homens” ou “descendentes”, sentidos possíveis no contexto, mas não explicitados lexicalmente.
