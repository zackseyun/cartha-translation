lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: É o plural construto de בֵּן, “filho”. Embora em uma lista de recenseamento possa designar descendentes ou integrantes de um grupo associado a um lugar, “os filhos de” preserva de modo transparente a forma hebraica e é uma expressão bíblica compreensível em português.
- source_word: יְרֵחוֹ
  choice: Jericó
  rationale: Nome próprio de lugar vertido segundo a forma tradicional e corrente em português.
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: trezentos e quarenta e cinco
  rationale: A sequência de numerais hebraicos totaliza inequivocamente 345; a conjunção “e” segue o uso natural do português.
