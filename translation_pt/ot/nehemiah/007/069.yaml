  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: pt
  text: E alguns dos chefes das casas paternas contribuíram para a obra. O governador[a] deu ao tesouro mil dáricos de ouro[b], cinquenta bacias e quinhentas e trinta túnicas sacerdotais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tirsata”, título administrativo persa.
    reason: lexical_alternative
  - marker: b
    text: Os dáricos eram moedas persas de ouro.
    reason: cultural_note
  - marker: c
    text: O texto hebraico diz “quinhentas e trinta”. O paralelo em Esdras 2:69 registra “cem túnicas sacerdotais”.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: E alguns dos chefes das casas paternas
  rationale: Preserva o sentido partitivo de וּמִקְצָת e traduz a designação social pós-exílica de modo próximo ao hebraico, mas ainda compreensível em português.
- source_word: נָתְנוּ לַמְּלָאכָה
  choice: contribuíram para a obra
  rationale: Neste contexto de doações, נָתְנוּ significa literalmente que eles 'deram'; 'contribuíram' expressa com naturalidade a ação, enquanto לַמְּלָאכָה se refere à obra ou ao empreendimento em andamento.
- source_word: הַתִּרְשָׁתָא
  choice: o governador
  rationale: Traduz o título administrativo persa por sua função para dar clareza ao leitor moderno; a forma transliterada é registrada em nota.
- source_word: לָאוֹצָר
  choice: ao tesouro
  rationale: Em uma relação de objetos valiosos doados, 'tesouro' representa adequadamente o depósito ou reserva designado por אוֹצָר.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: mil dáricos de ouro
  rationale: Identifica com precisão histórica as moedas persas de ouro, em vez de empregar o menos específico 'moedas' ou o anacrônico 'dracmas'.
- source_word: מִזְרָקוֹת
  choice: bacias
  rationale: O termo designa recipientes, possivelmente de uso ritual; 'bacias' mantém a referência concreta sem impor uma função mais específica do que o texto declara.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: túnicas sacerdotais
  rationale: כָּתְנוֹת são vestes do tipo túnica, e o qualificativo sacerdotal comunica de forma natural que eram destinadas aos sacerdotes.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: quinhentas e trinta
  rationale: A expressão hebraica soma 'trinta' a 'quinhentas', resultando em 530. A leitura '535' da camada inglesa fornecida não corresponde ao texto hebraico.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém-se a expressão sociocultural ''casas paternas''; o título persa é traduzido no texto e transliterado em nota. A contagem segue diretamente o WLC: 530, não 535.'
