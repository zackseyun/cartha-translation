  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: pt
  text: 'Os que vieram com Zorobabel: Jesua, Neemias, Azarias, Raamias[a], Naamani, Mardoqueu, Bilsã, Misperete, Bigvai, Neum[b] e Baaná. O número dos homens do povo de Israel:[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na lista paralela de Esdras 2:2, este nome aparece como Reelaías.
    reason: alternative_reading
  - marker: b
    text: Na lista paralela de Esdras 2:2, este nome aparece como Reum.
    reason: alternative_reading
  - marker: c
    text: Esta frase introduz os totais do recenseamento, cuja enumeração começa no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים
  choice: os que vieram
  rationale: O particípio com artigo funciona como substantivo e designa um grupo definido; a oração relativa é natural em português neste contexto introdutório.
- source_word: עִם
  choice: com
  rationale: Equivalente direto da preposição de companhia.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa corrente do nome pós-exílico, distinguindo-o de Josué conforme o uso habitual em Esdras–Neemias.
- source_word: רַעַמְיָה
  choice: Raamias
  rationale: Segue a forma do Texto Massorético em Neemias, adaptada à transliteração portuguesa; a divergência de Esdras 2:2 é registrada em nota.
- source_word: נַחֲמָנִי
  choice: Naamani
  rationale: Transliteração clara da forma massorética do nome.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Forma portuguesa tradicional e reconhecível do nome, sem pressupor que se trate do personagem do livro de Ester.
- source_word: בִּלְשָׁן
  choice: Bilsã
  rationale: Adaptação natural à ortografia e à pronúncia portuguesas.
- source_word: מִסְפֶּרֶת
  choice: Misperete
  rationale: Transliteração portuguesa da forma massorética do nome próprio.
- source_word: בִּגְוַי
  choice: Bigvai
  rationale: Transliteração corrente e próxima da forma hebraica.
- source_word: נְחוּם
  choice: Neum
  rationale: Segue a forma do Texto Massorético de Neemias; a variante da lista paralela é preservada em nota.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: O número dos homens do povo de Israel foi o seguinte
  rationale: Preserva o substantivo masculino explícito אַנְשֵׁי e apresenta naturalmente em português a enumeração que começa no versículo seguinte.
theological_decisions:
- issue: Linguagem masculina do recenseamento em אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: os homens do povo de Israel
  alternative: o povo de Israel
  rationale: O hebraico emprega explicitamente o plural masculino construto “homens de”. A tradução conserva esse dado lexical sem transformá-lo em afirmação doutrinária sobre exclusão.
- issue: Formas dos nomes diferentes em Esdras 2:2
  choice: Raamias e Neum no texto principal
  alternative: Reelaías e Reum
  rationale: O texto principal segue as formas da fonte hebraica de Neemias 7:7, sem harmonizar a lista com Esdras; as diferenças relevantes permanecem visíveis nas notas.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis ao leitor brasileiro e inteligíveis internacionalmente. Os dois-pontos após Zorobabel introduzem a lista de acompanhantes; a formulação final e os dois-pontos preservam sua função de cabeçalho para os números que seguem.
