lexical_decisions:
- source_word: וְהָעִיר
  choice: A cidade
  rationale: הָעִיר significa diretamente “a cidade”. O וְ inicial pode ser traduzido por “e”, mas pode ficar implícito em português natural quando introduz esta descrição contextual.
- source_word: רַחֲבַת יָדַיִם
  choice: ampla
  rationale: A expressão, literalmente ligada à ideia de largura ou extensão, descreve uma cidade espaçosa. “Ampla” comunica isso com naturalidade.
- source_word: וּגְדוֹלָה
  choice: e grande
  rationale: גדולה se refere aqui ao tamanho da cidade; “grande” preserva o sentido espacial e a coordenação hebraica.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: mas havia poucos habitantes nela
  rationale: מעט indica pequeno número. “Habitantes” expressa naturalmente o sentido contextual de העם, enquanto “mas” explicita o contraste entre o tamanho da cidade e sua população reduzida.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: e não havia casas construídas
  rationale: אין indica inexistência, e בנוים é o particípio passivo “construídas”. Evita-se “reconstruídas”, pois o hebraico não contém explicitamente a noção de reconstrução.
