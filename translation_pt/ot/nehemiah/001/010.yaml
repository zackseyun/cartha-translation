id: NEH.1.10
reference: Nehemiah 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: pt
  text: Mas eles são teus servos e teu povo, que resgataste com teu grande poder e com tua mão forte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com tua mão poderosa”; literalmente, “com tua mão forte”, expressão frequente para a ação poderosa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Mas eles
  rationale: 'A conjunção liga o versículo à súplica anterior e, no contexto, tem leve força contrastiva: apesar do pecado e do exílio, eles continuam pertencendo a Deus.'
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Embora עבד também possa significar escravo, aqui está em primeiro plano a relação de serviço e pertencimento a Deus.
- source_word: וְעַמֶּךָ
  choice: e teu povo
  rationale: עם designa coletivamente o povo de Deus; o possessivo explícito preserva a ênfase da oração.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo retoma naturalmente, em português, tanto 'servos' quanto 'povo'.
- source_word: פָּדִיתָ
  choice: resgataste
  rationale: פדה expressa a obtenção de liberdade por um ato de livramento. 'Resgataste' preserva essa dimensão e a ressonância do êxodo em linguagem portuguesa clara.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: com teu grande poder
  rationale: כח indica força ou poder, e a preposição apresenta o meio pelo qual Deus realizou o resgate.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: e com tua mão forte
  rationale: A formulação conserva de modo transparente a metáfora hebraica da mão como expressão da ação poderosa de Deus.
theological_decisions:
- issue: Linguagem de redenção na oração de Neemias
  choice: resgataste
  alternative: redimiste; livraste
  rationale: '''Resgataste'' mantém a ideia de libertação obtida pela ação de Deus e a provável evocação do êxodo, sem introduzir no versículo especificações doutrinárias posteriores.'
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes ('teus', 'tua', 'resgataste'). A ordem e o paralelismo do hebraico foram preservados sem sacrificar a naturalidade.
