  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: pt
  text: 'E eles me disseram: “Os remanescentes que sobreviveram ao cativeiro[a] e estão lá na província passam por grande aflição e vergonha[b]. A muralha de Jerusalém está cheia de brechas, e seus portões foram queimados pelo fogo.”


    [a] Ou “ao exílio”.

    [b] Ou “passam por grande adversidade e desonra”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao exílio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “passam por grande adversidade e desonra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: E eles me disseram
  rationale: Mantém de modo natural a sequência narrativa introduzida pelo wayyiqtol, sem acrescentar nuance temporal não expressa.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: Os remanescentes que sobreviveram
  rationale: “Remanescentes” preserva o sentido coletivo dos que ficaram após a catástrofe, e “sobreviveram” comunica naturalmente a repetição da raiz שׁאר sem produzir uma formulação pesada em português.
- source_word: מִן הַשְּׁבִי
  choice: ao cativeiro
  rationale: No contexto, a expressão indica a deportação/cativeiro do qual esse grupo sobreviveu ou permaneceu. “Exílio” continua sendo uma alternativa legítima e é registrada em nota.
- source_word: שָׁם בַּמְּדִינָה
  choice: estão lá na província
  rationale: מְדִינָה designa uma província administrativa no período persa; “lá” conserva o advérbio hebraico e esclarece a localização dos remanescentes.
- source_word: בְּרָעָה גְדֹלָה וּבְחֶרְפָּה
  choice: passam por grande aflição e vergonha
  rationale: רָעָה indica aqui adversidade grave, não mal moral; חֶרְפָּה expressa vergonha ou desonra pública. A formulação é clara e corrente em português.
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: A muralha de Jerusalém está cheia de brechas
  rationale: O particípio passivo de פרץ descreve uma muralha rompida ou aberta em diversos pontos. “Cheia de brechas” expressa com precisão o estado atual da fortificação.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: e seus portões foram queimados pelo fogo
  rationale: Preserva a imagem hebraica da destruição mediante fogo e usa “portões” para as entradas fortificadas da cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição hebraica da raiz שׁאר foi parcialmente preservada por “remanescentes” e “sobreviveram”, evitando a construção pouco idiomática “os restantes que restaram”. Os marcadores foram posicionados junto às expressões às quais suas notas realmente se referem.
