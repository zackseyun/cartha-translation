  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: pt
  text: 'Lembra-te, por favor, da palavra que ordenaste a Moisés, teu servo, dizendo: “Se vocês agirem com infidelidade[a], eu os espalharei entre os povos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forem infiéis” ou “quebrarem a fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre as nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Lembra-te, por favor
  rationale: O imperativo זְכָר pede que Deus se lembre, e a partícula נָא comunica súplica respeitosa. A formulação mantém tanto o pedido quanto seu tom reverente.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”; aqui designa a declaração divina transmitida a Moisés. “A palavra” preserva a forma lexical sem defini-la mais estreitamente como promessa ou advertência.
- source_word: צִוִּיתָ
  choice: ordenaste
  rationale: O verbo צוה significa normalmente “ordenar”. Embora a citação contenha uma advertência condicional, o texto a apresenta como palavra dada por ordem divina.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: Em referência a Moisés, עבד expressa seu serviço e sua relação oficial com Deus; “servo” é natural e evita a conotação indevida de escravidão como condição social.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Representa de modo direto o infinitivo quotativo que introduz o conteúdo da ordem.
- source_word: תִּמְעָלוּ
  choice: agirem com infidelidade
  rationale: מעל indica uma ação desleal ou quebra de fidelidade, frequentemente em contexto de aliança. A escolha preserva a força verbal e relacional sem reduzi-la ao termo genérico “pecar”.
- source_word: אָפִיץ
  choice: espalharei
  rationale: O hifil de פוץ significa fazer dispersar ou espalhar. “Espalharei” comunica diretamente o juízo de dispersão.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: O plural עַמִּים designa povos. A tradução mantém sua referência plural e coletiva; “nações” também é possível.
theological_decisions:
- issue: Nuance de aliança em מעל na oração condicional
  choice: Se vocês agirem com infidelidade
  alternative: Se vocês forem infiéis; se vocês quebrarem a fidelidade
  rationale: A passagem recorda as sanções da aliança transmitidas por Moisés. “Agirem com infidelidade” conserva a ideia de conduta que viola a fidelidade devida, sem especificar além do texto a categoria jurídica ou doutrinária.
translation_notes:
  register: Português moderno, claro e reverente, com formas de segunda pessoa singular para a oração dirigida a Deus (“lembra-te”, “ordenaste”, “teu”) e “vocês” para o plural explícito da advertência. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
