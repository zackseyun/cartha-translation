  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: pt
  text: Quando ouvi essas palavras[a], sentei-me, chorei e fiquei de luto durante dias; e estava jejuando e orando[b] diante do Deus dos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essas coisas” ou “esses acontecimentos”. O hebraico דְּבָרִים pode significar “palavras”, “assuntos” ou “coisas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “jejuei e orei”. A construção hebraica com o verbo “ser/estar” e particípios apresenta essas ações como contínuas ou durativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Quando ouvi
  rationale: A construção narrativa com וַיְהִי e a expressão temporal כְּשָׁמְעִי introduz a reação de Neemias. Em português natural, “Quando ouvi” preserva a relação temporal sem a formulação rígida “e aconteceu que, ao ouvir”.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דְּבָרִים pode designar palavras, fatos ou assuntos. Aqui se refere ao conteúdo do relato recebido por Neemias; “essas palavras” mantém proximidade lexical, enquanto a nota registra a alternativa contextual.
- source_word: יָשַׁבְתִּי
  choice: sentei-me
  rationale: יָשַׁב significa sentar-se, permanecer ou habitar. Neste contexto emocional, “sentei-me” expressa de modo direto a reação física de Neemias.
- source_word: וָאֶבְכֶּה
  choice: chorei
  rationale: בכה é o verbo comum para chorar ou prantear. “Chorei” é atual, claro e digno em português.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: fiquei de luto durante dias
  rationale: אבל indica luto ou pesar sustentado, e יָמִים funciona adverbialmente para indicar duração. “Fiquei de luto durante dias” comunica ambos os elementos naturalmente.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: continuei jejuando e orando
  rationale: היה seguido de particípios apresenta ações em curso. “Continuei jejuando e orando” torna perceptível esse aspecto durativo em português sem alterar o conteúdo das ações.
- source_word: לִפְנֵי
  choice: diante de
  rationale: לִפְנֵי significa “diante de” ou “na presença de”. “Diante de” é conciso, natural na linguagem de oração e preserva o sentido relacional.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: o Deus dos céus
  rationale: A expressão construta é um título divino característico de Esdras–Neemias. “O Deus dos céus” reproduz o plural morfológico hebraico em uma formulação portuguesa tradicional e compreensível.
theological_decisions:
- issue: Tradução do título divino אֱלֹהֵי הַשָּׁמָיִם
  choice: o Deus dos céus
  alternative: o Deus do céu
  rationale: O texto traz um título de Deus, não o nome divino YHWH. A tradução mantém o título efetivamente presente e o plural hebraico שָׁמַיִם, sem introduzir linguagem pactual ausente do versículo.
- issue: Valor aspectual de וָאֱהִי com particípios
  choice: continuei jejuando e orando
  alternative: jejuei e orei
  rationale: A opção principal deixa explícito o caráter continuado das ações indicado pela construção hebraica. A alternativa simples é possível em português, mas torna menos visível essa nuance; não se determina além do texto a frequência ou a duração exata do jejum e da oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação separa a reação inicial das práticas continuadas sem romper a sequência narrativa. “Fiquei de luto” evita um tom excessivamente arcaico, e “Deus dos céus” conserva a forma do título hebraico.
