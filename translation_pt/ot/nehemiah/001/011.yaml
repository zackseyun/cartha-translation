source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: pt
  text: 'Ó Senhor, eu te peço: que o teu ouvido esteja atento à oração do teu servo e à oração dos teus servos que têm prazer em temer o teu nome[a]. Eu te peço ainda: faze o teu servo ter sucesso hoje e concede-lhe compaixão diante deste homem[b][c]. Eu era copeiro do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que desejam reverenciar o teu nome” ou “que têm prazer em demonstrar profundo respeito pelo teu nome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “concede-lhe favor diante deste homem”. A expressão hebraica diz literalmente: “dá-o para compaixão” ou “para misericórdias”; o pronome se refere ao teu servo.'
    reason: lexical_alternative
  - marker: c
    text: “Este homem” refere-se ao rei, a quem Neemias identifica na frase seguinte como aquele a quem servia de copeiro.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא אֲדֹנָי
  choice: Ó Senhor, eu te peço
  rationale: Expressa a súplica enfática da partícula אָנָּא em português atual e digno, sem recorrer a uma fórmula arcaica; אֲדֹנָי é aqui o título divino “Senhor”, não o Tetragrama.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: que o teu ouvido esteja atento
  rationale: Preserva a metáfora hebraica do ouvido e comunica o pedido para que Deus escute favoravelmente.
- source_word: תְּפִלַּת עַבְדְּךָ ... תְּפִלַּת עֲבָדֶיךָ
  choice: à oração do teu servo e à oração dos teus servos
  rationale: Mantém a repetição e a coerência lexical do singular e do plural; “servo” funciona como autodesignação humilde diante de Deus.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: que têm prazer em temer o teu nome
  rationale: Conserva tanto a ideia de prazer ou disposição voluntária em חפץ quanto o peso de temor reverente em ירא, sem suavizar a tensão da expressão.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: 'Eu te peço ainda: faze o teu servo ter sucesso hoje'
  rationale: O causativo de צלח pede que Deus produza o êxito. A repetição de “eu te peço” representa a segunda partícula נָא e resulta natural em português.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: e concede-lhe compaixão
  rationale: Traduz a expressão idiomática pela qual Neemias pede que lhe seja dispensado tratamento compassivo, preservando a nuance de misericórdia de רַחֲמִים.
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: diante deste homem
  rationale: Mantém a expressão deliberadamente indireta e um pouco distanciada do hebraico, cujo referente é esclarecido pela frase seguinte.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Eu era copeiro do rei
  rationale: Apresenta com clareza a nota narrativa que identifica o cargo de Neemias, sem acrescentar um marcador temporal que não é lexicalmente necessário.
theological_decisions:
- issue: Sentido de עבד na linguagem da oração
  choice: servo
  alternative: escravo
  rationale: Embora עבד possa designar um escravo, aqui é uma autodesignação humilde de quem serve a Deus; o contexto não destaca a condição jurídica de escravidão.
- issue: Sentido de ירא em relação ao nome de Deus
  choice: temer o teu nome
  alternative: reverenciar o teu nome; ter profundo respeito pelo teu nome
  rationale: “Temer” preserva a amplitude e o peso teológico do hebraico, que inclui reverência e assombro sem excluir o temor; a nota registra formas explicativas possíveis.
- issue: Referente do pronome em וּתְנֵהוּ
  choice: concede-lhe compaixão
  alternative: concede-me compaixão
  rationale: Mantém a terceira pessoa do hebraico, na qual Neemias continua referindo-se a si mesmo como “teu servo”, sem normalizá-la silenciosamente para a primeira pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do singular coerentes com a oração direta. A pontuação divide a longa súplica hebraica para facilitar a leitura, preservando suas duas petições marcadas por נָא. “Copeiro” é mantido como o termo convencional e claro para o cargo cortesão.
