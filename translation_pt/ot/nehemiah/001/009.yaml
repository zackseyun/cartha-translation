  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: pt
  text: mas, se vocês voltarem para mim, guardarem os meus mandamentos e os cumprirem, ainda que os seus dispersos[a] estejam na extremidade dos céus[b], de lá eu os reunirei e os trarei para o lugar que escolhi para fazer o meu nome habitar ali[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus desterrados” ou “os que foram expulsos dentre vocês”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na extremidade dos céus”, expressão que indica a maior distância possível.'
    reason: cultural_note
  - marker: c
    text: Ou “para estabelecer ali o meu nome”. O hebraico preserva a imagem do nome de Deus habitando no lugar escolhido.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: mas, se vocês voltarem para mim
  rationale: שׁוּב com אֶל significa voltar ou retornar para alguém. Embora o hebraico comece com uma conjunção, a condição vem do contexto do versículo anterior; “mas, se” torna essa continuidade clara em português.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: guardarem os meus mandamentos
  rationale: שׁמר, quando rege “mandamentos”, expressa observância cuidadosa. “Guardar” conserva a linguagem pactual e é corrente no registro bíblico em português.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e os cumprirem
  rationale: O hebraico distingue guardar os mandamentos de fazê-los. “Cumprir” preserva a ideia de pô-los em prática sem produzir a formulação pouco natural “fazê-los”.
- source_word: נִדַּחֲכֶם
  choice: os seus dispersos
  rationale: A forma derivada de נדח designa pessoas afastadas, expulsas ou espalhadas. “Dispersos” é compreensível no contexto do exílio e mantém certa abertura quanto ao modo desse afastamento.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: na extremidade dos céus
  rationale: A tradução próxima da forma hebraica preserva a imagem cósmica usada para indicar a maior distância imaginável; o plural “céus” corresponde a שָׁמַיִם.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: de lá eu os reunirei
  rationale: קבץ é o verbo habitual para reunir novamente um povo disperso. “Reunirei” é natural em português e adequado ao contexto de restauração.
- source_word: וַהֲבֹאתִים
  choice: e os trarei
  rationale: O hifil de בוא tem sentido causativo, expresso idiomaticamente em português pelo verbo “trazer”.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: o lugar que escolhi
  rationale: בחר indica a escolha divina do lugar do santuário. O pretérito perfeito é direto e natural, sem diminuir a validade contínua dessa escolha.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: para ali fazer habitar o meu nome
  rationale: A construção causativa de שכן com “meu nome” pertence à fórmula deuteronômica do santuário. Esta versão mantém a imagem do nome que habita no lugar escolhido.
theological_decisions:
- issue: Fórmula da presença divina no lugar do santuário
  choice: para ali fazer habitar o meu nome
  alternative: para estabelecer ali o meu nome
  rationale: A formulação escolhida preserva a imagem hebraica do nome de Deus habitando no lugar escolhido. Assim, mantém-se a tensão entre a identificação especial de Deus com esse lugar e o fato de que o próprio Deus não fica espacialmente confinado a ele.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais (“vocês”) e preservação moderada das imagens hebraicas. As três notas foram posicionadas exatamente junto às expressões a que se referem.
