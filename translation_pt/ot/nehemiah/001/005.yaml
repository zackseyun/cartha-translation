reference: Nehemiah 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: pt
  text: 'E eu disse: “Por favor, ó Yahweh, Deus dos céus, o Deus grande e temível[a], que guarda a aliança e o amor leal[b] para com os que o amam e guardam os seus mandamentos,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que inspira temor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o amor constante”; também pode incluir a ideia de fidelidade à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O wayyiqtol introduz a fala da oração e mantém a sequência narrativa sem especificar uma relação mais forte como resultado ou conclusão.
- source_word: אָנָּא
  choice: Por favor
  rationale: A partícula de súplica expressa um pedido reverente; esta formulação é atual, natural e preserva o tom suplicante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Deus dos céus
  rationale: Reproduz de modo idiomático em português a construção hebraica e preserva o plural formal de שָׁמַיִם.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Deus grande e temível
  rationale: A aposição identifica Yahweh como o Deus que é grande e provoca temor reverente. “Temível” conserva a ligação com o temor melhor que o enfraquecido uso corrente de “impressionante”.
- source_word: שֹׁמֵר
  choice: que guarda
  rationale: O particípio descreve continuamente Deus como aquele que observa e preserva fielmente a aliança.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Mantém a categoria pactual explícita e definida do hebraico.
- source_word: חֶסֶד
  choice: amor leal
  rationale: No paralelo com “aliança”, comunica amor firme e fidelidade relacional sem reduzir o termo a mera misericórdia.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: para com os que o amam e guardam os seus mandamentos
  rationale: Preserva o paralelismo dos dois particípios e expressa naturalmente os beneficiários da fidelidade de Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome pessoal divino; a transliteração conserva essa distinção sem substituí-lo por um título.
- issue: Sentido de חֶסֶד no contexto da aliança
  choice: amor leal
  alternative: amor constante; fidelidade à aliança; misericórdia
  rationale: “Amor leal” mantém juntas as dimensões afetiva e fiel do termo, especialmente importante por estar coordenado com “a aliança”.
- issue: Força de הַנּוֹרָא
  choice: temível
  alternative: inspirador de temor; impressionante
  rationale: A escolha preserva a ideia de que Deus suscita temor reverente, sem decidir que o termo indique apenas admiração ou apenas medo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A invocação conserva “ó”; “temível” e “amor leal” preservam, respectivamente, a tensão do temor reverente e a densidade pactual de חֶסֶד. A vírgula final foi mantida porque o versículo continua a oração no contexto seguinte.
