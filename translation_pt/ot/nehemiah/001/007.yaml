base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: pt
  text: Agimos de forma muito corrupta contra ti e não guardamos os mandamentos, os estatutos e as ordenanças[a] que ordenaste a Moisés, teu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “decisões judiciais” ou “normas”. O termo hebraico pode designar decisões legais, leis casuísticas ou ordenanças.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: Procedemos de modo extremamente corrupto
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ideia verbal. Esta formulação transmite a ênfase em português natural, sem reproduzir mecanicamente a repetição hebraica.
- source_word: לָךְ
  choice: contra ti
  rationale: Neste contexto de confissão, a preposição indica que a conduta ofensiva se dirigiu contra Deus.
- source_word: וְלֹא שָׁמַרְנוּ
  choice: e não guardamos
  rationale: Com mandamentos e disposições legais, שׁמר significa guardar ou observar. “Guardamos” mantém o registro bíblico-covenantal e é claro em português.
- source_word: הַמִּצְוֺת
  choice: os mandamentos
  rationale: O termo designa obrigações expressamente ordenadas e conserva o tom jurídico da oração.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: O termo se refere a prescrições fixadas; “estatutos” o distingue dos demais termos legais da tríade.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: O termo pode indicar decisões judiciais, normas ou leis casuísticas. “Ordenanças” é natural e preserva sua distinção de “estatutos”, enquanto a nota registra outras possibilidades.
- source_word: צִוִּיתָ
  choice: ordenaste
  rationale: Traduz diretamente o verbo “ordenar” e conserva a autoridade divina expressa no texto.
- source_word: אֶת מֹשֶׁה עַבְדֶּךָ
  choice: a Moisés, teu servo
  rationale: A marca de objeto direto hebraica permite esta construção natural em português. “Servo” é o título contextualmente adequado para Moisés em sua relação com Deus.
theological_decisions:
- issue: Distinção entre os três termos da Torá
  choice: mandamentos, estatutos e ordenanças
  alternative: mandamentos, decretos e juízos
  rationale: A tradução mantém três termos distintos, refletindo a textura jurídico-covenantal do hebraico sem impor a cada categoria uma delimitação doutrinária mais rígida do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ênfase da construção hebraica inicial foi expressa por “extremamente”; a tríade jurídica foi preservada com vocabulário distinto.
