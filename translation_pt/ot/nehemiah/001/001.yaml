  source_fidelity: O texto preserva com precisão o cabeçalho "Palavras de", a identificação de Neemias como filho de Hacalias, a data incompleta "no vigésimo ano" e a localização em Susã, a cidadela. "Aconteceu o seguinte" comunica adequadamente a fórmula narrativa וַיְהִי e introduz a continuação no versículo seguinte, sem acrescentar conteúdo. "Quando eu estava" é uma representação natural e fiel da circunstância expressa por וַאֲנִי הָיִיתִי.
