  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: pt
  text: 'Palavras de Neemias, filho de Hacalias[a]. No mês de quisleu, no vigésimo ano[b], quando eu estava na cidadela de Susã[c], aconteceu o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Relato de Neemias, filho de Hacalias”. O cabeçalho hebraico “Palavras de” pode introduzir memórias ou um registro narrativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no vigésimo ano”. O versículo não declara explicitamente de quem era esse ano de reinado, embora o contexto posterior identifique Artaxerxes.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “fortaleza de Susã”. O termo hebraico se refere a um complexo real fortificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: Preserva a forma do cabeçalho hebraico, que pode introduzir tanto palavras quanto um relato associado à pessoa; a nota registra a alternativa idiomática.
- source_word: נְחֶמְיָה
  choice: Neemias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן חֲכַלְיָה
  choice: filho de Hacalias
  rationale: Reproduz naturalmente a relação genealógica e usa a forma portuguesa consagrada do nome.
- source_word: וַיְהִי
  choice: aconteceu o seguinte
  rationale: Expressa em português atual a fórmula narrativa hebraica e prepara naturalmente a continuação do relato, sem recorrer ao arcaísmo «sucedeu».
- source_word: בְחֹדֶשׁ כִּסְלֵו
  choice: No mês de quisleu
  rationale: Mantém o nome do mês hebraico por transliteração em forma legível em português.
- source_word: שְׁנַת עֶשְׂרִים
  choice: no vigésimo ano
  rationale: Conserva a fórmula cronológica e não acrescenta neste versículo o governante cujo reinado serve de referência.
- source_word: וַאֲנִי הָיִיתִי
  choice: quando eu estava
  rationale: Apresenta com naturalidade a circunstância temporal do narrador.
- source_word: בְשׁוּשַׁן
  choice: em Susã
  rationale: Emprega a forma portuguesa tradicional do topônimo.
- source_word: הַבִּירָה
  choice: na cidadela
  rationale: Traduz o complexo real fortificado indicado pelo termo hebraico, sem reduzi-lo simplesmente à cidade ou capital.
