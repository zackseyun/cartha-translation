base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: pt
  text: Hanani, um dos meus irmãos, veio com alguns homens de Judá. Perguntei-lhes sobre os judeus[a] que haviam escapado[b], os que restaram do cativeiro[c], e sobre Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os de Judá”. O termo hebraico pode referir-se ao povo de Judá ou, mais amplamente, ao povo judeu.
    reason: lexical_alternative
  - marker: b
    text: Ou “os sobreviventes” ou “o remanescente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “do exílio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O wayyiqtol de בוא expressa movimento passado simples; “veio” é natural do ponto de vista narrativo de Neemias.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: O nome pessoal é transliterado em forma corrente e próxima do hebraico.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: um dos meus irmãos
  rationale: Preserva o termo familiar masculino e a formulação direta do hebraico, sem ampliá-lo para “parente”.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: com alguns homens de Judá
  rationale: Expressa de modo idiomático que homens provenientes de Judá acompanhavam Hanani; “alguns” não determina um número ausente no original.
- source_word: וָאֶשְׁאָלֵם עַל
  choice: Perguntei-lhes sobre
  rationale: שׁאל com עַל introduz uma pergunta a respeito de pessoas ou assuntos; esta é uma formulação portuguesa clara e atual.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: No contexto persa, o termo pode designar tanto os habitantes ou oriundos de Judá quanto o povo judeu em sentido mais amplo; “judeus” é a designação convencional, mantendo-se a alternativa em nota.
- source_word: הַפְּלֵיטָה
  choice: que haviam escapado
  rationale: Embora seja formalmente um substantivo coletivo (“os escapados/sobreviventes”), a oração relativa comunica seu sentido com naturalidade em português.
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: e restado
  rationale: Mantém a ideia de permanência residual e liga naturalmente a descrição ao grupo que escapou.
- source_word: מִן הַשֶּׁבִי
  choice: do cativeiro
  rationale: שׁבי pode indicar cativeiro ou exílio; “cativeiro” conserva mais de perto a forma nominal e deixa “exílio” como alternativa legítima.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: e sobre Jerusalém
  rationale: Preserva o paralelismo com o primeiro עַל e apresenta Jerusalém como o segundo assunto da pergunta.
