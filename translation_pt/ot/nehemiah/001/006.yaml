source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: pt
  text: Que o teu ouvido esteja atento e os teus olhos estejam abertos para ouvir a oração do teu servo, que hoje faço diante de ti, dia e noite, pelos filhos de Israel[a], teus servos, enquanto confesso os pecados dos filhos de Israel, que cometemos contra ti. Eu e a casa de meu pai pecamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “povo de Israel” ou “israelitas”. O hebraico diz literalmente “filhos de Israel”, preservando a expressão familiar ligada à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Que ... esteja
  rationale: O jussivo com נָא expressa uma súplica cortês. A construção com “que” transmite o pedido em português natural e mantém o tom reverente.
- source_word: אָזְנְךָ קַשֶּׁבֶת
  choice: o teu ouvido esteja atento
  rationale: Preserva o singular e a imagem antropomórfica da fórmula hebraica de oração.
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  choice: e os teus olhos abertos
  rationale: Mantém o plural, o paralelismo com “ouvido” e a concisão do particípio passivo hebraico.
- source_word: לִשְׁמֹעַ אֶל
  choice: para ouvir
  rationale: Equivalente direto e idiomático no contexto de Deus acolher uma oração.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: a oração do teu servo
  rationale: Mantém o registro reverente; “servo” é adequado à autodesignação diante de Deus.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ
  choice: que ... faço diante de ti
  rationale: “Faço” evita a repetição pouco natural de “orar a oração”, enquanto “diante de ti” preserva לְפָנֶיךָ.
- source_word: הַיּוֹם יוֹמָם וָלַיְלָה
  choice: hoje ... dia e noite
  rationale: Conserva tanto הַיּוֹם, “hoje”, como a expressão de continuidade “dia e noite”, sem fundi-los silenciosamente.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: pelos filhos de Israel, teus servos
  rationale: “Pelos” expressa intercessão; “filhos de Israel” preserva a formulação familiar e pactual do hebraico, e “teus servos” mantém a aposição.
- source_word: וּמִתְוַדֶּה
  choice: enquanto confesso
  rationale: O particípio coordenado descreve uma ação simultânea à oração; “enquanto” torna essa relação clara em português.
- source_word: חַטֹּאות
  choice: os pecados
  rationale: É o equivalente corrente que conserva o peso moral e teológico da confissão.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: que cometemos contra ti
  rationale: “Cometer pecados” é natural em português, e “contra ti” explicita a direção pessoal da ofensa indicada por לָךְ.
- source_word: וַאֲנִי וּבֵית אָבִי
  choice: Eu e a casa de meu pai
  rationale: Inclui Neemias pessoalmente e sua família ou linhagem, preservando o idioma bíblico “casa de meu pai” sem acrescentar uma ênfase ausente do texto.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus
  choice: Manter “ouvido” e “olhos”
  alternative: Parafrasear como “presta atenção”
  rationale: A oração hebraica emprega deliberadamente imagens corporais para pedir a atenção divina. Mantê-las preserva sua força retórica sem definir a natureza divina em termos corpóreos.
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel / israelitas
  rationale: A expressão hebraica é literalmente filial. A tradução conserva essa textura familiar e pactual, deixando em nota as alternativas coletivas idiomáticas.
- issue: Inclusão pessoal de Neemias na culpa
  choice: Eu e a casa de meu pai pecamos
  alternative: Até eu e a casa de meu pai pecamos
  rationale: A conjunção hebraica inclui Neemias e sua casa na confissão, mas não exige que se acrescente uma partícula enfática como “até”.
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com tratamento divino na segunda pessoa do singular. A redação conserva o paralelismo poético, as imagens antropomórficas e a expressão “filhos de Israel”, evitando arcaísmos desnecessários.
