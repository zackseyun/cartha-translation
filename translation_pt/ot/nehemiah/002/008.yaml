source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: pt
  text: e uma carta para Asafe, responsável pela floresta do rei[a], para que me fornecesse madeira a fim de fazer vigas para os portões da fortaleza ligada ao templo[b], para a muralha da cidade e para a casa onde eu iria morar[c]. O rei me concedeu o que pedi, conforme a boa mão do meu Deus sobre mim[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parque do rei” ou “bosque do rei”. O termo hebraico pardês indica uma propriedade real arborizada e administrada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a fortaleza que pertence à casa”. “A casa” provavelmente se refere ao templo; a expressão também pode indicar a fortaleza junto ao templo. “Cidadela” é outra tradução possível para “fortaleza”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a casa na qual entrarei”. Pelo contexto, refere-se à residência que Neemias ocuparia.
    reason: translation_clarification
  - marker: d
    text: A expressão “a boa mão do meu Deus sobre mim” é um idiomatismo que descreve o favor e a atuação providencial de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: uma carta
  rationale: O substantivo designa uma carta ou documento oficial; “carta” é natural e se ajusta à sequência dos pedidos feitos ao rei.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: responsável pela floresta do rei
  rationale: פַּרְדֵּס pode indicar parque, reserva arborizada ou bosque administrado pela coroa. Como Asafe forneceria madeira para construção, “floresta do rei” comunica bem a função contextual, enquanto “responsável” expressa naturalmente שֹׁמֵר.
- source_word: יִתֶּן לִי עֵצִים
  choice: me fornecesse madeira
  rationale: Embora עֵצִים possa significar árvores ou madeira, o contexto de obras indica madeira de construção. “Fornecesse” expressa de modo idiomático o ato autorizado pela carta.
- source_word: לְקָרוֹת
  choice: a fim de fazer vigas
  rationale: O verbo se refere a colocar vigas ou cobrir uma construção com elas. A formulação mantém a imagem construtiva sem restringir indevidamente o sentido apenas a telhados.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבָּיִת
  choice: os portões da fortaleza ligada ao templo
  rationale: בִּירָה denota uma fortificação ou cidadela. A relação expressa por אֲשֶׁר לַבָּיִת admite mais de uma nuance; “ligada ao templo” evita afirmar exclusivamente posse ou proximidade, e a nota preserva a forma literal e as alternativas.
- source_word: חוֹמַת הָעִיר
  choice: a muralha da cidade
  rationale: Equivalente direto e natural para a cadeia construta hebraica.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: a casa onde eu iria morar
  rationale: Literalmente, “a casa na qual entrarei”. No contexto, trata-se da residência que Neemias usaria; “onde eu iria morar” comunica essa função em português corrente, com a literalidade registrada em nota.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: O rei me concedeu o que pedi
  rationale: O hebraico diz literalmente que o rei “deu a mim”, sem objeto expresso. Em português, a elipse seria pouco natural; “o que pedi” recupera o objeto implícito no contexto sem limitá-lo apenas à madeira ou às cartas.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: pois a boa mão do meu Deus estava sobre mim
  rationale: A formulação preserva a metáfora antropomórfica característica de Esdras–Neemias e torna explícita, por meio de “pois”, a relação causal ou explicativa sugerida pelo contexto.
theological_decisions:
- issue: A providência divina expressa pela imagem da boa mão de Deus
  choice: Manter “a boa mão do meu Deus estava sobre mim”
  alternative: porque meu Deus me favoreceu / porque Deus estava me ajudando
  rationale: A imagem da mão comunica a atuação providencial de Deus e faz parte da textura teológica do livro. Preservá-la evita reduzir o enunciado a uma abstração ou acrescentar uma formulação doutrinária alheia ao texto.
- issue: Identificação de הַבַּיִת na expressão relativa à fortaleza
  choice: Traduzir como “templo” no texto, registrando “casa” na nota
  alternative: a fortaleza que pertence à casa
  rationale: Nesse contexto, “a casa” provavelmente designa o templo, mas a nota mantém visível a expressão hebraica e a ambiguidade da relação sintática.
translation_notes:
  register: Português contemporâneo, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no espaço lusófono. O texto conserva a metáfora da “boa mão” e usa notas para preservar a ambiguidade de פַּרְדֵּס, da relação entre a fortaleza e “a casa”, e da descrição literal da futura residência.
