base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite slave, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: pt
  text: 'Mas, quando Sambalate, o horonita, Tobias, o escravo amonita[a], e Gesém, o árabe, souberam disso, zombaram de nós, trataram-nos com desprezo e disseram: “O que é isso que vocês estão fazendo? Estão se rebelando contra o rei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Tobias, o servo amonita”; alguns entendem essa designação, de modo mais amplo, como um título de oficial.
    reason: Alternativa lexical e possível uso titular de עֶבֶד.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: quando ... souberam disso
  rationale: A forma narrativa introduz a reação hostil dos três homens. “Souberam disso” é natural em português e explicita apenas o objeto implícito recuperável do contexto.
- source_word: הַחֹרֹנִי
  choice: o horonita
  rationale: Preserva o gentílico ou título geográfico ligado a Sambalate sem especificar qual localidade chamada Horom está em vista.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: o escravo amonita
  rationale: עֶבֶד designa primariamente alguém em condição de serviço ou escravidão. “Escravo” mantém a força social possível do termo, enquanto a alternativa “servo” e a possível função titular são registradas em nota.
- source_word: הָעַרְבִי
  choice: o árabe
  rationale: Tradução direta e corrente do gentílico.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: zombaram de nós
  rationale: Expressa com clareza a atitude de escárnio indicada pelo verbo.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: trataram-nos com desprezo
  rationale: Reproduz a ideia de tratar alguém com desdém e mantém a progressão paralela depois de “zombaram”.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: O que é isso que vocês estão fazendo?
  rationale: Formulação natural em português moderno que conserva o tom confrontador da pergunta.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Estão se rebelando contra o rei?
  rationale: Mantém a construção como pergunta acusatória e representa o valor contínuo do particípio.
theological_decisions:
- issue: Sentido de עֶבֶד na designação de Tobias
  choice: escravo
  alternative: servo; possivelmente um título de oficial ou servidor
  rationale: O substantivo pode abranger serviço e escravidão, e seu uso aqui como designação não define com total certeza a posição de Tobias. O texto principal conserva o sentido social forte, e a nota preserva as alternativas sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura natural no Brasil e inteligibilidade internacional. Os antropônimos seguem formas portuguesas correntes; a sintaxe evita rigidez excessiva sem apagar o paralelismo e o tom acusatório do hebraico.
