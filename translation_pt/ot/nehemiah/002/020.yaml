language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: pt
  text: 'Então lhes respondi: “O Deus dos céus é quem nos dará sucesso[a]. Nós, seus servos, nos levantaremos e construiremos. Mas vocês não têm parte, direito[b] nem memória em Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fará que tenhamos êxito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “reivindicação legítima”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Então lhes respondi
  rationale: A expressão שׁוּב + דָּבָר é idiomática e significa dar uma resposta. Em português, “lhes respondi” transmite naturalmente tanto a resposta quanto a fala subsequente, sem a redundância pouco natural de “respondi e disse a eles”.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: O Deus dos céus
  rationale: Preserva a forma plural do título hebraico e corresponde a uma expressão natural e reconhecível em português.
- source_word: הוּא
  choice: é quem
  rationale: 'A construção clivada representa a ênfase do pronome hebraico: é o próprio Deus, e não os recursos ou a autorização dos adversários, que concederá o êxito.'
- source_word: יַצְלִיחַ לָנוּ
  choice: nos dará sucesso
  rationale: O hifil de צלח indica que Deus fará a iniciativa ter êxito. “Dará sucesso” evita restringir a frase à prosperidade material e soa natural no contexto da construção.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Aqui עבד destaca serviço, lealdade e autorização divina, não a condição social de escravidão.
- source_word: נָקוּם וּבָנִינוּ
  choice: nos levantaremos e construiremos
  rationale: Conserva a resolução e a sequência de ações do hebraico. “Construiremos” é preferível a “reconstruiremos”, pois não acrescenta ao verbo simples aquilo que o contexto já deixa claro.
- source_word: אֵין חֵלֶק
  choice: não têm parte
  rationale: חלק designa porção ou participação. “Não têm parte” é corrente em português e se ajusta à fórmula de exclusão.
- source_word: וּצְדָקָה
  choice: direito
  rationale: Neste contexto político e comunitário, צְדָקָה indica legitimidade ou título justo, e não justiça moral em sentido abstrato.
- source_word: וְזִכָּרוֹן
  choice: memória
  rationale: Mantém a formulação concreta e um tanto aberta do hebraico, que pode abranger lembrança, reconhecimento ou vínculo memorial com Jerusalém.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Equivalente locativo direto e idiomático em português.
theological_decisions:
- issue: Terminologia de serviço a Deus
  choice: seus servos
  alternative: seus escravos
  rationale: A declaração ressalta a lealdade e o serviço autorizado dos participantes na obra. “Servos” comunica esse ponto sem introduzir indevidamente a questão da condição jurídica de escravo.
- issue: Sentido de צְדָקָה na fórmula de exclusão
  choice: direito
  alternative: justiça; reivindicação legítima
  rationale: Neemias nega aos adversários qualquer posição legítima em Jerusalém. “Direito” preserva o sentido jurídico-relacional sem transformar a frase em uma afirmação sobre sua retidão moral.
- issue: Ênfase do pronome divino הוּא
  choice: é quem nos dará sucesso
  alternative: ele nos dará sucesso
  rationale: A construção portuguesa torna perceptível a ênfase dada ao agente divino, sem recorrer à formulação pesada “ele mesmo”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita redundância narrativa, preserva a ênfase em Deus e mantém a tensão semântica da tríade “parte, direito e memória”.
