  source_fidelity: A tradução transmite com precisão a resposta de Neemias, o título “Deus dos céus”, a ênfase no agente divino, o êxito concedido por Deus, a resolução de seus servos de se levantar e construir, e a tríade excludente “parte, direito e memória” em Jerusalém. “É quem nos dará sucesso” reproduz adequadamente a ênfase de הוּא sem torná-la excessivamente pesada.
