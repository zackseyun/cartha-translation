  text: 'Então o rei me perguntou: “O que você está buscando?” E eu orei ao Deus dos céus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: está buscando
  rationale: Preserva o sentido amplo de buscar, procurar ou desejar obter algo, sem restringi-lo prematuramente a um pedido formal.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Deus dos céus
  rationale: Reproduz de modo natural e próximo a expressão hebraica, que identifica o Deus a quem Neemias dirige sua oração.
theological_decisions:
- issue: Natureza e duração da oração de Neemias
  choice: “E eu orei”
  alternative: “Então fiz uma breve oração”
  rationale: O hebraico afirma apenas que Neemias orou ao Deus dos céus; não especifica verbalmente a duração nem a forma da oração, embora o contexto sugira que ocorreu antes de sua resposta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” comunica naturalmente a fala direta do rei; “Deus dos céus” mantém a formulação bíblica sem soar excessivamente arcaica.
