  text: וָ/אֱהִ֨י עֹלֶ֤ה בַ/נַּ֨חַל֙ לַ֔יְלָה וָ/אֱהִ֥י שֹׂבֵ֖ר בַּ/חוֹמָ֑ה וָ/אָשׁ֗וּב וָ/אָב֛וֹא בְּ/שַׁ֥עַר הַ/גַּ֖יְא וָ/אָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: pt
  text: Então subi pela ravina[a], à noite, e examinei a muralha[b]. Depois, dei meia-volta, entrei pelo Portão do Vale e retornei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica pode indicar uma ravina ou o leito de um curso de água sazonal; algumas traduções usam “vale”, “ribeiro” ou “uádi”.
    reason: cultural_note
  - marker: b
    text: Ou “fui examinando” ou “inspecionei”. O verbo hebraico normalmente significa “quebrar”, mas, neste contexto, é amplamente entendido como uma referência ao exame da muralha danificada feito por Neemias.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: subi
  rationale: O particípio com הָיָה descreve a progressão da ação; o pretérito perfeito é a forma mais natural em português para esta sequência narrativa.
- source_word: בַנַּחַל
  choice: pela ravina
  rationale: נַחַל pode designar uma ravina ou o leito de um curso de água sazonal. “Ravina” preserva a topografia sem sugerir necessariamente água corrente.
- source_word: לַיְלָה
  choice: à noite
  rationale: Expressão temporal corrente e fiel ao cenário noturno.
- source_word: שֹׂבֵר
  choice: examinei
  rationale: Embora o verbo normalmente signifique “quebrar”, neste contexto descreve de modo plausível o exame que Neemias fazia da muralha danificada. A nota preserva a dificuldade lexical.
- source_word: בַּחוֹמָה
  choice: a muralha
  rationale: Mantém o singular definido do hebraico e identifica naturalmente a fortificação da cidade.
- source_word: וָאָשׁוּב
  choice: dei meia-volta
  rationale: Na primeira ocorrência, expressa a mudança de direção no itinerário e distingue esta ação do retorno conclusivo.
- source_word: וָאָבֹוא
  choice: entrei
  rationale: Com a referência ao portão, בוא indica naturalmente a entrada na cidade.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: pelo Portão do Vale
  rationale: Trata-se do nome de um portão da cidade; “pelo” indica a passagem por ele.
- source_word: וָאָשׁוּב
  choice: retornei
  rationale: A segunda ocorrência conclui o relato da excursão, sem explicitar um destino que o hebraico não declara.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Portão do Vale” é tratado como nome próprio. A repetição de שוב é preservada por verbos distintos — “dei meia-volta” e “retornei” — que refletem suas funções no itinerário.
