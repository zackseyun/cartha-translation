  text: וָ/אֶֽעֱבֹר֙ אֶל שַׁ֣עַר הָ/עַ֔יִן וְ/אֶל בְּרֵכַ֖ת הַ/מֶּ֑לֶךְ וְ/אֵין מָק֥וֹם לַ/בְּהֵמָ֖ה לַ/עֲבֹ֥ר תַּחְתָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: pt
  text: Então passei adiante até o Portão da Fonte[a] e até o Reservatório do Rei, mas não havia espaço para o animal que eu montava passar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Portão da Nascente”. A palavra hebraica pode designar uma nascente ou fonte.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para o animal debaixo de mim passar”, isto é, o animal que Neemias montava.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Então passei adiante
  rationale: O verbo עבר indica passar ou prosseguir. No relato da inspeção noturna, “passei adiante” expressa naturalmente a continuação do percurso.
- source_word: שַׁעַר הָעַיִן
  choice: o Portão da Fonte
  rationale: Neste contexto topográfico, עַיִן designa uma fonte ou nascente de água. “Portão da Fonte” é claro e preserva o caráter de nome próprio do local.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: o Reservatório do Rei
  rationale: בְּרֵכָה pode indicar tanque, piscina ou reservatório. “Reservatório” comunica melhor, em português atual, uma estrutura destinada a armazenar água, sem excluir a alternativa tradicional “Tanque do Rei”.
- source_word: וְאֵין מָקוֹם
  choice: mas não havia espaço
  rationale: A conjunção recebe valor adversativo porque a falta de espaço impede o avanço; “espaço” traduz de modo natural מָקוֹם neste contexto.
- source_word: לַבְּהֵמָה
  choice: para o animal
  rationale: בְּהֵמָה é um termo geral para animal. A tradução não especifica a espécie, que o hebraico também não identifica.
- source_word: לַעֲבֹר תַּחְתָּי
  choice: que eu montava passar
  rationale: Literalmente, a expressão diz “para o animal debaixo de mim passar”. A formulação portuguesa explicita apenas a relação de montaria já inerente ao contexto, enquanto a nota conserva a forma hebraica.
theological_decisions: []
