base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: pt
  text: 'Então eu disse ao rei: “Se for do agrado do rei e se o seu servo tiver encontrado favor diante do rei, peço que me envie a Judá, à cidade onde estão os túmulos dos meus antepassados,[a] para que eu a reconstrua”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “à cidade dos túmulos dos meus pais”. Aqui, “pais” significa “antepassados”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa literalmente “construir”; “reconstruir” explicita que a cidade estava em ruínas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Se for do agrado do rei
  rationale: Reproduz a fórmula cortês de aprovação ou consentimento real com linguagem digna e corrente.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: e se o seu servo tiver o seu favor
  rationale: Comunica idiomaticamente a ideia de o servo estar em posição favorável diante do rei, preservando o tratamento deferente.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: No discurso dirigido ao rei, é uma autodesignação convencional de humildade; “servo” preserva melhor esse registro do que “escravo”.
- source_word: אֲשֶׁר תִּשְׁלָחֵנִי
  choice: peço que me envie
  rationale: O hebraico introduz o conteúdo do pedido após as condições corteses. A explicitação de “peço” produz uma construção natural em português sem transformar a fala numa ordem direta.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: à cidade onde estão os túmulos dos meus antepassados
  rationale: Expressa com clareza a cadeia construta literal “cidade dos túmulos de meus pais”; “antepassados” evita restringir אָבוֹת aos pais imediatos.
- source_word: וְאֶבְנֶנָּה
  choice: para que eu a reconstrua
  rationale: O cohortativo indica finalidade, e o sufixo feminino retoma “cidade”. “Reconstrua” explicita pelo contexto que a cidade estava em ruínas, embora o verbo básico seja “construir”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento cortês adequado a uma petição ao rei. A sintaxe foi ajustada para soar natural tanto no Brasil quanto em outros contextos lusófonos, sem perder o paralelismo das duas condições introdutórias.
