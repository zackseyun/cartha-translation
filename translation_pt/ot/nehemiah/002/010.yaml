  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite slave heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: pt
  text: Quando Sambalate, o horonita, e Tobias, o escravo amonita,[a] ouviram isso, ficaram muito contrariados[b] porque um homem tinha vindo buscar o bem dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o servo amonita”. O termo hebraico pode significar “escravo” ou “servo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “isso foi para eles um grande mal”. O hebraico repete palavras da mesma família de “mal/ruim” para dar ênfase.'
    reason: source_form
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: souberam disso
  rationale: O verbo significa literalmente “ouviram”; em português, “souberam disso” expressa naturalmente que receberam a notícia mencionada no contexto anterior. “Disso” é retomado do contexto.
- source_word: הַחֹרֹנִי
  choice: o horonita
  rationale: Mantém o gentílico que identifica Sambalate por sua procedência, sem tentar resolver qual localidade chamada Horom está em vista.
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: o servo amonita
  rationale: עֶבֶד abrange “servo” e “escravo”. Como aqui funciona como designação social ou administrativa de Tobias e o grau exato de sujeição não é explicitado, “servo” preserva melhor a amplitude do hebraico; a alternativa “escravo” é registrada em nota.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: ficaram profundamente contrariados
  rationale: Reproduz em português corrente a forte reação negativa expressa pela repetição enfática da raiz רע no hebraico. A formulação mais literal é preservada em nota.
- source_word: אָדָם
  choice: um homem
  rationale: O substantivo singular refere-se aqui a um indivíduo, Ne​​emias, e a forma masculina do texto é preservada.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: buscar o bem
  rationale: Mantém a ligação lexical direta com טוֹב, “bem/bom”, sem restringir o sentido a prosperidade material; no contexto, trata-se de promover o bem-estar do povo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a designação histórico-nacional e pactual tradicional do hebraico, em formulação clara e reconhecível em português.
theological_decisions:
- issue: Sentido social de עֶבֶד aplicado a Tobias
  choice: servo
  alternative: escravo
  rationale: O termo hebraico pode indicar desde um escravo até um servidor subordinado ou oficial. O contexto não determina com segurança a condição jurídica de Tobias; por isso, o texto principal evita torná-la mais específica do que o original, e a alternativa é explicitada em nota.
- issue: Forma masculina de אָדָם
  choice: um homem
  alternative: alguém / uma pessoa
  rationale: O referente contextual é Neemias, um homem específico. A tradução mantém a expressão masculina sem transformar o termo em uma formulação neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos títulos foi mantida próxima ao hebraico, enquanto a reação idiomática foi expressa de modo natural. As notas preservam a ambiguidade social de עֶבֶד e a ênfase lexical de רע.
