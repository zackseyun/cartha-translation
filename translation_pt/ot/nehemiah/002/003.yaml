  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ הַ/מֶּ֖לֶךְ לְ/עוֹלָ֣ם יִחְיֶ֑ה מַדּ֜וּעַ לֹא יֵרְע֣וּ פָנַ֗/י אֲשֶׁ֨ר הָ/עִ֜יר בֵּית קִבְר֤וֹת אֲבֹתַ/י֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: pt
  text: 'Eu disse ao rei: “Viva o rei para sempre! Como poderia o meu rosto não estar triste, se a cidade onde estão os túmulos dos meus antepassados[a] está em ruínas, e os seus portões foram consumidos pelo fogo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a casa dos túmulos dos meus pais”, expressão que se refere ao lugar associado ao sepultamento dos seus antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Eu disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa e é expresso naturalmente pelo pretérito perfeito em português.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: ao rei / o rei
  rationale: A primeira ocorrência indica o destinatário; a segunda integra a fórmula respeitosa de aclamação real.
- source_word: לְעוֹלָם יִחְיֶה
  choice: Viva o rei para sempre!
  rationale: Fórmula convencional de desejo e deferência ao soberano, vertida de modo natural e solene.
- source_word: לֹא יֵרְעוּ פָנַי
  choice: Como poderia o meu rosto não estar triste
  rationale: Preserva a referência hebraica ao rosto como expressão visível de tristeza, com construção idiomática em português.
- source_word: אֲשֶׁר
  choice: se
  rationale: No contexto, introduz a circunstância que fundamenta a tristeza; a formulação interrogativa com “se” é natural sem tornar a relação mais estritamente causal do que o necessário.
- source_word: הָעִיר
  choice: a cidade
  rationale: Mantém a referência não nomeada a Jerusalém tal como no hebraico.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: a cidade onde estão os túmulos dos meus antepassados
  rationale: A expressão literalmente diz “casa dos túmulos dos meus pais”; no contexto, está em aposição a “a cidade” e designa o lugar ligado ao sepultamento dos ancestrais.
- source_word: חֲרֵבָה
  choice: está em ruínas
  rationale: Expressa de forma clara e vívida o estado de devastação indicado pelo adjetivo hebraico.
- source_word: וּשְׁעָרֶיהָ
  choice: e os seus portões
  rationale: O possessivo retoma a cidade; “portões” é corrente e apropriado para entradas urbanas fortificadas.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: foram consumidos pelo fogo
  rationale: Preserva a metáfora de o fogo devorar ou consumir, bem como a voz passiva do hebraico.
