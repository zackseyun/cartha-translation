  text: וָ/אַגִּ֨יד לָ/הֶ֜ם אֶת יַ֣ד אֱלֹהַ֗/י אֲשֶׁר הִיא֙ טוֹבָ֣ה עָלַ֔/י וְ/אַף דִּבְרֵ֥י הַ/מֶּ֖לֶךְ אֲשֶׁ֣ר אָֽמַר לִ֑/י וַ/יֹּֽאמְרוּ֙ נָק֣וּם וּ/בָנִ֔ינוּ וַ/יְחַזְּק֥וּ יְדֵי/הֶ֖ם לַ/טּוֹבָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: pt
  text: 'Então lhes contei como a mão do meu Deus tinha sido bondosa comigo[a] e também o que o rei me havia dito. Eles disseram: “Levantemo-nos e construamos!”[b] E fortaleceram as mãos para o bem[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido por “tinha sido favorável a mim” ou “tinha sido graciosa comigo”. O hebraico diz literalmente: “era boa sobre mim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vamos nos levantar e construir!”'
    reason: lexical_alternative
  - marker: c
    text: 'Expressão que indica que eles se encheram de coragem e se dispuseram firmemente a agir. O hebraico diz literalmente: “fortaleceram as mãos para o bem”; pelo contexto, “o bem” pode se referir à boa obra da reconstrução.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Então lhes contei
  rationale: O consecutivo faz a narrativa avançar. “Então” expressa a sequência, e “contei” é natural no contexto de relatar aos líderes o favor recebido.
- source_word: יַד אֱלֹהַי
  choice: a mão do meu Deus
  rationale: Mantém a metáfora hebraica da ação, do poder e do favor de Deus, sem reduzi-la a uma explicação abstrata.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: tinha sido bondosa comigo
  rationale: Comunica em português atual o valor favorável de טוֹבָה עָלַי, enquanto a nota preserva a forma mais literal e outras possibilidades.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: e também o que o rei me havia dito
  rationale: “E também” conserva a adição enfática; “o que o rei me havia dito” verte naturalmente a expressão hebraica “as palavras do rei que ele disse a mim”.
- source_word: נָקוּם וּבָנִינוּ
  choice: Levantemo-nos e construamos!
  rationale: As formas da primeira pessoa do plural têm aqui força exortativa e exprimem a resolução coletiva. “Construamos” é claro e atual no contexto da reconstrução.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם לַטּוֹבָה
  choice: E fortaleceram as mãos para o bem
  rationale: Preserva deliberadamente a imagem hebraica e a amplitude de לַטּוֹבָה, sem restringi-la silenciosamente a “boa obra”; a nota esclarece o sentido idiomático.
theological_decisions:
- issue: A metáfora da mão de Deus como agente de favor e poder
  choice: Manter “a mão do meu Deus” no texto principal
  alternative: “O favor do meu Deus” ou “Deus tinha sido bondoso comigo”
  rationale: A metáfora atribui o êxito de Neemias à atuação divina, em paralelo com as palavras favoráveis do rei. Preservá-la mantém a textura teológica do hebraico sem definir além do texto como essa atuação ocorreu.
- issue: A expressão “para o bem” no encerramento
  choice: Conservar a formulação ampla “para o bem”
  alternative: “Para a boa obra” ou “para realizar aquele bom trabalho”
  rationale: O contexto aponta para a reconstrução, mas o hebraico não traz explicitamente o substantivo “obra”. A formulação escolhida preserva essa concisão e possível amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa é fluente; as metáforas hebraicas centrais são preservadas, e formulações marcadas recebem esclarecimento em notas.
