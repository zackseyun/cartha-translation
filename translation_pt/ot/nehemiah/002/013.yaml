base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: pt
  text: Assim, saí de noite pela Porta do Vale, em direção à Fonte do Dragão[a] e à Porta do Esterco, e examinei as muralhas de Jerusalém, que estavam com brechas, e seus portões, que haviam sido consumidos pelo fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Fonte da Serpente” ou “Fonte do Chacal”. O termo hebraico tannin pode designar um dragão, uma serpente, um chacal ou criatura semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: Assim, saí
  rationale: O wayyiqtol de יצא dá sequência à narrativa. “Assim, saí” expressa essa progressão de modo natural em português.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: pela Porta do Vale
  rationale: Em contexto de deslocamento, בְּ com “porta” indica passagem por ela; “Porta do Vale” conserva o sentido topográfico de הַגַּיְא.
- source_word: לַיְלָה
  choice: de noite
  rationale: Acusativo adverbial de tempo, traduzido pela expressão corrente e clara “de noite”.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: em direção à Fonte do Dragão
  rationale: עֵין designa aqui uma fonte ou nascente, enquanto תַּנִּין tem amplitude semântica que inclui dragão e serpente. A expressão de rota é vertida naturalmente como “em direção a”.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Porta do Esterco
  rationale: אַשְׁפֹּת refere-se a esterco ou monturo. “Porta do Esterco” mantém a força concreta e o nome tradicional sem modernizar indevidamente o topônimo.
- source_word: וָאֱהִי שֹׂבֵר
  choice: e examinei
  rationale: A expressão hebraica é lexicalmente difícil, pois שבר costuma significar “quebrar”; neste contexto, porém, descreve a vistoria noturna das muralhas danificadas. “Examinei” comunica a ação contextual sem sugerir que Neemias estivesse quebrando os muros.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” é mais específico que “muros” para as fortificações urbanas de Jerusalém.
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: que estavam derrubadas
  rationale: O particípio passivo de פרץ descreve muralhas rompidas ou abertas por brechas. “Derrubadas” é claro e idiomático, embora “brechadas” seja mais formal.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: e seus portões, que haviam sido consumidos pelo fogo
  rationale: O passivo de אכל com fogo apresenta a imagem de algo devorado ou consumido pelas chamas. “Consumidos pelo fogo” preserva essa vivacidade de modo natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se os topônimos concretos e a metáfora do fogo. A dificuldade de וָאֱהִי שֹׂבֵר é resolvida contextualmente como “examinei”; não se acrescenta nota no texto porque o marcador [b] do material inglês parece estar deslocado, estando ligado à Porta do Esterco em vez do verbo difícil.
