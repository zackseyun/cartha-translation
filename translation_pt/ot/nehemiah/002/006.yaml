  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ וְ/הַ/שֵּׁגַ֣ל יוֹשֶׁ֣בֶת אֶצְל֗/וֹ עַד מָתַ֛י יִהְיֶ֥ה מַֽהֲלָכֲ/ךָ֖ וּ/מָתַ֣י תָּשׁ֑וּב וַ/יִּיטַ֤ב לִ/פְנֵֽי הַ/מֶּ֨לֶךְ֙ וַ/יִּשְׁלָחֵ֔/נִי וָֽ/אֶתְּנָ֥/ה ל֖/וֹ זְמָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: pt
  text: 'Então o rei me perguntou, enquanto a rainha[a] estava sentada ao lado dele: “Quanto tempo durará a sua viagem, e quando você voltará?” O rei concordou em me enviar, e eu lhe indiquei um prazo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a consorte” ou “a esposa real”. O termo hebraico se refere à consorte do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta e natural de מֶלֶךְ no contexto da narrativa da corte.
- source_word: הַשֵּׁגַל
  choice: a rainha
  rationale: O termo raro designa a consorte real. “Rainha” é a forma mais natural em português, enquanto a nuance mais específica é preservada em nota.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: estava sentada ao lado dele
  rationale: Reproduz o particípio circunstancial e a proximidade expressa pela locução preposicional.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Quanto tempo durará a sua viagem
  rationale: Expressa de modo idiomático a pergunta hebraica sobre a duração da viagem.
- source_word: וּמָתַי תָּשׁוּב
  choice: e quando você voltará
  rationale: שׁוּב significa aqui voltar ou retornar; a formulação é clara e corrente em português.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ וַיִּשְׁלָחֵנִי
  choice: O rei concordou em me enviar
  rationale: O idioma hebraico indica que a proposta teve a aprovação do rei, resultando na autorização da viagem. “Concordou” comunica isso naturalmente sem sugerir mero prazer emocional.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: e eu lhe indiquei um prazo
  rationale: זְמָן denota um tempo determinado. “Indiquei um prazo” comunica que Neemias informou ao rei o período previsto, sem acrescentar uma duração ausente do texto.
