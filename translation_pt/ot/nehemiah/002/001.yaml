  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: pt
  text: Aconteceu que, no mês de nisã, no vigésimo ano do rei Artaxerxes, quando o vinho estava diante dele, peguei o vinho e o dei ao rei. Eu não tinha estado triste na presença dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “eu não tinha estado mal diante dele”. Literalmente, o hebraico diz “eu não tinha estado mau diante dele”, expressão que, neste contexto, se refere a parecer triste ou abatido na presença do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica em português atual, sem recorrer à expressão arcaizante “e sucedeu que”.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: no mês de nisã
  rationale: Mantém a expressão formal de datação e translitera o nome do mês segundo o uso corrente em português.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: no vigésimo ano do rei Artaxerxes
  rationale: Expressa de modo idiomático a datação pelo ano de reinado, preservando o título e o nome do monarca.
- source_word: יַיִן לְפָנָיו
  choice: quando o vinho estava diante dele
  rationale: Conserva a cena da corte e a formulação espacial do hebraico sem acrescentar “taça”, termo ausente do texto.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: peguei o vinho
  rationale: נשא indica aqui tomar ou levantar o vinho para servi-lo; “peguei” é natural e evita especificar uma taça não mencionada.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: e o dei ao rei
  rationale: Traduz diretamente נתן, retomando “o vinho” pelo pronome, sem acrescentar que o rei o bebeu.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Até então, eu não tinha estado triste na presença dele
  rationale: O adjetivo רַע significa literalmente “mau”, mas neste contexto descreve a aparência triste ou abatida de Neemias diante do rei. “Até então” explicita com naturalidade o valor retrospectivo sugerido pelo contexto, sem introduzir a ênfase absoluta de “nunca”.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a repetição de “vinho” e não introduz “taça” nem “copeiro”, pois esses termos não aparecem neste versículo. O marcador da nota foi colocado junto à expressão que ela esclarece.
