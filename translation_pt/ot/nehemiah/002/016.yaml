  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: pt
  text: Mas os oficiais não sabiam aonde eu tinha ido nem o que eu estava fazendo e, até então, eu não havia contado nada aos judeus[a], aos sacerdotes, aos nobres, aos oficiais nem aos demais que faziam a obra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos judeanos”. O hebraico יְהוּדִים pode designar regionalmente o povo de Judá ou, de modo mais amplo, a comunidade judaica.
    reason: lexical_alternative
  - marker: b
    text: Ou “que realizavam a obra”. O hebraico usa um particípio, que apresenta essas pessoas em relação com a tarefa sem especificar com precisão o seu enquadramento temporal.
    reason: source_ambiguity
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: סְגָנִים designa governantes subordinados ou autoridades administrativas; “oficiais” é claro e não impõe um título persa excessivamente específico.
- source_word: אָנָה הָלַכְתִּי
  choice: aonde eu tinha ido
  rationale: אָנָה indica destino, e o mais-que-perfeito situa naturalmente a ida antes do desconhecimento dos oficiais.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: nem o que eu estava fazendo
  rationale: O particípio עֹשֶׂה expressa ação em curso; depois de uma negação, “nem” coordena os dois elementos com naturalidade em português.
- source_word: לַיְּהוּדִים
  choice: aos judeus
  rationale: יְהוּדִים pode indicar os judeus em sentido comunitário ou os habitantes de Judá; “judeus” é a forma mais corrente, preservando-se a alternativa em nota.
- source_word: לַחֹרִים
  choice: aos nobres
  rationale: Neste contexto social e administrativo, חֹרִים se refere aos membros da elite ou líderes de posição elevada.
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: nem aos demais que fariam a obra
  rationale: A expressão designa o restante das pessoas envolvidas na tarefa. O contexto indica que a execução da obra ainda seria iniciada após a inspeção, embora a forma hebraica seja literalmente participial.
- source_word: עַד כֵּן
  choice: até então
  rationale: A expressão temporal assinala o limite até o qual Neemias manteve seu plano em segredo.
- source_word: לֹא הִגַּדְתִּי
  choice: eu não havia contado nada
  rationale: O hifil de נגד significa contar ou dar a conhecer; “nada” explicita em português o complemento subentendido sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Aonde” conserva a ideia de destino; “nem... nem” reproduz com fluidez a sequência sob a negação. A ambiguidade temporal do particípio final é preservada por nota.
