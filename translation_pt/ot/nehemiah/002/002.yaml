reference: Nehemiah 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: pt
  text: 'E o rei me disse: “Por que seu rosto está triste[a], embora você não esteja doente? Isso não é outra coisa senão tristeza do coração[b]”. Então fiquei com muito medo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “seu rosto está mau” — expressão idiomática para uma aparência triste ou perturbada.
    reason: lexical_alternative
  - marker: b
    text: Ou “aflição do coração” ou “angústia do coração”. Hebraico, literalmente, “mal do coração”; aqui, a expressão se refere ao sofrimento interior, não necessariamente ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Interrogativo comum de causa ou motivo; a forma direta é natural e precisa em português.
- source_word: פָּנֶיךָ רָעִים
  choice: seu rosto está triste
  rationale: A expressão hebraica diz literalmente que o rosto está ‘mau’, mas funciona como idioma para uma expressão triste ou perturbada. ‘Está triste’ comunica esse sentido com clareza.
- source_word: חוֹלֶה
  choice: doente
  rationale: Equivalente corrente e direto para a condição de estar enfermo.
- source_word: וְאַתָּה אֵינְךָ חוֹלֶה
  choice: embora você não esteja doente
  rationale: ‘Embora’ exprime naturalmente o contraste entre a aparência triste de Neemias e a ausência de doença física.
- source_word: אֵין זֶה כִּי אִם
  choice: Isso não é outra coisa senão
  rationale: 'Preserva a força exclusiva da construção: o rei descarta outras explicações e apresenta sua conclusão.'
- source_word: רֹעַ לֵב
  choice: tristeza do coração
  rationale: Embora literalmente seja ‘mal/maldade do coração’, o contexto contrapõe doença física a sofrimento interior; a tradução evita sugerir, sem base contextual suficiente, maldade moral.
- source_word: וָאִירָא הַרְבֵּה מְאֹד
  choice: Então fiquei com muito medo
  rationale: ‘Então’ marca o avanço narrativo, enquanto ‘muito medo’ reproduz de modo idiomático a forte intensificação hebraica.
theological_decisions:
- issue: Sentido de רֹעַ לֵב
  choice: sofrimento interior, traduzido como ‘tristeza do coração’
  alternative: ‘maldade do coração’
  rationale: O contraste explícito com a doença física favorece uma condição emocional interior. A nota conserva a amplitude lexical literal sem impor uma leitura moral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a coordenação narrativa do hebraico, traduz os idiomas pelo sentido no texto principal e registra nas notas a formulação literal e alternativas genuínas.
