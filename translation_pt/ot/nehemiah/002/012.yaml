source:
  edition: WLC
  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: pt
  text: Então, levantei-me de noite com poucos homens comigo. Eu não havia contado a ninguém[a] o que o meu Deus estava pondo no meu coração para fazer por Jerusalém[b]. Não havia comigo nenhum animal, a não ser o animal[c] em que eu montava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não contei a homem algum”, isto é, a pessoa alguma.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que o meu Deus havia posto no meu coração” ou “o que o meu Deus inspirava no meu coração”.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico é geral e também pode ser traduzido por “besta”; o texto não identifica a espécie do animal usado como montaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Então me levantei de noite
  rationale: O wayyiqtol de קום dá continuidade à narrativa, refletida por “Então”; לַיְלָה indica o período noturno. A formulação é natural em português e mantém o cenário da ação.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: acompanhado de poucos homens
  rationale: Expressa de modo natural que Neemias estava com um grupo masculino reduzido, preservando o sentido de מְעַט sem reproduzir uma ordem de palavras pouco idiomática em português.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Eu não havia contado a ninguém
  rationale: הגיד significa contar ou dar a conhecer. No contexto, לְאָדָם tem valor indefinido (“a pessoa alguma”); “a ninguém” é a forma corrente e inclusiva em português, enquanto a literalidade é registrada em nota.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: o que o meu Deus estava pondo no meu coração
  rationale: O particípio נֹתֵן permite apresentar a ação como em curso ou vividamente concebida. “Pondo no meu coração” conserva o idioma hebraico e não o transforma em uma declaração técnica de revelação verbal.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: para fazer por Jerusalém
  rationale: Mantém a formulação ampla do hebraico e o sentido benéfico da ação dirigida a Jerusalém, sem antecipar detalhes que o contexto posterior explicará.
- source_word: וּבְהֵמָה אֵין עִמִּי
  choice: Não havia comigo nenhum animal
  rationale: בְּהֵמָה é um termo geral para animal, aqui evidentemente usado como montaria. “Animal” é atual e evita especificar uma espécie que o texto não identifica.
- source_word: כִּי אִם הַבְּהֵמָה אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: a não ser o animal em que eu montava
  rationale: כִּי אִם introduz a única exceção, e o particípio רֹכֵב descreve Neemias montado no animal durante a cena.
theological_decisions:
- issue: A iniciativa divina na resolução interior de Neemias
  choice: o que o meu Deus estava pondo no meu coração
  alternative: o que o meu Deus havia posto no meu coração; o que o meu Deus inspirava no meu coração
  rationale: A tradução atribui a iniciativa a Deus, como faz o hebraico, mas preserva a abertura do idioma e não o amplia para uma forma específica de revelação nem elimina a atuação consciente de Neemias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada onde a reprodução direta da ordem hebraica soaria artificial, mas foram preservados o cenário noturno, o pequeno grupo, o sigilo de Neemias, a iniciativa divina expressa pelo particípio e a generalidade do termo para o animal.
