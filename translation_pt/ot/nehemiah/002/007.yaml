  text: וָ/אוֹמַר֮ לַ/מֶּלֶךְ֒ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב אִגְּרוֹת֙ יִתְּנוּ לִ֔/י עַֽל פַּחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר אֲשֶׁר֙ יַעֲבִיר֔וּ/נִי עַ֥ד אֲשֶׁר אָב֖וֹא אֶל יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: pt
  text: 'Então eu disse ao rei: “Se parecer bem ao rei, que me sejam dadas cartas para os governadores da região do Outro Lado do Rio[a], a fim de que me deem passagem até eu chegar a Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Outro Lado do Rio” era a designação administrativa persa da região situada a oeste do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então eu disse” expressa com naturalidade a sequência do relato.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Se parecer bem ao rei
  rationale: Preserva a fórmula cortês da linguagem da corte e sua construção impessoal, sem torná-la excessivamente literal.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: que me sejam dadas cartas
  rationale: A construção passiva comunica com naturalidade o pedido respeitoso dirigido ao rei e mantém “cartas” como equivalente direto do substantivo hebraico.
- source_word: פַּחֲוֹת
  choice: governadores
  rationale: Designa os administradores provinciais persas; “governadores” é claro, conciso e historicamente adequado.
- source_word: עֵבֶר הַנָּהָר
  choice: a região do Outro Lado do Rio
  rationale: Trata-se da designação administrativa persa das terras a oeste do Eufrates. A capitalização indica um nome regional, enquanto “região” esclarece sua função sem impor uma unidade administrativa mais específica do que o texto.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: a fim de que me deem passagem
  rationale: No contexto das cartas de autorização, o hifil de עבר indica permitir ou facilitar o trânsito; esta formulação é natural e conserva esse sentido.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: até eu chegar
  rationale: Expressa diretamente o limite temporal da autorização de viagem.
- source_word: יְהוּדָה
  choice: Judá
  rationale: É a forma portuguesa tradicional do nome próprio; evita “Judeia”, que seria anacrônico neste contexto.
