  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” torna explícito o plural de אַתֶּם; “portões” é corrente para as entradas fortificadas da cidade. Os marcadores foram colocados junto aos termos que realmente explicam.
