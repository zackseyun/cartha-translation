  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: pt
  text: 'Então eu lhes disse: “Vocês estão vendo a calamidade[a] em que nos encontramos: Jerusalém está em ruínas[b], e seus portões foram queimados pelo fogo. Venham, vamos reconstruir a muralha de Jerusalém, para que não sejamos mais motivo de vergonha[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a aflição” ou “a situação desastrosa”. O termo hebraico, neste contexto, indica calamidade ou adversidade, e não mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “está devastada”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para que não sejamos mais alvo de desprezo”; ou “e não seremos mais uma desonra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: a calamidade
  rationale: Neste contexto, רָעָה indica adversidade ou condição desastrosa, não mal moral. “Calamidade” comunica com clareza a situação coletiva de Jerusalém.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: em que nos encontramos
  rationale: A expressão descreve a condição presente da comunidade; esta formulação é natural em português e mantém a imagem de estarem dentro dessa situação.
- source_word: חֲרֵבָה
  choice: está em ruínas
  rationale: O adjetivo retrata Jerusalém devastada. “Está em ruínas” expressa de modo idiomático e concreto seu estado físico.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: foram queimados pelo fogo
  rationale: Mantém tanto o passivo do verbo quanto a menção explícita ao fogo, preservando a ênfase hebraica.
- source_word: לְכוּ
  choice: Venham
  rationale: Embora o sentido básico seja “ir”, aqui a forma funciona como convocação à ação conjunta; “Venham” é o convite idiomático em português.
- source_word: וְנִבְנֶה
  choice: vamos reconstruir
  rationale: A forma coortativa exprime resolução compartilhada. “Reconstruir” explicita adequadamente que a muralha existia antes e seria restaurada.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: a muralha de Jerusalém
  rationale: Preserva diretamente a relação construta e usa “muralha”, termo natural para a fortificação que cercava a cidade.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: para que não sejamos mais motivo de vergonha
  rationale: חֶרְפָּה envolve vergonha pública, desonra e desprezo. A formulação mantém a dimensão comunitária e representa naturalmente a força de propósito ou resultado da oração.
theological_decisions: []
