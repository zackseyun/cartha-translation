base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: pt
  text: Assim, cheguei aos governadores de Além do Rio[a] e lhes entreguei as cartas do rei. O rei havia enviado comigo oficiais do exército e cavaleiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação persa da região administrativa situada a oeste do rio Eufrates, também chamada Trans-Eufrates.
    reason: cultural_note
  - marker: b
    text: 'Ou: “oficiais militares e membros da cavalaria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: governadores
  rationale: Designa autoridades persas responsáveis por distritos; “governadores” é claro, historicamente adequado e acessível.
- source_word: עֵבֶר הַנָּהָר
  choice: Além do Rio
  rationale: Preserva a designação administrativa persa, cujo “Rio” é o Eufrates, sem acrescentar “província” ao texto principal.
- source_word: אִגְּרוֹת
  choice: cartas
  rationale: Refere-se à correspondência escrita; no contexto, são cartas reais de autorização.
- source_word: שָׂרֵי חַיִל
  choice: oficiais do exército
  rationale: Expressa naturalmente o sentido de líderes ou oficiais militares sem especificar uma patente ausente no hebraico.
- source_word: פָרָשִׁים
  choice: cavaleiros
  rationale: Mantém o sentido concreto de homens montados, mais próximo do hebraico que o coletivo “cavalaria”.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: O rei havia enviado comigo
  rationale: O mais-que-perfeito apresenta a informação como explicação de fundo sobre a escolta que já acompanhava Neemias.
- source_word: וָאָבוֹא
  choice: Assim, cheguei
  rationale: Comunica a progressão da narrativa e a relação com os preparativos anteriores em português natural.
