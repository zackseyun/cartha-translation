  text: So I came to Jerusalem and was there three days.
translation:
  language: pt
  text: Assim, cheguei a Jerusalém e fiquei ali por três dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: Assim, cheguei
  rationale: O waw consecutivo com בוא dá sequência à narrativa. “Assim, cheguei” expressa de modo natural a chegada resultante dos acontecimentos anteriores, sem acrescentar informação.
- source_word: אֶל
  choice: a
  rationale: Com verbo de movimento, אֶל indica o destino; em português, “chegar a Jerusalém” é a construção corrente e adequada.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome geográfico.
- source_word: וָאֱהִי שָׁם
  choice: e fiquei ali
  rationale: Embora היה signifique literalmente “ser/estar”, neste contexto locativo com expressão de duração comunica permanência. “Fiquei ali” é natural em português e preserva esse sentido contextual.
- source_word: יָמִים שְׁלֹשָׁה
  choice: por três dias
  rationale: A expressão funciona como acusativo de duração. A preposição “por” torna explícita em português a duração já indicada pela sintaxe hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. “Ali” retoma Jerusalém naturalmente; não há ambiguidades textuais ou questões teológicas que exijam nota.
