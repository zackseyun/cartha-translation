  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: pt
  text: e de levar à casa de Yahweh[b], ano após ano, as primícias da nossa terra[a] e as primícias de todo fruto de toda árvore,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do nosso solo” ou “do nosso chão”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casa de Yahweh”; isto é, o templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: e de levar
  rationale: A conjunção seguida do infinitivo dá continuidade às obrigações da aliança enumeradas no contexto; “levar” é natural para a entrega de ofertas no templo.
- source_word: בִּכּוּרֵי
  choice: as primícias
  rationale: O termo designa os primeiros produtos oferecidos a Deus; “primícias” preserva seu sentido agrícola e cultual.
- source_word: אַדְמָתֵנוּ
  choice: da nossa terra
  rationale: אדמה pode indicar solo, chão ou terra cultivável. “Nossa terra” é claro e natural no contexto agrícola sem lhe atribuir necessariamente um sentido territorial amplo.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: e as primícias de todo fruto de toda árvore
  rationale: A formulação conserva a repetição distributiva de כל e a abrangência da cadeia de genitivos hebraica, mantendo-se compreensível em português.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: ano após ano
  rationale: A expressão idiomática indica repetição anual regular; “ano após ano” preserva seu ritmo e valor iterativo.
- source_word: לְ/בֵית יְהוָה
  choice: à casa de Yahweh
  rationale: Mantém a imagem literal de “casa” e translitera o nome divino expresso pelo Tetragrama; no contexto, a referência é ao templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título, enquanto a nota esclarece a expressão cultual em que ele ocorre.
- issue: Sentido de בֵּית יְהוָה
  choice: casa de Yahweh
  alternative: templo de Yahweh
  rationale: A tradução mantém a metáfora e a forma do hebraico, sem ocultar que, neste contexto, a expressão se refere ao templo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem dos elementos foi ajustada para evitar que “ano após ano” parecesse modificar apenas as primícias das árvores; a abrangência e as relações semânticas do hebraico foram preservadas.
