  text: וְ/הֶעֱמַ֤דְנוּ עָלֵ֨י/נוּ֙ מִצְוֺ֔ת לָ/תֵ֥ת עָלֵ֛י/נוּ שְׁלִשִׁ֥ית הַ/שֶּׁ֖קֶל בַּ/שָּׁנָ֑ה לַ/עֲבֹדַ֖ת בֵּ֥ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: pt
  text: Também assumimos a obrigação de dar, a cada ano, um terço de siclo para o serviço da casa do nosso Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Também impusemos sobre nós mesmos o mandamento de dar, a cada ano, um terço de siclo”.'
    reason: A construção hebraica é mais concreta e emprega um termo que pode ser traduzido por “mandamento”; no contexto, também admite o sentido coletivo de “obrigações”.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת
  choice: Também assumimos a obrigação
  rationale: O hifil de עמד com עָלֵינוּ exprime o estabelecimento de uma exigência sobre si mesmos. Em português, “assumimos a obrigação” comunica com naturalidade seu caráter vinculante e autoimposto. “Também” representa a conjunção no contexto.
- source_word: לָתֵת
  choice: de dar
  rationale: Mantém o sentido direto de נתן sem tornar a contribuição explicitamente um pagamento.
- source_word: עָלֵינוּ
  choice: assumimos
  rationale: A ideia de algo imposto “sobre nós” foi incorporada ao verbo para evitar a construção pouco natural “impusemos sobre nós mesmos”, sem perder o caráter comunitário e voluntariamente vinculante.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: um terço de siclo
  rationale: Tradução direta da fração e da unidade monetária hebraica; “siclo” é a forma bíblica corrente em português.
- source_word: בַּשָּׁנָה
  choice: a cada ano
  rationale: Expressa claramente a recorrência anual indicada pela construção hebraica.
- source_word: לַעֲבֹדַת
  choice: para o serviço
  rationale: No contexto da casa de Deus, עֲבֹדָה abrange o serviço ligado ao culto e à manutenção, sem restringi-lo a uma única atividade.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: da casa do nosso Deus
  rationale: Preserva a expressão hebraica e seu tom pactual; “templo” seria correto no contexto, mas menos próximo da forma original.
theological_decisions:
- issue: Natureza de מִצְוֺת como exigência comunitária
  choice: a obrigação assumida pela própria comunidade
  alternative: o mandamento que impusemos sobre nós mesmos; obrigações
  rationale: 'Embora מִצְוֺת tenha forma plural, pode funcionar coletivamente ou de modo abstrato. O infinitivo seguinte define uma exigência específica: a contribuição anual. “Obrigação” preserva seu caráter vinculante sem sugerir que se trate necessariamente de um mandamento divino dado anteriormente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita decalque sintático do hebraico, mas conserva a contribuição autoimposta, a periodicidade anual e a expressão “casa do nosso Deus”.
