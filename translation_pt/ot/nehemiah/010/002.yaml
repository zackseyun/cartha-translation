  text: וְ/עַ֖ל הַ/חֲתוּמִ֑ים נְחֶמְיָ֧ה הַ/תִּרְשָׁ֛תָא בֶּן חֲכַלְיָ֖ה וְ/צִדְקִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/002.yaml
  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: pt
  text: E no documento selado[a] constavam Neemias, o governador[b], filho de Hacalias, e Zedequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “os selados”. No contexto, a expressão provavelmente se refere ao documento selado ou aos nomes registrados nele.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Tirsata”, título administrativo do período persa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E no
  rationale: A conjunção liga o versículo ao contexto anterior, e a preposição introduz aquilo em que os nomes estavam registrados. Em português, “no documento” expressa naturalmente essa relação.
- source_word: הַחֲתוּמִים
  choice: documento selado
  rationale: A forma hebraica é um particípio passivo plural, literalmente “os selados”, mas, neste contexto administrativo, aponta para o registro selado ou para os nomes associados a ele. “Documento selado” preserva a imagem sem recorrer ao mais interpretativo “signatários”.
- source_word: נְחֶמְיָה
  choice: Neemias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַתִּרְשָׁתָא
  choice: o governador
  rationale: Título administrativo do período persa. “Governador” comunica com clareza a função em português moderno, enquanto a transliteração é indicada em nota.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural do marcador genealógico hebraico.
- source_word: חֲכַלְיָה
  choice: Hacalias
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: וְצִדְקִיָּה
  choice: e Zedequias
  rationale: A conjunção acrescenta o segundo nome; “Zedequias” é a forma portuguesa tradicional.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas tradicionais dos nomes bíblicos. O verbo “constavam” torna explícita em português a relação administrativa implícita no hebraico, sem identificar os nomes como assinaturas autógrafas.
