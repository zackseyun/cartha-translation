  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: pt
  text: Pois os filhos de Israel e os filhos de Levi levarão às câmaras a contribuição de cereal, de vinho novo e de azeite; ali estão os utensílios do santuário, os sacerdotes que ministram, os porteiros e os cantores. E não negligenciaremos a casa do nosso Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: câmaras
  rationale: Preserva o sentido arquitetônico dos aposentos laterais do templo, usados neste contexto também para armazenamento, sem reduzir o termo a depósitos.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: os filhos de Israel e os filhos de Levi
  rationale: Mantém o paralelismo formal das duas expressões hebraicas e sua formulação genealógica.
- source_word: תְּרוּמַת הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: a contribuição de cereal, de vinho novo e de azeite
  rationale: ‘Contribuição’ comunica algo separado para uso sagrado; ‘cereal’, ‘vinho novo’ e ‘azeite’ representam com naturalidade a tríade agrícola.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: os utensílios do santuário
  rationale: Refere-se aos objetos e implementos empregados no serviço sagrado; ‘utensílios’ é claro em português atual.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: os sacerdotes que ministram
  rationale: Conserva o sentido funcional do particípio, indicando sacerdotes em serviço.
- source_word: הַשּׁוֹעֲרִים
  choice: os porteiros
  rationale: Designa os responsáveis pelas portas ou portões do templo e é uma formulação bíblica clara em português.
- source_word: לֹא נַעֲזֹב
  choice: não negligenciaremos
  rationale: No contexto da provisão para o culto, expressa deixar de cuidar ou sustentar a casa de Deus, sem limitar o verbo a abandono físico.
theological_decisions:
- issue: Designações coletivas genealógicas
  choice: os filhos de Israel e os filhos de Levi
  alternative: os israelitas e os levitas
  rationale: A formulação escolhida conserva o paralelismo e a imagem filial presentes no hebraico, sem introduzir uma leitura denominacional.
- issue: Sentido de עזב em relação à casa de Deus
  choice: não negligenciaremos a casa do nosso Deus
  alternative: não abandonaremos a casa do nosso Deus
  rationale: O contexto imediato trata da manutenção material e do serviço do templo; ‘negligenciaremos’ preserva essa força prática, enquanto ‘abandonaremos’ continua sendo uma possibilidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para evitar que ‘ali’ parecesse modificar apenas o último item, mantendo a enumeração hebraica. Não há marcadores de nota porque nenhuma nota foi julgada necessária para esta redação.
