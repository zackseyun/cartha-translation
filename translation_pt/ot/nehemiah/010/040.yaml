  source_fidelity: 'A tradução transmite com precisão os elementos principais: os grupos paralelos, a contribuição agrícola, as câmaras, os utensílios e os servidores do templo, bem como o compromisso de não negligenciar a casa de Deus. Contudo, «ali estarão» introduz desnecessariamente um futuro explícito. No hebraico, «e ali...» é uma oração nominal, e a referência é ao que se encontra nas câmaras.'
  naturalness: O texto é claro e digno em português moderno. «Ali estão» é mais natural e mais próximo da construção nominal hebraica do que «ali estarão».
  terminology: «Câmaras», «contribuição», «cereal», «vinho novo», «azeite», «utensílios do santuário», «porteiros» e «cantores» são escolhas adequadas. «Não negligenciaremos» preserva bem o sentido contextual de deixar de cuidar da manutenção da casa de Deus.
