  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: pt
  text: Por causa de tudo isso,[a] firmamos um compromisso solene e o colocamos por escrito; no documento selado[b] constam nossos líderes, nossos levitas e nossos sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em tudo isso, fazemos um compromisso firme e o escrevemos”. O hebraico emprega literalmente a expressão “cortar um compromisso”, fórmula usada para estabelecer solenemente uma aliança ou um acordo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no registro selado”. O hebraico provavelmente se refere ao compromisso escrito que foi formalmente selado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: Por causa de tudo isso
  rationale: A preposição בְּ, neste contexto, retoma a confissão e as circunstâncias anteriores com provável valor causal. A formulação é natural em português e mantém essa referência retrospectiva.
- source_word: כֹּרְתִים
  choice: firmamos
  rationale: כרת, quando usado com um compromisso ou aliança, é uma expressão idiomática que significa estabelecer formalmente esse compromisso. “Firmamos” preserva o caráter solene sem reproduzir o literal e pouco natural “cortamos”.
- source_word: אֲמָנָה
  choice: um compromisso solene
  rationale: O substantivo denota um compromisso firme, confiável e formal. “Compromisso solene” comunica sua seriedade e força obrigatória sem defini-lo de modo mais estrito do que o hebraico.
- source_word: וְכֹתְבִים
  choice: e o colocamos por escrito
  rationale: O particípio indica que o compromisso é registrado por escrito. O pronome retoma naturalmente “compromisso” em português.
- source_word: וְעַל הֶחָתוּם
  choice: no documento selado
  rationale: A expressão substantivada se refere provavelmente ao instrumento escrito que recebeu selo formal. “Documento selado” transmite com clareza o contexto documental e jurídico.
- source_word: שָׂרֵינוּ
  choice: nossos líderes
  rationale: שׂרים pode designar príncipes, chefes, governantes ou autoridades. “Líderes” é amplo, natural e adequado ao contexto comunitário pós-exílico, sem sugerir necessariamente posição régia.
- source_word: לְוִיֵּינוּ
  choice: nossos levitas
  rationale: É a designação tradicional e clara do grupo levítico.
- source_word: כֹּהֲנֵינוּ
  choice: nossos sacerdotes
  rationale: Tradução direta e corrente da designação do grupo sacerdotal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Firmamos” e “documento selado” preservam o tom formal do ato, enquanto “constam” explicita de maneira idiomática que os líderes, levitas e sacerdotes aparecem no registro, sem especificar se por nomes, assinaturas ou selos.
