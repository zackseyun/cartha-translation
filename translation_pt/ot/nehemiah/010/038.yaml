    rationale: O hebraico רֵאשִׁית עֲרִיסֹתֵינוּ significa literalmente a primeira porção de nossa massa/massa amassada. “Ofertas de massa” desloca o sentido de עֲרִיסָה e é uma alternativa lexical enganosa.
