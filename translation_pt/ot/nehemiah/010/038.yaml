  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: pt
  text: E levaremos aos sacerdotes, às dependências da casa do nosso Deus, a primeira porção da nossa massa[a], as nossas contribuições, o fruto de toda árvore, o vinho novo e o azeite; e levaremos aos levitas o dízimo da nossa terra, pois são eles, os levitas, que recolhem os dízimos em todas as cidades onde trabalhamos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as primícias da nossa massa”. O termo hebraico se refere à massa amassada, da qual se separava uma primeira porção como contribuição sagrada.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em todas as cidades do nosso trabalho” ou “do nosso serviço”. A expressão é condensada e pode se referir às cidades ligadas ao trabalho agrícola do povo.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: a primeira porção da nossa massa
  rationale: רֵאשִׁית indica a primeira porção, e עֲרִיסָה designa a massa amassada. A formulação conserva a concretude da oferta e soa natural em português.
- source_word: תְּרוּמֹתֵינוּ
  choice: as nossas contribuições
  rationale: תְּרוּמָה é uma contribuição ou oferta separada para uso sagrado. “Contribuições” é claro e evita uma designação técnica ou arcaica.
- source_word: פְּרִי כָל עֵץ
  choice: o fruto de toda árvore
  rationale: Tradução direta que preserva a força distributiva de כָל sem transformar o singular hebraico em uma expressão mais geral.
- source_word: תִּירוֹשׁ
  choice: o vinho novo
  rationale: תִּירוֹשׁ normalmente se refere ao vinho recém-produzido, especialmente em listas de produtos agrícolas.
- source_word: יִצְהָר
  choice: o azeite
  rationale: Em listas agrícolas, יִצְהָר indica óleo, normalmente de oliva; “azeite” expressa esse sentido de modo natural em português.
- source_word: נָבִיא
  choice: levaremos
  rationale: O hifil de בוא na primeira pessoa do plural expressa o compromisso assumido pela comunidade; o futuro do indicativo comunica adequadamente essa promessa.
- source_word: לִשְׁכוֹת
  choice: às câmaras
  rationale: לִשְׁכּוֹת são salas do complexo do templo, muitas vezes usadas para armazenamento. “Câmaras” preserva o sentido arquitetônico sem limitar sua função.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: o dízimo da nossa terra
  rationale: A expressão denota a décima parte devida da produção da terra. A tradução compacta preserva a relação genitiva do hebraico.
- source_word: הַמְעַשְּׂרִים
  choice: recolhem os dízimos
  rationale: O particípio contextualiza os levitas como aqueles que recebem ou arrecadam os dízimos; “recolhem” é natural e não excessivamente administrativo.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: em todas as cidades onde trabalhamos
  rationale: עֲבֹדָה pode significar trabalho ou serviço. No contexto de terra e dízimos, a frase provavelmente alude às localidades ligadas ao trabalho agrícola do povo, mas a tradução mantém o termo amplo.
