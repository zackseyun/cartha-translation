revisions:
- from: Também levaremos aos sacerdotes, às câmaras da casa do nosso Deus, a primeira porção da nossa massa[a], as nossas contribuições, o fruto de toda árvore, o vinho novo e o azeite; e levaremos aos levitas o dízimo da nossa terra, pois são os levitas que recolhem os dízimos em todas as cidades onde trabalhamos[b].
  to: E levaremos aos sacerdotes, às dependências da casa do nosso Deus, a primeira porção da nossa massa[a], as nossas contribuições, o fruto de toda árvore, o vinho novo e o azeite; e levaremos aos levitas o dízimo da nossa terra, pois são eles, os levitas, que recolhem os dízimos em todas as cidades onde trabalhamos[b].
