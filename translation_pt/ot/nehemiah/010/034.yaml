  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: pt
  text: para o pão colocado em ordem[a], para a oferta regular de cereal[b] e para o holocausto regular, para os sábados, as luas novas, as ocasiões determinadas[c] e as coisas santas[d], para as ofertas pelo pecado[e], a fim de fazer expiação por Israel, e para todo o trabalho da casa do nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pão da disposição»; tradicionalmente, «pães da proposição».
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir «oferta contínua de cereal» e, adiante, «holocausto contínuo».
    reason: lexical_alternative
  - marker: c
    text: As «ocasiões determinadas» incluem as celebrações fixadas.
    reason: lexical_alternative
  - marker: d
    text: Ou «ofertas santas» ou «coisas consagradas».
    reason: lexical_alternative
  - marker: e
    text: Em certos contextos, «ofertas pelo pecado» também podem ser entendidas como «ofertas de purificação».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: pão da disposição
  rationale: Reproduz de perto a ideia do pão colocado em ordem diante de Deus, sem recorrer apenas ao termo tradicional menos transparente «pães da proposição».
- source_word: מִנְחַת הַתָּמִיד
  choice: oferta regular de cereal
  rationale: No contexto do culto, מִנְחָה designa normalmente uma oferta de cereal, e תָּמִיד indica sua realização contínua ou regular.
- source_word: עֹלַת הַתָּמִיד
  choice: holocausto regular
  rationale: «Holocausto» é o termo cultual reconhecível para a oferta inteiramente queimada; «regular» comunica a recorrência indicada por תָּמִיד.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: os sábados, as luas novas, as ocasiões determinadas
  rationale: Mantém a enumeração hebraica e conserva em מוֹעֲדִים um sentido mais amplo do que apenas festas, embora inclua celebrações fixadas.
- source_word: וְלַקֳּדָשִׁים
  choice: e as coisas santas
  rationale: Preserva a amplitude do plural hebraico, que pode abranger ofertas, objetos ou outros elementos consagrados, sem restringi-lo indevidamente.
- source_word: וְלַחַטָּאוֹת
  choice: para as ofertas pelo pecado
  rationale: É a designação cultual clara e tradicional; a alternativa «ofertas de purificação» permanece possível em contextos sacerdotais.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: a fim de fazer expiação por Israel
  rationale: Preserva a força cultual e teológica de כפר sem definir além do texto o mecanismo da expiação.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: e para todo o trabalho da casa do nosso Deus
  rationale: «Trabalho» mantém o alcance amplo de מְלָאכָה, incluindo as várias responsabilidades e necessidades ligadas ao templo.
theological_decisions:
- issue: Terminologia sacrificial
  choice: Manter «oferta de cereal», «holocausto», «ofertas pelo pecado» e «fazer expiação».
  alternative: Empregar formulações mais interpretativas, como «oferta de purificação» ou «oferta inteiramente queimada».
  rationale: Esses termos preservam as categorias cultuais hebraicas de modo reconhecível, sem impor uma explicação doutrinária mais estreita.
- issue: Amplitude de קֳדָשִׁים
  choice: Traduzir como «coisas santas».
  alternative: «ofertas santas» ou «coisas consagradas».
  rationale: O hebraico não especifica apenas ofertas; a formulação ampla conserva a ambiguidade genuína.
- issue: Relação sintática dos sábados, luas novas e ocasiões determinadas
  choice: Apresentá-los como itens regidos por «para», após o holocausto regular.
  alternative: Ligá-los diretamente ao «holocausto regular» como ocasiões em que ele era oferecido.
  rationale: A sequência hebraica permite associação contextual, mas a redação escolhida evita resolver de modo excessivamente rígido a relação sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração cultual e a repetição de «para» foram preservadas para clareza; termos técnicos tradicionais foram mantidos quando continuam inteligíveis.
