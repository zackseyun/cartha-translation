  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: pt
  text: Quanto aos povos da terra que trazem mercadorias e cereais no dia de sábado para vender, não compraremos deles nem no sábado nem em dia santo. Deixaremos a terra em repouso no sétimo ano e abriremos mão de toda cobrança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de toda dívida”, “de toda reivindicação” ou “de toda exação”. A expressão hebraica é literalmente “o encargo de toda mão”.
    reason: A locução מַשָּׁא כָל יָד é rara e admite diferentes formulações para a renúncia a cobranças, créditos ou reivindicações.
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: os povos da terra
  rationale: Preserva o plural hebraico e designa, de modo amplo, as populações locais ou vizinhas que comerciavam com os judeus.
- source_word: הַמְבִיאִים
  choice: que trazem
  rationale: O particípio descreve uma prática habitual; o presente simples é natural em português para uma estipulação pactual.
- source_word: הַמַּקָּחוֹת
  choice: mercadorias
  rationale: Expressa claramente artigos destinados ao comércio, em registro atual e digno.
- source_word: וְכָל שֶׁבֶר
  choice: e cereais
  rationale: שֶׁבֶר, em contexto comercial, costuma indicar cereal destinado à alimentação; o plural coletivo soa natural em português.
- source_word: לֹא נִקַּח מֵהֶם
  choice: não compraremos deles
  rationale: Embora לקח possa significar genericamente 'tomar', o contexto explícito de venda determina aqui o sentido comercial de comprar.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: nem em dia santo
  rationale: Depois da negação, 'nem' expressa naturalmente a extensão da proibição; 'dia santo' traduz diretamente a expressão hebraica.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: Deixaremos a terra em repouso no sétimo ano
  rationale: Torna compreensível a obrigação agrícola implícita na legislação do ano sabático, sem substituir a designação literal 'sétimo ano' por um termo confessional ou técnico.
- source_word: מַשָּׁא כָל יָד
  choice: toda cobrança
  rationale: A expressão hebraica é compacta e difícil. 'Cobrança' comunica o provável sentido jurídico-econômico, sem restringi-lo tão decisivamente quanto 'toda dívida'; a incerteza é preservada em nota.
theological_decisions:
- issue: Alcance da obrigação referente ao sétimo ano
  choice: O texto apresenta o repouso agrícola do sétimo ano e a renúncia à cobrança de obrigações financeiras.
  alternative: 'Entender a frase de maneira mais literal e menos específica: ''deixaremos o sétimo ano e o encargo de toda mão''.'
  rationale: A formulação remete às leis sabáticas sobre o repouso da terra e a remissão de créditos. A tradução explicita apenas o necessário para produzir português inteligível, enquanto a nota conserva a ambiguidade da expressão final.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmo. A repetição de “sábado” preserva a ênfase do hebraico, e o marcador da nota foi colocado junto à expressão realmente ambígua.
