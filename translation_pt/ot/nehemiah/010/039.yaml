base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: pt
  text: O sacerdote, descendente de Arão, estará com os levitas quando os levitas recolherem o dízimo. E os levitas levarão o dízimo do dízimo[a] à casa do nosso Deus, às câmaras do depósito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a décima parte do dízimo”. A expressão hebraica diz literalmente “o dízimo do dízimo” e se refere à parte que os levitas entregavam do dízimo que recebiam.
    reason: lexical_alternative
  - marker: b
    text: Ou “tesouro”. Aqui, o termo provavelmente indica um local onde se armazenavam dízimos e ofertas, não especificamente um tesouro em dinheiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: estará
  rationale: 'O perfeito com waw, neste contexto de compromisso normativo, tem sentido prospectivo: estabelece o que deverá ocorrer.'
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: O sacerdote, descendente de Arão
  rationale: Expressa de modo natural em português a pertença do sacerdote à linhagem de Arão, sem recorrer ao termo mais técnico “aarônico”.
- source_word: עִם
  choice: com
  rationale: Indica a presença do sacerdote junto aos levitas durante o recolhimento do dízimo.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: quando eles recolherem o dízimo
  rationale: O infinitivo denota aqui o ato de tomar ou recolher o dízimo; a oração temporal é clara e idiomática em português.
- source_word: יַעֲלוּ
  choice: levarão
  rationale: O hifil de עלה significa literalmente “farão subir” ou “levarão para cima”; em português, “levarão” comunica naturalmente o transporte ao templo sem impor uma formulação espacial pouco idiomática.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: o dízimo dos dízimos
  rationale: Mantém a expressão técnica e enfática do hebraico para a parte que os próprios levitas entregavam do dízimo recebido.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: à casa do nosso Deus
  rationale: Preserva a designação hebraica do templo e sua linguagem comunitária e pactual.
- source_word: הַלְּשָׁכוֹת
  choice: às salas
  rationale: Designa de maneira corrente e compreensível os compartimentos do templo usados para armazenamento.
- source_word: לְבֵית הָאוֹצָר
  choice: do depósito
  rationale: O contexto trata do armazenamento de dízimos e ofertas, sobretudo produtos, de modo que “depósito” é mais preciso do que “tesouro”.
theological_decisions:
- issue: Terminologia cultual para a área de armazenamento do templo
  choice: depósito
  alternative: tesouro
  rationale: Como o contexto envolve dízimos agrícolas e sua administração pelos sacerdotes e levitas, “depósito” evita sugerir que se tratava especificamente de dinheiro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “dízimo” preserva a formulação técnica do hebraico; “descendente de Arão” evita tanto a ambiguidade de filiação imediata quanto um tecnicismo desnecessário.
