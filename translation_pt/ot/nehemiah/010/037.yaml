  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: pt
  text: e os primogênitos dos nossos filhos e dos nossos animais domésticos, como está escrito na Lei, e os primogênitos do nosso gado e dos nossos rebanhos, para levá-los à casa do nosso Deus, aos sacerdotes que servem na casa do nosso Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: os primogênitos dos nossos filhos
  rationale: Expressa naturalmente a relação genitiva e preserva a referência aos primeiros nascidos entre os filhos, sem acrescentar detalhes não explícitos no hebraico.
- source_word: וּבְהֶמְתֵּינוּ
  choice: e dos nossos animais domésticos
  rationale: בְּהֵמָה é um termo coletivo amplo para animais domesticados; esta opção evita restringi-lo apenas ao gado bovino.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: como está escrito na Lei
  rationale: Mantém a fórmula de apelo à instrução escrita da Torá; a inicial maiúscula indica a referência específica à Lei, não a leis em geral.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: os primogênitos das nossas manadas e dos nossos rebanhos
  rationale: Distingue os animais de manada, sobretudo bovinos, dos pequenos animais de rebanho, isto é, ovelhas e cabras, sem estreitar indevidamente os termos.
- source_word: לְהָבִיא
  choice: para os levar
  rationale: O infinitivo indica propósito no contexto da lista de compromissos; o pronome retoma com clareza os primogênitos mencionados.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: à casa do nosso Deus
  rationale: Preserva a expressão hebraica literal e solene, embora o referente contextual seja o templo.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: aos sacerdotes que servem
  rationale: O particípio descreve o serviço contínuo dos sacerdotes; 'servem' é claro e natural em português atual.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: na casa do nosso Deus
  rationale: Conserva a repetição enfática presente no hebraico e mantém explícito o lugar do serviço sacerdotal.
theological_decisions:
- issue: Tradução de בֵּית אֱלֹהֵינוּ
  choice: casa do nosso Deus
  alternative: templo do nosso Deus
  rationale: Embora o templo seja o referente, 'casa do nosso Deus' preserva a formulação do texto hebraico e evita substituir a imagem original por uma explicação interpretativa.
- issue: Se a tradução deve explicitar redenção ou sacrifício dos primogênitos
  choice: manter apenas 'primogênitos'
  alternative: primogênitos a serem resgatados ou oferecidos
  rationale: O versículo remete às prescrições da Lei, mas não especifica aqui o tratamento distinto dado aos primogênitos humanos e animais; explicitar isso no texto resolveria uma questão que o próprio versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'casa do nosso Deus' foi mantida por refletir a ênfase hebraica. Não foram acrescentadas notas, pois a alternativa lexical sugerida no material inglês parece estar associada ao marcador errado e o texto português já comunica adequadamente as categorias gerais.
