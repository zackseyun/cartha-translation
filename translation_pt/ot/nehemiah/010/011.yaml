  text: 'and their brothers: Shebaniah, Hodiah, Kelita, Pelaiah, Hanan.'
translation:
  language: pt
  text: 'e seus irmãos: Sebanias, Hodias, Quelita, Pelaías e Hanã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: e seus irmãos
  rationale: A conjunção וַ seguida de אֲחֵי com sufixo masculino plural significa literalmente «e seus irmãos». No contexto da lista de signatários da aliança, a expressão designa outros homens associados ao grupo; «irmãos» preserva o sentido e o gênero do hebraico sem ampliar para um coletivo genérico.
- source_word: שְׁבַנְיָה
  choice: Sebanias
  rationale: Nome próprio transliterado segundo a forma bíblica tradicional e reconhecível em português.
- source_word: הוֹדִיָּה
  choice: Hodias
  rationale: Nome próprio apresentado numa forma portuguesa bíblica corrente, mantendo distinção clara em relação a Sebanias.
- source_word: קְלִיטָא
  choice: Quelita
  rationale: Transliteração adaptada à ortografia portuguesa, na qual «qu» representa naturalmente o som inicial antes de «e».
- source_word: פְּלָאיָה
  choice: Pelaías
  rationale: Forma portuguesa reconhecível que representa o nome hebraico e sua terminação.
- source_word: חָנָן
  choice: Hanã
  rationale: Transliteração portuguesa concisa; o til indica adequadamente a terminação nasal perceptível na forma hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas bíblicas portuguesas reconhecíveis. O dois-pontos introduz naturalmente a continuação da lista, e a conjunção «e» antes do último nome segue o uso normal do português.
