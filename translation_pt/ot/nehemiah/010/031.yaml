source:
  edition: WLC
  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: pt
  text: e que não daríamos nossas filhas aos povos da terra, nem tomaríamos as filhas deles para nossos filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “tomar” significa tomar em casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: e que
  rationale: No contexto da renovação da aliança, introduz mais uma cláusula do compromisso assumido e preserva tanto a ligação quanto a subordinação ao juramento anterior.
- source_word: לֹא נִתֵּן
  choice: não daríamos
  rationale: O yiqtol expressa aqui o compromisso assumido pela comunidade; o futuro do pretérito harmoniza naturalmente com a continuação sintática de uma declaração anterior em português.
- source_word: בְּנֹתֵינוּ
  choice: nossas filhas
  rationale: Reproduz diretamente o substantivo feminino plural com o sufixo possessivo.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: aos povos da terra
  rationale: Mantém o plural hebraico עַמֵּי e evita acrescentar qualificações como “pagãos” ou “estrangeiros”, ausentes desta expressão.
- source_word: נִקַּח
  choice: tomaríamos
  rationale: Preserva o sentido lexical de “tomar” e o paralelismo com “dar”; neste contexto, trata-se de tomar em casamento, esclarecido em nota.
- source_word: לְבָנֵינוּ
  choice: para nossos filhos
  rationale: Mantém a referência específica aos filhos homens e a construção de finalidade ou destinação do hebraico.
theological_decisions:
- issue: Proibição matrimonial sem introduzir uma interpretação étnica ou racial
  choice: “aos povos da terra” e linguagem matrimonial recíproca sem qualificações adicionais
  alternative: “aos povos pagãos/estrangeiros da terra” ou “aos habitantes da terra”
  rationale: A formulação conserva o plural e a linguagem social-pactual do texto, sem acrescentar uma caracterização religiosa ou étnica que não está expressa nesta cláusula.
translation_notes:
  register: Português moderno, digno e acessível. Conserva o plural “povos” do hebraico e o paralelismo entre “dar” e “tomar”. O condicional acompanha naturalmente a dependência desta cláusula em relação ao compromisso juramentado nos versículos anteriores.
