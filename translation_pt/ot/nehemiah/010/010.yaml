  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: pt
  text: 'e os levitas: Jesua, filho de Azanias; Binui, dos filhos de Henadade; Cadmiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: Mantém a conjunção que liga o versículo à lista anterior e traduz o substantivo definido no plural. Não se acrescenta verbo, pois o hebraico não o traz.
- source_word: וְיֵשׁוּעַ
  choice: Jesua
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico יֵשׁוּעַ. A conjunção já aparece naturalmente na introdução da lista.
- source_word: בֶּן אֲזַנְיָה
  choice: filho de Azanias
  rationale: Reproduz diretamente a relação genealógica expressa por בֶּן, usando a forma portuguesa corrente do nome.
- source_word: בִּנּוּי
  choice: Binui
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
- source_word: מִבְּנֵי חֵנָדָד
  choice: dos filhos de Henadade
  rationale: Expressa a pertença de Binui ao grupo familiar ou clã de Henadade. Em português, “dos filhos de” comunica de modo natural tanto a preposição מִן quanto o uso genealógico de בְּנֵי.
- source_word: קַדְמִיאֵל
  choice: Cadmiel
  rationale: Forma portuguesa tradicional do nome, refletindo de modo legível o hebraico קַדְמִיאֵל.
