  register: Texto em português moderno, digno e conciso, preservando a estrutura nominal de uma lista de signatários. Os nomes foram apresentados em formas portuguesas tradicionais. Ponto e vírgula separa as três entradas levíticas e evita confundir a filiação de Jesua com a identificação clânica de Binui.
