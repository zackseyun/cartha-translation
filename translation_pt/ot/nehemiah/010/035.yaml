  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: pt
  text: Também lançamos sortes — os sacerdotes, os levitas e o povo — a respeito da oferta de lenha[a], para levá-la à casa do nosso Deus, segundo os nossos grupos familiares, em épocas determinadas, ano após ano, a fim de queimá-la sobre o altar de Yahweh, nosso Deus, conforme está escrito na Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a oferta de lenha”. A preposição hebraica pode indicar tanto o assunto quanto a finalidade do sorteio; em ambos os casos, as sortes determinavam a responsabilidade de fornecer a lenha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Também lançamos sortes
  rationale: A construção causativa de נפל com גּוֹרָלוֹת é a expressão hebraica usual para lançar sortes. “Também” representa o וְ inicial e liga este compromisso aos anteriores.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: a respeito da oferta de lenha
  rationale: עַל introduz o assunto ou finalidade decidida pelas sortes; קֻרְבַּן designa uma oferta, e הָעֵצִים indica que ela consistia em lenha para o altar. A nota preserva a alternativa “para a oferta de lenha”.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: os sacerdotes, os levitas e o povo
  rationale: Mantém explicitamente os três grupos participantes. Os travessões tornam clara sua relação com “lançamos sortes” sem alterar o conteúdo.
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: para levá-la à casa do nosso Deus
  rationale: O infinitivo expressa a finalidade do sorteio. O pronome retoma naturalmente a oferta de lenha, e “casa do nosso Deus” preserva a expressão hebraica para o templo.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: por nossas famílias
  rationale: A expressão literalmente ligada às “casas dos pais” designa divisões familiares ou ancestrais. “Por nossas famílias” comunica essa organização em português atual.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: em épocas determinadas, ano após ano
  rationale: Reproduz tanto o calendário previamente fixado quanto a repetição anual.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: a fim de queimá-la sobre o altar
  rationale: בער refere-se aqui à queima da lenha no altar. “Queimá-la” explicita em português o objeto entendido no hebraico, sem acrescentar a ideia mais interpretativa de manter o fogo continuamente aceso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: conforme está escrito na Lei
  rationale: Preserva a fórmula de apelo à prescrição escrita na Torá; “Lei” com inicial maiúscula indica esse corpo reconhecido de instrução.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
- issue: Finalidade da lenha no altar
  choice: a fim de queimá-la sobre o altar
  alternative: a fim de manter o fogo aceso sobre o altar
  rationale: A tradução escolhida segue de perto o verbo בער e não introduz explicitamente a noção de fogo contínuo, embora essa possa ser inferida do contexto legal mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Oferta de lenha” conserva o caráter cultual; “por nossas famílias” comunica de modo natural a organização por casas ancestrais. Os travessões esclarecem que sacerdotes, levitas e povo participavam do sorteio.
