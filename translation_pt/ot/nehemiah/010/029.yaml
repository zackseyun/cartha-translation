base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: pt
  text: e o restante do povo — os sacerdotes, os levitas, os guardas dos portões, os cantores, os servidores do templo[a] e todos os que se separaram dos povos das terras para aderir à Lei de Deus — suas mulheres, seus filhos e suas filhas[b], todos os que tinham conhecimento e entendimento —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “netineus”, transliteração tradicional do nome dado a uma classe de servidores do templo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega formas masculinas singulares com sentido coletivo: “todo aquele que se separou […] todo aquele que conhecia e entendia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: e o restante do povo
  rationale: Expressa diretamente a ideia do grupo remanescente da comunidade, sem transformar עָם em uma referência política a uma nação.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes, os levitas
  rationale: Emprega as designações portuguesas usuais e precisas para essas classes religiosas.
- source_word: הַשּׁוֹעֲרִים
  choice: os guardas dos portões
  rationale: Identifica com clareza os encarregados de guardar as entradas; é mais específico que simplesmente “porteiros”.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio derivado de שׁיר se refere especificamente aos que cantavam, não a músicos em geral.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: Traduz a função dessa classe de pessoal do templo em vez de usar a transliteração pouco inteligível “netineus”.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: e todos os que se separaram dos povos das terras para seguir a Lei de Deus
  rationale: Mantém o contraste direcional entre afastar-se dos povos e voltar-se para a Torá de Deus. “Para seguir” torna natural em português a relação expressa por אֶל sem reduzir a Lei a mera legislação.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: suas mulheres, seus filhos e suas filhas
  rationale: Preserva os três grupos explicitamente enumerados no hebraico, sem generalizá-los como “famílias” ou “filhos”.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: todos os que tinham conhecimento e entendimento
  rationale: Reproduz os dois particípios e comunica que os participantes possuíam compreensão suficiente para assumir conscientemente o compromisso.
theological_decisions:
- issue: Direção da separação em אֶל תּוֹרַת הָאֱלֹהִים
  choice: para seguir a Lei de Deus
  alternative: para a Lei de Deus
  rationale: A formulação explicita com naturalidade a adesão à Torá sugerida pela preposição direcional, sem especificar além do texto a forma dessa adesão.
- issue: Formas masculinas singulares com sentido coletivo em הַנִּבְדָּל e יוֹדֵעַ מֵבִין
  choice: usar construções plurais coletivas naturais em português e registrar a forma hebraica em nota
  alternative: aquele que se separou… todo aquele que conhecia e entendia
  rationale: O singular hebraico tem força distributiva e coletiva. O plural português concorda naturalmente com a enumeração de toda a comunidade, enquanto a nota conserva a informação gramatical e sua possível relevância interpretativa.
- issue: Identificação de הַנְּתִינִים
  choice: servidores do templo
  alternative: netineus
  rationale: A tradução funcional comunica a posição do grupo sem exigir conhecimento de uma transliteração tradicional e sem acrescentar uma função doutrinariamente específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação mantém o caráter de lista e o travessão final, pois a frase continua no versículo seguinte. “Lei” recebe inicial maiúscula por designar aqui a Torá de Deus.
