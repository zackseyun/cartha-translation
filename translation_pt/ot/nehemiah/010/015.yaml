  yaml_path: translation/ot/nehemiah/010/015.yaml
  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: pt
  text: 'os chefes do povo[a]: Parós, Paate-Moabe, Elão, Zatu e Bani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as cabeças do povo”; também pode ser traduzido por “os líderes do povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: os chefes de
  rationale: Plural construto de רֹאשׁ, empregado aqui de modo idiomático para pessoas em posição de liderança. “Chefes” comunica naturalmente a função em português, enquanto a nota preserva a metáfora hebraica literal.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se à comunidade de Judá/Jerusalém representada na lista da aliança; “o povo” é a expressão corrente e adequada ao contexto.
- source_word: פַּרְעֹשׁ
  choice: Parós
  rationale: Nome próprio ou de família, transliterado em forma natural para leitores de língua portuguesa.
- source_word: פַּחַת מוֹאָב
  choice: Paate-Moabe
  rationale: Nome próprio composto, transliterado com hífen para tornar visíveis seus dois elementos sem traduzir o nome.
- source_word: עֵילָם
  choice: Elão
  rationale: Neste rol, o termo funciona como nome pessoal ou familiar, embora em outros contextos também designe uma região.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nome próprio ou de família, transliterado de acordo com a forma consonantal do hebraico.
- source_word: בָּנִי
  choice: Bani
  rationale: A forma hebraica deste versículo sustenta “Bani”; não foi harmonizada com nomes semelhantes presentes em outros contextos genealógicos.
