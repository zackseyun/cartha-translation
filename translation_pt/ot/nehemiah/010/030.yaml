id: NEH.10.30
reference: Nehemiah 10:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: pt
  text: Eles se unem a seus irmãos[a], seus nobres, e se comprometem mediante maldição e juramento[b] a andar na lei de Deus, dada pela mão de Moisés[c], servo de Deus, e a guardar e cumprir todos os mandamentos de Yahweh, nosso Senhor, bem como seus juízos e seus estatutos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vinculam a seus irmãos, seus nobres”. O idioma hebraico pode indicar adesão firme aos membros proeminentes da comunidade em solidariedade de aliança.'
    reason: lexical_alternative
  - marker: b
    text: '“Maldição e juramento” indica um compromisso de aliança sob sanção: eles juram obedecer e aceitam as consequências da quebra desse compromisso.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “dada por intermédio de Moisés”. Literalmente: “dada pela mão de Moisés”.'
    reason: lexical_alternative
  - marker: d
    text: “Juízos” também pode ser traduzido por “ordenanças” ou “normas”; “estatutos”, por “decretos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: se unem a
  rationale: O idioma hebraico expressa adesão firme e solidariedade com os demais participantes da aliança; “se unem a” é natural em português e preserva esse sentido relacional.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Mantém o termo masculino de parentesco do hebraico, que neste contexto designa os demais membros da comunidade da aliança.
- source_word: אַדִּירֵיהֶם
  choice: seus nobres
  rationale: O termo indica pessoas proeminentes e de posição elevada na comunidade; “nobres” conserva a dimensão social do vocábulo.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: se comprometem mediante maldição e juramento
  rationale: Evita o pouco natural “entram em uma maldição” sem eliminar nenhum dos dois substantivos hebraicos; comunica a assunção formal de uma obrigação de aliança acompanhada de sanção.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: a andar na lei de Deus
  rationale: Preserva a metáfora hebraica de “andar” como modo de vida e traduz תּוֹרָה por “lei”, adequado ao contexto pactual e legal.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: dada pela mão de Moisés
  rationale: Conserva o idioma hebraico da mediação por meio da “mão” de Moisés, esclarecido em nota sem apagar a forma do texto-fonte.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: servo de Deus
  rationale: Aqui עֶבֶד funciona como título honroso de Moisés; “servo” é a opção idiomática e contextualmente apropriada.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: a guardar e cumprir
  rationale: Mantém os dois verbos da fórmula pactual. “Cumprir” comunica naturalmente a realização prática indicada por עשה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: seus juízos e seus estatutos
  rationale: Preserva a distinção entre as duas categorias jurídicas, sem fundi-las numa expressão genérica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” preserva essa função sem substituí-la pelo título “Senhor”, que já aparece separadamente em אֲדֹנֵינוּ.
- issue: Sentido comunitário de אֲחֵיהֶם
  choice: seus irmãos
  alternative: seus parentes; seus compatriotas israelitas
  rationale: A tradução mantém a forma masculina e familiar do hebraico, sem decidir além do texto se o referente abrange explicitamente toda a comunidade.
- issue: Tradução de עֶבֶד como título de Moisés
  choice: servo de Deus
  alternative: escravo de Deus
  rationale: Embora עֶבֶד possa significar “escravo”, neste contexto é um título honroso tradicional de Moisés; “servo” comunica adequadamente essa função.
- issue: Natureza da maldição e do juramento
  choice: maldição e juramento como compromisso pactual sob sanção
  alternative: mera imprecação e promessa separadas
  rationale: A combinação lexical no contexto da renovação da aliança indica um juramento vinculante no qual os participantes aceitam as consequências da desobediência, sem especificar sanções não declaradas neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a metáfora pactual “andar na lei”, o nome divino “Yahweh” e as distinções jurídicas do hebraico, enquanto emprega “se comprometem mediante” para expressar com naturalidade o idioma de entrar sob maldição e juramento.
