- source_word: רְחוּם
  choice: Reum
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecível em português bíblico; o ח medial não é representado separadamente na forma portuguesa convencional.
- source_word: חֲשַׁבְנָה
  choice: Hasabna
  rationale: Nome próprio transliterado em forma natural para leitores de português, sem traduzir o possível conteúdo semântico do nome.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Nome próprio teofórico vertido pela forma tradicional portuguesa, preservando seu caráter de nome pessoal em vez de traduzir sua etimologia.
