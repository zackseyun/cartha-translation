base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: pt
  text: 'E você até designou profetas para proclamarem a seu respeito em Jerusalém: “Há um rei em Judá!” Agora, essas notícias chegarão aos ouvidos do rei. Portanto, venha, e vamos deliberar juntos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: E você até
  rationale: A conjunção com a partícula aditiva assume valor enfático no tom acusatório da carta.
- source_word: נְבִיאִים
  choice: profetas
  rationale: É o sentido comum do termo; o contexto não justifica enfraquecê-lo para mensageiros ou porta-vozes.
- source_word: הֶעֱמַדְתָּ
  choice: designou
  rationale: O hifil de עמד indica colocar pessoas numa função; “designou” comunica essa atribuição com naturalidade.
- source_word: לִקְרֹא עָלֶיךָ
  choice: para proclamarem a seu respeito
  rationale: Preserva o valor de קרא com על como proclamação referente a alguém, sem identificar explicitamente Nehemias como rei dentro da citação.
- source_word: בִירוּשָׁלַם
  choice: em Jerusalém
  rationale: Tradução locativa direta.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da proclamação.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: Há um rei em Judá!
  rationale: Reproduz a força da frase nominal hebraica sem inserir um sujeito nominal ou pronominal ausente do texto.
- source_word: וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: Agora, essas notícias chegarão aos ouvidos do rei
  rationale: Expressão portuguesa natural que mantém a ideia de que tais relatos serão ouvidos pelo rei; “notícias” corresponde ao sentido contextual de דברים.
- source_word: וְעַתָּה לְכָה
  choice: Portanto, venha
  rationale: A transição apresenta a reunião proposta como consequência da ameaça anterior; o imperativo é preservado.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: e vamos conversar sobre isso juntos
  rationale: O nifal volitivo de יעץ expressa deliberação conjunta. A formulação é atual e clara, sem pressupor concordância entre as partes.
theological_decisions:
- issue: Natureza da acusação de pretensão à realeza
  choice: “Há um rei em Judá!”
  alternative: “Você é rei em Judá!” ou “Nehemias é rei em Judá!”
  rationale: 'O hebraico é uma frase breve e sem verbo: “rei em Judá”. O contexto dirige a acusação a Nehemias, mas a fala citada não o nomeia explicitamente; a tradução preserva essa tensão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “chegarão aos ouvidos do rei” comunica idiomaticamente a passiva hebraica. Não foram incluídas notas, pois as ambiguidades relevantes podem ser preservadas no próprio texto.
