  to: 'E você até designou profetas para proclamarem a seu respeito em Jerusalém: “Há um rei em Judá!” Agora, essas notícias chegarão aos ouvidos do rei. Portanto, venha, e vamos deliberar juntos.'
  rationale: A revisão remove a especificação interpretativa “sobre isso” e substitui “conversar” por “deliberar”, que reproduz com maior precisão a proposta de consulta mútua. O restante é mantido por ser fiel ao hebraico e natural em português moderno.
