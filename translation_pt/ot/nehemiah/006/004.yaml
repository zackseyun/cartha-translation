  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: pt
  text: Eles me enviaram quatro vezes a mesma mensagem[a], e eu lhes respondi da mesma maneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como esta palavra” ou “conforme esta coisa”, nas duas ocorrências. A expressão se refere à mesma comunicação enviada e ao mesmo tipo de resposta dada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: mandaram recado para mim
  rationale: O verbo significa literalmente “enviaram”, com o objeto implícito. Em português, “mandaram recado” expressa naturalmente a comunicação repetida sem especificar mensageiros.
- source_word: כַּדָּבָר הַזֶּה
  choice: com as mesmas palavras
  rationale: A expressão literal é “conforme esta palavra/coisa”. Neste contexto, aponta para a repetição do conteúdo comunicado, e a formulação portuguesa mantém a referência sem tornar “mensagem” excessivamente explícita.
- source_word: אַרְבַּע פְּעָמִים
  choice: quatro vezes
  rationale: Equivalência direta e idiomática da expressão hebraica de repetição.
- source_word: וָאָשִׁיב אוֹתָם
  choice: e eu lhes respondi
  rationale: O hifil de שׁוב pode indicar devolver uma resposta. “Responder-lhes” é a formulação portuguesa natural neste contexto de comunicação.
- source_word: כַּדָּבָר הַזֶּה
  choice: da mesma maneira
  rationale: Na segunda ocorrência, a expressão indica que Neemias repetiu a resposta anterior. A leve variação evita uma repetição artificial em português, sem apagar a correspondência entre as duas cláusulas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Mandaram recado” explicita apenas o objeto implícito exigido pelo uso idiomático em português; a nota preserva a forma mais literal e a repetição hebraica.
