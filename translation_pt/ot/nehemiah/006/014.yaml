source:
  edition: WLC
  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: pt
  text: Lembra-te, meu Deus, de Tobias e Sambalate, conforme estas obras que praticaram, e também de Noadias, a profetisa, e dos demais profetas que tentavam me amedrontar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que procuravam me intimidar”.'
    reason: Alternativa lexical que explicita o sentido causativo de provocar medo.
lexical_decisions:
- source_word: זָכְרָה
  choice: Lembra-te
  rationale: Preserva a forma direta da oração dirigida a Deus e o sentido de pedir que ele leve essas pessoas e seus atos em conta.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz de modo transparente o substantivo com o sufixo de primeira pessoa do singular.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: de Tobias e Sambalate
  rationale: A preposição portuguesa completa naturalmente o verbo pronominal “lembrar-se”; os nomes seguem formas portuguesas bíblicas reconhecíveis.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: conforme estas obras que praticaram
  rationale: “Conforme” conserva a ideia de correspondência expressa por כְּ. A oração relativa torna natural em português a referência distributiva aos dois adversários, apesar do sufixo hebraico formalmente singular.
- source_word: וְגַם
  choice: e também
  rationale: Mantém claramente a força aditiva da expressão hebraica.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: de Noadias, a profetisa
  rationale: Conserva o nome próprio e a designação feminina explícita no hebraico.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: e dos demais profetas
  rationale: “Demais” expressa com naturalidade o restante do grupo mencionado.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: que tentavam me amedrontar
  rationale: A construção com הָיוּ e particípio indica ação contínua no passado; o sentido causativo é provocar medo ou intimidar. “Tentavam” também preserva que o propósito deles não necessariamente teve êxito.
theological_decisions:
- issue: Tom da oração para que Deus se lembre dos adversários
  choice: Manter o pedido para que Deus se lembre deles conforme suas obras, sem explicitar uma sentença de condenação.
  alternative: “Castiga-os por estas obras” ou “lembra-te deles para julgá-los”.
  rationale: O contexto confere ao pedido um peso judicial, mas o hebraico não declara expressamente “castigar” nem “julgar”. A tradução preserva essa tensão sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com colocação pronominal natural para leitores brasileiros. “Lembra-te” mantém o tom solene e direto da oração; “tentavam me amedrontar” comunica claramente a ação continuada e intencional.
