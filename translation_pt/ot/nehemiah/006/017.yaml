base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/017.yaml
  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: pt
  text: Além disso, naqueles dias, os nobres de Judá enviavam muitas cartas a Tobias, e as de Tobias chegavam a eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “as cartas deles iam a Tobias, e as que pertenciam a Tobias vinham a eles”. Na segunda oração, “cartas” fica subentendido pelo paralelismo com a primeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Além disso
  rationale: Preserva a força aditiva que liga esta circunstância à narrativa anterior, em português natural.
- source_word: בַּיָּמִים הָהֵם
  choice: naqueles dias
  rationale: Expressão temporal direta e tradicional, clara para leitores modernos.
- source_word: מַרְבִּים
  choice: enviavam muitas
  rationale: No contexto das cartas e com a construção participial, expressa ação repetida ou contínua, em vez de simplesmente afirmar que elas eram numerosas.
- source_word: חֹרֵי יְהוּדָה
  choice: os nobres de Judá
  rationale: Designa membros social e politicamente destacados da comunidade judaíta; «nobres» preserva essa dimensão.
- source_word: אִגְּרֹתֵיהֶם
  choice: cartas
  rationale: Termo corrente para correspondência escrita; o sujeito da oração já torna natural não explicitar o possessivo na primeira ocorrência.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: enviavam ... a Tobias
  rationale: A expressão literalmente descreve as cartas como indo até Tobias; a formulação portuguesa comunica naturalmente o envio e seu destinatário.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: as de Tobias
  rationale: Mantém a elipse do hebraico, retomando «cartas» pelo paralelismo, sem determinar além do necessário se eram escritas pessoalmente por Tobias ou apenas procediam dele.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: chegavam a eles
  rationale: O particípio indica correspondência recorrente; «chegavam» exprime com naturalidade a recepção das cartas.
