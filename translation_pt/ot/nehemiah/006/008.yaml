base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: pt
  text: 'Então mandei-lhe dizer: “Essas coisas que você está dizendo não aconteceram, pois é do seu próprio coração que você as inventa.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois você as está fabricando em sua própria mente”.'
    reason: Alternativa lexical para «coração», entendido como centro do pensamento e da intenção, e para o verbo בדא, «fabricar/inventar».
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: Então mandei dizer a ele
  rationale: Expressa de modo natural em português a sequência narrativa e a fórmula hebraica de envio seguida de discurso, sem acrescentar explicitamente ‘mensagem’ ou ‘resposta’.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Essas coisas ... não aconteceram
  rationale: O verbo היה nega aqui a realidade ou ocorrência das alegações; ‘não aconteceram’ é claro e preserva o demonstrativo ‘essas’.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: que você está dizendo
  rationale: A forma participial comunica uma afirmação em curso; a locução progressiva é corrente e inteligível em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da negação de Neemias e mantém o tom direto da refutação.
- source_word: מִלִּבְּךָ
  choice: em seu próprio coração
  rationale: Preserva a imagem antropológica hebraica do coração como centro do pensamento e da intenção, com uma preposição natural em português nesse contexto.
- source_word: בּוֹדָאם
  choice: você as está inventando
  rationale: O verbo בדא indica inventar ou fabricar algo falso; esta formulação é moderna, clara e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção ‘mandei dizer a ele’ evita rigidez excessiva, enquanto ‘em seu próprio coração’ conserva a imagem semítica relevante.
