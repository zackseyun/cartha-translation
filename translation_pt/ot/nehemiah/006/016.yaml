  source_fidelity: A tradução comunica adequadamente a sequência temporal, os dois grupos mencionados, o abatimento deles e o reconhecimento de que a obra foi realizada por Deus. «Perderam muito a confiança em si mesmos» é uma interpretação idiomática defensável de וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם, e a nota preserva a imagem literal. «Pelo nosso Deus» representa de modo apropriado a atribuição da obra a Deus expressa por מֵאֵת אֱלֹהֵינוּ.
