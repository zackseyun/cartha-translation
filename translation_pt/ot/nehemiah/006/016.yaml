source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: pt
  text: Quando todos os nossos inimigos ouviram isso, e todas as nações ao nosso redor viram, eles perderam muito a confiança em si mesmos[a] e reconheceram que essa obra havia sido realizada pelo nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “caíram muito aos seus próprios olhos”. A expressão também pode significar “ficaram muito abatidos em sua própria estima”.
    reason: Preserva a imagem hebraica incomum e registra uma alternativa lexical plausível.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal. Em português atual, «quando» transmite naturalmente a sequência sem o peso desnecessário de «e aconteceu que».
- source_word: שָׁמְעוּ
  choice: ouviram isso
  rationale: O verbo significa «ouvir»; «isso» explicita apenas o objeto já evidente no contexto, isto é, a conclusão da muralha, sem acrescentar informação nova.
- source_word: כָּל אֹיְבֵינוּ
  choice: todos os nossos inimigos
  rationale: Tradução direta e natural da construção com sufixo possessivo.
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido comum do verbo hebraico, indicando que as nações observaram o resultado.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: todas as nações ao nosso redor
  rationale: «Nações» representa גּוֹיִם sem introduzir o sentido teológico posterior de «gentios»; «ao nosso redor» é corrente e claro.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: perderam muito a confiança em si mesmos
  rationale: O hebraísmo significa que ficaram profundamente abatidos ou diminuídos na própria estima. A tradução comunica o sentido idiomático em português, enquanto a nota conserva a imagem literal e sua ambiguidade.
- source_word: וַיֵּדְעוּ
  choice: reconheceram
  rationale: Neste contexto, o conhecimento é uma percepção ou admissão provocada pelo resultado observado; «reconheceram» expressa essa força melhor do que o simples «souberam».
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: pelo nosso Deus
  rationale: A preposição pode indicar origem ou agência. «Pelo nosso Deus» atribui a realização decisivamente a Deus sem especificar o mecanismo.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: essa obra havia sido realizada
  rationale: O passivo e o aspecto concluído são preservados; «obra» é amplo o suficiente para o projeto de reconstrução, e «essa» retoma naturalmente aquilo que os observadores viam.
theological_decisions:
- issue: Agência divina na conclusão da obra
  choice: pelo nosso Deus
  alternative: procedia do nosso Deus / havia sido realizada com a ajuda do nosso Deus
  rationale: O hebraico מֵאֵת atribui a obra a Deus como fonte ou agente. A formulação escolhida preserva essa afirmação teológica sem explicar além do texto como a ação divina ocorreu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, e o difícil hebraísmo foi traduzido idiomaticamente no texto com sua imagem preservada em nota.
