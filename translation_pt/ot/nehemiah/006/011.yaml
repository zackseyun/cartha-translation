  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: pt
  text: 'Mas eu disse: “Acaso um homem como eu fugiria? E quem, sendo como eu, entraria no templo[a] e viveria? Não entrarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “santuário”. Provavelmente não se trata apenas de esconder-se dentro de um edifício, mas de entrar numa área restrita do templo, algo impróprio para Neemias; isso explica a força de “e viveria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Mas eu disse
  rationale: 'O waw faz a narrativa avançar, e “mas” expressa naturalmente o contraste contextual: Neemias rejeita a proposta que acabara de receber.'
- source_word: הָאִישׁ כָּמוֹנִי
  choice: um homem como eu
  rationale: A expressão é genérica e retórica, preservando a referência de Neemias à própria posição e responsabilidade.
- source_word: יִבְרָח
  choice: fugiria
  rationale: O verbo denota fugir ou bater em retirada. O futuro do pretérito comunica em português a força indignada da pergunta retórica.
- source_word: וּמִי כָמוֹנִי אֲשֶׁר יָבוֹא
  choice: E quem, sendo como eu, entraria
  rationale: A formulação mantém o paralelismo e a ênfase em alguém na situação de Neemias, sem transformar a frase numa simples declaração futura.
- source_word: הַהֵיכָל
  choice: o templo
  rationale: Aqui o termo indica o edifício ou recinto do templo. “Templo” é claro e natural; a possibilidade mais específica de “santuário” é registrada em nota.
- source_word: וָחָי
  choice: e viveria
  rationale: Mantém a ligação direta entre entrar e permanecer vivo, sem decidir além do texto se a ameaça seria punição cultual, morte nas mãos dos inimigos ou ambas.
- source_word: לֹא אָבוֹא
  choice: Não entrarei
  rationale: A forma concisa reproduz a decisão firme de Neemias e retoma o verbo de entrada da oração anterior.
theological_decisions:
- issue: Implicação da entrada no templo
  choice: A tradução mantém a entrada no templo como um ato potencialmente fatal e impróprio para Neemias, sem explicar essa implicação no corpo do versículo.
  alternative: Entender a fala apenas como recusa tática de esconder-se dentro do templo, sem implicação cultual.
  rationale: O contexto de Neemias 6:10–13 indica uma tentativa de levá-lo a pecar e desacreditá-lo. A nota sinaliza a provável restrição cultual, mas o texto principal preserva a tensão e não especifica a natureza exata do perigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” reforça a pergunta retórica sem soar excessivamente arcaico; “Não entrarei” conserva a firmeza solene da recusa.
