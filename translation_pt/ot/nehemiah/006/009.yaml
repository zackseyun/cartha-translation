id: NEH.6.9
reference: Nehemiah 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: pt
  text: 'Pois todos eles tentavam nos amedrontar[a], dizendo: “As mãos deles perderão a força para o trabalho, e ele não será concluído”. Mas agora[b], fortalece as minhas mãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procuravam nos intimidar”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é uma breve oração: “Mas agora, fortalece as minhas mãos”. Outra leitura já foi proposta, mas a vocalização hebraica favorece um apelo direto a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים
  choice: tentavam nos amedrontar
  rationale: O particípio no Hifil expressa ação contínua de causar medo; “tentavam amedrontar” comunica o propósito dos adversários de modo natural.
- source_word: אוֹתָנוּ
  choice: nos
  rationale: Mantém a primeira pessoa do plural do texto consonantal hebraico, incluindo Neemias junto à comunidade e aos trabalhadores.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Traduz o infinitivo construto quotativo que introduz o conteúdo atribuído aos adversários.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: As mãos deles perderão a força
  rationale: Preserva a imagem hebraica das mãos que ficam frouxas ou enfraquecidas, indicando perda de vigor e disposição, sem produzir uma expressão pouco natural em português.
- source_word: מִן הַמְּלָאכָה
  choice: para o trabalho
  rationale: No idioma hebraico, as mãos enfraquecem em relação à obra; “perderão a força para o trabalho” expressa naturalmente o afastamento ou a incapacidade pretendida, e מְלָאכָה se refere ao projeto de reconstrução.
- source_word: וְלֹא תֵעָשֶׂה
  choice: e ele não será concluído
  rationale: O Nifal apresenta a obra como aquilo que não se realizará; “será concluído” explicita no português o resultado visado no contexto.
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a transição contrastiva entre o plano dos adversários e a breve oração de Neemias.
- source_word: חַזֵּק אֶת יָדָי
  choice: fortalece as minhas mãos
  rationale: Mantém a metáfora corporal e o contraste deliberado com as mãos dos trabalhadores que os adversários desejavam enfraquecer.
theological_decisions:
- issue: Mudança do relato para uma oração direta
  choice: “Mas agora, fortalece as minhas mãos”, como apelo direto de Neemias a Deus.
  alternative: 'Entender a frase como autoexortação ou declaração: “Agora fortaleci as minhas mãos”.'
  rationale: A vocalização massorética apresenta חַזֵּק como imperativo masculino singular, favorecendo uma breve oração dirigida a Deus e correspondendo ao padrão de orações breves em Neemias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o plural “nos” e a imagem recorrente das mãos, evitando linguagem confessional específica.
