  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: pt
  text: 'Nela estava escrito: “Corre entre as nações o rumor — e Gasmu[a] também o afirma — de que você e os judeus planejam se rebelar. É por isso que você está reconstruindo a muralha e, segundo esses rumores, você se tornará rei deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Gasmu, uma forma do nome Gesém.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Nela estava escrito
  rationale: A construção participial passiva introduz o conteúdo da carta; o imperfeito em português se ajusta ao enquadramento narrativo sem transformar a expressão numa fórmula proverbial.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Corre entre as nações o rumor
  rationale: O nifal de שׁמע descreve algo ouvido ou divulgado. A formulação portuguesa comunica naturalmente a circulação do rumor e preserva o âmbito político e étnico amplo de גּוֹיִם.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: e Gasmu também o afirma
  rationale: Mantém a forma do nome atestada neste versículo e explicita que Gasmu confirma o rumor já mencionado. “Também” representa a força aditiva da conjunção.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: planejam se rebelar
  rationale: חשב seguido de infinitivo expressa aqui intenção ou plano; a escolha é corrente e não intensifica indevidamente a acusação.
- source_word: עַל כֵּן
  choice: É por isso que
  rationale: Apresenta a reconstrução da muralha como consequência ou evidência alegada da suposta rebelião.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: está reconstruindo a muralha
  rationale: Embora בנה signifique literalmente construir, o contexto histórico é o restauro da muralha de Jerusalém; “reconstruindo” expressa esse sentido contextual.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: você se tornará rei deles
  rationale: הוה com לְ pode indicar vir a ser ou tornar-se. O futuro português apresenta o resultado alegado sem tratar Nehemias como rei no momento da carta.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: segundo esses rumores
  rationale: דברים refere-se aqui ao conteúdo das alegações em circulação. “Rumores” é contextual e retoma claramente a denúncia, embora “palavras” seja a correspondência mais literal.
