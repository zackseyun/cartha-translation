  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: pt
  text: 'Então Sambalate enviou seu servo a mim pela quinta vez, da mesma maneira, com uma carta aberta[a] na mão.


    [a] Ou: “uma carta não selada”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma carta não selada”.'
    reason: Alternativa lexical que explicita o provável sentido de uma carta aberta, isto é, não lacrada e passível de ser lida por outros.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa indica aqui a direção e o destinatário do mensageiro.
- source_word: סַנְבַלַּט
  choice: Sambalate
  rationale: Forma tradicional e amplamente reconhecível do nome próprio em português.
- source_word: כַּדָּבָר הַזֶּה
  choice: da mesma maneira
  rationale: A expressão retoma o modo das tentativas anteriores; esta formulação preserva a referência anafórica em português natural.
- source_word: פַּעַם חֲמִישִׁית
  choice: pela quinta vez
  rationale: Expressa de modo idiomático em português a contagem de uma ação repetida.
- source_word: אֶת נַעֲרוֹ
  choice: seu servo
  rationale: Embora נַעַר possa designar um jovem, neste contexto de serviço e envio como mensageiro o papel de servo é o sentido mais provável.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: com uma carta aberta
  rationale: A construção indica que o servo levava consigo uma carta aberta; “aberta” preserva o sentido literal, enquanto a nota registra a explicitação contextual “não selada”.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Mantém a imagem concreta do hebraico, com o possuidor naturalmente recuperado pelo contexto em português.
