  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: pt
  text: Também falavam continuamente diante de mim das boas qualidades de Tobias[a] e transmitiam-lhe as minhas palavras[b]. Tobias enviou cartas para me amedrontar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das boas ações dele”, “dos méritos dele” ou “das coisas boas a respeito dele”. A expressão hebraica é ampla e, neste contexto, indica elogios a Tobias feitos diante de Neemias.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “faziam sair as minhas palavras para ele”; isto é, transmitiam a Tobias o que Neemias dizia.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva do hebraico e liga esta ação às anteriores.
- source_word: טוֹבֹתָיו
  choice: das boas qualidades de Tobias
  rationale: O plural substantivado de טוֹבָה é amplo e pode abranger qualidades, méritos ou boas ações; no contexto, indica elogios feitos a Tobias diante de Neemias.
- source_word: הָיוּ אֹמְרִים
  choice: falavam continuamente
  rationale: A construção היה com particípio expressa ação passada contínua ou repetida.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Tradução direta e natural da expressão hebraica, indicando que os elogios eram feitos na presença de Neemias.
- source_word: וּדְבָרַי
  choice: as minhas palavras
  rationale: Mantém o sentido direto de דְּבָרִים no contexto de declarações transmitidas a Tobias.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: levavam a ele
  rationale: Conserva a imagem hebraica de fazer sair ou levar informação, comunicando aqui o ato contínuo de transmitir a Tobias as palavras de Neemias.
- source_word: אִגְּרוֹת שָׁלַח
  choice: enviava cartas
  rationale: אִגֶּרֶת designa correspondência escrita; a forma verbal, no contexto das ações repetidas, é vertida naturalmente pelo imperfeito português.
- source_word: לְיָרְאֵנִי
  choice: para me amedrontar
  rationale: 'Expressa a finalidade das cartas: causar medo em Neemias, sem acrescentar uma nuance mais específica de coerção.'
