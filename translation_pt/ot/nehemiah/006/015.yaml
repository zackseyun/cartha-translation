  text: וַ/תִּשְׁלַם֙ הַֽ/חוֹמָ֔ה בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לֶ/אֱל֑וּל לַ/חֲמִשִּׁ֥ים וּ/שְׁנַ֖יִם יֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: pt
  text: Assim, a muralha foi concluída no dia vinte e cinco de Elul[a], em cinquenta e dois dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elul é o sexto mês do calendário hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: foi concluída
  rationale: O qal wayyiqtol de שלם, com הַחוֹמָה como sujeito feminino singular, indica que a muralha chegou à conclusão. A formulação passiva é natural em português e preserva o sentido resultativo.
- source_word: הַחוֹמָה
  choice: a muralha
  rationale: O substantivo definido se refere à muralha de Jerusalém. “Muralha” expressa melhor do que “muro” a fortificação urbana no contexto.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: no dia vinte e cinco
  rationale: A preposição com os numerais forma uma expressão de data; em português, a inclusão de “dia” torna a formulação clara e idiomática.
- source_word: לֶאֱלוּל
  choice: de elul
  rationale: Elul é o nome do mês e deve ser transliterado. A construção “dia vinte e cinco de elul” é natural em português.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: em cinquenta e dois dias
  rationale: O לְ introduz a duração total necessária para a conclusão da obra. “Em cinquenta e dois dias” comunica essa duração sem sugerir apenas sequência temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Muralha” mantém o contexto de fortificação urbana; “foi concluída” soa natural e traduz diretamente o aspecto resultativo do verbo. O marcador foi colocado imediatamente após o nome do mês.
