source:
  edition: WLC
  text: כִּי רַבִּ֣ים בִּֽ/יהוּדָ֗ה בַּעֲלֵ֤י שְׁבוּעָה֙ ל֔/וֹ כִּי חָתָ֥ן ה֖וּא לִ/שְׁכַנְיָ֣ה בֶן אָרַ֑ח וִֽ/יהוֹחָנָ֣ן בְּנ֔/וֹ לָקַ֕ח אֶת בַּת מְשֻׁלָּ֖ם בֶּ֥ן בֶּֽרֶכְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: pt
  text: Pois muitos em Judá estavam ligados a ele por juramento[a], porque ele era genro de Secanias, filho de Ara, e Joanã, seu filho, havia tomado por esposa a filha de Mesulão, filho de Berequias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “eram possuidores de um juramento para com ele”, isto é, estavam obrigados a ele por juramento.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente que Joanã “tomou a filha de Mesulão”; trata-se de uma expressão comum para casar-se com ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: muitos em Judá
  rationale: A preposição בְּ tem sentido locativo neste contexto, referindo-se a muitas pessoas que viviam na comunidade ou província de Judá.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: estavam ligados a ele por juramento
  rationale: A expressão significa literalmente “possuidores de um juramento para com ele” e descreve pessoas obrigadas a alguém por juramento. A formulação escolhida preserva tanto o vínculo pessoal quanto sua natureza solene.
- source_word: כִּי ... כִּי
  choice: Pois ... porque
  rationale: O primeiro כִּי introduz a explicação do versículo anterior; o segundo apresenta a causa da lealdade juramentada.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: ele era genro de Secanias
  rationale: Em contexto de parentesco, חָתָן designa normalmente um genro ou alguém ligado por casamento; “genro” é a leitura mais direta aqui.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: e seu filho Joanã
  rationale: A tradução conserva o pronome do hebraico sem inserir explicitamente um antecedente que o texto não repete. No contexto, a referência natural é ao filho do personagem principal mencionado no período.
- source_word: לָקַח אֶת בַּת
  choice: havia tomado por esposa a filha
  rationale: “Tomar a filha” é um modo hebraico convencional de dizer que alguém se casou com ela. A expressão portuguesa explicita o sentido matrimonial e ainda mantém a forma do idioma de origem.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: a filha de Mesulão, filho de Berequias
  rationale: A formulação reproduz com clareza a cadeia patronímica do hebraico.
theological_decisions:
- issue: Identidade do antecedente em בְּנוֹ (“seu filho”)
  choice: Manter “seu filho”, sem substituir o pronome por um nome
  alternative: “o filho dele” ou “o filho de Tobias”
  rationale: O hebraico usa um pronome possessivo. Embora o contexto favoreça a referência ao personagem principal, explicitar o nome eliminaria uma característica formal e uma possível ambiguidade do texto.
- issue: Natureza do vínculo expresso por חָתָן
  choice: Traduzir como “genro”
  alternative: “parente por casamento”
  rationale: “Genro” é o sentido de parentesco mais provável e concreto no contexto, sem acrescentar uma interpretação teológica ou denominacional.
translation_notes:
  register: 'Português atual, claro e digno, com formas onomásticas tradicionais e amplamente reconhecíveis: Secanias, Ará, Joanã, Mesulão e Berequias. A sintaxe mantém a sequência explicativa do hebraico sem soar excessivamente literal.'
