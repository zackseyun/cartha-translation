  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: pt
  text: Quando Sambalate, Tobias, Gesém, o árabe[b], e o restante de nossos inimigos souberam que eu tinha reconstruído[a] a muralha e que nela não restava nenhuma brecha — embora, até aquele momento, eu ainda não tivesse instalado as portas nos portões —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construído”. O verbo hebraico significa simplesmente “construir”; “reconstruído” é usado no texto porque o contexto trata da restauração de uma muralha já existente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Gesém, o arábio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Quando
  rationale: Introduz o novo desenvolvimento narrativo de modo natural, sem acrescentar um advérbio temporal que não está explícito no hebraico.
- source_word: נִשְׁמַע
  choice: souberam
  rationale: O nifal indica que a notícia chegou às pessoas mencionadas; em português, “souberam” expressa isso naturalmente, sem a construção passiva pouco idiomática “foi ouvido por”.
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: Sambalate, Tobias, Gesém, o árabe
  rationale: Emprega formas portuguesas reconhecíveis dos nomes. הָעַרְבִי é uma designação étnica, traduzida diretamente por “o árabe”.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: os demais inimigos nossos
  rationale: Preserva tanto a ideia do restante do grupo quanto a primeira pessoa plural de “nossos inimigos”.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da notícia recebida, e não uma relação causal.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: eu tinha reconstruído a muralha
  rationale: Embora o verbo hebraico signifique literalmente “construir”, o contexto é a restauração da muralha já existente de Jerusalém. O mais-que-perfeito composto esclarece que a obra precedeu a notícia.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: nela não restava nenhuma brecha
  rationale: “Brecha” é o termo natural para uma abertura numa fortificação, e a formulação mantém o foco na ausência de qualquer ruptura restante.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: embora, até aquele momento, ... ainda
  rationale: A construção funciona concessivamente, introduzindo a ressalva de que uma etapa do trabalho permanecia inacabada.
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: eu ainda não tivesse instalado as portas nos portões
  rationale: Distingue as portas móveis das estruturas dos portões. “Instalado” comunica com clareza o sentido causativo de colocá-las em posição, sem especificar indevidamente o método.
