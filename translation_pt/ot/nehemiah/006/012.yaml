base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: pt
  text: Então percebi que Deus não o havia enviado; ao contrário, ele tinha pronunciado aquela profecia contra mim porque Tobias e Sambalate o haviam contratado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: Então percebi
  rationale: O verbo נכר no hifil expressa reconhecer ou discernir; “percebi” comunica naturalmente a tomada de consciência no contexto.
- source_word: וְהִנֵּה
  choice: que
  rationale: A partícula introduz aquilo que Neemias constatou. Em português corrente, a construção completiva com “que” transmite a função discursiva sem o artificial “e eis que”.
- source_word: הַנְּבוּאָה
  choice: aquela profecia
  rationale: O substantivo definido se refere à declaração profética feita contra Neemias; “aquela” torna clara essa referência no português.
- source_word: שְׂכָרוֹ
  choice: o haviam contratado
  rationale: שׂכר significa contratar mediante pagamento; o mais-que-perfeito composto indica naturalmente que a contratação precedeu a percepção de Neemias.
theological_decisions:
- issue: Origem divina alegada da profecia
  choice: Deus não o havia enviado; ao contrário, ele tinha pronunciado aquela profecia contra mim
  alternative: Deus não o havia enviado, mas ele profetizou contra mim
  rationale: A tradução preserva o contraste explícito entre o não envio por Deus e a declaração profética hostil, sem afirmar que a profecia falsa tivesse origem divina.
- issue: Agentes da contratação
  choice: porque Tobias e Sambalate o haviam contratado
  alternative: e Tobias e Sambalate o haviam contratado
  rationale: 'כִּי é entendido causalmente: a contratação explica por que o homem pronunciou a profecia contra Neemias.'
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios nas formas portuguesas tradicionais. A ordem foi levemente naturalizada, preservando o contraste e a relação causal do hebraico.
