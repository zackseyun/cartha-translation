  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: pt
  text: Ele fora contratado[a] para que eu ficasse com medo, agisse assim e pecasse, e para que isso lhes servisse de base para me difamar[b], a fim de que me insultassem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele fora pago para isso” ou “Ele fora subornado para isso”. O termo hebraico significa mais diretamente “contratado” ou “pago”; “subornado” torna explícita a intenção corrupta sugerida pelo contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e isso lhes seria por mau nome”. A expressão provavelmente indica que o pecado de Neemias daria aos inimigos material para difamá-lo ou manchar sua reputação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂכוּר הוּא
  choice: Ele havia sido contratado
  rationale: Mantém o sentido direto do particípio passivo, “contratado” ou “pago”, e conserva a ênfase do pronome hebraico sem explicitar demais a ideia contextual de suborno.
- source_word: לְמַעַן
  choice: para que / assim / e poderiam
  rationale: As três ocorrências introduzem propósito ou resultado. A variação em português evita repetição pesada, preservando a progressão intencional do plano.
- source_word: אִירָא
  choice: eu ficasse com medo
  rationale: Expressa o resultado pretendido sobre Neemias, de modo mais natural que uma reprodução estritamente formal do imperfeito hebraico.
- source_word: וְאֶעֱשֶׂה כֵן
  choice: agisse daquela maneira
  rationale: Traduz naturalmente o idiomatismo “fizesse assim” e remete à conduta proposta no contexto anterior.
- source_word: וְחָטָאתִי
  choice: e pecasse
  rationale: Representa o pecado como consequência pretendida da ação, sem especificar além do que o texto afirma.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: eles teriam motivo para me dar má fama
  rationale: 'Comunica a função da expressão idiomática, literalmente “isso lhes seria por mau nome”: o ato de Neemias forneceria material para manchar sua reputação.'
- source_word: יְחָרְפוּנִי
  choice: poderiam me insultar
  rationale: חרף abrange insultar, afrontar e difamar. “Insultar” é corrente, forte e compreensível, preservando o ataque público implicado.
