  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: pt
  text: 'Então enviei-lhes mensageiros, dizendo: “Estou realizando uma grande obra e não posso descer. Por que a obra haveria de parar enquanto eu a deixasse[a] e descesse até vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a interrompesse” ou “a abandonasse”.'
    reason: A forma de רפה pode significar deixar, largar ou interromper a obra; a tradução principal preserva essa amplitude sem determinar se o afastamento seria definitivo.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Então enviei
  rationale: O wayyiqtol dá continuidade à narrativa. “Então enviei” preserva a progressão sequencial de modo natural em português.
- source_word: עֲלֵיהֶם
  choice: enviei-lhes
  rationale: Com שׁלח e “mensageiros”, a preposição indica direção aos destinatários; a construção com pronome oblíquo é concisa e natural.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto político e narrativo, refere-se a agentes humanos que levam uma mensagem, não a seres celestiais.
- source_word: לֵאמֹר
  choice: com esta resposta
  rationale: O infinitivo introduz o conteúdo da mensagem. Como se trata da resposta de Neemias a um convite anterior, esta formulação comunica naturalmente a função discursiva.
- source_word: מְלָאכָה גְדוֹלָה
  choice: uma grande obra
  rationale: Preserva tanto o sentido de trabalho ou empreendimento quanto a ênfase na magnitude e importância da reconstrução.
- source_word: אֲנִי עֹשֶׂה
  choice: Estou realizando
  rationale: O pronome com particípio expressa uma atividade em andamento; “realizando” é corrente e digno em português.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: e não posso descer
  rationale: Mantém o sentido espacial literal de ירד, coerente com a saída de Jerusalém para um local mais baixo.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Por que a obra haveria de parar
  rationale: שׁבת significa aqui cessar ou parar. “Haveria de” transmite o caráter retórico da pergunta sem sugerir observância sabática.
- source_word: כַּאֲשֶׁר
  choice: enquanto
  rationale: Expressa adequadamente a circunstância temporal em que a obra seria interrompida pela ausência de Neemias.
- source_word: אַרְפֶּהָ
  choice: eu a deixasse de lado
  rationale: O hifil de רפה, com sufixo feminino referente a “obra”, comunica soltar, deixar ou suspender o trabalho; a formulação preserva a ideia de afastamento temporário.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: e descesse até vocês
  rationale: Repete o movimento descendente indicado por ירד e usa “vocês” para uma leitura ampla e natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém a repetição do movimento de “descer” e a força retórica da pergunta, sem ampliar o texto com interpretações teológicas.
