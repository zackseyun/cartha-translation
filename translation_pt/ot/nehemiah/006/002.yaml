base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: pt
  text: 'Então Sambalate e Gesém mandaram dizer-me: “Venha, e vamos nos encontrar nas aldeias[a] da planície de Ono[b]”. Mas eles planejavam fazer-me mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em Quefirim”, entendendo o hebraico como nome de lugar, e não como “aldeias”.
    reason: alternative_reading
  - marker: b
    text: “Planície” também pode ser traduzido por “vale”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח סַנְבַלַּט וְגֶשֶׁם אֵלַי לֵאמֹר
  choice: Sambalate e Gesém mandaram dizer-me
  rationale: A construção portuguesa expressa naturalmente o envio de uma mensagem introduzida por discurso direto. O verbo hebraico no singular com sujeito composto é idiomático; em português, a concordância fica no plural.
- source_word: לְכָה
  choice: Venha
  rationale: Embora o verbo possa ter o sentido básico de ir ou andar, aqui funciona como convite e é traduzido naturalmente por “Venha”.
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: vamos nos encontrar
  rationale: O nifal de יעד indica combinar ou realizar um encontro. A forma inclusiva em português comunica o convite recíproco sem redundância artificial.
- source_word: בַּכְּפִירִים
  choice: em uma das aldeias
  rationale: O plural hebraico é geralmente entendido como substantivo comum, “aldeias” ou “povoados”. Em português, “em uma das aldeias” torna explícito o sentido distributivo provável no contexto do encontro, sem identificar qual delas.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: da planície de Ono
  rationale: בִּקְעָה designa uma depressão ampla, vale ou planície. “Planície” é claro e topograficamente adequado; “vale” permanece como alternativa em nota.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Mas eles planejavam
  rationale: A conjunção tem força adversativa em relação ao convite, e o particípio חֹשְׁבִים neste contexto indica intenção ou trama, não simples pensamento.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: fazer-me mal
  rationale: A expressão portuguesa é natural e preserva a intenção hostil sem especificar indevidamente a forma do dano.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais tradicionais de ampla legibilidade. A colocação pronominal em “mandaram dizer-me” e “fazer-me” mantém um registro bíblico moderadamente formal, enquanto “vamos nos encontrar” soa natural ao leitor brasileiro.
