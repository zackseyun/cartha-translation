  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: pt
  text: 'Então fui à casa de Semaías, filho de Delaías, filho de Meetabel. Ele estava confinado e me disse: “Vamos nos encontrar na casa de Deus, dentro do templo[a], e fechar as portas do templo, pois estão vindo para matar você. Sim, à noite estão vindo para matar você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentro do santuário”. O termo hebraico hêkhal pode referir-se especificamente ao edifício do templo, ou santuário, e não apenas ao conjunto mais amplo de suas dependências.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Então fui
  rationale: Expressa a continuação e a sequência narrativa de modo natural em português; בוא pode ser traduzido por ‘ir’ conforme o ponto de vista do narrador.
- source_word: בֵּית שְׁמַעְיָה
  choice: à casa de Semaías
  rationale: O estado construto com nome pessoal indica a residência de Semaías; ‘casa’ mantém a forma concreta e o registro digno.
- source_word: שְׁמַעְיָה ... דְּלָיָה ... מְהֵיטַבְאֵל
  choice: Semaías, filho de Delaías, filho de Meetabel
  rationale: Translitera os nomes em formas portuguesas reconhecíveis e reproduz diretamente a genealogia.
- source_word: וְהוּא עָצוּר
  choice: Ele estava confinado
  rationale: Preserva a ambiguidade de עָצוּר, que pode indicar reclusão, restrição ou impedimento, sem definir sua causa.
- source_word: נִוָּעֵד
  choice: Vamos nos encontrar
  rationale: Reproduz de maneira idiomática a proposta expressa pela forma verbal, sem acrescentar a ideia de um compromisso formal.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica usual para o complexo do templo e prepara a referência mais específica que vem em seguida.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: dentro do templo
  rationale: Comunica a entrada no edifício sagrado de forma clara, deixando em nota a alternativa mais específica ‘santuário’.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: e fechar as portas do templo
  rationale: Mantém a continuação da proposta e a imagem concreta das portas sendo fechadas.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: pois estão vindo para matar você
  rationale: O particípio plural tem sujeito indefinido, naturalmente implícito em português; a finalidade é preservada diretamente.
- source_word: וְלַיְלָה
  choice: Sim, à noite
  rationale: ‘À noite’ traduz o tempo sem especificar indevidamente ‘esta noite’; ‘Sim’ transmite a intensificação da repetição.
- source_word: בָּאִים לְהָרְגֶךָ
  choice: estão vindo para matar você
  rationale: Conserva a repetição hebraica, que reforça a urgência da advertência.
theological_decisions:
- issue: Sentido de הֵיכָל no contexto de acesso a espaço sagrado restrito
  choice: templo
  alternative: santuário
  rationale: O contexto posterior sugere a entrada em uma área sagrada de acesso restrito, mas הֵיכָל pode designar o edifício do templo ou, mais especificamente, o santuário. O texto principal favorece a leitura corrente, e a nota preserva a alternativa teologicamente relevante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A repetição final foi mantida para preservar a urgência do hebraico, e ‘confinado’ evita definir a natureza da reclusão de Semaías.
