base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: pt
  text: Durante quarenta anos, tu os sustentaste no deserto; nada lhes faltou. Suas roupas não se gastaram, e seus pés não incharam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficaram inchados”. Compare Deuteronômio 8:4.'
    reason: Alternativa de formulação para בָצֵקוּ e referência ao texto paralelo.
lexical_decisions:
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Durante quarenta anos
  rationale: Expressa com naturalidade a duração indicada pelo hebraico; a conjunção inicial funciona como continuidade narrativa e não precisa ser reproduzida por um “e” explícito.
- source_word: כִּלְכַּלְתָּם
  choice: tu os sustentaste
  rationale: O verbo כלכל neste tronco comunica sustento e provisão contínuos, sem limitar o sentido apenas à alimentação.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa a região árida e erma da peregrinação de Israel; “deserto” é claro e corrente em português.
- source_word: לֹא חָסֵרוּ
  choice: nada lhes faltou
  rationale: Formulação idiomática que conserva a negação absoluta e a ideia de provisão completa.
- source_word: שַׂלְמֹתֵיהֶם
  choice: suas roupas
  rationale: שַׂלְמָה refere-se a peças de vestuário; “roupas” é atual, abrangente e facilmente compreensível.
- source_word: לֹא בָלוּ
  choice: não se gastaram
  rationale: בלה descreve deterioração pelo uso; “não se gastaram” é a expressão portuguesa natural para roupas que não ficaram inutilizadas.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: e seus pés não incharam
  rationale: בצק, neste contexto, indica inchar ou ficar intumescido; a tradução é direta e preserva a imagem física.
