  text: וּ/בְ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/חֹ֣דֶשׁ הַ/זֶּ֗ה נֶאֶסְפ֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/צ֣וֹם וּ/בְ/שַׂקִּ֔ים וַ/אֲדָמָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: pt
  text: No vigésimo quarto dia deste mês, os israelitas[a] se reuniram em jejum, vestidos de pano de saco e com terra sobre si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Israel”; também se pode traduzir por “os descendentes de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “terra sobre eles”; colocar terra ou pó sobre si era um sinal de luto e arrependimento.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: No vigésimo quarto dia
  rationale: A fórmula hebraica de data usa números cardinais, mas o português expressa naturalmente a data com ordinal. O ו inicial dá continuidade à narrativa e não exige um marcador explícito como “então”.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: deste mês
  rationale: Na fórmula de data, identifica o mês em questão; “deste mês” é a forma corrente e precisa em português.
- source_word: נֶאֶסְפוּ
  choice: se reuniram
  rationale: O nifal pode ter sentido passivo ou reflexivo. “Se reuniram” comunica naturalmente que vieram a formar uma assembleia sem introduzir um agente externo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: É o equivalente português mais natural para o nome coletivo, enquanto a nota preserva a expressão familiar literalmente presente no hebraico.
- source_word: בְּצוֹם
  choice: em jejum
  rationale: A preposição indica uma circunstância concomitante; “em jejum” é a expressão idiomática portuguesa para essa prática penitencial.
- source_word: וּבְשַׂקִּים
  choice: vestidos de pano de saco
  rationale: O plural hebraico designa as vestes ásperas usadas como sinal de luto e arrependimento. A explicitação “vestidos de” torna a imagem clara sem alterar seu sentido.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: e com terra sobre si
  rationale: אֲדָמָה significa “terra” ou “solo”. A tradução mantém a imagem concreta e não acrescenta “sobre a cabeça”, detalhe que o hebraico não especifica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Os marcadores foram colocados junto às expressões que as notas explicam. A formulação preserva o caráter coletivo e penitencial da cena sem especificar que a terra estava sobre a cabeça.
