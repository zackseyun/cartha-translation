reference: Nehemiah 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: pt
  text: Tu és Yahweh, o Deus[a], que escolheste Abrão, o tiraste de Ur dos caldeus e lhe deste o nome de Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: «Yahweh Deus». O hebraico traz o nome divino YHWH.'
    reason: Registra a alternativa sintática natural e esclarece que «Yahweh» representa o tetragrama.
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Tu és
  rationale: A construção com dois pronomes é enfática e identifica diretamente Deus; «Tu és» comunica isso com naturalidade e dignidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים
  choice: o Deus
  rationale: O artigo hebraico favorece «o Deus»; junto a «Yahweh», a expressão identifica Yahweh como o Deus em questão e preserva a forma marcada do original.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: escolheste Abrão
  rationale: O verbo significa «escolher»; a preposição hebraica introduz o objeto, que em português é expresso naturalmente sem preposição.
- source_word: וְהוֹצֵאתוֹ
  choice: o tiraste
  rationale: O hifil de יצא significa fazer sair ou tirar; a formulação é concisa, natural e mantém a ação divina.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: de Ur dos caldeus
  rationale: Forma geográfica tradicional e clara em português moderno.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: lhe deste o nome de Abraão
  rationale: Embora literalmente seja «puseste seu nome», esta é a expressão idiomática portuguesa para a mudança de nome e preserva o contraste entre Abrão e Abraão.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional «Jeová».
- issue: Relação entre Yahweh e הָאֱלֹהִים
  choice: Yahweh, o Deus
  alternative: Yahweh Deus
  rationale: A manutenção do artigo em «o Deus» reflete הָאֱלֹהִים e preserva a identificação enfática, embora «Yahweh Deus» seja mais fluente e também possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com uso de «tu» coerente com as formas verbais de segunda pessoa do hebraico. Mantêm-se os nomes Abrão e Abraão para evidenciar a mudança de nome.
