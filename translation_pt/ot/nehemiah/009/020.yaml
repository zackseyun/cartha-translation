base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: pt
  text: Deste o teu bom Espírito para lhes dar entendimento[a]; não privaste a boca deles do teu maná e lhes deste água para matar a sede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu bom espírito”. A palavra hebraica רוּחַ pode ser traduzida de ambas as formas; aqui, provavelmente se refere ao Espírito de Deus, dado para orientar e ensinar Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: o teu bom Espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. Neste contexto de orientação e ensino concedidos por Deus, a referência mais provável é ao Espírito de Deus; o adjetivo 'bom' foi preservado.
- source_word: לְהַשְׂכִּילָם
  choice: para lhes dar entendimento
  rationale: O hifil de שׂכל exprime fazer compreender, dar discernimento ou instruir. A formulação preserva o sentido causativo e soa natural em português.
- source_word: מַנְךָ
  choice: o teu maná
  rationale: O substantivo designa especificamente o alimento providenciado durante a peregrinação no deserto; 'maná' é o equivalente tradicional e claro.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: não retiraste da boca deles
  rationale: מנע significa impedir, reter ou privar. A expressão concreta 'da boca deles' foi mantida; 'retiraste' comunica de modo natural que Deus não os privou do alimento.
- source_word: מַיִם
  choice: água
  rationale: Equivalente lexical direto.
- source_word: לִצְמָאָם
  choice: para matar a sede
  rationale: A expressão portuguesa comunica naturalmente que a água foi dada para atender à sede deles, sem alterar o sentido da construção hebraica.
theological_decisions:
- issue: Se רוּחֲךָ הַטּוֹבָה deve ser entendido como referência ao Espírito de Deus
  choice: o teu bom Espírito
  alternative: o teu bom espírito
  rationale: O contexto descreve a presença divina que orienta e ensina Israel, favorecendo a referência ao Espírito de Deus. Como a capitalização é uma convenção interpretativa ausente no hebraico, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção concreta 'da boca deles' preserva a vivacidade do hebraico; 'matar a sede' evita uma formulação artificial em português.
