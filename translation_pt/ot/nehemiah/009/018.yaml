source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: pt
  text: 'Mesmo quando fizeram para si um bezerro de metal fundido e disseram: “Este é o seu deus, que o tirou do Egito”, e cometeram grandes blasfêmias[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandes provocações” ou “grandes atos de desprezo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Mesmo quando
  rationale: 'Introduz naturalmente a concessão no contexto da oração: a misericórdia divina persistiu mesmo diante dessa rebelião.'
- source_word: עָשׂוּ לָהֶם
  choice: fizeram para si
  rationale: Preserva a nuance reflexiva do hebraico, indicando que produziram a imagem para uso e culto próprios.
- source_word: עֵגֶל מַסֵּכָה
  choice: um bezerro de metal fundido
  rationale: Expressa de modo claro e atual que se tratava de uma imagem metálica moldada por fundição.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Este é o seu deus
  rationale: Mantém o demonstrativo e o referente no singular conforme a forma hebraica imediata; a inicial minúscula assinala o referente idolátrico sem alterar a alegação citada.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: que o tirou do Egito
  rationale: Reproduz em português natural a fórmula do êxodo; o pronome singular corresponde ao sufixo hebraico singular.
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: e cometeram grandes blasfêmias
  rationale: “Cometer” combina naturalmente com o substantivo, e “blasfêmias” comunica os graves atos de desprezo dirigidos contra Deus.
theological_decisions:
- issue: Referência idolátrica de אֱלֹהֶיךָ
  choice: seu deus
  alternative: seu Deus; seus deuses
  rationale: A imagem do bezerro é o referente da declaração. A minúscula evita legitimar o ídolo, enquanto o singular acompanha זֶה e o sufixo singular do texto hebraico.
- issue: Amplitude semântica de נֶאָצוֹת
  choice: blasfêmias
  alternative: provocações; atos de desprezo
  rationale: No episódio, as palavras e ações constituem afrontas contra Deus. “Blasfêmias” destaca essa direção teológica, sem esconder em nota a possibilidade de um sentido mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Mesmo quando” preserva a força concessiva; “metal fundido” evita o arcaísmo de “bezerro de fundição”. A frase termina com vírgula porque o versículo integra uma construção que prossegue no contexto imediato.
