source:
  edition: WLC
  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: pt
  text: Tu dividiste o mar diante deles[a], e eles passaram pelo meio do mar em terra seca; e lançaste os seus perseguidores nas profundezas[b], como uma pedra em águas poderosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fendeste o mar diante deles”.'
    reason: Alternativa lexical que ressalta o sentido concreto de partir ou abrir expresso por בקע.
  - marker: b
    text: 'Ou: “nos abismos do mar”.'
    reason: Alternativa contextual para מְצוֹלוֹת, que designa as profundezas das águas.
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: dividiste
  rationale: O verbo בקע descreve partir ou abrir algo. “Dividiste” comunica com clareza a abertura do mar, sem perder a ação concreta do hebraico.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Expressão natural em português para o sentido espacial de לִפְנֵיהֶם, adequada ao registro de oração narrativa.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: e eles passaram pelo meio do mar
  rationale: Preserva tanto a ação de atravessar/passar quanto a imagem concreta do interior ou meio do mar.
- source_word: בַּיַּבָּשָׁה
  choice: em terra seca
  rationale: Forma corrente e clara que destaca a condição milagrosa do caminho pelo leito do mar.
- source_word: רֹדְפֵיהֶם
  choice: os seus perseguidores
  rationale: O particípio de רדף designa aqueles que os perseguiam; “perseguidores” é direto e contextualmente preciso.
- source_word: הִשְׁלַכְתָּ
  choice: lançaste
  rationale: Expressa a ação causativa e vigorosa do verbo sem a intensificar além do texto.
- source_word: בִמְצוֹלֹת
  choice: nas profundezas
  rationale: מְצוֹלוֹת refere-se às regiões profundas, especialmente do mar. “Nas profundezas” conserva a imagem e soa natural.
- source_word: כְּמוֹ אֶבֶן
  choice: como uma pedra
  rationale: Reproduz de modo simples e exato a comparação do hebraico.
- source_word: בְּמַיִם עַזִּים
  choice: em águas poderosas
  rationale: Mantém a preposição ב e o sentido básico de força de עַזִּים, com tom elevado, sem especificar indevidamente que as águas estavam revoltas.
theological_decisions:
- issue: Ação divina na recordação do êxodo
  choice: 'Manter a segunda pessoa direta: “Tu dividiste” e “lançaste”.'
  alternative: Construções impessoais ou paráfrases que deixem implícito o agente.
  rationale: O versículo integra uma oração comunitária que confessa diretamente os atos salvíficos de Deus. A segunda pessoa preserva a força teológica e retórica do original.
translation_notes:
  register: Português moderno, claro e digno, com cadência apropriada a uma oração comunitária. Conserva o paralelismo das ações divinas e a imagem concreta da travessia, evitando vocabulário excessivamente arcaico.
