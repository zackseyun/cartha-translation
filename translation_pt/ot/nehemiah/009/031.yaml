  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: pt
  text: Mas, em tua grande misericórdia, não acabaste com eles nem os abandonaste[a], pois tu és um Deus bondoso e compassivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não os destruíste completamente nem os desamparaste”.'
    reason: Alternativa lexical para o idioma עשה כלה e para עזב.
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Mas, por causa da tua grande compaixão
  rationale: O waw tem valor adversativo no contexto. רַחֲמִים, embora formalmente plural, é expresso de modo natural em português pelo coletivo singular “compaixão”; הָרַבִּים intensifica sua grandeza, e בְּ indica a base ou motivo da ação divina.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: não acabaste com eles
  rationale: A expressão עשה כלה significa levar ao fim, eliminar ou destruir por completo. “Acabar com eles” conserva a força idiomática e a possível ideia de aniquilação sem especificar seu modo.
- source_word: וְלֹא עֲזַבְתָּם
  choice: nem os abandonaste
  rationale: עזב pode significar deixar, desamparar ou abandonar. “Abandonaste” é claro, atual e adequado ao paralelismo negativo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da preservação do povo; “pois” reproduz com naturalidade essa relação explicativa.
- source_word: אֵל
  choice: Deus
  rationale: Aqui אֵל funciona como designação comum de Deus; não é necessário acrescentar uma ideia específica de poder.
- source_word: חַנּוּן
  choice: bondoso
  rationale: חַנּוּן descreve quem concede favor e graça. “Bondoso” comunica essa disposição em português corrente e evita a possível leitura estritamente técnica de “cheio de graça”.
- source_word: וְרַחוּם
  choice: e compassivo
  rationale: רַחוּם denota profunda compaixão. “Compassivo” preserva a distinção em relação a חַנּוּן e corresponde à fórmula tradicional sobre o caráter divino.
- source_word: אָתָּה
  choice: tu és
  rationale: O pronome independente dá certa ênfase ao sujeito; em português, “tu és” conserva essa forma direta e concorda com o tratamento empregado no versículo.
theological_decisions:
- issue: Fórmula do caráter divino חַנּוּן וְרַחוּם
  choice: bondoso e compassivo
  alternative: misericordioso e compassivo; cheio de graça e misericordioso
  rationale: A tradução mantém distintos os dois atributos sem lhes impor uma formulação doutrinária técnica. “Bondoso” aponta para a disposição de conceder favor, enquanto “compassivo” expressa profunda misericórdia.
- issue: Valor do waw inicial
  choice: 'adversativo: “Mas”'
  alternative: 'conectivo: “E”'
  rationale: No fluxo da oração, a misericórdia de Deus contrasta com a rebeldia anteriormente relatada. “Mas” explicita essa função discursiva permitida pela conjunção hebraica.
- issue: Alcance de עשה כלה
  choice: “não acabaste com eles”
  alternative: “não os destruíste completamente”
  rationale: A formulação principal preserva a amplitude do idioma hebraico, que pode indicar dar fim, consumir ou aniquilar. A nota registra a leitura destrutiva mais explícita sem restringir indevidamente o texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento divino na segunda pessoa do singular. A redação favorece naturalidade brasileira sem recorrer a regionalismos; a vírgula antes da nota encerra o par de ações antes da cláusula explicativa.
