  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: pt
  text: Então tu os entregaste nas mãos de seus adversários, que os oprimiram. No tempo de sua aflição, eles clamavam a ti, e tu os ouvias desde os céus; segundo tuas muitas misericórdias, tu lhes davas libertadores[a], que os salvavam das mãos de seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salvadores”. A palavra hebraica vem do verbo “salvar” e, aqui, refere-se aos agentes humanos que Deus levantou para resgatar o povo.
    reason: Alternativa lexical que preserva a ligação explícita entre מֹשִׁיעִים e a raiz hebraica “salvar”, esclarecendo ao mesmo tempo que se trata de instrumentos humanos.
lexical_decisions:
- source_word: וַתִּתְּנֵם
  choice: tu os entregaste
  rationale: Neste contexto, נתן indica entregar alguém ao poder de outro. “Entregaste” comunica isso de modo natural e mantém a imagem das mãos que vem em seguida.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Preserva a imagem hebraica de domínio e poder, que é clara e corrente em português.
- source_word: צָרֵיהֶם
  choice: seus adversários
  rationale: צר designa oponentes hostis. “Adversários” preserva a distinção em relação ao verbo seguinte, que descreve a opressão.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: que os oprimiram
  rationale: O verbo expressa pressionar, afligir ou causar angústia; “oprimiram” é idiomático no contexto de subjugação.
- source_word: וּבְעֵת צָרָתָם
  choice: No tempo de sua aflição
  rationale: Traduz diretamente a expressão temporal e comunica uma situação de grave sofrimento.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: eles clamavam a ti
  rationale: O verbo indica um clamor urgente em meio à aflição. O imperfeito português expressa a recorrência sugerida pelo yiqtol nesta recapitulação histórica.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: tu os ouvias desde os céus
  rationale: Mantém o ponto de origem expresso por מן e, com o imperfeito, preserva o padrão reiterado de clamor e resposta.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: segundo tuas muitas misericórdias
  rationale: Preserva o plural de רחמים e o sentido de abundância de הָרַבִּים, mantendo a linguagem relacional e pactual.
- source_word: מֹשִׁיעִים
  choice: libertadores
  rationale: O particípio substantivado de ישׁע refere-se aqui a agentes humanos levantados por Deus para resgatar o povo. “Libertadores” comunica sua função sem identificá-los indevidamente com o Salvador divino.
- source_word: וְיוֹשִׁיעוּם
  choice: que os salvavam
  rationale: A oração relativa liga naturalmente a ação aos libertadores e preserva a repetição da raiz ישׁע por meio do verbo “salvar”.
- source_word: מִיַּד צָרֵיהֶם
  choice: das mãos de seus adversários
  rationale: Repete de modo consistente a imagem de poder e a designação dos oponentes presentes no início do versículo.
theological_decisions:
- issue: Designação dos agentes humanos chamados מֹשִׁיעִים
  choice: libertadores
  alternative: salvadores
  rationale: O termo deriva do verbo “salvar”, mas neste contexto designa seres humanos por meio dos quais Deus resgata o povo. “Libertadores” evita confusão desnecessária com a salvação divina, enquanto a nota registra a alternativa lexical legítima.
- issue: Valor aspectual dos verbos יִצְעֲקוּ, תִּשְׁמָע, תִּתֵּן e וְיוֹשִׁיעוּם
  choice: clamavam, ouvias, davas e salvavam
  alternative: clamaram, ouviste, deste e salvaram
  rationale: 'Na recapitulação da época dos juízes, as formas yiqtol apresentam um padrão reiterado: o povo clamava, Deus ouvia e dava libertadores. O imperfeito português conserva essa força habitual sem eliminar a possibilidade de episódios históricos concretos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens hebraicas “nas mãos” e “desde os céus”, bem como a repetição de “adversários”. Os pronomes de segunda pessoa singular preservam a oração dirigida diretamente a Deus.
