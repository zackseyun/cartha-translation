  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: pt
  text: Multiplicaste os filhos deles como as estrelas dos céus[a] e os levaste para a terra a respeito da qual tinhas dito aos pais deles que entrassem nela para tomar posse dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes deles”. A expressão “como as estrelas dos céus” retoma a linguagem da promessa de Deus aos patriarcas.
    reason: lexical_alternative; cross_reference
  - marker: b
    text: Ou “a herdassem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: os filhos deles
  rationale: בנים pode designar filhos, descendentes ou prole. “Os filhos deles” preserva o sentido familiar imediato e, no contexto da multiplicação nacional, inclui naturalmente as gerações descendentes.
- source_word: הִרְבִּיתָ
  choice: multiplicaste
  rationale: O hifil de רבה expressa fazer tornar-se numeroso. “Multiplicaste” é conciso, mantém a ação divina direta e ecoa a linguagem da promessa patriarcal.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: como as estrelas dos céus
  rationale: A formulação próxima do hebraico conserva a alusão à promessa feita aos patriarcas, com registro digno e compreensível.
- source_word: וַתְּבִיאֵם
  choice: os levaste
  rationale: O hifil de בוא significa fazer entrar ou levar. “Os levaste para a terra” soa natural em português e comunica o movimento de entrada sem tornar a frase pesada.
- source_word: אֶל הָאָרֶץ
  choice: para a terra
  rationale: Com o verbo de movimento, “para a terra” é idiomático em português; a entrada efetiva é explicitada logo depois por “entrassem nela”.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: que tinhas prometido aos pais deles
  rationale: Literalmente, a construção diz que Deus havia falado aos pais deles a respeito da terra. No contexto, essa palavra é uma promessa; “tinhas prometido” expressa naturalmente a relação sem acrescentar conteúdo estranho.
- source_word: לָבוֹא
  choice: para que entrassem nela
  rationale: O infinitivo de בוא indica a entrada na terra. A forma finita após “para que” produz português corrente e explicita o referente pronominal.
- source_word: לָרָשֶׁת
  choice: e tomassem posse dela
  rationale: ירשׁ pode significar possuir, tomar posse ou herdar. Neste contexto, “tomassem posse” comunica de modo claro a ocupação da terra prometida, preservando a alternativa “herdar” em nota.
theological_decisions:
- issue: Alusão à promessa feita aos patriarcas
  choice: Conservar “como as estrelas dos céus” e “pais deles”
  alternative: Usar “como as estrelas do céu” ou “como as estrelas no céu” e “antepassados”
  rationale: A redação mantém perceptível a linguagem da promessa patriarcal e a fidelidade de Deus, sem inserir uma explicação doutrinária no corpo do versículo.
- issue: Sentido de ירשׁ na posse da terra
  choice: “tomassem posse dela”
  alternative: “a herdassem”
  rationale: O verbo admite tanto a ideia de tomar posse quanto, em certos contextos, a de herdar. A tradução principal enfatiza a entrada e ocupação da terra neste relato, enquanto a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais tradicionais coerentes com a oração dirigida a Deus. A sintaxe foi tornada natural sem perder a alusão patriarcal nem a amplitude lexical do hebraico.
