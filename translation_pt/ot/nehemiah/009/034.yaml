source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: pt
  text: Até os nossos reis, os nossos oficiais, os nossos sacerdotes e os nossos pais não cumpriram a tua lei nem deram ouvidos aos teus mandamentos e aos teus testemunhos, com os quais os advertiste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: Até
  rationale: Introduz enfaticamente mais um conjunto de responsáveis na confissão; “Até” expressa em português natural a força aditiva e enfática.
- source_word: מְלָכֵינוּ
  choice: os nossos reis
  rationale: Tradução direta do substantivo plural com sufixo de primeira pessoa do plural.
- source_word: שָׂרֵינוּ
  choice: os nossos oficiais
  rationale: שׂרים designa autoridades civis ou administrativas; “oficiais” é atual e mais específico que “líderes”.
- source_word: כֹּהֲנֵינוּ
  choice: os nossos sacerdotes
  rationale: Equivalente corrente e preciso de כֹּהֵן.
- source_word: וַאֲבֹתֵינוּ
  choice: os nossos pais
  rationale: Preserva a expressão hebraica e o referente masculino às gerações anteriores; no contexto, trata-se dos antepassados de Israel.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: não cumpriram a tua lei
  rationale: עשה com תּוֹרָה significa observar ou pôr em prática; “cumprir a lei” é idiomático e claro em português.
- source_word: הִקְשִׁיבוּ
  choice: deram ouvidos
  rationale: A forma causativa de קשׁב indica escutar atentamente ou atender; “dar ouvidos” comunica tanto atenção quanto disposição de obedecer.
- source_word: מִצְוֺתֶיךָ
  choice: aos teus mandamentos
  rationale: Mantém o termo pactual específico e sua distinção em relação a “lei”.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: e aos teus testemunhos
  rationale: Tradução direta que preserva a ligação lexical com הַעִידֹתָ e o sentido de testemunho ou declaração solene da aliança.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: com os quais os advertiste
  rationale: O hifil de עוּד pode expressar advertência solene com força testemunhal; “com os quais” conserva a relação instrumental e a possível referência aos testemunhos.
theological_decisions:
- issue: Sentido de תּוֹרָה
  choice: a tua lei
  alternative: a tua instrução
  rationale: Nesta confissão nacional da aliança, o termo aponta para a lei pactual de Deus, sem excluir seu caráter instrutivo.
- issue: Referente de אָבוֹת
  choice: os nossos pais
  alternative: os nossos antepassados
  rationale: “Pais” preserva a forma masculina do hebraico e o idioma bíblico; contextualmente, refere-se às gerações anteriores de Israel.
- issue: Relação entre עֵדְוֹת e הֵעִיד
  choice: testemunhos, com os quais os advertiste
  alternative: advertências com as quais os advertiste / testemunhos que deste contra eles
  rationale: A tradução mantém tanto o vocabulário testemunhal da aliança quanto a função de advertência solene, sem reduzir o termo a simples estatutos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi simplificada com “nem” para evitar repetição pesada. “Deram ouvidos” conserva um tom solene sem ser arcaico. Não há notas, portanto não há marcadores no texto.
