revisions:
- from: Tu os advertiste para fazê-los voltar à tua lei, mas eles agiram com arrogância e não deram ouvidos aos teus mandamentos. Pecaram contra as tuas ordenanças, pelas quais quem as cumprir viverá.[a] Ofereceram um ombro rebelde, endureceram a própria cerviz[b] e não quiseram ouvir.
  to: Tu os advertiste para fazê-los voltar à tua lei, mas eles agiram com arrogância e não deram ouvidos aos teus mandamentos. Pecaram contra as tuas ordenanças, pelas quais quem as cumprir viverá.[a] Deram um ombro rebelde, endureceram a cerviz[b] e recusaram-se a ouvir.
  rationale: A revisão substitui «ofereceram» por «deram» para preservar com maior precisão e naturalidade a metáfora hebraica do ombro rebelde. Também ajusta a nota sobre a cerviz para explicar o idioma, e usa «recusaram-se a ouvir» como expressão portuguesa natural da recusa deliberada final, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha adequadamente a progressão do hebraico: advertência com o propósito de reconduzir à lei, conduta insolente, recusa dos mandamentos, pecado em relação às ordenanças, a fórmula de vida ligada à sua prática e as imagens de obstinação. «Quem as cumprir viverá» preserva corretamente o valor genérico de אָדָם e não especifica indevidamente a natureza da vida.'
  naturalness: O texto é geralmente claro e digno. Contudo, «Ofereceram um ombro rebelde» é pouco natural em português e pode sugerir uma oferta, não a imagem hebraica de resistência. «Deram um ombro rebelde» reproduz mais diretamente a construção e mantém a metáfora; a nota esclarece seu sentido.
  terminology: «Lei», «mandamentos» e «ordenanças» são escolhas coerentes para תורה, מצוות e משפטים neste contexto. «Cerviz» é registro bíblico compreensível e preserva a metáfora textual. «Agiram com arrogância» é aceitável para הֵזִידוּ, embora expresse de modo um pouco mais geral a insolência presunçosa do verbo.
  issues:
  - severity: medium
    issue: «Ofereceram um ombro rebelde»
    rationale: O verbo «oferecer» não comunica naturalmente a locução hebraica וַיִּתְּנוּ כָתֵף סוֹרֶרֶת e pode ser entendido como uma oferta voluntária. «Deram um ombro rebelde» mantém a imagem e evita essa inferência.
  - severity: low
    issue: A nota b chama «endureceram a cerviz» de literal
    rationale: Essa é precisamente a formulação do texto principal; é mais útil explicar a função idiomática da imagem sem apresentá-la como uma alternativa literal.
