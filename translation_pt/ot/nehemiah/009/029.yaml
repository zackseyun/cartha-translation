  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: pt
  text: Tu os advertiste para fazê-los voltar à tua lei, mas eles agiram com arrogância e não deram ouvidos aos teus mandamentos. Pecaram contra as tuas ordenanças, pelas quais quem as cumprir viverá.[a] Deram um ombro rebelde, endureceram a cerviz[b] e recusaram-se a ouvir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alusão a Levítico 18:5. Ou: “as quais, se alguém cumprir, viverá por elas”.'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Expressão que descreve resistência obstinada.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Tu os advertiste
  rationale: O hifil de עוד expressa advertência solene ou testemunho contra alguém; “advertiste” é natural e mantém a força da repreensão pactual.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: para fazê-los voltar à tua lei
  rationale: O hifil de שׁוב indica causar o retorno, e תּוֹרָה, neste contexto pactual, é adequadamente traduzida por “lei”.
- source_word: הֵזִידוּ
  choice: agiram com arrogância
  rationale: זיד descreve conduta insolente e presunçosa, não apenas um sentimento interior de orgulho.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: não deram ouvidos aos teus mandamentos
  rationale: A expressão preserva o sentido auditivo de שׁמע e sua implicação contextual de desobediência.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Pecaram contra as tuas ordenanças
  rationale: מִשְׁפָּטִים designa aqui determinações legais divinas; “ordenanças” conserva o teor jurídico sem sugerir apenas decisões judiciais.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: pelas quais quem as cumprir viverá
  rationale: A formulação reproduz a relação entre fazer e viver, mantém a referência anafórica às ordenanças e comunica em português atual o valor humano genérico de אָדָם.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Ofereceram um ombro rebelde
  rationale: Mantém a metáfora hebraica de resistência obstinada, embora ela seja incomum em português.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: endureceram a própria cerviz
  rationale: Preserva a metáfora corporal hebraica tradicional para obstinação; “a própria” expressa naturalmente o sufixo possessivo plural em português.
- source_word: וְלֹא שָׁמֵעוּ
  choice: não quiseram ouvir
  rationale: A formulação final comunica a recusa deliberada e persistente indicada no contexto.
theological_decisions:
- issue: Sentido da vida prometida na alusão a Levítico 18:5
  choice: Manter simplesmente “viverá”, sem definir a natureza ou extensão dessa vida
  alternative: Explicitar “terá vida” ou interpretar como vida eterna, prosperidade pactual ou sobrevivência
  rationale: O hebraico preserva uma afirmação ampla e teologicamente carregada; a tradução não deve resolver uma tensão que o texto não resolve.
- issue: Representação do אָדָם genérico
  choice: “quem”
  alternative: “o homem” ou “uma pessoa”
  rationale: Neste contexto, אָדָם se refere genericamente a qualquer ser humano. “Quem” conserva a referência singular e universal sem introduzir uma restrição ao sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” para manter a oração dirigida diretamente a Deus. As metáforas do ombro rebelde e da cerviz endurecida foram preservadas; a segunda recebe nota explicativa.
