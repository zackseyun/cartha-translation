source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: pt
  text: Então Jesua, Bani, Cadmiel, Sebanias, Buni, Serebias, Bani e Quenani ficaram de pé nos degraus dos levitas[a] e clamaram em alta voz a Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a subida dos levitas”; a expressão pode indicar degraus, uma escadaria ou um lugar elevado associado aos levitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ficaram de pé
  rationale: O verbo קום indica aqui que os homens assumiram ou mantiveram uma posição de pé; o plural é exigido em português pelo sujeito composto que vem depois.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: nos degraus dos levitas
  rationale: מַעֲלֵה pode designar subida, escadaria ou degraus. “Degraus” preserva a imagem espacial do hebraico sem transformar com certeza o lugar em uma plataforma.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Jesua, Bani, Cadmiel, Sebanias, Buni, Serebias, Bani e Quenani
  rationale: Os nomes são transliterados em formas correntes e legíveis em português. A segunda ocorrência de Bani é mantida, conforme o texto hebraico.
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: זעק expressa um clamor intenso, muitas vezes dirigido a Deus; “clamaram” comunica tanto a força da voz quanto o caráter de súplica.
- source_word: בְּקוֹל גָּדוֹל
  choice: em alta voz
  rationale: Expressão portuguesa natural e digna para o idioma hebraico literalmente associado a uma “voz grande”.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: Translitera diretamente o nome divino יהוה e preserva sua função como nome pessoal no texto.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: O sufixo plural hebraico refere-se ao Deus deles; em português, “seu Deus” concorda naturalmente com o grupo mencionado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta explicitamente o Tetragrama. “Yahweh” conserva o nome pessoal e evita substituí-lo por um título.
- issue: Natureza do clamor dirigido a Deus
  choice: clamaram ... a Yahweh
  alternative: gritaram para Yahweh
  rationale: “Clamaram” mantém a intensidade de זעק e sua possível dimensão de apelo ou oração, sem especificar além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e solene, com formas de nomes legíveis para o público lusófono. A ordem da lista e a repetição de Bani seguem o hebraico. A nota preserva a incerteza concreta de מַעֲלֵה.
