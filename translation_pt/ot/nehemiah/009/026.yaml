  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: pt
  text: Mas eles se mostraram obstinados[a] e se rebelaram contra ti. Lançaram a tua lei para trás das costas[b] e mataram os teus profetas, que os haviam advertido solenemente[c] para fazê-los voltar a ti. E cometeram grandes afrontas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiram com arrogância”, “foram desobedientes” ou “provocaram”; o verbo hebraico indica resistência obstinada.
    reason: lexical_alternative
  - marker: b
    text: Ou “a tua instrução”, em vez de “a tua lei”.
    reason: lexical_alternative
  - marker: c
    text: Ou “testemunhavam contra eles”; o hebraico pode indicar testemunho formal ou advertência solene.
    reason: lexical_alternative
  - marker: d
    text: Ou “grandes blasfêmias”, “grandes atos de desprezo” ou “grandes provocações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: se mostraram obstinados
  rationale: Distingue este verbo de וַיִּמְרְדוּ e comunica resistência insolente e deliberada sem restringi-lo à mera desobediência.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: se rebelaram contra ti
  rationale: Preserva o sentido explícito de rebelião e a relação pessoal indicada por בָּךְ.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: lançaram ... para trás das costas
  rationale: Mantém a imagem concreta e enfática do hebraico, que expressa rejeição desdenhosa.
- source_word: תּוֹרָתְךָ
  choice: a tua lei
  rationale: Embora תּוֹרָה também possa significar instrução, 'lei' é natural no contexto da confissão histórica da aliança.
- source_word: נְבִיאֶיךָ
  choice: os teus profetas
  rationale: Equivalente português direto e corrente.
- source_word: הֵעִידוּ בָם
  choice: os advertiam solenemente
  rationale: Expressa a ideia de testemunho ou advertência formal do hifil de עוּד e combina naturalmente com o propósito restaurador da oração seguinte.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: para fazê-los voltar a ti
  rationale: Preserva a força causativa de שוב e a direção relacional do retorno a Deus.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: grandes afrontas
  rationale: Abrange atos de desprezo, insulto e provocação contra Deus sem limitar o termo hebraico a palavras blasfemas.
theological_decisions:
- issue: Distinção entre וַיַּמְרוּ e וַיִּמְרְדוּ
  choice: se mostraram obstinados e se rebelaram
  alternative: desobedeceram e se rebelaram; agiram com arrogância e se rebelaram
  rationale: A diferenciação preserva os dois verbos e a intensificação retórica sem fundi-los numa única ideia.
- issue: Amplitude de נֶאָצוֹת
  choice: afrontas
  alternative: blasfêmias; atos de desprezo; provocações
  rationale: '''Afrontas'' conserva a gravidade da ofensa dirigida a Deus e permite atos ou palavras, enquanto ''blasfêmias'' poderia sugerir apenas fala.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por 'ti/tua/teus' mantém a oração direta a Deus e a coerência interna. A imagem hebraica das costas foi preservada, e as ambiguidades lexicais relevantes foram registradas em notas.
