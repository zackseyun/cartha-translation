revisions:
- from: Tu lhes deste pão do céu para a fome deles e fizeste sair água da rocha para a sede deles. Disseste-lhes que entrassem e tomassem posse da terra que, de mão levantada, juraste dar-lhes.[a]
  to: Tu lhes deste pão do céu quando tiveram fome e fizeste sair água de uma rocha quando tiveram sede. Disseste-lhes que entrassem e tomassem posse da terra que juraste[a] dar-lhes.
  rationale: A revisão substitui a paráfrase híbrida “de mão levantada, juraste” pela tradução idiomática fiel “juraste”, com a forma literal devidamente preservada em nota. Também ajusta as expressões relativas à fome e à sede para um português moderno mais fluente e verte o substantivo hebraico sem artigo como “uma rocha”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:07Z'
review_pass:
  verdict: revise
  source_fidelity: A sequência e os principais sentidos do hebraico estão bem representados. Contudo, “de mão levantada, juraste” não reproduz com precisão a construção hebraica “levantaste a tua mão” e soa como uma descrição genérica da maneira de jurar. É mais fiel e claro traduzir o sentido idiomático no texto e registrar a imagem literal em nota.
  naturalness: O texto é compreensível e de registro apropriado. “Quando tiveram fome/sede” é mais natural em português moderno do que “para a fome deles/para a sede deles”, sem alterar o sentido contextual da construção hebraica.
  terminology: “Pão do céu”, “tomar posse da terra” e “juraste” são escolhas adequadas. “Juraste” comunica de modo idiomático o sentido estabelecido da expressão hebraica de levantar a mão, enquanto a nota preserva a formulação literal.
  issues:
  - severity: medium
    issue: A expressão “de mão levantada, juraste” é uma reconstrução pouco natural e imprecisa da expressão hebraica.
    rationale: O hebraico diz literalmente que Deus “levantou a tua mão”, um idiomatismo para jurar. Em português, “de mão levantada” pode descrever o gesto de prestar juramento, mas não corresponde diretamente à formulação possessiva do original nem funciona naturalmente neste período. A tradução idiomática no texto, acompanhada de nota literal, preserva tanto o sentido como a transparência textual.
  - severity: low
    issue: “Para a fome deles / para a sede deles” é excessivamente calcado na estrutura hebraica.
    rationale: Embora semanticamente possível, a formulação é pouco idiomática no português moderno. “Quando tiveram fome / quando tiveram sede” comunica naturalmente a relação contextual expressa pelo lamed e mantém o paralelismo.
  revised_text: Tu lhes deste pão do céu quando tiveram fome e fizeste sair água de uma rocha quando tiveram sede. Disseste-lhes que entrassem e tomassem posse da terra que juraste[a] dar-lhes.
  revised_footnotes:
