base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: pt
  text: Tu lhes deste pão do céu quando tiveram fome e fizeste sair água de uma rocha quando tiveram sede. Disseste-lhes que entrassem e tomassem posse da terra que juraste[a] dar-lhes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantaste a tua mão para dar-lhes”, expressão idiomática para prestar juramento.'
    reason: Preserva a imagem literal hebraica e esclarece seu sentido idiomático, traduzido no texto por “juraste”.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: pão do céu
  rationale: Mantém a imagem concreta do hebraico e sua força alusiva, sem explicitar o maná.
- source_word: לִרְעָבָם
  choice: para a fome deles
  rationale: Conserva a relação expressa por לְ e o paralelismo com “para a sede deles”.
- source_word: מַיִם מִסֶּלַע
  choice: água da rocha
  rationale: Expressão natural em português para o conhecido episódio do deserto, sem alterar materialmente o sentido.
- source_word: הוֹצֵאתָ
  choice: fizeste sair
  rationale: Preserva de modo claro o valor causativo do hifil de יצא.
- source_word: לִצְמָאָם
  choice: para a sede deles
  rationale: Mantém a estrutura hebraica e o paralelismo com “para a fome deles”.
- source_word: וַתֹּאמֶר לָהֶם
  choice: Disseste-lhes
  rationale: Corresponde diretamente ao verbo “dizer”, sem intensificá-lo para “ordenar”.
- source_word: לָבוֹא
  choice: que entrassem
  rationale: Forma idiomática em português depois de “disseste-lhes”, preservando a ideia de entrar na terra.
- source_word: לָרֶשֶׁת
  choice: tomassem posse
  rationale: Comunica o sentido ativo de ירשׁ no contexto da ocupação da terra melhor do que “herdassem”.
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: de mão levantada, juraste
  rationale: Exprime o sentido de juramento e, ao mesmo tempo, conserva no texto a imagem antropomórfica hebraica.
- source_word: לָתֵת לָהֶם
  choice: dar-lhes
  rationale: Tradução portuguesa direta e natural da construção infinitiva.
theological_decisions:
- issue: Expressão de juramento aplicada à promessa divina da terra
  choice: de mão levantada, juraste
  alternative: juraste; levantaste a mão para dar-lhes
  rationale: A formulação preserva tanto o significado idiomático de juramento quanto a imagem concreta e antropomórfica do hebraico, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com colocação pronominal natural em registro bíblico moderado. O paralelismo “para a fome deles / para a sede deles” foi mantido, e a expressão de juramento combina clareza idiomática com transparência à imagem do original.
