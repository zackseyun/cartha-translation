  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: pt
  text: Então os descendentes de Israel se separaram de todos os estrangeiros. Ficaram em pé e confessaram seus pecados e as iniquidades de seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão pode indicar o reconhecimento coletivo das transgressões cometidas pelos antepassados, sem definir aqui se a culpa pessoal deles era atribuída aos descendentes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: se separaram
  rationale: O nifal de בדל pode ter sentido reflexivo ou passivo; com sujeito humano neste contexto, a forma reflexiva comunica naturalmente uma separação deliberada sem acrescentar motivação não expressa.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: os descendentes de Israel
  rationale: זֶרַע significa literalmente “semente”, mas aqui designa coletivamente a descendência. “Descendentes” preserva o sentido genealógico em português natural e claro.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: de todos os estrangeiros
  rationale: בְּנֵי נֵכָר é uma expressão idiomática para pessoas estrangeiras ou de origem estrangeira, não apenas filhos homens em sentido literal.
- source_word: וַיַּעַמְדוּ
  choice: ficaram em pé
  rationale: עמד indica a postura de estar de pé. “Ficaram em pé” é corrente em português e se encaixa naturalmente na sequência narrativa.
- source_word: וַיִּתְוַדּוּ
  choice: confessaram
  rationale: O hitpael de ידה, neste contexto, significa confessar. A escolha é direta, digna e não especifica além do hebraico a forma da confissão.
- source_word: חַטֹּאתֵיהֶם
  choice: seus pecados
  rationale: O plural de חַטָּאת denota claramente pecados; esta é a equivalência portuguesa mais comum e precisa.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: as iniquidades de seus antepassados
  rationale: עָוֹן pode indicar iniquidade, culpa ou consequência da culpa. “Iniquidades” preserva aqui a distinção lexical em relação a “pecados”, enquanto “antepassados” expressa o sentido ancestral inclusivo de אָבוֹת.
theological_decisions:
- issue: Confissão coletiva das iniquidades ancestrais
  choice: O povo confessou seus próprios pecados e as iniquidades de seus antepassados.
  alternative: A expressão poderia ser entendida como reconhecimento das consequências da culpa ancestral ou apenas como lembrança histórica.
  rationale: A sintaxe coordena ambos os elementos como conteúdo de “confessaram”. A tradução mantém a dimensão coletiva e ancestral da confissão, sem afirmar que os presentes herdaram culpa pessoal por atos alheios.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Descendentes” foi preferido ao literal “semente”; “antepassados” evita que “pais” seja entendido apenas como progenitores imediatos. A divisão em duas frases favorece a leitura sem alterar a sequência hebraica.
