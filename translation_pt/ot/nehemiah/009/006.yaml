  naturalness: O português é claro, moderno e adequado à leitura pública. «Só tu és Yahweh», «os céus dos céus» e «se prostra diante de ti» são naturais no registro bíblico contemporâneo. «Tu manténs todos eles vivos» é também idiomático e torna mais claro o valor contínuo do particípio.
  terminology: «Yahweh» preserva o nome divino conforme o texto-fonte. «Céus dos céus» mantém a expressão hebraica, com esclarecimento em nota. «Exército dos céus» preserva de modo útil a amplitude de צְבָא, sem decidir entre corpos celestes e seres celestiais.
