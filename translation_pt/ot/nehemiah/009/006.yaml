source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: pt
  text: Só tu és Yahweh. Tu fizeste os céus, os céus dos céus[a] e todo o seu exército; a terra e tudo o que nela há; os mares e tudo o que neles há. Tu manténs todos eles vivos[b], e o exército dos céus[c] se prostra diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus dos céus”, expressão que pode significar “os mais altos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Tu dás vida a todos eles”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “o exército celestial”. A expressão também pode abranger os corpos celestes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no hebraico.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: Só tu és
  rationale: Expressa em português natural a ênfase e a exclusividade da construção hebraica.
- source_word: עָשִׂיתָ
  choice: fizeste
  rationale: Traduz diretamente o verbo comum עשה, sem substituí-lo pelo verbo mais específico 'criar'.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: os céus dos céus
  rationale: Conserva a expressão hebraica e sua imagem cosmológica; uma nota esclarece seu valor superlativo.
- source_word: צְבָאָם
  choice: todo o seu exército
  rationale: Mantém a amplitude do coletivo צבא, que pode abranger os corpos celestes e os seres celestiais, sem reduzi-lo apenas às estrelas.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: a terra e tudo o que nela há
  rationale: Formulação idiomática em português que representa a terra inteira e tudo o que está sobre ela.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: os mares e tudo o que neles há
  rationale: Preserva a enumeração cósmica dos céus, da terra e dos mares.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: dás vida a todos eles
  rationale: Representa diretamente o particípio piel, mantendo aberta a possibilidade semântica de comunicar ou sustentar a vida; a alternativa é registrada em nota.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: o exército dos céus
  rationale: Mantém a expressão coletiva e sua ambiguidade entre astros e seres celestiais.
- source_word: מִשְׁתַּחֲוִים
  choice: se prostra
  rationale: Expressa o gesto de reverência ou adoração e concorda naturalmente com o substantivo coletivo singular.
theological_decisions:
- issue: Exclusividade divina associada a YHWH
  choice: Só tu és Yahweh
  alternative: Tu, somente tu, és Yahweh
  rationale: A ordem escolhida comunica claramente a exclusividade e a ênfase do hebraico sem acrescentar que 'Yahweh sozinho' fez a obra, leitura sintaticamente possível, mas menos provável.
- issue: Ação contínua de Deus em relação à criação
  choice: Tu dás vida a todos eles
  alternative: Tu manténs todos eles vivos
  rationale: O hebraico מְחַיֶּה pode indicar dar vida ou conservar com vida. O texto principal mantém a formulação mais direta, enquanto a nota preserva a dimensão de sustento contínuo.
- issue: Identidade do exército dos céus
  choice: o exército dos céus
  alternative: o exército celestial
  rationale: A formulação escolhida evita decidir se a expressão aponta principalmente para astros, seres celestiais ou ambos.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. Empregou-se 'tu' para acompanhar a oração dirigida diretamente a Deus, com formas verbais padrão. A estrutura enumerativa do hebraico foi preservada, com pontuação que favorece a leitura pública.
