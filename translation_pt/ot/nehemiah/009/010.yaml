  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: pt
  text: Tu realizaste sinais e maravilhas contra o faraó, contra todos os seus servos e contra todo o povo de sua terra, pois sabias que eles agiram com arrogância contra eles.[a] Assim, fizeste para ti um nome, como se vê até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiram presunçosamente contra eles”. O verbo hebraico pode indicar agir com orgulho, insolência ou presunção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: realizaste
  rationale: Embora o verbo signifique literalmente “dar”, com “sinais e maravilhas” o português natural pede “realizar”, expressando a ação divina sem literalismo rígido.
- source_word: אֹתֹת וּמֹפְתִים
  choice: sinais e maravilhas
  rationale: Preserva a expressão hebraica tradicional, incluindo tanto o valor indicativo dos atos quanto seu caráter extraordinário.
- source_word: בְּפַרְעֹה
  choice: contra o faraó
  rationale: A preposição marca aqui aqueles sobre quem os atos de juízo recaíram; “contra” comunica adequadamente essa força adversativa.
- source_word: וּבְכָל עֲבָדָיו
  choice: contra todos os seus servos
  rationale: “Servos” mantém a amplitude de עֲבָדִים, que no contexto real pode abranger servidores e oficiais, sem especificar indevidamente sua posição.
- source_word: וּבְכָל עַם אַרְצוֹ
  choice: contra todo o povo da sua terra
  rationale: Reproduz de modo claro e próximo ao hebraico a construção possessiva com אֶרֶץ.
- source_word: כִּי יָדַעְתָּ
  choice: pois sabias
  rationale: “Pois” preserva a relação causal, enquanto o imperfeito “sabias” soa natural na retrospectiva narrativa.
- source_word: הֵזִידוּ
  choice: haviam agido com arrogância
  rationale: O verbo denota ação orgulhosa, insolente ou presunçosa. “Agir com arrogância” é corrente e mantém o tom moral; o mais-que-perfeito composto explicita que essa conduta antecedeu os sinais.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: Mantém o pronome hebraico e sua provável referência aos israelitas, sem substituí-lo por uma identificação interpretativa.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: fizeste para ti um nome
  rationale: Conserva a imagem hebraica de estabelecer renome, em formulação digna e compreensível.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: como permanece até hoje
  rationale: Comunica que o renome resultante perdura até o presente do discurso, evitando a rigidez de “como neste dia”.
theological_decisions:
- issue: Referente de “eles” em “agido com arrogância contra eles”
  choice: Os egípcios, incluindo o faraó e seu povo, agiram com arrogância contra os israelitas.
  alternative: A arrogância teria sido dirigida mais genericamente contra Deus, ou a referência pronominal permaneceria inteiramente indeterminada.
  rationale: O contexto do êxodo favorece Israel como referente do objeto plural. A tradução, porém, conserva “eles” em vez de inserir “teu povo”, preservando a forma e a leve implicitude do hebraico.
- issue: Sentido de “fazer para ti um nome”
  choice: Deus estabeleceu para si renome por meio dos sinais e juízos.
  alternative: Tomar “nome” apenas como designação pessoal.
  rationale: A expressão hebraica é idiomática para adquirir ou estabelecer fama; manter a imagem não exige uma interpretação confessional adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração do capítulo. Mantém-se “faraó” com artigo, conforme o uso corrente em português, e preservam-se os pronomes ambíguos do hebraico.
