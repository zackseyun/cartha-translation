revisions:
- from: Tu realizaste sinais e maravilhas contra o faraó, contra todos os seus servos e contra todo o povo da sua terra, pois sabias que eles haviam agido com arrogância contra eles.[a] Assim, fizeste para ti um nome, como permanece até hoje.
  to: Tu realizaste sinais e maravilhas contra o faraó, contra todos os seus servos e contra todo o povo de sua terra, pois sabias que eles agiram com arrogância contra eles.[a] Assim, fizeste para ti um nome, como se vê até hoje.
  rationale: A revisão elimina o mais-que-perfeito não exigido pelo hebraico e ajusta a expressão final para uma formulação portuguesa idiomática. Mantêm-se a ambiguidade deliberada de «eles» e a imagem de Deus fazer um nome para si.
