source:
  edition: WLC
  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: pt
  text: Sua abundante produção[a] vai para os reis que colocaste sobre nós por causa dos nossos pecados. Eles dominam nossos corpos[b] e nosso gado como querem, e estamos em grande aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu rendimento” ou “sua colheita”; o sufixo se refere à terra mencionada no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “as nossas pessoas”; em hebraico, “os nossos corpos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: Sua ... produção
  rationale: תְּבוּאָה designa a produção ou o rendimento da terra. O sufixo feminino singular retoma a terra mencionada no versículo anterior.
- source_word: מַרְבָּה
  choice: abundante
  rationale: A forma comunica aumento ou abundância; em português, o adjetivo anteposto produz uma expressão natural e preserva o sentido.
- source_word: לַמְּלָכִים
  choice: vai para os reis
  rationale: A preposição ל indica direção ou benefício; a formulação expressa naturalmente que a produção fica com os reis.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: que colocaste sobre nós
  rationale: נתן com עַל pode indicar colocar ou estabelecer alguém em posição de autoridade, preservando aqui a agência divina.
- source_word: בְּחַטֹּאותֵינוּ
  choice: por causa dos nossos pecados
  rationale: A preposição ב tem valor causal neste contexto e apresenta os pecados como razão da sujeição.
- source_word: גְּוִיֹּתֵינוּ
  choice: os nossos corpos
  rationale: גְּוִיָּה pode designar o corpo. Aqui se refere às pessoas fisicamente sujeitas ao domínio estrangeiro, não a cadáveres.
- source_word: מֹשְׁלִים
  choice: Eles dominam
  rationale: O particípio indica domínio contínuo. “Dominam” comunica com naturalidade a autoridade opressiva descrita no lamento.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: e os nossos rebanhos
  rationale: בְּהֵמָה designa coletivamente os animais domésticos; “rebanhos” é uma forma corrente de expressar esse patrimônio pecuário.
- source_word: כִּרְצוֹנָם
  choice: como querem
  rationale: A expressão indica que os governantes exercem poder segundo a própria vontade; “como querem” é direta e idiomática.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: e estamos em grande aflição
  rationale: צָרָה denota aflição, angústia ou dificuldade; “grande aflição” preserva a gravidade do lamento coletivo.
theological_decisions:
- issue: Agência divina no domínio estrangeiro
  choice: O texto declara que Deus colocou esses reis sobre o povo por causa dos pecados deste.
  alternative: Deus apenas permitiu que esses reis governassem; ou Deus aprova moralmente tudo o que eles fazem.
  rationale: O hebraico נָתַתָּה עָלֵינוּ atribui diretamente a sujeição à ação judicial de Deus em resposta ao pecado, sem afirmar que Deus aprove os abusos praticados pelos governantes.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A redação busca ampla inteligibilidade internacional e leitura natural no Brasil.
