  terminology: «Grande bondade», «terra ampla e fértil», «serviram» e «más ações» são escolhas terminologicamente sólidas e coerentes com o sentido hebraico e com o registro da passagem. As notas oferecem alternativas legítimas sem estreitar indevidamente o sentido do texto.
