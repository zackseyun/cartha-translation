  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: pt
  text: Mesmo em seu reino, em meio à tua grande bondade[a] que lhes concedeste e na terra ampla e fértil[b] que puseste diante deles, eles não te serviram[c] nem se afastaram das suas más ações.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em tua abundante bondade” ou “com tua grande generosidade”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a terra ampla e gorda”, expressão que indica uma terra espaçosa e fértil.
    reason: cultural_note
  - marker: c
    text: 'Ou: “não te adoraram”; o verbo hebraico pode abranger tanto adoração quanto serviço.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “nem se arrependeram das suas más ações”; literalmente, “nem se voltaram das suas más ações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: em seu reino
  rationale: מַלְכוּת pode indicar reino, reinado ou domínio real; aqui, “em seu reino” expressa de modo direto a condição nacional estabelecida do povo.
- source_word: וּבְטוּבְךָ הָרָב
  choice: em meio à tua grande bondade
  rationale: טוּב abrange bondade, generosidade e abundância. A formulação preserva tanto a bondade divina quanto seus benefícios concretos.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: que lhes concedeste
  rationale: “Concedeste” comunica com naturalidade que a bondade e os benefícios foram dados por Deus, sem perder a força de נָתַן.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: terra ampla e fértil
  rationale: רְחָבָה significa ampla ou espaçosa, e שְׁמֵנָה, literalmente “gorda”, descreve idiomaticamente uma terra rica e fértil.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: que puseste diante deles
  rationale: Mantém a imagem espacial de לִפְנֵי e comunica que Deus colocou a terra à disposição deles.
- source_word: לֹא עֲבָדוּךָ
  choice: não te serviram
  rationale: עבד, quando tem Deus como objeto, inclui serviço, obediência e culto; “serviram” preserva essa amplitude.
- source_word: וְלֹא שָׁבוּ
  choice: nem se afastaram
  rationale: שׁוּב com מִן descreve voltar-se ou afastar-se de algo. A tradução conserva o movimento moral sem substituir o verbo pela formulação teológica mais interpretativa “arrepender-se”.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: das suas más ações
  rationale: מַעֲלָלִים designa atos, ações ou práticas; “más ações” é claro e preserva a avaliação moral do hebraico.
theological_decisions:
- issue: Sentido de עבד em relação a Deus
  choice: não te serviram
  alternative: não te adoraram
  rationale: O verbo pode incluir adoração, mas também serviço e obediência à aliança. “Serviram” evita restringir o sentido apenas ao culto.
- issue: Sentido moral de שׁוב מן
  choice: nem se afastaram das suas más ações
  alternative: nem se arrependeram das suas más ações
  rationale: A opção escolhida preserva a imagem hebraica de mudança de direção, sem transformar implicitamente a expressão em uma fórmula teológica mais específica de arrependimento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas pronominais tradicionais dirigidas a Deus (“tua”, “te”) e sintaxe natural. A repetição preposicional do hebraico foi suavizada sem apagar o paralelismo entre reino, bondade recebida e terra concedida.
