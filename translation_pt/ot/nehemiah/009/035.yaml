  source_fidelity: 'A tradução representa fielmente os elementos centrais do hebraico: a situação «em seu reino», a grande bondade concedida por Deus, a terra ampla e fértil posta diante deles, a recusa em servir a Deus e a falta de afastamento de suas más ações. «Não te serviram» preserva adequadamente a amplitude de עבד, e «nem se afastaram das suas más ações» expressa bem שׁוב מן sem impor a leitura mais interpretativa de arrependimento.'
