id: NEH.9.16
reference: Nehemiah 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: pt
  text: Mas eles, nossos pais, agiram com arrogância[a], endureceram a sua cerviz[b] e não deram ouvidos aos teus mandamentos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiram com presunção” ou “foram insolentes”.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica que indica obstinação e rebeldia.
    reason: cultural_note
  - marker: c
    text: Ou “não atenderam aos teus mandamentos” ou “não obedeceram aos teus mandamentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Mas eles
  rationale: O contexto contrapõe a rebeldia do povo aos atos graciosos de Deus narrados anteriormente; “Mas” expressa naturalmente essa força adversativa.
- source_word: וַאֲבֹתֵינוּ
  choice: nossos pais
  rationale: Reproduz de perto o termo hebraico e preserva a identificação coletiva da comunidade com as gerações anteriores.
- source_word: הֵזִידוּ
  choice: agiram com arrogância
  rationale: O verbo descreve conduta orgulhosa, presunçosa ou insolente. A formulação é corrente e mantém o sentido comportamental e moral.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: endureceram a sua cerviz
  rationale: Mantém a metáfora hebraica tradicional de resistência obstinada, com o singular coletivo do original.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: não deram ouvidos a
  rationale: Preserva o sentido auditivo do hebraico e, no contexto de mandamentos, comunica recusa em atender ou obedecer sem substituir a expressão por uma interpretação explícita.
- source_word: מִצְוֺתֶיךָ
  choice: teus mandamentos
  rationale: Mantém o registro jurídico e pactual do substantivo hebraico e concorda com a linguagem dignificada da oração.
theological_decisions:
- issue: Identificação coletiva com as gerações pecadoras anteriores
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A forma literal preserva a solidariedade histórico-pactual expressa pela oração sem introduzir uma formulação doutrinária mais estreita.
- issue: Relação entre ouvir e obedecer
  choice: não deram ouvidos aos teus mandamentos
  alternative: não obedeceram aos teus mandamentos
  rationale: A tradução mantém a imagem lexical de שׁמע, enquanto o objeto “mandamentos” deixa clara a consequência de desobediência sem eliminar a tensão entre escutar, atender e obedecer.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. “Cerviz” preserva a metáfora bíblica, e a nota esclarece seu sentido. A colocação “nossos pais” mantém a formulação histórica do original.
