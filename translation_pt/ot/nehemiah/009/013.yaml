  naturalness: O registro é digno e claro. A revisão de “sobre o monte” para “ao monte” e de “desde o céu” para “do céu” torna a frase mais natural em português moderno sem reduzir a precisão.
  terminology: “Juízos”, “leis”, “estatutos” e “mandamentos” preservam de modo útil a variedade dos termos jurídicos hebraicos. “Monte Sinai” e “céu” são formas estabelecidas e amplamente compreensíveis.
