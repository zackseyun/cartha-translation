  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: pt
  text: Desceste ao monte Sinai e falaste com eles do céu[a]; deste-lhes juízos retos[b], leis verdadeiras[c], bons estatutos e mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falaste a eles do céu”. O hebraico diz literalmente “com eles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “juízos justos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “leis de verdade” ou “instruções verdadeiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Desceste sobre o monte Sinai
  rationale: “Desceste” reproduz diretamente o movimento expresso por ירד e mantém a forma de oração dirigida a Deus. “Sobre o monte Sinai” conserva a relação espacial de עַל de maneira natural em português.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: e falaste com eles desde o céu
  rationale: “Com eles” reflete a preposição עִם, sem excluir a ideia de que Deus lhes dirigiu a palavra. “Desde o céu” comunica de modo idiomático a origem celestial da fala; o singular coletivo português corresponde naturalmente ao plural hebraico שָׁמַיִם.
- source_word: וַתִּתֵּן לָהֶם
  choice: Deste-lhes
  rationale: Forma concisa e natural em português para נתן com objeto indireto, preservando a segunda pessoa na oração.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: juízos retos
  rationale: “Juízos” mantém o sentido jurídico de מִשְׁפָּטִים e o distingue dos demais termos legais da lista. “Retos” preserva a imagem moral e normativa de יְשָׁרִים.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: leis verdadeiras
  rationale: No contexto da enumeração jurídica, “leis” expressa adequadamente o plural de תּוֹרָה. “Verdadeiras” comunica que essas leis se caracterizam pela verdade e confiabilidade.
- source_word: חֻקִּים
  choice: estatutos
  rationale: “Estatutos” é um equivalente jurídico tradicional e inteligível, além de manter este termo distinto de “juízos”, “leis” e “mandamentos”.
- source_word: וּמִצְוֺת
  choice: mandamentos
  rationale: “Mandamentos” é a equivalência clara e estabelecida para מִצְוֹת em contexto da aliança.
- source_word: טוֹבִים
  choice: bons
  rationale: '“Bons” preserva sem expansão o valor positivo de טוֹבִים e, pela construção coordenada, qualifica o par final: estatutos e mandamentos.'
theological_decisions:
- issue: Distinção entre os quatro termos jurídicos hebraicos
  choice: Manter “juízos”, “leis”, “estatutos” e “mandamentos” como quatro designações distintas.
  alternative: Reduzir a enumeração a termos mais genéricos, como “leis e mandamentos”, ou traduzir תּוֹרוֹת por “instruções”.
  rationale: A acumulação de termos no hebraico ressalta a amplitude e a qualidade da revelação dada no Sinai. Preservar a diferenciação evita achatar a textura jurídica e teológica do texto.
- issue: Sentido da fala divina no Sinai
  choice: Traduzir עִמָּהֶם por “com eles”.
  alternative: Traduzir por “a eles”.
  rationale: A opção principal conserva a preposição hebraica e a possível nuance relacional, sem negar que a fala lhes foi dirigida. A alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva o paralelismo da oração e diferencia os quatro termos legais sem recorrer a linguagem denominacional.
