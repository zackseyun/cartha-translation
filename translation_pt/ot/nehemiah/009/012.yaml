base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: pt
  text: Com uma coluna de nuvem, tu os conduziste de dia e, com uma coluna de fogo, de noite, para lhes iluminar o caminho[a] pelo qual deviam seguir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para lhes dar luz no caminho”. O hebraico diz literalmente: “para dar luz a eles [quanto a] o caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: Com uma coluna de nuvem
  rationale: A preposição ב pode indicar meio ou circunstância espacial. “Com” é natural em português e conserva a imagem concreta sem decidir de modo excessivo entre “por meio de” e “em”.
- source_word: הִנְחִיתָם
  choice: tu os conduziste
  rationale: O hifil de נחה, neste contexto da jornada pelo deserto, expressa condução ou orientação. “Conduziste” mantém o sentido histórico e o tratamento direto a Deus.
- source_word: יוֹמָם
  choice: de dia
  rationale: Expressão temporal adverbial, vertida de forma corrente e em paralelo com “de noite”.
- source_word: וּבְעַמּוּד אֵשׁ לַיְלָה
  choice: e, com uma coluna de fogo, de noite
  rationale: Preserva o paralelismo entre nuvem/dia e fogo/noite, com pontuação que torna clara a estrutura em português.
- source_word: לְהָאִיר לָהֶם
  choice: deste-lhes luz
  rationale: O infinitivo hifil de אור indica finalidade, “dar luz” ou “iluminar”. A forma verbal coordenada é uma expressão natural em português e explicita a função da coluna de fogo sem alterar o agente.
- source_word: אֶת הַדֶּרֶךְ
  choice: no caminho
  rationale: Embora o hebraico marque “o caminho” como objeto direto da iluminação, a locução “dar-lhes luz no caminho” é idiomática em português e comunica o mesmo quadro.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: pelo qual deviam seguir
  rationale: A oração relativa identifica a rota destinada a eles. “Deviam seguir” expressa direção prevista, sem introduzir mera possibilidade.
theological_decisions:
- issue: Imagem da orientação divina durante a jornada no deserto
  choice: Apresentar diretamente a ação histórica de Deus, que conduziu Israel pela nuvem e lhe deu luz pelo fogo.
  alternative: Interpretar as colunas sobretudo como símbolo teológico da presença divina ou acrescentar uma leitura tipológica.
  rationale: O hebraico destaca aqui as funções concretas de conduzir e iluminar. Leituras teológicas mais amplas são possíveis, mas não devem ser incorporadas à redação do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O ponto e vírgula realça o paralelismo poético entre dia e noite; o uso de “tu” preserva a oração dirigida diretamente a Deus.
