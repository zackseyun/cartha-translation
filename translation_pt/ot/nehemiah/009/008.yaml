id: NEH.9.8
reference: Nehemiah 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: pt
  text: Tu achaste o coração dele fiel diante de ti e fizeste com ele uma aliança para dar a terra dos cananeus, dos hititas, dos amorreus, dos perizeus, dos jebuseus e dos girgaseus — para dá-la à sua descendência.[a] E cumpriste as tuas palavras,[b] pois tu és justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos seus descendentes”. O termo hebraico traduzido por “descendência” é um substantivo coletivo singular, literalmente “semente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confirmaste” ou “estabeleceste as tuas palavras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: Tu achaste
  rationale: Mantém o sentido direto do qal de מצא, “achar”, no contexto da avaliação divina do íntimo de Abraão.
- source_word: אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: o coração dele fiel diante de ti
  rationale: “Coração” preserva a imagem hebraica do íntimo, da vontade e da disposição; “fiel” expressa confiabilidade e constância, sem reduzir o sentido a mera crença.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: e fizeste com ele uma aliança
  rationale: כרת ברית é o idioma hebraico para celebrar ou fazer uma aliança. “Fizeste ... uma aliança” é claro e natural em português atual.
- source_word: לָתֵת ... לָתֵת לְזַרְעוֹ
  choice: para dar ... para dá-la à sua descendência
  rationale: Conserva a repetição enfática de לָתֵת no hebraico, usando o pronome “-la” para evitar uma repetição pesada de “terra”.
- source_word: אֶרֶץ הַכְּנַעֲנִי הַחִתִּי הָאֱמֹרִי וְהַפְּרִזִּי וְהַיְבוּסִי וְהַגִּרְגָּשִׁי
  choice: a terra dos cananeus, dos hititas, dos amorreus, dos perizeus, dos jebuseus e dos girgaseus
  rationale: Embora os gentílicos estejam no singular coletivo em hebraico, o plural é a forma idiomática em português para designar esses povos e não altera a referência.
- source_word: לְזַרְעוֹ
  choice: à sua descendência
  rationale: זֶרַע é um substantivo coletivo singular, literalmente “semente”, que aqui designa a posteridade de Abraão. “Descendência” preserva bem esse valor coletivo.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: E cumpriste as tuas palavras
  rationale: קום, com “palavras” como objeto, indica confirmá-las ou estabelecê-las mediante sua realização. “Cumpriste” comunica naturalmente esse sentido no contexto da promessa divina.
- source_word: כִּי צַדִּיק אָתָּה
  choice: pois tu és justo
  rationale: “Pois” expressa a relação explicativa de כִּי, e “justo” preserva a amplitude moral e pactual de צַדִּיק em referência a Deus.
theological_decisions:
- issue: O sentido de נֶאֱמָן aplicado ao coração de Abraão
  choice: fiel
  alternative: confiável
  rationale: “Fiel” mantém tanto a ideia de confiabilidade quanto a de constância relacional, sem especificar indevidamente a natureza ou o mérito dessa fidelidade.
- issue: O sentido de צַדִּיק aplicado a Deus
  choice: justo
  alternative: reto
  rationale: “Justo” é o equivalente português mais abrangente e natural, capaz de incluir retidão moral, justiça e fidelidade ao compromisso; “reto” seria possível, mas menos adequado à formulação “tu és...” neste contexto.
- issue: A relação entre a justiça de Deus e o cumprimento da aliança
  choice: pois tu és justo
  alternative: porque tu és justo
  rationale: A oração apresenta a justiça divina como fundamento explicativo do cumprimento das palavras. “Pois” preserva essa relação sem definir mais precisamente como justiça e fidelidade pactual se relacionam.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento de Deus na segunda pessoa singular (“tu”). A repetição hebraica de “dar” foi preservada por sua função enfática. Os nomes dos povos aparecem no plural, forma mais natural em português, embora o hebraico empregue gentílicos singulares com valor coletivo.
