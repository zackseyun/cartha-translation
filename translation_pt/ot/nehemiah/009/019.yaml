  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: pt
  text: Mas tu, por tuas muitas misericórdias[a], não os abandonaste no deserto. A coluna de nuvem não se retirou de sobre eles durante o dia, para guiá-los pelo caminho, nem a coluna de fogo durante a noite, para lhes dar luz e iluminar o caminho pelo qual deviam seguir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por tua grande compaixão”. O hebraico emprega um substantivo no plural, literalmente “por tuas muitas misericórdias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: por tuas muitas misericórdias
  rationale: רַחֲמִים é morfologicamente plural e denota misericórdia ou compaixão; a nota preserva essa forma, enquanto o texto principal emprega a expressão portuguesa mais natural «por tua imensa misericórdia».
- source_word: עֲזַבְתָּם
  choice: não os abandonaste
  rationale: עזב pode significar deixar, desamparar ou abandonar; «abandonaste» comunica com clareza a não deserção divina e mantém um registro atual.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa a região erma na qual Israel peregrinou; «deserto» é claro e natural no português bíblico contemporâneo.
- source_word: עַמּוּד הֶעָנָן
  choice: a coluna de nuvem
  rationale: Tradução transparente da construção hebraica e formulação consagrada na narrativa do êxodo.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: não se afastou de sobre eles
  rationale: Preserva tanto o sentido de afastamento de סור quanto a dimensão espacial de מֵעֲלֵיהֶם.
- source_word: בְּיוֹמָם
  choice: durante o dia
  rationale: Expressão temporal natural em português e paralela a «durante a noite».
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: para guiá-los pelo caminho
  rationale: O Hifil de נחה significa guiar ou conduzir; «pelo caminho» expressa de modo idiomático o percurso indicado por בְּ.
- source_word: עַמּוּד הָאֵשׁ
  choice: a coluna de fogo
  rationale: Tradução direta e tradicional, mantendo o paralelismo com «coluna de nuvem».
- source_word: בַּלַּיְלָה
  choice: durante a noite
  rationale: Contraparte temporal natural de «durante o dia».
- source_word: לְהָאִיר לָהֶם
  choice: para iluminá-los
  rationale: O Hifil de אור significa dar luz ou iluminar; a forma escolhida é concisa e natural.
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: no caminho pelo qual deviam seguir
  rationale: A formulação portuguesa explicita de modo natural que a luz lhes permitia seguir o caminho; evita a leitura pouco idiomática de que «o caminho» seria um segundo objeto diretamente iluminado, sem apagar a construção hebraica incomum.
theological_decisions:
- issue: Linguagem da compaixão divina
  choice: «tua imensa misericórdia» no texto, com o plural hebraico registrado em nota
  alternative: «tuas muitas misericórdias»
  rationale: O plural רַחֲמִים pode ressaltar a abundância dos atos compassivos de Deus, mas o singular intensificado é mais natural em português. A nota preserva a forma e a nuance do hebraico sem impor uma interpretação doutrinária.
- issue: Relação sintática entre luz e caminho
  choice: «para iluminá-los no caminho pelo qual deviam seguir»
  alternative: «para iluminar a eles e o caminho pelo qual deviam seguir»
  rationale: Embora אֶת antes de הַדֶּרֶךְ possa sugerir coordenação de objetos, a sequência hebraica admite dificuldade sintática. A redação escolhida comunica a função orientadora da coluna de fogo sem converter a construção em afirmação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o tratamento por «tu» usado na oração e as imagens tradicionais «coluna de nuvem» e «coluna de fogo».
