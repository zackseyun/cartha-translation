    issue: O texto principal verte רַחֲמֶיךָ הָרַבִּים no singular («por tua imensa misericórdia»).
    rationale: Embora a nota informe o plural, «muitas misericórdias» é natural em português bíblico contemporâneo e preserva no próprio texto tanto o plural quanto o modificador «muitas/grandes» do hebraico.
  - severity: medium
    issue: «Para iluminá-los no caminho» deixa de representar claramente o complemento coordenado «e o caminho» (וְאֶת הַדֶּרֶךְ).
    rationale: A construção hebraica é incomum, mas inclui o caminho como complemento distinto. «Para lhes dar luz e iluminar o caminho...» preserva essa amplitude sem forçar uma sintaxe portuguesa artificial.
