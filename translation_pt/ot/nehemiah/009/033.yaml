  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: pt
  text: Contudo, tu és justo em tudo o que nos aconteceu[a], pois agiste com fidelidade, mas nós agimos perversamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “és justo a respeito de tudo o que nos sobreveio”. O hebraico também diz literalmente, na frase seguinte, “fizeste verdade”, isto é, “agiste com fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Contudo, tu
  rationale: A conjunção e o pronome introduzem um contraste entre a justiça de Deus e a culpa confessada pelo povo; “contudo” expressa essa força adversativa em português natural.
- source_word: צַדִּיק
  choice: justo
  rationale: O termo afirma a retidão moral de Deus em relação a tudo o que sobreveio ao povo; “justo” conserva o peso teológico e é corrente em português.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: em tudo o que nos aconteceu
  rationale: A expressão indica o âmbito em que Deus é reconhecido como justo. Esta formulação é natural em português e mantém a referência abrangente aos acontecimentos sofridos pelo povo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação anterior, ligando a justiça de Deus à sua conduta fiel em contraste com a perversidade do povo.
- source_word: אֱמֶת עָשִׂיתָ
  choice: agiste com fidelidade
  rationale: Literalmente, a construção diz “fizeste verdade”; no contexto, אֱמֶת descreve conduta fiel, confiável e verdadeira. A locução portuguesa preserva esse sentido sem soar artificial.
- source_word: וַ/אֲנַחְנוּ
  choice: mas nós
  rationale: 'A conjunção é contrastiva: opõe a conduta do povo à fidelidade de Deus.'
- source_word: הִרְשָׁעְנוּ
  choice: agimos perversamente
  rationale: O hifil comunica agir de modo perverso ou culpável. A tradução mantém a força verbal e cria um paralelismo claro com “agiste com fidelidade”.
theological_decisions:
- issue: A justiça de Deus diante das calamidades sofridas por Israel
  choice: Deus é confessado como justo em tudo o que aconteceu ao povo.
  alternative: Deus foi justo ao nos castigar.
  rationale: O hebraico relaciona a justiça de Deus a tudo o que sobreveio ao povo, mas não explicita aqui cada acontecimento como ato punitivo direto. A formulação preserva a tensão teológica e evita acrescentar uma mecânica de punição além do texto.
- issue: O contraste entre a conduta divina e a humana
  choice: “agiste com fidelidade, mas nós agimos perversamente”
  alternative: “fizeste a verdade, e nós fomos maus”
  rationale: 'O paralelismo verbal deixa clara a confissão: a ação de Deus foi fiel, enquanto a do povo foi perversa, sem reduzir אֱמֶת a mera exatidão factual.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o tratamento direto por “tu”, apropriado ao contexto de oração, e preserva o contraste enfático entre a justiça e fidelidade de Deus e a perversidade confessada pelo povo.
