  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them[a]. They stiffened their neck and appointed a leader to return to their slavery in their rebellion. But you are a God of forgiveness, gracious and compassionate, slow to anger and abundant in steadfast love[b], and you did not forsake them.
translation:
  language: pt
  text: Mas eles se recusaram a ouvir e não se lembraram das maravilhas que fizeste entre eles. Endureceram a cerviz e, em sua rebelião, designaram um líder para voltar à sua escravidão.[a] Mas tu és Deus de perdões,[b] bondoso e compassivo, tardio em irar-te e rico em amor leal, e não os abandonaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabeleceram um chefe”; mais literalmente, “puseram uma cabeça”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Deus de perdões”. O plural provavelmente intensifica a ideia de perdão abundante. Também se pode traduzir “Deus perdoador” ou “Deus pronto a perdoar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: se recusaram a ouvir
  rationale: Preserva o sentido direto de recusa e mantém em aberto a dimensão implícita de desobediência contida em שׁמע.
- source_word: נִפְלְאֹתֶיךָ
  choice: tuas maravilhas
  rationale: Expressa de modo conciso os atos extraordinários de Deus que despertam admiração.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: fizeste entre eles
  rationale: Entende עִם em sentido comunitário, como atos realizados no meio do povo, sem reduzi-lo apenas ao sentido benefativo.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: endureceram a cerviz
  rationale: Conserva a metáfora hebraica de obstinação em formulação bíblica digna e compreensível em português.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: designaram um líder
  rationale: Comunica naturalmente o sentido idiomático de literalmente estabelecer ou colocar uma cabeça.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: voltar à sua escravidão
  rationale: עַבְדוּת denota servidão ou escravidão; a escolha é clara e se ajusta ao contexto do êxodo.
- source_word: בְּמִרְיָם
  choice: em sua rebelião
  rationale: Trata o ב como circunstancial, descrevendo a condição ou maneira em que agiram.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: Deus de perdões
  rationale: Mantém o plural hebraico, provavelmente intensivo ou de abundância, em uma construção portuguesa inteligível.
- source_word: חַנּוּן וְרַחוּם
  choice: bondoso e compassivo
  rationale: Distingue o favor generoso expresso por חַנּוּן da compaixão terna de רַחוּם em linguagem atual.
- source_word: אֶרֶךְ אַפַּיִם
  choice: tardio em irar-te
  rationale: Reproduz o sentido idiomático tradicional da expressão hebraica sem importar sua imagem literal opaca.
- source_word: רַב־חֶסֶד
  choice: rico em amor leal
  rationale: Amor leal preserva os aspectos afetivo, relacional e fiel de חֶסֶד; rico em expressa naturalmente רַב.
- source_word: וְלֹא עֲזַבְתָּם
  choice: e não os abandonaste
  rationale: Transmite com clareza a força relacional de עזב em português moderno.
theological_decisions:
- issue: Descrição divina e o plural סְלִיחוֹת
  choice: Deus de perdões
  alternative: Deus perdoador; Deus pronto a perdoar
  rationale: A formulação conserva o incomum plural hebraico, que sugere abundância ou intensidade, sem transformá-lo silenciosamente numa paráfrase.
- issue: Sentido pactual de חֶסֶד
  choice: amor leal
  alternative: amor constante; misericórdia; bondade
  rationale: Amor leal mantém juntas a afeição e a fidelidade relacional, sem tornar explícita uma interpretação denominacional do conceito.
- issue: Ambiguidade de וַיִּתְּנוּ רֹאשׁ
  choice: designaram um líder
  alternative: estabeleceram um chefe; decidiram voltar
  rationale: O texto consonantal e a leitura massorética sustentam literalmente a ideia de colocar uma cabeça, entendida como nomear um líder; a nota registra alternativas relevantes sem apagar a dificuldade textual e interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A colocação de “em sua rebelião” antes do verbo evita uma sequência pesada. “Cerviz” preserva a metáfora bíblica, enquanto as notas esclarecem construções hebraicas incomuns. Todos os marcadores correspondem às respectivas notas.
