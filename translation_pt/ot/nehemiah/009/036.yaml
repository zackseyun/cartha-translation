  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are slaves; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are slaves on it.
translation:
  language: pt
  text: Eis que hoje somos escravos; e, na terra que deste aos nossos pais para comer do seu fruto e de sua abundância, eis que nela somos escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servos”. O termo hebraico indica pessoas em sujeição; aqui, provavelmente ressalta a submissão de Judá ao domínio imperial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a função de chamar a atenção e reforçar o lamento; é uma expressão digna e ainda compreensível em português.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém o contraste temporal entre a dádiva passada da terra e a condição presente do povo.
- source_word: עֲבָדִים
  choice: escravos
  rationale: Neste contexto de sujeição política sob domínio imperial, comunica melhor a perda de liberdade do que o termo mais brando “servos”.
- source_word: וְהָאָרֶץ ... עָלֶיהָ
  choice: e, na terra ... nela
  rationale: Explicita de modo natural o valor locativo da construção hebraica e preserva a ironia de serem escravos na própria terra recebida de Deus.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: que deste aos nossos pais
  rationale: Mantém a segunda pessoa dirigida a Deus e traduz diretamente a referência masculina aos antepassados.
- source_word: לֶאֱכֹל
  choice: para comerem
  rationale: Expressa o propósito da dádiva e torna explícito, conforme o contexto, que os pais eram os beneficiários da ação.
- source_word: פִּרְיָהּ
  choice: seu fruto
  rationale: Conserva a imagem agrícola concreta e a linguagem tradicional ligada à terra.
- source_word: טוּבָהּ
  choice: seus bens
  rationale: Representa a abundância e as coisas boas proporcionadas pela terra sem restringir o sentido apenas à produção agrícola.
theological_decisions:
- issue: Sentido de עֲבָדִים no lamento da aliança
  choice: escravos
  alternative: servos
  rationale: O povo lamenta sua sujeição a governantes estrangeiros dentro da terra prometida; “escravos” preserva a gravidade política e retórica da condição.
- issue: Referência pactual לַאֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O hebraico emprega o termo masculino “pais”; a tradução mantém essa forma sem neutralizá-la.
- issue: Relação de לֶאֱכֹל com os beneficiários da terra
  choice: para comerem
  alternative: para comermos
  rationale: A forma hebraica não explicita o sujeito do infinitivo. A leitura adotada liga o propósito aos pais, destinatários imediatos do verbo “deste”, mas a alternativa coletiva permanece gramaticalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “eis que” foi preservada por sua função enfática. “Nela somos escravos” reproduz naturalmente a ironia do hebraico “escravos sobre/nela”, evitando uma formulação artificial.
