source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: pt
  text: Durante muitos anos, tiveste paciência com eles e os advertiste pelo teu Espírito, por meio dos teus profetas.[a] Mas eles não deram ouvidos. Por isso, tu os entregaste nas mãos dos povos de outras terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: testemunhaste contra eles.'
    reason: Alternativa lexical que preserva a possível nuance forense ou pactual do verbo hebraico.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Durante muitos anos, tiveste paciência com eles
  rationale: A expressão com משׁך e עַל comunica prolongamento da tolerância ou adiamento do juízo. A formulação escolhida é natural em português e preserva a ideia de longa paciência.
- source_word: וַתָּעַד בָּם
  choice: e os advertiste
  rationale: O hifil de עוד pode significar advertir, admoestar ou testemunhar contra alguém. No contexto da repetida atuação profética, “advertiste” comunica com clareza a função da mensagem, enquanto a nota preserva a nuance forense ou pactual.
- source_word: בְּרוּחֲךָ
  choice: pelo teu Espírito
  rationale: No contexto da fala transmitida pelos profetas, רוּחַ designa o Espírito de Deus como agente da advertência profética.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: por meio dos teus profetas
  rationale: A expressão hebraica “pela mão de” é um idiomatismo de agência; “por meio de” é seu equivalente natural em português.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: Mas eles não deram ouvidos
  rationale: האזין indica ouvir com atenção. “Não deram ouvidos” preserva a ideia de recusa e mantém um registro bíblico ainda corrente e compreensível.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Por isso, tu os entregaste nas mãos
  rationale: O encadeamento narrativo apresenta a entrega como consequência da recusa. O plural idiomático “nas mãos” expressa estar sob o poder de outros com naturalidade em português.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: dos povos de outras terras
  rationale: O plural se refere mais naturalmente aos povos de territórios ou nações circunvizinhas, não à humanidade inteira. “Outras terras” torna essa relação clara sem especificar povos não nomeados no texto.
theological_decisions:
- issue: Referente de “teu Espírito”
  choice: O Espírito de Deus como agente da advertência profética
  alternative: O espírito de Deus entendido como disposição ou sopro
  rationale: A construção “pelo teu Espírito, por meio dos teus profetas” aponta para a atuação divina na mensagem profética, sem exigir a importação de formulações doutrinárias posteriores.
- issue: Nuance de וַתָּעַד בָּם
  choice: advertência dirigida a eles
  alternative: testemunho contra eles
  rationale: O verbo admite ambas as nuances. “Advertiste” comunica melhor a função da mensagem em português corrente; a alternativa em nota conserva a possível força jurídica e pactual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém “não deram ouvidos” pelo seu valor expressivo e ainda corrente, evitando literalismos menos naturais como “pela mão dos teus profetas” e “na mão dos povos das terras”.
