base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: pt
  text: Eles ficaram de pé em seus lugares[a] e leram no livro da Lei de Yahweh, seu Deus, por um quarto do dia[b]; por outro quarto, estavam confessando e se prostrando diante de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em seu posto»; possivelmente, «sobre sua plataforma». A expressão hebraica é condensada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «um quarto do dia» e «um quarto». Um quarto do dia foi dedicado à leitura, e outro, à confissão e à prostração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: ficaram de pé em seus lugares
  rationale: Expressa naturalmente a permanência em pé no lugar designado, sem especificar uma plataforma que o hebraico apenas pode sugerir.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: leram no Livro da Lei
  rationale: Com בְּסֵפֶר, קרא denota a leitura do texto escrito; «Livro da Lei» é claro e não força o suporte físico «rolo».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רְבִעִית הַיּוֹם
  choice: durante a quarta parte do dia
  rationale: Preserva a divisão temporal explícita do hebraico com formulação portuguesa compreensível.
- source_word: וּרְבִעִית
  choice: durante outra quarta parte
  rationale: Torna explícita em português a elipse hebraica e conserva o paralelismo entre os dois períodos.
- source_word: מִתְוַדִּים
  choice: confessaram seus pecados
  rationale: O particípio indica atividade continuada durante o período mencionado; «seus pecados» explicita o objeto naturalmente implícito no uso contextual do verbo התודה.
- source_word: וּמִשְׁתַּחֲוִים
  choice: se prostraram diante de
  rationale: Preserva a ação corporal de inclinar-se ou prostrar-se em adoração; «diante de» é português natural para a orientação da ação a Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de מִשְׁתַּחֲוִים
  choice: se prostraram diante de
  alternative: adoraram
  rationale: A opção escolhida mantém a imagem corporal concreta e deixa que o contexto comunique seu caráter de adoração, sem reduzi-la a um termo abstrato.
- issue: Objeto de מִתְוַדִּים
  choice: confessaram seus pecados
  alternative: fizeram confissão; confessaram
  rationale: O verbo não declara lexicalmente o objeto nesta oração, mas neste contexto penitencial indica confissão de pecados. A explicitação produz português natural, embora a formulação mais estrita seja possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém «Yahweh» e a imagem física da prostração. Os marcadores [a] e [b] aparecem no texto e correspondem às notas.
