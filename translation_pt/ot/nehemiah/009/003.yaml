  to: Eles ficaram de pé em seus lugares[a] e leram no livro da Lei de Yahweh, seu Deus, por um quarto do dia[b]; por outro quarto, estavam confessando e se prostrando diante de Yahweh, seu Deus.
  rationale: A revisão remove a explicitação de «seus pecados», que excede o que a oração hebraica declara, e reproduz o valor durativo dos particípios com «estavam confessando e se prostrando». Também torna as expressões de duração mais naturais em português, mantendo a divisão do dia e as alternativas lexicais nas notas.
