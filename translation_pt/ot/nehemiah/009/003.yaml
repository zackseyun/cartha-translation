  naturalness: «Por um quarto do dia» e «por outro quarto» são mais naturais e diretos do que «durante a quarta parte do dia». «Estavam confessando e se prostrando» expressa claramente a ação em curso indicada pelos particípios hebraicos.
  terminology: «Yahweh» reproduz consistentemente o Tetragrama. «Livro da Lei» é aceitável; «livro da Lei» evita uma capitalização interpretativa desnecessária. «Se prostrando diante de» conserva a imagem corporal e é idiomático em português.
