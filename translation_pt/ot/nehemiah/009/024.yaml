base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: pt
  text: Assim, os filhos entraram e tomaram posse da terra[a]. Tu subjugaste diante deles os habitantes da terra, os cananeus, e os entregaste nas mãos deles[b], tanto os seus reis como os povos da terra, para que fizessem com eles o que bem entendessem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes” ou, de modo mais interpretativo, “os israelitas”. O hebraico diz literalmente “os filhos”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, “os entregaste ao poder deles”. O hebraico diz literalmente “os deste na mão deles”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para fazerem com eles segundo a vontade deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: os filhos
  rationale: Preserva a linguagem genealógica do hebraico e a continuidade com os antepassados mencionados no contexto; aqui designa os descendentes de Israel que entraram em Canaã.
- source_word: וַיִּירְשׁוּ
  choice: tomaram posse de
  rationale: Expressa de modo natural o sentido de ירשׁ no contexto da ocupação e posse da terra, sem reduzi-lo à ideia de recebimento passivo de uma herança.
- source_word: וַתַּכְנַע
  choice: subjugaste
  rationale: Mantém a força político-militar do verbo e atribui explicitamente a Deus a sujeição dos habitantes da terra.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: Equivalente claro e corrente para a construção participial hebraica.
- source_word: הַכְּנַעֲנִים
  choice: os cananeus
  rationale: Conserva diretamente a designação étnica do texto.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: os entregaste nas mãos deles
  rationale: Preserva a imagem hebraica da mão como domínio ou poder, em formulação idiomática em português.
- source_word: מַלְכֵיהֶם
  choice: os seus reis
  rationale: O sufixo remete naturalmente aos habitantes da terra, identificados como cananeus.
- source_word: עַמְמֵי הָאָרֶץ
  choice: os povos da terra
  rationale: O plural 'povos' reflete עַמְמֵי e mantém a referência a diversos grupos da terra.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: para que fizessem com eles o que bem entendessem
  rationale: Comunica naturalmente a liberdade de agir segundo a própria vontade, sem suavizar a sujeição expressa no contexto.
theological_decisions:
- issue: Referente de הַבָּנִים ('os filhos')
  choice: Manter 'os filhos' como referência genealógica aos descendentes de Israel que entraram em Canaã.
  alternative: Traduzir interpretativamente como 'os israelitas' ou de modo mais genérico como 'os descendentes'.
  rationale: A forma literal conserva a linguagem familiar e pactual do hebraico e sua ligação narrativa com os pais mencionados anteriormente.
- issue: Força da linguagem da conquista
  choice: Conservar os termos fortes 'subjugaste' e 'entregaste nas mãos deles'.
  alternative: Atenuar para formulações como 'permitiste que vencessem' ou 'os ajudaste a superar'.
  rationale: O hebraico atribui diretamente a Deus a sujeição dos cananeus e sua entrega ao poder de Israel; a tradução não deve enfraquecer essa tensão textual.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A segunda pessoa do singular foi mantida para refletir a oração dirigida diretamente a Deus. Preservaram-se a linguagem genealógica e a força do relato da conquista, enquanto as notas registram alternativas mais interpretativas e a expressão literal.
