source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: pt
  text: Tu lhes deste a conhecer o teu santo sábado e lhes ordenaste mandamentos, estatutos e uma lei[a] por meio de Moisés, teu servo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução”. O termo hebraico תוֹרָה pode destacar tanto o ensino quanto a obrigação legal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão de Moisés, teu servo”, expressão idiomática que significa “por meio de Moisés, teu servo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: o teu santo sábado
  rationale: Preserva a especificidade pactual e cultual de שַׁבָּת, enquanto קָדְשְׁךָ caracteriza o sábado como santo e pertencente a Deus.
- source_word: הוֹדַעַתָ
  choice: deste a conhecer
  rationale: 'Reproduz naturalmente em português o sentido causativo do hifil de ידע: fazer alguém conhecer.'
- source_word: מִצְוֹת
  choice: mandamentos
  rationale: Mantém o registro jurídico-pactual e distingue este termo dos demais elementos da sequência.
- source_word: חֻקִּים
  choice: estatutos
  rationale: Expressa prescrições estabelecidas e conserva a diferenciação lexical da tríade legal.
- source_word: תוֹרָה
  choice: uma lei
  rationale: No contexto da sequência legal, “lei” é a opção mais direta; o artigo indefinido produz português natural sem identificar explicitamente o termo como título técnico. A nota preserva o sentido alternativo de “instrução”.
- source_word: צִוִּיתָ לָהֶם
  choice: lhes ordenaste
  rationale: Conserva a força verbal direta de צוה e o destinatário expresso pelo pronome.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: por meio de Moisés, teu servo
  rationale: Traduz o valor idiomático de agência de בְּיַד em português claro; a forma literal é registrada em nota.
theological_decisions:
- issue: Tradução da tríade legal מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: mandamentos, estatutos e uma lei
  alternative: ordens, decretos e instrução
  rationale: A formulação mantém distintos os três termos da revelação pactual, sem os fundir nem impor uma sistematização teológica posterior.
- issue: Mediação de Moisés em בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: O hebraísmo indica agência ou mediação. A tradução corrente comunica esse sentido, enquanto a nota preserva sua forma literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitura brasileira. Conserva a repetição e a estrutura jurídica do hebraico sem tornar literal o idiomatismo בְּיַד. Os marcadores foram colocados junto aos termos a que suas notas se referem.
