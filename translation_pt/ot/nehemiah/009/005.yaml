id: NEH.9.5
reference: Nehemiah 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: pt
  text: 'Então os levitas — Jesua, Cadmiel, Bani, Hasabneias, Serebias, Hodias, Sebanias e Petaías — disseram: “Levantem-se e bendigam a Yahweh, seu Deus, de eternidade a eternidade. E que bendigam[a] o teu nome glorioso[b], que está exaltado acima de toda bênção e louvor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E que eles bendigam”. O verbo hebraico está na terceira pessoa do plural e tem sentido volitivo; o sujeito não é expresso.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “o nome da tua glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tribal e cultual corrente, com o artigo definido preservado.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: Jesua, Cadmiel, Bani, Hasabneias, Serebias, Hodias, Sebanias e Petaías
  rationale: Formas portuguesas reconhecíveis e próximas dos nomes hebraicos; os travessões delimitam com clareza a lista em aposição.
- source_word: קוּמוּ
  choice: Levantem-se
  rationale: Imperativo masculino plural em linguagem moderna e apropriada a uma convocação pública.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: Preserva o sentido cultual do piel de ברך e a ligação lexical com בְּרָכָה, “bênção”, no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino do texto hebraico, sem substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Reproduz o sufixo de segunda pessoa do plural; “seu” concorda naturalmente com o tratamento plural “vocês” implícito em “Levantem-se”.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: de eternidade a eternidade
  rationale: Mantém a estrutura idiomática hebraica e seu sentido de duração ilimitada em registro solene.
- source_word: וִיבָרְכוּ
  choice: E que bendigam
  rationale: A forma é terceira pessoa masculina plural com valor volitivo. A construção portuguesa preserva tanto o número quanto o caráter de desejo ou exortação, sem convertê-la numa forma singular passiva.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: o teu nome glorioso
  rationale: Equivalência portuguesa natural para o construto literal “o nome da tua glória”; o pronome singular marca a passagem à fala dirigida a Deus.
- source_word: וּמְרוֹמַם
  choice: que está exaltado
  rationale: Expressa o valor predicativo da forma passiva ligada ao nome divino.
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: acima de toda bênção e louvor
  rationale: Conserva a afirmação de que o nome de Deus transcende toda bênção e todo louvor que lhe possam ser atribuídos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva essa função, enquanto “SENHOR” o substitui por um título.
- issue: Valor e sujeito de וִיבָרְכוּ
  choice: E que bendigam
  alternative: Bendito seja
  rationale: A forma massorética é terceira pessoa masculina plural e volitiva. A tradução mantém o sujeito plural não expresso, em vez de introduzir uma construção passiva singular que não corresponde à forma hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a mudança do tratamento dirigido ao povo (“seu Deus”, plural no contexto) para a oração dirigida a Deus (“teu nome”, singular). A ambiguidade quanto ao sujeito plural de וִיבָרְכוּ é preservada e esclarecida em nota.
