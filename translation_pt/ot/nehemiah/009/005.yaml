  source_fidelity: A tradução reproduz com precisão a sequência narrativa, a lista de levitas, os imperativos plurais, o nome divino Yahweh, o contraste entre “seu Deus” (dirigido à assembleia) e “teu nome” (dirigido a Deus), e o particípio passivo referente ao nome divino. “E que bendigam” preserva adequadamente o valor volitivo plural e o sujeito não expresso de וִיבָרְכוּ.
  naturalness: O português é moderno, solene e claro. “Levantem-se e bendigam” e “de eternidade a eternidade” são formulações naturais no registro litúrgico. A construção “E que bendigam” é deliberadamente marcada, mas é apropriada à oração e conserva uma particularidade sintática relevante do hebraico.
  terminology: “Levitas”, “bendigam”, “bênção”, “louvor” e “Yahweh” são consistentes com o texto-fonte e com o registro bíblico em português. As formas dos nomes são reconhecíveis em português e próximas ao hebraico. As notas explicam corretamente tanto a forma volitiva plural quanto o construto “nome da tua glória”.
