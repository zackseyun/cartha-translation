base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: pt
  text: Tu lhes deste reinos e povos e os repartiste por todas as regiões. Assim, eles tomaram posse da terra de Seom, da terra do rei de Hesbom e da terra de Ogue, rei de Basã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: reinos e povos
  rationale: Reproduz diretamente os dois substantivos hebraicos, mantendo a distinção entre entidades políticas e populações.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: e os repartiste por todas as regiões
  rationale: חלק expressa repartir ou distribuir; פאה significa literalmente lado, extremidade ou canto e, neste contexto geográfico, aponta para regiões ou partes territoriais. A formulação natural preserva a referência distributiva sem impor a obscura literalidade 'por canto'.
- source_word: וַיִּירְשׁוּ
  choice: tomaram posse
  rationale: No contexto da ocupação territorial, ירשׁ significa adquirir ou tomar posse, não apenas receber passivamente uma herança.
- source_word: אֶרֶץ סִיחוֹן וְאֶת אֶרֶץ מֶלֶךְ חֶשְׁבּוֹן
  choice: a terra de Seom — isto é, a terra do rei de Hesbom —
  rationale: O hebraico massorético repete 'terra' e liga Seom a 'rei de Hesbom' de maneira sintaticamente difícil. A explicitação identifica Seom como o rei de Hesbom, em conformidade com o referente histórico e com a leitura refletida por antigas testemunhas, sem sugerir duas terras distintas.
- source_word: עֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogue, rei de Basã
  rationale: Mantém o nome próprio e o título em aposição clara e natural em português.
theological_decisions:
- issue: Agência divina na concessão e distribuição dos territórios
  choice: 'Mantida explicitamente na segunda pessoa: ''Tu lhes deste... e os repartiste''.'
  alternative: Construção passiva ou impessoal, como 'foram-lhes dados'.
  rationale: A oração se dirige diretamente a Deus e lhe atribui a iniciativa; a tradução preserva essa ênfase sem acrescentar interpretação doutrinária.
- issue: Relação entre Seom e o rei de Hesbom
  choice: Entender a segunda expressão como identificação explicativa de Seom.
  alternative: 'Traduzir coordenadamente: ''a terra de Seom e a terra do rei de Hesbom''.'
  rationale: A alternativa produziria uma distinção historicamente improvável. A identificação preserva o sentido contextual, embora a construção hebraica seja incomum.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com formas nominais correntes no Brasil: Seom, Hesbom, Ogue e Basã. O travessão esclarece a aposição sem sobrecarregar o versículo.'
