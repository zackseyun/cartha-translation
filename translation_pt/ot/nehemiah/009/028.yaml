  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But as soon as they had rest[a], they turned back to do evil before you, and you abandoned them into the hand of their enemies, who ruled over them. Then they turned back and cried out to you[c][b], and you heard from heaven and delivered them many times according to your abundant mercies.
translation:
  language: pt
  text: Mas, assim que tinham descanso[a], voltavam a fazer o mal diante de ti, e tu os entregavas na mão de seus inimigos[b], que dominavam sobre eles. Então voltavam e clamavam a ti, e tu os ouvias dos céus e os livravas muitas vezes, segundo as tuas abundantes misericórdias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando tinham descanso». A expressão hebraica introduz uma oração temporal; «assim que» destaca a rápida recaída indicada pelo contexto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «na mão de seus inimigos», expressão hebraica que indica estar sob o poder de alguém.
    reason: cultural_note
  - marker: c
    text: 'Ou: «segundo a tua grande compaixão». O hebraico emprega um substantivo plural, «misericórdias» ou «compaixões».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Mas, assim que tinham descanso
  rationale: A construção temporal com כְּ e o infinitivo de נוח indica o momento em que recebiam alívio; «assim que» comunica naturalmente a recaída imediata sugerida pelo contexto, enquanto o imperfeito português ajuda a expressar o ciclo repetido.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: voltavam a fazer o mal
  rationale: שׁוב descreve retorno a uma conduta anterior. A formulação preserva tanto a repetição narrativa quanto a dimensão moral de רַע.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Mantém a imagem hebraica de agir na presença de Deus sem reduzir o sentido a mera observação nem ampliá-lo explicitamente para «contra ti».
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: tu os entregavas nas mãos de seus inimigos
  rationale: No contexto, עזב com בְּיַד descreve deixá-los sob o poder inimigo. «Entregavas» torna claro esse resultado judicial, e «nas mãos» conserva o idioma hebraico.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: que dominavam sobre eles
  rationale: O verbo indica exercício de domínio. «Dominavam sobre eles» preserva esse sentido sem acrescentar explicitamente a ideia de opressão.
- source_word: וַיָּשׁוּבוּ וַיִּזְעָקוּךָ
  choice: Então voltavam e clamavam a ti
  rationale: A repetição de שׁוב mantém o motivo cíclico, agora como retorno a Deus em busca de auxílio; זעק expressa um clamor urgente.
- source_word: מִשָּׁמַיִם תִּשְׁמַע וְתַצִּילֵם
  choice: tu os ouvias desde os céus e os livravas
  rationale: Os imperfeitos, dentro deste resumo histórico, têm valor iterativo. O pretérito imperfeito em português comunica com naturalidade ações repetidas.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: muitas vezes, segundo as tuas muitas misericórdias
  rationale: A colocação preserva «muitas vezes» como expressão da repetição dos livramentos e traduz tanto o plural רַחֲמִים quanto o modificador רַבּוֹת sem confundi-los.
theological_decisions:
- issue: Linguagem de abandono ou entrega divina
  choice: tu os entregavas nas mãos de seus inimigos
  alternative: tu os abandonavas nas mãos de seus inimigos
  rationale: A escolha expressa a retirada judicial da proteção e a sujeição ao poder inimigo no ciclo narrado, sem sugerir necessariamente abandono absoluto ou definitivo.
- issue: Aspecto iterativo dos verbos
  choice: voltavam; entregavas; ouvias; livravas
  alternative: voltaram; entregaste; ouviste; livraste
  rationale: O versículo resume acontecimentos recorrentes. O pretérito imperfeito português preserva melhor essa repetição, confirmada por «muitas vezes».
- issue: Plural de רַחֲמִים e força de רַבּוֹת
  choice: as tuas muitas misericórdias
  alternative: a tua grande compaixão
  rationale: A tradução mantém o plural concreto e a abundância do hebraico, sem eliminar a alternativa semântica de «compaixão», registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega «tu» para acompanhar a oração dirigida diretamente a Deus e conserva imagens bíblicas inteligíveis. O pretérito imperfeito torna explícito o caráter recorrente do ciclo narrativo.
