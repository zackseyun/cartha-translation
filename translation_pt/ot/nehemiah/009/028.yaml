revisions:
- from: Mas, assim que tinham descanso[a], voltavam a fazer o mal diante de ti, e tu os entregavas nas mãos de seus inimigos[b], que dominavam sobre eles. Então voltavam e clamavam a ti, e tu os ouvias desde os céus e os livravas muitas vezes, segundo as tuas muitas misericórdias[c].
  to: Mas, assim que tinham descanso[a], voltavam a fazer o mal diante de ti, e tu os entregavas na mão de seus inimigos[b], que dominavam sobre eles. Então voltavam e clamavam a ti, e tu os ouvias dos céus e os livravas muitas vezes, segundo as tuas abundantes misericórdias[c].
  rationale: A revisão melhora a idiomaticidade de «muitas misericórdias» para «abundantes misericórdias», preservando o plural de רַחֲמִים e a força de רַבּוֹת. Também ajusta «nas mãos» para «na mão», em concordância com o singular hebraico e com a nota existente. «Dos céus» é uma forma natural em português bíblico para a expressão hebraica «dos céus/do céu».
