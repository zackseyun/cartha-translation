source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: pt
  text: Viste a aflição de nossos pais no Egito e ouviste o clamor deles junto ao mar Vermelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «mar de Juncos». Tradicionalmente traduzido como «mar Vermelho».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Viste
  rationale: Traduz diretamente ראה e preserva a forma de oração dirigida a Deus; no contexto, ver inclui tomar conhecimento da aflição.
- source_word: עֳנִי
  choice: a aflição
  rationale: Expressa sofrimento e miséria sem especificar além do hebraico a natureza ou a causa dessa condição.
- source_word: אֲבֹתֵינוּ
  choice: nossos pais
  rationale: Mantém a forma masculina explícita do hebraico e o tom histórico da oração; «nossos antepassados» seria uma alternativa idiomática possível.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: Tradução locativa direta e natural.
- source_word: זַעֲקָתָם
  choice: o clamor deles
  rationale: זְעָקָה designa um grito angustiado por socorro; «clamor» comunica esse peso em português corrente e digno.
- source_word: שָׁמַעְתָּ
  choice: ouviste
  rationale: Preserva a formulação direta do hebraico; no contexto, ouvir sugere acolher o pedido sem tornar explícita na tradução uma resposta não declarada neste versículo.
- source_word: עַל
  choice: junto ao
  rationale: Com a referência geográfica, indica a localização do clamor nas proximidades do mar; «junto ao» é natural em português.
- source_word: יַם סוּף
  choice: mar Vermelho
  rationale: É a designação geográfica tradicional e amplamente reconhecida em português; a composição lexical hebraica é informada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais tradicionais de segunda pessoa singular («viste», «ouviste») para preservar a oração dirigida diretamente a Deus. A ordem foi levemente ajustada à fluência portuguesa, e a nota mantém transparente a expressão geográfica hebraica.
