source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: pt
  text: E agora, nosso Deus, ó Deus grande, poderoso e temível[a], que guardas a aliança e o amor leal, não deixes que pareça pequena diante de ti toda a aflição que sobreveio a nós — aos nossos reis, aos nossos líderes, aos nossos sacerdotes, aos nossos profetas, aos nossos antepassados[b] e a todo o teu povo — desde os dias dos reis da Assíria até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que inspira temor”. O termo hebraico descreve aquele que desperta temor reverente.
    reason: lexical_alternative
  - marker: b
    text: Lit. “nossos pais”. O termo hebraico está no masculino e se refere aos predecessores históricos do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: ó Deus grande, poderoso e temível
  rationale: A construção está em aposição vocativa a “nosso Deus”. “Temível” preserva o sentido de alguém que inspira temor reverente, enquanto “poderoso” expressa com naturalidade a força de גִּבּוֹר.
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  choice: que guardas a aliança e o amor leal
  rationale: O particípio descreve a ação contínua de Deus. “Amor leal” mantém o caráter relacional e pactual de חֶסֶד sem fundi-lo com “aliança” nem reduzi-lo apenas a misericórdia.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: não deixes que pareça pequena diante de ti
  rationale: A formulação conserva a imagem hebraica de a aflição não ser pequena diante de Deus, em vez de substituir completamente o idioma por “não consideres insignificante”.
- source_word: כָּל הַתְּלָאָה
  choice: toda a aflição
  rationale: תְּלָאָה abrange sofrimento, dificuldade e penúria; “aflição” se ajusta ao sofrimento histórico coletivo descrito no contexto.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: que sobreveio a nós
  rationale: O hebraico diz literalmente que a aflição “nos encontrou”; “sobreveio a nós” comunica esse idioma de modo natural e digno em português.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: aos nossos reis, aos nossos líderes, aos nossos sacerdotes, aos nossos profetas, aos nossos pais
  rationale: A repetição de “aos” reflete os grupos alcançados pela aflição. “Líderes” comunica שָׂרִים amplamente, sem restringi-lo a príncipes hereditários; “pais” preserva a forma masculina do hebraico, com esclarecimento em nota.
- source_word: וּלְכָל עַמֶּךָ
  choice: e a todo o teu povo
  rationale: A expressão amplia a enumeração para abranger toda a comunidade da aliança e mantém a segunda pessoa dirigida a Deus.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: desde os dias dos reis da Assíria até o dia de hoje
  rationale: A tradução preserva os dois limites temporais explícitos e a continuidade da aflição desde o período assírio até o presente dos oradores.
theological_decisions:
- issue: Sentido do epíteto divino נוֹרָא
  choice: temível
  alternative: impressionante; que inspira temor
  rationale: “Temível” mantém a tensão entre reverência e medo evocada pelo hebraico, sem enfraquecer o termo nem apresentar Deus apenas como aterrorizante.
- issue: Relação entre בְּרִית e חֶסֶד
  choice: a aliança e o amor leal
  alternative: a aliança e a misericórdia; a aliança e a fidelidade
  rationale: Os dois substantivos permanecem distintos. “Amor leal” expressa a devoção relacional duradoura de חֶסֶד no contexto da aliança sem impor uma formulação confessional específica.
- issue: Referência de אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O texto hebraico usa uma forma masculina para os predecessores históricos do povo. A tradução principal conserva essa forma, enquanto a nota esclarece o sentido coletivo e histórico.
- issue: Pedido para que a aflição não seja pequena diante de Deus
  choice: não deixes que pareça pequena diante de ti
  alternative: não consideres insignificante
  rationale: A opção principal preserva a linguagem relacional e a imagem do original sem definir de maneira excessiva se o pedido se refere à avaliação divina, à atenção de Deus ou à ação decorrente dela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A invocação solene foi mantida por “ó Deus”; os travessões organizam a longa enumeração sem alterar sua relação com “a nós”. Evitaram-se tanto arcaísmos desnecessários quanto linguagem coloquial.
