revisions:
- from: E agora, nosso Deus, ó Deus grande, poderoso e temível[a], que guardas a aliança e o amor leal, não deixes que pareça pequena diante de ti toda a aflição que sobreveio a nós — aos nossos reis, aos nossos líderes, aos nossos sacerdotes, aos nossos profetas, aos nossos pais[b] e a todo o teu povo — desde os dias dos reis da Assíria até o dia de hoje.
