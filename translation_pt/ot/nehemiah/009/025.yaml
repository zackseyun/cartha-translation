source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: pt
  text: Eles conquistaram cidades fortificadas e uma terra fértil[a] e tomaram posse de casas cheias de todo tipo de bens, cisternas escavadas, vinhedos, oliveiras e muitas árvores frutíferas. Comeram, ficaram saciados e engordaram; desfrutaram da tua grande bondade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma terra rica”; literalmente, “uma terra gorda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: conquistaram
  rationale: No contexto militar de tomada de cidades, לכד indica capturar ou conquistar; “conquistaram” é natural em português e mantém essa força.
- source_word: עָרִים בְּצֻרוֹת
  choice: cidades fortificadas
  rationale: בצר denota fortificação; a expressão é precisa e corrente.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: uma terra fértil
  rationale: A expressão significa literalmente “terra gorda”, idioma hebraico para solo rico e produtivo; “fértil” transmite o sentido naturalmente.
- source_word: וַיִּירְשׁוּ
  choice: tomaram posse de
  rationale: ירשׁ pode indicar herdar, desapossar ou possuir; aqui descreve a apropriação dos bens encontrados após a conquista.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: casas cheias de todo tipo de bens
  rationale: כָּל טוּב abrange provisões e coisas boas; “todo tipo de bens” evita sugerir que apenas qualidades abstratas enchiam as casas.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: cisternas escavadas na rocha
  rationale: בּוֹר designa aqui reservatórios de água, e חצוב indica algo talhado ou escavado; a formulação explicita de modo natural o tipo de obra sem acrescentar que já estavam prontas.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: vinhedos, oliveiras e muitas árvores frutíferas
  rationale: Mantém os bens agrícolas concretos e liga לָרֹב de maneira natural ao último item, conforme a sintaxe hebraica mais imediata.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: Comeram, ficaram saciados
  rationale: שׂבע significa ficar plenamente alimentado ou satisfeito; “saciados” preserva a imagem concreta da alimentação.
- source_word: וַיַּשְׁמִינוּ
  choice: engordaram
  rationale: Preserva a imagem vívida e literal de abundância presente no hebraico, sem convertê-la silenciosamente em “prosperaram”.
- source_word: וַיִּתְעַדְּנוּ
  choice: desfrutaram
  rationale: O verbo expressa viver em prazer ou deleite; “desfrutaram” é claro e digno no contexto.
theological_decisions:
- issue: Sentido de בְּטוּבְךָ הַגָּדוֹל
  choice: da tua grande bondade
  alternative: com a tua grande abundância
  rationale: “Bondade” preserva a amplitude de טוּב e atribui a Deus tanto a generosidade quanto os bens usufruídos, sem reduzir a expressão ao aspecto material.
- issue: Possível conotação moral de וַיַּשְׁמִינוּ
  choice: engordaram
  alternative: prosperaram
  rationale: O texto descreve concretamente o resultado da fartura. A tradução mantém a imagem sem impor, por si só, censura moral ou aprovação teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sequência narrativa concisa reproduz o encadeamento hebraico sem rigidez excessiva; “tu/tua” mantém o discurso direto dirigido a Deus.
