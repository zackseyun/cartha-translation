  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: pt
  text: E todo o povo de Judá trouxe o dízimo dos cereais, do vinho novo e do azeite para os depósitos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “armazéns”. O termo hebraico pode designar depósitos, câmaras de armazenamento ou tesouros; neste contexto, refere-se a locais onde eram guardados os cereais, o vinho e o azeite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: E todo o povo de Judá
  rationale: A expressão designa coletivamente a comunidade de Judá. A inclusão de “povo” torna esse sentido natural e claro em português, sem restringi-lo apenas ao território.
- source_word: הֵבִיאוּ
  choice: trouxe
  rationale: O hifil de בוא significa aqui “trazer”. O singular concorda naturalmente com o sujeito coletivo “todo o povo de Judá”.
- source_word: מַעְשַׂר
  choice: o dízimo
  rationale: É o termo usual para a décima parte devida. Mantém-se o singular coletivo do hebraico.
- source_word: הַ/דָּגָן
  choice: dos cereais
  rationale: דָּגָן abrange a produção de grãos em geral. “Cereais” comunica essa categoria agrícola com clareza em português internacional.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: do vinho novo
  rationale: תִּירוֹשׁ denota vinho novo ou produto recente da uva, distinguindo-se do termo hebraico mais geral para vinho.
- source_word: וְ/הַ/יִּצְהָר
  choice: do azeite
  rationale: יִצְהָר refere-se normalmente ao óleo agrícola, sobretudo o azeite de oliva. “Azeite” é natural e preciso neste trio tradicional de produtos.
- source_word: לָ/אוֹצָרוֹת
  choice: para os depósitos
  rationale: אוֹצָרוֹת pode indicar locais de armazenamento ou tesouros. Neste contexto de cereais, vinho e azeite, “depósitos” expressa melhor espaços destinados a guardar provisões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem geral do hebraico foi preservada, e o sujeito coletivo foi explicitado como “povo de Judá” para evitar a leitura meramente geográfica.
