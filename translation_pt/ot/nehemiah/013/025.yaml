  terminology: “Amaldiçoei”, “jurassem por Deus”, “filhas”, “filhos” e a linguagem matrimonial estão bem escolhidos. “Tomem ... para os filhos de vocês ou para vocês mesmos” preserva a abrangência da proibição de alianças matrimoniais.
