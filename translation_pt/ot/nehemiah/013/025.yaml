  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: pt
  text: 'Então eu os confrontei e os amaldiçoei[a]. Bati em alguns daqueles homens e arranquei os cabelos deles. Depois, fiz com que jurassem por Deus: “Não deem suas filhas aos filhos deles[b], nem tomem nenhuma das filhas deles para os filhos de vocês ou para vocês mesmos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “proferi uma maldição contra eles”; o verbo pode abranger uma denúncia verbal carregada de maldição.
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, literalmente, “se derem... e se tomarem...”. No contexto deste juramento, a expressão tem sentido proibitivo: “não deem... nem tomem...”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: eu os confrontei
  rationale: O verbo ריב descreve contenda ou disputa, por vezes com matiz judicial. “Confrontei” comunica de modo natural a ação enérgica de Nehemias sem reduzi-la a uma simples repreensão.
- source_word: וָאֲקַלְלֵם
  choice: os amaldiçoei
  rationale: No piel, קלל indica aqui proferir maldição contra alguém. A tradução direta preserva a severidade do relato sem ampliá-la.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: Bati em alguns daqueles homens
  rationale: A construção com מִן assinala uma parte do grupo. “Bati” exprime claramente a agressão física, enquanto “alguns daqueles homens” representa a ideia de homens dentre eles.
- source_word: וָאֶמְרְטֵם
  choice: arranquei os cabelos deles
  rationale: מרט significa arrancar ou puxar pelos/cabelos. Como o hebraico deixa o cabelo implícito, ele é explicitado em português para que a ação seja compreensível.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: fiz com que jurassem por Deus
  rationale: O hifil de שבע significa fazer alguém jurar ou colocá-lo sob juramento; a preposição בְּ introduz aquele por quem se jura.
- source_word: אִם תִּתְּנוּ
  choice: Não deem
  rationale: Depois de uma fórmula de juramento, אִם introduz aqui o compromisso negativo assumido. A proibição direta transmite em português o sentido e a força do juramento.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: suas filhas aos filhos deles
  rationale: A formulação descreve dar filhas em casamento e conserva de maneira natural a direção da aliança matrimonial.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: nem tomem nenhuma das filhas deles
  rationale: נשא, neste contexto matrimonial, significa tomar uma mulher como esposa. “Nenhuma” torna explícito o alcance negativo da proibição sem acrescentar conteúdo.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: para os filhos de vocês ou para vocês mesmos
  rationale: A proibição abrange tanto casamentos arranjados para os filhos como casamentos dos próprios ouvintes. Em uma proibição portuguesa, “ou” comunica naturalmente essa distribuição.
theological_decisions:
- issue: Relato das ações disciplinares violentas de Nehemias
  choice: Manter de modo direto a maldição, os golpes e o ato de arrancar cabelos
  alternative: Amenizar o episódio como mera repreensão verbal ou intensificá-lo como espancamento severo
  rationale: O texto narra ações duras de Nehemias sem oferecer aqui uma avaliação moral explícita. A tradução não deve suavizar nem agravar o que o hebraico afirma.
- issue: Força da fórmula de juramento introduzida por אִם
  choice: 'Traduzir o conteúdo como proibição: “Não deem... nem tomem...”'
  alternative: Conservar literalmente “se derem... e se tomarem...”
  rationale: Neste contexto de juramento, אִם não funciona como condição comum, mas introduz elipticamente o compromisso solene. A forma proibitiva comunica essa função com clareza em português.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade no Brasil. Emprega “vocês” para o plural e mantém a aspereza do relato sem linguagem arcaica, eufemismo ou comentário moral inserido no versículo.
