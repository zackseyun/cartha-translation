base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: pt
  text: Então dei a ordem[a], e eles purificaram as câmaras; e levei de volta para lá os utensílios da casa de Deus, a oferta de cereal e o olíbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Então eu disse» ou «Então ordenei». O verbo hebraico significa literalmente «eu disse», mas, neste contexto, introduz uma ordem que foi cumprida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Então dei a ordem
  rationale: Embora o hebraico diga literalmente «eu disse», o contexto mostra que Neemias deu uma ordem que foi cumprida; esta formulação explicita naturalmente a força pragmática sem perder a sequência narrativa.
- source_word: וַיְטַהֲרוּ
  choice: eles purificaram
  rationale: O verbo טהר pode abranger purificação ritual e limpeza material. «Purificaram» preserva melhor a dimensão cultual do contexto do templo.
- source_word: הַלְּשָׁכוֹת
  choice: as câmaras
  rationale: לשכה designa salas ou dependências do complexo do templo. «Câmaras» mantém o registro digno sem restringir indevidamente o sentido a depósitos.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: depois levei de volta para lá
  rationale: 'A forma de שוב tem sentido causativo: fazer voltar ou restituir. A expressão escolhida comunica a recolocação concreta dos objetos e preserva o advérbio «lá».'
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: os utensílios da casa de Deus
  rationale: כְּלִי é um termo amplo para objetos, instrumentos ou utensílios. «Utensílios» é claro em português e adequado aos objetos usados no serviço do templo; «casa de Deus» reproduz a expressão hebraica.
- source_word: אֶת הַמִּנְחָה
  choice: junto com a oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa especificamente a oferta feita de cereais. «Junto com» expressa em português que ela foi levada de volta juntamente com os utensílios.
- source_word: וְהַלְּבוֹנָה
  choice: e o incenso de olíbano
  rationale: לְבוֹנָה refere-se especificamente ao olíbano. A expressão «incenso de olíbano» alia precisão lexical a uma compreensão mais imediata para leitores modernos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém «casa de Deus» e o vocabulário cultual, evitando arcaísmos desnecessários. A ambiguidade entre fala e ordem é preservada em nota.
