base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: pt
  text: Quando cheguei a Jerusalém, compreendi o mal que Eliasibe havia feito em favor de Tobias ao lhe preparar um aposento[a] nos pátios da casa de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: uma sala. O termo hebraico designa um cômodo ou aposento dentro do complexo do templo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “casa de Deus” refere-se ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Quando cheguei a Jerusalém
  rationale: O wayyiqtol dá sequência à narrativa; em português, “quando cheguei” expressa naturalmente a relação temporal indicada pelo contexto.
- source_word: וָאָבִינָה
  choice: compreendi
  rationale: Preserva o sentido cognitivo de בין, indicando que Neemias percebeu ou veio a entender a situação ao chegar.
- source_word: בָרָעָה
  choice: o mal
  rationale: Mantém a avaliação moral explícita do hebraico sem suavizá-la para simples erro ou inconveniente.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: que Eliasibe havia feito em favor de Tobias
  rationale: O mais-que-perfeito deixa claro que a ação antecedeu a compreensão de Neemias; “em favor de” explicita o sentido benefativo da preposição ל.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: preparou para ele um aposento
  rationale: “Preparou” comunica que Eliasibe providenciou o espaço para Tobias sem afirmar necessariamente que o construiu; “aposento” é uma designação formal e compreensível para uma sala do complexo do templo.
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  choice: nos pátios da casa de Deus
  rationale: Traduz de modo direto o plural חַצְרֵי e preserva a expressão hebraica “casa de Deus”, esclarecida em nota como referência ao templo.
theological_decisions:
- issue: Caracterização moral da ação de Eliasibe
  choice: o mal
  alternative: o erro; o dano
  rationale: רָעָה apresenta a ação como moralmente má no contexto da santidade da casa de Deus; a tradução conserva esse peso sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas tradicionais em português (“Eliasibe” e “Tobias”). A construção após os dois-pontos torna explícito que o mal consistiu em providenciar o aposento, sem ampliar o conteúdo do hebraico.
