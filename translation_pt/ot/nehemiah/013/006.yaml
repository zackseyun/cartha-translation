source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: pt
  text: Durante todo esse tempo, eu não estava em Jerusalém, pois, no trigésimo segundo ano de Artaxerxes, rei da Babilônia[a], fui até o rei. Depois de algum tempo[b], pedi ao rei que me permitisse ausentar-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “rei da Babilônia”. A tradução mantém essa forma, sem harmonizá-la com o contexto mais amplo do domínio persa.
    reason: textual_variant
  - marker: b
    text: Literalmente, “ao fim de dias”; também pode ser traduzido por “depois de um período de tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Durante todo esse tempo
  rationale: Expressa naturalmente o valor temporal da frase e indica que a ausência de Neemias abrangeu o período em que ocorreram os fatos narrados.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: eu não estava em Jerusalém
  rationale: Reproduz de modo direto e idiomático a declaração de ausência no passado.
- source_word: כִּי
  choice: pois
  rationale: Mantém a função explicativa da conjunção, introduzindo o motivo da ausência.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: no trigésimo segundo ano
  rationale: É a forma portuguesa corrente para indicar um ano de reinado.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: de Artaxerxes
  rationale: Segue a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Traduz formalmente o texto hebraico sem harmonizá-lo com o contexto mais amplo do Império Persa.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: fui até o rei
  rationale: O verbo בוא pode significar ir ou vir conforme o ponto de vista; aqui, 'fui' é natural na narrativa de Neemias sobre seu deslocamento até o rei.
- source_word: וּלְקֵץ יָמִים
  choice: Depois de algum tempo
  rationale: Traduz idiomaticamente a expressão literalmente equivalente a 'ao fim de dias', que indica um período não especificado.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: pedi ao rei que me permitisse ausentar-me
  rationale: Comunica o pedido de licença sem afirmar além do hebraico que a permissão foi necessariamente concedida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A designação historicamente tensa “rei da Babilônia” foi preservada conforme o texto hebraico, e a expressão temporal idiomática foi vertida com clareza, mantendo-se a alternativa literal em nota.
