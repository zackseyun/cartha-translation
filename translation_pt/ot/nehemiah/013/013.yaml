base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: pt
  text: Designei como responsáveis pelos depósitos Selemias, o sacerdote, Zadoque, o escriba, e Pedaías, dentre os levitas; e, ao lado deles,[a] Hanã, filho de Zacur, filho de Matanias, pois eram considerados fiéis.[b] Cabia-lhes distribuir as porções a seus irmãos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob a direção deles”; a expressão hebraica pode indicar associação próxima ou serviço subordinado.
    reason: lexical_alternative
  - marker: b
    text: Ou “eram tidos como dignos de confiança”.
    reason: lexical_alternative
  - marker: c
    text: “Irmãos” traduz o termo masculino hebraico; aqui se refere aos demais membros do grupo ou da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצְרָה עַל אֹצָרוֹת
  choice: Designei como responsáveis pelos depósitos
  rationale: O verbo tem aqui sentido causativo/administrativo de nomear encarregados, enquanto אֹצָרוֹת designa os locais onde eram guardados os dízimos e mantimentos. A formulação comunica com naturalidade tanto a nomeação quanto a responsabilidade.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: Selemias, o sacerdote
  rationale: O nome é transliterado segundo forma portuguesa reconhecível, e o título é mantido.
- source_word: צָדוֹק הַסֹּפֵר
  choice: Zadoque, o escriba
  rationale: סֹפֵר pode indicar escriba ou secretário oficial; “escriba” preserva o título amplo sem especificar demais a função administrativa.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: e Pedaías, dentre os levitas
  rationale: Reproduz a identificação de Pedaías como integrante do grupo dos levitas, mantendo a preposição do hebraico em português natural.
- source_word: וְעַל יָדָם
  choice: e, ao lado deles
  rationale: A expressão idiomática pode indicar proximidade funcional, associação ou subordinação. “Ao lado deles” conserva essa abertura sem impor uma hierarquia inequívoca.
- source_word: חָנָן בֶּן זַכּוּר בֶּן מַתַּנְיָה
  choice: Hanã, filho de Zacur, filho de Matanias
  rationale: A genealogia é apresentada diretamente, com transliterações adequadas ao português.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: pois eram considerados fiéis
  rationale: Mantém tanto a avaliação expressa por נֶחְשָׁבוּ quanto a ideia de fidelidade e confiabilidade em נֶאֱמָנִים.
- source_word: וַעֲלֵיהֶם
  choice: Cabia-lhes
  rationale: Expressa de modo conciso e natural a responsabilidade atribuída pelo hebraico, literalmente “sobre eles”.
- source_word: לַחֲלֹק
  choice: distribuir as porções
  rationale: No contexto dos mantimentos armazenados, o verbo se refere à repartição ou distribuição das partes devidas. A explicitação de “porções” torna o objeto implícito claro sem alterar o sentido.
- source_word: לַאֲחֵיהֶם
  choice: a seus irmãos
  rationale: Preserva o substantivo masculino de parentesco do texto hebraico, que no contexto se refere aos demais membros do grupo ou da comunidade.
theological_decisions:
- issue: Termo masculino de parentesco אֲחֵיהֶם
  choice: seus irmãos
  alternative: seus companheiros / os demais membros da comunidade
  rationale: O hebraico emprega explicitamente o plural masculino “irmãos”. A tradução conserva essa forma e deixa uma nota esclarecer o alcance comunitário, sem neutralizar nem restringir indevidamente o referente.
- issue: Relação funcional de Hanã com os outros encarregados
  choice: ao lado deles
  alternative: sob a direção deles
  rationale: A expressão עַל יָדָם admite associação próxima ou serviço subordinado. Como a sintaxe não determina de forma inequívoca a hierarquia, o texto principal preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para clareza, sem eliminar a ambiguidade da posição de Hanã. Os marcadores de nota foram colocados junto às expressões que explicam.
