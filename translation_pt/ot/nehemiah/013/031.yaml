  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: pt
  text: E para a oferta de lenha nas ocasiões determinadas[a], e para as primícias. Lembra-te de mim, meu Deus, para o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a oferta da lenha”. O hebraico se refere ao fornecimento programado de lenha para uso no templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: oferta de lenha
  rationale: Expressa de modo natural a provisão cultual de madeira para o serviço do templo; “lenha” torna explícito seu uso como combustível sem alterar o referente contextual.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: nas ocasiões determinadas
  rationale: Preserva a ideia de momentos oficialmente fixados ou designados e se liga com naturalidade à oferta de lenha.
- source_word: בִּכּוּרִים
  choice: primícias
  rationale: Termo bíblico corrente em português para os primeiros produtos apresentados a Deus, ainda compreensível no registro religioso moderno.
- source_word: זָכְרָה לִּי
  choice: Lembra-te de mim
  rationale: Reproduz diretamente a fórmula recorrente da oração de Neemias, mantendo o pedido de lembrança divina favorável.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Mantém a forma possessiva e o caráter pessoal da invocação.
- source_word: לְטוֹבָה
  choice: para o bem
  rationale: Conserva a concisão e a abertura semântica do hebraico, sem decidir se o bem é favor, benefício ou resultado favorável.
theological_decisions:
- issue: Expressão cultual קֻרְבַּן הָעֵצִים
  choice: a oferta de lenha
  alternative: a oferta da lenha
  rationale: A formulação escolhida identifica uma oferta ou provisão cultual de combustível para o templo sem sugerir que a madeira fosse um sacrifício independente; a nota registra a alternativa mais literal.
- issue: Petição final לְטוֹבָה
  choice: para o bem
  alternative: favoravelmente
  rationale: “Para o bem” preserva a tensão e a indeterminação do original quanto à forma exata da resposta divina, enquanto “favoravelmente” explicitaria uma interpretação possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ênclise em “Lembra-te” conserva o tom de oração sem recorrer a vocabulário excessivamente arcaico. O versículo começa com “e” porque continua a enumeração da frase anterior.
