  source_fidelity: 'A tradução transmite corretamente a sequência básica: ao aproximar-se o sábado, Neemias mandou fechar as portas, proibiu que fossem abertas até depois do sábado e postou membros de seu pessoal nos portões para impedir a entrada de cargas. Contudo, “os portões ... começaram a escurecer” é pouco idiomático em português e pode sugerir que os próprios portões mudaram de cor, em vez de reproduzir o idiomatismo hebraico relativo às sombras/ao cair da noite.'
  naturalness: O texto é em geral claro e de registro apropriado. “Começaram a ficar na sombra” comunica de modo mais natural, sem eliminar a imagem concreta do hebraico. “Posicionei” expressa melhor a designação de homens para um posto de guarda do que “coloquei”.
  terminology: “Sábado”, “portões”, “portas”, “jovens” e “carga” são escolhas defensáveis. A nota sobre “jovens” preserva adequadamente a amplitude contextual de נַעַר; a nota sobre “carga” esclarece, sem impor, a provável relação com comércio.
  issues:
