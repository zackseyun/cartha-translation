    rationale: Embora siga de perto a construção hebraica, a formulação é semanticamente estranha em português moderno e pode ser entendida como escurecimento material dos portões. O hebraico usa uma expressão relacionada a sombra/crepúsculo; “começaram a ficar na sombra” mantém a referência aos portões e torna o sentido inteligível.
  - severity: low
    issue: “Também coloquei ... junto aos portões”
    rationale: “Coloquei” é possível, mas é menos específico para o posicionamento de pessoal em serviço. “Posicionei ... nos portões” é natural e preserva melhor a função administrativa do verbo.
