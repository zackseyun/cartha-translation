reference: Nehemiah 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: And it happened that[a], when the gates of Jerusalem grew dark before the Sabbath, I said that the doors should be shut, and I said that they should not open them until after the Sabbath[c][b]. And I stationed some of my young men at the gates so that no load might come in on the Sabbath day.
translation:
  language: pt
  text: E aconteceu que, quando os portões de Jerusalém começaram a ficar na sombra antes do sábado,[a] eu disse que fechassem as portas e que não as abrissem até depois do sábado. Também posicionei alguns dos meus jovens[b] nos portões, para que nenhuma carga[c] entrasse no dia de sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “quando os portões de Jerusalém começaram a ficar na sombra antes do sábado”; é uma expressão referente à chegada da noite.
    reason: lexical_alternative
  - marker: b
    text: Ou “alguns dos meus servos” ou “alguns dos meus auxiliares”; o hebraico pode designar membros do séquito pessoal de Neemias.
    reason: lexical_alternative
  - marker: c
    text: “Carga” pode referir-se especificamente a mercadorias transportadas para comércio, pois o contexto trata do comércio no sábado.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָלֲלוּ
  choice: começaram a escurecer
  rationale: Expressa naturalmente a chegada da noite, indicada pelo idioma hebraico, sem perder a referência gramatical aos portões.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: os portões de Jerusalém
  rationale: Reproduz com clareza a relação construta e distingue os portões da cidade das portas que os fechavam.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: antes do sábado
  rationale: Mantém o sentido temporal de pouco antes do início do sábado.
- source_word: וָאֹמְרָה ... וָאֹמְרָה
  choice: eu disse que fechassem ... e que não as abrissem
  rationale: Traduz o ato de falar como ordem pelo modo verbal em português; combina as duas determinações para evitar repetição pesada sem alterar seu conteúdo.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: que fechassem as portas
  rationale: Apresenta a oração como conteúdo da ordem e não introduz um agente específico ausente do hebraico.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: que não as abrissem
  rationale: Preserva a construção ativa plural e o objeto feminino referente às portas.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: até depois do sábado
  rationale: Tradução temporal direta, clara e próxima do hebraico.
- source_word: וּמִנְּעָרַי
  choice: alguns dos meus jovens
  rationale: Mantém o sentido básico de נַעַר e representa o valor partitivo da preposição; uma nota registra os sentidos contextuais de servos ou auxiliares.
- source_word: הֶעֱמַדְתִּי
  choice: coloquei
  rationale: Verbo corrente e natural para designar pessoas destinadas a vigiar determinado local.
- source_word: עַל הַשְּׁעָרִים
  choice: junto aos portões
  rationale: Expressa idiomaticamente o posto de vigilância nos portões, sem sugerir que os homens estavam fisicamente sobre eles.
- source_word: לֹא יָבֹא מַשָּׂא
  choice: para que nenhuma carga entrasse
  rationale: Conserva o sentido concreto e amplo de מַשָּׂא, enquanto o contexto esclarece a finalidade comercial provável.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: Preserva a menção explícita a 'dia' e usa a designação corrente em português.
theological_decisions:
- issue: Tradução de שַׁבָּת
  choice: sábado
  alternative: dia de descanso
  rationale: O termo designa especificamente o sábado semanal da aliança e da prática de Israel, não apenas um dia genérico de repouso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a distinção entre os portões da cidade e suas portas, conserva a ambiguidade de “jovens” e “carga” por meio de notas e evita explicitar além do hebraico quem executou o fechamento.
