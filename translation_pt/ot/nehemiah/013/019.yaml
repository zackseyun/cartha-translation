  to: E aconteceu que, quando os portões de Jerusalém começaram a ficar na sombra antes do sábado,[a] eu disse que fechassem as portas e que não as abrissem até depois do sábado. Também posicionei alguns dos meus jovens[b] nos portões, para que nenhuma carga[c] entrasse no dia de sábado.
