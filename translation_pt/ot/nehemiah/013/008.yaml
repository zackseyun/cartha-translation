lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Isso me desagradou muito
  rationale: Reproduz de modo natural a construção idiomática em que algo é mau ou desagradável para alguém, sem especificar uma emoção além do que o hebraico exige.
- source_word: וָאַשְׁלִיכָה
  choice: joguei
  rationale: Expressa com clareza e força a ação causativa de lançar para fora, sem recorrer a linguagem arcaica.
- source_word: כָּל
  choice: todos
  rationale: Mantém o sentido abrangente do hebraico e concorda naturalmente com “bens”.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: todos os bens de Tobias
  rationale: כְּלִי pode indicar objetos, utensílios, equipamentos ou bens. Neste contexto, “bens” comunica de forma ampla e concreta as coisas de Tobias guardadas na sala, sem restringi-las a vasos ou móveis.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: para fora da sala
  rationale: Traduz naturalmente o movimento para o exterior e verte לִשְׁכָּה como uma sala pertencente ao complexo do templo.
