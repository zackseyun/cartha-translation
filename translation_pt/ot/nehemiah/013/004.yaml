  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: pt
  text: Antes disso, o sacerdote Eliasibe, encarregado da sala da casa do nosso Deus, tinha laços com Tobias[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era parente de Tobias” ou “era associado a Tobias”. A expressão hebraica pode indicar proximidade familiar ou social.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Antes disso
  rationale: Expressa com naturalidade a circunstância temporal anterior, sem acrescentar um marcador equivalente a “agora” que não aparece explicitamente no hebraico.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: o sacerdote Eliasibe
  rationale: Mantém o nome próprio por transliteração e apresenta o título definido em ordem natural no português.
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: encarregado da sala
  rationale: O particípio passivo de נתן indica aqui uma incumbência ou designação, e לִשְׁכָּה designa uma sala ou câmara do complexo do templo. “Sala” é claro e não restringe indevidamente o espaço a um depósito.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: da casa do nosso Deus
  rationale: Reproduz a designação cultual e preserva a primeira pessoa plural do texto.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: tinha laços com Tobias
  rationale: A expressão hebraica denota proximidade relacional, mas não determina inequivocamente se ela era familiar ou social. A formulação preserva essa amplitude sem intensificar o vínculo.
theological_decisions:
- issue: Natureza do vínculo entre Eliasibe e Tobias
  choice: tinha laços com Tobias
  alternative: era parente de Tobias / era associado de Tobias
  rationale: O hebraico קָרוֹב לְ pode referir-se a parentesco ou a estreita associação social. A tradução principal mantém a ambiguidade genuína, e a nota explicita as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O travessão final preserva a continuidade sintática e narrativa com o versículo seguinte.
