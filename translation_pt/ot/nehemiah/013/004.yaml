  source_fidelity: A tradução reproduz adequadamente a sequência temporal de וְלִפְנֵי מִזֶּה, a identificação de Eliasibe como sacerdote, sua incumbência relativa à câmara do templo e a proximidade relacional com Tobias. “Tinha laços com” preserva prudentemente a abertura semântica de קָרוֹב לְ, que pode abranger parentesco ou associação.
