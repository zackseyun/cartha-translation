base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: pt
  text: 'Então eu os adverti e lhes disse: “Por que vocês estão passando a noite diante da muralha? Se fizerem isso de novo, porei as mãos em vocês[a].” Desde então, eles não vieram mais no sábado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “usarei a força contra vocês”. A expressão hebraica diz literalmente: “enviarei a mão contra vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: eu os adverti
  rationale: O hifil de עוד expressa aqui uma advertência solene diante da conduta dos comerciantes; “adverti” é claro, digno e natural em português.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: e lhes disse
  rationale: Reproduz com naturalidade a sequência narrativa hebraica e mantém explícitos os destinatários.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo direto e natural.
- source_word: לֵנִים
  choice: estão passando a noite
  rationale: Expressa o sentido de לון/לין, isto é, alojar-se ou permanecer durante a noite.
- source_word: נֶגֶד הַחוֹמָה
  choice: diante da muralha
  rationale: נֶגֶד indica posição em frente ou defronte da muralha. “Diante da muralha” preserva essa localização sem acrescentar explicitamente “fora”, embora o contexto o sugira.
- source_word: אִם תִּשְׁנוּ
  choice: Se fizerem isso de novo
  rationale: O verbo שנה significa repetir ou fazer novamente; “isso” explicita de modo natural a ação subentendida pelo contexto.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: porei as mãos em vocês
  rationale: Mantém em português a imagem corporal da expressão hebraica e comunica uma ameaça de intervenção direta, sem especificar indevidamente a forma exata da força.
- source_word: מִן הָעֵת הַהִיא
  choice: Desde então
  rationale: Forma portuguesa concisa e idiomática para indicar o resultado contínuo a partir daquele momento.
- source_word: לֹא בָאוּ
  choice: eles não vieram mais
  rationale: O acréscimo idiomático de “mais” deixa claro que, depois da advertência, cessaram as vindas, sentido indicado pela expressão temporal anterior.
- source_word: בַּשַּׁבָּת
  choice: no sábado
  rationale: Equivalente corrente de שַׁבָּת em português; neste contexto designa o sábado como dia observado.
