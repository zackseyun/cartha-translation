base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: pt
  text: E um dos filhos de Joiada, filho do sumo sacerdote Eliasibe, era genro[a] de Sambalate, o horonita. E eu o expulsei[b] de junto de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo, “era parente de Sambalate por casamento”. O termo hebraico indica uma relação matrimonial; neste contexto, “genro” é a interpretação específica mais natural.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu o afugentei” ou “eu o mandei embora”. O verbo hebraico enfatiza uma remoção forçada, mas não especifica a forma administrativa da medida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: E um dos filhos de
  rationale: 'A combinação da conjunção com a preposição e o substantivo forma uma expressão partitiva: trata-se de um dentre os filhos de Joiada.'
- source_word: יוֹיָדָע
  choice: Joiada
  rationale: Transliteração portuguesa corrente do nome hebraico neste contexto.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: filho do sumo sacerdote Eliasibe
  rationale: A construção filial é preservada; a posição do título em português deixa claro, de modo natural, que Eliasibe era o sumo sacerdote.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: sumo sacerdote
  rationale: Equivalente consagrado e exato do título hebraico, mais natural que uma tradução literal como 'grande sacerdote'.
- source_word: חָתָן לְסַנְבַלַּט
  choice: era genro de Sambalate
  rationale: חָתָן designa parentesco por casamento e, neste contexto, 'genro' é a leitura específica mais natural; a possibilidade mais ampla é registrada em nota.
- source_word: הַחֹרֹנִי
  choice: o horonita
  rationale: O gentílico identificador é mantido segundo a forma portuguesa tradicional.
- source_word: וָאַבְרִיחֵהוּ
  choice: Por isso, eu o expulsei
  rationale: O hifil de ברח expressa fazer alguém fugir ou removê-lo à força. 'Expulsei' comunica a ação enérgica sem especificar um procedimento jurídico formal; 'por isso' torna explícita em português a consequência narrativa indicada pela sequência hebraica.
- source_word: מֵעָלָי
  choice: da minha presença
  rationale: A expressão, literalmente 'de sobre mim', indica afastamento da presença ou esfera de autoridade de Neemias. Esta formulação evita a possível leitura meramente relacional de 'de mim'.
