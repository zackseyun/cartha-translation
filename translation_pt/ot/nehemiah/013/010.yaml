base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: pt
  text: E fiquei sabendo que as porções destinadas aos levitas não lhes tinham sido entregues[a]; por isso, os levitas e os cantores que realizavam o serviço fugiram, cada um para o seu campo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as porções prescritas destinadas aos levitas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “cada um para o seu campo”.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: E fiquei sabendo
  rationale: No contexto narrativo, ידע indica que Neemias tomou conhecimento da situação; “fiquei sabendo” expressa essa descoberta com naturalidade.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: as porções dos levitas
  rationale: מְנָיוֹת designa as provisões ou parcelas de sustento atribuídas aos levitas. A construção “dos levitas” preserva de modo natural a relação expressa no hebraico.
- source_word: לֹא נִתָּנָה
  choice: não tinham sido entregues
  rationale: Mantém a voz passiva de נתן e, em português, concorda com “porções”; o mais-que-perfeito composto deixa clara a anterioridade em relação à descoberta de Neemias.
- source_word: וַיִּבְרְחוּ
  choice: tinham fugido
  rationale: ברח significa fugir, não apenas voltar. O tempo verbal português apresenta a fuga como consequência já ocorrida quando Neemias tomou conhecimento do problema.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: cada um para o seu campo
  rationale: Reproduz a força distributiva de אִישׁ e o sentido agrícola de שָׂדֶה sem transformar o campo genericamente em residência ou região.
- source_word: וְהַמְשֹׁרְרִים
  choice: e os cantores
  rationale: Tradução direta do grupo de cantores ligado ao serviço do templo, sem acrescentar uma especificação ausente no texto.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: que realizavam o serviço
  rationale: A expressão participial modifica levitas e cantores. “Serviço” é natural no contexto cultual e preserva a referência ampla da atividade sem defini-la em excesso.
theological_decisions: []
