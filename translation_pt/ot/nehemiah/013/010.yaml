- from: E fiquei sabendo que as porções dos levitas não tinham sido entregues[a]. Por isso, os levitas e os cantores que realizavam o serviço tinham fugido, cada um para o seu campo[b].
  to: E fiquei sabendo que as porções destinadas aos levitas não lhes tinham sido entregues[a]; por isso, os levitas e os cantores que realizavam o serviço fugiram, cada um para o seu campo[b].
