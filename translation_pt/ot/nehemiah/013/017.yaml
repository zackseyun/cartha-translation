  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: pt
  text: 'Então confrontei os nobres de Judá e lhes disse: “Que mal é este que vocês estão fazendo, profanando o dia do sábado?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “violando” ou “dessacralizando o dia do sábado”. O verbo hebraico transmite a ideia de tratar como comum aquilo que é santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Então confrontei
  rationale: O verbo ריב expressa confronto, contestação ou repreensão. “Confrontei” preserva a força adversativa sem sugerir necessariamente um processo judicial formal; “então” representa naturalmente a sequência narrativa.
- source_word: חֹרֵי יְהוּדָה
  choice: os nobres de Judá
  rationale: חֹרִים designa membros proeminentes ou aristocráticos da sociedade. “Nobres” é claro, tradicional e adequado ao contexto.
- source_word: וָאֹמְרָה לָהֶם
  choice: e lhes disse
  rationale: Tradução direta e idiomática da continuação narrativa, com o pronome oblíquo retomando os nobres.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Que mal é este
  rationale: A formulação portuguesa transmite com naturalidade a censura moral de רָע, sem a rigidez de “Que coisa má é esta”.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: que vocês estão fazendo
  rationale: Preserva a ação em andamento expressa pelo particípio e emprega uma forma amplamente compreensível no português moderno, com boa legibilidade brasileira.
- source_word: וּמְחַלְּלִים
  choice: profanando
  rationale: חלל, neste uso, significa retirar o caráter santo ou tratar como comum aquilo que é sagrado. “Profanando” conserva essa dimensão de santidade melhor que uma tradução limitada à infração de uma regra.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: o dia do sábado
  rationale: Reproduz os dois elementos da expressão hebraica e soa natural em português bíblico contemporâneo.
theological_decisions:
- issue: Linguagem referente à violação do sábado
  choice: profanando o dia do sábado
  alternative: violando ou dessacralizando o dia do sábado
  rationale: O verbo hebraico enfatiza tratar como comum aquilo que é santo. “Profanando” mantém o peso teológico da santidade do sábado, sem reduzir a ação a uma simples transgressão normativa.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. “Vocês” evita a artificialidade de “vós” e torna explícito o plural presente no hebraico; “confrontei” comunica a intensidade de ריב em linguagem corrente.
