base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: pt
  text: Também naqueles dias, vi os judeus[a] que haviam se casado[b] com mulheres de Asdode, amonitas e moabitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os judeanos».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «haviam feito mulheres habitar»; neste contexto, a expressão hebraica significa que as haviam tomado por esposas.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Mantém a força aditiva do relato e soa natural em português.
- source_word: בַּיָּמִים הָהֵם
  choice: naqueles dias
  rationale: Reproduz a expressão temporal hebraica de modo corrente e digno.
- source_word: רָאִיתִי
  choice: vi
  rationale: Preserva o sentido comum do verbo e o tom de testemunho direto de Neemias.
- source_word: אֶת הַיְּהוּדִים
  choice: os judeus
  rationale: Identifica naturalmente a comunidade judaica pós-exílica; a alternativa geográfica «os judeanos» permanece possível e é registrada em nota.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: haviam se casado com mulheres
  rationale: Embora a construção signifique literalmente algo como «fizeram mulheres habitar», neste contexto ela funciona idiomaticamente para tomar mulheres por esposas. A formulação portuguesa comunica o sentido sem acrescentar interpretação doutrinária.
- source_word: אשדודיות
  choice: mulheres de Asdode
  rationale: Expressa de maneira clara e natural a procedência das mulheres, evitando um gentílico português pouco comum.
- source_word: עמוניות
  choice: amonitas
  rationale: Gentílico feminino corrente em português, concordando com «mulheres».
- source_word: מוֹאֲבִיּוֹת
  choice: moabitas
  rationale: Gentílico feminino corrente em português, concordando com «mulheres».
theological_decisions:
- issue: Sentido etnogeográfico de הַיְּהוּדִים
  choice: os judeus
  alternative: os judeanos
  rationale: No contexto de Esdras–Neemias, a expressão designa de modo natural a comunidade judaica pós-exílica, embora o valor mais geográfico «judeanos» seja lexicalmente possível.
- issue: Força idiomática de הֹשִׁיבוּ נָשִׁים
  choice: haviam se casado com mulheres
  alternative: haviam feito mulheres habitar / haviam tomado por esposas
  rationale: O contexto trata de uniões matrimoniais. A tradução explicita o sentido idiomático da construção hebraica sem resolver além do necessário a questão teológica dessas uniões.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «mulheres» antes de cada gentílico foi evitada porque a coordenação «mulheres de Asdode, amonitas e moabitas» é natural e inequívoca em português. Os marcadores foram vinculados às palavras e expressões a que suas notas efetivamente se referem.
