  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: pt
  text: Ele lhe preparou uma sala grande[a], onde antes costumavam guardar a oferta de cereal, o olíbano, os utensílios e o dízimo dos cereais, do vinho novo e do azeite — a porção prescrita para os levitas, os cantores e os porteiros[b] —, bem como a contribuição destinada aos sacerdotes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um depósito grande”. O termo hebraico pode designar uma sala usada para armazenamento dentro do complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o mandamento dos levitas, dos cantores e dos porteiros”; no contexto, provavelmente se refere à porção prescrita para eles.'
    reason: preserve_ambiguity
  - marker: c
    text: Ou “a oferta alçada dos sacerdotes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Ele lhe preparou
  rationale: Neste contexto, עשה com ל indica preparar ou providenciar um espaço para alguém. “Preparou” soa natural em português e não exige que a sala tenha sido construída do zero.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: uma sala grande
  rationale: לִשְׁכָּה designa uma sala ou câmara no complexo do templo, muitas vezes usada como depósito. “Sala” é clara no português moderno, enquanto a nota registra a função possível de depósito.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: onde antes costumavam guardar
  rationale: A construção היה + particípio expressa prática habitual no passado; לְפָנִים significa “antes, anteriormente”. “Guardar” se ajusta ao uso do recinto para armazenar provisões e objetos.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto do culto, מִנְחָה indica especificamente a oferta feita de cereal, e não uma oferta genérica.
- source_word: הַלְּבוֹנָה
  choice: o incenso
  rationale: לְבוֹנָה é olíbano, o incenso aromático empregado no culto. “Incenso” é o equivalente corrente e compreensível em português.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: כֵּלִים refere-se aos objetos ou instrumentos usados no serviço do templo. “Utensílios” é natural e mantém a referência funcional.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: o dízimo dos cereais, do vinho novo e do azeite
  rationale: 'מַעְשֵׂר é o décimo devido; דָּגָן, תִּירוֹשׁ e יִצְהָר formam a tríade agrícola tradicional: cereais, vinho novo e azeite.'
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: a porção prescrita para os levitas, os cantores e os porteiros
  rationale: A expressão hebraica é condensada, literalmente “o mandamento dos levitas...”. No contexto da lista de provisões, designa aquilo que foi prescrito para esses grupos; “porção prescrita” torna esse sentido claro sem alterar o referente coletivo singular.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: a contribuição destinada aos sacerdotes
  rationale: תְּרוּמָה é uma contribuição ou oferta separada para uso sagrado. “Destinada aos sacerdotes” preserva a provável relação de benefício sem recorrer ao tecnicismo “oferta alçada” no texto principal.
theological_decisions:
- issue: Sentido da expressão מִצְוַת aplicada aos levitas, cantores e porteiros
  choice: a porção prescrita para os levitas, os cantores e os porteiros
  alternative: o mandamento referente aos levitas, aos cantores e aos porteiros
  rationale: A sintaxe hebraica é elíptica e admite uma tradução mais literal, mas o contexto de dízimos armazenados favorece a referência à porção determinada para esses servidores. A nota conserva a forma literal e a ambiguidade textual.
- issue: Natureza de תְרוּמָה
  choice: contribuição destinada aos sacerdotes
  alternative: oferta alçada dos sacerdotes
  rationale: O termo pode funcionar como designação cultual técnica, mas aqui “contribuição” comunica o elemento essencial de algo separado e entregue, sem impor uma descrição ritual mais específica do que o contexto exige.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação destaca que a porção prescrita corresponde ao dízimo agrícola, enquanto a contribuição sacerdotal é mencionada separadamente.
