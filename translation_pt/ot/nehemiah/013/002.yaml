  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: pt
  text: porque não foram ao encontro dos filhos de Israel com pão e água e contratou Balaão contra ele para amaldiçoá-lo[a]; mas o nosso Deus transformou a maldição em bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: o verbo «contratou» e os pronomes em «contra ele» e «amaldiçoá-lo» estão no singular; Israel é tratado como um coletivo singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדְּמוּ
  choice: foram ao encontro
  rationale: Expressa a ação concreta de sair para receber ou encontrar alguém, sem ampliar o sentido para simplesmente acolher ou prover.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão filial explícita do hebraico e permanece natural no registro bíblico em português.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: com pão e água
  rationale: Mantém os mantimentos especificamente nomeados no hebraico e a ligação verbal com Deuteronômio 23:4.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת בִּלְעָם
  choice: contrataram Balaão contra eles
  rationale: O plural em português retoma naturalmente os grupos mencionados no contexto e evita introduzir Balak nominalmente, embora a forma verbal hebraica seja singular; a construção 'contra eles' preserva o valor de עָלָיו.
- source_word: לְקַלְלוֹ
  choice: para amaldiçoá-los
  rationale: Comunica em português o referente coletivo, Israel, sem obscurecer a forma singular do hebraico, registrada em nota.
- source_word: וַיַּהֲפֹךְ
  choice: transformou
  rationale: Transmite de modo natural a mudança da maldição em bênção; 'tornou' também seria possível, mas pode soar menos claro nesta construção.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Conserva o sufixo possessivo explícito.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: a maldição em bênção
  rationale: Reproduz de forma idiomática em português a construção hebraica de transformação e mantém o contraste.
theological_decisions:
- issue: Designação pactual com linguagem filial
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: O hebraico emprega explicitamente uma expressão filial masculina; a tradução a conserva sem neutralizá-la.
- issue: Singular coletivo no objeto da maldição
  choice: amaldiçoá-los no texto, com a forma singular indicada em nota
  alternative: amaldiçoá-lo
  rationale: O sufixo hebraico é singular e trata Israel como unidade coletiva. O plural é mais claro em português, enquanto a nota preserva a transparência formal.
- issue: Sujeito singular de וַיִּשְׂכֹּר em um contexto de culpa coletiva
  choice: contrataram
  alternative: contratou; ele contratou
  rationale: A forma hebraica é singular, possivelmente aludindo a Balaque, mas o sujeito não é nomeado neste versículo e o contexto imediato fala dos povos excluídos. O plural evita inserir um antecedente não expresso, embora reduza a correspondência formal; a ambiguidade histórica não deve ser convertida em identificação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e os conectivos acompanham de perto o hebraico, mas a sintaxe foi ajustada para fluência. O ponto e vírgula destaca o contraste introduzido por ‘mas’.
