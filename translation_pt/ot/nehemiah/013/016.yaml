base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: pt
  text: Também os tírios moravam nela, trazendo peixe e todo tipo de mercadoria e vendendo-os no sábado aos filhos de Judá e em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: Também os tírios
  rationale: O gentílico identifica pessoas de Tiro. “Também” liga esta prática às demais violações do sábado descritas no contexto.
- source_word: יָשְׁבוּ בָהּ
  choice: moravam nela
  rationale: ישׁב indica aqui residência; o pronome feminino “nela” preserva a referência à cidade de Jerusalém.
- source_word: מְבִיאִים
  choice: trazendo
  rationale: O particípio de בוא no Hifil descreve a atividade contínua de levar mercadorias para a cidade.
- source_word: דָּאג
  choice: peixe
  rationale: O substantivo designa peixe, tradução direta e natural no contexto de comércio.
- source_word: וְכָל מֶכֶר
  choice: e todo tipo de mercadoria
  rationale: מֶכֶר refere-se ao conjunto de artigos destinados à venda; a formulação comunica isso com clareza em português atual.
- source_word: וּמֹכְרִים
  choice: e vendendo-os
  rationale: O particípio dá continuidade à descrição da atividade habitual. O pronome retoma o peixe e os diversos artigos comercializados.
- source_word: בַּשַּׁבָּת
  choice: no sábado
  rationale: A expressão preserva o artigo definido e identifica o dia em que ocorria o comércio proibido.
- source_word: לִבְנֵי יְהוּדָה
  choice: aos filhos de Judá
  rationale: Mantém a expressão filial literal do hebraico, que no contexto designa a população de Judá, sem ocultar sua forma original.
- source_word: וּבִירוּשָׁלִָם
  choice: e em Jerusalém
  rationale: Preserva a coordenação hebraica e a possível ênfase de que as vendas aconteciam na própria Jerusalém, sem tornar essa ênfase explícita no texto principal.
