  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: pt
  text: Não fizeram o mesmo os seus antepassados, e o nosso Deus trouxe todo este mal[a] sobre nós e sobre esta cidade? Vocês, porém, estão aumentando a ira contra Israel ao profanarem o sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda esta desgraça” ou “toda esta calamidade”. Neste contexto de juízo divino, o termo hebraico pode designar uma calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: Não fizeram o mesmo
  rationale: Expressa de modo natural a pergunta retórica que espera concordância e retoma a conduta descrita no contexto.
- source_word: אֲבֹתֵיכֶם
  choice: os seus antepassados
  rationale: Comunica com clareza a referência às gerações anteriores; em português atual, evita que “pais” seja entendido apenas como os progenitores imediatos.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: e o nosso Deus trouxe
  rationale: Mantém explícito Deus como sujeito do juízo e preserva a coordenação do hebraico sem inserir uma formulação causal mais forte que a sintaxe.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: todo este mal
  rationale: Preserva a amplitude semântica de רָעָה, que aqui se refere ao mal sofrido como calamidade de juízo; a nota esclarece alternativas contextuais.
- source_word: וְעַל הָעִיר הַזֹּאת
  choice: e sobre esta cidade
  rationale: Conserva a repetição da preposição e o paralelismo entre o povo e a cidade.
- source_word: וְאַתֶּם
  choice: Vocês, porém
  rationale: O conectivo introduz um contraste entre o exemplo dos antepassados e a conduta presente; “porém” torna essa força discursiva natural em português.
- source_word: מוֹסִיפִים חָרוֹן
  choice: estão aumentando a ira
  rationale: A forma participial indica ação em curso. “Aumentando a ira” representa o sentido de acrescentar ou intensificar a ira sem explicitar além do texto de quem ela procede.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: ao profanarem o sábado
  rationale: Traduz a ideia de tornar o sábado profano ou tratá-lo como comum, e apresenta a profanação como o meio pelo qual aumentam a ira.
theological_decisions:
- issue: O sentido de רָעָה naquilo que Deus trouxe sobre o povo e a cidade
  choice: mal
  alternative: desgraça; calamidade
  rationale: “Mal” preserva a extensão lexical do termo hebraico, enquanto o contexto indica uma calamidade punitiva, não maldade moral praticada por Deus. A nota mantém essa nuance acessível.
- issue: A identidade da ira em חָרוֹן
  choice: a ira
  alternative: a ira de Deus; o furor
  rationale: O contexto aponta para a ira divina no âmbito do juízo da aliança, mas o hebraico não repete explicitamente “de Deus”. A tradução conserva essa tensão sem enfraquecer a linguagem de juízo nem tornar explícito o que está implícito.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural de segunda pessoa e “antepassados” para clareza contemporânea. A estrutura retórica e a linguagem direta do juízo divino foram preservadas.
