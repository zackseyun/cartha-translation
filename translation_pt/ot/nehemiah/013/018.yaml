  terminology: “Mal” mantém a amplitude de רָעָה, e a nota esclarece adequadamente o sentido contextual de calamidade no juízo. “Ira”, “profanarem” e “sábado” correspondem bem aos termos e ao registro do texto hebraico. A ausência de explicitação de que a ira é de Deus preserva o que está implícito, mas não repetido, no hebraico.
