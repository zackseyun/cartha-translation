  source_fidelity: A tradução conserva a pergunta retórica, a referência à conduta dos antepassados, Deus como aquele que trouxe o mal/calamidade sobre o povo e a cidade, e a acusação de aumentar a ira contra Israel mediante a profanação do sábado. “Antepassados” é uma adaptação lexical legítima de אֲבֹתֵיכֶם para a clareza contemporânea, sem alteração material do referente.
