base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: pt
  text: Naqueles dias, vi em Judá pessoas pisando uvas nos lagares no sábado, trazendo montes de cereal e carregando-os sobre jumentos. Traziam também vinho, uvas, figos e todo tipo de carga para Jerusalém no dia de sábado. Então as adverti solenemente no dia em que vendiam alimentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: pisando uvas nos lagares
  rationale: A expressão hebraica significa literalmente pisar lagares; explicitar 'uvas' torna a atividade compreensível em português sem alterar o sentido contextual.
- source_word: הָעֲרֵמוֹת
  choice: montes de cereal
  rationale: O substantivo indica montes ou pilhas; pelo contexto agrícola, 'cereal' expressa o conteúdo implícito, preservando a imagem do texto.
- source_word: וָאָעִיד
  choice: as adverti solenemente
  rationale: O verbo עוּד no hifil pode significar testemunhar contra, advertir ou protestar solenemente. Esta formulação natural mantém a força formal da repreensão.
- source_word: צָיִד
  choice: alimentos
  rationale: Aqui o termo designa provisões ou comida posta à venda; 'alimentos' é claro e adequado ao contexto comercial.
theological_decisions:
- issue: Natureza da repreensão de Neemias
  choice: as adverti solenemente
  alternative: testemunhei contra elas
  rationale: A escolha não acrescenta uma sanção religiosa específica e conserva a ideia de protesto ou advertência formal contida no verbo hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. A repetição de 'sábado' foi mantida por refletir a ênfase do hebraico; o período longo foi dividido para melhorar a clareza sem mudar a progressão narrativa.
