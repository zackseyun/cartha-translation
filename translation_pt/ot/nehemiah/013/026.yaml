base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: pt
  text: Não foi por causa dessas coisas que Salomão, rei de Israel, pecou? E, entre as muitas nações, não houve rei semelhante a ele; ele era amado por seu Deus, e Deus o constituiu rei sobre todo Israel. Até mesmo ele foi levado a pecar pelas mulheres estrangeiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as esposas estrangeiras”. O hebraico diz literalmente “as mulheres estrangeiras”; “esposas” é uma alternativa indicada pelo relato sobre Salomão, mas não está explícita neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Não foi por causa dessas coisas que
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e expressa naturalmente o valor causal de עַל.
- source_word: חָטָא שְׁלֹמֹה מֶלֶךְ יִשְׂרָאֵל
  choice: Salomão, rei de Israel, pecou
  rationale: Mantém o sentido moral e religioso de חטא e apresenta o título em aposição clara.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Entre as muitas nações não houve rei semelhante a ele
  rationale: Reproduz a comparação ampla do hebraico sem especificar quais nações estão em vista.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Ele era amado por seu Deus
  rationale: Expressa o valor passivo/adjetival de אָהוּב e conserva o sufixo possessivo de אֱלֹהָיו.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ עַל כָּל יִשְׂרָאֵל
  choice: e Deus o constituiu rei sobre todo o Israel
  rationale: Neste contexto, נתן indica colocação ou nomeação para o ofício; “constituiu” é digno, claro e próximo da construção hebraica.
- source_word: גַּם אוֹתוֹ הֶחֱטִיאוּ
  choice: Contudo, até ele ... levaram a pecar
  rationale: “Até ele” conserva a ênfase do objeto antecipado, enquanto “levaram a pecar” comunica de modo natural o causativo hifil de חטא.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: as mulheres estrangeiras
  rationale: Traduz literalmente o sintagma definido sem substituir “mulheres” por “esposas”, embora o contexto narrativo permita essa compreensão.
theological_decisions:
- issue: Atribuição do pecado de Salomão às mulheres estrangeiras
  choice: “as mulheres estrangeiras levaram [Salomão] a pecar”
  alternative: “as mulheres estrangeiras o fizeram pecar”
  rationale: Mantém a força causativa explícita do verbo sem acrescentar um mecanismo de tentação, idolatria ou aliança política que este versículo não formula.
- issue: Referência a Deus
  choice: “seu Deus” e depois “Deus”
  alternative: Repetir “seu Deus” nas duas orações
  rationale: O hebraico usa primeiro אֱלֹהָיו, com sufixo possessivo, e depois אֱלֹהִים sem sufixo. A tradução preserva essa mudança e não introduz o nome divino ausente.
- issue: Singularidade de Salomão entre as nações
  choice: “não houve rei semelhante a ele”
  alternative: “não havia rei como ele”
  rationale: A formulação conserva o elogio comparativo do texto sem transformá-lo numa afirmação doutrinária absoluta além do âmbito retórico do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem enfática “até ele” foi preservada, e “levaram a pecar” evita a rigidez de um causativo excessivamente literal.
