  to: Não foi por causa dessas coisas que Salomão, rei de Israel, pecou? E, entre as muitas nações, não houve rei semelhante a ele; ele era amado por seu Deus, e Deus o constituiu rei sobre todo Israel. Até mesmo ele foi levado a pecar pelas mulheres estrangeiras.[a]
