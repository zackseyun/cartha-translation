    text: 'Ou: “Metade dos filhos deles falava asdodita, e eles não sabiam falar judaico, mas falavam conforme a língua de cada povo.”'
    reason: A sintaxe hebraica permite conservar os gentílicos como nomes de idiomas e entender a expressão final em sentido distributivo.
  revision_rationale: A revisão conserva as escolhas terminológicas do projeto, mas restaura o plural dos predicados que seguem o sintagma partitivo e fornece, na oração final, o verbo exigido pela fluência do português. Não resolve além do necessário a referência distributiva da expressão hebraica final.
