  rationale: A revisão conserva as escolhas terminológicas do projeto, mas restaura o plural dos predicados que seguem o sintagma partitivo e fornece, na oração final, o verbo exigido pela fluência do português. Não resolve além do necessário a referência distributiva da expressão hebraica final.
