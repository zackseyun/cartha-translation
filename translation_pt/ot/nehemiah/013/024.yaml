  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: pt
  text: Metade dos filhos deles falava a língua de Asdode[a], e eles não sabiam falar a língua de Judá, mas falavam a língua de um povo ou de outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Metade dos filhos deles falava asdodita, e eles não sabiam falar judaico, mas falavam conforme a língua de cada povo.”'
    reason: A sintaxe hebraica permite conservar os gentílicos como nomes de idiomas e entender a expressão final em sentido distributivo.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: os filhos deles
  rationale: Embora בנים possa designar especificamente filhos homens, neste contexto refere-se naturalmente aos descendentes das famílias mistas; “filhos” é corrente em português e não exige restringir o sentido aos homens.
- source_word: חֲצִי
  choice: Metade
  rationale: Indica que apenas uma parte dos filhos estava em vista. A formulação “Metade dos filhos deles” reproduz com clareza a relação partitiva.
- source_word: מְדַבֵּר
  choice: falava
  rationale: O particípio descreve a prática ou capacidade linguística característica desse grupo; o imperfeito é natural no contexto narrativo português.
- source_word: אַשְׁדּוֹדִית
  choice: a língua de Asdode
  rationale: O gentílico feminino designa a fala associada a Asdode. A expressão explícita é mais imediatamente compreensível que o raro adjetivo “asdodita”.
- source_word: וְאֵינָם מַכִּירִים
  choice: e não sabia
  rationale: Com o infinitivo seguinte, הכיר expressa conhecimento ou capacidade prática. “Não sabia falar” mantém essa nuance sem reduzi-la a mero reconhecimento nem apresentar a incapacidade como necessariamente física.
- source_word: לְדַבֵּר יְהוּדִית
  choice: falar a língua de Judá
  rationale: יְהוּדִית é a língua de Judá ou dos judeus/judaítas. “Língua de Judá” preserva a designação geográfica e evita identificar explicitamente o idioma como hebraico, algo que o texto não faz.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: mas a língua de um povo ou de outro
  rationale: A repetição distributiva עַם וָעָם aponta para as línguas dos diversos povos. A formulação conserva a construção elíptica do hebraico e evita acrescentar “somente”, que não está expresso.
theological_decisions:
- issue: Identificação da “língua de Judá”
  choice: língua de Judá
  alternative: hebraico
  rationale: O texto nomeia o idioma por sua associação com Judá, sem empregar o termo “hebraico”. A tradução evita uma identificação histórica mais específica que o próprio versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preferiu-se “língua de Asdode” e “língua de Judá” aos adjetivos pouco usuais “asdodita” e “judaico”. O singular “não sabia” concorda com o coletivo partitivo “metade”; a nota registra a possível retomada plural do hebraico.
