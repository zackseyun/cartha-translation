base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: pt
  text: Naquele dia, o Livro de Moisés[a] foi lido perante o povo, e nele se achou escrito que nenhum amonita ou moabita jamais entrará na assembleia de Deus[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rolo de Moisés”. A palavra hebraica pode designar um livro ou um rolo.
    reason: lexical_alternative
  - marker: b
    text: Ou “congregação de Deus”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural a referência a uma ocasião específica.
- source_word: נִקְרָא בְּסֵפֶר מֹשֶׁה
  choice: o Livro de Moisés foi lido
  rationale: Mantém a construção passiva do hebraico. סֵפֶר pode designar livro ou rolo; a alternativa é registrada em nota.
- source_word: בְּאָזְנֵי הָעָם
  choice: perante o povo
  rationale: Traduz de modo corrente o idioma hebraico literalmente relacionado aos ouvidos, indicando uma leitura pública para o povo ouvir.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: e nele se achou escrito
  rationale: Preserva tanto a referência ao Livro de Moisés quanto o caráter passivo da formulação hebraica.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: nenhum amonita ou moabita
  rationale: 'Sob a negação, a coordenação tem sentido distributivo: ninguém pertencente a qualquer um dos dois povos.'
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: na assembleia de Deus
  rationale: קָהָל designa a comunidade reunida; “assembleia” preserva o sentido sem introduzir terminologia eclesiástica posterior.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: No contexto da proibição citada, transmite de maneira idiomática a duração indefinida ou perpétua expressa pelo hebraico.
theological_decisions:
- issue: Sentido de בִּקְהַל הָאֱלֹהִים
  choice: assembleia de Deus
  alternative: congregação de Deus
  rationale: Mantém a relação genitiva e a identidade comunitária do grupo reunido sem definir além do que o texto afirma.
- issue: Força de עַד עוֹלָם na fórmula de exclusão
  choice: jamais entraria
  alternative: não entraria para sempre
  rationale: Conserva a força duradoura da proibição em português natural, sem resolver questões sobre sua aplicação para além da formulação do texto citado.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A redação mantém a voz passiva e o tom de citação legal do hebraico, evitando explicitar “em voz alta”, elemento apenas implícito no contexto.
