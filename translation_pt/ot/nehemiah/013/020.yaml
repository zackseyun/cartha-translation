  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: pt
  text: Então os comerciantes e os vendedores de todo tipo de mercadoria passaram a noite fora de Jerusalém uma ou duas vezes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma vez e duas”, expressão que significa “uma ou duas vezes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: passaram a noite
  rationale: O verbo לון indica passar a noite ou pernoitar. “Passaram a noite” é natural, claro e preserva o sentido temporal.
- source_word: הָרֹכְלִים
  choice: os comerciantes
  rationale: רֹכֵל designa quem negocia ou comercializa bens. “Comerciantes” é corrente e adequado ao contexto.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: e os vendedores de todo tipo de mercadoria
  rationale: A expressão abrange vendedores de toda espécie de artigo comercializável. Esta formulação conserva a amplitude de כָל מִמְכָּר em português natural.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: fora de Jerusalém
  rationale: מִחוּץ indica uma localização exterior à cidade; “fora de Jerusalém” é a forma idiomática e clara em português.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: uma ou duas vezes
  rationale: A expressão hebraica, literalmente “uma vez e duas”, é uma locução que indica uma ou duas ocasiões, sem sugerir repetição frequente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue de perto a estrutura e o sentido do hebraico, usando equivalência ótima. Não foi acrescentada nota para “passaram a noite”, pois a alternativa “pernoitaram” não representa ambiguidade relevante e seria menos corrente.
