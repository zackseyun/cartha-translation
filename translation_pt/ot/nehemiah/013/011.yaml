  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָרִ֨יבָ/ה֙ אֶת הַ/סְּגָנִ֔ים וָ/אֹ֣מְרָ֔/ה מַדּ֖וּעַ נֶעֱזַ֣ב בֵּית הָ/אֱלֹהִ֑ים וָֽ/אֶ֨קְבְּצֵ֔/ם וָֽ/אַעֲמִדֵ֖/ם עַל עָמְדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: pt
  text: 'Então confrontei os oficiais e lhes perguntei: “Por que a casa de Deus foi deixada ao abandono[a]?” Depois reuni os levitas e os coloquei em seus postos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi abandonada” ou “foi negligenciada”. O verbo hebraico pode indicar que algo foi deixado ou desamparado; neste contexto, trata-se da falta de sustento e da consequente interrupção dos serviços da casa de Deus.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os fiz ficar no lugar deles”. A expressão indica que os levitas foram reconduzidos às funções que lhes cabiam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: confrontei
  rationale: O verbo ריב indica entrar em controvérsia ou contenda. “Confrontei” comunica com naturalidade a ação firme de Nehemias sem limitá-la a uma simples repreensão verbal.
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: סְגָנִים designa autoridades administrativas subordinadas; “oficiais” é claro e adequado ao contexto civil.
- source_word: וָאֹמְרָה
  choice: lhes perguntei
  rationale: Embora a forma signifique literalmente “e disse”, a fala introduzida é uma pergunta dirigida aos oficiais; “lhes perguntei” expressa naturalmente essa função em português.
- source_word: נֶעֱזַב
  choice: foi deixada ao abandono
  rationale: O passivo de עזב pode indicar deixar, abandonar ou negligenciar. A formulação preserva a força do abandono sem afirmar que o templo tenha sido completamente desocupado.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica e seu peso religioso, sem substituí-la interpretativamente por “templo”.
- source_word: וָאֶקְבְּצֵם
  choice: reuni os levitas
  rationale: קבץ significa reunir. O pronome hebraico remete, pelo contexto imediato do versículo anterior, aos levitas; explicitar o referente evita ambiguidade pronominal em português.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: os coloquei em seus postos
  rationale: A combinação do hifil de עמד com עַל עָמְדָם descreve a restituição do pessoal às posições ou funções que lhe cabiam. A expressão é idiomática e clara em português.
theological_decisions:
- issue: Identidade do grupo reunido
  choice: Explicitar “os levitas” no texto
  alternative: Manter apenas “os reuni”
  rationale: O sufixo masculino plural não identifica sozinho o referente, mas o contexto de Neemias 13:10 menciona os levitas que haviam voltado aos seus campos. A explicitação favorece a compreensão sem introduzir uma distinção doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. “Casa de Deus” preserva a formulação hebraica; “postos” comunica de modo natural as funções designadas. Os marcadores aparecem junto às expressões que explicam.
