base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: pt
  text: Lembra-te deles[a], meu Deus, porque profanaram o sacerdócio e a aliança do sacerdócio e dos levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Lembra-te deles, meu Deus, por causa dos que profanaram o sacerdócio e a aliança do sacerdócio e dos levitas.”'
    reason: Alternativa lexical e sintática que conserva a forma participial de גָּאֳלֵי e a construção com עַל.
lexical_decisions:
- source_word: זָכְרָה
  choice: Lembra-te
  rationale: Mantém o apelo direto a Deus, característico das orações de Neemias, sem inserir no próprio verbo a ideia de juízo.
- source_word: לָהֶם
  choice: deles
  rationale: Traduz o pronome regido por ל de modo natural; o sentido desfavorável decorre da acusação que vem em seguida.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz o substantivo com o sufixo de primeira pessoa do singular e preserva a forma pessoal da oração.
- source_word: עַל
  choice: porque
  rationale: 'Expressa, em português corrente, a força causal da preposição neste contexto: a profanação é o fundamento do pedido.'
- source_word: גָּאֳלֵי
  choice: profanaram
  rationale: O particípio substantivado deriva de גאל no sentido de profanar ou contaminar. A forma verbal torna a relação com “deles” clara e natural em português.
- source_word: הַכְּהֻנָּה
  choice: o sacerdócio
  rationale: Preserva a referência à instituição ou condição sacerdotal, e não apenas aos sacerdotes individualmente.
- source_word: וּבְרִית הַכְּהֻנָּה
  choice: e a aliança do sacerdócio
  rationale: Mantém a relação genitiva compacta do hebraico sem decidir se a aliança foi feita com os sacerdotes ou se diz respeito ao sacerdócio.
- source_word: וְהַלְוִיִּם
  choice: e dos levitas
  rationale: Liga os levitas à expressão sobre a aliança, conforme a leitura sintática mais provável, deixando implícita a coordenação condensada do hebraico.
theological_decisions:
- issue: Se o pedido para Deus se lembrar dos ofensores é favorável ou desfavorável
  choice: Recordação desfavorável, em vista da profanação cometida
  alternative: Um pedido neutro para que Deus simplesmente se lembre deles
  rationale: O verbo “lembrar” pode introduzir pedidos favoráveis ou judiciais. Aqui, a acusação subsequente determina o sentido desfavorável, sem que seja necessário acrescentar “contra eles” ao verbo.
- issue: Alcance da expressão “a aliança do sacerdócio e dos levitas”
  choice: Uma aliança relacionada ao sacerdócio e aos levitas em conjunto
  alternative: A aliança do sacerdócio, seguida de uma referência separada aos levitas; ou a aliança feita com sacerdotes e levitas
  rationale: A sintaxe hebraica é condensada. O texto principal conserva essa relação sem especificar além da evidência se a aliança é com esses grupos ou se pertence institucionalmente a eles.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lembra-te” preserva o tom solene da oração sem soar arcaico; “profanaram” comunica adequadamente uma violação de caráter sagrado.
