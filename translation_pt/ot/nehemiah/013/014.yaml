base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: pt
  text: Lembra-te de mim por causa disso, meu Deus, e não apagues os meus atos de amor leal[a], que pratiquei em favor da casa do meu Deus e por seus serviços[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os meus atos de lealdade”, “as minhas bondades” ou “os meus atos de fidelidade à aliança”. A palavra hebraica pode expressar bondade, lealdade, amor fiel ou fidelidade à aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “por seus deveres” ou “por seus encargos”; isto é, os serviços e responsabilidades relacionados à casa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Lembra-te de mim
  rationale: A oração imperativa é dirigida a Deus; em português, esta é a forma idiomática e preserva o pedido pessoal.
- source_word: עַל זֹאת
  choice: por causa disso
  rationale: Retoma o que foi narrado anteriormente e comunica com naturalidade o valor causal ou referencial da preposição.
- source_word: וְאַל תֶּמַח
  choice: e não apagues
  rationale: Preserva a imagem hebraica de apagar ou eliminar algo do registro ou da memória.
- source_word: חֲסָדַי
  choice: os meus atos de amor leal
  rationale: O plural, explicado pela oração relativa, aponta para ações concretas; 'amor leal' mantém as nuances de bondade, lealdade e fidelidade associadas a חֶסֶד sem reduzir o termo a simples boas obras.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que pratiquei
  rationale: Expressa de modo natural que Neemias realizou esses atos, evitando a construção menos fluida 'atos que fiz'.
- source_word: בְּבֵית אֱלֹהַי
  choice: em favor da casa do meu Deus
  rationale: No contexto do serviço do templo, comunica ações realizadas em benefício da casa de Deus, embora בְ também possa ser entendido localmente como 'na'.
- source_word: וּבְמִשְׁמָרָיו
  choice: e das responsabilidades ligadas a ela
  rationale: מִשְׁמָר designa encargos, deveres ou observâncias; a formulação esclarece que se trata das responsabilidades relacionadas à casa de Deus.
theological_decisions:
- issue: Sentido de חֲסָדַי na oração em primeira pessoa
  choice: os meus atos de amor leal
  alternative: as minhas bondades; os meus atos de lealdade; os meus atos de fidelidade à aliança
  rationale: A tradução conserva o peso relacional e pactual possível do termo, sem transformar a fala de Neemias numa afirmação doutrinária explícita sobre mérito.
- issue: Tom potencialmente meritório do pedido
  choice: Manter o apelo direto para que Deus se lembre de Neemias e não apague seus atos
  alternative: Atenuar ou parafrasear a referência às ações de Neemias
  rationale: O hebraico apresenta sem rodeios o pedido de Neemias. A tensão teológica deve permanecer no texto, sem ser suavizada por interpretação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com colocação pronominal natural na oração solene. A formulação preserva a metáfora de apagar, a referência pessoal de Neemias e a amplitude semântica de חֶסֶד. Todos os marcadores de nota aparecem junto às expressões que explicam.
