  text: וַ/יְהִ֖י כְּ/שָׁמְעָ֣/ם אֶת הַ/תּוֹרָ֑ה וַ/יַּבְדִּ֥ילוּ כָל עֵ֖רֶב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: pt
  text: Quando ouviram a Lei, separaram de Israel todo o grupo misto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as pessoas de ascendência mista” ou “toda a multidão misturada”. O termo hebraico é coletivo e designa um grupo composto de pessoas diversas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Quando
  rationale: A forma narrativa introduz o acontecimento seguinte; em português natural, a conexão é adequadamente incorporada à oração temporal, sem a expressão mais rígida “e aconteceu que”.
- source_word: כְּשָׁמְעָם
  choice: ouviram
  rationale: 'A preposição כְּ com o infinitivo construto e o sufixo forma uma oração temporal: “quando ouviram”.'
- source_word: הַתּוֹרָה
  choice: a Lei
  rationale: Neste contexto pós-exílico de leitura pública e obediência à aliança, תּוֹרָה designa a Lei mosaica. “Lei” é clara para leitores gerais; a inicial maiúscula sinaliza esse referente específico.
- source_word: וַיַּבְדִּילוּ
  choice: separaram
  rationale: בדל expressa divisão ou separação. “Separaram” preserva a ação sem acrescentar uma motivação nem especificar além do texto a forma da exclusão.
- source_word: כָל עֵרֶב
  choice: toda a população mista
  rationale: עֵרֶב é um coletivo que designa uma mistura de pessoas ou um grupo misto. “População mista” comunica o sentido coletivo em português corrente, enquanto a nota preserva alternativas ligadas à possível ideia de ascendência.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מִן marca separação, e o nome próprio mantém a designação corporativa da comunidade da aliança.
theological_decisions:
- issue: Referente de “Israel” no contexto pós-exílico de pureza comunitária
  choice: Manter “Israel” como designação da comunidade da aliança.
  alternative: “dos israelitas” ou “da assembleia de Israel”
  rationale: O hebraico emprega diretamente o nome יִשְׂרָאֵל. Preservá-lo mantém a linguagem corporativa e pactual sem impor conclusões teológicas posteriores.
- issue: Identidade do coletivo עֵרֶב
  choice: Traduzir por “população mista”, preservando a natureza coletiva e certa abertura quanto ao tipo de mistura.
  alternative: “pessoas de ascendência mista”, “grupo misto” ou “multidão misturada”
  rationale: O termo pode apontar para uma coletividade composta por elementos diversos e, no contexto, possivelmente para pessoas de origem estrangeira ou ascendência mista. A tradução principal evita identificar de modo excessivamente específico quem integrava o grupo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A sintaxe é concisa e acompanha a sequência narrativa do hebraico. “População mista” evita o arcaísmo de “multidão misturada” e a interpretação mais específica de “estrangeiros”.
