  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: pt
  text: Eu disse aos levitas que se purificassem e viessem guardar os portões, para manter santo o dia de sábado. Lembra-te também disso em meu favor, ó meu Deus,[a] e tem compaixão de mim conforme a grandeza do teu amor leal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lembra-te também de mim por isso, ó meu Deus”. O idioma hebraico pode destacar tanto Neemias como a ação que ele acabou de mencionar.'
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz o hebraico hesed, que muitas vezes se refere ao amor fiel, à bondade e à misericórdia de Deus em seu compromisso com o seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: Eu disse aos levitas
  rationale: אמר significa literalmente “dizer”. A construção portuguesa com “disse ... que” comunica naturalmente a instrução administrativa sem intensificá-la para “ordenei”.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: que se purificassem
  rationale: A forma hitpael de טהר tem sentido reflexivo, e a construção com היה e particípio expressa a ação esperada dos levitas.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: e viessem guardar os portões
  rationale: A sequência participial descreve os levitas vindo para assumir a guarda. “Portões” identifica com clareza os acessos da cidade.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: para manter santo o dia de sábado
  rationale: קדשׁ indica separar ou conservar como santo. A formulação comunica em português corrente a finalidade da guarda dos portões.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: Lembra-te também disso em meu favor
  rationale: O imperativo pede que Deus leve em conta favoravelmente a ação mencionada. A redação preserva a referência mais imediata de זֹאת, sem ocultar a possível leitura pessoal do idioma.
- source_word: וְחוּסָה עָלַי
  choice: e tem compaixão de mim
  rationale: חוס pode exprimir poupar, ter piedade ou mostrar compaixão. No contexto de oração, “tem compaixão de mim” é natural e conserva o apelo à misericórdia divina.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: conforme a grandeza do teu amor leal
  rationale: רֹב indica grandeza ou abundância, enquanto חסד reúne as ideias de amor, lealdade e misericórdia constantes. “Amor leal” preserva esse peso relacional sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Sentido de חסד no apelo à compaixão divina
  choice: amor leal
  alternative: misericórdia; amor da aliança; bondade constante
  rationale: O termo não descreve apenas emoção ou clemência genérica, mas o amor fiel e constante de Deus. “Amor leal” mantém essa amplitude sem inserir uma formulação confessional específica.
- issue: Objeto do pedido divino de lembrança em זָכְרָה לִּי
  choice: Lembra-te também disso em meu favor
  alternative: Lembra-te também de mim por isso
  rationale: O demonstrativo זֹאת aponta naturalmente para a ação recém-mencionada, enquanto o dativo לִּי pode ter valor benefactivo. Como o idioma admite uma formulação mais centrada na pessoa, a alternativa é registrada em nota, sem eliminar a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais para leitores brasileiros. “Dia de sábado” evita uma formulação excessivamente técnica; “portões” esclarece o contexto urbano; e os vocativos e imperativos preservam o tom pessoal da oração.
