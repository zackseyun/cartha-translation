  text: וְ/לָ/כֶ֣ם הֲ/נִשְׁמַ֗ע לַ/עֲשֹׂת֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את לִ/מְעֹ֖ל בֵּֽ/אלֹהֵ֑י/נוּ לְ/הֹשִׁ֖יב נָשִׁ֥ים נָכְרִיּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: pt
  text: Será que devemos dar ouvidos a vocês[a] e cometer todo este grande mal, sendo infiéis ao nosso Deus ao tomarmos mulheres estrangeiras como esposas[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedecer a vocês”. O verbo hebraico pode ter o sentido de dar ouvidos a alguém ou de acatá-lo.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “fazer habitar mulheres estrangeiras”; neste contexto, a expressão se refere a tomá-las como esposas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: Será que devemos dar ouvidos a vocês
  rationale: A construção retórica com o nifal de שׁמע e o dativo וְלָכֶם pode expressar dar ouvidos ou atender a alguém. A formulação mantém o valor auditivo do verbo e, no contexto, sugere acatamento sem torná-lo explícito demais.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: e cometer todo este grande mal
  rationale: Embora עשה signifique normalmente fazer, com o objeto moral 'mal' o português idiomático pede 'cometer'. 'Todo este grande mal' preserva כָּל, a gravidade de גְּדוֹלָה e o demonstrativo הַזֹּאת.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: sendo infiéis ao nosso Deus
  rationale: מעל indica quebra de fidelidade ou traição, frequentemente com peso relacional e pactual. 'Ser infiel ao nosso Deus' comunica isso em português natural e digno.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: ao tomarmos mulheres estrangeiras como esposas
  rationale: O hifil de ישׁב significa literalmente fazer habitar. Neste contexto, a expressão se refere a introduzir mulheres estrangeiras no lar como esposas. A tradução explicita o sentido contextual, enquanto a nota preserva a forma literal.
theological_decisions:
- issue: Natureza da ofensa em לִמְעֹל בֵּאלֹהֵינוּ
  choice: infidelidade ao nosso Deus
  alternative: transgressão ritual contra o nosso Deus
  rationale: O verbo מעל denota quebra de fé e deslealdade, muitas vezes em contexto de aliança. A tradução conserva esse peso teológico sem restringir a falta a uma categoria meramente ritual.
- issue: Sentido da união com נָשִׁים נָכְרִיּוֹת
  choice: tomar mulheres estrangeiras como esposas
  alternative: fazer mulheres estrangeiras habitar
  rationale: O contexto imediato trata de casamentos com mulheres estrangeiras. A tradução comunica esse referente sem acrescentar uma avaliação étnica ou denominacional além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pergunta retórica foi preservada. 'Dar ouvidos' mantém a ambiguidade entre escutar e acatar; 'tomar como esposas' explicita o sentido contextual, e a literalidade é registrada em nota.
