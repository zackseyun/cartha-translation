  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: pt
  text: Assim, eu os purifiquei de tudo o que era estrangeiro e designei funções[a] para os sacerdotes e os levitas, cada um em seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os turnos” ou “os encargos de serviço”.
    reason: Alternativas lexicais para מִשְׁמָרוֹת, termo que pode designar turnos, responsabilidades ou funções organizadas de serviço.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Assim, eu os purifiquei
  rationale: O piel de טהר significa purificar ou limpar. “Purifiquei” preserva a dimensão de pureza ligada às reformas de Neemias; “Assim” expressa naturalmente o fluxo resultante do contexto, embora a conjunção também possa ser traduzida por “E”.
- source_word: מִכָּל נֵכָר
  choice: de tudo o que era estrangeiro
  rationale: נֵכָר designa aquilo que é estrangeiro ou alheio. A formulação mantém a amplitude do hebraico sem restringi-lo indevidamente a pessoas estrangeiras.
- source_word: וָאַעֲמִידָה
  choice: e estabeleci
  rationale: 'O hiphil de עמד tem aqui sentido administrativo: pôr em ordem, estabelecer ou designar. “Estabeleci” combina de modo natural com as funções sacerdotais e levíticas.'
- source_word: מִשְׁמָרוֹת
  choice: funções
  rationale: O termo pode indicar turnos, encargos, divisões ou responsabilidades de serviço. “Funções” é claro em português atual e comunica a organização do serviço, enquanto as alternativas principais são preservadas em nota.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: dos sacerdotes e dos levitas
  rationale: A construção portuguesa com “funções dos” transmite naturalmente que as responsabilidades foram estabelecidas para esses dois grupos, mantendo ambos explicitamente.
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: cada um em seu trabalho
  rationale: אִישׁ tem força distributiva neste contexto, e מְלָאכָה indica trabalho, tarefa ou serviço. A tradução conserva essa distribuição individual sem acrescentar uma referência masculina desnecessariamente marcada.
theological_decisions:
- issue: Alcance de “os” e de “tudo o que era estrangeiro”
  choice: A comunidade pertinente foi purificada de tudo o que era estrangeiro ou alheio.
  alternative: Eu os purifiquei de todos os estrangeiros; eu purifiquei os sacerdotes e os levitas de toda mulher estrangeira.
  rationale: O objeto pronominal e a expressão hebraica são mais amplos que essas interpretações específicas. O contexto envolve as reformas da aliança, mas o texto não deve ser limitado apenas à etnia, a estrangeiros como pessoas ou a casamentos mistos.
- issue: Força distributiva de אִישׁ
  choice: cada um em seu trabalho
  alternative: cada homem em seu trabalho
  rationale: No verso, אִישׁ distribui as responsabilidades entre os integrantes dos grupos sacerdotal e levítico; “cada um” comunica essa função com precisão e naturalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o hebraico sem soar artificial; a ambiguidade quanto ao alcance do elemento estrangeiro é preservada.
