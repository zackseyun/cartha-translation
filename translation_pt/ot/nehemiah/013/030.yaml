  verdict: revise
  source_fidelity: A tradução preserva adequadamente a purificação de «tudo o que era estrangeiro», sem reduzir a expressão a pessoas ou etnias, e mantém a distribuição de «cada um em seu trabalho». Contudo, «estabeleci as funções dos sacerdotes e dos levitas» pode sugerir que Neemias instituiu as próprias funções/ofícios desses grupos, enquanto o hebraico indica que ele estabeleceu/designou as escalas, responsabilidades ou atribuições para eles. A preposição «para» torna essa relação mais fiel e inequívoca.
  naturalness: O português é moderno, claro e de registro apropriado. «Designei funções para os sacerdotes e os levitas» é idiomático e expressa com mais precisão o sentido administrativo do verbo e a destinação das atribuições.
  terminology: «Purifiquei», «estrangeiro», «sacerdotes», «levitas» e «cada um em seu trabalho» são escolhas adequadas. «Funções» é uma boa equivalência acessível para מִשְׁמָרוֹת; a nota conserva alternativas pertinentes.
  issues:
