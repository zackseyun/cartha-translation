  verdict: revise
  source_fidelity: A tradução transmite a prontidão armada dos construtores e a proximidade do tocador do shofar. Contudo, «trabalhava» é mais amplo que o particípio repetido בונים («construíam/estavam construindo»), que deve ser preservado.
  naturalness: A redação é clara, mas «enquanto o homem que tocava ... permanecia» torna a construção temporal mais pesada do que o hebraico coordenado. Uma coordenação simples é mais natural e próxima da estrutura da frase.
  terminology: '«Espada», «cintura» e «shofar» são adequados. A nota deve definir o shofar com maior precisão: trata-se de um chifre de carneiro usado como instrumento de sopro, não simplesmente de uma «espécie de trombeta feita de chifre».'
