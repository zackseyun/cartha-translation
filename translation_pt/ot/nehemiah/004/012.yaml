  text: וְ/הַ֨/בּוֹנִ֔ים אִ֥ישׁ חַרְבּ֛/וֹ אֲסוּרִ֥ים עַל מָתְנָ֖י/ו וּ/בוֹנִ֑ים וְ/הַ/תּוֹקֵ֥עַ בַּ/שּׁוֹפָ֖ר אֶצְלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: pt
  text: E os construtores, cada um com a sua espada presa à cintura, construíam; e o que tocava o shofar[a] estava ao meu lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «trombeta». O shofar é um chifre de carneiro usado como instrumento de sopro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: os construtores / trabalhava
  rationale: O primeiro particípio funciona como substantivo coletivo, «os construtores»; o segundo retoma a ação de construir. Em português, a construção distributiva «cada um... trabalhava» expressa naturalmente a repetição da raiz hebraica, ainda que sem repeti-la lexicalmente.
- source_word: אִישׁ
  choice: cada um
  rationale: אִישׁ tem aqui sentido distributivo, referindo-se individualmente a todos os construtores.
- source_word: חַרְבּוֹ
  choice: a espada
  rationale: O possessivo hebraico é recuperado pelo sujeito distributivo «cada um»; «a espada» é idiomático em português nesse contexto.
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: presa à cintura
  rationale: A expressão indica que a espada estava amarrada ou fixada sobre os quadris/cintura. «Presa à cintura» é clara, atual e próxima da imagem hebraica.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: enquanto o homem que tocava o shofar
  rationale: O particípio designa a pessoa encarregada de soar o instrumento. «Tocava» é natural em português; «shofar» preserva a identificação específica do instrumento hebraico.
- source_word: אֶצְלִי
  choice: permanecia ao meu lado
  rationale: אֶצְלִי indica proximidade imediata. «Ao meu lado» comunica isso naturalmente; «permanecia» explicita de modo idiomático o estado nominal implícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação distributiva conserva a prontidão individual dos trabalhadores; «shofar» mantém a precisão cultural, com explicação em nota.
