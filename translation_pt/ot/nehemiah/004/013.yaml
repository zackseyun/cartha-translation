base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: pt
  text: 'E eu disse aos nobres, aos oficiais e ao restante do povo: “A obra é grande e extensa, e nós estamos separados ao longo da muralha, longe uns dos outros[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada um longe de seu irmão”, um idiomatismo hebraico com o sentido de “uns dos outros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: os nobres
  rationale: Em Neemias, o termo designa os membros da elite social e os líderes da comunidade; “nobres” é claro e adequado ao contexto.
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: O termo se refere a autoridades ou administradores subordinados. “Oficiais” comunica sua função pública sem especificar indevidamente o cargo.
- source_word: יֶתֶר הָעָם
  choice: o restante do povo
  rationale: Tradução direta e idiomática da expressão que abrange todos os demais além dos líderes já mencionados.
- source_word: הַמְּלָאכָה
  choice: a obra
  rationale: No contexto, refere-se ao trabalho de reconstrução da muralha. “Obra” é natural em português para um empreendimento de construção.
- source_word: הַרְבֵּה
  choice: grande
  rationale: O adjetivo descreve a magnitude do empreendimento; “grande” preserva de modo natural essa ideia.
- source_word: וּרְחָבָה
  choice: e se estende por uma área ampla
  rationale: O sentido básico é “larga, ampla”; no contexto, indica que o trabalho ocupa grande extensão. A formulação explicita essa dimensão espacial sem a reduzir apenas à quantidade de trabalho.
- source_word: נִפְרָדִים
  choice: separados
  rationale: O particípio passivo descreve os trabalhadores posicionados à distância entre si, sem sugerir conflito ou divisão de opinião.
- source_word: עַל הַחוֹמָה
  choice: ao longo da muralha
  rationale: Embora עַל possa significar “sobre”, aqui a distribuição dos trabalhadores por toda a extensão da muralha favorece “ao longo da muralha” em português.
- source_word: רְחוֹקִים
  choice: longe
  rationale: Expressa de maneira simples e natural a distância espacial entre os grupos de trabalhadores.
- source_word: אִישׁ מֵאָחִיו
  choice: uns dos outros
  rationale: A expressão literal “cada homem de seu irmão” funciona como idioma recíproco hebraico; “uns dos outros” transmite naturalmente o sentido.
