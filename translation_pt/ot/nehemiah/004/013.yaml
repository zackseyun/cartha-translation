  naturalness: O registro é moderno e acessível. “A obra é grande e extensa” exprime de forma mais direta e idiomática os dois predicados hebraicos do que “se estende por uma área ampla”, sem introduzir a explicitação “por uma área”.
  terminology: “Nobres”, “oficiais”, “restante do povo”, “obra” e “muralha” são escolhas adequadas. “Uns dos outros” traduz naturalmente o idiomatismo recíproco sem indevida ênfase masculina.
