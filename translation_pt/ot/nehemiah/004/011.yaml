base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: pt
  text: Os que construíam o muro e os que transportavam cargas, enquanto carregavam[a], faziam o trabalho com uma mão e, com a outra, seguravam a arma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “enquanto carregavam” é raro, e seu sentido exato é incerto. Pode referir-se aos trabalhadores que carregavam ou manejavam as cargas.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar mais especificamente uma lança, um dardo ou outra arma de arremesso.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: os que construíam o muro
  rationale: O particípio substantivado identifica os construtores; em português, a construção verbal é clara e natural. A preposição ב, neste contexto, indica o objeto ou local da construção, expresso idiomaticamente como “construíam o muro”.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: e os que carregavam as cargas
  rationale: נשא com סבל descreve o transporte de cargas ou materiais. A formulação mantém a imagem concreta sem restringir indevidamente o tipo de material.
- source_word: עֹמְשִׂים
  choice: ficavam carregados
  rationale: O particípio é raro e seu matiz exato é incerto. A tradução conserva a ideia provável de trabalhadores carregados ou ocupados com cargas, sem ocultar a dificuldade lexical.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: com uma das mãos, cada um fazia o trabalho
  rationale: 'O singular tem valor distributivo: cada trabalhador usava uma mão para trabalhar. “Cada um” torna essa distribuição explícita em português.'
- source_word: וְאַחַת מַחֲזֶקֶת הַשָּׁלַח
  choice: e, com a outra, segurava a arma
  rationale: A forma feminina pressupõe “mão”; por isso, “com a outra” é naturalmente suprido. הַשָּׁלַח pode designar uma arma de arremesso, lança ou dardo, mas “arma” evita precisão não garantida pelo contexto.
