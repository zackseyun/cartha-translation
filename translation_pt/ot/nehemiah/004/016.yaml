base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: pt
  text: 'Também naquele tempo eu disse ao povo: “Que cada homem e seu ajudante passem a noite dentro de Jerusalém, para que nos sirvam de guarda durante a noite e trabalhem durante o dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Também naquele tempo
  rationale: Preserva a força aditiva de גַּם e traduz de modo natural a expressão temporal בָּעֵת הַהִיא.
- source_word: אָמַרְתִּי לָעָם
  choice: eu disse ao povo
  rationale: Corresponde diretamente ao sentido usual de אָמַר e mantém linguagem corrente e digna.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: cada homem e seu ajudante
  rationale: אִישׁ tem valor distributivo neste contexto. נַעַר pode designar jovem, servo, assistente ou subordinado; “ajudante” evita impor idade ou condição servil não exigidas pelo contexto e se ajusta à equipe de trabalho e vigilância.
- source_word: יָלִינוּ בְּתוֹךְ יְרוּשָׁלִָם
  choice: passem a noite dentro de Jerusalém
  rationale: Expressa com clareza a permanência noturna indicada por לון/לין e o sentido locativo de בְּתוֹךְ.
- source_word: וְהָיוּ לָנוּ הַלַּיְלָה מִשְׁמָר
  choice: para que nos sirvam de guarda durante a noite
  rationale: O encadeamento é entendido naturalmente como finalidade ou resultado da ordem anterior. מִשְׁמָר designa vigilância ou guarda.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: e trabalhem durante o dia
  rationale: Converte a construção nominal concisa do hebraico em uma oração verbal idiomática, preservando o contraste entre guarda noturna e trabalho diurno.
