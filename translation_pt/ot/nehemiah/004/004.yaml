  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: pt
  text: 'E Judá disse[a]: “A força dos carregadores se esgotou, e há muito entulho[b], e não conseguimos construir a muralha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o povo de Judá disse”. O nome próprio singular “Judá” provavelmente representa aqui a comunidade como um todo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pó”; neste contexto, provavelmente os destroços ou o entulho da cidade arruinada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Judá
  rationale: Mantém o nome próprio no singular, como no hebraico, embora aqui provavelmente represente coletivamente a comunidade de Judá.
- source_word: כָּשַׁל
  choice: se esgotou
  rationale: Com ‘força’ como sujeito e num contexto de trabalho exaustivo, expressa de modo natural a ideia de falhar, fraquejar ou chegar ao limite.
- source_word: כֹּחַ
  choice: força
  rationale: Designa aqui a capacidade física dos trabalhadores.
- source_word: הַסַּבָּל
  choice: dos carregadores
  rationale: O substantivo se refere a quem transporta cargas. O plural comunica em português o sentido coletivo do singular hebraico.
- source_word: הֶעָפָר
  choice: entulho
  rationale: Embora o sentido básico seja ‘pó’ ou ‘terra’, no contexto das ruínas da cidade a referência provável é aos destroços acumulados.
- source_word: הַרְבֵּה
  choice: há muito
  rationale: Expressa abundância e forma, com ‘entulho’, uma construção portuguesa clara e idiomática.
- source_word: לֹא נוּכַל
  choice: não conseguimos
  rationale: Expressa incapacidade, não falta de disposição; o presente contextual transmite a impossibilidade enfrentada pelos trabalhadores.
- source_word: לִבְנוֹת
  choice: construir
  rationale: Traduz o verbo sem acrescentar explicitamente a noção de repetição contida apenas no contexto; por isso, não se adotou ‘reconstruir’.
- source_word: בַּחוֹמָה
  choice: construir a muralha
  rationale: Em português, esta é a formulação natural para o trabalho realizado na muralha; evita o pouco idiomático ‘construir na muralha’ sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação simples preserva o tom de queixa coletiva do hebraico, enquanto ‘carregadores’ explicita naturalmente o sentido coletivo do substantivo singular.
