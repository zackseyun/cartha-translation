  text: וָ/אֵ֣רֶא וָ/אָק֗וּם וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם אַל תִּֽירְא֖וּ מִ/פְּנֵי/הֶ֑ם אֶת אֲדֹנָ֞/י הַ/גָּד֤וֹל וְ/הַ/נּוֹרָא֙ זְכֹ֔רוּ וְ/הִֽלָּחֲמ֗וּ עַל אֲחֵי/כֶם֙ בְּנֵי/כֶ֣ם וּ/בְנֹתֵי/כֶ֔ם נְשֵׁי/כֶ֖ם וּ/בָתֵּי/כֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: pt
  text: 'Então olhei, levantei-me e disse aos nobres, aos oficiais e ao restante do povo: “Não tenham medo deles. Lembrem-se do Senhor, grande e temível[a], e lutem por seus irmãos[b], seus filhos, suas filhas, suas esposas e suas casas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “que inspira temor”. O adjetivo hebraico descreve quem desperta reverência e medo.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz um termo de parentesco no masculino plural. Em seguida, o versículo menciona separadamente filhos, filhas e esposas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Então olhei
  rationale: O verbo ראה integra a sequência narrativa e introduz a reação de Neemias. “Olhei” preserva o sentido ativo de observar antes de se levantar e falar; “vi” também seria possível.
- source_word: וָאָקוּם
  choice: levantei-me
  rationale: קום assinala aqui uma ação decidida. “Levantei-me” é natural em português contemporâneo e mantém a progressão narrativa.
- source_word: הַחֹרִים
  choice: os nobres
  rationale: חֹרִים designa líderes de posição social elevada; “nobres” é conciso e adequado ao contexto.
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: סְגָנִים refere-se a governantes subordinados ou administradores. “Oficiais” é claro e amplo sem impor um cargo mais específico do que o hebraico.
- source_word: יֶתֶר הָעָם
  choice: o restante do povo
  rationale: A expressão distingue o conjunto mais amplo da população dos líderes anteriormente mencionados.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Não tenham medo deles
  rationale: A construção com ירא e מִפְּנֵי expressa temor diante dos adversários. A formulação escolhida é direta e idiomática.
- source_word: אֶת אֲדֹנָי
  choice: o Senhor
  rationale: אֲדֹנָי é aqui um título divino. “Senhor” o distingue de uma ocorrência do nome יהוה, que exigiria outra convenção gráfica.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: grande e temível
  rationale: נוֹרָא descreve quem inspira reverência e temor. “Temível” conserva essa força melhor que opções modernas que poderiam sugerir apenas admiração.
- source_word: זְכֹרוּ
  choice: Lembrem-se
  rationale: O imperativo é direto e mantém o peso do chamado a trazer o Senhor à memória.
- source_word: וְהִלָּחֲמוּ עַל
  choice: e lutem por
  rationale: Neste contexto, a construção transmite a ideia de lutar em defesa de alguém.
- source_word: אֲחֵיכֶם
  choice: seus irmãos
  rationale: O termo de parentesco está no masculino plural. A tradução mantém essa forma, enquanto a nota registra seu caráter lexical.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: seus filhos, suas filhas, suas esposas e suas casas
  rationale: A enumeração concreta é preservada. “Esposas” explicita o sentido contextual de נָשִׁים, e “casas” mantém a amplitude de בָּתִּים, que pode abranger moradias e unidades familiares.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: o Soberano
  rationale: O texto traz אֲדֹנָי, não o tetragrama. “Senhor” é a forma tradicional e natural para o título, sem confundi-lo graficamente com יהוה.
- issue: Tradução de הַנּוֹרָא
  choice: temível
  alternative: inspirador de temor; terrível
  rationale: O adjetivo associa a grandeza de Deus ao temor reverente e serve de contraponto ao medo dos inimigos. “Temível” conserva essa tensão sem atribuir maldade a Deus nem enfraquecer o termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a sequência rápida das ações, os imperativos no plural e a enumeração concreta do hebraico. Os marcadores de nota foram posicionados junto aos termos efetivamente explicados.
