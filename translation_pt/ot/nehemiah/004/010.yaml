  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: pt
  text: E, daquele dia em diante, metade dos meus homens[a] trabalhava na obra, e a outra metade portava as lanças, os escudos, os arcos e as armaduras[b]; e os oficiais ficavam atrás de toda a casa de Judá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus jovens”, “meus servos” ou “meus auxiliares”; o termo hebraico pode ter esses sentidos conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “cotas de malha” ou “couraças”; o termo hebraico se refere a uma forma de proteção corporal.
    reason: lexical_alternative
  - marker: c
    text: A posição dos oficiais “atrás de toda a casa de Judá” pode indicar apoio militar ou supervisão dos trabalhadores judeus.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: meus homens
  rationale: O termo pode designar jovens, servos, auxiliares ou membros da comitiva. No contexto de trabalho e defesa, “meus homens” é natural e preserva a amplitude funcional; a nota registra alternativas mais literais.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: trabalhava na obra
  rationale: Expressa de modo corrente o envolvimento ativo na tarefa de reconstrução, mantendo o valor durativo do particípio.
- source_word: מַחֲזִיקִים
  choice: empunhava
  rationale: No contexto da lista de armas, “empunhava” comunica com clareza a ideia de segurá-las prontas para uso, sem reduzir a expressão a mera posse.
- source_word: הָרְמָחִים
  choice: as lanças
  rationale: Equivalente comum, claro e não excessivamente específico para רֹמַח.
- source_word: הַמָּגִנִּים
  choice: os escudos
  rationale: Tradução direta e corrente de מָגֵן.
- source_word: הַקְּשָׁתוֹת
  choice: os arcos
  rationale: Tradução direta do plural de קֶשֶׁת.
- source_word: הַשִּׁרְיֹנִים
  choice: as armaduras
  rationale: O termo indica proteção corporal, mas sua forma exata não é segura; “armaduras” evita precisão indevida.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto de organização defensiva, “oficiais” transmite a função de liderança sem sugerir necessariamente nobreza ou realeza.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: ficavam atrás de toda a casa de Judá
  rationale: Mantém o sentido espacial de אַחֲרֵי e a expressão corporativa “casa de Judá”. “Ficavam” fornece em português a cópula elíptica sem acrescentar a postura específica de estar em pé.
theological_decisions:
- issue: Função dos oficiais atrás da casa de Judá
  choice: 'Preservar a descrição espacial: “ficavam atrás”'
  alternative: “davam apoio a” ou “supervisionavam”
  rationale: O hebraico permite inferir apoio militar ou supervisão, mas não explicita a função; a tradução mantém a ambiguidade e a nota apresenta a possível implicação contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A concordância no singular (“metade... trabalhava”; “a outra metade empunhava”) segue os núcleos coletivos. A formulação preserva a expressão corporativa “casa de Judá” e evita explicitar além do hebraico a postura ou a função dos oficiais.
