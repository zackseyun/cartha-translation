base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: pt
  text: Nem eu, nem meus irmãos, nem meus rapazes, nem os homens da guarda que estavam atrás de mim tirávamos nossas roupas; cada um mantinha sua arma à mão, até para buscar água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico da última frase é difícil; literalmente, “cada um, sua arma, a água”. Pode significar que cada um mantinha sua arma à mão até para buscar água, ou que cada um ia buscar água levando sua arma.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: Nem ... tirávamos
  rationale: A partícula negativa com o particípio indica uma ação continuamente negada; o imperfeito português expressa naturalmente que, durante aquele período, eles não tiravam a roupa.
- source_word: אַחַי
  choice: meus irmãos
  rationale: Mantém o termo familiar literal, sem restringi-lo indevidamente a parentes ou ampliá-lo para companheiros.
- source_word: נְעָרַי
  choice: meus jovens
  rationale: Preserva a amplitude de נַעַר, que pode indicar jovens, servos ou auxiliares, sem especificar uma função não explicitada.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: os homens da guarda
  rationale: Comunica com clareza o sentido de guarda ou vigilância e conserva a referência masculina do hebraico.
- source_word: אֲשֶׁר אַחֲרַי
  choice: que estavam atrás de mim
  rationale: Preserva a formulação espacial do hebraico, adequada ao contexto de homens posicionados junto a Neemias.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: tirávamos nossas roupas
  rationale: Equivalente português corrente para retirar as vestes, sem o tom potencialmente excessivo de 'nos despíamos'.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o uso distributivo de אִישׁ em português natural.
- source_word: שִׁלְחוֹ
  choice: sua arma à mão
  rationale: שֶׁלַח designa uma arma, possivelmente de arremesso. 'À mão' expressa prontidão sem acrescentar ao texto hebraico a referência específica à mão direita.
- source_word: הַמָּיִם
  choice: até para buscar água
  rationale: A cláusula final é elíptica e difícil. Esta formulação apresenta uma interpretação contextual plausível — permanecer armado ao ir buscar água — sem incorporá-la silenciosamente como certeza, pois a ambiguidade é registrada em nota.
