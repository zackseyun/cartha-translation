translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto internacionalmente. O imperfeito sustenta a ideia de prática contínua. A expressão 'à mão' evita importar a 'mão direita', ausente no texto massorético, e a nota conserva a incerteza da cláusula final.
