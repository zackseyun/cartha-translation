  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: pt
  text: 'E os nossos adversários disseram: “Eles não saberão nem verão, até que entremos no meio deles[a], os matemos e façamos cessar a obra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre eles”.'
    reason: Alternativa lexical para אֶל תּוֹכָם, que pode ser expressa como entrada “no meio deles” ou chegada “entre eles”.
lexical_decisions:
- source_word: צָרֵינוּ
  choice: os nossos adversários
  rationale: צַר designa inimigos ou oponentes hostis. “Adversários” expressa a oposição ativa sem acrescentar ao hebraico.
- source_word: יֵדְעוּ
  choice: não saberão
  rationale: יָדַע refere-se aqui a ter conhecimento ou tomar ciência. A tradução direta preserva o paralelismo do hebraico.
- source_word: יִרְאוּ
  choice: nem verão
  rationale: רָאָה significa literalmente “ver”. Manter esse verbo conserva a formulação vívida e o paralelismo com “saberão”, sem excluir o sentido contextual de perceber.
- source_word: עַד אֲשֶׁר
  choice: até que
  rationale: A expressão marca o limite temporal durante o qual os trabalhadores permaneceriam sem perceber a aproximação dos adversários.
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: entremos no meio deles
  rationale: בּוֹא com אֶל תּוֹךְ indica movimento para o interior do grupo. “Entremos no meio deles” comunica naturalmente a infiltração ameaçadora.
- source_word: וַהֲרַגְנוּם
  choice: os matemos
  rationale: הָרַג é o verbo comum para matar. A formulação direta mantém a dureza explícita da ameaça.
- source_word: וְהִשְׁבַּתְנוּ
  choice: e façamos cessar
  rationale: 'O hifil de שׁבת é causativo: fazer parar ou cessar. “Façamos cessar” reproduz essa força e se ajusta ao registro digno.'
- source_word: הַמְּלָאכָה
  choice: a obra
  rationale: מְלָאכָה refere-se ao trabalho de reconstrução. “A obra” é claro no contexto e corrente na linguagem bíblica portuguesa.
theological_decisions: []
