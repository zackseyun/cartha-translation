  source_fidelity: 'A tradução reproduz adequadamente a sequência do hebraico: os inimigos ouviram que o plano se tornara conhecido ao povo e que Deus frustrara o conselho deles; então todos voltaram à muralha, cada um ao seu trabalho. «Muralha» é apropriado para הַחוֹמָה, e «todos nós» comunica כֻּלָּנוּ.'
