reference: Nehemiah 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: pt
  text: E aconteceu que, quando nossos inimigos ouviram que isso havia chegado ao nosso conhecimento[a] e que Deus havia frustrado o plano deles[b], todos nós voltamos à muralha, cada um ao seu trabalho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tínhamos tomado conhecimento disso”. O hebraico diz literalmente: “que isso se tornara conhecido para nós”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “havia desfeito o conselho deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cada homem ao seu trabalho”, expressão distributiva que se refere individualmente aos trabalhadores.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: E aconteceu que, quando
  rationale: Preserva o marcador narrativo וַיְהִי e o valor temporal de כַּאֲשֶׁר sem recorrer à fórmula arcaica “e sucedeu que”.
- source_word: אוֹיְבֵינוּ
  choice: nossos inimigos
  rationale: Equivalente direto e natural do substantivo com sufixo de primeira pessoa do plural.
- source_word: כִּי נוֹדַע לָנוּ
  choice: que isso havia chegado ao nosso conhecimento
  rationale: Mantém o sentido passivo do nifal de ידע e usa “isso” para o plano mencionado no contexto, sem tornar a frase obscura em português.
- source_word: וַיָּפֶר הָאֱלֹהִים אֶת־עֲצָתָם
  choice: e que Deus havia frustrado o plano deles
  rationale: הפר significa invalidar, impedir ou frustrar; עצה, neste contexto hostil, designa o plano dos inimigos. O mais-que-perfeito composto expressa naturalmente a sequência narrativa.
- source_word: וְנָשׁוּב כֻּלָּנוּ אֶל־הַחוֹמָה
  choice: todos nós voltamos à muralha
  rationale: שוב indica retorno, כֻּלָּנוּ inclui todo o grupo e הַחוֹמָה se refere à muralha de Jerusalém em reconstrução.
- source_word: אִישׁ אֶל־מְלַאכְתּוֹ
  choice: cada um ao seu trabalho
  rationale: Reproduz de forma natural em português a construção distributiva hebraica, sem perder a ideia de que cada trabalhador retomou sua tarefa.
theological_decisions:
- issue: Atribuição do fracasso do plano inimigo
  choice: Deus havia frustrado o plano deles
  alternative: as circunstâncias haviam impedido o plano deles
  rationale: O hebraico atribui diretamente a Deus a anulação do plano; a tradução mantém essa afirmação teológica explícita.
- issue: Expressão distributiva masculina אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: “Cada um” é uma forma masculina distributiva corrente em português e comunica com naturalidade que os trabalhadores retomaram individualmente suas tarefas, sem afirmar além do texto a composição do grupo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A abertura conserva o andamento narrativo do hebraico; “muralha” é preferido a “muro” por se tratar da fortificação urbana de Jerusalém. As notas registram a formulação passiva e alternativas lexicais relevantes sem sobrecarregar o texto principal.
