  text: וַ/יִּקְשְׁר֤וּ כֻלָּ/ם֙ יַחְדָּ֔ו לָ/ב֖וֹא לְ/הִלָּחֵ֣ם בִּ/ירוּשָׁלִָ֑ם וְ/לַ/עֲשׂ֥וֹת ל֖/וֹ תּוֹעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: pt
  text: Todos eles conspiraram em conjunto para vir lutar contra Jerusalém e causar confusão nela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provocar desordem nela” ou “causar problemas nela”. O substantivo hebraico pode denotar confusão, perturbação ou desordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: conspiraram
  rationale: O qal de קשר pode indicar a formação de uma conspiração ou aliança hostil; “conspiraram” expressa com clareza a intenção coordenada no contexto.
- source_word: כֻלָּם יַחְדָּו
  choice: todos eles ... juntos
  rationale: A combinação enfatiza tanto a totalidade do grupo quanto sua ação conjunta; a formulação preserva ambas as ideias.
- source_word: לָבוֹא לְהִלָּחֵם
  choice: vir lutar
  rationale: Mantém o verbo de movimento seguido do infinitivo de combate, sem reduzir a expressão ao sentido mais específico de “atacar”.
- source_word: בִּירוּשָׁלָם
  choice: contra Jerusalém
  rationale: Com o verbo de combate, a preposição בְּ marca idiomaticamente o alvo da ação hostil.
- source_word: וְלַעֲשׂוֹת לוֹ
  choice: e causar ... nela
  rationale: עשה com o substantivo seguinte comunica a produção de uma condição; o pronome retoma Jerusalém, e “nela” transmite naturalmente o efeito dentro da cidade.
- source_word: תּוֹעָה
  choice: confusão
  rationale: O substantivo pode denotar confusão, perturbação ou desordem; “confusão” preserva sua amplitude sem especificar indevidamente a forma da perturbação.
theological_decisions: []
translation_notes:
