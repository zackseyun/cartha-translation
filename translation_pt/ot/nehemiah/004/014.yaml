  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: pt
  text: No lugar em que vocês ouvirem o som da trombeta[a], reúnam-se ali junto a nós. Nosso Deus lutará por nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som do chifre de carneiro”. O hebraico shofar refere-se especificamente a uma trombeta de chifre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: No lugar em que
  rationale: Preserva o sentido locativo concreto da expressão hebraica e introduz a oração relativa de modo natural e claro em português.
- source_word: תִּשְׁמְעוּ
  choice: vocês ouvirem
  rationale: O qal de שׁמע significa normalmente “ouvir”; o futuro do subjuntivo é idiomático em português após “em que” numa instrução referente a uma ocorrência futura.
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: Mantém קוֹל, “som”, expresso no hebraico. “Trombeta” é uma tradução clara de שׁוֹפָר, enquanto a natureza específica do instrumento é registrada em nota.
- source_word: שָׁמָּה
  choice: ali
  rationale: Representa o advérbio locativo e retoma naturalmente “no lugar” em português.
- source_word: תִּקָּבְצוּ
  choice: reúnam-se
  rationale: O nifal de קבץ expressa aqui a ordem de ajuntar-se; a forma pronominal portuguesa comunica de maneira natural o sentido intransitivo.
- source_word: אֵלֵינוּ
  choice: conosco
  rationale: Preserva a primeira pessoa do plural e, em português corrente, expressa naturalmente o movimento de reunir-se ao grupo do falante. A alternativa mais formalmente direta seria “a nós”.
- source_word: אֱלֹהֵינוּ
  choice: Nosso Deus
  rationale: Mantém o sufixo possessivo, importante para a força retórica da declaração.
- source_word: יִלָּחֶם לָנוּ
  choice: lutará por nós
  rationale: Atribui a ação de combater ao próprio Deus e traduz לָנוּ como benefício ou defesa em favor do povo.
theological_decisions:
- issue: Linguagem de guerra divina
  choice: Nosso Deus lutará por nós
  alternative: Nosso Deus nos ajudará a lutar / lutará conosco
  rationale: O hebraico apresenta Deus como sujeito direto do verbo “lutar”, não apenas como auxiliador ou companheiro de combate; a formulação preserva essa ênfase sem ampliá-la.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. “Reúnam-se ali conosco” evita o pouco idiomático “reúnam-se ali a nós”, sem apagar o plural hebraico. A ordem das orações segue de perto a estrutura do original.
