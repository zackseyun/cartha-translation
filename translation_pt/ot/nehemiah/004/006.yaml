  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: pt
  text: 'Quando os judeus que moravam perto deles vieram e nos disseram dez vezes: “De todos os lugares para onde vocês se voltarem[a], eles virão contra nós[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para onde vocês retornarem”. O verbo hebraico pode significar “voltar” ou “retornar”, mas, neste contexto, talvez indique voltar-se em qualquer direção.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz apenas “contra nós” e sua construção é difícil. “Eles virão” foi acrescentado para explicitar a ameaça implícita de atacantes que se aproximariam de todas as direções.
    reason: textual_clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa com a partícula temporal introduz a nova situação; “Quando” transmite isso com naturalidade em português.
- source_word: בָּאוּ
  choice: vieram
  rationale: Verbo comum de movimento, adequado à perspectiva do grupo de Neemias.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: No contexto de Neemias, designa a comunidade judaica, não apenas habitantes da região da Judeia.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: que moravam perto deles
  rationale: O particípio com אֵצֶל indica residência em proximidade aos adversários.
- source_word: וַיֹּאמְרוּ לָנוּ
  choice: disseram-nos
  rationale: Representa diretamente o ato de comunicar o aviso, em registro narrativo natural.
- source_word: עֶשֶׂר פְּעָמִים
  choice: dez vezes
  rationale: Mantém a expressão numérica explícita do hebraico, provavelmente indicativa de insistência.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: De todos os lugares
  rationale: Preserva o sentido distributivo e a posição enfática da expressão.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: para onde vocês se voltarem
  rationale: שׁוב pode significar voltar ou retornar; aqui, “se voltarem” produz uma advertência coerente sobre qualquer direção tomada, sem apagar a alternativa lexical.
- source_word: עָלֵינוּ
  choice: contra nós
  rationale: No contexto de ameaça, עַל expressa movimento hostil dirigido contra os falantes.
