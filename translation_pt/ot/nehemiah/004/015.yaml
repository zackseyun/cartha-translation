  text: וַ/אֲנַ֖חְנוּ עֹשִׂ֣ים בַּ/מְּלָאכָ֑ה וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ בָּֽ/רְמָחִ֔ים מֵ/עֲל֣וֹת הַ/שַּׁ֔חַר עַ֖ד צֵ֥את הַ/כּוֹכָבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: pt
  text: Assim, continuávamos fazendo a obra, enquanto metade deles segurava as lanças, desde o raiar da aurora até o surgimento das estrelas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “desde o amanhecer até as estrelas aparecerem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים
  choice: continuávamos fazendo
  rationale: O particípio expressa uma ação contínua no contexto narrativo; a forma verbal portuguesa comunica naturalmente essa duração.
- source_word: בַּמְּלָאכָה
  choice: a obra
  rationale: מְלָאכָה designa trabalho ou tarefa; “a obra” é conciso e se ajusta ao contexto da reconstrução sem acrescentar especificações ausentes no hebraico.
- source_word: וְחֶצְיָם
  choice: enquanto metade deles
  rationale: A conjunção coordena ações simultâneas; “enquanto” torna clara essa relação em português corrente.
- source_word: מַחֲזִיקִים
  choice: segurava
  rationale: O particípio indica que esse grupo mantinha as lanças nas mãos; “segurava” preserva o sentido sem acrescentar uma postura ou função militar não explicitada.
- source_word: בָּרְמָחִים
  choice: as lanças
  rationale: רְמָחִים refere-se a lanças, e o artigo definido presente na forma hebraica é representado em português.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: desde o raiar da aurora
  rationale: A expressão conserva a imagem concreta da aurora que se levanta e permanece clara e digna em português moderno.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: até o surgimento das estrelas
  rationale: A tradução preserva a imagem hebraica da saída ou aparição das estrelas, evitando reduzi-la interpretativamente a “anoitecer”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira. A formulação preserva o paralelismo das ações simultâneas e as imagens temporais concretas do hebraico.
