base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: pt
  text: Então posicionei homens nas partes mais baixas do lugar, atrás do muro, nas áreas expostas[a]; e posicionei o povo por famílias, com suas espadas, suas lanças e seus arcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos lugares descobertos/abertos”. O termo hebraico é raro e pode indicar trechos expostos ou sem cobertura, vulneráveis a um ataque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: posicionei
  rationale: 'O hifil de עמד tem aqui sentido causativo: pôr pessoas em posições defensivas. “Posicionei” é natural em português e se ajusta ao contexto militar.'
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: nas partes mais baixas do lugar
  rationale: A expressão indica as áreas inferiores ou mais baixas do local. A tradução conserva o sentido espacial sem definir além do que o hebraico permite.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: atrás do muro
  rationale: Expressa a posição na retaguarda do muro; esta é a formulação mais direta e natural em português.
- source_word: בצחחיים
  choice: nas áreas expostas
  rationale: O termo plural é raro e provavelmente se refere a lugares descobertos, abertos ou desguarnecidos. “Áreas expostas” comunica a provável vulnerabilidade tática, enquanto a nota preserva a incerteza lexical.
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: e posicionei o povo
  rationale: A repetição de “posicionei” reproduz a repetição deliberada do verbo hebraico e ressalta a organização da defesa.
- source_word: לְמִשְׁפָּחוֹת
  choice: por famílias
  rationale: משפחות designa grupos familiares ou clãs. “Por famílias” é claro e acessível sem impor uma terminologia social excessivamente técnica.
- source_word: חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: suas espadas, suas lanças e seus arcos
  rationale: A enumeração mantém os três tipos de armas e os possessivos do hebraico em linguagem corrente.
