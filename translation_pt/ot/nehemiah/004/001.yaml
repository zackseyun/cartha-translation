base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: pt
  text: Quando Sambalate, Tobias, os árabes, os amonitas e os asdoditas ouviram que a restauração dos muros de Jerusalém tinha avançado[a] e que as brechas tinham começado a ser fechadas[b], ficaram muito irados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o reparo dos muros de Jerusalém tinha progredido». O termo hebraico pode indicar cura ou restauração e é usado aqui metaforicamente para o reparo dos muros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «as aberturas tinham começado a ser tapadas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Quando
  rationale: A construção narrativa introduz a circunstância temporal; «Quando» é natural e evita acrescentar um marcador discursivo sem correspondente explícito.
- source_word: שָׁמַע
  choice: ouviram
  rationale: Expressa diretamente o recebimento da notícia e concorda com o sujeito composto.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sambalate, Tobias
  rationale: Formas portuguesas tradicionais e amplamente reconhecíveis dos nomes próprios.
- source_word: הָעַרְבִים
  choice: os árabes
  rationale: Etnônimo contemporâneo claro para os grupos árabes mencionados.
- source_word: הָעַמֹּנִים
  choice: os amonitas
  rationale: Gentílico português padrão para o povo de Amom.
- source_word: הָאַשְׁדּוֹדִים
  choice: os asdoditas
  rationale: Gentílico conciso e inteligível derivado de Asdode.
- source_word: עָלְתָה אֲרוּכָה
  choice: a restauração ... avançava
  rationale: אֲרוּכָה pode denotar cura, restauração ou reparo; no contexto dos muros, «restauração» conserva a metáfora, enquanto «avançava» representa o movimento expresso por עָלְתָה.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: dos muros de Jerusalém
  rationale: Construção portuguesa natural para indicar os muros aos quais se aplicava a restauração.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os adversários ouviram.
- source_word: הֵחֵלּוּ
  choice: começavam
  rationale: Marca o início do fechamento das brechas dentro da situação em progresso noticiada aos adversários.
- source_word: הַפְּרֻצִים
  choice: as brechas
  rationale: Termo arquitetônico preciso para as aberturas causadas pela destruição dos muros.
- source_word: לְהִסָּתֵם
  choice: a ser fechadas
  rationale: O infinitivo nifal comunica que as brechas estavam sendo fechadas ou tapadas.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: ficaram muito irados
  rationale: Reproduz de modo digno e natural a expressão hebraica de ira intensa.
