base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: pt
  text: Então, oramos ao nosso Deus e postamos uma guarda[a] contra eles, de dia e de noite, por causa deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabelecemos uma vigilância contra eles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “de diante deles”; aqui, no sentido de “por causa deles” ou “por motivo deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: oramos
  rationale: O hitpael de פלל significa normalmente “orar”; a forma simples preserva o sentido sem acrescentar uma intensidade não expressa.
- source_word: אֶל אֱלֹהֵינוּ
  choice: ao nosso Deus
  rationale: Preserva tanto a preposição אֶל quanto o sufixo de primeira pessoa do plural em אֱלֹהֵינוּ, em português natural.
- source_word: וַנַּעֲמִיד
  choice: colocamos
  rationale: O hifil de עמד indica fazer ficar de pé ou pôr em posição; com “uma guarda”, “colocamos” expressa naturalmente a ação deliberada.
- source_word: מִשְׁמָר
  choice: uma guarda
  rationale: O substantivo pode designar guarda, vigilância ou posto de vigilância; “uma guarda” preserva aqui o sentido coletivo e protetor.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: Embora עַל tenha ampla variedade semântica, no contexto de oposição hostil indica uma vigilância defensiva dirigida contra a ameaça representada por eles.
- source_word: יוֹמָם וָלַיְלָה
  choice: de dia e de noite
  rationale: É a expressão portuguesa corrente para a vigilância mantida nos dois períodos, preservando o merismo hebraico.
- source_word: מִפְּנֵיהֶם
  choice: por causa deles
  rationale: A expressão significa literalmente “de diante deles” e, neste contexto, apresenta a causa da guarda sem tornar explícito que o motivo tenha sido medo.
theological_decisions:
- issue: A resposta à oposição
  choice: Manter coordenadas a oração a Deus e a medida prática de defesa.
  alternative: Destacar exclusivamente a oração ou exclusivamente a preparação defensiva.
  rationale: O hebraico apresenta duas ações coordenadas, sem privilegiar uma delas; a tradução conserva essa tensão teológica e prática.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Colocamos uma guarda” evita tecnicismo militar excessivo; “de dia e de noite” é idiomático e conserva a estrutura do hebraico.
