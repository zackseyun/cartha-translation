  naturalness: O português é claro e moderno. A formulação revista mantém a fluência, evita a expansão “tudo” e preserva de modo natural a construção final ligada ao juramento.
  terminology: “Devolveremos”, “não exigiremos nada deles”, “sacerdotes” e “jurar” são escolhas apropriadas. “Esta palavra”, com nota lexical, preserva o alcance de דָּבָר melhor do que “compromisso” no corpo do texto.
