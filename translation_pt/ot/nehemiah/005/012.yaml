  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: pt
  text: 'E eles disseram: “Nós devolveremos e não exigiremos nada deles; faremos como você diz.” Então chamei os sacerdotes e fiz com que eles jurassem agir conforme esta palavra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “agir/fazer conforme esta palavra”. A palavra דָּבָר também pode significar “assunto” ou, neste contexto, o compromisso assumido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: devolveremos tudo
  rationale: O hifil de שׁוב indica restituição. O objeto está implícito no contexto anterior; “tudo” retoma naturalmente os bens e valores cuja devolução foi exigida.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: não exigiremos nada deles
  rationale: בקשׁ pode significar buscar, pedir ou exigir. Neste contexto econômico e jurídico, indica renunciar a qualquer cobrança.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: faremos como você diz
  rationale: Expressa de forma natural a concordância enfática e o compromisso de agir conforme a instrução de Neemias.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Então chamei os sacerdotes
  rationale: קרא com objeto direto significa chamar ou convocar; “então” representa a progressão narrativa.
- source_word: וָאַשְׁבִּיעֵם
  choice: fiz com que eles jurassem
  rationale: O hifil de שׁבע significa fazer alguém jurar ou colocar alguém sob juramento. O pronome se refere mais naturalmente aos homens que acabavam de assumir o compromisso.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: cumprir esse compromisso
  rationale: דָּבָר pode designar palavra, assunto ou compromisso. No contexto de uma declaração ratificada por juramento, “compromisso” comunica com clareza a força performativa sem alterar o sentido.
