base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: pt
  text: 'E havia outros que diziam: “Estamos dando nossos campos, nossas vinhas e nossas casas em garantia[a] para conseguir cereal durante a fome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estamos empenhando nossos campos, nossas vinhas e nossas casas.” O verbo hebraico refere-se a dar uma propriedade como garantia de uma dívida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: E havia outros que diziam
  rationale: A expressão introduz outro grupo na sequência de queixas. A formulação é natural em português e preserva essa função discursiva.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: nossos campos, nossas vinhas e nossas casas
  rationale: Mantém os três termos concretos de propriedade e sua ordem no hebraico.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Estamos dando ... como garantia
  rationale: Neste contexto, o particípio indica entregar propriedades como garantia de dívida. A expressão comunica com clareza o sentido sem pressupor a forma jurídica específica de uma hipoteca moderna.
- source_word: וְנִקְחָה
  choice: para conseguir
  rationale: A forma expressa aqui a finalidade prática de dar os bens em garantia. 'Conseguir' preserva o sentido geral de obter, sem acrescentar que o cereal foi necessariamente comprado.
- source_word: דָגָן
  choice: cereal
  rationale: O substantivo designa a produção de cereais. 'Cereal' é preciso e amplamente compreensível em português, evitando o sentido potencialmente mais amplo de 'grãos'.
- source_word: בָּרָעָב
  choice: durante a fome
  rationale: A preposição apresenta a fome como a circunstância em que precisavam obter cereal, sem explicitar uma relação causal além do texto.
