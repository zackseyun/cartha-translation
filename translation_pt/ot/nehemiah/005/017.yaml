base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: pt
  text: Os judeus[a] e os oficiais — cento e cinquenta homens —, e os que vinham até nós das nações ao nosso redor, estavam à minha mesa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeus da Judeia”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “à minha mesa” indica que Neemias lhes fornecia alimento como parte de sua hospitalidade e administração.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: os judeus
  rationale: O termo pode designar o povo judeu em geral ou, com matiz geográfico, os habitantes da Judeia. “Os judeus” é a forma mais natural e abrangente em português; a alternativa é preservada em nota.
- source_word: וְהַסְּגָנִים
  choice: e os oficiais
  rationale: Designa autoridades civis ou administradores subordinados. “Oficiais” conserva a ideia de função pública sem impor um título persa específico.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: cento e cinquenta homens ao todo
  rationale: Reproduz o número e o substantivo masculino do hebraico. “Ao todo” torna clara, em português corrente, a função apositiva da expressão numérica em relação aos judeus e oficiais.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: além dos que vinham até nós
  rationale: O particípio hebraico descreve aqueles que vinham ou chegavam até o grupo de Neemias. O imperfeito “vinham” preserva melhor esse aspecto recorrente ou durativo.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: dentre as nações ao nosso redor
  rationale: “Nações” traduz גּוֹיִם sem introduzir a carga religiosa mais específica de “gentios”; a expressão seguinte mantém o sentido geográfico dos povos vizinhos.
- source_word: עַל שֻׁלְחָנִי
  choice: estavam à minha mesa
  rationale: Mantém a imagem literal da mesa e, no contexto, comunica participação nas refeições e no sustento oferecido por Neemias sem incorporar toda a explicação cultural ao texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva a enumeração e a imagem hebraica da mesa; não se acrescenta um marcador temporal equivalente a “agora”, pois ele não está expresso no texto-fonte.
