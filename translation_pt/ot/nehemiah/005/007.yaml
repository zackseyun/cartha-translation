  text: וַ/יִּמָּלֵ֨ךְ לִבִּ֜/י עָלַ֗/י וָ/אָרִ֨יבָ/ה֙ אֶת הַ/חֹרִ֣ים וְ/אֶת הַ/סְּגָנִ֔ים וָ/אֹמְרָ֣/ה לָ/הֶ֔ם מַשָּׁ֥א אִישׁ בְּ/אָחִ֖י/ו אַתֶּ֣ם נשאים וָ/אֶתֵּ֥ן עֲלֵי/הֶ֖ם קְהִלָּ֥ה גְדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: pt
  text: 'Então, depois de refletir comigo mesmo[a], apresentei acusações[b] contra os nobres e os oficiais. Eu lhes disse: “Cada um de vocês está cobrando juros[c] do seu irmão”. E convoquei contra eles uma grande assembleia[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meu coração deliberou dentro de mim” ou “meu coração tomou conselho comigo”. A expressão hebraica indica reflexão interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “contendi com” ou “confrontei”. O verbo hebraico pode descrever tanto uma acusação de caráter judicial quanto uma disputa mais geral.
    reason: lexical_alternative
  - marker: c
    text: Ou “está impondo um encargo”. O termo hebraico, neste contexto, é tradicionalmente entendido como a cobrança de juros sobre empréstimos.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “pus contra eles uma grande assembleia”, expressão que indica a convocação de uma reunião pública contra eles.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: depois de refletir comigo mesmo
  rationale: A expressão idiomática descreve deliberação interior antes da ação. A tradução comunica naturalmente o sentido reflexivo sem confundi-lo com a ira mencionada no versículo anterior.
- source_word: וָאָרִיבָה
  choice: apresentei acusações contra
  rationale: ריב pode indicar tanto contender como apresentar uma causa ou acusação. Neste contexto de confronto público com as lideranças, a formulação preserva a força quase judicial do verbo.
- source_word: הַחֹרִים
  choice: os nobres
  rationale: Designa a elite social da Judeia; “nobres” é claro, corrente e não especifica além do que o hebraico permite.
- source_word: הַסְּגָנִים
  choice: os oficiais
  rationale: Refere-se a administradores ou autoridades subordinadas. “Oficiais” preserva a abrangência do cargo sem impor um título burocrático exato.
- source_word: מַשָּׁא ... נשאים
  choice: está cobrando juros
  rationale: No contexto econômico, a combinação exprime a cobrança ou imposição de um encargo ligado ao empréstimo. “Juros” é compreensível e evita a conotação moderna de ilegalidade ou excesso que “usura” pode carregar.
- source_word: אִישׁ בְּאָחִיו
  choice: cada um de vocês ... do seu irmão
  rationale: A construção distributiva destaca que israelitas estavam cobrando de outros membros do próprio povo. “Irmão” conserva a linguagem de parentesco e solidariedade comunitária.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: convoquei contra eles uma grande assembleia
  rationale: Embora נתן signifique literalmente “dar/pôr”, a expressão indica a convocação de uma assembleia pública em oposição aos acusados. A tradução mantém tanto o caráter público quanto a força adversativa de עֲלֵיהֶם.
theological_decisions:
- issue: Sentido de “irmão” em אִישׁ בְּאָחִיו
  choice: Manter “irmão” no texto
  alternative: Traduzir por “compatriota” ou “semelhante”
  rationale: O termo se refere a outro israelita e carrega simultaneamente linguagem familiar e solidariedade dentro da comunidade. Mantê-lo evita reduzir essa dimensão, sem afirmar parentesco biológico literal.
- issue: Natureza da cobrança indicada por מַשָּׁא
  choice: Traduzir como “juros”
  alternative: “usura”, “encargo” ou “dívida”
  rationale: O contexto favorece uma cobrança associada a empréstimos, mas o texto não exige a noção moderna de taxa ilegalmente excessiva. “Juros” preserva a acusação econômica sem importar uma definição jurídica posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. A repetição de “assembleia” preserva o caráter formal e público de קְהִלָּה. A divisão em três frases evita uma sequência excessivamente longa sem alterar a progressão do hebraico.
