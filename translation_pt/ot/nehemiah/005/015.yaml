language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: pt
  text: Mas os governadores anteriores, que vieram antes de mim, impuseram pesados encargos ao povo e tomaram dele pão e vinho, além de quarenta siclos de prata[a]. Até os seus servos[b] exerciam domínio sobre o povo. Eu, porém, não agi assim, por causa do temor de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção hebraica é difícil. Pode indicar que os quarenta siclos de prata eram uma cobrança adicional ao pão e ao vinho.
    reason: lexical_alternative
  - marker: b
    text: Ou “auxiliares” ou “jovens”. O termo hebraico pode designar subordinados a serviço dos governadores.
    reason: lexical_alternative
  - marker: c
    text: Ou “por reverência a Deus”. A expressão hebraica é, literalmente, “por causa do temor de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת
  choice: governadores
  rationale: פֶּחָה designa um governador ou administrador provincial, especialmente adequado ao contexto do período persa.
- source_word: הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: os governadores anteriores, que vieram antes de mim
  rationale: A formulação identifica os ocupantes anteriores do cargo e preserva, de modo natural, a referência pessoal de לְפָנַי.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: impuseram pesados encargos ao povo
  rationale: Preserva a imagem de tornar pesado e, ao mesmo tempo, comunica claramente as exigências opressivas no contexto fiscal.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: tomaram dele
  rationale: Mantém o sentido comum de לקח e usa o singular coletivo em concordância natural com 'povo'.
- source_word: בְּלֶחֶם וָיַיִן
  choice: pão e vinho
  rationale: Conserva os bens concretamente nomeados no hebraico, sem generalizar 'pão' como alimento.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: além de quarenta siclos de prata
  rationale: Entende אַחַר idiomaticamente como uma cobrança adicional; a nota registra a dificuldade da construção.
- source_word: נַעֲרֵיהֶם
  choice: seus servos
  rationale: Embora נַעַר possa significar 'jovem', neste contexto administrativo indica provavelmente subordinados ou auxiliares dos governadores.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: exerciam domínio sobre o povo
  rationale: Expressa o exercício de poder indicado por שׁלט sem acrescentar explicitamente a nuance interpretativa de abuso contida em 'dominavam tiranicamente'.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Eu, porém, não agi assim
  rationale: Marca claramente o contraste entre a conduta de Neemias e a de seus antecessores, em português corrente.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: por causa do temor de Deus
  rationale: Preserva o idioma teológico hebraico e deixa que o contexto determine sua combinação de reverência, temor e responsabilidade diante de Deus.
theological_decisions:
- issue: Tradução de יִרְאַת אֱלֹהִים
  choice: por causa do temor de Deus
  alternative: por reverência a Deus; porque eu temia a Deus
  rationale: A tradução mantém a expressão teológica bíblica sem reduzi-la a simples respeito nem interpretá-la necessariamente como terror. A nota oferece a formulação idiomática alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. 'Siclos' conserva a unidade histórica; 'encargos' comunica a natureza fiscal das exigências. A ordem e os contrastes do hebraico foram mantidos sem rigidez sintática.
