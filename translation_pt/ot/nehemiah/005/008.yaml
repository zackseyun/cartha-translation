  to: 'Eu lhes disse: “Nós resgatamos, na medida de nossas possibilidades, nossos irmãos judeus que haviam sido vendidos às nações. Mas agora vocês mesmos estão vendendo seus irmãos, e terão de ser vendidos a nós!”[a] Então eles ficaram calados e não acharam o que responder.'
  rationale: A revisão troca a oração de finalidade por uma consequência modal («terão de ser vendidos a nós»), em conformidade com a leitura principal da trilha de auditoria inglesa e sem atribuir ao hebraico uma relação de propósito. A nota preserva a alternativa interrogativa e explica, sem incorporá-la ao texto principal, a ironia contextual de serem vendidos ao próprio povo.
