base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: pt
  text: 'Eu lhes disse: “Nós resgatamos, na medida de nossas possibilidades, nossos irmãos judeus que haviam sido vendidos às nações. Mas agora vocês mesmos estão vendendo seus irmãos, e terão de ser vendidos a nós!”[a] Então eles ficaram calados e não acharam o que responder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e haverão de ser vendidos a nós?” A frase hebraica é breve e pode ser entendida como pergunta retórica ou como a consequência irônica da conduta deles: seus irmãos acabariam sendo vendidos ao próprio povo.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: resgatamos
  rationale: No contexto, o verbo indica comprar judeus de volta da servidão entre povos estrangeiros. “Resgatamos” comunica libertação mediante pagamento sem exigir a formulação menos natural “compramos de volta”.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: nossos irmãos judeus
  rationale: Preserva tanto o termo masculino de parentesco quanto a identificação explícita como judeus, mantendo a linguagem de solidariedade comunitária.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: que haviam sido vendidos às nações
  rationale: “Nações” traduz diretamente גּוֹיִם; o mais-que-perfeito situa naturalmente essa venda antes da ação de resgate.
- source_word: כְּדֵי בָנוּ
  choice: na medida de nossas possibilidades
  rationale: Expressa o limite dos recursos ou da capacidade disponíveis e soa natural em português contemporâneo.
- source_word: וְגַם אַתֶּם
  choice: Mas agora vocês mesmos
  rationale: 'A formulação explicita o contraste enfático da acusação: os próprios líderes judeus praticavam aquilo cujos efeitos a comunidade tentava desfazer.'
- source_word: תִּמְכְּרוּ
  choice: estão vendendo
  rationale: O presente progressivo transmite uma conduta em curso censurada por Neemias.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: para que sejam vendidos de volta a nós
  rationale: A oração hebraica é breve e difícil. Esta redação apresenta a consequência irônica da conduta deles sem transformar silenciosamente a frase em pergunta.
- source_word: וַיַּחֲרִישׁוּ
  choice: ficaram calados
  rationale: Equivalente português corrente e preciso para o silêncio provocado pela repreensão.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: não acharam o que responder
  rationale: Reproduz de modo idiomático a expressão hebraica “não encontraram palavra/coisa”, isto é, não tiveram resposta.
theological_decisions:
- issue: Termo masculino de parentesco אַחֵינוּ / אַחֵיכֶם
  choice: irmãos
  alternative: irmãos e irmãs; compatriotas judeus
  rationale: O hebraico emprega um substantivo masculino plural de parentesco. A tradução preserva sua forma e a solidariedade interna da comunidade, sem ampliar explicitamente o gênero do referente.
- issue: Sentido da oração וְנִמְכְּרוּ לָנוּ
  choice: 'consequência enfática: “para que sejam vendidos de volta a nós!”'
  alternative: 'pergunta retórica: “e haveriam de ser vendidos a nós?”'
  rationale: A sintaxe é elíptica e admite mais de uma leitura. O texto principal mantém a consequência irônica adotada pela camada auditada, e a nota registra a leitura interrogativa sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita uma forma regional ou excessivamente solene; “resgatamos” e “na medida de nossas possibilidades” equilibram precisão e naturalidade. A única nota é marcada no texto principal e preserva a ambiguidade da oração mais difícil.
