id: NEH.5.14
reference: Nehemiah 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: pt
  text: Além disso, desde o dia em que ele me nomeou governador na terra de Judá, desde o vigésimo ano até o trigésimo segundo ano do rei Artaxerxes — doze anos —, nem eu nem meus irmãos comemos a provisão de alimentos do governador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pão do governador”, isto é, os alimentos ou a provisão habitualmente destinada ao governador.
    reason: Registra a expressão literal e esclarece seu sentido administrativo e econômico.
lexical_decisions:
- source_word: גַּם
  choice: Além disso
  rationale: Introduz mais um elemento na defesa de Neemias e preserva de modo natural a força aditiva.
- source_word: מִיּוֹם אֲשֶׁר
  choice: desde o dia em que
  rationale: Marca o início de um período contínuo e mantém a formulação temporal concreta do hebraico.
- source_word: צִוָּה אֹתִי
  choice: ele me nomeou
  rationale: Embora o verbo costume significar «ordenar», neste contexto administrativo indica a designação oficial de Neemias para o cargo.
- source_word: לִהְיוֹת פֶּחָם
  choice: governador
  rationale: פֶּחָה é o título de um governador provincial persa. O sufixo massorético é incomum e de referência incerta; por isso, evita-se inserir «deles» ou «seu» no texto principal.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Preserva a expressão geográfica hebraica sem substituí-la pela interpretação administrativa «província».
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: desde o vigésimo ano até o trigésimo segundo ano do rei Artaxerxes
  rationale: Reproduz com clareza a fórmula de datação pelos anos de reinado.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: doze anos
  rationale: Mantém o resumo apositivo do intervalo cronológico, destacado por travessões.
- source_word: אֲנִי וְאַחַי
  choice: nem eu nem meus irmãos
  rationale: Preserva o sentido literal de אַחַי e, em combinação natural com a negação verbal, expressa que nenhum dos dois grupos recebeu a provisão.
- source_word: לֶחֶם הַפֶּחָה
  choice: a provisão de alimentos do governador
  rationale: לֶחֶם significa literalmente «pão», mas aqui designa por metonímia a alimentação ou provisão oficial ligada ao cargo; a formulação comunica esse sentido sem reduzir a expressão a pão literal.
- source_word: לֹא אָכַלְתִּי
  choice: comemos
  rationale: A primeira pessoa singular hebraica pode ter valor representativo após o sujeito composto «eu e meus irmãos». Em português, a concordância no plural é a forma natural; a negação é expressa pela construção «nem... nem».
theological_decisions:
- issue: Amplitude de אַחַי
  choice: meus irmãos
  alternative: meus parentes; meus companheiros; meus compatriotas
  rationale: O hebraico usa o plural masculino de «irmão». O contexto pode abranger colaboradores próximos, mas o texto não exige neutralizar ou ampliar explicitamente o termo.
- issue: Sentido de לֶחֶם הַפֶּחָה
  choice: a provisão de alimentos do governador
  alternative: o pão do governador
  rationale: O contexto é o sustento material tradicionalmente cobrado pelo governador. A tradução idiomática preserva a referência concreta à alimentação e evita sugerir que se tratava apenas de pão.
- issue: Referência do sufixo em פֶּחָם
  choice: não explicitar o referente
  alternative: governador deles; seu governador
  rationale: A forma massorética contém um sufixo cuja referência não é transparente neste contexto. O título simples «governador» preserva a função administrativa sem resolver silenciosamente a dificuldade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «desde» preserva a estrutura temporal do hebraico; os travessões destacam a explicação «doze anos». O marcador [a] aparece após a expressão explicada.
