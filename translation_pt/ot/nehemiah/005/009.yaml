  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: pt
  text: 'Então eu disse: “O que vocês estão fazendo não é bom. Não deveriam andar no temor do nosso Deus, por causa da afronta das nações, nossas inimigas?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para evitar a afronta das nações, nossas inimigas”. A preposição hebraica pode indicar o motivo da conduta ou a afronta que se pretende evitar.'
    reason: alternativa lexical decorrente da ambiguidade da preposição hebraica מִן
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então eu disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então eu disse” expressa essa sequência de modo natural em português.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Preserva diretamente a avaliação moral do hebraico sem a interpretar mais especificamente como “não é certo”.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: O que vocês estão fazendo
  rationale: Transforma a construção nominal hebraica em uma formulação portuguesa corrente, mantendo a referência direta à conduta presente.
- source_word: הֲלוֹא
  choice: Não deveriam
  rationale: Reproduz a pergunta retórica com força de exortação moral, de maneira natural e clara.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: no temor do nosso Deus
  rationale: Mantém o substantivo “temor” e a expressão bíblica que comunica reverência obediente sem reduzir sua força.
- source_word: תֵּלֵכוּ
  choice: andar
  rationale: Conserva a metáfora ética hebraica de conduzir a vida, ainda compreensível e expressiva em português.
- source_word: מֵחֶרְפַּת
  choice: por causa da afronta
  rationale: “Por causa de” preserva a possível relação causal ou motivadora de מִן, e “afronta” comunica desonra e hostilidade pública.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: das nações, nossas inimigas
  rationale: “Nações” é adequado aos povos estrangeiros circundantes; a aposição é preservada, com concordância de gênero natural em português.
theological_decisions:
- issue: Metáfora ética de הלך no contexto da fidelidade a Deus
  choice: Manter “andar”
  alternative: “viver” ou “proceder”
  rationale: A metáfora bíblica apresenta a conduta como um caminho percorrido diante de Deus. Mantê-la conserva a textura teológica sem impedir a compreensão.
- issue: Relação expressa por מִן em מֵחֶרְפַּת
  choice: “por causa da afronta” no texto, com alternativa em nota
  alternative: “para evitar a afronta”
  rationale: A preposição admite valor causal ou a ideia contextual de afastamento/evitação. A tradução principal conserva a formulação menos expansiva, enquanto a nota registra a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita uma forma regional ou arcaizante; “andar no temor” preserva deliberadamente a metáfora e a linguagem bíblica. O marcador da nota foi colocado após toda a pergunta porque a nota esclarece a relação entre a exortação e a afronta mencionada.
