  source_fidelity: A comparação de parentesco, a referência a filhos e filhas, a condição já existente de algumas filhas e a perda dos campos e vinhas estão bem representadas. Contudo, «entregando ... à escravidão» é menos preciso para כֹבְשִׁים do que uma formulação que expresse a sujeição/coerção, e «pois» torna explicitamente causal uma ligação que o hebraico apresenta apenas com «e».
  naturalness: O português é claro, moderno e de registro apropriado. «Reduzindo ... à escravidão» é idiomático e preserva com mais nitidez a gravidade e a força do verbo hebraico.
  terminology: «Carne», «irmãos», «filhos», «filhas», «escravidão», «campos» e «vinhas» são escolhas adequadas. A repetição de «reduzidas à escravidão» mantém a relação verbal entre a ação descrita e o estado das filhas sem suavizar a escravização.
