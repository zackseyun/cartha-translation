revisions:
- from: E agora, nossa carne é como a carne de nossos irmãos, e nossos filhos são como os filhos deles. Mesmo assim, estamos entregando nossos filhos e nossas filhas à escravidão; algumas de nossas filhas já foram escravizadas. Não temos poder para impedir isso[a], pois nossos campos e nossas vinhas pertencem a outros.
  to: E agora, nossa carne é como a carne de nossos irmãos, e nossos filhos são como os filhos deles. Mesmo assim, estamos reduzindo nossos filhos e nossas filhas à escravidão; algumas de nossas filhas já foram reduzidas à escravidão. Não temos poder para impedir isso[a], e nossos campos e nossas vinhas pertencem a outros.
  rationale: A revisão substitui «entregando» por «reduzindo ... à escravidão», que reproduz de modo mais direto a sujeição coercitiva expressa pelo mesmo radical hebraico nas duas ocorrências. Também troca «pois» por «e», evitando impor como relação gramatical explícita uma explicação que o hebraico apenas justapõe, sem perder a conexão contextual.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:03:06Z'
