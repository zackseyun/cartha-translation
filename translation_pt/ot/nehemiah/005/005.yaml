source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: pt
  text: E agora, nossa carne é como a carne de nossos irmãos, e nossos filhos são como os filhos deles. Mesmo assim, estamos reduzindo nossos filhos e nossas filhas à escravidão; algumas de nossas filhas já foram reduzidas à escravidão. Não temos poder para impedir isso[a], e nossos campos e nossas vinhas pertencem a outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não há poder em nossa mão”. A expressão indica que eles não tinham força nem meios para mudar a situação, especialmente porque seus campos e suas vinhas estavam em poder de outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: nossa carne é como a carne de nossos irmãos
  rationale: Preserva a imagem concreta de בָּשָׂר, que enfatiza a humanidade e o parentesco compartilhados, sem tornar o português excessivamente obscuro.
- source_word: אַחֵינוּ
  choice: nossos irmãos
  rationale: Mantém o termo masculino de parentesco do hebraico; no contexto, refere-se aos demais membros da comunidade judaica.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: nossos filhos são como os filhos deles
  rationale: Filhos pode abranger a descendência em sentido coletivo; a menção explícita posterior a filhos e filhas esclarece a inclusão de ambos.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: estamos entregando ... à escravidão
  rationale: Comunica a ação coercitiva de sujeitar os próprios filhos à condição servil por dívida, usando linguagem inequívoca de escravidão. 'Entregando' evita sugerir que os pais executavam pessoalmente a subjugação física.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: algumas de nossas filhas já foram escravizadas
  rationale: Expressa o estado passivo resultante indicado pelo particípio nifal e a realidade já consumada da escravização.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: não temos poder para impedir isso
  rationale: Traduz idiomaticamente a falta de força ou de meios; אֵל é entendido aqui como poder, não como designação divina.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: pois nossos campos e nossas vinhas pertencem a outros
  rationale: Explicita em português a relação possessiva da oração nominal e sua função contextual de explicar a impotência dos queixosos.
theological_decisions:
- issue: Linguagem de parentesco na denúncia de injustiça social
  choice: Manter 'irmãos' e empregar 'filhos' coletivamente na comparação
  alternative: Usar 'parentes' ou explicitar 'filhos e filhas' já na comparação
  rationale: A escolha conserva o parentesco masculino expresso por אַחֵינוּ e a possível abrangência coletiva de בנים, sem apagar a distinção explícita entre filhos e filhas na sequência.
- issue: Intensidade da linguagem relativa à escravidão
  choice: Usar 'escravidão' e 'escravizadas'
  alternative: Usar 'servidão', 'serviço' ou 'subjugadas'
  rationale: O contexto descreve sujeição coercitiva de filhos por dívida; termos mais brandos poderiam ocultar a gravidade da condição.
- issue: Sentido de אֵל na expressão וְאֵין לְאֵל יָדֵנוּ
  choice: Entender אֵל como 'poder' ou 'força'
  alternative: Entender אֵל como referência a Deus
  rationale: A construção idiomática trata da incapacidade dos reclamantes e é imediatamente associada à perda de seus campos e vinhas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem concreta de 'carne' foi preservada; a sintaxe foi levemente explicitada para fluência. A conjunção final foi vertida como 'pois' para tornar clara a relação contextual entre a perda das terras e a falta de meios, embora o hebraico use simplesmente 'e'.
