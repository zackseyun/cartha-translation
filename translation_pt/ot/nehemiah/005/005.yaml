    issue: «Estamos entregando nossos filhos e nossas filhas à escravidão» atenua o verbo כֹבְשִׁים.
    rationale: O verbo denota subjugar ou reduzir à sujeição; no contexto de לַעֲבָדִים, a tradução deve explicitar a imposição da escravidão, não apenas a entrega a ela.
  - severity: low
    issue: «Pois» explicita uma relação causal no fim do versículo.
    rationale: Embora a posse das terras por outros explique contextualmente a impotência, o hebraico coordena as orações com «e». Manter a coordenação preserva melhor a apresentação e a margem de relação discursiva do original.
