source:
  edition: WLC
  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: pt
  text: Por favor, devolvam-lhes ainda hoje os seus campos, as suas vinhas, os seus olivais e as suas casas, bem como a centésima parte[a] do dinheiro, dos cereais, do vinho novo e do azeite que vocês têm cobrado deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um centésimo, ou um por cento. O hebraico provavelmente se refere à parcela cobrada deles, mas não especifica aqui a periodicidade nem o mecanismo exato da cobrança.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que vocês estão exigindo deles”; possivelmente, “que vocês lhes têm emprestado a juros”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ נָא
  choice: Por favor, devolvam
  rationale: O imperativo plural causativo de שׁוב pede a restituição do que foi tomado; נָא suaviza a ordem como apelo enfático. “Por favor, devolvam” é atual, claro e preserva tanto a autoridade quanto o tom de súplica.
- source_word: כְּהַיּוֹם
  choice: ainda hoje
  rationale: A expressão ressalta a urgência temporal. “Ainda hoje” comunica de modo natural que a restituição deve ocorrer no próprio dia.
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  choice: os seus campos, as suas vinhas, os seus olivais e as suas casas
  rationale: Mantém a enumeração das propriedades confiscadas. “Olivais” expressa de forma concisa e corrente as plantações ou propriedades de oliveiras.
- source_word: וּמְאַת
  choice: bem como a centésima parte
  rationale: מְאַת significa literalmente “uma centésima parte”. A tradução conserva a fração sem decidir se ela funcionava especificamente como taxa mensal, juros ou outra forma de cobrança.
- source_word: הַכֶּסֶף
  choice: do dinheiro
  rationale: Embora כֶּסֶף também possa significar “prata”, aqui sua função econômica na relação de crédito favorece “dinheiro”.
- source_word: הַדָּגָן
  choice: dos cereais
  rationale: O termo designa genericamente a produção cerealífera. “Cereais” é claro em português internacional e se ajusta à lista de bens agrícolas.
- source_word: הַתִּירוֹשׁ
  choice: do vinho novo
  rationale: תִּירוֹשׁ costuma designar o produto recente da uva. “Vinho novo” conserva a distinção lexical sem explicar além do texto.
- source_word: הַיִּצְהָר
  choice: do azeite
  rationale: O termo se refere normalmente ao óleo agrícola, sobretudo de oliva; em português, “azeite” comunica naturalmente esse sentido.
- source_word: נֹשִׁים בָּהֶם
  choice: que vocês têm cobrado deles
  rationale: A forma verbal descreve a atuação dos credores e pode abranger cobrança ou imposição de encargo. “Têm cobrado” preserva o contexto opressivo sem limitar o sentido a uma modalidade técnica específica de juros.
theological_decisions:
- issue: Natureza exata da centésima parte e da ação dos credores
  choice: “a centésima parte” e “têm cobrado deles”
  alternative: “um por cento de juros” e “têm emprestado a juros”
  rationale: O contexto denuncia exploração econômica, mas a redação hebraica não obriga a identificar com precisão a periodicidade da taxa nem a reduzir נֹשִׁים a um único termo financeiro. A tradução mantém a força ética da repreensão e deixa a ambiguidade técnica visível nas notas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Empregou-se “vocês” para o plural explícito e “olivais”/“azeite” para naturalidade agrária. As notas foram colocadas exatamente junto às expressões ambíguas, sem resolver de modo denominacional a natureza financeira da cobrança.
