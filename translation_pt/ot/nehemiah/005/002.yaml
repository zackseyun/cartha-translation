  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: pt
  text: 'E havia alguns que diziam: “Nós, nossos filhos e nossas filhas, somos muitos. Vamos obter cereal para comer e viver.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: E havia alguns que diziam
  rationale: Preserva a construção existencial que apresenta um grupo entre vários no relato, em português natural.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Nós, nossos filhos e nossas filhas, somos muitos
  rationale: Mantém o pronome אֲנַחְנוּ e a formulação familiar comprimida do hebraico, sem reduzir o sentido a apenas ter muitos filhos.
- source_word: וְנִקְחָה
  choice: Precisamos conseguir
  rationale: O coortativo expressa aqui a necessidade e a resolução urgentes de obter alimento; esta formulação é corrente e adequada ao contexto de penúria.
- source_word: דָגָן
  choice: cereal
  rationale: Designa grãos ou produtos cerealíferos, e não alimento em geral; “cereal” é amplamente compreensível em português internacional.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: para comer e continuar vivos
  rationale: Expressa naturalmente a finalidade de obter cereal e deixa clara a urgência da sobrevivência, preservando os dois verbos.
