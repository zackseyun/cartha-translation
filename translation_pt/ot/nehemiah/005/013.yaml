  naturalness: A linguagem é em geral clara e adequada ao português moderno. A revisão torna a maldição mais fluente e mantém a repetição intencional de “sacudir”, sem introduzir uma interpretação confessional.
  terminology: “Dobra da minha veste”, “assembleia”, “Yahweh” e “promessa” são escolhas apropriadas. “Fruto do seu trabalho” é contextual e a nota preserva a alternativa lexical “trabalho”.
