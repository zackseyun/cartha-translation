base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: pt
  text: 'Também sacudi a dobra da minha veste[a] e disse: “Assim Deus sacuda para fora, de sua casa e do fruto do seu trabalho[b], todo homem que não cumprir esta promessa. Assim seja ele sacudido e esvaziado.” Toda a assembleia disse: “Amém”, e louvou Yahweh. E o povo cumpriu esta promessa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu colo” ou “a parte da frente da minha veste”. O hebraico se refere à dobra de uma roupa usada para carregar objetos; o gesto simboliza ser sacudido para fora e privado dos bens.
    reason: lexical_alternative
  - marker: b
    text: Ou “do seu trabalho”. O termo hebraico pode indicar tanto o trabalho em si como aquilo que ele produz.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: a dobra da minha veste
  rationale: Designa a dobra frontal da roupa que podia servir para carregar objetos; a expressão mantém concreto o gesto simbólico de Neemias.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: sacudi / sacuda para fora / seja sacudido
  rationale: Preserva a repetição hebraica e liga o gesto de esvaziar a veste à maldição de expulsão e perda.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: cumprir esta promessa
  rationale: No contexto do compromisso juramentado, a expressão indica confirmar pelo cumprimento aquilo que foi prometido.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: para fora de sua casa e do fruto do seu trabalho
  rationale: יְגִיעַ pode indicar o trabalho penoso ou aquilo que ele produz; a formulação portuguesa explicita a leitura contextual sem ocultar a alternativa, registrada em nota.
- source_word: וָרֵק
  choice: fique vazio
  rationale: Mantém a imagem de alguém esvaziado, destituído de casa e dos resultados de seu trabalho.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: Refere-se à comunidade reunida e evita conotações denominacionais desnecessárias.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico em vez de substituí-lo por um título.
- source_word: כַדָּבָר הַזֶּה
  choice: conforme essa promessa
  rationale: Retoma o compromisso assumido no contexto imediato, em português claro e natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração o preserva sem o substituir por um título.
- issue: Masculino representativo em כָּל הָאִישׁ
  choice: todo homem
  alternative: qualquer pessoa; todos
  rationale: Mantém o singular masculino formalmente presente no hebraico, empregado aqui com força representativa.
- issue: Força imprecatória do gesto simbólico
  choice: “Assim sacuda Deus...”
  alternative: “Deste modo Deus sacudirá...”
  rationale: O contexto é uma maldição condicional pronunciada durante a ratificação de um compromisso; a forma optativa preserva essa força sem transformá-la em simples previsão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “sacudir” foi mantida para reproduzir o gesto e o jogo verbal do hebraico. A construção “sacuda ... para fora” esclarece que a imagem não é mero tremor, mas expulsão e esvaziamento.
