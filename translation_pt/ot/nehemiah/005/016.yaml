base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: pt
  text: Também me empenhei[a] na obra desta muralha. Não compramos campo algum, e todos os meus jovens[b] estavam reunidos ali para o trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Também me apliquei ao trabalho desta muralha”; a expressão indica envolvimento pessoal na obra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meus servos” ou “meus atendentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Preserva a força aditiva da expressão e a liga naturalmente ao contexto anterior.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: ao trabalho nesta muralha
  rationale: Expressa de modo natural a participação no trabalho relativo à muralha, sem acrescentar explicitamente 'da cidade'.
- source_word: הֶחֱזַקְתִּי
  choice: me dediquei
  rationale: O hifil de חזק, neste contexto, indica tomar parte com empenho ou aplicar-se ao trabalho; 'me dediquei' comunica esse envolvimento pessoal.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: Não compramos campo algum
  rationale: Mantém a primeira pessoa do plural de קָנִינוּ e traduz שָׂדֶה sem transformar o singular coletivo em uma referência mais ampla e interpretativa a terras.
- source_word: נְעָרַי
  choice: meus auxiliares
  rationale: נַעַר pode designar jovem, servo ou assistente. No contexto da equipe de Neemias, 'auxiliares' é natural e evita afirmar idade ou condição servil não determinadas.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: estavam reunidos ali para o trabalho
  rationale: Preserva o particípio passivo, o advérbio שָׁם e a ideia de que o grupo estava concentrado no local para executar a obra.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma sequência pesada de coordenações sem alterar as relações do hebraico. 'Muralha' é preferível a 'muro' no contexto da fortificação urbana.
