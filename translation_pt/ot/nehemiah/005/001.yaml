base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: pt
  text: Houve um grande clamor do povo e de suas esposas contra seus irmãos judeus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus irmãos da Judeia”. O termo hebraico pode designar judeus ou habitantes da Judeia, conforme a ênfase seja étnico-comunitária ou regional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Houve
  rationale: O wayyiqtol de היה introduz um novo acontecimento na narrativa. “Houve” é natural em português e não acrescenta um advérbio temporal inexistente no hebraico.
- source_word: צַעֲקַת
  choice: clamor
  rationale: Expressa um grito coletivo de aflição e protesto, preservando a intensidade e o caráter público da queixa.
- source_word: הָעָם
  choice: do povo
  rationale: Traduz o termo de modo amplo e direto, sem especificar indevidamente uma classe social.
- source_word: וּנְשֵׁיהֶם
  choice: e de suas mulheres
  rationale: O substantivo pode significar “mulheres” ou “esposas”. Aqui, “suas mulheres” preserva a forma do hebraico e a participação feminina sem resolver além do necessário a relação conjugal.
- source_word: גְּדוֹלָה
  choice: grande
  rationale: Mantém a indicação hebraica da magnitude ou intensidade do clamor.
- source_word: אֶל
  choice: contra
  rationale: Embora a preposição possa significar “a” ou “em direção a”, o contexto de denúncia lhe confere sentido adversativo.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Preserva a imagem literal de parentesco e solidariedade comunitária, relevante para acentuar a injustiça interna.
- source_word: הַיְּהוּדִים
  choice: judeus
  rationale: É a designação étnico-comunitária mais natural em português moderno; a possibilidade histórico-regional “judeus da Judeia” é registrada em nota.
theological_decisions:
- issue: Sentido de יְהוּדִים
  choice: judeus
  alternative: judeus da Judeia
  rationale: No contexto, a denúncia ocorre dentro da própria comunidade judaica, e “irmãos judeus” comunica essa solidariedade interna. O termo também pode destacar a procedência ou identidade regional ligada à Judeia, possibilidade preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Clamor” conserva a força pública e emocional da denúncia; a construção evita introduzir um marcador temporal sem correspondente explícito no texto hebraico.
