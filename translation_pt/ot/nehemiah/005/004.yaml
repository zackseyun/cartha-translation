  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: pt
  text: 'Havia ainda os que diziam: “Tomamos dinheiro emprestado para pagar o imposto do rei[a] sobre os nossos campos e vinhedos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tributo do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Havia ainda os que diziam
  rationale: Introduz outro grupo entre os que apresentavam suas queixas. O passado se ajusta ao contexto narrativo, e “diziam” preserva o aspecto continuado ou reportivo do particípio.
- source_word: לָוִינוּ
  choice: Tomamos dinheiro emprestado
  rationale: Expressa de modo natural a ação de contrair um empréstimo; no contexto, seus efeitos ainda pesavam sobre os reclamantes.
- source_word: כֶסֶף
  choice: dinheiro
  rationale: Embora o sentido literal seja “prata”, em contexto econômico o termo designa dinheiro.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: para pagar o imposto do rei
  rationale: A expressão indica uma quantia cobrada pela autoridade real. “Imposto” é claro e atual; “tributo” permanece uma alternativa legítima.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: sobre os nossos campos e vinhedos
  rationale: Os bens parecem ser a base sobre a qual a cobrança real incidia. “Sobre” comunica naturalmente essa relação fiscal sem sugerir que as terras foram necessariamente dadas como garantia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vinhedos” foi preferido a “vinhas” por transparência contemporânea. A nota preserva a alternativa lexical de לְמִדַּת sem sobrecarregar o texto principal; não se acrescentou nota para כֶסֶף, pois “dinheiro” transmite diretamente seu sentido contextual.
