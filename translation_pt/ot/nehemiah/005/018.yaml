  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: pt
  text: O que se preparava para cada dia era um boi e seis ovelhas escolhidas; também se preparavam aves para mim e, a cada dez dias, uma grande quantidade de todo tipo de vinho. Mesmo assim, não exigi a provisão de alimentos do governador[a], porque o trabalho pesava sobre este povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pão do governador”; a expressão pode significar as provisões ou a porção de alimentos vinculada ao cargo.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque o serviço era pesado para este povo” ou “porque o encargo sobre este povo era grande”. O hebraico ressalta o peso suportado pelo povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה
  choice: O que se preparava
  rationale: O passivo de עשה, no contexto de refeições, indica aquilo que era preparado regularmente. O imperfeito em português expressa bem essa prática habitual.
- source_word: לְיוֹם אֶחָד
  choice: para cada dia
  rationale: Embora literalmente seja “para um dia”, o contexto descreve a quantidade diária recorrente.
- source_word: שׁוֹר אֶחָד
  choice: um boi
  rationale: שׁוֹר designa um bovino; “boi” é a forma corrente e adequada ao contexto de provisões.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: seis ovelhas escolhidas
  rationale: צֹאן pode designar animais de rebanho em sentido coletivo, e בְּרֻרוֹת indica animais selecionados ou de qualidade.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: também se preparavam aves para mim
  rationale: צִפֳּרִים é um termo amplo para aves; o contexto culinário favorece “se preparavam”.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: a cada dez dias
  rationale: A expressão indica um intervalo recorrente de dez dias.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: uma grande quantidade de todo tipo de vinho
  rationale: A formulação preserva tanto a variedade indicada por בְּכָל quanto a abundância indicada por לְהַרְבֵּה.
- source_word: וְעִם זֶה
  choice: Mesmo assim
  rationale: A expressão introduz o contraste entre as despesas descritas e a recusa de reivindicar a provisão oficial.
- source_word: לֶחֶם הַפֶּחָה
  choice: a provisão de alimentos do governador
  rationale: Literalmente, “o pão do governador”; aqui לֶחֶם funciona por extensão como alimento ou provisão ligada ao cargo.
- source_word: לֹא בִקַּשְׁתִּי
  choice: não exigi
  rationale: בקשׁ pode significar pedir ou buscar; no contexto de uma prerrogativa oficial, “não exigi” comunica que Neemias abriu mão de cobrá-la.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: porque o trabalho pesava sobre este povo
  rationale: A tradução conserva a imagem hebraica do peso e deixa aberta a abrangência de עֲבֹדָה como trabalho, serviço ou encargo.
theological_decisions:
- issue: Nuance socioeconômica da recusa de Neemias
  choice: Neemias não exigiu a provisão oficial associada ao governo, por consideração ao peso suportado pelo povo.
  alternative: Neemias apenas não pediu pão, ou recusou especificamente um tributo separado.
  rationale: O contexto favorece uma prerrogativa alimentar ligada ao cargo, mas a tradução evita definir além do texto o mecanismo exato pelo qual ela seria fornecida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “se preparava” para a prática habitual e “pesava sobre” para conservar de modo natural a metáfora hebraica. As notas preservam as ambiguidades de לֶחֶם e עֲבֹדָה sem impor uma leitura denominacional.
