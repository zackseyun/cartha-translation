base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: pt
  text: Lembra-te de mim[a], meu Deus, para o meu bem, por tudo o que fiz em favor deste povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lembra-te de mim favoravelmente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Lembra-te de mim
  rationale: O apelo dirigido a Deus emprega זכר com לִי; em português, a forma idiomática e fiel é «lembra-te de mim».
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: A forma com sufixo de primeira pessoa expressa uma invocação pessoal; a pontuação deixa claro o vocativo sem exigir «ó».
- source_word: לְטוֹבָה
  choice: para o bem
  rationale: Preserva a construção hebraica e sua abertura sem decidir se o bem é benefício, favor ou resultado favorável.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: tudo o que fiz
  rationale: Tradução natural da construção relativa e do perfeito hebraico em retrospectiva.
- source_word: עַל הָעָם הַזֶּה
  choice: por este povo
  rationale: Neste contexto, עַל indica ações realizadas em benefício ou em favor do povo; «por» é conciso e natural.
theological_decisions:
- issue: Natureza da oração de Neemias para ser lembrado
  choice: Pedido para que Deus se lembre de Neemias para o bem, tendo em vista suas ações em favor do povo
  alternative: Pedido de vindicação pública ou reivindicação de mérito diante de Deus
  rationale: A tradução mantém o pedido de lembrança favorável, mas não acrescenta uma doutrina de mérito nem restringe a petição à vindicação pública.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal «lembra-te» conserva o tom de oração sem soar excessivamente arcaica; «para o bem» preserva o hebraísmo e a ambiguidade do original.
