  text: וַ/יִּ֥חַר לִ֖/י מְאֹ֑ד כַּ/אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ אֶת זַֽעֲקָתָ֔/ם וְ/אֵ֖ת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: pt
  text: Fiquei muito indignado quando ouvi o clamor deles e essas palavras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e esses acontecimentos”. A palavra hebraica pode se referir tanto às palavras ditas quanto aos fatos relatados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: Fiquei indignado
  rationale: A construção idiomática חרה + ל descreve a ira que se acende em alguém. “Fiquei indignado” é natural em português e, neste contexto de injustiça social, preserva a forte reação de Neemias sem recorrer a uma tradução literal pouco idiomática.
- source_word: מְאֹד
  choice: muito
  rationale: O advérbio intensifica a indignação e é expresso de maneira clara e corrente por “muito”.
- source_word: כַּאֲשֶׁר
  choice: quando
  rationale: A conjunção introduz a circunstância temporal em que surgiu a indignação de Neemias; “quando” comunica esse sentido naturalmente.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O verbo שמע indica aqui a percepção do clamor e do que foi dito; “ouvi” é a correspondência direta e adequada ao contexto.
- source_word: זַעֲקָתָם
  choice: o clamor deles
  rationale: זעקה designa um grito de aflição ou protesto. “Clamor” conserva tanto a intensidade emocional quanto o caráter coletivo da queixa.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: e essas palavras
  rationale: דברים pode significar “palavras” ou “assuntos”. “Essas palavras” oferece a tradução mais direta no contexto do que Neemias ouviu, enquanto uma nota preserva a alternativa legítima.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Indignado” expressa uma reação forte diante da injustiça sem exagerar o tom; “clamor” mantém a força social e emocional do hebraico.
