base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: pt
  text: Também eu, meus irmãos e meus servos lhes emprestamos dinheiro e cereal. Por favor, deixemos esta cobrança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este peso” ou “esta dívida”. O termo hebraico significa literalmente “carga” e, neste contexto, pode referir-se a uma cobrança ou obrigação financeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Também eu
  rationale: Preserva a força aditiva e enfática da expressão hebraica, ligando Neemias e seus associados à prática mencionada.
- source_word: אַחַי
  choice: meus irmãos
  rationale: Mantém o termo familiar literal e a solidariedade social expressa no hebraico, sem restringi-lo necessariamente a irmãos de sangue.
- source_word: וּנְעָרַי
  choice: meus servos
  rationale: נְעָרִים pode significar jovens, servos ou auxiliares; no contexto da comitiva de Neemias, “servos” é claro e natural.
- source_word: נֹשִׁים בָּהֶם
  choice: estamos emprestando a eles
  rationale: O particípio de נשׁה descreve a atuação como credor. A formulação portuguesa expressa o sentido básico, enquanto o contexto e a exortação seguinte mostram que a cobrança se tornou opressiva.
- source_word: כֶּסֶף וְדָגָן
  choice: dinheiro e cereal
  rationale: כֶּסֶף tem sentido monetário neste contexto de empréstimos; דָגָן designa cereal ou grão como produto agrícola.
- source_word: נַעַזְבָה נָּא
  choice: Por favor, deixemos de cobrar
  rationale: O coortativo com נָא constitui um apelo inclusivo. “Deixemos de” comunica naturalmente a exortação para cessar a prática.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: esta dívida
  rationale: מַשָּׁא significa literalmente “carga” e, no contexto financeiro, pode designar aquilo que se exige ou a dívida que pesa sobre o devedor. “Dívida” torna a referência clara, com a metáfora preservada em nota.
