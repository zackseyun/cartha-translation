revisions:
- from: Também eu, meus irmãos e meus servos, estamos emprestando a eles dinheiro e cereal. Por favor, deixemos de cobrar esta dívida.[a]
  to: Também eu, meus irmãos e meus servos lhes emprestamos dinheiro e cereal. Por favor, deixemos esta cobrança.[a]
  rationale: A revisão substitui a expressão que tratava a dívida como objeto direto de “cobrar” por “esta cobrança”, que corresponde melhor ao apelo para cessar a prática financeira onerosa. Também torna a primeira frase mais idiomática, sem alterar o sentido nem eliminar a alternativa contextual para “servos”.
