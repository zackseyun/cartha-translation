base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: pt
  text: Passe esta noite aqui. Pela manhã, se ele quiser resgatar você[a], muito bem — que ele a resgate. Mas, se ele não quiser resgatar você, eu mesmo a resgatarei, tão certo como Yahweh vive. Fique deitada até de manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neste contexto, “resgatar” se refere ao papel de um parente-resgatador: um familiar que podia assumir deveres de resgate em favor da família.'
    reason: Esclarece o sentido jurídico-familiar específico do verbo גאל sem restringi-lo a uma única obrigação legal.
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Passe a noite aqui
  rationale: O verbo לון significa passar a noite ou pernoitar. A expressão é natural em português e comunica o sentido contextual; “aqui” explicita de modo mínimo o local já presente na situação.
- source_word: וְהָיָה בַבֹּקֶר
  choice: Pela manhã
  rationale: Introduz de forma natural o que acontecerá na manhã seguinte, sem reproduzir mecanicamente a construção hebraica.
- source_word: אִם יִגְאָלֵךְ
  choice: se ele resgatar você
  rationale: Mantém o vocabulário de resgate ligado à obrigação jurídico-familiar de גאל e preserva sua ressonância temática; a nota explica o sentido específico.
- source_word: טוֹב יִגְאָל
  choice: muito bem — que a resgate
  rationale: טוֹב é uma aprovação elíptica do resultado, e o segundo verbo expressa a aceitação de Boaz de que o outro homem exerça esse direito.
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: não quiser resgatar você
  rationale: חפץ indica desejo ou disposição. “Não quiser” é corrente e preserva o caráter volitivo da expressão.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: eu mesmo resgatarei você
  rationale: O pronome אָנֹכִי é enfático; “eu mesmo” destaca o compromisso pessoal de Boaz sem acrescentar conteúdo.
- source_word: חַי יְהוָה
  choice: tão certo como Yahweh vive
  rationale: Reproduz em português corrente a fórmula hebraica de juramento e conserva o nome divino.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Fique deitada até de manhã
  rationale: שכב significa deitar-se ou permanecer deitado. No contexto, “fique deitada” expressa naturalmente a continuidade até o amanhecer.
theological_decisions:
- issue: Sentido de גאל no contexto jurídico-familiar de Rute
  choice: manter “resgatar” no texto principal
  alternative: “agir como parente-resgatador” ou “cumprir o dever de resgatador da família”
  rationale: “Resgatar” preserva o elo lexical e teológico do livro sem reduzir o termo a uma única obrigação legal. A nota esclarece que se trata do papel de um parente com direito e responsabilidade de resgate.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “você” para evitar formas regionais ou arcaizantes; mantém concisão próxima à do hebraico e explica apenas em nota o sentido técnico do resgate familiar.
