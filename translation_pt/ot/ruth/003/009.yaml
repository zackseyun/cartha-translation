base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: pt
  text: 'Ele disse: “Quem é você?” Ela respondeu: “Sou Rute, sua serva. Estenda a sua asa sobre a sua serva[a], pois você é um resgatador[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Estenda a extremidade da sua veste sobre a sua serva”. A palavra hebraica pode significar “asa” ou a extremidade de uma veste; a expressão talvez evoque intencionalmente tanto proteção quanto uma reivindicação matrimonial.
    reason: lexical_alternative
  - marker: b
    text: Ou “parente-resgatador”, isto é, um parente com a responsabilidade reconhecida de agir em favor de um membro da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: Quem é você?
  rationale: Tradução direta e natural da pergunta de identificação, em português moderno e amplamente compreensível.
- source_word: אָנֹכִי רוּת
  choice: Sou Rute
  rationale: A oração nominal hebraica é expressa naturalmente em português com o verbo ser; o pronome explícito é desnecessário.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: sua serva
  rationale: אמה designa uma serva e marca a autodesignação humilde de Rute. “Sua serva” é atual, digna e mantém a forma feminina e a repetição do original.
- source_word: וּפָרַשְׂתָּ
  choice: Estenda
  rationale: פרשׂ indica estender ou abrir algo sobre alguém. O imperativo português comunica naturalmente o pedido de Rute sem enfraquecer a imagem concreta.
- source_word: כְנָפֶךָ
  choice: a sua asa
  rationale: כנף pode significar “asa” e também a extremidade de uma veste. A tradução principal conserva “asa” para preservar a possível dupla ressonância de proteção e compromisso matrimonial; a alternativa ligada à veste aparece em nota.
- source_word: עַל
  choice: sobre
  rationale: “Sobre” representa de modo direto a relação espacial e a ideia de cobertura nesta construção.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão do pedido. “Pois” é conciso, natural e adequado ao registro digno do diálogo.
- source_word: גֹאֵל
  choice: um resgatador
  rationale: גֹאֵל designa quem exerce o resgate no âmbito familiar. “Resgatador” conserva o termo central sem inserir toda a explicação jurídica no diálogo; a dimensão de parentesco é esclarecida em nota.
theological_decisions:
- issue: Força metafórica de כְנָפֶךָ no pedido de Rute
  choice: Manter “a sua asa” no texto principal, deixando implícita a associação com a veste e com um compromisso matrimonial.
  alternative: Traduzir “a ponta da sua veste” para destacar a cena concreta e a possível reivindicação matrimonial.
  rationale: A palavra hebraica admite os dois sentidos e provavelmente cria uma ressonância deliberada entre proteção e cobertura matrimonial. Manter “asa” evita resolver uma ambiguidade literária e teológica genuína.
- issue: Sentido jurídico e familiar de גֹאֵל
  choice: Usar “resgatador” no texto principal e explicar em nota a função do parente-resgatador.
  alternative: Usar “parente-resgatador” ou “resgatador da família” no texto principal.
  rationale: “Resgatador” preserva de modo conciso o núcleo lexical e teológico do termo, enquanto a nota comunica a dimensão familiar e jurídica indispensável ao contexto de Rute.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. O diálogo é conciso. “Sua serva” conserva a humildade e o gênero da autodesignação de Rute; “asa” e “resgatador” mantêm termos-chave e suas tensões sem explicação excessiva no corpo do versículo.
