base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: pt
  text: 'Então ele disse: “Traga o manto que está sobre você e segure-o.” Ela o segurou, e ele mediu seis medidas[a] de cevada e colocou a cevada sobre ela. Depois, ele entrou na cidade.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seis cevadas”. A unidade de medida não é informada; por isso, acrescentou-se “medidas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Algumas versões antigas e muitas traduções trazem: “Depois, ela entrou na cidade”. O Texto Massorético traz: “Depois, ele entrou na cidade”.'
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Traga
  rationale: O imperativo feminino singular pede que Rute apresente a peça de roupa. “Traga” é natural em português e se ajusta à ordem seguinte.
- source_word: הַמִּטְפַּחַת
  choice: o manto
  rationale: O substantivo designa uma peça de roupa ou envoltório que, neste contexto, pode servir para carregar cereal. “Manto” evita a imagem potencialmente enganosa de um véu delicado.
- source_word: וְאֶחֳזִי בָהּ
  choice: e segure-o aberto
  rationale: Embora אחז signifique segurar ou agarrar, o contexto indica que Rute devia manter o manto aberto para receber a cevada. A formulação explicita apenas o sentido necessário da ação.
- source_word: וַיָּמָד
  choice: ele mediu
  rationale: Reproduz o sentido usual do verbo no contexto de separar deliberadamente uma quantidade de cereal.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: seis medidas de cevada
  rationale: O hebraico diz literalmente “seis cevadas” e não informa a unidade. “Medidas” é uma complementação mínima e evita identificar sem base uma medida específica.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: e pôs a cevada sobre ela
  rationale: O objeto subentendido é a quantidade de cevada recém-medida. A repetição de “cevada” torna a referência clara em português sem especificar como Rute acomodou a carga.
- source_word: וַיָּבֹא הָעִיר
  choice: Depois, ele entrou na cidade
  rationale: O verbo do Texto Massorético está no masculino singular. “Entrou na cidade” expressa naturalmente em português o movimento indicado pela construção hebraica.
theological_decisions:
- issue: Sujeito da oração final וַיָּבֹא הָעִיר
  choice: Depois, ele entrou na cidade
  alternative: Depois, ela entrou na cidade
  rationale: O Texto Massorético apresenta o verbo no masculino, razão pela qual o texto principal conserva “ele”. Algumas versões antigas apresentam o feminino, leitura que também se harmoniza com a sequência narrativa; por isso, ela é registrada em nota sem resolver silenciosamente a variante.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto para leitores brasileiros quanto para um público lusófono amplo. As notas aparecem junto aos trechos a que efetivamente se referem; evitam-se unidade de medida específica e harmonização silenciosa do sujeito da oração final.
