  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: pt
  text: 'Ela disse: “Ele me deu estas seis medidas de cevada[a], pois ele disse: ‘Não volte de mãos vazias para a sua sogra’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “estas seis cevadas”. A unidade específica não é informada; por isso, “medidas” foi acrescentado para dar clareza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ela disse
  rationale: O wayyiqtol narrativo de אמר introduz o relato de Rute; em português, a conjunção pode ser omitida com naturalidade sem perda de sentido.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: estas seis medidas de cevada
  rationale: O hebraico traz literalmente algo como “estas seis cevadas”, sem declarar a unidade. “Medidas” é suprido para produzir português claro, enquanto a nota preserva a imprecisão do original.
- source_word: נָתַן לִי
  choice: ele me deu
  rationale: O perfeito qal de terceira pessoa masculina singular com objeto de primeira pessoa singular é expresso naturalmente pelo pretérito perfeito.
- source_word: כִּי אָמַר
  choice: pois disse
  rationale: כִּי introduz a explicação da dádiva; “pois” mantém essa relação causal, e o sujeito de אָמַר é recuperável no contexto.
- source_word: אַל תָּבוֹאִי
  choice: Não volte
  rationale: A forma negativa dirige-se a Rute e se refere ao seu retorno à sogra. “Voltar” exprime em português a direção contextual do movimento sem traduzir rigidamente בוא por “vir”.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: A expressão idiomática comunica que Rute não deveria retornar sem presente ou provisão.
- source_word: אֶל חֲמוֹתֵךְ
  choice: para a sua sogra
  rationale: חֲמוֹת designa especificamente a sogra; אֶל indica o destino do retorno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala direta foi mantida, e a unidade não especificada no hebraico foi explicitada no texto apenas com nota de transparência.
