base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: pt
  text: 'Quando chegou à sua sogra, esta lhe perguntou: “Quem é você, minha filha?”[a] Então Rute lhe contou tudo o que o homem havia feito por ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Como foi, minha filha?” O hebraico diz literalmente: “Quem é você, minha filha?” A pergunta talvez se refira à possível mudança da condição de Rute ou ao resultado de seu encontro.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: Quando chegou à sua sogra
  rationale: O wayyiqtol faz a narrativa avançar; “quando chegou” liga naturalmente a chegada à pergunta seguinte. חֲמוֹתָהּ designa especificamente a sogra de Rute.
- source_word: וַתֹּאמֶר
  choice: esta lhe perguntou
  rationale: Embora o verbo seja o comum “disse”, a fala é interrogativa. O demonstrativo “esta” identifica naturalmente a sogra como sujeito e evita ambiguidade entre as duas mulheres.
- source_word: מִי אַתְּ בִּתִּי
  choice: Quem é você, minha filha?
  rationale: Preserva o sentido lexical direto e a possível implicação de uma mudança de condição após o encontro, sem resolver no texto principal uma expressão hebraica incomum. “Minha filha” mantém o tratamento afetuoso.
- source_word: וַתַּגֶּד לָהּ
  choice: Então Rute lhe contou
  rationale: O hifil de נגד significa contar ou relatar. Nomear Rute esclarece o sujeito em português sem alterar o referente do hebraico.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: tudo o que o homem havia feito por ela
  rationale: “Tudo o que” reproduz a abrangência do relato. עשה com ל tem aqui sentido beneficente, portanto “por ela” é mais adequado que “a ela”. O mais-que-perfeito situa as ações antes do relato, e “o homem” conserva a forma hebraica sem antecipar o nome de Boaz.
