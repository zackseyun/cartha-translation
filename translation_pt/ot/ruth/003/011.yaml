id: RUT.3.11
reference: Ruth 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: pt
  text: E agora, minha filha, não tenha medo. Farei por você tudo o que disser, pois todo o meu povo à porta da cidade[a] sabe que você é uma mulher de valor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A porta da cidade era o lugar público onde se tratavam assuntos comunitários e jurídicos. A expressão hebraica também pode ser traduzida: “todos os do meu povo que estão à porta da cidade”.'
    reason: cultural_note
  - marker: b
    text: Ou “uma mulher digna”, “uma mulher de caráter nobre” ou “uma mulher valente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: minha filha
  rationale: Mantém a forma de tratamento familiar e protetora usada por Boaz, sem implicar necessariamente filiação biológica.
- source_word: אַל תִּירְאִי
  choice: não tenha medo
  rationale: Expressa de modo natural em português atual a proibição ou encorajamento do hebraico.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Farei por você tudo o que disser
  rationale: Preserva o verbo hebraico 'dizer' e a amplitude da promessa, sem restringi-la explicitamente a um pedido.
- source_word: כָּל שַׁעַר עַמִּי
  choice: todo o meu povo à porta da cidade
  rationale: Conserva a imagem cultural da porta como espaço público, mas explicita 'cidade' para que a expressão seja compreensível em português. A formulação hebraica emprega 'porta' metonimicamente para os presentes no foro público da comunidade.
- source_word: אֵשֶׁת חַיִל
  choice: uma mulher de valor
  rationale: Mantém a amplitude de חַיִל, que pode envolver força, capacidade, excelência, dignidade e integridade, e preserva a ressonância da mesma expressão em Provérbios 31.
theological_decisions:
- issue: Amplitude da caracterização אֵשֶׁת חַיִל
  choice: uma mulher de valor
  alternative: uma mulher de caráter nobre; uma mulher digna; uma mulher valente
  rationale: A escolha evita reduzir a expressão apenas à moralidade ou à valentia militar. Comunica a reputação pública de Ruth como mulher íntegra, capaz e digna, mantendo aberta a riqueza semântica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da promessa foi ajustada para soar natural, sem alterar seu alcance. As marcas de nota [a] e [b] aparecem junto às expressões a que se referem.
