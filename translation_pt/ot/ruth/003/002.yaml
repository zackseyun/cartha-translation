  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: pt
  text: E agora, não é Boaz nosso parente[a], aquele com cujas jovens você esteve[b]? Veja, esta noite ele estará joeirando a cevada na eira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso membro do clã”. O termo hebraico pode indicar uma ligação de parentesco ou de clã, não apenas um conhecido.
    reason: lexical_alternative
  - marker: b
    text: Ou “com cujas servas você esteve”. O termo hebraico pode se referir às jovens trabalhadoras ou assistentes de Boaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação narrativa de וְ quanto o valor temporal de עַתָּה, introduzindo o passo seguinte do plano de Noemi.
- source_word: הֲלֹא
  choice: não é
  rationale: Introduz uma pergunta retórica que espera concordância; esta forma é natural em português.
- source_word: מֹדַעְתָּנוּ
  choice: nosso parente
  rationale: No contexto, designa alguém ligado à família ou ao clã, e não um simples conhecido. “Parente” é claro e atual.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: aquele com cujas jovens você esteve
  rationale: Mantém a oração relativa e a associação de Rute com as trabalhadoras de Boaz, sem impor ao substantivo a ideia estrita de servidão.
- source_word: הִנֵּה
  choice: Veja
  rationale: Chama a atenção para a circunstância relevante e soa natural no português contemporâneo.
- source_word: זֹרֶה
  choice: estará joeirando
  rationale: O particípio pode apresentar uma atividade em curso ou iminente; com “esta noite”, o futuro progressivo comunica naturalmente a ação esperada naquela noite.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: a cevada na eira
  rationale: 'Embora a construção mencione literalmente a “eira da cevada”, o verbo “joeirar” pede como objeto o cereal processado. A formulação expressa com clareza a cena: Boaz joeira a cevada na eira.'
- source_word: הַלָּיְלָה
  choice: esta noite
  rationale: Equivalente idiomático do acusativo adverbial de tempo, preservando a referência à noite imediata.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Joeirar” conserva o termo agrícola específico; “na eira” esclarece o local da ação. A ordem foi ajustada com leveza para soar natural sem eliminar a pergunta retórica nem o marcador de atenção.
