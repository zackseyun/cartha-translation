base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: pt
  text: Boaz comeu e bebeu, e seu coração ficou alegre[a]. Depois, foi deitar-se na extremidade do monte de grãos. Então ela se aproximou em silêncio, descobriu os pés dele[b] e se deitou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu coração ficou bom”. O idioma hebraico indica alegria ou bom ânimo, mas, por si só, não exige que Boaz estivesse embriagado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “descobriu os pés dele”. Alguns entendem isso como uma ação inteiramente literal; outros percebem possíveis conotações sugestivas. A formulação hebraica é contida e não descreve explicitamente atividade sexual.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל בֹּעַז וַיֵּשְׁתְּ
  choice: Boaz comeu e bebeu
  rationale: Traduz diretamente a sequência narrativa hebraica, sem acrescentar que ele se embriagou.
- source_word: וַיִּיטַב לִבּוֹ
  choice: ficou bem-disposto
  rationale: Expressa em português natural o idioma hebraico segundo o qual o coração se tornou bom ou agradável, indicando alegria e bom ânimo sem exigir embriaguez.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: foi deitar-se
  rationale: Reproduz naturalmente o movimento narrativo e mantém o sentido de deitar-se, sem afirmar explicitamente que adormeceu.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: junto à extremidade do monte de cereal
  rationale: קֵצֶה indica extremidade ou borda, e עֲרֵמָה designa um monte; o contexto da eira justifica explicitar que era de cereal.
- source_word: בַלָּט
  choice: em silêncio
  rationale: Comunica uma aproximação discreta e quieta, sem acrescentar julgamento moral ou intenção indevida.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: descobriu os pés dele
  rationale: Preserva a formulação concreta e contida do hebraico, sem decidir se há ou não conotações sugestivas.
- source_word: וַתִּשְׁכָּב
  choice: se deitou
  rationale: Tradução direta do verbo deitar-se; não o amplia para implicar atividade sexual.
theological_decisions:
- issue: Se as ações de Rute devem ser traduzidas como referência explícita a atividade sexual
  choice: 'Manter a descrição literal e contida: ela descobriu os pés de Boaz e se deitou.'
  alternative: Empregar uma formulação interpretativa que sugira sedução, exposição genital ou contato sexual.
  rationale: O hebraico não descreve explicitamente atividade sexual. A tradução preserva a possível tensão narrativa sem resolver a ambiguidade em favor de uma leitura específica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Bem-disposto” traduz o idioma do coração de maneira natural; “monte de cereal” esclarece o referente contextual sem transformar a cena em paráfrase. Os marcadores [a] e [b] aparecem no texto principal.
