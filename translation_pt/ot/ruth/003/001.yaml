  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: pt
  text: 'Então Noemi, sua sogra, lhe disse: “Minha filha, não devo procurar para você um lugar de descanso[a], para que tudo corra bem para você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descanso”, “segurança” ou “um lar”. No contexto, Noemi procura para Rute uma condição estável e boa, provavelmente por meio do casamento; literalmente, o hebraico diz “lugar de descanso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: נָעֳמִי
  choice: Noemi
  rationale: Usa a forma tradicional e amplamente reconhecida do nome em português.
- source_word: חֲמוֹתָהּ
  choice: sua sogra
  rationale: O substantivo com sufixo feminino singular identifica a relação de Noemi com Rute.
- source_word: בִּתִּי
  choice: Minha filha
  rationale: Preserva o vocativo afetuoso e familiar sem acrescentar uma intensidade ausente no hebraico.
- source_word: הֲלֹא אֲבַקֶּשׁ
  choice: não devo procurar
  rationale: Mantém a pergunta retórica que espera concordância e traduz בקש por um verbo corrente, sem especificar demais a ação de Noemi.
- source_word: מָנוֹחַ
  choice: um lugar de descanso
  rationale: Preserva a imagem hebraica de repouso ou condição estável, sem explicitar casamento no texto principal.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: onde você possa viver bem
  rationale: Exprime de modo natural o bem-estar pretendido para Rute; o relativo é entendido como ligado à condição estável representada pelo lugar de descanso.
