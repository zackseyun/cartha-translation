base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: pt
  text: 'Ela ficou deitada aos pés dele até o amanhecer e se levantou antes que as pessoas pudessem reconhecer umas às outras[a]. E ele disse[b]: “Que não se saiba que a mulher veio à eira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “antes que um homem pudesse reconhecer o seu semelhante”. A expressão indica o momento em que ainda havia pouca luz para as pessoas se distinguirem umas das outras.'
    reason: lexical_alternative
  - marker: b
    text: 'Pelo contexto, o falante é muito provavelmente Boaz, embora o hebraico diga apenas: “E ele disse”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתו
  choice: aos pés dele
  rationale: O termo indica o lugar dos pés ou das pernas de Boaz. “Aos pés dele” é natural em português e preserva a descrição espacial sem especificar além do hebraico.
- source_word: בטרום
  choice: antes que
  rationale: A forma introduz uma circunstância temporal anterior; “antes que” expressa com clareza essa relação em português atual.
- source_word: יכיר
  choice: pudesse reconhecer
  rationale: O verbo tem aqui o sentido de reconhecer ou distinguir alguém. O auxiliar “pudesse” comunica que a pouca luz ainda não permitia o reconhecimento.
- source_word: איש את רעהו
  choice: alguém pudesse reconhecer outra pessoa
  rationale: A formulação hebraica é literalmente masculina e singular, “um homem... o seu próximo”, mas funciona como expressão geral sobre pessoas distinguirem umas às outras. A tradução comunica esse sentido idiomático; a forma literal é preservada em nota.
- source_word: אל יוודע
  choice: Que não se saiba
  rationale: O jussivo negativo passivo expressa o desejo ou a ordem de que o fato não seja divulgado. A formulação impessoal preserva a voz passiva e soa natural e digna.
- source_word: האשה
  choice: a mulher
  rationale: O artigo definido hebraico identifica uma mulher específica na situação, isto é, Rute, sem que o texto a nomeie neste versículo.
- source_word: הגרן
  choice: a eira
  rationale: “Eira” é o termo português tradicional e preciso para o local agrícola onde se debulhavam e joeiravam cereais.
- source_word: ויאמר
  choice: Então ele disse
  rationale: O sujeito masculino singular está implícito. O contexto aponta para Boaz, mas o nome não aparece na oração hebraica; por isso, mantém-se o pronome.
theological_decisions:
- issue: Identificação do falante em ויאמר
  choice: Manter “ele disse” sem nomear Boaz no texto principal.
  alternative: Explicitar “Boaz disse” para maior clareza.
  rationale: Embora o contexto indique fortemente Boaz, o hebraico deixa o sujeito implícito. A tradução evita acrescentar ao texto uma identificação que nele não está expressa, esclarecendo a probabilidade em nota.
- issue: Possíveis implicações sexuais de Rute estar aos pés de Boaz
  choice: 'Traduzir de modo espacial e direto: “ficou deitada aos pés dele”.'
  alternative: Empregar um eufemismo que insinue relações sexuais ou acrescentar linguagem que negue explicitamente essa possibilidade.
  rationale: O versículo informa o lugar e o tempo, mas não afirma nem nega explicitamente um ato sexual. A redação preserva a tensão narrativa sem resolver uma questão debatida além da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eira” mantém a precisão do cenário agrícola; a estrutura impessoal “Que não se saiba” conserva o valor passivo do hebraico. As notas preservam tanto a forma literal do idioma temporal quanto a ambiguidade formal sobre o falante.
