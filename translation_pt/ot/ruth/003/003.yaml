  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: pt
  text: Lave-se[a], unja-se e vista o seu manto[b]. Depois, desça à eira[c]; não se dê a conhecer ao homem até que ele termine de comer e beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “banhe-se”. O verbo hebraico pode indicar lavar ou banhar o corpo.
    reason: lexical_alternative
  - marker: b
    text: Ou “vista a sua roupa”. O hebraico se refere de modo geral a uma veste ou manto; algumas traduções entendem de forma mais específica que se tratava de uma roupa festiva ou da melhor roupa.
    reason: lexical_alternative
  - marker: c
    text: 'A forma consonantal hebraica neste ponto é incomum; pelo contexto, costuma ser entendida como a continuação das instruções de Noemi a Rute: “desça à eira”.'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Lave-se
  rationale: O verbo רחץ pode indicar lavar ou banhar o corpo. “Lave-se” preserva o sentido reflexivo e é natural em português, mantendo a alternativa “banhe-se” em nota.
- source_word: וָסַכְתְּ
  choice: unja-se
  rationale: סוך designa ungir o corpo com óleo ou unguento. “Unja-se” é preciso e evita especificar perfume, que não está explícito.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: vista o seu manto
  rationale: שִׂמְלָה designa de modo geral uma veste, frequentemente uma peça exterior. “Manto” é plausível no contexto e não acrescenta a interpretação de que fossem as melhores roupas.
- source_word: וירדתי הַגֹּרֶן
  choice: Depois, desça à eira
  rationale: Embora a forma consonantal seja incomum, o contexto requer a continuação das instruções de Noemi a Rute na segunda pessoa feminina. “Eira” é o termo português tradicional e preciso para גֹּרֶן.
- source_word: אַל תִּוָּדְעִי
  choice: não se dê a conhecer
  rationale: A formulação preserva a força passiva/reflexiva do nifal de ידע e a responsabilidade de Rute por não se revelar.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: Mantém a expressão hebraica sem substituir explicitamente o referente por “Boaz” nem generalizá-la como “ninguém”.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: até que ele termine de comer e beber
  rationale: כלה com os infinitivos comunica a conclusão das duas ações; a construção escolhida é clara e idiomática em português.
