  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: pt
  text: 'E ela lhe disse: “Farei tudo o que você disser.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ela disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; a forma simples com “E” preserva o encadeamento hebraico em português natural.
- source_word: אֵלֶיהָ
  choice: lhe
  rationale: A preposição אֶל com sufixo de terceira pessoa feminina singular indica a pessoa a quem se dirige a fala; “lhe” expressa isso de modo conciso.
- source_word: כֹּל אֲשֶׁר
  choice: tudo o que
  rationale: A expressão indica totalidade seguida de oração relativa; “tudo o que” é a correspondência idiomática e precisa em português.
- source_word: תֹּאמְרִי
  choice: você disser
  rationale: O imperfeito qal de segunda pessoa feminina singular refere-se às instruções de Noemi. No contexto prospectivo, o futuro do subjuntivo português é natural e preserva a referência ao que ela vier a dizer.
- source_word: אֶעֱשֶׂה
  choice: Farei
  rationale: O imperfeito qal de primeira pessoa singular expressa a decisão ou intenção de Rute; “Farei” comunica diretamente esse compromisso sem acrescentar objeto ausente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal “ela lhe disse” evita ambiguidade sintática excessiva, e “você” torna explícita a segunda pessoa feminina indicada pelo hebraico sem exigir marca de gênero em português.
