base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: pt
  text: 'Então ela disse: “Espere, minha filha, até que você saiba como a questão se resolverá, pois o homem não descansará enquanto não concluir a questão hoje.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבִי
  choice: Espere
  rationale: Embora o imperativo signifique literalmente “sente-se” ou “permaneça”, neste contexto Noemi exorta Rute a ficar onde está e aguardar o desfecho; “Espere” comunica essa força pragmática com naturalidade.
- source_word: בִתִּי
  choice: minha filha
  rationale: Preserva tanto o possessivo explícito quanto o modo afetuoso como Noemi se dirige a Rute.
- source_word: עַד אֲשֶׁר תֵּדְעִין
  choice: até saber
  rationale: O verbo ידע indica aqui chegar a saber algo no futuro; a formulação portuguesa é natural e mantém essa perspectiva.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: como a questão vai se resolver
  rationale: O hebraico diz literalmente “como cairá a questão”, um idioma referente ao desfecho. “Vai se resolver” expressa naturalmente em português o resultado da questão pendente sem tornar literal uma metáfora obscura.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o substantivo definido do hebraico, que no contexto se refere a Boaz, sem inserir o nome próprio onde o texto não o emprega.
- source_word: לֹא יִשְׁקֹט
  choice: não descansará
  rationale: Expressa a determinação do homem de não permanecer inativo até levar o assunto a termo.
- source_word: כִּי אִם כִּלָּה
  choice: enquanto não concluir
  rationale: A construção excetiva indica que ele só descansará depois de completar o que precisa ser feito; “enquanto não concluir” reproduz essa relação de modo idiomático.
- source_word: הַדָּבָר
  choice: isso
  rationale: Evita a repetição pesada de “questão” na mesma frase, mantendo clara a referência ao assunto pendente.
- source_word: הַיּוֹם
  choice: ainda hoje
  rationale: “Hoje” é o sentido direto; “ainda hoje” comunica em português a urgência contextual sem alterar o limite temporal.
