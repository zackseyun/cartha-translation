  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: pt
  text: E agora, é verdade que sou resgatador[a]; mas há também um resgatador mais próximo em parentesco do que eu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um parente próximo com responsabilidades familiares reconhecidas de resgate.
    reason: lexical_alternative
  - marker: b
    text: “Mais próximo” refere-se ao grau de parentesco e, portanto, à precedência no direito de resgate, não à distância física.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz naturalmente o ponto seguinte da fala de Boaz. Em português, “Agora” preserva a função temporal e discursiva sem exigir a reprodução mecânica da conjunção וְ.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: é verdade que
  rationale: A sequência afirma ou concede a veracidade do que segue. “É verdade que” comunica essa força em português corrente e preserva a construção um tanto enfática do hebraico.
- source_word: גֹאֵל
  choice: resgatador
  rationale: Designa o parente que possuía responsabilidades reconhecidas de resgate no âmbito familiar. “Resgatador” preserva o núcleo lexical; a nota esclarece a dimensão jurídica e de parentesco.
- source_word: אָנֹכִי
  choice: eu sou
  rationale: O pronome independente torna explícito e possivelmente enfático o sujeito; “eu sou” conserva essa explicitude.
- source_word: וְגַם יֵשׁ
  choice: contudo, há outro
  rationale: O hebraico acrescenta um fato que limita a afirmação anterior. “Contudo” expressa essa relação contextual, enquanto “há outro” comunica naturalmente a existência de mais um resgatador.
- source_word: גֹאֵל קָרוֹב מִמֶּנִּי
  choice: resgatador que é parente mais próximo do que eu
  rationale: No contexto, a proximidade é de parentesco e determina a precedência no direito ou dever de resgate. Tornar “parente” explícito evita que o leitor entenda mera proximidade física.
theological_decisions:
- issue: Sentido de גֹאֵל no contexto jurídico-familiar
  choice: resgatador
  alternative: parente-resgatador; remidor
  rationale: O termo se refere aqui a uma função familiar concreta, não diretamente à redenção espiritual. “Resgatador” mantém o sentido básico sem importar uma formulação doutrinária; a nota registra a especificidade cultural.
- issue: Sentido de קָרוֹב מִמֶּנִּי
  choice: parente mais próximo do que eu
  alternative: mais próximo do que eu
  rationale: A proximidade relevante é genealógica e está ligada à precedência no resgate. A explicitação é contextual, não uma resolução denominacional, e impede uma leitura espacial inadequada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Resgatador” foi preferido a “remidor”, de uso menos corrente, e a compostos mais técnicos no texto principal. A ordem e a relação concessiva das duas afirmações foram preservadas de modo natural.
