base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: pt
  text: Quando ele se deitar, observe o lugar onde estará deitado. Então vá, descubra os pés dele[a] e deite-se[b], e ele lhe dirá o que você deve fazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «a região dos pés dele» ou «a parte inferior do corpo dele». A expressão hebraica pode indicar mais especificamente a área ao redor dos pés, e não somente os pés.
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica escrita diz «e eu me deitei», mas a leitura tradicional e o contexto a entendem como «e você se deitará».
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Quando ele se deitar
  rationale: A forma de היה, seguida do infinitivo com ב, introduz a circunstância temporal da próxima instrução. A tradução natural em português é «Quando ele se deitar».
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: observe o lugar
  rationale: ידע significa literalmente «saber/conhecer», mas aqui pede que Rute preste atenção e identifique o local. «Observe» comunica esse sentido prático sem expansão indevida.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: onde estará deitado
  rationale: A oração identifica o lugar em que Boaz se deitará. O advérbio שָׁם já está naturalmente contido em «onde».
- source_word: וּבָאת
  choice: Então vá
  rationale: בוא pode ser traduzido por «vir» ou «ir» conforme o ponto de vista. Na instrução de Noemi sobre o deslocamento de Rute, «vá» é natural; «Então» preserva a sequência.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: descubra os pés dele
  rationale: גלה significa «descobrir», e מַרְגְּלוֹת pode indicar os pés ou a região junto a eles. A formulação direta é mantida no texto, e a extensão semântica é registrada em nota.
- source_word: וְשָׁכָבְתִּי
  choice: e deite-se
  rationale: Embora a forma escrita seja de primeira pessoa, a leitura tradicional e o contexto das instruções dirigidas a Rute requerem a segunda pessoa do singular. A nota preserva o dado textual.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Ele lhe dirá
  rationale: נגד no hiphil significa «dizer, declarar, informar». O pronome explícito recebe expressão natural em português.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: o que você deve fazer
  rationale: No contexto, a oração se refere à orientação que Boaz dará a Rute; «deve fazer» comunica a força diretiva de modo idiomático.
theological_decisions:
- issue: Possível ambiguidade sexual da instrução para descobrir os pés de Boaz e deitar-se
  choice: Manter a formulação concreta sem declarar a ação sexual nem puramente inocente
  alternative: Interpretar a expressão como eufemismo sexual ou explicá-la apenas como ato destinado a despertar Boaz
  rationale: O hebraico conserva uma tensão narrativa que não deve ser resolvida pela tradução. O texto principal permanece próximo da expressão original, e a nota apenas informa a possível amplitude de מַרְגְּלוֹת.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Você» torna explícito o feminino singular indicado pelo hebraico no contexto, sem recorrer a formas regionais. A ambiguidade narrativa é preservada.
