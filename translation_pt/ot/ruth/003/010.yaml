  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: pt
  text: 'E ele disse: “Que Yahweh a abençoe, minha filha! Você foi ainda mais bondosa desta vez do que na primeira, pois não foi atrás dos jovens, fossem pobres ou ricos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Que Yahweh a abençoe
  rationale: Expressa naturalmente em português a força de bênção da fórmula hebraica predicativa, preservando o nome divino.
- source_word: בִּתִּי
  choice: minha filha
  rationale: Mantém a metáfora familiar e o tom afetuoso de alguém socialmente mais velho dirigindo-se a uma mulher mais jovem.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Você demonstrou ainda mais bondade agora do que antes
  rationale: Transmite com clareza a comparação entre a ação presente de Rute e sua bondade anterior, sem reproduzir de modo rígido a sintaxe hebraica.
- source_word: חַסְדֵּךְ
  choice: bondade
  rationale: No contexto, designa uma ação concreta de bondade leal para com a família de Noemi; uma nota preserva a amplitude lexical do termo.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: pois não foi atrás de
  rationale: Torna explícita a relação explicativa da construção infinitiva e conserva o idioma de buscar uma opção matrimonial.
- source_word: הַבַּחוּרִים
  choice: nenhum jovem
  rationale: Refere-se aos homens jovens que Rute poderia ter procurado como possíveis maridos. 'Nenhum' combina naturalmente com a negação e com a abrangência indicada pelo par pobre/rico.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: nem pobre nem rico
  rationale: Reproduz naturalmente, sob negação, o merismo que abrange jovens de qualquer condição econômica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חֶסֶד na exaltação da conduta de Rute
  choice: bondade
  alternative: amor leal; lealdade; fidelidade à aliança
  rationale: A fala elogia a ação generosa e leal de Rute ao buscar a preservação da família, e não vantagem romântica ou econômica. 'Bondade' é clara no texto principal, enquanto a nota conserva as ressonâncias relacionais mais amplas.
- issue: Representação do Tetragrama יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o nome divino; 'Yahweh' preserva esse nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O tratamento por 'você' evita regionalismo excessivo; o nome Yahweh e a metáfora 'minha filha' são preservados.
