  naturalness: O texto é claro e de registro digno. “E eis que” é levemente elevado, mas permanece compreensível no português moderno e é especialmente apropriado para manter a força narrativa de וְהִנֵּה. “Aos pés dele” elimina qualquer ambiguidade referencial que “aos seus pés” poderia ter fora de contexto.
  terminology: “Estremeceu”, “se virou”, “uma mulher” e “estava deitada” são escolhas cautelosas e adequadas. A nota sobre o verbo raro preserva alternativas sem decidir indevidamente seu sentido. A nota sobre מַרְגְּלֹתָיו reconhece corretamente a possível abrangência espacial, sem impor leitura sexual ou eufemística.
