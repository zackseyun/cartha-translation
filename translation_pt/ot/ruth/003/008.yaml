  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: pt
  text: E aconteceu que, à meia-noite, o homem estremeceu e se virou[a]; e eis que uma mulher estava deitada aos pés dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é raro e pode indicar que ele se virou, se torceu ou se curvou, em reação à surpresa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos seus pés”; a expressão hebraica também pode se referir, de modo mais amplo, à região dos pés ou à parte inferior das pernas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a progressão narrativa do wayyiqtol de היה em português natural, sem recorrer à fórmula arcaizante “e sucedeu que”.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: à meia-noite
  rationale: Equivalente português conciso e natural para “no meio da noite”, preservando a referência temporal.
- source_word: וַיֶּחֱרַד
  choice: estremeceu
  rationale: Expressa a reação física súbita sem definir de modo excessivo se a causa foi medo, susto ou outra perturbação.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Reproduz de maneira direta a designação de Boaz no texto hebraico.
- source_word: וַיִּלָּפֵת
  choice: se virou
  rationale: O verbo é raro e descreve algum movimento corporal; “se virou” é compreensível e cauteloso, enquanto a nota preserva outras possibilidades.
- source_word: וְהִנֵּה
  choice: Então viu que
  rationale: Transmite em português corrente o valor de descoberta súbita de הִנֵּה, evitando o tom mais arcaico de “e eis que”.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: É o sentido contextual direto do substantivo, sem antecipar qualquer relação conjugal.
- source_word: שֹׁכֶבֶת
  choice: estava deitada
  rationale: O particípio apresenta a postura contínua da mulher no momento em que ela é descoberta.
- source_word: מַרְגְּלֹתָיו
  choice: aos seus pés
  rationale: É a expressão portuguesa mais natural para a localização indicada, sem acrescentar conotação sexual não explícita no hebraico.
theological_decisions:
- issue: Possível leitura sexual ou eufemística da cena
  choice: Descrever de modo direto a mulher deitada aos pés de Boaz.
  alternative: Traduzir de forma mais ampla como “junto aos seus pés ou à parte inferior das pernas”, destacando uma possível insinuação.
  rationale: O hebraico não afirma explicitamente nenhum ato sexual. A tradução mantém a tensão narrativa sem impor julgamento moral ou interpretação teológica, e a nota registra a amplitude lexical da expressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Então viu que” comunica a descoberta súbita de הִנֵּה de modo mais natural do que “e eis que”. Os dois marcadores de nota aparecem no texto principal.
