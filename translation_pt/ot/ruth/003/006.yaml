  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: pt
  text: Então ela desceu à eira e fez tudo conforme sua sogra lhe havia ordenado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então ela desceu à eira e fez exatamente como sua sogra a havia instruído.”'
    reason: Alternativa lexical que explicita a plena conformidade expressa por כְּכֹל אֲשֶׁר e traduz צוה pelo termo mais brando “instruir”.
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: Então ela desceu
  rationale: O verbo ירד expressa movimento para baixo. “Desceu” preserva esse sentido direcional e é natural em português; “então” representa a continuidade narrativa do waw.
- source_word: הַגֹּרֶן
  choice: à eira
  rationale: גֹּרֶן designa o local onde os cereais eram debulhados. “Eira” é o termo português preciso e preserva o artigo definido na contração “à”.
- source_word: וַתַּעַשׂ
  choice: e fez
  rationale: עשה é o verbo amplo “fazer”. Nesta construção, “fez tudo conforme...” reproduz de modo claro e direto o idioma hebraico.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: A expressão indica conformidade completa com as instruções anteriores. “Tudo conforme” preserva a abrangência de כֹל sem tornar a frase artificial.
- source_word: צִוַּתָּה
  choice: lhe havia ordenado
  rationale: צוה significa normalmente “ordenar”. O mais-que-perfeito composto deixa claro que a ordem da sogra antecedeu a ação de Rute, e o pronome “lhe” explicita naturalmente o objeto em português.
- source_word: חֲמוֹתָהּ
  choice: sua sogra
  rationale: חֲמוֹת significa especificamente “sogra”, e o sufixo possessivo é representado por “sua”.
