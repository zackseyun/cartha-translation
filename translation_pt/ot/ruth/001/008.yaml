base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: pt
  text: 'Então Noemi disse às suas duas noras: “Vão, voltem, cada uma para a casa de sua mãe. Que Yahweh demonstre bondade[a] para com vocês, como vocês a demonstraram para com os mortos e para comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor leal”, “amor constante” ou “fidelidade à aliança” (hebraico ḥésed).
    reason: Registra a amplitude semântica de חֶסֶד, que pode reunir bondade, lealdade relacional e fidelidade.
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: suas duas noras
  rationale: כַלָּה designa aqui a esposa de um filho; “noras” é o equivalente português natural e preciso.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Vão, voltem
  rationale: A tradução conserva os dois imperativos femininos plurais e a força da insistência de Noemi, sem fundi-los em uma única ordem.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: cada uma para a casa de sua mãe
  rationale: אִשָּׁה tem sentido distributivo neste contexto. Mantém-se a referência específica à casa da mãe, em vez de generalizá-la como casa da família.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֶסֶד
  choice: bondade
  rationale: No contexto desta bênção, “bondade” comunica de modo claro a benevolência leal implicada por חֶסֶד; outras nuances legítimas são registradas em nota.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: assim como vocês demonstraram para com os que morreram e para comigo
  rationale: O verbo עשה, ligado a חֶסֶד, expressa demonstrar ou praticar bondade. A formulação retoma naturalmente “bondade” sem precisar repeti-la e conserva a referência coletiva aos mortos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem convertê-lo em título; “Javé” é uma adaptação portuguesa possível, mas menos transparente em relação à forma adotada no projeto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. O discurso direto preserva a repetição enfática dos dois imperativos hebraicos. O marcador da nota foi colocado junto a “bondade”, termo ao qual a nota lexical se refere.
