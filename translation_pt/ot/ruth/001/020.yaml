  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: pt
  text: 'Mas ela lhes disse: “Não me chamem Noemi; chamem-me Mara[a], pois o Todo-Poderoso tornou-me muito amarga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noemi significa algo como “agradável”, enquanto Mara significa “amarga”.
    reason: Explica o contraste e o jogo de palavras entre os dois nomes, que não podem ser plenamente preservados por transliteração.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: Mas ela lhes disse
  rationale: O wayyiqtol dá continuidade à narrativa, enquanto “mas” expressa naturalmente a resposta corretiva de Noemi às mulheres; “lhes” representa o referente feminino plural sem explicitação desnecessária.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Não me chamem Noemi
  rationale: קרא com nome pessoal significa chamar ou dar um nome. O plural do imperativo é preservado, e o nome é transliterado.
- source_word: קְרֶאןָ לִי מָרָא
  choice: chamem-me Mara
  rationale: A repetição de “chamar” conserva o contraste retórico entre os nomes; מָרָא é transliterado como designação pessoal, com seu sentido explicado em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada por Noemi para a mudança de nome, em registro corrente e digno.
- source_word: הֵמַר ... לִי מְאֹד
  choice: tornou minha vida muito amarga
  rationale: O hifil de מרר tem sentido causativo, “tornar amargo”. A formulação preserva a ligação lexical com Mara e expressa de modo natural em português a experiência abrangente indicada pelo dativo לִי, sem sugerir apenas uma mudança de temperamento.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino por sua forma portuguesa convencional e semanticamente transparente.
theological_decisions:
- issue: Tradução do título divino שַׁדַּי
  choice: o Todo-Poderoso
  alternative: Shaddai
  rationale: O termo funciona como título divino; traduzi-lo comunica seu valor tradicional ao leitor comum sem introduzir uma leitura denominacional.
- issue: Agência divina na amargura de Noemi
  choice: tornou minha vida muito amarga
  alternative: tratou-me com grande amargura
  rationale: A tradução conserva a afirmação forte e teologicamente tensa de Noemi sobre a ação divina, sem atenuá-la nem acrescentar uma avaliação sobre a exatidão de sua percepção.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira. O plural “chamem” corresponde às mulheres de Belém. A colocação “chamem-me” mantém formalidade moderada sem soar arcaica; “minha vida” torna idiomático o efeito de לִי sem enfraquecer o causativo hebraico.
