  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: pt
  text: “Que Yahweh lhes conceda que encontrem descanso[a], cada uma na casa de seu marido.” Então Noemi as beijou, e elas levantaram a voz e choraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segurança” ou “vida estável”. Aqui, o termo hebraico traduzido como “descanso” se refere à segurança de uma vida estabelecida no lar de um marido.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Que ... conceda
  rationale: Expressa naturalmente em português o valor volitivo da bênção pronunciada por Noemi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּמְצֶאןָ
  choice: encontrar
  rationale: O verbo dá continuidade ao desejo introduzido por יִתֵּן; em português, a construção «conceda ... encontrar» preserva essa relação com naturalidade.
- source_word: מְנוּחָה
  choice: descanso
  rationale: Preserva o sentido básico do substantivo hebraico, enquanto a nota esclarece sua conotação contextual de segurança e vida estável.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: cada uma na casa de seu marido
  rationale: 'Torna explícito o valor distributivo da expressão: a bênção é dirigida individualmente às duas mulheres.'
- source_word: וַתִּשַּׁק לָהֶן
  choice: Então Noemi as beijou
  rationale: O nome de Noemi explicita o sujeito já indicado pelo contexto, evitando ambiguidade em português; «então» marca com naturalidade a progressão narrativa.
- source_word: וַתִּשֶּׂאנָה קוֹלָן
  choice: elas levantaram a voz
  rationale: Mantém o idiomatismo hebraico de lamento audível em uma formulação compreensível e corrente em português.
- source_word: וַתִּבְכֶּינָה
  choice: e choraram
  rationale: Tradução direta do verbo, adequada ao relato narrativo e ao lamento expresso pela frase anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome próprio sem substituí-lo por um título ou adotar outra forma tradicional de transliteração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o idiomatismo hebraico «levantaram a voz» e esclarece por nota o alcance contextual de «descanso».
