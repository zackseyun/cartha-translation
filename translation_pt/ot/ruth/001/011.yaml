  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: pt
  text: 'Mas Noemi disse: “Voltem, minhas filhas. Por que vocês iriam comigo? Será que ainda tenho filhos no ventre, para que eles venham a ser seus maridos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Mas Noemi disse
  rationale: O waw consecutivo dá sequência à narrativa, enquanto “mas” comunica naturalmente o contraste com a intenção declarada pelas noras no contexto anterior.
- source_word: שֹׁבְנָה
  choice: Voltem
  rationale: O imperativo plural feminino de שוב pede que as duas mulheres retornem; “voltem” é direto, idiomático e preserva o sentido direcional.
- source_word: בְנֹתַי
  choice: minhas filhas
  rationale: Mantém a expressão hebraica literal e o tom de afeto familiar com que Noemi se dirige às noras; em português, o contexto torna esse uso compreensível sem nota.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Por que vocês iriam comigo?
  rationale: A forma verbal imperfeita, nesta pergunta retórica, é bem expressa pelo futuro do pretérito, que comunica a objeção de Noemi sem convertê-la em simples pergunta sobre o futuro.
- source_word: הַעוֹד לִי
  choice: Será que ainda tenho
  rationale: A formulação expressa de modo natural a pergunta retórica sobre existência ou posse continuada, preservando “ainda”.
- source_word: בָנִים
  choice: filhos
  rationale: No contexto, o termo indica especificamente descendentes do sexo masculino, indispensáveis à lógica matrimonial da fala. Em português, “filhos” no plural tem esse valor masculino contextual.
- source_word: בְּמֵעַי
  choice: no ventre
  rationale: “Ventre” transmite o sentido reprodutivo de מֵעִים neste contexto e mantém um registro digno e natural.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: para que eles venham a ser seus maridos
  rationale: A construção descreve o resultado hipotético de Noemi ter filhos. “Venham a ser” preserva a projeção eventual, e “maridos” dá o sentido contextual de אֲנָשִׁים.
theological_decisions:
- issue: Possível pano de fundo do casamento levirato
  choice: Traduzir explicitamente “filhos” e “maridos”, sem acrescentar explicação jurídica ao versículo
  alternative: Explicitar no texto ou em nota uma referência ao casamento levirato
  rationale: A fala alude à possibilidade de filhos de Noemi se tornarem maridos das noras, mas o versículo não formula nem explica uma norma jurídica. A tradução preserva a lógica do texto sem importar uma interpretação mais específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “vocês” e as formas “voltem/iriam” deixam claro o plural feminino pelo contexto, enquanto “minhas filhas” conserva o afeto familiar do hebraico. Não são necessárias notas, pois não há marcador no texto e o sentido contextual é suficientemente claro.
