    rationale: וַתֹּאמַרְנָה é uma forma narrativa perfectiva (wayyiqtol) e significa «as mulheres disseram». Embora o conteúdo seja interrogativo, o imperfeito português sugere uma pergunta repetida, contínua ou de fundo, nuance que o hebraico não exprime.
