  source_fidelity: A tradução preserva adequadamente o percurso conjunto, a chegada a Belém, a comoção de toda a cidade e a identificação explícita das falantes como mulheres. Contudo, «perguntavam» introduz um valor imperfectivo/habitual que não corresponde à forma narrativa hebraica consecutiva, que relata uma fala ocorrida naquele momento.
  naturalness: O português é moderno, claro e natural. «As mulheres disseram» é igualmente fluente no contexto de uma pergunta introduzida por dois-pontos.
  terminology: «Belém», «Noemi», «toda a cidade» e «por causa delas» são escolhas apropriadas e fiéis. Não é necessária nota, pois «as mulheres» já torna explícito o feminino plural do hebraico.
