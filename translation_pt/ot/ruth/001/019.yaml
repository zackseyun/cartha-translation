base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: pt
  text: 'Assim, as duas seguiram viagem até chegarem a Belém. Quando chegaram a Belém, toda a cidade ficou agitada por causa delas, e as mulheres disseram: “Esta é Noemi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: as duas seguiram viagem
  rationale: A forma verbal feminina e a expressão que identifica o par são preservadas; “seguiram viagem” comunica naturalmente a continuação do percurso.
- source_word: עַד בֹּאנָה
  choice: até chegarem
  rationale: עַד com בוא marca o ponto final da viagem; a construção portuguesa é direta e idiomática.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: וַיְהִי כְּבֹאנָה
  choice: Quando chegaram
  rationale: A fórmula narrativa introduz a circunstância temporal; não é necessário reproduzir de modo rígido o elemento existencial de וַיְהִי.
- source_word: וַתֵּהֹם
  choice: ficou agitada
  rationale: O verbo המה indica comoção ou agitação coletiva, sem exigir a ideia mais forte de tumulto.
- source_word: כָּל הָעִיר
  choice: toda a cidade
  rationale: Preserva o sentido usual de עִיר e expressa a reação comunitária sem redefinir explicitamente o porte de Belém.
- source_word: עֲלֵיהֶן
  choice: por causa delas
  rationale: A preposição indica que a chegada das duas mulheres ocasionou a agitação.
- source_word: וַתֹּאמַרְנָה
  choice: as mulheres perguntavam
  rationale: A forma verbal é feminina plural, tornando apropriado explicitar que as falantes eram mulheres. O imperfeito português retrata a pergunta circulando entre elas, sem alterar seu conteúdo.
- source_word: הֲזֹאת נָעֳמִי
  choice: Esta é Noemi?
  rationale: Mantém a pergunta breve e a surpresa implícita, sem acrescentar intensificadores como “mesmo” ou “realmente”.
