revisions:
- from: Então ela se levantou com suas noras e partiu de volta dos campos de Moabe, pois, ainda em Moabe, ouvira que Yahweh havia visitado seu povo, dando-lhes alimento.[a]
  to: Então ela se levantou com suas noras e voltou dos campos de Moabe, pois ouvira, nos campos de Moabe, que Yahweh havia visitado seu povo para lhes dar alimento.[a]
  rationale: A revisão substitui uma formulação de movimento pouco idiomática por “voltou dos campos de Moabe”, que mantém o verbo hebraico de retorno e funciona naturalmente como início da viagem no fluxo narrativo. Também verte o infinitivo final por “para lhes dar”, preservando sua relação de finalidade. A repetição de “campos de Moabe” conserva a repetição deliberada de שָׂדֶה no hebraico.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:21:24Z'
