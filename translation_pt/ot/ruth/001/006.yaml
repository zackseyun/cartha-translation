  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: pt
  text: Então ela se levantou com suas noras e voltou dos campos de Moabe, pois ouvira, nos campos de Moabe, que Yahweh havia visitado seu povo para lhes dar alimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pão”. O termo hebraico também pode se referir ao alimento ou sustento em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Então ela se levantou
  rationale: O wayyiqtol de קום dá continuidade à sequência narrativa; “Então” explicita essa progressão, e “se levantou” conserva a ação concreta.
- source_word: וְכַלֹּתֶיהָ
  choice: com suas noras
  rationale: A conjunção introduz aqui as acompanhantes de Noemi; em português, “com” expressa isso de modo natural.
- source_word: וַתָּשָׁב
  choice: partiu de volta
  rationale: שׁוב significa voltar ou retornar. Como os versículos seguintes ainda narram o percurso, “partiu de volta” evita sugerir que a chegada já ocorreu.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: dos campos de Moabe
  rationale: O plural שׂדי pode designar os campos, a zona rural ou a região de Moabe. A tradução mantém a imagem concreta do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa da decisão de Noemi e liga naturalmente as orações em português.
- source_word: שָׁמְעָה
  choice: ouvira
  rationale: O mais-que-perfeito indica que a notícia antecedeu e motivou a partida.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: ainda em Moabe
  rationale: Embora שׂדה seja literalmente “campo”, aqui a expressão indica o local onde Noemi recebeu a notícia. A formulação evita o sentido indevido de que ela estava dentro de um campo específico, sem eliminar a primeira imagem dos “campos de Moabe”.
- source_word: פָּקַד
  choice: havia visitado
  rationale: פקד indica que Yahweh voltou sua atenção favorável ao povo e interveio em seu favor. “Visitado” preserva a formulação bíblica e sua amplitude sem especificar além do texto o modo da intervenção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Mantém o sentido coletivo e relacional de עם com o sufixo possessivo.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: dando-lhes alimento
  rationale: A construção infinitiva exprime a maneira ou finalidade da visita favorável. לֶחֶם significa literalmente “pão”, mas também pode designar alimento ou sustento em geral, sentido adequado ao fim da fome.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. “Yahweh” preserva esse nome sem substituí-lo pelo título “Senhor” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido da visita divina em פקד
  choice: havia visitado seu povo
  alternative: havia socorrido seu povo; havia cuidado de seu povo
  rationale: No contexto, a visita é favorável e resulta em provisão. “Visitado” conserva a expressão ampla do hebraico, enquanto o resultado — dar alimento — esclarece seu caráter benéfico sem transformar o verbo em uma interpretação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Partiu de volta” acompanha o desenvolvimento narrativo, no qual a viagem ainda está começando. O marcador da nota foi colocado após “alimento”, termo ao qual a alternativa lexical realmente se refere.
