  naturalness: O registro é moderno e compreensível. “Voltou dos campos de Moabe” é mais natural e direto do que “partiu de volta dos campos de Moabe”. “Nos campos de Moabe” conserva o local expresso pelo hebraico sem sugerir indevidamente um campo delimitado.
  terminology: “Noras”, “Yahweh”, “seu povo”, “visitado” e “alimento” são escolhas adequadas. A nota para “alimento” preserva corretamente a alternativa lexical literal “pão”.
