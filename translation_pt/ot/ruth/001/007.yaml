base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: pt
  text: Assim, ela saiu do lugar onde tinha estado[a], com suas duas noras, e as três seguiram pelo caminho para voltar à terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais dinâmica: “Assim, ela deixou o lugar onde tinha estado”. O verbo hebraico significa literalmente “saiu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Assim, ela saiu
  rationale: O consecutivo narrativo dá prosseguimento ao relato; “saiu” preserva o movimento concreto de יצא, enquanto “assim” expressa naturalmente a ligação com o versículo anterior.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: do lugar onde tinha estado
  rationale: Mantém “o lugar” e verte a oração relativa de modo natural em português; o mais-que-perfeito composto indica a permanência anterior à partida.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: acompanhada de suas duas noras
  rationale: כַּלָּה significa “nora” neste contexto. A formulação comunica idiomaticamente que as duas estavam com Noemi, sem alterar a relação familiar.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: e elas seguiram pelo caminho
  rationale: O verbo feminino plural inclui Noemi e as duas noras. “Seguiram pelo caminho” conserva tanto o deslocamento quanto a referência concreta ao caminho, em português natural.
- source_word: לָשׁוּב
  choice: para voltar
  rationale: Preserva o sentido recorrente e tematicamente importante de שׁוּב, “voltar/retornar”, sem acrescentar explicação.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: à terra de Judá
  rationale: Retém explicitamente אֶרֶץ, “terra”, e identifica o território de destino.
