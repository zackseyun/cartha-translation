  text: וַ/יִּשְׂא֣וּ לָ/הֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽ/אַחַת֙ עָרְפָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית ר֑וּת וַ/יֵּ֥שְׁבוּ שָׁ֖ם כְּ/עֶ֥שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: pt
  text: Eles tomaram para si mulheres moabitas como esposas. O nome de uma era Orfa[a], e o nome da outra era Rute. E moraram ali cerca de dez anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles se casaram com mulheres moabitas”. O hebraico diz literalmente: “tomaram para si mulheres moabitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: tomaram para si mulheres como esposas
  rationale: A expressão hebraica descreve o ato de tomar mulheres por esposas, isto é, casar-se. A formulação mantém a imagem do original e explicita naturalmente em português o sentido matrimonial.
- source_word: מֹאֲבִיּוֹת
  choice: moabitas
  rationale: Preserva a identificação étnica e geográfica das mulheres.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: O nome de uma era ... e o nome da outra era
  rationale: Reproduz o paralelismo da fórmula hebraica em português natural. Embora הַשֵּׁנִית signifique literalmente 'a segunda', 'a outra' expressa com clareza o contraste entre as duas mulheres.
- source_word: עָרְפָּה
  choice: Orfa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: רוּת
  choice: Rute
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: E moraram ali
  rationale: יָשַׁב, neste contexto de residência prolongada, significa morar ou viver em determinado lugar.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: cerca de dez anos
  rationale: O prefixo כְּ indica aproximação; 'cerca de' comunica isso com precisão e naturalidade.
