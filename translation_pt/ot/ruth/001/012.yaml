base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: pt
  text: 'Voltem, minhas filhas; vão, pois estou velha demais para ter marido[a]. Mesmo que eu dissesse[b]: “Ainda tenho esperança” — mesmo que eu tivesse marido esta noite e até desse à luz filhos —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para me casar”. O hebraico diz literalmente algo como “para ser de/para um homem”; no contexto, “homem” significa “marido”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico apresenta uma cadeia hipotética: “Pois, se eu dissesse: ‘Tenho esperança’, mesmo que eu tivesse marido esta noite e também desse à luz filhos —”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Voltem
  rationale: Imperativo feminino plural de שׁוב; no contexto, Noemi manda Rute e Orfa retornarem, em vez de continuarem a acompanhá-la.
- source_word: בְנֹתַי
  choice: minhas filhas
  rationale: Mantém o termo familiar e afetuoso com que Noemi se dirige às noras, sem perder o tom digno.
- source_word: לֵכְנָה
  choice: vão
  rationale: Segundo imperativo feminino plural, simples e natural em português, indicando que elas devem seguir seu próprio caminho.
- source_word: זָקַנְתִּי
  choice: estou velha demais
  rationale: 'Expressa o estado presente resultante do envelhecimento e explicita a consequência contextual: Noemi se considera velha demais para um novo casamento.'
- source_word: מִהְיוֹת לְאִישׁ
  choice: para ter marido
  rationale: O hebraico diz literalmente algo como 'para ser de/para um homem'; no contexto, אִישׁ significa marido. A formulação escolhida comunica o sentido com naturalidade, enquanto a nota registra a forma do idioma hebraico.
- source_word: כִּי אָמַרְתִּי
  choice: Mesmo que eu dissesse
  rationale: Introduz a cadeia hipotética de possibilidades improváveis formulada por Noemi; o imperfeito do subjuntivo é natural em português.
- source_word: יֶשׁ לִי תִקְוָה
  choice: Ainda tenho esperança
  rationale: Transmite naturalmente a construção existencial hebraica, preservando a força retórica de uma esperança que, hipoteticamente, ainda restaria.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: mesmo que eu tivesse marido esta noite
  rationale: Preserva a hipótese de uma união conjugal imediata e a ênfase temporal de 'esta noite', sem exigir no texto principal uma formulação hebraizante.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: e até desse à luz filhos
  rationale: Mantém o sentido concreto de dar à luz e conserva a referência masculina de בָנִים, importante para o argumento do contexto.
theological_decisions:
- issue: Manutenção da referência masculina à descendência no contexto da continuidade familiar
  choice: filhos
  alternative: crianças
  rationale: O hebraico traz explicitamente בָנִים, 'filhos', e o raciocínio de Noemi depende da possibilidade de descendentes homens que pudessem tornar-se maridos de Rute e Orfa. A referência não deve ser neutralizada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “vocês” de modo implícito nas formas verbais “voltem” e “vão”. O travessão final preserva a frase inacabada, que continua no versículo seguinte.
