  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: pt
  text: Eu parti cheia, mas Yahweh me trouxe de volta vazia. Por que vocês me chamam de Noemi, se Yahweh testemunhou contra mim[a] e o Todo-Poderoso trouxe calamidade sobre mim[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deu testemunho contra mim”. O verbo hebraico também pode ter o sentido de responder contra alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “me fez mal”. A expressão hebraica indica que adversidade ou calamidade foi trazida sobre Noemi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: cheia
  rationale: Adjetivo predicativo que descreve a condição anterior de Noemi e preserva o contraste direto com “vazia”.
- source_word: הָלַכְתִּי
  choice: parti
  rationale: Expressa de modo natural e conciso a ideia contextual de ir embora, sem acrescentar detalhes ausentes no hebraico.
- source_word: וְרֵיקָם
  choice: vazia
  rationale: Preserva a antítese enfática com “cheia”; “de mãos vazias” seria possível, mas restringiria a imagem de maneira mais interpretativa.
- source_word: הֱשִׁיבַנִי
  choice: me trouxe de volta
  rationale: Reproduz o sentido causativo do hifil de שוב e mantém explícita a ação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Por que vocês me chamam Noemi
  rationale: Pergunta retórica dirigida às mulheres de Belém; o plural “vocês” torna o destinatário claro em português corrente.
- source_word: נָעֳמִי
  choice: Noemi
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português, sem inserir seu significado no texto principal.
- source_word: עָנָה בִי
  choice: testemunhou contra mim
  rationale: Preserva o possível sentido forense da construção e evita fundi-la semanticamente com a oração seguinte sobre a desgraça.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino por sua forma portuguesa convencional e inteligível.
- source_word: הֵרַע לִי
  choice: trouxe desgraça sobre mim
  rationale: Comunica a ideia de causar adversidade ou calamidade sem sugerir que Deus tenha praticado mal moral.
theological_decisions:
- issue: Atribuição da adversidade de Noemi à ação de Deus
  choice: Manter a forte agência divina em “Yahweh testemunhou contra mim” e “o Todo-Poderoso trouxe desgraça sobre mim”.
  alternative: Suavizar para “permitiu que a desgraça viesse sobre mim” ou interpretar עָנָה como “afligiu-me”.
  rationale: A fala de Noemi atribui diretamente sua amarga situação a Yahweh e a Shaddai. A tradução conserva essa tensão teológica, sem transformar הֵרַע em linguagem que impute maldade moral a Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” reproduz naturalmente o plural feminino do verbo hebraico. A construção mantém o contraste incisivo entre “cheia” e “vazia” e conserva a linguagem forte da queixa de Noemi.
