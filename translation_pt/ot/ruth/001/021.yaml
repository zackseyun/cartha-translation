  terminology: «Yahweh», «Noemi» e «o Todo-Poderoso» são escolhas consistentes e adequadas. As notas permanecem ancoradas nos termos a que se referem, diferentemente do posicionamento inconsistente das notas no texto inglês de auditoria.
