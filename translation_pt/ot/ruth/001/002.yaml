reference: Ruth 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שֵׁ֣ם הָ/אִ֣ישׁ אֱֽלִימֶ֡לֶךְ וְ/שֵׁם֩ אִשְׁתּ֨/וֹ נָעֳמִ֜י וְ/שֵׁ֥ם שְׁנֵֽי בָנָ֣י/ו מַחְל֤וֹן וְ/כִלְיוֹן֙ אֶפְרָתִ֔ים מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/יָּבֹ֥אוּ שְׂדֵי מוֹאָ֖ב וַ/יִּֽהְיוּ שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: pt
  text: O nome do homem era Elimeleque, o de sua mulher era Noemi, e os de seus dois filhos eram Malom e Quiliom. Eles eram efrateus de Belém de Judá. Chegaram aos campos de Moabe[a] e ficaram ali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à região de Moabe” ou “ao território de Moabe”; em hebraico, literalmente, “aos campos de Moabe”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e permaneceram ali”; em hebraico, literalmente, “e estiveram ali”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: O nome do homem era
  rationale: Preserva a fórmula hebraica de nomeação em português natural, mantendo a referência definida ao homem já apresentado no versículo anterior.
- source_word: אֱלִימֶלֶךְ
  choice: Elimeleque
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: אִשְׁתּוֹ נָעֳמִי
  choice: o de sua mulher era Noemi
  rationale: A elipse de 'nome' evita repetição pesada sem perder a estrutura coordenada do hebraico; 'mulher' exprime aqui claramente o sentido de esposa.
- source_word: שְׁנֵי בָנָיו מַחְלוֹן וְכִלְיוֹן
  choice: seus dois filhos eram Malom e Quiliom
  rationale: Emprega ordem natural em português e as formas tradicionais portuguesas dos nomes próprios.
- source_word: אֶפְרָתִים
  choice: efrateus
  rationale: Gentílico ligado a Efrata/Efratá e, no contexto, a Belém; evita a identificação incorreta com os efraimitas.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Forma idiomática e tradicional em português que distingue esta Belém por sua localização em Judá.
- source_word: וַיָּבֹאוּ
  choice: Chegaram
  rationale: O verbo בוא descreve a chegada ao destino; 'chegaram' transmite com clareza o movimento narrativo sem depender da perspectiva dêitica de 'vieram'.
- source_word: שְׂדֵי מוֹאָב
  choice: aos campos de Moabe
  rationale: Mantém a imagem concreta do plural hebraico, embora a expressão possa designar de modo mais amplo a região ou o território de Moabe.
- source_word: וַיִּהְיוּ שָׁם
  choice: e ficaram ali
  rationale: Expressa em português natural a permanência indicada no contexto, enquanto a nota registra a formulação hebraica mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas onomásticas correntes no Brasil e inteligíveis internacionalmente. A coordenação do hebraico foi preservada, mas com elipses naturais para evitar repetição excessiva. As ambiguidades de שְׂדֵי מוֹאָב e וַיִּהְיוּ שָׁם foram mantidas por meio de notas.
