  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: pt
  text: 'Então ela disse: “Veja, sua cunhada voltou para o povo dela e para os deuses dela. Volte seguindo sua cunhada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ela disse
  rationale: O wayyiqtol narrativo introduz a fala de Noemi. “Então ela disse” mantém a progressão narrativa de modo natural em português.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção de Rute para o que ocorreu. “Veja” é atual e preserva sua força dêitica sem o tom arcaico de “eis”.
- source_word: שָׁבָה
  choice: voltou
  rationale: O qal perfeito de שוב apresenta o retorno de Orfa como realizado. “Voltou” é conciso e permite repetir o mesmo verbo na ordem dada a Rute.
- source_word: יְבִמְתֵּךְ
  choice: sua cunhada
  rationale: Neste contexto, o termo designa a mulher ligada pelo casamento à mesma família. “Cunhada” é o equivalente idiomático e compreensível em português, repetido nas duas ocorrências.
- source_word: אֶל עַמָּהּ
  choice: para o povo dela
  rationale: עַם indica aqui o povo ou a comunidade étnica de Orfa, não apenas seus parentes imediatos. A formulação também evita a possível leitura de que “seu povo” se refira ao interlocutor.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: e para os deuses dela
  rationale: No contexto moabita, o plural morfológico é mais provavelmente referência às divindades de Moabe. A formulação preserva esse sentido sem associá-las ao Deus de Israel.
- source_word: שׁוּבִי
  choice: Volte
  rationale: O imperativo feminino singular de שוב dirige-se a Rute. “Volte” retoma lexicalmente o “voltou” anterior e conserva a repetição intencional do hebraico.
- source_word: אַחֲרֵי
  choice: seguindo
  rationale: A preposição expressa ir após alguém. “Seguindo sua cunhada” comunica naturalmente em português que Rute deve tomar o mesmo caminho de Orfa.
theological_decisions:
- issue: Sentido de אֱלֹהֶיהָ em referência ao culto moabita
  choice: os deuses dela
  alternative: o deus dela
  rationale: Embora אֱלֹהִים possa ter sentido singular em certos contextos, aqui a referência à identidade religiosa moabita favorece o plural. A tradução mantém a distinção entre o culto de Moabe e o Deus de Israel sem acrescentar explicação doutrinária ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de שוב foi preservada por “voltou/Volte”. “O povo dela/os deuses dela” foi preferido a “seu povo/seus deuses” para evitar ambiguidade pronominal em português.
