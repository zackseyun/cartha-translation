base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: pt
  text: 'Mas elas lhe disseram: “Não! Voltaremos com você para o seu povo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois com você voltaremos para o seu povo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Mas elas lhe disseram
  rationale: O waw consecutivo faz a narrativa avançar; “mas” expressa naturalmente o contraste com a insistência anterior de Noemi, enquanto o verbo no feminino plural se refere às duas noras.
- source_word: כִּי
  choice: Não!
  rationale: Neste contexto de resposta direta, כִּי introduz uma contradição enfática à orientação de Noemi. “Não!” comunica essa recusa com naturalidade; a construção mais literal é preservada na nota.
- source_word: אִתָּךְ
  choice: com você
  rationale: A preposição com sufixo feminino singular indica acompanhamento com Noemi; “com você” é claro e natural em português amplamente compreensível.
- source_word: נָשׁוּב
  choice: voltaremos
  rationale: שׁוּב significa voltar ou retornar. “Voltaremos” preserva o motivo recorrente de voltar em Rute 1 e soa natural neste contexto.
- source_word: לְעַמֵּךְ
  choice: para o seu povo
  rationale: עַם designa aqui o povo ou a comunidade étnica de Noemi, não apenas seus parentes próximos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla clareza no Brasil. O feminino plural de “elas” permanece explícito, e a fala enfática conserva a tensão entre o valor assertivo/contextual de כִּי e sua força conectiva mais literal.
