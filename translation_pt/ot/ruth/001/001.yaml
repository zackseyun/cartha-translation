  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: pt
  text: Aconteceu, nos dias em que os juízes julgavam[a], que houve fome na terra. E um homem partiu de Belém de Judá para morar por algum tempo[b] nos campos de Moabe[c] — ele, sua mulher e seus dois filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nos dias em que os juízes governavam». O hebraico repete a mesma raiz: literalmente, «quando os juízes julgavam».'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico indica morar como forasteiro, em geral por tempo limitado, e não necessariamente estabelecer-se em definitivo.
    reason: cultural_note
  - marker: c
    text: 'Ou: «no território de Moabe» ou «na região de Moabe». Literalmente, «nos campos de Moabe».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu / houve
  rationale: A primeira ocorrência introduz a narrativa; a segunda apresenta a fome. A formulação evita o arcaísmo «sucedeu que» e representa as duas ocorrências de היה de modo natural em português.
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: nos dias em que os juízes julgavam
  rationale: Preserva a expressão temporal e a repetição da raiz hebraica שׁפט, sem restringir antecipadamente sua amplitude semântica a «governar».
- source_word: רָעָב בָּאָרֶץ
  choice: fome na terra
  rationale: «Fome» designa naturalmente uma grave escassez regional de alimentos; «a terra» mantém a expressão narrativa hebraica sem especificar além do texto.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: de Belém de Judá
  rationale: Mantém a designação geográfica que distingue esta Belém de outras localidades homônimas.
- source_word: לָגוּר
  choice: morar por algum tempo
  rationale: Expressa em português corrente a residência temporária indicada por גור; a condição de residente forasteiro é registrada em nota.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: nos campos de Moabe
  rationale: Conserva a imagem concreta do plural שְׂדֵי, embora a expressão também possa designar de modo mais amplo o território de Moabe.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: ele, sua mulher e seus dois filhos
  rationale: Reproduz a enumeração simples e explícita dos familiares que o acompanharam.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição «juízes julgavam» foi mantida por refletir deliberadamente o hebraico; «morar por algum tempo» evita o pouco corrente «peregrinar» ou «sojornar». O travessão conserva a enumeração enfática final sem produzir uma frase excessivamente rígida.
