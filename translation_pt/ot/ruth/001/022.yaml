  source_fidelity: A tradução preserva os principais elementos do hebraico, incluindo a designação de Rute como moabita, a relação de nora, a proveniência de Moabe e a referência ao início da colheita da cevada. Contudo, «com ela veio Rute» introduz um verbo de movimento adicional na primeira oração onde o hebraico apresenta Rute como acompanhante de Noemi; isso torna menos nítida a repetição intencional de «voltar» ligada a Rute.
