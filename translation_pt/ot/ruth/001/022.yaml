  terminology: «Noemi», «Rute», «a moabita», «nora», «Belém» e «colheita da cevada» são escolhas corretas, tradicionais e compreensíveis em português moderno. A nota sobre «campos de Moabe» conserva devidamente a alternativa idiomática sem substituir a formulação literal no texto.
