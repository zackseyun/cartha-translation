translation_notes:
  register: Português moderno, digno e acessível, com preferência por equivalência ótima. A repetição de “voltou” preserva o elo lexical do hebraico, enquanto “veio” foi acrescentado na primeira oração para produzir uma coordenação compreensível em português sem alterar a relação de acompanhamento.
