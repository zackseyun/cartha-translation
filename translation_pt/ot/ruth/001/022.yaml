base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: pt
  text: Assim, Noemi voltou, e Rute, a moabita, sua nora, voltou com ela dos campos de Moabe.[a] E elas chegaram a Belém no início da colheita da cevada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “da região de Moabe”. O hebraico diz literalmente “dos campos de Moabe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: voltou
  rationale: Expressa diretamente o sentido de שׁוב e mantém a ligação narrativa com a segunda ocorrência do verbo no versículo.
- source_word: הַמּוֹאֲבִיָּה
  choice: a moabita
  rationale: Preserva a designação étnica feminina, destacada no relato, em forma natural em português.
- source_word: כַלָּתָהּ
  choice: sua nora
  rationale: Equivalente direto e corrente do termo hebraico de parentesco.
- source_word: עִמָּהּ
  choice: com ela
  rationale: Mantém explicitamente a ideia de que Rute acompanhava Noemi.
- source_word: הַשָּׁבָה
  choice: que voltou
  rationale: Reproduz o particípio feminino singular, cujo referente mais natural é Rute, sem eliminar a repetição marcada de שׁוב.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: dos campos de Moabe
  rationale: Conserva a imagem literal do plural de שׂדה; uma nota registra o sentido regional também possível.
- source_word: וְהֵמָּה בָּאוּ
  choice: E elas chegaram
  rationale: O pronome feminino explicita as duas mulheres; 'chegaram' comunica com naturalidade o movimento até o destino, embora o verbo hebraico seja literalmente 'vieram'.
- source_word: בֵּית לֶחֶם
  choice: Belém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: בִּתְחִלַּת
  choice: no início da
  rationale: Expressão temporal clara e natural para o substantivo construto hebraico.
- source_word: קְצִיר שְׂעֹרִים
  choice: colheita da cevada
  rationale: Traduz naturalmente a cadeia construta como a colheita sazonal de cevada.
