  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: pt
  text: Então elas levantaram a voz e choraram novamente. Orfa beijou sua sogra, mas[a] Rute se apegou a ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Rute se apegou a ela”. A conjunção hebraica pode ser traduzida simplesmente por “e”, mas o contexto sugere um contraste entre o beijo de Orfa e o apego contínuo de Rute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: levantaram a voz
  rationale: Reproduz de modo natural o idioma hebraico de erguer a voz, indicando lamentação audível sem explicitação excessiva.
- source_word: וַתִּבְכֶּינָה
  choice: choraram
  rationale: Verte diretamente o ato de chorar e mantém um tom narrativo corrente e digno.
- source_word: עוֹד
  choice: novamente
  rationale: No contexto, indica repetição do choro já mencionado anteriormente.
- source_word: וַתִּשַּׁק
  choice: beijou
  rationale: Tradução direta e natural do verbo hebraico.
- source_word: לַחֲמוֹתָהּ
  choice: sua sogra
  rationale: O substantivo designa especificamente a sogra, e o sufixo feminino singular se refere a Orfa.
- source_word: דָּבְקָה בָּהּ
  choice: se apegou a ela
  rationale: Expressa ligação firme e contínua, preservando a força relacional do verbo דבק sem impor conotação teológica adicional.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção normalmente signifique “e”, o contexto cria contraste entre o beijo de Orfa e a permanência de Rute; a nota preserva a alternativa formal.
- source_word: עָרְפָּה
  choice: Orfa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: רוּת
  choice: Rute
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
