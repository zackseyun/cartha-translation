base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: pt
  text: Então Elimeleque, marido de Noemi, morreu, e ela ficou com seus dois filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E Elimeleque, marido de Noemi, morreu; e ela permaneceu, ela e seus dois filhos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol dá prosseguimento à narrativa; “então” expressa naturalmente a sequência em português sem reproduzir de modo rígido a conjunção hebraica.
- source_word: אֱלִימֶלֶךְ
  choice: Elimeleque
  rationale: O nome próprio é transliterado segundo a forma tradicional e inteligível em português.
- source_word: אִישׁ נָעֳמִי
  choice: marido de Noemi
  rationale: Neste contexto, אִישׁ em relação a uma mulher designa seu marido; a expressão portuguesa explicita com naturalidade a relação conjugal indicada pelo hebraico.
- source_word: וַתִּשָּׁאֵר
  choice: ela ficou
  rationale: O verbo שׁאר descreve quem permanece depois de uma perda. “Ficou” é corrente em português e preserva esse sentido resultante sem acrescentar “sozinha”, o que seria inadequado porque os filhos também permaneceram.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: ela ficou com seus dois filhos
  rationale: A formulação idiomática comunica que Noemi e os dois filhos permaneceram após a morte de Elimeleque. A nota registra a coordenação mais formal do hebraico, “ela e seus dois filhos”.
