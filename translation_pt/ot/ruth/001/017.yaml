  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: pt
  text: Onde você morrer, eu morrerei, e ali serei sepultada. Que Yahweh faça assim comigo e ainda mais[a], se alguma coisa além da morte separar você de mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Assim faça Yahweh comigo, e assim acrescente [mais]”. Trata-se de uma fórmula hebraica de juramento que invoca sobre quem a pronuncia uma consequência não especificada, caso não cumpra o que prometeu.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pois/se a morte separar entre mim e você”. No contexto do juramento, a expressão significa que somente a morte poderia separá-las.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Onde
  rationale: A preposição בְּ unida ao relativo אֲשֶׁר introduz o lugar. “Onde” expressa isso com naturalidade e sem perder o vínculo com a oração seguinte.
- source_word: תָּמוּתִי אָמוּת
  choice: você morrer, eu morrerei
  rationale: A repetição do verbo מות forma um paralelismo solene. O futuro em português comunica o compromisso assumido por Rute.
- source_word: וְשָׁם אֶקָּבֵר
  choice: e ali serei sepultada
  rationale: שָׁם retoma o lugar mencionado, e o nifal de קבר pede sentido passivo. A forma feminina é exigida pela identidade da falante em português.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Que Yahweh me castigue, e ainda mais
  rationale: Trata-se de uma fórmula de juramento que invoca juízo divino sobre quem a pronuncia. “Castigue” explicita de modo idiomático a ameaça deixada indeterminada por “faça assim”, enquanto a nota preserva a forma hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: se
  rationale: Depois da fórmula de juramento, כִּי introduz a condição sob a qual a maldição seria aplicada.
- source_word: הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: alguma coisa além da morte separar você de mim
  rationale: No contexto do juramento, a expressão comunica que somente a morte pode romper o vínculo. A formulação portuguesa torna explícita essa força idiomática; a nota registra a redação mais estritamente literal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse caráter sem substituí-lo por um título.
- issue: Alcance da condição final do juramento
  choice: se alguma coisa além da morte separar você de mim
  alternative: se a morte separar você de mim
  rationale: A leitura principal entende a morte como a única separação permitida, conforme a força idiomática do juramento. Como a formulação hebraica é mais compacta e pode ser vertida literalmente de outra maneira, essa alternativa é mantida em nota.
- issue: Explicitação do juízo na fórmula de autoimprecação
  choice: Que Yahweh me castigue, e ainda mais
  alternative: Assim me faça Yahweh e assim acrescente
  rationale: O hebraico evita nomear o castigo, mas a fórmula invoca juízo contra a própria falante caso ela quebre o voto. A tradução comunica a função da expressão sem especificar a natureza do castigo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais ao público brasileiro. O paralelismo solene do voto foi preservado; a antiga fórmula de juramento foi tornada compreensível no texto e documentada literalmente em nota.
