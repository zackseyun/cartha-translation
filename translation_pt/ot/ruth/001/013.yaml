  naturalness: A retirada de “Acaso” torna as perguntas mais naturais no português contemporâneo, sem perder seu caráter retórico. “Deixariam de se casar” comunica mais diretamente a ideia contextual de adiar ou abster-se do casamento. “Pois para mim é muito mais amargo” evita o pronome “isso”, cujo referente fica pouco definido.
  terminology: “Yahweh” preserva de modo consistente a opção do projeto para o Tetragrama. “Minhas filhas” mantém o tom afetivo e social da fala. A imagem de a mão de Yahweh “sair contra” Noemi é incomum, mas é aceitável em registro bíblico e conserva a metáfora verbal hebraica.
