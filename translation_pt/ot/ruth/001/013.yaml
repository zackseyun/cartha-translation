base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: pt
  text: Vocês esperariam por eles até que crescessem? Deixariam de se casar por causa deles?[a] Não, minhas filhas, pois para mim é muito mais amargo do que para vocês,[b] porque a mão de Yahweh saiu contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficariam sem marido por causa deles?”. O verbo hebraico é raro e provavelmente se refere a permanecer sem se casar enquanto esperavam por futuros maridos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, possivelmente: “pois para mim é muito amargo por causa de vocês”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: esperariam
  rationale: O verbo שׂבר expressa aqui esperar ou aguardar com expectativa. No contexto dos filhos hipotéticos de Noemi, “esperariam” comunica com clareza a ideia prática de aguardar que eles crescessem.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: até que crescessem
  rationale: Refere-se aos filhos hipotéticos chegando à maturidade. O subjuntivo preserva adequadamente o caráter irreal da situação.
- source_word: תֵּעָגֵנָה ... לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: ficariam sem se casar
  rationale: O verbo raro עגן, esclarecido pela expressão “não ser para um homem”, provavelmente indica abster-se de casamento. A formulação escolhida é natural em português e explicita o sentido matrimonial sem introduzir uma ideia moderna de propriedade pessoal.
- source_word: אַל־בְּנֹתַי
  choice: Não, minhas filhas
  rationale: Neste contexto emocional, אַל funciona como recusa enfática à possibilidade apresentada, não apenas como uma proibição isolada.
- source_word: כִּי מַר־לִי מְאֹד מִכֶּם
  choice: pois isso é muito mais amargo para mim do que para vocês
  rationale: A tradução principal entende מִכֶּם em sentido comparativo e conserva a metáfora da amargura. Uma possível leitura alternativa é registrada em nota.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: a mão de Yahweh saiu contra mim
  rationale: Mantém a imagem hebraica da mão divina que “sai” contra alguém, bem como a afirmação de Noemi de que sua aflição procede da ação adversa de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Atribuição da aflição de Noemi à ação divina
  choice: porque a mão de Yahweh saiu contra mim
  alternative: porque a mão de Yahweh se voltou contra mim
  rationale: O hebraico atribui explicitamente a aflição à mão de Yahweh. A tradução conserva essa tensão teológica e a imagem verbal de יצא, sem suavizar a declaração nem explicar se ela representa uma avaliação objetiva ou a percepção de Noemi.
- issue: Sentido da comparação na amargura de Noemi
  choice: muito mais amargo para mim do que para vocês
  alternative: muito amargo para mim por causa de vocês
  rationale: A preposição מן pode ser comparativa, leitura que se ajusta bem ao contexto; contudo, também se propõe um sentido causal ou relacional. A alternativa é preservada em nota para não eliminar a ambiguidade possível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” preserva o caráter retórico das duas perguntas; “vocês” torna explícito o plural feminino sem recorrer a formas regionais ou arcaizantes. A construção mais literal “pertencer a um homem” foi evitada no texto principal por soar como posse em português contemporâneo, embora o sentido matrimonial do idioma hebraico tenha sido preservado.
