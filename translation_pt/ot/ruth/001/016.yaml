base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: pt
  text: 'Rute, porém, disse: “Não insista comigo[a] para que eu a deixe e volte, deixando de segui-la[b]. Pois aonde você for, eu irei; e onde você passar a noite, eu passarei a noite[c]. O seu povo será o meu povo, e o seu Deus será o meu Deus[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me pressione”, “não me peça com insistência” ou “não tente me convencer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “voltar de trás de você”, expressão que, neste contexto, significa deixar de seguir Noemi.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “onde você pernoitar, eu pernoitarei”.'
    reason: lexical_alternative
  - marker: d
    text: No hebraico, as frases “o seu povo, o meu povo” e “o seu Deus, o meu Deus” não têm verbo expresso. Conforme o contexto, podem ser entendidas com sentido presente (“é”) ou futuro (“será”).
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: insista comigo
  rationale: A construção פגע com ב pode expressar insistência ou pressão verbal. “Insista comigo” comunica naturalmente o pedido de Rute para que Noemi pare de tentar convencê-la, sem sugerir contato físico ou hostilidade.
- source_word: לְעָזְבֵךְ
  choice: para que eu a deixe
  rationale: עזב significa deixar, abandonar ou desamparar. “Deixe” é claro e natural no contexto, sem acrescentar a carga mais intensa de “abandone”.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: volte, deixando de segui-la
  rationale: שׁוב indica voltar, e מֵאַחֲרָיִךְ significa literalmente “de trás de você”, formando aqui a ideia de deixar de seguir alguém. A tradução conserva tanto o retorno quanto o vínculo com o ato de seguir Noemi.
- source_word: כִּי
  choice: Pois
  rationale: כִּי introduz a razão pela qual Rute pede que Noemi não insista. “Pois” mantém essa relação lógica e o tom solene da fala.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: aonde você for, eu irei
  rationale: A construção expressa destino. “Aonde” é apropriado com o verbo de movimento e preserva o paralelismo da declaração.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: onde você passar a noite, eu passarei a noite
  rationale: לון se refere normalmente a passar a noite ou pernoitar. A formulação é clara para leitores modernos e mantém a repetição enfática do hebraico.
- source_word: עַמֵּךְ עַמִּי
  choice: O seu povo será o meu povo
  rationale: A oração hebraica não contém verbo expresso. O futuro comunica naturalmente, neste contexto, o compromisso que Rute assume, sem excluir a possibilidade de se entender a identificação como já vigente.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: e o seu Deus será o meu Deus
  rationale: A oração também não contém verbo expresso. O futuro mantém o paralelismo em português e apresenta com clareza a adesão de Rute ao Deus de Noemi.
theological_decisions:
- issue: Valor temporal das duas orações nominais finais
  choice: 'Empregar o futuro nas duas: “será o meu povo” e “será o meu Deus”'
  alternative: Traduzir ambas no presente (“é o meu povo”, “é o meu Deus”) ou conservar uma formulação nominal elíptica
  rationale: O hebraico não traz cópula nem marca explicitamente presente ou futuro. No contexto da decisão solene de Rute, o futuro é natural em português e mantém o paralelismo, enquanto a nota registra a ambiguidade gramatical genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O tratamento por “você” evita arcaísmo; os pronomes oblíquos femininos deixam claro que Rute se dirige a Noemi. A repetição em “passar a noite” e o paralelismo das declarações finais refletem a forma enfática e poética do hebraico.
