  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: pt
  text: Depois, os dois também morreram, Malom e Quiliom, e a mulher ficou sem seus dois filhos[a] e sem seu marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem seus dois filhos, ambos homens”. O hebraico usa um termo que pode se referir aos descendentes de modo mais geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Depois, ... morreram
  rationale: O wayyiqtol de מוּת faz a narrativa avançar. “Depois” expressa com naturalidade a sequência narrativa em português.
- source_word: גַם שְׁנֵיהֶם
  choice: os dois também
  rationale: גַם liga essas mortes à perda anterior, e שְׁנֵיהֶם destaca que ambos morreram.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Malom e Quiliom
  rationale: Transliteração corrente e reconhecível dos nomes hebraicos em português.
- source_word: וַתִּשָּׁאֵר
  choice: ficou
  rationale: No contexto de luto, שׁאר com a preposição מִן descreve a mulher que sobreviveu privada de seus familiares; “ficou sem” comunica o sentido de forma natural.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém a designação explícita do narrador, sem substituí-la pelo nome Noemi nem especificá-la como “esposa”.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: sem seus dois filhos
  rationale: A preposição indica separação ou privação. יְלָדִים pode designar filhos ou descendentes em geral; “filhos” é natural em português e preserva a perspectiva materna sem impor aqui o sexo lexicalmente.
- source_word: וּמֵאִישָׁהּ
  choice: e sem seu marido
  rationale: אִישׁ com o sufixo possessivo tem aqui o sentido relacional de “marido”; a repetição de מִן prolonga a ideia de privação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura fluente, com ordem narrativa natural. A repetição de “sem” conserva a dupla perda enfatizada pelo hebraico.
