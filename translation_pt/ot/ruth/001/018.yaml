  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: pt
  text: Quando Noemi viu que Rute estava decidida a ir com ela, parou de falar com ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou de falar-lhe”.'
