lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando Noemi viu
  rationale: A construção narrativa introduz a percepção que levou Noemi a mudar de atitude. Os nomes, implícitos nos pronomes hebraicos, são explicitados para evitar ambiguidade em português.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo percebido por Noemi: Rute estava decidida.'
- source_word: מִתְאַמֶּצֶת
  choice: estava decidida
  rationale: O hitpael de אמץ expressa fortalecer-se ou mostrar firme resolução; esta formulação é natural e preserva a determinação de Rute.
- source_word: לָלֶכֶת אִתָּהּ
  choice: a ir com ela
  rationale: הלך indica ir ou viajar neste contexto, e אִתָּהּ expressa acompanhamento.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  choice: não insistiu mais
  rationale: Literalmente, Noemi 'parou de falar a ela'. No contexto imediato, trata-se de cessar sua tentativa verbal de fazê-la voltar, não de interromper toda conversa; a formulação comunica esse sentido contextual sem acrescentar o objeto específico da insistência.
