  text: וְ/אֵ֨לֶּה֙ תּוֹלְד֣וֹת פָּ֔רֶץ פֶּ֖רֶץ הוֹלִ֥יד אֶת חֶצְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/018.yaml
  text: 'These are the generations of Perez: Perez fathered Hezron[a].'
translation:
  language: pt
  text: 'Esta é a genealogia de Perez: Perez gerou Hezrom.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estas são as gerações de Perez”, “Estes são os descendentes de Perez” ou “Esta é a linhagem de Perez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A combinação da conjunção com o demonstrativo introduz a seção genealógica. Em português, a abertura direta é natural; o contexto já comunica a transição, sem necessidade de acrescentar um advérbio temporal.
- source_word: תּוֹלְדוֹת
  choice: os descendentes
  rationale: Neste contexto, o termo introduz a linhagem genealógica que segue. “Descendentes” comunica com clareza o referente, enquanto a nota preserva as alternativas mais formais ou estruturais.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Transliteração corrente do nome hebraico, em conformidade com o uso bíblico moderno em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד, em genealogias, indica que alguém se tornou pai ou antepassado de outro. “Gerou” é conciso, digno e consagrado no registro genealógico português, sem o arcaísmo de “engendrou”.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: A partícula hebraica marca o objeto direto definido e não possui equivalente lexical necessário em português.
- source_word: חֶצְרוֹן
  choice: Hezrom
  rationale: Forma portuguesa corrente do nome hebraico חֶצְרוֹן.
