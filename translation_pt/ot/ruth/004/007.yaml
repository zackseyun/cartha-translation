base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: pt
  text: 'Este era, antigamente, o costume em Israel quanto ao resgate e à troca: para confirmar qualquer assunto[a], um homem tirava a sandália e a entregava ao outro[b]. Essa era a confirmação[c] em Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “qualquer acordo”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao seu próximo” ou “ao seu companheiro”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o testemunho” ou “a atestação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: antigamente
  rationale: Expressa de modo claro e atual a referência a um costume de tempos anteriores, sem introduzir um marcador temporal inexistente como “agora”.
- source_word: הַגְּאוּלָּה
  choice: resgate
  rationale: No contexto jurídico-familiar de Rute 4, designa o ato ou direito de recuperar propriedade mediante resgate; “resgate” mantém a terminologia ampla e reconhecível.
- source_word: הַתְּמוּרָה
  choice: troca
  rationale: Preserva o sentido básico de troca, substituição ou transferência sem definir de maneira excessivamente específica o mecanismo jurídico.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: para confirmar qualquer assunto
  rationale: Mantém a amplitude de כָּל דָּבָר e o sentido de estabelecer ou validar; a nota registra a leitura juridicamente mais específica.
- source_word: שָׁלַף ... נַעֲלוֹ
  choice: tirava a sandália
  rationale: É a formulação concreta e idiomática em português para o ato de remover a sandália.
- source_word: לְרֵעֵהוּ
  choice: ao outro
  rationale: No contexto, refere-se naturalmente à outra parte do acordo. Evita que “próximo” seja entendido apenas no sentido de vizinho, sem ocultar em nota a forma mais literal.
- source_word: הַתְּעוּדָה
  choice: a confirmação
  rationale: Comunica em português corrente a função comprobatória e ratificadora do gesto. “Atestação” seria mais formal, porém menos natural para o leitor comum.
