  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: pt
  text: 'Então as mulheres disseram a Noemi: “Bendito seja Yahweh, que hoje não deixou você sem resgatador[a][b]! Que o nome dele seja celebrado em Israel.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parente-resgatador” ou “protetor da família”; o termo hebraico designa um parente próximo com a responsabilidade de proteger e restaurar os direitos, o patrimônio e a continuidade da família.
    reason: lexical_alternative
  - marker: b
    text: O “resgatador” pode referir-se especificamente ao menino recém-nascido como aquele que restauraria Noemi; outros entendem a expressão de modo mais amplo, à luz do papel de Boaz como resgatador neste capítulo.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico, literalmente: “e que o nome dele seja chamado em Israel”; a expressão indica que seu nome seria conhecido, proclamado ou honrado entre o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Então ... disseram
  rationale: O wayyiqtol de אמר dá sequência à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: Substantivo plural definido que se refere às mulheres da comunidade presentes na cena.
- source_word: בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  rationale: Preserva a forma de bênção hebraica e traduz o tetragrama pelo nome pessoal “Yahweh”.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: que ... não deixou você sem
  rationale: O hiphil de שבת indica aqui causar cessação ou falta; em português, a formulação idiomática comunica que Noemi não ficou privada de um resgatador.
- source_word: גֹּאֵל
  choice: resgatador
  rationale: Traduz o papel familiar e jurídico de quem recupera direitos, patrimônio ou continuidade da família; a nota explicita a nuance de parente próximo.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e natural em português moderno.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: Que o nome dele seja celebrado
  rationale: Comunica idiomaticamente o desejo de que seu nome seja conhecido, proclamado e honrado, sem sugerir apenas o ato de lhe dar um nome.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Mantém a esfera na qual o nome será conhecido e honrado.
theological_decisions:
- issue: Referente de גֹּאֵל (“resgatador”)
  choice: O texto principal mantém “resgatador” sem identificar explicitamente o referente.
  alternative: O termo pode designar especificamente o recém-nascido, como restaurador de Noemi, ou ser entendido à luz do papel de Boaz como resgatador familiar.
  rationale: O nascimento e a menção subsequente ao nome favorecem a criança como referente imediato, mas o contexto jurídico-redentor do capítulo mantém em vista a atuação de Boaz. A ambiguidade legítima do hebraico é preservada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” reflete o singular feminino לָךְ e evita uma construção excessivamente formal. A ordem das notas foi ajustada para acompanhar os termos a que se referem no texto.
