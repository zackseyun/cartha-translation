  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: pt
  text: 'Então o resgatador[a] disse: “Não posso resgatar para mim, para não prejudicar minha própria herança. Exerça você mesmo o meu direito de resgate[b], pois eu não posso resgatar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “resgatador” era o parente mais próximo que tinha prioridade sobre Boaz para exercer o direito e a responsabilidade de resgate da família.
    reason: cultural_note
  - marker: b
    text: Mais literalmente, “meu resgate”. Aqui, o substantivo hebraico se refere ao direito e à responsabilidade legal de resgatar a propriedade e preservar a linhagem familiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: o resgatador
  rationale: O particípio de גאל designa aqui o parente que possuía o direito e a responsabilidade legal de resgatar. “Resgatador” mantém o termo central de modo conciso; o vínculo de parentesco é explicado na nota.
- source_word: לגאול / גְּאַל / גְּאֻלָּתִי
  choice: resgatar / exerça ... o direito de resgate / direito de resgate
  rationale: A tradução preserva a repetição do campo lexical de גאל. Para o substantivo גְּאֻלָּה, “direito de resgate” explicita a dimensão jurídica do contexto sem reduzir a expressão apenas a compra.
- source_word: לִי
  choice: para mim
  rationale: Expressa o interesse ou benefício pessoal indicado pelo dativo, sem acrescentar um objeto que está implícito no hebraico.
- source_word: פֶּן אַשְׁחִית
  choice: para não prejudicar
  rationale: Comunica de forma natural a consequência temida introduzida por פֶּן. Neste contexto, שׁחת indica dano sério à herança, não necessariamente destruição literal.
- source_word: נַחֲלָתִי
  choice: minha própria herança
  rationale: “Herança” mantém a ideia de patrimônio familiar, e “própria” realça o contraste implícito com os bens que seriam resgatados.
- source_word: לְךָ אַתָּה
  choice: você mesmo
  rationale: Reproduz a ênfase do pronome independente אַתָּה de maneira idiomática em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a explicação final dada pelo resgatador.
