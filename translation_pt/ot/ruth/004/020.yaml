  rationale: Conjunção simples que liga as duas declarações genealógicas.
- source_word: שַׂלְמָה
  choice: Salmá
  rationale: Representa diretamente a forma hebraica שַׂלְמָה deste versículo, sem harmonizá-la silenciosamente com formas de genealogias paralelas.
