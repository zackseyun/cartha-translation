  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: pt
  text: 'Então o resgatador[a] disse a Boaz: “Compre-a para você.” Então o resgatador tirou sua sandália[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parente-resgatador”. O termo hebraico se refere a um parente próximo que tinha a responsabilidade legal de resgatar propriedades ou preservar a linhagem da família.
    reason: lexical_alternative
  - marker: b
    text: Tirar a sandália servia como sinal jurídico costumeiro nessa transação; compare Rute 4:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַגֹּאֵל
  choice: o resgatador
  rationale: Em Rute, o termo designa o parente próximo incumbido de resgatar bens e preservar os interesses da família. “Resgatador” mantém concisão e permite explicar a dimensão familiar e legal em nota.
- source_word: לְבֹעַז
  choice: a Boaz
  rationale: Tradução direta da preposição com o nome próprio, cuja forma consagrada em português é “Boaz”.
- source_word: קְנֵה לָךְ
  choice: Compre você mesmo
  rationale: O imperativo קְנֵה significa “compre/adquira”, e לָךְ indica aqui que Boaz deve efetuar a compra para si. A formulação portuguesa é direta e natural.
- source_word: וַיִּשְׁלֹף
  choice: E tirou
  rationale: O verbo significa puxar ou retirar; com uma peça de calçado, “tirou” é a expressão idiomática mais clara.
- source_word: נַעֲלוֹ
  choice: a sandália
  rationale: O substantivo designa calçado e, no contexto do antigo Israel, “sandália” é culturalmente mais preciso que “sapato”. O possessivo hebraico é recuperável pelo sujeito e pelo contexto, mas a nota cultural evita sobrecarregar o texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas foi ajustada para que a nota lexical acompanhe “resgatador” e a nota cultural acompanhe “sandália”. A construção preserva a concisão e a sequência narrativa do hebraico.
