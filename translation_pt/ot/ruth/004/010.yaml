source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: pt
  text: Também Rute, a moabita, mulher de Malom, adquiri para mim como esposa[a], a fim de manter o nome do falecido ligado à sua herança[b], para que o nome do falecido não seja eliminado do meio de seus irmãos nem da porta da sua cidade[c]. Hoje vocês são testemunhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comprei para mim como esposa”. O verbo hebraico pode indicar aquisição por compra numa transação legal.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, para preservar a linhagem e a posição legal do falecido em relação à propriedade que lhe cabia por herança.
    reason: cultural_note
  - marker: c
    text: A porta da cidade era o lugar público onde questões legais eram testemunhadas e decididas.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Expressa a força aditiva e liga esta declaração à transação legal mencionada anteriormente, com naturalidade em português.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Rute, a moabita
  rationale: Emprega a forma tradicional do nome em português e traduz o gentílico feminino de modo atual e claro.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: mulher de Malom
  rationale: Preserva a formulação hebraica, que diz literalmente “mulher de Malom”, sem substituí-la pelo termo interpretativo “viúva”.
- source_word: קָנִיתִי לִי
  choice: adquiri para mim
  rationale: Mantém o sentido jurídico e transacional de קנה sem reduzir a declaração à ideia de compra de uma pessoa.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: Formulação idiomática em português para a finalidade matrimonial expressa no hebraico.
- source_word: לְהָקִים שֵׁם הַמֵּת עַל נַחֲלָתוֹ
  choice: a fim de manter o nome do falecido ligado à sua herança
  rationale: 'Comunica o sentido jurídico da expressão: fazer permanecer o nome do falecido em associação com sua propriedade hereditária. “Manter” evita a estranheza de “levantar o nome” em português, enquanto “ligado à” explicita com moderação a relação expressa por עַל.'
- source_word: וְלֹא יִכָּרֵת
  choice: para que ... não seja eliminado
  rationale: Preserva a gravidade da imagem de כרת e produz uma formulação natural quando o sujeito é “o nome”.
- source_word: מֵעִם אֶחָיו
  choice: do meio de seus irmãos
  rationale: Segue o termo masculino plural explícito do hebraico, sem ampliá-lo silenciosamente para “parentes”.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: nem da porta da sua cidade
  rationale: Mantém a imagem concreta da porta como lugar público de reconhecimento jurídico; “cidade” transmite de modo natural o sentido contextual de מְקוֹמוֹ.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Hoje vocês são testemunhas
  rationale: Declaração jurídica clara e natural em português contemporâneo.
theological_decisions:
- issue: Natureza da ação de Boaz em relação a Rute no contexto de resgate legal
  choice: “adquiri para mim como esposa”
  alternative: “comprei para mim como esposa” ou “tomei por esposa”
  rationale: A opção conserva a força transacional de קנה no contexto de resgate, casamento e herança, sem exagerar a ideia de mercantilização nem transformar a cena em simples linguagem romântica.
- issue: Continuidade do nome do falecido
  choice: “manter o nome do falecido ligado à sua herança”
  alternative: “levantar o nome do falecido sobre a sua herança”
  rationale: A tradução torna compreensível a função familiar e jurídica da ação sem identificar de maneira mais específica do que o texto o mecanismo ou a doutrina envolvida.
- issue: Extensão de אֶחָיו
  choice: “seus irmãos”
  alternative: “seus parentes”
  rationale: Embora o contexto de clã possa permitir uma referência mais ampla, o texto diz literalmente “irmãos”; a tradução preserva essa possível tensão.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação conserva o caráter solene de uma declaração pública e jurídica, evitando arcaísmos como “suscitar o nome” e paráfrases doutrinárias excessivas.
