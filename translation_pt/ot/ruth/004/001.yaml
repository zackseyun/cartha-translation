  to: 'Boaz subiu até o portão da cidade[a] e sentou-se ali. E eis que o parente-resgatador, de quem Boaz tinha falado, passava por ali. Então Boaz lhe disse: “Aproxime-se e sente-se aqui, fulano[b].” Ele se aproximou e sentou-se.'
