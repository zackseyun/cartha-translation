  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: pt
  text: 'Boaz subiu até o portão da cidade[a] e sentou-se ali. E eis que o parente-resgatador, de quem Boaz tinha falado, passava por ali. Então Boaz lhe disse: “Aproxime-se e sente-se aqui, fulano[b].” Ele se aproximou e sentou-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O portão da cidade servia como lugar público para processos legais e assuntos civis.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “Peloni Almoni”, expressão semelhante a “fulano” ou “certo indivíduo”, usada aqui para deixar deliberadamente o nome do homem sem identificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: subiu até o portão da cidade
  rationale: Mantém o sentido básico de עָלָה, “subir”, e explicita que se trata do portão da cidade, local público pressuposto pelo contexto. O pretérito perfeito acompanha naturalmente a sequência narrativa hebraica.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama a atenção para a chegada oportuna do homem, sem reduzir sua vivacidade a uma mera indicação temporal.
- source_word: הַגֹּאֵל
  choice: o resgatador da família
  rationale: גֹּאֵל designa aqui o parente que podia exercer o direito e o dever legal de resgate. “Resgatador da família” comunica tanto a função de resgate quanto o vínculo familiar, sem depender de terminologia denominacional.
- source_word: עֹבֵר
  choice: passava por ali
  rationale: O particípio apresenta uma ação em andamento; o imperfeito português reproduz naturalmente essa perspectiva.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: de quem Boaz tinha falado
  rationale: Identifica o homem como aquele mencionado anteriormente por Boaz, usando uma construção corrente e clara em português.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Venha cá e sente-se aqui
  rationale: Embora סור expresse literalmente desviar-se ou virar para um lado, neste convite significa sair do trajeto e aproximar-se de Boaz. “Venha cá” transmite essa força com naturalidade em português.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: fulano
  rationale: A expressão é uma fórmula que omite deliberadamente o nome. “Fulano” é o equivalente português corrente e funciona de modo natural no tratamento direto.
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: Ele veio e sentou-se
  rationale: Expressa o cumprimento imediato do convite. “Veio” corresponde idiomaticamente ao sentido contextual de o homem sair de seu trajeto e aproximar-se.
theological_decisions:
- issue: Sentido jurídico-familiar de גֹּאֵל
  choice: resgatador da família
  alternative: resgatador; parente próximo
  rationale: A escolha conserva a dimensão legal de resgate e torna explícita a relação familiar que define essa função no contexto de Rute, sem acrescentar uma interpretação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “E eis que” preserva a vivacidade narrativa do hebraico; “fulano” mantém a omissão intencional do nome sem soar excessivamente técnica.
