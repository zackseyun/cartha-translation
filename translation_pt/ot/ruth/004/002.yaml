  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: pt
  text: 'Então ele tomou dez homens dentre os anciãos da cidade e disse[a]: “Sentem-se aqui”, e eles se sentaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escolheu dez homens dentre os anciãos da cidade”. O verbo hebraico pode indicar tomar pessoas para uma finalidade; aqui, provavelmente se refere à seleção de participantes para o procedimento legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: escolheu
  rationale: Embora לקח tenha o sentido básico de “tomar”, neste contexto indica tomar pessoas para uma finalidade específica, isto é, escolher dentre os anciãos os participantes do ato público. “Escolheu” é natural em português e explicita adequadamente a função contextual.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dez homens
  rationale: A expressão é explicitamente masculina e se refere a homens adultos que participariam do procedimento público.
- source_word: מִזִּקְנֵי הָעִיר
  choice: dentre os anciãos da cidade
  rationale: 'A preposição מן tem sentido partitivo: os dez homens foram escolhidos do grupo dos anciãos, reconhecidos como autoridades cívicas da cidade.'
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Tradução direta e natural do verbo narrativo, seguida de discurso direto.
- source_word: שְׁבוּ
  choice: Sentem-se
  rationale: O imperativo plural de ישב convida os homens a tomar seus lugares. A forma pronominal é idiomática e clara em português moderno.
- source_word: פֹה
  choice: aqui
  rationale: Equivalente direto e natural do advérbio dêitico פֹה.
- source_word: וַיֵּשֵׁבוּ
  choice: eles se sentaram
  rationale: Preserva a repetição do verbo ישב e apresenta naturalmente o cumprimento da ordem em sequência narrativa.
