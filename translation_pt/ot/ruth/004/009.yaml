base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: pt
  text: 'Então Boaz disse aos anciãos e a todo o povo: “Hoje vocês são testemunhas de que adquiri[a], da mão de Noemi[b], tudo o que pertencia a Elimeleque e tudo o que pertencia a Quiliom e a Malom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comprei”; o verbo hebraico pode designar uma aquisição por compra numa transação jurídica.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da mão de Noemi”, expressão que significa que os bens estavam na posse ou sob a autoridade dela.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Boaz disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica naturalmente a sequência em português atual.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: aos anciãos e a todo o povo
  rationale: Preserva os dois grupos a quem Boaz se dirige, com construção natural em português.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Hoje vocês são testemunhas
  rationale: Mantém a ênfase temporal e expressa com clareza a declaração pública no contexto jurídico.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo do testemunho, e não uma explicação causal.
- source_word: קָנִיתִי
  choice: adquiri
  rationale: No contexto de uma transação jurídica, o verbo indica obtenção de propriedade ou direitos; “adquiri” preserva essa amplitude sem exigir que o modo tenha sido uma compra em dinheiro.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: tudo o que pertencia a Elimeleque
  rationale: Traduz naturalmente o idiomatismo possessivo hebraico e preserva a abrangência de “tudo”.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: e tudo o que pertencia a Quiliom e a Malom
  rationale: Mantém o paralelismo da formulação anterior e apresenta os nomes em formas correntes na tradição bíblica portuguesa.
- source_word: מִיַּד נָעֳמִי
  choice: das mãos de Noemi
  rationale: Conserva o idiomatismo jurídico hebraico em expressão compreensível em português, indicando que a transferência procede da posse ou autoridade de Noemi.
theological_decisions:
- issue: Natureza da transação de Boaz
  choice: adquiri
  alternative: comprei
  rationale: O versículo trata do patrimônio ou dos direitos associados a Elimeleque, Quiliom e Malom, transferidos por Noemi. “Adquiri” reflete o ato jurídico sem sugerir indevidamente a compra de pessoas nem especificar além do texto a forma de pagamento.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi levemente ajustada para clareza, sem perder a linguagem pública e jurídica da declaração. “Vocês” evita solenidade arcaizante, enquanto “anciãos”, “testemunhas” e “adquiri” preservam o registro formal da cena.
