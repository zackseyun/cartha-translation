  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: pt
  text: Então Noemi pegou o menino, colocou-o no colo e tornou-se sua cuidadora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ama” ou “mãe de criação”; o termo hebraico se refere a uma mulher que amamenta, cria ou cuida de uma criança, não a uma profissional de enfermagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: pegou
  rationale: O verbo לקח descreve aqui a ação concreta de tomar o menino nos braços; “pegou” é natural no português contemporâneo.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar “criança” ou “menino”. O contexto identifica um bebê do sexo masculino, e “menino” permite manter com naturalidade a referência masculina no restante da frase.
- source_word: וַתְּשִׁתֵהוּ
  choice: colocou-o
  rationale: O verbo significa pôr ou colocar. “Colocou-o” expressa de modo claro a ação sem acrescentar uma nuance ausente do hebraico.
- source_word: בְחֵיקָהּ
  choice: no colo
  rationale: חֵיק designa a região do colo ou seio. “No colo” preserva a imagem física de maneira natural e atual, sem o tom arcaico de “no seio”.
- source_word: וַתְּהִי לוֹ
  choice: tornou-se sua
  rationale: A construção היה + ל indica que Noemi passou a exercer determinada função em relação ao menino. “Tornou-se sua” comunica naturalmente esse desenvolvimento.
- source_word: לְאֹמֶנֶת
  choice: cuidadora
  rationale: אֹמֶנֶת designa uma mulher que cria, ampara ou cuida de uma criança. “Cuidadora” é clara no português moderno e evita que “enfermeira” seja entendida no sentido médico, embora a nota preserve as nuances de ama ou mãe de criação.
