id: RUT.4.15
reference: Ruth 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: pt
  text: Ele será para você aquele que restaura a sua vida[a] e sustenta você na velhice[b], pois sua nora, que ama você, deu à luz esse menino — ela, que vale mais para você do que sete filhos homens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “restaurador da vida”; em hebraico, “restaurador da vida/alma”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as suas cãs”, expressão hebraica que se refere à velhice.
    reason: lexical_alternative
  - marker: c
    text: “Sete filhos homens” evoca plenitude ou completude. A afirmação ressalta que Rute vale para Noemi mais do que a bênção idealizada de muitos filhos homens.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה לָךְ
  choice: Ele será para você
  rationale: Mantém o sentido futuro/resultante da declaração das mulheres e a construção relacional do hebraico, em português natural.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: aquele que restaura a sua vida
  rationale: מֵשִׁיב expressa restauração ou retorno, e נֶפֶשׁ, neste contexto familiar, refere-se à vida ou à própria pessoa, não necessariamente a uma alma imaterial.
- source_word: וּלְכַלְכֵּל
  choice: e sustenta você
  rationale: O verbo comunica sustentar, manter ou prover o necessário; a forma verbal evita o pouco natural substantivo português 'sustentador'.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: na velhice
  rationale: שֵׂיבָה significa literalmente 'cãs' e, por extensão, velhice. A expressão escolhida comunica com clareza a função do menino no futuro de Noemi.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a afirmação anterior, preservando o nexo explicativo.
- source_word: כַלָּתֵךְ
  choice: sua nora
  rationale: É o termo português comum e contextualmente exato para a relação de Rute com Noemi.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: que ama você
  rationale: O perfeito hebraico descreve um amor já demonstrado e ainda vigente; o presente português expressa essa realidade contínua.
- source_word: יְלָדַתּוּ
  choice: deu à luz esse menino
  rationale: O sufixo masculino singular remete ao menino mencionado no contexto. A explicitação do referente evita a construção rígida 'deu-o à luz' sem acrescentar uma nova identificação.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: ela, que vale mais para você
  rationale: A construção comparativa descreve o valor e benefício relacional de Rute para Noemi; 'vale mais' soa natural e não sugere superioridade moral absoluta.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: do que sete filhos
  rationale: Preserva o masculino explícito בָּנִים e a comparação cultural com a plenitude idealizada de filhos homens.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma; pessoa
  rationale: O contexto trata da restauração concreta da vida e do futuro de Noemi, não define a constituição imaterial do ser humano. 'Vida' preserva o sentido contextual sem impor uma categoria teológica posterior.
- issue: Comparação de Rute com שִׁבְעָה בָּנִים
  choice: sete filhos
  alternative: sete crianças
  rationale: O hebraico especifica filhos homens, refletindo as expectativas sociais antigas de descendência e amparo na velhice. Neutralizar o gênero apagaria um elemento significativo da afirmação.
- issue: Agente da restauração e do sustento
  choice: o menino recém-nascido
  alternative: o SENHOR como agente implícito
  rationale: A forma masculina singular e a referência posterior ao nascimento apontam gramaticalmente para o menino. A tradução mantém essa referência sem negar que o contexto mais amplo atribua a bênção à ação de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por clareza no singular feminino dirigido a Noemi. A formulação preserva a estrutura relacional da bênção, mas usa verbos naturais em vez de uma sequência pesada de substantivos agentivos.
