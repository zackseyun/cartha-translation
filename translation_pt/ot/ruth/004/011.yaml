base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: pt
  text: 'Então todo o povo que estava à porta, e os anciãos, disseram: “Somos testemunhas. Que Yahweh faça a mulher que está entrando em sua casa semelhante a Raquel e Lia, que juntas edificaram a casa de Israel. Que você realize grandes feitos[a] em Efrata e alcance renome em Belém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prospere”, “mostre seu valor” ou “adquira riqueza”; a expressão hebraica pode indicar força, valor, capacidade, riqueza ou êxito.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Somos testemunhas
  rationale: O hebraico traz o substantivo sem cópula; em português, a fórmula de testemunho requer naturalmente o verbo implícito.
- source_word: יִתֵּן יְהוָה
  choice: Que Yahweh faça
  rationale: Preserva a força optativa da bênção; embora נתן signifique literalmente “dar”, neste padrão com objeto e comparação tem sentido causativo próximo de “fazer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: a mulher que está entrando em sua casa
  rationale: Mantém o valor participial e a imagem concreta da mulher que passa a integrar a casa por meio do casamento.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: que juntas edificaram a casa de Israel
  rationale: Conserva a metáfora de edificar a casa, isto é, estabelecer a linhagem ou o povo, e traduz שְׁתֵּיהֶם de modo idiomático.
- source_word: וַעֲשֵׂה חַיִל
  choice: Que você realize grandes feitos
  rationale: Expressa a ideia de demonstrar capacidade, força ou valor sem reduzir חַיִל apenas a riqueza ou prosperidade; a amplitude lexical é registrada em nota.
- source_word: וּקְרָא שֵׁם
  choice: alcance renome
  rationale: Comunica naturalmente o sentido idiomático de adquirir reputação, evitando a impressão de simplesmente pronunciar ou anunciar um nome.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem trocar por um título.
- issue: Sentido da bênção וַעֲשֵׂה חַיִל
  choice: realize grandes feitos
  alternative: prospere; mostre seu valor; adquira riqueza
  rationale: O substantivo חַיִל abrange força, valor, capacidade, riqueza e êxito. O texto permite mais de uma nuance, portanto a tradução escolhe uma formulação ampla e registra as alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Porta da cidade” explicita a função urbana do portão sem nota desnecessária. “Efrata” e “Belém” seguem as formas portuguesas tradicionais. A sintaxe paralela preserva o caráter público e solene da bênção.
