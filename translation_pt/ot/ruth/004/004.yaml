source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: pt
  text: 'Então pensei que devia informá-lo[a], dizendo: “Compre-a na presença dos que estão sentados aqui e dos anciãos do meu povo. Se você a resgatar, resgate-a; mas, se ele não a resgatar[b], diga-me, para que eu saiba, pois não há ninguém além de você para resgatá-la, e depois de você venho eu”. Ele respondeu: “Eu a resgatarei”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “descobrir o seu ouvido”, expressão idiomática que significa “informá-lo” ou “fazê-lo saber”.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico diz “se ele não a resgatar”. Pelo contexto, alguns entendem “se você não a resgatar”, suavizando a mudança da segunda para a terceira pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: informá-lo
  rationale: A expressão significa literalmente “descobrir o ouvido”, mas funciona como um idioma para dar conhecimento ou informar. A tradução comunica naturalmente esse sentido, enquanto a forma literal fica registrada em nota.
- source_word: קְנֵה
  choice: Compre-a
  rationale: קנה pode significar comprar ou adquirir. Neste contexto público de negociação de uma propriedade, “compre” é claro e natural; o pronome feminino retoma a propriedade mencionada no contexto anterior.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: na presença dos que estão sentados aqui
  rationale: נגד indica que o ato deve ocorrer diante de testemunhas. A formulação também preserva o particípio “os que estão sentados”, com “aqui” explicitando naturalmente a cena à porta da cidade.
- source_word: זִקְנֵי עַמִּי
  choice: os anciãos do meu povo
  rationale: A expressão designa os líderes reconhecidos da comunidade. “Anciãos do meu povo” mantém tanto o título comunitário quanto o sentido direto de עַמִּי.
- source_word: תִּגְאַל ... גְּאָל
  choice: Se você a resgatar, resgate-a
  rationale: A repetição do verbo גאל é preservada para manter a ênfase do hebraico e o sentido jurídico-familiar do resgate da propriedade.
- source_word: וְאִם לֹא יִגְאַל
  choice: mas, se ele não a resgatar
  rationale: O texto massorético apresenta a forma verbal na terceira pessoa do singular, apesar da fala dirigida diretamente ao homem. A tradução conserva essa mudança abrupta, e a alternativa contextual em segunda pessoa é indicada em nota.
- source_word: הַגִּידָה לִּי
  choice: diga-me
  rationale: É uma tradução direta e natural do imperativo, adequada à fala formal sem soar arcaica.
- source_word: אֵין זוּלָתְךָ
  choice: não há ninguém além de você
  rationale: A formulação expressa claramente a exclusividade indicada por זוּלָתְךָ.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: e depois de você venho eu
  rationale: A expressão indica a ordem de prioridade no direito ou dever de resgate. Esta formulação é natural em português e conserva a ideia de sucessão legal.
- source_word: אָנֹכִי אֶגְאָל
  choice: Eu a resgatarei
  rationale: A resposta aceita o direito ou dever de resgate. O pronome feminino explicita o objeto subentendido pelo contexto, a propriedade.
theological_decisions:
- issue: Tradução de גאל no contexto jurídico-familiar
  choice: resgatar
  alternative: agir como resgatador da família; recomprar
  rationale: “Resgatar” preserva a ressonância jurídica e familiar do termo sem inserir no verbo uma explicação interpretativa mais extensa. O contexto comunica que se trata do direito ou dever familiar relativo à propriedade.
- issue: Mudança da segunda para a terceira pessoa em וְאִם לֹא יִגְאַל
  choice: conservar “se ele não a resgatar” no texto principal
  alternative: “se você não a resgatar”
  rationale: A terceira pessoa é a leitura do texto massorético e cria uma tensão real com a segunda pessoa usada imediatamente antes. Em vez de harmonizá-la silenciosamente, a tradução a preserva e registra em nota a leitura contextual mais fluente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala pública mantém certa formalidade jurídica sem recorrer a linguagem arcaica. Os pronomes femininos retomam a propriedade mencionada no contexto anterior.
