lexical_decisions:
- source_word: וְ
  choice: E
  rationale: A conjunção liga esta declaração genealógica final à lista anterior; «E» é a correspondência portuguesa mais direta e natural.
- source_word: עֹבֵד
  choice: Obede
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד, em genealogias, significa gerar ou tornar-se pai de. «Gerou» é conciso, corrente no registro bíblico português e preserva o sentido genealógico masculino.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador de objeto direto sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: יִשַׁי / יִשָׁי
  choice: Jessé
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional do nome em português, especialmente natural e amplamente usada no Brasil.
theological_decisions:
- issue: Tradução do verbo genealógico
  choice: gerou
  alternative: tornou-se pai de
  rationale: A frase apresenta uma genealogia direta que culmina em Davi. «Gerou» mantém a força biológica e genealógica do hebraico sem acrescentar uma afirmação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas onomásticas tradicionais de boa legibilidade brasileira. A repetição de «gerou» preserva o paralelismo conciso do hebraico.
