  rationale: A repetição do mesmo verbo em português preserva o paralelismo e a fórmula genealógica do hebraico.
- source_word: עוֹבֵד
  choice: Obede
  rationale: Emprega-se a forma do nome pessoal tradicionalmente usada em português.
