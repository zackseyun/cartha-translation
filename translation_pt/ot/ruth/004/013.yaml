base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: pt
  text: Assim, Boaz tomou Rute, e ela se tornou sua esposa. Ele se uniu a ela, e Yahweh concedeu que ela engravidasse[a]; então ela deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “deu-lhe concepção”; ou, “deu-lhe gravidez” ou “permitiu que ela concebesse”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido básico de לקח e a sequência do hebraico; a oração seguinte deixa claro que se trata de tomá-la por esposa.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ela se tornou sua mulher
  rationale: Expressa de modo natural o estabelecimento da relação matrimonial formal, preservando o desenvolvimento narrativo da oração hebraica.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Ele se uniu a ela
  rationale: Reproduz em português digno e compreensível o eufemismo hebraico para a união sexual, sem recorrer a uma formulação literal pouco natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Yahweh concedeu que ela engravidasse
  rationale: Preserva explicitamente a ação divina e comunica de forma natural que Yahweh lhe deu a capacidade ou o resultado da concepção.
- source_word: וַתֵּלֶד בֵּן
  choice: ela deu à luz um filho
  rationale: É a expressão portuguesa corrente e digna para ילד seguido de בֵּן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Ação divina na gravidez de Rute
  choice: Yahweh concedeu que ela engravidasse
  alternative: Yahweh lhe deu gravidez; Yahweh permitiu que ela concebesse
  rationale: O hebraico atribui explicitamente a Yahweh a concessão da concepção ou gravidez; a redação conserva essa agência sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Tomou Rute” conserva a forma narrativa hebraica, esclarecida imediatamente pela referência ao casamento. “Uniu-se a ela” mantém o caráter eufemístico e modesto do original. O marcador da nota foi colocado junto à expressão sobre a gravidez, à qual a alternativa lexical de fato se refere.
