base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: pt
  text: 'Então as vizinhas lhe deram um nome[a], dizendo: “Nasceu um filho para Noemi.” E deram-lhe o nome de Obede. Ele foi o pai de Jessé, pai de Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Nasceu um filho para Noemi”. As mulheres falam da restauração da família de Noemi por meio do filho de Rute, não de Noemi como mãe biológica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: as vizinhas
  rationale: O substantivo feminino plural designa especificamente as mulheres que moravam nas proximidades; “as vizinhas” expressa de modo natural tanto a localidade quanto o gênero.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: lhe deram um nome
  rationale: A expressão hebraica significa literalmente chamar um nome para ele. A formulação portuguesa preserva o objeto indireto e soa natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente de introduzir o conteúdo da declaração que acompanha a nomeação.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Nasceu um filho para Noemi
  rationale: Mantém a construção passiva/benefactiva do hebraico e a afirmação deliberada das vizinhas, sem transformar Noemi em mãe biológica nem substituir “filho” por “neto”.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: E deram-lhe o nome de Obede
  rationale: Equivalente português natural da fórmula hebraica de nomeação e coerente com a participação das vizinhas no ato.
- source_word: עוֹבֵד
  choice: Obede
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico; o possível sentido ligado a servir não é traduzido no corpo do texto.
- source_word: אֲבִי
  choice: pai de
  rationale: A genealogia imediata sustenta o sentido direto de paternidade em ambas as ocorrências.
- source_word: יִשַׁי
  choice: Jessé
  rationale: Forma portuguesa bíblica convencional do nome hebraico.
- source_word: דָוִד
  choice: Davi
  rationale: Forma portuguesa convencional e amplamente reconhecida do nome hebraico.
theological_decisions:
- issue: Relação de Noemi com o recém-nascido na declaração “Nasceu um filho para Noemi”
  choice: Manter “para Noemi” no texto principal, sem explicar como maternidade biológica.
  alternative: “Nasceu um neto para Noemi” ou “Noemi recebeu um filho”.
  rationale: O hebraico apresenta intencionalmente a perspectiva das vizinhas sobre a restauração da família de Noemi por meio do filho de Rute. Substituir “filho” por “neto” eliminaria a tensão literária e familiar do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega as formas bíblicas portuguesas convencionais Obede, Jessé e Davi. O marcador [a] aparece no texto principal.
