base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: pt
  text: 'Então ele disse ao resgatador: “Noemi, que voltou dos campos de Moabe[b], está vendendo[c] a porção do campo[a] que pertencia a nosso irmão Elimeleque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a parcela de terra”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dos campos de Moabe”, expressão que se refere à terra ou região rural de Moabe.'
    reason: cultural_note
  - marker: c
    text: Ou “vendeu”. A forma hebraica pode ser entendida como uma ação concluída, mas aqui é traduzida no presente por fazer parte da negociação legal em andamento.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O verbo com waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: לַגֹּאֵל
  choice: ao resgatador
  rationale: גֹּאֵל designa o parente que tinha responsabilidade legal de resgate. “Resgatador” mantém o termo conciso e permite que o contexto esclareça sua função familiar.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: a porção do campo
  rationale: חֶלְקָה indica uma parte ou parcela; a formulação conserva a imagem concreta e permanece clara em português.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: que pertencia a nosso irmão Elimeleque
  rationale: A construção com ל expressa posse ou associação. “Nosso irmão” preserva a linguagem de parentesco sem restringi-la necessariamente a um irmão de sangue.
- source_word: מָכְרָה
  choice: está vendendo
  rationale: Embora a forma perfeita possa indicar ação concluída, no contexto da negociação jurídica ela pode apresentar a venda como assunto atual e ainda em andamento.
- source_word: נָעֳמִי
  choice: Noemi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַשָּׁבָה
  choice: que voltou
  rationale: A forma participial identifica Noemi como aquela que regressou; “que voltou” é natural e preserva esse valor descritivo.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: dos campos de Moabe
  rationale: Mantém a imagem concreta do hebraico, que emprega “campo/campos de Moabe” como expressão para a terra ou região de Moabe.
