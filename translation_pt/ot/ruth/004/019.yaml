  rationale: Mantém-se a mesma tradução do verbo repetido para conservar o paralelismo da genealogia.
- source_word: עַמִּינָדָב
  choice: Aminadabe
  rationale: Forma portuguesa bíblica amplamente reconhecida do nome próprio hebraico.
