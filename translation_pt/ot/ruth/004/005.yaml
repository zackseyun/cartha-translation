  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: pt
  text: 'Então Boaz disse: “No dia em que você adquirir o campo da mão de Noemi, também adquirirá[a] Rute, a moabita, mulher do falecido[b], a fim de perpetuar o nome do falecido em sua herança[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico vocalizado diz literalmente: “eu adquiri” (ou “tenho adquirido”) Rute, a moabita; pelo contexto, muitos entendem o sentido como “você também adquirirá”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “a esposa do morto”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, para preservar a continuidade do nome e da posição familiar do falecido em sua propriedade hereditária.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: No dia em que você adquirir
  rationale: Preserva a expressão temporal hebraica e o caráter jurídico da transação, com formulação natural em português.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: É o equivalente direto e preciso para a propriedade específica em discussão.
- source_word: מִיַּד נָעֳמִי
  choice: das mãos de Noemi
  rationale: Mantém o idioma hebraico de transferência de posse, inteligível em português e adequado ao contexto legal.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: também adquirirá Rute, a moabita
  rationale: Exprime o sentido contextual de que a aquisição do campo traz consigo a responsabilidade relativa a Rute, ao mesmo tempo que a leitura de primeira pessoa do texto massorético é registrada em nota.
- source_word: אֵשֶׁת הַמֵּת
  choice: mulher do falecido
  rationale: Traduz diretamente a relação conjugal expressa no hebraico sem substituir a formulação por uma interpretação como “viúva”.
- source_word: לְהָקִים שֵׁם
  choice: a fim de perpetuar o nome
  rationale: Comunica de modo claro o idioma hebraico, que se refere à continuidade da linhagem, do nome e da posição familiar do falecido.
- source_word: עַל נַחֲלָתוֹ
  choice: em sua herança
  rationale: Preserva a ligação entre o nome do falecido e sua propriedade hereditária em português natural.
theological_decisions:
- issue: Dificuldade textual e sintática na oração sobre Rute e קניתי
  choice: 'Entender a declaração como dirigida ao resgatador mais próximo: ao adquirir o campo, ele também assume a obrigação referente a Rute.'
  alternative: 'Seguir literalmente a vocalização massorética: “eu adquiri” ou “eu adquiro Rute, a moabita”; também são possíveis construções diferentes de “da parte de Rute”.'
  rationale: A vocalização do texto massorético indica primeira pessoa, mas o desenvolvimento narrativo favorece uma afirmação sobre a obrigação que caberia ao resgatador mais próximo. A tradução principal segue esse sentido contextual, sem ocultar a leitura massorética, que aparece em nota.
- issue: Sentido de levantar o nome do falecido sobre sua herança
  choice: Traduzir como “perpetuar o nome do falecido em sua herança”.
  alternative: 'Manter a metáfora mais formal: “levantar o nome do falecido sobre sua herança”.'
  rationale: “Perpetuar” comunica com clareza a continuidade familiar e patrimonial pretendida pelo idioma, sem introduzir uma formulação confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o tom jurídico da cena, evita arcaísmos desnecessários e registra explicitamente a dificuldade do texto hebraico.
