  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: pt
  text: Que a sua casa[a] seja como a casa de Perez, a quem Tamar deu à luz a Judá, da descendência[b] que Yahweh lhe dará por meio desta jovem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «casa» significa a família ou a linhagem, não apenas uma construção onde se mora.
    reason: cultural_note
  - marker: b
    text: Literalmente, «semente»; no hebraico, a palavra é usada com frequência para indicar prole ou descendência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Que ... seja
  rationale: A forma volitiva expressa um desejo ou bênção; a construção portuguesa com «que ... seja» reproduz naturalmente esse valor.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: a sua casa / como a casa de Perez
  rationale: Mantém a imagem hebraica de «casa», que neste contexto abrange família, linhagem e descendência.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: a quem Tamar deu à luz para Judá
  rationale: Preserva o antecedente pessoal Perez, o verbo de dar à luz e a relação genealógica indicada pela preposição ל.
- source_word: מִן הַזֶּרַע
  choice: pela descendência
  rationale: זֶרַע significa literalmente «semente», mas é um idioma comum para prole ou descendência. «Pela» comunica aqui o meio ou a origem do futuro crescimento da casa sem introduzir uma causalidade rígida.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: que Yahweh lhe dará
  rationale: O imperfeito expressa a dádiva divina esperada no contexto da bênção; o futuro é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: por meio desta jovem
  rationale: נַעֲרָה designa uma jovem; no contexto de geração de descendência, «por meio de» expressa naturalmente a origem materna.
theological_decisions:
- issue: Sentido de בֵּית na bênção genealógica
  choice: casa
  alternative: família; linhagem; descendência
  rationale: «Casa» conserva a amplitude da metáfora hebraica, que inclui família e linha de descendência, sem restringi-la a apenas um desses sentidos.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o Tetragrama; «Yahweh» preserva o nome próprio no texto.
- issue: Relação expressa por מִן הַזֶּרַע
  choice: pela descendência
  alternative: da descendência; por causa da descendência
  rationale: A formulação mantém a noção de origem ou meio e evita impor o sentido exclusivamente causal de «por causa de», que não é inequívoco no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém os principais idiomas genealógicos hebraicos, esclarecendo-os em notas sem tornar o corpo do versículo artificial.
