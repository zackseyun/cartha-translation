translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” corresponde naturalmente ao feminino singular do hebraico; “moças” evita tanto o arcaísmo de “donzelas” quanto a especificação social excessiva de “servas”.
