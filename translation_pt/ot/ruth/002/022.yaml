  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: pt
  text: 'Então Noemi disse a Rute, sua nora: “É bom, minha filha, que você saia com as moças de Boaz, para que não a encontrem em outro campo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que não a incomodem/ataquem em outro campo”. O verbo hebraico pode indicar simplesmente encontrar alguém ou, conforme o contexto, ter um encontro hostil. A preocupação de Noemi com a segurança de Rute favorece aqui o sentido negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: כַּלָּתָהּ
  choice: sua nora
  rationale: O substantivo com sufixo de terceira pessoa feminina singular identifica explicitamente Rute como nora de Noemi.
- source_word: טוֹב
  choice: É bom
  rationale: Mantém a avaliação simples do adjetivo predicativo, sem transformá-la em superlativo como “é melhor”.
- source_word: בִּתִּי
  choice: minha filha
  rationale: Preserva o tratamento familiar e afetuoso, sem implicar maternidade biológica.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo daquilo que Noemi considera bom: que Rute saia com as moças de Boaz.'
- source_word: תֵצְאִי
  choice: você saia
  rationale: Traduz o verbo “sair” sem acrescentar “para recolher espigas”, informação presente no contexto, mas não no verbo.
- source_word: נַעֲרוֹתָיו
  choice: as moças dele
  rationale: Designa as jovens trabalhadoras ligadas a Boaz em linguagem atual, sem especificar além do hebraico que fossem servas.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: para que não mexam com você
  rationale: No contexto, a expressão portuguesa comunica uma abordagem indesejada ou hostil, mas sem definir a natureza exata do perigo além do que o verbo hebraico permite.
- source_word: בְּשָׂדֶה אַחֵר
  choice: em outro campo
  rationale: Tradução direta e idiomática da expressão locativa.
