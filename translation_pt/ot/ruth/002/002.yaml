base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: pt
  text: 'Rute, a moabita, disse a Noemi: “Por favor, deixe-me ir ao campo respigar entre as espigas, atrás daquele em cujos olhos eu encontrar favor.” Noemi lhe respondeu: “Vá, minha filha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: a moabita
  rationale: Mantém o gentílico feminino e a ênfase narrativa na origem estrangeira de Rute, de modo natural em português.
- source_word: אֵלְכָה נָּא
  choice: Por favor, deixe-me ir
  rationale: O coortativo com נָא expressa vontade em forma de pedido cortês dirigido a Noemi.
- source_word: הַשָּׂדֶה
  choice: ao campo
  rationale: Tradução direta e idiomática para a área agrícola onde ocorria a colheita.
- source_word: וַאֲלַקֳטָּה בַשִּׁבֳּלִים
  choice: recolher espigas que ficaram para trás
  rationale: 'Explicita de forma acessível a respiga: recolher o cereal deixado pelos ceifeiros, sem confundir שִׁבֳּלִים com feixes.'
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: seguindo aquele que me tratar com bondade
  rationale: Comunica o sentido social da expressão hebraica e preserva o referente masculino singular indicado pelo sufixo pronominal.
- source_word: חֵן
  choice: bondade
  rationale: Neste contexto, denota acolhimento ou disposição favorável, não necessariamente uma noção teológica técnica de graça.
- source_word: לְכִי בִתִּי
  choice: Vá, minha filha
  rationale: Preserva tanto o imperativo simples quanto o tratamento afetuoso de Noemi.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o termo menos cotidiano “respigar”, mas torna clara a prática ao dizer “recolher espigas que ficaram para trás”. Mantém-se o masculino singular de בְּעֵינָיו por meio de “aquele”.
