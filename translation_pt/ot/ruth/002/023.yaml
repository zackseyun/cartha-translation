  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: pt
  text: Assim, ela permaneceu perto das jovens de Boaz[a], para respigar, até o fim da colheita da cevada e da colheita do trigo. E morou com sua sogra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «manteve-se estreitamente ligada às jovens de Boaz». O verbo hebraico pode enfatizar apego ou proximidade persistente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «permaneceu com sua sogra». O verbo hebraico pode significar «permanecer», «ficar» ou «morar», conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: se manteve junto
  rationale: דבק expressa apego ou proximidade persistente. No contexto, a formulação indica que Rute continuou perto das trabalhadoras de Boaz sem sugerir necessariamente contato físico.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: às jovens de Boaz
  rationale: נַעֲרוֹת designa aqui as jovens trabalhadoras ligadas a Boaz; com דבק, a preposição é expressa naturalmente por «junto às».
- source_word: לְלַקֵּט
  choice: para recolher espigas
  rationale: O infinitivo indica finalidade. «Recolher espigas» comunica de modo claro a prática de apanhar o que restava da colheita, central à narrativa de Rute.
- source_word: עַד כְּלוֹת
  choice: até terminarem
  rationale: A construção marca duração até a conclusão. Esta forma preserva o valor temporal e soa natural em português.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: a colheita da cevada e a colheita do trigo
  rationale: A repetição de «colheita» reproduz o paralelismo hebraico e destaca os dois períodos agrícolas sucessivos.
- source_word: וַתֵּשֶׁב
  choice: continuou morando
  rationale: ישב pode significar sentar-se, permanecer ou morar. Neste contexto doméstico, «morando» indica residência, enquanto «continuou» torna natural a sequência narrativa sem eliminar a alternativa lexical.
- source_word: אֶת חֲמוֹתָהּ
  choice: com sua sogra
  rationale: Com ישב, a expressão indica residência em companhia da sogra; «com» é a formulação idiomática em português.
