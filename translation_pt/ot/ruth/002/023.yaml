  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Recolher espigas» foi preferido no texto principal por ser mais imediatamente compreensível que «respigar»; a alternativa tradicional foi preservada em nota. A repetição de «colheita» mantém o paralelismo do hebraico.
