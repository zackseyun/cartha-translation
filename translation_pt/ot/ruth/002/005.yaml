base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: pt
  text: 'Então Boaz disse ao jovem que estava encarregado dos ceifeiros: “De quem é essa jovem?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A quem essa jovem está ligada?” O hebraico pergunta por sua vinculação ou ligação com uma casa ou família.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... perguntou
  rationale: O waw consecutivo faz a narrativa avançar. Como a fala tem forma interrogativa, “perguntou” é natural em português e mantém a função comunicativa do verbo.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: לְנַעֲרוֹ
  choice: ao seu jovem
  rationale: נַעַר pode designar jovem, servo ou auxiliar. “Seu jovem” preserva o sentido lexical sem especificar indevidamente a condição social; a função de supervisão é expressa pela frase seguinte.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: encarregado dos ceifeiros
  rationale: A construção indica alguém posto sobre os ceifeiros, isto é, com função de supervisão. A formulação é clara e natural, embora não reproduza literalmente a nuance passiva de נצב.
- source_word: לְמִי
  choice: De quem é
  rationale: A expressão hebraica pergunta pela vinculação, pertença ou ligação doméstica da jovem. “De quem é” conserva a concisão e a ambiguidade social da pergunta.
- source_word: הַנַּעֲרָה
  choice: jovem
  rationale: נַעֲרָה designa uma pessoa jovem do sexo feminino. “Jovem” é corrente, digno e evita tanto o tom arcaico de “donzela” quanto uma idade excessivamente baixa sugerida por “menina”.
- source_word: הַזֹּאת
  choice: essa
  rationale: No diálogo, “essa” é a forma demonstrativa mais natural em português para alguém que está à vista dos interlocutores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Ceifeiros” preserva o contexto agrícola e o tom bíblico sem ser obscuro. O marcador da nota foi colocado imediatamente após a pergunta a que se refere.
