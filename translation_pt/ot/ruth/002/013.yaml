base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: pt
  text: 'Então ela disse: “Que eu encontre favor aos seus olhos, meu senhor, pois o senhor me consolou e falou ao coração de sua serva[a], embora eu não seja como uma de suas servas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou bondosamente à sua serva” ou “encorajou sua serva”. Em hebraico, literalmente: “falou ao coração de sua serva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Que eu continue a encontrar favor
  rationale: A forma imperfeita, após o verbo de fala, expressa aqui um desejo deferente. O contexto sugere a continuação do favor que Boaz já demonstrou; a formulação preserva o idioma hebraico sem tratá-lo como simples futuro.
- source_word: בְּעֵינֶיךָ
  choice: aos seus olhos
  rationale: Preserva a imagem do idioma hebraico de avaliação e favor e é compreensível em português atual.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de Ruth se dirigir a Boaz, um ser humano; comunica deferência social sem transformar o termo em título divino.
- source_word: נִחַמְתָּנִי
  choice: o senhor me consolou
  rationale: O verbo comunica consolo diante da vulnerabilidade de Ruth. A repetição de “o senhor” evita ambiguidade com o título divino e soa natural no tratamento respeitoso brasileiro.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: falou ao coração de
  rationale: Mantém a imagem literal do hebraico, que sugere palavras bondosas, encorajadoras ou tranquilizadoras, sem reduzir sua amplitude a uma única interpretação.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: sua serva / suas servas
  rationale: O substantivo é feminino e pode designar serva ou escrava. Neste contexto, Ruth o usa como autodesignação deferente; “serva” preserva gênero, repetição e contraste social sem impor uma nuance jurídica além do contexto.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: embora eu não seja como uma
  rationale: 'A oração tem sentido concessivo: Boaz tratou Ruth com bondade apesar de ela não possuir sequer a condição de uma das servas dele. O presente português traduz naturalmente o valor estativo.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O tratamento respeitoso usa “o senhor” na fala dirigida a Boaz; “meu senhor” preserva a deferência explícita de אֲדֹנִי. A construção “falou ao coração” foi mantida no texto por transparência ao idioma hebraico, com alternativas naturais na nota.
