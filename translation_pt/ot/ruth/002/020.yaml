base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: pt
  text: 'Noemi disse à sua nora: “Que ele seja abençoado por Yahweh, cuja bondade não abandonou nem os vivos nem os mortos[a].” E Noemi acrescentou: “Esse homem é nosso parente próximo; ele é um dos nossos resgatadores[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ele seja abençoado por Yahweh, pois Boaz não deixou de demonstrar sua bondade aos vivos e aos mortos.” Nesta leitura, “sua bondade” refere-se a Boaz, e não a Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “um dos nossos parentes-resgatadores”. O termo hebraico refere-se a um parente próximo que tinha o direito ou a responsabilidade reconhecida de resgatar um membro da família ou uma propriedade familiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Que ele seja abençoado por Yahweh
  rationale: A fórmula nominal hebraica expressa uma bênção ou desejo. Esta formulação é natural em português, mantém Boaz como o homem abençoado e entende o lamed diante do nome divino como indicação da fonte ou agente da bênção.
- source_word: חַסְדּוֹ
  choice: sua bondade
  rationale: חֶסֶד pode indicar bondade, amor leal ou fidelidade. “Bondade” é clara e adequada ao contexto, sem eliminar a possível referência à lealdade; a ambiguidade quanto ao referente do pronome é registrada em nota.
- source_word: לֹא עָזַב
  choice: não abandonou
  rationale: Traduz diretamente o sentido relacional de עזב e forma uma expressão idiomática em português com “bondade”.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: nem os vivos nem os mortos
  rationale: Sob a negação, a construção correlativa “nem... nem...” comunica naturalmente em português a totalidade expressa pelo hebraico.
- source_word: קָרוֹב לָנוּ
  choice: nosso parente próximo
  rationale: קָרוֹב indica aqui proximidade de parentesco, e não distância física.
- source_word: מִגֹּאֲלֵנוּ
  choice: um dos nossos resgatadores
  rationale: O particípio de גאל designa um parente com direito ou responsabilidade reconhecida de resgatar pessoas ou bens da família. “Resgatadores” traduz o termo sem introduzir jargão no texto principal.
theological_decisions:
- issue: Referente dos pronomes na fórmula de bênção
  choice: Noemi pede que Boaz seja abençoado por Yahweh e entende-se que “cuja bondade” se refere a Yahweh.
  alternative: “Sua bondade” pode referir-se a Boaz, de modo que seria a bondade dele para com os vivos e os mortos que não teria cessado.
  rationale: Boaz é o referente natural de “ele”, enquanto o antecedente mais próximo de “cuja” é Yahweh. Contudo, a sintaxe hebraica permite relacionar a bondade a Boaz; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se “Yahweh” para representar explicitamente o nome divino יהוה. Evitou-se o tecnicismo “goel” no texto principal; a dimensão familiar e jurídica aparece na nota.
