base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: pt
  text: Assim, ela recolheu espigas no campo até o entardecer. Depois, debulhou o que havia recolhido, e o resultado foi cerca de um efa de cevada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O efa era uma antiga medida para produtos secos, equivalente a aproximadamente 20–22 litros.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Assim, ela recolheu espigas
  rationale: O verbo לקט, no contexto de Rute, indica recolher as espigas deixadas pelos ceifeiros. A formulação explicita de modo natural essa prática agrícola, sem depender do termo menos conhecido “respigar”.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שׂדה é o termo comum para campo, e o artigo definido remete ao campo onde Rute trabalhava.
- source_word: עַד הָעָרֶב
  choice: até o entardecer
  rationale: Expressa com naturalidade o limite temporal do trabalho de Rute e preserva o sentido de עֶרֶב.
- source_word: וַתַּחְבֹּט
  choice: Depois, debulhou
  rationale: חבט descreve aqui o ato de bater as espigas recolhidas para separar os grãos. “Debulhou” comunica de forma concisa e corrente o resultado dessa ação.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: o que havia recolhido
  rationale: A construção relativa se refere ao produto que Rute recolhera; a forma verbal anterior ao passado mantém clara a sequência narrativa.
- source_word: וַיְהִי
  choice: e o resultado foi
  rationale: Neste contexto, a construção introduz a quantidade obtida após a debulha. Esta formulação é natural em português e torna explícita a relação resultativa sem alterar o conteúdo.
- source_word: כְּאֵיפָה
  choice: cerca de um efa
  rationale: O prefixo כ־ indica aproximação, e “efa” preserva a medida histórica; seu equivalente aproximado é explicado em nota.
- source_word: שְׂעֹרִים
  choice: de cevada
  rationale: שְׂעֹרִים designa a cevada, e a construção é idiomática depois da unidade de medida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A prática de respigar é expressa por “recolheu espigas”, mais transparente ao leitor comum. A nota foi posicionada junto a “efa”, termo que ela explica.
