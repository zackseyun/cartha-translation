  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: pt
  text: 'Então Boaz disse a Rute: “Ouça bem, minha filha: não vá respigar em outro campo, nem se afaste daqui. Fique junto das minhas moças.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Escute
  rationale: A forma hebraica é literalmente uma pergunta retórica, “Você não ouviu?”, mas neste contexto funciona como um chamado enfático à atenção. “Escute” reproduz naturalmente essa força em português.
- source_word: לִלְקֹט
  choice: colher espigas
  rationale: O verbo significa recolher o que ficou após a colheita. “Colher espigas” comunica de modo claro a prática de respigar neste contexto agrícola.
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: nem se afaste daqui
  rationale: Expressa a ordem de não sair ou passar deste lugar para outro; a formulação portuguesa é natural e mantém o sentido espacial.
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: Fique junto das minhas servas
  rationale: דבק indica permanecer perto ou acompanhar de perto. נַעֲרוֹת designa as jovens trabalhadoras ligadas a Boaz; “servas” é conciso e apropriado ao contexto.
