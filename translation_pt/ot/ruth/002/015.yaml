  text: וַ/תָּ֖קָם לְ/לַקֵּ֑ט וַ/יְצַו֩ בֹּ֨עַז אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר גַּ֣ם בֵּ֧ין הָֽ/עֳמָרִ֛ים תְּלַקֵּ֖ט וְ/לֹ֥א תַכְלִימֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: pt
  text: 'Quando ela se levantou para recolher espigas, Boaz ordenou aos seus rapazes[a]: “Deixem que ela recolha até mesmo entre os feixes e não a humilhem[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos” ou “trabalhadores”. O termo hebraico pode designar rapazes ou homens jovens que serviam ou trabalhavam sob a autoridade de alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “não a envergonhem”. O verbo hebraico pode indicar causar vergonha, desonra ou humilhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: Quando ela se levantou para recolher espigas
  rationale: A construção faz a narrativa avançar e liga temporalmente a ação de Rute à ordem de Boaz. “Recolher espigas” comunica de modo claro a prática de apanhar o que restava da colheita.
- source_word: וַיְצַו ... לֵאמֹר
  choice: Boaz ordenou
  rationale: O verbo צוה expressa uma determinação, não uma simples sugestão. Em português, os dois-pontos introduzem a fala com mais naturalidade do que a reprodução explícita de “dizendo”.
- source_word: נְעָרָיו
  choice: aos seus rapazes
  rationale: נַעַר pode designar rapaz, servo ou auxiliar. “Rapazes” preserva a referência masculina e jovem sem ocultar, por meio de uma tradução excessivamente funcional, a amplitude lexical do termo.
- source_word: גַּם בֵּין הָעֳמָרִים תְּלַקֵּט
  choice: Deixem que ela recolha até mesmo entre os feixes
  rationale: O imperfeito tem força permissiva dentro da ordem. “Até mesmo” expressa a ampliação enfática de גַּם, e “entre os feixes” traduz naturalmente בֵּין הָעֳמָרִים.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: e não a humilhem
  rationale: O hifil de כלם pode significar causar vergonha, desonrar ou humilhar. “Humilhem” transmite a gravidade social da conduta proibida, sem reduzi-la a mero constrangimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Recolher espigas” foi preferido ao termo mais técnico “respigar”; “rapazes” conserva o perfil lexical do hebraico, enquanto a nota esclarece sua função no campo.
