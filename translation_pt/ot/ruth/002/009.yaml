base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: pt
  text: Mantenha os olhos no campo onde elas estão colhendo e vá atrás delas. Não ordenei aos rapazes que não toquem em você?[a] Quando tiver sede, vá até os jarros e beba da água que os rapazes tiraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme o contexto, “que não ponham a mão em você”. O hebraico diz literalmente “que não toquem em você” e pode incluir proteção contra assédio ou agressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ
  choice: Mantenha os olhos
  rationale: A construção nominal hebraica tem força diretiva implícita; a expressão portuguesa comunica atenção contínua de modo natural.
- source_word: בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: no campo onde elas estiverem colhendo
  rationale: “Campo” preserva o sentido agrícola de שׂדה, e a oração relativa apresenta a colheita como ação em andamento. O pronome feminino explicita o gênero do sufixo posterior e remete às trabalhadoras mencionadas no contexto.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: e vá atrás delas
  rationale: Reproduz a instrução de deslocar-se seguindo as mulheres, mantendo a relação espacial expressa por אַחֲרֵי e o feminino plural do sufixo.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Não ordenei
  rationale: Mantém a pergunta retórica de reassurance e a autoridade expressa pelo verbo צוה, em formulação idiomática portuguesa.
- source_word: הַנְּעָרִים
  choice: os rapazes
  rationale: Preserva a referência masculina e provável faixa etária dos trabalhadores de Boaz, distinguindo-os do grupo feminino.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: que não toquem em você
  rationale: Mantém o sentido lexical direto de נגע sem eliminar a possível implicação contextual de assédio ou agressão, registrada em nota.
- source_word: וְצָמִת
  choice: Quando tiver sede
  rationale: Expressa naturalmente em português a circunstância esperada introduzida pela forma verbal hebraica.
- source_word: הַכֵּלִים
  choice: os jarros
  rationale: Embora o termo seja amplo, “jarros” representa de maneira concreta e plausível os recipientes de água neste contexto.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: e beba da água que os rapazes tirarem
  rationale: O objeto “água” é inferido com segurança pelo contexto de beber e tirar dos recipientes ou da fonte; o futuro do subjuntivo acompanha naturalmente a referência eventual da ação.
theological_decisions:
- issue: Alcance de נגע na ordem dada aos rapazes
  choice: Manter “não toquem em você” no texto
  alternative: “não ponham a mão em você” ou “não a molestem”
  rationale: A tradução principal conserva a amplitude lexical do hebraico, enquanto a nota informa a força contextual possível sem transformar uma implicação em certeza explícita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A distinção de gênero entre “elas” e “os rapazes” foi preservada por ser expressa no hebraico e relevante para a cena.
