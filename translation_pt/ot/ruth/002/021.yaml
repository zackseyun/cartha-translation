  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: pt
  text: 'Então Rute, a moabita, disse: “Ele também me disse: ‘Fique perto dos meus rapazes[a] até que terminem toda a minha colheita.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus jovens” ou “meus servos”. O hebraico está no masculino; em 2:8 e 2:22, porém, aparecem formas femininas, “moças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Rute, a moabita
  rationale: Emprega a forma portuguesa tradicional do nome e traduz o gentílico em linguagem moderna e natural.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Ele também me disse
  rationale: “Também” comunica o valor aditivo e enfático da expressão no relato de Rute.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: junto dos meus trabalhadores
  rationale: עִם indica associação ou proximidade, e נְעָרִים é uma forma masculina que, no contexto da colheita, pode designar os rapazes ou servos que trabalhavam para Boaz. “Trabalhadores” é natural em português e mantém a referência contextual sem alterar o hebraico para o feminino.
- source_word: תִּדְבָּקִין
  choice: Fique junto
  rationale: O verbo דבק expressa apego ou proximidade contínua; aqui, o imperativo natural em português transmite a instrução prática dada a Rute.
- source_word: עַד אִם כִּלּוּ
  choice: até que terminem
  rationale: Expressa claramente o limite temporal da ação, preservando o sentido da construção hebraica.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: toda a minha colheita
  rationale: Forma concisa e idiomática que preserva tanto a totalidade como a relação de posse.
theological_decisions:
- issue: Diferença entre os trabalhadores masculinos neste versículo e as jovens mencionadas no contexto imediato
  choice: Manter no texto a forma masculina de נְעָרִים, vertida como “trabalhadores”
  alternative: Harmonizar com o contexto e traduzir “trabalhadoras” ou “moças”
  rationale: O texto hebraico recebido usa aqui o plural masculino, embora Rute 2:8 e 2:22 usem o feminino. A tradução não deve eliminar silenciosamente essa tensão textual e narrativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. “Fique junto” evita o arcaísmo de uma tradução literal como “apegue-se”, enquanto “trabalhadores” se ajusta ao cenário da colheita. A nota preserva a forma masculina do texto hebraico e explicita, sem harmonização, sua relação tensa com o contexto.
