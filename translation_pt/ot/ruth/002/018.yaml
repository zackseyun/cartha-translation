base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: pt
  text: Rute levou o que havia respigado para a cidade, e sua sogra viu o que ela havia respigado. Então, Rute tirou o que havia deixado de sobra depois de se fartar[a] e o deu à sogra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: depois de comer até se fartar.'
    reason: Alternativa contextual para מִשָּׂבְעָהּ, que pode explicitar a saciedade resultante de ter comido o suficiente.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Rute pegou o grão
  rationale: נשׂא significa levantar ou carregar. O objeto está implícito no hebraico e, pelo contexto imediato, é o grão respigado; explicitá-lo torna a frase natural e clara em português.
- source_word: הָעִיר
  choice: a cidade
  rationale: עִיר corresponde diretamente a “cidade”; mantém-se essa equivalência, embora Belém fosse um centro urbano pequeno.
- source_word: חֲמוֹתָהּ
  choice: sua sogra
  rationale: Equivalente corrente do termo de parentesco, com o sufixo identificando Noemi como sogra de Rute.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: o que ela havia respigado
  rationale: לקט designa especificamente recolher as espigas deixadas pelos ceifeiros. “Respigado” preserva o contexto agrícola e social do relato.
- source_word: וַתּוֹצֵא
  choice: tirou
  rationale: No hifil, יצא significa fazer sair, trazer para fora ou tirar. Aqui Rute tira a comida que havia guardado.
- source_word: וַתִּתֶּן לָהּ
  choice: deu à sogra
  rationale: O hebraico marca explicitamente o objeto indireto. Repetir “à sogra” evita ambiguidade pronominal e soa natural em português.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: o que lhe sobrara
  rationale: יתר no hifil comunica deixar de sobra. A forma “lhe sobrara” expressa de modo conciso a comida que Rute guardou da refeição.
- source_word: מִשָּׂבְעָהּ
  choice: depois de ficar satisfeita
  rationale: A expressão indica a condição ou o momento de saciedade. Esta tradução conserva a formulação relativamente compacta do hebraico sem ocultar que se trata do que restou da refeição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Respigado” preserva o termo agrícola específico; o contexto torna seu sentido compreensível. O nome “Rute” é repetido para evitar sequências pronominais ambíguas.
