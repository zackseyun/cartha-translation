base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: pt
  text: Noemi tinha um parente do marido, homem de grande valor[a], do clã de Elimeleque[b]. O nome dele era Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem poderoso e valente”, “homem de destaque” ou “homem rico”; a expressão hebraica reúne ideias de força, capacidade, posição social e recursos.
    reason: lexical_alternative
  - marker: b
    text: Ou “da família de Elimeleque”; o hebraico pode indicar um grupo de parentesco mais amplo, isto é, um clã.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: parente
  rationale: O termo indica alguém conhecido ou ligado ao marido de Noemi; a menção subsequente ao clã de Elimeleque favorece uma relação de parentesco, sem antecipar o papel jurídico posterior de resgatador.
- source_word: לְאִישָׁהּ
  choice: do marido
  rationale: A construção liga o homem ao marido de Noemi. Em português, o possessivo pode ser omitido com naturalidade porque o referente está claro.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: homem de grande valor
  rationale: A expressão reúne noções de capacidade, força, posição social e recursos. No contexto não militar de Rute, esta formulação preserva sua amplitude elogiosa.
- source_word: מִמִּשְׁפַּחַת
  choice: do clã de
  rationale: מִשְׁפָּחָה pode designar um grupo familiar mais amplo que a família imediata; “clã” explicita essa estrutura de parentesco.
- source_word: וּשְׁמוֹ
  choice: O nome dele era
  rationale: Formulação narrativa natural em português; a divisão em nova frase evita uma coordenação pesada.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: וּלְנָעֳמִי
  choice: Noemi tinha
  rationale: A conjunção introduz uma nova informação narrativa; não é necessário acrescentar um advérbio temporal inexistente no hebraico.
theological_decisions: []
