base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: pt
  text: 'Então Boaz lhe respondeu: “Fui plenamente informado de tudo o que você fez por sua sogra depois da morte de seu marido, e de como deixou seu pai, sua mãe e sua terra natal e foi para um povo que antes não conhecia.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que não conhecia ontem nem anteontem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Contaram-me em detalhes
  rationale: A construção intensiva com infinitivo absoluto e forma finita passiva enfatiza que Boaz recebeu um relato completo ou seguro. A formulação portuguesa preserva a ideia de informação recebida e expressa naturalmente a intensificação.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: tudo o que você fez por sua sogra
  rationale: “Tudo” preserva a totalidade de כֹּל, e “fez por” comunica em português corrente o sentido benefativo indicado pelo contexto.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: depois da morte de seu marido
  rationale: Mantém a construção nominal e o tom sóbrio do hebraico.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: deixou seu pai, sua mãe
  rationale: “Deixou” é natural e não acrescenta a carga negativa que “abandonou” poderia sugerir; pai e mãe são mantidos separadamente como no original.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: sua terra natal
  rationale: Expressão portuguesa natural que comunica a terra de nascimento ou origem sem tornar a frase excessivamente literal.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: veio para o meio de um povo
  rationale: Embora הלך denote ir, em português a perspectiva dêitica de Boaz e do local da conversa torna “veio” natural; “para o meio de” evita a construção pouco idiomática “veio a um povo” e comunica integração espacial e social sem identificar esse povo como Estado político.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: que antes não conhecia
  rationale: ידע indica aqui familiaridade pessoal ou experiencial; “conhecia” é o equivalente corrente. “Antes” transmite o valor idiomático da expressão temporal seguinte.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: antes
  rationale: O idioma literalmente menciona ontem e anteontem, mas significa que o povo lhe era desconhecido anteriormente. A forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativo, com ampla legibilidade brasileira. Emprega “você” por clareza e naturalidade contemporânea; evita arcaísmos e vocabulário denominacional. O discurso direto é introduzido de modo conciso, sem o pleonasmo semítico “respondeu e disse”.
