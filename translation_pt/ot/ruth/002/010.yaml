base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: pt
  text: 'Então ela caiu com o rosto em terra e se prostrou até o chão. E lhe disse: “Por que encontrei favor aos seus olhos, para que reparasse em mim[a], embora eu seja estrangeira?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me reconhecesse”, “me considerasse” ou “desse atenção a mim”.
    reason: Alternativa lexical para לְהַכִּירֵנִי.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ וַתִּשְׁתַּחוּ אָרְצָה
  choice: ela se prostrou com o rosto em terra
  rationale: Reúne de modo natural as duas descrições complementares do gesto, preservando tanto a posição do rosto quanto a profunda reverência, sem sugerir necessariamente adoração religiosa.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: encontrei favor aos seus olhos
  rationale: Mantém a imagem idiomática hebraica de achar favor aos olhos de alguém, em linguagem clara e digna.
- source_word: לְהַכִּירֵנִי
  choice: para que o senhor reparasse em mim
  rationale: No contexto, o Hifil de נכר indica notar, reconhecer ou dar atenção. “Reparasse em mim” comunica naturalmente a atenção favorável de Boaz sem eliminar as demais nuances.
- source_word: וְאָנֹכִי
  choice: embora eu seja
  rationale: A conjunção e o pronome independente estabelecem aqui um contraste concessivo entre a atenção recebida e a condição estrangeira de Rute.
- source_word: נָכְרִיָּה
  choice: estrangeira
  rationale: Preserva diretamente a forma feminina singular e exprime o status social de Rute de maneira corrente em português.
theological_decisions:
- issue: Possível sentido cultual de וַתִּשְׁתַּחוּ
  choice: Entendido como gesto de profunda reverência diante de Boaz, não como adoração
  alternative: Traduzir com um verbo que indique explicitamente adoração
  rationale: O contexto narrativo descreve deferência social. “Prostrou-se” conserva o gesto físico sem acrescentar uma afirmação teológica ausente do texto.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. O tratamento “o senhor” torna explícita a deferência social implícita na fala dirigida a Boaz, sem usar forma arcaica.
