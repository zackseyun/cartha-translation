  terminology: «Ceifeiros», «feixes» e «recolher espigas e juntá-las» são adequados ao contexto agrícola e preservam a distinção básica entre os dois verbos hebraicos. «Casa» deve ser mantida no texto principal, pois é o sentido lexical explícito de הַבַּיִת.
