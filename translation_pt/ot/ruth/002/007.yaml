translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ceifeiros” preserva o cenário agrícola bíblico, enquanto “recolher espigas” torna compreensível a ação de respigar. A nota mantém a ambiguidade genuína da cláusula final.
