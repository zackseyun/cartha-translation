base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: pt
  text: 'Ela disse: “Por favor, deixe-me recolher espigas e juntá-las entre os feixes, atrás dos ceifeiros”. Então ela veio e permaneceu desde a manhã até agora; ela se sentou na casa apenas um pouco.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela descansou no abrigo apenas um pouco”. O hebraico da frase final é difícil; a palavra traduzida como “casa” talvez se refira a um abrigo usado pelos trabalhadores no campo.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Por favor, deixe-me recolher espigas
  rationale: O coortativo com נָא expressa um pedido respeitoso. “Recolher espigas” comunica em português corrente a prática agrícola de respigar sem depender de um termo menos conhecido.
- source_word: וְאָסַפְתִּי
  choice: e juntá-las
  rationale: 'Mantém uma distinção em relação a לקט: primeiro ela recolhe as espigas deixadas para trás e depois as junta. O pronome retoma naturalmente “espigas”.'
- source_word: בָעֳמָרִים
  choice: entre os feixes
  rationale: עֳמָרִים designa talos cortados e atados em feixes. “Entre” preserva o sentido espacial da preposição.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: atrás dos ceifeiros
  rationale: Expressa claramente a posição de Rute no campo, seguindo os trabalhadores que faziam a colheita.
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: Então ela veio e permaneceu
  rationale: Embora עמד possa significar literalmente “ficar de pé”, aqui a expressão temporal seguinte favorece o sentido durativo de permanecer no trabalho.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: desde a manhã até agora
  rationale: Reproduz a duração indicada no hebraico, do início da manhã até o momento da fala.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: ficou sentada no abrigo apenas um pouco
  rationale: A cláusula hebraica é difícil e comprimida. Esta formulação comunica a interpretação provável de que ela passou pouquíssimo tempo descansando no local de apoio dos trabalhadores, sem esconder a incerteza textual, registrada na nota.
