  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: pt
  text: 'E eis que Boaz chegou de Belém e disse aos ceifeiros: “Yahweh esteja com vocês”. E eles lhe responderam: “Que Yahweh o abençoe”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função apresentativa e a vivacidade narrativa do hebraico, em registro digno e reconhecível em português.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Usa a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָּא
  choice: chegou
  rationale: No contexto da entrada de Boaz em cena vindo de Belém, “chegou” expressa naturalmente o movimento indicado por בוא.
- source_word: מִבֵּית לֶחֶם
  choice: de Belém
  rationale: Traduz diretamente a preposição מן e emprega a forma consagrada do topônimo em português.
- source_word: לַקֹּצְרִים
  choice: aos ceifeiros
  rationale: Representa diretamente o particípio de קצר e mantém o cenário agrícola; “ceifeiros” é conciso e compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עִמָּכֶם
  choice: esteja com vocês
  rationale: A oração nominal, literalmente “Yahweh com vocês”, funciona aqui como saudação ou bênção; “esteja” comunica essa força volitiva sem convertê-la em mera afirmação.
- source_word: יְבָרֶכְךָ
  choice: Que Yahweh o abençoe
  rationale: A forma verbal expressa um desejo ou bênção; a construção com “que” é natural em português e preserva a força volitiva.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Força da saudação יְהוָה עִמָּכֶם
  choice: Yahweh esteja com vocês
  alternative: Yahweh está com vocês
  rationale: O contexto de saudação e a resposta paralela favorecem uma bênção ou desejo, embora a oração hebraica sem verbo também possa, isoladamente, ser entendida como declaração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a coordenação narrativa do hebraico, usa “vocês” para o plural e conserva “eis que” para refletir a apresentação vívida de וְהִנֵּה.
