id: RUT.2.12
reference: Ruth 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: pt
  text: Que Yahweh recompense o que você fez, e que seja completa a sua recompensa da parte de Yahweh, o Deus de Israel, sob cujas asas você veio buscar refúgio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob as asas de quem você veio se refugiar”.'
    reason: A construção hebraica permite uma formulação mais literal com “se refugiar”; o texto principal usa “buscar refúgio” para conservar a ideia de finalidade ligada a “veio”.
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: Que ... recompense
  rationale: O piel expressa aqui um desejo ou bênção de Boaz; a construção com “que” comunica naturalmente esse valor volitivo em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פָּעֳלֵךְ
  choice: o que você fez
  rationale: O substantivo pode significar trabalho, ação ou feito. No contexto, a formulação idiomática abrange as ações leais de Rute sem sugerir apenas trabalho remunerado.
- source_word: וּתְהִי
  choice: e que seja
  rationale: Mantém o valor volitivo e o paralelismo da bênção iniciada na primeira oração.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: a sua recompensa
  rationale: O termo admite os sentidos de salário e recompensa; aqui se refere à retribuição divina, para a qual “recompensa” é mais natural.
- source_word: שְׁלֵמָה
  choice: completa
  rationale: Expressa integralidade ou plenitude e preserva a relação semântica com o verbo שׁלם da primeira oração.
- source_word: מֵעִם
  choice: da parte de
  rationale: Indica Yahweh como fonte da recompensa e soa natural em português.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e corrente da construção hebraica.
- source_word: לַחֲסוֹת
  choice: buscar refúgio
  rationale: Preserva tanto a finalidade indicada pelo infinitivo quanto a ideia de procurar proteção.
- source_word: תַּחַת כְּנָפָיו
  choice: sob cujas asas
  rationale: Mantém a metáfora hebraica de proteção e integra a oração relativa com naturalidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Imagem das asas de Deus
  choice: preservar literalmente “sob cujas asas”
  alternative: explicitar como “sob cuja proteção”
  rationale: A metáfora protetora é inteligível em português e deve ser mantida sem reduzir sua riqueza poética e teológica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. O tratamento “você” é adequado ao discurso direto contemporâneo; a metáfora das asas e o paralelismo da bênção foram preservados.
