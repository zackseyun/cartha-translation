  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. 'Ceifeiros' preserva o cenário agrícola e permanece inteligível; 'vinho azedo' conserva a provável referência histórica, enquanto a nota registra a ambiguidade lexical.
