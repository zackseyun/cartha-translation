base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: pt
  text: 'Na hora da refeição, Boaz lhe disse: “Venha cá, coma um pouco de pão e molhe seu pedaço no vinho azedo.[a]” Então ela se sentou ao lado dos ceifeiros, e ele lhe passou grãos torrados. Ela comeu, ficou satisfeita e ainda lhe sobrou comida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no vinagre”. O termo hebraico חֹמֶץ pode designar vinagre ou uma bebida de vinho azedo; neste contexto de refeição no campo, provavelmente se refere ao vinho azedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Na hora da refeição
  rationale: Expressa de modo natural o valor temporal e idiomático da frase hebraica, referente ao momento em que os trabalhadores comiam.
- source_word: גֹּשִׁי הֲלֹם
  choice: Venha cá
  rationale: Reproduz com naturalidade o imperativo feminino seguido do advérbio de lugar, como convite para se aproximar.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: coma um pouco de pão
  rationale: Comunica o sentido partitivo de מִן em português corrente.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: molhe seu pedaço no vinho azedo
  rationale: Mantém פַּת como um pedaço entendido pelo contexto como pão, sem explicitação excessiva. חֹמֶץ pode designar vinagre ou uma bebida de vinho azedo; a opção provável no contexto da refeição dos trabalhadores fica no texto, e a alternativa lexical, em nota.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: ao lado dos ceifeiros
  rationale: Preserva a localização espacial e o cenário agrícola com vocabulário bíblico ainda amplamente compreensível.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: ele lhe passou grãos torrados
  rationale: O verbo raro sugere estender ou entregar a comida; 'passou' é natural no contexto de uma refeição. קָלִי designa cereal tostado, aqui vertido no plural coletivo natural em português.
- source_word: וַתִּשְׂבַּע
  choice: até ficar satisfeita
  rationale: Expressa a saciedade resultante da refeição, preservando a progressão verbal do hebraico.
- source_word: וַתֹּתַר
  choice: ainda guardou o que sobrou
  rationale: A cadeia de verbos femininos mantém Rute como sujeito. A formulação reflete que ela deixou ou conservou parte da comida, sem reduzir o verbo a uma construção impessoal.
