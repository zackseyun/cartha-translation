review_pass:
  verdict: revise
  source_fidelity: A sequência de movimento e atividade é em grande parte preservada, bem como a referência ao acaso aparente, à parcela de Boaz e à família de Elimeleque. Contudo, “começou a recolher” introduz uma noção de início que não está expressa em וַתְּלַקֵּט, e “recolher espigas” é menos preciso que o verbo técnico agrícola “respigar”.
  naturalness: O texto é fluente, mas “aconteceu que ela foi parar” é relativamente coloquial e dilui a construção hebraica que salienta o acaso aparente. “Por acaso, ela chegou” é natural, claro e conserva melhor essa ênfase sem resolver a tensão narrativa.
  terminology: “Ceifeiros”, “Boaz”, “Elimeleque” e “família” são adequados. “Respigou” é o equivalente agrícola direto de לקט e é compreensível no registro bíblico moderno; a nota pode esclarecer o idiomatismo de acaso sem impor uma leitura providencialista.
