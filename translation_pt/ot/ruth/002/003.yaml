revisions:
- from: Assim, ela foi, chegou e começou a recolher espigas no campo, atrás dos ceifeiros. E aconteceu que ela foi parar[a] na parte do campo que pertencia a Boaz, que era da família de Elimeleque.
  to: Assim, ela foi, chegou e respigou no campo, atrás dos ceifeiros. E, por acaso[a], ela chegou à parte do campo que pertencia a Boaz, que era da família de Elimeleque.
  rationale: A revisão elimina o aspecto incoativo não expresso no original, usa “respigou” para o termo agrícola específico e torna explícito, no texto principal, o acaso aparente marcado pela expressão hebraica. Mantêm-se a sequência narrativa, a ambiguidade teológica e os nomes e relações familiares do original.
