  - severity: medium
    issue: “aconteceu que ela foi parar” enfraquece a ênfase no acaso aparente e altera a formulação da chegada.
    rationale: וַיִּקֶר מִקְרֶהָ é uma construção cognata que enfatiza o acontecimento casual do ponto de vista humano. “Por acaso, ela chegou” o comunica com maior transparência e naturalidade.
  revised_text: Assim, ela foi, chegou e respigou no campo, atrás dos ceifeiros. E, por acaso[a], ela chegou à parte do campo que pertencia a Boaz, que era da família de Elimeleque.
