base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: pt
  text: Assim, ela foi, chegou e respigou no campo, atrás dos ceifeiros. E, por acaso[a], ela chegou à parte do campo que pertencia a Boaz, que era da família de Elimeleque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu acaso aconteceu” — expressão idiomática que apresenta o fato como acaso do ponto de vista humano; a narrativa mais ampla do livro também convida o leitor a perceber a providência em ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא וַתְּלַקֵּט
  choice: ela foi, chegou e começou a recolher espigas
  rationale: Preserva a sequência narrativa vívida dos três verbos hebraicos. “Recolher espigas” comunica de modo acessível a respiga agrícola indicada por לקט; “começou a” torna natural em português o encadeamento com a atividade no campo.
- source_word: בַּשָּׂדֶה אַחֲרֵי הַקֹּצְרִים
  choice: no campo, atrás dos ceifeiros
  rationale: 'O artigo hebraico é mantido em “no campo”, e אַחֲרֵי tem sentido espacial neste contexto: Rute recolhia o que restava atrás dos trabalhadores que ceifavam.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: E aconteceu que ela foi parar
  rationale: Expressão portuguesa natural para a construção cognata hebraica, apresentando a chegada como acaso aparente sem explicitar nem negar a providência sugerida pela narrativa mais ampla.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: na parte do campo que pertencia a Boaz
  rationale: חֶלְקָה designa uma parcela ou parte de terra, e o לְ marca aqui posse ou associação. A formulação é clara sem empregar terminologia fundiária técnica.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: que era da família de Elimeleque
  rationale: מִשְׁפָּחָה pode indicar família ou clã. “Família” é abrangente, corrente e adequado ao registro narrativo.
theological_decisions:
- issue: Acaso aparente e providência na narrativa
  choice: 'Manter no texto principal uma expressão comum de acontecimento fortuito: “aconteceu que ela foi parar”.'
  alternative: Explicitar que Deus a conduziu até o campo de Boaz, ou traduzir literalmente “seu acaso aconteceu”.
  rationale: O hebraico descreve o evento no plano da experiência humana como aparente acaso, enquanto o conjunto do livro convida a perceber a providência. A tradução preserva essa tensão sem impor uma explicação teológica no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Ceifeiros” preserva a precisão agrícola e o tom bíblico sem arcaísmo excessivo; “recolher espigas” esclarece a prática da respiga para leitores comuns.
