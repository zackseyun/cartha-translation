base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: pt
  text: Além disso, tirem de propósito algumas espigas dos feixes[a] para ela e deixem-nas ali, para que as recolha[b]. E não a repreendam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos molhos”. O termo hebraico se refere a porções ou agrupamentos de hastes já reunidas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que respigue”. O verbo hebraico é o termo habitual para recolher o que sobra no campo depois da colheita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Preserva a ligação com a ordem anterior e a força aditiva da expressão hebraica.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: tirem de propósito
  rationale: 'A construção intensiva indica uma ação deliberada: os trabalhadores devem retirar cereal já reunido, e não apenas deixar que caia por acaso.'
- source_word: לָהּ
  choice: para ela
  rationale: 'A preposição indica benefício: as espigas são retiradas em favor de Rute.'
- source_word: מִן הַצְּבָתִים
  choice: algumas espigas dos feixes
  rationale: O termo hebraico designa porções ou agrupamentos de hastes já reunidas. “Feixes” é claro no contexto da colheita; “algumas espigas” explicita naturalmente o objeto implícito do verbo.
- source_word: וַעֲזַבְתֶּם
  choice: e deixem-nas ali
  rationale: Expressa a ordem de deixar no chão as espigas retiradas para que Rute possa recolhê-las.
- source_word: וְלִקְּטָה
  choice: para que as recolha
  rationale: O verbo é o termo habitual para recolher o que resta no campo depois da colheita. A formulação mantém o sentido no contexto sem exigir vocabulário técnico.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: E não a repreendam
  rationale: גער indica repreensão ou censura enérgica; “repreendam” conserva essa força em português digno e corrente.
