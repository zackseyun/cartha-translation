base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: pt
  text: 'Sua sogra lhe perguntou: “Onde você recolheu espigas hoje? Onde trabalhou? Bendito seja aquele que deu atenção a você!” Então Rute contou à sogra o que havia feito com ele[a] e disse: “O homem com quem trabalhei hoje se chama Boaz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, o hebraico diz “o que havia feito com ele” e, em seguida, “o homem com quem fiz hoje”. No contexto do trabalho no campo, essas expressões se referem ao trabalho que Rute realizou com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: sua sogra / à sogra
  rationale: É o termo comum de parentesco no contexto e a forma mais natural em português moderno.
- source_word: אֵיפֹה ... וְאָנָה
  choice: Onde ...? Onde ...?
  rationale: Os dois interrogativos de lugar formam perguntas paralelas; a repetição de “onde” é clara e natural em português.
- source_word: לִקַּטְתְּ
  choice: recolheu espigas
  rationale: O verbo designa a coleta do cereal deixado para trás durante a colheita. “Recolheu espigas” comunica essa atividade de modo mais acessível do que o termo técnico “respigou”.
- source_word: עָשִׂית
  choice: trabalhou
  rationale: Embora o verbo tenha o sentido amplo de “fazer”, o contexto agrícola indica o trabalho realizado no campo.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Bendito seja aquele que deu atenção a você
  rationale: A expressão abençoa quem reconheceu ou notou Rute de maneira favorável. “Deu atenção” transmite essa consideração sem acrescentar a ideia específica de benefício material.
- source_word: וַתַּגֵּד
  choice: Então Rute contou
  rationale: “Contou” é natural para o verbo narrativo de informar. O nome “Rute” explicita o sujeito em português e evita ambiguidade entre as duas mulheres.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: com quem havia trabalhado
  rationale: A formulação hebraica é literalmente “o que havia feito com ele”; no contexto, refere-se ao trabalho no campo sob a responsabilidade do homem mencionado.
- source_word: שֵׁם הָאִישׁ אֲשֶׁר עָשִׂיתִי עִמּוֹ הַיּוֹם בֹּעַז
  choice: O homem com quem trabalhei hoje se chama Boaz
  rationale: A construção idiomática portuguesa comunica com clareza a identificação do homem, preservando o vínculo entre ele e o trabalho daquele dia.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida do nome próprio.
