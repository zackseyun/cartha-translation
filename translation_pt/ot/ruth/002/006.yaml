base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: pt
  text: 'Então o jovem encarregado dos ceifeiros respondeu: “Ela é uma jovem moabita que voltou com Noemi dos campos de Moabe[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do campo de Moabe”; o singular hebraico pode ser entendido coletivamente, referindo-se às terras agrícolas de Moabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: respondeu
  rationale: A combinação hebraica literalmente une ‘respondeu’ e ‘disse’; em português atual, ‘respondeu’ expressa naturalmente a fórmula narrativa sem redundância pesada.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar um jovem ou servo. Como a oração seguinte explicita sua função, ‘o jovem’ preserva o sentido lexical sem inserir ‘capataz’ no substantivo.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: encarregado dos ceifeiros
  rationale: A construção indica que ele ocupava uma posição de supervisão sobre os trabalhadores; esta formulação é clara e natural, sem especificar um cargo não nomeado no hebraico.
- source_word: הַקּוֹצְרִים
  choice: os ceifeiros
  rationale: O particípio substantivado de קצר designa os que ceifam cereal. ‘Ceifeiros’ é direto, digno e adequado ao contexto agrícola.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: a jovem moabita
  rationale: נַעֲרָה indica uma jovem, enquanto מוֹאֲבִיָּה identifica sua origem étnica. A expressão é concisa e natural em português.
- source_word: הִיא
  choice: Ela é
  rationale: O pronome independente introduz uma identificação enfática e é representado diretamente.
- source_word: הַשָּׁבָה
  choice: que voltou
  rationale: O particípio de שוב significa voltar ou retornar; ‘voltou’ é corrente e preserva o motivo narrativo do regresso com Noemi.
- source_word: עִם נָעֳמִי
  choice: com Noemi
  rationale: Traduz de modo direto a relação de acompanhamento.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: dos campos de Moabe
  rationale: O singular שְׂדֵה pode ter sentido coletivo ou regional, referindo-se às terras agrícolas de Moabe; o plural comunica isso naturalmente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica ‘respondeu e disse’ foi vertida apenas como ‘respondeu’ por naturalidade, enquanto a função supervisora do jovem foi mantida sem lhe atribuir um título específico.
