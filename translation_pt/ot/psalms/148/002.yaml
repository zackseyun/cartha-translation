  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: pt
  text: Louvem-no, todos os seus anjos; louvem-no, todas as suas hostes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus exércitos”. O hebraico pode referir-se às hostes ou forças celestiais de Deus.
    reason: Alternativa lexical para צְבָאוֹ; a nota registra a possível referência celestial fornecida pelo contexto sem a impor como qualificação explícita no texto principal.
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל, com sufixo de terceira pessoa masculina singular, dirige uma ordem coletiva aos seres celestiais. “Louvem-no” é natural em português moderno e preserva a força imperativa.
- source_word: כָל
  choice: todos
  rationale: Expressa a totalidade de cada grupo convocado e concorda naturalmente com os substantivos plurais.
- source_word: מַלְאָכָיו
  choice: seus anjos
  rationale: Neste contexto de louvor celestial, מַלְאָכִים designa seres celestiais, não mensageiros humanos; “anjos” é a tradução corrente e precisa.
- source_word: צְבָאוֹ
  choice: seus exércitos celestiais
  rationale: צָבָא pode significar exército, hoste ou conjunto organizado. Em paralelo com “seus anjos” e no contexto cósmico do salmo, “exércitos celestiais” torna claro o referente sem eliminar a imagem coletiva e militar do hebraico.
theological_decisions:
- issue: Referente dos sufixos pronominais (“-no”, “seus”)
  choice: Os pronomes se referem a Deus, o SENHOR, convocado como objeto do louvor ao longo do salmo.
  alternative: Não explicitar o antecedente dentro deste versículo isolado.
  rationale: O versículo 1 estabelece o SENHOR como aquele a quem se dirige o louvor, e o versículo 2 continua essa convocação. A tradução mantém os pronomes do hebraico sem acrescentar desenvolvimento doutrinário.
- issue: Identidade de צְבָאוֹ
  choice: Conjunto das forças ou seres celestiais pertencentes a Deus.
  alternative: “suas hostes” ou “seus exércitos”, com possível sentido mais amplo ou militar.
  rationale: O paralelismo com “anjos” favorece um referente celestial, mas o termo hebraico conserva amplitude semântica; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “Louvem-no” preserva o paralelismo poético hebraico. “Exércitos celestiais” evita o caráter arcaico de “hostes” no texto principal, enquanto a nota conserva essa opção tradicional e a ambiguidade lexical.
