lexical_decisions:
- source_word: הֶהָרִים
  choice: as montanhas
  rationale: הָרִים designa montanhas. O artigo hebraico foi preservado, e “montanhas” mantém o contraste topográfico com “colinas”.
- source_word: וְכָל גְּבָעוֹת
  choice: e todas as colinas
  rationale: כָּל com o plural tem sentido abrangente, e גְּבָעוֹת se refere a elevações menores que montanhas; a formulação é natural em português.
- source_word: עֵץ פְּרִי
  choice: árvores frutíferas
  rationale: A construção significa literalmente “árvore de fruto” e é empregada coletivamente. O plural “árvores frutíferas” comunica de modo idiomático a categoria inteira.
- source_word: וְכָל אֲרָזִים
  choice: e todos os cedros
  rationale: אֲרָזִים designa cedros; “todos os cedros” preserva o valor abrangente de כָּל e a concisão poética.
