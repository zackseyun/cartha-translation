lexical_decisions:
- source_word: הַחַיָּה
  choice: animais selvagens
  rationale: חַיָּה designa aqui os animais selvagens, em contraste com בְּהֵמָה, que se refere aos domesticados.
- source_word: וְכָל בְּהֵמָה
  choice: e todos os animais domésticos
  rationale: A expressão preserva כָּל, “todos”, e comunica de modo claro a categoria dos animais domesticados sem restringi-la apenas ao gado.
- source_word: רֶמֶשׂ
  choice: animais que rastejam
  rationale: רֶמֶשׂ abrange criaturas pequenas que se movem rente ao chão; esta formulação é natural em português e evita uma classificação zoológica excessivamente específica.
- source_word: וְצִפּוֹר כָּנָף
  choice: e aves aladas
  rationale: A expressão hebraica é literalmente próxima de “ave de asa”; “aves aladas” conserva essa imagem de forma concisa e digna.
