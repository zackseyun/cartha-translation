  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: pt
  text: Da terra, louvem Yahweh, monstros marinhos[a] e todas as profundezas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criaturas marinhas”, “dragões” ou “serpentes”. O hebraico tanninim pode designar grandes criaturas serpentiformes ou monstruosas, muitas vezes associadas ao mar.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os abismos”. O hebraico evoca as águas profundas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְל֣וּ
  choice: Louvem
  rationale: Imperativo plural de הלל; “Louvem” expressa de modo natural e direto a convocação coletiva do salmo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִן הָאָרֶץ
  choice: desde a terra
  rationale: No quadro cósmico do Salmo 148, אֶרֶץ designa o domínio terrestre em contraste com os céus; “desde” preserva a ideia da origem espacial do louvor.
- source_word: תַּנִּינִים
  choice: monstros marinhos
  rationale: O plural pode designar criaturas grandes, serpentiformes ou monstruosas, especialmente ligadas às águas. A expressão preserva melhor a força lexical do hebraico do que o termo genérico “criaturas marinhas”, sem afirmar que se trate de seres mitológicos.
- source_word: תְּהֹמוֹת
  choice: profundezas
  rationale: O plural de תהום evoca as águas profundas ou abissais. “Profundezas” conserva a imagem poética e a possibilidade de referência às massas de águas profundas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Possíveis associações míticas de תַּנִּינִים
  choice: monstros marinhos
  alternative: criaturas marinhas; dragões; serpentes
  rationale: A escolha conserva a amplitude e a intensidade da palavra hebraica sem transformar a linguagem poética em uma afirmação doutrinária sobre seres mitológicos.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. “Louvem” mantém a convocação no plural; “desde a terra” marca o contraste cósmico com os céus. Os marcadores aparecem junto aos termos a que se referem.
