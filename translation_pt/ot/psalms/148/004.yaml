  language: en
  yaml_path: translation/ot/psalms/148/004.yaml
  text: Praise him[a], highest heavens[c][b], and waters above the heavens.
translation:
  language: pt
  text: Louvem-no, céus mais altos,[a] e águas que estão acima dos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “céus dos céus”, expressão hebraica que indica os céus mais altos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo masculino plural de הלל, com sufixo de terceira pessoa masculina singular, convoca vários destinatários a louvar a Deus. “Louvem-no” é direto, natural e preserva tanto o plural quanto o objeto pronominal.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: céus mais altos
  rationale: A construção literalmente “céus dos céus” tem valor intensivo ou superlativo. “Céus mais altos” comunica esse sentido em português atual, enquanto a forma literal é registrada em nota.
- source_word: וְהַמַּיִם
  choice: e águas
  rationale: Embora o hebraico use o artigo, o substantivo funciona como segundo destinatário coordenado do imperativo. A ausência do artigo em português deixa clara a leitura vocativa sem acrescentar um pronome inexistente no texto.
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: que estão acima dos céus
  rationale: A oração relativa é explicitada de modo natural em português e mantém o sentido espacial de מֵעַל, sem reinterpretar a cosmologia do salmo.
theological_decisions:
- issue: A linguagem cosmológica das águas acima dos céus
  choice: Manter a imagem antiga tal como aparece no texto
  alternative: Interpretar as águas como metáfora ou modernizá-las como água atmosférica
  rationale: O salmo convoca poeticamente toda a criação, inclusive as águas acima dos céus. A tradução preserva essa imagem sem harmonizá-la com categorias científicas posteriores nem impor uma interpretação metafórica.
- issue: Função sintática de “céus” e “águas”
  choice: Tratá-los como destinatários coordenados do imperativo
  alternative: Ler “as águas” apenas como objeto descrito, sem endereço direto
  rationale: O imperativo plural governa a sequência e sustenta a leitura de ambos os elementos como vocativos, sem necessidade de inserir “vocês” no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a convocação direta aos elementos da criação, evitando tanto literalismo obscuro no corpo do versículo quanto expansão explicativa excessiva.
