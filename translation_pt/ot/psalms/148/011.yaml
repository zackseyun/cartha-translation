  yaml_path: translation/ot/psalms/148/011.yaml
  text: kings of the earth and all peoples[a], princes and all judges of the earth[b],
translation:
  language: pt
  text: reis da terra e todos os povos[a], príncipes e todos os juízes da terra[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do país”, caso se entenda a expressão em sentido mais local; aqui, o contexto mais amplo favorece o sentido universal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: reis da terra
  rationale: O plural em estado construto inicia mais um grupo na enumeração poética; em português, a formulação sem artigo é natural neste catálogo.
- source_word: וְכָל לְאֻמִּים
  choice: e todos os povos
  rationale: Preserva a abrangência de כָל e traduz לְאֻמִּים por um termo coletivo que não se limita aos Estados nacionais modernos.
- source_word: שָׂרִים
  choice: príncipes
  rationale: Expressa autoridades de alta posição e mantém o registro elevado do poema, sem exigir em todos os casos descendência real.
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: e todos os juízes da terra
  rationale: Traduz diretamente o substantivo participial שֹׁפְטֵי e conserva o paralelismo entre diferentes classes de governantes.
- source_word: אֶרֶץ / אָרֶץ
  choice: terra
  rationale: O contexto cósmico e universal do Salmo 148 favorece 'terra' em vez do sentido mais local 'país' ou 'terra' enquanto território.
theological_decisions:
- issue: Alcance de אֶרֶץ no catálogo de louvor
  choice: terra, em sentido universal
  alternative: país ou território, em sentido local
  rationale: O salmo convoca toda a criação ao louvor; por isso, o sentido global é contextualmente mais provável, embora o substantivo hebraico também admita uso local.
translation_notes:
  register: Português moderno, claro e solene, com estrutura de enumeração poética. 'Povos' evita a associação exclusiva com Estados modernos; 'príncipes' preserva o tom elevado do hebraico.
