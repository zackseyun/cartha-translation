source:
  edition: WLC
  text: וַ/יַּעֲמִידֵ֣/ם לָ/עַ֣ד לְ/עוֹלָ֑ם חָק נָ֝תַ֗ן וְ/לֹ֣א יַעֲבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: pt
  text: Ele os estabeleceu para todo o sempre; deu um decreto[a], e este não passará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu-lhes um limite que eles não ultrapassarão”; ou: “deu um decreto que ninguém ultrapassará”. A oração final é ambígua em hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: Ele os estabeleceu
  rationale: 'O hifil de עמד, com sufixo masculino plural, tem sentido causativo: Deus fez com que permanecessem, isto é, os estabeleceu. A formulação é natural e adequada ao contexto da estabilidade da criação.'
- source_word: לָעַד לְעוֹלָם
  choice: para todo o sempre
  rationale: A combinação intensifica a duração permanente. A expressão portuguesa preserva essa ênfase de modo corrente e digno.
- source_word: חָק
  choice: um decreto
  rationale: חק pode indicar decreto, estatuto, limite prescrito ou ordem fixa. “Decreto” comunica aqui a ordem estabelecida por Deus sem restringir indevidamente o campo semântico.
- source_word: נָתַן
  choice: deu
  rationale: Mantém o sentido básico de נתן e reproduz de perto a construção hebraica “deu um decreto”.
- source_word: וְלֹא יַעֲבוֹר
  choice: e este não passará
  rationale: עבר pode significar passar, ultrapassar ou transgredir. O pronome demonstrativo explicita em português a leitura na qual o decreto é o sujeito, sem ocultar em nota a ambiguidade sintática do hebraico.
theological_decisions:
- issue: Sujeito e sentido de וְלֹא יַעֲבוֹר
  choice: 'O decreto é entendido como sujeito: “este não passará”.'
  alternative: “eles não o ultrapassarão” ou “ninguém o ultrapassará”.
  rationale: O verbo hebraico está no singular e não há objeto expresso, permitindo mais de uma análise. A leitura principal ressalta a permanência da ordem divina; a nota conserva as outras leituras legítimas, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Para todo o sempre” preserva a intensificação poética; “este” evita uma referência pronominal pouco clara, enquanto a nota registra as demais leituras possíveis.
