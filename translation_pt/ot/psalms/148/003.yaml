base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: pt
  text: Louvem-no, sol e lua; louvem-no, todas as estrelas luminosas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «estrelas de luz».
    reason: Registra a construção nominal hebraica por trás da formulação portuguesa mais natural.
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louvem-no
  rationale: O imperativo plural de הלל com sufixo masculino singular dirige-se aos corpos celestes e manda que louvem a Deus. A repetição preserva o paralelismo poético.
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: sol e lua
  rationale: Equivalência lexical direta e natural em português, mantendo a conjunção hebraica.
- source_word: כָּל
  choice: todas
  rationale: O quantificador abrange coletivamente a totalidade das estrelas e concorda com o substantivo feminino plural em português.
- source_word: כּוֹכְבֵי אוֹר
  choice: estrelas luminosas
  rationale: A expressão hebraica é literalmente «estrelas de luz». «Estrelas luminosas» comunica de modo natural a mesma qualidade sem perder a imagem poética; a forma literal é registrada em nota.
theological_decisions:
- issue: Personificação dos corpos celestes no louvor
  choice: Manter a convocação direta ao sol, à lua e às estrelas para que louvem a Deus.
  alternative: Transformar a convocação em uma afirmação explicativa de que a criação manifesta o louvor de Deus.
  rationale: O hebraico emprega imperativos na segunda pessoa do plural. Preservá-los mantém a personificação poética e a visão do salmo de toda a criação convocada ao louvor, sem acrescentar uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de «Louvem-no» conserva o ritmo e o paralelismo do verso.
