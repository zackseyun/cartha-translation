source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: pt
  text: Louvem o nome de Yahweh, pois somente o seu nome é exaltado; sua majestade[a] está acima da terra e do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu esplendor” ou “sua glória”.
    reason: Alternativas lexicais legítimas para הוֹדוֹ.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Louvem
  rationale: O imperfeito na terceira pessoa do plural tem aqui força exortativa, dando continuidade aos convites ao louvor no salmo. “Louvem” expressa essa força de modo natural em português.
- source_word: שֵׁם
  choice: nome
  rationale: Mantém a expressão hebraica concreta e teologicamente significativa, que pode envolver também a identidade revelada e a reputação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a convocação ao louvor e preserva de forma concisa a relação lógica do hebraico.
- source_word: נִשְׂגָּב
  choice: é exaltado
  rationale: Comunica o sentido estativo de estar elevado ou sublime, apropriado ao contexto de louvor.
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: somente o seu nome
  rationale: Preserva tanto a ênfase exclusiva de לְבַדּוֹ quanto o foco explícito do hebraico no “nome”.
- source_word: הוֹדוֹ
  choice: sua majestade
  rationale: הוֹד designa esplendor, glória ou majestade. “Majestade” transmite aqui a grandeza régia em linguagem clara e digna.
- source_word: עַל
  choice: está acima de
  rationale: Expressa a ideia poética de elevação e superioridade; o verbo “está” é suprido para formar uma oração natural em português.
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: a terra e o céu
  rationale: Conserva a ordem hebraica e a dupla expressão que abrange a criação, com o singular coletivo “céu” natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal revelado no hebraico, sem substituí-lo por um título.
- issue: Referente da exclusividade em שְׁמוֹ לְבַדּוֹ
  choice: somente o seu nome
  alternative: somente ele
  rationale: Embora “somente ele” pudesse transmitir uma ideia teologicamente próxima, o hebraico atribui explicitamente a exclusividade ao nome; por isso, essa forma foi preservada.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A sintaxe mantém o paralelismo poético sem soar artificial; o marcador da nota foi colocado após “majestade”, termo ao qual a nota lexical se refere.
