  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: pt
  text: Ele ergueu um chifre para seu povo[a] — um louvor para todos os seus fiéis, para os filhos de Israel[b], o povo que lhe é próximo. Louvem Yah![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chifre” é uma metáfora hebraica de força, honra ou poder exaltado. A sintaxe concisa permite entender “um louvor” como aposto a “chifre” ou como resultado de ele ter erguido o chifre para seu povo.
    reason: cultural_note_and_alternative_reading
  - marker: b
    text: Ou “descendentes de Israel”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: “Louvem Yah” é o sentido da expressão litúrgica “Aleluia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: ergueu
  rationale: O verbo רום significa levantar ou exaltar. O perfeito narrativo celebra aqui o que Deus fez; “ergueu” preserva tanto o aspecto concluído quanto a imagem vertical.
- source_word: קֶרֶן
  choice: um chifre
  rationale: קֶרֶן significa literalmente “chifre” e funciona como metáfora hebraica de força, honra ou poder exaltado. A imagem poética foi mantida no texto e esclarecida em nota.
- source_word: לְעַמּוֹ
  choice: para o seu povo
  rationale: עַם designa o povo em sentido coletivo e relacional; o sufixo possessivo foi expresso diretamente.
- source_word: תְּהִלָּה
  choice: motivo de louvor
  rationale: O substantivo significa “louvor”. A formulação “motivo de louvor” exprime de modo natural em português sua provável relação apositiva ou resultativa com o ato de erguer o chifre, sem ocultar em nota a concisão sintática do hebraico.
- source_word: לְכָל חֲסִידָיו
  choice: para todos os seus fiéis
  rationale: חֲסִידִים refere-se aos que demonstram fidelidade ou lealdade pactual. “Fiéis” é atual e evita conotações eclesiásticas posteriores que “santos” poderia sugerir.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: A tradução conserva a forma masculina plural בְּנֵי e a designação coletiva tradicional, sem a substituir interpretativamente por “povo” ou “descendentes”.
- source_word: עַם קְרֹבוֹ
  choice: o povo que lhe é próximo
  rationale: קָרוֹב expressa proximidade com Deus, provavelmente relacional e pactual. A tradução mantém a imagem de proximidade sem a converter em conceitos como “escolhido” ou “amado”.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: A expressão reúne um imperativo plural e a forma abreviada do nome divino. A tradução explicita o sentido e preserva “Yah”, em vez de substituir a expressão por “Senhor” ou apenas transliterar “Aleluia”.
theological_decisions:
- issue: Sentido metafórico de קֶרֶן
  choice: um chifre
  alternative: força; poder
  rationale: A imagem poética hebraica foi preservada, pois resolvê-la no texto como “força” ou “poder” eliminaria sua amplitude simbólica.
- issue: Relação sintática de תְּהִלָּה com a oração anterior
  choice: motivo de louvor para todos os seus fiéis
  alternative: um louvor para todos os seus fiéis; aposto ao “chifre”
  rationale: O hebraico é comprimido e admite relação apositiva ou resultativa. A leitura resultativa produz português claro, enquanto a nota conserva a alternativa genuína.
- issue: Forma masculina em בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel; povo de Israel
  rationale: A forma do hebraico foi mantida como designação coletiva, sem neutralização desnecessária.
- issue: Forma divina abreviada יָהּ
  choice: Yah
  alternative: Senhor; Aleluia
  rationale: A forma curta do nome divino foi representada diretamente, preservando a distinção textual e explicando sua presença na expressão litúrgica tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O travessão ajuda a indicar a relação explicativa ou resultativa de “motivo de louvor” sem apresentar como certa uma análise sintática exclusiva. A metáfora “chifre” e o nome curto “Yah” foram preservados por fidelidade à forma poética e litúrgica do hebraico.
