  text: בַּחוּרִ֥ים וְ/גַם בְּתוּל֑וֹת זְ֝קֵנִ֗ים עִם נְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/012.yaml
  text: young men[a], and also young women[b], old men along with youths.
translation:
  language: pt
  text: rapazes e também moças[a], homens idosos junto com meninos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “virgens”. O hebraico בְּתוּלוֹת pode designar mais especificamente moças solteiras e virgens; aqui, “moças” se encaixa na enumeração poética de grupos por idade e sexo.
    reason: lexical_alternative
  - marker: b
    text: Ou “jovens”. O hebraico נְעָרִים é um termo amplo para pessoas mais novas do sexo masculino e pode também se referir a rapazes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: rapazes
  rationale: O substantivo designa jovens do sexo masculino, muitas vezes em idade de vigor. “Rapazes” é natural em português e mantém a referência masculina.
- source_word: וְגַם
  choice: e também
  rationale: A combinação da conjunção com o advérbio tem sentido aditivo enfático, preservado por “e também”.
- source_word: בְּתוּלוֹת
  choice: moças
  rationale: Embora o termo possa indicar especificamente jovens virgens e solteiras, nesta enumeração poética ele identifica naturalmente o grupo das jovens do sexo feminino. “Moças” é claro e idiomático, e a nuance mais específica fica registrada em nota.
- source_word: זְקֵנִים
  choice: homens idosos
  rationale: No paralelismo entre grupos de sexo e idade, o termo se refere mais naturalmente a homens de idade avançada, não a pessoas que ocupam o cargo de ancião.
- source_word: עִם
  choice: junto com
  rationale: A preposição expressa associação ou acompanhamento e liga naturalmente os dois grupos etários.
- source_word: נְעָרִים
  choice: meninos
  rationale: O termo pode abranger meninos e jovens do sexo masculino. “Meninos” distingue este grupo dos rapazes mencionados no início do verso, sem eliminar a amplitude lexical, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A forma concisa preserva a estrutura poética de enumeração e distingue os grupos masculinos por faixa etária.
