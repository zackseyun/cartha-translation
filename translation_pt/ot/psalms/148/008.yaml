  text: fire and hail[a], snow and vapor, stormy wind doing his word[c][b],
translation:
  language: pt
  text: fogo e granizo, neve e vapor[a], vento de tempestade que cumpre a sua palavra[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fumaça” ou “névoa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vento de tempestade que executa a sua ordem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: fogo
  rationale: Equivalente direto e natural do substantivo hebraico nesta enumeração de elementos da criação.
- source_word: וּבָרָד
  choice: e granizo
  rationale: בָּרָד designa granizo; a conjunção prefixada é representada por “e”.
- source_word: שֶׁלֶג
  choice: neve
  rationale: Equivalente comum e preciso no contexto meteorológico.
- source_word: וְקִיטוֹר
  choice: e vapor
  rationale: קִיטוֹר pode indicar vapor, fumaça ou névoa. “Vapor” mantém um sentido atmosférico amplo sem pressupor combustão.
- source_word: רוּחַ סְעָרָה
  choice: vento de tempestade
  rationale: Preserva os dois componentes da expressão hebraica e soa natural em português.
- source_word: עֹשָׂה
  choice: que cumpre
  rationale: O particípio descreve o vento realizando continuamente aquilo que Deus declarou. “Cumpre” comunica a função da expressão sem o literalismo pouco natural “faz a sua palavra”.
- source_word: דְבָרוֹ
  choice: a sua palavra
  rationale: Mantém o sentido lexical amplo de דָּבָר e evita restringi-lo silenciosamente a “ordem”; a leitura funcional é indicada em nota.
theological_decisions:
- issue: Referente do sufixo masculino singular em דְבָרוֹ
  choice: “sua palavra”, referindo-se a Deus
  alternative: “palavra dele”
  rationale: No contexto do salmo, os elementos criados são convocados a louvar o Senhor e o vento executa o que ele declara. O pronome permanece em minúscula, pois a capitalização de pronomes divinos não é exigida pelo hebraico.
- issue: Sentido de דָּבָר na relação entre o vento e Deus
  choice: “palavra” no texto, com “ordem” em nota
  alternative: “ordem” no texto principal
  rationale: “Palavra” preserva a amplitude lexical e a formulação poética; “ordem” explicita adequadamente o sentido contextual sem eliminar a tensão lexical do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração concisa e o paralelismo poético foram preservados. A pontuação final com ponto e vírgula pressupõe a continuidade sintática da lista no versículo seguinte.
