  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: pt
  text: Louvem Yah![a] Louvem Yahweh dos céus; louvem-no nas alturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Hallelu-Yah, literalmente “Louvem Yah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louvem
  rationale: Imperativo plural do piel de הלל. “Louvem” comunica de modo direto, atual e natural a convocação dirigida a uma pluralidade de ouvintes.
- source_word: יָהּ
  choice: Yah
  rationale: Forma poética abreviada do nome divino. A transliteração preserva sua distinção em relação a יְהוָה e torna reconhecível a expressão hebraica Hallelu-Yah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome divino expresso pelo Tetragrama e preserva a distinção lexical entre a forma breve יָהּ e a forma plena יְהוָה presentes no mesmo versículo.
- source_word: מִן הַשָּׁמַיִם
  choice: desde os céus
  rationale: Mantém a preposição de origem מִן e o plural “céus”. “Desde” deixa claro que a convocação parte desse âmbito, em paralelo com “nas alturas”.
- source_word: הַלְלוּהוּ
  choice: louvem-no
  rationale: Reproduz tanto o imperativo plural quanto o sufixo pronominal masculino singular, retomando Yahweh sem repetição desnecessária.
- source_word: בַּמְּרוֹמִים
  choice: nas alturas
  rationale: Expressa de forma concisa e idiomática os lugares elevados designados por מְרוֹמִים, sem especificá-los indevidamente como “os mais altos céus”.
theological_decisions:
- issue: Distinção entre os nomes divinos יָהּ e יְהוָה no mesmo versículo
  choice: Verter יָהּ como “Yah” e יְהוָה como “Yahweh”
  alternative: Verter um ou ambos por “SENHOR”
  rationale: O hebraico emprega deliberadamente a forma breve e a forma plena. Preservar ambas mantém a distinção textual e evita substituir o nome divino por um título.
translation_notes:
  register: Português moderno, claro e digno, com o imperativo plural “louvem” em vez do mais arcaizante “louvai”. A colocação pronominal em “louvem-no” mantém naturalidade e precisão. O marcador da nota foi posto junto à expressão que ela explica.
