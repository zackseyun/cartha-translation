source:
  edition: WLC
  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: pt
  text: Louvem o nome de Yahweh[a], pois ele ordenou, e foram criados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “SENHOR”; alternativamente, “Yahweh”.'
    reason: Registra a forma hebraica do nome divino e a principal tradição alternativa de tradução.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Louvem
  rationale: O piel imperfeito com força jussiva funciona como exortação dirigida aos seres e elementos celestes mencionados no contexto. “Louvem” expressa isso de modo natural e conciso em português.
- source_word: אֶת שֵׁם
  choice: o nome de
  rationale: Preserva a expressão bíblica de louvar o nome, abrangendo a identidade revelada e a reputação de Deus sem parafraseá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e poeticamente concisa a razão para a convocação ao louvor.
- source_word: הוּא
  choice: ele
  rationale: Representa o pronome hebraico explícito, cujo referente é Yahweh, sem acrescentar uma ênfase reflexiva ausente do texto.
- source_word: צִוָּה
  choice: ordenou
  rationale: Equivale diretamente ao verbo que denota emitir uma ordem e mantém sua relação causal com a criação.
- source_word: וְנִבְרָאוּ
  choice: e foram criados
  rationale: Reproduz a forma passiva plural do nifal de ברא e preserva o motivo da criação. O sujeito continua sendo os seres e elementos convocados nos versos anteriores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal no texto, enquanto a nota registra tanto a forma hebraica quanto a tradução tradicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O imperativo plural retoma os seres e elementos celestes dos versos anteriores; por isso, a forma masculina plural “criados” é adequada ao referente contextual misto. A coordenação “ordenou, e foram criados” preserva a concisão e a sequência do hebraico.
