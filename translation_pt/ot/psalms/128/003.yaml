  text: אֶשְׁתְּ/ךָ֤ כְּ/גֶ֥פֶן פֹּרִיָּה֮ בְּ/יַרְכְּתֵ֪י בֵ֫יתֶ֥/ךָ בָּ֭נֶי/ךָ כִּ/שְׁתִלֵ֣י זֵיתִ֑ים סָ֝בִ֗יב לְ/שֻׁלְחָנֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: pt
  text: Sua esposa será como uma videira frutífera nos recantos de sua casa[a]; seus filhos[b] serão como brotos de oliveira ao redor de sua mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas partes mais interiores de sua casa”.
    reason: alternativa lexical para a expressão espacial hebraica
  - marker: b
    text: O termo hebraico significa literalmente “filhos” no masculino, mas pode representar a descendência em geral neste contexto.
    reason: possível abrangência representativa do masculino plural
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: sua esposa
  rationale: O substantivo com sufixo possessivo designa naturalmente a esposa no contexto familiar; “mulher” seria lexicalmente possível, mas menos preciso aqui.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: como uma videira frutífera
  rationale: Preserva a comparação explícita, a imagem agrícola e a ideia de fecundidade e bênção.
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: nos recantos de sua casa
  rationale: יַרְכְּתֵי indica partes afastadas, interiores ou recônditas; “recantos” conserva essa nuance espacial sem produzir uma formulação artificial.
- source_word: בָּנֶיךָ
  choice: seus filhos
  rationale: O hebraico emprega o plural masculino de “filho”. Em português, “filhos” mantém a forma masculina do texto e também pode funcionar contextualmente como termo coletivo para a prole.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: como brotos de oliveira
  rationale: שְׁתִלֵי descreve plantas novas ou mudas plantadas; “brotos” comunica juventude e crescimento dentro da metáfora familiar.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: ao redor de sua mesa
  rationale: Tradução direta e idiomática da disposição espacial da família em torno da mesa.
theological_decisions:
- issue: Termo masculino para a descendência
  choice: seus filhos
  alternative: seus filhos e filhas / suas crianças
  rationale: A tradução mantém a marca masculina de בָּנֶיךָ sem excluir silenciosamente a possibilidade contextual de que os descendentes em geral estejam representados pela expressão.
- issue: Valor temporal da frase nominal
  choice: será
  alternative: é
  rationale: Embora as duas comparações sejam frases nominais em hebraico, o futuro expressa naturalmente em português a promessa de bênção desenvolvida no contexto, sem transformar a imagem em uma afirmação atemporal rígida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Videira frutífera”, “recantos” e “brotos de oliveira” preservam as imagens concretas e o paralelismo poético do hebraico.
