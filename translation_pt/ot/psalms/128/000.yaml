  text: Cântico das Subidas. Feliz é todo aquele que teme Yahweh[a] e anda em seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado todo aquele que teme o SENHOR”. O hebraico אַשְׁרֵי pode indicar um estado de felicidade, florescimento ou bênção.'
