lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Tradução formal e natural do título; preserva a referência às subidas sem especificar se eram peregrinações, degraus ou outra circunstância.
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Expressa o estado favorável, próspero ou bem-aventurado indicado pelo plural exclamativo hebraico; a nota registra a alternativa tradicional.
- source_word: יְרֵא
  choice: teme
  rationale: Mantém o campo semântico de temor reverente diante de Deus, sem reduzi-lo apenas a respeito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome divino pessoal indicado pelo tetragrama, em conformidade com a camada inglesa auditada.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: anda nos seus caminhos
  rationale: Preserva a metáfora hebraica convencional de caminhar como modo de viver e obedecer.
theological_decisions:
- issue: Sentido de אַשְׁרֵי
  choice: Feliz
  alternative: Bem-aventurado
  rationale: “Feliz” é claro ao leitor moderno e comunica uma condição de vida favorecida, enquanto a nota preserva a formulação tradicional e a amplitude semântica.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome pessoal divino do título אֲדֹנָי; a nota oferece a convenção tradicional em português.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. “Cântico” conserva o registro dos títulos dos salmos; “anda nos seus caminhos” mantém uma metáfora bíblica ainda inteligível em português.
