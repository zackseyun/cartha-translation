  text: וּ/רְאֵֽה בָנִ֥ים לְ/בָנֶ֑י/ךָ שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/006.yaml
  text: May you see your children's children[b][a]. Peace be upon Israel.
translation:
  language: pt
  text: Que você veja os filhos dos seus filhos.[a] Paz sobre Israel![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “filhos para os seus filhos”, isto é, netos.
    reason: lexical_alternative
  - marker: b
    text: “Paz” traduz shalom, termo que também pode incluir bem-estar, integridade e pleno florescimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Que você veja
  rationale: O imperativo hebraico funciona, neste contexto de bênção, como expressão de desejo. Esta formulação conserva esse valor sem transformar a frase em simples ordem ou predição.
- source_word: בָנִים לְבָנֶיךָ
  choice: os filhos dos seus filhos
  rationale: A expressão significa literalmente “filhos para os seus filhos” e designa os descendentes da geração seguinte. A forma escolhida é natural e preserva a imagem familiar do hebraico.
- source_word: שָׁלוֹם
  choice: Paz
  rationale: É o equivalente tradicional e direto, mantendo a amplitude de shalom, que também pode abranger bem-estar, integridade e prosperidade.
- source_word: עַל
  choice: sobre
  rationale: Preserva a construção da bênção hebraica, na qual a paz é invocada sobre Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Transliteração portuguesa consagrada do nome próprio.
theological_decisions:
- issue: Alcance da bênção final
  choice: Manter “Israel” como referente explícito do texto
  alternative: Interpretar na tradução como a comunidade de adoradores em geral ou, tipologicamente, como a igreja
  rationale: O hebraico nomeia Israel diretamente. A tradução preserva esse referente histórico e pactual sem inserir extensões teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Que você veja” expressa naturalmente a bênção; “filhos dos seus filhos” conserva o idioma geracional do original. A pontuação apresenta a bênção final como aclamação independente.
