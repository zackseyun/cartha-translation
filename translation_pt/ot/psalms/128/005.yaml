  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: pt
  text: Que Yahweh abençoe você desde Sião, e que você veja o bem-estar[a] de Jerusalém todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a prosperidade de Jerusalém”, “o bem de Jerusalém” ou “a bondade de Jerusalém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que ... abençoe você
  rationale: O piel imperfeito com sufixo de segunda pessoa masculina singular tem força volitiva neste contexto de bênção; a construção com “Que” expressa naturalmente esse desejo em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִצִּיּוֹן
  choice: desde Sião
  rationale: A preposição מִן indica a origem da bênção. “Desde Sião” conserva esse sentido e soa natural no registro poético.
- source_word: וּרְאֵה
  choice: e que você veja
  rationale: Embora a forma seja um imperativo, na sequência da bênção ela continua o tom de desejo; a tradução evita lê-la como uma ordem isolada.
- source_word: בְּטוּב
  choice: o bem-estar
  rationale: טוּב pode significar bem, bondade, prosperidade ou bem-estar. “Bem-estar” comunica a condição favorável de Jerusalém sem restringir o termo apenas à riqueza material.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: todos os dias da sua vida
  rationale: Reproduz de modo claro e natural o idioma hebraico que abrange toda a duração da vida do destinatário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O hebraico traz explicitamente o tetragrama; manter “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: A bênção proveniente de Sião
  choice: Manter Sião como origem da bênção sem explicação adicional
  alternative: Explicitar Sião como templo, centro messiânico ou sede divina
  rationale: O versículo liga a bênção a Sião e ao bem de Jerusalém, mas não define aqui toda a significação teológica dessa relação.
- issue: Sentido de טוּב aplicado a Jerusalém
  choice: bem-estar
  alternative: bem, bondade ou prosperidade
  rationale: A escolha preserva a amplitude comunitária do termo e evita reduzir a bênção a prosperidade econômica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” torna explícita a segunda pessoa singular do hebraico; a formulação mantém o paralelismo de bênção e a ambiguidade lexical de טוּב por meio da nota.
