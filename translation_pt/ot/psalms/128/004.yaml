  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: pt
  text: Eis que assim será abençoado o homem[a] que teme Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “o homem”; aqui, a forma masculina é usada proverbialmente para a pessoa caracterizada por temer Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática de chamar a atenção e o tom poético e proclamativo do hebraico.
- source_word: כִי כֵן
  choice: assim
  rationale: Expressa de modo conciso a maneira ou o resultado reforçado pelas partículas hebraicas, sem explicitar em excesso sua relação sintática.
- source_word: יְבֹרַךְ
  choice: será abençoado
  rationale: Preserva a voz passiva do Pual de ברך e o caráter proverbial e declarativo da frase.
- source_word: גָּבֶר
  choice: o homem
  rationale: Conserva a forma masculina do substantivo hebraico e seu uso representativo neste dito sapiencial.
- source_word: יְרֵא יְהוָה
  choice: que teme a Yahweh
  rationale: Reproduz a construção participial como característica definidora e mantém o idioma bíblico de temer a Deus, sem reduzi-lo interpretativamente a apenas reverenciar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Masculino genérico em גָּבֶר
  choice: o homem
  alternative: a pessoa; aquele
  rationale: A tradução mantém a forma masculina do hebraico, enquanto a nota esclarece seu alcance proverbial e representativo.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. “Eis que” conserva a ênfase do marcador hebraico; “será abençoado” mantém a voz passiva e o tom proverbial.
