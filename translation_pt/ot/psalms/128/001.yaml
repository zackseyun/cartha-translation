  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: pt
  text: 'Cântico das Subidas.


    Feliz é todo aquele que teme a Yahweh e anda nos seus caminhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Preserva o substantivo concreto מַעֲלוֹת (“subidas”) e a fórmula que encabeça esta coleção de salmos, sem definir de modo indevido a situação histórica como peregrinação.
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Expressa a condição de bem-estar, favor e plenitude anunciada pela fórmula sapiencial. É natural no português moderno; a nota registra a alternativa tradicional “Bem-aventurado”.
- source_word: כָּל יְרֵא
  choice: todo aquele que teme
  rationale: Comunica o valor distributivo e inclusivo de כָּל com o particípio masculino singular de sentido representativo, preservando a construção no singular sem restringi-la aos homens.
- source_word: יְרֵא יְהוָה
  choice: que teme a Yahweh
  rationale: “Teme” conserva o peso da expressão sapiencial, que envolve temor reverente e não apenas respeito. A preposição “a” é idiomática diante do nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino indicado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַהֹלֵךְ
  choice: e anda
  rationale: Mantém a metáfora hebraica de caminhar como modo de viver e torna explícita, de maneira natural em português, a coordenação das duas características.
- source_word: בִּדְרָכָיו
  choice: nos seus caminhos
  rationale: Preserva a metáfora moral de דֶּרֶךְ no plural; o possessivo retoma naturalmente Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva essa função sem substituí-la por um título.
- issue: Alcance de כָּל יְרֵא
  choice: todo aquele que teme
  alternative: todo homem que teme; todos os que temem
  rationale: O masculino singular hebraico tem força genérica e representativa. A formulação escolhida mantém o singular e comunica a abrangência sem introduzir uma limitação masculina.
- issue: Sentido de ירא na relação com Deus
  choice: teme
  alternative: reverencia
  rationale: “Teme” conserva a tensão e o peso teológico do termo hebraico, sem reduzi-lo silenciosamente a respeito, embora nesse contexto se trate de temor reverente.
translation_notes:
  register: Português moderno, claro e digno, com cadência sapiencial. “Cântico” preserva o registro do título; “subidas” evita interpretar em excesso sua origem histórica. A formulação é amplamente compreensível no Brasil e em outras comunidades lusófonas.
