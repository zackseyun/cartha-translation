  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: pt
  text: Você comerá do fruto do trabalho de suas mãos; feliz você será, e lhe irá bem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: do trabalho de suas mãos
  rationale: Preserva a expressão concreta do hebraico e, com a preposição exigida naturalmente por “comer” em português, comunica que a pessoa desfrutará do produto obtido pelo próprio trabalho.
- source_word: כִּי
  choice: Pois
  rationale: No contexto, introduz a explicação ou consequência ligada à bem-aventurança de quem teme o SENHOR, sem excluir inteiramente a nuance circunstancial.
- source_word: תֹאכֵל
  choice: você comerá
  rationale: Mantém a imagem concreta de comer e verte o imperfeito como futuro esperado no contexto.
- source_word: אַשְׁרֶיךָ
  choice: feliz é você
  rationale: O termo designa a condição afortunada e florescente da pessoa; “feliz” é claro e natural em português, sem limitar a expressão a uma emoção passageira.
- source_word: וְטוֹב לָךְ
  choice: e tudo lhe irá bem
  rationale: Expressa de modo idiomático o bem-estar e o resultado favorável indicados literalmente por “bom para você”.
theological_decisions:
- issue: Tradução da fórmula de bem-aventurança em contexto sapiencial
  choice: feliz é você
  alternative: abençoado é você; como você é feliz
  rationale: אַשְׁרֵי descreve uma condição digna de felicitação ou florescimento, não usa o verbo hebraico comum para abençoar. “Feliz é você” preserva essa distinção lexical e o tom proverbial, sem negar que a condição procede do favor divino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “feliz é você” conserva discretamente a ênfase da fórmula hebraica. “Comer do trabalho de suas mãos” mantém a imagem original, entendida como desfrutar do produto do próprio esforço.
