revisions:
- from: Pois você comerá do trabalho de suas mãos; feliz é você, e tudo lhe irá bem.
  to: Você comerá do fruto do trabalho de suas mãos; feliz você será, e lhe irá bem.
  rationale: A revisão substitui uma construção literal, mas pouco natural, por uma expressão portuguesa idiomática que preserva a imagem de usufruir o resultado do trabalho manual. Também ajusta a fórmula de felicitação e elimina uma ampliação dispensável, mantendo o paralelismo e o tom sapiencial do hebraico.
