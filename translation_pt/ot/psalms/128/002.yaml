  timestamp: '2026-07-13T23:16:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está preservado: o versículo promete que a pessoa desfrutará do resultado do trabalho das próprias mãos e declara sua condição feliz, seguida de bem-estar. Contudo, em português, “comerá do trabalho de suas mãos” pode sugerir que se come o próprio trabalho, em vez de seu produto; o hebraico admite e, idiomaticamente, requer explicitar esse resultado como “fruto”.'
  naturalness: “Pois” é possível para כִּי, mas não é necessário e torna a frase dependente do contexto anterior. “Feliz é você” é compreensível, porém soa marcadamente calcado na ordem hebraica e pouco natural no português moderno. “Feliz você será” mantém a fórmula de felicitação, sua projeção de bem-estar e um registro digno e fluente.
  terminology: “Fruto do trabalho de suas mãos” é uma expressão portuguesa estabelecida que comunica o produto do labor, sem perder a referência explícita às mãos. “Lhe irá bem” traduz com precisão וְטוֹב לָךְ; “tudo” não é necessário no hebraico.
  issues:
  - severity: medium
    issue: “comerá do trabalho de suas mãos” é semanticamente pouco idiomático.
    rationale: Embora reproduza a forma hebraica de perto, em português “comer trabalho” não comunica naturalmente o sentido de desfrutar do que o trabalho produziu. “Fruto do trabalho” torna explícita uma implicação lexical legítima de יְגִיעַ neste contexto.
  - severity: low
    issue: “feliz é você” tem ordem pouco natural no português moderno.
    rationale: A inversão procura refletir a fórmula hebraica אַשְׁרֶיךָ, mas “Feliz você será” preserva a ênfase e é mais fluente para leitores contemporâneos.
  - severity: low
    issue: “tudo” amplia levemente a formulação hebraica.
    rationale: A cláusula diz literalmente que haverá bem para a pessoa; “lhe irá bem” já exprime esse sentido idiomático sem acrescentar o quantificador.
  revised_text: Você comerá do fruto do trabalho de suas mãos; feliz você será, e lhe irá bem.
