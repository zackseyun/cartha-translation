  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: pt
  text: Pois, enquanto vive, ele se considera abençoado[a], e elogiam você quando tudo lhe vai bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua alma abençoa a si mesma durante sua vida, e elogiam você quando você faz bem a si mesmo”.'
    reason: Preserva a expressão hebraica mais literal e a possível amplitude de נֶפֶשׁ e תֵיטִיב לָךְ.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém o encadeamento argumentativo do salmo.
- source_word: נַפְשׁוֹ יְבָרֵךְ
  choice: ele se considera abençoado
  rationale: 'נֶפֶשׁ pode designar a alma, a vida ou a própria pessoa. Nesta construção, o sentido provável é reflexivo: o homem rico vê a si mesmo como abençoado. A formulação portuguesa comunica esse sentido sem sugerir que ele esteja abençoando outra pessoa.'
- source_word: בְּחַיָּיו
  choice: enquanto vive
  rationale: Expressa de modo natural o sentido temporal de 'durante sua vida' ou 'em sua vida'.
- source_word: וְיוֹדֻךָ
  choice: e elogiam você
  rationale: O plural tem sujeito humano indefinido. Neste contexto, ידה indica aprovação ou louvor social; 'elogiam' soa mais natural para uma pessoa próspera do que 'louvam'.
- source_word: כִּי
  choice: quando
  rationale: Introduz a circunstância em que a pessoa recebe elogios, sem impor uma relação causal mais rígida.
- source_word: תֵיטִיב לָךְ
  choice: tudo lhe vai bem
  rationale: No contexto de riqueza e prosperidade, a expressão comunica que alguém prospera ou se sai bem. Evita que 'faz o bem a si mesmo' seja entendido apenas em sentido moral, embora essa forma mais literal seja registrada na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” para tornar clara a mudança do discurso na terceira pessoa para a segunda pessoa presente no hebraico. A tradução principal privilegia naturalidade sem apagar a leitura mais formal, apresentada na nota.
