base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: pt
  text: Como ovelhas, estão destinados ao Sheol[a]; a morte os pastoreará, e os íntegros terão domínio sobre eles pela manhã[b]. Sua forma[c] se consumirá no Sheol, longe de sua elevada morada[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol é o mundo dos mortos; seu sentido é mais amplo que o de uma sepultura.
    reason: cultural_note
  - marker: b
    text: 'Ou: “os íntegros dominarão sobre eles ao amanhecer”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “sua rocha” ou “sua força”. O hebraico desta expressão é difícil; “sua forma” é uma tradução baseada no contexto.'
    reason: lexical_alternative
  - marker: d
    text: 'A frase final é difícil em hebraico. Outra possibilidade é: “o Sheol os consumirá, longe de sua elevada morada”, ou formulação semelhante.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Como ovelhas
  rationale: Preserva de modo natural a comparação coletiva e a imagem de um rebanho conduzido.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: são destinados ao Sheol
  rationale: שַׁתּוּ indica que foram postos ou designados, e לִשְׁאוֹל marca seu destino; a formulação portuguesa comunica esse sentido sem reduzir Sheol à sepultura física.
- source_word: מָוֶת יִרְעֵם
  choice: a morte os apascentará
  rationale: Mantém a personificação da morte e prolonga a metáfora pastoril de רעה; a ironia é que a morte atua como pastor do rebanho.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: e os íntegros dominarão sobre eles
  rationale: ‘Dominar’ expressa o sentido mais provável do verbo, enquanto ‘íntegros’ corresponde ao adjetivo יְשָׁרִים sem substituí-lo pelo termo hebraico distinto para ‘justos’.
- source_word: לַבֹּקֶר
  choice: pela manhã
  rationale: Expressão temporal natural em português, preservando sem explicar a possível imagem de reversão após a noite.
- source_word: וְצוּרָם
  choice: Sua forma
  rationale: O hebraico é difícil; ‘forma’ produz sentido coerente com o verbo seguinte, que denota desgaste ou consumo, mas a alternativa lexical é registrada em nota.
- source_word: לְבַלּוֹת שְׁאוֹל
  choice: se consumirá no Sheol
  rationale: Transmite o processo de desgaste ou decadência expresso por בלה e conserva Sheol como o âmbito em que isso ocorre.
- source_word: מִזְּבֻל לוֹ
  choice: longe de sua elevada morada
  rationale: Segue uma análise possível de זְבֻל como morada elevada; devido à sintaxe obscura, outras construções são preservadas em nota.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: O termo hebraico é mais amplo que uma sepultura individual. Mantê-lo transliterado preserva a concepção do texto sem impor uma identificação doutrinária posterior.
- issue: Sentido de ‘pela manhã’
  choice: manter a expressão temporal sem explicação interpretativa no corpo do texto
  alternative: explicitar ressurreição, juízo ou reversão escatológica
  rationale: O contexto sugere reversão, mas o verso não especifica sua natureza; a tradução preserva essa tensão.
- issue: Ação dos íntegros sobre os mortos
  choice: dominarão sobre eles
  alternative: pisarão sobre eles; terão domínio sobre eles
  rationale: A leitura de domínio é lexicalmente plausível e clara, sem definir o mecanismo ou o momento teológico desse domínio.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. ‘Sheol’ é mantido e explicado em nota. ‘Apascentará’ preserva a metáfora pastoril e é compreensível no registro bíblico corrente. Os marcadores foram posicionados junto às expressões que explicam.
