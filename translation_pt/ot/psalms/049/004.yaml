  text: I will incline my ear to a proverb[c][b][a]; I will open my riddle with the lyre.
translation:
  language: pt
  text: Inclinarei o meu ouvido a um provérbio[a]; apresentarei o meu enigma[c] com a lira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a uma parábola” ou “a uma máxima”. O hebraico מָשָׁל pode se referir a um provérbio, uma parábola ou um dito de sabedoria.
    reason: lexical_alternative
  - marker: b
    text: Ou “na lira”; tradicionalmente, “com a harpa”. O hebraico כִּנּוֹר designa um instrumento de cordas semelhante à lira.
    reason: lexical_alternative
  - marker: c
    text: Ou “meu dito obscuro” ou “minha charada”. O hebraico חִידָה pode designar um enigma, um dito enigmático ou uma questão que exige discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: Inclinarei
  rationale: O hifil de נטה, com “ouvido” como objeto, exprime o ato deliberado de voltar ou inclinar o ouvido para escutar atentamente. “Inclinarei” preserva a imagem hebraica e é compreensível em português.
- source_word: לְמָשָׁל
  choice: a um provérbio
  rationale: מָשָׁל pode designar provérbio, parábola ou máxima sapiencial. Neste salmo de sabedoria, “provérbio” comunica bem o caráter didático, sem excluir a alternativa indicada em nota.
- source_word: אָזְנִי
  choice: o meu ouvido
  rationale: O hebraico emprega o singular com sufixo de primeira pessoa; o singular também funciona naturalmente nesta expressão em português.
- source_word: אֶפְתַּח
  choice: desvendarei
  rationale: פתח significa literalmente “abrir”. Com חידה como objeto, “desvendar” conserva a metáfora de tornar acessível um enigma e soa mais natural em português do que “abrir o meu enigma”.
- source_word: בְּכִנּוֹר
  choice: ao som da lira
  rationale: כִּנּוֹר designa um instrumento de cordas semelhante à lira. A preposição ב pode indicar acompanhamento ou meio; “ao som da lira” expressa com naturalidade que o enigma será apresentado com acompanhamento musical.
- source_word: חִידָתִי
  choice: o meu enigma
  rationale: חִידָה designa um enigma, dito enigmático ou questão que exige discernimento. “Enigma” é atual, digno e adequado ao contexto sapiencial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A ordem poética em duas linhas é preservada. “Inclinarei o meu ouvido” mantém a imagem deliberada do hebraico; “desvendarei” oferece uma equivalência natural para a metáfora literal de “abrir” um enigma. Todos os marcadores de nota aparecem no texto principal.
