  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: pt
  text: Mas o ser humano, em posição de honra, não permanece[a]; é semelhante aos animais que perecem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não passa a noite”. A expressão indica que não continua nem perdura em sua posição honrosa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que são destruídos”. O verbo final é tradicionalmente entendido aqui como referência à morte.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: o ser humano
  rationale: O substantivo pode designar um homem individual ou a humanidade de modo representativo. “O ser humano” preserva aqui o alcance geral da máxima sem restringi-la ao sexo masculino.
- source_word: בִּיקָר
  choice: em posição de honra
  rationale: יְקָר expressa honra, valor, prestígio ou esplendor. A formulação indica naturalmente uma condição honrosa, em harmonia com o tema do salmo.
- source_word: בַּל
  choice: não
  rationale: A partícula nega o verbo seguinte e, neste enunciado proverbial, é vertida de maneira direta.
- source_word: יָלִין
  choice: permanece
  rationale: O verbo significa literalmente “passar a noite” ou “pernoitar”, mas aqui comunica a ideia de não continuar ou perdurar numa condição honrosa.
- source_word: נִמְשַׁל
  choice: é semelhante
  rationale: O nifal de משל introduz uma comparação; “é semelhante” mantém o tom solene e é natural em português.
- source_word: כַּבְּהֵמוֹת
  choice: aos animais
  rationale: בְּהֵמוֹת designa animais em geral. “Animais” é claro, atual e digno, sem a possível conotação restrita de “feras”.
- source_word: נִדְמוּ
  choice: que perecem
  rationale: A leitura tradicional entende a forma de דמה no sentido de perecer ou ser destruído. Esse sentido se ajusta à reflexão do salmo sobre a mortalidade e evita uma repetição tautológica após נִמְשַׁל.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso mantém o paralelismo conciso e o tom proverbial e solene do hebraico. “O ser humano” comunica o uso representativo de אָדָם, e “em posição de honra” explicita com naturalidade que בִּיקָר descreve uma condição de prestígio.
