  - marker: b
    text: 'Ou: “todos juntos, ricos e pobres”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: tanto ... como
  rationale: A construção correlativa inclui os dois grupos e soa natural em português.
- source_word: בְּנֵי אָדָם
  choice: os de condição humilde
  rationale: Em contraste com בְּנֵי אִישׁ, a expressão funciona idiomaticamente como referência a pessoas de posição social inferior, não como expressão filial literal.
- source_word: בְּנֵי אִישׁ
  choice: os de condição elevada
  rationale: No paralelismo com בְּנֵי אָדָם, designa pessoas de posição social superior; a tradução conserva o contraste sem restringi-lo necessariamente à nobreza.
- source_word: יַחַד
  choice: juntos
  rationale: Indica que todos os grupos são abrangidos conjuntamente e, ao final, mantém uma cadência poética natural.
- source_word: עָשִׁיר
  choice: ricos
  rationale: Equivalente português direto e corrente no contraste socioeconômico.
- source_word: וְאֶבְיוֹן
  choice: e pobres
  rationale: No contraste com os ricos, 'pobres' expressa de modo claro e idiomático o sentido de pessoas necessitadas.
