  text: tanto os de condição humilde como os de condição elevada[a], ricos e pobres juntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “tanto filhos de Adão como filhos de homem”; aqui, as expressões emparelhadas funcionam idiomaticamente para pessoas de condição humilde e elevada.'
