id: PSA.49.10
reference: Psalms 49:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: pt
  text: Pois ele vê que os sábios[a] morrem; juntos perecem o tolo e o embrutecido[b], e deixam sua riqueza[c] para outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pessoas sábias”; o hebraico usa uma forma masculina para representar essa categoria humana.
    reason: lexical_alternative
  - marker: b
    text: “Embrutecido” refere-se a alguém sem entendimento, insensível ou semelhante a um animal em sua falta de razão.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus bens” ou “seus recursos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da reflexão anterior e preserva de modo natural a força conectiva do hebraico.
- source_word: יִרְאֶה
  choice: ele vê
  rationale: Mantém a terceira pessoa masculina singular do hebraico; o presente expressa adequadamente uma observação geral.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Substantivo/adjetivo masculino plural que designa uma categoria humana; esta forma é natural em português e mantém a forma representativa do hebraico.
- source_word: יָמוּתוּ
  choice: morrem
  rationale: Expressa diretamente a morte como verdade geral, sem acrescentar aspecto futuro.
- source_word: יַחַד
  choice: juntos
  rationale: Ressalta o destino comum de categorias humanas contrastantes.
- source_word: כְּסִיל
  choice: o tolo
  rationale: Termo sapiencial que indica insensatez intelectual e moral; “o tolo” conserva o sentido categorial.
- source_word: בַעַר
  choice: o embrutecido
  rationale: Conserva a ideia de alguém sem entendimento, quase animalesco, sem recorrer a uma expressão excessivamente explicativa no texto principal.
- source_word: יֹאבֵדוּ
  choice: perecem
  rationale: Reproduz a força de אבד, que pode sugerir ruína ou desaparecimento, e não apenas o ato de morrer.
- source_word: וְעָזְבוּ
  choice: e deixam
  rationale: No contexto, significa deixar para trás aquilo que possuíam; a construção é idiomática em português.
- source_word: לַאֲחֵרִים
  choice: para outros
  rationale: Reflete o plural indefinido sem introduzir a noção mais forte de desconhecidos ou estrangeiros.
- source_word: חֵילָם
  choice: sua riqueza
  rationale: Aqui חֵיל designa recursos, bens ou riqueza; “riqueza” é claro e natural no contexto da mortalidade.
theological_decisions:
- issue: Forma antropológica e de gênero em חֲכָמִים, כְּסִיל e בַעַר
  choice: os sábios ... o tolo e o embrutecido
  alternative: as pessoas sábias ... a pessoa tola e a pessoa sem entendimento
  rationale: O hebraico emprega formas masculinas para tipos humanos representativos. A tradução conserva essa forma gramatical sem restringir necessariamente a afirmação apenas aos homens.
- issue: Relação entre morte e perecimento
  choice: morrem ... perecem
  alternative: morrem ... morrem
  rationale: 'A distinção verbal do hebraico é preservada: מות declara a morte, enquanto אבד pode carregar a nuance adicional de perecer ou desaparecer. A tradução não transforma essa diferença lexical em uma afirmação doutrinária sobre o destino final.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa e paralelismo sapiencial. “Embrutecido” preserva uma nuance importante do original, esclarecida em nota; “sua riqueza” evita a possível rigidez de “seu patrimônio”.
