base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: pt
  text: Por que eu teria medo em dias de adversidade, quando a iniquidade dos que me seguem de perto me cerca?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «a iniquidade dos meus calcanhares me cerca». A expressão hebraica é ambígua: pode significar a iniquidade que está nos calcanhares do salmista, sua própria iniquidade que o segue, ou a iniquidade de pessoas que o seguem de perto e procuram fazê-lo tropeçar.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Por que eu teria medo
  rationale: A pergunta retórica combina לָמָּה com o imperfeito de ירא. O condicional em português comunica naturalmente a ideia de “por que haveria eu de temer?”, sem transformar a frase em simples referência ao futuro.
- source_word: בִּימֵי רָע
  choice: em dias de adversidade
  rationale: רָע pode indicar mal moral ou calamidade. Aqui, como descrição dos dias em que surge a ameaça, “adversidade” preserva o sentido amplo sem sugerir que os próprios dias pratiquem o mal.
- source_word: עֲוֹן
  choice: maldade
  rationale: עָוֹן pode designar iniquidade, culpa ou sua consequência. “Maldade” mantém aqui o peso moral e soa natural ao caracterizar a conduta ameaçadora.
- source_word: עֲקֵבַי
  choice: dos que vêm no meu encalço
  rationale: A forma significa literalmente “meus calcanhares”, mas pode evocar pessoas que seguem de perto, perseguem ou procuram fazer alguém tropeçar. A expressão escolhida é clara e mantém a imagem de perseguidores que estão atrás do salmista.
- source_word: יְסוּבֵּנִי
  choice: me cerca
  rationale: O verbo סבב significa cercar ou rodear. A construção no singular concorda com “maldade”, por isso “me cerca a maldade” preserva a sintaxe e o foco do hebraico.
theological_decisions:
- issue: Sentido da expressão difícil עֲוֹן עֲקֵבַי
  choice: A maldade pertence aos que vêm no encalço do salmista.
  alternative: A minha própria iniquidade está nos meus calcanhares, ou a iniquidade ligada aos meus calcanhares me cerca.
  rationale: O contexto favorece uma referência a adversários ameaçadores, mas o hebraico diz literalmente “a iniquidade dos/meus calcanhares” e admite outras relações semânticas. A tradução principal oferece uma leitura contextual inteligível, e a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vêm no meu encalço” conserva de modo idiomático a imagem dos calcanhares, enquanto a nota registra tanto a formulação literal quanto as principais possibilidades interpretativas.
