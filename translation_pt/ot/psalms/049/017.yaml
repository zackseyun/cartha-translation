  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: pt
  text: Pois, quando morrer, ele não levará nada[a]; sua glória[b] não descerá após ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não levará coisa alguma disso”; literalmente: “não levará o todo/tudo”.'
    reason: lexical_alternative
  - marker: b
    text: “Glória” também pode significar honra, esplendor ou riqueza e posição social.
    reason: lexical_alternative
  - marker: c
    text: A expressão “não descerá após ele” provavelmente alude à morte, à sepultura ou ao Sheol, mas o hebraico deixa o destino implícito.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a reflexão anterior e mantém o fluxo argumentativo do salmo.
- source_word: בְמוֹתוֹ
  choice: quando morrer
  rationale: Expressa de modo natural em português o valor temporal da preposição בְּ ligada a “morte” com sufixo masculino singular.
- source_word: לֹא ... יִקַּח הַכֹּל
  choice: não levará nada
  rationale: Embora הַכֹּל seja literalmente “o todo/tudo”, sob negação a expressão comunica que ele não leva consigo coisa alguma. “Levará” explicita naturalmente em português o movimento implícito pelo contexto da morte sem acrescentar um destino.
- source_word: כְּבוֹדוֹ
  choice: sua glória
  rationale: Preserva a amplitude de כָּבוֹד, que pode abranger glória, honra, esplendor e condição material.
- source_word: יֵרֵד אַחֲרָיו
  choice: não descerá depois dele
  rationale: Mantém a imagem concreta e a formulação deliberadamente implícita do hebraico, sem especificar sepultura ou Sheol.
theological_decisions:
- issue: Destino implícito na descida após a morte
  choice: não descerá depois dele
  alternative: não o acompanhará à sepultura / não descerá com ele ao Sheol
  rationale: O hebraico evoca a descida ligada à morte, possivelmente à sepultura ou ao Sheol, mas não declara o destino. A tradução conserva essa tensão e evita especificação doutrinária indevida.
- issue: Sentido de כְּבוֹדוֹ no contexto da riqueza
  choice: sua glória
  alternative: sua honra / seu esplendor / sua riqueza e posição
  rationale: “Glória” mantém a polissemia poética do termo; restringi-lo a riqueza reduziria seu alcance, embora a riqueza e a posição social façam parte do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas acompanha os termos e imagens a que se referem no texto. A construção poética conserva a descida implícita e a amplitude semântica de “glória”.
