lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע; introduz uma convocação direta para ouvir com atenção e preserva a força poética do hebraico.
- source_word: זֹאת
  choice: isto
  rationale: Demonstrativo que aponta para o ensinamento ou a proclamação que vem a seguir no salmo.
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: Mantém o plural e o alcance universal de עַמִּים sem restringir o sentido a nações políticas.
- source_word: הַאֲזִינוּ
  choice: prestem atenção
  rationale: O imperativo de אזן convoca os ouvintes a escutar atentamente; esta formulação é natural em português atual e mantém o paralelismo sem repetição mecânica.
- source_word: כָּל יֹשְׁבֵי
  choice: todos os habitantes do
  rationale: A construção participial designa todos os que habitam ou vivem em determinado âmbito.
- source_word: חָלֶד
  choice: mundo
  rationale: Neste chamado universal, חָלֶד designa naturalmente o mundo habitado ou a esfera da vida humana; a alternativa 'terra' é preservada em nota.
