  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: pt
  text: 'No íntimo, pensam: “Suas casas durarão para sempre, suas moradas, de geração em geração.” Deram seus próprios nomes às terras[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra compreensão do texto: “Suas sepulturas são suas casas para sempre, suas moradas, de geração em geração.”'
    reason: textual_variant
lexical_decisions:
- source_word: קִרְבָּם
  choice: No íntimo, pensam
  rationale: A vocalização massorética aponta para קֶרֶב, “interior, íntimo”. Como a oração hebraica não tem verbo expresso, “pensam” torna natural em português a ideia da convicção interior deles sem tratar a leitura alternativa “sepulturas” como texto principal.
- source_word: בָּתֵּימוֹ
  choice: suas casas
  rationale: בית significa normalmente “casa, lar”; aqui forma paralelo com “moradas” e se ajusta ao tema da permanência ilusória dos bens.
- source_word: לְעוֹלָם
  choice: durarão para sempre
  rationale: A expressão indica permanência indefinida ou perpétua. O verbo “durarão”, suprido em português, explicita naturalmente a oração nominal hebraica.
- source_word: מִשְׁכְּנֹתָם
  choice: suas moradas
  rationale: Designa lugares de habitação. “Moradas” é atual, digno e preserva o paralelismo com “casas”.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Expressão idiomática que indica continuidade por gerações sucessivas.
- source_word: קָרְאוּ
  choice: dão ... nomes
  rationale: O qal perfeito de קרא pode significar “chamar” ou “dar nome”. A construção portuguesa comunica idiomaticamente o ato de nomear propriedades, sem exigir uma reprodução rígida do aspecto verbal.
- source_word: בִּשְׁמוֹתָם
  choice: seus próprios nomes
  rationale: A preposição ב com “nomes” indica a designação mediante os nomes deles. “Próprios” deixa claro que as terras recebem os nomes de seus possuidores.
- source_word: עֲלֵי אֲדָמוֹת
  choice: às terras
  rationale: A expressão, literalmente “sobre terras”, provavelmente se refere a terrenos, propriedades ou territórios. “Às terras” é conciso e natural na construção portuguesa “dar nome a”.
