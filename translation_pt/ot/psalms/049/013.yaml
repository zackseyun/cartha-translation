  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: pt
  text: Este é o caminho deles — a sua insensatez[a]; mesmo assim, os que vêm depois deles[b] se agradam do que eles dizem[c]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua confiança”. O termo hebraico pode significar tanto “insensatez” como “confiança” ou “segurança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os seus descendentes”.'
    reason: alternative_reading
  - marker: c
    text: 'Literalmente: “da boca deles”, isto é, do que eles dizem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Este é
  rationale: O pronome demonstrativo introduz uma avaliação resumida do que foi descrito antes; em português, a cópula torna a frase natural.
- source_word: דַרְכָּם
  choice: o caminho deles
  rationale: Mantém a metáfora de דֶּרֶךְ e também seu sentido ético de modo de viver ou proceder.
- source_word: כֵּסֶל לָמוֹ
  choice: a sua insensatez
  rationale: A construção hebraica é compacta, literalmente algo como “insensatez para eles”. A aposição em português comunica com naturalidade o juízo do salmista, sem eliminar a possível nuance alternativa de “confiança”.
- source_word: וְאַחֲרֵיהֶם
  choice: mesmo assim, os que vêm depois deles
  rationale: O hebraico pode designar pessoas posteriores em geral ou descendentes. A formulação principal conserva o sentido mais amplo; “mesmo assim” explicita o contraste contextual da continuação desse comportamento.
- source_word: בְּפִיהֶם
  choice: das suas palavras
  rationale: Literalmente, “na boca deles”. “Das suas palavras” expressa em português atual a metonímia da boca pelo que é dito.
- source_word: יִרְצוּ
  choice: se agradam
  rationale: רצה no qal pode significar agradar-se, aceitar ou aprovar. “Se agradam” conserva o valor afetivo sem tornar a ideia mais intelectual do que o hebraico exige.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém-se a transliteração tradicional, pois a função exata do termo, provavelmente litúrgica ou musical, é incerta.
theological_decisions:
- issue: Referente de וְאַחֲרֵיהֶם
  choice: pessoas que vêm depois deles
  alternative: seus descendentes
  rationale: A expressão pode indicar sucessores em geral ou descendentes biológicos. A tradução principal preserva o alcance mais amplo da crítica sapiencial, enquanto a nota registra a leitura mais específica.
- issue: Sentido de כֵּסֶל
  choice: insensatez
  alternative: confiança ou segurança
  rationale: No contexto, o termo avalia negativamente o caminho dos que confiam nas riquezas. “Insensatez” é o sentido mais provável, mas a polissemia do substantivo é registrada sem transformar a alternativa em doutrina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora do “caminho” e o termo tradicional “Selá” foram preservados; construções hebraicas compactas foram vertidas de modo natural, e ambiguidades relevantes foram registradas em notas.
