  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: pt
  text: 'O homem que desfruta de honra, mas não tem entendimento,

    é como os animais que perecem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “é comparado aos animais; eles se assemelham [a ele]”, entendendo o verbo final no sentido de “assemelhar-se”, em vez de “perecer”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: O homem
  rationale: O singular tem sentido genérico e proverbial. “O homem” conserva a forma representativa e o tom poético do hebraico, sendo natural em português.
- source_word: בִּיקָר
  choice: que desfruta de honra
  rationale: A expressão descreve uma condição de honra, dignidade ou posição elevada. “Desfruta de honra” comunica esse estado com clareza, sem restringi-lo apenas à riqueza.
- source_word: וְלֹא יָבִין
  choice: mas não tem entendimento
  rationale: O verbo בין indica entender ou discernir. A conjunção adversativa explicita o contraste contextual entre a honra exterior e a falta de discernimento.
- source_word: נִמְשַׁל
  choice: é como
  rationale: O nifal de משל expressa comparação. “É como” é direto e poético em português.
- source_word: כַּבְּהֵמוֹת
  choice: os animais
  rationale: בְּהֵמוֹת designa aqui os animais em sentido amplo, não apenas o gado. “Animais” é claro, digno e corrente no português moderno.
- source_word: נִדְמוּ
  choice: que perecem
  rationale: No contexto do refrão e do tema da mortalidade no salmo, a forma é entendida como referência ao perecimento dos animais. A possível leitura ligada a “assemelhar-se” é preservada em nota.
theological_decisions:
- issue: Sentido do verbo final נִדְמוּ
  choice: Entendido como “perecem”, qualificando os animais
  alternative: “É comparado aos animais; tornou-se semelhante a eles”
  rationale: 'A leitura principal produz um encerramento coerente com o tema do salmo: honra e posição não livram o ser humano da morte. Como a forma hebraica também admite análise relacionada à semelhança, essa tensão interpretativa não é eliminada, mas registrada em nota.'
translation_notes:
  register: Português moderno, claro e solene, com estrutura proverbial e paralelismo conciso. A expressão genérica “o homem” preserva a forma do hebraico; “animais” evita a conotação excessivamente arcaica de “bestas”.
