id: PSA.49.15
reference: Psalms 49:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: pt
  text: Mas Deus resgatará minha vida da mão do Sheol[a], pois ele me tomará[b]. Selá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol é o termo hebraico para o domínio dos mortos; também se pode traduzir por «sepultura» ou «mundo dos mortos».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «ele me receberá».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: No contexto, a partícula introduz contraste com o destino inevitável dos ricos e dos demais mortais; “Mas” comunica naturalmente essa força adversativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a referência singular comum ao Deus de Israel e o equivalente natural em português.
- source_word: יִפְדֶּה
  choice: resgatará
  rationale: O verbo פדה expressa libertar ou recuperar mediante resgate. “Resgatará” preserva a ideia de livramento do domínio da morte sem impor uma formulação teológica mais específica.
- source_word: נַפְשִׁי
  choice: minha vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a própria pessoa, não necessariamente uma alma imaterial separada do corpo.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Mantém a imagem hebraica de estar sob o poder ou domínio de algo; o plural é idiomático e natural em português.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o termo hebraico para o domínio dos mortos, evitando reduzi-lo apenas à sepultura ou identificá-lo com uma concepção posterior de inferno.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou base da confiança expressa na oração anterior, com fluidez poética em português.
- source_word: יִקָּחֵנִי
  choice: ele me tomará para si
  rationale: לקח significa literalmente “tomar” e, quando Deus é o sujeito, pode sugerir acolher alguém junto de si. “Tomará para si” conserva o verbo e torna natural sua possível ressonância relacional, sem explicitar como ocorre o livramento.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, pois a função e o significado exatos do termo são incertos.
theological_decisions:
- issue: Sentido de נַפְשִׁי diante da morte e do livramento
  choice: “minha vida”
  alternative: “minha alma” ou “a mim”
  rationale: “Minha vida” representa a pessoa viva como um todo e evita importar para o texto uma antropologia dualista mais tardia.
- issue: Natureza do livramento do Sheol
  choice: 'Manter a afirmação ampla: Deus resgatará a vida do salmista e o tomará para si.'
  alternative: Explicitar ressurreição, comunhão após a morte ou apenas livramento da morte prematura.
  rationale: O hebraico afirma confiança no livramento divino, mas não define sistematicamente seu modo. A tradução preserva essa tensão teológica.
- issue: Alcance de יִקָּחֵנִי
  choice: “ele me tomará para si”
  alternative: “ele me receberá” ou simplesmente “ele me tomará”
  rationale: A formulação preserva a ação divina e sua possível ressonância de acolhimento, sem transformar a sugestão poética em descrição doutrinária explícita.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A dicção conserva o paralelismo e as imagens hebraicas sem soar excessivamente arcaica. “Selá” recebe a acentuação portuguesa tradicional.
