  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: pt
  text: Ele se juntará à geração de seus antepassados[a]; eles nunca mais verão a luz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico apresenta uma tensão de pessoa e número: o primeiro verbo está escrito na segunda pessoa masculina singular (“tu irás/virás”), enquanto o verbo seguinte está no plural (“eles verão”). Muitas traduções uniformizam o versículo no singular; aqui, a mudança de perspectiva é preservada no plural da segunda oração. Literalmente, “seus pais”; também pode ser entendido como “seus antepassados”.'
    reason: alternative_reading
  - marker: b
    text: “Ver a luz” é uma expressão hebraica para experimentar a vida; aqui, indica que eles nunca mais voltarão à vida neste mundo.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: Ele irá
  rationale: Embora a forma escrita seja morfologicamente a segunda pessoa masculina singular, o contexto continua a descrição do homem próspero. A terceira pessoa produz sentido natural em português, enquanto uma nota registra a tensão textual.
- source_word: עַד דּוֹר אֲבוֹתָיו
  choice: até a geração de seus pais
  rationale: Mantém tanto o valor de extensão ou destino de עַד quanto a formulação familiar e ancestral do hebraico. Em português, a expressão sugere que ele se juntará à comunidade dos antepassados mortos.
- source_word: עַד נֵצַח לֹא יִרְאוּ
  choice: eles nunca mais verão
  rationale: Com a negação, עַד נֵצַח exprime a não ocorrência permanente. O plural de יִרְאוּ é preservado, mantendo a mudança do indivíduo para o grupo ao qual ele se junta.
- source_word: אוֹר
  choice: a luz
  rationale: Conserva a imagem hebraica e não explicita no corpo do texto o sentido idiomático de experimentar a vida.
theological_decisions:
- issue: Mudança de pessoa e número no versículo
  choice: O texto principal traz o primeiro verbo na terceira pessoa do singular (“Ele irá”) e o segundo na terceira pessoa do plural (“eles ... verão”).
  alternative: Traduzir literalmente o primeiro verbo como “Tu irás” ou uniformizar ambos os verbos no singular.
  rationale: A forma transmitida de תָּבוֹא é segunda pessoa masculina singular, ao passo que יִרְאוּ é terceira pessoa masculina plural. O contexto favorece a referência ao homem mencionado, mas o plural final deve ser preservado para representar sua incorporação ao grupo dos mortos, sem apagar a tensão gramatical.
- issue: Sentido de “ver a luz”
  choice: Preservar a imagem no texto e explicar seu sentido em nota.
  alternative: Traduzir diretamente como “voltar a viver”.
  rationale: A expressão associa luz e vida, mas manter a metáfora evita reduzir sua força poética e conserva a formulação do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é natural, mas conserva “geração de seus pais” e “verão a luz” para manter as imagens do hebraico. As notas esclarecem a tensão gramatical e o idioma poético sem impor uma leitura doutrinária específica.
