  text: that he should still live on forever and not see the Pit[a].
translation:
  language: pt
  text: para que continue vivendo para sempre e não veja a cova[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “a corrupção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: para que continue vivendo
  rationale: 'No contexto, a forma verbal dá sequência ao pensamento do verso anterior e expressa o resultado ou propósito inalcançável: manter alguém vivo. A construção portuguesa com “para que” preserva essa relação, e “continue vivendo” incorpora naturalmente a ideia de continuidade.'
- source_word: עוֹד
  choice: continue
  rationale: Aqui עוֹד indica prolongamento da existência; em português, “continue vivendo” comunica essa continuidade com clareza e naturalidade.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: A expressão ל + נצח denota duração perpétua; “para sempre” é a formulação portuguesa corrente e digna.
- source_word: לֹא
  choice: não
  rationale: Negação direta do verbo seguinte.
- source_word: יִרְאֶה
  choice: veja
  rationale: Preserva o verbo hebraico e seu idioma poético, no qual “ver” pode também significar experimentar ou sofrer determinada realidade.
- source_word: הַשָּׁחַת
  choice: a Cova
  rationale: Em contexto poético de morte, שחת pode indicar cova, sepultura, corrupção ou destruição. “A Cova” conserva a imagem concreta e sua amplitude sem restringi-la prematuramente à sepultura física ou à decomposição.
theological_decisions:
- issue: Sentido de שחת em contexto de morte
  choice: a Cova
  alternative: a sepultura; a corrupção
  rationale: “A Cova” preserva a amplitude poética e teológica da imagem hebraica, que pode envolver sepultura, ruína e descida à morte. As principais alternativas são registradas em nota para manter a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a ligação sintática com o verso anterior e preserva o idioma poético “ver a Cova”.
