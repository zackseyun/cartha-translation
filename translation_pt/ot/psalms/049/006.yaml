  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: pt
  text: os que confiam em seus bens e se vangloriam da abundância de suas riquezas—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se gloriam da abundância de suas riquezas”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico חַיִל também pode significar “força” ou “recursos”, mas aqui o paralelismo com “riquezas” aponta para bens materiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: os que confiam
  rationale: O particípio qal masculino plural com artigo funciona como substantivo. “Os que confiam” é natural em português e preserva a ideia de uma atitude característica.
- source_word: עַל
  choice: em
  rationale: Com o verbo בּטח, a preposição indica aquilo em que se deposita confiança. “Confiar em” é a construção idiomática em português.
- source_word: חֵילָם
  choice: seus bens
  rationale: חַיִל pode significar força, recursos ou riqueza. O paralelismo com “suas riquezas” favorece o sentido material; “bens” mantém alguma distinção lexical entre os dois membros.
- source_word: וּבְרֹב
  choice: e ... da abundância de
  rationale: רֹב expressa grande quantidade ou abundância. A formulação portuguesa comunica claramente essa ideia e conserva o paralelismo poético.
- source_word: עָשְׁרָם
  choice: suas riquezas
  rationale: עֹשֶׁר denota especificamente riqueza ou bens materiais. “Riquezas” é claro, corrente e adequado ao registro poético.
- source_word: יִתְהַלָּלוּ
  choice: se vangloriam
  rationale: O hitpael de הלל, neste contexto, significa vangloriar-se ou gloriar-se. “Vangloriam-se” é transparente para leitores modernos e expressa a ostentação implícita.
