lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Ao regente
  rationale: Nos títulos dos salmos, o termo designa o responsável pela execução musical. “Ao regente” é conciso, natural em português e mantém a possível ideia de destinação expressa pela preposição ל.
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: A preposição ל pode indicar associação, atribuição ou destinação neste título. “Dos filhos de” preserva melhor essa abertura do que identificar de modo inequívoco autoria ou destinatário.
- source_word: קֹרַח
  choice: Corá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo consagrado e exato para o gênero musical indicado por מִזְמוֹר; a forma sem artigo é natural em títulos breves em português.
