  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: pt
  text: 'Um irmão não pode de modo algum resgatar um homem[a],

    nem dar a Deus o preço do resgate dele—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente ninguém pode resgatar um irmão”. A ordem e a sintaxe do hebraico são difíceis; a tradução principal entende “irmão” como sujeito e “homem” como objeto.'
    reason: alternative_syntactic_reading
lexical_decisions:
- source_word: אָח
  choice: um irmão
  rationale: O substantivo significa literalmente “irmão”. Aqui pode designar tanto um irmão propriamente dito como outro ser humano visto em relação próxima. A tradução mantém o singular sem acrescentar ao hebraico um possessivo explícito.
- source_word: פָדֹה יִפְדֶּה
  choice: pode de modo algum resgatar
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação. Sob a negação, “não pode de modo algum resgatar” expressa com naturalidade a impossibilidade enfática.
- source_word: אִישׁ
  choice: ninguém
  rationale: 'Embora אִישׁ signifique literalmente “homem”, nesta construção negativa seu valor é universal: nenhum ser humano. “Ninguém” comunica esse sentido com clareza no português atual sem sugerir que a afirmação se limita ao sexo masculino.'
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: Neste contexto salmódico, אֱלֹהִים se refere ao único Deus; “a Deus” é a forma natural e contextual.
- source_word: כָּפְרוֹ
  choice: o preço do resgate dele
  rationale: כֹּפֶר designa o preço pago para obter livramento ou soltura. Explicitar “preço do resgate” preserva a imagem econômica e evita introduzir associações sacrificiais não exigidas pelo contexto. “Dele” retém a referência masculina singular, embora seu referente exato dependa da leitura da primeira linha.
theological_decisions:
- issue: Sentido de כֹּפֶר diante de Deus
  choice: preço de resgate oferecido a Deus pela vida de outra pessoa
  alternative: pagamento expiatório a Deus
  rationale: O versículo afirma que nenhum ser humano pode comprar de Deus o livramento da morte para outro. “Preço do resgate” conserva a metáfora de pagamento e libertação sem impor ao termo uma doutrina sacrificial mais específica do que o texto expressa.
- issue: Referência de אָח
  choice: um irmão, sem possessivo explícito
  alternative: seu irmão
  rationale: O hebraico traz אָח, “irmão”, sem sufixo possessivo. A leitura “seu irmão” é contextualmente possível e idiomática, mas “um irmão” preserva melhor a forma e a amplitude do original.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “De modo algum” transmite a intensificação hebraica sem repetição artificial; o travessão mantém a continuidade sintática com o versículo seguinte.
