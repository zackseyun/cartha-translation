base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: pt
  text: 'Minha boca falará sabedoria,[a]

    e a meditação do meu coração será entendimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “sabedoria” e “entendimento” aparecem no plural, provavelmente com sentido abstrato; por isso, foram traduzidos no singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: minha boca
  rationale: Preserva a imagem hebraica concreta e soa natural em português como referência à fala do salmista.
- source_word: יְדַבֵּר
  choice: falará
  rationale: O imperfeito hebraico tem aqui valor declarativo e prospectivo, expressando a intenção do salmista.
- source_word: חָכְמוֹת
  choice: sabedoria
  rationale: Embora esteja no plural em hebraico, provavelmente funciona como plural abstrato; o singular é a forma idiomática em português.
- source_word: הָגוּת
  choice: meditação
  rationale: Expressa a reflexão interior ligada ao coração e mantém a relação entre o pensamento íntimo e a fala.
- source_word: לִבִּי
  choice: do meu coração
  rationale: Preserva a construção hebraica e o sentido bíblico do coração como centro da reflexão.
- source_word: תְבוּנוֹת
  choice: entendimento
  rationale: O plural hebraico provavelmente tem valor abstrato; 'entendimento' conserva o paralelismo com 'sabedoria' de modo natural.
