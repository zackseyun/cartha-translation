  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: pt
  text: Não tenha medo quando um homem enriquecer, quando aumentar a glória de sua casa[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de sua família” ou “de seus bens”; em hebraico, “casa” também pode se referir à família e ao patrimônio, além da construção física.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: A partícula אַל com a forma verbal expressa proibição; a formulação é natural, clara e mantém o tom poético.
- source_word: כִּי
  choice: quando
  rationale: Nas duas ocorrências, כִּי introduz a circunstância que não deve causar medo, e não propriamente uma causa.
- source_word: יַעֲשִׁר
  choice: enriquecer
  rationale: O hifil de עשר tem aqui sentido intransitivo, 'tornar-se rico'; 'enriquecer' é conciso e idiomático em português.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o masculino singular genérico e o estilo proverbial do hebraico.
- source_word: יִרְבֶּה
  choice: aumentar
  rationale: רבה significa tornar-se muito ou aumentar; esta opção combina naturalmente com 'glória'.
- source_word: כְּבוֹד
  choice: a glória
  rationale: Preserva a amplitude e a imagem de כבוד, que pode envolver honra, esplendor, prestígio e abundância, sem reduzi-lo apenas a riqueza.
- source_word: בֵּיתוֹ
  choice: de sua casa
  rationale: Mantém a imagem concreta do hebraico, embora בַּיִת também possa designar a família, a casa senhorial ou os bens ligados a ela.
