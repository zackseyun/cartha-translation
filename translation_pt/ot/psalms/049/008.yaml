id: PSA.49.8
reference: Psalms 49:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: pt
  text: Pois o resgate da vida deles[a] custa caro e jamais será suficiente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vida” também pode ser traduzido por “alma”; o hebraico néfesh muitas vezes se refere à vida ou à pessoa viva, e não somente à alma imaterial.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “e cessa para sempre”. A oração hebraica é condensada e também pode indicar que a tentativa de resgate fracassa definitivamente ou deve ser abandonada para sempre.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: custa caro
  rationale: O verbo ligado a יקר comunica alto valor ou custo. No contexto do preço de resgate, “custa caro” é natural e preserva a metáfora econômica sem explicitar em excesso “caro demais”.
- source_word: פִּדְיוֹן
  choice: resgate
  rationale: O substantivo designa o preço pago para libertar ou resgatar alguém. “Resgate” conserva de modo conciso o sentido transacional.
- source_word: נַפְשָׁם
  choice: da vida deles
  rationale: נפש frequentemente designa a vida ou a própria pessoa. “Vida” se ajusta ao contexto de livramento da morte e evita restringir o termo à ideia de uma alma imaterial.
- source_word: וְחָדַל
  choice: jamais será suficiente
  rationale: A oração hebraica é comprimida; חדל significa fundamentalmente cessar, parar ou falhar. No argumento do salmo, a formulação indica que o resgate não alcança seu objetivo. A ambiguidade é registrada em nota.
- source_word: לְעוֹלָם
  choice: jamais
  rationale: Com a ideia verbal de insuficiência ou fracasso, לְעוֹלָם exprime impossibilidade permanente; “jamais” comunica essa força de maneira idiomática.
theological_decisions:
- issue: Sentido de נפש no contexto de resgate e mortalidade
  choice: vida
  alternative: alma
  rationale: O contexto trata da incapacidade humana de resgatar alguém da morte. “Vida” corresponde ao uso amplo do hebraico sem introduzir uma antropologia dualista que o termo, por si só, não exige.
- issue: Interpretação da oração difícil וְחָדַל לְעוֹלָם
  choice: o resgate jamais será suficiente
  alternative: ele cessa para sempre; deve-se desistir para sempre; fracassa para sempre
  rationale: A redação principal torna claro o efeito da oração dentro do argumento, mas a nota preserva a forma mais literal e as principais possibilidades da expressão elíptica, sem apresentar uma delas como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada para a fluência em português, mantendo a metáfora econômica e sinalizando em notas as ambiguidades lexicais e sintáticas genuínas.
