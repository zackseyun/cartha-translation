  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: pt
  text: E ele redimirá Israel de todas as suas iniquidades[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, as iniquidades de Israel, considerado coletivamente. De modo mais explícito quanto à pluralidade do povo: “de todas as iniquidades deles”. O hebraico emprega “Israel” no singular e um sufixo singular correspondente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: E ele
  rationale: A conjunção dá continuidade ao verso anterior, e o pronome independente preserva a leve ênfase do hebraico sem a intensificar com “ele mesmo”.
- source_word: יִפְדֶּה
  choice: redimirá
  rationale: O verbo פדה expressa resgate ou libertação de escravidão, obrigação ou culpa. “Redimirá” é natural no contexto do salmo e conserva sua densidade teológica.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: A partícula assinala “Israel” como objeto direto definido e não requer equivalente separado em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se a forma tradicional do nome próprio, que aqui designa coletivamente o povo da aliança.
- source_word: מִכֹּל
  choice: de todas
  rationale: A combinação da preposição מן com כֹּל indica libertação da totalidade do que segue; a concordância feminina plural é exigida por “iniquidades” em português.
- source_word: עֲוֺנֹתָיו
  choice: suas iniquidades
  rationale: עָוֹן pode abranger perversidade, culpa e suas consequências; “iniquidades” preserva essa gravidade. O sufixo hebraico é masculino singular e retoma “Israel” como unidade coletiva. Em português, “suas” concorda com o substantivo possuído e não explicita o número do possuidor, por isso a nota esclarece a construção.
theological_decisions:
- issue: Sufixo singular coletivo ligado a “Israel”
  choice: Manter “suas iniquidades” no texto, entendendo “suas” como referência a Israel enquanto unidade coletiva.
  alternative: “as iniquidades deles”, explicitando idiomaticamente a pluralidade do povo de Israel.
  rationale: O hebraico apresenta “Israel” no singular e um sufixo pronominal masculino singular. A redação escolhida preserva a referência coletiva sem impor uma leitura plural; a nota registra a alternativa idiomática e evita que o possessivo seja tomado como referência a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Redimirá” mantém o vocabulário bíblico corrente sem soar arcaico; “iniquidades” conserva a força moral e jurídica do termo hebraico. O pronome divino permanece em minúscula, conforme o uso ortográfico normal.
