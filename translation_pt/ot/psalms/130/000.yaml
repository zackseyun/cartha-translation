  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: pt
  text: 'Cântico das subidas.[a]


    Das profundezas clamei a ti, SENHOR.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Título hebraico tradicional deste grupo de salmos. Também pode ser entendido como “Cântico de peregrinação”, provavelmente relacionado às subidas dos peregrinos a Jerusalém.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente representado por “SENHOR”. O verbo “clamei” também pode ser expresso no presente (“clamo”), destacando a imediaticidade da oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת (shir hamma‘alot)
  choice: Cântico das subidas
  rationale: Tradução direta do título hebraico tradicional desta coleção de salmos. “Subidas” conserva tanto a imagem de ascensão quanto a associação histórica com peregrinações, sem escolher uma explicação incerta.
- source_word: מִמַּעֲמַקִּים (mimma‘amaqim)
  choice: Das profundezas
  rationale: Mantém a metáfora plural do hebraico, que exprime aflição extrema sem especificar se as profundezas são aquáticas, emocionais ou espirituais.
- source_word: קְרָאתִיךָ (qera’tikha)
  choice: clamei a ti
  rationale: O perfeito hebraico é representado pelo pretérito perfeito. “Clamei” comunica um apelo intenso e dirigido, adequado ao contexto de súplica.
- source_word: יהוה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por SENHOR em versaletes; a nota preserva a informação de que o hebraico traz o nome próprio.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh (ou Javé)
  rationale: A forma tradicional é clara para leitores de diversas comunidades e evita impor uma pronúncia reconstruída; a nota explicita o dado do texto hebraico.
- issue: Natureza das “profundezas”
  choice: Preservar a metáfora sem explicação no corpo do texto
  alternative: Explicitar como desespero, sofrimento ou águas profundas
  rationale: O hebraico deixa a imagem aberta, e essa ambiguidade poética e teológica não deve ser reduzida.
translation_notes:
  register: Português atual, digno e acessível, com cadência poética concisa. A formulação mantém o título hebraico, a metáfora plural e o tempo verbal do texto massorético, usando “SENHOR” segundo a convenção bíblica portuguesa.
