  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: pt
  text: 'Espero por Yahweh[a]; minha alma espera,

    e ponho minha esperança na sua palavra.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esperei por Yahweh; minha alma esperou”. Os verbos hebraicos podem apresentar uma decisão já firmada ou uma atitude presente neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “espero pela sua palavra” ou “pela sua promessa”. O hebraico pode se referir de modo geral à palavra de Deus ou, por implicação, à sua promessa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: Espero
  rationale: O verbo קוה expressa espera confiante e expectante. O presente comunica, no contexto poético, uma postura atual, sem excluir o valor possível do perfeito hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קִוְּתָה
  choice: espera
  rationale: Repete em português o mesmo campo verbal de קוה, preservando o paralelismo e a ênfase do hebraico.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva a imagem poética de נֶפֶשׁ como o ser interior ou a própria pessoa, em linguagem corrente e digna.
- source_word: לִדְבָרוֹ
  choice: na sua palavra
  rationale: דָּבָר pode indicar palavra, declaração ou, por implicação, promessa. A formulação mantém o sentido mais direto e apresenta a palavra divina como fundamento da esperança.
- source_word: הוֹחָלְתִּי
  choice: ponho minha esperança
  rationale: O verbo יחל combina espera e esperança. Esta formulação o distingue da repetição de קוה e expressa naturalmente a expectativa confiante em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome próprio, enquanto “o SENHOR” o substitui por um título e “Jeová” representa outra forma tradicional.
- issue: Sentido de דְבָרוֹ
  choice: sua palavra
  alternative: sua promessa
  rationale: “Palavra” preserva a amplitude do termo hebraico; “promessa” é possível por implicação, mas especifica algo que o verso não explicita.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A repetição de “espera” preserva o paralelismo hebraico; “ponho minha esperança” evita uma terceira repetição rígida e representa o verbo distinto יחל. Os marcadores aparecem junto aos elementos a que se referem.
