id: PSA.130.3
reference: Psalms 130:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: pt
  text: Se tu, Yah, levasses em conta[a] as iniquidades, Senhor, quem poderia permanecer de pé?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vigiasses as iniquidades” ou “mantivesses um registro dos pecados”. O verbo hebraico significa literalmente guardar, vigiar ou observar e, aqui, refere-se a manter em conta as transgressões.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição hipotética e combina de modo natural com o imperfeito do subjuntivo em português.
- source_word: עֲוֺנוֹת
  choice: iniquidades
  rationale: Preserva o peso moral de עָוֹן, que pode abranger tanto atos perversos como a culpa decorrente deles.
- source_word: תִּשְׁמָר
  choice: levasses em conta
  rationale: O verbo שׁמר significa literalmente guardar, vigiar ou observar; neste contexto, a expressão portuguesa comunica a ideia de manter os pecados sob consideração para juízo, sem sugerir que Deus os esteja protegendo.
- source_word: יָהּ
  choice: Yah
  rationale: Preserva por transliteração a forma poética abreviada do nome divino e a distingue do título אֲדֹנָי presente no mesmo versículo.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É o título divino convencional usado aqui em vocativo e é natural em português.
- source_word: מִי
  choice: quem
  rationale: Reproduz diretamente o pronome interrogativo da pergunta retórica.
- source_word: יַעֲמֹד
  choice: poderia permanecer de pé
  rationale: Conserva a imagem de estar em pé e exprime a incapacidade de subsistir diante do julgamento divino.
theological_decisions:
- issue: Distinção entre os nomes divinos יָהּ e אֲדֹנָי
  choice: Traduzir יָהּ por “Yah” e אֲדֹנָי por “Senhor”
  alternative: Traduzir ambos com formas de “Senhor”
  rationale: O hebraico emprega duas designações distintas na mesma invocação. Manter essa distinção preserva a forma poética e evita nivelar o nome abreviado e o título divino.
- issue: Sentido da ação divina em תִּשְׁמָר
  choice: “levasses em conta” as iniquidades
  alternative: “vigiasses” ou “mantivesses um registro” das iniquidades
  rationale: O contexto aponta para conservar os pecados em consideração para julgamento, não apenas percebê-los. A formulação mantém essa dimensão judicial sem especificar além do que o contexto permite.
translation_notes:
  register: Português moderno, claro e digno, com construção hipotética natural. “Iniquidades” retém o peso do termo hebraico; “permanecer de pé” conserva a imagem original. A transliteração “Yah” mantém a distinção entre o nome divino abreviado e o título “Senhor”.
