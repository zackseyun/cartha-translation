  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: pt
  text: Minha alma espera pelo Senhor mais do que os vigias esperam pela manhã[a], mais do que os vigias esperam pela manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha alma se volta para o Senhor mais do que os vigias para a manhã.” O hebraico não traz verbo explícito na primeira oração; “espera” é suprido a partir do contexto do salmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Minha alma
  rationale: Preserva a imagem poética de נֶפֶשׁ com sufixo de primeira pessoa e expressa o próprio ser em sua profunda esperança, sem reduzi-lo simplesmente a “eu”.
- source_word: לַאדֹנָי
  choice: pelo Senhor
  rationale: A preposição ל indica aqui o objeto ou a direção da espera. Com o verbo suprido pelo contexto, “espera pelo Senhor” é natural em português.
- source_word: מִשֹּׁמְרִים
  choice: mais do que os vigias
  rationale: מִן tem valor comparativo, e o particípio plural שֹׁמְרִים designa os que montam guarda; “vigias” comunica de modo claro a imagem da vigília noturna.
- source_word: לַבֹּקֶר
  choice: pela manhã
  rationale: בֹּקֶר significa “manhã”. Nesta construção, “esperar pela manhã” expressa naturalmente a expectativa de sua chegada e permite conservar a repetição hebraica.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: os vigias pela manhã
  rationale: A segunda ocorrência repete a imagem para intensificar a expectativa; a tradução mantém essa repetição em vez de suavizá-la.
theological_decisions:
- issue: Tradução de אֲדֹנָי como título divino
  choice: o Senhor
  alternative: meu Senhor
  rationale: O referente é Deus, e “o Senhor” é a forma reverente, clara e amplamente reconhecida em português, sem acrescentar ao texto um possessivo explícito na tradução.
- issue: Verbo elíptico na primeira oração
  choice: suprir “espera”
  alternative: 'manter uma construção nominal: “Minha alma está voltada para o Senhor”'
  rationale: O hebraico não apresenta verbo explícito neste versículo, mas o contexto imediato do salmo, especialmente o verbo “esperar” no versículo anterior, sustenta a elipse. A nota preserva a ambiguidade formal.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira. Conserva “minha alma”, o título divino “Senhor” e a repetição enfática do hebraico. A forma “vigias” evita o caráter marcado por gênero de “sentinelas” sem perder a imagem da guarda noturna.
