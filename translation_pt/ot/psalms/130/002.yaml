base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: pt
  text: Senhor, ouve a minha voz; estejam os teus ouvidos atentos à voz das minhas súplicas por misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «minhas súplicas». O termo hebraico indica pedidos insistentes por favor ou misericórdia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Título divino em vocativo; «Senhor» é a forma natural e reverente em português, sem confundi-lo explicitamente com o Tetragrama.
- source_word: שִׁמְעָה
  choice: ouve
  rationale: Imperativo dirigido a Deus; preserva de modo direto a força da súplica.
- source_word: בְּקוֹלִי
  choice: a minha voz
  rationale: Mantém a imagem concreta do hebraico e forma uma expressão idiomática com «ouve».
- source_word: תִּהְיֶינָה
  choice: estejam
  rationale: O imperfeito tem aqui valor volitivo; o subjuntivo português comunica naturalmente o pedido.
- source_word: אָזְנֶיךָ
  choice: os teus ouvidos
  rationale: Conserva a linguagem antropomórfica concreta e poética do texto hebraico.
- source_word: קַשֻּׁבוֹת
  choice: atentos
  rationale: Expressa prontidão e atenção ao ouvir em linguagem atual e digna.
- source_word: לְקוֹל
  choice: à voz
  rationale: Preserva a repetição de קוֹל e o paralelismo poético do versículo.
- source_word: תַּחֲנוּנָי
  choice: minhas súplicas por misericórdia
  rationale: Comunica pedidos insistentes de favor ou compaixão; «súplicas» preserva a solenidade, enquanto «por misericórdia» explicita a nuance lexical sem acrescentar doutrina.
theological_decisions:
- issue: Linguagem antropomórfica sobre a atenção de Deus
  choice: «estejam atentos os teus ouvidos»
  alternative: «escuta-me com atenção»
  rationale: A formulação escolhida conserva a imagem corporal explícita e a força relacional da poesia hebraica.
- issue: Sentido penitencial de תַּחֲנוּנָי
  choice: «minhas súplicas por misericórdia»
  alternative: «minhas súplicas»
  rationale: A tradução mantém a ideia de pedidos insistentes por favor ou misericórdia sem definir além disso o fundamento teológico do pedido.
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a repetição de «voz» e a imagem concreta dos «ouvidos».
