  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: pt
  text: Mas contigo está o perdão, para que sejas temido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejas reverenciado”. O hebraico diz “temido”, muitas vezes no sentido de temor reverente diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: Embora a partícula muitas vezes signifique “pois”, aqui ela contrasta o perdão que está com Deus com a impossibilidade de subsistir sob o julgamento mencionada no versículo anterior.
- source_word: עִמְּךָ
  choice: contigo
  rationale: Reproduz naturalmente a ideia de que o perdão se encontra com Deus ou lhe pertence.
- source_word: הַסְּלִיחָה
  choice: o perdão
  rationale: Equivalente claro e atual para o substantivo hebraico, preservando seu peso teológico.
- source_word: לְמַעַן
  choice: para que
  rationale: Mantém a relação de propósito ou resultado expressa pelo hebraico.
- source_word: תִּוָּרֵא
  choice: sejas temido
  rationale: Traduz diretamente o nifal de ירא e conserva a tensão bíblica do temor reverente diante de Deus, sem reduzi-lo no texto principal a mera admiração.
theological_decisions:
- issue: A resposta produzida pelo perdão divino
  choice: O perdão leva a que Deus seja temido.
  alternative: O perdão leva a que Deus seja reverenciado.
  rationale: O hebraico emprega explicitamente o verbo ירא, “temer”. A tradução principal preserva essa forma lexical, enquanto a nota esclarece que, neste contexto, o temor inclui reverência e assombro diante de Deus, não apenas pavor.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Contigo está o perdão” mantém de modo conciso a imagem hebraica; “sejas temido” preserva deliberadamente a tensão teológica do original.
