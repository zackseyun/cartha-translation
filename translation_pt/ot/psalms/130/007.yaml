source:
  edition: WLC
  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: pt
  text: Israel, espere por Yahweh[a], pois com Yahweh está o amor leal, e com ele há abundante redenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ponha a esperança em Yahweh”. O verbo hebraico inclui a ideia de esperar com esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֵל
  choice: espere
  rationale: O verbo יחל reúne as ideias de esperar e ter esperança. “Espere” preserva a imagem verbal da espera confiante, enquanto a nota registra a alternativa legítima.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio do povo da aliança, mantido em sua forma portuguesa consagrada.
- source_word: אֶל יְהוָה
  choice: por Yahweh
  rationale: Com o verbo “esperar”, a preposição אֶל é expressa de modo idiomático em português por “por”, indicando expectativa dirigida a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação com uma conjunção causal natural e digna em português.
- source_word: עִם יְהוָה
  choice: com Yahweh está
  rationale: Preserva de perto a construção hebraica com עִם e prepara o paralelismo com “com ele”.
- source_word: הַחֶסֶד
  choice: o amor leal
  rationale: Expressa חֶסֶד como amor marcado por lealdade e constância, sem restringi-lo a uma formulação técnica.
- source_word: וְהַרְבֵּה
  choice: abundante
  rationale: Comunica a grande quantidade ou plenitude destacada pelo hebraico e forma uma combinação natural com “redenção”.
- source_word: עִמּוֹ
  choice: com ele há
  rationale: Conserva a repetição preposicional e o paralelismo do hebraico, com referência clara a Yahweh.
- source_word: פְדוּת
  choice: redenção
  rationale: Preserva o sentido de resgate e libertação, bem como o peso teológico do termo no contexto do salmo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance de יחל na exortação
  choice: espere por Yahweh
  alternative: ponha a esperança em Yahweh
  rationale: O verbo abrange tanto espera quanto esperança. O texto principal mantém a imagem da espera confiante, e a nota preserva a outra possibilidade sem eliminar a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético “com Yahweh... com ele” e evita linguagem denominacional.
