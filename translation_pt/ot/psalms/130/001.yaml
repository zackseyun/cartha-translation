  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: pt
  text: Cântico das Subidas[a]. Das profundezas clamo a ti[b], ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Cântico das Subidas», título tradicional deste grupo de salmos. A expressão também pode ser entendida como «Cântico de subida»; seu contexto histórico exato é incerto.'
    reason: cultural_note
  - marker: b
    text: 'Ou: «Das profundezas clamei a ti, ó Yahweh». A forma verbal hebraica pode ser entendida como passado; o texto principal usa o presente para preservar a imediatez da oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: O substantivo designa uma canção. «Cântico» é natural e digno em um título poético, sem acrescentar o gênero mais específico de «salmo».
- source_word: הַמַּעֲלוֹת
  choice: das Subidas
  rationale: O plural deriva de עלה, «subir». A tradução preserva o título tradicional desta coleção sem definir se as subidas eram peregrinações, degraus ou outra realidade histórica.
- source_word: מִמַּעֲמַקִּים
  choice: Das profundezas
  rationale: Mantém a imagem plural hebraica de lugares profundos, empregada aqui para expressar aflição extrema, em formulação portuguesa clara e poética.
- source_word: קְרָאתִיךָ
  choice: clamo a ti
  rationale: קרא significa chamar ou clamar. O presente comunica a imediatez da oração e sua intensidade; a forma hebraica também admite tradução no passado, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título como «SENHOR».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal e não o substitui por um título.
- issue: Valor temporal de קְרָאתִיךָ
  choice: clamo a ti
  alternative: clamei a ti / tenho clamado a ti
  rationale: Embora a forma qatal possa indicar ação passada, o presente preserva a força imediata da oração sem excluir a leitura passada, indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Das profundezas» conserva a imagem poética; «clamo a ti» mantém a urgência sem exagerar o verbo; «ó» marca naturalmente o vocativo.
