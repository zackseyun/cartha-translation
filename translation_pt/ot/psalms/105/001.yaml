  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: pt
  text: Deem graças a Yahweh[a]; invoquem o seu nome; tornem conhecidos entre os povos os seus feitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, tradicionalmente vocalizado “Yahweh”; algumas traduções trazem “SENHOR”.'
    reason: Identifica o nome divino e registra a tradução tradicional alternativa.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Deem graças
  rationale: O imperativo plural hiphil de ידה, seguido de לַיהוָה, expressa ação de graças ou louvor. “Deem graças” é natural em português e preserva a linguagem própria de gratidão.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ marca o destinatário das graças, e o nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: invoquem o seu nome
  rationale: A construção קרא בְּשֵׁם pode indicar invocar ou chamar pelo nome. “Invoquem o seu nome” preserva de modo natural o sentido de oração e culto.
- source_word: הוֹדִיעוּ
  choice: tornem conhecidos
  rationale: O hiphil de ידע tem força causativa, literalmente “façam conhecer”. “Tornem conhecidos” conserva essa força e concorda naturalmente com o objeto plural.
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: A preposição בְּ é representada por “entre”, e עַמִּים por “povos”, mantendo o alcance internacional sem restringi-lo a entidades políticas.
- source_word: עֲלִילוֹתָיו
  choice: os seus feitos
  rationale: O substantivo designa atos ou obras. “Feitos” é amplo e fiel, sem acrescentar a qualificação “poderosos”, ausente do termo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título; a nota identifica a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Invoquem” mantém o tom de culto; “tornem conhecidos” expressa a forma causativa hebraica sem rigidez excessiva.
