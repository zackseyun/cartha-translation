id: PSA.105.23
reference: Psalms 105:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: pt
  text: Então Israel foi para o Egito, e Jacó viveu como estrangeiro[a] na terra de Cam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residiu como forasteiro”; o verbo hebraico destaca que ele morava ali sem ser natural do lugar.
    reason: lexical_alternative
  - marker: b
    text: “Terra de Cam” é uma designação poética do Egito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foi para
  rationale: O wayyiqtol de בוא dá sequência à narrativa. Em português, “foi para o Egito” expressa naturalmente o deslocamento até o lugar, enquanto “entrou no Egito” seria possível, mas mais específico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio e o paralelismo poético com “Jacó”; no contexto, o patriarca também representa o povo.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: וְיַעֲקֹב
  choice: e Jacó
  rationale: Preserva o segundo nome presente no paralelismo hebraico, sem substituí-lo por pronome nem fundi-lo com “Israel”.
- source_word: גָּר
  choice: viveu como estrangeiro
  rationale: O verbo גור indica residir em um lugar sem ser natural dali, muitas vezes em condição temporária. A formulação é clara e atual, sem o tom arcaico de “peregrinou”.
- source_word: בְּאֶרֶץ
  choice: na terra de
  rationale: Tradução natural de אֶרֶץ neste topônimo poético.
- source_word: חָם
  choice: Cam
  rationale: Usa a forma portuguesa tradicional do nome próprio e conserva a designação poética “terra de Cam” em vez de substituí-la por “Egito”.
theological_decisions:
- issue: Se o paralelismo poético “Israel // Jacó” deve ser reduzido a um único nome
  choice: Conservar os dois nomes no texto principal
  alternative: “Então Jacó foi para o Egito e viveu como estrangeiro na terra de Cam” ou “Então Israel foi para o Egito e viveu como estrangeiro na terra de Cam”
  rationale: O hebraico emprega intencionalmente os dois nomes em paralelismo. Mantê-los preserva a textura poética e a identificação representativa entre o patriarca e o povo, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça junto da expressão que explica.
