  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a slave.
translation:
  language: pt
  text: Ele enviou um homem adiante deles; José foi vendido como escravo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: enviou
  rationale: O qal perfeito, com Deus como sujeito implícito no contexto, é expresso de modo direto e natural por “enviou”.
- source_word: לִפְנֵיהֶם
  choice: adiante deles
  rationale: 'A expressão significa literalmente “diante deles”, mas aqui tem sentido temporal e preparatório: José foi enviado antes da chegada dos demais. “Adiante deles” preserva essa nuance em português natural.'
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do hebraico e prepara a identificação de José no segundo membro.
- source_word: לְעֶבֶד
  choice: como escravo
  rationale: O לְ indica aqui a condição ou resultado em que José foi posto. “Escravo” explicita o vínculo coercitivo salientado pelo ato de ser vendido.
- source_word: נִמְכַּר
  choice: foi vendido
  rationale: Tradução direta da forma nifal passiva de מכר, em conformidade com a narrativa da venda de José.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Tradução de עֶבֶד no contexto da venda de José
  choice: escravo
  alternative: servo
  rationale: Embora עֶבֶד possa significar “servo” em outros contextos, o verbo “foi vendido” torna evidente a condição coercitiva de José; “escravo” é, portanto, a opção mais precisa.
translation_notes:
  register: Português moderno, claro e digno, com ordem frasal próxima do paralelismo hebraico. O ponto e vírgula preserva a relação entre o envio providencial e a venda de José sem explicitar além do que o texto afirma.
