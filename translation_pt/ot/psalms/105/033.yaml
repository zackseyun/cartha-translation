  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: pt
  text: Ele atingiu suas videiras e suas figueiras e despedaçou as árvores do território deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ele atingiu
  rationale: O verbo נכה expressa a ação direta de golpear ou atingir. “Atingiu” é atual, claro e adequado ao dano causado pelo granizo no contexto.
- source_word: גַּפְנָם
  choice: suas videiras
  rationale: גֶּפֶן designa a videira. O plural natural em português comunica o sentido coletivo das plantações pertencentes a eles.
- source_word: וּתְאֵנָתָם
  choice: e suas figueiras
  rationale: תְּאֵנָה significa “figueira”. Embora a forma hebraica seja singular com sufixo, o uso é coletivo e o plural distributivo é natural em português.
- source_word: וַיְשַׁבֵּר
  choice: e despedaçou
  rationale: A forma intensiva de שׁבר indica quebra violenta e destrutiva; “despedaçou” preserva essa força.
- source_word: עֵץ
  choice: as árvores
  rationale: Neste contexto, עֵץ se refere às árvores em pé, não à madeira como material. O plural exprime naturalmente a referência coletiva.
- source_word: גְּבוּלָם
  choice: do território deles
  rationale: גְּבוּל pode indicar limite, fronteira ou território. Aqui, “território” preserva a relação genitiva com as árvores e oferece sentido claro sem transformar a expressão em uma locução espacial mais interpretativa.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: “Ele”, referindo-se a Deus
  alternative: Repetir explicitamente “Deus” ou “o SENHOR”
  rationale: O hebraico apresenta verbos na terceira pessoa masculina singular e deixa o sujeito subentendido pelo contexto, que narra os atos do SENHOR no Egito. “Ele” torna o sujeito gramaticalmente explícito em português sem especificá-lo além do texto imediato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo e a força destrutiva dos verbos hebraicos. Não se incluiu a nota inglesa ligada a “figueiras”, pois a alternativa nela apresentada corresponde lexicalmente a גְּבוּלָם e não a תְאֵנָתָם; além disso, a tradução principal já preserva de modo direto a construção hebraica.
