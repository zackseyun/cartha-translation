  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: pt
  text: Deu-lhes granizo em vez de chuva e fogo flamejante[a] em sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “relâmpagos” ou “raios de fogo”; a expressão hebraica diz literalmente “fogo de chamas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: Deu-lhes
  rationale: Mantém o sentido comum de נתן, “dar”, e expressa de modo natural a ação divina no contexto da praga.
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: granizo em vez de chuva
  rationale: Expressa naturalmente que o granizo tomou o lugar da chuva deles, sem recorrer à formulação portuguesa pouco idiomática “deu suas chuvas como granizo”.
- source_word: בָּרָד
  choice: granizo
  rationale: É o equivalente direto e usual do termo hebraico, em consonância com o relato da praga.
- source_word: אֵשׁ לֶהָבוֹת
  choice: fogo flamejante
  rationale: Preserva a imagem intensificada de “fogo” e “chamas” sem restringi-la interpretativamente a relâmpagos.
- source_word: בְּאַרְצָם
  choice: em sua terra
  rationale: Traduz diretamente a preposição e o sufixo possessivo; no contexto, refere-se à terra dos egípcios.
theological_decisions:
- issue: Natureza de אֵשׁ לֶהָבוֹת no contexto da praga
  choice: fogo flamejante
  alternative: relâmpagos; raios de fogo
  rationale: O contexto de Êxodo pode sugerir relâmpagos, mas o hebraico apresenta literalmente uma imagem de fogo e chamas. A tradução principal conserva essa amplitude, e a nota registra as interpretações contextuais.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. O marcador foi colocado junto de “fogo flamejante”, expressão à qual a nota lexical se refere.
