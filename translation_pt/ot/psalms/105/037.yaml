base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: pt
  text: Ele os fez sair com prata e ouro, e entre as suas tribos não havia quem tropeçasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia nenhum fraco entre as suas tribos”. O particípio hebraico pode indicar tropeço, vacilação ou fraqueza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Ele os fez sair
  rationale: 'O hifil de יצא expressa ação causativa: Deus fez o povo sair. A formulação preserva de modo claro a agência divina e corresponde ao contexto do êxodo.'
- source_word: בְּכֶסֶף וְזָהָב
  choice: com prata e ouro
  rationale: 'A preposição ב indica aqui acompanhamento ou posse: eles saíram levando prata e ouro. A tradução evita acrescentar a ideia não expressa de estarem carregados.'
- source_word: וְאֵין
  choice: e ... não havia
  rationale: A construção existencial אין é vertida naturalmente por “não havia”, mantendo a estrutura negativa da oração.
- source_word: בִּשְׁבָטָיו
  choice: entre as suas tribos
  rationale: שׁבט significa “tribo” neste contexto. O possessivo “suas” preserva a forma masculina singular do hebraico e pode remeter a Israel entendido coletivamente, sem tornar o referente excessivamente explícito.
- source_word: כּוֹשֵׁל
  choice: quem tropeçasse
  rationale: O particípio de כשל pode indicar alguém que tropeça, vacila ou está fraco. “Quem tropeçasse” conserva a imagem verbal concreta e permite que o contexto sugira debilidade sem a impor no texto principal.
theological_decisions:
- issue: Referente do sufixo singular em בִּשְׁבָטָיו (“suas tribos”)
  choice: 'Manter o possessivo sem explicitar além do hebraico: “suas tribos”, entendendo Israel/Jacó coletivamente.'
  alternative: “entre as tribos deles”, fazendo concordar o possessivo com a pluralidade do povo mencionado.
  rationale: O hebraico apresenta um sufixo masculino singular, compatível com Israel como entidade coletiva. Em português, “suas” não marca gênero nem número do possuidor e preserva produtivamente a ambiguidade do referente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Fez sair” mantém a nuance causativa do hebraico; “tropeçasse” conserva sua imagem concreta. O marcador [a] foi colocado após a oração à qual a alternativa se refere.
