  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: pt
  text: Eles pediram[a], e ele trouxe codornizes; saciou-os com o pão do céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz o verbo no singular, literalmente: “Ele pediu”; provavelmente tem sentido coletivo e se refere ao povo de Israel.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pão vindo do céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאַל
  choice: Eles pediram
  rationale: Embora a forma hebraica seja um verbo no singular, o contexto aponta coletivamente para o povo de Israel; o plural comunica esse sentido com naturalidade, enquanto a forma singular é registrada em nota.
- source_word: וַיָּבֵא
  choice: e ele trouxe
  rationale: O hifil de בוא expressa fazer vir ou trazer; aqui Deus é o sujeito implícito, e «trouxe» preserva naturalmente o valor causativo.
- source_word: שְׂלָו
  choice: codornizes
  rationale: É o sentido lexical usual do termo para as aves providas por Deus no deserto.
- source_word: לֶחֶם שָׁמַיִם
  choice: o pão do céu
  rationale: Reproduz de perto a construção hebraica e conserva a linguagem poética; «pão vindo do céu» explicitaria a origem, mas seria menos formal.
- source_word: יַשְׂבִּיעֵם
  choice: saciou-os
  rationale: O hifil de שׂבע significa satisfazer, fartar ou saciar. «Saciou-os» transmite tanto a provisão quanto a plena satisfação, em linguagem digna e concisa.
theological_decisions:
- issue: Sujeito do verbo inicial שָׁאַל
  choice: 'Entendido coletivamente como Israel/o povo: «Eles pediram».'
  alternative: 'Conservar o singular formal: «Ele pediu», talvez em referência coletiva a Israel ou a um representante do povo.'
  rationale: O contexto relata os atos de Deus em favor de Israel no deserto, e o sufixo plural em «saciou-os» favorece a referência coletiva. A nota preserva a forma gramatical singular do hebraico sem impor uma identificação específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo conciso e a imagem poética do hebraico.
