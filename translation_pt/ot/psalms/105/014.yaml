  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: pt
  text: Não permitiu que ninguém os oprimisse; repreendeu reis por causa deles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: permitiu
  rationale: No hifil de נוח, a construção expressa não deixar ou não permitir que algo aconteça. “Não permitiu” é natural e claro em português.
- source_word: אָדָם
  choice: ninguém
  rationale: Embora o hebraico use o singular genérico “homem/pessoa”, após a negação a forma idiomática portuguesa “ninguém” preserva precisamente o sentido de que pessoa alguma recebeu permissão para oprimi-los.
- source_word: לְעָשְׁקָם
  choice: que ... os oprimisse
  rationale: עשק abrange opressão, exploração e tratamento injusto. “Oprimisse” conserva sua força ampla e se encaixa naturalmente na oração subordinada exigida por “permitiu”.
- source_word: וַיּוֹכַח
  choice: repreendeu
  rationale: יכח aqui indica censura ou reprovação dirigida a reis; “repreendeu” transmite de modo conciso a força verbal do hebraico.
- source_word: עֲלֵיהֶם
  choice: por causa deles
  rationale: על com o sufixo indica que a repreensão ocorreu em razão deles ou em favor deles. “Por causa deles” mantém a relação causal sem especificar além do texto.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente direto e específico de מְלָכִים, sem ampliar indevidamente para governantes em geral.
