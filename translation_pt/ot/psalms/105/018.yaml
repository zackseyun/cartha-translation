  text: Afligiram-lhe os pés com grilhões; sua alma entrou no ferro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu pescoço entrou no ferro”, isto é, foi posto numa coleira ou corrente de ferro. O hebraico diz literalmente “sua alma entrou no ferro”, expressão difícil; “alma” pode também referir-se à pessoa ou à vida e, neste contexto, alguns a entendem como referência à garganta ou ao pescoço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: Prenderam-lhe
  rationale: O piel de ענה indica afligir ou maltratar. No paralelismo carcerário, a formulação expressa concretamente a aflição sem identificar agentes que o hebraico deixa indefinidos.
- source_word: בַכֶּבֶל
  choice: em grilhões
  rationale: כבל designa grilhão, algema ou corrente de prisão; “grilhões” é claro, corrente e adequado ao contexto.
- source_word: רַגְלָיו
  choice: os pés
  rationale: É a referência direta e habitual da forma hebraica neste contexto.
- source_word: בַּרְזֶל
  choice: no ferro
  rationale: Mantém o substantivo concreto “ferro” sem acrescentar ao texto principal “coleira”, “corrente” ou outro objeto não explicitado.
- source_word: בָּאָה נַפְשׁוֹ
  choice: seu ser entrou
  rationale: נַפְשׁוֹ é o sujeito feminino de בָּאָה. “Seu ser” preserva a referência à pessoa inteira e evita o sentido moderno excessivamente incorpóreo de “alma”, embora a expressão poética permaneça deliberadamente incomum.
