  text: Ele transformou as águas deles em sangue e fez morrer os seus peixes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: transformou
  rationale: O verbo pode significar virar, mudar ou transformar. Neste contexto, “transformou” expressa com naturalidade a mudança das águas em sangue.
- source_word: מֵימֵיהֶם
  choice: as águas deles
  rationale: Preserva o plural hebraico e se refere coletivamente às águas do Egito, mantendo claro o referente humano do sufixo.
- source_word: לְדָם
  choice: em sangue
  rationale: A preposição לְ indica o estado resultante; “em sangue” é a construção portuguesa natural após “transformou”.
- source_word: וַיָּמֶת
  choice: fez morrer
  rationale: A forma hifil é causativa. “Fez morrer” preserva essa nuance de modo claro, sem substituí-la pelo mais interpretativo “matou”.
- source_word: דְּגָתָם
  choice: os seus peixes
  rationale: O substantivo designa coletivamente os peixes; a formulação é corrente e mantém o sufixo possessivo.
