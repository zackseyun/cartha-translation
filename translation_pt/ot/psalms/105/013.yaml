lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: andavam
  rationale: O hitpael de הלך expressa aqui movimento repetido de um lugar para outro. “Andavam” é natural em português e mantém essa ideia sem impor necessariamente a conotação de desorientação presente em “vagavam”.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de nação em nação
  rationale: Preserva a repetição e o sentido idiomático do hebraico para o deslocamento entre diferentes grupos político-étnicos.
- source_word: מִמַּמְלָכָה
  choice: de um reino
  rationale: O artigo indefinido torna natural em português a construção correlativa, sem acrescentar uma numeração enfática ausente no hebraico.
- source_word: אֶל עַם אַחֵר
  choice: para outro povo
  rationale: “Povo” preserva a distinção lexical entre עַם e מַמְלָכָה, enquanto “outro” traduz diretamente אַחֵר.
