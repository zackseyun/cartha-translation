  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: pt
  text: Ele enviou Moisés, seu servo, e Arão, que havia escolhido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolheu”. O verbo hebraico também pode ser traduzido pelo pretérito perfeito simples; “havia escolhido” explicita que a escolha de Arão ocorreu antes de ele ser enviado.
    reason: alternativa lexical e temporal
lexical_decisions:
- source_word: שָׁלַח
  choice: Ele enviou
  rationale: O qal perfeito na terceira pessoa masculina singular significa “enviou”. O pronome “Ele” conserva o sujeito implícito, identificado pelo contexto como Deus.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: עֶבֶד com sufixo de terceira pessoa masculina singular pode significar “servo” ou “escravo”; neste contexto honorífico, referente a Moisés como agente de Deus, “servo” é a opção natural e adequada.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲשֶׁר
  choice: a quem
  rationale: Introduz uma oração relativa cujo antecedente pessoal é Arão; “a quem” produz português claro e natural.
- source_word: בָּחַר בּוֹ
  choice: havia escolhido
  rationale: בחר com ב expressa a escolha de uma pessoa. O mais-que-perfeito composto esclarece naturalmente que a escolha de Arão antecedeu seu envio, sem excluir a possibilidade formal do pretérito perfeito simples.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: “Ele”, referindo-se a Deus
  alternative: Explicitar “O SENHOR enviou” ou omitir o pronome em português
  rationale: O hebraico traz apenas a flexão verbal de terceira pessoa masculina singular, e o contexto identifica Deus como agente. “Ele” preserva o fluxo do texto sem inserir o nome divino, ausente neste versículo.
- issue: Relação temporal da escolha de Arão com seu envio
  choice: “havia escolhido”
  alternative: “escolheu”
  rationale: O mais-que-perfeito torna explícita a anterioridade lógica da escolha, mas a forma verbal hebraica também admite tradução pelo pretérito perfeito simples; essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A conjunção “e” foi acrescentada para coordenar naturalmente os dois objetos em português. A formulação mantém o pronome divino sem substituir por um título não expresso no hebraico.
