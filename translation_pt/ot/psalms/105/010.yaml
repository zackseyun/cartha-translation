  text: וַ/יַּֽעֲמִידֶ֣/הָ לְ/יַעֲקֹ֣ב לְ/חֹ֑ק לְ֝/יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: pt
  text: Ele a confirmou[a] a Jacó como estatuto, a Israel como aliança eterna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a estabeleceu”. O verbo hebraico pode ter o sentido de fazer algo permanecer firme.
    reason: lexical_alternative
  - marker: b
    text: Ou “aliança perpétua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Ele a confirmou
  rationale: O hifil de עמד expressa aqui a ideia de fazer permanecer firme, estabelecer ou confirmar. “Confirmou” é natural em português e comunica a força da ratificação no contexto da aliança; o pronome feminino “a” preserva a referência anafórica sem identificar de modo excessivamente específico o antecedente.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ marca o destinatário ou beneficiário; “a Jacó” mantém essa relação de modo direto e natural.
- source_word: לְחֹק
  choice: como estatuto
  rationale: חֹק designa algo fixado ou prescrito. “Estatuto” conserva a nuance formal e jurídica apropriada ao contexto da aliança.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: Mantém o paralelismo com “a Jacó” e a construção do hebraico.
- source_word: בְּרִית עוֹלָם
  choice: como aliança eterna
  rationale: בְּרִית é o termo habitual para “aliança”, e עוֹלָם indica duração indefinida, permanente ou eterna. “Aliança eterna” é clara, solene e corrente em português bíblico contemporâneo.
theological_decisions:
- issue: Referente do sufixo feminino em וַיַּעֲמִידֶהָ
  choice: Preservar a referência anafórica com “a”, sem explicitar se o antecedente é a promessa, a palavra jurada ou a aliança do contexto anterior.
  alternative: Traduzir explicitamente por “confirmou a promessa”, “confirmou o juramento” ou “confirmou a aliança”.
  rationale: O contexto imediato reúne linguagem de aliança, palavra e juramento. A forma pronominal preserva a coesão e a ambiguidade do texto hebraico, evitando restringir indevidamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Estatuto” preserva o tom formal do hebraico sem recorrer a linguagem arcaica; “aliança eterna” mantém a expressão tradicional e inteligível.
