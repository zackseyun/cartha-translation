  text: אֲשֶׁ֣ר כָּ֭רַת אֶת אַבְרָהָ֑ם וּ/שְׁב֖וּעָת֣/וֹ לְ/יִשְׂחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/009.yaml
  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: pt
  text: que ele fez com Abraão[a], e o seu juramento a Isaque,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “que ele cortou com Abraão”, expressão idiomática para fazer uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo que liga o versículo à aliança mencionada no versículo anterior, de modo natural em português.
- source_word: כָּרַת
  choice: fez
  rationale: No contexto de aliança, o verbo integra a expressão idiomática hebraica literalmente equivalente a “cortar uma aliança”. Como “aliança” é retomada do versículo anterior, “fez” comunica naturalmente o sentido em português.
- source_word: אֶת אַבְרָהָם
  choice: com Abraão
  rationale: Embora אֶת marque Abraão como objeto na construção hebraica, em português uma aliança é feita “com” alguém.
- source_word: וּשְׁבוּעָתוֹ
  choice: e o seu juramento
  rationale: Preserva a forma nominal “juramento” e o sufixo masculino singular, cujo referente é Deus no contexto.
- source_word: לְיִשְׂחָק
  choice: a Isaque
  rationale: A preposição ל indica aquele a quem o juramento foi dirigido; “a Isaque” é uma formulação concisa e natural.
theological_decisions:
- issue: A palavra “aliança” está implícita por retomada do versículo anterior
  choice: que ele fez com Abraão
  alternative: que ele cortou com Abraão; que ele fez a Abraão
  rationale: A tradução mantém a ligação com “aliança” no versículo 8 sem repetir desnecessariamente o substantivo nem reproduzir de modo obscuro o idioma hebraico. “Com Abraão” expressa naturalmente a relação de aliança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa. “Isaque” segue a forma bíblica tradicional e amplamente reconhecida. A vírgula final preserva a continuidade sintática com o versículo seguinte.
