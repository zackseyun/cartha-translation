  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/038.yaml
  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: pt
  text: O Egito se alegrou quando eles saíram, pois o medo que eles causavam tinha caído sobre os egípcios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: se alegrou
  rationale: O qal perfeito descreve a reação completa do sujeito coletivo; “se alegrou” é natural, digno e preserva a intensidade positiva do verbo.
- source_word: מִצְרַיִם
  choice: O Egito
  rationale: O nome designa coletivamente a nação ou seu povo e permanece sujeito singular, acompanhando de perto a forma hebraica.
- source_word: בְּצֵאתָם
  choice: quando eles saíram
  rationale: A preposição ב com o infinitivo construto de יצא e sufixo de terceira pessoa masculina plural expressa circunstância temporal; o pronome se refere aos israelitas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da alegria do Egito, de modo conciso e natural.
- source_word: נָפַל
  choice: tinha caído
  rationale: O mais-que-perfeito explicita em português a condição anterior que explica a reação do Egito, preservando também a imagem verbal hebraica.
- source_word: פַּחְדָּם
  choice: o medo deles
  rationale: פחד denota medo ou pavor. O sufixo aponta para os israelitas como causa ou objeto do medo; a expressão preserva essa relação sem elevar indevidamente a intensidade a “terror”.
- source_word: עֲלֵיהֶם
  choice: sobre os egípcios
  rationale: A preposição indica aqueles sobre quem o medo havia caído. A explicitação do referente evita a sequência ambígua de pronomes em português sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura brasileira ampla. A formulação conserva “O Egito” como sujeito coletivo do hebraico, mas explicita “os egípcios” no fim para distinguir seu referente dos israelitas mencionados pelo pronome anterior.
