  text: לֶ/אְסֹ֣ר שָׂרָ֣י/ו בְּ/נַפְשׁ֑/וֹ וּ/זְקֵנָ֥י/ו יְחַכֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/022.yaml
  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: pt
  text: 'para prender os príncipes dele conforme a sua vontade[a]

    e ensinar sabedoria aos seus anciãos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “prender os seus príncipes com/por sua alma”; a expressão hebraica pode significar “conforme a sua vontade” ou “como desejasse”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornar sábios os seus anciãos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: prender
  rationale: O infinitivo construto de אסר expressa propósito ou resultado em relação ao versículo anterior. “Prender” conserva a ideia ampla de restringir ou deter sem especificar indevidamente correntes ou prisão.
- source_word: שָׂרָיו
  choice: os príncipes dele
  rationale: שַׂר pode designar príncipe, chefe ou alto funcionário. “Príncipes” preserva o tom elevado e cortesão; “dele” deixa claro que se trata dos príncipes do rei mencionado no contexto.
- source_word: בְּנַפְשׁוֹ
  choice: conforme a sua vontade
  rationale: Literalmente, “com/por sua alma”. Aqui נֶפֶשׁ tem valor idiomático de desejo ou vontade; a formulação comunica esse sentido em português natural, preservando no texto a possível ambiguidade do referente do pronome.
- source_word: וּזְקֵנָיו
  choice: e aos seus anciãos
  rationale: זָקֵן significa literalmente “ancião” e, em contexto governamental, pode indicar líderes ou conselheiros seniores. “Anciãos” conserva tanto a idade quanto a posição social.
- source_word: יְחַכֵּם
  choice: ensinar sabedoria
  rationale: O piel de חכם pode significar “tornar sábio” ou “ensinar sabedoria”. A escolha expressa com clareza a força causativa e instrutiva.
