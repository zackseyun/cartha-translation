  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: pt
  text: Até o tempo em que se cumpriu a palavra dele[a], a palavra de Yahweh o pôs à prova[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A palavra dele” pode referir-se à palavra ou predição de José, que se cumpriu no devido tempo; alguns entendem que se trata da palavra de Deus a respeito de José.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o refinou”. O verbo evoca a purificação de metais e, em sentido figurado, significa pôr à prova ou comprovar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: Até o tempo
  rationale: Expressa naturalmente em português a duração que se estende até determinado momento, sem acrescentar a ideia não explícita de um tempo previamente marcado.
- source_word: בֹּא
  choice: se cumpriu
  rationale: Embora o verbo signifique literalmente “vir”, com “palavra” como sujeito indica de modo idiomático que o que foi dito se realizou.
- source_word: דְבָרוֹ
  choice: a palavra dele
  rationale: 'Mantém o substantivo “palavra” e a ambiguidade do sufixo masculino: no contexto, pode referir-se à palavra de José, mas também tem sido entendido como a palavra de Deus a respeito dele.'
- source_word: אִמְרַת
  choice: a palavra
  rationale: É uma forma clara e digna de traduzir o termo para declaração ou palavra pronunciada, preservando o paralelismo com o primeiro segmento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צְרָפָתְהוּ
  choice: o pôs à prova
  rationale: Comunica o sentido metafórico do verbo, usado literalmente para refinar ou purificar metal; a imagem concreta é preservada em nota.
theological_decisions:
- issue: Referente de “a palavra dele”
  choice: Manter o referente gramaticalmente aberto; no contexto, a leitura mais imediata é a palavra ou predição de José.
  alternative: A palavra de Deus a respeito de José.
  rationale: O sufixo hebraico permite a tensão entre as leituras. O contexto favorece a fala de José que veio a cumprir-se, enquanto o segundo segmento menciona explicitamente a palavra de Yahweh; a tradução não deve eliminar uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “A palavra dele” foi mantido para não resolver indevidamente o referente do pronome; “pôs à prova” torna explícito o sentido figurado, enquanto a nota conserva a metáfora metalúrgica.
