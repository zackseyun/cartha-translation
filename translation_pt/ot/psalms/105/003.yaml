source:
  edition: WLC
  text: הִֽ֭תְהַלְלוּ בְּ/שֵׁ֣ם קָדְשׁ֑/וֹ יִ֝שְׂמַ֗ח לֵ֤ב מְבַקְשֵׁ֬י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: pt
  text: Gloriem-se no seu santo nome[a]; alegre-se o coração dos que buscam Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Exultem no seu santo nome”. O verbo hebraico pode expressar exultação ou o ato de se orgulhar de alguém ou de algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Gloriem-se
  rationale: O hitpael imperativo plural de הלל expressa aqui exultação e orgulho confiante em alguém ou algo. “Gloriem-se” preserva a nuance reflexiva e combina naturalmente com “no seu santo nome”.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: no seu santo nome
  rationale: Mantém explicitamente o substantivo “nome” e a preposição ב, enquanto “santo” traduz de modo tradicional e claro a ideia de santidade.
- source_word: יִשְׂמַח
  choice: alegre-se
  rationale: 'Embora seja morfologicamente um imperfeito na terceira pessoa do singular, o contexto poético permite valor volitivo: um desejo ou uma exortação em paralelo com o imperativo anterior.'
- source_word: לֵב
  choice: o coração
  rationale: Preserva o singular coletivo hebraico e o sentido idiomático do centro interior da disposição, sem restringi-lo apenas às emoções.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: dos que buscam Yahweh
  rationale: O particípio construto caracteriza pessoas que procuram continuamente Yahweh; esta formulação é natural e preserva esse sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título, em correspondência direta com o Tetragrama.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem introduzir interpretação denominacional.
- issue: Valor de יִשְׂמַח
  choice: alegre-se
  alternative: se alegrará; que se alegre
  rationale: O paralelismo com o imperativo inicial favorece uma leitura volitiva, mas a construção continua concisa e não amplia o sentido além do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Gloriem-se” mantém o caráter poético e cultual sem soar excessivamente arcaico; o singular coletivo “o coração” segue de perto o hebraico.
