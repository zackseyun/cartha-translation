base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: pt
  text: Cantem a ele; cantem-lhe louvores; falem[a] de todas as suas maravilhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contem todas as suas maravilhas” ou “meditem em todas as suas maravilhas”. O verbo hebraico pode indicar tanto a meditação reflexiva quanto o relato falado; neste contexto de louvor, prefere-se o sentido público.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” é a equivalência portuguesa mais direta, natural e coerente com o chamado comunitário ao louvor.
- source_word: ל֭וֹ
  choice: a ele
  rationale: A preposição ל com sufixo pronominal indica aqui a direção ou o destinatário do canto. “A ele” expressa isso claramente em português.
- source_word: זַמְּרוּ ל֑וֹ
  choice: cantem-lhe louvores
  rationale: Em contextos de culto, זמר designa cantar ou fazer música em louvor. “Cantem-lhe louvores” preserva o paralelismo e o sentido cultual sem especificar instrumentos.
- source_word: שִׂ֝֗יחוּ
  choice: falem de
  rationale: שׂיח pode significar meditar, discorrer ou falar. Nesta sequência de imperativos públicos de louvor, “falem de” é o sentido contextual mais provável, sem apagar a alternativa reflexiva, registrada em nota.
- source_word: בְּכָל
  choice: de todas
  rationale: Após um verbo de fala, ב é vertido idiomaticamente por “de”; כָל conserva a abrangência de “todas”.
- source_word: נִפְלְאוֹתָֽיו
  choice: suas maravilhas
  rationale: O substantivo נִפְלָאוֹת refere-se aos feitos extraordinários de Deus que causam admiração. “Maravilhas” é natural, dignificado e pode designar tanto os feitos quanto seu caráter maravilhoso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com formas verbais no plural para preservar os imperativos hebraicos dirigidos à comunidade. A repetição de “cantem” mantém o paralelismo poético; “cantem-lhe” é corrente e evita uma formulação excessivamente coloquial.
