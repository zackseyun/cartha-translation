review_pass:
  verdict: revise
  source_fidelity: O verbo hebraico é singular e retoma o agente coletivo do contexto (a praga/enxame de gafanhotos). «Ele» é gramaticalmente possível, mas em português tende a sugerir um agente pessoal masculino e não deixa claro esse referente. Além disso, בְּאַרְצָם tem sentido locativo, melhor expresso por «na terra deles» do que por «da terra deles».
  naturalness: «O enxame devorou» é claro, natural e preserva o singular coletivo. A repetição de «devorou» mantém adequadamente o paralelismo hebraico.
  terminology: «Vegetação», «terra» para אֶרֶץ, «fruto» e «solo» para אַדָמָה são escolhas adequadas. A alternativa da nota b deve evitar acrescentar «toda», pois o hebraico explicita כָּל apenas na primeira oração.
  issues:
  - severity: medium
    issue: Pronome pessoal «Ele» para o agente coletivo
    rationale: Embora o hebraico use verbo masculino singular, o português «ele» normalmente personaliza ou masculiniza indevidamente o referente. «O enxame» torna explícito, sem mudar o sentido, o agente coletivo pressuposto pelo contexto.
  - severity: low
    issue: «da terra deles» não preserva o valor locativo de בְּאַרְצָם
    rationale: A preposição בְּ significa «em/na»; «na terra deles» reproduz melhor a relação espacial.
  - severity: low
    issue: A nota b acrescenta «toda» à alternativa
    rationale: A alternativa lexical para פְּרִי é «produção», mas «toda» não faz parte dessa expressão alternativa e não é necessário repeti-lo na nota.
  revised_text: O enxame devorou toda a vegetação na terra deles[a] e devorou o fruto do solo deles.[b]
  revised_footnotes:
  - marker: a
    text: Ou «toda a relva na terra deles». O termo hebraico pode designar especificamente a relva ou, de modo mais amplo, a vegetação.
    reason: lexical_alternative
  - marker: b
    text: Ou «a produção do solo deles».
    reason: lexical_alternative
  revision_rationale: A revisão explicita em português o agente coletivo singular recuperável do contexto, evita a impressão de um agente humano criada por «Ele» e restaura o sentido locativo de בְּאַרְצָם. Mantêm-se o paralelismo verbal, a distinção entre «terra» e «solo» e a amplitude de «vegetação».
