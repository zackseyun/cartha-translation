base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/035.yaml
  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: pt
  text: O enxame devorou toda a vegetação na terra deles[a] e devorou o fruto do solo deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda a relva na terra deles». O termo hebraico pode designar especificamente a relva ou, de modo mais amplo, a vegetação.
    reason: lexical_alternative
  - marker: b
    text: Ou «a produção do solo deles».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: ele devorou
  rationale: O verbo está na terceira pessoa masculina do singular e retoma o agente coletivo singular do contexto anterior. O pronome «ele» preserva a concordância hebraica; «devorou» expressa com naturalidade o consumo destrutivo causado pelos gafanhotos.
- source_word: כָּל
  choice: toda
  rationale: Expressa totalidade e concorda naturalmente com «vegetação».
- source_word: עֵשֶׂב
  choice: vegetação
  rationale: O termo pode designar especificamente a relva ou, em sentido mais amplo, o crescimento vegetal. «Vegetação» preserva essa abrangência no contexto da praga.
- source_word: בְּאַרְצָם
  choice: da terra deles
  rationale: A formulação portuguesa é natural e mantém o sentido territorial de אֶרֶץ com o sufixo de terceira pessoa do plural; aqui «da» expressa o âmbito em que se encontrava a vegetação consumida.
- source_word: פְּרִי
  choice: fruto
  rationale: Mantém a imagem concreta do hebraico e pode abranger, neste contexto agrícola, o que o solo produz.
- source_word: אַדְמָתָם
  choice: solo deles
  rationale: «Solo» conserva a referência à terra cultivável e distingue אֲדָמָה do termo anterior אֶרֶץ, traduzido por «terra».
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «devorou» reproduz o paralelismo e a força enfática do hebraico; «terra» e «solo» mantêm a distinção lexical do original.
