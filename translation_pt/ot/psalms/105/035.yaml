revisions:
- from: Ele devorou toda a vegetação da terra deles[a] e devorou o fruto do solo deles.[b]
  to: O enxame devorou toda a vegetação na terra deles[a] e devorou o fruto do solo deles.[b]
  rationale: A revisão explicita em português o agente coletivo singular recuperável do contexto, evita a impressão de um agente humano criada por «Ele» e restaura o sentido locativo de בְּאַרְצָם. Mantêm-se o paralelismo verbal, a distinção entre «terra» e «solo» e a amplitude de «vegetação».
