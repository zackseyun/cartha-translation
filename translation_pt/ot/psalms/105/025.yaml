  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: pt
  text: Ele mudou o coração deles[a], para que odiassem o seu povo e agissem traiçoeiramente contra os seus servos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o coração deles” está no singular, como expressão coletiva referente ao povo como um todo.
    reason: lexical_alternative
  - marker: b
    text: Ou “agissem com astúcia contra os seus servos” ou “tramassem contra os seus servos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַךְ
  choice: mudou
  rationale: O verbo pode significar virar, reverter ou mudar. Aqui, “mudou” expressa de modo natural a ação direta de Deus sobre a disposição interior dos egípcios, sem atenuar a força do hebraico.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém o singular coletivo do hebraico e conserva “coração” como centro da disposição interior, em vez de substituí-lo por “mente”.
- source_word: לִשְׂנֹא
  choice: para que odiassem
  rationale: O infinitivo indica propósito ou resultado. A oração com “para que” é idiomática em português e preserva essa ambiguidade contextual.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: עם designa aqui o povo pertencente ao SENHOR, Israel; “povo” é o equivalente natural e contextual.
- source_word: לְהִתְנַכֵּל
  choice: agissem traiçoeiramente
  rationale: A forma verbal comunica ação ardilosa, hostil ou enganosa. “Agissem traiçoeiramente” preserva o elemento de dolo sem especificar além do texto.
- source_word: בַּעֲבָדָיו
  choice: contra os seus servos
  rationale: Neste contexto hostil, a preposição é naturalmente vertida como “contra”. “Servos” representa o papel de Israel em relação a Deus sem impor aqui o sentido social mais específico de “escravos”.
theological_decisions:
- issue: Ação divina na mudança da disposição dos egípcios
  choice: “Ele mudou o coração deles”
  alternative: “Ele permitiu que o coração deles mudasse” ou “O coração deles mudou”
  rationale: O hebraico atribui diretamente a ação a Deus, sujeito implícito no contexto. A tradução mantém essa afirmação e a tensão entre a soberania divina e a hostilidade humana, sem enfraquecê-la por meio de linguagem permissiva ou passiva.
- issue: 'Valor dos infinitivos: propósito ou resultado'
  choice: “para que odiassem... e agissem...”
  alternative: “levando-os a odiar... e a agir...”
  rationale: A construção hebraica admite nuance de propósito ou resultado. “Para que” acompanha de perto a forma do texto e deixa a relação exata aberta ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém a agência divina explícita, o singular coletivo de “coração” e a coordenação das duas ações resultantes ou intencionadas.
