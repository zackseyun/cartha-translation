  source_fidelity: A tradução preserva adequadamente o paralelismo de זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב. “Descendência” reproduz bem o singular coletivo de זֶרַע, e “filhos de Jacó” mantém a formulação masculina plural do hebraico. “Seu servo” e “seus escolhidos” conservam, como no hebraico, a forma possessiva que depende contextualmente de Deus, sem explicitar no corpo do texto um referente que a gramática isolada não nomeia.
