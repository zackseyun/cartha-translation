id: PSA.105.6
reference: Psalms 105:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: pt
  text: 'descendência de Abraão[a], seu servo,

    filhos de Jacó[b], seus escolhidos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente de Abraão”. O singular hebraico pode ter sentido coletivo e referir-se aos descendentes de Abraão.
    reason: lexical_alternative
  - marker: b
    text: Ou “descendentes de Jacó”. O hebraico diz literalmente “filhos de Jacó”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus eleitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: descendência
  rationale: O singular hebraico tem sentido coletivo e designa os descendentes de Abraão. “Descendência” preserva esse valor coletivo e soa natural em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: 'O sufixo remete a Deus: Abraão é seu servo. “Servo” preserva o caráter honorífico da expressão sem destacar indevidamente a ideia de escravidão.'
- source_word: בְּנֵי
  choice: filhos de
  rationale: Mantém a forma masculina plural explícita do hebraico e o paralelismo patriarcal, embora a expressão possa representar toda a linhagem de Jacó.
- source_word: בְּחִירָיו
  choice: seus escolhidos
  rationale: Expressa com clareza que os filhos de Jacó são aqueles que Deus escolheu, sem a carga teológica especializada que “eleitos” pode adquirir.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: descendência de Abraão // filhos de Jacó
  rationale: Preserva os dois membros do paralelismo sinônimo e sua identificação da comunidade pela linhagem dos patriarcas.
theological_decisions:
- issue: Referente dos sufixos possessivos em “seu servo” e “seus escolhidos”
  choice: 'Os dois possessivos se referem a Deus: Abraão é servo de Deus, e os filhos de Jacó são os escolhidos de Deus.'
  alternative: Por proximidade gramatical, os sufixos poderiam ser associados aos patriarcas mencionados imediatamente antes, mas o contexto torna essa leitura improvável.
  rationale: O contexto da aliança no salmo e o uso bíblico mais amplo sustentam que Abraão é chamado servo de Deus e que a linhagem de Jacó constitui o povo escolhido por Deus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A disposição em duas linhas conserva o paralelismo poético. Os possessivos permanecem formalmente ambíguos no texto, enquanto a nota de decisão registra o referente contextual mais provável.
