  naturalness: «Realizaram entre eles os sinais de Deus e prodígios na terra de Cam» é claro, moderno e mantém o registro elevado próprio do salmo. «Prodígios» é natural neste contexto poético.
  terminology: «Sinais e prodígios» reproduz bem o par אֹתוֹת ... מֹפְתִים. «Terra de Cam» conserva a designação poética hebraica, com a identificação do Egito na nota.
