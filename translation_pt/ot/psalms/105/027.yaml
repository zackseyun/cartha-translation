source:
  edition: WLC
  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: pt
  text: Eles realizaram entre eles os seus sinais[a] e prodígios na terra de Cam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “as palavras de seus sinais”; a expressão também pode ter o sentido de “os atos” ou “os acontecimentos de seus sinais”.
    reason: lexical_alternative
  - marker: b
    text: “Terra de Cam” é uma designação poética do Egito.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: realizaram
  rationale: Embora o verbo signifique literalmente “puseram” ou “colocaram”, neste contexto descreve a execução dos sinais e prodígios; “realizaram” comunica esse valor idiomático com naturalidade.
- source_word: בָם
  choice: entre eles
  rationale: O pronome retoma os egípcios, e a preposição indica que os sinais ocorreram no meio deles.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: os seus sinais
  rationale: A expressão hebraica é incomum e, literalmente, diz “as palavras de seus sinais”. No contexto, דִּבְרֵי pode designar assuntos, atos ou acontecimentos. O texto principal evita uma formulação portuguesa obscura, enquanto a nota preserva a forma e a ambiguidade do original.
- source_word: וּמֹפְתִים
  choice: e prodígios
  rationale: “Prodígios” conserva a associação bíblica tradicional entre sinais e feitos extraordinários sem restringir indevidamente o termo a uma categoria técnica de milagre.
- source_word: בְּאֶרֶץ חָם
  choice: na terra de Cam
  rationale: Mantém a designação poética hebraica para o Egito, esclarecida em nota.
theological_decisions:
- issue: Sentido da expressão דִּבְרֵי אֹתוֹתָיו
  choice: Traduzir de modo idiomático como “os seus sinais” e registrar a expressão literal em nota
  alternative: “as palavras de seus sinais” ou “os atos de seus sinais”
  rationale: “As palavras de seus sinais” preservaria a forma lexical, mas seria pouco inteligível em português e poderia sugerir, sem necessidade, que os sinais falavam. “Os atos de seus sinais” também soa artificial. A nota mantém visível a formulação incomum e suas possibilidades sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Prodígios” mantém o registro poético do salmo; a construção incomum do hebraico é documentada em nota.
