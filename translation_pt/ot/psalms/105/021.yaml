translation:
  language: pt
  text: Ele o fez senhor de sua casa[a] e governante de tudo o que possuía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele o estabeleceu como senhor de sua casa e governante de todos os seus bens.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמוֹ
  choice: o fez
  rationale: O qal perfeito de שׂים/שׂוּם com sufixo de objeto masculino singular significa literalmente “pôs/estabeleceu-o”. Na construção predicativa com os títulos seguintes, “o fez” comunica de modo natural a nomeação para uma posição de autoridade.
- source_word: אָדוֹן
  choice: senhor
  rationale: אָדוֹן designa alguém com autoridade sobre uma casa. “Senhor” preserva o tom elevado e forma um paralelo claro com “governante”.
- source_word: לְבֵיתוֹ
  choice: de sua casa
  rationale: Após שׂים, a preposição לְ pode indicar o âmbito da função conferida. “Senhor de sua casa” é natural em português e mantém a referência à casa ou unidade doméstica.
- source_word: וּמֹשֵׁל
  choice: e governante
  rationale: O particípio de משל designa quem governa. “Governante” mantém o paralelismo nominal com “senhor” e expressa autoridade administrativa sem restringir indevidamente seu alcance.
- source_word: בְּכָל
  choice: de tudo
  rationale: Com משל, בְּ marca o âmbito ou objeto do governo. Em português, a regência natural de “governante” permite “de tudo”, transmitindo autoridade sobre a totalidade mencionada.
- source_word: קִנְיָנוֹ
  choice: o que possuía
  rationale: קִנְיָן refere-se a propriedade ou bens adquiridos. “Tudo o que possuía” é claro, abrangente e idiomático, incluindo os bens e o patrimônio sob administração.
