  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: pt
  text: Pois ele se lembrou da sua santa palavra e de Abraão, seu servo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque ele se lembrou da sua santa palavra e de Abraão, seu servo.”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “palavra” pode referir-se à promessa divina. A relação sintática entre a palavra e Abraão também pode ser entendida como uma palavra dada a Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: A conjunção introduz a razão da ação narrada anteriormente. “Pois” preserva o fluxo explicativo do salmo; “Porque” também é possível.
- source_word: זָכַר
  choice: se lembrou
  rationale: 'Mantém o idioma hebraico e sua possível força pactual: Deus age de acordo com o que havia declarado, sem reduzir o verbo a mera recordação mental nem explicitá-lo como “cumpriu”.'
- source_word: דְּבַר קָדְשׁוֹ
  choice: sua santa palavra
  rationale: Traduz de modo direto o substantivo “palavra” e o qualificativo “santa”, preservando o peso teológico e sem substituir no texto principal “palavra” por “promessa”.
- source_word: אֶת אַבְרָהָם
  choice: dada a Abraão
  rationale: O segundo אֶת liga Abraão à palavra lembrada, embora a relação exata seja implícita no hebraico. Em português, “dada a Abraão” expressa naturalmente que a palavra lhe foi comunicada, sem transformar diretamente “palavra” em “promessa”.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: No contexto da relação de Abraão com Deus, “servo” é a tradução natural e adequada; “escravo” enfatizaria uma nuance que não está em primeiro plano.
theological_decisions:
- issue: Força pactual de “se lembrou”
  choice: Manter “se lembrou” no texto principal.
  alternative: “cumpriu sua promessa” ou “se lembrou de sua promessa pactual”
  rationale: O verbo pode implicar ação fiel à palavra anteriormente dada, mas a formulação hebraica diz que Deus “se lembrou”. A tradução preserva o idioma e permite que o contexto comunique sua força pactual.
- issue: Relação entre “sua santa palavra” e “Abraão, seu servo”
  choice: “sua santa palavra dada a Abraão, seu servo”
  alternative: “sua santa promessa feita a Abraão, seu servo”
  rationale: O hebraico não contém uma preposição explícita antes de Abraão. “Dada a” torna inteligível em português a relação implícita, enquanto conserva “palavra” e evita resolver toda a expressão como “promessa” no texto principal.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito internacional. “Pois” mantém o encadeamento poético e explicativo; “sua santa palavra” conserva a formulação bíblica sem arcaísmo excessivo.
