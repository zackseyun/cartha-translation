  text: וַ/יּוֹצִ֣א עַמּ֣/וֹ בְ/שָׂשׂ֑וֹן בְּ֝/רִנָּ֗ה אֶת בְּחִירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: pt
  text: 'Então ele fez sair o seu povo com alegria,

    os seus escolhidos com cantos de júbilo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com gritos de alegria”. O termo hebraico pode indicar tanto canto jubiloso como clamor de júbilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: fez sair
  rationale: A forma hifil de יצא é causativa, literalmente “fez sair”. A expressão preserva de modo claro a referência ao êxodo.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: עַם designa aqui o povo de Deus no contexto da aliança e do êxodo; “o seu povo” é natural e preciso.
- source_word: בְשָׂשׂוֹן
  choice: com alegria
  rationale: שָׂשׂוֹן indica alegria ou regozijo; a locução portuguesa reproduz de forma concisa o valor adverbial da preposição בְּ.
- source_word: בְּרִנָּה
  choice: com cantos de júbilo
  rationale: רִנָּה pode designar tanto canto jubiloso como grito de alegria. “Cantos de júbilo” comunica a celebração audível e mantém linguagem poética natural, enquanto a nota registra a alternativa.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: O marcador hebraico de objeto direto não possui equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: בְּחִירָיו
  choice: os seus escolhidos
  rationale: O substantivo plural derivado de בחר refere-se àqueles que Deus escolheu. “Os seus escolhidos” é transparente e evita possíveis associações doutrinárias posteriores de “eleitos”.
theological_decisions:
- issue: Tradução de בְּחִירָיו
  choice: os seus escolhidos
  alternative: os seus eleitos
  rationale: No paralelismo, a expressão identifica como escolhidos por Deus os integrantes do seu povo libertado do Egito. A formulação mantém o sentido de escolha divina sem introduzir debates doutrinários alheios ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Então” liga naturalmente o versículo à narrativa anterior; “fez sair” conserva a força causativa do hebraico.
