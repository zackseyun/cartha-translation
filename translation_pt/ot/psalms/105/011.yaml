  yaml_path: translation/ot/psalms/105/011.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: pt
  text: 'dizendo: “A você darei a terra de Canaã, a porção[a] da herança de vocês[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a linha de medir da herança de vocês”; “linha” refere-se, por extensão, a uma porção de terra demarcada.
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do singular em “a você” para o plural em “de vocês”, possivelmente dirigindo-se a Abraão como representante de seus descendentes.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz a promessa divina citada, preservando o valor do infinitivo construto hebraico e a ligação com o versículo anterior.
- source_word: לְךָ
  choice: a você
  rationale: Mantém a segunda pessoa masculina singular dirigida ao patriarca e soa natural no português moderno de ampla compreensão.
- source_word: אֶתֵּן
  choice: darei
  rationale: O imperfeito hebraico tem aqui força de promessa futura; “darei” comunica isso de modo direto.
- source_word: אֶרֶץ כְּנָעַן
  choice: a terra de Canaã
  rationale: Expressa naturalmente a referência ao território indicado pelo sintagma hebraico.
- source_word: חֶבֶל
  choice: porção
  rationale: Embora o sentido concreto seja “corda” ou “linha de medir”, no contexto da distribuição de terras o termo designa, por extensão, uma porção demarcada.
- source_word: נַחֲלַתְכֶם
  choice: a herança de vocês
  rationale: Preserva tanto a ideia de propriedade recebida por herança quanto o sufixo plural do hebraico, sem harmonizá-lo com o destinatário singular anterior.
theological_decisions:
- issue: Mudança do destinatário singular para o possessivo plural na promessa
  choice: “a você” ... “a herança de vocês”
  alternative: “a você” ... “a sua herança” ou “a herança dos seus descendentes”
  rationale: O hebraico passa deliberadamente do singular לְךָ ao plural נַחֲלַתְכֶם. A tradução conserva essa tensão, possivelmente apresentando o patriarca como representante de seus descendentes, sem explicitar no texto uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A combinação intencional de “a você” com “de vocês” preserva a mudança de número presente no hebraico. A aposição “a porção” reproduz de perto a construção da fonte sem inserir “como”.
