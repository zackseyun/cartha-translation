  text: 'A terra deles fervilhou de rãs,

    até nos aposentos dos seus reis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus reis”. Em contraste, a narrativa da praga em Êxodo se refere a Faraó no singular (por exemplo, em Êxodo 8), mas aqui o salmo emprega a forma plural, talvez como expressão poética ou coletiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: fervilhou
  rationale: O verbo descreve uma proliferação abundante. “Fervilhou de” comunica de modo natural e vívido que a terra ficou tomada por rãs.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: Reproduz diretamente o substantivo com sufixo de terceira pessoa masculina plural e, no contexto, refere-se à terra dos egípcios.
- source_word: צְפַרְדְּעִים
  choice: rãs
  rationale: É o equivalente português padrão para o animal mencionado na praga.
- source_word: בְּחַדְרֵי
  choice: nos aposentos de
  rationale: A preposição indica localização, e “aposentos” conserva o tom poético e se ajusta ao contexto régio.
- source_word: מַלְכֵיהֶם
  choice: seus reis
  rationale: A forma hebraica é inequivocamente plural, com sufixo de terceira pessoa masculina plural; por isso, o plural deve ser preservado sem harmonização com a narrativa de Êxodo.
theological_decisions:
- issue: Plural “seus reis” em contraste com o singular na narrativa da praga em Êxodo
  choice: Preservar “seus reis”
  alternative: “seu rei”
  rationale: A tradução segue a morfologia do texto hebraico do salmo e mantém sua possível expressão poética ou coletiva, sem resolver a tensão por harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Fervilhou de rãs” preserva a vivacidade do verbo hebraico; “aposentos” mantém o contexto régio sem soar arcaico.
