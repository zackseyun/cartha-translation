  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: pt
  text: Lembrem-se das maravilhas que ele fez[a], dos seus sinais[b] e dos juízos da sua boca[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus feitos maravilhosos”.
