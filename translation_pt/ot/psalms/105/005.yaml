lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: Imperativo plural de זכר, que convoca a comunidade a trazer ativamente à memória os atos de Deus. A forma é direta, natural e amplamente compreensível em português.
- source_word: נִפְלְאוֹתָיו
  choice: das maravilhas
  rationale: O termo designa feitos extraordinários que despertam admiração. “Maravilhas” é conciso e mantém a força poética sem explicitar além do hebraico que se trata de feitos.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele fez
  rationale: A oração relativa modifica “maravilhas”. O pretérito perfeito expressa naturalmente em português os atos passados que o povo deve recordar.
- source_word: מֹפְתָיו
  choice: dos seus sinais
  rationale: מוֹפֵת pode indicar sinais, prodígios ou portentos que manifestam e atestam a ação divina. “Sinais” preserva essa amplitude sem limitar o sentido a milagres.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: e dos juízos da sua boca
  rationale: A formulação literal conserva tanto a possível dimensão judicial ou normativa de מִשְׁפָּט quanto a imagem poética de decisões que procedem da boca de Deus.
- source_word: פִיו
  choice: da sua boca
  rationale: A tradução direta preserva a linguagem antropomórfica e a força poética do hebraico, em vez de substituí-la por uma explicação.
theological_decisions:
- issue: Relação entre נִפְלְאוֹת e מֹפְתִים
  choice: Categorias distintas, mas sobrepostas, traduzidas como “maravilhas” e “sinais”
  alternative: “feitos maravilhosos” e “milagres”, ou “maravilhas” e “prodígios”
  rationale: O paralelismo acumula expressões para os atos poderosos de Deus sem exigir uma taxonomia teológica rígida. Dois termos diferentes preservam a variedade poética do original.
- issue: Sentido de מִשְׁפְּטֵי פִיו
  choice: “os juízos da sua boca”
  alternative: “os juízos que ele pronunciou” ou “as ordenanças da sua boca”
  rationale: A expressão pode se referir a decisões judiciais, sentenças ou decretos divinos. A formulação literal mantém a imagem hebraica e não resolve indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “dos” explicita a coordenação exigida por “lembrem-se de” e mantém o ritmo enumerativo do hebraico. A imagem concreta “da sua boca” foi preservada.
