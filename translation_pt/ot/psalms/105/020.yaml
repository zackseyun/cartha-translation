  text: שָׁ֣לַח מֶ֭לֶךְ וַ/יַּתִּירֵ֑/הוּ מֹשֵׁ֥ל עַ֝מִּ֗ים וַֽ/יְפַתְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/020.yaml
  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: pt
  text: O rei mandou soltá-lo[a]; o governante dos povos o pôs em liberdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o libertar”. O verbo hebraico tem o sentido de soltar ou livrar de amarras.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o abriu” ou “abriu para ele”; aqui, a expressão significa libertá-lo do confinamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: mandou
  rationale: O verbo significa literalmente “enviou”, mas aqui introduz a ação ordenada pelo rei. Em português, “mandou que” expressa de modo natural que ele fez expedir a ordem, sem acrescentar um objeto não declarado no hebraico.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: 'Embora não tenha artigo no hebraico poético, o referente é definido pelo contexto: o faraó que ordena a libertação de José.'
- source_word: וַיַּתִּירֵהוּ
  choice: que o soltassem
  rationale: O verbo denota soltar ou libertar de amarras ou confinamento. A construção com “mandou que” produz português natural e mantém a libertação como ação resultante da ordem real.
- source_word: מֹשֵׁל עַמִּים
  choice: o governante dos povos
  rationale: Preserva o título participial “governante” e o plural coletivo עַמִּים, “povos”, além do paralelismo com “o rei”.
- source_word: וַיְפַתְּחֵהוּ
  choice: o pôs em liberdade
  rationale: פתח significa normalmente “abrir”, mas neste contexto a expressão é idiomática e se refere à libertação do confinamento. “Pôs em liberdade” comunica esse sentido sem a estranheza de uma tradução mecânica.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível. A formulação mantém o paralelismo poético entre “o rei” e “o governante dos povos”, enquanto traduz de forma idiomática as duas expressões hebraicas de libertação.
