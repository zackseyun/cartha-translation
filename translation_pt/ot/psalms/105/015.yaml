  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: pt
  text: '“Não toquem nos meus ungidos[a]

    nem façam mal aos meus profetas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “meus ungidos”. A palavra está relacionada a “Messias”, mas aqui aparece no plural e se refere àqueles que Deus separou para si, não especificamente ao Messias singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: toquem
  rationale: O verbo נגע significa com frequência “tocar” e, neste contexto proibitivo, pode sugerir agressão sem restringir o sentido à violência física. “Toquem” preserva a concisão e o paralelismo do hebraico.
- source_word: בִמְשִׁיחָי
  choice: nos meus ungidos
  rationale: מָשִׁיחַ significa “ungido”; aqui, a forma é plural e recebe o sufixo de primeira pessoa singular. “Meus ungidos” preserva tanto a forma quanto o sentido contextual, sem sugerir que se trate especificamente do Messias singular.
- source_word: לִנְבִיאַי
  choice: aos meus profetas
  rationale: נָבִיא significa “profeta”; o plural com sufixo de primeira pessoa singular corresponde naturalmente a “meus profetas”.
- source_word: תָּרֵעוּ
  choice: façam mal
  rationale: Na forma causativa e no contexto de proibição, רעע comunica fazer o mal ou causar dano. “Façam mal” é natural em português e mantém alguma amplitude sem limitar o verbo a ferimento físico.
- source_word: אַל
  choice: Não / nem
  rationale: אַל com a forma verbal expressa proibição. Na primeira linha, “Não” introduz a proibição; na segunda, “nem” coordena naturalmente a proibição paralela em português.
theological_decisions:
- issue: Tradução de מָשִׁיחַ em contexto plural não especificamente messiânico
  choice: meus ungidos
  alternative: meus messias
  rationale: A forma hebraica é plural e designa pessoas separadas ou consagradas por Deus no contexto histórico do salmo. “Ungidos” comunica o sentido lexical sem importar uma referência direta ao Messias singular.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A construção “Não... nem...” reproduz de modo natural as duas proibições coordenadas.
