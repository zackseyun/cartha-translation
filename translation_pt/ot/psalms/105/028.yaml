  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: pt
  text: Ele enviou trevas e fez escurecer; eles não se rebelaram contra as suas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eles não se rebelaram contra a sua palavra ou ordem”. O hebraico também pode ser entendido no singular, e o sujeito de “eles” não está explícito; alguns entendem que se refere aos egípcios, outros, a Moisés e Arão.'
    reason: Leitura alternativa e ambiguidade do sujeito implícito.
lexical_decisions:
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente comum e natural do verbo hebraico, adequado ao relato poético das pragas.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Expressa a escuridão intensa no contexto da praga e conserva um registro bíblico digno, ainda amplamente compreensível.
- source_word: וַיַּחְשִׁךְ
  choice: fez tudo escurecer
  rationale: Preserva o valor causativo da forma verbal hebraica e produz uma frase natural em português sem exigir um objeto não expresso.
- source_word: וְלֹא
  choice: e ... não
  rationale: Mantém a coordenação simples do hebraico, sem introduzir um contraste mais forte.
- source_word: מָרוּ
  choice: se rebelaram
  rationale: Conserva a ideia de rebeldia ou desobediência própria do verbo מרה, sem reduzi-la apenas a resistência.
- source_word: אֶת־דבריו
  choice: contra as suas palavras
  rationale: Mantém o plural formal do texto hebraico e explicita naturalmente em português a relação exigida por 'rebelar-se contra'.
theological_decisions:
- issue: Referente do sujeito implícito em 'não se rebelaram'
  choice: Manter o pronome plural ambíguo 'eles', sem identificar o referente.
  alternative: Identificar 'eles' como os egípcios ou como Moisés e Arão.
  rationale: O hebraico não explicita o sujeito plural, e o contexto admite entendimentos diferentes. A tradução preserva essa ambiguidade genuína.
- issue: Número e sentido de דבריו
  choice: Traduzir pelo plural formal 'as suas palavras'.
  alternative: Traduzir no singular como 'a sua palavra' ou interpretar como 'a sua ordem'.
  rationale: A forma massorética é plural com sufixo masculino singular; manter o plural evita resolver interpretativamente o termo como uma única ordem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Trevas” mantém o tom poético; “fez tudo escurecer” comunica naturalmente a força causativa. A nota preserva as ambiguidades de número e referente sem impor uma interpretação.
