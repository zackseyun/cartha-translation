  text: וַ/יִּקְרָ֣א רָ֭עָב עַל הָ/אָ֑רֶץ כָּֽל מַטֵּה לֶ֥חֶם שָׁבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: pt
  text: Fez vir fome sobre a terra e quebrou todo o sustento de pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo bordão de pão”, expressão hebraica para o sustento ou suprimento de alimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Fez vir
  rationale: Com “fome” como objeto, קרא expressa a ideia de convocá-la ou fazê-la chegar. “Fez vir” comunica naturalmente a ação divina sem sugerir um simples pedido.
- source_word: רָעָב
  choice: fome
  rationale: Aqui o substantivo se refere à escassez generalizada que atingiu a terra. Em português, “fome” é a forma bíblica e corrente de descrever essa calamidade; “carestia” seria possível, mas menos direta.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: A expressão mantém o valor espacial de עַל e entende אֶרֶץ como a região em questão, não necessariamente o planeta inteiro.
- source_word: כָּל מַטֵּה לֶחֶם
  choice: todo o suprimento de alimento
  rationale: A expressão hebraica, literalmente “todo bordão de pão”, é uma metáfora para aquilo que sustenta a vida, isto é, a provisão de comida. A tradução comunica o sentido idiomático, enquanto a nota preserva a imagem original.
- source_word: שָׁבָר
  choice: acabou com
  rationale: Embora o sentido básico seja “quebrou”, a formulação idiomática indica a eliminação da provisão de comida. “Acabou com” é claro e natural em português moderno.
theological_decisions:
- issue: A ação divina na fome
  choice: Deus é apresentado como aquele que fez vir a fome e eliminou o suprimento de alimento.
  alternative: Tratar a fome e a escassez como acontecimentos impessoais.
  rationale: Os verbos masculinos singulares dão continuidade ao sujeito divino no contexto do salmo. A tradução mantém essa ação explícita sem explicar sua finalidade além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora hebraica pouco transparente foi expressa de modo idiomático no texto e preservada em nota.
