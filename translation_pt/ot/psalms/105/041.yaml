base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: pt
  text: Ele abriu a rocha, e as águas jorraram; correram pelas regiões áridas como um rio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “seguiram pelas regiões áridas, um rio”. O hebraico não traz uma palavra correspondente a “como”.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: פָּתַח
  choice: abriu
  rationale: O verbo significa simplesmente “abrir”. A tradução evita intensificá-lo como “fendeu” ou “partiu”, embora o contexto envolva a saída de água da rocha.
- source_word: צוּר
  choice: a rocha
  rationale: Embora o substantivo não tenha artigo em hebraico, o contexto remete à conhecida rocha do episódio no deserto, permitindo a forma definida em português.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: e as águas jorraram
  rationale: O verbo descreve água saindo ou fluindo. “Jorraram” comunica sua saída abundante e mantém o plural “águas”, em concordância com o verbo hebraico plural.
- source_word: הָלְכוּ
  choice: correram
  rationale: Literalmente, “foram/andaram”; tendo “as águas” como sujeito, “correram” exprime naturalmente em português o movimento contínuo da água e preserva o plural do hebraico.
- source_word: בַּצִּיּוֹת
  choice: pelas regiões áridas
  rationale: O termo designa lugares secos ou ressequidos. “Regiões áridas” é claro e não restringe indevidamente a referência a desertos propriamente ditos.
- source_word: נָהָר
  choice: como um rio
  rationale: O substantivo final pode funcionar de modo predicativo ou apositivo. A comparação explícita é natural em português e comunica que as águas correram com a força ou extensão de um rio.
theological_decisions:
- issue: Referência à provisão divina de água no deserto durante o êxodo
  choice: Apresentar o verso como descrição histórico-poética de Deus fazendo sair água da rocha para Israel.
  alternative: Entender a imagem principalmente como metáfora geral da provisão divina.
  rationale: O salmo recapitula a história de Israel. A tradução conserva o acontecimento concreto e deixa implícita sua ressonância teológica, sem impor uma interpretação denominacional.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Águas” e “correram” mantêm a concordância plural do hebraico; o ponto e vírgula preserva o paralelismo poético.
