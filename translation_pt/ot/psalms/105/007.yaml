  text: ה֭וּא יְהוָ֣ה אֱלֹהֵ֑י/נוּ בְּ/כָל הָ֝/אָ֗רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: pt
  text: Ele é Yahweh[a], nosso Deus; seus juízos[b] estão em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também vertido como “Jeová”.'
    reason: alternative_reading
  - marker: b
    text: Ou “suas ordenanças”, “sua justiça” ou “seus atos de julgamento”; o termo hebraico pode designar decisões judiciais, decretos ou justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ele é
  rationale: O pronome independente tem valor enfático; em português, a cópula implícita é naturalmente expressa por “é”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: A forma com sufixo de primeira pessoa do plural significa diretamente “nosso Deus”.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: Mantém o sentido locativo e o alcance universal sugerido pelo contexto do salmo.
- source_word: מִשְׁפָּטָיו
  choice: seus juízos
  rationale: “Juízos” conserva a amplitude do termo hebraico, que pode se referir a decisões judiciais, determinações normativas ou à justiça exercida por Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo pelo título “Senhor”.
- issue: Amplitude semântica de מִשְׁפָּטָיו
  choice: seus juízos
  alternative: suas ordenanças; sua justiça; seus atos de julgamento
  rationale: A formulação escolhida preserva a tensão entre decisões, decretos e exercício da justiça, sem restringir indevidamente o referente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com colocação sintática natural e preservação do paralelismo conciso do hebraico.
