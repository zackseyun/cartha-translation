  text: וַ/יֶּ֣פֶר אֶת עַמּ֣/וֹ מְאֹ֑ד וַ֝/יַּֽעֲצִמֵ/הוּ מִ/צָּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: pt
  text: Ele tornou seu povo muito numeroso[a] e o fez mais forte que seus adversários.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fez seu povo frutificar muito» ou «multiplicou grandemente seu povo». O verbo hebraico pode destacar tanto a fecundidade quanto o aumento.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, os pronomes estão no singular, pois se referem ao substantivo coletivo «povo».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: tornou ... muito numeroso
  rationale: O hifil de פרה indica fazer frutificar ou multiplicar. No contexto do crescimento de Israel, «tornou ... numeroso» comunica naturalmente em português o aumento causado por Deus, enquanto a nota preserva a imagem de fecundidade.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: עַם designa aqui o povo de Deus como coletividade; «seu povo» é claro, natural e adequado ao contexto da recapitulação histórica do salmo.
- source_word: מְאֹד
  choice: muito
  rationale: O intensificador adverbial expressa grande grau; «muito» é corrente e combina naturalmente com «numeroso».
- source_word: וַיַּעֲצִמֵהוּ
  choice: o fez mais forte
  rationale: O hifil de עצם significa tornar forte ou poderoso. A construção com מִן tem valor comparativo, expresso por «mais forte que». O pronome singular «o» conserva a concordância hebraica com o coletivo «povo» e também é natural em português.
- source_word: מִצָּרָיו
  choice: que seus adversários
  rationale: צַר refere-se a inimigos ou adversários. «Adversários» mantém o sentido amplo, sem limitar a referência aos opressores egípcios, embora estes estejam em vista no contexto.
theological_decisions:
- issue: Referência pronominal coletiva no singular
  choice: Conservar o singular em «o fez» e «seus adversários», referindo-se a «seu povo».
  alternative: 'Empregar o plural semântico: «os fez mais fortes que os adversários deles».'
  rationale: O hebraico trata עַם como coletivo singular, e o português permite manter essa concordância com naturalidade. A escolha preserva a forma e o sentido sem alterar a referência coletiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Muito numeroso» privilegia a comunicação imediata do crescimento de Israel; a imagem verbal de fecundidade é preservada em nota. A concordância no singular segue o hebraico e permanece idiomática em português.
