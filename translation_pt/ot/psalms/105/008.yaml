  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: pt
  text: 'Ele se lembra para sempre da sua aliança,

    da palavra[a] que ordenou para mil gerações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da promessa”.
    reason: Alternativa lexical para דָּבָר no contexto da aliança.
lexical_decisions:
- source_word: זָכַר
  choice: Ele se lembra
  rationale: O perfeito qal pode descrever um ato passado, mas, neste contexto poético de fidelidade divina duradoura, o presente comunica naturalmente uma realidade contínua sem limitar a lembrança a um único momento.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração permanente e é a formulação mais natural e clara em português contemporâneo.
- source_word: בְּרִיתוֹ
  choice: da sua aliança
  rationale: “Aliança” é o equivalente consagrado e adequado ao contexto bíblico; a preposição “de” decorre naturalmente da regência de “lembrar-se” em português.
- source_word: דָּבָר
  choice: da palavra
  rationale: Mantém a amplitude lexical do hebraico e o paralelismo com “aliança”; “promessa” é uma interpretação contextual plausível, preservada em nota.
- source_word: צִוָּה
  choice: ordenou
  rationale: Traduz diretamente o piel de צוה e conserva a força do decreto divino, embora “estabeleceu” seja possível no contexto da aliança.
- source_word: לְאֶלֶף דּוֹר
  choice: para mil gerações
  rationale: A preposição indica extensão, e o singular coletivo hebraico após o numeral requer naturalmente o plural “gerações” em português.
theological_decisions:
- issue: Aspecto da lembrança divina
  choice: 'Presente com sentido contínuo: “Ele se lembra”'
  alternative: “Ele se lembrou” ou “Ele tem se lembrado”
  rationale: O contexto celebra a fidelidade permanente de Deus. O presente preserva esse valor contínuo sem transformar a forma verbal em mera recordação psicológica nem restringi-la ao passado.
- issue: Sentido de דָּבָר no paralelismo da aliança
  choice: Manter “palavra” no texto principal
  alternative: “promessa”
  rationale: O termo hebraico é amplo e aqui se refere à palavra pactual de Deus. “Palavra” conserva a transparência lexical e a tensão poética; “promessa” explicita uma leitura contextual válida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A quebra de linha preserva o paralelismo poético. O pronome possessivo “sua” retoma Deus sem introduzir terminologia confessional adicional.
