  text: בִּֽ֭/הְיוֹתָ/ם מְתֵ֣י מִסְפָּ֑ר כִּ֝/מְעַ֗ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: pt
  text: quando eram poucos em número, pouquíssimos, e estrangeiros residentes nela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e peregrinos nela”. O termo hebraico se refere a pessoas que moravam como estrangeiras ou residentes temporários numa terra que não lhes pertencia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: quando eram
  rationale: A preposição בְּ com o infinitivo construto de היה e o sufixo de terceira pessoa do plural introduz uma oração temporal; “quando eram” é natural e fiel.
- source_word: מְתֵי מִסְפָּר
  choice: poucos em número
  rationale: A expressão idiomática designa um grupo pequeno e facilmente contável; a formulação portuguesa preserva tanto o sentido quanto a imagem numérica.
- source_word: כִּמְעַט
  choice: pouquíssimos
  rationale: No contexto, intensifica a ideia anterior de escassez numérica. “Pouquíssimos” reproduz essa ênfase de modo claro e corrente.
- source_word: וְגָרִים
  choice: e estrangeiros residentes
  rationale: O termo derivado de גור descreve pessoas que vivem como estrangeiras numa terra que não é sua. “Estrangeiros residentes” comunica melhor esse estatuto do que apenas “estrangeiros” e é mais acessível que “forasteiros”.
- source_word: בָּהּ
  choice: nela
  rationale: O sufixo feminino singular retoma a terra mencionada no contexto; “nela” preserva a concisão do hebraico sem inserir um substantivo ausente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sequência “poucos em número, pouquíssimos” conserva a repetição enfática do hebraico. O marcador foi colocado após a unidade a que a alternativa lexical se refere.
