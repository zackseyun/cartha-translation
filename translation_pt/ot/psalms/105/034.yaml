  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: pt
  text: Ele falou, e vieram gafanhotos — gafanhotos devoradores[a] sem número.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele falou, e vieram gafanhotos e insetos devoradores, incontáveis”. O termo hebraico יֶלֶק designa um inseto que devora plantações, provavelmente uma fase ou variedade de gafanhoto; traduções antigas às vezes usam “lagartas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Ele falou
  rationale: Traduz diretamente o verbo 'dizer/falar' e, no contexto poético, expressa que a praga veio à palavra de Deus sem acrescentar a ideia mais forte e não explícita de 'ordenar'.
- source_word: וַיָּבֹא
  choice: e vieram
  rationale: O verbo narra a chegada da praga. O plural em português concorda naturalmente com o sentido coletivo de 'gafanhotos'.
- source_word: אַרְבֶּה
  choice: gafanhotos
  rationale: Embora a forma hebraica seja singular, o substantivo tem sentido coletivo neste contexto de praga; o plural português comunica isso com naturalidade.
- source_word: יֶלֶק
  choice: gafanhotos devoradores
  rationale: O termo designa um inseto destruidor de plantações associado às pragas de gafanhotos, talvez uma fase ou variedade específica. Esta escolha conserva a relação provável com gafanhotos sem usar o tradicional e potencialmente enganoso 'lagartas'.
- source_word: וְאֵין מִסְפָּר
  choice: sem número
  rationale: Reproduz de modo conciso e poético o idioma hebraico que indica uma quantidade impossível de contar.
