  text: פָּרַ֣שׂ עָנָ֣ן לְ/מָסָ֑ךְ וְ֝/אֵ֗שׁ לְ/הָאִ֥יר לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: pt
  text: Ele estendeu uma nuvem como cobertura[a] e fogo para iluminar a noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para servir de cobertura”, “como anteparo” ou “como dossel”. O termo hebraico pode indicar uma cobertura, um anteparo ou uma cortina de proteção.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: estendeu
  rationale: O verbo significa estender ou desdobrar; “estendeu” é natural em português e preserva a imagem de Deus dispondo a nuvem sobre o povo.
- source_word: עָנָן
  choice: uma nuvem
  rationale: Correspondência lexical direta; no contexto, refere-se à nuvem que acompanhou Israel no deserto.
- source_word: לְמָסָךְ
  choice: como cobertura
  rationale: מָסָךְ pode designar cobertura, anteparo ou cortina. “Como cobertura” comunica a função da nuvem sem especificar demais a forma da imagem.
- source_word: וְאֵשׁ
  choice: e fogo
  rationale: A tradução literal mantém o paralelismo com a nuvem e a alusão ao relato do êxodo.
- source_word: לְהָאִיר
  choice: para iluminar
  rationale: O infinitivo expressa finalidade; “para iluminar” transmite isso de modo claro e corrente.
- source_word: לָיְלָה
  choice: a noite
  rationale: Com “iluminar”, a construção “iluminar a noite” é idiomática em português e expressa adequadamente a função noturna do fogo.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: Ele, referindo-se a Deus
  alternative: O SENHOR
  rationale: O hebraico traz um sujeito masculino singular implícito, retomado do contexto e referente a Deus. “Ele” preserva o fluxo discursivo sem explicitar um nome divino ausente neste versículo.
- issue: Imagens da manifestação divina no deserto
  choice: Manter literalmente a nuvem e o fogo, sem expansão interpretativa
  alternative: Identificá-los explicitamente como as colunas de nuvem e de fogo
  rationale: O versículo alude à tradição do êxodo, mas menciona apenas a nuvem e o fogo com suas funções. A tradução evita inserir explicações não expressas no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a ambiguidade lexical de מָסָךְ por meio da nota.
