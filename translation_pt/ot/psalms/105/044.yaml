  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: pt
  text: Deu-lhes as terras das nações, e eles herdaram o trabalho dos povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tomaram posse do trabalho dos povos». O termo hebraico pode indicar o próprio trabalho ou aquilo que foi produzido ou adquirido por meio dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Deu
  rationale: O qal wayyiqtol de נתן expressa diretamente a ação passada de dar. A conjunção narrativa não precisa ser reproduzida em português neste contexto.
- source_word: לָהֶם
  choice: lhes
  rationale: O sufixo pronominal masculino plural funciona como objeto indireto e é expresso naturalmente pelo pronome «lhes».
- source_word: אַרְצוֹת גּוֹיִם
  choice: as terras das nações
  rationale: Preserva o plural de אַרְצוֹת e o sentido territorial e político de גּוֹיִם, sem recorrer a «gentios», inadequado neste contexto.
- source_word: וַעֲמַל
  choice: o fruto do trabalho
  rationale: עָמָל pode indicar tanto o trabalho penoso quanto aquilo que esse trabalho produz. Como algo herdado é mais naturalmente o resultado do labor, a tradução explicita essa extensão sem eliminar a alternativa lexical, registrada em nota.
- source_word: לְאֻמִּים
  choice: dos povos
  rationale: Expressa o sentido coletivo de לְאֻמִּים e evita repetir «nações» na mesma linha.
- source_word: יִירָשׁוּ
  choice: eles herdaram
  rationale: O qal de ירש pode significar herdar, possuir ou tomar posse. «Herdaram» preserva a ideia de posse recebida por concessão divina no contexto do salmo.
theological_decisions:
- issue: Nuance pactual de ירש
  choice: eles herdaram
  alternative: eles tomaram posse
  rationale: «Herdaram» mantém a tensão entre a aquisição efetiva da terra e seu caráter de dádiva divina, sem apresentar a posse como mera conquista humana.
- issue: Objeto de עמל
  choice: o fruto do trabalho dos povos
  alternative: o trabalho dos povos
  rationale: O hebraico admite tanto o labor quanto o resultado obtido por ele. O texto principal adota a extensão metonímica mais natural em português, enquanto a nota preserva a leitura mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é direta e o paralelismo poético hebraico é preservado. O marcador [a] aparece no texto principal junto à expressão que a nota esclarece.
