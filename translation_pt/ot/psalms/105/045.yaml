  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: pt
  text: para que guardassem os seus estatutos e observassem as suas instruções. Louvem Yah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “Louvem Yah!”, usando Yah, forma abreviada do nome divino. A expressão também é tradicionalmente transliterada como “Aleluia”.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Expressa naturalmente em português a finalidade introduzida pela preposição hebraica e rege adequadamente o subjuntivo no contexto narrativo.
- source_word: יִשְׁמְרוּ
  choice: guardassem
  rationale: Mantém o sentido pactual de conservar e cumprir com fidelidade, além de preservar a imagem básica de שׁמר.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Conserva a nuance de determinações prescritas e o vocabulário jurídico-pactual, sem confundir o termo com תורותיו.
- source_word: וְתוֹרֹתָיו
  choice: e as suas instruções
  rationale: O plural de תורה pode designar instruções ou leis. “Instruções” preserva a amplitude do termo e evita reduzir todas as ocorrências à ideia moderna de legislação.
- source_word: יִנְצֹרוּ
  choice: observassem
  rationale: Comunica o cumprimento atento das instruções e diferencia נצר de שׁמר sem enfraquecer o paralelismo.
- source_word: הַלְלוּ יָהּ
  choice: Louvem a Yah!
  rationale: Traduz o imperativo plural e conserva a forma abreviada do nome divino presente no hebraico, em vez de substituí-la pelo tetragrama completo ou ocultar sua estrutura em “Aleluia”.
theological_decisions:
- issue: Forma do nome divino na aclamação final
  choice: Yah
  alternative: SENHOR; Aleluia
  rationale: O texto traz יָהּ, forma abreviada do nome divino, e não יהוה. “Yah” preserva essa distinção; a nota registra as formas portuguesas mais tradicionais sem identificar silenciosamente as duas formas hebraicas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural após uma oração narrativa de finalidade. “Estatutos” mantém o tom pactual, enquanto “instruções” preserva a amplitude de תורה. O pronome possessivo foi repetido apenas uma vez em cada membro, conforme a estrutura hebraica e o uso natural em português.
