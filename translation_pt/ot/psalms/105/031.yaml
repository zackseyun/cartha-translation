  text: אָ֭מַר וַ/יָּבֹ֣א עָרֹ֑ב כִּ֝נִּ֗ים בְּ/כָל גְּבוּלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: pt
  text: Ele falou, e vieram enxames de moscas[a], e mosquitos[b] por todo o território deles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplesmente “enxames”; nas narrativas das pragas, o hebraico עָרֹב é tradicionalmente entendido como um enxame de moscas, embora o inseto exato seja incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “piolhos” ou “mosquitinhos”; não se sabe ao certo qual inseto é designado pelo hebraico כִּנִּים.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “vieram enxames de moscas, mosquitos por todo o território deles”.'
    reason: previous_rendering
lexical_decisions:
- source_word: אָמַר
  choice: Ele falou
  rationale: Preserva a fórmula breve de fala divina sem ampliar o verbo para “ordenou”, que seria interpretativo.
- source_word: וַיָּבֹא
  choice: vieram
  rationale: Expressa naturalmente a chegada da praga. O plural em português concorda com a formulação coletiva “enxames de moscas” e favorece a leitura corrente.
- source_word: עָרֹב
  choice: enxames de moscas
  rationale: No contexto das pragas, o termo é tradicionalmente entendido como enxames de insetos, geralmente moscas; a identificação exata permanece incerta e é registrada em nota.
- source_word: כִּנִּים
  choice: mosquitos
  rationale: Designa pequenos insetos da praga, mas sua identificação zoológica é incerta. “Mosquitos” é claro em português moderno, enquanto “piolhos” e “mosquitinhos” continuam possíveis.
- source_word: בְּכָל
  choice: por todo
  rationale: Comunica a distribuição da praga pela totalidade da área e mantém explicitamente a força de “todo”.
- source_word: גְּבוּלָם
  choice: o território deles
  rationale: Aqui גְּבוּל indica a extensão territorial, não apenas a linha de fronteira. A construção com “deles” é clara e acessível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. A repetição de “e” distingue as duas pragas e evita que “mosquitos” pareça apenas explicar “moscas”. As notas preservam a incerteza na identificação dos insetos.
