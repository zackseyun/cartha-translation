  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: pt
  text: Busquem Yahweh e a sua força; busquem a sua face continuamente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “busquem a sua presença continuamente”. O hebraico diz literalmente: “busquem a sua face continuamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Busquem
  rationale: O imperativo plural de דרשׁ, neste contexto de adoração, expressa a ação de voltar-se para Deus e procurá-lo com devoção, não apenas consultá-lo. “Busquem” comunica essa força de modo claro e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- source_word: וְעֻזּוֹ
  choice: e a sua força
  rationale: עֹז denota força, poder ou vigor. “A sua força” é uma tradução direta e mantém o sufixo pronominal referente a Yahweh.
- source_word: בַּקְּשׁוּ
  choice: busquem
  rationale: O imperativo plural de בקשׁ indica procurar ou buscar ativamente. Repetir “busquem” preserva o paralelismo poético com דרשׁוּ.
- source_word: פָנָיו
  choice: a sua face
  rationale: A expressão significa literalmente “a sua face” e pode, por metonímia, referir-se à presença de Deus. A tradução formal conserva a imagem relacional do hebraico.
- source_word: תָּמִיד
  choice: continuamente
  rationale: תָּמִיד indica constância ou regularidade persistente. “Continuamente” preserva essa ideia sem necessariamente impor a noção de uma ação ininterrupta a cada instante.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituí-lo por um título. “Javé” é uma forma aportuguesada possível, mas “Yahweh” mantém de maneira mais transparente a identificação adotada pelo projeto.
- issue: Tradução da expressão פָנָיו
  choice: a sua face
  alternative: a sua presença
  rationale: Embora “face” possa significar idiomaticamente “presença”, manter a imagem literal preserva a linguagem antropomórfica e relacional do salmo. A alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural adequados a uma exortação dirigida à comunidade. A repetição de “busquem” conserva o paralelismo hebraico; “a sua face” mantém a imagem original, esclarecida por nota.
