  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/אַרְצָ֑/ם רֵ֝אשִׁ֗ית לְ/כָל אוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/036.yaml
  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: pt
  text: Ele matou todo primogênito na terra deles, as primícias de todo o seu vigor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a primeira manifestação de toda a sua força”. A expressão hebraica apresenta os primeiros descendentes como a manifestação inicial do vigor, inclusive da potência geradora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: matou
  rationale: O hifil de נכה significa literalmente atingir ou ferir; no contexto da morte dos primogênitos, “matou” expressa com naturalidade o resultado letal inequívoco em português.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: A construção distributiva com substantivo singular é reproduzida naturalmente por “todo primogênito”.
- source_word: בְּאַרְצָם
  choice: na terra deles
  rationale: Preserva diretamente o sentido geográfico de אֶרֶץ e o sufixo pronominal masculino plural.
- source_word: רֵאשִׁית
  choice: as primícias
  rationale: רֵאשִׁית indica o começo ou a primeira porção; “primícias” conserva aqui a imagem dos primeiros descendentes como manifestação inicial do vigor.
- source_word: לְכָל אוֹנָם
  choice: de todo o seu vigor
  rationale: A preposição לְ marca a relação com אוֹן, que pode designar força, vigor ou potência geradora; “vigor” mantém a possível conotação procriadora sem explicitá-la em excesso.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: Ele, referindo-se a Deus
  alternative: Repetir explicitamente “Deus” ou “o SENHOR”
  rationale: O hebraico traz um sujeito masculino singular implícito, retomado do contexto. “Ele” preserva essa coesão sem inserir neste versículo um título divino ausente do texto.
- issue: Sentido de אוֹן na descrição dos primogênitos
  choice: vigor, preservando a metáfora de potência geradora
  alternative: força ou poder de procriação
  rationale: A formulação mantém a tensão entre o sentido geral de força e a referência contextual à capacidade geradora, sem reduzir o termo a uma única nuance.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Terra deles” evita a possível ambiguidade possessiva de “sua terra”; “primícias” mantém a imagem poética do hebraico.
