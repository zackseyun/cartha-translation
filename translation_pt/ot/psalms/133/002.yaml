  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: pt
  text: 'É como o óleo bom[a] sobre a cabeça,


    que escorre pela barba,


    pela barba de Arão,


    e escorre sobre a gola de suas vestes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “óleo precioso”. O hebraico diz mais literalmente “óleo bom”, expressão que também pode comunicar sua excelente qualidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “a abertura” ou “a borda de suas vestes”. A expressão hebraica diz literalmente “a boca de suas vestes” e provavelmente indica a abertura superior ou a gola.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  choice: como o óleo bom
  rationale: O prefixo כְּ marca comparação, e טוֹב significa primariamente “bom”. A formulação mantém a imagem e a repetição simples do hebraico sem elevar “bom” automaticamente a “precioso”.
- source_word: יֹרֵד / שֶׁיֹּרֵד
  choice: escorre / desce
  rationale: O verbo ירד descreve movimento para baixo. “Escorre” é natural para o movimento do óleo, enquanto “desce” na retomada preserva mais diretamente o verbo hebraico e evita repetição rígida.
- source_word: עַל הָרֹאשׁ
  choice: sobre a cabeça
  rationale: Tradução direta da preposição עַל e do substantivo רֹאשׁ.
- source_word: עַל הַזָּקָן זְקַן אַהֲרֹן
  choice: pela barba, pela barba de Arão
  rationale: “Pela” expressa naturalmente em português o óleo escorrendo sobre e ao longo da barba. A repetição de “barba” conserva a intensificação poética do hebraico.
- source_word: עַל פִּי מִדּוֹתָיו
  choice: até a gola de suas vestes
  rationale: פִּי, literalmente “boca de”, pode designar a abertura ou borda de uma roupa; “gola” oferece uma imagem natural da abertura superior. מִדּוֹתָיו refere-se aqui às vestes de Arão.
theological_decisions:
- issue: Natureza da imagem do óleo
  choice: Manter a comparação poética com o óleo sobre Arão sem explicitar no texto que se trata do óleo da unção sacerdotal.
  alternative: Traduzir de modo interpretativo como “óleo da unção” ou explicar seu simbolismo sacerdotal no corpo do versículo.
  rationale: O contexto evoca fortemente a unção de Arão, mas o hebraico diz apenas “o óleo bom”. A tradução preserva a alusão sem transformar uma associação contextual em explicação doutrinária explícita.
translation_notes:
  register: Português moderno, poético e acessível, com cadência em quatro linhas. A repetição “pela barba, pela barba de Arão” preserva o paralelismo hebraico. Os marcadores foram colocados junto às expressões a que as notas realmente se referem.
