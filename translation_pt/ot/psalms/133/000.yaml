base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/000.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: pt
  text: 'Cântico das Subidas.[a] De Davi.[b]


    Eis como é bom e agradável irmãos viverem juntos![c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cântico de peregrinação”. Literalmente, “Cântico das Subidas”; pode referir-se às peregrinações em direção a Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: Ou “Para Davi” ou “A respeito de Davi”.
    reason: source_ambiguity
  - marker: c
    text: “Irmãos” pode indicar irmãos de sangue ou, em sentido mais amplo, parentes e membros da mesma comunidade.
    reason: lexical_scope
  - marker: d
    text: Ou “viverem em união”. O hebraico enfatiza o fato de viverem juntos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico de peregrinação
  rationale: A expressão designa a coleção dos 'cânticos das subidas' e provavelmente se relaciona às peregrinações a Jerusalém. A forma escolhida é natural em português, enquanto a tradução literal fica registrada em nota.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Reproduz a força de chamar a atenção presente na partícula hebraica, de modo natural e direto.
- source_word: אַחִים
  choice: irmãos
  rationale: Mantém o sentido lexical básico, sem restringi-lo a irmãos biológicos; o alcance mais amplo possível é indicado em nota.
- source_word: שֶׁבֶת ... גַּם יָחַד
  choice: viverem juntos
  rationale: Expressa naturalmente a convivência ou habitação compartilhada. 'Juntos' traduz יָחַד, enquanto a ênfase de גַּם é comunicada pelo contexto exclamativo e explicada em nota.
theological_decisions:
- issue: Alcance de 'irmãos'
  choice: Manter 'irmãos' no texto
  alternative: parentes; membros do povo da aliança
  rationale: O hebraico permite tanto irmãos literais quanto uma comunidade fraterna mais ampla. A tradução não fixa indevidamente uma única referência.
- issue: Qualidade da convivência
  choice: viverem juntos
  alternative: viverem em união
  rationale: A opção principal segue mais diretamente יָחַד ('juntos'), sem excluir a harmonia sugerida pelo contexto; a alternativa interpretativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A abertura exclamativa preserva o tom celebrativo do hebraico.
