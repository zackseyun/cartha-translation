  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: pt
  text: 'como o orvalho do Hermom[a], que desce sobre os montes de Sião. Pois ali Yahweh ordenou a bênção: vida para sempre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o orvalho do Hermom que cai sobre os montes de Sião”.'
    reason: Alternativa lexical e de pontuação para שֶׁיֹּרֵד, preservando a possibilidade de ligação mais estreita da oração ao “orvalho do Hermom”.
  - marker: b
    text: 'Ou: “vida para todo o sempre”.'
    reason: Alternativa de tradução para חַיִּים עַד הָעוֹלָם.
lexical_decisions:
- source_word: כְּ/טַל
  choice: como o orvalho
  rationale: A preposição כְּ marca comparação, e טַל significa “orvalho”; a formulação preserva a imagem poética com naturalidade em português.
- source_word: חֶרְמוֹן
  choice: Hermom
  rationale: Forma consagrada e reconhecível em português para o topônimo hebraico.
- source_word: שֶׁ/יֹּרֵד
  choice: que desce
  rationale: O verbo ירד expressa movimento descendente. “Desce” mantém essa força e combina naturalmente com a imagem do orvalho.
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: sobre os montes de Sião
  rationale: Preserva o plural construto hebraico הַרְרֵי e emprega a forma tradicional portuguesa do topônimo Sião.
- source_word: כִּי שָׁם
  choice: Pois ali
  rationale: כִּי introduz aqui a razão da afirmação anterior, enquanto שָׁם permanece como advérbio sem explicitação interpretativa do referente.
- source_word: צִוָּה
  choice: ordenou
  rationale: Mantém o sentido básico e a força autoritativa do verbo צוה, sem substituí-lo por uma formulação interpretativa como “concedeu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֶת הַ/בְּרָכָה
  choice: a bênção
  rationale: Reproduz diretamente o objeto definido do verbo.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: vida para sempre
  rationale: Expressa de modo atual e claro a duração indefinida ou perpétua indicada por עַד הָעוֹלָם.
theological_decisions:
- issue: Relação da frase final com “a bênção”
  choice: Apresentar “vida para sempre” como explicação aposicional da bênção, usando dois-pontos.
  alternative: Ler “vida para sempre” como frase independente ou exclamação.
  rationale: A sequência hebraica compacta identifica naturalmente o conteúdo da bênção. Os dois-pontos tornam essa relação clara em português sem desenvolver uma formulação doutrinária além do texto.
- issue: Referente de “ali”
  choice: Manter apenas o advérbio “ali”.
  alternative: Explicitar “ali em Sião” ou “ali, entre os irmãos que vivem em união”.
  rationale: O hebraico não explicita o referente. A tradução conserva a concisão e a abertura poética do original.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. Mantêm-se o plural “montes”, o nome divino Yahweh e a ambiguidade do advérbio “ali”.
