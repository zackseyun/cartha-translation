  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: pt
  text: 'Cântico das subidas[a]. De Davi.[b]


    Vejam como é bom e agradável os irmãos[c] viverem juntos![d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cântico de peregrinação”. A expressão hebraica também pode ser traduzida literalmente como “cântico das ascensões” ou “das subidas”.
    reason: lexical_alternative
  - marker: b
    text: “De Davi” também pode significar “por Davi”, “para Davi” ou indicar associação com ele.
    reason: source_ambiguity
  - marker: c
    text: “Irmãos” pode referir-se a irmãos de sangue ou, em sentido mais amplo, a parentes e membros da comunidade da aliança.
    reason: lexical_alternative
  - marker: d
    text: O hebraico traz uma expressão enfática, literalmente próxima de “também juntos”; ela ressalta o viver em comum.
    reason: source_idiom
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Preserva de modo relativamente formal a expressão tradicional que encabeça os Salmos 120–134, sem decidir se as “subidas” se referem a peregrinações, degraus ou outra associação.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Em títulos de salmos, a preposição לְ pode indicar autoria, associação ou dedicação. “De Davi” mantém essa abertura melhor que “por Davi” ou “para Davi”.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A partícula chama a atenção e introduz uma exclamação admirativa. “Vejam” comunica isso em português atual e digno.
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: como é bom e agradável
  rationale: Reproduz naturalmente a construção exclamativa com מַה e mantém o paralelismo dos dois adjetivos.
- source_word: שֶׁבֶת אַחִים
  choice: os irmãos viverem
  rationale: O infinitivo de ישׁב descreve o estado ou ato de morar, habitar ou viver. A oração infinitiva é natural em português; “irmãos” conserva o masculino plural do hebraico e sua possível extensão comunitária.
- source_word: גַּם יָחַד
  choice: juntos
  rationale: Traduz diretamente יָחַד e comunica com naturalidade a convivência compartilhada. O valor enfático de גַּם é registrado em nota, sem ampliar o texto para “em unidade”.
theological_decisions:
- issue: Alcance de אַחִים (“irmãos”)
  choice: Manter “irmãos” no texto principal, admitindo sentido literal ou comunitário.
  alternative: Traduzir por “parentes”, “povo” ou “membros da comunidade”.
  rationale: O termo pode designar irmãos de sangue ou, de forma mais ampla, membros do povo da aliança. A tradução não restringe nem neutraliza silenciosamente esse alcance.
- issue: Sentido de גַּם יָחַד
  choice: Traduzir por “juntos” e explicar em nota o caráter enfático da expressão.
  alternative: Traduzir por “em união” ou “juntos em harmonia”.
  rationale: “Juntos” corresponde diretamente a יָחַד. As alternativas tornam explícita uma harmonia plausível no contexto, mas mais interpretativa do que a formulação hebraica.
- issue: Relação indicada por לְדָוִד
  choice: Usar “De Davi”.
  alternative: “Por Davi” ou “Para Davi”.
  rationale: O hebraico não obriga a escolher exclusivamente entre autoria, associação e dedicação; “De Davi” preserva melhor essa tensão.
translation_notes:
  register: Português moderno, claro e poético, com leitura natural no Brasil e compreensão internacional. “Vejam” verte a chamada de atenção de הִנֵּה sem recorrer ao mais arcaizante “eis”. A ordem e a exclamação preservam o tom admirativo do verso.
