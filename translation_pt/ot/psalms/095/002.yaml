  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: pt
  text: Vamos à sua presença com ações de graças[a]; aclamemo-lo com cânticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu rosto”, expressão comum que significa sua presença pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Vamos à sua presença
  rationale: O hifil coortativo na primeira pessoa do plural expressa uma exortação coletiva. Em português, “vamos à” comunica com naturalidade o movimento de aproximar-se e comparecer diante de alguém.
- source_word: פָנָיו
  choice: sua presença
  rationale: Embora o hebraico diga literalmente “seu rosto”, פָּנִים funciona aqui como expressão idiomática de presença pessoal. A tradução idiomática evita a construção pouco natural “ir diante do seu rosto”, enquanto a nota preserva a imagem concreta do original.
- source_word: בְּתוֹדָה
  choice: com ações de graças
  rationale: תּוֹדָה pode indicar gratidão, louvor ou oferta de gratidão. O paralelismo com cânticos favorece aqui a expressão vocal de gratidão, sem exigir o sentido sacrificial.
- source_word: בִּזְמִרוֹת
  choice: com cânticos
  rationale: זְמִרוֹת designa composições cantadas, frequentemente de louvor. “Cânticos” é digno, claro e apropriado ao contexto de adoração, sem restringir o termo a salmos canônicos.
- source_word: נָרִיעַ
  choice: aclamemos
  rationale: O hifil coortativo descreve um brado jubiloso. “Aclamemos” transmite uma manifestação vocal intensa e festiva, com maior naturalidade no registro poético português do que “façamos um ruído alegre”.
- source_word: לוֹ
  choice: a ele
  rationale: A preposição לְ com sufixo masculino singular indica o destinatário da aclamação. “A ele” conserva explicitamente essa direção.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ritmo exortativo adequado à poesia de culto. Preferiu-se a equivalência idiomática “sua presença” no texto principal; a formulação literal foi preservada em nota. Os dois coortativos hebraicos foram vertidos como exortações coletivas paralelas: “Vamos” e “aclamemos”.'
