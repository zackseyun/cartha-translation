  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: pt
  text: O mar é dele[a], pois ele o fez[b], e suas mãos formaram a terra seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertence a ele”. O hebraico diz literalmente, em construção elíptica: “a quem [pertence] o mar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ele o fez”. A conjunção hebraica significa formalmente “e”, embora aqui provavelmente expresse uma relação de causa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: é dele
  rationale: A construção relativa com לְ expressa posse. “É dele” reproduz de modo conciso e natural o sentido literal aproximado de “o qual/a ele [pertence] o mar”.
- source_word: הַיָּם
  choice: o mar
  rationale: É o equivalente usual e direto do substantivo hebraico, sem ampliar o sentido para “oceano”.
- source_word: וְהוּא
  choice: pois foi ele quem
  rationale: Embora וְ seja formalmente “e”, a relação contextual é provavelmente causal. “Pois” torna essa relação natural em português, enquanto “foi ele quem” preserva a ênfase do pronome explícito הוּא.
- source_word: עָשָׂהוּ
  choice: o fez
  rationale: O sufixo masculino singular retoma “o mar”; “fez” é o equivalente corrente de עשה neste contexto.
- source_word: וְיַבֶּשֶׁת
  choice: e ... a terra seca
  rationale: יַבֶּשֶׁת designa a porção seca em contraste com o mar. “Terra seca” mantém claramente esse contraste.
- source_word: יָדָיו
  choice: suas mãos
  rationale: Mantém a imagem antropomórfica explícita e a força poética do hebraico.
- source_word: יָצָרוּ
  choice: formaram
  rationale: O verbo יצר comunica a ideia de dar forma ou modelar. “Formaram” preserva a distinção lexical em relação a עשה, traduzido por “fez”.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter “suas mãos formaram”
  alternative: “ele formou” ou “seu poder formou”
  rationale: O hebraico atribui expressamente a formação às “mãos” de Deus. A manutenção da imagem respeita a poesia sem impor uma explicação doutrinária.
- issue: Distinção entre os verbos de criação עשה e יצר
  choice: 'Traduzir por verbos distintos: “fez” e “formaram”'
  alternative: Usar “fez” para ambos ou “formou” para ambos
  rationale: A variação verbal conserva a textura e o paralelismo do original sem afirmar uma diferença teológica maior do que o texto permite.
- issue: Valor da conjunção וְ antes de הוּא
  choice: Expressar a provável relação causal com “pois”
  alternative: Conservar a coordenação formal com “e”
  rationale: O contexto apresenta a criação do mar como fundamento de sua pertença a Deus. A nota preserva a possibilidade da leitura formalmente coordenativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação mantém o paralelismo poético, a imagem das mãos divinas e a distinção entre “fazer” e “formar”.
