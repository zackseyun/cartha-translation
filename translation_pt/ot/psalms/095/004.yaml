  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ מֶחְקְרֵי אָ֑רֶץ וְ/תוֹעֲפ֖וֹת הָרִ֣ים לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/004.yaml
  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: pt
  text: Em sua mão estão as profundezas da terra[a], e as alturas dos montes lhe pertencem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os lugares mais profundos da terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e os picos dos montes são seus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Em sua mão
  rationale: A oração relativa retoma o SENHOR do versículo anterior. Em português, a retomada pelo pronome possessivo é natural e conserva a imagem concreta de posse e domínio expressa pelo hebraico.
- source_word: מֶחְקְרֵי
  choice: as profundezas
  rationale: O termo designa lugares profundos, remotos ou difíceis de perscrutar. “Profundezas” preserva a concisão poética e o contraste vertical com as alturas dos montes.
- source_word: אָרֶץ
  choice: da terra
  rationale: No contexto cósmico do salmo, “terra” comunica melhor a abrangência da criação do que a alternativa regional “terra/país”.
- source_word: וְתוֹעֲפוֹת
  choice: e as alturas
  rationale: O substantivo indica elevações ou pontos culminantes. “Alturas” mantém o paralelismo com “profundezas” sem restringir o sentido a picos específicos.
- source_word: הָרִים
  choice: dos montes
  rationale: “Montes” é uma forma corrente, digna e poética em português bíblico moderno, adequada à referência coletiva do hebraico.
- source_word: לוֹ
  choice: lhe pertencem
  rationale: Explicita de maneira natural em português a relação concisa de posse expressa por לְ, sem acrescentar uma noção alheia ao texto.
theological_decisions:
- issue: Alcance do domínio divino nas imagens da criação
  choice: Uma afirmação cósmica de que tanto as profundezas da terra quanto as alturas dos montes estão sob a posse soberana do SENHOR.
  alternative: Uma referência mais localizada à terra de Israel e ao seu relevo.
  rationale: O convite abrangente à adoração no salmo e o contraste entre profundezas e alturas favorecem uma afirmação sobre toda a criação, não apenas sobre uma região.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A formulação preserva a imagem concreta da mão, o paralelismo entre profundezas e alturas e a concisão poética do hebraico.
