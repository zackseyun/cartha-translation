base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: pt
  text: Venham, prostremo-nos[a] e curvemo-nos; ajoelhemo-nos diante de Yahweh, nosso Criador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inclinemo-nos em adoração”; o verbo hebraico inclui o ato físico de curvar-se profundamente ou prostrar-se em adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Venham
  rationale: Imperativo plural que convoca a comunidade; “Venham” é natural, direto e adequado ao tom litúrgico.
- source_word: נִשְׁתַּחֲוֶה
  choice: prostremo-nos
  rationale: O verbo descreve prostrar-se ou inclinar-se profundamente diante de alguém, muitas vezes como ato de adoração. “Prostremo-nos” preserva o gesto corporal e sua função cultual.
- source_word: וְנִכְרָעָה
  choice: e curvemo-nos
  rationale: כרע indica abaixar-se, curvar-se ou pôr-se de joelhos. “Curvemo-nos” distingue este verbo do seguinte sem apagar a sequência de posturas reverentes.
- source_word: נִבְרְכָה
  choice: ajoelhemo-nos
  rationale: A forma nifal de ברך neste contexto significa pôr-se de joelhos, não “abençoar”. A tradução preserva o sentido contextual e evita confundi-la com o uso piel do mesmo radical, “abençoar”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa estar perante ou na presença de alguém; “diante de” é corrente e conciso em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשֵׂנוּ
  choice: aquele que nos fez
  rationale: O particípio com sufixo de primeira pessoa plural significa literalmente “aquele que nos fez/faz”. Esta formulação é clara e preserva a referência direta de “nosso Criador” ao ato de fazer.
theological_decisions:
- issue: Sentido de נִבְרְכָה
  choice: ajoelhemo-nos
  alternative: bendigamos
  rationale: Embora ברך em outra conjugação possa significar “abençoar”, a forma nifal aqui, coordenada com verbos de prostração e acompanhada de “diante de”, denota ajoelhar-se. A tradução segue a morfologia e o paralelismo hebraicos.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e solene, com formas inclusivas de exortação comunitária. A sequência de três verbos corporais foi mantida, usando termos distintos para refletir a variação do hebraico e evitar uma repetição desnecessariamente rígida.
