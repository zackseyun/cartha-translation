source:
  edition: WLC
  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: pt
  text: 'Durante quarenta anos, senti repulsa por aquela geração[a] e disse: “Eles são um povo de coração errante e não conheceram os meus caminhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquei desgostoso com aquela geração”. O verbo hebraico pode expressar repulsa, enfado ou pesar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Durante quarenta anos
  rationale: Expressa naturalmente em português a duração indicada pelo sintagma temporal colocado no início do verso.
- source_word: אָקוּט
  choice: senti repulsa por
  rationale: Preserva a forte reação de aversão, desgosto ou enfado comunicada pelo verbo hebraico, sem reduzi-la apenas a tristeza.
- source_word: בְּדוֹר
  choice: por aquela geração
  rationale: A preposição é vertida de modo idiomático conforme a regência portuguesa, e “aquela” identifica pelo contexto a geração do deserto.
- source_word: עַם תֹּעֵי לֵבָב
  choice: um povo de coração errante
  rationale: Mantém a imagem hebraica do coração como sede da disposição interior e o caráter contínuo expresso pelo particípio, em formulação natural e dignificada.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: não conheceram os meus caminhos
  rationale: Conserva o sentido básico de ידע, “conhecer”, e a metáfora dos caminhos de Deus. O pretérito perfeito é natural em português e apresenta o fracasso constatado dessa geração.
- source_word: וָאֹמַר
  choice: e disse
  rationale: Preserva de maneira direta a sequência narrativa sem acrescentar uma relação causal não explicitada.
theological_decisions:
- issue: Atitude divina expressa por אָקוּט
  choice: 'Uma forte expressão de aversão: “senti repulsa por”'
  alternative: “Fiquei desgostoso com” ou “afligi-me por causa de”
  rationale: O verbo admite matizes de repulsa, enfado e pesar. A opção principal mantém a força da desaprovação divina no contexto, enquanto a nota preserva a amplitude lexical sem impor uma definição teológica posterior.
- issue: Natureza do desvio em תֹּעֵי לֵבָב
  choice: “de coração errante”
  alternative: “que se desviam no coração”
  rationale: A tradução conserva a referência à disposição interior e evita explicar além do que o texto afirma.
- issue: Aspecto de לֹא יָדְעוּ דְרָכָי
  choice: “não conheceram os meus caminhos”
  alternative: “não conhecem os meus caminhos”
  rationale: O perfeito hebraico pode apresentar a falha como fato consumado ou como avaliação de efeito persistente. O pretérito é idiomático em português, sem negar o caráter contínuo da acusação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmo. “Senti repulsa” comunica a força do hebraico sem recorrer ao potencialmente ambíguo “odiei”; “de coração errante” preserva a metáfora e a concisão poética.
