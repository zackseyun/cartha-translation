  text: אַל תַּקְשׁ֣וּ לְ֭בַבְ/כֶם כִּ/מְרִיבָ֑ה כְּ/י֥וֹם מַ֝סָּ֗ה בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: pt
  text: Não endureçam o coração, como em Meribá[a], como no dia de Massá[b], no deserto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meribá significa “contenda” ou “disputa”.
    reason: lexical_alternative
  - marker: b
    text: Massá significa “provação” ou “teste”.
    reason: lexical_alternative
  - marker: c
    text: Veja Êxodo 17:7 e Números 20:13, que relatam os episódios no deserto aos quais este versículo alude.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Não endureçam
  rationale: A partícula negativa com a forma verbal expressa uma proibição. O plural de “endureçam” representa diretamente a forma dirigida a várias pessoas.
- source_word: לְבַבְכֶם
  choice: o coração
  rationale: O hebraico emprega “coração” no singular com sufixo de segunda pessoa do plural. Em português, o singular coletivo é natural e preserva a forma da expressão sem tornar a frase pesada.
- source_word: כִּמְרִיבָה
  choice: como em Meribá
  rationale: Embora מְרִיבָה também signifique “contenda” ou “disputa”, aqui o paralelo com Massá e o contexto do deserto favorecem o nome histórico. A preposição “em” torna explícita em português a referência ao episódio ou lugar.
- source_word: כְּיוֹם מַסָּה
  choice: como no dia de Massá
  rationale: A construção compara a situação presente ao dia associado a Massá. “Dia de Massá” segue de perto a relação nominal hebraica e mantém o nome próprio.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a forma corrente e clara em português para מִדְבָּר neste contexto da peregrinação de Israel, sem excluir a ideia de região erma.
theological_decisions:
- issue: Interpretar מְרִיבָה e מַסָּה como nomes próprios ou substantivos comuns
  choice: Manter os nomes próprios “Meribá” e “Massá” no texto
  alternative: “como na contenda, como no dia da provação no deserto”
  rationale: O contexto remete a acontecimentos históricos específicos da peregrinação no deserto. Os nomes próprios preservam essa ligação intertextual, enquanto as notas informam seus sentidos lexicais sem transformar a tradução principal em paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo está no plural; “o coração” conserva o singular coletivo do hebraico. Os topônimos seguem as formas portuguesas tradicionais “Meribá” e “Massá”.
