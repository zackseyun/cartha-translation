  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: pt
  text: Pois ele é o nosso Deus, e nós somos o povo do seu pasto e o rebanho sob sua mão. Hoje, se vocês ouvirem a sua voz—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Hoje, quem dera vocês ouvissem a sua voz!” A partícula hebraica também pode introduzir uma exortação em forma de desejo, e não apenas uma condição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do chamado à adoração nos versículos anteriores; “pois” expressa naturalmente essa função explicativa.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Tradução direta do substantivo com sufixo possessivo plural, preservando a linguagem relacional do texto.
- source_word: עַם מַרְעִיתוֹ
  choice: o povo do seu pasto
  rationale: Mantém a metáfora pastoril concreta e o paralelismo com o rebanho, sem converter a imagem em explicação.
- source_word: צֹאן יָדוֹ
  choice: o rebanho da sua mão
  rationale: Reproduz de perto a expressão hebraica e conserva a imagem da mão de Deus como sinal de cuidado, direção e domínio.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Mantém a posição enfática e funciona como transição retórica para a advertência seguinte.
- source_word: אִם
  choice: se
  rationale: Preserva a forma condicional que conduz naturalmente à exortação do versículo seguinte, sem apagar a possível nuance de desejo.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: vocês ouvirem a sua voz
  rationale: Mantém o sentido básico de שׁמע e deixa que o contexto comunique a implicação de escutar com obediência.
theological_decisions:
- issue: Força de הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: “Hoje, se vocês ouvirem a sua voz—” como abertura condicional e exortativa.
  alternative: “Hoje, quem dera vocês ouvissem a sua voz!” como expressão de desejo.
  rationale: אִם pode introduzir uma condição ou, em contexto poético, assumir força desiderativa. A leitura condicional liga-se de modo natural à proibição do versículo seguinte; a nota preserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” explicita o destinatário coletivo. O travessão final indica que a frase prossegue na advertência do versículo seguinte.
