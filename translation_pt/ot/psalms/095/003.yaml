  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: pt
  text: Pois Yahweh é um grande Deus e um grande Rei acima de todos os deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «acima de todos os seres divinos». O hebraico אֱלֹהִים pode referir-se a deuses, seres divinos ou seres celestiais, conforme o contexto.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado à adoração nos versículos anteriores, preservando de modo natural a força causal.
- source_word: אֵל גָּדוֹל
  choice: um grande Deus
  rationale: אֵל designa Deus neste predicado, e גָּדוֹל expressa sua grandeza e posição exaltada. O artigo indefinido torna a construção natural em português sem sugerir que Yahweh seja apenas um entre vários deuses.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמֶלֶךְ גָּדוֹל
  choice: e um grande Rei
  rationale: Mantém a segunda afirmação paralela sobre Yahweh e preserva a repetição enfática de גָּדוֹל. A inicial maiúscula em «Rei» assinala seu uso como título de Yahweh.
- source_word: עַל
  choice: acima de
  rationale: Neste contexto comparativo, comunica a supremacia e a posição exaltada de Yahweh.
- source_word: כָּל אֱלֹהִים
  choice: todos os deuses
  rationale: Preserva a formulação e a tensão teológica do hebraico sem decidir se os referentes são falsos deuses, ídolos ou seres espirituais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de אֱלֹהִים em «acima de todos os deuses»
  choice: deuses
  alternative: seres divinos; seres celestiais
  rationale: «Deuses» mantém a amplitude lexical e a tensão teológica do original, sem determinar na tradução a natureza exata desses referentes.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura paralela e a repetição de «grande» foram preservadas.
