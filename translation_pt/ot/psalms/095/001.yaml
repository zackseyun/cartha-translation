  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: pt
  text: Venham, cantemos com alegria a Yahweh[a]; aclamemos a Rocha da nossa salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: יהוה (YHWH), tradicionalmente vocalizado “Yahweh”. O nome divino é tradicionalmente traduzido como “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo plural de הלך funciona aqui idiomaticamente como convite ou convocação. “Venham” comunica com naturalidade essa força exortativa em português, em vez do sentido espacial mais literal de “vão”.
- source_word: נְרַנְּנָה
  choice: cantemos com alegria
  rationale: O coortativo plural de רנן expressa louvor vocal jubiloso. A formulação conserva tanto o canto quanto a alegria.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica aquele a quem se dirige o louvor, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: נָרִיעָה
  choice: aclamemos
  rationale: O coortativo de רוע/ריע no hifil descreve levantar um brado forte, muitas vezes em celebração ou adoração. “Aclamemos” preserva o caráter vocal, coletivo e público sem acrescentar ao verbo uma emoção que depende do contexto.
- source_word: לְצוּר
  choice: a Rocha
  rationale: צוּר significa literalmente “rocha” e funciona como metáfora divina de firmeza, proteção e força. A maiúscula sinaliza o uso titular da metáfora sem substituí-la por uma explicação.
- source_word: יִשְׁעֵנוּ
  choice: da nossa salvação
  rationale: O substantivo יֵשַׁע, com sufixo da primeira pessoa do plural, forma com “Rocha” uma relação construta. “Nossa salvação” mantém a forma nominal e a amplitude de livramento do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem o substituir por um título; a nota registra a tradução tradicional.
- issue: Metáfora divina צוּר
  choice: a Rocha da nossa salvação
  alternative: aquele que nos protege e salva
  rationale: A tradução mantém a metáfora concreta e sua tensão poética, em vez de resolvê-la numa paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Venham” introduz uma convocação coletiva natural; “cantemos” e “aclamemos” preservam o paralelismo exortativo do hebraico. O marcador foi colocado junto de “Yahweh”, termo ao qual a nota se refere.
