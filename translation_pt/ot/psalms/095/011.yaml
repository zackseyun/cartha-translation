  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: pt
  text: 'Por isso jurei na minha ira: “Eles não entrarão no meu descanso”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “se entrarem no meu descanso” — fórmula de juramento que significa “eles não entrarão no meu descanso”. “Meu descanso” também pode significar “meu lugar de descanso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Por isso
  rationale: Neste contexto, liga a declaração ao que precede e introduz a consequência da rebelião; “Por isso” expressa essa relação com naturalidade em português.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: O nifal de שבע significa aqui “jurar, prestar juramento”; “jurei” é direto, idiomático e mantém a solenidade.
- source_word: בְאַפִּי
  choice: na minha ira
  rationale: אַף refere-se literalmente ao nariz, mas idiomaticamente expressa ira. “Na minha ira” comunica o sentido com clareza e registro digno.
- source_word: אִם
  choice: não
  rationale: Depois de um juramento, אִם integra uma fórmula elíptica de forte negação. Em português, a força real da fórmula deve ser explicitada como “não”.
- source_word: יְבֹאוּן אֶל
  choice: entrarão no
  rationale: A combinação de בוא com אֶל indica ingresso; “entrarão no” é a formulação portuguesa natural.
- source_word: מְנוּחָתִי
  choice: meu descanso
  rationale: מְנוּחָה pode indicar tanto descanso quanto lugar de repouso. “Meu descanso” preserva a concisão e a ambiguidade teológica do hebraico sem restringir o sentido a um lugar.
theological_decisions:
- issue: Fórmula elíptica de juramento com אִם
  choice: 'Negação explícita: “Eles não entrarão no meu descanso”'
  alternative: 'Forma literalmente reproduzida: “se entrarem no meu descanso”'
  rationale: No hebraico, אִם após o verbo “jurar” exprime uma negação solene, embora elíptica. Tornar a negação explícita comunica a força da fórmula sem acrescentar uma interpretação doutrinária.
- issue: Sentido de מְנוּחָה
  choice: meu descanso
  alternative: meu lugar de descanso
  rationale: O termo admite tanto a ideia de repouso quanto a de um lugar de repouso. A opção escolhida preserva essa amplitude e evita especificação indevida.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Ira” conserva o peso do original sem soar arcaico. A ordem da frase mantém a relação consequencial com o contexto e a fala divina em discurso direto.
