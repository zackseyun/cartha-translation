  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: pt
  text: onde os seus pais me puseram à prova e me testaram, embora tivessem visto a minha obra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde os seus pais me puseram à prova; examinaram-me e também viram a minha obra”. O hebraico admite essa tradução mais literal; o texto principal expressa a provável relação concessiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: onde
  rationale: No contexto, o relativo retoma o lugar mencionado no versículo anterior, Massá e Meribá, e por isso tem sentido locativo.
- source_word: נִסּוּנִי
  choice: me puseram à prova
  rationale: Expressa de modo natural e claro a ação hostil de provar Deus, evitando que a coordenação dos dois verbos hebraicos soe como mera repetição.
- source_word: אֲבוֹתֵיכֶם
  choice: os seus pais
  rationale: Preserva o masculino do hebraico e a referência retórica aos antepassados da comunidade, com formulação corrente em português.
- source_word: בְּחָנוּנִי
  choice: me testaram
  rationale: Mantém o paralelismo com o primeiro verbo e o sentido de submeter Deus à prova.
- source_word: גַּם
  choice: embora
  rationale: 'Embora possa significar literalmente «também» ou «até», no contexto introduz provavelmente uma relação concessiva: eles provaram Deus apesar de já terem visto sua atuação.'
- source_word: רָאוּ
  choice: tivessem visto
  rationale: O mais-que-perfeito do subjuntivo harmoniza-se com a construção concessiva e indica que a experiência da obra divina antecedeu ou já acompanhava a provocação.
- source_word: פָעֳלִי
  choice: a minha obra
  rationale: Reproduz o substantivo singular coletivo, que pode abranger a atuação ou os feitos poderosos de Deus no êxodo e no deserto.
theological_decisions:
- issue: Força concessiva da oração final
  choice: embora tivessem visto a minha obra
  alternative: e também viram a minha obra
  rationale: 'O contexto favorece a concessão: os pais puseram Deus à prova apesar de terem presenciado sua atuação. A nota preserva a leitura coordenada mais literal.'
- issue: Tradução de אֲבוֹתֵיכֶם
  choice: os seus pais
  alternative: os seus antepassados
  rationale: A opção mantém a forma masculina e a linguagem pactual direta do texto hebraico, sem excluir que a expressão designe gerações ancestrais.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A coordenação «me puseram à prova e me testaram» preserva os dois verbos paralelos; a nota registra a ambiguidade de גַּם e a construção hebraica mais literal.
