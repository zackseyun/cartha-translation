  text: אַל תִּבְטְח֥וּ בִ/נְדִיבִ֑ים בְּ/בֶן אָדָ֓ם שֶׁ֤/אֵֽין ל֥/וֹ תְשׁוּעָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: pt
  text: 'Não confiem em príncipes,

    nem em um ser humano[a], em quem não há salvação[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um filho de homem”, expressão que aqui significa um ser humano mortal, não um título messiânico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “livramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Não confiem
  rationale: A partícula negativa אַל com a forma verbal expressa uma proibição. “Não confiem” reproduz diretamente essa força e mantém o plural do hebraico.
- source_word: בִנְדִיבִים
  choice: em príncipes
  rationale: נְדִיבִים pode designar nobres, príncipes ou pessoas de posição elevada. No contexto da advertência contra a confiança no poder humano, “príncipes” comunica bem a elite governante.
- source_word: בְּבֶן אָדָם
  choice: em um ser humano[a]
  rationale: A expressão hebraica é literalmente “em um filho de homem”, mas aqui funciona como expressão genérica para um ser humano mortal. A formulação natural evita sugerir indevidamente um título messiânico, enquanto a nota preserva a forma do original.
- source_word: שֶׁאֵין לוֹ
  choice: em quem não há
  rationale: A construção combina a partícula relativa com negação existencial. “Em quem não há” conserva a ligação sintática com a pessoa em quem se poderia confiar.
- source_word: תְשׁוּעָה
  choice: salvação[b]
  rationale: תְשׁוּעָה abrange salvação, livramento ou socorro. “Salvação” mantém a amplitude e o peso do contraste do salmo entre a incapacidade humana e o poder salvador de Deus.
theological_decisions:
- issue: Sentido de בֶּן־אָדָם (“filho de homem”)
  choice: Referência genérica a um ser humano mortal
  alternative: Entender a expressão como título messiânico ou reproduzi-la literalmente no texto principal
  rationale: O paralelismo com “príncipes” e o contexto imediato tratam da mortalidade e da incapacidade dos seres humanos. Não há aqui indicação de uso titular ou messiânico.
- issue: Alcance de תְשׁוּעָה
  choice: “salvação”, sem restringir o termo à salvação espiritual
  alternative: “livramento” ou “socorro”
  rationale: O termo pode referir-se a resgate ou livramento em sentido amplo. “Salvação” preserva essa tensão e não deve ser lida como limitação exclusiva a uma categoria doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantém-se “príncipes” por sua precisão contextual; “ser humano” comunica naturalmente o idioma hebraico sem criar uma associação messiânica indevida. A disposição em duas linhas acompanha o paralelismo poético.
