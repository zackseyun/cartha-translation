  text: עֹשֶׂ֤ה מִשְׁפָּ֨ט לָ/עֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָ/רְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/007.yaml
  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: pt
  text: que faz justiça aos oprimidos[a], que dá pão aos famintos. Yahweh liberta os que estão presos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz valer o direito dos oprimidos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “solta os que estão amarrados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: faz justiça
  rationale: A expressão descreve a ação contínua e característica de Yahweh em favor dos oprimidos. “Faz justiça” é natural em português e preserva o sentido de corrigir injustiças.
- source_word: לָעֲשׁוּקִים
  choice: aos oprimidos
  rationale: O particípio passivo substantivado designa pessoas submetidas à opressão; “os oprimidos” conserva de modo conciso sua força social e ética.
- source_word: נֹתֵן לֶחֶם
  choice: dá pão
  rationale: A tradução direta mantém tanto a ação habitual expressa pelo particípio quanto a referência concreta a pão, sem generalizá-la para “alimento”.
- source_word: לָרְעֵבִים
  choice: aos famintos
  rationale: O adjetivo substantivado refere-se aos que têm fome. “Aos famintos” é corrente, claro e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַתִּיר אֲסוּרִים
  choice: liberta os que estão presos
  rationale: מַתִּיר significa soltar ou desfazer aquilo que prende, e אֲסוּרִים pode designar pessoas atadas ou encarceradas. A formulação principal comunica o sentido com naturalidade sem restringi-lo ao substantivo institucional “prisioneiros”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio do Deus de Israel. A transliteração “Yahweh” preserva essa função e segue a política indicada para o Tetragrama.
- issue: Alcance de מַתִּיר אֲסוּרִים
  choice: liberta os que estão presos
  alternative: solta os que estão amarrados
  rationale: A construção admite tanto a imagem concreta de pessoas atadas quanto a referência contextual a presos. O texto principal usa uma expressão portuguesa ampla e a nota preserva a imagem lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém o paralelismo dos particípios hebraicos por meio de orações com “que” e conserva “pão” como imagem concreta.
