  text: הַֽלְלוּ יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: pt
  text: Louvem Yah![a] Louve Yahweh, minha alma!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Louvem Yah». Tradicionalmente, esta abertura é muitas vezes representada pela forma «Aleluia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louvem
  rationale: Imperativo masculino plural de הלל; em português, a forma plural explicita naturalmente o chamado dirigido à comunidade.
- source_word: יָהּ
  choice: Yah
  rationale: Forma poética abreviada do nome divino, preservada como nome próprio e mantida distinta do verbo, conforme o hebraico.
- source_word: הַלְלִי
  choice: Louve
  rationale: Imperativo feminino singular de הלל, em concordância com נֶפֶשׁ, aqui usado numa exortação direta do salmista à própria alma.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: No contexto de autoexortação poética, 'minha alma' é natural, digna e preserva a dimensão interior do hebraico.
- source_word: אֶת
  choice: (não traduzido separadamente)
  rationale: Marcador do objeto direto, cuja função é expressa pela sintaxe normal do português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é transliterado como nome divino, em vez de ser substituído pelo título 'Senhor'.
theological_decisions:
- issue: Representação de יָהּ e יְהוָה no mesmo versículo
  choice: Traduzir יָהּ como 'Yah' e יְהוָה como 'Yahweh'.
  alternative: Empregar 'Senhor' para ambos, ou transliterar a expressão inicial como 'Aleluia'.
  rationale: O hebraico usa duas formas relacionadas, porém distintas, do nome divino. Preservá-las mantém a forma do texto e evita substituir nomes por um título.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira. O plural 'Louvem' torna explícito o destinatário coletivo do primeiro imperativo; 'Louve... minha alma' conserva a autoexortação direta e a concordância feminina do hebraico.
