  text: אֲהַלְלָ֣ה יְהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵֽ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/002.yaml
  text: I will praise Yahweh all my life[a]; I will sing praises to my God as long as I live.
translation:
  language: pt
  text: Louvarei a Yahweh por toda a minha vida[a]; cantarei louvores ao meu Deus enquanto eu viver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «em minha vida» e «durante a minha existência»; a tradução expressa essas locuções como duração: «por toda a minha vida» / «enquanto eu viver».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Louvarei
  rationale: A forma volitiva de primeira pessoa expressa a decisão firme do salmista; o futuro em português comunica naturalmente esse compromisso sem acrescentar uma ideia explícita de continuidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּחַיָּי
  choice: por toda a minha vida
  rationale: Embora literalmente seja «em minha vida», o sintagma indica a duração completa da vida do salmista; esta formulação idiomática preserva esse valor.
- source_word: אֲזַמְּרָה
  choice: cantarei louvores
  rationale: O verbo זמר denota canto ou música de louvor; a expressão conserva tanto o aspecto musical quanto o caráter de adoração.
- source_word: לֵאלֹהַי
  choice: ao meu Deus
  rationale: A preposição ל com o verbo de cantar é naturalmente expressa em português pela contração «ao».
- source_word: בְּעוֹדִי
  choice: enquanto eu viver
  rationale: A expressão comunica a continuidade da existência do falante. A tradução idiomática preserva o sentido temporal e o paralelismo com o primeiro hemistíquio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O paralelismo poético hebraico é mantido por duas declarações futuras de compromisso, e a nota registra a formulação mais literal das expressões temporais.
