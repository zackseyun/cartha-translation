base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: pt
  text: Yahweh abre os olhos dos cegos[a]; Yahweh levanta os que estão encurvados; Yahweh ama os justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz os cegos enxergarem”. O hebraico diz literalmente que Yahweh “abre os cegos”, isto é, abre os olhos deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פֹּקֵחַ עִוְרִים
  choice: abre os olhos dos cegos
  rationale: Explicita o objeto implícito no hebraico e preserva sua imagem concreta; no contexto, significa fazer os cegos enxergarem.
- source_word: זֹקֵף כְּפוּפִים
  choice: levanta os que estão encurvados
  rationale: Mantém a imagem de endireitar ou erguer pessoas curvadas, sem restringi-la indevidamente a uma condição apenas física ou apenas figurada.
- source_word: אֹהֵב
  choice: ama
  rationale: Equivalente direto, natural e adequado ao valor habitual do particípio.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural substantivado designa pessoas justas; esta formulação é corrente, concisa e teologicamente não restritiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de כְּפוּפִים
  choice: os que estão encurvados
  alternative: os abatidos
  rationale: A escolha conserva a imagem corporal e também permite o sentido mais amplo de aflição ou humilhação, sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Yahweh” foi mantida nas três orações para reproduzir a estrutura enfática do hebraico.
