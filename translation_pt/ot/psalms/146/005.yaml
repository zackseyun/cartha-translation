  text: אַשְׁרֵ֗י שֶׁ֤/אֵ֣ל יַעֲקֹ֣ב בְּ/עֶזְר֑/וֹ שִׂ֝בְר֗/וֹ עַל יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: pt
  text: Feliz aquele cujo auxílio é o Deus de Jacó[a], cuja esperança está em Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tem o Deus de Jacó como seu auxílio”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz aquele
  rationale: A forma de bem-aventurança descreve uma condição digna de admiração, não apenas uma emoção passageira. “Feliz aquele” é natural e corrente em português, preservando o tom sapiencial do salmo.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: cujo auxílio é o Deus de Jacó
  rationale: A formulação mantém Deus como o próprio auxílio da pessoa e preserva o título histórico e pactual “Deus de Jacó”. A nota registra uma reestruturação portuguesa igualmente possível.
- source_word: שִׂבְרוֹ
  choice: cuja esperança
  rationale: O substantivo expressa esperança ou expectativa confiante. “Esperança” é claro, natural e adequado ao paralelismo do verso.
- source_word: עַל
  choice: está em
  rationale: Com “esperança”, a preposição indica aquele em quem ela se apoia; “está em” é a construção idiomática natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva o sufixo masculino singular e a relação pessoal expressa no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual mediante transliteração.
- issue: Referente implícito na bem-aventurança
  choice: aquele
  alternative: o homem
  rationale: O hebraico não apresenta aqui o substantivo אִישׁ. “Aquele” mantém a referência singular sem acrescentar um substantivo ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Feliz aquele” evita o caráter mais arcaizante de “bem-aventurado”, enquanto a estrutura paralela com duas orações iniciadas por “cujo/cuja” conserva a cadência poética.
