id: PSA.146.9
reference: Psalms 146:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: pt
  text: Yahweh protege os estrangeiros residentes[a]; ampara o órfão e a viúva, mas torna torto o caminho dos perversos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiros”, “imigrantes” ou “estrangeiros”; o hebraico se refere a pessoas não nativas que residiam no meio do povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “desvia o caminho dos perversos” ou “leva à ruína o caminho dos perversos”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֹׁמֵר
  choice: protege
  rationale: O particípio descreve o cuidado protetor e contínuo de Yahweh; “protege” expressa isso com clareza e naturalidade em português atual.
- source_word: גֵּרִים
  choice: estrangeiros residentes
  rationale: גֵּרִים designa pessoas não nativas que vivem no meio da comunidade. A expressão evita tanto a ideia de simples visitantes quanto a linguagem burocrática.
- source_word: יָתוֹם
  choice: o órfão
  rationale: É a designação portuguesa corrente para a pessoa privada do amparo parental, usada aqui como singular coletivo e em paralelo com “a viúva”.
- source_word: אַלְמָנָה
  choice: a viúva
  rationale: Mantém o singular coletivo hebraico e o paralelismo poético com “o órfão”.
- source_word: יְעוֹדֵד
  choice: ampara
  rationale: Comunica sustento, apoio e fortalecimento dos vulneráveis em linguagem portuguesa natural.
- source_word: דֶרֶךְ
  choice: caminho
  rationale: Preserva a metáfora hebraica para o curso de vida, a conduta ou o destino de alguém.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Representa a categoria moral coletiva indicada pelo adjetivo hebraico substantivado e soa natural no contexto poético.
- source_word: יְעַוֵּת
  choice: torna torto
  rationale: Preserva diretamente a imagem do piel de עות — entortar ou tornar sinuoso — sem reduzi-la ao resultado interpretativo de levar à ruína.
theological_decisions:
- issue: A descrição do juízo divino na oração final
  choice: mas torna torto o caminho dos perversos
  alternative: mas leva à ruína o caminho dos perversos
  rationale: 'A formulação mantém a metáfora concreta e a tensão do hebraico: Yahweh se opõe ao curso dos perversos tornando-o torto, sem definir de modo exclusivo se isso significa frustrá-lo, desviá-lo ou levá-lo à ruína.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Estrangeiros residentes” explicita sucintamente a condição social dos גֵּרִים; “torna torto” conserva a imagem poética incomum do original.
