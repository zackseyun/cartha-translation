  text: עֹשֶׂ֤ה שָׁ֘מַ֤יִם וָ/אָ֗רֶץ אֶת הַ/יָּ֥ם וְ/אֶת כָּל אֲשֶׁר בָּ֑/ם הַ/שֹּׁמֵ֖ר אֱמֶ֣ת לְ/עוֹלָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/006.yaml
  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: pt
  text: que fez o céu e a terra, o mar e tudo o que neles existe, e que permanece fiel para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que guarda a verdade para sempre”. A palavra hebraica pode significar tanto “verdade” como “fidelidade”; neste contexto, destaca a confiabilidade permanente de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: fez
  rationale: O particípio qal descreve o SENHOR como aquele que criou; em português, o pretérito traduz naturalmente a referência à criação, mantendo a função descritiva no contexto.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: o céu e a terra
  rationale: Expressão abrangente para a ordem criada; esta formulação é tradicional, clara e natural em português moderno.
- source_word: אֶת הַיָּם
  choice: o mar
  rationale: Mantém o substantivo hebraico no singular com artigo e a sequência céu, terra e mar.
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: e tudo o que neles existe
  rationale: Expressa de modo natural o conjunto de tudo quanto há no céu, na terra e no mar; o plural de 'neles' retoma os três domínios.
- source_word: הַשֹּׁמֵר
  choice: e que permanece
  rationale: O particípio continua a descrição de Deus. Com 'fiel', 'permanece' comunica de maneira idiomática a constância expressa por שמר, sem sugerir que Deus apenas guarda uma qualidade externa a si.
- source_word: אֱמֶת
  choice: fiel
  rationale: Neste contexto, אֱמֶת denota sobretudo confiabilidade ou fidelidade duradoura. A construção 'permanece fiel' é clara e natural em português; a alternativa lexical 'verdade' é preservada em nota.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente corrente e digno para a duração ilimitada indicada pela expressão hebraica.
theological_decisions:
- issue: Sentido de אֱמֶת como descrição do caráter de Deus
  choice: permanece fiel
  alternative: guarda a verdade
  rationale: A formulação principal ressalta a confiabilidade constante de Deus, sentido favorecido pela combinação de שמר, אֱמֶת e לְעוֹלָם. Como אֱמֶת também pode significar 'verdade', a possibilidade é explicitada em nota sem resolver indevidamente a amplitude do hebraico.
translation_notes:
  register: Português moderno, amplo e digno, com leitura natural no Brasil. A oração mantém a continuidade sintática com o versículo anterior e preserva o paralelismo descritivo dos particípios hebraicos.
