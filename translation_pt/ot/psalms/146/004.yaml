base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: pt
  text: Seu fôlego se vai[a]; ele volta à sua terra; naquele mesmo dia, seus planos perecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu espírito se vai”. O termo hebraico רוּחַ pode significar “fôlego” ou “espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: se vai
  rationale: O verbo יצא descreve aqui a saída do fôlego vital na morte. “Se vai” é natural em português e conserva a imagem concreta sem explicá-la em excesso.
- source_word: רוּחוֹ
  choice: seu fôlego
  rationale: רוּחַ pode significar “fôlego”, “vento” ou “espírito”. Neste contexto de morte e retorno à terra, “fôlego” expressa bem o sopro vital; a alternativa “espírito” é preservada em nota.
- source_word: יָשֻׁב
  choice: ele volta
  rationale: O verbo שוב significa “voltar”. O sujeito é naturalmente a pessoa, que retorna à terra.
- source_word: לְאַדְמָתוֹ
  choice: à sua terra
  rationale: אֲדָמָה designa terra, solo ou chão. “À sua terra” preserva o sufixo possessivo e a alusão ao retorno humano à terra, sem substituir o termo por “pó”.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: A formulação conserva o demonstrativo e comunica com naturalidade a imediatidade enfatizada no hebraico.
- source_word: אָבְדוּ
  choice: perecem
  rationale: אבד indica perda, ruína ou cessação. “Perecem” mantém a concisão e o peso poético do texto.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: seus planos
  rationale: O substantivo raro pode indicar pensamentos, desígnios ou planos. “Planos” se ajusta ao contexto da incapacidade dos mortais de levar adiante seus propósitos depois da morte.
theological_decisions:
- issue: Nuance antropológica de רוּחוֹ no contexto da morte
  choice: “Seu fôlego” no texto principal
  alternative: “Seu espírito”
  rationale: “Fôlego” acompanha a imagem concreta da cessação da vida sem impor uma afirmação mais específica sobre o estado intermediário. Como רוּחַ também pode significar “espírito”, a alternativa aparece em nota para preservar a ambiguidade lexical e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das orações e o paralelismo do hebraico foram mantidos tanto quanto possível.
