  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: pt
  text: Yahweh reinará para sempre; teu Deus, Sião, de geração em geração. Aleluia![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico: “Louvem a Yah!”, sendo “Yah” a forma abreviada de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: reinará
  rationale: O imperfeito qal de מלך tem aqui valor prospectivo em uma declaração hínica; “reinará” preserva naturalmente a força verbal e a afirmação do reinado contínuo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Neste contexto de louvor, a expressão indica duração ilimitada; “para sempre” é corrente, clara e fiel.
- source_word: אֱלֹהַיִךְ
  choice: o seu Deus
  rationale: O sufixo de segunda pessoa feminina singular se refere a Sião personificada. “Seu” oferece ampla legibilidade em português moderno.
- source_word: צִיּוֹן
  choice: ó Sião
  rationale: O nome funciona como vocativo. A partícula “ó” explicita essa função sem alterar o referente.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Reproduz de modo idiomático a continuidade através de gerações sucessivas.
- source_word: הַלְלוּ יָהּ
  choice: Aleluia!
  rationale: Emprega a forma litúrgica consagrada em português, derivada diretamente da expressão hebraica, enquanto a nota explicita seu sentido lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; sua transliteração preserva a distinção entre nome e título sem impor uma substituição tradicional.
- issue: Tradução da aclamação הַלְלוּ יָהּ
  choice: Aleluia!
  alternative: Louvem a Yah!
  rationale: “Aleluia” é natural e reconhecível no registro dos salmos; a nota conserva a transparência do imperativo hebraico e do nome abreviado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O ponto e vírgula organiza as duas expressões temporais sem enfraquecer o paralelismo. O vocativo “ó Sião” evita que “Sião” pareça estar em aposição a “Deus”.
