base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/007.yaml
  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: pt
  text: A voz de Yahweh talha chamas de fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clarões de fogo”, provavelmente uma referência aos relâmpagos na imagem da tempestade em que Yahweh se manifesta ao longo do salmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: voz
  rationale: Preserva o sentido comum do substantivo e o refrão poético do salmo, no qual o trovão é apresentado como a poderosa voz de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: חֹצֵב
  choice: talha
  rationale: O particípio descreve a ação concreta de cortar ou lavrar; “talha” mantém a imagem vigorosa e incomum do hebraico sem reduzi-la a “produz”.
- source_word: לַהֲבוֹת
  choice: chamas
  rationale: É a correspondência lexical direta do plural; no contexto da tempestade, pode evocar clarões semelhantes a relâmpagos.
- source_word: אֵשׁ
  choice: fogo
  rationale: Mantém a expressão hebraica enfática “chamas de fogo”.
theological_decisions:
- issue: Preservar a ação divina e a imagem da tempestade sem transformar a poesia em descrição meteorológica explícita
  choice: “A voz de Yahweh talha chamas de fogo”
  alternative: “A voz de Yahweh lança clarões de fogo” ou “A voz de Yahweh faz irromper relâmpagos”
  rationale: A formulação principal conserva a metáfora concreta e a ambiguidade poética do hebraico; a provável referência aos relâmpagos é indicada apenas em nota.
translation_notes:
  register: Português moderno, digno e poético, com boa legibilidade brasileira. “Talha” retém a força concreta do verbo hebraico, enquanto a nota esclarece a provável imagem de relâmpagos sem inseri-la interpretativamente no texto principal.
