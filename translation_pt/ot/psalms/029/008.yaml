  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: pt
  text: A voz de Yahweh faz o deserto tremer[a]; Yahweh faz tremer o deserto de Cades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz o deserto contorcer-se” ou “faz o deserto estremecer”.'
    reason: Alternativas lexicais possíveis para יָחִיל, cuja imagem pode envolver tremor ou contorção.
lexical_decisions:
- source_word: ק֣וֹל
  choice: voz
  rationale: No refrão poético do Salmo 29, “voz” preserva o caráter pessoal e ativo da manifestação de Yahweh melhor que o termo mais impessoal “som”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָחִיל
  choice: faz ... tremer
  rationale: O hifil de חול pode expressar fazer contorcer-se, estremecer ou tremer. “Faz ... tremer” é natural em português, mantém a força causativa e se ajusta ao deserto como objeto.
- source_word: מִדְבָּר
  choice: deserto
  rationale: Neste contexto geográfico e poético, “deserto” é uma tradução natural e amplamente compreensível para a região árida e inculta indicada por מִדְבָּר.
- source_word: מִדְבַּר קָדֵשׁ
  choice: o deserto de Cades
  rationale: Preserva a relação construta do hebraico e emprega a forma portuguesa tradicional e reconhecível do topônimo Cades.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A repetição foi mantida, e a segunda oração recebeu ordem verbal natural sem enfraquecer o refrão.
