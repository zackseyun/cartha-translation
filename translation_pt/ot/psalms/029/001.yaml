  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: pt
  text: Salmo de Davi. Atribuam a Yahweh, ó filhos dos deuses[a], atribuam a Yahweh glória e força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos de Deus”, “seres celestiais” ou “filhos dos poderosos”. A expressão hebraica provavelmente se refere a membros da corte celestial.
    reason: Leitura alternativa de uma expressão hebraica semanticamente discutida.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo consagrado e exato para este gênero poético e para a fórmula de título.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A construção portuguesa preserva de modo natural a possível ideia de autoria, associação, pertencimento ou dedicação expressa por לְ.
- source_word: הָבוּ
  choice: Atribuam
  rationale: No contexto, o imperativo pede o reconhecimento da glória e da força de Yahweh, não a entrega material de algo; “atribuam” comunica essa força idiomática.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יְהוָה e preserva sua função como nome próprio da aliança.
- source_word: בְּנֵי אֵלִים
  choice: ó filhos de Deus
  rationale: Mantém a imagem filial da expressão hebraica e expressa a provável referência a seres da corte celestial; a nota registra alternativas sem ocultar a dificuldade lexical.
- source_word: כָּבוֹד
  choice: glória
  rationale: Equivalente tradicional e semanticamente apropriado para a majestade e honra divinas.
- source_word: וָעֹז
  choice: e força
  rationale: עֹז denota força ou poder; “força” é claro, natural e preserva o paralelismo poético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” conserva o nome próprio em vez de substituí-lo por um título.
- issue: Identidade dos בְּנֵי אֵלִים
  choice: filhos de Deus
  alternative: filhos dos deuses; seres celestiais; filhos dos poderosos
  rationale: A expressão provavelmente designa membros da corte celestial, mas sua forma admite mais de uma análise. O texto mantém a imagem hebraica, e a nota preserva as alternativas relevantes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “atribuam a Yahweh” conserva a estrutura enfática e o paralelismo do hebraico; “de Davi” mantém a ambiguidade própria do título.
