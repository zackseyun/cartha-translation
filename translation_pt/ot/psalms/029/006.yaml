  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: pt
  text: Ele faz o Líbano saltar como um bezerro[c] e Siriom[a], como um jovem boi selvagem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siriom é outro nome do monte Hermom.
    reason: cross_reference
  - marker: b
    text: Ou “como um novilho”. O hebraico diz literalmente “como um filho de bois selvagens”, expressão idiomática que indica um jovem boi selvagem.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, conservando mais de perto o pronome hebraico: “Ele os faz saltar como um bezerro — o Líbano e Siriom como um jovem boi selvagem”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Ele faz ... saltar
  rationale: 'O hifil de רקד tem sentido causativo: “fazer saltar/pular”. Em português, “faz ... saltar” comunica com naturalidade o movimento vivo da imagem e explicita os referentes do sufixo pronominal plural por meio dos nomes que vêm em seguida.'
- source_word: כְּמוֹ עֵגֶל
  choice: como um bezerro
  rationale: עֵגֶל designa naturalmente um bezerro ou bovino novo; “bezerro” preserva a imagem de movimento ágil e brincalhão.
- source_word: לְבָנוֹן
  choice: o Líbano
  rationale: Mantém o nome próprio do lugar; o artigo é natural em português quando se fala do Líbano, aqui personificado poeticamente.
- source_word: וְשִׂרְיֹן
  choice: e Siriom
  rationale: Preserva o nome usado no hebraico, em vez de substituí-lo por Hermom. A identificação geográfica é oferecida em nota.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: como um jovem boi selvagem
  rationale: בֶן funciona idiomaticamente como “jovem/filhote”, e רְאֵם é mais provavelmente um bovino selvagem. A formulação evita tanto o literalismo pouco natural “filho de bois selvagens” quanto a tradução tradicional e zoologicamente improvável “unicórnio”.
theological_decisions: []
translation_notes:
