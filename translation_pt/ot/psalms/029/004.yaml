  text: A voz de Yahweh[b] é poderosa[a]; a voz de Yahweh é majestosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “A voz de Yahweh com poder; a voz de Yahweh com majestade”.'
    reason: alternativa lexical e sintática para o valor da preposição hebraica ב
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: identificação e tradução alternativa tradicional do nome divino
lexical_decisions:
- source_word: קוֹל
  choice: voz
  rationale: Preserva o sentido pessoal e ativo da fórmula repetida no salmo; “som” seria possível, mas tornaria a expressão mais impessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּכֹּחַ
  choice: é poderosa
  rationale: O sintagma com ב pode ser entendido de modo descritivo. Esta formulação é natural em português e comunica que a voz se manifesta com poder.
- source_word: הָדָר
  choice: é majestosa
  rationale: הָדָר expressa majestade, esplendor ou imponência; “majestosa” mantém o paralelismo adjetival e o tom régio-teofânico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome próprio e a distinção entre nome e título.
- issue: Valor da preposição ב em בַּכֹּחַ e בֶּהָדָר
  choice: 'Predicação descritiva: “é poderosa” e “é majestosa”'
  alternative: 'Formulação mais formal: “com poder” e “com majestade”'
  rationale: O hebraico admite ambas as construções. A leitura descritiva oferece português mais natural sem eliminar a alternativa estrutural, registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. Os adjetivos “poderosa” e “majestosa” soam naturais e mantêm a correspondência entre os dois membros do verso.
