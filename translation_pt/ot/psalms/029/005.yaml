source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: pt
  text: A voz de Yahweh[a] quebra os cedros; Yahweh despedaça[b] os cedros do Líbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O som de Yahweh”. O hebraico qôl pode significar “voz” ou “som”; escolheu-se “voz” para preservar a descrição recorrente, pessoal e trovejante da manifestação de Yahweh neste salmo.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete a mesma raiz verbal (“quebrar”) nas duas orações; “despedaça” traduz a segunda ocorrência para transmitir a intensificação poética em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: A voz de Yahweh
  rationale: קוֹל pode significar “voz” ou “som”. “Voz” preserva a apresentação pessoal e teofânica da poderosa manifestação de Yahweh, repetida ao longo do salmo.
- source_word: שֹׁבֵר
  choice: quebra
  rationale: O particípio qal tem aqui força verbal, descrevendo uma ação vívida e característica no presente. “Quebra” é direto, natural e vigoroso.
- source_word: אֲרָזִים
  choice: os cedros
  rationale: O plural refere-se aos cedros em geral. A forma simples é natural em português e mantém a concisão poética.
- source_word: וַיְשַׁבֵּר
  choice: despedaça
  rationale: Embora o hebraico repita a raiz שבר, “despedaça” expressa em português a intensificação do segundo membro do paralelismo. A forma verbal é entendida como ação paralela contínua, não necessariamente passada.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: os cedros do Líbano
  rationale: A construção identifica os célebres cedros associados ao Líbano e conserva uma expressão geográfica clara e poeticamente elevada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado pelo nome próprio “Yahweh”, em vez de ser substituído por um título, preservando a referência explícita ao nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal e pactual, sem substituí-lo por um título; “Jeová” é uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo conciso. “Despedaça” mantém a força poética sem obscurecer a repetição hebraica, que é registrada em nota.
