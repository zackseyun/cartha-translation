base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: pt
  text: Javé se assentou entronizado sobre o dilúvio[a]; Javé está entronizado como Rei para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o Dilúvio”, numa alusão específica ao dilúvio de Noé.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Transliteração portuguesa corrente do nome divino YHWH, em vez de substituí-lo por um título.
- source_word: לַמַּבּוּל
  choice: sobre o dilúvio
  rationale: מַבּוּל designa dilúvio ou inundação devastadora e pode aludir especificamente ao dilúvio de Noé. A preposição ל, junto ao verbo de assentar-se em contexto régio, permite expressar domínio sobre as águas.
- source_word: יָשָׁב
  choice: estava entronizado
  rationale: Embora o sentido básico seja sentar-se, o paralelismo com 'Rei' confere ao verbo uma clara nuance régia. O imperfeito 'estava' conserva a referência a uma manifestação passada sem excluir duração.
- source_word: וַיֵּשֶׁב
  choice: está entronizado
  rationale: O segundo verbo apresenta o reinado permanente de Javé; o presente, em combinação com 'para sempre', comunica essa realidade contínua.
- source_word: מֶלֶךְ
  choice: como Rei
  rationale: Expressa naturalmente em português a condição régia predicada de Javé, preservando o termo explícito do hebraico.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português natural e direto para duração indefinida ou perpétua neste contexto.
theological_decisions:
- issue: Se מַבּוּל se refere especificamente ao dilúvio de Noé ou, de modo mais geral, a uma inundação ou às águas caóticas
  choice: dilúvio, sem explicitar Noé no texto principal
  alternative: o Dilúvio, entendido especificamente como o dilúvio de Noé
  rationale: O vocábulo frequentemente evoca o dilúvio primordial, mas o contexto imediato do Salmo 29 descreve uma tempestade. O texto principal preserva a alusão sem identificar seu referente de maneira mais precisa que o hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Entronizado' explicita a imagem régia presente no contexto, e a alternância entre 'estava' e 'está' reproduz o movimento do ato passado para o reinado permanente.
