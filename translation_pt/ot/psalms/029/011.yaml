  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: pt
  text: Yahweh dá força ao seu povo[a]; Yahweh abençoa o seu povo com paz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh dará força ao seu povo; Yahweh abençoará o seu povo com paz”. Os verbos hebraicos também podem ser entendidos com valor futuro.'
    reason: alternative_reading
  - marker: b
    text: “Paz” traduz o hebraico shalom, termo que também pode incluir integridade, plenitude e bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹז
  choice: força
  rationale: Equivalente natural de עֹז neste contexto, preservando o tema do poder divino no salmo.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: A preposição לְ marca naturalmente o destinatário da força concedida; a contração 'ao' é idiomática em português.
- source_word: יִתֵּן
  choice: dá
  rationale: O imperfeito pode expressar ação característica ou declaração confiante; o presente comunica isso de modo natural, sem eliminar a possibilidade de valor futuro, registrada em nota.
- source_word: יְבָרֵךְ
  choice: abençoa
  rationale: Em paralelo com יִתֵּן, é entendido como declaração da ação de Yahweh. O possível valor futuro é preservado em nota.
- source_word: אֶת עַמּוֹ
  choice: o seu povo
  rationale: Reproduz o objeto direto e mantém a repetição enfática do hebraico.
- source_word: בַשָּׁלוֹם
  choice: com paz
  rationale: Expressão natural com 'abençoa'; 'paz' preserva o sentido central de שָׁלוֹם, cujo alcance mais amplo é indicado em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz o nome divino, e a transliteração 'Yahweh' preserva sua função como nome pessoal, sem substituí-lo por um título.
- issue: Valor dos imperfeitos יִתֵּן e יְבָרֵךְ
  choice: 'presente declarativo: ''dá... abençoa'''
  alternative: 'futuro: ''dará... abençoará''; desejo: ''que Yahweh dê... abençoe'''
  rationale: No encerramento poético, o presente expressa de modo natural uma declaração confiante sobre a ação de Yahweh. Como o hebraico também admite leitura futura, ela é apresentada em nota; a leitura volitiva é possível, mas menos provável neste contexto declarativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição poética de 'Yahweh' e 'seu povo'. Os marcadores foram posicionados junto aos termos ou construções que explicam.
