  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: pt
  text: Deem a Yahweh a glória devida ao seu nome; adorem Yahweh no esplendor da santidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em santo esplendor”; alternativamente, “com vestes sagradas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָבוּ
  choice: Deem
  rationale: O imperativo plural, nesta fórmula litúrgica, pede que se reconheça e atribua a Yahweh a glória que lhe pertence; “deem” é natural em português e não sugere uma entrega física.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da atribuição, e o nome divino é transliterado como “Yahweh”.
- source_word: כְּבוֹד שְׁמוֹ
  choice: a glória do seu nome
  rationale: Mantém de perto a relação construta do hebraico sem explicitar como “devida” uma ideia apenas implícita no contexto.
- source_word: הִשְׁתַּחֲווּ
  choice: adorem
  rationale: Embora o verbo descreva literalmente curvar-se ou prostrar-se, no contexto de reverência dirigida a Yahweh “adorem” comunica naturalmente sua função cultual.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  rationale: A formulação conserva o caráter poético e evita decidir de modo estreito entre esplendor santo, beleza da santidade e vestes sagradas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Interpretação de בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  alternative: em santo esplendor; com vestes sagradas
  rationale: A expressão hebraica admite uma leitura abstrata e outra ligada ao adorno ou vestuário cultual. O texto principal mantém a abertura poética, e a nota registra a alternativa concreta.
translation_notes:
  register: Português moderno, digno e litúrgico, com imperativos plurais de ampla compreensão. A colocação da nota após a segunda oração corresponde à expressão hebraica ambígua que ela explica.
