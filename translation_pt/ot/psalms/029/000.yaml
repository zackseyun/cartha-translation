base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: pt
  text: Salmo de Davi. Atribuam a Yahweh, ó seres celestiais[a], atribuam a Yahweh glória e força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de elim”, expressão que também pode ser traduzida como “filhos de Deus”, “filhos dos poderosos” ou “filhos dos deuses”; provavelmente se refere a membros da corte celestial.'
    reason: Preservar a ambiguidade de אֵלִים e informar a forma mais literal e o provável referente da expressão.
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Salmo de Davi
  rationale: Mantém a forma tradicional e natural do título, preservando a possível ideia de autoria, associação ou dedicação expressa pela preposição hebraica.
- source_word: הָבוּ
  choice: Atribuam
  rationale: O imperativo repetido pede que os destinatários reconheçam e proclamem o que pertence a Yahweh; “atribuam” preserva o paralelismo e soa digno em português.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título, de acordo com a evidência do texto hebraico.
- source_word: בְּנֵי אֵלִים
  choice: seres celestiais
  rationale: Expressa o provável referente — integrantes da assembleia celestial — em português claro, enquanto a nota conserva as traduções mais formais e a ambiguidade lexical.
- source_word: כָּבוֹד וָעֹז
  choice: glória e força
  rationale: Equivalentes diretos e naturais que preservam os dois substantivos coordenados e sua força poética.
theological_decisions:
- issue: Identidade dos בְּנֵי אֵלִים
  choice: seres celestiais
  alternative: filhos de Deus; filhos dos poderosos; filhos dos deuses
  rationale: A expressão provavelmente se dirige a membros da corte celestial, mas sua forma e seu alcance exatos são discutidos. O texto principal comunica o referente provável sem definir a ontologia desses seres, e a nota preserva as alternativas.
translation_notes:
  register: Português moderno, claro e solene, com repetição deliberada de “atribuam a Yahweh” para reproduzir o paralelismo hebraico. O vocativo “ó” sinaliza naturalmente que os seres celestiais são os destinatários da ordem.
