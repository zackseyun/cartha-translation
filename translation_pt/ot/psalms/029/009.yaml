  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: pt
  text: 'A voz de Yahweh faz as corças darem à luz[a] e deixa nuas as florestas; e, em seu templo[b], todos dizem: “Glória!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz as corças contorcerem-se”, ou “faz as corças contorcerem-se em trabalho de parto”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico הֵיכָל pode significar “templo” ou “palácio”.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: A voz de Yahweh
  rationale: Traduz a construção hebraica de modo direto e mantém o nome divino como nome próprio, em vez de substituí-lo silenciosamente por um título.
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  choice: faz com que as corças deem à luz
  rationale: O verbo חול pode indicar contorcer-se, especialmente nas dores do parto; com o substantivo feminino plural אַיָּלוֹת, a referência ao parto das corças é natural, sem apagar a alternativa lexical registrada em nota.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: e desnuda as florestas
  rationale: חשׂף significa despir, descobrir ou deixar exposto. “Desnuda” preserva a imagem forte e concisa da tempestade que deixa as florestas sem cobertura.
- source_word: וּבְהֵיכָלוֹ
  choice: e, em seu templo
  rationale: הֵיכָל pode designar templo ou palácio. O contexto de aclamação cultual favorece “templo”, mantendo-se “palácio” em nota.
- source_word: כֻּלּוֹ אֹמֵר
  choice: todos dizem
  rationale: 'Embora אֹמֵר esteja formalmente no singular, a expressão tem valor coletivo ou distributivo: todos os que estão ali dizem a aclamação.'
- source_word: כָּבֽוֹד
  choice: Glória!
  rationale: A exclamação de uma só palavra reproduz a aclamação enfática e preserva o sentido religioso usual de כבוד.
theological_decisions:
- issue: Sentido de הֵיכָל como lugar de Yahweh
  choice: templo
  alternative: palácio
  rationale: A aclamação “Glória!” favorece uma cena de culto no templo, mas o termo também pode evocar o palácio do Rei divino. A alternativa é preservada para não eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Corças” explicita o gênero feminino do substantivo hebraico; “desnuda” conserva a força poética da imagem sem recorrer a linguagem arcaica.
