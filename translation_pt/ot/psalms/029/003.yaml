id: PSA.29.3
reference: Psalms 29:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: pt
  text: 'A voz de Yahweh está sobre as águas;

    o Deus da glória troveja;

    Yahweh está sobre as muitas águas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: voz
  rationale: Preserva a imagem poética recorrente no salmo, em que o trovão é apresentado como a poderosa voz pessoal de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַל
  choice: sobre
  rationale: Expressa naturalmente a posição ou manifestação de Yahweh sobre as águas no cenário da tempestade.
- source_word: הַמָּיִם
  choice: as águas
  rationale: Mantém o plural poético hebraico e sua imagem ampla.
- source_word: אֵל הַכָּבוֹד
  choice: o Deus da glória
  rationale: Reproduz diretamente a construção hebraica e mantém sua densidade teológica, sem convertê-la no adjetival 'Deus glorioso'.
- source_word: הִרְעִים
  choice: troveja
  rationale: Traduz precisamente o verbo רעם e emprega o presente vívido, apropriado à descrição poética.
- source_word: מַיִם רַבִּים
  choice: as muitas águas
  rationale: Preserva de modo transparente o hebraico, referindo-se a águas vastas ou abundantes; o artigo torna a expressão natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio.
- issue: O trovão retratado poeticamente como voz de Deus
  choice: Manter 'voz' e 'troveja' como imagens coordenadas
  alternative: 'Explicitar: ''o trovão de Yahweh'''
  rationale: O salmo identifica poeticamente o trovão com a voz de Yahweh; preservar os dois termos mantém a força da teofania sem reduzi-la a uma descrição meteorológica.
- issue: Estrutura da última oração nominal
  choice: Suprir 'está' em 'Yahweh está sobre as muitas águas'
  alternative: 'Manter a frase nominal: ''Yahweh sobre as muitas águas'''
  rationale: O verbo de ligação é implícito em hebraico; supri-lo torna a terceira oração clara e natural em português, em consonância com a divisão marcada pela acentuação massorética.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético em três orações. Mantém 'Yahweh' como nome próprio, 'águas' no plural e a formulação formal 'Deus da glória'. Nenhuma nota é necessária, pois as alternativas legítimas não afetam de modo decisivo a compreensão do verso.
