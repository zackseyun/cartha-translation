base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: pt
  text: Quebra o braço do perverso e do malfeitor[a]; procura a sua maldade até que não encontres nenhuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quebra o braço do perverso, do homem mau; investiga a sua maldade até que não encontres nenhuma.” O hebraico permite entender a segunda expressão como outra designação do malfeitor ou como uma caracterização da mesma pessoa; o verbo também pode ser traduzido por “investiga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: Quebra
  rationale: Imperativo masculino singular dirigido a Deus. “Quebra” transmite diretamente a força da súplica sem ampliar a metáfora.
- source_word: זְרוֹעַ
  choice: o braço
  rationale: Preserva a imagem concreta hebraica do braço como símbolo da força e da capacidade de oprimir.
- source_word: רָשָׁע
  choice: do perverso
  rationale: Adjetivo substantivado singular que designa a pessoa culpada ou perversa; a forma portuguesa mantém o caráter representativo do singular.
- source_word: וָרָע
  choice: e do malfeitor
  rationale: Entendido como um segundo qualificativo substantivado, paralelo a רָשָׁע. “Malfeitor” é natural e destaca quem pratica o mal.
- source_word: תִּדְרוֹשׁ
  choice: procura
  rationale: O verbo דרש significa buscar, investigar ou exigir contas. “Procura” conserva a imagem verbal do exame divino sem apagar sua dimensão judicial no contexto.
- source_word: רִשְׁעוֹ
  choice: a sua maldade
  rationale: Mantém a relação lexical com רָשָׁע e pode abranger tanto a conduta perversa quanto a culpa resultante.
- source_word: בַל תִּמְצָא
  choice: até que não encontres mais nenhuma
  rationale: 'Expressa o resultado desejado da busca e do juízo divinos: a maldade será tratada por completo, de modo que nenhuma reste para ser encontrada.'
theological_decisions:
- issue: A metáfora do braço do perverso
  choice: Manter “braço” no texto principal
  alternative: Traduzir de modo abstrato como “força” ou “poder”
  rationale: A imagem poética pede que Deus incapacite o opressor. Preservá-la evita substituir a linguagem do salmo por uma interpretação explicativa.
- issue: A relação entre רָשָׁע e וָרָע
  choice: 'Entender ambos como designações substantivadas: “do perverso e do malfeitor”'
  alternative: 'Entender וָרָע como uma caracterização adicional da mesma pessoa: “do perverso, do homem mau”'
  rationale: A sintaxe hebraica admite mais de uma construção. O texto principal conserva o paralelismo, e a nota registra a leitura alternativa sem decidir uma questão teológica por via da tradução.
- issue: O sentido da oração final בַל תִּמְצָא
  choice: “até que não encontres mais nenhuma”
  alternative: “para que não encontres nenhuma” ou “e não a encontrarás”
  rationale: A formulação escolhida apresenta a plena remoção da maldade como o resultado pedido da investigação e do juízo de Deus, sem definir além do texto como esse resultado ocorrerá.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva a metáfora hebraica e a segunda pessoa singular no discurso dirigido a Deus. A colocação “não encontres mais nenhuma” é idiomática e retoma “maldade” sem repetição pesada.
