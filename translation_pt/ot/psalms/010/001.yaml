  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: pt
  text: Por que, Yahweh, te manténs distante? Por que te escondes em tempos de angústia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que permaneces oculto em tempos de aflição?”'
    reason: Registra alternativas legítimas para תַּעְלִים e בַּצָּרָה.
lexical_decisions:
- source_word: לָמָה
  choice: Por que
  rationale: Mantém a pergunta direta e a força emocional do lamento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תַּעֲמֹד בְּרָחוֹק
  choice: te manténs distante
  rationale: Expressa em português natural a imagem espacial de permanecer ou estar a distância, sem reduzi-la apenas à ideia de inação.
- source_word: תַּעְלִים
  choice: te escondes
  rationale: Comunica de modo direto a ocultação de si atribuída a Yahweh no lamento.
- source_word: לְעִתּוֹת
  choice: em tempos de
  rationale: Reproduz naturalmente a expressão temporal plural do hebraico.
- source_word: בַּצָּרָה
  choice: angústia
  rationale: Abrange aflição, adversidade e aperto, preservando o tom intenso do lamento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome pessoal divino; a transliteração preserva essa característica.
- issue: Repetição da pergunta no segundo membro poético
  choice: Repetir explicitamente “Por que”
  alternative: 'Tratar o segundo membro como afirmação: “tu te escondes em tempos de angústia”'
  rationale: Embora לָמָה não se repita no hebraico, o paralelismo mantém seu alcance interrogativo sobre o segundo membro; a repetição torna isso claro em português sem eliminar a tensão do lamento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Te manténs distante” conserva a metáfora espacial de עמד sem produzir uma formulação rígida como “ficas de pé ao longe”. A colocação pronominal é natural no registro escolhido.
