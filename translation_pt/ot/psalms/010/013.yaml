  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: pt
  text: 'Por que o perverso despreza a Deus? Ele diz em seu coração: “Tu não pedirás contas”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשָׁע
  choice: o perverso
  rationale: Representa o substantivo/adjetivo singular que designa uma pessoa moralmente culpada, com linguagem natural e digna em português.
- source_word: נִאֵץ
  choice: despreza
  rationale: Expressa o sentido de tratar Deus com desdém ou irreverência; o presente português corresponde bem ao valor discursivo do perfeito hebraico no contexto.
- source_word: תִּדְרֹשׁ
  choice: pedirás contas
  rationale: No contexto, דרשׁ não significa apenas buscar, mas investigar e exigir responsabilização. A expressão preserva essa dimensão judicial sem acrescentar uma punição explicitamente não declarada.
theological_decisions:
- issue: Pessoa e sentido da declaração final
  choice: “Tu não pedirás contas”
  alternative: “Ele não pedirá contas” / “Não investigarás”
  rationale: A forma verbal é segunda pessoa masculina singular, dirigindo implicitamente a fala a Deus. “Pedir contas” comunica a expectativa ímpia de que Deus não investigará nem responsabilizará, mantendo a tensão do texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Mantém a pergunta retórica, o singular pessoal de רָשָׁע e o discurso interior dirigido a Deus.
