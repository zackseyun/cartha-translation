id: PSA.10.5
reference: Psalms 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: pt
  text: Seus caminhos prosperam em todo tempo[a]; teus juízos estão nas alturas, fora de sua vista. Quanto a todos os seus adversários, ele bufa contra eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus caminhos são firmes em todo tempo”. O verbo hebraico é difícil e também tem sido relacionado à ideia de contorcer-se ou sofrer dores; neste contexto, porém, o sentido de sucesso ou segurança contínua parece mais provável.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica retrata literalmente um sopro ou bufo dirigido contra os adversários, como gesto de desprezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: prosperam
  rationale: O verbo é difícil neste contexto. “Prosperam” expressa o aparente êxito contínuo do ímpio, coerente com a queixa do salmo, sem ocultar em nota as alternativas lexicais.
- source_word: דרכ/ו
  choice: seus caminhos
  rationale: Preserva a imagem hebraica dos caminhos como modo de viver e agir, em formulação natural em português.
- source_word: בְּכָל עֵת
  choice: em todo tempo
  rationale: Comunica continuidade e conserva a forma poética da expressão hebraica.
- source_word: מָרוֹם מִשְׁפָּטֶיךָ
  choice: teus juízos estão nas alturas
  rationale: Mantém a metáfora espacial da elevação ou distância dos atos judiciais de Deus, sem reduzi-los apenas a leis ou princípios abstratos.
- source_word: מִנֶּגְדּוֹ
  choice: fora de sua vista
  rationale: No contexto daquilo que está nas alturas, indica que os juízos divinos não estão diante da percepção ou consideração do ímpio.
- source_word: כָּל צֹרְרָיו
  choice: todos os seus adversários
  rationale: “Adversários” abrange aqueles que se opõem ao ímpio e preserva o registro poético.
- source_word: יָפִיחַ בָּהֶם
  choice: ele bufa contra eles
  rationale: “Bufa” conserva a imagem concreta de uma expiração desdenhosa, em vez de substituí-la diretamente pela interpretação “zomba”.
theological_decisions:
- issue: Sentido de יָחִילוּ e a condição aparente do ímpio
  choice: Os caminhos do ímpio prosperam continuamente.
  alternative: Seus caminhos são firmes ou seguros em todo tempo; menos provavelmente, o verbo poderia conservar um sentido ligado a contorcer-se ou sofrer dores.
  rationale: 'O contexto lamenta o aparente sucesso e a arrogância do ímpio: ele considera remotos os juízos de Deus e trata os adversários com desprezo. A tradução principal segue essa lógica, enquanto a nota preserva a dificuldade lexical.'
- issue: Relação dos juízos de Deus com o ímpio
  choice: Os juízos estão elevados e fora de sua vista.
  alternative: Os juízos poderiam ser entendidos de modo mais interpretativo como distantes de sua consideração ou compreensão.
  rationale: A redação mantém a metáfora espacial e permite tanto a ideia de distância percebida quanto a de desprezo moral, sem decidir além do que o verso explicita.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e alcance internacional. Mantiveram-se o paralelismo poético, a segunda pessoa dirigida a Deus e as imagens espaciais e corporais do hebraico.
