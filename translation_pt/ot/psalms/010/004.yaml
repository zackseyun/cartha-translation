  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: pt
  text: 'Em sua arrogância[a], o perverso não busca; todos os seus pensamentos são: “Não há Deus.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na altura do seu nariz/rosto”, expressão que comunica orgulho altivo ou porte arrogante.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Deus não está em nenhum dos seus pensamentos.” O hebraico também pode descrever a ausência de Deus em tudo o que ele pensa, em vez de citar diretamente seu pensamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo masculino singular é usado como substantivo e retrata um indivíduo representativo. “O perverso” é natural em português e preserva sua caracterização moral.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: Na arrogância do seu rosto
  rationale: גֹבַהּ expressa elevação, e אַף significa literalmente nariz, podendo designar o rosto ou a ira. No contexto, a expressão descreve altivez visível; a tradução mantém a imagem concreta do rosto sem reduzi-la a ira.
- source_word: בַּל יִדְרֹשׁ
  choice: não busca
  rationale: A partícula poética בַּל nega o imperfeito e aqui descreve uma atitude habitual. Como o hebraico não declara o objeto de “buscar”, a tradução também o deixa implícito.
- source_word: אֵין אֱלֹהִים
  choice: Não há Deus
  rationale: A construção é uma negação existencial direta. Esta formulação conserva tanto a concisão quanto a força do hebraico.
- source_word: כָּל מְזִמּוֹתָיו
  choice: todos os seus pensamentos
  rationale: מְזִמּוֹתָיו pode indicar pensamentos, planos ou desígnios. “Pensamentos” se ajusta melhor à leitura da frase seguinte como conteúdo de sua mente, sem acentuar indevidamente a ideia de conspiração.
theological_decisions:
- issue: Relação sintática da oração final
  choice: A declaração “Não há Deus” é apresentada como o conteúdo de todos os pensamentos do perverso.
  alternative: “Deus não está em nenhum dos seus pensamentos.”
  rationale: A sequência hebraica permite entender אֵין אֱלֹהִים como o conteúdo de seus pensamentos ou como uma afirmação de que Deus está ausente deles. A tradução principal acompanha mais de perto a ordem das palavras e mantém a contundência da negação, enquanto a nota preserva a alternativa plausível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário acessível. A construção deliberadamente concisa “não busca” conserva a ausência de objeto explícito no hebraico. Os marcadores foram associados ao trecho que cada nota explica.
