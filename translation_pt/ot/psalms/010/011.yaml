  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: pt
  text: 'Diz em seu coração[a]: “Deus se esqueceu; escondeu o rosto; nunca verá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Disse em seu coração: ‘Deus se esquece; esconde o rosto; jamais verá’”. Na poesia hebraica, as formas verbais perfeitas podem, neste contexto, ser entendidas com valor presente ou passado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Diz
  rationale: O perfeito qal na poesia hebraica pode ter força presente ou gnômica. O presente se ajusta à descrição vívida e contínua do pensamento do ímpio.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Preserva a expressão hebraica para o pensamento interior e soa natural no registro bíblico em português.
- source_word: שָׁכַח
  choice: se esqueceu
  rationale: Mantém o sentido básico de 'esquecer' e apresenta como consumado o pressuposto atribuído a Deus pelo ímpio.
- source_word: אֵל
  choice: Deus
  rationale: O substantivo singular refere-se a Deus no discurso do salmo; a tradução simples é natural e suficiente.
- source_word: הִסְתִּיר פָּנָיו
  choice: escondeu o rosto
  rationale: Conserva a imagem antropomórfica hebraica de retirar a atenção, sem substituir a figura por uma interpretação.
- source_word: בַּל רָאָה לָנֶצַח
  choice: nunca verá
  rationale: A negação בַּל combinada com לָנֶצַח exprime negação duradoura; 'nunca verá' é conciso e preserva o verbo 'ver'.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus esconder o rosto
  choice: escondeu o rosto
  alternative: desviou o olhar / retirou sua atenção
  rationale: A imagem concreta do hebraico é compreensível em português e preserva a textura teológica sem reduzir seu sentido a uma única explicação.
translation_notes:
  register: Português moderno, digno e claro, com imagens bíblicas preservadas. O sujeito implícito de “Diz” retoma o ímpio do contexto. A pontuação explicita que as palavras seguintes representam seu pensamento interior.
