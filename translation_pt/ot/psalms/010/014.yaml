  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: pt
  text: Tu viste, pois observas o sofrimento e a aflição, para tomar o caso em tuas mãos.[a] A ti se entrega o desamparado;[b] tu tens sido quem ajuda o órfão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “para dar em tua mão”. A expressão também pode ser entendida como Deus assumindo a questão para agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O desamparado deixa sua causa contigo”. O hebraico pode indicar tanto a entrega da própria pessoa quanto a de sua causa a Deus.'
    reason: alternative_reading
  - marker: c
    text: O termo hebraico designa especificamente quem não tem pai; “órfão” é a tradução portuguesa corrente.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Tu o viste
  rationale: O qal perfeito, na segunda pessoa masculina singular, dirige-se a Deus. O pretérito perfeito preserva a afirmação enfática de que Deus de fato viu; o pronome “o” retoma de modo natural a realidade descrita no contexto.
- source_word: עָמָל וָכַעַס
  choice: o sofrimento e a aflição
  rationale: O par designa a desgraça opressora e a dor ou vexação que Deus observa. A formulação evita reduzir עָמָל a mero trabalho e evita entender כַעַס apenas como ira divina.
- source_word: תַּבִּיט
  choice: observas
  rationale: O hifil de נבט indica olhar atentamente ou considerar. “Observas” mantém a imagem visual e sugere atenção, sem ainda explicitar a intervenção.
- source_word: לָתֵת בְּיָדֶךָ
  choice: para tomar o caso em tuas mãos
  rationale: A expressão é literalmente “para dar/pôr em tua mão”. No contexto, comunica que Deus assume a questão para agir. “O caso” torna explícito apenas o referente implícito e produz português corrente.
- source_word: עָלֶיךָ יַעֲזֹב חֵלֶכָה
  choice: A ti se entrega o desamparado
  rationale: A construção apresenta a pessoa vulnerável confiando-se a Deus. “Desamparado” comunica fraqueza e infortúnio sem restringir a referência à pobreza econômica.
- source_word: יָתוֹם
  choice: órfão
  rationale: O termo se refere especialmente a quem perdeu o pai e, no mundo bíblico, ficou socialmente vulnerável. “Órfão” é a designação portuguesa atual e natural.
- source_word: עוֹזֵר
  choice: auxiliador
  rationale: O particípio caracteriza Deus pessoalmente como aquele que presta ajuda. “Auxiliador” conserva a forma nominal e o tom confessional do verso.
theological_decisions:
- issue: Se a visão divina é mera observação ou conduz à intervenção
  choice: Deus observa o sofrimento e toma o caso em suas mãos para agir
  alternative: Deus observa o sofrimento e a aflição para pô-los em sua mão
  rationale: O infinitivo לָתֵת com בְּיָדֶךָ aponta para a questão sendo posta sob a ação de Deus. A tradução comunica intervenção sem definir indevidamente sua forma ou momento.
- issue: O que o desamparado confia a Deus
  choice: O desamparado entrega a si mesmo a Deus
  alternative: O desamparado deixa sua causa com Deus
  rationale: A sintaxe permite que a confiança recaia sobre a própria pessoa ou, implicitamente, sobre sua causa. O texto principal mantém o sentido pessoal, enquanto a nota conserva a outra leitura legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento de Deus por “tu” preserva o discurso direto singular do hebraico. A ordem inicial mantém a ênfase de רָאִתָה, e as notas registram ambiguidades reais sem sobrecarregar o texto principal.
