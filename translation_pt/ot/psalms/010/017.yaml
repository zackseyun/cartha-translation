  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: pt
  text: Ó Yahweh, tu ouviste o anseio dos humildes[a]; firmarás o coração deles[b]; teu ouvido estará atento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos aflitos” ou “dos mansos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “prepararás” ou “estabelecerás” o coração deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: anseio
  rationale: Expressa desejo ou aspiração profunda e se encaixa naturalmente no contexto de oração, sem exagerar a intensidade.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: Preserva o sentido de humildade ou mansidão do termo, enquanto o contexto do salmo mantém em vista os oprimidos.
- source_word: שָׁמַעְתָּ
  choice: tu ouviste
  rationale: O perfeito hebraico indica uma ação já realizada; o pretérito perfeito é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: תָּכִין
  choice: firmarás
  rationale: O hifil de כון pode significar preparar, estabelecer ou tornar firme; com 'coração', 'firmarás' preserva a ideia de dar estabilidade sem restringir o verbo apenas a fortalecimento.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém a imagem antropológica bíblica concreta e evita interpretar antecipadamente como mente ou interior.
- source_word: תַּקְשִׁיב אָזְנֶךָ
  choice: teu ouvido estará atento
  rationale: Reproduz a imagem concreta do ouvido e comunica o sentido atento do hifil de קשׁב de modo idiomático em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de עֲנָוִים no contexto
  choice: os humildes
  alternative: os aflitos / os mansos
  rationale: A escolha conserva a noção lexical de humildade, enquanto uma nota mantém explícita a possibilidade contextual de aflição e opressão.
- issue: Sentido de תָּכִין com 'coração'
  choice: firmarás
  alternative: prepararás / estabelecerás
  rationale: O verbo admite mais de uma nuance. 'Firmarás' é natural com 'coração' e preserva a ideia de torná-lo estável; a nota registra as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção poética concisa. O pronome 'tu' acompanha a invocação direta e evita alternância de pessoa; 'teu ouvido estará atento' preserva o antropomorfismo hebraico com naturalidade.
