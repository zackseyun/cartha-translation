source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: pt
  text: Levanta-te, Yahweh! Ó Deus, ergue a tua mão; não te esqueças dos aflitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos pobres”, “dos humildes” ou “dos oprimidos”. O termo hebraico pode referir-se, de modo amplo, aos que foram abatidos e estão vulneráveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: Imperativo enfático de קום dirigido a Deus. “Levanta-te” transmite o apelo urgente e mantém a imagem do hebraico em português natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵל
  choice: Ó Deus
  rationale: Vocativo em paralelo com יְהוָה. A partícula “Ó” deixa clara a invocação e preserva o paralelismo poético.
- source_word: נְשָׂא
  choice: ergue
  rationale: Imperativo de נשׂא com “mão” como objeto. “Ergue” é idiomático em português e conserva a imagem de Deus prestes a agir.
- source_word: יָדֶךָ
  choice: a tua mão
  rationale: Mantém a imagem antropomórfica concreta do texto, sem explicá-la como julgamento ou libertação.
- source_word: אַל תִּשְׁכַּח
  choice: não te esqueças
  rationale: Reproduz a proibição ou súplica negativa do hebraico. “Não ignores” seria uma explicitação interpretativa.
- source_word: עניים
  choice: os aflitos
  rationale: O termo plural pode designar pobres, humildes, oprimidos ou pessoas abatidas e vulneráveis. No contexto do salmo, “aflitos” preserva uma extensão semântica ampla sem limitar o sentido à pobreza econômica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma forma tradicional híbrida.
- issue: Sentido de עניים
  choice: os aflitos
  alternative: os pobres; os humildes; os oprimidos
  rationale: O contexto apresenta pessoas vulneráveis que sofrem sob a ação dos perversos, mas o substantivo hebraico mantém uma amplitude que não deve ser reduzida apenas à condição econômica ou a uma virtude espiritual.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa do singular coerentes com a oração direta. O paralelismo e as imagens concretas do hebraico foram preservados; a pontuação comunica a urgência do apelo.
