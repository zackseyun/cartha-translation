source:
  edition: WLC
  text: כִּֽי הִלֵּ֣ל רָ֭שָׁע עַל תַּאֲוַ֣ת נַפְשׁ֑/וֹ וּ/בֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/003.yaml
  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: pt
  text: Pois o perverso se gloria no desejo de sua alma, e o ganancioso bendiz a si mesmo[a] e despreza o SENHOR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é conciso e também pode ser entendido como «o ganancioso bendiz e despreza o SENHOR» ou «quem bendiz o ganancioso despreza o SENHOR». O pronome reflexivo não aparece explicitamente no hebraico.
    reason: Preserva a ambiguidade sintática quanto ao sujeito e ao complemento de «bendizer», sem ocultar que «a si mesmo» é uma interpretação contextual.
lexical_decisions:
- source_word: רָשָׁע (rāšāʿ)
  choice: o perverso
  rationale: Designa a pessoa culpada ou moralmente má; «perverso» é natural, digno e mantém a força ética do hebraico.
- source_word: תַּאֲוַת נַפְשׁוֹ (taʾăwat napšô)
  choice: o desejo do seu coração
  rationale: Literalmente, «o desejo de sua alma/vida». Neste contexto, נֶפֶשׁ aponta para o íntimo e seus apetites; «coração» comunica isso naturalmente em português sem tornar o desejo necessariamente abstrato ou espiritual.
- source_word: בֹצֵעַ (bōṣēaʿ)
  choice: o ganancioso
  rationale: O particípio pode indicar quem obtém lucro injusto ou é ávido por ganho; «ganancioso» expressa o sentido moral sem especificar um método não declarado no verso.
- source_word: בֵּרֵךְ (bērēḵ)
  choice: bendiz a si mesmo
  rationale: 'O verbo significa «abençoar/bendizer». O reflexivo não está expresso gramaticalmente, mas é uma leitura contextual plausível: o ganancioso felicita ou aprova a si próprio. A nota registra a ambiguidade sintática.'
- source_word: נִאֵץ (niʾēṣ)
  choice: despreza
  rationale: Expressa tratar com desdém, rejeitar ou ultrajar; «despreza» é claro e adequado à relação com o SENHOR.
- source_word: יְהוָה (YHWH)
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por «SENHOR» em versaletes/maiúsculas.
theological_decisions:
- issue: Sujeito e complemento de בֵּרֵךְ («bendiz»)
  choice: Entender o ganancioso como sujeito que bendiz a si mesmo
  alternative: «e quem bendiz o ganancioso despreza o SENHOR» ou, mantendo o sujeito, «o ganancioso bendiz e despreza o SENHOR»
  rationale: A sequência hebraica é compacta e permite mais de uma análise. A leitura reflexiva oferece sentido coerente no paralelismo — o perverso se gloria e o ganancioso se aprova —, mas a nota preserva as alternativas sem converter uma questão sintática em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. O paralelismo foi mantido, e a ambiguidade da segunda oração foi sinalizada sem sobrecarregar o texto principal.
