  text: יֵשֵׁ֤ב בְּ/מַאְרַ֬ב חֲצֵרִ֗ים בַּֽ֭/מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י עֵ֝ינָ֗י/ו לְֽ/חֵלְכָ֥ה יִצְפֹּֽנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: pt
  text: Ele fica de emboscada nos povoados[a]; nos esconderijos, assassina o inocente; seus olhos espreitam o indefeso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Povoados” também pode ser traduzido por “aldeias” ou “assentamentos”; outra possibilidade, menos provável aqui, é “pátios” ou “recintos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “seus olhos ficam à espreita do indefeso”. A última oração é difícil: o verbo hebraico está mais literalmente relacionado a esconder-se ou ficar oculto, mas, tendo “seus olhos” como sujeito, indica vigilância furtiva sobre uma vítima vulnerável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: fica
  rationale: O verbo significa literalmente “sentar-se” ou “permanecer”. Com “de emboscada”, “fica” comunica em português natural uma postura predatória contínua sem tornar a imagem artificial.
- source_word: בְּמַאְרַב
  choice: de emboscada
  rationale: A expressão portuguesa transmite de modo idiomático a ideia de permanecer oculto à espera de uma vítima.
- source_word: חֲצֵרִים
  choice: nos povoados
  rationale: Neste contexto, o plural provavelmente designa pequenos núcleos habitados. A preposição hebraica é preservada por “nos”, sem acrescentar a ideia interpretativa de proximidade.
- source_word: בַּמִּסְתָּרִים
  choice: nos esconderijos
  rationale: Mantém a imagem concreta e plural de lugares ocultos, em paralelo com a emboscada.
- source_word: יַהֲרֹג
  choice: assassina
  rationale: Embora o verbo básico seja “matar”, o contexto de emboscada contra um inocente justifica “assassina”, que expressa homicídio intencional e injusto.
- source_word: נָקִי
  choice: o inocente
  rationale: Expressa naturalmente, no contexto de violência, a pessoa sem culpa que é atacada.
- source_word: עֵינָיו
  choice: seus olhos
  rationale: Preserva o foco vívido do hebraico nos olhos do agressor.
- source_word: לְחֵלְכָה
  choice: o indefeso
  rationale: O termo é raro e difícil, mas no salmo aponta para uma vítima vulnerável. “Indefeso” se ajusta ao contexto sem especificar pobreza material.
- source_word: יִצְפֹּנוּ
  choice: espreitam
  rationale: A forma está ligada à ideia de esconder-se ou ficar à espreita. Com “seus olhos” como sujeito, “espreitam” preserva tanto a vigilância furtiva quanto a intenção predatória.
