  text: יֶאֱרֹ֬ב בַּ/מִּסְתָּ֨ר כְּ/אַרְיֵ֬ה בְ/סֻכֹּ֗/ה יֶ֭אֱרֹב לַ/חֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּ/מָשְׁכ֥/וֹ בְ/רִשְׁתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: pt
  text: Ele fica à espreita num esconderijo[a], como um leão em seu covil[b]; fica à espreita para capturar o pobre; captura o pobre quando o arrasta para dentro de sua rede.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às escondidas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em seu abrigo”; o termo hebraico pode designar uma cabana, um esconderijo ou uma moita cerrada.
    reason: lexical_alternative
  - marker: c
    text: Ou “ao puxá-lo em sua rede” ou “com sua rede”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: fica à espreita
  rationale: O verbo ארב descreve a ação deliberada de esperar escondido para atacar. A expressão portuguesa é natural, preserva a imagem de emboscada e permite manter a repetição poética.
- source_word: בַּמִּסְתָּר
  choice: num esconderijo
  rationale: מִסְתָּר pode indicar um lugar oculto ou a condição de estar em segredo. “Num esconderijo” torna concreta a cena de emboscada sem excluir a ideia de ocultação.
- source_word: כְּאַרְיֵה
  choice: como um leão
  rationale: Tradução direta da comparação, preservando a imagem de um predador perigoso.
- source_word: בְסֻכֹּה
  choice: em seu covil
  rationale: סֻכָּה pode designar abrigo, esconderijo ou moita protetora. No contexto da comparação com um leão, “covil” comunica com naturalidade o abrigo oculto do predador.
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: para capturar / captura
  rationale: חטף indica uma tomada súbita e violenta. “Capturar” é claro e vigoroso; a repetição do mesmo radical em português conserva a ênfase do hebraico.
- source_word: עָנִי
  choice: o pobre
  rationale: עָנִי pode significar pobre, aflito ou vulnerável. No contexto de opressão social do salmo, “o pobre” é direto e mantém a vulnerabilidade implícita.
- source_word: בְּמָשְׁכוֹ
  choice: quando o arrasta
  rationale: O infinitivo com ב pode indicar meio ou circunstância concomitante. “Quando o arrasta” produz sintaxe portuguesa clara e conserva a ação violenta.
- source_word: בְּרִשְׁתּוֹ
  choice: para dentro de sua rede
  rationale: רֶשֶׁת significa “rede”. Embora a preposição possa ser entendida como “em” ou “com”, a formulação escolhida explicita de modo idiomático o movimento de aprisionar sugerido pelo contexto, enquanto a nota preserva as alternativas.
