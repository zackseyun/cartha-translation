base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: pt
  text: 'Diz em seu coração: “Não serei abalado; de geração em geração, não enfrentarei desgraça.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração final é elíptica no hebraico. Também pode ser entendida como “de geração em geração, alguém que não está na adversidade” ou “jamais sofrerei desgraça”.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Diz
  rationale: O perfeito hebraico na poesia pode apresentar vividamente uma atitude habitual ou atual; o presente é natural no contexto.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Preserva a metáfora hebraica para pensamento íntimo ou fala consigo mesmo e permanece clara em português.
- source_word: בַּל אֶמּוֹט
  choice: Não serei abalado
  rationale: O verbo מוט no nifal expressa ser abalado, movido ou tornar-se instável; “ser abalado” conserva a imagem e soa natural.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Expressão portuguesa corrente que comunica continuidade por gerações sucessivas.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: não enfrentarei desgraça
  rationale: A frase hebraica é elíptica. Esta formulação explicita, com moderação, a continuação da fala na primeira pessoa e traduz רָע aqui como calamidade ou desgraça.
theological_decisions:
- issue: Elipse da oração final e perspectiva do falante
  choice: 'A oração é entendida como continuação da autoconfiança do ímpio: “não enfrentarei desgraça”.'
  alternative: Pode ser entendida mais literalmente como “aquele que não está na adversidade” ou, com valor temporal enfático, “jamais sofrerei desgraça”.
  rationale: A continuação na primeira pessoa produz a leitura contextual mais coerente, mas a sintaxe hebraica permanece difícil; por isso, a ambiguidade genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora “em seu coração” foi preservada, e a difícil oração final foi vertida de modo claro sem ocultar sua ambiguidade.
