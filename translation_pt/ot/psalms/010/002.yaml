  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: pt
  text: Em sua arrogância, o perverso persegue o pobre com furor[a]; que os perversos sejam apanhados nas tramas que planejaram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é sintaticamente condensado. Também pode ser traduzido: “Na arrogância do perverso, o pobre é perseguido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles são apanhados nas tramas que planejaram”. A forma hebraica pode ser entendida como declaração, em vez de desejo ou oração.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: Em sua arrogância
  rationale: Expressa o orgulho altivo do perverso como atitude e contexto da perseguição, mantendo a concisão do hebraico.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Substantivo adjetival singular de sentido representativo; “perverso” comunica maldade moral em português corrente e digno.
- source_word: יִדְלַק
  choice: persegue ... com furor
  rationale: דלק pode indicar arder ou perseguir de perto; a formulação conserva tanto a perseguição hostil quanto a intensidade sugerida pela imagem de ardor.
- source_word: עָנִי
  choice: o pobre
  rationale: Preserva o singular representativo e o sentido contextual de pessoa pobre, aflita ou oprimida sem ampliar indevidamente o texto.
- source_word: יִתָּפְשׂוּ
  choice: que eles sejam apanhados
  rationale: Interpreta o imperfeito nifal como desejo ou súplica jussiva contra os perversos, leitura adequada à retórica imprecatória do salmo.
- source_word: בִּמְזִמּוֹת
  choice: nas tramas
  rationale: Comunica planos maliciosos e mantém a imagem de serem apanhados dentro das próprias maquinações.
- source_word: זוּ
  choice: que
  rationale: Representa naturalmente em português a partícula relativa que introduz a oração referente às tramas.
- source_word: חָשָׁבוּ
  choice: planejaram
  rationale: חשׁב denota aqui conceber deliberadamente um plano; “planejaram” é claro e natural, preservando a intenção.
theological_decisions:
- issue: Relação sintática do primeiro membro
  choice: O perverso é o sujeito que persegue, e o pobre é o objeto.
  alternative: 'Construção mais comprimida: “Na arrogância do perverso, o pobre é perseguido”.'
  rationale: A ordem e a compressão do hebraico admitem mais de uma formulação sintática. A opção ativa é natural em português e explicita a leitura contextual provável, enquanto a nota preserva a alternativa.
- issue: Força do segundo membro
  choice: 'Desejo ou oração imprecatória: “que eles sejam apanhados”.'
  alternative: 'Declaração: “eles são apanhados nas tramas que planejaram”.'
  rationale: O imperfeito pode ter força jussiva ou declarativa. A leitura como súplica se ajusta ao discurso do salmo e ao tema da reversão moral, mas a ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Com furor” conserva a intensidade de דלק sem usar uma imagem pouco natural; “tramas” mantém o teor malicioso de מְזִמּוֹת. Os marcadores [a] e [b] aparecem no texto principal.
