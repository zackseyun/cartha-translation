base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/010.yaml
  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: pt
  text: Ele se agacha e se abaixa; os indefesos caem sob o seu poder.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico do início deste versículo é difícil. A primeira expressão também pode ser entendida como “ele se encurva” ou, com outra análise, “ele é esmagado”.
    reason: lexical_alternative
  - marker: b
    text: A sintaxe hebraica do final é compacta e incerta. O verbo também pode ser entendido como “ele cai”. A expressão vertida como “sob o seu poder” significa mais literalmente “por meio de seus poderosos” ou “por seus fortes”; também já foi entendida, em sentido figurado, como “em suas garras poderosas”.
    reason: alternative_reading
lexical_decisions:
- source_word: ו/דכה
  choice: Ele se agacha
  rationale: A forma hebraica é difícil. No contexto da emboscada e em paralelo com יָשֹׁחַ, foi entendida como a postura baixa e predatória do perverso, sem ocultar em nota outras análises possíveis.
- source_word: יָשֹׁחַ
  choice: abaixa-se
  rationale: Expressa de modo natural o ato de curvar-se ou baixar-se e preserva o paralelismo físico com o verbo anterior.
- source_word: וְ/נָפַל ... חלכאים
  choice: e os indefesos caem
  rationale: 'Embora o verbo esteja no singular, a sintaxe poética hebraica é compacta, e entender ''os indefesos'' como sujeito produz o sentido contextual mais coerente: as vítimas caem diante do poder do perverso.'
- source_word: בַּ/עֲצוּמָיו
  choice: sob o seu poder
  rationale: O plural hebraico com sufixo é semanticamente difícil e pode ser entendido de forma abstrata como a força ou o poder do perverso. 'Sob o seu poder' é português claro e preserva a relação de sujeição sugerida pelo contexto.
- source_word: חלכאים
  choice: os indefesos
  rationale: O termo designa pessoas vulneráveis, fracas ou desventuradas. 'Indefesos' comunica com clareza sua vulnerabilidade diante do agressor.
