source:
  edition: WLC
  text: אָלָ֤ה פִּ֣י/הוּ מָ֭לֵא וּ/מִרְמ֣וֹת וָ/תֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗/וֹ עָמָ֥ל וָ/אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: pt
  text: Sua boca está cheia de maldição[a], engano e opressão; debaixo da sua língua há desgraça e maldade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praga”. O substantivo hebraico também pode significar “juramento” em outros contextos, mas aqui o contexto de fala hostil favorece “maldição”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dano e iniquidade” em vez de “desgraça e maldade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: maldição
  rationale: No contexto de fala hostil, o substantivo indica uma imprecação ou maldição, e não um juramento neutro.
- source_word: פִּיהוּ
  choice: sua boca
  rationale: Preserva a imagem hebraica concreta da boca como fonte da fala.
- source_word: מָלֵא
  choice: está cheia de
  rationale: Expressa naturalmente em português o estado de estar repleto de algo, mantendo a imagem de abundância.
- source_word: מִרְמוֹת
  choice: engano
  rationale: O plural hebraico pode ser vertido como substantivo abstrato coletivo; “engano” comunica de modo claro a ideia de fraude e falsidade.
- source_word: תֹךְ
  choice: opressão
  rationale: Neste conjunto, designa dano explorador ou injustiça opressiva, não apenas falsidade verbal.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: debaixo da sua língua
  rationale: Mantém a metáfora vívida do hebraico, que sugere mal oculto ou fala pronta para causar dano.
- source_word: עָמָל
  choice: desgraça
  rationale: Aqui não significa trabalho comum, mas sofrimento, dano ou aflição ligados à atuação do perverso.
- source_word: אָוֶן
  choice: maldade
  rationale: Comunica com clareza a ideia moral de perversidade, injustiça ou iniquidade.
