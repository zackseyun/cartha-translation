base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: pt
  text: Yahweh é Rei para todo o sempre; as nações desapareceram da sua terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por «terra» também pode referir-se à terra em sentido universal, isto é, ao mundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֶלֶךְ
  choice: é Rei
  rationale: Preserva a construção nominal predicativa do hebraico e soa natural em português.
- source_word: עוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: Expressão idiomática que conserva a intensificação hebraica de duração sem fim.
- source_word: אָבְדוּ
  choice: desapareceram
  rationale: Expressa a realidade consumada indicada pelo qatal e preserva o campo semântico de perecer ou deixar de existir, sem introduzir uma voz passiva.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Designa aqui coletividades nacionais, sem a conotação teológica mais específica que 'gentios' poderia adquirir.
- source_word: מֵאַרְצוֹ
  choice: da sua terra
  rationale: Mantém o sentido concreto mais provável de אֶרֶץ no contexto, sem eliminar a possibilidade lexical mais ampla de 'mundo' ou 'terra' em sentido universal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração 'Yahweh' preserva esse nome em vez de substituí-lo por um título.
- issue: Alcance de אַרְצוֹ
  choice: da sua terra
  alternative: do seu mundo
  rationale: O contexto favorece o sentido territorial concreto, mas o substantivo também pode designar a terra em sentido amplo; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo conciso do verso e registra em nota a amplitude semântica de אֶרֶץ.
