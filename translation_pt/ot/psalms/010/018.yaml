  - marker: c
    text: 'Hebraico: “o ser humano da terra”; isto é, o mero ser humano mortal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: fazer justiça
  rationale: O infinitivo expressa a finalidade ou o resultado da ação divina no contexto anterior. “Fazer justiça” mantém o sentido judicial e comunica naturalmente a defesa dos vulneráveis.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a designação social e jurídica da pessoa privada da proteção paterna. “Órfão” é claro e corrente em português.
- source_word: דַּךְ
  choice: oprimido
  rationale: O termo descreve alguém esmagado, abatido ou afligido. “Oprimido” transmite com clareza sua condição sem exigir uma formulação excessivamente literal.
- source_word: בַּל יוֹסִיף עוֹד
  choice: nunca mais
  rationale: A combinação nega a continuação ou repetição da ação. “Nunca mais” exprime de modo conciso e natural que o terror deve cessar definitivamente.
- source_word: לַעֲרֹץ
  choice: cause terror
  rationale: O verbo indica provocar terror ou pavor. “Cause terror” preserva essa força específica e evita confundi-lo com o sentido mais amplo de oprimir.
- source_word: אֱנוֹשׁ
  choice: o mortal
  rationale: אֱנוֹשׁ pode salientar a fragilidade e mortalidade humana. “O mortal” conserva esse contraste com Deus e funciona como singular representativo em português.
- source_word: מִן הָאָרֶץ
  choice: vindo da terra
  rationale: A expressão significa literalmente “da terra” ou “proveniente da terra”. “Vindo da terra” preserva a imagem da origem terrena do ser humano sem sugerir apenas um habitante rural.
theological_decisions:
- issue: O singular masculino genérico em אֱנוֹשׁ
  choice: o mortal
  alternative: o homem da terra
  rationale: “O mortal” mantém o singular representativo e a ênfase na fragilidade humana, sem limitar a referência ao sexo masculino. A alternativa é mais formalmente próxima, mas em português pode ser entendida como um homem do campo.
- issue: Relação de מִן הָאָרֶץ com אֱנוֹשׁ
  choice: o mortal vindo da terra
  alternative: o mortal da terra
  rationale: A formulação mantém a ligação entre o ser humano e sua origem terrena, sem transformar a expressão em uma afirmação doutrinária mais específica do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura final preserva a finalidade expressa pelo hebraico e o contraste entre a justiça divina e a fragilidade do agressor humano.
