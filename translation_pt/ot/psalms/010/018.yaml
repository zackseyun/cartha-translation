  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: pt
  text: para fazer justiça ao órfão[a] e ao oprimido[b], para que o ser humano da terra[c] não aterrorize mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à pessoa sem pai”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao esmagado” ou “ao aflito”.
