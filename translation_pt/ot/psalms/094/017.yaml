id: PSA.94.17
reference: Psalms 94:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לוּלֵ֣י יְ֭הוָה עֶזְרָ֣תָ/ה לִּ֑/י כִּ/מְעַ֓ט שָֽׁכְנָ֖ה דוּמָ֣ה נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: pt
  text: Se Yahweh não tivesse sido o meu auxílio, por pouco minha alma[a] teria habitado no silêncio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha vida”. O termo hebraico também pode designar a própria pessoa ou sua vida.
    reason: lexical_alternative
  - marker: b
    text: “Silêncio” provavelmente se refere ao silêncio da morte ou do Sheol.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Se ... não tivesse sido
  rationale: Introduz uma condição contrafactual referente ao passado; esta construção comunica com naturalidade, em português, o resultado que teria ocorrido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עֶזְרָתָה לִּי
  choice: o meu auxílio
  rationale: O substantivo com a expressão preposicional apresenta Yahweh como aquele que presta auxílio ao salmista; a formulação possessiva é natural em português.
- source_word: כִּמְעַט
  choice: por pouco
  rationale: No contexto, indica que o desfecho esteve perto de ocorrer. “Por pouco” preserva melhor esse valor do que uma expressão meramente temporal.
- source_word: שָׁכְנָה
  choice: teria habitado
  rationale: Preserva a imagem do verbo שׁכן, “habitar” ou “residir”, dentro da construção contrafactual.
- source_word: דוּמָה
  choice: silêncio
  rationale: Traduz diretamente o substantivo hebraico sem explicitar no texto principal sua provável associação poética com a morte ou o Sheol.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Mantém a expressão antropológica e poética hebraica, embora נֶפֶשׁ também possa designar a vida ou a própria pessoa.
theological_decisions:
- issue: Se a alusão à morte ou ao Sheol em דוּמָה deve ser explicitada
  choice: Manter “silêncio” no texto principal
  alternative: o silêncio da morte; o Sheol
  rationale: Embora o contexto provavelmente associe o silêncio à morte ou ao Sheol, o substantivo hebraico diz “silêncio”. A tradução preserva essa tensão e registra a interpretação provável em nota.
translation_notes:
  register: Português moderno, claro e poético, com leitura natural no Brasil e ampla compreensão internacional. “Auxílio” e “habitado” conservam a dignidade e as imagens do hebraico sem tornar a frase excessivamente arcaica.
