  text: יַבִּ֣יעוּ יְדַבְּר֣וּ עָתָ֑ק יִֽ֝תְאַמְּר֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: pt
  text: Eles despejam palavras[a] e falam com arrogância; todos os que praticam o mal se vangloriam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “jorram”; o objeto não é expresso, mas é sugerido pelo verbo paralelo “falam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se exaltam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: despejam palavras
  rationale: O hifil de נבע descreve algo que jorra ou flui abundantemente. Neste contexto de fala, “despejam palavras” torna explícito em português o objeto sugerido pelo verbo paralelo “falam”, preservando a imagem de uma torrente verbal.
- source_word: יְדַבְּרוּ
  choice: falam
  rationale: Equivalente direto, natural e neutro de דבר, adequado ao paralelismo poético.
- source_word: עָתָק
  choice: com arrogância
  rationale: O termo pode indicar arrogância, insolência ou fala altiva. A locução adverbial comunica naturalmente em português o caráter da fala sem limitar o sentido a palavras específicas.
- source_word: יִתְאַמְּרוּ
  choice: se vangloriam
  rationale: A forma reflexiva expressa autoexaltação ou orgulho ostensivo. “Se vangloriam” é conciso, corrente e mantém o vínculo entre arrogância e ostentação verbal.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: todos os que praticam o mal
  rationale: Traduz de modo natural a construção “todos os praticantes de maldade/iniquidade”, preservando tanto sua abrangência como seu peso moral.
