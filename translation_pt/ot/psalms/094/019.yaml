  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: pt
  text: Quando se multiplicam dentro de mim os pensamentos inquietos[a], as tuas consolações[b] deleitam a minha alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os meus pensamentos perturbadores”. O substantivo hebraico pode sugerir pensamentos inquietos, divididos ou que se ramificam.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os teus consolos alegram a minha alma”. O hebraico emprega o substantivo no plural: “consolações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: Quando se multiplicam
  rationale: A construção בְּרֹב exprime abundância ou multiplicidade e, neste contexto, tem valor circunstancial. A formulação verbal é natural em português e comunica que os pensamentos se tornam numerosos.
- source_word: שַׂרְעַפַּי
  choice: os pensamentos inquietos
  rationale: O substantivo indica pensamentos perturbadores, divididos ou ramificados, não simples reflexão neutra. “Pensamentos inquietos” preserva a agitação interior sem restringi-la apenas à ansiedade.
- source_word: בְּקִרְבִּי
  choice: dentro de mim
  rationale: A expressão hebraica aponta para a interioridade do salmista. “Dentro de mim” é idiomático, claro e fiel ao sentido.
- source_word: תַּנְחוּמֶיךָ
  choice: as tuas consolações
  rationale: O plural hebraico é preservado, sugerindo manifestações repetidas ou variadas do consolo divino. “Consolações” mantém o tom poético e profundo.
- source_word: יְשַׁעַשְׁעוּ
  choice: deleitam
  rationale: O verbo comunica prazer reconfortante, alívio e alegria. “Deleitam” conserva sua força positiva e seu registro poético, sem reduzi-lo apenas a distrair ou acalmar.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נֶפֶשׁ pode designar vida, pessoa ou ser interior. Aqui, “minha alma” exprime adequadamente o íntimo do salmista e preserva o registro devocional.
