  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: pt
  text: Pois o juízo voltará à justiça[a], e todos os retos de coração o seguirão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à retidão”. Os termos hebraicos מִשְׁפָּט e צֶדֶק podem abranger os sentidos de “juízo”, “justiça” e “retidão”.'
