    text: 'Literalmente: “e atrás dele, todos os retos de coração”. O sentido pode ser que eles seguirão o juízo restaurado ou se alinharão com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou a certeza que sustenta o contexto anterior, preservando o encadeamento argumentativo do salmo.
- source_word: עַד צֶדֶק
  choice: à justiça
  rationale: 'Com יָשׁוּב, a preposição עַד tem sentido direcional: o juízo retorna à conformidade com o que é justo. A construção portuguesa é concisa e natural.'
- source_word: יָשׁוּב
  choice: voltará
  rationale: Traduz diretamente o sentido normal de שׁוב, indicando retorno ou restauração de uma condição anterior.
- source_word: מִשְׁפָּט
  choice: o juízo
  rationale: O termo pode indicar juízo, justiça ou decisão judicial. “Juízo” mantém alguma distinção lexical em relação a צֶדֶק e expressa o exercício ou a administração da justiça.
- source_word: צֶדֶק
  choice: justiça
  rationale: Neste contexto, designa a retidão moral como padrão ao qual o juízo retorna. “Justiça” é clara e idiomática em português, embora “retidão” também seja possível.
- source_word: וְאַחֲרָיו
  choice: o seguirão
  rationale: Literalmente, “e atrás dele”. A formulação explicita em português o sentido idiomático de seguir ou alinhar-se com o juízo restaurado, sem definir além do necessário como isso ocorre.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: todos os retos de coração
  rationale: Preserva a expressão hebraica para pessoas cuja disposição interior é moralmente íntegra, em linguagem bíblica ainda compreensível no português atual.
theological_decisions:
- issue: Relação entre juízo e justiça
  choice: O juízo retornará à justiça, isto é, voltará a corresponder ao padrão do que é justo.
  alternative: O juízo continuará até que a justiça prevaleça.
  rationale: A construção יָשׁוּב com עַד favorece a ideia de retorno em direção à justiça, preservando a esperança poética de restauração da ordem moral sem acrescentar uma formulação doutrinária mais específica.
- issue: Referente do sufixo em וְאַחֲרָיו
  choice: 'O pronome se refere mais naturalmente a “juízo”: os retos de coração o seguirão.'
  alternative: O sufixo pode apontar de modo mais amplo para a justiça ou para a ordem justa restaurada.
  rationale: מִשְׁפָּט é o antecedente masculino singular mais próximo. A nota preserva tanto a forma elíptica do hebraico quanto a possibilidade de uma referência conceitual mais ampla.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética concisa. “Retos de coração” conserva a imagem antropológica hebraica sem soar excessivamente arcaica; as notas registram as ambiguidades lexicais e a elipse da segunda oração.
