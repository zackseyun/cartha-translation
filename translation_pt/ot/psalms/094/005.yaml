  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: pt
  text: Ó Yahweh, eles esmagam[a] o teu povo e afligem a tua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oprimem”. O verbo hebraico pode descrever uma opressão que esmaga.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tua porção” ou “a tua propriedade”. O termo hebraico indica aquilo que alguém recebe por herança ou possui como porção atribuída.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: עַם designa aqui o povo que pertence a Yahweh; “o teu povo” é natural, preciso e preserva a relação expressa pelo sufixo hebraico.
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: O tetragrama é vertido pelo nome pessoal “Yahweh”, e a interjeição “Ó” expressa o vocativo do contexto sem substituir o nome por um título.
- source_word: יְדַכְּאוּ
  choice: esmagam
  rationale: O piel de דכא comunica a ideia intensa de esmagar ou oprimir de modo devastador; “esmagam” conserva a imagem vigorosa do hebraico.
- source_word: וְנַחֲלָתְךָ
  choice: e a tua herança
  rationale: נַחֲלָה pode indicar herança, porção atribuída ou propriedade; neste contexto, refere-se ao povo como aquilo que pertence a Yahweh.
- source_word: יְעַנּוּ
  choice: afligem
  rationale: O piel de ענה significa afligir, maltratar ou oprimir. “Afligem” mantém a gravidade da ação e evita repetir a mesma formulação do primeiro verbo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título.
- issue: Sentido de נַחֲלָה aplicado ao povo
  choice: a tua herança
  alternative: a tua propriedade
  rationale: “Herança” preserva a metáfora hebraica de Israel como porção pertencente a Yahweh, sem explicitar além do que o verso afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal de leitura natural no Brasil. A ordem do hebraico é preservada sem rigidez, e os dois verbos recebem traduções distintas para manter o paralelismo sem apagar suas nuances.
