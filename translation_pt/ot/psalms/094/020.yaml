source:
  edition: WLC
  text: הַֽ֭/יְחָבְרְ/ךָ כִּסֵּ֣א הַוּ֑וֹת יֹצֵ֖ר עָמָ֣ל עֲלֵי חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: pt
  text: Pode um trono de ruína[a] aliar-se a ti, ele que forja sofrimento por meio de um decreto?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trono de calamidades”, “trono de maldade” ou “trono de destruição”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “forja sofrimento sobre decreto”; isto é, usa uma lei ou um decreto como meio — ou talvez como pretexto — para produzir dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: Pode ... aliar-se a ti
  rationale: A forma interrogativa de חבר expressa associação ou aliança. A pergunta retórica preserva a incompatibilidade entre Deus e o poder corrupto.
- source_word: כִּסֵּא
  choice: trono
  rationale: Mantém a imagem política e judicial, com sentido metonímico de poder governante.
- source_word: הַוּוֹת
  choice: ruína
  rationale: O plural pode indicar calamidades, atos destrutivos ou planos ruinosos. “Ruína” conserva a força destrutiva sem reduzi-la simplesmente a uma categoria moral abstrata.
- source_word: יֹצֵר
  choice: forja
  rationale: O particípio de יצר significa formar ou modelar. “Forja” mantém a imagem concreta e comunica a produção deliberada do mal por parte da autoridade.
- source_word: עָמָל
  choice: sofrimento
  rationale: O termo abrange aflição, dano, miséria e opressão. “Sofrimento” é natural em português e indica o resultado nocivo da legislação injusta.
- source_word: עֲלֵי חֹק
  choice: por meio de um decreto
  rationale: A expressão literal “sobre decreto/estatuto” provavelmente apresenta a lei ou o decreto como instrumento, ou possivelmente pretexto, para causar dano. A formulação principal permanece próxima dessa relação instrumental.
theological_decisions:
- issue: A relação de Deus com um governo injusto
  choice: A pergunta retórica sugere que um poder destrutivo não pode aliar-se a Deus.
  alternative: A pergunta poderia referir-se, de modo mais geral, a um juiz injusto que pretendesse participar do juízo de Deus.
  rationale: A imagem do “trono” e a forma interrogativa apontam para a incompatibilidade entre Deus e uma autoridade que produz sofrimento mediante decretos, sem tornar explícita no texto uma conclusão doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da pergunta foi mantida natural, e as imagens políticas, artesanais e jurídicas do hebraico foram preservadas.
