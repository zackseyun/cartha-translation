  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: pt
  text: 'Quando eu disse: “Meu pé está escorregando”, teu amor leal, ó SENHOR, me sustentou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Quando eu disse
  rationale: Embora אִם frequentemente introduza uma condição (“se”), neste contexto pode ter valor temporal, descrevendo a ocasião em que o salmista percebeu o perigo; “quando” expressa naturalmente essa relação.
- source_word: מָטָה רַגְלִי
  choice: Meu pé está escorregando
  rationale: A imagem hebraica retrata a perda de firmeza e a ameaça de queda. O presente progressivo em português transmite a percepção imediata do salmista.
- source_word: חַסְדְּךָ
  choice: teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, fidelidade e compromisso constante; “amor leal” preserva essa amplitude sem impor terminologia confessional.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por “SENHOR” em versaletes ou maiúsculas.
- source_word: יִסְעָדֵנִי
  choice: me sustentou
  rationale: O verbo סעד significa apoiar ou sustentar alguém, especialmente para impedir sua queda; o pretérito combina com o relato da intervenção divina.
theological_decisions:
- issue: Relação entre a ameaça de queda e a ação divina
  choice: Manter a imagem concreta do pé escorregando e do amor leal que sustenta
  alternative: Explicitar a queda como dúvida, pecado ou sofrimento
  rationale: O texto não identifica a natureza exata da crise; preservar a metáfora evita restringir sua aplicação teológica.
- issue: Valor de אִם no início do verso
  choice: 'Leitura temporal: “Quando eu disse”'
  alternative: 'Leitura condicional: “Se eu dissesse” ou “Se eu disse”'
  rationale: O contexto e a sequência narrativa favorecem a recordação de uma ocasião concreta, embora o hebraico isoladamente admita nuance condicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase e a metáfora corporal foram preservadas, evitando explicações interpretativas dentro do versículo.
