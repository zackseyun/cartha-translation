  text: יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם כִּי הֵ֥מָּה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/011.yaml
  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: pt
  text: O SENHOR conhece os pensamentos do ser humano; sabe que não passam de vapor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: O SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, em harmonia com a camada de consulta inglesa.
- source_word: מַחְשְׁבוֹת (maḥševot)
  choice: pensamentos
  rationale: Expressa naturalmente ideias, raciocínios ou desígnios mentais; neste contexto, “pensamentos” é a opção mais direta e não restringe indevidamente o sentido.
- source_word: אָדָם (ʾadam)
  choice: ser humano
  rationale: O substantivo é genérico e coletivo neste verso; “ser humano” comunica essa abrangência sem sugerir exclusivamente um indivíduo do sexo masculino ou o nome próprio Adão.
- source_word: הֶבֶל (hevel)
  choice: vapor
  rationale: Preserva a imagem concreta de algo fugaz, insubstancial e efêmero, em vez de reduzi-la ao conceito abstrato de “vaidade”.
theological_decisions:
- issue: Relação expressa por כִּי (ki)
  choice: sabe que
  alternative: pois eles são
  rationale: Aqui כִּי pode introduzir o conteúdo conhecido ou uma explicação. “Sabe que” apresenta com naturalidade o conteúdo do conhecimento divino e acompanha a leitura da camada inglesa sem eliminar a afirmação da futilidade humana.
- issue: Alcance de אָדָם (ʾadam)
  choice: humanidade em sentido genérico, vertida como “ser humano”
  alternative: homem
  rationale: O contexto contrasta o conhecimento do SENHOR com os pensamentos humanos em geral; a formulação inclusiva preserva esse alcance.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição implícita de “pensamentos” em “não passam” é clara em português; “vapor” mantém a força poética da metáfora hebraica.
