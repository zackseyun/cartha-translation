  text: Até quando, ó Yahweh, os perversos, até quando os perversos exultarão?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressão interrogativa idiomática de duração, natural em português e adequada ao tom urgente de lamento.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo plural substantivado designa coletivamente pessoas moralmente perversas; a escolha é clara, concisa e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: יַעֲלֹזוּ
  choice: exultarão
  rationale: O verbo עלז comunica alegria exuberante ou triunfante; no contexto da denúncia, “exultar” preserva melhor essa intensidade do que o mais neutro “alegrar-se”.
- source_word: repetição de עַד מָתַי רְשָׁעִים
  choice: os perversos — até quando os perversos
  rationale: Mantém a repetição enfática do hebraico. O travessão permite conservar a primeira exclamação elíptica e a retomada intensificadora sem inserir um verbo ausente do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo por um título, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição e a construção elíptica preservam a urgência poética do lamento; “ó” marca com naturalidade o vocativo solene.
