base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: pt
  text: 'E dizem: “Jah[a] não vê, e o Deus de Jacó não entende.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Jah”, forma poética abreviada do nome divino; compare-se com a forma mais comum do nome da aliança, frequentemente traduzida como “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E dizem
  rationale: Embora a forma hebraica possa ser vertida formalmente no passado, no discurso poético ela apresenta a fala característica dos perversos. O presente soa natural em português e mantém o sentido contínuo do contexto.
- source_word: לֹא יִרְאֶה
  choice: não vê
  rationale: O verbo ראה expressa aqui percepção visual e, por extensão, conhecimento do que ocorre. “Não vê” conserva a imagem concreta e a alegação de que Deus não observa a injustiça.
- source_word: יָּהּ
  choice: Já
  rationale: Trata-se da forma poética abreviada do nome divino, distinta do tetragrama completo. “Já” translitera essa forma de modo compatível com a tradição bíblica em português, sem a assimilar silenciosamente a “SENHOR”.
- source_word: וְלֹא יָבִין
  choice: e ... não entende
  rationale: בין significa entender, discernir ou perceber. “Não entende” é direto e preserva a afirmação provocadora dos perversos sem explicá-la além do texto.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: o Deus de Jacó
  rationale: A expressão construta funciona como título pactual. A formulação tradicional e transparente em português mantém a referência ao Deus de Israel.
theological_decisions:
- issue: Representação da forma poética abreviada do nome divino יָּהּ
  choice: Já
  alternative: o SENHOR
  rationale: O hebraico emprega יָּהּ, não o tetragrama completo יְהוָה. A transliteração “Já” preserva essa distinção poética e lexical sem impor uma equivalência denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. O paralelismo hebraico foi preservado, assim como a afirmação teologicamente tensa dos perversos de que Deus não vê nem entende.
