source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: pt
  text: Aquele que plantou o ouvido[a] não ouvirá? Aquele que formou o olho[b] não verá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “implantou o ouvido”. O verbo hebraico significa literalmente “plantou” e emprega uma imagem vívida do Criador.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como “verá” também pode significar “olhará” ou “observará”; aqui se refere à percepção visual.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: plantou
  rationale: Preserva a metáfora vívida do verbo hebraico נטע, em vez de reduzi-la ao sentido genérico de “fez”.
- source_word: אֹזֶן
  choice: ouvido
  rationale: No contexto, designa o órgão e a faculdade da audição; “ouvido” é a forma natural em português e mantém o singular poético.
- source_word: יִשְׁמָע
  choice: ouvirá
  rationale: Exprime a capacidade de ouvir, em paralelo com a capacidade visual da segunda pergunta.
- source_word: יֹצֵר
  choice: formou
  rationale: Conserva a ideia de dar forma intencionalmente, própria de יצר, com linguagem corrente e digna.
- source_word: עַיִן
  choice: olho
  rationale: Mantém o sentido físico básico e o singular, em paralelo com “ouvido”.
- source_word: יַבִּיט
  choice: verá
  rationale: Embora נבט possa significar “olhar” ou “observar”, aqui “ver” comunica naturalmente a percepção visual correspondente ao olho.
- source_word: הֲ...הֲלֹא
  choice: não ...?
  rationale: A formulação interrogativa negativa preserva as perguntas retóricas que esperam resposta afirmativa.
- source_word: אִם
  choice: Aquele que
  rationale: Introduz naturalmente o segundo membro paralelo em português, sem impor um sentido condicional inadequado ao contexto.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção de Deus
  choice: Manter o argumento concreto do Criador para as capacidades de ouvir e ver.
  alternative: 'Parafrasear: “Aquele que deu a audição e a visão certamente percebe.”'
  rationale: A tradução conserva as imagens de ouvido e olho e deixa intacta a força teológica da pergunta, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O futuro retórico “não ouvirá?/não verá?” acompanha naturalmente a forma verbal hebraica e preserva o paralelismo. Mantiveram-se o singular de “ouvido” e “olho” e a metáfora incomum de “plantar”.
