  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: pt
  text: Entendam, ó embrutecidos entre o povo; e vocês, tolos, quando entenderão?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Entendam
  rationale: Imperativo plural de בין, aqui uma convocação direta a perceber e compreender.
- source_word: בֹּעֲרִים
  choice: embrutecidos
  rationale: O termo descreve pessoas sem entendimento, comparáveis a seres brutos; “embrutecidos” preserva a força da censura sem sugerir apenas falta de instrução.
- source_word: בָּעָם
  choice: entre o povo
  rationale: A preposição ב com artigo e עם identifica esses indivíduos no meio do povo.
- source_word: כְסִילִים
  choice: tolos
  rationale: Tradução corrente do termo sapiencial para quem rejeita o entendimento e age sem sabedoria.
- source_word: תַּשְׂכִּילוּ
  choice: agirão com sabedoria
  rationale: O hifil de שׂכל pode abranger adquirir discernimento e proceder sabiamente; esta formulação mantém a dimensão prática do verbo.
theological_decisions:
- issue: Natureza da repreensão aos insensatos
  choice: Manter duas designações fortes, “embrutecidos” e “tolos”
  alternative: Suavizar para “insensatos” ou “sem entendimento”
  rationale: O hebraico emprega vocabulário deliberadamente severo; a tradução não deve atenuar a acusação moral e sapiencial.
translation_notes:
  register: Português moderno, direto e digno, com vocativo marcado por “ó” e segunda pessoa plural expressa por “vocês”, de ampla legibilidade brasileira.
