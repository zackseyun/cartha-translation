  text: יָ֭גוֹדּוּ עַל נֶ֣פֶשׁ צַדִּ֑יק וְ/דָ֖ם נָקִ֣י יַרְשִֽׁיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: pt
  text: Eles se unem contra a vida do justo[a] e condenam o sangue inocente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reúnem-se em bando contra a vida do justo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “declaram culpado o sangue inocente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: se unem
  rationale: O verbo pode indicar reunir-se em bando ou agir conjuntamente num ataque. “Se unem” expressa a ação coletiva e hostil sem impor uma imagem estritamente militar.
- source_word: עַל
  choice: contra
  rationale: Com o verbo de ação hostil, a preposição indica oposição.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto, refere-se à vida da pessoa justa, ameaçada por violência; “vida” também mantém a relação concreta com “sangue inocente” no segundo membro.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado está no singular e designa a pessoa justa de modo representativo. “O justo” conserva esse singular sem acrescentar elementos ausentes no hebraico.
- source_word: דָם נָקִי
  choice: sangue inocente
  rationale: A tradução direta preserva a imagem vívida e forense do hebraico e é uma expressão natural em português bíblico corrente.
- source_word: יַרְשִׁיעוּ
  choice: condenam
  rationale: A forma causativa de רשע pode significar declarar culpado ou condenar. “Condenam” comunica de modo conciso o sentido judicial, preservando a tensão de terem por culpado o sangue que é inocente.
theological_decisions:
- issue: Singular representativo em צַדִּיק
  choice: o justo
  alternative: uma pessoa justa
  rationale: O hebraico emprega o singular substantivado, que pode representar qualquer pessoa justa. “O justo” mantém a forma singular e seu caráter representativo, sem restringir o referente a um indivíduo específico.
- issue: Imagem forense em יַרְשִׁיעוּ aplicada a דָם נָקִי
  choice: condenam o sangue inocente
  alternative: declaram culpado o sangue inocente
  rationale: A formulação principal é natural e preserva tanto a imagem do sangue quanto o ato judicial perverso. A alternativa mais literal é registrada em nota, sem resolver a tensão metafórica do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela e as imagens concretas de “vida” e “sangue inocente” foram preservadas; as notas registram alternativas lexicais genuínas sem sobrecarregar o texto principal.
