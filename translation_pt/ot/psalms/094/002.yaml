source:
  edition: WLC
  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: pt
  text: Ergue-te[a], Juiz da terra; retribui aos orgulhosos o que merecem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eleva-te” ou “Sê exaltado”. O verbo hebraico também pode ser entendido mais literalmente como um chamado para Deus elevar-se ou ser exaltado.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “faz voltar a retribuição sobre os orgulhosos”; também pode ser traduzido por “dá aos orgulhosos a sua paga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Ergue-te
  rationale: O imperativo hebraico reflexivo convoca Deus a se levantar para agir. “Ergue-te” conserva a imagem de elevar-se e soa natural e digna em português.
- source_word: שֹׁפֵט
  choice: Juiz
  rationale: O particípio funciona como título substantivado dirigido a Deus; “Juiz” é direto e preserva o campo judicial.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: Neste chamado poético ao Juiz divino, “terra” comunica melhor o alcance universal do que “país” ou “território”.
- source_word: הָשֵׁב
  choice: retribui
  rationale: O imperativo causativo de שוב, combinado com גְּמוּל, expressa fazer a retribuição voltar sobre alguém; “retribui” comunica de modo claro a ação judicial.
- source_word: גְּמוּל
  choice: o que merecem
  rationale: גְּמוּל denota paga, retribuição ou aquilo que é devido. A expressão idiomática esclarece o sentido sem acrescentar a natureza específica da pena.
- source_word: עַל
  choice: aos
  rationale: Na construção הָשֵׁב גְּמוּל עַל, a preposição indica os destinatários ou alvos da retribuição; em português, “retribuir a alguém” é natural.
- source_word: גֵּאִים
  choice: orgulhosos
  rationale: O termo designa pessoas altivas ou arrogantes em sentido moral. “Orgulhosos” preserva a formulação tradicional e é amplamente compreensível.
theological_decisions:
- issue: Natureza do pedido por julgamento divino
  choice: Um apelo para que Deus, como Juiz universal, intervenha e dê aos orgulhosos a retribuição devida.
  alternative: Um apelo principalmente para que Deus seja exaltado ou manifeste sua majestade, sem ênfase imediata na intervenção judicial.
  rationale: Os dois imperativos e o vocabulário judicial — “Juiz” e “retribui” — favorecem uma convocação à ação julgadora. A tradução mantém essa ênfase sem especificar além do texto a forma da retribuição.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Ergue-te” mantém o paralelismo poético e a imagem hebraica; “o que merecem” comunica naturalmente גְּמוּל, enquanto a nota registra a formulação mais literal.
