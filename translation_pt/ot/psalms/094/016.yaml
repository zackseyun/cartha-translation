base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: pt
  text: Quem se levantará por mim contra os malfeitores? Quem tomará posição por mim contra os que praticam a maldade?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a preposição traduzida como “contra” normalmente significa “com”; aqui, o contexto indica confronto com os malfeitores.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: O pronome interrogativo abre as duas perguntas paralelas e é traduzido diretamente.
- source_word: יָקוּם
  choice: se levantará
  rationale: O qal imperfeito de קום conserva a imagem vívida de alguém que se levanta para agir em defesa do salmista.
- source_word: לִי
  choice: por mim
  rationale: A preposição לִי indica benefício ou defesa; “por mim” é natural em português e preserva a ideia de agir em favor do falante.
- source_word: עִם
  choice: contra
  rationale: Embora עִם normalmente signifique “com”, neste contexto de confronto introduz o grupo ao qual alguém se opõe; “contra” comunica naturalmente essa relação.
- source_word: מְרֵעִים
  choice: malfeitores
  rationale: O particípio designa pessoas que fazem o mal; “malfeitores” é conciso, atual e mantém a categoria moral.
- source_word: יִתְיַצֵּב
  choice: tomará posição
  rationale: O hitpael de יצב expressa apresentar-se ou firmar-se decididamente; “tomará posição” distingue o verbo do paralelo “se levantará” e explicita sua força.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a maldade
  rationale: A expressão hebraica descreve aqueles cuja atuação produz ou pratica אָוֶן. A formulação portuguesa é clara e preserva a dimensão habitual da conduta.
- source_word: אָוֶן
  choice: maldade
  rationale: Neste paralelo com “malfeitores”, אָוֶן tem sentido ético de mal ou perversidade, embora possa assumir outros matizes em contextos diferentes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi preservado, variando “se levantará” e “tomará posição” para refletir os dois verbos hebraicos. Evitou-se “iniquidade”, menos corrente, em favor de “maldade”.
