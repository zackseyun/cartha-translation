  source_fidelity: A tradução de לְהַשְׁקִיט לוֹ e da oração final é fiel. Contudo, מִימֵי רָע significa literalmente “dos/de dias de mal” e, no contexto, “dos dias de aflição”; “nos dias de aflição” altera a preposição e tende a apresentar o descanso como ocorrido durante esses dias, em vez de descanso em relação a eles. A revisão preserva a relação expressa pelo hebraico sem resolver além do necessário a nuance do alívio.
  naturalness: “Para lhe dar descanso dos dias de aflição” é natural em português moderno e conserva o registro poético-sapiencial. “Cova” e “ímpio” são adequados e amplamente compreensíveis.
  terminology: “Descanso”, “aflição”, “cova” e “ímpio” refletem bem os termos e o tom do versículo. A nota sobre שׁחת deve apresentar “destruição” como conotação lexical, não como se o hebraico tivesse necessariamente uma construção genitiva explícita.
