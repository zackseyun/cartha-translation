  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: pt
  text: para lhe dar descanso dos dias de aflição[a], até que se cave uma cova para o ímpio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos dias maus”. O hebraico diz literalmente “de dias de mal” e pode indicar dias marcados por aflição ou calamidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que se cave para o ímpio uma cova de destruição”. A palavra também pode ter conotações de destruição ou sepultura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: para lhe dar descanso
  rationale: O infinitivo hifil de שׁקט expressa fazer alguém repousar ou ficar tranquilo; a construção com לוֹ indica o beneficiário. A formulação é natural em português e mantém a relação de finalidade com o versículo anterior.
- source_word: מִימֵי רָע
  choice: nos dias de aflição
  rationale: Embora a preposição מִן possa ser vertida literalmente por “de”, aqui a expressão comunica descanso ou alívio em relação a dias marcados pelo mal ou pela calamidade. “Nos dias de aflição” preserva a possibilidade de tranquilidade durante a adversidade, sem afirmar necessariamente que a pessoa seja retirada dela.
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal do descanso concedido.
- source_word: יִכָּרֶה
  choice: se cave
  rationale: 'O nifal imperfeito de כרה é adequadamente entendido como passivo: a cova é cavada. A construção com “se” é idiomática em português.'
- source_word: לָרָשָׁע
  choice: para o ímpio
  rationale: O adjetivo substantivado singular designa a pessoa ímpia como tipo representativo.
- source_word: שָׁחַת
  choice: uma cova
  rationale: O substantivo denota uma cova ou fosso e pode evocar destruição ou sepultura; “cova” é uma tradução direta, enquanto a conotação destrutiva é registrada em nota.
theological_decisions:
- issue: Natureza do descanso concedido ao justo em aflição
  choice: descanso nos dias de aflição até que chegue o juízo do ímpio
  alternative: alívio que retira a pessoa dos dias de aflição; ou descanso exclusivamente escatológico
  rationale: A expressão hebraica permite entender tanto alívio diante dos dias calamitosos quanto tranquilidade no decorrer deles. A tradução mantém essa tensão e não restringe o descanso a uma interpretação exclusivamente temporal ou escatológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aflição”, “cova” e “ímpio” preservam o tom poético e sapiencial sem arcaísmo excessivo. Os marcadores aparecem no texto em ordem de ocorrência.
