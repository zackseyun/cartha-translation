  text: הֲ/יֹסֵ֣ר גּ֭וֹיִם הֲ/לֹ֣א יוֹכִ֑יחַ הַֽ/מְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: pt
  text: Aquele que disciplina as nações não repreenderá — aquele que ensina conhecimento ao ser humano[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem” ou “humanidade”; o hebraico usa o singular representativo “homem” (אָדָם).
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: disciplina
  rationale: O verbo יסר expressa disciplina corretiva, não mero castigo; “disciplina” conserva tanto a correção quanto a autoridade.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Neste contexto, גּוֹיִם designa coletivamente as nações ou os povos, sem o sentido especificamente religioso de “gentios”.
- source_word: יוֹכִיחַ
  choice: repreenderá
  rationale: O hifil de יכח comunica repreensão ou correção. O futuro em português dá naturalidade à pergunta retórica e mantém o paralelo com a disciplina do primeiro membro.
- source_word: הַמְלַמֵּד
  choice: aquele que ensina
  rationale: O particípio tem função substantiva e descreve Deus por sua ação; a formulação preserva a estrutura hebraica.
- source_word: אָדָם
  choice: o ser humano
  rationale: אָדָם é um singular representativo que aqui se refere à humanidade. “O ser humano” preserva o singular e soa natural e inclusivo no português contemporâneo.
- source_word: דָּעַת
  choice: conhecimento
  rationale: דָּעַת significa conhecimento ou saber; “conhecimento” é o equivalente direto e funciona naturalmente como objeto de “ensina”.
- source_word: הֲ...הֲלֹא
  choice: não ...? ...?
  rationale: As partículas introduzem uma pergunta retórica que espera resposta afirmativa. A construção negativa no primeiro membro e a interrogação elíptica no segundo reproduzem sua força sem completar silenciosamente o texto.
theological_decisions:
- issue: Uso genérico de אָדָם
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O referente é a humanidade em geral, mas o hebraico emprega um singular representativo. “O ser humano” comunica ambos os aspectos sem restringir indevidamente o sentido ao sexo masculino.
- issue: Elipse no segundo membro
  choice: manter “Aquele que ensina conhecimento ao ser humano?” sem acrescentar um verbo
  alternative: “Aquele que ensina conhecimento ao ser humano não saberá?”
  rationale: O texto massorético termina em דָּעַת, sem um verbo equivalente a “saberá”. A forma elíptica preserva a tensão e evita inserir no texto principal uma conclusão apenas subentendida, embora o contexto favoreça essa inferência.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. O marcador foi colocado junto de “ser humano”, termo ao qual a nota lexical efetivamente se refere. A elipse do segundo membro foi mantida por fidelidade ao texto hebraico.
