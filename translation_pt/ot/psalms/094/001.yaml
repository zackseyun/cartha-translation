source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: pt
  text: Ó Deus da vingança[a], ó Yahweh, Deus da vingança, resplandece![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Deus das vinganças... Deus das vinganças”. O plural hebraico provavelmente intensifica a ideia da retribuição divina.
    reason: lexical_alternative
  - marker: b
    text: Ou “aparece” ou “manifesta-te”. O verbo pode indicar uma manifestação divina visível; “resplandece” ressalta seu caráter radiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: Neste chamado direto, אֵל funciona como título divino. “Deus” é a forma mais natural em português e mantém a construção com נְקָמוֹת.
- source_word: נְקָמוֹת
  choice: vingança
  rationale: Embora o hebraico use o plural, aqui ele provavelmente intensifica ou expressa de modo abrangente a retribuição divina. O singular abstrato “vingança” é mais natural em português; a nota preserva a forma plural do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal do texto hebraico em vez de substituí-lo por um título.
- source_word: הוֹפִיעַ
  choice: resplandece
  rationale: O imperativo hifil de יפע pode descrever uma manifestação radiante. “Resplandece” mantém tanto a força imperativa quanto a imagem de uma aparição divina gloriosa.
theological_decisions:
- issue: Linguagem da vingança divina
  choice: Manter “Deus da vingança” sem suavização
  alternative: Deus da justiça; Deus vingador
  rationale: O hebraico associa Deus explicitamente às vinganças ou à retribuição. Substituir o termo por “justiça” eliminaria parte da tensão teológica e interpretaria além dos dados lexicais.
translation_notes:
  register: Português moderno, claro e solene, com vocativo direto e repetição preservada. “Resplandece” mantém a concisão poética e a dimensão epifânica do imperativo hebraico.
