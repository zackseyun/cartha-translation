base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: pt
  text: Ele fará recair sobre eles a maldade deles[a] e, em sua maldade[b], os destruirá. Yahweh, nosso Deus, os destruirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele fez recair sobre eles a maldade deles”. Na poesia, a forma verbal hebraica pode ser entendida com força passada ou futura; אוֹן também pode significar “perversidade”, “delito” ou “má conduta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio da maldade deles” ou “por causa da maldade deles”. A preposição hebraica pode indicar esfera, meio ou fundamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: Ele fará ... recair sobre eles
  rationale: Preserva a imagem causativa de fazer a conduta culpável voltar contra seus autores. O futuro expressa naturalmente, neste contexto poético, a certeza do juízo anunciado.
- source_word: אֶת אוֹנָם
  choice: a maldade deles
  rationale: אוֹן pode indicar maldade, perversidade, delito ou desgraça. Aqui, aquilo que recai sobre os ímpios é sua própria conduta moralmente má; “maldade” comunica isso em português corrente.
- source_word: וּבְרָעָתָם
  choice: e, na própria perversidade deles
  rationale: A formulação mantém aberta a função da preposição ב, que pode indicar esfera, meio ou fundamento, sem decidir se Deus os elimina dentro, por meio ou por causa de sua perversidade.
- source_word: יַצְמִיתֵם ... יַצְמִיתֵם
  choice: os exterminará ... os exterminará
  rationale: צמת no hifil expressa eliminação ou destruição completa. “Exterminará” conserva a força do verbo e sua repetição enfática.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, nosso Deus
  rationale: Translitera o nome divino expresso pelo Tetragrama e traduz diretamente אֱלֹהֵינוּ. A vírgula favorece a leitura natural em português.
theological_decisions:
- issue: Valor temporal de וַיָּשֶׁב na poesia
  choice: 'Declaração de sentido futuro: “Ele fará ... recair”'
  alternative: 'Passado ou perfeito: “Ele fez/fez recair”'
  rationale: Embora a forma seja wayyiqtol, o discurso poético admite valor não narrativo. Os imperfeitos repetidos יַצְמִיתֵם e o contexto de confiança no juízo divino favorecem uma declaração futura, sem negar a alternativa temporal.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico apresenta o nome próprio divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Relação entre a perversidade e a destruição
  choice: “na própria perversidade deles”
  alternative: “por causa da perversidade deles” ou “por meio da perversidade deles”
  rationale: A tradução preserva a tensão sem fixar a preposição ב exclusivamente como causal ou instrumental.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Na própria perversidade deles” conserva deliberadamente a ambiguidade do hebraico; a repetição de “os exterminará” reproduz a ênfase poética do original.
