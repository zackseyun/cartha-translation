  text: אַשְׁרֵ֤י הַ/גֶּ֣בֶר אֲשֶׁר תְּיַסְּרֶ֣/נּוּ יָּ֑הּ וּֽ/מִ/תּוֹרָתְ/ךָ֥ תְלַמְּדֶֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: pt
  text: Feliz é o homem a quem disciplinas, ó Yah,[a] e a quem ensinas a partir da tua lei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico «Yah», forma poética abreviada do nome divino.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «da tua lei». Ou «a partir da tua instrução». O hebraico torá pode significar «lei» ou, de modo mais amplo, «instrução».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula de bem-aventurança hebraica exprime uma condição favorecida e plena, não apenas uma emoção passageira. “Feliz” é natural, digna e tradicional em português.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: O substantivo é masculino singular e apresenta um indivíduo representativo; a tradução conserva essa forma sem excluir seu alcance geral.
- source_word: תְּיַסְּרֶנּוּ
  choice: a quem disciplinas
  rationale: O Piel de יסר indica disciplina corretiva e formativa; “disciplinas” preserva ambas as dimensões em linguagem atual.
- source_word: יָּהּ
  choice: ó Javé
  rationale: יָהּ é a forma poética abreviada do nome divino. Em português, “Javé” comunica com clareza que se trata do nome próprio, enquanto a nota registra a forma hebraica específica.
- source_word: וּמִתּוֹרָתְךָ
  choice: com a tua lei
  rationale: A preposição מן indica a fonte ou o meio do ensino. “Com a tua lei” é idiomático em português e mantém תורה como “lei”, sem negar seu sentido mais amplo de instrução.
- source_word: תְלַמְּדֶנּוּ
  choice: e a quem ensinas
  rationale: A repetição de “a quem” torna clara, em português, a coordenação dos dois verbos regidos pelo único relativo hebraico.
theological_decisions:
- issue: Forma abreviada do nome divino יָהּ
  choice: ó Javé
  alternative: ó Yah; ó SENHOR
  rationale: O texto traz יָהּ, não o tetragrama completo. “Javé” mantém a referência ao nome próprio em português, e a nota preserva a distinção formal sem substituir o nome por um título.
- issue: Alcance de הַגֶּבֶר
  choice: o homem
  alternative: a pessoa
  rationale: Mantém-se o masculino singular do hebraico e sua imagem concreta, reconhecendo que, na bem-aventurança, ele pode representar qualquer pessoa que recebe a disciplina e o ensino divinos.
- issue: Amplitude semântica de תּוֹרָה
  choice: lei
  alternative: instrução
  rationale: “Lei” preserva a designação tradicional e reconhecível, enquanto a nota registra a amplitude do termo hebraico para não restringi-lo indevidamente a legislação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção repete “a quem” para evitar ambiguidade sintática. “Feliz” conserva a forma corrente das bem-aventuranças, e “ó” marca naturalmente a invocação.
