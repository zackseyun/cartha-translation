  text: אַ֭לְמָנָה וְ/גֵ֣ר יַהֲרֹ֑גוּ וִֽ/יתוֹמִ֣ים יְרַצֵּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/006.yaml
  text: They kill the widow and the sojourner[b][a]; they murder the fatherless.
translation:
  language: pt
  text: Matam a viúva e o estrangeiro residente[a]; assassinam os órfãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o imigrante”. O hebraico גֵר se refere a um estrangeiro que reside entre o povo.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “os que não têm pai”. O termo hebraico pode designar órfãos de pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: a viúva
  rationale: O substantivo singular representa genericamente uma classe social vulnerável; o singular com artigo preserva a forma e a força representativa do hebraico.
- source_word: גֵר
  choice: o estrangeiro residente
  rationale: O termo designa um não nativo que vive entre o povo, e não apenas alguém de passagem. A expressão é clara em português e preserva tanto a condição estrangeira quanto a residência local.
- source_word: יַהֲרֹגוּ
  choice: matam
  rationale: Equivalente direto e natural do verbo hebraico comum para matar.
- source_word: יְתוֹמִים
  choice: os órfãos
  rationale: No contexto, o termo identifica pessoas privadas do pai. “Órfãos” é a formulação corrente e inteligível em português, enquanto a nota conserva a especificidade lexical.
- source_word: יְרַצֵּחוּ
  choice: assassinam
  rationale: O verbo רצח expressa morte ilícita e culpável. “Assassinam” mantém essa força moral e distingue o verbo do “matam” anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo conciso. “Estrangeiro residente” evita tanto o sentido vago de “estranho” quanto a ideia de mero viajante; “assassinam” preserva a intensificação lexical do segundo verbo.
