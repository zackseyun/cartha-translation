  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: pt
  text: Pois Yahweh não rejeitará o seu povo[a], nem abandonará a sua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não desamparará” ou “não repudiará”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua possessão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a força explicativa ou fundamentadora da conjunção no contexto e soa natural em português.
- source_word: יִטֹּשׁ
  choice: não rejeitará
  rationale: O verbo pode significar abandonar, repudiar ou rejeitar. “Não rejeitará” comunica de modo claro o afastamento relacional e mantém distinção lexical em relação a יַעֲזֹב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Expressa naturalmente a relação pactual indicada por עַם com o sufixo possessivo.
- source_word: נַחֲלָתוֹ
  choice: a sua herança
  rationale: Preserva a imagem de porção recebida ou possessão atribuída e, no contexto, identifica o povo como herança de Yahweh.
- source_word: יַעֲזֹב
  choice: nem abandonará
  rationale: Traduz o sentido de deixar ou abandonar e preserva o paralelismo sem repetir o verbo da primeira linha.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido pactual de נַחֲלָתוֹ
  choice: a sua herança
  alternative: o seu patrimônio; a sua possessão
  rationale: “Herança” conserva a metáfora pactual do texto, sem especificar além do que o paralelismo com “seu povo” permite.
- issue: Relação entre os dois verbos negativos
  choice: não rejeitará ... nem abandonará
  alternative: não abandonará ... nem deixará
  rationale: A formulação conserva o paralelismo e a sobreposição semântica dos verbos hebraicos, mas também mantém uma distinção perceptível entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça imediatamente após a expressão pertinente.
