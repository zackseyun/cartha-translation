  text: וַ/יְהִ֬י יְהוָ֣ה לִ֣/י לְ/מִשְׂגָּ֑ב וֵ֝/אלֹהַ֗/י לְ/צ֣וּר מַחְסִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: pt
  text: Mas Yahweh se tornou a minha fortaleza[a], e o meu Deus, a rocha do meu refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh tornou-se para mim uma fortaleza”. O hebraico também permite explicitar a ideia de benefício ou relação pessoal com “para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se tornou
  rationale: Expressa o evento passado/perfectivo de היה no contexto, enquanto o restante do verso deixa clara sua relevância presente. Em português, o pretérito perfeito é mais natural que uma construção equivalente ao present perfect inglês.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִי לְמִשְׂגָּב
  choice: a minha fortaleza
  rationale: O לִי marca relação ou benefício pessoal, e מִשְׂגָּב descreve um lugar elevado e seguro. “Minha fortaleza” comunica de modo claro a imagem de proteção defensiva.
- source_word: וֵאלֹהַי
  choice: e o meu Deus
  rationale: Preserva a conjunção e o sufixo de primeira pessoa na confissão paralela do salmista.
- source_word: לְצוּר מַחְסִי
  choice: a rocha em que me refugio
  rationale: Mantém a metáfora de צוּר como rocha firme e protetora e expressa idiomaticamente מַחְסִי como o lugar pessoal de refúgio.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama יְהוָה. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Valor temporal de וַיְהִי
  choice: se tornou
  alternative: tornou-se para mim; foi
  rationale: O pretérito perfeito preserva o aspecto perfectivo do verbo e a ideia de uma realidade experimentada pelo salmista, sem excluir seu resultado presente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “se tornou a minha fortaleza” soa natural; a segunda oração usa aposição para conservar o paralelismo poético. A formulação “a rocha em que me refugio” evita a expressão menos idiomática “a rocha do meu refúgio” sem enfraquecer a metáfora.
