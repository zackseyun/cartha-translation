  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: pt
  text: Julguem em favor do fraco e do órfão; façam justiça ao aflito e ao necessitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: Julguem em favor de
  rationale: 'O imperativo de שׁפט tem sentido judicial: exercer julgamento ou garantir justiça. A expressão portuguesa preserva esse caráter forense e, no contexto, deixa claro que o julgamento deve proteger os vulneráveis.'
- source_word: דַּל
  choice: fraco
  rationale: דַּל pode designar quem é fraco, humilde ou socialmente desamparado; “fraco” preserva a amplitude do termo sem reduzi-lo apenas à pobreza econômica.
- source_word: יָתוֹם
  choice: órfão
  rationale: Equivalente direto e natural para a pessoa privada de proteção parental, figura recorrente de vulnerabilidade social no texto bíblico.
- source_word: עָנִי
  choice: aflito
  rationale: O termo pode indicar pobreza, opressão ou aflição. “Aflito” mantém o aspecto do sofrimento sem duplicar o sentido econômico expresso pelo termo seguinte.
- source_word: רָשׁ
  choice: necessitado
  rationale: רָשׁ designa o pobre ou indigente. “Necessitado” é claro em português moderno e evita repetição excessiva.
- source_word: הַצְדִּיקוּ
  choice: façam justiça a
  rationale: O hifil de צדק, neste contexto judicial, significa declarar ou sustentar como justo, vindicar. “Façam justiça a” comunica a defesa efetiva dos direitos dos aflitos e necessitados sem sugerir que eles sejam moralmente impecáveis.
theological_decisions:
- issue: Sentido de הַצְדִּיקוּ aplicado aos vulneráveis
  choice: façam justiça ao
  alternative: declarem justo o
  rationale: A formulação escolhida preserva o cenário judicial e evita transformar o verso numa afirmação sobre justiça moral intrínseca; o chamado é para reconhecer e defender a causa legítima dos vulneráveis.
translation_notes:
  register: Português atual, digno e acessível, com paralelismo claro entre os dois membros do verso. A formulação mantém a linguagem judicial do hebraico sem soar técnica ou artificial.
