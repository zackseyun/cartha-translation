  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: pt
  text: Contudo, vocês morrerão como qualquer ser humano[a] e cairão como um dos governantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como Adão”, se a expressão for entendida como alusão ao primeiro homem, e não à humanidade em geral.
    reason: alternative_reading
  - marker: b
    text: Ou “príncipes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Contudo
  rationale: Expressa a virada enfática e adversativa entre a condição elevada declarada no versículo anterior e a sentença de mortalidade.
- source_word: כְּאָדָם
  choice: como qualquer ser humano
  rationale: 'אָדָם no singular tem aqui sentido representativo: os destinatários morrerão como os demais seres humanos. A formulação é natural em português e mantém em nota a possível alusão a Adão.'
- source_word: תְּמוּתוּן
  choice: vocês morrerão
  rationale: O imperfeito qal na segunda pessoa masculina plural tem sentido preditivo no contexto do juízo; o futuro simples é claro e atual.
- source_word: וּכְאַחַד
  choice: e ... como um dos
  rationale: Reproduz naturalmente a comparação com um indivíduo pertencente à classe mencionada em seguida.
- source_word: הַשָּׂרִים
  choice: governantes
  rationale: שׂרים designa autoridades de alta posição, como governantes ou príncipes; 'governantes' é amplo, atual e adequado ao contexto de autoridades julgadas.
- source_word: תִּפֹּלוּ
  choice: cairão
  rationale: Preserva a metáfora hebraica da queda ou ruína sob juízo sem explicá-la além do texto.
theological_decisions:
- issue: Sentido de אָדָם em כְּאָדָם
  choice: humanidade em sentido representativo ('como qualquer ser humano')
  alternative: como Adão
  rationale: O contraste imediato é entre a condição elevada dos destinatários e sua mortalidade humana. Como a forma também pode ser entendida como o nome próprio Adão, essa possibilidade é preservada em nota.
- issue: Identidade e natureza da queda dos שׂרים
  choice: não especificar além de 'governantes' e 'cairão'
  alternative: príncipes; interpretar a queda explicitamente como morte ou deposição
  rationale: O hebraico permite mais de uma nuance para שׂרים e mantém metafórica a queda; a tradução evita resolver silenciosamente essas questões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural 'vocês' torna explícita a segunda pessoa plural hebraica. A expressão 'qualquer ser humano' comunica o valor genérico do singular אָדָם sem linguagem artificial, enquanto as notas preservam as alternativas genuínas.
