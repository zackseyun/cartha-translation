  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: pt
  text: Levanta-te, ó Deus; julga a terra, pois tu herdarás todas as nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu possuirás todas as nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Levanta-te
  rationale: O imperativo de קום é um apelo urgente para que Deus intervenha. “Levanta-te” é natural, solene e preserva a imagem verbal do hebraico.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: Os imperativos e o pronome no singular mostram que Deus é o destinatário direto; “ó Deus” expressa adequadamente o vocativo em português.
- source_word: שָׁפְטָה
  choice: julga
  rationale: Preserva tanto a dimensão judicial quanto a régia de שׁפט, sem restringir o sentido a governar ou vindicar.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelo com “todas as nações” favorece o sentido universal, e não o sentido local de uma terra específica.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo claro e conciso a razão que fundamenta o pedido.
- source_word: אַתָּה
  choice: tu
  rationale: Mantém o pronome explícito e enfático do hebraico; o registro de oração e a concordância com “levanta-te” tornam “tu” apropriado.
- source_word: תִנְחַל
  choice: herdarás
  rationale: Preserva o sentido de receber ou tomar como herança, incluindo sua ressonância de posse legítima, sem reduzi-lo ao sentido mais genérico de possuir.
- source_word: בְּכָל הַגּוֹיִם
  choice: todas as nações
  rationale: Com נחל, a expressão indica idiomaticamente o objeto e a extensão universal da herança; o português não requer a reprodução literal da preposição בְּ.
theological_decisions:
- issue: A relação de Deus com as nações em תִנְחַל בְּכָל הַגּוֹיִם
  choice: tu herdarás todas as nações
  alternative: tu possuirás todas as nações
  rationale: A formulação fundamenta o pedido para Deus julgar a terra em seu direito universal sobre as nações. “Herdarás” mantém a imagem bíblica de herança e posse legítima, enquanto a nota registra a leitura semanticamente mais geral.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O vocativo e a segunda pessoa singular preservam o tom direto da oração e mantêm concordância natural em “levanta-te” e “tu herdarás”.
