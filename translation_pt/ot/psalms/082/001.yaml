  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: pt
  text: Salmo de Asafe. Deus está de pé na assembleia divina; no meio dos deuses[a], ele julga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seres divinos”. Alguns entendem “os deuses” neste versículo como juízes ou governantes humanos.
    reason: Leitura alternativa do referente plural de אֱלֹהִים, preservando tanto o provável sentido celestial quanto a interpretação humana tradicional.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo convencional e preciso para o gênero indicado no título.
- source_word: לְאָסָף
  choice: de Asafe
  rationale: Em títulos de salmos, a preposição לְ pode indicar autoria, atribuição ou associação; “de Asafe” é natural e não especifica além do hebraico.
- source_word: אֱלֹהִים (primeira ocorrência)
  choice: Deus
  rationale: O particípio singular נִצָּב e o verbo singular יִשְׁפֹּט identificam o Deus de Israel como sujeito singular.
- source_word: נִצָּב
  choice: está de pé
  rationale: Preserva a imagem de Deus em posição judicial e exprime naturalmente o valor do particípio hebraico.
- source_word: בַּעֲדַת אֵל
  choice: na assembleia divina
  rationale: עֵדָה designa um grupo reunido, e אֵל qualifica aqui a assembleia como divina; a formulação mantém o provável cenário de conselho celestial sem o explicar em excesso.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Conserva a imagem espacial e a distinção entre Deus e o grupo no qual ele exerce julgamento.
- source_word: אֱלֹהִים (segunda ocorrência)
  choice: os deuses
  rationale: Neste ponto, אֱלֹהִים tem sentido plural e designa o grupo em cujo meio Deus julga. A tradução direta preserva a força lexical e a tensão do texto.
- source_word: יִשְׁפֹּט
  choice: ele julga
  rationale: O verbo שׁפט tem aqui sentido judicial; a escolha é clara, concisa e coerente com a cena apresentada.
theological_decisions:
- issue: Referente da segunda ocorrência de אֱלֹהִים
  choice: os deuses
  alternative: os seres divinos; segundo outra interpretação, juízes ou governantes humanos
  rationale: A sintaxe distingue Deus, sujeito singular, de um grupo plural em cujo meio ele julga. O cenário da “assembleia divina” favorece seres celestiais, mas a nota conserva a alternativa tradicional referente a autoridades humanas.
- issue: Sentido de עֲדַת אֵל
  choice: assembleia divina
  alternative: assembleia de Deus; conselho divino
  rationale: A tradução escolhida é idiomática e comunica o provável cenário celestial, sem transformar “assembleia” no termo mais específico “conselho” nem eliminar a ambiguidade da construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a concisão poética, a imagem judicial e a tensão teológica do hebraico.
