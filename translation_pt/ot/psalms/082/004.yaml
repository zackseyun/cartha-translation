  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: pt
  text: Livrem o pobre e o necessitado[a]; resgatem-nos da mão dos perversos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livrem o fraco e o necessitado”. O termo hebraico דַּל pode significar “pobre” ou “fraco”, destacando vulnerabilidade tanto econômica quanto social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Livrem
  rationale: Imperativo plural de פלט, que exige intervenção ativa para pôr pessoas vulneráveis em segurança; “livrem” é natural em português e preserva a força da ordem.
- source_word: דַל
  choice: o pobre
  rationale: דַל pode indicar alguém pobre, fraco ou socialmente vulnerável. Em paralelo com אֶבְיוֹן e no contexto de justiça, “o pobre” expressa bem a dimensão socioeconômica, sem apagar a alternativa lexical.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Designa quem passa necessidade ou vive em privação; “necessitado” mantém distinção semântica em relação a “pobre” e forma uma expressão natural.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva a imagem do idioma hebraico para poder, domínio ou controle. O plural “das mãos” é idiomático em português diante do coletivo “perversos”.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Substantivo adjetival plural que descreve os moralmente culpados e opressores; “perversos” conserva a força ética sem acrescentar especificação de gênero ausente do sentido.
- source_word: הַצִּילוּ
  choice: resgatem
  rationale: Imperativo plural de נצל, usado para retirar alguém do perigo ou do poder hostil. “Resgatem” distingue este verbo de “livrem” e mantém os dois mandamentos paralelos.
theological_decisions:
- issue: Manutenção dos dois imperativos paralelos
  choice: “Livrem ...; resgatem ...”
  alternative: “Livrem o pobre e o necessitado das mãos dos perversos”
  rationale: O hebraico emprega dois imperativos, intensificando o chamado à defesa dos vulneráveis. Preservar ambos mantém a força poética e moral, sem reduzir o verso a uma única ordem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos no plural. A construção conserva o paralelismo hebraico e a metáfora das mãos como domínio, em formulação natural para leitores brasileiros e internacionais.
