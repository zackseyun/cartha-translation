  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: pt
  text: 'Eles não sabem nem entendem;

    andam de um lado para outro na escuridão.

    Todos os fundamentos da terra[b] vacilam[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “são abalados” ou “cedem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do país”, se אָרֶץ for entendido em sentido mais local.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: não sabem
  rationale: O qal de ידע significa normalmente “saber, conhecer”. Embora a forma perfeita possa ter valor passado, aqui descreve um estado presente de ignorância, em paralelo com “não entendem”.
- source_word: וְלֹא יָבִינוּ
  choice: nem entendem
  rationale: O hifil de בין pode significar “entender” ou “discernir”. “Nem entendem” é natural em português e mantém o paralelismo com “não sabem”.
- source_word: בַּחֲשֵׁכָה
  choice: na escuridão
  rationale: A expressão tem sentido locativo e conserva tanto a imagem poética quanto sua possível dimensão moral, sem explicá-la além do texto.
- source_word: יִתְהַלָּכוּ
  choice: andam de um lado para outro
  rationale: O hitpael de הלך pode indicar movimento contínuo ou habitual. A formulação comunica esse vaguear persistente sem tornar explícito um sentido figurado não declarado.
- source_word: יִמּוֹטוּ
  choice: vacilam
  rationale: O nifal de מוט descreve algo que é abalado, oscila ou perde a estabilidade. “Vacilam” preserva a imagem de desestabilização sem afirmar necessariamente um colapso completo.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: todos os fundamentos da terra
  rationale: מוֹסְדֵי designa fundamentos ou bases, e אֶרֶץ pode significar “terra” ou “país”. O contexto poético favorece o alcance cósmico de “terra”, mantendo-se a leitura local em nota.
theological_decisions:
- issue: Alcance de אֶרֶץ e a imagem da desestabilização cósmica
  choice: “terra”, referindo-se à ordem do mundo
  alternative: “país” ou “terra” em sentido local
  rationale: A linguagem do salmo associa a injustiça à instabilidade da ordem criada. “Terra” preserva essa amplitude sem transformar a imagem poética em explicação doutrinária; a possibilidade de sentido local é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Andam de um lado para outro” explicita naturalmente o aspecto contínuo do verbo, e “vacilam” mantém concisão e força imagética. Os marcadores foram colocados junto às palavras às quais suas notas efetivamente se referem.
