  text: עַד מָתַ֥י תִּשְׁפְּטוּ עָ֑וֶל וּ/פְנֵ֥י רְ֝שָׁעִ֗ים תִּשְׂאוּ סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: pt
  text: Até quando vocês julgarão injustamente e favorecerão os ímpios? Selá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levantarão o rosto dos ímpios”, expressão que significa favorecê-los ou tratá-los com parcialidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Interrogação temporal idiomática que introduz uma repreensão; é natural em português e conserva a força do protesto.
- source_word: תִּשְׁפְּטוּ
  choice: vocês julgarão
  rationale: 'O imperfeito na segunda pessoa masculina plural, dentro da pergunta retórica, expressa uma conduta contínua contestada; o futuro em português transmite bem a repreensão: ''até quando continuarão a agir assim?''.'
- source_word: עָוֶל
  choice: injustamente
  rationale: Embora seja formalmente um substantivo, aqui funciona adverbialmente e qualifica o ato de julgar.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: e favorecerão os ímpios
  rationale: A expressão literalmente relacionada a 'levantar o rosto' é um idiomatismo de demonstrar favor; no contexto judicial, 'favorecer' comunica com clareza o tratamento parcial.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Preserva a categoria moral de pessoas culpáveis sem restringi-la indevidamente a uma condenação jurídica formal.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional porque a função exata do termo permanece incerta.
theological_decisions:
- issue: Idiomatismo judicial de favorecer os ímpios
  choice: favorecerão os ímpios
  alternative: mostrarão parcialidade para com os ímpios
  rationale: A escolha preserva a denúncia de julgamento corrupto em português natural, sem acrescentar uma interpretação doutrinária; a nota registra a forma concreta do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural explícito 'vocês' torna clara a segunda pessoa plural. 'Selá' conserva deliberadamente a incerteza do termo hebraico.
