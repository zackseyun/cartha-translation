  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: pt
  text: 'Salmo de Asafe.


    Deus está de pé na assembleia divina; no meio dos deuses[a], ele julga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seres divinos”. Alguns entendem “os deuses” aqui como juízes ou governantes humanos.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Salmo de Asafe
  rationale: Reproduz de modo natural o título hebraico; a construção com לְ pode indicar autoria, associação ou pertencimento à coleção de Asafe, e a formulação portuguesa preserva essa abertura.
- source_word: נִצָּב
  choice: se põe de pé
  rationale: Expressa a postura solene de Deus, que toma seu lugar para presidir e julgar, sem reduzir o verbo simplesmente a 'está'.
- source_word: בַּעֲדַת אֵל
  choice: na assembleia divina
  rationale: A expressão hebraica pode ser entendida literalmente como 'assembleia de Deus' ou 'assembleia de El'; 'assembleia divina' é natural em português e mantém o cenário celestial sugerido pelo paralelismo.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: no meio dos deuses
  rationale: Mantém a forma plural de אֱלֹהִים neste contexto e preserva a tensão interpretativa sobre a identidade desses seres.
- source_word: יִשְׁפֹּט
  choice: ele julga
  rationale: Tradução direta do imperfeito hebraico empregado na cena; o presente português comunica a ação representada de modo vívido.
theological_decisions:
- issue: Identidade dos אֱלֹהִים no segundo hemistíquio
  choice: deuses
  alternative: seres divinos; juízes ou governantes humanos
  rationale: O plural 'deuses' traduz transparentemente a forma hebraica e não decide de modo indevido se os integrantes da assembleia são seres celestiais ou autoridades humanas; a nota registra as principais possibilidades.
- issue: Sentido de עֲדַת אֵל
  choice: assembleia divina
  alternative: assembleia de Deus; assembleia de El
  rationale: A opção escolhida harmoniza-se com o paralelismo sem identificar dogmaticamente a assembleia; as alternativas literais continuam possíveis.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível ao leitor brasileiro e compreensível internacionalmente. A tradução mantém a ambiguidade deliberada do hebraico quanto à assembleia e aos chamados “deuses”.
