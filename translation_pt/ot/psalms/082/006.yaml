  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: pt
  text: 'Eu disse: “Vocês são deuses, e todos vocês são filhos do Altíssimo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Eu disse
  rationale: Reproduz diretamente o pronome enfático e o verbo no perfeito, de modo natural em português.
- source_word: אֱלֹהִים אַתֶּם
  choice: Vocês são deuses
  rationale: Mantém o predicativo plural e a afirmação direta do hebraico, sem resolver no texto a identidade ou a função dos destinatários.
- source_word: וּבְנֵי עֶלְיוֹן כֻּלְּכֶם
  choice: e todos vocês são filhos do Altíssimo
  rationale: Explicita naturalmente em português a cópula subentendida na segunda oração e preserva tanto a totalidade expressa por כֻּלְּכֶם quanto o título divino עֶלְיוֹן.
theological_decisions:
- issue: Identidade dos chamados אֱלֹהִים
  choice: deuses
  alternative: seres divinos; juízes
  rationale: A tradução literal preserva a força e a ambiguidade teológica do hebraico no contexto do salmo, sem impor uma identificação interpretativa específica.
- issue: Relação expressa por בְנֵי עֶלְיוֹן
  choice: filhos do Altíssimo
  alternative: filhos do Deus Altíssimo
  rationale: Mantém a expressão hebraica e o título divino sem acrescentar um substantivo ausente no original.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, amplamente compreensível e natural para leitores brasileiros. A coordenação com “e” acompanha o hebraico e a cópula repetida favorece clareza sem alterar o sentido.
