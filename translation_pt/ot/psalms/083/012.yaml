  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: pt
  text: 'que disseram: “Tomemos posse das pastagens de Deus[a] para nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as moradas de Deus” ou “os lugares onde Deus habita”.
