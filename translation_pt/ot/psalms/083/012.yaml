lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: os quais disseram
  rationale: A oração relativa retoma os inimigos mencionados no contexto anterior; a formulação mantém a ligação sintática e o valor passado do perfeito.
- source_word: נִירֲשָׁה
  choice: Tomemos
  rationale: O verbo ירשׁ pode significar herdar, tomar posse ou desapossar. No contexto hostil, “tomemos” comunica a apropriação pretendida sem sugerir uma herança legítima.
- source_word: לָּנוּ
  choice: para nós
  rationale: A preposição com o pronome da primeira pessoa do plural expressa vantagem e posse em favor dos próprios falantes.
- source_word: נְאוֹת
  choice: pastagens
  rationale: O termo pode designar pastagens, moradas ou lugares habitados. “Pastagens” preserva a imagem concreta, enquanto a nota registra a ambiguidade.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto do salmo identifica o referente como o Deus de Israel, exigindo o singular em português.
theological_decisions:
- issue: Sentido de נְאוֹת אֱלֹהִים
  choice: as pastagens de Deus
  alternative: as moradas de Deus; os lugares onde Deus habita
  rationale: A expressão pode apontar concretamente para terras de pastagem ou, de modo mais amplo, para moradas e territórios pertencentes a Deus. A tradução mantém a imagem concreta sem restringi-la ao templo, e a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com construção poética natural e inteligível tanto no Brasil quanto em outros contextos lusófonos.
