lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: Como o fogo
  rationale: O כְּ comparativo introduz a primeira imagem. “Como o fogo” é natural em português e mantém o paralelismo poético.
- source_word: תִּבְעַר
  choice: incendeia
  rationale: O Qal de בער descreve aqui a ação do fogo sobre a floresta. “Incendeia” expressa de modo corrente e vívido o ato de fazê-la arder.
- source_word: יָעַר
  choice: uma floresta
  rationale: O substantivo designa floresta ou região de mata. O artigo indefinido convém à comparação genérica em português.
- source_word: וּ/כְ/לֶהָבָה
  choice: e como a chama
  rationale: A conjunção e o כְּ comparativo introduzem a imagem paralela. “Chama” corresponde diretamente a לֶהָבָה.
- source_word: תְּלַהֵט
  choice: abrasa
  rationale: O Piel de להט comunica ação intensa de queimar. “Abrasa” preserva essa força sem expandir desnecessariamente o verso.
- source_word: הָרִים
  choice: os montes
  rationale: הָרִים refere-se a elevações ou montanhas e traz artigo definido. “Os montes” é poético, claro e conserva a determinação do hebraico.
