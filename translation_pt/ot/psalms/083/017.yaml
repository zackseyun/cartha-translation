  text: יֵבֹ֖שׁוּ וְ/יִבָּהֲל֥וּ עֲדֵי עַ֗ד וְֽ/יַחְפְּר֥וּ וְ/יֹאבֵֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: pt
  text: Sejam envergonhados e aterrorizados para todo o sempre[a]; sejam humilhados e pereçam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem envergonhados [...] sejam cobertos de vergonha”; o hebraico emprega dois termos de sentido próximo para vergonha e humilhação (בוש e חפר), com nuances ligeiramente diferentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sejam envergonhados
  rationale: O qal imperfeito, com valor volitivo nesta sequência imprecatória, expressa o desejo de que sofram vergonha. A formulação preserva tanto a força passiva/resultativa quanto o paralelismo.
- source_word: וְיִבָּהֲלוּ
  choice: e aterrorizados
  rationale: O nifal de בהל indica ficar perturbado, consternado ou aterrorizado. Neste contexto de juízo contra inimigos, “aterrorizados” comunica adequadamente a intensidade.
- source_word: עֲדֵי עַד
  choice: para todo o sempre
  rationale: A expressão idiomática intensifica a duração. “Para todo o sempre” é natural, solene e preserva essa ênfase.
- source_word: וְיַחְפְּרוּ
  choice: sejam humilhados
  rationale: חפר pertence ao campo semântico da vergonha e da desonra. “Humilhados” mantém uma nuance distinta de יֵבֹשׁוּ e sugere exposição à desonra sem especificação indevida.
- source_word: וְיֹאבֵדוּ
  choice: e pereçam
  rationale: O qal de אבד pode significar perecer ou ser destruído. “Pereçam” conserva o sentido amplo e a força imprecatória sem definir o modo da destruição.
theological_decisions:
- issue: Força imprecatória dos verbos
  choice: Traduzir os imperfeitos como pedidos ou desejos mediante o subjuntivo “sejam” e “pereçam”
  alternative: “Serão envergonhados e aterrorizados para todo o sempre; serão humilhados e perecerão”
  rationale: No contexto, os verbos funcionam como desejos ou petições contra os inimigos de Deus, e não meramente como previsões futuras. O subjuntivo português preserva essa força sem acrescentar paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. O paralelismo hebraico e a progressão imprecatória foram preservados.
