source:
  edition: WLC
  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: pt
  text: Que eles saibam que somente tu, cujo nome é Yahweh[a], és o Altíssimo sobre toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também tradicionalmente vertido como “Jeová” ou substituído pelo título “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Que eles saibam
  rationale: O imperfeito qal com a conjunção, no contexto de oração e pedido dos versos anteriores, é expresso naturalmente em português como desejo ou petição volitiva.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que devem saber.
- source_word: אַתָּה ... לְבַדֶּךָ
  choice: somente tu
  rationale: Preserva a exclusividade enfática de לְבַדֶּךָ em português claro e natural.
- source_word: שִׁמְךָ יְהוָה
  choice: cujo nome é Yahweh
  rationale: A construção apositiva identifica o destinatário pelo nome divino; a oração relativa mantém essa identificação com fluidez.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o Tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: É a forma consagrada, natural e semanticamente adequada para o título divino que expressa supremacia.
- source_word: עַל כָּל הָאָרֶץ
  choice: sobre toda a terra
  rationale: עַל expressa supremacia, e הָאָרֶץ tem aqui alcance universal, abrangendo toda a terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal, enquanto a nota registra formas tradicionais sem substituir o nome por um título no texto principal.
- issue: Alcance da exclusividade de לְבַדֶּךָ
  choice: somente tu ... és o Altíssimo
  alternative: tu, por ti mesmo; só o teu nome é Yahweh
  rationale: A posição e a sintaxe hebraicas vinculam a exclusividade ao destinatário e à sua condição de Altíssimo, não exclusivamente ao nome. A redação portuguesa preserva esse sentido sem eliminar a leve tensão da ordem hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção volitiva “Que eles saibam” mantém o tom de oração, e “somente tu” conserva a ênfase exclusiva sem tornar a frase artificial.
