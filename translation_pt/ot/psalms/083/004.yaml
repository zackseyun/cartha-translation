base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: pt
  text: 'Eles dizem: “Venham, vamos exterminá-los como nação[a], para que o nome de Israel nunca mais seja lembrado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vamos destruí-los, para que deixem de ser uma nação”. A expressão hebraica indica o objetivo de que Israel deixe de existir como povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְרוּ
  choice: Eles dizem
  rationale: O perfeito qal pode indicar fala passada, mas o presente vívido se ajusta ao discurso poético e apresenta como atual a intenção dos inimigos.
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo plural de הלך funciona aqui como exortação idiomática que introduz uma proposta conjunta.
- source_word: וְנַכְחִידֵם
  choice: vamos exterminá-los
  rationale: A forma hifil com sufixo pronominal expressa a intenção de fazê-los desaparecer ou deixar de existir; “exterminá-los” comunica com clareza a força totalizante.
- source_word: מִגּוֹי
  choice: como nação
  rationale: A preposição מן com גוי indica remoção da condição de povo ou nação, não mera expulsão dentre outras nações.
- source_word: וְלֹא יִזָּכֵר
  choice: para que ... nunca mais seja lembrado
  rationale: O nifal preserva o sentido passivo de “ser lembrado”; “para que” explicita a finalidade implícita no contexto sem alterar seu conteúdo.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: o nome de Israel
  rationale: Reproduz naturalmente a cadeia construta e conserva o idioma bíblico de “nome” como identidade e memória.
- source_word: עוֹד
  choice: nunca mais
  rationale: Sob negação, עוד significa “não mais” ou “nunca mais”; esta opção é natural e enfática em português.
