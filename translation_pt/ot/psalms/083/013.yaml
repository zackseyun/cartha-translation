  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: pt
  text: Meu Deus, faze-os como poeira em redemoinho[a], como palha diante do vento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma roda”. O termo hebraico גַּלְגַּל pode designar uma roda ou algo que rola ou rodopia; no texto principal, a imagem foi entendida à luz do paralelo com a palha diante do vento.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico קַשׁ pode referir-se a palha, restolho ou material semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: O substantivo com sufixo de primeira pessoa singular funciona como vocativo. “Meu Deus” preserva o apelo direto sem acrescentar uma interjeição.
- source_word: שִׁיתֵמוֹ
  choice: faze deles
  rationale: O imperativo de שׁית, com objeto plural, pede que Deus os torne semelhantes às imagens seguintes. “Faze deles” é natural, solene e mantém a construção comparativa.
- source_word: כַגַּלְגַּל
  choice: como poeira em redemoinho
  rationale: גַּלְגַּל pode designar uma roda ou algo que gira e rola. No paralelismo com a palha levada pelo vento, a tradução comunica a imagem de matéria leve rodopiando, enquanto a nota preserva a alternativa mais literal.
- source_word: כְּקַשׁ
  choice: como palha
  rationale: קַשׁ designa palha ou restolho. “Palha” é corrente em português e combina naturalmente com a imagem de algo levado pelo vento.
- source_word: לִפְנֵי רוּחַ
  choice: diante do vento
  rationale: A expressão descreve algo impelido pelo vento. “Diante do vento” preserva de perto a formulação hebraica e permanece clara em português poético.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência de oração poética. A forma “faze” conserva um registro bíblico reconhecível sem tornar o verso obscuro; as notas mantêm abertas as alternativas lexicais genuínas do hebraico.
