  text: as tendas de Edom e dos ismaelitas, Moabe e os hagarenos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלֵי
  choice: as tendas de
  rationale: Mantém a imagem concreta do plural em estado construto de אֹהֶל, em vez de substituir metonimicamente as tendas pelos povos que nelas habitavam.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Conserva o nome próprio da nação ou território e forma naturalmente a expressão portuguesa “as tendas de Edom”.
- source_word: יִשְׁמְעֵאלִים
  choice: dos ismaelitas
  rationale: Traduz o gentílico plural derivado de Ismael; a contração “dos” retoma de modo natural “as tendas” e comunica que ambos os grupos dependem da construção hebraica.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Emprega a forma portuguesa consagrada do nome próprio, preservando a forma territorial ou nacional do hebraico, sem convertê-la em gentílico.
- source_word: הַגְרִים
  choice: os hagarenos
  rationale: Emprega o gentílico português tradicional para este povo, correspondente ao hebraico הַגְרִים.
