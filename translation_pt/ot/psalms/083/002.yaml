lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois olha
  rationale: כִּי introduz a razão do apelo anterior, enquanto הִנֵּה chama a atenção para a situação presente; a formulação é clara e natural em português.
- source_word: יֶהֱמָיוּן
  choice: estão em alvoroço
  rationale: O verbo הָמָה descreve agitação ruidosa ou tumulto; esta expressão preserva tanto o movimento quanto o ruído coletivo.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: levantaram a cabeça
  rationale: Mantém a imagem idiomática hebraica de assumir uma postura ousada, desafiadora ou ameaçadora, sem reduzir sua amplitude a uma única interpretação.
theological_decisions:
- issue: Sentido da expressão “levantaram a cabeça”
  choice: Preservar literalmente a metáfora
  alternative: “agiram com arrogância” ou “se rebelaram”
  rationale: O hebraico permite ideias associadas de orgulho, desafio e mobilização hostil; conservar a imagem evita resolver indevidamente essa tensão semântica.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento em segunda pessoa singular coerente com a fala dirigida a Deus. A ordem e o paralelismo poético do hebraico foram preservados com naturalidade.
