source:
  edition: WLC
  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: pt
  text: Faze que os nobres deles sejam como Orebe e Zeebe,[a] e todos os seus príncipes, como Zeba e Zalmuna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orebe e Zeebe eram líderes midianitas derrotados em Juízes 7:25; Zeba e Zalmuna eram reis midianitas derrotados em Juízes 8:5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Faze que ... sejam
  rationale: O imperativo dirige a súplica a Deus. Em português, esta construção expressa naturalmente o sentido de tornar os líderes inimigos semelhantes, em destino, às figuras citadas.
- source_word: נְדִיבֵמוֹ
  choice: os nobres deles
  rationale: נָדִיב designa pessoas proeminentes ou nobres. A escolha mantém a distinção em relação a נְסִיכֵמוֹ no segundo membro.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: como Orebe e Zeebe
  rationale: Os nomes remetem aos líderes midianitas de Juízes 7:25. A preposição comparativa repetida no hebraico pode ser expressa uma só vez de modo natural em português.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: como Zeba e Zalmuna
  rationale: Os nomes próprios remetem aos reis midianitas de Juízes 8:5–21 e seguem formas portuguesas bíblicas reconhecíveis.
- source_word: כָּל
  choice: todos
  rationale: Preserva explicitamente a abrangência da súplica.
- source_word: נְסִיכֵמוֹ
  choice: os seus príncipes
  rationale: נָסִיךְ pode indicar príncipes, chefes ou governantes. “Príncipes” conserva o registro elevado e o paralelismo sem eliminar a distinção lexical com “nobres”.
theological_decisions:
- issue: Alusão histórica na imprecação
  choice: Conservar os nomes das quatro autoridades midianitas como padrão histórico do juízo pedido contra os inimigos atuais.
  alternative: Tratar os nomes apenas como exemplos genéricos de inimigos derrotados.
  rationale: A identificação específica em Juízes 7–8 mostra que o salmo apela para atos anteriores de libertação divina. O texto principal preserva a alusão sem explicar ou suavizar a imprecação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “Faze” como imperativo bíblico corrente e claro; a ordem dos dois pares de líderes segue o paralelismo hebraico.
