  text: Gebal[a], Ammon, and Amalek[b]; Philistia with the inhabitants of Tyre.
translation:
  language: pt
  text: Gebal[a], Amom e Amaleque; a Filístia[b], com os habitantes de Tiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gebal talvez se refira à cidade fenícia conhecida como Biblos.
    reason: cultural_note
  - marker: b
    text: Ou “os filisteus”, caso o nome da região seja entendido como referência aos seus habitantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבָל
  choice: Gebal
  rationale: Nome próprio transliterado de acordo com a forma hebraica; a identificação histórica com Biblos é possível, mas não deve substituir silenciosamente o nome do texto.
- source_word: וְעַמּוֹן
  choice: Amom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo ou território.
- source_word: וַעֲמָלֵק
  choice: Amaleque
  rationale: Forma portuguesa tradicional do nome nacional próprio.
- source_word: פְּלֶשֶׁת
  choice: a Filístia
  rationale: O termo hebraico designa formalmente a terra ou região, embora no contexto possa representar metonimicamente seus habitantes.
- source_word: עִם
  choice: com
  rationale: Equivalente direto e natural da preposição que liga o último grupo à enumeração.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: os habitantes de Tiro
  rationale: Reproduz com clareza a construção hebraica que significa literalmente os que habitam em Tiro.
- source_word: צֽוֹר
  choice: Tiro
  rationale: Forma portuguesa consagrada do nome geográfico hebraico.
