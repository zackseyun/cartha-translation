lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: O substantivo designa uma composição cantada. «Cântico» é natural, digno e tradicional nos títulos dos salmos, além de distingui-lo de מִזְמוֹר.
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo técnico frequente nos títulos do Saltério; «salmo» preserva seu sentido reconhecido de composição poético-musical.
- source_word: לְ/אָסָף
  choice: de Asafe
  rationale: A preposição לְ pode indicar autoria, associação ou dedicação. «De Asafe» é a formulação mais idiomática nos títulos dos salmos e mantém aberta a natureza exata da relação.
