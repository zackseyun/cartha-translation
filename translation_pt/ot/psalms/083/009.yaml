base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: pt
  text: Faze com eles como fizeste com Midiã[a], como com Sísera, como com Jabim, junto ao ribeiro de Quisom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Faze com eles como com Midiã, como com Sísera, como com Jabim”. O texto principal explicita o verbo subentendido na comparação hebraica.'
    reason: lexical_alternative
  - marker: b
    text: Veja Juízes 4:7, 13; 5:21, sobre a derrota de Sísera e Jabim junto ao Quisom.
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Faze com eles
  rationale: O imperativo de עשה com ל mantém o pedido direto para que Deus aja com eles; em português, “fazer com alguém” é natural e evita explicitar “contra”, embora o contexto seja hostil.
- source_word: כְּמִדְיָן
  choice: como fizeste com Midiã
  rationale: O כ comparativo aponta para Midiã como precedente histórico. A explicitação de “fizeste” torna a elipse hebraica clara em português, sem acrescentar uma ação específica.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: como com Sísera e Jabim
  rationale: Preserva o paralelismo elíptico e reúne naturalmente em português os dois nomes ligados ao mesmo episódio.
- source_word: בְּנַחַל קִישׁוֹן
  choice: junto ao ribeiro de Quisom
  rationale: נחל pode designar ribeiro, torrente ou leito sazonal; “ribeiro” é claro e tradicional para esse curso de água, e בְּ recebe aqui sentido locativo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas consagradas dos nomes próprios. “Faze” preserva o tom direto de oração; a elipse dos últimos comparativos foi mantida de modo natural.
