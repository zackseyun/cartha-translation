  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: pt
  text: Enche o rosto deles de vergonha[a], para que busquem o teu nome, ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que busquem o teu nome”; o verbo hebraico pode ser entendido como simples continuação, embora aqui provavelmente expresse propósito ou resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Enche
  rationale: Imperativo piel masculino singular de מלא, dirigido a Deus. “Enche” reproduz diretamente a ação e mantém a imagem hebraica.
- source_word: פְנֵיהֶם
  choice: o rosto deles
  rationale: Embora a forma hebraica seja plural, em português a expressão distributiva no singular é mais natural e continua indicando o rosto de cada um.
- source_word: קָלוֹן
  choice: vergonha
  rationale: קָלוֹן denota vergonha, desonra ou humilhação. “Vergonha” é clara e preserva tanto a dimensão pública quanto a experiência de desonra.
- source_word: וִיבַקְשׁוּ
  choice: para que busquem
  rationale: O imperfeito com conjunção após um imperativo pode indicar propósito ou resultado. “Para que busquem” expressa essa relação provável sem garantir que a busca de fato ocorrerá.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Tradução direta que preserva o sentido bíblico do nome como identidade e reputação reveladas de Deus, sem explicitação interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Finalidade do juízo divino
  choice: A vergonha pedida é apresentada como tendo por finalidade que os inimigos busquem o nome de Yahweh.
  alternative: “E que busquem o teu nome”, entendendo a oração como simples continuação ou sequência.
  rationale: A construção hebraica após o imperativo provavelmente tem valor de propósito ou resultado. A tradução mantém a tensão entre juízo e possível busca de Deus, sem converter essa busca em arrependimento garantido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a imagem concreta do hebraico e usa “Yahweh” para o Tetragrama.
