  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: pt
  text: Assim, persegue-os com a tua tempestade e aterroriza-os com o teu vendaval.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Desse modo, persegue-os com a tua tormenta e, com o teu redemoinho, aterroriza-os.”'
    reason: Alternativas lexicais para כֵּן, סַעַר e סוּפָה, preservando o paralelismo poético.
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Retoma a imagem anterior e expressa o modo desejado da ação; é conciso e natural em português.
- source_word: תִּרְדְּפֵם
  choice: persegue-os
  rationale: רדף significa normalmente perseguir ou ir no encalço; “persegue-os” preserva tanto a força marcial quanto a poética.
- source_word: בְּסַעֲרֶךָ
  choice: com a tua tempestade
  rationale: A preposição tem sentido instrumental neste contexto, e סַעַר designa uma tempestade ou agitação violenta.
- source_word: וּבְסוּפָתְךָ
  choice: com o teu vendaval
  rationale: סוּפָה indica uma tormenta violenta, muitas vezes um vento tempestuoso; “vendaval” mantém a distinção poética em relação a סַעַר sem perder a intensidade.
- source_word: תְבַהֲלֵם
  choice: aterroriza-os
  rationale: No piel, בהל comunica causar pavor, alarme ou perturbação intensa; “aterroriza-os” preserva sua força causativa.
theological_decisions:
- issue: Ação divina na poesia imprecatória
  choice: Manter a súplica direta para que Deus persiga e aterrorize os inimigos.
  alternative: “Que os persigas com a tua tempestade e os aterrorizes com o teu vendaval.”
  rationale: Os imperfeitos hebraicos, no contexto de oração, têm força volitiva semelhante à do jussivo. O imperativo em português comunica de modo natural a petição direta do salmista, sem suavizar a tensão do pedido de juízo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo e diferencia os dois termos hebraicos relativos à tormenta.
