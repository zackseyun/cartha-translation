translation:
  language: pt
  text: Ó Deus[a], não fiques em silêncio; não te cales[b] nem permaneças quieto, ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega dois títulos divinos diferentes neste versículo: אֱלֹהִים (Elohim, «Deus») no início e אֵל (El, «Deus», possivelmente «Poderoso») no fim.'
    reason: lexical_alternative
  - marker: b
    text: Ou «não te mostres surdo». O verbo hebraico pode referir-se tanto a calar-se quanto a mostrar-se surdo ou sem resposta.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ó Deus
  rationale: Vocativo em uma súplica. «Ó Deus» é natural, digno e preserva o endereço direto.
- source_word: אַל דֳּמִי לָךְ
  choice: não fiques em silêncio
  rationale: A expressão pede que Deus não permaneça silencioso ou inativo. Esta formulação conserva a imagem e a urgência da oração.
- source_word: אַל תֶּחֱרַשׁ
  choice: não te cales
  rationale: חרשׁ pode exprimir silêncio e, em certos contextos, surdez. Aqui, no paralelismo, «não te cales» é a leitura contextual mais segura; a possível nuance de não se mostrar surdo é indicada em nota.
- source_word: וְאַל תִּשְׁקֹט
  choice: nem permaneças quieto
  rationale: שׁקט comunica quietude, repouso ou inatividade. «Permaneças quieto» distingue este membro dos dois anteriores e mantém a progressão poética.
- source_word: אֵל
  choice: ó Deus
  rationale: Título divino que encerra o verso. A tradução natural é «Deus»; a distinção lexical em relação a אֱלֹהִים é registrada em nota.
theological_decisions:
- issue: Distinção entre os títulos divinos אֱלֹהִים e אֵל
  choice: Traduzir ambos por «Deus» e registrar a diferença em nota
  alternative: Traduzir אֵל por «Poderoso»
  rationale: «Deus» é a forma natural em português para ambos neste vocativo. «Poderoso» preservaria uma possível nuance, mas a tornaria mais explícita do que o contexto exige.
- issue: Nuance de תֶּחֱרַשׁ
  choice: «não te cales» no texto, com alternativa em nota
  alternative: «não te mostres surdo»
  rationale: O campo semântico permite silêncio e surdez. O paralelismo favorece o silêncio, sem eliminar totalmente a ideia de aparente falta de resposta; por isso, a ambiguidade é documentada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é reverente e poético sem arcaísmo. A coordenação «não te cales nem permaneças quieto» representa os dois verbos hebraicos finais, evitando omitir um membro do paralelismo.
