translation:
  language: pt
  text: Até a Assíria se uniu a eles; ela se tornou um braço para os filhos de Ló.[a] Selá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos de Ló” refere-se aos povos descendentes de Ló, especialmente Moabe e Amom.
    reason: cross_reference
  - marker: b
    text: O sentido e a função exatos de “Selá” são incertos; talvez seja uma indicação musical ou litúrgica.
    reason: textual_or_semantic_uncertainty
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: Neste contexto, a partícula acrescenta a Assíria com força enfática à coalizão já enumerada; “até” transmite essa inclusão surpreendente melhor que o simples “também”.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: No contexto geopolítico do salmo, designa a entidade nacional conhecida em português como Assíria.
- source_word: נִלְוָה
  choice: se uniu
  rationale: O nifal de לוה expressa associação ou união. “Se uniu” é natural em português e não explicita além do necessário a natureza da aliança.
- source_word: עִמָּם
  choice: a eles
  rationale: Tradução natural da preposição עם com sufixo masculino plural, retomando os povos mencionados anteriormente.
- source_word: הָיוּ
  choice: tornaram-se
  rationale: O verbo היה admite tanto valor estático (“foram”) como ingressivo (“tornaram-se”); aqui, o segundo exprime naturalmente o papel assumido como apoio da coalizão.
- source_word: זְרוֹעַ
  choice: um braço
  rationale: Preserva a metáfora hebraica do braço como força ou apoio, especialmente de caráter militar.
- source_word: לִבְנֵי לוֹט
  choice: para os filhos de Ló
  rationale: Mantém o idioma genealógico hebraico, que se refere aos povos descendentes de Ló, sem substituir a expressão pela interpretação.
- source_word: סֶלָה
  choice: Selá
  rationale: A transliteração tradicional preserva a incerteza quanto ao sentido ou à função exata do termo.
