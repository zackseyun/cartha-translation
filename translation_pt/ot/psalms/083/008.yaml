  register: Português moderno, claro e digno, com legibilidade brasileira. A metáfora concreta “um braço” e o idioma genealógico “filhos de Ló” foram preservados. A colocação do marcador [a] segue imediatamente a expressão explicada; [b] esclarece a transliteração “Selá”.
