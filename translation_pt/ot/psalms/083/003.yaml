  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: pt
  text: Contra o teu povo fazem planos astutos e consultam entre si contra os que guardas em segurança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus escondidos” ou “os que são preciosos para ti”. O hebraico pode se referir àqueles que são ocultados ou guardados em segurança e, por extensão, aos que são preciosos para Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: tramam astutamente
  rationale: A combinação do hifil de ערם com סוֹד descreve deliberação ardilosa ou secreta. “Tramam astutamente” é natural em português e comunica tanto a intenção hostil quanto a ideia de um plano elaborado em segredo.
- source_word: וְיִתְיָעֲצוּ
  choice: conspiram
  rationale: O hitpael de יעץ indica consulta recíproca. Neste contexto explicitamente hostil, “conspiram” exprime de modo conciso o conselho conjunto, sem acrescentar um objetivo além do ataque já indicado.
- source_word: עַל עַמְּךָ
  choice: contra o teu povo
  rationale: Com os verbos hostis do contexto, עַל indica oposição e corresponde naturalmente a “contra”.
- source_word: צְפוּנֶיךָ
  choice: os que guardas em segurança
  rationale: A forma derivada de צפן pode designar aqueles que estão escondidos, guardados ou entesourados. A escolha preserva em português a noção concreta de proteção sem excluir a ideia de que são preciosos para Deus.
theological_decisions:
- issue: Sentido de צְפוּנֶיךָ em relação ao povo de Deus
  choice: os que guardas em segurança
  alternative: os teus entesourados; os teus escondidos
  rationale: O hebraico permite entender a expressão como referência aos que Deus mantém ocultos ou protegidos e, por extensão, aos que ele considera preciosos. O texto principal destaca a proteção, enquanto a nota preserva a ambiguidade lexical e relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal e vocabulário naturais para leitores brasileiros. O paralelismo poético foi mantido de forma concisa.
