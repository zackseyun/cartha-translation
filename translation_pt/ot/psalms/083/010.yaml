  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: pt
  text: Foram destruídos em En-Dor[a]; tornaram-se esterco para o solo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto a En-Dor” ou “perto de En-Dor”. A preposição hebraica admite mais de uma relação locativa com o nome do lugar.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficaram como esterco sobre o solo”. O hebraico diz literalmente “tornaram-se esterco para o solo”, imagem de cadáveres reduzidos a matéria desprezível ou adubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: foram destruídos
  rationale: O nifal perfeito de שׁמד expressa sofrer destruição ou ser eliminado. “Foram destruídos” preserva a voz passiva e o sentido resultante sem intensificação indevida.
- source_word: בְּעֵין דֹּאר
  choice: em En-Dor
  rationale: A preposição בְּ tem valor locativo diante do topônimo עֵין דֹּאר. “Em En-Dor” é natural em português, enquanto a nota preserva outras relações locativas possíveis.
- source_word: הָיוּ
  choice: tornaram-se
  rationale: Neste enunciado com substantivo predicativo, היה pode indicar a passagem a um estado resultante; “tornaram-se” comunica essa nuance melhor que o simples “foram”.
- source_word: דֹּמֶן
  choice: esterco
  rationale: O substantivo designa excremento ou esterco. “Esterco” conserva a imagem concreta de humilhação e de cadáveres deixados como matéria desprezível.
- source_word: לָאֲדָמָה
  choice: para o solo
  rationale: אֲדָמָה designa o chão ou solo, e לְ estabelece aqui uma relação de destinação ou resultado. “Para o solo” acompanha de perto a formulação hebraica sem excluir o sentido contextual de esterco deixado sobre a terra.
