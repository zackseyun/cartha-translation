  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: pt
  text: Pois, de comum acordo, conspiram; contra ti fazem uma aliança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cortam uma aliança contra ti».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do apelo no contexto e preserva naturalmente a força explicativa.
- source_word: נוֹעֲצוּ
  choice: conspiram
  rationale: O nifal de יעץ indica deliberação conjunta; o contexto hostil favorece «conspiram», sem perder a ideia de planejamento mútuo.
- source_word: לֵב יַחְדָּו
  choice: de comum acordo
  rationale: Expressa com clareza atual a unidade de intenção indicada literalmente por «coração juntamente», evitando uma formulação pouco natural em português.
- source_word: עָלֶיךָ
  choice: contra ti
  rationale: No contexto de deliberação hostil e formação de pacto, על tem sentido adversativo.
- source_word: בְּרִית יִכְרֹתוּ
  choice: fazem uma aliança
  rationale: כרת ברית é literalmente «cortar uma aliança». «Fazer uma aliança» comunica naturalmente o pacto vinculante e hostil neste contexto.
theological_decisions:
- issue: Natureza do pacto dirigido contra Deus
  choice: contra ti fazem uma aliança
  alternative: contra ti firmam uma aliança
  rationale: Mantém explícita a oposição a Deus e o caráter formal do acordo, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com tratamento singular «ti» dirigido a Deus. «De comum acordo» preserva a unidade de intenção do hebraico de modo mais idiomático que «com um só coração» neste contexto.
