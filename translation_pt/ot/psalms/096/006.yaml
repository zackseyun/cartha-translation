lexical_decisions:
- source_word: הוֹד
  choice: esplendor
  rationale: Expressa magnificência imponente e forma um par poético natural com הָדָר, sem fundir os dois termos.
- source_word: הָדָר
  choice: majestade
  rationale: Preserva o sentido régio e elevado do termo e o distingue de הוֹד.
- source_word: לְפָנָיו
  choice: estão diante dele
  rationale: Mantém diretamente a imagem espacial e presencial do hebraico; o verbo é suprido naturalmente em português.
- source_word: עֹז
  choice: força
  rationale: É uma tradução clara e corrente para a ideia de vigor ou poder e equilibra poeticamente תִפְאֶרֶת.
- source_word: תִפְאֶרֶת
  choice: beleza
  rationale: Representa a dimensão estética possível do termo e evita repetir o campo semântico de esplendor e majestade; a nota registra alternativas legítimas.
- source_word: בְּמִקְדָּשׁוֹ
  choice: no seu santuário
  rationale: Preserva a referência geral ao espaço sagrado sem especificá-lo excessivamente como templo.
theological_decisions:
- issue: Referente dos sufixos pronominais
  choice: Os pronomes se referem ao SENHOR conforme o contexto, sem substituir os pronomes pelo nome divino.
  alternative: Explicitar “diante do SENHOR” e “no santuário do SENHOR”.
  rationale: O contexto identifica claramente o referente, enquanto a manutenção dos pronomes preserva o fluxo poético e a forma do hebraico.
