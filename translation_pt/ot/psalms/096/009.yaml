  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: pt
  text: Adorem Yahweh no esplendor da santidade[a]; tremam diante dele, toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vestes sagradas” ou “em santo esplendor”. A expressão hebraica pode se referir tanto ao esplendor próprio da santidade quanto ao adorno ou às vestes sagradas usados na adoração.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Adorem
  rationale: O verbo descreve o ato de curvar-se ou prostrar-se em reverência. “Adorem” comunica naturalmente, em português, o sentido cultual do imperativo, sem excluir o gesto corporal implícito.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, preservando sua função no texto hebraico.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  rationale: Mantém a formulação poética e abrangente do hebraico, no qual הֲדָרָה pode indicar esplendor, beleza ou adorno, sem decidir se a expressão descreve a santidade ou trajes sagrados.
- source_word: חִילוּ
  choice: tremam
  rationale: O verbo pode indicar tremor, agitação ou temor intenso. “Tremam” conserva a força corporal e reverente da convocação.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: Expressão portuguesa natural para a ideia hebraica de estar perante a face ou presença de alguém.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Embora literalmente seja “toda a terra”, o imperativo plural dirige-se aos seus habitantes. A explicitação produz português natural e evita atribuir literalmente à massa terrestre a ação de tremer.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama como nome pessoal. “Yahweh” o representa em vez de substituí-lo por um título.
- issue: Sentido de בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  alternative: com trajes sagrados / em santo esplendor
  rationale: A construção pode indicar o esplendor próprio da santidade ou o adorno sagrado dos adoradores. O texto principal mantém a leitura poética mais ampla, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com forma verbal plural sem pronome expresso. “Todos os habitantes da terra” explicita o referente humano implícito na personificação hebraica; a ambiguidade da expressão sobre santidade e adorno é preservada em nota.
