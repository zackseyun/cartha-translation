  source_fidelity: 'A tradução representa fielmente o hebraico: o imperativo plural é preservado em “Digam”; בַגּוֹיִם é bem expresso por “entre as nações”; o qatal מָלָךְ recebe a leitura presente idiomática “Yahweh reina”, com a ambiguidade aspectual devidamente registrada em nota. “De fato” transmite adequadamente a força confirmatória de אַף. “Está firmemente estabelecido; não será abalado” reproduz a segurança da ordem do mundo, e “Ele julgará os povos com equidade” mantém tanto o futuro de יָדִין como o sentido judicial de בְּמֵישָׁרִים.'
