source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: pt
  text: 'Digam entre as nações: “Yahweh reina![a] De fato, o mundo[b] está firmemente estabelecido; não será abalado. Ele julgará os povos com equidade.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh é rei” ou “Yahweh tornou-se rei”. O hebraico pode ser entendido como proclamação da realeza presente ou da entronização.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o mundo habitado”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com retidão” ou “com justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Digam
  rationale: O imperativo plural de אמר convoca os ouvintes a comunicar publicamente a mensagem; “Digam” é direto e natural, enquanto “entre as nações” deixa claro o âmbito público.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: ב com גּוֹיִם indica o meio ou âmbito em que a proclamação deve ser feita. “Nações” preserva o alcance internacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מָלָךְ
  choice: reina
  rationale: Neste contexto de proclamação régia, o qatal pode declarar a realeza presente de Yahweh. A nota preserva as possibilidades “é rei” e “tornou-se rei”.
- source_word: אַף
  choice: De fato
  rationale: Expressa a continuação enfática e confirmatória que liga o reinado de Yahweh à estabilidade do mundo.
- source_word: תִּכּוֹן
  choice: está firmemente estabelecido
  rationale: O nifal de כון comunica o estado resultante de ter sido estabelecido ou firmado; a formulação mantém essa força resultativa.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תֵּבֵל designa frequentemente o mundo como ordem habitada. “O mundo” é natural em português, com a nuance mais explícita registrada em nota.
- source_word: בַּל תִּמּוֹט
  choice: não será abalado
  rationale: מוֹט no nifal descreve ser sacudido ou deslocado de uma posição firme; “abalado” comunica bem a imagem de estabilidade.
- source_word: יָדִין
  choice: Ele julgará
  rationale: דין pode abranger julgar e governar. No contexto do reinado divino e da ordem moral, “julgará” preserva diretamente o sentido judicial.
- source_word: עַמִּים
  choice: os povos
  rationale: Mantém o plural coletivo e preserva a variação lexical em relação a גּוֹיִם, anteriormente traduzido por “nações”.
- source_word: בְּמֵישָׁרִים
  choice: com equidade
  rationale: מֵישָׁרִים expressa retidão, justeza ou equidade. “Com equidade” é natural no contexto judicial e comunica julgamento justo e imparcial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Aspecto de מָלָךְ na proclamação de entronização
  choice: Yahweh reina
  alternative: Yahweh é rei; Yahweh tornou-se rei
  rationale: O perfeito hebraico pode funcionar como declaração presente do reinado ou receber nuance ingressiva. O texto principal usa a leitura idiomática presente, e a nota conserva a ambiguidade sem determinar quando a realeza começou.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados sem rigidez artificial; “firmemente estabelecido” explicita a força resultativa do hebraico, e as notas mantêm as ambiguidades lexical e aspectual relevantes.
