  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: pt
  text: Alegrem-se os céus, e exulte a terra; troveje o mar[a] e tudo o que nele há.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ruja o mar».'
    reason: Alternativa lexical para יִרְעַם, que pode descrever tanto o trovejar quanto o rugido estrondoso do mar.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Alegrem-se
  rationale: O imperfeito qal de שׂמח tem valor volitivo nesta sequência poética de convocação ao louvor; a forma com «-se» expressa isso naturalmente em português.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: O plural preserva o alcance cósmico e o registro poético do hebraico.
- source_word: וְתָגֵל
  choice: e exulte
  rationale: גיל indica alegria intensa ou exultação. «Exulte» mantém a distinção poética em relação a שׂמח sem perder clareza.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto cósmico formado por céus, terra e mar, «terra» é preferível a «país» ou «território».
- source_word: יִרְעַם
  choice: troveje
  rationale: רעם descreve o trovejar ou um estrondo forte. «Troveje» conserva tanto a voz poderosa do mar personificado quanto a ressonância de tempestade do verbo.
- source_word: הַיָּם
  choice: o mar
  rationale: Equivalente português comum e adequado ao paralelismo cósmico.
- source_word: וּמְלֹאוֹ
  choice: e tudo o que nele há
  rationale: Literalmente, «e sua plenitude»; a expressão designa tudo o que o mar contém. A formulação escolhida comunica o idioma hebraico com naturalidade.
theological_decisions:
- issue: Valor volitivo dos imperfeitos poéticos
  choice: 'Entender a sequência como convocação: «Alegrem-se… exulte… troveje».'
  alternative: 'Entendê-la como previsão futura: «Os céus se alegrarão… a terra exultará… o mar trovejará».'
  rationale: O contexto do salmo convoca toda a criação ao louvor, e os imperfeitos hebraicos nesta sequência paralela têm naturalmente força jussiva ou volitiva. A tradução evita transformar a convocação em simples previsão.
translation_notes:
  register: Português moderno, poético e dignificado, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A inversão moderada em «Alegrem-se os céus» preserva a cadência da convocação sem soar arcaica.
