id: PSA.96.4
reference: Psalms 96:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: pt
  text: Pois Yahweh é grande e muito digno de louvor; ele deve ser temido acima de todos os deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Deuses” pode referir-se às divindades das nações; o versículo seguinte as identifica como ídolos sem valor.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado à adoração no contexto e mantém de modo natural o valor explicativo da conjunção.
- source_word: גָדוֹל
  choice: grande
  rationale: Expressa grandeza, majestade e posição, sem restringir o sentido apenas ao poder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּמְהֻלָּל מְאֹד
  choice: e muito digno de louvor
  rationale: O particípio passivo significa literalmente algo como 'muito louvado'. A formulação escolhida é idiomática em português e comunica que Yahweh merece louvor em grau máximo.
- source_word: נוֹרָא הוּא
  choice: ele deve ser temido
  rationale: Preserva a ideia de que Yahweh inspira temor reverente, evitando o sentido moderno mais fraco que 'impressionante' poderia assumir.
- source_word: עַל כָּל אֱלֹהִים
  choice: acima de todos os deuses
  rationale: A preposição exprime superioridade, e 'deuses' conserva a referência direta do hebraico às divindades das nações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original traz o nome pessoal divino; sua transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de אֱלֹהִים neste contexto
  choice: deuses
  alternative: ídolos
  rationale: O versículo diz literalmente 'deuses'. O versículo seguinte os caracteriza como entidades sem valor, mas antecipar aqui 'ídolos' resolveria interpretativamente uma tensão que o texto mantém.
- issue: Força de נוֹרָא
  choice: deve ser temido
  alternative: é temível
  rationale: A escolha expressa que Yahweh inspira temor reverente e mantém a dimensão cultual da afirmação, sem reduzir o termo a mera admiração.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Muito digno de louvor” oferece naturalidade sem perder a intensidade de מְאֹד; “deve ser temido” conserva a força do temor reverente.
