  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: pt
  text: Exulte o campo e tudo o que nele há; então todas as árvores da floresta cantarão de alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “darão gritos de alegria”. O verbo hebraico pode indicar um brado vibrante de júbilo; “cantarão de alegria” foi adotado por combinar com a personificação poética das árvores.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Exulte
  rationale: O imperfeito hebraico tem força volitiva neste contexto poético. O presente do subjuntivo preserva a convocação e o tom elevado, além da intensa alegria expressa pelo verbo.
- source_word: שָׂדַי
  choice: o campo
  rationale: Embora formalmente singular, o termo tem sentido coletivo. “O campo” é natural em português e mantém a personificação poética.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: e tudo o que nele há
  rationale: Reproduz de modo claro e próximo ao hebraico a totalidade do que está no campo.
- source_word: אָז
  choice: então
  rationale: Marca de modo conciso a progressão para o movimento poético seguinte.
- source_word: יְרַנְּנוּ
  choice: cantarão de alegria
  rationale: O piel pode indicar um brado vibrante de júbilo. “Cantarão de alegria” convém à personificação das árvores e preserva o caráter celebrativo.
- source_word: כָּל עֲצֵי יָעַר
  choice: todas as árvores da floresta
  rationale: Mantém a abrangência de כָּל e traduz naturalmente a construção hebraica.
theological_decisions:
- issue: Personificação da criação em louvor
  choice: Manter diretamente a personificação poética do campo e das árvores.
  alternative: Parafrasear como descrição metafórica da beleza ou abundância da natureza.
  rationale: O salmo apresenta explicitamente a criação não humana participando da resposta jubilosa. A tradução conserva essa imagem e sua amplitude teológica sem explicá-la além do texto.
translation_notes:
  register: Português moderno, claro e solene, com construção poética natural e legível no Brasil. O subjuntivo “Exulte” conserva a força de convocação; o futuro “cantarão” acompanha a progressão marcada por “então”.
