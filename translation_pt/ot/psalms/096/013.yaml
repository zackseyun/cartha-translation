  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: pt
  text: diante de Yahweh, pois ele vem, pois vem julgar a terra. Julgará o mundo com justiça e os povos com sua fidelidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: diante de
  rationale: A locução traduz naturalmente o sentido espacial e relacional de estar perante alguém, além de se ligar bem ao contexto do versículo anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי בָא ... כִּי בָא
  choice: pois ele vem, pois vem
  rationale: O perfeito hebraico tem aqui força vívida e iminente. O presente em português comunica bem essa chegada certa, e a repetição poética é preservada.
- source_word: לִשְׁפֹּט
  choice: julgar
  rationale: Embora o verbo possa incluir a ideia de governar, as expressões seguintes destacam a avaliação justa; “julgar” mantém o sentido judicial sem ampliá-lo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelo com תֵּבֵל indica alcance universal, não uma terra regional específica.
- source_word: יִשְׁפֹּט
  choice: julgará
  rationale: O imperfeito, após o anúncio de que Yahweh vem, expressa naturalmente a ação futura em português.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: O termo designa o mundo habitado e ordenado; “mundo” é o equivalente português mais natural no paralelismo poético.
- source_word: בְּצֶדֶק
  choice: com justiça
  rationale: צֶדֶק expressa retidão e justiça. Neste contexto de julgamento, “com justiça” é idiomático e comunica claramente a conformidade do juízo com o que é reto.
- source_word: וְעַמִּים
  choice: e os povos
  rationale: O plural עַמִּים ressalta os diversos povos coletivamente; “povos” preserva essa forma com precisão.
- source_word: בֶּאֱמוּנָתוֹ
  choice: com sua fidelidade
  rationale: אֱמוּנָה denota firmeza, confiabilidade e fidelidade. A escolha apresenta o julgamento de Deus como seguro e coerente com seu caráter.
theological_decisions:
- issue: Natureza do julgamento divino no contexto poético
  choice: Manter a linguagem de “julgar” sem reduzi-la a “governar” nem expandi-la em uma formulação completa sobre o juízo final.
  alternative: Traduzir por “governar” para realçar a realeza, ou explicitar interpretativamente um juízo escatológico final.
  rationale: O texto anuncia que Yahweh vem julgar em escala universal, mas não define aqui todos os aspectos desse acontecimento; a tradução preserva essa tensão.
- issue: Representação de יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva no texto o nome pessoal hebraico, sem substituí-lo por um título nem adotar outra forma tradicional.
- issue: Relação entre justiça e fidelidade no juízo
  choice: Preservar as duas qualidades paralelas como “justiça” e “fidelidade”.
  alternative: Nivelar ambas como referências genéricas à verdade ou à equidade.
  rationale: Os dois substantivos hebraicos são distintos e, juntos, descrevem o caráter reto e confiável do julgamento divino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem poética natural. A repetição “pois ele vem, pois vem” mantém a ênfase hebraica sem soar excessivamente pesada. Não foram incluídas notas, pois as alternativas lexicais não são necessárias para compreender a ambiguidade relevante do verso.
