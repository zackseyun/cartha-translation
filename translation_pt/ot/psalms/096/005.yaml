source:
  edition: WLC
  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: pt
  text: Pois todos os deuses dos povos são ídolos[a], mas Yahweh[b] fez os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coisas sem valor”. O termo hebraico para “ídolos” pode transmitir a ideia polêmica de nulidade ou falta de valor.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a convocação anterior e preserva de modo natural a ligação argumentativa do hebraico.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: todos os deuses dos povos
  rationale: Mantém a abrangência de כָּל, traduz אֱלֹהֵי diretamente como “deuses” e conserva “povos” como equivalente próximo do plural עַמִּים.
- source_word: אֱלִילִים
  choice: ídolos
  rationale: É o equivalente claro e idiomático; a possível conotação polêmica de nulidade ou falta de valor é indicada em nota sem sobrecarregar o texto principal.
- source_word: וַיהוָה
  choice: mas Yahweh
  rationale: A conjunção expressa forte contraste neste contexto, e o nome divino é transliterado como Yahweh.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Reproduz a forma hebraica convencional e se ajusta naturalmente à afirmação sobre a criação.
- source_word: עָשָׂה
  choice: fez
  rationale: Traduz diretamente o verbo amplo עשה, sem especificá-lo indevidamente como “criou”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva no texto o nome próprio representado pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Status dos deuses dos povos
  choice: ídolos
  alternative: coisas sem valor; nulidades
  rationale: O termo hebraico identifica esses deuses polemicamente como ídolos e pode sugerir sua falta de valor; a tradução principal mantém a formulação direta sem resolver além do necessário a força conotativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem e o contraste poético do hebraico foram preservados sem rigidez artificial.
