  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: pt
  text: Atribuam a Yahweh, famílias dos povos, atribuam a Yahweh glória e força.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: deem
  rationale: O imperativo de יהב significa literalmente “dar”, e, neste chamado litúrgico, convida os povos a reconhecer e atribuir a Yahweh aquilo que lhe é devido. “Deem” mantém a forma concreta e a repetição poética do hebraico sem tornar o sentido obscuro em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da ação, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: ó famílias dos povos
  rationale: “Famílias” preserva o sentido de grupos de parentesco de מִשְׁפָּחוֹת, enquanto “povos” conserva o plural étnico e coletivo de עַמִּים. O vocativo “ó” torna clara e natural em português a convocação dirigida a esses grupos.
- source_word: כָּבוֹד
  choice: glória
  rationale: No contexto de culto, כָּבוֹד expressa a glória ou honra reconhecida como pertencente a Deus; “glória” corresponde ao registro elevado do salmo.
- source_word: וָעֹז
  choice: e força
  rationale: עֹז denota força, poder ou vigor. “Força” é direto, natural e preserva o paralelismo conciso com “glória”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino יהוה. “Yahweh” procura representar o nome próprio, em vez de substituí-lo por um título, sem impor uma interpretação denominacional.
- issue: Sentido de “dar” glória e força a Deus
  choice: Manter “deem” como linguagem litúrgica de reconhecimento
  alternative: atribuam; reconheçam
  rationale: O hebraico emprega literalmente o imperativo “deem”, mas o contexto não exige que seres humanos forneçam a Deus qualidades que lhe faltariam. A formulação preserva a tensão e a imagem poética do original.
translation_notes:
  register: Português atual, digno e poético, com leitura natural no Brasil e compreensão internacional. A repetição do imperativo e a ordem dos elementos reproduzem o paralelismo hebraico; o vocativo “ó” esclarece que “famílias dos povos” são as destinatárias da convocação.
