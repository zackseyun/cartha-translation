  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: pt
  text: Proclamem entre as nações a sua glória; entre todos os povos, os seus feitos maravilhosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as suas maravilhas”.'
    reason: Alternativa lexical que preserva de modo mais compacto o substantivo hebraico נִפְלְאוֹתָיו.
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Proclamem
  rationale: O imperativo plural do piel de ספר pede que se conte ou anuncie publicamente. “Proclamem” preserva o tom exortativo e público do salmo.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui as nações em sentido amplo. “Entre” comunica a proclamação no meio delas sem acrescentar uma conotação étnico-religiosa posterior.
- source_word: כְּבוֹדוֹ
  choice: a sua glória
  rationale: כָּבוֹד reúne as ideias de honra, esplendor e majestade; “glória” é natural e apropriado ao contexto de louvor.
- source_word: בְּכָל הָעַמִּים
  choice: entre todos os povos
  rationale: “Povos” distingue עַמִּים de גּוֹיִם e mantém o paralelismo poético e o alcance universal do verso.
- source_word: נִפְלְאוֹתָיו
  choice: os seus feitos maravilhosos
  rationale: O termo se refere a atos extraordinários que causam admiração. “Feitos maravilhosos” explicita o caráter ativo sem perder a ideia de maravilha.
theological_decisions:
- issue: Alcance universal da proclamação
  choice: A glória e os feitos de Deus devem ser proclamados entre as nações e todos os povos.
  alternative: Restringir a referência sobretudo aos povos vizinhos de Israel.
  rationale: O paralelismo entre גּוֹיִם e כָּל הָעַמִּים enfatiza um alcance internacional amplo, sem exigir a importação de formulações missiológicas posteriores.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito lusófono amplo. O paralelismo hebraico foi preservado com “nações” e “povos”; o ponto e vírgula marca a divisão poética sem tornar a frase artificial.
