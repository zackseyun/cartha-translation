  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: pt
  text: Cantem a Yahweh um cântico novo; cantem a Yahweh[a], toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH” (o nome divino), tradicionalmente traduzido como “o SENHOR”; também “Javé”.'
    reason: Identifica o Tetragrama e registra formas tradicionais ou alternativas sem substituir o nome próprio no texto principal.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” transmite de modo direto e natural a convocação dirigida a uma coletividade, sem acrescentar um objeto como “louvores”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário do canto; o nome divino יהוה é transliterado como “Yahweh” para preservar o nome próprio presente no hebraico.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: A combinação significa literalmente “cântico novo”. O artigo indefinido é necessário em português, embora não esteja expresso no hebraico.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Literalmente, “toda a terra”. Como a expressão funciona aqui como vocativo dirigido a quem pode cantar, a formulação explicita naturalmente a metonímia sem restringir o alcance universal.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama, nome próprio divino. “Yahweh” preserva essa identificação; a nota registra a tradução tradicional para leitores familiarizados com ela.
- issue: Alcance de כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  alternative: toda a terra
  rationale: O contexto é uma convocação universal ao canto. A escolha torna explícito que a ordem se dirige aos povos da terra, ao passo que “toda a terra” preservaria mais diretamente a figura poética e sua possível personificação.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Cântico” conserva o registro poético e bíblico sem ser obscuro. A repetição de “cantem a Yahweh” reproduz a estrutura enfática do hebraico.
