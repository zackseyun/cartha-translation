  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: pt
  text: Tributem a Yahweh a glória do seu nome; tragam uma oferta[a] e venham aos seus átrios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um tributo” ou “uma dádiva”. O termo hebraico pode designar uma dádiva, um tributo ou uma oferta, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Tributem
  rationale: O imperativo, nesta fórmula poética, chama os ouvintes a reconhecer e prestar glória a Yahweh. “Tributem” comunica esse sentido idiomático sem sugerir que lhe deem algo que lhe falte.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino יהוה como “Yahweh”, em vez de substituí-lo por um título.
- source_word: כְּבוֹד שְׁמוֹ
  choice: a glória do seu nome
  rationale: Reproduz de perto a construção hebraica e preserva a associação entre a glória e o nome revelado de Yahweh, sem acrescentar explicitamente “devida”, embora essa ideia esteja implícita no contexto.
- source_word: שְׂאוּ מִנְחָה
  choice: tragam uma oferta
  rationale: Com מִנְחָה, o verbo שְׂאוּ tem naturalmente o sentido de levar ou trazer. “Oferta” é amplo o bastante para o contexto de culto e evita especificar indevidamente uma oferta de cereais.
- source_word: וּבֹאוּ לְחַצְרוֹתָיו
  choice: e venham aos seus átrios
  rationale: Conserva o sentido direto do imperativo “venham” e traduz חֲצֵרוֹת pelo termo tradicional e compreensível “átrios”, referente aos recintos do santuário.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança, em vez de substituí-lo por um título, e evita a forma híbrida posterior “Jeová”.
- issue: Relação entre glória e nome em כְּבוֹד שְׁמוֹ
  choice: a glória do seu nome
  alternative: a glória devida ao seu nome
  rationale: A tradução escolhida acompanha mais diretamente a forma concisa do hebraico e não explicita além do texto a noção de obrigação, ainda que o imperativo a pressuponha.
translation_notes:
  register: Português moderno, solene e acessível. “Tributem” preserva o tom litúrgico sem soar excessivamente arcaico; “átrios” mantém a linguagem tradicional do santuário. O marcador da nota foi colocado após “oferta”, termo ao qual a alternativa lexical se refere.
