  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: pt
  text: Cantem a Yahweh; bendigam o seu nome; proclamem, dia após dia, a sua salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “anunciem as boas-novas da sua salvação”.'
    reason: Alternativa lexical que explicita a nuance de boas notícias presente no verbo בשר.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” é direto e natural, sem acrescentar um objeto como “louvores”, que não está explícito no hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário do canto. O nome divino יהוה é transliterado como “Yahweh”, preservando o nome da aliança presente no texto.
- source_word: בָּרֲכוּ
  choice: bendigam
  rationale: Imperativo plural no piel de ברך. “Bendigam” preserva o idioma bíblico “bendizer o seu nome” e mantém a distinção lexical em relação a “cantem”.
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: Tradução direta de שם com sufixo de terceira pessoa masculina singular. Mantém a expressão hebraica, que abrange identidade revelada e reputação.
- source_word: בַּשְּׂרוּ
  choice: proclamem
  rationale: Imperativo plural no piel de בשר, verbo que pode denotar o anúncio de boas notícias. “Proclamem” é conciso e natural; a nuance explícita de boas-novas é preservada em nota.
- source_word: מִיּוֹם לְיוֹם
  choice: dia após dia
  rationale: Expressão idiomática de continuidade ou repetição diária. “Dia após dia” comunica esse sentido com naturalidade em português.
- source_word: יְשׁוּעָתוֹ
  choice: a sua salvação
  rationale: ישועה pode indicar salvação, livramento ou vitória. “Salvação” conserva a amplitude do termo e é apropriado ao contexto de adoração.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título; “SENHOR” e “Jeová” são alternativas tradicionais, mas menos diretamente representativas da forma hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural. A formulação conserva o paralelismo dos três chamados e usa “dia após dia” por sua naturalidade ampla, sem perder o valor contínuo do idioma hebraico.
