  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: pt
  text: Pois o cetro da perversidade não permanecerá sobre a porção dos justos[a][b], para que os justos não estendam as mãos para praticar a injustiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cetro dos perversos”. A construção hebraica pode indicar tanto a perversidade que caracteriza esse domínio quanto os perversos que empunham o cetro.'
    reason: lexical_alternative
  - marker: b
    text: '“Porção” também pode ser traduzido por “sorte” ou “herança”: aquilo que foi atribuído aos justos.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “estendam as mãos para a injustiça”. A expressão hebraica significa envolver-se em ações injustas ou perversas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a confiança expressa no contexto e mantém a ligação discursiva de modo natural em português.
- source_word: יָנוּחַ
  choice: não permanecerá
  rationale: O verbo pode significar repousar, assentar-se ou permanecer. Aqui, “não permanecerá” comunica com clareza que o domínio perverso pode ocorrer, mas não se estabelecerá de modo duradouro.
- source_word: שֵׁבֶט
  choice: cetro
  rationale: Preserva a imagem de autoridade e domínio governante, mais adequada ao contexto do que a simples referência a uma vara.
- source_word: הָרֶשַׁע
  choice: da perversidade
  rationale: Mantém a leitura abstrata natural do substantivo hebraico, sem excluir a possibilidade de referência aos perversos que exercem o poder.
- source_word: גּוֹרַל
  choice: porção
  rationale: No contexto, designa a parte ou herança atribuída aos justos. “Porção” comunica esse sentido melhor ao leitor moderno do que o possível, porém menos transparente, “sorte”.
- source_word: הַצַּדִּיקִים
  choice: os justos
  rationale: É a tradução corrente do adjetivo substantivado e preserva seu sentido moral e pactual sem explicitação excessiva.
- source_word: לְמַעַן לֹא
  choice: para que ... não
  rationale: Expressa naturalmente em português a finalidade preventiva da construção hebraica.
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: estendam as mãos
  rationale: Conserva a imagem concreta do idioma hebraico, que neste contexto significa envolver-se ativamente em algo.
- source_word: בְּעַוְלָתָה
  choice: para a injustiça
  rationale: עַוְלָה pode indicar injustiça, iniquidade ou ação errada. A formulação mantém a imagem de dirigir as mãos ao mal, enquanto uma nota esclarece o sentido idiomático.
theological_decisions:
- issue: Natureza da promessa sobre o domínio perverso sobre os justos
  choice: O domínio perverso não permanecerá sobre a porção dos justos.
  alternative: Os perversos jamais exercerão qualquer autoridade sobre os justos.
  rationale: O verbo יָנוּחַ aponta para repousar, assentar-se ou permanecer. Assim, o versículo afirma a limitação e a não permanência da opressão, sem negar que os justos possam sofrê-la temporariamente. A oração final preserva a tensão ao indicar que a opressão prolongada poderia levá-los a agir injustamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Cetro” preserva a metáfora régia; “porção” torna claro o sentido contextual de גּוֹרַל. Os marcadores foram colocados junto aos termos pertinentes, em ordem alfabética.
