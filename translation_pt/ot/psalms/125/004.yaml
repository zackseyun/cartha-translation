base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: pt
  text: Faze o bem, ó Yahweh, aos bons e aos retos de coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Faze o bem
  rationale: 'O hifil imperativo de יטב expressa uma súplica dirigida a Yahweh: fazer o bem ou tratar bem. “Faze o bem” conserva a força verbal e o elo lexical com “bons”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַטּוֹבִים
  choice: aos que são bons
  rationale: O adjetivo טוֹב está substantivado e designa pessoas boas. Esta formulação é natural em português e mantém a relação lexical com “Faze o bem”.
- source_word: וְלִישָׁרִים בְּלִבּוֹתָם
  choice: aos que têm o coração íntegro
  rationale: יָשָׁר indica retidão, e בְּלִבּוֹתָם localiza essa qualidade no interior das pessoas. A expressão portuguesa comunica integridade interior com naturalidade.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem o substituir por um título.
- issue: Descrição moral dos beneficiários
  choice: os que são bons ... os que têm o coração íntegro
  alternative: os justos ... os retos de coração
  rationale: A escolha mantém as duas descrições éticas paralelas e a ênfase na integridade interior, sem transformar טוֹב em uma categoria técnica de justiça.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Faze” conserva o imperativo singular solene dirigido a Yahweh; a coordenação sem repetir “e” produz um paralelismo natural e fiel.
