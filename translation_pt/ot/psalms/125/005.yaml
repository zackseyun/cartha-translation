source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: pt
  text: Mas, quanto aos que se desviam para os seus caminhos tortuosos[a], Yahweh os levará embora junto com os que praticam a iniquidade[b]. Paz sobre Israel![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as suas veredas sinuosas” ou “para os seus caminhos perversos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Yahweh os fará partir com os malfeitores”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Paz sobre Israel” — expressão concisa que pode ser entendida como bênção ou oração pela paz e pelo bem-estar de Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: Mas, quanto aos que se desviam
  rationale: O particípio de נטה indica desviar-se ou apartar-se. “Mas” explicita o contraste com os retos do versículo anterior, e “quanto aos” reproduz naturalmente a função tópica da construção.
- source_word: עַקַלְקַלּוֹתָם
  choice: para os seus caminhos tortuosos
  rationale: O termo designa caminhos ou veredas sinuosos e, em sentido moral, perversos. “Caminhos tortuosos” mantém a imagem hebraica e é claro em português.
- source_word: יוֹלִיכֵם
  choice: os levará embora
  rationale: 'O hifil de הלך tem sentido causativo: fazer ir ou conduzir. “Levará embora” comunica a remoção em juízo sem especificar um destino que o texto não declara.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת
  choice: junto com
  rationale: Neste contexto, אֶת tem valor associativo, indicando que os desviados terão o mesmo destino que os praticantes da iniquidade.
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: os que praticam a iniquidade
  rationale: A expressão significa literalmente “os que fazem/praticam iniquidade”. Esta formulação preserva a construção e o peso moral do hebraico, mantendo boa legibilidade.
- source_word: שָׁלוֹם
  choice: Paz
  rationale: “Paz” é a correspondência consagrada e natural, abrangendo também as ideias hebraicas de bem-estar e integridade.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: A formulação concisa conserva a preposição hebraica e funciona naturalmente como bênção ou oração litúrgica em português.
theological_decisions:
- issue: Força da cláusula final שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 'Bênção ou oração concisa: “Paz sobre Israel!”'
  alternative: 'Declaração nominal: “Há paz sobre Israel” ou “A paz está sobre Israel”'
  rationale: O hebraico não contém verbo expresso. No contexto salmódico, a frase funciona naturalmente como bênção ou desejo litúrgico; a forma nominal em português preserva essa concisão sem impor tempo verbal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o contraste com o versículo anterior, conserva a metáfora dos caminhos tortuosos e evita explicitar além do hebraico a modalidade verbal da bênção final.
