source:
  edition: WLC
  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: pt
  text: Como os montes cercam Jerusalém[a], assim Yahweh cerca o seu povo, desde agora e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Jerusalém — os montes estão ao redor dela; e Yahweh está ao redor do seu povo, desde agora e para sempre”.'
    reason: Preserva a estrutura nominal e o valor conjuntivo mais literal do hebraico como alternativa ao comparativo explicitado no texto.
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: הָרִים
  choice: os montes
  rationale: O plural de הַר pode indicar montes ou montanhas; “montes” é natural no contexto topográfico de Jerusalém e mantém a imagem poética.
- source_word: סָבִיב לָהּ
  choice: cercam Jerusalém
  rationale: סָבִיב com ל indica estar ao redor; a formulação verbal é clara e natural, e explicita que o sufixo feminino retoma a cidade.
- source_word: וַיהוָה
  choice: assim Yahweh
  rationale: 'O waw recebe valor comparativo sugerido pelo paralelismo: como os montes cercam Jerusalém, assim Yahweh cerca seu povo.'
- source_word: סָבִיב לְעַמּוֹ
  choice: cerca o seu povo
  rationale: Repete o verbo da primeira oração para preservar o paralelismo e a imagem de proteção envolvente.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Mantém a relação possessiva e pactual sem acrescentar uma identificação não expressa no verso.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Expressão temporal corrente que indica continuidade a partir do presente.
- source_word: וְעַד עוֹלָם
  choice: e para sempre
  rationale: Forma portuguesa natural que comunica duração sem fim.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no hebraico, preservando sua função como nome pactual sem substituí-lo por um título.
- issue: Valor da conjunção ו antes de יְהוָה
  choice: 'valor comparativo: “assim Yahweh”'
  alternative: 'conjunção simples: “e Yahweh”'
  rationale: O paralelismo poético estabelece uma analogia. “Assim” a torna natural em português, enquanto a nota preserva a estrutura mais formal e sua ambiguidade sintática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Montes” conserva o tom poético tradicional sem soar arcaico; a repetição de “cerca” reproduz o paralelismo hebraico.
