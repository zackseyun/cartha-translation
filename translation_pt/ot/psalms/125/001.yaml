  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: pt
  text: 'Cântico das Subidas. Os que confiam em Yahweh são como o monte Sião: ele não será abalado[a]; permanecerá para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não será movido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Preserva o sentido lexical e a designação tradicional da coleção dos Salmos 120–134, em linguagem portuguesa corrente e digna.
- source_word: הַבֹּטְחִים
  choice: Os que confiam
  rationale: O particípio caracteriza uma classe de pessoas por sua confiança contínua; esta formulação é natural em português.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição marca o objeto da confiança, e o nome divino é transliterado para preservar o nome da aliança presente no hebraico.
- source_word: כְּהַר צִיּוֹן
  choice: como o monte Sião
  rationale: Mantém explicitamente a comparação introduzida por כְּ e emprega a forma portuguesa consagrada do topônimo.
- source_word: לֹא יִמּוֹט
  choice: ele não será abalado
  rationale: Expressa de modo idiomático a estabilidade do monte, preservando a negação e a forma verbal singular; o pronome esclarece que o referente imediato é o monte Sião.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: permanecerá para sempre
  rationale: No contexto da imagem de estabilidade, transmite o sentido duradouro de יָשַׁב com לְעוֹלָם sem recorrer ao literalismo pouco natural de 'sentará'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Referente dos verbos singulares לֹא יִמּוֹט e יֵשֵׁב
  choice: O monte Sião é o referente gramatical imediato
  alternative: Os que confiam em Yahweh são diretamente descritos como inabaláveis e permanentes
  rationale: Os verbos hebraicos estão no singular e seguem imediatamente 'monte Sião'. A comparação aplica implicitamente essa estabilidade aos que confiam, sem apagar a construção poética do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A estrutura em dois membros, marcada por dois-pontos e ponto e vírgula, conserva o paralelismo conciso do hebraico e evita subordinar desnecessariamente as afirmações finais.
