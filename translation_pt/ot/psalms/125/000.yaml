  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: pt
  text: 'Cântico das subidas. Os que confiam em Yahweh são como o monte Sião: ele não será abalado[a]; permanece para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “não será movido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das subidas
  rationale: Mantém a expressão tradicional e a imagem literal do título hebraico, cuja referência exata pode envolver peregrinações a Jerusalém ou uma coleção de cânticos em sequência.
- source_word: הַבֹּטְחִים
  choice: Os que confiam
  rationale: Expressa de modo natural o particípio plural hebraico, descrevendo continuamente aqueles que depositam confiança.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: Representa diretamente o nome divino יהוה, sem substituí-lo por um título.
- source_word: לֹא יִמּוֹט
  choice: não será abalado
  rationale: Comunica em português corrente a ideia de não vacilar, não se deslocar ou não perder a estabilidade; a alternativa mais formal é registrada em nota.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: permanece para sempre
  rationale: Traduz idiomaticamente o sentido de continuar estabelecido ou assentado indefinidamente, preservando a forma verbal singular referente ao monte Sião na comparação.
theological_decisions:
- issue: Referência dos verbos no singular
  choice: “ele não será abalado; permanece para sempre”, com referência gramatical ao monte Sião
  alternative: Aplicar diretamente os verbos no plural aos que confiam em Yahweh
  rationale: O hebraico passa do sujeito plural “os que confiam” à comparação com “monte Sião” e emprega verbos no singular. A tradução conserva essa estrutura sem eliminar a implicação de estabilidade para os fiéis.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR ou Javé
  rationale: A transliteração torna visível o nome próprio no texto-fonte e evita substituir יהוה por um título; não pretende resolver com certeza absoluta sua vocalização antiga.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. “Cântico” preserva o gênero poético; “monte Sião” segue o uso bíblico corrente. O ponto e vírgula mantém juntas as duas afirmações singulares sobre Sião.
