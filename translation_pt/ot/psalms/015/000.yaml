base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: pt
  text: 'Salmo de Davi[a].


    Javé, quem poderá hospedar-se na tua tenda[b]? Quem poderá habitar no teu santo monte?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; a expressão hebraica pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: b
    text: Ou “tabernáculo”; o hebraico diz literalmente “tenda”, provavelmente evocando o santuário como lugar da presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo tradicional e claro para uma composição poética destinada ao canto ou ao acompanhamento musical.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Reproduz de modo conciso a construção hebraica, mantendo em nota sua possível amplitude semântica.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa o nome divino pessoal no texto hebraico, em vez de substituí-lo por um título.
- source_word: יָגוּר
  choice: poderá hospedar-se
  rationale: O verbo sugere permanecer como hóspede ou residente temporário; esta escolha preserva essa nuance e o sentido de admissão expresso pela pergunta.
- source_word: בְּאָהֳלֶךָ
  choice: na tua tenda
  rationale: Tradução concreta do hebraico, que no contexto evoca o santuário como lugar da presença divina.
- source_word: יִשְׁכֹּן
  choice: poderá habitar
  rationale: Expressa residência ou permanência e mantém o paralelismo com a primeira pergunta sem tornar os dois verbos idênticos.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: no teu santo monte
  rationale: Tradução direta e idiomática da expressão hebraica, preservando a linguagem cultual e geográfica.
theological_decisions:
- issue: Sentido da relação entre Davi e o salmo
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A preposição hebraica pode indicar autoria, associação ou dedicação; o texto principal usa a formulação portuguesa consagrada, e a nota preserva a ambiguidade.
- issue: Representação do nome divino
  choice: Javé
  alternative: SENHOR
  rationale: O original traz o tetragrama, um nome próprio; transliterá-lo preserva a distinção entre o nome divino e o título hebraico para “Senhor”.
- issue: Natureza da permanência na presença de Deus
  choice: hospedar-se na tenda e habitar no santo monte
  alternative: morar no tabernáculo e residir no monte santo
  rationale: A tradução mantém as duas imagens paralelas e não decide antecipadamente se a linguagem indica acesso litúrgico, comunhão espiritual ou residência figurada.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. “Hospedar-se” conserva a nuance de permanência como hóspede, enquanto “habitar” sustenta o paralelismo sem apagar a diferença lexical do hebraico.
