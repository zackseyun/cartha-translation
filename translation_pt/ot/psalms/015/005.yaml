  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: pt
  text: Não empresta seu dinheiro a juros[a] nem aceita suborno contra o inocente. Quem faz essas coisas jamais será abalado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à usura”; o termo hebraico pode designar os juros cobrados sobre um empréstimo.
    reason: lexical_alternative
  - marker: b
    text: Ou “nunca será removido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: seu dinheiro
  rationale: Embora כֶּסֶף denote literalmente “prata”, no contexto econômico de empréstimo e juros significa naturalmente “dinheiro”.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: empresta ... a juros
  rationale: A expressão se refere à entrega de dinheiro mediante cobrança de juros. Esta formulação é clara em português atual e não restringe o sentido a juros excessivos.
- source_word: שֹׁחַד
  choice: suborno
  rationale: É o termo jurídico-moral corrente para pagamento destinado a corromper uma decisão ou conduta.
- source_word: עַל נָקִי
  choice: contra o inocente
  rationale: Preserva de modo conciso a ideia de aceitar suborno para agir em prejuízo de quem não tem culpa.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Quem faz essas coisas
  rationale: O particípio substantivado caracteriza qualquer pessoa que pratica as ações descritas; “quem” é natural e inclusivo em português.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: jamais será abalado
  rationale: Conserva a metáfora de estabilidade de מוֹט e expressa com naturalidade a negação duradoura indicada por לְעוֹלָם.
theological_decisions:
- issue: Alcance ético da cobrança de juros
  choice: Traduzir נֶשֶׁךְ por “juros”, sem limitar a condenação textual apenas a juros excessivos.
  alternative: “usura”
  rationale: Em português moderno, “usura” costuma sugerir juros abusivos. “Juros” preserva o alcance lexical mais amplo do hebraico sem impor ao verso uma teoria econômica posterior.
- issue: Natureza da estabilidade prometida
  choice: Manter a imagem “jamais será abalado”.
  alternative: “nunca será removido”
  rationale: O hebraico expressa estabilidade por uma metáfora que pode indicar não vacilar, não ser deslocado ou não ruir. “Abalado” preserva essa amplitude sem definir de modo indevido a forma exata da segurança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela preserva a concisão poética do hebraico, e as notas mantêm alternativas lexicais genuínas.
