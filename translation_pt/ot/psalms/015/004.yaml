  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: pt
  text: A seus olhos, a pessoa desprezada é rejeitada[a], mas ele honra os que temem Yahweh; faz um juramento, mesmo que isso lhe cause dano, e não volta atrás[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “A seus olhos, a pessoa desprezível é desprezada.” A oração hebraica é compacta e admite mais de uma tradução estreitamente relacionada.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “jura para o mal e não muda”. Em geral, entende-se que ele mantém o juramento mesmo quando isso lhe traz prejuízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: A seus olhos, a pessoa desprezada é rejeitada
  rationale: Preserva a construção hebraica compacta, os valores passivo/adjetivais e o idioma avaliativo “a seus olhos”, sem transformar explicitamente נִבְזֶה em uma categoria moral mais forte.
- source_word: יִרְאֵי יְהוָה
  choice: os que temem a Yahweh
  rationale: Mantém a expressão pactual de temor reverente e verte o Tetragrama pelo nome pessoal Yahweh.
- source_word: יְכַבֵּד
  choice: honra
  rationale: 'Expressa de modo conciso e natural o sentido do piel de כבד: tratar alguém como digno de honra.'
- source_word: נִשְׁבַּע לְהָרַע
  choice: faz um juramento, mesmo que isso lhe cause dano
  rationale: Torna explícita, em português natural, a compreensão contextual comum de que a pessoa mantém o compromisso mesmo quando ele se mostra prejudicial para si, sem esconder a formulação mais literal, registrada em nota.
- source_word: וְלֹא יָמִר
  choice: e não volta atrás
  rationale: Comunica idiomaticamente que ele não altera nem revoga o juramento implícito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da oração difícil נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: A seus olhos, a pessoa desprezada é rejeitada
  alternative: A seus olhos, o perverso é desprezível; Ele despreza a pessoa reprovável
  rationale: A sintaxe é condensada e admite traduções próximas. A opção escolhida conserva a forma passiva e a ambiguidade avaliativa, enquanto uma formulação tradicional é indicada em nota.
- issue: Alcance de לְהָרַע
  choice: mesmo que isso lhe cause dano
  alternative: para causar dano
  rationale: A leitura reflexiva, referente ao prejuízo sofrido por quem jura, é a compreensão contextual mais comum; a expressão hebraica, porém, é elíptica, por isso sua literalidade é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A seus olhos” preserva o modo de expressão hebraico; “faz um juramento” e “não volta atrás” oferecem naturalidade sem perder o sentido jurídico e ético. Todos os marcadores de nota aparecem no texto.
