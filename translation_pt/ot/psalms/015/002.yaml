base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: pt
  text: Aquele que vive com integridade[a], pratica o que é justo[b] e fala a verdade em seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “anda de modo irrepreensível”. O termo hebraico indica inteireza ou integridade na conduta, não necessariamente perfeição absoluta.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pratica justiça” ou “pratica retidão”. A palavra hebraica pode expressar justiça, retidão ou aquilo que é correto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: vive
  rationale: O particípio de הלך é uma metáfora habitual para a maneira de viver. Em português atual, “vive” comunica naturalmente esse sentido ético, sem obscurecer o texto.
- source_word: תָּמִים
  choice: com integridade
  rationale: תמים indica inteireza e irrepreensibilidade de conduta, não necessariamente perfeição absoluta. “Com integridade” preserva essa força moral e combina naturalmente com “vive”.
- source_word: וּפֹעֵל
  choice: pratica
  rationale: O particípio de פעל expressa ação habitual. “Pratica” realça a conduta contínua e forma uma expressão natural com “o que é justo”.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: צדק pode significar justiça, retidão ou aquilo que é correto. Aqui, “o que é justo” exprime de modo claro e idiomático a retidão posta em prática.
- source_word: וְדֹבֵר
  choice: fala
  rationale: Tradução direta do particípio de דבר, preservando o paralelismo verbal do verso.
- source_word: אֱמֶת
  choice: a verdade
  rationale: Em ligação com “fala”, אמת designa primariamente a verdade ou aquilo que é verdadeiro, embora também possa envolver fidelidade e confiabilidade.
- source_word: בִּלְבָבוֹ
  choice: no coração
  rationale: A expressão preserva o “coração” como centro da vida interior na antropologia hebraica. A preposição ב é mantida como “em/no”, sem convertê-la interpretativamente em “do fundo do coração”.
theological_decisions:
- issue: Expressão masculina singular representativa
  choice: Aquele que vive ... no coração
  alternative: Quem vive ... em seu coração
  rationale: Os particípios e o sufixo hebraicos estão no masculino singular e descrevem uma pessoa representativa. “Aquele que” conserva o singular sem tornar a frase pesada; a ausência de possessivo no último membro é natural em português e não altera o referente.
- issue: Integridade moral versus perfeição sem pecado
  choice: vive com integridade
  alternative: anda irrepreensivelmente
  rationale: O texto descreve inteireza moral de conduta, sem exigir que תמים seja entendido como perfeição absoluta. “Com integridade” evita essa leitura excessiva.
- issue: Âmbito de “no coração”
  choice: fala a verdade no coração
  alternative: fala a verdade de coração
  rationale: A formulação mantém a ambiguidade do hebraico entre verdade interior e fala procedente de uma disposição sincera, sem resolver silenciosamente a preposição como origem.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução usa equivalência ótima: verte idiomaticamente a metáfora de הלך por “vive”, mas preserva “no coração” e o paralelismo das três ações. Todos os marcadores de notas aparecem no texto principal.'
