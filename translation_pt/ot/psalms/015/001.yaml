id: PSA.15.1
reference: Psalms 15:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: pt
  text: 'Salmo de Davi.[a]


    Ó Yahweh, quem poderá hospedar-se em tua tenda?[b]

    Quem poderá habitar em teu santo monte?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”; no sobrescrito hebraico, “de Davi” pode indicar autoria, associação ou dedicação.
    reason: alternative_reading
  - marker: b
    text: Ou “tabernáculo”; o hebraico diz literalmente “tenda” e provavelmente evoca o santuário como morada de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: Termo consagrado e exato para este gênero poético e para a fórmula do sobrescrito.
- source_word: לְדָוִד
  choice: de Davi
  rationale: Preserva, em português, a relativa abertura da preposição hebraica, que pode indicar autoria, associação ou dedicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָגוּר
  choice: poderá hospedar-se
  rationale: Comunica a ideia de permanecer como hóspede ou residente temporário e mantém a distinção em relação a יִשְׁכֹּן.
- source_word: בְּאָהֳלֶךָ
  choice: em tua tenda
  rationale: Mantém a imagem concreta de אֹהֶל, sem excluir sua evocação do santuário como morada de Deus.
- source_word: יִשְׁכֹּן
  choice: poderá habitar
  rationale: Expressa residência mais estável e forma um paralelo natural, mas não idêntico, com 'hospedar-se'.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: em teu santo monte
  rationale: Tradução natural da expressão hebraica que se refere ao monte sagrado de Deus, provavelmente Sião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' conserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação indicada por לְדָוִד no sobrescrito
  choice: de Davi
  alternative: por Davi; para Davi
  rationale: A formulação não resolve de modo indevido se a relação é especificamente de autoria, dedicação ou associação.
- issue: Imagem cultual de אֹהֶל
  choice: tenda
  alternative: tabernáculo
  rationale: A tradução literal preserva a metáfora espacial e permite que o contexto evoque o santuário sem explicitar além do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes ('tua', 'teu'). 'Hospedar-se' torna acessível a nuance de permanência como hóspede, enquanto 'habitar' conserva o paralelismo sem apagar a diferença lexical.
