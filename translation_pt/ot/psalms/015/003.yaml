base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: pt
  text: Não difama com a língua[a], não faz mal ao seu semelhante[b] e não levanta afronta contra quem lhe é próximo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não anda espalhando calúnias com a língua”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não faz nenhum mal ao seu amigo ou companheiro”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “o seu próximo”; pode referir-se a um parente, a alguém de seu convívio ou a uma pessoa próxima na comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל
  choice: difama
  rationale: Neste uso com “língua”, o verbo descreve andar espalhando palavras contra alguém, isto é, caluniar ou difamar. “Difama” é atual, conciso e preserva a força ética da expressão.
- source_word: עַל לְשֹׁנוֹ
  choice: com a língua
  rationale: A expressão indica o instrumento da fala. “Com a língua” é natural em português e conserva a imagem concreta do hebraico.
- source_word: עָשָׂה ... רָעָה
  choice: faz mal
  rationale: A construção hebraica é ampla, literalmente “fazer mal/maldade”. “Faz mal” preserva essa amplitude e soa natural no contexto.
- source_word: לְרֵעֵהוּ
  choice: ao seu semelhante
  rationale: רֵעַ pode indicar amigo, companheiro, vizinho ou outro membro da comunidade. “Semelhante” mantém o alcance ético amplo sem exigir proximidade residencial ou amizade íntima.
- source_word: חֶרְפָּה
  choice: afronta
  rationale: O substantivo abrange insulto, opróbrio e desonra pública. “Afronta” conserva tanto o elemento verbal quanto a dimensão social da vergonha.
- source_word: נָשָׂא ... עַל
  choice: lança ... contra
  rationale: O idioma significa literalmente levantar ou carregar afronta contra alguém e, no contexto, participar ativamente em proferi-la ou propagá-la. “Lança ... contra” é idiomático e mantém parte da imagem hebraica.
- source_word: קְרֹבוֹ
  choice: quem lhe é próximo
  rationale: קָרוֹב designa alguém próximo e pode incluir parente, associado íntimo ou pessoa próxima na comunidade. A formulação preserva essa abertura sem restringir o termo a parentesco.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo verbal claro. “Semelhante” e “quem lhe é próximo” distinguem os dois termos relacionais hebraicos sem lhes impor sentidos excessivamente específicos.
