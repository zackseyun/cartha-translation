  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: pt
  text: Yahweh é grande em Sião; ele é exaltado acima de todos os povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre todos os povos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição בְ tem aqui sentido locativo, e “em Sião” é uma formulação natural em português.
- source_word: גָּדוֹל
  choice: grande
  rationale: Reproduz diretamente a ideia de grandeza, sem restringi-la apenas ao poder.
- source_word: וְרָם הוּא
  choice: ele está exaltado
  rationale: “Exaltado” comunica a posição elevada e a supremacia; o pronome explícito preserva a ênfase de הוּא.
- source_word: עַל כָּל הָעַמִּים
  choice: acima de todos os povos
  rationale: No contexto de exaltação, עַל indica superioridade. “Povos” corresponde melhor ao plural עַמִּים do que “nações”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de עַל na afirmação da supremacia divina
  choice: acima de todos os povos
  alternative: sobre todos os povos
  rationale: “Acima de” se harmoniza com “exaltado” e expressa claramente superioridade, enquanto “sobre” também pode sugerir domínio; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O ponto e vírgula conserva o paralelismo poético, e “ele” retém a ênfase do pronome hebraico.
