source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: pt
  text: Exaltem Yahweh, nosso Deus, e prostrem-se em direção ao seu santo monte[a], pois Yahweh, nosso Deus, é santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostrem-se no seu santo monte” ou “adorem diante do seu santo monte”. O verbo hebraico pode indicar tanto o ato de prostrar-se quanto a adoração, e a preposição pode ser entendida como “em direção a”, “em” ou “diante de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Exaltem
  rationale: Imperativo plural de רום; “exaltem” expressa de modo conciso e digno o chamado a enaltecer Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: O substantivo com sufixo da primeira pessoa do plural significa diretamente “nosso Deus”.
- source_word: וְהִשְׁתַּחֲווּ
  choice: e prostrem-se
  rationale: Preserva o sentido concreto de curvar-se ou prostrar-se, gesto que neste contexto constitui adoração.
- source_word: לְהַר קָדְשׁוֹ
  choice: em direção ao seu santo monte
  rationale: A preposição לְ pode indicar direção ou relação. Esta formulação conserva a nuance espacial sem sugerir que o monte seja o objeto da adoração.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão dos imperativos anteriores.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: Equivalente consagrado e central para o refrão do salmo acerca da santidade de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Se הִשְׁתַּחֲווּ deve ser explicitado como “adorem”
  choice: prostrem-se
  alternative: adorem; inclinem-se
  rationale: O verbo inclui a ação física de prostrar-se e frequentemente comunica adoração por meio desse gesto. A tradução mantém a imagem concreta sem eliminar sua força cultual.
- issue: Relação expressa por לְ diante de “seu santo monte”
  choice: em direção ao seu santo monte
  alternative: no seu santo monte; diante do seu santo monte
  rationale: O hebraico permite uma leitura direcional ou relacional. O texto principal conserva a direção espacial, e a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. “Prostrem-se” mantém a imagem corporal do hebraico; a nota preserva a ambiguidade lexical e preposicional.
