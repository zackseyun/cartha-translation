base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: pt
  text: Yahweh, nosso Deus, tu lhes respondeste; foste para eles um Deus perdoador[a], mas vingador por causa dos atos deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um Deus que levava embora a culpa deles”. O particípio hebraico significa literalmente “levantar” ou “carregar” e, neste contexto, pode indicar perdão mediante a remoção da culpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e que se vingava por causa dos atos deles”. O hebraico emprega um particípio, que pode ser traduzido como título nominal (“vingador”) ou como ação verbal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva, por transliteração, o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente a forma construta com o sufixo da primeira pessoa do plural e funciona como parte do chamamento inicial.
- source_word: אַתָּה עֲנִיתָם
  choice: tu lhes respondeste
  rationale: Mantém o pronome explícito e enfático e traduz ענה naturalmente como responder, no contexto das orações mencionadas nos versículos anteriores.
- source_word: אֵל נֹשֵׂא
  choice: um Deus que perdoava
  rationale: נֹשֵׂא significa literalmente levantar ou carregar, mas neste contexto descreve idiomaticamente a remoção da culpa, isto é, o perdão.
- source_word: הָיִיתָ לָהֶם
  choice: foste para eles
  rationale: Conserva a construção relacional de היה com ל, indicando como Deus se mostrou em relação a eles.
- source_word: וְנֹקֵם
  choice: mas também vingavas
  rationale: Expressa verbalmente o particípio de נקם e torna explícito o contraste contextual com o perdão, sem eliminar a presença cumulativa das duas ações divinas.
- source_word: עַל עֲלִילוֹתָם
  choice: os atos deles
  rationale: Traduz עֲלִילוֹת de modo amplo como atos, sem inserir no substantivo uma qualificação moral que o hebraico deixa ao contexto; a relação introduzida por עַל é acomodada à regência natural da formulação portuguesa.
theological_decisions:
- issue: Perdão divino ao lado da vingança punitiva
  choice: Manter lado a lado a resposta e o perdão de Deus, bem como sua vingança em relação aos atos deles.
  alternative: Entender que Deus perdoou plenamente essas pessoas e se vingou apenas de terceiros, ou que a vingança anulou o perdão.
  rationale: O hebraico afirma ambas as realidades sem explicar completamente sua relação. A tradução preserva essa tensão entre misericórdia e justiça, sem impor uma harmonização doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “tu” para conservar a ênfase do pronome hebraico e manter concordância natural. “Mas também” comunica o contraste entre perdão e justiça sem apagar o valor aditivo da conjunção hebraica.
