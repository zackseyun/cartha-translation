  naturalness: “Foste para eles um Deus que perdoava” é compreensível, mas soa menos idiomático e o imperfeito “perdoava” pode sugerir uma ação habitual passada desnecessária. A construção nominal com “Deus perdoador” e “vingador” reproduz melhor os particípios hebraicos e é natural em português atual.
  terminology: “Yahweh”, “nosso Deus”, “respondeste” e “atos” são adequados. “Deus perdoador” preserva o valor de נֹשֵׂא sem explicar em excesso a metáfora de carregar/remover culpa. “Vingador por causa dos atos deles” mantém a tensão entre perdão e juízo e expressa adequadamente a relação de עַל.
