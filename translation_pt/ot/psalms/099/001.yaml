id: PSA.99.1
reference: Psalms 99:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: pt
  text: Yahweh reina[a]; tremam os povos. Ele está entronizado sobre os querubins[b]; estremeça a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os povos tremem [...] a terra estremece”. Os verbos hebraicos no imperfeito também podem ser entendidos como indicativos, e não como exortações de valor semelhante ao jussivo.'
    reason: alternative_reading
  - marker: b
    text: “Entronizado sobre os querubins” também pode ser traduzido por “entronizado entre os querubins” ou “sentado sobre os querubins”. A expressão hebraica é um título régio e cultual de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: מָלָךְ
  choice: reina
  rationale: O qatal na proclamação poética expressa de modo natural a realeza vigente de Yahweh, sem impor a ideia ingressiva de que ele 'se tornou rei'.
- source_word: יִרְגְּזוּ
  choice: tremam
  rationale: Lê o imperfeito como resposta volitiva, de valor semelhante ao jussivo, à proclamação da realeza divina. A leitura indicativa continua possível e é registrada em nota.
- source_word: עַמִּים
  choice: os povos
  rationale: Mantém o plural coletivo, abrangendo diversos grupos humanos, e corresponde mais diretamente ao hebraico do que 'as nações'.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Ele está entronizado sobre os querubins
  rationale: Comunica o valor régio e cultual da expressão, sem reduzir יֹשֵׁב ao simples ato físico de sentar nem especificar excessivamente a relação espacial como 'entre'.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: É a forma portuguesa tradicional e reconhecível para essa classe de seres celestiais.
- source_word: תָּנוּט
  choice: estremeça
  rationale: Expressa o abalo da terra e acompanha a leitura volitiva de יִרְגְּזוּ, formando um paralelismo natural em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto da realeza universal de Yahweh favorece o sentido cósmico de 'terra', não o territorial de 'país' ou 'região'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal revelado a Israel em vez de substituí-lo por um título.
- issue: Valor dos imperfeitos יִרְגְּזוּ e תָּנוּט
  choice: 'Volitivo: “tremam os povos ... estremeça a terra”'
  alternative: 'Indicativo: “os povos tremem ... a terra estremece”'
  rationale: A leitura volitiva se ajusta à retórica de aclamação régia, mas a morfologia hebraica também admite a leitura indicativa; a nota preserva essa ambiguidade genuína.
- issue: Relação espacial em יֹשֵׁב כְּרוּבִים
  choice: entronizado sobre os querubins
  alternative: entronizado entre os querubins; sentado sobre os querubins
  rationale: A formulação escolhida transmite o título régio-cultual sem fixar como única uma localização espacial que a construção hebraica não explicita plenamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Entronizado” conserva o registro régio do salmo; “querubins” mantém a terminologia bíblica corrente. A ordem “tremam os povos” reforça o tom poético sem soar arcaica.
