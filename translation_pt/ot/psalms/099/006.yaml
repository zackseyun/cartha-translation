  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: pt
  text: 'Moisés e Arão estavam entre os seus sacerdotes,

    e Samuel, entre os que invocavam o seu nome.

    Eles clamavam a Yahweh,

    e ele lhes respondia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: estavam entre os seus sacerdotes
  rationale: 'O בְּ tem sentido partitivo: Moisés e Arão são contados entre os sacerdotes de Deus. O verbo “estavam” é suprido para formar uma oração natural em português, sem apagar a possível tensão quanto ao papel sacerdotal de Moisés.'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: entre os que invocavam o seu nome
  rationale: Mantém o paralelismo com “entre os seus sacerdotes” e preserva a referência explícita ao nome de Deus. “Invocavam” expressa naturalmente a prática de dirigir-se a Deus em oração e culto.
- source_word: קֹרִאים אֶל
  choice: clamavam a
  rationale: A expressão retoma a ação habitual das figuras mencionadas. “Clamavam a” conserva a direção marcada por אֶל e o sentido de oração, sem limitar necessariamente a ação a uma situação de aflição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יַעֲנֵם
  choice: ele lhes respondia
  rationale: O imperfeito é entendido como ação habitual no passado, em correspondência com “clamavam”; “lhes” representa o sufixo plural.
- source_word: שְׁמוֹ
  choice: o seu nome
  rationale: Preserva a formulação hebraica e sua importante nuance de invocação em oração e culto, em vez de reduzi-la a um simples pronome.
theological_decisions:
- issue: A classificação de Moisés e Arão como sacerdotes e de Samuel como alguém que invocava o nome de Deus
  choice: Moisés e Arão estavam entre os seus sacerdotes, e Samuel, entre os que invocavam o seu nome
  alternative: Moisés e Arão eram seus sacerdotes, e Samuel invocava o seu nome
  rationale: As duas expressões hebraicas são construções paralelas e classificatórias. “Entre” conserva o provável sentido partitivo, evita transformar o primeiro grupo numa afirmação mais absoluta que o hebraico e mantém a tensão do texto sobre a função sacerdotal de Moisés.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A disposição em linhas acompanha o paralelismo poético. Optou-se por “clamavam” e “respondia” para tornar explícito o aspecto habitual sugerido pelo contexto.
