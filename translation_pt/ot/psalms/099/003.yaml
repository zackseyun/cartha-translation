  text: יוֹד֣וּ שִׁ֭מְ/ךָ גָּד֥וֹל וְ/נוֹרָ֗א קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: pt
  text: Louvem[b] o teu nome, grande e temível[a]; ele é santo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que inspira reverente temor”; o hebraico descreve o nome como aquilo que desperta admiração reverente e medo.
    reason: lexical_alternative
  - marker: b
    text: Ou “Deem graças ao”; o verbo hebraico pode significar “dar graças” ou “louvar”, mas “louvar” se ajusta melhor ao contexto.
    reason: lexical_alternative
  - marker: c
    text: O pronome hebraico pode retomar “nome”, substantivo masculino, ou apontar para o próprio SENHOR; no contexto do salmo, a aclamação ressalta a santidade de Deus. A ordem hebraica também pode ser reproduzida como “santo é ele”.
    reason: source_ambiguity
lexical_decisions:
- source_word: יוֹדוּ
  choice: Louvem
  rationale: O hifil imperfeito, terceira pessoa do plural, de ידה pode significar “dar graças”, “louvar” ou “confessar”. Com “teu nome” como objeto neste contexto litúrgico, “louvar” expressa melhor o reconhecimento público da grandeza de Deus; o imperfeito tem aqui valor exortativo.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: שֵׁם significa “nome” e pode abranger reputação e caráter revelado. A tradução literal preserva o idioma hebraico e seu peso teológico.
- source_word: גָּדוֹל
  choice: grande
  rationale: Equivalente direto e natural de גָּדוֹל, preservando a simplicidade e a força do original.
- source_word: וְנוֹרָא
  choice: e temível
  rationale: נוֹרָא descreve aquilo que inspira temor e reverência. “Temível” conserva essa dimensão mais forte, que “impressionante” ou “admirável” poderia enfraquecer.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: “Santo” mantém a força teológica e litúrgica do termo e sua função de refrão no salmo.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente acrescenta ênfase. Em português, como em hebraico, “nome” é masculino, de modo que “ele” preserva a possível ligação gramatical com “nome” e, ao mesmo tempo, a referência contextual a Deus.
theological_decisions:
- issue: Referente do pronome הוּא na oração final
  choice: Manter “ele” sem explicitar o referente
  alternative: Explicitar “Deus é santo” ou entender “ele” estritamente como “o nome”
  rationale: O hebraico permite que o pronome masculino retome gramaticalmente “nome”, mas o refrão do Salmo 99 aponta contextualmente para o SENHOR. Manter o pronome preserva essa tensão sem impor uma resolução interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. “Temível” foi mantido por sua força reverente; a pontuação conserva as duas orações concisas do hebraico sem acrescentar uma relação causal ausente do texto.
