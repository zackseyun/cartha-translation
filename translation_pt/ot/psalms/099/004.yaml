  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: pt
  text: O Rei poderoso ama a justiça[a]; tu estabeleceste a equidade[b]; exerceste justiça e retidão em Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “A força do Rei ama a justiça”. A construção inicial em hebraico é condensada e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: “Equidade” também pode ser traduzida por “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹז מֶלֶךְ
  choice: A força do Rei
  rationale: Mantém de modo transparente os substantivos hebraicos e a construção poética condensada, sem convertê-la silenciosamente em uma expressão adjetiva mais fluente.
- source_word: מִשְׁפָּט אָהֵב
  choice: ama a justiça
  rationale: מִשְׁפָּט designa aqui a ordem justa do governo, e o perfeito אָהֵב exprime uma característica habitual do Rei.
- source_word: אַתָּה כּוֹנַנְתָּ
  choice: tu estabeleceste
  rationale: O pronome explícito preserva a ênfase do hebraico, enquanto כּוֹנַנְתָּ comunica o ato de firmar ou estabelecer.
- source_word: מֵישָׁרִים
  choice: a retidão
  rationale: Expressa aquilo que é reto no sentido moral e judicial; neste contexto, também pode denotar equidade.
- source_word: מִשְׁפָּט וּ/צְדָקָה
  choice: a justiça e a retidão
  rationale: Preserva a dupla de conceitos hebraicos, distinguindo o governo justo de צְדָקָה como conduta ou ordem reta.
- source_word: בְּ/יַעֲקֹב
  choice: em Jacó
  rationale: Conserva tanto a preposição quanto o nome poético e pactual usado no texto, sem substituí-lo interpretativamente por Israel.
- source_word: עָשִׂיתָ
  choice: realizaste
  rationale: Verbo natural em português para a efetivação da justiça e da retidão, sem restringir indevidamente o amplo sentido de עשה.
theological_decisions:
- issue: Como interpretar a expressão difícil וְעֹז מֶלֶךְ
  choice: A força do Rei ama a justiça
  alternative: O Rei poderoso ama a justiça; O rei, em sua força, ama a justiça; A força pertence ao rei que ama a justiça
  rationale: O hebraico é sintaticamente condensado e permite mais de uma análise. A tradução principal expõe sua estrutura nominal, enquanto a nota registra uma leitura idiomática plausível, sem resolver de forma silenciosa a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais na segunda pessoa do singular para preservar o discurso direto e enfático dirigido a Deus. A formulação incomum da primeira oração é deliberada e acompanhada de nota explicativa.
