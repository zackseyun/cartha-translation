  source_fidelity: A primeira oração do rascunho reproduz de modo excessivamente mecânico a sequência hebraica difícil, mas em português atribui literalmente o verbo «ama» a «a força», produzindo uma relação sintática enganosa. A leitura idiomática «O Rei poderoso ama a justiça» é uma interpretação antiga e linguisticamente plausível de וְעֹז מֶלֶךְ e comunica melhor o sentido provável, sem eliminar a dificuldade textual, que deve permanecer assinalada em nota. O restante transmite adequadamente os termos משפט, מישרים, צדקה e «em Jacó».
  naturalness: «A força do Rei ama a justiça» é pouco natural em português moderno e soa como uma personificação não pretendida. «O Rei poderoso ama a justiça» é claro, digno e adequado ao registro poético. «Equidade» é especialmente natural para מישרים no contexto de governo justo; «exerceste justiça e retidão» exprime com mais precisão e fluência a ação de Deus do que «realizaste».
  terminology: Mantêm-se «justiça» para משפט e «retidão» para צדקה, preservando a dupla hebraica. «Equidade» para מישרים é contextual e recebe nota com a alternativa «retidão». «Jacó» conserva o nome poético hebraico. A maiúscula em «Rei» segue o tratamento reverencial já adotado no projeto.
