  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: pt
  text: Exaltem o SENHOR, nosso Deus, e curvem-se diante do escabelo de seus pés[a][b]; ele é santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao escabelo de seus pés”. Neste contexto de adoração, a preposição hebraica pode ser entendida de mais de uma maneira.
    reason: lexical_alternative
  - marker: b
    text: O “escabelo de seus pés” pode aludir ao lugar da entronização de Deus na terra, como a arca ou o santuário, mas o texto não identifica explicitamente o referente.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Exaltem
  rationale: O imperativo plural de רום pede que a comunidade reconheça e proclame a grandeza de Deus. “Exaltem” é natural, digno e adequado ao registro de adoração.
- source_word: יְהוָ֤ה
  choice: o SENHOR
  rationale: Representa o nome divino יהוה segundo a convenção reverente amplamente reconhecida nas Bíblias em português, sem confundi-lo com o substantivo comum “Senhor”.
- source_word: אֱלֹהֵ֗ינוּ
  choice: nosso Deus
  rationale: O sufixo da primeira pessoa do plural preserva o caráter comunitário da confissão.
- source_word: וְהִשְׁתַּחֲווּ
  choice: e curvem-se
  rationale: Mantém o gesto corporal de inclinar-se ou prostrar-se, em vez de substituí-lo pelo sentido mais amplo e interpretativo de “adorem”.
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: diante do escabelo de seus pés
  rationale: “Escabelo de seus pés” conserva integralmente a imagem hebraica. No contexto de culto, ל pode indicar orientação ou localização; “diante de” comunica reverência sem sugerir que o escabelo seja objeto de adoração.
- source_word: קָד֥וֹשׁ הֽוּא
  choice: ele é santo
  rationale: Reproduz com clareza e naturalidade a oração nominal hebraica, apresentando a santidade de Deus como fundamento da exortação.
theological_decisions:
- issue: Referente de “escabelo de seus pés”
  choice: Manter a metáfora sem identificar seu referente no texto principal.
  alternative: Explicitar o escabelo como a arca, Sião, o santuário ou a terra.
  rationale: O versículo não identifica expressamente o referente. A formulação literal preserva a amplitude simbólica e evita impor uma interpretação específica.
- issue: Relação indicada pela preposição ל
  choice: “diante do escabelo”
  alternative: “junto ao escabelo” ou “ao escabelo”
  rationale: A preposição admite mais de uma nuance neste contexto. “Diante de” expressa a orientação do ato de reverência sem resolver além do necessário a relação espacial e cultual.
translation_notes:
  register: Português atual, claro e solene, com forma verbal no plural dirigida à comunidade. “Escabelo” é menos frequente na fala cotidiana, mas preserva com precisão uma imagem bíblica reconhecível; a expressão completa “escabelo de seus pés” torna seu sentido transparente.
