base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: pt
  text: Numa coluna de nuvem, ele lhes falava[a]; eles guardaram os seus testemunhos e o estatuto que lhes deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Da coluna de nuvem, ele lhes falava”. A preposição hebraica pode ser entendida em sentido locativo ou instrumental.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: Numa coluna de nuvem
  rationale: A preposição בְּ admite sentido locativo ou instrumental. A tradução principal preserva a imagem de Deus falando no interior da coluna de nuvem, enquanto a nota registra a alternativa de procedência.
- source_word: יְדַבֵּר
  choice: ele falava
  rationale: O yiqtol, neste contexto histórico-poético, pode expressar ação passada habitual ou reiterada. O imperfeito português preserva esse aspecto melhor que o pretérito perfeito.
- source_word: אֲלֵיהֶם
  choice: com eles
  rationale: Em português, “falar com alguém” é natural e corresponde à construção hebraica, remetendo às figuras mencionadas no versículo anterior.
- source_word: שָׁמְרוּ
  choice: eles guardaram
  rationale: Em contexto pactual, שׁמר significa guardar ou observar. “Guardaram” conserva a metáfora lexical e comunica obediência.
- source_word: עֵדֹתָיו
  choice: os seus testemunhos
  rationale: “Testemunhos” preserva o vocabulário pactual e mantém a distinção lexical em relação ao singular חֹק.
- source_word: וְחֹק
  choice: e o estatuto
  rationale: “Estatuto” expressa uma determinação prescrita e mantém tanto o singular hebraico quanto a distinção em relação a “testemunhos”.
- source_word: נָתַן לָמוֹ
  choice: que lhes deu
  rationale: A oração se liga naturalmente a “o estatuto”. A formulação portuguesa é clara e mantém sem explicitação adicional o sujeito divino.
theological_decisions:
- issue: Referentes de “ele” e “eles”
  choice: “Ele” refere-se ao SENHOR, e “eles”, a Moisés, Arão e Samuel, mencionados no versículo anterior.
  alternative: “Eles” pode ser entendido de modo mais amplo como Israel representado por esses líderes.
  rationale: O antecedente contextual imediato são as três figuras do versículo 6. Os pronomes são preservados no texto para não eliminar a concisão nem resolver além do necessário a possível dimensão representativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. O imperfeito “falava” preserva o possível valor habitual do verbo hebraico; a terminologia “testemunhos” e “estatuto” mantém a distinção pactual do original.
