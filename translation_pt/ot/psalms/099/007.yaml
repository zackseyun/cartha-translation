revisions:
- from: Numa coluna de nuvem, ele falava com eles[a]; eles guardaram os seus testemunhos e o estatuto que lhes deu.
  to: Numa coluna de nuvem, ele lhes falava[a]; eles guardaram os seus testemunhos e o estatuto que lhes deu.
  rationale: A revisão substitui “com eles” por “lhes”, correspondendo mais diretamente à construção hebraica “falava a eles” e preservando o possível aspecto habitual de יְדַבֵּר em “falava”. Também torna a explicação da alternativa de nota mais lexicalmente precisa, sem alterar a alternativa tradutória nem o sentido do versículo.
