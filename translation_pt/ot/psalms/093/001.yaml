id: PSA.93.1
reference: Psalms 93:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: pt
  text: Yahweh reina[a]; está vestido de majestade[b]. Yahweh está vestido de força; cingiu-se[c]. Sim, o mundo está firmemente estabelecido[d]; não será abalado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh tornou-se rei”. O verbo hebraico também pode ser entendido em sentido ingressivo, embora aqui provavelmente proclame seu reinado presente.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “esplendor”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cingiu-se”; a imagem é a de prender à cintura um cinto ou equipamento, como quem se prepara para agir.
    reason: cultural_note
  - marker: d
    text: '“Mundo” pode designar especificamente o mundo habitado. A última frase também pode ser traduzida: “não vacilará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מָלָךְ
  choice: reina
  rationale: Neste salmo de realeza, o perfeito hebraico funciona naturalmente como proclamação da realidade presente do reinado de Yahweh, embora uma leitura ingressiva continue possível.
- source_word: גֵּאוּת
  choice: majestade
  rationale: No contexto da realeza divina, designa elevação e esplendor majestoso, não orgulho em sentido negativo.
- source_word: לָבֵשׁ
  choice: está vestido
  rationale: Preserva a metáfora repetida de Yahweh revestido de majestade e força, com formulação natural em português.
- source_word: עֹז
  choice: força
  rationale: Equivalente claro e corrente para a potência de Yahweh neste contexto régio.
- source_word: הִתְאַזָּר
  choice: cingiu-se
  rationale: Preserva a forma reflexiva e a imagem de prender à cintura o cinto ou equipamento, sem acrescentar um objeto ausente no hebraico.
- source_word: אַף
  choice: Sim
  rationale: Comunica a continuação enfática que liga o reinado estável de Yahweh à estabilidade do mundo.
- source_word: תִּכּוֹן
  choice: está firmemente estabelecido
  rationale: 'Expressa o sentido do nifal: o mundo foi posto em condição firme e permanece assim.'
- source_word: תֵּבֵל
  choice: o mundo
  rationale: Representa de modo conciso o mundo habitado e ordenado, sentido usual do termo neste contexto.
- source_word: בַּל תִּמּוֹט
  choice: não será abalado
  rationale: Expressa em português natural a impossibilidade de o mundo vacilar ou perder sua estabilidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Valor aspectual de מָלָךְ
  choice: 'presente declarativo: “reina”'
  alternative: 'ingressivo: “tornou-se rei”'
  rationale: O contexto proclama a realeza vigente de Yahweh. A nota mantém visível a leitura ingressiva possível sem fazer dela a única interpretação.
- issue: Estabilidade do mundo em relação ao reinado divino
  choice: manter a afirmação poética direta de que o mundo não será abalado
  alternative: explicitar uma tese cosmológica ou escatológica
  rationale: A tradução conserva a afirmação do salmo sem importar uma explicação doutrinária que o versículo não formula.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Cingiu-se” é deliberadamente mais formal para conservar a imagem concreta do hebraico; a nota esclarece o termo. A repetição de “Yahweh” e de “está vestido” acompanha a ênfase do original.
