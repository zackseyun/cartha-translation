source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: pt
  text: Teus testemunhos são plenamente confiáveis; a santidade convém à tua casa, Yahweh, para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela extensão dos dias”.
    reason: literal_rendering
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: teus testemunhos
  rationale: Preserva a ideia de declarações divinas que dão testemunho da vontade e da aliança de Deus, sem restringi-las apenas a decretos legais.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: são plenamente confiáveis
  rationale: O nifal de אמן expressa firmeza e confiabilidade; מְאֹד intensifica essa qualidade. A formulação é natural em português e mantém a força do hebraico.
- source_word: לְבֵיתְךָ
  choice: à tua casa
  rationale: Mantém a imagem literal de 'casa', que no contexto pode designar o santuário ou templo sem tornar explícita essa interpretação.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: a santidade convém
  rationale: Expressa que a santidade é apropriada e condizente com a casa de Deus, preservando o substantivo abstrato קֹדֶשׁ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְאֹרֶךְ יָמִים
  choice: para sempre
  rationale: Traduz de modo natural o valor idiomático da expressão hebraica, literalmente ligada à 'extensão dos dias'; a imagem formal é registrada em nota.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração preserva essa função sem substituí-lo por um título.
- issue: Alcance temporal de לְאֹרֶךְ יָמִים
  choice: para sempre
  alternative: por longos dias / pela extensão dos dias
  rationale: A expressão pode ser representada formalmente com a imagem da duração dos dias, mas neste contexto comunica permanência duradoura. A tradução principal usa o equivalente idiomático e a nota preserva a forma hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o tom poético. O ponto e vírgula conserva o paralelismo entre a confiabilidade dos testemunhos de Deus e a santidade permanente de sua casa.
