  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: pt
  text: Mais majestoso que o som de muitas águas[a], que as poderosas ondas do mar, é Yahweh[b] nas alturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mais poderoso que o som de muitas águas, que as ondas do mar, Yahweh é poderoso nas alturas.”'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: que o som de
  rationale: A preposição מִן tem sentido comparativo no contexto. קוֹל pode significar voz, som ou ruído; “som” mantém a imagem auditiva e é natural em português.
- source_word: מַיִם רַבִּים
  choice: muitas águas
  rationale: Preserva a expressão poética hebraica sem reduzi-la a uma referência mais específica, como rios ou oceano.
- source_word: אַדִּירִים / אַדִּיר
  choice: poderosas / majestoso
  rationale: O campo semântico inclui poder, grandeza e majestade. “Poderosas” descreve naturalmente as ondas, enquanto “majestoso” expressa a superioridade régia de Yahweh e conserva o contraste poético.
- source_word: מִשְׁבְּרֵי יָם
  choice: as ondas do mar
  rationale: מִשְׁבָּר designa ondas que quebram ou rebentam. “Ondas do mar” é claro e corrente para leitores de diferentes regiões; “poderosas” comunica sua força no paralelismo.
- source_word: בַּמָּרוֹם
  choice: nas alturas
  rationale: Mantém a ideia de elevação e exaltação sem especificar além do texto que se trata do céu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
theological_decisions:
- issue: Força comparativa e sintaxe das expressões poéticas
  choice: Yahweh é apresentado como mais majestoso que as águas e as ondas do mar.
  alternative: A construção também pode ser explicitada com a repetição de “mais poderoso”, entendendo אַדִּיר em seu sentido de força.
  rationale: O מִן inicial favorece a comparação, mas a forma condensada da poesia hebraica permite diferenças na distribuição e explicitação de אַדִּיר. A nota preserva essa tensão sem enfraquecer a afirmação da supremacia de Yahweh.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio YHWH. A tradução principal o representa como “Yahweh”, enquanto a nota informa a convenção tradicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem com o predicativo no início conserva a elevação poética e põe em destaque a superioridade de Yahweh. “Som” evita regionalismo, e “nas alturas” mantém a concisão e a transcendência da expressão hebraica.
