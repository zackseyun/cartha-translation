  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: pt
  text: Teu trono está firme desde os tempos antigos[a]; tu existes desde a eternidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Teu trono está estabelecido desde a antiguidade; tu és desde sempre.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: está firme
  rationale: A forma expressa um estado consolidado de firmeza ou estabilidade; “está firme” traduz diretamente esse valor estativo e soa natural em português.
- source_word: כִּסְאֲךָ
  choice: teu trono
  rationale: כִּסֵּא significa normalmente “trono”, e o sufixo de segunda pessoa masculina singular é representado por “teu”.
- source_word: מֵאָז
  choice: desde os tempos antigos
  rationale: No contexto poético, a expressão aponta para um passado remoto. Esta formulação é clara e digna, sem recorrer a linguagem excessivamente arcaica.
- source_word: מֵעוֹלָם
  choice: desde a eternidade
  rationale: Em referência a Deus, עוֹלָם indica antiguidade sem limite ou eternidade; “desde a eternidade” preserva a força temporal e o paralelismo.
- source_word: אָתָּה
  choice: tu existes
  rationale: O pronome independente forma uma oração nominal com a expressão temporal precedente. Em português, “tu existes” explicita naturalmente a predicação sem acrescentar uma definição metafísica.
theological_decisions:
- issue: Linguagem temporal sobre a existência de Deus
  choice: tu existes desde a eternidade
  alternative: tu és desde a eternidade
  rationale: A tradução afirma a existência eterna de Deus conforme o hebraico, sem importar terminologia metafísica posterior. “Existes” é mais idiomático em português, enquanto a alternativa reproduz mais formalmente a oração nominal.
translation_notes:
  register: Português moderno, poético e reverente, com ampla legibilidade brasileira. O paralelismo temporal entre a firmeza antiga do trono e a existência eterna de Deus foi preservado.
