  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: pt
  text: 'Os rios levantaram-se[a], ó Yahweh;

    os rios levantaram a sua voz;

    os rios levantam as suas ondas que arrebentam[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «As torrentes levantaram-se». O termo hebraico normalmente significa «rios», embora aqui possa evocar águas caudalosas ou inundantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «suas ondas que arrebentam» ou «seu fragor». O substantivo hebraico é raro e denota o impacto ou estrondo das águas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: se levantaram / levantaram / levantam
  rationale: Mantém a repetição enfática de נשׂא e distingue os dois perfectivos iniciais do imperfectivo final, traduzido como presente vívido. Na primeira oração, a forma pronominal expressa naturalmente em português a elevação das águas; com «voz» e «ondas», o verbo é transitivo.
- source_word: נְהָרוֹת
  choice: rios
  rationale: É o sentido lexical normal do substantivo. «Inundações» ou «torrentes» realçaria as águas caóticas, mas seria menos literal; a força tumultuosa já aparece no restante do verso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título. A interjeição «ó» marca o vocativo exigido pelo contexto poético.
- source_word: קוֹלָם
  choice: a sua voz
  rationale: Preserva a personificação dos rios e traduz de modo natural o substantivo קוֹל com o sufixo possessivo.
- source_word: דָּכְיָם
  choice: suas ondas impetuosas
  rationale: O substantivo raro evoca a força das águas que batem ou arrebentam. «Ondas impetuosas» comunica essa imagem com clareza, enquanto a nota registra alternativas mais específicas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: 'Yahweh, em vocativo: «ó Yahweh»'
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e não o substitui por um título.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética sustentada pela repetição de «os rios» e «levantaram/levantam». Emprega «sua/suas» com referente explícito para ampla legibilidade lusófona.
