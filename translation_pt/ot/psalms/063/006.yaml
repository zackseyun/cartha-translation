  text: Quando me lembro de ti em minha cama, medito em ti durante as vigílias da noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: Quando me lembro de ti
  rationale: Embora אִם normalmente introduza condição, aqui pode ter valor temporal no contexto poético; “quando” expressa naturalmente a lembrança recorrente sem criar uma condição hipotética artificial.
- source_word: עַל יְצוּעָי
  choice: em minha cama
  rationale: יָצוּעַ designa o leito ou lugar de repouso; “cama” é claro, natural e adequado ao contexto noturno.
- source_word: בְּאַשְׁמֻרוֹת
  choice: durante as vigílias da noite
  rationale: O plural se refere às divisões ou períodos de vigília noturna. A explicitação “da noite”, sustentada pelo contexto e pelo uso da expressão, evita obscuridade para o leitor moderno.
- source_word: אֶהְגֶּה בָּךְ
  choice: medito em ti
  rationale: הגה pode indicar meditar, ponderar ou murmurar; neste contexto devocional, “medito” conserva o foco reflexivo, e “em ti” reproduz o objeto pessoal marcado por ב.
theological_decisions:
- issue: Valor de אִם no início do verso
  choice: 'Leitura temporal: “Quando”'
  alternative: 'Leitura condicional: “Se”'
  rationale: No paralelismo e no contexto de uma prática recorrente durante a noite, a partícula funciona naturalmente com sentido temporal. A tradução evita sugerir dúvida quanto ao ato de lembrar, sem acrescentar uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém o paralelismo entre lembrar e meditar e preserva a imagem concreta das vigílias noturnas.
