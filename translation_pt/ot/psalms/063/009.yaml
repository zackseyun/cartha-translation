id: PSA.63.9
reference: Psalms 63:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: pt
  text: Mas eles, que buscam minha vida para destruí-la,[a] irão para as profundezas da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que buscam minha vida para a ruína”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “para as partes inferiores da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mas eles
  rationale: O pronome é enfático, e a conjunção assume naturalmente valor adversativo no contraste com a confiança expressa no versículo anterior.
- source_word: לְשׁוֹאָה יְבַקְשׁוּ נַפְשִׁי
  choice: que buscam minha vida para destruí-la
  rationale: נֶפֶשׁ designa aqui a vida do salmista, enquanto לְשׁוֹאָה expressa o propósito de levá-la à ruína. A formulação conserva a ordem conceitual do hebraico e soa natural em português.
- source_word: יָבֹאוּ
  choice: irão
  rationale: Embora o verbo tenha normalmente o sentido de “vir”, o português pede “ir” quando o movimento é apresentado da perspectiva do salmista rumo às profundezas da terra.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: para as profundezas da terra
  rationale: A expressão mantém a imagem espacial de descida à morte ou à sepultura sem transformá-la em termo técnico para o mundo dos mortos.
theological_decisions:
- issue: Sentido de “as profundezas da terra”
  choice: Manter a imagem poética de descida à morte, à sepultura ou ao juízo
  alternative: Traduzir explicitamente como “mundo dos mortos”
  rationale: O hebraico permite associação com o domínio dos mortos, mas não exige aqui uma identificação doutrinária precisa; a tradução preserva essa abertura.
- issue: Relação de לְשׁוֹאָה com a busca pela vida do salmista
  choice: Expressar a finalidade como “para destruí-la”
  alternative: Reproduzir mais formalmente “para a ruína”
  rationale: A finalidade destrutiva está presente no hebraico, mas a construção nominal literal seria pouco natural em português. A nota conserva sua forma mais próxima.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém o contraste enfático de “Mas eles” e preserva, em nota, as formulações mais literais das duas expressões hebraicas.
