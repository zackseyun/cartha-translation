  source_fidelity: A tradução transmite com fidelidade o contraste adversativo e enfático de וְהֵמָּה, a perseguição mortal expressa por יְבַקְשׁוּ נַפְשִׁי, a finalidade destrutiva de לְשׁוֹאָה e o movimento descendente de יָבֹאוּ בְּתַחְתִּיּוֹת הָאָרֶץ. «Minha vida» é apropriado para נַפְשִׁי neste contexto, e «profundezas da terra» preserva a imagem hebraica sem determinar uma doutrina do além.
  naturalness: O enunciado é claro, idiomático e digno em português moderno de ampla compreensão. «Mas eles» estabelece bem o contraste; «buscam minha vida para destruí-la» exprime naturalmente a intenção hostil; e «irão para as profundezas da terra» é fluente e poético sem soar arcaico.
  terminology: «Vida», «destruí-la» e «profundezas da terra» são escolhas terminologicamente adequadas. As notas distinguem de modo útil a formulação mais literal para a finalidade de ruína e para as regiões inferiores da terra, sem introduzir a leitura interpretativa de “mundo dos mortos”.
