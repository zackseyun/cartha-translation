base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: pt
  text: Assim, no santuário, contemplei-te, para ver o teu poder e a tua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi assim que te contemplei no lugar santo.”'
    reason: Alternativa que preserva outra possível relação sintática de כֵּן e traduz בַּקֹּדֶשׁ mais literalmente como “no lugar santo”.
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Traduz o advérbio como ligação natural com a experiência e o anseio expressos no contexto, sem definir em excesso a relação lógica.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: Neste contexto de culto, קֹדֶשׁ com a preposição designa mais naturalmente o lugar santo; “santuário” é claro, digno e corrente em português.
- source_word: חֲזִיתִיךָ
  choice: contemplei-te
  rationale: חזה sugere visão atenta ou perceptiva, não apenas um olhar momentâneo. “Contemplei-te” preserva essa força poética sem explicar a natureza da experiência.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: O infinitivo pode expressar propósito; a formulação direta mantém a repetição conceitual dos verbos de visão presente no hebraico.
- source_word: עֻזְּךָ
  choice: o teu poder
  rationale: עֹז abrange força, poder e potência; “poder” é natural ao lado de “glória” e comunica claramente a potência divina.
- source_word: וּכְבוֹדֶךָ
  choice: e a tua glória
  rationale: “Glória” é o equivalente português estabelecido para כָּבוֹד quando se refere a Deus e preserva a ideia de majestade manifesta.
theological_decisions:
- issue: Natureza da contemplação de Deus no santuário
  choice: Manter a afirmação direta de que o salmista contemplou Deus no santuário, com o propósito de ver seu poder e sua glória.
  alternative: Interpretar explicitamente como lembrança de uma experiência anterior de culto, ou como visão mística da essência divina.
  rationale: O hebraico emprega linguagem direta de visão em contexto cultual, mas não especifica a natureza exata da experiência. A tradução preserva essa tensão sem afirmar uma visão literal da essência divina nem reduzi-la a mera metáfora.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A colocação pronominal em “contemplei-te” conserva o tom poético e solene sem recorrer a vocabulário arcaico; “teu” mantém a segunda pessoa singular do hebraico.
