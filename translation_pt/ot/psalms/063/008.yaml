lexical_decisions:
- source_word: דָּבְקָה
  choice: se apega
  rationale: O verbo דבק expressa aderência firme e vínculo estreito. O presente comunica em português o estado contínuo indicado pelo perfeito hebraico neste contexto poético.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נפשׁ pode designar alma, vida, pessoa ou o próprio eu. “Minha alma” preserva a linguagem poética e devocional sem impor uma definição antropológica técnica.
- source_word: אַחֲרֶיךָ
  choice: a ti
  rationale: Embora אַחֲרֵי signifique literalmente “atrás de/depois de”, com דבק a construção descreve apego ou seguimento estreito. “A ti” forma a expressão portuguesa natural “apegar-se a”, enquanto a imagem mais literal é preservada em nota.
- source_word: בִּי
  choice: me
  rationale: A preposição ב com sufixo de primeira pessoa funciona aqui como complemento pessoal de תמך; “me sustém” comunica o sentido de modo natural.
- source_word: תָּמְכָה
  choice: sustém
  rationale: תמך significa apoiar, amparar ou sustentar. “Sustém” preserva a concisão poética e o sentido de apoio contínuo.
- source_word: יְמִינֶךָ
  choice: tua mão direita
  rationale: Tradução direta da imagem hebraica, mantendo sua linguagem concreta de força, proteção e amparo.
theological_decisions:
- issue: Nuance antropológica de נַפְשִׁי
  choice: minha alma
  alternative: eu / minha vida / todo o meu ser
  rationale: A escolha conserva a densidade pessoal e espiritual da poesia sem transformar “alma” em um termo doutrinário técnico.
- issue: Linguagem antropomórfica da mão direita de Deus
  choice: tua mão direita
  alternative: teu poder / tua força
  rationale: A metáfora concreta do hebraico é mantida, em vez de ser substituída por sua interpretação abstrata.
- issue: Relação expressa por דבק + אַחֲרֵי
  choice: se apega a ti
  alternative: segue bem de perto após ti
  rationale: A tradução principal prioriza a expressão portuguesa natural sem perder o apego intenso de דבק; a nota registra a imagem hebraica de seguir atrás, preservando a ambiguidade entre vínculo e perseguição próxima.
translation_notes:
  register: Português moderno, digno e poético, com formas de segunda pessoa coerentes (“ti”, “tua”). A formulação é concisa e acessível; a nota preserva a imagem menos idiomática do original.
