base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/003.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: pt
  text: Pois o teu amor leal é melhor do que a vida[a]; meus lábios te louvarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor constante” ou “amor de aliança”. O termo hebraico חֶסֶד indica amor bondoso, fiel e duradouro, muitas vezes ligado a uma relação de aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do louvor que se segue e mantém de modo natural a ligação causal em português.
- source_word: טוֹב ... מֵחַיִּים
  choice: é melhor do que a vida
  rationale: A preposição comparativa מִן faz טוֹב assumir sentido comparativo; חַיִּים, embora formalmente plural, designa idiomaticamente a vida.
- source_word: חַסְדְּךָ
  choice: o teu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade duradoura, muitas vezes no âmbito de uma aliança. “Amor leal” é claro e preserva essa amplitude sem limitar o termo apenas a misericórdia.
- source_word: שְׂפָתַי
  choice: meus lábios
  rationale: Conserva a imagem corporal concreta e a dicção poética do hebraico.
- source_word: יְשַׁבְּחוּנְךָ
  choice: te louvarão
  rationale: Expressa com naturalidade o piel de שׁבח e mantém a forma verbal prospectiva do texto.
theological_decisions:
- issue: Tradução de חֶסֶד em contexto de adoração
  choice: amor leal
  alternative: amor constante; amor de aliança; misericórdia
  rationale: “Amor leal” comunica afeto e fidelidade duradoura, preservando a possível dimensão de aliança sem transformar essa nuance contextual em explicitação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para leitores brasileiros. A imagem poética de “lábios” e a relação causal entre as duas orações foram preservadas.
