  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: pt
  text: Assim te bendirei enquanto eu viver[a]; em teu nome levantarei as mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu te louvarei”. O hebraico diz mais literalmente: “eu te bendirei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Funciona adverbialmente e liga o compromisso deste versículo ao reconhecimento anterior do amor leal de Deus; “Assim” preserva a relação de consequência de modo natural e digno.
- source_word: אֲבָרֶכְךָ
  choice: te bendirei
  rationale: O piel de ברך significa normalmente “bendizer”. Quando dirigido a Deus, “bendizer” mantém com clareza a linguagem de culto do hebraico, sem substituí-la pela interpretação mais ampla “louvar”.
- source_word: בְחַיָּי
  choice: enquanto eu viver
  rationale: 'Embora a forma seja literalmente “em minha vida”, no contexto tem sentido durativo: durante toda a vida do salmista.'
- source_word: בְּשִׁמְךָ
  choice: em teu nome
  rationale: Preserva a amplitude da preposição ב, que pode indicar esfera, fundamento ou invocação, e soa natural em português.
- source_word: אֶשָּׂא
  choice: levantarei
  rationale: נשא significa levantar ou erguer; com “mãos”, descreve o gesto reconhecível de oração e adoração.
- source_word: כַפָּי
  choice: as mãos
  rationale: כף pode designar especificamente a palma, mas, nesta expressão, “mãos” transmite de modo idiomático o gesto completo.
theological_decisions:
- issue: Linguagem de culto dirigida a Deus em ברך
  choice: Manter “bendirei” no texto principal.
  alternative: “Eu te louvarei.”
  rationale: O verbo hebraico é ברך, “bendizer”. A tradução preserva essa formulação concreta e teologicamente rica, enquanto registra em nota a alternativa interpretativa mais familiar.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira e compreensão internacional. O pronome “te” conserva a forma direta e poética da oração; “enquanto eu viver” comunica naturalmente o valor durativo do hebraico.
