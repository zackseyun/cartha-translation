  text: מִזְמ֥וֹר לְ/דָוִ֑ד בִּ֝/הְיוֹת֗/וֹ בְּ/מִדְבַּ֥ר יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: pt
  text: Salmo de Davi[a], quando ele estava no deserto[b] de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Davi” ou “para Davi”. No título hebraico, “de Davi” pode indicar autoria, dedicação, pertencimento ou associação.
    reason: alternative_reading
  - marker: b
    text: Ou “na região desértica” ou “no ermo”. O termo hebraico pode designar de modo amplo uma região desértica ou não cultivada.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Salmo
  rationale: É o termo técnico tradicional e preciso para este gênero de composição poética e litúrgica.
- source_word: לְדָוִד
  choice: de Davi
  rationale: A preposição לְ nos títulos dos salmos pode indicar autoria, pertencimento, dedicação ou associação. “De Davi” é natural em português e evita restringir o sentido a uma única relação.
- source_word: בִּהְיוֹתוֹ
  choice: quando ele estava
  rationale: A construção com בְּ, o infinitivo de היה e o sufixo pronominal forma uma oração temporal. A explicitação de “ele” torna clara e natural a referência a Davi.
- source_word: בְּמִדְבַּר
  choice: no deserto
  rationale: מִדְבָּר pode designar deserto, região árida, ermo ou território não cultivado. “Deserto” é corrente, compreensível e adequado à designação geográfica, enquanto a nota preserva a amplitude lexical.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa estabelecida do nome próprio da região e do território tribal.
theological_decisions:
- issue: Sentido da atribuição davídica no título
  choice: Manter “de Davi”, sem afirmar especificamente autoria.
  alternative: “por Davi” ou “para Davi”
  rationale: O hebraico não determina por si só se o título indica autoria, dedicação, pertencimento ou associação. A tradução conserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com formulação tradicional sem arcaísmo. “Deserto de Judá” mantém a designação geográfica reconhecível; as notas registram tanto a ambiguidade da atribuição davídica quanto a amplitude de מִדְבָּר.
