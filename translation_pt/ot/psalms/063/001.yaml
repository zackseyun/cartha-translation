  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: pt
  text: Deus, tu és o meu Deus; eu te busco ao amanhecer.[a] Minha alma tem sede de ti, minha carne anseia por ti, numa terra seca e exausta, sem água.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu te busco cedo”, “eu te busco com diligência” ou, de modo mais interpretativo, “eu te busco com fervor”. O verbo hebraico evoca literalmente a busca ao amanhecer.
    reason: lexical_alternative
  - marker: b
    text: A expressão “numa terra seca e exausta, sem água” também pode ser entendida como ligada mais diretamente a “minha carne anseia por ti”.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים אֵלִי אַתָּה
  choice: Deus, tu és o meu Deus
  rationale: Preserva a invocação direta e a ênfase do pronome independente, sem acrescentar uma interjeição ausente no hebraico.
- source_word: אֲשַׁחֲרֶךָּ
  choice: eu te busco ao amanhecer
  rationale: Mantém a imagem temporal do verbo no piel, ligada à busca desde a aurora, sem reduzi-la apenas a diligência ou fervor.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Minha alma tem sede de ti
  rationale: Conserva a metáfora da sede e o termo poético 'alma', em paralelo com 'carne'.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: minha carne anseia por ti
  rationale: Traduz a intensa aspiração expressa pelo verbo e preserva literalmente 'carne', evitando achatar o paralelismo como simples referência ao corpo.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: numa terra seca e exausta
  rationale: Preserva a personificação poética da terra, descrita tanto pela aridez quanto pelo esgotamento.
- source_word: בְּלִי מָיִם
  choice: sem água
  rationale: Tradução concisa e natural da expressão privativa hebraica.
theological_decisions:
- issue: Linguagem antropológica no paralelo נֶפֶשׁ / בָּשָׂר
  choice: Manter 'minha alma' e 'minha carne' como dimensões poéticas da pessoa inteira
  alternative: Traduzir 'todo o meu ser' e 'meu corpo'
  rationale: O paralelismo hebraico reúne a dimensão interior e a corporal sem exigir um dualismo rígido; conservar os dois termos mantém a tensão literária e teológica.
- issue: Alcance da expressão locativa 'numa terra seca e exausta, sem água'
  choice: Pontuar de modo que a expressão possa abranger tanto a sede da alma quanto o anseio da carne
  alternative: Ligá-la sintaticamente apenas ao anseio da carne
  rationale: A sequência poética permite que o cenário de aridez enquadre todo o clamor precedente; a vírgula evita restringir silenciosamente seu alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes ('tu', 'te', 'ti'). A formulação conserva o caráter poético, a imagem da aurora e o paralelismo entre alma e carne.
