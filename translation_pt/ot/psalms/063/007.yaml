base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: pt
  text: Pois tu foste o meu auxílio, e à sombra das tuas asas canto de alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dou gritos de alegria». O verbo hebraico pode indicar tanto um brado jubiloso e sonoro quanto um canto de alegria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da resposta do salmista no contexto e preserva de modo natural a relação causal.
- source_word: הָיִיתָ
  choice: tens sido
  rationale: O qatal aponta para o auxílio de Deus já experimentado e ainda relevante; o pretérito perfeito composto comunica essa continuidade em português.
- source_word: עֶזְרָתָה לִּי
  choice: o meu auxílio
  rationale: Expressa de forma idiomática a ajuda pessoal recebida, mantendo o substantivo concreto do hebraico.
- source_word: וּבְצֵל
  choice: e à sombra
  rationale: Conserva a imagem bíblica de abrigo e proteção sem reduzi-la a uma explicação abstrata.
- source_word: כְּנָפֶיךָ
  choice: das tuas asas
  rationale: Preserva literalmente a metáfora poética e protetora das asas divinas.
- source_word: אֲרַנֵּן
  choice: canto de alegria
  rationale: O piel de רנן pode indicar canto jubiloso ou um brado sonoro de alegria; esta escolha mantém tanto a expressão vocal quanto o júbilo.
theological_decisions:
- issue: Metáfora da proteção divina
  choice: Manter literalmente «à sombra das tuas asas».
  alternative: Explicitar como «sob a tua proteção».
  rationale: A imagem concreta comunica abrigo divino e faz parte da textura poética e teológica do salmo; explicá-la no corpo do texto estreitaria sua força evocativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Auxílio» conserva o valor substantivo e o tom poético; «tu» corresponde ao tratamento singular do hebraico. A formulação mantém o paralelismo e a metáfora original.
