  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: pt
  text: Eles serão entregues ao poder da espada[b]; tornar-se-ão porção das raposas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”. O hebraico שֻׁעָלִים pode referir-se a raposas, embora alguns entendam aqui um termo mais amplo para canídeos, especialmente neste contexto de morte e desolação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, seguindo mais de perto o hebraico: “Eles o derramarão pela mão da espada; tornar-se-ão porção das raposas”. A primeira oração traz um objeto singular (“o”), enquanto a segunda usa um verbo plural; a tradução principal expressa o sentido contextual.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: eles serão entregues
  rationale: 'A forma hebraica é literalmente ativa, com sujeito plural não expresso e objeto masculino singular: “eles o farão escorrer/derramarão”. No contexto, porém, os inimigos do versículo anterior são as vítimas, e a oração seguinte retoma-os no plural. A construção passiva comunica esse sentido em português corrente sem criar a impressão de que os executores se tornarão quinhão das raposas; a forma mais literal é preservada em nota.'
- source_word: עַל יְדֵי חָרֶב
  choice: ao poder da espada
  rationale: A expressão indica entrega à agência ou ao domínio mortífero da espada. “Ao poder da espada” conserva a imagem e combina naturalmente com a voz passiva escolhida.
- source_word: מְנָת
  choice: quinhão
  rationale: מְנָת designa porção ou parte atribuída. “Quinhão” preserva essa ideia distributiva e mantém o tom poético e digno do salmo.
- source_word: שֻׁעָלִים
  choice: raposas
  rationale: שׁוּעָלִים normalmente pode designar raposas, embora “chacais” seja possível, sobretudo em cenário de morte e desolação; a alternativa é registrada em nota.
- source_word: יִהְיוּ
  choice: tornar-se-ão
  rationale: O verbo היה pode significar “ser” ou “tornar-se”. Aqui indica o estado resultante da morte pela espada, por isso “tornar-se-ão” é adequado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com ampla legibilidade brasileira. “Quinhão” conserva a metáfora de uma porção atribuída sem recorrer a uma paráfrase como “alimento”. A inversão pronominal em “tornar-se-ão” sustenta o registro digno sem obscurecer o sentido.
