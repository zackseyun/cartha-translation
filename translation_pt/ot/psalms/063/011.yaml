  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: pt
  text: Mas o rei se alegrará em Deus; todo aquele que jurar por ele[a] se gloriará[b], pois a boca dos que proferem mentiras será fechada.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “ele” refere-se mais naturalmente a Deus no contexto; também se poderia entendê-lo, gramaticalmente, como referência ao rei.
    reason: ambiguity
  - marker: b
    text: 'Ou: “se vangloriará” ou “exultará com honra”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “será fechada a boca dos que falam falsidade”.
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Mas o rei
  rationale: A conjunção וְ pode significar simplesmente “e”, mas aqui introduz um contraste com o destino dos inimigos no versículo anterior. “Mas” expressa naturalmente essa relação discursiva.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: se alegrará em Deus
  rationale: O imperfeito qal de שׂמח indica a alegria futura ou resultante, e a preposição בְּ apresenta Deus como objeto ou fundamento dessa alegria.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: todo aquele que jurar por ele
  rationale: A construção participial designa cada pessoa que invoca alguém ao prestar juramento. “Jurar por” é a expressão corrente em português, e o pronome refere-se mais naturalmente a Deus no contexto.
- source_word: יִתְהַלֵּל
  choice: se gloriará
  rationale: O hitpael de הלל pode indicar gloriar-se, exultar ou vangloriar-se. “Se gloriará” conserva tanto a ideia de exultação honrosa quanto a possível nuance de ostentação, sem forçar uma conotação negativa.
- source_word: יִסָּכֵר פִּי
  choice: a boca ... será fechada
  rationale: O nifal de סכר significa ser fechado ou bloqueado. A formulação mantém a imagem hebraica e o singular coletivo “boca”.
- source_word: דֹבְרֵי שָׁקֶר
  choice: os que proferem mentiras
  rationale: A expressão participial descreve pessoas caracterizadas por falar falsidade. “Proferem mentiras” preserva essa nuance verbal em linguagem digna e compreensível.
theological_decisions:
- issue: Identidade do rei
  choice: Manter “o rei” sem identificação adicional.
  alternative: Identificá-lo explicitamente como Davi ou como o rei messiânico.
  rationale: O versículo diz apenas “o rei”. Embora o título do salmo forneça um contexto davídico e possam existir leituras canônicas ou messiânicas, a tradução não deve inserir uma identificação que o próprio versículo não explicita.
- issue: Referente do pronome em “jurar por ele”
  choice: Entender que o pronome se refere a Deus, preservando-o na tradução.
  alternative: Entender que o pronome se refere ao rei.
  rationale: Deus é o antecedente explícito mais próximo, e jurar por Deus é uma expressão bíblica estabelecida. A forma pronominal, contudo, conserva no texto traduzido a estrutura do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução mantém o paralelismo, o singular coletivo da imagem hebraica e a ambiguidade pronominal sem acrescentar uma interpretação denominacional.
