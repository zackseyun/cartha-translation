  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: pt
  text: Minha alma se satisfaz como com gordura e fartura[a], e minha boca te louva com lábios de júbilo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha alma se satisfará como com alimento rico e farto”.'
    reason: 'Alternativa lexical e temporal: a imagem hebraica é literalmente de “gordura e fartura”, e os verbos poéticos também podem ser entendidos no futuro.'
  - marker: b
    text: 'Mais literalmente: “com lábios de júbilos” ou “com lábios de aclamações alegres”.'
    reason: A expressão hebraica pode designar cantos, gritos ou aclamações de alegria.
lexical_decisions:
- source_word: כְּמוֹ
  choice: como com
  rationale: Introduz uma comparação; a construção mantém a imagem de alguém saciado por alimento rico.
- source_word: חֵלֶב וָדֶשֶׁן
  choice: gordura e fartura
  rationale: Preserva o primeiro termo concreto e expressa no segundo a ideia sobreposta de riqueza, abundância e alimento substancioso, evitando a repetição pouco natural “gordura e gordura”.
- source_word: תִּשְׂבַּע
  choice: se satisfaz
  rationale: O imperfeito poético pode descrever uma experiência presente ou habitual, embora também admita sentido futuro; a nota registra essa possibilidade.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Mantém a linguagem poética e antropológica do hebraico; neste contexto, refere-se ao ser interior ou à própria pessoa.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: com lábios que cantam de alegria
  rationale: Comunica naturalmente a ideia de lábios que expressam júbilo por meio de canto ou aclamação, preservando a imagem corporal.
- source_word: יְהַלֶּל פִּי
  choice: minha boca te louva
  rationale: Conserva “minha boca” como sujeito. O objeto “te” é implícito no hebraico e é suprido naturalmente porque o salmo se dirige diretamente a Deus.
theological_decisions:
- issue: Objeto implícito do louvor
  choice: “minha boca te louva”
  alternative: “minha boca louva”
  rationale: Embora o objeto não esteja expresso nesta oração hebraica, Deus é claramente o destinatário no contexto imediato; explicitar “te” produz português natural sem acrescentar uma afirmação teológica nova.
- issue: Valor temporal dos imperfeitos poéticos
  choice: 'Presente: “se satisfaz” e “louva”'
  alternative: 'Futuro: “se satisfará” e “louvará”'
  rationale: As formas hebraicas permitem leitura presente, habitual ou futura. O presente comunica bem a experiência viva do salmista, enquanto a nota preserva a alternativa futura.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira e compreensão internacional. A imagem concreta de riqueza alimentar foi preservada sem usar vocabulário arcaico; a expressão literal menos natural sobre os lábios foi vertida de modo idiomático e esclarecida em nota.
