  text: לְ֭מַעַן בֵּית יְהוָ֣ה אֱלֹהֵ֑י/נוּ אֲבַקְשָׁ֖ה ט֣וֹב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: pt
  text: Por amor à casa de Yahweh, nosso Deus, buscarei o seu bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “buscarei o seu bem-estar” ou “buscarei prosperidade para você”. O hebraico “bem” se refere aqui ao bem-estar de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Por amor a
  rationale: Expressa o motivo da ação de modo natural e digno em português; aqui significa agir em consideração à casa de Yahweh.
- source_word: בֵּית
  choice: casa de
  rationale: Mantém a imagem literal hebraica, embora no contexto se refira ao templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo de primeira pessoa do plural.
- source_word: אֲבַקְשָׁה
  choice: buscarei
  rationale: O coortativo expressa propósito ou resolução pessoal; o futuro em português comunica adequadamente essa determinação.
- source_word: טוֹב
  choice: bem
  rationale: Preserva a amplitude de טוֹב e, neste contexto, aponta para o bem-estar de Jerusalém sem restringi-lo apenas à prosperidade material.
- source_word: לָךְ
  choice: seu
  rationale: O sufixo feminino singular retoma Jerusalém, personificada e diretamente interpelada; 'o seu bem' é idiomático em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva a expressão hebraica “casa de Yahweh” e a referência feminina singular a Jerusalém.
