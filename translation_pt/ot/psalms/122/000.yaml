  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: pt
  text: 'Cântico das Subidas.[a] De Davi.


    Alegrei-me quando me disseram:

    “Vamos à casa de Yahweh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Título hebraico: “Cântico das Subidas”, provavelmente relacionado a peregrinações ou a uma coleção litúrgica; também pode ser entendido como “cântico das ascensões”.'
    reason: cultural_note
  - marker: b
    text: Yahweh representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cântico das Subidas
  rationale: Reproduz de modo claro o título hebraico tradicional, preservando sua possível relação com peregrinações e com uma coleção litúrgica.
- source_word: שָׂמַחְתִּי בְּאֹמְרִים לִי
  choice: Alegrei-me quando me disseram
  rationale: Expressa naturalmente em português o perfeito hebraico e a construção temporal com o infinitivo; mantém a referência plural e indefinida de אֹמְרִים.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a designação cultual 'casa' e translitera o nome divino, em vez de substituí-lo silenciosamente por um título.
- source_word: נֵלֵךְ
  choice: Vamos
  rationale: O coortativo plural expressa convite ou resolução conjunta; 'Vamos' é a forma idiomática e direta em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração torna visível que o texto hebraico emprega o nome próprio divino. A nota registra a convenção portuguesa tradicional sem impor uma leitura denominacional.
- issue: Sentido do título הַמַּעֲלוֹת
  choice: Subidas
  alternative: peregrinações / ascensões
  rationale: A tradução formal preserva a amplitude semântica do título, enquanto a nota explica suas associações prováveis sem escolher definitivamente entre elas.
translation_notes:
  register: Português moderno, corrente e digno, com paralelismo poético simples. “Cântico” conserva o registro dos títulos dos salmos; “Vamos” comunica de modo natural o convite coletivo do hebraico.
