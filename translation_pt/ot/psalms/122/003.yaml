lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הַבְּנוּיָה
  choice: construída
  rationale: O particípio passivo de בנה descreve Jerusalém como já edificada; “construída” preserva esse sentido resultativo sem introduzir a ideia não expressa de reconstrução.
- source_word: כְּעִיר
  choice: como uma cidade
  rationale: A preposição כ marca comparação; a formulação portuguesa mantém o valor comparativo e soa natural.
- source_word: שֶׁחֻבְּרָה
  choice: unida
  rationale: A forma passiva de חבר indica algo ligado ou ajuntado. “Unida” comunica com clareza a coesão estrutural da cidade.
- source_word: לָּהּ
  choice: em si mesma
  rationale: O sufixo feminino retoma a cidade. Neste contexto, “em si mesma” expressa a ligação interna sem forçar uma relação externa.
- source_word: יַחְדָּו
  choice: toda unida
  rationale: O advérbio reforça a ideia de união conjunta. “Toda” junto de “unida” reproduz essa ênfase de maneira idiomática em português.
