  text: לְ֭מַעַן אַחַ֣/י וְ/רֵעָ֑/י אֲדַבְּרָה נָּ֖א שָׁל֣וֹם בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: pt
  text: 'Em favor dos meus irmãos e companheiros, direi agora[a]: “Haja paz[b] em você!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A partícula hebraica também pode ter sentido de apelo: “direi, por favor”.'
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode incluir as ideias de bem-estar, plenitude e prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Por causa de
  rationale: Expressa a motivação do salmista de modo claro e natural, sem reduzir a expressão a mera causalidade mecânica.
- source_word: אַחַי
  choice: meus irmãos
  rationale: Mantém o plural masculino do hebraico e seu sentido de parentes ou membros do mesmo povo.
- source_word: וְרֵעָי
  choice: e companheiros
  rationale: רֵעַ pode designar amigo, companheiro, associado ou próximo; “companheiros” combina bem com o paralelismo e o contexto comunitário.
- source_word: אֲדַבְּרָה
  choice: direi
  rationale: O cohortativo expressa decisão ou disposição de falar; diante do conteúdo citado, “direi” é mais idiomático em português do que “falarei”.
- source_word: נָּא
  choice: agora
  rationale: A partícula pode acrescentar imediatismo ou apelo. “Agora” se integra naturalmente à declaração de propósito, enquanto a possibilidade de súplica é preservada em nota.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a equivalência tradicional e concisa, preservando a amplitude semântica de bem-estar, integridade e prosperidade.
- source_word: בָּךְ
  choice: em você
  rationale: O sufixo feminino singular dirige a fala a Jerusalém. “Em você” preserva a personificação e soa natural no português moderno.
theological_decisions:
- issue: Termo de parentesco marcado por gênero
  choice: meus irmãos
  alternative: meus parentes; meus irmãos e irmãs
  rationale: O hebraico apresenta o plural masculino de “irmão”. A tradução mantém essa forma sem ampliar explicitamente o referente além do que o texto diz.
- issue: Destinatária da bênção
  choice: 'Jerusalém é interpelada diretamente: “Haja paz em você!”'
  alternative: Que haja paz nela; Paz dentro de seus muros
  rationale: O sufixo de segunda pessoa feminina singular retoma Jerusalém e sustenta a personificação poética. A tradução evita substituir a segunda pessoa por terceira pessoa ou acrescentar “muros”.
- issue: Força da frase nominal שָׁלוֹם בָּךְ
  choice: Haja paz em você!
  alternative: Paz em você; Que a paz esteja em você
  rationale: O hebraico não traz verbo expresso. “Haja” comunica em português a força natural de desejo ou bênção sem transformar a frase em simples descrição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “direi agora” evita solenidade excessiva; “em você” mantém a interpelação direta de Jerusalém sem recorrer ao pronome regional “tu”. Os marcadores [a] e [b] aparecem junto aos termos correspondentes.
