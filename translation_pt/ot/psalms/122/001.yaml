  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: pt
  text: 'Cântico das subidas.[a] De Davi.


    Alegrei-me quando me disseram:


    “Vamos à casa de Yahweh!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Título hebraico: “Cântico das subidas”, provavelmente relacionado a peregrinações ou a uma coleção litúrgica; também pode ser traduzido como “Cântico dos que sobem”.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: Traduz diretamente o substantivo hebraico como designação digna de uma composição cantada, sem recorrer ao termo mais interpretativo “salmo”.
- source_word: הַמַּעֲלוֹת
  choice: das subidas
  rationale: Conserva o sentido concreto e a ambiguidade do título fixo hebraico, que pode estar ligado a peregrinações, procissões litúrgicas ou atos de subir.
- source_word: לְדָוִד
  choice: De Davi
  rationale: Mantém em português a flexibilidade da preposição ל nos títulos dos salmos, sem afirmar de modo exclusivo autoria, dedicação ou associação.
- source_word: שָׂמַחְתִּי
  choice: Alegrei-me
  rationale: Expressa de maneira natural e viva o perfeito na primeira pessoa, preservando a alegria experimentada pelo salmista.
- source_word: בְּאֹמְרִים לִי
  choice: quando me disseram
  rationale: Representa idiomaticamente o valor temporal da construção e incorpora o objeto indireto לִי com fluidez em português.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a construção hebraica e verte explicitamente o nome divino, conforme a orientação do projeto.
- source_word: נֵלֵךְ
  choice: Vamos
  rationale: Em discurso direto, o presente hortativo português comunica naturalmente o convite inclusivo da forma hebraica de primeira pessoa do plural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação de Davi com o salmo em לְדָוִד
  choice: De Davi
  alternative: Por Davi; Para Davi
  rationale: “De Davi” deixa aberta a relação exata indicada pela preposição hebraica, evitando decidir indevidamente entre autoria, dedicação e pertencimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cântico” mantém o tom poético do cabeçalho; “Vamos” soa natural como convite coletivo. A disposição em linhas distingue o título e a fala poética.
