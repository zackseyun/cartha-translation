lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para a importância de Jerusalém no contexto imediato, preservando a força causal ou explicativa sem torná-la excessivamente específica.
- source_word: שָׁמָּה
  choice: ali
  rationale: Retoma Jerusalém, mencionada nos versos anteriores, com uma forma locativa natural em português.
- source_word: יָשְׁבוּ
  choice: estão estabelecidos
  rationale: O verbo significa literalmente “sentar-se” ou “habitar”; tendo “tronos” como sujeito, comunica que eles estão postos e exercem função institucional. A nota preserva a imagem verbal literal.
- source_word: כִסְאוֹת
  choice: tronos
  rationale: Designa assentos de autoridade régia e judicial, não simples cadeiras ou assentos comuns.
- source_word: לְמִשְׁפָּט
  choice: para o julgamento
  rationale: Expressa a finalidade judicial dos tronos. מִשְׁפָּט também pode significar “justiça”, alternativa preservada em nota.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: tronos da casa de Davi
  rationale: Identifica os tronos com a dinastia davídica de modo natural em português. A preposição לְ também permite a leitura “para a casa de Davi”, registrada em nota.
theological_decisions:
- issue: Natureza da referência davídica
  choice: Referência aos tronos régios e judiciais associados à dinastia de Davi em Jerusalém.
  alternative: Referência genérica aos tribunais civis de Jerusalém ou explicitação de uma leitura messiânica tipológica.
  rationale: O hebraico menciona expressamente os “tronos” e a “casa de Davi”. A tradução conserva o sentido histórico e dinástico sem inserir na linha principal uma interpretação messiânica mais ampla.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A formulação principal privilegia naturalidade sem apagar a imagem hebraica, preservada em nota.
