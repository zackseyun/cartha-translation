source:
  edition: WLC
  text: שַׁ֭אֲלוּ שְׁל֣וֹם יְרוּשָׁלִָ֑ם יִ֝שְׁלָ֗יוּ אֹהֲבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/006.yaml
  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: pt
  text: 'Orem pela paz de Jerusalém: prosperem os que amam você.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Peçam a paz de Jerusalém”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “vivam tranquilos os que amam você”; também é possível: “os que amam você prosperarão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Orem pela
  rationale: Embora o verbo signifique literalmente “peçam”, com o substantivo abstrato “paz” e neste contexto litúrgico, “orem pela” comunica naturalmente o pedido dirigido a Deus em favor de Jerusalém.
- source_word: שְׁלוֹם
  choice: paz
  rationale: O termo abrange paz, bem-estar e integridade; “paz” é natural, tradicional e adequado ao contexto imediato.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: יִשְׁלָיוּ
  choice: prosperem
  rationale: O verbo pode indicar viver em tranquilidade, segurança ou prosperidade. “Prosperem” preserva essa amplitude de modo conciso, sem limitar o sentido à riqueza material; a forma optativa acompanha o tom de oração.
- source_word: אֹהֲבָיִךְ
  choice: os que amam você
  rationale: Preserva a referência aos que amam Jerusalém e o tratamento direto da cidade pelo sufixo feminino singular, em linguagem amplamente compreensível.
theological_decisions:
- issue: Força do segundo hemistíquio
  choice: 'Desejo ou oração: “prosperem os que amam você”'
  alternative: 'Declaração ou promessa: “os que amam você prosperarão”'
  rationale: O imperfeito hebraico poético admite valor volitivo ou indicativo. Depois do imperativo “Orem”, o desejo se encaixa naturalmente no tom litúrgico, sem transformar a frase de modo indevido numa promessa incondicional; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O pronome “você” torna explícito que Jerusalém é interpelada diretamente. A inversão “prosperem os que...” mantém o tom poético e evita a possível leitura inicial de “que” como conjunção.
