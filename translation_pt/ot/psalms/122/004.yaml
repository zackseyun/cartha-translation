  text: שֶׁ/שָּׁ֨ם עָל֪וּ שְׁבָטִ֡ים שִׁבְטֵי יָ֭הּ עֵד֣וּת לְ/יִשְׂרָאֵ֑ל לְ֝/הֹד֗וֹת לְ/שֵׁ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: pt
  text: 'Ali subiram as tribos,

    as tribos de Jah[a],

    como testemunho para Israel,

    para dar graças ao nome do SENHOR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jah” é a forma abreviada do nome divino em hebraico.
    reason: A forma é pouco comum no português moderno; a nota esclarece sua função e a distingue do tetragrama, traduzido por «SENHOR» no fim do versículo.
lexical_decisions:
- source_word: עָלוּ (ʿālû)
  choice: subiram
  rationale: O perfeito hebraico é traduzido naturalmente no passado e mantém a imagem da subida a Jerusalém.
- source_word: שִׁבְטֵי יָהּ (šivṭê Yāh)
  choice: as tribos de Já
  rationale: Preserva a forma abreviada do nome divino usada no hebraico, distinguindo-a do tetragrama no fim do versículo.
- source_word: עֵדוּת לְיִשְׂרָאֵל (ʿēdût leyiśrāʾēl)
  choice: como testemunho para Israel
  rationale: 'Mantém a formulação e a tensão semântica do hebraico: pode evocar tanto um testemunho dirigido a Israel quanto uma prescrição vinculante para Israel.'
- source_word: לְהֹדוֹת (lehōdôt)
  choice: para dar graças
  rationale: 'Expressa o sentido contextual do verbo ידה no hifil: agradecer ou louvar publicamente.'
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o tetragrama, em versaletes representadas aqui por maiúsculas.
theological_decisions:
- issue: Relação de עֵדוּת com Israel
  choice: como testemunho para Israel
  alternative: segundo a ordenança dada a Israel
  rationale: A alternativa explicita uma leitura jurídica plausível, mas o texto hebraico não contém um termo separado para “ordenança” nem especifica “dada”; a tradução escolhida preserva a ambiguidade.
- issue: Representação de יָהּ e יהוה no mesmo versículo
  choice: Já para יָהּ e SENHOR para יהוה
  alternative: SENHOR em ambos os casos
  rationale: A distinção reproduz as duas formas do nome divino presentes no hebraico sem lhes atribuir diferença teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem poética e o paralelismo foram preservados; “Ali” retoma com naturalidade o lugar mencionado no contexto, e “subiram” mantém o aspecto verbal do hebraico.
