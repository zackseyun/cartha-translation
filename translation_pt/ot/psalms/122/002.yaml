  text: Nossos pés estão de pé nos teus portões, Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossos pés estavam de pé nos teus portões, Jerusalém”. O hebraico emprega um particípio com o perfeito do verbo “ser/estar”; a construção pode ser entendida como referência a uma situação passada ou presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדוֹת הָיוּ
  choice: estão parados
  rationale: A construção perifrástica com particípio e היה descreve um estado de estar em pé. No contexto do cântico de peregrinação, o presente expressa de modo natural a chegada já realizada e a posição atual dos peregrinos.
- source_word: רַגְלֵינוּ
  choice: nossos pés
  rationale: Tradução direta do plural com sufixo de primeira pessoa, preservando a imagem concreta dos peregrinos que chegaram à cidade.
- source_word: בִּשְׁעָרַיִךְ
  choice: dentro dos seus portões
  rationale: A preposição בְּ pode indicar localização em ou dentro dos portões. Esta formulação comunica que os peregrinos já entraram no espaço das portas da cidade, sem reduzir a expressão a mera proximidade externa.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
