review_pass:
  verdict: revise
  source_fidelity: 'A tradução de עֹמְדוֹת הָיוּ como “estão parados” não é adequada: em português, “parados” tende a significar imóveis ou interrompidos, não simplesmente “em pé”. A perífrase hebraica, particípio de עמד com o perfeito de היה, descreve os pés em posição de pé e admite matiz passado ou presente conforme a leitura contextual. “Em/ nos teus portões” conserva melhor o sentido locativo amplo de בְּ do que “dentro dos”.'
  naturalness: “Nossos pés estão de pé” é uma formulação clara, idiomática e poética em português contemporâneo. “Teus” evita a ambiguidade de “seus” numa fala dirigida diretamente a Jerusalém. A vírgula antes de “Jerusalém” assinala adequadamente o vocativo.
  terminology: “Jerusalém” é a forma portuguesa estabelecida. Não há termo teológico técnico a ajustar.
  issues:
  - severity: medium
    issue: “Estão parados” traduz inadequadamente o particípio עֹמְדוֹת.
    rationale: עמד significa estar de pé/estar colocado; “parado” introduz a ideia de cessação de movimento ou imobilidade, que não está expressa no hebraico.
  - severity: low
    issue: “Dentro dos seus portões” é mais restritivo e “seus” pode ser ambíguo.
    rationale: A preposição בְּ permite “em/nos”; “teus” deixa explícita a relação com Jerusalém, que é diretamente interpelada.
  - severity: low
    issue: A nota alternativa repete “parados” e explica de modo impreciso a construção verbal.
    rationale: A alternativa deve preservar “de pé”, e a explicação deve identificar o perfeito de היה sem impor uma única leitura temporal.
