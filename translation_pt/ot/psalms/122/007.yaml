  yaml_path: translation/ot/psalms/122/007.yaml
  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
translation:
  language: pt
  text: Haja paz dentro das tuas muralhas[a] e tranquilidade[b] nas tuas fortalezas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em tuas fortificações”. O termo hebraico pode designar a muralha, o baluarte ou o perímetro defensivo de uma cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “segurança”, “bem-estar” ou “prosperidade”. O termo hebraico indica uma condição tranquila e segura.
    reason: lexical_alternative
  - marker: c
    text: Ou “palácios” ou “cidadelas”. O termo hebraico pode designar tanto residências palacianas quanto estruturas fortificadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Haja
  rationale: O jussivo de היה expressa desejo ou oração; “Haja” preserva essa força optativa de modo natural e digno em português.
- source_word: שָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם pode abranger paz, bem-estar e integridade; “paz” é a correspondência mais direta neste pedido por Jerusalém.
- source_word: בְּחֵילֵךְ
  choice: dentro das suas muralhas
  rationale: חֵיל designa aqui a estrutura defensiva ou o perímetro fortificado da cidade. “Muralhas” é claro e específico, e “dentro de” explicita o valor locativo de בְּ.
- source_word: שַׁלְוָה
  choice: tranquilidade
  rationale: שַׁלְוָה denota quietude, sossego e bem-estar seguro. “Tranquilidade” preserva esse sentido sem reduzir o termo apenas à prosperidade material.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: nas suas fortalezas
  rationale: אַרְמוֹן pode indicar palácio ou cidadela fortificada. “Fortalezas” se ajusta ao paralelismo urbano e defensivo, sem eliminar a alternativa arquitetônica indicada em nota.
