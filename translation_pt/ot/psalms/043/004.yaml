  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: pt
  text: Então irei ao altar de Deus, a Deus — a alegria do meu regozijo[a] —; e te louvarei com a lira[b], ó Deus, meu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais tradicional, “a minha maior alegria”. O hebraico diz literalmente “a alegria do meu regozijo”, combinando duas palavras relacionadas à alegria para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: Ou “harpa”. O hebraico kinnor designa um antigo instrumento de cordas, provavelmente mais semelhante a uma lira.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Então irei
  rationale: A forma volitiva de primeira pessoa, após as súplicas anteriores, expressa o resultado pretendido ou a resolução do salmista. “Então irei” comunica com naturalidade essa sequência em português.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: ao altar de Deus
  rationale: Reproduz com clareza e solenidade a cadeia construta hebraica.
- source_word: אֶל אֵל
  choice: a Deus
  rationale: Aqui אֵל funciona como título divino em paralelo com אֱלֹהִים. “Deus” evita criar uma distinção que o contexto não exige.
- source_word: שִׂמְחַת גִּילִי
  choice: a alegria do meu regozijo
  rationale: O hebraico combina dois termos próximos relacionados à alegria, intensificando a expressão. A formulação portuguesa mantém essa duplicação poética sem reduzi-la silenciosamente a “minha maior alegria”.
- source_word: וְאוֹדְךָ
  choice: e te louvarei
  rationale: O verbo pode significar agradecer ou louvar. O contexto de culto acompanhado por instrumento musical favorece “louvar”.
- source_word: בְכִנּוֹר
  choice: com a lira
  rationale: כִּנּוֹר designa um antigo instrumento de cordas provavelmente mais semelhante a uma lira do que à harpa moderna.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: ó Deus, meu Deus
  rationale: A interjeição vocativa “ó” torna natural em português a invocação direta e preserva a repetição e a devoção pessoal.
theological_decisions:
- issue: Tradução dos títulos divinos repetidos אֱלֹהִים e אֵל
  choice: Traduzir ambos como “Deus”, preservando a repetição.
  alternative: Diferenciar אֵל como “Deus poderoso” ou transliterá-lo como “El”.
  rationale: O paralelismo poético emprega designações divinas para o mesmo referente, sem estabelecer necessariamente uma distinção doutrinária entre nomes ou atributos.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conserva-se a repetição poética do hebraico e usa-se “lira” pela maior precisão histórica.
