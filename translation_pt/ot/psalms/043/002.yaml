source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: pt
  text: Pois tu és o Deus do meu refúgio[a]; por que me rejeitaste? Por que ando de luto[b] sob a opressão do inimigo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Deus da minha fortaleza” ou “o Deus da minha força”. O substantivo hebraico pode indicar refúgio, fortaleza ou força, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “ando sombrio”. O hebraico fala literalmente de andar “escurecido”, expressão que, neste contexto, comunica tristeza ou luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o apelo do salmista e mantém a ligação argumentativa com o contexto.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: o Deus do meu refúgio
  rationale: Preserva a relação construta do hebraico e a imagem de Deus como fonte ou lugar de proteção, sem restringir o substantivo apenas à força física.
- source_word: לָמָה
  choice: por que
  rationale: Mantém a interrogação direta e sua repetição, essencial à força poética da lamentação.
- source_word: זְנַחְתָּנִי
  choice: me rejeitaste
  rationale: Expressa com clareza a ideia de repelir ou lançar fora, sem ampliá-la indevidamente para abandono absoluto.
- source_word: קֹדֵר
  choice: de luto
  rationale: Comunica de modo natural o uso idiomático de estar escurecido ou sombrio como expressão visível de tristeza e lamentação.
- source_word: אֶתְהַלֵּךְ
  choice: ando
  rationale: Representa a ação ou condição contínua indicada pela forma verbal, com linguagem portuguesa direta e natural.
- source_word: בְּלַחַץ
  choice: sob a opressão
  rationale: Traduz לַחַץ como pressão opressiva e entende a preposição como circunstância sob a qual o salmista vive.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: Mantém o adversário singular e definido apresentado no texto hebraico.
theological_decisions:
- issue: Linguagem de rejeição divina na lamentação
  choice: por que me rejeitaste?
  alternative: por que me abandonaste? / por que me lançaste fora?
  rationale: Conserva a queixa direta do salmista e a tensão da aparente rejeição divina, sem suavizá-la nem convertê-la em afirmação de abandono definitivo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “por que” preserva o ritmo da lamentação; “ando de luto” torna explícito o sentido idiomático, enquanto a nota registra a imagem hebraica.
