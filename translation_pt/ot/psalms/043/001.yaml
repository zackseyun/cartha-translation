base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: pt
  text: Faze-me justiça, ó Deus, e defende a minha causa contra uma nação infiel[a]; livra-me do homem enganador e injusto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma nação ímpia”; literalmente, “uma nação não fiel/leal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Faze-me justiça
  rationale: No contexto de uma súplica judicial, o imperativo pede que Deus julgue em favor do salmista. A expressão comunica vindicação sem sugerir mera avaliação.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O vocativo explícito preserva o caráter direto da oração em português natural e digno.
- source_word: וְרִיבָה רִיבִי
  choice: e defende a minha causa
  rationale: O verbo e o substantivo cognato formam uma expressão jurídica. Esta formulação mantém a imagem forense e soa natural em português.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: contra uma nação infiel
  rationale: No quadro jurídico, a preposição indica a parte adversária. A negação de חָסִיד descreve falta de fidelidade ou lealdade, dimensão preservada por “infiel”.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: do homem enganador e injusto
  rationale: Os substantivos abstratos caracterizam o homem por engano e injustiça; os adjetivos dão uma forma clara e concisa, preservando o singular.
- source_word: תְפַלְּטֵנִי
  choice: livra-me
  rationale: O piel de פלט expressa fazer alguém escapar ou colocá-lo a salvo. “Livra-me” é corrente no registro bíblico português e mantém a urgência da súplica.
theological_decisions:
- issue: Sentido de חָסִיד na expressão negativa
  choice: infiel
  alternative: sem lealdade; ímpia
  rationale: חָסִיד está relacionado à fidelidade, devoção e lealdade. “Infiel” conserva a dimensão relacional e ética sem restringir indevidamente o termo; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência própria de oração. “Faze-me justiça” e “defende a minha causa” preservam o cenário jurídico; “livra-me” mantém concisão e solenidade sem arcaísmo excessivo.
