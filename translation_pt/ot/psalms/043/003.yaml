  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: pt
  text: Envia a tua luz e a tua verdade[a]; que elas me guiem e me levem ao teu santo monte e às tuas moradas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a tua fidelidade». O termo hebraico pode indicar verdade, confiabilidade ou fidelidade.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega uma forma plural; tradicionalmente, «teus tabernáculos».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Envia
  rationale: O imperativo de שלח pede que Deus faça sair sua luz e sua verdade. «Envia» é natural, direto e preserva o apelo poético.
- source_word: אוֹרְךָ
  choice: a tua luz
  rationale: Mantém a imagem concreta de אוֹר, sem reduzi-la interpretativamente a orientação ou salvação.
- source_word: אֲמִתְּךָ
  choice: a tua verdade
  rationale: אֱמֶת abrange verdade, confiabilidade e fidelidade. «Verdade» é a correspondência mais direta; a alternativa contextual é registrada em nota.
- source_word: הֵמָּה יַנְחוּנִי
  choice: que elas me guiem
  rationale: O pronome enfático e o verbo no plural retomam «luz» e «verdade». A construção volitiva «que elas» preserva sua personificação e concorda naturalmente com ambos os substantivos em português.
- source_word: יְבִיאוּנִי
  choice: me levem
  rationale: O hifil de בוא expressa condução até um destino. «Levem» evita repetição pesada e comunica claramente o movimento rumo à presença divina.
- source_word: הַר קָדְשְׁךָ
  choice: teu santo monte
  rationale: Tradução idiomática da construção «monte da tua santidade», sem explicitar Sião além do que diz o hebraico.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: tuas moradas
  rationale: Preserva o plural hebraico e emprega linguagem moderna e digna, sem o caráter arcaico ou excessivamente técnico de «tabernáculos».
theological_decisions:
- issue: Tratar «luz» e «verdade» como atributos abstratos ou agentes personificados
  choice: 'Preservar a personificação mediante o sujeito plural «elas»: «que elas me guiem e me levem».'
  alternative: Explicitar a ideia como a orientação salvadora de Deus, sem personificação.
  rationale: O hebraico emprega pronome e verbos no plural retomando a luz e a verdade; conservar essa estrutura mantém a força poética e a ambiguidade da imagem.
- issue: Identificar explicitamente o monte e as moradas como Sião e o templo
  choice: Manter «teu santo monte» e «tuas moradas».
  alternative: Traduzir interpretativamente como «Sião» e «teu santuário».
  rationale: Embora Sião e o santuário sejam referentes prováveis, o texto usa expressões poéticas mais amplas, que não devem ser estreitadas na tradução principal.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento em segunda pessoa singular («tua», «teu») conserva o tom direto de oração; «santo monte» mantém a dicção bíblico-poética sem soar obscuro. A repetição de «que elas» antes do segundo verbo foi evitada para dar fluidez, sem perder o sujeito plural personificado.
