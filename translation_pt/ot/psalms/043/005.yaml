lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: está abatida
  rationale: O verbo descreve estar encurvado, rebaixado ou deprimido. “Abatida” é natural em português e mantém tanto a imagem de rebaixamento quanto o sentido emocional.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Aqui נֶפֶשׁ designa o eu interior ao qual o salmista se dirige. “Minha alma” preserva a forma poética e continua clara no português atual.
- source_word: תֶּהֱמִי
  choice: se agita
  rationale: O verbo expressa tumulto, inquietação ou comoção. “Se agita” comunica de modo conciso o distúrbio interior.
- source_word: עָלַי
  choice: dentro de mim
  rationale: Embora a preposição seja literalmente “sobre mim”, neste contexto de autoexortação ela indica a agitação experimentada no interior do salmista.
- source_word: הוֹחִילִי
  choice: Espere
  rationale: O imperativo exorta a alma a aguardar com esperança e expectativa. “Espere em Deus” transmite essa confiança paciente de modo idiomático.
- source_word: לֵאלֹהִים
  choice: em Deus
  rationale: Com o verbo הוחיל, a preposição introduz aquele em quem se deposita a expectativa; “em Deus” é a construção natural em português.
- source_word: עוֹד
  choice: ainda
  rationale: O advérbio aponta para o louvor futuro apesar da aflição presente.
- source_word: אוֹדֶנּוּ
  choice: o louvarei
  rationale: O hifil de ידה pode significar louvar ou dar graças. No contexto do salmo, “louvar” expressa adequadamente a confissão pública de Deus.
- source_word: יְשׁוּעוֹת
  choice: a salvação
  rationale: O plural hebraico pode ter força abstrata ou intensiva. O singular português é natural e conserva a ideia de livramento sem introduzir uma interpretação mais específica.
- source_word: פָּנַי
  choice: meu semblante
  rationale: O termo significa literalmente “meu rosto”. “Semblante” preserva a imagem concreta e, no contexto do abatimento, também sugere a expressão exterior do estado interior.
- source_word: וֵאלֹהָי
  choice: e o meu Deus
  rationale: Mantém a conjunção e a confissão pessoal do texto massorético sem fundir a expressão anterior em uma paráfrase.
