- issue: Sentido e relação sintática de יְשׁוּעוֹת פָּנַי וֵאלֹהָי
  choice: a salvação do meu semblante e o meu Deus
  alternative: 'aquele que restaura o meu semblante, o meu Deus; ou: minha salvação e meu Deus'
